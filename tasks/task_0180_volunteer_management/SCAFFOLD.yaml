# =============================================================================
# Volunteer Management — seed tables (Expert)
# Scenario 180: opportunity/shift signup, background-check tier, hour
# logging/verification, skill matching, waiver/training prerequisite,
# recognition milestone, no-show tracking, group/corporate event.
#
# Topology: FLAT — every entity is a peer collection under /vm with foreign-key
# body fields and filtered-list GETs (no nested URL ownership chains).
# =============================================================================

scenario: "180. Volunteer Management: opportunity/shift signup, background-check tier, hour logging/verification, skill matching, waiver/training prerequisite, recognition milestone, no-show tracking, group/corporate event"

domain_name: volunteer-management
api_prefix: /vm

complexity_profile:
  primary_archetype: quota_allocation        # finite shift capacity reserved/committed/released
  secondary_archetype: compliance_audit       # bg-check tier + waiver/training prerequisite gating
  complexity_layers:
    - optimistic_concurrency                  # OCC on Shift.version (capacity) and Volunteer.version (bg-tier)
    - cascading_side_effects                  # shift cancel -> signup cancel -> seat release -> reliability recompute -> milestone re-eval
    - dual_variant_calculation                # provisional vs verified hours on Signup
    - rate_threshold_triggers                 # reliability-score suspension threshold; milestone tier breakpoints

  entity_topology: flat                        # peer entities under /vm linked by FK body fields, no nested ownership URLs
  state_machine_shape: parallel                # Opportunity carries publication_status x staffing_status; Signup/BackgroundCheck add cycles
  relationship_patterns:
    - one_to_many                              # Org->Volunteer, Opportunity->Shift, Shift->Signup
    - many_to_many                             # Volunteer<->Skill via VolunteerSkill; Volunteer<->Waiver via WaiverAcceptance
    - cross_aggregate                          # Signup references Volunteer and Shift across aggregates
  role_model: peer_roles                       # Volunteer / ShiftCoordinator / ComplianceOfficer / CorporateSponsor own different surfaces
  consistency_model: immediate                 # all cascades atomic in the triggering request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Organization
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Nonprofit / host organization name" }
      - { name: reliability_suspension_threshold, type: integer, source: input, default: 40, description: "Reliability-score floor (0-100); a Volunteer scoring strictly below this is SUSPENDED from new signups" }
      - { name: no_show_strike_limit, type: integer, source: input, default: 3, description: "Lifetime NO_SHOW count at which a Volunteer is auto-SUSPENDED regardless of reliability score" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED; ARCHIVED blocks all child create operations", constraints: "enum: ACTIVE, ARCHIVED" }

  - name: Volunteer
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: full_name, type: string, source: input, description: "Volunteer display name" }
      - { name: email, type: string, source: input, description: "Login email; unique within organization_id over status IN {ACTIVE, SUSPENDED}", constraints: "unique within organization_id over status IN {ACTIVE, SUSPENDED}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED | WITHDRAWN; SUSPENDED blocks new signups, WITHDRAWN terminal", constraints: "enum: ACTIVE, SUSPENDED, WITHDRAWN" }
      - { name: bg_check_tier, type: enum, source: computed, default: "NONE", description: "Highest tier among CLEARED, non-EXPIRED BackgroundChecks: NONE < BASIC < STANDARD < ENHANCED", constraints: "enum: NONE, BASIC, STANDARD, ENHANCED" }
      - { name: lifetime_no_show_count, type: integer, source: computed, default: 0, description: "Count of this Volunteer's Signups currently in NO_SHOW state across all shifts" }
      - { name: total_verified_hours, type: number, source: computed, default: 0, description: "Sum of verified_hours over HOURS_VERIFIED Signups per calc milestone_total_hours" }
      - { name: reliability_score, type: integer, source: computed, default: 100, description: "0-100 weighted reliability per calc reliability_score; starts at 100" }
      - { name: milestone_tier, type: enum, source: computed, default: "NONE", description: "Recognition tier from total_verified_hours per calc milestone_tier: NONE < BRONZE < SILVER < GOLD < PLATINUM", constraints: "enum: NONE, BRONZE, SILVER, GOLD, PLATINUM" }

  - name: BackgroundCheck
    parent: Volunteer
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: requested_tier, type: enum, source: input, description: "Tier this check verifies: BASIC | STANDARD | ENHANCED", constraints: "enum: BASIC, STANDARD, ENHANCED" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | IN_PROGRESS | CLEARED | REJECTED | EXPIRED", constraints: "enum: INITIATED, IN_PROGRESS, CLEARED, REJECTED, EXPIRED" }
      - { name: cleared_at, type: datetime, source: system, description: "ISO-8601 UTC the check entered CLEARED; null until cleared" }
      - { name: valid_until, type: datetime, source: system, description: "ISO-8601 UTC; cleared_at + validity_days (calc bg_check_expiry); null until cleared" }
      - { name: validity_days, type: integer, source: input, default: 365, description: "Days the CLEARED tier remains valid before EXPIRED" }

  - name: Skill
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: code, type: string, source: input, description: "Short skill code, e.g. FIRST_AID; unique within organization_id", constraints: "unique within organization_id" }
      - { name: label, type: string, source: input, description: "Human-readable skill name" }

  - name: VolunteerSkill
    parent: Volunteer
    common_fields: false   # id, created_at only — immutable membership record
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: skill_id, type: string, source: input, description: "FK -> Skill.id" }
      - { name: proficiency, type: enum, source: input, default: "VERIFIED", description: "SELF_DECLARED | VERIFIED; only VERIFIED satisfies Opportunity skill requirements", constraints: "enum: SELF_DECLARED, VERIFIED" }

  - name: WaiverTemplate
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: code, type: string, source: input, description: "Waiver code, e.g. LIABILITY_2026; unique within organization_id", constraints: "unique within organization_id" }
      - { name: revision, type: integer, source: input, default: 1, description: "Revision number; an Opportunity pins a required revision and only acceptances of that exact revision satisfy it" }

  - name: WaiverAcceptance
    parent: Volunteer
    common_fields: false   # id, created_at only — append-only signature record
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: waiver_template_id, type: string, source: input, description: "FK -> WaiverTemplate.id" }
      - { name: accepted_revision, type: integer, source: system, description: "Snapshot of WaiverTemplate.revision at acceptance time" }

  - name: TrainingModule
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: code, type: string, source: input, description: "Training code, e.g. SAFETY_101; unique within organization_id", constraints: "unique within organization_id" }
      - { name: valid_days, type: integer, source: input, default: 730, description: "Days a TrainingCompletion stays valid before lapse for prerequisite checks" }

  - name: TrainingCompletion
    parent: Volunteer
    common_fields: false   # id, created_at only — append-only completion record
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: training_module_id, type: string, source: input, description: "FK -> TrainingModule.id" }
      - { name: completed_at, type: datetime, source: input, description: "ISO-8601 UTC completion timestamp" }
      - { name: expires_at, type: datetime, source: system, description: "ISO-8601 UTC; completed_at + module.valid_days" }

  - name: Opportunity
    parent: Organization
    common_fields: true
    fields:
      - { name: organization_id, type: string, source: input, description: "FK -> Organization.id" }
      - { name: title, type: string, source: input, description: "Opportunity title" }
      - { name: publication_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | CLOSED; one of two parallel state dimensions", constraints: "enum: DRAFT, PUBLISHED, CLOSED" }
      - { name: staffing_status, type: enum, source: computed, default: "UNDERSTAFFED", description: "UNDERSTAFFED | FULLY_STAFFED; compound from child Shift fill, second parallel dimension", constraints: "enum: UNDERSTAFFED, FULLY_STAFFED" }
      - { name: required_bg_tier, type: enum, source: input, default: "NONE", description: "Minimum Volunteer.bg_check_tier to sign up: NONE | BASIC | STANDARD | ENHANCED", constraints: "enum: NONE, BASIC, STANDARD, ENHANCED" }
      - { name: required_skill_ids, type: array, source: input, default: [], description: "Skill.id values a Volunteer must hold (VERIFIED) to sign up; empty means no skill gate" }
      - { name: required_waiver_template_id, type: string, source: input, default: null, description: "FK -> WaiverTemplate.id; null means no waiver gate" }
      - { name: required_training_module_id, type: string, source: input, default: null, description: "FK -> TrainingModule.id; null means no training gate" }
      - { name: is_group_event, type: boolean, source: input, default: false, description: "True if this Opportunity accepts CorporateGroup block registrations" }

  - name: Shift
    parent: Opportunity
    common_fields: true
    fields:
      - { name: opportunity_id, type: string, source: input, description: "FK -> Opportunity.id" }
      - { name: starts_at, type: datetime, source: input, description: "ISO-8601 UTC shift start" }
      - { name: ends_at, type: datetime, source: input, description: "ISO-8601 UTC shift end; must be strictly after starts_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum seat-occupying Signups; must be >= 1" }
      - { name: reserved_count, type: integer, source: computed, default: 0, description: "Count of this Shift's Signups occupying a seat (status IN {RESERVED, CONFIRMED, ATTENDED, HOURS_LOGGED, HOURS_VERIFIED})" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FULL | CANCELLED | COMPLETED; FULL is compound on reserved_count == capacity", constraints: "enum: OPEN, FULL, CANCELLED, COMPLETED" }
      - { name: group_reserved_seats, type: integer, source: computed, default: 0, description: "Seats held by ALLOCATED CorporateGroup blocks on this Shift, counted within reserved_count" }

  - name: Signup
    parent: Shift
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: input, description: "FK -> Shift.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: corporate_group_id, type: string, source: input, default: null, description: "FK -> CorporateGroup.id; set when created from a group block, else null" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | CONFIRMED | ATTENDED | HOURS_LOGGED | HOURS_VERIFIED | CANCELLED | NO_SHOW", constraints: "enum: RESERVED, CONFIRMED, ATTENDED, HOURS_LOGGED, HOURS_VERIFIED, CANCELLED, NO_SHOW" }
      - { name: logged_hours, type: number, source: input, default: null, description: "Self-reported hours submitted by the Volunteer at HOURS_LOGGED; null until logged" }
      - { name: verified_hours, type: number, source: computed, default: null, description: "Coordinator-verified hours per calc verified_hours; null until HOURS_VERIFIED" }
      - { name: provisional_hours, type: number, source: computed, default: 0, description: "Estimated hours from shift duration per calc provisional_hours, used before verification" }

  - name: CorporateGroup
    parent: Opportunity
    common_fields: true
    fields:
      - { name: opportunity_id, type: string, source: input, description: "FK -> Opportunity.id" }
      - { name: sponsor_name, type: string, source: input, description: "Corporate sponsor name" }
      - { name: requested_seats, type: integer, source: input, description: "Seats the sponsor wants to block on a target shift; must be >= 1" }
      - { name: target_shift_id, type: string, source: input, description: "FK -> Shift.id; the shift the block applies to" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | APPROVED | ALLOCATED | REJECTED | CANCELLED", constraints: "enum: PROPOSED, APPROVED, ALLOCATED, REJECTED, CANCELLED" }
      - { name: allocated_seat_count, type: integer, source: computed, default: 0, description: "Seats actually filled by group-member Signups created at ALLOCATE time" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: BackgroundCheck
    initial_state: INITIATED
    terminal_states: [REJECTED]
    transitions:
      - from: INITIATED
        to: IN_PROGRESS
        trigger: "POST /vm/background-checks/{checkId}/start"
        actor: ComplianceOfficer
        preconditions:
          - "BackgroundCheck.status == INITIATED (ERR_BG_CHECK_NOT_INITIATED)"
        side_effects: []
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /vm/background-checks/{checkId}/decide (decision == CLEARED)"
        actor: ComplianceOfficer
        preconditions:
          - "BackgroundCheck.status == IN_PROGRESS (ERR_BG_CHECK_NOT_IN_PROGRESS)"
          - "request decision == CLEARED"
        side_effects:
          - "Set cleared_at = current UTC clock"
          - "Set valid_until = cleared_at + validity_days*86400s (calc bg_check_expiry)"
          - "Recompute parent Volunteer.bg_check_tier as MAX tier over CLEARED non-EXPIRED checks (cross-entity bubble-up)"
          - "Increments Volunteer.version by 1"
      - from: IN_PROGRESS
        to: REJECTED
        trigger: "POST /vm/background-checks/{checkId}/decide (decision == REJECTED)"
        actor: ComplianceOfficer
        preconditions:
          - "BackgroundCheck.status == IN_PROGRESS (ERR_BG_CHECK_NOT_IN_PROGRESS)"
          - "request decision == REJECTED"
        side_effects:
          - "Recompute parent Volunteer.bg_check_tier (unchanged unless this was the sole source of a tier)"
          - "Increments Volunteer.version by 1"
      - from: CLEARED
        to: EXPIRED
        trigger: "system: on any signup-eligibility/read evaluation when current clock > valid_until"
        actor: system
        preconditions:
          - "current UTC clock > valid_until"
        side_effects:
          - "Recompute parent Volunteer.bg_check_tier over remaining CLEARED non-EXPIRED checks (cross-entity bubble-up; may lower tier)"
          - "Increments Volunteer.version by 1"
        note: "Lazy expiry evaluated at read/eligibility time using the §1.5 clock endpoint"
      - from: EXPIRED
        to: INITIATED
        trigger: "POST /vm/background-checks/{checkId}/renew"
        actor: ComplianceOfficer
        preconditions:
          - "BackgroundCheck.status == EXPIRED (ERR_BG_CHECK_NOT_EXPIRED)"
        side_effects:
          - "Clear cleared_at and valid_until"
        note: "Renewal cycle: EXPIRED -> INITIATED re-runs the check lifecycle"

  - entity: Opportunity
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Parallel dimensions: publication_status (this machine) evolves independently of computed staffing_status (UNDERSTAFFED<->FULLY_STAFFED, derived from child Shifts)."
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /vm/opportunities/{opportunityId}/publish"
        actor: ShiftCoordinator
        preconditions:
          - "Opportunity.publication_status == DRAFT (ERR_OPPORTUNITY_NOT_DRAFT)"
          - "Opportunity has >= 1 child Shift (ERR_OPPORTUNITY_HAS_NO_SHIFTS)"
        side_effects:
          - "Recompute staffing_status from child Shifts (calc staffing_status)"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /vm/opportunities/{opportunityId}/close"
        actor: ShiftCoordinator
        preconditions:
          - "Opportunity.publication_status == PUBLISHED (ERR_OPPORTUNITY_NOT_PUBLISHED)"
        side_effects:
          - "All child Shifts in {OPEN, FULL} -> CANCELLED (cascade down)"
          - "Each cancelled Shift cancels its seat-holding Signups (transitive cascade, see Shift OPEN->CANCELLED)"

  - entity: Shift
    initial_state: OPEN
    terminal_states: [CANCELLED, COMPLETED]
    note: "FULL is a compound state derived from reserved_count == capacity; OPEN<->FULL oscillates as Signups occupy/release seats."
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system: when a Signup occupies the last seat (reserved_count reaches capacity)"
        actor: system
        preconditions:
          - "reserved_count == capacity after the occupying signup"
        side_effects:
          - "Re-evaluate parent Opportunity.staffing_status (bubble-up; FULLY_STAFFED iff all non-CANCELLED child Shifts FULL/COMPLETED)"
      - from: FULL
        to: OPEN
        trigger: "system: when a seat is released (signup CANCELLED or NO_SHOW) and reserved_count < capacity"
        actor: system
        preconditions:
          - "reserved_count < capacity after the release"
        side_effects:
          - "Re-evaluate parent Opportunity.staffing_status (bubble-up)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /vm/shifts/{shiftId}/cancel OR cascade from Opportunity close"
        actor: ShiftCoordinator
        preconditions:
          - "Shift.status IN {OPEN, FULL} (ERR_SHIFT_NOT_CANCELLABLE)"
        side_effects:
          - "All seat-holding Signups (RESERVED, CONFIRMED) -> CANCELLED (cascade down); for each, release seat (no reliability penalty)"
          - "Any ALLOCATED CorporateGroup whose target_shift_id == this shift -> CANCELLED"
          - "Re-evaluate parent Opportunity.staffing_status (bubble-up)"
      - from: FULL
        to: CANCELLED
        trigger: "POST /vm/shifts/{shiftId}/cancel OR cascade from Opportunity close"
        actor: ShiftCoordinator
        preconditions:
          - "Shift.status IN {OPEN, FULL} (ERR_SHIFT_NOT_CANCELLABLE)"
        side_effects:
          - "Same cascade as OPEN -> CANCELLED"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /vm/shifts/{shiftId}/complete"
        actor: ShiftCoordinator
        preconditions:
          - "Shift.status IN {OPEN, FULL} (ERR_SHIFT_NOT_COMPLETABLE)"
          - "current UTC clock >= ends_at (ERR_SHIFT_NOT_ENDED)"
        side_effects:
          - "Each CONFIRMED Signup with no attendance decision -> NO_SHOW (cascade down; runs the no-show reliability cascade per signup)"
          - "Increments Shift.version by 1"
      - from: FULL
        to: COMPLETED
        trigger: "POST /vm/shifts/{shiftId}/complete"
        actor: ShiftCoordinator
        preconditions:
          - "Same as OPEN -> COMPLETED"
        side_effects:
          - "Same as OPEN -> COMPLETED"

  - entity: Signup
    initial_state: RESERVED
    terminal_states: [HOURS_VERIFIED, CANCELLED, NO_SHOW]
    note: "Has a revision cycle HOURS_LOGGED -> ATTENDED (reject hours) re-opening logging; plus branch ATTENDED/NO_SHOW."
    transitions:
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /vm/signups/{signupId}/confirm"
        actor: Volunteer
        preconditions:
          - "Signup.status == RESERVED (ERR_SIGNUP_NOT_RESERVED)"
          - "Acting Volunteer owns this Signup (ERR_NOT_SIGNUP_OWNER)"
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /vm/signups/{signupId}/cancel"
        actor: Volunteer
        preconditions:
          - "Signup.status IN {RESERVED, CONFIRMED} (ERR_SIGNUP_NOT_CANCELLABLE)"
          - "Acting Volunteer owns this Signup (ERR_NOT_SIGNUP_OWNER)"
        side_effects:
          - "Release seat: parent Shift.reserved_count -= 1; if Shift was FULL -> OPEN (cross-entity)"
          - "If Shift goes OPEN, parent Opportunity.staffing_status re-evaluated (transitive bubble-up)"
          - "Increments Shift.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /vm/signups/{signupId}/cancel"
        actor: Volunteer
        preconditions:
          - "Same as RESERVED -> CANCELLED"
        side_effects:
          - "Same seat-release + bubble-up cascade as RESERVED -> CANCELLED"
          - "Increments Shift.version by 1"
      - from: CONFIRMED
        to: ATTENDED
        trigger: "POST /vm/signups/{signupId}/check-in"
        actor: ShiftCoordinator
        preconditions:
          - "Signup.status == CONFIRMED (ERR_SIGNUP_NOT_CONFIRMED)"
          - "current UTC clock >= parent Shift.starts_at (ERR_SHIFT_NOT_STARTED)"
        side_effects:
          - "Set provisional_hours from shift duration (calc provisional_hours)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /vm/signups/{signupId}/mark-no-show OR cascade from Shift complete"
        actor: ShiftCoordinator
        preconditions:
          - "Signup.status == CONFIRMED (ERR_SIGNUP_NOT_CONFIRMED)"
        side_effects:
          - "Release seat: parent Shift.reserved_count -= 1; if Shift was FULL -> OPEN (cross-entity)"
          - "Volunteer.lifetime_no_show_count recomputed (+1); reliability_score recomputed (calc reliability_score)"
          - "If reliability_score < Organization.reliability_suspension_threshold OR lifetime_no_show_count >= no_show_strike_limit, Volunteer.status -> SUSPENDED (transitive cascade)"
          - "Increments Shift.version by 1; increments Volunteer.version by 1"
      - from: ATTENDED
        to: HOURS_LOGGED
        trigger: "POST /vm/signups/{signupId}/log-hours"
        actor: Volunteer
        preconditions:
          - "Signup.status == ATTENDED (ERR_SIGNUP_NOT_ATTENDED)"
          - "Acting Volunteer owns this Signup (ERR_NOT_SIGNUP_OWNER)"
          - "request logged_hours > 0 (ERR_INVALID_HOURS)"
          - "request logged_hours <= shift duration hours (ERR_HOURS_EXCEED_SHIFT)"
        side_effects:
          - "Store logged_hours"
      - from: HOURS_LOGGED
        to: HOURS_VERIFIED
        trigger: "POST /vm/signups/{signupId}/verify-hours"
        actor: ShiftCoordinator
        preconditions:
          - "Signup.status == HOURS_LOGGED (ERR_SIGNUP_NOT_LOGGED)"
        side_effects:
          - "Set verified_hours (calc verified_hours)"
          - "Volunteer.total_verified_hours recomputed (calc milestone_total_hours, cross-entity bubble-up)"
          - "Volunteer.reliability_score recomputed (calc reliability_score)"
          - "Volunteer.milestone_tier recomputed (calc milestone_tier); a tier increase is a recognition milestone (transitive: hours -> tier)"
          - "Increments Volunteer.version by 1"
      - from: HOURS_LOGGED
        to: ATTENDED
        trigger: "POST /vm/signups/{signupId}/reject-hours"
        actor: ShiftCoordinator
        preconditions:
          - "Signup.status == HOURS_LOGGED (ERR_SIGNUP_NOT_LOGGED)"
        side_effects:
          - "Clear logged_hours (back to null) so the Volunteer re-logs (revision cycle)"
        note: "Cycle edge: HOURS_LOGGED -> ATTENDED re-opens hour logging"

  - entity: CorporateGroup
    initial_state: PROPOSED
    terminal_states: [REJECTED, CANCELLED]
    note: "Group/corporate event block: a sponsor reserves a seat block, approved then allocated into concrete Signups."
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /vm/corporate-groups/{groupId}/approve"
        actor: ShiftCoordinator
        preconditions:
          - "CorporateGroup.status == PROPOSED (ERR_GROUP_NOT_PROPOSED)"
          - "parent Opportunity.is_group_event == true (ERR_OPPORTUNITY_NOT_GROUP_EVENT)"
          - "parent Opportunity.publication_status == PUBLISHED (ERR_OPPORTUNITY_NOT_PUBLISHED)"
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /vm/corporate-groups/{groupId}/reject"
        actor: ShiftCoordinator
        preconditions:
          - "CorporateGroup.status == PROPOSED (ERR_GROUP_NOT_PROPOSED)"
        side_effects: []
      - from: APPROVED
        to: ALLOCATED
        trigger: "POST /vm/corporate-groups/{groupId}/allocate"
        actor: ShiftCoordinator
        preconditions:
          - "CorporateGroup.status == APPROVED (ERR_GROUP_NOT_APPROVED)"
          - "target Shift.status == OPEN (ERR_SHIFT_NOT_OPEN)"
          - "target Shift remaining capacity (capacity - reserved_count) >= requested_seats (ERR_INSUFFICIENT_SHIFT_CAPACITY)"
        side_effects:
          - "Create requested_seats group-placeholder Signups on target Shift in RESERVED (corporate_group_id set); each occupies a seat"
          - "Shift.reserved_count += requested_seats; group_reserved_seats += requested_seats; if reserved_count reaches capacity, Shift -> FULL (cross-entity); bubble-up to Opportunity.staffing_status"
          - "Set allocated_seat_count = requested_seats"
          - "Increments Shift.version by requested_seats (one per created Signup)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /vm/corporate-groups/{groupId}/cancel"
        actor: CorporateSponsor
        preconditions:
          - "CorporateGroup.status IN {PROPOSED, APPROVED} (ERR_GROUP_NOT_CANCELLABLE)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /vm/corporate-groups/{groupId}/cancel"
        actor: CorporateSponsor
        preconditions:
          - "CorporateGroup.status IN {PROPOSED, APPROVED} (ERR_GROUP_NOT_CANCELLABLE)"
        side_effects: []
      - from: ALLOCATED
        to: CANCELLED
        trigger: "system: cascade when target Shift is cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "All group-placeholder Signups already cancelled by the Shift-cancel cascade"

# -----------------------------------------------------------------------------
# Concurrency Rules (§1.2.1) — true races only, OCC on parent.version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: signup-create-stale-shift
    parent_entity: Shift
    write_endpoint: "POST /vm/shifts/{shiftId}/signups"
    occ_field: "expected_shift_version"
    description: |
      Creating a Signup against a Shift whose version has advanced since the
      client last observed it is rejected. A new Signup legitimately occupies a
      seat and would itself succeed under natural semantics on a fresh read; the
      OCC stale-version check serializes seat occupation so the last seat cannot
      be handed out beyond capacity when the client's view of reserved_count is
      stale.
    error_id: ERR_STALE_SHIFT_VERSION
    http_status: 412
  - rule_id: bg-decide-stale-volunteer
    parent_entity: Volunteer
    write_endpoint: "POST /vm/background-checks/{checkId}/decide"
    occ_field: "expected_volunteer_version"
    description: |
      Deciding a BackgroundCheck (CLEARED/REJECTED) against a Volunteer whose
      version has advanced since the client last read it is rejected. Clearing a
      check recomputes the Volunteer's bg_check_tier; a stale view risks applying
      the decision on top of a tier the client never saw, so decide requires the
      last-observed Volunteer.version.
    error_id: ERR_STALE_VOLUNTEER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_hours
    trigger: "Signup CONFIRMED -> ATTENDED (check-in)"
    algorithm: threshold
    formula: |
      duration_hours = (Shift.ends_at - Shift.starts_at) in seconds / 3600
      provisional_hours = round_half_up(duration_hours, 2)
    input_set: "single Shift's scheduled interval"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_estimate
        when: "at check-in, before the Volunteer logs actual hours"
        difference: "uses the full scheduled shift duration as an upper-bound estimate"

  - name: verified_hours
    trigger: "Signup HOURS_LOGGED -> HOURS_VERIFIED (verify-hours)"
    algorithm: aggregation
    formula: |
      verified_hours = round_half_up( min(Signup.logged_hours, provisional_hours), 2 )
    input_set: "the single Signup's logged_hours capped by its provisional (scheduled) hours"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: verified_actual
        when: "at coordinator verification"
        difference: "DUAL-VARIANT vs provisional_hours on the SAME Signup: verified_hours caps logged at scheduled duration so it can be strictly less than provisional_hours; only verified_hours feeds total_verified_hours"
    note: "Dual-variant pair (provisional_hours vs verified_hours) on the Signup domain; contrast with reliability_score on the Volunteer domain."

  - name: reliability_score
    trigger: "Signup -> NO_SHOW, Signup -> HOURS_VERIFIED (recompute on each)"
    algorithm: weighted_scoring
    formula: |
      Let V = count of this Volunteer's Signups in HOURS_VERIFIED state.
      Let N = this Volunteer's lifetime_no_show_count (Signups currently NO_SHOW).
      total = V + N
      if total == 0:
        reliability_score = 100
      else:
        attendance_ratio = V / total
        raw = 100 * attendance_ratio - NO_SHOW_PENALTY * N
        reliability_score = clamp(round_half_up(raw, 0), 0, 100)   # integer, floor 0, ceiling 100
    input_set: "this Volunteer's Signups; HOURS_VERIFIED counts as kept, NO_SHOW counts as broken; all other statuses excluded"
    constants:
      NO_SHOW_PENALTY: 8
    precision: "integer, round_half_up then clamp [0,100]"
    note: "Risk/reliability domain on Volunteer (contrast with hours dual-variant on Signup). Combines a ratio with an additive per-no-show penalty: 3 inputs (V, N, penalty) with non-linear ratio+penalty interaction."

  - name: milestone_total_hours
    trigger: "Signup -> HOURS_VERIFIED (verify-hours)"
    algorithm: aggregation
    formula: |
      verified_signups = this Volunteer's Signups in HOURS_VERIFIED, ordered by Signup.created_at ASC.
      ROUNDING ORDER IS PINNED (round-per-line-item THEN sum):
        per_line = [ round_half_up(s.verified_hours, 2) for s in verified_signups ]
        total_verified_hours = round_half_up( sum(per_line), 2 )
    input_set: "Signups in HOURS_VERIFIED only; CANCELLED/NO_SHOW/HOURS_LOGGED/ATTENDED/CONFIRMED/RESERVED excluded"
    constants: {}
    precision: "2 decimal places, round_half_up; round-per-line-item-then-sum order is mandatory"
    note: "Combinatorial mode (b): per-line-item rounding before summation; 'sum then round' would diverge in cents."

  - name: milestone_tier
    trigger: "Signup -> HOURS_VERIFIED (after milestone_total_hours recompute)"
    algorithm: threshold
    formula: |
      h = Volunteer.total_verified_hours
      candidate = PLATINUM if h >= 500
                  else GOLD if h >= 200
                  else SILVER if h >= 100
                  else BRONZE if h >= 25
                  else NONE
      milestone_tier = max(current milestone_tier, candidate) by rank  # monotonic non-decreasing
    input_set: "Volunteer.total_verified_hours"
    constants:
      BRONZE_AT: 25
      SILVER_AT: 100
      GOLD_AT: 200
      PLATINUM_AT: 500
    precision: "exact; boundaries are inclusive lower bounds (>=)"
    note: "Tier breakpoints use >= (h==25.00 is BRONZE, h==24.99 is NONE). milestone_tier is monotonic non-decreasing and never drops even if hours later decrease."

  - name: bg_check_tier
    trigger: "BackgroundCheck CLEARED, EXPIRED; read-time eligibility evaluation"
    algorithm: aggregation
    formula: |
      eligible = this Volunteer's BackgroundChecks with status == CLEARED and current_clock <= valid_until
      rank: NONE=0 < BASIC=1 < STANDARD=2 < ENHANCED=3
      bg_check_tier = requested_tier with MAX rank among eligible; NONE if eligible is empty
    input_set: "CLEARED, non-EXPIRED BackgroundChecks of the Volunteer"
    constants: {}
    precision: "exact"
    note: "An Opportunity's required_bg_tier is satisfied iff rank(volunteer.bg_check_tier) >= rank(required_bg_tier)."

  - name: bg_check_expiry
    trigger: "BackgroundCheck IN_PROGRESS -> CLEARED"
    algorithm: aggregation
    formula: |
      cleared_at = current UTC clock at decide time
      valid_until = cleared_at + (validity_days * SECONDS_PER_DAY) seconds
    input_set: "single BackgroundCheck"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "ISO-8601 UTC, milliseconds"

  - name: staffing_status
    trigger: "Shift status change (FULL/OPEN/CANCELLED/COMPLETED), Opportunity publish"
    algorithm: aggregation
    formula: |
      considered = child Shifts with status IN {OPEN, FULL, COMPLETED}   # CANCELLED excluded
      if considered is empty: UNDERSTAFFED
      elif every shift in considered has status IN {FULL, COMPLETED}: FULLY_STAFFED
      else: UNDERSTAFFED
    input_set: "child Shifts of the Opportunity excluding CANCELLED"
    constants: {}
    precision: "exact"
    note: "Empty-set edge: an Opportunity with zero non-CANCELLED shifts is UNDERSTAFFED, not FULLY_STAFFED."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation (RBAC matrix)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource ids exist (volunteer, background-check, opportunity, shift, signup, corporate-group, ...) validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: business_referential
    check: "Body foreign keys (organization_id, volunteer_id, skill_id, waiver_template_id, training_module_id, shift_id, target_shift_id, required_*_id) reference existing entities in the same organization"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "create endpoints carrying FK body fields"

  - priority: 5
    category: state
    check: "Referenced Organization.status == ACTIVE for any child create operation"
    error_id: ERR_ORGANIZATION_ARCHIVED
    http_status: 409
    applies_to: "create volunteers/skills/opportunities/shifts/etc."

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "varies (ERR_SIGNUP_NOT_RESERVED, ERR_BG_CHECK_NOT_IN_PROGRESS, ERR_OPPORTUNITY_NOT_DRAFT, ...)"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 7
    category: business_constraint
    check: "Acting Volunteer.status == ACTIVE (SUSPENDED/WITHDRAWN cannot sign up)"
    error_id: ERR_VOLUNTEER_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /vm/shifts/{shiftId}/signups"

  - priority: 8
    category: business_temporal
    check: "Shift overlap: a Volunteer may not hold a seat-occupying Signup on two Shifts whose [starts_at, ends_at) half-open intervals overlap (touching endpoints do NOT overlap)"
    error_id: ERR_SHIFT_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /vm/shifts/{shiftId}/signups (individual signup)"

  - priority: 9
    category: business_safety
    check: "Background-check tier gate: rank(Volunteer.bg_check_tier) >= rank(Opportunity.required_bg_tier), lazy expiry applied against current clock"
    error_id: ERR_BG_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /vm/shifts/{shiftId}/signups"

  - priority: 10
    category: business_safety
    check: "Skill gate: for every Skill.id in Opportunity.required_skill_ids, the Volunteer has a VolunteerSkill with proficiency==VERIFIED for that skill"
    error_id: ERR_SKILL_REQUIREMENT_NOT_MET
    http_status: 403
    applies_to: "POST /vm/shifts/{shiftId}/signups"

  - priority: 11
    category: business_safety
    check: "Waiver prerequisite: if Opportunity.required_waiver_template_id set, the Volunteer has a WaiverAcceptance for that template with accepted_revision == template.revision"
    error_id: ERR_WAIVER_NOT_ACCEPTED
    http_status: 403
    applies_to: "POST /vm/shifts/{shiftId}/signups"

  - priority: 12
    category: business_safety
    check: "Training prerequisite: if Opportunity.required_training_module_id set, the Volunteer has a non-lapsed TrainingCompletion (current clock <= expires_at) for that module"
    error_id: ERR_TRAINING_NOT_COMPLETED
    http_status: 403
    applies_to: "POST /vm/shifts/{shiftId}/signups"

  - priority: 13
    category: business_constraint
    check: "Duplicate signup: the Volunteer has no existing seat-occupying Signup (RESERVED/CONFIRMED/ATTENDED/HOURS_LOGGED/HOURS_VERIFIED) on this same Shift"
    error_id: ERR_DUPLICATE_SIGNUP
    http_status: 409
    applies_to: "POST /vm/shifts/{shiftId}/signups"

  - priority: 14
    category: business_fiscal
    check: "Capacity: Shift.reserved_count < capacity (seat available) for an individual signup; for group allocate, remaining capacity >= requested_seats"
    error_id: ERR_SHIFT_FULL
    http_status: 409
    applies_to: "POST /vm/shifts/{shiftId}/signups, POST /vm/corporate-groups/{groupId}/allocate"

# =============================================================================
# Table 5: API Endpoint Table  (flat topology under /vm)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Organization ---
  - method: POST
    path: "/vm/organizations"
    description: "Create an organization"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 201
    input: [name, "reliability_suspension_threshold?", "no_show_strike_limit?"]
    output: Organization
    side_effects: ["status -> ACTIVE; version -> 1"]

  - method: GET
    path: "/vm/organizations"
    description: "List organizations"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator, CorporateSponsor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Organization[]"
    side_effects: []

  - method: GET
    path: "/vm/organizations/{orgId}"
    description: "Get an organization"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator, CorporateSponsor]
    code: 200
    input: []
    output: Organization
    side_effects: []

  - method: POST
    path: "/vm/organizations/{orgId}/archive"
    description: "Archive an organization (OCC; blocks child creates)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["expected_organization_version"]
    output: Organization
    side_effects: ["status -> ARCHIVED; increments Organization.version by 1"]

  # --- Volunteer ---
  - method: POST
    path: "/vm/volunteers"
    description: "Register a volunteer"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 201
    input: [organization_id, full_name, email]
    output: Volunteer
    side_effects: ["status -> ACTIVE; bg_check_tier NONE; reliability_score 100; milestone_tier NONE"]

  - method: GET
    path: "/vm/volunteers"
    description: "List volunteers (filter by organization_id / status)"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["organization_id?", "status?", "limit?", "offset?"]
    output: "Volunteer[]"
    side_effects: []

  - method: GET
    path: "/vm/volunteers/{volunteerId}"
    description: "Get a volunteer (lazy bg-tier expiry applied)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["lazy: any CLEARED BackgroundCheck past valid_until -> EXPIRED, bg_check_tier recomputed"]

  - method: POST
    path: "/vm/volunteers/{volunteerId}/withdraw"
    description: "Withdraw a volunteer (terminal; OCC)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["expected_volunteer_version"]
    output: Volunteer
    side_effects: ["status -> WITHDRAWN; increments Volunteer.version by 1"]

  # --- BackgroundCheck ---
  - method: POST
    path: "/vm/background-checks"
    description: "Initiate a background check at a requested tier"
    roles: [ComplianceOfficer]
    code: 201
    input: [volunteer_id, requested_tier, "validity_days?"]
    output: BackgroundCheck
    side_effects: ["status -> INITIATED"]

  - method: GET
    path: "/vm/background-checks"
    description: "List background checks (filter by volunteer_id / status)"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["volunteer_id?", "status?", "limit?", "offset?"]
    output: "BackgroundCheck[]"
    side_effects: []

  - method: GET
    path: "/vm/background-checks/{checkId}"
    description: "Get a background check"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: POST
    path: "/vm/background-checks/{checkId}/start"
    description: "Move check INITIATED -> IN_PROGRESS"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/vm/background-checks/{checkId}/decide"
    description: "Decide a check CLEARED/REJECTED (OCC on volunteer)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "expected_volunteer_version"]
    output: BackgroundCheck
    side_effects: ["CLEARED: set cleared_at/valid_until, recompute Volunteer.bg_check_tier, increments Volunteer.version by 1; REJECTED: recompute tier, increments Volunteer.version by 1"]

  - method: POST
    path: "/vm/background-checks/{checkId}/renew"
    description: "Renew an EXPIRED check back to INITIATED"
    roles: [ComplianceOfficer]
    code: 200
    input: ["validity_days?"]
    output: BackgroundCheck
    side_effects: ["status -> INITIATED; clear cleared_at/valid_until"]

  # --- Skill + VolunteerSkill ---
  - method: POST
    path: "/vm/skills"
    description: "Create a skill in the org catalog"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 201
    input: [organization_id, code, label]
    output: Skill
    side_effects: []

  - method: GET
    path: "/vm/skills"
    description: "List skills (filter by organization_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: "Skill[]"
    side_effects: []

  - method: GET
    path: "/vm/skills/{skillId}"
    description: "Get a skill"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: Skill
    side_effects: []

  - method: POST
    path: "/vm/volunteer-skills"
    description: "Grant a skill to a volunteer"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 201
    input: [volunteer_id, skill_id, "proficiency?"]
    output: VolunteerSkill
    side_effects: []

  - method: GET
    path: "/vm/volunteer-skills"
    description: "List volunteer-skill grants (filter by volunteer_id / skill_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["volunteer_id?", "skill_id?", "limit?", "offset?"]
    output: "VolunteerSkill[]"
    side_effects: []

  - method: GET
    path: "/vm/volunteer-skills/{volunteerSkillId}"
    description: "Get a volunteer-skill grant"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: VolunteerSkill
    side_effects: []

  # --- WaiverTemplate + WaiverAcceptance ---
  - method: POST
    path: "/vm/waiver-templates"
    description: "Create a waiver template"
    roles: [ComplianceOfficer]
    code: 201
    input: [organization_id, code, "revision?"]
    output: WaiverTemplate
    side_effects: []

  - method: GET
    path: "/vm/waiver-templates"
    description: "List waiver templates (filter by organization_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: "WaiverTemplate[]"
    side_effects: []

  - method: GET
    path: "/vm/waiver-templates/{waiverTemplateId}"
    description: "Get a waiver template"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: WaiverTemplate
    side_effects: []

  - method: POST
    path: "/vm/waiver-acceptances"
    description: "Volunteer accepts a waiver template (snapshots current revision)"
    roles: [Volunteer, ComplianceOfficer]
    code: 201
    input: [volunteer_id, waiver_template_id]
    output: WaiverAcceptance
    side_effects: ["accepted_revision := WaiverTemplate.revision at acceptance"]

  - method: GET
    path: "/vm/waiver-acceptances"
    description: "List waiver acceptances (filter by volunteer_id / waiver_template_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["volunteer_id?", "waiver_template_id?", "limit?", "offset?"]
    output: "WaiverAcceptance[]"
    side_effects: []

  - method: GET
    path: "/vm/waiver-acceptances/{waiverAcceptanceId}"
    description: "Get a waiver acceptance"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: WaiverAcceptance
    side_effects: []

  # --- TrainingModule + TrainingCompletion ---
  - method: POST
    path: "/vm/training-modules"
    description: "Create a training module"
    roles: [ComplianceOfficer]
    code: 201
    input: [organization_id, code, "valid_days?"]
    output: TrainingModule
    side_effects: []

  - method: GET
    path: "/vm/training-modules"
    description: "List training modules (filter by organization_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["organization_id?", "limit?", "offset?"]
    output: "TrainingModule[]"
    side_effects: []

  - method: GET
    path: "/vm/training-modules/{trainingModuleId}"
    description: "Get a training module"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: TrainingModule
    side_effects: []

  - method: POST
    path: "/vm/training-completions"
    description: "Record a volunteer's training completion"
    roles: [Volunteer, ComplianceOfficer]
    code: 201
    input: [volunteer_id, training_module_id, completed_at]
    output: TrainingCompletion
    side_effects: ["expires_at := completed_at + module.valid_days"]

  - method: GET
    path: "/vm/training-completions"
    description: "List training completions (filter by volunteer_id / training_module_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["volunteer_id?", "training_module_id?", "limit?", "offset?"]
    output: "TrainingCompletion[]"
    side_effects: []

  - method: GET
    path: "/vm/training-completions/{trainingCompletionId}"
    description: "Get a training completion"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: TrainingCompletion
    side_effects: []

  # --- Opportunity ---
  - method: POST
    path: "/vm/opportunities"
    description: "Create an opportunity (DRAFT)"
    roles: [ShiftCoordinator]
    code: 201
    input: [organization_id, title, "required_bg_tier?", "required_skill_ids?", "required_waiver_template_id?", "required_training_module_id?", "is_group_event?"]
    output: Opportunity
    side_effects: ["publication_status -> DRAFT; staffing_status UNDERSTAFFED"]

  - method: GET
    path: "/vm/opportunities"
    description: "List opportunities (filter by organization_id / publication_status / required_waiver_template_id / required_training_module_id)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator, CorporateSponsor]
    code: 200
    input: ["organization_id?", "publication_status?", "required_waiver_template_id?", "required_training_module_id?", "limit?", "offset?"]
    output: "Opportunity[]"
    side_effects: []

  - method: GET
    path: "/vm/opportunities/{opportunityId}"
    description: "Get an opportunity"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator, CorporateSponsor]
    code: 200
    input: []
    output: Opportunity
    side_effects: []

  - method: POST
    path: "/vm/opportunities/{opportunityId}/publish"
    description: "Publish an opportunity (DRAFT -> PUBLISHED)"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Opportunity
    side_effects: ["publication_status -> PUBLISHED; recompute staffing_status"]

  - method: POST
    path: "/vm/opportunities/{opportunityId}/close"
    description: "Close an opportunity (PUBLISHED -> CLOSED), cascade-cancel shifts"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Opportunity
    side_effects: ["publication_status -> CLOSED; cascade-cancel OPEN/FULL child Shifts -> their Signups"]

  # --- Shift ---
  - method: POST
    path: "/vm/shifts"
    description: "Create a shift under an opportunity"
    roles: [ShiftCoordinator]
    code: 201
    input: [opportunity_id, starts_at, ends_at, capacity]
    output: Shift
    side_effects: ["status -> OPEN; reserved_count 0; re-evaluate Opportunity.staffing_status"]

  - method: GET
    path: "/vm/shifts"
    description: "List shifts (filter by opportunity_id / status)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator, CorporateSponsor]
    code: 200
    input: ["opportunity_id?", "status?", "limit?", "offset?"]
    output: "Shift[]"
    side_effects: []

  - method: GET
    path: "/vm/shifts/{shiftId}"
    description: "Get a shift"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator, CorporateSponsor]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: POST
    path: "/vm/shifts/{shiftId}/cancel"
    description: "Cancel a shift, cascade-cancel its signups"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status -> CANCELLED; cascade-cancel seat-holding Signups + ALLOCATED groups; bubble-up staffing_status"]

  - method: POST
    path: "/vm/shifts/{shiftId}/complete"
    description: "Complete a shift (after ends_at); CONFIRMED-without-attendance -> NO_SHOW"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Shift
    side_effects: ["status -> COMPLETED; CONFIRMED signups -> NO_SHOW (reliability cascade); increments Shift.version by 1"]

  # --- Signup ---
  - method: POST
    path: "/vm/shifts/{shiftId}/signups"
    description: "Volunteer signs up for a shift (full eligibility chain; OCC on shift)"
    roles: [Volunteer]
    code: 201
    input: [volunteer_id, "expected_shift_version"]
    output: Signup
    side_effects: ["status -> RESERVED; Shift.reserved_count += 1; FULL on capacity; bubble-up; increments Shift.version by 1"]

  - method: GET
    path: "/vm/signups"
    description: "List signups (filter by shift_id / volunteer_id / corporate_group_id / status)"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["shift_id?", "volunteer_id?", "corporate_group_id?", "status?", "limit?", "offset?"]
    output: "Signup[]"
    side_effects: []

  - method: GET
    path: "/vm/signups/{signupId}"
    description: "Get a signup"
    roles: [Volunteer, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: []

  - method: POST
    path: "/vm/signups/{signupId}/confirm"
    description: "Volunteer confirms a reserved signup"
    roles: [Volunteer]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> CONFIRMED"]

  - method: POST
    path: "/vm/signups/{signupId}/cancel"
    description: "Volunteer cancels a signup, releasing the seat"
    roles: [Volunteer]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> CANCELLED; release seat; FULL->OPEN; bubble-up; increments Shift.version by 1"]

  - method: POST
    path: "/vm/signups/{signupId}/check-in"
    description: "Coordinator checks a confirmed volunteer in (after shift start)"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> ATTENDED; set provisional_hours"]

  - method: POST
    path: "/vm/signups/{signupId}/mark-no-show"
    description: "Coordinator marks a confirmed volunteer as no-show"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> NO_SHOW; release seat; reliability cascade; possible SUSPEND; increments Shift.version + Volunteer.version"]

  - method: POST
    path: "/vm/signups/{signupId}/log-hours"
    description: "Volunteer logs hours after attending"
    roles: [Volunteer]
    code: 200
    input: [logged_hours]
    output: Signup
    side_effects: ["status -> HOURS_LOGGED; store logged_hours"]

  - method: POST
    path: "/vm/signups/{signupId}/verify-hours"
    description: "Coordinator verifies logged hours"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> HOURS_VERIFIED; set verified_hours; recompute total_verified_hours, reliability_score, milestone_tier; increments Volunteer.version by 1"]

  - method: POST
    path: "/vm/signups/{signupId}/reject-hours"
    description: "Coordinator rejects logged hours (revision loop back to ATTENDED)"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: Signup
    side_effects: ["status -> ATTENDED; clear logged_hours"]

  # --- CorporateGroup ---
  - method: POST
    path: "/vm/corporate-groups"
    description: "Corporate sponsor proposes a group block on a target shift"
    roles: [CorporateSponsor, ShiftCoordinator]
    code: 201
    input: [opportunity_id, sponsor_name, requested_seats, target_shift_id]
    output: CorporateGroup
    side_effects: ["status -> PROPOSED"]

  - method: GET
    path: "/vm/corporate-groups"
    description: "List corporate groups (filter by opportunity_id / target_shift_id / status)"
    roles: [CorporateSponsor, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: ["opportunity_id?", "target_shift_id?", "status?", "limit?", "offset?"]
    output: "CorporateGroup[]"
    side_effects: []

  - method: GET
    path: "/vm/corporate-groups/{groupId}"
    description: "Get a corporate group"
    roles: [CorporateSponsor, ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: []
    output: CorporateGroup
    side_effects: []

  - method: POST
    path: "/vm/corporate-groups/{groupId}/approve"
    description: "Coordinator approves a proposed group"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: CorporateGroup
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/vm/corporate-groups/{groupId}/reject"
    description: "Coordinator rejects a proposed group"
    roles: [ShiftCoordinator]
    code: 200
    input: []
    output: CorporateGroup
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/vm/corporate-groups/{groupId}/allocate"
    description: "Coordinator allocates an approved group into seat-holding signups (OCC on shift)"
    roles: [ShiftCoordinator]
    code: 200
    input: ["expected_shift_version"]
    output: CorporateGroup
    side_effects: ["status -> ALLOCATED; create requested_seats group Signups; Shift.reserved_count += requested_seats; FULL on capacity; increments Shift.version by requested_seats"]

  - method: POST
    path: "/vm/corporate-groups/{groupId}/cancel"
    description: "Sponsor cancels a proposed/approved group"
    roles: [CorporateSponsor]
    code: 200
    input: []
    output: CorporateGroup
    side_effects: ["status -> CANCELLED"]

  # --- Test-driving clock control ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only: set the server's current UTC clock for time-gated transitions and lazy expiry"
    roles: [ComplianceOfficer, ShiftCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server current_clock := to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_SIGNUP_OWNER, http: 403, condition: "Acting Volunteer is not the owner of the target Signup" }

  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required input field is missing or has the wrong type" }

  # --- Not found ---
  - { id: ERR_ORGANIZATION_NOT_FOUND, http: 404, condition: "Organization not found" }
  - { id: ERR_VOLUNTEER_NOT_FOUND, http: 404, condition: "Volunteer not found" }
  - { id: ERR_BG_CHECK_NOT_FOUND, http: 404, condition: "BackgroundCheck not found" }
  - { id: ERR_SKILL_NOT_FOUND, http: 404, condition: "Skill not found" }
  - { id: ERR_WAIVER_TEMPLATE_NOT_FOUND, http: 404, condition: "WaiverTemplate not found" }
  - { id: ERR_TRAINING_MODULE_NOT_FOUND, http: 404, condition: "TrainingModule not found" }
  - { id: ERR_OPPORTUNITY_NOT_FOUND, http: 404, condition: "Opportunity not found" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "Shift not found" }
  - { id: ERR_SIGNUP_NOT_FOUND, http: 404, condition: "Signup not found" }
  - { id: ERR_GROUP_NOT_FOUND, http: 404, condition: "CorporateGroup not found" }

  # --- Org / volunteer state ---
  - { id: ERR_ORGANIZATION_ARCHIVED, http: 409, condition: "Organization is ARCHIVED; child create blocked" }
  - { id: ERR_VOLUNTEER_NOT_ELIGIBLE, http: 403, condition: "Volunteer is SUSPENDED or WITHDRAWN and cannot sign up" }

  # --- BackgroundCheck state ---
  - { id: ERR_BG_CHECK_NOT_INITIATED, http: 409, condition: "start requires BackgroundCheck.status == INITIATED" }
  - { id: ERR_BG_CHECK_NOT_IN_PROGRESS, http: 409, condition: "decide requires BackgroundCheck.status == IN_PROGRESS" }
  - { id: ERR_BG_CHECK_NOT_EXPIRED, http: 409, condition: "renew requires BackgroundCheck.status == EXPIRED" }
  - { id: ERR_INVALID_BG_DECISION, http: 400, condition: "decide decision must be CLEARED or REJECTED" }

  # --- Opportunity / shift state ---
  - { id: ERR_OPPORTUNITY_NOT_DRAFT, http: 409, condition: "publish requires Opportunity.publication_status == DRAFT" }
  - { id: ERR_OPPORTUNITY_NOT_PUBLISHED, http: 409, condition: "close / group approve requires Opportunity.publication_status == PUBLISHED" }
  - { id: ERR_OPPORTUNITY_HAS_NO_SHIFTS, http: 409, condition: "publish requires at least one child Shift" }
  - { id: ERR_OPPORTUNITY_NOT_GROUP_EVENT, http: 409, condition: "group approve requires Opportunity.is_group_event == true" }
  - { id: ERR_SHIFT_NOT_CANCELLABLE, http: 409, condition: "cancel requires Shift.status IN {OPEN, FULL}" }
  - { id: ERR_SHIFT_NOT_COMPLETABLE, http: 409, condition: "complete requires Shift.status IN {OPEN, FULL}" }
  - { id: ERR_SHIFT_NOT_ENDED, http: 409, condition: "complete requires current clock >= Shift.ends_at" }
  - { id: ERR_SHIFT_NOT_STARTED, http: 409, condition: "check-in requires current clock >= Shift.starts_at" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "group allocate requires target Shift.status == OPEN" }
  - { id: ERR_INVALID_SHIFT_TIMES, http: 400, condition: "Shift ends_at must be strictly after starts_at" }
  - { id: ERR_INVALID_CAPACITY, http: 400, condition: "Shift capacity must be >= 1" }

  # --- Signup state + eligibility ---
  - { id: ERR_SIGNUP_NOT_RESERVED, http: 409, condition: "confirm requires Signup.status == RESERVED" }
  - { id: ERR_SIGNUP_NOT_CONFIRMED, http: 409, condition: "check-in / mark-no-show requires Signup.status == CONFIRMED" }
  - { id: ERR_SIGNUP_NOT_ATTENDED, http: 409, condition: "log-hours requires Signup.status == ATTENDED" }
  - { id: ERR_SIGNUP_NOT_LOGGED, http: 409, condition: "verify-hours / reject-hours requires Signup.status == HOURS_LOGGED" }
  - { id: ERR_SIGNUP_NOT_CANCELLABLE, http: 409, condition: "cancel requires Signup.status IN {RESERVED, CONFIRMED}" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 409, condition: "Volunteer already holds a seat-occupying Signup on this Shift" }
  - { id: ERR_SHIFT_FULL, http: 409, condition: "Shift has no available seat (reserved_count == capacity) or remaining < requested_seats" }
  - { id: ERR_SHIFT_TIME_CONFLICT, http: 409, condition: "Volunteer has a seat-occupying Signup on a time-overlapping Shift" }
  - { id: ERR_INVALID_HOURS, http: 400, condition: "logged_hours must be > 0" }
  - { id: ERR_HOURS_EXCEED_SHIFT, http: 422, condition: "logged_hours exceeds the shift's scheduled duration" }

  # --- Prerequisite gates ---
  - { id: ERR_BG_TIER_INSUFFICIENT, http: 403, condition: "Volunteer.bg_check_tier rank < Opportunity.required_bg_tier rank" }
  - { id: ERR_SKILL_REQUIREMENT_NOT_MET, http: 403, condition: "Volunteer lacks a VERIFIED VolunteerSkill for a required skill" }
  - { id: ERR_WAIVER_NOT_ACCEPTED, http: 403, condition: "Volunteer has not accepted the required waiver template at its current revision" }
  - { id: ERR_TRAINING_NOT_COMPLETED, http: 403, condition: "Volunteer has no non-lapsed completion of the required training module" }

  # --- CorporateGroup state ---
  - { id: ERR_GROUP_NOT_PROPOSED, http: 409, condition: "approve/reject requires CorporateGroup.status == PROPOSED" }
  - { id: ERR_GROUP_NOT_APPROVED, http: 409, condition: "allocate requires CorporateGroup.status == APPROVED" }
  - { id: ERR_GROUP_NOT_CANCELLABLE, http: 409, condition: "cancel requires CorporateGroup.status IN {PROPOSED, APPROVED}" }
  - { id: ERR_INSUFFICIENT_SHIFT_CAPACITY, http: 409, condition: "target Shift remaining capacity < requested_seats at allocate" }
  - { id: ERR_INVALID_SEATS, http: 400, condition: "requested_seats must be >= 1" }

  # --- OCC ---
  - { id: ERR_STALE_SHIFT_VERSION, http: 412, condition: "expected_shift_version does not match current Shift.version" }
  - { id: ERR_STALE_VOLUNTEER_VERSION, http: 412, condition: "expected_volunteer_version does not match current Volunteer.version" }
  - { id: ERR_STALE_ORGANIZATION_VERSION, http: 412, condition: "expected_organization_version does not match current Organization.version" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Volunteer
    description: "A registered volunteer acting on their own profile, signups, waivers, training"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /vm/shifts/{shiftId}/signups — sign up for a shift (volunteer_id must equal X-User-ID)"
      - "POST /vm/signups/{signupId}/confirm — confirm own signup"
      - "POST /vm/signups/{signupId}/cancel — cancel own signup"
      - "POST /vm/signups/{signupId}/log-hours — log hours on own signup"
    shared_operations:
      - "POST /vm/waiver-acceptances — accept a waiver (shared with ComplianceOfficer)"
      - "POST /vm/training-completions — record training (shared with ComplianceOfficer)"
      - "GET endpoints on organizations/opportunities/shifts/skills/waivers/training/volunteer/signups"

  - name: ShiftCoordinator
    description: "Manages opportunities, shifts, attendance, hour verification, group allocation"
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/opportunities and /vm/shifts (create/publish/close/cancel/complete)"
      - "POST /vm/signups/{signupId}/check-in, mark-no-show, verify-hours, reject-hours"
      - "POST /vm/corporate-groups/{groupId}/approve, reject, allocate"
    shared_operations:
      - "POST /vm/organizations, /vm/volunteers, /vm/skills, /vm/volunteer-skills (shared with ComplianceOfficer)"
      - "POST /vm/corporate-groups — propose group (shared with CorporateSponsor)"
      - "GET endpoints"

  - name: ComplianceOfficer
    description: "Owns background checks, waivers, training catalog, volunteer lifecycle, org archive"
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/background-checks and start/decide/renew"
      - "POST /vm/waiver-templates, POST /vm/training-modules"
      - "POST /vm/volunteers/{volunteerId}/withdraw, POST /vm/organizations/{orgId}/archive"
    shared_operations:
      - "POST /vm/organizations, /vm/volunteers, /vm/skills, /vm/volunteer-skills (shared with ShiftCoordinator)"
      - "POST /vm/waiver-acceptances, POST /vm/training-completions (shared with Volunteer)"
      - "GET endpoints"

  - name: CorporateSponsor
    description: "Proposes and cancels corporate group event blocks"
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/corporate-groups/{groupId}/cancel — cancel own group"
    shared_operations:
      - "POST /vm/corporate-groups — propose group (shared with ShiftCoordinator)"
      - "GET endpoints on organizations/opportunities/shifts/corporate-groups"
