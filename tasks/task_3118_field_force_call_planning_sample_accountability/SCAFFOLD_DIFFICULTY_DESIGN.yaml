              payload: { employee_id: "E9201", full_name: "Cust Pat", hire_date: "2022-01-01T00:00:00Z", manager_rep_id: "${m_id}" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /field-force/territories/${t2}/representatives"
