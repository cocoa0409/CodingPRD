              as: IntakeAgent
              captures: { vpr: $.data.id }
          trigger:
            - call: "PATCH /api/vehicles/${vpr}"
              payload: { odometer_miles: 100000, condition_grade: "FAIR" }
              as: AuctionManager
              captures: { vpr_fmv: $.data.fmv_estimate_cents }
          assert:
            - "before the PATCH, Vehicle.${vpr}.fmv_estimate_cents == 123457"
            - "after the PATCH, Vehicle.${vpr}.fmv_estimate_cents == 68210"
            - "Vehicle.${vpr}.fmv_variant == POST_INSPECTION"
            - "Donation.${dpr}.fmv_estimate_cents == 68210"

