          - state_machines.DamageClaim.TRIAGED_to_DENIED
          - state_machines.DeliveryLoad.CLAIM_HOLD_to_DELIVERED
        distinguishing_aspect: |
          DamageClaim forks at TRIAGED into APPROVED_CREDIT (cap computed, settle
          issues credit) vs DENIED (no cap, no credit, no cascade); the join is the
          load's CLAIM_HOLD release, which requires ALL claims terminal — settling
          one while the other is open does not release the hold.
