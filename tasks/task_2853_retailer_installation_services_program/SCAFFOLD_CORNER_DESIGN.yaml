      - name: only_accepted_line_itemised_change_orders_feed_the_project_upcharge
        claim_type: input_set_filtering
        grounds:
          - calculations.project_total_due
          - calculations.change_order_upcharge
          - entities.Project.fields.change_order_upcharge_cents
          - entities.ChangeOrder.fields.origin
          - endpoints[POST /change-orders]
          - endpoints[POST /change-orders/{id}/decide]
        distinguishing_aspect: "Four change orders on one project price out at 31280, 4505, 3765 and 15582, but only the ACCEPTED CUSTOMER_REQUEST reaches Project.change_order_upcharge_cents: the ACCEPTED MEASUREMENT_VARIANCE is a disclosure, the DECLINED SITE_CONDITION is dead, and the DRAFT one is not yet in force."
        test_recipe:
          setup:
            - "Category FLOOR-LVP (rate 425, minimum_billable_units 150.00, measurement_required true, validity 45) in METRO-02 (multiplier 1.00, no permitted trades) and a 420.00-unit project: quoted 171020."
            - "The measurement completes at 500.00 units, a 19.05% variance, so the system auto-opens a MEASUREMENT_VARIANCE change order disclosing 202300 - 171020 = 31280."
            - "Each later change order is decided before the next is created, because CHANGE_PENDING -> MEASURED requires no other undecided change order to remain."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-LVP", name: "LVP Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: true, measurement_validity_days: 45, permit_policy: "BY_JURISDICTION", deposit_pct: 0.30, status: "ACTIVE" }
