scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ttp_max_floor_30pct_vs_10pct_gross
        grounds:
          - calculations.ttp_calculation
          - entities.Household.fields.adjusted_annual_income_cents
          - entities.HapContract.fields.total_tenant_payment_cents
        distinguishing_aspect: |
          On the Household income domain, TTP is the MAX of 30%-of-adjusted and
          10%-of-gross; the same household inputs route to different statutory
          floors so the chosen floor differs from a naive 30%-only reading.
        test_recipe:
          setup:
            - "Region METRO_NORTH with a 2-bedroom payment standard of 95000 cents (FMR 100000)."
            - "Household gross 1800000, 2 dependents, family_size 3 -> adjusted 1704000, ELIGIBLE."
            - "Voucher issued (bedroom_size 2); unit bedroom_size 2, INITIAL inspection PASSED; contract rent 90000 (<= comparable 90000)."
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "METRO_NORTH", name: "Metro North", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "A Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL1", payee_account: "acct-1" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
          assert:
            - "HapContract.${hc}.total_tenant_payment_cents == 42600"
            - "HapContract.${hc}.hap_subsidy_cents == 47400"

      - name: subsidy_capped_by_payment_standard_vs_gross
        grounds:
          - calculations.subsidy_calculation
          - entities.PaymentStandard.fields.amount_cents
          - entities.HapContract.fields.hap_subsidy_cents
        distinguishing_aspect: |
          On the HapContract subsidy domain (different entity than TTP's income
          domain), subsidy uses min(contract_rent, payment_standard); when
          contract exceeds the standard the tenant absorbs the overage, so the
          capped variant yields a strictly smaller subsidy than the gross one.
        test_recipe:
          setup:
            - "Region OPP_AREA with 2-bedroom payment standard 95000 (FMR 100000)."
            - "Household gross 3000000, family_size 4 -> adjusted 3000000, ELIGIBLE; voucher bedroom_size 2."
            - "Unit bedroom_size 2, INITIAL inspection PASSED, comparable 120000; contract rent 120000 > standard 95000."
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "OPP_AREA", name: "Opportunity Area", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "B Fam", family_size: 4, annual_income_cents: 3000000, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL2", payee_account: "acct-2" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 120000, comparable_rent_cents: 120000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 120000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
          assert:
            - "HapContract.${hc}.total_tenant_payment_cents == 75000"
            - "HapContract.${hc}.hap_subsidy_cents == 20000"
            - "HapContract.${hc}.tenant_rent_burden_cents == 100000"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ttp_three_input_nonlinear_max_floor
        grounds:
          - calculations.ttp_calculation
          - entities.Household.fields.annual_income_cents
          - entities.Household.fields.adjusted_annual_income_cents
        distinguishing_aspect: |
          Mode (a): TTP is max() over three candidates (30% adjusted, 10% gross,
          minimum rent) where a large childcare deduction makes 10%-of-gross the
          binding floor — a non-linear branch among >=3 inputs.
        test_recipe:
          setup:
            - "Household gross 3000000, childcare 2400000, family_size 2 -> adjusted 600000; 10%-gross (25000) beats 30%-adjusted (15000)."
            - "Region + 1-bedroom payment standard 60000 (FMR 60000); unit bedroom 1, INITIAL inspection PASSED, comparable 60000, contract 60000."
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "WEST_END", name: "West End", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 1, amount_cents: 60000, fmr_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "C Fam", family_size: 2, annual_income_cents: 3000000, region_id: "${rid}", childcare_expense_cents: 2400000 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL3", payee_account: "acct-3" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 1, asking_rent_cents: 60000, comparable_rent_cents: 60000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 60000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
          assert:
            - "HapContract.${hc}.total_tenant_payment_cents == 25000"
            - "HapContract.${hc}.hap_subsidy_cents == 35000"

      - name: subsidy_pinned_eval_order_cap_then_subtract_then_floor
        grounds:
          - calculations.subsidy_calculation
          - entities.HapContract.fields.hap_subsidy_cents
          - entities.HapContract.fields.tenant_rent_burden_cents
        distinguishing_aspect: |
          Mode (c): subsidy has a pinned evaluation order (resolve standard ->
          cap rent -> subtract TTP -> floor at 0); evaluating subtract-before-cap
          would change the result, so the order must be explicit.
        test_recipe:
          setup:
            - "Household gross 600000, family_size 1 -> adjusted 600000; ttp 15000."
            - "Region + studio payment standard 40000 (FMR 40000); unit bedroom 0; contract 39000 (< standard); comparable 39000; INITIAL inspection PASSED."
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "EAST_SIDE", name: "East Side", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 0, amount_cents: 40000, fmr_cents: 40000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "D One", family_size: 1, annual_income_cents: 600000, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL4", payee_account: "acct-4" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 0, asking_rent_cents: 39000, comparable_rent_cents: 39000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 39000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
          assert:
            - "HapContract.${hc}.total_tenant_payment_cents == 15000"
            - "HapContract.${hc}.hap_subsidy_cents == 24000"
            - "HapContract.${hc}.tenant_rent_burden_cents == 15000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_fail_then_cure_cycle_on_hap_contract
        grounds:
          - state_machines.HapContract.ACTIVE_to_ABATED
          - state_machines.HapContract.ABATED_to_ACTIVE
        distinguishing_aspect: |
          HapContract has a cycle ACTIVE->ABATED->ACTIVE driven by annual
          inspection fail then cure — a non-linear revision loop on the
          HapContract entity.
        test_recipe:
          setup:
            - "An ACTIVE HapContract leased up (region/payment standard/voucher/unit/initial pass) with subsidy 47400."
            - "An ANNUAL inspection scheduled against that contract, then FAILED (contract ABATED, subsidy 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /regions"
              payload: { code: "CYC_REGION", name: "Cyc", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "Cyc Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL5", payee_account: "acct-5" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp0: $.data.id }
            - call: "POST /inspections/${insp0}/pass"
              payload: {}
              as: Inspector
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "ANNUAL", scheduled_date: "2026-06-15T00:00:00Z", hap_contract_id: "${hc}" }
              as: Inspector
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/fail"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /inspections/${insp1}/cure"
              payload: {}
              as: Inspector
          assert:
            - "HapContract.${hc}.status == ACTIVE"
            - "HapContract.${hc}.hap_subsidy_cents == 47400"
            - "Inspection.${insp1}.status == CURED"

      - name: portability_branch_billing_vs_absorption_on_voucher
        grounds:
          - state_machines.Voucher.ISSUED_to_PORTING_OUT
          - state_machines.Voucher.ISSUED_to_ABSORBED
        distinguishing_aspect: |
          Voucher branches at portability approval into PORTING_OUT (BILLING) vs
          ABSORBED (ABSORPTION) with divergent side-effects (issuing_region_id
          rewrite only on ABSORPTION) — a fork on a different entity than
          HapContract.
        test_recipe:
          setup:
            - "A voucher ISSUED in region HOME_REG; a receiving region OPP_REG flagged is_special_mobility_area=true (resolves ABSORPTION)."
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "HOME_REG", name: "Home", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { home: $.data.id }
            - call: "POST /regions"
              payload: { code: "OPP_REG", name: "Opp", fmr_year: 2026, is_special_mobility_area: true }
              as: ProgramAdmin
              captures: { opp: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Port Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${home}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id }
            - call: "POST /portability-moves"
              payload: { voucher_id: "${vid}", receiving_region_id: "${opp}" }
              as: PortabilityCoordinator
              captures: { pm: $.data.id }
          trigger:
            - call: "POST /portability-moves/${pm}/approve"
              payload: {}
              as: PortabilityCoordinator
          assert:
            - "PortabilityMove.${pm}.billing_mode == ABSORPTION"
            - "PortabilityMove.${pm}.status == ABSORBED"
            - "Voucher.${vid}.status == ABSORBED"
            - "Voucher.${vid}.issuing_region_id == ${opp}"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: failcure_terminates_contract_voucher_household_depth3
        grounds:
          - state_machines.Inspection.FAILED_to_ABATED
          - state_machines.HapContract.ABATED_to_TERMINATED
          - state_machines.Voucher.LEASED_to_TERMINATED
        distinguishing_aspect: |
          Depth>=3: fail-cure (deadline passed) terminates the HapContract;
          that termination terminates the Voucher; the Voucher termination
          terminates the Household — each link caused by the prior link.
        test_recipe:
          setup:
            - "An ABATED HapContract whose annual Inspection is FAILED with cure_deadline 2026-06-29 (scheduled 2026-06-15 + 14 days); clock advanced past deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /regions"
              payload: { code: "TERM_REG", name: "Term", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "Term Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL6", payee_account: "acct-6" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp0: $.data.id }
            - call: "POST /inspections/${insp0}/pass"
              payload: {}
              as: Inspector
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "ANNUAL", scheduled_date: "2026-06-15T00:00:00Z", hap_contract_id: "${hc}" }
              as: Inspector
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/fail"
              payload: {}
              as: Inspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspections/${insp1}/fail-cure"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HapContract.${hc}.status == TERMINATED"
            - "Voucher.${vid}.status == TERMINATED"
            - "Household.${hh}.status == TERMINATED"

      - name: annual_fail_abates_contract_and_flips_unit_depth2
        grounds:
          - state_machines.Inspection.SCHEDULED_to_FAILED
          - state_machines.HapContract.ACTIVE_to_ABATED
        distinguishing_aspect: |
          Depth>=2 from a different trigger (annual fail): failing the annual
          inspection abates the HapContract, and that abatement flips the Unit
          to OFF_MARKET — distinct from the fail-cure termination chain.
        test_recipe:
          setup:
            - "An ACTIVE HapContract with its Unit UNDER_CONTRACT; an ANNUAL inspection SCHEDULED against the contract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /regions"
              payload: { code: "ABATE_REG", name: "Abate", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "Abate Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LL7", payee_account: "acct-7" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp0: $.data.id }
            - call: "POST /inspections/${insp0}/pass"
              payload: {}
              as: Inspector
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "ANNUAL", scheduled_date: "2026-06-15T00:00:00Z", hap_contract_id: "${hc}" }
              as: Inspector
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /inspections/${insp1}/fail"
              payload: {}
              as: Inspector
          assert:
            - "HapContract.${hc}.status == ABATED"
            - "HapContract.${hc}.hap_subsidy_cents == 0"
            - "Unit.${unit}.status == OFF_MARKET"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_voucher_vs_rent_not_reasonable_temporal_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=9]
        distinguishing_aspect: |
          A single lease-up fails BOTH business_temporal (voucher expired,
          priority 7) and business_constraint (rent not reasonable, priority 9);
          the lower-priority-number temporal error ERR_VOUCHER_EXPIRED must win.
        test_recipe:
          setup:
            - "Voucher ISSUED with term 60 days from 2026-06-01; clock then advanced to 2026-09-01 (expired)."
            - "Unit INITIAL inspection PASSED but contract 200000 > comparable 90000 (rent not reasonable)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /regions"
              payload: { code: "PRI_REG1", name: "Pri1", fmr_year: 2026 }
