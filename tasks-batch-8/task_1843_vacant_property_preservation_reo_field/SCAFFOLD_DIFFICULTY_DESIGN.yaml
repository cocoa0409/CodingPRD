scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_allowable_provisional_vs_final
        grounds:
          - calculations.allowable_reimbursement
          - entities.Invoice.fields.provisional_allowed_cents
          - entities.Invoice.fields.approved_amount_cents
          - state_machines.Invoice.DRAFT_to_SUBMITTED
          - state_machines.Invoice.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Invoice-domain dual variant: the PROVISIONAL variant at submit counts
          SUBMITTED invoices in the occurrence/budget inclusion set while the FINAL
          variant at approve counts only APPROVED/PARTIALLY_APPROVED/PAID, so the
          identical expense line yields 0 provisionally and 3000 finally.
        test_recipe:
          setup:
            - "Clock at 2026-03-01; FHA/GRASS_CUT allowable: per-occurrence 3000, max 2 occurrences/yr, aggregate 10000/yr, bid threshold 999999"
            - "Property P (OH, FHA) with three completed GRASS_CUT work orders wo1/wo2/wo3, each submitted at 3000"
            - "Invoice i1 (wo1) line 3000 APPROVED; invoice i2 (wo2) line 3000 SUBMITTED (not approved); invoice i3 (wo3) line 3000 still DRAFT"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer A", code: "SVCA" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 1", crew_code: "CR1" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 2, aggregate_cap_cents_per_property_year: 10000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "1 Elm St", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5000, heating_system: "FORCED_AIR", fixture_count: 6 }, as: VendorAdmin, captures: { p: $.data.id } }
            # --- wo1 cycle ---
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "GRASS_CUT", due_date: "2026-03-10" }, as: Servicer, as_user_id: "${sv}", captures: { wo1: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo1}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-03-02" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo1}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo1}", category: "BEFORE", taken_at: "2026-03-02T09:00:00Z", content_hash: "a1b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo1}", category: "AFTER", taken_at: "2026-03-02T10:00:00Z", content_hash: "a1a" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo1}/submit", payload: { submitted_cost_cents: 3000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo1}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo1}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo1}", as: VendorAdmin, captures: { i1: $.data.0.id } }
            - { call: "POST /preservation/invoices/${i1}/lines", payload: { item_code: "GRASS_CUT", quantity: 1, unit_price_cents: 3000 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${i1}/submit", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${i1}/approve", payload: {}, as: Servicer, as_user_id: "${sv}" }
            # --- wo2 cycle: invoice left SUBMITTED ---
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "GRASS_CUT", due_date: "2026-03-12" }, as: Servicer, as_user_id: "${sv}", captures: { wo2: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo2}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-03-03" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo2}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo2}", category: "BEFORE", taken_at: "2026-03-03T09:00:00Z", content_hash: "a2b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo2}", category: "AFTER", taken_at: "2026-03-03T10:00:00Z", content_hash: "a2a" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo2}/submit", payload: { submitted_cost_cents: 3000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo2}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo2}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo2}", as: VendorAdmin, captures: { i2: $.data.0.id } }
            - { call: "POST /preservation/invoices/${i2}/lines", payload: { item_code: "GRASS_CUT", quantity: 1, unit_price_cents: 3000 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${i2}/submit", payload: {}, as: VendorAdmin }
            # --- wo3 cycle: invoice left DRAFT ---
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "GRASS_CUT", due_date: "2026-03-14" }, as: Servicer, as_user_id: "${sv}", captures: { wo3: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo3}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-03-04" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo3}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo3}", category: "BEFORE", taken_at: "2026-03-04T09:00:00Z", content_hash: "a3b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo3}", category: "AFTER", taken_at: "2026-03-04T10:00:00Z", content_hash: "a3a" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo3}/submit", payload: { submitted_cost_cents: 3000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo3}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo3}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo3}", as: VendorAdmin, captures: { i3: $.data.0.id } }
            - { call: "POST /preservation/invoices/${i3}/lines", payload: { item_code: "GRASS_CUT", quantity: 1, unit_price_cents: 3000 }, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/invoices/${i3}/submit", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${i3}/approve", payload: {}, as: Servicer, as_user_id: "${sv}" }
          assert:
            - "Invoice.${i3}.provisional_allowed_cents == 0 — PROVISIONAL counts SUBMITTED invoice ${i2}, so 2 occurrences already used"
            - "Invoice.${i3}.approved_amount_cents == 3000 — FINAL counts only settled invoice ${i1} (1 occurrence used, 7000 budget left)"
            - "Invoice.${i3}.status == APPROVED"

      - name: property_condition_score_interior_variants
        grounds:
          - calculations.property_condition_score
          - entities.Property.fields.condition_score
          - entities.Property.fields.compliance_posture
          - entities.DamageReport.fields.is_interior
        distinguishing_aspect: |
          Property-domain dual variant (different entity domain from the invoice
          instance): with identical violations, registration gap, and damage
          reports, the EXTERIOR_ONLY variant scores 65 (AT_RISK) while the
          INTERIOR_INCLUSIVE variant scores 35 (NON_COMPLIANT), the variant being
          selected by the latest completed inspection's interior_access flag.
        test_recipe:
          setup:
            - "Property P (no ACTIVE registration: -20) with one open MINOR violation (-15) and two open interior WATER damage reports"
            - "No completed inspection yet"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer B", code: "SVCB" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 2", crew_code: "CR2" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "9 Oak Ave", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 7000, heating_system: "NONE", fixture_count: 4 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/code-violations", payload: { property_id: "${p}", citation_number: "CV-100", violation_class: "MINOR", daily_fine_cents: 500, fine_cap_cents: 50000, cure_deadline: "2026-09-01" }, as: VendorAdmin, captures: { cv: $.data.id } }
            - { call: "POST /preservation/damage-reports", payload: { property_id: "${p}", damage_type: "WATER", severity: "MODERATE", is_interior: true, description: "kitchen leak" }, as: FieldCrew, as_user_id: "${cr}", captures: { d1: $.data.id } }
            - { call: "POST /preservation/damage-reports", payload: { property_id: "${p}", damage_type: "WATER", severity: "MINOR", is_interior: true, description: "bath leak" }, as: FieldCrew, as_user_id: "${cr}", captures: { d2: $.data.id } }
            - { call: "POST /preservation/inspections", payload: { property_id: "${p}", due_date: "2026-08-02" }, as: VendorAdmin, captures: { ins1: $.data.id } }
            - { call: "POST /preservation/inspections/${ins1}/record", payload: { occupancy_determination: "VACANT", interior_access: false, personal_property_present: false }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "GET /preservation/properties/${p}", as: VendorAdmin, captures: { score_ext: $.data.condition_score, posture_ext: $.data.compliance_posture } }
            - { call: "POST /preservation/inspections", payload: { property_id: "${p}", due_date: "2026-08-03" }, as: VendorAdmin, captures: { ins2: $.data.id } }
            - { call: "POST /preservation/inspections/${ins2}/record", payload: { occupancy_determination: "VACANT", interior_access: true, personal_property_present: false }, as: FieldCrew, as_user_id: "${cr}" }
          trigger:
            - { call: "GET /preservation/properties/${p}", as: VendorAdmin, captures: { score_int: $.data.condition_score, posture_int: $.data.compliance_posture } }
          assert:
            - "EXTERIOR_ONLY result captured: score_ext == 65 and posture_ext == AT_RISK (100 - 15 violation - 20 lapsed registration)"
            - "INTERIOR_INCLUSIVE result after interior-access inspection: score_int == 35 and posture_int == NON_COMPLIANT (additional -30 for two interior damages)"
            - "Property.${p}.condition_score changed only because the scoring variant switched; inputs otherwise identical"

  - rule_id: combinatorial_formula
    instances:
      - name: winterization_quote_nested_inputs
        grounds:
          - calculations.winterization_quote
          - entities.WorkOrder.fields.estimated_cost_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — fixture count and pool
          flag add, heating multiplier (1.50) and seasonal multiplier (1.20)
          multiply; identical property yields 60480 in January and 50400 in July.
        test_recipe:
          setup:
            - "Property P with fixture_count 8, has_pool true, heating_system HOT_WATER; FHA/WINTERIZATION allowable present"
            - "Clock initially 2026-01-15 (heating season), then 2026-07-15 (off season)"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer C", code: "SVCC" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "WINTERIZATION", max_per_occurrence_cents: 999999, max_occurrences_per_calendar_year: 5, aggregate_cap_cents_per_property_year: 9999999, requires_bid_over_cents: 99999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "5 Pine Rd", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 6000, heating_system: "HOT_WATER", fixture_count: 8, has_pool: true }, as: VendorAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "WINTERIZATION", due_date: "2026-01-20" }, as: Servicer, as_user_id: "${sv}", captures: { wo_w: $.data.id, est_winter: $.data.estimated_cost_cents } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "WINTERIZATION", due_date: "2026-07-20" }, as: Servicer, as_user_id: "${sv}", captures: { est_summer: $.data.estimated_cost_cents } }
          assert:
            - "est_winter == 60480 — (15000 + 8*1200 + 9000) * 1.50 * 1.20"
            - "est_summer == 50400 — same base * 1.50 * 1.00 seasonal"
            - "WorkOrder.${wo_w}.investor_allowable_version == 1"

      - name: prompt_pay_discount_per_line_rounding
        grounds:
          - calculations.prompt_pay_discount
          - entities.Invoice.fields.prompt_pay_discount_cents
          - entities.ExpenseLine.fields.line_discount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-line round_half_up
          (67 + 67 = 134) is pinned; summing first would give 133 on the same
          lines (3333 + 3335 = 6668; 2% = 133.36 -> 133).
        test_recipe:
          setup:
            - "Completed DEBRIS_REMOVAL work order with invoice containing two lines: 3333 and 3335 cents (qty 1 each), allowable caps high enough not to bind"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer D", code: "SVCD" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 4", crew_code: "CR4" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "DEBRIS_REMOVAL", max_per_occurrence_cents: 100000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 1000000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "7 Ash Blvd", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 4500, heating_system: "FORCED_AIR", fixture_count: 5 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "DEBRIS_REMOVAL", due_date: "2026-08-10" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-02" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:00:00Z", content_hash: "d1b1" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:05:00Z", content_hash: "d1b2" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:00:00Z", content_hash: "d1a1" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:05:00Z", content_hash: "d1a2" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 6668 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo}", as: VendorAdmin, captures: { inv: $.data.0.id } }
            - { call: "POST /preservation/invoices/${inv}/lines", payload: { item_code: "DEBRIS_REMOVAL", quantity: 1, unit_price_cents: 3333 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${inv}/lines", payload: { item_code: "DEBRIS_REMOVAL", quantity: 1, unit_price_cents: 3335 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${inv}/submit", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/invoices/${inv}/approve", payload: {}, as: Servicer, as_user_id: "${sv}" }
          assert:
            - "Invoice.${inv}.approved_amount_cents == 6668"
            - "Invoice.${inv}.prompt_pay_discount_cents == 134 — per-line round_half_up(66.66)=67 and round_half_up(66.70)=67"
            - "Invoice.${inv}.payable_amount_cents == 6534"
            - "Invoice.${inv}.status == APPROVED"

      - name: volume_rebate_evaluation_order
        grounds:
          - calculations.volume_rebate
          - entities.Servicer.fields.prior_month_gross_cents
          - entities.Servicer.fields.volume_rebate_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — rebate derives from monthly gross
          yet could itself feed gross; the pinned evaluation order computes gross
          from invoice approvals only (rebates are never invoices), so a 1000000
          August gross yields a 15000 rebate and September gross reads 0, not
          15000-contaminated.
        test_recipe:
          setup:
            - "Servicer S with one property; one DAMAGE_REPAIR invoice approved at exactly 1000000 cents with approved_at in August 2026"
            - "Clock advanced to 2026-09-01 for the monthly rebate sweep, then 2026-10-01"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer E", code: "SVCE" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 5", crew_code: "CR5" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "DAMAGE_REPAIR", max_per_occurrence_cents: 1000000, max_occurrences_per_calendar_year: 5, aggregate_cap_cents_per_property_year: 5000000, requires_bid_over_cents: 99999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "3 Beech Ct", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 8000, heating_system: "FORCED_AIR", fixture_count: 7 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "DAMAGE_REPAIR", due_date: "2026-08-20" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-06" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-06T09:00:00Z", content_hash: "e1b" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "DURING", taken_at: "2026-08-06T09:30:00Z", content_hash: "e1d" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-06T10:00:00Z", content_hash: "e1a" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 1000000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/approve", payload: {}, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/complete", payload: {}, as: QualityReviewer }
            - { call: "GET /preservation/invoices?work_order_id=${wo}", as: VendorAdmin, captures: { inv: $.data.0.id } }
            - { call: "POST /preservation/invoices/${inv}/lines", payload: { item_code: "DAMAGE_REPAIR", quantity: 1, unit_price_cents: 1000000 }, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${inv}/submit", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/invoices/${inv}/approve", payload: {}, as: Servicer, as_user_id: "${sv}" }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: VendorAdmin }
          trigger:
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin }
            - { call: "GET /preservation/servicers/${sv}", as: VendorAdmin, captures: { gross_aug: $.data.prior_month_gross_cents, rebate_aug: $.data.volume_rebate_cents } }
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin }
            - { call: "GET /preservation/servicers/${sv}", as: VendorAdmin, captures: { gross_sep: $.data.prior_month_gross_cents, rebate_sep: $.data.volume_rebate_cents } }
          assert:
            - "gross_aug == 1000000 and rebate_aug == 15000 — gross >= 1000000 hits the 0.015 tier (inclusive boundary)"
            - "gross_sep == 0 and rebate_sep == 0 — the 15000 rebate never re-enters gross (evaluation order pinned)"

  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_rework_cycle
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_SUBMITTED
          - state_machines.WorkOrder.SUBMITTED_to_IN_PROGRESS
          - state_machines.WorkOrder.SUBMITTED_to_APPROVED
          - entities.WorkOrder.fields.rework_count
        distinguishing_aspect: |
          Cyclic machine on WorkOrder: SUBMITTED -> IN_PROGRESS rejection loop
          runs twice (rework_count 2) before APPROVED, and each resubmission
          replaces submitted_cost_cents while previously uploaded photos persist.
        test_recipe:
          setup:
            - "SECURING work order assigned and started; six photos uploaded meeting minimums (BEFORE 2, DURING 1, AFTER 2, SERIAL_NUMBER 1); FHA/LOCK_CHANGE allowable present"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer F", code: "SVCF" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 6", crew_code: "CR6" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "LOCK_CHANGE", max_per_occurrence_cents: 20000, max_occurrences_per_calendar_year: 4, aggregate_cap_cents_per_property_year: 80000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "11 Cedar Ln", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5200, heating_system: "FORCED_AIR", fixture_count: 5 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "SECURING", due_date: "2026-08-20" }, as: Servicer, as_user_id: "${sv}", captures: { wo: $.data.id } }
            - { call: "POST /preservation/work-orders/${wo}/assign", payload: { crew_id: "${cr}", scheduled_date: "2026-08-02" }, as: Dispatcher }
            - { call: "POST /preservation/work-orders/${wo}/start", payload: {}, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:00:00Z", content_hash: "f_b1" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "BEFORE", taken_at: "2026-08-02T09:01:00Z", content_hash: "f_b2" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "DURING", taken_at: "2026-08-02T09:30:00Z", content_hash: "f_d1" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:00:00Z", content_hash: "f_a1" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "AFTER", taken_at: "2026-08-02T10:01:00Z", content_hash: "f_a2" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/photo-evidence", payload: { work_order_id: "${wo}", category: "SERIAL_NUMBER", taken_at: "2026-08-02T10:02:00Z", content_hash: "f_s1" }, as: FieldCrew, as_user_id: "${cr}" }
          trigger:
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 4000 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/reject", payload: { reason: "lock photo blurry" }, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 4500 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/reject", payload: { reason: "missing serial close-up detail" }, as: QualityReviewer }
            - { call: "POST /preservation/work-orders/${wo}/submit", payload: { submitted_cost_cents: 4800 }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "POST /preservation/work-orders/${wo}/approve", payload: {}, as: QualityReviewer, captures: { final_status: $.data.status, final_cost: $.data.approved_cost_cents, final_rework: $.data.rework_count } }
          assert:
            - "final_rework == 2 — two SUBMITTED -> IN_PROGRESS loops executed"
            - "final_status == APPROVED after the third submission"
            - "final_cost == 4800 — latest resubmission's cost, not 4000 or 4500"

      - name: bid_negotiation_rounds_cycle
        grounds:
          - state_machines.Bid.SUBMITTED_to_COUNTERED
          - state_machines.Bid.COUNTERED_to_SUBMITTED
          - state_machines.Bid.SUBMITTED_to_APPROVED
          - state_machines.DamageReport.BID_REQUESTED_to_REPAIR_IN_PROGRESS
        distinguishing_aspect: |
          Cyclic machine on Bid (different entity from the WorkOrder loop):
          SUBMITTED -> COUNTERED -> SUBMITTED negotiation round increments
          round_number to 2, approval spawns a BID_CONVERTED work order capped at
          the revised 70000 and auto-rejects the competing SUBMITTED bid.
        test_recipe:
          setup:
            - "Damage report on property P in BID_REQUESTED; two crews each with a bid: bid1 SUBMITTED then COUNTERED at 65000; bid2 SUBMITTED at 90000; FHA/DAMAGE_REPAIR allowable present"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer G", code: "SVCG" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 7", crew_code: "CR7" }, as: VendorAdmin, captures: { cr1: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 8", crew_code: "CR8" }, as: VendorAdmin, captures: { cr2: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "DAMAGE_REPAIR", max_per_occurrence_cents: 250000, max_occurrences_per_calendar_year: 5, aggregate_cap_cents_per_property_year: 900000, requires_bid_over_cents: 99999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "21 Maple Dr", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 6100, heating_system: "FORCED_AIR", fixture_count: 6 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/damage-reports", payload: { property_id: "${p}", damage_type: "VANDALISM", severity: "SEVERE", is_interior: false, description: "kicked-in door" }, as: FieldCrew, as_user_id: "${cr1}", captures: { dr: $.data.id } }
            - { call: "POST /preservation/damage-reports/${dr}/triage", payload: {}, as: VendorAdmin }
            - { call: "POST /preservation/damage-reports/${dr}/request-bids", payload: {}, as: VendorAdmin, captures: { dr_v: $.data.version } }
            - { call: "POST /preservation/damage-reports/${dr}/bids", payload: { amount_cents: 80000, expected_damage_report_version: "${dr_v}" }, as: FieldCrew, as_user_id: "${cr1}", captures: { b1: $.data.id } }
            - { call: "POST /preservation/bids/${b1}/submit", payload: {}, as: FieldCrew, as_user_id: "${cr1}" }
            - { call: "POST /preservation/damage-reports/${dr}/bids", payload: { amount_cents: 90000, expected_damage_report_version: "${dr_v} + 1" }, as: FieldCrew, as_user_id: "${cr2}", captures: { b2: $.data.id } }
            - { call: "POST /preservation/bids/${b2}/submit", payload: {}, as: FieldCrew, as_user_id: "${cr2}" }
            - { call: "POST /preservation/bids/${b1}/counter", payload: { counter_amount_cents: 65000 }, as: Servicer, as_user_id: "${sv}" }
          trigger:
            - { call: "POST /preservation/bids/${b1}/revise", payload: { amount_cents: 70000 }, as: FieldCrew, as_user_id: "${cr1}", captures: { round_after: $.data.round_number } }
            - { call: "POST /preservation/bids/${b1}/approve", payload: {}, as: Servicer, as_user_id: "${sv}", captures: { b1_status: $.data.status, spawned_wo: $.data.approved_work_order_id } }
            - { call: "GET /preservation/work-orders/${spawned_wo}", as: VendorAdmin, captures: { wo_source: $.data.source, wo_type: $.data.order_type, wo_cap: $.data.allowable_cap_cents, wo_due: $.data.due_date } }
            - { call: "GET /preservation/bids/${b2}", as: VendorAdmin, captures: { b2_status: $.data.status } }
            - { call: "GET /preservation/damage-reports/${dr}", as: VendorAdmin, captures: { dr_status: $.data.status } }
          assert:
            - "round_after == 2 — COUNTERED -> SUBMITTED revision incremented the round"
            - "b1_status == APPROVED"
            - "wo_source == BID_CONVERTED and wo_type == DAMAGE_REPAIR"
            - "wo_cap == 70000 — negotiated cap from the revised bid amount"
            - "wo_due == 2026-08-15 — clock date + 14 days"
            - "b2_status == REJECTED — competing open bid auto-rejected on approval"
            - "dr_status == REPAIR_IN_PROGRESS"

  - rule_id: transitive_cascade
    instances:
      - name: occupancy_confirmed_cascade_depth3
        grounds:
          - state_machines.Inspection.VERIFICATION_PENDING_to_COMPLETED
          - state_machines.RecurringServicePlan.ACTIVE_to_SUSPENDED
          - state_machines.WorkOrder.ISSUED_to_CANCELLED
          - calculations.recurring_generation
        distinguishing_aspect: |
          Depth-3 cascade triggered by inspection verify: occupancy confirmation
          mutates Property.occupancy_status (link 1), which suspends the ACTIVE
          recurring plan (link 2), which cancels the plan's open RECURRING_AUTO
          work order with season-budget compensation (link 3) — each link caused
          by the previous mutation, not by the verify call itself.
        test_recipe:
          setup:
            - "Property P with ACTIVE grass-cut plan (season 04-01..10-31, interval 14, max 6); one RECURRING_AUTO work order generated by sweep at 2026-05-01"
            - "Inspection recorded OCCUPIED (property OCCUPIED_PENDING_VERIFICATION, plan still ACTIVE)"
          setup_api_calls:
            - { call: "POST /preservation/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: VendorAdmin }
            - { call: "POST /preservation/servicers", payload: { name: "Servicer H", code: "SVCH" }, as: VendorAdmin, captures: { sv: $.data.id } }
            - { call: "POST /preservation/crews", payload: { name: "Crew 9", crew_code: "CR9" }, as: VendorAdmin, captures: { cr: $.data.id } }
            - { call: "POST /preservation/investor-allowables", payload: { investor_type: "FHA", item_code: "GRASS_CUT", max_per_occurrence_cents: 3000, max_occurrences_per_calendar_year: 20, aggregate_cap_cents_per_property_year: 60000, requires_bid_over_cents: 999999, effective_from: "2026-01-01" }, as: VendorAdmin }
            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "30 Walnut St", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 5500, heating_system: "FORCED_AIR", fixture_count: 5 }, as: VendorAdmin, captures: { p: $.data.id } }
            - { call: "POST /preservation/recurring-plans", payload: { property_id: "${p}", service_type: "GRASS_CUT", season_start_md: "04-01", season_end_md: "10-31", interval_days: 14, max_per_season: 6 }, as: VendorAdmin, captures: { plan: $.data.id } }
            - { call: "POST /preservation/ops/run-daily-sweep", payload: {}, as: VendorAdmin, captures: { gen_wo: "$.data.generated_work_order_ids[0]" } }
            - { call: "POST /preservation/inspections", payload: { property_id: "${p}", due_date: "2026-05-02" }, as: VendorAdmin, captures: { ins: $.data.id } }
            - { call: "POST /preservation/inspections/${ins}/record", payload: { occupancy_determination: "OCCUPIED", interior_access: false, personal_property_present: false }, as: FieldCrew, as_user_id: "${cr}", captures: { mid_status: $.data.status } }
          trigger:
            - { call: "POST /preservation/inspections/${ins}/verify", payload: { verified_occupancy: "OCCUPIED" }, as: FieldCrew, as_user_id: "${cr}" }
            - { call: "GET /preservation/properties/${p}", as: VendorAdmin, captures: { p_occ: $.data.occupancy_status } }
            - { call: "GET /preservation/recurring-plans/${plan}", as: VendorAdmin, captures: { plan_status: $.data.status, plan_gen: $.data.generated_this_season } }
            - { call: "GET /preservation/work-orders/${gen_wo}", as: VendorAdmin, captures: { gen_status: $.data.status } }
            - { call: "POST /preservation/recurring-plans/${plan}/resume", payload: {}, as: VendorAdmin, captures: { resume_err: $.data.error_id } }
          assert:
            - "mid_status == VERIFICATION_PENDING — record alone does not suspend the plan"
            - "p_occ == OCCUPIED (link 1)"
            - "plan_status == SUSPENDED (link 2) and plan_gen == 0 (cancelled generation compensated)"
            - "gen_status == CANCELLED (link 3)"
            - "resume_err == ERR_PROPERTY_OCCUPIED — suspension cannot be lifted while occupied"

