  # =====================================================================
  # Rule 9 — compensating_invariant across different conserved quantities.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: overaward_plan_apply_rollback_restores_total_accepted
        grounds:
          - state_machines.OverawardCase.OPEN_to_RESOLVING
          - state_machines.OverawardCase.RESOLVING_to_OPEN
          - entities.AwardPackage.fields.total_accepted_cents
        distinguishing_aspect: |
          Conserved quantity 1 — AwardPackage.total_accepted_cents: applying a
          resolution plan (reduce SUB by 500000) then rolling it back must leave
          total_accepted_cents exactly at its pre-plan value 2350000; any drift
          fails the invariant.
        test_recipe:
          setup:
            - "AidYear OPEN; PELL(rank1 cap 739500 pool 0), SUB(rank3 cap 350000 pool 0), INST_GRANT(rank5 cap 500000 pool 800000, INSTITUTIONAL need_based) ACTIVE; SEOG skipped to keep totals simple"
            - "Student O EFC 0 FULL_TIME grade 1, package built: PELL 739500 + SUB 350000 + INST 500000 = 1589500 offered; plus UNSUB? omitted. Fully accepted -> total_accepted 1589500"
            - "External aid 900000 counts_against_coa=true posted -> total aid 2489500 > COA 2400000 -> OverawardCase OPEN with overage 89500"
            - "NOTE: plan reduces INST_GRANT line by 89500 (new total accepted 1500000 <= COA - external 900000 = 1500000 exactly)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "SUB", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 350000, pool_budget_cents: 0, packaging_rank: 2, requires_verification_complete: false }
              as: AidDirector
              captures: { f_sub: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "INST_GRANT", category: "INSTITUTIONAL", need_based: true, annual_cap_cents: 500000, pool_budget_cents: 800000, packaging_rank: 3, requires_verification_complete: false }
              as: AidDirector
              captures: { f_inst: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/fund-types/${f_sub}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/fund-types/${f_inst}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Overawarded", email: "o@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_o: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_o}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_o}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_o: "$.data.id" }
            - call: "POST /api/award-packages/${pkg_o}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_o}/notify"
              payload: {}
              as: AidOfficer
            - call: "GET /api/award-packages/${pkg_o}/award-lines"
              payload: {}
              as: AidOfficer
              captures: { line_o1: "$.data[0].id", line_o2: "$.data[1].id", line_o3: "$.data[2].id" }
            - call: "POST /api/award-packages/${pkg_o}/accept"
              payload: { line_acceptances: [ { award_line_id: "${line_o1}", accept_cents: 739500 }, { award_line_id: "${line_o2}", accept_cents: 350000 }, { award_line_id: "${line_o3}", accept_cents: 500000 } ] }
              as: Student
              as_user_id: "${stu_o}"
            - call: "POST /api/external-aid"
              payload: { student_id: "${stu_o}", aid_year_id: "${ay_id}", source_name: "Rotary Scholarship", amount_cents: 900000, counts_against_coa: true }
              as: AidOfficer
            - call: "GET /api/students/${stu_o}/overaward-cases"
              payload: {}
              as: AidOfficer
              captures: { oa_o: "$.data[0].id", overage_o: "$.data[0].overage_cents" }
          trigger:
            - call: "POST /api/overaward-cases/${oa_o}/begin-resolution"
              payload: { resolution_plan: [ { award_line_id: "${line_o3}", reduce_by_cents: 89500 } ] }
              as: AidOfficer
            - call: "GET /api/award-packages/${pkg_o}"
              payload: {}
              as: AidOfficer
              captures: { total_after_plan: "$.data.total_accepted_cents" }
            - call: "POST /api/overaward-cases/${oa_o}/rollback"
              payload: {}
              as: AidOfficer
            - call: "GET /api/award-packages/${pkg_o}"
              payload: {}
              as: AidOfficer
          assert:
            - "overage_o == 89500"
            - "total_after_plan == 1500000"
            - "AwardPackage.${pkg_o}.total_accepted_cents == 1589500 after rollback (exact restoration of the conserved quantity)"
            - "OverawardCase.${oa_o}.status == OPEN after rollback"

      - name: disbursement_post_return_restores_pool_disbursed
        grounds:
          - state_machines.Disbursement.ELIGIBILITY_PASSED_to_POSTED
          - state_machines.Disbursement.RETURN_REQUESTED_to_RETURNED
          - entities.FundType.fields.pool_disbursed_cents
