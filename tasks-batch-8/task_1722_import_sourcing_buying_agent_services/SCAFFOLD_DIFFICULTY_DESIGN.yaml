            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au1_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au1_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f1_id}/compliance-documents"
              payload: { doc_type: "SOCIAL_AUDIT", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d_sa: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d_sa}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/factories/${f1_id}/compliance-documents"
              payload: { doc_type: "PRODUCT_TEST", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d_pt: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d_pt}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "CB goods", product_category: "APPAREL", target_price_cents: 400, quantity: 25, commission_mode: "FOB" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 400, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { q1_id: "$.data.id", q1_v: "$.data.version" }
            - call: "POST /sourcing/quotations/${q1_id}/accept"
              payload: { ordered_qty: 25, delivery_month: "2026-09", expected_quotation_version: "${q1_v}" }
              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { po1_id: "$.data.id" }
            - call: "POST /sourcing/purchase-orders/${po1_id}/milestones"
              payload: { name: "FULL", weight_pct: 100 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { m1_id: "$.data.id" }
            - call: "POST /sourcing/milestones/${m1_id}/submit"
              payload: { evidence_note: "done" }
              as: FactoryRep
