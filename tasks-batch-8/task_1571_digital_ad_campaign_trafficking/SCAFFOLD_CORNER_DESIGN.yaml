scaffold_corner_design:
  # ================================================================= entities
  - section: entities
    instances:
      - name: io_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.InsertionOrder.fields.viewability_threshold_pct, entities.InsertionOrder.fields.ivt_threshold_pct, entities.InsertionOrder.fields.status]
        distinguishing_aspect: "Omitting the optional thresholds yields the documented defaults 0.70 / 0.02, status DRAFT, computed counters at 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id, st: $.data.status, vt: $.data.viewability_threshold_pct, it: $.data.ivt_threshold_pct, bb: $.data.booked_budget_cents, v: $.data.version } }
          trigger: []
          assert:
            - "st == DRAFT"
            - "vt == 0.7 and it == 0.02"
            - "bb == 0 and total_applied_credit_cents == 0"
            - "v == 1"

      - name: io_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.InsertionOrder.fields.total_budget_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required total_budget_cents → ERR_INVALID_REQUEST (400); no entity persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST", "http status == 400"]

      - name: line_item_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /line-items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND", "http status == 404"]

      - name: line_item_budget_computed_and_client_budget_input_ignored
        claim_type: computed_fields
        grounds: [entities.LineItem.fields.budget_cents, calculations.line_item_budget]
        distinguishing_aspect: "budget_cents is server-computed: round_half_up(100000 × 500 / 1000) = 50000; a client-supplied budget_cents in the body is ignored."
        test_recipe:
          setup: ["IO budget 100000, flight 2026-08-01..2026-08-31"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
          trigger:
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN", budget_cents: 1 }, as: Trafficker, captures: { li_id: $.data.id, bc: $.data.budget_cents } }
          assert:
            - "bc == 50000"
            - "LineItem.${li_id}.status == DRAFT and fraud_posture == CLEAR"
            - "InsertionOrder.${io_id}.booked_budget_cents == 50000"

      - name: creative_initial_state_uploaded
        claim_type: initial_state
        grounds: [state_machines.Creative.initial_state]
        distinguishing_aspect: "New creative starts UPLOADED with ad_tag null and qa_failure_reason null."
        test_recipe:
          setup: ["IO + DRAFT line item"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
          trigger:
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { st: $.data.status, tag: $.data.ad_tag } }
          assert: ["st == UPLOADED", "tag == null"]

      - name: snapshot_spend_computed
        claim_type: computed_fields
        grounds: [calculations.snapshot_spend, entities.DeliverySnapshot.fields.spend_cents]
        distinguishing_aspect: "10000 impressions @ cpm 500 → spend_cents exactly 5000, computed server-side."
        test_recipe:
          setup: ["LIVE line item goal 100000 @ cpm 500"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
          trigger:
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-02", impressions: 10000, clicks: 40 }, as: Trafficker, captures: { snap_id: $.data.id, spend: $.data.spend_cents, st: $.data.status } }
          assert: ["spend == 5000", "st == POSTED"]

      - name: impression_event_occurred_at_defaults_to_logical_clock
        claim_type: defaults
        grounds: [entities.ImpressionEvent.fields.occurred_at]
        distinguishing_aspect: "Omitting occurred_at stamps the event with the server logical clock (2026-08-02T09:30:00Z after set), not wall-clock time."
        test_recipe:
          setup: ["LIVE line item (uncapped); logical clock set to 2026-08-02T09:30:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: AdOpsManager }
          trigger:
            - { call: "POST /impression-events", payload: { line_item_id: "${li_id}", user_key: "u9" }, as: Trafficker, captures: { occ: $.data.occurred_at } }
          assert: ["occ == 2026-08-02T09:30:00Z (the logical clock value)"]

      - name: io_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.InsertionOrder.fields.billing_basis, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "billing_basis outside {AGENCY_PLATFORM, THIRD_PARTY_TAG, LOWER_OF} → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "BOGUS" }, as: AdOpsManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: line_item_dates_outside_io_flight_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_FLIGHT_WINDOW_VIOLATION]"]
        distinguishing_aspect: "Line item start_date before the IO flight_start → ERR_FLIGHT_WINDOW_VIOLATION (422)."
        test_recipe:
          setup: ["IO flight 2026-08-01..2026-08-31"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
          trigger:
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 1000, cpm_rate_cents: 500, start_date: "2026-07-30", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_FLIGHT_WINDOW_VIOLATION", "http status == 422"]

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: cancelled_io_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.InsertionOrder]
        distinguishing_aspect: "From CANCELLED no further transition is possible: APPROVE on a cancelled IO → ERR_INVALID_STATE."
        test_recipe:
          setup: ["IO with one line item, then IO CANCELLED from DRAFT"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 1000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "CANCEL" }, as: AdOpsManager }
          trigger:
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE", "InsertionOrder.${io_id}.status == CANCELLED"]

      - name: launch_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LineItem]
        distinguishing_aspect: "LAUNCH is only valid from TRAFFICKED; from DRAFT → ERR_INVALID_STATE (state check precedes all business checks)."
        test_recipe:
          setup: ["IO approved; line item still DRAFT (no creatives)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 1000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
          trigger:
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE", "LineItem.${li_id}.status == DRAFT"]

      - name: traffic_without_tagged_creative_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.LineItem.DRAFT_to_TRAFFICKED, "errors[ERR_NO_TAGGED_CREATIVE]"]
        distinguishing_aspect: "TRAFFIC requires ≥1 TAGGED creative; with only an UPLOADED creative → ERR_NO_TAGGED_CREATIVE."
        test_recipe:
          setup: ["IO approved; line item with one UPLOADED creative"]
          setup_api_calls:
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 1000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker }
          trigger:
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NO_TAGGED_CREATIVE", "LineItem.${li_id}.status == DRAFT"]

      - name: double_void_snapshot_rejected
        claim_type: idempotency
        grounds: [state_machines.DeliverySnapshot.POSTED_to_VOIDED]
        distinguishing_aspect: "VOID is not idempotent: the second VOID of the same snapshot fails with ERR_INVALID_STATE and aggregates stay at the voided values."
        test_recipe:
          setup: ["LIVE line item; snapshot 5000/50 posted then voided"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-03", impressions: 5000, clicks: 50 }, as: Trafficker, captures: { snap_id: $.data.id } }
            - { call: "POST /delivery-snapshots/${snap_id}/transition", payload: { action: "VOID" }, as: Trafficker }
          trigger:
            - { call: "POST /delivery-snapshots/${snap_id}/transition", payload: { action: "VOID" }, as: Trafficker, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_STATE", "DeliverySnapshot.${snap_id}.status == VOIDED"]

      - name: line_item_auto_completes_at_goal
        claim_type: valid_transition
        grounds: [calculations.snapshot_spend, state_machines.LineItem.LIVE_to_COMPLETED]
        distinguishing_aspect: "Automatic transition: the snapshot that makes delivered_impressions exactly == goal_impressions (60000 + 40000 = 100000) flips the line item to COMPLETED and archives its LIVE creative."
        test_recipe:
          setup: ["LIVE line item goal 100000 @ 500 with LIVE creative; snapshot Aug2 60000/300 posted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-02", impressions: 60000, clicks: 300 }, as: Trafficker }
          trigger:
            - { call: "POST /delivery-snapshots", payload: { line_item_id: "${li_id}", snapshot_date: "2026-08-03", impressions: 40000, clicks: 200 }, as: Trafficker }
          assert:
            - "LineItem.${li_id}.delivered_impressions == 100000"
            - "LineItem.${li_id}.status == COMPLETED"
            - "Creative.${cr_id}.status == ARCHIVED"

      - name: make_good_reject_revise_loop
        claim_type: valid_transition
        grounds: [state_machines.MakeGood.REJECTED_to_PROPOSED]
        distinguishing_aspect: "REJECTED is terminal for the BillingManager but REVISE reopens negotiation: REJECTED → PROPOSED with decided_by_user_id cleared."
        test_recipe:
          setup: ["LIVE line item; IVT-only BREACH report (max credit 2500); make-good 1000 proposed by va-1, rejected by bm-2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: AdOpsManager }
            - { call: "POST /insertion-orders", payload: { advertiser_name: "Acme", total_budget_cents: 100000, flight_start: "2026-08-01", flight_end: "2026-08-31", billing_basis: "LOWER_OF" }, as: AdOpsManager, captures: { io_id: $.data.id } }
            - { call: "POST /line-items", payload: { io_id: "${io_id}", name: "LI1", goal_impressions: 100000, cpm_rate_cents: 500, start_date: "2026-08-01", end_date: "2026-08-31", pacing_mode: "EVEN" }, as: Trafficker, captures: { li_id: $.data.id } }
            - { call: "POST /insertion-orders/${io_id}/transition", payload: { action: "APPROVE" }, as: AdOpsManager }
            - { call: "POST /creatives", payload: { line_item_id: "${li_id}", name: "CR1", asset_url: "https://cdn.example.com/a.jpg", width: 300, height: 250 }, as: Trafficker, captures: { cr_id: $.data.id } }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "SUBMIT_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "PASS_QA" }, as: Trafficker }
            - { call: "POST /creatives/${cr_id}/transition", payload: { action: "TAG", ad_tag: "<script>t</script>" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "TRAFFIC" }, as: Trafficker }
            - { call: "POST /line-items/${li_id}/transition", payload: { action: "LAUNCH" }, as: Trafficker }
            - { call: "POST /verification-reports", payload: { line_item_id: "${li_id}", vendor: "IAS", period_start: "2026-08-01", period_end: "2026-08-07", measured_impressions: 100000, viewable_impressions: 80000, ivt_impressions: 5000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { vr_id: $.data.id } }
            - { call: "POST /make-goods", payload: { verification_report_id: "${vr_id}", kind: "CREDIT", credit_cents: 1000 }, as: VerificationAnalyst, as_user_id: "va-1", captures: { mg_id: $.data.id } }
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "REJECT" }, as: BillingManager, as_user_id: "bm-2" }
          trigger:
            - { call: "POST /make-goods/${mg_id}/transition", payload: { action: "REVISE" }, as: VerificationAnalyst, as_user_id: "va-1", captures: { st: $.data.status, dec: $.data.decided_by_user_id } }
