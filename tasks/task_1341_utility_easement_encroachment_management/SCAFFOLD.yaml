    description: "Record a vegetation violation"
    roles: [VegetationInspector]
    code: 201
    input: [species, observed_height_ft, location_within_zone]
    output: VegetationViolation
    side_effects: ["excess_height_ft computed", "zone.violation_count incremented", "zone may auto-transition to VIOLATION_DETECTED or REMEDIATION_REQUIRED"]

  - method: GET
    path: "/easement-cases/{caseId}/vegetation-zones/{zoneId}/violations"
    description: "List violations in a zone"
    roles: [VegetationInspector, RightOfWayAgent, DepartmentDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "VegetationViolation[]"
    side_effects: []

  - method: POST
    path: "/easement-cases/{caseId}/vegetation-zones/{zoneId}/violations/{violId}/notify"
