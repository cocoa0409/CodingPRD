  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Requests with X-User-Role / X-User-ID headers omitted fail authentication before any role or existence check."
        test_recipe:
          setup: ["one facility exists"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
          trigger:
            - { call: "GET /facilities/${fac}", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { err: $.data.error_id } }
          assert:
            - "with headers omitted: http 401, error_id == ERR_UNAUTHENTICATED"

      - name: vendor_cannot_finalize_invoice_returns_unauthorized
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "LaundryVendor is not in the finalize role list; denial precedes state checks (invoice stays PROVISIONAL)."
        test_recipe:
          setup: ["facility, unit, stock, par; manifest m1 DISPATCHED; invoice PROVISIONAL over m1"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LaundryVendor, as_user_id: "ven-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE and http status 403"

      - name: clerk_cannot_reconcile_other_unit_run
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_UNIT_OWNERSHIP]
        distinguishing_aspect: "UnitClerk identity is entity_backed by Unit: clerk of U1 reconciling U2's run fails ownership even though the role is correct for the endpoint."
        test_recipe:
          setup: ["facility; units U1 and U2 each with par on S1; U2's run r2 COMPLETED"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
