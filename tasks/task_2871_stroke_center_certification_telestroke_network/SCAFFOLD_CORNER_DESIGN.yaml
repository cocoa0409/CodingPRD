      - after submit ${qp_st1} == SUBMITTED, ${qp_var1} == CERTIFIED, ${qp_inc1} == 9 and ${qp_dtn1} == 66.67 (every attached row was FINALIZED, so the pool did not shrink)
      - ${qp_major1} == 0 — the auto-opened DTN_EXCEEDED deviation on Q3 is OPEN, not SUBSTANTIATED, so it carries no penalty
      - ${qp_comp1} == 82.33 — (0.4*66.67 + 0.35*100.00 + 0.25*100.00) = 86.668, no penalty, no volume credit at 9 abstractions, x 0.95 SPOKE multiplier = 82.3346 rounded half-up
      - after decide ${qp_dec2} == CONDITIONAL (70.0 <= 82.33 < 85.0), ${qp_st2} == ACCEPTED and ${qp_comp2} == ${qp_comp1} — decide never recomputes
      - '${qp_cert2} == CONDITIONAL while ${qp_pub2} == null: acceptance alone publishes nothing'
      - after publish ${qp_st3} == PUBLISHED with ${qp_pubat} == 2026-09-01T11:50:00Z
      - ${qp_pub3} == 66.7 — one decimal, round_half_up; truncation would publish 66.6
      - ${qp_pubwhen} == 2026-09-01T11:50:00Z and ${qp_ems3} == DIVERT_ADVISORY (a CONDITIONAL centre can never be ROUTINE)
  - name: screening_and_attested_eligibility_scores_diverge_on_the_same_row
    claim_type: variant_divergence
    grounds:
    - calculations.eligibility_score variants SCREENING and ATTESTED
    excluded_because:
      difficulty_instance: eligibility_score_screening_and_attested_diverge_on_window_penalty
      rationale: The §1.8 dual_variant_calc instance already holds documentation identical and moves only the clock, so the two variants diverge by exactly the window penalty and the board credit, with both stored values asserted; a corner divergence test would repeat it.
  - name: provisional_and_certified_compliance_rates_diverge_on_the_draft_pool
    claim_type: variant_divergence
    grounds:
    - calculations.measure_compliance_rate variants PROVISIONAL and CERTIFIED
    excluded_because:
      difficulty_instance: measure_compliance_rate_provisional_and_certified_diverge_on_draft_pool
      rationale: The §1.8 dual_variant_calc instance already pins the PROVISIONAL rate over the {DRAFT, FINALIZED} pool against the CERTIFIED rate over FINALIZED only, including the detachment of the leftover DRAFT rows at submission.
  - name: composite_score_couples_rates_penalties_volume_and_tier_multiplier
    claim_type: correct_result
    grounds:
    - calculations.composite_certification_score
    excluded_because:
      difficulty_instance: composite_certification_score_couples_three_rates_penalty_and_tier_multiplier
      rationale: The §1.8 combinatorial_formula instance already drives the four coupled factors together (three weighted rates, the capped deviation penalty, the volume credit tier and the facility tier multiplier) and pins the forbidden orderings; the composite value asserted in the publication corner test above is the light cross-check.
  - name: mean_dtn_excess_rounds_per_case_before_averaging
    claim_type: correct_result
    grounds:
    - calculations.dtn_excess_reporting
    excluded_because:
      difficulty_instance: dtn_excess_rounds_each_case_to_a_whole_percent_before_the_mean
      rationale: The §1.8 combinatorial_formula instance already contrasts the pinned per-case rounding with the forbidden pooled formula on a population chosen so the two answers differ.
  - name: door_to_needle_numerator_boundary_at_the_sixty_minute_target
    claim_type: threshold_boundary
    grounds:
    - calculations.abstraction_numerator_denominator numerator_for(STK_DTN_60)
    excluded_because:
      difficulty_instance: door_to_needle_numerator_boundary_at_sixty_and_sixty_one_minutes
      rationale: The §1.8 boundary_precision_check instance already tests door_to_needle_minutes at exactly 60 and 61, including the MAJOR DTN_EXCEEDED deviation that fires only on the second.
  - name: video_session_duration_boundary_at_one_hundred_eighty_seconds
    claim_type: threshold_boundary
    grounds:
    - calculations.video_session_validity MIN_VALID_SESSION_SEC 180
    excluded_because:
      difficulty_instance: video_session_validity_boundary_at_one_eighty_and_one_seventy_nine_seconds
      rationale: The §1.8 boundary_precision_check instance already tests a 179 second session (invalid, consult completion refused) against a 180 second session (valid, completion admitted) on the same consult.
  - name: projected_door_in_door_out_multiplies_only_the_transport_leg
    claim_type: correct_result
    grounds:
    - calculations.projected_door_in_door_out CONGESTION_BY_POSTURE and the pinned step order
    excluded_because:
      difficulty_instance: handoff_settlement_cascades_case_closure_origin_release_and_deviation
      rationale: The §1.8 transitive_cascade instance already computes the projection at a DIVERT_ADVISORY destination (congestion 1.25, ceil(35 x 1.25) = 44, projection 44 + 20 + 10 = 74) and asserts the forbidden alternative 82 is not produced; the ROUTINE-congestion arm is covered by the fork_paths corner test above.
- section: validations
  instances:
  - name: every_write_missing_the_x_user_id_header_is_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations priority 1 -> ERR_UNAUTHENTICATED (401)
    - roles (identity via X-User-ID)
    distinguishing_aspect: Priority 1 sits above EVERY other rule, so a request with no X-User-ID header must be 401 even when its body is perfectly valid AND even when it would otherwise fail a lower rule — the second call below carries a bad enum as well and must still report 401, not 422.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre exists.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          ua_ctr: $.data.id
      trigger:
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Northgate Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          ua1_id: $.data.error_id
          ua1_msg: $.data.message
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${ua_ctr}
          patient_ref: P-UA-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: AMBULANCE
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          ua2_id: $.data.error_id
          ua2_msg: $.data.message
      - call: GET /stroke-network/stroke-centers?limit=10&offset=0
        payload:
          limit: 10
          offset: 0
        as: ProgramCoordinator
      assert:
      - the X-User-ID header is OMITTED on both trigger writes
      - both return HTTP 401 with ${ua1_id} == ${ua2_id} == ERR_UNAUTHENTICATED
      - the second call would be a 422 ERR_INVALID_ENUM_VALUE if authenticated — priority 1 outranks priority 12
      - 'no new StrokeCenter and no CodeStrokeCase were created: the authenticated list still reports total_count 1'
  - name: an_undeclared_role_name_is_unauthenticated_while_a_declared_wrong_role_is_forbidden
    claim_type: priority_ordering
    grounds:
    - validations priority 2 -> ERR_UNAUTHENTICATED (401)
    - validations priority 5 -> ERR_FORBIDDEN_ROLE (403)
    - roles (the six declared role names)
    distinguishing_aspect: A role name that is not one of the six declared names is 401 at priority 2, whereas a perfectly declared role that simply is not on the endpoint's list is 403 at priority 5. Both requests are identical apart from the header value, so the pair isolates 'unrecognised identity' from 'recognised but unauthorised' — and a lookup that falls through to the role check would answer 403 for both.
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z; one SPOKE centre exists.
      - POST /stroke-network/code-strokes is restricted to EdPhysician.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          uk_ctr: $.data.id
      trigger:
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${uk_ctr}
          patient_ref: P-UK-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          last_known_well_at: '2026-09-01T07:40:00Z'
          arrival_mode: EMS
        as: StrokeChampion
        as_user_id: ed_ann
        captures:
          uk1_id: $.data.error_id
          uk1_msg: $.data.message
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${uk_ctr}
          patient_ref: P-UK-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          last_known_well_at: '2026-09-01T07:40:00Z'
          arrival_mode: EMS
        as: QualityAbstractor
        as_user_id: qa_bob
        captures:
          uk2_id: $.data.error_id
          uk2_msg: $.data.message
      - call: GET /stroke-network/code-strokes?center_id=${uk_ctr}&limit=10&offset=0
        payload:
          center_id: ${uk_ctr}
          limit: 10
          offset: 0
        as: ProgramCoordinator
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${uk_ctr}
          patient_ref: P-UK-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          uk_ok: $.data.id
          uk_st: $.data.status
      assert:
      - X-User-Role StrokeChampion gives HTTP 401 with ${uk1_id} == ERR_UNAUTHENTICATED at priority 2
      - X-User-Role QualityAbstractor gives HTTP 403 with ${uk2_id} == ERR_FORBIDDEN_ROLE at priority 5 — a real role, just not this endpoint's
      - the two responses differ in BOTH status and error_id even though the bodies are byte-identical
      - the list reports total_count 0 after both refusals
      - the same body as EdPhysician succeeds with ${uk_st} == ACTIVATED
  - name: a_second_neurologist_cannot_accept_a_consult_assigned_to_a_peer
    claim_type: violation_to_error
    grounds:
    - validations priority 8 -> ERR_NOT_CONSULT_OWNER (403)
    - calculations.consult_routing_selection STEP 2
    distinguishing_aspect: 'Priority 8 is an OWNERSHIP check, not a role check: the second neurologist holds the right role and a valid proxy credential on the same agreement, so only the assigned_neurologist_id comparison can refuse him. He must also be refused on /decline and /determine, and the rightful assignee must still be able to accept afterwards.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE agreement.
      - 'TWO board-certified ON_CALL Neurologists credentialed on that agreement: Ainsley roster_rank 10 and Baptiste roster_rank 20.'
