  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: part_inventory_reserved_conservation
        grounds:
          - state_machines.RepairOrder.PARTS_ALLOCATED_to_CANCELLED
          - entities.PartInventory.fields.reserved_quantity
        distinguishing_aspect: |
          Conserved quantity: PartInventory.reserved_quantity. Allocating parts increments
          reserved_quantity; cancelling the repair order releases them and decrements
          reserved_quantity back. Net change is zero.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Location with part inventory on_hand=5."
          setup_api_calls:
            - call: "POST /repair/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
