      - name: ratify_and_reopen_guards_on_round_and_cycle
        claim_type: error_triggerable
        grounds:
          - validations[priority 15 ERR_ROUND_NOT_COMPARED]
          - validations[priority 11 ERR_CYCLE_ALREADY_RATIFIED]
          - state_machines.ConsensusRound.COMPARED_to_RATIFIED
        distinguishing_aspect: |
          Ratification is fenced on both sides: ratifying an OPEN round returns
          ERR_ROUND_NOT_COMPARED 409, and once a round HAS been ratified the cycle can no longer be
          reopened — reopen returns ERR_CYCLE_ALREADY_RATIFIED 409 and reopen_count stays 0, so the
          IN_CONSENSUS -> DRAFT loop is closed for good.
        test_recipe:
          setup:
            - "SHORT chain with an OPEN round; both bodies have filed their PIT estimate but neither has submitted."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
