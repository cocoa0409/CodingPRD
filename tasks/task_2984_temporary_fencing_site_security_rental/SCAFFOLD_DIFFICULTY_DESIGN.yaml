          - state_machines.WorkOrder.PLANNED_to_SCHEDULED
          - entities.WorkOrder.fields.scheduled_end_utc
        distinguishing_aspect: |
          The occupied interval of a 5.75-hour order starting 2026-08-20T08:00:00Z is
          [08:00, 15:15) — the 90-minute travel buffer extends only the trailing edge
          — so a second order on the same crew is refused with
          ERR_CREW_WINDOW_CONFLICT 409 at 15:14:00Z and admitted at 15:15:00Z, where
          it schedules with scheduled_end_utc 2026-08-20T18:30:00Z. Buffering both
