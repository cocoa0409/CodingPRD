              captures: { smic_status: $.data.status, smic_base: $.data.base_fee_cents, smic_total: $.data.management_fee_total_cents }
          assert:
            - "Close response body: status == CLOSED, base_fee_cents == 384000, incentive_fee_cents == 0, management_fee_total_cents == 384000 (all present in the same response, no follow-up GET required)"

      - name: response_envelope_shape_on_success_and_error
        claim_type: response_envelope_contract
        grounds:
          - response_envelope
        distinguishing_aspect: "Every response carries meta.api_request_id + meta.api_request_timestamp; success uses response_type object|array with data payload; errors use response_type == error with data.error_id and data.message — the fixed §1.0 contract."
        test_recipe:
          setup: ["Empty database; one owner created successfully and one failing call issued"]
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Env Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { env_id: $.data.id }
          trigger:
            - call: "GET /mgmt/owners/${env_id}"
              payload: {}
              as: PortfolioManager
            - call: "GET /mgmt/owners/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PortfolioManager
              captures: { env_err: $.data.error_id }
          assert:
            - "Success GET: meta.api_request_id present, meta.api_request_timestamp is ISO8601, response_type == object, data.id == ${env_id}"
            - "Error GET: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"
