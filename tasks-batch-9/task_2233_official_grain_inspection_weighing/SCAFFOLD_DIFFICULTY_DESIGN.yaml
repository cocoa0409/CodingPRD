            - "GET /grain-inspection/samples/${smp} -> portions_consumed == 1 (down from 2), portions_available == 3, integrity_status == SEALED"
            - "GET /grain-inspection/certificates/${cert} -> status == VOIDED, fee_settlement_status == REVERSED"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents == 34500, credits_total_cents == 34500, open_balance_cents == 0"
            - "GET /grain-inspection/grading-results/${gr} -> status == FINAL (the grading determination is untouched; only protein content was invalidated)"
