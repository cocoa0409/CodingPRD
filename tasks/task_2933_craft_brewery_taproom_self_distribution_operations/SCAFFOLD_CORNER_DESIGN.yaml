            - call: "POST /distributor-appointments"
              payload: { state_license_id: "${lic_id}", distributor_name: "Evergreen Beverage Co", expected_state_license_version: "${lic_v}" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /state-licenses/${lic_id}"
              payload: {}
              as: BreweryAdmin
              captures: { lic_v2: $.data.version }
            - call: "POST /distributor-appointments"
              payload: { state_license_id: "${lic_id}", distributor_name: "Evergreen Beverage Co", expected_state_license_version: "${lic_v2}" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { appt_id: $.data.id }
          assert:
            - "YTD adjustment: HTTP 200 with lic_v_after == lic_v + 1"
            - "Proposal with the stale version: HTTP 412 with error_id == ERR_STALE_LICENSE_VERSION"
            - "GET /distributor-appointments?state_license_id=${lic_id} returns total_count == 0 right after the 412"
            - "lic_v2 == lic_v_after (the rejected proposal did not bump the licence)"
            - "Re-issued proposal: HTTP 201, DistributorAppointment.${appt_id}.state == PROPOSED, brand_scope == ALL_BRANDS, proposed_by_user_id == u_admin_1"
            - "StateLicense.${lic_id}.version == lic_v2 + 1 after the accepted proposal and active_appointment_count == 0 (PROPOSED does not yet count)"

