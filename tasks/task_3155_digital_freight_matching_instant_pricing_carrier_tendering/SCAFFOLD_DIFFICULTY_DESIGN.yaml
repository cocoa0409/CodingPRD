      - call: POST /v1/bookings/${booking_id}/invoice
        payload: {}
        as: Shipper
        as_user_id: ${shipper_id}
        captures:
          settlement_id: $.data.id
          settlement_v: $.data.version
      trigger:
      - call: POST /v1/carrier-settlements/${settlement_id}/payout
        payload:
          payout_mode: QUICK_PAY
          expected_settlement_version: ${settlement_v}
        as: PlatformAdmin
        captures:
          settlement_v2: $.data.version
      - call: POST /v1/loads/load_id/void
        payload:
          retry_idempotency_key: void-load-one-0002
        as: PlatformAdmin
      assert:
      - after the payout CarrierSettlement.${settlement_id}.settlement_status == PAID
      - Booking.${booking_id}.quick_pay_elected == true and Booking.${booking_id}.quick_pay_discount_cents == 7974
      - the void synthesizes a second settlement row with settlement_status == ACCRUED and reversal_of_settlement_id == "${settlement_id}"
      - the compensating row's net_payable_cents is the exact negation of the paid row's
      - 'GET /v1/carrier-settlements?carrier_id=${carrier_id} reports exactly 2 rows for the load: one PAID forward and one
        ACCRUED reversal'
