  # ===========================================================================
  - section: errors
    instances:

      - name: unauthenticated_when_role_header_missing_or_unknown_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors.ERR_UNAUTHENTICATED
          - roles.ProductionAdmin
        distinguishing_aspect: |
          Violation claim at the very top of the ladder. A request with no role header
          and a request naming a role that does not exist in §1.7 both answer
          ERR_UNAUTHENTICATED at 401 — not 403 and not 400 — and they do so even when
          the addressed path id does not exist, which proves priorities 1 and 2 are
          evaluated before the existence check at priority 5. The same request with a
          real but unprivileged role instead yields ERR_ROLE_FORBIDDEN at 403, which
          separates authentication from authorisation.
        test_recipe:
          setup:
            - "One production created normally; the negative calls below deliberately omit or corrupt the role header, and one addresses an id that does not exist."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: NO_ROLE_HEADER
              captures: { missing_err: $.data.error_id }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: Bystander
              captures: { unknown_role_err: $.data.error_id }
            - call: "GET /casting/productions/ffffffff-ffff-4fff-8fff-ffffffffffff"
              payload: {}
              as: NO_ROLE_HEADER
              captures: { missing_on_unknown_err: $.data.error_id }
            - call: "POST /casting/productions"
              payload: { title: "Sneaky S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: CastingDirector
              captures: { forbidden_err: $.data.error_id }
          assert:
            - "${missing_err} == ERR_UNAUTHENTICATED"
            - "HTTP 401 when the X-Role header is absent"
            - "${unknown_role_err} == ERR_UNAUTHENTICATED"
            - "HTTP 401 when the X-Role header names an undeclared role"
            - "${missing_on_unknown_err} == ERR_UNAUTHENTICATED"
            - "HTTP 401 (not 404) when the header is absent AND the id is unknown"
            - "${forbidden_err} == ERR_ROLE_FORBIDDEN"
            - "HTTP 403 for a real but unprivileged role"

      - name: pagination_limit_above_maximum_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations.priority_8
          - errors.ERR_INVALID_PAGINATION
          - endpoints.GET_/casting/casting-calls
        distinguishing_aspect: |
          Violation claim on the declared pagination bounds. limit 101 and offset -1 are
          both refused with ERR_INVALID_PAGINATION at 400, while limit exactly 100 and
          offset exactly 0 are accepted — so the boundary is inclusive at 100 and the
          error is the pagination-specific id rather than the generic
          ERR_INVALID_REQUEST that priority 7 would produce for a malformed body.
        test_recipe:
          setup:
            - "One production with two DRAFT casting calls, so the list has something to page over."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_1_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "DIGITAL_SUBMISSION", min_age: 18, max_age: 60, exclusivity_window_days: 30 }
              as: CastingDirector
              captures: { call_2_id: $.data.id }
          trigger:
            - call: "GET /casting/casting-calls"
              payload: { production_id: "${prod_id}", limit: 101, offset: 0 }
              as: CastingDirector
              captures: { over_limit_err: $.data.error_id }
            - call: "GET /casting/casting-calls"
              payload: { production_id: "${prod_id}", limit: 0, offset: 0 }
              as: CastingDirector
              captures: { zero_limit_err: $.data.error_id }
            - call: "GET /casting/casting-calls"
              payload: { production_id: "${prod_id}", limit: 10, offset: -1 }
              as: CastingDirector
              captures: { neg_offset_err: $.data.error_id }
            - call: "GET /casting/casting-calls"
              payload: { production_id: "${prod_id}", limit: 100, offset: 0 }
              as: CastingDirector
              captures: { ok_total: $.meta.total_count, ok_has_more: $.meta.has_more }
          assert:
            - "${over_limit_err} == ERR_INVALID_PAGINATION"
            - "${zero_limit_err} == ERR_INVALID_PAGINATION"
            - "${neg_offset_err} == ERR_INVALID_PAGINATION"
            - "HTTP 400 on all three out-of-bounds pagination requests"
            - "${ok_total} == 2"
            - "${ok_has_more} == false"

      - name: applicant_intake_against_unpublished_call_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_15
          - errors.ERR_CASTING_CALL_NOT_OPEN
          - state_machines.CastingCall.DRAFT_to_PUBLISHED
          - state_machines.CastingCall.PUBLISHED_to_CLOSED
        distinguishing_aspect: |
          Violation claim across the call's whole lifecycle: intake is refused with
          ERR_CASTING_CALL_NOT_OPEN at 409 both BEFORE publication and AFTER a director
          closes the call, and succeeds only in the PUBLISHED window between them. The
          same error id covers both ends, so a build that only guarded the DRAFT state
          would accept the third application.
        test_recipe:
          setup:
            - "One production with a single DRAFT REFERRAL call."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Harbour Nights S1", format_type: "DOCUSOAP", jurisdiction_code: "GA", season_number: 1, episode_order: 9, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 5000000, welfare_budget_cents: 2000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 60, exclusivity_window_days: 0 }
              as: CastingDirector
              captures: { call_id: $.data.id, call_initial: $.data.status }
          trigger:
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Too Early", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
              captures: { draft_err: $.data.error_id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
