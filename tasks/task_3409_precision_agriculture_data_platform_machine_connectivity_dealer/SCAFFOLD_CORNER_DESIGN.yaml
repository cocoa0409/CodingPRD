# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3409_precision_agriculture_data_platform_machine_connectivity_dealer
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: organization_create_applies_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.Organization.fields.right_to_repair_enabled
          - entities.Organization.fields.independent_session_max_minutes
          - response_envelope.pagination_defaults
        distinguishing_aspect: "An organization created with only name and region_code comes back 201 with right_to_repair_enabled false, independent_session_max_minutes 60, status ACTIVE, version 1, system id/created_at/updated_at, and the fixed envelope meta fields."
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-09-01T00:00:00Z; empty database (no clock-set call is made, which also pins the default-time claim)."
          setup_api_calls: []
          trigger:
            - &k_org
              call: "POST /agdata/organizations"
              payload: { name: "Prairie View Farms", region_code: "US-IA" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id and meta.api_request_timestamp are present"
            - "Organization.${org_id}.right_to_repair_enabled == false and independent_session_max_minutes == 60 (defaults applied)"
            - "Organization.${org_id}.status == ACTIVE and version == 1"
            - "Organization.${org_id}.created_at == \"2026-09-01T00:00:00Z\" — the server's startup default clock, no wall-clock fallback"

      - name: machine_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Machine.fields.lifecycle_status
          - entities.Machine.fields.connectivity_posture
          - endpoints.POST_/agdata/machines
        distinguishing_aspect: "lifecycle_status, modem_status, connectivity_posture and version are system/computed fields; a client that smuggles lifecycle_status IN_SERVICE and version 99 into the create body is ignored — the machine is REGISTERED / UNPROVISIONED / OFFLINE at version 1."
        test_recipe:
          setup:
            - "One organization, one dealer, and one cleanly registered machine (its create is the anchor reused by later instances)."
          setup_api_calls:
            - &k_clock
              call: "POST /agdata/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - *k_org
            - &k_dealer
              call: "POST /agdata/dealers"
              payload: { dealer_code: "D-100", name: "River Valley Equipment", region_code: "US-IA", service_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - &k_machine
              call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0001", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0001", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { machine_id: $.data.id }
          trigger:
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0001-SMUGGLED", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0001-SMUGGLED", manufacture_date: "2025-09-01", lifecycle_status: "IN_SERVICE", modem_status: "PROVISIONED", connectivity_posture: "CONNECTED", version: 99 }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { machine2_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Machine.${machine2_id}.lifecycle_status == REGISTERED and modem_status == UNPROVISIONED"
            - "Machine.${machine2_id}.connectivity_posture == OFFLINE and version == 1"
            - "Machine.${machine2_id}.provisioning_attempts == 0 and active_license_count == 0"

      - name: machine_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/agdata/machines/{id}
          - errors.ERR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated machine id returns 404 ERR_NOT_FOUND with the error envelope (response_type error, data.error_id and data.message), not a 400 or a null data object."
        test_recipe:
          setup:
            - "One organization (caller context only)."
          setup_api_calls:
            - *k_clock
            - *k_org
          trigger:
            - call: "GET /agdata/machines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: machines_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/agdata/machines
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three machines in one org, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; the lifecycle_status=REGISTERED filter matches all three."
        test_recipe:
          setup:
            - "One organization with three machines."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0002", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0002", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0003", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0003", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /agdata/machines"
              payload: { organization_id: "${org_id}", limit: 2, offset: 0 }
              as: GrowerManager
              as_user_id: "${org_id}"
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /agdata/machines?organization_id=${org_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /agdata/machines?organization_id=${org_id}&lifecycle_status=REGISTERED returns 3 rows"
            - "GET /agdata/machines?organization_id=${org_id} with no pagination params returns 3 rows (defaults limit 10, offset 0)"

      - name: data_plan_create_sets_tier_price_and_pending_state
        claim_type: Creation
        grounds:
          - entities.DataPlan.fields.monthly_price_cents
          - calculations.plan_proration
          - endpoints.POST_/agdata/data-plans
        distinguishing_aspect: "Plan creation derives monthly_price_cents from TIER_PRICE_CENTS (STANDARD -> 60000, UNLIMITED -> 120000), starts PENDING with used_mb 0 and usage_posture NORMAL, and stores the client's proration_method immutably."
        test_recipe:
          setup:
            - "One organization with two machines."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - call: "POST /agdata/machines"
              payload: { organization_id: "${org_id}", serial_number: "SN-0002", model_code: "M8R", selling_dealer_id: "${dealer_id}", modem_imei: "IMEI-0002", manufacture_date: "2025-09-01" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { machine2_id: $.data.id }
          trigger:
            - &k_plan_std
              call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", tier: "STANDARD", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine2_id}", tier: "UNLIMITED", proration_method: "THIRTY_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan2_id: $.data.id }
          assert:
            - "DataPlan.${plan_id}.monthly_price_cents == 60000 and status == PENDING and used_mb == 0 and usage_posture == NORMAL"
            - "DataPlan.${plan2_id}.monthly_price_cents == 120000 and proration_method == THIRTY_DAY"

      - name: second_plan_per_machine_rejected
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_PLAN_ALREADY_EXISTS
          - validations[priority=8]
          - endpoints.POST_/agdata/data-plans
        distinguishing_aspect: "The one-plan-per-machine constraint counts PENDING, ACTIVE and SUSPENDED alike: a second create for a machine whose first plan is still PENDING already fails with 409 ERR_PLAN_ALREADY_EXISTS."
        test_recipe:
          setup:
            - "One organization, one machine, one PENDING plan."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
          trigger:
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", tier: "BASIC", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PLAN_ALREADY_EXISTS"
            - "GET /agdata/data-plans?machine_id=${machine_id} returns exactly 1 row"

      - name: prescription_create_on_draft_field_rejected
        claim_type: Parent Relationships
        grounds:
          - errors.ERR_FIELD_NOT_ACTIVE
          - state_machines.FieldBoundary
          - endpoints.POST_/agdata/prescriptions
        distinguishing_aspect: "A prescription may only attach to an ACTIVE field: creating against a DRAFT field (which exists, so this is not a 404) fails 409 ERR_FIELD_NOT_ACTIVE and leaves the field version untouched."
        test_recipe:
          setup:
            - "One organization with a machine and a field still in DRAFT (version 1)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - &k_field
              call: "POST /agdata/field-boundaries"
              payload: { organization_id: "${org_id}", name: "North 40", season_year: 2026, area_hectares: 50.00 }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { field_id: $.data.id, field_v: $.data.version }
          trigger:
            - call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "CORN", zones: [{ zone_id: "z1", rate_l_per_ha: 3.00, area_ha: 10.00 }], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z", expected_field_boundary_version: "${field_v}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FIELD_NOT_ACTIVE"
            - "GET /agdata/field-boundaries/${field_id} still shows version == 1"
            - "GET /agdata/prescriptions?field_boundary_id=${field_id} returns 0 rows"

      - name: field_archive_with_open_prescription_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.FieldBoundary.ACTIVE_to_ARCHIVED
          - errors.ERR_FIELD_HAS_OPEN_PRESCRIPTIONS
        distinguishing_aspect: "Archive is blocked while any prescription of the field is DRAFT, APPROVED or SENT; a single DRAFT prescription is enough to fail with 409 ERR_FIELD_HAS_OPEN_PRESCRIPTIONS."
        test_recipe:
          setup:
            - "One ACTIVE field with one DRAFT prescription."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_field
            - &k_field_act
              call: "POST /agdata/field-boundaries/${field_id}/activate"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { field_v2: $.data.version }
            - &k_rx
              call: "POST /agdata/prescriptions"
              payload: { organization_id: "${org_id}", field_boundary_id: "${field_id}", machine_id: "${machine_id}", crop_type: "SOY", zones: [{ zone_id: "z1", rate_l_per_ha: 3.00, area_ha: 10.00 }], valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z", expected_field_boundary_version: "${field_v2}" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /agdata/field-boundaries/${field_id}/archive"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FIELD_HAS_OPEN_PRESCRIPTIONS"
            - "FieldBoundary.${field_id}.status remains ACTIVE"

      - name: consent_ticket_create_stamps_72h_expiry
        claim_type: Creation
        grounds:
          - entities.ConsentTicket.fields.expires_at
          - endpoints.POST_/agdata/consent-tickets
        distinguishing_aspect: "A ticket created at 2026-09-01T00:00:00Z gets expires_at exactly 2026-09-04T00:00:00Z (CONSENT_TTL_HOURS 72) and starts REQUESTED with granted_at null."
        test_recipe:
          setup:
            - "One organization with a machine; dealer requests a REMOTE_DIAGNOSTIC ticket."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
          trigger:
            - &k_diag_ticket
              call: "POST /agdata/consent-tickets"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", ticket_type: "REMOTE_DIAGNOSTIC", requester_ref_id: "${dealer_id}" }
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { dticket_id: $.data.id }
          assert:
            - "ConsentTicket.${dticket_id}.status == REQUESTED and granted_at is null"
            - "ConsentTicket.${dticket_id}.expires_at == \"2026-09-04T00:00:00Z\""

      - name: delivery_create_mints_platform_consent_ticket
        claim_type: Creation
        grounds:
          - entities.UpdateDelivery.fields.consent_ticket_id
          - state_machines.UpdateDelivery
          - endpoints.POST_/agdata/update-deliveries
        distinguishing_aspect: "Scheduling a delivery atomically mints its SOFTWARE_UPDATE consent ticket: the delivery response's consent_ticket_id resolves to a REQUESTED ticket whose requester_ref_id is the literal 'platform'."
        test_recipe:
          setup:
            - "Fully connected, dealer-activated machine; a PUBLISHED package."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - &k_prov_begin
              call: "POST /agdata/machines/${machine_id}/provision-modem"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - &k_prov_ok
              call: "POST /agdata/machines/${machine_id}/modem-provisioning-events"
              payload: { outcome: "PROVISION_SUCCEEDED" }
              as: System
            - *k_plan_std
            - &k_plan_act
              call: "POST /agdata/data-plans/${plan_id}/activate"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - &k_mact
              call: "POST /agdata/machines/${machine_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - &k_pkg
              call: "POST /agdata/software-packages"
              payload: { package_code: "FW-10", target_model_code: "M8R", firmware_version: "10.2.0", size_mb: 800, mandatory: false }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - &k_pkg_pub
              call: "POST /agdata/software-packages/${pkg_id}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - &k_delivery
              call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine_id}", package_id: "${pkg_id}" }
              as: PlatformAdmin
              captures: { delivery_id: $.data.id, ticket_id: $.data.consent_ticket_id }
            - call: "GET /agdata/consent-tickets/${ticket_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { tt: $.data.ticket_type, tr: $.data.requester_ref_id, ts: $.data.status }
          assert:
            - "UpdateDelivery.${delivery_id}.status == AWAITING_CONSENT"
            - "tt == \"SOFTWARE_UPDATE\" and tr == \"platform\" and ts == \"REQUESTED\""
            - "ConsentTicket.${ticket_id}.machine_id == ${machine_id}"

      - name: plan_create_with_out_of_enum_tier_rejected
        claim_type: Type Constraints
        grounds:
          - entities.DataPlan.fields.tier
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "tier is a closed enum {BASIC, STANDARD, UNLIMITED}; a value like PREMIUM is a 400 ERR_INVALID_REQUEST at priority 3 — before any existence or business check — and persists nothing."
        test_recipe:
          setup:
            - "One organization with one machine."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
          trigger:
            - call: "POST /agdata/data-plans"
              payload: { organization_id: "${org_id}", machine_id: "${machine_id}", tier: "PREMIUM", proration_method: "CALENDAR_DAY" }
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /agdata/data-plans?machine_id=${machine_id} returns 0 rows"

      - name: dealer_get_restricted_to_self_or_admin
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/agdata/dealers/{id}
          - errors.ERR_DATA_ACCESS_DENIED
        distinguishing_aspect: "DealerTechnician identity is entity-backed: X-User-ID equal to the dealer id may read it, any other dealer id gets 403 ERR_DATA_ACCESS_DENIED."
        test_recipe:
          setup:
            - "Two dealers A and B."
          setup_api_calls:
            - *k_clock
            - *k_dealer
            - call: "POST /agdata/dealers"
              payload: { dealer_code: "D-200", name: "Plains Agri Supply", region_code: "US-KS", service_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { dealer2_id: $.data.id }
          trigger:
            - call: "GET /agdata/dealers/${dealer_id}"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { d_name: $.data.name }
            - call: "GET /agdata/dealers/${dealer_id}"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer2_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the self-read returns 200 with d_name == \"River Valley Equipment\""
            - "the cross-dealer read returns 403 and error_id == ERR_DATA_ACCESS_DENIED"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: modem_provisioning_event_from_unprovisioned_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Machine.PROVISIONING_to_PROVISIONED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "modem-provisioning-events only exists from PROVISIONING; reporting an outcome while the modem is still UNPROVISIONED fails 409 ERR_INVALID_STATE_TRANSITION and does not change modem_status."
        test_recipe:
          setup:
            - "One machine with an UNPROVISIONED modem."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
          trigger:
            - call: "POST /agdata/machines/${machine_id}/modem-provisioning-events"
              payload: { outcome: "PROVISION_SUCCEEDED" }
              as: System
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /agdata/machines/${machine_id} shows modem_status == UNPROVISIONED and provisioning_attempts == 0"

      - name: provision_begin_while_provisioning_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Machine.UNPROVISIONED_to_PROVISIONING
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "provision-modem exists only from UNPROVISIONED or PROVISION_FAILED; calling it while already PROVISIONING is a 409 and does not consume another attempt."
        test_recipe:
          setup:
            - "One machine whose modem is PROVISIONING (one begin already done, attempts == 1)."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
          trigger:
            - call: "POST /agdata/machines/${machine_id}/provision-modem"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "Machine.${machine_id}.provisioning_attempts remains 1"

      - name: machine_activate_twice_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Machine.REGISTERED_to_ACTIVATED
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Activation exists only from REGISTERED; repeating the dealer handshake on an ACTIVATED machine fails 409 and leaves activating_dealer_id and activated_at untouched."
        test_recipe:
          setup:
            - "Fully provisioned machine with ACTIVE plan, already dealer-activated once."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_mact
          trigger:
            - call: "POST /agdata/machines/${machine_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "Machine.${machine_id}.lifecycle_status remains ACTIVATED"

      - name: plan_resume_from_active_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DataPlan.SUSPENDED_to_ACTIVE
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Resume is only defined from SUSPENDED; calling it on an already ACTIVE plan is a 409, not a no-op success."
        test_recipe:
          setup:
            - "One ACTIVE plan."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_plan_std
            - *k_plan_act
          trigger:
            - call: "POST /agdata/data-plans/${plan_id}/resume"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "DataPlan.${plan_id}.status remains ACTIVE"

      - name: prescription_send_from_draft_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Prescription.APPROVED_to_SENT
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "send-to-machine exists only from APPROVED; sending a DRAFT prescription fails 409 and does not touch the field's SENT lineage."
        test_recipe:
          setup:
            - "ACTIVE field with one DRAFT prescription; fully connected machine."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - *k_plan_std
            - *k_plan_act
            - *k_field
