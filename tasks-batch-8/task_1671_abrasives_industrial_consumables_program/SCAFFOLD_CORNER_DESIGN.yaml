  # ============================================================ calculations
  - section: calculations
    instances:
      - name: fefo_waterfall_split_allocation
        claim_type: correct_result
        grounds:
          - "calculations.fefo_allocation"
          - "entities.Release.fields.allocations"
        distinguishing_aspect: "FEFO ranks by expiry_date ASC (then manufacture_date, then created_at — never id) and the waterfall SPLITS across lots: the earlier-expiring lot is drained to zero before the next is touched."
        test_recipe:
          setup:
            - "BONDED product rpm 6000, shelf 6 months EXACT_DAY; contract ACTIVE (escalation 0); blanket order committed 10 OPEN; release qty 6 scheduled 2026-08-15"
            - "Lot L1 manufactured 2026-03-01 (expiry 2026-09-01) qty 3; lot L2 manufactured 2026-03-10 (expiry 2026-09-10) qty 7 — both eligible for ship 2026-08-15"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "FF-1", name: "FEFO Wheel", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 6, shelf_life_policy: "EXACT_DAY" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-FF", contract_number: "C-FF", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-F1", manufacture_date: "2026-03-01", qty_received: 3 }
              as: AccountManager
              captures: { l1_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-F2", manufacture_date: "2026-03-10", qty_received: 7 }
              as: AccountManager
              captures: { l2_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 6, scheduled_ship_date: "2026-08-15", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
          trigger:
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
              captures: { alloc: $.data.allocations, rel_st: $.data.status }
            - call: "GET /api/lots/${l1_id}"
              as: AccountManager
              captures: { l1_qoh: $.data.qty_on_hand, l1_st: $.data.status }
            - call: "GET /api/lots/${l2_id}"
