# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Waxing Studio Membership — 9 rule_ids x 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7.
# Default clock at server startup = 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_charge_deposit_provisional_vs_final_diverge
        grounds:
          - calculations.reservation_charge
          - state_machines.Reservation.UNSETTLED_to_DEPOSIT_HELD
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
          - entities.Reservation.fields.charged_amount_cents
          - entities.Reservation.fields.deposit_held_cents
        distinguishing_aspect: |
          On the Reservation domain: the provisional_quote variant records the held
          deposit (1000) at booking while the final_charge variant bills list_price
          minus the held deposit (4500-1000=3500) at completion; the two variants
          produce different cents for identical reservation data.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T12:00:00Z; one location (deposit 1000), one room, one cert tech, one 30-min Brazilian service list_price 4500."
            - "A member booked DEPOSIT for 2026-06-20T10:00:00Z (deposit_held_cents=1000, charged_amount_cents provisional=1000), then checked in and completed."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Downtown", state_code: "CA", deposit_required_cents: 1000 }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Brazilian", duration_minutes: 30, list_price_cents: 4500, buffer_minutes: 5, credit_cost: 1, intro_eligible: true }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room 1" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tia", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Dora", email: "dora@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-20T10:00:00Z", payment_method: "DEPOSIT", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id, res_dep: $.data.deposit_held_cents, res_prov: $.data.charged_amount_cents }
            - call: "POST /studio/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /studio/reservations/${res_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { final_charge: $.data.charged_amount_cents }
          assert:
            - "Reservation.${res_id}.deposit_held_cents == 1000"
            - "Reservation.${res_id}.charged_amount_cents == 3500"
            - "Reservation.${res_id}.settlement_status == PAID"
            - "Reservation.${res_id}.booking_status == COMPLETED"

      - name: membership_cancel_par_value_not_prorated
        grounds:
          - calculations.membership_cancel_valuation
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - entities.Member.fields.wallet_credit_cents
          - entities.Membership.fields.credit_balance
        distinguishing_aspect: |
          On the Membership domain: par_value_forfeit converts the 5 surviving
          credits to 500 wallet cents (5 * CREDIT_PAR_CENTS), whereas the prorated_refund
          interpretation would compute 4000 cents from the unused monthly fee; the
          production path yields 500, not 4000.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T12:00:00Z; one location; one member with an ACTIVE PLUS membership granted 5 credits (monthly_credit_grant=5, monthly_fee 6000), no bookings, cycle just anchored."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Uptown", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Mae", email: "mae@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 5, monthly_fee_cents: 6000, max_rollover_credits: 2 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v: $.data.version, bal: $.data.credit_balance }
          trigger:
            - call: "POST /studio/memberships/${mbr_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { final_status: $.data.status }
          assert:
            - "Membership.${mbr_id}.status == CANCELLED"
            - "Membership.${mbr_id}.credit_balance == 0"
            - "Member.${mem_id}.wallet_credit_cents == 500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deposit_gate_combinatorial_three_inputs
        grounds:
          - calculations.bookable_credit_check
          - validations[priority=11]
          - entities.Member.fields.no_show_strike_count
          - entities.Membership.fields.tier
          - errors[ERR_DEPOSIT_REQUIRED]
        distinguishing_aspect: |
          Mode (a): require_deposit is the non-linear AND of three inputs
          (no_show_strike_count>=2, payment_method==CREDIT, tier!=UNLIMITED); with
          exactly 2 active strikes on a PLUS member, a CREDIT booking is rejected
          ERR_DEPOSIT_REQUIRED while the same member booking DEPOSIT succeeds.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; location, room, cert tech, 30-min service credit_cost 1."
            - "Member with ACTIVE PLUS membership (8 credits) and 2 ACTIVE no-show strikes (booked two DEPOSIT visits then marked both no-show)."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Strikeville", state_code: "TX", deposit_required_cents: 1000 }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Brow", duration_minutes: 30, list_price_cents: 2000, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room A" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Bea", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Sia", email: "sia@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 8, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v: $.data.version }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "DEPOSIT", expected_room_version: "${room_v0}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res1_id: $.data.id, room_v1: $.data.version }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T11:00:00Z", payment_method: "DEPOSIT", expected_room_version: "${room_v1}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res2_id: $.data.id, room_v2: $.data.version }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/reservations/${res1_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/reservations/${res2_id}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "GET /studio/memberships/${mbr_id}"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { mbr_v2: $.data.version }
          trigger:
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-17T10:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v2}", expected_membership_version: "${mbr_v2}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_DEPOSIT_REQUIRED"
            - "Member.${mem_id}.no_show_strike_count == 2"

      - name: retail_net_round_per_unit_then_sum
        grounds:
          - calculations.retail_net
          - state_machines.RetailSale.PENDING_to_CONFIRMED
          - entities.RetailSale.fields.net_cents
          - entities.RetailSale.fields.discount_cents
        distinguishing_aspect: |
          Mode (b): pinned round-per-unit-then-sum. unit_price 1295, pct 0.10, qty 3
          gives per_unit=round_half_up(129.5)=130, discount=130*3=390, net=3495;
          the sum-then-round path would give 3496 — the scaffold pins 3495.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; location, room, cert tech, 30-min service; product unit_price 1295 pct 0.10 stock 100."
            - "ACTIVE member (no membership, so member_discount not applied? — must have ACTIVE membership for discount). Buyer holds an ACTIVE membership so member_discount_pct applies; WALK_IN reservation completed so retail can confirm."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Retailtown", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Underarm", duration_minutes: 30, list_price_cents: 1800, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/products"
              payload: { name: "Smooth Wash", unit_price_cents: 1295, member_discount_pct: 0.10, stock_qty: 100 }
              as: StudioAdmin
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room R" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Rae", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Pia", email: "pia@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 4, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /studio/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/reservations/${res_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/retail-sales"
              payload: { member_id: "${mem_id}", reservation_id: "${res_id}", product_id: "${prod_id}", quantity: 3 }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /studio/retail-sales/${sale_id}/confirm"
              payload: { expected_product_version: "${prod_v}" }
              as: FrontDesk
              captures: { net: $.data.net_cents }
          assert:
            - "RetailSale.${sale_id}.gross_cents == 3885"
            - "RetailSale.${sale_id}.discount_cents == 390"
            - "RetailSale.${sale_id}.net_cents == 3495"
            - "RetailSale.${sale_id}.status == CONFIRMED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_active_freeze_unfreeze_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Membership.fields.credit_balance
          - entities.Membership.fields.frozen_cycle_credits
        distinguishing_aspect: |
          On the Membership entity: a cycle ACTIVE->FROZEN->ACTIVE. Freeze parks
          the 4-credit balance to 0 (FREEZE_PARK -4) and unfreeze restores it
          (UNFREEZE_RESTORE +4) returning credit_balance to 4 — a true loop, not a
          linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; one ACTIVE PLUS membership with 4 credits."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Freezetown", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Fia", email: "fia@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 4, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/memberships/${mbr_id}/freeze"
              payload: { freeze_days: 30 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { frozen_bal: $.data.credit_balance }
          trigger:
            - call: "POST /studio/memberships/${mbr_id}/unfreeze"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { restored_bal: $.data.credit_balance }
          assert:
            - "Membership.${mbr_id}.credit_balance == 4"
            - "Membership.${mbr_id}.status == ACTIVE"
            - "Membership.${mbr_id}.frozen_cycle_credits == 0"

      - name: reservation_parallel_booking_and_settlement_axes
        grounds:
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
          - state_machines.Reservation.UNSETTLED_to_CREDIT_HELD
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
          - entities.Reservation.fields.booking_status
          - entities.Reservation.fields.settlement_status
        distinguishing_aspect: |
          On the Reservation entity: booking_status (BOOKED->CHECKED_IN->COMPLETED)
          and settlement_status (CREDIT_HELD->PAID) are independent axes — at
          check-in the booking axis advances to CHECKED_IN while settlement stays
          CREDIT_HELD; only completion drives settlement to PAID.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; location, room, cert tech, 30-min service credit_cost 1; ACTIVE PLUS membership 8 credits; a CREDIT reservation booked for 2026-06-16T10:00:00Z."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Paralleltown", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Bikini", duration_minutes: 30, list_price_cents: 3000, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room P" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Vee", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 8, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v: $.data.version }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v}", expected_membership_version: "${mbr_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id, sett0: $.data.settlement_status }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:45:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { book1: $.data.booking_status, sett1: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.booking_status == CHECKED_IN"
            - "Reservation.${res_id}.settlement_status == CREDIT_HELD"
            - "Reservation.${res_id}.credits_held == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: membership_cancel_depth3_cascade
        grounds:
          - state_machines.Membership.ACTIVE_to_CANCELLED
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - state_machines.Reservation.CREDIT_HELD_to_REFUNDED
          - entities.Member.fields.wallet_credit_cents
          - entities.CreditLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth-3 chain originating from membership cancel: cancel Membership (A)
          -> its open CREDIT Reservation flips to CANCELLED (B); that cancel writes
          a REFUND ledger entry restoring 1 credit to the membership balance (C);
          the membership's restored balance is then forfeited to wallet at par (D).
          Each hop is caused by the prior hop, not by the cancel directly.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; ACTIVE PLUS membership with 8 credits; one CREDIT reservation BOOKED for 2026-06-25T10:00:00Z (>24h away), so 1 credit held, balance 7."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Cascadetown", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "FullLeg", duration_minutes: 45, list_price_cents: 6000, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room C" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Cam", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Cleo", email: "cleo@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 8, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v: $.data.version }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-25T10:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v}", expected_membership_version: "${mbr_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /studio/memberships/${mbr_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { fin_status: $.data.status }
          assert:
            - "Membership.${mbr_id}.status == CANCELLED"
            - "Membership.${mbr_id}.credit_balance == 0"
