        distinguishing_aspect: |
          The mortgage named in a cure election must encumber the noticed lease, so a perfectly valid
          mortgage id belonging to another lease is a 422 mismatch rather than a 404: the row exists, it
          simply is not on this leasehold. The refusal must leave both notices and both mortgages
          untouched, and the correct election then moves only lease A's mortgage to CURING.
