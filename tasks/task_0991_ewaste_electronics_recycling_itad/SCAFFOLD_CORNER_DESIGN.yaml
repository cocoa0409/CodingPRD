            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
