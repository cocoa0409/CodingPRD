              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "co@x.com", full_name: "CO P", birth_date: "1980-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 100000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /plan-years/${py_id}/settle"
              payload: {}
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}/ledger-entries"
              payload: {}
              as: PlanAdmin
          assert:
            - "Account.${acc_id}.funding_status == CLOSED and forfeited_cents == 34000 (100000 - 66000)"
            - "GET /accounts/${acc_id}/ledger-entries shows one CARRYOVER_OUT entry with amount_cents == 66000"
            - "GET /accounts?carryover_source_account_id=${acc_id} returns one new Account with carried_in_cents == 66000 (second hop created it)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_segregation_on_disburse
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        distinguishing_aspect: |
          Category pair state (p6 ERR_INVALID_STATE) vs business_safety (p7 ERR_SEGREGATION_OF_DUTIES):
          a batch whose member claim has since been VOIDED (no longer APPROVED) AND whose disburser
          equals the adjudicator must return ERR_INVALID_STATE — the lower-priority state check wins over
          the duties check.
        test_recipe:
          setup:
            - "A batch B references claim C while C is APPROVED (adjudicator adj-1)."
            - "C is then VOIDED (APPROVED->VOIDED) by adj-1 before B is disbursed; B is disbursed by adj-1 (also the adjudicator), so both the state and segregation checks would fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p5a@x.com", full_name: "P5a", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 200000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 80000, substantiated: true }
              as: PlanAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /reimbursement-batches"
              payload: { participant_id: "${p_id}", claim_ids: ["${claim_id}"] }
              as: FundDisburser
              as_user_id: "disb-1"
              captures: { batch_id: $.data.id }
            - call: "POST /claims/${claim_id}/void"
              payload: {}
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: FundDisburser
              captures: { acc_v: $.data.version }
          trigger:
            - call: "POST /reimbursement-batches/${batch_id}/disburse"
              payload: { expected_account_version: "${acc_v}" }
              as: FundDisburser
              as_user_id: "adj-1"
          assert:
            - "POST /reimbursement-batches/${batch_id}/disburse returns 409 ERR_INVALID_STATE (claim VOIDED, not APPROVED; state p6 beats segregation p7)"

      - name: account_hold_beats_insufficient_funds_on_disburse
        grounds:
          - validations[priority=8]
          - validations[priority=15]
        distinguishing_aspect: |
          Category pair business_safety (p8 ERR_ACCOUNT_ON_HOLD) vs business_fiscal (p15
          ERR_INSUFFICIENT_FUNDS) — a different pairing from the sibling instance: an account that is
          BOTH on a compliance hold AND has insufficient cash for the next claim must return
          ERR_ACCOUNT_ON_HOLD (p8 wins).
        test_recipe:
          setup:
            - "Participant P owns an ACTIVE HEALTH_FSA, elected 60000, auto_adjudication_threshold_cents=100000."
            - "Both claims are APPROVED while the balance is full: C1 (unsubstantiated, 50000, reimbursable 50000) and C2 (substantiated, 40000, reimbursable 40000)."
            - "C1 is then reimbursed, putting the account on HELD and leaving available 10000; C2's stored reimbursable 40000 now exceeds available 10000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "p5b@x.com", full_name: "P5b", birth_date: "1990-01-01" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HEALTH_FSA", elected_amount_cents: 60000, auto_adjudication_threshold_cents: 100000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "MEDICAL", claimed_amount_cents: 50000, substantiated: false }
              as: Participant
              as_user_id: "${p_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /claims/${c1_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-02", expense_category: "DENTAL", claimed_amount_cents: 40000, substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /claims/${c2_id}/adjudicate"
              payload: { decision: "APPROVE" }
