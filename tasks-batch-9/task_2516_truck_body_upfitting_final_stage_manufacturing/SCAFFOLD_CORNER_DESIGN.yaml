              captures: { ch_v: "$.data.version" }
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5033", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
