            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
          trigger:
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "WITHDRAW" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { ec: $.data.enrolled_count }
          assert:
            - "Trial.${trial_id}.enrolled_count == 0"
            - "the assigned arm's assigned_count == 0 (restored to pre-randomize value)"
            - "Enrollment.${enr_id}.enrollment_status == WITHDRAWN"

      - name: ci_unrelated_adjudication_restores_safety_clear
        grounds:
          - state_machines.Enrollment.CLEAR_to_FLAGGED
          - state_machines.Enrollment.FLAGGED_to_CLEAR
          - state_machines.AdverseEvent.UNDER_REVIEW_to_ADJUDICATED_UNRELATED
          - entities.Enrollment.fields.safety_status
        distinguishing_aspect: "A different conserved quantity (safety occupancy, Enrollment.safety_status) than the allocation-count invariant: TRIAGE flags the enrollment (CLEAR->FLAGGED) and adjudicate-UNRELATED with no other open AE must restore it (FLAGGED->CLEAR), leaving safety_status == CLEAR exactly as before the event."
        test_recipe:
          setup:
            - "A RANDOMIZED enrollment with one MODERATE AE that has been triaged (enrollment FLAGGED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Sponsor
            - call: "POST /trials"
              payload: { title: "SafetyInv Trial", target_enrollment: 5, randomization_method: "SIMPLE" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { trial_id: $.data.id }
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "TREATMENT", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/arms"
              payload: { name: "PLACEBO", allocation_weight: 1 }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /trials/${trial_id}/consent-documents"
              payload: { body_hash: "h1" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { doc_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "PROTOCOL" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { prot_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${prot_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "POST /trials/${trial_id}/irb-reviews"
              payload: { scope: "CONSENT", consent_document_id: "${doc_id}" }
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { cons_review_id: $.data.id }
            - call: "POST /trials/${trial_id}/irb-reviews/${cons_review_id}/decide"
              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "irb-1"
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: Sponsor
              as_user_id: "sponsor-1"
              captures: { tv_act: $.data.version }
            - call: "POST /trials/${trial_id}/consent-documents/${doc_id}/activate"
              payload: { expected_trial_version: "${tv_act}" }
              as: Sponsor
              as_user_id: "sponsor-1"
            - call: "POST /participants"
              payload: { full_name: "P SInv", age_years: 40, weight_kg: 80, hba1c: 6.0 }
              as: CoordinatorStaff
              captures: { participant_id: $.data.id }
            - call: "POST /trials/${trial_id}/screen-participant"
              payload: { participant_id: "${participant_id}" }
              as: CoordinatorStaff
              captures: { screening_id: $.data.id }
            - call: "POST /enrollments"
              payload: { screening_id: "${screening_id}" }
              as: CoordinatorStaff
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "CONSENT", consent_document_id: "${doc_id}" }
              as: CoordinatorStaff
            - call: "GET /trials/${trial_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { tv_r: $.data.version }
            - call: "POST /enrollments/${enr_id}/transition"
              payload: { action: "RANDOMIZE", expected_trial_version: "${tv_r}" }
              as: CoordinatorStaff
            - call: "POST /enrollments/${enr_id}/adverse-events"
              payload: { severity: "MODERATE", occurred_at: "2026-06-01T09:00:00Z" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { ae_id: $.data.id }
            - call: "POST /adverse-events/${ae_id}/review"
              payload: { action: "TRIAGE" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /adverse-events/${ae_id}/review"
              payload: { action: "ADJUDICATE", relation: "UNRELATED" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: CoordinatorStaff
              captures: { ss: $.data.safety_status }
          assert:
            - "AdverseEvent.${ae_id}.report_status == ADJUDICATED_UNRELATED"
            - "Enrollment.${enr_id}.safety_status == CLEAR"
            - "Trial.${trial_id}.active_safety_holds == 0"
