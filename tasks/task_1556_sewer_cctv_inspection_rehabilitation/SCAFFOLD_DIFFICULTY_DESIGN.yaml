              as: DistrictEngineer
              captures: { committed_end: $.data.budget_committed_cents }
          assert:
            - "after approve: SewerDistrict.budget_committed_cents == 400000 (250000 + MOB_SMALL 150000)"
            - "after reopen (compensating action): SewerDistrict.budget_committed_cents == 0 — ledger invariant: committed_end == committed_initial (0); zero drift"
      - name: lateral_reinstatement_count_invariant_on_cipp_cycle
        grounds:
          - calculations.lateral_reinstatement_progress
          - state_machines.WorkOrder.PUNCH_LIST_to_COMPLETED
          - entities.Lateral.fields.reinstated
        distinguishing_aspect: |
          Conserved quantity: count of unreinstated active laterals across a
          CIPP cycle. invariant: reinstate(l1..ln) then complete(WO) leaves
          sum(reinstated == true among active laterals) == 0 — the completion
          (forward action into REHABILITATED) compensates all reinstatement
          marks by resetting them, so the district-wide reinstated tally
          returns to its pre-reinstatement value. Different conserved quantity
          (lateral progress counter, not money) than the budget invariant.
        test_recipe:
          setup:
            - "District D, segment S PVC grade-2 certified; CIPP_LINING plan approved; W with line 100 LF @ 8000c; two active laterals; POST_CIPP inspection certified; laterals reinstated; W in PUNCH_LIST"
