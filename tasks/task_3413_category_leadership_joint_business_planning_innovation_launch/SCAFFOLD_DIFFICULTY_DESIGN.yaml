  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lock_event_state_beats_fiscal
        grounds:
          - validations[priority=12]
          - validations[priority=33]
        distinguishing_aspect: |
          Pair {state vs business_fiscal}: locking an event on an ACCEPTED
          (never ACTIVATED) plan violates BOTH the state precondition (no
          TradeFund exists, so funding availability is also zero) and the fiscal
          floor — the state error ERR_PLAN_NOT_ACTIVATED must win.
        test_recipe:
          setup:
            - "plan ACCEPTED but not ACTIVATED (no fund exists); one PENCILED event"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/events"
              payload: { name: "Spring Feature", event_type: "FEATURE", start_date: "2027-03-01T00:00:00Z", end_date: "2027-03-10T00:00:00Z", discount_depth_pct: 25 }
              as: ManufacturerPlanner
              captures: { ev_id: "$.data.id" }
          trigger:
            - call: "POST /jbp/events/${ev_id}/lock"
              as: ManufacturerPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PLAN_NOT_ACTIVATED (state, priority 12)"
            - "error_id != ERR_INSUFFICIENT_FUNDS (fiscal, priority 33 — would also fail since no fund exists, but must lose)"
            - "PromotionalEvent.${ev_id}.status remains PENCILED"

      - name: launch_state_beats_temporal
        grounds:
          - validations[priority=14]
          - validations[priority=31]
        distinguishing_aspect: |
          Pair {state vs business_temporal} — a different pair than
          {state, business_fiscal}: launching with unpassed phase gates AND a
          launch_date still in the future returns ERR_PHASE_GATES_INCOMPLETE,
          not ERR_LAUNCH_DATE_NOT_REACHED.
        test_recipe:
          setup:
            - "ACTIVATED plan; launch dated 2027-06-01 with all four phases still PENDING; logical clock at the default 2026-09-01 (before launch_date)"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "UltraTabs", pack_family: "tabs", launch_date: "2027-06-01T00:00:00Z", total_trade_budget_cents: 500000 }
              as: ManufacturerPlanner
              captures: { lau_id: "$.data.id" }
          trigger:
            - call: "POST /jbp/launches/${lau_id}/launch"
              as: ManufacturerPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PHASE_GATES_INCOMPLETE (state, priority 14)"
            - "error_id != ERR_LAUNCH_DATE_NOT_REACHED (temporal, priority 31 — clock 2026-09-01 < 2027-06-01 also fails, but must lose)"
            - "InnovationLaunch.${lau_id}.status remains PLANNING"

