# =============================================================================
# PRD Benchmark Scaffold — Furniture & Mattress Retail with Delivery (Expert)
# =============================================================================

scenario: |
  Furniture & Mattress Retail with Delivery: catalog & configuration (fabric/size),
  financing/lease-to-own, delivery scheduling & route, assembly/haul-away add-on,
  white-glove vs threshold, damage/return window, warranty/protection plan,
  special-order lead time.

domain_name: furniture-mattress-retail-delivery
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - temporal_windowing            # delivery route time-slots + return-window expiry
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (Order, FinancingPlan, DeliveryRoute,
  # DeliveryStop, ReturnRequest, etc.). No deep nested-URL ownership chains;
  # children carry FK fields and are discovered via filtered-list GETs.

  state_machine_shape: parallel
  # Order carries two independent dimensions (payment_status × fulfillment_status).
  # ReturnRequest is a branching-with-revert machine; FinancingPlan is cyclic
  # (current → past_due → current via catch-up payments).

  relationship_patterns:
    - one_to_many        # Order → OrderLine; DeliveryRoute → DeliveryStop
    - cross_aggregate    # DeliveryStop references Order; ReturnRequest references OrderLine

  role_model: peer_roles
  # SalesAssociate owns order intake/financing; DeliveryDispatcher owns routes/stops;
  # Customer (entity_backed) owns their own returns; StoreManager has the override surface.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }
      - { name: credit_score, type: integer, source: input, description: "FICO-style score 300..850 supplied at intake; gates financing approval", constraints: "300 <= credit_score <= 850" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Stated gross monthly income in cents; used in debt-to-income gate", constraints: ">= 0" }
      - { name: existing_monthly_obligations_cents, type: integer, source: input, default: 0, description: "Existing recurring monthly debt in cents; numerator of DTI", constraints: ">= 0" }
      - { name: open_financing_count, type: integer, source: computed, description: "Read-only: number of FinancingPlan rows for this customer in status IN {CURRENT, PAST_DUE}; recomputed on plan activation and payoff/default" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU; unique across products" }
      - { name: name, type: string, source: input, description: "Display name (e.g., 'Aspen Sectional')" }
      - { name: category, type: enum, source: input, description: "SOFA | SECTIONAL | MATTRESS | BED_FRAME | TABLE", constraints: "one of SOFA, SECTIONAL, MATTRESS, BED_FRAME, TABLE" }
      - { name: base_price_cents, type: integer, source: input, description: "Base unit price before configuration surcharges, in cents", constraints: "> 0" }
      - { name: available_fabrics, type: array, source: input, description: "Allowed fabric option codes, each { code, surcharge_cents }; STANDARD must be present with surcharge_cents 0" }
      - { name: available_sizes, type: array, source: input, description: "Allowed size option codes, each { code, surcharge_cents }; e.g. TWIN/FULL/QUEEN/KING for mattresses" }
      - { name: is_special_order, type: boolean, source: input, default: false, description: "When true the configured line is build-to-order and incurs SPECIAL_ORDER_LEAD_DAYS before it is ready to schedule" }
      - { name: lead_days, type: integer, source: input, default: 0, description: "Special-order build lead time in days; 0 for in-stock items. Used only when is_special_order is true", constraints: ">= 0" }
      - { name: protection_eligible, type: boolean, source: input, default: true, description: "Whether a ProtectionPlan may be attached to lines of this product" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer who owns this order" }
      - { name: sales_associate_user_id, type: string, source: system, description: "Opaque X-User-ID of the SalesAssociate who created the order" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID -> FINANCED | PAID_IN_FULL; FINANCED/PAID_IN_FULL are settled. Independent of fulfillment_status", constraints: "one of UNPAID, FINANCED, PAID_IN_FULL" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT -> CONFIRMED -> SCHEDULED -> DELIVERED -> CLOSED; CANCELLED is terminal from DRAFT/CONFIRMED. Independent of payment_status", constraints: "one of DRAFT, CONFIRMED, SCHEDULED, DELIVERED, CLOSED, CANCELLED" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, description: "Read-only: sum over non-cancelled OrderLine.line_total_cents (see calc order_merchandise_subtotal)" }
      - { name: service_total_cents, type: integer, source: computed, description: "Read-only: sum of delivery-tier fee + add-on fees across non-cancelled lines (see calc order_service_total)" }
      - { name: order_total_cents, type: integer, source: computed, description: "Read-only: merchandise_subtotal_cents + service_total_cents + tax (see calc order_grand_total); pins evaluation order" }
      - { name: amount_refunded_cents, type: integer, source: computed, description: "Read-only: cumulative refund disbursed by accepted ReturnRequests on this order; starts 0", default: 0 }
      - { name: delivery_tier, type: enum, source: input, default: THRESHOLD, description: "THRESHOLD | WHITE_GLOVE; order-level default service tier applied when a stop is booked", constraints: "one of THRESHOLD, WHITE_GLOVE" }
      - { name: earliest_schedulable_date, type: datetime, source: computed, description: "Read-only: order-creation date + max lead_days over special-order lines (see calc order_earliest_schedulable_date); null until at least one line exists" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order this configured line belongs to" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the catalog product being configured" }
      - { name: fabric_code, type: string, source: input, description: "Chosen fabric option code; MUST be one of Product.available_fabrics[].code" }
      - { name: size_code, type: string, source: input, description: "Chosen size option code; MUST be one of Product.available_sizes[].code" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units of this configured product", constraints: ">= 1" }
      - { name: add_assembly, type: boolean, source: input, default: false, description: "Add assembly service for this line" }
      - { name: add_haul_away, type: boolean, source: input, default: false, description: "Add haul-away of the old item for this line" }
      - { name: unit_config_price_cents, type: integer, source: computed, description: "Read-only: base_price + chosen fabric surcharge + chosen size surcharge (per unit)" }
      - { name: line_total_cents, type: integer, source: computed, description: "Read-only: unit_config_price_cents * quantity (merchandise only; add-on/service fees live on the order service_total)" }
      - { name: addon_fee_cents, type: integer, source: computed, description: "Read-only: assembly + haul-away fees for this line (see calc line_addon_fee)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RETURNED; or ACTIVE -> CANCELLED before confirmation", constraints: "one of ACTIVE, CANCELLED, RETURNED" }

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being financed (1:1 — at most one active plan per order)" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the order's customer at application time" }
      - { name: plan_type, type: enum, source: input, description: "INSTALLMENT | LEASE_TO_OWN", constraints: "one of INSTALLMENT, LEASE_TO_OWN" }
      - { name: term_months, type: integer, source: input, description: "Number of monthly payments", constraints: "INSTALLMENT in {6,12,24,36}; LEASE_TO_OWN in {12,18}" }
      - { name: financed_principal_cents, type: integer, source: system, description: "Snapshot of Order.order_total_cents at the moment the plan is activated (version-pinned)" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Read-only: scheduled monthly payment (see calc financing_monthly_payment)" }
      - { name: total_of_payments_cents, type: integer, source: computed, description: "Read-only: monthly_payment_cents * term_months (lease-to-own includes markup; installment includes interest)" }
      - { name: paid_to_date_cents, type: integer, source: computed, description: "Read-only: sum of accepted Payment.amount_cents for this plan; starts 0" }
      - { name: payoff_balance_cents, type: integer, source: computed, description: "Read-only: remaining balance to settle the plan (see calc financing_payoff_balance); variant differs INSTALLMENT vs LEASE_TO_OWN" }
      - { name: payments_made_count, type: integer, source: computed, description: "Read-only: count of accepted Payment rows for this plan; starts 0" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL -> ACTIVE(=CURRENT) <-> PAST_DUE -> PAID_OFF; DECLINED terminal from PENDING_APPROVAL; DEFAULTED terminal from PAST_DUE", constraints: "one of PENDING_APPROVAL, CURRENT, PAST_DUE, PAID_OFF, DECLINED, DEFAULTED" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: financing_plan_id, type: string, source: input, description: "FK -> FinancingPlan.id; the plan this payment applies to" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: applied_period_index, type: integer, source: system, description: "1-based monthly period this payment satisfied (assigned chronologically by created_at ASC)" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "Region/zone served by this route (e.g., 'NORTH')" }
      - { name: service_date, type: datetime, source: input, description: "Calendar date this route runs (date component only, UTC midnight)" }
      - { name: shift_start_minute, type: integer, source: input, description: "Route window open, minutes since midnight", constraints: "0 <= shift_start_minute < shift_end_minute" }
      - { name: shift_end_minute, type: integer, source: input, description: "Route window close, minutes since midnight", constraints: "shift_start_minute < shift_end_minute <= 1440" }
      - { name: capacity_units, type: integer, source: input, description: "Total truck capacity in delivery units this route can carry", constraints: "> 0" }
      - { name: committed_units, type: integer, source: computed, description: "Read-only: sum of DeliveryStop.unit_load for stops on this route in status IN {BOOKED, DISPATCHED}; starts 0" }
      - { name: status, type: enum, source: system, description: "OPEN -> LOCKED -> COMPLETED; OPEN accepts bookings, LOCKED rejects new bookings, COMPLETED is terminal", constraints: "one of OPEN, LOCKED, COMPLETED" }

  - name: DeliveryStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id; the route carrying this stop" }
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being delivered (1:1 — at most one BOOKED/DISPATCHED stop per order)" }
      - { name: window_start_minute, type: integer, source: input, description: "Requested delivery window start, minutes since midnight", constraints: "route.shift_start_minute <= window_start_minute" }
      - { name: window_end_minute, type: integer, source: input, description: "Requested delivery window end, minutes since midnight", constraints: "window_start_minute < window_end_minute <= route.shift_end_minute" }
      - { name: service_tier, type: enum, source: system, description: "Copied from Order.delivery_tier at booking; THRESHOLD requires no buffer, WHITE_GLOVE requires a service buffer after the window", constraints: "one of THRESHOLD, WHITE_GLOVE" }
      - { name: unit_load, type: integer, source: computed, description: "Read-only: total delivery units for this stop = sum of OrderLine.quantity over the order's non-cancelled lines at booking time" }
      - { name: status, type: enum, source: system, description: "BOOKED -> DISPATCHED -> COMPLETED; CANCELLED terminal from BOOKED", constraints: "one of BOOKED, DISPATCHED, COMPLETED, CANCELLED" }

  - name: ProtectionPlan
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the configured line this protection plan covers (1:1 — at most one active plan per line)" }
      - { name: tier, type: enum, source: input, description: "BASIC | PREMIUM; PREMIUM covers accidental damage, BASIC covers manufacturing defects only", constraints: "one of BASIC, PREMIUM" }
      - { name: coverage_years, type: integer, source: input, description: "Coverage length in years", constraints: "BASIC in {1,2}; PREMIUM in {3,5}" }
      - { name: premium_cents, type: integer, source: computed, description: "Read-only: protection plan price (see calc protection_premium)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> VOIDED; VOIDED when the covered line is RETURNED", constraints: "one of ACTIVE, VOIDED" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the configured line being returned" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; copied from the line's order at filing time" }
      - { name: reason, type: enum, source: input, description: "DAMAGED | DEFECTIVE | CHANGED_MIND", constraints: "one of DAMAGED, DEFECTIVE, CHANGED_MIND" }
      - { name: restocking_fee_cents, type: integer, source: computed, description: "Read-only: restocking fee withheld from refund (see calc return_refund); 0 for DAMAGED/DEFECTIVE" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Read-only: net refund disbursed on acceptance (see calc return_refund)" }
      - { name: filed_on, type: datetime, source: system, description: "Timestamp the return was filed; compared to the line's delivery date for the return-window gate" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED -> REFUNDED; REQUESTED -> REJECTED (terminal); APPROVED -> REJECTED allowed before refund", constraints: "one of REQUESTED, APPROVED, REFUNDED, REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Order: PARALLEL dimensions (payment_status × fulfillment_status) ------
  - entity: Order
    initial_state: DRAFT            # fulfillment_status; payment_status initial is UNPAID
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      # fulfillment dimension
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /orders/{id}/confirm"
        actor: SalesAssociate
        preconditions:
          - "fulfillment_status == DRAFT (ERR_INVALID_STATE)"
          - "order has at least one ACTIVE OrderLine (ERR_EMPTY_ORDER)"
          - "payment_status IN {FINANCED, PAID_IN_FULL} — order must be settled before confirmation (ERR_ORDER_NOT_SETTLED)"
        side_effects:
          - "recompute order_total_cents, merchandise_subtotal_cents, service_total_cents (frozen reference for financing snapshot)"
          - "set earliest_schedulable_date = creation_date + max(lead_days over special-order ACTIVE lines)"
          - "increments Order.version by 1"
        note: "Cross-entity guard on payment dimension; lines may no longer be added/removed after CONFIRMED."
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "system: first DeliveryStop booked for this order (POST /delivery-stops)"
        actor: system
        preconditions:
          - "fulfillment_status == CONFIRMED (ERR_INVALID_STATE)"
        side_effects:
          - "increments Order.version by 1"
        note: "Bubble-up from DeliveryStop creation; see DeliveryStop BOOKED side-effects."
      - from: SCHEDULED
        to: DELIVERED
        trigger: "system: the order's DeliveryStop transitions to COMPLETED"
        actor: system
        preconditions:
          - "fulfillment_status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "stamp delivered_on baseline used by return-window gate (line delivery date = stop COMPLETED time)"
          - "increments Order.version by 1"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /orders/{id}/close"
        actor: StoreManager
        preconditions:
          - "fulfillment_status == DELIVERED (ERR_INVALID_STATE)"
          - "no ReturnRequest on this order in status IN {REQUESTED, APPROVED} (ERR_OPEN_RETURNS_EXIST)"
        side_effects:
          - "increments Order.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "fulfillment_status IN {DRAFT, CONFIRMED} (ERR_INVALID_STATE)"
          - "no DeliveryStop on this order in status IN {BOOKED, DISPATCHED} (ERR_STOP_ACTIVE)"
        side_effects:
          - "CASCADE: set every ACTIVE OrderLine.status = CANCELLED (each line refreshes updated_at)"
          - "CASCADE: if a FinancingPlan exists in status IN {PENDING_APPROVAL, CURRENT}, set it to DECLINED and recompute Customer.open_financing_count"
          - "increments Order.version by 1"
        note: "Same trigger valid from CONFIRMED; see next row."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: SalesAssociate
        preconditions:
          - "fulfillment_status IN {DRAFT, CONFIRMED} (ERR_INVALID_STATE)"
          - "no DeliveryStop on this order in status IN {BOOKED, DISPATCHED} (ERR_STOP_ACTIVE)"
        side_effects:
          - "CASCADE: set every ACTIVE OrderLine.status = CANCELLED"
          - "CASCADE: if a FinancingPlan exists in status IN {PENDING_APPROVAL, CURRENT}, set it to DECLINED and recompute Customer.open_financing_count"
          - "increments Order.version by 1"
      # payment dimension (independent of fulfillment_status)
      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /orders/{id}/pay-in-full"
        actor: SalesAssociate
        preconditions:
          - "payment_status == UNPAID (ERR_ALREADY_SETTLED)"
          - "order has at least one ACTIVE OrderLine (ERR_EMPTY_ORDER)"
          - "no FinancingPlan exists for this order in status IN {PENDING_APPROVAL, CURRENT} (ERR_FINANCING_EXISTS)"
        side_effects:
          - "set payment_status = PAID_IN_FULL"
          - "increments Order.version by 1"
        note: "payment_status moves on its own axis; fulfillment_status unchanged."

  # ---- FinancingPlan: CYCLIC (CURRENT <-> PAST_DUE) --------------------------
  - entity: FinancingPlan
    initial_state: PENDING_APPROVAL
    terminal_states: [PAID_OFF, DECLINED, DEFAULTED]
    transitions:
      - from: PENDING_APPROVAL
        to: CURRENT
        trigger: "POST /financing-plans/{id}/approve"
        actor: StoreManager
        preconditions:
          - "status == PENDING_APPROVAL (ERR_INVALID_STATE)"
          - "Customer.credit_score >= MIN_CREDIT_SCORE for plan_type (ERR_CREDIT_TOO_LOW)"
          - "computed DTI ratio <= MAX_DTI (ERR_DTI_EXCEEDED) — see calc financing_eligibility_gates"
          - "Customer.open_financing_count < MAX_OPEN_PLANS (ERR_TOO_MANY_OPEN_PLANS)"
          - "the order is UNPAID and has no other CURRENT/PENDING_APPROVAL plan (ERR_ALREADY_SETTLED)"
        side_effects:
          - "snapshot financed_principal_cents = Order.order_total_cents (version-pinned at approval)"
          - "set Order.payment_status = FINANCED (cross-entity)"
          - "increments Customer.open_financing_count by 1"
          - "increments FinancingPlan.version by 1; increments Order.version by 1"
      - from: PENDING_APPROVAL
        to: DECLINED
        trigger: "POST /financing-plans/{id}/decline"
        actor: StoreManager
        preconditions:
          - "status == PENDING_APPROVAL (ERR_INVALID_STATE)"
        side_effects:
          - "increments FinancingPlan.version by 1"
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /financing-plans/{id}/mark-past-due"
        actor: StoreManager
        preconditions:
          - "status == CURRENT (ERR_INVALID_STATE)"
          - "payments_made_count < the number of monthly periods elapsed (a period is owed but unpaid) (ERR_NO_PERIOD_DUE)"
        side_effects:
          - "increments FinancingPlan.version by 1"
      - from: CURRENT
        to: CURRENT
        trigger: "POST /financing-plans/{id}/payments  (an ordinary in-schedule payment that neither pays off nor catches up)"
        actor: SalesAssociate
        preconditions:
          - "status == CURRENT (ERR_INVALID_STATE)"
          - "amount_cents < payoff_balance_cents BEFORE this payment (otherwise the CURRENT -> PAID_OFF transition fires instead)"
        side_effects:
          - "append Payment with applied_period_index assigned by created_at ASC (chronological)"
          - "recompute paid_to_date_cents, payments_made_count, payoff_balance_cents"
          - "increments FinancingPlan.version by 1"
        note: "Self-loop: a routine monthly payment keeps the plan CURRENT; status only changes on payoff or mark-past-due."
      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /financing-plans/{id}/payments  (a catch-up payment restoring schedule)"
        actor: SalesAssociate
        preconditions:
          - "status == PAST_DUE (ERR_INVALID_STATE)"
          - "the payment brings paid_to_date_cents up to at least monthly_payment_cents * periods_elapsed (ERR_INSUFFICIENT_CATCH_UP)"
          - "amount_cents < payoff_balance_cents BEFORE this payment (otherwise PAST_DUE -> PAID_OFF fires instead)"
        side_effects:
          - "append Payment with applied_period_index assigned by created_at ASC"
          - "recompute paid_to_date_cents, payments_made_count, payoff_balance_cents"
          - "increments FinancingPlan.version by 1"
        note: "Cyclic: PAST_DUE -> CURRENT; an ordinary in-schedule payment posted while CURRENT keeps status CURRENT via the CURRENT -> CURRENT self-loop."
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /financing-plans/{id}/payments  (a payment that clears payoff_balance_cents)"
        actor: SalesAssociate
        preconditions:
          - "status IN {CURRENT, PAST_DUE} (ERR_INVALID_STATE)"
          - "amount_cents >= payoff_balance_cents BEFORE this payment (ERR_PAYMENT_BELOW_PAYOFF) — pays off in one shot"
        side_effects:
          - "append final Payment; recompute paid_to_date_cents, payments_made_count"
          - "set payoff_balance_cents = 0"
          - "set Order.payment_status = PAID_IN_FULL (cross-entity)"
          - "decrement Customer.open_financing_count by 1"
          - "increments FinancingPlan.version by 1; increments Order.version by 1"
        note: "Also reachable from PAST_DUE when the payment clears the full payoff balance."
      - from: PAST_DUE
        to: DEFAULTED
        trigger: "POST /financing-plans/{id}/default"
        actor: StoreManager
        preconditions:
          - "status == PAST_DUE (ERR_INVALID_STATE)"
        side_effects:
          - "decrement Customer.open_financing_count by 1"
          - "increments FinancingPlan.version by 1"

  # ---- ReturnRequest: BRANCHING WITH REVERT ---------------------------------
  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [REFUNDED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-requests/{id}/approve"
        actor: StoreManager
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
          - "the covered OrderLine.status == ACTIVE (ERR_LINE_NOT_RETURNABLE)"
          - "filed_on within return window: filed_on - line.delivered_on <= RETURN_WINDOW_DAYS, longer of base/mattress window (ERR_RETURN_WINDOW_CLOSED) — see calc return_window_deadline"
        side_effects:
          - "recompute restocking_fee_cents and refund_amount_cents (see calc return_refund)"
          - "increments ReturnRequest.version by 1"
      - from: APPROVED
        to: REFUNDED
        trigger: "POST /return-requests/{id}/refund"
        actor: StoreManager
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: set covered OrderLine.status = RETURNED"
          - "CASCADE: that line's ProtectionPlan (if ACTIVE) -> VOIDED"
          - "increment Order.amount_refunded_cents by refund_amount_cents (cross-entity ledger sync)"
          - "increments ReturnRequest.version by 1; increments Order.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /return-requests/{id}/reject"
        actor: StoreManager
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "increments ReturnRequest.version by 1"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /return-requests/{id}/reject"
        actor: StoreManager
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "increments ReturnRequest.version by 1"
        note: "Revert path: an APPROVED return may be rejected before refund; no ledger or line side-effects fire."

  # ---- DeliveryRoute: LINEAR with capacity guard ----------------------------
  - entity: DeliveryRoute
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /delivery-routes/{id}/lock"
        actor: DeliveryDispatcher
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "increments DeliveryRoute.version by 1"
        note: "LOCKED rejects new DeliveryStop bookings."
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /delivery-routes/{id}/complete"
        actor: DeliveryDispatcher
        preconditions:
          - "status == LOCKED (ERR_INVALID_STATE)"
          - "every DeliveryStop on this route is in status IN {COMPLETED, CANCELLED} (ERR_STOPS_UNRESOLVED)"
        side_effects:
          - "increments DeliveryRoute.version by 1"

  # ---- DeliveryStop: LINEAR with cross-entity bubble-up ---------------------
  - entity: DeliveryStop
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: DISPATCHED
        trigger: "POST /delivery-stops/{id}/dispatch"
        actor: DeliveryDispatcher
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
          - "route.status == LOCKED (ERR_ROUTE_NOT_LOCKED)"
        side_effects:
          - "increments DeliveryStop.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /delivery-stops/{id}/complete"
        actor: DeliveryDispatcher
        preconditions:
          - "status == DISPATCHED (ERR_INVALID_STATE)"
        side_effects:
          - "BUBBLE-UP: Order.fulfillment_status SCHEDULED -> DELIVERED; line.delivered_on = this completion time"
          - "decrement route.committed_units by unit_load (stop leaves the active load set)"
          - "increments DeliveryStop.version by 1; increments Order.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /delivery-stops/{id}/cancel"
        actor: DeliveryDispatcher
        preconditions:
          - "status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "decrement route.committed_units by unit_load"
          - "BUBBLE-UP: if this was the order's only active stop, Order.fulfillment_status SCHEDULED -> CONFIRMED"
          - "increments DeliveryStop.version by 1; increments Order.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: stop-book-stale-route
    parent_entity: DeliveryRoute
    write_endpoint: "POST /delivery-stops"
    occ_field: "expected_route_version"
    description: |
      Booking a DeliveryStop against a DeliveryRoute whose version has advanced
      since the client last observed it is rejected. Booking legitimately
      supersedes the prior view of remaining capacity (another writer may have
      just booked a stop that consumed units), so the current writer's stale
      view of the route's committed_units must be revalidated via OCC rather
      than silently overbooking.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: financing-apply-stale-order
    parent_entity: Order
    write_endpoint: "POST /financing-plans"
    occ_field: "expected_order_version"
    description: |
      Applying for a FinancingPlan against an Order whose version has advanced
      since the client last observed it is rejected. A financing application
      legitimately supersedes the prior order view (e.g., the order total just
      changed because a line was added/removed), so the principal the plan would
      snapshot is stale; OCC forces re-read before the plan can be applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: line_unit_config_price
    trigger: "on OrderLine create/update; consumed by order_merchandise_subtotal"
    algorithm: aggregation
    formula: |
      fabric_surcharge = surcharge_cents of the chosen fabric_code in Product.available_fabrics
      size_surcharge   = surcharge_cents of the chosen size_code in Product.available_sizes
      unit_config_price_cents = Product.base_price_cents + fabric_surcharge + size_surcharge
      line_total_cents = unit_config_price_cents * quantity
    input_set: "single OrderLine and its Product"
    constants: {}
    precision: "integer cents; no rounding (all inputs are integer cents)"

  - name: line_addon_fee
    trigger: "on OrderLine create/update; consumed by order_service_total"
    algorithm: aggregation
    formula: |
      assembly_fee  = add_assembly  ? (ASSEMBLY_FEE_PER_UNIT_CENTS  * quantity) : 0
      haul_fee      = add_haul_away ? (HAUL_AWAY_FEE_PER_UNIT_CENTS * quantity) : 0
      addon_fee_cents = assembly_fee + haul_fee
    input_set: "single OrderLine"
    constants:
      ASSEMBLY_FEE_PER_UNIT_CENTS: 4900
      HAUL_AWAY_FEE_PER_UNIT_CENTS: 3500
    precision: "integer cents"

  - name: order_merchandise_subtotal
    trigger: "on order confirm, line add/remove, pay-in-full; recompute Order.merchandise_subtotal_cents"
    algorithm: aggregation
    formula: |
      merchandise_subtotal_cents = sum( line.line_total_cents
        for line in OrderLine where line.order_id == order.id and line.status == ACTIVE )
    input_set: "OrderLine rows of this order with status == ACTIVE (CANCELLED and RETURNED excluded)"
    constants: {}
    precision: "integer cents"

  - name: order_service_total
    trigger: "on order confirm, line add/remove; recompute Order.service_total_cents"
    algorithm: tiered_pricing
    formula: |
      # Delivery tier fee is a flat per-order fee chosen by delivery_tier:
      delivery_fee = (order.delivery_tier == WHITE_GLOVE) ? WHITE_GLOVE_FEE_CENTS : THRESHOLD_FEE_CENTS
      addon_total  = sum( line.addon_fee_cents for line in ACTIVE lines of this order )
      service_total_cents = delivery_fee + addon_total
    input_set: "ACTIVE OrderLine rows of this order + the order's delivery_tier"
    constants:
      THRESHOLD_FEE_CENTS: 7900
      WHITE_GLOVE_FEE_CENTS: 19900
    precision: "integer cents"

  - name: order_grand_total
    trigger: "on order confirm and any line/service recompute; recompute Order.order_total_cents"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED to avoid a circular-looking dependency:
      #   (1) merchandise_subtotal_cents  (calc order_merchandise_subtotal)
      #   (2) service_total_cents         (calc order_service_total)
      #   (3) taxable_base = merchandise_subtotal_cents + service_total_cents
      #   (4) tax = round_half_up( taxable_base * TAX_RATE_BPS / 10000 )   # single rounding on the COMBINED base
      #   (5) order_total_cents = taxable_base + tax
      # Tax is computed ONCE on the summed base (sum-then-round), NOT per component.
    input_set: "the order's merchandise_subtotal_cents and service_total_cents"
    constants:
      TAX_RATE_BPS: 825        # 8.25%
    precision: "round_half_up to integer cents; rounding applied once at step (4) on the combined taxable base"

  - name: order_earliest_schedulable_date
    trigger: "on order confirm; recompute Order.earliest_schedulable_date"
    algorithm: threshold
    formula: |
      max_lead = max( product.lead_days
        for line in ACTIVE lines of this order, product = line's Product, where product.is_special_order == true ),
        or 0 if no special-order line exists
      earliest_schedulable_date = date(order.created_at) + max_lead days
    input_set: "ACTIVE OrderLine rows of this order whose Product.is_special_order == true"
    constants: {}
    precision: "whole days; date arithmetic on the UTC date component of created_at"

  - name: financing_monthly_payment
    trigger: "on FinancingPlan create (after financed_principal snapshot); recompute monthly_payment_cents and total_of_payments_cents"
    algorithm: tiered_pricing
    formula: |
      P = financed_principal_cents
      if plan_type == INSTALLMENT:
        # simple add-on interest, then equal monthly installments
        interest = round_half_up( P * INSTALLMENT_APR_BPS/10000 * term_months/12 )
        total_of_payments_cents = P + interest
        monthly_payment_cents   = ceil( total_of_payments_cents / term_months )
      if plan_type == LEASE_TO_OWN:
        # flat lease markup multiplier on principal
        total_of_payments_cents = round_half_up( P * LEASE_MARKUP_NUM / LEASE_MARKUP_DEN )
        monthly_payment_cents   = ceil( total_of_payments_cents / term_months )
    input_set: "single FinancingPlan + its principal snapshot"
    constants:
      INSTALLMENT_APR_BPS: 1200       # 12% APR add-on, prorated by term_months/12
      LEASE_MARKUP_NUM: 13
      LEASE_MARKUP_DEN: 10            # lease-to-own total = 1.30x principal
    precision: "round_half_up on interest/total; monthly uses integer ceil so installments cover the total"
    variants:
      - name: installment_interest
        when: "plan_type == INSTALLMENT"
        difference: "add-on interest prorated by term_months/12; monthly = ceil(total/term)"
      - name: lease_markup
        when: "plan_type == LEASE_TO_OWN"
        difference: "flat 1.30x markup independent of term; monthly = ceil(total/term)"

  - name: financing_eligibility_gates
    trigger: "on POST /financing-plans/{id}/approve precondition checks (credit, DTI, open-plan-count)"
    algorithm: threshold
    formula: |
      # Evaluation order at approval is PINNED so principal/monthly exist before the gates run:
      #   (1) snapshot financed_principal_cents = Order.order_total_cents
      #   (2) compute monthly_payment_cents (calc financing_monthly_payment)
      #   (3) credit gate:  Customer.credit_score >= MIN_CREDIT_SCORE[plan_type]   (ERR_CREDIT_TOO_LOW)
      #   (4) DTI gate:     (existing_monthly_obligations_cents + monthly_payment_cents) * 100
      #                       <= MAX_DTI_PCT * monthly_income_cents                 (ERR_DTI_EXCEEDED)
      #   (5) open-plan gate: Customer.open_financing_count < MAX_OPEN_PLANS         (ERR_TOO_MANY_OPEN_PLANS)
      # The validation-priority order (§1.4 p11 < p12 < p13) decides which error wins when several fail.
    input_set: "the Customer (credit_score, monthly_income_cents, existing_monthly_obligations_cents, open_financing_count) and this plan's monthly_payment_cents and plan_type"
    constants:
      MIN_CREDIT_SCORE_INSTALLMENT: 640
      MIN_CREDIT_SCORE_LEASE_TO_OWN: 600
      MAX_DTI_PCT: 43           # MAX_DTI = 0.43, compared as exact integers to avoid float drift
      MAX_OPEN_PLANS: 2
    precision: "DTI compared as exact rational: (obligations + monthly) * 100 <= MAX_DTI_PCT * income; credit and open-plan gates are integer comparisons"
    variants:
      - name: installment_credit_floor
        when: "plan_type == INSTALLMENT"
        difference: "credit floor 640 (lower-risk amortizing loan)"
      - name: lease_credit_floor
        when: "plan_type == LEASE_TO_OWN"
        difference: "credit floor 600 (lease-to-own admits thinner credit)"

  - name: financing_periods_elapsed
    trigger: "on POST /financing-plans/{id}/mark-past-due and POST /financing-plans/{id}/payments precondition checks"
    algorithm: chronological
    formula: |
      # Whole calendar months from the activation date to the current clock, capped at term_months.
      activation_date = date the plan entered CURRENT (the approve transition's stamp)
      raw = number of whole months from activation_date to current_utc date
            (advance month-by-month; a partial month does NOT count)
      periods_elapsed = min( raw, term_months )
      # A "period is owed" (mark-past-due gate) iff payments_made_count < periods_elapsed.
      # Catch-up restores schedule iff paid_to_date_cents >= monthly_payment_cents * periods_elapsed.
    input_set: "the plan's activation date, term_months, payments_made_count, and the current clock"
    constants: {}
    precision: "whole calendar months on UTC date components; min-capped at term_months"

  - name: financing_payoff_balance
    trigger: "on each accepted Payment; recompute payoff_balance_cents"
    algorithm: chronological
    formula: |
      # Two valid payoff conventions; the scaffold PINS one per plan_type:
      if plan_type == INSTALLMENT:
        # interest is earned pro-rata; early payoff rebates UNEARNED interest (Rule of remaining term)
        periods_remaining = term_months - payments_made_count
        unearned_interest = round_half_up( total_interest * periods_remaining * (periods_remaining+1)
                                           / (term_months * (term_months+1)) )   # sum-of-digits rebate
        payoff_balance_cents = (total_of_payments_cents - paid_to_date_cents) - unearned_interest
      if plan_type == LEASE_TO_OWN:
        # lease markup is NOT rebated; payoff is simply the remaining scheduled total
        payoff_balance_cents = total_of_payments_cents - paid_to_date_cents
      payoff_balance_cents = max(payoff_balance_cents, 0)
    input_set: "single FinancingPlan + its accepted Payment rows ordered by created_at ASC"
    constants: {}
    precision: "round_half_up on unearned_interest; floor at 0"
    variants:
      - name: installment_with_rebate
        when: "plan_type == INSTALLMENT"
        difference: "early payoff rebates unearned interest via sum-of-digits; payoff < remaining scheduled total"
      - name: lease_no_rebate
        when: "plan_type == LEASE_TO_OWN"
        difference: "no rebate; payoff == remaining scheduled total (markup fully owed)"

  - name: protection_premium
    trigger: "on ProtectionPlan create; recompute premium_cents"
    algorithm: tiered_pricing
    formula: |
      covered_line_total = OrderLine.line_total_cents of the covered line
      rate_bps = (tier == PREMIUM) ? PREMIUM_RATE_BPS : BASIC_RATE_BPS
      premium_cents = round_half_up( covered_line_total * rate_bps/10000 * coverage_years )
    input_set: "the covered OrderLine + the plan's tier and coverage_years"
    constants:
      BASIC_RATE_BPS: 300      # 3% of line total per year
      PREMIUM_RATE_BPS: 650    # 6.5% of line total per year
    precision: "round_half_up to integer cents, single rounding on the whole product"

  - name: return_window_deadline
    trigger: "on POST /return-requests/{id}/approve precondition check"
    algorithm: threshold
    formula: |
      product = covered line's Product
      window_days = (product.category == MATTRESS) ? MATTRESS_RETURN_WINDOW_DAYS : STANDARD_RETURN_WINDOW_DAYS
      deadline = line.delivered_on + window_days days
      gate passes iff filed_on <= deadline    # boundary: filed_on exactly == deadline PASSES (<=)
    input_set: "covered line's delivered_on, its Product.category, and the ReturnRequest.filed_on"
    constants:
      STANDARD_RETURN_WINDOW_DAYS: 30
      MATTRESS_RETURN_WINDOW_DAYS: 100
    precision: "whole-day comparison on UTC date components; inclusive upper bound (<=)"

  - name: return_refund
    trigger: "on POST /return-requests/{id}/approve; recompute restocking_fee_cents and refund_amount_cents"
    algorithm: aggregation
    formula: |
      line = covered OrderLine
      gross = line.line_total_cents               # merchandise only; service fees non-refundable
      if reason IN {DAMAGED, DEFECTIVE}:
        restocking_fee_cents = 0
      else:                                       # CHANGED_MIND
        restocking_fee_cents = round_half_up( gross * RESTOCK_RATE_BPS / 10000 )
      refund_amount_cents = gross - restocking_fee_cents
    input_set: "the covered OrderLine.line_total_cents and the ReturnRequest.reason"
    constants:
      RESTOCK_RATE_BPS: 1500    # 15% restocking fee on change-of-mind returns
    precision: "round_half_up to integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted to perform the operation per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed Customer actions, X-User-ID equals the owning Customer.id of the targeted resource"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "POST /return-requests, GET /customers/{id}/orders, GET /customers/{id}/financing-plans"
  - priority: 4
    category: existence
    check: "all path/body referenced resources exist, validated left-to-right in path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "request body required fields present and types valid; enum values in range; numeric constraints hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
  - priority: 6
    category: business_constraint
    check: "chosen fabric_code is in Product.available_fabrics and size_code is in Product.available_sizes"
    error_id: ERR_INVALID_CONFIGURATION
    http_status: 422
    applies_to: "POST /order-lines"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: state
    check: "OrderLine add/remove only allowed while Order.fulfillment_status == DRAFT"
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /order-lines, DELETE /order-lines/{id}"
  - priority: 9
    category: business_referential
    check: "order must be settled (payment_status IN {FINANCED, PAID_IN_FULL}) before confirm"
    error_id: ERR_ORDER_NOT_SETTLED
    http_status: 409
    applies_to: "POST /orders/{id}/confirm"
  - priority: 10
    category: business_referential
    check: "financing application requires the order to be UNPAID with no existing PENDING_APPROVAL/CURRENT plan; pay-in-full requires no such plan"
    error_id: ERR_FINANCING_EXISTS
    http_status: 409
    applies_to: "POST /financing-plans, POST /orders/{id}/pay-in-full"
  - priority: 11
    category: business_safety
    check: "financing approval requires Customer.credit_score >= MIN_CREDIT_SCORE for the plan_type"
    error_id: ERR_CREDIT_TOO_LOW
    http_status: 409
    applies_to: "POST /financing-plans/{id}/approve"
  - priority: 12
    category: business_fiscal
    check: "financing approval requires computed DTI ratio <= MAX_DTI (0.43)"
    error_id: ERR_DTI_EXCEEDED
    http_status: 409
    applies_to: "POST /financing-plans/{id}/approve"
  - priority: 13
    category: business_constraint
    check: "financing approval requires Customer.open_financing_count < MAX_OPEN_PLANS"
    error_id: ERR_TOO_MANY_OPEN_PLANS
    http_status: 409
    applies_to: "POST /financing-plans/{id}/approve"
  - priority: 14
    category: business_temporal
    check: "a DeliveryStop window must lie within the route shift window; WHITE_GLOVE stops require a WHITE_GLOVE_BUFFER_MINUTES gap after the window before the next stop"
    error_id: ERR_WINDOW_OUT_OF_SHIFT
    http_status: 422
    applies_to: "POST /delivery-stops"
  - priority: 15
    category: business_temporal
    check: "the requested DeliveryStop time window (plus white-glove buffer) must not overlap an existing BOOKED/DISPATCHED stop on the same route"
    error_id: ERR_STOP_OVERLAP
    http_status: 409
    applies_to: "POST /delivery-stops"
  - priority: 16
    category: business_temporal
    check: "a DeliveryStop may only be booked on a route whose service_date >= Order.earliest_schedulable_date (special-order lead time)"
    error_id: ERR_LEAD_TIME_NOT_MET
    http_status: 409
    applies_to: "POST /delivery-stops"
  - priority: 17
    category: business_fiscal
    check: "booking a DeliveryStop must not push route.committed_units + unit_load above route.capacity_units"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-stops"
  - priority: 18
    category: state
    check: "a DeliveryStop may only be booked on a route whose status == OPEN"
    error_id: ERR_ROUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /delivery-stops"
  - priority: 19
    category: business_temporal
    check: "return approval requires filed_on within the return window for the line's product category (calc return_window_deadline)"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /return-requests/{id}/approve"
  - priority: 20
    category: business_referential
    check: "a ProtectionPlan may only be attached to a line whose Product.protection_eligible == true and that has no existing ACTIVE plan"
    error_id: ERR_PROTECTION_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /protection-plans"
  - priority: 21
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the live parent version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /delivery-stops, POST /financing-plans"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Create a customer (intake)"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [full_name, email, credit_score, monthly_income_cents, "existing_monthly_obligations_cents?"]
    output: Customer
    side_effects: ["open_financing_count initialized to 0"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/customers/{id}/orders"
    description: "List a customer's orders (FK reverse-reachability for Order.customer_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: Order[]
    side_effects: []
  - method: GET
    path: "/customers/{id}/financing-plans"
    description: "List a customer's financing plans (FK reverse-reachability for FinancingPlan.customer_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: FinancingPlan[]
    side_effects: []

  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a catalog product with fabric/size options"
    roles: [StoreManager]
    code: 201
    input: [sku, name, category, base_price_cents, available_fabrics, available_sizes, "is_special_order?", "lead_days?", "protection_eligible?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Fetch a product"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Create a DRAFT order for a customer"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [customer_id, "delivery_tier?"]
    output: Order
    side_effects: ["payment_status=UNPAID, fulfillment_status=DRAFT; sales_associate_user_id set from X-User-ID"]
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order with computed totals"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders, filterable by customer_id"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/lines"
    description: "List an order's lines (FK reverse-reachability for OrderLine.order_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/financing-plans"
    description: "List financing plans for an order (FK reverse-reachability for FinancingPlan.order_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: FinancingPlan[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/delivery-stops"
    description: "List delivery stops for an order (FK reverse-reachability for DeliveryStop.order_id)"
    roles: [SalesAssociate, StoreManager, DeliveryDispatcher, Customer]
    code: 200
    input: []
    output: DeliveryStop[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/return-requests"
    description: "List return requests for an order (FK reverse-reachability for ReturnRequest.order_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: ReturnRequest[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm a settled DRAFT order"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["recompute totals; set earliest_schedulable_date; fulfillment_status DRAFT->CONFIRMED; increments Order.version"]
  - method: POST
    path: "/orders/{id}/pay-in-full"
    description: "Settle an order by paying in full (no financing)"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["payment_status UNPAID->PAID_IN_FULL; increments Order.version"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel a DRAFT/CONFIRMED order"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["cascade cancel ACTIVE lines; cascade decline open FinancingPlan; fulfillment_status->CANCELLED; increments Order.version"]
  - method: POST
    path: "/orders/{id}/close"
    description: "Close a delivered order"
    roles: [StoreManager]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status DELIVERED->CLOSED; increments Order.version"]

  # ---- OrderLine ----
  - method: POST
    path: "/order-lines"
    description: "Add a configured line to a DRAFT order"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [order_id, product_id, fabric_code, size_code, "quantity?", "add_assembly?", "add_haul_away?"]
    output: OrderLine
    side_effects: ["compute unit_config_price_cents, line_total_cents, addon_fee_cents; recompute order totals"]
  - method: GET
    path: "/order-lines/{id}"
    description: "Fetch a single configured line (registers the order-lines collection segment)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/products/{id}/order-lines"
    description: "List order lines configured from a product (FK reverse-reachability for OrderLine.product_id)"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []
  - method: DELETE
    path: "/order-lines/{id}"
    description: "Remove a line from a DRAFT order"
    roles: [SalesAssociate, StoreManager]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["set line status=CANCELLED; recompute order totals"]

  # ---- FinancingPlan ----
  - method: POST
    path: "/financing-plans"
    description: "Apply for financing on an order (OCC on order version)"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [order_id, plan_type, term_months, expected_order_version]
    output: FinancingPlan
    side_effects: ["status=PENDING_APPROVAL; copy customer_id; OCC checks Order.version; on success no version snapshot yet (taken at approval)"]
  - method: GET
    path: "/financing-plans/{id}"
    description: "Fetch a financing plan with computed payoff"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []
  - method: POST
    path: "/financing-plans/{id}/approve"
    description: "Approve a pending financing plan (credit/DTI/limit gates)"
    roles: [StoreManager]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["snapshot financed_principal=Order.order_total_cents; compute monthly/total; Order.payment_status=FINANCED; Customer.open_financing_count+1; increments FinancingPlan.version, Order.version"]
  - method: POST
    path: "/financing-plans/{id}/decline"
    description: "Decline a pending financing plan"
    roles: [StoreManager]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["status PENDING_APPROVAL->DECLINED; increments FinancingPlan.version"]
  - method: POST
    path: "/financing-plans/{id}/mark-past-due"
    description: "Flag a current plan as past due"
    roles: [StoreManager]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["status CURRENT->PAST_DUE; increments FinancingPlan.version"]
  - method: POST
    path: "/financing-plans/{id}/default"
    description: "Declare default on a past-due plan"
    roles: [StoreManager]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: ["status PAST_DUE->DEFAULTED; Customer.open_financing_count-1; increments FinancingPlan.version"]
  - method: POST
    path: "/financing-plans/{id}/payments"
    description: "Post a payment against a plan (catch-up, in-schedule, or payoff)"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [amount_cents]
    output: Payment
    side_effects: ["append Payment with applied_period_index by created_at ASC; recompute paid_to_date/payoff/count; may move PAST_DUE->CURRENT or CURRENT/PAST_DUE->PAID_OFF; increments FinancingPlan.version (and Order.version on payoff)"]
  - method: GET
    path: "/financing-plans/{id}/payments"
    description: "List payments for a plan (FK reverse-reachability for Payment.financing_plan_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: Payment[]
    side_effects: []

  # ---- DeliveryRoute ----
  - method: POST
    path: "/delivery-routes"
    description: "Create a delivery route with a shift window and capacity"
    roles: [DeliveryDispatcher, StoreManager]
    code: 201
    input: [region_code, service_date, shift_start_minute, shift_end_minute, capacity_units]
    output: DeliveryRoute
    side_effects: ["status=OPEN, committed_units=0"]
  - method: GET
    path: "/delivery-routes/{id}"
    description: "Fetch a route with committed_units"
    roles: [DeliveryDispatcher, StoreManager, SalesAssociate]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/delivery-routes/{id}/stops"
    description: "List stops on a route (FK reverse-reachability for DeliveryStop.route_id)"
    roles: [DeliveryDispatcher, StoreManager, SalesAssociate]
    code: 200
    input: []
    output: DeliveryStop[]
    side_effects: []
  - method: POST
    path: "/delivery-routes/{id}/lock"
    description: "Lock a route to new bookings"
    roles: [DeliveryDispatcher, StoreManager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status OPEN->LOCKED; increments DeliveryRoute.version"]
  - method: POST
    path: "/delivery-routes/{id}/complete"
    description: "Complete a locked route once all stops resolved"
    roles: [DeliveryDispatcher, StoreManager]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status LOCKED->COMPLETED; increments DeliveryRoute.version"]

  # ---- DeliveryStop ----
  - method: POST
    path: "/delivery-stops"
    description: "Book a delivery stop for an order on a route (OCC on route version)"
    roles: [DeliveryDispatcher, StoreManager]
    code: 201
    input: [route_id, order_id, window_start_minute, window_end_minute, expected_route_version]
    output: DeliveryStop
    side_effects: ["copy service_tier from Order.delivery_tier; compute unit_load; increment route.committed_units; Order.fulfillment_status CONFIRMED->SCHEDULED; increments DeliveryRoute.version, Order.version"]
  - method: GET
    path: "/delivery-stops/{id}"
    description: "Fetch a delivery stop"
    roles: [DeliveryDispatcher, StoreManager, SalesAssociate, Customer]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: []
  - method: POST
    path: "/delivery-stops/{id}/dispatch"
    description: "Dispatch a booked stop (route must be locked)"
    roles: [DeliveryDispatcher, StoreManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: ["status BOOKED->DISPATCHED; increments DeliveryStop.version"]
  - method: POST
    path: "/delivery-stops/{id}/complete"
    description: "Mark a dispatched stop as completed (delivers the order)"
    roles: [DeliveryDispatcher, StoreManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: ["Order SCHEDULED->DELIVERED; line.delivered_on stamped; route.committed_units-unit_load; increments DeliveryStop.version, Order.version"]
  - method: POST
    path: "/delivery-stops/{id}/cancel"
    description: "Cancel a booked stop"
    roles: [DeliveryDispatcher, StoreManager]
    code: 200
    input: []
    output: DeliveryStop
    side_effects: ["status BOOKED->CANCELLED; route.committed_units-unit_load; Order SCHEDULED->CONFIRMED if last stop; increments DeliveryStop.version, Order.version"]

  # ---- ProtectionPlan ----
  - method: POST
    path: "/protection-plans"
    description: "Attach a protection plan to an order line"
    roles: [SalesAssociate, StoreManager]
    code: 201
    input: [order_line_id, tier, coverage_years]
    output: ProtectionPlan
    side_effects: ["compute premium_cents; status=ACTIVE"]
  - method: GET
    path: "/protection-plans/{id}"
    description: "Fetch a protection plan"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: ProtectionPlan
    side_effects: []
  - method: GET
    path: "/order-lines/{id}/protection-plans"
    description: "List protection plans for a line (FK reverse-reachability for ProtectionPlan.order_line_id)"
    roles: [SalesAssociate, StoreManager, Customer]
    code: 200
    input: []
    output: ProtectionPlan[]
    side_effects: []

  # ---- ReturnRequest ----
  - method: POST
    path: "/return-requests"
    description: "File a return on a delivered order line"
    roles: [Customer, SalesAssociate, StoreManager]
    code: 201
    input: [order_line_id, reason]
    output: ReturnRequest
    side_effects: ["copy order_id; stamp filed_on; status=REQUESTED"]
  - method: GET
    path: "/return-requests/{id}"
    description: "Fetch a return request"
    roles: [Customer, SalesAssociate, StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []
  - method: GET
    path: "/order-lines/{id}/return-requests"
    description: "List return requests for a line (FK reverse-reachability for ReturnRequest.order_line_id)"
    roles: [Customer, SalesAssociate, StoreManager]
    code: 200
    input: []
    output: ReturnRequest[]
    side_effects: []
  - method: POST
    path: "/return-requests/{id}/approve"
    description: "Approve a return within the window"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["compute restocking_fee_cents, refund_amount_cents; status REQUESTED->APPROVED; increments ReturnRequest.version"]
  - method: POST
    path: "/return-requests/{id}/reject"
    description: "Reject a requested or approved return"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["status ->REJECTED; increments ReturnRequest.version"]
  - method: POST
    path: "/return-requests/{id}/refund"
    description: "Disburse refund for an approved return"
    roles: [StoreManager]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["status APPROVED->REFUNDED; line.status->RETURNED; line's ProtectionPlan->VOIDED; Order.amount_refunded_cents += refund_amount_cents; increments ReturnRequest.version, Order.version"]

  # ---- Test-driving clock endpoint (return-window + lead-time tests) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's notion of current UTC time (drives filed_on stamping and date-based gates)"
    roles: [StoreManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["subsequent system-stamped timestamps (filed_on, delivered_on, created_at on new rows) use this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for this operation" }
  - { id: ERR_FORBIDDEN_NOT_OWNER, http: 403, condition: "Customer acting on a resource they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "missing required field, bad type, out-of-range numeric, or invalid enum" }
  - { id: ERR_INVALID_CONFIGURATION, http: 422, condition: "fabric_code/size_code not offered by the product" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "transition not defined from the resource's current state" }
  - { id: ERR_EMPTY_ORDER, http: 409, condition: "confirm/pay-in-full on an order with no ACTIVE lines" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "adding/removing a line on a non-DRAFT order" }
  - { id: ERR_ORDER_NOT_SETTLED, http: 409, condition: "confirming an order whose payment_status is still UNPAID" }
  - { id: ERR_ALREADY_SETTLED, http: 409, condition: "pay-in-full on a non-UNPAID order, or financing on an already-settled order" }
  - { id: ERR_FINANCING_EXISTS, http: 409, condition: "financing application or pay-in-full when an open plan already exists" }
  - { id: ERR_CREDIT_TOO_LOW, http: 409, condition: "credit_score below the plan_type minimum at approval" }
  - { id: ERR_DTI_EXCEEDED, http: 409, condition: "debt-to-income ratio above MAX_DTI at approval" }
  - { id: ERR_TOO_MANY_OPEN_PLANS, http: 409, condition: "customer already at MAX_OPEN_PLANS open financing plans" }
  - { id: ERR_NO_PERIOD_DUE, http: 409, condition: "mark-past-due when no monthly period is actually owed" }
  - { id: ERR_INSUFFICIENT_CATCH_UP, http: 409, condition: "catch-up payment does not restore the schedule on a PAST_DUE plan" }
  - { id: ERR_PAYMENT_BELOW_PAYOFF, http: 409, condition: "payoff attempt whose amount is below the current payoff balance" }
  - { id: ERR_WINDOW_OUT_OF_SHIFT, http: 422, condition: "stop window outside route shift, or white-glove buffer exceeds shift end" }
  - { id: ERR_STOP_OVERLAP, http: 409, condition: "stop window (incl. white-glove buffer) overlaps an existing active stop on the route" }
  - { id: ERR_LEAD_TIME_NOT_MET, http: 409, condition: "route service_date earlier than the order's earliest_schedulable_date" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "booking would push committed_units above capacity_units" }
  - { id: ERR_ROUTE_NOT_OPEN, http: 409, condition: "booking a stop on a route not in OPEN status" }
  - { id: ERR_ROUTE_NOT_LOCKED, http: 409, condition: "dispatching a stop on a route not in LOCKED status" }
  - { id: ERR_STOPS_UNRESOLVED, http: 409, condition: "completing a route while stops remain BOOKED/DISPATCHED" }
  - { id: ERR_STOP_ACTIVE, http: 409, condition: "cancelling an order that still has a BOOKED/DISPATCHED stop" }
  - { id: ERR_LINE_NOT_RETURNABLE, http: 409, condition: "return approval on a line whose status is not ACTIVE" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 409, condition: "return filed after the product-category return window" }
  - { id: ERR_PROTECTION_NOT_ALLOWED, http: 409, condition: "protection plan on an ineligible product or a line already covered" }
  - { id: ERR_OPEN_RETURNS_EXIST, http: 409, condition: "closing an order with REQUESTED/APPROVED returns outstanding" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the live parent version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAssociate
    description: "Front-line sales: customer/order intake, line configuration, financing application, pay-in-full, payments"
    identity: opaque
    exclusive_operations:
      - "POST /orders (create order; sales_associate_user_id stamped from X-User-ID)"
    shared_operations:
      - "POST /customers"
      - "POST /order-lines, DELETE /order-lines/{id}"
      - "POST /orders/{id}/confirm, /pay-in-full, /cancel"
      - "POST /financing-plans, POST /financing-plans/{id}/payments"
      - "POST /protection-plans, POST /return-requests"
      - "GET reads on customers/orders/lines/products/financing-plans/delivery-stops/return-requests"
  - name: StoreManager
    description: "Override surface: approves/declines/defaults financing, approves/rejects/refunds returns, closes orders, manages catalog, can act across all sales and dispatch operations, controls the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /products (catalog)"
      - "POST /financing-plans/{id}/approve, /decline, /mark-past-due, /default"
      - "POST /return-requests/{id}/approve, /reject, /refund"
      - "POST /orders/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all SalesAssociate operations"
      - "all DeliveryDispatcher operations"
  - name: DeliveryDispatcher
    description: "Owns delivery routing: route creation, stop booking, dispatch/complete/cancel, route lock/complete"
    identity: opaque
    exclusive_operations:
      - "POST /delivery-routes, /delivery-routes/{id}/lock, /complete"
      - "POST /delivery-stops, /delivery-stops/{id}/dispatch, /complete, /cancel"
    shared_operations:
      - "GET reads on delivery-routes/stops/orders"
  - name: Customer
    description: "Self-service buyer: views own orders/financing/stops, files returns on own lines"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /return-requests (only on own order lines)"
      - "GET reads on own customer/orders/financing-plans/lines/products/delivery-stops/return-requests/protection-plans"
