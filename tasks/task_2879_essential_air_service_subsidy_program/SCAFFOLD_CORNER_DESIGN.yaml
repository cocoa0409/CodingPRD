              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
