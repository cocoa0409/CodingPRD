        claim_type: input_set_filtering
        grounds:
          - calculations.essential_function_coverage
          - entities.EssentialFunction.fields.is_essential
          - validations[priority=61]
          - errors[ERR_FUNCTION_NOT_IN_PINNED_PROFILE]
        distinguishing_aspect: "With one essential function of weight 6 and one marginal function of weight 4, an option covering only the essential function scores coverage_ratio 1.000000 because the marginal weight enters neither numerator nor denominator, and naming the marginal function in coverage_function_ids is rejected outright."
