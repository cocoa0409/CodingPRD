      - name: occ_correct_table_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-create-stale-table]", "entities.Table.fields.version"]
        distinguishing_aspect: "Re-reading Table.version after the first booking and supplying the fresh value lets a non-overlapping second booking succeed (201)."
        test_recipe:
          setup: ["A table with one appointment already booked; the client re-reads the table to get the fresh version, then books a non-overlapping slot."]
          setup_api_calls:
            - call: "POST /practice/modalities"
