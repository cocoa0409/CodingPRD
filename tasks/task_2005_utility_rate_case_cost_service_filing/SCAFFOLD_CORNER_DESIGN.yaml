      - name: unresolved_proposed_adjustment_blocks_filing
        claim_type: precondition_enforcement
        grounds: [state_machines.RateCase.DRAFT_to_FILED, "errors[ERR_UNRESOLVED_ADJUSTMENTS]", "errors[ERR_UNRESOLVED_ENTRY_ADJUSTMENTS]"]
        distinguishing_aspect: "The case-wide filing guard is distinct from the entry-lock guard: entry lock tolerates a PROPOSED adjustment (only DISPUTED blocks locking), so E1 locks cleanly with A2 still PROPOSED and its +50,000,000 counts toward the locked adjusted amount (COS 1,050,000,000, RR 1,230,000,000 matching the proposed input); submit-filing then fails at guard position 3 with ERR_UNRESOLVED_ADJUSTMENTS until the proposer withdraws A2."
        test_recipe:
          setup: ["Case DRAFT with proposed RR 1,230,000,000; E1 SUBMITTED carrying PROPOSED adjustment A2 (+50,000,000); E1 then LOCKED (PROPOSED does not block lock); RB1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /api/v1/rate-cases", payload: { case_number: "UR-2026-104", utility_name: "Cascade Power & Light", test_year_start: "2025-01-01T00:00:00Z", test_year_end: "2025-12-31T00:00:00Z", return_on_rate_base_bp: 750, proposed_revenue_requirement_cents: 1230000000, allocation_method: "COINCIDENT_PEAK" }, as: UtilityFiler, captures: { rc: $.data.id } }
            - { call: "POST /api/v1/test-year-entries", payload: { rate_case_id: "${rc}", account_code: "900", category: "O_AND_M", booked_amount_cents: 1000000000 }, as: UtilityFiler, captures: { e1: $.data.id } }
