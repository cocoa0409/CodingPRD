  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_site_coverage_resubmission_rejects_stale_expected_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[site-coverage-resubmission-stale]
          - endpoints[PATCH /radio-system/sites/{site_id}/coverage]
          - calculations.site_coverage_reliability
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The second drive-test worksheet carries the version read before the first submission, so it is rejected with HTTP 412 ERR_STALE_VERSION and the site keeps 88.5/MARGINAL; replaying the identical body with the current version writes 97.5/MISSION_CRITICAL."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Site OCC-1 is a GENERATOR site with no drive test yet (total_test_points 0, coverage_class UNRATED)."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "OCC-1", name: "Concurrency One", channel_capacity: 6, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_occ_id: "$.data.id", site_occ_v1: "$.data.version" }
            - call: "PATCH /radio-system/sites/${site_occ_id}/coverage"
              payload: { covered_test_points: 900, total_test_points: 1000, expected_site_version: "${site_occ_v1}" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { site_occ_v2: "$.data.version" }
          trigger:
            - call: "PATCH /radio-system/sites/${site_occ_id}/coverage"
              payload: { covered_test_points: 980, total_test_points: 1000, expected_site_version: "${site_occ_v1}" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { occ_stale_error_id: "$.data.error_id" }
            - call: "PATCH /radio-system/sites/${site_occ_id}/coverage"
              payload: { covered_test_points: 980, total_test_points: 1000, expected_site_version: "${site_occ_v2}" }
              as: RFEngineer
              as_user_id: "rf-1"
              captures: { site_occ_v3: "$.data.version" }
          assert:
            - "Baseline after setup: Site.${site_occ_id}.coverage_reliability_pct == 88.5, coverage_derate_tier == B, coverage_class == MARGINAL, version == ${site_occ_v1} + 1"
            - "trigger[0] returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "After trigger[0]: covered_test_points == 900, coverage_reliability_pct == 88.5, coverage_class == MARGINAL and version == ${site_occ_v2} (a rejected write does not bump the version)"
            - "trigger[1] returns HTTP 200 with covered_test_points == 980, coverage_reliability_pct == 97.5, coverage_derate_tier == A, coverage_class == MISSION_CRITICAL"
            - "${site_occ_v3} == ${site_occ_v2} + 1"

      - name: occ_template_revision_rejects_stale_expected_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[template-revision-stale]
          - endpoints[POST /radio-system/templates/{template_id}/revisions]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Publishing the parent between the read and the branch invalidates the lineage handle: the revision call carrying the pre-publish version returns HTTP 412 ERR_STALE_VERSION and no child row is created, while the same body with the post-publish version returns 201."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; template OCT-BASE-1 was created and then PUBLISHED, which bumped its record version."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/templates"
              payload: { template_name: "OCT-BASE-1", target_standard: "P25_PHASE2", talkgroup_slot_count: 4 }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_oct_id: "$.data.id", tpl_oct_v1: "$.data.version" }
            - call: "POST /radio-system/templates/${tpl_oct_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_oct_v2: "$.data.version" }
          trigger:
            - call: "POST /radio-system/templates/${tpl_oct_id}/revisions"
              payload: { template_name: "OCT-BASE-2", target_standard: "NG_LMR", talkgroup_slot_count: 4, expected_template_version: "${tpl_oct_v1}" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { oct_stale_error_id: "$.data.error_id" }
            - call: "POST /radio-system/templates/${tpl_oct_id}/revisions"
              payload: { template_name: "OCT-BASE-2", target_standard: "NG_LMR", talkgroup_slot_count: 4, expected_template_version: "${tpl_oct_v2}" }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_oct_child: "$.data.id" }
          assert:
            - "Baseline: RadioTemplate.${tpl_oct_id}.status == PUBLISHED and ${tpl_oct_v2} == ${tpl_oct_v1} + 1"
            - "trigger[0] returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "After trigger[0]: GET /radio-system/templates?supersedes_template_id=${tpl_oct_id} returns total_count == 0 and RadioTemplate.${tpl_oct_id}.status is still PUBLISHED with version == ${tpl_oct_v2}"
            - "trigger[1] returns HTTP 201 with template_version == 2, supersedes_template_id == ${tpl_oct_id}, status == DRAFT"
            - "RadioTemplate.${tpl_oct_id}.status == RETIRED and version == ${tpl_oct_v2} + 1 after trigger[1]"

