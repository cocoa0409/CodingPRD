          assert:
            - "the response status is 409 and the error_id is ERR_ACTION_NOT_EFFECTIVE"
            - "GET /clearing/corporate-actions/${ca_yld} still reports status == ANNOUNCED"
            - "GET /clearing/participants/${p_ya}/net-positions shows net_quantity unchanged at 100, so no servicing ran on the window's children"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: contested_security_capacity_half_open_with_buffer
        grounds:
          - calculations.multilateral_netting.input_set
          - validations[priority=8]
          - errors[ERR_SELF_TRADE_FORBIDDEN]
          - entities.Security.fields.ticker
        distinguishing_aspect: "This overlap rule uses aggregate-capacity semantics on the resource Security: a security's locked-in notional capacity is contested per settlement date, and a submission that would push the aggregate locked-in notional for one settlement date past the security's capacity is refused, whereas the companion rule uses half-open interval adjacency with a buffer."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants OA (legal name 'Overlap Alpha') and OB (legal name 'Overlap Beta') ACTIVE."
            - "Security OVL1 is registered and an OPEN window exists for 2026-09-10. OA locks in a notional of 400000 cents against OB on OVL1."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Overlap Alpha", lei: "LEI-OA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_oa: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Overlap Beta", lei: "LEI-OB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ob: $.data.id }
            - call: "POST /clearing/participants/${p_oa}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_ob}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "OVL1", cusip: "912828XN1", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_ovl: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_ovl}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_ovl: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_ob}", security_id: "${sec_ovl}", side: "BUY", quantity: 100, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_oa}"
              captures: { t_ovl1: $.data.id }
          trigger:
            - call: "POST /clearing/trade-submissions/${t_ovl1}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_oa}"
          assert:
            - "the lock-in succeeds, giving the security a locked-in notional of exactly 400000 cents for settlement_date 2026-09-10"
            - "a second trade on the same security and the same settlement_date whose counterparty is the acting participant is refused with ERR_SELF_TRADE_FORBIDDEN, recording that the same settlement_date occupation is the contested resource"
            - "a trade on a DIFFERENT settlement date is accepted, because the occupation is scoped per settlement_date rather than per security"

      - name: adjacent_window_occupation_half_open_with_buffer
        grounds:
          - state_machines.SettlementWindow.OPEN_to_CLOSED
          - entities.SettlementWindow.fields.settlement_date
          - errors[ERR_AFFIRMATION_DEADLINE_PASSED]
          - errors[ERR_EMPTY_NET_POSITION_SET]
        distinguishing_aspect: "This overlap rule uses half-open adjacency-with-buffer semantics on a different resource entity: a settlement window's occupation is the half-open instant range [trade_entry_deadline, affirmation_deadline) plus a one-hour buffer, so a second window whose trade_entry_deadline falls inside that buffered range is the colliding occupation, unlike the per-settlement-date aggregate rule above."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants GA (legal name 'Gap Alpha') and GB (legal name 'Gap Beta') ACTIVE."
            - "Security GAP1 with an OPEN window whose trade_entry_deadline is 2026-09-09T20:00:00Z and affirmation_deadline 2026-09-09T22:00:00Z."
            - "A second window on the same security is created with trade_entry_deadline 2026-09-09T22:30:00Z, which falls inside the one-hour buffer after the first window's affirmation_deadline."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Gap Alpha", lei: "LEI-GA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_ga: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Gap Beta", lei: "LEI-GB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_gb: $.data.id }
            - call: "POST /clearing/participants/${p_ga}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_gb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "GAP1", cusip: "912828XN2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_gap: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_gap}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_gap1: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_gap}", settlement_date: "2026-09-11", trade_entry_deadline: "2026-09-09T22:30:00Z", affirmation_deadline: "2026-09-10T20:00:00Z" }
              as: PlatformAdmin
              captures: { win_gap2: $.data.id }
          trigger:
            - call: "POST /clearing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the two windows collide under the buffer rule: win_gap2's trade_entry_deadline 22:30 falls strictly inside [22:00, 23:00), the one-hour buffer opening at win_gap1's affirmation_deadline"
            - "a further window with trade_entry_deadline exactly 2026-09-09T23:00:00Z does NOT collide, because the buffered range is half-open and the upper endpoint is excluded"
            - "opening netting on win_gap1 at the clock instant 2026-09-09T22:00:00Z is refused with ERR_AFFIRMATION_DEADLINE_PASSED, since the clock equals the affirmation deadline rather than preceding it"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: loss_allocation_preserves_total_component_balance
        grounds:
          - calculations.loss_allocation_waterfall
          - calculations.loss_allocation_remainder_repair
          - entities.FundComponent.fields.component_balance_cents
          - entities.DefaultProceeding.fields.deficit_amount_cents
          - state_machines.Participant.DEFAULTED_to_EXPELLED
        distinguishing_aspect: "The conserved quantity is total component balance across the affected fund components: the forward action (debiting survivors) paired with its compensating action (posting the correction term) must leave SUM(component_balance_cents) reduced by exactly deficit_amount_cents, with no rounding drift."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants LA (legal name 'Loss Alpha'), LB (legal name 'Loss Beta') and LC (legal name 'Loss Gamma') ACTIVE, class BANK."
            - "Security LOS1 at prev_settlement_price_cents 5000. A BANK clearing fund for LOS1 is sized once so all three hold generation-1 components."
            - "LA is suspended, its deposit is drained by a fund-cost allocation of 0 cents so resources stay zero, and LA is re-reviewed to a failing capital level."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Loss Alpha", lei: "LEI-LA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_la: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Loss Beta", lei: "LEI-LB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_lb: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Loss Gamma", lei: "LEI-LC", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_lc: $.data.id }
            - call: "POST /clearing/participants/${p_la}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_lb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_lc}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/securities"
              payload: { ticker: "LOS1", cusip: "912828XP1", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_los: $.data.id }
            - call: "POST /clearing/clearing-funds"
              payload: { security_id: "${sec_los}", participant_class: "BANK" }
              as: RiskOfficer
              captures: { fund_los: $.data.id, fund_los_v: $.data.version }
            - call: "POST /clearing/clearing-funds/${fund_los}/recompute"
              payload: { expected_fund_version: "${fund_los_v}" }
              as: RiskOfficer
            - call: "POST /clearing/participants/${p_la}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_la}/financial-review"
              payload: { net_capital_cents: 100000000 }
              as: RiskOfficer
            - call: "POST /clearing/default-proceedings"
              payload: { participant_id: "${p_la}", reason_code: "FINANCIAL_STANDARD_BREACH" }
              as: RiskOfficer
              captures: { dp_los: $.data.id }
            - call: "PUT /clearing/default-proceedings/${dp_los}"
              payload: { reason_code: "AUCTION_OPEN" }
              as: RiskOfficer
            - call: "POST /clearing/default-proceedings/${dp_los}/liquidate"
              payload: {}
              as: RiskOfficer
          trigger:
            - call: "POST /clearing/default-proceedings/${dp_los}/allocate-loss"
              payload: {}
              as: RiskOfficer
          assert:
            - "SUM over the surviving components of component_balance_cents is exactly (pre-allocation total minus deficit_amount_cents), with zero drift across all rounding, because every allocation amount is negative and the correction term closes the gap"
            - "GET /clearing/default-proceedings/${dp_los}/loss-allocations returns rows whose signed amounts sum to exactly -deficit_amount_cents, counting the correction term on the largest post-debit component"
            - "the single largest post-debit component carries the correction term, so the paired invariant SUM(loss allocation amounts) == -deficit_amount_cents holds exactly"
            - "GET /clearing/default-proceedings/${dp_los} reports allocated_total_cents == deficit_amount_cents"

      - name: corporate_action_apply_reverse_preserves_position_sum
        grounds:
          - calculations.custody_position_servicing
          - state_machines.CorporateAction.ANNOUNCED_to_APPLIED
          - state_machines.CorporateAction.APPLIED_to_REVERSED
          - entities.CustodyAccount.fields.positions
          - entities.NetPosition.fields.net_quantity
        distinguishing_aspect: "The conserved quantity is the aggregate settled quantity across all custody positions and net positions of the security: applying a split then reversing it must restore every position to its pre-application quantity and restore last_corporate_action_applied_id, so the aggregate is unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Participants QA (legal name 'Quite Alpha') and QB (legal name 'Quite Beta') ACTIVE."
            - "Security QNT1 with an OPEN window settling 2026-09-10; QA holds a locked-in matched BUY so a net position exists, and QA also holds a SEGREGATED custody account."
            - "A 3-for-2 SPLIT is announced with effective_date 2026-09-09, inside the window's settlement range."
          setup_api_calls:
            - call: "POST /clearing/participants"
              payload: { legal_name: "Quite Alpha", lei: "LEI-QA", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_qa: $.data.id }
            - call: "POST /clearing/participants"
              payload: { legal_name: "Quite Beta", lei: "LEI-QB", participant_class: "BANK", net_capital_cents: 2000000000 }
              as: PlatformAdmin
              captures: { p_qb: $.data.id }
            - call: "POST /clearing/participants/${p_qa}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_qb}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/participants/${p_qa}/custody-accounts"
              payload: { account_number: "QA-SEG-1", account_type: "SEGREGATED" }
              as: PlatformAdmin
              captures: { cust_qa: $.data.id }
            - call: "POST /clearing/securities"
              payload: { ticker: "QNT1", cusip: "912828XP2", prev_settlement_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sec_qnt: $.data.id }
            - call: "POST /clearing/settlement-windows"
              payload: { security_id: "${sec_qnt}", settlement_date: "2026-09-10", trade_entry_deadline: "2026-09-09T20:00:00Z", affirmation_deadline: "2026-09-09T22:00:00Z" }
              as: PlatformAdmin
              captures: { win_qnt: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_qb}", security_id: "${sec_qnt}", side: "BUY", quantity: 3, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_qa}"
              captures: { t_qnt: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_qnt}/lock-in"
              payload: {}
              as: ClearingMember
              as_user_id: "${p_qa}"
            - call: "POST /clearing/settlement-windows/${win_qnt}/net"
              payload: {}
              as: PlatformAdmin
            - call: "POST /clearing/corporate-actions"
              payload: { security_id: "${sec_qnt}", action_type: "SPLIT", ratio_numerator: 3, ratio_denominator: 2, effective_date: "2026-09-09" }
              as: PlatformAdmin
              captures: { ca_qnt: $.data.id }
          trigger:
            - call: "POST /clearing/corporate-actions/${ca_qnt}/apply"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /clearing/participants/${p_qa}/net-positions reports net_quantity == 4  (3 + trunc_toward_zero(3 * 3 / 2) = 3 + 4)"
            - "GET /clearing/participants/${p_qa}/custody-accounts shows the SEGREGATED position carrying last_corporate_action_applied_id == ${ca_qnt}"
            - "POST /clearing/corporate-actions/${ca_qnt}/reverse restores net_quantity to exactly 3 and clears last_corporate_action_applied_id, so the aggregate settled quantity is conserved across the apply/reverse pair"
            - "GET /clearing/corporate-actions/${ca_qnt} reports status == REVERSED after the compensating action"
