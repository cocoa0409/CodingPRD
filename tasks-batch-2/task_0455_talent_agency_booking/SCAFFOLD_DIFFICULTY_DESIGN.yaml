              as: Agent
              captures: { booking_id: $.data.id }
            - call: "GET /talents/${talent_id}"
              payload: {}
              as: Agent
              captures: { tv2: $.data.version }
            - call: "POST /bookings/${booking_id}/confirm"
              payload: { expected_talent_version: "${tv2}" }
              as: Agent
