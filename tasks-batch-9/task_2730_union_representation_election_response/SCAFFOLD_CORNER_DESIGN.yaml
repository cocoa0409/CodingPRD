      - name: bulk_style_multi_row_write
        claim_type: Bulk action
        grounds:
          - endpoints
          - state_machines.Petition.transitions.SOI_VERIFIED_to_DISMISSED
        excluded_because:
          difficulty_instance: cascade_fan_out_breadth / insufficient_showing_dismissal_fan_out
          rationale: "\u00a71.5 declares no bulk endpoint; the nearest analogue is the single verify-showing call whose dismissal branch rewrites four child families at once, which the named \u00a71.8 instance verifies row by row including the non-terminal-only filter."

