              captures: { fresh_version: "$.data.version" }
          trigger:
            - call: "POST /discount-offers"
              payload: { invoice_id: "${invoice_id}", session_id: "${session_id}", offered_apr_bps: 900, requested_pay_date: "2026-08-05T00:00:00Z", acceptance_deadline: "2026-08-20T00:00:00Z", expected_invoice_version: "${fresh_version}" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "before the trigger: Invoice.${invoice_id}.status == SUPPRESSED and dispute_suppressed == true"
            - "HTTP 409 and error_id == ERR_INVOICE_DISPUTE_SUPPRESSED (not ERR_INVALID_STATE, which is the same 409 but the wrong cause)"
            - "Dispute.${dispute_id}.status == OPEN"
            - "no DiscountOffer row exists for the invoice: GET /discount-offers with invoice_id filter returns meta.total_count == 0"

      - name: body_foreign_keys_that_do_not_resolve_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - validations[priority=5]
          - errors.ERR_BUYER_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_SESSION_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
        distinguishing_aspect: |
          Each request carries exactly one unresolvable top-level body foreign key while every other
          field is valid, so the error id must name the failing key rather than defaulting to one
          generic 404 - and it must be a 404 rather than the priority-5 scope 403, because a row
          that does not exist has no owner to compare the caller against.
        test_recipe:
          setup:
            - "Buyer with an OPEN programme, one fully onboarded Supplier, one LIVE session and one ELIGIBLE invoice"
            - "The sentinel id 00000000-0000-0000-0000-000000009999 is never created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Body FK Buyer", tax_id: "330001112", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Body FK Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Body FK Supply", tax_id_last4: "1313", remittance_email: "ar@bodyfk.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
            - call: "POST /suppliers/${supplier_id}/onboarding/submit"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/bank-accounts"
              payload: { routing_number: "021000021", account_last4: "4321" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { bank_id: "$.data.id", md_code: "$.data.micro_deposit_code" }
            - call: "POST /bank-accounts/${bank_id}/micro-deposit/confirm"
              payload: { code: "${md_code}" }
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /suppliers/${supplier_id}/idv/adjudicate"
              payload: { decision: "PASSED", identity_score: 90 }
              as: PlatformOps
            - call: "POST /auction-sessions"
              payload: { program_id: "${program_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-31T00:00:00Z" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { session_id: "$.data.id" }
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-BODYFK.csv", declared_row_count: 1, declared_total_cents: 50000, rows: [ { invoice_number: "BFK-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 50000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformOps
            - call: "GET /invoices"
              payload: { file_id: "${file_id}" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { invoice_id: "$.data[0].id", invoice_version: "$.data[0].version" }
          trigger:
            - call: "POST /buyer-programs"
              payload: { buyer_id: "00000000-0000-0000-0000-000000009999", name: "Orphan Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200 }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { err_buyer: "$.data.error_id" }
            - call: "POST /auction-sessions"
              payload: { program_id: "00000000-0000-0000-0000-000000009999", opens_at: "2026-08-10T00:00:00Z", closes_at: "2026-08-20T00:00:00Z" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { err_program: "$.data.error_id" }
            - call: "POST /discount-offers"
              payload: { invoice_id: "${invoice_id}", session_id: "00000000-0000-0000-0000-000000009999", offered_apr_bps: 900, requested_pay_date: "2026-08-05T00:00:00Z", acceptance_deadline: "2026-08-20T00:00:00Z", expected_invoice_version: "${invoice_version}" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { err_session: "$.data.error_id" }
            - call: "POST /discount-offers"
              payload: { invoice_id: "00000000-0000-0000-0000-000000009999", session_id: "${session_id}", offered_apr_bps: 900, requested_pay_date: "2026-08-05T00:00:00Z", acceptance_deadline: "2026-08-20T00:00:00Z", expected_invoice_version: "${invoice_version}" }
              as: Supplier
              as_user_id: "${supplier_id}"
              captures: { err_invoice: "$.data.error_id" }
          assert:
            - "err_buyer == ERR_BUYER_NOT_FOUND with HTTP 404"
            - "err_program == ERR_PROGRAM_NOT_FOUND with HTTP 404"
            - "err_session == ERR_SESSION_NOT_FOUND with HTTP 404 (the invoice resolved, only the session did not)"
            - "err_invoice == ERR_INVOICE_NOT_FOUND with HTTP 404 (the session resolved, only the invoice did not)"
            - "none of the four rejections is a 403 ERR_FORBIDDEN_RESOURCE_SCOPE"
            - "Invoice.${invoice_id}.status is still ELIGIBLE and its version is unchanged; GET /buyers/${buyer_id}/programs still returns meta.total_count == 1"

      - name: path_parameters_that_do_not_resolve_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors.ERR_DISPUTE_NOT_FOUND
          - errors.ERR_OFFER_NOT_FOUND
          - errors.ERR_FUNDER_NOT_FOUND
          - errors.ERR_EARLY_PAYMENT_NOT_FOUND
          - errors.ERR_BANK_ACCOUNT_NOT_FOUND
        distinguishing_aspect: |
          Six different collections addressed by the same sentinel id must each report their own
          not-found error id, on reads and on action endpoints alike, and the lookup must precede
          every body-shape and business rule - the micro-deposit confirm call carries a
          well-formed code and the dispute resolve call a valid resolution, yet both still 404.
        test_recipe:
          setup:
            - "An empty system: only the logical clock is set, no rows of any kind are created"
            - "Every call is made as PlatformOps, so the outcome cannot be confused with a role or scope rejection"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
          trigger:
            - call: "GET /buyers/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PlatformOps
              captures: { err_buyer: "$.data.error_id" }
            - call: "GET /discount-offers/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PlatformOps
              captures: { err_offer: "$.data.error_id" }
            - call: "GET /funders/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PlatformOps
              captures: { err_funder: "$.data.error_id" }
            - call: "GET /early-payments/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: PlatformOps
              captures: { err_payment: "$.data.error_id" }
            - call: "POST /disputes/00000000-0000-0000-0000-000000009999/resolve"
              payload: { resolution: "UPHELD" }
              as: PlatformOps
              captures: { err_dispute: "$.data.error_id" }
            - call: "POST /bank-accounts/00000000-0000-0000-0000-000000009999/micro-deposit/confirm"
              payload: { code: "021432" }
              as: PlatformOps
              captures: { err_bank: "$.data.error_id" }
          assert:
            - "err_buyer == ERR_BUYER_NOT_FOUND with HTTP 404"
            - "err_offer == ERR_OFFER_NOT_FOUND with HTTP 404"
            - "err_funder == ERR_FUNDER_NOT_FOUND with HTTP 404"
            - "err_payment == ERR_EARLY_PAYMENT_NOT_FOUND with HTTP 404"
            - "err_dispute == ERR_DISPUTE_NOT_FOUND with HTTP 404 (not ERR_INVALID_STATE and not ERR_ALREADY_TERMINAL)"
            - "err_bank == ERR_BANK_ACCOUNT_NOT_FOUND with HTTP 404 (not ERR_MICRO_DEPOSIT_ATTEMPTS_EXHAUSTED)"

      - name: higher_priority_state_rule_wins_over_the_fiscal_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=28]
        distinguishing_aspect: |
          A request that violates a state rule and a fiscal rule at once must report the state
          error.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / paused_program_state_beats_buyer_credit_limit
          rationale: |
            That priority-pair instance drives exactly this pair, asserting ERR_PROGRAM_NOT_OPEN for
            the double violation and then ERR_BUYER_CREDIT_LIMIT_EXCEEDED once only the lower rule
            is left, plus the absence of any side effect from either rejection.

      - name: temporal_rule_wins_over_the_rate_bounds_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=16]
          - validations[priority=19]
        distinguishing_aspect: |
          Violating a lower-numbered temporal rule and a higher-numbered business-constraint rule in
          the same call must surface the temporal error.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / acceptance_window_beats_tightened_apr_ceiling
          rationale: |
            The difficulty instance builds precisely that double violation - a lapsed acceptance
            window on an offer whose APR also breaches the ceiling the settlement cascade tightened
            - and then isolates each rule on its own.

      - name: aggregate_concentration_limit_is_checked_across_the_programme
        claim_type: aggregate_validation
        grounds:
          - validations[priority=25]
          - calculations.supplier_concentration
        distinguishing_aspect: |
          Each individual acceptance is legal while the collective share breaches the cap, so the
          rule has to aggregate rather than inspect one invoice.
        excluded_because:
          difficulty_instance: boundary_precision_check / concentration_cap_rounds_to_two_decimals_before_the_strict_comparison
          rationale: |
            That boundary instance accepts a sequence of individually legal offers until the
            aggregate share crosses the cap, at three rounding positions around 60.00, which fully
            contains this claim.

      - name: session_window_conflict_is_a_temporal_check_against_neighbours
        claim_type: temporal_validation
        grounds:
          - validations[priority=17]
          - global_constants.SESSION_COOLDOWN_MINUTES
        distinguishing_aspect: |
          A window that is legal in isolation must be refused because of the cooldown it shares with
          an existing session.
        excluded_because:
          difficulty_instance: resource_temporal_overlap / session_exclusive_occupancy_with_sixty_minute_cooldown
          rationale: |
            The resource_temporal_overlap instance already probes abutting, gapped-by-30-minutes and
            gapped-by-exactly-60-minutes windows on both sides, plus the CANCELLED session that no
            longer occupies the programme.

      - name: supplier_readiness_depends_on_a_different_entity
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          The validity of an offer depends on the state of the Supplier and its BankAccount rather
          than on the request itself, so both the valid and invalid cross-entity states must be
          exercised.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sanctions_hold_beats_supplier_payment_readiness
          rationale: |
            That cross_entity_state_dependency instance drives both arms on two suppliers - one held
            by sanctions, one with an incomplete bank axis - and then shows the same request body
            succeeding after the hold is lifted.

      - name: reclass_override_reason_is_required_only_when_it_differs_from_the_default
        claim_type: conditional_validation
        grounds:
          - validations[priority=23]
          - calculations.accounting_classification_default
        distinguishing_aspect: |
          The override-reason rule fires only when the requested classification differs from the
          computed default, so the with-flag and without-flag arms must both be tested.
        excluded_because:
          difficulty_instance: non_linear_state_machine / early_payment_three_independent_axes_funding_settlement_accounting
          rationale: |
            That instance asserts ERR_RECLASS_OVERRIDE_REASON_REQUIRED for the differing
            classification submitted without a reason, then the same classification accepted with
            one, and finally a later classification equal to the default accepted with no reason at
            all - both arms of the condition.

  - section: endpoints
    instances:
      - name: payable_file_with_one_duplicate_row_partially_accepts
        claim_type: bulk_action
        grounds:
          - endpoints[POST /payable-files]
          - entities.ApprovedPayableFile.fields.rejection_reasons
          - entities.ApprovedPayableFile.fields.ingest_status
          - entities.Invoice.fields.invoice_number
          - validations[priority=18]
        distinguishing_aspect: |
          Ingestion is skip-not-rollback: a file whose middle row repeats the first row's
          invoice_number must still create the two good invoices, report ingest_status
          PARTIALLY_ACCEPTED and pin the failure to row_index 1 (zero-based) with reason
          DUPLICATE_INVOICE_NUMBER. Because the control totals reconcile against the accepted rows
          only, declared_row_count 2 and declared_total_cents 80000 are correct here even though
          three rows were submitted - an implementation that reconciles against all rows raises a
          spurious ERR_FILE_TOTALS_MISMATCH, and one that rolls the whole file back creates nothing.
        test_recipe:
          setup:
            - "Buyer with one OPEN programme and one Supplier row (the supplier resolves, so no row is rejected for SUPPLIER_UNKNOWN)"
            - "A three-row file: row 0 DUP-1 for 50000, row 1 DUP-1 again for 70000, row 2 DUP-3 for 30000"
            - "Control totals declared over the accepted rows only: declared_row_count 2, declared_total_cents 80000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Partial File Buyer", tax_id: "331112223", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Partial File Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
            - call: "POST /suppliers"
              payload: { legal_name: "Partial File Supply", tax_id_last4: "1414", remittance_email: "ar@partial.example" }
              as: PlatformOps
              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: "POST /payable-files"
              payload: { program_id: "${program_id}", filename: "AP-PARTIAL.csv", declared_row_count: 2, declared_total_cents: 80000, rows: [ { invoice_number: "DUP-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 50000, tax_rate_bps: 0 } ] }, { invoice_number: "DUP-1", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 70000, tax_rate_bps: 0 } ] }, { invoice_number: "DUP-3", approval_date: "2026-07-20T00:00:00Z", net_due_date: "2026-09-30T00:00:00Z", supplier_id: "${supplier_id}", lines: [ { line_no: 1, line_amount_cents: 30000, tax_rate_bps: 0 } ] } ] }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { file_id: "$.data.id", ingest_status: "$.data.ingest_status", accepted: "$.data.accepted_row_count", rejected: "$.data.rejected_row_count", computed_total: "$.data.computed_total_cents" }
          assert:
            - "HTTP 201 and ingest_status == PARTIALLY_ACCEPTED"
            - "accepted == 2, rejected == 1, computed_total == 80000, suppressed_row_count == 0"
            - "rejection_reasons == [ { row_index: 1, reason: DUPLICATE_INVOICE_NUMBER } ] - zero-based index of the offending row"
            - "no ERR_FILE_TOTALS_MISMATCH: the declared totals are reconciled against the two accepted rows"
            - "GET /invoices with file_id filter returns meta.total_count == 2, ordered created_at ASC as DUP-1 then DUP-3, both ELIGIBLE with face_amount_cents 50000 and 30000"
            - "the rejected row created no Invoice: no invoice with face_amount_cents 70000 exists"

      - name: program_close_from_paused_cascades_to_sessions_and_the_buyer
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /buyer-programs/{id}/status]
          - state_machines.BuyerProgram
          - state_machines.AuctionSession.SCHEDULED_to_CANCELLED
          - state_machines.Buyer
        distinguishing_aspect: |
          CLOSE is reachable from PAUSED as well as from OPEN, and closing the buyer's only
          non-terminal programme fires two cascades in one call: the SCHEDULED session is CANCELLED
          and the Buyer is SUSPENDED because no DRAFT/OPEN/PAUSED programme of that buyer remains.
          The version counter also has to record all four writes (create, open, pause, close).
        test_recipe:
          setup:
            - "Buyer with exactly one programme, taken to OPEN and then PAUSED"
            - "One SCHEDULED session on that programme opening 2026-08-10 and closing 2026-08-20"
            - "Logical clock at 2026-08-01, so the session has not started"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Cascade Close Buyer", tax_id: "332223334", credit_limit_cents: 100000000, self_funding_enabled: true }
              as: PlatformOps
              captures: { buyer_id: "$.data.id" }
            - call: "POST /buyer-programs"
              payload: { buyer_id: "${buyer_id}", name: "Cascade Close Programme", program_type: "SUPPLIER_NAMED", max_acceptable_apr_bps: 1200, min_days_early: 5, concentration_cap_pct: 100.00, funding_policy: "SELF_ONLY" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { program_id: "$.data.id", v_create: "$.data.version" }
            - call: "POST /buyer-programs/${program_id}/open"
              payload: {}
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { v_open: "$.data.version" }
            - call: "POST /auction-sessions"
              payload: { program_id: "${program_id}", opens_at: "2026-08-10T00:00:00Z", closes_at: "2026-08-20T00:00:00Z" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { session_id: "$.data.id" }
            - call: "POST /buyer-programs/${program_id}/status"
              payload: { action: "PAUSE" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { paused_status: "$.data.status", v_pause: "$.data.version" }
          trigger:
            - call: "POST /buyer-programs/${program_id}/status"
              payload: { action: "CLOSE" }
              as: BuyerAdmin
              as_user_id: "${buyer_id}"
              captures: { closed_status: "$.data.status", v_close: "$.data.version" }
          assert:
            - "before the trigger: paused_status == PAUSED, v_create == 1, v_open == 2, v_pause == 3"
            - "HTTP 200 and closed_status == CLOSED with v_close == 4"
            - "AuctionSession.${session_id}.status == CANCELLED (cascade from the closing programme, even though it never opened)"
            - "Buyer.${buyer_id}.status == SUSPENDED - no DRAFT, OPEN or PAUSED programme of this buyer remains"
            - "GET /buyer-programs/${program_id}/auction-sessions returns meta.total_count == 1 and that single row is the CANCELLED session"

      - name: program_analytics_read_reports_both_concentration_bases
        claim_type: computed_read
        grounds:
          - endpoints[GET /buyer-programs/{id}/analytics]
          - calculations.supplier_concentration
          - calculations.program_adoption_rate
          - calculations.weighted_avg_accepted_apr
          - calculations.rate_optimisation_ceiling
        distinguishing_aspect: |
          One settled invoice of face 100000 and one still-ELIGIBLE invoice of face 50000 make the
          two concentration variants disagree in the same response: the FACE_BASIS share is
          100000/150000 = 66.67 while the FUNDED_BASIS share is 98500/98500 = 100.00, because
          AWARDED-but-unexecuted and ELIGIBLE face is excluded from the funded denominator. The read
          model must also echo adoption 50.00, posture OPTIMISED and the ceiling 900 that the
          settlement cascade wrote, and it must write nothing.
        test_recipe:
          setup:
            - "Buyer with one OPEN SUPPLIER_NAMED programme (max_acceptable_apr_bps 1200, concentration_cap_pct 100.00)"
            - "One fully onboarded Supplier; a file with two invoices due 2026-09-30: ANL-BIG 100000 and ANL-SMALL 50000"
            - "ANL-BIG is named at 1000 bps for 2026-08-05, accepted, reserved, executed on 2026-08-05 and confirmed on 2026-08-07 (final discount 1500, net 98500)"
            - "ANL-SMALL is left ELIGIBLE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
