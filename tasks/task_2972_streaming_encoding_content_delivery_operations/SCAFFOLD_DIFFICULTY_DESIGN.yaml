# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2972 — Streaming Encoding & Content Delivery Operations
#
# Nine rule_id blocks, 19 instances total. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.6; every `setup_api_calls:` chain starts from an empty
# database and uses only endpoints declared in §1.5; every numeric assert is a
# literal computed from the §1.3 formulas and their constants.
#
# Shared fixture conventions used across instances (each instance still declares
# its own full chain — no cross-instance dependencies):
#   DP_TV      device_class SMART_TV_4K,   HEVC/AV1, 3000..25000 kbps, requires WIDEVINE, share 30.00, qnf 1.00
#   DP_MOBILE  device_class MOBILE_HIGH,   H264/HEVC, 800..6000 kbps, no DRM,             share 45.00, qnf 0.90
#   DP_LEGACY  device_class SET_TOP_LEGACY, H264,      500..3000 kbps, no DRM,            share 25.00, qnf 0.75
#   The logical clock is left at its startup default 2026-08-01T00:00:00Z unless
#   an instance explicitly calls POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: title_readiness_provisional_vs_certified
        grounds:
          - calculations.title_readiness_score
          - entities.Title.fields.readiness_score_provisional
          - entities.Title.fields.readiness_score_certified
          - state_machines.Title.availability_state.SCHEDULED_to_PUBLISHED
        distinguishing_aspect: |
          The provisional and certified variants of title_readiness_score read the SAME five
          MezzanineAssets, one EncodingLadder and one DrmPackage and return 100.00 and 80.00
          respectively, because provisional counts the two still-INGESTED assets as future passes
          while certified counts only the three QC_PASSED ones. This instance's entity domain is
          Title publication readiness; the sibling instance scores CdnVendor delivery performance.
        test_recipe:
          setup:
            - "One MOBILE_HIGH device profile exists so the ladder can validate."
            - "Title TTL-READY-01 (MOVIE) owns exactly five MezzanineAssets: three QC_PASSED, two still INGESTED."
            - "The Title owns one LOCKED HEVC ladder and one PACKAGED DrmPackage."
            - "Logical clock untouched at the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-READY-01", title_name: "Readiness Reference Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/ready-01-reel1.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a1_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/ready-01-reel2.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a2_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/ready-01-reel3.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a3_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/ready-01-reel4.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/ready-01-reel5.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
            - call: "POST /mezzanine-assets/${a1_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a2_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "POST /mezzanine-assets/${a3_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 5000 }, { label: "2160p", height_px: 2160, bitrate_kbps: 12000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE", "FAIRPLAY"], license_server_url: "https://lic.novapic.example/v1", persistent_license_allowed: true }
              as: DrmOperator
              captures: { p_id: $.data.id }
            - call: "POST /drm-packages/${p_id}/entitlement-rules"
              payload: { region_code: "*", subscription_tier: "ANY", device_class_scope: "ALL", max_concurrent_streams: 3, max_playback_height_px: 2160, hdcp_level: "TYPE_1", offline_playback_allowed: true, priority: 50 }
              as: DrmOperator
            - call: "POST /drm-packages/${p_id}/package"
              payload: {}
              as: DrmOperator
          trigger:
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
          assert:
            - "Title.${t_id}.readiness_score_provisional == 100.00"
            - "Title.${t_id}.readiness_score_certified == 80.00"
            - "Title.${t_id}.readiness_score_provisional != Title.${t_id}.readiness_score_certified"
            - "Title.${t_id}.packaging_state == PACKAGED"
            - "Title.${t_id}.availability_state == DRAFT"
            - "Title.${t_id}.locked_ladder_count == 1"

      - name: vendor_health_rolling_vs_contract
        grounds:
          - calculations.vendor_health_score
          - calculations.playback_quality_index
          - entities.CdnVendor.fields.health_score_rolling
          - entities.CdnVendor.fields.health_score_contract
          - entities.CdnVendor.fields.breach_window_count
        distinguishing_aspect: |
          Four PlaybackMetricWindows on one CdnVendor yield health_score_rolling 68.47 (unweighted
          mean of the newest three windows) and health_score_contract 72.37 (play_attempts-weighted
          mean of all four) from identical stored rows. The entity domain is CdnVendor delivery
          performance, not Title readiness, and the divergence comes from the WEIGHTING and the
          WINDOW SIZE rather than from an optimistic-vs-evidence inclusion set.
        test_recipe:
          setup:
            - "One SMART_TV_4K device profile with quality_normalization_factor 1.00."
            - "One CdnVendor ALPHA serving US with committed_gbps 100.00."
            - "One MOVIE Title used only as the metric subject."
            - "Four closed metric windows ingested in chronological order, all before the 2026-08-01T00:00:00Z clock default: quality_index 93.10 / 33.50 / 81.50 / 90.40 with play_attempts 1000 / 1000 / 1000 / 500."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "SMART_TV_4K", max_height_px: 2160, supported_codecs: ["HEVC", "AV1"], min_bitrate_kbps: 3000, max_bitrate_kbps: 25000, hdcp_required: true, required_drm_system: "WIDEVINE", market_share_pct: 30.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { dp_tv_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "ALPHA", regions: ["US"], committed_gbps: 100.00, cost_per_gb_usd: 0.0300 }
              as: PlatformAdmin
              captures: { v_alpha_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-HEALTH-01", title_name: "Health Metrics Subject", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_tv_id}", vendor_id: "${v_alpha_id}", region_code: "US", window_start_at: "2026-07-20T00:00:00Z", window_end_at: "2026-07-21T00:00:00Z", play_attempts: 1000, rebuffer_events: 20, startup_ms_p95: 2100, error_count: 1 }
              as: DeliveryEngineer
              captures: { w1_id: $.data.id }
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_tv_id}", vendor_id: "${v_alpha_id}", region_code: "US", window_start_at: "2026-07-22T00:00:00Z", window_end_at: "2026-07-23T00:00:00Z", play_attempts: 1000, rebuffer_events: 90, startup_ms_p95: 4400, error_count: 20 }
              as: DeliveryEngineer
              captures: { w2_id: $.data.id }
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_tv_id}", vendor_id: "${v_alpha_id}", region_code: "US", window_start_at: "2026-07-24T00:00:00Z", window_end_at: "2026-07-25T00:00:00Z", play_attempts: 1000, rebuffer_events: 30, startup_ms_p95: 2600, error_count: 5 }
              as: DeliveryEngineer
              captures: { w3_id: $.data.id }
          trigger:
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_tv_id}", vendor_id: "${v_alpha_id}", region_code: "US", window_start_at: "2026-07-26T00:00:00Z", window_end_at: "2026-07-27T00:00:00Z", play_attempts: 500, rebuffer_events: 10, startup_ms_p95: 2200, error_count: 2 }
              as: DeliveryEngineer
              captures: { w4_id: $.data.id }
            - call: "GET /cdn-vendors/${v_alpha_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "PlaybackMetricWindow.${w1_id}.quality_index == 93.10"
            - "PlaybackMetricWindow.${w2_id}.quality_index == 33.50"
            - "PlaybackMetricWindow.${w2_id}.breach_flag == true"
            - "PlaybackMetricWindow.${w3_id}.quality_index == 81.50"
            - "PlaybackMetricWindow.${w4_id}.quality_index == 90.40"
            - "CdnVendor.${v_alpha_id}.health_score_rolling == 68.47"
            - "CdnVendor.${v_alpha_id}.health_score_contract == 72.37"
            - "CdnVendor.${v_alpha_id}.breach_window_count == 1"
            - "CdnVendor.${v_alpha_id}.state == ACTIVE"

  - rule_id: combinatorial_formula
    instances:

      - name: reprocess_cost_round_per_rung_then_sum
        grounds:
          - calculations.reprocess_cost_estimate
          - entities.ReprocessJob.fields.per_rung_cost_usd
          - entities.ReprocessJob.fields.cost_estimate_usd
          - entities.ReprocessJob.fields.priority_rank
          - concurrency_rules[reprocess-create-stale-title]
        distinguishing_aspect: |
          Mode (b) nested rounding: the four rung costs round to 3.11 / 6.35 / 13.10 / 26.06 and sum
          to cost_estimate_usd == 48.62, whereas summing the unrounded products and rounding once
          gives 48.60. The scaffold pins round-per-rung-then-sum, so 48.60 is the wrong answer. The
          sibling combinatorial instance is a mode (c) evaluation-order pin, not a rounding-order pin.
        test_recipe:
          setup:
            - "MOBILE_HIGH and SET_TOP_LEGACY device profiles exist so an H264 ladder can validate."
            - "Title TTL-REPRO-01 (MOVIE) owns one QC_PASSED MezzanineAsset of exactly 6000 duration_seconds, i.e. 100 whole minutes."
            - "The Title owns one LOCKED H264 ladder with rungs 1150 / 2350 / 4850 / 9650 kbps."
            - "The Title keeps the default encode_budget_usd 5000.00."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /device-profiles"
              payload: { device_class: "SET_TOP_LEGACY", max_height_px: 720, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 3000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 25.00, quality_normalization_factor: 0.75 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-REPRO-01", title_name: "Reprocess Cost Reference", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/repro-01.mxf", duration_seconds: 6000, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a1_id: $.data.id }
            - call: "POST /mezzanine-assets/${a1_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "360p", height_px: 360, bitrate_kbps: 1150 }, { label: "540p", height_px: 540, bitrate_kbps: 2350 }, { label: "720p", height_px: 720, bitrate_kbps: 4850 }, { label: "1080p", height_px: 1080, bitrate_kbps: 9650 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: EncodingEngineer
              captures: { t_ver2: $.data.version }
          trigger:
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "CODEC_DEPRECATION", target_codec_family: "HEVC", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { j_id: $.data.id }
          assert:
            - "ReprocessJob.${j_id}.per_rung_cost_usd == [3.11, 6.35, 13.10, 26.06]"
            - "ReprocessJob.${j_id}.cost_estimate_usd == 48.62"
            - "ReprocessJob.${j_id}.cost_estimate_usd != 48.60"
            - "ReprocessJob.${j_id}.priority_rank == 44.86"
            - "ReprocessJob.${j_id}.state == QUEUED"
            - "ReprocessJob.${j_id}.committed_usd == 0.00"
            - "Title.${t_id}.encode_budget_remaining_usd == 5000.00"

      - name: egress_tier_keyed_on_base_cost
        grounds:
          - calculations.egress_cost_projection
          - calculations.routing_vendor_selection
          - entities.RoutingPolicy.fields.projected_egress_cost_usd
          - entities.RoutingPolicy.fields.selection_reason_code
        distinguishing_aspect: |
          Mode (c) evaluation-order pin: base_cost 480.00 selects SURCHARGE_LOW 0.08 because the tier
          reads base_cost, giving projected_egress_cost_usd == 518.40. Keying the tier on the final
          total (518.40 >= TIER_LOW_MAX) would give 504.00. This is an ordering pin on a
          circular-looking dependency, a different combinatorial mode from the sibling instance's
          per-rung rounding order.
        test_recipe:
          setup:
            - "One SMART_TV_4K device profile with quality_normalization_factor 1.00 and one MOBILE_HIGH profile with 0.90."
            - "One CdnVendor CHARLIE serving US and CA with cost_per_gb_usd 0.0400 — the only vendor serving CA."
            - "One MOVIE Title with a single closed metric window in region CA carrying 4800 play_attempts, so projected_monthly_gb is 12000.00."
            - "Logical clock untouched at 2026-08-01T00:00:00Z; the metric window ends 2026-07-26T00:00:00Z."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
              captures: { dp_mobile_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "CHARLIE", regions: ["US", "CA"], committed_gbps: 60.00, cost_per_gb_usd: 0.0400 }
              as: PlatformAdmin
              captures: { v_charlie_id: $.data.id }
            - call: "POST /titles"
              payload: { external_ref: "TTL-EGRESS-01", title_name: "Egress Tier Reference", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${dp_mobile_id}", vendor_id: "${v_charlie_id}", region_code: "CA", window_start_at: "2026-07-25T00:00:00Z", window_end_at: "2026-07-26T00:00:00Z", play_attempts: 4800, rebuffer_events: 96, startup_ms_p95: 2100, error_count: 5 }
              as: DeliveryEngineer
              captures: { w_ca_id: $.data.id }
          trigger:
            - call: "POST /routing-policies"
              payload: { title_id: "${t_id}", region_code: "CA", steering_mode: "PERFORMANCE" }
              as: DeliveryEngineer
              captures: { pol_id: $.data.id }
          assert:
            - "PlaybackMetricWindow.${w_ca_id}.quality_index == 93.79"
            - "PlaybackMetricWindow.${w_ca_id}.breach_flag == false"
            - "RoutingPolicy.${pol_id}.primary_vendor_id == ${v_charlie_id}"
            - "RoutingPolicy.${pol_id}.backup_vendor_id == null"
            - "RoutingPolicy.${pol_id}.state == STANDBY_ONLY"
            - "RoutingPolicy.${pol_id}.selection_reason_code == PERFORMANCE_RANK"
            - "RoutingPolicy.${pol_id}.projected_egress_cost_usd == 518.40"
            - "RoutingPolicy.${pol_id}.projected_egress_cost_usd != 504.00"

      - name: device_compat_score_four_input_interaction
        grounds:
          - calculations.device_compat_score
          - entities.EncodingLadder.fields.device_compat_score
          - entities.EncodingLadder.fields.compatible_device_count
          - state_machines.EncodingLadder.DRAFT_to_VALIDATED
        distinguishing_aspect: |
          Mode (a) non-linear interaction of four inputs: the SMART_TV_4K profile counts only because
          a PENDING DrmPackage already advertises WIDEVINE, the SET_TOP_LEGACY profile is excluded by
          codec, the rung_count 4 coverage multiplier min(1.00, 4/5) scales the 75.00 combined share
          to 60.00, and the peak_height_px 2160 bonus adds 5.00 for device_compat_score == 65.00.
        test_recipe:
          setup:
            - "All three device profiles exist and are ACTIVE."
            - "Title TTL-COMPAT-01 (MOVIE) owns one QC_PASSED asset and one DRAFT HEVC ladder with 4 rungs peaking at 2160p/12000 kbps."
            - "A PENDING DrmPackage advertising WIDEVINE is already bound to that DRAFT ladder."
          setup_api_calls:
            - call: "POST /device-profiles"
              payload: { device_class: "SMART_TV_4K", max_height_px: 2160, supported_codecs: ["HEVC", "AV1"], min_bitrate_kbps: 3000, max_bitrate_kbps: 25000, hdcp_required: true, required_drm_system: "WIDEVINE", market_share_pct: 30.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264", "HEVC"], min_bitrate_kbps: 800, max_bitrate_kbps: 6000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 45.00, quality_normalization_factor: 0.90 }
              as: PlatformAdmin
            - call: "POST /device-profiles"
              payload: { device_class: "SET_TOP_LEGACY", max_height_px: 720, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 3000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 25.00, quality_normalization_factor: 0.75 }
              as: PlatformAdmin
            - call: "POST /titles"
              payload: { external_ref: "TTL-COMPAT-01", title_name: "Compatibility Matrix Reference", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /mezzanine-assets"
              payload: { title_id: "${t_id}", source_uri: "s3://mez/compat-01.mxf", duration_seconds: 7200, frame_rate: 24.0, peak_audio_lufs: -24.0, artifact_defect_count: 0, caption_languages: ["en"], audio_language: "en" }
              as: ContentOps
              captures: { a1_id: $.data.id }
            - call: "POST /mezzanine-assets/${a1_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "HEVC", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }, { label: "1080p", height_px: 1080, bitrate_kbps: 5000 }, { label: "2160p", height_px: 2160, bitrate_kbps: 12000 }], expected_title_version: "${t_ver}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/v1", persistent_license_allowed: false }
              as: DrmOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
          assert:
            - "EncodingLadder.${l_id}.state == VALIDATED"
            - "EncodingLadder.${l_id}.validation_reason_code == OK"
            - "EncodingLadder.${l_id}.compatible_device_count == 2"
            - "EncodingLadder.${l_id}.device_compat_score == 65.00"
            - "EncodingLadder.${l_id}.rung_count == 4"
            - "EncodingLadder.${l_id}.peak_height_px == 2160"
            - "EncodingLadder.${l_id}.peak_bitrate_kbps == 12000"
            - "DrmPackage.${p_id}.hdcp_floor == TYPE_1"

  - rule_id: non_linear_state_machine
    instances:

      - name: mezzanine_qc_revision_cycle_terminates
        grounds:
          - state_machines.MezzanineAsset.INGESTED_to_QC_FAILED
          - state_machines.MezzanineAsset.QC_FAILED_to_REMEDIATION_REQUESTED
          - state_machines.MezzanineAsset.REMEDIATION_REQUESTED_to_INGESTED
          - state_machines.MezzanineAsset.INGESTED_to_QC_REJECTED
          - calculations.mezzanine_qc_verdict
        distinguishing_aspect: |
          The asset traverses the cycle INGESTED -> QC_FAILED -> REMEDIATION_REQUESTED -> INGESTED
          twice and the cycle terminates on the third FAIL because qc_attempt_count is deliberately NOT
          reset by a resubmit, landing in the terminal QC_REJECTED where a fourth qc-run is a 409. The
          sibling non-linear instance is a parallel two-dimension machine, not a bounded cycle.
        test_recipe:
          setup:
            - "Title TTL-CYCLE-01 (MOVIE) owns exactly one MezzanineAsset."
            - "The asset carries 9 artifact defects and no caption languages while its audio_language is en, so every QC run scores severity_index 66.00 with two blocking defects."
            - "Two full FAIL -> remediation -> resubmit laps are already recorded; qc_attempt_count is 2."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-CYCLE-01", title_name: "QC Revision Cycle", content_type: "MOVIE", studio_code: "NOVAPIC" }
