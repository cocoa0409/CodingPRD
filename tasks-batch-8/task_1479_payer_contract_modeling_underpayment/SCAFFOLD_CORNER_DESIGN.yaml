        claim_type: triggerable
        grounds: ["errors[ERR_ESCALATOR_DATE_COLLISION]", "validations[priority=10]"]
        distinguishing_aspect: "Two escalators with the same effective_date on one contract: the second is rejected ERR_ESCALATOR_DATE_COLLISION."
