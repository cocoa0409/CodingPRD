            - "A PhysicalInventory for (S100, CF1) scheduled 2026-09-10..2026-09-12 with recount_threshold_bps OMITTED so the 150 default applies."
            - "It is started, given one line counting 90 units against the 100-unit book snapshot, and its first pass is completed: book_value_cents 123400, counted_value_cents 111060, net_variance_cents -12340 and net_variance_bps floor(10000 * 12340 / 123400) = 1000."
