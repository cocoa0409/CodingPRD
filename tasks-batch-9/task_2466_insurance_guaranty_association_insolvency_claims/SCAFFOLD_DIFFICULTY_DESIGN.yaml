            - "CoveredClaim.${clm_id}.net_payable_cents == 3000000"
            - "CoveredClaim.${clm_id}.approved_by_user_id == officer-1"
            - "Insolvency.${ins_id}.reserved_claim_cents == 3000000"

  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_terms_are_half_open_so_a_touching_renewal_is_accepted
        grounds:
          - validations[priority=33]
          - entities.TransferredPolicy.fields.expiration_date
          - errors[ERR_POLICY_PERIOD_OVERLAP]
        distinguishing_aspect: |
          A TransferredPolicy term is the half-open interval [effective_date, expiration_date), so the
          renewal starting exactly on the prior term's expiration date 2026-10-01 is accepted while a
          term starting 2026-09-01 - one month inside the incumbent term - is refused with
          ERR_POLICY_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "A PERSONAL_AUTO CoverageProfile is registered."
            - "Insolvency in DECLARED (policies may be imported before the order is triggered)."
            - "TransferredPolicy PA-1001 imported for the term 2025-10-01 to 2026-10-01."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_1: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2026-10-01", expiration_date: "2027-10-01", annual_premium_cents: 1260000 }
              as: ReceiverLiaison
              captures: { pol_2: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2026-09-01", expiration_date: "2027-09-01", annual_premium_cents: 1260000 }
              as: ReceiverLiaison
              captures: { err: $.data.error_id }
          assert:
            - "TransferredPolicy.${pol_2}.effective_date == 2026-10-01"
            - "TransferredPolicy.${pol_2}.status == IMPORTED"
            - "${err} == ERR_POLICY_PERIOD_OVERLAP with HTTP 409"
            - "GET /policies with insolvency_id == ${ins_id} returns exactly 2 rows"
            - "Insolvency.${ins_id}.policy_count == 2"

      - name: adjuster_engagements_are_closed_intervals_so_touching_dates_collide
        grounds:
          - validations[priority=34]
          - entities.VendorAssignment.fields.engagement_end
          - state_machines.VendorAssignment.ASSIGNED_to_SUPERSEDED
          - errors[ERR_ADJUSTER_ENGAGEMENT_OVERLAP]
        distinguishing_aspect: |
          Unlike the half-open policy term, a VendorAssignment occupies the closed interval
          [engagement_start, engagement_end], so a second ADJUSTER engagement starting on
          2026-08-31 collides with an incumbent ending 2026-08-31, while a DEFENSE_COUNSEL engagement
          over the very same dates is accepted because the check is scoped to one vendor_type.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED, PERSONAL_AUTO policy in CANCELLED_BY_ORDER."
            - "CoveredClaim C-1 in ADJUSTING with one ASSIGNED ADJUSTER engagement over 2026-08-01 to 2026-08-31."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 4500000 }
              as: CoverageAnalyst
