              as: TrafficCoordinator
          assert:
            - "per_spot_rate_cents == 3650/3 == 1216.666... and is NEVER rounded before the per-item multiplication"
            - "items 2 and 3 are SHORT_AIR: raw_credit == (3650/3) * (100 - 97) / 100 == 36.5 cents EXACTLY, and round_half_up(36.5) == 37 each"
            - "${pre_credit} == 74 (37 + 37 + 0) — NOT 72 (banker's rounding of 36.5 to 36), NOT 73 (round the 73.0 sum once), NOT 75"
            - "item 4 measured 99 == unit_duration_seconds 100 - AIR_TOLERANCE_SECONDS 1 classifies as AIRED_FULL with raw_credit 0, because the comparison is >= — a > would make it SHORT_AIR and push the total to 74 + 15 == 89"
