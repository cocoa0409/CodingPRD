# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — Test Targeting Index (SKILL.md §1.8)
#
# 9 rule_ids x >= 2 instances = 19 instances. Every `grounds:` entry resolves to
# a declared element of SCAFFOLD.yaml §1.1-§1.7. Every numeric literal in an
# `assert:` line was computed by executing the relevant §1.3 formula as exact
# decimal / integer / datetime arithmetic before being written here.
#
# Shared conventions across every instance below:
#   * The logical clock is pinned to 2026-08-12T00:00:00Z first; the server's
#     unset default is 2026-08-01T00:00:00Z.
#   * PlatformAdmin acts as X-User-ID "admin-1" (a second admin "admin-2" is
#     used where certification's separated duty is in play); Moderators act as
#     "mod-1" (opens) and "mod-2" (decides).
#   * Every `expected_*_version` value is captured from a GET issued immediately
#     before the guarded write, never written as a literal.
#   * Canvass windows always END at or before the clock, and every RequestArea
#     centre pair is either > 300 m apart or time-disjoint unless the instance is
#     deliberately probing the overlap rule.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: share_rate_provisional_vs_certified_diverge_on_suppressed_share
        grounds:
          - calculations.share_rate_bps
          - entities.VideoRequest.fields.provisional_share_rate_bps
          - entities.TransparencyReport.fields.certified_share_rate_bps
          - entities.TransparencyReport.fields.published_share_rate_bps
          - entities.ConsentSolicitation.fields.notification_suppressed
          - state_machines.TransparencyReport.variant.PROVISIONAL_to_CERTIFIED
          - concurrency_rules[transparency-report-create-stale-agency]
        distinguishing_aspect: |
          Dual variant #1 lives in the agency-reporting domain: over one identical set of
          five ConsentSolicitation rows the PROVISIONAL branch yields 4000 bps and the
          CERTIFIED branch yields 2500 bps, because the certified inclusion set drops both
          the unresolved rows AND the one SHARED row whose notification was suppressed —
          so the divergence is not a mere denominator shrink and the certified rate lands
          BELOW the provisional rate.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency Riverbend ONBOARDED with min_device_threshold 3, max_open_requests 3, period_request_quota 20, post_share_retention_days 30, justification_min_chars 80."
            - "Five residents R1..R5, each owning exactly one ACTIVE camera at (0,10), (0,20), (0,30), (0,40), (0,50); R2 has notification_mute_enabled true so R2's consent notification is suppressed while R2 can still answer."
            - "RequestArea centred (0,0) radius 500 over footage window 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z, LOCKED with eligible_device_count 5 and effective_min_devices 3."
            - "VideoRequest justified (compliance_state JUSTIFICATION_LOGGED) and then SUBMITTED, which raises compliance_state to AUDIT_FLAGGED because eligible_device_count 5 > AUDIT_DEVICE_TRIGGER 4; five solicitations exist with respond_deadline_utc 2026-08-15T00:00:00Z."
            - "R1 shares, R2 shares, R3 declines, R4 and R5 stay silent; the clock is then moved to 2026-08-15T01:00:00Z and the retention sweep expires R4's and R5's solicitations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "Signed MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_req_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 0, notification_budget_per_day: 6, notification_mute_enabled: true }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R3", email: "r3@example.test", home_x_m: 0, home_y_m: 30, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R4", email: "r4@example.test", home_x_m: 0, home_y_m: 40, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r4_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R5", email: "r5@example.test", home_x_m: 0, home_y_m: 50, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r5_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "D1 Front", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "D2 Front", grid_x_m: 0, grid_y_m: 20, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r2_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r3_id}", label: "D3 Front", grid_x_m: 0, grid_y_m: 30, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r3_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r4_id}", label: "D4 Front", grid_x_m: 0, grid_y_m: 40, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r4_id}"
              captures: { d4_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r5_id}", label: "D5 Front", grid_x_m: 0, grid_y_m: 50, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r5_id}"
              captures: { d5_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "400 Block" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { area_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas/${area_id}/lock"
              payload: {}
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { area_v: "$.data.version" }
            - call: "POST /neighborhood-safety/video-requests"
              payload: { request_area_id: "${area_id}", case_number: "CASE-9001", expected_request_area_version: "${area_v}" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { vr_id: "$.data.id" }
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/justification"
              payload: { justification_text: "Repeated vehicle break-ins reported overnight on the 400 block; footage sought to identify a suspect vehicle described by three separate complainants.", statutory_basis: "Municipal Code 12.44" }
              as: Officer
              as_user_id: "${off_req_id}"
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/submit"
              payload: {}
              as: Officer
              as_user_id: "${off_req_id}"
            - call: "GET /neighborhood-safety/consent-solicitations"
              payload: { video_request_id: "${vr_id}", limit: 10, offset: 0 }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { sol1_id: "$.data[0].id", sol2_id: "$.data[1].id", sol3_id: "$.data[2].id" }
            - call: "POST /neighborhood-safety/consent-solicitations/${sol1_id}/share"
              payload: { recorded_start_utc: "2026-08-08T01:00:00Z", duration_seconds: 1800 }
              as: Resident
              as_user_id: "${r1_id}"
            - call: "POST /neighborhood-safety/consent-solicitations/${sol2_id}/share"
              payload: { recorded_start_utc: "2026-08-08T02:00:00Z", duration_seconds: 1200 }
              as: Resident
              as_user_id: "${r2_id}"
            - call: "POST /neighborhood-safety/consent-solicitations/${sol3_id}/decline"
              payload: { decline_reason: "OWNER_DECLINE" }
              as: Resident
              as_user_id: "${r3_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T01:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/retention-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /neighborhood-safety/agencies/${ag_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_v: "$.data.version" }
          trigger:
            - call: "POST /neighborhood-safety/transparency-reports"
              payload: { agency_id: "${ag_id}", period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", expected_agency_version: "${ag_v}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { rep_id: "$.data.id", rep_prov: "$.data.provisional_share_rate_bps", rep_cert: "$.data.certified_share_rate_bps", rep_pub_before: "$.data.published_share_rate_bps" }
            - call: "POST /neighborhood-safety/transparency-reports/${rep_id}/certify"
              payload: { certification_note: "Quarterly filing certified." }
              as: PlatformAdmin
              as_user_id: "admin-2"
              captures: { rep_pub_after: "$.data.published_share_rate_bps" }
          assert:
            - "VideoRequest.${vr_id}.solicitation_count == 5"
            - "VideoRequest.${vr_id}.shared_count == 2"
            - "VideoRequest.${vr_id}.declined_count == 1"
            - "VideoRequest.${vr_id}.expired_count == 2"
            - "VideoRequest.${vr_id}.pending_count == 0"
            - "VideoRequest.${vr_id}.lifecycle_state == FULFILLED"
            - "VideoRequest.${vr_id}.provisional_share_rate_bps == 4000"
            - "ConsentSolicitation.${sol2_id}.notification_suppressed == true"
            - "ConsentSolicitation.${sol2_id}.suppression_reason == MUTED"
            - "ConsentSolicitation.${sol1_id}.notification_suppressed == false"
            - "TransparencyReport.${rep_id}.requests_submitted_count == 1"
            - "TransparencyReport.${rep_id}.solicitations_dispatched_count == 5"
            - "TransparencyReport.${rep_id}.suppressed_dispatch_count == 1"
            - "TransparencyReport.${rep_id}.shared_count == 2"
            - "TransparencyReport.${rep_id}.declined_count == 1"
            - "TransparencyReport.${rep_id}.expired_count == 2"
            - "TransparencyReport.${rep_id}.pending_count == 0"
            - "${rep_prov} == 4000"
            - "${rep_cert} == 2500"
            - "${rep_prov} != ${rep_cert}"
            - "${rep_pub_before} == 4000"
            - "${rep_pub_after} == 2500"
            - "TransparencyReport.${rep_id}.variant == CERTIFIED"
            - "TransparencyReport.${rep_id}.certified_by_user_id == \"admin-2\""

      - name: clip_retention_device_anchored_vs_case_anchored_diverge_on_escalation
        grounds:
          - calculations.clip_retention_expiry
          - entities.SharedClip.fields.retention_variant
          - entities.SharedClip.fields.retention_expires_at
          - state_machines.VideoRequest.compliance_state.AUDIT_FLAGGED_to_AUDIT_ESCALATED
          - state_machines.SharedClip.status.RETAINED_to_PURGED
          - endpoints[POST /neighborhood-safety/retention-sweeps]
        distinguishing_aspect: |
          Dual variant #2 lives in the retention/deletion domain, not the reporting domain: two
          clips with byte-identical recorded_start_utc and duration_seconds, shared at the same
          logical instant off the same VideoRequest, land on different retention instants
          (2026-09-07T01:00:00Z vs 2026-09-29T00:00:00Z) purely because the parent's
          compliance_state changed between them — DEVICE_ANCHORED takes the MIN of the three
          candidate instants while CASE_ANCHORED takes the MAX, so the two variants read the
          same candidate set in opposite directions and one clip survives the sweep that
          destroys the other.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; agency Riverbend ONBOARDED with post_share_retention_days 30 and min_device_threshold 3; a REQUESTER officer and a separate AUDITOR officer."
            - "Five residents each owning one ACTIVE device with retention_window_days 30 at (0,10)..(0,50)."
            - "RequestArea (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z, LOCKED with eligible_device_count 5."
            - "VideoRequest justified (compliance_state JUSTIFICATION_LOGGED), then SUBMITTED — submit raises compliance_state to AUDIT_FLAGGED because 5 > AUDIT_DEVICE_TRIGGER 4 — so five solicitations exist with respond_deadline_utc 2026-08-15T00:00:00Z."
            - "R1 shares first while compliance_state is AUDIT_FLAGGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/agencies"
              payload: { name: "Riverbend Police Department", jurisdiction_code: "RB-001", min_device_threshold: 3, max_open_requests: 3, period_request_quota: 20, post_share_retention_days: 30, justification_min_chars: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_id: "$.data.id" }
            - call: "POST /neighborhood-safety/agencies/${ag_id}/onboarding-review"
              payload: { decision: "APPROVE", reviewer_note: "Signed MOU on file.", onboarding_agreement_version: "MOU-2026.3" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-100", full_name: "Officer Vale", duty_role: "REQUESTER" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_req_id: "$.data.id" }
            - call: "POST /neighborhood-safety/officers"
              payload: { agency_id: "${ag_id}", badge_number: "B-200", full_name: "Officer Ruiz", duty_role: "AUDITOR" }
              as: AgencyAdmin
              as_user_id: "${ag_id}"
              captures: { off_aud_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R1", email: "r1@example.test", home_x_m: 0, home_y_m: 10, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R2", email: "r2@example.test", home_x_m: 0, home_y_m: 20, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R3", email: "r3@example.test", home_x_m: 0, home_y_m: 30, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R4", email: "r4@example.test", home_x_m: 0, home_y_m: 40, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r4_id: "$.data.id" }
            - call: "POST /neighborhood-safety/residents"
              payload: { display_name: "R5", email: "r5@example.test", home_x_m: 0, home_y_m: 50, alert_radius_m: 0, notification_budget_per_day: 6 }
              as: Anonymous
              captures: { r5_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r1_id}", label: "D1 Front", grid_x_m: 0, grid_y_m: 10, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r2_id}", label: "D2 Front", grid_x_m: 0, grid_y_m: 20, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r2_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r3_id}", label: "D3 Front", grid_x_m: 0, grid_y_m: 30, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r3_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r4_id}", label: "D4 Front", grid_x_m: 0, grid_y_m: 40, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r4_id}"
              captures: { d4_id: "$.data.id" }
            - call: "POST /neighborhood-safety/devices"
              payload: { owner_resident_id: "${r5_id}", label: "D5 Front", grid_x_m: 0, grid_y_m: 50, retention_window_days: 30 }
              as: Resident
              as_user_id: "${r5_id}"
              captures: { d5_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas"
              payload: { agency_id: "${ag_id}", center_x_m: 0, center_y_m: 0, radius_m: 500, window_start_utc: "2026-08-08T00:00:00Z", window_end_utc: "2026-08-08T06:00:00Z", area_label: "400 Block" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { area_id: "$.data.id" }
            - call: "POST /neighborhood-safety/request-areas/${area_id}/lock"
              payload: {}
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { area_v: "$.data.version" }
            - call: "POST /neighborhood-safety/video-requests"
              payload: { request_area_id: "${area_id}", case_number: "CASE-9002", expected_request_area_version: "${area_v}" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { vr_id: "$.data.id" }
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/justification"
              payload: { justification_text: "Repeated vehicle break-ins reported overnight on the 400 block; footage sought to identify a suspect vehicle described by three separate complainants.", statutory_basis: "Municipal Code 12.44" }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { cs_after_justify: "$.data.compliance_state" }   # JUSTIFICATION_LOGGED at this point; the audit flag is raised by submit
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/submit"
              payload: {}
              as: Officer
              as_user_id: "${off_req_id}"
            - call: "GET /neighborhood-safety/consent-solicitations"
              payload: { video_request_id: "${vr_id}", limit: 10, offset: 0 }
              as: Officer
              as_user_id: "${off_req_id}"
              captures: { sol1_id: "$.data[0].id", sol2_id: "$.data[1].id" }
            - call: "POST /neighborhood-safety/consent-solicitations/${sol1_id}/share"
              payload: { recorded_start_utc: "2026-08-08T01:00:00Z", duration_seconds: 1800 }
              as: Resident
              as_user_id: "${r1_id}"
              captures: { clip_a_id: "$.data.id", clip_a_variant: "$.data.retention_variant", clip_a_expiry: "$.data.retention_expires_at" }
          trigger:
            - call: "POST /neighborhood-safety/video-requests/${vr_id}/audit-review"
              payload: { decision: "ESCALATE", audit_note: "Radius and device count warrant supervisory hold." }
              as: Officer
              as_user_id: "${off_aud_id}"
            - call: "POST /neighborhood-safety/consent-solicitations/${sol2_id}/share"
              payload: { recorded_start_utc: "2026-08-08T01:00:00Z", duration_seconds: 1800 }
              as: Resident
              as_user_id: "${r2_id}"
              captures: { clip_b_id: "$.data.id", clip_b_variant: "$.data.retention_variant", clip_b_expiry: "$.data.retention_expires_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /neighborhood-safety/retention-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { sweep_expired: "$.data.solicitations_expired_count", sweep_purged: "$.data.clips_purged_count", sweep_held: "$.data.clips_held_count", sweep_closed: "$.data.requests_auto_closed_count" }
          assert:
            - "${cs_after_justify} == JUSTIFICATION_LOGGED"
            - "VideoRequest.${vr_id}.compliance_state == AUDIT_ESCALATED"
            - "${clip_a_variant} == DEVICE_ANCHORED"
            - "${clip_a_expiry} == \"2026-09-07T01:00:00Z\""
            - "${clip_b_variant} == CASE_ANCHORED"
            - "${clip_b_expiry} == \"2026-09-29T00:00:00Z\""
            - "${clip_a_expiry} != ${clip_b_expiry}"
            - "${sweep_expired} == 3"
            - "${sweep_purged} == 1"
            - "${sweep_held} == 1"
            - "${sweep_closed} == 1"
            - "SharedClip.${clip_a_id}.status == PURGED"
            - "SharedClip.${clip_a_id}.purge_reason == RETENTION_EXPIRED"
            - "SharedClip.${clip_b_id}.status == LEGAL_HOLD"
            - "ConsentSolicitation.${sol1_id}.status == SHARED"
            - "ConsentSolicitation.${sol2_id}.status == SHARED"
            - "VideoRequest.${vr_id}.lifecycle_state == FULFILLED"
            - "Resident.${r1_id}.lifetime_shared_footage_seconds == 1800"
            - "Resident.${r1_id}.retained_footage_seconds == 0"
            - "Resident.${r1_id}.purged_footage_seconds == 1800"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: effective_min_devices_nested_bumps_cap_and_global_floor
        grounds:
          - calculations.effective_min_device_threshold
          - entities.RequestArea.fields.effective_min_devices
          - entities.Agency.fields.min_device_threshold
          - state_machines.RequestArea.status.DRAFT_to_LOCKED
          - endpoints[POST /neighborhood-safety/request-areas/{id}/lock]
        distinguishing_aspect: |
          Mode (a) — three independent inputs (the agency's configured base, the geographic
          radius step, and the ceiling-division window-block step) feed one formula whose
          shape is max(GLOBAL_MIN_DEVICE_FLOOR, base + radius_bump + window_bump) with the
          window step itself capped by min(WINDOW_BUMP_CAP, ...). Four areas pin all four
          interaction corners in one instance: neither step engaged (3), both steps engaged
          (7), the window step saturating its cap while the radius step is maximal (11), and
          the outer floor overriding a sub-floor base (agency base 1 -> 3).
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z."
            - "Agency ALPHA ONBOARDED with min_device_threshold 3; officer OA with duty_role REQUESTER."
            - "Agency BETA ONBOARDED with min_device_threshold 1 (below GLOBAL_MIN_DEVICE_FLOOR); officer OB with duty_role REQUESTER."
            - "No devices exist at all, so eligible_device_count is 0 everywhere — locking does not gate on the threshold, only recording it."
            - "ALPHA's three areas are mutually more than AREA_PROXIMITY_M apart, and BETA's area belongs to a different agency, so no canvass-overlap rule is engaged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
