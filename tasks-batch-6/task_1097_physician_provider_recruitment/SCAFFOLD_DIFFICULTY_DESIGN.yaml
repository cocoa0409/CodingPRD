            - "response.data.error_id == ERR_INTERVIEWER_DOUBLE_BOOKED"

      - name: candidate_travel_buffer_closed
        grounds:
          - calculations.site_visit_overlap_rules
          - validations[priority=10]
          - errors[ERR_CANDIDATE_TRAVEL_CONFLICT]
        distinguishing_aspect: |
          Candidate resource, buffered closed semantics (different interval arithmetic and different resource
          than the interviewer rule): two non-overlapping visits for the SAME candidate with DIFFERENT interviewers
          at 15:00-16:00 and 16:30-17:30 sit only 30 minutes apart, less than CANDIDATE_TRAVEL_BUFFER_MINUTES=120,
          so the second is rejected with ERR_CANDIDATE_TRAVEL_CONFLICT even though no interviewer is double-booked.
        test_recipe:
          setup:
            - "One application (one candidate); two ACTIVE interviewers rec and intv2; candidate has a SCHEDULED visit 15:00-16:00 with rec."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Ivy Two", email: "intv2@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { intv2_id: "$.data.id" } }
            - { call: "POST /clients", payload: { name: "West Health", region: "West", account_manager_id: "${am_id}", contingency_pct: 0.20, min_fee_cents: 2000000, guarantee_days: 90 }, as: AccountManager, as_user_id: "${am_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /job-openings", payload: { client_id: "${client_id}", specialty: "CARDIOLOGY", region: "West", region_state: "CA", comp_min_cents: 20000000, comp_max_cents: 30000000 }, as: AccountManager, as_user_id: "${am_id}", captures: { opening_id: "$.data.id" } }
            - { call: "POST /job-openings/${opening_id}/transition", payload: { action: "PUBLISH" }, as: AccountManager, as_user_id: "${am_id}" }
            - { call: "POST /candidates", payload: { recruiter_id: "${rec_id}", full_name: "Dr Vale", specialty: "CARDIOLOGY", home_region: "West", license_states: ["CA"], desired_comp_cents: 26000000 }, as: Recruiter, as_user_id: "${rec_id}", captures: { cand_id: "$.data.id" } }
            - { call: "POST /applications", payload: { candidate_id: "${cand_id}", opening_id: "${opening_id}" }, as: Recruiter, as_user_id: "${rec_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${rec_id}", scheduled_start: "2026-05-03T15:00:00Z", scheduled_end: "2026-05-03T16:00:00Z", location: "HQ" }, as: Recruiter, as_user_id: "${rec_id}", captures: { sv1: "$.data.id" } }
          trigger:
            - { call: "POST /site-visits", payload: { application_id: "${app_id}", interviewer_user_id: "${intv2_id}", scheduled_start: "2026-05-03T16:30:00Z", scheduled_end: "2026-05-03T17:30:00Z", location: "Clinic" }, as: Recruiter, as_user_id: "${rec_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CANDIDATE_TRAVEL_CONFLICT"

  - rule_id: compensating_invariant
    instances:
      - name: net_client_fee_ledger_invoice_then_refund
        grounds:
          - calculations.client_net_placement_fee
          - state_machines.GuaranteeClaim.APPROVED_to_RESOLVED_REFUND
          - entities.Client.fields.net_placement_fee_cents
        distinguishing_aspect: |
          Conserved quantity = money (client net-fee ledger). Forward INVOICE recognizes 6,000,000; the
          compensating RESOLVE_REFUND credits 4,000,000. Client.net_placement_fee_cents == recognized(6,000,000)
          - credited(4,000,000) == 2,000,000 with no drift (the CREDITED placement stays in `recognized`).
        test_recipe:
          setup:
            - "Placement ONBOARDed and INVOICEd (final comp 25,000,000 -> fee 6,000,000; client net 6,000,000)."
            - "Provider falls out 2026-07-01; claim APPROVED then RESOLVED_REFUND (credit 4,000,000)."
          setup_api_calls:
            - { call: "POST /staff-users", payload: { role: "ACCOUNT_MANAGER", full_name: "Amy AM", email: "am@x.com" }, as: PlatformAdmin, captures: { am_id: "$.data.id" } }
            - { call: "POST /staff-users", payload: { role: "RECRUITER", full_name: "Rio Rec", email: "rec@x.com", covered_specialties: ["CARDIOLOGY"] }, as: PlatformAdmin, captures: { rec_id: "$.data.id" } }
