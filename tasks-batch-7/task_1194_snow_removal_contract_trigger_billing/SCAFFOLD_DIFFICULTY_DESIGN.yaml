            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-11T00:00:00Z", window_end: "2026-12-11T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eEq: $.data.id } }
            - { call: "POST /visits", payload: { storm_event_id: "${eEq}", contract_site_id: "${csD}", scheduled_start: "2026-12-11T09:00:00Z", scheduled_end: "2026-12-11T10:00:00Z" }, as: OpsDispatcher, captures: { vEq: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T09:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vEq}/start", as: CrewLead }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /visits/${vEq}/complete", as: CrewLead }
            - { call: "POST /observations", payload: { storm_event_id: "${eEq}", source_name: "NOAA", observed_at: "2026-12-11T07:00:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
