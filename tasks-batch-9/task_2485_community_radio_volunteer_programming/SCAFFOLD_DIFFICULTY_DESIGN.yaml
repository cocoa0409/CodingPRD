  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_windows_are_half_open_with_a_two_minute_station_id_buffer
        grounds:
          - validations[priority=66 v_slot_window_conflict]
          - entities.SlotAssignment.fields.start_minute
          - entities.SlotAssignment.fields.duration_minutes
          - errors[ERR_SLOT_CONFLICT]
          - endpoints[POST /schedule-grids/{gridId}/slot-assignments]
        distinguishing_aspect: |
          The contended resource is a ScheduleGrid weekday minute line and the interval semantics are HALF-OPEN integer minute-of-day windows widened by a 2-minute station-identification buffer on each side, so a neighbour starting at minute 601 after a window ending at 600 conflicts while minute 602 - the first legal instant - does not; the other resource_temporal_overlap instance contends phone lines on a MembershipDrive using absolute datetimes under two DIFFERENT semantics at once, closed per volunteer and half-open per line.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "Certified host, three seated committee members and one approved MUSIC program."
            - "An IN_REVIEW 2026-FALL grid already carries that program on Monday from minute 540 for 60 minutes, so its half-open window is [540, 600)."
            - "The grid is never published, so the mutability rule at priority 50 cannot mask the window rule at 66, and conflict_policy is left at its default so no preemption path applies."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Delta Sessions", format_code: "MUSIC", language_code: "EN", requested_daypart: "MIDDAY", requested_duration_minutes: 60 }, as: Volunteer, as_user_id: "${host_id}", captures: { proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${proposal_id}", as: ProgramDirector, captures: { program_id: "$.data[0].id" } }
            - { call: "POST /schedule-grids", payload: { season_code: "2026-FALL", effective_from: "2026-09-07T00:00:00Z", effective_to: "2026-12-27T23:59:00Z" }, as: ProgramDirector, captures: { grid_id: "$.data.id", grid_v1: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v1}", program_id: "${program_id}", day_of_week: 1, start_minute: 540, duration_minutes: 60 }, as: ProgramDirector, captures: { incumbent_slot_id: "$.data.id" } }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v2: "$.data.version" } }
          trigger:
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v2}", program_id: "${program_id}", day_of_week: 1, start_minute: 601, duration_minutes: 60 }, as: ProgramDirector, captures: { conflict_error: "$.data.error_id" } }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v3: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v3}", program_id: "${program_id}", day_of_week: 1, start_minute: 602, duration_minutes: 60 }, as: ProgramDirector, captures: { neighbour_slot_id: "$.data.id" } }
            - { call: "GET /schedule-grids/${grid_id}", as: ProgramDirector, captures: { grid_v4: "$.data.version" } }
            - { call: "POST /schedule-grids/${grid_id}/slot-assignments", payload: { expected_grid_version: "${grid_v4}", program_id: "${program_id}", day_of_week: 2, start_minute: 601, duration_minutes: 60 }, as: ProgramDirector, captures: { other_day_slot_id: "$.data.id" } }
          assert:
            - "The minute-601 request returns 409 with data.error_id == ERR_SLOT_CONFLICT: 601 < 600 + 2, so the buffer is breached even though the raw half-open windows [540,600) and [601,661) do not overlap"
            - "After that rejection GET /schedule-grids/${grid_id} shows version == ${grid_v2} and total_assigned_minutes == 60"
            - "The minute-602 request returns 201 with SlotAssignment.status == TENTATIVE, start_minute == 602 and duration_minutes == 60: 602 is exactly existing_end + 2, the first legal start"
            - "GET /schedule-grids/${grid_id} then shows total_assigned_minutes == 120"
            - "The same minute-601 window on day_of_week 2 returns 201, proving the contended resource is a single weekday line and not the week"
            - "GET /slot-assignments?grid_id=${grid_id}&day_of_week=1 returns total_count == 2 and GET /slot-assignments?grid_id=${grid_id}&day_of_week=2 returns total_count == 1"
            - "GET /schedule-grids/${grid_id} finally shows total_assigned_minutes == 180 and public_affairs_minutes_pct == 0.00"

      - name: phone_bank_shifts_close_per_volunteer_but_stay_half_open_per_line
        grounds:
          - validations[priority=67 v_volunteer_shift_conflict]
          - validations[priority=70 v_phone_line_capacity]
          - entities.MembershipDrive.fields.phone_line_count
          - errors[ERR_SHIFT_CONFLICT]
          - errors[ERR_PHONE_LINE_CAPACITY]
          - endpoints[POST /phone-bank-shifts]
        distinguishing_aspect: |
          Two contended resources with OPPOSITE interval semantics meet on one request: the volunteer's own roster uses CLOSED datetime intervals so a back-to-back shift that merely touches at 12:00 is refused, while the drive's phone lines use HALF-OPEN windows so the byte-identical 12:00-14:00 window is accepted for a different volunteer; the other resource_temporal_overlap instance contends a ScheduleGrid weekday minute line under a single half-open semantics widened by a fixed 2-minute buffer.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "An ACTIVE membership drive runs 2026-08-01T00:00:00Z to 2026-08-14T23:59:00Z with phone_line_count 1, so a single overlapping instant exhausts capacity."
            - "Three volunteers are enrolled and none is suspended or resigned, so the eligibility rule at priority 63 never fires."
            - "Volunteer Gus already holds a SCHEDULED shift from 2026-08-03T10:00:00Z to 2026-08-03T12:00:00Z."
            - "Every requested window sits inside the drive window, so the drive-window rule at priority 65 never fires."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: DevelopmentCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Gus Halvorsen", email: "gus@krcr.example", role_track: "DEVELOPMENT", seniority_start_date: "2025-01-01" }, as: TrainingCoordinator, captures: { gus_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Hana Ito", email: "hana@krcr.example", role_track: "DEVELOPMENT", seniority_start_date: "2025-01-01" }, as: TrainingCoordinator, captures: { hana_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Iris Mbeki", email: "iris@krcr.example", role_track: "DEVELOPMENT", seniority_start_date: "2025-01-01" }, as: TrainingCoordinator, captures: { iris_id: "$.data.id" } }
            - { call: "POST /membership-drives", payload: { name: "Fall Drive", goal_cents: 5000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-14T23:59:00Z", phone_line_count: 1 }, as: DevelopmentCoordinator, captures: { drive_id: "$.data.id" } }
            - { call: "POST /membership-drives/${drive_id}/activate", as: DevelopmentCoordinator }
            - { call: "POST /phone-bank-shifts", payload: { drive_id: "${drive_id}", volunteer_id: "${gus_id}", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T12:00:00Z" }, as: DevelopmentCoordinator, captures: { gus_shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /phone-bank-shifts", payload: { drive_id: "${drive_id}", volunteer_id: "${gus_id}", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T14:00:00Z" }, as: DevelopmentCoordinator, captures: { touching_error: "$.data.error_id" } }
            - { call: "POST /phone-bank-shifts", payload: { drive_id: "${drive_id}", volunteer_id: "${hana_id}", start_at: "2026-08-03T12:00:00Z", end_at: "2026-08-03T14:00:00Z" }, as: DevelopmentCoordinator, captures: { hana_shift_id: "$.data.id" } }
            - { call: "POST /phone-bank-shifts", payload: { drive_id: "${drive_id}", volunteer_id: "${iris_id}", start_at: "2026-08-03T11:00:00Z", end_at: "2026-08-03T13:00:00Z" }, as: DevelopmentCoordinator, captures: { capacity_error: "$.data.error_id" } }
          assert:
            - "Gus's 12:00-14:00 request returns 409 with data.error_id == ERR_SHIFT_CONFLICT, because his closed interval [12:00, 14:00] touches his existing [10:00, 12:00] at 12:00"
            - "Hana's byte-identical 12:00-14:00 window returns 201 with PhoneBankShift.status == SCHEDULED, because the single phone line is free on the half-open window [12:00, 14:00)"
            - "Iris's 11:00-13:00 request returns 409 with data.error_id == ERR_PHONE_LINE_CAPACITY, not ERR_SHIFT_CONFLICT: she holds no other shift, but the one line is already covered at 11:30"
            - "GET /phone-bank-shifts?drive_id=${drive_id} returns total_count == 2"
            - "GET /phone-bank-shifts?volunteer_id=${gus_id} returns total_count == 1 and GET /phone-bank-shifts?volunteer_id=${iris_id} returns total_count == 0"
            - "GET /membership-drives/${drive_id} shows phone_line_count == 1 and status == ACTIVE"

  - rule_id: compensating_invariant
    instances:
      - name: premium_units_conserved_across_ship_and_refund
        grounds:
          - calculations.pledge_premium_allocation
          - state_machines.Pledge.RESERVED_to_SHIPPED
          - state_machines.Pledge.SHIPPED_to_RETURNED
          - entities.PremiumItem.fields.on_hand_qty
          - entities.PremiumItem.fields.shipped_qty
          - endpoints[POST /pledges/{pledgeId}/refund]
        distinguishing_aspect: |
          The conserved quantity is the PremiumItem unit count, on_hand_qty + shipped_qty == units_received_qty, and the compensating action is the refund that reverses a ship, restoring the physical unit to the fulfilment room while the money dimension moves irreversibly to REFUNDED; the other compensating_invariant instance conserves a ScheduleGrid airtime-minute total across a compliance preemption and its reinstatement.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "One premium MUG-01 with tier_threshold_cents 10000, fair_market_value_cents 1500 and units_received_qty 2, so on_hand_qty starts at 2 and shipped_qty at 0."
            - "One ACTIVE membership drive with four phone lines."
            - "A 12000-cent pledge wanting a premium reserves MUG-01 at creation."
            - "The invariant on_hand_qty + shipped_qty == units_received_qty == 2 is checked after every step."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: DevelopmentCoordinator }
            - { call: "POST /premium-items", payload: { sku: "MUG-01", name: "Station Mug", tier_threshold_cents: 10000, fair_market_value_cents: 1500, units_received_qty: 2 }, as: DevelopmentCoordinator, captures: { mug_id: "$.data.id", opening_on_hand: "$.data.on_hand_qty" } }
            - { call: "POST /membership-drives", payload: { name: "Fall Drive", goal_cents: 5000000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-14T23:59:00Z", phone_line_count: 4 }, as: DevelopmentCoordinator, captures: { drive_id: "$.data.id" } }
            - { call: "POST /membership-drives/${drive_id}/activate", as: DevelopmentCoordinator }
            - { call: "POST /pledges", payload: { drive_id: "${drive_id}", donor_name: "Marisol Vega", amount_cents: 12000, wants_premium: true }, as: DevelopmentCoordinator, captures: { pledge_id: "$.data.id" } }
          trigger:
            - { call: "POST /pledges/${pledge_id}/payment", payload: { outcome: "PAID" }, as: DevelopmentCoordinator }
            - { call: "POST /pledges/${pledge_id}/premium-fulfillment", payload: { action: "SHIP" }, as: DevelopmentCoordinator, captures: { shipped_state: "$.data.premium_status" } }
            - { call: "GET /premium-items/${mug_id}", as: DevelopmentCoordinator, captures: { mid_on_hand: "$.data.on_hand_qty", mid_shipped: "$.data.shipped_qty" } }
            - { call: "POST /pledges/${pledge_id}/refund", as: DevelopmentCoordinator, captures: { final_premium_state: "$.data.premium_status" } }
          assert:
            - "At creation GET /premium-items/${mug_id} shows units_received_qty == 2, on_hand_qty == 2, reserved_qty == 1, shipped_qty == 0 and status == AVAILABLE, so 2 + 0 == 2"
            - "The payment returns 200 with Pledge.payment_status == PAID and Pledge.premium_status still RESERVED"
            - "The SHIP returns 200 with Pledge.premium_status == SHIPPED"
            - "After the ship GET /premium-items/${mug_id} shows on_hand_qty == 1, reserved_qty == 0, shipped_qty == 1 and status == AVAILABLE, so 1 + 1 == 2"
            - "The refund returns 200 with Pledge.payment_status == REFUNDED and Pledge.premium_status == RETURNED"
            - "After the refund GET /premium-items/${mug_id} shows on_hand_qty == 2, reserved_qty == 0, shipped_qty == 1 - 1 == 0 and status == AVAILABLE, so 2 + 0 == 2 exactly as at creation"
            - "GET /premium-items/${mug_id} shows units_received_qty == 2 throughout: the compensating action never touches the received total"
            - "GET /pledges/${pledge_id} shows tax_deductible_cents == 10500 and premium_item_id == ${mug_id}, both retained on the refunded record"
            - "GET /membership-drives/${drive_id} shows refunded_total_cents == 12000 and fulfilled_total_cents == 0"

      - name: grid_airtime_minutes_restored_by_preempt_then_reinstate
        grounds:
          - calculations.grid_public_affairs_share
          - state_machines.SlotAssignment.CONFIRMED_to_PREEMPTED
          - state_machines.SlotAssignment.PREEMPTED_to_CONFIRMED
          - entities.ScheduleGrid.fields.total_assigned_minutes
          - entities.ScheduleGrid.fields.public_affairs_minutes_pct
          - endpoints[POST /slot-assignments/{assignmentId}/reinstate]
        distinguishing_aspect: |
          The conserved quantity is the ScheduleGrid airtime aggregate pair total_assigned_minutes and public_affairs_minutes_pct, and the compensating action is reinstate undoing a compliance-driven preemption so both aggregates return to 150 and 20.00 while the grid's version counter monotonically advances; the other compensating_invariant instance conserves PremiumItem physical units across a refund that reverses a shipment.
