  - rule_id: compensating_invariant
    instances:
      - name: openings_conserved_through_fill_and_guarantee_termination
        grounds:
          - calculations.openings_conservation_rule
          - state_machines.Requisition.OPEN_to_FILLED
          - state_machines.Requisition.FILLED_to_OPEN
          - state_machines.Placement.GUARANTEE_ACTIVE_to_TERMINATED_IN_GUARANTEE
        distinguishing_aspect: |
          Conserved quantity: seat pool. The forward action (offer accept)
          moves one seat from open to filled (openings_filled 0->1, status
          OPEN->FILLED); the compensating action (terminate in guarantee)
          returns the seat (openings_filled 1->0, status FILLED->OPEN); the
          invariant count(placements in PENDING_START|GUARANTEE_ACTIVE|
          COMPLETED) == openings_filled holds after BOTH actions with zero
          drift.
