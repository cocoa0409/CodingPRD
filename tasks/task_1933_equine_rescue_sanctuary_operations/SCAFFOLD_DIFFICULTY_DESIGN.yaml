  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_gated_by_horse_adoptable
        grounds:
          - state_machines.AdoptionApplication.HOME_CHECK_PASSED_to_APPROVED
          - state_machines.Horse.ADOPTABLE_to_QUARANTINE
        distinguishing_aspect: |
          Pair AdoptionApplication -> Horse: an application in HOME_CHECK_PASSED
          cannot be approved once its horse leaves ADOPTABLE (here via a
          quarantine re-entry) — ERR_HORSE_NOT_ADOPTABLE; after the horse is
          released back to ADOPTABLE the same approve succeeds.
