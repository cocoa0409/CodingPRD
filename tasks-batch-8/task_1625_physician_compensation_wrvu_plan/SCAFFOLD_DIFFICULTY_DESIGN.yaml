            - "GET /comp/physician-agreements/${agr_sup} -> ytd_wrvu_credited == 1.94 (hop 3: 4.85 reversed, then round_half_up(3.88*0.5,2)=1.94 re-allocated from the replacement)"
            - "GET /comp/production-captures/${cap}/corrections -> exactly 1 replacement with units == 4 and credited_wrvu == 3.88"
            - "GET /comp/physician-agreements/${agr_app} -> ytd_wrvu_credited == 3.88"
            - "GET /comp/comp-statements/${stmt_app} -> period_wrvu == 3.88 and productivity_earned_ytd_cents == 17460 (DRAFT statement recomputed; 3.88*4500)"
            - "GET /comp/comp-statements/${stmt_app} -> capture_ids contains the replacement capture id and not ${cap}"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_agreement_activation
        grounds:
          - validations[priority=8]
          - validations[priority=30]
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_FMV_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: one activation request violates both
          (plan only FMV_APPROVED, and base_salary 95000000 alone exceeds fmv_cap 90000000);
          priority 8 (state) must surface ERR_PLAN_NOT_ACTIVE, not ERR_FMV_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Plan in FMV_APPROVED (reviewed, never activated); physician PH; agreement with base_salary_cents 95000000 (creation allowed against FMV_APPROVED plan), FMV review APPROVED"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000050", full_name: "Dr Pricy", specialty: "cards", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2010-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Cap Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 95000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 90 }, as: ComplianceOfficer, as_user_id: co_1 }
          trigger:
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1, captures: { err: $.data.error_id } }
          assert:
            - "Response is 409 with error_id == \"ERR_PLAN_NOT_ACTIVE\" (state priority 8 beats fiscal priority 30)"
            - "error_id != \"ERR_FMV_CAP_EXCEEDED\" even though base_salary_cents 95000000 > fmv_cap_cents 90000000 also holds"
            - "GET /comp/physician-agreements/${agr} -> status still \"FMV_APPROVED\""

      - name: safety_beats_referential_on_capture_posting
        grounds:
          - validations[priority=12]
          - validations[priority=28]
          - errors[ERR_COMPLIANCE_HOLD]
          - errors[ERR_RATE_NOT_FOUND]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (different pair than the
          state-vs-fiscal instance): validating a capture whose CPT has no covering rate, on an
          agreement whose FMV review has gone stale (>12 months), must surface ERR_COMPLIANCE_HOLD
          (priority 12), not ERR_RATE_NOT_FOUND (priority 28).
        test_recipe:
          setup:
            - "ACTIVE plan, physician PH EFFECTIVE agreement with fmv_reviewed_at == 2026-01-01 (clock then at 2026-01-01)"
            - "Capture CAP posted with cpt_code \"00000\" (deliberately unpriced) while the agreement was healthy"
            - "Logical clock advanced to 2027-02-15T00:00:00Z => compliance_hold == true (fmv_reviewed_at + 12 months = 2027-01-01 < clock)"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000051", full_name: "Dr Stale", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2010-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Hold Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "00000", units: 1, service_date: "2026-06-15", posting_date: "2026-06-15" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2027-02-15T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { err: $.data.error_id } }
          assert:
            - "Response is 422 with error_id == \"ERR_COMPLIANCE_HOLD\" (business_safety priority 12 beats business_referential priority 28)"
            - "error_id != \"ERR_RATE_NOT_FOUND\" even though no rate row covers cpt_code \"00000\""
            - "GET /comp/physician-agreements/${agr} -> compliance_hold == true and status still \"EFFECTIVE\""
            - "GET /comp/production-captures/${cap} -> capture_status still \"POSTED\", credit_status still \"UNCREDITED\""

