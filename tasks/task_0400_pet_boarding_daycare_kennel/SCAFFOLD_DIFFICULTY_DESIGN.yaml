# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# pet-boarding-daycare-kennel — 9 rule_ids, >=2 instances each (>=18 total).
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.6. Every setup_api_calls
# chain drives empty-DB -> the setup state using only §1.5 endpoints. All
# formula-derived asserts are precomputed literals.
#
# Vaccination note: a CAT requires RABIES + FVRCP to reach vaccination_status
# VALID; a DOG requires RABIES + DHPP + BORDETELLA. Chains use CAT to keep the
# vaccine setup to two POSTs.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_estimate_vs_final_after_policy_change
        grounds:
          - calculations.deposit_amount
          - entities.Reservation.fields.deposit_cents
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          deposit_amount is the COST domain on Reservation: the estimate variant is
          latched at creation under deposit_policy STANDARD (4320 for OVERNIGHT/MEDIUM/3n)
          and the final variant re-evaluates at confirm under the live policy STRICT (7200),
          so the same reservation carries two different deposit values across its lifecycle.
        test_recipe:
          setup:
            - "Facility deposit_policy=STANDARD, current_date 2026-01-01"
            - "Owner with a MEDIUM cat (weight 6kg is SMALL; use 18kg => MEDIUM), vaccinations VALID, temperament CLEARED"
            - "OVERNIGHT reservation 2026-02-01..2026-02-04 (3 nights), deposit estimate latched at 4320"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel A", deposit_policy: "STANDARD" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O One", email: "o1@x.com", phone: "555-0001" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Mimi", species: "CAT", weight_kg: 18, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-02-01", end_date: "2026-02-04" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version, est: $.data.deposit_cents }
          trigger:
            - call: "GET /reservations/${res}"
              payload: {}
              as: FacilityManager
              captures: { est_now: $.data.deposit_cents }
          assert:
            - "Reservation.${res}.deposit_cents == 4320 (estimate variant under STANDARD policy)"

      - name: refund_provisional_vs_final_same_lead_tier
        grounds:
          - calculations.cancellation_refund
          - entities.Reservation.fields.refund_cents
          - state_machines.Reservation.REQUESTED_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          cancellation_refund is the REFUND domain on Reservation: provisional (cancel from
          REQUESTED with deposit unpaid, deposit_paid_cents=0) yields refund 0 even at >=7 days
          lead, whereas final (cancel from CONFIRMED with deposit fully paid 4320) at the same
          >=7 lead tier yields refund 4320 — divergent results from the same lead-time tier.
        test_recipe:
          setup:
            - "Two sibling OVERNIGHT MEDIUM reservations, both start 2026-02-01, current_date 2026-01-01 (lead 31 days)"
            - "Reservation A left REQUESTED with deposit unpaid; Reservation B confirmed with deposit 4320 paid"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel B", deposit_policy: "STANDARD" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Two", email: "o2@x.com", phone: "555-0002" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Coco", species: "CAT", weight_kg: 18, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Suite-1", kind: "OVERNIGHT_SUITE", size_class: "LARGE" }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-02-01", end_date: "2026-02-04" }
              as: FacilityManager
              captures: { resA: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-02-01", end_date: "2026-02-04" }
              as: FacilityManager
              captures: { resB: $.data.id, resB_v: $.data.version }
            - call: "POST /reservations/${resB}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${resB_v}" }
              as: FacilityManager
            - call: "POST /reservations/${resB}/pay_deposit"
              payload: { cash_cents: 4320 }
              as: FacilityManager
            - call: "POST /reservations/${resB}/confirm"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${resA}/cancel"
              payload: {}
              as: FacilityManager
              captures: { refundA: $.data.refund_cents }
            - call: "POST /reservations/${resB}/cancel"
              payload: {}
              as: FacilityManager
              captures: { refundB: $.data.refund_cents }
          assert:
            - "Reservation.${resA}.refund_cents == 0 (provisional: deposit_paid_cents was 0)"
            - "Reservation.${resB}.refund_cents == 4320 (final: full deposit at >=7 day lead)"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: deposit_three_input_nonlinear_mode_a
        grounds:
          - calculations.deposit_amount
          - entities.Reservation.fields.deposit_cents
          - entities.Pet.fields.size_class
        distinguishing_aspect: |
          MODE (a): deposit = round_half_up(base[service] * size_mult[size] * units * policy_factor)
          combines four inputs non-linearly; OVERNIGHT/LARGE/2n/STANDARD = 4000*1.5*2*0.30 = 3600,
          a value no single-factor lookup produces.
        test_recipe:
          setup:
            - "Facility STANDARD; LARGE cat (35kg); OVERNIGHT 2 nights 2026-03-01..2026-03-03"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel C", deposit_policy: "STANDARD" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Three", email: "o3@x.com", phone: "555-0003" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Rex", species: "CAT", weight_kg: 35, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
          trigger:
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-03-01", end_date: "2026-03-03" }
              as: FacilityManager
              captures: { res: $.data.id, dep: $.data.deposit_cents }
          assert:
            - "Reservation.${res}.deposit_cents == 3600"
            - "Pet.${pet}.size_class == LARGE"

      - name: reservation_total_pinned_order_mode_c
        grounds:
          - calculations.reservation_total
          - entities.Reservation.fields.total_cents
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          MODE (c): total has a circular-looking dependency (discount tier keyed on subtotal,
          discount feeds total) pinned to order subtotal -> tier -> discount -> total; OVERNIGHT/
          MEDIUM/3n (15000) + BATH MEDIUM (2500) = subtotal 17500, tier 0.05, discount 875, total 16625.
        test_recipe:
          setup:
            - "OVERNIGHT MEDIUM 3n reservation confirmed, checked in, one BATH add-on in window delivered at check-out"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel D", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Four", email: "o4@x.com", phone: "555-0004" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Lily", species: "CAT", weight_kg: 18, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Suite-D1", kind: "OVERNIGHT_SUITE", size_class: "LARGE" }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-01-05", end_date: "2026-01-08" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/addons"
              payload: { kind: "BATH", scheduled_date: "2026-01-06" }
              as: FacilityManager
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
            - call: "POST /facilities/${fac}/_clock/advance"
              payload: { to_date: "2026-01-05" }
              as: FacilityManager
            - call: "POST /reservations/${res}/check_in"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/check_out"
              payload: {}
              as: FacilityManager
              captures: { total: $.data.total_cents }
          assert:
            - "Reservation.${res}.total_cents == 16625 (subtotal 17500, discount 875)"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: package_cyclic_expired_to_active_renew
        grounds:
          - state_machines.Package.ACTIVE_to_EXPIRED
          - state_machines.Package.EXPIRED_to_ACTIVE
          - entities.Package.fields.status
        distinguishing_aspect: |
          Package is CYCLIC: ACTIVE -> EXPIRED (clock past 30-day cycle) -> ACTIVE (renew),
          so the row visits ACTIVE twice with credits_remaining reset to credits_total on the loop.
        test_recipe:
          setup:
            - "Owner with auto_renew DAYCARE_10 package, cycle_start 2026-01-01; clock advanced past 2026-01-31 to expire it"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel E" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Five", email: "o5@x.com", phone: "555-0005" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/packages"
              payload: { tier: "DAYCARE_10", cycle_start_date: "2026-01-01", auto_renew: true }
              as: FacilityManager
              captures: { pkg: $.data.id }
            - call: "POST /facilities/${fac}/_clock/advance"
              payload: { to_date: "2026-02-15" }
              as: FacilityManager
          trigger:
            - call: "POST /packages/${pkg}/renew"
              payload: {}
              as: FacilityManager
              captures: { st: $.data.status, cr: $.data.credits_remaining }
          assert:
            - "Package.${pkg}.status == ACTIVE (re-armed after EXPIRED)"
            - "Package.${pkg}.credits_remaining == 10 (reset to credits_total on the cyclic loop)"

      - name: pet_parallel_dimensions_independent
        grounds:
          - state_machines.Pet.temperament_clearance_UNREVIEWED_to_FLAGGED
          - entities.Pet.fields.vaccination_status
          - entities.Pet.fields.temperament_clearance
        distinguishing_aspect: |
          Pet carries PARALLEL dimensions: setting temperament_clearance=FLAGGED via review leaves
          vaccination_status=VALID unchanged, proving the two axes evolve independently on one row.
        test_recipe:
          setup:
            - "CAT with RABIES+FVRCP current => vaccination_status VALID, temperament_clearance UNREVIEWED"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel F" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Six", email: "o6@x.com", phone: "555-0006" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Nala", species: "CAT", weight_kg: 6, temperament: "REACTIVE" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
          trigger:
            - call: "POST /pets/${pet}/review"
              payload: { decision: "FLAG" }
              as: FacilityManager
              captures: { tc: $.data.temperament_clearance, vs: $.data.vaccination_status }
          assert:
            - "Pet.${pet}.temperament_clearance == FLAGGED"
            - "Pet.${pet}.vaccination_status == VALID (unchanged by the temperament axis)"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: confirm_cascade_reservation_assignment_run_depth3
        grounds:
          - state_machines.Reservation.REQUESTED_to_CONFIRMED
          - state_machines.RunAssignment.HELD_to_OCCUPIED
          - entities.RunAssignment.fields.status
        distinguishing_aspect: |
          DEPTH-3 from confirm: confirming the Reservation (A) flips its HELD RunAssignment to
          OCCUPIED (B), and that OCCUPIED assignment (B) marks the Run busy for the window in
          capacity accounting (C) — each hop caused by the prior, not by the original confirm.
        test_recipe:
          setup:
            - "Confirmable OVERNIGHT reservation with one HELD assignment on Suite-G1, deposit policy NONE"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel G", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Seven", email: "o7@x.com", phone: "555-0007" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Tom", species: "CAT", weight_kg: 6, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Suite-G1", kind: "OVERNIGHT_SUITE", size_class: "LARGE" }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-02-10", end_date: "2026-02-12" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
            - call: "GET /reservations/${res}/assignments"
              payload: {}
              as: FacilityManager
              captures: { asg0_status: "$.data[0].status" }
          assert:
            - "RunAssignment.${asg}.status == OCCUPIED (hop B)"
            - "A second OVERNIGHT assignment on run ${run} for the overlapping window is rejected ERR_RUN_OVERLAP (hop C: run marked busy)"

      - name: cancel_cascade_reservation_redemption_package_depth3
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.PackageRedemption.fields.reversed
          - entities.Package.fields.credits_remaining
        distinguishing_aspect: |
          DEPTH-3 from cancel (a DIFFERENT trigger than confirm): cancelling a package-funded
          Reservation (A) sets its PackageRedemption.reversed=true (B), and that reversal (B)
          recomputes Package.credits_remaining back up by 1 (C).
        test_recipe:
          setup:
            - "DAYCARE reservation funded by an ACTIVE DAYCARE_10 package, confirmed (credits_remaining 9), then cancelled"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel H", deposit_policy: "NONE" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Eight", email: "o8@x.com", phone: "555-0008" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Spot", species: "CAT", weight_kg: 6, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-06-01", expires_on: "2027-06-01" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /owners/${own}/packages"
              payload: { tier: "DAYCARE_10", cycle_start_date: "2026-01-01" }
              as: FacilityManager
              captures: { pkg: $.data.id }
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Pen-H1", kind: "DAYCARE_PEN", size_class: "LARGE", daycare_capacity: 5 }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "DAYCARE", start_date: "2026-01-10", end_date: "2026-01-10", package_id: "${pkg}" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: FacilityManager
            - call: "GET /packages/${pkg}"
              payload: {}
              as: FacilityManager
              captures: { cr: $.data.credits_remaining }
          assert:
            - "Package.${pkg}.credits_remaining == 10 (restored from 9 by the reversed redemption)"
            - "The PackageRedemption listed at GET /packages/${pkg}/redemptions has reversed == true"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: vaccination_safety_beats_deposit_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - errors[ERR_VACCINATION_REQUIRED]
        distinguishing_aspect: |
          Category pair business_safety (p9 ERR_VACCINATION_REQUIRED) vs business_fiscal
          (p16 ERR_DEPOSIT_UNPAID): a confirm that violates BOTH (expired vaccine AND unpaid
          deposit) must return the higher-priority ERR_VACCINATION_REQUIRED.
        test_recipe:
          setup:
            - "Reservation with a HELD assignment, deposit STANDARD unpaid (deposit_paid_cents=0) AND pet vaccination EXPIRED"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Kennel I", deposit_policy: "STANDARD" }
              as: FacilityManager
              captures: { fac: $.data.id }
            - call: "POST /facilities/${fac}/owners"
              payload: { full_name: "O Nine", email: "o9@x.com", phone: "555-0009" }
              as: FacilityManager
              captures: { own: $.data.id }
            - call: "POST /owners/${own}/pets"
              payload: { name: "Dot", species: "CAT", weight_kg: 6, temperament: "CALM" }
              as: FacilityManager
              captures: { pet: $.data.id }
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "RABIES", administered_on: "2025-01-01", expires_on: "2026-01-15" }
              as: FacilityManager
            - call: "POST /pets/${pet}/vaccinations"
              payload: { vaccine: "FVRCP", administered_on: "2025-01-01", expires_on: "2026-01-15" }
              as: FacilityManager
            - call: "POST /pets/${pet}/review"
              payload: { decision: "CLEAR" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/runs"
              payload: { label: "Suite-I1", kind: "OVERNIGHT_SUITE", size_class: "LARGE" }
              as: FacilityManager
              captures: { run: $.data.id }
            - call: "POST /facilities/${fac}/reservations"
              payload: { pet_id: "${pet}", service_type: "OVERNIGHT", start_date: "2026-03-01", end_date: "2026-03-03" }
              as: FacilityManager
              captures: { res: $.data.id, res_v: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run}", expected_reservation_version: "${res_v}" }
              as: FacilityManager
            - call: "POST /facilities/${fac}/_clock/advance"
              payload: { to_date: "2026-02-01" }
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VACCINATION_REQUIRED (p9 safety wins over p16 fiscal)"

      - name: invalid_state_beats_run_eligibility
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair state (p8 ERR_INVALID_STATE) vs business_constraint (p11
