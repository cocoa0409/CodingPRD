            - "BonusPayout for ${b2}: eligible == true, earned_premium_cents == 200000, payout_cents == 1000000 (sole eligible agent takes the whole pool: floor(1000000 * 200000/200000))"
            - "ContingentBonusPool.${pool_id}.undistributed_cents == 0"

      - name: quote_bind_at_exact_expiry_timestamp_rejected
        grounds:
          - entities.Quote.fields.expires_at
          - errors.ERR_QUOTE_EXPIRED
          - state_machines.Quote.QUOTED_to_BOUND
        distinguishing_aspect: |
          Metric: time-to-live (30 days), reached via the bind endpoint (not
          pool settle). Binding at exactly expires_at fails (now >= expires_at
          is expired) while binding one second earlier succeeds — the
          half-open boundary is on the bind side.
