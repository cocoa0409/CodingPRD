        grounds: [calculations.registration_refund, entities.PaymentTransaction.fields.status]
        distinguishing_aspect: "Cumulative threshold boundary: a refund of 9999 (< REFUND_REVIEW_THRESHOLD_CENTS 10000) auto-completes and credits immediately, while a refund of exactly 10000 (>= threshold) is born PENDING and credits nothing until finance approval."
