            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b2_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /cdfi/loans/${l2_id}/underwrite"
              payload: { verified_monthly_income_cents: 800000, existing_monthly_debt_cents: 90000, credit_score_at_underwriting: 690 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
          trigger:
            - call: "POST /cdfi/loans/${l1_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 1000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "GET /cdfi/institutions/${inst_id}/loan-products"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { after_approve: "$.data[0].committed_principal_cents" }
            - call: "POST /cdfi/loans/${l2_id}/decision"
              payload: { decision: "DECLINE", decline_reason: "INSUFFICIENT_REPAYMENT_CAPACITY" }
              as: CreditCommittee
              as_user_id: "cc-1"
            - call: "GET /cdfi/institutions/${inst_id}/loan-products"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { after_decline: "$.data[0].committed_principal_cents" }
            - call: "POST /cdfi/loans/${l1_id}/disbursements"
              payload: { amount_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/loans/${l1_id}/payments"
              payload: { amount_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { payoff_state: $.data.servicing_state }
          assert:
            - "${committed_at_create} == 0"
            - "${after_approve} == 1000000"
            - "${after_decline} == 1000000"
            - "${payoff_state} == PAID_OFF"
            - "LoanProduct.${prod_id}.committed_principal_cents == 1000000"
            - "Loan.${l1_id}.underwriting_state == CLOSED"
            - "Loan.${l1_id}.principal_repaid_cents == 1000000"
            - "Loan.${l1_id}.principal_outstanding_cents == 0"
            - "Loan.${l2_id}.underwriting_state == DECLINED"
            - "Loan.${l2_id}.decline_reason == INSUFFICIENT_REPAYMENT_CAPACITY"
            - "Loan.${l2_id}.approved_principal_cents == null"
            - "Institution.${inst_id}.portfolio_principal_outstanding_cents == 0"
            - "Institution.${inst_id}.portfolio_principal_disbursed_cents == 1000000"
            - "Institution.${inst_id}.loss_reserve_required_cents == 0"
            - "Institution.${inst_id}.reserve_coverage_ratio == 1.0000"
            - "Institution.${inst_id}.compliance_posture == COMPLIANT"
      - name: servicing_run_checkpoint_flips_recertification_only_once_the_due_instant_arrives
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints[POST /cdfi/institutions/{institution_id}/servicing-runs]
          - state_machines.Institution.certification_state
          - entities.Institution.fields.recertification_due_at
        distinguishing_aspect: |
          Recertification is never flipped by the clock alone: it is a checkpoint owned by the
          servicing run. Certification on 2026-09-01 sets recertification_due_at to exactly
          2029-08-31 (1095 days later), the run on 2029-08-30 leaves the institution CERTIFIED,
          the run on the due instant itself flips it to RECERT_DUE because the comparison is
          inclusive, and a third run at that same instant is a no-op that still returns 200 with
          the institution left in RECERT_DUE. A book with no loans keeps the pinned 1.0000 ratio
          across all three runs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One institution CERTIFIED on 2026-09-01 through an APPROVED market, one representing governing seat and a fully evaluated application decided by rev-2."
            - "No loans at all, so every run recomputes an empty book."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000057", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "INVESTMENT_AREA", name: "South Bronx Investment Area", census_tract_codes: ["36005010100"] }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { tm_id: $.data.id }
            - call: "POST /cdfi/target-markets/${tm_id}/approve"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/institutions/${inst_id}/board-seats"
              payload: { structure: "GOVERNING_BOARD", holder_name: "R. Alvarez", represents_target_market: true, target_market_id: "${tm_id}" }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "GET /cdfi/institutions/${inst_id}"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { inst_v: $.data.version }
            - call: "POST /cdfi/institutions/${inst_id}/certification-applications"
              payload: { expected_institution_version: "${inst_v}", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", financing_activity_pct_claimed: 72.50, development_services_description: "Credit counseling, homebuyer education and business technical assistance." }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { app_id: $.data.id }
            - call: "POST /cdfi/certification-applications/${app_id}/submit"
              payload: {}
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
            - call: "POST /cdfi/certification-applications/${app_id}/begin-review"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "PRIMARY_MISSION", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "FINANCING_ENTITY", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "TARGET_MARKET", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "DEVELOPMENT_SERVICES", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "ACCOUNTABILITY", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/evaluate-test"
              payload: { test_code: "NON_GOVERNMENT", verdict: "PASSED" }
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "POST /cdfi/certification-applications/${app_id}/decide"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-2"
              captures: { cert_at: $.data.decided_at }
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-30T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
          trigger:
            - call: "POST /cdfi/institutions/${inst_id}/servicing-runs"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { day_before_state: $.data.certification_state, day_before_ratio: $.data.reserve_coverage_ratio }
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2029-08-31T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions/${inst_id}/servicing-runs"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { due_state: $.data.certification_state, due_posture: $.data.compliance_posture }
            - call: "POST /cdfi/institutions/${inst_id}/servicing-runs"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { third_status: $.status, third_state: $.data.certification_state }
          assert:
            - "${cert_at} == 2026-09-01T00:00:00Z"
            - "${day_before_state} == CERTIFIED"
            - "${day_before_ratio} == 1.0000"
            - "${due_state} == RECERT_DUE"
            - "${due_posture} == COMPLIANT"
            - "${third_status} == 200"
            - "${third_state} == RECERT_DUE"
            - "Institution.${inst_id}.certified_at == 2026-09-01T00:00:00Z"
            - "Institution.${inst_id}.recertification_due_at == 2029-08-31T00:00:00Z"
            - "Institution.${inst_id}.loss_reserve_required_cents == 0"
            - "Institution.${inst_id}.reserve_coverage_ratio == 1.0000"
            - "CertificationApplication.${app_id}.state == CERTIFIED"
      - name: multi_level_cascade_from_a_charge_off_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /cdfi/loans/{loan_id}/charge-off]
        excluded_because:
          difficulty_instance: transitive_cascade / charge_off_cascade_reaches_matching_fund_commitment_hold
          rationale: "That instance walks the whole chain in one call - loan CHARGED_OFF, reserve balance absorbed and deficit written, posture PROBATION, the DISBURSING award to DRAW_SUSPENDED and its PLEDGED commitment to HELD - and additionally proves the resume-draws attempt is refused with ERR_POSTURE_NOT_COMPLIANT."
      - name: both_lending_variants_computed_from_one_measurement_row
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.target_market_lending_percentage.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / target_market_lending_dollar_versus_count_weighted_divergence
          rationale: "Both variants are stored on the same finalized measurement there, the delta between them is asserted, and weighting_basis decides which one becomes selected_pct and the verdict."
  - section: consistency_model
    instances:
      - name: cross_aggregate_derived_fields_land_in_the_same_instant_with_no_run_required
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /cdfi/loans/{loan_id}/disbursements]
          - endpoints[POST /cdfi/impact-reports/{impact_report_id}/verify]
        distinguishing_aspect: |
          The consistency model is immediate, so a write that touches three aggregates must expose
          all of them at once: the disbursement response already carries the loan's CLOSED/CURRENT
          pair and its dates, and the very next read of the Institution - with no servicing run in
          between - already shows the portfolio totals, both reserve variants and PROBATION.
          Likewise, verifying the impact report exposes the institution's four counters
          immediately, not on a later recomputation.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One institution using MIGRATION_ANALYSIS with loss_reserve_balance_cents 0."
            - "One loan of 1,000,000 cents approved and undisbursed for a GEOCODED borrower."
          setup_api_calls:
            - call: "POST /cdfi/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000058", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/loan-products"
              payload: { name: "Flexible Small Business Loan", base_rate_bps: 900, term_months: 60, max_dti_pct: 50.00, min_credit_score: 580, allow_no_credit_score: true, credit_building_features: ["REPORTS_TO_BUREAUS"], requires_ta_completion: false, product_cap_cents: 5000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /cdfi/institutions/${inst_id}/borrowers"
              payload: { full_name: "Maria Ortiz", street_address: "12 Grand Concourse", postal_code: "10451", household_income_cents: 4200000, area_median_income_cents: 7000000, credit_score: 740 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /cdfi/borrowers/${b1_id}/geocode"
              payload: { outcome: "MATCHED", census_tract_code: "36005010100" }
              as: ComplianceAnalyst
              as_user_id: "ops-1"
            - call: "POST /cdfi/loans"
              payload: { institution_id: "${inst_id}", borrower_id: "${b1_id}", product_id: "${prod_id}", requested_principal_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { loan_id: $.data.id }
            - call: "POST /cdfi/loans/${loan_id}/underwrite"
              payload: { verified_monthly_income_cents: 1000000, existing_monthly_debt_cents: 100000, credit_score_at_underwriting: 740 }
              as: CreditUnderwriter
              as_user_id: "uw-1"
            - call: "POST /cdfi/loans/${loan_id}/decision"
              payload: { decision: "APPROVE", approved_principal_cents: 1000000 }
              as: CreditCommittee
              as_user_id: "cc-1"
          trigger:
            - call: "POST /cdfi/loans/${loan_id}/disbursements"
              payload: { amount_cents: 1000000 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { d_uw: $.data.underwriting_state, d_srv: $.data.servicing_state, d_first: $.data.first_disbursed_on, d_due: $.data.next_payment_due_on, loan_v: $.data.version }
            - call: "GET /cdfi/institutions/${inst_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { i_out: $.data.portfolio_principal_outstanding_cents, i_mig: $.data.loss_reserve_required_migration_cents, i_static: $.data.loss_reserve_required_static_cents, i_ratio: $.data.reserve_coverage_ratio, i_posture: $.data.compliance_posture }
            - call: "POST /cdfi/loans/${loan_id}/impact-reports"
              payload: { expected_loan_version: "${loan_v}", reporting_period_end: "2026-08-31T00:00:00Z", jobs_created: 4, jobs_retained: 3, housing_units: 2, businesses_financed: 1 }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /cdfi/impact-reports/${rep_id}/verify"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { v_state: $.data.state, v_at: $.data.verified_at }
            - call: "GET /cdfi/institutions/${inst_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { t_jobs: $.data.jobs_created_total, t_ret: $.data.jobs_retained_total, t_units: $.data.housing_units_total, t_biz: $.data.businesses_financed_total }
          assert:
            - "${d_uw} == CLOSED"
            - "${d_srv} == CURRENT"
            - "${d_first} == 2026-09-01"
            - "${d_due} == 2026-10-01"
            - "${i_out} == 1000000"
            - "${i_mig} == 20000"
            - "${i_static} == 45000"
            - "${i_ratio} == 0.0000"
            - "${i_posture} == PROBATION"
            - "${v_state} == VERIFIED"
            - "${v_at} == 2026-09-01T00:00:00Z"
            - "${t_jobs} == 4"
            - "${t_ret} == 3"
            - "${t_units} == 2"
            - "${t_biz} == 1"
            - "Loan.${loan_id}.vintage_year == 2026"
            - "Loan.${loan_id}.borrower_in_target_market_at_origination == false"
            - "ImpactReport.${rep_id}.state == VERIFIED"
