  # =====================================================================
  # Errors — coverage stubs for §1.8-covered corners
  # =====================================================================
  - section: errors
    instances:
      - name: error_session_at_capacity_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_AT_CAPACITY]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / session_capacity_exact_seat_boundary_on_enrollment
          rationale: "ERR_SESSION_AT_CAPACITY is asserted as the boundary rejection in the named §1.8 instance."

      - name: error_program_mismatch_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_MISMATCH]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / program_mismatch_referential_beats_age_constraint
          rationale: "ERR_PROGRAM_MISMATCH is the winning error in the named §1.8 priority-conflict instance."

      - name: error_entry_deadline_passed_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENTRY_DEADLINE_PASSED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / showcase_entry_deadline_inclusive_instant_boundary
          rationale: "ERR_ENTRY_DEADLINE_PASSED is asserted past the inclusive deadline in the named §1.8 instance."

      - name: error_member_schedule_conflict_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_MEMBER_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / member_schedule_half_open_session_overlap
          rationale: "ERR_MEMBER_SCHEDULE_CONFLICT is asserted on the overlapping session in the named §1.8 instance."

      - name: error_showcase_session_clash_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHOWCASE_SESSION_CLASH]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / showcase_buffered_closed_window_vs_session_start
          rationale: "ERR_SHOWCASE_SESSION_CLASH is asserted within the buffer window in the named §1.8 instance."

      - name: error_age_out_of_range_satisfied_path_note
        claim_type: violation_to_error
        grounds: ["errors[ERR_AGE_OUT_OF_RANGE]"]
        distinguishing_aspect: "A member age out of the program's range (member born 2014-01-01, age 12 at clock default; program max_age 9) enrolling in a same-program session returns ERR_AGE_OUT_OF_RANGE (409) — isolated so program matches and only age fails (distinct from the §1.8 priority-conflict case where program also mismatches)."
        test_recipe:
          setup: ["Program ages 4-9; member on THAT program born 2014-01-01 (age 12); OPEN session on the same program."]
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C1", device_count: 20, min_student_instructor_ratio: 6 }
              as: CenterAdmin
              captures: { c1: $.data.id }
            - call: "POST /programs"
              payload: { name: "P", code: "AG1", min_age: 4, max_age: 9, drop_in_fee_cents: 4000 }
              as: CenterAdmin
              captures: { prog: $.data.id }
            - call: "POST /belt-levels"
              payload: { program_id: "${prog}", name: "White", rank: 1, required_badge_count: 0 }
              as: CenterAdmin
            - call: "POST /guardians"
              payload: { full_name: "G", email: "g@x.com" }
              as: CenterAdmin
              captures: { g1: $.data.id }
            - call: "POST /members"
              payload: { guardian_id: "${g1}", program_id: "${prog}", full_name: "M", birth_date: "2014-01-01" }
              as: Guardian
              as_user_id: "${g1}"
              captures: { m1: $.data.id }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T16:00:00Z", ends_at: "2026-05-01T18:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterAdmin
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /enrollments"
              payload: { session_id: "${s1}", member_id: "${m1}", coverage: "DROP_IN", sibling_index: 1, expected_session_version: "${v0}" }
              as: Guardian
              as_user_id: "${g1}"
          assert:
            - "response.data.error_id == ERR_AGE_OUT_OF_RANGE"
            - "response.status == 409"
