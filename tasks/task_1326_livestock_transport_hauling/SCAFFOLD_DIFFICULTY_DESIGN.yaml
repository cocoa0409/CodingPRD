  - rule_id: non_linear_state_machine
    instances:
      - name: load_transit_weather_hold_and_rest_unload_cycles
        grounds:
          - state_machines.Load.IN_TRANSIT_to_WEATHER_HOLD
          - state_machines.Load.WEATHER_HOLD_to_IN_TRANSIT
          - state_machines.Load.IN_TRANSIT_to_REST_UNLOAD
          - state_machines.Load.REST_UNLOAD_to_IN_TRANSIT
          - calculations.confinement_clock
        distinguishing_aspect: |
          Cyclic machine on Load (distinct entity from Settlement below): two full
          IN_TRANSIT -> WEATHER_HOLD -> IN_TRANSIT loops plus an
          IN_TRANSIT -> REST_UNLOAD -> IN_TRANSIT loop in one trip; the rest-unload
          loop resets confinement_anchor_at to the resume instant (2026-08-02T23:00:00Z)
