- rule_id: cross_entity_state_dependency
  instances:
  - name: review_activate_requires_case_open_or_under_review
    grounds:
    - state_machines.CDIReview.DRAFT_to_ACTIVE
    - entities.PatientCase.fields.status
    distinguishing_aspect: 'Pair: CDIReview -> PatientCase. Review DRAFT->ACTIVE is guarded by

      parent PatientCase.status IN {OPEN, UNDER_REVIEW}; a FINAL_CODED

      case rejects activation with ERR_CASE_NOT_REVIEWABLE.

      '
    test_recipe:
      setup:
      - 'Case in FINAL_CODED (never reviewed); a DRAFT review on it (created before finalize-coding? No — FINAL_CODED requires no DRAFT reviews. Instead: create review AFTER FINAL_CODED is impossible. Use:
        two reviews, first review closes, then finalize the case; the SECOND review was never created).'
      - 'Alternative path: create review on OPEN case; hold case to FINAL_CODED via: cancel review so no open review, then finalize, then attempt to create+activate a new review — creation succeeds (creation
        is not state-gated, only activation) but activate must fail.'
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
          specialty: S
        as: CDIManager
        captures:
          prov: $.data.id
      - call: POST /api/patient-cases
        payload:
          cdi_program_id: ${prog}
          mrn: M
          admission_period: 0
          discharge_period: 1
          attending_provider_id: ${prov}
          initial_drg_code: A
          initial_drg_weight: 1.0
        as: HIMCoder
        captures:
          case: $.data.id
          case_v: $.data.version
      - call: POST /api/cdi-programs/${prog}/clock/advance
        payload:
          by_periods: 2
        as: CDIManager
      - call: POST /api/patient-cases/${case}/finalize-coding
        payload:
          coder_drg_code: A
          coder_drg_weight: 1.0
          expected_case_version: ${case_v}
        as: HIMCoder
      - call: POST /api/cdi-reviews
        payload:
          patient_case_id: ${case}
        as: CDISpecialist
        captures:
          rev: $.data.id
      trigger:
      - call: POST /api/cdi-reviews/${rev}/activate
        payload: {}
        as: CDISpecialist
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_CASE_NOT_REVIEWABLE
      - http_status == 409
  - name: query_send_requires_review_active
    grounds:
