      - name: parallel_availability_and_dispute_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ContentItem.availability_status
          - state_machines.ContentItem.dispute_status
        distinguishing_aspect: "A ContentItem carries two independent state fields; the pair (PURGED, RESOLVED) proves neither dimension gates the other."
        excluded_because:
          difficulty_instance: content_item_availability_and_dispute_dimensions_advance_independently
          rationale: "The §1.8 instance already walks both dimensions through a purge-after-dispute sequence and pins the combined pair at every step; a second parallel-shape recipe would only re-assert the same combined states."
      - name: process_notice_cascades_down_to_claims_items_and_strikes
        claim_type: cascade_down
        grounds:
          - state_machines.TakedownNotice.VALIDATED->PROCESSED.side_effects
        distinguishing_aspect: "One process call must ripple to every resolved URL: claim, content item, strike, account counters and possibly a termination case."
        excluded_because:
          difficulty_instance: process_notice_cascades_claim_content_strike_and_termination_case
          rationale: "The §1.8 instance drives the full four-level cascade in one request and pins every intermediate entity, which strictly subsumes a shallower cascade-down check."
      - name: notice_withdrawal_compensates_every_processing_side_effect
        claim_type: compensation
        grounds:
          - state_machines.TakedownNotice.PROCESSED->WITHDRAWN.side_effects
          - state_machines.StrikeRecord.ACTIVE->VOIDED
        distinguishing_aspect: "Withdrawing a processed notice must undo the strike accrual and the account standing change with no residue."
        excluded_because:
          difficulty_instance: notice_withdrawal_returns_strike_points_to_the_pre_process_value
          rationale: "The §1.8 instance captures the pre-process strike_points and standing and asserts an exact return to them after withdrawal, which is the compensation claim in its strongest form."
