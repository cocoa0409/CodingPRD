      - name: advertisement_cyclic_return_to_draft_and_second_review
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Advertisement.REJECTED_to_DRAFT
        excluded_because:
          difficulty_instance: non_linear_state_machine / advertisement_reject_revise_resubmit_approve_cycle
          rationale: "The named §1.8 instance walks DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> APPROVED and pins the six version bumps, the findings list and the reviewer reset."

      - name: loan_parallel_dimensions_change_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - entities.LoanApplication.fields.compensation_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / loan_status_and_compensation_status_advance_independently
          rationale: "The named §1.8 instance asserts status PAID_OFF against compensation_status RECONCILED after a 212-day hold, i.e. the two dimensions advancing independently."

      - name: license_lapse_cascade_down_to_children
        claim_type: cascade_down
        grounds:
          - state_machines.LicenseRegistration.ACTIVE_to_EXPIRED
          - state_machines.SponsorshipTransfer.ACTIVE_to_RELINQUISHED
        excluded_because:
          difficulty_instance: transitive_cascade / license_expiry_sweep_five_hop_authority_lapse_cascade
          rationale: "The named §1.8 instance verifies all five hops of the licence-lapse cascade end to end."

      - name: lock_guarded_by_owning_license_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.LoanApplication.TAKEN_to_LOCKED
          - validations[priority=13]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lock_rejected_after_owning_license_revoked
          rationale: "The named §1.8 instance is exactly the guarded-transition claim: TAKEN -> LOCKED only while the owning LicenseRegistration is ACTIVE or RENEWAL_PENDING."

      - name: clawback_compensating_side_effect_reversal
        claim_type: compensation
        grounds:
          - state_machines.CompensationRecord.RECONCILED_to_CLAWED_BACK
          - entities.Originator.fields.net_compensation_cents
        excluded_because:
          difficulty_instance: compensating_invariant / payoff_clawback_returns_net_compensation_to_zero
          rationale: "The named §1.8 instance drives net_compensation_cents 0 -> 400000 -> 0 and asserts no drift in the ledger identity."

  # ===========================================================================
  - section: calculations
    instances:

      - name: volume_tier_boundary_fifth_unit_lifts_final_lines_to_tier_two
        claim_type: tiered_pricing
        grounds:
          - calculations.volume_tier_bps_selection
          - calculations.originator_compensation_accrual
          - endpoints[POST /originators/{id}/compensation-reconciliations]
        distinguishing_aspect: |
          The TIER1_MAX_UNITS boundary of 4 is crossed by the fifth close. Every PROVISIONAL
          line was priced with units <= 4 and therefore TIER1_BPS 0, but the FINAL variant
          counts 5 closed units for every line, so tier_bps_adder becomes 15 on the four
          quality-95 files and 15 - QUALITY_PARTIAL_PENALTY_BPS 10 = 5 on the quality-75
          file: total_final_cents 635000 against a pre-run 600000, delta exactly 35000.
        test_recipe:
          setup:
            - "Originator 2200001, ACTIVE sponsored CA licence, assigned an ACTIVE plan with
               base_basis_points 200, min_fee_cents 0, max_fee_cents 5000000,
               volume_tier_enabled true and concession_absorption_enabled false."
            - "Five loans are locked and closed: loans 1-4 at 5000000 cents with
               file_quality_score 95, loan 5 at 10000000 cents with file_quality_score 75.
               locked_amount_cents == funded_amount_cents on every loan, so the only variant
               difference is the unit count. hours_worked_pct is 80 everywhere (>= HOURS_MIN_PCT
               50, so the HOURS_CAP_BPS clamp never engages)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
