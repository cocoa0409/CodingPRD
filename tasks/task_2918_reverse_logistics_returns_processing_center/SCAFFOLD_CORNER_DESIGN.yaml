          - entities.Client.fields.projected_settlement_balance_cents
          - endpoints[POST /disposition-orders/{disposition_order_id}/execute]
        distinguishing_aspect: "Executing one LIQUIDATE order appends a single 5461-cent RECOVERY_CREDIT that lands in settlement_balance_cents but deliberately NOT in shrink_ledger_cents, whose entry_type filter excludes recovery credits — so after the cascade the client reads settlement 5461 with shrink 0."
