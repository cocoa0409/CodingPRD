  - section: consistency_model
    instances:

      - name: activation_response_already_carries_the_updated_ledger
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Lease.lease_unbilled_to_accruing
          - calculations.customer_exposure
        distinguishing_aspect: "Consistency is immediate: the POST /leases/{id}/activate response body itself already shows billing_status ACCRUING and billed_to_date_cents 478565, and a follow-up GET /customers/{id} in the same test shows outstanding_balance_cents 478565 with no intervening reconciliation step."
        test_recipe:
          setup:
            - "Permit-free lease on a PUBLISHED 20x48 configuration for a GOLD customer with a 5,000,000-cent limit."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Dallas Yard", region_code: "TX-N", yard_capacity_units: 25, daily_dispatch_capacity: 2, labor_rate_cents_per_hour: 9200 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { b1_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "TX-RUR", name: "Rural County", permit_required: false, permit_lead_days: 0, anchoring_standard: "GROUND_ANCHOR", wind_zone: 1, permit_fee_cents: 0, ada_ramp_required: false, min_ramp_run_ratio: 12.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { j2_id: $.data.id }
            - call: "POST /building-specs"
              payload: { model_code: "MOB-2048", width_ft: 20, length_ft: 48, sections: 1, floor_height_in: 24, base_monthly_rate_cents: 118050, delivery_base_cents: 165000, install_base_cents: 120000, replacement_value_cents: 6200000, max_occupancy: 12 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { s2_id: $.data.id }
            - call: "POST /floorplan-configurations"
              payload: { building_spec_id: "${s2_id}", name: "Open Plan", private_offices: 2, restrooms: 1, partition_linear_ft: 22, hvac_tons: 2.0 }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { c2_id: $.data.id }
            - call: "POST /floorplan-configurations/${c2_id}/publish"
              payload: {}
              as: FleetAdmin
              as_user_id: "admin-ops-1"
            - call: "POST /units"
              payload: { serial_number: "MSU-2001", building_spec_id: "${s2_id}", current_branch_id: "${b1_id}", condition_grade: "A" }
              as: FleetAdmin
              as_user_id: "admin-ops-1"
              captures: { u2_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Basin Drilling", billing_email: "ap@basin.test", credit_tier: "GOLD", credit_limit_cents: 5000000 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { cu2_id: $.data.id }
            - call: "POST /leases"
              payload: { customer_id: "${cu2_id}", unit_id: "${u2_id}", jurisdiction_id: "${j2_id}", floorplan_configuration_id: "${c2_id}", site_address: "9 County Road 12, Rural TX", start_date: "2026-10-01", term_months: 12 }
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { l2_id: $.data.id }
          trigger:
            - call: "POST /leases/${l2_id}/activate"
              payload: {}
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { billed_now: $.data.billed_to_date_cents, billing_now: $.data.billing_status }
            - call: "GET /customers/${cu2_id}"
              as: LeasingAgent
              as_user_id: "agent-77"
              captures: { bal_now: $.data.outstanding_balance_cents }
          assert:
            - "the activate response body itself has billing_status == \"ACCRUING\" and billed_to_date_cents == 478565"
            - "Customer.${cu2_id}.outstanding_balance_cents == 478565 on the very next read"
            - "Customer.${cu2_id}.credit_hold == false"
            - "Lease.${l2_id}.occupancy_status == \"PENDING\""

