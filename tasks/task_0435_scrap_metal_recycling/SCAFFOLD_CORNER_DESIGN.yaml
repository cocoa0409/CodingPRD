scaffold_corner_design:
  # =========================================================================
  # Entities — creation, retrieval, required fields, computed/system fields
  # =========================================================================
  - section: entities
    instances:
      - name: create_seller_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Seller, endpoints]
        distinguishing_aspect: "POST /yard/sellers with legal_name/id_type/id_number returns 201; status=ACTIVE, ytd_cash_paid_cents=0, requires_1099=false, open_theft_reports=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/sellers"
              payload: { legal_name: "New Seller", id_type: "DRIVERS_LICENSE", id_number: "DL-100" }
              as: WeighMaster
              captures: { sid: $.data.id }
          assert:
            - "response.status == 201"
            - "Seller.${sid}.status == ACTIVE"
            - "Seller.${sid}.ytd_cash_paid_cents == 0"
            - "Seller.${sid}.requires_1099 == false"
            - "Seller.${sid}.open_theft_reports == 0"

      - name: get_seller_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Seller, endpoints]
        distinguishing_aspect: "GET /yard/sellers/{id} returns the stored seller with matching legal_name and id."
        test_recipe:
          setup: ["One registered seller."]
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Read Me", id_type: "STATE_ID", id_number: "SID-R" }
              as: WeighMaster
              captures: { sid: $.data.id }
          trigger:
            - call: "GET /yard/sellers/${sid}"
              payload: {}
              as: WeighMaster
          assert:
            - "response.status == 200"
            - "response.data.legal_name == Read Me"
            - "response.data.id == ${sid}"

      - name: get_seller_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /yard/sellers/{id} for an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /yard/sellers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_ticket_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.ScaleTicket, "validations[priority=14]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /yard/tickets without gross_weight_lb returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One seller exists."]
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Req Co", id_type: "STATE_ID", id_number: "SID-REQ" }
              as: WeighMaster
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}" }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: tin_optional_default_null_on_seller
        claim_type: Defaults
        grounds: [entities.Seller.fields.tin]
        distinguishing_aspect: "Omitting tin at registration leaves tin null (default applied)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/sellers"
              payload: { legal_name: "No TIN", id_type: "PASSPORT", id_number: "P-NT" }
              as: WeighMaster
              captures: { sid: $.data.id }
          assert:
            - "response.status == 201"
            - "Seller.${sid}.tin == null"

      - name: line_valuation_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.TicketLineItem.fields.line_valuation_cents, calculations.ticket_spot_valuation]
        distinguishing_aspect: "line_valuation_cents is server-computed round_half_up(weight_lb*spot); weight_lb=10 @ spot 375 -> 3750, regardless of any client-supplied valuation."
        test_recipe:
          setup: ["Active CU price spot=375; a DRAFT ticket."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CU_BARE_BRIGHT", category: "NON_FERROUS", spot_price_cents_per_lb: 375, mill_price_cents_per_lb: 410 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Comp Co", id_type: "STATE_ID", id_number: "SID-C" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 10 }
              as: WeighMaster
              captures: { lv: $.data.line_valuation_cents }
          assert:
            - "response.status == 201"
            - "response.data.line_valuation_cents == 3750"

      - name: seller_id_system_generated_uuid_no_prefix
        claim_type: System Fields
        grounds: [entities.Seller]
        distinguishing_aspect: "Seller.id is a server-minted UUID with no type prefix; created_at/updated_at/version stamped by the system."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Sys Co", id_type: "STATE_ID", id_number: "SID-SYS" }
              as: WeighMaster
              captures: { sid: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Seller.${sid}.version == 1"

      - name: invalid_id_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Seller.fields.id_type, "validations[priority=14]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /yard/sellers with id_type not in {DRIVERS_LICENSE,STATE_ID,PASSPORT} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Bad Enum", id_type: "FACE_SCAN", id_number: "X" }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: line_item_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TicketLineItem]
        distinguishing_aspect: "TicketLineItem has common_fields:false — it carries only id and created_at; no version field and no update endpoint exist."
        test_recipe:
          setup: ["Active CU price; a DRAFT ticket with one line item."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CU_BARE_BRIGHT", category: "NON_FERROUS", spot_price_cents_per_lb: 375, mill_price_cents_per_lb: 410 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Imm Co", id_type: "STATE_ID", id_number: "SID-IMM" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 5 }
              as: WeighMaster
              captures: { li_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.id == ${li_id}"

      - name: ticket_requires_existing_seller_fk
        claim_type: Parent Relationships
        grounds: [entities.ScaleTicket.fields.seller_id, "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /yard/tickets with a non-existent seller_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /yard/tickets"
              payload: { seller_id: "00000000-0000-0000-0000-000000000000", gross_weight_lb: 100 }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_sellers_paginated_envelope
        claim_type: Listing
        grounds: [entities.Seller, endpoints]
        distinguishing_aspect: "GET /yard/sellers returns an array response with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two sellers registered."]
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "L1", id_type: "STATE_ID", id_number: "SID-L1" }
              as: WeighMaster
            - call: "POST /yard/sellers"
              payload: { legal_name: "L2", id_type: "STATE_ID", id_number: "SID-L2" }
              as: WeighMaster
          trigger:
            - call: "GET /yard/sellers"
              payload: { limit: 1, offset: 0 }
              as: WeighMaster
          assert:
            - "response.status == 200"
            - "response.data.total_count >= 2"
            - "response.data.has_more == true"

  # =========================================================================
  # State machines — valid transitions, invalid-from, terminal lockdown
  # =========================================================================
  - section: state_machines
    instances:
      - name: weigh_out_from_draft_to_weighed_freezes_valuation
        claim_type: Valid Transition
        grounds: [state_machines.ScaleTicket.DRAFT_to_WEIGHED, entities.ScaleTicket.fields.net_weight_lb]
        distinguishing_aspect: "DRAFT ticket with one line (100 lb SHRED_STEEL @11) weigh-out (gross 1500, tare 200) -> WEIGHED, net_weight_lb=1300, gross_valuation_cents=1100."
        test_recipe:
          setup: ["Active SHRED_STEEL price spot=11; DRAFT ticket with one 100 lb line."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "VT Co", id_type: "STATE_ID", id_number: "SID-VT" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
          assert:
            - "response.status == 200"
            - "ScaleTicket.${tkt_id}.status == WEIGHED"
            - "ScaleTicket.${tkt_id}.net_weight_lb == 1300"
            - "ScaleTicket.${tkt_id}.gross_valuation_cents == 1100"

      - name: release_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ScaleTicket.WEIGHED_to_RELEASED, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing a DRAFT (not WEIGHED) ticket returns ERR_INVALID_STATE (409); no container load occurs."
        test_recipe:
          setup: ["A DRAFT ticket and a STAGED container."]
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Inv State", id_type: "STATE_ID", id_number: "SID-IS" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: report_from_reported_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ScaleTicket.WEIGHED_to_REPORTED, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REPORTED ticket (terminal) cannot be reported again; second report returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A REPORTED ticket."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CAT_CONV", category: "NON_FERROUS", spot_price_cents_per_lb: 50000, mill_price_cents_per_lb: 52000 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Term Co", id_type: "PASSPORT", id_number: "P-TERM" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 50 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CAT_CONV", weight_lb: 5 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 10 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/report"
              payload: { reason: "first report" }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/report"
              payload: { reason: "second report" }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: clear_hold_records_releaser_id
        claim_type: Side Effect Execution
        grounds: [state_machines.ScaleTicket.HOLD_to_WEIGHED, entities.ScaleTicket.fields.theft_hold_released_by]
        distinguishing_aspect: "HOLD->WEIGHED via clear-hold sets theft_hold_released_by to the acting WeighMaster's X-User-ID."
        test_recipe:
          setup: ["A WEIGHED ticket placed on theft HOLD."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Hold Co", id_type: "STATE_ID", id_number: "SID-HD" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/theft-hold"
              payload: {}
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/clear-hold"
              payload: {}
              as: WeighMaster
              as_user_id: "U_CLEAR_1"
          assert:
            - "response.status == 200"
            - "ScaleTicket.${tkt_id}.status == WEIGHED"
            - "ScaleTicket.${tkt_id}.theft_hold_released_by == U_CLEAR_1"

      - name: new_ticket_starts_in_draft
        claim_type: Initial State
        grounds: [state_machines.ScaleTicket, entities.ScaleTicket.fields.status]
        distinguishing_aspect: "A newly created ScaleTicket starts in DRAFT (initial_state)."
        test_recipe:
          setup: ["One seller."]
          setup_api_calls:
            - call: "POST /yard/sellers"
              payload: { legal_name: "Init Co", id_type: "STATE_ID", id_number: "SID-INI" }
              as: WeighMaster
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 100 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ScaleTicket.${tkt_id}.status == DRAFT"

      - name: settle_payout_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Payout.PENDING_to_SETTLED, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling an already-SETTLED payout a second time returns ERR_INVALID_STATE (409); ledger is not moved twice."
        test_recipe:
          setup: ["A SETTLED CASH payout (amount 1100c)."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Idem Co", id_type: "STATE_ID", id_number: "SID-ID" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "POST /yard/payouts"
              payload: { ticket_id: "${tkt_id}", method: "CASH" }
              as: PayoutClerk
              captures: { payout_id: $.data.id }
            - call: "POST /yard/payouts/${payout_id}/settle"
              payload: {}
              as: PayoutClerk
          trigger:
            - call: "POST /yard/payouts/${payout_id}/settle"
              payload: {}
              as: PayoutClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Seller.${sid}.ytd_cash_paid_cents == 1100"

      - name: add_line_item_after_weighout_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.ScaleTicket.DRAFT_to_DRAFT, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adding a line item to a WEIGHED (no longer DRAFT) ticket returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A WEIGHED ticket."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "SHRED_STEEL", category: "FERROUS", spot_price_cents_per_lb: 11, mill_price_cents_per_lb: 14 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Late Line", id_type: "STATE_ID", id_number: "SID-LL" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 100 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
          trigger:
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "SHRED_STEEL", weight_lb: 50 }
              as: WeighMaster
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: dispatch_empty_container_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Container.STAGED_to_DISPATCHED, "validations[priority=4]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dispatching a STAGED container with loaded_weight_lb==0 violates the non-empty precondition -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An empty STAGED container (version 1)."]
          setup_api_calls:
            - call: "POST /yard/containers"
              payload: { category: "FERROUS", capacity_lb: 5000 }
              as: YardManager
              captures: { cont_id: $.data.id, cont_v: $.data.version }
          trigger:
            - call: "POST /yard/containers/${cont_id}/dispatch"
              payload: { expected_container_version: "${cont_v}" }
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Container.${cont_id}.status == STAGED"

  # =========================================================================
  # Calculations — correct result, constants, precision
  # =========================================================================
  - section: calculations
    instances:
      - name: settlement_variance_unfavorable_negative
        claim_type: Correct Result
        grounds: [calculations.mill_settlement_reconciliation, entities.MillShipment.fields.settlement_variance_cents]
        distinguishing_aspect: "Container with two CU lines (10.1,20.1 lb @ mill 410) -> expected 12382c; final 11000c -> settlement_variance_cents == -1382 (unfavorable)."
        test_recipe:
          setup: ["A SHIPPED shipment whose container holds two CU lines (10.1 lb, 20.1 lb), expected_settlement 12382c."]
          setup_api_calls:
            - call: "POST /yard/commodity-prices"
              payload: { grade_code: "CU_BARE_BRIGHT", category: "NON_FERROUS", spot_price_cents_per_lb: 375, mill_price_cents_per_lb: 410 }
              as: YardManager
            - call: "POST /yard/sellers"
              payload: { legal_name: "Var Co", id_type: "STATE_ID", id_number: "SID-VAR" }
              as: WeighMaster
              captures: { sid: $.data.id }
            - call: "POST /yard/containers"
              payload: { category: "NON_FERROUS", capacity_lb: 100000 }
              as: YardManager
              captures: { cont_id: $.data.id }
            - call: "POST /yard/tickets"
              payload: { seller_id: "${sid}", gross_weight_lb: 1500 }
              as: WeighMaster
              captures: { tkt_id: $.data.id }
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 10.1 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/line-items"
              payload: { grade_code: "CU_BARE_BRIGHT", weight_lb: 20.1 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/weigh-out"
              payload: { tare_weight_lb: 200 }
              as: WeighMaster
            - call: "POST /yard/tickets/${tkt_id}/release"
              payload: { container_id: "${cont_id}" }
              as: WeighMaster
            - call: "GET /yard/containers/${cont_id}"
              payload: {}
              as: YardManager
              captures: { cont_v: $.data.version }
            - call: "POST /yard/containers/${cont_id}/dispatch"
