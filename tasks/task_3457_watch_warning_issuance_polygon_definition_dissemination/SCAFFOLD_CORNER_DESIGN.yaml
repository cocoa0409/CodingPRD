              captures: { sk_fc: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${sk_off_a}", zone_ids: ["${sk_za}", "${sk_zb}"], effective_from: "2026-09-01T06:00:00Z", expires_at: "2026-09-01T18:00:00Z" }
