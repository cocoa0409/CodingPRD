# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3372_teacher_classroom_project_funding_vendor_fulfillment_donor
#
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. §1.8-covered corners appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: school_create_computes_both_equity_score_variants
        claim_type: Creation
        grounds:
          - entities.School
          - calculations.school_equity_scores
          - endpoints.POST_/giving/schools
        distinguishing_aspect: "A school created with poverty_pct 80.0 and ell_pct 90.0 returns 201 with equity_score_banded == 80 and equity_score_weighted == 83.0 computed by the server, version == 1, and the standard envelope meta fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /giving/schools"
              payload: { name: "Ridgeview Elementary", state_code: "TX", district: "Ridgeview ISD", poverty_pct: 80.0, ell_pct: 90.0 }
              as: PlatformAdmin
              captures: { s1: $.data.id, banded: $.data.equity_score_banded, weighted: $.data.equity_score_weighted }
          assert:
            - "the response status is 201 and response_type is object"
            - "banded == 80 (poverty 80.0 lands in the >= 75 band) and weighted == 83.0 (round(0.7*80.0 + 0.3*90.0, 1))"
            - "School.${s1}.version == 1 and its id, created_at, updated_at are present"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: catalog_item_defaults_fragile_false_and_cap_null
        claim_type: Defaults
        grounds:
          - entities.CatalogItem.fields.fragile
          - entities.CatalogItem.fields.max_quantity_per_project
          - endpoints.POST_/giving/vendors/{vendor_id}/catalog-items
        distinguishing_aspect: "Omitting the two optional fields stores fragile == false and max_quantity_per_project == null (not 0, not absent), and the new item starts ACTIVE with version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One vendor."
          setup_api_calls:
            - *k_clock
            - &k_vendor
              call: "POST /giving/vendors"
              payload: { name: "SchoolMart", ship_from_state: "TX", contact_email: "ops@schoolmart.example" }
              as: PlatformAdmin
              captures: { v1: $.data.id }
          trigger:
            - &k_item
              call: "POST /giving/vendors/${v1}/catalog-items"
              payload: { sku: "SM-BOOK-1", name: "Leveled Readers Set", category: "BOOKS", subject_tags: ["LITERACY"], unit_price_cents: 2500, weight_oz: 10, shipping_zone: "A" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
          assert:
            - "the response status is 201"
            - "CatalogItem.${i1}.fragile == false and CatalogItem.${i1}.max_quantity_per_project is null"
            - "CatalogItem.${i1}.status == ACTIVE and version == 1"

      - name: project_create_with_supplied_status_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Project.fields.status
          - entities.Project.fields.teacher_id
          - entities.Project.fields.school_id
          - endpoints.POST_/giving/projects
        distinguishing_aspect: "status, teacher_id and school_id are system-sourced: a create body smuggling status=FUNDING still yields a DRAFT project whose teacher_id comes from X-User-ID and whose school_id is denormalized from the teacher row, with funded_cents == 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. School; VERIFIED teacher Ada."
          setup_api_calls:
            - *k_clock
            - &k_school
              call: "POST /giving/schools"
              payload: { name: "Ridgeview Elementary", state_code: "TX", district: "Ridgeview ISD", poverty_pct: 80.0, ell_pct: 90.0 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - &k_teacher
              call: "POST /giving/teachers"
              payload: { full_name: "Ada Lovelace", email: "ada@example.org", school_id: "${s1}", subjects_taught: ["LITERACY"] }
              as: Anonymous
              captures: { t1: $.data.id }
            - &k_verify
              call: "POST /giving/teachers/${t1}/employment-review"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /giving/projects"
              payload: { title: "Books for Budding Readers", description: "Classroom library for grade 3-5 readers.", subject: "LITERACY", grade_band: "G3_5", funding_window_days: 30, status: "FUNDING" }
              as: Teacher
              as_user_id: "${t1}"
              captures: { p1: $.data.id }
          assert:
            - "the response status is 201"
            - "Project.${p1}.status == DRAFT (the smuggled FUNDING was ignored)"
            - "Project.${p1}.teacher_id == ${t1} and Project.${p1}.school_id == ${s1}"
            - "Project.${p1}.funded_cents == 0 and version == 1"

      - name: project_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/giving/projects/{project_id}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated project id returns 404 ERR_NOT_FOUND with the error envelope, not a 400 and not an empty object."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /giving/projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_NOT_FOUND"
            - "response_type == error and data carries both error_id and message"

      - name: thank_you_package_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ThankYouPackage
          - endpoints.GET_/giving/projects/{id}/thank-you-package
        distinguishing_aspect: "ThankYouPackage declares common_fields: false, so a read package row carries id and created_at but NO version and NO updated_at — the package mutates exactly once (PENDING -> SUBMITTED) without optimistic-concurrency plumbing."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A FUNDED project (goal fixture 10959 tipped by one 10959c donation)."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - &k_project
              call: "POST /giving/projects"
              payload: { title: "Books for Budding Readers", description: "Classroom library for grade 3-5 readers.", subject: "LITERACY", grade_band: "G3_5", funding_window_days: 30 }
              as: Teacher
              as_user_id: "${t1}"
              captures: { p1: $.data.id, p_v: $.data.version }
            - &k_add
              call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i1}", quantity: 4, expected_project_version: "${p_v}" }
              as: Teacher
              as_user_id: "${t1}"
            - &k_getp1
              call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - &k_submit
              call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - &k_screen
              call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - &k_vet
              call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - &k_donor
              call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 10959 }
              as: Donor
              as_user_id: "${d1}"
          trigger:
            - call: "GET /giving/projects/${p1}/thank-you-package"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200, response_type == array, and exactly one row exists"
            - "the row has status == PENDING, id and created_at present, submitted_at null"
            - "the row has NO version key and NO updated_at key (common_fields: false)"

      - name: teachers_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/giving/teachers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three teachers on one school, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the last row with has_more false, and the school_id filter narrows the counted set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One school with three teachers."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - call: "POST /giving/teachers"
              payload: { full_name: "Alan Turing", email: "alan@example.org", school_id: "${s1}" }
              as: Anonymous
              captures: { t2: $.data.id }
            - call: "POST /giving/teachers"
              payload: { full_name: "Grace Hopper", email: "grace@example.org", school_id: "${s1}" }
              as: Anonymous
              captures: { t3: $.data.id }
          trigger:
            - call: "GET /giving/teachers"
              payload: { school_id: "${s1}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response status is 200, response_type == array, exactly 2 rows returned"
            - "total_count == 3 and has_more == true"
            - "GET /giving/teachers?school_id=${s1}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /giving/teachers with no parameters returns 3 rows (default limit 10, offset 0)"

      - name: project_quote_dual_variant_faces
        claim_type: Computed Fields
        grounds:
          - entities.Project.fields.provisional_total_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / project_quote_provisional_moves_pinned_immune
          rationale: "Provisional vs pinned divergence and PATCH immunity are asserted there."

      - name: equity_score_variant_divergence
        claim_type: Computed Fields
        grounds:
          - entities.School.fields.equity_score_banded
          - entities.School.fields.equity_score_weighted
          - calculations.school_equity_scores
        excluded_because:
          difficulty_instance: dual_variant_calc / equity_scores_banded_vs_weighted_ranking_inversion
          rationale: "Banded vs weighted divergence and ranking selection are asserted there."

  # ===========================================================================
  - section: state_machines
    instances:

      - name: vet_stage_on_in_review_project_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Project.IN_REVIEW_to_VETTING
          - errors.ERR_INVALID_STATE
          - validations[priority=5]
        distinguishing_aspect: "stage=VET is only legal from VETTING; against an IN_REVIEW project it is rejected with ERR_INVALID_STATE and the project stays IN_REVIEW with screened_by_id still null."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Project submitted and IN_REVIEW (goal fixture 10959)."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
          trigger:
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409) — VET requires the VETTING state"
            - "Project.${p1}.status == IN_REVIEW and screened_by_id is null"

      - name: rejected_project_is_terminal_for_submit
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Project.VETTING_to_REJECTED
          - state_machines.Project.DRAFT_to_IN_REVIEW
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "REJECTED is terminal: a resubmit against it fails with ERR_INVALID_STATE even when the OCC version is current, and the review outcome that produced it is untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Project pushed through SCREEN APPROVE then VET REJECT, so it sits in REJECTED."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "REJECT" }
              as: Reviewer
              as_user_id: "rev-ben"
              captures: { st_rej: $.data.status }
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v_rej: $.data.version }
          trigger:
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v_rej}" }
              as: Teacher
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "st_rej == REJECTED after the VET REJECT decision"
            - "err == ERR_INVALID_STATE (409) — terminal state, and the OCC version was fresh so this is the state check firing, not a 412"
            - "Project.${p1}.status == REJECTED and vetted_by_id == \"rev-ben\""

      - name: delivering_final_po_bubbles_project_to_fulfilled
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Project.FUNDED_to_FULFILLED
          - state_machines.PurchaseOrder.SHIPPED_to_DELIVERED
          - calculations.po_issuance
        distinguishing_aspect: "Compound bubble-up over a TWO-vendor project: the auto-issuance creates one PO per vendor, delivering the first PO leaves the project FUNDED, and only the second DELIVER flips it to FULFILLED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two vendors: SchoolMart (SM-BOOK-1, 2500c, 10oz, zone A) and RugCo (RC-RUG-1, 1000c, 20oz, zone A). Project with 4x SM-BOOK-1 and 2x RC-RUG-1; goal = 10000 + 2000 + 959 + 959 = 13918, tipped by one 13918c donation; both POs SHIPPED."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - call: "POST /giving/vendors"
              payload: { name: "RugCo", ship_from_state: "TX", contact_email: "ops@rugco.example" }
              as: PlatformAdmin
              captures: { v2: $.data.id }
            - call: "POST /giving/vendors/${v2}/catalog-items"
              payload: { sku: "RC-RUG-1", name: "Classroom Rug", category: "FURNITURE", subject_tags: [], unit_price_cents: 1000, weight_oz: 20, shipping_zone: "A" }
              as: PlatformAdmin
              captures: { i2: $.data.id }
            - *k_project
            - *k_add
            - *k_getp1
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i2}", quantity: 2, expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v3: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v3}" }
              as: Teacher
              as_user_id: "${t1}"
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 13918 }
              as: Donor
              as_user_id: "${d1}"
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}", vendor_id: "${v1}" }
              as: PlatformAdmin
              captures: { po_a: "$.data[0].id" }
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}", vendor_id: "${v2}" }
              as: PlatformAdmin
              captures: { po_b: "$.data[0].id" }
            - call: "POST /giving/purchase-orders/${po_a}/advance"
              payload: { action: "SHIP", tracking_number: "1Z999AA10123456784" }
              as: Vendor
              as_user_id: "${v1}"
            - call: "POST /giving/purchase-orders/${po_b}/advance"
              payload: { action: "SHIP", tracking_number: "1Z888BB20123456789" }
              as: Vendor
              as_user_id: "${v2}"
          trigger:
            - call: "POST /giving/purchase-orders/${po_a}/advance"
              payload: { action: "DELIVER" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { st_mid: $.data.status }
            - call: "POST /giving/purchase-orders/${po_b}/advance"
              payload: { action: "DELIVER" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: PlatformAdmin
              captures: { st_final: $.data.status }
          assert:
            - "the FUNDED transition created exactly two PurchaseOrders, one per vendor"
            - "PurchaseOrder.${po_a}.line_total_cents == 10000 and shipping_fee_cents == 959; PurchaseOrder.${po_b}.line_total_cents == 2000 and shipping_fee_cents == 959"
            - "st_mid == FUNDED after the first DELIVER (one PO still SHIPPED)"
            - "st_final == FULFILLED after the second DELIVER (all POs delivered)"
            - "PurchaseOrder.${po_a}.status == DELIVERED and PurchaseOrder.${po_b}.status == DELIVERED"

      - name: thank_you_submission_closes_fulfilled_project
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ThankYouPackage.PENDING_to_SUBMITTED
          - state_machines.Project.FULFILLED_to_CLOSED
          - calculations.thank_you_gate
        distinguishing_aspect: "Submitting the package on a FULFILLED project flips the package to SUBMITTED with submitted_at stamped and bubbles the project to CLOSED, which also releases the teacher's thank-you gate."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Single-vendor project FULFILLED (goal fixture 10959: 4x SM-BOOK-1, one 10959c donation, PO shipped and delivered) with its package PENDING."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 10959 }
              as: Donor
              as_user_id: "${d1}"
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}", vendor_id: "${v1}" }
              as: PlatformAdmin
              captures: { po_a: "$.data[0].id" }
            - call: "POST /giving/purchase-orders/${po_a}/advance"
              payload: { action: "SHIP", tracking_number: "1Z999AA10123456784" }
              as: Vendor
              as_user_id: "${v1}"
            - call: "POST /giving/purchase-orders/${po_a}/advance"
              payload: { action: "DELIVER" }
              as: Teacher
              as_user_id: "${t1}"
          trigger:
            - call: "POST /giving/projects/${p1}/thank-you-package"
              payload: { thank_you_note: "Thank you for funding our classroom library!", impact_report: "Every student now reads 20 minutes daily; fluency scores are already climbing across the board." }
              as: Teacher
              as_user_id: "${t1}"
              captures: { pkg_status: $.data.status, pkg_at: $.data.submitted_at }
          assert:
            - "pkg_status == SUBMITTED and pkg_at == \"2026-09-01T00:00:00Z\" (logical clock)"
            - "Project.${p1}.status == CLOSED (FULFILLED -> CLOSED bubble-up)"
            - "GET /giving/projects/${p1}/thank-you-package returns the single SUBMITTED row"

      - name: choice_on_captured_donation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Donation
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "reallocation-choice is only legal from CHOICE_PENDING; against a CAPTURED donation on a still-FUNDING project it fails with ERR_INVALID_STATE and no donor aggregates move."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. FUNDING project (goal 10959) with one CAPTURED 5000c donation."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id, dn_v: $.data.version }
          trigger:
            - call: "POST /giving/donations/${dn1}/reallocation-choice"
              payload: { choice: "REFUND", expected_donation_version: "${dn_v}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409) — CAPTURED is not CHOICE_PENDING"
            - "Donation.${dn1}.status == CAPTURED and Donor.${d1}.lifetime_refunded_cents == 0"

      - name: project_revision_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.Project.RETURNED_to_IN_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_revision_cycle_returns_to_review
          rationale: "The full DRAFT->IN_REVIEW->RETURNED->IN_REVIEW->VETTING->RETURNED->...->FUNDING loop is asserted there."

      - name: donation_fork_from_choice_pending
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Donation.CHOICE_PENDING_to_REALLOCATED
        excluded_because:
          difficulty_instance: non_linear_state_machine / donation_choice_fork_divergent_side_effects
          rationale: "Both branches of the CHOICE_PENDING fork with divergent side effects are asserted there."

      - name: fraud_confirm_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FraudCase.OPEN_to_CONFIRMED
        excluded_because:
          difficulty_instance: transitive_cascade / fraud_confirm_cascade_suspends_and_claws_back
          rationale: "The four-deep cascade including teacher suspension, project cancel, refunds and match clawback is asserted there."

      - name: sweep_expiry_and_auto_refund
        claim_type: Valid Transition
        grounds:
          - state_machines.Project.FUNDING_to_EXPIRED
        excluded_because:
          difficulty_instance: transitive_cascade / expiration_sweep_two_phase_cascade
          rationale: "The two-phase sweep cascade with inclusive boundary semantics is asserted there."

  # ===========================================================================
  - section: calculations
    instances:

      - name: match_budget_cap_exhausts_campaign_then_clawback_restores
        claim_type: Constants Applied
        grounds:
          - calculations.match_allocation
          - entities.MatchCampaign.fields.remaining_budget_cents
          - state_machines.MatchCampaign.ACTIVE_to_EXHAUSTED
          - state_machines.MatchCampaign.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: "The min(raw_match, remaining_budget) cap binds: a 500c donation against a 300c-budget 1:1 campaign matches exactly 300 and flips the campaign to EXHAUSTED; the later expiry clawback restores the 300 and flips it back to ACTIVE because its window is still open."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. FUNDING project (goal 10959, window 30 days); ACTIVE campaign ratio 1.0, budget 300, STATE TX, window [2026-09-01, 2026-12-01)."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "TinyCap Partners", match_ratio: 1.0, budget_cents: 300, target_type: "STATE", target_value: "TX", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc1: $.data.id }
            - *k_donor
          trigger:
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 500, match_campaign_id: "${mc1}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id, m1: $.data.matched_cents }
            - call: "GET /giving/match-campaigns/${mc1}"
              payload: {}
              as: PlatformAdmin
              captures: { so_far: $.data.matched_so_far_cents, remaining: $.data.remaining_budget_cents, mc_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /giving/match-campaigns/${mc1}"
              payload: {}
              as: PlatformAdmin
              captures: { so_far_2: $.data.matched_so_far_cents, remaining_2: $.data.remaining_budget_cents, mc_status_2: $.data.status }
          assert:
            - "m1 == 300 — min(round_half_up(500 x 1.0), remaining 300) caps at the budget"
            - "so_far == 300, remaining == 0 and mc_status == EXHAUSTED after the capped match"
            - "Project.${p1}.funded_cents == 800 after the donation (500 + 300)"
            - "after the expiry sweep: so_far_2 == 0, remaining_2 == 300, mc_status_2 == ACTIVE (window [2026-09-01, 2026-12-01) still covers 2026-10-01)"

      - name: shipping_fee_cap_binds_on_heavy_fragile_order
        claim_type: Correct Result
        grounds:
          - calculations.po_shipping_quote
        distinguishing_aspect: "The 4999c cap binds: 99 units of a 200oz zone-C fragile item yield raw 899 + ceil(19800/16)=1238 lbs x 260 + 350 = 323129, clamped to exactly 4999 — an implementation without the cap reports 323129."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Verified teacher; vendor with item SM-LAB-9 (800c, 200oz, zone C, fragile, no qty cap); project holds 99 units; goal = 99 x 800 + 4999 = 84199; project FUNDED via one 84199c donation."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - call: "POST /giving/vendors/${v1}/catalog-items"
              payload: { sku: "SM-LAB-9", name: "Centrifuge", category: "LAB_EQUIPMENT", subject_tags: ["SCIENCE"], unit_price_cents: 800, weight_oz: 200, shipping_zone: "C", fragile: true }
              as: PlatformAdmin
              captures: { i9: $.data.id }
            - *k_project
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i9}", quantity: 99, expected_project_version: "${p_v}" }
              as: Teacher
              as_user_id: "${t1}"
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 84199 }
              as: Donor
              as_user_id: "${d1}"
          trigger:
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}" }
              as: PlatformAdmin
              captures: { fee: "$.data[0].shipping_fee_cents", lines: "$.data[0].line_total_cents" }
          assert:
            - "Project.${p1}.status == FUNDED and goal_cents == 84199"
            - "lines == 79200 (99 x 800)"
            - "fee == 4999 — the cap, not the raw 323129"

      - name: match_per_donation_rounding_order
        claim_type: Precision
        grounds:
          - calculations.match_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / match_rounded_per_donation_not_per_sum
          rationale: "The pinned per-donation-then-sum rounding order (102 vs 101) is asserted there."

      - name: campaign_budget_conservation
        claim_type: Correct Result
        grounds:
          - calculations.campaign_budget_invariant
        excluded_because:
          difficulty_instance: compensating_invariant / match_budget_conserved_across_apply_and_clawback
          rationale: "budget == matched_so_far + remaining across apply and clawback is asserted there."

  # ===========================================================================
  - section: validations
    instances:

      - name: occ_conflict_on_stale_project_version
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[project-edit-stale-version]
          - validations[priority=4]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After a first successful item add bumps Project.version from 1 to 2, a second add carrying the previously observed version 1 is rejected with 412 ERR_STALE_VERSION before any state or business check runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Verified teacher; DRAFT project at version 2 (one item already added); a second catalog item exists."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - call: "POST /giving/vendors/${v1}/catalog-items"
              payload: { sku: "SM-PENCIL-1", name: "Pencil Box", category: "SUPPLIES", subject_tags: [], unit_price_cents: 300, weight_oz: 4, shipping_zone: "A" }
              as: PlatformAdmin
              captures: { i2: $.data.id }
            - *k_project
            - *k_add
          trigger:
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i2}", quantity: 1, expected_project_version: "${p_v}" }
              as: Teacher
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION — ${p_v} is 1 but the project advanced to version 2 with the first add"
            - "GET /giving/project-items?project_id=${p1} still returns exactly 1 row"

      - name: vet_by_screening_reviewer_violates_segregation
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.Project.fields.screened_by_id
        distinguishing_aspect: "The reviewer whose X-User-ID screened the project cannot also vet it (segregation of duties); the same VET payload from a different reviewer succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Project in VETTING, screened_by_id == rev-ana."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
          trigger:
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
              captures: { err: $.data.error_id }
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (409) — rev-ana screened and may not vet"
            - "st == FUNDING when rev-ben (a different reviewer) vets"
            - "Project.${p1}.vetted_by_id == \"rev-ben\" and screened_by_id == \"rev-ana\""

      - name: equity_allocate_with_empty_pool_returns_no_eligible_project
        claim_type: Violation → Error
        grounds:
          - calculations.equity_allocation_selector
          - validations[priority=26]
          - errors.ERR_NO_ELIGIBLE_PROJECT
        distinguishing_aspect: "The selector's empty-pool fallback: a fund whose state_code matches no FUNDING project (NV fund, TX project) returns ERR_NO_ELIGIBLE_PROJECT and leaves fund remaining_cents untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One FUNDING project in TX; an ACTIVE NV equity fund (window [2026-09-01, 2026-12-31], budget 50000, min_poverty_pct 50.0)."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - call: "POST /giving/equity-funds"
              payload: { name: "Nevada Equity Fund", state_code: "NV", min_poverty_pct: 50.0, budget_cents: 50000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /giving/equity-funds/${f1}/allocate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_ELIGIBLE_PROJECT (422) — the TX project is outside the NV fund's state scope"
            - "EquityFund.${f1}.remaining_cents == 50000 unchanged and status == ACTIVE"
            - "Project.${p1}.status == FUNDING and funded_cents == 0"

      - name: allocate_before_window_returns_equity_window_closed
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_EQUITY_WINDOW_CLOSED
        distinguishing_aspect: "The closed-interval window is checked before the selector runs: allocating at 2026-09-01 from a fund whose window starts 2027-01-01 is ERR_EQUITY_WINDOW_CLOSED even though an eligible project exists."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One FUNDING project in TX; a TX equity fund with FUTURE window [2027-01-01, 2027-06-30], budget 50000, min_poverty_pct 75.0."
          setup_api_calls:
