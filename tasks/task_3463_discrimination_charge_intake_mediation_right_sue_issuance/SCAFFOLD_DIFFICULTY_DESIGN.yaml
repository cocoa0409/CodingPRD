              as: PlatformAdmin
          trigger:
            - call: "POST /eeoc/determinations/${det_k}/review"
              payload: { decision: "APPROVE" }
              as: Director
              as_user_id: "dir-004"
              captures: { det_k_status: $.data.status }
            - call: "GET /eeoc/charges/${chg_k}"
              as: Director
              captures: { chg_k_status: $.data.case_status }
            - call: "GET /eeoc/charges/${chg_k}/conciliation-processes"
