              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { a_proposed: "$.data.id", st_proposed: "$.data.status" }
            - call: "POST /partner-allocations"
              payload: { outsource_partner_id: "${p1_id}", interval_plan_id: "${ip0_id}", allocated_volume: 20 }
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { a_revoked: "$.data.id" }
            - call: "POST /partner-allocations/${a_revoked}/revoke"
              payload: {}
              as: SourcingManager
              as_user_id: "u-src-1"
              captures: { st_revoked: "$.data.status" }
          trigger:
            - call: "POST /partner-allocations/${a_proposed}/settle"
              payload: { delivered_volume: 20 }
              as: SourcingManager
              as_user_id: "u-src-2"
              captures: { err_proposed: "$.data.error_id" }
            - call: "POST /partner-allocations/${a_revoked}/settle"
