            - "the ${g2_id} submit succeeds even though max_concurrent_group_deliveries is 1, because [12:00,12:30) and [12:30,13:00) do not intersect"
            - "the ${g3_id} submit returns 409 with error_id ERR_RESTAURANT_CAPACITY_EXCEEDED"
