            - "trigger call 2 -> 200 with status \"REVOKED\" and effective_end_actual == \"2026-08-01T00:00:00Z\""
            - "Talent.${t_id}.open_removal_obligation_count == 0 and rights_posture == \"CLEAR\" after both calls — neither grant had a license, so the revoke cascade opened nothing"
            - "GET /consent-grants?talent_id=${t_id}&status=ACTIVE returns total_count == 1, the locked grant"

      - name: compliance_sweep_processes_many_rows_with_skip_semantics
        claim_type: bulk_action
        excluded_because:
          difficulty_instance: removal_deadline_day_boundary_in_sweep_phase_three
          rationale: >-
            POST /compliance-sweeps is the only many-row endpoint, and its partial-progress contract
            (LEGAL_HOLD assets skipped, unaffected rows untouched, a second sweep at the same clock a
            no-op) is asserted in §1.8 while driving phase 3 across the strict removal deadline.

  - section: errors
