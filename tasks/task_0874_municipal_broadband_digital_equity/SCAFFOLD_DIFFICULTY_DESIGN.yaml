      - name: outage_buffer_overlap_closed
        grounds:
          - validations[priority=8]
          - entities.OutageEvent.fields.started_at
          - state_machines.OutageEvent.OPEN_to_RESOLVED
        distinguishing_aspect: "Resource=ServiceArea, closed interval plus a 60-minute buffer: a second outage starting 30 minutes after an OPEN outage on the same area collides and is rejected ERR_OUTAGE_OVERLAP (differs from the technician half-open adjacency semantics)."
        test_recipe:
          setup:
            - "SERVICEABLE area with an OPEN outage started at 2026-06-01T00:00Z."
          setup_api_calls:
            - { call: "POST /grants", payload: { funding_source: "BEAD", program_name: "Metro BEAD", award_amount_cents: 100000000, match_required_pct: 25, take_rate_milestone_pct: 40 }, as: ProgramAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /service-areas", payload: { grant_id: "${g_id}", name: "Area 1", census_block_group: "010010001001", homes_passed: 100, fiber_ready: true }, as: ProgramAdmin, captures: { a_id: "$.data.id" } }
