      - name: calc_hcu_constants_efficiency_and_face_value_cap_use_different_bases
        claim_type: constants_applied
        grounds:
          - calculations.hcu_transferable_volume
          - calculations.hcu_transferable_volume.constants
        distinguishing_aspect: >-
          DITCH_EFFICIENCY (0.65) multiplies REPORTED diversion while
          FACE_VALUE_CAP_FACTOR (also 0.65) multiplies the AUTHORIZED face value —
          two constants of equal magnitude applied to different bases. A right
          that over-diverts proves they are not interchangeable: the efficiency
          leg yields 455.000 AF and the cap clamps the answer to 260.000.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z. Right authorized at 400.00 AF but reporting 700.000 AF of metered diversion in each of 2023, 2024 and 2025 (three qualifying years, so no short-history haircut)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-005", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 700.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 700.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 700.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
          trigger:
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "GET /hcu-studies/${st}", as: WaterRightsAnalyst}
          assert:
            - "qualifying_year_count 3 and short_history_haircut_applied false."
            - "The efficiency leg gives round(700.000 * 0.65, 3) == 455.000 AF per year, averaging to 455.000."
            - "The face-value cap is round(400.00 * 0.65, 3) == 260.000 — computed from authorized_diversion_af, NOT from the reported figure."
            - "certified_hcu_af 260.00 (the cap binds); 455.00 and 260.00-derived-from-700 must NOT appear."
            - "The right's transferable_af becomes 260.00 and certified_hcu_af 260.00, so the ledger identity 260.00 == 260.00 + 0.00 + 0.00 holds at certification."

      - name: calc_bank_posture_low_credit_floor_is_strict_below_five_af
        claim_type: constants_applied
        grounds:
          - calculations.bank_posture
          - calculations.bank_posture.precision
          - entities.WaterBankAccount.posture
        distinguishing_aspect: >-
          The floor is a strict `<`, so available_credit_af == 5.00 is still OPEN
          and 4.99 is RESTRICTED — and the boundary is crossed by committing one
          hundredth of an acre-foot on a second lease, with no change of standing,
          no suspension and no deposit in between. A brand-new zero-credit account
          is RESTRICTED for the same reason.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A IN_GOOD_STANDING; bank-enrolled right with a 5.000 cfs headgate, certified at 195.00 AF and activated (so the point of diversion is AUTHORIZED)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, bank_enrolled: true}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/points-of-diversion", payload: {legal_description: "NE1/4 SW1/4 Sec 12 T3N R5E", stream_reach_code: "SNK-14-A", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.40}, as: WaterRightsAnalyst, captures: {pod: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acct: "$.data.id", acct_v1: "$.data.version"}}
          trigger:
            - {call: "GET /water-bank-accounts/${acct}", as: WaterRightsAnalyst}
            - {call: "POST /water-bank-accounts/${acct}/deposits", payload: {water_right_id: "${wr}", deposit_af: 25.00, expected_water_bank_account_version: "${acct_v1}"}, as: WaterRightsAnalyst}
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acct}", water_right_id: "${wr}", point_of_diversion_id: "${pod}", lessee_name: "Harlan Feedlot", lease_start_date: "2026-04-01T00:00:00Z", lease_end_date: "2026-07-01T00:00:00Z", requested_af: 20.00, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 30.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {ls1: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acct}", as: WaterRightsAnalyst}
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acct}", water_right_id: "${wr}", point_of_diversion_id: "${pod}", lessee_name: "Harlan Feedlot", lease_start_date: "2026-07-01T00:00:00Z", lease_end_date: "2026-08-01T00:00:00Z", requested_af: 0.01, diversion_rate_cfs: 1.000, rental_rate_usd_per_af: 30.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {ls2: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acct}", as: WaterRightsAnalyst}
