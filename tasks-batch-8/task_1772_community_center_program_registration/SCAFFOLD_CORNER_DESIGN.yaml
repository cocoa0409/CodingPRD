        test_recipe:
          setup: ["Season PUBLISHED; session capacity 1, fees 5000/5000, enrollment_check_at 2026-09-08 (after the test's clock, so the sweep's enrollment-check step skips it); RA (HA) ENROLLED+PAID; RB (HB) and RC (HC) WAITLISTED; RA dropped at 2026-08-17 -> RB promoted with due 2026-08-19T00:00:00Z; clock advanced to 2026-08-19T00:00:01Z; RB never paid"]
