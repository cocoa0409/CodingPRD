        distinguishing_aspect: "A donor with status BLOCKED makes POST /api/donations fail with HTTP 409 ERR_DONOR_BLOCKED and leaves donation_count at 0."
        test_recipe:
          setup:
            - "donor dblk is BLOCKED and charity c1 is ACTIVE"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000030", state_code: "CA" }
