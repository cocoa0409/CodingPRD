        grounds:
          - validations.priority_45_ERR_CHAIR_TIME_CONFLICT
          - entities.InfusionChair.fields.turnover_buffer_minutes
          - entities.Drug.fields.admin_time_minutes
          - endpoints.POST_infusion_appointments
        distinguishing_aspect: |
          Resource entity: InfusionChair. Interval semantics: the occupancy interval is EXTENDED
          by the chair's turnover_buffer_minutes and compared as a CLOSED-start / exclusive-end
          block — a 150-minute infusion starting at 09:00 runs to 11:30 and blocks the chair
          through 12:00, so an 11:45 start is refused while a start exactly at 12:00 is accepted.
          The buffer is the chair's property, not the drug's, so the same drug on a zero-buffer
