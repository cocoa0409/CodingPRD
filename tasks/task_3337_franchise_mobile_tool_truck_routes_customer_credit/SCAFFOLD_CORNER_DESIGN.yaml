  # ===========================================================================
  # section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: occ_stale_version_on_sales_order_confirm
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[sale-confirm-stale-order]", "errors[ERR_STALE_VERSION]", entities.SalesOrder.fields.version]
        distinguishing_aspect: "A CONFIRM carrying the version the client read before an intervening PATCH is refused with ERR_STALE_VERSION 412 even though the order is still DRAFT and the sequential request would otherwise succeed — the loser is detected by the stale number, not by a state field."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; approved account A1 (limit 50000); product P1; a 1 x P1 DRAFT order; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/shop-locations/${s1_id}/credit-applications", payload: { technician_id: "${t_id}", requested_limit_cents: 50000, requested_kind: REVOLVING, employment_verified: true, months_in_trade: 100, prior_delinquency_count: 0, decision_source: FRANCHISEE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_id: "$.data.id" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/status", payload: { action: APPROVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { ap1_ver: "$.data.version" } }
            - { call: "POST /retail/credit-applications/${ap1_id}/accounts", payload: { expected_application_version: "${ap1_ver}" }, as: CreditOfficer, captures: { a1_id: "$.data.id" } }
            - { call: "POST /retail/products", payload: { sku: P1, product_name: "Torque Wrench", category: POWER_TOOLS, unit_cost_cents: 12000, retail_price_cents: 15000, default_warranty_months: 12, is_new_launch: false }, as: PlatformAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/inventory-positions", payload: { product_id: "${p1_id}", on_hand_qty: 10 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /retail/routes/${r1_id}/sales-orders", payload: { technician_id: "${t_id}", credit_account_id: "${a1_id}", mix_profile: DIAGNOSTIC_WEIGHTED, lines: [{ product_id: "${p1_id}", quantity: 1, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_id: "$.data.id", o_ver_read: "$.data.version" } }
          trigger:
            - { call: "PATCH /retail/sales-orders/${o_id}", payload: { lines: [{ product_id: "${p1_id}", quantity: 2, unit_price_cents: 15000, warranty_terms: { type: FORCE1000, months: 12 } }] }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_ver_advanced: "$.data.version", o_gross_now: "$.data.gross_total_cents" } }
            - { call: "POST /retail/sales-orders/${o_id}/status", payload: { action: CONFIRM, expected_sales_order_version: "${o_ver_read}" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { stale_error: "$.data.error_id" } }
            - { call: "POST /retail/sales-orders/${o_id}/status", payload: { action: CONFIRM, expected_sales_order_version: "${o_ver_advanced}" }, as: RouteSalesRep, as_user_id: "${f_id}", captures: { o_confirmed: "$.data.order_status" } }
          assert:
            - "the version the client first read was ${o_ver_read} and the PATCH advanced it to ${o_ver_advanced}"
            - "the CONFIRM carrying the stale ${o_ver_read} captures ${stale_error} == ERR_STALE_VERSION with http 412"
            - "the order remains DRAFT after the stale refusal, and only the stale version was rejected"
            - "the CONFIRM carrying ${o_ver_advanced} then succeeds with order_status CONFIRMED"
            - "SalesOrder.${o_id}.gross_total_cents == 30226 after the PATCH"

      - name: occ_stale_version_on_credit_account_mint
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[account-mint-stale-application]", "errors[ERR_STALE_VERSION]", entities.CreditApplication.fields.version]
        distinguishing_aspect: "Minting a second account from the same APPROVED application is rejected when the client's expected_application_version predates an earlier mint: the application is still APPROVED, so only the stale version distinguishes the legitimate re-mint from the out-of-date view."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; shop S1; technician T; an APPROVED FRANCHISEE-sourced REVOLVING application"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
