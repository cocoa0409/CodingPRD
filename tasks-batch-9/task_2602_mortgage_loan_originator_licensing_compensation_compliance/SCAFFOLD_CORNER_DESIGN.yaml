          - errors[ERR_COURSE_PROVIDER_RESCINDED]
          - entities.CeCourse.fields.provider_status
        distinguishing_aspect: |
          Both courses have approved_state_codes [] (accepted everywhere), so priority 27 is
          out of play and the only difference is provider standing: filing a credit against the
          RESCINDED course returns 422 ERR_COURSE_PROVIDER_RESCINDED while the identical filing
          against the APPROVED course is accepted with credit_status APPLIED.
        test_recipe:
          setup:
            - "Originator 2200001 (no licence needed - approved_state_codes is empty on both
               courses)."
