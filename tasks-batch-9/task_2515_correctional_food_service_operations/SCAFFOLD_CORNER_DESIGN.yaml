              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { religious_order: $.data.id }
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
