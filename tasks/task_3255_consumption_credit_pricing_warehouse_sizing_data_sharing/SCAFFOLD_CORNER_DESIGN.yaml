  - section: errors
    instances:
      - name: error_drawdown_amount_range_above_single_drawdown_ceiling
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DRAWDOWN_AMOUNT_RANGE]
          - validations[priority=13]
        distinguishing_aspect: "The single-drawdown ceiling is 1000 credits and is checked at the range layer, so an over-ceiling amount never reaches the allowance waterfall."
        test_recipe:
          setup: ["one ACTIVE contract with base 1000 and a warehouse"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Err Amount", account_locator: "ea4001", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ea: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_ea}", name: "WH_EA", size: "SMALL" }
              as: DataEngineer
              captures: { wh_ea: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_ea}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_ea: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_ea}/activate"
              payload: {}
              as: FinanceController
            - call: "GET /v1/capacity-contracts/${ct_ea}"
              payload: {}
              as: FinanceController
              captures: { ct_ea_v: $.data.version }
          trigger:
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_ea}", warehouse_id: "${wh_ea}", amount_credits: 1001, source_kind: "SESSION", idempotency_key: "ea-big", expected_contract_version: "${ct_ea_v}" }
              as: DataEngineer
              captures: { err_ea: $.data.error_id }
          assert:
            - "${err_ea} == ERR_DRAWDOWN_AMOUNT_RANGE"
            - "CapacityContract.${ct_ea}.drawn_credits == 0.0"
      - name: error_cluster_range_is_a_400_not_a_state_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLUSTER_RANGE]
          - entities.VirtualWarehouse.fields.clusters_max
        distinguishing_aspect: "The cluster bounds are a field-shape constraint, so clusters_min above clusters_max on a PATCH of a running warehouse returns 400 rather than the 409 the state layer would use."
        test_recipe:
          setup: ["one running warehouse with clusters_min 1 and clusters_max 3"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Err Cluster", account_locator: "ec4002", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ec: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_ec}", name: "WH_EC", size: "LARGE", clusters_min: 1, clusters_max: 3 }
              as: DataEngineer
              captures: { wh_ec: $.data.id }
            - call: "POST /v1/warehouses/${wh_ec}/resume"
              payload: {}
              as: DataEngineer
          trigger:
            - call: "PATCH /v1/warehouses/${wh_ec}"
              payload: { clusters_min: 5, clusters_max: 2 }
              as: DataEngineer
              captures: { err_ec: $.data.error_id }
          assert:
            - "${err_ec} == ERR_CLUSTER_RANGE"
            - "VirtualWarehouse.${wh_ec}.clusters_min == 1 and clusters_max == 3, unchanged by the rejected patch"
      - name: error_auto_suspend_range_below_floor
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AUTO_SUSPEND_RANGE]
          - entities.VirtualWarehouse.fields.auto_suspend_seconds
        distinguishing_aspect: "auto_suspend_seconds below 60 is a dedicated range error, distinct from the min-greater-than-max cluster error and from the generic request error."
        test_recipe:
          setup: ["one account"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Err Suspend", account_locator: "es4003", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_es2: $.data.id }
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_es2}", name: "WH_ES2", size: "SMALL", auto_suspend_seconds: 30 }
              as: DataEngineer
              captures: { err_es2: $.data.error_id }
          assert:
            - "${err_es2} == ERR_AUTO_SUSPEND_RANGE"
            - "auto_suspend_seconds of exactly 60 is accepted, which is the inclusive floor of the same range"
            - "auto_suspend_seconds of 3601 raises the same error, which is the inclusive ceiling boundary"
      - name: error_storage_days_range_on_time_travel_window
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STORAGE_DAYS_RANGE]
          - entities.StorageUsageRecord.fields.time_travel_days
        distinguishing_aspect: "The time-travel window is bounded at 90 days by a dedicated range error, and the fail-safe window is not client-settable at all."
        test_recipe:
          setup: ["one account"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Err Storage", account_locator: "es4004", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_es3: $.data.id }
          trigger:
            - call: "POST /v1/storage-usage-records"
              payload: { account_id: "${acct_es3}", usage_date: "2026-09-09T00:00:00Z", active_tb: 1.0, time_travel_tb: 1.0, fail_safe_tb: 1.0, time_travel_days: 91 }
              as: DataEngineer
              captures: { err_es3: $.data.error_id }
          assert:
            - "${err_es3} == ERR_STORAGE_DAYS_RANGE"
            - "time_travel_days of exactly 90 is accepted, which is the inclusive ceiling"
            - "the accepted row reports fail_safe_days 7 because that window is fixed and not settable"
      - name: error_listing_not_published_before_withdraw
