      - name: chronological_out_of_order_events_still_prorate_identically
        claim_type: Correct Result
        grounds:
          - calculations.participant_prorated_target
          - entities.EligibilityEvent
          - endpoints."POST /bonus-plans/{planId}/target-assignments"
        distinguishing_aspect: |
          The later TRANSFER (2026-07-01) is recorded BEFORE the earlier
          unpaid LEAVE (2026-03-01..2026-05-31), so an implementation that
          folds events in insertion order sees the leave landing inside an
          already-closed L5 segment and mis-splits the year. Sorting by
          effective_date first yields the same 119-day L3 segment (326,027)
          and 184-day L5 segment (2,016,438) as chronological entry, total
          2,342,465 with credited_days 303 (92-day leave, 30 credited,
          62 excluded).
        test_recipe:
          setup:
            - "One unit with a certified pool, plan with L3 10.00% and L5 20.00% target rows, metric at target (multiplier 1.0000)."
            - "One participant hired 2025-06-01 as L3 at 10,000,000."
