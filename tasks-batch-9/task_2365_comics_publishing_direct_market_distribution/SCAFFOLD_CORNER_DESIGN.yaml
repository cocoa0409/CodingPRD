  - name: cascading_validation_body_reference_existence_runs_before_the_variant_availability_check
    claim_type: cascading_validation
    grounds: [validations.priority_5, validations.priority_24, 'errors[ERR_ISSUE_NOT_FOUND]', 'errors[ERR_VARIANT_NOT_AVAILABLE]']
    distinguishing_aspect: The priority-24 exclusive-cover check cannot run until priority 5 has resolved
      the issue_id, so an unknown issue with exclusive_variant_qty 5 returns 404 ERR_ISSUE_NOT_FOUND,
      and only once the issue resolves does the same body earn 422 ERR_VARIANT_NOT_AVAILABLE.
    test_recipe:
