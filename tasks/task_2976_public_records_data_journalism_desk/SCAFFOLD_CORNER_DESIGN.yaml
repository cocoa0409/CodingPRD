  - section: validations
    instances:
      - name: clarification_round_is_permitted_only_when_the_agency_allows_tolling
        claim_type: conditional
        grounds:
          - validations[priority=115]
          - entities.Agency.fields.tolling_allowed
          - state_machines.RecordsRequest.AWAITING_AGENCY_RESPONSE_to_CLARIFICATION_REQUESTED
        distinguishing_aspect: |
          The rule is conditional on a flag that lives on a different entity from the one being mutated:
          two RecordsRequests in the identical state receive the identical clarification payload, and the
          only difference is Agency.tolling_allowed. The refusal must leave clarification_round_count at
          0 and the status at AWAITING_AGENCY_RESPONSE, and the permitted round must leave both deadline
          fields untouched, because tolling is applied when the round CLOSES, not when it opens.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. One Desk."
            - "Agency no-toll: tolling_allowed false, BUSINESS_DAYS, initial_response_days 10."
            - "Agency toll-ok: identical except tolling_allowed true."
            - "One submitted RecordsRequest against each, both in AWAITING_AGENCY_RESPONSE with due_at_strict 2026-08-17T23:59:59.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 1095 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "No Tolling Board", jurisdiction_code: "CA-NOTL", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 15, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_notoll_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "Tolling Board", jurisdiction_code: "CA-TOLL", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "INTERNAL", appeal_decision_days: 15, search_fee_cents_per_hour: 3500, page_fee_cents: 25, max_waiver_cents: 10000 }
              as: RecordsCoordinator
              captures: { agency_toll_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v1: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_notoll_id}", subject_summary: "Tolling probe A", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v1}" }
              as: RecordsCoordinator
              captures: { req_notoll_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_notoll_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v2: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_toll_id}", subject_summary: "Tolling probe B", requested_format: "CSV", estimated_page_count: 10, waiver_requested: false, public_interest_score: 10, expected_desk_version: "${desk_v2}" }
              as: RecordsCoordinator
              captures: { req_toll_id: $.data.id }
