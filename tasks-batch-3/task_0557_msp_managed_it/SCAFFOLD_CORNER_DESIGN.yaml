              captures: { cid: $.data.id }
            - call: "POST /procurement-orders"
              payload: { client_id: "${cid}", line_items: [ { description: "laptop", unit_price_cents: 50000, qty: 1 } ] }
              as: AccountManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /procurement-orders/${oid}/place"
              payload: {}
              as: AccountManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_CREDIT_LIMIT_EXCEEDED; HTTP 402"]

      - name: place_order_unaccepted_quote_standalone_returns_409
        claim_type: Cross-entity validation
        grounds: ["validations[priority=6]", "errors[ERR_QUOTE_NOT_ACCEPTED]"]
        distinguishing_aspect: "With ample credit, placing an order linked to a SENT (not ACCEPTED) quote -> ERR_QUOTE_NOT_ACCEPTED (isolates the referential check from the fiscal one)."
        test_recipe:
          setup: ["Client credit_limit 10_000_000; PROCUREMENT quote SENT (not accepted); order linked, total 54000."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Sig", primary_contact_email: "s@sig.test", credit_limit_cents: 10000000 }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /quotes"
              payload: { client_id: "${cid}", quote_type: "PROCUREMENT", title: "hw", line_items: [ { description: "laptop", unit_price_cents: 50000, qty: 1 } ], valid_until: "2026-12-31T00:00:00Z" }
              as: AccountManager
              captures: { qid: $.data.id }
            - call: "POST /quotes/${qid}/send"
              payload: {}
              as: AccountManager
            - call: "POST /procurement-orders"
              payload: { client_id: "${cid}", quote_id: "${qid}", line_items: [ { description: "laptop", unit_price_cents: 50000, qty: 1 } ] }
              as: AccountManager
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /procurement-orders/${oid}/place"
              payload: {}
              as: AccountManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_QUOTE_NOT_ACCEPTED; HTTP 409"]

