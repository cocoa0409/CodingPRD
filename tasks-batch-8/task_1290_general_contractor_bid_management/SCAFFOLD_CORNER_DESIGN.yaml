  - section: validations
    instances:
      - name: missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Priority 1: a request without X-User-ID / X-User-Role is rejected before any role, existence, or business check (the test harness omits both headers on this call)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /bid-packages"
              payload: { name: "No Auth Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { err: $.data.error_id }
          assert:
            - "Harness omits X-User-ID and X-User-Role on the trigger call: HTTP 400, err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: role_check_precedes_existence_returns_403
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Priority 2 before 3: a Subcontractor calling the LeadEstimator-only publish endpoint on a NON-EXISTENT package gets ERR_FORBIDDEN_ROLE, not 404 — role gates fire before any id lookup."
        test_recipe:
          setup: ["One registered subcontractor"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "RoleFirst LLC", contact_email: "rf@x.com", license_number: "LIC-R-4001" }
              as: Anonymous
              captures: { sub_r: $.data.id }
          trigger:
            - call: "POST /bid-packages/00000000-0000-0000-0000-0000000000aa/publish"
              as: Subcontractor
              as_user_id: "${sub_r}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403, err == ERR_FORBIDDEN_ROLE (role priority 2 beats existence priority 3)"

      - name: ownership_check_precedes_state_check
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "Priority 4 before 5: sub A revising sub B's WITHDRAWN bid gets ERR_FORBIDDEN_OWNERSHIP — the ownership failure wins over the terminal-state failure."
        test_recipe:
          setup: ["Package PUBLISHED; subs A and B prequalified + BIDDING; B's bid submitted then withdrawn (terminal)"]
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "A Own LLC", contact_email: "ao@x.com", license_number: "LIC-A-4002" }
              as: Anonymous
              captures: { sub_a: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "B Own LLC", contact_email: "bo@x.com", license_number: "LIC-B-4002" }
              as: Anonymous
              captures: { sub_b: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_b}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_b}"
              captures: { app_b: $.data.id }
            - call: "POST /prequal-applications/${app_b}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Ownership Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_b}" }
              as: LeadEstimator
              captures: { inv_b: $.data.id }
            - call: "POST /invitations/${inv_b}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_b}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_b}"
              captures: { bid_b: $.data.id, bid_b_v1: $.data.version }
            - call: "POST /bids/${bid_b}/withdraw"
              as: Subcontractor
              as_user_id: "${sub_b}"
          trigger:
            - call: "POST /bids/${bid_b}/revisions"
              payload: { new_base_bid_cents: 900000, expected_bid_version: "${bid_b_v1}" }
              as: Subcontractor
              as_user_id: "${sub_a}"
              captures: { err: $.data.error_id }
          assert:
