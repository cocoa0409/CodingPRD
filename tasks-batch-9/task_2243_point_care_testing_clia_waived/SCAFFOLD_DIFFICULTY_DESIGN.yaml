              as: LabDirector
              as_user_id: "${op_dir_id}"
          assert:
            - "${first_outcome} == FAIL and ${first_status} == INVESTIGATION_OPEN (not UNSUCCESSFUL_LOCKED)"
            - "${cycle_status} == INVESTIGATION_OPEN and ${cycle_round} == 1"
            - "${round2} == 2"
            - "ProficiencyEvent.${ev_id}.status == INVESTIGATION_ACCEPTED and ProficiencyEvent.${ev_id}.investigation_round == 2"
            - "ProficiencyEnrollment.${enr_id}.status == ENROLLED and ProficiencyEnrollment.${enr_id}.fail_count_last_three == 1"
            - "ProficiencyEnrollment.${enr_id}.graded_event_count == 1"
            - "TestSite.${site_id}.pt_unsuccessful_count == 0"
            - "TestSite.${site_id}.inspection_readiness_score == 100.00 (pt_penalty back to 0.00 from 3.00)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: qc_failure_holds_results_restricts_site_and_suspends_manual_entry
        grounds:
          - calculations.qc_run_result
          - state_machines.Device.ACTIVE_to_QC_LOCKED_on_qc_fail
          - state_machines.TestResult.PENDING_REVIEW_to_HELD
          - calculations.site_oversight_posture
          - entities.Device.fields.manual_entry_suspended
        distinguishing_aspect: |
          One out-of-range QC run drives a four-hop chain in a single request:
          QcRun -> FAIL, Device D1 -> QC_LOCKED(QC_OUT_OF_RANGE), all three of
          D1's PENDING_REVIEW results -> HELD (held_result_count 3), site
          posture -> RESTRICTED, and that posture in turn sets
          manual_entry_suspended on the unrelated MANUAL_ENTRY device D2 while
          D2's own status stays ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One WAIVED site with ACTIVE waiver coverage and one trained operator."
            - "Device D1: GlucoMeter-X, INTERFACED, qc_frequency_days 30. Device D2: StripReader-Z, MANUAL_ENTRY, qc_frequency_days 30."
            - "One reagent lot VERIFIED for GlucoMeter-X with LEVEL_1 range 80.0..120.0 and LEVEL_2 range 250.0..350.0."
            - "Three patient results captured on D1, all left in PENDING_REVIEW."
          setup_api_calls:
            - call: "POST /poct/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /poct/certificates"
              payload: { certificate_number: "45D2243009", certificate_type: "CERTIFICATE_OF_WAIVER", permitted_complexity: "WAIVED", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ProgramAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /poct/sites"
              payload: { name: "Dialysis POCT", department_code: "DEPT-180", complexity_scope: "WAIVED" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /poct/certificate-coverages"
              payload: { site_id: "${site_id}", certificate_id: "${cert_id}", coverage_start: "2026-01-01", coverage_end: "2027-12-31" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
