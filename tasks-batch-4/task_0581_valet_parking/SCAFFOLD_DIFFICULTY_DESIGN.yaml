scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: parking_fee_quoted_vs_final_on_ticket
        grounds:
          - calculations.parking_fee
          - entities.Ticket.fields.quoted_fee_cents
          - entities.Ticket.fields.final_fee_cents
          - state_machines.Ticket.PARKED_to_CLOSED
        distinguishing_aspect: |
          On the Ticket domain, the quoted variant uses estimated_departure_at (120 min -> 2100)
          while the final variant uses actual checkout_at (150 min -> 2900); identical ticket, two
          algorithms, divergent cents.
        test_recipe:
          setup:
            - "Venue + ACTIVE event (default rates: grace 15, hourly 800, daily_max 2500, surcharge 500)."
            - "One lot capacity 5; one attendant; one ticket checked in at 10:00 estimating 12:00 departure, actually checked out 12:30."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Grand Hall", address: "1 Main St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "Gala", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "ABC1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id, quoted: $.data.quoted_fee_cents }
          trigger:
            - call: "POST /valet/tickets/${ticket_id}/checkout"
              payload: { checkout_at: "2026-06-01T12:30:00Z" }
              as: Cashier
              captures: { final: $.data.final_fee_cents }
          assert:
            - "Ticket.${ticket_id}.quoted_fee_cents == 2100"
            - "Ticket.${ticket_id}.final_fee_cents == 2900"
            - "Ticket.${ticket_id}.quoted_fee_cents != Ticket.${ticket_id}.final_fee_cents"

      - name: tip_split_weighted_vs_equal_on_shift
        grounds:
          - calculations.tip_pool_distribution
          - entities.Shift.fields.allocated_tip_cents
          - entities.Event.fields.tip_split_mode
          - state_machines.Event.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          On the Shift domain, WEIGHTED distribution of a 1501-cent pool over shifts of 4h/6h yields
          (601, 900), whereas EQUAL over the same pool yields (751, 750) — a different algorithm on the
          same inputs produces different Shift allocations.
        test_recipe:
          setup:
            - "ACTIVE event with tip_split_mode WEIGHTED; two attendants each with one shift on the event (4h and 6h)."
            - "Shift s1 declares 700 tips, shift s2 declares 801 tips (pool 1501). No tickets outstanding."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Arena", address: "9 Center Rd" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "Concert", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z", tip_split_mode: "WEIGHTED" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "A1" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "A2" }
              as: Supervisor
              captures: { a2_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", event_id: "${event_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Supervisor
              captures: { s1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a2_id}", event_id: "${event_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T14:00:00Z" }
              as: Supervisor
              captures: { s2_id: $.data.id }
            - call: "POST /valet/shifts/${s1_id}/tips"
              payload: { declared_tips_cents: 700 }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/shifts/${s2_id}/tips"
              payload: { declared_tips_cents: 801 }
              as: Attendant
              as_user_id: "${a2_id}"
          trigger:
            - call: "POST /valet/events/${event_id}/close"
              payload: {}
              as: Supervisor
          assert:
            - "Shift.${s1_id}.allocated_tip_cents == 601"
            - "Shift.${s2_id}.allocated_tip_cents == 900"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_fee_daily_cap_then_surcharge_mode_a
        grounds:
          - calculations.parking_fee
          - entities.Event.fields.daily_max_cents
          - entities.Event.fields.event_surcharge_cents
          - state_machines.Ticket.PARKED_to_CLOSED
        distinguishing_aspect: |
          Mode (a): the final fee nests min() over 4 inputs — hours(=ceil(210/60)=4) * hourly(800)=3200
          is capped by daily_max(2500), THEN the flat surcharge(500) is added AFTER the cap -> 3000, not
          3700 and not 2500.
        test_recipe:
          setup:
            - "ACTIVE default-rate event; ticket parked 3h30m (210 min) so the metered component exceeds the daily cap."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Cap Venue", address: "2 Oak Ave" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "LongPark", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ben" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "CAP1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T13:30:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /valet/tickets/${ticket_id}/checkout"
              payload: { checkout_at: "2026-06-01T13:30:00Z" }
              as: Cashier
          assert:
            - "Ticket.${ticket_id}.final_fee_cents == 3000"

      - name: tip_remainder_floor_then_created_at_mode_b
        grounds:
          - calculations.tip_pool_distribution
          - entities.Shift.fields.allocated_tip_cents
          - state_machines.Event.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Mode (b): the 1501-cent pool split EQUAL over 2 shifts floors each share to 750 then hands the
          single leftover cent to the earliest-created shift (created_at ASC) -> (751, 750); a sum-then-round
          scheme would misplace the cent.
        test_recipe:
          setup:
            - "ACTIVE event with tip_split_mode EQUAL; two shifts declaring 700 and 801 tips (pool 1501)."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Split Venue", address: "3 Elm St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "EqualSplit", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z", tip_split_mode: "EQUAL" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "A1" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "A2" }
              as: Supervisor
              captures: { a2_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", event_id: "${event_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T12:00:00Z" }
              as: Supervisor
              captures: { s1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a2_id}", event_id: "${event_id}", start_at: "2026-06-01T08:00:00Z", end_at: "2026-06-01T14:00:00Z" }
              as: Supervisor
              captures: { s2_id: $.data.id }
            - call: "POST /valet/shifts/${s1_id}/tips"
              payload: { declared_tips_cents: 700 }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/shifts/${s2_id}/tips"
              payload: { declared_tips_cents: 801 }
              as: Attendant
              as_user_id: "${a2_id}"
          trigger:
            - call: "POST /valet/events/${event_id}/close"
              payload: {}
              as: Supervisor
          assert:
            - "Shift.${s1_id}.allocated_tip_cents == 751"
            - "Shift.${s2_id}.allocated_tip_cents == 750"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_park_and_settlement_axes_independent
        grounds:
          - state_machines.Ticket.PARKED_to_RETRIEVED
          - state_machines.Ticket.UNSETTLED_to_DISPUTED
          - entities.Ticket.fields.park_status
          - entities.Ticket.fields.settlement_status
        distinguishing_aspect: |
          Parallel axes on one Ticket: park_status advances PARKED->RETRIEVED via retrieval while
          settlement_status stays UNSETTLED, then a claim approval moves settlement UNSETTLED->DISPUTED
          without touching park_status — final state RETRIEVED x DISPUTED is unreachable in any single
          linear pipeline.
        test_recipe:
          setup:
            - "ACTIVE event, lot, attendant a1 with an ACTIVE shift; ticket checked in (PARKED/UNSETTLED)."
            - "Retrieval driven to READY (ticket RETRIEVED); then a small damage claim (500) approved."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Axis Venue", address: "4 Pine St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "AxisEvt", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", start_at: "2026-06-01T07:00:00Z", end_at: "2026-06-01T20:00:00Z" }
              as: Supervisor
              captures: { s1_id: $.data.id }
            - call: "POST /valet/shifts/${s1_id}/start"
              payload: {}
              as: Supervisor
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "AX1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/retrieval-requests"
              payload: { ticket_id: "${ticket_id}", requested_at: "2026-06-01T11:30:00Z" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /valet/retrieval-requests/${rr_id}/assign"
              payload: { attendant_id: "${a1_id}" }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/retrieval-requests/${rr_id}/stage"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/retrieval-requests/${rr_id}/ready"
              payload: { ready_at: "2026-06-01T11:45:00Z" }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/damage-claims"
              payload: { ticket_id: "${ticket_id}", description: "scratch", claimed_amount_cents: 500 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /valet/damage-claims/${claim_id}/approve"
              payload: { approved_liability_cents: 500 }
              as: Supervisor
          assert:
            - "Ticket.${ticket_id}.park_status == RETRIEVED"
            - "Ticket.${ticket_id}.settlement_status == DISPUTED"
            - "Attendant.${a1_id}.status == ACTIVE"

      - name: retrieval_ready_to_staging_cycle
        grounds:
          - state_machines.RetrievalRequest.READY_to_STAGING
          - state_machines.RetrievalRequest.STAGING_to_READY
          - entities.RetrievalRequest.fields.status
        distinguishing_aspect: |
          Cyclic machine on RetrievalRequest: after reaching READY the revert transition returns it to
          STAGING (and the ticket to PARKED), a backward edge no linear pipeline permits; it can then be
          driven READY again.
        test_recipe:
          setup:
            - "Retrieval request for a parked ticket driven to READY, with a1 on an ACTIVE shift."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Cyc Venue", address: "5 Birch St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "CycEvt", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", start_at: "2026-06-01T07:00:00Z", end_at: "2026-06-01T20:00:00Z" }
              as: Supervisor
              captures: { s1_id: $.data.id }
            - call: "POST /valet/shifts/${s1_id}/start"
              payload: {}
              as: Supervisor
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "CY1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/retrieval-requests"
              payload: { ticket_id: "${ticket_id}", requested_at: "2026-06-01T11:30:00Z" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /valet/retrieval-requests/${rr_id}/assign"
              payload: { attendant_id: "${a1_id}" }
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/retrieval-requests/${rr_id}/stage"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
            - call: "POST /valet/retrieval-requests/${rr_id}/ready"
              payload: { ready_at: "2026-06-01T11:45:00Z" }
              as: Attendant
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /valet/retrieval-requests/${rr_id}/revert"
              payload: {}
              as: Attendant
              as_user_id: "${a1_id}"
          assert:
            - "RetrievalRequest.${rr_id}.status == STAGING"
            - "Ticket.${ticket_id}.park_status == PARKED"
            - "RetrievalRequest.${rr_id}.ready_at == null"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_liability_suspends_attendant_closes_shift
        grounds:
          - state_machines.DamageClaim.OPEN_to_APPROVED
          - state_machines.Ticket.UNSETTLED_to_DISPUTED
          - entities.Attendant.fields.total_liability_cents
          - entities.Attendant.fields.status
          - entities.Shift.fields.status
        distinguishing_aspect: |
          Depth-3 chain from a single approve: DamageClaim->Ticket (settlement DISPUTED, net 0) ->
          Attendant (total_liability += 10000, crosses 10000 threshold -> INACTIVE) -> Shift (attendant's
          ACTIVE shift auto-CLOSED). Each hop is caused by the prior hop's mutation.
        test_recipe:
          setup:
            - "Ticket checked in by attendant a1 who has an ACTIVE shift s1; an OPEN damage claim of 10000 against the ticket."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Casc Venue", address: "6 Cedar St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "CascEvt", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "L1", capacity: 5 }
              as: Supervisor
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/shifts"
              payload: { attendant_id: "${a1_id}", start_at: "2026-06-01T07:00:00Z", end_at: "2026-06-01T20:00:00Z" }
              as: Supervisor
              captures: { s1_id: $.data.id }
            - call: "POST /valet/shifts/${s1_id}/start"
              payload: {}
              as: Supervisor
            - call: "POST /valet/tickets"
              payload: { event_id: "${event_id}", lot_id: "${lot_id}", attendant_id: "${a1_id}", license_plate: "CS1", key_tag: "K1", checkin_at: "2026-06-01T10:00:00Z", estimated_departure_at: "2026-06-01T12:00:00Z", expected_lot_version: "${lot_v}" }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { ticket_id: $.data.id }
            - call: "POST /valet/damage-claims"
              payload: { ticket_id: "${ticket_id}", attendant_id: "${a1_id}", description: "dented door", claimed_amount_cents: 10000 }
              as: Attendant
              as_user_id: "${a1_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /valet/damage-claims/${claim_id}/approve"
              payload: { approved_liability_cents: 10000 }
              as: Supervisor
          assert:
            - "Ticket.${ticket_id}.settlement_status == DISPUTED"
            - "Ticket.${ticket_id}.net_charge_cents == 0"
            - "Attendant.${a1_id}.total_liability_cents == 10000"
            - "Attendant.${a1_id}.status == INACTIVE"
            - "Shift.${s1_id}.status == CLOSED"

      - name: overflow_checkout_releases_primary_overflow_flag
        grounds:
          - state_machines.Ticket.PARKED_to_CLOSED
          - entities.Lot.fields.occupied_count
          - entities.Lot.fields.overflow_active
          - entities.Ticket.fields.in_overflow
        distinguishing_aspect: |
          Depth-2 chain from a checkout: Ticket->overflow Lot (occupied_count 1->0) -> primary Lot
          (overflow_active true->false when its overflow lot empties). Triggered by checkout, distinct
          from the approve-triggered chain.
        test_recipe:
          setup:
            - "Primary lot LP capacity 1 with overflow lot LO; two tickets checked into LP so t2 spills into LO (LP.overflow_active true)."
          setup_api_calls:
            - call: "POST /valet/venues"
              payload: { name: "Ov Venue", address: "7 Maple St" }
              as: Supervisor
              captures: { venue_id: $.data.id }
            - call: "POST /valet/events"
              payload: { venue_id: "${venue_id}", name: "OvEvt", window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T23:00:00Z" }
              as: Supervisor
              captures: { event_id: $.data.id }
            - call: "POST /valet/events/${event_id}/activate"
              payload: {}
              as: Supervisor
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "LO", capacity: 5, is_overflow: true }
              as: Supervisor
              captures: { lo_id: $.data.id }
            - call: "POST /valet/lots"
              payload: { venue_id: "${venue_id}", name: "LP", capacity: 1, overflow_lot_id: "${lo_id}" }
              as: Supervisor
              captures: { lp_id: $.data.id, lp_v0: $.data.version }
            - call: "POST /valet/attendants"
              payload: { venue_id: "${venue_id}", name: "Ana" }
              as: Supervisor
              captures: { a1_id: $.data.id }
            - call: "POST /valet/tickets"
