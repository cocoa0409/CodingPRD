          setup:
            - "Policy A ACTIVE (income_limit 5000000); source T [RENT] budget 5000"
            - "W1 household income 1000000 requested 30000 waitlisted 2026-08-01; W2 income 2000000 requested 20000 waitlisted 2026-08-02; W3 income 1000000 requested 20000 waitlisted 2026-08-03"
