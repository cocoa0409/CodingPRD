        claim_type: correct_result
        grounds:
          - calculations.expenditure_federal_share
          - entities.Expenditure.fields.federal_share_pct
          - entities.Expenditure.fields.approved_cents
          - endpoints[POST /cte/expenditures/{id}/certify-allowability]
        distinguishing_aspect: |
          Every row of the FEDERAL_SHARE_BY_CATEGORY table must be exercised on a line of identical gross value, so the
          only thing that can move approved_cents is the category lookup: 0.85 for EQUIPMENT, CONSUMABLE and
          ADMINISTRATION, 1.0 for PROFESSIONAL_DEVELOPMENT and 0.0 for ENTERTAINMENT (which is never certifiable and so
