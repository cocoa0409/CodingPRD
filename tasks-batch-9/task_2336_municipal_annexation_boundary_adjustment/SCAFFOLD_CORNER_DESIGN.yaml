            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_r6}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
