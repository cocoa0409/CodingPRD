            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", sign_code: "SG-EXP", promo_start_at: "2026-08-01T00:00:00Z", promo_end_at: "2026-08-02T00:00:00Z", disclosure_codes: [] }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sign_exp: $.data.id }
            - call: "POST /price-integrity/promo-signage/${sign_exp}/post"
              as: StoreManager
              as_user_id: "${sm1}"
            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", sign_code: "SG-LIVE", promo_start_at: "2026-08-01T00:00:00Z", promo_end_at: "2026-08-20T00:00:00Z", disclosure_codes: [] }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sign_live: $.data.id }
            - call: "POST /price-integrity/promo-signage/${sign_live}/post"
              as: StoreManager
              as_user_id: "${sm1}"
            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", sign_code: "SG-DRAFT", promo_start_at: "2026-08-05T00:00:00Z", promo_end_at: "2026-08-25T00:00:00Z", disclosure_codes: [] }
