      - name: double_certify_rejected
        claim_type: Violation -> Error
        grounds:
          - state_machines.HarvestLot.SUBMITTED_to_CERTIFIED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Certification is not idempotent: after a successful certify the second attempt from CERTIFIED fails 409 ERR_INVALID_STATE (no CERTIFIED -> CERTIFIED edge)."
        test_recipe:
