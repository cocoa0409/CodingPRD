          assert:
            - "all four trigger calls return 201"
            - "DemolitionContractor.${ct1}.status == ACTIVE"
            - "DemolitionContractor.${ct1}.active_work_order_count == 1 after the work order is issued"
            - "DemolitionWorkOrder.${wo1}.status == UTILITY_HOLD after the first disconnection is ordered (it was ISSUED on creation)"
            - "DemolitionWorkOrder.${wo1}.required_utility_types == [WATER, ELECTRIC, GAS, SEWER]"
            - "DemolitionWorkOrder.${wo1}.confirmed_utility_types == []"
            - "DemolitionWorkOrder.${wo1}.failed_inspection_count == 0"
            - "UtilityDisconnection.${ud_water}.status == PENDING"
            - "UtilityDisconnection.${ud_water}.failed_attempt_count == 0"
            - "UtilityDisconnection.${ud_water}.resolved_at == null"
            - "RelocationCase.${rc1}.status == OPENED"
            - "RelocationCase.${rc1}.appeal_count == 0"
            - "RelocationCase.${rc1}.total_relocation_benefit_cents == 0"
            - "RelocationCase.${rc1}.rental_assistance_end_date == null"

      - name: project_transitions_from_the_wrong_status_return_invalid_project_state
        claim_type: invalid_transition
        grounds:
          - validations.priority_24
          - state_machines.MitigationProject
