      - name: restricted_corpus_reconciles_after_create_transfer_unwind_and_retransfer
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.organization_restricted_corpus
          - entities.Organization.fields.restricted_corpus_cents
          - entities.Restructuring.fields.unresolved_restricted_fund_count
          - endpoints.GET_/restructurings/{id}/dossier
        distinguishing_aspect: "Organization.restricted_corpus_cents is a three-term aggregation over RestrictedFund rows (untransferred value, retained remainders, incoming transferred amounts), so it must be recomputed and not incrementally patched. The claim walks the full life of the source rows: correct after CREATE, correct after the source is UPDATED by a transfer, correct after that update is RETRACTED by an unwind (the scaffold has no destructive delete, so unwind is the retraction), and correct again after the transfer is REAPPLIED. The pair total 82000000 is invariant at every one of those instants, which is what distinguishes a genuine recomputation from a lucky sequence of increments."
