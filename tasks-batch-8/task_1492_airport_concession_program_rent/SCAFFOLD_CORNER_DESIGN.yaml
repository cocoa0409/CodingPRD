            - { call: "POST /concessions/violations", payload: { lease_id: "${l1}", kind: "STREET_PRICING", observed_date: "2026-08-04", overcharge_cents: 10000 }, as: ConcessionAnalyst, captures: { p2: $.data.penalty_cents } }
          assert:
            - "p1 == 5000    # floor"
            - "p2 == 20000   # 2x multiplier"

