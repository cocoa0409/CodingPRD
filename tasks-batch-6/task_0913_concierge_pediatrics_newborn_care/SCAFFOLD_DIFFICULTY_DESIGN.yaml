# =============================================================================
# Section 1.8 - Scaffold Difficulty Design (Test Targeting Index)
# concierge-pediatrics-newborn-care
# 9 rule_ids, 22 instances. Every ground resolves into SCAFFOLD.yaml 1.1-1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: service_line_split_insurance_route_vs_membership_route
        grounds:
          - calculations.service_line_financial_split
          - calculations.service_line_route_assignment
          - state_machines.ServiceLine.ROUTED_to_ADJUDICATED
          - state_machines.ServiceLine.ROUTED_to_SETTLED
          - entities.ServiceLine.fields.patient_responsibility_cents
          - entities.ServiceLine.fields.membership_covered_cents
          - entities.InsurancePolicy.fields.deductible_met_cents
        distinguishing_aspect: |
          Two ServiceLines born from the same household, the same child and the
          same ACTIVE InsurancePolicy diverge on the ServiceLine entity domain:
          the SICK_VISIT line runs the deductible-then-coinsurance waterfall and
          leaves patient_responsibility_cents == 14000 while consuming 14000 of
          the deductible, whereas the WELL_VISIT line never reads the policy at
          all and leaves patient_responsibility_cents == 0 with
          membership_covered_cents == 22000 and policy_id null.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T20:00:00Z"
            - "One PLUS plan, one physician licensed in CA and NV with panel_slot_cap 20.0"
            - "One family holding an ACTIVE InsurancePolicy with deductible_cents 50000 and coinsurance_rate 0.20, deductible_met_cents 0"
            - "One child born 2026-04-01 with an ACTIVE membership started 2026-06-01 whose June invoice of 40000 cents is PAID"
            - "One SICK_VISIT encounter and one NEWBORN_WEIGHT_CHECK encounter, both IN_PERSON in CA, both already submitted for billing by user bs-001"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA", "NV"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Nguyen", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/insurance-policies"
              payload: { family_id: "${fam_id}", carrier_name: "BlueRidge", deductible_cents: 50000, coinsurance_rate: 0.20, status: "ACTIVE" }
              as: BillingSpecialist
              captures: { pol_id: "$.data.id", pol_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Mia", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /peds/invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "POST /peds/invoices/${inv_id}/pay"
              payload: { amount_paid_cents: 40000 }
              as: BillingSpecialist
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T20:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/encounters"
              payload: { membership_id: "${mem_id}", encounter_type: "SICK_VISIT", modality: "IN_PERSON", patient_state_code: "CA", started_at: "2026-06-15T14:00:00Z" }
              as: CareCoordinator
              captures: { enc_sick_id: "$.data.id" }
            - call: "POST /peds/encounters/${enc_sick_id}/complete-clinical"
              payload: { clinical_note: "Viral URI, well appearing" }
              as: Physician
              as_user_id: "${doc_id}"
            - call: "POST /peds/encounters/${enc_sick_id}/submit-billing"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-001"
            - call: "GET /peds/service-lines"
              payload: { encounter_id: "${enc_sick_id}" }
              as: BillingSpecialist
              captures: { sl_sick_id: "$.data[0].id" }
            - call: "POST /peds/encounters"
              payload: { membership_id: "${mem_id}", encounter_type: "NEWBORN_WEIGHT_CHECK", modality: "IN_PERSON", patient_state_code: "CA", started_at: "2026-06-15T16:00:00Z" }
              as: CareCoordinator
              captures: { enc_wc_id: "$.data.id" }
            - call: "POST /peds/encounters/${enc_wc_id}/submit-billing"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-001"
            - call: "GET /peds/service-lines"
              payload: { encounter_id: "${enc_wc_id}" }
              as: BillingSpecialist
              captures: { sl_wc_id: "$.data[0].id" }
          trigger:
            - call: "POST /peds/service-lines/${sl_sick_id}/adjudicate"
              payload: { allowed_amount_cents: 14000, expected_policy_version: "${pol_v0}" }
              as: BillingSpecialist
              as_user_id: "bs-002"
              captures: { sick_patient: "$.data.patient_responsibility_cents" }
          assert:
            - "ServiceLine.${sl_sick_id}.route == BILLED_TO_INSURANCE"
            - "ServiceLine.${sl_sick_id}.service_code == SICK_VISIT"
            - "ServiceLine.${sl_sick_id}.billed_amount_cents == 18000"
            - "ServiceLine.${sl_sick_id}.allowed_amount_cents == 14000"
            - "ServiceLine.${sl_sick_id}.write_off_cents == 4000"
            - "ServiceLine.${sl_sick_id}.deductible_applied_cents == 14000"
            - "ServiceLine.${sl_sick_id}.coinsurance_cents == 0"
            - "ServiceLine.${sl_sick_id}.plan_paid_cents == 0"
            - "ServiceLine.${sl_sick_id}.patient_responsibility_cents == 14000"
            - "ServiceLine.${sl_sick_id}.membership_covered_cents == 0"
            - "ServiceLine.${sl_sick_id}.status == ADJUDICATED"
            - "ServiceLine.${sl_wc_id}.route == COVERED_BY_MEMBERSHIP"
            - "ServiceLine.${sl_wc_id}.service_code == WELL_VISIT"
            - "ServiceLine.${sl_wc_id}.billed_amount_cents == 22000"
            - "ServiceLine.${sl_wc_id}.patient_responsibility_cents == 0"
            - "ServiceLine.${sl_wc_id}.membership_covered_cents == 22000"
            - "ServiceLine.${sl_wc_id}.deductible_applied_cents == 0"
            - "ServiceLine.${sl_wc_id}.policy_id == null"
            - "ServiceLine.${sl_wc_id}.status == SETTLED"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 14000"
            - "InsurancePolicy.${pol_id}.version == 2"

      - name: immunization_validity_age_rung_vs_interval_rung
        grounds:
          - calculations.immunization_dose_validity
          - entities.ImmunizationDose.fields.invalid_reason
          - entities.ImmunizationDose.fields.effective_series_index
          - entities.ImmunizationDose.fields.interval_days_since_prior
          - state_machines.ImmunizationDose.VALID_to_INVALID
        distinguishing_aspect: |
          On the ImmunizationDose entity domain - structurally different from the
          ServiceLine billing domain of the sibling instance - the same INVALID
          verdict is produced by two different rungs of the same formula: the
          HEPB third dose fails only the age rung and reports MIN_AGE_NOT_MET
          with interval_days_since_prior 135, while the DTAP second dose passes
          the age rung at 78 days yet fails the interval rung and reports
          MIN_INTERVAL_NOT_MET with interval_days_since_prior 23.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z"
            - "One family and one child born 2026-04-01 with no membership (dose records hang off the Child, not a Membership)"
            - "HEPB dose on 2026-04-02 and HEPB dose on 2026-04-29, both VALID"
            - "DTAP dose on 2026-05-26 at age 55, VALID"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/families"
              payload: { household_name: "Okafor", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Noah", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-04-02" }
              as: PracticeAdmin
              captures: { d_hepb1: "$.data.id" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-04-29" }
              as: PracticeAdmin
              captures: { d_hepb2: "$.data.id" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "DTAP", administered_date: "2026-05-26" }
              as: PracticeAdmin
              captures: { d_dtap1: "$.data.id" }
          trigger:
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-09-11" }
              as: PracticeAdmin
              captures: { d_hepb3: "$.data.id" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "DTAP", administered_date: "2026-06-18" }
              as: PracticeAdmin
              captures: { d_dtap2: "$.data.id" }
          assert:
            - "ImmunizationDose.${d_hepb1}.validity == VALID"
            - "ImmunizationDose.${d_hepb1}.effective_series_index == 1"
            - "ImmunizationDose.${d_hepb2}.validity == VALID"
            - "ImmunizationDose.${d_hepb2}.effective_series_index == 2"
            - "ImmunizationDose.${d_hepb2}.interval_days_since_prior == 27"
            - "ImmunizationDose.${d_hepb3}.validity == INVALID"
            - "ImmunizationDose.${d_hepb3}.invalid_reason == MIN_AGE_NOT_MET"
            - "ImmunizationDose.${d_hepb3}.age_days_at_administration == 163"
            - "ImmunizationDose.${d_hepb3}.effective_series_index == 3"
            - "ImmunizationDose.${d_hepb3}.interval_days_since_prior == 135"
            - "ImmunizationDose.${d_hepb3}.prior_valid_dose_id == ${d_hepb2}"
            - "ImmunizationDose.${d_dtap1}.validity == VALID"
            - "ImmunizationDose.${d_dtap2}.validity == INVALID"
            - "ImmunizationDose.${d_dtap2}.invalid_reason == MIN_INTERVAL_NOT_MET"
            - "ImmunizationDose.${d_dtap2}.age_days_at_administration == 78"
            - "ImmunizationDose.${d_dtap2}.effective_series_index == 2"
            - "ImmunizationDose.${d_dtap2}.interval_days_since_prior == 23"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: family_invoice_rounds_per_line_before_summing
        grounds:
          - calculations.family_invoice_total
          - calculations.membership_cycle_proration
          - calculations.sibling_ladder_rate
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.lines
          - entities.Membership.fields.enrollment_sequence
        distinguishing_aspect: |
          MODE (b) - nested rounding whose order changes the cents. Three
          sibling lines of 40000, 21333.33 and 14733.33 cents sum to 76066 when
          each line is rounded to whole cents before summation, and to 76067
          when the raw sum 76066.667 is rounded once; the scaffold pins
          round-per-line-then-sum, so subtotal_cents must be exactly 76066.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, so the billing cycle is June 2026 with 30 days"
            - "One PLUS plan at 40000 cents, one physician with panel_slot_cap 20.0"
            - "One family with family_monthly_cap_cents 100000 and three children"
            - "Two memberships already enrolled, starting 2026-06-01 and 2026-06-11"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Alvarez", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Ana", date_of_birth: "2026-03-01" }
              as: PracticeAdmin
              captures: { child_a: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Beto", date_of_birth: "2024-06-01" }
              as: PracticeAdmin
              captures: { child_b: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Cruz", date_of_birth: "2020-06-01" }
              as: PracticeAdmin
              captures: { child_c: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_a}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_a: "$.data.id" }
            - call: "GET /peds/families/${fam_id}"
              payload: {}
              as: PracticeAdmin
              captures: { fam_v1: "$.data.version" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_b}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-11", expected_family_version: "${fam_v1}" }
              as: PracticeAdmin
              captures: { mem_b: "$.data.id" }
            - call: "GET /peds/families/${fam_id}"
              payload: {}
              as: PracticeAdmin
              captures: { fam_v2: "$.data.version" }
          trigger:
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_c}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-14", expected_family_version: "${fam_v2}" }
              as: PracticeAdmin
              captures: { mem_c: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id", inv_subtotal: "$.data[0].subtotal_cents" }
          assert:
            - "Invoice.${inv_id}.cycle_start_date == 2026-06-01"
            - "Invoice.${inv_id}.days_in_cycle == 30"
            - "Invoice.${inv_id}.subtotal_cents == 76066"
            - "Invoice.${inv_id}.subtotal_cents != 76067"
            - "Invoice.${inv_id}.cap_adjustment_cents == 0"
            - "Invoice.${inv_id}.total_cents == 76066"
            - "Invoice.${inv_id}.lines has exactly 3 entries"
            - "Invoice.${inv_id}.lines[0].enrollment_sequence == 1 and lines[0].covered_days == 30 and lines[0].prorated_cents == 40000"
            - "Invoice.${inv_id}.lines[1].enrollment_sequence == 2 and lines[1].covered_days == 20 and lines[1].prorated_cents == 21333"
            - "Invoice.${inv_id}.lines[2].enrollment_sequence == 3 and lines[2].covered_days == 17 and lines[2].prorated_cents == 14733"
            - "Membership.${mem_a}.enrollment_sequence == 1 and Membership.${mem_a}.discount_pct == 0.00 and Membership.${mem_a}.monthly_rate_cents == 40000"
            - "Membership.${mem_b}.enrollment_sequence == 2 and Membership.${mem_b}.discount_pct == 0.20 and Membership.${mem_b}.monthly_rate_cents == 32000"
            - "Membership.${mem_c}.enrollment_sequence == 3 and Membership.${mem_c}.discount_pct == 0.35 and Membership.${mem_c}.monthly_rate_cents == 26000"

      - name: insurance_split_nested_min_max_with_half_cent_coinsurance
        grounds:
          - calculations.service_line_financial_split
          - entities.InsurancePolicy.fields.coinsurance_rate
          - entities.ServiceLine.fields.coinsurance_cents
          - entities.ServiceLine.fields.plan_paid_cents
          - state_machines.ServiceLine.ROUTED_to_ADJUDICATED
        distinguishing_aspect: |
          MODE (a) - a formula with four inputs (billed_amount_cents 18000,
          allowed_amount_cents 14000, remaining deductible 9770 and
          coinsurance_rate 0.15) combined through nested min and max plus a
          route branch, landing on an exact half-cent product 4230 * 0.15 =
          634.5 that round_half_up must resolve to 635 rather than 634.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T20:00:00Z"
            - "One PLUS plan, one physician licensed in CA with panel_slot_cap 20.0"
            - "One family holding an ACTIVE InsurancePolicy with deductible_cents 9770, deductible_met_cents 0 and coinsurance_rate 0.15"
            - "One child with an ACTIVE membership started 2026-06-01 whose June invoice of 40000 cents is PAID"
            - "One SICK_VISIT encounter submitted for billing by user bs-011, producing a single ROUTED insurance line billed at 18000"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/membership-plans"
              payload: { tier: "PLUS", monthly_rate_cents: 40000, included_lactation_consults: 3, included_sleep_consults: 2, form_sla_hours: 72, after_hours_surcharge_waived: false, overage_consult_fee_cents: 15000 }
              as: PracticeAdmin
              captures: { plus_plan_id: "$.data.id" }
            - call: "POST /peds/physicians"
              payload: { full_name: "Dr Ada Reyes", panel_slot_cap: 20.0, licensed_state_codes: ["CA"] }
              as: PracticeAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /peds/families"
              payload: { household_name: "Brandt", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id", fam_v0: "$.data.version" }
            - call: "POST /peds/insurance-policies"
              payload: { family_id: "${fam_id}", carrier_name: "Cedar Mutual", deductible_cents: 9770, coinsurance_rate: 0.15, status: "ACTIVE" }
              as: BillingSpecialist
              captures: { pol_id: "$.data.id", pol_v0: "$.data.version" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Ida", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/memberships"
              payload: { child_id: "${child_id}", plan_id: "${plus_plan_id}", physician_id: "${doc_id}", start_date: "2026-06-01", expected_family_version: "${fam_v0}" }
              as: PracticeAdmin
              captures: { mem_id: "$.data.id" }
            - call: "GET /peds/invoices"
              payload: { family_id: "${fam_id}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /peds/invoices/${inv_id}/issue"
              payload: {}
              as: BillingSpecialist
            - call: "POST /peds/invoices/${inv_id}/pay"
              payload: { amount_paid_cents: 40000 }
              as: BillingSpecialist
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T20:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/encounters"
              payload: { membership_id: "${mem_id}", encounter_type: "SICK_VISIT", modality: "IN_PERSON", patient_state_code: "CA", started_at: "2026-06-15T10:00:00Z" }
              as: CareCoordinator
              captures: { enc_id: "$.data.id" }
            - call: "POST /peds/encounters/${enc_id}/submit-billing"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-011"
            - call: "GET /peds/service-lines"
              payload: { encounter_id: "${enc_id}" }
              as: BillingSpecialist
              captures: { sl_id: "$.data[0].id" }
          trigger:
            - call: "POST /peds/service-lines/${sl_id}/adjudicate"
              payload: { allowed_amount_cents: 14000, expected_policy_version: "${pol_v0}" }
              as: BillingSpecialist
              as_user_id: "bs-012"
              captures: { coins: "$.data.coinsurance_cents" }
          assert:
            - "ServiceLine.${sl_id}.allowed_amount_cents == 14000"
            - "ServiceLine.${sl_id}.write_off_cents == 4000"
            - "ServiceLine.${sl_id}.deductible_applied_cents == 9770"
            - "ServiceLine.${sl_id}.coinsurance_cents == 635"
            - "ServiceLine.${sl_id}.coinsurance_cents != 634"
            - "ServiceLine.${sl_id}.plan_paid_cents == 3595"
            - "ServiceLine.${sl_id}.patient_responsibility_cents == 10405"
            - "ServiceLine.${sl_id}.membership_covered_cents == 0"
            - "ServiceLine.${sl_id}.status == ADJUDICATED"
            - "ServiceLine.${sl_id}.adjudicated_by_user_id == bs-012"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 9770"
            - "Encounter.${enc_id}.billing_status == BILLING_ROUTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: encounter_billing_axis_closes_while_clinical_axis_still_scheduled
        grounds:
          - state_machines.Encounter.BILLING_PENDING_to_BILLING_ROUTED
          - state_machines.Encounter.BILLING_ROUTED_to_BILLING_CLOSED
          - state_machines.Encounter.SCHEDULED_to_CLINICALLY_COMPLETE
          - entities.Encounter.fields.clinical_status
          - entities.Encounter.fields.billing_status
        distinguishing_aspect: |
          PARALLEL AXES on the Encounter entity: submit-billing drives
          billing_status BILLING_PENDING -> BILLING_ROUTED -> BILLING_CLOSED
          inside one request while clinical_status is still SCHEDULED, and the
          later complete-clinical call moves clinical_status to
          CLINICALLY_COMPLETE while billing_status stays BILLING_CLOSED. Neither
          axis is a precondition of the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-15T20:00:00Z"
            - "One PLUS plan, one physician licensed in CA with panel_slot_cap 20.0"
            - "One family with NO insurance policy, one child, one ACTIVE membership started 2026-06-01 with the June invoice of 40000 cents PAID"
            - "One ROUTINE_QUESTION encounter started 2026-06-15T10:00:00Z, clinical_status SCHEDULED and billing_status BILLING_PENDING"
          setup_api_calls:
