            - call: "POST /error-escapes/${escape_id}/recovery-claim"
              payload: {expected_error_escape_version: "${escape_v_c}"}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /error-escapes/${escape_id}/recovery-claim"
              payload: {expected_error_escape_version: "${escape_v_c}"}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "GET /error-escapes/${escape_id}"
              payload: {}
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "GET /error-escapes"
              payload: {printer_id: "${printer_id}", state: "RECOVERY_CLAIMED"}
              as: QualityReviewer
              as_user_id: "u_qa"
          assert:
            - "the recovery-claim replaying expected_error_escape_version == ${escape_v_a} returns 412 ERR_STALE_ESCAPE_VERSION per validations[priority=22]"
            - "GET /error-escapes/${escape_id} after that refusal returns 200 with state == ROOT_CAUSE_ASSIGNED, root_cause_party == SHARED, printer_share_pct == 0.40, provisional_recovery_cents == null and liability_cap_applied == false; escape_v_c captures its version, which equals ${escape_v_b}"
            - "the recovery-claim carrying expected_error_escape_version == ${escape_v_c} returns 200 with state == RECOVERY_CLAIMED and provisional_recovery_cents == 82800 - the four PROVISIONAL lines rounded per line at 0.40 are 50400 + 8400 + 0 + 24000, NOT 207000 and NOT round_half_up(207000*0.40) == 82800 by luck of a single-shot rounding, which the per-line assertion below pins"
            - "each per-line figure is individually exact at this share: reprint 126000*0.40 == 50400, scrap 21000*0.40 == 8400, expedite_freight 0 (never estimated in PROVISIONAL) and investigation 60000*0.40 == 24000"
            - "replaying the same ${escape_v_c} a second time returns 412 ERR_STALE_ESCAPE_VERSION and NOT 409 ERR_ESCAPE_STATE_INVALID, because priority 22 is evaluated before priority 34 even though both conditions hold"
            - "GET /error-escapes/${escape_id} at the end still reports state == RECOVERY_CLAIMED and provisional_recovery_cents == 82800, unchanged by the two refusals"
            - "no call in this test returns 200 with provisional_recovery_cents == 207000: the withdrawn apportionment is never re-billed"
            - "GET /error-escapes?printer_id=${printer_id}&state=RECOVERY_CLAIMED returns total_count == 1 with that single row's provisional_recovery_cents == 82800, so the state filter follows the escape through the DISPUTED detour rather than reporting the pre-dispute claim"

      - name: pinned_claim_snapshot_is_frozen_at_approval_so_a_fresh_clearance_of_the_same_code_cannot_rescue_the_release
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_profile.complexity_layers
          - entities.ArtworkVersion.fields.pinned_claim_snapshot
          - entities.ArtworkVersion.fields.claim_ids
          - entities.MarketingClaim.fields.cleared_until_utc
          - entities.MarketingClaim.fields.legal_status
          - errors[ERR_CLAIM_CLEARANCE_EXPIRED]
          - validations[priority=39]
          - endpoints[POST /artwork-versions/{id}/release-to-print]
          - endpoints[POST /marketing-claims/{id}/clearance]
          - state_machines.ArtworkVersion.IN_REVIEW_to_APPROVED
          - state_machines.MarketingClaim.CLEARED_to_REJECTED
        distinguishing_aspect: |
          The version_pinning_on_approval layer end to end. Approval freezes one
          { marketing_claim_id, claim_code, cleared_until_utc } entry per claim_ids
          entry, in claim_ids order, and release-to-print is then judged against that
          frozen copy rather than against the live claim library. Three implementations
          fail here: one that re-reads the live claim rows at release (the snapshot is
          stale-by-design and must not be refreshed - after the withdrawal the live
          row is REJECTED, which would produce the wrong error id); one that resolves
          the pinned entries by claim_code (a brand-new NAS-01/US row cleared
          2026-08-15 -> 2026-12-31 exists by then, so it would wrongly release); and
          one that requires ALL snapshot entries to be expired instead of any (GF-02 is
          still comfortably inside its window).
        test_recipe:
          setup:
            - "Logical clock starts pinned at 2026-08-01T00:00:00Z; brief SKU-1001 APPROVED for market US."
            - "Two US claims cleared by the LegalReviewer: NAS-01 for [2026-08-01, 2026-08-15) and GF-02 for [2026-08-01, 2026-12-31)."
            - "One US CARTON asset with version v1 whose claim_ids is exactly [NAS-01, GF-02] in that order; v1 verified at score 100.0, submitted while the clock is inside both windows, and approved by an all-APPROVED route, so requires_reverification is false and pinned_claim_snapshot is frozen."
            - "A CERTIFIED printer with a proof of v1 at delta-E 1.2 on COATED_PAPER and SUBSTRATE_APPROVED; the asset is not brand_critical_color, so press_check_status is NOT_REQUIRED and the proof is already PROOF_APPROVED - the proof precondition of release can never be the reason for a refusal here."
            - "Nothing has been released yet: v1.state == APPROVED and released_at == null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
