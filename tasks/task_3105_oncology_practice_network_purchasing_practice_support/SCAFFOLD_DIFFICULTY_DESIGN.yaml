            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000011", brand_name: "Rituximab-A", generic_name: "rituximab-xyz", therapeutic_class: "IMMUNOTHERAPY", unit_type: "MG", network_base_price_cents: 12345, is_shortage_candidate: false }
