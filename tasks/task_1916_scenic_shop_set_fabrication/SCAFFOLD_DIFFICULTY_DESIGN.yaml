              as: Estimator
            - call: "POST /scenic/bids/${bid_id}/accept"
              payload: {}
              as: ClientPM
              as_user_id: "${cl_id}"
              captures: { prod_id: $.data.production_id }
            - call: "POST /scenic/bay-reservations"
              payload: { production_id: "${prod_id}", bay_slot: 1, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: ShopForeman
              captures: { res_1: $.data.id }
          trigger:
            - call: "POST /scenic/bay-reservations"
              payload: { production_id: "${prod_id}", bay_slot: 1, window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z" }
              as: ShopForeman
              captures: { res_2: $.data.id }
            - call: "POST /scenic/bay-reservations"
