          rationale: "The four-hop expiry cascade and its facility bookkeeping are verified end-to-end there; this section only needs the no-op and boundary behaviour of the same endpoint, which corner_clock_advance_reports_zero_counts_until_the_term_end_is_reached covers."

  - section: rbac
    instances:
      - name: corner_authentication_precedes_authorization_which_precedes_state
        claim_type: role_cannot_perform_others_exclusive_operations
        grounds:
          - roles.Underwriter.exclusive_operations
          - roles.UnderwritingManager.exclusive_operations
          - roles.RiskEngineer.exclusive_operations
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Three layers are ordered: an unknown or absent role is 401 before any lookup, a known but wrong role is 403 before any state or business check (so re-screening an already screened project as an Underwriter yields ERR_UNAUTHORIZED, not ERR_INVALID_PROJECT_STATE, and filing a claim on a DRAFT policy yields ERR_UNAUTHORIZED, not ERR_INVALID_POLICY_STATE), and only a correctly authenticated, authorised caller reaches the state machine."
        test_recipe:
          setup:
            - "Project P1 screened ELIGIBLE by re-001, with a DRAFT policy carrying one MATERIALS_ON_SITE part - nothing is quoted yet, so the final positive call can still succeed."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-03-20T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 100000000 }
              as: Underwriter
              as_user_id: "uw-001"
          trigger:
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: "Auditor (a role name that is not one of the six declared roles)"
              as_user_id: "aud-001"
              captures: { e1: $.data.error_id }
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: "(the X-User-Role header is omitted entirely)"
              as_user_id: "uw-001"
              captures: { e2: $.data.error_id }
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "(the X-User-ID header is omitted entirely)"
              captures: { e3: $.data.error_id }
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: UnderwritingManager
              as_user_id: "um-001"
              captures: { e4: $.data.error_id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "SOFT_COST", sublimit_cents: 20000000 }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { e5: $.data.error_id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e6: $.data.error_id }
            - call: "POST /builders-risk/facilities"
              payload: { name: "Rogue Depot", site_code: "WH-99", distance_from_site_miles: 5, aggregate_capacity_cents: 100000000, protection_class: "SPRINKLERED" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { e7: $.data.error_id }
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "FIRE", loss_date: "2026-11-15T00:00:00Z", description: "Premature notice on a draft policy" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e8: $.data.error_id }
            - call: "POST /builders-risk/policies/${pl1}/cancel"
              payload: { cancel_effective_date: "2027-01-01T00:00:00Z", cancel_reason: "INSURED_REQUEST" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e9: $.data.error_id }
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { st: $.data.status, qp: $.data.quoted_premium_cents }
          assert:
            - "e1 == ERR_UNAUTHENTICATED with HTTP 401 - an undeclared role name is not merely unauthorised"
            - "e2 == ERR_UNAUTHENTICATED with HTTP 401 - missing X-User-Role"
            - "e3 == ERR_UNAUTHENTICATED with HTTP 401 - missing X-User-ID even though the role is valid"
            - "e4 == ERR_UNAUTHORIZED with HTTP 403 - quote is exclusive to Underwriter, and UnderwritingManager holds no hierarchical override"
            - "e5 == ERR_UNAUTHORIZED with HTTP 403 - RiskEngineer may not build the coverage schedule"
            - "e6 == ERR_UNAUTHORIZED with HTTP 403, not ERR_INVALID_PROJECT_STATE: the 403 is decided before the already-screened state is examined"
            - "e7 == ERR_UNAUTHORIZED with HTTP 403 - registering a facility is exclusive to RiskEngineer"
            - "e8 == ERR_UNAUTHORIZED with HTTP 403, not ERR_INVALID_POLICY_STATE: the policy is DRAFT and a claim would be refused anyway, but the role check runs first"
            - "e9 == ERR_UNAUTHORIZED with HTTP 403 - cancel is exclusive to UnderwritingManager"
            - "st == QUOTED with qp == 320000 on the final call (base 4000 units x 80 = 320000, cat 0, duration 0, soft 0 - the rejected SOFT_COST part was never created, so no soft-cost component enters the rate)"
            - "GET /builders-risk/policies/${pl1}/coverage-parts returns total_count == 1 and GET /builders-risk/projects/${p1} still reports engineering_grade == A - none of the nine rejected calls mutated anything"
            - "GET /builders-risk/facilities returns total_count == 0"

