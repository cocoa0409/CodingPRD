scenario: |
  Proxy Voting & Annual Meeting Administration (Broadridge style proxy agent): record date & shareholder list generation, proxy material distribution (notice & access) & broker search, vote tabulation across channels & duplicate/revocation rules, quorum calculation & inspector of election, contested-vote & solicitation handling, virtual meeting platform & question moderation, results certification & 8-K filing, householding & delivery preference

domain_name: proxy-voting-annual-meeting
api_prefix: /proxy

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit      # record date, inspector certification, 8-K filing, segregation of duties
  secondary_archetype: event_sourcing      # vote instructions form an ordered stream; latest-valid-vote-wins replay
  complexity_layers:
    - optimistic_concurrency               # OCC on Meeting.version for amendments and certification signing
    - dual_variant_calculation             # provisional vs final quorum; unofficial vs certified tabulation
    - scheduled_actions                    # platform sessions and solicitation campaigns occupy future windows
    - derived_field_reconciliation         # quorum / tabulation / distribution rollups recomputed on every source change
  entity_topology: flat                    # peer collections under /proxy with FK filters
  state_machine_shape: cyclic              # Meeting adjourn/reconvene loop; QuestionSubmission return/resubmit loop
  relationship_patterns:
    - one_to_many                          # Meeting -> accounts, proposals, votes, sessions, ...
    - cross_aggregate                      # VoteInstruction references Meeting + Proposal + ShareholderAccount
  role_model: segregation_of_duties        # certification creator may not sign it
  consistency_model: immediate             # every mutation visible in its own response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Issuer company name" }
      - { name: ticker, type: string, source: input, description: "Issuer ticker symbol" }
      - { name: meeting_type, type: enum, source: input, description: "ANNUAL | SPECIAL | CONTESTED" }
      - { name: record_date, type: string, source: input, description: "Record date (YYYY-MM-DD); must be strictly before meeting_datetime" }
      - { name: meeting_datetime, type: datetime, source: input, description: "Scheduled meeting start (ISO8601 UTC)" }
      - { name: meeting_mode, type: enum, source: input, description: "IN_PERSON | VIRTUAL | HYBRID" }
      - { name: quorum_threshold_pct, type: number, source: input, description: "Quorum threshold as a fraction, e.g. 0.5; must be > 0 and <= 1" }
      - { name: outstanding_shares, type: integer, source: input, description: "Shares outstanding as of record date; must be > 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> RECORD_DATE_LOCKED -> MATERIALS_DISTRIBUTED -> VOTING_OPEN -> MEETING_IN_PROGRESS <-> ADJOURNED -> MEETING_HELD -> RESULTS_CERTIFIED -> FILED_8K; CANCELLED from DRAFT/RECORD_DATE_LOCKED" }
      - { name: walk_in_shares, type: integer, source: system, default: 0, description: "Shares present without a vote, recorded at conclude; counted only by FINAL quorum" }
      - { name: filed_at, type: datetime, source: system, description: "Set when 8-K results filing completes; null until FILED_8K" }
      - { name: filing_reference, type: string, source: system, description: "Filing reference recorded at file-8k; null until then" }

  - name: ShareholderAccount
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id; meeting this record-date account belongs to" }
      - { name: holder_name, type: string, source: input, description: "Registered holder name" }
      - { name: account_number, type: string, source: input, description: "Holder account number; unique within the meeting" }
      - { name: share_class, type: enum, source: input, description: "COMMON (vote weight 1.0) | PREFERRED (vote weight 0.5)" }
      - { name: shares_held, type: integer, source: input, description: "Shares held on the record date; must be > 0" }
      - { name: address_key, type: string, source: input, description: "Normalized mailing-address key used for householding; optional for E_DELIVERY-only holders" }
      - { name: email, type: string, source: input, description: "Holder email; optional" }
      - { name: delivery_preference, type: enum, source: input, default: NOTICE_AND_ACCESS, description: "NOTICE_AND_ACCESS | FULL_MAIL | E_DELIVERY" }
      - { name: householding_opt_out, type: boolean, source: input, default: false, description: "True = holder always receives an individual package" }
      - { name: control_number, type: string, source: system, description: "System-minted 12-digit control number printed on the holder's materials; required on INTERNET/PHONE/MAIL votes" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING before record-date lock; ELIGIBLE after lock" }

  - name: BrokerSearchRecord
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: broker_code, type: string, source: input, description: "Broker/dealer code; unique within the meeting" }
      - { name: broker_name, type: string, source: input, description: "Broker/dealer name" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> RESPONDED" }
      - { name: shares_reported, type: integer, source: system, description: "Omnibus shares reported by the broker on respond; null until RESPONDED" }

  - name: MaterialDistribution
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: system, description: "FK -> Meeting.id" }
      - { name: channel, type: enum, source: system, description: "NOTICE_AND_ACCESS | FULL_MAIL | E_DELIVERY (copied from the covered accounts' preference)" }
      - { name: representative_account_id, type: string, source: system, description: "FK -> ShareholderAccount.id; earliest-created covered account (household representative)" }
      - { name: covered_account_ids, type: array, source: system, description: "FK -> ShareholderAccount.id; array of account ids covered by this package (household group members)" }
      - { name: covered_shares, type: integer, source: system, description: "Sum of shares_held across covered_account_ids" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> DELIVERED | BOUNCED; any non-SUPERSEDED -> SUPERSEDED on regeneration" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: proposal_number, type: integer, source: input, description: "Agenda number; unique within the meeting" }
      - { name: title, type: string, source: input, description: "Proposal title" }
      - { name: proposal_type, type: enum, source: input, description: "DIRECTOR_ELECTION | SAY_ON_PAY | RATIFICATION | SHAREHOLDER_PROPOSAL" }
      - { name: vote_standard, type: enum, source: input, description: "MAJORITY_OF_VOTES_CAST | MAJORITY_OF_OUTSTANDING | PLURALITY" }
      - { name: board_recommendation, type: enum, source: input, default: FOR, description: "FOR | AGAINST | NO_RECOMMENDATION" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE (at material distribution) -> PASSED | FAILED (at certification sign); DRAFT|ACTIVE -> WITHDRAWN" }

  - name: VoteInstruction
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id; must belong to the same meeting" }
      - { name: account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; must belong to the same meeting" }
      - { name: channel, type: enum, source: input, description: "INTERNET | PHONE | MAIL (Shareholder); BROKER (Broker); IN_PERSON (ProxyAdministrator)" }
      - { name: choice, type: enum, source: input, description: "FOR | AGAINST | ABSTAIN; WITHHOLD only for DIRECTOR_ELECTION (which forbids AGAINST/ABSTAIN)" }
      - { name: shares_voted, type: integer, source: input, default: "account.shares_held", description: "Shares voted; > 0 and <= account.shares_held" }
      - { name: control_number, type: string, source: input, description: "Required for INTERNET/PHONE/MAIL channels; must equal account.control_number" }
      - { name: status, type: enum, source: system, default: VALIDATED, description: "VALIDATED -> SUPERSEDED (newer valid vote same account+proposal) | REVOKED (explicit revoke) | INVALIDATED (challenge upheld)" }

  - name: MeetingPlatformSession
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: session_type, type: enum, source: input, description: "REHEARSAL | LIVE" }
      - { name: start_at, type: datetime, source: input, description: "Session start (ISO8601 UTC); end_at must be strictly after start_at" }
      - { name: end_at, type: datetime, source: input, description: "Session end (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED (sessions are immutable once booked)" }

  - name: QuestionSubmission
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: account_id, type: string, source: input, description: "FK -> ShareholderAccount.id; must belong to the same meeting" }
      - { name: question_text, type: string, source: input, description: "Question text (non-empty)" }
      - { name: moderation_note, type: string, source: system, description: "Moderator note recorded at moderate; null until moderated" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED | REJECTED | RETURNED; RETURNED -> SUBMITTED (resubmit)" }

  - name: VoteChallenge
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: vote_instruction_id, type: string, source: input, description: "FK -> VoteInstruction.id; must belong to the same meeting and be VALIDATED" }
      - { name: reason, type: string, source: input, description: "Challenge reason" }
      - { name: ruling, type: enum, source: system, description: "UPHELD | OVERRULED; null until adjudicated" }
      - { name: resolution_note, type: string, source: system, description: "Inspector note recorded at adjudication; null until then" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> UPHELD | OVERRULED" }

  - name: SolicitationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id; meeting must be CONTESTED" }
      - { name: soliciting_party, type: string, source: input, description: "Party running the solicitation (e.g. 'dissident', 'issuer')" }
      - { name: start_at, type: datetime, source: input, description: "Contact window start (ISO8601 UTC); end_at must be strictly after start_at" }
      - { name: end_at, type: datetime, source: input, description: "Contact window end (ISO8601 UTC)" }

  - name: InspectorCertification
    parent: null
    common_fields: true
    fields:
      - { name: meeting_id, type: string, source: input, description: "FK -> Meeting.id" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the InspectorOfElection who created the draft; the signer must differ (segregation of duties)" }
      - { name: final_quorum_met, type: boolean, source: system, description: "FINAL-variant quorum snapshot captured at draft creation" }
      - { name: final_quorum_pct_bp, type: integer, source: system, description: "FINAL-variant quorum in basis points at draft creation" }
      - { name: outcomes, type: object, source: system, description: "Map of proposal_id -> PASSED | FAILED per the CERTIFIED tabulation variant at draft creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SIGNED; DRAFT|SIGNED -> SUPERSEDED (new draft created, or a challenge adjudicated while a non-superseded certification exists)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Meeting
    initial_state: DRAFT
    terminal_states: [FILED_8K, CANCELLED]
    transitions:
      - from: DRAFT
        to: RECORD_DATE_LOCKED
        trigger: POST /proxy/meetings/{id}/lock-record-date
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in DRAFT (ERR_INVALID_MEETING_STATE)"
          - "record_date strictly before meeting_datetime (ERR_RECORD_DATE_INVALID)"
          - "at least one ShareholderAccount exists for the meeting (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "All meeting ShareholderAccounts: status PENDING -> ELIGIBLE (record-date list snapshot)"
          - "Increments Meeting.version by 1"
      - from: RECORD_DATE_LOCKED
        to: MATERIALS_DISTRIBUTED
        trigger: POST /proxy/material-distributions/generate (first generation for the meeting)
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in RECORD_DATE_LOCKED or MATERIALS_DISTRIBUTED (ERR_INVALID_MEETING_STATE)"
          - "At least one Proposal exists for the meeting (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "All non-SUPERSEDED MaterialDistributions of the meeting -> SUPERSEDED"
          - "New packages created per householding_grouping calculation"
          - "All DRAFT Proposals of the meeting -> ACTIVE"
          - "Increments Meeting.version by 1"
      - from: MATERIALS_DISTRIBUTED
        to: MATERIALS_DISTRIBUTED
        trigger: POST /proxy/material-distributions/generate (regeneration)
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in MATERIALS_DISTRIBUTED (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "All non-SUPERSEDED MaterialDistributions -> SUPERSEDED; new packages created per householding_grouping"
          - "Increments Meeting.version by 1"
      - from: MATERIALS_DISTRIBUTED
        to: VOTING_OPEN
        trigger: POST /proxy/meetings/{id}/open-voting
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in MATERIALS_DISTRIBUTED (ERR_INVALID_MEETING_STATE)"
          - "At least one Proposal in ACTIVE (ERR_NO_ACTIVE_PROPOSAL)"
          - "No BrokerSearchRecord in REQUESTED for the meeting (ERR_BROKER_SEARCH_INCOMPLETE)"
        side_effects:
          - "Increments Meeting.version by 1"
      - from: VOTING_OPEN
        to: MEETING_IN_PROGRESS
        trigger: POST /proxy/meetings/{id}/convene
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in VOTING_OPEN (ERR_INVALID_MEETING_STATE)"
          - "Logical clock current_utc >= meeting_datetime (ERR_MEETING_NOT_YET_STARTED)"
        side_effects:
          - "Increments Meeting.version by 1"
      - from: MEETING_IN_PROGRESS
        to: ADJOURNED
        trigger: POST /proxy/meetings/{id}/adjourn
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in MEETING_IN_PROGRESS (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "Voting suspended while ADJOURNED (vote/revoke calls fail ERR_VOTING_NOT_OPEN)"
          - "Increments Meeting.version by 1"
      - from: ADJOURNED
        to: MEETING_IN_PROGRESS
        trigger: POST /proxy/meetings/{id}/reconvene
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in ADJOURNED (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "Increments Meeting.version by 1"
      - from: MEETING_IN_PROGRESS
        to: MEETING_HELD
        trigger: POST /proxy/meetings/{id}/conclude
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in MEETING_IN_PROGRESS (ERR_INVALID_MEETING_STATE)"
          - "FINAL-variant quorum_met == true with the request's walk_in_shares included (ERR_QUORUM_NOT_MET)"
        side_effects:
          - "Meeting.walk_in_shares set from request (default 0)"
          - "Voting closed: no further vote or revoke calls accepted"
          - "Increments Meeting.version by 1"
      - from: MEETING_HELD
        to: RESULTS_CERTIFIED
        trigger: POST /proxy/inspector-certifications/{id}/sign
        actor: InspectorOfElection
        preconditions:
          - "Certification DRAFT, no OPEN VoteChallenges, signer != created_by_user_id, expected_meeting_version matches"
        side_effects:
          - "Each ACTIVE Proposal -> PASSED or FAILED per its CERTIFIED tabulation outcome"
          - "Increments Meeting.version by 1"
      - from: RESULTS_CERTIFIED
        to: MEETING_HELD
        trigger: "system (compensation when a VoteChallenge adjudication supersedes the SIGNED certification)"
        actor: system
        preconditions:
          - "A VoteChallenge on this meeting is adjudicated while its certification is SIGNED"
        side_effects:
          - "Certification SIGNED -> SUPERSEDED"
          - "All PASSED/FAILED Proposals of the meeting revert to ACTIVE"
          - "Increments Meeting.version by 1"
      - from: RESULTS_CERTIFIED
        to: FILED_8K
        trigger: POST /proxy/meetings/{id}/file-8k
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in RESULTS_CERTIFIED (ERR_INVALID_MEETING_STATE)"
          - "An InspectorCertification in SIGNED exists for the meeting (guaranteed by state; certification supersession reverts the meeting)"
        side_effects:
          - "Meeting.filed_at set to logical clock; Meeting.filing_reference set from request"
          - "Increments Meeting.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /proxy/meetings/{id}/cancel
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in DRAFT or RECORD_DATE_LOCKED (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "Increments Meeting.version by 1"
      - from: RECORD_DATE_LOCKED
        to: CANCELLED
        trigger: POST /proxy/meetings/{id}/cancel
        actor: ProxyAdministrator
        preconditions:
          - "Meeting in DRAFT or RECORD_DATE_LOCKED (ERR_INVALID_MEETING_STATE)"
        side_effects:
          - "Increments Meeting.version by 1"

  - entity: ShareholderAccount
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ELIGIBLE
        trigger: "system (Meeting record-date lock)"
        actor: system
        preconditions:
          - "Parent meeting transitions DRAFT -> RECORD_DATE_LOCKED"
        side_effects: []

  - entity: BrokerSearchRecord
    initial_state: REQUESTED
    terminal_states: [RESPONDED]
    transitions:
      - from: REQUESTED
        to: RESPONDED
        trigger: POST /proxy/broker-searches/{id}/respond
        actor: Broker
        preconditions:
          - "Record in REQUESTED (ERR_BROKER_SEARCH_ALREADY_RESPONDED)"
          - "shares_reported >= 0"
        side_effects:
          - "shares_reported stored on the record"

  - entity: MaterialDistribution
    initial_state: ACTIVE
    terminal_states: [DELIVERED, BOUNCED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: DELIVERED
        trigger: PATCH /proxy/material-distributions/{id} with delivery_outcome=DELIVERED
        actor: ProxyAdministrator
        preconditions:
          - "Package in ACTIVE (ERR_DISTRIBUTION_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: BOUNCED
        trigger: PATCH /proxy/material-distributions/{id} with delivery_outcome=BOUNCED
        actor: ProxyAdministrator
        preconditions:
          - "Package in ACTIVE (ERR_DISTRIBUTION_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (material-distributions regeneration for the meeting)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: SUPERSEDED
        trigger: "system (material-distributions regeneration for the meeting)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOUNCED
        to: SUPERSEDED
        trigger: "system (material-distributions regeneration for the meeting)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (first material-distributions generation for the meeting)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: PASSED
        trigger: "system (certification sign; CERTIFIED tabulation outcome PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: FAILED
        trigger: "system (certification sign; CERTIFIED tabulation outcome FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PASSED
        to: ACTIVE
        trigger: "system (compensation: SIGNED certification superseded by a challenge adjudication)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: ACTIVE
        trigger: "system (compensation: SIGNED certification superseded by a challenge adjudication)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /proxy/proposals/{id}/withdraw
        actor: ProxyAdministrator
        preconditions:
          - "Proposal in DRAFT or ACTIVE (ERR_PROPOSAL_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: WITHDRAWN
        trigger: POST /proxy/proposals/{id}/withdraw
        actor: ProxyAdministrator
        preconditions:
          - "Proposal in DRAFT or ACTIVE (ERR_PROPOSAL_NOT_ACTIVE)"
        side_effects:
          - "All VALIDATED VoteInstructions on this proposal -> SUPERSEDED; tabulation and quorum recomputed"

  - entity: VoteInstruction
    initial_state: VALIDATED
    terminal_states: [SUPERSEDED, REVOKED, INVALIDATED]
    transitions:
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system (a newer VoteInstruction for the same account_id + proposal_id is created, or the proposal is withdrawn)"
        actor: system
        preconditions: []
        side_effects:
          - "weighted_tabulation recomputed for the proposal (superseded vote excluded)"
          - "quorum_calculation recomputed for the meeting"
      - from: VALIDATED
        to: REVOKED
        trigger: POST /proxy/vote-instructions/{id}/revoke
        actor: Shareholder | ProxyAdministrator
        preconditions:
          - "Vote in VALIDATED (ERR_VOTE_NOT_ALTERABLE)"
          - "Meeting in VOTING_OPEN or MEETING_IN_PROGRESS (ERR_VOTING_NOT_OPEN)"
          - "Shareholder actor may only revoke votes on its own account_id (ERR_FORBIDDEN)"
        side_effects:
          - "weighted_tabulation recomputed for the proposal"
          - "quorum_calculation recomputed for the meeting"
      - from: VALIDATED
        to: INVALIDATED
        trigger: "system (a VoteChallenge on this instruction is adjudicated UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "weighted_tabulation recomputed for the proposal"
          - "quorum_calculation recomputed for the meeting"
          - "Any DRAFT or SIGNED InspectorCertification for the meeting -> SUPERSEDED; if it was SIGNED, Meeting RESULTS_CERTIFIED -> MEETING_HELD and its PASSED/FAILED Proposals revert to ACTIVE"

  - entity: MeetingPlatformSession
    initial_state: SCHEDULED
    terminal_states: []
    transitions: []

  - entity: QuestionSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /proxy/question-submissions/{id}/moderate with action=APPROVE
        actor: ProxyAdministrator
        preconditions:
          - "Question in SUBMITTED (ERR_INVALID_QUESTION_STATE)"
        side_effects:
          - "moderation_note stored"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /proxy/question-submissions/{id}/moderate with action=REJECT
        actor: ProxyAdministrator
        preconditions:
          - "Question in SUBMITTED (ERR_INVALID_QUESTION_STATE)"
        side_effects:
          - "moderation_note stored"
      - from: SUBMITTED
        to: RETURNED
        trigger: POST /proxy/question-submissions/{id}/moderate with action=RETURN
        actor: ProxyAdministrator
        preconditions:
          - "Question in SUBMITTED (ERR_INVALID_QUESTION_STATE)"
        side_effects:
          - "moderation_note stored"
      - from: RETURNED
        to: SUBMITTED
        trigger: POST /proxy/question-submissions/{id}/resubmit
        actor: Shareholder
        preconditions:
          - "Question in RETURNED (ERR_INVALID_QUESTION_STATE)"
          - "Shareholder actor may only resubmit questions on its own account_id (ERR_FORBIDDEN)"
        side_effects:
          - "question_text replaced; moderation_note cleared to null"

  - entity: VoteChallenge
    initial_state: OPEN
    terminal_states: [UPHELD, OVERRULED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: POST /proxy/vote-challenges/{id}/adjudicate with ruling=UPHELD
        actor: InspectorOfElection
        preconditions:
          - "Challenge in OPEN (ERR_CHALLENGE_NOT_OPEN)"
        side_effects:
          - "Target VoteInstruction VALIDATED -> INVALIDATED (cascade: tabulation recompute -> quorum recompute -> non-superseded certification SUPERSEDED, reverting RESULTS_CERTIFIED meetings to MEETING_HELD and proposals to ACTIVE)"
      - from: OPEN
        to: OVERRULED
        trigger: POST /proxy/vote-challenges/{id}/adjudicate with ruling=OVERRULED
        actor: InspectorOfElection
        preconditions:
          - "Challenge in OPEN (ERR_CHALLENGE_NOT_OPEN)"
        side_effects:
          - "Target VoteInstruction unchanged (remains VALIDATED)"

  - entity: SolicitationCampaign
    initial_state: null
    terminal_states: []
    transitions: []

  - entity: InspectorCertification
    initial_state: DRAFT
    terminal_states: [SIGNED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: POST /proxy/inspector-certifications/{id}/sign
        actor: InspectorOfElection
        preconditions:
          - "Certification in DRAFT (ERR_CERTIFICATION_NOT_DRAFT)"
          - "No VoteChallenge in OPEN for the meeting (ERR_UNRESOLVED_CHALLENGES)"
          - "Signer's X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_meeting_version equals current Meeting.version (ERR_STALE_VERSION)"
        side_effects:
          - "Each ACTIVE Proposal -> PASSED or FAILED per CERTIFIED tabulation"
          - "Meeting MEETING_HELD -> RESULTS_CERTIFIED; Meeting.version incremented by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new DRAFT certification is created for the meeting, or a challenge is adjudicated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system (a VoteChallenge on the meeting is adjudicated)"
        actor: system
        preconditions: []
        side_effects:
          - "Meeting RESULTS_CERTIFIED -> MEETING_HELD; PASSED/FAILED Proposals revert to ACTIVE"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: meeting-amend-stale-version
    parent_entity: Meeting
    write_endpoint: "PATCH /proxy/meetings/{id}"
    occ_field: expected_meeting_version
    description: |
      Amending a Meeting whose version has advanced beyond the version the
      client last observed is rejected. Captures the case where another writer
      has amended or lifecycle-transitioned the meeting since the client's
      last read, making the client's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: certification-sign-stale-version
    parent_entity: Meeting
    write_endpoint: "POST /proxy/inspector-certifications/{id}/sign"
    occ_field: expected_meeting_version
    description: |
      Signing an InspectorCertification against a Meeting whose version has
      advanced beyond the version the signer last observed is rejected.
      Captures the case where the meeting changed (e.g. another sign attempt
      or a lifecycle action) since the signer's last read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quorum_calculation
    trigger: "GET /proxy/meetings/{id}/quorum; also evaluated internally (FINAL variant) at POST /proxy/meetings/{id}/conclude and snapshotted at certification creation"
    algorithm: threshold
    formula: |
      validated_instructions = VoteInstruction where meeting_id == M.id and status == VALIDATED
      if variant == PROVISIONAL:
          shares_present = sum(vi.shares_voted for vi in validated_instructions)
      if variant == FINAL:
          challenged_ids = { c.vote_instruction_id for VoteChallenge c where c.meeting_id == M.id and c.status == OPEN }
          shares_present = sum(vi.shares_voted for vi in validated_instructions if vi.id not in challenged_ids)
          shares_present = shares_present + M.walk_in_shares
      effective_threshold_pct = max(M.quorum_threshold_pct, 0.50) if M.meeting_type == CONTESTED else M.quorum_threshold_pct
      threshold_bp = round_half_up(10000 * effective_threshold_pct)
      quorum_pct_bp = round_half_up(10000 * shares_present / M.outstanding_shares)
      quorum_met = (quorum_pct_bp >= threshold_bp)
    input_set: "VoteInstructions of the meeting in status VALIDATED (SUPERSEDED, REVOKED, INVALIDATED excluded); FINAL additionally excludes instructions with an OPEN VoteChallenge and adds Meeting.walk_in_shares"
    constants:
      BP_SCALE: 10000
      CONTESTED_MIN_QUORUM_PCT: 0.50
    precision: "quorum_pct_bp and threshold_bp are integer basis points, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "Default read variant while voting is in progress"
        difference: "Includes VALIDATED votes that have an OPEN challenge; excludes walk_in_shares"
      - name: FINAL
        when: "Used at conclude, at certification creation, and when explicitly requested"
        difference: "Excludes VALIDATED votes with an OPEN challenge; adds Meeting.walk_in_shares"

  - name: weighted_tabulation
    trigger: "On vote create, revoke, supersede, proposal withdraw, and challenge adjudication; read at GET /proxy/proposals/{id}/tabulation; CERTIFIED variant drives Proposal PASSED/FAILED at certification sign"
    algorithm: weighted_scoring
    formula: |
      CLASS_WEIGHT = { COMMON: 1.0, PREFERRED: 0.5 }
      included = VoteInstruction where proposal_id == P.id and status == VALIDATED
      if variant == CERTIFIED:
          challenged_ids = { c.vote_instruction_id for VoteChallenge c where c.meeting_id == P.meeting_id and c.status == OPEN }
          included = [ vi for vi in included if vi.id not in challenged_ids ]
      # Rounding order is pinned: round EACH instruction first, then sum.
      weighted(vi) = round_half_up(vi.shares_voted * CLASS_WEIGHT[account(vi).share_class])
      for_votes      = sum(weighted(vi) for vi in included if vi.choice == FOR)
      against_votes  = sum(weighted(vi) for vi in included if vi.choice == AGAINST)
      abstain_votes  = sum(weighted(vi) for vi in included if vi.choice == ABSTAIN)
      withhold_votes = sum(weighted(vi) for vi in included if vi.choice == WITHHOLD)
      votes_cast = for_votes + against_votes        # abstain and withhold are NOT votes cast
      if P.vote_standard == MAJORITY_OF_VOTES_CAST:
          outcome = PASS if (votes_cast > 0 and for_votes * 2 > votes_cast) else FAIL
      if P.vote_standard == MAJORITY_OF_OUTSTANDING:
          outcome = PASS if (for_votes * 2 > M.outstanding_shares) else FAIL
      if P.vote_standard == PLURALITY:
          outcome = PASS if (for_votes > withhold_votes) else FAIL
    input_set: "VoteInstructions of the proposal in status VALIDATED; CERTIFIED variant additionally excludes instructions with an OPEN VoteChallenge"
    constants:
      CLASS_WEIGHT_COMMON: 1.0
      CLASS_WEIGHT_PREFERRED: 0.5
    precision: "integer weighted votes; round_half_up applied per instruction BEFORE summation (per-instruction-then-sum order is pinned and MUST NOT be replaced by sum-then-round)"
    variants:
      - name: UNOFFICIAL
        when: "Default read variant any time before or after the meeting"
        difference: "Includes VALIDATED votes with an OPEN challenge"
      - name: CERTIFIED
        when: "Used at certification creation/sign and when explicitly requested"
        difference: "Excludes VALIDATED votes with an OPEN challenge; can flip outcome relative to UNOFFICIAL on identical raw data"

  - name: householding_grouping
    trigger: "POST /proxy/material-distributions/generate"
    algorithm: aggregation
    formula: |
      eligible = ShareholderAccount where meeting_id == M.id and status == ELIGIBLE
      physical = [ a for a in eligible if a.delivery_preference in {NOTICE_AND_ACCESS, FULL_MAIL} and a.householding_opt_out == false and a.address_key is not null ]
      groups = group physical by (address_key, delivery_preference)
      packages = []
      for each group g:
          representative = the account in g with earliest created_at (tie-break: created_at ASC; created_at values are unique enough that no further tie-break is needed)
          packages += { channel: g.delivery_preference, representative_account_id: representative.id,
                        covered_account_ids: ids of g, covered_shares: sum(shares_held over g) }
      for each account a in eligible not in any group:   # E_DELIVERY, opt-out, or no address_key
          packages += { channel: a.delivery_preference, representative_account_id: a.id,
                        covered_account_ids: [a.id], covered_shares: a.shares_held }
      Package creation order: by representative created_at ASC.
    input_set: "ShareholderAccounts of the meeting in status ELIGIBLE"
    constants: {}
    precision: "integer shares; no rounding"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles; Shareholder may only act on its own account resources (account_id / vote.account_id / question.account_id must equal X-User-ID); channel-role matrix on vote create (Shareholder->INTERNET/PHONE/MAIL, Broker->BROKER, ProxyAdministrator->IN_PERSON)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id in the path exists (meeting, account, proposal, vote, question, challenge, session, campaign, distribution, broker search, certification), validated left to right"
    error_id: ERR_MEETING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (use the resource-specific 404: ERR_ACCOUNT_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_VOTE_NOT_FOUND, ERR_QUESTION_NOT_FOUND, ERR_CHALLENGE_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_DISTRIBUTION_NOT_FOUND, ERR_BROKER_SEARCH_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND)"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits the operation (meeting lifecycle state for the endpoint — challenges require MEETING_IN_PROGRESS, MEETING_HELD, or RESULTS_CERTIFIED; proposal ACTIVE for votes; vote VALIDATED for revoke/challenge; question SUBMITTED for moderate / RETURNED for resubmit; challenge OPEN for adjudicate; certification DRAFT for sign; broker search REQUESTED for respond; distribution ACTIVE for outcome PATCH)"
    error_id: ERR_INVALID_MEETING_STATE
    http_status: 409
    applies_to: "all state-transition and state-gated endpoints (use the resource-specific state error where defined: ERR_VOTING_NOT_OPEN, ERR_PROPOSAL_NOT_ACTIVE, ERR_VOTE_NOT_ALTERABLE, ERR_INVALID_QUESTION_STATE, ERR_CHALLENGE_NOT_OPEN, ERR_CERTIFICATION_NOT_DRAFT, ERR_BROKER_SEARCH_ALREADY_RESPONDED, ERR_DISTRIBUTION_NOT_ACTIVE)"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: certification signer's X-User-ID must differ from the certification's created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /proxy/inspector-certifications/{id}/sign"
  - priority: 6
    category: business_temporal
    check: "Temporal ordering: record_date strictly before meeting_datetime (create/amend/lock); convene requires logical clock >= meeting_datetime; session and campaign end_at strictly after start_at; campaign end_at at or before meeting_datetime"
    error_id: ERR_RECORD_DATE_INVALID
    http_status: 422
    applies_to: "POST /proxy/meetings, PATCH /proxy/meetings/{id}, POST /proxy/meetings/{id}/lock-record-date (ERR_RECORD_DATE_INVALID); POST /proxy/meetings/{id}/convene (ERR_MEETING_NOT_YET_STARTED); POST /proxy/platform-sessions and POST /proxy/solicitation-campaigns (ERR_INVALID_REQUEST for end_at <= start_at or campaign end after meeting_datetime)"
  - priority: 7
    category: business_referential
    check: "Body-referenced resources belong to the same meeting: vote/question proposal_id and account_id must resolve to the same meeting_id; challenge vote_instruction_id must resolve to the same meeting_id"
    error_id: ERR_CROSS_MEETING_REFERENCE
    http_status: 422
    applies_to: "POST /proxy/vote-instructions, POST /proxy/question-submissions, POST /proxy/vote-challenges"
  - priority: 8
    category: business_constraint
    check: "Domain constraints: uniqueness (account_number and broker_code per meeting, proposal_number per meeting); control_number match for INTERNET/PHONE/MAIL votes; shares_voted in (0, shares_held]; choice allowed for proposal_type; meeting_mode compatibility for sessions/questions; solicitation only for CONTESTED; session/campaign overlap rules; open-voting gates (ACTIVE proposal exists, no REQUESTED broker searches); conclude quorum; certification creation requires zero OPEN challenges"
    error_id: ERR_DUPLICATE_ACCOUNT_NUMBER
    http_status: 409
    applies_to: "per-endpoint (specific errors: ERR_DUPLICATE_ACCOUNT_NUMBER, ERR_DUPLICATE_PROPOSAL_NUMBER, ERR_DUPLICATE_BROKER_CODE, ERR_INVALID_CONTROL_NUMBER, ERR_SHARES_EXCEED_HELD, ERR_CHOICE_NOT_ALLOWED, ERR_MEETING_MODE_INCOMPATIBLE, ERR_MEETING_NOT_CONTESTED, ERR_SESSION_OVERLAP, ERR_CAMPAIGN_WINDOW_OVERLAP, ERR_NO_ACTIVE_PROPOSAL, ERR_BROKER_SEARCH_INCOMPLETE, ERR_QUORUM_NOT_MET, ERR_UNRESOLVED_CHALLENGES)"
  - priority: 9
    category: business_constraint
    check: "OCC: expected_meeting_version equals the Meeting's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /proxy/meetings/{id}, POST /proxy/inspector-certifications/{id}/sign"
  - priority: 10
    category: existence
    check: "Request body shape: required fields present, enums valid, numeric ranges valid, datetimes parseable"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all (structural request errors are reported after auth so that unauthenticated/forbidden calls fail closed; resource-existence and state errors above take precedence)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Meetings ----
  - method: POST
    path: /proxy/meetings
    description: "Create a meeting in DRAFT"
    roles: [ProxyAdministrator]
    code: 201
    input: [company_name, ticker, meeting_type, record_date, meeting_datetime, meeting_mode, quorum_threshold_pct, outstanding_shares]
    output: Meeting
    side_effects: ["status DRAFT; created_at from logical clock"]
  - method: GET
    path: /proxy/meetings
    description: "List meetings with pagination"
    roles: [ProxyAdministrator, TransferAgent, Shareholder, Broker, InspectorOfElection]
    code: 200
    input: ["status?", "meeting_type?", "limit?", "offset?"]
    output: Meeting[]
    side_effects: []
  - method: GET
    path: /proxy/meetings/{id}
    description: "Read one meeting"
    roles: [ProxyAdministrator, TransferAgent, Shareholder, Broker, InspectorOfElection]
    code: 200
    input: []
    output: Meeting
    side_effects: []
  - method: PATCH
    path: /proxy/meetings/{id}
    description: "Amend meeting parameters; only in DRAFT or RECORD_DATE_LOCKED; OCC on Meeting.version"
    roles: [ProxyAdministrator]
    code: 200
    input: ["quorum_threshold_pct?", "meeting_datetime?", "meeting_mode?", "outstanding_shares?", expected_meeting_version]
    output: Meeting
    side_effects: ["increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/lock-record-date
    description: "Lock the record date; snapshots the shareholder list (accounts PENDING -> ELIGIBLE)"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Meeting
    side_effects: ["ShareholderAccounts PENDING -> ELIGIBLE", "increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/open-voting
    description: "Open voting channels"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Meeting
    side_effects: ["increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/convene
    description: "Convene the meeting; requires logical clock >= meeting_datetime"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Meeting
    side_effects: ["increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/adjourn
    description: "Adjourn an in-progress meeting (voting suspended)"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Meeting
    side_effects: ["increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/reconvene
    description: "Reconvene an adjourned meeting"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Meeting
    side_effects: ["increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/conclude
    description: "Conclude the meeting; FINAL quorum must be met with walk_in_shares included; closes voting"
    roles: [ProxyAdministrator]
    code: 200
    input: ["walk_in_shares?"]
    output: Meeting
    side_effects: ["Meeting.walk_in_shares set", "increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/cancel
    description: "Cancel a meeting in DRAFT or RECORD_DATE_LOCKED"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Meeting
    side_effects: ["increments Meeting.version by 1"]
  - method: POST
    path: /proxy/meetings/{id}/file-8k
    description: "File certified results (8-K); meeting must be RESULTS_CERTIFIED"
    roles: [ProxyAdministrator]
    code: 200
    input: [filing_reference]
    output: Meeting
    side_effects: ["filed_at and filing_reference set", "increments Meeting.version by 1"]
  - method: GET
    path: /proxy/meetings/{id}/quorum
    description: "Computed quorum read; variant PROVISIONAL (default) or FINAL"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["variant?"]
    output: { meeting_id: string, variant: string, shares_present: integer, outstanding_shares: integer, quorum_pct_bp: integer, threshold_bp: integer, quorum_met: boolean }
    side_effects: []

  # ---- Shareholder accounts ----
  - method: POST
    path: /proxy/shareholder-accounts
    description: "Add a record-date shareholder account; meeting must be DRAFT"
    roles: [TransferAgent]
    code: 201
    input: [meeting_id, holder_name, account_number, share_class, shares_held, "address_key?", "email?", "delivery_preference?", "householding_opt_out?"]
    output: ShareholderAccount
    side_effects: ["control_number minted", "status PENDING"]
  - method: GET
    path: /proxy/shareholder-accounts
    description: "List accounts; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["meeting_id?", "status?", "delivery_preference?", "limit?", "offset?"]
    output: ShareholderAccount[]
    side_effects: []
  - method: GET
    path: /proxy/shareholder-accounts/{id}
    description: "Read one account; Shareholder may read only its own id"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Shareholder]
    code: 200
    input: []
    output: ShareholderAccount
    side_effects: []
  - method: PATCH
    path: /proxy/shareholder-accounts/{id}
    description: "Update delivery preference / householding opt-out; allowed while meeting is before MEETING_HELD"
    roles: [Shareholder, TransferAgent]
    code: 200
    input: ["delivery_preference?", "householding_opt_out?"]
    output: ShareholderAccount
    side_effects: []

  # ---- Broker search ----
  - method: POST
    path: /proxy/broker-searches
    description: "Request a broker search; meeting must be RECORD_DATE_LOCKED or MATERIALS_DISTRIBUTED"
    roles: [TransferAgent]
    code: 201
    input: [meeting_id, broker_code, broker_name]
    output: BrokerSearchRecord
    side_effects: ["status REQUESTED"]
  - method: GET
    path: /proxy/broker-searches
    description: "List broker search records; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Broker]
    code: 200
    input: ["meeting_id?", "status?", "limit?", "offset?"]
    output: BrokerSearchRecord[]
    side_effects: []
  - method: GET
    path: /proxy/broker-searches/{id}
    description: "Read one broker search record"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Broker]
    code: 200
    input: []
    output: BrokerSearchRecord
    side_effects: []
  - method: POST
    path: /proxy/broker-searches/{id}/respond
    description: "Broker responds with omnibus share position"
    roles: [Broker]
    code: 200
    input: [shares_reported]
    output: BrokerSearchRecord
    side_effects: ["REQUESTED -> RESPONDED", "shares_reported stored"]

  # ---- Material distribution ----
  - method: POST
    path: /proxy/material-distributions/generate
    description: "Generate (or regenerate) proxy material packages with householding consolidation; first generation moves meeting RECORD_DATE_LOCKED -> MATERIALS_DISTRIBUTED and activates DRAFT proposals"
    roles: [ProxyAdministrator]
    code: 201
    input: [meeting_id]
    output: MaterialDistribution[]
    side_effects: ["non-SUPERSEDED packages -> SUPERSEDED", "householding_grouping creates new ACTIVE packages", "first generation: Meeting -> MATERIALS_DISTRIBUTED, DRAFT Proposals -> ACTIVE, increments Meeting.version by 1"]
  - method: GET
    path: /proxy/material-distributions
    description: "List distribution packages; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["meeting_id?", "status?", "channel?", "representative_account_id?", "covered_account_ids?", "limit?", "offset?"]
    output: MaterialDistribution[]
    side_effects: []
  - method: GET
    path: /proxy/material-distributions/{id}
    description: "Read one package"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: []
    output: MaterialDistribution
    side_effects: []
  - method: PATCH
    path: /proxy/material-distributions/{id}
    description: "Record delivery outcome for an ACTIVE package"
    roles: [ProxyAdministrator]
    code: 200
    input: [delivery_outcome]
    output: MaterialDistribution
    side_effects: ["ACTIVE -> DELIVERED | BOUNCED"]

  # ---- Proposals ----
  - method: POST
    path: /proxy/proposals
    description: "Create an agenda proposal in DRAFT; meeting must be DRAFT or RECORD_DATE_LOCKED"
    roles: [ProxyAdministrator]
    code: 201
    input: [meeting_id, proposal_number, title, proposal_type, vote_standard, "board_recommendation?"]
    output: Proposal
    side_effects: []
  - method: GET
    path: /proxy/proposals
    description: "List proposals; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Shareholder, Broker]
    code: 200
    input: ["meeting_id?", "status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: GET
    path: /proxy/proposals/{id}
    description: "Read one proposal"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Shareholder, Broker]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: POST
    path: /proxy/proposals/{id}/withdraw
    description: "Withdraw a DRAFT or ACTIVE proposal; supersedes its VALIDATED votes"
    roles: [ProxyAdministrator]
    code: 200
    input: []
    output: Proposal
    side_effects: ["VALIDATED VoteInstructions on this proposal -> SUPERSEDED", "tabulation and quorum recomputed"]
  - method: GET
    path: /proxy/proposals/{id}/tabulation
    description: "Computed tabulation read; variant UNOFFICIAL (default) or CERTIFIED"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["variant?"]
    output: { proposal_id: string, variant: string, for_votes: integer, against_votes: integer, abstain_votes: integer, withhold_votes: integer, votes_cast: integer, projected_outcome: string }
    side_effects: []

  # ---- Vote instructions ----
  - method: POST
    path: /proxy/vote-instructions
    description: "Cast a vote; supersedes any prior VALIDATED vote for the same account+proposal (latest valid vote wins)"
    roles: [Shareholder, Broker, ProxyAdministrator]
    code: 201
    input: [meeting_id, proposal_id, account_id, channel, choice, "shares_voted?", "control_number?"]
    output: VoteInstruction
    side_effects: ["prior VALIDATED vote for account+proposal -> SUPERSEDED", "weighted_tabulation recomputed", "quorum_calculation recomputed"]
  - method: GET
    path: /proxy/vote-instructions
    description: "List vote instructions; filterable; Shareholder sees only its own account's votes"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Shareholder, Broker]
    code: 200
    input: ["meeting_id?", "proposal_id?", "account_id?", "channel?", "status?", "limit?", "offset?"]
    output: VoteInstruction[]
    side_effects: []
  - method: GET
    path: /proxy/vote-instructions/{id}
    description: "Read one vote instruction; Shareholder may read only votes on its own account"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection, Shareholder]
    code: 200
    input: []
    output: VoteInstruction
    side_effects: []
  - method: POST
    path: /proxy/vote-instructions/{id}/revoke
    description: "Revoke a VALIDATED vote while voting is open"
    roles: [Shareholder, ProxyAdministrator]
    code: 200
    input: []
    output: VoteInstruction
    side_effects: ["VALIDATED -> REVOKED", "weighted_tabulation recomputed", "quorum_calculation recomputed"]

  # ---- Virtual meeting platform sessions ----
  - method: POST
    path: /proxy/platform-sessions
    description: "Book a rehearsal/live session on the meeting's virtual platform; half-open [start_at, end_at) windows; overlapping sessions rejected, adjacent allowed"
    roles: [ProxyAdministrator]
    code: 201
    input: [meeting_id, session_type, start_at, end_at]
    output: MeetingPlatformSession
    side_effects: []
  - method: GET
    path: /proxy/platform-sessions
    description: "List sessions; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["meeting_id?", "session_type?", "limit?", "offset?"]
    output: MeetingPlatformSession[]
    side_effects: []
  - method: GET
    path: /proxy/platform-sessions/{id}
    description: "Read one session"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: []
    output: MeetingPlatformSession
    side_effects: []

  # ---- Question moderation ----
  - method: POST
    path: /proxy/question-submissions
    description: "Submit a question for a VIRTUAL/HYBRID meeting while VOTING_OPEN or MEETING_IN_PROGRESS"
    roles: [Shareholder]
    code: 201
    input: [meeting_id, account_id, question_text]
    output: QuestionSubmission
    side_effects: []
  - method: GET
    path: /proxy/question-submissions
    description: "List questions; filterable; Shareholder sees only its own"
    roles: [ProxyAdministrator, InspectorOfElection, Shareholder]
    code: 200
    input: ["meeting_id?", "account_id?", "status?", "limit?", "offset?"]
    output: QuestionSubmission[]
    side_effects: []
  - method: GET
    path: /proxy/question-submissions/{id}
    description: "Read one question; Shareholder may read only its own"
    roles: [ProxyAdministrator, InspectorOfElection, Shareholder]
    code: 200
    input: []
    output: QuestionSubmission
    side_effects: []
  - method: POST
    path: /proxy/question-submissions/{id}/moderate
    description: "Moderate a SUBMITTED question"
    roles: [ProxyAdministrator]
    code: 200
    input: [action, "moderation_note?"]
    output: QuestionSubmission
    side_effects: ["SUBMITTED -> APPROVED | REJECTED | RETURNED", "moderation_note stored"]
  - method: POST
    path: /proxy/question-submissions/{id}/resubmit
    description: "Resubmit a RETURNED question with edited text"
    roles: [Shareholder]
    code: 200
    input: [question_text]
    output: QuestionSubmission
    side_effects: ["RETURNED -> SUBMITTED", "question_text replaced", "moderation_note cleared"]

  # ---- Vote challenges ----
  - method: POST
    path: /proxy/vote-challenges
    description: "Challenge a VALIDATED vote; meeting must be MEETING_IN_PROGRESS, MEETING_HELD, or RESULTS_CERTIFIED"
    roles: [InspectorOfElection]
    code: 201
    input: [meeting_id, vote_instruction_id, reason]
    output: VoteChallenge
    side_effects: []
  - method: GET
    path: /proxy/vote-challenges
    description: "List challenges; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["meeting_id?", "vote_instruction_id?", "status?", "limit?", "offset?"]
    output: VoteChallenge[]
    side_effects: []
  - method: GET
    path: /proxy/vote-challenges/{id}
    description: "Read one challenge"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: []
    output: VoteChallenge
    side_effects: []
  - method: POST
    path: /proxy/vote-challenges/{id}/adjudicate
    description: "Rule on an OPEN challenge; UPHELD invalidates the vote and cascades through tabulation, quorum, and any non-superseded certification"
    roles: [InspectorOfElection]
    code: 200
    input: [ruling, "resolution_note?"]
    output: VoteChallenge
    side_effects: ["UPHELD: vote INVALIDATED -> tabulation recompute -> quorum recompute -> DRAFT/SIGNED certification SUPERSEDED (SIGNED also reverts meeting to MEETING_HELD and proposals to ACTIVE)"]

  # ---- Solicitation campaigns ----
  - method: POST
    path: /proxy/solicitation-campaigns
    description: "Book a solicitation contact window on the meeting's shareholder list; CONTESTED meetings only; same-party windows must be separated by at least 24h"
    roles: [ProxyAdministrator]
    code: 201
    input: [meeting_id, soliciting_party, start_at, end_at]
    output: SolicitationCampaign
    side_effects: []
  - method: GET
    path: /proxy/solicitation-campaigns
    description: "List campaigns; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["meeting_id?", "soliciting_party?", "limit?", "offset?"]
    output: SolicitationCampaign[]
    side_effects: []
  - method: GET
    path: /proxy/solicitation-campaigns/{id}
    description: "Read one campaign"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: []
    output: SolicitationCampaign
    side_effects: []

  # ---- Inspector certification ----
  - method: POST
    path: /proxy/inspector-certifications
    description: "Create a DRAFT certification snapshot; meeting must be MEETING_HELD with no OPEN challenges; supersedes any existing DRAFT"
    roles: [InspectorOfElection]
    code: 201
    input: [meeting_id]
    output: InspectorCertification
    side_effects: ["existing DRAFT certification -> SUPERSEDED", "snapshots FINAL quorum and CERTIFIED outcomes"]
  - method: GET
    path: /proxy/inspector-certifications
    description: "List certifications; filterable"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: ["meeting_id?", "status?", "limit?", "offset?"]
    output: InspectorCertification[]
    side_effects: []
  - method: GET
    path: /proxy/inspector-certifications/{id}
    description: "Read one certification"
    roles: [ProxyAdministrator, TransferAgent, InspectorOfElection]
    code: 200
    input: []
    output: InspectorCertification
    side_effects: []
  - method: POST
    path: /proxy/inspector-certifications/{id}/sign
    description: "Sign a DRAFT certification; signer must differ from creator; OCC on Meeting.version"
    roles: [InspectorOfElection]
    code: 200
    input: [expected_meeting_version]
    output: InspectorCertification
    side_effects: ["DRAFT -> SIGNED", "ACTIVE Proposals -> PASSED | FAILED per CERTIFIED tabulation", "Meeting -> RESULTS_CERTIFIED", "increments Meeting.version by 1"]

  # ---- Test-driving clock ----
  - method: POST
    path: /proxy/_clock/set_current_utc
    description: "Set the logical clock. Server startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; all system timestamps and temporal checks read this clock."
    roles: [ProxyAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, Shareholder acting on a non-owned account resource, or channel not permitted for the role on vote create" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, unparseable datetime, non-positive number, end_at <= start_at, or campaign end after meeting_datetime" }
  - { id: ERR_MEETING_NOT_FOUND, http: 404, condition: "Meeting id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "ShareholderAccount id does not exist" }
  - { id: ERR_PROPOSAL_NOT_FOUND, http: 404, condition: "Proposal id does not exist" }
  - { id: ERR_VOTE_NOT_FOUND, http: 404, condition: "VoteInstruction id does not exist" }
  - { id: ERR_QUESTION_NOT_FOUND, http: 404, condition: "QuestionSubmission id does not exist" }
  - { id: ERR_CHALLENGE_NOT_FOUND, http: 404, condition: "VoteChallenge id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "MeetingPlatformSession id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "SolicitationCampaign id does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "MaterialDistribution id does not exist" }
  - { id: ERR_BROKER_SEARCH_NOT_FOUND, http: 404, condition: "BrokerSearchRecord id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "InspectorCertification id does not exist" }
  - { id: ERR_INVALID_MEETING_STATE, http: 409, condition: "Meeting lifecycle state does not permit the requested transition or child operation" }
  - { id: ERR_VOTING_NOT_OPEN, http: 409, condition: "Vote create/revoke attempted while the meeting is not in VOTING_OPEN or MEETING_IN_PROGRESS" }
  - { id: ERR_PROPOSAL_NOT_ACTIVE, http: 409, condition: "Vote attempted on a proposal that is not ACTIVE, or withdraw attempted on a terminal proposal" }
  - { id: ERR_VOTE_NOT_ALTERABLE, http: 409, condition: "Revoke attempted on a SUPERSEDED, REVOKED, or INVALIDATED vote" }
  - { id: ERR_INVALID_QUESTION_STATE, http: 409, condition: "Moderate attempted on a non-SUBMITTED question, or resubmit on a non-RETURNED question" }
  - { id: ERR_CHALLENGE_NOT_OPEN, http: 409, condition: "Adjudicate attempted on an already-ruled challenge" }
  - { id: ERR_CERTIFICATION_NOT_DRAFT, http: 409, condition: "Sign attempted on a SIGNED or SUPERSEDED certification" }
  - { id: ERR_BROKER_SEARCH_ALREADY_RESPONDED, http: 409, condition: "Respond attempted on a RESPONDED broker search record" }
  - { id: ERR_DISTRIBUTION_NOT_ACTIVE, http: 409, condition: "Delivery-outcome PATCH attempted on a non-ACTIVE package" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Certification signer's X-User-ID equals the certification's created_by_user_id" }
  - { id: ERR_MEETING_NOT_YET_STARTED, http: 422, condition: "Convene attempted while the logical clock is before meeting_datetime" }
  - { id: ERR_RECORD_DATE_INVALID, http: 422, condition: "record_date is not strictly before meeting_datetime" }
  - { id: ERR_DUPLICATE_ACCOUNT_NUMBER, http: 409, condition: "account_number already exists within the meeting" }
  - { id: ERR_DUPLICATE_PROPOSAL_NUMBER, http: 409, condition: "proposal_number already exists within the meeting" }
  - { id: ERR_DUPLICATE_BROKER_CODE, http: 409, condition: "broker_code already exists within the meeting" }
  - { id: ERR_INVALID_CONTROL_NUMBER, http: 422, condition: "INTERNET/PHONE/MAIL vote with missing or mismatched control_number" }
  - { id: ERR_SHARES_EXCEED_HELD, http: 422, condition: "shares_voted <= 0 or exceeds account.shares_held" }
  - { id: ERR_CHOICE_NOT_ALLOWED, http: 422, condition: "WITHHOLD on a non-DIRECTOR_ELECTION proposal, or AGAINST/ABSTAIN on a DIRECTOR_ELECTION proposal" }
  - { id: ERR_MEETING_MODE_INCOMPATIBLE, http: 422, condition: "Platform session or question submission on an IN_PERSON meeting" }
  - { id: ERR_MEETING_NOT_CONTESTED, http: 422, condition: "Solicitation campaign attempted on a non-CONTESTED meeting" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "Session window [start_at, end_at) overlaps an existing session of the same meeting; adjacency (touching endpoints) is allowed" }
  - { id: ERR_CAMPAIGN_WINDOW_OVERLAP, http: 409, condition: "Same-party campaign windows closer than 24 hours (gap must be >= 24h between one window's end_at and the next window's start_at, in either direction)" }
  - { id: ERR_NO_ACTIVE_PROPOSAL, http: 422, condition: "open-voting attempted with no ACTIVE proposal" }
  - { id: ERR_BROKER_SEARCH_INCOMPLETE, http: 422, condition: "open-voting attempted while a BrokerSearchRecord remains REQUESTED" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "conclude attempted while FINAL-variant quorum (including walk_in_shares) is below threshold" }
  - { id: ERR_UNRESOLVED_CHALLENGES, http: 422, condition: "Certification create/sign attempted while a VoteChallenge is OPEN" }
  - { id: ERR_CROSS_MEETING_REFERENCE, http: 422, condition: "Body-referenced proposal/account/vote belongs to a different meeting than the request's meeting_id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_meeting_version does not match the Meeting's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProxyAdministrator
    description: "Proxy agent operations staff; owns meeting lifecycle, materials, platform sessions, solicitation campaigns, question moderation, and the 8-K filing"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /proxy/meetings and all meeting lifecycle actions (lock-record-date, open-voting, convene, adjourn, reconvene, conclude, cancel, file-8k)"
      - "POST /proxy/material-distributions/generate and PATCH /proxy/material-distributions/{id}"
      - "POST /proxy/proposals and POST /proxy/proposals/{id}/withdraw"
      - "POST /proxy/platform-sessions, POST /proxy/solicitation-campaigns"
      - "POST /proxy/question-submissions/{id}/moderate"
      - "IN_PERSON-channel vote creation"
      - "POST /proxy/_clock/set_current_utc"
    shared_operations:
      - "GET reads across all collections"
      - "POST /proxy/vote-instructions/{id}/revoke"
  - name: TransferAgent
    description: "Transfer agent; builds the record-date shareholder list and runs broker search"
    identity: opaque
    exclusive_operations:
      - "POST /proxy/shareholder-accounts"
      - "POST /proxy/broker-searches"
    shared_operations:
      - "GET reads across all collections"
      - "PATCH /proxy/shareholder-accounts/{id}"
  - name: Shareholder
    description: "Registered holder on the record-date list; votes, manages delivery preference, asks questions"
    identity: "entity_backed:ShareholderAccount"
    exclusive_operations:
      - "INTERNET/PHONE/MAIL-channel vote creation on its own account (control_number required)"
      - "POST /proxy/question-submissions and POST /proxy/question-submissions/{id}/resubmit on its own account"
    shared_operations:
      - "PATCH /proxy/shareholder-accounts/{id} (own id only)"
      - "POST /proxy/vote-instructions/{id}/revoke (own account's votes only)"
      - "GET reads of its own account, votes, questions; GET /proxy/meetings, /proxy/meetings/{id}, /proxy/proposals"
  - name: Broker
    description: "Broker/dealer respondent; answers broker search and submits omnibus votes"
    identity: opaque
    exclusive_operations:
      - "POST /proxy/broker-searches/{id}/respond"
      - "BROKER-channel vote creation (control_number exempt)"
    shared_operations:
      - "GET reads of meetings, proposals, broker searches, vote instructions"
  - name: InspectorOfElection
    description: "Independent inspector; adjudicates vote challenges and certifies results; may not sign a certification it created (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /proxy/vote-challenges and POST /proxy/vote-challenges/{id}/adjudicate"
      - "POST /proxy/inspector-certifications and POST /proxy/inspector-certifications/{id}/sign"
    shared_operations:
      - "GET reads across all collections"
