      - name: rejected_deliverable_can_be_accepted_on_a_second_pass
        claim_type: action_endpoint
        grounds:
          - entities.Project.fields.om_manual_status
          - errors[ERR_DELIVERABLE_ALREADY_ACCEPTED]
          - validations[priority=34]
        distinguishing_aspect: |
          deliverable-acceptance addresses one of three independent Project fields and REJECTED is
          not terminal: the O&M manual moves PENDING -> REJECTED -> ACCEPTED while
          operator_training_status and spare_parts_list_status stay PENDING, which is why the
          already-accepted guard keys on ACCEPTED rather than on any prior decision.
        test_recipe:
          setup:
            - 'one DRAFT project with all three deliverable statuses PENDING'
            - 'own-1 has already recorded a REJECT on OM_MANUAL, so om_manual_status is REJECTED'
          setup_api_calls:
            - call: "POST /water-treatment/_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /water-treatment/projects"
              payload: { name: "Northgate WTP Membrane Upgrade", owner_agency_name: "City of Northgate", procurement_type: "MUNICIPAL_BID", bid_due_at: "2026-09-15T00:00:00.000Z", guarantee_deadline_at: "2027-06-30T00:00:00.000Z", footprint_allowance_sf_per_stage: 6000.0 }
              as: ContractsAdministrator
              as_user_id: "ca-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /water-treatment/projects/${proj_id}/deliverable-acceptance"
              payload: { deliverable_type: "OM_MANUAL", decision: "REJECT" }
              as: OwnerRepresentative
              as_user_id: "own-1"
          trigger:
            - call: "POST /water-treatment/projects/${proj_id}/deliverable-acceptance"
              payload: { deliverable_type: "OM_MANUAL", decision: "ACCEPT" }
              as: OwnerRepresentative
              as_user_id: "own-1"
          assert:
            - 'HTTP status == 200'
            - 'Project.${proj_id}.om_manual_status == "ACCEPTED"'
            - 'Project.${proj_id}.operator_training_status == "PENDING"'
            - 'Project.${proj_id}.spare_parts_list_status == "PENDING"'
            - 'Project.${proj_id}.status == "DRAFT"'
