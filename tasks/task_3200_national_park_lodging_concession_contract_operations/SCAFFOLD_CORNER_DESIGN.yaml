              as: ConcessionerFrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST — beds_occupied is required iff ACTUAL_HEADCOUNT"

      - name: stale_contract_version_rejected_with_412
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - concurrency_rules[rate-filing-create-stale-contract]
          - errors.ERR_STALE_CONTRACT_VERSION
        distinguishing_aspect: "OCC: after a filing create bumped Contract.version, a second create carrying the stale expected version is rejected 412 ERR_STALE_CONTRACT_VERSION — a deterministic two-sequential-request race replay."
        test_recipe:
          setup:
