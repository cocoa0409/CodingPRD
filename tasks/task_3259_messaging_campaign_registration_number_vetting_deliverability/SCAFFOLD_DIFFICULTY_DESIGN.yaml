scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: message_fee_short_vs_long_message
        grounds:
          - calculations.segments_and_fee
          - entities.Message.fields.segments
          - entities.Charge.fields.kind
        distinguishing_aspect: |
          Same sender, same carrier: a GSM-7 body of 160 chars (1 segment) bills
          75 + 40 = 115 cents total, while a GSM-7 body of 640 chars (4 segments)
          bills 4*75 + 4*40 + 50 = 510 cents — the long-message variant adds the
          one-time 50-cent surcharge only when segments > 3, on the Message/Charge
          domain.
        test_recipe:
          setup:
            - "US PREMIUM account with VERIFIED brand (identity_score 95) and APPROVED TEN_DLC campaign (allocated_mps 10)"
            - "ACTIVE TEN_DLC number attached to the campaign"
            - "ACTIVE consent for recipients +15550000001 and +15550000002"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "62701", country_code: "US", website_url: "https://acme.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "Promo alerts", sample_messages: ["Sale today"], help_message: "Reply HELP", stop_message: "Reply STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000001", evidence_url: "https://evidence/1", evidence_text: "web form", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000002", evidence_url: "https://evidence/2", evidence_text: "web form", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/messages"
              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000001", body: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", carrier_code: "VZW" }
              as: CampaignManager
              captures: { msg_short: $.data.id }
            - call: "POST /messaging/accounts/${acct}/messages"
              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000002", body: "", carrier_code: "VZW" }
              as: CampaignManager
              captures: { msg_long: $.data.id }
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /messaging/accounts/${acct}/charges"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Message.${msg_short}.segments == 1"
            - "Message.${msg_long}.segments == 4"
            - "Charge list contains exactly 2 MESSAGE charges with amounts 75 and 300"
            - "Charge list contains exactly 2 CARRIER_PASSTHROUGH charges with amounts 40 and 180"
            - "Total of the four message-related charges == 595 == (75+40) + (4*75 + 4*40 + 50)"

      - name: throughput_flat_tollfree_vs_tiered_tendlc
        grounds:
          - calculations.throughput_allocation
          - entities.Campaign.fields.allocated_mps
          - entities.Campaign.fields.trust_score
        distinguishing_aspect: |
          On the Campaign domain: a TEN_DLC campaign backed by a brand with
          identity_score 95 gets tiered allocated_mps 10, while a TOLL_FREE
          campaign backed by a brand with identity_score 90 gets the flat
          constant 3 — the flat variant ignores trust_score entirely.
        test_recipe:
          setup:
            - "US PREMIUM account; brand A identity_score 95 (PUBLIC_PROFIT + valid tax_id + valid postal + website + WEB_FORM); brand B identity_score 90 (NON_PROFIT + valid tax_id + valid postal + website + POINT_OF_SALE)"
            - "Campaign C1 TEN_DLC under brand A; campaign C2 TOLL_FREE under brand B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "62701", country_code: "US", website_url: "https://acme.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand_a: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand_a}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand_a}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Charity Inc", tax_id: "98-7654321", business_type: "NON_PROFIT", address_line1: "2 Oak St", city: "Springfield", region_code: "IL", postal_code: "62702", country_code: "US", website_url: "https://charity.example", opt_in_mechanism: "POINT_OF_SALE" }
              as: BrandManager
              captures: { brand_b: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand_b}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand_b}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand_a}", use_case: "MARKETING", description: "Promos", sample_messages: ["Hi"], help_message: "HELP", stop_message: "STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp1: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp1}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand_b}", use_case: "TRANSACTIONAL", description: "Alerts", sample_messages: ["Alert"], help_message: "HELP", stop_message: "STOP", path_kind: "TOLL_FREE" }
              as: CampaignManager
              captures: { camp2: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp2}/submit"
              payload: {}
              as: CampaignManager
          trigger:
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp1}"
              payload: {}
              as: CampaignManager
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp2}"
              payload: {}
              as: CampaignManager
          assert:
            - "Brand.${brand_a}.identity_score == 95"
            - "Brand.${brand_b}.identity_score == 90"
            - "Campaign.${camp1}.trust_score == 95"
            - "Campaign.${camp1}.allocated_mps == 10"
            - "Campaign.${camp2}.trust_score == 50"
            - "Campaign.${camp2}.allocated_mps == 3"
            - "Campaign.${camp2}.allocated_mps != Campaign.${camp1}.allocated_mps despite brand B's higher identity_score"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: snapshot_metrics_mode_a_multi_input_thresholds
        grounds:
          - calculations.snapshot_metrics
          - calculations.spam_floor_check
          - entities.DailySnapshot.fields.spam_rate_bps
        distinguishing_aspect: |
          Mode (a): snapshot_metrics has 4+ inputs (attempted, delivered, blocked,
          spam) with non-linear interaction — floor-based bps rates feed a nested
          conditional spam-floor check gated on BOTH attempted >= 2000 AND
          spam_rate_bps >= 300; 2999 attempted with 9 spam yields floor(10000*9/2999)
          = 30 bps and no suspension.
        test_recipe:
          setup:
            - "APPROVED TEN_DLC campaign with attached ACTIVE number; consent for +15550000010"
            - "One delivered message already exists (attempted baseline)"
            - "9 SPAM_COMPLAINT feedback events recorded against the campaign on 2026-09-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "62701", country_code: "US", website_url: "https://acme.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "Promos", sample_messages: ["Hi"], help_message: "HELP", stop_message: "STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
            - call: "POST /messaging/accounts/${acct}/consent_records"
              payload: { brand_id: "${brand}", phone_number: "+15550000010", evidence_url: "https://evidence/10", evidence_text: "web form", captured_at: "2026-09-01T00:00:00Z", consent_method: "WEB_FORM" }
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/messages"
              payload: { campaign_id: "${camp}", sender_number_id: "${num}", to_number: "+15550000010", body: "Hello", carrier_code: "VZW" }
              as: CampaignManager
              captures: { msg1: $.data.id }
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /messaging/accounts/${acct}/messages/${msg1}/delivery_outcome"
              payload: { outcome: "DELIVERED" }
              as: SystemDriver
            - call: "POST /messaging/accounts/${acct}/feedback_events"
              payload: { campaign_id: "${camp}", kind: "SPAM_COMPLAINT", message_id: "${msg1}" }
              as: SystemDriver
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/snapshots"
              payload: { day_utc: "2026-09-01" }
              as: DeliverabilityAnalyst
              captures: { snap: $.data.id }
          assert:
            - "DailySnapshot.${snap}.attempted == 1"
            - "DailySnapshot.${snap}.delivered == 1"
            - "DailySnapshot.${snap}.delivery_rate_pct == 100.0"
            - "DailySnapshot.${snap}.spam == 1"
            - "DailySnapshot.${snap}.spam_rate_bps == 10000"
            - "DailySnapshot.${snap}.block_rate_bps == 0"
            - "Campaign.${camp}.status == APPROVED (attempted 1 < SPAM_FLOOR_MIN_VOLUME 2000, so no suspension despite spam_rate_bps 10000 >= 300)"

      - name: registration_fees_mode_c_evaluation_order
        grounds:
          - calculations.registration_fees
          - entities.Charge.fields.kind
          - entities.Campaign.fields.recurring_fee_last_charge_at
        distinguishing_aspect: |
          Mode (c): recurring fee depends on recurring_fee_last_charge_at, which
          itself is only set by a prior fee emission — the scaffold pins
          evaluation order as 'first run after approval always charges; later
          runs charge only when clock >= last_charge + 30 days', so two runs one
          day apart charge exactly once total while two runs 31 days apart
          charge twice, never thrice.
        test_recipe:
          setup:
            - "APPROVED TEN_DLC campaign on 2026-09-01; no run_ops has happened yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "62701", country_code: "US", website_url: "https://acme.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "Promos", sample_messages: ["Hi"], help_message: "HELP", stop_message: "STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
          trigger:
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
              captures: { run1_fees: $.data.recurring_fees_charged }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
              captures: { run2_fees: $.data.recurring_fees_charged }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /messaging/accounts/${acct}/run_ops"
              payload: {}
              as: PlatformAdmin
              captures: { run3_fees: $.data.recurring_fees_charged }
          assert:
            - "run1_fees == 1 (first run after approval always charges)"
            - "run2_fees == 0 (1 day later < 30-day window)"
            - "run3_fees == 1 (32 days after 2026-09-01 >= 30-day window)"
            - "GET /messaging/accounts/${acct}/charges?kind=CAMPAIGN_RECURRING shows exactly 2 charges of 1000 cents each"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: brand_resubmission_cycle_to_revocation
        grounds:
          - state_machines.Brand.PENDING_VERIFICATION_to_UNVERIFIED
          - state_machines.Brand.UNVERIFIED_to_PENDING_VERIFICATION
          - entities.Brand.fields.resubmission_count
        distinguishing_aspect: |
          Brand cycles DRAFT -> PENDING_VERIFICATION -> UNVERIFIED ->
          PENDING_VERIFICATION (a revision loop); the third fail flips the
          terminal outcome to REVOKED instead of UNVERIFIED because
          resubmission_count reaches MAX_RESUBMISSIONS (3).
        test_recipe:
          setup:
            - "US PREMIUM account; brand with LOW-scoring profile (identity_score 50: PRIVATE_PROFIT, empty website, invalid tax_id 'X', invalid postal 'X')"
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Mystery LLC", tax_id: "X", business_type: "PRIVATE_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "X", country_code: "US", website_url: "", opt_in_mechanism: "KEYWORD" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/fail"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/fail"
              payload: {}
              as: CarrierReviewer
          trigger:
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/fail"
              payload: {}
              as: CarrierReviewer
          assert:
            - "Brand.${brand}.identity_score == 50"
            - "Brand.${brand}.resubmission_count == 3"
            - "Brand.${brand}.status == REVOKED (third fail lands terminal, not UNVERIFIED)"
            - "GET /messaging/accounts/${acct}/charges?kind=BRAND_VETTING shows exactly 3 charges of 200 cents (one per submit round)"

      - name: campaign_review_cycle_with_repeated_rejection
        grounds:
          - state_machines.Campaign.PENDING_REVIEW_to_REJECTED
          - state_machines.Campaign.REJECTED_to_PENDING_REVIEW
          - entities.Campaign.fields.rejected_cycle_count
        distinguishing_aspect: |
          Campaign cycles DRAFT -> PENDING_REVIEW -> REJECTED -> PENDING_REVIEW
          (its own revision loop on a different entity than Brand); the second
          resubmit attempt after REJECTED requires OCC (expected_campaign_version)
          because Campaign.version advanced through the reject transition.
        test_recipe:
          setup:
            - "VERIFIED brand (identity_score 95); TEN_DLC campaign submitted, rejected with CONTENT_VIOLATION, resubmitted, rejected again"
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Acme Corp", tax_id: "12-3456789", business_type: "PUBLIC_PROFIT", address_line1: "1 Main St", city: "Springfield", region_code: "IL", postal_code: "62701", country_code: "US", website_url: "https://acme.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "Promos", sample_messages: ["Hi"], help_message: "HELP", stop_message: "STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/reject"
              payload: { rejection_reason_code: "CONTENT_VIOLATION" }
              as: CarrierReviewer
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: { expected_campaign_version: "${camp_v}" }
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/reject"
              payload: { rejection_reason_code: "SAMPLE_MESSAGE_INSUFFICIENT" }
              as: CarrierReviewer
          assert:
            - "Campaign.${camp}.status == REJECTED"
            - "Campaign.${camp}.rejected_cycle_count == 2"
            - "Campaign.${camp}.rejection_reason_code == 'SAMPLE_MESSAGE_INSUFFICIENT'"
            - "GET /messaging/accounts/${acct}/charges?kind=CAMPAIGN_REGISTRATION shows exactly 2 charges of 1500 cents (each submit round is billable)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: account_suspend_three_level_cascade
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.Campaign.APPROVED_to_SUSPENDED
          - state_machines.SenderNumber.ACTIVE_to_SUSPENDED
          - calculations.cascade_suspend_account
        distinguishing_aspect: |
          Depth-3 chain triggered by POST accounts/{id}/suspend: the Account
          transition mutates Campaign (APPROVED -> SUSPENDED), and that campaign
          mutation itself triggers the SenderNumber mutation (ACTIVE ->
          SUSPENDED with suspended_reason='ACCOUNT_SUSPENDED') — the number is
          not touched by the account action directly.
        test_recipe:
          setup:
            - "ACTIVE account with VERIFIED brand, APPROVED TEN_DLC campaign, and one ACTIVE attached TEN_DLC number"
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
