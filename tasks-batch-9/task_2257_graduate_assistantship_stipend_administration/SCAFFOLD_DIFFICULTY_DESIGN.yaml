  - rule_id: boundary_precision_check
    instances:

      - name: effort_pct_exactly_at_insurance_minimum_is_eligible_with_band_seventy_five
        grounds:
          - calculations.appointment_effort_profile
          - entities.StipendPolicy.fields.insurance_min_effort_pct
          - entities.Appointment.fields.insurance_eligible
          - entities.Appointment.fields.tuition_remission_pct
