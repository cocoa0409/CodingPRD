        as: PlatformAdmin
      - call: POST /produce/supply-lots/${b_lot_round}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${b2v_lot_round}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
