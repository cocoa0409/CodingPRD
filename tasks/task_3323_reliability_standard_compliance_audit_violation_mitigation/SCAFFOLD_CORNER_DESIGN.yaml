            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Rbac Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /compliance/engagements", payload: { entity_id: "${e1}", engagement_type: "AUDIT", standard_ids: ["STD-GO-001"], period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHORIZED"
      - name: regional_reviewer_cannot_grant_federal_level_appeal
        claim_type: rbac_denial
        grounds: [roles, state_machines.Appeal, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "RegionalEntityReviewer attempting to grant an appeal in FEDERAL_REVIEW_REQUESTED status fails with ERR_UNAUTHORIZED (the federal level is FederalReviewer-exclusive)."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation appealed, regionally denied, federal review requested"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "FedRbac Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/appeals", payload: { grounds: "g", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { ap1: $.data.id } }
            - { call: "POST /compliance/appeals/${ap1}/deny", payload: {}, as: RegionalEntityReviewer }
            - { call: "POST /compliance/appeals/${ap1}/request-federal-review", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}" }
          trigger:
            - { call: "POST /compliance/appeals/${ap1}/grant", payload: {}, as: RegionalEntityReviewer, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHORIZED"
      - name: segregation_of_duties_plan_submitter_cannot_approve
        claim_type: rbac_denial
        grounds: ["validations[priority=26]", "errors[ERR_SOD_CONFLICT]"]
        distinguishing_aspect: "Segregation of duties is enforced by role separation: the plan was submitted by the EntityComplianceOfficer of the owning entity, and the approval endpoint rejects any caller whose role is not ComplianceAuditor; when the caller IS an auditor but is recorded as the same operator who performed the submission step (opaque auditor id equal to the recorded submitter), approval fails with ERR_SOD_CONFLICT. This instance pins the role-separation half: an officer attempting to approve their own plan gets ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation with plan P1 SUBMITTED by officer ${e1}"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Sod Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_UNAUTHORIZED"

  - section: cross_cutting_layers
    instances:
      - name: ops_run_checkpoint_sweeps_milestones_and_restrictions
        claim_type: rate_threshold_triggers
        grounds: [calculations.restriction_due, state_machines.Milestone.PENDING_to_MISSED]
        distinguishing_aspect: "One clock advance fires both sweeps: a PENDING milestone past due flips MISSED, and an entity with a confirmed past-due penalty flips RESTRICTED in the same advance."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation with approved plan and milestone due 2026-09-05; second violation with confirmed penalty issued 2026-09-01 (due 2026-10-01)"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Sweep Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "POST /compliance/violations/${v1}/mitigation-plans", payload: { description: "p", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { p1: $.data.id } }
            - { call: "POST /compliance/mitigation-plans/${p1}/approve", payload: {}, as: ComplianceAuditor }
            - { call: "POST /compliance/mitigation-plans/${p1}/milestones", payload: { title: "m", due_date: "2026-09-05T00:00:00Z" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { m1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-002", source_type: "SPOT_CHECK", violation_start: "2026-02-01T00:00:00Z", violation_end: "2026-02-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v2: $.data.id } }
            - { call: "POST /compliance/penalties", payload: { violation_id: "${v2}" }, as: ComplianceAuditor, captures: { pen2: $.data.id } }
            - { call: "POST /compliance/penalties/${pen2}/confirm", payload: {}, as: ComplianceAuditor }
          trigger:
            - { call: "POST /compliance/_clock/advance", payload: { seconds: 2678400 }, as: RegionalEntityReviewer }
            - { call: "GET /compliance/milestones/${m1}", payload: {}, as: ComplianceAuditor, captures: { m_st: $.data.status } }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { e_st: $.data.compliance_status } }
          assert:
            - "captured m_st == MISSED"
            - "captured e_st == RESTRICTED"
      - name: derived_field_reconciliation_on_violation_close
        claim_type: derived_field_reconciliation
        grounds: [entities.RegisteredEntity.fields.open_violation_count]
        distinguishing_aspect: "open_violation_count tracks create (+1), appeal (no change), closure (-1): reads after each step show 1, 1, 0."
        test_recipe:
          setup: ["clock at 2026-09-01; entity E1 [GO]; violation created then appealed then appeal granted"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegionalEntityReviewer }
            - { call: "POST /compliance/registrations", payload: { legal_name: "Recon Co", registration_functions: ["GO"] }, as: RegistrationCoordinator, captures: { e1: $.data.id } }
            - { call: "POST /compliance/violations", payload: { entity_id: "${e1}", standard_id: "STD-GO-001", source_type: "SPOT_CHECK", violation_start: "2026-01-01T00:00:00Z", violation_end: "2026-01-02T00:00:00Z", violation_risk_factor: "MINIMAL", severity_level: "LOWER" }, as: ComplianceAuditor, captures: { v1: $.data.id, v1_ver: $.data.version } }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { c1: $.data.open_violation_count } }
            - { call: "POST /compliance/violations/${v1}/appeals", payload: { grounds: "g", expected_violation_version: "${v1_ver}" }, as: EntityComplianceOfficer, as_user_id: "${e1}", captures: { ap1: $.data.id } }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { c2: $.data.open_violation_count } }
          trigger:
            - { call: "POST /compliance/appeals/${ap1}/grant", payload: {}, as: RegionalEntityReviewer }
            - { call: "GET /compliance/registrations/${e1}", payload: {}, as: ComplianceAuditor, captures: { c3: $.data.open_violation_count } }
          assert:
            - "captured c1 == 1"
            - "captured c2 == 1"
            - "captured c3 == 0"
