# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-difficulty claims)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. claim_type values are snake_case
# of the claim rows in references/claim-extraction-guide.md. Instances already
# exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: fund_creation_applies_system_defaults
        claim_type: creation
        grounds: [entities.Fund.fields.last_closed_fiscal_year_end]
        distinguishing_aspect: "A created Fund starts with version 1, a server-minted UUID id, and last_closed_fiscal_year_end null."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-08-01T00:00:00Z default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: 100000000, rate_bps: 50 }, { up_to_net_assets: null, rate_bps: 40 } ] }, as: FundController, captures: { fund_id: "$.data.id", fund_v: "$.data.version" } }
          assert:
            - "HTTP 201; ${fund_id} is a UUID without type prefix; ${fund_v} == 1"
            - "Fund.${fund_id}.last_closed_fiscal_year_end == null and created_at == 2026-08-01T00:00:00.000Z (logical clock default)"

      - name: share_class_create_missing_required_returns_400
        claim_type: required_fields
        grounds: [entities.ShareClass.fields.fund_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field fund_id on class creation is rejected with ERR_VALIDATION before any existence check on other fields."
        test_recipe:
          setup: ["One fund exists"]
          setup_api_calls:
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController }
          trigger:
            - { call: "POST /share-classes", payload: { class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_VALIDATION (http 400); no ShareClass is created"

      - name: get_share_class_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=2]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND, not an empty object."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /share-classes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_FOUND (http 404)"

      - name: nav_create_rejects_computed_field_input
        claim_type: computed_fields
        grounds: [entities.NavRecord.fields.gross_asset_value, "validations[priority=4]"]
        distinguishing_aspect: "Client-supplied computed fields (gross_asset_value) in a create body are rejected as unknown fields with ERR_VALIDATION."
        test_recipe:
          setup: ["Base kit: fund, class with 10000 shares, position qty 1000, SUBMITTED price 100.00 on 2026-08-04"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04", gross_asset_value: 1 }, as: FundAccountant, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_VALIDATION (http 400) — computed field is server-owned, not an accepted input"

      - name: waiver_ledger_entry_immutability
        claim_type: immutability
        grounds: [entities.WaiverLedgerEntry]
        distinguishing_aspect: "WaiverLedgerEntry has common_fields false: ledger rows expose id and created_at but no version/updated_at, and no update or delete endpoint exists."
        test_recipe:
          setup:
            - "Cap fixture: qty 3650 @ 100.00, agreement cap 10bps, manual OTHER accrual 0.1bps -> finalize breaches (ratio 10.1000) and books WAIVER 0.01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 3650, cost_basis_total: 365000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /waiver-agreements", payload: { share_class_id: "${class_id}", cap_bps: 10, effective_from: "2026-08-01", effective_to: "2026-12-31", recovery_window_months: 3 }, as: FundController, captures: { agmt_id: "$.data.id" } }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id" } }
            - { call: "POST /expense-accruals", payload: { share_class_id: "${class_id}", accrual_date: "2026-08-04", category: "OTHER", annual_rate_bps: 0.1 }, as: FundAccountant }
            - { call: "GET /nav-records/${nav_id}", payload: {}, as: FundController, captures: { nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
          trigger:
            - { call: "GET /waiver-agreements/${agmt_id}/ledger", payload: {}, as: FundController, captures: { entry_type: "$.data[0].entry_type" } }
          assert:
            - "${entry_type} == WAIVER; the entry JSON has id and created_at keys and no version or updated_at keys (append-only entity)"

      - name: position_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.Position]
        excluded_because:
          difficulty_instance: break_adjust_reopen_conserves_position_quantity
          rationale: "GET /positions/{id} is exercised twice there (after resolve and after reopen) with exact field assertions."

  # --------------------------------------------------------- state machines
  - section: state_machines
    instances:
      - name: nav_record_initial_state_estimated
        claim_type: initial_state
        grounds: [state_machines.NavRecord]
        distinguishing_aspect: "A newly created NavRecord starts ESTIMATED with the PROVISIONAL pricing variant, before any finalize call."
        test_recipe:
          setup: ["Base kit: fund, class (10000 shares), position qty 1000, SUBMITTED price 100.00 on 2026-08-04"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { st: "$.data.status", variant: "$.data.pricing_variant_used" } }
          assert:
            - "${st} == ESTIMATED and ${variant} == PROVISIONAL"

      - name: distribution_pay_from_cancelled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Distribution, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: paying a cancelled distribution fails with ERR_INVALID_STATE and moves no balances."
        test_recipe:
          setup: ["Base kit with FINAL NavRecord 2026-08-04, retained_income 51.00, distribution declared then cancelled"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "INCOME_POSTING", activity_date: "2026-08-05", amount: 51.00 }, as: FundAccountant }
            - { call: "POST /distributions", payload: { share_class_id: "${class_id}", declaration_date: "2026-08-05", ex_date: "2026-08-06", record_date: "2026-08-07", payable_date: "2026-08-10" }, as: FundAccountant, captures: { dist_id: "$.data.id" } }
            - { call: "POST /distributions/${dist_id}/cancel", payload: {}, as: FundController }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: FundController }
          trigger:
            - { call: "POST /distributions/${dist_id}/pay", payload: { reinvest: false }, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409); ShareClass.${class_id}.retained_income remains 51.00"

      - name: price_override_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PriceObservation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "OVERRIDDEN is terminal: a second override against the same original observation is rejected."
        test_recipe:
          setup: ["One security with a SUBMITTED price observation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/override", payload: { override_price: 101.00, pricing_level: "LEVEL_3" }, as: PricingCommittee }
          trigger:
            - { call: "POST /price-observations/${px_id}/override", payload: { override_price: 102.00, pricing_level: "LEVEL_3" }, as: PricingCommittee, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409) — OVERRIDDEN observations accept no further transitions"

      - name: fee_invoice_pay_before_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FeeInvoice.DRAFT_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT invoices cannot be paid; the linear DRAFT->APPROVED->PAID chain cannot skip APPROVED."
        test_recipe:
          setup: ["Base kit with FINAL NavRecord 2026-08-04; DRAFT ADVISER invoice for 2026-08-01..2026-08-31"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /fee-invoices", payload: { fund_id: "${fund_id}", fee_type: "ADVISER", period_start: "2026-08-01", period_end: "2026-08-31" }, as: FundAccountant, as_user_id: "acct_1", captures: { inv_id: "$.data.id" } }
          trigger:
            - { call: "POST /fee-invoices/${inv_id}/pay", payload: {}, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (http 409)"

      - name: accrual_posted_on_finalize_and_restored_on_reopen
        claim_type: side_effect_execution
        grounds: [state_machines.ExpenseAccrual.ESTIMATED_to_POSTED, state_machines.ExpenseAccrual.POSTED_to_ESTIMATED]
        distinguishing_aspect: "The finalize/reopen transitions drive the accrual subordinate states: ESTIMATED->POSTED on finalize and POSTED->ESTIMATED on reopen."
        test_recipe:
          setup: ["Base kit; NavRecord 2026-08-04 ESTIMATED with its auto ADMIN_FEE accrual"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
          trigger:
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "GET /expense-accruals", payload: { share_class_id: "${class_id}", accrual_date: "2026-08-04" }, as: FundController, captures: { accr_st1: "$.data[0].status" } }
            - { call: "POST /nav-records/${nav_id}/reopen", payload: {}, as: FundController }
            - { call: "GET /expense-accruals", payload: { share_class_id: "${class_id}", accrual_date: "2026-08-04" }, as: FundController, captures: { accr_st2: "$.data[0].status" } }
          assert:
            - "After finalize: accrual ${accr_st1} == POSTED"
            - "After reopen: accrual ${accr_st2} == ESTIMATED"

      - name: reopen_after_fiscal_close_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.NavRecord.FINAL_to_REOPENED, "errors[ERR_NAV_LOCKED_FISCAL_CLOSED]", "errors[ERR_FISCAL_CLOSE_BLOCKED]"]
        distinguishing_aspect: "Year-end close locks the year's records: a clean fund closes successfully, after which reopening a 2026 record fails with ERR_NAV_LOCKED_FISCAL_CLOSED."
        test_recipe:
          setup: ["Base kit with the only NavRecord (2026-08-04) FINAL; no breaks; no filings; clock advanced past fiscal year end"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 10000 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_id: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_id}", quantity: 1000, cost_basis_total: 50000, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_id}", price_date: "2026-08-04", price: 100.00, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_id: "$.data.id" } }
            - { call: "POST /price-observations/${px_id}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id", nav_v: "$.data.version" } }
            - { call: "POST /nav-records/${nav_id}/finalize", payload: { expected_nav_record_version: "${nav_v}" }, as: FundController, as_user_id: "ctl_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-15T00:00:00Z" }, as: FundController }
          trigger:
            - { call: "POST /funds/${fund_id}/fiscal-year-close", payload: { fiscal_year_end_date: "2026-12-31" }, as: FundController, captures: { closed_end: "$.data.last_closed_fiscal_year_end" } }
            - { call: "POST /nav-records/${nav_id}/reopen", payload: {}, as: FundController, captures: { err: "$.data.error_id" } }
          assert:
            - "Close succeeds: ${closed_end} == 2026-12-31"
            - "Reopen of the closed-year record: ${err} == ERR_NAV_LOCKED_FISCAL_CLOSED (http 409)"

      - name: nav_finalize_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.NavRecord.FINAL_to_REOPENED]
        excluded_because:
          difficulty_instance: nav_record_finalize_reopen_cycle
          rationale: "The cyclic FINAL->REOPENED->FINAL path is the subject of that difficulty instance."

      - name: filing_amendment_cycle
        claim_type: valid_transition
        grounds: [state_machines.RegulatoryFiling.FILED_to_AMENDED]
        excluded_because:
          difficulty_instance: regulatory_filing_amendment_cycle
          rationale: "The amendment loop FILED->AMENDED->PENDING_REVIEW->APPROVED->FILED is exercised there."

      - name: escalated_break_resolves
        claim_type: valid_transition
        grounds: [state_machines.ReconciliationBreak.ESCALATED_to_RESOLVED]
        excluded_because:
          difficulty_instance: filing_approve_blocked_by_escalated_break
          rationale: "That instance resolves an ESCALATED break (resolution NO_CHANGE) before the successful approve."

      - name: break_adjust_reopen_compensation
        claim_type: side_effect_execution
        grounds: [state_machines.ReconciliationBreak.RESOLVED_to_OPEN]
        excluded_because:
          difficulty_instance: break_adjust_reopen_conserves_position_quantity
          rationale: "The compensation side effect (quantity restoration) is exactly what that instance asserts."
  # ------------------------------------------------------------ calculations
  - section: calculations
    instances:
      - name: nav_per_position_rounding_before_sum
        claim_type: precision
        grounds: [calculations.nav_computation]
        distinguishing_aspect: "Per-position round2 BEFORE summing: two positions of qty 1 @ 2.005 give GAV 4.02; summing raw products first would give 4.01."
        test_recipe:
          setup: ["Fund/class with 100 shares; two securities each held qty 1 and priced 2.005 on 2026-08-04 (both APPROVED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
            - { call: "POST /share-classes/${class_id}/capital-activity", payload: { activity_type: "SUBSCRIPTION", activity_date: "2026-08-03", shares: 100 }, as: FundAccountant }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0001", description: "Acme Corp", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_a: "$.data.id" } }
            - { call: "POST /securities", payload: { security_identifier: "CUSIP0002", description: "Beta Inc", asset_class: "EQUITY", default_pricing_level: "LEVEL_1", currency: "USD" }, as: FundAccountant, captures: { sec_b: "$.data.id" } }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_a}", quantity: 1, cost_basis_total: 2.00, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /positions", payload: { share_class_id: "${class_id}", security_id: "${sec_b}", quantity: 1, cost_basis_total: 2.00, opened_date: "2026-08-03" }, as: FundAccountant }
            - { call: "POST /price-observations", payload: { security_id: "${sec_a}", price_date: "2026-08-04", price: 2.005, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_a: "$.data.id" } }
            - { call: "POST /price-observations", payload: { security_id: "${sec_b}", price_date: "2026-08-04", price: 2.005, source: "EXCHANGE_CLOSE", pricing_level: "LEVEL_1" }, as: FundAccountant, captures: { px_b: "$.data.id" } }
            - { call: "POST /price-observations/${px_a}/approve", payload: {}, as: PricingCommittee }
            - { call: "POST /price-observations/${px_b}/approve", payload: {}, as: PricingCommittee }
          trigger:
            - { call: "POST /nav-records", payload: { share_class_id: "${class_id}", accounting_date: "2026-08-04" }, as: FundAccountant, as_user_id: "acct_1", captures: { nav_id: "$.data.id" } }
          assert:
            - "NavRecord.${nav_id}.gross_asset_value == 4.02 (round2(1 x 2.005) + round2(1 x 2.005) = 2.01 + 2.01)"
            - "NavRecord.${nav_id}.expense_accrual_total == 0.00 (round2(4.02 x 10/10000/365) rounds to zero)"
            - "NavRecord.${nav_id}.total_net_assets == 4.02 and nav_per_share == 0.0402"

      - name: accrual_base_uses_prior_final_tna
        claim_type: correct_result
        grounds: [calculations.expense_accrual_daily]
        distinguishing_aspect: "Chronological accrual base: day 2 accrues on day 1's FINAL TNA (99999.73 -> 0.27), not on day 2's own GAV (200000.00 -> would be 0.55)."
        test_recipe:
          setup: ["Base kit; 2026-08-04 record FINAL (TNA 99999.73); price on 2026-08-05 is 200.00 APPROVED (GAV doubles)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FundController }
            - { call: "POST /funds", payload: { fund_name: "Alpha Fund", ticker: "ALPHX", base_currency: "USD", fiscal_year_end: "12-31", adviser_name: "Alpha Advisers", admin_fee_bps: 10, day_count_convention: "ACT_365", adviser_fee_tiers: [ { up_to_net_assets: null, rate_bps: 50 } ] }, as: FundController, captures: { fund_id: "$.data.id" } }
            - { call: "POST /share-classes", payload: { fund_id: "${fund_id}", class_ticker: "ALPHXI", distribution_frequency: "QUARTERLY" }, as: FundController, captures: { class_id: "$.data.id" } }
