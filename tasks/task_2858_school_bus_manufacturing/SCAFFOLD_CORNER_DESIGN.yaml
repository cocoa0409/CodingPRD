      - name: delivery_posture_recomputes_on_transitions_and_never_on_clock_advance
        claim_type: forward_looking
        grounds:
          - calculations.delivery_posture
          - calculations.liquidated_damages
          - endpoints[POST /_clock/set_current_utc]
          - entities.ContractOrder.fields.delivery_posture
        distinguishing_aspect: |
          The posture is a forward-looking function of the clock that is nevertheless only refreshed at the
          declared recomputation points. The same order walks AT_RISK (34 days to promise, one PLANNED
          unit) -> ON_TRACK (slot committed) -> still ON_TRACK after the clock jumps past the promised date,
          because neither the clock set nor a GET recomputes -> BREACHED on the next build advance. Damages
          then expose the at_risk multiplier: at the advance the order is BREACHED with
          liquidated_damages_cents 0 (no at-risk unit), and only when the release reverts the bus to PLANNED
          does it become 15 * 7500 = 112,500, well under the 804,511 cap.
        test_recipe:
          setup:
            - "TX fixture; SOL-TX-107 for 1 unit with required_delivery_date 2026-10-05, awarded at clock 2026-09-01 with promised_delivery_date 2026-10-05 (total_contract_cents 16,090,216)"
            - "Line L-A1 with horizon_slot_day_capacity 30"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
