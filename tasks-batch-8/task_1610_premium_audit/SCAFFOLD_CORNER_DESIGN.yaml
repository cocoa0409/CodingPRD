            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v: "$.data.version" } }
          trigger:
            - { call: "POST /audit-work-orders/${wo}/appointments", payload: { scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T11:00:00Z", location_type: "INSURED_PREMISES", expected_work_order_version: "${wo_v}" }, as: Auditor, as_user_id: "${aud}", captures: { appt: "$.data.id" } }
