# =========================================================================
# 1.9 Scaffold Corner Design - breadth walk of references/claim-extraction-guide.md
# against this scaffold's 1.1-1.7 surface. Sections and claim_type values are taken
# verbatim from that guide; nothing is invented. Every error_id in 1.6 has exactly
# one home in the Errors section (recipe or excluded_because stub), so no corner is
# duplicated across sections. Shared fixture literals (identical to 1.8):
#   logical now default 2026-08-01T00:00:00Z
#   TrailerModel TA-7X14: provisional 7000, certified 6300, base_curb 1980, price 489900
#   Dealer DLR-001: labor 9500/h, limit 200000000, quota 5
#   Unit SN-000101: gvwr 6300, curb 1980, payload 4320; first VIN 5XYTA2EA0TP000001
#   Order PO-10001 first allocation: subtotal 489900, freight 89500, total 579400, draw 521460
# =========================================================================
scaffold_corner_design:
  - section: Entities
    instances:
      - name: entity_trailer_model_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.TrailerModel
          - endpoints[POST /trailer-models]
        distinguishing_aspect: |
          Pins the full 201 body of the root entity: the 14 input fields echoed back plus every
          system and computed field at its creation value (certification_status DRAFT, revision_round 0,
          active_unit_count 0, both GVWR fields still null, version 1). A response that omits any declared
          field, or that pre-computes a GVWR before submission, fails.
        test_recipe:
          setup:
            - "Empty DB, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
          assert:
            - "Response status is 201"
            - "TrailerModel.${model_id}.model_code == TA-7X14 and frame_design_code == TA"
            - "TrailerModel.${model_id}.axle_count == 2 and axle_rating_lbs == 3500 and design_braked_axle_count == 1"
            - "TrailerModel.${model_id}.overall_width_in == 78.5 and nominal_length_mm == 4267 and nominal_width_mm == 2134"
            - "TrailerModel.${model_id}.base_curb_weight_lbs == 1980 and base_dealer_price_cents == 489900"
            - "TrailerModel.${model_id}.certification_status == DRAFT"
            - "TrailerModel.${model_id}.revision_round == 0 and active_unit_count == 0"
            - "TrailerModel.${model_id}.provisional_gvwr_lbs is null and certified_gvwr_lbs is null"
            - "TrailerModel.${model_id}.certified_by_user_id is null and certified_at is null"
            - "TrailerModel.${model_id}.version == 1 and created_at == 2026-08-01T00:00:00.000Z"
            - "The returned id is a bare UUID with no type prefix"
      - name: entity_dealer_get_returns_stored_and_derived_balances
        claim_type: Retrieval
        grounds:
          - entities.Dealer
          - endpoints[GET /dealers/{id}]
          - calculations.floor_plan_conservation
        distinguishing_aspect: |
          A read-back of the Dealer row proves the derived money and counter fields are persisted at
          enrollment rather than computed only inside the allocation response: available == limit, both
          allocation counters and the warranty receivable at 0, status ACTIVE.
        test_recipe:
          setup:
            - "One dealer DLR-001 enrolled with floor_plan_limit_cents 200000000 and allocation_quota_per_month 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /dealers"
              payload: { dealer_code: "DLR-001", name: "Prairie Trailer Sales", labor_rate_cents_per_hour: 9500, floor_plan_limit_cents: 200000000, allocation_quota_per_month: 5 }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_id: $.data.id, dealer_v0: $.data.version }
          trigger:
            - call: "GET /dealers/${dealer_id}"
              payload: {}
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer_v1: $.data.version }
          assert:
            - "Response status is 200"
            - "Dealer.${dealer_id}.dealer_code == DLR-001 and labor_rate_cents_per_hour == 9500"
            - "Dealer.${dealer_id}.floor_plan_limit_cents == 200000000"
            - "Dealer.${dealer_id}.floor_plan_outstanding_cents == 0"
            - "Dealer.${dealer_id}.floor_plan_available_cents == 200000000"
            - "Dealer.${dealer_id}.allocation_quota_per_month == 5"
            - "Dealer.${dealer_id}.allocations_current_month_count == 0 and allocations_ytd_count == 0"
            - "Dealer.${dealer_id}.warranty_receivable_cents == 0"
            - "Dealer.${dealer_id}.status == ACTIVE"
            - "${dealer_v1} == 1  # no write has touched the row since enrollment"
      - name: entity_trailer_unit_list_filters_by_build_status_with_limit_and_offset
        claim_type: Listing
        grounds:
          - endpoints[GET /trailer-units]
          - entities.TrailerUnit.fields.build_status
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Exercises filter and window together on the one collection that has both: three units of the
          same model, one moved to JIG_RESERVED, then the same list read three ways (filter PLANNED, filter
          JIG_RESERVED, unfiltered first page of 2). The filters are conjunctive with model_id and the
          envelope carries total_count / has_more for the windowed read.
        test_recipe:
          setup:
            - "Model TA-7X14 CERTIFIED, jig JIG-TA-01, units SN-000101 (JIG_RESERVED), SN-000102 and SN-000103 (both PLANNED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit1_id: $.data.id }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000102", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit2_id: $.data.id }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000103", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit3_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit1_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
          trigger:
            - call: "GET /trailer-units"
              payload: { model_id: "${model_id}", build_status: "PLANNED" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "GET /trailer-units"
              payload: { model_id: "${model_id}", build_status: "JIG_RESERVED" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "GET /trailer-units"
              payload: { model_id: "${model_id}", limit: 2, offset: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
          assert:
            - "The PLANNED read returns exactly 2 rows, the serial numbers SN-000102 and SN-000103"
            - "The JIG_RESERVED read returns exactly 1 row, serial_number SN-000101"
            - "The windowed read returns exactly 2 rows with total_count 3 and has_more true in the envelope"
            - "Every returned row carries model_id == ${model_id}"
            - "No read mutates any row: TrailerUnit.${unit1_id}.version is unchanged"
      - name: entity_weld_jig_and_test_lane_defaults_applied_when_fields_omitted
        claim_type: Defaults
        grounds:
          - entities.WeldJig.fields.changeover_buffer_min
          - entities.TestLane.fields.max_concurrent_tests
        distinguishing_aspect: |
          The two declared defaults (changeover_buffer_min 45 and max_concurrent_tests 2) must be
          materialised on the row when the client omits them, because both are read live by
          calculations.jig_occupancy_conflict and calculations.lane_capacity_conflict - a null default would
          make the geometry undefined rather than merely unset.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-02", frame_design_code: "TA" }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig2_id: $.data.id }
            - call: "POST /test-lanes"
              payload: { lane_code: "LANE-02", surface_type: "GRAVEL" }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { lane2_id: $.data.id }
          assert:
            - "WeldJig.${jig2_id}.changeover_buffer_min == 45"
            - "WeldJig.${jig2_id}.reserved_minutes_total == 0 and version == 1"
            - "TestLane.${lane2_id}.max_concurrent_tests == 2"
            - "TestLane.${lane2_id}.surface_type == GRAVEL and version == 1"
      - name: entity_option_install_totals_are_computed_from_quantity
        claim_type: Computed Fields
        grounds:
          - entities.OptionInstall.fields.total_weight_lbs
          - entities.OptionInstall.fields.total_price_cents
          - calculations.unit_weight_budget
          - endpoints[POST /trailer-units/{id}/option-installs]
        distinguishing_aspect: |
          total_weight_lbs and total_price_cents are source: computed - the client supplies only the
          per-unit values and a quantity - and the same call re-derives the parent unit's curb and payload
          in one hop. Pins a quantity of 3 so a per-unit-vs-total mix-up is visible in three places at once.
        test_recipe:
          setup:
            - "Unit SN-000101 at SYSTEMS_INSTALLED with gvwr_lbs 6300, curb_weight_lbs 1980, payload_capacity_lbs 4320."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "LIGHTING", stop_tail_turn_lamp_count: 2, clearance_lamp_count: 0, side_marker_lamp_count: 2, license_plate_lamp_count: 1, reflex_reflector_count: 4 }
              as: AssemblyTech
              as_user_id: "at-1"
            - call: "POST /trailer-units/${unit_id}/systems-install"
              payload: { stage: "BRAKE_AND_AXLE", installed_braked_axle_count: 1, breakaway_kit_installed: true }
              as: AssemblyTech
              as_user_id: "at-1"
          trigger:
            - call: "POST /trailer-units/${unit_id}/option-installs"
              payload: { option_code: "E_TRACK_KIT", quantity: 3, unit_weight_lbs: 20, unit_price_cents: 6650, labor_hours: 0.75 }
              as: AssemblyTech
              as_user_id: "at-1"
              captures: { option_id: $.data.id }
          assert:
            - "OptionInstall.${option_id}.quantity == 3 and unit_weight_lbs == 20 and unit_price_cents == 6650"
            - "OptionInstall.${option_id}.total_weight_lbs == 60"
            - "OptionInstall.${option_id}.total_price_cents == 19950"
            - "OptionInstall.${option_id}.status == PENDING and labor_hours == 0.75"
            - "TrailerUnit.${unit_id}.curb_weight_lbs == 2040"
            - "TrailerUnit.${unit_id}.payload_capacity_lbs == 4260"
            - "TrailerUnit.${unit_id}.gvwr_lbs == 6300  # unchanged: options never move the rating"
      - name: entity_dealer_system_fields_are_server_minted_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Dealer
          - endpoints[POST /dealers]
        distinguishing_aspect: |
          id, created_at, updated_at, version and every derived balance are server-owned: a create body
          that also carries them must not be able to seed floor_plan_outstanding_cents or start version at
          anything but 1. This is the input-ignored claim, distinct from the defaults claim where the client
          legitimately omits a declared-default field.
        test_recipe:
          setup:
            - "Empty DB, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
          trigger:
            - call: "POST /dealers"
              payload: { dealer_code: "DLR-002", name: "Sandhill Trailer Co", labor_rate_cents_per_hour: 8800, floor_plan_limit_cents: 50000000, allocation_quota_per_month: 2, id: "11111111-1111-1111-1111-111111111111", version: 99, floor_plan_outstanding_cents: 7777, status: "CREDIT_HOLD" }
              as: SalesAdmin
              as_user_id: "sa-1"
              captures: { dealer2_id: $.data.id }
          assert:
            - "Response status is 201"
            - "${dealer2_id} != 11111111-1111-1111-1111-111111111111  # the client id is ignored"
            - "Dealer.${dealer2_id}.version == 1"
            - "Dealer.${dealer2_id}.floor_plan_outstanding_cents == 0"
            - "Dealer.${dealer2_id}.floor_plan_available_cents == 50000000"
            - "Dealer.${dealer2_id}.status == ACTIVE  # not the CREDIT_HOLD the client asked for"
            - "Dealer.${dealer2_id}.created_at == 2026-08-01T00:00:00.000Z and updated_at == created_at"
      - name: entity_frame_inspection_rows_are_immutable_and_append_only
        claim_type: Immutability
        grounds:
          - entities.FrameInspection
          - endpoints[GET /trailer-units/{id}/frame-inspections]
          - entities.FrameInspection.fields.inspection_seq
        distinguishing_aspect: |
          FrameInspection is the scaffold's only common_fields: false entity: no update or delete
          endpoint exists in 1.5, the row carries no version and no updated_at, and a correction is
          expressed by APPENDING inspection_seq 2 rather than editing seq 1 - so the failed measurement
          stays on the record after the rework passes.
        test_recipe:
          setup:
            - "Unit SN-000101 in JIG_RESERVED on the CERTIFIED TA-7X14 model with jig JIG-TA-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
            - call: "POST /trailer-models/${model_id}/certification-submission"
              payload: { engineering_note: "initial GVWR package" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models/${model_id}/certification-decision"
              payload: { decision: "CERTIFIED", decision_note: "capacities verified" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /weld-jigs"
              payload: { jig_code: "JIG-TA-01", frame_design_code: "TA", changeover_buffer_min: 45 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { jig_id: $.data.id, jig_v0: $.data.version }
            - call: "POST /trailer-units"
              payload: { serial_number: "SN-000101", model_id: "${model_id}", planned_start_date: "2026-08-03T07:00:00Z" }
              as: WeldSupervisor
              as_user_id: "ws-1"
              captures: { unit_id: $.data.id }
            - call: "POST /weld-jigs/${jig_id}/jig-reservations"
              payload: { unit_id: "${unit_id}", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T11:00:00Z", expected_weld_jig_version: "${jig_v0}" }
              as: WeldSupervisor
              as_user_id: "ws-1"
          trigger:
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4271, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "POST /trailer-units/${unit_id}/frame-inspections"
              payload: { measured_length_mm: 4267, measured_width_mm: 2134, diagonal_a_mm: 4770, diagonal_b_mm: 4770, critical_weld_defect_count: 0, non_critical_weld_defect_count: 0 }
              as: WeldSupervisor
              as_user_id: "ws-1"
            - call: "GET /trailer-units/${unit_id}/frame-inspections"
              payload: {}
              as: WeldSupervisor
              as_user_id: "ws-1"
          assert:
            - "The list returns exactly 2 rows in ascending inspection_seq order 1 then 2"
            - "Row inspection_seq 1 still reports result FAIL with max_deviation_mm 4 after the second inspection"
            - "Row inspection_seq 2 reports result PASS with max_deviation_mm 0"
            - "Neither row exposes a version field or an updated_at field"
            - "Both rows expose id and created_at == 2026-08-01T00:00:00.000Z"
            - "No PUT, PATCH or DELETE endpoint for FrameInspection exists in the 1.5 table"
            - "TrailerUnit.${unit_id}.frame_fail_count == 1 and build_status == FRAME_WELDED"
      - name: entity_jig_reservation_resolves_both_of_its_foreign_keys
        claim_type: Parent Relationships
        grounds:
          - entities.JigReservation.fields.jig_id
          - entities.JigReservation.fields.unit_id
          - endpoints[GET /weld-jigs/{id}/jig-reservations]
          - endpoints[GET /trailer-units/{id}/jig-reservations]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The flat topology means a child is discoverable from EITHER parent by its own reverse-lookup
          GET, and both channels must surface the same row with both FK fields populated - the reservation
          is never addressed as a nested resource of one parent only.
        test_recipe:
          setup:
            - "Jig JIG-TA-01 holds one RESERVED window 09:00-11:00 on 2026-08-03 for unit SN-000101."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantEngineer
              as_user_id: "pe-1"
            - call: "POST /trailer-models"
              payload: { model_code: "TA-7X14", description: "Tandem 7x14 cargo", axle_count: 2, axle_rating_lbs: 3500, design_braked_axle_count: 1, tire_load_rating_lbs: 1820, frame_design_code: "TA", frame_design_rated_lbs: 7200, coupler_rating_lbs: 7500, overall_width_in: 78.5, nominal_length_mm: 4267, nominal_width_mm: 2134, base_curb_weight_lbs: 1980, base_dealer_price_cents: 489900 }
              as: PlantEngineer
              as_user_id: "pe-1"
              captures: { model_id: $.data.id }
