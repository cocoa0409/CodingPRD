  # --- DeliverableAssignment ------------------------------------------------
  - method: GET
    path: "/deliverable-assignments/{id}"
    description: "Read one deliverable assignment"
    roles: [GeneralManager, PlayerAgent, SponsorshipManager]
    code: 200
    input: []
    output: DeliverableAssignment
    side_effects: []
  - method: GET
    path: "/deliverable-assignments"
    description: "List assignments filtered by deal, contract or status (FK reverse for DeliverableAssignment.contract_id)"
    roles: [GeneralManager, PlayerAgent, SponsorshipManager]
    code: 200
    input: ["sponsorship_deal_id?", "contract_id?", "assignment_status?", "limit?", "offset?"]
