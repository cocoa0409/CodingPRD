              as: Driver
              as_user_id: "${w1}"
            - call: "POST /api/pickup-stops/${st1}/complete"
              as: Driver
              as_user_id: "${w1}"
          trigger:
            - call: "POST /api/pickup-stops/${st1}/depart"
              as: Driver
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STOP_INVALID_STATE"
            - "PickupStop.${st1}.status == COMPLETED"

      - name: transfer_disburse_from_draft_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRANSFER_INVALID_STATE]", "state_machines.MissionTransfer"]
        distinguishing_aspect: "Disburse requires APPROVED; a DRAFT transfer rejects with ERR_TRANSFER_INVALID_STATE (approval cannot be skipped)."
        test_recipe:
          setup: ["closed cycle; DRAFT transfer"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
              captures: { cv: $.data.version }
            - call: "POST /api/cycles/${c1}/mission-transfers"
              payload: { expected_cycle_version: "${cv}", allocations: [ { program: "GENERAL_FUND", pct: 100.000 } ] }
              as: FinanceClerk
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /api/mission-transfers/${t1}/disburse"
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TRANSFER_INVALID_STATE"
            - "MissionTransfer.${t1}.status == DRAFT"

      - name: assign_inactive_worker_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_WORKER_NOT_ACTIVE]", "validations[priority=11]"]
        distinguishing_aspect: "An INACTIVE worker (PATCH-toggled) cannot be assigned; distinct from CAP_REACHED which has its own error."
        test_recipe:
          setup: ["worker deactivated; open shift"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W Ina", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "PATCH /api/workers/${w1}"
              payload: { status: "INACTIVE" }
              as: VolunteerCoordinator
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z", required_headcount: 2 }
              as: VolunteerCoordinator
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /api/shifts/${sh1}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WORKER_NOT_ACTIVE"
            - "Shift.${sh1}.assigned_count == 0"

      - name: stop_complete_creates_pickup_batch
        claim_type: side_effect_execution
        grounds: ["state_machines.PickupStop.EN_ROUTE_to_COMPLETED"]
        excluded_because:
          difficulty_instance: stop_depart_requires_earlier_stops_terminal
          rationale: "That instance completes S1 and asserts completed_batch_id plus the auto-created batch's source/donor/receipt_requested/status."

  - section: rbac
    instances:
      - name: volunteer_cannot_confirm_others_assignment
        claim_type: ownership_denial
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_OWNERSHIP]", "roles"]
        distinguishing_aspect: "Entity-backed identity check: Volunteer W2 confirming an assignment owned by W1 is 403 ERR_FORBIDDEN_OWNERSHIP even though the role is allowed on the endpoint; the coordinator (opaque role) can confirm it."
        test_recipe:
          setup: ["VOLUNTEER workers W1, W2; W1 assigned to a shift"]
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { full_name: "W One", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W Two", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { w2: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "SORTER", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z", required_headcount: 2 }
              as: VolunteerCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /api/shifts/${sh1}/assignments"
              payload: { worker_id: "${w1}" }
              as: VolunteerCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /api/shift-assignments/${a1}/confirm"
              as: Volunteer
              as_user_id: "${w2}"
              captures: { err: $.data.error_id }
            - call: "POST /api/shift-assignments/${a1}/confirm"
              as: Volunteer
              as_user_id: "${w1}"
          assert:
            - "${err} == ERR_FORBIDDEN_OWNERSHIP"
            - "after the owner confirms: ShiftAssignment.${a1}.status == CONFIRMED"

      - name: finance_clerk_cannot_seal_bale
        claim_type: exclusive_operation_denial
        grounds: ["validations[priority=3]", "errors[ERR_UNAUTHORIZED]", "roles"]
        distinguishing_aspect: "Seal is a StoreManager exclusive: FinanceClerk (who may settle) is rejected 403 ERR_UNAUTHORIZED on seal, proving exclusive_operations are per-action, not per-entity."
        test_recipe:
          setup: ["TEXTILES bale at 100 lbs; vendor with TEXTILES rates"]
          setup_api_calls:
            - call: "POST /api/salvage-vendors"
              payload: { name: "T Co", rates: [ { category: "TEXTILES", brackets: [ { up_to_lbs: null, rate_cents_per_lb: 12 } ] } ] }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /api/donors"
              payload: { full_name: "D Rb" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "FAIR", weight_lbs: 100.0 }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "POST /api/donation-batches/${b1}/begin-sort"
              as: IntakeAttendant
            - call: "POST /api/items/${i1}/triage"
              payload: { decision: "RECYCLE", salvage_category: "TEXTILES" }
              as: IntakeAttendant
            - call: "GET /api/salvage-bales"
              payload: { category: "TEXTILES", status: "ACCUMULATING" }
              as: StoreManager
              captures: { bale1: "$.data[0].id" }
          trigger:
            - call: "POST /api/salvage-bales/${bale1}/seal"
              payload: { vendor_id: "${v1}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
            - "SalvageBale.${bale1}.status == ACCUMULATING"

  - section: complexity_layers
    instances:
      - name: occ_revalue_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[batch-revalue-stale-version]", "errors[ERR_STALE_BATCH_VERSION]"]
        distinguishing_aspect: "Two strictly sequential revalues against the same observed version: the first succeeds (batch version advances), the second — carrying the now-stale captured version — is rejected 412 ERR_STALE_BATCH_VERSION; a retry with the fresh version succeeds."
        test_recipe:
          setup: ["OPEN batch with one TOYS/GOOD item (provisional 420); version observed at creation is 1, item add bumps it to 2"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Occ" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id, bv_stale: $.data.version }
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "TOYS", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /api/donation-batches/${b1}/revalue"
              payload: { expected_batch_version: "${bv_stale}", adjustments: [ { item_id: "${i1}", provisional_value_cents: 900 } ] }
              as: IntakeAttendant
              captures: { err: $.data.error_id }
            - call: "GET /api/donation-batches/${b1}"
              as: IntakeAttendant
              captures: { bv_fresh: $.data.version }
            - call: "POST /api/donation-batches/${b1}/revalue"
              payload: { expected_batch_version: "${bv_fresh}", adjustments: [ { item_id: "${i1}", provisional_value_cents: 900 } ] }
              as: IntakeAttendant
          assert:
            - "${err} == ERR_STALE_BATCH_VERSION (HTTP 412)"
            - "retry with the fresh version succeeds: DonationBatch.${b1}.provisional_value_cents == 900"
            - "DonationBatch.${b1}.version advanced by exactly 1 per successful mutation (no drift on the rejected call)"

      - name: occ_transfer_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[transfer-create-stale-cycle]", "errors[ERR_STALE_CYCLE_VERSION]"]
        distinguishing_aspect: "After a first transfer create bumps the cycle's version, a second create carrying the pre-transfer version is rejected 412 ERR_STALE_CYCLE_VERSION and must NOT supersede the existing DRAFT."
        test_recipe:
          setup: ["closed cycle (version captured at close); first transfer created with that version"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
              captures: { cv: $.data.version }
            - call: "POST /api/cycles/${c1}/mission-transfers"
              payload: { expected_cycle_version: "${cv}", allocations: [ { program: "GENERAL_FUND", pct: 100.000 } ] }
              as: FinanceClerk
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /api/cycles/${c1}/mission-transfers"
              payload: { expected_cycle_version: "${cv}", allocations: [ { program: "JOB_TRAINING", pct: 100.000 } ] }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_CYCLE_VERSION (HTTP 412)"
            - "MissionTransfer.${t1}.status == DRAFT (the rejected create did NOT supersede it)"

      - name: cycle_close_spawns_next_epoch
        claim_type: ops_run_checkpoint
        grounds: ["state_machines.WeeklyCycle.OPEN_to_CLOSED", "calculations.calc_cycle_close_revenue", "calculations.calc_shrink_rate"]
        distinguishing_aspect: "Closing an idle cycle snapshots zeroed revenue/shrink fields and spawns the next epoch: sequence 2, rotation_color BLUE (2 mod 4), opened_at == the close instant, shrink_alert_active false, markdown_runs_count 0."
        test_recipe:
          setup: ["one OPEN cycle (sequence 1, RED) created at the default clock; clock advanced to 2026-08-06"]
          setup_api_calls:
            - call: "POST /api/cycles"
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /api/cycles/${c1}/close"
              as: StoreManager
            - call: "GET /api/cycles"
              payload: { status: "OPEN" }
              as: StoreManager
              captures: { c2: "$.data[0].id" }
          assert:
            - "WeeklyCycle.${c1}.status == CLOSED and closed_at == 2026-08-06T00:00:00Z"
            - "WeeklyCycle.${c1}.gross_sales_cents == 0 and salvage_revenue_cents == 0 and net_revenue_cents == 0 and shrink_rate_bp == 0 (empty denominator pinned to 0)"
            - "WeeklyCycle.${c2}.sequence_number == 2 and rotation_color == BLUE and status == OPEN"
            - "WeeklyCycle.${c2}.opened_at == 2026-08-06T00:00:00Z and shrink_alert_active == false and markdown_runs_count == 0"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.WeeklyCycle.OPEN_to_OPEN"]
        excluded_because:
          difficulty_instance: markdown_pull_cascade
          rationale: "The 3-hop cycle->item->bale->estimate chain is verified end-to-end by that difficulty instance."

      - name: rate_threshold_triggers_boundaries
        claim_type: rate_threshold
        grounds: ["calculations.calc_till_reconciliation"]
        excluded_because:
          difficulty_instance: variance_boundary_500_vs_501
          rationale: "The +/-500 vs +/-501 variance threshold pair is asserted there; other thresholds (bale 100.0, receipt 25000) are covered by their own difficulty instances."

  - section: consistency_model
    instances:
      - name: immediate_consistency_reads
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "entities.DonationBatch"]
        distinguishing_aspect: "Immediate consistency: writes are visible in the same response and in the very next GET — item creation moves batch.item_count to 1 and provisional_value_cents to 560 with no delay or read-repair."
        test_recipe:
          setup: ["donor + OPEN batch"]
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { full_name: "D Imm" }
              as: IntakeAttendant
              captures: { d1: $.data.id }
            - call: "POST /api/donation-batches"
              payload: { donor_id: "${d1}", source: "WALK_IN" }
              as: IntakeAttendant
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /api/donation-batches/${b1}/items"
              payload: { category: "CLOTHING", condition: "GOOD" }
              as: IntakeAttendant
              captures: { i1: $.data.id }
            - call: "GET /api/donation-batches/${b1}"
              as: Pricer
          assert:
            - "item create response already carries provisional_value_cents == 560 and status == RECEIVED"
            - "immediate GET batch: item_count == 1, untriaged_count == 1, provisional_value_cents == 560"
            - "GET /api/items/${i1} returns the same stored representation"
