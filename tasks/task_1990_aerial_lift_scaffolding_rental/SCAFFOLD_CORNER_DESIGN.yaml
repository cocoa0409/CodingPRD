              as: RentalCoordinator
              captures: { lid: $.data.id }
          assert:
            - "required_working_height_ft 26 > max 25: error_id == ERR_REACH_EXCEEDED (422)"
            - "required_working_height_ft 25 == max 25: creation succeeds (boundary inclusive)"

      - name: engineering_plan_required_rejected
