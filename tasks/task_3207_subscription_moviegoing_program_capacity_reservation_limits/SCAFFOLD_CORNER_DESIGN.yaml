scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: member_register_success_system_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Member
        distinguishing_aspect: "POST /cinemas/members with required fields returns 201 with system-minted id, status REGISTERED, loyalty_points_balance 0, no_show_strikes_active 0, suspended_until null."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /cinemas/members"
              payload: { email: "fresh@x.com", full_name: "Fresh Member" }
              as: MemberServices
              captures: { fm: $.data.id, fm_status: $.data.status, fm_bal: $.data.loyalty_points_balance }
          assert:
            - "response 201; data.status == REGISTERED"
            - "data.loyalty_points_balance == 0 and data.no_show_strikes_active == 0"
            - "data.id is a server-minted UUID; created_at == 2026-09-01T00:00:00.000Z (logical clock default)"

      - name: member_register_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Member.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required input field email on member creation yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cinemas/members"
              payload: { full_name: "No Email" }
              as: MemberServices
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: member_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /cinemas/members/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cinemas/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: MemberServices
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: members_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Member
        distinguishing_aspect: "GET /cinemas/members honors limit/offset and returns total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["Three members registered"]
          setup_api_calls:
            - call: "POST /cinemas/members"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: MemberServices
            - call: "POST /cinemas/members"
              payload: { email: "p2@x.com", full_name: "P Two" }
              as: MemberServices
            - call: "POST /cinemas/members"
              payload: { email: "p3@x.com", full_name: "P Three" }
              as: MemberServices
          trigger:
            - call: "GET /cinemas/members"
              payload: { limit: 2, offset: 0 }
              as: MemberServices
          assert:
            - "data carries 2 rows with total_count == 3 and has_more == true"
            - "limit below 1 or above 100 is clamped per pagination_defaults"

      - name: loyalty_ledger_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.LoyaltyLedgerEntry
        distinguishing_aspect: "LoyaltyLedgerEntry (common_fields: false) exposes only append flows (earn entries via purchase/check-in, ADJUST via loyalty-adjustments) and filtered reads; there is no update or delete route and no version field on the entity."
        test_recipe:
          setup:
            - "Clock 2026-09-01; ALIST_PLUS plan PUBLISHED; ACTIVE member with subscription and theater; one concession purchase made so one EARN_CONCESSION entry exists"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_PLUS", tier: "PLUS", monthly_fee_cents: 2499, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: true, max_future_reservations: 5, loyalty_points_multiplier_pct: 125, concession_discount_pct: 10 }
              as: ProgramAdmin
              captures: { im_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${im_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "IM", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { im_th: $.data.id }
            - call: "POST /cinemas/members"
              payload: { email: "im@x.com", full_name: "IM" }
              as: MemberServices
              captures: { im_m: $.data.id }
            - call: "POST /cinemas/members/${im_m}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${im_m}/subscriptions"
              payload: { plan_id: "${im_plan}" }
              as: MemberServices
            - call: "POST /cinemas/concession-purchases"
              payload: { member_id: "${im_m}", theater_id: "${im_th}", pre_discount_cents: 1000 }
              as: Member
              as_user_id: "${im_m}"
          trigger:
            - call: "GET /cinemas/loyalty-ledger"
              payload: { member_id: "${im_m}" }
              as: MemberServices
              captures: { im_entry: "$.data[0].kind" }
          assert:
            - "exactly one EARN_CONCESSION entry exists; the entity has no version field (common_fields: false) and no mutation route is declared in §1.5"

      - name: plan_create_enum_violation_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.SubscriptionPlan.fields.tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "tier must be one of BASIC|PLUS|PREMIER; an invalid enum value yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "BAD", tier: "GOLD", monthly_fee_cents: 100, weekly_reservation_quota: 1, max_rollover_credits: 1, premium_format_allowed: false, max_future_reservations: 2, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: showtime_parent_relationship_wrong_auditorium
        claim_type: parent_relationships
        grounds:
          - entities.Showtime.fields.auditorium_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Creating a showtime against a non-existent auditorium_id yields ERR_NOT_FOUND (FK existence at priority 3)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", film_title: "X", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-05T19:00:00Z", runtime_minutes: 120, base_price_cents: 1000, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: subscription_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Subscription.fields.current_cycle_index
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "current_cycle_index is computed; supplying it in the enroll payload is an unknown key for that endpoint and is rejected with ERR_INVALID_REQUEST (strict payload schema policy)."
        test_recipe:
          setup:
            - "Clock 2026-09-01; PUBLISHED plan exists; ACTIVE member exists"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { pcf_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${pcf_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "cf@x.com", full_name: "CF" }
              as: MemberServices
              captures: { pcf_m: $.data.id }
            - call: "POST /cinemas/members/${pcf_m}/activate"
              payload: {}
              as: MemberServices
          trigger:
            - call: "POST /cinemas/members/${pcf_m}/subscriptions"
              payload: { plan_id: "${pcf_plan}", current_cycle_index: 99 }
              as: MemberServices
              captures: { pcf_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (unknown key rejected; computed field stays server-owned)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: confirm_held_reservation_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
        distinguishing_aspect: "A HELD reservation within HOLD_TTL_MINUTES on an ON_SALE showtime confirms to CONFIRMED."
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan PUBLISHED; ACTIVE member with ACTIVE subscription; ON_SALE showtime 2026-09-06T19:00:00Z; reservation HELD"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { vt_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${vt_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "VT", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { vt_th: $.data.id }
            - call: "POST /cinemas/theaters/${vt_th}/auditoriums"
              payload: { label: "A1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
              captures: { vt_aud: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${vt_aud}", film_title: "VT", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-06T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { vt_st: $.data.id, vt_st_v: $.data.version }
            - call: "POST /cinemas/showtimes/${vt_st}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "vt@x.com", full_name: "VT" }
              as: MemberServices
              captures: { vt_m: $.data.id }
            - call: "POST /cinemas/members/${vt_m}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${vt_m}/subscriptions"
              payload: { plan_id: "${vt_plan}" }
              as: MemberServices
              captures: { vt_s: $.data.id }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${vt_s}", showtime_id: "${vt_st}", expected_showtime_version: "${vt_st_v}" }
              as: Member
              as_user_id: "${vt_m}"
              captures: { vt_r: $.data.id, vt_r_status: $.data.status }
          trigger:
            - call: "POST /cinemas/reservations/${vt_r}/confirm"
              payload: {}
              as: Member
              as_user_id: "${vt_m}"
              captures: { vt_r_after: $.data.status }
          assert:
            - "initial status == HELD (initial_state)"
            - "after confirm status == CONFIRMED"

      - name: confirm_after_hold_ttl_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.HELD_to_EXPIRED
        distinguishing_aspect: "After HOLD_TTL_MINUTES (15) the hold auto-expires; confirm then fails with ERR_INVALID_STATE and the credit is refunded."
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan PUBLISHED; ACTIVE member + subscription; ON_SALE showtime 2026-09-06T19:00:00Z; reservation HELD at 12:00:00Z; clock advanced past 12:15:00Z"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { ttl_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${ttl_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "TTL", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { ttl_th: $.data.id }
            - call: "POST /cinemas/theaters/${ttl_th}/auditoriums"
              payload: { label: "A1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
              captures: { ttl_aud: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${ttl_aud}", film_title: "TTL", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-06T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { ttl_st: $.data.id, ttl_st_v: $.data.version }
            - call: "POST /cinemas/showtimes/${ttl_st}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "ttl@x.com", full_name: "TTL" }
              as: MemberServices
              captures: { ttl_m: $.data.id }
            - call: "POST /cinemas/members/${ttl_m}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${ttl_m}/subscriptions"
              payload: { plan_id: "${ttl_plan}" }
              as: MemberServices
              captures: { ttl_s: $.data.id }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${ttl_s}", showtime_id: "${ttl_st}", expected_showtime_version: "${ttl_st_v}" }
              as: Member
              as_user_id: "${ttl_m}"
              captures: { ttl_r: $.data.id, ttl_b: $.data.bucket_id }
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:16:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /cinemas/reservations/${ttl_r}/confirm"
              payload: {}
              as: Member
              as_user_id: "${ttl_m}"
              captures: { ttl_err: $.data.error_id }
            - call: "GET /cinemas/reservations/${ttl_r}"
              payload: {}
              as: MemberServices
              captures: { ttl_r_status: $.data.status }
            - call: "GET /cinemas/credit-buckets/${ttl_b}"
              payload: {}
              as: ProgramAdmin
              captures: { ttl_b_used: $.data.credits_used }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Reservation.status == EXPIRED (auto hold expiry)"
            - "bucket.credits_used == 0 (hold expiry always refunds)"

      - name: cancel_terminal_reservation_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Reservation
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: cancel_terminal_reservation_and_window_closed_state_beats_temporal
          rationale: "The NO_SHOW terminal lockdown on cancel is asserted as the failure path of that §1.8 priority-conflict instance."

      - name: subscription_cancelled_terminal_no_pause
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscription
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From CANCELLED (terminal), pause is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan PUBLISHED; ACTIVE member with subscription that has been cancelled"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { inv_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${inv_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "inv@x.com", full_name: "INV" }
              as: MemberServices
              captures: { inv_m: $.data.id }
            - call: "POST /cinemas/members/${inv_m}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${inv_m}/subscriptions"
              payload: { plan_id: "${inv_plan}" }
              as: MemberServices
              captures: { inv_s: $.data.id }
            - call: "POST /cinemas/subscriptions/${inv_s}/cancel"
              payload: {}
              as: Member
              as_user_id: "${inv_m}"
          trigger:
            - call: "POST /cinemas/subscriptions/${inv_s}/pause"
              payload: { pause_days: 7 }
              as: Member
              as_user_id: "${inv_m}"
              captures: { inv_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (CANCELLED is terminal for pause)"

      - name: settlement_acknowledge_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SettlementReport
        distinguishing_aspect: "An ACKNOWLEDGED report rejects dispute/revise/submit with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A report with one CHECKED_IN subscription line, SUBMITTED then ACKNOWLEDGED"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { ack_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${ack_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "ACK", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { ack_th: $.data.id }
            - call: "POST /cinemas/theaters/${ack_th}/auditoriums"
              payload: { label: "A1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
              captures: { ack_aud: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${ack_aud}", film_title: "ACK", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-02T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { ack_st: $.data.id, ack_st_v: $.data.version }
            - call: "POST /cinemas/showtimes/${ack_st}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "ack@x.com", full_name: "ACK" }
              as: MemberServices
              captures: { ack_m: $.data.id }
            - call: "POST /cinemas/members/${ack_m}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${ack_m}/subscriptions"
              payload: { plan_id: "${ack_plan}" }
              as: MemberServices
              captures: { ack_s: $.data.id }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${ack_s}", showtime_id: "${ack_st}", expected_showtime_version: "${ack_st_v}" }
              as: Member
              as_user_id: "${ack_m}"
              captures: { ack_r: $.data.id }
            - call: "POST /cinemas/reservations/${ack_r}/confirm"
              payload: {}
              as: Member
              as_user_id: "${ack_m}"
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T19:05:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/reservations/${ack_r}/check_in"
              payload: {}
              as: TheaterStaff
            - call: "POST /cinemas/theaters/${ack_th}/settlement-reports"
              payload: { studio_code: "WB", period_start: "2026-09-02T00:00:00Z", period_end: "2026-09-03T00:00:00Z" }
              as: TheaterStaff
              captures: { ack_rep: $.data.id }
            - call: "POST /cinemas/settlement-reports/${ack_rep}/lines"
              payload: { reservation_id: "${ack_r}" }
              as: TheaterStaff
            - call: "POST /cinemas/settlement-reports/${ack_rep}/submit"
              payload: {}
              as: TheaterStaff
            - call: "POST /cinemas/settlement-reports/${ack_rep}/acknowledge"
              payload: {}
              as: StudioRep
          trigger:
            - call: "POST /cinemas/settlement-reports/${ack_rep}/dispute"
              payload: { dispute_note: "too late" }
              as: StudioRep
              captures: { ack_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (ACKNOWLEDGED is terminal)"

      - name: suspension_auto_lifts_at_suspended_until
        claim_type: side_effect_execution
        grounds:
          - state_machines.Member.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Clock advance past suspended_until auto-restores Member to ACTIVE and resumes the suspension-paused subscription."
        test_recipe:
          setup:
            - "Member with 3 ACTIVE strikes -> SUSPENDED with suspended_until = strike3_time + 30d; subscription force-PAUSED"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_PREMIER", tier: "PREMIER", monthly_fee_cents: 2999, weekly_reservation_quota: 4, max_rollover_credits: 2, premium_format_allowed: true, max_future_reservations: 6, loyalty_points_multiplier_pct: 150, concession_discount_pct: 15 }
              as: ProgramAdmin
              captures: { lift_plan: $.data.id }
            - call: "POST /cinemas/subscription-plans/${lift_plan}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "LIFT", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { lift_th: $.data.id }
            - call: "POST /cinemas/theaters/${lift_th}/auditoriums"
              payload: { label: "A1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
