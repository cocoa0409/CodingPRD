# =============================================================================
# Frozen-Yogurt / Self-Serve Dessert — POS, Inventory, Sanitation, Loyalty,
# Waste, Catering, Reconciliation. Expert difficulty seed tables (§1.0–§1.7).
# =============================================================================

scenario: |
  767. Frozen-Yogurt / Self-Serve Dessert: self-serve by-weight POS & scale,
  flavor/topping inventory & rotation, machine/mix par & sanitation/cleaning
  log, loyalty/punch & seasonal, waste/melt, party/catering, allergen,
  reconciliation。

domain_name: frozen-yogurt-self-serve
api_prefix: "/"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat          # peer resources linked by FK, no URL nesting except SaleLine under SaleTicket
  state_machine_shape: parallel  # SaleTicket has parallel payment × reconciliation axes; Machine is cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override   # Cashier < ShiftLead < Manager
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Machine
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Soft-serve machine label (e.g., Barrel-A)" }
      - { name: mix_par_oz, type: number, source: input, description: "Target mix level in ounces; refills top up to this par" }
      - { name: current_mix_level_oz, type: number, source: computed, description: "Read-only: remaining mix in oz; depleted by dispensing, restored on void, topped up by refill (capped at mix_par_oz)" }
      - { name: last_cleaned_at, type: datetime, source: computed, description: "Read-only: logical-clock timestamp of last completed cleaning; set to clock-now at creation and at complete-cleaning" }
      - { name: next_maintenance_at, type: datetime, source: computed, default: null, description: "Read-only: window_start of the most recently scheduled MaintenanceWindow; null when none" }
      - { name: sanitation_status, type: enum, source: system, description: "READY → CLEANING → READY (cyclic); READY → OUT_OF_SERVICE when sanitation overdue; OUT_OF_SERVICE → CLEANING. Values: READY, CLEANING, OUT_OF_SERVICE" }

  - name: Flavor
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; the barrel this mix is loaded into" }
      - { name: name, type: string, source: input, description: "Flavor name (e.g., Tart Original)" }
      - { name: price_per_oz_cents, type: integer, source: input, description: "Retail price per ounce in cents" }
      - { name: cost_per_oz_cents, type: integer, source: input, description: "COGS per ounce in cents" }
      - { name: allergen_tags, type: array, source: input, default: [], description: "Allergen codes present, subset of {DAIRY, NUTS, SOY, GLUTEN, EGG}" }
      - { name: status, type: enum, source: system, description: "LOADED (available) → ROTATED_OUT (rotated off menu); LOADED ↔ SUSPENDED when parent Machine goes OUT_OF_SERVICE / back READY. Values: LOADED, SUSPENDED, ROTATED_OUT" }

  - name: Topping
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Topping name (e.g., Mochi)" }
      - { name: surcharge_cents, type: integer, source: input, description: "Flat per-serving surcharge in cents added to a cup that includes this topping" }
      - { name: on_hand_units, type: integer, source: computed, description: "Read-only: servings on hand; each cup including this topping consumes 1 unit; restored on void, increased on restock" }
      - { name: allergen_tags, type: array, source: input, default: [], description: "Allergen codes present, subset of {DAIRY, NUTS, SOY, GLUTEN, EGG}" }
      - { name: status, type: enum, source: system, description: "AVAILABLE → ROTATED_OUT. Values: AVAILABLE, ROTATED_OUT" }

  - name: SeasonalPromotion
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Promotion label (e.g., Summer Tart Days)" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount applied to the yogurt-weight portion of a cup, 0..1 (e.g., 0.10)" }
      - { name: starts_at, type: datetime, source: input, description: "Inclusive start of active window (logical clock)" }
      - { name: ends_at, type: datetime, source: input, description: "Exclusive end of active window; active iff starts_at <= now < ends_at" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: member_name, type: string, source: input, description: "Member display name" }
      - { name: phone, type: string, source: input, default: null, description: "Optional contact phone" }
      - { name: points_provisional, type: integer, source: computed, description: "Read-only: points accrued from CHARGED-but-unreconciled tickets; reversed on void; drained to lifetime at reconciliation" }
      - { name: points_lifetime, type: integer, source: computed, description: "Read-only: finalized points, incremented at reconciliation close" }
      - { name: punch_count, type: integer, source: computed, description: "Read-only: reconciled-visit punches modulo PUNCH_THRESHOLD; a crossing issues a RewardVoucher and subtracts PUNCH_THRESHOLD" }
      - { name: status, type: enum, source: system, description: "ACTIVE → SUSPENDED. Values: ACTIVE, SUSPENDED" }

  - name: RewardVoucher
    parent: null
    common_fields: true
    fields:
      - { name: loyalty_account_id, type: string, source: system, description: "FK -> LoyaltyAccount.id; owner of the voucher" }
      - { name: value_cents, type: integer, source: system, description: "Fixed cash-off value in cents (VOUCHER_VALUE_CENTS)" }
      - { name: expires_at, type: datetime, source: system, description: "Issued clock-now + VOUCHER_TTL_HOURS; redemption at/after this instant is rejected" }
      - { name: status, type: enum, source: system, description: "ISSUED → REDEEMED (applied to a checkout) / EXPIRED (redeem attempted at/after expires_at). Values: ISSUED, REDEEMED, EXPIRED" }

  - name: SaleTicket
    parent: null
    common_fields: true
    fields:
      - { name: loyalty_account_id, type: string, source: input, default: null, description: "FK -> LoyaltyAccount.id; optional member attached to the ticket" }
      - { name: excluded_allergens, type: array, source: input, default: [], description: "Allergen codes the guest cannot have; a cup whose topping carries any of these is rejected. Subset of {DAIRY, NUTS, SOY, GLUTEN, EGG}" }
      - { name: reconciliation_id, type: string, source: computed, default: null, description: "FK -> DailyReconciliation.id; set when the ticket is swept into a reconciliation close" }
      - { name: redeemed_voucher_id, type: string, source: computed, default: null, description: "FK -> RewardVoucher.id; the voucher applied at checkout, if any" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Read-only: charged amount computed at checkout by the QUOTED variant of sale_ticket_total" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Read-only: amount recomputed at reconciliation by the FINALIZED variant; null until reconciled" }
      - { name: provisional_points, type: integer, source: computed, default: 0, description: "Read-only: points accrued at checkout = floor(quoted_total_cents/POINTS_DIVISOR)" }
      - { name: final_points, type: integer, source: computed, default: null, description: "Read-only: points posted at reconciliation = floor(final_total_cents/POINTS_DIVISOR)" }
      - { name: payment_status, type: enum, source: system, description: "OPEN → CHARGED → VOIDED (independent axis). Values: OPEN, CHARGED, VOIDED" }
      - { name: reconciliation_status, type: enum, source: system, description: "UNRECONCILED → RECONCILED (independent axis, advances only for CHARGED tickets at close). Values: UNRECONCILED, RECONCILED" }

  - name: SaleLine
    parent: SaleTicket
    common_fields: false   # append-only cup line: id, created_at only
    fields:
      - { name: ticket_id, type: string, source: system, description: "FK -> SaleTicket.id; the ticket this cup belongs to" }
      - { name: flavor_id, type: string, source: input, description: "FK -> Flavor.id; the dispensed flavor" }
      - { name: gross_weight_oz, type: number, source: input, description: "Scale gross weight in oz (cup + product)" }
      - { name: container_tare_oz, type: number, source: input, default: 0.0, description: "Tare weight of the empty cup in oz" }
      - { name: net_weight_oz, type: number, source: computed, description: "Read-only: gross_weight_oz - container_tare_oz; must be strictly > 0" }
      - { name: topping_ids, type: array, source: input, default: [], description: "Topping.id values applied to this cup; each consumes 1 unit and adds its surcharge_cents" }
      - { name: line_quoted_cents, type: integer, source: computed, description: "Read-only: per-line contribution under the QUOTED variant (weight portion discounted+rounded, plus topping surcharges)" }

  - name: WasteEvent
    parent: null
    common_fields: false   # immutable melt/waste log: id, created_at only
    fields:
      - { name: machine_id, type: string, source: input, default: null, description: "FK -> Machine.id; source barrel for mix/melt waste (null for topping waste)" }
      - { name: flavor_id, type: string, source: input, default: null, description: "FK -> Flavor.id; mix flavor being wasted, provides valuation rates (null for topping waste)" }
      - { name: topping_id, type: string, source: input, default: null, description: "FK -> Topping.id; topping being wasted (null for mix waste)" }
      - { name: waste_weight_oz, type: number, source: input, default: null, description: "Mix waste weight in oz (mix waste only)" }
      - { name: waste_units, type: integer, source: input, default: null, description: "Topping servings wasted (topping waste only)" }
      - { name: reason, type: enum, source: input, description: "MELT, SPILL, EXPIRY, MACHINE_FAULT" }
      - { name: cogs_value_cents, type: integer, source: computed, description: "Read-only: waste valued at cost basis (waste_valuation COGS variant)" }
      - { name: retail_value_cents, type: integer, source: computed, description: "Read-only: waste valued at retail basis (waste_valuation RETAIL variant)" }

  - name: SanitationLog
    parent: null
    common_fields: false   # append-only cleaning log: id, created_at only
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> Machine.id; machine that was cleaned" }
      - { name: cleaned_at, type: datetime, source: system, description: "Logical clock-now at complete-cleaning" }
      - { name: previous_status, type: enum, source: system, description: "Machine sanitation_status before cleaning (CLEANING). Values: CLEANING" }

  - name: MaintenanceWindow
    parent: null
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: input, description: "FK -> Machine.id; machine reserved for maintenance" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the reserved window" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the reserved window; must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → CANCELLED. Values: SCHEDULED, CANCELLED" }

  - name: CateringResource
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bookable catering asset (e.g., Portable-Cart-1)" }
      - { name: capacity, type: integer, source: input, default: 0, description: "Max guests the resource supports (0 = unspecified)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE (only value; resource is always bookable subject to temporal overlap). Values: AVAILABLE" }

  - name: CateringOrder
    parent: null
    common_fields: true
    fields:
      - { name: resource_id, type: string, source: input, description: "FK -> CateringResource.id; the booked resource" }
      - { name: loyalty_account_id, type: string, source: input, default: null, description: "FK -> LoyaltyAccount.id; optional member host" }
      - { name: event_start, type: datetime, source: input, description: "Inclusive start of the event booking" }
      - { name: event_end, type: datetime, source: input, description: "Exclusive end of the event booking; must be > event_start" }
      - { name: guest_count, type: integer, source: input, description: "Expected guest count" }
      - { name: line_items, type: array, source: input, description: "Invoice lines, each { qty:int, unit_price_cents:int, discount_pct:number(0..1) }" }
      - { name: invoice_total_cents, type: integer, source: computed, default: null, description: "Read-only: catering_invoice_total; null until quoted" }
      - { name: required_deposit_cents, type: integer, source: computed, default: null, description: "Read-only: round_half_up(invoice_total_cents * CATERING_DEPOSIT_PCT); null until quoted" }
      - { name: deposit_paid_cents, type: integer, source: computed, default: 0, description: "Read-only: deposit recorded at confirm" }
      - { name: status, type: enum, source: system, description: "DRAFT → QUOTED → CONFIRMED → FULFILLED; any of DRAFT/QUOTED/CONFIRMED → CANCELLED. Values: DRAFT, QUOTED, CONFIRMED, FULFILLED, CANCELLED" }

  - name: DailyReconciliation
    parent: null
    common_fields: true
    fields:
      - { name: business_date, type: string, source: input, description: "Business date label (YYYY-MM-DD) the reconciliation covers" }
      - { name: counted_cash_cents, type: integer, source: computed, default: null, description: "Read-only: physically counted cash entered at close" }
      - { name: expected_revenue_cents, type: integer, source: computed, default: null, description: "Read-only: sum of final_total_cents over tickets swept in at close, plus adjustments" }
      - { name: cash_variance_cents, type: integer, source: computed, default: null, description: "Read-only: counted_cash_cents - expected_revenue_cents" }
      - { name: adjustments, type: array, source: computed, default: [], description: "Posted adjustment entries, each { amount_cents:int, reason:string }; each post bumps version and re-derives expected_revenue/cash_variance" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED. Values: OPEN, CLOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Machine
    initial_state: READY
    terminal_states: []
    transitions:
      - from: READY
        to: CLEANING
        trigger: "POST /machines/{id}/start-cleaning"
        actor: ShiftLead
        preconditions:
          - "Machine.sanitation_status == READY (else ERR_MACHINE_INVALID_STATE)"
        side_effects: []
      - from: OUT_OF_SERVICE
        to: CLEANING
        trigger: "POST /machines/{id}/start-cleaning"
        actor: ShiftLead
        preconditions:
          - "Machine.sanitation_status == OUT_OF_SERVICE"
        side_effects: []
      - from: CLEANING
        to: READY
        trigger: "POST /machines/{id}/complete-cleaning"
        actor: ShiftLead
        preconditions:
          - "Machine.sanitation_status == CLEANING (else ERR_MACHINE_INVALID_STATE)"
        side_effects:
          - "Append a SanitationLog { machine_id, cleaned_at = clock-now, previous_status = CLEANING }"
          - "Set Machine.last_cleaned_at = clock-now"
          - "Cascade: every Flavor with this machine_id in SUSPENDED → LOADED"
      - from: READY
        to: OUT_OF_SERVICE
        trigger: "system, evaluated by POST /machines/{id}/check-sanitation or on POST /sale-tickets/{id}/lines dispensing"
        actor: system
        preconditions:
          - "clock-now >= Machine.last_cleaned_at + CLEAN_INTERVAL_HOURS (boundary is inclusive >=)"
        side_effects:
          - "Cascade: every Flavor with this machine_id in LOADED → SUSPENDED"

  - entity: Flavor
    initial_state: LOADED
    terminal_states: [ROTATED_OUT]
    transitions:
      - from: LOADED
        to: SUSPENDED
        trigger: "system (cascade from parent Machine READY → OUT_OF_SERVICE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: LOADED
        trigger: "system (cascade from parent Machine complete-cleaning → READY)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADED
        to: ROTATED_OUT
        trigger: "POST /flavors/{id}/rotate-out"
        actor: ShiftLead
        preconditions:
          - "Flavor.status == LOADED (else ERR_FLAVOR_INVALID_STATE)"
        side_effects: []

  - entity: Topping
    initial_state: AVAILABLE
    terminal_states: [ROTATED_OUT]
    transitions:
      - from: AVAILABLE
        to: ROTATED_OUT
        trigger: "POST /toppings/{id}/rotate-out"
        actor: ShiftLead
        preconditions:
          - "Topping.status == AVAILABLE (else ERR_TOPPING_INVALID_STATE)"
        side_effects: []

  - entity: LoyaltyAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /loyalty-accounts/{id}/suspend"
        actor: Manager
        preconditions:
          - "LoyaltyAccount.status == ACTIVE (else ERR_LOYALTY_INVALID_STATE)"
        side_effects: []

  - entity: SaleTicket
    initial_state: "OPEN / UNRECONCILED"
    terminal_states: [VOIDED]
    transitions:
      - from: "payment_status=OPEN"
        to: "payment_status=CHARGED"
        trigger: "POST /sale-tickets/{id}/checkout"
        actor: Cashier
        preconditions:
          - "payment_status == OPEN (else ERR_TICKET_NOT_OPEN)"
          - "Ticket has >= 1 SaleLine (else ERR_EMPTY_TICKET)"
          - "If loyalty_account_id set, that LoyaltyAccount.status == ACTIVE (else ERR_LOYALTY_ACCOUNT_SUSPENDED) — cross-entity"
          - "If voucher_id supplied: RewardVoucher.status == ISSUED and clock-now < expires_at (else ERR_VOUCHER_NOT_REDEEMABLE / ERR_VOUCHER_EXPIRED)"
        side_effects:
          - "Compute quoted_total_cents via sale_ticket_total QUOTED variant"
          - "provisional_points = floor(quoted_total_cents / POINTS_DIVISOR); if loyalty attached, LoyaltyAccount.points_provisional += provisional_points"
          - "If voucher applied: RewardVoucher.status → REDEEMED; redeemed_voucher_id set"
          - "payment_status → CHARGED"
      - from: "payment_status=CHARGED"
        to: "payment_status=VOIDED"
        trigger: "POST /sale-tickets/{id}/void"
        actor: ShiftLead
        preconditions:
          - "payment_status == CHARGED (else ERR_TICKET_NOT_CHARGED)"
          - "reconciliation_status == UNRECONCILED (else ERR_TICKET_ALREADY_RECONCILED)"
        side_effects:
          - "Restore each Topping.on_hand_units by units consumed by this ticket's lines"
          - "Restore each source Machine.current_mix_level_oz by the net_weight_oz dispensed by this ticket's lines (capped at mix_par_oz)"
          - "If loyalty attached: LoyaltyAccount.points_provisional -= provisional_points"
          - "If a voucher was redeemed: RewardVoucher.status → ISSUED (un-redeem)"
          - "payment_status → VOIDED"
      - from: "reconciliation_status=UNRECONCILED"
        to: "reconciliation_status=RECONCILED"
        trigger: "system (cascade from DailyReconciliation OPEN → CLOSED)"
        actor: system
        preconditions:
          - "payment_status == CHARGED (voided tickets are skipped)"
        side_effects:
          - "Compute final_total_cents via sale_ticket_total FINALIZED variant; set reconciliation_id"
          - "final_points = floor(final_total_cents / POINTS_DIVISOR)"
          - "If loyalty attached: points_lifetime += final_points; points_provisional -= provisional_points; punch_count += 1; if punch_count >= PUNCH_THRESHOLD then issue RewardVoucher and punch_count -= PUNCH_THRESHOLD"

  - entity: MaintenanceWindow
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /maintenance-windows/{id}/cancel"
        actor: ShiftLead
        preconditions:
          - "MaintenanceWindow.status == SCHEDULED (else ERR_WINDOW_INVALID_STATE)"
        side_effects:
          - "Window no longer participates in maintenance overlap checks"

  - entity: CateringOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /catering-orders/{id}/quote"
        actor: Manager
        preconditions:
          - "CateringOrder.status == DRAFT (else ERR_CATERING_INVALID_STATE)"
        side_effects:
          - "Compute invoice_total_cents via catering_invoice_total; required_deposit_cents = round_half_up(invoice_total_cents * CATERING_DEPOSIT_PCT)"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /catering-orders/{id}/confirm"
        actor: Manager
        preconditions:
          - "CateringOrder.status == QUOTED (else ERR_CATERING_INVALID_STATE)"
          - "No other CONFIRMED/FULFILLED CateringOrder on the same resource_id overlaps [event_start, event_end) (else ERR_RESOURCE_DOUBLE_BOOKED) — temporal"
          - "deposit_paid_cents >= required_deposit_cents (else ERR_DEPOSIT_INSUFFICIENT) — fiscal"
        side_effects:
          - "deposit_paid_cents set from request"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "POST /catering-orders/{id}/fulfill"
        actor: Manager
        preconditions:
          - "CateringOrder.status == CONFIRMED (else ERR_CATERING_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /catering-orders/{id}/cancel"
        actor: Manager
        preconditions:
          - "CateringOrder.status in {DRAFT, QUOTED, CONFIRMED} (else ERR_CATERING_INVALID_STATE)"
        side_effects: []
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /catering-orders/{id}/cancel"
        actor: Manager
        preconditions:
          - "CateringOrder.status in {DRAFT, QUOTED, CONFIRMED}"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /catering-orders/{id}/cancel"
        actor: Manager
        preconditions:
          - "CateringOrder.status in {DRAFT, QUOTED, CONFIRMED}"
        side_effects:
          - "Frees the resource booking so the interval no longer blocks other confirmations"

  - entity: DailyReconciliation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /daily-reconciliations/{id}/close"
        actor: Manager
        preconditions:
          - "DailyReconciliation.status == OPEN (else ERR_RECONCILIATION_INVALID_STATE)"
        side_effects:
          - "Sweep: every CHARGED + UNRECONCILED SaleTicket → RECONCILED (see SaleTicket reconciliation axis; cascades to LoyaltyAccount and RewardVoucher)"
          - "expected_revenue_cents = sum(final_total_cents of swept tickets) + sum(adjustments.amount_cents)"
          - "counted_cash_cents set from request; cash_variance_cents = counted_cash_cents - expected_revenue_cents"
          - "status → CLOSED"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on parent.version; CREATE-with-supersede only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: maintenance-window-create-stale-machine
    parent_entity: Machine
    write_endpoint: "POST /maintenance-windows"
    occ_field: "expected_machine_version"
    description: |
      Scheduling a MaintenanceWindow against a Machine whose version has
      advanced since the client last observed it is rejected. Creating a
      window legitimately supersedes the machine's prior next_maintenance_at
      (it re-stamps Machine.next_maintenance_at and bumps the machine's
      version); a second create carrying the pre-supersede version is stale
      and refused with a precondition-failed status.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reconciliation-adjustment-stale
    parent_entity: DailyReconciliation
    write_endpoint: "POST /daily-reconciliations/{id}/adjustments"
    occ_field: "expected_daily_reconciliation_version"
    description: |
      Posting an adjustment to a DailyReconciliation whose version has
      advanced since the client last read it is rejected. Each adjustment
      legitimately supersedes the running expected_revenue/cash_variance and
      bumps the reconciliation's version; an adjustment carrying the
      pre-supersede version is stale and refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sale_ticket_total
    trigger: "checkout (QUOTED variant) and reconciliation close (FINALIZED variant)"
    algorithm: tiered_pricing
    formula: |
      Per cup (SaleLine) let W = net_weight_oz, P = flavor.price_per_oz_cents,
      S = sum(topping.surcharge_cents for topping_ids), D = active seasonal
      discount_pct at the evaluation clock (0 if none active).

      QUOTED (at checkout):
        line_quoted_cents = round_half_up(W * P * (1 - D)) + S
        subtotal = sum(line_quoted_cents over all lines)
        pre_voucher = max(MIN_TICKET_CHARGE_CENTS, subtotal)
        quoted_total_cents = max(MIN_TICKET_CHARGE_CENTS,
                                 pre_voucher - voucher_value_if_redeemed)

      FINALIZED (at reconciliation close):
        line_base = round_half_up(W * P) + S            # discount NOT applied per line
        subtotal_base = sum(line_base over all lines)
        discounted = round_half_up(subtotal_base * (1 - D))   # discount applied once to the summed base
        pre_voucher = max(MIN_TICKET_CHARGE_CENTS, discounted)
        final_total_cents = max(MIN_TICKET_CHARGE_CENTS,
                                pre_voucher - voucher_value_if_redeemed)
    input_set: "All SaleLines on the ticket (a voided ticket is never finalized). Voucher term applies only if redeemed_voucher_id set."
    constants:
      MIN_TICKET_CHARGE_CENTS: 100
      POINTS_DIVISOR: 100
    precision: "integer cents; round_half_up on each stated rounding step"
    variants:
      - name: QUOTED
        when: "at checkout; seasonal discount applied to each line's weight portion before per-line rounding, then summed"
        difference: "round-then-sum with per-line discount → stored as quoted_total_cents"
      - name: FINALIZED
        when: "at reconciliation close; seasonal discount applied once to the summed undiscounted base"
        difference: "sum-then-discount → stored as final_total_cents; can differ from QUOTED by rounding granularity"

  - name: waste_valuation
    trigger: "POST /waste-events (both variants computed and stored)"
    algorithm: weighted_scoring
    formula: |
      For MIX waste (flavor_id + waste_weight_oz present):
        cogs_value_cents   = round_half_up(waste_weight_oz * flavor.cost_per_oz_cents)
        retail_value_cents = round_half_up(waste_weight_oz * flavor.price_per_oz_cents)
      For TOPPING waste (topping_id + waste_units present):
        cogs_value_cents   = waste_units * TOPPING_UNIT_COST_CENTS
        retail_value_cents = waste_units * topping.surcharge_cents
    input_set: "Exactly one of {mix waste, topping waste} per event, disambiguated by which id/quantity fields are present."
    constants:
      TOPPING_UNIT_COST_CENTS: 12
    precision: "integer cents; round_half_up"
    variants:
      - name: COGS
        when: "shrinkage/cost reporting"
        difference: "values waste at cost basis (cost_per_oz_cents / TOPPING_UNIT_COST_CENTS)"
      - name: RETAIL
        when: "revenue-loss reporting"
        difference: "values the SAME waste at retail basis (price_per_oz_cents / surcharge_cents) — different number"

  - name: catering_invoice_total
    trigger: "POST /catering-orders/{id}/quote"
    algorithm: aggregation
    formula: |
      For each line item { qty, unit_price_cents, discount_pct }:
        line_cents = round_half_up(qty * unit_price_cents * (1 - discount_pct))
      invoice_total_cents = sum(line_cents over all line_items)   # ROUND PER LINE, THEN SUM
      required_deposit_cents = round_half_up(invoice_total_cents * CATERING_DEPOSIT_PCT)
    input_set: "All line_items on the order."
    constants:
      CATERING_DEPOSIT_PCT: 0.25
    precision: "integer cents; round_half_up per line BEFORE summing (pinned; sum-then-round is NOT used)"

  - name: loyalty_finalization
    trigger: "SaleTicket reconciliation (cascade from DailyReconciliation close)"
    algorithm: threshold
    formula: |
      final_points = floor(final_total_cents / POINTS_DIVISOR)
      account.points_lifetime += final_points
      account.points_provisional -= ticket.provisional_points
      account.punch_count += 1
      if account.punch_count >= PUNCH_THRESHOLD:      # inclusive boundary
        issue RewardVoucher(value_cents = VOUCHER_VALUE_CENTS,
                            expires_at = clock-now + VOUCHER_TTL_HOURS,
                            status = ISSUED)
        account.punch_count -= PUNCH_THRESHOLD
    input_set: "One punch per reconciled CHARGED ticket that carries a loyalty_account_id."
    constants:
      POINTS_DIVISOR: 100
      PUNCH_THRESHOLD: 10
      VOUCHER_VALUE_CENTS: 500
      VOUCHER_TTL_HOURS: 720
    precision: "integer points; floor on division"

  - name: reconciliation_variance
    trigger: "DailyReconciliation close and each adjustment post"
    algorithm: aggregation
    formula: |
      expected_revenue_cents = sum(final_total_cents over tickets whose reconciliation_id == this reconciliation)
                               + sum(a.amount_cents for a in adjustments)
      cash_variance_cents    = counted_cash_cents - expected_revenue_cents
    input_set: "Tickets swept at close (CHARGED + UNRECONCILED at close time), plus all posted adjustments (ordered by created_at ASC)."
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7 (hierarchical: Manager >= ShiftLead >= Cashier)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist; body FK ids (flavor_id, machine_id, topping_ids, resource_id, loyalty_account_id, voucher_id) resolve"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target resource is in the correct state for the operation (state-machine from-state check)"
    error_id: "varies (ERR_TICKET_NOT_OPEN, ERR_TICKET_NOT_CHARGED, ERR_CATERING_INVALID_STATE, ERR_MACHINE_INVALID_STATE, ERR_RECONCILIATION_INVALID_STATE, ...)"
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Allergen guard: a cup's topping_ids must not introduce an allergen the ticket declared excluded; and a flavor's machine must be READY to dispense"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 409
    applies_to: "POST /sale-tickets/{id}/lines"
  - priority: 6
    category: business_safety
    check: "Sanitation gate: the flavor's parent Machine must be READY (not CLEANING/OUT_OF_SERVICE) to dispense a cup"
    error_id: ERR_MACHINE_NOT_READY
    http_status: 409
    applies_to: "POST /sale-tickets/{id}/lines"
  - priority: 7
    category: business_constraint
    check: "Topping availability: each referenced Topping.status == AVAILABLE and on_hand_units >= 1; Flavor.status == LOADED"
    error_id: ERR_TOPPING_UNAVAILABLE
    http_status: 409
    applies_to: "POST /sale-tickets/{id}/lines"
  - priority: 8
    category: business_constraint
    check: "Net weight after tare must be strictly > 0"
    error_id: ERR_INVALID_WEIGHT
    http_status: 400
    applies_to: "POST /sale-tickets/{id}/lines"
  - priority: 9
    category: business_temporal
    check: "Catering resource double-booking: [event_start, event_end) must not overlap another CONFIRMED/FULFILLED order on the same resource (half-open; touching endpoints allowed)"
    error_id: ERR_RESOURCE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /catering-orders/{id}/confirm"
  - priority: 10
    category: business_temporal
    check: "Maintenance window collision: a new window on a machine must be >= MAINTENANCE_BUFFER_MINUTES away from any SCHEDULED window on the same machine (closed interval + buffer on both sides)"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /maintenance-windows"
  - priority: 11
    category: business_fiscal
    check: "Catering deposit: deposit_paid_cents >= required_deposit_cents at confirm"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /catering-orders/{id}/confirm"
  - priority: 12
    category: business_fiscal
    check: "Mix sufficiency: net_weight_oz requested must not exceed the flavor's Machine.current_mix_level_oz"
    error_id: ERR_INSUFFICIENT_MIX
    http_status: 402
    applies_to: "POST /sale-tickets/{id}/lines"
  - priority: 13
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /maintenance-windows, POST /daily-reconciliations/{id}/adjustments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Cashier, ShiftLead, Manager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # --- Machine ---
  - method: POST
    path: "/machines"
    description: "Create a soft-serve machine"
    roles: [Manager]
    code: 201
    input: [name, mix_par_oz, "initial_mix_oz?"]
    output: Machine
    side_effects: ["sanitation_status=READY", "current_mix_level_oz = initial_mix_oz (default mix_par_oz)", "last_cleaned_at = clock-now"]
  - method: GET
    path: "/machines"
    description: "List machines"
    roles: [Cashier, ShiftLead, Manager]
    code: 200
    input: ["limit?", "offset?", "sanitation_status?"]
    output: "Machine[]"
    side_effects: []
  - method: GET
    path: "/machines/{id}"
    description: "Get a machine"
    roles: [Cashier, ShiftLead, Manager]
    code: 200
    input: []
    output: Machine
    side_effects: []
  - method: POST
    path: "/machines/{id}/start-cleaning"
    description: "Begin a cleaning cycle (READY or OUT_OF_SERVICE → CLEANING)"
    roles: [ShiftLead, Manager]
    code: 200
    input: []
    output: Machine
    side_effects: ["sanitation_status → CLEANING"]
  - method: POST
    path: "/machines/{id}/complete-cleaning"
    description: "Finish cleaning (CLEANING → READY); logs sanitation and restores suspended flavors"
    roles: [ShiftLead, Manager]
    code: 200
    input: []
    output: Machine
    side_effects: ["sanitation_status → READY", "append SanitationLog", "last_cleaned_at = clock-now", "SUSPENDED flavors on this machine → LOADED"]
  - method: POST
    path: "/machines/{id}/refill-mix"
    description: "Top up mix level"
    roles: [ShiftLead, Manager]
    code: 200
    input: [added_oz]
    output: Machine
    side_effects: ["current_mix_level_oz = min(mix_par_oz, current_mix_level_oz + added_oz)"]
  - method: POST
    path: "/machines/{id}/check-sanitation"
    description: "Evaluate the sanitation cadence now; if clock-now >= last_cleaned_at + CLEAN_INTERVAL_HOURS and status is READY, transitions to OUT_OF_SERVICE and suspends its flavors"
    roles: [ShiftLead, Manager]
    code: 200
    input: []
    output: Machine
    side_effects: ["READY → OUT_OF_SERVICE when overdue", "cascade LOADED flavors → SUSPENDED"]

  # --- Flavor ---
  - method: POST
    path: "/flavors"
    description: "Load a flavor mix onto a machine"
    roles: [ShiftLead, Manager]
    code: 201
