      - name: encroachment_claim_filing_gated_by_existing_unit_operating_status
        grounds:
          - validations[priority=40]
          - state_machines.ExistingUnit.status.OPERATING_to_SUSPENDED
          - state_machines.ExistingUnit.status.SUSPENDED_to_OPERATING
          - errors.ERR_UNIT_NOT_OPERATING
        distinguishing_aspect: |
          A different entity pair in the opposite direction: creating an EncroachmentClaim is gated
          by the status of the ExistingUnit named in the body (not by a claim gating an
          Application). Suspending the complaining hotel makes the identical filing fail with a 422,
          and restoring it to OPERATING makes it succeed — while the application's own state never
          changes. It also shows the two gates are independent: the suspended unit is excluded from
          the PRELIMINARY impact input set but is still refused as a claimant.
        test_recipe:
          setup:
            - "Brand SOLARIS with one OPERATING 100-room unit 2.00 miles from the property (impact contribution 32.73)."
            - "The impact study run on 2026-08-05, so the claim window closes 2026-08-26."
            - "On 2026-08-06 the neighbouring hotel is placed in SUSPENDED status for a renovation."
