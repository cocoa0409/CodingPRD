# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: grant_provisional_vs_final_disbursement
        grounds:
          - calculations.period_disbursement
          - entities.Disbursement.disbursed_amount_cents
          - entities.Disbursement.gross_entitlement_cents
        distinguishing_aspect: |
          Same GRANT period: the provisional (full-attainment) entitlement is
          gross_entitlement_cents==10000000 while the final attainment-adjusted
          disbursed_amount_cents==8000000 because actual_jobs(80) < awarded_jobs(100).
        test_recipe:
          setup:
            - "GRANT program (grant_per_job_cents=500000, min_jobs=50, min_investment=100000000, budget 1,000,000,000)"
            - "Approved application (100 jobs), executed+active agreement term_years=5 -> max_incentive_cents=50,000,000, per_period_base=10,000,000"
            - "One ACCEPTED compliance report with actual_jobs=80"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 80, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
            - call: "GET /agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /disbursements"
              payload: { agreement_id: "${agr_id}", compliance_report_id: "${rep_id}", expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              captures: { disb_id: $.data.id }
          assert:
            - "Disbursement.${disb_id}.gross_entitlement_cents == 10000000"
            - "Disbursement.${disb_id}.disbursed_amount_cents == 8000000"
            - "Disbursement.${disb_id}.status == CALCULATED"

      - name: recapture_cliff_vs_prorata
        grounds:
          - calculations.recapture_amount
          - state_machines.Agreement.ACTIVE_to_DEFAULTED
          - entities.RecaptureAssessment.assessed_amount_cents
        distinguishing_aspect: |
          PARTIAL default recaptures net_disbursed_cents(8000000) * breached(1)/total(2)
          == 4000000, whereas a MATERIAL default on the same agreement would recapture
          the full 8000000; the two variants operate on RecaptureAssessment, a different
          entity domain than the grant disbursement dual-variant.
        test_recipe:
          setup:
            - "GRANT agreement active, net_disbursed_cents=8,000,000 (one PAID disbursement of 8,000,000)"
            - "Two covenants: JOBS(target 100) BREACHED by report actual_jobs=80; INVESTMENT(target 100000000) MET by actual_investment 150000000"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "JOBS", target_value: 100, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_jobs_id: $.data.id }
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "INVESTMENT", target_value: 100000000, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_inv_id: $.data.id }
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 80, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
            - call: "GET /agreements/${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { agr_v: $.data.version }
            - call: "POST /disbursements"
              payload: { agreement_id: "${agr_id}", compliance_report_id: "${rep_id}", expected_agreement_version: "${agr_v}" }
              as: ComplianceOfficer
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /disbursements/${disb_id}/pay"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /agreements/${agr_id}/declare-default"
              payload: { severity: "PARTIAL", reason: "jobs shortfall" }
              as: ProgramDirector
            - call: "GET /recapture-assessments?agreement_id=${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ra_id: "$.data[0].id" }
          assert:
            - "RecaptureAssessment.${ra_id}.severity == PARTIAL"
            - "RecaptureAssessment.${ra_id}.breached_covenants_count == 1"
            - "RecaptureAssessment.${ra_id}.total_covenants_count == 2"
            - "RecaptureAssessment.${ra_id}.assessed_amount_cents == 4000000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_score_mincap_nonlinear
        grounds:
          - calculations.but_for_eligibility_score
          - entities.Application.but_for_eligibility_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear min caps. jobs raw 60 and investment
          raw 45 each clamp to 30, plus but_for_bonus 25 -> score 85.00; without the
          min caps the naive sum would be 130.00, so the min interaction is load-bearing.
        test_recipe:
          setup:
            - "GRANT program (min_jobs=50, min_investment=100000000, but_for_pass_threshold=60)"
            - "Application proposed_jobs=100, proposed_investment_cents=150000000, but_for_attested=true, distress_zone=false"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true, distress_zone: false }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
              captures: { score: $.data.but_for_eligibility_score }
          assert:
            - "Application.${app_id}.but_for_eligibility_score == 85.0"

      - name: abatement_award_cap_round_then_sum
        grounds:
          - calculations.incentive_award_cap
          - entities.Agreement.max_incentive_cents
        distinguishing_aspect: |
          Mode (b): round-per-year-then-sum. per_year = round_half_up(100004 * 12.5/100)
          = round(12500.5) = 12501; times term 3 = 37503. Sum-then-round would give
          round(3*12500.5)=round(37501.5)=37502, so the pinned rounding order changes the cap.
        test_recipe:
          setup:
            - "ABATEMENT program (abatement_rate_pct=12.5, min_jobs=10, min_investment=10000000)"
            - "Parcel current_assessed_value_cents=100004; approved application; agreement term_years=3"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Abate Pilot", incentive_type: "ABATEMENT", total_budget_cents: 1000000000, min_jobs_required: 10, min_investment_cents: 10000000, max_term_years: 10, abatement_rate_pct: 12.5, grant_per_job_cents: 0, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-9", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100004 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Beta", proposed_jobs: 10, proposed_investment_cents: 10000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 3, awarded_jobs: 10, awarded_investment_cents: 10000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
          assert:
            - "Agreement.${agr_id}.max_incentive_cents == 37503"
            - "Agreement.${agr_id}.incentive_type == ABATEMENT"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: compliance_report_return_resubmit_cycle
        grounds:
          - state_machines.ComplianceReport.SUBMITTED_to_RETURNED
          - state_machines.ComplianceReport.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          Cycle on ComplianceReport: SUBMITTED -> RETURNED -> SUBMITTED revisits a prior
          state (non-linear), unlike a forward-only pipeline.
        test_recipe:
          setup:
            - "GRANT agreement active; one SUBMITTED compliance report"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 80, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep_id}/return"
              payload: { reason: "restate jobs" }
              as: ProgramAnalyst
              captures: { st_returned: $.data.status }
            - call: "POST /compliance-reports/${rep_id}/resubmit"
              payload: { actual_jobs: 100, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { st_resubmitted: $.data.status }
          assert:
            - "ComplianceReport.${rep_id}.status == SUBMITTED"
            - "the return step produced status RETURNED and resubmit returned it to SUBMITTED"

      - name: covenant_branching_met_and_breached
        grounds:
          - state_machines.Covenant.ACTIVE_to_MET
          - state_machines.Covenant.ACTIVE_to_BREACHED
        distinguishing_aspect: |
          Branching fork on Covenant (a different entity than ComplianceReport): a single
          accept trigger forks two ACTIVE covenants into divergent outcomes -- JOBS -> BREACHED,
          INVESTMENT -> MET -- with divergent side-effect sets.
        test_recipe:
          setup:
            - "GRANT agreement active with two ACTIVE covenants: JOBS(target 100), INVESTMENT(target 100000000)"
            - "One SUBMITTED report actual_jobs=80, actual_investment_cents=150000000, attestation=true"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "JOBS", target_value: 100, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_jobs_id: $.data.id }
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "INVESTMENT", target_value: 100000000, measurement_start_date: "2028-01-01T00:00:00.000Z", measurement_end_date: "2028-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_inv_id: $.data.id }
            - call: "POST /agreements/${agr_id}/compliance-reports"
              payload: { reporting_year: 2027, period_start_date: "2027-01-01T00:00:00.000Z", period_end_date: "2028-01-01T00:00:00.000Z", actual_jobs: 80, actual_investment_cents: 150000000, attestation: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep_id}/accept"
              payload: {}
              as: ProgramAnalyst
          assert:
            - "Covenant.${cov_jobs_id}.status == BREACHED"
            - "Covenant.${cov_jobs_id}.attainment_pct == 80.0"
            - "Covenant.${cov_inv_id}.status == MET"
            - "Covenant.${cov_inv_id}.attainment_pct == 150.0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: default_breach_recapture_depth3
        grounds:
          - state_machines.Agreement.ACTIVE_to_DEFAULTED
          - state_machines.Covenant.ACTIVE_to_BREACHED
          - entities.RecaptureAssessment.status
        distinguishing_aspect: |
          Depth-3 chain from declare-default: Agreement ACTIVE->DEFAULTED (hop1) causes
          Covenant ACTIVE->BREACHED (hop2) which itself causes a RecaptureAssessment to be
          created (hop3). Each hop is caused by the previous link, not by the trigger directly.
        test_recipe:
          setup:
            - "GRANT agreement active with a single ACTIVE covenant JOBS(target 100); no reports; net_disbursed 0"
          setup_api_calls:
            - call: "POST /incentive-programs"
              payload: { program_name: "Grant Pilot", incentive_type: "GRANT", total_budget_cents: 1000000000, min_jobs_required: 50, min_investment_cents: 100000000, max_term_years: 10, abatement_rate_pct: 0, grant_per_job_cents: 500000, tif_capture_pct: 0, but_for_pass_threshold: 60 }
              as: ProgramDirector
              captures: { pg_id: $.data.id }
            - call: "POST /parcels"
              payload: { parcel_identifier: "APN-1", jurisdiction: "City", base_assessed_value_cents: 0, current_assessed_value_cents: 100000000 }
              as: ProgramDirector
              captures: { parcel_id: $.data.id }
            - call: "POST /applications"
              payload: { program_id: "${pg_id}", applicant_user_id: "applicant-1", applicant_name: "Acme", proposed_jobs: 100, proposed_investment_cents: 150000000, but_for_attested: true }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramAnalyst
              as_user_id: "analyst-1"
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "director-1"
            - call: "POST /agreements"
              payload: { application_id: "${app_id}", parcel_id: "${parcel_id}", term_years: 5, awarded_jobs: 100, awarded_investment_cents: 150000000 }
              as: ProgramDirector
              captures: { agr_id: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /agreements/${agr_id}/covenants"
              payload: { covenant_type: "JOBS", target_value: 100, measurement_start_date: "2027-01-01T00:00:00.000Z", measurement_end_date: "2027-12-31T00:00:00.000Z" }
              as: ProgramDirector
              captures: { cov_id: $.data.id }
          trigger:
            - call: "POST /agreements/${agr_id}/declare-default"
              payload: { severity: "MATERIAL", reason: "abandonment" }
              as: ProgramDirector
              captures: { agr_status: $.data.status }
            - call: "GET /recapture-assessments?agreement_id=${agr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ra_id: "$.data[0].id" }
          assert:
            - "Agreement.${agr_id}.status == DEFAULTED"
            - "Covenant.${cov_id}.status == BREACHED"
            - "RecaptureAssessment.${ra_id}.status == ASSESSED"
            - "RecaptureAssessment.${ra_id}.breached_covenants_count == 1"
            - "RecaptureAssessment.${ra_id}.assessed_amount_cents == 0"

      - name: accept_covenant_completion_bubble_depth3
        grounds:
          - state_machines.ComplianceReport.SUBMITTED_to_ACCEPTED
