  - section: cross_cutting_complexity_layers
    instances:
    - name: rubric_version_create_rejects_a_stale_expected_brand_version
      claim_type: optimistic_concurrency
      grounds:
      - concurrency_rules.rubric-version-create-stale-brand
      - errors.ERR_STALE_BRAND_VERSION
      - validations.priority_10
      - endpoints.POST /rubric-versions
      distinguishing_aspect: The guarded parent is the Brand, but the write creates a RubricVersion - so the version the client must echo belongs to a row it is not writing, and that row's version advances
        as a side effect of every successful rubric creation. A client that drafts two versions back to back therefore fails on the second unless it re-reads the brand.
      test_recipe:
