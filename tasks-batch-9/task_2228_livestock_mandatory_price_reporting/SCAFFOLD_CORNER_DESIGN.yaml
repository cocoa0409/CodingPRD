              as: ReporterAgent
              as_user_id: "${ent_a}"
              captures: { sub_lv: $.data.id }
            - call: "GET /reporting-windows/${win_bb}"
              payload: {}
              as: ProgramAdmin
              captures: { wv_bb: $.data.version }
            - call: "POST /submissions"
              payload: { plant_id: "${plant_a}", reporting_window_id: "${win_bb}", expected_window_version: "${wv_bb}" }
              as: ReporterAgent
