            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { st2: $.data.status }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "CLOSE" }
              as: PracticeAdmin
              captures: { st3: $.data.status }
            - call: "GET /anesthesia-coverage/${cov_id}"
              payload: {}
              as: PracticeAdmin
              captures: { cst2: $.data.status }
          assert:
            - "${st1} == PUBLISHED, ${cap1} == 480 and ${rem1} == 480"
            - "${full} == true, ${oi} == 1 and ${cst} == ACTIVE"
            - "${st2} == COVERAGE_CONFIRMED - the promotion came from the coverage write, not from a status action"
            - "${st3} == CLOSED and ${cst2} == RELEASED"
            - "${cap0} == 480 and ${rem0} == 480 were already computed at DRAFT, and ${v1} > 1"
