          assert:
            - "err == 'ERR_LOCATION_CAPACITY_EXCEEDED'"

      - name: dietary_preference_violation_on_swap_suggestion
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_DIETARY_PREFERENCE_VIOLATION]
        distinguishing_aspect: "POST /clients/{id}/feedback with swap_suggestion_product_id referencing a product carrying a blocked dietary_flag returns ERR_DIETARY_PREFERENCE_VIOLATION."
        test_recipe:
          setup:
            - "Client with a CONTAINS_GLUTEN preference; product with dietary_flags=[CONTAINS_GLUTEN]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
