# =============================================================================
# SCAFFOLD.yaml — Low-Vision & Assistive-Technology Service (task 0980)
# §1.0–§1.7 seed tables. Difficulty design and corner design live in the
# sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  generate task hard than expert level! 980. Low-Vision & Assistive-Technology Service: evaluation & device (magnifier/CCTV/screen-reader), training & follow-up, funding (VR/insurance) & billing, loaner & trial, repair/upgrade, referral, subscription support, outcome

domain_name: low-vision-at-service
api_prefix: /api

# =============================================================================
# §0 Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true  =>  id (UUID, identity only, never a business-decision
# input), created_at, updated_at (refreshed on every mutation incl. cascaded
# side effects), version (integer, starts 1, +1 on every mutation).
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: copay_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | LOW_INCOME — LOW_INCOME halves the client share on INSURANCE claims" }
      - { name: status, type: enum, source: system, description: "INTAKE on creation; ACTIVE once a referral is ACCEPTED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: source_type, type: enum, source: input, description: "PHYSICIAN | VR_AGENCY | INSURANCE | SELF" }
      - { name: referring_party, type: string, source: input, description: "Free-text name of the referring physician/agency" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> ACCEPTED | DECLINED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decide call; null until decided" }

  - name: Evaluation
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; referral must be ACCEPTED" }
      - { name: evaluator_user_id, type: string, source: system, description: "Opaque X-User-ID of the VisionSpecialist who created the evaluation" }
      - { name: acuity_score, type: integer, source: input, description: "0-100; optional at creation, required to finalize", constraints: "0..100" }
      - { name: contrast_score, type: integer, source: input, description: "0-100; optional at creation, required to finalize", constraints: "0..100" }
      - { name: field_loss_pct, type: integer, source: input, description: "0-100; optional at creation, required to finalize", constraints: "0..100" }
      - { name: recommended_category, type: enum, source: input, description: "MAGNIFIER | CCTV | SCREEN_READER; optional at creation, required to finalize" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED -> REVISED -> FINALIZED (cycle); DRAFT/REVISED -> SUPERSEDED when a newer evaluation is created for the same client" }

  - name: DeviceModel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catalog display name" }
      - { name: category, type: enum, source: input, description: "MAGNIFIER | CCTV | SCREEN_READER" }
      - { name: list_price_cents, type: integer, source: input, description: "Catalog price in integer cents", constraints: ">= 0" }
      - { name: subscription_monthly_cents, type: integer, source: input, default: 0, description: "Monthly subscription price for software (screen readers); 0 for pure hardware", constraints: ">= 0" }
      - { name: successor_model_id, type: string, source: input, description: "FK -> DeviceModel.id; optional upgrade path to a newer model; null when none" }
      - { name: in_stock_count, type: integer, source: computed, description: "Count of DeviceUnits of this model with status IN_STOCK" }
      - { name: total_count, type: integer, source: computed, description: "Count of all DeviceUnits of this model across every status (conserved quantity)" }

  - name: DeviceUnit
    parent: null
    common_fields: true
    fields:
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id" }
      - { name: serial_no, type: string, source: input, description: "Manufacturer serial; unique across all units" }
      - { name: condition, type: enum, source: input, description: "NEW | REFURB | LOANER" }
      - { name: status, type: enum, source: system, description: "IN_STOCK -> DEPLOYED | ON_LOAN | IN_REPAIR -> IN_STOCK (cycle); any non-terminal -> RETIRED" }

  - name: DeviceOrder
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> Evaluation.id; evaluation must be FINALIZED" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; model category must match evaluation.recommended_category" }
      - { name: fulfillment_type, type: enum, source: input, description: "PURCHASE | TRIAL | LOANER" }
      - { name: trial_days, type: integer, source: input, description: "Trial length in days; required when fulfillment_type == TRIAL, ignored otherwise", constraints: "1..60" }
      - { name: warranty_cents, type: integer, source: input, default: 0, description: "Optional extended-warranty add-on charged at conversion/purchase", constraints: ">= 0" }
      - { name: device_unit_id, type: string, source: system, description: "FK -> DeviceUnit.id; assigned by allocate; null while PLACED" }
      - { name: dispensed_at, type: datetime, source: system, description: "Logical-clock timestamp of allocate; null while PLACED" }
      - { name: trial_ends_at, type: datetime, source: computed, description: "= dispensed_at + trial_days for TRIAL orders; null otherwise" }
      - { name: conversion_total_cents, type: integer, source: computed, description: "Computed by trial_conversion_fee on convert; null until CONVERTED; for PURCHASE set at allocate" }
      - { name: status, type: enum, source: system, description: "PLACED -> ACTIVE -> CONVERTED | RETURNED; TRIAL ACTIVE -> EXPIRED (run_daily) -> RETURNED" }

  - name: LoanAgreement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; copied from the triggering DeviceOrder for LOANER fulfillments; null for repair loaners (a repair ticket has no client)" }
      - { name: device_unit_id, type: string, source: system, description: "FK -> DeviceUnit.id; the loaned unit" }
      - { name: device_order_id, type: string, source: system, description: "FK -> DeviceOrder.id; set when the loan comes from a LOANER fulfillment order, null for repair loaners" }
      - { name: repair_ticket_id, type: string, source: system, description: "FK -> RepairTicket.id; set when the loan comes from a repair, null otherwise" }
      - { name: loaned_at, type: datetime, source: system, description: "Logical-clock timestamp at loan creation" }
      - { name: due_at, type: datetime, source: computed, description: "= loaned_at + 30 days" }
      - { name: returned_at, type: datetime, source: system, description: "Logical-clock timestamp of return; null until RETURNED" }
      - { name: overdue_days, type: integer, source: computed, description: "Whole days between due_at and returned_at (or current clock while OVERDUE); 0 when not overdue" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RETURNED; ACTIVE -> OVERDUE (run_daily) -> RETURNED" }

  - name: TrainingPlan
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: device_order_id, type: string, source: input, description: "FK -> DeviceOrder.id; order must be ACTIVE or CONVERTED" }
      - { name: total_sessions, type: integer, source: input, description: "Purchased session count", constraints: "1..20" }
      - { name: completed_sessions, type: integer, source: computed, default: 0, description: "Count of sessions resolved COMPLETED" }
      - { name: no_show_count, type: integer, source: computed, default: 0, description: "Count of sessions resolved NO_SHOW" }
      - { name: status, type: enum, source: system, description: "PLANNED -> ACTIVE (first session scheduled) -> COMPLETED (completed_sessions == total_sessions) | SUSPENDED (no_show_count >= 2)" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: training_plan_id, type: string, source: system, description: "FK -> TrainingPlan.id; set from the nesting path" }
      - { name: instructor_user_id, type: string, source: input, description: "Opaque staff id of the instructor; half-open interval overlap is checked per instructor" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (logical clock domain)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end; must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED | NO_SHOW | CANCELLED" }

  - name: FundingAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: payer_type, type: enum, source: input, description: "VR | INSURANCE" }
      - { name: payer_ref, type: string, source: input, description: "External authorization/reference number" }
      - { name: authorized_amount_cents, type: integer, source: input, description: "Total authorized funding in cents", constraints: "> 0" }
      - { name: remaining_amount_cents, type: integer, source: computed, description: "= authorized - reserved(SUBMITTED claims at provisional) - paid(PAID claims at payer_pays); VOIDED/DENIED claims excluded" }
      - { name: valid_from, type: datetime, source: input, description: "Start of funding validity window (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "End of funding validity window (inclusive); must be >= valid_from" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the FundingCoordinator who submitted; adjudicator must differ (segregation of duties)" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of the PayerAdjudicator who adjudicated; null until adjudicated" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | DENIED; DENIED -> APPEALED -> SUBMITTED (appeal cycle); APPROVED -> EXPIRED (run_daily) | EXHAUSTED (remaining hits 0)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: funding_authorization_id, type: string, source: input, description: "FK -> FundingAuthorization.id" }
      - { name: device_order_id, type: string, source: input, description: "FK -> DeviceOrder.id; order must belong to the authorization's client" }
      - { name: service_date, type: datetime, source: input, description: "Date of service; must satisfy valid_from <= service_date <= valid_until on the authorization" }
      - { name: lines, type: array, source: input, description: "Array of { line_type: DEVICE|WARRANTY|TRAINING|SHIPPING, unit_price_cents: integer >= 0, quantity: integer 1..10 }; 1..10 elements" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Estimated allowed total at creation via claim_provisional_total (per-line rounding)" }
      - { name: final_amount_cents, type: integer, source: system, description: "Remittance allowed amount set at adjudication PAID; null otherwise" }
      - { name: payer_pays_cents, type: integer, source: computed, description: "Payer responsibility per payer_responsibility; set at adjudication PAID, null otherwise" }
      - { name: client_pays_cents, type: integer, source: computed, description: "= final_amount_cents - payer_pays_cents with LOW_INCOME halving; set at adjudication PAID" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the BillingSpecialist who submitted; adjudicator must differ (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> PAID | DENIED; SUBMITTED|PAID -> VOIDED (compensating)" }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: device_unit_id, type: string, source: input, description: "FK -> DeviceUnit.id; unit must be DEPLOYED or IN_STOCK at intake" }
      - { name: issue_description, type: string, source: input, description: "Free-text problem description" }
      - { name: technician_user_id, type: string, source: system, description: "X-User-ID of the RepairTechnician who opened the ticket" }
      - { name: loan_agreement_id, type: string, source: system, description: "FK -> LoanAgreement.id; set when START_REPAIR ran with needs_loaner=true; null otherwise" }
      - { name: rework_count, type: integer, source: computed, default: 0, description: "Increments each QA_FAIL (QA_CHECK -> IN_REPAIR rework loop)" }
      - { name: status, type: enum, source: system, description: "INTAKE -> DIAGNOSED -> IN_REPAIR -> QA_CHECK -> RESOLVED; QA_CHECK -> IN_REPAIR (rework cycle)" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: device_model_id, type: string, source: input, description: "FK -> DeviceModel.id; model must have subscription_monthly_cents > 0" }
      - { name: period_start, type: datetime, source: input, description: "Subscription period start (inclusive)" }
      - { name: period_end, type: datetime, source: computed, description: "= period_start + 30 days; extended by +30 days on each renew" }
      - { name: auto_renew, type: boolean, source: input, default: false, description: "Ignored by run_daily except it does not auto-charge; informational flag" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative fees paid (creation fee + renewal fees); drives the loyalty tier" }
      - { name: last_fee_cents, type: integer, source: computed, description: "Fee charged by the most recent create/renew per subscription_loyalty_fee" }
      - { name: credit_cents, type: integer, source: computed, description: "Prorated credit computed at cancel per subscription_cancel_credit; null until CANCELLED" }
      - { name: past_due_since, type: datetime, source: system, description: "Set to period_end when run_daily flips ACTIVE -> PAST_DUE; null otherwise" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> PAST_DUE (run_daily past period_end) -> SUSPENDED (14 days later); ACTIVE|PAST_DUE -> ACTIVE (renew); ACTIVE|PAST_DUE|SUSPENDED -> CANCELLED" }

  - name: OutcomeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: kind, type: enum, source: input, description: "BASELINE | FOLLOW_UP" }
      - { name: task_score, type: integer, source: input, description: "0-100 self-reported task performance", constraints: "0..100" }
      - { name: satisfaction_score, type: integer, source: input, description: "0-100 self-reported satisfaction", constraints: "0..100" }
      - { name: acuity_delta, type: integer, source: input, description: "0-100 clinician-measured acuity improvement; optional at creation, required to finalize", constraints: "0..100" }
      - { name: provisional_composite, type: integer, source: computed, description: "Self-report composite at creation: round_half_up(0.5*task_score + 0.5*satisfaction_score)" }
      - { name: final_composite, type: integer, source: computed, description: "Clinician composite at finalize: round_half_up(0.3*acuity_delta + 0.4*task_score + 0.3*satisfaction_score); null until SCORED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SCORED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    initial_state: INTAKE
    terminal_states: []
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "system (automatic when one of the client's Referrals transitions RECEIVED -> ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Client.status = ACTIVE; Client.version increments"

  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /api/referrals/{id}/decide with decision=ACCEPT"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECEIVED"
        side_effects:
          - "decided_at = current logical clock"
          - "Owning Client INTAKE -> ACTIVE (if still INTAKE)"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /api/referrals/{id}/decide with decision=DECLINE"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECEIVED"
        side_effects:
          - "decided_at = current logical clock"

  - entity: Evaluation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/evaluations/{id}/finalize"
        actor: VisionSpecialist
        preconditions:
          - "acuity_score, contrast_score, field_loss_pct, recommended_category all non-null (else ERR_ASSESSMENT_INCOMPLETE)"
        side_effects: []
      - from: REVISED
        to: FINALIZED
        trigger: "POST /api/evaluations/{id}/finalize"
        actor: VisionSpecialist
        preconditions:
          - "acuity_score, contrast_score, field_loss_pct, recommended_category all non-null (else ERR_ASSESSMENT_INCOMPLETE)"
        side_effects: []
      - from: FINALIZED
        to: REVISED
        trigger: "POST /api/evaluations/{id}/revise"
        actor: VisionSpecialist
        preconditions:
          - "No DeviceOrder referencing this evaluation exists in status ACTIVE or CONVERTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new Evaluation is created for the same client)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISED
        to: SUPERSEDED
        trigger: "system (automatic when a new Evaluation is created for the same client)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeviceUnit
    initial_state: IN_STOCK
    terminal_states: [RETIRED]
    transitions:
      - from: IN_STOCK
        to: DEPLOYED
        trigger: "POST /api/device-orders/{id}/allocate (PURCHASE or TRIAL order selects this unit)"
        actor: VisionSpecialist
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (decrements)"
      - from: IN_STOCK
        to: ON_LOAN
        trigger: "POST /api/device-orders/{id}/allocate (LOANER order) or POST /api/repair-tickets/{id}/advance with action=START_REPAIR and needs_loaner=true (loaner unit)"
        actor: VisionSpecialist | RepairTechnician
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (decrements)"
      - from: DEPLOYED
        to: IN_STOCK
        trigger: "POST /api/device-orders/{id}/return (TRIAL return)"
        actor: VisionSpecialist
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (increments)"
      - from: ON_LOAN
        to: IN_STOCK
        trigger: "POST /api/loan-agreements/{id}/return, or POST /api/device-orders/{id}/return (LOANER order)"
        actor: RepairTechnician | VisionSpecialist
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (increments)"
      - from: DEPLOYED
        to: IN_REPAIR
        trigger: "POST /api/repair-tickets/{id}/advance with action=START_REPAIR"
        actor: RepairTechnician
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: IN_REPAIR
        trigger: "POST /api/repair-tickets/{id}/advance with action=START_REPAIR"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (decrements)"
      - from: IN_REPAIR
        to: IN_STOCK
        trigger: "POST /api/repair-tickets/{id}/advance with action=QA_PASS"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (increments)"
      - from: IN_STOCK
        to: RETIRED
        trigger: "POST /api/device-units/{id}/retire"
        actor: ClinicAdmin
        preconditions: []
        side_effects:
          - "DeviceModel.in_stock_count recomputed (decrements)"

  - entity: DeviceOrder
    initial_state: PLACED
    terminal_states: [CONVERTED, RETURNED]
    transitions:
      - from: PLACED
        to: ACTIVE
        trigger: "POST /api/device-orders/{id}/allocate"
        actor: VisionSpecialist
        preconditions:
          - "Evaluation referenced by evaluation_id is FINALIZED (else ERR_EVALUATION_NOT_FINAL)"
          - "Unit selection per order_unit_selector: explicit device_unit_id must be IN_STOCK and of this order's model (else ERR_UNIT_NOT_AVAILABLE); omitted -> auto-select, empty pool -> ERR_NO_ELIGIBLE_UNIT"
        side_effects:
          - "Selected DeviceUnit IN_STOCK -> DEPLOYED (PURCHASE/TRIAL) or ON_LOAN (LOANER); DeviceModel counts recomputed"
          - "dispensed_at = current logical clock; for TRIAL: trial_ends_at = dispensed_at + trial_days"
          - "For PURCHASE: conversion_total_cents computed via trial_conversion_fee with zero trial credit"
          - "For LOANER: create LoanAgreement (device_order_id set, loaned_at = now, due_at = now + 30 days, status ACTIVE)"
      - from: ACTIVE
        to: CONVERTED
        trigger: "POST /api/device-orders/{id}/convert (TRIAL orders only)"
        actor: VisionSpecialist
        preconditions:
          - "fulfillment_type == TRIAL (else ERR_INVALID_STATE)"
          - "current logical clock <= trial_ends_at (else ERR_TRIAL_EXPIRED; exact equality is allowed)"
        side_effects:
          - "conversion_total_cents computed via trial_conversion_fee"
          - "DeviceUnit remains DEPLOYED"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /api/device-orders/{id}/return (TRIAL or LOANER orders only)"
        actor: VisionSpecialist
        preconditions:
          - "fulfillment_type in {TRIAL, LOANER} (PURCHASE orders cannot be returned -> ERR_INVALID_STATE)"
        side_effects:
          - "DeviceUnit DEPLOYED|ON_LOAN -> IN_STOCK; DeviceModel counts recomputed"
          - "For LOANER: linked LoanAgreement ACTIVE|OVERDUE -> RETURNED, returned_at = now"
      - from: EXPIRED
        to: RETURNED
        trigger: "POST /api/device-orders/{id}/return"
        actor: VisionSpecialist
        preconditions: []
        side_effects:
          - "DeviceUnit DEPLOYED -> IN_STOCK; DeviceModel counts recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_daily when fulfillment_type == TRIAL and current logical clock > trial_ends_at)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoanAgreement
    initial_state: ACTIVE
    terminal_states: [RETURNED]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /api/loan-agreements/{id}/return"
        actor: RepairTechnician | VisionSpecialist
        preconditions: []
        side_effects:
          - "returned_at = now; overdue_days finalized"
          - "DeviceUnit ON_LOAN -> IN_STOCK; DeviceModel counts recomputed"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /api/loan-agreements/{id}/return"
        actor: RepairTechnician | VisionSpecialist
        preconditions: []
        side_effects:
          - "returned_at = now; overdue_days finalized"
          - "DeviceUnit ON_LOAN -> IN_STOCK; DeviceModel counts recomputed"
      - from: ACTIVE
        to: OVERDUE
        trigger: "system (run_daily when current logical clock > due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "overdue_days recomputed"

  - entity: TrainingPlan
    initial_state: PLANNED
    terminal_states: [COMPLETED, SUSPENDED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system (automatic when the first TrainingSession is scheduled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when a session resolve makes completed_sessions == total_sessions)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when a session resolve makes no_show_count >= 2)"
        actor: system
        preconditions: []
        side_effects:
          - "All SCHEDULED TrainingSessions of this plan -> CANCELLED (cascade link 3 of the no-show chain)"

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/training-sessions/{id}/resolve with outcome=COMPLETED"
        actor: VisionSpecialist
        preconditions: []
        side_effects:
          - "TrainingPlan.completed_sessions += 1"
          - "If completed_sessions == total_sessions: TrainingPlan ACTIVE -> COMPLETED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/training-sessions/{id}/resolve with outcome=NO_SHOW"
        actor: VisionSpecialist
        preconditions: []
        side_effects:
          - "TrainingPlan.no_show_count += 1"
          - "If no_show_count >= 2: TrainingPlan ACTIVE -> SUSPENDED, which cascades CANCELLED to remaining SCHEDULED sessions"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/training-sessions/{id}/resolve with outcome=CANCELLED, or system (plan suspension cascade)"
        actor: VisionSpecialist | system
        preconditions: []
        side_effects: []

  - entity: FundingAuthorization
    initial_state: DRAFT
    terminal_states: [EXPIRED, EXHAUSTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/funding-authorizations/{id}/submit"
        actor: FundingCoordinator
        preconditions: []
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: APPEALED
        to: SUBMITTED
        trigger: "POST /api/funding-authorizations/{id}/submit"
        actor: FundingCoordinator
        preconditions: []
        side_effects:
          - "submitted_by_user_id = X-User-ID (overwrites the prior submitter)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/funding-authorizations/{id}/adjudicate with decision=APPROVE"
        actor: PayerAdjudicator
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "adjudicated_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/funding-authorizations/{id}/adjudicate with decision=DENY"
        actor: PayerAdjudicator
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "adjudicated_by_user_id = X-User-ID"
      - from: DENIED
        to: APPEALED
        trigger: "POST /api/funding-authorizations/{id}/appeal"
        actor: FundingCoordinator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic when remaining_amount_cents reaches 0 after a claim adjudication)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: APPROVED
        trigger: "system (automatic when a claim void raises remaining_amount_cents above 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (run_daily when current logical clock > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "FundingAuthorization.status == APPROVED (else ERR_FUNDING_NOT_APPROVED)"
          - "valid_from <= service_date <= valid_until (else ERR_FUNDING_WINDOW_INVALID)"
          - "provisional_total_cents <= remaining_amount_cents (else ERR_INSUFFICIENT_FUNDING; exact equality is allowed)"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "FundingAuthorization.remaining_amount_cents -= provisional_total_cents (reserve)"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /api/claims/{id}/adjudicate with decision=PAY"
        actor: PayerAdjudicator
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "allowed_amount_cents required"
        side_effects:
          - "final_amount_cents = allowed_amount_cents; payer_pays_cents and client_pays_cents computed via payer_responsibility"
          - "FundingAuthorization.remaining_amount_cents += provisional_total_cents - payer_pays_cents (release reservation, deduct payer share)"
          - "If remaining_amount_cents == 0: FundingAuthorization APPROVED -> EXHAUSTED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/claims/{id}/adjudicate with decision=DENY"
        actor: PayerAdjudicator
        preconditions:
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "FundingAuthorization.remaining_amount_cents += provisional_total_cents (release reservation)"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /api/claims/{id}/void"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "FundingAuthorization.remaining_amount_cents += provisional_total_cents (compensation)"
          - "If FundingAuthorization was EXHAUSTED and remaining > 0: EXHAUSTED -> APPROVED"
      - from: PAID
        to: VOIDED
        trigger: "POST /api/claims/{id}/void"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "FundingAuthorization.remaining_amount_cents += payer_pays_cents (compensation)"
          - "If FundingAuthorization was EXHAUSTED and remaining > 0: EXHAUSTED -> APPROVED"

  - entity: RepairTicket
    initial_state: INTAKE
    terminal_states: [RESOLVED]
    transitions:
      - from: INTAKE
        to: DIAGNOSED
        trigger: "POST /api/repair-tickets/{id}/advance with action=DIAGNOSE"
        actor: RepairTechnician
        preconditions: []
        side_effects: []
      - from: DIAGNOSED
        to: IN_REPAIR
        trigger: "POST /api/repair-tickets/{id}/advance with action=START_REPAIR"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "Ticket's DeviceUnit DEPLOYED|IN_STOCK -> IN_REPAIR; DeviceModel counts recomputed if it left IN_STOCK"
          - "If needs_loaner=true (cascade link 1): create LoanAgreement for the ticket's client (repair_ticket_id set, due_at = now + 30 days)"
          - "Loan creation (link 2): loaner unit selected per loaner_unit_selector moves IN_STOCK -> ON_LOAN (empty pool -> ERR_NO_ELIGIBLE_UNIT and the whole advance is rejected)"
          - "Unit move (link 3): DeviceModel.in_stock_count recomputed"
      - from: IN_REPAIR
        to: QA_CHECK
        trigger: "POST /api/repair-tickets/{id}/advance with action=SUBMIT_QA"
        actor: RepairTechnician
        preconditions: []
        side_effects: []
      - from: QA_CHECK
        to: IN_REPAIR
        trigger: "POST /api/repair-tickets/{id}/advance with action=QA_FAIL"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "rework_count += 1"
      - from: QA_CHECK
        to: RESOLVED
        trigger: "POST /api/repair-tickets/{id}/advance with action=QA_PASS"
        actor: RepairTechnician
        preconditions:
          - "Linked LoanAgreement (if any) must be RETURNED (else ERR_LOAN_STILL_ACTIVE)"
        side_effects:
          - "Ticket's DeviceUnit IN_REPAIR -> IN_STOCK; DeviceModel counts recomputed"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/renew"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "last_fee_cents computed via subscription_loyalty_fee; total_paid_cents += last_fee_cents; period_end += 30 days"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /api/subscriptions/{id}/renew"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "last_fee_cents computed via subscription_loyalty_fee; total_paid_cents += last_fee_cents; period_end = now + 30 days; past_due_since = null"
      - from: ACTIVE
        to: PAST_DUE
        trigger: "system (run_daily when current logical clock > period_end)"
        actor: system
        preconditions: []
        side_effects:
          - "past_due_since = period_end"
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "system (run_daily when current logical clock > past_due_since + 14 days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "credit_cents computed via subscription_cancel_credit"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "credit_cents = 0 (no proration credit once past due)"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /api/subscriptions/{id}/cancel"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "credit_cents = 0"

  - entity: OutcomeAssessment
    initial_state: DRAFT
    terminal_states: [SCORED]
    transitions:
      - from: DRAFT
        to: SCORED
        trigger: "POST /api/outcome-assessments/{id}/finalize"
        actor: VisionSpecialist
        preconditions:
          - "acuity_delta non-null (else ERR_ASSESSMENT_INCOMPLETE)"
        side_effects:
          - "final_composite computed via outcome_composite (clinician variant)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: evaluation-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /api/evaluations"
    occ_field: expected_client_version
    description: |
      Creating an Evaluation for a Client whose version has advanced since the
      caller last observed it is rejected with ERR_STALE_VERSION. This captures
      the create-with-supersede case: creating an Evaluation supersedes every
      existing DRAFT/REVISED Evaluation of the same Client and increments
      Client.version by 1, so a writer holding a stale observed version must
      not supersede on top of changes it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Precision is integer cents, round_half_up, unless stated otherwise.
# =============================================================================
calculations:
  - name: claim_provisional_total
    trigger: "Claim creation (POST /api/claims)"
    algorithm: tiered_pricing
    formula: |
      factor = 1.00 if funding_authorization.payer_type == VR else 0.80   # INSURANCE
      for each line in claim.lines (in array order):
        line_estimated_cents = round_half_up(line.unit_price_cents * line.quantity * factor)
      provisional_total_cents = sum(line_estimated_cents)                # ROUND PER LINE, THEN SUM (pinned order)
      # Sum-then-round is explicitly NOT used; it can differ by cents.
    input_set: "All lines of the new claim; payer factor from the linked FundingAuthorization regardless of its status"
    constants:
      VR_FACTOR: 1.00
      INSURANCE_FACTOR: 0.80
    precision: "integer cents, round_half_up per line before summation"
    variants:
      - name: provisional
        when: "At claim creation; stored in provisional_total_cents"
        difference: "Uses the payer discount factor estimate per line"
      - name: final
        when: "At claim adjudication with decision=PAY; stored in final_amount_cents"
        difference: "Uses the remittance allowed_amount_cents supplied by the PayerAdjudicator, ignoring the estimate entirely; the delta (provisional - payer_pays) is reconciled against FundingAuthorization.remaining_amount_cents"

  - name: payer_responsibility
    trigger: "Claim adjudication with decision=PAY (POST /api/claims/{id}/adjudicate)"
    algorithm: waterfall_allocation
    formula: |
      available_cents = funding_authorization.remaining_amount_cents + claim.provisional_total_cents  # reservation included
      if payer_type == VR:
        base_cents = allowed_amount_cents
      else:  # INSURANCE
        base_cents = round_half_up(allowed_amount_cents * 0.80)
      payer_pays_cents = min(base_cents, available_cents)
      client_pays_cents = allowed_amount_cents - payer_pays_cents
      if client.copay_tier == LOW_INCOME and payer_type == INSURANCE:
        client_pays_cents = round_half_up(client_pays_cents * 0.5)   # state subsidy covers half the client share
        payer_pays_cents = allowed_amount_cents - client_pays_cents  # subsidy portion is absorbed by payer side
    input_set: "The adjudicated claim, its FundingAuthorization (current remaining + this claim's reservation), and the Client's copay_tier"
    constants:
      INSURANCE_COINSURANCE: 0.80
      LOW_INCOME_SUBSIDY: 0.50
    precision: "integer cents, round_half_up"
    variants: []

  - name: outcome_composite
    trigger: "OutcomeAssessment creation (provisional) and finalize (final)"
    algorithm: weighted_scoring
    formula: |
      provisional_composite = round_half_up(0.5 * task_score + 0.5 * satisfaction_score)
      final_composite       = round_half_up(0.3 * acuity_delta + 0.4 * task_score + 0.3 * satisfaction_score)
    input_set: "The assessment's own task_score, satisfaction_score, acuity_delta"
    constants:
      PROVISIONAL_TASK_W: 0.5
      PROVISIONAL_SAT_W: 0.5
      FINAL_ACUITY_W: 0.3
      FINAL_TASK_W: 0.4
      FINAL_SAT_W: 0.3
    precision: "integer 0..100, round_half_up"
    variants:
      - name: provisional
        when: "Computed and stored at creation"
        difference: "Self-report weighting (task/satisfaction only), ignores acuity_delta"
      - name: final
        when: "Computed and stored at finalize"
        difference: "Clinician weighting including acuity_delta; identical inputs therefore yield a different composite than provisional"

  - name: trial_conversion_fee
    trigger: "POST /api/device-orders/{id}/convert (TRIAL), and allocate for PURCHASE orders (days_used = 0)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned to break the circular-looking dependency
      # "service fee is a percentage of the order value":
      #   (1) days_used = whole days from dispensed_at to now, clamped to [0, trial_days]
      #   (2) trial_credit = min(round_half_up(list_price_cents * 0.02 * days_used),
      #                          round_half_up(list_price_cents * 0.30))
      #   (3) device_subtotal = list_price_cents - trial_credit
      #   (4) service_fee = round_half_up(device_subtotal * 0.12)   # fee on subtotal, NOT on total
      #   (5) conversion_total_cents = device_subtotal + service_fee + warranty_cents
    input_set: "The order's DeviceModel list price, the order's trial_days/dispensed_at/warranty_cents, current logical clock"
    constants:
      DAILY_CREDIT_RATE: 0.02
      CREDIT_CAP_RATE: 0.30
      SERVICE_FEE_RATE: 0.12
    precision: "integer cents, round_half_up at each pinned step"
    variants: []

  - name: subscription_loyalty_fee
    trigger: "Subscription create and renew"
    algorithm: threshold
    formula: |
      tier = 0.10 if total_paid_cents >= 100000 else (0.05 if total_paid_cents >= 50000 else 0.0)
      # Boundary: total_paid_cents == 50000 exactly earns the 5% tier (>=, not >)
      fee_cents = round_half_up(device_model.subscription_monthly_cents * (1 - tier))
      # On create, the tier is computed against total_paid_cents BEFORE the creation fee (i.e. 0).
    input_set: "The subscription's total_paid_cents prior to this charge, and the model's subscription_monthly_cents"
    constants:
      TIER_5_THRESHOLD: 50000
      TIER_10_THRESHOLD: 100000
    precision: "integer cents, round_half_up"
    variants: []

  - name: subscription_cancel_credit
    trigger: "POST /api/subscriptions/{id}/cancel from ACTIVE"
    algorithm: decay_function
    formula: |
      days_remaining = whole days from now to period_end, clamped to [0, 30]
      credit_cents = round_half_up(device_model.subscription_monthly_cents * days_remaining / 30)
    input_set: "The subscription's period_end, current logical clock, and the model's monthly price"
    constants:
      PERIOD_DAYS: 30
    precision: "integer cents, round_half_up"
    variants: []

  - name: funding_remaining
    trigger: "Claim submit, adjudicate, and void (see Claim state machine side effects)"
    algorithm: aggregation
    formula: |
      remaining_amount_cents = authorized_amount_cents
        - sum(provisional_total_cents of SUBMITTED claims)
        - sum(payer_pays_cents of PAID claims)
      # DRAFT, DENIED and VOIDED claims contribute 0. Maintained incrementally by
      # the transitions; the aggregate form above is the reconciliation invariant.
    input_set: "Claims of this FundingAuthorization in status SUBMITTED or PAID only"
    precision: "integer cents"
    variants: []

  - name: unit_pool_counts
    trigger: "Every DeviceUnit status change (allocate, return, repair advance, retire)"
    algorithm: aggregation
    formula: |
      in_stock_count = count(units of model with status == IN_STOCK)
      total_count    = count(all units of model, every status including RETIRED)
      # Conservation: total_count never changes after unit creation;
      # allocate/return/repair moves only shift units between status buckets.
    input_set: "All DeviceUnits with device_model_id == model.id, no status filter for total_count"
    precision: "integer counts"
    variants: []

  - name: daily_sweep
    trigger: "POST /api/ops/run_daily"
    algorithm: threshold
    formula: |
      Using the current logical clock `now`:
      1. DeviceOrder: fulfillment_type == TRIAL and status == ACTIVE and now > trial_ends_at  -> EXPIRED
      2. LoanAgreement: status == ACTIVE and now > due_at -> OVERDUE (overdue_days = whole days past due_at)
      3. Subscription: status == ACTIVE and now > period_end -> PAST_DUE (past_due_since = period_end)
      4. Subscription: status == PAST_DUE and now > past_due_since + 14 days -> SUSPENDED
      5. FundingAuthorization: status == APPROVED and now > valid_until -> EXPIRED
      All boundaries are strict (>); exact equality does not trigger.
      Processing order within a run: entity types in the order above; within a
      type, entities in created_at ASC order.
    input_set: "Entities in the states named above"
    constants:
      PAST_DUE_GRACE_DAYS: 14
    precision: "whole days"
    variants: []

  - name: order_unit_selector
    trigger: "POST /api/device-orders/{id}/allocate when device_unit_id is omitted"
    algorithm: aggregation
    formula: |
      eligibility: DeviceUnit.status == IN_STOCK and device_model_id == order.device_model_id
        and (fulfillment_type == PURCHASE ? condition in {NEW, REFURB} : condition in {LOANER, REFURB, NEW})
      ranking: condition rank ascending — TRIAL/LOANER: LOANER(0) < REFURB(1) < NEW(2); PURCHASE: NEW(0) < REFURB(1)
      tie-break: created_at ASC (never id)
      empty pool -> ERR_NO_ELIGIBLE_UNIT
    input_set: "DeviceUnits of the order's model"
    precision: "n/a"
    variants: []

  - name: loaner_unit_selector
    trigger: "POST /api/repair-tickets/{id}/advance action=START_REPAIR with needs_loaner=true"
    algorithm: aggregation
    formula: |
      eligibility: DeviceUnit.status == IN_STOCK and condition == LOANER
        and device_model_id == ticket_unit.device_model_id
      ranking: created_at ASC (never id)
      empty pool -> ERR_NO_ELIGIBLE_UNIT (the advance is rejected atomically)
    input_set: "DeviceUnits of the broken unit's model"
    precision: "n/a"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role name recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum members valid, numeric ranges honored, scheduled_start < scheduled_end, valid_from <= valid_until"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all endpoints accepting a body
  - priority: 4
    category: existence
    check: "Path ids exist (validated left to right); body foreign-key ids exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "OCC: expected_client_version equals Client.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/evaluations"
  - priority: 6
    category: state
    check: "Entity is in a state from which the requested transition exists (incl. plan must be PLANNED/ACTIVE to schedule -> ERR_PLAN_SUSPENDED when SUSPENDED; terminal states reject everything)"
    error_id: ERR_INVALID_STATE | ERR_PLAN_SUSPENDED
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 7
    category: business_safety
    check: "Segregation of duties: adjudicator X-User-ID must differ from the recorded submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/funding-authorizations/{id}/adjudicate, POST /api/claims/{id}/adjudicate"
  - priority: 8
    category: business_referential
    check: "Cross-entity state: referral ACCEPTED before evaluation create; evaluation FINALIZED before order create/allocate and not blocked from revise; order ACTIVE|CONVERTED before training-plan create; authorization APPROVED before claim submit; linked loan RETURNED before repair QA_PASS"
    error_id: ERR_REFERRAL_NOT_ACCEPTED | ERR_EVALUATION_NOT_FINAL | ERR_ORDER_NOT_ACTIVE | ERR_FUNDING_NOT_APPROVED | ERR_LOAN_STILL_ACTIVE
    http_status: 409
    applies_to: "POST /api/evaluations, POST /api/device-orders, POST /api/device-orders/{id}/allocate, POST /api/evaluations/{id}/revise, POST /api/training-plans, POST /api/claims/{id}/submit, POST /api/repair-tickets/{id}/advance"
  - priority: 9
    category: business_temporal
    check: "Temporal windows and overlaps: claim service_date inside funding window; trial convert within trial_ends_at; instructor half-open session overlap; subscription closed-interval overlap for same client+model"
    error_id: ERR_FUNDING_WINDOW_INVALID | ERR_TRIAL_EXPIRED | ERR_SESSION_OVERLAP | ERR_SUBSCRIPTION_OVERLAP
    http_status: 409
    applies_to: "POST /api/claims/{id}/submit, POST /api/device-orders/{id}/convert, POST /api/training-plans/{id}/sessions, POST /api/subscriptions"
  - priority: 10
    category: business_constraint
    check: "Domain constraints: order model category matches evaluation recommendation; explicit unit IN_STOCK and correct model; auto-select pool non-empty; scheduled session count below plan total_sessions; finalize requires complete scores"
    error_id: ERR_CATEGORY_MISMATCH | ERR_UNIT_NOT_AVAILABLE | ERR_NO_ELIGIBLE_UNIT | ERR_PLAN_SESSION_CAP | ERR_ASSESSMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /api/device-orders, POST /api/device-orders/{id}/allocate, POST /api/repair-tickets/{id}/advance, POST /api/training-plans/{id}/sessions, POST /api/evaluations/{id}/finalize, POST /api/outcome-assessments/{id}/finalize"
  - priority: 11
    category: business_fiscal
    check: "Fiscal: claim provisional_total_cents <= FundingAuthorization.remaining_amount_cents (exact equality allowed)"
    error_id: ERR_INSUFFICIENT_FUNDING
    http_status: 422
    applies_to: "POST /api/claims/{id}/submit"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# GET list endpoints accept filter fields as optional query parameters plus
# limit?/offset? per the envelope pagination defaults.
# =============================================================================
endpoints:
  # --- Client ---
  - method: POST
    path: "/api/clients"
    description: "Create a client (status INTAKE)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, date_of_birth, "copay_tier?"]
    output: Client
    side_effects: ["status=INTAKE"]
  - method: GET
    path: "/api/clients/{id}"
    description: "Get one client"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/api/clients/{id}/referrals"
    description: "List referrals of a client (FK reverse reachability)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/api/clients/{id}/outcome-assessments"
    description: "List outcome assessments of a client (FK reverse reachability)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: OutcomeAssessment[]
    side_effects: []

  # --- Referral ---
  - method: POST
    path: "/api/referrals"
    description: "Create a referral (status RECEIVED)"
    roles: [IntakeCoordinator]
    code: 201
    input: [client_id, source_type, referring_party]
    output: Referral
    side_effects: ["status=RECEIVED"]
  - method: POST
    path: "/api/referrals/{id}/decide"
    description: "Accept or decline a referral"
    roles: [IntakeCoordinator]
    code: 200
    input: [decision]
    output: Referral
    side_effects: ["ACCEPT: client INTAKE -> ACTIVE", "decided_at = now"]

  # --- Evaluation ---
  - method: POST
    path: "/api/evaluations"
    description: "Create an evaluation (DRAFT). OCC guard on Client.version. Supersedes the client's existing DRAFT/REVISED evaluations. The referral must belong to the same client (else ERR_VALIDATION)."
    roles: [VisionSpecialist]
    code: 201
    input: [client_id, referral_id, expected_client_version, "acuity_score?", "contrast_score?", "field_loss_pct?", "recommended_category?"]
    output: Evaluation
    side_effects:
      - "increments Client.version by 1"
      - "client's DRAFT/REVISED evaluations -> SUPERSEDED"
  - method: GET
    path: "/api/evaluations/{id}"
    description: "Get one evaluation"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: Evaluation
    side_effects: []
  - method: GET
    path: "/api/evaluations"
    description: "List evaluations (FK reverse reachability for client_id and referral_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["client_id?", "referral_id?", "status?", "limit?", "offset?"]
    output: Evaluation[]
    side_effects: []
  - method: POST
    path: "/api/evaluations/{id}/finalize"
    description: "Finalize an evaluation (DRAFT or REVISED -> FINALIZED)"
    roles: [VisionSpecialist]
    code: 200
    input: []
    output: Evaluation
    side_effects: ["status -> FINALIZED"]
  - method: POST
    path: "/api/evaluations/{id}/revise"
    description: "Reopen a finalized evaluation for revision (FINALIZED -> REVISED)"
    roles: [VisionSpecialist]
    code: 200
    input: ["acuity_score?", "contrast_score?", "field_loss_pct?", "recommended_category?"]
    output: Evaluation
    side_effects: ["status -> REVISED", "optional score fields updated"]

  # --- DeviceModel / DeviceUnit (catalog) ---
  - method: POST
    path: "/api/device-models"
    description: "Create a catalog device model"
    roles: [ClinicAdmin]
    code: 201
    input: [name, category, list_price_cents, "subscription_monthly_cents?", "successor_model_id?"]
    output: DeviceModel
    side_effects: ["in_stock_count=0, total_count=0"]
  - method: GET
    path: "/api/device-models/{id}"
    description: "Get one device model"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: DeviceModel
    side_effects: []
  - method: GET
    path: "/api/device-models/{id}/predecessors"
    description: "List models whose successor_model_id points at this model (FK reverse reachability)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DeviceModel[]
    side_effects: []
  - method: POST
    path: "/api/device-units"
    description: "Receive a physical unit into stock"
    roles: [ClinicAdmin]
    code: 201
    input: [device_model_id, serial_no, condition]
    output: DeviceUnit
    side_effects: ["status=IN_STOCK", "DeviceModel.in_stock_count and total_count recompute (increment)"]
  - method: GET
    path: "/api/device-units/{id}"
    description: "Get one device unit"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: []
  - method: GET
    path: "/api/device-units"
    description: "List units, filterable (FK reverse reachability for device_model_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["device_model_id?", "status?", "condition?", "limit?", "offset?"]
    output: DeviceUnit[]
    side_effects: []
  - method: GET
    path: "/api/device-units/{id}/repair-tickets"
    description: "List repair tickets of a unit (FK reverse reachability)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RepairTicket[]
    side_effects: []
  - method: POST
    path: "/api/device-units/{id}/retire"
    description: "Retire an IN_STOCK unit"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["status IN_STOCK -> RETIRED", "DeviceModel.in_stock_count recomputed"]

  # --- DeviceOrder ---
  - method: POST
    path: "/api/device-orders"
    description: "Place a device order (PLACED). Evaluation must be FINALIZED; model category must match the recommendation."
    roles: [VisionSpecialist]
    code: 201
    input: [client_id, evaluation_id, device_model_id, fulfillment_type, "trial_days?", "warranty_cents?"]
    output: DeviceOrder
    side_effects: ["status=PLACED"]
  - method: GET
    path: "/api/device-orders/{id}"
    description: "Get one device order"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: DeviceOrder
    side_effects: []
  - method: GET
    path: "/api/device-orders"
    description: "List orders, filterable (FK reverse reachability for client_id, evaluation_id, device_model_id, device_unit_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["client_id?", "evaluation_id?", "device_model_id?", "device_unit_id?", "status?", "limit?", "offset?"]
    output: DeviceOrder[]
    side_effects: []
  - method: POST
    path: "/api/device-orders/{id}/allocate"
    description: "Allocate a unit and dispense (PLACED -> ACTIVE). Omit device_unit_id for deterministic auto-select."
    roles: [VisionSpecialist]
    code: 200
    input: ["device_unit_id?"]
    output: DeviceOrder
    side_effects:
      - "unit IN_STOCK -> DEPLOYED|ON_LOAN; model counts recompute"
      - "dispensed_at = now; TRIAL sets trial_ends_at; PURCHASE computes conversion_total_cents"
      - "LOANER creates LoanAgreement (ACTIVE, due now + 30 days)"
  - method: POST
    path: "/api/device-orders/{id}/convert"
    description: "Convert a trial to purchase (ACTIVE -> CONVERTED) within the trial window"
    roles: [VisionSpecialist]
    code: 200
    input: []
    output: DeviceOrder
    side_effects: ["conversion_total_cents computed via trial_conversion_fee"]
  - method: POST
    path: "/api/device-orders/{id}/return"
    description: "Return a TRIAL/LOANER order (ACTIVE|EXPIRED -> RETURNED)"
    roles: [VisionSpecialist]
    code: 200
    input: []
    output: DeviceOrder
    side_effects: ["unit -> IN_STOCK; model counts recompute", "LOANER: linked LoanAgreement -> RETURNED"]

  # --- LoanAgreement ---
  - method: GET
    path: "/api/loan-agreements/{id}"
    description: "Get one loan agreement"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: LoanAgreement
    side_effects: []
  - method: GET
    path: "/api/loan-agreements"
    description: "List loans, filterable (FK reverse reachability for client_id, device_unit_id, device_order_id, repair_ticket_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["client_id?", "device_unit_id?", "device_order_id?", "repair_ticket_id?", "status?", "limit?", "offset?"]
    output: LoanAgreement[]
    side_effects: []
  - method: POST
    path: "/api/loan-agreements/{id}/return"
    description: "Return a loaned unit (ACTIVE|OVERDUE -> RETURNED)"
    roles: [RepairTechnician, VisionSpecialist]
    code: 200
    input: []
    output: LoanAgreement
    side_effects: ["unit ON_LOAN -> IN_STOCK; model counts recompute", "returned_at = now; overdue_days finalized"]

  # --- Training ---
  - method: POST
    path: "/api/training-plans"
    description: "Create a training plan (PLANNED). Order must be ACTIVE or CONVERTED and must belong to the same client (else ERR_VALIDATION)."
    roles: [VisionSpecialist]
    code: 201
    input: [client_id, device_order_id, total_sessions]
    output: TrainingPlan
    side_effects: ["status=PLANNED, completed_sessions=0, no_show_count=0"]
  - method: GET
    path: "/api/training-plans/{id}"
    description: "Get one training plan"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: TrainingPlan
    side_effects: []
  - method: GET
    path: "/api/training-plans"
    description: "List plans, filterable (FK reverse reachability for client_id, device_order_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["client_id?", "device_order_id?", "status?", "limit?", "offset?"]
    output: TrainingPlan[]
    side_effects: []
  - method: POST
    path: "/api/training-plans/{id}/sessions"
    description: "Schedule a session. Half-open [start, end) overlap check per instructor; plan must be PLANNED/ACTIVE; non-cancelled session count must be below total_sessions."
    roles: [VisionSpecialist]
    code: 201
    input: [instructor_user_id, scheduled_start, scheduled_end]
    output: TrainingSession
    side_effects: ["session SCHEDULED", "first session flips plan PLANNED -> ACTIVE"]
  - method: GET
    path: "/api/training-plans/{id}/sessions"
    description: "List sessions of a plan (FK reverse reachability)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []
  - method: POST
    path: "/api/training-sessions/{id}/resolve"
    description: "Resolve a scheduled session (SCHEDULED -> COMPLETED | NO_SHOW | CANCELLED)"
    roles: [VisionSpecialist]
    code: 200
    input: [outcome]
    output: TrainingSession
    side_effects:
      - "COMPLETED: plan.completed_sessions += 1; plan completes at total_sessions"
      - "NO_SHOW: plan.no_show_count += 1; at 2 the plan SUSPENDS and remaining SCHEDULED sessions are CANCELLED"

  # --- FundingAuthorization ---
  - method: POST
    path: "/api/funding-authorizations"
    description: "Create a funding authorization (DRAFT)"
    roles: [FundingCoordinator]
    code: 201
    input: [client_id, payer_type, payer_ref, authorized_amount_cents, valid_from, valid_until]
    output: FundingAuthorization
    side_effects: ["status=DRAFT, remaining_amount_cents = authorized_amount_cents"]
  - method: GET
    path: "/api/funding-authorizations/{id}"
    description: "Get one funding authorization"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: FundingAuthorization
    side_effects: []
  - method: GET
    path: "/api/funding-authorizations"
    description: "List authorizations, filterable (FK reverse reachability for client_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: FundingAuthorization[]
    side_effects: []
  - method: POST
    path: "/api/funding-authorizations/{id}/submit"
    description: "Submit for payer adjudication (DRAFT|APPEALED -> SUBMITTED)"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: FundingAuthorization
    side_effects: ["submitted_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/funding-authorizations/{id}/adjudicate"
    description: "Payer decision (SUBMITTED -> APPROVED|DENIED). Segregation of duties enforced."
    roles: [PayerAdjudicator]
    code: 200
    input: [decision]
    output: FundingAuthorization
    side_effects: ["adjudicated_by_user_id = X-User-ID"]
  - method: POST
    path: "/api/funding-authorizations/{id}/appeal"
    description: "Appeal a denial (DENIED -> APPEALED)"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: FundingAuthorization
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/api/claims"
    description: "Create a claim (DRAFT) with line items; provisional total computed per-line-rounded then summed. The order must belong to the authorization's client (else ERR_VALIDATION)"
    roles: [BillingSpecialist]
    code: 201
    input: [funding_authorization_id, device_order_id, service_date, lines]
    output: Claim
    side_effects: ["provisional_total_cents computed via claim_provisional_total"]
  - method: GET
    path: "/api/claims/{id}"
    description: "Get one claim"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/api/claims"
    description: "List claims, filterable (FK reverse reachability for funding_authorization_id, device_order_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["funding_authorization_id?", "device_order_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/api/claims/{id}/submit"
    description: "Submit a claim; reserves the provisional amount against the authorization"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["submitted_by_user_id = X-User-ID", "FundingAuthorization.remaining_amount_cents -= provisional_total_cents"]
  - method: POST
    path: "/api/claims/{id}/adjudicate"
    description: "Payer decision (SUBMITTED -> PAID|DENIED). Segregation of duties enforced. PAY requires allowed_amount_cents."
    roles: [PayerAdjudicator]
    code: 200
    input: [decision, "allowed_amount_cents?"]
    output: Claim
    side_effects:
      - "PAY: final_amount_cents, payer_pays_cents, client_pays_cents set; remaining += provisional - payer_pays; remaining==0 -> authorization EXHAUSTED"
      - "DENY: remaining += provisional"
  - method: POST
    path: "/api/claims/{id}/void"
    description: "Void a SUBMITTED or PAID claim (compensating action)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["remaining += provisional (SUBMITTED) or payer_pays (PAID)", "EXHAUSTED authorization revives to APPROVED when remaining > 0"]

  # --- RepairTicket ---
  - method: POST
    path: "/api/repair-tickets"
    description: "Open a repair ticket (INTAKE). Unit must be DEPLOYED or IN_STOCK."
    roles: [RepairTechnician]
    code: 201
    input: [device_unit_id, issue_description]
    output: RepairTicket
    side_effects: ["technician_user_id = X-User-ID"]
  - method: GET
    path: "/api/repair-tickets/{id}"
    description: "Get one repair ticket"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: RepairTicket
    side_effects: []
  - method: GET
    path: "/api/loan-agreements/{id}/repair-tickets"
    description: "List repair tickets linked to a loan (FK reverse reachability for RepairTicket.loan_agreement_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RepairTicket[]
    side_effects: []
  - method: POST
    path: "/api/repair-tickets/{id}/advance"
    description: "Advance the repair workflow: DIAGNOSE | START_REPAIR | SUBMIT_QA | QA_PASS | QA_FAIL"
    roles: [RepairTechnician]
    code: 200
    input: [action, "needs_loaner?"]
    output: RepairTicket
    side_effects:
      - "START_REPAIR: unit -> IN_REPAIR; needs_loaner=true creates LoanAgreement, moves a loaner unit to ON_LOAN, recomputes model counts"
      - "QA_FAIL: rework_count += 1 (QA_CHECK -> IN_REPAIR)"
      - "QA_PASS: unit IN_REPAIR -> IN_STOCK; requires linked loan RETURNED"

  # --- Subscription ---
  - method: POST
    path: "/api/subscriptions"
    description: "Create a subscription (ACTIVE). Closed-interval overlap per client+model; creation fee charged at tier 0. Model must have subscription_monthly_cents > 0 (else ERR_VALIDATION)."
    roles: [BillingSpecialist]
    code: 201
    input: [client_id, device_model_id, period_start, "auto_renew?"]
    output: Subscription
    side_effects: ["period_end = period_start + 30 days", "last_fee_cents = monthly price; total_paid_cents += last_fee_cents"]
  - method: GET
    path: "/api/subscriptions/{id}"
    description: "Get one subscription"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/api/subscriptions"
    description: "List subscriptions, filterable (FK reverse reachability for client_id, device_model_id)"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: ["client_id?", "device_model_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/api/subscriptions/{id}/renew"
    description: "Renew (ACTIVE extends period_end +30 days; PAST_DUE reactivates from now). Loyalty tier on total_paid_cents prior to this charge."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Subscription
    side_effects: ["last_fee_cents via subscription_loyalty_fee; total_paid_cents += last_fee_cents; period_end extended"]
  - method: POST
    path: "/api/subscriptions/{id}/cancel"
    description: "Cancel (ACTIVE|PAST_DUE|SUSPENDED -> CANCELLED). ACTIVE earns prorated credit."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Subscription
    side_effects: ["credit_cents via subscription_cancel_credit (0 unless ACTIVE)"]

  # --- OutcomeAssessment ---
  - method: POST
    path: "/api/outcome-assessments"
    description: "Create an outcome assessment (DRAFT); provisional composite computed immediately"
    roles: [VisionSpecialist]
    code: 201
    input: [client_id, kind, task_score, satisfaction_score, "acuity_delta?"]
    output: OutcomeAssessment
    side_effects: ["provisional_composite computed via outcome_composite (provisional variant)"]
  - method: GET
    path: "/api/outcome-assessments/{id}"
    description: "Get one outcome assessment"
    roles: [IntakeCoordinator, VisionSpecialist, FundingCoordinator, PayerAdjudicator, BillingSpecialist, RepairTechnician, ClinicAdmin]
    code: 200
    input: []
    output: OutcomeAssessment
    side_effects: []
  - method: POST
    path: "/api/outcome-assessments/{id}/finalize"
    description: "Finalize (DRAFT -> SCORED); requires acuity_delta; computes clinician composite"
    roles: [VisionSpecialist]
    code: 200
    input: ["acuity_delta?"]
    output: OutcomeAssessment
    side_effects: ["final_composite computed via outcome_composite (final variant)"]

  # --- Ops / test-driving ---
  - method: POST
    path: "/api/ops/run_daily"
    description: "Run the daily sweep (trial expiry, loan overdue, subscription past-due/suspend, funding expiry) against the logical clock"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: "{ expired_order_ids: string[], overdue_loan_ids: string[], past_due_subscription_ids: string[], suspended_subscription_ids: string[], expired_authorization_ids: string[] }"
    side_effects: ["daily_sweep calculation applied in pinned order; all matches transition"]
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role is not in the endpoint's role list" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type, invalid enum member, out-of-range number, start >= end, or malformed datetime" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_client_version != Client.version on POST /api/evaluations (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition exists; terminal states reject all transitions" }
  - { id: ERR_PLAN_SUSPENDED, http: 409, condition: "Scheduling a session on a SUSPENDED (or COMPLETED) training plan" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjudicator X-User-ID equals the recorded submitted_by_user_id on the authorization or claim" }
  - { id: ERR_REFERRAL_NOT_ACCEPTED, http: 409, condition: "Evaluation created against a referral that is not ACCEPTED" }
  - { id: ERR_EVALUATION_NOT_FINAL, http: 409, condition: "Device order create/allocate with an evaluation not in FINALIZED status" }
  - { id: ERR_ORDER_NOT_ACTIVE, http: 409, condition: "Training plan created for an order not in ACTIVE or CONVERTED status" }
  - { id: ERR_FUNDING_NOT_APPROVED, http: 409, condition: "Claim submit while the funding authorization is not APPROVED" }
  - { id: ERR_LOAN_STILL_ACTIVE, http: 409, condition: "Repair QA_PASS while the linked loan agreement is still ACTIVE or OVERDUE" }
  - { id: ERR_FUNDING_WINDOW_INVALID, http: 422, condition: "Claim service_date outside [valid_from, valid_until] (window is inclusive)" }
  - { id: ERR_TRIAL_EXPIRED, http: 409, condition: "Trial conversion after trial_ends_at (strictly greater; equality allowed)" }
  - { id: ERR_SESSION_OVERLAP, http: 409, condition: "New session overlaps an existing SCHEDULED/COMPLETED session of the same instructor; half-open [start, end) so adjacency (start == other.end) is allowed" }
  - { id: ERR_SUBSCRIPTION_OVERLAP, http: 409, condition: "New subscription overlaps another ACTIVE/PAST_DUE subscription of the same client and model; closed interval so new.period_start <= existing.period_end conflicts" }
  - { id: ERR_CATEGORY_MISMATCH, http: 409, condition: "Order's device model category differs from the evaluation's recommended_category" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Explicit device_unit_id is not IN_STOCK or belongs to a different model" }
  - { id: ERR_NO_ELIGIBLE_UNIT, http: 409, condition: "Auto-selection pool is empty (allocate, or repair loaner selection)" }
  - { id: ERR_PLAN_SESSION_CAP, http: 422, condition: "Non-cancelled session count of the plan has reached total_sessions" }
  - { id: ERR_ASSESSMENT_INCOMPLETE, http: 422, condition: "Finalize with required scores still null (evaluation scores, or acuity_delta on an assessment)" }
  - { id: ERR_INSUFFICIENT_FUNDING, http: 422, condition: "Claim provisional_total_cents > remaining_amount_cents (exact equality allowed)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Front-desk intake staff; owns clients and referrals"
    identity: opaque
    exclusive_operations:
      - "POST /api/clients"
      - "POST /api/referrals"
      - "POST /api/referrals/{id}/decide"
    shared_operations: ["All GET endpoints"]
  - name: VisionSpecialist
    description: "Low-vision clinician; owns evaluations, device orders, training, outcome assessments"
    identity: opaque
    exclusive_operations:
      - "POST /api/evaluations, /finalize, /revise"
      - "POST /api/device-orders, /allocate, /convert, /return"
      - "POST /api/training-plans, /sessions, /resolve"
      - "POST /api/outcome-assessments, /finalize"
    shared_operations: ["All GET endpoints", "POST /api/loan-agreements/{id}/return (shared with RepairTechnician)"]
  - name: FundingCoordinator
    description: "Funding case worker; submits and appeals funding authorizations"
    identity: opaque
    exclusive_operations:
      - "POST /api/funding-authorizations, /submit, /appeal"
    shared_operations: ["All GET endpoints"]
  - name: PayerAdjudicator
    description: "VR counselor / insurance adjudicator (external payer side)"
    identity: opaque
    exclusive_operations:
      - "POST /api/funding-authorizations/{id}/adjudicate"
      - "POST /api/claims/{id}/adjudicate"
    shared_operations: ["All GET endpoints"]
  - name: BillingSpecialist
    description: "Billing staff; owns claims lifecycle and subscriptions"
    identity: opaque
    exclusive_operations:
      - "POST /api/claims, /submit, /void"
      - "POST /api/subscriptions, /renew, /cancel"
    shared_operations: ["All GET endpoints"]
  - name: RepairTechnician
    description: "Bench technician; owns repair tickets and loaner returns"
    identity: opaque
    exclusive_operations:
      - "POST /api/repair-tickets, /advance"
    shared_operations: ["All GET endpoints", "POST /api/loan-agreements/{id}/return (shared with VisionSpecialist)"]
  - name: ClinicAdmin
    description: "Clinic administrator; owns catalog, stock, ops sweep, and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/device-models"
      - "POST /api/device-units, /retire"
      - "POST /api/ops/run_daily"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
