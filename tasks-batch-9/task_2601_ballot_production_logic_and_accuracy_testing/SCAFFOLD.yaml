scenario: |
  Generate task harder than expert level!

  2601. Ballot Production & Logic and Accuracy Testing (county elections office): contest and
  candidate certification with ballot ordering rules and rotation requirements, ballot style
  generation by precinct and district combination with proofing cycles, translation and
  alternative format production for language and accessibility requirements, print vendor
  management with proof approval, quality inspection and secure delivery, equipment programming,
  test deck creation and public logic and accuracy testing with observers, seal application,
  chain of custody and pre-election equipment deployment, ballot inventory accounting across
  issued, voted, spoiled and unused with reconciliation, post-election equipment sealing and
  retention

domain_name: ballot-production-logic-accuracy
api_prefix: ""          # flat top-level collections, e.g.: /elections, /ballot-styles, /print-jobs

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # Contests, precincts and ballot styles form a many-to-many district lattice resolved by
  # district_code set membership rather than by junction rows; BallotStyle is self-referential
  # through supersedes_style_id; CustodyEvent is polymorphic over TabulatorUnit and BallotLot.

  state_machine_shape: cyclic
  # BallotStyle proofing loop PROOFING -> PROOF_REJECTED -> PROOFING, PrintJob QC loop
  # PRINTING -> QC_HOLD -> PRINTING, and TabulatorUnit carries two independent state axes
  # (program_status x custody_status) that evolve on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The technician who programmed a tabulator may not conduct its logic-and-accuracy test, and
  # the person who requested a ballot proof may not sign its proof decision.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 12 entities / 58 endpoints / 49 error codes / 9 calculation rules (3 of them dual-variant)
  # / 10 state machines (2 cyclic, 1 parallel-dimension, 2 branching) / 42 validation rules / 2 OCC races.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Official election name, e.g. "2026 General Election".
      - name: jurisdiction
        type: string
        source: input
        description: County or jurisdiction name that owns the ballot production run.
      - name: election_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant polls open; used as the anchor for retention windows.
      - name: rotation_policy
        type: enum
        source: input
        default: NONE
        description: Candidate rotation regime applied when a contest requires rotation.
        constraints: "one of {NONE, PRECINCT_ROTATION, DISTRICT_ROTATION}"
      - name: candidate_order_method
        type: enum
        source: input
        default: ALPHABETICAL_BY_BALLOT_NAME
        description: Base ordering rule used to assign Candidate.base_order_index inside a contest.
        constraints: "one of {ALPHABETICAL_BY_BALLOT_NAME, FILING_ORDER}"
      - name: la_notice_hours
        type: integer
        source: input
        default: 48
        description: Minimum whole hours of public notice required before a logic-and-accuracy session may start.
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: SETUP
        description: Election phase; gates contest, style, print, deployment and reconciliation operations.
        constraints: "one of {SETUP, CONTESTS_CERTIFIED, STYLES_LOCKED, DEPLOYED, POLLS_CLOSED, RECONCILED}"
      - name: certified_contest_count
        type: integer
        source: computed
        default: 0
        description: Count of Contest rows of this election with status == CERTIFIED; recomputed on every contest certify/withdraw.
      - name: committed_print_cents
        type: integer
        source: computed
        default: 0
        description: Sum of invoice_total_cents over PrintJob rows of this election with status IN {PRINTING, QC_HOLD, QC_PASSED, DELIVERED}; see calculations.print_job_invoice_total.
      - name: deployment_readiness
        type: enum
        source: computed
        default: BLOCKED
        description: Compound gate recomputed from child state; see calculations.election_deployment_readiness.
        constraints: "one of {BLOCKED, READY}"
      - name: open_seal_count
        type: integer
        source: computed
        default: 0
        description: Count of CustodyEvent rows of this election with event_type IN {SEAL_APPLIED, RETENTION_SEAL} minus those with event_type == SEAL_BROKEN; conserved quantity of the seal invariant.
      - name: total_ballots_received
        type: integer
        source: computed
        default: 0
        description: Sum of BallotLot.quantity_received over lots of this election with custody_state IN {RECEIVED, ISSUED, RETURNED}.
      - name: total_ballots_issued
        type: integer
        source: computed
        default: 0
        description: Sum of BallotLot.issued_quantity over lots of this election with custody_state IN {ISSUED, RETURNED}.
      - name: ballot_accountability_status
        type: enum
        source: computed
        default: PENDING
        description: Written by POST /elections/{id}/reconcile from calculations.ballot_accountability_reconciliation.
        constraints: "one of {PENDING, BALANCED, OUT_OF_BALANCE}"
      - name: net_ballot_variance
        type: integer
        source: computed
        default: 0
        description: net_variance from the last reconciliation run; 0 until the first reconcile.
      - name: reconciliation_basis
        type: enum
        source: computed
        description: Basis of the last reconciliation run; null until first reconcile.
        constraints: "one of {PRELIMINARY, FINAL_CANVASS}"
      - name: last_reconciled_at
        type: datetime
        source: computed
        description: Logical-clock instant of the last reconciliation run; null until first reconcile.

  - name: Contest
    parent: Election
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; owning election, taken from the path on creation.
      - name: title
        type: string
        source: input
        description: Contest title as printed on the ballot face.
      - name: contest_type
        type: enum
        source: input
        description: Candidate race or ballot measure; only CANDIDATE contests carry candidates and rotation.
        constraints: "one of {CANDIDATE, MEASURE}"
      - name: district_code
        type: string
        source: input
        description: District whose voters see this contest; matched against BallotStyle.district_codes.
      - name: seats_open
        type: integer
        source: input
        default: 1
        description: Number of seats to be filled; bounds test-deck mark capacity.
        constraints: ">= 1"
      - name: rotation_required
        type: boolean
        source: input
        default: false
        description: When true and election.rotation_policy != NONE, candidate positions rotate per ballot style.
      - name: ballot_order_index
        type: integer
        source: input
        description: Printed order of this contest on the ballot face; unique per (election_id, district_code) among non-WITHDRAWN contests.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Certification state of the contest.
        constraints: "one of {DRAFT, CERTIFIED, WITHDRAWN}"
      - name: certified_candidate_count
        type: integer
        source: computed
        default: 0
        description: Count of Candidate rows of this contest with status == CERTIFIED.
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant the contest was certified; null while DRAFT.
      - name: withdrawn_reason
        type: string
        source: computed
        description: Reason captured by POST /contests/{id}/withdraw; null unless WITHDRAWN.

  - name: Candidate
    parent: Contest
    common_fields: true
    fields:
      - name: contest_id
        type: string
        source: input
        description: FK -> Contest.id; owning contest, taken from the path on creation.
      - name: full_name
        type: string
        source: input
        description: Legal name of the candidate.
      - name: ballot_name
        type: string
        source: input
        description: Name as printed; primary sort key when candidate_order_method == ALPHABETICAL_BY_BALLOT_NAME.
      - name: party_code
        type: string
        source: input
        description: Party abbreviation printed beside the ballot name.
      - name: filing_received_at
        type: datetime
        source: input
        description: Instant the nomination filing was received; primary sort key when candidate_order_method == FILING_ORDER.
      - name: status
        type: enum
        source: system
        default: FILED
        description: Certification state; FILED and DISQUALIFIED candidates count in the PROVISIONAL_BASIS layout variant only, CERTIFIED candidates count in both variants.
        constraints: "one of {FILED, CERTIFIED, DISQUALIFIED}"
      - name: base_order_index
        type: integer
        source: computed
        description: Zero-based rank frozen by POST /elections/{id}/certify-ballot-order; see calculations.candidate_ballot_order.
      - name: disqualified_reason
        type: string
        source: computed
        description: Reason captured by POST /candidates/{id}/disqualify; null unless DISQUALIFIED.

  - name: Precinct
    parent: Election
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; owning election, taken from the path on creation.
      - name: precinct_code
        type: string
        source: input
        description: Precinct identifier; unique per election and the sort key for precinct rotation groups.
      - name: district_codes
        type: array
        source: input
        description: District codes overlapping this precinct; the district combination a ballot style must match.
        constraints: "non-empty array of strings, de-duplicated, compared as a set"
      - name: registered_voter_count
        type: integer
        source: input
        description: Registered voters; drives required_ballot_quantity.
        constraints: ">= 0"
      - name: polling_place
        type: string
        source: input
        description: Polling place name for delivery paperwork.
      - name: assigned_style_id
        type: string
        source: computed
        description: FK -> BallotStyle.id; set by POST /precincts/{id}/assign-style and repointed when that style is superseded. Null until assigned.
      - name: required_ballot_quantity
        type: integer
        source: computed
        description: ceil(registered_voter_count * BALLOT_OVERAGE_NUM / BALLOT_OVERAGE_DEN) per calculations.precinct_ballot_requirement; the minimum printable quantity for this precinct.
      - name: ballots_received
        type: integer
        source: computed
        default: 0
        description: Sum of BallotLot.quantity_received over lots with precinct_id == this precinct and custody_state IN {ISSUED, RETURNED}.
      - name: deployment_status
        type: enum
        source: computed
        default: NOT_READY
        description: READY iff ballots_received >= required_ballot_quantity AND at least one TabulatorUnit with precinct_id == this precinct has program_status == LA_PASSED and custody_status == DEPLOYED; else NOT_READY. Recomputed per calculations.election_deployment_readiness.
        constraints: "one of {NOT_READY, READY}"

  - name: BallotStyle
    parent: Election
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; owning election, taken from the path on creation.
      - name: style_code
        type: string
        source: input
        description: Style identifier; unique per election and the sort key that assigns rotation_seed_index.
      - name: district_codes
        type: array
        source: input
        description: District combination this style prints; a Contest appears on this style iff contest.district_code is a member.
        constraints: "non-empty array of strings, de-duplicated, compared as a set"
      - name: language_set
        type: array
        source: input
        description: Language codes that must be produced for this style, e.g. ["EN", "ES"].
        constraints: "non-empty array; must contain \"EN\""
      - name: required_formats
        type: array
        source: input
        description: Alternative formats that must be produced, e.g. ["PAPER_STANDARD", "LARGE_PRINT", "AUDIO_BALLOT", "BRAILLE_INDEX", "ELECTRONIC_DISPLAY"].
        constraints: "non-empty array; must contain \"PAPER_STANDARD\"; members drawn from the five enumerated formats"
      - name: supersedes_style_id
        type: string
        source: input
        description: FK -> BallotStyle.id; when present the new style supersedes the named style, which transitions to SUPERSEDED. Null for an original style.
      - name: revision
        type: integer
        source: computed
        default: 1
        description: Incremented by one each time POST /ballot-styles/{id}/request-proof is invoked from PROOF_REJECTED.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Proofing lifecycle state of the style.
        constraints: "one of {DRAFT, PROOFING, APPROVED, PROOF_REJECTED, LOCKED, SUPERSEDED}"
      - name: proof_cycle_count
        type: integer
        source: computed
        default: 0
        description: Total number of times this style has entered PROOFING.
      - name: proof_requested_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor of the most recent request-proof; the segregation-of-duties counterparty for proof decisions.
      - name: proof_decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor of the most recent proof decision; null until a decision is recorded.
      - name: translated_languages
        type: array
        source: computed
        description: Language codes certified through POST /ballot-styles/{id}/language-certifications; cleared whenever the style leaves APPROVED or LOCKED for PROOF_REJECTED.
      - name: certified_formats
        type: array
        source: computed
        description: Formats certified through POST /ballot-styles/{id}/language-certifications; cleared with translated_languages.
      - name: rotation_seed_index
        type: integer
        source: computed
        default: 0
        description: Zero-based rank of style_code ASC among the election's BallotStyle rows with status != SUPERSEDED; recomputed for every such style on style create and on supersede.
      - name: contest_count
        type: integer
        source: computed
        default: 0
        description: Count of Contest rows of the election with status == CERTIFIED and district_code member of district_codes.
      - name: precinct_count
        type: integer
        source: computed
        default: 0
        description: Count of Precinct rows with assigned_style_id == this style id.

  - name: PrintVendor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Vendor legal name.
      - name: press_line_count
        type: integer
        source: input
        description: Number of press lines; the aggregate capacity a press window may occupy.
        constraints: ">= 1"
      - name: certified_secure
        type: boolean
        source: input
        default: false
        description: True when the vendor holds a current secure-facility certification; required for any print job.
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: Vendor availability; SUSPENDED vendors cannot receive new print jobs.
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: quality_defect_rate_bp
        type: integer
        source: computed
        default: 0
        description: Most recent inspected defect rate in basis points across this vendor's PrintJob rows, from calculations.print_job_quality_inspection.
      - name: active_job_count
        type: integer
        source: computed
        default: 0
        description: Count of PrintJob rows of this vendor with status IN {PROOF_PENDING, PRINTING, QC_HOLD, QC_PASSED, DELIVERED}.

  - name: PrintJob
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: computed
        description: FK -> Election.id; copied from the referenced BallotStyle.election_id at creation.
      - name: vendor_id
        type: string
        source: input
        description: FK -> PrintVendor.id; the print vendor that owns the press window.
      - name: style_id
        type: string
        source: input
        description: FK -> BallotStyle.id; the ballot style being printed.
      - name: quantity_ordered
        type: integer
        source: input
        description: Ballots ordered for this style across all its precincts.
        constraints: ">= 1"
      - name: unit_cost_cents_per_thousand
        type: integer
        source: input
        description: Contract rate in cents per 1000 ballots.
        constraints: ">= 1"
      - name: press_window_start
        type: datetime
        source: input
        description: Half-open press-window start on the vendor's press lines.
      - name: press_window_end
        type: datetime
        source: input
        description: Half-open press-window end; must be strictly after press_window_start.
      - name: style_version_at_creation
        type: integer
        source: computed
        description: BallotStyle.version observed by the creating client (the accepted expected_ballot_style_version); pins the proof the job was ordered against.
      - name: status
        type: enum
        source: system
        default: PROOF_PENDING
        description: Production lifecycle state of the print job.
        constraints: "one of {PROOF_PENDING, PRINTING, QC_HOLD, QC_PASSED, DELIVERED, REJECTED}"
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID that approved the proof; null until PRINTING.
      - name: sample_size
        type: integer
        source: computed
        description: Sample size of the most recent quality inspection; null before the first inspection.
      - name: defect_count
        type: integer
        source: computed
        description: Defects found in the most recent quality inspection; null before the first inspection.
      - name: defect_rate_bp
        type: integer
        source: computed
        description: Most recent defect rate in basis points; see calculations.print_job_quality_inspection.
      - name: inspection_count
        type: integer
        source: computed
        default: 0
        description: Number of quality inspections recorded against this job.
      - name: delivered_quantity
        type: integer
        source: computed
        default: 0
        description: Sum of BallotLot.quantity_shipped over lots of this job with custody_state != VOIDED.
      - name: invoice_basis
        type: enum
        source: computed
        description: Which variant produced invoice_total_cents; null before proof approval.
        constraints: "one of {ESTIMATE, FINAL}"
      - name: invoice_subtotal_cents
        type: integer
        source: computed
        default: 0
        description: Ballot cost before freight and defect credit; see calculations.print_job_invoice_total.
      - name: defect_credit_cents
        type: integer
        source: computed
        default: 0
        description: Quality credit deducted from the subtotal; always 0 on the ESTIMATE variant.
      - name: freight_cents
        type: integer
        source: computed
        default: 0
        description: Tiered freight charge; see calculations.print_job_invoice_total.
      - name: invoice_total_cents
        type: integer
        source: computed
        default: 0
        description: invoice_subtotal_cents - defect_credit_cents + freight_cents; reset to 0 when the job is REJECTED.

  - name: BallotLot
    parent: PrintJob
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: computed
        description: FK -> Election.id; copied from the parent PrintJob.election_id at creation.
      - name: print_job_id
        type: string
        source: computed
        description: FK -> PrintJob.id; the delivery that created this lot.
      - name: precinct_id
        type: string
        source: computed
        description: FK -> Precinct.id; set by POST /ballot-lots/{id}/issue and cleared by POST /ballot-lots/{id}/recall. Null while in the warehouse.
      - name: lot_code
        type: string
        source: computed
        description: Lot identifier supplied in the delivery manifest; unique per print job.
      - name: quantity_shipped
        type: integer
        source: computed
        description: Ballots the vendor declared in the delivery manifest for this lot.
      - name: seal_number
        type: string
        source: computed
        description: Tamper seal number declared by the vendor in the delivery manifest; must be matched at receipt.
      - name: custody_state
        type: enum
        source: system
        default: IN_TRANSIT
        description: Chain-of-custody state of the physical lot.
        constraints: "one of {IN_TRANSIT, RECEIVED, ISSUED, RETURNED, VOIDED}"
      - name: quantity_received
        type: integer
        source: computed
        default: 0
        description: Ballots counted at receipt; 0 until custody_state == RECEIVED.
      - name: issued_quantity
        type: integer
        source: computed
        default: 0
        description: Ballots issued to the precinct; reset to 0 by recall.
      - name: voted_quantity
        type: integer
        source: computed
        default: 0
        description: Voted ballots reported at return.
      - name: spoiled_quantity
        type: integer
        source: computed
        default: 0
        description: Spoiled ballots reported at return.
      - name: unused_quantity
        type: integer
        source: computed
        default: 0
        description: quantity_received - issued_quantity; the warehouse remainder never sent out. Maintained so that quantity_received == issued_quantity + unused_quantity holds after receipt, issue, recall and return.
      - name: returned_unused_quantity
        type: integer
        source: computed
        default: 0
        description: Unvoted ballots handed back by the precinct board at return; 0 until custody_state == RETURNED.
      - name: accounted_quantity
        type: integer
        source: computed
        default: 0
        description: voted_quantity + spoiled_quantity + returned_unused_quantity.
      - name: lot_variance
        type: integer
        source: computed
        description: issued_quantity - accounted_quantity; null until custody_state == RETURNED.
      - name: issued_by_user_id
        type: string
        source: computed
        description: X-User-ID of the custodian that issued the lot; null when not ISSUED/RETURNED.

  - name: TabulatorUnit
    parent: Election
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; owning election, taken from the path on creation.
      - name: precinct_id
        type: string
        source: computed
        description: FK -> Precinct.id; set by POST /tabulator-units/{id}/deploy and cleared by break-seal. Null while in the vault.
      - name: programmed_style_id
        type: string
        source: computed
        description: FK -> BallotStyle.id; ballot style definition loaded by POST /tabulator-units/{id}/program. Null while UNPROGRAMMED.
      - name: asset_tag
        type: string
        source: input
        description: Asset tag stencilled on the unit; unique per election.
      - name: firmware_version
        type: string
        source: input
        description: Firmware version recorded at intake; overwritten at programming.
      - name: program_status
        type: enum
        source: system
        default: UNPROGRAMMED
        description: Programming/logic-and-accuracy axis of this unit; evolves independently of custody_status.
        constraints: "one of {UNPROGRAMMED, PROGRAMMED, LA_PASSED, LA_FAILED}"
      - name: custody_status
        type: enum
        source: system
        default: IN_VAULT
        description: Chain-of-custody axis of this unit; evolves independently of program_status.
        constraints: "one of {IN_VAULT, DEPLOYED, RETURNED, SEALED_RETENTION}"
      - name: seal_number
        type: string
        source: computed
        description: Currently applied tamper seal; null whenever no seal is open on the unit.
      - name: programmed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the technician that programmed the unit; the segregation-of-duties counterparty for conducting its L&A session.
      - name: la_session_count
        type: integer
        source: computed
        default: 0
        description: Count of LATestSession rows with tabulator_id == this unit.
      - name: retention_until
        type: datetime
        source: computed
        description: election_date + retention_days set by POST /tabulator-units/{id}/seal-retention; null until sealed for retention.

  - name: TestDeck
    parent: BallotStyle
    common_fields: true
    fields:
      - name: style_id
        type: string
        source: input
        description: FK -> BallotStyle.id; the style this deck was built for, taken from the path on creation.
      - name: deck_code
        type: string
        source: input
        description: Deck identifier; unique per style.
      - name: ballot_count
        type: integer
        source: input
        description: Number of physical test ballots in the deck.
        constraints: ">= 0; a deck with 0 ballots is rejected at creation"
      - name: blank_count
        type: integer
        source: input
        default: 0
        description: Expected count of deliberately blank ballots in the deck.
        constraints: ">= 0"
      - name: overvote_count
        type: integer
        source: input
        default: 0
        description: Expected count of deliberately overvoted ballots in the deck.
        constraints: ">= 0"
      - name: expected_marks
        type: array
        source: input
        description: Expected tally as an array of objects { contest_id, candidate_id, mark_count }; each pair must be printable on style_id.
        constraints: "array of objects with integer mark_count >= 1"
      - name: expected_total_marks
        type: integer
        source: computed
        default: 0
        description: Sum of mark_count over expected_marks.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Deck lifecycle; sealed when a session starts, consumed on a passing result, voided on a failing result or when its style loses approval.
        constraints: "one of {DRAFT, SEALED, CONSUMED, VOIDED}"
      - name: created_by_user_id
        type: string
        source: computed
        description: X-User-ID of the technician that built the deck.

  - name: LATestSession
    parent: TabulatorUnit
    common_fields: true
    fields:
      - name: tabulator_id
        type: string
        source: input
        description: FK -> TabulatorUnit.id; the unit under test, whose scheduling window this session occupies.
      - name: deck_id
        type: string
        source: input
        description: FK -> TestDeck.id; the test deck to be fed into the unit.
      - name: session_type
        type: enum
        source: input
        description: Public pre-election test or post-election audit; sets the observer minimum.
        constraints: "one of {PRE_ELECTION_PUBLIC, POST_ELECTION_AUDIT}"
      - name: scheduled_start
        type: datetime
        source: input
        description: Closed-interval start of the unit occupation.
      - name: scheduled_end
        type: datetime
        source: input
        description: Closed-interval end of the unit occupation; must be strictly after scheduled_start.
      - name: public_notice_posted_at
        type: datetime
        source: input
        description: Instant the public notice was posted; drives notice_lead_minutes.
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Session lifecycle state.
        constraints: "one of {SCHEDULED, IN_PROGRESS, PASSED, FAILED}"
      - name: notice_lead_minutes
        type: integer
        source: computed
        description: floor((scheduled_start - public_notice_posted_at) / 60 seconds), computed at creation.
      - name: observer_count
        type: integer
        source: computed
        default: 0
        description: Number of registered public observers.
      - name: observer_names
        type: array
        source: computed
        description: Registered observer names in registration order.
      - name: reported_marks
        type: array
        source: computed
        description: Tally read off the unit as an array of objects { contest_id, candidate_id, mark_count }; null until results are recorded.
      - name: reported_blank_count
        type: integer
        source: computed
        description: Blank ballots reported by the unit; null until results are recorded.
      - name: reported_overvote_count
        type: integer
        source: computed
        description: Overvoted ballots reported by the unit; null until results are recorded.
      - name: discrepancy_count
        type: integer
        source: computed
        description: Absolute deviation between deck expectation and reported tally; see calculations.la_test_discrepancy.
      - name: conducted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the technician that started the session; must differ from the unit's programmed_by_user_id.
      - name: started_at
        type: datetime
        source: computed
        description: Logical-clock instant the session moved to IN_PROGRESS.
      - name: completed_at
        type: datetime
        source: computed
        description: Logical-clock instant results were recorded.

  - name: CustodyEvent
    parent: Election
    common_fields: false
    fields:
      - name: election_id
        type: string
        source: computed
        description: FK -> Election.id; owning election of the subject resource.
      - name: subject_type
        type: enum
        source: computed
        description: Polymorphic discriminator for subject_id.
        constraints: "one of {TABULATOR_UNIT, BALLOT_LOT}"
      - name: subject_id
        type: string
        source: computed
        description: Polymorphic reference resolved as TabulatorUnit.id when subject_type == TABULATOR_UNIT and as BallotLot.id when subject_type == BALLOT_LOT.
      - name: event_type
        type: enum
        source: computed
        description: Custody action recorded; append-only.
        constraints: "one of {TRANSFER_OUT, RECEIPT, ISSUE, RECALL, RETURN, SEAL_APPLIED, SEAL_BROKEN, RETENTION_SEAL, VOID}"
      - name: from_state
        type: string
        source: computed
        description: Subject custody state before the action.
      - name: to_state
        type: string
        source: computed
        description: Subject custody state after the action.
      - name: seal_number
        type: string
        source: computed
        description: Seal number applied or broken; null for events that do not touch a seal.
      - name: actor_role
        type: string
        source: computed
        description: X-Role of the actor that caused the event.
      - name: actor_user_id
        type: string
        source: computed
        description: X-User-ID of the actor that caused the event; "system" for cascade-generated events.
      - name: occurred_at
        type: datetime
        source: computed
        description: Logical-clock instant of the action.
      - name: sequence_index
        type: integer
        source: computed
        description: One-based position of this event among events with the same subject_id, ordered by occurred_at ASC then created_at ASC.

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Election
    initial_state: SETUP
    terminal_states: [RECONCILED]
    transitions:
      - from: SETUP
        to: CONTESTS_CERTIFIED
        trigger: "POST /elections/{id}/certify-ballot-order"
        actor: ElectionsDirector
        preconditions:
          - "election.certified_contest_count >= 1 else ERR_NO_CERTIFIED_CONTESTS"
        side_effects:
          - "For every Contest of this election with status == CERTIFIED, writes Candidate.base_order_index for each candidate with status == CERTIFIED per calculations.candidate_ballot_order using basis CERTIFIED_BASIS (candidates with status == FILED keep base_order_index null)."
          - "Recomputes election.certified_contest_count."
          - "Increments Election.version by 1."
        note: "Freezes the ballot ordering; from here on request-proof is unlocked and contest creation is closed."
      - from: CONTESTS_CERTIFIED
        to: STYLES_LOCKED
        trigger: "POST /elections/{id}/lock-styles"
        actor: ElectionsDirector
        preconditions:
          - "Every Precinct of this election has assigned_style_id != null else ERR_ELECTION_PHASE_INVALID"
          - "Every BallotStyle referenced by some precinct.assigned_style_id has status == APPROVED else ERR_STYLE_STATE_INVALID"
        side_effects:
          - "Each BallotStyle referenced by some precinct.assigned_style_id transitions APPROVED -> LOCKED."
          - "Increments Election.version by 1."
      - from: STYLES_LOCKED
        to: DEPLOYED
        trigger: "POST /elections/{id}/deploy"
        actor: ElectionsDirector
        preconditions:
          - "election.deployment_readiness == READY else ERR_DEPLOYMENT_NOT_READY"
        side_effects:
          - "Increments Election.version by 1."
        note: "deployment_readiness is the compound gate recomputed from Precinct.deployment_status; see calculations.election_deployment_readiness."
      - from: DEPLOYED
        to: POLLS_CLOSED
        trigger: "POST /elections/{id}/close-polls"
        actor: ElectionsDirector
        preconditions: []
        side_effects:
          - "Cascade hop 1: every TabulatorUnit of this election with custody_status == DEPLOYED transitions DEPLOYED -> RETURNED, retaining seal_number, and appends a CustodyEvent with event_type == RETURN and actor_user_id == 'system'."
          - "Cascade hop 2: because those units left DEPLOYED, every Precinct that referenced them recomputes deployment_status -> NOT_READY."
          - "Cascade hop 3: because those precincts left READY, election.deployment_readiness is recomputed -> BLOCKED."
          - "Increments Election.version by 1."
      - from: POLLS_CLOSED
        to: RECONCILED
        trigger: "POST /elections/{id}/reconcile"
        actor: ElectionsDirector
        preconditions:
          - "payload.expected_election_version == election.version else ERR_STALE_ELECTION_VERSION"
          - "When payload.basis == FINAL_CANVASS, no BallotLot of this election has custody_state == ISSUED else ERR_LOTS_NOT_RETURNED"
        side_effects:
          - "Runs calculations.ballot_accountability_reconciliation with the requested basis and writes election.ballot_accountability_status, election.net_ballot_variance, election.reconciliation_basis and election.last_reconciled_at."
          - "Recomputes election.total_ballots_received and election.total_ballots_issued."
          - "Increments Election.version by 1."
        note: "Re-running reconciliation on an already RECONCILED election is a self-transition RECONCILED -> RECONCILED that recomputes the same fields; see concurrency_rules.reconcile-stale-election."
      - from: RECONCILED
        to: RECONCILED
        trigger: "POST /elections/{id}/reconcile"
        actor: ElectionsDirector
        preconditions:
          - "payload.expected_election_version == election.version else ERR_STALE_ELECTION_VERSION"
          - "When payload.basis == FINAL_CANVASS, no BallotLot of this election has custody_state == ISSUED else ERR_LOTS_NOT_RETURNED"
        side_effects:
          - "Recomputes and overwrites election.ballot_accountability_status, election.net_ballot_variance, election.reconciliation_basis, election.last_reconciled_at."
          - "Increments Election.version by 1."
        note: "A later basis switch (PRELIMINARY then FINAL_CANVASS) legitimately supersedes the earlier snapshot, which is why this write is OCC-guarded."

  - entity: Contest
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /contests/{id}/certify"
        actor: ElectionsDirector
        preconditions:
          - "election.status == SETUP else ERR_ELECTION_PHASE_INVALID"
          - "contest_type == MEASURE, or the count of Candidate rows of this contest with status == FILED is >= seats_open, else ERR_CANDIDATE_STATE_INVALID"
          - "No other Contest of the same election with status IN {DRAFT, CERTIFIED} shares this contest's (contest_type, district_code, title) triple else ERR_BALLOT_ORDER_COLLISION (that triple is exactly what calculations.contest_ballot_ordering sorts on, so a duplicate would make the printed order undefined)"
        side_effects:
          - "Every Candidate of this contest with status == FILED transitions FILED -> CERTIFIED."
          - "Sets certified_candidate_count to the number of candidates just certified and certified_at to the logical clock."
          - "Recomputes election.certified_contest_count."
          - "Recomputes BallotStyle.contest_count for every style of the election whose district_codes contains this district_code."
      - from: CERTIFIED
        to: WITHDRAWN
        trigger: "POST /contests/{id}/withdraw"
        actor: ElectionsDirector
        preconditions:
          - "election.status IN {SETUP, CONTESTS_CERTIFIED, STYLES_LOCKED} else ERR_ELECTION_PHASE_INVALID"
        side_effects:
          - "Cascade hop 1: contest.status = WITHDRAWN, ballot_order_index = null, withdrawn_reason = payload.withdrawn_reason, election.certified_contest_count recomputed."
          - "Cascade hop 2: because this contest is no longer CERTIFIED, every BallotStyle of the election whose district_codes contains contest.district_code and whose status IN {PROOFING, APPROVED, LOCKED} transitions to PROOF_REJECTED, has contest_count recomputed, and has translated_languages and certified_formats cleared to empty arrays."
          - "Cascade hop 3: because those styles left PROOFING/APPROVED/LOCKED, every PrintJob whose style_id is in that set and whose status IN {PROOF_PENDING, PRINTING, QC_HOLD, QC_PASSED, DELIVERED} transitions to REJECTED, releasing its press window (vendor.active_job_count recomputed), zeroing invoice_subtotal_cents, defect_credit_cents, freight_cents and invoice_total_cents, and decreasing election.committed_print_cents by the amount that job had committed."
          - "Cascade hop 4: because those print jobs became REJECTED, every BallotLot of those jobs with custody_state IN {IN_TRANSIT, RECEIVED, ISSUED} transitions to VOIDED, clearing issued_quantity and precinct_id, appends a CustodyEvent with event_type == VOID, and election.total_ballots_received and total_ballots_issued are recomputed. A lot already in RETURNED is left alone."
          - "Cascade hop 5: because those lots left ISSUED/RECEIVED, every Precinct that referenced them recomputes ballots_received (dropping to 0 when its only lots were voided) and therefore deployment_status -> NOT_READY, and election.deployment_readiness is recomputed -> BLOCKED."
          - "Every TestDeck of a style rejected in hop 2 with status IN {DRAFT, SEALED} transitions to VOIDED."
        note: "Depth-5 transitive cascade Contest -> BallotStyle -> PrintJob -> BallotLot -> Precinct/Election; each hop is caused by the previous hop's mutation, not by the withdraw call itself."

  - entity: Candidate
    initial_state: FILED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: FILED
        to: CERTIFIED
        trigger: "system event: parent Contest transitions DRAFT -> CERTIFIED"
        actor: system
        preconditions:
          - "candidate.status == FILED"
        side_effects:
          - "Contest.certified_candidate_count recomputed."
      - from: CERTIFIED
        to: DISQUALIFIED
        trigger: "POST /candidates/{id}/disqualify"
        actor: ElectionsDirector
        preconditions:
          - "election.status IN {SETUP, CONTESTS_CERTIFIED, STYLES_LOCKED} else ERR_ELECTION_PHASE_INVALID"
          - "contest.status == CERTIFIED else ERR_CONTEST_STATE_INVALID"
        side_effects:
          - "Cascade hop 1: candidate.status = DISQUALIFIED, disqualified_reason = payload.disqualified_reason, base_order_index = null, contest.certified_candidate_count recomputed."
          - "Cascade hop 2: because the certified candidate set of the contest shrank, every remaining Candidate of the contest with status == CERTIFIED has base_order_index recompacted per calculations.candidate_ballot_order with basis CERTIFIED_BASIS (only when election.status != SETUP, i.e. the ordering has already been frozen)."
          - "Cascade hop 3: because those base_order_index values changed, every TestDeck whose style_id is a BallotStyle whose district_codes contains contest.district_code and whose status IN {DRAFT, SEALED} transitions to VOIDED (its expected_marks no longer match the printed layout)."
        note: "Depth-3 transitive cascade Candidate -> sibling Candidates -> TestDeck, triggered from a different transition than the Contest withdraw cascade."
      - from: FILED
        to: DISQUALIFIED
        trigger: "POST /candidates/{id}/disqualify"
        actor: ElectionsDirector
        preconditions:
          - "election.status == SETUP else ERR_ELECTION_PHASE_INVALID"
          - "contest.status == DRAFT else ERR_CONTEST_STATE_INVALID"
        side_effects:
          - "candidate.status = DISQUALIFIED, disqualified_reason = payload.disqualified_reason; no ordering or deck cascade runs because nothing was frozen yet."

  - entity: BallotStyle
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROOFING
        trigger: "POST /ballot-styles/{id}/request-proof"
        actor: BallotCoordinator
        preconditions:
          - "election.status == CONTESTS_CERTIFIED else ERR_ELECTION_PHASE_INVALID"
          - "style.contest_count >= 1 else ERR_STYLE_STATE_INVALID"
          - "style.translated_languages contains every member of style.language_set AND style.certified_formats contains every member of style.required_formats else ERR_LANGUAGE_COVERAGE_INCOMPLETE"
        side_effects:
          - "proof_cycle_count += 1."
          - "proof_requested_by_user_id = X-User-ID of the caller."
      - from: PROOF_REJECTED
        to: PROOFING
        trigger: "POST /ballot-styles/{id}/request-proof"
        actor: BallotCoordinator
        preconditions:
          - "election.status IN {CONTESTS_CERTIFIED, STYLES_LOCKED} else ERR_ELECTION_PHASE_INVALID"
          - "style.contest_count >= 1 else ERR_STYLE_STATE_INVALID"
          - "style.translated_languages contains every member of style.language_set AND style.certified_formats contains every member of style.required_formats else ERR_LANGUAGE_COVERAGE_INCOMPLETE"
        side_effects:
          - "revision += 1 (only on this from-state)."
          - "proof_cycle_count += 1."
          - "proof_requested_by_user_id = X-User-ID of the caller."
        note: "Revision loop: PROOFING -> PROOF_REJECTED -> PROOFING, so the machine is cyclic."
      - from: PROOFING
        to: APPROVED
        trigger: "POST /ballot-styles/{id}/proof-decision with decision == APPROVE"
        actor: ElectionsDirector | BallotCoordinator
        preconditions:
          - "X-User-ID != style.proof_requested_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "proof_decided_by_user_id = X-User-ID of the caller."
      - from: PROOFING
        to: PROOF_REJECTED
        trigger: "POST /ballot-styles/{id}/proof-decision with decision == REJECT"
        actor: ElectionsDirector | BallotCoordinator
        preconditions:
          - "X-User-ID != style.proof_requested_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "proof_decided_by_user_id = X-User-ID of the caller."
          - "translated_languages and certified_formats are cleared to empty arrays (re-translation and re-certification required)."
          - "Every TestDeck of this style with status IN {DRAFT, SEALED} transitions to VOIDED."
        note: "Branching fork: the same endpoint drives two target states with divergent side-effect sets."
      - from: APPROVED
        to: LOCKED
        trigger: "system event: POST /elections/{id}/lock-styles"
        actor: system
        preconditions:
          - "Some Precinct of the election has assigned_style_id == this style id"
        side_effects:
          - "None beyond the status change and updated_at/version refresh."
      - from: PROOFING
        to: PROOF_REJECTED
        trigger: "system event: a Contest printed on this style transitions CERTIFIED -> WITHDRAWN"
        actor: system
        preconditions:
          - "contest.district_code is a member of style.district_codes"
        side_effects:
          - "contest_count recomputed; translated_languages and certified_formats cleared; downstream PrintJob/BallotLot cascade per the Contest withdraw transition."
      - from: APPROVED
        to: PROOF_REJECTED
        trigger: "system event: a Contest printed on this style transitions CERTIFIED -> WITHDRAWN"
        actor: system
        preconditions:
          - "contest.district_code is a member of style.district_codes"
        side_effects:
          - "contest_count recomputed; translated_languages and certified_formats cleared; downstream PrintJob/BallotLot cascade per the Contest withdraw transition."
      - from: LOCKED
        to: PROOF_REJECTED
        trigger: "system event: a Contest printed on this style transitions CERTIFIED -> WITHDRAWN"
        actor: system
        preconditions:
          - "contest.district_code is a member of style.district_codes"
        side_effects:
          - "contest_count recomputed; translated_languages and certified_formats cleared; downstream PrintJob/BallotLot cascade per the Contest withdraw transition."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /elections/{id}/ballot-styles with supersedes_style_id == this style id"
        actor: system
        preconditions:
          - "this style's election_id == the new style's election_id else ERR_BALLOT_STYLE_NOT_FOUND"
        side_effects:
          - "Every Precinct with assigned_style_id == this style id is repointed to the new style id; precinct_count recomputed on both styles."
          - "rotation_seed_index recomputed for every BallotStyle of the election with status != SUPERSEDED."
          - "Every PrintJob of this style with status == PROOF_PENDING transitions to REJECTED (invoice fields zeroed, vendor.active_job_count recomputed)."
          - "Every TestDeck of this style with status IN {DRAFT, SEALED} transitions to VOIDED."
      - from: PROOF_REJECTED
        to: SUPERSEDED
        trigger: "system event: POST /elections/{id}/ballot-styles with supersedes_style_id == this style id"
        actor: system
        preconditions:
          - "this style's election_id == the new style's election_id else ERR_BALLOT_STYLE_NOT_FOUND"
        side_effects:
          - "Same supersede side-effect set as DRAFT -> SUPERSEDED."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: POST /elections/{id}/ballot-styles with supersedes_style_id == this style id"
        actor: system
        preconditions:
          - "this style's election_id == the new style's election_id else ERR_BALLOT_STYLE_NOT_FOUND"
        side_effects:
          - "Same supersede side-effect set as DRAFT -> SUPERSEDED."
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system event: POST /elections/{id}/ballot-styles with supersedes_style_id == this style id"
        actor: system
        preconditions:
          - "this style's election_id == the new style's election_id else ERR_BALLOT_STYLE_NOT_FOUND"
        side_effects:
          - "Same supersede side-effect set as DRAFT -> SUPERSEDED."

  - entity: PrintJob
    initial_state: PROOF_PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PROOF_PENDING
        to: PRINTING
        trigger: "POST /print-jobs/{id}/approve-proof"
        actor: ElectionsDirector
        preconditions:
          - "style.status IN {APPROVED, LOCKED} else ERR_STYLE_STATE_INVALID"
          - "style.version == job.style_version_at_creation else ERR_PROOF_VERSION_STALE"
          - "vendor.status == ACTIVE AND vendor.certified_secure == true else ERR_VENDOR_NOT_SECURE"
        side_effects:
          - "Runs calculations.print_job_invoice_total variant ESTIMATE: invoice_basis = ESTIMATE, invoice_subtotal_cents, freight_cents and invoice_total_cents written, defect_credit_cents = 0."
          - "election.committed_print_cents += invoice_total_cents."
          - "approved_by_user_id = X-User-ID of the caller."
      - from: PRINTING
        to: QC_PASSED
        trigger: "POST /print-jobs/{id}/inspect with resulting defect_rate_bp < QC_HOLD_THRESHOLD_BP"
        actor: WarehouseCustodian
        preconditions:
          - "payload.sample_size >= 1 AND payload.defect_count >= 0 AND payload.defect_count <= payload.sample_size else ERR_INVALID_REQUEST"
        side_effects:
          - "Runs calculations.print_job_quality_inspection: sample_size, defect_count, defect_rate_bp written, inspection_count += 1, vendor.quality_defect_rate_bp updated."
      - from: PRINTING
        to: QC_HOLD
        trigger: "POST /print-jobs/{id}/inspect with resulting defect_rate_bp >= QC_HOLD_THRESHOLD_BP"
        actor: WarehouseCustodian
        preconditions:
          - "payload.sample_size >= 1 AND payload.defect_count >= 0 AND payload.defect_count <= payload.sample_size else ERR_INVALID_REQUEST"
        side_effects:
          - "Runs calculations.print_job_quality_inspection: sample_size, defect_count, defect_rate_bp written, inspection_count += 1, vendor.quality_defect_rate_bp updated."
        note: "Fork-join: PRINTING branches to QC_PASSED or QC_HOLD on the same endpoint, and QC_HOLD rejoins the pipeline through a re-inspection."
      - from: QC_HOLD
        to: QC_PASSED
        trigger: "POST /print-jobs/{id}/inspect with resulting defect_rate_bp < QC_HOLD_THRESHOLD_BP"
        actor: WarehouseCustodian
        preconditions:
          - "payload.sample_size >= 1 AND payload.defect_count >= 0 AND payload.defect_count <= payload.sample_size else ERR_INVALID_REQUEST"
        side_effects:
          - "Runs calculations.print_job_quality_inspection; inspection_count += 1."
      - from: QC_HOLD
        to: QC_HOLD
        trigger: "POST /print-jobs/{id}/inspect with resulting defect_rate_bp >= QC_HOLD_THRESHOLD_BP"
        actor: WarehouseCustodian
        preconditions:
          - "payload.sample_size >= 1 AND payload.defect_count >= 0 AND payload.defect_count <= payload.sample_size else ERR_INVALID_REQUEST"
        side_effects:
          - "Runs calculations.print_job_quality_inspection; inspection_count += 1."
      - from: QC_PASSED
        to: DELIVERED
        trigger: "POST /print-jobs/{id}/deliver"
        actor: PrintVendorRep
        preconditions:
          - "X-User-ID == job.vendor_id else ERR_UNAUTHORIZED"
          - "election.status IN {STYLES_LOCKED, DEPLOYED} else ERR_ELECTION_PHASE_INVALID"
          - "Every manifest line's lot_code is unique within this job else ERR_INVALID_REQUEST"
          - "Every manifest line's seal_number is not already held by another BallotLot or TabulatorUnit of this election else ERR_SEAL_NUMBER_DUPLICATE"
        side_effects:
          - "Creates one BallotLot per manifest line with custody_state == IN_TRANSIT, quantity_shipped, lot_code and seal_number copied from the line, election_id copied from job.election_id."
          - "Appends one CustodyEvent per created lot with event_type == TRANSFER_OUT and to_state == IN_TRANSIT."
          - "delivered_quantity = sum of quantity_shipped over the created lots."
          - "Runs calculations.print_job_invoice_total variant FINAL: invoice_basis = FINAL, invoice_subtotal_cents, defect_credit_cents, freight_cents and invoice_total_cents rewritten."
          - "election.committed_print_cents adjusted by (FINAL invoice_total_cents - ESTIMATE invoice_total_cents)."
      - from: PROOF_PENDING
        to: REJECTED
        trigger: "system event: the job's BallotStyle leaves {PROOFING, APPROVED, LOCKED} for PROOF_REJECTED, or is SUPERSEDED"
        actor: system
        preconditions: []
        side_effects:
          - "invoice_subtotal_cents, defect_credit_cents, freight_cents and invoice_total_cents set to 0; election.committed_print_cents reduced by the amount this job had committed; vendor.active_job_count recomputed."
      - from: PRINTING
        to: REJECTED
        trigger: "system event: the job's BallotStyle leaves {PROOFING, APPROVED, LOCKED} for PROOF_REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "invoice fields zeroed, election.committed_print_cents reduced by the amount this job had committed, vendor.active_job_count recomputed."
          - "Every BallotLot of this job with custody_state IN {IN_TRANSIT, RECEIVED, ISSUED} transitions to VOIDED; a lot already in RETURNED is left alone."
      - from: QC_HOLD
        to: REJECTED
        trigger: "system event: the job's BallotStyle leaves {PROOFING, APPROVED, LOCKED} for PROOF_REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Same rejection side-effect set as PRINTING -> REJECTED."
      - from: QC_PASSED
        to: REJECTED
        trigger: "system event: the job's BallotStyle leaves {PROOFING, APPROVED, LOCKED} for PROOF_REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Same rejection side-effect set as PRINTING -> REJECTED."
      - from: DELIVERED
        to: REJECTED
        trigger: "system event: the job's BallotStyle leaves {PROOFING, APPROVED, LOCKED} for PROOF_REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Same rejection side-effect set as PRINTING -> REJECTED, including the FINAL invoice being zeroed and election.committed_print_cents reduced by the FINAL total."
          - "delivered_quantity is left as shipped (the pallets physically arrived) while every non-RETURNED lot of the job is VOIDED, so the ballot ledger and the money ledger are reversed independently."
        note: "A delivered job is not immune: withdrawing a contest that prints on its style pulls the whole run back, which is what makes the Contest withdraw cascade five hops deep."

  - entity: BallotLot
    initial_state: IN_TRANSIT
    terminal_states: [RETURNED, VOIDED]
    transitions:
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /ballot-lots/{id}/receive"
        actor: WarehouseCustodian
        preconditions:
          - "election.status IN {STYLES_LOCKED, DEPLOYED} else ERR_ELECTION_PHASE_INVALID"
          - "payload.seal_number == lot.seal_number else ERR_SEAL_MISMATCH"
          - "payload.quantity_received >= 1 else ERR_INVALID_REQUEST"
        side_effects:
          - "quantity_received = payload.quantity_received; unused_quantity = quantity_received (issued_quantity is still 0, so quantity_received == issued_quantity + unused_quantity holds)."
          - "Appends a CustodyEvent with event_type == RECEIPT, from_state == IN_TRANSIT, to_state == RECEIVED, seal_number == lot.seal_number."
          - "election.total_ballots_received recomputed."
      - from: RECEIVED
        to: ISSUED
        trigger: "POST /ballot-lots/{id}/issue"
        actor: WarehouseCustodian
        preconditions:
          - "election.status IN {STYLES_LOCKED, DEPLOYED} else ERR_ELECTION_PHASE_INVALID"
          - "The referenced Precinct exists and precinct.election_id == lot.election_id else ERR_PRECINCT_NOT_FOUND"
          - "precinct.assigned_style_id == the style_id of lot's parent PrintJob else ERR_LOT_NOT_FOR_PRECINCT"
          - "payload.issue_quantity >= 1 AND payload.issue_quantity <= lot.quantity_received else ERR_ISSUE_QUANTITY_EXCEEDS_RECEIPT"
        side_effects:
          - "precinct_id = payload.precinct_id; issued_quantity = payload.issue_quantity; unused_quantity = quantity_received - issued_quantity; issued_by_user_id = X-User-ID."
          - "Appends a CustodyEvent with event_type == ISSUE, from_state == RECEIVED, to_state == ISSUED."
          - "precinct.ballots_received and precinct.deployment_status recomputed; election.total_ballots_issued and election.deployment_readiness recomputed."
      - from: ISSUED
        to: RECEIVED
        trigger: "POST /ballot-lots/{id}/recall"
        actor: WarehouseCustodian
        preconditions:
          - "election.status IN {STYLES_LOCKED, DEPLOYED} else ERR_ELECTION_PHASE_INVALID"
        side_effects:
          - "issued_quantity = 0; unused_quantity = quantity_received; precinct_id = null; issued_by_user_id = null."
          - "Appends a CustodyEvent with event_type == RECALL, from_state == ISSUED, to_state == RECEIVED."
          - "The formerly referenced precinct recomputes ballots_received and deployment_status; election.total_ballots_issued and election.deployment_readiness recomputed."
        note: "Compensating action for issue; the conserved quantity quantity_received == issued_quantity + unused_quantity is unchanged across issue+recall."
      - from: ISSUED
        to: RETURNED
        trigger: "POST /ballot-lots/{id}/return-counts"
        actor: WarehouseCustodian
        preconditions:
          - "election.status IN {DEPLOYED, POLLS_CLOSED} else ERR_ELECTION_PHASE_INVALID"
          - "payload.voted_quantity + payload.spoiled_quantity + payload.returned_unused_quantity <= lot.quantity_received else ERR_LOT_ACCOUNTING_EXCEEDS_RECEIPT"
        side_effects:
          - "voted_quantity, spoiled_quantity, returned_unused_quantity written from the payload; accounted_quantity = their sum; lot_variance = issued_quantity - accounted_quantity."
          - "Appends a CustodyEvent with event_type == RETURN, from_state == ISSUED, to_state == RETURNED."
          - "election.total_ballots_issued recomputed (the lot remains in the ISSUED-or-RETURNED sum)."
      - from: IN_TRANSIT
        to: VOIDED
        trigger: "system event: the lot's PrintJob transitions to REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Appends a CustodyEvent with event_type == VOID; election.total_ballots_received recomputed."
      - from: RECEIVED
        to: VOIDED
        trigger: "system event: the lot's PrintJob transitions to REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "Appends a CustodyEvent with event_type == VOID; election.total_ballots_received recomputed; the precinct that had received ballots from this lot recomputes ballots_received and deployment_status."
      - from: ISSUED
        to: VOIDED
        trigger: "system event: the lot's PrintJob transitions to REJECTED"
        actor: system
        preconditions: []
        side_effects:
          - "issued_quantity = 0; unused_quantity = quantity_received; precinct_id = null; issued_by_user_id = null (the pallet is pulled back out of the field because its artwork is no longer the artwork of record)."
          - "Appends a CustodyEvent with event_type == VOID, from_state == ISSUED, to_state == VOIDED."
          - "election.total_ballots_received and election.total_ballots_issued recomputed; the precinct it had been issued to recomputes ballots_received and deployment_status, then election.deployment_readiness is recomputed."
        note: "A RETURNED lot is never voided: once its counts are in the accountability ledger the ledger is not rewritten by an upstream rejection."

  - entity: TabulatorUnit
    state_dimension: program_status
    initial_state: UNPROGRAMMED
    terminal_states: []
    transitions:
      - from: UNPROGRAMMED
        to: PROGRAMMED
        trigger: "POST /tabulator-units/{id}/program"
        actor: VotingSystemTechnician
        preconditions:
          - "election.status == STYLES_LOCKED else ERR_ELECTION_PHASE_INVALID"
          - "The referenced BallotStyle exists, belongs to this election and has status == LOCKED else ERR_STYLE_STATE_INVALID"
          - "unit.custody_status == IN_VAULT else ERR_UNIT_STATE_INVALID"
        side_effects:
          - "programmed_style_id = payload.style_id; firmware_version = payload.firmware_version; programmed_by_user_id = X-User-ID."
      - from: LA_FAILED
        to: PROGRAMMED
        trigger: "POST /tabulator-units/{id}/program"
        actor: VotingSystemTechnician
        preconditions:
          - "election.status == STYLES_LOCKED else ERR_ELECTION_PHASE_INVALID"
          - "The referenced BallotStyle exists, belongs to this election and has status == LOCKED else ERR_STYLE_STATE_INVALID"
          - "unit.custody_status == IN_VAULT else ERR_UNIT_STATE_INVALID"
        side_effects:
          - "programmed_style_id, firmware_version and programmed_by_user_id overwritten; the unit becomes eligible for a fresh logic-and-accuracy session."
        note: "Re-programming after a failed test closes the loop LA_FAILED -> PROGRAMMED -> LA_PASSED, so the program axis is cyclic."
      - from: PROGRAMMED
        to: LA_PASSED
        trigger: "system event: POST /la-test-sessions/{id}/record-results with discrepancy_count == 0"
        actor: system
        preconditions: []
        side_effects:
          - "la_session_count recomputed; precinct.deployment_status and election.deployment_readiness recomputed."
      - from: PROGRAMMED
        to: LA_FAILED
        trigger: "system event: POST /la-test-sessions/{id}/record-results with discrepancy_count > 0"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2 of the L&A failure chain: when custody_status == DEPLOYED the unit is also reverted to IN_VAULT with seal_number cleared and a CustodyEvent SEAL_BROKEN appended."
      - from: LA_PASSED
        to: LA_FAILED
        trigger: "system event: POST /la-test-sessions/{id}/record-results with discrepancy_count > 0"
        actor: system
        preconditions: []
        side_effects:
          - "Same as PROGRAMMED -> LA_FAILED; a post-election audit failure demotes an already-passed unit."

  - entity: TabulatorUnit
    state_dimension: custody_status
    initial_state: IN_VAULT
    terminal_states: [SEALED_RETENTION]
    transitions:
      - from: IN_VAULT
        to: DEPLOYED
        trigger: "POST /tabulator-units/{id}/deploy"
        actor: WarehouseCustodian
        preconditions:
          - "election.status == STYLES_LOCKED else ERR_ELECTION_PHASE_INVALID"
          - "unit.program_status == LA_PASSED else ERR_UNIT_STATE_INVALID"
          - "The referenced Precinct exists and precinct.election_id == unit.election_id else ERR_PRECINCT_NOT_FOUND"
          - "Some BallotLot with precinct_id == payload.precinct_id has custody_state == ISSUED else ERR_LOT_STATE_INVALID"
          - "payload.seal_number is not already held by another BallotLot or TabulatorUnit of this election else ERR_SEAL_NUMBER_DUPLICATE"
        side_effects:
          - "precinct_id = payload.precinct_id; seal_number = payload.seal_number."
          - "Appends a CustodyEvent with event_type == SEAL_APPLIED, from_state == IN_VAULT, to_state == DEPLOYED, seal_number == payload.seal_number; election.open_seal_count += 1."
          - "precinct.deployment_status and election.deployment_readiness recomputed."
        note: "Cross-entity guard: the unit cannot leave the vault until its precinct actually holds issued ballots."
      - from: DEPLOYED
        to: IN_VAULT
        trigger: "POST /tabulator-units/{id}/break-seal"
        actor: WarehouseCustodian
        preconditions:
          - "election.status IN {STYLES_LOCKED, DEPLOYED} else ERR_ELECTION_PHASE_INVALID"
        side_effects:
          - "seal_number = null; precinct_id = null."
          - "Appends a CustodyEvent with event_type == SEAL_BROKEN, from_state == DEPLOYED, to_state == IN_VAULT, seal_number == the seal being broken; election.open_seal_count -= 1."
          - "precinct.deployment_status and election.deployment_readiness recomputed."
        note: "Compensating action for deploy; election.open_seal_count returns to its pre-deploy value."
      - from: DEPLOYED
        to: IN_VAULT
        trigger: "system event: POST /la-test-sessions/{id}/record-results with discrepancy_count > 0 for a session on this unit"
        actor: system
        preconditions: []
        side_effects:
          - "seal_number = null; precinct_id = null; CustodyEvent SEAL_BROKEN appended with actor_user_id == 'system'; election.open_seal_count -= 1."
          - "Cascade hop 3: the formerly referenced precinct recomputes deployment_status -> NOT_READY; cascade hop 4: election.deployment_readiness recomputed -> BLOCKED."
      - from: DEPLOYED
        to: RETURNED
        trigger: "system event: POST /elections/{id}/close-polls"
        actor: system
        preconditions: []
        side_effects:
          - "seal_number retained; CustodyEvent RETURN appended; precinct.deployment_status and election.deployment_readiness recomputed."
      - from: RETURNED
        to: SEALED_RETENTION
        trigger: "POST /tabulator-units/{id}/seal-retention"
        actor: WarehouseCustodian
        preconditions:
          - "election.status == RECONCILED else ERR_RETENTION_BEFORE_RECONCILIATION"
          - "payload.seal_number is not already held by another BallotLot or TabulatorUnit of this election else ERR_SEAL_NUMBER_DUPLICATE"
          - "payload.retention_days >= 1 else ERR_INVALID_REQUEST"
        side_effects:
          - "seal_number = payload.seal_number; retention_until = election.election_date + payload.retention_days days."
          - "Appends a CustodyEvent with event_type == RETENTION_SEAL; election.open_seal_count += 1."

  - entity: TestDeck
    initial_state: DRAFT
    terminal_states: [CONSUMED, VOIDED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "system event: POST /la-test-sessions/{id}/start for a session referencing this deck"
        actor: system
        preconditions:
          - "deck.status == DRAFT"
        side_effects:
          - "The deck becomes immutable for the duration of the session."
      - from: SEALED
        to: CONSUMED
        trigger: "system event: POST /la-test-sessions/{id}/record-results with discrepancy_count == 0"
        actor: system
        preconditions: []
        side_effects:
          - "The deck cannot be scheduled into another session."
      - from: SEALED
        to: VOIDED
        trigger: "system event: POST /la-test-sessions/{id}/record-results with discrepancy_count > 0"
        actor: system
        preconditions: []
        side_effects:
          - "The deck must be rebuilt before another session can be scheduled for the unit."
      - from: DRAFT
        to: VOIDED
        trigger: "system event: the deck's BallotStyle enters PROOF_REJECTED or SUPERSEDED, or a Candidate printed on that style is disqualified after ordering was frozen"
        actor: system
        preconditions: []
        side_effects:
          - "expected_marks no longer match the printed layout; the deck is unusable."
      - from: SEALED
        to: VOIDED
        trigger: "system event: the deck's BallotStyle enters PROOF_REJECTED or SUPERSEDED, or a Candidate printed on that style is disqualified after ordering was frozen"
        actor: system
        preconditions: []
        side_effects:
          - "Any SCHEDULED session referencing this deck can no longer be started (ERR_DECK_STATE_INVALID)."

  - entity: LATestSession
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /la-test-sessions/{id}/start"
        actor: VotingSystemTechnician
        preconditions:
          - "X-User-ID != unit.programmed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "session.observer_count >= MIN_PUBLIC_OBSERVERS when session_type == PRE_ELECTION_PUBLIC, or >= MIN_AUDIT_OBSERVERS when session_type == POST_ELECTION_AUDIT, else ERR_INSUFFICIENT_OBSERVERS"
          - "session.notice_lead_minutes >= election.la_notice_hours * 60 else ERR_PUBLIC_NOTICE_TOO_LATE"
          - "The logical clock is within [scheduled_start - 60 minutes, scheduled_end] inclusive else ERR_OUTSIDE_TEST_WINDOW"
          - "deck.status == DRAFT else ERR_DECK_STATE_INVALID"
          - "unit.program_status IN {PROGRAMMED, LA_PASSED} else ERR_UNIT_STATE_INVALID"
        side_effects:
          - "started_at = logical clock; conducted_by_user_id = X-User-ID."
          - "The referenced TestDeck transitions DRAFT -> SEALED."
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /la-test-sessions/{id}/record-results with discrepancy_count == 0"
        actor: VotingSystemTechnician
        preconditions:
          - "X-User-ID == session.conducted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "reported_marks, reported_blank_count, reported_overvote_count stored; discrepancy_count = 0 per calculations.la_test_discrepancy; completed_at = logical clock."
          - "The TestDeck transitions SEALED -> CONSUMED."
          - "The TabulatorUnit program axis transitions to LA_PASSED; la_session_count recomputed; precinct.deployment_status and election.deployment_readiness recomputed."
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /la-test-sessions/{id}/record-results with discrepancy_count > 0"
        actor: VotingSystemTechnician
        preconditions:
          - "X-User-ID == session.conducted_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Cascade hop 1: reported tallies stored, discrepancy_count > 0 written per calculations.la_test_discrepancy, completed_at set; the TestDeck transitions SEALED -> VOIDED."
          - "Cascade hop 2: because the session failed, the TabulatorUnit program axis transitions to LA_FAILED and, when its custody_status == DEPLOYED, the custody axis reverts DEPLOYED -> IN_VAULT with seal_number cleared, a CustodyEvent SEAL_BROKEN appended and election.open_seal_count decremented."
          - "Cascade hop 3: because the unit left DEPLOYED, the precinct it was deployed to recomputes deployment_status -> NOT_READY."
          - "Cascade hop 4: because that precinct is no longer READY, election.deployment_readiness is recomputed -> BLOCKED, which blocks POST /elections/{id}/deploy with ERR_DEPLOYMENT_NOT_READY."
        note: "Branching join with divergent side-effect sets versus IN_PROGRESS -> PASSED, and the origin of the depth-4 L&A failure cascade."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: print-job-create-stale-style
    parent_entity: BallotStyle
    write_endpoint: "POST /print-jobs"
    occ_field: "expected_ballot_style_version"
    description: |
      Creating a PrintJob against a BallotStyle whose version has advanced since the client
      last observed it is rejected. The product spec allows a second print order for the same
      style to legitimately supersede an earlier PROOF_PENDING order (a re-order at a different
      vendor or quantity), so the write is not covered by any state precondition: the losing
      client's view of the style is merely stale, because a language certification, a proof
      decision or an earlier superseding order has advanced the style's version.
    error_id: ERR_STALE_BALLOT_STYLE_VERSION
    http_status: 412
  - rule_id: reconcile-stale-election
    parent_entity: Election
    write_endpoint: "POST /elections/{id}/reconcile"
    occ_field: "expected_election_version"
    description: |
      Recording a ballot-accountability reconciliation against an Election whose version has
      advanced since the client last observed it is rejected. Reconciliation is legitimately
      repeatable — a FINAL_CANVASS snapshot supersedes a PRELIMINARY one on the same election —
      so a write that observes the version written by a prior reconciliation is stale rather
      than invalid.
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculations
# =============================================================================
# Rounding vocabulary used below:
#   round_half_up(x)  -> nearest integer, exact .5 rounds away from zero
#   floor(x)          -> largest integer <= x
#   ceil(x)           -> smallest integer >= x
# Every money field is an integer number of cents; every rate field is an integer
# number of basis points (bp, 1/10000). No floating-point value is ever stored.
calculations:
  - name: contest_ballot_ordering
    description: |
      Assigns Contest.ballot_order_index across an election's certified contests. Runs once when
      POST /elections/{id}/certify-ballot-order is called, and is the frozen basis every later
      layout, test deck and print proof is measured against.
    algorithm_type: chronological
    input_set: "All Contest rows with election_id == the election and status == CERTIFIED. Contests in DRAFT or WITHDRAWN are excluded and keep ballot_order_index == null."
    formula: |
      1. Sort the input set by, in order:
         a. contest_type rank ASC, where CANDIDATE has rank 0 and MEASURE has rank 1;
         b. district_code ASC (byte-wise ascending string compare);
         c. title ASC (byte-wise ascending string compare);
         d. created_at ASC (final deterministic tiebreak; Contest.id is never used as a sort key).
      2. Assign ballot_order_index = 1-based position in that sorted sequence.
      3. The input set can never contain two contests sharing the same (contest_type, district_code,
         title) triple: validations.ballot-order-well-defined refuses the second such contest at
         POST /contests/{id}/certify with ERR_BALLOT_ORDER_COLLISION, so this pass always has a total
         order and never has to reject anything.
    constants: {}
    precision: "Integer indices starting at 1, contiguous with no gaps."
    edge_cases:
      - "Zero certified contests: POST /elections/{id}/certify-ballot-order is rejected with ERR_NO_CERTIFIED_CONTESTS; no index is written and election.status stays SETUP."
      - "A contest withdrawn after ordering keeps no index (ballot_order_index reset to null) and the remaining indices are NOT renumbered, so gaps are visible and every already-built test deck is voided."
    worked_example: |
      Certified contests: ("MEASURE", "D-07", "Bond Measure A"), ("CANDIDATE", "D-12", "County Sheriff"),
      ("CANDIDATE", "D-07", "Board of Supervisors").
      Sorted -> CANDIDATE/D-07/Board of Supervisors (1), CANDIDATE/D-12/County Sheriff (2),
      MEASURE/D-07/Bond Measure A (3).

  - name: candidate_ballot_order
    description: |
      Produces the printed candidate position list for one (BallotStyle, Contest) pair. This is the
      dual-variant layout calculation: the same candidate roster yields a different printed order
      depending on whether the caller reads the provisional (pre-certification) basis or the
      certified (frozen) basis, and the rotation branch depends on the election's rotation policy.
    algorithm_type: chronological
    input_set: "All Candidate rows with contest_id == the contest, filtered by the variant's status filter."
    variants:
      - variant: PROVISIONAL_BASIS
        applies_when: "GET /ballot-styles/{id}/layout is called with basis=PROVISIONAL_BASIS. This is the as-filed proof view that was circulated to the parties, so a later disqualification does not retroactively rewrite it."
        status_filter: "candidate.status IN {FILED, CERTIFIED, DISQUALIFIED} (every candidate who ever filed)"
      - variant: CERTIFIED_BASIS
        applies_when: "GET /ballot-styles/{id}/layout is called with basis=CERTIFIED_BASIS, and whenever Candidate.base_order_index is (re)assigned by POST /elections/{id}/certify-ballot-order, POST /contests/{id}/certify or POST /candidates/{id}/disqualify."
        status_filter: "candidate.status == CERTIFIED"
    formula: |
      Let S = the input set after the variant's status_filter, and N = |S|.
      1. Order S by election.candidate_order_method:
         - ALPHABETICAL_BY_BALLOT_NAME: ballot_name ASC, then filing_received_at ASC, then created_at ASC.
         - FILING_ORDER: filing_received_at ASC, then ballot_name ASC, then created_at ASC.
         Candidate.id is never used as a tiebreak.
      2. base_order_index = 0-based rank of the candidate in that order.
      3. Compute the rotation group g:
         - election.rotation_policy == NONE            -> g = 0
         - contest.rotation_required == false          -> g = 0 (per-contest opt-out overrides the
                                                          election policy for this contest only)
         - election.rotation_policy == PRECINCT_ROTATION -> g = style.rotation_seed_index mod N
         - election.rotation_policy == DISTRICT_ROTATION -> g = (style.rotation_seed_index + d) mod N,
              where d = the 0-based position of contest.district_code inside
              sorted(style.district_codes) ascending. If contest.district_code is not a member of
              style.district_codes the contest does not appear on that style at all and the
              layout omits it.
      4. printed_position = ((base_order_index + g) mod N) + 1.
      5. The result is the list of {candidate_id, ballot_name, base_order_index, printed_position}
         emitted in printed_position ASC order.
    constants: {}
    precision: "printed_position is a 1-based contiguous integer permutation of 1..N."
    edge_cases:
      - "N == 0 (no candidate passes the variant filter): the layout emits an empty candidate list for the contest and no modulo is evaluated; g is reported as 0."
      - "N == 1: g mod 1 == 0 for every seed, so a single-candidate contest never rotates."
      - "Because N differs between the two variants, g differs between them even for the same seed - the variants are not a relabelling of one another."
    worked_example: |
      Contest "County Sheriff" in district D-12 with rotation_required == true, four candidates with
      ballot names Alvarez, Brooks, Chen, Dawson, all certified with the contest and Dawson then
      DISQUALIFIED.
      election.candidate_order_method == ALPHABETICAL_BY_BALLOT_NAME,
      election.rotation_policy == DISTRICT_ROTATION,
      style.district_codes == ["D-07", "D-12", "D-19"] so d == 1, style.rotation_seed_index == 1.
        PROVISIONAL_BASIS: N == 4, g == (1 + 1) mod 4 == 2.
          Alvarez base 0 -> position 3, Brooks base 1 -> position 4,
          Chen base 2 -> position 1, Dawson base 3 -> position 2.
          Printed order: Chen, Dawson, Alvarez, Brooks.
        CERTIFIED_BASIS: N == 3, g == (1 + 1) mod 3 == 2.
          Alvarez base 0 -> position 3, Brooks base 1 -> position 1, Chen base 2 -> position 2.
          Printed order: Brooks, Chen, Alvarez.
      Same seed, same roster, different variant -> different printed order.
      With election.rotation_policy == PRECINCT_ROTATION instead, PROVISIONAL_BASIS gives
      g == 1 mod 4 == 1: Dawson, Alvarez, Brooks, Chen. With NONE it gives
      g == 0: Alvarez, Brooks, Chen, Dawson.

  - name: precinct_ballot_requirement
    description: "Computes how many printed ballots a precinct must physically hold before it can be called deployment-ready."
    algorithm_type: aggregation
    input_set: "The Precinct row itself, plus all BallotLot rows with precinct_id == precinct.id."
    formula: |
      required_ballot_quantity = ceil(registered_voter_count * BALLOT_OVERAGE_NUM / BALLOT_OVERAGE_DEN)
      ballots_received        = sum of issued_quantity over BallotLot rows with
                                precinct_id == precinct.id AND custody_state IN {ISSUED, RETURNED}
    constants:
      BALLOT_OVERAGE_NUM: 11
      BALLOT_OVERAGE_DEN: 10
    precision: "Integer ballots; the overage is rounded up so the statutory 110% floor is never undershot."
    edge_cases:
      - "registered_voter_count == 0 -> required_ballot_quantity == 0, and the precinct is still NOT_READY until a tabulator is deployed to it."
      - "A lot in IN_TRANSIT, RECEIVED or VOIDED contributes nothing: ballots sitting in the warehouse do not count as delivered to the precinct."
    worked_example: "registered_voter_count == 1750 -> ceil(1750 * 11 / 10) == ceil(1925.0) == 1925. A single ISSUED lot with issued_quantity == 1925 makes ballots_received == 1925 == required (boundary satisfied); 1924 leaves the precinct NOT_READY."

  - name: print_job_invoice_total
    description: |
      The dual-variant cost calculation for a print job. The ESTIMATE variant is written when the
      job leaves PROOF_PENDING for PRINTING (nothing has shipped yet, so the ordered quantity is
      billed as one line); the FINAL variant is written when the job is DELIVERED (each shipped lot
      is billed and rounded separately, and the accumulated quality credit is applied). The two
      variants therefore differ both in rounding topology (round-then-sum vs sum-then-round) and in
      which components exist at all.
    algorithm_type: tiered_pricing
    input_set: "The PrintJob row, plus all BallotLot rows with print_job_id == job.id and custody_state != VOIDED, ordered by lot_code ASC."
    variants:
      - variant: ESTIMATE
        applies_when: "PrintJob enters PRINTING via POST /print-jobs/{id}/approve-proof. invoice_basis is set to ESTIMATE."
        billable_quantity: "quantity_ordered (a single line item)"
      - variant: FINAL
        applies_when: "PrintJob enters DELIVERED via POST /print-jobs/{id}/deliver. invoice_basis is set to FINAL."
        billable_quantity: "one line item per non-voided BallotLot, using lot.quantity_shipped"
    formula: |
      Evaluated strictly in this order; each step consumes only the outputs of earlier steps.
      1. invoice_subtotal_cents:
         - ESTIMATE: round_half_up(quantity_ordered * unit_cost_cents_per_thousand / 1000)
                     (sum-then-round: one rounding for the whole order)
         - FINAL:    sum over lots in lot_code ASC order of
                     round_half_up(lot.quantity_shipped * unit_cost_cents_per_thousand / 1000)
                     (round-then-sum: one rounding per lot, accumulated)
      2. delivered_quantity:
         - ESTIMATE: 0
         - FINAL:    sum of lot.quantity_shipped over the same lots
      3. billing_quantity = quantity_ordered for ESTIMATE, delivered_quantity for FINAL.
      4. freight_cents from billing_quantity using the tier table below (whole-tier flat fee, not
         marginal): billing_quantity <= FREIGHT_TIER_1_MAX -> FREIGHT_TIER_1_CENTS;
         else billing_quantity <= FREIGHT_TIER_2_MAX -> FREIGHT_TIER_2_CENTS;
         else FREIGHT_TIER_3_CENTS.
      5. defect_credit_cents:
         - ESTIMATE: 0 (no inspection has been recorded yet)
         - FINAL:    round_half_up(invoice_subtotal_cents * defect_rate_bp / 10000), where
                     defect_rate_bp is the cumulative rate from calculations.print_job_quality_inspection.
                     A job delivered with inspection_count == 0 has defect_rate_bp == 0 and hence
                     no credit.
      6. invoice_total_cents = invoice_subtotal_cents + freight_cents - defect_credit_cents.
      7. election.committed_print_cents is adjusted by the delta between the newly written
         invoice_total_cents and the value this job previously contributed (0 for the ESTIMATE
         write, the ESTIMATE total for the FINAL write, and the whole current total, negated, when
         the job is REJECTED).
    constants:
      FREIGHT_TIER_1_MAX: 50000
      FREIGHT_TIER_1_CENTS: 45000
      FREIGHT_TIER_2_MAX: 200000
      FREIGHT_TIER_2_CENTS: 90000
      FREIGHT_TIER_3_CENTS: 150000
    precision: "All money in integer cents. unit_cost_cents_per_thousand is a price per 1000 ballots, so every subtotal divides by exactly 1000 before rounding."
    edge_cases:
      - "A job delivered with zero non-voided lots has invoice_subtotal_cents == 0, delivered_quantity == 0, billing_quantity == 0 -> freight tier 1 still applies (0 <= 50000) so invoice_total_cents == FREIGHT_TIER_1_CENTS."
      - "billing_quantity exactly equal to FREIGHT_TIER_1_MAX stays in tier 1; 50001 moves to tier 2."
      - "Because FINAL rounds per lot, a job whose lot split produces three fractional lines can bill less than its ESTIMATE even when delivered_quantity == quantity_ordered."
    worked_example: |
      unit_cost_cents_per_thousand == 8450, quantity_ordered == 12500, lots (lot_code ASC)
      L-001 4001, L-002 4001, L-003 4498 (sum 12500), cumulative defect_rate_bp == 120.
        ESTIMATE: subtotal = round_half_up(12500 * 8450 / 1000) = round_half_up(105625.0) = 105625;
                  delivered_quantity = 0; billing_quantity = 12500 -> freight 45000;
                  defect_credit = 0; total = 105625 + 45000 - 0 = 150625.
        FINAL:    per lot round_half_up(4001 * 8450 / 1000) = round_half_up(33808.45) = 33808;
                  same for L-002 = 33808; round_half_up(4498 * 8450 / 1000) = round_half_up(38008.1) = 38008;
                  subtotal = 33808 + 33808 + 38008 = 105624 (one cent below the ESTIMATE);
                  delivered_quantity = 12500; billing_quantity = 12500 -> freight 45000;
                  defect_credit = round_half_up(105624 * 120 / 10000) = round_half_up(1267.488) = 1267;
                  total = 105624 + 45000 - 1267 = 149357.
      election.committed_print_cents therefore moves +150625 on approve-proof and then
      149357 - 150625 = -1268 on deliver, settling at 149357.

  - name: print_job_quality_inspection
    description: |
      Cumulative quality sampling for a print job. Every POST /print-jobs/{id}/inspect folds the new
      sample into the running totals and re-derives the defect rate, which then decides whether the
      job is held or released. A held job can be re-inspected, so the rate is a running aggregate
      rather than a per-call value.
    algorithm_type: threshold
    input_set: "The PrintJob row's accumulated sample_size and defect_count, plus the new sample from the request payload."
    formula: |
      1. inspection_count = inspection_count + 1
      2. sample_size  = sample_size  + payload.sample_size
      3. defect_count = defect_count + payload.defect_count
      4. defect_rate_bp = round_half_up(defect_count * 10000 / sample_size)
      5. If defect_rate_bp >= QC_HOLD_THRESHOLD_BP the job moves to QC_HOLD;
         otherwise it moves to QC_PASSED.
      6. vendor.quality_defect_rate_bp is re-derived across the vendor as
         round_half_up(sum(defect_count) * 10000 / sum(sample_size)) over all PrintJob rows with
         vendor_id == job.vendor_id AND inspection_count >= 1; when that denominator is 0 the field
         is 0.
    constants:
      QC_HOLD_THRESHOLD_BP: 150
    precision: "Rate in whole basis points; the threshold comparison is inclusive (>=), so a rate exactly at the threshold holds the job."
    edge_cases:
      - "payload.sample_size < 1 is rejected with ERR_INVALID_REQUEST, so the denominator can never be 0 at step 4."
      - "payload.defect_count > payload.sample_size is rejected with ERR_INVALID_REQUEST."
      - "A rate of exactly QC_HOLD_THRESHOLD_BP holds the job; one basis point lower releases it."
      - "A second inspection can only ever move the cumulative rate, never reset it: re-inspection dilutes rather than replaces the earlier sample."
    worked_example: |
      First inspect with sample_size 400, defect_count 6:
        sample_size 400, defect_count 6, defect_rate_bp = round_half_up(6 * 10000 / 400)
        = round_half_up(150.0) = 150 -> 150 >= 150 -> QC_HOLD.
      Second inspect with sample_size 600, defect_count 0:
        sample_size 1000, defect_count 6, defect_rate_bp = round_half_up(6 * 10000 / 1000)
        = round_half_up(60.0) = 60 -> 60 < 150 -> QC_PASSED.
      A single inspect with sample_size 500, defect_count 6 gives
        defect_rate_bp = round_half_up(120.0) = 120 -> QC_PASSED immediately.

  - name: ballot_accountability_reconciliation
    description: |
      The dual-variant ballot accounting close-out. Every reconciliation folds the election's lots
      into a gross issued figure, applies a tiered spoilage allowance, and then compares the
      remaining variance against a tolerance whose tier is keyed on the POST-allowance net figure -
      so an election sitting exactly on a gross tier edge can drop into a different tolerance tier
      than a naive single-pass reading would predict. The PRELIMINARY variant reconciles everything
      currently in the field; the FINAL_CANVASS variant reconciles only lots physically returned.
    algorithm_type: tiered_pricing
    input_set: "All BallotLot rows with election_id == the election, filtered by the variant's custody filter."
    variants:
      - variant: PRELIMINARY
        applies_when: "POST /elections/{id}/reconcile is called with basis == PRELIMINARY, or GET /elections/{id}/accountability is read with basis=PRELIMINARY."
        custody_filter: "lot.custody_state IN {ISSUED, RETURNED}"
      - variant: FINAL_CANVASS
        applies_when: "POST /elections/{id}/reconcile is called with basis == FINAL_CANVASS, or GET /elections/{id}/accountability is read with basis=FINAL_CANVASS."
        custody_filter: "lot.custody_state == RETURNED"
    formula: |
      Evaluated strictly in this order. Steps 3-5 must complete before step 8 chooses a tolerance
      tier, because the tolerance tier is keyed on net_issued, not on gross_issued.
      1. lots = input set after the variant's custody_filter.
      2. gross_issued = sum of lot.issued_quantity over lots.
      3. allowance_bp = SPOILAGE_ALLOWANCE_SMALL_BP if gross_issued <= SPOILAGE_TIER_MAX
                        else SPOILAGE_ALLOWANCE_LARGE_BP        (keyed on GROSS)
      4. spoilage_credit = floor(gross_issued * allowance_bp / 10000)
      5. net_issued = gross_issued - spoilage_credit
      6. accounted = sum of lot.accounted_quantity over lots, where each lot's accounted_quantity
         is voted_quantity + spoiled_quantity + returned_unused_quantity.
      7. gross_variance = gross_issued - accounted
         net_variance   = gross_variance - spoilage_credit  when gross_variance > 0
                        = gross_variance                    when gross_variance <= 0
         (an over-accounted election gets no allowance relief; the allowance excuses missing
          ballots, not surplus ones)
      8. tolerance_bp = TOLERANCE_SMALL_BP  if net_issued <= TOLERANCE_TIER_1_MAX
                        TOLERANCE_MEDIUM_BP if net_issued <= TOLERANCE_TIER_2_MAX
                        TOLERANCE_LARGE_BP  otherwise           (keyed on NET)
      9. tolerance_ballots = floor(net_issued * tolerance_bp / 10000)
      10. ballot_accountability_status = BALANCED if abs(net_variance) <= tolerance_ballots
                                        else OUT_OF_BALANCE
      11. Written to the Election: total_ballots_issued = gross_issued,
          net_ballot_variance = net_variance, ballot_accountability_status,
          reconciliation_basis = the variant, last_reconciled_at = logical clock,
          and version is bumped (this is the OCC-guarded write of §1.2.1).
    constants:
      SPOILAGE_TIER_MAX: 5000
      SPOILAGE_ALLOWANCE_SMALL_BP: 25
      SPOILAGE_ALLOWANCE_LARGE_BP: 15
      TOLERANCE_TIER_1_MAX: 5000
      TOLERANCE_TIER_2_MAX: 20000
      TOLERANCE_SMALL_BP: 200
      TOLERANCE_MEDIUM_BP: 100
      TOLERANCE_LARGE_BP: 50
    precision: "Integer ballots throughout; both tiered quantities use floor, so the allowance and the tolerance are always the conservative (smaller) integer."
    edge_cases:
      - "Zero lots in scope: gross_issued == 0, spoilage_credit == 0, net_issued == 0, accounted == 0, net_variance == 0, tolerance_ballots == 0, and 0 <= 0 -> BALANCED. Reconciling an election with nothing in the field is vacuously balanced."
      - "abs(net_variance) exactly equal to tolerance_ballots is BALANCED; one ballot more is OUT_OF_BALANCE."
      - "gross_issued exactly at SPOILAGE_TIER_MAX takes the SMALL allowance, and the resulting net_issued falls strictly below TOLERANCE_TIER_1_MAX - the two tier keys disagree about which side of 5000 the election is on."
      - "The same election reconciled under both variants can return different statuses, because a lot still in ISSUED contributes its full issued_quantity to PRELIMINARY with accounted_quantity == 0."
    worked_example: |
      Two lots, both RETURNED: L-A issued 3000 with voted 2900 / spoiled 30 / returned_unused 20
      (accounted 2950), L-B issued 2000 with voted 1880 / spoiled 25 / returned_unused 34
      (accounted 1939).
        gross_issued = 5000; 5000 <= 5000 -> allowance_bp = 25;
        spoilage_credit = floor(5000 * 25 / 10000) = floor(12.5) = 12;
        net_issued = 4988;
        accounted = 4889; gross_variance = 111; net_variance = 111 - 12 = 99;
        4988 <= 5000 -> tolerance_bp = 200; tolerance_ballots = floor(4988 * 200 / 10000)
          = floor(99.76) = 99;
        abs(99) <= 99 -> BALANCED (exactly on the boundary).
      Change L-B's returned_unused to 33 (accounted 1938, total accounted 4888):
        gross_variance = 112; net_variance = 100; 100 > 99 -> OUT_OF_BALANCE.

  - name: la_test_discrepancy
    description: |
      Compares the marks a tabulator actually reported during a logic-and-accuracy session against
      the test deck's declared expectation. The absolute per-contest-per-candidate deltas plus the
      blank and overvote deltas are summed; a non-zero total fails the session and starts the
      four-hop L&A failure cascade.
    algorithm_type: aggregation
    input_set: "deck.expected_marks and deck.blank_count / deck.overvote_count for the session's TestDeck, plus payload.reported_marks / reported_blank_count / reported_overvote_count."
    formula: |
      1. Build the key set K = the union of (contest_id, candidate_id) pairs present in
         deck.expected_marks and in payload.reported_marks.
      2. Iterate K in (contest_id ASC, candidate_id ASC) order and accumulate
         mark_delta = sum over K of abs(reported(k) - expected(k)), where a key absent from either
         list contributes 0 for that side.
      3. discrepancy_count = mark_delta
                           + abs(payload.reported_blank_count    - deck.blank_count)
                           + abs(payload.reported_overvote_count - deck.overvote_count)
      4. discrepancy_count == 0 -> session PASSED; > 0 -> session FAILED.
      5. deck.expected_total_marks is the sum of mark_count over deck.expected_marks and is
         recomputed whenever the deck is created; it is reported alongside the comparison but is
         not itself part of the delta (a deck that reports the right total with the wrong
         distribution still fails).
    constants: {}
    precision: "Integer mark counts; the iteration order is fixed only so the sum is reproducible - addition order cannot change an integer total, but the published order removes any ambiguity for partial-failure reporting."
    edge_cases:
      - "A reported mark for a (contest_id, candidate_id) pair absent from the deck contributes its full reported count to the discrepancy."
      - "Two offsetting errors (one candidate over by 3, another under by 3) yield discrepancy_count == 6, not 0, because absolute values are summed before totalling."
      - "Correct marks with a wrong blank count still fails."
    worked_example: |
      Deck: expected_marks [{C1,K1,40},{C1,K2,35},{C2,K3,25}] (expected_total_marks 100),
      blank_count 5, overvote_count 3.
      Reported [{C1,K1,40},{C1,K2,34},{C2,K3,25}], reported_blank_count 6, reported_overvote_count 3:
        mark_delta = 0 + 1 + 0 = 1; blanks abs(6 - 5) = 1; overvotes abs(3 - 3) = 0;
        discrepancy_count = 2 -> FAILED.
      Reporting the deck exactly gives discrepancy_count = 0 -> PASSED.

  - name: test_deck_composition
    description: "Validates and derives a test deck's declared composition against the ballot style it is built for."
    algorithm_type: aggregation
    input_set: "payload.expected_marks, payload.blank_count, payload.overvote_count, and the certified layout of the deck's BallotStyle."
    formula: |
      1. expected_total_marks = sum of mark_count over payload.expected_marks.
      2. ballot_count = payload.ballot_count.
      3. Every (contest_id, candidate_id) pair in expected_marks must resolve to a Contest whose
         district_code is a member of style.district_codes and whose status == CERTIFIED, and to a
         Candidate of that contest with status == CERTIFIED; otherwise ERR_DECK_MARK_OFF_STYLE.
      4. mark_capacity = ballot_count * LINES_PER_FACE. If expected_total_marks > mark_capacity the
         deck is rejected with ERR_DECK_MARKS_EXCEED_CAPACITY.
      5. ballot_count < 1 is rejected with ERR_EMPTY_TEST_DECK (a deck with no ballots cannot
         demonstrate anything, and it would also make every later comparison vacuous).
    constants:
      LINES_PER_FACE: 40
    precision: "Integer counts; the capacity comparison is strict (> capacity fails, == capacity passes)."
    edge_cases:
      - "ballot_count == 0 -> ERR_EMPTY_TEST_DECK, even when expected_marks is also empty."
      - "ballot_count == 1 with expected_total_marks == 40 is accepted (exactly at capacity); 41 is rejected."
      - "blank_count and overvote_count are not capped by mark_capacity: a blank ballot consumes a ballot, not a mark line."

  - name: election_deployment_readiness
    description: |
      Constraint propagation from lots and tabulators up through precincts to the election. Every
      lot issue/recall, tabulator deploy/seal-break and L&A result re-derives this chain, and the
      election-level result gates POST /elections/{id}/deploy.
    algorithm_type: constraint_propagation
    input_set: "All Precinct, BallotLot and TabulatorUnit rows of the election."
    formula: |
      1. Per precinct, ballots_received and required_ballot_quantity come from
         calculations.precinct_ballot_requirement.
      2. precinct.deployment_status = READY iff BOTH hold:
         a. ballots_received >= required_ballot_quantity, AND
         b. at least one TabulatorUnit exists with precinct_id == precinct.id
            AND program_status == LA_PASSED AND custody_status == DEPLOYED.
         Otherwise NOT_READY.
      3. election.deployment_readiness = READY iff the election has at least one Precinct AND every
         Precinct of the election has deployment_status == READY. Otherwise BLOCKED.
      4. The propagation is re-evaluated eagerly inside the same request as any of its inputs
         change (consistency_model: immediate), so the response body of the triggering request
         already shows the new readiness.
    constants: {}
    precision: "Boolean-valued enums; no arithmetic beyond the underlying quantity comparison."
    edge_cases:
      - "An election with zero precincts is BLOCKED, not READY: the empty conjunction is deliberately not treated as satisfied."
      - "A tabulator that is LA_PASSED but still IN_VAULT does not make its precinct READY; deployment is what counts."
      - "A tabulator whose L&A result later fails demotes precinct and election in the same request that records the result."

# =============================================================================
# 1.4 Validations (priority-ordered; LOWER priority number is evaluated FIRST)
# =============================================================================
# This table is the authoritative evaluation order. The `preconditions` lists in §1.2
# enumerate the guards that apply to a transition but do not imply an order; whenever two
# guards on the same request are both violated, the guard whose rule below has the lower
# priority number determines the returned error_id.
validations:
  - rule_id: authentication-required
    category: authentication
    priority: 10
    applies_to: ["every endpoint except POST /_clock/set_current_utc"]
    condition: "The X-Role header is absent, empty, or not one of the seven roles in §1.7."
    error_id: ERR_UNAUTHENTICATED
  - rule_id: role-authorized
    category: authorization
    priority: 20
    applies_to: ["every endpoint except POST /_clock/set_current_utc"]
    condition: "The X-Role header names a known role that is not listed in the endpoint's roles."
    error_id: ERR_UNAUTHORIZED
  - rule_id: request-schema-valid
    category: schema
    priority: 30
    applies_to: ["every endpoint with a request body or query parameters"]
    condition: |
      A required field is absent or null; a field carries the wrong JSON type; an enum field carries
      a value outside its declared set; a count/quantity/money field is negative where the field
      description requires >= 0 or < 1 where it requires >= 1; a window's end is less than or equal
      to its start; a timestamp is not an ISO-8601 UTC instant; payload.defect_count exceeds
      payload.sample_size; payload.lots on POST /print-jobs/{id}/deliver is empty or repeats a
      lot_code within the manifest. Unknown extra fields are NOT a schema violation - they are
      ignored, and the response echoes only declared fields.
    error_id: ERR_INVALID_REQUEST
  - rule_id: path-entity-exists
    category: existence
    priority: 40
    applies_to: ["every endpoint with an {id} path parameter"]
    condition: "No row of the addressed entity has that id."
    error_id: "the entity's NOT_FOUND error (ERR_ELECTION_NOT_FOUND, ERR_CONTEST_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_PRECINCT_NOT_FOUND, ERR_BALLOT_STYLE_NOT_FOUND, ERR_PRINT_VENDOR_NOT_FOUND, ERR_PRINT_JOB_NOT_FOUND, ERR_BALLOT_LOT_NOT_FOUND, ERR_TABULATOR_NOT_FOUND, ERR_TEST_DECK_NOT_FOUND, ERR_LA_SESSION_NOT_FOUND)"
  - rule_id: referenced-entity-exists
    category: existence
    priority: 50
    applies_to: ["POST /precincts/{id}/assign-style", "POST /print-jobs", "POST /ballot-lots/{id}/issue", "POST /tabulator-units/{id}/program", "POST /tabulator-units/{id}/deploy", "POST /la-test-sessions"]
    condition: |
      A payload field carrying an FK does not resolve to an existing row, or resolves to a row
      belonging to a different election than the addressed entity. Cross-election references are
      reported as NOT_FOUND rather than as a business error, so an election's rows never leak.
    error_id: "the referenced entity's NOT_FOUND error"
  - rule_id: election-version-current
    category: concurrency
    priority: 60
    applies_to: ["POST /elections/{id}/reconcile"]
    condition: "payload.expected_election_version != election.version."
    error_id: ERR_STALE_ELECTION_VERSION
  - rule_id: ballot-style-version-current
    category: concurrency
    priority: 60
    applies_to: ["POST /print-jobs"]
    condition: "payload.expected_ballot_style_version != style.version."
    error_id: ERR_STALE_BALLOT_STYLE_VERSION
  - rule_id: election-phase-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /elections/{id}/certify-ballot-order", "POST /elections/{id}/lock-styles", "POST /elections/{id}/deploy", "POST /elections/{id}/close-polls", "POST /elections/{id}/reconcile", "POST /elections/{id}/contests", "POST /contests/{id}/candidates", "POST /contests/{id}/certify", "POST /contests/{id}/withdraw", "POST /candidates/{id}/disqualify", "POST /elections/{id}/precincts", "POST /precincts/{id}/assign-style", "POST /elections/{id}/ballot-styles", "POST /ballot-styles/{id}/language-certifications", "POST /ballot-styles/{id}/request-proof", "POST /ballot-styles/{id}/proof-decision", "POST /print-jobs", "POST /print-jobs/{id}/approve-proof", "POST /ballot-lots/{id}/receive", "POST /ballot-lots/{id}/issue", "POST /ballot-lots/{id}/recall", "POST /ballot-lots/{id}/return-counts", "POST /elections/{id}/tabulator-units", "POST /tabulator-units/{id}/program", "POST /tabulator-units/{id}/deploy", "POST /tabulator-units/{id}/break-seal", "POST /ballot-styles/{id}/test-decks", "POST /la-test-sessions"]
    condition: "The owning Election's status is not in the permitted set for the endpoint, per the allowed_phases table below. An endpoint absent from applies_to is not phase-gated at all (POST /print-jobs/{id}/inspect, POST /print-jobs/{id}/deliver, POST /tabulator-units/{id}/seal-retention, POST /la-test-sessions/{id}/observers, POST /la-test-sessions/{id}/start, POST /la-test-sessions/{id}/record-results and every GET)."
    error_id: ERR_ELECTION_PHASE_INVALID
    allowed_phases:
      "POST /elections/{id}/certify-ballot-order": [SETUP]
      "POST /elections/{id}/lock-styles": [CONTESTS_CERTIFIED]
      "POST /elections/{id}/deploy": [STYLES_LOCKED]
      "POST /elections/{id}/close-polls": [DEPLOYED]
      "POST /elections/{id}/reconcile": [POLLS_CLOSED, RECONCILED]
      "POST /elections/{id}/contests": [SETUP]
      "POST /contests/{id}/candidates": [SETUP]
      "POST /contests/{id}/certify": [SETUP]
      "POST /contests/{id}/withdraw": [SETUP, CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /candidates/{id}/disqualify": [SETUP, CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /elections/{id}/precincts": [SETUP, CONTESTS_CERTIFIED]
      "POST /precincts/{id}/assign-style": [CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /elections/{id}/ballot-styles": [SETUP, CONTESTS_CERTIFIED]
      "POST /ballot-styles/{id}/language-certifications": [SETUP, CONTESTS_CERTIFIED]
      "POST /ballot-styles/{id}/request-proof": [CONTESTS_CERTIFIED]
      "POST /ballot-styles/{id}/proof-decision": [CONTESTS_CERTIFIED]
      "POST /print-jobs": [CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /print-jobs/{id}/approve-proof": [CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /ballot-lots/{id}/receive": [STYLES_LOCKED, DEPLOYED]
      "POST /ballot-lots/{id}/issue": [STYLES_LOCKED, DEPLOYED]
      "POST /ballot-lots/{id}/recall": [STYLES_LOCKED, DEPLOYED]
      "POST /ballot-lots/{id}/return-counts": [DEPLOYED, POLLS_CLOSED]
      "POST /elections/{id}/tabulator-units": [SETUP, CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /tabulator-units/{id}/program": [STYLES_LOCKED]
      "POST /tabulator-units/{id}/deploy": [STYLES_LOCKED]
      "POST /tabulator-units/{id}/break-seal": [STYLES_LOCKED, DEPLOYED]
      "POST /ballot-styles/{id}/test-decks": [CONTESTS_CERTIFIED, STYLES_LOCKED]
      "POST /la-test-sessions": [STYLES_LOCKED, DEPLOYED, POLLS_CLOSED]
  - rule_id: contest-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /contests/{id}/candidates", "POST /contests/{id}/certify", "POST /contests/{id}/withdraw"]
    condition: "The Contest's status is not a legal `from` state for the requested transition."
    error_id: ERR_CONTEST_STATE_INVALID
  - rule_id: candidate-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /candidates/{id}/disqualify", "POST /contests/{id}/certify"]
    condition: |
      disqualify: the Candidate's status is already DISQUALIFIED. certify: the contest is a CANDIDATE
      contest whose count of Candidate rows with status == FILED is less than seats_open, so the contest
      cannot fill its seats (a MEASURE contest is exempt and certifies with no candidates at all).
    error_id: ERR_CANDIDATE_STATE_INVALID
  - rule_id: style-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /ballot-styles/{id}/language-certifications", "POST /ballot-styles/{id}/request-proof", "POST /ballot-styles/{id}/proof-decision", "POST /print-jobs", "POST /print-jobs/{id}/approve-proof", "POST /tabulator-units/{id}/program", "POST /ballot-styles/{id}/test-decks", "POST /precincts/{id}/assign-style"]
    condition: |
      The BallotStyle's status is not legal for the operation: language certifications require
      DRAFT or PROOF_REJECTED; request-proof requires DRAFT or PROOF_REJECTED; proof-decision
      requires PROOFING; print-job creation requires APPROVED or LOCKED; approve-proof requires
      the pinned style to be APPROVED or LOCKED; test-deck creation requires APPROVED or LOCKED;
      tabulator programming requires LOCKED; precinct style assignment requires APPROVED or LOCKED
      (a precinct must already point at an APPROVED style before POST /elections/{id}/lock-styles,
      which is the call that locks it). A SUPERSEDED style is never legal.
    error_id: ERR_STYLE_STATE_INVALID
  - rule_id: print-job-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /print-jobs/{id}/approve-proof", "POST /print-jobs/{id}/inspect", "POST /print-jobs/{id}/deliver"]
    condition: "approve-proof requires PROOF_PENDING; inspect requires PRINTING or QC_HOLD; deliver requires QC_PASSED."
    error_id: ERR_JOB_STATE_INVALID
  - rule_id: ballot-lot-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /ballot-lots/{id}/receive", "POST /ballot-lots/{id}/issue", "POST /ballot-lots/{id}/recall", "POST /ballot-lots/{id}/return-counts", "POST /tabulator-units/{id}/deploy"]
    condition: "receive requires IN_TRANSIT; issue requires RECEIVED; recall and return-counts require ISSUED; tabulator deployment requires at least one lot at the target precinct in ISSUED."
    error_id: ERR_LOT_STATE_INVALID
  - rule_id: tabulator-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /tabulator-units/{id}/program", "POST /tabulator-units/{id}/deploy", "POST /tabulator-units/{id}/break-seal", "POST /tabulator-units/{id}/seal-retention", "POST /la-test-sessions", "POST /la-test-sessions/{id}/start"]
    condition: |
      program requires program_status IN {UNPROGRAMMED, LA_FAILED} and custody_status == IN_VAULT;
      deploy requires program_status == LA_PASSED and custody_status == IN_VAULT;
      break-seal requires custody_status == DEPLOYED;
      seal-retention requires custody_status == RETURNED;
      session creation and start require program_status IN {PROGRAMMED, LA_PASSED}.
    error_id: ERR_UNIT_STATE_INVALID
  - rule_id: test-deck-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /la-test-sessions", "POST /la-test-sessions/{id}/start"]
    condition: "The referenced TestDeck's status is not DRAFT."
    error_id: ERR_DECK_STATE_INVALID
  - rule_id: la-session-state-permits-operation
    category: state
    priority: 70
    applies_to: ["POST /la-test-sessions/{id}/observers", "POST /la-test-sessions/{id}/start", "POST /la-test-sessions/{id}/record-results"]
    condition: "observers and start require SCHEDULED; record-results requires IN_PROGRESS."
    error_id: ERR_SESSION_STATE_INVALID
    conflicts_with: "session-started-inside-window (priority 100) - calling start again on a session that is already IN_PROGRESS after the clock has passed scheduled_end returns ERR_SESSION_STATE_INVALID, not ERR_OUTSIDE_TEST_WINDOW."
  - rule_id: proof-decision-separation-of-duties
    category: business_safety
    priority: 80
    applies_to: ["POST /ballot-styles/{id}/proof-decision"]
    condition: "X-User-ID == style.proof_requested_by_user_id (the person who sent the proof out cannot be the person who signs it off)."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule_id: la-session-start-separation-of-duties
    category: business_safety
    priority: 80
    applies_to: ["POST /la-test-sessions/{id}/start"]
    condition: "X-User-ID == tabulator.programmed_by_user_id (the technician who programmed the unit cannot conduct its public logic-and-accuracy test)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    conflicts_with: "observer-minimum-met (priority 110) - a self-test start that is also short of observers returns ERR_SEGREGATION_OF_DUTIES."
  - rule_id: la-results-recorded-by-conductor
    category: business_safety
    priority: 80
    applies_to: ["POST /la-test-sessions/{id}/record-results"]
    condition: "X-User-ID != session.conducted_by_user_id (results must be entered by the technician who actually ran the session)."
    error_id: ERR_SEGREGATION_OF_DUTIES
  - rule_id: print-vendor-secure-facility
    category: business_referential
    priority: 90
    applies_to: ["POST /print-jobs", "POST /print-jobs/{id}/approve-proof"]
    condition: "vendor.certified_secure == false or vendor.status == SUSPENDED."
    error_id: ERR_VENDOR_NOT_SECURE
  - rule_id: proof-pinned-to-style-revision
    category: business_referential
    priority: 90
    applies_to: ["POST /print-jobs/{id}/approve-proof"]
    condition: "job.style_version_at_creation != style.version (the artwork moved after the job was placed, so the proof on the vendor's press is not the artwork of record)."
    error_id: ERR_PROOF_VERSION_STALE
  - rule_id: lot-matches-precinct-style
    category: business_referential
    priority: 90
    applies_to: ["POST /ballot-lots/{id}/issue"]
    condition: "precinct.assigned_style_id != the style_id of the lot's parent PrintJob."
    error_id: ERR_LOT_NOT_FOR_PRECINCT
    conflicts_with: "issue-quantity-within-receipt (priority 120) - issuing a wrong-style lot in an over-large quantity returns ERR_LOT_NOT_FOR_PRECINCT."
  - rule_id: tabulator-programmed-for-precinct-style
    category: business_referential
    priority: 90
    applies_to: ["POST /tabulator-units/{id}/deploy"]
    condition: "unit.programmed_style_id != precinct.assigned_style_id."
    error_id: ERR_UNIT_STYLE_MISMATCH
  - rule_id: receipt-seal-matches-shipment
    category: business_referential
    priority: 90
    applies_to: ["POST /ballot-lots/{id}/receive"]
    condition: "payload.seal_number != lot.seal_number (the seal on the pallet is not the seal the vendor declared)."
    error_id: ERR_SEAL_MISMATCH
  - rule_id: seal-number-unique-per-election
    category: business_referential
    priority: 90
    applies_to: ["POST /tabulator-units/{id}/deploy", "POST /tabulator-units/{id}/seal-retention", "POST /print-jobs/{id}/deliver"]
    condition: |
      Some other BallotLot or TabulatorUnit of the same election already holds a non-null seal_number
      equal to the seal_number being written. On POST /print-jobs/{id}/deliver the check runs over every
      manifest line before any lot is created, so a seal repeated inside one manifest collides with itself
      and rejects the whole manifest.
    error_id: ERR_SEAL_NUMBER_DUPLICATE
  - rule_id: public-notice-lead-sufficient
    category: business_temporal
    priority: 100
    applies_to: ["POST /la-test-sessions/{id}/start"]
    condition: "session.notice_lead_minutes < election.la_notice_hours * 60, where notice_lead_minutes is derived at session creation as the whole minutes between public_notice_posted_at and scheduled_start."
    error_id: ERR_PUBLIC_NOTICE_TOO_LATE
  - rule_id: session-started-inside-window
    category: business_temporal
    priority: 100
    applies_to: ["POST /la-test-sessions/{id}/start"]
    condition: "The logical clock is earlier than scheduled_start - SESSION_EARLY_START_MINUTES or later than scheduled_end."
    error_id: ERR_OUTSIDE_TEST_WINDOW
    constants:
      SESSION_EARLY_START_MINUTES: 60
  - rule_id: unit-test-window-exclusive
    category: business_temporal
    priority: 100
    applies_to: ["POST /la-test-sessions"]
    condition: |
      A TabulatorUnit can host only one logic-and-accuracy session at a time, and the technician
      needs SETUP_BUFFER_MINUTES on each side of a session to mount and clear the deck. The
      proposed session conflicts when another LATestSession on the same tabulator_id, with status
      IN {SCHEDULED, IN_PROGRESS, PASSED, FAILED}, has a buffered window that overlaps the
      proposed buffered window. Each session's buffered window is the CLOSED interval
      [scheduled_start - SETUP_BUFFER_MINUTES, scheduled_end + SETUP_BUFFER_MINUTES], so two
      sessions that merely touch at a buffered endpoint DO conflict; the aggregate capacity of a
      unit is 1.
    error_id: ERR_UNIT_TEST_WINDOW_CONFLICT
    constants:
      SETUP_BUFFER_MINUTES: 30
      UNIT_SESSION_CAPACITY: 1
  - rule_id: press-window-capacity-available
    category: business_temporal
    priority: 100
    applies_to: ["POST /print-jobs"]
    condition: |
      A PrintVendor can run at most press_line_count jobs at any instant. The proposed job
      conflicts when the count of existing PrintJob rows for the same vendor_id, with status
      IN {PROOF_PENDING, PRINTING, QC_HOLD, QC_PASSED, DELIVERED}, whose HALF-OPEN window
      [press_window_start, press_window_end) intersects the proposed HALF-OPEN window, is already
      greater than or equal to vendor.press_line_count. Because the interval is half-open, a job
      starting exactly when another ends does NOT conflict; because the limit is an aggregate
      count, each individual overlap can be legal while the collective is not.
    error_id: ERR_PRESS_CAPACITY_EXCEEDED
  - rule_id: observer-minimum-met
    category: business_constraint
    priority: 110
    applies_to: ["POST /la-test-sessions/{id}/start"]
    condition: "session.observer_count < MIN_PUBLIC_OBSERVERS when session_type == PRE_ELECTION_PUBLIC, or < MIN_AUDIT_OBSERVERS when session_type == POST_ELECTION_AUDIT."
    error_id: ERR_INSUFFICIENT_OBSERVERS
    constants:
      MIN_PUBLIC_OBSERVERS: 2
      MIN_AUDIT_OBSERVERS: 1
  - rule_id: language-and-format-coverage-complete
    category: business_constraint
    priority: 110
    applies_to: ["POST /ballot-styles/{id}/request-proof"]
    condition: "style.language_set is not a subset of style.translated_languages, or style.required_formats is not a subset of style.certified_formats."
    error_id: ERR_LANGUAGE_COVERAGE_INCOMPLETE
  - rule_id: test-deck-non-empty
    category: business_constraint
    priority: 110
    applies_to: ["POST /ballot-styles/{id}/test-decks"]
    condition: "payload.ballot_count < 1."
    error_id: ERR_EMPTY_TEST_DECK
  - rule_id: test-deck-marks-on-style
    category: business_constraint
    priority: 110
    applies_to: ["POST /ballot-styles/{id}/test-decks"]
    condition: "Some expected_marks entry names a contest that is not CERTIFIED, a contest whose district_code is not in style.district_codes, or a candidate that is not a CERTIFIED candidate of that contest."
    error_id: ERR_DECK_MARK_OFF_STYLE
  - rule_id: test-deck-within-capacity
    category: business_constraint
    priority: 110
    applies_to: ["POST /ballot-styles/{id}/test-decks"]
    condition: "sum(expected_marks[*].mark_count) > payload.ballot_count * LINES_PER_FACE."
    error_id: ERR_DECK_MARKS_EXCEED_CAPACITY
  - rule_id: ballot-order-well-defined
    category: business_constraint
    priority: 110
    applies_to: ["POST /contests/{id}/certify"]
    condition: |
      Some other Contest of the same election with status IN {DRAFT, CERTIFIED} shares this contest's
      (contest_type, district_code, title) triple - exactly the tuple calculations.contest_ballot_ordering
      sorts on, so admitting the second one would leave the printed order undefined. The guard sits on
      certification rather than on POST /elections/{id}/certify-ballot-order so that the ordering pass can
      never be handed an ambiguous input set: a duplicate is refused while it is still uncertified, and
      because no endpoint rewrites contest_type, district_code or title, a certified pair can never
      collide after the fact. A duplicate DRAFT contest therefore blocks its twin's certification with no
      remedy other than certifying neither - deliberate, since either choice of printed order would be arbitrary.
    error_id: ERR_BALLOT_ORDER_COLLISION
  - rule_id: certified-contests-present
    category: business_constraint
    priority: 110
    applies_to: ["POST /elections/{id}/certify-ballot-order"]
    condition: "The election has zero Contest rows with status == CERTIFIED."
    error_id: ERR_NO_CERTIFIED_CONTESTS
  - rule_id: deployment-readiness-satisfied
    category: business_constraint
    priority: 110
    applies_to: ["POST /elections/{id}/deploy"]
    condition: "election.deployment_readiness == BLOCKED per calculations.election_deployment_readiness."
    error_id: ERR_DEPLOYMENT_NOT_READY
  - rule_id: final-canvass-requires-returned-lots
    category: business_constraint
    priority: 110
    applies_to: ["POST /elections/{id}/reconcile"]
    condition: "payload.basis == FINAL_CANVASS and at least one BallotLot of the election is still in custody_state ISSUED."
    error_id: ERR_LOTS_NOT_RETURNED
  - rule_id: retention-after-reconciliation
    category: business_constraint
    priority: 110
    applies_to: ["POST /tabulator-units/{id}/seal-retention"]
    condition: "election.status != RECONCILED."
    error_id: ERR_RETENTION_BEFORE_RECONCILIATION
  - rule_id: print-quantity-covers-requirement
    category: business_fiscal
    priority: 120
    applies_to: ["POST /print-jobs"]
    condition: "payload.quantity_ordered < the sum of required_ballot_quantity over every Precinct whose assigned_style_id == payload.style_id. When no precinct is assigned to the style yet the requirement is 0 and any positive quantity passes."
    error_id: ERR_QUANTITY_BELOW_REQUIREMENT
  - rule_id: issue-quantity-within-receipt
    category: business_fiscal
    priority: 120
    applies_to: ["POST /ballot-lots/{id}/issue"]
    condition: "payload.issue_quantity > lot.quantity_received."
    error_id: ERR_ISSUE_QUANTITY_EXCEEDS_RECEIPT
  - rule_id: lot-accounting-within-receipt
    category: business_fiscal
    priority: 120
    applies_to: ["POST /ballot-lots/{id}/return-counts"]
    condition: "payload.voted_quantity + payload.spoiled_quantity + payload.returned_unused_quantity > lot.quantity_received."
    error_id: ERR_LOT_ACCOUNTING_EXCEEDS_RECEIPT

# =============================================================================
# 1.5 Endpoints
# =============================================================================
# Path parameters are never listed in `input:`; `input:` enumerates request-body
# fields for writes and query parameters for reads. A trailing `?` marks an
# optional field. Every write returns the mutated primary entity so that a test
# can assert on cascaded derived fields without a second read.
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Test-driving endpoint: sets the server's logical clock. All temporal evaluation in this
      service (notice lead, test-window admission, retention_until, last_reconciled_at,
      occurred_at, created_at, updated_at) reads this clock and never the host wall clock.
      The clock defaults to 2026-08-01T00:00:00Z when the service starts and is never advanced
      implicitly.
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: [now]
    output: { now: string }
    side_effects:
      - "The logical clock is set to payload.now. No domain entity is modified."
    errors: [ERR_INVALID_REQUEST]

  - method: POST
    path: /elections
    description: "Registers an election in SETUP."
    roles: [ElectionsDirector]
    input: [name, jurisdiction, election_date, "rotation_policy?", "candidate_order_method?", "la_notice_hours?"]
    output: Election
    side_effects:
      - "Creates an Election with status SETUP, certified_contest_count 0, committed_print_cents 0, deployment_readiness BLOCKED, open_seal_count 0, total_ballots_received 0, total_ballots_issued 0, ballot_accountability_status PENDING, net_ballot_variance 0, reconciliation_basis null, last_reconciled_at null."
      - "Omitted rotation_policy defaults to NONE, candidate_order_method to ALPHABETICAL_BY_BALLOT_NAME, la_notice_hours to 48."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /elections/{id}
    description: "Reads one election with all derived ledger fields."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: []
    output: Election
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND]

  - method: POST
    path: /elections/{id}/certify-ballot-order
    description: "Freezes contest ordering and candidate base ordering for the election (SETUP -> CONTESTS_CERTIFIED)."
    roles: [ElectionsDirector]
    input: []
    output: Election
    side_effects:
      - "Assigns Contest.ballot_order_index across CERTIFIED contests per calculations.contest_ballot_ordering."
      - "Assigns Candidate.base_order_index per calculations.candidate_ballot_order under CERTIFIED_BASIS for every certified contest."
      - "election.status = CONTESTS_CERTIFIED; election.certified_contest_count recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_NO_CERTIFIED_CONTESTS]

  - method: POST
    path: /elections/{id}/lock-styles
    description: "Locks every APPROVED ballot style so programming, style assignment and printing can proceed (CONTESTS_CERTIFIED -> STYLES_LOCKED)."
    roles: [ElectionsDirector]
    input: []
    output: Election
    side_effects:
      - "Every BallotStyle of the election in status APPROVED transitions to LOCKED and has its version bumped; styles in DRAFT, PROOFING or PROOF_REJECTED are left untouched (their version does not move)."
      - "election.status = STYLES_LOCKED."
      - "Because locking bumps each locked style's version, a PrintJob placed before the lock now carries a style_version_at_creation that is one behind, and its press proof can no longer be approved (ERR_PROOF_VERSION_STALE): print orders are meant to be placed against the locked artwork."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_ELECTION_PHASE_INVALID]

  - method: POST
    path: /elections/{id}/deploy
    description: "Declares pre-election deployment complete (STYLES_LOCKED -> DEPLOYED)."
    roles: [ElectionsDirector]
    input: []
    output: Election
    side_effects:
      - "election.status = DEPLOYED."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_DEPLOYMENT_NOT_READY]

  - method: POST
    path: /elections/{id}/close-polls
    description: "Closes the polls (DEPLOYED -> POLLS_CLOSED) and recalls every deployed tabulator."
    roles: [ElectionsDirector]
    input: []
    output: Election
    side_effects:
      - "Every TabulatorUnit of the election with custody_status DEPLOYED transitions to RETURNED, keeping its seal_number, and a CustodyEvent RETURN is appended for each."
      - "Each affected precinct recomputes deployment_status and the election recomputes deployment_readiness."
      - "election.status = POLLS_CLOSED."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_ELECTION_PHASE_INVALID]

  - method: POST
    path: /elections/{id}/reconcile
    description: "Records a ballot-accountability reconciliation under the requested basis. OCC-guarded on the election's version (§1.2.1)."
    roles: [ElectionsDirector]
    input: [basis, expected_election_version]
    output: Election
    side_effects:
      - "Runs calculations.ballot_accountability_reconciliation for payload.basis and writes total_ballots_issued, net_ballot_variance, ballot_accountability_status, reconciliation_basis, last_reconciled_at."
      - "election.status = RECONCILED (POLLS_CLOSED -> RECONCILED, or RECONCILED -> RECONCILED when re-reconciling)."
      - "election.version is bumped."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ELECTION_NOT_FOUND, ERR_STALE_ELECTION_VERSION, ERR_ELECTION_PHASE_INVALID, ERR_LOTS_NOT_RETURNED]

  - method: GET
    path: /elections/{id}/accountability
    description: "Computed read: the full ballot-accountability worksheet under the requested basis, without mutating the election. basis defaults to PRELIMINARY (the in-field view)."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: ["basis?"]
    output: { basis: string, lot_count: integer, gross_issued: integer, allowance_bp: integer, spoilage_credit: integer, net_issued: integer, accounted: integer, gross_variance: integer, net_variance: integer, tolerance_bp: integer, tolerance_ballots: integer, ballot_accountability_status: string }
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /elections/{id}/contests
    description: "Lists the election's contests (FK reverse-reachability for Contest.election_id)."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: ["status?"]
    output: Contest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /elections/{id}/custody-events
    description: "Immutable chain-of-custody ledger for the election, ordered by sequence_index ASC (FK reverse-reachability for CustodyEvent.election_id)."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: ["subject_type?", "subject_id?", "event_type?"]
    output: CustodyEvent[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ELECTION_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: /elections/{id}/contests
    description: "Files a contest against the election in DRAFT."
    roles: [ElectionsDirector, BallotCoordinator]
    input: [title, contest_type, district_code, seats_open, "rotation_required?"]
    output: Contest
    side_effects:
      - "Creates a Contest with status DRAFT, ballot_order_index null, certified_candidate_count 0, certified_at null, withdrawn_reason null."
      - "Omitted rotation_required defaults to false, matching §1.1 Contest.rotation_required."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_ELECTION_NOT_FOUND, ERR_ELECTION_PHASE_INVALID]

  - method: GET
    path: /contests/{id}
    description: "Reads one contest."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: []
    output: Contest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONTEST_NOT_FOUND]

  - method: GET
    path: /contests/{id}/candidates
    description: "Lists the contest's candidates ordered by base_order_index ASC then created_at ASC (FK reverse-reachability for Candidate.contest_id)."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: ["status?"]
    output: Candidate[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONTEST_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: /contests/{id}/candidates
    description: "Files a candidate for the contest."
    roles: [ElectionsDirector, BallotCoordinator]
    input: [full_name, ballot_name, filing_received_at, "party_code?"]
    output: Candidate
    side_effects:
      - "Creates a Candidate with status FILED, base_order_index null, disqualified_reason null."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CONTEST_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_CONTEST_STATE_INVALID]

  - method: POST
    path: /contests/{id}/certify
    description: "Certifies the contest and every candidate filed for it (DRAFT -> CERTIFIED)."
    roles: [ElectionsDirector]
    input: []
    output: Contest
    side_effects:
      - "Every Candidate of the contest with status FILED transitions to CERTIFIED; DISQUALIFIED candidates are untouched."
      - "certified_at = logical clock; certified_candidate_count recomputed; Candidate.base_order_index assigned per calculations.candidate_ballot_order under CERTIFIED_BASIS; election.certified_contest_count recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONTEST_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_CONTEST_STATE_INVALID, ERR_CANDIDATE_STATE_INVALID, ERR_BALLOT_ORDER_COLLISION]

  - method: POST
    path: /contests/{id}/withdraw
    description: "Withdraws a certified contest and cascades the withdrawal through styles, print jobs, lots, precincts and the election (depth-5 cascade)."
    roles: [ElectionsDirector]
    input: [withdrawn_reason]
    output: Contest
    side_effects:
      - "Hop 1: contest.status = WITHDRAWN, ballot_order_index = null, withdrawn_reason stored; election.certified_contest_count recomputed."
      - "Hop 2: every BallotStyle of the election whose district_codes contains contest.district_code and whose status is PROOFING, APPROVED or LOCKED transitions to PROOF_REJECTED, has contest_count recomputed and has translated_languages and certified_formats cleared to empty arrays (proof_cycle_count is NOT touched - only request-proof increments it); DRAFT, PROOF_REJECTED and SUPERSEDED styles are left alone; every TestDeck of an affected style in DRAFT or SEALED is VOIDED."
      - "Hop 3: every PrintJob referencing an affected style with status PROOF_PENDING, PRINTING, QC_HOLD, QC_PASSED or DELIVERED transitions to REJECTED, its invoice fields are zeroed, vendor.active_job_count is recomputed and election.committed_print_cents is reduced by the job's prior invoice_total_cents (delivered_quantity is left as shipped)."
      - "Hop 4: every BallotLot of a rejected job in custody_state IN_TRANSIT, RECEIVED or ISSUED is VOIDED with issued_quantity and precinct_id cleared and a CustodyEvent VOID appended; a lot already RETURNED is left alone; election.total_ballots_received and total_ballots_issued recomputed."
      - "Hop 5: every precinct that lost lots recomputes ballots_received and deployment_status, and election.deployment_readiness is recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CONTEST_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_CONTEST_STATE_INVALID]

  - method: POST
    path: /candidates/{id}/disqualify
    description: "Disqualifies a candidate and re-derives the printed order of the surviving siblings (depth-3 cascade)."
    roles: [ElectionsDirector]
    input: [disqualified_reason]
    output: Candidate
    side_effects:
      - "Hop 1: candidate.status = DISQUALIFIED, disqualified_reason stored, base_order_index = null (a disqualified candidate has no certified position); contest.certified_candidate_count recomputed."
      - "Hop 2: every surviving CERTIFIED sibling's base_order_index is re-derived per calculations.candidate_ballot_order under CERTIFIED_BASIS, so the rotation modulus N shrinks by one."
      - "Hop 3: every TestDeck whose expected_marks reference this candidate, or whose style covers this contest's district, is VOIDED (DRAFT or SEALED -> VOIDED)."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CANDIDATE_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_CANDIDATE_STATE_INVALID]

