      - { name: open_minute_of_day, type: integer, source: input, description: "Minutes after 00:00 UTC the studio opens (inclusive).", default: 540, constraints: "0..1439" }
      - { name: close_minute_of_day, type: integer, source: input, description: "Minutes after 00:00 UTC the studio closes (exclusive).", default: 1260, constraints: "open_minute_of_day < close_minute_of_day <= 1440" }
      - { name: flexologist_buffer_minutes, type: integer, source: input, description: "Mandatory gap between consecutive sessions for the SAME flexologist; used by flexologist overlap rule.", default: 15, constraints: ">= 0" }
      - { name: no_show_fee_cents, type: integer, source: input, description: "Flat fee charged on a NO_SHOW booking at this location.", default: 5000, constraints: ">= 0" }
      - { name: late_cancel_pct, type: number, source: input, description: "Fraction of the booking list_price_cents charged on a LATE_CANCEL.", default: 0.50, constraints: "0..1" }
