              as_user_id: "${comms_id}"
          trigger:
            - call: "POST /crisis/media-interviews/${iv_id}/confirm"
              payload: { high_risk_answers_approved_count: 3 }
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "GET /crisis/team-members/${spox_id}"
              payload: {}
              as: CommsLead
              as_user_id: "${comms_id}"
            - call: "POST /crisis/media-interviews/${iv_id}/cancel"
              payload: { cancel_reason: "The outlet pulled the segment." }
              as: Spokesperson
              as_user_id: "${spox_id}"
          assert:
            - "before the trigger: TeamMember.${spox_id}.scheduled_interview_minutes == 0"
            - "after confirm: MediaInterview.${iv_id}.state == CONFIRMED"
            - "after confirm: TeamMember.${spox_id}.scheduled_interview_minutes == 60"
            - "after confirm: Incident.${inc_id}.confirmed_interview_count == 1"
            - "after cancel: MediaInterview.${iv_id}.state == CANCELLED"
            - "after cancel: MediaInterview.${iv_id}.cancel_reason == The outlet pulled the segment."
            - "after cancel: TeamMember.${spox_id}.scheduled_interview_minutes == 0"
            - "after cancel: Incident.${inc_id}.confirmed_interview_count == 0"
