          setup: ["A confirmable order whose version was advanced by a reorder call after the client last read it."]
          setup_api_calls:
            - call: "POST /shops"
              payload: { name: "S32", tax_rate_bps: 0, rush_surcharge_bps: 0, rush_cutoff_hour_utc: 23, standard_turnaround_days: 3, rush_turnaround_days: 1, daily_unit_capacity: 50 }
