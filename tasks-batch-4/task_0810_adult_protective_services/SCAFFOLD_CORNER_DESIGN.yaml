  - section: cross_cutting
    instances:
      - name: client_version_increments_on_capacity_determination
        claim_type: optimistic_concurrency
        grounds: [entities.Client.fields.version]
        distinguishing_aspect: "capacity-determination is a mutation: Client.version goes from 1 to 2 and every mutation increments it by one."
        test_recipe:
          setup: ["A freshly created Client (version 1)."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Xia Co", date_of_birth: "1948-01-01", address: "23 Way" }
              as: IntakeWorker
              captures: { cli: "$.data.id", v1: "$.data.version" }
          trigger:
            - call: "POST /clients/${cli}/capacity-determination"
              payload: { determination: "INTACT" }
              as: Caseworker
              captures: { v2: "$.data.version" }
          assert:
            - "Client.${cli}.version == 2"
            - "Client.${cli}.capacity_status == INTACT"

