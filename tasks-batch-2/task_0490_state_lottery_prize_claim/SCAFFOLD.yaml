scenario: "State Lottery & Prize Claim: retailer licensing & terminal, ticket validation & winning tier, prize claim (over-threshold) & ID/tax withholding, annuity vs cash option, retailer commission & settlement, second-chance drawing, responsible-gaming & self-exclusion, unclaimed-prize escheat"
domain_name: state-lottery-prize-claim
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions

  entity_topology: flat
  # Peer entities linked by foreign keys: Retailer, Terminal, Ticket, Player,
  # PrizeClaim, DrawingGame, SecondChanceDrawing, SecondChanceEntry,
  # CommissionSettlement, EscheatRecord. No deep URL nesting; FK references only.

  state_machine_shape: branching
  # PrizeClaim forks ADJUDICATING -> {APPROVED_CASH, APPROVED_ANNUITY} -> PAID
  # with divergent side-effect sets; Ticket has a parallel (validation × second-
  # chance) axis; Retailer license has a revert cycle (SUSPENDED -> ACTIVE).

  relationship_patterns:
    - one_to_many        # Retailer 1:N Terminal; DrawingGame 1:N Ticket
    - many_to_many       # Ticket N:M SecondChanceDrawing via SecondChanceEntry
    - cross_aggregate    # PrizeClaim -> Ticket -> Player; settlement -> retailer

  role_model: segregation_of_duties
  # A LotteryOfficer who adjudicates a claim cannot be the same officer who
  # disburses it; commission settlement cannot be approved by its preparer.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DrawingGame
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Game name, e.g. 'PowerDraw'."
      - name: game_type
        type: enum
        source: input
        description: "Game family."
        constraints: "one of {JACKPOT, INSTANT, DAILY}"
      - name: claim_window_days
        type: integer
        source: input
        description: "Days after ticket draw_date within which a winning ticket must be claimed before it escheats."
        constraints: "integer >= 1"
      - name: federal_withholding_threshold_cents
        type: integer
        source: input
        description: "Gross prize amount (in cents) at or above which federal tax withholding applies and an over-threshold claim is mandatory."
        default: 60000000
        constraints: "integer >= 0; example 600000 = $6,000"
      - name: federal_withholding_rate
        type: number
        source: input
        description: "Federal withholding fraction applied to the gross prize when the federal threshold is met."
        default: 0.24
        constraints: "0 <= rate < 1"
      - name: state_withholding_rate
        type: number
        source: input
        description: "State withholding fraction applied to the gross prize when the federal threshold is met."
        default: 0.05
        constraints: "0 <= rate < 1"
      - name: cash_option_factor
        type: number
        source: input
        description: "Multiplier converting an advertised annuity prize into its lump-sum cash value (cash_value = advertised * factor)."
        default: 0.60
        constraints: "0 < factor <= 1; applies to JACKPOT games"
      - name: annuity_years
        type: integer
        source: input
        description: "Number of annual installments an annuity payout is split across for JACKPOT games."
        default: 30
        constraints: "integer >= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the game configuration; set to ACTIVE at creation by system initialization (no close action in this version)."
        default: ACTIVE
        constraints: "one of {ACTIVE}"

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: "Legal business name."
      - name: tax_id
        type: string
        source: input
        description: "Retailer federal tax identifier; unique across retailers."
        constraints: "unique among Retailer.tax_id"
      - name: commission_rate
        type: number
        source: input
        description: "Fraction of gross sales the retailer earns as commission."
        default: 0.06
        constraints: "0 <= rate < 1"
      - name: cashing_bonus_rate
        type: number
        source: input
        description: "Fraction of the gross prize amount the retailer earns as a cashing bonus when it validates a low-tier winning ticket paid at the counter."
        default: 0.01
        constraints: "0 <= rate < 1"
      - name: license_status
        type: enum
        source: system
        description: "Retailer license lifecycle."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, REVOKED}"
      - name: commission_balance_cents
        type: integer
        source: computed
        description: "Live ledger of cashing bonuses accrued at counter but not yet reversed or settled. Credited +round_half_up(prize*cashing_bonus_rate) on each PAID_AT_COUNTER; debited the same amount on each COUNTER_REVERSED; debited net_settlement_cents when a settlement FINALIZES. Never goes negative."
        default: 0
      - name: lifetime_settled_cents
        type: integer
        source: computed
        description: "Cumulative commission paid out across all FINALIZED settlements for this retailer."
        default: 0

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer this terminal is provisioned to."
      - name: serial_number
        type: string
        source: input
        description: "Hardware serial; unique across terminals."
        constraints: "unique among Terminal.serial_number"
      - name: status
        type: enum
        source: system
        description: "Terminal provisioning lifecycle."
        default: PROVISIONED
        constraints: "one of {PROVISIONED, ACTIVE, DEACTIVATED}"
      - name: tickets_sold_count
        type: integer
        source: computed
        description: "Count of Ticket rows sold by this terminal."
        default: 0

  - name: Player
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Claimant full legal name."
      - name: government_id_number
        type: string
        source: input
        description: "Government ID on file; unique across players. Required for over-threshold claims."
        constraints: "unique among Player.government_id_number"
      - name: self_exclusion_status
        type: enum
        source: system
        description: "Responsible-gaming self-exclusion state."
        default: NONE
        constraints: "one of {NONE, EXCLUDED, REINSTATED}"
      - name: exclusion_until
        type: datetime
        source: system
        description: "ISO 8601 UTC instant at which an active self-exclusion expires; null when status is NONE or REINSTATED."
        default: null

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> DrawingGame.id; the game this ticket belongs to."
      - name: terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; the terminal that sold this ticket."
      - name: serial
        type: string
        source: input
        description: "Ticket serial code; unique across tickets."
        constraints: "unique among Ticket.serial"
      - name: price_cents
        type: integer
        source: input
        description: "Retail price paid for the ticket, in cents."
        constraints: "integer >= 1"
      - name: draw_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the ticket's draw occurred; claim deadline derives from this."
      - name: declared_tier
        type: integer
        source: input
        description: "Prize tier the ticket holder asserts on the printed ticket; 0 = non-winner, 1..9 = winning tier (1 is the jackpot tier)."
        constraints: "integer 0..9"
      - name: gross_prize_cents
        type: integer
        source: input
        description: "Advertised gross prize amount for the declared tier, in cents; 0 when declared_tier is 0."
        constraints: "integer >= 0"
      - name: validation_status
        type: enum
        source: system
        description: "Ticket validation lifecycle (independent axis from second_chance_status)."
        default: UNVALIDATED
        constraints: "one of {UNVALIDATED, VALIDATED_WINNER, VALIDATED_NONWINNER, PAID_AT_COUNTER, COUNTER_REVERSED, CLAIM_PENDING, REJECTED, ESCHEATED}"
      - name: second_chance_status
        type: enum
        source: system
        description: "Second-chance pool lifecycle (independent axis from validation_status)."
        default: INELIGIBLE
        constraints: "one of {INELIGIBLE, ELIGIBLE, ENTERED, DRAWN_WINNER, DRAWN_LOSER}"
      - name: claim_deadline
        type: datetime
        source: computed
        description: "draw_date + game.claim_window_days; after this the unclaimed winning ticket may be escheated."

  - name: PrizeClaim
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the winning ticket being claimed."
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the claimant."
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LotteryOfficer who adjudicated (approved/rejected) this claim; null until adjudicated."
        default: null
      - name: disbursed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LotteryOfficer who disbursed this claim; null until paid. MUST differ from adjudicated_by_user_id (segregation of duties)."
        default: null
      - name: payout_option
        type: enum
        source: input
        description: "Claimant's elected payout option."
        constraints: "one of {CASH, ANNUITY}; ANNUITY only permitted on JACKPOT games"
      - name: gross_payout_cents
        type: integer
        source: computed
        description: "Pre-tax payout basis: equals ticket.gross_prize_cents for CASH on non-jackpot; for JACKPOT CASH equals gross_prize_cents * game.cash_option_factor; for ANNUITY equals gross_prize_cents."
        default: 0
      - name: federal_withholding_cents
        type: integer
        source: computed
        description: "Federal tax withheld on this claim; 0 when below threshold."
        default: 0
      - name: state_withholding_cents
        type: integer
        source: computed
        description: "State tax withheld on this claim; 0 when below threshold."
        default: 0
      - name: net_payout_cents
        type: integer
        source: computed
        description: "Amount disbursed to the claimant after withholding (CASH) or first-installment net (ANNUITY)."
        default: 0
      - name: annual_installment_cents
        type: integer
        source: computed
        description: "Per-year annuity installment after withholding, for ANNUITY option; 0 for CASH."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Prize-claim lifecycle."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ADJUDICATING, APPROVED_CASH, APPROVED_ANNUITY, PAID, REJECTED, VOIDED}"

  - name: SecondChanceDrawing
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> DrawingGame.id; the game whose non-winning tickets feed this drawing."
      - name: entry_deadline
        type: datetime
        source: input
        description: "ISO 8601 UTC instant after which no further entries are accepted."
      - name: prize_pool_cents
        type: integer
        source: input
        description: "Total cash prize awarded to the drawn winner, in cents."
        constraints: "integer >= 1"
      - name: entry_count
        type: integer
        source: computed
        description: "Count of SecondChanceEntry rows for this drawing."
        default: 0
      - name: winning_entry_id
        type: string
        source: system
        description: "FK -> SecondChanceEntry.id; the entry selected when the drawing was run; null until run."
        default: null
      - name: status
        type: enum
        source: system
        description: "Second-chance drawing lifecycle."
        default: OPEN
        constraints: "one of {OPEN, DRAWN, CANCELLED}"

  - name: SecondChanceEntry
    parent: null
    common_fields: true
    fields:
      - name: drawing_id
        type: string
        source: input
        description: "FK -> SecondChanceDrawing.id; the drawing entered."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the non-winning ticket submitted as an entry."
      - name: entered_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the entry was created; used as the deterministic ordinal for winner selection."
      - name: outcome
        type: enum
        source: system
        description: "Entry result after the drawing is run."
        default: PENDING
        constraints: "one of {PENDING, WON, LOST}"

  - name: CommissionSettlement
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer being settled."
      - name: period_start
        type: datetime
        source: input
        description: "ISO 8601 UTC inclusive start of the settlement window."
      - name: period_end
        type: datetime
        source: input
        description: "ISO 8601 UTC exclusive end of the settlement window."
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LotteryOfficer who prepared (created) this settlement."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LotteryOfficer who approved this settlement; null until finalized. MUST differ from prepared_by_user_id (segregation of duties)."
        default: null
      - name: gross_commission_cents
        type: integer
        source: computed
        description: "Sum of sales commission + cashing bonuses accrued in the window, before any clawback netting."
        default: 0
      - name: clawback_cents
        type: integer
        source: computed
        description: "Total commission clawed back for tickets voided/rejected within the window."
        default: 0
      - name: net_settlement_cents
        type: integer
        source: computed
        description: "gross_commission_cents - clawback_cents, floored at 0; the amount actually paid to the retailer."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, VOIDED}"

  - name: EscheatRecord
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the winning ticket whose prize escheated to the state."
      - name: escheated_amount_cents
        type: integer
        source: computed
        description: "Gross prize amount transferred to the state's unclaimed-property fund."
        default: 0
      - name: escheated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant the escheat was recorded (logical clock value at sweep time)."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Retailer
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /retailers/{id}/license/activate"
        actor: LicensingAdmin
        preconditions:
          - "retailer.license_status == PENDING"
        side_effects:
          - "set license_status = ACTIVE"
          - "increments Retailer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /retailers/{id}/license/suspend"
        actor: LicensingAdmin
        preconditions:
          - "retailer.license_status == ACTIVE"
        side_effects:
          - "set license_status = SUSPENDED"
          - "cascade: every Terminal with retailer_id == this retailer and status == ACTIVE transitions ACTIVE -> DEACTIVATED (conditional cascade; PROVISIONED and already-DEACTIVATED terminals untouched)"
          - "increments Retailer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /retailers/{id}/license/activate"
        actor: LicensingAdmin
        preconditions:
          - "retailer.license_status == SUSPENDED"
        side_effects:
          - "set license_status = ACTIVE"
          - "note: deactivated terminals are NOT auto-reactivated; each must be re-activated explicitly"
          - "increments Retailer.version by 1"
        note: "revert cycle ACTIVE -> SUSPENDED -> ACTIVE"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /retailers/{id}/license/revoke"
        actor: LicensingAdmin
        preconditions:
          - "retailer.license_status == SUSPENDED"
        side_effects:
          - "set license_status = REVOKED"
          - "cascade: every Terminal with retailer_id == this retailer and status IN {PROVISIONED, ACTIVE} transitions to DEACTIVATED"
          - "increments Retailer.version by 1"

  - entity: Terminal
    initial_state: PROVISIONED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /terminals/{id}/activate"
        actor: LicensingAdmin
        preconditions:
          - "terminal.status == PROVISIONED"
          - "owning Retailer.license_status == ACTIVE (cross-entity guard)"
        side_effects:
          - "set status = ACTIVE"
          - "increments Terminal.version by 1"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /terminals/{id}/deactivate OR cascaded from Retailer suspend/revoke"
        actor: LicensingAdmin
        preconditions:
          - "terminal.status == ACTIVE"
        side_effects:
          - "set status = DEACTIVATED"
          - "increments Terminal.version by 1"
      - from: PROVISIONED
        to: DEACTIVATED
        trigger: "cascaded from Retailer revoke"
        actor: system
        preconditions:
          - "terminal.status == PROVISIONED"
        side_effects:
          - "set status = DEACTIVATED"
          - "increments Terminal.version by 1"

  - entity: Ticket
    initial_state: UNVALIDATED
    terminal_states: [REJECTED, ESCHEATED]
    transitions:
      - from: UNVALIDATED
        to: VALIDATED_NONWINNER
        trigger: "POST /tickets/{id}/validate (declared_tier == 0)"
        actor: TerminalOperator
        preconditions:
          - "ticket.validation_status == UNVALIDATED"
          - "ticket.declared_tier == 0"
          - "selling Terminal.status == ACTIVE (cross-entity guard)"
        side_effects:
          - "set validation_status = VALIDATED_NONWINNER"
          - "set second_chance_status = ELIGIBLE (a non-winning ticket becomes eligible for second-chance entry)"
          - "increments Ticket.version by 1"
      - from: UNVALIDATED
        to: VALIDATED_WINNER
        trigger: "POST /tickets/{id}/validate (declared_tier between 1 and 9, gross_prize_cents >= game.federal_withholding_threshold_cents)"
        actor: TerminalOperator
        preconditions:
          - "ticket.validation_status == UNVALIDATED"
          - "ticket.declared_tier between 1 and 9"
          - "ticket.gross_prize_cents >= game.federal_withholding_threshold_cents (over-threshold prizes are claimed centrally, never paid at counter)"
          - "selling Terminal.status == ACTIVE (cross-entity guard)"
          - "logical clock <= ticket.claim_deadline"
        side_effects:
          - "set validation_status = VALIDATED_WINNER"
          - "second_chance_status remains INELIGIBLE (winning tickets never enter second chance)"
          - "increments Ticket.version by 1"
      - from: UNVALIDATED
        to: PAID_AT_COUNTER
        trigger: "POST /tickets/{id}/validate (declared_tier between 1 and 9, gross_prize_cents < game.federal_withholding_threshold_cents)"
        actor: TerminalOperator
        preconditions:
          - "ticket.validation_status == UNVALIDATED"
          - "ticket.declared_tier between 1 and 9"
          - "ticket.gross_prize_cents < game.federal_withholding_threshold_cents (under-threshold prizes are paid at the counter immediately)"
          - "selling Terminal.status == ACTIVE (cross-entity guard)"
          - "logical clock <= ticket.claim_deadline"
        side_effects:
          - "set validation_status = PAID_AT_COUNTER"
          - "accrue cashing bonus: Retailer.commission_balance_cents += round_half_up(ticket.gross_prize_cents * retailer.cashing_bonus_rate) where retailer is the terminal's owner (ledger sync)"
          - "increments Ticket.version by 1"
      - from: PAID_AT_COUNTER
        to: COUNTER_REVERSED
        trigger: "POST /tickets/{id}/reverse-counter-pay"
        actor: LotteryOfficer
        preconditions:
          - "ticket.validation_status == PAID_AT_COUNTER"
        side_effects:
          - "set validation_status = COUNTER_REVERSED"
          - "compensation: Retailer.commission_balance_cents -= round_half_up(ticket.gross_prize_cents * retailer.cashing_bonus_rate), floored at 0 (debit the exact bonus credited at counter-pay; ledger sync)"
          - "increments Ticket.version by 1"
        note: "reverses an erroneous/expired counter-pay; the bonus credited at PAID_AT_COUNTER is clawed back from the live balance and, within a settlement window, also feeds CommissionSettlement.clawback_cents"
      - from: VALIDATED_WINNER
        to: CLAIM_PENDING
        trigger: "POST /prize-claims (creates a PrizeClaim against this ticket)"
        actor: ClaimsClerk
        preconditions:
          - "ticket.validation_status == VALIDATED_WINNER"
        side_effects:
          - "set validation_status = CLAIM_PENDING"
          - "increments Ticket.version by 1"
      - from: CLAIM_PENDING
        to: VALIDATED_WINNER
        trigger: "cascaded from PrizeClaim rejection or void"
        actor: system
        preconditions:
          - "ticket.validation_status == CLAIM_PENDING"
        side_effects:
          - "set validation_status = VALIDATED_WINNER (ticket returns to claimable; compensation for a rejected/voided claim)"
          - "increments Ticket.version by 1"
      - from: VALIDATED_WINNER
        to: ESCHEATED
        trigger: "POST /_clock/run_escheat_sweep (system sweep when logical clock > ticket.claim_deadline)"
        actor: system
        preconditions:
          - "ticket.validation_status == VALIDATED_WINNER"
          - "logical clock > ticket.claim_deadline"
        side_effects:
          - "set validation_status = ESCHEATED"
          - "create EscheatRecord with escheated_amount_cents = ticket.gross_prize_cents"
          - "increments Ticket.version by 1"
      - from: UNVALIDATED
        to: REJECTED
        trigger: "POST /tickets/{id}/validate when logical clock > ticket.claim_deadline"
        actor: TerminalOperator
        preconditions:
          - "ticket.validation_status == UNVALIDATED"
          - "logical clock > ticket.claim_deadline"
        side_effects:
          - "set validation_status = REJECTED (expired ticket cannot be validated)"
          - "increments Ticket.version by 1"

  - entity: PrizeClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATING
        trigger: "POST /prize-claims/{id}/begin-adjudication"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == SUBMITTED"
          - "claimant Player.self_exclusion_status != EXCLUDED (cross-entity guard; an excluded player cannot proceed to adjudication)"
        side_effects:
          - "set status = ADJUDICATING"
          - "record adjudicated_by_user_id = X-User-ID"
          - "increments PrizeClaim.version by 1"
      - from: ADJUDICATING
        to: APPROVED_CASH
        trigger: "POST /prize-claims/{id}/approve (claim.payout_option == CASH)"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == ADJUDICATING"
          - "claim.payout_option == CASH"
          - "acting X-User-ID == claim.adjudicated_by_user_id (only the adjudicating officer approves)"
        side_effects:
          - "set status = APPROVED_CASH"
          - "compute gross_payout_cents, federal_withholding_cents, state_withholding_cents, net_payout_cents via prize_payout_calc (CASH branch)"
          - "annual_installment_cents stays 0"
          - "increments PrizeClaim.version by 1"
      - from: ADJUDICATING
        to: APPROVED_ANNUITY
        trigger: "POST /prize-claims/{id}/approve (claim.payout_option == ANNUITY)"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == ADJUDICATING"
          - "claim.payout_option == ANNUITY"
          - "ticket's DrawingGame.game_type == JACKPOT (annuity only on jackpot games)"
          - "acting X-User-ID == claim.adjudicated_by_user_id"
        side_effects:
          - "set status = APPROVED_ANNUITY"
          - "compute gross_payout_cents, federal_withholding_cents, state_withholding_cents, net_payout_cents, annual_installment_cents via prize_payout_calc (ANNUITY branch)"
          - "increments PrizeClaim.version by 1"
      - from: ADJUDICATING
        to: REJECTED
        trigger: "POST /prize-claims/{id}/reject"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == ADJUDICATING"
          - "acting X-User-ID == claim.adjudicated_by_user_id"
        side_effects:
          - "set status = REJECTED"
          - "cascade: ticket.validation_status CLAIM_PENDING -> VALIDATED_WINNER (ticket returns to claimable)"
          - "increments PrizeClaim.version by 1"
      - from: APPROVED_CASH
        to: PAID
        trigger: "POST /prize-claims/{id}/disburse"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == APPROVED_CASH"
          - "acting X-User-ID != claim.adjudicated_by_user_id (segregation of duties: disburser must differ from adjudicator)"
        side_effects:
          - "set status = PAID"
          - "record disbursed_by_user_id = X-User-ID"
          - "cascade: ticket.validation_status CLAIM_PENDING -> PAID_AT_COUNTER? NO — set ticket.validation_status = CLAIM_PENDING remains terminal-for-claim; ticket stays CLAIM_PENDING (claimed)"
          - "increments PrizeClaim.version by 1"
        note: "ticket remains CLAIM_PENDING after a paid claim; it is neither re-claimable nor escheatable"
      - from: APPROVED_ANNUITY
        to: PAID
        trigger: "POST /prize-claims/{id}/disburse"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == APPROVED_ANNUITY"
          - "acting X-User-ID != claim.adjudicated_by_user_id (segregation of duties)"
        side_effects:
          - "set status = PAID"
          - "record disbursed_by_user_id = X-User-ID"
          - "increments PrizeClaim.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /prize-claims/{id}/void"
        actor: LotteryOfficer
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "set status = VOIDED"
          - "cascade: ticket.validation_status CLAIM_PENDING -> VALIDATED_WINNER"
          - "increments PrizeClaim.version by 1"

  - entity: SecondChanceDrawing
    initial_state: OPEN
    terminal_states: [DRAWN, CANCELLED]
    transitions:
      - from: OPEN
        to: DRAWN
        trigger: "POST /second-chance-drawings/{id}/run"
        actor: LotteryOfficer
        preconditions:
          - "drawing.status == OPEN"
          - "logical clock > drawing.entry_deadline (cannot draw before entries close)"
          - "drawing.entry_count >= 1 (cannot draw an empty pool)"
        side_effects:
          - "select winning entry: among SecondChanceEntry rows for this drawing, pick the entry with the EARLIEST entered_at; tie-break by SecondChanceEntry.created_at ASC (deterministic; never id)"
          - "set winning_entry_id = selected entry id; set status = DRAWN"
          - "cascade: selected entry.outcome = WON; its ticket.second_chance_status ENTERED -> DRAWN_WINNER"
          - "cascade: every other entry.outcome = LOST; each such ticket.second_chance_status ENTERED -> DRAWN_LOSER"
          - "increments SecondChanceDrawing.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /second-chance-drawings/{id}/cancel"
        actor: LotteryOfficer
        preconditions:
          - "drawing.status == OPEN"
        side_effects:
          - "set status = CANCELLED"
          - "cascade: every entry.outcome stays PENDING; each entered ticket.second_chance_status ENTERED -> ELIGIBLE (entries released back to eligible)"
          - "increments SecondChanceDrawing.version by 1"

  - entity: CommissionSettlement
    initial_state: DRAFT
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /commission-settlements/{id}/finalize"
        actor: LotteryOfficer
        preconditions:
          - "settlement.status == DRAFT"
          - "acting X-User-ID != settlement.prepared_by_user_id (segregation of duties: approver differs from preparer)"
        side_effects:
          - "set status = FINALIZED; record approved_by_user_id = X-User-ID"
          - "ledger sync: Retailer.commission_balance_cents -= settlement.net_settlement_cents; Retailer.lifetime_settled_cents += settlement.net_settlement_cents"
          - "increments CommissionSettlement.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /commission-settlements/{id}/void"
        actor: LotteryOfficer
        preconditions:
          - "settlement.status == DRAFT"
        side_effects:
          - "set status = VOIDED (no ledger movement; a draft that is voided never debited the balance)"
          - "increments CommissionSettlement.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: settlement-create-stale-retailer
    parent_entity: Retailer
    write_endpoint: "POST /commission-settlements"
    occ_field: "expected_retailer_version"
    description: |
      Creating a CommissionSettlement snapshots the retailer's accrued
      commission_balance_cents into gross/clawback/net at creation time. If the
      retailer's version has advanced since the client last observed it — because
      another writer already created a settlement that consumed the same accrued
      window, or a counter-pay accrued additional balance — the snapshot the
      current writer is about to take is stale and the create is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: drawing-run-stale-drawing
    parent_entity: SecondChanceDrawing
    write_endpoint: "POST /second-chance-drawings/{id}/run"
    occ_field: "expected_drawing_version"
    description: |
      Running a SecondChanceDrawing selects a winner over the entry set the
      client last observed. If the drawing's version has advanced since then —
      because an entry was added or the drawing was already run — the client's
      view of the candidate pool is stale and the run is rejected so it cannot
      select a winner over an outdated entry set.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prize_payout_calc
    trigger: "PrizeClaim ADJUDICATING -> APPROVED_CASH or APPROVED_ANNUITY (approve transition)"
    algorithm: threshold
    formula: |
      # Inputs: ticket.gross_prize_cents (G), game.game_type, payout_option,
      #         game.cash_option_factor (F), game.annuity_years (Y),
      #         game.federal_withholding_threshold_cents (T),
      #         game.federal_withholding_rate (rf), game.state_withholding_rate (rs)
      #
      # STEP 1 — gross_payout_cents (the taxable basis):
      if payout_option == CASH:
          if game.game_type == JACKPOT:
              gross_payout_cents = round_half_up(G * F)     # lump-sum cash value
          else:
              gross_payout_cents = G
      else:  # ANNUITY (JACKPOT only)
          gross_payout_cents = G                            # full advertised annuity basis
      #
      # STEP 2 — withholding (threshold gate on the ADVERTISED gross G, not on gross_payout):
      if G >= T:
          federal_withholding_cents = round_half_up(gross_payout_cents * rf)
          state_withholding_cents   = round_half_up(gross_payout_cents * rs)
      else:
          federal_withholding_cents = 0
          state_withholding_cents   = 0
      #
      # STEP 3 — net (rounding order is PINNED: withhold per-component on the
      #          full gross_payout, sum the two withholdings, then subtract once):
      total_withheld = federal_withholding_cents + state_withholding_cents
      net_payout_cents = gross_payout_cents - total_withheld
      #
      # STEP 4 — annuity installment (ANNUITY only; integer division floor,
      #          remainder rides in installment 1 but installment field stores
      #          the floored per-year value):
      if payout_option == ANNUITY:
          annual_installment_cents = floor(net_payout_cents / Y)
      else:
          annual_installment_cents = 0
    input_set: "Exactly one PrizeClaim and its linked Ticket + DrawingGame; no aggregation across rows."
    constants:
      DEFAULT_FEDERAL_RATE: 0.24
      DEFAULT_STATE_RATE: 0.05
    precision: "all monetary fields are integer cents; round_half_up applied at each multiplication BEFORE summing; floor for annuity division"
    variants:
      - name: cash_jackpot
        when: "payout_option == CASH and game_type == JACKPOT"
        difference: "gross_payout = round_half_up(G * cash_option_factor); withholding computed on the discounted lump sum, NOT on advertised G"
      - name: cash_nonjackpot
        when: "payout_option == CASH and game_type != JACKPOT"
        difference: "gross_payout = G exactly; cash_option_factor never applied"
      - name: annuity_jackpot
        when: "payout_option == ANNUITY"
        difference: "gross_payout = full advertised G (factor NOT applied); net then divided by annuity_years with floor; remainder is NOT redistributed into the stored annual_installment_cents"

  - name: retailer_commission_settlement
    trigger: "POST /commission-settlements (settlement creation snapshots the window)"
    algorithm: aggregation
    formula: |
      # Window: [period_start, period_end) — half-open; period_start inclusive,
      # period_end exclusive. Source: Tickets sold by terminals owned by this
      # retailer whose created_at falls in the window.
      #
      # window-tickets = Tickets whose terminal is owned by this retailer AND
      #                  whose created_at is in [period_start, period_end).
      #                  ALL window-tickets (any validation_status) enter the
      #                  sales-commission base — they were all sold.
      #
      # gross_commission_cents =
      #     round_half_up( SUM(ticket.price_cents) over ALL window-tickets * retailer.commission_rate )
      #   + SUM( round_half_up(ticket.gross_prize_cents * retailer.cashing_bonus_rate)
      #          for window-tickets whose validation_status == PAID_AT_COUNTER )
      #   # NOTE rounding ORDER is PINNED: sales commission rounds ONCE on the
      #   # summed price base (sum-then-round); cashing bonus rounds PER-TICKET
      #   # then sums (round-then-sum). The two halves use different orders by design.
      #
      # clawback_cents =
      #     SUM( round_half_up(ticket.gross_prize_cents * retailer.cashing_bonus_rate) )
      #     for window-tickets whose validation_status == COUNTER_REVERSED
      #     (a counter-pay reversed within the window claws back the bonus accrued)
      #
      # net_settlement_cents = max(0, gross_commission_cents - clawback_cents)
      gross_commission_cents = ...
      clawback_cents = ...
      net_settlement_cents = max(0, gross_commission_cents - clawback_cents)
    input_set: "Tickets with terminal owned by retailer_id and created_at in [period_start, period_end); ALL count toward sales base, PAID_AT_COUNTER add bonus, COUNTER_REVERSED add clawback."
    constants:
      MIN_NET: 0
    precision: "integer cents; sales-commission half rounds once on summed base (sum-then-round); cashing-bonus half rounds per-ticket then sums (round-then-sum)"
    variants:
      - name: gross_includes_counter_bonus
        when: "window contains PAID_AT_COUNTER tickets"
        difference: "cashing bonuses are added to sales commission using round-per-ticket-then-sum order"
      - name: net_floored_at_zero
        when: "COUNTER_REVERSED clawback exceeds gross commission in the window"
        difference: "net_settlement_cents floors at 0; a retailer is never billed a negative settlement"

  - name: ticket_claim_deadline
    trigger: "Ticket creation (POST /tickets) and on any read of claim_deadline"
    algorithm: threshold
    formula: |
      # claim_deadline = draw_date + game.claim_window_days days (exact 24h*days).
      # Escheat eligibility uses STRICT inequality: a winning ticket escheats only
      # when logical_clock > claim_deadline. At logical_clock == claim_deadline the
      # ticket is STILL claimable (boundary is inclusive of the deadline instant).
      claim_deadline = draw_date + timedelta(days=game.claim_window_days)
      escheatable = (logical_clock > claim_deadline)
    input_set: "Single Ticket and its DrawingGame."
    constants:
      HOURS_PER_DAY: 24
    precision: "datetime arithmetic in UTC; comparison is strict > for escheat, <= for still-claimable"
    variants:
      - name: boundary_inclusive_claimable
        when: "logical_clock == claim_deadline exactly"
        difference: "ticket remains claimable; escheat requires strictly-after"

  - name: self_exclusion_window
    trigger: "POST /players/{id}/self-exclude and on adjudication guard checks"
    algorithm: threshold
    formula: |
      # exclusion_until = enrollment_clock + exclusion_days * 24h.
      # A player is treated as EXCLUDED for guard purposes when
      #   self_exclusion_status == EXCLUDED AND logical_clock < exclusion_until.
      # At logical_clock >= exclusion_until the exclusion has lapsed and a
      # reinstatement is permitted (status flips to REINSTATED on the reinstate call).
      exclusion_until = enrollment_clock + timedelta(days=exclusion_days)
      is_excluded_now = (status == EXCLUDED) and (logical_clock < exclusion_until)
    input_set: "Single Player."
    constants:
      MIN_EXCLUSION_DAYS: 1
    precision: "UTC datetime; EXCLUDED window is [enrollment_clock, exclusion_until) — half-open, end exclusive"
    variants:
      - name: active_exclusion_blocks
        when: "logical_clock < exclusion_until"
        difference: "claims for this player cannot enter adjudication"
      - name: lapsed_exclusion_allows_reinstate
        when: "logical_clock >= exclusion_until"
        difference: "self-exclusion has expired; reinstate permitted, future claims allowed"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /players and POST /tickets and POST /retailers (public-ish creates still require headers — see roles)"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: business_referential
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /commission-settlements, POST /second-chance-drawings/{id}/run"
  - priority: 6
    category: business_safety
    check: "Claimant Player is not under an active self-exclusion when a claim begins adjudication"
    error_id: ERR_PLAYER_SELF_EXCLUDED
    http_status: 409
    applies_to: "POST /prize-claims/{id}/begin-adjudication"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: disburser X-User-ID differs from the claim's adjudicated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /prize-claims/{id}/disburse"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: settlement approver X-User-ID differs from prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /commission-settlements/{id}/finalize"
  - priority: 9
    category: business_constraint
    check: "ANNUITY payout option only permitted when the ticket's game_type == JACKPOT"
    error_id: ERR_ANNUITY_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /prize-claims (payout_option == ANNUITY), POST /prize-claims/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "An over-threshold prize claim requires the linked Player to carry a non-empty government_id_number on file"
    error_id: ERR_ID_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /prize-claims"
  - priority: 11
    category: business_temporal
    check: "Ticket's claim_deadline has not strictly passed when validating/claiming a winner"
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /prize-claims, POST /tickets/{id}/validate (winner branches)"
  - priority: 12
    category: business_constraint
    check: "Second-chance entry: ticket.second_chance_status == ELIGIBLE and drawing.status == OPEN and logical clock <= drawing.entry_deadline"
    error_id: ERR_ENTRY_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /second-chance-entries"
  - priority: 13
    category: business_temporal
    check: "Second-chance drawing run requires logical clock > entry_deadline"
    error_id: ERR_DRAWING_NOT_CLOSED
    http_status: 409
    applies_to: "POST /second-chance-drawings/{id}/run"
  - priority: 14
    category: business_constraint
    check: "Second-chance drawing run requires entry_count >= 1 (non-empty pool)"
    error_id: ERR_EMPTY_DRAWING_POOL
    http_status: 409
    applies_to: "POST /second-chance-drawings/{id}/run"
  - priority: 15
    category: business_constraint
    check: "Terminal activation requires the owning Retailer.license_status == ACTIVE"
    error_id: ERR_RETAILER_NOT_LICENSED
    http_status: 409
    applies_to: "POST /terminals/{id}/activate, POST /tickets (ticket sale via terminal)"
  - priority: 16
    category: business_constraint
    check: "A Ticket may only be sold (created) by a Terminal whose status == ACTIVE"
    error_id: ERR_TERMINAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /tickets, POST /tickets/{id}/validate"
  - priority: 17
    category: business_constraint
    check: "Uniqueness: Retailer.tax_id, Terminal.serial_number, Ticket.serial, Player.government_id_number each unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /retailers, POST /terminals, POST /tickets, POST /players"
  - priority: 18
    category: business_constraint
    check: "Required-field & type/enum/range validation on request body"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all creates and updates"
  - priority: 19
    category: business_constraint
    check: "A PrizeClaim can only be created against a Ticket whose validation_status == VALIDATED_WINNER"
    error_id: ERR_TICKET_NOT_CLAIMABLE
    http_status: 409
    applies_to: "POST /prize-claims"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- DrawingGame ----
  - method: POST
    path: "/games"
    description: "Create a drawing game configuration."
    roles: [LotteryOfficer]
    code: 201
    input: [name, game_type, claim_window_days, "federal_withholding_threshold_cents?", "federal_withholding_rate?", "state_withholding_rate?", "cash_option_factor?", "annuity_years?"]
    output: DrawingGame
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/games/{id}"
    description: "Fetch a game by id."
    roles: [LotteryOfficer, LicensingAdmin, ClaimsClerk, TerminalOperator]
    code: 200
    input: []
    output: DrawingGame
    side_effects: []
  - method: GET
    path: "/games"
    description: "List games."
    roles: [LotteryOfficer, LicensingAdmin, ClaimsClerk, TerminalOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DrawingGame[]
    side_effects: []

  # ---- Retailer ----
  - method: POST
    path: "/retailers"
    description: "Register a retailer (starts PENDING)."
    roles: [LicensingAdmin]
    code: 201
    input: [business_name, tax_id, "commission_rate?", "cashing_bonus_rate?"]
    output: Retailer
    side_effects: ["license_status defaults PENDING"]
  - method: GET
    path: "/retailers/{id}"
    description: "Fetch a retailer (includes computed commission_balance_cents, lifetime_settled_cents)."
    roles: [LotteryOfficer, LicensingAdmin]
    code: 200
    input: []
    output: Retailer
    side_effects: []
  - method: GET
    path: "/retailers"
    description: "List retailers."
    roles: [LotteryOfficer, LicensingAdmin]
    code: 200
    input: ["license_status?", "limit?", "offset?"]
    output: Retailer[]
    side_effects: []
  - method: POST
    path: "/retailers/{id}/license/activate"
    description: "Activate a PENDING or SUSPENDED retailer license."
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Retailer
    side_effects: ["PENDING|SUSPENDED -> ACTIVE per state machine"]
  - method: POST
    path: "/retailers/{id}/license/suspend"
    description: "Suspend an ACTIVE retailer license; cascades terminal deactivation."
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Retailer
    side_effects: ["ACTIVE -> SUSPENDED; cascade ACTIVE terminals -> DEACTIVATED"]
  - method: POST
    path: "/retailers/{id}/license/revoke"
    description: "Revoke a SUSPENDED retailer license; cascades terminal deactivation."
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Retailer
    side_effects: ["SUSPENDED -> REVOKED; cascade PROVISIONED|ACTIVE terminals -> DEACTIVATED"]

  # ---- Terminal ----
  - method: POST
    path: "/terminals"
    description: "Provision a terminal to a retailer (starts PROVISIONED)."
    roles: [LicensingAdmin]
    code: 201
    input: [retailer_id, serial_number]
    output: Terminal
    side_effects: ["status defaults PROVISIONED"]
  - method: GET
    path: "/terminals/{id}"
    description: "Fetch a terminal."
    roles: [LotteryOfficer, LicensingAdmin, TerminalOperator]
    code: 200
    input: []
    output: Terminal
    side_effects: []
  - method: GET
    path: "/terminals"
    description: "List terminals; filter by retailer_id (FK reverse-reachability for Terminal.retailer_id)."
    roles: [LotteryOfficer, LicensingAdmin, TerminalOperator]
    code: 200
    input: ["retailer_id?", "status?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []
  - method: POST
    path: "/terminals/{id}/activate"
    description: "Activate a PROVISIONED terminal (requires retailer ACTIVE)."
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Terminal
    side_effects: ["PROVISIONED -> ACTIVE"]
  - method: POST
    path: "/terminals/{id}/deactivate"
    description: "Deactivate an ACTIVE terminal."
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Terminal
    side_effects: ["ACTIVE -> DEACTIVATED"]

  # ---- Player ----
  - method: POST
    path: "/players"
    description: "Register a player/claimant."
    roles: [ClaimsClerk]
    code: 201
    input: [full_name, government_id_number]
    output: Player
    side_effects: ["self_exclusion_status defaults NONE"]
  - method: GET
    path: "/players/{id}"
    description: "Fetch a player."
    roles: [LotteryOfficer, ClaimsClerk]
    code: 200
    input: []
    output: Player
    side_effects: []
  - method: POST
    path: "/players/{id}/self-exclude"
    description: "Enroll a player in self-exclusion for exclusion_days from the current logical clock."
    roles: [ClaimsClerk, LotteryOfficer]
    code: 200
    input: [exclusion_days]
    output: Player
    side_effects: ["self_exclusion_status -> EXCLUDED; set exclusion_until = clock + exclusion_days"]
  - method: POST
    path: "/players/{id}/reinstate"
    description: "Reinstate a player whose self-exclusion has lapsed (clock >= exclusion_until)."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: Player
    side_effects: ["self_exclusion_status EXCLUDED -> REINSTATED; clear exclusion_until"]

  # ---- Ticket ----
  - method: POST
    path: "/tickets"
    description: "Sell (create) a ticket via an ACTIVE terminal."
    roles: [TerminalOperator]
    code: 201
    input: [game_id, terminal_id, serial, price_cents, draw_date, declared_tier, gross_prize_cents]
    output: Ticket
    side_effects: ["validation_status defaults UNVALIDATED; second_chance_status defaults INELIGIBLE; compute claim_deadline; increments Terminal.tickets_sold_count"]
  - method: GET
    path: "/tickets/{id}"
    description: "Fetch a ticket (includes computed claim_deadline)."
    roles: [LotteryOfficer, ClaimsClerk, TerminalOperator]
    code: 200
    input: []
    output: Ticket
    side_effects: []
  - method: GET
    path: "/tickets"
    description: "List tickets; filter by game_id (FK reverse-reachability for Ticket.game_id) and terminal_id (FK reverse-reachability for Ticket.terminal_id)."
    roles: [LotteryOfficer, ClaimsClerk, TerminalOperator]
    code: 200
    input: ["game_id?", "terminal_id?", "validation_status?", "second_chance_status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []
  - method: POST
    path: "/tickets/{id}/validate"
    description: "Validate a ticket; routes to nonwinner / counter-pay / over-threshold winner / rejected by tier+threshold+deadline."
    roles: [TerminalOperator]
    code: 200
    input: []
    output: Ticket
    side_effects: ["transition per Ticket state machine; counter-pay accrues cashing bonus; nonwinner becomes second-chance ELIGIBLE"]
  - method: POST
    path: "/tickets/{id}/reverse-counter-pay"
    description: "Reverse an erroneous/expired counter-pay on a PAID_AT_COUNTER ticket; debits the cashing bonus from the retailer's live balance."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: Ticket
    side_effects: ["PAID_AT_COUNTER -> COUNTER_REVERSED; debit retailer.commission_balance_cents by the bonus (floored at 0)"]

  # ---- PrizeClaim ----
  - method: POST
    path: "/prize-claims"
    description: "Open an over-threshold prize claim against a VALIDATED_WINNER ticket."
    roles: [ClaimsClerk]
    code: 201
    input: [ticket_id, player_id, payout_option]
    output: PrizeClaim
    side_effects: ["status SUBMITTED; ticket VALIDATED_WINNER -> CLAIM_PENDING"]
  - method: GET
    path: "/prize-claims/{id}"
    description: "Fetch a prize claim (includes computed withholding & net fields)."
    roles: [LotteryOfficer, ClaimsClerk]
    code: 200
    input: []
    output: PrizeClaim
    side_effects: []
  - method: GET
    path: "/prize-claims"
    description: "List prize claims; filter by ticket_id (FK reverse-reachability for PrizeClaim.ticket_id) and player_id (FK reverse-reachability for PrizeClaim.player_id)."
    roles: [LotteryOfficer, ClaimsClerk]
    code: 200
    input: ["ticket_id?", "player_id?", "status?", "limit?", "offset?"]
    output: PrizeClaim[]
    side_effects: []
  - method: POST
    path: "/prize-claims/{id}/begin-adjudication"
    description: "Move a SUBMITTED claim to ADJUDICATING; records adjudicating officer."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: PrizeClaim
    side_effects: ["SUBMITTED -> ADJUDICATING; record adjudicated_by_user_id; self-exclusion guard"]
  - method: POST
    path: "/prize-claims/{id}/approve"
    description: "Approve an ADJUDICATING claim; computes payout/withholding; forks CASH vs ANNUITY."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: PrizeClaim
    side_effects: ["ADJUDICATING -> APPROVED_CASH|APPROVED_ANNUITY; run prize_payout_calc"]
  - method: POST
    path: "/prize-claims/{id}/reject"
    description: "Reject an ADJUDICATING claim; returns ticket to claimable."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: PrizeClaim
    side_effects: ["ADJUDICATING -> REJECTED; cascade ticket CLAIM_PENDING -> VALIDATED_WINNER"]
  - method: POST
    path: "/prize-claims/{id}/disburse"
    description: "Disburse an approved claim; enforces segregation of duties vs adjudicator."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: PrizeClaim
    side_effects: ["APPROVED_CASH|APPROVED_ANNUITY -> PAID; record disbursed_by_user_id"]
  - method: POST
    path: "/prize-claims/{id}/void"
    description: "Void a SUBMITTED claim; returns ticket to claimable."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: PrizeClaim
    side_effects: ["SUBMITTED -> VOIDED; cascade ticket CLAIM_PENDING -> VALIDATED_WINNER"]

  # ---- SecondChanceDrawing ----
  - method: POST
    path: "/second-chance-drawings"
    description: "Create a second-chance drawing for a game."
    roles: [LotteryOfficer]
    code: 201
    input: [game_id, entry_deadline, prize_pool_cents]
    output: SecondChanceDrawing
    side_effects: ["status defaults OPEN"]
  - method: GET
    path: "/second-chance-drawings/{id}"
    description: "Fetch a drawing (includes computed entry_count, winning_entry_id)."
    roles: [LotteryOfficer, ClaimsClerk, TerminalOperator]
    code: 200
    input: []
    output: SecondChanceDrawing
    side_effects: []
  - method: GET
    path: "/second-chance-drawings"
    description: "List drawings; filter by game_id (FK reverse-reachability for SecondChanceDrawing.game_id) and winning_entry_id (FK reverse-reachability for SecondChanceDrawing.winning_entry_id)."
    roles: [LotteryOfficer, ClaimsClerk, TerminalOperator]
    code: 200
    input: ["game_id?", "winning_entry_id?", "status?", "limit?", "offset?"]
    output: SecondChanceDrawing[]
    side_effects: []
  - method: POST
    path: "/second-chance-drawings/{id}/run"
    description: "Run a closed drawing; selects earliest-entered winner with OCC on the drawing."
    roles: [LotteryOfficer]
    code: 200
    input: [expected_drawing_version]
    output: SecondChanceDrawing
    side_effects: ["OPEN -> DRAWN; select winner; cascade entry outcomes & ticket second_chance_status; increments SecondChanceDrawing.version"]
  - method: POST
    path: "/second-chance-drawings/{id}/cancel"
    description: "Cancel an OPEN drawing; releases entries back to ELIGIBLE."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: SecondChanceDrawing
    side_effects: ["OPEN -> CANCELLED; cascade entered tickets -> ELIGIBLE"]

  # ---- SecondChanceEntry ----
  - method: POST
    path: "/second-chance-entries"
    description: "Enter an ELIGIBLE non-winning ticket into an OPEN drawing."
    roles: [TerminalOperator, ClaimsClerk]
    code: 201
    input: [drawing_id, ticket_id]
    output: SecondChanceEntry
    side_effects: ["entry created PENDING; ticket second_chance_status ELIGIBLE -> ENTERED; increments SecondChanceDrawing.entry_count"]
  - method: GET
    path: "/second-chance-entries/{id}"
    description: "Fetch a single entry."
    roles: [LotteryOfficer, ClaimsClerk, TerminalOperator]
    code: 200
    input: []
    output: SecondChanceEntry
    side_effects: []
  - method: GET
    path: "/second-chance-entries"
    description: "List entries; filter by drawing_id (FK reverse-reachability for SecondChanceEntry.drawing_id) and ticket_id (FK reverse-reachability for SecondChanceEntry.ticket_id)."
    roles: [LotteryOfficer, ClaimsClerk, TerminalOperator]
    code: 200
    input: ["drawing_id?", "ticket_id?", "outcome?", "limit?", "offset?"]
    output: SecondChanceEntry[]
    side_effects: []

  # ---- CommissionSettlement ----
  - method: POST
    path: "/commission-settlements"
    description: "Prepare (snapshot) a settlement for a retailer window; computes gross/clawback/net via OCC on the retailer."
    roles: [LotteryOfficer]
    code: 201
    input: [retailer_id, period_start, period_end, expected_retailer_version]
    output: CommissionSettlement
    side_effects: ["status DRAFT; run retailer_commission_settlement; record prepared_by_user_id; increments Retailer.version"]
  - method: GET
    path: "/commission-settlements/{id}"
    description: "Fetch a settlement (includes computed gross/clawback/net)."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: CommissionSettlement
    side_effects: []
  - method: GET
    path: "/commission-settlements"
    description: "List settlements; filter by retailer_id (FK reverse-reachability for CommissionSettlement.retailer_id)."
    roles: [LotteryOfficer]
    code: 200
    input: ["retailer_id?", "status?", "limit?", "offset?"]
    output: CommissionSettlement[]
    side_effects: []
  - method: POST
    path: "/commission-settlements/{id}/finalize"
    description: "Finalize a DRAFT settlement; segregation-of-duties vs preparer; debits retailer ledger."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: CommissionSettlement
    side_effects: ["DRAFT -> FINALIZED; record approved_by_user_id; ledger debit; bump lifetime_settled_cents"]
  - method: POST
    path: "/commission-settlements/{id}/void"
    description: "Void a DRAFT settlement (no ledger movement)."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: CommissionSettlement
    side_effects: ["DRAFT -> VOIDED"]

  # ---- EscheatRecord ----
  - method: GET
    path: "/escheat-records/{id}"
    description: "Fetch an escheat record."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: EscheatRecord
    side_effects: []
  - method: GET
    path: "/escheat-records"
    description: "List escheat records; filter by ticket_id (FK reverse-reachability for EscheatRecord.ticket_id)."
    roles: [LotteryOfficer]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: EscheatRecord[]
    side_effects: []

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/window comparisons read this clock."
    roles: [LotteryOfficer, LicensingAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/rewound to the given instant"]
  - method: POST
    path: "/_clock/run_escheat_sweep"
    description: "Run the unclaimed-prize escheat sweep: every VALIDATED_WINNER ticket whose claim_deadline is strictly before the current logical clock transitions to ESCHEATED and gets an EscheatRecord."
    roles: [LotteryOfficer]
    code: 200
    input: []
    output: "{ escheated_count: integer, escheated_ticket_ids: string[] }"
    side_effects: ["sweep tickets -> ESCHEATED; create EscheatRecord rows"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint per RBAC."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path id or FK body field) does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state from which the requested transition is defined."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not equal the parent's current version."
  - id: ERR_PLAYER_SELF_EXCLUDED
    http: 409
    condition: "Claimant player is under an active self-exclusion at adjudication."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "Same X-User-ID would perform two duties required to be separated (adjudicate+disburse, or prepare+approve)."
  - id: ERR_ANNUITY_NOT_ALLOWED
    http: 422
    condition: "ANNUITY payout option chosen on a non-JACKPOT game."
  - id: ERR_ID_VERIFICATION_REQUIRED
    http: 422
    condition: "Over-threshold claim's player lacks a government_id_number on file."
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 409
    condition: "Ticket claim_deadline has strictly passed at claim/winner-validate time."
  - id: ERR_ENTRY_NOT_ELIGIBLE
    http: 409
    condition: "Second-chance entry attempted with a ticket not ELIGIBLE, a non-OPEN drawing, or after entry_deadline."
  - id: ERR_DRAWING_NOT_CLOSED
    http: 409
    condition: "Drawing run attempted before entry_deadline has passed."
  - id: ERR_EMPTY_DRAWING_POOL
    http: 409
    condition: "Drawing run attempted with zero entries."
  - id: ERR_RETAILER_NOT_LICENSED
    http: 409
    condition: "Terminal activation or sale requires the owning retailer license_status == ACTIVE."
  - id: ERR_TERMINAL_NOT_ACTIVE
    http: 409
    condition: "Ticket sale or validation requires the selling terminal status == ACTIVE."
  - id: ERR_TICKET_NOT_CLAIMABLE
    http: 409
    condition: "Prize claim attempted against a ticket not in VALIDATED_WINNER."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violated: tax_id / serial_number / ticket serial / government_id_number."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type, out-of-range value, or invalid enum member."
  - id: ERR_REINSTATE_TOO_EARLY
    http: 409
    condition: "Reinstate attempted while self-exclusion still active (clock < exclusion_until)."
  - id: ERR_VALIDATION_FILTER_INVALID
    http: 422
    condition: "Pagination/filter parameter out of allowed range (e.g., limit > 100 or < 1)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LicensingAdmin
    description: "Manages retailer licensing and terminal provisioning/activation."
    identity: opaque
    exclusive_operations:
      - "POST /retailers"
      - "POST /retailers/{id}/license/activate"
      - "POST /retailers/{id}/license/suspend"
      - "POST /retailers/{id}/license/revoke"
      - "POST /terminals"
      - "POST /terminals/{id}/activate"
      - "POST /terminals/{id}/deactivate"
    shared_operations:
      - "GET /retailers"
      - "GET /retailers/{id}"
      - "GET /terminals"
      - "GET /terminals/{id}"
      - "GET /games"
      - "GET /games/{id}"
      - "POST /_clock/set_current_utc"

  - name: TerminalOperator
    description: "Sells tickets and validates them at the retail terminal."
    identity: opaque
    exclusive_operations:
      - "POST /tickets"
      - "POST /tickets/{id}/validate"
    shared_operations:
      - "GET /tickets"
      - "GET /tickets/{id}"
      - "GET /games"
      - "GET /games/{id}"
      - "GET /terminals"
      - "GET /terminals/{id}"
      - "POST /second-chance-entries"
      - "GET /second-chance-entries"
      - "GET /second-chance-entries/{id}"
      - "GET /second-chance-drawings"
      - "GET /second-chance-drawings/{id}"

  - name: ClaimsClerk
    description: "Registers players, opens prize claims, and files second-chance entries."
    identity: opaque
    exclusive_operations:
      - "POST /players"
      - "POST /prize-claims"
    shared_operations:
      - "GET /players/{id}"
      - "POST /players/{id}/self-exclude"
      - "GET /prize-claims"
      - "GET /prize-claims/{id}"
      - "GET /tickets"
      - "GET /tickets/{id}"
      - "GET /games"
      - "GET /games/{id}"
      - "POST /second-chance-entries"
      - "GET /second-chance-entries"
      - "GET /second-chance-entries/{id}"
      - "GET /second-chance-drawings"
      - "GET /second-chance-drawings/{id}"

  - name: LotteryOfficer
    description: "Central authority: adjudicates/disburses claims, runs settlements & drawings, escheat sweeps, game config. Segregation-of-duties enforced by X-User-ID, not by role."
    identity: opaque
    exclusive_operations:
      - "POST /games"
      - "POST /tickets/{id}/reverse-counter-pay"
      - "POST /prize-claims/{id}/begin-adjudication"
      - "POST /prize-claims/{id}/approve"
      - "POST /prize-claims/{id}/reject"
      - "POST /prize-claims/{id}/disburse"
      - "POST /prize-claims/{id}/void"
      - "POST /commission-settlements"
      - "POST /commission-settlements/{id}/finalize"
      - "POST /commission-settlements/{id}/void"
      - "POST /second-chance-drawings"
      - "POST /second-chance-drawings/{id}/run"
      - "POST /second-chance-drawings/{id}/cancel"
      - "POST /players/{id}/reinstate"
      - "POST /_clock/run_escheat_sweep"
    shared_operations:
      - "GET /retailers"
      - "GET /retailers/{id}"
      - "GET /terminals"
      - "GET /terminals/{id}"
      - "GET /players/{id}"
      - "POST /players/{id}/self-exclude"
      - "GET /tickets"
      - "GET /tickets/{id}"
      - "GET /prize-claims"
      - "GET /prize-claims/{id}"
      - "GET /games"
      - "GET /games/{id}"
      - "GET /second-chance-drawings"
      - "GET /second-chance-drawings/{id}"
      - "GET /second-chance-entries"
      - "GET /second-chance-entries/{id}"
      - "GET /commission-settlements"
      - "GET /commission-settlements/{id}"
      - "GET /escheat-records"
      - "GET /escheat-records/{id}"
      - "POST /_clock/set_current_utc"
