      - name: approved_and_denied_licenses_are_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Show.terminal_states
          - errors.ERR_SHOW_LICENSE_NOT_DRAFT
          - errors.ERR_SHOW_LICENSE_NOT_SUBMITTED
          - errors.ERR_SHOW_LICENSE_LOCKED
          - errors.ERR_CLASS_NOT_PLANNED
        distinguishing_aspect: |
          APPROVED and DENIED are both terminal, but they lock the show for
          different reasons and through different rules: no license trigger is
          accepted from either (priority 10), the class list is frozen once the show
          leaves DRAFT/RETURNED (priority 12, ERR_SHOW_LICENSE_LOCKED), and because
          DENIED cascades every class to VOIDED, an open attempt on a denied show's
          class is refused by the class machine (ERR_CLASS_NOT_PLANNED) before the
          license rule is ever consulted.
        test_recipe:
          setup:
            - "Show 1 driven to APPROVED and show 2 driven to DENIED; each has one JUMPER division and one class."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
