              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car2_id}"
            - call: "POST /eas/solicitations/${rep_sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${rep_sol_id}/selection-order"
              payload: { order_note: "replacement carrier secured" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr2_id: $.data.id }
            - call: "POST /eas/service-agreements/${agrd_id}/status-actions"
              payload: { action: "TERMINATE", note: "scoping control: SUSPENDED, not HOLD_IN" }
              as: ProgramAdmin
          assert:
            - "While no successor exists the manual TERMINATE returns 409 with ${hold_in_error_id} == ERR_REPLACEMENT_AGREEMENT_REQUIRED"
            - "The state gate at priority 6 does not pre-empt it: HOLD_IN -> TERMINATED is a declared transition, so the specific guard at priority 11 is the one that answers"
            - "ServiceAgreement.${agr_id}.status is still HOLD_IN and terminated_at is still null after the refusal"
            - "Community.${comm_id}.status is still HOLD_IN and its REPLACEMENT solicitation is untouched"
            - "Once ServiceAgreement.${agr2_id} reaches ACTIVE with predecessor_agreement_id == ${agr_id}, the cascade releases the hold-in: ServiceAgreement.${agr_id}.status == TERMINATED"
            - "The scoping control passes: a SUSPENDED agreement with no successor terminates cleanly, ServiceAgreement.${agrd_id}.status == TERMINATED"

      - name: period_report_reads_the_parent_agreement_status
        grounds:
          - state_machines.ServicePeriod.OPEN_to_REPORTED
          - state_machines.ServiceAgreement
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - validations.priority_6
          - endpoints.POST_/eas/service-periods/{id}/report
        dependency_pair:
          dependent: "ServicePeriod OPEN -> REPORTED"
          depended_on: "ServiceAgreement.status IN {ACTIVE, HOLD_IN}"
        distinguishing_aspect: |
          The permitted parent set is *not* the set of non-terminal parent states: HOLD_IN is allowed
          (the carrier is statutorily still flying and must still report) while SUSPENDED is refused,
          even though SUSPENDED is the more recoverable of the two. The refusal is also reported
          against the parent (ERR_AGREEMENT_NOT_ACTIVE) rather than against the child row named in the
          path, which is what makes it distinguishable from a plain period-state error.
        test_recipe:
          setup:
            - "Community HYS SUBSIDIZED under ACTIVE agreement A1 (Prairie Air, 1600000.00, term 24)."
            - "The 2026-08 reporting bucket is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
