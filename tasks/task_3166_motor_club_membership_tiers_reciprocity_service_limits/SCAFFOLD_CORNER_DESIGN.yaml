              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
          trigger:
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
            - call: "GET /motor-club/service-calls/${c1}"
              payload: {}
              as: Dispatcher
              captures: { c1_status: $.data.status, c1_reason: $.data.cancel_reason }
            - call: "GET /motor-club/service-calls/${c1}/dispatches"
              payload: {}
              as: Dispatcher
          assert:
            - "ServiceCall.${c1}.status == CANCELLED with cancel_reason == NO_PROVIDER"
            - "dispatches list for ${c1} is empty (no Dispatch row created on empty pool)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: completion_writes_immediately_visible
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.ServiceCall.ON_SCENE_to_COMPLETED"
        distinguishing_aspect: "The completion response itself carries the final charges (no re-read lag): mileage_charge_cents, parts_charge_cents, total_member_charge_cents and status COMPLETED are all set in the same response envelope, and a follow-up GET agrees."
        test_recipe:
          setup: ["TOW call dispatched, arrived; completion with actual 20 miles"]
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
              as: ClubAdmin
              captures: { club1: $.data.id }
            - call: "POST /motor-club/tiers"
              payload: { code: "CLASSIC", annual_dues_cents: 5000, included_tow_miles: 5, annual_call_cap: 4, lockout_benefit_cents: 5500, battery_service_included: false, household_member_price_cents: 2500, overage_rate_cents_per_mile: 650, upgrade_waiting_days: 3, rank: 1 }
              as: ClubAdmin
            - call: "POST /motor-club/memberships"
              payload: { home_club_id: "${club1}", primary_member_name: "Pat Primary", primary_member_email: "pat@x.com", tier_code: "CLASSIC" }
              as: MemberServicesRep
              captures: { m1: $.data.id }
            - call: "POST /motor-club/memberships/${m1}/household-members"
              payload: { full_name: "Pat Primary", relationship: "SPOUSE", date_of_birth: "1980-01-01T00:00:00Z", is_primary: true }
              as: MemberServicesRep
              captures: { hm1: $.data.id }
            - call: "POST /motor-club/providers"
              payload: { servicing_club_id: "${club1}", name: "NCA Fleet 1", provider_kind: "OWNED", capabilities: ["TOW"], home_base_state_code: "CA", sla_multiplier: 1.0, shift_start_minute: 0, shift_end_minute: 0, max_concurrent_dispatches: 2 }
              as: ClubAdmin
            - call: "POST /motor-club/service-calls"
              payload: { membership_id: "${m1}", requesting_member_id: "${hm1}", service_type: "TOW", breakdown_location_state: "CA", requested_tow_miles: 20 }
              as: Dispatcher
              captures: { c1: $.data.id, c1v: $.data.version }
            - call: "POST /motor-club/service-calls/${c1}/dispatch"
              payload: { expected_service_call_version: "${c1v}" }
              as: Dispatcher
              captures: { d1: $.data.id }
            - call: "POST /motor-club/dispatches/${d1}/accept"
              payload: { en_route: true }
              as: ProviderOps
            - call: "POST /motor-club/dispatches/${d1}/arrive"
              payload: {}
              as: ProviderOps
          trigger:
            - call: "POST /motor-club/dispatches/${d1}/complete"
              payload: { actual_tow_miles: 20 }
              as: ProviderOps
              captures: { d_status: $.data.status, d_mile: $.data.mileage_charge_cents, d_total: $.data.total_member_charge_cents }
            - call: "GET /motor-club/dispatches/${d1}"
              payload: {}
              as: Dispatcher
              captures: { d_mile2: $.data.mileage_charge_cents }
            - call: "GET /motor-club/memberships/${m1}"
              payload: {}
              as: MemberServicesRep
              captures: { m_calls: $.data.calls_used_current_term, m_credit: $.data.account_credit_cents }
          assert:
            - "completion response: status COMPLETED, mileage_charge_cents == 7800 ((20-3-5) x 650), total_member_charge_cents == 7800"
            - "follow-up GET returns the identical mileage_charge_cents (immediate consistency)"
            - "Membership.${m1}.calls_used_current_term == 1 and account_credit_cents == -7800 in the same instant"
