              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 4 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "SHIP" }
              as: StoreAssociate
            - call: "GET /order-lines"
              payload: {}
              as: StoreAssociate
              captures: { line_id: "$.data[0].id"}
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "DAMAGED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr1: "$.data.id"}
            - call: "POST /return-requests/${rr1}/decision"
              payload: { decision: "DENY", deny_reason: "HYGIENE_VIOLATION" }
              as: StoreAssociate
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "DAMAGED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr2: "$.data.id"}
            - call: "POST /return-requests/${rr2}/decision"
              payload: { decision: "DENY", deny_reason: "HYGIENE_VIOLATION" }
              as: StoreAssociate
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "DAMAGED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr3: "$.data.id"}
            - call: "POST /return-requests/${rr3}/decision"
