  - rule_id: transitive_cascade
    instances:

      - name: contact_void_four_hop_cascade
        grounds:
          - state_machines.ContactLog.VERIFIED_to_VOIDED
          - state_machines.MilestoneAttainment.ATTAINED_to_REVOKED
          - state_machines.NoviceTeacher.RECOMMENDED_to_NOT_ELIGIBLE
          - state_machines.CompletionCertification.SUBMITTED_TO_STATE_to_RETURNED
          - calculations.novice_readiness_index
          - entities.NoviceTeacher.fields.license_stage
        distinguishing_aspect: |
          DEPTH 4, triggered by POST /contact-logs/{id}/void: each link is CAUSED BY the
          previous link, not fanned out from the trigger - hop 1 lowers
          verified_contact_minutes 600 -> 540, hop 2 revokes the M3-RECOMMEND attainment
          BECAUSE 540 no longer satisfies its required_contact_minutes 600, hop 3 drops
          license_advancement_status RECOMMENDED -> NOT_ELIGIBLE BECAUSE the revoked
          milestone was the one with gates_license_recommendation true, and hop 4 returns
          the SUBMITTED_TO_STATE packet BECAUSE the licence recommendation was withdrawn.
        test_recipe:
          setup:
            - "Open Site, CERTIFIED MATH Mentor, MATH NoviceTeacher, ACTIVE MentorMatch."
            - "Clock advanced to 2026-08-10T12:00:00Z."
            - "Four VERIFIED ONE_ON_ONE logs: 2026-08-03 (180), 2026-08-04 (180), 2026-08-05 (180), 2026-08-06 (60) -> verified_contact_minutes exactly 600."
            - "One DOCUMENTED and ACCEPTED observation cycle in the window 2026-08-07T09:00Z-10:00Z -> documented_observation_cycles 1."
            - "One 120 minute seminar session 2026-08-08T15:00Z-17:00Z with a PRESENT 120 minute attendance, marked HELD -> credited_seminar_sessions 1, held_sessions 1, and the cohort bubbles FORMING -> RUNNING."
            - "readiness_index_live = round(100 * (0.45 * 600/600 + 0.30 * min(1, 1/2) + 0.25 * 1/1), 2) = 85.00, exactly the READINESS_GATE, so license_advancement_status is ELIGIBLE."
            - "Three milestones: M1-ENTRY (seq 1, no requirements), M2-PRACTICE (seq 2, no requirements) and M3-RECOMMEND (seq 3, required_contact_minutes 600, required_observation_cycles 1, required_credited_seminars 1, gates_license_recommendation true, license_stage_unlocked PROVISIONAL), all three ATTAINED, so license_advancement_status is RECOMMENDED and license_stage is PROVISIONAL."
            - "The cohort is created with seminar_sessions_required 1, so one credited seminar satisfies the packet submission gate, and is then CLOSED (no session is still SCHEDULED)."
            - "A CompletionCertification created with base_score = round(0.60 * 85.00 + 0.40 * 100, 2) = 91.00, retention_outcome UNKNOWN so retention_bonus 0.00 and completion_score 91.00, then SUBMITTED_TO_STATE."
