            - call: "POST /api/development-loans"
              payload: { parcel_id: "${p9}", commitment_amount_cents: 500000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ln9: $.data.id }
          trigger:
            - call: "POST /api/loan-draws"
              payload: { loan_id: "${ln9}", line_items: [{ description: "oversized", amount_cents: 99999999 }] }
              as: DeveloperOperator
              as_user_id: "dev-user-1"
              captures: { err9: $.data.error_id }
          assert:
            - "captured err9 == ERR_LOAN_NOT_ACTIVE (referential, priority 10) — not ERR_DRAW_EXCEEDS_COMMITMENT (fiscal, priority 11), even though both conditions hold"

