# =============================================================================
# SCAFFOLD — Federal Building Lease Procurement & Occupancy Agreement Billing
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Federal Building Lease Procurement & Occupancy Agreement Billing (General Services Administration): agency space requirement development with headcount projections, security level determination and special space needs, market survey and competitive lease procurement with build-out allowances and tenant improvement amortization, lease award with rental rate structures covering shell rent, operating costs and tax escalation, occupancy agreement with the tenant agency establishing rent billed to the agency including a fee component, space alteration requests during a lease term with funding and amortization decisions, lease expiration planning with succeeding lease, relocation or replacement construction options, building operations, maintenance and security service delivery in leased and owned space, utilization measurement and space reduction initiatives

domain_name: federal-building-lease-billing
api_prefix: /leasing

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate
  difficulty_target: "beyond-expert: 12 entities, ~53 endpoints, 27 error codes, 4 dual/variant calculation families, 10 state machines incl. 2 cycles + 2 branching machines, 2 OCC-guarded writes, 18 difficulty instances"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: bureau_code, type: string, source: input, description: "Agency bureau code; unique across agencies" }
      - { name: name, type: string, source: input, description: "Agency display name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE", constraints: "enum {ACTIVE}" }

  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: building_name, type: string, source: input, description: "Building name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: region_code, type: string, source: input, description: "GSA region code (e.g. R9)" }
      - { name: ownership_type, type: enum, source: input, description: "FEDERALLY_OWNED | LEASED_STOCK", constraints: "enum {FEDERALLY_OWNED, LEASED_STOCK}" }
      - { name: security_capability, type: integer, source: input, description: "Highest facility security level the building can support, 1..5", constraints: "1 <= value <= 5" }
      - { name: total_sf, type: integer, source: input, description: "Total rentable square feet", constraints: "> 0" }
      - { name: available_sf, type: integer, source: computed, description: "total_sf minus space committed by ACTIVE/DRAFT OccupancyAgreements (owned) or non-terminal Leases (leased stock); maintained by space_inventory_reconciliation" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | UNDER_CONSTRUCTION", constraints: "enum {ACTIVE, UNDER_CONSTRUCTION}; UNDER_CONSTRUCTION written by ExpirationPlan execute (REPLACEMENT_CONSTRUCTION)" }

  - name: SpaceRequirement
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning tenant agency" }
      - { name: title, type: string, source: input, description: "Requirement title" }
      - { name: base_headcount, type: integer, source: input, description: "Current headcount to house", constraints: "> 0" }
      - { name: annual_growth_pct, type: number, source: input, description: "Projected annual headcount growth as decimal (e.g. 0.02)", constraints: "0 <= value <= 0.10" }
      - { name: target_occupancy_year, type: integer, source: input, description: "Calendar year the space must be ready; projection horizon" }
      - { name: sf_per_person, type: integer, source: input, description: "Usable square feet per person standard", constraints: "100 <= value <= 250" }
      - { name: special_needs, type: array, source: input, description: "Array of { need_type: SCIF|LAB|WAREHOUSE|SECURE_STORAGE, sf: integer > 0 }; may be empty" }
      - { name: region_code, type: string, source: input, description: "Delineated market region for the search" }
      - { name: mission_points, type: integer, source: input, description: "ISC mission criticality points", constraints: "0 <= value <= 25" }
      - { name: population_points, type: integer, source: input, description: "ISC facility population points", constraints: "0 <= value <= 25" }
      - { name: size_points, type: integer, source: input, description: "ISC facility size points", constraints: "0 <= value <= 25" }
      - { name: criticality_points, type: integer, source: input, description: "ISC tenant criticality points", constraints: "0 <= value <= 25" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | NEEDS_REVISION | VALIDATED | SOLICITING | AWARDED", constraints: "enum per state machine" }
      - { name: projected_headcount, type: integer, source: computed, description: "Set at validate by headcount_projection" }
      - { name: required_security_level, type: integer, source: computed, description: "Set at validate by security_level_determination, 1..5" }
      - { name: required_usable_sf, type: integer, source: computed, description: "Set at validate: projected_headcount * sf_per_person + sum(special_needs.sf)" }
      - { name: survey_summary, type: string, source: system, description: "Market survey narrative recorded at complete-market-survey" }
      - { name: delivery_method, type: enum, source: system, default: STANDARD, description: "STANDARD | NEW_CONSTRUCTION; NEW_CONSTRUCTION set when spawned by ExpirationPlan execute (REPLACEMENT_CONSTRUCTION)" }
      - { name: source_plan_id, type: string, source: system, description: "ExpirationPlan id that spawned this requirement (null when agency-created)" }

  - name: LeaseOffer
    parent: null
    common_fields: true
    fields:
      - { name: requirement_id, type: string, source: system, description: "FK -> SpaceRequirement.id; from creation path" }
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; offered building" }
      - { name: lessor_name, type: string, source: input, description: "Offering lessor legal name" }
      - { name: shell_rate_per_sf_yr_cents, type: integer, source: input, description: "Annual shell rent per RSF in cents", constraints: "> 0" }
      - { name: operating_rate_per_sf_yr_cents, type: integer, source: input, description: "Annual operating cost rate per RSF in cents", constraints: ">= 0" }
      - { name: base_year_tax_per_sf_yr_cents, type: integer, source: input, description: "Base-year real estate tax per RSF in cents (escalation base)", constraints: ">= 0" }
      - { name: escalation_method, type: enum, source: input, description: "BASE_YEAR_STOP | CPI_INDEXED", constraints: "enum {BASE_YEAR_STOP, CPI_INDEXED}" }
      - { name: ti_allowance_per_sf_cents, type: integer, source: input, description: "Tenant improvement allowance per RSF in cents", constraints: ">= 0" }
      - { name: free_rent_months, type: integer, source: input, description: "Shell-rent abatement months from commencement", constraints: "0 <= value <= 24" }
      - { name: term_years, type: integer, source: input, description: "Lease term in years", constraints: "5 <= value <= 20" }
      - { name: valid_until, type: datetime, source: input, description: "Offer validity deadline (ISO8601); award after this is rejected" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_EVALUATION | SELECTED | REJECTED | WITHDRAWN", constraints: "enum per state machine" }
      - { name: rejection_reason, type: enum, source: system, description: "AUTO_NOT_SELECTED | WITHDRAWN_BY_LESSOR; null unless REJECTED/WITHDRAWN", constraints: "enum {AUTO_NOT_SELECTED, WITHDRAWN_BY_LESSOR}" }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: requirement_id, type: string, source: system, description: "FK -> SpaceRequirement.id; awarded requirement" }
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; copied from selected offer" }
      - { name: offer_id, type: string, source: system, description: "FK -> LeaseOffer.id; the selected offer" }
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from requirement" }
      - { name: succeeds_lease_id, type: string, source: system, description: "FK -> Lease.id; set when created as succeeding lease by ExpirationPlan execute (self-referential, null otherwise)" }
      - { name: shell_rate_per_sf_yr_cents, type: integer, source: system, description: "Copied from selected offer" }
      - { name: operating_rate_per_sf_yr_cents, type: integer, source: system, description: "Copied from selected offer" }
      - { name: base_year_tax_per_sf_yr_cents, type: integer, source: system, description: "Copied from selected offer" }
      - { name: escalation_method, type: enum, source: system, description: "Copied from selected offer: BASE_YEAR_STOP | CPI_INDEXED" }
      - { name: free_rent_months, type: integer, source: system, description: "Copied from selected offer" }
      - { name: term_months, type: integer, source: system, description: "term_years * 12" }
      - { name: leased_sf, type: integer, source: system, description: "Square feet under lease; equals requirement.required_usable_sf at award" }
      - { name: ti_allowance_total_cents, type: integer, source: computed, description: "offer.ti_allowance_per_sf_cents * leased_sf" }
      - { name: status, type: enum, source: system, default: AWARDED, description: "AWARDED | COMMENCED | EXPIRING | EXPIRED | SUCCEEDED", constraints: "enum per state machine" }
      - { name: awarded_date, type: datetime, source: system, description: "Logical clock timestamp at award" }
      - { name: commencement_date, type: string, source: system, description: "ISO date occupancy starts; input at commence" }
      - { name: end_date, type: string, source: computed, description: "commencement_date + term_months months - 1 day (month arithmetic, day preserved, clamped to month end)" }
      - { name: ti_buildout_cost_cents, type: integer, source: system, description: "Actual TI build-out cost; input at commence", constraints: ">= 0" }
      - { name: ti_amort_method, type: enum, source: system, description: "ANNUITY | STRAIGHT_LINE; input at commence", constraints: "enum {ANNUITY, STRAIGHT_LINE}" }
      - { name: cpi_base_index, type: number, source: system, description: "CPI index at commencement; required input at commence iff escalation_method == CPI_INDEXED, otherwise ignored" }
      - { name: ti_amortized_principal_cents, type: integer, source: computed, description: "max(0, ti_buildout_cost_cents - ti_allowance_total_cents)" }
      - { name: ti_schedule_monthly_cents, type: array, source: computed, description: "Length term_months; per-month TI amortization per ti_amortization_schedule; empty when principal == 0" }
      - { name: tax_statements, type: array, source: system, description: "Append-only [{ tax_year: integer, actual_tax_per_sf_yr_cents: integer, cpi_index: number|null }]" }
      - { name: current_tax_per_sf_yr_cents, type: integer, source: computed, description: "actual_tax_per_sf_yr_cents of the statement with the greatest tax_year <= context year; base_year_tax_per_sf_yr_cents when no statement qualifies" }
      - { name: current_cpi_index, type: number, source: computed, description: "cpi_index of that same latest qualifying statement; cpi_base_index when none" }
      - { name: executed_option, type: enum, source: system, description: "SUCCEEDING_LEASE | RELOCATION | REPLACEMENT_CONSTRUCTION; copied from executed ExpirationPlan; null until then" }

  - name: ExpirationPlan
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; from creation path" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | OPTION_SELECTED | EXECUTED | CANCELLED", constraints: "enum per state machine" }
      - { name: selected_option, type: enum, source: system, description: "SUCCEEDING_LEASE | RELOCATION | REPLACEMENT_CONSTRUCTION; null until select-option", constraints: "enum {SUCCEEDING_LEASE, RELOCATION, REPLACEMENT_CONSTRUCTION}" }
      - { name: option_costs, type: array, source: computed, description: "[{ option, projected_cost_cents }] for all three options, computed at select-option by expiration_option_scoring" }
      - { name: recommended_option, type: enum, source: computed, description: "Minimum projected_cost_cents; ties broken by fixed priority SUCCEEDING_LEASE > RELOCATION > REPLACEMENT_CONSTRUCTION" }
      - { name: cost_params, type: object, source: system, description: "Stored select-option cost inputs used again at execute (succeeding rates/term, relocation costs, construction cost)" }
      - { name: outcome_lease_id, type: string, source: system, description: "New Lease id when executed with SUCCEEDING_LEASE; else null" }
      - { name: outcome_requirement_id, type: string, source: system, description: "New SpaceRequirement id when executed with RELOCATION or REPLACEMENT_CONSTRUCTION; else null" }
      - { name: outcome_building_id, type: string, source: system, description: "New UNDER_CONSTRUCTION Building id when executed with REPLACEMENT_CONSTRUCTION; else null" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock timestamp at execute; null until then" }

  - name: OccupancyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; exactly one of lease_id / building_id must be present (leased space)" }
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; exactly one of lease_id / building_id must be present (owned space)" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; tenant agency billed under this OA" }
      - { name: assigned_sf, type: integer, source: input, description: "Square feet assigned to the agency", constraints: "> 0" }
      - { name: start_date, type: string, source: input, description: "ISO date occupancy responsibility starts" }
      - { name: end_date, type: string, source: input, description: "ISO date occupancy responsibility ends (inclusive); must be after start_date and within lease term for leased OAs" }
      - { name: shell_equivalent_rate_per_sf_yr_cents, type: integer, source: input, description: "Annual shell-equivalent rent per RSF in cents; REQUIRED iff owned (building_id given), ignored when leased", constraints: ">= 0 when present" }
      - { name: operating_rate_per_sf_yr_cents, type: integer, source: input, description: "Annual operating rate per RSF in cents; REQUIRED iff owned, ignored when leased", constraints: ">= 0 when present" }
      - { name: pricing_source, type: enum, source: computed, description: "LEASE_PASS_THROUGH when lease_id present, OWNED_MARKET otherwise" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | EXPIRED | TERMINATED", constraints: "enum per state machine" }
      - { name: pending_service_credit_cents, type: integer, source: system, default: 0, description: "Unapplied SLA service credits posted by ServiceTicket verify; consumed by next generated bill" }
      - { name: receivable_outstanding_cents, type: integer, source: computed, description: "sum(bills.total_cents) - sum(bills.amount_paid_cents) over this OA; maintained by receivable_ledger" }
      - { name: terminal_writeoff_cents, type: integer, source: system, default: 0, description: "Unamortized alteration balances accelerated when the OA reaches EXPIRED/TERMINATED" }
      - { name: amendment_history, type: array, source: system, description: "Append-only [{ amended_at, delta_sf, old_sf, new_sf, note }] written by amend and by SpaceReductionAction execute" }

  - name: RentBill
    parent: null
    common_fields: true
    fields:
      - { name: oa_id, type: string, source: system, description: "FK -> OccupancyAgreement.id; from creation path" }
      - { name: billing_month, type: string, source: input, description: "Month billed, format YYYY-MM; unique per OA" }
      - { name: shell_cents, type: integer, source: computed, description: "Shell rent component per monthly_rent_bill" }
      - { name: operating_cents, type: integer, source: computed, description: "Operating cost component" }
      - { name: tax_escalation_cents, type: integer, source: computed, description: "Tax escalation component per tax_escalation (0 for owned OAs)" }
      - { name: ti_amortization_cents, type: integer, source: computed, description: "TI amortization component (0 for owned OAs or when principal == 0)" }
      - { name: alteration_amortization_cents, type: integer, source: computed, description: "Sum of monthly amortization of COMPLETED AMORTIZED alterations whose schedule covers billing_month" }
      - { name: lump_sum_charges_cents, type: integer, source: computed, description: "Sum of estimated_cost_cents of LUMP_SUM alterations completed in the month immediately preceding billing_month" }
      - { name: abatement_credit_cents, type: integer, source: computed, description: "Free-rent shell abatement applied this month (equals shell_cents when month_index <= free_rent_months, else 0)" }
      - { name: fee_cents, type: integer, source: computed, description: "GSA fee = round_half_up(subtotal * 0.05)" }
      - { name: service_credit_applied_cents, type: integer, source: computed, description: "min(oa.pending_service_credit_cents, subtotal + fee_cents) consumed at generation" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal + fee_cents - service_credit_applied_cents (floor 0)" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Sum of payments applied" }
      - { name: payments, type: array, source: system, description: "Append-only [{ paid_at, amount_cents, payer_user_id }]" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | PARTIALLY_PAID | PAID", constraints: "enum per state machine" }

  - name: AlterationRequest
    parent: null
    common_fields: true
    fields:
      - { name: oa_id, type: string, source: system, description: "FK -> OccupancyAgreement.id; from creation path" }
      - { name: title, type: string, source: input, description: "Alteration title" }
      - { name: description, type: string, source: input, description: "Scope description" }
      - { name: scope_sf, type: integer, source: input, description: "Square feet affected", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | ESTIMATED | APPROVED | COMPLETED | CANCELLED", constraints: "enum per state machine" }
      - { name: estimated_cost_cents, type: integer, source: system, description: "GSA cost estimate; input at estimate", constraints: "> 0" }
      - { name: work_start_date, type: string, source: system, description: "Proposed work window start (ISO date); input at estimate" }
      - { name: work_end_date, type: string, source: system, description: "Proposed work window end (ISO date, inclusive); input at estimate; must be >= work_start_date" }
      - { name: funding_method, type: enum, source: system, description: "LUMP_SUM | AMORTIZED; input at approve", constraints: "enum {LUMP_SUM, AMORTIZED}" }
      - { name: completion_date, type: string, source: system, description: "ISO date work finished; input at complete" }
      - { name: amortization_months, type: integer, source: computed, description: "Months from the month after completion month through OA end month, inclusive; set at complete (AMORTIZED only)" }
      - { name: monthly_amort_cents, type: integer, source: computed, description: "Level monthly amortization per alteration_amortization; set at complete (AMORTIZED only)" }
      - { name: amortization_start_month, type: string, source: computed, description: "First billed month (YYYY-MM), the month after completion month" }
      - { name: amortization_balance_cents, type: number, source: computed, description: "Exact (unrounded) remaining balance; reduced by each generated bill that applies monthly_amort_cents; accelerated to OA.terminal_writeoff_cents at OA end" }
      - { name: lump_charge_status, type: enum, source: computed, description: "NONE | PENDING | BILLED | REVERSED; PENDING from approve (LUMP_SUM), BILLED once a bill charges it, REVERSED on cancel before completion", constraints: "enum {NONE, PENDING, BILLED, REVERSED}" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; from creation path" }
      - { name: reported_oa_id, type: string, source: input, description: "OccupancyAgreement id the ticket is reported against; must be an ACTIVE OA whose building matches" }
      - { name: category, type: enum, source: input, description: "MAINTENANCE | SECURITY | CLEANING", constraints: "enum {MAINTENANCE, SECURITY, CLEANING}" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | ROUTINE", constraints: "enum {CRITICAL, ROUTINE}" }
      - { name: description, type: string, source: input, description: "Issue description" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESOLVED | VERIFIED", constraints: "enum per state machine" }
      - { name: sla_hours, type: integer, source: computed, description: "24 for CRITICAL, 72 for ROUTINE" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock at resolve" }
      - { name: verified_at, type: datetime, source: system, description: "Logical clock at verify" }
      - { name: sla_breached, type: boolean, source: computed, description: "resolved_at - created_at > sla_hours (strictly greater)" }
      - { name: credit_cents, type: integer, source: computed, description: "0 when not breached; else min(100000, 10000 * ceil(hours_over / 24)) per sla_service_credit" }

  - name: UtilizationSurvey
    parent: null
    common_fields: true
    fields:
      - { name: oa_id, type: string, source: system, description: "FK -> OccupancyAgreement.id; from creation path" }
      - { name: method, type: enum, source: input, description: "SPACE_BASED | HEADCOUNT_BASED", constraints: "enum {SPACE_BASED, HEADCOUNT_BASED}" }
      - { name: measured_headcount, type: integer, source: input, description: "Observed headcount at measurement", constraints: ">= 0" }
      - { name: utilized_sf, type: integer, source: input, description: "Observed utilized square feet", constraints: ">= 0" }
      - { name: measured_at, type: datetime, source: input, description: "Measurement timestamp; must be <= current logical clock" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | FINALIZED", constraints: "enum per state machine" }
      - { name: utilization_rate, type: number, source: computed, description: "Per utilization_rate variant, 4 decimal places round_half_up; set at finalize" }
      - { name: recommended_release_sf, type: integer, source: computed, description: "max(0, assigned_sf - measured_headcount * 150); set at finalize" }
      - { name: reduction_action_id, type: string, source: system, description: "SpaceReductionAction id auto-created when utilization_rate < 0.60; null otherwise" }

  - name: SpaceReductionAction
    parent: null
    common_fields: true
    fields:
      - { name: oa_id, type: string, source: system, description: "FK -> OccupancyAgreement.id; copied from the triggering survey" }
      - { name: survey_id, type: string, source: system, description: "UtilizationSurvey id that proposed this action" }
      - { name: recommended_release_sf, type: integer, source: system, description: "Copied from survey at proposal" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | APPROVED | EXECUTED", constraints: "enum per state machine" }
      - { name: executed_release_sf, type: integer, source: system, description: "Square feet actually released at execute (equals recommended_release_sf); null until then" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock at execute; null until then" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SpaceRequirement
    initial_state: DRAFT
    terminal_states: [AWARDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /leasing/space-requirements/{id}/submit"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == requirement.agency_id (ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: NEEDS_REVISION
        trigger: "POST /leasing/space-requirements/{id}/return"
        actor: GSALeasingOfficer
        preconditions: []
        side_effects: []
      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /leasing/space-requirements/{id}/resubmit"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == requirement.agency_id (ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects: []
        note: "Revision cycle: SUBMITTED -> NEEDS_REVISION -> SUBMITTED may repeat without bound"
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /leasing/space-requirements/{id}/validate"
        actor: GSALeasingOfficer
        preconditions: []
        side_effects:
          - "runs headcount_projection -> projected_headcount"
          - "runs security_level_determination -> required_security_level"
          - "required_usable_sf = projected_headcount * sf_per_person + sum(special_needs[].sf)"
      - from: VALIDATED
        to: SOLICITING
        trigger: "POST /leasing/space-requirements/{id}/complete-market-survey"
        actor: GSALeasingOfficer
        preconditions: []
        side_effects:
          - "survey_summary stored from request payload"
      - from: SOLICITING
        to: AWARDED
        trigger: "system (when a LeaseOffer for this requirement is SELECTED)"
        actor: system
        preconditions: []
        side_effects:
          - " Lease created in AWARDED with rates/term copied from the selected offer and leased_sf = required_usable_sf"
        note: "AWARDED is terminal: the procurement lifecycle hands off to the Lease"

  - entity: LeaseOffer
    initial_state: SUBMITTED
    terminal_states: [SELECTED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_EVALUATION
        trigger: "POST /leasing/offers/{id}/evaluate"
        actor: GSALeasingOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_EVALUATION
        to: SELECTED
        trigger: "POST /leasing/offers/{id}/select"
        actor: GSALeasingOfficer
        preconditions:
          - "requirement.status == SOLICITING (ERR_REQUIREMENT_NOT_SOLICITING)"
          - "offer.building.security_capability >= requirement.required_security_level (ERR_SECURITY_LEVEL_INSUFFICIENT)"
          - "offer.valid_until >= current logical clock (ERR_OFFER_EXPIRED)"
          - "offer.building.available_sf >= requirement.required_usable_sf (ERR_BUILDING_CAPACITY_EXCEEDED)"
        side_effects:
          - "Lease created AWARDED: rates, escalation_method, free_rent_months, term_years copied from offer; leased_sf = requirement.required_usable_sf; ti_allowance_total_cents = offer.ti_allowance_per_sf_cents * leased_sf; awarded_date = current logical clock"
          - "requirement transitions SOLICITING -> AWARDED"
          - "every sibling offer of the same requirement in SUBMITTED or UNDER_EVALUATION transitions to REJECTED with rejection_reason = AUTO_NOT_SELECTED (conditional cascade: terminal siblings untouched)"
          - "building.available_sf -= leased_sf"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /leasing/offers/{id}/withdraw"
        actor: LessorRep
        preconditions: []
        side_effects: ["rejection_reason = WITHDRAWN_BY_LESSOR"]
      - from: UNDER_EVALUATION
        to: WITHDRAWN
        trigger: "POST /leasing/offers/{id}/withdraw"
        actor: LessorRep
        preconditions: []
        side_effects: ["rejection_reason = WITHDRAWN_BY_LESSOR"]

  - entity: Lease
    initial_state: AWARDED
    terminal_states: [EXPIRED, SUCCEEDED]
    transitions:
      - from: AWARDED
        to: COMMENCED
        trigger: "POST /leasing/leases/{id}/commence"
        actor: GSALeasingOfficer
        preconditions:
          - "commencement_date >= date(awarded_date) and commencement_date <= date(awarded_date) + 24 months (ERR_COMMENCEMENT_OUT_OF_WINDOW)"
          - "cpi_base_index present iff escalation_method == CPI_INDEXED (ERR_INVALID_REQUEST)"
        side_effects:
          - "end_date = commencement_date + term_months months - 1 day"
          - "runs ti_amortization_schedule -> ti_amortized_principal_cents, ti_schedule_monthly_cents"
      - from: COMMENCED
        to: EXPIRING
        trigger: "system (evaluated during POST /_clock/set_current_utc sweep when current date >= end_date - 18 months; month arithmetic with day clamped to month end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXPIRING
        to: EXPIRED
        trigger: "system (clock sweep when current date > end_date AND executed_option is null or != SUCCEEDING_LEASE)"
        actor: system
        preconditions: []
        side_effects:
          - "every OccupancyAgreement with lease_id == this lease in DRAFT or ACTIVE transitions to EXPIRED (cascade link 1)"
          - "each such OA expiration cascades: its non-terminal AlterationRequests (REQUESTED|ESTIMATED|APPROVED) transition to CANCELLED (cascade link 2)"
          - "each COMPLETED AMORTIZED alteration's remaining amortization_balance_cents is accelerated: OA.terminal_writeoff_cents += round_half_up(balance) (cascade link 3)"
          - "OA building/lease space released: building.available_sf += OA.assigned_sf for owned OAs"
          - "every ExpirationPlan of this lease in OPEN or OPTION_SELECTED transitions to CANCELLED"
      - from: EXPIRING
        to: SUCCEEDED
        trigger: "system (clock sweep when current date > end_date AND executed_option == SUCCEEDING_LEASE)"
        actor: system
        preconditions: []
        side_effects:
          - "same OA-expiration cascade as EXPIRED (OAs expire, non-terminal alterations cancelled, amortization balances accelerated, space released)"

  - entity: ExpirationPlan
    initial_state: OPEN
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: OPEN
        to: OPTION_SELECTED
        trigger: "POST /leasing/expiration-plans/{id}/select-option"
        actor: GSALeasingOfficer
        preconditions:
          - "whole calendar months between current date and lease.end_date >= 12 (ERR_OPTION_DEADLINE_PASSED); whole months = (end_y - y)*12 + (end_m - m) - (1 if end_d < d else 0)"
        side_effects:
          - "runs expiration_option_scoring -> option_costs, recommended_option; cost_params stored; selected_option set from payload"
      - from: OPTION_SELECTED
        to: EXECUTED
        trigger: "POST /leasing/expiration-plans/{id}/execute"
        actor: GSALeasingOfficer
        preconditions:
          - "lease.status == EXPIRING (ERR_LEASE_NOT_EXPIRING)"
        side_effects:
          - "lease.executed_option = selected_option"
          - "SUCCEEDING_LEASE: new Lease created AWARDED on same building+agency with succeeds_lease_id = this lease, rates and term from cost_params, leased_sf carried over; outcome_lease_id set"
          - "RELOCATION: new SpaceRequirement created DRAFT for the same agency (headcount/sf fields copied from the originating requirement, delivery_method = STANDARD); outcome_requirement_id set"
          - "REPLACEMENT_CONSTRUCTION: new Building created with status UNDER_CONSTRUCTION plus new SpaceRequirement DRAFT with delivery_method = NEW_CONSTRUCTION; outcome_building_id and outcome_requirement_id set"
      - from: OPEN
        to: CANCELLED
        trigger: "system (when the lease reaches EXPIRED or SUCCEEDED without this plan executed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPTION_SELECTED
        to: CANCELLED
        trigger: "system (when the lease reaches EXPIRED or SUCCEEDED without this plan executed)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OccupancyAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /leasing/occupancy-agreements/{id}/activate"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == oa.agency_id (ERR_AGENCY_SCOPE_VIOLATION)"
          - "leased OA: lease.status == COMMENCED or EXPIRING (ERR_LEASE_NOT_COMMENCED); owned OA: no lease gate"
        side_effects: []
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /leasing/occupancy-agreements/{id}/amend"
        actor: GSALeasingOfficer
        preconditions:
          - "expected_oa_version == oa.version (ERR_STALE_VERSION, 412)"
          - "capacity re-check when delta_sf > 0 (ERR_BUILDING_CAPACITY_EXCEEDED / ERR_LEASE_SPACE_EXCEEDED)"
          - "leased OA: new_end_date (when given) <= lease.end_date (ERR_OA_TERM_EXCEEDS_LEASE)"
        side_effects:
          - "oa.version += 1; amendment_history appended with delta_sf/old_sf/new_sf"
          - "assigned_sf += delta_sf (delta may be negative); building.available_sf -= delta_sf for owned OAs"
          - "end_date / owned rate fields updated when supplied"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /leasing/occupancy-agreements/{id}/terminate"
        actor: GSALeasingOfficer
        preconditions: []
        side_effects:
          - "building.available_sf += assigned_sf for owned OAs"
          - "non-terminal AlterationRequests (REQUESTED|ESTIMATED|APPROVED) -> CANCELLED; each such cancellation reverses its PENDING lump charge (lump_charge_status -> REVERSED)"
          - "COMPLETED AMORTIZED alterations' remaining balances accelerate into terminal_writeoff_cents"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when current date > end_date, or cascade from lease expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "same cascade as TERMINATED: alterations cancelled, lump charges reversed, amortization balances accelerated to terminal_writeoff_cents, owned space released"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /leasing/occupancy-agreements/{id}/terminate"
        actor: GSALeasingOfficer
        preconditions: []
        side_effects:
          - "building.available_sf += assigned_sf for owned OAs (reservation released)"

  - entity: RentBill
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /leasing/rent-bills/{id}/pay with amount_cents < total_cents - amount_paid_cents"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the bill's OA (ERR_AGENCY_SCOPE_VIOLATION)"
          - "amount_cents > 0 and amount_cents <= total_cents - amount_paid_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects: ["amount_paid_cents += amount_cents; payment appended"]
      - from: ISSUED
        to: PAID
        trigger: "POST /leasing/rent-bills/{id}/pay with amount_cents == total_cents - amount_paid_cents"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the bill's OA (ERR_AGENCY_SCOPE_VIOLATION)"
          - "amount_cents > 0 and amount_cents <= total_cents - amount_paid_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects: ["amount_paid_cents = total_cents; payment appended"]
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /leasing/rent-bills/{id}/pay with amount_cents == total_cents - amount_paid_cents"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the bill's OA (ERR_AGENCY_SCOPE_VIOLATION)"
          - "amount_cents > 0 and amount_cents <= total_cents - amount_paid_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
        side_effects: ["amount_paid_cents = total_cents; payment appended"]

  - entity: AlterationRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ESTIMATED
        trigger: "POST /leasing/alteration-requests/{id}/estimate"
        actor: GSAPropertyManager
        preconditions:
          - "oa.status == ACTIVE (ERR_OA_NOT_ACTIVE)"
          - "work window [work_start_date, work_end_date] must leave >= 14 clear days to any other non-CANCELLED alteration window on the same OA (ERR_ALTERATION_WINDOW_CONFLICT); gap = (later.work_start_date - earlier.work_end_date).days, conflict iff gap < 14"
          - "work_end_date >= work_start_date (ERR_INVALID_REQUEST)"
        side_effects: ["estimated_cost_cents, work_start_date, work_end_date stored"]
      - from: ESTIMATED
        to: REQUESTED
        trigger: "POST /leasing/alteration-requests/{id}/revise"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the OA (ERR_AGENCY_SCOPE_VIOLATION)"
          - "expected_alteration_version == alteration.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "alteration.version += 1; scope_sf/description replaced when supplied; estimate fields cleared (estimated_cost_cents/work dates null)"
        note: "Revision cycle ESTIMATED -> REQUESTED -> ESTIMATED may repeat"
      - from: ESTIMATED
        to: APPROVED
        trigger: "POST /leasing/alteration-requests/{id}/approve"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the OA (ERR_AGENCY_SCOPE_VIOLATION)"
          - "oa.status == ACTIVE (ERR_OA_NOT_ACTIVE)"
          - "funding_method == AMORTIZED requires months from the month after work_end month through OA end month >= 12 (ERR_AMORTIZATION_WINDOW_TOO_SHORT)"
        side_effects:
          - "funding_method stored"
          - "LUMP_SUM: lump_charge_status = PENDING"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /leasing/alteration-requests/{id}/complete"
        actor: GSAPropertyManager
        preconditions:
          - "oa.status == ACTIVE (ERR_OA_NOT_ACTIVE)"
        side_effects:
          - "AMORTIZED: runs alteration_amortization -> amortization_months, monthly_amort_cents, amortization_start_month, amortization_balance_cents = estimated_cost_cents"
          - "LUMP_SUM: charge becomes billable in the month after completion month (picked up by that month's bill, lump_charge_status -> BILLED)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /leasing/alteration-requests/{id}/cancel"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the OA (ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects: []
      - from: ESTIMATED
        to: CANCELLED
        trigger: "POST /leasing/alteration-requests/{id}/cancel"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the OA (ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /leasing/alteration-requests/{id}/cancel"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of the OA (ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects:
          - "LUMP_SUM: lump_charge_status PENDING -> REVERSED (charge never reaches a bill)"

  - entity: ServiceTicket
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /leasing/service-tickets/{id}/resolve"
        actor: GSAPropertyManager
        preconditions: []
        side_effects: ["resolved_at = current logical clock"]
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /leasing/service-tickets/{id}/verify"
        actor: AgencyManager
        preconditions:
          - "acting AgencyManager's X-User-ID == agency of ticket.reported_oa_id's OA (ERR_AGENCY_SCOPE_VIOLATION)"
        side_effects:
          - "verified_at = current logical clock; sla_breached and credit_cents computed per sla_service_credit"
          - "when sla_breached: OA.pending_service_credit_cents += credit_cents (consumed by the next generated bill)"

  - entity: UtilizationSurvey
    initial_state: RECORDED
    terminal_states: [FINALIZED]
    transitions:
      - from: RECORDED
        to: FINALIZED
        trigger: "POST /leasing/utilization-surveys/{id}/finalize"
        actor: GSAPropertyManager
        preconditions: []
        side_effects:
          - "runs utilization_rate variant per survey.method -> utilization_rate, recommended_release_sf"
          - "when utilization_rate < 0.60: SpaceReductionAction auto-created PROPOSED on the same OA with recommended_release_sf; survey.reduction_action_id set"

  - entity: SpaceReductionAction
    initial_state: PROPOSED
    terminal_states: [EXECUTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /leasing/space-reduction-actions/{id}/approve"
        actor: GSAAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /leasing/space-reduction-actions/{id}/execute"
        actor: GSAPropertyManager
        preconditions:
          - "oa.status == ACTIVE (ERR_OA_NOT_ACTIVE)"
        side_effects:
          - "OA.assigned_sf -= recommended_release_sf; amendment_history appended (delta_sf = -recommended_release_sf); OA.version += 1 (cascade link 1)"
          - "owned OA: building.available_sf += recommended_release_sf (cascade link 2, caused by the OA mutation); leased OA: space released against the lease"
          - "executed_release_sf = recommended_release_sf; executed_at = current logical clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: oa-amend-stale-version
    parent_entity: OccupancyAgreement
    write_endpoint: "POST /leasing/occupancy-agreements/{id}/amend"
    occ_field: expected_oa_version
    description: |
      Amending an OccupancyAgreement whose version has advanced since the
      client last observed it is rejected. A newer amendment legitimately
      supersedes the client's stale view (amendments may be issued in
      sequence and each rewrites assigned_sf / end_date / owned rates), so
      the stale writer must re-read and rebase before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: alteration-revise-stale-version
    parent_entity: AlterationRequest
    write_endpoint: "POST /leasing/alteration-requests/{id}/revise"
    occ_field: expected_alteration_version
    description: |
      Revising an AlterationRequest whose version has advanced since the
      client last observed it is rejected. A revision legitimately supersedes
      the prior pending estimate (it clears the estimate fields and reopens
      the request), so a stale revision writer must re-read before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money in integer cents; all rounding round_half_up unless stated otherwise.
# =============================================================================
calculations:
  - name: headcount_projection
    trigger: "SpaceRequirement validate (SUBMITTED -> VALIDATED)"
    algorithm: forward_looking
    formula: |
      years = max(0, target_occupancy_year - year(current logical clock at validate))
      projected_headcount = round_half_up(base_headcount * (1 + annual_growth_pct) ^ years)
      required_usable_sf = projected_headcount * sf_per_person + sum(special_needs[].sf)
    input_set: "The SpaceRequirement being validated"
    constants:
      MAX_GROWTH_PCT: 0.10
    precision: "headcount rounded to whole persons, round_half_up; sf integer"
    variants: []

  - name: security_level_determination
    trigger: "SpaceRequirement validate (SUBMITTED -> VALIDATED)"
    algorithm: weighted_scoring
    formula: |
      points = mission_points + population_points + size_points + criticality_points
      base_level = 1 if points < 15
                 | 2 if 15 <= points < 30
                 | 3 if 30 <= points < 45
                 | 4 if 45 <= points < 60
                 | 5 if points >= 60
      if any special_needs[].need_type == SCIF: level = max(base_level, 4)
      else: level = base_level
    input_set: "The SpaceRequirement being validated"
    constants:
      L2_MIN_POINTS: 15
      L3_MIN_POINTS: 30
      L4_MIN_POINTS: 45
      L5_MIN_POINTS: 60
      SCIF_FLOOR_LEVEL: 4
    precision: "integer level 1..5"
    variants: []

  - name: tax_escalation
    trigger: "RentBill generation, for leased OAs only (owned OAs: tax_escalation_cents = 0)"
    algorithm: threshold
    formula: |
      sf = oa.assigned_sf
      year = year of billing_month
      stmt = tax statement with greatest tax_year <= year (none -> use base values)
      variant BASE_YEAR_STOP:
        esc_annual = max(0, stmt.actual_tax_per_sf_yr_cents - lease.base_year_tax_per_sf_yr_cents) * sf
        (when no qualifying statement, actual == base -> esc_annual = 0)
      variant CPI_INDEXED:
        ratio = stmt.cpi_index / lease.cpi_base_index
        esc_annual = lease.base_year_tax_per_sf_yr_cents * sf * min(max(ratio - 1, 0), TAX_ESC_CAP_PCT)
      tax_escalation_cents = round_half_up(esc_annual / 12)
    input_set: "OA being billed + its Lease + the Lease's tax_statements"
    constants:
      TAX_ESC_CAP_PCT: 0.20
    precision: "round_half_up at annual level first, then round_half_up(annual/12) to whole cents"
    variants:
      - name: BASE_YEAR_STOP
        when: "lease.escalation_method == BASE_YEAR_STOP"
        difference: "Escalation is the excess of actual over base-year taxes per sf; identical inputs where actual <= base yield 0"
      - name: CPI_INDEXED
        when: "lease.escalation_method == CPI_INDEXED"
        difference: "Escalation indexes base-year taxes by CPI growth capped at 20%; same base taxes and a 5% CPI rise yields a different (usually smaller) escalation than BASE_YEAR_STOP with an actual tax increase"

  - name: ti_amortization_schedule
    trigger: "Lease commence (AWARDED -> COMMENCED)"
    algorithm: tiered_pricing
    formula: |
      P = max(0, ti_buildout_cost_cents - ti_allowance_total_cents)
      n = term_months, r = TI_AMORT_ANNUAL_RATE / 12 = 0.005
      if P == 0: ti_schedule_monthly_cents = [] (no amortization; zero-quantity edge)
      variant ANNUITY:
        level = round_half_up(P * r / (1 - (1 + r) ^ -n))
        schedule[1..n] = level
      variant STRAIGHT_LINE:
        eq_principal = round_half_up(P / n)
        balance = P
        for k in 1..n:
          interest_k = round_half_up(balance * r)
          schedule[k] = eq_principal + interest_k
          balance -= eq_principal
    input_set: "The Lease being commenced"
    constants:
      TI_AMORT_ANNUAL_RATE: 0.06
    precision: "each monthly schedule entry rounded to whole cents, round_half_up, before the next month is computed"
    variants:
      - name: ANNUITY
        when: "ti_amort_method == ANNUITY"
        difference: "Level payment every month (e.g. P=58,500,000, n=120 -> 649,470/month)"
      - name: STRAIGHT_LINE
        when: "ti_amort_method == STRAIGHT_LINE"
        difference: "Equal principal plus interest on the declining balance; front-loaded (same inputs -> month 1 = 780,000, month 2 = 777,563), so early bills differ from ANNUITY"

  - name: monthly_rent_bill
    trigger: "RentBill generation (POST /leasing/occupancy-agreements/{id}/bills)"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (circular-looking: fee is on the post-abatement subtotal,
      and the subtotal contains amortizations that depend on prior completions):
      (1) month_index = (bill_y - comm_y) * 12 + (bill_m - comm_m) + 1   [leased; 1-based from commencement month]
      (2) shell_cents = round_half_up(shell_rate * assigned_sf / 12)     [leased: lease.shell_rate_per_sf_yr_cents; owned: oa.shell_equivalent_rate_per_sf_yr_cents]
      (3) operating_cents = round_half_up(op_rate * assigned_sf / 12)
      (4) abatement_credit_cents = shell_cents when leased AND month_index <= lease.free_rent_months, else 0
      (5) tax_escalation_cents per tax_escalation (leased only; owned = 0)
      (6) ti_amortization_cents = lease.ti_schedule_monthly_cents[month_index] when leased AND 1 <= month_index <= lease.term_months AND schedule non-empty, else 0
      (7) alteration_amortization_cents = sum of monthly_amort_cents over the OA's COMPLETED AMORTIZED alterations whose [amortization_start_month, OA end month] covers billing_month
      (8) lump_sum_charges_cents = sum of estimated_cost_cents over the OA's COMPLETED LUMP_SUM alterations whose completion month is the month immediately preceding billing_month
      (9) subtotal = shell_cents - abatement_credit_cents + operating_cents + tax_escalation_cents + ti_amortization_cents + alteration_amortization_cents + lump_sum_charges_cents
      (10) fee_cents = round_half_up(subtotal * FEE_PCT)
      (11) service_credit_applied_cents = min(oa.pending_service_credit_cents, subtotal + fee_cents)
      (12) total_cents = subtotal + fee_cents - service_credit_applied_cents
      (13) oa.pending_service_credit_cents -= service_credit_applied_cents
    input_set: "The OA (must be ACTIVE), its Lease when leased, the OA's alterations, and the OA's pending service credits"
    constants:
      FEE_PCT: 0.05
    precision: "integer cents; per-component rounding round_half_up BEFORE summing (component-first order pinned)"
    variants: []

  - name: alteration_amortization
    trigger: "AlterationRequest complete (APPROVED -> COMPLETED) when funding_method == AMORTIZED"
    algorithm: tiered_pricing
    formula: |
      P = estimated_cost_cents
      r = ALTERATION_AMORT_ANNUAL_RATE / 12
      n = months from the month after completion month through OA end month, inclusive
      monthly_amort_cents = round_half_up(P * r / (1 - (1 + r) ^ -n))     [round the monthly payment FIRST]
      balance = P (exact, unrounded)
      for k in 1..n-1: balance = balance * (1 + r) - monthly_amort_cents
      final_month_cents = round_half_up(balance * (1 + r))                [residual absorbed by the LAST month]
      Billed schedule: months amortization_start_month .. OA end month - 1 -> monthly_amort_cents;
      OA end month -> final_month_cents. Rounding order pinned: monthly first, residual last;
      "round total then divide" is forbidden and produces different cents.
    input_set: "The AlterationRequest being completed + its OA's end_date"
    constants:
      ALTERATION_AMORT_ANNUAL_RATE: 0.07
      MIN_AMORTIZATION_MONTHS: 12
    precision: "monthly payment rounded half-up to cents first; final month absorbs the residual"
    variants: []

  - name: utilization_rate
    trigger: "UtilizationSurvey finalize (RECORDED -> FINALIZED)"
    algorithm: aggregation
    formula: |
      variant SPACE_BASED:      rate = utilized_sf / oa.assigned_sf
      variant HEADCOUNT_BASED:  rate = (measured_headcount * TARGET_SF_PER_PERSON) / oa.assigned_sf
      utilization_rate = round_half_up(rate, 4 decimal places)
      recommended_release_sf = max(0, oa.assigned_sf - measured_headcount * TARGET_SF_PER_PERSON)
      if utilization_rate < UTILIZATION_THRESHOLD (strictly less): auto-create SpaceReductionAction PROPOSED
      (rate exactly == 0.6000 does NOT trigger)
    input_set: "The survey being finalized + its OA's current assigned_sf"
    constants:
      TARGET_SF_PER_PERSON: 150
      UTILIZATION_THRESHOLD: 0.60
    precision: "4 decimal places, round_half_up"
    variants:
      - name: SPACE_BASED
        when: "survey.method == SPACE_BASED"
        difference: "Measures the space directly: rate = utilized_sf / assigned_sf"
      - name: HEADCOUNT_BASED
        when: "survey.method == HEADCOUNT_BASED"
        difference: "Derives utilization from observed headcount against the 150 sf/person standard; identical survey payloads produce a different rate (e.g. utilized 12,000 of 20,000 sf -> 0.6000 vs headcount 100 -> 0.7500)"

  - name: expiration_option_scoring
    trigger: "ExpirationPlan select-option (OPEN -> OPTION_SELECTED)"
    algorithm: weighted_scoring
    formula: |
      horizon = HORIZON_MONTHS = 120 months (10 years); sf = lease.leased_sf
      SUCCEEDING_LEASE:        cost = (succeeding_shell_rate + succeeding_operating_rate) * sf * 10
      RELOCATION:              cost = relocation_move_cost_cents + relocation_downtime_cost_cents + (market_shell_rate + market_operating_rate) * sf * 10
      REPLACEMENT_CONSTRUCTION: cost = round_half_up(construction_cost_cents * 120 / 300) + construction_operating_rate * sf * 10
      recommended_option = argmin(projected_cost_cents); ties broken by fixed priority
        SUCCEEDING_LEASE > RELOCATION > REPLACEMENT_CONSTRUCTION
    input_set: "The plan's lease + the cost parameters supplied at select-option"
    constants:
      HORIZON_MONTHS: 120
      CONSTRUCTION_AMORT_MONTHS: 300
    precision: "integer cents"
    variants: []

  - name: sla_service_credit
    trigger: "ServiceTicket verify (RESOLVED -> VERIFIED)"
    algorithm: threshold
    formula: |
      sla_hours = 24 when severity == CRITICAL else 72
      hours_open = (resolved_at - created_at) in hours (exact)
      sla_breached = hours_open > sla_hours   [strictly greater; exactly sla_hours is NOT a breach]
      hours_over = hours_open - sla_hours
      credit_cents = 0 when not breached
                   | min(SLA_CREDIT_CAP_CENTS, SLA_CREDIT_DAILY_CENTS * ceil(hours_over / 24)) when breached
      when credit_cents > 0: oa.pending_service_credit_cents += credit_cents
    input_set: "The ticket being verified + its reported OA"
    constants:
      SLA_HOURS_CRITICAL: 24
      SLA_HOURS_ROUTINE: 72
      SLA_CREDIT_DAILY_CENTS: 10000
      SLA_CREDIT_CAP_CENTS: 100000
    precision: "integer cents; ceil on 24-hour blocks"
    variants: []

  - name: space_inventory_reconciliation
    trigger: "OA create / amend / terminate / expire; SpaceReductionAction execute; Lease award (leased stock)"
    algorithm: aggregation
    formula: |
      FEDERALLY_OWNED building: available_sf = total_sf - sum(assigned_sf of OAs with building_id == building.id and status in {DRAFT, ACTIVE})
      LEASED_STOCK building:    available_sf = total_sf - sum(leased_sf of Leases with building_id == building.id and status in {AWARDED, COMMENCED, EXPIRING})
      Invariant (owned):  sum(assigned_sf over non-terminal OAs) + available_sf == total_sf
      Invariant (leased): sum(leased_sf over non-terminal leases) + available_sf == total_sf
    input_set: "All OAs / Leases of the building"
    constants: {}
    precision: "integer sf"
    variants: []

  - name: receivable_ledger
    trigger: "RentBill generation and every RentBill payment"
    algorithm: aggregation
    formula: |
      oa.receivable_outstanding_cents = sum(bill.total_cents) - sum(bill.amount_paid_cents) over all bills of the OA
      Invariant: generate (+total) and pay (+amount_paid) keep receivable_outstanding_cents == running difference;
      a cancelled LUMP_SUM alteration never enters any bill, so its approve-then-cancel pair leaves the OA's
      billable pipeline unchanged (net 0).
    input_set: "All RentBills of the OA"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "The caller's role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Entity-backed identity: when the role is AgencyManager, X-User-ID must equal the agency_id of the target resource (requirement, OA, bill's OA, alteration's OA, ticket's reported OA); AgencyManager may not act on another agency's resources"
    error_id: ERR_AGENCY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "AgencyManager role-gated endpoints (submit/resubmit, activate, pay, alteration create/approve/revise/cancel, ticket create/verify)"
  - priority: 4
    category: existence
    check: "Path and body-referenced ids must exist, validated left-to-right (path ids first, then body ids such as lease_id/building_id/agency_id on OA create, building_id on offer create, reported_oa_id on ticket create)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or referenced ids"
  - priority: 5
    category: business_constraint
    check: "Request shape and field domains: required fields present; enums in their declared sets; numeric ranges respected (points 0..25, sf_per_person 100..250, free_rent_months 0..24, term_years 5..20, security_capability 1..5, positive amounts); special_needs item shape; measured_at <= current logical clock"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "The target resource must be in a state from which the requested transition exists (covers terminal lockdown and repeated transitions)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "Cross-entity state gates: offer create requires requirement SOLICITING (ERR_REQUIREMENT_NOT_SOLICITING); OA activate (leased) requires lease COMMENCED/EXPIRING (ERR_LEASE_NOT_COMMENCED); tax-statement create requires lease COMMENCED or EXPIRING (ERR_LEASE_NOT_COMMENCED); alteration create/estimate/approve/complete, OA amend, bill generate, survey create require OA ACTIVE (ERR_OA_NOT_ACTIVE); plan execute requires lease EXPIRING (ERR_LEASE_NOT_EXPIRING)"
    error_id: "ERR_REQUIREMENT_NOT_SOLICITING | ERR_LEASE_NOT_COMMENCED | ERR_OA_NOT_ACTIVE | ERR_LEASE_NOT_EXPIRING"
    http_status: 409
    applies_to: "cross-entity gated endpoints"
  - priority: 8
    category: business_safety
    check: "Award safety: offered building's security_capability must be >= requirement.required_security_level"
    error_id: ERR_SECURITY_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /leasing/offers/{id}/select"
  - priority: 9
    category: business_temporal
    check: "Temporal windows: offer.valid_until >= now at select (ERR_OFFER_EXPIRED); commencement_date within [awarded_date, awarded_date + 24 months] (ERR_COMMENCEMENT_OUT_OF_WINDOW); billing_month within [commencement month, OA end month] (ERR_BILL_MONTH_OUT_OF_TERM); whole months from today to lease.end_date >= 12 at select-option (ERR_OPTION_DEADLINE_PASSED); alteration work window leaves >= 14 clear days to other non-CANCELLED alteration windows on the same OA (ERR_ALTERATION_WINDOW_CONFLICT)"
    error_id: "ERR_OFFER_EXPIRED | ERR_COMMENCEMENT_OUT_OF_WINDOW | ERR_BILL_MONTH_OUT_OF_TERM | ERR_OPTION_DEADLINE_PASSED | ERR_ALTERATION_WINDOW_CONFLICT"
    http_status: "422 (409 for ERR_ALTERATION_WINDOW_CONFLICT)"
    applies_to: "select, commence, bill generate, select-option, estimate"
  - priority: 10
    category: business_referential
    check: "Referential structure: OA create must present exactly one of lease_id / building_id (ERR_OA_TENANCY_AMBIGUOUS); building_id OAs only on FEDERALLY_OWNED buildings (ERR_BUILDING_NOT_OWNED); owned OA requires shell_equivalent_rate_per_sf_yr_cents and operating_rate_per_sf_yr_cents present (ERR_INVALID_REQUEST); leased OA [start_date, end_date] within [lease.commencement_date, lease.end_date] (ERR_OA_TERM_EXCEEDS_LEASE); evaluated at OA create only when the lease is already COMMENCED (skipped while the lease is AWARDED because its dates are not yet pinned) and at every amend; ticket.reported_oa_id must be an ACTIVE OA on the ticket's building (ERR_OA_NOT_ACTIVE)"
    error_id: "ERR_OA_TENANCY_AMBIGUOUS | ERR_BUILDING_NOT_OWNED | ERR_INVALID_REQUEST | ERR_OA_TERM_EXCEEDS_LEASE | ERR_OA_NOT_ACTIVE"
    http_status: 422
    applies_to: "OA create/amend (window check skipped while lease AWARDED), ticket create"
  - priority: 11
    category: business_constraint
    check: "Capacity and uniqueness: owned OA create/amend keeps sum(assigned_sf over DRAFT+ACTIVE OAs) <= building.total_sf (ERR_BUILDING_CAPACITY_EXCEEDED); leased OA create/amend keeps sum(assigned_sf over DRAFT+ACTIVE OAs of the lease) <= lease.leased_sf (ERR_LEASE_SPACE_EXCEEDED); one RentBill per (oa, billing_month) (ERR_BILL_ALREADY_EXISTS); at most one ExpirationPlan in OPEN or OPTION_SELECTED per lease (ERR_PLAN_ALREADY_OPEN); tax statement tax_year unique per lease (ERR_DUPLICATE_TAX_YEAR)"
    error_id: "ERR_BUILDING_CAPACITY_EXCEEDED | ERR_LEASE_SPACE_EXCEEDED | ERR_BILL_ALREADY_EXISTS | ERR_PLAN_ALREADY_OPEN | ERR_DUPLICATE_TAX_YEAR"
    http_status: "422 (409 for ERR_BILL_ALREADY_EXISTS, ERR_PLAN_ALREADY_OPEN, ERR_DUPLICATE_TAX_YEAR)"
    applies_to: "OA create/amend, bill generate, plan create, tax-statement create"
  - priority: 12
    category: business_fiscal
    check: "Fiscal gates: AMORTIZED alteration approval requires >= 12 amortization months between the month after work_end month and OA end month (ERR_AMORTIZATION_WINDOW_TOO_SHORT); payment amount_cents must be > 0 and <= remaining balance (ERR_PAYMENT_EXCEEDS_BALANCE)"
    error_id: "ERR_AMORTIZATION_WINDOW_TOO_SHORT | ERR_PAYMENT_EXCEEDS_BALANCE"
    http_status: 422
    applies_to: "alteration approve, bill pay"

# =============================================================================
# §1.5 API Endpoint Table
# Read endpoints list every role explicitly (no "Any" shorthand).
# Nested paths use the literal {id} parent placeholder.
# =============================================================================
endpoints:
  # --- Agency ---
  - method: POST
    path: "/leasing/agencies"
    description: "Register a tenant agency"
    roles: [GSAAdmin]
    code: 201
    input: [bureau_code, name]
    output: Agency
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/leasing/agencies/{id}"
    description: "Get one agency"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # --- Building ---
  - method: POST
    path: "/leasing/buildings"
    description: "Register a federally owned or leased-stock building"
    roles: [GSAAdmin]
    code: 201
    input: [building_name, address, region_code, ownership_type, security_capability, total_sf]
    output: Building
    side_effects: ["status = ACTIVE; available_sf = total_sf"]
  - method: GET
    path: "/leasing/buildings/{id}"
    description: "Get one building (including computed available_sf)"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: []
    output: Building
    side_effects: []

  # --- SpaceRequirement ---
  - method: POST
    path: "/leasing/space-requirements"
    description: "Create a space requirement in DRAFT"
    roles: [AgencyManager]
    code: 201
    input: [agency_id, title, base_headcount, annual_growth_pct, target_occupancy_year, sf_per_person, special_needs, region_code, mission_points, population_points, size_points, criticality_points]
    output: SpaceRequirement
    side_effects: ["status = DRAFT; agency_id must equal the acting AgencyManager's X-User-ID (ERR_AGENCY_SCOPE_VIOLATION)"]
  - method: GET
    path: "/leasing/space-requirements/{id}"
    description: "Get one space requirement"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: []
    output: SpaceRequirement
    side_effects: []
  - method: GET
    path: "/leasing/space-requirements"
    description: "List space requirements, optionally filtered by agency and status"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "SpaceRequirement[]"
    side_effects: []
  - method: POST
    path: "/leasing/space-requirements/{id}/submit"
    description: "Agency submits a DRAFT requirement for GSA review"
    roles: [AgencyManager]
    code: 200
    input: []
    output: SpaceRequirement
    side_effects: ["status DRAFT -> SUBMITTED"]
  - method: POST
    path: "/leasing/space-requirements/{id}/return"
    description: "GSA returns a SUBMITTED requirement for revision"
    roles: [GSALeasingOfficer]
    code: 200
    input: []
    output: SpaceRequirement
    side_effects: ["status SUBMITTED -> NEEDS_REVISION"]
  - method: POST
    path: "/leasing/space-requirements/{id}/resubmit"
    description: "Agency resubmits a returned requirement"
    roles: [AgencyManager]
    code: 200
    input: []
    output: SpaceRequirement
    side_effects: ["status NEEDS_REVISION -> SUBMITTED"]
  - method: POST
    path: "/leasing/space-requirements/{id}/validate"
    description: "GSA validates a SUBMITTED requirement; computes projection, security level, and required square footage"
    roles: [GSALeasingOfficer]
    code: 200
    input: []
    output: SpaceRequirement
    side_effects: ["status SUBMITTED -> VALIDATED; runs headcount_projection and security_level_determination; sets projected_headcount, required_security_level, required_usable_sf"]
  - method: POST
    path: "/leasing/space-requirements/{id}/complete-market-survey"
    description: "Record the market survey and open competitive solicitation"
    roles: [GSALeasingOfficer]
    code: 200
    input: [survey_summary]
    output: SpaceRequirement
    side_effects: ["status VALIDATED -> SOLICITING; survey_summary stored"]

  # --- LeaseOffer ---
  - method: POST
    path: "/leasing/space-requirements/{id}/offers"
    description: "Lessor submits a competitive offer against a SOLICITING requirement"
    roles: [LessorRep]
    code: 201
    input: [building_id, lessor_name, shell_rate_per_sf_yr_cents, operating_rate_per_sf_yr_cents, base_year_tax_per_sf_yr_cents, escalation_method, ti_allowance_per_sf_cents, free_rent_months, term_years, valid_until]
    output: LeaseOffer
    side_effects: ["status = SUBMITTED; requires requirement SOLICITING (ERR_REQUIREMENT_NOT_SOLICITING)"]
  - method: GET
    path: "/leasing/offers/{id}"
    description: "Get one offer"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: []
    output: LeaseOffer
    side_effects: []
  - method: GET
    path: "/leasing/offers"
    description: "List offers filtered by requirement, building, or status"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["requirement_id?", "building_id?", "status?", "limit?", "offset?"]
    output: "LeaseOffer[]"
    side_effects: []
  - method: POST
    path: "/leasing/offers/{id}/evaluate"
    description: "Move an offer into evaluation"
    roles: [GSALeasingOfficer]
    code: 200
    input: []
    output: LeaseOffer
    side_effects: ["status SUBMITTED -> UNDER_EVALUATION"]
  - method: POST
    path: "/leasing/offers/{id}/select"
    description: "Award the lease to this offer; creates the Lease and rejects sibling offers"
    roles: [GSALeasingOfficer]
    code: 201
    input: []
    output: Lease
    side_effects: ["offer UNDER_EVALUATION -> SELECTED; requirement -> AWARDED; sibling non-terminal offers -> REJECTED (AUTO_NOT_SELECTED); Lease created AWARDED; building.available_sf -= leased_sf"]
  - method: POST
    path: "/leasing/offers/{id}/withdraw"
    description: "Lessor withdraws a non-terminal offer"
    roles: [LessorRep]
    code: 200
    input: []
    output: LeaseOffer
    side_effects: ["status -> WITHDRAWN; rejection_reason = WITHDRAWN_BY_LESSOR"]

  # --- Lease ---
  - method: GET
    path: "/leasing/leases/{id}"
    description: "Get one lease (including TI schedule and tax statements)"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: "/leasing/leases"
    description: "List leases filtered by requirement, building, agency, awarding offer, or predecessor lease"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["requirement_id?", "building_id?", "agency_id?", "offer_id?", "succeeds_lease_id?", "status?", "limit?", "offset?"]
    output: "Lease[]"
    side_effects: []
  - method: POST
    path: "/leasing/leases/{id}/commence"
    description: "Commence an awarded lease; fixes the term window and TI amortization schedule"
    roles: [GSALeasingOfficer]
    code: 200
    input: [commencement_date, ti_buildout_cost_cents, ti_amort_method, "cpi_base_index?"]
    output: Lease
    side_effects: ["status AWARDED -> COMMENCED; end_date computed; runs ti_amortization_schedule"]
  - method: POST
    path: "/leasing/leases/{id}/tax-statements"
    description: "Record an annual actual-tax statement from the lessor"
    roles: [GSALeasingOfficer]
    code: 201
    input: [tax_year, actual_tax_per_sf_yr_cents, "cpi_index?"]
    output: Lease
    side_effects: ["statement appended to tax_statements; current_tax_per_sf_yr_cents/current_cpi_index recomputed; lease.version += 1; cpi_index required iff escalation_method == CPI_INDEXED (ERR_INVALID_REQUEST); duplicate tax_year rejected (ERR_DUPLICATE_TAX_YEAR)"]

  # --- ExpirationPlan ---
  - method: POST
    path: "/leasing/leases/{id}/expiration-plans"
    description: "Open an expiration plan for a lease (at most one non-terminal plan per lease)"
    roles: [GSALeasingOfficer]
    code: 201
    input: []
    output: ExpirationPlan
    side_effects: ["status = OPEN; requires lease COMMENCED or EXPIRING (ERR_INVALID_STATE_TRANSITION); ERR_PLAN_ALREADY_OPEN when another plan is OPEN/OPTION_SELECTED"]
  - method: GET
    path: "/leasing/leases/{id}/expiration-plans"
    description: "List expiration plans of a lease"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "ExpirationPlan[]"
    side_effects: []
  - method: POST
    path: "/leasing/expiration-plans/{id}/select-option"
    description: "Score all three expiration options from the supplied cost parameters and record the officer's selected option"
    roles: [GSALeasingOfficer]
    code: 200
    input: [option, succeeding_shell_rate, succeeding_operating_rate, succeeding_term_years, relocation_move_cost_cents, relocation_downtime_cost_cents, market_shell_rate, market_operating_rate, construction_cost_cents, construction_operating_rate]
    output: ExpirationPlan
    side_effects: ["status OPEN -> OPTION_SELECTED; runs expiration_option_scoring; cost_params stored; ERR_OPTION_DEADLINE_PASSED when fewer than 12 whole months remain"]
  - method: POST
    path: "/leasing/expiration-plans/{id}/execute"
    description: "Execute the selected option; branch side effects create the succeeding lease, relocation requirement, or construction project"
    roles: [GSALeasingOfficer]
    code: 200
    input: []
    output: ExpirationPlan
    side_effects: ["status OPTION_SELECTED -> EXECUTED; lease.executed_option set; option-specific artifacts created (see state machine)"]

  # --- OccupancyAgreement ---
  - method: POST
    path: "/leasing/occupancy-agreements"
    description: "Establish an occupancy agreement with a tenant agency over leased or owned space"
    roles: [GSALeasingOfficer]
    code: 201
    input: ["lease_id?", "building_id?", agency_id, assigned_sf, start_date, end_date, "shell_equivalent_rate_per_sf_yr_cents?", "operating_rate_per_sf_yr_cents?"]
    output: OccupancyAgreement
    side_effects: ["status = DRAFT; pricing_source computed; owned OA: building.available_sf -= assigned_sf at creation (reservation)"]
  - method: GET
    path: "/leasing/occupancy-agreements/{id}"
    description: "Get one occupancy agreement"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: []
    output: OccupancyAgreement
    side_effects: []
  - method: GET
    path: "/leasing/occupancy-agreements"
    description: "List occupancy agreements filtered by lease, building, agency, or status"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["lease_id?", "building_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: "OccupancyAgreement[]"
    side_effects: []
  - method: POST
    path: "/leasing/occupancy-agreements/{id}/activate"
    description: "Tenant agency signs the OA; leased OAs require a commenced lease"
    roles: [AgencyManager]
    code: 200
    input: []
    output: OccupancyAgreement
    side_effects: ["status DRAFT -> ACTIVE"]
  - method: POST
    path: "/leasing/occupancy-agreements/{id}/terminate"
    description: "Terminate an OA early; releases space, cancels in-flight alterations, accelerates amortization balances"
    roles: [GSALeasingOfficer]
    code: 200
    input: []
    output: OccupancyAgreement
    side_effects: ["status -> TERMINATED; owned space released; non-terminal alterations CANCELLED with lump-charge reversal; amortization balances accelerated to terminal_writeoff_cents"]
  - method: POST
    path: "/leasing/occupancy-agreements/{id}/amend"
    description: "Amend an ACTIVE OA (OCC-guarded); adjusts square footage, term, or owned-space rates"
    roles: [GSALeasingOfficer]
    code: 200
    input: [expected_oa_version, "delta_sf?", "new_end_date?", "new_shell_equivalent_rate_per_sf_yr_cents?", "new_operating_rate_per_sf_yr_cents?", "note?"]
    output: OccupancyAgreement
    side_effects: ["oa.version += 1 (increments OccupancyAgreement.version by 1); amendment_history appended; assigned_sf and building.available_sf adjusted; capacity re-checked"]
  - method: POST
    path: "/leasing/occupancy-agreements/{id}/bills"
    description: "Generate the rent bill for a billing month (shell, operating, tax escalation, TI and alteration amortization, abatements, fee, service credits)"
    roles: [GSAPropertyManager]
    code: 201
    input: [billing_month]
    output: RentBill
    side_effects: ["runs monthly_rent_bill; OA.pending_service_credit_cents consumed; OA.receivable_outstanding_cents recomputed"]
  - method: GET
    path: "/leasing/occupancy-agreements/{id}/bills"
    description: "List rent bills of an OA"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RentBill[]"
    side_effects: []

  # --- RentBill ---
  - method: POST
    path: "/leasing/rent-bills/{id}/pay"
    description: "Agency pays all or part of a bill"
    roles: [AgencyManager]
    code: 200
    input: [amount_cents]
    output: RentBill
    side_effects: ["amount_paid_cents increased; status -> PARTIALLY_PAID or PAID; OA.receivable_outstanding_cents recomputed"]

  # --- AlterationRequest ---
  - method: POST
    path: "/leasing/occupancy-agreements/{id}/alteration-requests"
    description: "Agency requests a space alteration during the term"
    roles: [AgencyManager]
    code: 201
    input: [title, description, scope_sf]
    output: AlterationRequest
    side_effects: ["status = REQUESTED; requires OA ACTIVE (ERR_OA_NOT_ACTIVE)"]
  - method: GET
    path: "/leasing/occupancy-agreements/{id}/alteration-requests"
    description: "List alteration requests of an OA"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AlterationRequest[]"
    side_effects: []
  - method: POST
    path: "/leasing/alteration-requests/{id}/estimate"
    description: "GSA prices the alteration and proposes the work window"
    roles: [GSAPropertyManager]
    code: 200
    input: [estimated_cost_cents, work_start_date, work_end_date]
    output: AlterationRequest
    side_effects: ["status REQUESTED -> ESTIMATED; estimate fields stored"]
  - method: POST
    path: "/leasing/alteration-requests/{id}/approve"
    description: "Agency approves the estimate and chooses the funding method"
    roles: [AgencyManager]
    code: 200
    input: [funding_method]
    output: AlterationRequest
    side_effects: ["status ESTIMATED -> APPROVED; LUMP_SUM: lump_charge_status = PENDING; AMORTIZED: amortization window feasibility enforced"]
  - method: POST
    path: "/leasing/alteration-requests/{id}/revise"
    description: "Agency sends an estimate back for revised scope (OCC-guarded); clears the pending estimate"
    roles: [AgencyManager]
    code: 200
    input: [expected_alteration_version, "description?", "scope_sf?"]
    output: AlterationRequest
    side_effects: ["status ESTIMATED -> REQUESTED; alteration.version += 1 (increments AlterationRequest.version by 1); estimate fields cleared"]
  - method: POST
    path: "/leasing/alteration-requests/{id}/complete"
    description: "GSA records completion; AMORTIZED alterations get their amortization schedule"
    roles: [GSAPropertyManager]
    code: 200
    input: [completion_date]
    output: AlterationRequest
    side_effects: ["status APPROVED -> COMPLETED; runs alteration_amortization for AMORTIZED funding"]
  - method: POST
    path: "/leasing/alteration-requests/{id}/cancel"
    description: "Agency cancels a non-terminal alteration; a pending lump-sum charge is reversed"
    roles: [AgencyManager]
    code: 200
    input: []
    output: AlterationRequest
    side_effects: ["status -> CANCELLED; lump_charge_status PENDING -> REVERSED"]

  # --- ServiceTicket ---
  - method: POST
    path: "/leasing/buildings/{id}/service-tickets"
    description: "Report an operations, maintenance, or security service issue in leased or owned space"
    roles: [AgencyManager, GSAPropertyManager]
    code: 201
    input: [reported_oa_id, category, severity, description]
    output: ServiceTicket
    side_effects: ["status = OPEN; reported_oa_id must resolve to an ACTIVE OA on this building (ERR_OA_NOT_ACTIVE); AgencyManager caller: that OA must belong to the caller's agency (ERR_AGENCY_SCOPE_VIOLATION)"]
  - method: GET
    path: "/leasing/buildings/{id}/service-tickets"
    description: "List service tickets of a building"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ServiceTicket[]"
    side_effects: []
  - method: POST
    path: "/leasing/service-tickets/{id}/resolve"
    description: "Mark the ticket resolved; stamps resolved_at from the logical clock"
    roles: [GSAPropertyManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status OPEN -> RESOLVED; resolved_at set"]
  - method: POST
    path: "/leasing/service-tickets/{id}/verify"
    description: "Tenant agency verifies the resolution; SLA breach posts a service credit to the OA"
    roles: [AgencyManager]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["status RESOLVED -> VERIFIED; runs sla_service_credit; breached: OA.pending_service_credit_cents += credit_cents"]

  # --- UtilizationSurvey ---
  - method: POST
    path: "/leasing/occupancy-agreements/{id}/utilization-surveys"
    description: "Record a utilization measurement against an ACTIVE OA"
    roles: [GSAPropertyManager]
    code: 201
    input: [method, measured_headcount, utilized_sf, measured_at]
    output: UtilizationSurvey
    side_effects: ["status = RECORDED; requires OA ACTIVE (ERR_OA_NOT_ACTIVE)"]
  - method: GET
    path: "/leasing/occupancy-agreements/{id}/utilization-surveys"
    description: "List utilization surveys of an OA"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "UtilizationSurvey[]"
    side_effects: []
  - method: POST
    path: "/leasing/utilization-surveys/{id}/finalize"
    description: "Finalize the survey; computes the utilization rate and auto-proposes a space reduction when below threshold"
    roles: [GSAPropertyManager]
    code: 200
    input: []
    output: UtilizationSurvey
    side_effects: ["status RECORDED -> FINALIZED; runs utilization_rate; rate < 0.60 -> SpaceReductionAction PROPOSED created and linked"]

  # --- SpaceReductionAction ---
  - method: GET
    path: "/leasing/occupancy-agreements/{id}/space-reduction-actions"
    description: "List space reduction actions of an OA"
    roles: [GSAAdmin, GSALeasingOfficer, GSAPropertyManager, AgencyManager, LessorRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SpaceReductionAction[]"
    side_effects: []
  - method: POST
    path: "/leasing/space-reduction-actions/{id}/approve"
    description: "Approve a proposed space reduction (segregated from proposal and execution)"
    roles: [GSAAdmin]
    code: 200
    input: []
    output: SpaceReductionAction
    side_effects: ["status PROPOSED -> APPROVED"]
  - method: POST
    path: "/leasing/space-reduction-actions/{id}/execute"
    description: "Execute an approved reduction; amends the OA down and releases the space"
    roles: [GSAPropertyManager]
    code: 200
    input: []
    output: SpaceReductionAction
    side_effects: ["status APPROVED -> EXECUTED; OA.assigned_sf reduced with amendment_history entry and version bump; building.available_sf increased for owned OAs"]

  # --- Logical clock (test-driving endpoint, outside the public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. Setting the clock sweeps time-based transitions: Lease COMMENCED -> EXPIRING at end_date - 18 months; Lease EXPIRING -> EXPIRED/SUCCEEDED after end_date (with OA/alteration/plan cascades); OA ACTIVE -> EXPIRED after its end_date."
    roles: [GSAAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, transitioned_lease_ids: "string[]", transitioned_oa_ids: "string[]", transitioned_plan_ids: "string[]" }
    side_effects: ["clock advanced (monotonic; to_iso8601 must be >= current clock, else ERR_INVALID_REQUEST); time-based transitions applied per state machines"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller's role is not in the endpoint's roles list" }
  - { id: ERR_AGENCY_SCOPE_VIOLATION, http: 403, condition: "AgencyManager acts on a resource whose agency_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum outside declared set, numeric range violated, malformed special_needs item, measured_at in the future, cpi_base_index/cpi_index presence mismatch with escalation_method, owned OA missing its rate inputs, work_end_date before work_start_date, non-monotonic clock set" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not defined from the resource's current state (includes terminal-state lockdown and repeated transitions)" }
  - { id: ERR_REQUIREMENT_NOT_SOLICITING, http: 409, condition: "Offer create or select attempted while the requirement is not SOLICITING" }
  - { id: ERR_LEASE_NOT_COMMENCED, http: 409, condition: "Leased OA activation or tax-statement recording attempted while the lease is not COMMENCED/EXPIRING" }
  - { id: ERR_LEASE_NOT_EXPIRING, http: 409, condition: "ExpirationPlan execute attempted while the lease is not EXPIRING" }
  - { id: ERR_OA_NOT_ACTIVE, http: 409, condition: "Alteration estimate/approve/complete, OA amend, bill generation, survey creation, or ticket reference attempted against a non-ACTIVE OA" }
  - { id: ERR_SECURITY_LEVEL_INSUFFICIENT, http: 422, condition: "Offered building's security_capability below the requirement's required_security_level at award" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "Offer's valid_until is before the current logical clock at select" }
  - { id: ERR_COMMENCEMENT_OUT_OF_WINDOW, http: 422, condition: "commencement_date before awarded_date or more than 24 months after it" }
  - { id: ERR_BILL_MONTH_OUT_OF_TERM, http: 422, condition: "billing_month before commencement month or after OA end month" }
  - { id: ERR_OPTION_DEADLINE_PASSED, http: 422, condition: "Fewer than 12 whole calendar months remain to lease end at select-option" }
  - { id: ERR_ALTERATION_WINDOW_CONFLICT, http: 409, condition: "Proposed alteration work window leaves fewer than 14 clear days to another non-CANCELLED alteration window on the same OA" }
  - { id: ERR_OA_TENANCY_AMBIGUOUS, http: 422, condition: "OA create presents both lease_id and building_id, or neither" }
  - { id: ERR_BUILDING_NOT_OWNED, http: 422, condition: "OA create with building_id against a LEASED_STOCK building" }
  - { id: ERR_OA_TERM_EXCEEDS_LEASE, http: 422, condition: "Leased OA start/end dates fall outside [lease.commencement_date, lease.end_date] (create or amend)" }
  - { id: ERR_BUILDING_CAPACITY_EXCEEDED, http: 422, condition: "Owned OA create/amend or lease award would push committed square footage above the building's total_sf" }
  - { id: ERR_LEASE_SPACE_EXCEEDED, http: 422, condition: "Leased OA create/amend would push committed square footage above the lease's leased_sf" }
  - { id: ERR_BILL_ALREADY_EXISTS, http: 409, condition: "A RentBill already exists for this OA and billing_month" }
  - { id: ERR_PLAN_ALREADY_OPEN, http: 409, condition: "The lease already has an ExpirationPlan in OPEN or OPTION_SELECTED" }
  - { id: ERR_DUPLICATE_TAX_YEAR, http: 409, condition: "A tax statement for this tax_year already exists on the lease" }
  - { id: ERR_AMORTIZATION_WINDOW_TOO_SHORT, http: 422, condition: "AMORTIZED approval with fewer than 12 amortization months between the month after work_end month and OA end month" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount_cents <= 0 or greater than the bill's remaining balance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_oa_version / expected_alteration_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GSAAdmin
    description: "GSA central administrator: registers agencies and buildings, drives the logical clock, approves space reductions"
    identity: opaque
    exclusive_operations:
      - "POST /leasing/agencies"
      - "POST /leasing/buildings"
      - "POST /_clock/set_current_utc"
      - "POST /leasing/space-reduction-actions/{id}/approve"
    shared_operations: ["all GET endpoints"]
  - name: GSALeasingOfficer
    description: "GSA leasing specialist: validates requirements, runs the market survey and competitive procurement, awards and administers leases, establishes and amends occupancy agreements, runs expiration planning"
    identity: opaque
    exclusive_operations:
      - "POST /leasing/space-requirements/{id}/return"
      - "POST /leasing/space-requirements/{id}/validate"
      - "POST /leasing/space-requirements/{id}/complete-market-survey"
      - "POST /leasing/offers/{id}/evaluate"
      - "POST /leasing/offers/{id}/select"
      - "POST /leasing/leases/{id}/commence"
      - "POST /leasing/leases/{id}/tax-statements"
      - "POST /leasing/leases/{id}/expiration-plans"
      - "POST /leasing/expiration-plans/{id}/select-option"
      - "POST /leasing/expiration-plans/{id}/execute"
      - "POST /leasing/occupancy-agreements"
      - "POST /leasing/occupancy-agreements/{id}/amend"
      - "POST /leasing/occupancy-agreements/{id}/terminate"
    shared_operations: ["all GET endpoints"]
  - name: GSAPropertyManager
    description: "GSA property/facilities manager: prices and completes alterations, delivers building services, generates rent bills, measures utilization, executes approved space reductions"
    identity: opaque
    exclusive_operations:
      - "POST /leasing/alteration-requests/{id}/estimate"
      - "POST /leasing/alteration-requests/{id}/complete"
      - "POST /leasing/service-tickets/{id}/resolve"
      - "POST /leasing/occupancy-agreements/{id}/bills"
      - "POST /leasing/occupancy-agreements/{id}/utilization-surveys"
      - "POST /leasing/utilization-surveys/{id}/finalize"
      - "POST /leasing/space-reduction-actions/{id}/execute"
    shared_operations: ["all GET endpoints", "POST /leasing/buildings/{id}/service-tickets"]
  - name: AgencyManager
    description: "Tenant agency space manager: develops and submits requirements, signs OAs, requests/approves/revises/cancels alterations, pays rent bills, reports and verifies service tickets"
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /leasing/space-requirements"
      - "POST /leasing/space-requirements/{id}/submit"
      - "POST /leasing/space-requirements/{id}/resubmit"
      - "POST /leasing/occupancy-agreements/{id}/activate"
      - "POST /leasing/occupancy-agreements/{id}/alteration-requests"
      - "POST /leasing/alteration-requests/{id}/approve"
      - "POST /leasing/alteration-requests/{id}/revise"
      - "POST /leasing/alteration-requests/{id}/cancel"
      - "POST /leasing/rent-bills/{id}/pay"
      - "POST /leasing/service-tickets/{id}/verify"
    shared_operations: ["all GET endpoints", "POST /leasing/buildings/{id}/service-tickets"]
  - name: LessorRep
    description: "Private lessor representative: submits competitive lease offers and withdraws them"
    identity: opaque
    exclusive_operations:
      - "POST /leasing/space-requirements/{id}/offers"
      - "POST /leasing/offers/{id}/withdraw"
    shared_operations: ["all GET endpoints"]
