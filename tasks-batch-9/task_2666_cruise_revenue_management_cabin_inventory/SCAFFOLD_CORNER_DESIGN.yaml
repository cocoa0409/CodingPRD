              payload: { target_cabin_category_id: "${cat_ov}", bid_amount_per_guest_cents: 40000 }
              as: Guest
              as_user_id: "${g_nell}"
              captures: { e1: $.data.error_id }
            - call: "POST /bookings/${bk_nell}/upgrade-bids"
              payload: { target_cabin_category_id: "00000000-0000-4000-8000-0000000000ff", bid_amount_per_guest_cents: 40000 }
              as: Guest
              as_user_id: "${g_nell}"
              captures: { e2: $.data.error_id }
