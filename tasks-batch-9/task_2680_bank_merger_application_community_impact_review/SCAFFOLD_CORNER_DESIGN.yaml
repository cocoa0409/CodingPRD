      - name: parallel_state_dimensions_advance_independently
        claim_type: "state_machine_shape parallel - independent state dimensions change independently"
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[MergerApplication.public_review_status]
        excluded_because:
          difficulty_instance: merger_application_parallel_review_dimension_advances_while_filing_dimension_holds
          rationale: "that §1.8 instance already grants a hearing so public_review_status moves HEARING_PENDING -> HEARING_GRANTED and the period extends, while filing_status stays UNDER_REVIEW and amendment_round stays 0 - exactly the independent-dimension claim"

      - name: report_status_can_loop_back_to_filed_and_forward_again
        claim_type: "state_machine_shape cyclic - entity can loop back"
        grounds:
          - state_machines[CommitmentPerformanceReport.status]
        excluded_because:
          difficulty_instance: performance_report_review_reopen_review_cycle_on_commitment_ledger
          rationale: "that §1.8 instance drives FILED -> DEFICIENT -> FILED -> ACCEPTED on one report and checks the ledger at every hop, which subsumes any standalone cycle claim"

      - name: transition_guarded_by_another_entity_state
        claim_type: guarded transitions
        grounds:
          - state_machines[SystemsConversionPlan.status].transitions[DISCLOSED -> CONVERTED].preconditions
        excluded_because:
          difficulty_instance: systems_conversion_blocked_until_decision_is_consummated
          rationale: "that §1.8 instance is precisely the cross-entity guard: convert fails with ERR_INVALID_DECISION_STATE while the ApprovalDecision is ISSUED and succeeds once it is CONSUMMATED"

      - name: multi_level_cascade_down_from_a_single_transition
        claim_type: Cascade down
        grounds:
          - state_machines[CommitmentPerformanceReport.status].transitions[FILED -> DEFICIENT].side_effects
        excluded_because:
          difficulty_instance: deficient_report_cascades_to_post_closing_monitoring_escalation
          rationale: "that §1.8 instance walks the four-link chain report -> plan counters -> condition BREACHED -> application ESCALATED and asserts each link, so a separate cascade-down claim would duplicate it"

      - name: undo_transition_reverses_every_side_effect
        claim_type: Compensation
        grounds:
          - state_machines[CommitmentPerformanceReport.status].transitions[ACCEPTED -> FILED].side_effects
        excluded_because:
          difficulty_instance: report_reopen_restores_the_commitment_ledger_partition
          rationale: "that §1.8 instance reopens a reviewed report and proves credited_to_date_usd + remaining_commitment_usd is conserved with no drift on any line item"

      - name: state_change_updates_the_ancestor_ledger_field
        claim_type: Ledger sync
        grounds:
          - state_machines[Branch.status].transitions[OPEN -> DESIGNATED_FOR_DIVESTITURE].side_effects
        excluded_because:
          difficulty_instance: designate_then_rescind_restores_market_base_and_pre_merger_hhi
          rationale: "that §1.8 instance already reconciles the market-level aggregates before and after a designation and its rescission, which is the ledger-sync claim for this scaffold"

