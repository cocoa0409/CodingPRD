scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_student_with_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Student
          - endpoints."POST /vks/students"
        distinguishing_aspect: "POST /vks/students with all required fields returns 201 and an id, version=1, enrollment_status=APPLIED"
        test_recipe:
          setup: ["District D exists"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-100", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 100 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
          trigger:
            - call: "POST /vks/students"
              payload: { legal_name: "Yara", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
          assert:
            - "Student.${student_id}.enrollment_status == APPLIED"
            - "Student.${student_id}.version == 1"
            - "Student.${student_id}.special_education_flag == false"
      - name: create_student_with_default_special_education_flag
        claim_type: defaults
        grounds:
          - entities.Student.fields.special_education_flag
        distinguishing_aspect: "special_education_flag defaults to false when omitted from the POST payload"
        test_recipe:
          setup: ["District D exists"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-101", state_code: "TX", funding_rate_cents: 400, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
          trigger:
            - call: "POST /vks/students"
              payload: { legal_name: "Zack", date_of_birth: "2011-02-02T00:00:00Z", grade_level: 8, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
          assert:
            - "Student.${student_id}.special_education_flag == false"
      - name: get_student_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Student
          - endpoints."GET /vks/students/{id}"
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a non-existent UUID returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /vks/students/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EnrollmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_NOT_FOUND"
      - name: list_students_pagination_defaults
        claim_type: listing
        grounds:
          - entities.Student
          - endpoints."GET /vks/students"
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /vks/students returns pagination fields with default limit=10, offset=0"
        test_recipe:
          setup:
            - "District D exists; 3 students created"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-102", state_code: "WA", funding_rate_cents: 400, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "A1", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
            - call: "POST /vks/students"
              payload: { legal_name: "A2", date_of_birth: "2012-01-02T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
            - call: "POST /vks/students"
              payload: { legal_name: "A3", date_of_birth: "2012-01-03T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
          trigger:
            - call: "GET /vks/students"
              payload: {}
              as: EnrollmentOfficer
          assert:
            - "response contains meta.api_request_id and meta.api_request_timestamp"
            - "response.response_type == array"
            - "pagination fields limit, offset, total_count, has_more present"
            - "total_count >= 3"
      - name: create_student_grade_level_out_of_range
        claim_type: type_constraints
        grounds:
          - entities.Student.fields.grade_level
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "grade_level=13 is rejected with ERR_INVALID_REQUEST (must be in [0,12])"
        test_recipe:
          setup: ["District D exists"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-103", state_code: "OR", funding_rate_cents: 400, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
          trigger:
            - call: "POST /vks/students"
              payload: { legal_name: "Bad", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 13, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"
      - name: create_student_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.Student
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /vks/students without legal_name is rejected with ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["District D exists"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-104", state_code: "OR", funding_rate_cents: 400, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
          trigger:
            - call: "POST /vks/students"
              payload: { date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"
      - name: computed_field_input_ignored_on_attendance
        claim_type: computed_fields
        grounds:
          - entities.AttendanceRecord.fields.attendance_status
          - calculations.attendance_determination
        distinguishing_aspect: "attendance_status is server-computed from synchronous_minutes and engagement_check_ins; a client-supplied value is ignored"
        test_recipe:
          setup:
            - "Student S enrolled"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-105", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Beth", date_of_birth: "2011-06-01T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 5 }
              as: EnrollmentOfficer
              captures: { att_id: $.data.id }
          assert:
            - "AttendanceRecord.${att_id}.attendance_status == PRESENT"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: student_initial_state_is_applied
        claim_type: initial_state
        grounds:
          - state_machines.Student
        distinguishing_aspect: "newly created Student starts in APPLIED state"
        test_recipe:
          setup: ["District D"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-110", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
          trigger:
            - call: "POST /vks/students"
              payload: { legal_name: "Init", date_of_birth: "2011-03-03T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
          assert:
            - "Student.${student_id}.enrollment_status == APPLIED"
      - name: withdraw_from_applied_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Student
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "APPLIED -> WITHDRAWN is not a declared transition; withdraw on APPLIED student rejected"
        test_recipe:
          setup: ["Student S in APPLIED"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-111", state_code: "TX", funding_rate_cents: 400, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Inval", date_of_birth: "2011-04-04T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "DROPOUT" }
              as: EnrollmentOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
      - name: mark_returned_on_requested_stipend_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.DeviceStipend
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "mark-returned on a REQUESTED stipend is not a declared transition"
        test_recipe:
          setup: ["Student enrolled; REQUESTED stipend exists"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-112", state_code: "WA", funding_rate_cents: 400, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "St", date_of_birth: "2011-05-05T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/stipends"
              payload: { student_id: "${student_id}", stipend_type: "DEVICE", amount_cents: 20000 }
              as: FinanceOfficer
              captures: { stipend_id: $.data.id }
          trigger:
            - call: "POST /vks/stipends/${stipend_id}/mark-returned"
              payload: {}
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
      - name: teacher_assignment_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TeacherAssignment
        distinguishing_aspect: "After ENDED, no further transitions are accepted on the TeacherAssignment"
        test_recipe:
          setup: ["Teacher T assigned to student S; assignment then ended"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-113", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "T", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/teachers"
              payload: { full_name: "T1", certification_state_codes: ["CA"], caseload_cap: 5 }
              as: AcademicDirector
              captures: { teacher_id: $.data.id }
            - call: "POST /vks/teacher-assignments"
              payload: { teacher_id: "${teacher_id}", student_id: "${student_id}", subject: "MATH" }
              as: AcademicDirector
              captures: { ta_id: $.data.id }
            - call: "POST /vks/teacher-assignments/${ta_id}/end"
              payload: {}
              as: AcademicDirector
          trigger:
            - call: "POST /vks/teacher-assignments/${ta_id}/end"
              payload: {}
              as: AcademicDirector
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: attendance_determination_partial_branch
        claim_type: correct_result
        grounds:
          - calculations.attendance_determination
        distinguishing_aspect: "PARTIAL branch: synchronous_minutes=150 (>=120, <240) and check_ins=1 (<2) -> PARTIAL"
        test_recipe:
          setup: ["Student S enrolled"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-120", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "P1", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 150, engagement_check_ins: 1 }
              as: EnrollmentOfficer
              captures: { att_id: $.data.id }
          assert:
            - "AttendanceRecord.${att_id}.attendance_status == PARTIAL"
      - name: attendance_determination_full_day_at_boundary
        claim_type: boundary
        grounds:
          - calculations.attendance_determination
        distinguishing_aspect: "exactly FULL_DAY_MINUTES=240 and MIN_CHECKINS=2 -> PRESENT (boundary >=, inclusive)"
        test_recipe:
          setup: ["Student S enrolled"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-121", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "P2", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 240, engagement_check_ins: 2 }
              as: EnrollmentOfficer
              captures: { att_id: $.data.id }
          assert:
            - "AttendanceRecord.${att_id}.attendance_status == PRESENT"
      - name: attendance_determination_absent_unexcused_below_all_thresholds
        claim_type: correct_result
        grounds:
          - calculations.attendance_determination
        distinguishing_aspect: "synchronous_minutes=50 (<120) and check_ins=0 (<2) -> ABSENT_UNEXCUSED"
        test_recipe:
          setup: ["Student S enrolled"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-122", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "P3", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 50, engagement_check_ins: 0 }
              as: EnrollmentOfficer
              captures: { att_id: $.data.id }
          assert:
            - "AttendanceRecord.${att_id}.attendance_status == ABSENT_UNEXCUSED"
      - name: excuse_absence_decrements_truancy_count
        claim_type: correct_result
        grounds:
          - calculations.truancy_window_count
          - state_machines.AttendanceRecord.ABSENT_UNEXCUSED_to_ABSENT_EXCUSED
        distinguishing_aspect: "excusing an ABSENT_UNEXCUSED record removes it from the unexcused count"
        test_recipe:
          setup:
            - "Student S enrolled; 3 unexcused absences -> truancy_flag=true"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-123", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "P4", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
              captures: { att1_id: $.data.id }
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-04T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-05T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/attendance/${att1_id}/excuse"
              payload: { excused_reason: "Doctor appointment" }
              as: EnrollmentOfficer
          assert:
            - "AttendanceRecord.${att1_id}.attendance_status == ABSENT_EXCUSED"
            - "Student.${student_id}.truancy_unexcused_count == 2"
            - "Student.${student_id}.truancy_flag == false"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1, errors[ERR_UNAUTHENTICATED]]
        distinguishing_aspect: "missing X-User-Role / X-User-ID -> 401 ERR_UNAUTHENTICATED"
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /vks/students"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_UNAUTHENTICATED"
      - name: wrong_role_unauthorized
        claim_type: violation_to_error
        grounds:
          - validations[priority=2, errors[ERR_UNAUTHORIZED]]
        distinguishing_aspect: "FinanceOfficer attempting POST /vks/students/{id}/withdraw (EnrollmentOfficer exclusive) -> 403 ERR_UNAUTHORIZED"
        test_recipe:
          setup: ["Student S ENROLLED"]
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-130", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 50 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Z1", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "DROPOUT" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_UNAUTHORIZED"
      - name: stale_student_version_on_enroll_rejected
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[enroll-stale-student-version, errors[ERR_STALE_VERSION]]
        distinguishing_aspect: "POST /vks/students/{id}/enroll with expected_student_version lower than current version -> 412 ERR_STALE_VERSION"
