  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_dispatch_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[route-dispatch-stale-version]", "errors[ERR_STALE_ROUTE_VERSION]"]
        distinguishing_aspect: |
          Reading route version v, then mutating the route via an applied appointment
          (bumps version to v+1), then dispatching with expected_route_version=v (now stale)
          -> ERR_STALE_ROUTE_VERSION (412). Capacity is fine, so the OCC error surfaces alone.
        test_recipe:
          setup: ["planning route with one routed parcel; client captured version BEFORE an appointment-apply bumped it"]
          setup_api_calls:
            - call: "POST /delivery/transit-centers"
              payload: { name: "HubC31", sort_capacity: 10 }
              as: DispatchManager
              captures: { c1: $.data.id }
            - call: "POST /delivery/drivers"
              payload: { name: "Docc", vehicle_capacity_kg: 50 }
              as: DispatchManager
              captures: { d1: $.data.id }
            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-OCC", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-29", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
              captures: { s1: $.data.id }
            - call: "GET /delivery/routes/${r1}"
              payload: {}
              as: DispatchManager
              captures: { rv_stale: $.data.version }
            - call: "POST /delivery/appointments"
              payload: { stop_id: "${s1}", requested_start_min: 700, requested_end_min: 760 }
              as: CustomerServiceAgent
              captures: { ap: $.data.id }
            - call: "POST /delivery/appointments/${ap}/apply"
              payload: {}
              as: CustomerServiceAgent
          trigger:
            - call: "POST /delivery/routes/${r1}/dispatch"
              payload: { expected_route_version: "${rv_stale}" }
              as: DispatchManager
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_ROUTE_VERSION"
            - "DeliveryRoute.${r1}.status == PLANNING"

