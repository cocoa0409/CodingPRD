scaffold_corner_design:
- section: entities
  instances:
  - name: employee_create_returns_201_with_every_declared_field
    claim_type: Creation
    grounds:
    - entities.Employee
    - endpoints.POST /rtw/employees
    distinguishing_aspect: A well-formed Employee create returns 201 and echoes all six input fields plus the four common fields, with open_claim_count initialised to 0.
    test_recipe:
      setup:
      - Empty database, clock at its 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: POST /rtw/employees
        payload: &id001
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
        captures:
          emp_id: $.data.id
          occ: $.data.open_claim_count
          ver: $.data.version
          es: $.data.employment_status
      assert:
      - HTTP status == 201
      - ${occ} == 0
      - ${ver} == 1
      - ${es} == ACTIVE
      - Employee.${emp_id}.employee_number == "EMP-2201"
      - Employee.${emp_id}.pre_injury_weekly_wage_cents == 120000
  - name: employee_get_by_id_returns_the_stored_row
    claim_type: Retrieval
    grounds:
    - entities.Employee
    - endpoints.GET /rtw/employees/{id}
    distinguishing_aspect: GET /rtw/employees/{id} returns exactly the row written by the create call, including the server-minted id.
    test_recipe:
      setup:
      - One Employee registered with employee_number EMP-2201.
      setup_api_calls:
      - call: POST /rtw/employees
        payload: *id001
        as: ProgramAdmin
        captures:
          emp_id: $.data.id
      trigger:
      - call: GET /rtw/employees/${emp_id}
        payload: {}
        as: ProgramAdmin
        captures:
          n: $.data.full_name
          bt: $.data.benefit_tier
      assert:
      - HTTP status == 200
      - ${n} == "Dana Ruiz"
      - ${bt} == TIER_B
  - name: placements_list_returns_pagination_envelope_fields
    claim_type: Listing
    grounds:
    - entities.Placement
    - endpoints.GET /rtw/placements
    - response_envelope.pagination_fields
    distinguishing_aspect: GET /rtw/placements with limit 1 and offset 0 returns response_type array, total_count 2 and has_more true over the two PROPOSED placements the chain created.
    test_recipe:
      setup:
      - 'Two PROPOSED placements for one worker: 2026-08-03..2026-08-28 and 2026-08-28..2026-09-15.'
      setup_api_calls:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
        captures:
          emp_id: $.data.id
      - call: POST /rtw/employees/${emp_id}/claims
        payload:
          claim_number: CLM-2201
          adjuster_user_id: adj-001
          injury_date: '2026-06-15'
        as: ProgramAdmin
        captures:
          claim_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/adjuster-authorization
        payload:
          max_authorized_weekly_cost_cents: 150000
          claim_status_directive: RTW_ELIGIBLE
        as: ClaimAdjuster
        as_user_id: adj-001
        captures:
          claim_v: $.data.version
      - call: POST /rtw/treating-providers
        payload:
          full_name: Imani Okafor
          npi: '1234567890'
          specialty: Occupational Medicine
          credential_status: VERIFIED
        as: ProgramAdmin
        captures:
          prov_id: $.data.id
      - call: POST /rtw/supervisors
        payload:
          full_name: Sam Ortiz
          department_code: WHS
        as: ProgramAdmin
        captures:
          sup_id: $.data.id
      - call: POST /rtw/supervisors/${sup_id}/training-records
        payload:
          curriculum_code: RTW_CORE
          completed_on: '2026-05-01'
          valid_through: '2027-05-01'
        as: ProgramAdmin
        captures:
          train_id: $.data.id
      - call: POST /rtw/transitional-jobs
        payload:
          supervisor_id: ${sup_id}
          title: Parts Sorter
          department_code: WHS
          seat_capacity: 2
          demand_lift_lbs: 10
          demand_standing_minutes: 15
          demand_hours_per_day: 4
          demand_keyboard_minutes_per_hour: 20
          hourly_rate_cents: 1875
          risk_class: LOW
        as: ProgramAdmin
        captures:
          job_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/restriction-sets
        payload:
          treating_provider_id: ${prov_id}
          expected_claim_version: ${claim_v}
          effective_from: '2026-08-01'
          valid_through: '2026-11-30'
          max_lift_lbs: 20
          max_continuous_standing_minutes: 30
          max_hours_per_day: 6
          keyboard_minutes_per_hour: 45
          overhead_reach_allowed: false
          driving_allowed: false
        as: TreatingProvider
        as_user_id: ${prov_id}
        captures:
          rs_id: $.data.id
      - call: POST /rtw/restriction-sets/${rs_id}/submit
        payload: {}
        as: TreatingProvider
        as_user_id: ${prov_id}
      - call: POST /rtw/restriction-sets/${rs_id}/verify
        payload: {}
        as: OccHealthNurse
        as_user_id: nurse-1
      - call: POST /rtw/restriction-sets/${rs_id}/activate
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          rs_v: $.data.version
      - call: POST /rtw/placements
        payload:
          restriction_set_id: ${rs_id}
          transitional_job_id: ${job_id}
          start_date: '2026-08-03'
          end_date: '2026-08-28'
          scheduled_hours_per_day: 4
          expected_restriction_set_version: ${rs_v}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pl_id: $.data.id
      - call: GET /rtw/restriction-sets/${rs_id}
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          rs_v2: $.data.version
      - call: POST /rtw/placements
        payload:
          restriction_set_id: ${rs_id}
          transitional_job_id: ${job_id}
          start_date: '2026-08-28'
          end_date: '2026-09-15'
          scheduled_hours_per_day: 4
          expected_restriction_set_version: ${rs_v2}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pl2_id: $.data.id
      trigger:
      - call: GET /rtw/placements
        payload:
          claim_id: ${claim_id}
          limit: 1
          offset: 0
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          first_id: $.data[0].id
      assert:
      - HTTP status == 200
      - response envelope response_type == "array"
      - meta pagination total_count == 2
      - meta pagination has_more == true
      - length of data == 1
      - ${first_id} == ${pl_id}
  - name: claim_get_with_unknown_uuid_returns_not_found
    claim_type: Not Found
    grounds:
    - entities.Claim
    - errors[ERR_CLAIM_NOT_FOUND]
    - validations[priority=4]
    distinguishing_aspect: GET /rtw/claims/{id} with a syntactically valid but unused UUID returns 404 ERR_CLAIM_NOT_FOUND and no partial payload.
    test_recipe:
      setup:
      - Empty database apart from the clock reset.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: GET /rtw/claims/00000000-0000-4000-8000-000000000000
        payload: {}
        as: ProgramAdmin
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_CLAIM_NOT_FOUND
      - HTTP status == 404
  - name: employee_create_missing_required_field_returns_invalid_request
    claim_type: Required Fields
    grounds:
    - entities.Employee.fields.pre_injury_weekly_wage_cents
    - validations[priority=3]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting pre_injury_weekly_wage_cents, a source:input field with no default, returns 400 ERR_INVALID_REQUEST and persists nothing.
    test_recipe:
      setup:
      - Empty database apart from the clock reset.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      trigger:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_INVALID_REQUEST
      - HTTP status == 400
  - name: transitional_job_defaults_applied_when_optional_fields_omitted
    claim_type: Defaults
    grounds:
    - entities.TransitionalJob.fields.risk_class
    - entities.TransitionalJob.fields.requires_overhead_reach
    - entities.TransitionalJob.fields.job_status
    - endpoints.POST /rtw/transitional-jobs
    distinguishing_aspect: Creating a job without requires_overhead_reach, requires_driving or risk_class yields false, false and LOW, with job_status OPEN and filled_seats 0.
    test_recipe:
      setup:
      - One Supervisor registered in department WHS.
      setup_api_calls:
      - call: POST /rtw/supervisors
        payload:
          full_name: Sam Ortiz
          department_code: WHS
        as: ProgramAdmin
        captures:
          sup_id: $.data.id
      trigger:
      - call: POST /rtw/transitional-jobs
        payload:
          supervisor_id: ${sup_id}
          title: Parts Sorter
          department_code: WHS
          seat_capacity: 2
          demand_lift_lbs: 10
          demand_standing_minutes: 15
          demand_hours_per_day: 4
          demand_keyboard_minutes_per_hour: 20
          hourly_rate_cents: 1875
        as: ProgramAdmin
        captures:
          job_id: $.data.id
          rc: $.data.risk_class
          ror: $.data.requires_overhead_reach
          rd: $.data.requires_driving
          js: $.data.job_status
          fs: $.data.filled_seats
      assert:
      - HTTP status == 201
      - ${rc} == LOW
      - ${ror} == false
      - ${rd} == false
      - ${js} == OPEN
      - ${fs} == 0
