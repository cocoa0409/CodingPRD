        distinguishing_aspect: |
          CLOSED is terminal: all three remaining actions (CLOSE again, RESUME, OPEN) return
          ERR_WINDOW_INVALID_STATE (409) and the window stays CLOSED with suspension_reason
          null - there is no path back out of CLOSED.
