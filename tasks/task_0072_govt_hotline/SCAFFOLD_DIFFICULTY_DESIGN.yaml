# =============================================================================
# Scaffold Difficulty Design — Test Targeting Index for task_0072_govt_hotline
#
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# from prd-bench-scaffold-generator SKILL.md §0.5. Every grounds:[] reference
# resolves to a declared element in SCAFFOLD.yaml; every distinguishing_aspect
# is a falsifiable claim a unit test can assert.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: difficulty_score_registration_vs_post_classification
        grounds:
          - calculations.work_order_difficulty_score
          - calculations.work_order_difficulty_score.variants.registration_variant
          - calculations.work_order_difficulty_score.variants.post_classification_variant
          - state_machines.WorkOrder.REGISTERED_to_CLASSIFIED
          - entities.WorkOrder.fields.difficulty_score
          - entities.WorkOrder.fields.joint_handling
        distinguishing_aspect: |
          The two variants operate on the same WorkOrder row but in different evaluation phases:
          registration_variant runs BEFORE classification (joint_handling=false, so JOINT_FACTOR=0)
          while post_classification_variant runs AFTER classification has populated supporting
          departments. For inputs urgency=NORMAL (weight 1) and CategoryRule.difficulty_base=2 with
          ≥1 supporting department, the same WorkOrder yields difficulty_score=3 at registration
          but 5 immediately after classify — a strictly larger number from identical caller-reported
          inputs. The WorkOrder entity is the subject; supporting-dept aggregation is a different
          structural domain than the satisfaction-index variant below.
        test_recipe:
          setup:
            - "Create Department D_LEAD (code=ROAD-LEAD, jurisdiction_codes=[J0001])"
            - "Create Department D_SUP1 (code=ROAD-SUP, jurisdiction_codes=[J0001])"
            - "Create CategoryRule (ROAD, POTHOLE) with lead=ROAD-LEAD, supporting=[ROAD-SUP], statutory=72h, committed=48h, difficulty_base=2"
            - "Create Handler H_LEAD in D_LEAD, H_SUP in D_SUP1"
          trigger:
            - "POST /work-orders as HotlineOperator with category=ROAD, sub=POTHOLE, jurisdiction=J0001, urgency=NORMAL → capture W.difficulty_score"
            - "POST /work-orders/{W.id}/classify as Dispatcher with mode=RULE_BASED → re-fetch W"
          assert:
            - "Immediately after registration: W.difficulty_score == 3 (= max(1,min(10, 1 + 2 + 0)))"
            - "Immediately after classify:     W.difficulty_score == 5 (= max(1,min(10, 1 + 2 + 2)))"
            - "W.joint_handling == true after classify"

      - name: satisfaction_index_department_vs_handler_variant
        grounds:
          - calculations.satisfaction_index
          - calculations.satisfaction_index.variants.department_variant
          - calculations.satisfaction_index.variants.handler_variant
          - endpoints[GET /stats/satisfaction]
          - entities.WorkOrder.fields.lead_department_id
          - entities.DepartmentAssignment.fields.handler_id
        distinguishing_aspect: |
          Department-grouped and handler-grouped satisfaction indices operate on different entity
          domains: department_variant aggregates over WorkOrder.lead_department_id, while
          handler_variant aggregates over the LEAD DepartmentAssignment.handler_id. The same raw
          survey data therefore produces different mean scores because one handler may carry only
          a slice of their department's WorkOrders. Different entity domain (WorkOrder ↔ Handler
          via DepartmentAssignment) than the difficulty_score variants above.
        test_recipe:
          setup:
            - "Create Department D1 with two handlers H_A and H_B"
            - "Create 3 WorkOrders all dispatched to D1: WO1 handled by H_A (survey score=5), WO2 handled by H_A (survey score=1), WO3 handled by H_B (survey score=4)"
            - "All surveys RESPONDED via POST /surveys/{id}/respond"
          trigger:
            - "GET /stats/satisfaction?group_by=department&department_id=D1"
            - "GET /stats/satisfaction?group_by=handler&handler_id=H_A"
          assert:
            - "department_variant index for D1 == 3.33 (= round_half_up((5+1+4)/3, 2))"
            - "handler_variant index for H_A == 3.00 (= round_half_up((5+1)/2, 2))"
            - "Two indices differ because handler scope excludes WO3"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: difficulty_score_threecomponent_clamp
        grounds:
          - calculations.work_order_difficulty_score
          - calculations.work_order_difficulty_score.constants.MAX_DIFFICULTY
          - entities.WorkOrder.fields.urgency
          - entities.WorkOrder.fields.joint_handling
          - entities.CategoryRule.fields.difficulty_base
        distinguishing_aspect: |
          MODE (a): non-linear interaction of three inputs (urgency_weight, category_difficulty_base,
          joint_factor) with conditional clamp at the boundary. Inputs that sum above 10 collapse to
          10 (saturation), so urgency=CRITICAL + difficulty_base=4 + joint yields the SAME score (10)
          as urgency=CRITICAL + difficulty_base=5 + joint — a non-injective region of the input space.
          This mode (≥3 inputs, nested min/max) is structurally distinct from the rounding-order
          mode and the ordering mode below.
        test_recipe:
          setup:
            - "Create CategoryRule (ENV, SMOKE) with difficulty_base=4, lead=ENV-LEAD, supporting=[ENV-SUP], statutory=72h, committed=48h"
            - "Create CategoryRule (ENV, FUMES) with difficulty_base=5, same lead/supporting"
          trigger:
            - "Register WO_X with urgency=CRITICAL, category=ENV/SMOKE; classify"
            - "Register WO_Y with urgency=CRITICAL, category=ENV/FUMES; classify"
          assert:
            - "WO_X.difficulty_score == 10 (= max(1,min(10, 5 + 4 + 2)))"
            - "WO_Y.difficulty_score == 10 (= max(1,min(10, 5 + 5 + 2)))"
            - "Both saturate at 10 despite different raw sums (11 vs 12) — clamp is observable"

      - name: satisfaction_index_divide_then_round
        grounds:
          - calculations.satisfaction_index
          - calculations.satisfaction_index.constants.ROUND_DECIMALS
          - calculations.satisfaction_index.constants.ROUND_MODE
          - calculations.satisfaction_index.constants.NEUTRAL_SCORE_FOR_NO_RESPONSE
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The scaffold pins divide-first then round
          to 2 decimals. Round-per-row-then-divide would change the result for fractional means.
          For 3 contributions {5, 1, 3-from-EXPIRED}, divide-first yields 3.00; if a wrong impl
          rounds each score to int first (5,1,3) then divides, it still gets 3.00 here — so we need
          a fraction-producing case: 3 cases with scores {5, 4, 1} → mean = 10/3 = 3.3333… →
          round_half_up at 2 dp = 3.33. A wrong "average-then-round-to-1-decimal-then-quote-2"
          gives 3.30. This is a rounding-order axis distinct from the clamp mode above and the
          tiered-time-limit mode below.
        test_recipe:
          setup:
            - "Three RESOLVED WorkOrders in same department D1 with surveys: scores 5, 4, 1, all RESPONDED"
            - "All three RESOLVED via /resolve and surveys responded via /surveys/{id}/respond"
          trigger:
            - "GET /stats/satisfaction?group_by=department&department_id=D1"
          assert:
            - "satisfaction_index == 3.33 (= round_half_up(10/3, 2))"
            - "Not 3.30 (that would indicate wrong rounding order: round-each then divide)"
            - "Not 3.34 (banker's rounding would also fail this test)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_revision_cycle_via_reopen
        grounds:
          - state_machines.WorkOrder
          - state_machines.WorkOrder.FOLLOWED_UP_to_REOPENED
          - state_machines.WorkOrder.REOPENED_to_IN_PROGRESS
          - state_machines.WorkOrder.IN_PROGRESS_to_RESOLVED
          - state_machines.WorkOrder.RESOLVED_to_FOLLOWED_UP
        distinguishing_aspect: |
          WorkOrder's state machine forms a cycle IN_PROGRESS → RESOLVED → FOLLOWED_UP → REOPENED →
          IN_PROGRESS, allowing the same WorkOrder to traverse the lead-handler resolution path more
          than once. This is a true cycle (non-trivial — the assignment is re-dispatched to the
          same lead department on REOPEN), distinct from any linear pipeline. The WorkOrder entity
          is one of two non-linear machines.
        test_recipe:
          setup:
            - "Provision department + handler, register/classify/dispatch/accept WO_X, lead-handler resolves it, survey dispatched and responded with score=1"
          trigger:
            - "POST /work-orders/{WO_X.id}/reopen as HotlineOperator"
            - "Re-accept the re-dispatched LEAD assignment"
            - "POST /work-orders/{WO_X.id}/resolve again with a new resolution_summary"
          assert:
            - "WO_X.status transitions REGISTERED → CLASSIFIED → DISPATCHED → IN_PROGRESS → RESOLVED → FOLLOWED_UP → REOPENED → IN_PROGRESS → RESOLVED (cycle observable in audit log)"
            - "AuditLog rows for WO_X include action=RESOLVE twice with distinct occurred_at"

      - name: department_assignment_branching_to_three_terminals
        grounds:
          - state_machines.DepartmentAssignment
          - state_machines.DepartmentAssignment.DISPATCHED_to_REJECTED
          - state_machines.DepartmentAssignment.DISPATCHED_to_REASSIGNED
          - state_machines.DepartmentAssignment.ACCEPTED_to_OPINION_SUBMITTED
          - state_machines.DepartmentAssignment.ACCEPTED_to_ESCALATED
        distinguishing_aspect: |
          DepartmentAssignment exhibits fork-style branching from a single ACCEPTED state to TWO
          divergent terminals (OPINION_SUBMITTED vs ESCALATED) with distinct side-effect sets:
          OPINION_SUBMITTED decrements Department.pending_work_count and feeds opinion aggregation;
          ESCALATED creates/increments a SupervisionTask and emits a SyncEvent. Combined with the
          DISPATCHED→{REJECTED, REASSIGNED} fork, the machine is branching (≥2 outcomes from at least
          two states with different side-effects). Different entity than WorkOrder above.
        test_recipe:
          setup:
            - "Joint-handling WO_Y with one supporting assignment A_sup, accepted by H_sup"
            - "A second joint-handling WO_Z with one supporting assignment A_sup2, accepted by H_sup2"
          trigger:
            - "POST /work-orders/{WO_Y.id}/assignments/{A_sup.id}/opinion (opinion_decision=AGREE)"
            - "POST /work-orders/{WO_Z.id}/assignments/{A_sup2.id}/escalate"
          assert:
            - "A_sup.stage_status == OPINION_SUBMITTED; A_sup2.stage_status == ESCALATED"
            - "After /opinion: Department(A_sup.dept).pending_work_count decreased by exactly 1; no SupervisionTask created for WO_Y"
            - "After /escalate: SupervisionTask exists for WO_Z with escalation_level == 1 AND SyncEvent(event_type=ESCALATED) row exists for WO_Z"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: dispatch_triggers_assignment_then_pending_then_supervision
        grounds:
          - state_machines.WorkOrder.CLASSIFIED_to_DISPATCHED
          - entities.DepartmentAssignment.fields.stage_status
          - entities.Department.fields.pending_work_count
          - entities.SupervisionTask
          - entities.WorkOrder.fields.priority_flag
        distinguishing_aspect: |
          Depth-3 cascade originating from /dispatch on WorkOrder:
          (1) /dispatch mutates WorkOrder.status DISPATCHED;
          (2) THAT transition itself creates DepartmentAssignment rows, which in turn mutates
              Department.pending_work_count on each affected department;
          (3) THAT pending_work_count increment combined with WorkOrder.priority_flag=true (a
              derived field set in the same transition) is what triggers the system to insert a
              SupervisionTask(reason=HIGH_PRIORITY_AUTO).
          Each hop is caused by the previous hop, not by the original action — without the
          DepartmentAssignment side-effect, no SupervisionTask would be created even if the
          /dispatch endpoint were called. Triggered by the DISPATCH transition.
        test_recipe:
          setup:
            - "Provision CategoryRule with lead+1 supporting; provision matching departments and handlers"
            - "Register WO_HP with urgency=CRITICAL (priority_flag will be true); classify"
          trigger:
            - "POST /work-orders/{WO_HP.id}/dispatch"
          assert:
            - "WO_HP.status == DISPATCHED"
            - "Exactly 2 DepartmentAssignment rows exist for WO_HP (LEAD + SUPPORTING)"
            - "Both target departments' pending_work_count incremented by exactly 1"
            - "Exactly 1 SupervisionTask exists for WO_HP with reason=HIGH_PRIORITY_AUTO, status=OPEN, escalation_level=0"

      - name: opinion_submit_triggers_aggregation_then_resolve_eligibility
        grounds:
          - state_machines.DepartmentAssignment.ACCEPTED_to_OPINION_SUBMITTED
          - calculations.opinion_aggregation_decision
          - state_machines.WorkOrder.IN_PROGRESS_to_RESOLVED
          - validations[priority=17]
        distinguishing_aspect: |
          Depth-2 cascade originating from /opinion on a SUPPORTING assignment:
          (1) /opinion mutates DepartmentAssignment.stage_status to OPINION_SUBMITTED;
          (2) THAT mutation recomputes calculations.opinion_aggregation_decision on the parent
              WorkOrder — and only the recomputed value (AGREE / DISAGREE_OUTVOTED vs
              DISAGREE_BLOCKING) gates whether a subsequent /resolve will succeed or fail with
              ERR_DISAGREEMENT_UNRESOLVED.
          The second hop is caused by the first (not directly by the API call), so a /resolve
          attempted before the opinion submission fails with ERR_OPINIONS_INCOMPLETE; after the
          submission, /resolve outcome depends on the aggregated decision. Triggered by
          ACCEPTED→OPINION_SUBMITTED, distinct from the DISPATCH-triggered cascade above.
        test_recipe:
          setup:
            - "Joint-handling WO_J with 1 lead + 1 supporting assignment, both ACCEPTED; lead also did its own /resolve attempt earlier"
          trigger:
            - "POST /work-orders/{WO_J.id}/assignments/{sup_assignment.id}/opinion with opinion_decision=DISAGREE"
            - "Then POST /work-orders/{WO_J.id}/resolve as lead handler"
          assert:
            - "After /opinion: opinion_aggregation_decision (visible on GET /work-orders/{id}) == DISAGREE_BLOCKING"
            - "POST /resolve fails with HTTP 422 ERR_DISAGREEMENT_UNRESOLVED"
            - "An /opinion-less attempt at /resolve would have failed with ERR_OPINIONS_INCOMPLETE (different error class), proving the second hop is caused by the recomputed aggregation"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_anonymous_pii_on_pause
        grounds:
          - validations[priority=8]   # state: WorkOrder not in IN_PROGRESS
          - validations[priority=12]  # business_safety: anonymous + PII
          - state_machines.WorkOrder
        distinguishing_aspect: |
          Two simultaneously-failing checks across different categories: a PATCH /work-orders/{id}
          request can attempt (i) to write caller_phone on an anonymous=true WorkOrder
          (business_safety violation, priority=12) AND (ii) target a WorkOrder already in
          CLASSIFIED state (state violation against PATCH semantics — PATCH applies only to
          REGISTERED, priority=8). Priority-8 state check fires first, so the response is
          ERR_INVALID_STATE, NOT ERR_ANONYMOUS_PII_LEAK. Pair: state vs business_safety.
        test_recipe:
          setup:
            - "Register WO_anon with anonymous=true, no caller_phone; classify it (state is now CLASSIFIED)"
          trigger:
            - "PATCH /work-orders/{WO_anon.id} with body {caller_phone: '+10000000000'}"
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"
            - "Response is NOT ERR_ANONYMOUS_PII_LEAK even though caller_phone would be a PII leak on an anonymous WorkOrder"

      - name: business_constraint_vs_business_referential_resolve
        grounds:
          - validations[priority=14]  # business_referential: jurisdiction_no_department on classify
          - validations[priority=16]  # business_constraint: opinions_incomplete on resolve
          - validations[priority=17]  # business_constraint: disagreement_unresolved
          - state_machines.WorkOrder.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          On POST /work-orders/{id}/resolve a joint-handling case can fail two checks: priority=16
          (OPINIONS_INCOMPLETE) and priority=17 (DISAGREEMENT_UNRESOLVED). When both supporting
          opinions are missing AND a third one is already DISAGREE, the lower-numbered priority
          wins → ERR_OPINIONS_INCOMPLETE. Pair: business_constraint (incomplete) vs
          business_constraint (semantic disagreement). Different error-category pair than the
          state/business_safety pair above.
        test_recipe:
          setup:
            - "Joint-handling WO with 2 supporting assignments S1 and S2; S1 has stage_status=OPINION_SUBMITTED with opinion_decision=DISAGREE; S2 is still ACCEPTED (no opinion yet)"
            - "Lead assignment ACCEPTED by lead handler"
          trigger:
            - "POST /work-orders/{WO.id}/resolve as lead handler with resolution_summary='ok'"
          assert:
            - "HTTP 422, error_id == ERR_OPINIONS_INCOMPLETE (priority 16 beats priority 17)"
            - "Response is NOT ERR_DISAGREEMENT_UNRESOLVED, even though S1 already disagrees"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: opinion_aggregation_ceil_half_n_tiebreak
        grounds:
          - calculations.opinion_aggregation_decision
          - entities.DepartmentAssignment.fields.opinion_decision
          - state_machines.WorkOrder.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          Boundary at D == ceil(N/2). For N=2 supporting departments, ceil(2/2)=1, so D=1 triggers
          DISAGREE_BLOCKING (not DISAGREE_OUTVOTED). For N=3, ceil(3/2)=2, so D=1 is OUTVOTED but
          D=2 is BLOCKING. Tests must hit BOTH sides of the boundary on the same N=2 case to
          confirm '>=' semantics. Reachable through POST /resolve, distinct metric (count tie-break)
          and endpoint from the warning_state threshold below.
        test_recipe:
          setup:
            - "Two parallel joint-handling WOs each with N=2 supporting assignments"
            - "WO_A: S1.opinion_decision=AGREE, S2.opinion_decision=AGREE, both OPINION_SUBMITTED"
            - "WO_B: S1.opinion_decision=AGREE, S2.opinion_decision=DISAGREE, both OPINION_SUBMITTED"
          trigger:
            - "POST /work-orders/{WO_A.id}/resolve"
            - "POST /work-orders/{WO_B.id}/resolve"
          assert:
            - "WO_A: HTTP 200, status becomes RESOLVED (D=0, AGREE)"
            - "WO_B: HTTP 422, error_id == ERR_DISAGREEMENT_UNRESOLVED (D=1, D >= ceil(2/2)=1)"
            - "Boundary is '>=', not strict '>': a D=1 dissent out of N=2 BLOCKS"

      - name: warning_state_yellow_at_exact_25_percent
        grounds:
          - calculations.warning_state
          - calculations.warning_state.constants.YELLOW_THRESHOLD_FRACTION
          - entities.WorkOrder.fields.warning_state
          - endpoints[GET /work-orders/{id}]
          - endpoints[POST /_clock/advance]
        distinguishing_aspect: |
          warning_state crosses NONE→YELLOW at remaining/total <= 0.25. The boundary is inclusive:
          remaining/total = exactly 0.25 → YELLOW. A WorkOrder with committed_time_limit=4h whose
          clock has advanced by exactly 3h should be YELLOW (1h / 4h = 0.25), not NONE. Different
          metric (time fraction) and different endpoint (/_clock/advance + GET /work-orders/{id})
          than the opinion-count boundary above.
        test_recipe:
          setup:
            - "CategoryRule with committed_time_limit_hours=4, statutory=8"
            - "Register/classify WO at clock t0 → committed_deadline_at = t0 + 4 business hours"
          trigger:
            - "POST /_clock/advance with seconds = 3 * 3600 (3 business hours forward, all within one business day)"
            - "GET /work-orders/{WO.id}"
          assert:
            - "warning_state == 'YELLOW' (remaining/total = 1/4 = 0.25, threshold uses '<=')"
            - "warning_state would have been 'NONE' if threshold used strict '<'"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: workorder_resolve_depends_on_supporting_assignment_state
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_RESOLVED
          - state_machines.DepartmentAssignment.ACCEPTED_to_OPINION_SUBMITTED
          - validations[priority=16]
          - entities.DepartmentAssignment.fields.stage_status
        distinguishing_aspect: |
          WorkOrder.IN_PROGRESS→RESOLVED is gated by every SUPPORTING DepartmentAssignment being
          in OPINION_SUBMITTED. Two entities, two different state machines — WorkOrder's transition
          depends on sibling DepartmentAssignment row(s) being in a specific state. Entity pair:
          WorkOrder ↔ DepartmentAssignment.
        test_recipe:
          setup:
            - "Joint-handling WO_M with lead ACCEPTED, ONE supporting still ACCEPTED (no opinion yet)"
          trigger:
            - "POST /work-orders/{WO_M.id}/resolve as lead handler"
          assert:
            - "HTTP 422, error_id == ERR_OPINIONS_INCOMPLETE"
            - "After supporting submits opinion (AGREE), repeat /resolve → HTTP 200 (proves the dependency on sibling-entity state)"

      - name: close_depends_on_supervisiontask_state
        grounds:
          - state_machines.WorkOrder.FOLLOWED_UP_to_CLOSED
          - state_machines.SupervisionTask
          - validations[priority=18]
          - entities.SupervisionTask.fields.status
        distinguishing_aspect: |
          WorkOrder.FOLLOWED_UP→CLOSED is gated by no SupervisionTask in OPEN or ESCALATED for
          that WorkOrder. Entity pair: WorkOrder ↔ SupervisionTask. Different entity pair than
          the WorkOrder↔DepartmentAssignment dependency above.
        test_recipe:
          setup:
            - "Resolve and respond-survey a WO_N (status=FOLLOWED_UP, score=5)"
            - "Manually create a high-priority case path: dispatch a WO_N variant with priority_flag=true to seed a SupervisionTask"
            - "WO_N has SupervisionTask T1 with status=OPEN"
          trigger:
            - "POST /work-orders/{WO_N.id}/close as Dispatcher"
            - "POST /supervision/{T1.id}/close as Supervisor; then re-attempt POST /work-orders/{WO_N.id}/close"
          assert:
            - "First close: HTTP 422, error_id == ERR_SUPERVISION_OPEN"
            - "After supervision task closed: second close returns HTTP 200, WO_N.status == CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: clarification_pause_no_concurrent_pauses_per_workorder
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_IN_PROGRESS (POST /work-orders/{id}/pause)
          - entities.ClarificationPause
          - entities.WorkOrder.fields.pause_started_at
          - concurrency_rules[Two clarification pauses are started simultaneously]
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics on a WorkOrder: only ONE ClarificationPause may be open at a time. A
          second /pause while pause_started_at != NULL is rejected with ERR_ALREADY_PAUSED. The
          interval is open-ended on the right (resumed_at IS NULL during the active pause), so the
          conflict rule is "no two pauses with overlapping [paused_at, resumed_at]" using
          half-open intervals on the same WorkOrder resource.
        test_recipe:
          setup:
            - "WO_P in IN_PROGRESS (provisioned to lead handler)"
            - "POST /work-orders/{WO_P.id}/pause once successfully (now pause_started_at is set)"
          trigger:
            - "POST /work-orders/{WO_P.id}/pause again (second pause while first not yet resumed)"
          assert:
            - "Second request returns HTTP 409, error_id == ERR_ALREADY_PAUSED"
            - "After /resume then /pause: third call succeeds (intervals are sequential, not concurrent)"

      - name: department_assignment_single_active_handler_per_assignment
        grounds:
          - state_machines.DepartmentAssignment.DISPATCHED_to_ACCEPTED
          - concurrency_rules[Two handlers within the same department race to accept]
          - entities.DepartmentAssignment.fields.handler_id
          - entities.Department.fields.pending_work_count
        distinguishing_aspect: |
          Interval semantics on a DepartmentAssignment row: only one Handler may occupy the
          ACCEPTED state at a time. Two concurrent /accept requests are rejected for the loser,
          and a third /accept after the first handler resolves the underlying WorkOrder cannot
          create a new acceptance interval on the same assignment (terminal state). Geometry is
          'one active occupancy per assignment', distinct from the workorder-level pause
          intervals above (which are sequential intervals on a single resource).
        test_recipe:
          setup:
            - "Department D with two handlers H_1 and H_2; dispatched LEAD assignment A on WO_R"
          trigger:
            - "POST /accept as H_1; then POST /accept as H_2 on the same assignment"
          assert:
            - "First /accept (H_1) returns HTTP 200; A.handler_id == H_1"
            - "Second /accept (H_2) returns HTTP 409, error_id == ERR_ASSIGNMENT_NOT_PENDING"
            - "Department.pending_work_count incremented by 1 (not 2) across the two attempts"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pause_resume_pause_accumulated_seconds_invariant
        grounds:
          - calculations.pause_invariant
          - state_machines.WorkOrder.IN_PROGRESS_to_IN_PROGRESS (pause)
          - state_machines.WorkOrder.IN_PROGRESS_to_IN_PROGRESS (resume)
          - entities.WorkOrder.fields.pause_accumulated_seconds
          - entities.ClarificationPause
        distinguishing_aspect: |
          Conserved quantity (time/seconds): For every PAUSE paired with its RESUME, the global
          quantity
          Q = SUM_over_WorkOrders(pause_accumulated_seconds) - SUM_over_ClarificationPause(duration_seconds WHERE resumed_at IS NOT NULL)
          MUST equal 0 at every moment when no pause is open. Different conserved quantity (TIME)
          than the pending-work-count invariant below.
        test_recipe:
          setup:
            - "WO_Q in IN_PROGRESS"
          trigger:
            - "POST /pause; POST /_clock/advance seconds=1800; POST /resume"
            - "POST /pause; POST /_clock/advance seconds=1800; POST /resume"
          assert:
            - "GET /work-orders/{WO_Q.id}: pause_accumulated_seconds == 3600 (1800 + 1800)"
            - "SUM(ClarificationPause.duration_seconds WHERE resumed_at IS NOT NULL AND work_order_id == WO_Q.id) == 3600"
            - "Invariant Q == 0 (sums equal)"

      - name: dispatch_resolve_pending_work_count_invariant
        grounds:
          - calculations.department_pending_invariant
          - state_machines.WorkOrder.CLASSIFIED_to_DISPATCHED
          - state_machines.WorkOrder.IN_PROGRESS_to_RESOLVED
          - state_machines.DepartmentAssignment.ACCEPTED_to_OPINION_SUBMITTED
          - entities.Department.fields.pending_work_count
        distinguishing_aspect: |
          Conserved quantity (integer count): For every DISPATCH that increments
          Department.pending_work_count, a paired terminal action (REJECT, REASSIGN-source,
          OPINION_SUBMIT for SUPPORTING, RESOLVE for LEAD) decrements it by exactly 1. After a
          full end-to-end run that resolves a joint case, every involved Department's
          pending_work_count returns to its pre-dispatch value. Different conserved quantity
          (COUNT) than the pause-seconds invariant above.
        test_recipe:
          setup:
            - "Joint-handling WO_S; baseline: D_LEAD.pending_work_count = X, D_SUP.pending_work_count = Y"
          trigger:
            - "Run end-to-end: classify → dispatch → both /accept → SUP /opinion (AGREE) → LEAD /resolve"
          assert:
            - "After dispatch: D_LEAD.pending_work_count == X+1, D_SUP.pending_work_count == Y+1"
            - "After SUP /opinion: D_SUP.pending_work_count == Y (decremented)"
            - "After LEAD /resolve: D_LEAD.pending_work_count == X (decremented)"
            - "Final: both counts equal baseline → Q == 0"
