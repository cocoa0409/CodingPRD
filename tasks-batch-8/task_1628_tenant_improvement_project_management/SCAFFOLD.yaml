    output: WorkLetter
    side_effects: ["TIProject INITIATED -> WORK_LETTER_NEGOTIATION on first creation", "TIProject.version increments by 1"]
  - method: GET
    path: "/api/ti-projects/{id}/work-letters"
    description: "List work letters of a project"
