            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-06-01T00:00:00Z", cost_usd: 105000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_id: $.data.id }
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_version_1: $.data.version }
            - call: "POST /floodplain/determination-cases"
              payload: { structure_id: "${struct_id}", method: "CUMULATIVE", expected_structure_version: "${struct_version_1}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { case_1_id: $.data.id }
            - call: "POST /floodplain/determination-cases/${case_1_id}/determine"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_version_2: $.data.version }
          trigger:
            - call: "POST /floodplain/determination-cases"
              payload: { structure_id: "${struct_id}", method: "SINGLE_EVENT", expected_structure_version: "${struct_version_2}" }
              as: FloodplainAdministrator
