  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: loan_draw_then_repay_conserves_gross_cash_value
        grounds:
          - state_machines.PolicyLoan.ACTIVE_to_REPAID
          - calculations.reconcile_net_cash_value
          - entities.Policy.fields.gross_cash_value_cents
          - entities.Policy.fields.net_cash_value_cents
          - entities.Policy.fields.outstanding_loan_principal_cents
        distinguishing_aspect: |
          Conserved quantity 1 = gross_cash_value_cents (a money pool). Drawing a loan (forward)
          reduces net_cash_value but MUST NOT change gross; repaying (compensating) restores net
          to its pre-loan value and outstanding_loan_principal back to 0. Invariant pinned:
          gross == 11250 throughout; after repay net == 11250 and outstanding == 0.
