              captures: { empty_pct: $.data.on_time_pct, empty_net: $.data.net_amount_cents }
          assert:
            - "ServicePeriodReport.${rep6}.countable_trip_count == 0"
            - "ServicePeriodReport.${rep6}.scheduled_trip_count == 0"
            - "${empty_pct} == 100.00"
            - "ServicePeriodReport.${rep6}.penalty_tier_pct == 0"
            - "ServicePeriodReport.${rep6}.total_billable_minutes == 0"
            - "ServicePeriodReport.${rep6}.billable_service_hours == 0.00"
            - "ServicePeriodReport.${rep6}.gross_amount_cents == 0"
            - "ServicePeriodReport.${rep6}.penalty_amount_cents == 0"
            - "ServicePeriodReport.${rep6}.credit_amount_cents == 0"
            - "${empty_net} == 0"
            - "ServicePeriodReport.${rep6}.settlement_variant == 'PROVISIONAL'"

      - name: layover_buffer_exactly_twelve_minutes
        grounds:
          - validations[priority=100]
          - calculations.vehicle_committed_block_minutes
          - errors[ERR_VEHICLE_BLOCK_CONFLICT]
          - endpoints[POST /trips/{id}/assign]
        distinguishing_aspect: |
          A third metric on a third endpoint: the layover gap. An 11-minute gap between one
          trip's arrival at 468 and the next departure at 479 is rejected with
          ERR_VEHICLE_BLOCK_CONFLICT, while a gap of exactly 12 minutes (departure 480) is
          accepted, leaving committed_block_minutes at 102.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with three PUBLISHED single-trip routes on 2026-09-02: one departing 420 and arriving 468, one departing 479, one departing 480."
            - "One non-ADA vehicle and one driver with a 480-minute duty cap; the 420 trip is already assigned to them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Layover Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c14: $.data.id }
            - call: "POST /service-contracts/${c14}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c14}", name: "Morning Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rA: $.data.id }
            - call: "POST /routes"
              payload: { contract_id: "${c14}", name: "Eleven Gap Shuttle", loop_minutes: 30, headway_minutes: 30, service_window_start_min: 479, service_window_end_min: 479, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rB: $.data.id }
            - call: "POST /routes"
              payload: { contract_id: "${c14}", name: "Twelve Gap Shuttle", loop_minutes: 30, headway_minutes: 30, service_window_start_min: 480, service_window_end_min: 480, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { rC: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-901", seat_capacity: 20, is_ada_accessible: false, odometer_km: 3000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v14: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Tomas Reyes", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d14: $.data.id }
            - call: "POST /routes/${rA}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "POST /routes/${rB}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "POST /routes/${rC}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rA}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tA: "$.data[0].id" }
            - call: "GET /trips"
              payload: { route_id: "${rB}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tB: "$.data[0].id" }
            - call: "GET /trips"
              payload: { route_id: "${rC}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tC: "$.data[0].id" }
            - call: "POST /trips/${tA}/assign"
              payload: { vehicle_id: "${v14}", driver_id: "${d14}" }
              as: OpsPlanner
          trigger:
            - call: "POST /trips/${tB}/assign"
              payload: { vehicle_id: "${v14}", driver_id: "${d14}" }
              as: OpsPlanner
              captures: { err_gap11: $.data.error_id }
            - call: "POST /trips/${tC}/assign"
              payload: { vehicle_id: "${v14}", driver_id: "${d14}" }
              as: OpsPlanner
              captures: { tC_status: $.data.dispatch_status }
          assert:
            - "${err_gap11} == 'ERR_VEHICLE_BLOCK_CONFLICT'"
            - "the 479 assignment responds with HTTP 409"
            - "${tC_status} == 'ASSIGNED'"
            - "GET /trips/${tB} -> Trip.dispatch_status == 'SCHEDULED' and Trip.vehicle_id == null"
            - "GET /vehicles/${v14} -> Vehicle.committed_block_minutes == 102"
            - "GET /drivers/${d14} -> Driver.assigned_duty_minutes_current_date == 0"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assign_blocked_by_vehicle_in_maintenance
        grounds:
          - validations[priority=65]
          - errors[ERR_VEHICLE_UNAVAILABLE]
          - state_machines.Vehicle.AVAILABLE_to_IN_MAINTENANCE
          - state_machines.Vehicle.IN_MAINTENANCE_to_AVAILABLE
          - state_machines.Trip.SCHEDULED_to_ASSIGNED
        distinguishing_aspect: |
          The entity pair is Trip depending on Vehicle: the identical assign body is
          rejected with ERR_VEHICLE_UNAVAILABLE while vehicle.status is IN_MAINTENANCE and
          accepted once closing the order returns the vehicle to AVAILABLE, with nothing
          about the trip itself changing between the two calls.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T05:00:00Z."
            - "One ACTIVE ServiceContract with a PUBLISHED single-trip Route departing 420 and arriving 468 on 2026-09-02."
            - "One non-ADA vehicle put IN_MAINTENANCE by a same-day OPEN order whose window 600..660 does NOT intersect the trip, so the trip was never displaced and displaced_trip_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T05:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Maintenance Gate Hotel", site_type: "HOTEL", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
              captures: { c15: $.data.id }
            - call: "POST /service-contracts/${c15}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /routes"
              payload: { contract_id: "${c15}", name: "Gate Loop", loop_minutes: 48, headway_minutes: 12, service_window_start_min: 420, service_window_end_min: 420, demand_forecast_pax_per_hour: 0, reference_seat_capacity: 20 }
              as: OpsPlanner
              captures: { r15: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_code: "SHV-1001", seat_capacity: 20, is_ada_accessible: false, odometer_km: 8000, service_interval_km: 20000 }
              as: FleetManager
              captures: { v15: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Nia Osei", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d15: $.data.id }
            - call: "POST /routes/${r15}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r15}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { h1: "$.data[0].id" }
            - call: "POST /maintenance-orders"
              payload: { vehicle_id: "${v15}", kind: "PREVENTIVE", service_date: "2026-09-02", window_start_min: 600, window_end_min: 660 }
              as: FleetManager
              captures: { mo2: $.data.id, mo2_displaced: $.data.displaced_trip_count }
          trigger:
            - call: "POST /trips/${h1}/assign"
              payload: { vehicle_id: "${v15}", driver_id: "${d15}" }
              as: OpsPlanner
              captures: { err_unavail: $.data.error_id }
            - call: "POST /maintenance-orders/${mo2}/close"
              payload: { outcome: "RETURN_TO_SERVICE" }
              as: FleetManager
            - call: "POST /trips/${h1}/assign"
              payload: { vehicle_id: "${v15}", driver_id: "${d15}" }
              as: OpsPlanner
              captures: { h1_status: $.data.dispatch_status }
          assert:
            - "${mo2_displaced} == 0"
            - "${err_unavail} == 'ERR_VEHICLE_UNAVAILABLE'"
            - "the first assign responds with HTTP 409"
            - "GET /vehicles/${v15} -> Vehicle.status == 'AVAILABLE' after the close"
            - "${h1_status} == 'ASSIGNED'"
            - "GET /vehicles/${v15} -> Vehicle.committed_block_minutes == 60"
            - "GET /vehicles/${v15}/maintenance-orders -> the single order has status == 'CLOSED' and outcome == 'RETURN_TO_SERVICE'"

      - name: approve_blocked_by_terminated_contract
        grounds:
          - validations[priority=65]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
          - state_machines.ServiceContract.ACTIVE_to_TERMINATED
          - state_machines.ServicePeriodReport.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          A different entity pair, ServicePeriodReport depending on ServiceContract: a
          SUBMITTED report that would otherwise approve cleanly is refused with
          ERR_CONTRACT_NOT_ACTIVE once the contract reaches TERMINATED, and the report is
          left at status SUBMITTED with settlement_variant still PROVISIONAL.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ServiceContract activated and then TERMINATED."
            - "One ServicePeriodReport for 2026-09-01..2026-09-30 submitted by liaison-7 while the contract was still ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
            - call: "POST /service-contracts"
              payload: { client_name: "Terminated Campus", site_type: "CAMPUS", base_rate_cents_per_service_hour: 9000, term_start_date: "2026-09-01", term_end_date: "2027-08-31", escalation_index_pct: 3.5, sla_on_time_threshold_pct: 92.00, penalty_rate_cents_per_missed_trip: 4500, ada_min_accessible_pct: 25.00 }
              as: ContractAdmin
