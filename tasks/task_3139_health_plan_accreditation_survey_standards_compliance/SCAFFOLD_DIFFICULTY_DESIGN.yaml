  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: element_score_nested_min_max_must_pass_override
        grounds:
          - calculations.element_score
          - entities.FileReviewSample.fields.must_pass_threshold_breached
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs with nested min/max and a
          conditional branch on element.is_must_pass — with sample rate 0.8000
          (< threshold 0.90) on a must-pass element, awarded collapses to 0
          even though file 1.92 + evidence 1.60 = 3.52 would pass through the
          min(max, max(0, raw)) envelope for a non-must-pass element.
        test_recipe:
          setup:
            - "Base chain to EVIDENCE_REVIEW; UM-1 evidence 2/2 ACCEPTED; DENIAL sample with 5 cases, 4 timely (rate 0.8000 < 0.90 threshold)."
          setup_api_calls:
            - *b_clock
            - *b_edition
            - *b_el_um1
            - *b_el_um2
            - *b_el_cr1
            - *b_el_mrr1
            - *b_el_qi1
            - *b_publish
            - *b_plan
            - *b_scope
            - *b_app
            - *b_submit
            - *b_begin
            - *b_ev1
            - *b_appv2
            - *b_ev2
            - *b_acc1
            - *b_acc2
            - *b_sample
            - *b_case1
            - *b_case2
            - *b_case3
            - *b_case4
            - call: "POST /accreditation/file-review-samples/${sample_id}/cases"
              payload: { case_reference: "DN-LATE", service_date: "2025-01-05T00:00:00Z", decision_date: "2025-04-20T00:00:00Z", resolution_date: "2025-04-20T00:00:00Z", required_turnaround_days: 30 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - *b_sample_submit
            - *b_sample_score
          trigger:
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um1}" }
              as: AccreditationOfficer
              captures: { score_breach: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um2}" }
              as: AccreditationOfficer
              captures: { score_um2_low: $.data.id }
          assert:
            - "FileReviewSample.${sample_id}.timeliness_rate == 0.8000 and must_pass_threshold_breached == true (0.8000 < 0.90 and UM has must-pass element UM-1)"
            - "ElementScore.${score_breach}.awarded_points == 0 and forfeited_points == 4 (must-pass override fires for UM-1)"
            - "ElementScore.${score_um2_low}.awarded_points == 1.76 (round(2*0.6*0.8,2)=0.96 + round(2*0.4,2)=0.80; min(2, 1.76) envelope) — same rate, no override because UM-2 is not must-pass"
            - "ElementScore.${score_um2_low}.forfeited_points == 0.24"

      - name: measure_bonus_component_rounding_order
        grounds:
          - calculations.composite_accreditation_score
          - entities.AccreditationOutcome.fields.measure_bonus
        distinguishing_aspect: |
          Mode (b) nested rounding: measure_bonus rounds EACH component to 2
          decimals half-up before summing. quality = round(84.25/100*2.0,2) =
          round(1.685,2) = 1.69 and consumer = round(76.75/100*2.0,2) =
          round(1.535,2) = 1.54, so bonus == 3.23; the trap order
          (sum-then-round) would give round(3.22,2) = 3.22.
        test_recipe:
          setup:
            - "Base chain fully decided: clean run (rate 1.0000, all evidence, no gaps) except MRR-1 takes 1 confirmed gap -> MRR-1 = 2.00 - 0.20 = 1.80."
            - "Four reportable 2025 measures with percentiles 85, 84, 84, 84 (mean 84.25); one 2025 consumer composite 76.75."
            - "Ratios: UM 1.0000, CR 1.0000, MRR round(1.80/2,4)=0.9000, QI 1.0000 -> base = 0.30+0.30+0.18+0.20 = 0.98."
