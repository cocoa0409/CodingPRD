        distinguishing_aspect: "61 seats at a 15% layout loss floors to 51, not 52 (61 x 0.85 = 51.85), and the accessible booking must claim setup_minutes >= ACCESSIBLE_SETUP_MINUTES 30 even though the room only demands 15."
        test_recipe:
          setup:
            - "Branch CEN with a 61-seat WHEELCHAIR_ACCESSIBLE room (min setup 15 / teardown 15) and a DRAFT program carrying accessibility_accommodations [WHEELCHAIR_LAYOUT] with attendance_cap 55."
