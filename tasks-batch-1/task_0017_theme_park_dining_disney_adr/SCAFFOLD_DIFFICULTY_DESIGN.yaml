  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: confirm_then_cancel_preserves_dining_plan_total_credits
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - calculations.dining_plan_credit_debit
          - entities.DiningPlan.fields.table_service_credits_remaining
          - entities.DiningPlan.fields.table_service_credits_held
        distinguishing_aspect: |
          Conserved quantity: DiningPlan total credits =
          table_service_credits_remaining + table_service_credits_held + sum(credits_debited
          across non-cancelled, non-no-show reservations on this plan). CONFIRM raises held
          by N; CANCEL within the free-cancel window lowers held by N and leaves remaining
          unchanged. Pre- and post-pair, the invariant holds: 10 + 0 + 0 = 10 (pre) →
          (during CONFIRM) 10 + 2 + 0 = 12? — actually the invariant is sum = initial; let
          me restate: remaining + held over non-terminal reservations always equals initial
          credits issued. After CONFIRM: remaining=10, held=2 → 12? wrong. The correct
          invariant: remaining counts the unspent pool (10 - 0 debited = 10), held counts
          temporarily-reserved (2). Pre-CONFIRM: 10 remaining, 0 held. Post-CONFIRM: 10
          remaining, 2 held. Post-CANCEL: 10 remaining, 0 held. The invariant
          (`remaining + 0` debited across all non-terminal reservations) ALWAYS equals
          initial=10, AND held returns to 0 after the compensating cancel.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "DiningPlan with table_service_credits_initial=10."
            - "Reservation PENDING for the plan, party_size=2; restaurant.dining_plan_credit_cost=1."
            - "PRE-state captured: DiningPlan.table_service_credits_remaining=10, table_service_credits_held=0."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_ci1@x.com", full_name: "CI1 Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Topolino's", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, is_character_dining: true, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "08:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "DELUXE", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_after_confirm: $.data.version }
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v_after_confirm}" }
              as: Guest
              as_user_id: "${g_id}"
          assert:
            - "DiningPlan.${dp_id}.table_service_credits_remaining == 10"
            - "DiningPlan.${dp_id}.table_service_credits_held == 0"
            - "Reservation.${res_id}.credits_held == 0"
            - "Reservation.${res_id}.status == 'CANCELLED'"
            - "Sum of CreditLedgerEntry.credits_delta for dining_plan_id=${dp_id} equals 0 (HOLD +2, RELEASE -2)"

      - name: confirm_then_cancel_preserves_restaurant_slot_seat_occupancy
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - validations[priority=13]
          - entities.Restaurant.fields.capacity_per_slot
        distinguishing_aspect: |
          Conserved quantity (different from instance 1): Restaurant slot occupancy =
          capacity_per_slot - sum(party_size of non-terminal reservations at this slot).
          Pre-CONFIRM occupancy_free=4. Post-CONFIRM occupancy_free=2. Post-CANCEL
          occupancy_free=4 (returns to baseline). The compensating cancel restores the
          slot's free-seat pool exactly. Verified by observing that a subsequent booking
          for a party_size=4 SUCCEEDS, which would have been rejected with
          ERR_SLOT_CAPACITY_EXCEEDED if the confirm's seat hold had leaked.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Restaurant with capacity_per_slot=4."
            - "Guest A has CONFIRMED party_size=2 at slot 2026-02-15T18:00:00Z, then CANCELLED it (free-cancel window applies)."
            - "Guest B exists with own plan and park session."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
