  - section: calculations
    instances:
      - name: stale_alert_sweep_strict_age_boundary
        claim_type: constants_applied
        grounds: [calculations.backlog_aging_buckets, state_machines.Alert.NEW_to_AUTO_CLOSED, entities.MonitoringScenario.fields.stale_alert_days]
        distinguishing_aspect: "Strict-greater comparison against stale_alert_days: at age exactly 30 days the sweep does NOT close the alert; at 30 days + 1 second it does."
        test_recipe:
          setup: ["One scenario with one firing account; alert alA generated at logical time 2026-05-01T00:00:00Z; stale_alert_days == 30"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-8201" }, as: ComplianceAdmin, captures: { acA: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT", stale_alert_days: 30 }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${acA}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${acA}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { alA: $.data.alert_id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { swept_at_boundary: $.data.alerts_auto_closed } }
            - { call: "GET /alerts/${alA}", as: BSAAnalyst, as_user_id: "${an1}", captures: { alA_mid: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { swept_after: $.data.alerts_auto_closed } }
            - { call: "GET /alerts/${alA}", as: BSAAnalyst, as_user_id: "${an1}", captures: { alA_end: $.data.status, alA_reason: $.data.closure_reason } }
          assert:
            - "At age exactly 30 days (2026-05-31T00:00:00Z): sweep closes 0 alerts; Alert.${alA}.status still NEW (strict > comparison)"
            - "At age 30 days + 1 second: sweep closes 1 alert; Alert.${alA}.status == AUTO_CLOSED with closure_reason == STALE_EXPIRY"

      - name: continuing_review_overdue_strict_boundary
        claim_type: precision
        grounds: [state_machines.ContinuingReview.SCHEDULED_to_OVERDUE, calculations.sar_filing_deadline]
        distinguishing_aspect: "The sweep marks OVERDUE only when now > due_at: at exactly due_at (2026-08-03T00:00:00Z for a 2026-05-05 filing) the review stays SCHEDULED; one second later it flips."
        test_recipe:
          setup: ["SAR1 filed at 2026-05-05T00:00:00Z; its ContinuingReview SCHEDULED with due_at == 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
