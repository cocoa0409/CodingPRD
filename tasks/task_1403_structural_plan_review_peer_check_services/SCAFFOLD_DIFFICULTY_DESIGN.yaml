            - "ReviewRecord.${rec_id}.status == SEALED and sealed_by_reviewer_id == ${rev_id}"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics: strict
  # half-open exclusion on the engagement's cycle slot vs aggregate-capacity
  # overlap on the reviewer's assignment windows)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cycle_slot_strict_exclusion_with_adjacent_handoff
        grounds:
          - errors[ERR_CYCLE_STILL_ACTIVE]
          - state_machines.ReviewCycle.COMMENTS_ISSUED_to_SUPERSEDED
          - "POST /plan-review/cycles side_effects"
        distinguishing_aspect: |
          Resource = the engagement's single cycle slot, strict exclusion with
          half-open semantics: a second cycle is rejected while one is OPEN or
          IN_REVIEW, but a COMMENTS_ISSUED cycle hands off at the same instant
          (adjacency allowed) — the new cycle opens and the old one is
          SUPERSEDED atomically.
        test_recipe:
          setup:
            - "Jurisdiction NC: VALUATION, CALENDAR 15d"
            - "Engagement with a cycle that goes OPEN -> IN_REVIEW -> COMMENTS_ISSUED"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "NC", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Fifteen", licenses: [{ state_code: "NC", license_type: "PE", license_number: "P15", expires_on: "2030-01-01" }] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Slot Exclusion", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://slot-v1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
          trigger:
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://slot-v1b" }
              as: ReviewCoordinator
              captures: { err_open: $.data.error_id }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://slot-v1c" }
              as: ReviewCoordinator
              captures: { err_inreview: $.data.error_id }
            - call: "POST /plan-review/comments"
              payload: { raised_in_cycle_id: "${cyc1}", code_section_ref: "1613.1", reference_edition: "IBC_2021", severity: "MINOR", category: "LATERAL_SYSTEM", comment_text: "Seismic design category misstated" }
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles/${cyc1}/issue-comments"
              payload: {}
              as: Reviewer
              as_user_id: "${rev_id}"
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng_id}", documents_ref: "s3://slot-v2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id }
          assert:
            - "${err_open} == ERR_CYCLE_STILL_ACTIVE (collision while slot occupied by an OPEN cycle)"
            - "${err_inreview} == ERR_CYCLE_STILL_ACTIVE (collision while slot occupied by an IN_REVIEW cycle)"
            - "third creation succeeds: ReviewCycle.${cyc2}.status == OPEN and cycle_number == 2"
            - "ReviewCycle.${cyc1}.status == SUPERSEDED (adjacent handoff at the same instant, no gap)"

      - name: reviewer_capacity_aggregate_overlap_with_release
        grounds:
          - calculations.reviewer_active_load
          - state_machines.ReviewAssignment.ACTIVE_to_RELEASED
          - errors[ERR_REVIEWER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Resource = the reviewer's capacity window, aggregate-capacity
          semantics: up to max overlapping ACTIVE assignment windows may coexist
          (overlap itself is allowed), the (max+1)th collides, and ending one
          window (release) immediately admits a new one.
        test_recipe:
          setup:
            - "Jurisdiction SC; reviewer max_concurrent_assignments=2"
            - "Two engagements with cycles assigned to the reviewer (two overlapping ACTIVE windows)"
            - "Third engagement with an OPEN cycle awaiting assignment"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "SC", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Sixteen", licenses: [{ state_code: "SC", license_type: "PE", license_number: "P16", expires_on: "2030-01-01" }], max_concurrent_assignments: 2 }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Overlap One", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng1: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng1}", documents_ref: "s3://o1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
              captures: { asg1: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Overlap Two", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng2: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng2}", documents_ref: "s3://o2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Overlap Three", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng3: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng3}", documents_ref: "s3://o3" }
              as: ReviewCoordinator
              captures: { cyc3: $.data.id, cyc3_v: $.data.version }
          trigger:
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc3}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc3_v}" }
              as: ReviewCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /plan-review/assignments/${asg1}/release"
              payload: {}
              as: ReviewCoordinator
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc3}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc3_v}" }
              as: ReviewCoordinator
              captures: { asg3: $.data.id }
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { load: $.data.active_assignment_count }
          assert:
            - "two overlapping ACTIVE windows coexisted (overlap allowed up to capacity)"
            - "${err} == ERR_REVIEWER_CAPACITY_EXCEEDED (the max+1-th overlapping window collides)"
            - "after release, the retry succeeds: ${asg3} created with status ACTIVE"
            - "${load} == 2 (release freed one window, retry refilled it)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities: reviewer
  # active-assignment count vs engagement unresolved-comment count)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: assign_release_conserve_reviewer_active_count
        grounds:
          - calculations.reviewer_active_load
          - state_machines.ReviewAssignment.ACTIVE_to_RELEASED
          - entities.Reviewer.fields.active_assignment_count
        distinguishing_aspect: |
          Conserved quantity = Reviewer.active_assignment_count: the forward
          action (POST /assignments, +1) paired with its compensating action
          (POST /assignments/{id}/release, -1) returns the named quantity
          exactly to its pre-action value — zero drift.
        test_recipe:
          setup:
            - "Jurisdiction ID: VALUATION, CALENDAR 15d"
            - "Reviewer (max 3) with one engagement/cycle already assigned: baseline count == 1"
            - "Second engagement with OPEN cycle ready for assignment"
          setup_api_calls:
            - call: "POST /plan-review/jurisdictions"
              payload: { state_code: "ID", ibc_edition: "IBC_2021", asce7_edition: "ASCE7_22", fee_method: "VALUATION", turnaround_days: 15, sla_mode: "CALENDAR", requires_se_seal: false, allows_deferred_submittals: true }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /plan-review/reviewers"
              payload: { full_name: "R Seventeen", licenses: [{ state_code: "ID", license_type: "PE", license_number: "P17", expires_on: "2030-01-01" }], max_concurrent_assignments: 3 }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Invariant Base", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng1: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng1}", documents_ref: "s3://inv-1" }
              as: ReviewCoordinator
              captures: { cyc1: $.data.id, cyc1_v: $.data.version }
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc1}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc1_v}" }
              as: ReviewCoordinator
            - call: "POST /plan-review/engagements"
              payload: { project_name: "Invariant Pair", jurisdiction_id: "${jur_id}", applicant_contact_id: "app-1", reviewer_of_record_id: "${rev_id}", building_type: "COMMERCIAL", risk_category: "II", scope: "FULL_REVIEW", declared_valuation_cents: 30000000, floor_area_sqft: 10000 }
              as: ReviewCoordinator
              captures: { eng2: $.data.id }
            - call: "POST /plan-review/cycles"
              payload: { engagement_id: "${eng2}", documents_ref: "s3://inv-2" }
              as: ReviewCoordinator
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
          trigger:
            - call: "POST /plan-review/assignments"
              payload: { cycle_id: "${cyc2}", reviewer_id: "${rev_id}", expected_cycle_version: "${cyc2_v}" }
              as: ReviewCoordinator
              captures: { asg2: $.data.id }
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { load_after_assign: $.data.active_assignment_count }
            - call: "POST /plan-review/assignments/${asg2}/release"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /plan-review/reviewers/${rev_id}"
              payload: {}
              as: ReviewCoordinator
              captures: { load_after_release: $.data.active_assignment_count }
          assert:
            - "${load_after_assign} == 2 (forward action incremented by exactly 1)"
            - "${load_after_release} == 1 (compensating action restored the pre-action value)"
            - "Reviewer.${rev_id}.active_assignment_count == count of ACTIVE assignments — invariant holds with zero drift"

      - name: response_reopen_conserve_unresolved_comment_count
        grounds:
          - calculations.unresolved_comment_count
          - state_machines.DeficiencyComment.OPEN_to_ADDRESSED
          - state_machines.DeficiencyComment.ADDRESSED_to_REOPENED
          - entities.Engagement.fields.unresolved_comment_count
        distinguishing_aspect: |
          Conserved quantity = Engagement.unresolved_comment_count: the forward
          action (response: OPEN -> ADDRESSED) paired with the reviewer's
          compensating reopen (ADDRESSED -> REOPENED) leaves the named count
          unchanged throughout — only verify/waive may decrement it.
        test_recipe:
          setup:
            - "Jurisdiction MT: VALUATION, BUSINESS 15d"
            - "Cycle 1 COMMENTS_ISSUED with one OPEN comment; baseline unresolved == 1"
