# =============================================================================
# WIC Benefits Management — Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: "WIC Benefits Management: income/nutritional-risk eligibility, category benefit package (infant/pregnant/child), food prescription/EBT, clinic appointment, breastfeeding peer support, vendor authorization, dual-participation check, certification period"

domain_name: wic-benefits-management
api_prefix: ""   # flat topology — every entity is a top-level collection; FK links carried in request bodies

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
    - cascading_side_effects

  entity_topology: flat
  # Peer entities linked by foreign keys (no nested URL paths): Agency, Clinic,
  # Vendor, Household, Participant, Application, IncomeRecord, RiskAssessment,
  # Certification, FoodPrescription, EbtAccount, Redemption, ClinicAppointment,
  # PeerSupportSession — discovered via filtered-list GETs on the FK fields.

  state_machine_shape: branching
  # Application fork-joins to APPROVED/DENIED with divergent side-effect sets;
  # Vendor and Certification carry cyclic revision loops (suspend->reinstate).

  relationship_patterns:
    - one_to_many        # Agency->Clinic, Household->Participant, Certification->FoodPrescription
    - cross_aggregate    # FoodPrescription issuance gated on Certification state; Appointment completion gated on Participant state
    - self_referential   # dual-participation compares Participants across different Households

  role_model: segregation_of_duties
  # CompetentProfessionalAuthority (CPA) runs risk assessment + certifies + issues
  # packages; EligibilityClerk runs income determination; the same staff user may
  # not both determine income and certify the same application (SoD).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Local WIC agency name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code, e.g. CA" }
      - { name: caseload_cap, type: integer, source: input, description: "Maximum number of participants that may hold an ACTIVE certification at once" }
      - { name: active_caseload_count, type: integer, source: computed, default: 0, description: "Count of Participants in ACTIVE status under this agency; debited on certification, credited on termination/expiry" }
      - { name: current_utc, type: datetime, source: system, description: "Deterministic clock for this agency; advanced only via POST /_clock/set_current_utc; defaults to 1970-01-01T00:00:00.000Z" }

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: name, type: string, source: input, description: "Clinic site name" }
      - { name: appointment_buffer_minutes, type: integer, source: input, default: 0, description: "Minutes of buffer enforced between appointments on this clinic; 0 means back-to-back allowed (half-open intervals)" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: legal_name, type: string, source: input, description: "Authorized food vendor legal name" }
      - { name: peer_group, type: enum, source: input, description: "Cost-containment peer group: SMALL | MEDIUM | LARGE" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> AUTHORIZED -> SUSPENDED -> AUTHORIZED (reinstated) | TERMINATED" }
      - { name: violation_points, type: integer, source: computed, default: 0, description: "Accumulated compliance violation points; >= SUSPENSION_THRESHOLD forces SUSPENDED" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id" }
      - { name: household_size, type: integer, source: input, description: "Number of persons in the economic unit (excludes counted pregnancies)" }
      - { name: pregnancy_count, type: integer, source: input, default: 0, description: "Number of in-progress pregnancies; each adds 1 to adjusted household size for the income test" }
      - { name: adjunctive_program, type: enum, source: input, default: NONE, description: "Auto income-eligibility program enrollment: NONE | SNAP | MEDICAID | TANF" }

  - name: Participant
    parent: null
    common_fields: true   # OCC parent: version supports expected_participant_version
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id" }
      - { name: agency_id, type: string, source: system, description: "Denormalized copy of Household.agency_id at creation" }
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four SSN digits; with full_name forms the dual-participation identity key" }
      - { name: category, type: enum, source: input, description: "WIC category: PREGNANT | POSTPARTUM | BREASTFEEDING | INFANT | CHILD" }
      - { name: breastfeeding_opt_in, type: boolean, source: input, default: false, description: "Whether this participant requests breastfeeding peer support" }
      - { name: status, type: enum, source: system, default: APPLICANT, description: "APPLICANT -> ACTIVE -> (SUSPENDED -> ACTIVE) -> TERMINATED" }
      - { name: priority_level, type: integer, source: computed, description: "WIC nutrition priority I(1)..VII(7), derived from category at certification; null until certified" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: income_method, type: enum, source: input, default: ANNUALIZE_RECENT, description: "Income determination method: ANNUALIZE_RECENT | AVERAGE_ALL" }
      - { name: annual_income_determined, type: number, source: computed, description: "Computed annualized household income; null until income determined" }
      - { name: income_limit, type: number, source: computed, description: "185% FPG limit for the household's adjusted size; null until income determined" }
      - { name: income_eligible, type: boolean, source: computed, description: "True when annual_income_determined <= income_limit OR household.adjunctive_program != NONE" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of the EligibilityClerk who ran determine-income (SoD anchor)" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the CPA who approved; must differ from determined_by_user_id" }
      - { name: risk_factor_codes, type: array, source: input, description: "Nutritional risk factor codes recorded at assess-risk, each from RISK_FACTOR_POINTS; empty until assessed" }
      - { name: total_risk_score, type: integer, source: computed, description: "Sum of severity points over risk_factor_codes; null until assessed" }
      - { name: risk_eligible, type: boolean, source: computed, description: "True when total_risk_score >= RISK_THRESHOLD for the participant category OR a high-priority factor is present; null until assessed" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> INCOME_DETERMINED -> RISK_ASSESSED -> {APPROVED | DENIED}" }

  - name: IncomeRecord
    parent: null
    common_fields: false   # append-only evidence: id + created_at only
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id" }
      - { name: gross_amount_cents, type: integer, source: input, description: "Gross pay amount in cents for one pay period" }
      - { name: pay_frequency, type: enum, source: input, description: "WEEKLY | BIWEEKLY | MONTHLY | ANNUAL" }
      - { name: sequence_index, type: integer, source: system, description: "0-based creation order within the application; pins chronological processing order, never id" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; set by the approve cascade" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the approved application this cert was minted from" }
      - { name: period_start_utc, type: datetime, source: system, description: "Certification period start; equals agency.current_utc at approval" }
      - { name: period_end_utc, type: datetime, source: system, description: "period_start_utc + cert_length_days; inclusive lower / exclusive upper" }
      - { name: cert_length_days, type: integer, source: computed, description: "Certification period length in days, derived from participant category" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> (SUSPENDED -> ACTIVE) -> EXPIRED | TERMINATED" }

  - name: FoodPrescription
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id" }
      - { name: participant_id, type: string, source: system, description: "Denormalized copy of Certification.participant_id" }
      - { name: issuance_mode, type: enum, source: input, default: FULL, description: "FULL (full monthly cap) | PRORATED (floor-per-item by days remaining in issuance month)" }
      - { name: line_items, type: array, source: input, description: "List of {food_category, requested_units}; food_category from FOOD_CATEGORIES" }
      - { name: prescribed_value_cents, type: integer, source: computed, description: "Sum over items of issued_units * unit_price_cents; issued_units = min(requested_units, category_cap), floored by proration when issuance_mode=PRORATED" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED -> REDEEMED_PARTIAL -> REDEEMED_FULL | VOIDED" }

  - name: EbtAccount
    parent: null
    common_fields: true   # derived-field reconciliation parent
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: balance_units, type: object, source: computed, description: "Map food_category -> remaining issued units; debited on redemption, zeroed on void" }
      - { name: issued_value_cents, type: integer, source: computed, default: 0, description: "Cumulative value of units issued onto this account across food prescriptions" }
      - { name: redeemed_value_cents, type: integer, source: computed, default: 0, description: "Cumulative value of redeemed units (chronological draw-down)" }
      - { name: voided_value_cents, type: integer, source: computed, default: 0, description: "Cumulative value voided when a prescription is voided" }
      - { name: remaining_value_cents, type: integer, source: computed, default: 0, description: "= issued_value_cents - redeemed_value_cents - voided_value_cents (conserved-quantity invariant)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> FROZEN (on suspend/terminate/expiry); reopened to OPEN on reinstatement" }

  - name: Redemption
    parent: null
    common_fields: false   # append-only ledger event: id + created_at only
    fields:
      - { name: ebt_account_id, type: string, source: input, description: "FK -> EbtAccount.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the authorized vendor where redemption occurred" }
      - { name: food_category, type: enum, source: input, description: "Food category drawn down; from FOOD_CATEGORIES" }
      - { name: units, type: integer, source: input, description: "Units redeemed (positive integer); must not exceed remaining balance for the category" }
      - { name: value_cents, type: integer, source: computed, description: "= units * unit_price_cents for food_category" }
      - { name: sequence_index, type: integer, source: system, description: "0-based creation order within the EBT account; pins chronological replay order, never id" }

  - name: ClinicAppointment
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the participant being seen" }
      - { name: purpose, type: enum, source: input, description: "INITIAL_CERT | RECERT | NUTRITION_ED | BF_SUPPORT" }
      - { name: start_utc, type: datetime, source: input, description: "Appointment start (inclusive); half-open interval [start_utc, end_utc)" }
      - { name: end_utc, type: datetime, source: input, description: "Appointment end (exclusive)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> (RESCHEDULED -> SCHEDULED) -> COMPLETED | NO_SHOW | CANCELLED" }

  - name: PeerSupportSession
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: peer_counselor_id, type: string, source: input, description: "Opaque id of the breastfeeding peer counselor leading the session" }
      - { name: start_utc, type: datetime, source: input, description: "Session start; collision uses a SESSION_BUFFER_MINUTES travel buffer around each session per counselor" }
      - { name: end_utc, type: datetime, source: input, description: "Session end" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: INCOME_DETERMINED
        trigger: "POST /applications/{id}/determine-income"
        actor: EligibilityClerk
        preconditions:
          - "Application in DRAFT (ERR_INVALID_STATE)"
          - "At least one IncomeRecord exists for the application (ERR_NO_INCOME_RECORDS)"
        side_effects:
          - "Compute annual_income_determined per income_method (calculations.income_determination)"
          - "Compute income_limit from household adjusted size (calculations.income_limit)"
          - "Set income_eligible (calculations.income_eligibility)"
          - "Stamp determined_by_user_id = X-User-ID"
          - "increments Application.version by 1"
      - from: INCOME_DETERMINED
        to: RISK_ASSESSED
        trigger: "POST /applications/{id}/assess-risk"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Application in INCOME_DETERMINED (ERR_INVALID_STATE)"
        side_effects:
          - "Record risk_factor_codes; compute total_risk_score and risk_eligible (calculations.nutritional_risk_score)"
          - "Application -> RISK_ASSESSED; increments Application.version by 1"
      - from: RISK_ASSESSED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Application in RISK_ASSESSED (ERR_INVALID_STATE)"
          - "X-User-ID != determined_by_user_id — segregation of duties (ERR_SEGREGATION_OF_DUTIES)"
          - "No Participant in a DIFFERENT household with identical (full_name, ssn_last4) holding an ACTIVE Certification — dual participation (ERR_DUAL_PARTICIPATION)"
          - "income_eligible == true (ERR_INCOME_INELIGIBLE)"
          - "risk_eligible == true (ERR_RISK_INELIGIBLE)"
          - "agency.active_caseload_count < agency.caseload_cap (ERR_CASELOAD_EXCEEDED)"
        side_effects:
          - "BRANCH-APPROVE: stamp certified_by_user_id = X-User-ID; Application -> APPROVED"
          - "Cascade L1: create Certification(status=ACTIVE) for the participant (calculations.cert_length sets period dates, cert_length_days; participant.priority_level set)"
          - "Cascade L2: that Certification creation transitions Participant APPLICANT -> ACTIVE, increments agency.active_caseload_count by 1, and creates the participant's EbtAccount(status=OPEN) if absent"
        note: "depth-3 cascade origin: approve -> Certification ACTIVE -> Participant ACTIVE + caseload debit + EbtAccount."
      - from: RISK_ASSESSED
        to: DENIED
        trigger: "POST /applications/{id}/deny"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Application in RISK_ASSESSED (ERR_INVALID_STATE)"
        side_effects:
          - "BRANCH-DENY: Application -> DENIED; NO Certification created; Participant remains APPLICANT; agency.active_caseload_count unchanged; increments Application.version by 1"
        note: "Divergent side-effect set vs APPROVED branch — fork-join non-linear shape on Application."

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /certifications/{id}/suspend"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Certification in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Participant ACTIVE -> SUSPENDED; increments Participant.version by 1"
          - "EbtAccount OPEN -> FROZEN"
          - "agency.active_caseload_count unchanged (slot held during suspension)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /certifications/{id}/reinstate"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Certification in SUSPENDED (ERR_INVALID_STATE)"
          - "agency.current_utc < period_end_utc — not past period (ERR_CERT_PERIOD_ENDED)"
        side_effects:
          - "Participant SUSPENDED -> ACTIVE; increments Participant.version by 1"
          - "EbtAccount FROZEN -> OPEN"
        note: "Cyclic revision loop ACTIVE<->SUSPENDED on Certification (distinct entity from Vendor loop)."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance-expirations (system sweep) — per cert when current_utc >= period_end_utc"
        actor: system
        preconditions:
          - "agency.current_utc >= period_end_utc"
        side_effects:
          - "Certification ACTIVE -> EXPIRED"
          - "Participant ACTIVE -> TERMINATED; increments Participant.version by 1"
          - "agency.active_caseload_count decremented by 1"
          - "EbtAccount OPEN -> FROZEN"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /certifications/{id}/terminate"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Certification in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade L1: Certification -> TERMINATED; Participant -> TERMINATED; agency.active_caseload_count decremented by 1 (compensates the approval debit)"
          - "Cascade L2: every FoodPrescription on this certification with status in {ISSUED, REDEEMED_PARTIAL} -> VOIDED"
          - "Cascade L3: each VOIDED prescription moves its unredeemed value to EbtAccount.voided_value_cents, zeroes those balance_units, and EbtAccount recomputes remaining_value_cents"
          - "EbtAccount -> FROZEN; increments Participant.version by 1"
        note: "depth-3 cascade origin: terminate -> FoodPrescription VOIDED -> EbtAccount voided_value/remaining recompute."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /certifications/{id}/terminate"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Certification in SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade as ACTIVE->TERMINATED"

  - entity: FoodPrescription
    initial_state: ISSUED
    terminal_states: [REDEEMED_FULL, VOIDED]
    transitions:
      - from: ISSUED
        to: REDEEMED_PARTIAL
        trigger: "POST /redemptions (first redemption that leaves units remaining)"
        actor: Participant
        preconditions:
          - "Owning Certification.status == ACTIVE — cross-entity gate (ERR_CERT_NOT_ACTIVE)"
          - "EbtAccount.status == OPEN (ERR_EBT_FROZEN)"
          - "Vendor.status == AUTHORIZED (ERR_VENDOR_NOT_AUTHORIZED)"
          - "Redemption units <= remaining balance_units for food_category (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Append Redemption; debit balance_units[food_category]; bump EbtAccount.redeemed_value_cents; recompute remaining_value_cents"
          - "If any prescription unit still remains: FoodPrescription status -> REDEEMED_PARTIAL"
      - from: REDEEMED_PARTIAL
        to: REDEEMED_FULL
        trigger: "POST /redemptions (final redemption draining the last units)"
        actor: Participant
        preconditions:
          - "Owning Certification.status == ACTIVE (ERR_CERT_NOT_ACTIVE)"
          - "EbtAccount.status == OPEN (ERR_EBT_FROZEN)"
          - "Vendor.status == AUTHORIZED (ERR_VENDOR_NOT_AUTHORIZED)"
          - "Redemption units <= remaining balance_units for food_category (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Debit balance_units; when all prescription units redeemed: status -> REDEEMED_FULL"
      - from: ISSUED
        to: VOIDED
        trigger: "Cascade from Certification ACTIVE/SUSPENDED -> TERMINATED (or EXPIRED)"
        actor: system
        preconditions:
          - "Owning Certification transitioned to TERMINATED or EXPIRED"
        side_effects:
          - "status -> VOIDED; full prescribed value moved to EbtAccount.voided_value_cents; balance_units zeroed"
      - from: REDEEMED_PARTIAL
        to: VOIDED
        trigger: "Cascade from Certification ACTIVE/SUSPENDED -> TERMINATED (or EXPIRED)"
        actor: system
        preconditions:
          - "Owning Certification transitioned to TERMINATED or EXPIRED"
        side_effects:
          - "status -> VOIDED; remaining unredeemed value moved to EbtAccount.voided_value_cents; balance_units zeroed"

  - entity: Vendor
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /vendors/{id}/authorize"
        actor: EligibilityClerk
        preconditions:
          - "Vendor in PENDING (ERR_INVALID_STATE)"
        side_effects: ["status -> AUTHORIZED"]
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /vendors/{id}/record-violation (when cumulative violation_points >= SUSPENSION_THRESHOLD)"
        actor: EligibilityClerk
        preconditions:
          - "Vendor in AUTHORIZED (ERR_INVALID_STATE)"
        side_effects:
          - "violation_points += points; when violation_points >= SUSPENSION_THRESHOLD: status -> SUSPENDED"
          - "A SUSPENDED vendor cannot back redemptions (cross-entity gate on Redemption)"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /vendors/{id}/reinstate"
        actor: EligibilityClerk
        preconditions:
          - "Vendor in SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> AUTHORIZED; violation_points reset to 0"
        note: "Cyclic revision loop AUTHORIZED<->SUSPENDED on Vendor (distinct entity from Application branch and Certification loop)."
      - from: AUTHORIZED
        to: TERMINATED
        trigger: "POST /vendors/{id}/terminate"
        actor: EligibilityClerk
        preconditions:
          - "Vendor in AUTHORIZED or SUSPENDED (ERR_INVALID_STATE)"
        side_effects: ["status -> TERMINATED (permanent)"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /vendors/{id}/terminate"
        actor: EligibilityClerk
        preconditions:
          - "Vendor in SUSPENDED (ERR_INVALID_STATE)"
        side_effects: ["status -> TERMINATED (permanent)"]

  - entity: ClinicAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "PATCH /clinic-appointments/{id} (new start/end)"
        actor: EligibilityClerk
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
          - "New [start_utc,end_utc) does not collide on the clinic (calculations.appointment_overlap) (ERR_APPOINTMENT_OVERLAP)"
        side_effects: ["Update start_utc/end_utc; status -> RESCHEDULED"]
      - from: RESCHEDULED
        to: SCHEDULED
        trigger: "POST /clinic-appointments/{id}/confirm"
        actor: EligibilityClerk
        preconditions:
          - "Appointment in RESCHEDULED (ERR_INVALID_STATE)"
        side_effects: ["status -> SCHEDULED"]
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /clinic-appointments/{id}/complete"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
          - "Participant.status IN {APPLICANT, ACTIVE} — cross-entity gate (ERR_PARTICIPANT_NOT_SERVICEABLE)"
        side_effects: ["status -> COMPLETED"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /clinic-appointments/{id}/no-show"
        actor: EligibilityClerk
        preconditions:
          - "Appointment in SCHEDULED (ERR_INVALID_STATE)"
          - "agency.current_utc >= end_utc (ERR_APPOINTMENT_NOT_PAST)"
        side_effects: ["status -> NO_SHOW"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic-appointments/{id}/cancel"
        actor: EligibilityClerk
        preconditions:
          - "Appointment in SCHEDULED or RESCHEDULED (ERR_INVALID_STATE)"
        side_effects: ["status -> CANCELLED (frees the interval)"]

  - entity: PeerSupportSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /peer-sessions/{id}/complete"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Session in SCHEDULED (ERR_INVALID_STATE)"
        side_effects: ["status -> COMPLETED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /peer-sessions/{id}/cancel"
        actor: CompetentProfessionalAuthority
        preconditions:
          - "Session in SCHEDULED (ERR_INVALID_STATE)"
        side_effects: ["status -> CANCELLED (frees the buffered interval)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: appointment-schedule-stale-clinic
    parent_entity: Clinic
    write_endpoint: "POST /clinic-appointments"
    occ_field: "expected_clinic_version"
    description: |
      Scheduling a ClinicAppointment against a Clinic whose version has advanced
      since the client last observed it is rejected. A previously scheduled
      appointment legitimately occupies an interval and advances the clinic
      version; a client holding a stale clinic view would otherwise place a
      colliding interval against an outdated occupancy picture.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: foodprescription-issue-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /food-prescriptions"
    occ_field: "expected_participant_version"
    description: |
      Issuing a FoodPrescription against a Participant whose version has advanced
      since the client last observed it is rejected. A prior issuance (or a
      certification suspend/reinstate cascade) legitimately advanced the
      participant version, so the current issuer's view of the participant — and
      of the EBT balance it would top up — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: income_limit
    trigger: "Application DRAFT -> INCOME_DETERMINED (determine-income)"
    algorithm: threshold
    formula: |
      adjusted_size = household.household_size + household.pregnancy_count
      base_fpg = FPG_ANNUAL[adjusted_size]          # exact lookup; sizes > 8 add FPG_INCREMENT per extra person
      income_limit = round(base_fpg * WIC_INCOME_PCT, 2)   # 185% of poverty
    input_set: "The owning participant's household at determine-income time."
    constants:
      WIC_INCOME_PCT: 1.85
      FPG_ANNUAL: { 1: 15060, 2: 20440, 3: 25820, 4: 31200, 5: 36580, 6: 41960, 7: 47340, 8: 52720 }
      FPG_INCREMENT: 5380
    precision: "2 decimal places, round_half_up"

  - name: income_determination
    trigger: "Application DRAFT -> INCOME_DETERMINED (determine-income)"
    algorithm: chronological
    formula: |
      annualize(amount_cents, freq) = (amount_cents / 100.0) * FREQ_MULT[freq]
      most_recent = the IncomeRecord with the highest sequence_index (never by id)
      Variant ANNUALIZE_RECENT:
        annual = round(annualize(most_recent.gross_amount_cents, most_recent.pay_frequency), 2)
      Variant AVERAGE_ALL:
        peers = IncomeRecords whose pay_frequency == most_recent.pay_frequency
        avg_cents = round(mean(gross_amount_cents over peers))   # round to whole cents, half_up
        annual = round(annualize(avg_cents, most_recent.pay_frequency), 2)
    input_set: "All IncomeRecords for the application; chronological order pinned by sequence_index ASC; never id."
    constants:
      FREQ_MULT: { WEEKLY: 52, BIWEEKLY: 26, MONTHLY: 12, ANNUAL: 1 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ANNUALIZE_RECENT
        when: "application.income_method == ANNUALIZE_RECENT (default)"
        difference: "Uses only the highest-sequence_index record; ignores earlier records."
      - name: AVERAGE_ALL
        when: "application.income_method == AVERAGE_ALL"
        difference: "Averages all same-frequency records before annualizing — diverges from RECENT whenever amounts vary."

  - name: income_eligibility
    trigger: "Application DRAFT -> INCOME_DETERMINED (determine-income)"
    algorithm: threshold
    formula: |
      income_eligible = (household.adjunctive_program != NONE)
                        OR (annual_income_determined <= income_limit)
    input_set: "annual_income_determined and income_limit just computed; household.adjunctive_program."
    precision: "exact; boundary is inclusive (<=) — income == limit is ELIGIBLE"

  - name: nutritional_risk_score
    trigger: "Application INCOME_DETERMINED -> RISK_ASSESSED (assess-risk)"
    algorithm: weighted_scoring
    formula: |
      total_risk_score = sum(RISK_FACTOR_POINTS[code] for code in risk_factor_codes)
      high_priority_present = any(code in HIGH_PRIORITY_FACTORS for code in risk_factor_codes)
      risk_eligible = high_priority_present OR (total_risk_score >= RISK_THRESHOLD[participant.category])
    input_set: "risk_factor_codes on the Application; participant.category for the threshold."
    constants:
      RISK_FACTOR_POINTS: { ANEMIA: 40, UNDERWEIGHT: 35, INADEQUATE_DIET: 20, SHORT_STATURE: 15, ELEVATED_LEAD: 50, GEST_DIABETES: 45 }
      HIGH_PRIORITY_FACTORS: [ELEVATED_LEAD, GEST_DIABETES]
      RISK_THRESHOLD: { PREGNANT: 30, POSTPARTUM: 30, BREASTFEEDING: 30, INFANT: 25, CHILD: 35 }
    precision: "integer points; threshold boundary inclusive (>=)"

  - name: cert_length
    trigger: "Application RISK_ASSESSED -> APPROVED (cascade creates Certification)"
    algorithm: threshold
    formula: |
      cert_length_days = CERT_LENGTH_DAYS[participant.category]
      period_start_utc = agency.current_utc
      period_end_utc   = period_start_utc + cert_length_days days   # exclusive upper bound
      participant.priority_level = PRIORITY_BY_CATEGORY[participant.category]
    input_set: "participant.category at approval time; agency.current_utc."
    constants:
      CERT_LENGTH_DAYS: { PREGNANT: 280, POSTPARTUM: 180, BREASTFEEDING: 365, INFANT: 365, CHILD: 365 }
      PRIORITY_BY_CATEGORY: { PREGNANT: 1, BREASTFEEDING: 1, INFANT: 1, POSTPARTUM: 6, CHILD: 3 }

  - name: prescribed_value
    trigger: "POST /food-prescriptions (FoodPrescription create)"
    algorithm: tiered_pricing
    formula: |
      For each line_item {food_category, requested_units}:
        cap = CATEGORY_CAP[participant.category][food_category]   # absent => ERR_CATEGORY_FOOD_MISMATCH
        capped_units = min(requested_units, cap)
        if issuance_mode == FULL:
            issued_units = capped_units
        else:   # PRORATED — rounding ORDER PINNED: floor per-item BEFORE pricing, then sum
            days_in_month  = number of days in the calendar month of agency.current_utc
            days_remaining = days_in_month - day_of_month(agency.current_utc) + 1   # inclusive of current day
            factor         = days_remaining / days_in_month
            issued_units   = floor(capped_units * factor)
        item_value = issued_units * UNIT_PRICE_CENTS[food_category]
      prescribed_value_cents = sum(item_value over line_items)     # sum AFTER per-item floor
    input_set: "FoodPrescription.line_items; participant.category; agency.current_utc for proration."
    constants:
      UNIT_PRICE_CENTS: { MILK: 350, EGGS: 300, JUICE: 250, CEREAL: 400, FRUIT_VEG: 200, INFANT_FORMULA: 1200, INFANT_CEREAL: 300 }
      CATEGORY_CAP:
        PREGNANT:      { MILK: 4, EGGS: 2, JUICE: 2, CEREAL: 3, FRUIT_VEG: 11 }
        POSTPARTUM:    { MILK: 4, EGGS: 2, JUICE: 2, CEREAL: 3, FRUIT_VEG: 9 }
        BREASTFEEDING: { MILK: 6, EGGS: 2, JUICE: 2, CEREAL: 4, FRUIT_VEG: 11 }
        INFANT:        { INFANT_FORMULA: 9, INFANT_CEREAL: 24, FRUIT_VEG: 8 }
        CHILD:         { MILK: 4, EGGS: 1, JUICE: 2, CEREAL: 4, FRUIT_VEG: 8 }
    precision: "integer cents; floor on prorated units; no rounding after summation"
    variants:
      - name: FULL
        when: "issuance_mode == FULL"
        difference: "issued_units = min(requested, cap); full monthly package value."
      - name: PRORATED
        when: "issuance_mode == PRORATED"
        difference: "issued_units = floor(min(requested,cap) * days_remaining/days_in_month) — floor-per-item-then-sum, NOT sum-then-round."

  - name: ebt_reconciliation
    trigger: "FoodPrescription issuance (top-up), Redemption (draw-down), FoodPrescription VOIDED (void)"
    algorithm: aggregation
    formula: |
      issued_value_cents   = sum(prescribed_value_cents over all FoodPrescriptions seeded onto this account)
      redeemed_value_cents = sum(value_cents over all Redemptions, processed ASC by sequence_index)
      voided_value_cents   = sum(unredeemed value moved on each VOIDED prescription)
      remaining_value_cents = issued_value_cents - redeemed_value_cents - voided_value_cents
      INVARIANT: remaining_value_cents == sum over food_category c of balance_units[c] * UNIT_PRICE_CENTS[c]
    input_set: "All FoodPrescriptions and Redemptions on the participant's EbtAccount; chronological by sequence_index, never id."
    precision: "integer cents; remaining never negative"

  - name: vendor_violation_suspension
    trigger: "POST /vendors/{id}/record-violation"
    algorithm: threshold
    formula: |
      violation_points = violation_points + points
      if violation_points >= SUSPENSION_THRESHOLD: status -> SUSPENDED   # boundary inclusive (>=)
    input_set: "The vendor's prior violation_points plus the points in this request."
    constants:
      SUSPENSION_THRESHOLD: 100
    precision: "integer points; threshold boundary inclusive (>=)"

  - name: appointment_overlap
    trigger: "POST /clinic-appointments, PATCH /clinic-appointments/{id} (clinic resource); POST /peer-sessions (counselor resource)"
    algorithm: interval_merge
    formula: |
      CLINIC (ClinicAppointment, half-open, no buffer):
        candidate interval Cnew = [start_utc, end_utc)
        For each existing appt E on the SAME clinic_id with status IN {SCHEDULED, RESCHEDULED}:
          collide if (Cnew.start < E.end) AND (E.start < Cnew.end)   # strict; touching endpoints DO NOT collide
        Adjacent intervals (Cnew.start == E.end OR Cnew.end == E.start) are allowed.
      COUNSELOR (PeerSupportSession, closed with travel buffer):
        candidate interval Pnew = [start_utc, end_utc]
        For each existing session E on the SAME peer_counselor_id with status == SCHEDULED:
          gap_minutes = minutes between the two intervals (0 if they overlap)
          collide if gap_minutes < SESSION_BUFFER_MINUTES   # strict <; a gap of exactly the buffer is allowed
        Note: counselor collision is buffer-based aggregate adjacency, NOT half-open arithmetic — different interval semantics from the clinic rule.
    input_set: "Existing non-terminal appointments on the clinic (clinic rule); existing SCHEDULED sessions on the counselor (counselor rule)."
    constants:
      SESSION_BUFFER_MINUTES: 15
    precision: "datetime comparison; clinic uses strict half-open overlap, counselor uses strict < buffer gap"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path- and body-referenced resources exist, validated left-to-right (path ids before body FK ids)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches parent.version (concurrency_rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clinic-appointments, POST /food-prescriptions"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: certifier (X-User-ID at approve) differs from determined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/approve"

  - priority: 8
    category: business_safety
    check: "Dual participation: no other participant in a different household with identical (full_name, ssn_last4) holds an ACTIVE certification"
    error_id: ERR_DUAL_PARTICIPATION
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 9
    category: business_referential
    check: "Redemption vendor exists & is AUTHORIZED"
    error_id: ERR_VENDOR_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /redemptions"

  - priority: 10
    category: business_constraint
    check: "Eligibility gates: income_eligible and risk_eligible true before approval; food line item allowed for category"
    error_id: ERR_INCOME_INELIGIBLE
    http_status: 409
    applies_to: "POST /applications/{id}/approve, POST /food-prescriptions"

  - priority: 11
    category: business_temporal
    check: "Temporal overlap: appointment interval [start,end) collides on clinic; peer session collides within buffer on counselor"
    error_id: ERR_APPOINTMENT_OVERLAP
    http_status: 409
    applies_to: "POST /clinic-appointments, PATCH /clinic-appointments/{id}, POST /peer-sessions"

  - priority: 12
    category: business_fiscal
    check: "Fiscal/quota: agency caseload cap not exceeded; redemption units within remaining EBT balance"
    error_id: ERR_CASELOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/approve, POST /redemptions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set an agency's deterministic clock (test-driving)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: [agency_id, to_iso8601]
    output: Agency
    side_effects: ["agency.current_utc := to_iso8601"]

  - method: POST
    path: "/_clock/advance-expirations"
    description: "System sweep: expire ACTIVE certifications whose period_end_utc <= agency.current_utc (test-driving + ops)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: [agency_id]
    output: "{ expired_certification_ids: string[], expired_count: integer }"
    side_effects:
      - "Each ACTIVE cert with current_utc >= period_end_utc -> EXPIRED; Participant -> TERMINATED; active_caseload_count--; FoodPrescriptions VOIDED; EbtAccount -> FROZEN"

  # ---------- Agency ----------
  - method: POST
    path: "/agencies"
    description: "Create a local WIC agency."
    roles: [EligibilityClerk]
    code: 201
    input: [name, state_code, caseload_cap]
    output: Agency
    side_effects: ["active_caseload_count=0; current_utc=1970-01-01T00:00:00.000Z"]

  - method: GET
    path: "/agencies/{id}"
    description: "Get an agency (active_caseload_count, current_utc, version)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # ---------- Clinic ----------
  - method: POST
    path: "/clinics"
    description: "Create a clinic site."
    roles: [EligibilityClerk]
    code: 201
    input: [agency_id, name, "appointment_buffer_minutes?"]
    output: Clinic
    side_effects: []

  - method: GET
    path: "/clinics/{id}"
    description: "Get a clinic (version for OCC)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: GET
    path: "/clinics"
    description: "List clinics, filterable by agency_id (reverse-reachability for Clinic.agency_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["agency_id?", "limit?", "offset?"]
    output: Clinic[]
    side_effects: []

  # ---------- Vendor ----------
  - method: POST
    path: "/vendors"
    description: "Register a food vendor (PENDING)."
    roles: [EligibilityClerk]
    code: 201
    input: [agency_id, legal_name, peer_group]
    output: Vendor
    side_effects: ["status=PENDING; violation_points=0"]

  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors, filterable by agency_id (reverse-reachability for Vendor.agency_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["agency_id?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: POST
    path: "/vendors/{id}/authorize"
    description: "Authorize a PENDING vendor."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> AUTHORIZED"]

  - method: POST
    path: "/vendors/{id}/record-violation"
    description: "Record compliance violation points; may auto-suspend."
    roles: [EligibilityClerk]
    code: 200
    input: [points]
    output: Vendor
    side_effects: ["violation_points += points; if >= SUSPENSION_THRESHOLD -> SUSPENDED"]

  - method: POST
    path: "/vendors/{id}/reinstate"
    description: "Reinstate a SUSPENDED vendor."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> AUTHORIZED; violation_points=0"]

  - method: POST
    path: "/vendors/{id}/terminate"
    description: "Terminate a vendor (permanent)."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> TERMINATED"]

  # ---------- Household ----------
  - method: POST
    path: "/households"
    description: "Create a household economic unit."
    roles: [EligibilityClerk]
    code: 201
    input: [agency_id, household_size, "pregnancy_count?", "adjunctive_program?"]
    output: Household
    side_effects: []

  - method: GET
    path: "/households/{id}"
    description: "Get a household."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/households"
    description: "List households, filterable by agency_id (reverse-reachability for Household.agency_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["agency_id?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # ---------- Participant ----------
  - method: POST
    path: "/participants"
    description: "Create a participant in a household (APPLICANT)."
    roles: [EligibilityClerk]
    code: 201
    input: [household_id, full_name, ssn_last4, category, "breastfeeding_opt_in?"]
    output: Participant
    side_effects: ["status=APPLICANT; agency_id copied from household; version=1"]

  - method: GET
    path: "/participants/{id}"
    description: "Get a participant (status, priority_level, version for OCC)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority, Participant]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List participants, filterable by household_id (reverse-reachability for Participant.household_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  # ---------- Application ----------
  - method: POST
    path: "/applications"
    description: "Open a certification application (DRAFT)."
    roles: [EligibilityClerk]
    code: 201
    input: [participant_id, "income_method?"]
    output: Application
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/applications/{id}"
    description: "Get an application (income/eligibility fields, version)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: GET
    path: "/applications"
    description: "List applications, filterable by participant_id (reverse-reachability for Application.participant_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["participant_id?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: POST
    path: "/income-records"
    description: "Attach an income record (pay stub) to an application."
    roles: [EligibilityClerk]
    code: 201
    input: [application_id, gross_amount_cents, pay_frequency]
    output: IncomeRecord
    side_effects: ["sequence_index assigned in creation order within the application"]

  - method: GET
    path: "/income-records/{id}"
    description: "Get an income record."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: IncomeRecord
    side_effects: []

  - method: GET
    path: "/income-records"
    description: "List income records, filterable by application_id (reverse-reachability for IncomeRecord.application_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: IncomeRecord[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/determine-income"
    description: "Run income determination (DRAFT -> INCOME_DETERMINED)."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Compute annual_income_determined, income_limit, income_eligible; stamp determined_by_user_id; increments Application.version"

  - method: POST
    path: "/applications/{id}/assess-risk"
    description: "Record the nutritional risk assessment on the application (INCOME_DETERMINED -> RISK_ASSESSED)."
    roles: [CompetentProfessionalAuthority]
    code: 200
    input: [risk_factor_codes]
    output: Application
    side_effects: ["compute total_risk_score, risk_eligible; advance application; increments Application.version"]

  - method: POST
    path: "/applications/{id}/approve"
    description: "Approve & certify (RISK_ASSESSED -> APPROVED); cascades Certification creation."
    roles: [CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Application
    side_effects:
      - "Cascade: create Certification(ACTIVE); Participant -> ACTIVE; active_caseload_count++; EbtAccount(OPEN) created if absent"

  - method: POST
