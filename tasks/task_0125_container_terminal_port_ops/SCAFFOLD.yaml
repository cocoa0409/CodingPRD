scenario: "Container Terminal & Port Operations: vessel berth window, yard slot/stacking, truck gate appointment, demurrage/detention, customs hold release, reefer monitoring, equipment interchange receipt, dwell time"
domain_name: container-terminal-port-ops
api_prefix: /

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities (Vessel, BerthWindow, Container, YardSlot, ...) linked by
  # foreign keys, no nesting in URL paths. A container references its yard slot
  # and customs hold by FK; a berth window references a berth and a vessel.

  state_machine_shape: branching
  # Container has a branching customs path (PENDING -> {HELD, CLEARED}) with
  # divergent side effects; BerthWindow has a revert cycle (BERTHED -> SCHEDULED);
  # GateAppointment has a cyclic no-show/reschedule loop.

  relationship_patterns:
    - one_to_many        # Berth has many BerthWindows; Vessel has many Containers
    - cross_aggregate    # Container references YardSlot and CustomsHold across aggregates
    - self_referential   # YardSlot stacking: a slot references the slot directly below it

  role_model: peer_roles
  # Distinct operational roles own distinct resource types:
  # BerthPlanner owns berth windows, YardPlanner owns yard slots/stacking,
  # GateOperator owns gate appointments + EIRs, CustomsOfficer owns customs holds,
  # ReeferTechnician owns reefer readings, TerminalAdmin is the operational superuser.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Berth
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: human label of the berth (e.g., "B-12"); unique across berths
        constraints: unique, non-empty
      - name: length_m
        type: integer
        source: input
        description: usable quay length in metres; a berth window's vessel LOA plus bow/stern clearance must fit within this
        constraints: ">= 50"
      - name: draft_m
        type: number
        source: input
        description: maximum permissible vessel draft (metres) at this berth
        constraints: "> 0"
      - name: status
        type: enum
        source: input
        description: operational availability of the berth
        default: AVAILABLE
        constraints: "one of {AVAILABLE, CLOSED}"

  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - name: imo_number
        type: string
        source: input
        description: 7-digit IMO identifier; unique across vessels
        constraints: unique, exactly 7 digits
      - name: name
        type: string
        source: input
        description: vessel name
        constraints: non-empty
      - name: loa_m
        type: integer
        source: input
        description: length overall in metres
        constraints: ">= 50"
      - name: draft_m
        type: number
        source: input
        description: laden draft in metres
        constraints: "> 0"
      - name: free_time_days
        type: integer
        source: input
        description: contracted demurrage free-time period (days) granted to containers discharged from this vessel before storage charges accrue
        default: 5
        constraints: ">= 0"

  - name: BerthWindow
    parent: null
    common_fields: true
    fields:
      - name: berth_id
        type: string
        source: input
        description: "FK -> Berth.id; the quay slot this window occupies"
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the vessel scheduled for this window"
      - name: eta
        type: datetime
        source: input
        description: scheduled start of berth occupation (estimated time of arrival), inclusive lower bound of the [eta, etd) half-open interval
      - name: etd
        type: datetime
        source: input
        description: scheduled end of berth occupation (estimated time of departure), exclusive upper bound of the [eta, etd) half-open interval
        constraints: "etd > eta"
      - name: actual_berth_at
        type: datetime
        source: system
        description: timestamp the vessel actually berthed (set on BERTH transition); null until berthed
      - name: actual_depart_at
        type: datetime
        source: system
        description: timestamp the vessel actually departed (set on DEPART transition); null until departed
      - name: status
        type: enum
        source: system
        description: berth-window lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, BERTHED, DEPARTED, CANCELLED}"

  - name: Container
    parent: null
    common_fields: true
    fields:
      - name: container_number
        type: string
        source: input
        description: ISO 6346 container number (4 letters + 7 digits); unique across containers
        constraints: unique, non-empty
      - name: vessel_id
        type: string
        source: input
        description: "FK -> Vessel.id; the discharge vessel this container arrived on"
      - name: berth_window_id
        type: string
        source: input
        description: "FK -> BerthWindow.id; the specific berth window the container was discharged under; demurrage free-time clock starts from this window's actual_berth_at"
      - name: is_reefer
        type: boolean
        source: input
        description: whether the container is a refrigerated (reefer) unit requiring temperature monitoring
        default: false
      - name: setpoint_c
        type: number
        source: input
        description: required reefer temperature setpoint in Celsius; required when is_reefer is true, must be null/omitted otherwise
        default: null
      - name: yard_slot_id
        type: string
        source: system
        description: "FK -> YardSlot.id; the yard slot the container currently occupies; null until grounded, cleared on gate-out"
      - name: customs_status
        type: enum
        source: system
        description: independent customs dimension of the container's parallel state
        default: PENDING
        constraints: "one of {PENDING, HELD, CLEARED}"
      - name: handling_status
        type: enum
        source: system
        description: independent physical-handling dimension of the container's parallel state
        default: ON_VESSEL
        constraints: "one of {ON_VESSEL, GROUNDED, GATED_OUT}"
      - name: free_time_expires_at
        type: datetime
        source: computed
        description: instant at which demurrage free time ends, computed as berth_window.actual_berth_at + vessel.free_time_days days; null until the discharge window is berthed
      - name: demurrage_due_cents
        type: integer
        source: computed
        description: accrued demurrage owed for storage beyond free time, in cents; recomputed on gate-out and on demurrage-quote reads
        default: 0

  - name: YardSlot
    parent: null
    common_fields: true
    fields:
      - name: block
        type: string
        source: input
        description: yard block label (e.g., "A")
        constraints: non-empty
      - name: bay
        type: integer
        source: input
        description: bay index within the block
        constraints: ">= 1"
      - name: row
        type: integer
        source: input
        description: row index within the bay
        constraints: ">= 1"
      - name: tier
        type: integer
        source: input
        description: stacking height index within the (block,bay,row) stack; tier 1 is ground level
        constraints: ">= 1"
      - name: is_reefer_rack
        type: boolean
        source: input
        description: whether the slot is wired for reefer power; reefer containers may only ground in reefer-rack slots
        default: false
      - name: below_slot_id
        type: string
        source: input
        description: "FK -> YardSlot.id; the slot at tier N-1 directly under this slot in the same (block,bay,row) stack; null for tier 1"
        default: null
      - name: occupied_by_container_id
        type: string
        source: system
        description: "FK -> Container.id; the container currently grounded in this slot; null when empty"
        default: null
      - name: status
        type: enum
        source: system
        description: occupancy state of the slot
        default: EMPTY
        constraints: "one of {EMPTY, OCCUPIED}"

  - name: GateAppointment
    parent: null
    common_fields: true
    fields:
      - name: container_id
        type: string
        source: input
        description: "FK -> Container.id; the container this appointment will pick up (gate-out)"
      - name: truck_plate
        type: string
        source: input
        description: license plate of the collecting truck
        constraints: non-empty
      - name: window_start
        type: datetime
        source: input
        description: inclusive lower bound of the [window_start, window_end) appointment slot at the gate
      - name: window_end
        type: datetime
        source: input
        description: exclusive upper bound of the appointment slot; must be exactly 60 minutes after window_start
        constraints: "window_end == window_start + 60 minutes"
      - name: status
        type: enum
        source: system
        description: gate-appointment lifecycle state
        default: BOOKED
        constraints: "one of {BOOKED, ARRIVED, FULFILLED, NO_SHOW, CANCELLED}"
      - name: no_show_count
        type: integer
        source: system
        description: number of times this appointment has been marked NO_SHOW and rescheduled
        default: 0

  - name: CustomsHold
    parent: null
    common_fields: true
    fields:
      - name: container_id
        type: string
        source: input
        description: "FK -> Container.id; the container placed on hold"
      - name: reason
        type: enum
        source: input
        description: regulatory basis for the hold
        constraints: "one of {INSPECTION, DOCUMENTATION, DUTY_UNPAID}"
      - name: placed_at
        type: datetime
        source: system
        description: timestamp the hold was placed (server clock)
      - name: released_at
        type: datetime
        source: system
        description: timestamp the hold was released; null while active
      - name: status
        type: enum
        source: system
        description: hold lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"

  - name: ReeferReading
    parent: null
    common_fields: false
    fields:
      - name: container_id
        type: string
        source: input
        description: "FK -> Container.id; the reefer container this reading belongs to"
      - name: recorded_at
        type: datetime
        source: input
        description: instant the temperature was sampled (probe clock)
      - name: temperature_c
        type: number
        source: input
        description: measured temperature in Celsius
      - name: is_excursion
        type: boolean
        source: computed
        description: true when abs(temperature_c - container.setpoint_c) > EXCURSION_BAND_C at record time
        default: false

  - name: EquipmentInterchangeReceipt
    parent: null
    common_fields: false
    fields:
      - name: container_id
        type: string
        source: input
        description: "FK -> Container.id; the container crossing the gate"
      - name: gate_appointment_id
        type: string
        source: input
        description: "FK -> GateAppointment.id; the appointment under which the gate-out occurred; null for gate-in (discharge) EIRs"
        default: null
      - name: direction
        type: enum
        source: input
        description: gate crossing direction
        constraints: "one of {GATE_IN, GATE_OUT}"
      - name: condition
        type: enum
        source: input
        description: recorded structural condition of the container at interchange
        constraints: "one of {SOUND, DAMAGED}"
      - name: damage_note
        type: string
        source: input
        description: free-text damage description; required when condition is DAMAGED, must be null/omitted otherwise
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: server timestamp of the interchange event

  - name: DemurrageInvoice
    parent: null
    common_fields: true
    fields:
      - name: container_id
        type: string
        source: input
        description: "FK -> Container.id; the gated-out container this invoice bills"
      - name: chargeable_days
        type: integer
        source: computed
        description: count of calendar days billed beyond free time, per the chronological day-bucket variant
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: finalized demurrage amount in cents at invoice time, frozen from Container.demurrage_due_cents at gate-out
        default: 0
      - name: status
        type: enum
        source: system
        description: invoice payment lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, PAID, WAIVED}"

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: current_utc
        type: datetime
        source: system
        description: the test-controllable system clock used for all server-stamped timestamps and time-window evaluations; defaults to a fixed epoch until set
        default: "2026-01-01T00:00:00.000Z"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: BerthWindow
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BERTHED
        trigger: "POST /berth-windows/{id}/berth"
        actor: BerthPlanner
        preconditions:
          - "BerthWindow.status == SCHEDULED"
          - "parent Berth.status == AVAILABLE (else ERR_BERTH_CLOSED)"
          - "no other BerthWindow on the same berth_id with status == BERTHED (a berth holds one vessel at a time; else ERR_BERTH_CONFLICT)"
        side_effects:
          - "set BerthWindow.actual_berth_at = Clock.current_utc"
          - "set BerthWindow.status = BERTHED"
          - "for every Container whose berth_window_id == this window: recompute Container.free_time_expires_at = actual_berth_at + Vessel.free_time_days days (cascade to all discharged containers)"
          - "increments BerthWindow.version by 1"
      - from: BERTHED
        to: SCHEDULED
        trigger: "POST /berth-windows/{id}/unberth"
        actor: BerthPlanner
        preconditions:
          - "BerthWindow.status == BERTHED"
          - "no Container whose berth_window_id == this window has handling_status == GROUNDED or GATED_OUT (cannot rewind a window whose cargo has already been worked)"
        side_effects:
          - "clear BerthWindow.actual_berth_at = null"
          - "set BerthWindow.status = SCHEDULED"
          - "for every Container whose berth_window_id == this window: clear Container.free_time_expires_at = null (compensation: reverse the free-time clock set by berth)"
          - "increments BerthWindow.version by 1"
        note: "Revert cycle BERTHED -> SCHEDULED; the compensating action restores free_time_expires_at to its pre-berth null."
      - from: BERTHED
        to: DEPARTED
        trigger: "POST /berth-windows/{id}/depart"
        actor: BerthPlanner
        preconditions:
          - "BerthWindow.status == BERTHED"
        side_effects:
          - "set BerthWindow.actual_depart_at = Clock.current_utc"
          - "set BerthWindow.status = DEPARTED"
          - "increments BerthWindow.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /berth-windows/{id}/cancel"
        actor: BerthPlanner
        preconditions:
          - "BerthWindow.status == SCHEDULED"
        side_effects:
          - "set BerthWindow.status = CANCELLED"
          - "increments BerthWindow.version by 1"

  - entity: Container
    initial_state: "handling_status=ON_VESSEL, customs_status=PENDING"
    terminal_states: ["handling_status=GATED_OUT"]
    transitions:
      - from: "handling_status=ON_VESSEL"
        to: "handling_status=GROUNDED"
        trigger: "POST /containers/{id}/ground"
        actor: YardPlanner
        preconditions:
          - "Container.handling_status == ON_VESSEL"
          - "the discharge BerthWindow.status == BERTHED (container can only be grounded after its vessel has berthed)"
          - "target YardSlot.status == EMPTY"
          - "if Container.is_reefer then target YardSlot.is_reefer_rack == true"
          - "target YardSlot.tier == 1 OR the slot referenced by target YardSlot.below_slot_id has status == OCCUPIED (no floating stack)"
        side_effects:
          - "set Container.yard_slot_id = target slot id"
          - "set Container.handling_status = GROUNDED"
          - "set YardSlot.occupied_by_container_id = Container.id and YardSlot.status = OCCUPIED"
          - "create one EquipmentInterchangeReceipt with direction=GATE_IN, condition per request, gate_appointment_id=null"
        note: "Parallel-dimension state: handling_status evolves independently of customs_status."
      - from: "handling_status=GROUNDED"
        to: "handling_status=GATED_OUT"
        trigger: "POST /gate-appointments/{id}/fulfill"
        actor: GateOperator
        preconditions:
          - "Container.handling_status == GROUNDED"
          - "Container.customs_status == CLEARED (a HELD or PENDING container cannot leave the terminal)"
          - "GateAppointment.status == ARRIVED"
          - "no YardSlot whose below_slot_id == Container.yard_slot_id has status == OCCUPIED (cannot retrieve a box with another box stacked on top)"
        side_effects:
          - "recompute Container.demurrage_due_cents via demurrage_charge calculation as of Clock.current_utc"
          - "set Container.handling_status = GATED_OUT"
          - "set the vacated YardSlot.occupied_by_container_id = null and YardSlot.status = EMPTY (cascade: frees the slot)"
          - "clear Container.yard_slot_id = null"
          - "set GateAppointment.status = FULFILLED"
          - "create one EquipmentInterchangeReceipt with direction=GATE_OUT, gate_appointment_id = this appointment"
          - "create one DemurrageInvoice with amount_cents = Container.demurrage_due_cents, chargeable_days from the calc, status=ISSUED"
        note: "Cross-entity guarded transition: gate-out is gated on customs_status==CLEARED, on appointment ARRIVED, and on no container stacked above."
      - from: "customs_status=PENDING"
        to: "customs_status=HELD"
        trigger: "POST /customs-holds"
        actor: CustomsOfficer
        preconditions:
          - "Container.customs_status == PENDING"
          - "Container.handling_status != GATED_OUT"
        side_effects:
          - "create CustomsHold with status=ACTIVE, placed_at = Clock.current_utc"
          - "set Container.customs_status = HELD"
        note: "Branch A of the customs dimension: PENDING -> HELD diverges from PENDING -> CLEARED."
      - from: "customs_status=HELD"
        to: "customs_status=CLEARED"
        trigger: "POST /customs-holds/{id}/release"
        actor: CustomsOfficer
        preconditions:
          - "CustomsHold.status == ACTIVE"
          - "Container.customs_status == HELD"
        side_effects:
          - "set CustomsHold.status = RELEASED, released_at = Clock.current_utc"
          - "set Container.customs_status = CLEARED"
      - from: "customs_status=PENDING"
        to: "customs_status=CLEARED"
        trigger: "POST /containers/{id}/customs-clear"
        actor: CustomsOfficer
        preconditions:
          - "Container.customs_status == PENDING"
          - "Container.handling_status != GATED_OUT"
        side_effects:
          - "set Container.customs_status = CLEARED"
        note: "Branch B of the customs dimension: direct clearance with no intervening hold."

  - entity: GateAppointment
    initial_state: BOOKED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: BOOKED
        to: ARRIVED
        trigger: "POST /gate-appointments/{id}/check-in"
        actor: GateOperator
        preconditions:
          - "GateAppointment.status == BOOKED"
          - "Clock.current_utc >= GateAppointment.window_start AND Clock.current_utc < GateAppointment.window_end (truck must arrive within the [window_start, window_end) slot)"
        side_effects:
          - "set GateAppointment.status = ARRIVED"
          - "increments GateAppointment.version by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /gate-appointments/{id}/mark-no-show"
        actor: GateOperator
        preconditions:
          - "GateAppointment.status == BOOKED"
          - "Clock.current_utc >= GateAppointment.window_end (the slot has fully elapsed with no check-in)"
        side_effects:
          - "set GateAppointment.status = NO_SHOW"
          - "increment GateAppointment.no_show_count by 1"
          - "increments GateAppointment.version by 1"
      - from: NO_SHOW
        to: BOOKED
        trigger: "POST /gate-appointments/{id}/reschedule"
        actor: GateOperator
        preconditions:
          - "GateAppointment.status == NO_SHOW"
          - "GateAppointment.no_show_count <= MAX_NO_SHOWS (a fourth no-show is barred from rescheduling)"
          - "new [window_start, window_end) does not overlap any other BOOKED/ARRIVED GateAppointment for the same container_id"
        side_effects:
          - "set GateAppointment.window_start and window_end to the new slot"
          - "set GateAppointment.status = BOOKED"
          - "increments GateAppointment.version by 1"
        note: "Cyclic loop NO_SHOW -> BOOKED bounded by no_show_count <= MAX_NO_SHOWS."
      - from: ARRIVED
        to: FULFILLED
        trigger: "POST /gate-appointments/{id}/fulfill"
        actor: GateOperator
        preconditions:
          - "GateAppointment.status == ARRIVED"
          - "(see Container handling_status=GROUNDED -> GATED_OUT for the full container-side precondition set)"
        side_effects:
          - "drives Container GROUNDED -> GATED_OUT (see that transition's side effects)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /gate-appointments/{id}/cancel"
        actor: GateOperator
        preconditions:
          - "GateAppointment.status == BOOKED"
        side_effects:
          - "set GateAppointment.status = CANCELLED"
          - "increments GateAppointment.version by 1"

  - entity: DemurrageInvoice
    initial_state: ISSUED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /demurrage-invoices/{id}/pay"
        actor: TerminalAdmin
        preconditions:
          - "DemurrageInvoice.status == ISSUED"
        side_effects:
          - "set DemurrageInvoice.status = PAID"
          - "increments DemurrageInvoice.version by 1"
      - from: ISSUED
        to: WAIVED
        trigger: "POST /demurrage-invoices/{id}/waive"
        actor: TerminalAdmin
        preconditions:
          - "DemurrageInvoice.status == ISSUED"
        side_effects:
          - "set DemurrageInvoice.status = WAIVED"
          - "increments DemurrageInvoice.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: berth-window-berth-stale
    parent_entity: BerthWindow
    write_endpoint: "POST /berth-windows/{id}/berth"
    occ_field: "expected_berth_window_version"
    description: |
      Berthing a BerthWindow whose version has advanced since the client last
      observed it is rejected. This captures the case where the window's free-time
      cascade (or a prior cancel/depart) has already mutated the window and the
      current writer's view is therefore stale; the berth action would otherwise
      re-run the free-time recompute against an already-berthed window.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: customs-release-stale-container-clear
    parent_entity: Container
    write_endpoint: "POST /containers/{id}/customs-clear"
    occ_field: "expected_container_version"
    description: |
      Directly clearing a Container whose version has advanced since the client
      last observed it is rejected. This captures the case where a CustomsOfficer
      has already moved the container off PENDING (e.g., placed a hold, which
      legitimately supersedes a direct-clear under the customs branch rules) and
      the current writer's PENDING-based view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: demurrage_charge
    trigger: "on gate-out (Container GROUNDED -> GATED_OUT) and on GET /containers/{id}/demurrage-quote"
    algorithm: tiered_pricing
    formula: |
      # Chronological day-bucket variant (the BILLED variant, frozen onto the invoice).
      # Demurrage accrues per whole calendar day that the container dwells beyond
      # free time, with the per-day rate stepping up across tiers.
      if Container.free_time_expires_at is null: return 0      # vessel not yet berthed
      as_of = Clock.current_utc
      if as_of <= Container.free_time_expires_at: return 0     # still inside free time
      # chargeable_days = number of whole 24h day-buckets started after free time,
      # counted chronologically from free_time_expires_at up to as_of.
      elapsed_seconds = as_of - free_time_expires_at
      chargeable_days = ceil(elapsed_seconds / 86400)          # any part of a day bills a full day
      total = 0
      for d in 1..chargeable_days:                             # process day buckets in chronological order
        if d <= TIER1_DAYS:        rate = TIER1_RATE_CENTS
        elif d <= TIER1_DAYS + TIER2_DAYS: rate = TIER2_RATE_CENTS
        else:                      rate = TIER3_RATE_CENTS
        total = total + rate                                   # running accumulator, day by day
      return total
    input_set: "the single Container being gated out / quoted; its free_time_expires_at and the current clock"
    constants:
      TIER1_DAYS: 3
      TIER2_DAYS: 4
      TIER1_RATE_CENTS: 5000
      TIER2_RATE_CENTS: 8000
      TIER3_RATE_CENTS: 12000
    precision: "integer cents, no fractional cents; day-bucket boundary is exclusive at free_time_expires_at (a container gated out exactly at free_time_expires_at owes 0)"
    variants:
      - name: chronological_billed
        when: "the authoritative variant frozen onto DemurrageInvoice.amount_cents at gate-out and returned by demurrage-quote"
        difference: "marginal per-day rate: each chargeable day bills at the tier its day-index falls in, summed chronologically day by day (day 4 bills TIER2 even though days 1-3 billed TIER1)"
      - name: flat_estimate
        when: "NOT used for billing; described only to contrast — a naive average-rate estimate"
        difference: "would multiply chargeable_days by a single blended rate; produces a DIFFERENT total than chronological_billed whenever chargeable_days straddles a tier boundary; the scaffold pins chronological_billed as authoritative"

  - name: berth_clash_check
    trigger: "on POST /berth-windows (create) and on POST /berth-windows/{id}/berth"
    algorithm: interval_merge
    formula: |
      # Half-open interval overlap on a shared berth resource.
      # Two windows on the SAME berth_id conflict when their scheduled
      # [eta, etd) intervals intersect under half-open semantics:
      #   conflict(A, B) := A.eta < B.etd AND B.eta < A.etd
      # Adjacency (A.etd == B.eta) is NOT a conflict (back-to-back berthing allowed).
      # Only windows with status IN {SCHEDULED, BERTHED} occupy the berth;
      # CANCELLED and DEPARTED windows are excluded from the occupation set.
      candidates = [w for w in BerthWindows
                    if w.berth_id == new.berth_id
                    and w.id != new.id
                    and w.status in {SCHEDULED, BERTHED}]
      for w in candidates ordered by w.eta ASC, tie-break w.created_at ASC:
        if new.eta < w.etd and w.eta < new.etd: return CONFLICT(w)
      return OK
    input_set: "SCHEDULED and BERTHED BerthWindows sharing the candidate's berth_id; excludes CANCELLED and DEPARTED"
    constants: {}
    precision: "datetime comparison at millisecond resolution; intervals are half-open [eta, etd)"
    variants: []

  - name: gate_slot_clash_check
    trigger: "on POST /gate-appointments (create) and on POST /gate-appointments/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      # Half-open interval overlap PLUS a turnaround buffer on the gate lane,
      # scoped per container (a container may hold only one live appointment slot
      # at a time, and consecutive slots must leave GATE_BUFFER_MIN minutes between).
      # Two appointments for the SAME container_id conflict when their slots,
      # EACH widened by GATE_BUFFER_MIN minutes on the trailing edge, intersect:
      #   a_end_buffered = A.window_end + GATE_BUFFER_MIN minutes
      #   conflict(A,B) := A.window_start < (B.window_end + GATE_BUFFER_MIN)
      #                    AND B.window_start < a_end_buffered
      # Unlike berth_clash_check, adjacency DOES conflict here because the buffer
      # makes back-to-back slots collide. Only BOOKED/ARRIVED appointments occupy.
      candidates = [g for g in GateAppointments
                    if g.container_id == new.container_id
                    and g.id != new.id
                    and g.status in {BOOKED, ARRIVED}]
      for g in candidates ordered by g.window_start ASC, tie-break g.created_at ASC:
        if new.window_start < (g.window_end + GATE_BUFFER_MIN minutes)
           and g.window_start < (new.window_end + GATE_BUFFER_MIN minutes):
          return CONFLICT(g)
      return OK
    input_set: "BOOKED and ARRIVED GateAppointments sharing the candidate's container_id; excludes FULFILLED/NO_SHOW/CANCELLED"
    constants:
      GATE_BUFFER_MIN: 30
    precision: "datetime comparison at millisecond resolution; intervals widened by GATE_BUFFER_MIN on the trailing edge before overlap test"
    variants: []

  - name: dwell_time_hours
    trigger: "on GET /containers/{id}/dwell"
    algorithm: aggregation
    formula: |
      # Wall-clock dwell from the gate-in EIR's recorded_at to the gate-out
      # EIR's recorded_at, or to Clock.current_utc if still in yard.
      gate_in = the EIR for this container with direction == GATE_IN (exactly one)
      if gate_in is null: return 0.0       # not yet grounded
      end_at = (the EIR for this container with direction == GATE_OUT).recorded_at
               if it exists, else Clock.current_utc
      dwell_hours = (end_at - gate_in.recorded_at) total seconds / 3600
      return round(dwell_hours, 2)         # round_half_up to 2 decimals
    input_set: "the two EIR rows (GATE_IN, optionally GATE_OUT) for this container_id"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: reefer_excursion_flag
    trigger: "on POST /containers/{id}/reefer-readings (per reading)"
    algorithm: threshold
    formula: |
      # Excursion when the absolute deviation from setpoint strictly exceeds the band.
      deviation = abs(temperature_c - Container.setpoint_c)
      is_excursion = deviation > EXCURSION_BAND_C      # strictly greater; deviation == band is NOT an excursion
      return is_excursion
    input_set: "the single ReeferReading and its Container.setpoint_c"
    constants:
      EXCURSION_BAND_C: 2.0
    precision: "Celsius compared at 0.1 resolution; boundary is strict (> not >=)"
    variants: []

  - name: reefer_excursion_summary
    trigger: "on GET /containers/{id}/reefer-summary"
    algorithm: aggregation
    formula: |
      # Count and worst-case across all readings for a reefer container.
      readings = all ReeferReadings for this container_id
      excursion_count = count of readings where is_excursion == true
      max_deviation_c = max over readings of abs(temperature_c - Container.setpoint_c),
                        or 0.0 if readings is empty
      return { excursion_count, max_deviation_c }
    input_set: "all ReeferReadings for this container_id (no status filter; readings are append-only)"
    constants: {}
    precision: "max_deviation_c to 1 decimal place, round_half_up; excursion_count is an integer"
    variants: []

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role is permitted to call this endpoint per the §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "every FK referenced in the request body exists (vessel_id, berth_id, container_id, yard_slot_id, berth_window_id, gate_appointment_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "create endpoints and transition endpoints with FK bodies"

  - priority: 5
    category: business_constraint
    check: "request body shape: required fields present, enum values valid, types correct (e.g. imo_number 7 digits, window_end == window_start + 60min, setpoint_c present iff is_reefer)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/transition endpoints with a body"

  - priority: 6
    category: business_constraint
    check: "uniqueness: container_number, imo_number, berth.code unique across their entity"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /containers, POST /vessels, POST /berths"

  - priority: 7
    category: state
    check: "the target resource is in a state from which this transition is allowed (per §1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "cross-entity state guard: gate-out requires Container.customs_status==CLEARED; ground requires discharge BerthWindow.status==BERTHED"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /gate-appointments/{id}/fulfill, POST /containers/{id}/ground"

  - priority: 9
    category: business_safety
    check: "stacking safety: a reefer container may only ground in an is_reefer_rack slot; no floating stack (tier>1 requires below slot OCCUPIED); cannot retrieve a box with another box stacked above"
    error_id: ERR_STACKING_VIOLATION
    http_status: 409
    applies_to: "POST /containers/{id}/ground, POST /gate-appointments/{id}/fulfill"

  - priority: 10
    category: business_constraint
    check: "yard slot occupancy: target YardSlot.status must be EMPTY to ground a container into it"
    error_id: ERR_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /containers/{id}/ground"

  - priority: 11
    category: business_safety
    check: "berth physical fit: at berth-window create the vessel must physically fit the berth — Vessel.draft_m must be <= Berth.draft_m; this draft-safety check precedes the temporal-clash check"
    error_id: ERR_BERTH_DRAFT_EXCEEDED
    http_status: 409
    applies_to: "POST /berth-windows"

  - priority: 12
    category: business_safety
    check: "berth physical fit: at berth-window create the Vessel.loa_m must be <= Berth.length_m (the vessel length must not exceed the usable quay length)"
    error_id: ERR_BERTH_LENGTH_EXCEEDED
    http_status: 409
    applies_to: "POST /berth-windows"

  - priority: 13
    category: business_temporal
    check: "berth interval clash: a new/berthing window's [eta,etd) must not overlap another SCHEDULED/BERTHED window on the same berth (half-open, adjacency allowed)"
    error_id: ERR_BERTH_CONFLICT
    http_status: 409
    applies_to: "POST /berth-windows, POST /berth-windows/{id}/berth"

  - priority: 14
    category: business_constraint
    check: "berth availability: at berth time the parent Berth.status must be AVAILABLE (a CLOSED berth cannot accept a vessel)"
    error_id: ERR_BERTH_CLOSED
    http_status: 409
    applies_to: "POST /berth-windows/{id}/berth"

  - priority: 15
    category: business_temporal
    check: "gate slot clash: a new/rescheduled appointment's buffered slot must not overlap another BOOKED/ARRIVED appointment for the same container (adjacency conflicts due to buffer)"
    error_id: ERR_GATE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /gate-appointments, POST /gate-appointments/{id}/reschedule"

  - priority: 16
    category: business_temporal
    check: "gate check-in window: Clock.current_utc must be within [window_start, window_end) to check in; window must be fully elapsed (>= window_end) to mark no-show"
    error_id: ERR_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /gate-appointments/{id}/check-in, POST /gate-appointments/{id}/mark-no-show"

  - priority: 17
    category: business_constraint
    check: "no-show cap: a NO_SHOW appointment with no_show_count > MAX_NO_SHOWS cannot be rescheduled"
    error_id: ERR_NO_SHOW_CAP
    http_status: 409
    applies_to: "POST /gate-appointments/{id}/reschedule"

  - priority: 18
    category: business_constraint
    check: "OCC: when expected_<parent>_version is supplied it must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /berth-windows/{id}/berth, POST /containers/{id}/customs-clear"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set"
    description: "set the test-controllable system clock"
    roles: [TerminalAdmin]
    code: 200
    input: [to_iso8601]
    output: Clock
    side_effects: ["set Clock.current_utc = to_iso8601"]

  - method: GET
    path: "/_clock"
    description: "read the current system clock"
    roles: [TerminalAdmin, BerthPlanner, YardPlanner, GateOperator, CustomsOfficer, ReeferTechnician]
    code: 200
    input: []
    output: Clock
    side_effects: []

  # ---- Berth ----
  - method: POST
    path: "/berths"
    description: "register a berth"
    roles: [TerminalAdmin]
    code: 201
    input: [code, length_m, draft_m, "status?"]
    output: Berth
    side_effects: []

  - method: GET
    path: "/berths/{id}"
    description: "fetch a berth"
    roles: [TerminalAdmin, BerthPlanner]
    code: 200
    input: []
    output: Berth
    side_effects: []

  - method: GET
    path: "/berths"
    description: "list berths"
    roles: [TerminalAdmin, BerthPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: Berth[]
    side_effects: []

  - method: GET
    path: "/berths/{id}/berth-windows"
    description: "list berth windows for a berth (reverse-reachability for BerthWindow.berth_id)"
    roles: [TerminalAdmin, BerthPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: BerthWindow[]
    side_effects: []

  # ---- Vessel ----
  - method: POST
    path: "/vessels"
    description: "register a vessel"
    roles: [TerminalAdmin]
    code: 201
    input: [imo_number, name, loa_m, draft_m, "free_time_days?"]
    output: Vessel
    side_effects: []

  - method: GET
    path: "/vessels/{id}"
    description: "fetch a vessel"
    roles: [TerminalAdmin, BerthPlanner, YardPlanner]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: GET
    path: "/vessels/{id}/containers"
    description: "list containers discharged from a vessel (reverse-reachability for Container.vessel_id)"
    roles: [TerminalAdmin, YardPlanner, GateOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: Container[]
    side_effects: []

  # ---- BerthWindow ----
  - method: POST
    path: "/berth-windows"
    description: "schedule a berth window (checks physical fit then runs berth_clash_check)"
    roles: [BerthPlanner]
    code: 201
    input: [berth_id, vessel_id, eta, etd]
    output: BerthWindow
    side_effects:
      - "checks Vessel.draft_m <= Berth.draft_m (ERR_BERTH_DRAFT_EXCEEDED) then Vessel.loa_m <= Berth.length_m (ERR_BERTH_LENGTH_EXCEEDED)"
      - "runs berth_clash_check; rejects on ERR_BERTH_CONFLICT"

  - method: GET
    path: "/berth-windows/{id}"
    description: "fetch a berth window"
    roles: [TerminalAdmin, BerthPlanner, YardPlanner]
    code: 200
    input: []
    output: BerthWindow
    side_effects: []

  - method: GET
    path: "/berth-windows"
    description: "list berth windows, optionally filtered by vessel (reverse-reachability for BerthWindow.vessel_id) or berth"
    roles: [TerminalAdmin, BerthPlanner, YardPlanner]
    code: 200
    input: ["vessel_id?", "berth_id?", "limit?", "offset?"]
    output: BerthWindow[]
    side_effects: []

  - method: POST
    path: "/berth-windows/{id}/berth"
    description: "berth the vessel (SCHEDULED -> BERTHED); cascades free-time clock to containers; OCC-guarded"
    roles: [BerthPlanner]
    code: 200
    input: [expected_berth_window_version]
    output: BerthWindow
    side_effects:
      - "runs berth_clash_check against BERTHED windows"
      - "set actual_berth_at; cascade Container.free_time_expires_at"
      - "increments BerthWindow.version by 1"

  - method: POST
    path: "/berth-windows/{id}/unberth"
    description: "rewind a berth window (BERTHED -> SCHEDULED); compensates free-time clock"
    roles: [BerthPlanner]
    code: 200
    input: []
    output: BerthWindow
    side_effects: ["clear actual_berth_at; clear Container.free_time_expires_at; increments version"]

  - method: POST
    path: "/berth-windows/{id}/depart"
    description: "depart the vessel (BERTHED -> DEPARTED)"
    roles: [BerthPlanner]
    code: 200
    input: []
    output: BerthWindow
    side_effects: ["set actual_depart_at; increments version"]

  - method: POST
    path: "/berth-windows/{id}/cancel"
    description: "cancel a scheduled window (SCHEDULED -> CANCELLED)"
    roles: [BerthPlanner]
    code: 200
    input: []
    output: BerthWindow
    side_effects: ["increments version"]

  # ---- Container ----
  - method: POST
    path: "/containers"
    description: "declare a discharged container (manifest entry)"
    roles: [YardPlanner, TerminalAdmin]
    code: 201
    input: [container_number, vessel_id, berth_window_id, "is_reefer?", "setpoint_c?"]
    output: Container
    side_effects: []

  - method: GET
    path: "/containers/{id}"
    description: "fetch a container (includes computed free_time_expires_at, demurrage_due_cents)"
    roles: [TerminalAdmin, YardPlanner, GateOperator, CustomsOfficer, ReeferTechnician]
    code: 200
    input: []
    output: Container
    side_effects: []

  - method: GET
    path: "/containers"
    description: "list containers, optionally filtered by discharge window (reverse-reachability for Container.berth_window_id), vessel (Container.vessel_id), or occupied yard slot (Container.yard_slot_id)"
    roles: [TerminalAdmin, YardPlanner, GateOperator, CustomsOfficer]
    code: 200
    input: ["berth_window_id?", "vessel_id?", "yard_slot_id?", "limit?", "offset?"]
    output: Container[]
    side_effects: []

  - method: POST
    path: "/containers/{id}/ground"
    description: "ground a container into a yard slot (ON_VESSEL -> GROUNDED); creates GATE_IN EIR"
    roles: [YardPlanner]
    code: 200
    input: [yard_slot_id, condition]
    output: Container
    side_effects:
      - "occupy YardSlot; set yard_slot_id"
      - "create EquipmentInterchangeReceipt direction=GATE_IN"

  - method: POST
    path: "/containers/{id}/customs-clear"
    description: "directly clear a PENDING container (customs PENDING -> CLEARED); OCC-guarded"
    roles: [CustomsOfficer]
    code: 200
    input: [expected_container_version]
    output: Container
    side_effects: ["set customs_status=CLEARED; increments Container.version by 1"]

  - method: GET
    path: "/containers/{id}/demurrage-quote"
    description: "compute current demurrage owed (chronological_billed variant) as of the clock"
    roles: [TerminalAdmin, GateOperator, YardPlanner]
    code: 200
    input: []
    output: "{ container_id: string, chargeable_days: integer, demurrage_due_cents: integer }"
    side_effects: ["recompute Container.demurrage_due_cents"]

  - method: GET
    path: "/containers/{id}/dwell"
    description: "compute dwell time in hours from gate-in EIR to gate-out EIR or now"
    roles: [TerminalAdmin, YardPlanner, GateOperator]
    code: 200
    input: []
    output: "{ container_id: string, dwell_hours: number }"
    side_effects: []

  - method: GET
    path: "/containers/{id}/eirs"
    description: "list EIRs for a container (reverse-reachability for EquipmentInterchangeReceipt.container_id)"
    roles: [TerminalAdmin, GateOperator, YardPlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentInterchangeReceipt[]
    side_effects: []

  - method: GET
    path: "/containers/{id}/customs-holds"
    description: "list customs holds for a container (reverse-reachability for CustomsHold.container_id)"
    roles: [TerminalAdmin, CustomsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CustomsHold[]
    side_effects: []

  - method: GET
    path: "/containers/{id}/reefer-readings"
    description: "list reefer readings for a container (reverse-reachability for ReeferReading.container_id)"
    roles: [TerminalAdmin, ReeferTechnician]
    code: 200
    input: ["limit?", "offset?"]
    output: ReeferReading[]
    side_effects: []

  - method: GET
    path: "/containers/{id}/reefer-summary"
    description: "excursion count + max deviation across all readings"
    roles: [TerminalAdmin, ReeferTechnician]
    code: 200
    input: []
    output: "{ container_id: string, excursion_count: integer, max_deviation_c: number }"
    side_effects: []

  - method: POST
    path: "/containers/{id}/reefer-readings"
    description: "record a reefer temperature reading (computes is_excursion)"
    roles: [ReeferTechnician]
    code: 201
    input: [recorded_at, temperature_c]
    output: ReeferReading
    side_effects: ["compute is_excursion via reefer_excursion_flag"]

  # ---- YardSlot ----
  - method: POST
    path: "/yard-slots"
    description: "register a yard slot"
    roles: [YardPlanner, TerminalAdmin]
    code: 201
    input: [block, bay, row, tier, "is_reefer_rack?", "below_slot_id?"]
    output: YardSlot
    side_effects: []

  - method: GET
    path: "/yard-slots/{id}"
    description: "fetch a yard slot"
    roles: [TerminalAdmin, YardPlanner]
    code: 200
    input: []
    output: YardSlot
    side_effects: []

  - method: GET
    path: "/yard-slots"
    description: "list yard slots, optionally filtered by the slot directly below (reverse-reachability for YardSlot.below_slot_id) or by occupying container (reverse-reachability for YardSlot.occupied_by_container_id)"
    roles: [TerminalAdmin, YardPlanner]
    code: 200
    input: ["below_slot_id?", "occupied_by_container_id?", "limit?", "offset?"]
    output: YardSlot[]
    side_effects: []

  # ---- GateAppointment ----
  - method: POST
    path: "/gate-appointments"
    description: "book a gate appointment (runs gate_slot_clash_check)"
    roles: [GateOperator]
    code: 201
    input: [container_id, truck_plate, window_start, window_end]
    output: GateAppointment
    side_effects: ["runs gate_slot_clash_check; rejects on ERR_GATE_SLOT_CONFLICT"]

  - method: GET
    path: "/gate-appointments/{id}"
    description: "fetch a gate appointment"
    roles: [TerminalAdmin, GateOperator]
    code: 200
    input: []
    output: GateAppointment
    side_effects: []

  - method: GET
    path: "/gate-appointments"
    description: "list gate appointments, optionally filtered by container (reverse-reachability for GateAppointment.container_id)"
    roles: [TerminalAdmin, GateOperator]
    code: 200
    input: ["container_id?", "limit?", "offset?"]
    output: GateAppointment[]
    side_effects: []

  - method: POST
    path: "/gate-appointments/{id}/check-in"
    description: "truck arrival within slot (BOOKED -> ARRIVED)"
    roles: [GateOperator]
    code: 200
    input: []
    output: GateAppointment
    side_effects: ["increments version"]

  - method: POST
    path: "/gate-appointments/{id}/mark-no-show"
    description: "mark a no-show after slot elapses (BOOKED -> NO_SHOW)"
    roles: [GateOperator]
    code: 200
    input: []
    output: GateAppointment
    side_effects: ["increment no_show_count; increments version"]

  - method: POST
    path: "/gate-appointments/{id}/reschedule"
    description: "reschedule a no-show to a new slot (NO_SHOW -> BOOKED); runs gate_slot_clash_check"
    roles: [GateOperator]
    code: 200
    input: [window_start, window_end]
    output: GateAppointment
    side_effects: ["set new slot; runs gate_slot_clash_check; increments version"]

  - method: POST
    path: "/gate-appointments/{id}/fulfill"
    description: "complete gate-out (drives Container GROUNDED -> GATED_OUT); creates GATE_OUT EIR + DemurrageInvoice"
    roles: [GateOperator]
    code: 200
    input: [condition]
    output: GateAppointment
    side_effects:
      - "recompute demurrage_due_cents; free yard slot; create GATE_OUT EIR; create DemurrageInvoice"
      - "set Container.handling_status=GATED_OUT"

  - method: POST
    path: "/gate-appointments/{id}/cancel"
    description: "cancel a booked appointment (BOOKED -> CANCELLED)"
    roles: [GateOperator]
    code: 200
    input: []
    output: GateAppointment
    side_effects: ["increments version"]

  # ---- CustomsHold ----
  - method: POST
    path: "/customs-holds"
    description: "place a customs hold (Container customs PENDING -> HELD)"
    roles: [CustomsOfficer]
    code: 201
    input: [container_id, reason]
    output: CustomsHold
    side_effects: ["set Container.customs_status=HELD; set placed_at"]

  - method: GET
    path: "/customs-holds/{id}"
    description: "fetch a customs hold"
    roles: [TerminalAdmin, CustomsOfficer]
    code: 200
    input: []
    output: CustomsHold
    side_effects: []

  - method: POST
    path: "/customs-holds/{id}/release"
    description: "release a customs hold (Container customs HELD -> CLEARED)"
    roles: [CustomsOfficer]
    code: 200
    input: []
    output: CustomsHold
    side_effects: ["set status=RELEASED, released_at; set Container.customs_status=CLEARED"]

  # ---- DemurrageInvoice ----
  - method: GET
    path: "/demurrage-invoices/{id}"
    description: "fetch a demurrage invoice"
    roles: [TerminalAdmin, GateOperator]
    code: 200
    input: []
    output: DemurrageInvoice
    side_effects: []

  - method: GET
    path: "/containers/{id}/demurrage-invoices"
    description: "list demurrage invoices for a container (reverse-reachability for DemurrageInvoice.container_id)"
    roles: [TerminalAdmin, GateOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: DemurrageInvoice[]
    side_effects: []

  - method: GET
    path: "/gate-appointments/{id}/eirs"
    description: "list EIRs tied to a gate appointment (reverse-reachability for EquipmentInterchangeReceipt.gate_appointment_id)"
    roles: [TerminalAdmin, GateOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentInterchangeReceipt[]
    side_effects: []

  - method: POST
    path: "/demurrage-invoices/{id}/pay"
    description: "mark an invoice paid (ISSUED -> PAID)"
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: DemurrageInvoice
    side_effects: ["increments version"]

  - method: POST
    path: "/demurrage-invoices/{id}/waive"
    description: "waive an invoice (ISSUED -> WAIVED)"
    roles: [TerminalAdmin]
    code: 200
    input: []
    output: DemurrageInvoice
    side_effects: ["increments version"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for this endpoint per RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path resource id does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "a foreign key in the request body references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "malformed body: missing required field, bad enum, type error, imo_number not 7 digits, window_end != window_start+60min, setpoint_c present/absent mismatch with is_reefer, damage_note present/absent mismatch with condition"
  - id: ERR_DUPLICATE
    http: 409
    condition: "container_number / imo_number / berth.code already exists"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which this transition is allowed"
  - id: ERR_CROSS_ENTITY_STATE
    http: 409
    condition: "gate-out attempted while container customs_status != CLEARED, or ground attempted while discharge berth window not BERTHED"
  - id: ERR_STACKING_VIOLATION
    http: 409
    condition: "reefer container into non-reefer slot, floating stack (tier>1 with empty below slot), or retrieval of a box with another box stacked above"
  - id: ERR_SLOT_OCCUPIED
    http: 409
    condition: "target yard slot is already OCCUPIED"
  - id: ERR_BERTH_DRAFT_EXCEEDED
    http: 409
    condition: "vessel draft_m exceeds the berth's draft_m at berth-window create"
  - id: ERR_BERTH_LENGTH_EXCEEDED
    http: 409
    condition: "vessel loa_m exceeds the berth's length_m at berth-window create"
  - id: ERR_BERTH_CLOSED
    http: 409
    condition: "berthing attempted while the parent Berth.status == CLOSED"
  - id: ERR_BERTH_CONFLICT
    http: 409
    condition: "berth window [eta,etd) overlaps another SCHEDULED/BERTHED window on the same berth"
  - id: ERR_GATE_SLOT_CONFLICT
    http: 409
    condition: "gate appointment buffered slot overlaps another BOOKED/ARRIVED appointment for the same container"
  - id: ERR_OUTSIDE_WINDOW
    http: 409
    condition: "check-in outside [window_start,window_end), or no-show before window_end"
  - id: ERR_NO_SHOW_CAP
    http: 409
    condition: "reschedule of an appointment whose no_show_count exceeds MAX_NO_SHOWS"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version (OCC mismatch)"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: TerminalAdmin
    description: "operational superuser: registers berths/vessels/slots, manages invoices, reads everything"
    identity: opaque
    exclusive_operations:
      - "POST /berths"
      - "POST /vessels"
      - "POST /demurrage-invoices/{id}/pay"
      - "POST /demurrage-invoices/{id}/waive"
      - "POST /_clock/set"
    shared_operations:
      - "POST /containers"
      - "POST /yard-slots"
      - "all GET reads"

  - name: BerthPlanner
    description: "owns berth windows: scheduling, berthing, departing, cancelling"
    identity: opaque
    exclusive_operations:
      - "POST /berth-windows"
      - "POST /berth-windows/{id}/berth"
      - "POST /berth-windows/{id}/unberth"
      - "POST /berth-windows/{id}/depart"
      - "POST /berth-windows/{id}/cancel"
    shared_operations:
      - "GET /berths, GET /berth-windows/{id}, GET /vessels/{id}"

  - name: YardPlanner
    description: "owns yard slots and grounding: declares containers, registers slots, grounds containers"
    identity: opaque
    exclusive_operations:
      - "POST /containers/{id}/ground"
    shared_operations:
      - "POST /containers"
      - "POST /yard-slots"
      - "GET reads of containers, yard-slots, vessels, dwell, demurrage-quote"

  - name: GateOperator
    description: "owns gate appointments and gate-out EIRs"
    identity: opaque
    exclusive_operations:
      - "POST /gate-appointments"
      - "POST /gate-appointments/{id}/check-in"
      - "POST /gate-appointments/{id}/mark-no-show"
      - "POST /gate-appointments/{id}/reschedule"
      - "POST /gate-appointments/{id}/fulfill"
      - "POST /gate-appointments/{id}/cancel"
    shared_operations:
      - "GET reads of gate-appointments, containers, eirs, dwell, demurrage-quote, demurrage-invoices"

  - name: CustomsOfficer
    description: "owns customs holds and clearances"
    identity: opaque
    exclusive_operations:
      - "POST /customs-holds"
      - "POST /customs-holds/{id}/release"
      - "POST /containers/{id}/customs-clear"
    shared_operations:
      - "GET reads of containers, customs-holds"

  - name: ReeferTechnician
    description: "owns reefer temperature readings and monitoring"
    identity: opaque
    exclusive_operations:
      - "POST /containers/{id}/reefer-readings"
    shared_operations:
      - "GET reads of containers, reefer-readings, reefer-summary"
