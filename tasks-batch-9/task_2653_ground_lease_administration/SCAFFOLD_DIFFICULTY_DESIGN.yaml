            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 40000, construction_window_start: "2027-07-01T00:00:00Z", construction_window_end: "2027-12-01T00:00:00Z", estimated_cost_cents: 400000 }
