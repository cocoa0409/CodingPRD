            - "$.data.error_id != 'ERR_GRIEVANCE_SUBJECT_INVALID' because SCORE_FALSIFICATION requires subject_match_id, the match belongs to ${lg_id} and it names ${tma_id}"
            - "$.data.error_id != 'ERR_NOT_TEAM_CAPTAIN' because the filer captains the other side of that very match"
            - "a follow-up GET /tennis/grievances with league_id=${lg_id} returns $.data.total_count == 0"
            - "replaying the identical filing with the clock at 2026-08-18T18:00:00Z instead returns HTTP 201 with $.data.status == 'FILED' and $.data.filed_by_captain_player_id == '${pb1_id}'"

      - name: activating_a_female_player_in_a_mens_doubles_league_returns_422_format_gender_mismatch
        claim_type: Violation → Error
        grounds:
          - validations.priority_37_ERR_FORMAT_GENDER_MISMATCH
          - errors[ERR_FORMAT_GENDER_MISMATCH]
        distinguishing_aspect: "The gender rule is enforced at activation and at scorecard time, not when the spot is created, so the add must be accepted and only the activation refused — an implementation that rejects the POST leaves the captain unable to stage a roster, and one that defers the check to the scorecard lets an inadmissible player sit ACTIVE and be counted toward min_active_roster_size. The rating and age of this player are both admissible, so gender is the only thing separating pass from fail."
        test_recipe:
          setup:
            - "A MENS_DOUBLES district league is open for registration and a DRAFT team holds a PENDING spot for a female player who is COMPUTER_RATED at exactly the league's 3.5 band and well over the age minimum."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_fac
            - *a_lgp
            - *a_lgp_open
            - *a_lg
            - *a_lg_open
