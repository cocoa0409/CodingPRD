            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/post"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T09:00:00Z" }
              as: PlantOperator
              captures: { l_id: $.data.id }
            - call: "POST /wash-loads/${l_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/finish-cycle"
