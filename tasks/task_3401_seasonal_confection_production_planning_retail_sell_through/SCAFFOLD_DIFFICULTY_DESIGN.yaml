            - *k_clock_0306
          trigger:
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 850, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run_id}.status == COMPLETE and produced_units == 850"
            - "GET /confection/inventory-lots?production_run_id=${run_id} returns exactly 1 lot: units_on_hand == 850, status AVAILABLE, product_id == ${prod_id}, warehouse_id == ${wh_id}"
            - "Warehouse.${wh_id}.in_use_units == 850 (link 2: the lot's units enter the load aggregate)"
            - "Warehouse.${wh_id}.posture == CONGESTED (link 3: 850 >= floor(0.85 x 1000) flips OPEN -> CONGESTED; before the complete it was OPEN at 0)"
            - "SeasonalProgram.${prog_id}.produced_units_total == 850"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
