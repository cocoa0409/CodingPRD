          rationale: "The named §1.8 instance executes two otherwise identical deals against different project statuses and registry-account states, and asserts the resulting template sizes and the vacuous 100.00 on the empty one."

      - name: lifecycle_deadline_constants_applied_at_each_transition
        claim_type: constants_applied
