            - "One 900 g airframe (max_altitude_ft 1200) whose RemoteIdModule is VERIFIED until 2027-10-01T00:00:00Z, then REGISTERED."
            - "An ACTIVE indemnified policy of 2000000 cents effective 2026-10-01 .. 2027-10-01."
            - "One class C zone (class_ceiling_ft 700, requires_authorization true) with an APPROVED authorization for 2026-10-05T08:00:00Z .. 12:00:00Z, granted_ceiling_ft 400."
