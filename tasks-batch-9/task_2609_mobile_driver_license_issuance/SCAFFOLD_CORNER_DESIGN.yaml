          rationale: "The four-point walk through (ACTIVE,UPDATE_PENDING) -> (ACTIVE,IN_SYNC) -> (SUSPENDED,IN_SYNC) -> (SUSPENDED,UPDATE_PENDING) in the named §1.8 instance already pins both axes moving without the other following."

