      - A PENDING endorsement is outside the substitution set, so eff_qty for the WS-210 row stays r.qty_per_car
        4 and the line stays ceil((4 * 18000 + 25000) / 100) * 100 == 97000
      - 'After approval the endorsement reads ${end_status_approved} == "APPROVED" and the same row re-prices
        to the substitute: ceil((3 * 20000 + 25000) / 100) * 100 == 85000'
      - The approved quote is ${price_approved} == 1617500 == (85000 + 105000 + 62500) + 1350000 + min(15000,
        floor(1602500 * 8 / 100)) == 1602500 + 15000, so the delta 3000 cents is caused solely by the
        status change
      - 'The substitution replaces the original row''s quantity and cost rather than adding a row: the
        subtotal moves from 264500 to 252500, never to 264500 + 85000'
      - 'Rejected and superseded endorsements are equally excluded: the filter is status IN {APPROVED,
        APPLIED}, and PENDING fails it exactly as REJECTED would'
