        distinguishing_aspect: "Conserved quantity = the pro's total OPEN slot-minutes. Booking flips the slot OPEN->BOOKED; cancelling the booking flips it back BOOKED->OPEN with booking_id cleared, restoring the slot to OPEN (different conserved quantity: slot-minutes, not cents)."
