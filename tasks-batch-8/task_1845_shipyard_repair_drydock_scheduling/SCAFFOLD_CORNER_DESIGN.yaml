        distinguishing_aspect: "Above the 5000000-cent threshold the approval is two-phase: commercial approve alone leaves the order UNDER_REVIEW (commercial_approved_by recorded, no cascade); only the vessel owner's countersign fires APPROVED and moves the contracted price by exactly 5107000."
        test_recipe:
