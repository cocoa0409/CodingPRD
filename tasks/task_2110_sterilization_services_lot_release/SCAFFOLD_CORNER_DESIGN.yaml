              captures: { lot_p1_id: $.data.id }
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p2_id}", lot_code: "L-P2", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_p2_id: $.data.id }
