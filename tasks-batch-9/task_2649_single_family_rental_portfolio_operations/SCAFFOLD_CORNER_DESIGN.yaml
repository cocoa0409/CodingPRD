          rationale: >
            The dual_variant layer needs both variants on the same row plus the delta, which the
            difficulty instance already pins down at 559 versus 531 bps on one case after three
            completed work orders and an executed lease. A second variant test would reuse the same
            arithmetic with no new failure mode.

