      - name: below_threshold_single_audit_resolves_directly_from_open
        claim_type: guarded transitions
        grounds:
          - state_machines.SingleAudit.OPEN_to_RESOLVED
          - calculations.single_audit_threshold
          - entities.SingleAudit.fields.audit_required
        distinguishing_aspect: |
          Guarded branch: a SingleAudit with federal_expenditures_cents 10000000 (< 75000000) has
          audit_required == false and resolves directly OPEN -> RESOLVED with no submit step. The guard
          audit_required == false selects this branch over the OPEN -> SUBMITTED path.
