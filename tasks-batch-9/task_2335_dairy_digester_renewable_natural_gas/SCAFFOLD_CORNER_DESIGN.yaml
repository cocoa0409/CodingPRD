      - name: calc_reserve_sweep_is_capped_by_the_unfunded_reserve_not_by_the_sweep_rate
        claim_type: waterfall_allocation
        grounds:
          - calculations.net_distributable_waterfall
          - calculations.dscr_and_distribution_posture
          - entities.RevenueStatement.fields.reserve_sweep_cents
          - entities.RevenueStatement.fields.net_distributable_cents
          - endpoints[POST /facilities/{id}/reserve-funding]
        distinguishing_aspect: >
          The step-6 sweep would be 467500 at the 25 % rate, but only 200000 of the
          4000000 reserve target is still unfunded, so the min() clamps the sweep to
          200000 and net_distributable_cents lands on 1670000 - while the fee tier stays
          keyed on the step-2 gross of 2000000 (rate 0.0650, fee 130000) and dscr 1.247
          leaves the facility RESTRICTED rather than OPEN.
        test_recipe:
          setup:
            - "Canonical plant with 3800000 cents already funded into the debt-service reserve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /facilities"
              payload: { name: "Tulare Digester 1", digester_volume_m3: 6000.000, hydraulic_capacity_tonnes_per_day: 500.000, thermal_regime: "MESOPHILIC", target_temperature_c: 38.0, reserve_target_cents: 4000000, annual_debt_service_cents: 18000000, dscr_minimum: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { facility_id: "$.data.id" }
            - call: "POST /facilities/${facility_id}/reserve-funding"
              payload: { amount_cents: 3800000, memo: "Sponsor equity contribution" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { facility_v: "$.data.version" }
          trigger:
            - call: "POST /revenue-statements"
              payload: { facility_id: "${facility_id}", period_start_date: "2026-09-01", period_end_date: "2026-09-30", gas_revenue_cents: 2000000, expected_facility_version: "${facility_v}" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { stmt_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "RevenueStatement.${stmt_id}.credit_revenue_cents == 0"
            - "RevenueStatement.${stmt_id}.gross_revenue_cents == 2000000"
            - "RevenueStatement.${stmt_id}.management_fee_rate == 0.0650"
            - "RevenueStatement.${stmt_id}.management_fee_cents == 130000"
            - "RevenueStatement.${stmt_id}.after_fee_cents == 1870000"
            - "RevenueStatement.${stmt_id}.reserve_sweep_cents == 200000"
            - "RevenueStatement.${stmt_id}.net_distributable_cents == 1670000"
            - "RevenueStatement.${stmt_id}.dscr_at_close == 1.247"
            - "RevenueStatement.${stmt_id}.total_dairy_share_cents == 0"
            - "DigesterFacility.${facility_id}.dscr_current == 1.247"
            - "DigesterFacility.${facility_id}.distribution_posture == RESTRICTED"

