  - section: validations
    instances:
      - name: closed_to_arrival_blocks_an_arrival_but_not_a_stay_that_merely_spans_the_date
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_CLOSED_TO_ARRIVAL]
          - calculations.restriction_effect_resolution
        distinguishing_aspect: |
          CLOSED_TO_ARRIVAL reads exactly one date of the stay - arrival_date - while STOP_SELL reads
          every night. The same one-day window therefore refuses a 2026-09-11 arrival and accepts a
          2026-09-10 arrival whose middle night is 2026-09-11, and the accepted stay's committed_units
          land on the closed date all the same.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING capacity 10 with inventory days 2026-09-10, 2026-09-11 and 2026-09-12."
            - "Channel BRAND (commission_bp 0) with a HEALTHY connection, plan BAR (25000) ACTIVE."
            - "One ACTIVE CLOSED_TO_ARRIVAL restriction over 2026-09-11..2026-09-11 with value_nights omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
