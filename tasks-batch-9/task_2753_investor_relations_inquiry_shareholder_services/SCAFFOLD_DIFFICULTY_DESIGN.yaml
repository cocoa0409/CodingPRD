# §1.8 Scaffold Difficulty Design (Test Targeting Index) for task 2753
# Investor Relations Inquiry & Shareholder Services.
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this
# file would leave the scaffold's declared behaviour identical. All nine §0.5 rule_ids appear,
# each with 2 instances (18 total). Every numeric assert literal below was computed by executing
# the referenced §1.3 formula with its declared constants.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dividend_declared_rate_versus_reserve_capped_payout
        grounds:
          - calculations.dividend_payout_ledger
          - calculations.record_date_snapshot
          - entities.TransferAgentInstruction.fields.funding_mode
          - state_machines.TransferAgentInstruction.ACKNOWLEDGED_to_EXECUTED
          - endpoints[POST /transfer-agent-instructions/{id}/execute]
        distinguishing_aspect: |
          Two issuers with byte-identical holder registers (333 / 667 / 1000 shares) and the same
          declared_rate_cents_per_share of 0.4567 pay out 914 cents under funding_mode DECLARED_RATE
          and 500 cents under funding_mode RESERVE_CAPPED, because the capped variant replaces the
          declared rate with floor(reserve / snapshot_shares_total, 4dp) = 0.2500; this instance's
          entity domain is issuer cash on TransferAgentInstruction / Company, not analyst estimates.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer DVA with 1,000,000 shares outstanding and a 100,000-cent dividend reserve; issuer DVB with 1,000,000 shares outstanding and a 500-cent dividend reserve."
            - "Each issuer has the same three holders: two INSTITUTIONAL_HOLDER positions of 333 and 667 shares and one RETAIL_HOLDER position of 1000 shares."
            - "Each issuer has one DIVIDEND_PAYMENT instruction, record_date 2026-08-15, payable_date 2026-08-25, declared_rate_cents_per_share 0.4567 — DVA's in funding_mode DECLARED_RATE, DVB's in funding_mode RESERVE_CAPPED — both acknowledged (snapshot 3 holders / 2000 shares) with the clock at 2026-08-25T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "DVA", legal_name: "Dividend Alpha Corp", shares_outstanding: 1000000, dividend_reserve_cents: 100000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_a_id: "$.data.id" }
            - call: "POST /companies"
              payload: { ticker: "DVB", legal_name: "Dividend Beta Corp", shares_outstanding: 1000000, dividend_reserve_cents: 500 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_b_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_a_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Alpha Holder One", email: "a1@holders.test", shares_held: 333 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_a_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Alpha Holder Two", email: "a2@holders.test", shares_held: 667 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { a2_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_a_id}", contact_type: "RETAIL_HOLDER", display_name: "Alpha Holder Three", email: "a3@holders.test", shares_held: 1000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { a3_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_b_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Beta Holder One", email: "b1@holders.test", shares_held: 333 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_b_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Beta Holder Two", email: "b2@holders.test", shares_held: 667 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { b2_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_b_id}", contact_type: "RETAIL_HOLDER", display_name: "Beta Holder Three", email: "b3@holders.test", shares_held: 1000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { b3_id: "$.data.id" }
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_a_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-15", payable_date: "2026-08-25", declared_rate_cents_per_share: 0.4567, funding_mode: "DECLARED_RATE", notes: "Q3 regular dividend" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ins_a_id: "$.data.id" }
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_b_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-15", payable_date: "2026-08-25", declared_rate_cents_per_share: 0.4567, funding_mode: "RESERVE_CAPPED", notes: "Q3 regular dividend" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ins_b_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /transfer-agent-instructions/${ins_a_id}/acknowledge"
              payload: { decision: "ACKNOWLEDGE" }
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
            - call: "POST /transfer-agent-instructions/${ins_b_id}/acknowledge"
              payload: { decision: "ACKNOWLEDGE" }
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          trigger:
            - call: "POST /transfer-agent-instructions/${ins_a_id}/execute"
              payload: {}
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
            - call: "POST /transfer-agent-instructions/${ins_b_id}/execute"
              payload: {}
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          assert:
            - "TransferAgentInstruction.${ins_a_id}.snapshot_holder_count == 3 and TransferAgentInstruction.${ins_a_id}.snapshot_shares_total == 2000"
            - "TransferAgentInstruction.${ins_a_id}.total_payout_cents == 914"
            - "TransferAgentInstruction.${ins_a_id}.payout_ledger amounts, in created_at order, are [152, 305, 457]"
            - "TransferAgentInstruction.${ins_b_id}.total_payout_cents == 500"
            - "TransferAgentInstruction.${ins_b_id}.payout_ledger amounts, in created_at order, are [83, 167, 250]"
            - "Company.${co_a_id}.dividend_reserve_cents == 99086 and Company.${co_a_id}.dividend_paid_cents == 914"
            - "Company.${co_b_id}.dividend_reserve_cents == 0 and Company.${co_b_id}.dividend_paid_cents == 500"
            - "Contact.${a3_id}.dividend_received_cents == 457 while Contact.${b3_id}.dividend_received_cents == 250 for the identical 1000-share position"

      - name: consensus_simple_mean_versus_guidance_anchored_trimmed_mean
        grounds:
          - calculations.consensus_estimate
          - entities.EstimateSubmission.fields.value
          - entities.Disclosure.fields.guidance_low
          - endpoints[GET /companies/{id}/consensus]
        distinguishing_aspect: |
          For the identical four accepted EPS estimates (2.00 / 2.05 / 2.10 / 3.90) the SIMPLE variant
          reports consensus_mean 2.5125 while the default guidance-anchored variant reports 2.0500,
          because the +/-15% band around published guidance 2.00-2.20 is [1.7000, 2.5300] and drops the
          3.90 submission; this instance's entity domain is sell-side estimates on
          EstimateSubmission / Contact, not issuer dividend cash.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer CNS with 1,000,000 shares outstanding."
            - "Four SELL_SIDE_ANALYST contacts, each nda_on_file true, coverage_status INITIATED and granted model access."
            - "A published GUIDANCE_UPDATE disclosure for metric EPS, period FY2026, guidance_low 2.00, guidance_high 2.20."
            - "Each analyst has one ACCEPTED EstimateSubmission for EPS / FY2026 with values 2.00, 2.05, 2.10 and 3.90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "CNS", legal_name: "Consensus Systems Inc", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "SELL_SIDE_ANALYST", display_name: "Analyst One", email: "an1@banks.test", nda_on_file: true, coverage_status: "INITIATED" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "SELL_SIDE_ANALYST", display_name: "Analyst Two", email: "an2@banks.test", nda_on_file: true, coverage_status: "INITIATED" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an2_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "SELL_SIDE_ANALYST", display_name: "Analyst Three", email: "an3@banks.test", nda_on_file: true, coverage_status: "INITIATED" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an3_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "SELL_SIDE_ANALYST", display_name: "Analyst Four", email: "an4@banks.test", nda_on_file: true, coverage_status: "INITIATED" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an4_id: "$.data.id" }
            - call: "POST /contacts/${an1_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an1_v: "$.data.version" }
            - call: "POST /contacts/${an2_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an2_v: "$.data.version" }
            - call: "POST /contacts/${an3_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an3_v: "$.data.version" }
            - call: "POST /contacts/${an4_id}/servicing"
              payload: { action: "GRANT_MODEL_ACCESS" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { an4_v: "$.data.version" }
            - call: "POST /disclosures"
              payload: { company_id: "${co_id}", disclosure_type: "GUIDANCE_UPDATE", fact_key: "FY2026-EPS-GUIDANCE", metric: "EPS", period_label: "FY2026", guidance_low: 2.00, guidance_high: 2.20, is_guidance: true }
              as: DisclosureOfficer
              as_user_id: "u_do_1"
              captures: { guid_id: "$.data.id" }
            - call: "POST /disclosures/${guid_id}/publish"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "u_do_1"
            - call: "POST /estimates"
              payload: { contact_id: "${an1_id}", metric: "EPS", period_label: "FY2026", value: 2.00, expected_contact_version: "${an1_v}" }
              as: Investor
              as_user_id: "${an1_id}"
            - call: "POST /estimates"
              payload: { contact_id: "${an2_id}", metric: "EPS", period_label: "FY2026", value: 2.05, expected_contact_version: "${an2_v}" }
              as: Investor
              as_user_id: "${an2_id}"
            - call: "POST /estimates"
              payload: { contact_id: "${an3_id}", metric: "EPS", period_label: "FY2026", value: 2.10, expected_contact_version: "${an3_v}" }
              as: Investor
              as_user_id: "${an3_id}"
            - call: "POST /estimates"
              payload: { contact_id: "${an4_id}", metric: "EPS", period_label: "FY2026", value: 3.90, expected_contact_version: "${an4_v}" }
              as: Investor
              as_user_id: "${an4_id}"
          trigger:
            - call: "GET /companies/${co_id}/consensus"
              payload: { metric: "EPS", period_label: "FY2026" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
            - call: "GET /companies/${co_id}/consensus"
              payload: { metric: "EPS", period_label: "FY2026", variant: "SIMPLE" }
              as: IRAnalyst
              as_user_id: "u_ira_1"
          assert:
            - "trigger step 1 (default ANCHORED variant): $.data.consensus_mean == 2.0500, $.data.simple_mean == 2.5125, $.data.trimmed_applied == true"
            - "trigger step 1: $.data.band_low == 1.7000, $.data.band_high == 2.5300, $.data.guidance_anchored == true"
            - "trigger step 1: $.data.eligible_count == 4 and $.data.outlier_excluded_count == 1"
            - "trigger step 1: $.data.dispersion_pct == 4.88"
            - "trigger step 2 (SIMPLE variant): $.data.consensus_mean == 2.5125 and $.data.dispersion_pct == 3.98, with the same eligible_count 4 and outlier_excluded_count 1"
            - "the two responses' consensus_mean values differ by exactly 0.4625 for identical stored data"

  - rule_id: combinatorial_formula
    instances:
      - name: meeting_priority_nonlinear_tier_type_and_penalty_interaction
        grounds:
          - calculations.meeting_priority_score
          - entities.Contact.fields.target_tier
          - entities.Contact.fields.threat_level
          - endpoints[POST /meeting-requests]
        distinguishing_aspect: |
          Mode (a): provisional_priority_score combines five inputs with non-linear interaction — a
          capped term min(20, round_half_up(ownership_pct*4, 2)), a conditional activist penalty gated
          on TWO fields (activist_flag AND threat_level IN {ELEVATED, CRITICAL}), a contact_type
          multiplier and a max(0, ...) floor — so two TIER_1 institutional holders with the identical
          12.0000% position score 93.60 and 75.60 while a retail holder scores 3.12.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer PRI with 1,000,000 shares outstanding and an OPEN_FOR_REQUESTS conference, window 2026-09-01T13:00:00Z to 2026-09-01T18:00:00Z, slot_minutes 30, capacity_slots 5."
            - "Contact H1: INSTITUTIONAL_HOLDER, 120,000 shares (12.0000% -> TIER_1), nda_on_file true, activist_flag false."
            - "Contact H2: INSTITUTIONAL_HOLDER, 120,000 shares, nda_on_file true, activist_flag true, threat_level ELEVATED."
            - "Contact H3: RETAIL_HOLDER, 500 shares (0.0500% -> TIER_3), nda_on_file false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "PRI", legal_name: "Priority Industries Inc", shares_outstanding: 1000000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Holder One", email: "h1@funds.test", shares_held: 120000, nda_on_file: true }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { h1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Holder Two", email: "h2@funds.test", shares_held: 120000, nda_on_file: true, activist_flag: true }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { h2_id: "$.data.id" }
            - call: "POST /contacts/${h2_id}/servicing"
              payload: { action: "SET_THREAT_LEVEL", threat_level: "ELEVATED" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "Holder Three", email: "h3@retail.test", shares_held: 500 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { h3_id: "$.data.id" }
            - call: "POST /roadshow-events"
              payload: { company_id: "${co_id}", event_type: "CONFERENCE", venue_city: "Boston", window_start: "2026-09-01T13:00:00Z", window_end: "2026-09-01T18:00:00Z", slot_minutes: 30, capacity_slots: 5 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ev_id: "$.data.id" }
            - call: "POST /roadshow-events/${ev_id}/open-requests"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
          trigger:
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${h1_id}", requested_slot_start: "2026-09-01T13:00:00Z", requested_slot_end: "2026-09-01T13:30:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { mr1_id: "$.data.id" }
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${h2_id}", requested_slot_start: "2026-09-01T14:00:00Z", requested_slot_end: "2026-09-01T14:30:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { mr2_id: "$.data.id" }
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${h3_id}", requested_slot_start: "2026-09-01T15:00:00Z", requested_slot_end: "2026-09-01T15:30:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { mr3_id: "$.data.id" }
          assert:
            - "MeetingRequest.${mr1_id}.provisional_priority_score == 93.60"
            - "MeetingRequest.${mr2_id}.provisional_priority_score == 75.60"
            - "MeetingRequest.${mr3_id}.provisional_priority_score == 3.12"
            - "MeetingRequest.${mr1_id}.final_priority_score == null for all three requests before any allocation run"
            - "Contact.${h1_id}.ownership_pct == 12.0000 and Contact.${h1_id}.target_tier == TIER_1"
            - "Contact.${h3_id}.ownership_pct == 0.0500 and Contact.${h3_id}.target_tier == TIER_3"

      - name: dividend_per_holder_rounding_before_summation
        grounds:
          - calculations.dividend_payout_ledger
          - entities.TransferAgentInstruction.fields.payout_ledger
          - entities.TransferAgentInstruction.fields.total_payout_cents
          - state_machines.TransferAgentInstruction.ACKNOWLEDGED_to_EXECUTED
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-holder-then-sum, so 333 / 667 / 1000 shares at
          0.4567 cents per share pay 152 + 305 + 457 = 914 cents, which is one cent MORE than the
          913 cents produced by the rejected sum-then-round order (2000 * 0.4567 = 913.4 -> 913).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, moved to 2026-08-25T00:00:00Z before execution."
            - "Issuer RND with 1,000,000 shares outstanding and a 100,000-cent reserve."
            - "Three holders with 333, 667 and 1000 shares created in that order."
            - "One acknowledged DECLARED_RATE dividend instruction at 0.4567 cents per share, record_date 2026-08-15, payable_date 2026-08-25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "RND", legal_name: "Rounding Order Corp", shares_outstanding: 1000000, dividend_reserve_cents: 100000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Round Holder One", email: "r1@funds.test", shares_held: 333 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { r1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Round Holder Two", email: "r2@funds.test", shares_held: 667 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { r2_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "Round Holder Three", email: "r3@retail.test", shares_held: 1000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { r3_id: "$.data.id" }
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-15", payable_date: "2026-08-25", declared_rate_cents_per_share: 0.4567, funding_mode: "DECLARED_RATE" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ins_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /transfer-agent-instructions/${ins_id}/acknowledge"
              payload: { decision: "ACKNOWLEDGE" }
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          trigger:
            - call: "POST /transfer-agent-instructions/${ins_id}/execute"
              payload: {}
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          assert:
            - "TransferAgentInstruction.${ins_id}.total_payout_cents == 914"
            - "TransferAgentInstruction.${ins_id}.total_payout_cents != 913"
            - "Contact.${r1_id}.dividend_received_cents == 152"
            - "Contact.${r2_id}.dividend_received_cents == 305"
            - "Contact.${r3_id}.dividend_received_cents == 457"
            - "Company.${co_id}.dividend_paid_cents == 914 and Company.${co_id}.dividend_reserve_cents == 99086"

  - rule_id: non_linear_state_machine
    instances:
      - name: response_draft_revision_cycle_returns_to_draft
        grounds:
          - state_machines.ResponseDraft.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ResponseDraft.CHANGES_REQUESTED_to_DRAFT
          - state_machines.InquiryTicket.AWAITING_APPROVAL_to_DRAFTING
          - entities.ResponseDraft.fields.revision_round
        distinguishing_aspect: |
