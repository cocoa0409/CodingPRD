    instances:
      - name: cure_exact_amount_boundary
        grounds:
          - validations[priority=34]
          - state_machines.Notice.PENDING_to_CURED
        distinguishing_aspect: |
          Metric: money cents on POST /api/notices/{id}/record-cure. 149999 (< claimed
          150000) is rejected; exactly 150000 cures. The sibling uses a day-count metric on
          a different endpoint (hearing scheduling).
        test_recipe:
          setup:
            - "One CA case NOTICE_ACTIVE with PAY_OR_QUIT notice claiming 150000, served 2026-05-02 (cure deadline 2026-05-05T23:59:59Z); clock 2026-05-03 (inside window)"
          setup_api_calls:
            - { call: "POST /api/landlords", payload: { legal_name: "L1 LLC", contact_email: "l1@x.com" }, as: PlatformAdmin, captures: { ll: $.data.id } }
