# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Medicaid MCO Encounter Reporting — 9 rules x 2 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: capitation_provisional_vs_final_divergence
        grounds: [calculations.capitation_amount, entities.CapitationStatement.fields.provisional_paid_cents, entities.CapitationStatement.fields.final_amount_cents]
        distinguishing_aspect: |
          Same member-months priced twice: the provisional variant pins every risk score at 1.0 (270000 cents)
          while the final variant applies normalized HCC risk scores (340000 cents) — a 70000-cent divergence
          on identical enrollment, on the fiscal entity domain (CapitationStatement).
        test_recipe:
          setup:
            - "Program with TANF@50000 and SSI@120000 rate schedules covering 2026-08; August cycle; members m1,m2,m3 TANF and m4 SSI enrolled from 2026-08-01"
            - "Provider active; encounters: e1(m1, [E11]), e2(m2, [I50]), e3(m4, [E11,I50]) all ACKNOWLEDGED; m3 has no encounter (raw 0)"
            - "Raw scores 0.8/1.2/0.0/2.0, program average 1.0, so normalized scores equal raw; risk snapshots computed"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CAP", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "SSI", pmpm_cents: 120000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m2: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M3", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m3: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M4", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m4: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["E11"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m2}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["I50"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m4}", provider_id: "${prov_id}", encounter_ref: "E3", service_from_date: "2026-08-12", service_to_date: "2026-08-12", place_of_service: "11", diagnosis_codes: ["E11", "I50"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e3: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e3}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { b_v2: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2}" }, as: McoEncounterOps, captures: { b_v3: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e3}", expected_batch_version: "${b_v3}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }, { encounter_id: "${e2}", outcome: "ACCEPTED" }, { encounter_id: "${e3}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/cycles/${cyc_id}/compute-risk-scores", payload: {}, as: McoFinance }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance, captures: { stmt_id: $.data.id } }
          trigger:
            - { call: "POST /programs/capitation-statements/${stmt_id}/reconcile", payload: {}, as: McoFinance }
          assert:
            - "CapitationStatement.${stmt_id}.member_months == 4"
            - "CapitationStatement.${stmt_id}.provisional_paid_cents == 270000  (3*50000 + 1*120000 at risk 1.0)"
            - "CapitationStatement.${stmt_id}.final_amount_cents == 340000  (40000 + 60000 + 0 + 240000 with normalized risk)"
            - "CapitationStatement.${stmt_id}.adjustment_cents == 70000  (final - provisional; variants diverge on identical member-months)"
            - "CapitationStatement.${stmt_id}.withhold_applied == false  (no FAILED audit for the cycle)"

      - name: completeness_intake_vs_eligibility_divergence
        grounds: [calculations.completeness_rate, entities.Audit.fields.completeness_intake_rate, entities.Audit.fields.completeness_eligibility_rate]
        distinguishing_aspect: |
          Same 3 acknowledged encounters measured two ways on the Audit/quality domain: intake-based divides by
          received encounters (3/4 = 0.75) while the governing eligibility-benchmark variant divides by
          ceil(member_months * 0.5) (3/2 = 1.5) — different denominators, and the determination PASSes only
          because the eligibility variant governs.
        test_recipe:
          setup:
            - "Program with TANF@50000 schedule; August cycle; 4 TANF members; provider active"
            - "e1..e4 (one per member) all VALIDATED; e1,e2,e3 reach ACKNOWLEDGED; e4 never staged (stays VALIDATED)"
            - "Statement exists (provisional 200000); audit sample 10 with 0 defects"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-CMP", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 50000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m2: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M3", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m3: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M4", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m4: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m2}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m3}", provider_id: "${prov_id}", encounter_ref: "E3", service_from_date: "2026-08-12", service_to_date: "2026-08-12", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e3: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m4}", provider_id: "${prov_id}", encounter_ref: "E4", service_from_date: "2026-08-13", service_to_date: "2026-08-13", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e4: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e3}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e4}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps, captures: { b_v2: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e2}", expected_batch_version: "${b_v2}" }, as: McoEncounterOps, captures: { b_v3: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e3}", expected_batch_version: "${b_v3}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }, { encounter_id: "${e2}", outcome: "ACCEPTED" }, { encounter_id: "${e3}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 10, defect_count: 0 }, as: StateAgency, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /programs/audits/${aud_id}/determine", payload: {}, as: StateAgency }
          assert:
            - "Audit.${aud_id}.completeness_intake_rate == 0.75  (3 accepted / 4 intake)"
            - "Audit.${aud_id}.completeness_eligibility_rate == 1.5  (3 accepted / ceil(4 * 0.5) = 2)"
            - "Audit.${aud_id}.accuracy_rate == 1.0"
            - "Audit.${aud_id}.determination == PASS  (eligibility variant governs: 1.5 >= 0.98)"
            - "GET /programs/penalties?cycle_id=${cyc_id} returns total_count == 0 (no penalty on PASS)"

  - rule_id: combinatorial_formula
    instances:
      - name: penalty_nested_min_max_cap_binds
        grounds: [calculations.penalty_amount, entities.Program.fields.penalty_cap_percent]
        distinguishing_aspect: |
          Mode (a): penalty_amount combines completeness shortfall (48 points from rate 0.5), accuracy shortfall
          (15 points from rate 0.80) and the statement provisional cap through nested max/min — raw
          63 * 50000 = 3150000 is cut to min(3150000, round(0.10 * 480000)) = 48000, so the cap branch is
          what the assertion observes.
        test_recipe:
          setup:
            - "Program (penalty_threshold_cents high so posture stays OPEN); SSI@120000 schedule; August cycle; 4 SSI members"
            - "Exactly 1 encounter acknowledged (eligibility completeness 1/2 = 0.5); statement provisional 480000; audit sample 20 with 4 defects (accuracy 0.80)"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-PEN", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "SSI", pmpm_cents: 120000, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M3", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M4", aid_category: "SSI", enrolled_from: "2026-08-01" }, as: McoEncounterOps }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["Z00"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
            - { call: "POST /programs/batches/${b_id}/encounters", payload: { encounter_id: "${e1}", expected_batch_version: "${b_v1}" }, as: McoEncounterOps }
            - { call: "POST /programs/batches/${b_id}/seal", payload: {}, as: McoEncounterOps, as_user_id: "ops-1" }
            - { call: "POST /programs/batches/${b_id}/transmit", payload: {}, as: McoCompliance, as_user_id: "comp-1" }
            - { call: "POST /programs/batches/${b_id}/acknowledge", payload: { outcomes: [{ encounter_id: "${e1}", outcome: "ACCEPTED" }] }, as: StateAgency }
            - { call: "POST /programs/capitation-statements", payload: { cycle_id: "${cyc_id}" }, as: McoFinance }
            - { call: "POST /programs/audits", payload: { cycle_id: "${cyc_id}", sample_size: 20, defect_count: 4 }, as: StateAgency, captures: { aud_id: $.data.id } }
          trigger:
            - { call: "POST /programs/audits/${aud_id}/determine", payload: {}, as: StateAgency }
            - { call: "GET /programs/penalties?cycle_id=${cyc_id}", as: StateAgency, captures: { pen_id: "$.data[0].id" } }
          assert:
            - "Audit.${aud_id}.completeness_eligibility_rate == 0.5 and accuracy_rate == 0.8 and determination == FAIL"
            - "PenaltyAssessment.${pen_id}.reason == COMBINED  (both components failed)"
            - "PenaltyAssessment.${pen_id}.amount_cents == 48000  (raw 63 points * 50000 = 3150000 capped at 10% of 480000)"
            - "PenaltyAssessment.${pen_id}.status == ASSESSED"

      - name: capitation_per_member_rounding_then_sum
        grounds: [calculations.capitation_amount, calculations.risk_score_normalization]
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-member-first. With pmpm 33333 and normalized scores
          0.8/0.8/1.4, per-member rounding yields 26666 + 26666 + 46666 = 99998, whereas the forbidden
          sum-then-round order yields 99999 — a one-cent observable difference, and the adjustment against
          the 99999 provisional is exactly -1.
        test_recipe:
          setup:
            - "Program; TANF@33333 schedule covering 2026-08; August cycle; 3 TANF members"
            - "e1(m1,[E11]) raw 0.8, e2(m2,[E11]) raw 0.8, e3(m3,[F32,N18]) raw 1.4; all ACKNOWLEDGED; average raw = 1.0 so normalized = raw"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P-RND", state_code: "CA", companion_guide_version: "CG-2026.1", penalty_threshold_cents: 100000000 }, as: StateAgency, captures: { prog_id: $.data.id } }
            - { call: "POST /programs/rate-schedules", payload: { program_id: "${prog_id}", aid_category: "TANF", pmpm_cents: 33333, effective_from: "2026-08-01", effective_to: "2026-08-31" }, as: StateAgency }
            - { call: "POST /programs/cycles", payload: { program_id: "${prog_id}", label: "2026-08", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-09-15T00:00:00Z" }, as: StateAgency, captures: { cyc_id: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M1", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m1: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M2", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m2: $.data.id } }
            - { call: "POST /programs/members", payload: { program_id: "${prog_id}", medicaid_id: "M3", aid_category: "TANF", enrolled_from: "2026-08-01" }, as: McoEncounterOps, captures: { m3: $.data.id } }
            - { call: "POST /programs/providers", payload: { program_id: "${prog_id}", npi: "1234567890", taxonomy_code: "207Q00000X" }, as: McoEncounterOps, captures: { prov_id: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m1}", provider_id: "${prov_id}", encounter_ref: "E1", service_from_date: "2026-08-10", service_to_date: "2026-08-10", place_of_service: "11", diagnosis_codes: ["E11"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e1: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m2}", provider_id: "${prov_id}", encounter_ref: "E2", service_from_date: "2026-08-11", service_to_date: "2026-08-11", place_of_service: "11", diagnosis_codes: ["E11"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e2: $.data.id } }
            - { call: "POST /programs/encounters", payload: { program_id: "${prog_id}", member_id: "${m3}", provider_id: "${prov_id}", encounter_ref: "E3", service_from_date: "2026-08-12", service_to_date: "2026-08-12", place_of_service: "11", diagnosis_codes: ["F32", "N18"], paid_amount_cents: 10000, lines: [{ line_number: 1, procedure_code: "99213", units: 1, billed_amount_cents: 10000, paid_amount_cents: 10000 }] }, as: McoEncounterOps, captures: { e3: $.data.id } }
            - { call: "POST /programs/encounters/${e1}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e2}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/encounters/${e3}/validate", payload: {}, as: McoEncounterOps }
            - { call: "POST /programs/batches", payload: { cycle_id: "${cyc_id}" }, as: McoEncounterOps, captures: { b_id: $.data.id, b_v1: $.data.version } }
