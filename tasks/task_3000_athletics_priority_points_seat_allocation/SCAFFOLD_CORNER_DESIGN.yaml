            - "The certify by user id \"certifier-1\" — the dispute's reviewer — returns HTTP 200 with status == \"CERTIFIED\" and certified_by_user_id == \"certifier-1\", NOT ERR_SEGREGATION_OF_DUTIES: priority 4 compares the certifier against initiated_by_user_id only"
            - "PointRecalculation.${axr_id}.certified_points_sum == 15.00 and Donor.${axl_id}.rank_position == 1"

  # ---------------------------------------------------------------------------
  # Cross-Cutting Complexity Layers — claim-extraction-guide.md §8. §1.0 declares
  # four active layers: dual_variant_calculation, cascading_side_effects,
  # optimistic_concurrency and selector_policy. The guide's table has NO
  # selector_policy row, so that layer is covered under the calculations section
  # instead (the variant_selection claims), and the two claims below are the
  # guide's optimistic_concurrency row applied once per §1.2.1 concurrency rule
  # using each rule's own write_endpoint and occ_field, plus the version-increment
  # walk the same row demands. Three stubs then defer the cascade and
  # dual-variant rows to the §1.8 instances that already own them.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: relocation_request_create_with_a_stale_donor_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[relocation-request-create-stale-donor]
          - validations[priority 8]
          - state_machines.RelocationRequest.transitions.AWAITING_SELECTION_to_SUPERSEDED
        distinguishing_aspect: |
          This is the harder of the two OCC rules because no state precondition
          blocks a second create — a donor is explicitly allowed to supersede
          their own pending request — so the stale expected_donor_version is the
          ONLY thing that can refuse the write. The three-call sequence therefore
          discriminates a real version comparison from a state check: the same
          body succeeds, then fails on the stale version, then succeeds again on a
          re-read version. The supersede leg also pins the counter arithmetic:
          §1.5 says the create increments pending_request_count while §1.2 says
          the supersede leaves it unchanged, and the two compose to a NET 1.
        test_recipe:
          setup:
            - "Sections SEC-P (source) and SEC-Q (target), each with seat_capacity 1, per_seat_requirement_cents 100000, required_points_per_seat 0.00 and one seat."
            - "One donor with certified_points 15.00 from a single 1000000-cent RECEIVED ATHLETICS_ANNUAL gift dated 2026-03-01."
            - "A CERTIFIED cycle-2026 recalculation with an OPEN SEASON_TICKET event; the donor has picked SEC-P's seat, paid 100000 in full and been moved to occupancy_status ASSIGNED, so no fiscal or state gate stands in the way of a relocation request."
            - "Logical clock at 2026-09-01T06:00:00.000Z, inside the event's slot window and inside the OPEN event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-P", venue_code: "STADIUM-P", seat_capacity: 1, per_seat_requirement_cents: 100000, required_points_per_seat: 0.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secp_id: "$.data.id" }
            - call: "POST /athletics/sections/${secp_id}/seats"
              payload: { row_label: "P", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seatp_id: "$.data.id" }
            - call: "POST /athletics/sections"
              payload: { section_code: "SEC-Q", venue_code: "STADIUM-Q", seat_capacity: 1, per_seat_requirement_cents: 100000, required_points_per_seat: 0.00 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { secq_id: "$.data.id" }
            - call: "POST /athletics/sections/${secq_id}/seats"
              payload: { row_label: "Q", seat_number: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { seatq_id: "$.data.id" }
            - call: "POST /athletics/donors"
              payload: { full_name: "Van Version", email: "van.version@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
