            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/transfer", payload: { new_holder_id: "${holder2_id}" }, as: Registrar }
          trigger:
            - { call: "POST /cemetery-mgmt/deeds/${deed_id}/accept-transfer", payload: {}, as: RightHolder, as_user_id: "${holder3_id}", captures: { err: "$.data.error_id" } }
