            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 9, mature_oocyte_count: 3, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_TANK_AT_CAPACITY"
            - "response.status == 409"

      - name: cycle_trigger_min_visits_boundary
        grounds:
          - "validations[priority=15]"
          - entities.StimulationCycle.fields.monitoring_visit_count
          - state_machines.StimulationCycle.MONITORING_to_TRIGGERED
        distinguishing_aspect: "Metric = monitoring visit count on POST trigger: with 2 visits (< MIN_MONITORING_VISITS 3) trigger is rejected with ERR_INSUFFICIENT_MONITORING_VISITS; a distinct endpoint/metric from tank capacity."
        test_recipe:
          setup:
            - "Cycle in MONITORING with only 2 appointments logged."
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr K", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P 13", date_of_birth: "1993-01-01T00:00:00Z", email: "p13@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 31, amh_level: 3.0, antral_follicle_count: 16 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_MONITORING_VISITS"
            - "response.status == 422"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cycle_schedule_requires_eligible_consult
        grounds:
          - state_machines.StimulationCycle.DRAFT_to_SCHEDULED
          - entities.Consultation.fields.eligibility_status
          - "validations[priority=7]"
        distinguishing_aspect: "Pair StimulationCycle->Consultation: scheduling is blocked while the referenced Consultation is not COMPLETED+ELIGIBLE (status REQUESTED) -> ERR_CONSULTATION_NOT_ELIGIBLE."
        test_recipe:
          setup:
            - "Consultation created but NOT completed (eligibility_status PENDING); a DRAFT cycle references it."
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P 14", date_of_birth: "1993-01-01T00:00:00Z", email: "p14@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
