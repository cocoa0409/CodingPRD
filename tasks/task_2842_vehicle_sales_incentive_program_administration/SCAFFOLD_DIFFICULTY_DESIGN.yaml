          assert:
            - "${prog_status_draft} == DRAFT and the first objective creation returns HTTP 409 with error.code == ERR_PROGRAM_NOT_ACTIVE"
            - "${prog_status_pending} == PENDING_APPROVAL and the second objective creation returns the SAME HTTP 409 ERR_PROGRAM_NOT_ACTIVE — a program awaiting approval is still not a valid parent"
            - "the objectives list for this program is EMPTY at that point (0 rows) — neither refusal created a DealerObjective row"
            - "${prog_status_active} == ACTIVE"
            - "the third, byte-identical objective creation returns HTTP 201 with ${obj_status} == PROPOSED, ${obj_basis} == 12, ${obj_units} == 15 (round_half_up(12 * 12500 / 10000)) and ${obj_round} == 0"
            - "the objectives list now holds exactly 1 row with ${obj_list_0_id} == ${obj_id} and ${obj_list_0_units} == 15"
            - "the objective's dealer_id and program_id resolve to the created Dealer and IncentiveProgram, so the child is genuinely parented rather than orphaned"

  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_program_windows_allow_adjacency_but_refuse_one_day_intersection
        grounds:
          - validations.priority_12_ERR_PROGRAM_WINDOW_OVERLAP
          - state_machines.IncentiveProgram.DRAFT_to_PENDING_APPROVAL
          - entities.IncentiveProgram.fields.effective_to
          - entities.StackabilityConstraint.fields.mode
        distinguishing_aspect: |
          Resource: the (incentive_type, eligibility footprint) slot of an IncentiveProgram.
          Interval semantics: HALF-OPEN [effective_from, effective_to), so a program starting
          exactly at the incumbent's effective_to is ADJACENT and legal, while starting one day
          earlier intersects and is refused. The occupancy set is {PENDING_APPROVAL, ACTIVE},
          so a merely submitted program already occupies the slot, and an ALLOWED
          StackabilityConstraint is the declared escape hatch from the check.
        test_recipe:
          setup:
            - "Four CUSTOMER_CASH programs sharing one eligibility footprint (MX5 / WEST / build 2026-05-01..2026-07-31 / CASH) plus one control program on a different model."
            - "RTO-A: window [2026-08-01, 2026-08-16), submitted so it sits in PENDING_APPROVAL."
            - "RTO-B: window [2026-08-16, 2026-08-31) — starts exactly at A's EXCLUSIVE end."
            - "RTO-C: window [2026-08-15, 2026-08-31) — one day earlier, so it intersects A on [2026-08-15, 2026-08-16)."
            - "RTO-D: window [2026-08-10, 2026-08-20), which intersects both A and B, but ALLOWED stackability edges are declared to both."
            - "RTO-E: window [2026-08-01, 2026-08-31) with a TRK9 footprint — total window intersection, disjoint footprint."
            - "All five stay unapproved except A, which is approved partway through to prove ACTIVE occupies the slot exactly as PENDING_APPROVAL does."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "RTO-A", name: "Overlap A", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-08-16T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 20000000, stack_group: "RTO", priority_rank: 131, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_a: $.data.id }
            - call: "POST /incentives/programs/${prog_a}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_a}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { a_status: $.data.status }
            - call: "POST /incentives/programs"
              payload: { program_code: "RTO-B", name: "Overlap B adjacent", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-16T00:00:00.000Z", effective_to: "2026-08-31T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 20000000, stack_group: "RTO", priority_rank: 132, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_b: $.data.id }
            - call: "POST /incentives/programs/${prog_b}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "RTO-C", name: "Overlap C one day early", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-15T00:00:00.000Z", effective_to: "2026-08-31T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 20000000, stack_group: "RTO", priority_rank: 133, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_c: $.data.id }
            - call: "POST /incentives/programs/${prog_c}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "RTO-D", name: "Overlap D with allowed edges", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-10T00:00:00.000Z", effective_to: "2026-08-20T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 20000000, stack_group: "RTO", priority_rank: 134, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_d: $.data.id }
            - call: "POST /incentives/programs/${prog_d}/eligibility-rules"
              payload: { model_code: "MX5", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_d}/stackability-constraints"
              payload: { program_b_id: "${prog_a}", mode: "ALLOWED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs/${prog_d}/stackability-constraints"
              payload: { program_b_id: "${prog_b}", mode: "ALLOWED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "POST /incentives/programs"
              payload: { program_code: "RTO-E", name: "Overlap E disjoint footprint", incentive_type: "CUSTOMER_CASH", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2026-08-31T00:00:00.000Z", per_unit_amount_cents: 100000, budget_cents: 20000000, stack_group: "RTO", priority_rank: 135, accrual_method: "UNIT_BASED" }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { prog_e: $.data.id }
            - call: "POST /incentives/programs/${prog_e}/eligibility-rules"
              payload: { model_code: "TRK9", region_code: "WEST", build_date_from: "2026-05-01T00:00:00.000Z", build_date_to: "2026-07-31T00:00:00.000Z", allowed_deal_types: ["CASH"] }
              as: ProgramDesigner
              as_user_id: "u-designer-1"
          trigger:
            - call: "POST /incentives/programs/${prog_b}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { b_status: $.data.status }
            - call: "POST /incentives/programs/${prog_c}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
            - call: "GET /incentives/programs/${prog_c}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { c_status_after: $.data.status, c_version_after: $.data.version, c_submitter: $.data.submitted_by_user_id }
            - call: "POST /incentives/programs/${prog_d}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { d_status: $.data.status }
            - call: "POST /incentives/programs/${prog_e}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { e_status: $.data.status }
            - call: "POST /incentives/programs/${prog_a}/approve"
              payload: {}
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { a_status_active: $.data.status }
            - call: "POST /incentives/programs/${prog_c}/submit"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
          assert:
            - "${a_status} == PENDING_APPROVAL — the incumbent is not yet ACTIVE, yet it already occupies the slot"
            - "${b_status} == PENDING_APPROVAL: [2026-08-16, 2026-08-31) starting exactly on A's EXCLUSIVE effective_to is ADJACENT, not overlapping, and is accepted"
            - "submitting RTO-C returns HTTP 409 with error.code == ERR_PROGRAM_WINDOW_OVERLAP — one day of intersection, [2026-08-15, 2026-08-16), is enough"
            - "${c_status_after} == DRAFT and ${c_submitter} == null and ${c_version_after} == 1 — the refused submit did not set submitted_by_user_id and did not bump the version"
            - "${d_status} == PENDING_APPROVAL even though D's window intersects BOTH A and B, because ALLOWED StackabilityConstraint edges join it to both"
            - "${e_status} == PENDING_APPROVAL: a totally intersecting window on a disjoint footprint (TRK9 instead of MX5) never collides — the resource is the (incentive_type, footprint) slot, not the calendar alone"
            - "${a_status_active} == ACTIVE, and re-submitting RTO-C afterwards STILL returns 409 ERR_PROGRAM_WINDOW_OVERLAP, proving the occupancy set covers ACTIVE as well as PENDING_APPROVAL"

      - name: closed_batch_periods_need_a_strictly_greater_than_one_day_settlement_gap
        grounds:
          - validations.priority_13_ERR_BATCH_PERIOD_OVERLAP
          - validations.priority_14_ERR_BATCH_BUFFER_VIOLATION
          - state_machines.PaymentBatch.OPEN_to_CANCELLED
          - entities.PaymentBatch.fields.period_end
        distinguishing_aspect: |
          A different resource — the (region_code) payment calendar of a PaymentBatch — with
          DELIBERATELY DIFFERENT interval semantics: the pay period is a CLOSED interval
          [period_start, period_end] guarded by SETTLEMENT_BUFFER_DAYS = 1, so unlike the
          half-open program window of instance 1, adjacency is REFUSED and a one-day gap is
          refused too. Two distinct errors sit on the same endpoint and priority 13 must outrank
          priority 14 when the periods actually intersect. Cancelling a batch releases the
          interval, which no program window ever does.
        test_recipe:
          setup:
            - "One OPEN PaymentBatch RTB-1 for region WEST with the closed period [2026-08-01, 2026-08-15] and scheduled_pay_date 2026-09-10."
            - "No claims are needed: period occupancy is a property of the batch, not of its contents."
            - "Logical clock at 2026-08-20 throughout, which is irrelevant to the overlap checks and is set only for determinism."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/payment-batches"
              payload: { batch_code: "RTB-1", region_code: "WEST", period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-15T00:00:00.000Z", scheduled_pay_date: "2026-09-10T00:00:00.000Z" }
              as: IncentiveController
