      - name: refund_settle_conserves_returned_aid_equals_aid_return
        grounds:
          - state_machines.RefundCase.COMPUTED_to_SETTLED
          - state_machines.AidDisbursement.RELEASED_to_RETURNED
          - calculations.aid_return
          - entities.RefundCase.fields.aid_return_cents
        distinguishing_aspect: |
          Invariant on the conserved quantity total-returned-aid: after settle,
          the sum of per-draw clawed amounts (each draw's prior amount_cents minus
          new amount_cents over RETURNED draws) equals RefundCase.aid_return_cents
          exactly (300000), a monetary conservation distinct from the integer
          site-count conservation.
        test_recipe:
          setup:
            - "Same as refund_settle_returns_aid_recomputes_ledger: agreement WITHDRAWN with two RELEASED draws (200000 each, disbursed 400000) and a COMPUTED PRO_RATA refund (aid_return 300000)."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Ophthalmic", credential_type: "DIPLOMA", required_clock_hours: 1000, required_theory_hours: 600, required_externship_hours: 400, tuition_cents: 1000000 }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /v1/programs/${prog_id}/open"
              payload: {}
              as: SystemAdmin
            - call: "POST /v1/cohorts"
              payload: { program_id: "${prog_id}", code: "OPH-A", start_term_index: 0, end_term_index: 8, seat_capacity: 5 }
              as: Registrar
              captures: { coh_id: $.data.id }
            - call: "POST /v1/cohorts/${coh_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /v1/students"
              payload: { full_name: "Te Wuv", email: "te@x.com", hs_diploma_verified: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /v1/enrollment-agreements"
              payload: { student_id: "${stu_id}", cohort_id: "${coh_id}", contract_tuition_cents: 1000000, scheduled_aid_cents: 400000, cancellation_window_term_index: 0 }
              as: Registrar
              captures: { agr_id: $.data.id }
            - call: "POST /v1/enrollment-agreements/${agr_id}/enroll"
              payload: {}
              as: Registrar
            - call: "POST /v1/attendance-entries"
              payload: { agreement_id: "${agr_id}", term_index: 1, kind: "THEORY", scheduled_hours: 250, attended_hours: 250 }
              as: AcademicAdvisor
            - call: "POST /v1/aid-disbursements"
              payload: { agreement_id: "${agr_id}", disbursement_index: 1, planned_amount_cents: 200000, required_clock_hours_gate: 0 }
              as: FinancialAidOfficer
              captures: { d1: $.data.id }
            - call: "POST /v1/aid-disbursements"
              payload: { agreement_id: "${agr_id}", disbursement_index: 2, planned_amount_cents: 200000, required_clock_hours_gate: 0 }
              as: FinancialAidOfficer
              captures: { d2: $.data.id }
            - call: "POST /v1/aid-disbursements/${d1}/release"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /v1/aid-disbursements/${d2}/release"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /v1/clock/advance"
              payload: { to_term_index: 6 }
              as: SystemAdmin
            - call: "POST /v1/enrollment-agreements/${agr_id}/withdraw"
              payload: {}
              as: Registrar
            - call: "GET /v1/enrollment-agreements/${agr_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { ver: $.data.version }
            - call: "POST /v1/refund-cases"
              payload: { agreement_id: "${agr_id}", method: "PRO_RATA", withdrawal_term_index: 6 }
              as: FinancialAidOfficer
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /v1/refund-cases/${rc_id}/settle"
              payload: { expected_agreement_version: "${ver}" }
              as: FinancialAidOfficer
              captures: { st: $.data.status, aid_ret: $.data.aid_return_cents }
          assert:
            - "RefundCase.aid_return_cents == 300000"
            - "sum over RETURNED draws of (200000 - new amount_cents) == 300000 (d2: 200000-0=200000; d1: 200000-100000=100000)"
            - "EnrollmentAgreement.${agr_id}.disbursed_aid_cents == 100000"
