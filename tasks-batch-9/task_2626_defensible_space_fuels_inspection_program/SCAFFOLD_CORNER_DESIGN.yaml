          assert:
            - "${z0_sev} == \"MINOR\" with ${z0_pts} == 30.95, ${z1_sev} == \"MAJOR\" with ${z1_pts} == 60.00, ${z2_sev} == \"MINOR\" with ${z2_pts} == 3.36"
            - "${veg} == 94.31 (30.95 + 60.00 + 3.36, each per-zone value rounded first) and ${maxsev} == \"MAJOR\""
            - "The ViolationNotice created on ${p1} has severity == \"MAJOR\", notice_method == \"CERTIFIED_MAIL\", issued_at_utc == \"2026-08-22T00:00:00Z\""
            - "That notice has delivered_at_utc == \"2026-08-27T00:00:00Z\", compliance_days == 30 and deadline_utc == \"2026-09-26T23:59:59Z\""
            - "The notice status is ISSUED and extension_count == 0"

      - name: very_high_hazard_compression_constants_applied
        claim_type: Constants Applied
        grounds:
          - calculations.notice_compliance_deadline.constants
          - calculations.parcel_risk_score.constants
          - validations.priority_50
        distinguishing_aspect: |
          Only the VERY_HIGH branch applies VERY_HIGH_COMPRESSION: a CRITICAL notice served by EMAIL at
          clock 2026-08-22 on a VERY_HIGH parcel grants ceil(14 * 0.75) == 11 days (above the
          MIN_COMPLIANCE_DAYS 7 floor, so the floor does not bind) with delivered_at_utc equal to
          issued_at_utc and deadline 2026-09-02T23:59:59Z, while the same parcel's HAZARD_MULT 1.30
          drives risk_score 72.15 at intake and 80.72 after verification.
        test_recipe:
          setup:
            - "Active cycle; a WUI_SPECIALIST inspector (required for VERY_HIGH parcels); a VERY_HIGH parcel (slope 30, BRUSH, CLASS_B, GATED); a NOTICED inspection graded 5.0 / 14.0 / 118.0 ft at clock 2026-08-22."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
