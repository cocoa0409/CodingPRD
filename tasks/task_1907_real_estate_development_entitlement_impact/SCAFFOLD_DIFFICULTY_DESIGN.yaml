          assert:
            - "ImpactFeeAssessment.${assessment_id}.status == REFUNDED (cascade hop 1)"
            - "PublicHearing.${hearing_id}.status == CANCELLED (cascade hop 2)"
            - "EntitlementApplication.${app_id}.status == WITHDRAWN (origin)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: decision_state_vs_temporal_deadline_priority
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DECISION_DEADLINE_PASSED]
        distinguishing_aspect: |
          Category pair (state vs business_temporal): a decision render attempted
          when the application is NOT in DECISION_PENDING (state error, priority 4)
          AND the statutory decision deadline has also passed (temporal error,
          priority 5) must return ERR_INVALID_STATE because state (4) precedes
          temporal (5).
        test_recipe:
          setup:
            - "Application still UNDER_REVIEW (never advanced); logical clock advanced past decision_due_date (submitted 2026-08-01 + 90 days = 2026-10-30)"
          setup_api_calls:
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /entitlement/fee-schedules"
              payload: { schedule_label: "V1", effective_date: "2026-08-01T00:00:00Z", rate_transportation_res: 3200.00, rate_parks_res: 2100.00, rate_fire_res: 800.00, rate_water_res: 2600.00, rate_sewer_res: 2900.00, rate_transportation_com: 5400.00, rate_parks_com: 0.00, rate_fire_com: 950.00, rate_water_com: 3100.00, rate_sewer_com: 3400.00 }
              as: PlatformAdmin
              captures: { fs_v1: $.data.id }
            - call: "POST /entitlement/fee-schedules/${fs_v1}/adopt"
              payload: {}
              as: PlatformAdmin
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "PriCo", contact_email: "p@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
            - call: "POST /entitlement/projects"
              payload: { project_name: "Pri", applicant_id: "${applicant_id}", land_use_type: "RESIDENTIAL", dwelling_units: 5, affordable_units: 0, floor_area_sqft: 0, prior_use_basis: {} }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { project_id: $.data.id, project_v: $.data.version }
            - call: "POST /entitlement/applications"
              payload: { project_id: "${project_id}", application_type: "REZONE", submittal_package: ["SITE_PLAN"], expected_project_version: "${project_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /entitlement/staff-reviewers"
              payload: { full_name: "Rev", disciplines: ["PLANNING"] }
              as: PlatformAdmin
              captures: { rev_id: $.data.id }
            - call: "POST /entitlement/decision-authorities"
              payload: { full_name: "Council", body: "CITY_COUNCIL" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /entitlement/applications/${app_id}/open-review"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
            - call: "POST /entitlement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /entitlement/applications/${app_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/decisions"
              payload: { decision: "APPROVE", decided_by: "${auth_id}", expected_application_version: "${app_v}" }
              as: DecisionAuthority
              as_user_id: "${auth_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 4 beats temporal priority 5)"
            - "HTTP status 409 (not 422 temporal)"

      - name: payment_existence_vs_fiscal_overpay_priority
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_PAYMENT_EXCEEDS_BALANCE]
        distinguishing_aspect: |
          Category pair (existence vs business_fiscal): a payment posted to a
          NON-EXISTENT assessment id with an amount that would also exceed any
          balance must return ERR_NOT_FOUND because existence (priority 3)
          precedes fiscal (priority 8). Different error-category pair than the
          state-vs-temporal instance.
        test_recipe:
          setup:
            - "Nothing special; only need a valid applicant role and a bogus assessment id"
          setup_api_calls:
            - call: "POST /entitlement/applicants"
              payload: { legal_name: "PayCo", contact_email: "pay@x.com" }
              as: PlatformAdmin
              captures: { applicant_id: $.data.id }
          trigger:
            - call: "POST /entitlement/assessments/00000000-0000-0000-0000-000000000000/payments"
              payload: { amount: 99999999.00, paid_at: "2026-08-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (existence priority 3 beats fiscal priority 8)"
            - "HTTP status 404 (not 402 fiscal)"

