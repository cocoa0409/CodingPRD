          - errors[ERR_DEFICIENCY_ALREADY_MITIGATED]
        distinguishing_aspect: |
          Mitigating the only OPEN child bubbles two levels up in one call: the deficiency becomes
          MITIGATED, its parent correction auto-moves ASSESSED -> CLOSED without any client action, and
          the grandparent cycle's restatement_stage moves RESTATEMENT_DECLARED -> REMEDIATED while
          `status` stays FILED. The pre-state is pinned by exact arithmetic (IRON_CURTAIN materiality
          5.83 -> RESTATEMENT, severity_score 5.83 -> MATERIAL_WEAKNESS, deficiency_weight 23.32), and a
          replayed mitigate on the now-MITIGATED row returns ERR_DEFICIENCY_ALREADY_MITIGATED — not
          ERR_INVALID_STATE from the parent's CLOSED status, and not ERR_ENTITY_TERMINAL, since priority
          12 deliberately excludes ControlDeficiency and priority 13 declares no parent-state gate for
          mitigation.
