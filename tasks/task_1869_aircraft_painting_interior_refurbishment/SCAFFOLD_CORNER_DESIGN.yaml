# =============================================================================
# Task 1869 — SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-difficulty)
# Breadth probe: every testable claim of §1.1–§1.7 not covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: program_creation_success_with_derived_defaults
        claim_type: creation
        grounds:
          - entities.RefurbProgram
          - state_machines.RefurbProgram
        distinguishing_aspect: "POST /completion/programs with all required fields returns 201; status QUOTED (initial state), committed_delivery_date mirrors contractual_delivery_date, total_contract_value_cents echoes base, other totals 0, version 1."
        test_recipe:
          setup: ["empty DB; one customer and aircraft created"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, st: $.data.status, cdd: $.data.committed_delivery_date, tcv: $.data.total_contract_value_cents, v: $.data.version } }
          assert:
            - "st == QUOTED and cdd == 2026-09-01 and tcv == 12345673 and v == 1"
            - "discovery_cost_total_cents == 0, billed_total_cents == 0, penalty_final_cents == 0, projected_penalty_cents == 0, rework_cycles == 0, approved_scheme_id == null"

      - name: program_create_missing_required_field
        claim_type: required_fields
        grounds:
          - entities.RefurbProgram
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required base_price_cents yields 400 ERR_INVALID_REQUEST before any state check."
        test_recipe:
          setup: ["one customer and one aircraft exist"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: customer_credit_status_default_applied
        claim_type: defaults
        grounds:
          - entities.Customer.fields.credit_status
        distinguishing_aspect: "credit_status is not an accepted create input; the response shows the system default GOOD_STANDING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cs: $.data.credit_status } }
          assert:
            - "cs == GOOD_STANDING"

      - name: program_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /completion/programs/11111111-2222-3333-4444-555555555555", as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: program_system_fields_server_minted
        claim_type: system_fields
        grounds:
          - entities.RefurbProgram
          - response_envelope
        distinguishing_aspect: "id is a server-minted UUID; created_at equals the logical-clock default 2026-08-01T00:00:00.000Z (three fractional digits); version starts at 1."
        test_recipe:
          setup: ["customer and aircraft exist; logical clock never set"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { pid: $.data.id, cat: $.data.created_at, v: $.data.version } }
          assert:
            - "pid is a non-empty UUID string; cat == 2026-08-01T00:00:00.000Z; v == 1"

      - name: advance_with_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "to_phase outside the declared phase enum is a 400 ERR_INVALID_REQUEST, not a 409 state error."
        test_recipe:
          setup: ["program QUOTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
          trigger:
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "FLYING" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400); program stays QUOTED"

      - name: burn_test_record_is_immutable
        claim_type: immutability
        grounds:
          - entities.BurnTest
        distinguishing_aspect: "BurnTest declares common_fields false: its create response carries id, created_at and test_sequence but no updated_at/version, and §1.5 declares no update/delete endpoint for it."
        test_recipe:
          setup: ["program QUOTED with one lot"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/soft-good-lots", payload: { program_id: "${prog_id}", description: "Carpet roll", material: "Wool blend", quantity: 4, estimated_weight_lbs: 60.0 }, as: ShopTechnician, captures: { lot_id: $.data.id } }
          trigger:
            - { call: "POST /completion/soft-good-lots/${lot_id}/burn-tests", payload: { test_method: "VERTICAL_12S", result: "PASS", lab_name: "AeroBurn Labs" }, as: ShopTechnician, captures: { bt_id: $.data.id, bt_seq: $.data.test_sequence } }
          assert:
            - "response contains id, created_at, lot_id, test_method, result, lab_name and bt_seq == 1"
            - "response contains no version and no updated_at keys (append-only record)"

      - name: scheme_create_dangling_program_fk_rejected
        claim_type: parent_relationships
        grounds:
          - entities.PaintScheme.fields.program_id
          - errors[ERR_REFERENTIAL_INTEGRITY]
        distinguishing_aspect: "Flat-topology FK integrity: a body FK referencing a nonexistent program is rejected 422 ERR_REFERENTIAL_INTEGRITY (not 404 — the path carries no resource id)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /completion/paint-schemes", payload: { program_id: "11111111-2222-3333-4444-555555555555", drawing_ref: "DWG-X", painted_area_sqft: 2400, coat_count: 2 }, as: DesignLead, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REFERENTIAL_INTEGRITY (http 422)"

      - name: discovery_item_cross_program_assessment_rejected
        claim_type: parent_relationships
        grounds:
          - entities.DiscoveryItem.fields.assessment_id
          - validations[priority=20]
        distinguishing_aspect: "Cross-aggregate consistency: assessment_id exists but belongs to a DIFFERENT program — both programs are INDUCTED so the state check passes and the referential check (P20) fires with 422 ERR_REFERENTIAL_INTEGRITY."
        test_recipe:
          setup: ["two programs (two aircraft), BOTH INDUCTED (program 2 via a second bay); assessment recorded on program 1"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869B", model: "G550", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac2: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac1}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac2}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { p2: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${p1}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { sl1: $.data.id } }
            - { call: "POST /completion/programs/${p1}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${sl1}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${p1}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
            - { call: "POST /completion/surface-assessments", payload: { program_id: "${p1}" }, as: ShopTechnician, captures: { asm1: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-2", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay2: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay2}", program_id: "${p2}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { sl2: $.data.id } }
            - { call: "POST /completion/programs/${p2}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${sl2}/activate", payload: {}, as: ProgramManager }
            - { call: "POST /completion/programs/${p2}/advance", payload: { to_phase: "INDUCTED" }, as: ProgramManager }
          trigger:
            - { call: "POST /completion/discovery-items", payload: { program_id: "${p2}", assessment_id: "${asm1}", description: "cross-program reference" }, as: ShopTechnician, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_REFERENTIAL_INTEGRITY (http 422) — program 2 is INDUCTED (state passes); the assessment belongs to program 1"

      - name: customers_list_pagination_and_filter
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints
        distinguishing_aspect: "limit/offset/total_count/has_more behave per envelope defaults; credit_status filter narrows the set."
        test_recipe:
          setup: ["three customers exist; one is placed on CREDIT_HOLD"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { c1: $.data.id } }
            - { call: "POST /completion/customers", payload: { name: "Borealis Air", contact_email: "ops@borealis.example" }, as: CenterAdmin, captures: { c2: $.data.id } }
            - { call: "POST /completion/customers", payload: { name: "Cirrus Holdings", contact_email: "ops@cirrus.example" }, as: CenterAdmin, captures: { c3: $.data.id } }
            - { call: "POST /completion/customers/${c3}/credit-status", payload: { credit_status: "CREDIT_HOLD" }, as: CenterAdmin }
          trigger:
            - { call: "GET /completion/customers?limit=2&offset=0", as: ProgramManager }
            - { call: "GET /completion/customers?limit=2&offset=2", as: ProgramManager }
            - { call: "GET /completion/customers?credit_status=CREDIT_HOLD", as: ProgramManager }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
            - "filtered list: exactly 1 item with id == c3"

  # ------------------------------------------------------------ Endpoints
  - section: endpoints
    instances:
      - name: aircraft_retrieval_returns_persisted_fields
        claim_type: standard_crud
        grounds:
          - endpoints
          - entities.Aircraft
        distinguishing_aspect: "GET /completion/aircraft/{id} returns exactly the stored fields incl. FK customer_id and system status IN_SERVICE."
        test_recipe:
          setup: ["one customer, one aircraft"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
          trigger:
            - { call: "GET /completion/aircraft/${ac_id}", as: FinanceClerk, captures: { tail: $.data.tail_number, st: $.data.status, fk: $.data.customer_id } }
          assert:
            - "tail == N1869A and st == IN_SERVICE and fk == cust_id (read demonstrated with FinanceClerk — GETs are shared)"

      - name: clock_set_drives_subsequent_timestamps
        claim_type: conditional_action
        grounds:
          - endpoints
          - response_envelope
        distinguishing_aspect: "The logical-clock endpoint is first-class: after set_current_utc to 2026-08-15T10:30:00Z, newly created entities stamp created_at from the logical clock."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: CenterAdmin }
          trigger:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cat: $.data.created_at } }
          assert:
            - "cat == 2026-08-15T10:30:00.000Z"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: scheme_approve_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.PaintScheme
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approve is only declared from SUBMITTED; from DRAFT it must fail with ERR_INVALID_STATE and no side effects fire (program version unchanged)."
        test_recipe:
          setup: ["program QUOTED with a DRAFT scheme"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id, prog_v0: $.data.version } }
            - { call: "POST /completion/paint-schemes", payload: { program_id: "${prog_id}", drawing_ref: "DWG-1869-A", painted_area_sqft: 2400, coat_count: 2, stripe_pct: 0.10 }, as: DesignLead, captures: { sch_id: $.data.id } }
          trigger:
            - { call: "POST /completion/paint-schemes/${sch_id}/approve", payload: { expected_program_version: "${prog_v0}" }, as: CustomerRep, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { v_after: $.data.version } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "v_after == prog_v0 (no supersede, no version bump on rejection)"

      - name: cancelled_program_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RefurbProgram
        distinguishing_aspect: "From CANCELLED every further transition is rejected: advance returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["program CANCELLED from QUOTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/cancel", payload: {}, as: ProgramManager, captures: { st0: $.data.status } }
          trigger:
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "st0 == CANCELLED and err == ERR_INVALID_STATE"

      - name: quarantined_lot_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SoftGoodLot
        excluded_because:
          difficulty_instance: soft_good_lot_bounded_retest_cycle
          rationale: "The 4th burn test on a CERT_QUARANTINED lot is asserted there with ERR_INVALID_STATE."

      - name: slot_lifecycle_valid_transitions
        claim_type: valid_transition
        grounds:
          - state_machines.HangarSlot
        distinguishing_aspect: "BOOKED on create -> ACTIVE via activate (clock inside window, program BOOKED) -> RELEASED via release; each transition returns the new status."
        test_recipe:
          setup: ["program with a BOOKED slot covering the clock"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id, st0: $.data.status } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
          trigger:
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager, captures: { st1: $.data.status } }
            - { call: "POST /completion/hangar-slots/${slot_id}/release", payload: {}, as: ProgramManager, captures: { st2: $.data.status } }
          assert:
            - "st0 == BOOKED (initial state), st1 == ACTIVE, st2 == RELEASED"

      - name: assessment_amend_self_loop_and_lock
        claim_type: valid_transition
        grounds:
          - state_machines.SurfaceAssessment.DECIDED_to_DECIDED
          - errors[ERR_ASSESSMENT_LOCKED]
        distinguishing_aspect: "The DECIDED->DECIDED self-loop bumps revision (1 -> 2) and overwrites the decision; the same amend at INDUCTED (before SURFACE_REVIEW) is rejected ERR_ASSESSMENT_LOCKED."
        test_recipe:
          setup: ["program INDUCTED with assessment DECIDED (STRIP/NONE)"]
          setup_api_calls:
            - { call: "POST /completion/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CenterAdmin }
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /completion/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N1869A", model: "G650", max_delta_lbs: 50.0 }, as: CenterAdmin, captures: { ac_id: $.data.id } }
            - { call: "POST /completion/programs", payload: { aircraft_id: "${ac_id}", customer_id: "${cust_id}", base_price_cents: 12345673, daily_penalty_rate_cents: 150000, penalty_cap_pct: 0.10, contractual_delivery_date: "2026-09-01" }, as: ProgramManager, captures: { prog_id: $.data.id } }
            - { call: "POST /completion/hangar-bays", payload: { name: "BAY-1", daily_rate_cents: 85000 }, as: CenterAdmin, captures: { bay_id: $.data.id } }
            - { call: "POST /completion/hangar-slots", payload: { bay_id: "${bay_id}", program_id: "${prog_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: ProgramManager, captures: { slot_id: $.data.id } }
            - { call: "POST /completion/programs/${prog_id}/advance", payload: { to_phase: "BOOKED" }, as: ProgramManager }
            - { call: "POST /completion/hangar-slots/${slot_id}/activate", payload: {}, as: ProgramManager }
