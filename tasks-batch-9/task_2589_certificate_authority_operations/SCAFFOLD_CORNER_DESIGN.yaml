        distinguishing_aspect: "max_validity_days 0 is below the declared range 1..398 and max_dcv_reuse_count 51 is above 1..50; both are numeric-range failures (HTTP 422 ERR_VALUE_OUT_OF_RANGE), a different check from the enum rule at priority 6."
