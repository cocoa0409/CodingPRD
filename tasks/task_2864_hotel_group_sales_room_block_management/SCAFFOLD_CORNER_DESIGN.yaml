    distinguishing_aspect: |
      Sub-blocks are carved out of the master night by night, so two different rules apply: the requested stay_date must exist as a parent BlockNight (priority 20) and the requested rooms must fit inside the parent night's unallocated remainder (priority 30). The second rejection is the interesting one — it comes AFTER a successful 2-room carve-out, so the remainder is 2 and a 3-room request must fail even though the parent's rooms_allotted is 4. Every call carries a freshly read expected_parent_block_version so the failures cannot be mistaken for OCC conflicts.
