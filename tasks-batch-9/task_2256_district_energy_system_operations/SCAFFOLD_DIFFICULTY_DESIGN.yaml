  - rule_id: transitive_cascade
    instances:
      - name: fuel_suspension_derates_asset_reverts_plan_constrains_loop
        grounds:
          - state_machines.FuelSupplyContract.ACTIVE_to_SUSPENDED
          - state_machines.ProductionAsset.AVAILABLE_to_DERATED
          - state_machines.DispatchPlan.APPROVED_to_DRAFT
          - state_machines.NetworkLoop.NORMAL_to_CONSTRAINED
          - entities.ProductionAsset.fields.fuel_contract_id
          - entities.NetworkLoop.fields.posture
        distinguishing_aspect: |
          Depth-4 cascade originating from POST /district-energy/fuel-supply-contracts/{id}/status:
          the contract's move to SUSPENDED derates only the assets that reference it, the derating of
          C_CHP is what reverts the APPROVED DispatchPlan on that asset's loop to DRAFT, and the
          plan's reversion is what moves NetworkLoop.posture from NORMAL to CONSTRAINED — each hop
          is caused by the previous hop, and the untouched sibling assets C_BIO and C_OIL prove the
          first hop is not a fan-out over all assets on the loop.
