              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "Offered for sale at a premium.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
          trigger:
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-9044" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { fee_id: "$.data.id", fee_recorded_at: "$.data.recorded_at" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { paid_after_fee: "$.data.paid_cents", cpl_paid_after_fee: "$.data.complainant_paid_cents", resp_paid_after_fee: "$.data.respondent_paid_cents" }
            - call: "POST /udrp/cases/${case_id}/compliance-clearance"
              payload: { reviewer_notes: "Complete." }
              as: CaseManager
              as_user_id: "cm-002"
              captures: { status_in_clearance_response: "$.data.status", cleared_by: "$.data.compliance_cleared_by_user_id" }
            - call: "GET /udrp/cases/${case_id}/registrar-verifications"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ver_id: "$.data[0].id", ver_status_immediately: "$.data[0].status", ver_requested_at: "$.data[0].requested_at" }
            - call: "POST /udrp/cases/${case_id}/registrar-verifications/${ver_id}/response"
              payload: { lock_applied: true, verified_registrant_name: "Immediate Underlying Holder", verified_registrant_email: "registrant@immediate.example" }
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { ver_status_in_write: "$.data.status" }
            - call: "GET /udrp/domains/${dom_id}"
              payload: {}
              as: RegistrarAgent
              as_user_id: "${reg_id}"
              captures: { dom_lock_immediately: "$.data.lock_status", dom_locked_at: "$.data.locked_at" }
            - call: "POST /udrp/cases/${case_id}/notifications"
              payload: { channel: "EMAIL", address: "registrant@immediate.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notif_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/notifications/${notif_id}/delivery"
              payload: { outcome: "DELIVERED", deemed_received_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { notif_status_in_write: "$.data.status" }
            - call: "POST /udrp/cases/${case_id}/responses"
              payload: { respondent_email: "registrant@immediate.example", content_summary: "The registrant denies the allegations.", requests_three_member_panel: false }
              as: Respondent
              as_user_id: "resp-001"
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cv1: "$.data.version", pool_before_seat: "$.data.honoraria_pool_cents" }
            - call: "POST /udrp/cases/${case_id}/appointments"
              payload: { seat: "SOLE", nominated_by: "PROVIDER", expected_case_version: "${cv1}", panelist_id: "${pan_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { apt_id: "$.data.id", apt_due: "$.data.decision_due_at", apt_score_before: "$.data.conflict_score", apt_honoraria_before: "$.data.honoraria_cents" }
            - call: "POST /udrp/appointments/${apt_id}/conflict-screening"
              payload: { disclosed_prior_representation: false, disclosed_same_firm: false, disclosed_financial_interest: false, prior_appointments_with_complainant: 0 }
              as: Panelist
              as_user_id: "${pan_id}"
              captures: { scr_status: "$.data.status", scr_score: "$.data.conflict_score", scr_honoraria: "$.data.honoraria_cents", scr_accepted_at: "$.data.accepted_at" }
            - call: "GET /udrp/appointments/${apt_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { reread_status: "$.data.status", reread_score: "$.data.conflict_score", reread_honoraria: "$.data.honoraria_cents", reread_accepted_at: "$.data.accepted_at" }
            - call: "GET /udrp/panelists/${pan_id}"
              payload: {}
              as: ProviderAdmin
              captures: { load_immediately: "$.data.active_case_load" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_status_immediately: "$.data.status" }
          assert:
            - "The case is created with paid_cents 0 and honoraria_pool_cents 105000, both already computed at filing"
            - "The read taken immediately after the single ledger line shows paid_cents 150000, complainant_paid_cents 150000 and respondent_paid_cents 0 - the reconciliation ran inside the write, not afterwards"
            - "The clearance response itself carries status VERIFICATION_PENDING and compliance_cleared_by_user_id cm-002, and the verification row it silently created is already visible and REQUESTED on the very next read"
            - "The verification response body carries status RESPONDED, and the immediately following domain read already shows lock_status LOCKED with locked_at 2026-08-01T00:00:00Z"
            - "The nomination response already carries decision_due_at, with conflict_score null and honoraria_cents 0 because nothing has been screened yet"
            - "The screening response itself carries status ACCEPTED, conflict_score 0.00, honoraria_cents 105000 and accepted_at 2026-08-01T00:00:00Z - all three derived values settled in one write"
            - "The independent re-read of the appointment returns byte-for-byte the same status, conflict_score, honoraria_cents and accepted_at as the screening response returned"
            - "Panelist.${pan_id}.active_case_load is already 1 and Case.${case_id}.status is already PANEL_CONSTITUTED on reads taken immediately after the screening, even though neither row appeared in the screening response"
