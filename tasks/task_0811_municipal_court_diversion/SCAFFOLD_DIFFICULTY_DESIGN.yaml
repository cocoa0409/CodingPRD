scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_provisional_vs_final_on_ledger_account
        grounds:
          - calculations.fine_assessment
          - entities.LedgerAccount.fields.assessed_amount
          - state_machines.LedgerAccount.PROVISIONAL_to_ASSESSED
        distinguishing_aspect: "Identical single MISDEMEANOR $200 charge yields provisional assessed_amount 310.00 (no severity multiplier, no program_fee) but final 540.00 (x1.5 multiplier + $100 program_fee) on the LedgerAccount money domain."
        test_recipe:
          setup:
            - "Defendant, docketed Case with one MISDEMEANOR charge base_fine_amount 200, arraigned with a GUILTY plea so the provisional LedgerAccount exists (assessed_amount 310.00, status PROVISIONAL)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Ada Prov", date_of_birth: "1990-01-01", email: "ada@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1001", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room A", room_code: "A", changeover_buffer_minutes: 15 }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T10:00:00Z", scheduled_end: "2026-03-05T10:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: CourtClerk
              captures: { acct_id: "$.data[0].id", prov_amt: "$.data[0].assessed_amount" }
          trigger:
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 10, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
          assert:
            - "captured prov_amt == 310.00"
            - "LedgerAccount.${acct_id}.assessed_amount == 540.00"
            - "LedgerAccount.${acct_id}.status == ASSESSED"
            - "540.00 != 310.00 (same charge; final applies x1.5 severity multiplier and adds program_fee)"

      - name: compliance_provisional_vs_final_on_diversion_agreement
        grounds:
          - calculations.compliance_percentage
          - entities.DiversionAgreement.fields.provisional_compliance_pct
          - entities.DiversionAgreement.fields.final_compliance_pct
        distinguishing_aspect: "With 10 of 10 hours logged on an unverified (IN_PROGRESS) assignment, provisional_compliance_pct == 50.00 while final_compliance_pct == 0.00 on the DiversionAgreement domain (distinct from the LedgerAccount assessment dual-variant)."
        test_recipe:
          setup:
            - "Granted+accepted diversion (mandated_service_hours 10, required_class_sessions 0, program_fee 100, assessed 540 unpaid); a COMMUNITY_SERVICE assignment with 10 required hours has 10 hours logged but is not yet verified (status IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Bo Comp", date_of_birth: "1991-02-02", email: "bo@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1002", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room B", room_code: "B" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T11:00:00Z", scheduled_end: "2026-03-05T11:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 10, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /service-sites"
              payload: { name: "Park Cleanup", site_type: "COMMUNITY_SERVICE", concurrent_capacity: 5 }
              as: CourtAdmin
              captures: { site_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/service-assignments"
              payload: { service_site_id: "${site_id}", assignment_type: "COMMUNITY_SERVICE", required_hours: 10, session_start: "2026-03-10T09:00:00Z", session_end: "2026-03-10T19:00:00Z" }
              as: ProbationOfficer
              as_user_id: "po_1"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /service-assignments/${sa_id}/progress"
              payload: { hours_logged: 10 }
              as: ProbationOfficer
              as_user_id: "po_1"
          assert:
            - "DiversionAgreement.${div_id}.provisional_compliance_pct == 50.00"
            - "DiversionAgreement.${div_id}.final_compliance_pct == 0.00"
            - "50.00 != 0.00 (provisional counts IN_PROGRESS logged hours; final counts only COMPLETED-verified hours)"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessment_tiered_surcharge_with_cap
        grounds:
          - calculations.fine_assessment
          - entities.LedgerAccount.fields.assessed_amount
        distinguishing_aspect: "Mode (a) nested min/tier: final subtotal 600 selects the 0.35 tier, computes 0.35*600=210, then the SURCHARGE_CAP min() clips surcharge to 150.00, giving assessed 900.00 = 600 + 50 court fee + 150 capped surcharge + 100 program_fee."
        test_recipe:
          setup:
            - "Docketed Case with one MISDEMEANOR charge base_fine_amount 400 (final subtotal 600 after x1.5), arraigned GUILTY."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Cy Cap", date_of_birth: "1992-03-03", email: "cy@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1003", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-22", severity: "MISDEMEANOR", base_fine_amount: 400, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room C", room_code: "C" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T12:00:00Z", scheduled_end: "2026-03-05T12:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: CourtClerk
              captures: { acct_id: "$.data[0].id" }
          trigger:
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
          assert:
            - "LedgerAccount.${acct_id}.assessed_amount == 900.00"
            - "surcharge component == 150.00 (uncapped 0.35*600 = 210.00 clipped by SURCHARGE_CAP)"

      - name: installment_rounding_last_absorbs_remainder
        grounds:
          - calculations.installment_schedule
          - entities.InstallmentPlan.fields.installment_amount
          - entities.InstallmentPlan.fields.final_installment_amount
        distinguishing_aspect: "Mode (b) pinned rounding order: balance 540.00 over 7 installments floors each to 77.14 and lets the FINAL installment absorb the 0.02 remainder (77.16), so 6*77.14 + 77.16 == 540.00 exactly — differs from round-half-up per installment."
        test_recipe:
          setup:
            - "Granted diversion with final assessed 540.00 and no payments, so LedgerAccount.balance == 540.00 (>= INSTALLMENT_MIN_BALANCE)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Di Round", date_of_birth: "1993-04-04", email: "di@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1004", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room D", room_code: "D" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T13:00:00Z", scheduled_end: "2026-03-05T13:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 0, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: CourtClerk
              captures: { acct_id: "$.data[0].id" }
            - call: "GET /ledger-accounts/${acct_id}"
              payload: {}
              as: Cashier
              captures: { acct_v: $.data.version }
          trigger:
            - call: "POST /ledger-accounts/${acct_id}/installment-plans"
              payload: { num_installments: 7, expected_ledger_account_version: "${acct_v}" }
              as: Cashier
              captures: { plan_id: $.data.id }
          assert:
            - "InstallmentPlan.${plan_id}.installment_amount == 77.14"
            - "InstallmentPlan.${plan_id}.final_installment_amount == 77.16"
            - "6 * 77.14 + 77.16 == 540.00"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_failed_to_comply_reinstated_cycle
        grounds:
          - state_machines.Case.DIVERSION_GRANTED_to_FAILED_TO_COMPLY
          - state_machines.Case.FAILED_TO_COMPLY_to_DIVERSION_GRANTED
        distinguishing_aspect: "Case traverses DIVERSION_GRANTED -> FAILED_TO_COMPLY -> DIVERSION_GRANTED (a genuine A->B->A cycle); after reinstate Case.status is DIVERSION_GRANTED again and the Warrant is RECALLED."
        test_recipe:
          setup:
            - "Granted+accepted diversion (program_deadline 2026-06-01); an amnesty window [2026-06-01, 2026-08-01) exists; clock advanced to 2026-07-01 and a warrant issued so Case is FAILED_TO_COMPLY with an ISSUED warrant."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Ed Cycle", date_of_birth: "1994-05-05", email: "ed@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1005", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room E", room_code: "E" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T14:00:00Z", scheduled_end: "2026-03-05T14:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 10, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /amnesty-programs"
              payload: { name: "Summer 2026", penalty_waiver_pct: 0.5, reinstatement_fee: 40, active_from: "2026-06-01T00:00:00Z", active_to: "2026-08-01T00:00:00Z" }
              as: CourtAdmin
              captures: { amn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /cases/${case_id}/warrant"
              payload: {}
              as: Judge
              captures: { warrant_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/reinstate"
              payload: { amnesty_program_id: "${amn_id}" }
              as: Judge
          assert:
            - "Case.${case_id}.status == DIVERSION_GRANTED"
            - "Warrant.${warrant_id}.status == RECALLED"
            - "DiversionAgreement.${div_id}.status == IN_PROGRESS"

      - name: installment_plan_delinquent_reinstated_cycle
        grounds:
          - state_machines.InstallmentPlan.ACTIVE_to_DELINQUENT
          - state_machines.InstallmentPlan.DELINQUENT_to_ACTIVE
        distinguishing_aspect: "InstallmentPlan traverses ACTIVE -> DELINQUENT (warrant cascade) -> ACTIVE (reinstate cascade) — an A->B->A cycle on the InstallmentPlan entity, distinct from the Case cycle."
        test_recipe:
          setup:
            - "Granted+accepted diversion with an ACTIVE installment plan (balance 540); amnesty [2026-06-01,2026-08-01); clock advanced to 2026-07-01 and a warrant issued so the plan is DELINQUENT."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Fi Plan", date_of_birth: "1995-06-06", email: "fi@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1006", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room F", room_code: "F" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T15:00:00Z", scheduled_end: "2026-03-05T15:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 10, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: Cashier
              captures: { acct_id: "$.data[0].id", acct_v: "$.data[0].version" }
            - call: "POST /ledger-accounts/${acct_id}/installment-plans"
              payload: { num_installments: 6, expected_ledger_account_version: "${acct_v}" }
              as: Cashier
              captures: { plan_id: $.data.id }
            - call: "POST /amnesty-programs"
              payload: { name: "Summer 2026", penalty_waiver_pct: 0.5, reinstatement_fee: 40, active_from: "2026-06-01T00:00:00Z", active_to: "2026-08-01T00:00:00Z" }
              as: CourtAdmin
              captures: { amn_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: CourtAdmin
            - call: "POST /cases/${case_id}/warrant"
              payload: {}
              as: Judge
          trigger:
            - call: "POST /cases/${case_id}/reinstate"
              payload: { amnesty_program_id: "${amn_id}" }
              as: Judge
          assert:
            - "InstallmentPlan.${plan_id}.status == ACTIVE"
            - "InstallmentPlan.${plan_id} was DELINQUENT immediately after the warrant issued"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: verify_completion_cascade_to_expungement_referral
        grounds:
          - state_machines.ServiceAssignment.IN_PROGRESS_to_COMPLETED
          - state_machines.DiversionAgreement.IN_PROGRESS_to_COMPLETED
          - state_machines.Case.DIVERSION_GRANTED_to_COMPLIED
          - entities.ExpungementReferral.fields.status
        distinguishing_aspect: "Depth-4 chain from a single verify-completion: assignment->COMPLETED causes DiversionAgreement->COMPLETED, which causes Case->COMPLIED, which causes a PENDING ExpungementReferral to be created — each link caused by the previous."
        test_recipe:
          setup:
            - "Granted+accepted diversion (mandated_service_hours 10, required_class_sessions 0); ledger fully paid (540, status SETTLED); one COMMUNITY_SERVICE assignment with 10 required hours has 10 hours logged (IN_PROGRESS), created by officer po_1."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Gil Done", date_of_birth: "1996-07-07", email: "gil@x.com" }
              as: CourtClerk
              captures: { def_id: $.data.id }
            - call: "POST /cases"
              payload: { defendant_id: "${def_id}", citation_number: "C-1007", offense_date: "2026-03-01" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/charges"
              payload: { offense_code: "MC-14", severity: "MISDEMEANOR", base_fine_amount: 200, is_diversion_eligible: true }
              as: CourtClerk
            - call: "POST /courtrooms"
              payload: { name: "Room G", room_code: "G" }
              as: CourtAdmin
              captures: { room_id: $.data.id }
            - call: "POST /cases/${case_id}/arraignments"
              payload: { courtroom_id: "${room_id}", scheduled_start: "2026-03-05T16:00:00Z", scheduled_end: "2026-03-05T16:30:00Z" }
              as: CourtClerk
              captures: { arr_id: $.data.id }
            - call: "POST /arraignments/${arr_id}/plea"
              payload: { plea: "GUILTY" }
              as: Defendant
              as_user_id: "${def_id}"
            - call: "POST /cases/${case_id}/diversion-agreements"
              payload: { mandated_service_hours: 10, required_class_sessions: 0, program_fee: 100, program_deadline: "2026-06-01T00:00:00Z" }
              as: Judge
              captures: { div_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/accept"
              payload: {}
              as: Defendant
              as_user_id: "${def_id}"
            - call: "GET /cases/${case_id}/ledger-account"
              payload: {}
              as: Cashier
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /ledger-accounts/${acct_id}/payments"
              payload: { amount: 540.00 }
              as: Cashier
            - call: "POST /service-sites"
              payload: { name: "Shelter", site_type: "COMMUNITY_SERVICE", concurrent_capacity: 5 }
              as: CourtAdmin
              captures: { site_id: $.data.id }
            - call: "POST /diversion-agreements/${div_id}/service-assignments"
              payload: { service_site_id: "${site_id}", assignment_type: "COMMUNITY_SERVICE", required_hours: 10, session_start: "2026-03-10T09:00:00Z", session_end: "2026-03-10T19:00:00Z" }
              as: ProbationOfficer
              as_user_id: "po_1"
              captures: { sa_id: $.data.id }
            - call: "POST /service-assignments/${sa_id}/progress"
              payload: { hours_logged: 10 }
              as: ProbationOfficer
              as_user_id: "po_1"
          trigger:
            - call: "POST /service-assignments/${sa_id}/verify-completion"
              payload: {}
              as: ProbationOfficer
              as_user_id: "po_2"
          assert:
            - "ServiceAssignment.${sa_id}.status == COMPLETED"
            - "DiversionAgreement.${div_id}.status == COMPLETED"
            - "Case.${case_id}.status == COMPLIED"
            - "GET /cases/${case_id}/expungement-referrals returns exactly one ExpungementReferral with status PENDING"

      - name: warrant_cascade_to_diversion_default
        grounds:
          - state_machines.Case.DIVERSION_GRANTED_to_FAILED_TO_COMPLY
          - state_machines.DiversionAgreement.IN_PROGRESS_to_DEFAULTED
          - entities.Warrant.fields.status
        distinguishing_aspect: "Depth-3 chain from a distinct trigger (POST /cases/{id}/warrant): Case->FAILED_TO_COMPLY causes DiversionAgreement->DEFAULTED, which causes a Warrant to be created ISSUED — a different origin than the verify-completion cascade."
        test_recipe:
          setup:
            - "Granted+accepted diversion (program_deadline 2026-06-01); clock advanced to 2026-07-01 (past deadline)."
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Hal Fail", date_of_birth: "1997-08-08", email: "hal@x.com" }
              as: CourtClerk
