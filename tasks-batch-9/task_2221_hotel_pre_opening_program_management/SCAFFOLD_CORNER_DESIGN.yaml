              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 20, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_a: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "MEP_ROUGH_IN", name: "MEP rough-in", duration_days: 15, planned_start_date: "2026-09-02" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_b: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "INTERIOR_FIT_OUT", name: "Interior fit-out", duration_days: 10, planned_start_date: "2026-09-25" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_c: "$.data.id" }
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_a}", successor_milestone_id: "${ms_c}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_b}", successor_milestone_id: "${ms_c}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /pre-opening/programs/${prog_id}/baseline-schedule"
