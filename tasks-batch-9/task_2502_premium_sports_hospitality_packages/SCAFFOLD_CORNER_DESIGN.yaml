            - { call: "POST /package-components", payload: { package_product_id: "${pkg2}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg2}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg2_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg2}/publish", payload: { expected_package_product_version: "${pkg2_v}" }, as: CommercialDirector, as_user_id: u_director }
