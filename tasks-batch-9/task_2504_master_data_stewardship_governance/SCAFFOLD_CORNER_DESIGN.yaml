              as: GovernanceAdmin
              captures: { ok_status: $.data.status, ok_clearance: $.data.clearance_level }
          assert:
            - "setup: ${dom_sensitive} == true (CONFIDENTIAL is inside the sensitive set)"
            - "first trigger -> HTTP 403 and ${err} == ERR_CLEARANCE_INSUFFICIENT"
            - "second trigger -> HTTP 201, ${ok_status} == ACTIVE, ${ok_clearance} == RESTRICTED - rank 4 >= rank 3 passes"

