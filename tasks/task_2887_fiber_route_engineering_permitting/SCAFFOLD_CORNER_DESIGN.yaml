            - "Route.${route_id}.version == ${rv_fresh} plus 1 after the accepted create"

      - name: route_version_increments_once_per_accepted_write
        claim_type: optimistic_concurrency
        grounds:
          - endpoints[POST /segments]
          - endpoints[POST /routes/{id}/lock-scope]
          - endpoints[POST /segments/{id}/construction-method]
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: "Four consecutive accepted writes each move Route.version by exactly 1 — creation, segment add, budget adjustment, lock-scope, method selection — so the OCC token is a per-write counter and not a timestamp or a hash of the row."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' freshly created in PLANNING"
          setup_api_calls:
