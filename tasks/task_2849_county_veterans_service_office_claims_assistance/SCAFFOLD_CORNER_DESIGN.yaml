# =====================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2849_county_veterans_service_office_claims_assistance
#
# Walked row-by-row against references/claim-extraction-guide.md.
# `section:` values are the guide's nine section names verbatim;
# `claim_type:` values are the snake_case forms of that section's
# per-table row labels. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance carry an
# `excluded_because:` stub and no test_recipe.
#
# Logical clock default: 2026-08-01T00:00:00Z.
# =====================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_representative_creation_returns_declared_fields_with_pending_accreditation
        claim_type: creation
        grounds:
          - entities.Representative
          - endpoints[POST /cvso/representatives]
        distinguishing_aspect: "A newly created Representative is returned with accreditation_status PENDING, ce_credits_earned 0, active_poa_count 0, caseload_weight 0.0 and version 1 — every system and computed field carries its §1.1 default rather than being absent."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-301", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep: $.data.id, st: $.data.accreditation_status }
          assert:
            - "HTTP status == 201"
            - "${st} == PENDING"
            - "Representative.${rep}.ce_credits_earned == 0"
            - "Representative.${rep}.active_poa_count == 0"
            - "Representative.${rep}.caseload_weight == 0.0"
            - "Representative.${rep}.revocation_reason == null"
            - "Representative.${rep}.version == 1"
            - "response body carries meta.api_request_id and response_type == object"

      - name: corner_veteran_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Veteran
          - endpoints[GET /cvso/veterans/{id}]
        distinguishing_aspect: "GET /cvso/veterans/{id} returns exactly the row created, including the system-assigned county_case_number and the computed defaults discharge_doc_status NOT_SUBMITTED, wartime_service_days 0, combined_rating_pct 0 and priority_group P4 before any screen has been taken."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "One Veteran created and nothing else done to it."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
          trigger:
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { got: $.data.id, intake: $.data.intake_status, pg: $.data.priority_group }
          assert:
            - "HTTP status == 200"
            - "${got} == ${vet}"
            - "${intake} == INTAKE_STARTED"
            - "${pg} == P4"
            - "Veteran.${vet}.discharge_doc_status == NOT_SUBMITTED"
            - "Veteran.${vet}.wartime_service_days == 0"
            - "Veteran.${vet}.combined_rating_pct == 0"
            - "Veteran.${vet}.county_case_number is a non-null server-assigned string"

      - name: corner_representative_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cvso/representatives]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three Representative rows and limit 2 offset 0 the collection GET returns 2 rows, total_count 3 and has_more true; the same call at offset 2 returns 1 row and has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "Exactly three Representative rows, created in the order ACC-2849-311, ACC-2849-312, ACC-2849-313."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-311", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Ingrid Osei", accreditation_number: "ACC-2849-312", accreditation_type: "VSO_ORG", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Marcus Vale", accreditation_number: "ACC-2849-313", accreditation_type: "ATTORNEY", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
          trigger:
            - call: "GET /cvso/representatives"
              payload: { limit: 2, offset: 0 }
              as: SystemAdmin
              captures: { page1_total: $.pagination.total_count, page1_more: $.pagination.has_more }
            - call: "GET /cvso/representatives"
              payload: { limit: 2, offset: 2 }
              as: SystemAdmin
              captures: { page2_total: $.pagination.total_count, page2_more: $.pagination.has_more }
          assert:
            - "HTTP status of both trigger calls == 200"
            - "the first trigger call returns exactly 2 Representative rows"
            - "${page1_total} == 3"
            - "${page1_more} == true"
            - "the second trigger call returns exactly 1 Representative row"
            - "${page2_total} == 3"
            - "${page2_more} == false"
            - "response_type == array on both calls"

      - name: corner_get_veteran_with_unknown_id_returns_veteran_not_found
        claim_type: not_found
        grounds:
          - validations[priority=31]
          - errors[ERR_VETERAN_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unused UUID in the {id} segment of GET /cvso/veterans/{id} yields the entity-specific ERR_VETERAN_NOT_FOUND with HTTP 404, not the generic ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z and no Veteran rows at all."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /cvso/veterans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VETERAN_NOT_FOUND"
            - "HTTP status == 404"
            - "response_type == error and data.message is a non-empty string"

      - name: corner_veteran_creation_missing_required_service_start_date_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=10]
          - errors[ERR_VALIDATION]
          - endpoints[POST /cvso/veterans]
        distinguishing_aspect: "service_start_date is declared in the endpoint's input list without a default, so omitting it returns ERR_VALIDATION (422) and no Veteran row is created."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, no Veteran rows."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status == 422"
            - "zero Veteran rows exist after the trigger"

      - name: corner_exam_site_buffer_minutes_defaults_to_zero_when_omitted
        claim_type: defaults
        grounds:
          - entities.ExamSite.buffer_minutes
          - endpoints[POST /cvso/exam-sites]
        distinguishing_aspect: "buffer_minutes is optional on POST /cvso/exam-sites and its §1.1 default is 0, so a site created without it reserves no turnaround time and booked_slot_count starts at 0."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/exam-sites"
              payload: { name: "Riverside Exam Annex", county_code: "CVSO1", concurrent_capacity: 3 }
              as: SystemAdmin
              captures: { site: $.data.id, buf: $.data.buffer_minutes }
          assert:
            - "HTTP status == 201"
            - "${buf} == 0"
            - "ExamSite.${site}.booked_slot_count == 0"
            - "ExamSite.${site}.concurrent_capacity == 3"

      - name: corner_veteran_priority_group_supplied_in_the_write_body_is_rejected
        claim_type: computed_fields
        grounds:
          - validations[priority=21]
          - errors[ERR_READONLY_FIELD]
          - calculations.veteran_priority_group
        distinguishing_aspect: "priority_group has §1.1 source computed, so supplying it on POST /cvso/veterans returns ERR_READONLY_FIELD (422); the same request without it succeeds and the screen later derives P3 from dependent_count 2 and household_income_cents 1500000 against an income limit of 2850000."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO so the follow-up screen can be taken."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-321", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN", priority_group: "P1" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { pg: $.data.priority_group_assigned, limit_applied: $.data.income_limit_applied_cents }
          assert:
            - "${err} == ERR_READONLY_FIELD"
            - "HTTP status of the first trigger call == 422"
            - "exactly one Veteran row exists after all trigger calls"
            - "${limit_applied} == 2850000"
            - "${pg} == P3"
            - "Veteran.${vet}.priority_group == P3"

      - name: corner_claim_system_fields_supplied_in_the_write_body_are_rejected
        claim_type: system_fields
        grounds:
          - validations[priority=21]
          - errors[ERR_READONLY_FIELD]
          - entities.Claim.status
        distinguishing_aspect: "Claim.status has §1.1 source system, so a POST /cvso/claims body that pre-sets status FILED returns ERR_READONLY_FIELD (422) rather than creating a claim that skips the state machine."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet with discharge VERIFIED and an ACTIVE PowerOfAttorney poa designating rep_a."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-331", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/powers-of-attorney"
              payload: { veteran_id: "${vet}", representative_id: "${rep_a}", form_type: "VA_21_22", scope: "ALL_BENEFITS", executed_on: "2026-08-01" }
              as: IntakeClerk
              captures: { poa: $.data.id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { vet_v: $.data.version }
            - call: "POST /cvso/powers-of-attorney/${poa}/accept"
              payload: { expected_veteran_version: "${vet_v}" }
              as: VeteranClient
              as_user_id: "${vet}"
          trigger:
            - call: "POST /cvso/claims"
              payload: { veteran_id: "${vet}", poa_id: "${poa}", claim_type: "DISABILITY_COMPENSATION", claimed_conditions: ["tinnitus"], status: "FILED" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_READONLY_FIELD"
            - "HTTP status == 422"
            - "zero Claim rows exist after the trigger"

      - name: corner_veteran_creation_with_unknown_homeless_status_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=11]
          - validations[priority=14]
          - errors[ERR_VALIDATION]
          - entities.Veteran.homeless_status
        distinguishing_aspect: "homeless_status is an enum whose §1.1 set does not contain COUCH_SURFING, so the create is refused with ERR_VALIDATION (422); the same body with dependent_count 13 is refused by the 0..12 range rule with the same error id."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, no Veteran rows."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "COUCH_SURFING", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { enum_err: $.data.error_id }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 13, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { range_err: $.data.error_id }
          assert:
            - "${enum_err} == ERR_VALIDATION"
            - "${range_err} == ERR_VALIDATION"
            - "HTTP status of both trigger calls == 422"
            - "zero Veteran rows exist after both trigger calls"

      - name: corner_eligibility_screen_is_immutable_and_exposes_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.EligibilityScreen
          - endpoints[GET /cvso/veterans/{id}/eligibility-screens]
          - calculations.eligibility_category_results
        distinguishing_aspect: "EligibilityScreen is declared common_fields false: §1.5 offers no PATCH and no version field, and a re-screen after a PATCH to household_income_cents appends a second immutable row with screen_sequence 2 while the first row's frozen numbers stay unchanged."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet with discharge VERIFIED, dependent_count 2 and household_income_cents 1500000, screened once so screen_sequence 1 exists with income_limit_applied_cents 2850000 and priority_group_assigned P3."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-341", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { screen1: $.data.id, seq1: $.data.screen_sequence }
            - call: "PATCH /cvso/veterans/${vet}"
              payload: { household_income_cents: 4000000 }
              as: IntakeClerk
          trigger:
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { screen2: $.data.id, seq2: $.data.screen_sequence, pg2: $.data.priority_group_assigned }
            - call: "GET /cvso/veterans/${vet}/eligibility-screens"
              payload: { limit: 10, offset: 0 }
              as: IntakeClerk
              captures: { screens_total: $.pagination.total_count }
          assert:
            - "${seq1} == 1"
            - "${seq2} == 2"
            - "${screen2} != ${screen1}"
            - "${screens_total} == 2"
            - "EligibilityScreen.${screen1}.income_limit_applied_cents == 2850000"
            - "EligibilityScreen.${screen1}.priority_group_assigned == P3"
            - "${pg2} == P4"
            - "EligibilityScreen rows expose no version field and §1.5 declares no PATCH /cvso/veterans/{id}/eligibility-screens/{id}"

      - name: corner_discharge_document_creation_under_unknown_veteran_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=31]
          - errors[ERR_VETERAN_NOT_FOUND]
          - endpoints[POST /cvso/veterans/{id}/discharge-documents]
        distinguishing_aspect: "The nested create route resolves its {id} segment before any body validation, so posting a discharge document under an unused veteran UUID returns ERR_VETERAN_NOT_FOUND (404) and creates nothing."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, no Veteran rows."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /cvso/veterans/00000000-0000-0000-0000-0000000000ff/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "2001-09-11", claimed_service_end: "2005-09-10", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VETERAN_NOT_FOUND"
            - "HTTP status == 404"
            - "zero DischargeDocument rows exist after the trigger"

      - name: corner_claim_rejects_a_designation_belonging_to_another_veteran
        claim_type: flat
        grounds:
          - validations[priority=60]
          - errors[ERR_POA_VETERAN_MISMATCH]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so cross-reference integrity is enforced by body-level foreign keys: a claim naming vet_a with a poa_id whose PowerOfAttorney.veteran_id is vet_b is refused with ERR_POA_VETERAN_MISMATCH (409) even though both ids resolve to existing rows."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "Veteran vet_a and Veteran vet_b, both with discharge VERIFIED."
            - "ACTIVE PowerOfAttorney poa_b belonging to vet_b and designating rep_a."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-351", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
