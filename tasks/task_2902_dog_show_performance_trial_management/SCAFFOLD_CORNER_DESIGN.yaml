# =============================================================================
# SCAFFOLD Corner Design (SKILL.md 1.9) - Dog Show & Performance Trial Management
# Breadth probe over 1.1-1.7. Sections and claim_type values are taken verbatim
# from references/claim-extraction-guide.md; corners already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: show_creation_returns_draft_with_zeroed_ledger_counters
        claim_type: creation
        grounds:
          - entities.Show.fields.status
          - entities.Show.fields.armband_high_water
          - entities.Show.fields.fee_collected_cents
          - endpoints[POST /dog-shows/shows]
        distinguishing_aspect: "Show creation is the only entity create that must return a fully zeroed money/points ledger: every computed counter is 0 and current_advisory_level is null, not GREEN."
        test_recipe:
          setup:
            - "Club NSKC exists with annual_event_allowance 2; the logical clock reads 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE", annual_event_allowance: 2 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "CONFORMATION", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
          assert:
            - "HTTP 201 and response_type == object"
            - "Show.status == DRAFT"
            - "Show.revision_count == 0 and Show.armband_high_water == 0"
            - "Show.fee_charged_cents == 0, Show.fee_refunded_cents == 0, Show.fee_retained_cents == 0, Show.fee_collected_cents == 0, Show.levy_total_cents == 0"
            - "Show.confirmed_entry_count == 0, Show.points_awarded_total == 0, Show.temperature_reading_count == 0"
            - "Show.current_advisory_level == null and Show.current_heat_index_c == null"
            - "Show.club_id == ${club_id} and Show.championship_points_scale == SCALE_A"
      - name: judge_retrieval_exposes_version_for_occ_pinning
        claim_type: retrieval
        grounds:
          - entities.Judge.fields.confirmed_slot_count
          - endpoints[GET /dog-shows/judges/{id}]
          - concurrency_rules.panel-slot-propose-stale-judge
        distinguishing_aspect: "The Judge read is the only channel that surfaces the version a panel-slot proposal must pin, so it must echo every stored licensing array unchanged alongside version."
        test_recipe:
          setup:
            - "Judge J-77 is licensed for the SPORTING group and OBEDIENCE with max_daily_dog_count 175."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/judges"
              payload: { judge_number: "J-77", full_name: "Rex Calder", approved_breed_group_codes: ["SPORTING"], approved_performance_disciplines: ["OBEDIENCE"], home_region_code: "NE", max_daily_dog_count: 175 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { j1_id: $.data.id, j1_v: $.data.version }
          trigger:
            - call: "GET /dog-shows/judges/${j1_id}"
              payload: {}
              as: ShowSecretary
          assert:
            - "HTTP 200 and response_type == object"
            - "Judge.judge_number == J-77 and Judge.full_name == Rex Calder"
            - "Judge.approved_breed_group_codes == [SPORTING] and Judge.approved_performance_disciplines == [OBEDIENCE]"
            - "Judge.max_daily_dog_count == 175 and Judge.status == ACTIVE"
            - "Judge.confirmed_slot_count == 0"
            - "Judge.version equals ${j1_v} captured from the create response"
      - name: entries_listing_filters_by_class_and_paginates
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints[GET /dog-shows/entries]
        distinguishing_aspect: "Filter and pagination must compose on one read: total_count counts the filtered population (3 of 4 entries) while the page returns only limit rows."
        test_recipe:
          setup:
            - "Show APPROVED with BREED classes B1 (3 RECEIVED entries) and B2 (1 RECEIVED entry for the same dog as e1)."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE", annual_event_allowance: 2 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
            - call: "POST /dog-shows/handlers"
              payload: { handler_name: "Ada Vance", member_number: "M-1001", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { h1_id: $.data.id }
            - call: "POST /dog-shows/judges"
              payload: { judge_number: "J-77", full_name: "Rex Calder", approved_breed_group_codes: ["SPORTING"], approved_performance_disciplines: ["OBEDIENCE"], home_region_code: "NE", max_daily_dog_count: 175 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { j1_id: $.data.id, j1_v: $.data.version }
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "CONFORMATION", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { show_id: $.data.id }
            - call: "POST /dog-shows/shows/${show_id}/submit"
              payload: {}
              as: ClubOfficer
              as_user_id: "${club_id}"
            - call: "POST /dog-shows/shows/${show_id}/approve"
              payload: {}
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/panel-slots"
              payload: { show_id: "${show_id}", judge_id: "${j1_id}", panel_role: "BREED_JUDGE", expected_judge_version: "${j1_v}" }
              as: ShowSecretary
              captures: { slot1_id: $.data.id }
            - call: "POST /dog-shows/panel-slots/${slot1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Judge
              as_user_id: "${j1_id}"
            - call: "POST /dog-shows/classes"
              payload: { show_id: "${show_id}", class_code: "B1", class_level: "BREED", entry_limit: 10, breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING" }
              as: ShowSecretary
              captures: { c1_id: $.data.id }
            - call: "POST /dog-shows/classes/${c1_id}/assign-judge"
              payload: { slot_id: "${slot1_id}" }
              as: ShowSecretary
            - call: "POST /dog-shows/classes"
              payload: { show_id: "${show_id}", class_code: "B2", class_level: "BREED", entry_limit: 10, breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING" }
              as: ShowSecretary
              captures: { c2_id: $.data.id }
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0001", call_name: "Ripple", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0002", call_name: "Bramble", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0003", call_name: "Cinder", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d1_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d2_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d3_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e3_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c2_id}", dog_id: "${d1_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e4_id: $.data.id }
          trigger:
            - call: "GET /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", limit: 2, offset: 0 }
              as: ShowSecretary
          assert:
            - "HTTP 200 and response_type == array"
            - "total_count == 3 and has_more == true"
            - "exactly 2 Entry rows are returned and every returned row has class_id == ${c1_id}"
            - "the entry ${e4_id} of class ${c2_id} does not appear in the page"
            - "every returned row has entry_status == RECEIVED and armband_number == null"
      - name: show_get_with_unknown_id_returns_show_not_found
        claim_type: not_found
        grounds:
          - validations.priority_3
          - errors.ERR_SHOW_NOT_FOUND
          - endpoints[GET /dog-shows/shows/{id}]
        distinguishing_aspect: "Path-parameter existence is checked at priority 3, so an unknown show id resolves to ERR_SHOW_NOT_FOUND and never to a role or shape error."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
          trigger:
            - call: "GET /dog-shows/shows/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ShowSecretary
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and response_type == error"
            - "data.error_id == ERR_SHOW_NOT_FOUND"
      - name: show_creation_missing_required_show_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /dog-shows/shows]
        distinguishing_aspect: "show_type has source input with no default, so omitting it is a shape violation at priority 4 rather than a downstream state or referential error."
        test_recipe:
          setup:
            - "Club NSKC exists; the caller is its club officer."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "no Show row is persisted: GET /dog-shows/shows with club_id == ${club_id} still reports total_count == 0"
      - name: club_creation_omitting_optionals_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Club.fields.sanction_status
          - entities.Club.fields.annual_event_allowance
          - entities.Club.fields.sanction_note
          - endpoints[POST /dog-shows/clubs]
        distinguishing_aspect: "Club is the only entity whose three optional inputs all carry declared defaults, so omitting them must yield ACTIVE / 2 / null rather than nulls across the board."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
          trigger:
            - call: "POST /dog-shows/clubs"
              payload: { name: "Lakeshore Kennel Club", club_code: "LKSC", region_code: "MW" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
          assert:
            - "HTTP 201"
            - "Club.sanction_status == ACTIVE"
            - "Club.annual_event_allowance == 2"
            - "Club.sanction_note == null"
            - "Club.events_approved_count == 0"
      - name: dog_creation_extra_computed_points_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Dog.fields.championship_points_total
          - entities.Dog.fields.qualifying_leg_counts
          - entities.Dog.fields.title_codes
          - validations.priority_4
        distinguishing_aspect: "Dog carries four computed roll-up fields; priority 4 ignores unknown body fields, so a client-supplied championship_points_total is dropped and the row starts at zero."
        test_recipe:
          setup:
            - "Handler Ada Vance exists and is the caller."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/handlers"
              payload: { handler_name: "Ada Vance", member_number: "M-1001", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0001", call_name: "Ripple", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}", championship_points_total: 99 }
              as: Handler
              as_user_id: "${h1_id}"
          assert:
            - "HTTP 201 (the undeclared championship_points_total field is ignored, not rejected)"
            - "Dog.championship_points_total == 0 and Dog.majors_count == 0"
            - "Dog.qualifying_leg_counts == {AGILITY: 0, OBEDIENCE: 0, RALLY: 0}"
            - "Dog.title_codes == []"
            - "Dog.measurement_status == UNMEASURED and Dog.measured_height_cm == null"
      - name: show_creation_status_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Show.fields.status
          - entities.Show.fields.approved_by_user_id
          - validations.priority_4
          - endpoints[POST /dog-shows/shows]
        distinguishing_aspect: "Show.status has source system, so a client that posts status APPROVED still gets DRAFT and an unset approved_by_user_id."
        test_recipe:
          setup:
            - "Club NSKC exists; the caller is its club officer."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "CONFORMATION", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A", status: "APPROVED" }
              as: ClubOfficer
              as_user_id: "${club_id}"
          assert:
            - "HTTP 201"
            - "Show.status == DRAFT (the supplied APPROVED value is ignored)"
            - "Show.approved_by_user_id == null and Show.approval_decided_at == null"
            - "Show.submitted_at == null"
            - "Show.id is a server-minted identifier and created_at is populated"
      - name: show_creation_with_undeclared_show_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Show.fields.show_type
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "show_type is constrained to CONFORMATION | PERFORMANCE | COMBINED, so JUNIOR_SHOWMANSHIP is a priority-4 enum violation and not a 409 pairing error."
        test_recipe:
          setup:
            - "Club NSKC exists; the caller is its club officer."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
          trigger:
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "JUNIOR_SHOWMANSHIP", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"
      - name: performance_run_row_carries_no_version_or_update_surface
        claim_type: immutability
        grounds:
          - entities.PerformanceRun.common_fields
          - endpoints[GET /dog-shows/entries/{id}/performance-runs]
          - endpoints[POST /dog-shows/performance-runs]
        distinguishing_aspect: "PerformanceRun is the single common_fields false entity: its rows expose no version and no updated_at, and 1.5 declares no PUT, PATCH or DELETE for them."
        test_recipe:
          setup:
            - "Show IN_PROGRESS with OBEDIENCE class P1; entry e1 CHECKED_IN; one run recorded with obedience_deductions 12 (final_score 188.0)."
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE", annual_event_allowance: 2 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
            - call: "POST /dog-shows/handlers"
              payload: { handler_name: "Ada Vance", member_number: "M-1001", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { h1_id: $.data.id }
            - call: "POST /dog-shows/judges"
              payload: { judge_number: "J-77", full_name: "Rex Calder", approved_breed_group_codes: ["SPORTING"], approved_performance_disciplines: ["OBEDIENCE"], home_region_code: "NE", max_daily_dog_count: 175 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { j1_id: $.data.id, j1_v: $.data.version }
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "PERFORMANCE", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { show_id: $.data.id }
            - call: "POST /dog-shows/shows/${show_id}/submit"
              payload: {}
              as: ClubOfficer
              as_user_id: "${club_id}"
            - call: "POST /dog-shows/shows/${show_id}/approve"
              payload: {}
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/panel-slots"
              payload: { show_id: "${show_id}", judge_id: "${j1_id}", panel_role: "PERFORMANCE_JUDGE", expected_judge_version: "${j1_v}" }
              as: ShowSecretary
              captures: { slot1_id: $.data.id }
            - call: "POST /dog-shows/panel-slots/${slot1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Judge
              as_user_id: "${j1_id}"
            - call: "POST /dog-shows/classes"
              payload: { show_id: "${show_id}", class_code: "P1", class_level: "PERFORMANCE", entry_limit: 10, discipline: "OBEDIENCE" }
              as: ShowSecretary
              captures: { c1_id: $.data.id }
            - call: "POST /dog-shows/classes/${c1_id}/assign-judge"
              payload: { slot_id: "${slot1_id}" }
              as: ShowSecretary
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0001", call_name: "Ripple", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d1_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
