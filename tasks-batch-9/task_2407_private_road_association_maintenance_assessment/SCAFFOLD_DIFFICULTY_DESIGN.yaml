              as: BoardTreasurer
          assert:
            - "after m1's YES: counted_weight_total 1, yes_weight_total 1, no_weight_total 0, quorum_met false (1*10000 < 3*5000), and the ballot's weight_snapshot is 1"
            - "after m2's NO: counted_weight_total 2, yes 1, no 1, quorum_met true (2*10000 >= 15000)"
            - "after m1 revokes: ballot b1 is REVOKED with weight_snapshot still 1, counted_weight_total 1, yes 0, no 1, quorum_met false"
            - "after m1 re-casts YES as a new ballot b3: counted_weight_total 2, yes 1, no 1, quorum_met true, and b1 stays REVOKED rather than returning to CAST"
            - "after the lien on m2's 1315068 charge is effectuated: ballot b2 is VOIDED, counted_weight_total 1, yes 1, no 0 and quorum_met false"
            - "at every one of those five observation points yes_weight_total + no_weight_total + abstain_weight_total equals counted_weight_total exactly"
            - "at every observation point counted_weight_total equals the number of ballots whose status is CAST, since every PER_PARCEL weight_snapshot is 1"
            - "paying m2's charge in full releases the lien and returns m2 to GOOD_STANDING, but ballot b2 stays VOIDED and counted_weight_total stays 1 with quorum_met false: the void is not compensated"
            - "the proposal is still BALLOTING with eligible_weight_total 3 throughout: the snapshot never follows the membership churn"
            - "exactly three Ballot rows exist for the proposal: b1 REVOKED, b2 VOIDED and b3 CAST"
