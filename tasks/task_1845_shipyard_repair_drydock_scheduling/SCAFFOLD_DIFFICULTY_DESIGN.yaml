              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_a: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Weld doubler plate", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 2, quantity: 1, unit_price_cents: 10000, requires_hot_work: true, depends_on_ids: ["${w_a}"] }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { w_b: $.data.id }
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
