      - name: subscription_calendar_conserved_across_pause_resume
        grounds:
          - calculations.pause_accounting
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.next_service_date
        distinguishing_aspect: |
          Conserved quantity = subscription calendar (different quantity than gallons
          and vehicle slots): across each PAUSE/RESUME pair, the next_service_date shift
          equals the closed pause days exactly (21 days then 7 days; cumulative 28).
        test_recipe:
          setup:
            - "RETAIL customer; site; vehicle; subscription next_service_date 2026-08-20; clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "Retail SC", email: "rsc@x.com", customer_type: "RETAIL" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "SC", lot_size_sqft: 5000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "SC1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { veh_id: $.data.id } }
            - { call: "POST /fleet-wash/subscriptions", payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", cadence: "MONTHLY", next_service_date: "2026-08-20" }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 21 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "RESUME" }, as: Customer, as_user_id: "${cust_id}", captures: { nsd1: $.data.next_service_date, pauses1: $.data.pauses } }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "PAUSE", pause_days: 7 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-29T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/subscriptions/${sub_id}/events", payload: { event_type: "RESUME" }, as: Customer, as_user_id: "${cust_id}", captures: { nsd2: $.data.next_service_date } }
          assert:
            - "nsd1 == 2026-09-10 (2026-08-20 + 21 days; shift == closed pause days, no drift)"
            - "nsd2 == 2026-09-17 (2026-09-10 + 7 days)"
            - "Cumulative shift 28 days == 21 + 7 cumulative closed pause days (calendar conserved across two cycles)"
            - "Subscription.${sub_id}.paused_days_365d == 28 and pause_count_365d == 2"
