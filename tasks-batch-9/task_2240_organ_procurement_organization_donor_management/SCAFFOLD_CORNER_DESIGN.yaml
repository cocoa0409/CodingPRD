              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["IV_DRUG_USE_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "coord-1"
              captures: { score: $.data.risk_score, tier: $.data.risk_tier }
            - call: "POST /opo/eligibility-screenings/${scr_id}/serology-results"
              payload: { marker: "CMV_IGG", result: "POSITIVE", resulted_at: "2026-09-05T07:50:00Z" }
              as: SerologyLab
              captures: { benign_marker: $.data.absolute_contraindication_marker }
            - call: "GET /opo/eligibility-screenings/${scr_id}"
              payload: {}
              as: MedicalDirector
              captures: { contra_before: $.data.absolute_contraindication }
            - call: "POST /opo/eligibility-screenings/${scr_id}/serology-results"
              payload: { marker: "HIV_NAT", result: "POSITIVE", resulted_at: "2026-09-05T07:55:00Z", nat_confirmed: true }
              as: SerologyLab
              captures: { bad_marker: $.data.absolute_contraindication_marker }
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
            - call: "GET /opo/eligibility-screenings/${scr_id}"
              payload: {}
              as: MedicalDirector
              captures: { contra_after: $.data.absolute_contraindication, status_mid: $.data.status }
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "RULED_OUT", ruled_out_reason: "SEROLOGY_CONTRAINDICATION" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { final_status: $.data.status, final_reason: $.data.ruled_out_reason }
          assert:
            - "${score} == 6.50 and ${tier} == STANDARD"
            - "${benign_marker} == false with ${contra_before} == false: CMV is not an absolute marker"
            - "${bad_marker} == true and ${contra_after} == true"
            - "${error_id} == ERR_ABSOLUTE_CONTRAINDICATION with HTTP 422 and ${status_mid} == PENDING (no state move on the refused clearance)"
            - "${final_status} == RULED_OUT with ${final_reason} == SEROLOGY_CONTRAINDICATION and DeathReferral.${ref_id}.status == RULED_OUT"

