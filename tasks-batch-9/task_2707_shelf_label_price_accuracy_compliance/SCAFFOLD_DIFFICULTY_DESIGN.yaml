  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: label_print_blocked_by_owning_file_leaving_the_distributed_states
        grounds:
          - validations.priority_43_ERR_FILE_NOT_DISTRIBUTED
          - state_machines.LabelTask.print_status=NOT_PRINTED_to_print_status=PRINTED
          - state_machines.PriceChangeFile.PARTIALLY_EXECUTED_to_SUPERSEDED
          - endpoints.POST_/price-integrity/label-tasks/{id}/print
        distinguishing_aspect: |
          The gate lives on an ANCESTOR two hops away: printing a label reads the state of the
          PriceChangeFile that owns the task's line, not of the task itself. Nothing about the task
          changes between the two arms — the same task, the same actor, the same payload — only the
          file moves PARTIALLY_EXECUTED -> SUPERSEDED, and the identical call flips from 200 to
          ERR_FILE_NOT_DISTRIBUTED. The dependency is on a state SET ({DISTRIBUTED,
          PARTIALLY_EXECUTED}), so both members are shown to pass.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default; jurisdiction US-CA."
            - "One store, one aisle, one CERTIFIED LABEL_ASSOCIATE (la1)."
            - "File F1 (effective 2026-08-03) distributed with TWO lines; a task on line 1 and a task on line 2."
            - "File F2 (effective 2026-08-04, same jurisdiction) left in DRAFT to serve as the supersede target."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lena Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/lines"
              payload: { item_upc: "00000000001001", item_description: "Milk 1gal", category_code: "DAIRY", old_retail_cents: 449, new_retail_cents: 399, net_content_qty: 1, net_content_uom: "GAL" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/lines"
              payload: { item_upc: "00000000001002", item_description: "Butter 1lb", category_code: "DAIRY", old_retail_cents: 549, new_retail_cents: 499, net_content_qty: 1, net_content_uom: "LB" }
              as: PricingAdmin
              captures: { line_2: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1002", jurisdiction_id: "${jur_a}", effective_date: "2026-08-04T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_2: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_1}/distribute"
              payload: {}
              as: PricingAdmin
              captures: { f1_v_distributed: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_1}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T10:00:00Z", expected_price_change_file_version: "${f1_v_distributed}" }
              as: PricingAdmin
              captures: { task_1: $.data.id }
            - call: "GET /price-integrity/price-change-files/${file_1}"
              as: PricingAdmin
              captures: { f1_v_partial: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_1}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_2}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-03T11:00:00Z", scheduled_end_at: "2026-08-03T12:00:00Z", expected_price_change_file_version: "${f1_v_partial}" }
              as: PricingAdmin
              captures: { task_2: $.data.id }
          trigger:
            - call: "POST /price-integrity/label-tasks/${task_1}/print"
              payload: {}
              as: LabelAssociate
              as_user_id: "${la1}"
            - call: "POST /price-integrity/price-change-files/${file_1}/supersede"
              payload: { superseded_by_file_id: "${file_2}" }
              as: PricingAdmin
            - call: "POST /price-integrity/label-tasks/${task_2}/print"
              payload: {}
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { err_not_distributed: $.data.error_id }
          assert:
            - "Both members of the allowed state set are exercised: file_1 was DISTRIBUTED when task_1 was created and PARTIALLY_EXECUTED when task_1 printed successfully (HTTP 200, LabelTask.${task_1}.print_status == PRINTED)"
            - "After the successful print: PriceChangeLine.${line_1}.line_status == LABELED and PriceChangeFile.${file_1}.status == PARTIALLY_EXECUTED"
            - "Supersede moves the ancestor only: PriceChangeFile.${file_1}.status == SUPERSEDED, superseded_by_file_id == ${file_2}, and PriceChangeFile.${file_2}.status is still DRAFT"
            - "Supersede's own cascade: PriceChangeLine.${line_1}.line_status == WITHDRAWN, PriceChangeLine.${line_2}.line_status == WITHDRAWN, LabelTask.${task_1}.print_status == REPRINT_REQUIRED (placement_status was never PLACED), LabelTask.${task_2}.print_status == REPRINT_REQUIRED"
            - "The gated call: printing ${task_2} now returns HTTP 409 with ${err_not_distributed} == ERR_FILE_NOT_DISTRIBUTED"
            - "The task itself was in a printable state — LabelTask.${task_2}.print_status == REPRINT_REQUIRED is a legal source for the print transition — so the refusal comes purely from the ancestor file"
            - "Reprinting ${task_1} is refused identically with ERR_FILE_NOT_DISTRIBUTED even though it printed successfully minutes earlier under the same payload and actor"
            - "Store.${store_a}.label_backlog_count == 0 after the supersede — withdrawn lines leave the backlog"

      - name: issue_findings_blocked_by_evidence_audit_leaving_closed
        grounds:
          - validations.priority_44_ERR_EVIDENCE_AUDIT_NOT_CLOSED
          - state_machines.RegulatoryInspection.SCHEDULED_to_FINDINGS_ISSUED
          - state_machines.ScannerAudit.CLOSED_to_REOPENED
          - calculations.penalty_exposure
        distinguishing_aspect: |
          The gate points SIDEWAYS at a peer the inspection merely references as evidence, and the
          blocking state is reached by a cycle rather than by a terminal move: the audit was CLOSED
          when the inspection was scheduled, and a compliance officer's reopen retroactively
          invalidates the evidence. Unlike the file/print gate above, the dependent entity's own
          state (SCHEDULED) never changes across the arms, the gate requires an EXACT state
          (== CLOSED, not a set), and re-closing the audit restores the call to success — the same
          request body then produces findings and a penalty exposure.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with scanner_error_rate_threshold_pct 25.0, penalty_per_violation_cents 5000, penalty_max_cents 2000000."
            - "One store, one aisle with NO assigned associate, one CERTIFIED PRICE_AUDITOR (pa1)."
            - "One audit with 4 scan lines (1 overcharge) closed to FAIL, and a SCHEDULED inspection citing it as evidence."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 25.0, penalty_per_violation_cents: 5000, penalty_max_cents: 2000000 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "REGULATORY", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_e: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_e}/scan-lines"
              payload: { item_upc: "00000000001101", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_e}/scan-lines"
              payload: { item_upc: "00000000001102", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_e}/scan-lines"
              payload: { item_upc: "00000000001103", shelf_price_cents: 199, register_price_cents: 199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_e}/scan-lines"
              payload: { item_upc: "00000000001104", shelf_price_cents: 399, register_price_cents: 399 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_e}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${audit_e}", inspector_ref: "INS-77", inspection_date: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_a: $.data.id }
          trigger:
            - call: "POST /price-integrity/scanner-audits/${audit_e}/reopen"
              payload: { reopen_reason: "Register export re-pulled for the regulator" }
              as: ComplianceOfficer
            - call: "POST /price-integrity/regulatory-inspections/${insp_a}/issue-findings"
              payload: { findings: [{ finding_code: "SCANNER_ERROR_RATE", severity: "MAJOR", affected_item_count: 4 }] }
              as: ComplianceOfficer
              captures: { err_evidence: $.data.error_id }
            - call: "POST /price-integrity/scanner-audits/${audit_e}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/regulatory-inspections/${insp_a}/issue-findings"
              payload: { findings: [{ finding_code: "SCANNER_ERROR_RATE", severity: "MAJOR", affected_item_count: 4 }] }
              as: ComplianceOfficer
          assert:
            - "Reopen is permitted because the citing inspection is only SCHEDULED, not CLOSED: ScannerAudit.${audit_e}.status == REOPENED, outcome == PENDING, reopen_count == 1"
            - "The inspection is untouched by the reopen: RegulatoryInspection.${insp_a}.status == SCHEDULED, finding_count == 0, penalty_exposure_cents == 0"
            - "Gated arm: issue-findings returns HTTP 409 with ${err_evidence} == ERR_EVIDENCE_AUDIT_NOT_CLOSED even though the inspection is in the correct SCHEDULED source state and the findings array is non-empty"
            - "No InspectionFinding rows were created: GET /price-integrity/regulatory-inspections/${insp_a}/findings returns total_count 0"
            - "Restored arm: after re-closing, ScannerAudit.${audit_e}.status == CLOSED with error_rate_pct == 25.00 and outcome == FAIL again, and the identical issue-findings body returns HTTP 200"
            - "RegulatoryInspection.${insp_a}.status == FINDINGS_ISSUED, finding_count == 1, and version has advanced by 1 from its pre-call value"
            - "penalty_exposure_cents == 75000: component = SEVERITY_WEIGHTS[MAJOR] 3 x penalty_per_violation_cents 5000 x min(4, PENALTY_ITEM_CAP 10) = 60000; n 1 gives tier_multiplier 100 and the CLOSED-FAIL evidence adds audit_aggravator 25, so FLOOR(60000 x 125 / 100) = 75000, under penalty_max_cents 2000000"
            - "GET /price-integrity/regulatory-inspections/${insp_a}/findings returns total_count 1 with the single finding in status OPEN"
            - "Store.${store_a}.open_finding_count == 1, escalated_finding_count == 0, failed_audit_count_30d == 1, and compliance_posture == RESTRICTED — no FROZEN trigger is met (escalated 0, open 1 < 3, failed 1 < 2)"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: aisle_audit_windows_half_open_plus_sixty_minute_cooldown
        grounds:
          - validations.priority_60_ERR_AISLE_AUDIT_WINDOW_CONFLICT
          - endpoints.POST_/price-integrity/scanner-audits
          - entities.ScannerAudit.fields.scan_window_start
          - entities.ScannerAudit.fields.scan_window_end
        distinguishing_aspect: |
          Half-open intervals WITH an asymmetric 60-minute cooldown appended to the existing window
          only: conflict iff new.start < existing.end + 60min AND existing.start < new.end. So a new
          window starting exactly 30 minutes after an existing window ends still conflicts, while one
          starting exactly 60 minutes after does not — the boundary is the cooldown edge, not the
          window edge. The resource is the Aisle, and only non-CLOSED audits reserve it, so closing
          the incumbent releases the slot without moving any timestamp.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with scanner_error_rate_threshold_pct 60.0 so the incumbent audit closes PASS and adds no posture noise."
            - "One store, one aisle A01 with NO assigned associate, one CERTIFIED PRICE_AUDITOR (pa1)."
            - "Incumbent audit A1 on aisle A01 with scan_window [2026-08-01T08:00:00Z, 2026-08-01T10:00:00Z), left in OPEN (no scan lines yet)."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 60.0 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_incumbent: $.data.id }
          trigger:
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T10:30:00Z", scan_window_end: "2026-08-01T12:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { err_cooldown: $.data.error_id }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T10:00:00Z", scan_window_end: "2026-08-01T10:59:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { err_adjacent: $.data.error_id }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T11:00:00Z", scan_window_end: "2026-08-01T12:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_edge_ok: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_incumbent}/scan-lines"
              payload: { item_upc: "00000000001201", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_incumbent}/close"
              payload: {}
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T10:30:00Z", scan_window_end: "2026-08-01T11:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_after_close: $.data.id }
          assert:
            - "Inside the cooldown: [10:30, 12:00) against incumbent [08:00, 10:00) gives 10:30 < 11:00 AND 08:00 < 12:00, so the call returns HTTP 409 with ${err_cooldown} == ERR_AISLE_AUDIT_WINDOW_CONFLICT"
            - "Touching the window end is still inside the cooldown: [10:00, 10:59) gives 10:00 < 11:00 AND 08:00 < 10:59, so ${err_adjacent} == ERR_AISLE_AUDIT_WINDOW_CONFLICT (HTTP 409)"
            - "Exactly at the cooldown edge is free: [11:00, 12:00) gives 11:00 < 11:00 == false, so ${audit_edge_ok} is created with HTTP 201, status == OPEN, sample_size == 0"
            - "Only non-CLOSED audits reserve the aisle: after the incumbent closes (outcome PASS, error_rate_pct 0.00 under threshold 60.0), the previously rejected [10:30, 11:00) window is accepted as ${audit_after_close} with HTTP 201"
            - "That last window would still conflict with ${audit_edge_ok} if the rule were symmetric — 10:30 < 12:00 + 60min holds — but existing.start 11:00 < new.end 11:00 is false, so the second clause of the conjunction saves it"
            - "GET /price-integrity/scanner-audits?aisle_id=${aisle_a1} returns total_count 3 (the incumbent plus the two accepted windows); the two rejected attempts created no rows"
            - "Aisle.${aisle_a1}.last_audit_closed_at == 2026-08-01T00:00:00Z (clock_now at close, not the scan window end)"

      - name: associate_label_task_windows_closed_closed_so_touching_conflicts
        grounds:
          - validations.priority_61_ERR_ASSOCIATE_SCHEDULE_CONFLICT
          - endpoints.POST_/price-integrity/price-change-files/{id}/label-tasks
          - entities.LabelTask.fields.scheduled_start_at
          - entities.LabelTask.fields.scheduled_end_at
        distinguishing_aspect: |
          The SAME system uses the opposite interval convention for a different resource: associate
          labour windows are closed-closed, so two windows that merely touch at a single instant
          conflict (new.start <= existing.end AND existing.start <= new.end) — the exact opposite of
          the half-open aisle rule above, and with no cooldown at all. One minute of separation
          clears it. The reservation is per assignee, and terminal (VERIFIED) tasks stop reserving.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default; jurisdiction US-CA with grace_period_hours 48."
            - "One store, one aisle, two CERTIFIED LABEL_ASSOCIATEs (la1, la2), one CERTIFIED PRICE_AUDITOR (pa1)."
            - "One distributed file with FOUR lines, so each attempted task can use a distinct line and never trip the one-task-per-line uniqueness rule."
            - "Incumbent task T1: line 1, assignee la1, scheduled [2026-08-03T09:00:00Z, 2026-08-03T10:00:00Z] (60 minutes)."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
