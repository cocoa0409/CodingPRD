            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /flash-offers/${oA2}/activate"
              payload: {}
              as: MerchandisingManager
            - call: "POST /flash-offers/${oB2}/activate"
              payload: {}
              as: MerchandisingManager
            - *k_cart1
            - *k_cart2
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${oA2}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itA: $.data.id }
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${oB2}", qty: 1 }
