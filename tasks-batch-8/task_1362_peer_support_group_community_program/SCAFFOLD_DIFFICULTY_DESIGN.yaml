              captures: { fv1: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/sessions/${s1}/schedule"
              payload: { expected_facilitator_version: "${fv1}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-02T10:30:00Z", end_at: "2026-08-02T11:30:00Z", primary_facilitator_id: "${fid}", room_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "room_id 00000000-... does not exist (existence violation, priority 5)"
            - "If it did exist, time 10:30-11:30 would overlap with existing 10:00-11:00 (temporal violation, priority 14)"
