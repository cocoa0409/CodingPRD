            - { call: "POST /artworks/${aw_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "f203" }, as: Artist, as_user_id: "${a1_id}", captures: { e_second: $.data.error_id } }
