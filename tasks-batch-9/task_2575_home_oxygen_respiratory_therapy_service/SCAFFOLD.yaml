  # ------------------------------ RouteStop ----------------------------------
  - method: POST
    path: "/home-oxygen/route-stops"
    description: "Add a stop to a planning or locked route (setup delivery, tank exchange, portable refill, pickup or maintenance swap)."
    roles: [BranchManager]
    code: 201
    input: [route_id, contract_id, stop_type, window_start_utc, window_end_utc, service_minutes, "cylinders_requested?"]
    output: RouteStop
    side_effects:
      - "sets RouteStop.status := PLANNED and safety_result := NOT_ASSESSED"
      - "computes RouteStop.liters_committed and re-derives DeliveryRoute.total_o2_liters_committed, refill_slots_used and planned_stop_count via calculations.route_liters_committed"
      - "assigns RouteStop.sequence_index by ordering the route's non-CANCELLED stops by window_start_utc ASC then created_at ASC"
      - "when stop_type == PICKUP: drives the RentalContract IN_SERVICE -> PICKUP_SCHEDULED transition and increments RentalContract.version by 1"
      - "increments DeliveryRoute.version by 1"

  - method: GET
    path: "/home-oxygen/route-stops"
    description: "List stops, filterable by route, contract, type and status."
    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: ["route_id?", "contract_id?", "stop_type?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/route-stops/{stop_id}"
    description: "Read one stop, including the in-home safety assessment fields."
    roles: [BranchManager, RespiratoryTherapist, DeliveryDriver, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: RouteStop
    side_effects: []

  - method: POST
    path: "/home-oxygen/route-stops/{stop_id}/complete"
    description: "Close a non-setup stop (tank exchange, portable refill, pickup or maintenance swap)."
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "drives the RouteStop PLANNED -> COMPLETED transition and all of its declared side effects"
      - "for a PICKUP stop: drives the RentalContract PICKUP_SCHEDULED -> RETURNED transition, removes every PLACED placement and returns their units to IN_STOCK, and sets RentalContract.monthly_allowable_cents := 0"
      - "bubbles the DeliveryRoute up to COMPLETED when every stop of the route is terminal"
      - "increments RouteStop.version by 1"

  - method: POST
    path: "/home-oxygen/route-stops/{stop_id}/complete-setup"
    description: "Close a SETUP_DELIVERY stop with the in-home education and safety assessment. A smoking finding fails the assessment and fires the four-hop setup-failure cascade."
    roles: [RespiratoryTherapist]
    code: 200
    input: [smoking_in_home, electrical_pass, patient_teachback_score, "education_topics_covered?"]
    output: RouteStop
    side_effects:
      - "drives the RouteStop PLANNED -> COMPLETED transition and computes safety_result and safety_findings_count"
      - "drives the RentalContract PENDING_SETUP -> IN_SERVICE transition (safety_result PASS) or PENDING_SETUP -> SETUP_FAILED four-hop cascade (safety_result FAIL), with all of their declared side effects"
      - "recomputes RentalContract.monthly_allowable_cents via calculations.monthly_allowable_cents"
      - "recomputes Patient.oxygen_safety_risk_score via the INITIAL_ASSESSMENT variant and re-evaluates Patient.compliance_hold"
      - "bubbles the DeliveryRoute up to COMPLETED when every stop of the route is terminal"
      - "increments RouteStop.version by 1"
      - "increments RentalContract.version by 1"
      - "increments Patient.version by 1"

  - method: POST
    path: "/home-oxygen/route-stops/{stop_id}/miss"
    description: "Record a missed stop; its committed litres stay committed for the day."
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "drives the RouteStop PLANNED -> MISSED transition and all of its declared side effects"
      - "bubbles the DeliveryRoute up to COMPLETED when every stop of the route is terminal"
      - "increments RouteStop.version by 1"

  - method: POST
    path: "/home-oxygen/route-stops/{stop_id}/cancel"
    description: "Cancel a planned stop; the compensating counterpart of stop creation."
    roles: [BranchManager]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "drives the RouteStop PLANNED -> CANCELLED transition and all of its declared side effects"
      - "decreases DeliveryRoute.total_o2_liters_committed by exactly this stop's liters_committed and re-derives refill_slots_used, planned_stop_count and every remaining stop's sequence_index"
      - "when the cancelled stop was the contract's only PLANNED PICKUP: drives the RentalContract PICKUP_SCHEDULED -> IN_SERVICE transition and increments RentalContract.version by 1"
      - "increments RouteStop.version by 1"
      - "increments DeliveryRoute.version by 1"

  # ----------------------------- RecallNotice --------------------------------
  - method: POST
    path: "/home-oxygen/recall-notices"
    description: "Publish a manufacturer recall against a model code. CLASS_I immediately quarantines the matching fleet and fires the four-hop recall cascade."
    roles: [ComplianceAuditor]
    code: 201
    input: [model_code, severity]
    output: RecallNotice
    side_effects:
      - "sets RecallNotice.status := OPEN and issued_at := the logical clock"
      - "computes remediation_deadline_utc, affected_unit_count and auto_quarantined_unit_count via calculations.recall_remediation_deadline"
      - "HOP 1..4 for severity CLASS_I: matching EquipmentUnit rows -> IN_QUARANTINE (quarantine_reason RECALL); their PLACED placements -> RECALLED_OUT_OF_SERVICE; those placements' contracts -> billing_status SUSPENDED (suspension_reason RECALL) with monthly_allowable_cents recomputed"
      - "increments the version of every EquipmentUnit, Placement and RentalContract the cascade touches by 1"

  - method: GET
    path: "/home-oxygen/recall-notices"
    description: "List recall notices, filterable by model code, severity and status."
    roles: [BranchManager, RespiratoryTherapist, ComplianceAuditor, BillingSpecialist]
    code: 200
    input: ["model_code?", "severity?", "status?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/recall-notices/{recall_notice_id}"
    description: "Read one recall notice, including the creation-time snapshots and the live remediated count."
    roles: [BranchManager, RespiratoryTherapist, ComplianceAuditor, BillingSpecialist]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []

  - method: POST
    path: "/home-oxygen/recall-notices/{recall_notice_id}/start-remediation"
    description: "Acknowledge a recall and begin fleet remediation."
    roles: [BranchManager]
    code: 200
    input: []
    output: RecallNotice
    side_effects:
      - "drives the RecallNotice OPEN -> IN_REMEDIATION transition"
      - "increments RecallNotice.version by 1"

  - method: POST
    path: "/home-oxygen/recall-notices/{recall_notice_id}/close"
    description: "Close a fully remediated recall notice."
    roles: [BranchManager]
    code: 200
    input: []
    output: RecallNotice
    side_effects:
      - "drives the RecallNotice IN_REMEDIATION -> CLOSED transition"
      - "increments RecallNotice.version by 1"

  # -------------------------- TravelAuthorization ----------------------------
  - method: GET
    path: "/home-oxygen/travel-authorizations"
    description: "List travel authorizations, filterable by contract, receiving branch and status."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: ["contract_id?", "receiving_branch_id?", "status?", "limit?", "offset?"]
    output: TravelAuthorization[]
    side_effects: []

  - method: GET
    path: "/home-oxygen/travel-authorizations/{travel_authorization_id}"
    description: "Read one travel authorization, including every intermediate step of the supply computation."
    roles: [BranchManager, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist, ComplianceAuditor]
    code: 200
    input: []
    output: TravelAuthorization
    side_effects: []

  - method: POST
    path: "/home-oxygen/travel-authorizations/{travel_authorization_id}/approve"
    description: "Approve travel supply and destination hand-off."
    roles: [BranchManager]
    code: 200
    input: []
    output: TravelAuthorization
    side_effects:
      - "drives the TravelAuthorization REQUESTED -> APPROVED transition and all of its declared side effects"
      - "increments TravelAuthorization.version by 1"

  - method: POST
    path: "/home-oxygen/travel-authorizations/{travel_authorization_id}/deny"
    description: "Deny travel supply."
    roles: [BranchManager]
    code: 200
    input: ["denial_reason?"]
    output: TravelAuthorization
    side_effects:
      - "drives the TravelAuthorization REQUESTED -> DENIED transition and all of its declared side effects"
      - "increments TravelAuthorization.version by 1"

  # ------------------------- Test-driving endpoint ---------------------------
  - method: POST
    path: "/home-oxygen/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and MUST NOT fall back to real wall-clock time. The clock is monotone forward-only. Every advance runs the CertificateOfMedicalNecessity ACTIVE -> EXPIRED sweep (and its contract-suspension cascade) before returning. Last-resort test-driving endpoint per the §1.5 priority ladder: no business surface can move the clock."
    roles: [BranchManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, previous_utc: string, expired_cmn_count: integer, suspended_contract_count: integer }"
    side_effects:
      - "advances the logical clock to body.to_iso8601"
      - "for every CertificateOfMedicalNecessity with status == ACTIVE and recert_due_date < the new clock's date: drives ACTIVE -> EXPIRED and suspends every ACCRUING or CAP_REACHED contract hanging off it with suspension_reason CMN_EXPIRED"
      - "increments the version of every CertificateOfMedicalNecessity, RentalContract and Patient the sweep touches by 1"

# =============================================================================
# 1.6 Error Code Catalog
# Every id below is referenced by at least one validations[] row in §1.4 or by a
# concurrency_rules[] entry in §1.2.1; the http value matches that row's
# http_status exactly. 73 codes.
# =============================================================================
errors:

  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty on any endpoint."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven role names declared in §1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles list."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The compliance auditor approving a certificate is the same opaque user id that submitted it or signed it."

  # --- existence -------------------------------------------------------------
  - id: ERR_BRANCH_NOT_FOUND
    http: 404
    condition: "A branch id supplied in the path or body does not resolve to a Branch."
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "A patient id supplied in the path or body does not resolve to a Patient."
  - id: ERR_QUALIFYING_TEST_NOT_FOUND
    http: 404
    condition: "A qualifying test id supplied in the path or body does not resolve to a QualifyingTest."
  - id: ERR_CMN_NOT_FOUND
    http: 404
    condition: "A certificate id supplied in the path or body does not resolve to a CertificateOfMedicalNecessity."
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "A contract id supplied in the path or body does not resolve to a RentalContract."
  - id: ERR_EQUIPMENT_UNIT_NOT_FOUND
    http: 404
    condition: "An equipment unit id supplied in the path or body (including replaces_unit_id) does not resolve to an EquipmentUnit."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "The {placement_id} path segment does not resolve to a Placement."
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "A route id supplied in the path or body does not resolve to a DeliveryRoute."
  - id: ERR_ROUTE_STOP_NOT_FOUND
    http: 404
    condition: "The {stop_id} path segment does not resolve to a RouteStop."
  - id: ERR_RECALL_NOTICE_NOT_FOUND
    http: 404
    condition: "The {recall_notice_id} path segment does not resolve to a RecallNotice."
  - id: ERR_TRAVEL_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "The {travel_authorization_id} path segment does not resolve to a TravelAuthorization."
  - id: ERR_POSTED_MONTH_NOT_FOUND
    http: 404
    condition: "The {service_month} path segment on the reversal endpoint is absent from RentalContract.posted_months."

  # --- schema ----------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, or a supplied value has the wrong JSON type or violates its declared numeric/string domain."
  - id: ERR_INVALID_ENUM_VALUE
    http: 400
    condition: "An enum-typed input or query filter carries a value outside that field's declared enum set."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is not an integer in 1..100 or offset is not an integer >= 0."

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version on certificate creation does not equal the Patient's stored version."
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version on travel-authorization creation does not equal the RentalContract's stored version."

  # --- uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_MRN
    http: 409
    condition: "The submitted mrn already belongs to another Patient."
  - id: ERR_DUPLICATE_SERIAL_NUMBER
    http: 409
    condition: "The submitted serial_number already belongs to another EquipmentUnit."

  # --- state -----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested action is not a declared transition out of the target row's current state in §1.2 (includes terminal-state lockdown and repeated triggers)."
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "A certificate already at revision_round == MAX_REVISION_ROUNDS (3) is returned for correction again."
  - id: ERR_PATIENT_NOT_ACTIVE
    http: 409
    condition: "An intake, certificate, contract, assignment or travel action targets a Patient whose status is not ACTIVE."
  - id: ERR_CONTRACT_CLOSED
    http: 409
    condition: "A billing, assignment, stop or travel action targets a RentalContract whose billing_status is CLOSED."
  - id: ERR_CONTRACT_BILLING_SUSPENDED
    http: 409
    condition: "A rental month is posted against a RentalContract whose billing_status is SUSPENDED."
  - id: ERR_CONTRACT_NOT_IN_SERVICE
    http: 409
    condition: "A tank-exchange, portable-refill, maintenance-swap or pickup stop is created for a RentalContract whose service_status is not IN_SERVICE."
  - id: ERR_ROUTE_NOT_DISPATCHED
    http: 409
    condition: "A stop completion, miss or setup completion is attempted while the owning DeliveryRoute is not DISPATCHED."
  - id: ERR_ROUTE_NOT_EDITABLE
    http: 409
    condition: "A stop is created or cancelled while the owning DeliveryRoute is DISPATCHED or COMPLETED."
  - id: ERR_STOP_TYPE_MISMATCH
    http: 409
    condition: "complete-setup is called on a stop whose stop_type is not SETUP_DELIVERY, or complete is called on a SETUP_DELIVERY stop."
  - id: ERR_RECALL_NOT_REMEDIATED
    http: 409
    condition: "A recall notice is closed while remediated_unit_count is below affected_unit_count."
  - id: ERR_TRANSFER_NOT_DUE
    http: 409
    condition: "A pending transfer is completed before its transfer_effective_date has been reached on the logical clock."
  - id: ERR_CONTRACT_NOT_RETURNED
    http: 409
    condition: "A contract is closed while its service_status is neither RETURNED nor SETUP_FAILED."

  # --- business_safety -------------------------------------------------------
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "A certificate is submitted while its documentation_score is below DOCUMENTATION_PASS_THRESHOLD (85.00)."
  - id: ERR_TEST_NON_QUALIFYING
    http: 422
    condition: "A certificate is drafted (POST /home-oxygen/cmns) against a QualifyingTest whose computed qualifying_group is NON_QUALIFYING."
  - id: ERR_QUALIFYING_TEST_STALE
    http: 422
    condition: "A certificate is submitted after its qualifying test's validity window plus TEST_VALIDITY_GRACE_DAYS (15) has elapsed on the logical clock."
  - id: ERR_PATIENT_ON_COMPLIANCE_HOLD
    http: 409
    condition: "An equipment assignment, a travel-authorization request, or a travel approval is attempted while Patient.compliance_hold is true."
  - id: ERR_PORTABLE_NOT_INDICATED
    http: 422
    condition: "A PORTABLE-role assignment is requested while the certificate does not prescribe portable oxygen or the patient's mobility_profile is HOMEBOUND."
  - id: ERR_REFILL_REQUIRES_LIQUID_PORTABLE
    http: 422
    condition: "A PORTABLE_REFILL stop is created for a contract with no PLACED LIQUID_PORTABLE unit."
  - id: ERR_NO_RESERVED_EQUIPMENT
    http: 422
    condition: "A SETUP_DELIVERY stop is created for a contract that has no RESERVED placement."

  # --- business_referential --------------------------------------------------
  - id: ERR_TEST_PATIENT_MISMATCH
    http: 422
    condition: "The referenced QualifyingTest belongs to a different Patient than the one named on the certificate."
  - id: ERR_CMN_PATIENT_MISMATCH
    http: 422
    condition: "The referenced certificate belongs to a different Patient than the one named on the contract."
  - id: ERR_PATIENT_HAS_OPEN_CONTRACT
    http: 409
    condition: "A second contract is opened for a patient who already has one whose billing_status is not CLOSED."
  - id: ERR_CMN_NOT_ACTIVE
    http: 409
    condition: "A contract is opened against, or resumed under, a certificate whose status is not ACTIVE."
  - id: ERR_STOP_BRANCH_MISMATCH
    http: 422
    condition: "The stop's contract belongs to a patient served by a different Branch than the route's branch_id."
  - id: ERR_RECEIVING_BRANCH_INVALID
    http: 422
    condition: "The receiving branch on a transfer or travel authorization is the patient's current serving branch."
  - id: ERR_REPLACED_UNIT_NOT_REPLACEABLE
    http: 422
    condition: "replaces_unit_id points at a unit that is neither IN_QUARANTINE nor RETIRED, or that belongs to a different branch."
  - id: ERR_CONTRACT_HAS_RECALLED_EQUIPMENT
    http: 409
    condition: "Billing is resumed while the contract still has a placement in RECALLED_OUT_OF_SERVICE."

  # --- business_temporal -----------------------------------------------------
  - id: ERR_TEST_DATE_IN_FUTURE
    http: 422
    condition: "tested_at is strictly after the logical clock."
  - id: ERR_INVALID_SHIFT
    http: 422
    condition: "shift_end_utc is not strictly after shift_start_utc, or the shift does not fall on service_date."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end_utc is not strictly after window_start_utc."
  - id: ERR_WINDOW_OUTSIDE_SHIFT
    http: 422
    condition: "The stop's window, extended by service_minutes, is not contained in the route's shift."
  - id: ERR_ROUTE_STOP_WINDOW_CONFLICT
    http: 409
    condition: "The new stop's half-open service span plus the branch's tank_exchange_buffer_minutes trailing buffer overlaps an existing non-terminal stop's buffered span on the same route."
  - id: ERR_INVALID_TRAVEL_INTERVAL
    http: 422
    condition: "return_utc is not strictly after depart_utc, or depart_utc is before the logical clock."
  - id: ERR_TRAVEL_INTERVAL_CONFLICT
    http: 409
    condition: "The requested closed travel interval intersects an existing REQUESTED or APPROVED TravelAuthorization interval on the same contract, touching endpoints included."
  - id: ERR_TRANSFER_DATE_IN_PAST
    http: 422
    condition: "transfer_effective_date is strictly before the logical clock's date."
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "to_iso8601 is not strictly after the current logical clock value."
  - id: ERR_SERVICE_MONTH_BEFORE_START
    http: 422
    condition: "The posted service_month precedes the contract's first_service_month."
  - id: ERR_SERVICE_MONTH_IN_FUTURE
    http: 422
    condition: "The posted service_month is later than the logical clock's calendar month."
  - id: ERR_SERVICE_MONTH_ALREADY_POSTED
    http: 409
    condition: "The posted service_month is already present in RentalContract.posted_months."

  # --- business_constraint ---------------------------------------------------
  - id: ERR_ROUTE_HAS_NO_STOPS
    http: 422
    condition: "A route is locked while its planned_stop_count is 0."
  - id: ERR_REFILL_CAPACITY_EXCEEDED
    http: 422
    condition: "The route's PORTABLE_REFILL stop count would exceed the branch's refill_capacity_per_day."
  - id: ERR_ROLE_ALREADY_OCCUPIED
    http: 409
    condition: "An assignment is requested for a role the contract already fills with a RESERVED or PLACED placement."
  - id: ERR_NO_ELIGIBLE_EQUIPMENT
    http: 409
    condition: "calculations.equipment_selection's eligibility filter yields the empty set for the requested role."
  - id: ERR_CYLINDERS_NOT_APPLICABLE
    http: 422
    condition: "cylinders_requested is supplied and non-zero on a stop type that carries no cylinders."
  - id: ERR_BRANCH_NOT_LIQUID_CERTIFIED
    http: 422
    condition: "A liquid-class assignment is requested at a branch whose liquid_oxygen_certified is false."
  - id: ERR_PATIENT_HAS_ACTIVE_SERVICE
    http: 409
    condition: "A patient is discharged while any contract's service_status is still IN_SERVICE or PICKUP_SCHEDULED."
  - id: ERR_TRAVEL_SUPPLY_EXCEEDS_LIMIT
    http: 422
    condition: "calculations.travel_supply_authorization yields supply_cylinders_authorized above MAX_TRAVEL_CYLINDERS (12)."

  # --- business_fiscal -------------------------------------------------------
  - id: ERR_CAP_MONTHS_EXHAUSTED
    http: 409
    condition: "The candidate cap position from calculations.cap_month_position exceeds the contract's cap_month_limit."
  - id: ERR_REVERSAL_WOULD_NOT_CLEAR_CAP
    http: 409
    condition: "A reversal is requested for a month that is neither the latest posted month nor part of a chain that restores a consistent cap position."
  - id: ERR_NO_PLACED_EQUIPMENT
    http: 422
    condition: "A rental month is posted against a contract whose monthly_allowable_cents is 0 (no PLACED equipment)."

# =============================================================================
# 1.7 RBAC Matrix
# role_model: segregation_of_duties. All seven roles are operational, so every
# identity is `opaque`; the scaffold stores those opaque ids on
# CertificateOfMedicalNecessity.submitted_by_user_id / signed_by_user_id /
# audited_by_user_id, DeliveryRoute.driver_user_id,
# RouteStop.completed_by_user_id and TravelAuthorization.decided_by_user_id, and
# never requires any of them to equal an entity id.
# =============================================================================
roles:

  - name: IntakeCoordinator
    description: "Front-office intake: admits patients, records qualifying studies, drafts and submits certificates, opens transfers and requests travel supply."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/patients"
      - "PATCH /home-oxygen/patients/{patient_id}"
      - "POST /home-oxygen/qualifying-tests"
      - "POST /home-oxygen/cmns"
      - "PATCH /home-oxygen/cmns/{cmn_id}"
      - "POST /home-oxygen/cmns/{cmn_id}/submit"
      - "POST /home-oxygen/patients/{patient_id}/transfer-requests"
      - "POST /home-oxygen/patients/{patient_id}/transfer-requests/cancel"
      - "POST /home-oxygen/rental-contracts/{contract_id}/travel-authorizations"
    shared_operations:
      - "all GET endpoints except /home-oxygen/patients/{patient_id}/risk-assessment, /home-oxygen/rental-contracts/{contract_id}/cap-summary and /home-oxygen/delivery-routes/{route_id}/manifest"

  - name: Physician
    description: "Ordering clinician: the only role that may sign a submitted certificate of medical necessity."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/cmns/{cmn_id}/sign"
    shared_operations:
      - "GET /home-oxygen/branches, GET /home-oxygen/branches/{branch_id}, GET /home-oxygen/patients, GET /home-oxygen/patients/{patient_id}, GET /home-oxygen/qualifying-tests, GET /home-oxygen/qualifying-tests/{qualifying_test_id}, GET /home-oxygen/cmns, GET /home-oxygen/cmns/{cmn_id}"

  - name: ComplianceAuditor
    description: "Documentation compliance: approves, returns or voids certificates and publishes manufacturer recall notices. Barred by segregation of duties from approving anything it submitted or signed."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/cmns/{cmn_id}/approve"
      - "POST /home-oxygen/cmns/{cmn_id}/return-for-correction"
      - "POST /home-oxygen/cmns/{cmn_id}/void"
      - "POST /home-oxygen/recall-notices"
    shared_operations:
      - "all GET endpoints except /home-oxygen/delivery-routes/{route_id}/manifest"

  - name: RespiratoryTherapist
    description: "Clinical field staff: assigns and releases equipment by role, performs in-home setup education and safety assessment, files malfunctions, services quarantined units and records surveillance reassessments."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/rental-contracts/{contract_id}/equipment-assignments"
      - "DELETE /home-oxygen/placements/{placement_id}"
      - "POST /home-oxygen/placements/{placement_id}/malfunction"
      - "POST /home-oxygen/route-stops/{stop_id}/complete-setup"
      - "POST /home-oxygen/equipment-units/{equipment_unit_id}/service"
      - "POST /home-oxygen/patients/{patient_id}/risk-reassessments"
    shared_operations:
      - "all GET endpoints"

  - name: DeliveryDriver
    description: "Route execution: closes or misses non-setup stops on a dispatched route."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/route-stops/{stop_id}/complete"
      - "POST /home-oxygen/route-stops/{stop_id}/miss"
    shared_operations:
      - "GET /home-oxygen/branches, GET /home-oxygen/branches/{branch_id}, GET /home-oxygen/patients, GET /home-oxygen/patients/{patient_id}, GET /home-oxygen/rental-contracts, GET /home-oxygen/rental-contracts/{contract_id}, GET /home-oxygen/equipment-units, GET /home-oxygen/equipment-units/{equipment_unit_id}, GET /home-oxygen/placements, GET /home-oxygen/placements/{placement_id}, GET /home-oxygen/delivery-routes, GET /home-oxygen/delivery-routes/{route_id}, GET /home-oxygen/delivery-routes/{route_id}/manifest, GET /home-oxygen/route-stops, GET /home-oxygen/route-stops/{stop_id}"

  - name: BranchManager
    description: "Branch operations: fleet registration and retirement, route planning/locking/dispatch, stop scheduling and cancellation, transfer completion, discharge, travel decisions, recall remediation, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/branches"
      - "PATCH /home-oxygen/branches/{branch_id}"
      - "POST /home-oxygen/equipment-units"
      - "POST /home-oxygen/equipment-units/{equipment_unit_id}/retire"
      - "POST /home-oxygen/delivery-routes"
      - "POST /home-oxygen/delivery-routes/{route_id}/lock"
      - "POST /home-oxygen/delivery-routes/{route_id}/unlock"
      - "POST /home-oxygen/delivery-routes/{route_id}/dispatch"
      - "POST /home-oxygen/route-stops"
      - "POST /home-oxygen/route-stops/{stop_id}/cancel"
      - "POST /home-oxygen/patients/{patient_id}/transfer-requests/complete"
      - "POST /home-oxygen/patients/{patient_id}/discharge"
      - "POST /home-oxygen/travel-authorizations/{travel_authorization_id}/approve"
      - "POST /home-oxygen/travel-authorizations/{travel_authorization_id}/deny"
      - "POST /home-oxygen/recall-notices/{recall_notice_id}/start-remediation"
      - "POST /home-oxygen/recall-notices/{recall_notice_id}/close"
      - "POST /home-oxygen/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: BillingSpecialist
    description: "Revenue cycle: opens contracts, posts and reverses capped-rental months, resumes suspended billing and closes contracts."
    identity: opaque
    exclusive_operations:
      - "POST /home-oxygen/rental-contracts"
      - "POST /home-oxygen/rental-contracts/{contract_id}/billing-months"
      - "POST /home-oxygen/rental-contracts/{contract_id}/billing-months/{service_month}/reverse"
      - "POST /home-oxygen/rental-contracts/{contract_id}/resume-billing"
      - "POST /home-oxygen/rental-contracts/{contract_id}/close"
