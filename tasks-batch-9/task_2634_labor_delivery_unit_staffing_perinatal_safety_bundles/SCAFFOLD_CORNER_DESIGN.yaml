      - name: drill_participant_roster_is_all_or_nothing_and_rejects_a_foreign_id_without_creating_the_drill
        claim_type: Bulk action
        grounds:
          - endpoints[POST /obstetric-units/{unitId}/cesarean-readiness-drills]
          - endpoints[GET /obstetric-units/{unitId}/cesarean-readiness-drills]
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_STAFF_NOT_FOUND]
          - errors[ERR_CROSS_UNIT_REFERENCE]
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: |
          participant_staff_ids is the only array-of-FK body field in the scaffold, and it is
          transactional: §1.5 requires 2..20 entries that ALL exist and ALL belong to the path unit.
          The interesting failure is partial-write — an implementation that inserts the drill row and
          then walks the roster leaves a SCHEDULED drill behind after a 422, which the follow-up list
          exposes as a phantom row. The two rejection modes also have a defined order (priority 4
          existence before priority 7 scoping), so a roster mixing a nonexistent id with a foreign id
          must answer ERR_STAFF_NOT_FOUND. The cardinality floor is separately real: a 1-entry roster is
          400 ERR_INVALID_FIELD_VALUE at priority 5, before either id is looked up. The success case
          pins that a SCHEDULED drill grants nothing — readiness stays NOT_READY and the unit stays
          INDUCTION_FROZEN, because only /validate ever moves currency.
        test_recipe:
          setup: |
            Unit A holds an OB_ATTENDING and an ANESTHESIOLOGIST; unit B holds one ANESTHESIOLOGIST who
            is foreign to unit A. Unit A has one AVAILABLE LDR bed so its posture is not DIVERT.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
