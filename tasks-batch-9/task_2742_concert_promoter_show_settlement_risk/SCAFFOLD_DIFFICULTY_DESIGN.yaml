              captures: { d_inv_status: $.data.status, d_inv_approver: $.data.approved_by_user_id }
          assert:
            - "${d_at_risk_before} == 4415000 and ${d_breakeven_before} == 5000000 — the pre-trigger baseline"
            - "HOP 1 — ${d_inv_status} == APPROVED and ${d_inv_approver} == acct-bob"
            - "HOP 2 — BudgetLine.${d_bl_id}.actual_cents == 260000, variance_cents == 60000, variance_pct == 30.00, variance_status == PENDING_APPROVAL, required_approver_role == RISK_OFFICER, settlement_expense_cents == 200000 (budgeted, because the variance is unresolved)"
            - "HOP 3 — Show.${d_sh_id}.total_actual_expense_cents == 260000, Show.${d_sh_id}.budget_posture == VARIANCE_PENDING, Show.${d_sh_id}.breakeven_cents == 5200000 (5000000 + MIN(200000, expense_cap 2000000))"
            - "HOP 4 — Market.${d_mk_id}.at_risk_guarantee_cents == 4615000 == 5200000 - 585000, exactly 200000 above the pre-trigger 4415000"
            - "HOP 4 — Market.${d_mk_id}.committed_guarantee_cents == 5000000 and exposure_utilization_pct == 50.00 and risk_posture == OPEN are UNCHANGED: the cascade moved at-risk only, because no guarantee was committed or released"
            - "Version bumps prove the cascade actually wrote all four rows: VendorInvoice.${d_inv_id}.version increased, BudgetLine.${d_bl_id}.version == ${d_bl_v_before} + 1, Show.${d_sh_id}.version == ${d_sh_v_before} + 1, Market.${d_mk_id}.version == ${d_mk_v_before} + 1"
            - "Show.${d_sh_id}.adjusted_gross_cents == 585000 is unchanged — the expense cascade never touches the revenue ladder"
            - "Show.${d_sh_id}.total_budgeted_expense_cents == 200000 is unchanged — approving an invoice moves ACTUAL and RECOGNISED expense, never the budget"

      - name: offer_acceptance_cascades_three_levels_offer_show_artist_and_market
        grounds:
          - "state_machines.Offer.SUBMITTED_to_ACCEPTED"
          - "state_machines.Show.PLANNED_to_CONFIRMED"
          - "calculations.market_guarantee_exposure"
          - "entities.Artist.fields.confirmed_show_count"
          - "entities.Show.fields.committed_guarantee_cents"
          - "entities.Market.fields.exposure_utilization_pct"
        distinguishing_aspect: |
          DEPTH 3, triggered by POST /offers/{offer_id}/accept — a DIFFERENT trigger and a different
          chain shape from the sibling instance: the chain FANS OUT at level 3 (Offer -> Show ->
          {Artist, Market}) rather than running as a single file, and every hop is money- or
          count-committing rather than expense-recognising. The Show hop is caused by the Offer
          reaching ACCEPTED, and BOTH level-3 hops are caused by show_status becoming CONFIRMED
          (Artist.confirmed_show_count counts CONFIRMED/ON_SALE/PERFORMED shows;
          Market.committed_guarantee_cents sums committed guarantees over the same status set).
        test_recipe:
