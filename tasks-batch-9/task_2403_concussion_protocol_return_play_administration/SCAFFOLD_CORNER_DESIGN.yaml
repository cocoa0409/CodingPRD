        distinguishing_aspect: "Removal authority is not delegable: the shared create endpoint accepts a club physician for CLUB_MEDICAL_STAFF but refuses the same physician with trigger_source UNAFFILIATED_OBSERVER, so mandatory_removal cannot be self-declared by the club."
        test_recipe:
          setup: ["The canonical live week-1 game with K Mbeki baselined, clock 2026-09-13T18:05:00Z"]
