        distinguishing_aspect: "One finalize call must ripple four hops in order: scores land on the funds (hop 0), two funds leave CLEAR at the exact ladder boundaries 40.00 -> WATCH and 25.00 -> REMEDIATION (hop 1), their slots go ACTIVE -> AT_RISK (hop 2), 2 of 5 counted slots gives at_risk_slot_ratio exactly 0.4000 which is >= 0.2500 and < 0.5000 so the posture is RESTRICTED and not FROZEN (hop 3), and only the DRAFT proposal sitting on an AT_RISK slot is BLOCKED (hop 4). The three healthy funds and the untouched large-cap slot must be provably unaffected."
