  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_file_from_draft_past_window_state_wins
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.LienClaim.AMOUNT_LOCKED_to_FILED
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: the request violates
          both (claim is DRAFT, never locked; and the clock date 2026-12-01 is
          past any filing window), and the higher-priority state check must win,
          returning ERR_CLAIM_NOT_LOCKED rather than ERR_FILING_WINDOW_CLOSED.
          The companion instance exercises a different category pair
          (business_safety vs business_fiscal).
        test_recipe:
          setup:
            - "Verified CA project (contract 500000, extras 0, retainage 0) with ACTIVE span 2026-05-02..2026-06-10 and a DRAFT lien claim (never locked)"
            - "Logical clock at 2026-12-01T00:00:00Z — past the would-be filing window end 2026-09-08"
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "Prio Co", contact_email: "pr@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, comp_v: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 10000000, reason: "seed", expected_company_version: "${comp_v}" }, as: PlatformAdmin }
            - { call: "POST /lien/jurisdiction-rules", payload: { state_code: "CA", project_type: "COMMERCIAL_PRIVATE", prelim_notice_required: true, prelim_days: 20, prelim_day_basis: "CALENDAR", refused_counts_as_served: false, allowed_delivery_methods: ["CERTIFIED_MAIL", "PERSONAL_SERVICE"], filing_window_days: 90, foreclosure_deadline_days: 90, stop_notice_days: 30, bond_claim_days: 45, counts_punch_list: false, retainage_claimable: false, cap_mode: "UNCAPPED", interest_annual_rate: 0.10, bond_pct: 1.25, effective_from: "2026-01-01" }, as: PlatformAdmin }
            - { call: "POST /lien/projects", payload: { name: "Prio Job", state_code: "CA", county: "Butte", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 41", contract_value_cents: 500000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Pr Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "GC", legal_name: "G", address: "2 Pr Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "LENDER", legal_name: "L", address: "9 Ln" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_g_l: $.data.id } }
            - { call: "POST /lien/parties/${p_g_l}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_o}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/parties/${p_g}/decide", payload: { outcome: "VERIFIED" }, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent }
            - { call: "POST /lien/projects/${proj_id}/research-advance", payload: {}, as: OpsAgent, captures: { pv: $.data.version } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv}" }, as: CustomerAdmin, as_user_id: "${comp_id}" }
            - { call: "POST /lien/lien-claims", payload: { project_id: "${proj_id}" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { claim_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /lien/lien-claims/${claim_id}/file", payload: { filed_at: "2026-11-01" }, as: OpsAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_LOCKED (priority 5 state beats priority 8 business_temporal)"
            - "error_id != ERR_FILING_WINDOW_CLOSED"
            - "LienClaim.${claim_id}.status remains DRAFT"

      - name: notice_create_unverified_project_empty_balance_safety_wins
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: the request
          violates both (project research UNRESEARCHED; company balance 0 <
          fee), and the compliance gate must win, returning
