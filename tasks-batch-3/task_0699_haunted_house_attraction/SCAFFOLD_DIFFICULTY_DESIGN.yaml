              payload: { window_start: "2026-10-31T19:00:00Z", window_end: "2026-10-31T20:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:30:00Z", window_end: "2026-10-31T19:30:00Z", capacity: 10 }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent slot ${adj_id} starting at window_end 19:00 was created (201)"
            - "response error_id == ERR_SLOT_OVERLAP for the 18:30 slot"
            - "response http status == 409"

      - name: rto_actor_shift_buffered_interval_rest_gap
        grounds:
          - validations[priority=12]
          - entities.ActorShift.fields.shift_start
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: "ActorShifts for the same actor_user_id use a 30-minute REST BUFFER: a new shift starting 19:00 (existing ends 19:00) is rejected because 19:00 < 19:00+30min, but a shift starting 19:30 (exactly buffer away) is accepted. Buffered-interval semantics on the actor resource, distinct from the slot's zero-buffer adjacency."
        test_recipe:
          setup:
            - "Scare zone with one SCHEDULED shift [18:00,19:00) for actor-7."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/scare-zones"
              payload: { name: "Crypt Zone", min_actors: 1 }
              as: OpsManager
              captures: { zone_id: $.data.id }
            - call: "POST /scare-zones/${zone_id}/actor-shifts"
              payload: { actor_user_id: "actor-7", shift_start: "2026-10-31T18:00:00Z", shift_end: "2026-10-31T19:00:00Z" }
              as: OpsManager
            - call: "POST /scare-zones/${zone_id}/actor-shifts"
              payload: { actor_user_id: "actor-7", shift_start: "2026-10-31T19:30:00Z", shift_end: "2026-10-31T20:30:00Z" }
              as: OpsManager
              captures: { ok_shift_id: $.data.id }
          trigger:
            - call: "POST /scare-zones/${zone_id}/actor-shifts"
              payload: { actor_user_id: "actor-7", shift_start: "2026-10-31T19:00:00Z", shift_end: "2026-10-31T20:00:00Z" }
              as: OpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the 19:30 shift ${ok_shift_id} (exactly 30-min buffer) was created (201)"
            - "response error_id == ERR_SHIFT_OVERLAP for the 19:00 shift"
            - "response http status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_slot_occupancy_conserved_confirm_then_cancel
        grounds:
          - state_machines.Reservation.HELD_to_RESERVED
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - entities.TimeSlot.fields.reserved_count
        distinguishing_aspect: "Conserved quantity = slot occupancy (reserved_count + admitted_count). Confirm adds party_size to reserved_count; cancel of that RESERVED reservation subtracts the same; net (reserved_count + admitted_count) returns to its pre-confirm value 0. Quantity type: capacity units."
        test_recipe:
          setup:
            - "Fresh slot capacity 10, reserved_count 0; one HELD reservation of 2 GA tickets."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Conserve Guest", age: 30, email: "cons@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
          trigger:
            - call: "GET /time-slots/${slot_id}"
              payload: {}
              as: BoxOffice
              captures: { reserved_mid: $.data.reserved_count }
            - call: "POST /reservations/${r_id}/cancel"
              payload: {}
              as: BoxOffice
            - call: "GET /time-slots/${slot_id}"
              payload: {}
              as: BoxOffice
              captures: { reserved_after: $.data.reserved_count, admitted_after: $.data.admitted_count }
          assert:
            - "TimeSlot.${slot_id}.reserved_count == 2 immediately after confirm"
            - "TimeSlot.${slot_id}.reserved_count == 0 after cancel"
            - "TimeSlot.${slot_id}.reserved_count + admitted_count == 0 (returned to pre-confirm value)"

      - name: ci_money_conserved_pay_then_refund_wallet_plus_cash
        grounds:
          - state_machines.Reservation.UNPAID_to_PAID
          - state_machines.Reservation.PAID_to_REFUNDED
          - calculations.refund_credit
          - entities.Guest.fields.wallet_credit_cents
        distinguishing_aspect: "Conserved quantity = money (Guest.wallet_credit_cents + cash_paid for this reservation). Pay charges cash 2410 with wallet 0; cancel refunds 2410 to wallet. wallet_credit_cents + cash_outstanding returns to the pre-pay total 2410. Quantity type: cents, distinct from capacity units."
        test_recipe:
          setup:
            - "RESERVED+UNPAID reservation total 2410, guest wallet 0."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Money Guest", age: 30, email: "money@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/pay"
              payload: {}
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${r_id}/cancel"
              payload: {}
              as: BoxOffice
            - call: "GET /guests/${g_id}"
              payload: {}
              as: BoxOffice
              captures: { wallet_after: $.data.wallet_credit_cents }
          assert:
            - "Guest.${g_id}.wallet_credit_cents == 2410 after refund"
            - "Reservation.${r_id}.payment_status == REFUNDED"
            - "wallet_credit_cents + cash_outstanding == 2410 (pre-pay total preserved)"
