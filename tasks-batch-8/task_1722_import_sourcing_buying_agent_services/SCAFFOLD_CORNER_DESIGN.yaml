  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: audit_grade_band_boundaries
        claim_type: correct_result
        grounds: ["calculations.audit_score"]
        distinguishing_aspect: "Grade bands are lower-inclusive: a SCREENING audit scoring exactly 70 (70/70/70/70) is grade B, and one scoring 49 (qs40 sc50 pc55 fs50 -> 48.75 -> 49) is grade D — checked through audit creation only, no approval needed."
        test_recipe:
          setup: ["Agent a1, factory f1"]
          setup_api_calls:
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "F1", country_code: "CN", monthly_capacity_units: 1000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
          trigger:
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "SCREENING", quality_system_score: 70, social_compliance_score: 70, production_capability_score: 70, financial_stability_score: 70, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s70: "$.data.score", g70: "$.data.grade" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "SCREENING", quality_system_score: 40, social_compliance_score: 50, production_capability_score: 55, financial_stability_score: 50, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { s49: "$.data.score", g49: "$.data.grade" }
          assert:
            - "s70 == 70 and g70 == 'B' (70 >= 70 inclusive)"
            - "s49 == 48 and g49 == 'D' (40*.35+50*.25+55*.25+50*.15 = 14.00+12.50+13.75+7.50 = 47.75 -> round_half_up -> 48; 48 < 50)"

