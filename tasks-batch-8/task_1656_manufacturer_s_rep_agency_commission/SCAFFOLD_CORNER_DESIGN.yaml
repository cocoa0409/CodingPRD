  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: split_allocation_largest_remainder
        claim_type: correct_result
        grounds: ["calculations.split_waterfall"]
        distinguishing_aspect: "Largest-remainder allocation: 101c of line commission over 6000/4000 shares floors to 60/40 and the 1c residual goes to the largest share (R1) — entries 61 / 40, summing exactly to 101."
        test_recipe:
          setup: ["BASE; order PO-CENT with a single line CONNECTORS 1x1005 (commission round_half_up(100.5) = 101c)"]
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }], expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-CENT", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 1, unit_price_cents: 1005 }] }
              as: AgencyAdmin
              captures: { oc: $.data.id }
            - call: "POST /rep-agency/orders/${oc}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/orders/${oc}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          assert:
            - "line L1 commission_cents == 101 (round_half_up(100.5))"
            - "ACCRUAL for ${r1} == 61 (floor(60.6)=60 plus the 1c largest-remainder residual — 6000bp > 4000bp)"
            - "ACCRUAL for ${r2} == 40 (floor(40.4)); allocated cents sum exactly to 101"

      - name: draw_recovery_waterfall_floor_and_cap
        claim_type: correct_result
        grounds: ["calculations.draw_recovery_waterfall"]
        distinguishing_aspect: "Draw recovery = min(outstanding_draw, floor(gross x 5000/10000)): with gross 30,000c and draw 10,000c the cap binds (10,000 < 15,000 floor) — DRAW_RECOVERY -10,000, STATEMENT_PAYMENT -30,000, draw zeroed."
        test_recipe:
          setup: ["principal P3 with agreement [CO] + schedule CONNECTORS 1000bp tier0-only; rep R9 [CO] with outstanding_draw_cents 10000; customer C9 spec/ship CO; order PO-D CONNECTORS 60x5000 = 300,000c invoiced (sole rep -> ACCRUAL +30,000); statement 2026-08 matched exactly"]
