              payload: { loan_id: "${l}", carrier_name: "Foremost", policy_number: "FM-2026-77410", dwelling_coverage_cents: 4700000, wind_deductible_cents: 100000, wind_endorsement: true, effective_date: "2027-08-01T00:00:00Z", expiry_date: "2026-08-01T00:00:00Z", expected_loan_version: "${l_v0}" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
            - call: "GET /chattel/loans/${l}"
              payload: {}
              as: ClosingAgent
              captures: { l_v: "$.data.version" }
            - call: "POST /chattel/insurance-policies"
              payload: { loan_id: "${l}", carrier_name: "Foremost", policy_number: "FM-2026-77410", dwelling_coverage_cents: 4700000, wind_deductible_cents: 100000, wind_endorsement: true, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2027-08-01T00:00:00Z", expected_loan_version: "${l_v}" }
              as: ClosingAgent
              captures: { p: "$.data.id" }
          assert:
            - "${err} == ERR_STALE_LOAN_VERSION with HTTP 412"
            - "${err} is NOT ERR_INVALID_REQUEST even though the tendered expiry_date precedes the effective_date: priority 17 answers before the priority 42 date-order rule ever runs"
            - "${l_v} > ${l_v0} - submit-underwriting, approve and the RECORDED agency response each bumped the loan"
            - "the retry with ${l_v} and a corrected coverage interval returns HTTP 201"
            - "InsurancePolicy.${p}.status == ACTIVE, source == BORROWER_PROVIDED, required_coverage_cents == 4621122 and compliance_state == COMPLIANT"
            - "GET /chattel/insurance-policies?loan_id=${l} returns total_count 1 - the refused tender created nothing"

      - name: lot_rent_arrears_accelerate_the_default_threshold_at_two_months
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.delinquency_and_default_eligibility.constants.LOT_RENT_ACCELERATION_MONTHS
          - calculations.delinquency_and_default_eligibility.constants.LOT_RENT_ACCELERATION_DAYS
          - endpoints[POST /chattel/loans/{loan_id}/lot-rent-report]
        distinguishing_aspect: "The lot-rent counter is a cumulative threshold trigger with a hard boundary at two months: at one month reported the PERSONAL_PROPERTY threshold stays 60 days and default is refused at 30 delinquent days, while the second reported month drops the threshold to max(30, 60 - 30) == 30 and the identical default-declare call on the identical clock succeeds. The floor keeps acceleration from ever reaching below the 30-day delinquency threshold itself."
        test_recipe:
          setup:
            - "The chain-A funded community loan assessed at clock 2026-10-01, so servicing_state is DELINQUENT with exactly 30 delinquent days and lot_rent_months_delinquent 0."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/communities/${c}/operator-agreement"
              payload: { action: "PROPOSE" }
              as: PlatformAdmin
            - call: "POST /chattel/communities/${c}/operator-agreement"
              payload: { action: "EXECUTE" }
              as: CommunityOperator
              as_user_id: "${c}"
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "COMMUNITY", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 4600000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l: "$.data.id" }
            - call: "POST /chattel/loans/${l}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
            - call: "POST /chattel/loans/${l}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-uw-02"
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l}", filing_type: "TITLE_LIEN", submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
              captures: { f: "$.data.id" }
            - call: "POST /chattel/lien-filings/${f}/agency-response"
              payload: { outcome: "RECORDED", agency_reference: "GA-TL-88201" }
              as: PlatformAdmin
            - call: "GET /chattel/loans/${l}"
              payload: {}
              as: ClosingAgent
              captures: { l_v: "$.data.version" }
            - call: "POST /chattel/insurance-policies"
              payload: { loan_id: "${l}", carrier_name: "Foremost", policy_number: "FM-2026-77410", dwelling_coverage_cents: 4700000, wind_deductible_cents: 100000, wind_endorsement: true, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2027-08-01T00:00:00Z", expected_loan_version: "${l_v}" }
              as: ClosingAgent
            - call: "POST /chattel/loans/${l}/fund"
              payload: { first_due_date: "2026-09-01T00:00:00Z" }
              as: ClosingAgent
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chattel/loans/${l}/servicing-assessment"
              payload: {}
              as: Servicer
          trigger:
            - call: "POST /chattel/loans/${l}/lot-rent-report"
              payload: { months_delinquent: 1, lot_rent_state: "DELINQUENT" }
              as: CommunityOperator
              as_user_id: "${c}"
            - call: "POST /chattel/loans/${l}/default-declare"
              payload: {}
              as: RecoveryManager
              captures: { err: "$.data.error_id" }
            - call: "POST /chattel/loans/${l}/lot-rent-report"
              payload: { months_delinquent: 2, lot_rent_state: "EVICTION_FILED" }
              as: CommunityOperator
              as_user_id: "${c}"
            - call: "POST /chattel/loans/${l}/default-declare"
              payload: {}
              as: RecoveryManager
              captures: { case: "$.data.id" }
          assert:
            - "after the first report Loan.${l}.lot_rent_months_delinquent == 1 and lot_rent_state == DELINQUENT"
            - "${err} == ERR_DEFAULT_NOT_ELIGIBLE with HTTP 409 - one month of arrears is below LOT_RENT_ACCELERATION_MONTHS, so the threshold is still 60 days against 30 delinquent days"
            - "after the second report Loan.${l}.lot_rent_months_delinquent == 2 and lot_rent_state == EVICTION_FILED"
            - "the second default-declare returns HTTP 201 with the clock unmoved at 2026-10-01: the accelerated threshold is max(30, 60 - 30) == 30 and delinquent_days is exactly 30"
            - "RecoveryCase.${case}.path == REPOSSESSION and recovery_expense_cents == 185000"
            - "Loan.${l}.servicing_state == DEFAULT, ManufacturedUnit.${u}.recovery_hold == true and Borrower.${b}.units_under_recovery_hold_count == 1"
            - "Loan.${l}.interest_accrued_unpaid_cents == 98018 and fees_outstanding_cents == 3500 - neither lot-rent report and no default-declare touches the ledger"

      - name: cascading_side_effects_end_to_end
