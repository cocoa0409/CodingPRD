          - state_machines.EntryPermit.ACTIVE_to_SUSPENDED
          - state_machines.CleaningJob.ENTRY_IN_PROGRESS_to_PAUSED
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from POST /gas-free-certificates/{id}/revoke:
          cert REVOKED (A) causes permit ACTIVE->SUSPENDED (B); the last-open-
          permit suspension causes job ENTRY_IN_PROGRESS->PAUSED (C); the pause
          causes the job's SCHEDULED inspection -> CANCELLED (D). Each link is
          caused by the previous link, not by the original call.
