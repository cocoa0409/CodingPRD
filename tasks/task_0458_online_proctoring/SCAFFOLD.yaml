# =============================================================================
# Online Proctoring & Remote Exam (ProctorU-style) — Scaffold (§1.0–§1.7)
# Difficulty band: Expert (§0.4) — 12 entities
# =============================================================================

scenario: |
  Online Proctoring & Remote Exam (ProctorU style): exam scheduling & appointment,
  identity verification & room scan, live/record-and-review monitoring, lockdown
  browser & incident flag, test-window & accommodation, escalation & evidence
  review, integrity report to institution, retake authorization

domain_name: online-proctoring
api_prefix: ""   # flat topology: every entity is a top-level collection at the API root

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Escalation.version (review verdict) and Appointment.version (rebooking supersede)
    - cascading_side_effects        # session void -> escalation/report/retake chain
    - dual_variant_calculation      # integrity score LIVE vs RECORD_REVIEW; report PER_SESSION_ROUND vs RAW
    - rate_threshold_triggers       # integrity_score < 50 auto-void; proctor load_factor > 1.0 reject
    - derived_field_reconciliation  # session.integrity_score, appointment counters, proctor.active_session_count

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. Appointment,
  # ProctoringSession, IncidentFlag, Escalation, IntegrityReport, RetakeAuthorization
  # all reference each other by FK rather than nesting.

  state_machine_shape: branching
  # Appointment: branching with revert (SCHEDULED -> CHECKED_IN | NO_SHOW | CANCELLED; CHECKED_IN -> SCHEDULED on reschedule).
  # Escalation: branching fork-join (UNDER_REVIEW -> {UPHELD, DISMISSED}) with divergent side effects.
  # ProctoringSession: cyclic-capable (PAUSED <-> ACTIVE) plus auto-void threshold transition.

  relationship_patterns:
    - one_to_many       # Exam -> Appointment; Appointment -> ProctoringSession; Session -> IncidentFlag
    - cross_aggregate   # Escalation references Session + IncidentFlag; IntegrityReport references Session + Institution
    - flat_fk           # Accommodation references Candidate + Exam; RetakeAuthorization references Session + Appointment

  role_model: segregation_of_duties
  # The proctor who runs a session CANNOT review its own escalation (a different
  # ReviewOfficer must); the ReviewOfficer who upholds an escalation CANNOT also
  # author the retake authorization decision on the same session.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (12 entities)
# =============================================================================
entities:
  # ---- Configuration / tenants ----
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Institution name" }
      - { name: report_threshold_score, type: number, source: input, default: 70, description: "Aggregate integrity score below which a delivered IntegrityReport is flagged ESCALATED_TO_INSTITUTION", constraints: "0..100" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Proctor
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the institution this proctor serves" }
      - { name: full_name, type: string, source: input, description: "Proctor display name" }
      - { name: concurrent_capacity, type: integer, source: input, default: 4, description: "Max weighted concurrent sessions (see proctor_load_factor)", constraints: ">= 1" }
      - { name: active_session_count, type: integer, source: computed, description: "Count of ProctoringSession in {ACTIVE, PAUSED} assigned to this proctor" }
      - { name: load_factor, type: number, source: computed, description: "Weighted concurrent load / capacity (see calculations.proctor_load_factor), 4 dp" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SUSPENDED", default: "AVAILABLE", constraints: "AVAILABLE | SUSPENDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the candidate's enrolling institution" }
      - { name: full_name, type: string, source: input, description: "Candidate display name" }
      - { name: email, type: string, source: input, description: "Candidate email, unique within institution" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Exam
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; the owning institution" }
      - { name: title, type: string, source: input, description: "Exam title" }
      - { name: base_duration_minutes, type: integer, source: input, description: "Standard testing time before accommodations", constraints: ">= 1" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive earliest instant an appointment may start (ISO 8601 UTC)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Exclusive latest instant an appointment's effective window may end (ISO 8601 UTC)" }
      - { name: monitoring_mode, type: enum, source: input, description: "LIVE (real-time proctor) | RECORD_REVIEW (record-and-review)", constraints: "LIVE | RECORD_REVIEW" }
      - { name: lockdown_required, type: boolean, source: input, default: true, description: "If true, identity verification room scan must pass before session may start" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: "OPEN", constraints: "OPEN | CLOSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: Accommodation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the candidate granted the accommodation" }
      - { name: exam_id, type: string, source: input, description: "FK -> Exam.id; the exam the accommodation applies to" }
      - { name: extra_time_pct, type: integer, source: input, description: "Extra testing-time percentage added to base duration", default: 0, constraints: "0..100" }
      - { name: status, type: enum, source: system, description: "APPROVED | REVOKED", default: "APPROVED", constraints: "APPROVED | REVOKED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  # ---- Operational resources ----
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: exam_id, type: string, source: input, description: "FK -> Exam.id; the exam being sat" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the test-taker" }
      - { name: proctor_id, type: string, source: input, description: "FK -> Proctor.id; the assigned proctor (LIVE) or reviewer-of-record (RECORD_REVIEW)" }
      - { name: accommodation_id, type: string, source: input, description: "FK -> Accommodation.id; applied accommodation, null if none" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Requested start instant (ISO 8601 UTC)" }
      - { name: effective_duration_minutes, type: integer, source: computed, description: "Total occupied minutes incl. accommodation + setup (see appointment_effective_window)" }
      - { name: effective_end_utc, type: datetime, source: computed, description: "scheduled_start_utc + effective_duration_minutes" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | NO_SHOW | CANCELLED | CONSUMED", default: "SCHEDULED", constraints: "SCHEDULED | CHECKED_IN | NO_SHOW | CANCELLED | CONSUMED" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> Appointment.id; set when this appointment was rebooked into a replacement, null otherwise" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: IdentityVerification
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the appointment being verified" }
      - { name: photo_id_match, type: boolean, source: input, description: "Whether the photo-ID check passed" }
      - { name: room_scan_clear, type: boolean, source: input, description: "Whether the 360° room scan was clear of prohibited materials" }
      - { name: result, type: enum, source: computed, description: "PASS if photo_id_match AND room_scan_clear else FAIL", constraints: "PASS | FAIL" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; append-only record" }

  - name: ProctoringSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the appointment this session realises" }
      - { name: proctor_id, type: string, source: system, description: "FK -> Proctor.id; copied from the appointment at start" }
      - { name: monitoring_mode, type: enum, source: system, description: "LIVE | RECORD_REVIEW; copied from the exam at start", constraints: "LIVE | RECORD_REVIEW" }
      - { name: integrity_score, type: number, source: computed, description: "100 minus weighted incident penalties (see session_integrity_score), 2 dp" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | COMPLETED | VOIDED | REVIEW_HELD", default: "ACTIVE", constraints: "ACTIVE | PAUSED | COMPLETED | VOIDED | REVIEW_HELD" }
      - { name: void_reason, type: enum, source: system, description: "AUTO_THRESHOLD | ESCALATION_UPHELD | null", constraints: "AUTO_THRESHOLD | ESCALATION_UPHELD" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: IncidentFlag
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: session_id, type: string, source: input, description: "FK -> ProctoringSession.id; the session the flag was raised on" }
      - { name: kind, type: enum, source: input, description: "LOCKDOWN_BREACH | GAZE_OFF_SCREEN | SECOND_FACE | PROHIBITED_MATERIAL | NETWORK_DROP", constraints: "LOCKDOWN_BREACH | GAZE_OFF_SCREEN | SECOND_FACE | PROHIBITED_MATERIAL | NETWORK_DROP" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL", constraints: "MINOR | MAJOR | CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED", default: "OPEN", constraints: "OPEN | ESCALATED | RESOLVED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; raised-at instant, drives chronological replay" }

  - name: Escalation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: session_id, type: string, source: input, description: "FK -> ProctoringSession.id; the session under review" }
      - { name: incident_flag_id, type: string, source: input, description: "FK -> IncidentFlag.id; the triggering flag" }
      - { name: opened_by_proctor_id, type: string, source: system, description: "FK -> Proctor.id; the session proctor who raised the escalation" }
      - { name: review_officer_id, type: string, source: system, description: "FK -> Proctor.id; the ReviewOfficer who took the case, null until claimed" }
      - { name: verdict, type: enum, source: system, description: "UPHELD | DISMISSED | null until decided", constraints: "UPHELD | DISMISSED" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | UPHELD | DISMISSED", default: "OPEN", constraints: "OPEN | UNDER_REVIEW | UPHELD | DISMISSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: IntegrityReport
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: institution_id, type: string, source: input, description: "FK -> Institution.id; recipient institution" }
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; subject candidate" }
      - { name: exam_id, type: string, source: input, description: "FK -> Exam.id; the report's primary-exam subject" }
      - { name: session_ids, type: array, source: input, description: "Array of ProctoringSession.id included in the report; each must be terminal and its appointment must belong to report.candidate_id + report.institution_id (sessions may span that candidate's exams)" }
      - { name: aggregate_score, type: number, source: computed, description: "Per-session-rounded mean integrity score (see report_aggregate_score), 2 dp" }
      - { name: disposition, type: enum, source: computed, description: "CLEARED if aggregate_score >= institution.report_threshold_score else ESCALATED_TO_INSTITUTION", constraints: "CLEARED | ESCALATED_TO_INSTITUTION" }
      - { name: status, type: enum, source: system, description: "DRAFT | DELIVERED", default: "DRAFT", constraints: "DRAFT | DELIVERED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

  - name: RetakeAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: voided_session_id, type: string, source: input, description: "FK -> ProctoringSession.id; the VOIDED session this retake remedies" }
      - { name: original_appointment_id, type: string, source: system, description: "FK -> Appointment.id; the appointment of the voided session" }
      - { name: replacement_appointment_id, type: string, source: system, description: "FK -> Appointment.id; the rebooked appointment, null until rebooked" }
      - { name: authorized_by_id, type: string, source: system, description: "FK -> Proctor.id; the ReviewOfficer who authorized the retake" }
      - { name: status, type: enum, source: system, description: "AUTHORIZED | REBOOKED | EXPIRED", default: "AUTHORIZED", constraints: "AUTHORIZED | REBOOKED | EXPIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 per mutation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Exam
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /exams/{exam_id}/close"
        actor: SchedulingCoordinator
        preconditions:
          - "No Appointment for this exam in status {SCHEDULED, CHECKED_IN}"
        side_effects:
          - "Exam no longer accepts new appointments (creation blocked with ERR_EXAM_CLOSED)"

  - entity: Appointment
    field: status
    initial_state: SCHEDULED
    terminal_states: [NO_SHOW, CANCELLED, CONSUMED]
    note: "Branching with revert: CHECKED_IN can revert to SCHEDULED via reschedule; CONSUMED set when its session reaches a terminal state."
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /appointments/{appointment_id}/check-in"
        actor: Candidate
        preconditions:
          - "Now (logical clock) >= appointment.scheduled_start_utc"
          - "Exam.lockdown_required == false OR an IdentityVerification with result=PASS exists for this appointment"
          - "appointment.status == SCHEDULED"
        side_effects:
          - "No counter change; gates session start"

      - from: CHECKED_IN
        to: CONSUMED
        trigger: "system: ProctoringSession for this appointment reaches COMPLETED or VOIDED"
        actor: system
        preconditions:
          - "The appointment's ProctoringSession is in {COMPLETED, VOIDED}"
        side_effects:
          - "Appointment locked from further check-in / reschedule"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{appointment_id}/mark-no-show"
        actor: Proctor
        preconditions:
          - "Now (logical clock) >= appointment.effective_end_utc"
          - "appointment.status == SCHEDULED"
        side_effects:
          - "Proctor freed (no active session was created)"

      - from: [SCHEDULED, CHECKED_IN]
        to: CANCELLED
        trigger: "POST /appointments/{appointment_id}/cancel"
        actor: SchedulingCoordinator
        preconditions:
          - "No ProctoringSession in {ACTIVE, PAUSED} for this appointment"
        side_effects:
          - "If a session exists in non-terminal state it must be voided first (ERR_SESSION_IN_PROGRESS)"

      - from: CONSUMED
        to: CONSUMED
        trigger: "POST /retake-authorizations/{retake_id}/rebook (supersede-in-place: the CONSUMED original of a voided session gets a replacement)"
        actor: SchedulingCoordinator
        note: "Status-preserving self-edge: the original stays CONSUMED (it already ran and was voided); only superseded_by_id and version change. This is the OCC parent for the rebook."
        preconditions:
          - "appointment.status == CONSUMED AND appointment.superseded_by_id == null (not already superseded)"
          - "expected_appointment_version matches original appointment.version (OCC; see concurrency_rules.rebook-supersede-stale-appointment)"
          - "RetakeAuthorization.status == AUTHORIZED"
          - "Replacement appointment effective window fits inside Exam window and does not overlap proctor's other appointments or the candidate's other same-exam appointments"
        side_effects:
          - "Creates a NEW Appointment (the replacement) in SCHEDULED for the same exam+candidate"
          - "Sets original.superseded_by_id = replacement.id; increments original Appointment.version by 1 (status stays CONSUMED)"
          - "RetakeAuthorization -> REBOOKED, replacement_appointment_id set"

  - entity: ProctoringSession
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, VOIDED]
    note: "Cyclic ACTIVE<->PAUSED for network drops; threshold auto-void; REVIEW_HELD is a non-terminal hold pending escalation."
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /sessions/{session_id}/pause"
        actor: Proctor
        preconditions:
          - "session.status == ACTIVE"
        side_effects:
          - "Clock for integrity unaffected; proctor.active_session_count unchanged (PAUSED still counts toward load)"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /sessions/{session_id}/resume"
        actor: Proctor
        preconditions:
          - "session.status == PAUSED"
        side_effects: []

      - from: ACTIVE
        to: REVIEW_HELD
        trigger: "system: an Escalation is opened on this session (POST /escalations)"
        actor: system
        preconditions:
          - "session.status in {ACTIVE, PAUSED}"
        side_effects:
          - "Session monitoring frozen pending review; triggering IncidentFlag.status -> ESCALATED"

      - from: REVIEW_HELD
        to: ACTIVE
        trigger: "system: the Escalation on this session is DISMISSED"
        actor: system
        preconditions:
          - "All Escalations on this session are in {DISMISSED} (none OPEN/UNDER_REVIEW)"
        side_effects:
          - "Session resumes; the dismissed flag's IncidentFlag.status -> RESOLVED; integrity_score recomputed"

      - from: [ACTIVE, PAUSED]
        to: VOIDED
        trigger: "system: session_integrity_score drops below 50 after an IncidentFlag is raised (POST /sessions/{session_id}/flags)"
        actor: system
        preconditions:
          - "session_integrity_score < 50 (strict)"
        side_effects:
          - "void_reason = AUTO_THRESHOLD"
          - "Appointment for this session -> CONSUMED"
          - "proctor.active_session_count recomputed (this session no longer counted); proctor.load_factor recomputed"
          - "All OPEN IncidentFlags on this session -> RESOLVED"

      - from: REVIEW_HELD
        to: VOIDED
        trigger: "system: the Escalation on this session is UPHELD (POST /escalations/{escalation_id}/decide with verdict=UPHELD)"
        actor: system
        preconditions:
          - "Escalation.verdict == UPHELD"
        side_effects:
          - "void_reason = ESCALATION_UPHELD"
          - "Appointment for this session -> CONSUMED"
          - "Triggering IncidentFlag.status -> RESOLVED"
          - "proctor.active_session_count and proctor.load_factor recomputed"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /sessions/{session_id}/complete"
        actor: Proctor
        preconditions:
          - "session.status == ACTIVE"
          - "No Escalation on this session in {OPEN, UNDER_REVIEW}"
        side_effects:
          - "Final integrity_score frozen"
          - "Appointment for this session -> CONSUMED"
          - "proctor.active_session_count and proctor.load_factor recomputed"

  - entity: Escalation
    field: status
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    note: "Branching fork-join: UNDER_REVIEW -> {UPHELD, DISMISSED} with divergent side-effect sets per branch."
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /escalations/{escalation_id}/claim"
        actor: ReviewOfficer
        preconditions:
          - "Acting ReviewOfficer (X-User-ID) != escalation.opened_by_proctor_id (segregation of duties)"
          - "escalation.status == OPEN"
        side_effects:
          - "review_officer_id = acting proctor id"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /escalations/{escalation_id}/decide with verdict=UPHELD"
        actor: ReviewOfficer
        preconditions:
          - "Acting ReviewOfficer == escalation.review_officer_id"
          - "expected_escalation_version matches escalation.version (OCC; see concurrency_rules.decide-stale-escalation)"
        side_effects:
          - "verdict = UPHELD; increments Escalation.version by 1"
          - "Session REVIEW_HELD -> VOIDED (void_reason=ESCALATION_UPHELD) — see ProctoringSession REVIEW_HELD->VOIDED"
          - "A RetakeAuthorization is NOT auto-created (created explicitly via POST /retake-authorizations)"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /escalations/{escalation_id}/decide with verdict=DISMISSED"
        actor: ReviewOfficer
        preconditions:
          - "Acting ReviewOfficer == escalation.review_officer_id"
          - "expected_escalation_version matches escalation.version (OCC; see concurrency_rules.decide-stale-escalation)"
        side_effects:
          - "verdict = DISMISSED; increments Escalation.version by 1"
          - "Session REVIEW_HELD -> ACTIVE — see ProctoringSession REVIEW_HELD->ACTIVE; triggering IncidentFlag -> RESOLVED; integrity_score recomputed"

  - entity: IntegrityReport
    field: status
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: DELIVERED
        trigger: "POST /integrity-reports/{report_id}/deliver"
        actor: SchedulingCoordinator
        preconditions:
          - "All ProctoringSession in report.session_ids are terminal {COMPLETED, VOIDED}"
        side_effects:
          - "aggregate_score and disposition frozen (see report_aggregate_score)"
          - "If disposition == ESCALATED_TO_INSTITUTION the report is surfaced to the institution"

  - entity: RetakeAuthorization
    field: status
    initial_state: AUTHORIZED
    terminal_states: [REBOOKED, EXPIRED]
    transitions:
      - from: AUTHORIZED
        to: REBOOKED
        trigger: "POST /retake-authorizations/{retake_id}/rebook"
        actor: SchedulingCoordinator
        preconditions:
          - "retake.status == AUTHORIZED"
          - "Original (CONSUMED) appointment still present, not already superseded, and rebook OCC precondition holds (see Appointment CONSUMED->CONSUMED rebook self-edge)"
        side_effects:
          - "replacement_appointment_id set; original appointment superseded in place (see Appointment CONSUMED->CONSUMED rebook transition)"

      - from: AUTHORIZED
        to: EXPIRED
        trigger: "POST /retake-authorizations/{retake_id}/expire"
        actor: SchedulingCoordinator
        preconditions:
          - "retake.status == AUTHORIZED"
        side_effects:
          - "Retake window closed; no replacement appointment may be created"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: decide-stale-escalation
    parent_entity: Escalation
    write_endpoint: "POST /escalations/{escalation_id}/decide"
    occ_field: "expected_escalation_version"
    description: |
      Deciding an Escalation whose version has advanced since the ReviewOfficer
      last observed it is rejected. Captures the case where a prior claim or a
      sibling write already advanced the escalation's version, making the
      current officer's view stale; the decision is rejected on the stale
      version rather than overwriting the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rebook-supersede-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /retake-authorizations/{retake_id}/rebook"
    occ_field: "expected_appointment_version"
    description: |
      Rebooking against an original Appointment whose version has advanced since
      the coordinator last observed it is rejected. Captures the case where the
      original appointment was already superseded (its superseded_by_id set and
      version bumped) by an earlier rebook; the second rebook carrying the prior
      observed version is rejected as stale rather than creating a duplicate
      replacement.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: appointment_effective_window
    trigger: "Appointment create (POST /appointments); recomputed if accommodation status changes before check-in"
    algorithm: threshold
    formula: |
      # Combinatorial mode (a): >=3 inputs, ceil + conditional branch on accommodation presence.
      base = Exam.base_duration_minutes
      extra_pct = (accommodation_id != null AND Accommodation.status == APPROVED)
                    ? Accommodation.extra_time_pct : 0
      core_minutes = ceil( base * (1 + extra_pct / 100) )     # ceil applied to the accommodated core only
      effective_duration_minutes = core_minutes + SETUP_MINUTES
      effective_end_utc = scheduled_start_utc + effective_duration_minutes
    input_set: "Single Appointment; Exam.base_duration_minutes; Accommodation.extra_time_pct only when status==APPROVED."
    constants:
      SETUP_MINUTES: 10
    precision: "Integer minutes; ceil applied to (base * (1 + extra_pct/100)) BEFORE adding SETUP_MINUTES."
    variants:
      - name: with_approved_accommodation
        when: "accommodation_id present AND Accommodation.status == APPROVED"
        difference: "extra_time_pct added to base before ceil; e.g. base 120 + 50% -> ceil(180)+10 = 190."
      - name: without_accommodation
        when: "accommodation_id null OR Accommodation.status == REVOKED"
        difference: "extra_pct treated as 0; e.g. base 120 -> ceil(120)+10 = 130."

  - name: session_integrity_score
    trigger: "IncidentFlag created (POST /sessions/{id}/flags); Escalation DISMISSED (flag removed from penalty set); session complete"
    algorithm: weighted_scoring
    formula: |
      # Dual-variant on ProctoringSession (entity domain: Session). Order of operations pinned.
      penalty = 0
      for each IncidentFlag f on the session with status IN {OPEN, ESCALATED}:
        w = SEVERITY_WEIGHT[f.severity]
        if session.monitoring_mode == RECORD_REVIEW and f.severity == MINOR:
          w = w * 0.5                      # record-and-review halves MINOR weight only
        penalty = penalty + w
      integrity_score = max(0, 100 - penalty)
      # RESOLVED and (for DISMISSED escalations) cleared flags are excluded from penalty.
    input_set: "IncidentFlags on the session with status IN {OPEN, ESCALATED}; RESOLVED flags excluded."
    constants:
      SEVERITY_WEIGHT: { MINOR: 5, MAJOR: 15, CRITICAL: 40 }
      AUTO_VOID_THRESHOLD: 50
    precision: "2 decimal places, round_half_up; penalty summed first, then subtracted from 100."
    variants:
      - name: live_mode
        when: "session.monitoring_mode == LIVE"
        difference: "Full severity weight for every flag incl. MINOR; e.g. 1 MINOR + 1 MAJOR -> 100-(5+15)=80.00."
      - name: record_review_mode
        when: "session.monitoring_mode == RECORD_REVIEW"
        difference: "MINOR weight halved; e.g. 1 MINOR + 1 MAJOR -> 100-(2.5+15)=82.50."

  - name: proctor_load_factor
    trigger: "Session start (Appointment check-in path creating ACTIVE session); session complete/void; pause/resume (no change)"
    algorithm: aggregation
    formula: |
      # Risk scoring on a DIFFERENT entity domain (Proctor), satisfying dual-variant rule 1.
      weighted = 0.0
      for each ProctoringSession s assigned to proctor with status IN {ACTIVE, PAUSED}:
        weighted = weighted + MODE_WEIGHT[s.monitoring_mode]
      load_factor = weighted / proctor.concurrent_capacity
      active_session_count = count of those sessions
    input_set: "ProctoringSessions assigned to the proctor in status {ACTIVE, PAUSED} (PAUSED still counts)."
    constants:
      MODE_WEIGHT: { LIVE: 1.0, RECORD_REVIEW: 0.4 }
      MAX_LOAD_FACTOR: 1.0
    precision: "load_factor rounded to 4 decimal places, round_half_up."
    variants:
      - name: admission_check
        when: "evaluated BEFORE admitting a new LIVE session"
        difference: "Prospective load (including the candidate session) must be <= MAX_LOAD_FACTOR (1.0); 1.0 admitted, > 1.0 rejected ERR_PROCTOR_OVERLOADED."
      - name: reporting_snapshot
        when: "evaluated AFTER a transition for the denormalized Proctor.load_factor field"
        difference: "Reflects only currently-counted sessions; excludes the session that just terminated."

  - name: report_aggregate_score
    trigger: "IntegrityReport deliver (POST /integrity-reports/{id}/deliver)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): nested rounding where order matters. Order is PINNED.
      scores = [ ProctoringSession.integrity_score for id in report.session_ids ]
      # PER_SESSION_ROUND: round each session score to nearest integer (round_half_up) FIRST,
      # then take the arithmetic mean, then round the mean to 2 dp (round_half_up).
      rounded = [ round_half_up(s, 0) for s in scores ]
      aggregate_score = round_half_up( sum(rounded) / len(rounded), 2 )
      disposition = (aggregate_score >= Institution.report_threshold_score)
                      ? CLEARED : ESCALATED_TO_INSTITUTION
    input_set: "All ProctoringSessions in report.session_ids (each must be terminal). Empty session_ids rejected ERR_EMPTY_REPORT."
    constants:
      ROUND_ORDER: "PER_SESSION_ROUND"   # round each session to integer BEFORE averaging
    precision: "Per-session: round_half_up to 0 dp; final mean: round_half_up to 2 dp."
    variants:
      - name: per_session_round_pinned
        when: "always (the pinned production order)"
        difference: "Round each session score to integer first; e.g. [80.0,82.5,60.0] -> [80,83,60] -> mean 74.33."
      - name: raw_then_round_rejected
        when: "the tempting-but-wrong alternative an implementer might pick"
        difference: "Averaging raw then rounding gives [80.0,82.5,60.0] -> 222.5/3 -> 74.17; this order is NOT used."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource in the path and FK body fields exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "FK targets are mutually consistent: Accommodation.candidate matches Appointment.candidate and Accommodation.exam matches Appointment.exam; every report session's appointment belongs to report.candidate_id and report.institution_id (a report may span that candidate's sessions across exams; exam_id is the report's primary-exam subject)"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /integrity-reports"

  - priority: 5
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: a ReviewOfficer cannot claim/decide an escalation they opened as proctor; the upholding ReviewOfficer cannot author the retake on the same session"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /escalations/{id}/claim, POST /escalations/{id}/decide, POST /retake-authorizations"

  - priority: 7
    category: business_safety
    check: "Lockdown gate: when Exam.lockdown_required, session may not start unless an IdentityVerification with result=PASS exists for the appointment"
    error_id: ERR_LOCKDOWN_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 8
    category: business_temporal
    check: "Appointment effective window [scheduled_start_utc, effective_end_utc) must fit inside [Exam.window_start_utc, Exam.window_end_utc)"
    error_id: ERR_OUTSIDE_TEST_WINDOW
    http_status: 422
    applies_to: "POST /appointments, POST /retake-authorizations/{id}/rebook"

  - priority: 9
    category: business_temporal
    check: "Appointment effective window must not overlap another non-terminal appointment of the SAME proctor (half-open intervals; touching endpoints allowed)"
    error_id: ERR_PROCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments, POST /retake-authorizations/{id}/rebook"

  - priority: 10
    category: business_temporal
    check: "Candidate may not hold two appointments with overlapping effective windows for the SAME exam (closed-interval: a 0-minute gap between back-to-back sittings is still rejected as a collision)"
    error_id: ERR_CANDIDATE_OVERLAP
    http_status: 409
    applies_to: "POST /appointments, POST /retake-authorizations/{id}/rebook"

  - priority: 11
    category: business_constraint
    check: "Proctor prospective load_factor including the new session must be <= MAX_LOAD_FACTOR (1.0)"
    error_id: ERR_PROCTOR_OVERLOADED
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 12
    category: business_constraint
    check: "Report session_ids must be non-empty and every session terminal"
    error_id: ERR_EMPTY_REPORT
    http_status: 422
    applies_to: "POST /integrity-reports, POST /integrity-reports/{id}/deliver"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /escalations/{id}/decide, POST /retake-authorizations/{id}/rebook"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Institution ----
  - method: POST
    path: "/institutions"
    description: "Create an institution"
    roles: [SchedulingCoordinator]
    code: 201
    input: [name, "report_threshold_score?"]
