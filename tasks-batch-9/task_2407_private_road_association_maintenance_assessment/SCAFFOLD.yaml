    roles: [MemberOwner, AssociationSecretary]
    code: 201
    input: [parcel_id, requested_usage_class, requested_trips_per_day, easement_grant_recorded]
    output: ConnectionRequest
    side_effects: ["status = SUBMITTED; no fee is computed until approval"]
  - method: GET
    path: "/connection-requests/{request_id}"
    description: "Read one connection request including the fee and reserve buy-in computed at approval"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: []
    output: ConnectionRequest
    side_effects: []
  - method: GET
    path: "/parcels/{parcel_id}/connection-requests"
    description: "List connection requests for a lot, ordered by created_at ASC"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ConnectionRequest[]
    side_effects: []
  - method: GET
    path: "/connection-requests"
    description: "List connection requests across lots, filterable by lot and status, ordered by created_at ASC"
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, MemberOwner]
    code: 200
    input: ["parcel_id?", "status?", "limit?", "offset?"]
    output: ConnectionRequest[]
    side_effects: []
  - method: POST
    path: "/connection-requests/{request_id}/decide"
    description: "Approve, deny, or defer the request into an easement dispute"
    roles: [AssociationSecretary]
    code: 200
    input: [outcome, "dispute_reason?"]
    output: ConnectionRequest
    side_effects:
      - "APPROVED: connection_fee_cents and reserve_buyin_cents computed; lot -> ACTIVE with covenant_recorded true; a CONNECTION_FEE charge is created on the latest LEVIED roll billed to the parent parcel's member; reserve credited and posture recomputed"
      - "DENIED: lot -> WITHDRAWN; no fee, no charge, no reserve movement"
      - "DISPUTED: dispute_reason recorded; lot stays PENDING_CONNECTION"
  - method: POST
    path: "/connection-requests/{request_id}/resolve-dispute"
    description: "Record the easement resolution and return the request to SUBMITTED for a fresh decision"
    roles: [AssociationSecretary]
    code: 200
    input: [easement_grant_recorded, resolution_note]
    output: ConnectionRequest
    side_effects: ["status -> SUBMITTED; easement_grant_recorded overwritten; resolution_note recorded; dispute_reason -> null"]

  # ---------------- test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time; every due date, grace period, balloting window and restriction interval is evaluated against this logical clock."
    roles: [AssociationSecretary, AssessmentClerk, BoardTreasurer, RoadCommissioner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, blank, or not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a MemberOwner acts on a ballot, charge or connection request that is not tied to its own membership, or a Contractor withdraws another firm's bid"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the awarding user created the project, or the effectuating user initiated the delinquency action"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, non-integral integer, negative amount, malformed ISO date, limit outside 1..100, offset below 0, or subdivide children with fewer than 2 entries"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "start is not strictly before end, balloting_closes_at is not after the clock, completed_at precedes window_start_date, or a restriction interval falls outside the charge's fiscal year"
  - id: ERR_ASSOCIATION_NOT_FOUND
    http: 404
    condition: "association_id does not resolve"
  - id: ERR_ROAD_SEGMENT_NOT_FOUND
    http: 404
    condition: "road_segment_id or segment_id does not resolve"
  - id: ERR_PARCEL_NOT_FOUND
    http: 404
    condition: "parcel_id does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id does not resolve"
  - id: ERR_ROLL_NOT_FOUND
    http: 404
    condition: "roll_id does not resolve, or a SPECIAL or CONNECTION_FEE charge is required but the association has no LEVIED roll"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "charge_id does not resolve"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "proposal_id does not resolve"
  - id: ERR_BALLOT_NOT_FOUND
    http: 404
    condition: "ballot_id does not resolve"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "project_id does not resolve"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "bid_id does not resolve"
  - id: ERR_DELINQUENCY_ACTION_NOT_FOUND
    http: 404
    condition: "action_id does not resolve"
  - id: ERR_CONNECTION_REQUEST_NOT_FOUND
    http: 404
    condition: "request_id does not resolve"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the project's current version"
  - id: ERR_STALE_PROPOSAL_VERSION
    http: 412
    condition: "expected_proposal_version does not equal the proposal's current version"
  - id: ERR_STALE_PARCEL_VERSION
    http: 412
    condition: "expected_parcel_version does not equal the parcel's current version"
  - id: ERR_ROLL_NOT_DRAFT
    http: 409
    condition: "certification attempted on a roll that is CERTIFIED or LEVIED"
  - id: ERR_ROLL_NOT_CERTIFIED
    http: 409
    condition: "recall or levy attempted on a roll that is DRAFT or LEVIED"
  - id: ERR_CERTIFIED_ROLL_LOCKED
    http: 409
    condition: "parcel reclassification or subdivision attempted while a roll of the association is CERTIFIED"
  - id: ERR_PARCEL_NOT_ACTIVE
    http: 409
    condition: "reclassification or subdivision of a parcel that is not ACTIVE, or a connection decision on a parcel that is not PENDING_CONNECTION"
  - id: ERR_MEMBER_ALREADY_VERIFIED
    http: 409
    condition: "verify-deed called on a member whose standing_status is no longer PENDING_DEED_VERIFICATION"
  - id: ERR_CHARGE_NOT_COLLECTIBLE
    http: 409
    condition: "payment, delinquency action or effectuation against a charge that is PENDING, PAID or VOIDED, or whose balance_cents is 0"
  - id: ERR_PROPOSAL_NOT_DRAFT
    http: 409
    condition: "open-balloting attempted on a proposal that is BALLOTING, ADOPTED or REJECTED"
  - id: ERR_PROPOSAL_NOT_BALLOTING
    http: 409
    condition: "ballot cast, ballot revoke, or tally attempted on a proposal that is not BALLOTING"
  - id: ERR_PROPOSAL_NOT_ADOPTED
    http: 409
    condition: "a project cites a proposal_id whose proposal is not ADOPTED"
  - id: ERR_BALLOT_NOT_CAST
    http: 409
    condition: "revoke attempted on a ballot that is SUPERSEDED, REVOKED or VOIDED"
  - id: ERR_PROJECT_NOT_IN_SOLICITATION
    http: 409
    condition: "bid submission or award attempted on a project that is AWARDED, COMPLETE or CANCELLED"
  - id: ERR_PROJECT_NOT_AWARDED
    http: 409
    condition: "completion attempted on a project that is not AWARDED"
  - id: ERR_BID_NOT_ACTIVE
    http: 409
    condition: "award of a bid that is not SUBMITTED, or withdrawal of a bid that is SUPERSEDED, REJECTED or already WITHDRAWN"
  - id: ERR_ACTION_NOT_INITIATED
    http: 409
    condition: "effectuation attempted on a remedy that is EFFECTIVE, RELEASED or VOIDED"
  - id: ERR_ACTION_ALREADY_CLOSED
    http: 409
    condition: "release attempted on a remedy that is already RELEASED or VOIDED"
  - id: ERR_REQUEST_NOT_PENDING
    http: 409
    condition: "decide on a request that is not SUBMITTED (except DENIED from DISPUTED), or resolve-dispute on a request that is not DISPUTED"
  - id: ERR_EMERGENCY_ACCESS_DEFICIENT
    http: 409
    condition: "PAVING award or ACCESS_RESTRICTION effectuation on a segment whose emergency_access_grade is not COMPLIANT, or connection approval on a segment graded DEFICIENT"
  - id: ERR_BOND_NOT_ON_FILE
    http: 409
    condition: "the bid being awarded has bond_on_file == false"
  - id: ERR_DEED_MISMATCH
    http: 409
    condition: "verified_deed_book_page differs from the member's or the parcel's recorded deed book and page"
  - id: ERR_MEMBERSHIP_ROLL_INCOMPLETE
    http: 409
    condition: "certification attempted while an ACTIVE covenant-recorded parcel has no member or an unverified member"
  - id: ERR_PARENT_MEMBER_NOT_FOUND
    http: 409
    condition: "a connection request names a parcel with no subdivision parent, or the parent parcel has no verified member to bill"
  - id: ERR_EASEMENT_NOT_RECORDED
    http: 409
    condition: "approval attempted while easement_grant_recorded is false"
  - id: ERR_DUPLICATE_MEMBER_FOR_PARCEL
    http: 409
    condition: "a second Member row is created for a parcel that already carries one"
  - id: ERR_COVENANT_NOT_RECORDED
    http: 409
    condition: "a membership or ballot is attached to a parcel whose covenant_recorded is false"
  - id: ERR_BID_PROJECT_MISMATCH
    http: 409
    condition: "the bid_id supplied to award belongs to a different project"
  - id: ERR_PROPOSAL_SEGMENT_MISMATCH
    http: 409
    condition: "the cited proposal covers a different road segment, or its project_type differs from the project's category"
  - id: ERR_NO_ASSESSABLE_PARCELS
    http: 409
    condition: "certification attempted with an empty assessable parcel set (total_share_units would be 0)"
  - id: ERR_FRONTAGE_MISMATCH
    http: 422
    condition: "the children's frontage_feet do not sum exactly to the parent parcel's frontage_feet"
  - id: ERR_NOT_LOWEST_RESPONSIVE_BID
    http: 409
    condition: "the supplied bid is not the lowest bonded SUBMITTED bid, or no responsive bid exists on the project"
  - id: ERR_INSUFFICIENT_BIDS
    http: 409
    condition: "a bid at or above 1000000 cents is awarded with fewer than 3 responsive bids on file"
  - id: ERR_FISCAL_YEAR_ROLL_EXISTS
    http: 409
    condition: "the association already has a roll for that fiscal_year"
  - id: ERR_FISCAL_INTERVAL_OVERLAP
    http: 409
    condition: "the roll's inclusive fiscal interval overlaps an existing roll's interval by at least one day"
  - id: ERR_WORK_WINDOW_CONFLICT
    http: 409
    condition: "the project's half-open work window intersects another non-terminal window on the same segment"
  - id: ERR_PAVING_CURE_BUFFER_VIOLATION
    http: 409
    condition: "the window starts within 3 days after a paving project's window_end_date on the same segment"
  - id: ERR_BALLOTING_STILL_OPEN
    http: 409
    condition: "tally attempted before balloting_closes_at"
  - id: ERR_BALLOTING_CLOSED
    http: 409
    condition: "ballot cast or revoked at or after balloting_closes_at"
  - id: ERR_CHARGE_NOT_YET_DELINQUENT
    http: 409
    condition: "a remedy is initiated before due_date plus the 30 grace days"
  - id: ERR_RESTRICTION_DAYS_EXCEEDED
    http: 409
    condition: "the member's consumed restriction days plus this remedy's days would exceed 45 in the fiscal year"
  - id: ERR_MEMBER_NOT_IN_GOOD_STANDING
    http: 409
    condition: "a ballot is cast by a member whose standing_status is not GOOD_STANDING"
  - id: ERR_PARCEL_HAS_OPEN_CHARGES
    http: 409
    condition: "subdivision attempted while the parcel carries an OPEN, DELINQUENT or LIEN_ENCUMBERED charge"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "a payment exceeds the charge's remaining balance"
  - id: ERR_BALANCE_BELOW_RESTRICTION_MINIMUM
    http: 409
    condition: "an ACCESS_RESTRICTION is effectuated on a charge whose balance is below 50000 cents"
  - id: ERR_RESERVE_UNDERFUNDED
    http: 409
    condition: "a CULVERT or BRIDGE award is attempted while reserve_posture is UNDERFUNDED without an ADOPTED funding proposal"
  - id: ERR_INSUFFICIENT_RESERVE
    http: 409
    condition: "the computed reserve draw exceeds the association's reserve balance"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AssociationSecretary
    description: "Keeper of the membership roll, the parcel record and the easement/connection file"
    identity: opaque
    exclusive_operations:
      - "POST /associations"
      - "POST /parcels"
      - "PATCH /parcels/{parcel_id}"
      - "POST /parcels/{parcel_id}/subdivide"
      - "POST /members"
      - "POST /members/{member_id}/verify-deed"
      - "POST /connection-requests/{request_id}/decide"
      - "POST /connection-requests/{request_id}/resolve-dispute"
    shared_operations:
      - "POST /connection-requests (with MemberOwner)"
      - "POST /_clock/set_current_utc (with AssessmentClerk, BoardTreasurer, RoadCommissioner)"
      - "all read endpoints except GET /maintenance-projects/{project_id}/contractor-bids scoped reads reserved to bidding roles"
  - name: AssessmentClerk
    description: "Builds, certifies and recalls assessment rolls and posts payments; may never levy"
    identity: opaque
    exclusive_operations:
      - "POST /assessment-rolls"
      - "POST /assessment-rolls/{roll_id}/certify"
      - "POST /assessment-rolls/{roll_id}/recall"
    shared_operations:
      - "POST /assessment-charges/{charge_id}/payments (with MemberOwner)"
      - "GET /assessment-rolls/{roll_id}/method-comparison (with AssociationSecretary, BoardTreasurer)"
      - "POST /_clock/set_current_utc"
  - name: BoardTreasurer
    description: "Levies rolls, runs special assessment balloting, and pursues delinquency remedies; may never certify a roll"
    identity: opaque
    exclusive_operations:
      - "POST /assessment-rolls/{roll_id}/levy"
      - "POST /special-assessment-proposals"
      - "POST /special-assessment-proposals/{proposal_id}/open-balloting"
      - "POST /special-assessment-proposals/{proposal_id}/tally"
      - "POST /assessment-charges/{charge_id}/delinquency-actions"
      - "POST /delinquency-actions/{action_id}/effectuate"
      - "POST /delinquency-actions/{action_id}/release"
    shared_operations:
      - "GET /assessment-rolls/{roll_id}/method-comparison"
      - "POST /_clock/set_current_utc"
    note: "effectuate additionally requires a different X-User-ID than the initiator of the same remedy"
  - name: RoadCommissioner
    description: "Owns the physical road: segments, emergency-access inspections and maintenance projects"
    identity: opaque
    exclusive_operations:
      - "POST /road-segments"
      - "POST /road-segments/{segment_id}/access-inspections"
      - "POST /maintenance-projects"
      - "POST /maintenance-projects/{project_id}/award"
      - "POST /maintenance-projects/{project_id}/complete"
      - "POST /maintenance-projects/{project_id}/cancel"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /maintenance-projects/{project_id}/contractor-bids (with AssociationSecretary, BoardTreasurer, Contractor)"
    note: "award additionally requires a different X-User-ID than the project's created_by_user_id"
  - name: MemberOwner
    description: "A deeded owner on the membership roll, acting on its own membership"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /ballots"
      - "POST /ballots/{ballot_id}/revoke"
    shared_operations:
      - "POST /assessment-charges/{charge_id}/payments (only where charge.member_id == X-User-ID)"
      - "POST /connection-requests (only where the parent parcel's member is X-User-ID)"
      - "read endpoints on associations, segments, parcels, members, rolls, charges, proposals and projects"
    note: "X-User-ID equals a Member.id; ownership comparisons use Ballot.member_id, AssessmentCharge.member_id and the parent parcel's Member.id"
  - name: Contractor
    description: "A bidding firm; sees the solicitation and manages only its own bids"
    identity: opaque
    exclusive_operations:
      - "POST /maintenance-projects/{project_id}/contractor-bids"
      - "POST /contractor-bids/{bid_id}/withdraw"
    shared_operations:
      - "GET /maintenance-projects/{project_id}, GET /maintenance-projects, GET /maintenance-projects/{project_id}/contractor-bids"
    note: "X-User-ID is an opaque firm identifier stored on ContractorBid.contractor_user_id; a later bid by the same id supersedes the earlier one"
