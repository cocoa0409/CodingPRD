            - "Patient.${pt7}.no_show_risk_score == 0.00 and Patient.${pt2}.no_show_risk_score == 54.05 — the persisted field is the ROLLING_6 variant"
            - "Patient.${pt7}.completed_appointment_count == 6 and Patient.${pt2}.completed_appointment_count == 1"

      - name: lot_selection_is_first_expiry_first_out_and_never_splits_a_dose_across_lots
        claim_type: waterfall_allocation
        grounds:
          - calculations.lot_selection
          - calculations.lot_selection.input_set
          - endpoints[POST /appointments/{id}/drug-preparations]
          - state_machines[DrugLot].transitions[AVAILABLE -> DEPLETED]
        distinguishing_aspect: |
          Three lots of the same drug expire a month apart with 1, 5 and 10 units. The
          first 1-unit request takes the earliest-expiring lot and depletes it; the next
          3-unit request skips that depleted lot and takes the 5-unit middle lot, leaving
          2; the final 6-unit request cannot be satisfied by the middle lot even though
          the middle plus the latest lot together hold 12, so it takes the 10-unit latest
          lot whole — proving the eligibility filter is per-lot (units_available >=
          units_requested) and that partial fills across lots are forbidden.
        test_recipe:
          setup:
            - "Standing fixture (center, chair A1, nurse, drug, MID template, patient, ACTIVE plan, one appointment on 2026-08-10 at 540)."
            - "Lots of the plan's drug: LOT-SEP 1 unit expiring 2026-09-01, LOT-OCT 5 units expiring 2026-10-01, LOT-NOV 10 units expiring 2026-11-01, all created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
