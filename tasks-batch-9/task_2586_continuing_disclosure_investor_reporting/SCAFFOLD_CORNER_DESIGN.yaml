      - name: determine_cannot_mark_a_per_se_material_event_not_material
        claim_type: precondition_enforcement
        grounds:
          - state_machines[MaterialEventNotice].DETERMINATION_PENDING->NOT_MATERIAL
          - errors[ERR_PER_SE_EVENT_IS_MATERIAL]
          - calculations.material_event_filing_deadline.constants.PER_SE_MATERIAL_EVENT_TYPES
        distinguishing_aspect: >-
          The refusal is driven by the computed per_se_material flag, not by the requested
          determination: a RATING_CHANGE notice may be determined MATERIAL but never
          NOT_MATERIAL, while a TRUSTEE_SUBSTITUTION notice on the very same issue may go either
          way. Both branches must therefore consult the per-event-type constant list.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue with a RATING_CHANGE notice (per se) and a TRUSTEE_SUBSTITUTION notice (not per se), both DETERMINATION_PENDING."
            - "The RATING_CHANGE notice is minted by the rating-actions endpoint, which is the only producer of prior_rating / new_rating."
