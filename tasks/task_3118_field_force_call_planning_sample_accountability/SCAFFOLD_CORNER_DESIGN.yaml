            - call: "POST /field-force/call-plans/${plan_id}/publish"
              payload: {}
              as: DistrictManager
              as_user_id: "${rep_id}"
            - call: "POST /field-force/call-visits"
              payload: { call_plan_id: "${plan_id}", target_list_entry_id: "${e_id}", scheduled_start: "2026-08-31T08:00:00Z", scheduled_end: "2026-08-31T09:00:00Z" }
              as: FieldRep
