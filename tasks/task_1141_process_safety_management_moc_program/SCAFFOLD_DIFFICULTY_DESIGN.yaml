# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 1141 PSM & MOC
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per §0.5 rule.
# Common preamble for every recipe: empty DB; logical clock defaults to
# 2026-05-01T00:00:00Z; date literals are UTC midnights.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: moc_screening_vs_definitive_risk_score
        grounds:
          - calculations.screening_risk_score
          - calculations.definitive_risk_score
          - calculations.risk_rank_mapping
          - entities.MocRequest.fields.screening_risk_score
          - entities.MocRequest.fields.definitive_risk_score
        distinguishing_aspect: |
          On the MOC entity domain, the provisional screening variant (sev*lik*class_mult,
          no detection term) and the final definitive variant (min-cap + detection ramp +
          posture branch) produce different numbers AND different ranks for identical
          severity/likelihood: sev=3, lik=3, det=5, TEMPORARY → screening 10.80 (MEDIUM)
          vs definitive 21.60 (CRITICAL).
        test_recipe:
          setup:
            - "Unit U (cycle 12), PHA study CURRENT (validated 2026-04-01), requester REQ, reviewer REV holding CHEMICAL"
            - "MOC M classified TEMPORARY with sev=3, lik=3, start 2026-06-01, duration 180; submitted to TECHNICAL_REVIEW"
            - "Unit posture NORMAL (process_safety_index 0) so definitive posture_factor = 1.0"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "Alkylation", unit_code: "ALK1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req One", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev Two", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "Swap exchanger", description: "Like-for-like-plus", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "TEMPORARY", screening_severity: 3, screening_likelihood: 3, temporary_start_date: "2026-06-01", temporary_duration_days: 180 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 3, likelihood_score: 3, detection_score: 5, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
          assert:
            - "MocRequest.${m_id}.screening_risk_score == 10.80 (round2(3*3*1.2))"
            - "MocRequest.${m_id}.definitive_risk_score == 21.60 (min(25,9)*1.2*2.00*1.0)"
            - "MocRequest.${m_id}.risk_rank == CRITICAL (recomputed from definitive; screening rank was MEDIUM)"
            - "MocRequest.${m_id}.status == APPROVAL_PENDING"

      - name: pha_nominal_vs_risk_accelerated_due
        grounds:
          - calculations.pha_nominal_next_due
          - calculations.pha_risk_accelerated_due
          - entities.PhaStudy.fields.effective_next_due
          - state_machines.PhaStudy.CURRENT_to_REVALIDATION_REQUIRED
        distinguishing_aspect: |
          On the PhaStudy entity domain, the calendar variant (nominal_next_due) and the
          incident-accelerated variant (risk_accelerated_due) produce different dates for the
          same study once one HIGH incident closes: nominal stays 2027-01-10 while
          risk_accelerated collapses to 2026-12-05 (324 days with N=1).
        test_recipe:
          setup:
            - "Unit U (cycle 12 → 360 cycle days), PHA study validated 2026-01-15"
            - "Personnel INV (investigator) and REQ (assignee) exist"
            - "One HIGH incident occurred 2026-04-20, moved OPEN → ROOT_CAUSE_ANALYSIS → FINDINGS_SUBMITTED with zero findings"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "Crude", unit_code: "CRU1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-01-15" }, as: PsmManager, captures: { s_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Inv", employee_ref: "E-INV" }, as: PsmAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/incident-investigations", payload: { title: "Seal leak", severity_class: "HIGH", occurred_at: "2026-04-20", investigator_id: "${inv_id}" }, as: PsmManager, captures: { i_id: $.data.id } }
            - { call: "POST /psm/incident-investigations/${i_id}/begin-rca", payload: {}, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /psm/incident-investigations/${i_id}/submit-findings", payload: { findings: [] }, as: Investigator, as_user_id: "${inv_id}" }
          trigger:
            - { call: "POST /psm/incident-investigations/${i_id}/close", payload: {}, as: PsmManager }
          assert:
            - "PhaStudy.${s_id}.nominal_next_due == 2027-01-10T00:00:00Z (calendar variant unchanged by incidents)"
            - "PhaStudy.${s_id}.risk_accelerated_due == 2026-12-05T00:00:00Z (floor(360*0.9)=324 days)"
            - "PhaStudy.${s_id}.effective_next_due == 2026-12-05T00:00:00Z (min of the two variants)"
            - "PhaStudy.${s_id}.status == REVALIDATION_REQUIRED (feeds_pha cascade)"
            - "IncidentInvestigation.${i_id}.feeds_pha == true"

  - rule_id: combinatorial_formula
    instances:
      - name: definitive_risk_posture_branch_mode_a
        grounds:
          - calculations.definitive_risk_score
          - calculations.unit_process_safety_index
          - entities.MocRequest.fields.definitive_risk_score
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — nested min(25,·) cap, detection
          ramp (1+(det-1)*0.25), class multiplier, and a conditional posture branch
          (index>=70 → ×1.25). With sev=4, lik=4, det=4, TEMPORARY the same verdict yields
          33.60 under NORMAL posture but 42.00 when the unit index is >= 70 at verdict time.
        test_recipe:
          setup:
            - "Unit U (cycle 12), study validated 2026-01-15 (nominal due 2027-01-10), REQ, REV(CHEMICAL) exist"
            - "MOC M classified TEMPORARY (sev 4, lik 4, start 2026-06-01, duration 180) and submitted while posture NORMAL"
            - "Unit then driven to index 70 (FROZEN): three P1 manual items due_in_days 1 (+45 once overdue) and study OVERDUE (+25) after clock crosses 2027-01-10"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "Hydro", unit_code: "HYD1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "WHAT_IF", initial_validated_at: "2026-01-15" }, as: PsmManager, captures: { s_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "TEMPORARY", screening_severity: 4, screening_likelihood: 4, temporary_start_date: "2026-06-01", temporary_duration_days: 180 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a1", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a2", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "a3", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2027-01-11T00:00:00Z" }, as: PsmAdmin }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 4, likelihood_score: 4, detection_score: 4, verdict: "RETURN" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
          assert:
            - "PlantUnit.${u_id}.process_safety_index == 70 (3*15 overdue + 25 study OVERDUE)"
            - "PlantUnit.${u_id}.psm_posture == FROZEN (exactly 70 hits the >= 70 band)"
            - "MocRequest.${m_id}.definitive_risk_score == 42.00 (min(25,16)*1.2*1.75*1.25)"
            - "MocRequest.${m_id}.status == RETURNED_FOR_REVISION"

      - name: training_coverage_per_update_rounding_mode_b
        grounds:
          - calculations.training_coverage_pct
          - entities.MocRequest.fields.training_coverage_pct
          - errors[ERR_TRAINING_COVERAGE_INSUFFICIENT]
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — round each PUBLISHED update's coverage to
          2dp FIRST, then average and round again. With completions 2/3 and 3/4 the pinned
          order yields round2((66.67+75.00)/2) == 70.84, whereas aggregate-then-round would
          yield 71.43 — a different, non-conforming value; the gate then rejects
          mark-implemented against the 100.00 threshold.
        test_recipe:
          setup:
            - "Unit U (defaults), study CURRENT, REQ + REV(CHEMICAL) + APP exist; trainees T1..T5"
            - "MOC M PERMANENT approved (APPROVED_IMPLEMENTATION)"
            - "ProcedureUpdate U1 PUBLISHED with assignments (T1,T2,T3) of which T1,T2 completed; ProcedureUpdate U2 PUBLISHED with assignments (T1,T2,T3,T4) of which T1,T2,T3 completed"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "T1", employee_ref: "E-T1" }, as: PsmAdmin, captures: { t1: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "T2", employee_ref: "E-T2" }, as: PsmAdmin, captures: { t2: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "T3", employee_ref: "E-T3" }, as: PsmAdmin, captures: { t3: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "T4", employee_ref: "E-T4" }, as: PsmAdmin, captures: { t4: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/procedure-updates", payload: { document_ref: "SOP-101" }, as: TrainingCoordinator, captures: { pu1: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu1}/training-assignments", payload: { personnel_id: "${t1}" }, as: TrainingCoordinator, captures: { ta1: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu1}/training-assignments", payload: { personnel_id: "${t2}" }, as: TrainingCoordinator, captures: { ta2: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu1}/training-assignments", payload: { personnel_id: "${t3}" }, as: TrainingCoordinator }
            - { call: "POST /psm/procedure-updates/${pu1}/publish", payload: {}, as: TrainingCoordinator }
            - { call: "POST /psm/moc-requests/${m_id}/procedure-updates", payload: { document_ref: "SOP-102" }, as: TrainingCoordinator, captures: { pu2: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu2}/training-assignments", payload: { personnel_id: "${t1}" }, as: TrainingCoordinator, captures: { ta4: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu2}/training-assignments", payload: { personnel_id: "${t2}" }, as: TrainingCoordinator, captures: { ta5: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu2}/training-assignments", payload: { personnel_id: "${t3}" }, as: TrainingCoordinator, captures: { ta6: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu2}/training-assignments", payload: { personnel_id: "${t4}" }, as: TrainingCoordinator }
            - { call: "POST /psm/procedure-updates/${pu2}/publish", payload: {}, as: TrainingCoordinator }
            - { call: "POST /psm/training-assignments/${ta1}/complete", payload: {}, as: Requester, as_user_id: "${t1}" }
            - { call: "POST /psm/training-assignments/${ta2}/complete", payload: {}, as: Requester, as_user_id: "${t2}" }
            - { call: "POST /psm/training-assignments/${ta4}/complete", payload: {}, as: Requester, as_user_id: "${t1}" }
            - { call: "POST /psm/training-assignments/${ta5}/complete", payload: {}, as: Requester, as_user_id: "${t2}" }
            - { call: "POST /psm/training-assignments/${ta6}/complete", payload: {}, as: Requester, as_user_id: "${t3}" }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/mark-implemented", payload: {}, as: Requester, as_user_id: "${req_id}", captures: { err: $.data.error_id } }
          assert:
            - "MocRequest.${m_id}.training_coverage_pct == 70.84 (per-update round first: 66.67 and 75.00, then averaged)"
            - "trigger is rejected: error_id == ERR_TRAINING_COVERAGE_INSUFFICIENT (70.84 < 100.00)"
            - "MocRequest.${m_id}.status remains APPROVED_IMPLEMENTATION"

  - rule_id: non_linear_state_machine
    instances:
      - name: moc_review_revision_cycle
        grounds:
          - state_machines.MocRequest.TECHNICAL_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.MocRequest.RETURNED_FOR_REVISION_to_TECHNICAL_REVIEW
          - state_machines.MocRequest.TECHNICAL_REVIEW_to_APPROVAL_PENDING
          - entities.MocRequest.fields.review_round
        distinguishing_aspect: |
          MocRequest's machine is cyclic: TECHNICAL_REVIEW → RETURNED_FOR_REVISION →
          TECHNICAL_REVIEW repeats, each loop incrementing review_round and minting a fresh
          OPEN TechnicalReview while the old round stays SUBMITTED — not a linear pipeline.
        test_recipe:
          setup:
            - "Unit U + CURRENT study; REQ, REV(CHEMICAL), APP exist"
            - "MOC M classified PERMANENT (sev 2, lik 2) and submitted (review round 1 OPEN)"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r1: "$.data[0].id" } }
          trigger:
            - { call: "POST /psm/technical-reviews/${r1}/submit-verdict", payload: { design_basis_ok: false, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 2, verdict: "RETURN" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/resubmit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r2: "$.data[1].id" } }
            - { call: "POST /psm/technical-reviews/${r2}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
          assert:
            - "MocRequest.${m_id}.review_round == 2"
            - "MocRequest.${m_id}.status == APPROVAL_PENDING"
            - "TechnicalReview.${r1}.status == SUBMITTED with verdict RETURN; TechnicalReview.${r2}.round_number == 2"
            - "MocRequest.${m_id}.definitive_risk_score == 4.00 (min(25,4)*1.0*1.00*1.0) and risk_rank == LOW"

      - name: action_item_verification_reopen_cycle
        grounds:
          - state_machines.ActionItem.SUBMITTED_FOR_VERIFICATION_to_REJECTED
          - state_machines.ActionItem.REJECTED_to_IN_PROGRESS
          - state_machines.ActionItem.VERIFIED_CLOSED_to_IN_PROGRESS
          - entities.ActionItem.fields.reopen_count
        distinguishing_aspect: |
          ActionItem's machine loops twice: the verification-rejection loop
          (IN_PROGRESS → SUBMITTED_FOR_VERIFICATION → REJECTED → IN_PROGRESS) and the
          post-closure reopen loop (VERIFIED_CLOSED → IN_PROGRESS), with reopen_count
          accumulating — a different entity than MocRequest.
        test_recipe:
          setup:
            - "Unit U; REQ (assignee) exists; one manual P1 item A assigned to REQ (due 2026-05-31 at default clock)"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "Inspect valve", priority: "P1", assignee_id: "${req_id}" }, as: PsmManager, captures: { a_id: $.data.id } }
            - { call: "POST /psm/action-items/${a_id}/start", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${a_id}/evidence-items", payload: { file_ref: "s3://ev/photo1.jpg", description: "Photo of installed valve" }, as: Requester, as_user_id: "${req_id}" }
          trigger:
            - { call: "POST /psm/action-items/${a_id}/submit-verification", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${a_id}/reject-verification", payload: {}, as: PsmManager }
            - { call: "POST /psm/action-items/${a_id}/start", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${a_id}/submit-verification", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${a_id}/verify", payload: {}, as: PsmManager }
            - { call: "POST /psm/action-items/${a_id}/reopen", payload: { reason: "Evidence expired" }, as: PsmManager }
          assert:
            - "After reject-verification the item was REJECTED and still counted open (unit.open_action_count stayed 1)"
            - "After verify the item was VERIFIED_CLOSED with unit.open_action_count == 0"
            - "Final: ActionItem.${a_id}.status == IN_PROGRESS, reopen_count == 1"
            - "PlantUnit.${u_id}.open_action_count == 1 (reopen restored the count)"

  - rule_id: transitive_cascade
    instances:
      - name: incident_close_forces_pha_posture_cascade
        grounds:
          - state_machines.IncidentInvestigation.FINDINGS_SUBMITTED_to_CLOSED
          - state_machines.PhaStudy.CURRENT_to_REVALIDATION_REQUIRED
          - calculations.unit_process_safety_index
          - validations[priority=6.3]
        distinguishing_aspect: |
          Depth-3 chain from incident close: CLOSE (HIGH) mutates PhaStudy →
          REVALIDATION_REQUIRED (link 1); that study mutation itself spawns a
          PHA_REVALIDATION ActionItem and recomputes the unit index (link 2); the posture
          flip to RESTRICTED then blocks a NEW MOC submit with ERR_UNIT_POSTURE_RESTRICTED
          (link 3, observable on a different entity than the trigger).
        test_recipe:
          setup:
            - "Unit U (cycle 12), study validated 2026-01-15 (CURRENT at default clock)"
            - "One manual P1 item (due_in_days 1, overdue after clock 2026-05-03) and one MAJOR_NC audit finding with corrective P1 item"
            - "One HIGH incident (occurred 2026-04-20) at FINDINGS_SUBMITTED with zero findings"
            - "MOC-A classified+submitted BEFORE the close (proves gate open at index 30 NORMAL)"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-01-15" }, as: PsmManager, captures: { s_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Inv", employee_ref: "E-INV" }, as: PsmAdmin, captures: { inv_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Aud", employee_ref: "E-AUD" }, as: PsmAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/action-items", payload: { title: "old", priority: "P1", assignee_id: "${req_id}", due_in_days: 1 }, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/audits", payload: { title: "au", lead_auditor_id: "${aud_id}", field_window_start: "2026-05-01", field_window_end: "2026-05-10" }, as: PsmManager, captures: { au_id: $.data.id } }
            - { call: "POST /psm/audits/${au_id}/begin-fieldwork", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /psm/audits/${au_id}/report", payload: { findings: [{ title: "f", severity: "MAJOR_NC", assignee_id: "${req_id}" }] }, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /psm/units/${u_id}/incident-investigations", payload: { title: "i", severity_class: "HIGH", occurred_at: "2026-04-20", investigator_id: "${inv_id}" }, as: PsmManager, captures: { i_id: $.data.id } }
            - { call: "POST /psm/incident-investigations/${i_id}/begin-rca", payload: {}, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /psm/incident-investigations/${i_id}/submit-findings", payload: { findings: [] }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /psm/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PsmAdmin }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "A", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { ma: $.data.id } }
            - { call: "POST /psm/moc-requests/${ma}/classify", payload: { change_class: "PERMANENT", screening_severity: 1, screening_likelihood: 1 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${ma}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
          trigger:
            - { call: "POST /psm/incident-investigations/${i_id}/close", payload: {}, as: PsmManager }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "B", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { mb: $.data.id } }
            - { call: "POST /psm/moc-requests/${mb}/classify", payload: { change_class: "PERMANENT", screening_severity: 1, screening_likelihood: 1 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${mb}/submit", payload: {}, as: Requester, as_user_id: "${req_id}", captures: { err: $.data.error_id } }
          assert:
            - "PhaStudy.${s_id}.status == REVALIDATION_REQUIRED (link 1)"
            - "PlantUnit.${u_id}.open_action_count == 3 (manual + corrective + spawned PHA_REVALIDATION item — link 2)"
            - "PlantUnit.${u_id}.process_safety_index == 40 (15 overdue + 20 forced + 5 MAJOR_NC) and psm_posture == RESTRICTED"
            - "MOC-B submit rejected: error_id == ERR_UNIT_POSTURE_RESTRICTED (link 3), MocRequest.${mb}.status remains CLASSIFIED"

      - name: clock_expiry_revert_cascade
        grounds:
          - state_machines.MocRequest.IN_SERVICE_to_EXPIRED_REVERT_REQUIRED
          - calculations.action_item_due_sla
          - calculations.unit_process_safety_index
        distinguishing_aspect: |
          Depth-3 chain from a clock trigger (different trigger than incident close): the
          sweep past temporary_end_date flips the MOC to EXPIRED_REVERT_REQUIRED (link 1);
          that flip spawns a P1 REVERT ActionItem due +30d (link 2); a second sweep past the
          item's due date makes it overdue, lifting the index across 40 → RESTRICTED
          (link 3, observed on PlantUnit).
        test_recipe:
          setup:
            - "Unit U (defaults), study CURRENT (validated 2026-04-01); REQ/REV(CHEMICAL)/APP/LEAD(PSSR_CERTIFIED) exist"
            - "TEMPORARY MOC M (start 2026-05-01, duration 5 → end 2026-05-06) driven to IN_SERVICE at default clock"
