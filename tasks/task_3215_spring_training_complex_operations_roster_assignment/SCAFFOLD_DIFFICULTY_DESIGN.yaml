          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. Two DEDICATED complexes. On the first, one group session block from 06:00 to 08:00; on the second, one group session block from 06:00 to 07:00."
            - "Each complex carries one DRAFT game at 10:00Z with duration_units 3 (game interval 07:00 to 13:00)."
          setup_api_calls:
            - call: "POST /camp-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /camp-ops/complexes"
              payload: { name: "Collision Complex", host_city: "Mesa", season_split_track: "DEDICATED", timezone: "America/Phoenix", facility_capacity_units: 100 }
              as: PlatformAdmin
              captures: { cx_hit: $.data.id }
