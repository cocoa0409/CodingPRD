              payload: { grower_name: "A", state_code: "KS", crop: "WHEAT", rate_basis: "PER_ACRE", rate_cents_per_acre: 3200, rate_cents_per_bushel: 0, committed_acres: 100 }
              as: GrowerLiaison
            - call: "POST /harvest/seasons/${s2}/contracts"
              payload: { grower_name: "B", state_code: "NE", crop: "CORN", rate_basis: "PER_ACRE", rate_cents_per_acre: 3500, rate_cents_per_bushel: 0, committed_acres: 200 }
              as: GrowerLiaison
          trigger:
