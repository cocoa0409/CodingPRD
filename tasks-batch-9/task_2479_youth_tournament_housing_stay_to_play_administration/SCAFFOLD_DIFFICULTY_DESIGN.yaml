  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hotel_contract_negotiation_revision_cycle
        grounds:
          - state_machines.HotelContract
          - entities.HotelContract.fields.revision_round
          - entities.HotelContract.fields.countersigned_by_hotel_id
          - validations[priority=12]
        distinguishing_aspect: |
          Non-linearity form is a CYCLE on HotelContract: NEGOTIATING -> DRAFT via REVISE returns
          the contract to a state it already occupied, and DRAFT -> NEGOTIATING can be re-entered
          an unbounded number of times. revision_round is the only witness that the loop ran, so
          two full REVISE laps must leave revision_round at 2 while status ends at EXECUTED. A
          linear reading of the machine would either reject the second SUBMIT or lose the counter.
        test_recipe:
          setup:
            - "Tournament posture OPEN."
            - "One Hotel."
            - "One DRAFT HotelContract with one RoomBlock attached, so DRAFT -> NEGOTIATING is unlocked."
          setup_api_calls:
            - call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
            - call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
