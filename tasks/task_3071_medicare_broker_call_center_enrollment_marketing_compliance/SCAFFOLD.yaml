    input: []
    output: CommissionLedgerEntry
    side_effects: ["status → PROVISIONAL", "Agency.commission_balance_cents recomputed", "CarrierReconciliation.internal_total_cents recomputed"]

  - method: POST
    path: "/commission-ledger-entries/{id}/reinstate-finalized"
    description: "Reinstate a reversed ledger entry directly to FINALIZED"
    roles: [DirectorOfSales]
    code: 200
    input: []
    output: CommissionLedgerEntry
    side_effects: ["status → FINALIZED", "Agency.commission_balance_cents recomputed", "CarrierReconciliation.internal_total_cents recomputed"]

  # --- Corrections -----------------------------------------------------------
  - method: POST
    path: "/corrections"
    description: "Post an operator correction against an enrollment inside an open reconciliation period"
    roles: [DirectorOfSales]
    code: 201
    input: [enrollment_id, carrier_reconciliation_id, amount_cents, period_month, memo]
    output: CommissionLedgerEntry
    side_effects: ["An ADJUSTMENT ledger entry is posted in status PROVISIONAL", "Agency.commission_balance_cents recomputed", "CarrierReconciliation.internal_total_cents recomputed"]

  - method: GET
    path: "/corrections"
    description: "List posted corrections"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Any]
    code: 200
    input: ["enrollment_id?", "carrier_reconciliation_id?", "period_month?", "limit?", "offset?"]
    output: "CommissionLedgerEntry[]"
    side_effects: []

  # --- Carrier reconciliation ------------------------------------------------
  - method: POST
    path: "/carrier-reconciliations"
    description: "Open a carrier reconciliation period"
    roles: [DirectorOfSales]
    code: 201
    input: [carrier_id, period_month, carrier_reported_total_cents, internal_total_variant]
    output: CarrierReconciliation
    side_effects: ["status initialized to OPEN", "internal_total_cents and variance_cents computed per §1.3 carrier_reconciliation_variance"]

  - method: GET
    path: "/carrier-reconciliations"
    description: "List reconciliation periods"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Any]
    code: 200
    input: ["carrier_id?", "period_month?", "status?", "limit?", "offset?"]
    output: "CarrierReconciliation[]"
    side_effects: []

  - method: GET
    path: "/carrier-reconciliations/{id}"
    description: "Get a reconciliation period"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Any]
    code: 200
    input: []
    output: CarrierReconciliation
    side_effects: []

  - method: POST
    path: "/carrier-reconciliations/{id}/reconcile"
    description: "Close a reconciliation period whose variance is zero"
    roles: [DirectorOfSales]
    code: 200
    input: []
    output: CarrierReconciliation
    side_effects: ["status → RECONCILED", "Every PROVISIONAL entry presented in this period → FINALIZED", "Agency.commission_balance_cents recomputed", "Agency.loss_ratio recomputed"]

  - method: POST
    path: "/carrier-reconciliations/{id}/dispute"
    description: "Dispute a reconciliation period whose variance is non-zero"
    roles: [DirectorOfSales]
    code: 200
    input: ["dispute_note"]
    output: CarrierReconciliation
    side_effects: ["status → DISPUTED", "Every PROVISIONAL entry presented in this period → FINALIZED", "Agency.commission_balance_cents recomputed", "Agency.loss_ratio recomputed"]

  - method: POST
    path: "/carrier-reconciliations/{id}/reopen"
    description: "Reopen a disputed period for another settlement round"
    roles: [DirectorOfSales]
    code: 200
    input: []
    output: CarrierReconciliation
    side_effects: ["status → OPEN", "internal_total_cents and variance_cents recomputed"]

  - method: POST
    path: "/carrier-reconciliations/{id}/level-recognize"
    description: "Adopt the internal final-variant total as the carrier-reported total and close the period"
    roles: [DirectorOfSales]
    code: 200
    input: []
    output: CarrierReconciliation
    side_effects: ["carrier_reported_total_cents = internal_total_cents under the FINAL variant", "status → RECONCILED", "Every PROVISIONAL entry presented in this period → FINALIZED", "Agency.loss_ratio recomputed"]

  # --- Complaints ------------------------------------------------------------
  - method: POST
    path: "/complaints"
    description: "File a complaint or record a secret-shopper observation"
    roles: [ComplianceOfficer, CarrierIntegration]
    code: 201
    input: [agent_id, complaint_type, source, severity, filed_on, "shopper_score?", "soa_requested_correctly?", "disclaimer_played?", "approved_marketing_used?"]
    output: Complaint
    side_effects: ["status initialized to OPEN", "Agency.open_complaint_count recomputed"]

  - method: GET
    path: "/complaints"
    description: "List complaints"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Coach, Any]
    code: 200
    input: ["agent_id?", "status?", "source?", "severity?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/complaints/{id}"
    description: "Get a complaint"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Coach, Any]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{id}/begin-review"
    description: "Move a complaint into review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status → UNDER_REVIEW", "Agency.open_complaint_count recomputed"]

  - method: POST
    path: "/complaints/{id}/substantiate"
    description: "Substantiate a complaint and create the resulting coaching assignment"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status → SUBSTANTIATED", "finding_code = the §1.3 complaint_finding_codes result", "substantiated_on = logical clock", "Agent.substantiated_complaint_count += 1", "Agent.compliance_risk_score recomputed", "A §1.3 coaching_assignment is created with status ASSIGNED", "Agent.open_coaching_count recomputed", "Agency.substantiated_complaint_rate recomputed", "Agency.compliance_posture recomputed"]

  - method: POST
    path: "/complaints/{id}/dismiss"
    description: "Dismiss a complaint, reversing a prior substantiation when appealed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status → DISMISSED", "Agent.substantiated_complaint_count -= 1 when the complaint was APPEALED", "Agent.compliance_risk_score recomputed", "Agency.substantiated_complaint_rate recomputed", "Agency.compliance_posture recomputed"]

  - method: POST
    path: "/complaints/{id}/appeal"
    description: "File a carrier appeal against a substantiation or dismissal"
    roles: [CarrierIntegration]
    code: 200
    input: ["appeal_note"]
    output: Complaint
    side_effects: ["status → APPEALED", "Agent.compliance_risk_score recomputed"]

  - method: POST
    path: "/complaints/{id}/remand"
    description: "Remand an appealed complaint back into review"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status → UNDER_REVIEW", "Agency.open_complaint_count recomputed"]

  - method: POST
    path: "/complaints/{id}/close"
    description: "Close a complaint and close any coaching it spawned"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status → CLOSED", "Every open CoachingAssignment of this complaint → COMPLETED", "Agent.open_coaching_count recomputed", "Agent.compliance_risk_score recomputed", "Agency.open_complaint_count recomputed"]

  # --- Coaching --------------------------------------------------------------
  - method: POST
    path: "/coaching-assignments"
    description: "Create a coaching assignment, manually or from a complaint"
    roles: [Coach, ComplianceOfficer]
    code: 201
    input: [agent_id, "complaint_id?", coaching_type]
    output: CoachingAssignment
    side_effects: ["status initialized to ASSIGNED", "triggered_by derived from whether complaint_id is present", "assigned_on = logical clock", "due_on computed from assigned_on + 14 days", "Agent.open_coaching_count recomputed", "Agent.coaching_flag = true", "Agent.compliance_risk_score recomputed"]

  - method: GET
    path: "/coaching-assignments"
    description: "List coaching assignments"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Coach, Any]
    code: 200
    input: ["agent_id?", "complaint_id?", "status?", "coaching_type?", "limit?", "offset?"]
    output: "CoachingAssignment[]"
    side_effects: []

  - method: GET
    path: "/coaching-assignments/{id}"
    description: "Get a coaching assignment, including its overdue day count"
    roles: [PlatformAdmin, DirectorOfSales, ComplianceOfficer, Coach, Any]
    code: 200
    input: []
    output: CoachingAssignment
    side_effects: []

  - method: POST
    path: "/coaching-assignments/{id}/start"
    description: "Start a coaching assignment"
    roles: [Coach]
    code: 200
    input: []
    output: CoachingAssignment
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/coaching-assignments/{id}/complete"
    description: "Complete a coaching assignment"
    roles: [Coach]
    code: 200
    input: ["notes?"]
    output: CoachingAssignment
    side_effects: ["status → COMPLETED", "completed_on = logical clock", "Agent.open_coaching_count recomputed", "Agent.coaching_flag = false when the count reaches 0", "Agent.compliance_risk_score recomputed", "Agency.compliance_posture recomputed"]

# =============================================================================
# Table 6: Error Code Catalogue  (§1.6)
# =============================================================================
errors:
  # --- Authentication & authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, malformed, or naming a role not declared in §1.7"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role is not listed in the endpoint's roles allow-list"

  # --- Not found ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Generic resource not found"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "Agency id does not resolve"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "Carrier id does not resolve, or the carrier is not in status ACTIVE"
  - id: ERR_AGENT_NOT_FOUND
    http: 404
    condition: "Agent id does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "Member id does not resolve"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "Plan id does not resolve"
  - id: ERR_SCOPE_OF_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "ScopeOfAppointment id does not resolve"
  - id: ERR_CALL_SESSION_NOT_FOUND
    http: 404
    condition: "CallSession id does not resolve"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Enrollment id does not resolve"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "Complaint id does not resolve"
  - id: ERR_COACHING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "CoachingAssignment id does not resolve"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "CommissionLedgerEntry id does not resolve"
  - id: ERR_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "CarrierReconciliation id does not resolve"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "CarrierAppointment id does not resolve"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "No CarrierCertification in status CERTIFIED matches the agent, carrier and product type"
  - id: ERR_STATE_LICENSE_NOT_FOUND
    http: 404
    condition: "AgentStateLicense id does not resolve"

  # --- Input validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, type mismatch, or an out-of-enum value (including a shopper_score outside 0-100, a plan_type outside the closed set, and a filing or period_month string not in YYYY-MM form)"
  - id: ERR_INVALID_LICENSE_DATES
    http: 400
    condition: "issued_on is later than expires_on"
  - id: ERR_INVALID_STATE_LICENSE
    http: 422
    condition: "No AgentStateLicense with license_status VALID covers the requested state_code at the logical clock"
  - id: ERR_DUPLICATE_STATE_LICENSE
    http: 409
    condition: "A non-expired AgentStateLicense already exists for the same agent and state_code"
  - id: ERR_DUPLICATE_CERTIFICATION
    http: 409
    condition: "A CarrierCertification in status CERTIFIED already exists for the same agent, carrier and product type"
  - id: ERR_CARRIER_NOT_CONTRACTED
    http: 403
    condition: "Carrier.contract_type is MARKETING_ONLY, so the agency may not appoint or enroll through it"
  - id: ERR_CARRIER_MISMATCH
    http: 422
    condition: "The carrier_id in the request path or body does not equal the carrier recorded on the enrollment"
  - id: ERR_PLAN_NOT_IN_SERVICE_AREA
    http: 422
    condition: "Plan.state_code and Plan.county_code do not match the member's, or the plan is not in status ACTIVE"
  - id: ERR_MEMBER_NOT_IN_AGENCY
    http: 422
    condition: "The member's agency_id differs from the acting agent's agency_id, or from the plan's carrier's agency scope"
  - id: ERR_SUBSTANTIATED_COMPLAINT_OPEN
    http: 409
    condition: "An agency posture reset to OPEN or RESTRICTED was requested while the strike count or the substantiated complaint rate still exceeds the posture constant it must fall below"

  # --- Scope of appointment and marketing compliance ---
  - id: ERR_SCOPE_OF_APPOINTMENT_MISSING
    http: 422
    condition: "No usable CAPTURED ScopeOfAppointment exists, or its plan_types_authorized is empty, or it has passed expires_on"
  - id: ERR_SCOPE_AGENT_MISMATCH
    http: 403
    condition: "The ScopeOfAppointment.agent_id differs from the calling or enrolling agent"
  - id: ERR_SCOPE_OF_APPOINTMENT_CONSUMED
    http: 409
    condition: "The ScopeOfAppointment is already CONSUMED or VOIDED"
  - id: ERR_PLAN_TYPE_NOT_AUTHORIZED
    http: 422
    condition: "The plan type under discussion is not a member of ScopeOfAppointment.plan_types_authorized"
  - id: ERR_DISCLAIMER_NOT_DELIVERED
    http: 422
    condition: "The CMS disclaimer was not delivered, or no recording exists, before plan types were discussed — waived only for WRITTEN scopes"
  - id: ERR_RECORDING_MISSING
    http: 422
    condition: "CallSession.recording_id is null when the scope's capture_channel is not WRITTEN"
  - id: ERR_RECORDING_EXPIRED
    http: 410
    condition: "The recording's retention window has expired while the CallSession is still referenced by an open compliance review"

  # --- Staffing and licensing ---
  - id: ERR_AGENCY_FROZEN
    http: 403
    condition: "Agency.compliance_posture is FROZEN, so every child mutation is refused"
  - id: ERR_AGENCY_NOT_OPEN
    http: 409
    condition: "Agent reinstatement requires Agency.compliance_posture to be OPEN"
  - id: ERR_AGENCY_NOT_FROZEN
    http: 409
    condition: "Agency posture reset to RESTRICTED requires the agency to be FROZEN"
  - id: ERR_AGENCY_NOT_RESTRICTED
    http: 409
    condition: "Agency posture reset to OPEN requires the agency to be RESTRICTED"
  - id: ERR_AGENT_NOT_LICENSED
    http: 409
    condition: "Agent.status is not LICENSED, so a carrier certification cannot be recorded"
  - id: ERR_AGENT_NOT_CERTIFIED
    http: 409
    condition: "Agent.status is not CERTIFIED, so a carrier appointment cannot be recorded"
  - id: ERR_AGENT_NOT_ACTIVE
    http: 409
    condition: "Agent.status is not ACTIVE, so a call cannot be connected"
  - id: ERR_AGENT_NOT_SUSPENDED
    http: 409
    condition: "Agent reinstatement requires Agent.status SUSPENDED"
  - id: ERR_AGENT_NOT_TERMINATED
    http: 409
    condition: "Agent rehire requires Agent.status TERMINATED"
  - id: ERR_AGENT_ALREADY_TERMINATED
    http: 409
    condition: "Agent termination attempted on an agent already in status TERMINATED"
  - id: ERR_AGENT_NOT_APPOINTED
    http: 422
    condition: "The agent lacks an APPOINTED carrier appointment, a VALID state license, or a CERTIFIED carrier certification for the plan"
  - id: ERR_APPOINTMENT_MISSING
    http: 409
    condition: "Reinstatement requires an existing APPOINTED carrier appointment"
  - id: ERR_REHIRE_BEFORE_TERMINATION
    http: 409
    condition: "hire_date is not strictly after the most recent termination instant"
  - id: ERR_RECERTIFICATION_REQUIRED
    http: 409
    condition: "A certification still covers the rehire instant, so annual re-certification has not been re-established"
  - id: ERR_AGENT_HAS_ACTIVE_CALL
    http: 409
    condition: "The agent already has a live call whose interval overlaps the requested one"
  - id: ERR_LIVE_CALL_LIMIT_EXCEEDED
    http: 409
    condition: "The agent's count of IN_PROGRESS call sessions would exceed Agency.max_live_calls_per_agent"

  # --- State errors ---
  - id: ERR_CALL_NOT_IN_PROGRESS
    http: 409
    condition: "CallSession.status is not IN_PROGRESS, so it cannot be connected or completed"
  - id: ERR_CALL_NOT_COMPLETED
    http: 409
    condition: "CallSession.status is not COMPLETED, so it cannot be amended"
  - id: ERR_CALL_NOT_AMENDED
    http: 409
    condition: "CallSession.status is not AMENDED, so the amendment cannot be finalized"
  - id: ERR_CALL_NOT_DROPPABLE
    http: 409
    condition: "CallSession.status is not RINGING or IN_PROGRESS"
  - id: ERR_ENROLLMENT_NOT_SUBMITTED
    http: 409
    condition: "Enrollment.submission_status is not SUBMITTED, so it cannot be acknowledged or rejected"
  - id: ERR_ENROLLMENT_NOT_ACKNOWLEDGED
    http: 409
    condition: "Enrollment has not been acknowledged, so it cannot be effectuated"
  - id: ERR_ENROLLMENT_NOT_ENROLLED
    http: 409
    condition: "Enrollment is not in the ENROLLED disenrollment state, so it cannot be disenrolled"
  - id: ERR_ENROLLMENT_NOT_WITHDRAWABLE
    http: 409
    condition: "Enrollment.submission_status is EFFECTUATED or WITHDRAWN, so it cannot be withdrawn"
  - id: ERR_COACHING_NOT_ASSIGNED
    http: 409
    condition: "CoachingAssignment.status is not ASSIGNED, so it cannot be started"
  - id: ERR_COACHING_NOT_IN_PROGRESS
    http: 409
    condition: "CoachingAssignment.status is not IN_PROGRESS or OVERDUE, so it cannot be completed"
  - id: ERR_COACHING_OPEN
    http: 409
    condition: "Agent reinstatement requires no open coaching assignment"
  - id: ERR_COACHING_OVERDUE_BLOCKS_RESET
    http: 409
    condition: "Agency posture reset is refused while any coaching assignment of the agency is overdue"
  - id: ERR_LEDGER_ENTRY_NOT_PROVISIONAL
    http: 409
    condition: "CommissionLedgerEntry.status is not PROVISIONAL, so it cannot be finalized"
  - id: ERR_LEDGER_ENTRY_NOT_REVERSED
    http: 409
    condition: "CommissionLedgerEntry.status is not REVERSED, so it cannot be reinstated"
  - id: ERR_LEDGER_ENTRY_NOT_REVERSIBLE
    http: 409
    condition: "CommissionLedgerEntry.status is REVERSED already"
  - id: ERR_RECONCILIATION_NOT_OPEN
    http: 409
    condition: "CarrierReconciliation.status is not OPEN"
  - id: ERR_RECONCILIATION_NOT_DISPUTED
    http: 409
    condition: "CarrierReconciliation.status is not DISPUTED, so it cannot be reopened"
  - id: ERR_COMPLAINT_NOT_OPEN
    http: 409
    condition: "Complaint.status is not OPEN, so review cannot begin"
  - id: ERR_COMPLAINT_NOT_UNDER_REVIEW
    http: 409
    condition: "Complaint.status is not UNDER_REVIEW, so it cannot be substantiated or dismissed"
  - id: ERR_COMPLAINT_NOT_SUBSTANTIATED
    http: 409
    condition: "Complaint.status is neither SUBSTANTIATED nor DISMISSED, so it cannot be appealed"
  - id: ERR_COMPLAINT_NOT_APPEALED
    http: 409
    condition: "Complaint.status is not APPEALED, so it cannot be remanded"
  - id: ERR_COMPLAINT_NOT_CLOSABLE
    http: 409
    condition: "Complaint.status is not DISMISSED or SUBSTANTIATED, so it cannot be closed"

  # --- Temporal and capacity ---
  - id: ERR_ACK_WINDOW_EXPIRED
    http: 409
    condition: "The logical clock is past submitted_on + Carrier.ack_expected_within_days"
  - id: ERR_EFFECTUATION_WINDOW_EXPIRED
    http: 409
    condition: "The logical clock is past acknowledged_on + Carrier.effectuation_expected_within_days"
  - id: ERR_AEP_WINDOW_VIOLATION
    http: 422
    condition: "A PDP election was submitted with an effective_date inside the agency's AEP window"
  - id: ERR_AEP_DAILY_SUBMISSION_CAPACITY_EXCEEDED
    http: 409
    condition: "The count of non-REJECTED, non-WITHDRAWN enrollments effective on the same UTC day already equals Agency.aep_daily_submission_capacity"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "The logical clock is more than 30 days past the substantiating or dismissing instant"
  - id: ERR_COMPLAINT_FILED_IN_FUTURE
    http: 422
    condition: "Complaint.filed_on is later than the logical clock at substantiation"

  # --- Financial and reconciliation ---
  - id: ERR_NOT_RAPID_DISENROLLMENT
    http: 409
    condition: "A RAPID_DISENROLLED classification was requested but the disenrolled day number exceeds Agency.rapid_disenrollment_day_limit"
  - id: ERR_RAPID_DISENROLLMENT_REQUIRES_CHARGEBACK
    http: 409
    condition: "A STANDARD_DISENROLLED classification was requested but the day number is inside the rapid window, so a chargeback is mandatory"
  - id: ERR_NO_OPEN_RECONCILIATION
    http: 409
    condition: "A correction or adjustment names a carrier and period_month with no OPEN reconciliation"
  - id: ERR_RECONCILIATION_VARIANCE_NONZERO
    http: 409
    condition: "Reconciliation was requested while variance_cents is non-zero"
  - id: ERR_RECONCILIATION_VARIANCE_ZERO
    http: 409
    condition: "Dispute or reopen was requested while variance_cents is exactly zero"
  - id: ERR_CARRIER_REPORTED_TOTAL_PRESENT
    http: 409
    condition: "Level recognition was requested for a period that already carries a carrier-reported total"
  - id: ERR_AMOUNT_VARIANT_MISMATCH
    http: 409
    condition: "The ledger entry to finalize does not match the §1.3 FINAL-variant amount for its type"
  - id: ERR_COMMISSION_LEDGER_INVARIANT_VIOLATION
    http: 409
    condition: "The reverse-then-reinstate compensating pair would leave Agency.commission_balance_cents different from its pre-reversal value"
  - id: ERR_NO_SUBSTANTIATION_TO_REVERSE
    http: 409
    condition: "An appeal dismissal was requested but the agent has no standing substantiation to reverse"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The submitted expected_<parent>_version does not equal the parent's current version"

# =============================================================================
# Table 7: RBAC Permission Matrix  (§1.7)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator: configuration of agencies, carriers and plans, the logical clock, and the compliance-posture recompute maintenance action. Never performs an agent's call or enrollment work."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc — set the logical clock"
      - "POST /agencies — create agency"
      - "PUT /agencies/{id} — update agency configuration"
      - "POST /carriers — create carrier"
      - "PUT /carriers/{id} — update carrier rates"
      - "POST /plans — create plan"
      - "POST /plans/{id}/formulary-drugs — add formulary row"
      - "POST /plans/{id}/pharmacy-network-entries — add pharmacy network entry"
      - "POST /plans/{id}/provider-directory-entries — add provider directory entry"
    shared_operations:
      - "POST /_maintenance/recompute-compliance-posture — recompute posture (also ComplianceOfficer)"
      - "POST /call-sessions/{id}/drop — drop a call (also LicensedAgent)"
      - "POST /call-sessions/{id}/recordings — attach a recording (also LicensedAgent)"
      - "All GET list and read endpoints — read-only access to every resource"

  - name: DirectorOfSales
    description: "Sales director: agent lifecycle, ledger finalization and reversal, corrections, and carrier reconciliation. Cannot substantiate complaints and cannot capture a scope of appointment."
    identity: opaque
    exclusive_operations:
      - "POST /agents — create agent"
      - "POST /agents/{id}/terminate — terminate agent"
      - "POST /agents/{id}/rehire — rehire agent"
      - "POST /commission-ledger-entries — post ledger entry"
      - "POST /commission-ledger-entries/{id}/finalize — finalize entry"
      - "POST /commission-ledger-entries/{id}/reverse — reverse entry"
      - "POST /commission-ledger-entries/{id}/reinstate — reinstate entry"
      - "POST /commission-ledger-entries/{id}/reinstate-finalized — reinstate entry as finalized"
      - "POST /enrollments/{id}/commission-adjustment — post adjustment"
      - "POST /corrections — post correction"
      - "POST /carrier-reconciliations — open reconciliation"
      - "POST /carrier-reconciliations/{id}/reconcile — close period"
      - "POST /carrier-reconciliations/{id}/dispute — dispute period"
      - "POST /carrier-reconciliations/{id}/reopen — reopen period"
      - "POST /carrier-reconciliations/{id}/level-recognize — level-recognize period"
    shared_operations:
      - "GET /agencies/{id}/book-of-business — book projection (also PlatformAdmin, ComplianceOfficer)"

  - name: ComplianceOfficer
    description: "Compliance officer: posture governance, complaint adjudication, coaching oversight, agent reinstatement, call amendment and scope voiding. May not perform any money-desk operation."
    identity: opaque
    exclusive_operations:
      - "POST /agencies/{id}/posture-reset — step posture back"
      - "POST /agents/{id}/reinstate — reinstate agent"
      - "POST /complaints — file complaint"
      - "POST /complaints/{id}/begin-review — begin review"
      - "POST /complaints/{id}/substantiate — substantiate"
      - "POST /complaints/{id}/dismiss — dismiss"
      - "POST /complaints/{id}/remand — remand"
      - "POST /complaints/{id}/close — close complaint"
      - "POST /coaching-assignments — create coaching assignment"
      - "POST /call-sessions/{id}/amend — amend a completed call"
      - "POST /scope-of-appointments/{id}/void — void a scope"
      - "POST /enrollments/{id}/withdraw — withdraw a submission"
    shared_operations:
      - "POST /_maintenance/recompute-compliance-posture — recompute posture (also PlatformAdmin)"

  - name: LicensingCoordinator
    description: "Licensing and appointment pipeline operator: state licenses, carrier certifications and carrier appointments. Cannot touch enrollments or money."
    identity: opaque
    exclusive_operations:
      - "POST /agents/{id}/licenses — record state license"
      - "POST /agents/{id}/certifications — record carrier certification"
      - "POST /agents/{id}/appointments — record carrier appointment"

  - name: Coach
    description: "Field coach: works the coaching assignments raised by complaint and secret-shopper findings. Cannot open or close a complaint."
    identity: opaque
    exclusive_operations:
      - "POST /coaching-assignments/{id}/start — start coaching"
      - "POST /coaching-assignments/{id}/complete — complete coaching"

  - name: CarrierIntegration
    description: "Carrier-facing integration identity: files appeals, records acknowledgments, effectuations, rejections and disenrollments. Cannot touch ledger entries or complaints' adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /enrollments/{id}/acknowledge — record acknowledgment"
      - "POST /enrollments/{id}/effectuate — record effectuation"
      - "POST /enrollments/{id}/reject — record rejection"
      - "POST /enrollments/{id}/disenroll — record disenrollment"
      - "POST /complaints/{id}/appeal — file appeal"
    shared_operations:
      - "POST /complaints — file complaint (also ComplianceOfficer)"

  - name: LicensedAgent
    description: "Licensed, certified, appointed agent. The only role that may capture a scope of appointment, open a call, generate a plan comparison or submit an enrollment. Owns its own CallSession, ScopeOfAppointment and Enrollment rows."
    identity: entity_backed:Agent
    exclusive_operations:
      - "POST /members — create member record"
      - "PUT /members/{id} — update member drug and provider lists"
      - "POST /scope-of-appointments — capture scope of appointment"
      - "POST /call-sessions — open a call session"
      - "POST /call-sessions/{id}/connect — connect the call"
      - "POST /call-sessions/{id}/complete — complete the call"
      - "POST /call-sessions/{id}/finalize-amendment — finalize an amendment"
      - "POST /plan-comparisons — generate a plan comparison"
      - "POST /enrollments — submit an enrollment"
    shared_operations:
      - "POST /call-sessions/{id}/drop — drop a call (also PlatformAdmin)"
      - "POST /call-sessions/{id}/recordings — attach a recording (also PlatformAdmin)"
      - "POST /enrollments/{id}/withdraw — withdraw a submission (also ComplianceOfficer)"

  - name: Any
    description: "Read-only aggregation used in §1.5 to mark the GET list and read endpoints that every authenticated role may call."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "Every GET list endpoint"
      - "Every GET single-resource endpoint"