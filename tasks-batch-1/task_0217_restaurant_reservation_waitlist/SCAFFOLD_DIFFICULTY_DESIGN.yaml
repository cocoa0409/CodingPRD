# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Restaurant Reservation & Waitlist — Expert tier
# 9 Difficulty Rules × ≥2 instances each (20 instances total).
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6. Every setup_api_calls
# chain drives empty-DB → the named precondition using only §1.5 endpoints.
#
# Shared fixture conventions (re-used across instances):
#   Restaurant: timezone "UTC" (local==UTC), per_seat_deposit_cents 2500,
#     default_turn_time_minutes 90, cleanup_buffer_minutes 15,
#     late_cancel_cutoff_hours 24, no_show_strike_block_threshold 3,
#     deposit_required_party_threshold 6.
#   ServicePeriod DINNER: 17:00–23:00, slot_interval 30, pacing_max_covers_per_slot 10.
#   Clock pinned to 2026-06-15T12:00:00Z; reservation_start 2026-06-15T18:00:00Z
#     (18:00 local UTC, inside DINNER, grid-aligned, 6h out → early/refundable).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: deposit_per_seat_vs_private_dining_percentage
        grounds:
          - calculations.standard_deposit
          - calculations.private_dining_deposit
          - entities.Reservation.fields.deposit_required
          - entities.PrivateDiningEvent.fields.deposit_due_cents
        distinguishing_aspect: "The two deposit calculations live on different entity domains: standard_deposit is a per-seat product on Reservation (party 6 → 15000), private_dining_deposit is a percentage-of-food-minimum sum on PrivateDiningEvent (food 400000 × 0.25 → 100000); identical 'deposit' label, different formula and different subject entity."
        test_recipe:
          setup:
            - "A restaurant with per_seat_deposit_cents 2500 and a PRIVATE dining area; one ordinary deposit_required reservation (party 6) with a placed hold, and one private-dining event proposed for food_minimum 400000 at deposit_pct 0.25."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R1", timezone: "UTC", per_seat_deposit_cents: 2500, deposit_required_party_threshold: 6, late_cancel_cutoff_hours: 24, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area_std: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "PRIVATE_ROOM", kind: "PRIVATE" }
              as: Manager
              captures: { area_priv: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area_std}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl1: $.data.id, tbl1_v: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Ann", phone: "+15551110001" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl1}", expected_table_version: "${tbl1_v}", party_size: 6, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/deposit-holds"
              payload: { card_last4: "4242" }
              as: Customer
              as_user_id: "${cust}"
              captures: { hold1: $.data.id }
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area_priv}", customer_id: "${cust}", party_size: 30, event_start: "2026-06-20T18:00:00Z", event_end: "2026-06-20T22:00:00Z", food_minimum_cents: 400000, deposit_pct: 0.25 }
              as: Manager
              captures: { pde: $.data.id }
          trigger:
            - call: "POST /private-dining-events/${pde}/propose"
              payload: {}
              as: Manager
              captures: { pde_dep: $.data.deposit_due_cents }
          assert:
            - "DepositHold.${hold1}.amount_cents == 15000"
            - "PrivateDiningEvent.${pde}.deposit_due_cents == 100000"

      - name: reliability_settled_vs_provisional_projection
        grounds:
          - calculations.customer_settled_reliability
          - entities.Customer.fields.settled_reliability_pct
          - entities.Customer.fields.lifetime_reservations
          - entities.Customer.fields.lifetime_failures
        distinguishing_aspect: "Reliability dual-variant on the Customer domain (distinct from the deposit dual-variant's Reservation/PrivateDiningEvent domains): with lifetime 0 completed / 1 failure the settled score is 0.0, while the provisional projection counting the customer's 1 open CONFIRMED reservation as a future success yields 50.0 for the same customer."
        test_recipe:
          setup:
            - "A customer with exactly one NO_SHOW (1 failure, 0 completed) and one currently CONFIRMED future reservation (1 open)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R2", timezone: "UTC", per_seat_deposit_cents: 2500, deposit_required_party_threshold: 6, late_cancel_cutoff_hours: 24, no_show_strike_block_threshold: 3, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Ben", phone: "+15551110002" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res_a: $.data.id }
            - call: "POST /reservations/${res_a}/confirm"
              payload: {}
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:20:00Z" }
              as: Manager
            - call: "POST /reservations/${res_a}/no-show"
              payload: {}
              as: Host
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tbl_v1: $.data.version }
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v1}", party_size: 2, reservation_start: "2026-06-16T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res_b: $.data.id }
            - call: "POST /reservations/${res_b}/confirm"
              payload: {}
              as: Host
          trigger:
            - call: "GET /customers/${cust}/reliability"
              payload: {}
              as: Host
              captures: { settled_pct: $.data.reliability_pct }
            - call: "GET /customers/${cust}/reliability?mode=provisional"
              payload: { mode: "provisional" }
              as: Host
              captures: { prov_pct: $.data.reliability_pct }
          assert:
            - "settled (GET reliability default) reliability_pct == 0.0"
            - "provisional (GET reliability?mode=provisional) reliability_pct == 50.0"
            - "Customer.${cust}.lifetime_failures == 1 and Customer.${cust}.lifetime_reservations == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cancellation_fee_tiered_three_input_nonlinear
        grounds:
          - calculations.cancellation_fee
          - entities.Reservation.fields.cancellation_fee_cents
          - validations[priority=4]
        distinguishing_aspect: "Mode (a): cancellation_fee is non-linear over THREE inputs (hours_before, party_size, per_seat_deposit) with tier selection {0%, 50%, 100%} plus a min() cap against the held amount; the 50% tier on a party-6 booking cancelled 5h out yields exactly 7500 (0.50 × 2500 × 6), not 0 and not 15000."
        test_recipe:
          setup:
            - "A CONFIRMED party-6 reservation with a 15000 hold; clock advanced to 5h before reservation_start (inside the 24h cutoff, above the 2h tier)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R3", timezone: "UTC", per_seat_deposit_cents: 2500, deposit_required_party_threshold: 6, late_cancel_cutoff_hours: 24, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Cara", phone: "+15551110003" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 6, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/deposit-holds"
              payload: { card_last4: "4242" }
              as: Customer
              as_user_id: "${cust}"
              captures: { hold: $.data.id }
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T13:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Reservation.${res}.cancellation_fee_cents == 7500"
            - "DepositHold.${hold}.captured_cents == 7500 and DepositHold.${hold}.status == CAPTURED"

      - name: private_dining_deposit_round_then_sum_order
        grounds:
          - calculations.private_dining_deposit
          - entities.PrivateDiningEvent.fields.deposit_due_cents
          - entities.PrivateDiningEvent.fields.service_charge_pct
        distinguishing_aspect: "Mode (b): two fractional components rounded SEPARATELY then summed. With food 100003, deposit_pct 0.25, service_charge_pct 0.18: round(25000.75)=25001 plus round(18000.54)=18001 gives the pinned round-then-sum = 43002, whereas the forbidden sum-then-round = round(25000.75 + 18000.54) = round(43001.29) = 43001 — the pinned order yields exactly 43002."
        test_recipe:
          setup:
            - "A PRIVATE area; a private-dining event proposed with food_minimum 100003, deposit_pct 0.25, service_charge_pct 0.18."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R4", timezone: "UTC", per_seat_deposit_cents: 2500 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "PRIVATE_ROOM", kind: "PRIVATE" }
              as: Manager
              captures: { area_priv: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana", phone: "+15551110004" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area_priv}", customer_id: "${cust}", party_size: 20, event_start: "2026-06-21T18:00:00Z", event_end: "2026-06-21T22:00:00Z", food_minimum_cents: 100003, deposit_pct: 0.25, service_charge_pct: 0.18 }
              as: Manager
              captures: { pde: $.data.id }
          trigger:
            - call: "POST /private-dining-events/${pde}/propose"
              payload: {}
              as: Manager
              captures: { dep: $.data.deposit_due_cents }
          assert:
            - "PrivateDiningEvent.${pde}.deposit_due_cents == 43002"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_reschedule_cycle_confirmed_back_to_requested
        grounds:
          - state_machines.Reservation.CONFIRMED_to_REQUESTED
          - entities.Reservation.fields.status
          - entities.Reservation.fields.turn_window_end
        distinguishing_aspect: "Reservation carries a cyclic edge CONFIRMED→REQUESTED (reschedule loop) — a non-linear shape; after reschedule the reservation is back in REQUESTED and turn_window_end recomputed for the new start, distinct from a one-way A→B→C pipeline."
        test_recipe:
          setup:
            - "A CONFIRMED party-2 reservation at 18:00, clock 6h before, with a 2-hour late-cancel cutoff so 12:00 is outside the late window (12:00 < 18:00 - 2h = 16:00)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R5", timezone: "UTC", per_seat_deposit_cents: 2500, late_cancel_cutoff_hours: 2, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Eli", phone: "+15551110005" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: Host
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
              captures: { tbl_v1: $.data.version }
          trigger:
            - call: "POST /reservations/${res}/reschedule"
              payload: { table_id: "${tbl}", expected_table_version: "${tbl_v1}", reservation_start: "2026-06-15T19:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Reservation.${res}.status == REQUESTED"
            - "Reservation.${res}.turn_window_end == 2026-06-15T20:30:00.000Z"

      - name: waitlist_requeue_cycle_notified_back_to_waiting
        grounds:
          - state_machines.WaitlistEntry.NOTIFIED_to_WAITING
          - entities.WaitlistEntry.fields.notify_count
          - entities.WaitlistEntry.fields.status
        distinguishing_aspect: "WaitlistEntry carries a cyclic edge NOTIFIED→WAITING (re-queue loop) on a different entity than Reservation; re-queue returns status to WAITING and increments notify_count to 1, a loop a linear pipeline cannot express."
        test_recipe:
          setup:
            - "A WAITING waitlist entry that has been NOTIFIED (a matching AVAILABLE table exists)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R6", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 6 }
              as: Manager
              captures: { tbl: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Faye", phone: "+15551110006" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: Manager
            - call: "POST /waitlist-entries"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", party_size: 2, requested_start: "2026-06-15T18:30:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { wl: $.data.id }
            - call: "POST /waitlist-entries/${wl}/notify"
              payload: {}
              as: Host
          trigger:
            - call: "POST /waitlist-entries/${wl}/requeue"
              payload: {}
              as: Host
          assert:
            - "WaitlistEntry.${wl}.status == WAITING"
            - "WaitlistEntry.${wl}.notify_count == 1"
            - "WaitlistEntry.${wl}.notify_expires_at == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: noshow_capture_strike_block_masscancel_depth4
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Customer.ACTIVE_to_BLOCKED
          - entities.Customer.fields.no_show_strikes
          - entities.Customer.fields.status
          - entities.DepositHold.fields.status
        distinguishing_aspect: "Depth-≥3 chain originating at Reservation NO_SHOW (block threshold pinned to 1 so a single no-show triggers the full chain): NO_SHOW → DepositHold CAPTURED (hop1) → Customer.no_show_strikes reaches threshold 1 → Customer BLOCKED (hop2) → every other future CONFIRMED reservation of that customer auto-CANCELLED (hop3); each link is caused by the previous, not the original action."
        test_recipe:
          setup:
            - "A restaurant with no_show_strike_block_threshold 1; a customer with a CONFIRMED party-6 reservation (held) about to be no-showed, plus a separate future CONFIRMED reservation that the resulting block must cancel."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R7", timezone: "UTC", per_seat_deposit_cents: 2500, deposit_required_party_threshold: 6, no_show_strike_block_threshold: 1, late_cancel_cutoff_hours: 24, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl1: $.data.id, tbl1_v0: $.data.version }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T2", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl2: $.data.id, tbl2_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 30 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Gus", phone: "+15551110007" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl1}", expected_table_version: "${tbl1_v0}", party_size: 6, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res_x: $.data.id }
            - call: "POST /reservations/${res_x}/deposit-holds"
              payload: { card_last4: "4242" }
              as: Customer
              as_user_id: "${cust}"
              captures: { hold_x: $.data.id }
            - call: "POST /reservations/${res_x}/confirm"
              payload: {}
              as: Host
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl2}", expected_table_version: "${tbl2_v0}", party_size: 4, reservation_start: "2026-06-16T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res_future: $.data.id }
            - call: "POST /reservations/${res_future}/confirm"
              payload: {}
              as: Host
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:20:00Z" }
              as: Manager
            - call: "POST /reservations/${res_x}/no-show"
              payload: {}
              as: Host
          assert:
            - "DepositHold.${hold_x}.status == CAPTURED and DepositHold.${hold_x}.captured_cents == 15000"
            - "Customer.${cust}.no_show_strikes == 1 and Customer.${cust}.status == BLOCKED"
            - "Reservation.${res_future}.status == CANCELLED"

      - name: late_cancel_release_freetable_promote_waitlist_depth2
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.WaitlistEntry.WAITING_to_NOTIFIED
          - entities.WaitlistEntry.fields.status
          - entities.Notification.fields.template
        distinguishing_aspect: "Depth-≥2 chain from a DIFFERENT trigger (Reservation early CANCELLED, not no-show): cancel → table frees (hop1) → the promotion-winning WAITING entry is auto-NOTIFIED (hop2) with a WAITLIST_TABLE_READY notification; the second hop is caused by the freeing, not directly by the cancel call."
        test_recipe:
          setup:
            - "A CONFIRMED reservation occupying the only table, plus one WAITING waitlist entry whose party fits that table; a 2-hour cutoff so the 6h-out cancel is early (fee 0)."
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "R8", timezone: "UTC", per_seat_deposit_cents: 2500, late_cancel_cutoff_hours: 2, default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 4 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
