          assert:
            - "After the FIRST cancel-day: GET /esy/service-logs?commitment_id=${c1_id} returns total_count == 1 with outcome == MISSED_DISTRICT, minutes_scheduled == 57, minutes_delivered == 0, generated_by == SYSTEM_DAY_CANCELLATION, provider_id == null, miss_reason_code == WEATHER, status == VERIFIED"
            - "After the FIRST cancel-day: ServiceCommitment.${c1_id}.compensable_owed_minutes == 57 and delivered_minutes == 0"
            - "After the FIRST cancel-day: Student.${s1_id}.pending_award_minutes == 57 and Student.${s1_id}.esy_service_alert == false"
            - "After the FIRST cancel-day: TransportationRun.${run1_id}.status == CANCELLED (fan-out, not a cascade link)"
            - "After the SECOND cancel-day: GET /esy/service-logs?commitment_id=${c1_id} returns total_count == 2, both with minutes_scheduled == 57"
            - "After the SECOND cancel-day: ServiceCommitment.${c1_id}.compensable_owed_minutes == 114"
            - "After the SECOND cancel-day: Student.${s1_id}.pending_award_minutes == 114 and Student.${s1_id}.esy_service_alert == true"
            - "After the SECOND cancel-day: EsyProgram.${p1_id}.cancelled_dates == [2027-06-14, 2027-06-15], instructional_days_count == 20, instructional_week_count == 6"
