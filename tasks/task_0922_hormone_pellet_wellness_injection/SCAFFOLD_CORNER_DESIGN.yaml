        distinguishing_aspect: "A first pause of 60 days is fine; a second resume that would carry pause_days_used to 101 exceeds MAX_PAUSE_DAYS_PER_YEAR of 90, and because the check precedes every mutation the membership stays PAUSED with pause_days_used still 60."
