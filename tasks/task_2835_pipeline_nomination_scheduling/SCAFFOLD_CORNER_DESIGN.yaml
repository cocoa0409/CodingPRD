      - name: maintenance_notify_inside_48h_notice_rejected
        claim_type: Violation → Error
        grounds:
          - validations[ERR_INSUFFICIENT_NOTICE]
        distinguishing_aspect: |
          The common carrier notice obligation is measured from the logical clock: with the clock at
          2026-08-01T00:00:00Z an event starting 2026-08-02T00:00:00Z leaves only 24 hours, so notify
          is refused with 422 ERR_INSUFFICIENT_NOTICE, the event stays PLANNED with notified_at null
          and the segment is never derated.
