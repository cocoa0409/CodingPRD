scaffold_difficulty_design:

  # ============================================================================
  # Rule 1: dual_variant_calc (≥2 instances)
  # Two calculations where two valid algorithms produce different results on
  # DIFFERENT entity domains.
  # ============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bid_score_lowest_vs_comprehensive
        grounds:
          - calculations.bid_final_score
          - state_machines.Bid.OPENED_to_EVALUATED
          - entities.Project.evaluation_method
          - entities.TenderDocument.evaluation_criteria
        distinguishing_aspect: |
          Operates on the Bid/Project domain: the same three submitted bids produce two
          different winners depending on Project.evaluation_method (LOWEST_PRICE selects
          the smallest bid_price_cents; COMPREHENSIVE_SCORING applies a weighted formula
          and may pick a higher-priced bid because of technical/qualification scores).
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z; Plan PUBLISHED with PlanItem PUBLISHED budget=10_000_000"
            - "Three VERIFIED suppliers SA(qualifications=[Q1,Q2]), SB(qualifications=[Q1,Q2]), SC(qualifications=[Q1]) all credit_score=700"
            - "Project A required_qualifications=[Q1,Q2], evaluation_method=LOWEST_PRICE, estimated_value_cents=10_000_000"
            - "Project B identical to A but evaluation_method=COMPREHENSIVE_SCORING with weights {price:0.40, technical:0.40, qualification:0.20}; max_technical_score=100"
            - "Bids on Project A: SA=8_000_000, SB=10_000_000, SC=7_000_000 (technical_score_raw 90/85/95)"
            - "Bids on Project B: identical numerical inputs as Project A"
          trigger:
            - "Advance clock past bid_submission_deadline and bid_opening_at on both projects"
            - "Close bidding, form committee, open bid ceremony, record evaluation for each bid on both projects, finalize committee, decide-award on both"
          assert:
            - "Project A: Award.winning_bid_id == SC's bid (bid_price_cents=7_000_000); Award.award_amount_cents == 7_000_000"
            - "Project B: Award.winning_bid_id == SA's bid; SA.final_score == 91.00; SB.final_score == 82.00; SC.final_score == 88.00; Award.award_amount_cents == 8_000_000"
            - "Therefore identical numerical inputs select DIFFERENT winners purely from the evaluation_method variant."

      - name: prescreen_at_submission_vs_at_close
        grounds:
          - calculations.prescreen_eligibility
          - state_machines.Bid.SUBMITTED_to_DISQUALIFIED
          - entities.Supplier.blacklist_until
          - state_machines.Project.BIDDING_OPEN_to_BIDDING_CLOSED
        distinguishing_aspect: |
          Operates on the Supplier/Bid domain (different entity domain from bid_final_score):
          the prescreen_eligibility check is evaluated twice with two valid interpretations
          producing different boolean results — once at bid submission (snapshotting
          prescreen_passed onto the Bid), and once again at BIDDING_OPEN -> BIDDING_CLOSED
          using the supplier's NOW-current state. A supplier blacklisted between these
          two moments has prescreen_passed=true on the row but is DISQUALIFIED at close.
        test_recipe:
          setup:
            - "Supplier S VERIFIED, credit_score=700, qualifications=[Q1,Q2], blacklist_until=null"
            - "Project P required_qualifications=[Q1,Q2], BIDDING_OPEN"
            - "S submits bid B at clock=T0 (prescreen_passed snapshotted true)"
          trigger:
            - "Regulator blacklists S until T0 + 365 days at clock=T0+1min"
            - "Advance clock past bid_submission_deadline; POST close-bidding"
          assert:
            - "Bid B.prescreen_passed == true (snapshot at submission)"
            - "Bid B.bid_status == DISQUALIFIED (re-evaluation at close used current blacklist state)"
            - "Identical bid row, two evaluations of the SAME rule give different outcomes."

  # ============================================================================
  # Rule 2: combinatorial_formula (≥2 instances, different modes from {a,b,c})
  # ============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: comprehensive_scoring_three_input_nonlinear
        grounds:
          - calculations.bid_final_score
          - entities.TenderDocument.evaluation_criteria
          - entities.Bid.bid_price_cents
          - entities.Bid.technical_score_raw
          - entities.Supplier.qualifications
        distinguishing_aspect: |
          Mode (a): a formula with three independent inputs (price ratio against the
          dynamic lowest_bid_price_cents, technical raw score scaled to max, set-intersection
          ratio over required_qualifications) combined with three independent weights.
          The price sub-score is non-linear in bid_price_cents (1/x form), and the
          qualification sub-score depends on set membership not a numeric value.
        test_recipe:
          setup:
            - "Same as bid_score_lowest_vs_comprehensive (COMPREHENSIVE_SCORING path)"
          trigger:
            - "Record evaluations for SA, SB, SC bids on Project B"
          assert:
            - "SA.final_score == 91.00"
            - "SB.final_score == 82.00"
            - "SC.final_score == 88.00"
            - "Order SA > SC > SB confirms non-linear interaction between price ratio and qualification ratio."

      - name: bid_score_rounding_order_pinned
        grounds:
          - calculations.bid_final_score
          - calculations.bid_final_score.precision
        distinguishing_aspect: |
          Mode (b): nested rounding where order is pinned — each sub-score is rounded to
          2 decimals BEFORE the weighted sum, and the weighted sum is rounded again.
          'Sum then round' vs 'round-each then sum then round' produce different cents
          for adversarially chosen inputs; the scaffold pins the per-component-first order.
        test_recipe:
          setup:
            - "Project P COMPREHENSIVE_SCORING; weights {price:0.333_333_333, technical:0.333_333_333, qualification:0.333_333_334}"
            - "Bid X: price=100, lowest_bid_price=100 -> price_sub_score=100.00; technical raw=33, max=100 -> technical_sub_score=33.00; quals 1 of 3 -> qualification_sub_score=33.33 (round_half_up 33.333…)"
          trigger:
            - "Record evaluation on Bid X"
          assert:
            - "Per-component sub-scores stored at exactly 2 decimal places (100.00, 33.00, 33.33)"
            - "Final = round(0.333333333*100.00 + 0.333333333*33.00 + 0.333333334*33.33, 2) == 55.44"
            - "Naive 'sum-first-then-round' of unrounded components (100 + 33 + 33.333... weighted) yields 55.44 in this case, but the test pins the per-component rounding order; an implementation that skips per-component rounding fails the next case where rounding direction flips."

  # ============================================================================
  # Rule 3: non_linear_state_machine (≥2 instances, different entities)
  # ============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: tender_document_publish_cycle
        grounds:
          - state_machines.TenderDocument.PUBLISHED_to_CLARIFYING
          - state_machines.TenderDocument.CLARIFYING_to_PUBLISHED
          - state_machines.TenderDocument.PUBLISHED_to_AMENDING
          - state_machines.TenderDocument.AMENDING_to_PUBLISHED
        distinguishing_aspect: |
          Cyclic shape on TenderDocument entity: PUBLISHED -> CLARIFYING -> PUBLISHED
          loop preserves version, while PUBLISHED -> AMENDING -> PUBLISHED loop
          increments version. Same source state, two different cycles, different side effects.
        test_recipe:
          setup:
            - "TenderDocument TD at PUBLISHED, version=1, with a SUBMITTED Bid B"
          trigger:
            - "POST clarify; POST finalize-clarification (cycle 1)"
            - "POST begin-amendment; POST publish (cycle 2)"
          assert:
            - "After cycle 1: TD.doc_status == PUBLISHED, TD.version == 1; Bid B.bid_status == SUBMITTED"
            - "After cycle 2: TD.doc_status == PUBLISHED, TD.version == 2; Bid B.bid_status == WITHDRAWN"

      - name: procurement_plan_amendment_cycle
        grounds:
          - state_machines.ProcurementPlan.PUBLISHED_to_AMENDING
          - state_machines.ProcurementPlan.AMENDING_to_PUBLISHED
          - entities.ProcurementPlan.amendment_round
        distinguishing_aspect: |
          Cyclic shape on ProcurementPlan entity (different entity from TenderDocument):
          PUBLISHED -> AMENDING -> PUBLISHED loop increments amendment_round and may
          re-classify PlanItems. The cycle creates a non-linear (revert) edge missing
          from a simple A->B->C->D pipeline.
        test_recipe:
          setup:
            - "Plan P PUBLISHED with two PlanItems PI1=PUBLISHED, PI2=PUBLISHED; no Projects on either yet; amendment_round=0"
          trigger:
            - "POST /procurement/plans/{P}/begin-amendment"
            - "POST /procurement/plans/{P}/publish (no item changes)"
          assert:
            - "Plan P status returns to PUBLISHED"
            - "Plan P.amendment_round == 1"
            - "Plan P.published_at unchanged from before the cycle (initial publication timestamp preserved)"

  # ============================================================================
  # Rule 4: transitive_cascade (≥2 instances, different triggers; ≥1 depth-3)
  # ============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complaint_upheld_revoke_award_cascade
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_UPHELD
          - state_machines.Project.AWARDED_to_FROZEN
          - state_machines.Bid.SUBMITTED_to_DISQUALIFIED
        distinguishing_aspect: |
          Depth-3 cascade originating from Complaint UPHOLD with corrective_action=REVOKE_AWARD:
          (1) Complaint UPHELD itself sets Award.award_status -> REVOKED; (2) the Award
          mutation then triggers Project AWARDED -> FROZEN; (3) FROZEN project then triggers
          the winning Bid to be DISQUALIFIED. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Project P at AWARDED with Award A PUBLISHED winning Bid B (AWARDED), and 2 LOST bids"
            - "Complaint C UNDER_REVIEW on project P"
          trigger:
            - "POST /procurement/complaints/{C}/uphold with corrective_action=REVOKE_AWARD"
          assert:
            - "Complaint C.complaint_status == UPHELD"
            - "Award A.award_status == REVOKED (link 1)"
            - "Project P.project_status == FROZEN AND frozen_reason == COMPLAINT_UPHELD (link 2)"
            - "Bid B.bid_status == DISQUALIFIED (link 3)"

      - name: contract_sign_executes_plan_item_cascade
        grounds:
          - state_machines.Contract.PENDING_SIGNATURE_to_ACTIVE
          - state_machines.Project.AWARDED_to_CONTRACT_SIGNED
          - state_machines.PlanItem.PUBLISHED_to_EXECUTED
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (Contract sign, not Complaint upheld):
          (1) Contract PENDING_SIGNATURE -> ACTIVE sets signature_ref; (2) that sign event
          drives Project AWARDED -> CONTRACT_SIGNED; (3) which drives the parent PlanItem
          PUBLISHED -> EXECUTED and increments executed_amount_cents.
        test_recipe:
          setup:
            - "Plan P PUBLISHED with PlanItem PI PUBLISHED budget=10_000_000; Project J AWARDED on PI; Award AWD PUBLISHED award_amount_cents=8_000_000; Contract K PENDING_SIGNATURE with contract_amount_cents=8_000_000 matching tender"
          trigger:
            - "POST /procurement/contracts/{K}/sign"
          assert:
            - "Contract K.contract_status == ACTIVE AND signature_ref != null (link 1)"
            - "Project J.project_status == CONTRACT_SIGNED (link 2)"
            - "PlanItem PI.item_status == EXECUTED AND PI.executed_amount_cents == 8_000_000 (link 3)"

  # ============================================================================
  # Rule 5: priority_pair_validation_conflict (≥2 instances, different category pairs)
  # ============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_temporal_priority
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          state (priority 6, ERR_INVALID_STATE) MUST win over business_temporal
          (priority 9, ERR_DEADLINE_PASSED). Pair: state vs business_temporal.
        test_recipe:
          setup:
            - "Project P at PRESCREEN_OPEN (not BIDDING_OPEN); bid_submission_deadline already in the past at clock T"
            - "VERIFIED supplier S with required qualifications"
          trigger:
            - "POST /procurement/projects/{P}/bids attempting to submit a bid"
          assert:
            - "Response is ERR_INVALID_STATE (HTTP 409), not ERR_DEADLINE_PASSED"
            - "Two failures simultaneously valid; priority pins state over temporal."

      - name: blacklist_vs_referential_priority
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: |
          business_safety (priority 8, ERR_SUPPLIER_BLACKLISTED) MUST win over
          business_referential (priority 14, ERR_TENDER_VERSION_MISMATCH). Pair:
          business_safety vs business_referential (different from state/temporal above).
        test_recipe:
          setup:
            - "Supplier S blacklisted (blacklist_until far in the future)"
            - "Project P BIDDING_OPEN; TenderDocument TD PUBLISHED version=3"
          trigger:
            - "POST /procurement/projects/{P}/bids with tender_document_version=1 by S"
          assert:
            - "Response is ERR_SUPPLIER_BLACKLISTED (HTTP 403), not ERR_TENDER_VERSION_MISMATCH"
            - "Different category pair than the previous instance."

  # ============================================================================
  # Rule 6: boundary_precision_check (≥2 instances, different metrics + endpoints)
  # ============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credit_score_min_at_exact_600
        grounds:
          - calculations.prescreen_eligibility
          - entities.Supplier.credit_score
        distinguishing_aspect: |
          Numeric threshold boundary: credit_score >= 600 passes prescreen; 599 fails.
          The metric is credit_score (integer) and the test endpoint is POST
          /procurement/projects/{id}/bids (snapshot prescreen_passed).
        test_recipe:
          setup:
            - "Supplier S1 with credit_score=600 (boundary), VERIFIED, qualifications match"
            - "Supplier S2 with credit_score=599 (boundary - 1), VERIFIED, qualifications match"
            - "Project P BIDDING_OPEN with required_qualifications matched by both suppliers"
          trigger:
            - "Both S1 and S2 submit bids via POST /procurement/projects/{P}/bids"
          assert:
            - "S1's Bid.prescreen_passed == true"
            - "S2's Bid.prescreen_passed == false"

      - name: committee_minimum_size_three_bids
        grounds:
          - state_machines.Project.BIDDING_CLOSED_to_EVALUATING
          - validations[priority=6]
        distinguishing_aspect: |
          Different metric (count of SUBMITTED bids) on a different endpoint
          (POST /procurement/projects/{id}/open-bid-ceremony). Boundary precision:
          exactly 3 SUBMITTED bids passes; 2 fails with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Project P at BIDDING_CLOSED with EvaluationCommittee FORMED"
            - "Two bid count variants: case A=3 SUBMITTED bids passing prescreen; case B=2 such bids"
          trigger:
            - "Case A: POST /procurement/projects/{P}/open-bid-ceremony"
            - "Case B: POST /procurement/projects/{P}/open-bid-ceremony"
          assert:
            - "Case A returns 200; Project.project_status == EVALUATING"
            - "Case B returns ERR_INVALID_STATE (precondition 'Count of Bids with bid_status = SUBMITTED is >= 3' failed)"

  # ============================================================================
  # Rule 7: cross_entity_state_dependency (≥2 instances, different entity pairs)
  # ============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: project_creation_requires_plan_item_published
        grounds:
          - validations[priority=12]
          - entities.PlanItem.item_status
          - entities.Project.plan_item_id
        distinguishing_aspect: |
          Pair Project ↔ PlanItem: a Project may only be created when its parent
          PlanItem.item_status = PUBLISHED. PROPOSED/APPROVED/REJECTED/CANCELLED all fail.
        test_recipe:
          setup:
            - "PlanItem PI1 in APPROVED (parent plan UNDER_REVIEW)"
            - "PlanItem PI2 in PUBLISHED (parent plan PUBLISHED)"
          trigger:
            - "Attempt POST /procurement/projects with plan_item_id=PI1"
            - "Attempt POST /procurement/projects with plan_item_id=PI2"
          assert:
            - "First call returns ERR_PLAN_ITEM_NOT_PUBLISHED (HTTP 409)"
            - "Second call returns 201 with a created Project"

      - name: contract_sign_requires_award_published
        grounds:
          - state_machines.Contract.PENDING_SIGNATURE_to_ACTIVE
          - entities.Award.award_status
          - calculations.contract_consistency_check
        distinguishing_aspect: |
          Different entity pair (Contract ↔ Award, not Project ↔ PlanItem):
          Contract.PENDING_SIGNATURE -> ACTIVE requires Award.award_status == PUBLISHED.
          If Award is still DECIDED, sign is rejected.
        test_recipe:
          setup:
            - "Award A in DECIDED (not yet published)"
            - "Contract K filed against A with consistent clauses"
          trigger:
            - "POST /procurement/contracts/{K}/sign"
          assert:
            - "Response is ERR_INVALID_STATE (HTTP 409)"
            - "After POST /procurement/awards/{A}/publish, retry POST sign returns 200 and Contract.contract_status == ACTIVE"

  # ============================================================================
  # Rule 8: resource_temporal_overlap (≥2 instances, different interval semantics)
  # ============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bid_submission_strict_before_deadline
        grounds:
          - validations[priority=9]
          - entities.Project.bid_submission_deadline
          - entities.ClockState.current_time
        distinguishing_aspect: |
          Interval semantics: bid submission accepts ClockState.current_time STRICTLY less
          than bid_submission_deadline; equality is rejected (closed-on-the-right interval).
          Resource entity: Project.bid_submission_deadline.
        test_recipe:
          setup:
            - "Project P BIDDING_OPEN with bid_submission_deadline=T"
            - "Supplier S VERIFIED matching qualifications"
          trigger:
            - "Advance clock to exactly T; POST /procurement/projects/{P}/bids by S"
            - "(Re-run after rewinding) advance clock to T-1ms; POST same"
          assert:
            - "At clock==T: response is ERR_DEADLINE_PASSED"
            - "At clock==T-1ms: response is 201 with created Bid"

      - name: project_window_invariant_query_before_deadline_before_opening
        grounds:
          - validations[priority=11]
          - entities.Project.query_window_close_at
          - entities.Project.bid_submission_deadline
          - entities.Project.bid_opening_at
        distinguishing_aspect: |
          Different interval semantics (aggregate three-point ordering, not single-instant
          edge): the triple (query_window_close_at, bid_submission_deadline, bid_opening_at)
          MUST be strictly increasing. Resource entity: Project (different from
          ClockState resource above). The check operates on three intervals' endpoints.
        test_recipe:
          setup:
            - "Three Project create payloads on PlanItem PI=PUBLISHED:"
            - "(a) qwc=T-1d, bsd=T,    bo=T+1d  -- valid"
            - "(b) qwc=T,    bsd=T,    bo=T+1d  -- equal -> invalid"
            - "(c) qwc=T-1d, bsd=T+1d, bo=T     -- opening before deadline -> invalid"
          trigger:
            - "POST /procurement/projects for each of (a), (b), (c)"
          assert:
            - "(a) returns 201"
            - "(b) and (c) return ERR_INVALID_TIME_WINDOW (HTTP 422)"

  # ============================================================================
  # Rule 9: compensating_invariant (≥2 instances, different conserved quantities)
  # ============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contract_termination_unwinds_plan_item_obligation
        grounds:
          - state_machines.Contract.ACTIVE_to_TERMINATED
          - state_machines.Contract.PENDING_SIGNATURE_to_ACTIVE
          - state_machines.PlanItem.PUBLISHED_to_EXECUTED
          - entities.PlanItem.executed_amount_cents
        distinguishing_aspect: |
          Conserved quantity: PlanItem.executed_amount_cents must equal
          (cumulative ACTIVE-time obligations) - (terminated unpaid amounts).
          Forward action (sign) increases executed_amount_cents by contract_amount_cents;
          compensating action (terminate before any payment) decreases it by
          (contract_amount_cents - paid_amount_cents), so the running quantity returns
          to the pre-sign value.
        test_recipe:
          setup:
            - "PlanItem PI executed_amount_cents=0; Contract K PENDING_SIGNATURE contract_amount_cents=8_000_000; Award PUBLISHED award_amount_cents=8_000_000"
          trigger:
            - "POST /procurement/contracts/{K}/sign  -> executed_amount_cents becomes 8_000_000"
            - "POST /procurement/contracts/{K}/terminate (paid_amount_cents=0)"
          assert:
            - "After sign: PlanItem.executed_amount_cents == 8_000_000"
            - "After terminate: PlanItem.executed_amount_cents == 0 (net change zero, invariant restored)"

      - name: tender_amendment_invalidates_bids_but_preserves_count_of_active_bids
        grounds:
          - state_machines.TenderDocument.PUBLISHED_to_AMENDING
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
          - entities.Bid.bid_status
        distinguishing_aspect: |
          Different conserved quantity: count of non-terminal bids that the SAME supplier
          can hold on a project, defined as
          NonTerminalBidCount(supplier_id, project_id) = COUNT(Bid WHERE bid_status NOT IN
          {WITHDRAWN, AWARDED, LOST, DISQUALIFIED}). Forward action (submit) increments by
          one; compensating action (TenderDocument PUBLISHED -> AMENDING for that project)
          decrements every supplier's SUBMITTED count by exactly the count of their SUBMITTED
          bids on that project (i.e., to zero). Net change for a supplier that submits then
          is amended-out is zero — the invariant prevents 'phantom bid' rows.
        test_recipe:
          setup:
            - "Project P BIDDING_OPEN; Supplier S has 0 bids on P"
          trigger:
            - "S submits bid B (NonTerminalBidCount(S,P) becomes 1)"
            - "POST /procurement/tender-documents/{TD of P}/begin-amendment"
          assert:
            - "Immediately after submit: count of Bids where supplier_id=S, project_id=P, bid_status NOT IN {WITHDRAWN, AWARDED, LOST, DISQUALIFIED} == 1"
            - "After amendment: same count == 0; Bid B.bid_status == WITHDRAWN"
            - "Conserved quantity (NonTerminalBidCount) returns to its pre-submit value of 0."
