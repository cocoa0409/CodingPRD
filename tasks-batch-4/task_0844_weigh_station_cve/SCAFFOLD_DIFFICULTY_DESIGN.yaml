  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: gross_weight_strict_over_limit
        grounds:
          - calculations.screening_decision
          - entities.Screening.fields.overweight
          - entities.WeighStation.fields.gross_weight_limit_lbs
        distinguishing_aspect: "Weight metric on POST /screenings: gross == 80000 (exactly at limit) is legal -> BYPASS/CLEARED; gross == 80001 is overweight -> PULL_IN/REFERRED. The boundary is strict '>'."
        test_recipe:
          setup:
            - "Active carrier; default-limit station; driver."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-K", legal_name: "Kilo Cartage", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-25", state_code: "NM" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-11", full_name: "Lena Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
          trigger:
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-11", axle_count: 5, gross_weight_lbs: 80000, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { screening_at_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-11", axle_count: 5, gross_weight_lbs: 80001, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { screening_over_id: "$.data.id" } }
          assert:
            - "Screening.${screening_at_id}.overweight == false"
            - "Screening.${screening_at_id}.status == CLEARED"
            - "Screening.${screening_over_id}.overweight == true"
            - "Screening.${screening_over_id}.status == REFERRED"

      - name: finalize_oos_empty_violation_set
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_OOS_ISSUED
          - errors[ERR_NO_OOS_BASIS]
        distinguishing_aspect: "Empty-set metric on POST /inspections/{id}/finalize: an OOS finalize with zero oos==true violations recorded is rejected ERR_NO_OOS_BASIS — a zero-count edge on a different endpoint than the weight boundary."
        test_recipe:
          setup:
            - "Active carrier; REFERRED overweight screening; inspection with NO violations recorded."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-L", legal_name: "Lima Lines", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-35", state_code: "TX" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-12", full_name: "Moe Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-12", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
          trigger:
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NO_OOS_BASIS"
            - "HTTP status == 422"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: screening_decision_gated_by_carrier_oos
        grounds:
          - calculations.screening_decision
          - state_machines.Screening.SCREENED_to_REFERRED
          - state_machines.Carrier.ACTIVE_to_OOS_ORDERED
          - entities.Carrier.fields.status
        distinguishing_aspect: "Screening's SCREENED->CLEARED transition depends on Carrier.status: an OOS_ORDERED carrier forces a legal-weight screening to PULL_IN/REFERRED with referral_reason PRISM_TARGET (Screening<-Carrier pair)."
        test_recipe:
          setup:
            - "Carrier driven to OOS_ORDERED by an inspection whose OOS violations sum 20 (oos_points 20 >= 20)."
          setup_api_calls:
            - { call: "POST /carriers", payload: { usdot_number: "DOT-844-M", legal_name: "Mike Freight", irp_status: "ACTIVE", ifta_status: "ACTIVE", ucr_status: "ACTIVE" }, as: ComplianceAdmin, captures: { carrier_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "I-95", state_code: "VA" }, as: ComplianceAdmin, captures: { station_id: "$.data.id" } }
            - { call: "POST /stations/${station_id}/bays", payload: { label: "Bay 1" }, as: ComplianceAdmin, captures: { bay_id: "$.data.id" } }
            - { call: "POST /carriers/${carrier_id}/drivers", payload: { cdl_number: "CDL-13", full_name: "Nora Driver" }, as: ComplianceAdmin, captures: { driver_id: "$.data.id" } }
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-13", axle_count: 5, gross_weight_lbs: 86000, heaviest_axle_lbs: 21000, hazmat_placarded: false }, as: Screener, captures: { screening_seed_id: "$.data.id" } }
            - { call: "POST /inspections", payload: { screening_id: "${screening_seed_id}", bay_id: "${bay_id}", level: "LEVEL_I", scheduled_start: "2026-03-02T10:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }, as: Inspector, captures: { inspection_id: "$.data.id" } }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.75", category: "WEIGHT", severity_weight: 10, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/violations", payload: { code: "393.9", category: "VEHICLE", severity_weight: 10, oos: true }, as: Inspector }
            - { call: "POST /inspections/${inspection_id}/finalize", payload: { result: "OOS" }, as: Inspector }
          trigger:
            - { call: "POST /screenings", payload: { station_id: "${station_id}", carrier_id: "${carrier_id}", driver_id: "${driver_id}", vehicle_plate: "PLT-13", axle_count: 5, gross_weight_lbs: 79000, heaviest_axle_lbs: 19000, hazmat_placarded: false }, as: Screener, captures: { screening_legal_id: "$.data.id" } }
          assert:
            - "Carrier.${carrier_id}.status == OOS_ORDERED"
