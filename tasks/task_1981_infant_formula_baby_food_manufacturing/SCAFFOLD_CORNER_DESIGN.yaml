              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${np_sod_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/ingredients"
              payload:
                ingredient_code: "WPC-SOD"
                ingredient_name: "WPC SOD Test"
