- section: cross_cutting_complexity_layers
  instances:
  - name: a_quote_written_from_a_stale_lead_view_is_refused_and_a_refreshed_one_is_not
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[quote-create-stale-lead]
    - errors[ERR_STALE_LEAD_VERSION]
    - endpoints["POST /group-sales/rate-quotes"]
    - state_machines.Lead[CLEARED -> CLEARED]
    distinguishing_aspect: |
      The interleaving is real rather than synthetic: a re-study of already-cleared business is requested between the client's read of the lead and its quote write, which bumps Lead.version WITHOUT moving lead.status, so status-based guards cannot detect it and only the version comparison can. The refreshed retry then succeeds with identical business content, which rules out an implementation that rejects the payload for some other reason.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; CORPORATE account; InventoryDay rows 2026-11-09..11; lead qualified
        and cleared by an approved FORECAST_BASED analysis, so lead.status == CLEARED at version 4
