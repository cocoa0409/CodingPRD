              payload: { units: 20, carrier_ref: "UT-BOX-2" }
              as: PublisherEditor
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
          assert:
            - "the first file attempt returns HTTP status 422 with error_id ERR_SAMPLING_INCOMPLETE"
            - "after the first attempt Submission.${sub_id}.review_status == DRAFT and Submission.${sub_id}.filed_at == null"
            - "after the second shipment Submission.${sub_id}.sampling_status == SHIPPED"
            - "the second file attempt returns HTTP status 200"
            - "Submission.${sub_id}.review_status == FILED"
            - "Submission.${sub_id}.filed_at == 2026-09-15T00:00:00Z"
            - "Title.${ttl_id}.on_hand_units == 70"

      - name: three_legal_slots_collectively_exceed_declared_minute_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority=62]
          - entities.CommitteePanel.fields.slot_minutes_capacity
          - errors[ERR_PANEL_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          On a panel whose slot_minutes_capacity is 60 inside a four-hour session, three 30-minute
          slots that each sit in the session and each clear the 10-minute buffer are individually
          legal, yet the third pushes reserved_minutes to 90 and must fail with
          ERR_PANEL_CAPACITY_EXCEEDED (409) with reserved_minutes left at 60.
        test_recipe:
          setup:
            - "State NV is OPEN_TERRITORY with min_verified_coverage_pct 50.00 and one MATH standard NV.M.1.1"
            - "Three grade 1-1 MATH titles have FILED submissions in the OPEN 2027 cycle at clock 2026-09-15"
            - "Panel NV-A runs 14:00-18:00 with buffer_minutes 10 and slot_minutes_capacity 60, and already seats 14:00-14:30 and 14:40-15:10, so reserved_minutes is 60"
