      - name: venue_slot_occupancy_restored_after_meeting_cancellation
        grounds:
          - state_machines.PublicMeeting.SCHEDULED_to_CANCELLED
          - calculations.venue_slot_conflict
          - errors[ERR_VENUE_SLOT_CONFLICT]
          - entities.Venue.fields.booked_meeting_count
          - entities.ParticipationPlan.fields.meeting_count
        distinguishing_aspect: |
          The compensated invariant is venue slot occupancy rather than an emissions
          ledger: cancelling M1 must decrement Venue.booked_meeting_count and
          ParticipationPlan.meeting_count AND free the buffer-expanded interval, so the
          identical 19:00-20:00 request that was rejected with ERR_VENUE_SLOT_CONFLICT
          before the cancellation succeeds afterwards with the counters back at 1.
