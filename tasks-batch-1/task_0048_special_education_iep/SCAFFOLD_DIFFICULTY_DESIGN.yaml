      - name: active_iep_id_set_then_cleared_invariant
        grounds:
          - state_machines.IEP.MEETING_HELD_to_ACTIVE
          - state_machines.IEP.ACTIVE_to_AMENDMENT_PENDING
          - entities.Student.fields.active_iep_id
        distinguishing_aspect: >-
          Conserved quantity = the count of IEPs the student points to via active_iep_id (a 0/1
          pointer). Activating an IEP (forward) sets active_iep_id to that IEP; opening an amendment
          (compensating) clears it back to null — the pointer returns to its pre-activation value,
          a different conserved quantity than the LRE percentage.
