  - { method: PATCH, path: "/api/accounts/{id}", description: "Update account profile (OCC-guarded)", roles: [PremiumSalesRep, StadiumAdmin], code: 200, input: ["legal_name?", "billing_email?", "tax_id?", expected_account_version], output: Account, side_effects: ["increments Account.version by 1"] }
  - { method: POST, path: "/api/accounts/{id}/set_status", description: "Account status transitions (PROSPECT->ACTIVE, ACTIVE<->SUSPENDED)", roles: [FinanceController, PremiumSalesRep, StadiumAdmin], code: 200, input: [target_status], output: Account, side_effects: ["see Account machine; suspend cascades to agreements only when system-triggered at settle"] }

  # --- LicenseAgreement ---
