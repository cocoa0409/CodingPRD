          The dual variant here is consumption accounting on UsageWindow, a different entity domain
          from the Developer trust score: two windows with byte-identical inputs (total_calls 200000,
          burst_calls 50000) charge 150000 against the allowance under BURST_ISOLATED and 200000
          under BURST_INCLUSIVE, because the first window drained burst_credit_balance from 90000
          to 40000 and 40000 < 50000 flips the variant selector.
