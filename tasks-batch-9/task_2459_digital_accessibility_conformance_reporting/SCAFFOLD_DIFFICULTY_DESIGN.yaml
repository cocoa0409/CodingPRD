            - call: "POST /components/${comp_id}/design-review"
              payload: { review_decision: "BLOCK", review_note: "Focus order not specified in the design" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
              captures: { blocked_state: $.data.design_review_state, blocked_assessment_state: $.data.assessment_state, blocked_coverage: $.data.coverage_pct }
            - call: "POST /components/${comp_id}/design-review"
              payload: { review_decision: "PASS", review_note: "Focus order added to acceptance criteria" }
              as: ConformanceReviewer
              as_user_id: "reviewer-1"
          assert:
            - "${blocked_state} == REVIEWED_BLOCKED"
            - "${blocked_assessment_state} == COMPLETE"
