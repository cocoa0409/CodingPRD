scenario: |
  Generate task harder than expert level!

  2595. Ambulatory Infusion Suite Scheduling & Chair Utilization (health system infusion center): appointment templating by drug administration time and nursing acuity, pre-visit authorization, drug availability and lab result gating, chair utilization optimization with staggered start times and pre-medication windows, same-day add-on and urgent slot reservation, drug preparation timing to avoid waste on cancellations, reaction and adverse event management with post-infusion observation, patient no-show pattern management and reminder cadence, biosimilar and site-of-care steering impacts on volume

domain_name: infusion-suite-scheduling

# All resource collections are top-level (flat topology); there is no nesting
# prefix. `/` therefore denotes "every collection hangs directly off the root".
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - ops_run_checkpoint

  entity_topology: flat
  # Fourteen peer entities linked purely by foreign keys. No entity is nested in
  # a URL path segment of its parent; every collection is addressed at the root
  # (`/appointments`, `/chairs`, `/drug-lots`), and parent scoping is expressed
  # through filter query parameters, not path hierarchy. Action sub-paths
  # (`/appointments/{id}/confirm`) are verbs on one resource, not ownership.

  state_machine_shape: parallel
  # Appointment carries TWO independent state dimensions on the same row:
  # `schedule_status` (TENTATIVE -> ... -> COMPLETED | CANCELLED | NO_SHOW) and
  # `readiness_status` (PENDING / AUTH_CLEARED / LAB_CLEARED / FULLY_CLEARED /
  # BLOCKED). Each evolves from its own triggers. AuthorizationRequest adds a
  # cycle (PENDED -> SUBMITTED -> PENDED ...), DrugPreparation adds a branching
  # fork (PREPARED -> {ADMINISTERED | WASTED | RETURNED}), and TreatmentPlan is
  # compound (COMPLETED is derived from its appointments' statuses).

  relationship_patterns:
    - one_to_many          # InfusionCenter -> Chair / Nurse; Appointment -> DrugPreparation
    - self_referential     # Drug.reference_drug_id -> Drug.id (biosimilar -> originator)
                           # Appointment.rescheduled_from_appointment_id -> Appointment.id
                           # TreatmentPlan.supersedes_plan_id -> TreatmentPlan.id
    - cross_aggregate      # DrugPreparation bridges Appointment and DrugLot
                           # AppointmentTemplate bridges InfusionCenter and Drug

  role_model: peer_roles
  # Scheduler owns booking/reminders/sweeps, InfusionNurse owns the bedside
  # lifecycle and labs, Pharmacist owns drugs/lots/preparations,
  # AuthorizationSpecialist owns payer authorization, MedicalDirector owns
  # configuration and clinical review, Patient owns reminder responses and
  # self-service cancellation. No role is a superset of another.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: InfusionCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the ambulatory infusion suite."
        constraints: "1-120 characters, non-blank"
      - name: open_minute
        type: integer
        source: input
        description: "First bookable minute of the service day, counted from UTC midnight (480 = 08:00Z)."
        constraints: "0 <= open_minute < close_minute <= 1440"
      - name: close_minute
        type: integer
        source: input
        description: "Exclusive end of the service day in minutes from UTC midnight (1140 = 19:00Z). Every appointment window must satisfy end_minute <= close_minute."
        constraints: "open_minute < close_minute <= 1440"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: "Minutes of cleaning/turnover appended to the END of every chair occupancy before the next occupancy may begin."
        default: 15
        constraints: "0 <= turnover_buffer_minutes <= 60"
      - name: urgent_reserve_chair_count
        type: integer
        source: input
        description: "Maximum number of chairs at this center that may carry reserved_for_urgent = true at any time."
        default: 1
        constraints: "0 <= urgent_reserve_chair_count <= 10"
      - name: addon_cutoff_minute
        type: integer
        source: input
        description: "Latest minute-of-day (UTC) at which a SAME_DAY_ADDON booking may be accepted (900 = 15:00Z)."
        default: 900
        constraints: "open_minute <= addon_cutoff_minute <= close_minute"
      - name: lab_validity_hours
        type: integer
        source: input
        description: "Maximum age, in hours, of a LabResult.collected_at instant for that result to satisfy a drug lab gate."
        default: 72
        constraints: "1 <= lab_validity_hours <= 168"
      - name: stagger_grid_minutes
        type: integer
        source: input
        description: "Granularity of legal appointment start minutes; every Appointment.start_minute is a multiple of this value offset from midnight."
        default: 15
        constraints: "stagger_grid_minutes IN {5, 10, 15, 20, 30}"
      - name: acuity_slot_minutes
        type: integer
        source: input
        description: "Width of the nurse-acuity accounting slot; nurse capacity is enforced per slot, not per appointment."
        default: 30
        constraints: "acuity_slot_minutes IN {15, 30, 60}"
      - name: available_chair_count
        type: integer
        source: computed
        description: "count of Chair where Chair.center_id == this.id AND Chair.status == AVAILABLE (reserved_for_urgent chairs ARE counted)."
      - name: reserved_chair_count
        type: integer
        source: computed
        description: "count of Chair where Chair.center_id == this.id AND Chair.status == AVAILABLE AND Chair.reserved_for_urgent == true."

  - name: Chair
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> InfusionCenter.id; the suite this chair physically sits in."
      - name: label
        type: string
        source: input
        description: "Operator-visible chair label; the deterministic tie-break key for chair selection (ASC, byte-wise)."
        constraints: "1-16 characters, unique per center_id"
      - name: chair_type
        type: enum
        source: input
        description: "Physical chair class."
        default: "STANDARD"
        constraints: "chair_type IN {STANDARD, BARIATRIC, ISOLATION}"
      - name: status
        type: enum
        source: input
        description: "Serviceability of the chair."
        default: "AVAILABLE"
        constraints: "status IN {AVAILABLE, OUT_OF_SERVICE}"
      - name: reserved_for_urgent
        type: boolean
        source: input
        description: "When true this chair is withheld from ROUTINE and SAME_DAY_ADDON booking and is offered first to URGENT bookings."
        default: false
      - name: committed_minutes
        type: integer
        source: computed
        description: "sum of Appointment.chair_minutes over every Appointment where Appointment.chair_id == this.id AND Appointment.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING}, across all service_date values. Conserved quantity for the chair-minute compensating invariant."

  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> InfusionCenter.id; the suite this nurse staffs."
      - name: full_name
        type: string
        source: input
        description: "Nurse display name."
        constraints: "1-120 characters, non-blank"
      - name: acuity_capacity_points
        type: integer
        source: input
        description: "Maximum sum of Appointment.acuity_points this nurse may carry in any single acuity slot."
        constraints: "1 <= acuity_capacity_points <= 20"
      - name: shift_start_minute
        type: integer
        source: input
        description: "First minute of day (UTC) the nurse is on shift."
        constraints: "0 <= shift_start_minute < shift_end_minute <= 1440"
      - name: shift_end_minute
        type: integer
        source: input
        description: "Exclusive end minute of day (UTC) of the nurse shift. An appointment window must satisfy start_minute >= shift_start_minute AND end_minute <= shift_end_minute."
        constraints: "shift_start_minute < shift_end_minute <= 1440"
      - name: status
        type: enum
        source: input
        description: "Roster status; only ACTIVE nurses are selectable."
        default: "ACTIVE"
        constraints: "status IN {ACTIVE, INACTIVE}"
      - name: assigned_acuity_points
        type: integer
        source: computed
        description: "sum of Appointment.acuity_points over every Appointment where Appointment.nurse_id == this.id AND Appointment.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING}, across all service_date values. Nurse-selection ranking key (ASC)."

  - name: Drug
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Drug or biologic product name."
        constraints: "1-120 characters, unique"
      - name: is_biosimilar
        type: boolean
        source: input
        description: "True when this product is a biosimilar of another Drug."
        default: false
      - name: reference_drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the originator product this biosimilar references. NULL on originator products. Must be NULL when is_biosimilar == false."
        default: null
      - name: base_administration_minutes
        type: integer
        source: input
        description: "Baseline infusion push time before dose-tier escalation."
        constraints: "5 <= base_administration_minutes <= 480"
      - name: min_administration_minutes
        type: integer
        source: input
        description: "Clinical floor on infusion push time; the administration leg is never shorter than this."
        constraints: "5 <= min_administration_minutes <= 480"
      - name: premedication_minutes
        type: integer
        source: input
        description: "Pre-medication window that occupies the chair BEFORE the administration leg begins."
        default: 0
        constraints: "0 <= premedication_minutes <= 120"
      - name: observation_minutes_first_dose
        type: integer
        source: input
        description: "Post-infusion observation window for a patient's first dose on a plan."
        constraints: "0 <= observation_minutes_first_dose <= 240"
      - name: observation_minutes_subsequent
        type: integer
        source: input
        description: "Post-infusion observation window once a dose on the plan has already completed."
        constraints: "0 <= observation_minutes_subsequent <= 240"
      - name: acuity_points
        type: integer
        source: input
        description: "Baseline nursing acuity cost of one administration of this drug."
        constraints: "1 <= acuity_points <= 10"
      - name: prep_stability_minutes
        type: integer
        source: input
        description: "Minutes a compounded dose of this drug remains usable after DrugPreparation.prepared_at."
        constraints: "15 <= prep_stability_minutes <= 1440"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Acquisition cost in cents of one dispensing unit (vial) of this drug."
        constraints: "unit_cost_cents >= 0"
      - name: requires_lab_gate
        type: boolean
        source: input
        description: "When true, POST /appointments/{id}/start-infusion enforces the LabResult gate."
        default: false
      - name: lab_min_anc
        type: number
        source: input
        description: "Minimum absolute neutrophil count (x10^9/L) permitting administration. Required when requires_lab_gate == true."
        default: null
        constraints: "lab_min_anc >= 0 when present"
      - name: lab_min_platelets
        type: integer
        source: input
        description: "Minimum platelet count (x10^9/L) permitting administration. Required when requires_lab_gate == true."
        default: null
        constraints: "lab_min_platelets >= 0 when present"

  - name: DrugLot
    parent: null
    common_fields: true
    fields:
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the product this physical lot contains."
      - name: lot_number
        type: string
        source: input
        description: "Manufacturer lot identifier."
        constraints: "1-32 characters, unique per drug_id"
      - name: units_received
        type: integer
        source: input
        description: "Total dispensing units booked into this lot. Mutated only by POST /drug-lots/{id}/adjustments."
        constraints: "units_received >= 0"
      - name: expires_on
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the lot expires. A lot is selectable only while expires_on > logical clock."
      - name: units_committed
        type: integer
        source: computed
        description: "sum of DrugPreparation.units_requested where DrugPreparation.drug_lot_id == this.id AND DrugPreparation.status IN {REQUESTED, PREPARED}."
      - name: units_administered
        type: integer
        source: computed
        description: "sum of DrugPreparation.units_requested where DrugPreparation.drug_lot_id == this.id AND DrugPreparation.status == ADMINISTERED."
      - name: units_wasted
        type: integer
        source: computed
        description: "sum of DrugPreparation.units_requested where DrugPreparation.drug_lot_id == this.id AND DrugPreparation.status == WASTED."
      - name: units_returned
        type: integer
        source: computed
        description: "Cumulative audit counter: sum of DrugPreparation.units_requested where DrugPreparation.drug_lot_id == this.id AND DrugPreparation.status == RETURNED. NOT part of the conservation balance (returned units are back in units_available)."
      - name: units_available
        type: integer
        source: computed
        description: "units_received - units_committed - units_administered - units_wasted. Conserved quantity for the drug-unit compensating invariant."
      - name: status
        type: enum
        source: computed
        description: "AVAILABLE while units_available > 0 and expires_on > clock; DEPLETED once units_available == 0; EXPIRED once POST /infusion-centers/{id}/daily-sweep observes expires_on <= clock."
        default: "AVAILABLE"
        constraints: "status IN {AVAILABLE, DEPLETED, EXPIRED}"

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number."
        constraints: "1-32 characters, globally unique"
      - name: full_name
        type: string
        source: input
        description: "Patient display name."
        constraints: "1-120 characters, non-blank"
      - name: weight_kg
        type: number
        source: input
        description: "Dosing weight in kilograms; multiplied by TreatmentPlan.dose_mg_per_kg to derive dose_mg."
        constraints: "1 <= weight_kg <= 400"
      - name: completed_appointment_count
        type: integer
        source: computed
        description: "count of Appointment where Appointment.patient_id == this.id AND Appointment.schedule_status == COMPLETED."
      - name: no_show_strikes
        type: integer
        source: computed
        description: "count of Appointment where Appointment.patient_id == this.id AND Appointment.schedule_status == NO_SHOW AND Appointment.service_date is within the 180 calendar days ending on the logical clock date (inclusive)."
        default: 0
      - name: no_show_risk_score
        type: number
        source: computed
        description: "Persisted ROLLING_6 variant output of the no_show_risk_score calculation, 2 decimal places."
        default: 0
      - name: reminder_tier
        type: enum
        source: computed
        description: "STANDARD when no_show_risk_score < 20; ELEVATED when 20 <= no_show_risk_score < 45; INTENSIVE when no_show_risk_score >= 45."
        default: "STANDARD"
        constraints: "reminder_tier IN {STANDARD, ELEVATED, INTENSIVE}"
      - name: waste_liability_cents
        type: integer
        source: computed
        description: "Running sum of Appointment.cancellation_charge_cents over every Appointment where Appointment.patient_id == this.id AND Appointment.schedule_status == CANCELLED."
        default: 0
      - name: steering_status
        type: enum
        source: computed
        description: "SUITE by default; flips to HOME_INFUSION_REVIEW once no_show_strikes >= 3 OR waste_liability_cents >= 50000. Never flips back automatically."
        default: "SUITE"
        constraints: "steering_status IN {SUITE, HOME_INFUSION_REVIEW}"

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this regimen belongs to."
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the product administered on this regimen."
      - name: supersedes_plan_id
        type: string
        source: computed
        description: "FK -> TreatmentPlan.id; the plan this revision replaced. NULL on an original plan."
        default: null
      - name: dose_mg_per_kg
        type: number
        source: input
        description: "Weight-based dose used to derive dose_mg and therefore the dose tier."
        constraints: "0 < dose_mg_per_kg <= 100"
      - name: total_cycles
        type: integer
        source: input
        description: "Number of administration cycles the regimen prescribes."
        constraints: "1 <= total_cycles <= 52"
      - name: premed_waived
        type: boolean
        source: input
        description: "When true the pre-medication leg is dropped from the chair window for every appointment on this plan."
        default: false
      - name: completed_cycles
        type: integer
        source: computed
        description: "count of Appointment where Appointment.treatment_plan_id == this.id AND Appointment.schedule_status == COMPLETED."
      - name: first_dose_completed
        type: boolean
        source: computed
        description: "true when completed_cycles >= 1; selects the subsequent-dose observation window instead of the first-dose window."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation; SUSPENDED by steering or adverse-event review; COMPLETED once completed_cycles >= total_cycles; SUPERSEDED once a revision replaces it."
        default: "ACTIVE"
        constraints: "status IN {ACTIVE, SUSPENDED, COMPLETED, SUPERSEDED}"

  - name: AppointmentTemplate
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> InfusionCenter.id; templates are center-scoped because stagger geometry depends on center configuration."
      - name: drug_id
        type: string
        source: input
        description: "FK -> Drug.id; the product this template times."
      - name: dose_tier
        type: enum
        source: input
        description: "Dose band this template is built for; must equal the tier derived from the appointment's own dose_mg."
        constraints: "dose_tier IN {LOW, MID, HIGH}; unique per (center_id, drug_id, dose_tier) among status == ACTIVE templates"
      - name: base_admin_minutes
        type: integer
        source: computed
        description: "Snapshot of Drug.base_administration_minutes taken at template creation."
      - name: min_admin_minutes
        type: integer
        source: computed
        description: "Snapshot of Drug.min_administration_minutes taken at template creation."
      - name: premed_minutes
        type: integer
        source: computed
        description: "Snapshot of Drug.premedication_minutes taken at template creation."
      - name: observation_minutes_first
        type: integer
        source: computed
        description: "Snapshot of Drug.observation_minutes_first_dose taken at template creation."
      - name: observation_minutes_subsequent
        type: integer
        source: computed
        description: "Snapshot of Drug.observation_minutes_subsequent taken at template creation."
      - name: acuity_points
        type: integer
        source: computed
        description: "Drug.acuity_points + 1 when dose_tier == HIGH, else Drug.acuity_points."
      - name: stagger_offset_minutes
        type: integer
        source: computed
        description: "InfusionCenter.stagger_grid_minutes * 2 when acuity_points >= 4, else InfusionCenter.stagger_grid_minutes. Overridable via PATCH /appointment-templates/{id}."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE on creation; RETIRED once PATCH /appointment-templates/{id} sets status = RETIRED. RETIRED templates cannot back new appointments."
        default: "ACTIVE"
        constraints: "status IN {ACTIVE, RETIRED}"

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> InfusionCenter.id; the suite the visit occupies."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient being infused."
      - name: treatment_plan_id
        type: string
        source: input
        description: "FK -> TreatmentPlan.id; the regimen cycle this visit administers."
      - name: template_id
        type: string
        source: input
        description: "FK -> AppointmentTemplate.id; the timing template pinned at scheduling."
      - name: chair_id
        type: string
        source: computed
        description: "FK -> Chair.id; chair chosen by the staggered_start_assignment selector. NULL while the appointment holds no chair (TENTATIVE after a bump, CANCELLED, NO_SHOW)."
        default: null
      - name: nurse_id
        type: string
        source: computed
        description: "FK -> Nurse.id; nurse chosen by the staggered_start_assignment selector. NULL while the appointment holds no nurse."
        default: null
      - name: rescheduled_from_appointment_id
        type: string
        source: computed
        description: "FK -> Appointment.id; the superseded appointment this row replaced. NULL unless created by POST /appointments/{id}/reschedule."
        default: null
      - name: service_date
        type: string
        source: input
        description: "Calendar service day in UTC, ISO 8601 date form YYYY-MM-DD. All minute-of-day fields are offsets from midnight UTC of this date."
        constraints: "matches ^\\d{4}-\\d{2}-\\d{2}$"
      - name: requested_start_minute
        type: integer
        source: input
        description: "Minute-of-day the requester asked for; the selector rounds it up onto the stagger grid and may push it later."
        constraints: "0 <= requested_start_minute < 1440"
      - name: cycle_number
        type: integer
        source: input
        description: "Which cycle of the treatment plan this visit administers."
        constraints: "1 <= cycle_number <= TreatmentPlan.total_cycles"
      - name: booking_class
        type: enum
        source: input
        description: "ROUTINE books future days with stagger search; SAME_DAY_ADDON books the clock's own date before the add-on cutoff; URGENT books the clock's own date at a fixed start minute and may take a reserved chair."
        default: "ROUTINE"
        constraints: "booking_class IN {ROUTINE, SAME_DAY_ADDON, URGENT}"
      - name: template_version_pinned
        type: integer
        source: computed
        description: "AppointmentTemplate.version observed at scheduling time. Confirmation is refused when the template has advanced past this value."
      - name: premed_minutes
        type: integer
        source: computed
        description: "0 when TreatmentPlan.premed_waived == true, else AppointmentTemplate.premed_minutes."
      - name: admin_minutes
        type: integer
        source: computed
        description: "max(template.min_admin_minutes, template.base_admin_minutes + dose-tier escalation) per the appointment_window_build calculation."
      - name: observation_minutes
        type: integer
        source: computed
        description: "Base observation leg (first-dose or subsequent per TreatmentPlan.first_dose_completed) plus observation_extension_minutes."
      - name: chair_minutes
        type: integer
        source: computed
        description: "premed_minutes + admin_minutes + observation_minutes; the full chair occupancy length."
      - name: start_minute
        type: integer
        source: computed
        description: "Minute-of-day the chair occupancy begins, always a multiple of InfusionCenter.stagger_grid_minutes."
      - name: end_minute
        type: integer
        source: computed
        description: "start_minute + chair_minutes; exclusive end of the chair occupancy (half-open interval)."
      - name: acuity_points
        type: integer
        source: computed
        description: "AppointmentTemplate.acuity_points + 1 when TreatmentPlan.first_dose_completed == false, else AppointmentTemplate.acuity_points."
      - name: observation_extension_minutes
        type: integer
        source: computed
        description: "max over the appointment's AdverseEvent rows of their observation_extension_minutes; 0 when none exist."
        default: 0
      - name: actual_start_minute
        type: integer
        source: computed
        description: "Minute-of-day (UTC) of the logical clock when start-infusion succeeded. NULL until then."
        default: null
      - name: actual_end_minute
        type: integer
        source: computed
        description: "Minute-of-day (UTC) of the logical clock when discharge succeeded. NULL until then."
        default: null
      - name: billable_chair_units
        type: integer
        source: computed
        description: "ceil((actual_end_minute - actual_start_minute) / 15) once the visit reaches COMPLETED; 0 before that."
        default: 0
      - name: late_cancellation
        type: boolean
        source: computed
        description: "true when the cancellation instant is at or after (service_date midnight UTC + start_minute) minus 24 hours; false when the appointment is still open or was cancelled earlier than that."
        default: false
      - name: cancellation_charge_cents
        type: integer
        source: computed
        description: "Output of the cancellation_charge calculation, written only on the transition into CANCELLED."
        default: 0
      - name: reminder_cadence_code
        type: enum
        source: computed
        description: "C_STANDARD / C_ELEVATED / C_INTENSIVE mirroring the patient's reminder_tier at read time; caps how many ReminderContact rows the appointment accepts."
        default: "C_STANDARD"
        constraints: "reminder_cadence_code IN {C_STANDARD, C_ELEVATED, C_INTENSIVE}"
      - name: schedule_status
        type: enum
        source: computed
        description: "Scheduling dimension of the parallel state machine."
        default: "TENTATIVE"
        constraints: "schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING, COMPLETED, CANCELLED, NO_SHOW}"
      - name: readiness_status
        type: enum
        source: computed
        description: "Clinical-clearance dimension of the parallel state machine, derived from authorization, lab and adverse-event facts."
        default: "PENDING"
        constraints: "readiness_status IN {PENDING, AUTH_CLEARED, LAB_CLEARED, FULLY_CLEARED, BLOCKED}"

  - name: AuthorizationRequest
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit this payer authorization covers."
      - name: treatment_plan_id
        type: string
        source: computed
        description: "FK -> TreatmentPlan.id; copied from the appointment at creation so plan-level authorization history is queryable."
      - name: payer_name
        type: string
        source: input
        description: "Payer the request was filed with."
        constraints: "1-120 characters, non-blank"
      - name: submission_count
        type: integer
        source: computed
        description: "Number of times this request has entered SUBMITTED. Incremented on every submit, including resubmissions out of PENDED."
        default: 0
      - name: approved_units
        type: integer
        source: input
        description: "Dispensing units the payer approved; written only on an APPROVED decision."
        default: null
        constraints: "approved_units >= 1 when present"
      - name: decision_reason
        type: string
        source: input
        description: "Free-text payer rationale recorded with a PENDED or DENIED decision."
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent decision."
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "decided_at + 30 days on an APPROVED decision; NULL otherwise. An APPROVED request stops clearing appointments once expires_at <= clock."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Cyclic authorization lifecycle; PENDED can return to SUBMITTED."
        default: "DRAFT"
        constraints: "status IN {DRAFT, SUBMITTED, PENDED, APPROVED, DENIED, EXPIRED}"

  - name: DrugPreparation
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit this compounded dose is for."
      - name: drug_lot_id
        type: string
        source: computed
        description: "FK -> DrugLot.id; lot chosen by the FEFO lot selector at request time."
      - name: units_requested
        type: integer
        source: input
        description: "Dispensing units committed out of the selected lot."
        constraints: "1 <= units_requested <= 100"
      - name: prepared_at
        type: datetime
        source: computed
        description: "Logical-clock instant the dose was compounded; NULL until PREPARED."
        default: null
      - name: usable_until
        type: datetime
        source: computed
        description: "prepared_at + Drug.prep_stability_minutes; NULL until PREPARED. A prepared dose observed past this instant by the daily sweep is wasted."
        default: null
      - name: waste_cost_cents
        type: integer
        source: computed
        description: "units_requested * Drug.unit_cost_cents, written only on the transition into WASTED."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Branching preparation lifecycle; PREPARED forks to ADMINISTERED, WASTED or RETURNED with divergent side-effect sets."
        default: "REQUESTED"
        constraints: "status IN {REQUESTED, PREPARED, ADMINISTERED, WASTED, RETURNED}"

  - name: AdverseEvent
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit during which the reaction occurred."
      - name: reported_by_nurse_id
        type: string
        source: computed
        description: "FK -> Nurse.id; taken from the acting X-User-ID, which must equal Appointment.nurse_id."
      - name: grade
        type: integer
        source: input
        description: "CTCAE-style reaction severity."
        constraints: "1 <= grade <= 4"
      - name: action
        type: enum
        source: input
        description: "Bedside action taken."
        constraints: "action IN {SLOW_RATE, HOLD, ABORT}"
      - name: note
        type: string
        source: input
        description: "Nurse narrative."
        default: null
      - name: observation_extension_minutes
        type: integer
        source: computed
        description: "Extra observation minutes this event demands, per the observation_extension calculation."
      - name: review_outcome
        type: enum
        source: input
        description: "Medical director disposition, written only on close."
        default: null
        constraints: "review_outcome IN {RESUME_SAME_DRUG, SWITCH_BIOSIMILAR, DISCONTINUE} when present"
      - name: status
        type: enum
        source: computed
        description: "Review lifecycle. A grade >= 3 event in REPORTED or UNDER_REVIEW forces the appointment's readiness_status to BLOCKED."
        default: "REPORTED"
        constraints: "status IN {REPORTED, UNDER_REVIEW, CLOSED}"

  - name: LabResult
    parent: null
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; whose specimen this is."
      - name: collected_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the specimen was drawn; freshness is measured from this instant, not from created_at."
      - name: anc_value
        type: number
        source: input
        description: "Absolute neutrophil count (x10^9/L). Omit to file a PENDING draw."
        default: null
        constraints: "0 <= anc_value <= 100 when present"
      - name: platelet_value
        type: integer
        source: input
        description: "Platelet count (x10^9/L). Omit to file a PENDING draw."
        default: null
        constraints: "0 <= platelet_value <= 2000 when present"
      - name: status
        type: enum
        source: computed
        description: "RESULTED when both anc_value and platelet_value are present at creation, else PENDING. Immutable thereafter."
        default: "PENDING"
        constraints: "status IN {PENDING, RESULTED}"

  - name: ReminderContact
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: "FK -> Appointment.id; the visit being reminded about."
      - name: patient_id
        type: string
        source: computed
        description: "FK -> Patient.id; copied from the appointment so reminder history is patient-queryable."
      - name: channel
        type: enum
        source: input
        description: "Outreach channel."
        constraints: "channel IN {SMS, VOICE, PORTAL}"
      - name: sequence_number
        type: integer
        source: computed
        description: "count of existing ReminderContact rows for this appointment_id, plus 1. Capped by the appointment's reminder_cadence_code."
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical-clock instant the outreach was recorded."
      - name: outcome
        type: enum
        source: computed
        description: "NO_RESPONSE on creation; set by POST /reminder-contacts/{id}/response. CANCEL_REQUEST cascades an appointment cancellation."
        default: "NO_RESPONSE"
        constraints: "outcome IN {NO_RESPONSE, CONFIRM_ATTENDANCE, CANCEL_REQUEST}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # -- Appointment, dimension 1 of 2: schedule_status ------------------------
  - entity: Appointment
    dimension: schedule_status
    initial_state: TENTATIVE
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: |
      Appointment carries two independent state dimensions on the same row.
      This block governs schedule_status only; readiness_status is governed by
      the separate Appointment/readiness_status block below and never blocks a
      schedule_status transition except where a precondition names it.
    transitions:
      - from: null
        to: TENTATIVE
        trigger: "POST /appointments"
        actor: Scheduler
        preconditions:
          - "InfusionCenter, Patient, TreatmentPlan and AppointmentTemplate all exist"
          - "TreatmentPlan.patient_id == body.patient_id"
          - "AppointmentTemplate.drug_id == TreatmentPlan.drug_id"
          - "AppointmentTemplate.center_id == body.center_id"
          - "AppointmentTemplate.status == ACTIVE"
          - "TreatmentPlan.status == ACTIVE"
          - "Patient.steering_status == SUITE"
          - "1 <= body.cycle_number <= TreatmentPlan.total_cycles"
          - "AppointmentTemplate.dose_tier == dose tier derived by appointment_window_build"
          - "InfusionCenter.open_minute <= body.requested_start_minute < InfusionCenter.close_minute"
          - "booking_class temporal rules of validations priority 90-94 hold"
          - "no Appointment of the same patient_id on the same service_date in {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING} overlaps the new window under unbuffered half-open arithmetic"
          - "staggered_start_assignment yields a (start_minute, chair, nurse) triple"
        side_effects:
          - "runs calculation appointment_window_build, writing premed_minutes, admin_minutes, observation_minutes, chair_minutes, acuity_points"
          - "runs calculation staggered_start_assignment, writing start_minute, end_minute, chair_id, nurse_id"
          - "pins template_version_pinned = AppointmentTemplate.version"
          - "recomputes Chair.committed_minutes on the selected chair (increases by chair_minutes)"
          - "recomputes Nurse.assigned_acuity_points on the selected nurse (increases by acuity_points)"
          - "recomputes readiness_status per the readiness derivation: PENDING when the plan's drug carries requires_lab_gate == true and no qualifying LabResult exists yet, LAB_CLEARED when lab_ok already holds (no gate, or a qualifying draw is on file)"
        note: "Appointments are born already holding a chair and a nurse; there is no unassigned REQUESTED state."

      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: Scheduler
        preconditions:
          - "schedule_status == TENTATIVE"
          - "chair_id IS NOT NULL AND nurse_id IS NOT NULL"
          - "AppointmentTemplate.version == template_version_pinned"
          - "TreatmentPlan.status == ACTIVE"
          - "an AuthorizationRequest exists with appointment_id == this.id AND status == APPROVED AND expires_at > logical clock"
        side_effects:
          - "schedule_status := CONFIRMED"
          - "recomputes readiness_status"
          - "increments Appointment.version by 1"

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: InfusionNurse
        preconditions:
          - "schedule_status == CONFIRMED"
          - "acting X-User-ID == Appointment.nurse_id"
          - "logical clock calendar date (UTC) == service_date"
        side_effects:
          - "schedule_status := CHECKED_IN"
          - "increments Appointment.version by 1"

      - from: CHECKED_IN
        to: INFUSING
        trigger: "POST /appointments/{id}/start-infusion"
        actor: InfusionNurse
        preconditions:
          - "schedule_status == CHECKED_IN"
          - "acting X-User-ID == Appointment.nurse_id"
          - "readiness_status != BLOCKED"
          - "when TreatmentPlan.drug.requires_lab_gate == true: the lab gate of calculation lab_gate_evaluation passes"
          - "a DrugPreparation exists with appointment_id == this.id AND status == PREPARED"
        side_effects:
          - "schedule_status := INFUSING"
          - "actual_start_minute := minute-of-day (UTC) of the logical clock"
          - "increments Appointment.version by 1"

      - from: INFUSING
        to: OBSERVING
        trigger: "POST /appointments/{id}/complete-infusion"
        actor: InfusionNurse
        preconditions:
          - "schedule_status == INFUSING"
          - "acting X-User-ID == Appointment.nurse_id"
        side_effects:
          - "schedule_status := OBSERVING"
          - "increments Appointment.version by 1"

      - from: OBSERVING
        to: COMPLETED
        trigger: "POST /appointments/{id}/discharge"
        actor: InfusionNurse
        preconditions:
          - "schedule_status == OBSERVING"
          - "acting X-User-ID == Appointment.nurse_id"
          - "no AdverseEvent exists with appointment_id == this.id AND grade >= 3 AND status IN {REPORTED, UNDER_REVIEW} (i.e. readiness_status != BLOCKED)"
        side_effects:
          - "schedule_status := COMPLETED"
          - "actual_end_minute := minute-of-day (UTC) of the logical clock"
          - "billable_chair_units := ceil((actual_end_minute - actual_start_minute) / 15) per calculation billable_chair_units"
          - "every DrugPreparation of this appointment with status == PREPARED transitions PREPARED -> ADMINISTERED"
          - "that DrugPreparation transition itself recomputes DrugLot.units_committed / units_administered / units_available; a lot whose units_available reaches 0 transitions AVAILABLE -> DEPLETED"
          - "Chair.committed_minutes on chair_id decreases by chair_minutes (COMPLETED is outside the committed set)"
          - "Nurse.assigned_acuity_points on nurse_id decreases by acuity_points"
          - "TreatmentPlan.completed_cycles and first_dose_completed recomputed; when completed_cycles >= total_cycles the plan transitions ACTIVE -> COMPLETED"
          - "Patient.completed_appointment_count and no_show_risk_score recomputed; reminder_tier re-derived"
          - "increments Appointment.version by 1"

      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Scheduler | Patient
        preconditions:
          - "schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN}"
          - "when acting role is Patient: X-User-ID == Appointment.patient_id"
        side_effects:
          - "schedule_status := CANCELLED; late_cancellation computed; cancellation_charge_cents written per calculation cancellation_charge"
          - "chair_id and nurse_id are NOT cleared (they remain as an audit trail) but Chair.committed_minutes and Nurse.assigned_acuity_points are recomputed and therefore release this appointment's contribution"
          - "every DrugPreparation of this appointment with status == REQUESTED transitions REQUESTED -> RETURNED"
          - "every DrugPreparation of this appointment with status == PREPARED transitions PREPARED -> WASTED"
          - "each of those DrugPreparation transitions itself recomputes its DrugLot counters (units_committed down; units_returned or units_wasted up; units_available restored on RETURNED)"
          - "Patient.waste_liability_cents recomputed from the new cancellation_charge_cents; when it reaches 50000 the patient's steering_status flips SUITE -> HOME_INFUSION_REVIEW, which itself transitions every ACTIVE TreatmentPlan of that patient to SUSPENDED, which itself cancels that plan's appointments still in {TENTATIVE, CONFIRMED}"
          - "increments Appointment.version by 1"
        note: "Same transition definition applies from CONFIRMED and CHECKED_IN; listed once."

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Scheduler | Patient
        preconditions:
          - "schedule_status == CONFIRMED"
        side_effects:
          - "identical to the TENTATIVE -> CANCELLED side-effect chain above"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Scheduler | Patient
        preconditions:
          - "schedule_status == CHECKED_IN"
        side_effects:
          - "identical to the TENTATIVE -> CANCELLED side-effect chain above"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reminder-contacts/{id}/response with outcome == CANCEL_REQUEST"
        actor: Patient
        preconditions:
          - "ReminderContact.outcome == NO_RESPONSE"
          - "acting X-User-ID == ReminderContact.patient_id"
          - "the referenced Appointment.schedule_status IN {TENTATIVE, CONFIRMED}"
        side_effects:
          - "ReminderContact.outcome := CANCEL_REQUEST"
          - "runs the full TENTATIVE|CONFIRMED -> CANCELLED side-effect chain on the referenced appointment"

      - from: CONFIRMED
        to: TENTATIVE
        trigger: "system: chair-window collision created by an observation extension, PATCH /chairs/{id} setting OUT_OF_SERVICE, or PATCH /nurses/{id} setting INACTIVE"
        actor: system
        preconditions:
          - "schedule_status IN {TENTATIVE, CONFIRMED}"
          - "the appointment's current (chair_id, start_minute, end_minute) triple no longer satisfies the buffered chair-occupancy rule, or its chair left AVAILABLE, or its nurse left ACTIVE"
        side_effects:
          - "schedule_status := TENTATIVE (a CONFIRMED appointment is demoted; an already TENTATIVE one stays TENTATIVE)"
          - "chair_id := NULL and nurse_id := NULL"
          - "Chair.committed_minutes on the released chair and Nurse.assigned_acuity_points on the released nurse are recomputed"
          - "increments Appointment.version by 1"
        note: "This is the bump path; it is the only transition that moves schedule_status backwards."

      - from: TENTATIVE
        to: CANCELLED
        trigger: "system: TreatmentPlan ACTIVE -> SUSPENDED cascade, or TreatmentPlan ACTIVE -> SUPERSEDED via POST /treatment-plans/{id}/revisions"
        actor: system
        preconditions:
          - "schedule_status IN {TENTATIVE, CONFIRMED}"
          - "the appointment's TreatmentPlan left ACTIVE"
        side_effects:
          - "schedule_status := CANCELLED with cancellation_charge_cents := 0 and late_cancellation := false (system cancellations never bill)"
          - "DrugPreparation rows in REQUESTED -> RETURNED and in PREPARED -> WASTED, with the same DrugLot counter recomputation chain"
          - "Chair.committed_minutes and Nurse.assigned_acuity_points recomputed"
          - "increments Appointment.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /infusion-centers/{id}/daily-sweep (step 4)"
        actor: system
        preconditions:
          - "schedule_status IN {TENTATIVE, CONFIRMED}"
          - "service_date == body.service_date"
          - "logical clock >= service_date midnight UTC + start_minute + 30 minutes"
        side_effects:
          - "schedule_status := NO_SHOW"
          - "Chair.committed_minutes and Nurse.assigned_acuity_points recomputed (NO_SHOW is outside the committed set)"
          - "Patient.no_show_strikes recomputed; that recomputation itself re-runs calculation no_show_risk_score (ROLLING_6) and re-derives Patient.reminder_tier"
          - "when the recomputed no_show_strikes >= 3, Patient.steering_status flips SUITE -> HOME_INFUSION_REVIEW; that flip itself transitions every ACTIVE TreatmentPlan of the patient to SUSPENDED; each of those plan transitions itself cancels that plan's appointments still in {TENTATIVE, CONFIRMED} (system cancellation, zero charge), which itself releases those appointments' Chair.committed_minutes"
          - "increments Appointment.version by 1"

      - from: TENTATIVE
        to: NO_SHOW
        trigger: "POST /infusion-centers/{id}/daily-sweep (step 4)"
        actor: system
        preconditions:
          - "schedule_status == TENTATIVE"
          - "same date and grace conditions as the CONFIRMED -> NO_SHOW transition"
        side_effects:
          - "identical to the CONFIRMED -> NO_SHOW side-effect chain"

      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /appointments/{id}/reschedule"
        actor: Scheduler
        preconditions:
          - "schedule_status IN {TENTATIVE, CONFIRMED}"
          - "body.expected_appointment_version == Appointment.version"
        side_effects:
          - "the original appointment: schedule_status := CANCELLED, cancellation_charge_cents := 0, late_cancellation := false"
          - "DrugPreparation rows in REQUESTED -> RETURNED and in PREPARED -> WASTED with the DrugLot counter chain"
          - "Chair.committed_minutes and Nurse.assigned_acuity_points recomputed"
          - "increments Appointment.version by 1"
          - "a NEW Appointment row is created in TENTATIVE with rescheduled_from_appointment_id := original.id, copying patient_id, treatment_plan_id, template_id, center_id, cycle_number and booking_class, and running appointment_window_build plus staggered_start_assignment against body.service_date and body.requested_start_minute"

  # -- Appointment, dimension 2 of 2: readiness_status -----------------------
  - entity: Appointment
    dimension: readiness_status
    initial_state: PENDING
    terminal_states: []
    note: |
      readiness_status is a pure derivation, recomputed after every event that
      touches authorization, labs or adverse events for the appointment:
        BLOCKED        when an AdverseEvent with grade >= 3 and status IN {REPORTED, UNDER_REVIEW} exists
        FULLY_CLEARED  else when auth_ok AND lab_ok
        AUTH_CLEARED   else when auth_ok AND NOT lab_ok
        LAB_CLEARED    else when lab_ok AND NOT auth_ok
        PENDING        otherwise
      auth_ok := an AuthorizationRequest exists with appointment_id == this.id
                 AND status == APPROVED. The expires_at instant is NOT part of
                 this predicate: an APPROVED row keeps clearing the gate until
                 the daily sweep observes its expiry and moves it to EXPIRED.
                 (POST /appointments/{id}/check-in separately compares
                 expires_at against the clock and raises ERR_AUTH_EXPIRED, so a
                 lapsed authorization still cannot seat a patient before the
                 sweep runs.)
      lab_ok  := TreatmentPlan.drug.requires_lab_gate == false, OR the
                 lab_gate_evaluation calculation returns PASS.
      Because both dimensions live on one row, schedule_status may advance
      TENTATIVE -> ... -> OBSERVING while readiness_status moves independently.
    transitions:
      - from: PENDING
        to: AUTH_CLEARED
        trigger: "POST /authorization-requests/{id}/decision with decision == APPROVED"
        actor: AuthorizationSpecialist
        preconditions:
          - "the appointment's drug requires_lab_gate == true and no qualifying LabResult exists yet"
        side_effects:
          - "readiness_status := AUTH_CLEARED"
          - "increments Appointment.version by 1"

      - from: PENDING
        to: FULLY_CLEARED
        trigger: "POST /authorization-requests/{id}/decision with decision == APPROVED"
        actor: AuthorizationSpecialist
        preconditions:
          - "lab_ok already holds (drug has no lab gate, or a qualifying LabResult already exists)"
        side_effects:
          - "readiness_status := FULLY_CLEARED"
          - "increments Appointment.version by 1"

      - from: PENDING
        to: LAB_CLEARED
        trigger: "POST /lab-results"
        actor: InfusionNurse
        preconditions:
          - "the new LabResult satisfies lab_gate_evaluation for this appointment"
          - "auth_ok does not hold"
        side_effects:
          - "readiness_status := LAB_CLEARED"
          - "increments Appointment.version by 1"

      - from: AUTH_CLEARED
        to: FULLY_CLEARED
        trigger: "POST /lab-results"
        actor: InfusionNurse
        preconditions:
          - "the new LabResult satisfies lab_gate_evaluation for this appointment"
          - "auth_ok holds"
        side_effects:
          - "readiness_status := FULLY_CLEARED"
          - "increments Appointment.version by 1"

      - from: LAB_CLEARED
        to: FULLY_CLEARED
        trigger: "POST /authorization-requests/{id}/decision with decision == APPROVED"
        actor: AuthorizationSpecialist
        preconditions:
          - "lab_ok holds"
        side_effects:
          - "readiness_status := FULLY_CLEARED"
          - "increments Appointment.version by 1"

      - from: FULLY_CLEARED
        to: BLOCKED
        trigger: "POST /appointments/{id}/adverse-events with grade >= 3"
        actor: InfusionNurse
        preconditions:
          - "the new AdverseEvent has grade >= 3 and status == REPORTED"
        side_effects:
          - "readiness_status := BLOCKED"
          - "Appointment.observation_extension_minutes, observation_minutes, chair_minutes and end_minute are recomputed per calculation observation_extension"
          - "the lengthened chair occupancy itself re-evaluates the buffered chair-occupancy rule against later appointments on the same chair_id and service_date; each colliding appointment transitions CONFIRMED|TENTATIVE -> TENTATIVE with chair_id and nurse_id cleared, which itself recomputes those chairs' committed_minutes and those nurses' assigned_acuity_points"
          - "increments Appointment.version by 1"

      - from: BLOCKED
        to: FULLY_CLEARED
        trigger: "POST /adverse-events/{id}/close with review_outcome == RESUME_SAME_DRUG"
        actor: MedicalDirector
        preconditions:
          - "no other AdverseEvent on the appointment has grade >= 3 AND status IN {REPORTED, UNDER_REVIEW}"
          - "auth_ok AND lab_ok still hold"
        side_effects:
          - "readiness_status := FULLY_CLEARED"
          - "increments Appointment.version by 1"
        note: "BLOCKED -> FULLY_CLEARED -> BLOCKED is a legal cycle: a second grade >= 3 event re-blocks the same row."

      - from: FULLY_CLEARED
        to: AUTH_CLEARED
        trigger: "POST /_clock/set_current_utc advancing the clock until every RESULTED LabResult of the patient is older than InfusionCenter.lab_validity_hours (the authorization is untouched on this path)"
        actor: system
        preconditions:
          - "auth_ok still holds"
          - "every RESULTED LabResult of the patient now has age > InfusionCenter.lab_validity_hours"
        side_effects:
          - "readiness_status := AUTH_CLEARED on next read (readiness_status is derived, so no version bump is emitted by a clock move alone)"

      - from: FULLY_CLEARED
        to: LAB_CLEARED
        trigger: "POST /infusion-centers/{id}/daily-sweep (step 2)"
        actor: system
        preconditions:
          - "the covering AuthorizationRequest transitioned APPROVED -> EXPIRED in step 2"
          - "lab_ok still holds"
        side_effects:
          - "readiness_status := LAB_CLEARED"
          - "increments Appointment.version by 1"

  # -- AuthorizationRequest: cyclic ----------------------------------------
  - entity: AuthorizationRequest
    initial_state: DRAFT
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /appointments/{id}/authorization-requests"
        actor: AuthorizationSpecialist
        preconditions:
          - "the Appointment exists and schedule_status NOT IN {COMPLETED, CANCELLED, NO_SHOW}"
        side_effects:
          - "treatment_plan_id copied from the appointment"
          - "submission_count := 0"

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /authorization-requests/{id}/submit"
        actor: AuthorizationSpecialist
        preconditions:
          - "status IN {DRAFT, PENDED}"
          - "submission_count < 3"
        side_effects:
          - "status := SUBMITTED"
          - "submission_count := submission_count + 1"

      - from: PENDED
        to: SUBMITTED
        trigger: "POST /authorization-requests/{id}/submit"
        actor: AuthorizationSpecialist
        preconditions:
          - "status == PENDED"
          - "submission_count < 3"
        side_effects:
          - "status := SUBMITTED"
          - "submission_count := submission_count + 1"
        note: "This edge closes the cycle PENDED -> SUBMITTED -> PENDED; submission_count is the loop counter and 3 is the hard cap."

      - from: SUBMITTED
        to: PENDED
        trigger: "POST /authorization-requests/{id}/decision with decision == PENDED"
        actor: AuthorizationSpecialist
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status := PENDED; decision_reason stored; decided_at := logical clock; expires_at := NULL"
          - "the covered Appointment's readiness_status recomputed"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /authorization-requests/{id}/decision with decision == APPROVED"
        actor: AuthorizationSpecialist
        preconditions:
          - "status == SUBMITTED"
          - "body.approved_units is present and >= 1"
        side_effects:
          - "status := APPROVED; approved_units stored; decided_at := logical clock; expires_at := decided_at + 30 days"
          - "the covered Appointment's readiness_status recomputed (PENDING -> AUTH_CLEARED or LAB_CLEARED -> FULLY_CLEARED)"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /authorization-requests/{id}/decision with decision == DENIED"
        actor: AuthorizationSpecialist
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status := DENIED; decision_reason stored; decided_at := logical clock"
          - "the covered Appointment's readiness_status recomputed"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /infusion-centers/{id}/daily-sweep (step 2)"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "expires_at <= logical clock"
        side_effects:
          - "status := EXPIRED"
          - "the covered Appointment's readiness_status recomputed (FULLY_CLEARED -> LAB_CLEARED, or AUTH_CLEARED -> PENDING)"

  # -- DrugPreparation: branching fork --------------------------------------
  - entity: DrugPreparation
    initial_state: REQUESTED
    terminal_states: [ADMINISTERED, WASTED, RETURNED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /appointments/{id}/drug-preparations"
        actor: Pharmacist
        preconditions:
          - "Appointment.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN}"
          - "the FEFO lot selector of calculation lot_selection returns a lot"
        side_effects:
          - "drug_lot_id := the selected lot"
          - "DrugLot.units_committed increases by units_requested and units_available decreases by the same amount; a lot whose units_available reaches 0 transitions AVAILABLE -> DEPLETED"

      - from: REQUESTED
        to: PREPARED
        trigger: "POST /drug-preparations/{id}/prepare"
        actor: Pharmacist
        preconditions:
          - "status == REQUESTED"
          - "DrugLot.status == AVAILABLE"
          - "logical clock >= (service_date midnight UTC + Appointment.start_minute) - 60 minutes"
          - "logical clock + Drug.prep_stability_minutes >= service_date midnight UTC + Appointment.start_minute + Appointment.premed_minutes"
        side_effects:
          - "status := PREPARED; prepared_at := logical clock; usable_until := prepared_at + Drug.prep_stability_minutes"
          - "DrugLot counters unchanged (units stay committed)"

      - from: PREPARED
        to: ADMINISTERED
        trigger: "POST /appointments/{id}/discharge"
        actor: system
        preconditions:
          - "status == PREPARED"
          - "the appointment reached COMPLETED"
        side_effects:
          - "status := ADMINISTERED"
          - "DrugLot.units_committed decreases by units_requested and units_administered increases by the same amount; units_available unchanged"

      - from: PREPARED
        to: WASTED
        trigger: "POST /appointments/{id}/cancel, POST /appointments/{id}/reschedule, a system plan cascade, or POST /infusion-centers/{id}/daily-sweep (step 3) when usable_until <= logical clock"
        actor: system
        preconditions:
          - "status == PREPARED"
        side_effects:
          - "status := WASTED; waste_cost_cents := units_requested * Drug.unit_cost_cents"
          - "DrugLot.units_committed decreases by units_requested and units_wasted increases by the same amount; units_available unchanged (the units are gone)"
          - "when the trigger was a patient- or scheduler-initiated cancel, the parent Appointment's cancellation_charge calculation consumes this waste_cost_cents"

      - from: REQUESTED
        to: RETURNED
        trigger: "POST /drug-preparations/{id}/return, POST /appointments/{id}/cancel, POST /appointments/{id}/reschedule, or a system plan cascade"
        actor: system
        preconditions:
          - "status == REQUESTED (never compounded, so nothing is physically lost)"
        side_effects:
          - "status := RETURNED"
          - "DrugLot.units_committed decreases by units_requested, units_returned increases by the same amount, and units_available increases by the same amount; a DEPLETED lot whose units_available returns above 0 transitions DEPLETED -> AVAILABLE"

      - from: PREPARED
        to: RETURNED
        trigger: "POST /drug-preparations/{id}/return"
        actor: Pharmacist
        preconditions:
          - "status == PREPARED"
          - "logical clock < usable_until"
        side_effects:
          - "status := RETURNED"
          - "DrugLot.units_committed decreases by units_requested, units_returned increases by the same amount, and units_available increases by the same amount"
        note: "This is the compensating action for the drug-unit conservation invariant: request + return leaves units_available exactly as it was."

  # -- AdverseEvent: linear with divergent close outcomes -------------------
  - entity: AdverseEvent
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: REPORTED
        trigger: "POST /appointments/{id}/adverse-events"
        actor: InfusionNurse
        preconditions:
          - "Appointment.schedule_status IN {INFUSING, OBSERVING}"
          - "acting X-User-ID == Appointment.nurse_id"
        side_effects:
          - "observation_extension_minutes computed per calculation observation_extension"
          - "the appointment's observation_minutes / chair_minutes / end_minute lengthen, and the resulting chair collisions bump later appointments (see Appointment readiness FULLY_CLEARED -> BLOCKED)"
          - "when grade >= 3 the appointment's readiness_status := BLOCKED"

      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /adverse-events/{id}/start-review"
        actor: MedicalDirector
        preconditions:
          - "status == REPORTED"
        side_effects:
          - "status := UNDER_REVIEW (readiness_status stays BLOCKED for grade >= 3)"

      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /adverse-events/{id}/close"
        actor: MedicalDirector
        preconditions:
          - "status == UNDER_REVIEW"
          - "body.review_outcome present"
        side_effects:
          - "status := CLOSED; review_outcome stored"
          - "when review_outcome == RESUME_SAME_DRUG: the appointment's readiness_status recomputed (BLOCKED -> FULLY_CLEARED when nothing else blocks)"
          - "when review_outcome IN {SWITCH_BIOSIMILAR, DISCONTINUE}: the appointment's TreatmentPlan transitions ACTIVE -> SUSPENDED, which itself cancels that plan's appointments still in {TENTATIVE, CONFIRMED} with zero charge, which itself releases their Chair.committed_minutes"

  # -- TreatmentPlan: compound + cycle -------------------------------------
  - entity: TreatmentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /treatment-plans"
        actor: MedicalDirector
        preconditions:
          - "Patient and Drug exist"
        side_effects:
          - "completed_cycles := 0; first_dose_completed := false"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Patient.steering_status flips to HOME_INFUSION_REVIEW, or POST /adverse-events/{id}/close with review_outcome IN {SWITCH_BIOSIMILAR, DISCONTINUE}"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := SUSPENDED"
          - "every Appointment on this plan with schedule_status IN {TENTATIVE, CONFIRMED} transitions to CANCELLED with cancellation_charge_cents := 0"
          - "each of those cancellations itself recomputes Chair.committed_minutes and Nurse.assigned_acuity_points and returns/wastes that appointment's DrugPreparation rows"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /treatment-plans/{id}/resume"
        actor: MedicalDirector
        preconditions:
          - "status == SUSPENDED"
          - "Patient.steering_status == SUITE"
        side_effects:
          - "status := ACTIVE"
        note: "ACTIVE -> SUSPENDED -> ACTIVE is a legal cycle; already-cancelled appointments are not resurrected."

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /appointments/{id}/discharge (bubble-up)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "recomputed completed_cycles >= total_cycles"
        side_effects:
          - "status := COMPLETED"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /treatment-plans/{id}/revisions"
        actor: MedicalDirector
        preconditions:
          - "status IN {ACTIVE, SUSPENDED}"
          - "body.expected_treatment_plan_version == TreatmentPlan.version"
        side_effects:
          - "status := SUPERSEDED"
          - "increments TreatmentPlan.version by 1"
          - "a new TreatmentPlan is created in ACTIVE with supersedes_plan_id := this.id, copying patient_id and drug_id"
          - "every Appointment on the superseded plan with schedule_status IN {TENTATIVE, CONFIRMED} transitions to CANCELLED with cancellation_charge_cents := 0, releasing chairs, nurses and drug commitments"

      - from: SUSPENDED
        to: SUPERSEDED
        trigger: "POST /treatment-plans/{id}/revisions"
        actor: MedicalDirector
        preconditions:
          - "status == SUSPENDED"
          - "body.expected_treatment_plan_version == TreatmentPlan.version"
        side_effects:
          - "identical to the ACTIVE -> SUPERSEDED side-effect chain"

  # -- DrugLot: capacity-derived ------------------------------------------
  - entity: DrugLot
    initial_state: AVAILABLE
    terminal_states: [EXPIRED]
    transitions:
      - from: null
        to: AVAILABLE
        trigger: "POST /drug-lots"
        actor: Pharmacist
        preconditions:
          - "the Drug exists"
        side_effects:
          - "units_available := units_received; all other counters := 0"

      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: any recomputation that drives units_available to 0 (preparation request, or POST /drug-lots/{id}/adjustments with a negative units_delta)"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "recomputed units_available == 0"
        side_effects:
          - "status := DEPLETED (the lot leaves the FEFO candidate pool)"

      - from: DEPLETED
        to: AVAILABLE
        trigger: "system: DrugPreparation REQUESTED -> RETURNED or PREPARED -> RETURNED restoring units, or POST /drug-lots/{id}/adjustments with a positive units_delta"
        actor: system
        preconditions:
          - "status == DEPLETED"
          - "recomputed units_available > 0"
          - "expires_on > logical clock"
        side_effects:
          - "status := AVAILABLE"

      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /infusion-centers/{id}/daily-sweep (step 1)"
        actor: system
        preconditions:
          - "status IN {AVAILABLE, DEPLETED}"
          - "expires_on <= logical clock"
        side_effects:
          - "status := EXPIRED (permanently out of the FEFO candidate pool; already-committed preparations are untouched by this step)"

      - from: DEPLETED
        to: EXPIRED
        trigger: "POST /infusion-centers/{id}/daily-sweep (step 1)"
        actor: system
        preconditions:
          - "status == DEPLETED"
          - "expires_on <= logical clock"
        side_effects:
          - "status := EXPIRED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reschedule-stale-appointment-version
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/reschedule"
    occ_field: "expected_appointment_version"
    description: |
      Rescheduling an Appointment whose version has advanced past the value the
      client last observed is rejected. Rescheduling legitimately supersedes the
      prior visit (the original is cancelled at zero charge and a replacement
      row is minted carrying rescheduled_from_appointment_id), so a second
      supersede against a stale view of the same appointment is a well-formed
      product operation rather than an invalid state - the only way to reject it
      deterministically is the stale-version check on Appointment.version.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

  - rule_id: lot-adjustment-stale-lot-version
    parent_entity: DrugLot
    write_endpoint: "POST /drug-lots/{id}/adjustments"
    occ_field: "expected_drug_lot_version"
    description: |
      Booking an inventory adjustment against a DrugLot whose version has
      advanced past the value the client last observed is rejected. Successive
      adjustments are individually legal and each supersedes the pharmacist's
      prior count of the lot, so the second adjustment cannot be refused by any
      state precondition; the stale-version check on DrugLot.version is what
      makes a superseded count observable.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

  - rule_id: plan-revision-stale-plan-version
    parent_entity: TreatmentPlan
    write_endpoint: "POST /treatment-plans/{id}/revisions"
    occ_field: "expected_treatment_plan_version"
    description: |
      Filing a revision against a TreatmentPlan whose version has advanced past
      the value the client last observed is rejected. A revision legitimately
      supersedes the plan it is filed against, so a revision derived from a
      stale dose view would silently discard an intervening dose change; the
      stale-version check on TreatmentPlan.version surfaces it as 412.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: template_build
    trigger: "POST /appointment-templates (creation) — snapshots the Drug's timing profile onto the template"
    algorithm: aggregation
    formula: |
      base_admin_minutes             = Drug.base_administration_minutes
      min_admin_minutes              = Drug.min_administration_minutes
      premed_minutes                 = Drug.premedication_minutes
      observation_minutes_first      = Drug.observation_minutes_first_dose
      observation_minutes_subsequent = Drug.observation_minutes_subsequent
      acuity_points                  = Drug.acuity_points + (1 if dose_tier == "HIGH" else 0)
      stagger_offset_minutes         = InfusionCenter.stagger_grid_minutes *
                                       (2 if acuity_points >= 4 else 1)
      status                         = "ACTIVE"
    input_set: "Exactly one Drug row (body.drug_id) and one InfusionCenter row (body.center_id). No appointment or patient data participates."
    constants:
      HIGH_TIER_ACUITY_SURCHARGE: 1
      HIGH_ACUITY_STAGGER_THRESHOLD: 4
    precision: "integer minutes; no rounding needed"

  - name: appointment_window_build
    trigger: "POST /appointments and the new-row half of POST /appointments/{id}/reschedule — writes premed_minutes, admin_minutes, observation_minutes, chair_minutes, acuity_points"
    algorithm: threshold
    formula: |
      # STEP 1 — weight-based dose, rounded to 1 decimal, round_half_up
      dose_mg = round_half_up(TreatmentPlan.dose_mg_per_kg * Patient.weight_kg, 1)

      # STEP 2 — tiered selection on dose_mg (boundaries INCLUSIVE on the upper edge)
      dose_tier = "LOW"  if dose_mg <= 500
                  "MID"  if 500  < dose_mg <= 1000
                  "HIGH" if dose_mg > 1000
      tier_add  = { "LOW": 0, "MID": 30, "HIGH": 60 }[dose_tier]

      # STEP 3 — the template's dose_tier MUST equal the derived dose_tier,
      #          otherwise ERR_TEMPLATE_TIER_MISMATCH (validation priority 63)

      # STEP 4 — non-linear administration leg: a floor applied OVER a tiered value
      admin_minutes = max(AppointmentTemplate.min_admin_minutes,
                          AppointmentTemplate.base_admin_minutes + tier_add)

      # STEP 5 — conditional legs
      premed_minutes = 0 if TreatmentPlan.premed_waived == true
                         else AppointmentTemplate.premed_minutes
      base_observation = AppointmentTemplate.observation_minutes_first
                            if TreatmentPlan.first_dose_completed == false
                         else AppointmentTemplate.observation_minutes_subsequent
      observation_minutes = base_observation + observation_extension_minutes   # 0 at creation

      # STEP 6 — occupancy and acuity
      chair_minutes = premed_minutes + admin_minutes + observation_minutes
      acuity_points = AppointmentTemplate.acuity_points +
                      (1 if TreatmentPlan.first_dose_completed == false else 0)
    input_set: "One TreatmentPlan (status must be ACTIVE), its Patient, and the pinned AppointmentTemplate (status must be ACTIVE). TreatmentPlan.first_dose_completed is read as of request time and is itself count of the plan's COMPLETED appointments >= 1."
    constants:
      LOW_TIER_MAX_DOSE_MG: 500
      MID_TIER_MAX_DOSE_MG: 1000
      TIER_ADD_LOW: 0
      TIER_ADD_MID: 30
      TIER_ADD_HIGH: 60
      FIRST_DOSE_ACUITY_SURCHARGE: 1
    precision: "dose_mg to 1 decimal place, round_half_up; all minute fields are integers"

  - name: staggered_start_assignment
    trigger: "POST /appointments and the new-row half of POST /appointments/{id}/reschedule — writes start_minute, end_minute, chair_id, nurse_id"
    algorithm: constraint_propagation
    formula: |
      grid   = InfusionCenter.stagger_grid_minutes
      buffer = InfusionCenter.turnover_buffer_minutes
      s0     = ceil(requested_start_minute / grid) * grid

      # (a) CANDIDATE START LIST — ordered, deterministic
      if booking_class == "URGENT":
          candidate_starts = [s0]                       # urgency forbids pushing later
      else:
          candidate_starts = [s0 + k*grid for k in 0..8]  # 9 candidates, ASC
      candidate_starts = [s for s in candidate_starts
                          if s >= InfusionCenter.open_minute
                          and s + chair_minutes <= InfusionCenter.close_minute]

      # (b) CHAIR ELIGIBILITY FILTER at a given start s
      chair_ok(chair, s) :=
            chair.center_id == Appointment.center_id
        AND chair.status == "AVAILABLE"
        AND (chair.reserved_for_urgent == false
             OR booking_class == "URGENT")
        AND for EVERY other Appointment o with o.chair_id == chair.id
            AND o.service_date == Appointment.service_date
            AND o.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING}:
                NOT ( s < o.end_minute + buffer
                      AND o.start_minute < (s + chair_minutes) + buffer )
            # buffered half-open arithmetic: the buffer is appended to the END of
            # BOTH intervals, so a start exactly at o.end_minute + buffer is legal.

      # (c) NURSE ELIGIBILITY FILTER at a given start s
      nurse_shift_ok(nurse, s) :=
            nurse.center_id == Appointment.center_id
        AND nurse.status == "ACTIVE"
        AND nurse.shift_start_minute <= s
        AND s + chair_minutes <= nurse.shift_end_minute
      nurse_acuity_ok(nurse, s) :=
            for EVERY acuity slot index k of the service day
            (slot k = [open_minute + k*acuity_slot_minutes,
                       open_minute + (k+1)*acuity_slot_minutes) ):
              if [s, s+chair_minutes) intersects slot k:
                 nurse_acuity_load(nurse, service_date, k) + Appointment.acuity_points
                     <= nurse.acuity_capacity_points
            # aggregate capacity per slot; boundary is INCLUSIVE (== capacity passes)

      # (d) SEARCH AND RANKING — first satisfied candidate start wins
      for s in candidate_starts (ASC):
          C = [c for c in chairs if chair_ok(c, s)]
          if C is empty: continue
          N = [n for n in nurses if nurse_shift_ok(n, s)]
          if N is empty: continue
          N = [n for n in N if nurse_acuity_ok(n, s)]
          if N is empty: continue
          chosen_chair = C ordered by
              (1) reserved_for_urgent DESC when booking_class == "URGENT",
                  else reserved_for_urgent is already filtered out,
              (2) committed_minutes ASC,
              (3) label ASC (byte-wise)
              -> first row
          chosen_nurse = N ordered by
              (1) assigned_acuity_points ASC,
              (2) created_at ASC
              -> first row
          return (s, chosen_chair, chosen_nurse)

      # (e) EMPTY-POOL FALLBACK — evaluated in this exact order
      if no candidate start had a non-empty C:
          if booking_class == "URGENT": raise ERR_URGENT_RESERVE_UNAVAILABLE
          else:                        raise ERR_NO_CHAIR_CAPACITY
      else if no candidate start had a non-empty shift-filtered N:
          raise ERR_NO_NURSE_ON_SHIFT
      else:
          raise ERR_NURSE_ACUITY_EXCEEDED
    input_set: "Chairs and Nurses of Appointment.center_id only. Occupancy is read from appointments on the SAME service_date whose schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING}; COMPLETED, CANCELLED and NO_SHOW rows are excluded and free their slot."
    constants:
      STAGGER_CANDIDATE_COUNT: 9
    precision: "integer minutes; ceil() used only to snap onto the stagger grid"

  - name: nurse_acuity_load
    trigger: "Read inside staggered_start_assignment step (c) and inside the chair-bump re-evaluation; also surfaced through Nurse.assigned_acuity_points"
    algorithm: aggregation
    formula: |
      nurse_acuity_load(nurse, service_date, slot_index k) =
        sum of a.acuity_points over every Appointment a where
              a.nurse_id        == nurse.id
          AND a.service_date    == service_date
          AND a.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN, INFUSING, OBSERVING}
          AND [a.start_minute, a.end_minute) intersects
              [open_minute + k*acuity_slot_minutes,
               open_minute + (k+1)*acuity_slot_minutes)
      # Intersection test is strict: two half-open intervals intersect iff
      #   a.start_minute < slot_end AND slot_start < a.end_minute.
      # An appointment that ends exactly at slot_start does NOT load slot k.
    input_set: "Appointments of one nurse on one service_date in the five committed schedule_status values. Order-insensitive (pure sum), so no tie-break is needed."
    constants: {}
    precision: "integer points"

  - name: chair_utilization_pct
    trigger: "GET /infusion-centers/{id}/utilization?service_date=...&variant=..."
    algorithm: aggregation
    formula: |
      available_chair_minutes =
          count(Chair where center_id == {id} AND status == "AVAILABLE")
          * (InfusionCenter.close_minute - InfusionCenter.open_minute)

      # --- variant SCHEDULED (forward-looking plan view) ---
      occupied_chair_minutes_SCHEDULED =
          sum of a.chair_minutes over every Appointment a where
              a.center_id == {id} AND a.service_date == service_date
              AND a.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN,
                                        INFUSING, OBSERVING, COMPLETED}
          # planned length is used even for COMPLETED rows; CANCELLED and
          # NO_SHOW rows contribute 0.

      # --- variant ACTUAL (chronological realised view) ---
      occupied_chair_minutes_ACTUAL =
          sum over every Appointment a where a.center_id == {id}
                                        AND a.service_date == service_date of:
             (a.actual_end_minute - a.actual_start_minute)
                 if a.schedule_status == COMPLETED
             (clock_minute_of_day - a.actual_start_minute)
                 if a.schedule_status IN {INFUSING, OBSERVING}
             0   if a.schedule_status IN {TENTATIVE, CONFIRMED, CHECKED_IN,
                                          CANCELLED, NO_SHOW}
          # CHECKED_IN contributes 0 because actual_start_minute is still NULL.

      utilization_pct = round_half_up(
          occupied_chair_minutes / available_chair_minutes * 100, 2)
      # available_chair_minutes == 0 -> utilization_pct := 0.00 (empty-pool guard)
    input_set: "One center, one service_date. The two variants read the SAME appointment rows and differ only in the length attributed to each row and in which statuses contribute."
    constants:
      EMPTY_DENOMINATOR_RESULT: 0.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: SCHEDULED
        when: "variant=SCHEDULED — capacity planning and template tuning; the number the scheduler books against"
        difference: "Attributes each appointment its PLANNED chair_minutes and includes every non-abandoned status including COMPLETED. Never reads actual_start_minute / actual_end_minute, so an appointment that overran or under-ran its template is invisible."
      - name: ACTUAL
        when: "variant=ACTUAL — month-end operational reporting and chair-throughput review"
        difference: "Attributes each appointment its realised (actual_end_minute - actual_start_minute) and gives CONFIRMED / CHECKED_IN rows zero. For identical data the two variants diverge whenever any appointment overran its template or has not yet been infused."

  - name: no_show_risk_score
    trigger: "Recomputed on every Appointment transition into COMPLETED, CANCELLED or NO_SHOW (persisted as Patient.no_show_risk_score using the ROLLING_6 variant); both variants readable through GET /patients/{id}/no-show-risk?variant=..."
    algorithm: decay_function
    formula: |
      history = every Appointment a where a.patient_id == {id}
                AND a.schedule_status IN {COMPLETED, CANCELLED, NO_SHOW}
      event_value(a) = 1.00 if a.schedule_status == NO_SHOW
                       0.50 if a.schedule_status == CANCELLED AND a.late_cancellation == true
                       0.25 if a.schedule_status == CANCELLED AND a.late_cancellation == false
                       0.00 if a.schedule_status == COMPLETED

      # --- variant ROLLING_6 (recency-weighted, persisted) ---
      order history by service_date DESC, then created_at DESC   # pinned tie-break
      window = first min(6, len(history)) rows; i = 0-based index in window
      w(i)   = 100 - 15*i                     # 100, 85, 70, 55, 40, 25
      total_w = sum of w(i) over the rows actually present in window
      score_ROLLING_6 = 0.00 if window is empty
                        else round_half_up(
                            sum(w(i) * event_value(row_i)) / total_w * 100, 2)

      # --- variant QUARTER_TO_DATE (unweighted, calendar-scoped) ---
      quarter = the calendar quarter (Jan-Mar / Apr-Jun / Jul-Sep / Oct-Dec)
                containing the logical clock's UTC date
      qhistory = history rows whose service_date falls inside that quarter
                 (inclusive on both quarter boundaries)
      score_QUARTER_TO_DATE = 0.00 if qhistory is empty
                              else round_half_up(
                                  count(qhistory where schedule_status == NO_SHOW)
                                  / count(qhistory) * 100, 2)

      reminder_tier = "STANDARD"  if score < 20
                      "ELEVATED"  if 20 <= score < 45
                      "INTENSIVE" if score >= 45
      # tier is always derived from the ROLLING_6 score, never from QUARTER_TO_DATE
    input_set: "Terminal-state appointments of ONE patient. ROLLING_6 ignores calendar position entirely and cares only about the last six terminal visits; QUARTER_TO_DATE ignores recency ordering and counts every terminal visit inside the clock's quarter."
    constants:
      ROLLING_WINDOW_SIZE: 6
      WEIGHT_BASE: 100
      WEIGHT_STEP: 15
      VALUE_NO_SHOW: 1.00
      VALUE_LATE_CANCEL: 0.50
      VALUE_EARLY_CANCEL: 0.25
      VALUE_COMPLETED: 0.00
      TIER_ELEVATED_MIN: 20
      TIER_INTENSIVE_MIN: 45
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ROLLING_6
        when: "The persisted score; drives Patient.reminder_tier, Appointment.reminder_cadence_code and the reminder-cadence cap"
        difference: "Recency-weighted over exactly the last six terminal visits; a single recent NO_SHOW dominates because it carries weight 100 out of a small total_w. Calendar boundaries are irrelevant."
      - name: QUARTER_TO_DATE
        when: "variant=QUARTER_TO_DATE — the payer-facing adherence figure quoted per calendar quarter"
        difference: "Unweighted NO_SHOW share over every terminal visit inside the clock's calendar quarter; treats a six-month-old no-show identically to yesterday's if both fall in the quarter, and drops to 0.00 the moment the quarter rolls over. For identical history the two numbers differ whenever the history is not uniformly distributed."

  - name: cancellation_charge
    trigger: "The transition of an Appointment into CANCELLED via POST /appointments/{id}/cancel or POST /reminder-contacts/{id}/response with outcome CANCEL_REQUEST — writes Appointment.cancellation_charge_cents"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED 1 -> 2 -> 3 -> 4 -> 5. The share tier is keyed
      # on the PROVISIONAL total (step 3), never on the final charge (step 5) and
      # never on waste_cost_cents alone.

      # STEP 1 — lateness and base charge
      start_instant = service_date midnight UTC + start_minute minutes
      late_cancellation = (logical_clock >= start_instant - 24 hours)
      base_charge_cents = 0    if late_cancellation == false
                          2500 if late_cancellation == true AND booking_class == "ROUTINE"
                          4000 if late_cancellation == true AND booking_class IN {"SAME_DAY_ADDON","URGENT"}
      # System cancellations (plan suspension, plan supersede, reschedule) bypass
      # this calculation entirely and write cancellation_charge_cents = 0.

      # STEP 2 — waste actually incurred by THIS cancellation
      waste_cost_cents = sum of p.waste_cost_cents over every DrugPreparation p
                         where p.appointment_id == this.id AND p.status == WASTED
                         AND p transitioned PREPARED -> WASTED as part of THIS
                             cancellation
      # p.waste_cost_cents = p.units_requested * Drug.unit_cost_cents.
      # REQUESTED -> RETURNED preparations contribute 0.

      # STEP 3 — provisional total (the tier key)
      provisional_total_cents = base_charge_cents + waste_cost_cents

      # STEP 4 — tier lookup on the provisional total, upper edges INCLUSIVE
      patient_share_pct = 0.00 if provisional_total_cents <= 5000
                          0.20 if 5000  < provisional_total_cents <= 25000
                          0.35 if provisional_total_cents > 25000

      # STEP 5 — final charge
      cancellation_charge_cents = base_charge_cents
                                  + round_half_up(waste_cost_cents * patient_share_pct, 0)

      # STEP 6 — ledger propagation
      Patient.waste_liability_cents = sum of cancellation_charge_cents over the
          patient's appointments with schedule_status == CANCELLED
    input_set: "One Appointment and the DrugPreparation rows this very cancellation moved into WASTED. Preparations wasted earlier by the daily sweep are NOT re-charged (their appointment was not cancelled)."
    constants:
      LATE_WINDOW_HOURS: 24
      BASE_CHARGE_ROUTINE_CENTS: 2500
      BASE_CHARGE_PRIORITY_CENTS: 4000
      SHARE_TIER_1_MAX_CENTS: 5000
      SHARE_TIER_2_MAX_CENTS: 25000
      SHARE_PCT_TIER_1: 0.00
      SHARE_PCT_TIER_2: 0.20
      SHARE_PCT_TIER_3: 0.35
      STEERING_LIABILITY_CENTS: 50000
    precision: "integer cents; the single rounding happens in step 5 with round_half_up"

  - name: billable_chair_units
    trigger: "POST /appointments/{id}/discharge writes Appointment.billable_chair_units; GET /infusion-centers/{id}/chair-billing-summary aggregates the day"
    algorithm: aggregation
    formula: |
      # PER-APPOINTMENT (rounding happens HERE, first)
      actual_chair_minutes      = actual_end_minute - actual_start_minute
      billable_chair_units      = ceil(actual_chair_minutes / 15)

      # PER-DAY (pure sum of already-rounded per-appointment units)
      day_billable_units = sum of a.billable_chair_units over every Appointment a
                           where a.center_id == {id}
                             AND a.service_date == service_date
                             AND a.schedule_status == COMPLETED
      day_billable_cents = day_billable_units * 9000

      # ROUNDING ORDER IS PINNED: ceil per appointment, THEN sum.
      # ceil(sum(actual_chair_minutes) / 15) is FORBIDDEN and yields a smaller
      # number whenever two or more appointments have a non-zero remainder.
    input_set: "Only COMPLETED appointments of one center on one service_date. INFUSING / OBSERVING rows are excluded because actual_end_minute is still NULL; CANCELLED and NO_SHOW rows never bill."
    constants:
      BILLING_UNIT_MINUTES: 15
      UNIT_RATE_CENTS: 9000
    precision: "integer units via ceil(); integer cents"

  - name: observation_extension
    trigger: "POST /appointments/{id}/adverse-events — writes AdverseEvent.observation_extension_minutes and re-derives the appointment's observation window"
    algorithm: threshold
    formula: |
      grade_extension = { 1: 0, 2: 30, 3: 60, 4: 120 }[AdverseEvent.grade]
      AdverseEvent.observation_extension_minutes =
          max(grade_extension, 60) if AdverseEvent.action == "ABORT"
          else grade_extension

      # Aggregation across multiple events on one appointment is MAX, not SUM.
      Appointment.observation_extension_minutes =
          max over the appointment's AdverseEvent rows of
              observation_extension_minutes            (0 when none exist)
      delta = new Appointment.observation_extension_minutes
              - previous Appointment.observation_extension_minutes
      Appointment.observation_minutes = Appointment.observation_minutes + delta
      Appointment.chair_minutes       = Appointment.chair_minutes + delta
      Appointment.end_minute          = Appointment.start_minute + Appointment.chair_minutes
      # delta == 0 leaves the window and every downstream chair untouched.
    input_set: "Every AdverseEvent row of the appointment regardless of status (CLOSED events keep their extension; a closed reaction does not shorten the observation the patient already needs)."
    constants:
      EXT_GRADE_1: 0
      EXT_GRADE_2: 30
      EXT_GRADE_3: 60
      EXT_GRADE_4: 120
      ABORT_MIN_EXTENSION: 60
    precision: "integer minutes"

  - name: lot_selection
    trigger: "POST /appointments/{id}/drug-preparations — writes DrugPreparation.drug_lot_id"
    algorithm: waterfall_allocation
    formula: |
      # ELIGIBILITY FILTER
      candidates = DrugLot rows where
            drug_id         == TreatmentPlan.drug_id of the appointment
        AND status          == "AVAILABLE"
        AND expires_on      >  logical_clock
        AND units_available >= body.units_requested
      # RANKING — first-expiry-first-out
      order candidates by expires_on ASC, then created_at ASC
      chosen = first row
      # EMPTY-POOL FALLBACK
      if candidates is empty: raise ERR_NO_ELIGIBLE_LOT (409)
    input_set: "DrugLot rows of exactly one drug. Partial fills across two lots are not permitted: a single lot must cover units_requested by itself."
    constants: {}
    precision: "integer units"

  - name: lab_gate_evaluation
    trigger: "POST /appointments/{id}/start-infusion precondition, and the lab_ok term of the readiness_status derivation"
    algorithm: threshold
    formula: |
      if Drug.requires_lab_gate == false: return PASS

      # SELECTOR — the single most recent resulted draw
      candidates = LabResult rows where patient_id == Appointment.patient_id
                                   AND status == "RESULTED"
      if candidates is empty: return FAIL(ERR_LAB_RESULT_MISSING)
      order candidates by collected_at DESC, then created_at DESC
      chosen = first row

      age_hours = (logical_clock - chosen.collected_at) / 3600 seconds
      if age_hours > InfusionCenter.lab_validity_hours:
          return FAIL(ERR_LAB_RESULT_STALE)      # age_hours == limit PASSES
      if chosen.anc_value < Drug.lab_min_anc
         OR chosen.platelet_value < Drug.lab_min_platelets:
          return FAIL(ERR_LAB_GATE_NOT_MET)      # value == minimum PASSES
      return PASS
    input_set: "RESULTED LabResult rows of one patient; PENDING draws are invisible to the gate. Only the single latest resulted draw is consulted — an older passing draw cannot rescue a newer failing one."
    constants: {}
    precision: "age compared in whole and fractional hours; thresholds are >= comparisons on the lab values"

  - name: biosimilar_savings
    trigger: "GET /infusion-centers/{id}/utilization — reported alongside utilization_pct as biosimilar_savings_cents"
    algorithm: aggregation
    formula: |
      total = 0
      for every Appointment a where a.center_id == {id}
                                AND a.service_date == service_date
                                AND a.schedule_status IN {INFUSING, OBSERVING, COMPLETED}:
          d = Drug of a.treatment_plan_id
          if d.is_biosimilar == true: contribute 0 and continue
          candidates = Drug rows where reference_drug_id == d.id
                                  AND is_biosimilar == true
                                  AND unit_cost_cents < d.unit_cost_cents
          if candidates is empty: contribute 0 and continue
          order candidates by unit_cost_cents ASC, then created_at ASC
          chosen = first row
          units = sum of p.units_requested over DrugPreparation p where
                  p.appointment_id == a.id AND p.status IN {PREPARED, ADMINISTERED}
          total = total + units * (d.unit_cost_cents - chosen.unit_cost_cents)
      biosimilar_savings_cents = total
    input_set: "Appointments already at or past the chair on one service_date. TENTATIVE / CONFIRMED / CANCELLED / NO_SHOW rows contribute 0 because no product has been committed to the patient yet."
    constants: {}
    precision: "integer cents"

  - name: daily_sweep_run
    trigger: "POST /infusion-centers/{id}/daily-sweep — the ops-run checkpoint"
    algorithm: chronological
    formula: |
      # STEPS RUN IN THIS EXACT ORDER; within each step rows are processed by
      # created_at ASC. Later steps observe the earlier steps' writes.

      # STEP 1 — lot expiry
      for each DrugLot L with status IN {AVAILABLE, DEPLETED}
          AND L.expires_on <= logical_clock:   L.status := EXPIRED
      expired_lot_count = number of rows changed

      # STEP 2 — authorization expiry
      for each AuthorizationRequest R with status == APPROVED
          AND R.expires_at <= logical_clock:
              R.status := EXPIRED; recompute readiness_status of R's appointment
      expired_authorization_count = number of rows changed

      # STEP 3 — prepared-dose stability waste
      for each DrugPreparation P with status == PREPARED
          AND P.usable_until <= logical_clock:
              P -> WASTED (waste_cost_cents written; DrugLot counters updated)
      wasted_preparation_count = number of rows changed
      # This step never bills a patient: no appointment is cancelled here.

      # STEP 4 — no-show detection
      for each Appointment A with A.center_id == {id}
          AND A.service_date == body.service_date
          AND A.schedule_status IN {TENTATIVE, CONFIRMED}
          AND logical_clock >= (A.service_date midnight UTC + A.start_minute
                                + 30 minutes):
              A -> NO_SHOW plus the full strike / risk / tier / steering cascade
      no_show_count = number of rows changed
    input_set: "Steps 1-3 are global (lots, authorizations and preparations are not center-scoped); step 4 is scoped to body.service_date and path center_id. Idempotent: a second sweep at the same clock changes nothing and returns all counters as 0."
    constants:
      NO_SHOW_GRACE_MINUTES: 30
      AUTH_VALIDITY_DAYS: 30
    precision: "integer counters"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:

  # --- 1-9 authentication / authorization / ownership -----------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "When the acting role is InfusionNurse on a chair-side action (check-in, start-infusion, complete-infusion, discharge, adverse-events), X-User-ID equals Appointment.nurse_id"
    error_id: ERR_NURSE_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST /appointments/{id}/check-in, POST /appointments/{id}/start-infusion, POST /appointments/{id}/complete-infusion, POST /appointments/{id}/discharge, POST /appointments/{id}/adverse-events"

  - priority: 4
    category: auth
    check: "When the acting role is Patient, X-User-ID equals the patient_id of the addressed appointment / reminder / patient row"
    error_id: ERR_PATIENT_NOT_OWNER
    http_status: 403
    applies_to: "POST /appointments/{id}/cancel, POST /reminder-contacts/{id}/response, GET /patients/{id}, GET /patients/{id}/no-show-risk, GET /appointments/{id}"

  # --- 10-19 request shape -------------------------------------------------
  - priority: 10
    category: existence
    check: "Every field marked required in the endpoint's input is present, correctly typed, within its declared numeric range, and every enum-valued field carries a declared enum member; minute-of-day fields are integers in [0,1439]; service_date is an ISO-8601 calendar date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # --- 20-29 existence, left-to-right along the path then the body ----------
  - priority: 20
    category: existence
    check: "The path {id} resolves to an existing row of the addressed collection"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_CENTER_NOT_FOUND, ERR_CHAIR_NOT_FOUND, ERR_NURSE_NOT_FOUND, ERR_DRUG_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_PATIENT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_TEMPLATE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_PREPARATION_NOT_FOUND, ERR_ADVERSE_EVENT_NOT_FOUND, ERR_LAB_RESULT_NOT_FOUND, ERR_REMINDER_NOT_FOUND)"
    http_status: 404
    applies_to: "every endpoint carrying a path parameter"

  - priority: 21
    category: existence
    check: "Every foreign-key field in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND (same catalog as priority 20)"
    http_status: 404
    applies_to: "every endpoint whose input carries a foreign-key field"

  # --- 30-39 optimistic concurrency ---------------------------------------
  - priority: 30
    category: state
    check: "expected_appointment_version equals the addressed Appointment's current version"
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/reschedule"

  - priority: 31
    category: state
    check: "expected_drug_lot_version equals the addressed DrugLot's current version"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /drug-lots/{id}/adjustments"

  - priority: 32
    category: state
    check: "expected_treatment_plan_version equals the addressed TreatmentPlan's current version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /treatment-plans/{id}/revisions"

  # --- 40-59 state preconditions on the addressed row ----------------------
  - priority: 40
    category: state
    check: "The appointment's schedule_status is one from which the requested transition is declared in §1.2 (e.g. start-infusion requires CHECKED_IN)"
    error_id: ERR_INVALID_SCHEDULE_STATE
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm, POST /appointments/{id}/check-in, POST /appointments/{id}/start-infusion, POST /appointments/{id}/complete-infusion, POST /appointments/{id}/discharge, POST /appointments/{id}/drug-preparations, POST /appointments/{id}/adverse-events"

  - priority: 41
    category: state
    check: "The appointment's schedule_status is not one of the terminal values COMPLETED, CANCELLED, NO_SHOW"
    error_id: ERR_APPOINTMENT_TERMINAL
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm, POST /appointments/{id}/check-in, POST /appointments/{id}/start-infusion, POST /appointments/{id}/complete-infusion, POST /appointments/{id}/discharge, POST /appointments/{id}/cancel, POST /appointments/{id}/reschedule, POST /appointments/{id}/drug-preparations, POST /appointments/{id}/authorization-requests, POST /appointments/{id}/reminders, POST /appointments/{id}/adverse-events"

  - priority: 42
    category: state
    check: "The authorization request's status permits the requested action (submit requires DRAFT or PENDED; decision requires SUBMITTED)"
    error_id: ERR_INVALID_AUTH_STATE
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/submit, POST /authorization-requests/{id}/decision"

  - priority: 43
    category: state
    check: "The drug preparation's status permits the requested action (prepare requires REQUESTED; return requires REQUESTED or PREPARED)"
    error_id: ERR_INVALID_PREPARATION_STATE
    http_status: 409
    applies_to: "POST /drug-preparations/{id}/prepare, POST /drug-preparations/{id}/return"

  - priority: 44
    category: state
    check: "The adverse event's status permits the requested action (start-review requires REPORTED; close requires UNDER_REVIEW)"
    error_id: ERR_INVALID_ADVERSE_EVENT_STATE
    http_status: 409
    applies_to: "POST /adverse-events/{id}/start-review, POST /adverse-events/{id}/close"

  - priority: 45
    category: state
    check: "The referenced TreatmentPlan's status is ACTIVE, i.e. not SUSPENDED"
    error_id: ERR_PLAN_SUSPENDED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule, POST /treatment-plans/{id}/revisions"

  - priority: 46
    category: state
    check: "The referenced TreatmentPlan's status is not COMPLETED"
    error_id: ERR_PLAN_COMPLETED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule, POST /treatment-plans/{id}/revisions, POST /treatment-plans/{id}/resume"

  - priority: 47
    category: state
    check: "The referenced TreatmentPlan's status is not SUPERSEDED"
    error_id: ERR_PLAN_SUPERSEDED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule, POST /treatment-plans/{id}/revisions, POST /treatment-plans/{id}/resume"

  - priority: 48
    category: state
    check: "The referenced AppointmentTemplate's status is ACTIVE, not RETIRED"
    error_id: ERR_TEMPLATE_RETIRED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 49
    category: state
    check: "A chair is never simultaneously status OUT_OF_SERVICE and reserved_for_urgent == true after the write: an OUT_OF_SERVICE chair cannot be flagged as the urgent reserve, and a chair carrying reserved_for_urgent == true cannot be taken OUT_OF_SERVICE in the same request that sets the flag"
    error_id: ERR_CHAIR_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /chairs, PATCH /chairs/{id}"

  - priority: 50
    category: state
    check: "The DrugLot selected for a preparation is still AVAILABLE at the moment the dose is prepared (it may have been EXPIRED or DEPLETED after the preparation row was created)"
    error_id: ERR_LOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /drug-preparations/{id}/prepare, POST /drug-lots/{id}/adjustments"

  - priority: 51
    category: state
    check: "The reminder contact has not already recorded a patient response"
    error_id: ERR_REMINDER_ALREADY_ANSWERED
    http_status: 409
    applies_to: "POST /reminder-contacts/{id}/response"

  # --- 60-69 referential coherence between the named rows ------------------
  - priority: 60
    category: business_referential
    check: "TreatmentPlan.patient_id equals the appointment's patient_id"
    error_id: ERR_PLAN_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /treatment-plans/{id}/revisions"

  - priority: 61
    category: business_referential
    check: "AppointmentTemplate.drug_id equals TreatmentPlan.drug_id"
    error_id: ERR_TEMPLATE_DRUG_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 62
    category: business_referential
    check: "AppointmentTemplate.center_id equals the requested center_id"
    error_id: ERR_TEMPLATE_CENTER_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 63
    category: business_referential
    check: "AppointmentTemplate.dose_tier equals the dose_tier derived by appointment_window_build from plan.dose_mg_per_kg * patient.weight_kg"
    error_id: ERR_TEMPLATE_TIER_MISMATCH
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 64
    category: business_referential
    check: "The template_version supplied in the body, when present, equals AppointmentTemplate.version"
    error_id: ERR_TEMPLATE_VERSION_STALE
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 65
    category: business_referential
    check: "The requested cycle_number is in [1, TreatmentPlan.total_cycles] and is not already held by a non-terminal or COMPLETED appointment of the same plan"
    error_id: ERR_CYCLE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  # --- 70-79 clinical safety (precedes fiscal, per hospital ordering) ------
  - priority: 70
    category: business_safety
    check: "No AdverseEvent of the patient's prior appointments is still in REPORTED or UNDER_REVIEW when a new infusion is started or a new appointment is booked for the same drug"
    error_id: ERR_ADVERSE_EVENT_OPEN
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/start-infusion"

  - priority: 71
    category: business_safety
    check: "When Drug.requires_lab_gate is true, the patient has at least one RESULTED LabResult"
    error_id: ERR_LAB_RESULT_MISSING
    http_status: 422
    applies_to: "POST /appointments/{id}/start-infusion"

  - priority: 72
    category: business_safety
    check: "The latest RESULTED LabResult's age in hours does not exceed InfusionCenter.lab_validity_hours (age exactly equal to the limit passes)"
    error_id: ERR_LAB_RESULT_STALE
    http_status: 422
    applies_to: "POST /appointments/{id}/start-infusion"

  - priority: 73
    category: business_safety
    check: "The latest RESULTED LabResult satisfies anc_value >= Drug.lab_min_anc and platelet_value >= Drug.lab_min_platelets (equality passes)"
    error_id: ERR_LAB_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /appointments/{id}/start-infusion"

  - priority: 74
    category: business_safety
    check: "The prepared dose is still within its stability window at administration start: prepared_at + Drug.prep_stability_minutes >= service_date midnight + start_minute + premed_minutes"
    error_id: ERR_PREP_STABILITY_SHORT
    http_status: 422
    applies_to: "POST /drug-preparations/{id}/prepare"

  - priority: 75
    category: business_safety
    check: "The patient is not under a site-of-care steering hold (Patient.steering_status == HOME_INFUSION_REVIEW blocks new in-suite bookings)"
    error_id: ERR_PATIENT_STEERING_HOLD
    http_status: 409
    applies_to: "POST /appointments"

  # --- 80-89 authorization / fiscal gates ---------------------------------
  - priority: 80
    category: business_fiscal
    check: "The appointment's authorization request is APPROVED before the chair is confirmed"
    error_id: ERR_AUTH_NOT_APPROVED
    http_status: 409
    applies_to: "POST /appointments/{id}/confirm, POST /appointments/{id}/check-in"

  - priority: 81
    category: business_fiscal
    check: "The APPROVED authorization request has not passed its expires_at at the moment of check-in"
    error_id: ERR_AUTH_EXPIRED
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 82
    category: business_fiscal
    check: "submission_count is below 3 before another submit is accepted"
    error_id: ERR_AUTH_RESUBMIT_LIMIT
    http_status: 409
    applies_to: "POST /authorization-requests/{id}/submit"

  # --- 90-99 temporal windows ----------------------------------------------
  - priority: 90
    category: business_temporal
    check: "service_date is not earlier than the logical clock's UTC date"
    error_id: ERR_SERVICE_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 91
    category: business_temporal
    check: "An appointment booked for the clock's own UTC date must declare booking_class SAME_DAY_ADDON or URGENT; ROUTINE same-day booking is rejected"
    error_id: ERR_SAME_DAY_REQUIRES_ADDON
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 92
    category: business_temporal
    check: "A booking_class of SAME_DAY_ADDON or URGENT requires service_date to equal the clock's UTC date"
    error_id: ERR_ADDON_DATE_MISMATCH
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 93
    category: business_temporal
    check: "A SAME_DAY_ADDON request arrives before InfusionCenter.addon_cutoff_minute of the clock's day (equality passes); URGENT is exempt"
    error_id: ERR_ADDON_CUTOFF_PASSED
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 94
    category: business_temporal
    check: "The grid-snapped start and the full chair window fit inside [InfusionCenter.open_minute, InfusionCenter.close_minute]"
    error_id: ERR_OUTSIDE_OPERATING_HOURS
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 95
    category: business_temporal
    check: "Check-in happens on the appointment's own service_date as measured by the logical clock"
    error_id: ERR_CHECK_IN_WRONG_DAY
    http_status: 409
    applies_to: "POST /appointments/{id}/check-in"

  - priority: 96
    category: business_temporal
    check: "A dose is not compounded earlier than 60 minutes before the appointment's start instant"
    error_id: ERR_PREP_TOO_EARLY
    http_status: 422
    applies_to: "POST /drug-preparations/{id}/prepare"

  - priority: 97
    category: business_temporal
    check: "The patient has no other non-terminal appointment on the same service_date whose [start_minute, end_minute) overlaps the new window (unbuffered, half-open)"
    error_id: ERR_PATIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  # --- 100-109 downstream readiness ---------------------------------------
  - priority: 100
    category: business_referential
    check: "At least one DrugPreparation of the appointment is in status PREPARED before the infusion starts"
    error_id: ERR_PREPARATION_NOT_READY
    http_status: 409
    applies_to: "POST /appointments/{id}/start-infusion"

  # --- 110-129 capacity and quota (last, per hospital ordering) -----------
  - priority: 110
    category: business_constraint
    check: "The number of URGENT appointments already holding a reserved chair at the center on that service_date is below the count of chairs with reserved_for_urgent == true"
    error_id: ERR_URGENT_RESERVE_LIMIT
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 111
    category: business_constraint
    check: "At least one eligible chair exists at some candidate start (non-URGENT path)"
    error_id: ERR_NO_CHAIR_CAPACITY
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 112
    category: business_constraint
    check: "At least one eligible chair exists at the single URGENT candidate start"
    error_id: ERR_URGENT_RESERVE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 113
    category: business_constraint
    check: "At least one ACTIVE nurse's shift covers the whole chair window at a candidate start where a chair was free"
    error_id: ERR_NO_NURSE_ON_SHIFT
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 114
    category: business_constraint
    check: "For every acuity slot the window intersects, the chosen nurse's existing acuity load plus this appointment's acuity_points does not exceed acuity_capacity_points (equality passes)"
    error_id: ERR_NURSE_ACUITY_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments, POST /appointments/{id}/reschedule"

  - priority: 115
    category: business_constraint
    check: "The count of ReminderContact rows already sent for the appointment is below the cadence cap implied by Patient.reminder_tier (STANDARD 1, ELEVATED 3, INTENSIVE 5)"
    error_id: ERR_REMINDER_CADENCE_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments/{id}/reminders"

  - priority: 116
    category: business_constraint
    check: "At least one AVAILABLE, unexpired DrugLot of the plan's drug holds units_available >= units_requested"
    error_id: ERR_NO_ELIGIBLE_LOT
    http_status: 409
    applies_to: "POST /appointments/{id}/drug-preparations"

  - priority: 117
    category: business_constraint
    check: "A lot adjustment never drives units_available below zero"
    error_id: ERR_INSUFFICIENT_DRUG_UNITS
    http_status: 422
    applies_to: "POST /drug-lots/{id}/adjustments"

  # --- 130+ uniqueness -----------------------------------------------------
  - priority: 130
    category: business_constraint
    check: "Patient.mrn is unique across the whole system"
    error_id: ERR_DUPLICATE_MRN
    http_status: 409
    applies_to: "POST /patients"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# All collections hang directly off the root (api_prefix "/"), so every entity
# is reachable as `/<collection>` and `/<collection>/{id}`. Every FK declared in
# §1.1 is reverse-reachable through the matching filtered list endpoint.
# ---------------------------------------------------------------------------
endpoints:

  # --- InfusionCenter -------------------------------------------------------
  - method: POST
    path: "/infusion-centers"
    description: "Register an ambulatory infusion suite with its operating window, stagger grid, turnover buffer, add-on cutoff and lab validity policy."
    roles: [Scheduler]
    code: 201
    input: [name, open_minute, close_minute, "turnover_buffer_minutes?", "urgent_reserve_chair_count?", "addon_cutoff_minute?", "lab_validity_hours?", "stagger_grid_minutes?", "acuity_slot_minutes?"]
    output: InfusionCenter
    side_effects: ["available_chair_count and reserved_chair_count initialised to 0"]

  - method: GET
    path: "/infusion-centers/{id}"
    description: "Read one infusion center including its derived chair counts."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: []
    output: InfusionCenter
    side_effects: []

  - method: GET
    path: "/infusion-centers"
    description: "List infusion centers, newest last by created_at ASC."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: ["name?"]
    output: InfusionCenter[]
    side_effects: []

  # --- Chair ----------------------------------------------------------------
  - method: POST
    path: "/chairs"
    description: "Add a chair to a center. reserved_for_urgent chairs are withheld from ROUTINE and SAME_DAY_ADDON bookings."
    roles: [Scheduler]
    code: 201
    input: [center_id, label, "chair_type?", "status?", "reserved_for_urgent?"]
    output: Chair
    side_effects: ["recomputes InfusionCenter.available_chair_count and reserved_chair_count", "committed_minutes initialised to 0"]

  - method: GET
    path: "/chairs/{id}"
    description: "Read one chair including its derived committed_minutes for the current service day."
    roles: [Scheduler, InfusionNurse, Pharmacist, MedicalDirector]
    code: 200
    input: []
    output: Chair
    side_effects: []

  - method: GET
    path: "/chairs"
    description: "List chairs, optionally filtered by owning center, serviceability or urgent reservation; ordered by label ASC."
    roles: [Scheduler, InfusionNurse, Pharmacist, MedicalDirector]
    code: 200
    input: ["center_id?", "status?", "reserved_for_urgent?"]
    output: Chair[]
    side_effects: []

  - method: PATCH
    path: "/chairs/{id}"
    description: "Change a chair's serviceability or urgent reservation. Taking a chair OUT_OF_SERVICE removes it from every future selector run AND releases the visits already holding it: each of that chair's appointments still in {TENTATIVE, CONFIRMED} is demoted to TENTATIVE with chair_id and nurse_id cleared per the Appointment bump transition in §1.2. Appointments already at or past CHECKED_IN are left alone."
    roles: [Scheduler]
    code: 200
    input: ["status?", "reserved_for_urgent?"]
    output: Chair
    side_effects: ["recomputes InfusionCenter.available_chair_count and reserved_chair_count", "on status -> OUT_OF_SERVICE, demotes this chair's TENTATIVE / CONFIRMED appointments to TENTATIVE with chair_id and nurse_id cleared, recomputing Chair.committed_minutes and Nurse.assigned_acuity_points", "increments Chair.version by 1"]

  # --- Nurse ----------------------------------------------------------------
  - method: POST
    path: "/nurses"
    description: "Add a nurse to a center with an acuity capacity and a shift window."
    roles: [Scheduler]
    code: 201
    input: [center_id, full_name, acuity_capacity_points, shift_start_minute, shift_end_minute, "status?"]
    output: Nurse
    side_effects: ["assigned_acuity_points initialised to 0"]

  - method: GET
    path: "/nurses/{id}"
    description: "Read one nurse including derived assigned_acuity_points."
    roles: [Scheduler, InfusionNurse, MedicalDirector]
    code: 200
    input: []
    output: Nurse
    side_effects: []

  - method: GET
    path: "/nurses"
    description: "List nurses, optionally filtered by center or roster status; ordered by created_at ASC."
    roles: [Scheduler, InfusionNurse, MedicalDirector]
    code: 200
    input: ["center_id?", "status?"]
    output: Nurse[]
    side_effects: []

  - method: PATCH
    path: "/nurses/{id}"
    description: "Adjust a nurse's shift window, acuity capacity or roster status."
    roles: [Scheduler]
    code: 200
    input: ["acuity_capacity_points?", "shift_start_minute?", "shift_end_minute?", "status?"]
    output: Nurse
    side_effects: ["increments Nurse.version by 1"]

  # --- Drug -----------------------------------------------------------------
  - method: POST
    path: "/drugs"
    description: "Register a drug or biologic with its timing profile, acuity weight, stability window, unit cost and lab gate thresholds. Setting is_biosimilar with a reference_drug_id makes it a site-of-care steering candidate for that originator."
    roles: [Pharmacist]
    code: 201
    input: [name, "is_biosimilar?", "reference_drug_id?", base_administration_minutes, min_administration_minutes, "premedication_minutes?", observation_minutes_first_dose, observation_minutes_subsequent, acuity_points, prep_stability_minutes, unit_cost_cents, "requires_lab_gate?", "lab_min_anc?", "lab_min_platelets?"]
    output: Drug
    side_effects: []

  - method: GET
    path: "/drugs/{id}"
    description: "Read one drug's full timing and gating profile."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: []
    output: Drug
    side_effects: []

  - method: GET
    path: "/drugs"
    description: "List drugs. Filtering by reference_drug_id returns the biosimilar family of one originator product, which is how site-of-care steering candidates are discovered."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: ["reference_drug_id?", "is_biosimilar?", "name?"]
    output: Drug[]
    side_effects: []

  # --- DrugLot --------------------------------------------------------------
  - method: POST
    path: "/drug-lots"
    description: "Book a physical lot of a drug into pharmacy inventory. Status is derived AVAILABLE when units_available > 0 and expires_on is after the logical clock."
    roles: [Pharmacist]
    code: 201
    input: [drug_id, lot_number, units_received, expires_on]
    output: DrugLot
    side_effects: ["derives units_available = units_received and status"]

  - method: GET
    path: "/drug-lots/{id}"
    description: "Read one lot with its full unit ledger (received / committed / administered / wasted / returned / available)."
    roles: [Pharmacist, Scheduler, MedicalDirector]
    code: 200
    input: []
    output: DrugLot
    side_effects: []

  - method: GET
    path: "/drug-lots"
    description: "List lots, optionally scoped to one drug or one derived status; ordered by expires_on ASC then created_at ASC, i.e. the FEFO order the lot selector uses."
    roles: [Pharmacist, Scheduler, MedicalDirector]
    code: 200
    input: ["drug_id?", "status?"]
    output: DrugLot[]
    side_effects: []

  - method: POST
    path: "/drug-lots/{id}/adjustments"
    description: "Record a pharmacy inventory adjustment against a lot (receipt correction or physical-count shrinkage). Guarded by optimistic concurrency on the lot's version."
    roles: [Pharmacist]
    code: 200
    input: [units_delta, reason, expected_drug_lot_version]
    output: DrugLot
    side_effects: ["units_received += units_delta", "re-derives units_available and status", "increments DrugLot.version by 1"]

  # --- Patient --------------------------------------------------------------
  - method: POST
    path: "/patients"
    description: "Register a patient with a unique MRN and a dosing weight."
    roles: [Scheduler]
    code: 201
    input: [mrn, full_name, weight_kg]
    output: Patient
    side_effects: ["no_show_strikes 0, no_show_risk_score 0.00, reminder_tier STANDARD, waste_liability_cents 0, steering_status SUITE"]

  - method: GET
    path: "/patients/{id}"
    description: "Read one patient including the persisted ROLLING_6 no-show risk score, reminder tier, waste liability and steering status."
    roles: [Scheduler, InfusionNurse, MedicalDirector, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients"
    description: "List patients, optionally filtered by MRN, reminder tier or steering status."
    roles: [Scheduler, InfusionNurse, MedicalDirector]
    code: 200
    input: ["mrn?", "reminder_tier?", "steering_status?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/patients/{id}/no-show-risk"
    description: "Computed read of the no_show_risk_score calculation. variant defaults to ROLLING_6; variant=QUARTER_TO_DATE returns the unweighted quarter-scoped no-show share instead."
    roles: [Scheduler, MedicalDirector, Patient]
    code: 200
    input: ["variant?"]
    output: "{ patient_id: string, variant: string, score: number, reminder_tier: string, considered_appointment_count: integer }"
    side_effects: []

  # --- TreatmentPlan --------------------------------------------------------
  - method: POST
    path: "/treatment-plans"
    description: "Open a weight-based regimen for a patient on one drug. Status is ACTIVE on creation."
    roles: [Scheduler, MedicalDirector]
    code: 201
    input: [patient_id, drug_id, dose_mg_per_kg, total_cycles, "premed_waived?"]
    output: TreatmentPlan
    side_effects: ["status ACTIVE, completed_cycles 0, first_dose_completed false, supersedes_plan_id NULL"]

  - method: GET
    path: "/treatment-plans/{id}"
    description: "Read one regimen with its derived cycle progress and status."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector, Patient]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: GET
    path: "/treatment-plans"
    description: "List regimens. Filtering by supersedes_plan_id walks the revision chain forward from a superseded plan to its replacement."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: ["patient_id?", "drug_id?", "supersedes_plan_id?", "status?"]
    output: TreatmentPlan[]
    side_effects: []

  - method: POST
    path: "/treatment-plans/{id}/revisions"
    description: "Create a dose revision: a new ACTIVE plan whose supersedes_plan_id points at this one, while this plan moves to SUPERSEDED and its non-terminal appointments are cancelled without charge. Guarded by optimistic concurrency on the original plan's version."
    roles: [Scheduler, MedicalDirector]
    code: 201
    input: [dose_mg_per_kg, total_cycles, "premed_waived?", expected_treatment_plan_version]
    output: TreatmentPlan
    side_effects: ["original plan -> SUPERSEDED", "increments the original TreatmentPlan.version by 1", "every TENTATIVE / CONFIRMED appointment of the original plan -> CANCELLED with cancellation_charge_cents 0", "releases those appointments' chairs and nurse acuity", "new plan created ACTIVE with supersedes_plan_id set"]

  - method: POST
    path: "/treatment-plans/{id}/resume"
    description: "Lift a suspension and return a SUSPENDED regimen to ACTIVE."
    roles: [MedicalDirector]
    code: 200
    input: [reason]
    output: TreatmentPlan
    side_effects: ["status SUSPENDED -> ACTIVE", "increments TreatmentPlan.version by 1"]

  # --- AppointmentTemplate --------------------------------------------------
  - method: POST
    path: "/appointment-templates"
    description: "Build a center-scoped timing template for one drug and one dose tier. Every timing field is snapshotted from the Drug at creation, so later Drug edits do not retro-change booked windows."
    roles: [Scheduler, Pharmacist]
    code: 201
    input: [center_id, drug_id, dose_tier]
    output: AppointmentTemplate
    side_effects: ["snapshots base_admin_minutes, min_admin_minutes, premed_minutes, observation_minutes_first, observation_minutes_subsequent from the Drug", "derives acuity_points and stagger_offset_minutes per the template_build calculation", "status ACTIVE"]

  - method: GET
    path: "/appointment-templates/{id}"
    description: "Read one timing template with its snapshotted minutes and version."
    roles: [Scheduler, InfusionNurse, Pharmacist, MedicalDirector]
    code: 200
    input: []
    output: AppointmentTemplate
    side_effects: []

  - method: GET
    path: "/appointment-templates"
    description: "List timing templates, optionally scoped to a center, a drug, a dose tier or a status."
    roles: [Scheduler, InfusionNurse, Pharmacist, MedicalDirector]
    code: 200
    input: ["center_id?", "drug_id?", "dose_tier?", "status?"]
    output: AppointmentTemplate[]
    side_effects: []

  - method: PATCH
    path: "/appointment-templates/{id}"
    description: "Retire a template or re-snapshot its timing fields from the current Drug profile. Both bump the template's version, which stales any appointment that pinned the old version."
    roles: [Scheduler, Pharmacist]
    code: 200
    input: ["status?", "resnapshot?"]
    output: AppointmentTemplate
    side_effects: ["when resnapshot is true, re-reads every timing field from the Drug and re-derives acuity_points and stagger_offset_minutes", "increments AppointmentTemplate.version by 1"]

  # --- Appointment ----------------------------------------------------------
  - method: POST
    path: "/appointments"
    description: "Book a visit. Runs appointment_window_build to size the chair window and staggered_start_assignment to pick the grid-snapped start, the chair and the nurse. booking_class ROUTINE searches nine candidate starts; SAME_DAY_ADDON does the same but only for the clock's own date and only before the add-on cutoff; URGENT takes the single snapped start and may claim a chair reserved for urgent use."
    roles: [Scheduler]
    code: 201
    input: [center_id, patient_id, treatment_plan_id, template_id, service_date, requested_start_minute, cycle_number, "booking_class?", "template_version?"]
    output: Appointment
    side_effects: ["computes premed_minutes, admin_minutes, observation_minutes, chair_minutes, acuity_points", "computes start_minute, end_minute, chair_id, nurse_id", "pins template_version_pinned", "schedule_status TENTATIVE, readiness_status PENDING", "reminder_cadence_code derived from the patient's reminder_tier", "increments Chair.committed_minutes and Nurse.assigned_acuity_points"]

  - method: GET
    path: "/appointments/{id}"
    description: "Read one appointment including both state dimensions, the full minute breakdown and the billing fields."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector, Patient]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments with any combination of filters; ordered by service_date ASC, start_minute ASC, created_at ASC. Filtering by chair_id, nurse_id or rescheduled_from_appointment_id is how chair rosters, nurse assignments and reschedule chains are discovered."
    roles: [Scheduler, InfusionNurse, Pharmacist, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: ["center_id?", "patient_id?", "treatment_plan_id?", "template_id?", "chair_id?", "nurse_id?", "rescheduled_from_appointment_id?", "service_date?", "schedule_status?", "readiness_status?", "booking_class?"]
    output: Appointment[]
    side_effects: []

  - method: POST
    path: "/appointments/{id}/confirm"
    description: "Confirm a tentative visit once payer authorization is APPROVED and the template version pinned at booking is still current."
    roles: [Scheduler]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status TENTATIVE -> CONFIRMED", "re-derives readiness_status", "increments Appointment.version by 1"]

  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Check the patient in on the service day. Requires a live APPROVED authorization that has not expired."
    roles: [Scheduler, InfusionNurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status CONFIRMED -> CHECKED_IN", "increments Appointment.version by 1"]

  - method: POST
    path: "/appointments/{id}/start-infusion"
    description: "Begin administration. Enforces the lab gate, the open-adverse-event bar and the presence of a PREPARED dose, then stamps actual_start_minute from the logical clock."
    roles: [InfusionNurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status CHECKED_IN -> INFUSING", "actual_start_minute stamped from the logical clock", "every PREPARED DrugPreparation of this appointment -> ADMINISTERED", "moves lot units from committed to administered"]

  - method: POST
    path: "/appointments/{id}/complete-infusion"
    description: "End the drug administration leg and move the patient into the post-infusion observation window."
    roles: [InfusionNurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status INFUSING -> OBSERVING", "increments Appointment.version by 1"]

  - method: POST
    path: "/appointments/{id}/discharge"
    description: "Release the chair at the end of observation. Stamps actual_end_minute, computes billable_chair_units and rolls the plan's cycle counters, which can bubble the plan up to COMPLETED."
    roles: [InfusionNurse]
    code: 200
    input: []
    output: Appointment
    side_effects: ["schedule_status OBSERVING -> COMPLETED", "actual_end_minute stamped from the logical clock", "billable_chair_units computed per the billable_chair_units calculation", "decrements Chair.committed_minutes and Nurse.assigned_acuity_points", "increments TreatmentPlan.completed_cycles and Patient.completed_appointment_count", "recomputes the patient's ROLLING_6 no_show_risk_score and reminder_tier", "bubbles TreatmentPlan -> COMPLETED when completed_cycles reaches total_cycles"]

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a visit. Wastes any dose already compounded, prices the cancellation per the cancellation_charge calculation, releases the chair and nurse and refreshes the patient's no-show risk."
    roles: [Scheduler, Patient]
    code: 200
    input: ["reason?"]
    output: Appointment
    side_effects: ["schedule_status -> CANCELLED", "late_cancellation derived against the 24-hour window", "every PREPARED DrugPreparation of this appointment -> WASTED with waste_cost_cents", "every REQUESTED DrugPreparation of this appointment -> RETURNED, restoring lot units", "cancellation_charge_cents computed and added to Patient.waste_liability_cents", "decrements Chair.committed_minutes and Nurse.assigned_acuity_points", "recomputes the patient's ROLLING_6 no_show_risk_score and reminder_tier"]

  - method: POST
    path: "/appointments/{id}/reschedule"
    description: "Move a visit to a new date or start minute by creating a replacement appointment and retiring this one. The replacement re-runs the window build and the selector from scratch. Guarded by optimistic concurrency on the original appointment's version."
    roles: [Scheduler]
    code: 201
    input: [service_date, requested_start_minute, "booking_class?", expected_appointment_version]
    output: Appointment
    side_effects: ["original appointment CONFIRMED -> TENTATIVE then -> CANCELLED with cancellation_charge_cents 0", "increments the original Appointment.version by 1", "new appointment created TENTATIVE with rescheduled_from_appointment_id set to the original", "releases the original chair and nurse before the selector runs for the replacement"]

  - method: POST
    path: "/appointments/{id}/authorization-requests"
    description: "File a payer authorization request for a visit. Created in DRAFT; treatment_plan_id is copied from the appointment."
    roles: [AuthorizationSpecialist, Scheduler]
    code: 201
    input: [payer_name]
    output: AuthorizationRequest
    side_effects: ["status DRAFT, submission_count 0", "copies treatment_plan_id from the appointment", "re-derives the appointment's readiness_status"]

  - method: POST
    path: "/appointments/{id}/drug-preparations"
    description: "Request a compounded dose for a visit. Runs the FEFO lot_selection over the plan drug's AVAILABLE, unexpired lots and commits units out of the chosen lot."
    roles: [Pharmacist]
    code: 201
    input: [units_requested]
    output: DrugPreparation
    side_effects: ["status REQUESTED", "drug_lot_id set by the FEFO lot selector", "increments DrugLot.units_committed and decrements units_available", "re-derives DrugLot.status"]

  - method: POST
    path: "/appointments/{id}/adverse-events"
    description: "Record an infusion reaction at the bedside. The grade and bedside action extend the observation window per the observation_extension calculation, which lengthens the chair occupancy and can bump a later appointment off the same chair."
    roles: [InfusionNurse]
    code: 201
    input: [grade, action, "note?"]
    output: AdverseEvent
    side_effects: ["status REPORTED, reported_by_nurse_id taken from X-User-ID", "observation_extension_minutes per the observation_extension calculation", "extends Appointment.observation_minutes, chair_minutes and end_minute by the max-aggregated delta", "grade >= 3 drives the appointment readiness_status FULLY_CLEARED -> BLOCKED, which bars start-infusion until the review is closed", "any later appointment on the same chair that the extended window now collides with is bumped CONFIRMED -> TENTATIVE and loses its chair and nurse"]

  - method: POST
    path: "/appointments/{id}/reminders"
    description: "Record an outreach contact for a visit. The number of contacts permitted per visit is capped by the patient's reminder_tier (STANDARD 1, ELEVATED 3, INTENSIVE 5)."
    roles: [Scheduler]
    code: 201
    input: [channel]
    output: ReminderContact
    side_effects: ["sequence_number derived as existing contact count + 1", "sent_at stamped from the logical clock", "outcome NO_RESPONSE", "copies patient_id from the appointment"]

  # --- AuthorizationRequest -------------------------------------------------
  - method: GET
    path: "/authorization-requests/{id}"
    description: "Read one payer authorization request with its submission count, decision and expiry."
    roles: [AuthorizationSpecialist, Scheduler, MedicalDirector]
    code: 200
    input: []
    output: AuthorizationRequest
    side_effects: []

  - method: GET
    path: "/authorization-requests"
    description: "List payer authorization requests, optionally scoped to one appointment, one regimen, one payer or one status."
    roles: [AuthorizationSpecialist, Scheduler, MedicalDirector]
    code: 200
    input: ["appointment_id?", "treatment_plan_id?", "payer_name?", "status?"]
    output: AuthorizationRequest[]
    side_effects: []

  - method: POST
    path: "/authorization-requests/{id}/submit"
    description: "Send the request to the payer. Legal from DRAFT and from PENDED, so a pended request can be resubmitted, but only until submission_count reaches 3."
    roles: [AuthorizationSpecialist]
    code: 200
    input: []
    output: AuthorizationRequest
    side_effects: ["status DRAFT or PENDED -> SUBMITTED", "increments submission_count by 1", "re-derives the appointment's readiness_status", "increments AuthorizationRequest.version by 1"]

  - method: POST
    path: "/authorization-requests/{id}/decision"
    description: "Record the payer's disposition. APPROVED stamps expires_at 30 days out and clears the appointment's authorization gate; PENDED sends it back for resubmission; DENIED is terminal."
    roles: [AuthorizationSpecialist]
    code: 200
    input: [decision, "approved_units?", "decision_reason?"]
    output: AuthorizationRequest
    side_effects: ["status SUBMITTED -> APPROVED / PENDED / DENIED", "decided_at stamped from the logical clock", "expires_at set to decided_at + 30 days on APPROVED, NULL otherwise", "re-derives the appointment's readiness_status", "increments AuthorizationRequest.version by 1"]

  # --- DrugPreparation ------------------------------------------------------
  - method: GET
    path: "/drug-preparations/{id}"
    description: "Read one compounded dose with its lot, stability window and waste cost."
    roles: [Pharmacist, InfusionNurse, Scheduler, MedicalDirector]
    code: 200
    input: []
    output: DrugPreparation
    side_effects: []

  - method: GET
    path: "/drug-preparations"
    description: "List compounded doses, optionally scoped to one appointment, one lot or one status."
    roles: [Pharmacist, InfusionNurse, Scheduler, MedicalDirector]
    code: 200
    input: ["appointment_id?", "drug_lot_id?", "status?"]
    output: DrugPreparation[]
    side_effects: []

  - method: POST
    path: "/drug-preparations/{id}/prepare"
    description: "Compound the dose. Refused earlier than 60 minutes before the visit's start instant, and refused when the drug's stability window would expire before the administration leg begins."
    roles: [Pharmacist]
    code: 200
    input: []
    output: DrugPreparation
    side_effects: ["status REQUESTED -> PREPARED", "prepared_at stamped from the logical clock", "usable_until set to prepared_at + Drug.prep_stability_minutes", "re-derives the appointment's readiness_status"]

  - method: POST
    path: "/drug-preparations/{id}/return"
    description: "Return a dose to stock at no charge. Legal from REQUESTED (never compounded) and from PREPARED (compounded but not yet hung); either way the units go back to the lot and the lot may leave DEPLETED."
    roles: [Pharmacist]
    code: 200
    input: [reason]
    output: DrugPreparation
    side_effects: ["status REQUESTED or PREPARED -> RETURNED", "decrements DrugLot.units_committed and increments units_returned and units_available", "re-derives DrugLot.status, which can move it DEPLETED -> AVAILABLE"]

  # --- AdverseEvent ---------------------------------------------------------
  - method: GET
    path: "/adverse-events/{id}"
    description: "Read one reaction record with its grade, bedside action, observation extension and review status."
    roles: [MedicalDirector, InfusionNurse, Scheduler]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: []

  - method: GET
    path: "/adverse-events"
    description: "List reaction records, optionally scoped to one appointment, one reporting nurse, one grade or one review status."
    roles: [MedicalDirector, InfusionNurse, Scheduler]
    code: 200
    input: ["appointment_id?", "reported_by_nurse_id?", "grade?", "status?"]
    output: AdverseEvent[]
    side_effects: []

  - method: POST
    path: "/adverse-events/{id}/start-review"
    description: "Open the medical director's review of a reported reaction."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: AdverseEvent
    side_effects: ["status REPORTED -> UNDER_REVIEW", "increments AdverseEvent.version by 1"]

  - method: POST
    path: "/adverse-events/{id}/close"
    description: "Close the review with a disposition. RESUME_SAME_DRUG clears the appointment readiness block; SWITCH_BIOSIMILAR and DISCONTINUE suspend the TreatmentPlan, which cascades a zero-charge cancellation onto that plan's live appointments."
    roles: [MedicalDirector]
    code: 200
    input: [review_outcome, "note?"]
    output: AdverseEvent
    side_effects: ["status UNDER_REVIEW -> CLOSED with review_outcome stored", "on RESUME_SAME_DRUG the appointment readiness_status is recomputed BLOCKED -> FULLY_CLEARED when nothing else blocks", "on SWITCH_BIOSIMILAR or DISCONTINUE the TreatmentPlan transitions ACTIVE -> SUSPENDED, cancelling that plan's TENTATIVE / CONFIRMED appointments with cancellation_charge_cents 0 and releasing their chairs and nurse acuity", "the appointment observation extension is retained", "increments AdverseEvent.version by 1"]

  # --- LabResult (immutable) ------------------------------------------------
  - method: POST
    path: "/lab-results"
    description: "File a laboratory draw for a patient. Supplying both anc_value and platelet_value files a RESULTED draw; omitting either files a PENDING draw that the gate ignores. LabResult rows are immutable — a corrected value is filed as a new, later draw."
    roles: [Pharmacist, InfusionNurse]
    code: 201
    input: [patient_id, collected_at, "anc_value?", "platelet_value?"]
    output: LabResult
    side_effects: ["status derived RESULTED when both values are present, else PENDING", "re-derives the readiness_status of the patient's non-terminal appointments"]

  - method: GET
    path: "/lab-results/{id}"
    description: "Read one laboratory draw."
    roles: [Pharmacist, InfusionNurse, Scheduler, MedicalDirector]
    code: 200
    input: []
    output: LabResult
    side_effects: []

  - method: GET
    path: "/lab-results"
    description: "List laboratory draws, optionally scoped to one patient or one status; ordered by collected_at DESC then created_at DESC, i.e. the order the lab gate consults them."
    roles: [Pharmacist, InfusionNurse, Scheduler, MedicalDirector]
    code: 200
    input: ["patient_id?", "status?"]
    output: LabResult[]
    side_effects: []

  # --- ReminderContact ------------------------------------------------------
  - method: GET
    path: "/reminder-contacts/{id}"
    description: "Read one outreach contact with its sequence number and recorded outcome."
    roles: [Scheduler, Patient, MedicalDirector]
    code: 200
    input: []
    output: ReminderContact
    side_effects: []

  - method: GET
    path: "/reminder-contacts"
    description: "List outreach contacts, optionally scoped to one appointment, one patient, one channel or one outcome; ordered by sequence_number ASC."
    roles: [Scheduler, Patient, MedicalDirector]
    code: 200
    input: ["appointment_id?", "patient_id?", "channel?", "outcome?"]
    output: ReminderContact[]
    side_effects: []

  - method: POST
    path: "/reminder-contacts/{id}/response"
    description: "Record the patient's answer to an outreach contact. CONFIRM_ATTENDANCE leaves the visit alone; CANCEL_REQUEST drives the full cancellation path including waste pricing."
    roles: [Patient, Scheduler]
    code: 200
    input: [outcome]
    output: ReminderContact
    side_effects: ["outcome NO_RESPONSE -> CONFIRM_ATTENDANCE or CANCEL_REQUEST", "on CANCEL_REQUEST the appointment runs the cancel transition with the full waste and charge cascade", "increments ReminderContact.version by 1"]

  # --- Computed reads and the ops run --------------------------------------
  - method: GET
    path: "/infusion-centers/{id}/utilization"
    description: "Computed read of chair utilization for one service day. variant defaults to SCHEDULED (planned chair_minutes over the whole booked day); variant=ACTUAL reports realised occupancy from actual_start_minute / actual_end_minute. Also reports the biosimilar steering savings available on that day's volume."
    roles: [Scheduler, MedicalDirector]
    code: 200
    input: [service_date, "variant?"]
    output: "{ center_id: string, service_date: string, variant: string, available_chair_minutes: integer, occupied_chair_minutes: integer, utilization_pct: number, appointment_count: integer, biosimilar_savings_cents: integer }"
    side_effects: []

  - method: GET
    path: "/infusion-centers/{id}/chair-billing-summary"
    description: "Computed read of the day's chair billing. Units are ceilinged per appointment and only then summed, per the billable_chair_units calculation."
    roles: [Scheduler, MedicalDirector]
    code: 200
    input: [service_date]
    output: "{ center_id: string, service_date: string, completed_appointment_count: integer, day_billable_units: integer, day_billable_cents: integer }"
    side_effects: []

  - method: POST
    path: "/infusion-centers/{id}/daily-sweep"
    description: "Ops-run checkpoint. Runs four ordered steps against the logical clock: lot expiry, authorization expiry, prepared-dose stability waste, then no-show detection for the named service_date. Idempotent at a fixed clock."
    roles: [Scheduler]
    code: 200
    input: [service_date]
    output: "{ center_id: string, service_date: string, expired_lot_count: integer, expired_authorization_count: integer, wasted_preparation_count: integer, no_show_count: integer }"
    side_effects: ["expired DrugLot rows -> EXPIRED", "expired APPROVED AuthorizationRequest rows -> EXPIRED and their appointments' readiness_status re-derived", "PREPARED doses past usable_until -> WASTED with waste_cost_cents and lot counters updated", "TENTATIVE / CONFIRMED appointments past their start plus the 30-minute grace -> NO_SHOW with the strike, risk, tier, steering and plan-suspension cascade"]

  # --- Test-driving endpoints (/_ namespace) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to any UTC instant. Before the first call the logical clock reads exactly the fixed default 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Every deadline, expiry, freshness and grace-period rule in this domain reads this clock."
    roles: [Scheduler, Pharmacist, InfusionNurse, AuthorizationSpecialist, MedicalDirector]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["subsequent reads of the logical clock return current_utc", "no entity state is recomputed by this call alone"]

  - method: POST
    path: "/_inject/appointment_history"
    description: "Inject a historical appointment already in one of the three terminal schedule_status values (COMPLETED, CANCELLED, NO_SHOW) without walking the whole booking / authorization / check-in / discharge chain. Needed because the no-show risk curve and reminder cadence are functions of up to six prior terminal visits, and because a NO_SHOW can otherwise only be produced by the sweep on a past service day. The injected row holds no chair and no nurse, so it never blocks the chair selector, but it does count in the utilization and chair-billing aggregates for its service_date exactly as a normally-booked row would."
    roles: [Scheduler]
    code: 201
    input: [center_id, patient_id, treatment_plan_id, template_id, service_date, schedule_status, chair_minutes, "start_minute?", "actual_start_minute?", "actual_end_minute?", "late_cancellation?", "booking_class?", "cycle_number?"]
    output: Appointment
    side_effects: ["creates an Appointment directly in the requested terminal schedule_status with chair_id and nurse_id NULL", "computes billable_chair_units when both actual_start_minute and actual_end_minute are supplied", "when the recomputed steering_status flips to HOME_INFUSION_REVIEW, every ACTIVE TreatmentPlan of that patient transitions to SUSPENDED with the usual zero-charge cancellation cascade", "recomputes the patient's no_show_strikes, completed_appointment_count, ROLLING_6 no_show_risk_score, reminder_tier and steering_status", "recomputes TreatmentPlan.completed_cycles and first_dose_completed when schedule_status is COMPLETED"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- auth ----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the target endpoint's roles"
  - id: ERR_NURSE_NOT_ASSIGNED
    http: 403
    condition: "An InfusionNurse acts on a chair-side appointment action while X-User-ID differs from Appointment.nurse_id"
  - id: ERR_PATIENT_NOT_OWNER
    http: 403
    condition: "A Patient addresses an appointment, reminder or patient row whose patient_id differs from X-User-ID"

  # --- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, mistyped, out of its declared numeric range, or carries an undeclared enum member"

  # --- existence -----------------------------------------------------------
  - id: ERR_CENTER_NOT_FOUND
    http: 404
    condition: "No InfusionCenter matches the supplied id"
  - id: ERR_CHAIR_NOT_FOUND
    http: 404
    condition: "No Chair matches the supplied id"
  - id: ERR_NURSE_NOT_FOUND
    http: 404
    condition: "No Nurse matches the supplied id"
  - id: ERR_DRUG_NOT_FOUND
    http: 404
    condition: "No Drug matches the supplied id, including a reference_drug_id that does not resolve"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "No DrugLot matches the supplied id"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "No Patient matches the supplied id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No TreatmentPlan matches the supplied id"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "No AppointmentTemplate matches the supplied id"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No Appointment matches the supplied id"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "No AuthorizationRequest matches the supplied id"
  - id: ERR_PREPARATION_NOT_FOUND
    http: 404
    condition: "No DrugPreparation matches the supplied id"
  - id: ERR_ADVERSE_EVENT_NOT_FOUND
    http: 404
    condition: "No AdverseEvent matches the supplied id"
  - id: ERR_LAB_RESULT_NOT_FOUND
    http: 404
    condition: "No LabResult matches the supplied id"
  - id: ERR_REMINDER_NOT_FOUND
    http: 404
    condition: "No ReminderContact matches the supplied id"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_APPOINTMENT_VERSION
    http: 412
    condition: "expected_appointment_version does not equal the addressed Appointment's current version on POST /appointments/{id}/reschedule"
  - id: ERR_STALE_LOT_VERSION
    http: 412
    condition: "expected_drug_lot_version does not equal the addressed DrugLot's current version on POST /drug-lots/{id}/adjustments"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_treatment_plan_version does not equal the addressed TreatmentPlan's current version on POST /treatment-plans/{id}/revisions"

  # --- state preconditions -------------------------------------------------
  - id: ERR_INVALID_SCHEDULE_STATE
    http: 409
    condition: "The appointment's schedule_status has no declared transition for the requested trigger"
  - id: ERR_APPOINTMENT_TERMINAL
    http: 409
    condition: "The appointment is already COMPLETED, CANCELLED or NO_SHOW"
  - id: ERR_INVALID_AUTH_STATE
    http: 409
    condition: "submit was called on a request that is not DRAFT or PENDED, or decision was called on a request that is not SUBMITTED"
  - id: ERR_INVALID_PREPARATION_STATE
    http: 409
    condition: "prepare or return was called on a preparation that is not REQUESTED"
  - id: ERR_INVALID_ADVERSE_EVENT_STATE
    http: 409
    condition: "start-review was called on an event that is not REPORTED, or close on an event that is not UNDER_REVIEW"
  - id: ERR_PLAN_SUSPENDED
    http: 409
    condition: "The referenced TreatmentPlan is SUSPENDED by steering or by an adverse-event review"
  - id: ERR_PLAN_COMPLETED
    http: 409
    condition: "The referenced TreatmentPlan has already delivered every prescribed cycle"
  - id: ERR_PLAN_SUPERSEDED
    http: 409
    condition: "The referenced TreatmentPlan has been replaced by a dose revision"
  - id: ERR_TEMPLATE_RETIRED
    http: 409
    condition: "The referenced AppointmentTemplate has been retired"
  - id: ERR_CHAIR_OUT_OF_SERVICE
    http: 409
    condition: "The write would leave a chair both OUT_OF_SERVICE and reserved_for_urgent == true"
  - id: ERR_LOT_NOT_AVAILABLE
    http: 409
    condition: "The lot backing a preparation is no longer AVAILABLE at compounding time because it expired or was depleted"
  - id: ERR_REMINDER_ALREADY_ANSWERED
    http: 409
    condition: "The reminder contact already carries a patient response other than NO_RESPONSE"

  # --- referential coherence ----------------------------------------------
  - id: ERR_PLAN_PATIENT_MISMATCH
    http: 422
    condition: "TreatmentPlan.patient_id differs from the appointment's patient_id"
  - id: ERR_TEMPLATE_DRUG_MISMATCH
    http: 422
    condition: "AppointmentTemplate.drug_id differs from TreatmentPlan.drug_id"
  - id: ERR_TEMPLATE_CENTER_MISMATCH
    http: 422
    condition: "AppointmentTemplate.center_id differs from the requested center_id"
  - id: ERR_TEMPLATE_TIER_MISMATCH
    http: 422
    condition: "AppointmentTemplate.dose_tier differs from the tier derived from dose_mg_per_kg times weight_kg"
  - id: ERR_TEMPLATE_VERSION_STALE
    http: 409
    condition: "A supplied template_version, or the template_version_pinned at booking, differs from the template's current version"
  - id: ERR_CYCLE_OUT_OF_RANGE
    http: 422
    condition: "cycle_number is outside [1, total_cycles] or is already held by another live or completed appointment of the same plan"
  - id: ERR_PREPARATION_NOT_READY
    http: 409
    condition: "No DrugPreparation of the appointment is in status PREPARED when the infusion is started"

  # --- clinical safety -----------------------------------------------------
  - id: ERR_ADVERSE_EVENT_OPEN
    http: 409
    condition: "An AdverseEvent of the patient is still REPORTED or UNDER_REVIEW"
  - id: ERR_LAB_RESULT_MISSING
    http: 422
    condition: "The drug requires a lab gate and the patient has no RESULTED LabResult at all"
  - id: ERR_LAB_RESULT_STALE
    http: 422
    condition: "The latest RESULTED LabResult is older than the center's lab_validity_hours"
  - id: ERR_LAB_GATE_NOT_MET
    http: 422
    condition: "The latest RESULTED LabResult's anc_value or platelet_value is below the drug's minimum"
  - id: ERR_PREP_STABILITY_SHORT
    http: 422
    condition: "prepared_at plus the drug's prep_stability_minutes falls before the administration leg would begin"
  - id: ERR_PATIENT_STEERING_HOLD
    http: 409
    condition: "The patient's steering_status is HOME_INFUSION_REVIEW, which bars new in-suite bookings"

  # --- authorization / fiscal ---------------------------------------------
  - id: ERR_AUTH_NOT_APPROVED
    http: 409
    condition: "The appointment has no APPROVED AuthorizationRequest when confirmation or check-in is attempted"
  - id: ERR_AUTH_EXPIRED
    http: 409
    condition: "The appointment's APPROVED AuthorizationRequest has passed its expires_at, or the sweep already moved it to EXPIRED"
  - id: ERR_AUTH_RESUBMIT_LIMIT
    http: 409
    condition: "A fourth submission of the same authorization request was attempted (submission_count already 3)"

  # --- temporal windows ----------------------------------------------------
  - id: ERR_SERVICE_DATE_IN_PAST
    http: 422
    condition: "service_date precedes the logical clock's UTC date"
  - id: ERR_SAME_DAY_REQUIRES_ADDON
    http: 422
    condition: "A ROUTINE booking names the logical clock's own UTC date"
  - id: ERR_ADDON_DATE_MISMATCH
    http: 422
    condition: "A SAME_DAY_ADDON or URGENT booking names a service_date other than the logical clock's UTC date"
  - id: ERR_ADDON_CUTOFF_PASSED
    http: 422
    condition: "A SAME_DAY_ADDON booking arrives after the center's addon_cutoff_minute"
  - id: ERR_OUTSIDE_OPERATING_HOURS
    http: 422
    condition: "The grid-snapped start, or the full chair window, falls outside the center's operating window"
  - id: ERR_CHECK_IN_WRONG_DAY
    http: 409
    condition: "Check-in was attempted on a UTC date other than the appointment's service_date"
  - id: ERR_PREP_TOO_EARLY
    http: 422
    condition: "Compounding was attempted more than 60 minutes before the appointment's start instant"
  - id: ERR_PATIENT_DOUBLE_BOOKED
    http: 409
    condition: "The patient already holds a live appointment on the same service_date whose half-open window overlaps the requested one"

  # --- capacity and quota --------------------------------------------------
  - id: ERR_URGENT_RESERVE_LIMIT
    http: 409
    condition: "Every urgent-reserved chair at the center is already claimed by another URGENT appointment on that service_date"
  - id: ERR_NO_CHAIR_CAPACITY
    http: 409
    condition: "No eligible chair is free at any of the nine candidate starts for a ROUTINE or SAME_DAY_ADDON booking"
  - id: ERR_URGENT_RESERVE_UNAVAILABLE
    http: 409
    condition: "No eligible chair is free at the single candidate start of an URGENT booking"
  - id: ERR_NO_NURSE_ON_SHIFT
    http: 409
    condition: "A chair was free but no ACTIVE nurse's shift covers the whole chair window at any candidate start"
  - id: ERR_NURSE_ACUITY_EXCEEDED
    http: 409
    condition: "A chair and an on-shift nurse were both available but every candidate assignment would push some acuity slot above the nurse's acuity_capacity_points"
  - id: ERR_REMINDER_CADENCE_EXCEEDED
    http: 409
    condition: "The outreach cap implied by the patient's reminder_tier has already been reached for this appointment"
  - id: ERR_NO_ELIGIBLE_LOT
    http: 409
    condition: "No AVAILABLE, unexpired lot of the plan's drug holds at least units_requested units"
  - id: ERR_INSUFFICIENT_DRUG_UNITS
    http: 422
    condition: "A lot adjustment would drive units_available below zero"

  # --- uniqueness ----------------------------------------------------------
  - id: ERR_DUPLICATE_MRN
    http: 409
    condition: "Another Patient already holds the supplied mrn"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (peer_roles: non-overlapping resource ownership)
# ---------------------------------------------------------------------------
roles:

  - name: Scheduler
    description: "Owns the booking surface: centers, chairs, roster windows, patients, regimens, templates, appointments, reminders and the daily ops sweep. Cannot compound doses, decide payer authorizations, act at the bedside or close an adverse-event review."
    identity: "opaque"
    exclusive_operations:
      - "POST /infusion-centers"
      - "POST /chairs"
      - "PATCH /chairs/{id}"
      - "POST /nurses"
      - "PATCH /nurses/{id}"
      - "POST /patients"
      - "POST /appointments"
      - "POST /appointments/{id}/confirm"
      - "POST /appointments/{id}/reschedule"
      - "POST /appointments/{id}/reminders"
      - "POST /infusion-centers/{id}/daily-sweep"
      - "POST /_inject/appointment_history"
    shared_operations:
      - "POST /treatment-plans (with MedicalDirector)"
      - "POST /treatment-plans/{id}/revisions (with MedicalDirector)"
      - "POST /appointment-templates (with Pharmacist)"
      - "PATCH /appointment-templates/{id} (with Pharmacist)"
      - "POST /appointments/{id}/check-in (with InfusionNurse)"
      - "POST /appointments/{id}/cancel (with Patient)"
      - "POST /appointments/{id}/authorization-requests (with AuthorizationSpecialist)"
      - "POST /reminder-contacts/{id}/response (with Patient)"
      - "GET /infusion-centers/{id}/utilization (with MedicalDirector)"
      - "GET /infusion-centers/{id}/chair-billing-summary (with MedicalDirector)"
      - "GET /patients/{id}/no-show-risk (with MedicalDirector and Patient)"
      - "POST /_clock/set_current_utc (with every role)"
      - "all GET reads of centers, chairs, nurses, drugs, lots, patients, plans, templates, appointments, authorizations, preparations, adverse events, lab results and reminders"

  - name: InfusionNurse
    description: "Chair-side clinician. Owns the infusion itself and the bedside reaction record. X-User-ID must equal Appointment.nurse_id for every chair-side action, so a nurse cannot act on another nurse's assignment."
    identity: "entity_backed:Nurse"
    exclusive_operations:
      - "POST /appointments/{id}/start-infusion"
      - "POST /appointments/{id}/complete-infusion"
      - "POST /appointments/{id}/discharge"
      - "POST /appointments/{id}/adverse-events"
    shared_operations:
      - "POST /appointments/{id}/check-in (with Scheduler)"
      - "POST /lab-results (with Pharmacist)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of centers, chairs, nurses, drugs, patients, plans, templates, appointments, preparations, adverse events and lab results"

  - name: Pharmacist
    description: "Owns the drug catalogue, physical inventory and compounding. Cannot book, confirm, cancel or reschedule a visit, and cannot start an infusion."
    identity: "opaque"
    exclusive_operations:
      - "POST /drugs"
      - "POST /drug-lots"
      - "POST /drug-lots/{id}/adjustments"
      - "POST /appointments/{id}/drug-preparations"
      - "POST /drug-preparations/{id}/prepare"
      - "POST /drug-preparations/{id}/return"
    shared_operations:
      - "POST /appointment-templates (with Scheduler)"
      - "PATCH /appointment-templates/{id} (with Scheduler)"
      - "POST /lab-results (with InfusionNurse)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of centers, chairs, drugs, lots, plans, templates, appointments, authorizations, preparations and lab results"

  - name: AuthorizationSpecialist
    description: "Owns the payer authorization lifecycle: submission, resubmission after a pend, and recording the payer's decision. Cannot book, compound or infuse."
    identity: "opaque"
    exclusive_operations:
      - "POST /authorization-requests/{id}/submit"
      - "POST /authorization-requests/{id}/decision"
    shared_operations:
      - "POST /appointments/{id}/authorization-requests (with Scheduler)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of centers, drugs, plans, appointments and authorizations"

  - name: MedicalDirector
    description: "Clinical governance. Owns adverse-event review and the decision to resume or keep a regimen suspended, plus the utilization and billing analytics. Cannot compound, cannot infuse and cannot book."
    identity: "opaque"
    exclusive_operations:
      - "POST /adverse-events/{id}/start-review"
      - "POST /adverse-events/{id}/close"
      - "POST /treatment-plans/{id}/resume"
    shared_operations:
      - "POST /treatment-plans (with Scheduler)"
      - "POST /treatment-plans/{id}/revisions (with Scheduler)"
      - "GET /infusion-centers/{id}/utilization (with Scheduler)"
      - "GET /infusion-centers/{id}/chair-billing-summary (with Scheduler)"
      - "GET /patients/{id}/no-show-risk (with Scheduler and Patient)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET reads of centers, chairs, nurses, drugs, lots, patients, plans, templates, appointments, authorizations, preparations, adverse events, lab results and reminders"

  - name: Patient
    description: "Self-service surface. May cancel their own visit and answer their own reminder, and may read their own record, plans, appointments and risk score. X-User-ID must equal the addressed Patient.id or the appointment's patient_id."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "POST /appointments/{id}/cancel (with Scheduler)"
      - "POST /reminder-contacts/{id}/response (with Scheduler)"
      - "GET /patients/{id} (own record only)"
      - "GET /patients/{id}/no-show-risk (own record only)"
      - "GET /appointments/{id} (own visits only)"
      - "GET /treatment-plans/{id} (own regimens only)"
      - "GET /reminder-contacts/{id} and GET /reminder-contacts (own contacts only)"
