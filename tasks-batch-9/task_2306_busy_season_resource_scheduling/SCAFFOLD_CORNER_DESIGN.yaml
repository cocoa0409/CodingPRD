          - errors[ERR_STALE_PHASE_VERSION]
          - endpoints[POST /scheduling/assignments/{assignment_id}/reassign]
        distinguishing_aspect: |
          The OCC token is the PHASE's version, not the assignment's: a concurrent booking on
          a sibling assignment of the same phase invalidates a reassign token that was read
          before it, the stale attempt is refused with 412 and changes nothing, and the same
          call succeeds once the fresh version is read back.
