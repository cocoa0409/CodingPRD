  - { method: POST, path: "/central-casting/bump-adjustments/{id}/reject", description: "PENDING -> REJECTED (SoD applies)", roles: [CastingDirector], code: 200, input: [], output: BumpAdjustment, side_effects: ["version +1"] }

  # --- PayrollBatch ---
