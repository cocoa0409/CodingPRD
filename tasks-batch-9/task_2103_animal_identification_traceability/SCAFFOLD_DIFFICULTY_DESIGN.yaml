            - call: "POST /device-suppliers"
              payload: { company_name: "AllFlex North", supplier_code: "AFNA" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { sup_s: $.data.id }
            - call: "POST /device-suppliers/${sup_s}/approve"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-apr"
              captures: { sup_s_v: $.data.version }
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_s}", premises_id: "${ps}", serial_start: 100000000001, serial_end: 100000004000, expected_supplier_version: "${sup_s_v}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_s}"
            - call: "POST /device-suppliers/${sup_s}/defect-reports"
              payload: { defect_count: 6 }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-id-1"
              captures: { sup_s_v2: $.data.version, cap_now: $.data.issuance_cap }
          trigger:
            - call: "POST /tag-lots"
              payload: { supplier_id: "${sup_s}", premises_id: "${ps}", serial_start: 100000003000, serial_end: 100000006000, expected_supplier_version: "${sup_s_v2}" }
              as: DeviceSupplierRep
              as_user_id: "${sup_s}"
