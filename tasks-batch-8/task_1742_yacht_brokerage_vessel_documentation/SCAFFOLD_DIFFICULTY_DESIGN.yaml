  # =====================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: one_active_listing_per_vessel_window
        grounds:
          - validations[priority=9]
          - entities.ListingAgreement.fields.start_date
          - entities.ListingAgreement.fields.end_date
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          Interval semantics = point-in-time occupancy on the VESSEL resource:
          at any clock instant at most one ListingAgreement per vessel_id may
          be in {DRAFT, ACTIVE, SUSPENDED, UNDER_CONTRACT}; overlapping term
          windows are rejected at creation regardless of whether the clock
          currently falls inside both — adjacency IS permitted (end_date of
          old == start_date of new is a shared endpoint, occupancy is the
          state-set test, not geometric overlap), which is the adjacency
          semantic distinct from the abstract-recency rule of the sibling.
        test_recipe:
          setup:
            - "Vessel V; existing ListingAgreement L1 ACTIVE with window 2026-08-01..2026-12-01"
            - "Attempt L2 on same vessel with disjoint future window 2027-01-01..2027-06-01 while L1 still non-terminal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /yacht/brokerages"
              payload: { legal_name: "Overlap House", home_state_code: "FL", escrow_account_ref: "T-O", license_no: "FL-BRK-O", default_commission_tier_code: "STANDARD" }
              as: PlatformAdmin
              captures: { brkO: $.data.id }
            - call: "POST /yacht/agents"
              payload: { brokerage_id: "${brkO}", full_name: "LAO", license_no: "FL-AG-O1", split_pct_basis: 6000 }
              as: PlatformAdmin
              captures: { laO: $.data.id }
            - call: "POST /yacht/clients"
              payload: { kind: "SELLER", full_name: "SO", residency_state_code: "FL", tax_id_last4: "1201" }
              as: PlatformAdmin
              captures: { selO: $.data.id }
            - call: "POST /yacht/vessels"
              payload: { hin: "USOVER123456", make: "Sabre", model: "45", year_built: 2018, length_overall_ft: 45.0, documentation_mode: "USCG", uscg_official_no: "7778880", current_location_state_code: "FL" }
              as: PlatformAdmin
              captures: { vesO: $.data.id }
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkO}", listing_agent_id: "${laO}", seller_id: "${selO}", vessel_id: "${vesO}", agreement_type: "CENTRAL", list_price_cents: 600000000, start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laO}"
              captures: { lstO1: $.data.id }
            - call: "POST /yacht/listings/${lstO1}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${laO}"
          trigger:
            - call: "POST /yacht/listings"
              payload: { brokerage_id: "${brkO}", listing_agent_id: "${laO}", seller_id: "${selO}", vessel_id: "${vesO}", agreement_type: "OPEN", list_price_cents: 610000000, start_date: "2027-01-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z" }
              as: ListingAgent
              as_user_id: "${laO}"
              captures: { err_dup: $.data.error_id }
          assert:
            - "err_dup == ERR_DUPLICATE_RESOURCE"
            - "Even a geometrically DISJOINT future window is rejected — occupancy semantics is state-based (non-terminal listing exists), not interval-intersection"

      - name: abstract_of_title_recency_window
        grounds:
          - entities.DocumentationRecord.fields.issue_date
          - state_machines.TitleTransfer.DRAFT_to_EXECUTED
          - errors[ERR_INVALID_DEADLINE]
        distinguishing_aspect: |
          Interval semantics = rolling recency window on the ABSTRACT resource:
          an ABSTRACT DocumentationRecord is valid only when (closing_date -
          issue_date) <= 30 days — a sliding-window check where adjacency at
          exactly 30 days is inclusive-valid while 31 days is stale; distinct
          from the state-occupancy semantics of the listing-window instance.
        test_recipe:
          setup:
            - "USCG vessel; closing statement APPROVED; title transfer DRAFT"
            - "ABSTRACT filed with issue_date 2026-07-01; clock at 2026-08-01 => 31 days elapsed -> stale"
