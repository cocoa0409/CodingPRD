# =============================================================================
# Scaffold: task_1443_student_activities_honor_society
# National Honor Society Chapter Management
# =============================================================================

scenario: |
  Student Activities & Honor Society Management (National Honor Society chapter): club charter & advisor assignment, membership eligibility (GPA/service hours) & induction cycle, service hour logging & verification, officer election & meeting minutes, activity fund accounting & fundraiser approval, probation/dismissal for standards violation, national dues & chapter reporting, calendar conflict with athletics

domain_name: nhs-chapter
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation

  entity_topology: hybrid            # tree under Chapter + cross-cutting peer refs (Member <-> Election, Member <-> ProbationCase, Member <-> DuesPayment)
  state_machine_shape: branching     # probation cycles + election branch + induction cycle fork
  relationship_patterns:
    - one_to_many
    - many_to_many                  # Member <-> OfficerRole via ElectionVote
    - cross_aggregate               # AthleticsCalendarBlock references Member, Member references Chapter
  role_model: approval_chain        # Member -> Officer -> Advisor -> ActivitiesDirector; segregation_of_duties on funds
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Chapter
    parent: null
    common_fields: true
    fields:
      - { name: school_name, type: string, source: input, description: "School hosting the NHS chapter" }
      - { name: charter_number, type: string, source: input, description: "National NHS charter number; unique per chapter" }
      - { name: advisor_user_id, type: string, source: input, description: "X-User-ID of the faculty Advisor; chapter cannot go ACTIVE without one" }
      - { name: gpa_threshold_weighted, type: number, source: input, description: "Minimum weighted GPA for membership eligibility (e.g., 3.50)" }
      - { name: gpa_threshold_unweighted, type: number, source: input, description: "Minimum unweighted GPA for membership eligibility (e.g., 3.25)" }
      - { name: service_hours_annual_required, type: integer, source: input, description: "Annual verified service hours required to remain in good standing" }
      - { name: service_hours_per_semester_required, type: integer, source: input, description: "Per-semester verified service hours required to remain in good standing" }
      - { name: national_dues_cents_per_member, type: integer, source: input, description: "Annual national dues owed per active member, in cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | DISSOLVED" }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | PROBATIONARY | REVOKED — derived from dues arrears, member standing ratios, unresolved probations" }
      - { name: current_cycle_id, type: string, source: computed, description: "MembershipCycle id currently in NOMINATION or later, or null" }
      - { name: fund_balance_cents, type: integer, source: computed, description: "Ledger balance: sum of cleared FundLedgerEntry amounts" }
      - { name: dues_arrears_cents, type: integer, source: computed, description: "National dues owed but unpaid; computed from DuesPayment records vs expected" }
      - { name: active_member_count, type: integer, source: computed, description: "Members with status ACTIVE" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Member
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: student_id, type: string, source: input, description: "School-issued student identifier" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Student email" }
      - { name: grade_level, type: integer, source: input, description: "9 | 10 | 11 | 12" }
      - { name: weighted_gpa, type: number, source: input, description: "Weighted GPA on 5.0 scale, 2 decimal places" }
      - { name: unweighted_gpa, type: number, source: input, description: "Unweighted GPA on 4.0 scale, 2 decimal places" }
      - { name: status, type: enum, source: system, description: "PROSPECTIVE | CANDIDATE | ACTIVE | ON_PROBATION | DISMISSED | ALUMNUS" }
      - { name: inducted_cycle_id, type: string, source: system, description: "FK -> MembershipCycle.id; cycle in which member was inducted, or null" }
      - { name: verified_service_hours_current_year, type: number, source: computed, description: "Sum of VERIFIED ServiceHourEntry.hours in current academic year" }
      - { name: verified_service_hours_current_semester, type: number, source: computed, description: "Sum of VERIFIED ServiceHourEntry.hours in current semester" }
      - { name: probation_strikes, type: integer, source: computed, description: "Count of RESOLVED ProbationCase records with outcome=STANDARDS_VIOLATION_CONFIRMED" }
      - { name: is_officer, type: boolean, source: computed, description: "True if Member holds any OfficerRole in ACTIVE status" }
      - { name: good_standing, type: boolean, source: computed, description: "Derived: not DISMISSED, no unresolved ProbationCase in OPEN or APPEALED, dues current, service hours satisfied" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: MembershipCycle
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: cycle_label, type: string, source: input, description: "e.g., '2026-FALL' or '2026-SPRING'" }
      - { name: academic_year, type: string, source: input, description: "e.g., '2026-2027'" }
      - { name: semester, type: enum, source: input, description: "FALL | SPRING" }
      - { name: nomination_open_date, type: datetime, source: input, description: "ISO8601 date when faculty may nominate candidates" }
      - { name: nomination_close_date, type: datetime, source: input, description: "ISO8601 date after which nominations are closed" }
      - { name: induction_date, type: datetime, source: input, description: "ISO8601 date of the induction ceremony" }
      - { name: status, type: enum, source: system, description: "PLANNED | NOMINATION | REVIEW | INDUCTED | CLOSED | CANCELLED" }
      - { name: candidate_member_ids, type: array, source: computed, description: "Member ids whose cycle_application_id points at this cycle and whose Member.status == CANDIDATE" }
      - { name: inducted_count, type: integer, source: computed, description: "Count of Members with inducted_cycle_id == this cycle" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: CycleApplication
    parent: MembershipCycle
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; denormalized from cycle" }
      - { name: cycle_id, type: string, source: system, description: "FK -> MembershipCycle.id; owning cycle" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; applying student" }
      - { name: nominated_by_user_id, type: string, source: input, description: "X-User-ID of faculty Advisor who nominated" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | INDUCTED | WITHDRAWN" }
      - { name: eligibility_score, type: number, source: computed, description: "Weighted eligibility score computed at UNDER_REVIEW; see calculation eligibility_score" }
      - { name: rejection_reason, type: string, source: input, description: "Populated when status transitions to REJECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ServiceHourEntry
    parent: Member
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; denormalized from member" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; hour-earning student" }
      - { name: activity_name, type: string, source: input, description: "Short description of service activity" }
      - { name: service_date, type: datetime, source: input, description: "ISO8601 date on which service occurred" }
      - { name: hours, type: number, source: input, description: "Hours worked, in 0.25 increments, > 0 and <= 12 per entry" }
      - { name: organization, type: string, source: input, description: "Host organization name" }
      - { name: supervisor_email, type: string, source: input, description: "External supervisor contact" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | VERIFIED | REJECTED | VOID" }
      - { name: verified_by_user_id, type: string, source: system, description: "Advisor X-User-ID who verified; null until VERIFIED" }
      - { name: rejection_reason, type: string, source: input, description: "Populated when REJECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: OfficerElection
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: cycle_id, type: string, source: input, description: "FK -> MembershipCycle.id; election tied to a cycle" }
      - { name: office, type: enum, source: input, description: "PRESIDENT | VICE_PRESIDENT | SECRETARY | TREASURER | HISTORIAN" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | TALLIED | CERTIFIED | VOIDED" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp when status became OPEN" }
      - { name: tallied_at, type: datetime, source: system, description: "Timestamp when status became TALLIED" }
      - { name: winner_member_id, type: string, source: computed, description: "Member.id with most valid votes at TALLY; null if tie" }
      - { name: runoff_required, type: boolean, source: computed, description: "True if top two candidates tie at tally" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ElectionVote
    parent: OfficerElection
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; denormalized from election" }
      - { name: election_id, type: string, source: system, description: "FK -> OfficerElection.id; owning election" }
      - { name: voter_member_id, type: string, source: input, description: "FK -> Member.id; member casting the vote" }
      - { name: candidate_member_id, type: string, source: input, description: "FK -> Member.id; member being voted for" }
      - { name: cast_at, type: datetime, source: system, description: "Server timestamp at vote creation" }
      - { name: status, type: enum, source: system, description: "CAST | VOIDED" }

  - name: OfficerRole
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: election_id, type: string, source: system, description: "FK -> OfficerElection.id; election that produced this role" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; elected officer" }
      - { name: office, type: enum, source: system, description: "PRESIDENT | VICE_PRESIDENT | SECRETARY | TREASURER | HISTORIAN (denormalized from election)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESIGNED | REMOVED" }
      - { name: started_at, type: datetime, source: system, description: "Timestamp when role became ACTIVE" }
      - { name: ended_at, type: datetime, source: system, description: "Timestamp when role left ACTIVE, or null" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: MeetingMinutes
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: meeting_date, type: datetime, source: input, description: "ISO8601 datetime of meeting" }
      - { name: called_by_officer_id, type: string, source: input, description: "FK -> OfficerRole.id; officer calling the meeting" }
      - { name: attendees_member_ids, type: array, source: input, description: "Member ids in attendance" }
      - { name: agenda, type: string, source: input, description: "Agenda text" }
      - { name: notes, type: string, source: input, description: "Minutes body text" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | AMENDED" }
      - { name: submitted_by_officer_id, type: string, source: system, description: "FK -> OfficerRole.id; secretary who submitted (must be a SECRETARY OfficerRole)" }
      - { name: approved_by_user_id, type: string, source: system, description: "Advisor X-User-ID; null until APPROVED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FundraiserRequest
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: title, type: string, source: input, description: "Fundraiser title" }
      - { name: description, type: string, source: input, description: "Fundraiser purpose" }
      - { name: goal_amount_cents, type: integer, source: input, description: "Target net proceeds, in cents, >= 100" }
      - { name: upfront_cost_cents, type: integer, source: input, description: "Upfront cost the chapter must front, in cents, >= 0" }
      - { name: requested_by_officer_id, type: string, source: input, description: "FK -> OfficerRole.id; sponsoring officer" }
      - { name: scheduled_date, type: datetime, source: input, description: "ISO8601 date of the fundraiser" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ADVISOR_APPROVED | DIRECTOR_APPROVED | REJECTED | EXECUTED | CLOSED" }
      - { name: actual_gross_cents, type: integer, source: input, description: "Actual gross receipts recorded at EXECUTED" }
      - { name: actual_net_cents, type: integer, source: computed, description: "actual_gross_cents - upfront_cost_cents, computed at EXECUTED" }
      - { name: advisor_approved_by_user_id, type: string, source: system, description: "Advisor X-User-ID; set on ADVISOR_APPROVED" }
      - { name: director_approved_by_user_id, type: string, source: system, description: "ActivitiesDirector X-User-ID; set on DIRECTOR_APPROVED" }
      - { name: segregation_of_duties_enforced, type: boolean, source: computed, description: "True if advisor_approved_by_user_id != director_approved_by_user_id (invariant)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: FundLedgerEntry
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: fundraiser_id, type: string, source: input, description: "FK -> FundraiserRequest.id; null for non-fundraiser entries" }
      - { name: entry_type, type: enum, source: input, description: "FUNDRAISER_DEPOSIT | UPFRONT_COST_DISBURSEMENT | DUES_REMITTANCE | NATIONAL_DUES_PAYMENT | ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount in cents; positive = credit to chapter" }
      - { name: entry_date, type: datetime, source: input, description: "ISO8601 date of the entry" }
      - { name: description, type: string, source: input, description: "Free-text memo" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | VOIDED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: DuesPayment
    parent: Member
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; denormalized from member" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; paying member" }
      - { name: academic_year, type: string, source: input, description: "e.g., '2026-2027'" }
      - { name: amount_cents, type: integer, source: input, description: "Amount paid, in cents, > 0" }
      - { name: paid_at, type: datetime, source: input, description: "ISO8601 datetime of payment" }
      - { name: status, type: enum, source: system, description: "PENDING_REMITTANCE | REMITTED | REFUNDED | VOID" }
      - { name: remitted_at, type: datetime, source: system, description: "Timestamp when status became REMITTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ProbationCase
    parent: Member
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; denormalized from member" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; member under review" }
      - { name: opened_by_user_id, type: string, source: input, description: "Advisor X-User-ID opening the case" }
      - { name: reason_code, type: enum, source: input, description: "GPA_BELOW_THRESHOLD | SERVICE_HOURS_SHORTFALL | CONDUCT_VIOLATION | MISSED_MEETINGS" }
      - { name: evidence_text, type: string, source: input, description: "Narrative evidence" }
      - { name: opened_at, type: datetime, source: system, description: "Timestamp when case opened" }
      - { name: status, type: enum, source: system, description: "OPEN | APPEALED | RESOLVED | DISMISSED" }
      - { name: outcome, type: enum, source: system, description: "STANDARDS_VIOLATION_CONFIRMED | STANDARDS_VIOLATION_NOT_CONFIRMED | null" }
      - { name: probation_end_date, type: datetime, source: input, description: "ISO8601 end of probationary window when outcome is CONFIRMED" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Advisor X-User-ID; null until RESOLVED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: AthleticsCalendarBlock
    parent: Chapter
    common_fields: true
    fields:
      - { name: chapter_id, type: string, source: system, description: "FK -> Chapter.id; owning chapter" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; athlete student" }
      - { name: block_start, type: datetime, source: input, description: "ISO8601 start of athletic commitment" }
      - { name: block_end, type: datetime, source: input, description: "ISO8601 end of athletic commitment; must be > block_start" }
      - { name: sport, type: string, source: input, description: "Sport name" }
      - { name: priority, type: enum, source: input, description: "PRACTICE | GAME | TOURNAMENT — TOURNAMENT blocks override GAME which overrides PRACTICE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# Table 1.5: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: fundraiser-approve-stale-chapter
    parent_entity: Chapter
    write_endpoint: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/advisor-approve"
    occ_field: "expected_chapter_version"
    description: |
      Approving a FundraiserRequest against a Chapter whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just recorded a FundLedgerEntry (which legitimately
      mutates Chapter.fund_balance_cents under the fund accounting rules) and
      the approving advisor's view of the chapter's fiscal posture is therefore
      stale.
    error_id: ERR_STALE_CHAPTER_VERSION
    http_status: 412

  - rule_id: member-dismiss-stale-member
    parent_entity: Member
    write_endpoint: "POST /chapters/{chapterId}/members/{memberId}/dismiss"
    occ_field: "expected_member_version"
    description: |
      Dismissing a Member whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just resolved a ProbationCase for the member (which legitimately mutates
      Member.probation_strikes and Member.good_standing under the probation rules)
      and the dismissing advisor's view of the member's standing is therefore
      stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: cycle-induct-stale-cycle
    parent_entity: MembershipCycle
    write_endpoint: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/induct"
    occ_field: "expected_cycle_version"
    description: |
      Inducting a MembershipCycle whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just approved or rejected a CycleApplication under the cycle (which
      legitimately mutates MembershipCycle.candidate_member_ids under the
      cycle review rules) and the inducting advisor's view of the candidate
      pool is therefore stale.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Chapter
    initial_state: DRAFT
    terminal_states: [DISSOLVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /chapters/{chapterId}/activate"
        actor: ActivitiesDirector
        preconditions:
          - "advisor_user_id is non-empty"
          - "gpa_threshold_weighted >= gpa_threshold_unweighted"
          - "service_hours_annual_required >= 2 * service_hours_per_semester_required"
        side_effects:
          - "standing = GOOD_STANDING"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /chapters/{chapterId}/suspend"
        actor: ActivitiesDirector
        preconditions: []
        side_effects:
          - "All Member.status in {ACTIVE, ON_PROBATION} are frozen: no new ServiceHourEntry, FundraiserRequest, OfficerElection, CycleApplication may be created"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /chapters/{chapterId}/reinstate"
        actor: ActivitiesDirector
        preconditions:
          - "All ProbationCase with status == OPEN under the chapter must be RESOLVED"
        side_effects:
          - "Freeze on child creation lifts"
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /chapters/{chapterId}/dissolve"
        actor: ActivitiesDirector
        preconditions:
          - "fund_balance_cents == 0"
          - "All Member.status in {ALUMNUS, DISMISSED}"
          - "No OfficerElection in {DRAFT, OPEN, TALLIED}"
        side_effects:
          - "All OfficerRole.status -> REMOVED"
          - "All FundraiserRequest in {DRAFT, SUBMITTED, ADVISOR_APPROVED, DIRECTOR_APPROVED} -> REJECTED"

  - entity: MembershipCycle
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: NOMINATION
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/open-nominations"
        actor: Advisor
        preconditions:
          - "Chapter.status == ACTIVE"
          - "Chapter.current_cycle_id is null or belongs to a CLOSED/CANCELLED cycle"
          - "Current clock >= nomination_open_date"
        side_effects:
          - "Chapter.current_cycle_id = this cycle id"
      - from: NOMINATION
        to: REVIEW
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/close-nominations"
        actor: Advisor
        preconditions:
          - "Current clock >= nomination_close_date"
          - "candidate_member_ids is non-empty"
        side_effects:
          - "All CycleApplication under cycle in SUBMITTED -> UNDER_REVIEW"
          - "Each UNDER_REVIEW CycleApplication computes eligibility_score per calculation eligibility_score"
      - from: REVIEW
        to: INDUCTED
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/induct"
        actor: Advisor
        preconditions:
          - "Current clock >= induction_date"
          - "Every CycleApplication under cycle in {APPROVED, REJECTED, INDUCTED, WITHDRAWN} (none may remain UNDER_REVIEW)"
          - "OCC: expected_cycle_version matches current MembershipCycle.version"
        side_effects:
          - "Every CycleApplication under cycle with status == APPROVED -> INDUCTED"
          - "Every such application's Member.status: CANDIDATE -> ACTIVE"
          - "Every such Member.inducted_cycle_id = this cycle id"
          - "Chapter.active_member_count recomputed"
      - from: INDUCTED
        to: CLOSED
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/close"
        actor: Advisor
        preconditions:
          - "All OfficerElection rows tied to cycle_id are in {CERTIFIED, VOIDED}"
        side_effects:
          - "Chapter.current_cycle_id cleared if equal to this cycle id"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/cancel"
        actor: Advisor
        preconditions: []
        side_effects:
          - "Chapter.current_cycle_id cleared if equal to this cycle id"

  - entity: CycleApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, INDUCTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system cascade on cycle close-nominations"
        actor: system
        preconditions: []
        side_effects:
          - "eligibility_score computed per calculation eligibility_score"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/approve"
        actor: Advisor
        preconditions:
          - "eligibility_score >= ELIGIBILITY_SCORE_THRESHOLD"
          - "Member.good_standing == true"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/reject"
        actor: Advisor
        preconditions:
          - "rejection_reason must be provided"
        side_effects:
          - "Member.status: CANDIDATE -> PROSPECTIVE (returns to pool for next cycle)"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/withdraw"
        actor: Member
        preconditions:
          - "Caller is the applicant member"
        side_effects:
          - "Member.status: CANDIDATE -> PROSPECTIVE"
      - from: APPROVED
        to: INDUCTED
        trigger: "system cascade on cycle induct"
        actor: system
        preconditions: []
        side_effects:
          - "Member.status: CANDIDATE -> ACTIVE"
          - "Member.inducted_cycle_id set"

  - entity: ServiceHourEntry
    initial_state: PENDING_VERIFICATION
    terminal_states: [VERIFIED, REJECTED, VOID]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/verify"
        actor: Advisor
        preconditions:
          - "Member.chapter.status == ACTIVE"
          - "Member.status in {ACTIVE, ON_PROBATION}"
          - "hours > 0 AND hours <= 12 AND (hours * 4) is an integer"
          - "service_date <= current clock"
        side_effects:
          - "verified_by_user_id set to caller X-User-ID"
          - "Member.verified_service_hours_current_year recomputed"
          - "Member.verified_service_hours_current_semester recomputed"
          - "Member.good_standing recomputed"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/reject"
        actor: Advisor
        preconditions:
          - "rejection_reason must be provided"
        side_effects:
          - "Member.verified_service_hours_current_year recomputed (no change since entry was never VERIFIED)"
          - "Member.good_standing recomputed"
      - from: PENDING_VERIFICATION
        to: VOID
        trigger: "POST /chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/void"
        actor: Advisor
        preconditions: []
        side_effects: []
      - from: VERIFIED
        to: VOID
        trigger: "POST /chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/void"
        actor: Advisor
        preconditions:
          - "Member.chapter.standing != REVOKED"
        side_effects:
          - "Member.verified_service_hours_current_year recomputed (entry no longer counts)"
          - "Member.verified_service_hours_current_semester recomputed"
          - "Member.good_standing recomputed"

  - entity: OfficerElection
    initial_state: DRAFT
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /chapters/{chapterId}/elections/{electionId}/open"
        actor: Advisor
        preconditions:
          - "Chapter.status == ACTIVE"
          - "No other OfficerElection for same chapter in {OPEN, TALLIED}"
          - "cycle_id references a MembershipCycle whose status in {REVIEW, INDUCTED}"
        side_effects:
          - "opened_at stamped"
      - from: OPEN
        to: TALLIED
        trigger: "POST /chapters/{chapterId}/elections/{electionId}/tally"
        actor: Advisor
        preconditions:
          - "At least one ElectionVote with status == CAST"
        side_effects:
          - "winner_member_id computed per calculation election_tally"
          - "runoff_required computed"
          - "tallied_at stamped"
      - from: TALLIED
        to: CERTIFIED
        trigger: "POST /chapters/{chapterId}/elections/{electionId}/certify"
        actor: Advisor
        preconditions:
          - "runoff_required == false"
          - "winner_member_id is non-null"
        side_effects:
          - "An OfficerRole is created with member_id = winner_member_id, office = election.office, status = ACTIVE"
          - "Member.is_officer recomputed for winner"
      - from: TALLIED
        to: VOIDED
        trigger: "POST /chapters/{chapterId}/elections/{electionId}/void"
        actor: Advisor
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "POST /chapters/{chapterId}/elections/{electionId}/void"
        actor: Advisor
        preconditions: []
        side_effects: []
      - from: OPEN
        to: VOIDED
        trigger: "POST /chapters/{chapterId}/elections/{electionId}/void"
        actor: Advisor
        preconditions: []
        side_effects:
          - "All ElectionVote under election in CAST -> VOIDED"

  - entity: OfficerRole
    initial_state: ACTIVE
    terminal_states: [RESIGNED, REMOVED]
    transitions:
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /chapters/{chapterId}/officer-roles/{roleId}/resign"
        actor: Officer
        preconditions:
          - "Caller X-User-ID corresponds to OfficerRole.member_id"
        side_effects:
          - "ended_at stamped"
          - "Member.is_officer recomputed"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /chapters/{chapterId}/officer-roles/{roleId}/remove"
        actor: Advisor
        preconditions:
          - "Member.status not in {ACTIVE}"
        side_effects:
          - "ended_at stamped"
          - "Member.is_officer recomputed"

  - entity: MeetingMinutes
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /chapters/{chapterId}/meeting-minutes/{minutesId}/submit"
        actor: Officer
        preconditions:
          - "Caller holds OfficerRole with office == SECRETARY and status == ACTIVE"
          - "called_by_officer_id has status ACTIVE"
        side_effects:
          - "submitted_by_officer_id set"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /chapters/{chapterId}/meeting-minutes/{minutesId}/approve"
        actor: Advisor
        preconditions: []
        side_effects:
          - "approved_by_user_id set to caller X-User-ID"
      - from: APPROVED
        to: AMENDED
        trigger: "POST /chapters/{chapterId}/meeting-minutes/{minutesId}/amend"
        actor: Officer
        preconditions:
          - "Caller holds OfficerRole with office == SECRETARY and status == ACTIVE"
          - "notes must differ from prior"
        side_effects:
          - "status returns to SUBMITTED after amendment body is saved (cycles)"
      - from: AMENDED
        to: SUBMITTED
        trigger: "system auto after amend"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FundraiserRequest
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/submit"
        actor: Officer
        preconditions:
          - "requested_by_officer_id has status ACTIVE"
          - "Chapter.status == ACTIVE"
          - "upfront_cost_cents <= Chapter.fund_balance_cents (chapter must be able to front the cost)"
        side_effects: []
      - from: SUBMITTED
        to: ADVISOR_APPROVED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/advisor-approve"
        actor: Advisor
        preconditions:
          - "OCC: expected_chapter_version matches current Chapter.version"
        side_effects:
          - "advisor_approved_by_user_id set to caller X-User-ID"
      - from: ADVISOR_APPROVED
        to: DIRECTOR_APPROVED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/director-approve"
        actor: ActivitiesDirector
        preconditions:
          - "caller X-User-ID != advisor_approved_by_user_id (segregation of duties)"
        side_effects:
          - "director_approved_by_user_id set to caller X-User-ID"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/reject"
        actor: Advisor
        preconditions: []
        side_effects: []
      - from: ADVISOR_APPROVED
        to: REJECTED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/reject"
        actor: ActivitiesDirector
        preconditions: []
        side_effects: []
      - from: DIRECTOR_APPROVED
        to: EXECUTED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/execute"
        actor: Officer
        preconditions:
          - "Current clock >= scheduled_date"
          - "actual_gross_cents provided"
        side_effects:
          - "actual_net_cents computed"
          - "A FundLedgerEntry is created with entry_type=FUNDRAISER_DEPOSIT, amount_cents=actual_net_cents, status=PENDING"
          - "If upfront_cost_cents > 0: a second FundLedgerEntry is created with entry_type=UPFRONT_COST_DISBURSEMENT, amount_cents=-upfront_cost_cents, status=CLEARED"
      - from: EXECUTED
        to: CLOSED
        trigger: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/close"
        actor: Advisor
        preconditions:
          - "FundLedgerEntry with fundraiser_id == this.id and entry_type == FUNDRAISER_DEPOSIT has status == CLEARED"
        side_effects:
          - "Chapter.fund_balance_cents recomputed"

  - entity: FundLedgerEntry
    initial_state: PENDING
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /chapters/{chapterId}/fund-ledger-entries/{entryId}/clear"
        actor: Advisor
        preconditions:
          - "Chapter.status == ACTIVE"
        side_effects:
          - "Chapter.fund_balance_cents recomputed"
          - "If entry_type == NATIONAL_DUES_PAYMENT: Chapter.dues_arrears_cents recomputed"
      - from: PENDING
        to: VOIDED
        trigger: "POST /chapters/{chapterId}/fund-ledger-entries/{entryId}/void"
        actor: Advisor
        preconditions: []
        side_effects:
          - "Chapter.fund_balance_cents recomputed"

  - entity: DuesPayment
    initial_state: PENDING_REMITTANCE
    terminal_states: [REMITTED, REFUNDED, VOID]
    transitions:
      - from: PENDING_REMITTANCE
        to: REMITTED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/dues-payments/{paymentId}/remit"
        actor: Advisor
        preconditions:
          - "Member.status in {ACTIVE, ON_PROBATION}"
          - "Member.chapter.fund_balance_cents >= amount_cents"
        side_effects:
          - "remitted_at stamped"
          - "A FundLedgerEntry is created with entry_type=NATIONAL_DUES_PAYMENT, amount_cents=-amount_cents, status=CLEARED"
          - "Chapter.fund_balance_cents recomputed"
          - "Chapter.dues_arrears_cents recomputed"
      - from: PENDING_REMITTANCE
        to: VOID
        trigger: "POST /chapters/{chapterId}/members/{memberId}/dues-payments/{paymentId}/void"
        actor: Advisor
        preconditions: []
        side_effects: []
      - from: REMITTED
        to: REFUNDED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/dues-payments/{paymentId}/refund"
        actor: Advisor
        preconditions:
          - "Member.status == DISMISSED"
        side_effects:
          - "A FundLedgerEntry is created with entry_type=ADJUSTMENT, amount_cents=+amount_cents, status=CLEARED"
          - "Chapter.fund_balance_cents recomputed"
          - "Chapter.dues_arrears_cents recomputed"

  - entity: ProbationCase
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: APPEALED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/probation-cases/{caseId}/appeal"
        actor: Member
        preconditions:
          - "Caller X-User-ID corresponds to Member.id"
          - "Current clock < opened_at + 14 days"
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/probation-cases/{caseId}/resolve"
        actor: Advisor
        preconditions:
          - "outcome provided"
          - "If outcome == STANDARDS_VIOLATION_CONFIRMED: probation_end_date > current clock"
        side_effects:
          - "resolved_by_user_id set"
          - "If outcome == STANDARDS_VIOLATION_CONFIRMED: Member.status -> ON_PROBATION; Member.probation_strikes += 1"
          - "If outcome == STANDARDS_VIOLATION_CONFIRMED AND Member.probation_strikes >= 2: cascade Member.status -> DISMISSED (see Member state machine)"
          - "Member.good_standing recomputed"
      - from: APPEALED
        to: RESOLVED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/probation-cases/{caseId}/resolve"
        actor: Advisor
        preconditions:
          - "outcome provided"
        side_effects:
          - "Same side effects as OPEN -> RESOLVED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/probation-cases/{caseId}/dismiss-case"
        actor: Advisor
        preconditions: []
        side_effects:
          - "outcome = STANDARDS_VIOLATION_NOT_CONFIRMED"
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/probation-cases/{caseId}/dismiss-case"
        actor: Advisor
        preconditions: []
        side_effects:
          - "outcome = STANDARDS_VIOLATION_NOT_CONFIRMED"

  - entity: Member
    initial_state: PROSPECTIVE
    terminal_states: [DISMISSED, ALUMNUS]
    transitions:
      - from: PROSPECTIVE
        to: CANDIDATE
        trigger: "POST /chapters/{chapterId}/members/{memberId}/nominate"
        actor: Advisor
        preconditions:
          - "Chapter.status == ACTIVE"
          - "Chapter.current_cycle_id points at a cycle with status == NOMINATION"
          - "weighted_gpa >= Chapter.gpa_threshold_weighted OR unweighted_gpa >= Chapter.gpa_threshold_unweighted"
          - "No AthleticsCalendarBlock with status == ACTIVE overlapping the cycle induction_date"
        side_effects:
          - "A CycleApplication is created under the current cycle with status=SUBMITTED"
      - from: CANDIDATE
        to: ACTIVE
        trigger: "system cascade on cycle induct"
        actor: system
        preconditions: []
        side_effects:
          - "inducted_cycle_id set"
      - from: ACTIVE
        to: ON_PROBATION
        trigger: "system cascade on ProbationCase RESOLVED with outcome=STANDARDS_VIOLATION_CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "probation_strikes += 1"
          - "good_standing recomputed"
      - from: ON_PROBATION
        to: ACTIVE
        trigger: "POST /chapters/{chapterId}/members/{memberId}/reinstate"
        actor: Advisor
        preconditions:
          - "No ProbationCase with status in {OPEN, APPEALED} for this member"
          - "Current clock > probation_end_date of all RESOLVED cases with outcome=CONFIRMED"
        side_effects:
          - "good_standing recomputed"
      - from: ACTIVE
        to: DISMISSED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/dismiss"
        actor: Advisor
        preconditions:
          - "OCC: expected_member_version matches current Member.version"
          - "Member.probation_strikes >= 2 OR explicit override reason"
        side_effects:
          - "All OfficerRole under member in ACTIVE -> REMOVED"
          - "All ServiceHourEntry under member in PENDING_VERIFICATION -> VOID"
          - "All ElectionVote under member as voter in CAST -> VOIDED"
          - "Chapter.active_member_count recomputed"
      - from: ON_PROBATION
        to: DISMISSED
        trigger: "POST /chapters/{chapterId}/members/{memberId}/dismiss"
        actor: Advisor
        preconditions:
          - "OCC: expected_member_version matches current Member.version"
        side_effects:
          - "Same as ACTIVE -> DISMISSED"
      - from: ACTIVE
        to: ALUMNUS
        trigger: "POST /chapters/{chapterId}/members/{memberId}/graduate"
        actor: Advisor
        preconditions:
          - "grade_level == 12"
        side_effects:
          - "All OfficerRole under member in ACTIVE -> RESIGNED"
          - "Chapter.active_member_count recomputed"
      - from: ON_PROBATION
        to: ALUMNUS
        trigger: "POST /chapters/{chapterId}/members/{memberId}/graduate"
        actor: Advisor
        preconditions:
          - "grade_level == 12"
        side_effects:
          - "All OfficerRole under member in ACTIVE -> RESIGNED"
          - "Chapter.active_member_count recomputed"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_score
    trigger: "CycleApplication transitions SUBMITTED -> UNDER_REVIEW"
    algorithm: weighted_scoring
    formula: |
      # Five-component weighted score; all sub-scores normalized to [0, 100].
      # Pinned evaluation order: compute each sub-score first, then weighted sum.
      gpa_component = clamp(
        100 * (Member.weighted_gpa / 5.0),
        0, 100
      ) * WEIGHT_GPA
      service_component = clamp(
        100 * (Member.verified_service_hours_current_year / (2 * Chapter.service_hours_annual_required)),
        0, 100
      ) * WEIGHT_SERVICE
      leadership_component = (
        50 if Member.is_officer else 0
      ) * WEIGHT_LEADERSHIP
      probation_penalty = (
        -20 * Member.probation_strikes
      ) * WEIGHT_PROBATION
      athletics_conflict_penalty = (
        -10 if exists ACTIVE AthleticsCalendarBlock overlapping cycle induction_date else 0
      ) * WEIGHT_ATHLETICS
      score_raw = gpa_component + service_component + leadership_component + probation_penalty + athletics_conflict_penalty
      eligibility_score = round_half_up(clamp(score_raw, 0, 100), 2)
    constants:
      WEIGHT_GPA: 0.40
      WEIGHT_SERVICE: 0.30
      WEIGHT_LEADERSHIP: 0.15
      WEIGHT_PROBATION: 0.10
      WEIGHT_ATHLETICS: 0.05
      ELIGIBILITY_SCORE_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up"
    input_set: "CycleApplication with status transitioning to UNDER_REVIEW under a MembershipCycle; reads Member (GPA, service hours, officer status, probation strikes) and AthleticsCalendarBlock"

  - name: service_hours_compliance
    trigger: "Member.verified_service_hours_current_year or verified_service_hours_current_semester changes; also recomputed by Advisor GET /chapters/{id}/members/{id}/standing"
    algorithm: threshold
    formula: |
      # Two variants pinned; result differs when member has uneven semester distribution.
      # Variant A: annual_cumulative
      annual_ok = Member.verified_service_hours_current_year >= Chapter.service_hours_annual_required
      # Variant B: per_semester_strict
      per_semester_ok = (
        Member.verified_service_hours_current_semester >= Chapter.service_hours_per_semester_required
        AND Member.verified_service_hours_current_year >= Chapter.service_hours_annual_required
      )
      # The system uses the variant indicated by the calculation context:
      # - Variant A is the "good standing" rule for DuesPayment remittance and FundraiserRequest submission.
      # - Variant B is the stricter "induction eligibility" rule used in CycleApplication review.
      # Both produce a boolean; they differ when e.g. annual=20, semester=2, annual_required=15, per_semester_required=6.
    variants:
      - name: annual_cumulative
        when: "Determining Member.good_standing for fund-raising and dues-remittance purposes"
        difference: "Only the annual total is compared against the annual threshold"
      - name: per_semester_strict
        when: "Determining induction eligibility at CycleApplication review"
        difference: "Adds a per-semester floor; a member can pass Variant A but fail Variant B"
    input_set: "Member + Chapter thresholds"
    precision: "2 decimal places, round_half_up"

  - name: fund_balance_rollup
    trigger: "FundLedgerEntry created or transitions status; Chapter.fund_balance_cents recomputed"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: round each entry to integer cents FIRST (entries are
      # stored as integer cents already), THEN sum; do not sum fractional values
      # and round once at the end.
      fund_balance_cents = sum(
        entry.amount_cents
        for entry in FundLedgerEntry
        where entry.chapter_id == Chapter.id AND entry.status == CLEARED
      )
      # PENDING entries are EXCLUDED from fund_balance_cents.
    input_set: "FundLedgerEntry under Chapter with status == CLEARED"
    precision: "integer cents"

  - name: dues_arrears_rollup
    trigger: "DuesPayment status change; Member induction; Chapter.dues_arrears_cents recomputed"
    algorithm: aggregation
    formula: |
      # Circular-looking dependency pinned: dues_arrears uses active_member_count
      # as of the END of the current day; active_member_count is computed BEFORE
      # dues_arrears in the recompute pipeline.
      expected_total_cents = Chapter.national_dues_cents_per_member * Chapter.active_member_count
      remitted_total_cents = sum(
        p.amount_cents
        for p in DuesPayment
        where p.chapter_id == Chapter.id
          AND p.academic_year == current_academic_year
          AND p.status == REMITTED
      )
      dues_arrears_cents = max(expected_total_cents - remitted_total_cents, 0)
    input_set: "DuesPayment under Chapter for current academic year, status == REMITTED; Member count of status == ACTIVE"
    precision: "integer cents"

  - name: election_tally
    trigger: "OfficerElection transitions OPEN -> TALLIED"
    algorithm: aggregation
    formula: |
      # Tally CAST votes per candidate. Tie-break rules pinned:
      # 1) Highest vote count wins.
      # 2) If two or more candidates tie at the top, runoff_required = true and winner_member_id = null.
      # 3) created_at is NOT used to break ties — a tie is a tie; the system requires a runoff.
      votes_per_candidate = count(ElectionVote where election_id == this.id AND status == CAST group by candidate_member_id)
      top_count = max(votes_per_candidate.values()) if votes_per_candidate else 0
      top_candidates = [c for c, n in votes_per_candidate.items() if n == top_count]
      if len(top_candidates) == 1:
        winner_member_id = top_candidates[0]
        runoff_required = false
      else:
        winner_member_id = null
        runoff_required = true
    input_set: "ElectionVote under this OfficerElection with status == CAST"
    precision: "integer counts"

  - name: athletics_conflict_overlap
    trigger: "Member nomination; CycleApplication review; OfficerElection scheduling"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics pinned: [block_start, block_end).
      # Two intervals A and B conflict iff A.start < B.end AND B.start < A.end.
      # Adjacency (A.end == B.start) is NOT a conflict.
      # Priority ordering: TOURNAMENT blocks override GAME which override PRACTICE.
      # When checking "does this member have an athletics conflict with date D":
      #   conflicts = [b for b in AthleticsCalendarBlock
      #                where b.member_id == Member.id AND b.status == ACTIVE
      #                  AND b.block_start <= D AND D < b.block_end]
      #   if conflicts is non-empty: conflict exists; the highest-priority conflict governs.
    input_set: "AthleticsCalendarBlock under Member with status == ACTIVE"
    precision: "ISO8601 datetime"

  - name: chapter_standing
    trigger: "Chapter fields recompute: dues_arrears, member standing, open probations"
    algorithm: threshold
    formula: |
      if Chapter.dues_arrears_cents > 30 * Chapter.national_dues_cents_per_member:
        Chapter.standing = REVOKED
      else if Chapter.dues_arrears_cents > 0:
        Chapter.standing = PROBATIONARY
      else:
        active_members = count(Member where chapter_id == Chapter.id AND status == ACTIVE)
        on_probation_members = count(Member where chapter_id == Chapter.id AND status == ON_PROBATION)
        if active_members > 0 AND on_probation_members * 2 > active_members:
          Chapter.standing = PROBATIONARY
        else:
          Chapter.standing = GOOD_STANDING
    input_set: "Chapter + Member standing aggregation"
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and one of the declared roles; X-User-ID header is present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated resource ids (chapter, cycle, application, member, entry, election, role, minutes, fundraiser, ledger entry, payment, case, block) all exist and are nested correctly"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Chapter-level freeze: when Chapter.status == SUSPENDED or DISSOLVED, mutations on child resources are blocked"
    error_id: ERR_CHAPTER_FROZEN
    http_status: 409
    applies_to: "All POST/PATCH endpoints nested under /chapters/{chapterId}/..."

  - priority: 5
    category: state
    check: "Resource-specific state machine preconditions (e.g., CycleApplication must be UNDER_REVIEW to approve; ServiceHourEntry must be PENDING_VERIFICATION to verify)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All action endpoints (transitions)"

  - priority: 6
    category: business_safety
    check: "Athletics conflict: an operation that would schedule or commit a member whose ACTIVE AthleticsCalendarBlock overlaps the relevant date is rejected"
    error_id: ERR_ATHLETICS_CONFLICT
    http_status: 409
    applies_to: "Member nominate, CycleApplication approve, OfficerElection open"

  - priority: 7
    category: business_constraint
    check: "Segregation of duties: ActivitiesDirector approving a FundraiserRequest must not be the same X-User-ID as the Advisor who approved it"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/director-approve"

  - priority: 8
    category: business_constraint
    check: "Eligibility: Member being nominated must satisfy Chapter GPA threshold (weighted or unweighted)"
    error_id: ERR_GPA_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/members/{memberId}/nominate"

  - priority: 9
    category: business_constraint
    check: "Eligibility: CycleApplication may only be APPROVED when eligibility_score >= ELIGIBILITY_SCORE_THRESHOLD AND Member.good_standing == true"
    error_id: ERR_ELIGIBILITY_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/approve"

  - priority: 10
    category: business_constraint
    check: "ServiceHourEntry.hours must be in (0, 12] and an exact multiple of 0.25"
    error_id: ERR_INVALID_SERVICE_HOURS
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/members/{memberId}/service-hour-entries, POST .../verify"

  - priority: 11
    category: business_constraint
    check: "Induction cycle discipline: only one MembershipCycle per chapter may be in {PLANNED, NOMINATION, REVIEW, INDUCTED} at a time"
    error_id: ERR_ACTIVE_CYCLE_EXISTS
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/membership-cycles"

  - priority: 12
    category: business_temporal
    check: "Cycle dates: nomination_open_date < nomination_close_date < induction_date; cycle transitions honor the current logical clock"
    error_id: ERR_INVALID_CYCLE_DATE
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/membership-cycles, open-nominations, close-nominations, induct"

  - priority: 13
    category: business_fiscal
    check: "Chapter has sufficient fund_balance_cents to front FundraiserRequest.upfront_cost_cents at SUBMITTED"
    error_id: ERR_INSUFFICIENT_CHAPTER_FUNDS
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/submit"

  - priority: 14
    category: business_fiscal
    check: "Chapter has sufficient fund_balance_cents to remit a DuesPayment"
    error_id: ERR_INSUFFICIENT_FUNDS_FOR_REMITTANCE
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/members/{memberId}/dues-payments/{paymentId}/remit"

  - priority: 15
    category: business_referential
    check: "Officer election singularity: at most one OfficerElection per chapter may be in {OPEN, TALLIED} at a time"
    error_id: ERR_ELECTION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/elections/{electionId}/open"

  - priority: 16
    category: business_referential
    check: "Officer role occupancy: at most one ACTIVE OfficerRole per (chapter, office)"
    error_id: ERR_OFFICE_ALREADY_OCCUPIED
    http_status: 409
    applies_to: "OfficerElection certify (creates OfficerRole)"

  - priority: 17
    category: business_constraint
    check: "Service hour entry's service_date must not be in the future relative to the logical clock"
    error_id: ERR_FUTURE_SERVICE_DATE
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/members/{memberId}/service-hour-entries"

  - priority: 18
    category: business_temporal
    check: "AthleticsCalendarBlock: block_start < block_end (half-open interval)"
    error_id: ERR_INVALID_ATHLETICS_BLOCK
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/athletics-blocks"

  - priority: 19
    category: business_constraint
    check: "Officer-only operation: caller holds an ACTIVE OfficerRole; specific offices required for some operations (SECRETARY submits minutes)"
    error_id: ERR_NOT_AN_OFFICER
    http_status: 403
    applies_to: "Officer-scoped endpoints"

  - priority: 20
    category: business_constraint
    check: "Member role identity: caller X-User-ID corresponds to Member.id for member-self endpoints"
    error_id: ERR_MEMBER_MISMATCH
    http_status: 403
    applies_to: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/withdraw, POST .../probation-cases/{caseId}/appeal"

  - priority: 21
    category: business_constraint
    check: "Probation appeal window: current clock < opened_at + 14 days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/members/{memberId}/probation-cases/{caseId}/appeal"

  - priority: 22
    category: business_constraint
    check: "Dismissal requires either Member.probation_strikes >= 2 or an explicit override_reason"
    error_id: ERR_DISMISSAL_REQUIRES_CAUSE
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/members/{memberId}/dismiss"

  - priority: 23
    category: state
    check: "OCC: expected_*_version matches current parent version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "advisor-approve (Chapter), dismiss (Member), induct (MembershipCycle)"

  - priority: 24
    category: business_constraint
    check: "Cycle candidate pool non-empty at close-nominations"
    error_id: ERR_EMPTY_CANDIDATE_POOL
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/close-nominations"

  - priority: 25
    category: business_constraint
    check: "Election tally requires at least one CAST vote"
    error_id: ERR_NO_VOTES_CAST
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/elections/{electionId}/tally"

  - priority: 26
    category: business_referential
    check: "Certify requires runoff_required == false AND winner_member_id non-null"
    error_id: ERR_RUNOFF_REQUIRED
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/elections/{electionId}/certify"

  - priority: 27
    category: business_referential
    check: "Fundraiser close requires the FUNDRAISER_DEPOSIT ledger entry to be CLEARED"
    error_id: ERR_DEPOSIT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/fundraiser-requests/{fundraiserId}/close"

  - priority: 28
    category: business_constraint
    check: "Field format: cycle_label matches /\\d{4}-(FALL|SPRING)/, academic_year matches /\\d{4}-\\d{4}/"
    error_id: ERR_INVALID_FORMAT
    http_status: 422
    applies_to: "POST /chapters/{chapterId}/membership-cycles"

  - priority: 29
    category: business_constraint
    check: "MembershipCycle must have at least one INDUCTED application before close"
    error_id: ERR_NO_INDUCTED_APPLICATIONS
    http_status: 409
    applies_to: "POST /chapters/{chapterId}/membership-cycles/{cycleId}/close"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default before any call: 2026-08-01T00:00:00Z. The server MUST NOT fall back to real wall-clock time."
    roles: [ActivitiesDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock updated"]

  # --- Chapter ---
  - method: POST
    path: "/chapters"
    description: "Create a new Chapter (initial status DRAFT)"
    roles: [ActivitiesDirector]
    code: 201
    input: [school_name, charter_number, advisor_user_id, gpa_threshold_weighted, gpa_threshold_unweighted, service_hours_annual_required, service_hours_per_semester_required, national_dues_cents_per_member]
    output: Chapter
    side_effects: ["status=DRAFT, standing=GOOD_STANDING, fund_balance_cents=0, dues_arrears_cents=0, active_member_count=0, version=1"]

  - method: GET
    path: "/chapters/{chapterId}"
    description: "Fetch a Chapter by id"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: Chapter
    side_effects: []

  - method: GET
    path: "/chapters"
    description: "List Chapters with pagination"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Chapter[]
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/activate"
    description: "Activate a Chapter"
    roles: [ActivitiesDirector]
    code: 200
    input: []
    output: Chapter
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/chapters/{chapterId}/suspend"
    description: "Suspend a Chapter (freezes child mutations)"
    roles: [ActivitiesDirector]
    code: 200
    input: []
    output: Chapter
    side_effects: ["status=SUSPENDED"]

  - method: POST
    path: "/chapters/{chapterId}/reinstate"
    description: "Reinstate a suspended Chapter"
    roles: [ActivitiesDirector]
    code: 200
    input: []
    output: Chapter
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/chapters/{chapterId}/dissolve"
    description: "Dissolve a Chapter"
    roles: [ActivitiesDirector]
    code: 200
    input: []
    output: Chapter
    side_effects: ["status=DISSOLVED, cascades per state machine"]

  - method: GET
    path: "/chapters/{chapterId}/standing"
    description: "Fetch the chapter's standing rollup (good_standing members, arrears, posture)"
    roles: [ActivitiesDirector, Advisor]
    code: 200
    input: []
    output: { standing: string, dues_arrears_cents: integer, fund_balance_cents: integer, active_member_count: integer }
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/chapters/{chapterId}/members"
    description: "Register a prospective Member"
    roles: [Advisor, ActivitiesDirector]
    code: 201
    input: [student_id, full_name, email, grade_level, weighted_gpa, unweighted_gpa]
    output: Member
    side_effects: ["status=PROSPECTIVE, good_standing=false"]

  - method: GET
    path: "/chapters/{chapterId}/members/{memberId}"
    description: "Fetch a Member"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/members"
    description: "List Members of a Chapter with pagination"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?", "grade_level?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/members/{memberId}/standing"
    description: "Fetch member standing detail (good_standing, service hour compliance)"
    roles: [ActivitiesDirector, Advisor]
    code: 200
    input: []
    output: { good_standing: boolean, verified_service_hours_current_year: number, verified_service_hours_current_semester: number, probation_strikes: integer, annual_cumulative_compliant: boolean, per_semester_strict_compliant: boolean }
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/nominate"
    description: "Nominate a PROSPECTIVE Member for the current MembershipCycle"
    roles: [Advisor]
    code: 200
    input: []
    output: Member
    side_effects: ["status=CANDIDATE; creates CycleApplication with status=SUBMITTED"]

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/reinstate"
    description: "Reinstate an ON_PROBATION Member to ACTIVE"
    roles: [Advisor]
    code: 200
    input: []
    output: Member
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/dismiss"
    description: "Dismiss a Member (OCC-guarded)"
    roles: [Advisor]
    code: 200
    input: [expected_member_version, "override_reason?"]
    output: Member
    side_effects: ["status=DISMISSED; cascades per state machine; increments Member.version by 1"]

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/graduate"
    description: "Graduate a Member to ALUMNUS"
    roles: [Advisor]
    code: 200
    input: []
    output: Member
    side_effects: ["status=ALUMNUS; cascades per state machine"]

  # --- MembershipCycle ---
  - method: POST
    path: "/chapters/{chapterId}/membership-cycles"
    description: "Create a MembershipCycle"
    roles: [Advisor]
    code: 201
    input: [cycle_label, academic_year, semester, nomination_open_date, nomination_close_date, induction_date]
    output: MembershipCycle
    side_effects: ["status=PLANNED, candidate_member_ids=[], inducted_count=0"]

  - method: GET
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}"
    description: "Fetch a MembershipCycle"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: MembershipCycle
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/membership-cycles"
    description: "List MembershipCycles"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MembershipCycle[]
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/open-nominations"
    description: "Open the cycle for nominations"
    roles: [Advisor]
    code: 200
    input: []
    output: MembershipCycle
    side_effects: ["status=NOMINATION; sets Chapter.current_cycle_id"]

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/close-nominations"
    description: "Close nominations and cascade applications to UNDER_REVIEW"
    roles: [Advisor]
    code: 200
    input: []
    output: MembershipCycle
    side_effects: ["status=REVIEW; cascades CycleApplication statuses; recomputes eligibility_score per application"]

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/induct"
    description: "Induct the cycle (OCC-guarded)"
    roles: [Advisor]
    code: 200
    input: [expected_cycle_version]
    output: MembershipCycle
    side_effects: ["status=INDUCTED; cascades APPROVED CycleApplications to INDUCTED and their Members to ACTIVE; increments MembershipCycle.version by 1"]

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/close"
    description: "Close the cycle"
    roles: [Advisor]
    code: 200
    input: []
    output: MembershipCycle
    side_effects: ["status=CLOSED; clears Chapter.current_cycle_id"]

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/cancel"
    description: "Cancel the cycle"
    roles: [Advisor]
    code: 200
    input: []
    output: MembershipCycle
    side_effects: ["status=CANCELLED; clears Chapter.current_cycle_id"]

  # --- CycleApplication ---
  - method: GET
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/applications"
    description: "List applications under a cycle"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CycleApplication[]
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}"
    description: "Fetch an application"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: CycleApplication
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/approve"
    description: "Approve an UNDER_REVIEW application"
    roles: [Advisor]
    code: 200
    input: []
    output: CycleApplication
    side_effects: ["status=APPROVED"]

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/reject"
    description: "Reject an UNDER_REVIEW application"
    roles: [Advisor]
    code: 200
    input: [rejection_reason]
    output: CycleApplication
    side_effects: ["status=REJECTED; cascades Member to PROSPECTIVE"]

  - method: POST
    path: "/chapters/{chapterId}/membership-cycles/{cycleId}/applications/{applicationId}/withdraw"
    description: "Withdraw an application (member self)"
    roles: [Member]
    code: 200
    input: []
    output: CycleApplication
    side_effects: ["status=WITHDRAWN; cascades Member to PROSPECTIVE"]

  # --- ServiceHourEntry ---
  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/service-hour-entries"
    description: "Log a service hour entry"
    roles: [Member, Officer, Advisor]
    code: 201
    input: [activity_name, service_date, hours, organization, supervisor_email]
    output: ServiceHourEntry
    side_effects: ["status=PENDING_VERIFICATION"]

  - method: GET
    path: "/chapters/{chapterId}/members/{memberId}/service-hour-entries"
    description: "List service hour entries for a member"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ServiceHourEntry[]
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}"
    description: "Fetch a service hour entry"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: ServiceHourEntry
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/verify"
    description: "Verify a service hour entry"
    roles: [Advisor]
    code: 200
    input: []
    output: ServiceHourEntry
    side_effects: ["status=VERIFIED; recomputes Member hour aggregates"]

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/reject"
    description: "Reject a service hour entry"
    roles: [Advisor]
    code: 200
    input: [rejection_reason]
    output: ServiceHourEntry
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/chapters/{chapterId}/members/{memberId}/service-hour-entries/{entryId}/void"
    description: "Void a service hour entry"
    roles: [Advisor]
    code: 200
    input: []
    output: ServiceHourEntry
    side_effects: ["status=VOID; recomputes Member hour aggregates if previously VERIFIED"]

  # --- OfficerElection ---
  - method: POST
    path: "/chapters/{chapterId}/elections"
    description: "Create an OfficerElection"
    roles: [Advisor]
    code: 201
    input: [cycle_id, office]
    output: OfficerElection
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/chapters/{chapterId}/elections/{electionId}"
    description: "Fetch an OfficerElection"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: OfficerElection
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/elections"
    description: "List OfficerElections"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: OfficerElection[]
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/elections/{electionId}/open"
    description: "Open the election for voting"
    roles: [Advisor]
    code: 200
    input: []
    output: OfficerElection
    side_effects: ["status=OPEN; opened_at stamped"]

  - method: POST
    path: "/chapters/{chapterId}/elections/{electionId}/tally"
    description: "Tally the votes"
    roles: [Advisor]
    code: 200
    input: []
    output: OfficerElection
    side_effects: ["status=TALLIED; winner_member_id and runoff_required computed; tallied_at stamped"]

  - method: POST
    path: "/chapters/{chapterId}/elections/{electionId}/certify"
    description: "Certify the election and create the OfficerRole"
    roles: [Advisor]
    code: 200
    input: []
    output: OfficerElection
    side_effects: ["status=CERTIFIED; creates OfficerRole with status=ACTIVE"]

  - method: POST
    path: "/chapters/{chapterId}/elections/{electionId}/void"
    description: "Void the election"
    roles: [Advisor]
    code: 200
    input: []
    output: OfficerElection
    side_effects: ["status=VOIDED; cascades ElectionVote to VOIDED"]

  # --- ElectionVote ---
  - method: POST
    path: "/chapters/{chapterId}/elections/{electionId}/votes"
    description: "Cast a vote"
    roles: [Member]
    code: 201
    input: [voter_member_id, candidate_member_id]
    output: ElectionVote
    side_effects: ["status=CAST"]

  - method: GET
    path: "/chapters/{chapterId}/elections/{electionId}/votes"
    description: "List votes for an election"
    roles: [ActivitiesDirector, Advisor]
    code: 200
    input: ["limit?", "offset?", "status?", "candidate_member_id?"]
    output: ElectionVote[]
    side_effects: []

  # --- OfficerRole ---
  - method: GET
    path: "/chapters/{chapterId}/officer-roles"
    description: "List officer roles"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?", "office?"]
    output: OfficerRole[]
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/officer-roles/{roleId}"
    description: "Fetch an officer role"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: OfficerRole
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/officer-roles/{roleId}/resign"
    description: "Officer resigns (self)"
    roles: [Officer]
    code: 200
    input: []
    output: OfficerRole
    side_effects: ["status=RESIGNED; recomputes Member.is_officer"]

  - method: POST
    path: "/chapters/{chapterId}/officer-roles/{roleId}/remove"
    description: "Advisor removes an officer"
    roles: [Advisor]
    code: 200
    input: []
    output: OfficerRole
    side_effects: ["status=REMOVED; recomputes Member.is_officer"]

  # --- MeetingMinutes ---
  - method: POST
    path: "/chapters/{chapterId}/meeting-minutes"
    description: "Create meeting minutes"
    roles: [Officer]
    code: 201
    input: [meeting_date, called_by_officer_id, attendees_member_ids, agenda, notes]
    output: MeetingMinutes
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/chapters/{chapterId}/meeting-minutes/{minutesId}"
    description: "Fetch meeting minutes"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: MeetingMinutes
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/meeting-minutes"
    description: "List meeting minutes"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MeetingMinutes[]
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/meeting-minutes/{minutesId}/submit"
    description: "Submit minutes (Secretary only)"
    roles: [Officer]
    code: 200
    input: []
    output: MeetingMinutes
    side_effects: ["status=SUBMITTED"]

  - method: POST
    path: "/chapters/{chapterId}/meeting-minutes/{minutesId}/approve"
    description: "Advisor approves minutes"
    roles: [Advisor]
    code: 200
    input: []
    output: MeetingMinutes
    side_effects: ["status=APPROVED"]

  - method: POST
    path: "/chapters/{chapterId}/meeting-minutes/{minutesId}/amend"
    description: "Amend approved minutes (cycles back to SUBMITTED)"
    roles: [Officer]
    code: 200
    input: [notes]
    output: MeetingMinutes
    side_effects: ["status=AMENDED -> SUBMITTED"]

  # --- FundraiserRequest ---
  - method: POST
    path: "/chapters/{chapterId}/fundraiser-requests"
    description: "Create a fundraiser request"
    roles: [Officer]
    code: 201
    input: [title, description, goal_amount_cents, upfront_cost_cents, requested_by_officer_id, scheduled_date]
    output: FundraiserRequest
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/chapters/{chapterId}/fundraiser-requests/{fundraiserId}"
    description: "Fetch a fundraiser request"
    roles: [ActivitiesDirector, Advisor, Officer, Member]
    code: 200
    input: []
    output: FundraiserRequest
    side_effects: []

  - method: GET
    path: "/chapters/{chapterId}/fundraiser-requests"
    description: "List fundraiser requests"
    roles: [ActivitiesDirector, Advisor, Officer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: FundraiserRequest[]
    side_effects: []

  - method: POST
    path: "/chapters/{chapterId}/fundraiser-requests/{fundraiserId}/submit"
    description: "Submit a fundraiser request"
    roles: [Officer]
    code: 200
    input: []
    output: FundraiserRequest
