      - name: both_coverage_variants_on_one_holding_set
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: coverage_variants_diverge_on_identical_holdings
          rationale: "§1.8 pins the BOOK_VALUE vs ELIGIBLE_MARKET delta on identical holdings with exact literals for both variants, so a separate §1.9 instance would duplicate it."

  - section: consistency_model
    instances:
      - name: derived_licensee_state_is_visible_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.licensee_obligation_aggregate
          - calculations.licensee_coverage_posture
        distinguishing_aspect: "There is no read-after-write lag: the obligations PATCH response itself already carries the new license balance, and the very next coverage-summary read shows the recomputed aggregate, ratio and posture without any intervening request or delay."
        test_recipe:
          setup: ["Jurisdiction CA; licensee with an ACTIVE CA license, zero obligations and 5000000 of CASH."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
              as: PlatformAdmin
              captures: { ca_id: "$.data.id" }
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id" }
            - call: "POST /license-applications"
              payload: { licensee_id: "${lic_id}", jurisdiction_id: "${ca_id}", license_class: "MONEY_TRANSMISSION", projected_annual_volume_cents: 90000000, new_product_narrative: "Domestic P2P transfers." }
              as: LicensingManager
              captures: { app_id: "$.data.id" }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensingManager
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "START_REVIEW" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "POST /license-applications/${app_id}/review-actions"
              payload: { action: "APPROVE" }
              as: StateRegulator
              as_user_id: "${ca_id}"
            - call: "GET /state-licenses?application_id=${app_id}"
              as: LicensingManager
              captures: { lic_ca_id: "$.data[0].id" }
            - call: "POST /state-licenses/${lic_ca_id}/bond"
              payload: { amount_cents: 5000000, bond_issuer: "Atlas Surety", effective_date: "2026-08-01T00:00:00Z" }
              as: LicensingManager
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "First Republic Trust", book_value_cents: 5000000, market_value_cents: 5000000 }
              as: ComplianceOfficer
              as_user_id: "user-co-1"
          trigger:
            - call: "PATCH /state-licenses/${lic_ca_id}/obligations"
              payload: { delta_cents: 5263157, memo: "Same-request visibility probe" }
              as: LicensingManager
              captures: { obl: "$.data.outstanding_obligations_cents" }
            - call: "GET /licensees/${lic_id}/coverage-summary"
              as: LicensingManager
              captures: { agg: "$.data.obligations_cents", ratio: "$.data.coverage_ratio_bps", posture: "$.data.coverage_posture" }
          assert:
            - "trigger call 1: ${obl} == 5263157 in the write response itself"
            - "trigger call 2: ${agg} == 5263157, ${ratio} == 9500 (floor(5000000 * 10000 / 5263157) == 9500) and ${posture} == WATCH"
            - "no second read is required for either value; the first read after the write is already correct"
