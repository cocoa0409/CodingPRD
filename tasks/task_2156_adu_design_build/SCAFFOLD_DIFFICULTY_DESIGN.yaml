  # =====================================================================
  # Rule 9 — compensating-action invariants over different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: contract_price_ledger_conserved_on_void
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_VOIDED
          - calculations.change_order_price_reconciliation
          - entities.AduProject.fields.contract_price_current_cents
          - entities.AduProject.fields.approved_change_days
          - entities.FinancingScenario.fields.funding_gap_cents
        distinguishing_aspect: |
          Conserved quantity 1 — MONEY, pinned as
          AduProject.contract_price_current_cents == contract_base_price_cents
          + sum(cost_delta_cents + builder_fee_cents) over ChangeOrder rows with
          status == APPROVED. Approving a +4000000 change order and then voiding it must
          return that expression to exactly 24000000, drop approved_change_days from 21 to 0,
          zero the change order's builder_fee_cents, and walk financing_state back
          SHORTFALL -> COMMITTED with funding_gap_cents 0. No cent of drift is permitted.
