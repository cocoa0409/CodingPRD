          - validations[priority 10, ERR_REVERSAL_WINDOW_CLOSED]
          - endpoints."POST /_clock/set_current_utc"
        distinguishing_aspect: "Both temporal gates use a non-strict <= against the logical clock, so the last legal instant is inside the window: authorization succeeds at exactly quote_expires_at (00:15:00) and fails one second later, and a reversal succeeds at exactly settled_at + 24h (2026-08-02T00:15:00Z) and fails one second later."
