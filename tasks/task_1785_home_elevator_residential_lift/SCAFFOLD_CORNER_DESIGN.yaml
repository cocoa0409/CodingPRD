# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Home Elevator & Residential Lift Installation
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Canonical fixture: default logical clock 2026-08-01T00:00:00Z; homeowner
# user id "u-own-1"; money in dollars, 2dp round_half_up.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: property_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Property.fields.has_existing_shaft, response_envelope]
        distinguishing_aspect: "Omitting has_existing_shaft yields false; system stamps id/created_at/version=1; success envelope carries meta.api_request_id and response_type object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
          trigger:
            - { call: "GET /api/properties/${prop}", payload: {}, as: ProjectCoordinator }
          assert:
            - "Property.${prop}.has_existing_shaft == false (default applied)"
            - "Property.${prop}.version == 1 and created_at == 2026-08-01T00:00:00Z (default logical clock)"
            - "Response envelope: response_type == 'object', meta.api_request_id present, meta.api_request_timestamp present"

      - name: property_missing_state_code_invalid_request
        claim_type: required_fields
        grounds: [entities.Property.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A creation missing the required input state_code is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St" }, as: ProjectCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: property_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent property id returns ERR_PROPERTY_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/properties/00000000-0000-0000-0000-000000000000", payload: {}, as: ProjectCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROPERTY_NOT_FOUND (http 404)"

      - name: product_model_invalid_drive_type_rejected
        claim_type: type_constraints
        grounds: [entities.ProductModel.fields.drive_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum value outside {HYDRAULIC, TRACTION, PNEUMATIC, PLATFORM_LIFT} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/product-models", payload: { model_code: "XXX-1", drive_type: "SCREW_DRIVE", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: survey_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.SiteSurvey.fields.feasibility_verdict]
        distinguishing_aspect: "Passing computed field feasibility_verdict at creation is ignored: the survey is created SCHEDULED with verdict unset until completion computes it."
        test_recipe:
          setup: ["property and surveyor technician exist"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
          trigger:
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z", feasibility_verdict: "INFEASIBLE" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
          assert:
            - "Survey created (201) despite the smuggled computed field"
            - "SiteSurvey.${surv}.status == SCHEDULED and feasibility_verdict is null (client input ignored)"

      - name: list_pagination_defaults_and_has_more
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more behave per envelope: default limit 10; explicit limit=2 pages a 3-row collection 2+1."
        test_recipe:
          setup: ["three ACTIVE product models"]
          setup_api_calls:
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin }
            - { call: "POST /api/product-models", payload: { model_code: "TRC-100", drive_type: "TRACTION", min_pit_depth_inches: 10, min_overhead_clearance_inches: 92, capacity_lbs: 700, base_price: 27000.00, install_labor_price: 8500.00 }, as: DealerAdmin }
            - { call: "POST /api/product-models", payload: { model_code: "PNU-100", drive_type: "PNEUMATIC", min_pit_depth_inches: 0, min_overhead_clearance_inches: 84, capacity_lbs: 450, base_price: 32000.00, install_labor_price: 9000.00 }, as: DealerAdmin }
          trigger:
            - { call: "GET /api/product-models?limit=2&offset=0", payload: {}, as: ProjectCoordinator }
            - { call: "GET /api/product-models?limit=2&offset=2", payload: {}, as: ProjectCoordinator }
          assert:
            - "Page 1: response_type == 'array', 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"

      - name: technician_version_increments_on_mutation
        claim_type: system_fields
        grounds: [entities.Technician]
        distinguishing_aspect: "common_fields bookkeeping: version starts at 1 on create and increments to 2 on deactivate; updated_at refreshes."
        test_recipe:
          setup: ["one ACTIVE technician with no open calls or inspections"]
          setup_api_calls:
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
          trigger:
            - { call: "POST /api/technicians/${t_inst}/deactivate", payload: {}, as: DealerAdmin }
          assert:
            - "Technician.${t_inst}.status == INACTIVE"
            - "Technician.${t_inst}.version == 2 (was 1 at creation)"
            - "Technician.${t_inst}.updated_at > created_at"

      - name: survey_create_with_missing_property_not_found
        claim_type: parent_relationships
        grounds: [entities.SiteSurvey.fields.property_id, "errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "Body FK integrity: survey creation against a nonexistent property_id fails with ERR_PROPERTY_NOT_FOUND (404) before any state or business check."
        test_recipe:
          setup: ["one surveyor technician exists"]
          setup_api_calls:
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
          trigger:
            - { call: "POST /api/surveys", payload: { property_id: "00000000-0000-0000-0000-000000000000", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROPERTY_NOT_FOUND (http 404)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: project_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - "state_machines.Project"
        distinguishing_aspect: "A newly created project starts in DRAFT with version 1 and null product_model_id."
        test_recipe:
          setup: ["property, COMPLETED FEASIBLE survey (model HYD-100 in catalog)"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
          trigger:
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id } }
          assert:
            - "Project.${proj}.status == DRAFT"
            - "Project.${proj}.version == 1"
            - "Project.${proj}.product_model_id is null and funding_posture == UNFUNDED"

      - name: unit_born_installed_and_unregistered
        claim_type: initial_state
        grounds:
          - "state_machines.ElevatorUnit.equipment_status"
          - "state_machines.ElevatorUnit.registration_status"
        distinguishing_aspect: "complete-installation creates the unit with equipment_status INSTALLED, registration_status UNREGISTERED, install_date equal to the logical clock."
        test_recipe:
          setup: ["project INSTALL_SCHEDULED with install window 2026-08-10..2026-08-20; clock at 2026-08-12T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", ahj_name: "Springfield AHJ" }, as: ProjectCoordinator, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/approve", payload: {}, as: Regulator }
            - { call: "POST /api/projects/${proj}/schedule-installation", payload: { install_start_date: "2026-08-10T08:00:00Z", install_end_date: "2026-08-20T17:00:00Z" }, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: DealerAdmin }
          trigger:
            - { call: "POST /api/projects/${proj}/complete-installation", payload: { serial_number: "SN-100" }, as: Installer, as_user_id: "${t_inst}" }
            - { call: "GET /api/units?project_id=${proj}", payload: {}, as: ProjectCoordinator, captures: { unit: "$.data[0].id" } }
          assert:
            - "ElevatorUnit.${unit}.equipment_status == INSTALLED"
            - "ElevatorUnit.${unit}.registration_status == UNREGISTERED"
            - "ElevatorUnit.${unit}.install_date == 2026-08-12T09:00:00Z and serial_number == SN-100"

      - name: cancel_already_cancelled_project_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Project.ANY_NON_TERMINAL_to_CANCELLED"
          - "errors[ERR_PROJECT_STATE_FORBIDS]"
        distinguishing_aspect: "Second cancel on a CANCELLED project fails with ERR_PROJECT_STATE_FORBIDS; no side effects fire twice."
        test_recipe:
          setup: ["project in DRAFT, then cancelled"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id } }
            - { call: "POST /api/projects/${proj}/cancel", payload: {}, as: ProjectCoordinator }
          trigger:
            - { call: "POST /api/projects/${proj}/cancel", payload: {}, as: ProjectCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROJECT_STATE_FORBIDS (http 409)"
            - "Project.${proj}.status remains CANCELLED"

      - name: closed_project_lockdown
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.Project"
        distinguishing_aspect: "From terminal CLOSED, both PATCH (OCC-current but state-blocked) and cancel are rejected with ERR_PROJECT_STATE_FORBIDS."
        test_recipe:
          setup: ["project driven all the way to CLOSED (no grants: waterfall over the empty set)"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Quinn Inspector", certification: "QEI", home_region: "north" }, as: DealerAdmin, captures: { t_insp: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
            - { call: "POST /api/projects", payload: { property_id: "${prop}", survey_id: "${surv}", project_type: "NEW_INSTALLATION" }, as: ProjectCoordinator, captures: { proj: $.data.id, proj_v: $.data.version } }
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", lead_installer_technician_id: "${t_inst}", expected_project_version: "${proj_v}" }, as: ProjectCoordinator }
            - { call: "POST /api/permits", payload: { project_id: "${proj}", ahj_name: "Springfield AHJ" }, as: ProjectCoordinator, captures: { perm: $.data.id } }
            - { call: "POST /api/permits/${perm}/approve", payload: {}, as: Regulator }
            - { call: "POST /api/projects/${proj}/schedule-installation", payload: { install_start_date: "2026-08-10T08:00:00Z", install_end_date: "2026-08-20T17:00:00Z" }, as: ProjectCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T09:00:00Z" }, as: DealerAdmin }
            - { call: "POST /api/projects/${proj}/complete-installation", payload: { serial_number: "SN-100" }, as: Installer, as_user_id: "${t_inst}" }
            - { call: "GET /api/units?project_id=${proj}", payload: {}, as: ProjectCoordinator, captures: { unit: "$.data[0].id" } }
            - { call: "POST /api/inspections", payload: { unit_id: "${unit}", project_id: "${proj}", inspection_type: "ACCEPTANCE", inspector_technician_id: "${t_insp}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: ProjectCoordinator, captures: { insp: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:05:00Z" }, as: DealerAdmin }
            - { call: "POST /api/inspections/${insp}/record-result", payload: { result: "PASSED" }, as: Inspector, as_user_id: "${t_insp}" }
            - { call: "POST /api/registration-certificates", payload: { unit_id: "${unit}" }, as: ProjectCoordinator, captures: { cert: $.data.id } }
            - { call: "POST /api/registration-certificates/${cert}/issue", payload: {}, as: Regulator }
            - { call: "POST /api/projects/${proj}/close", payload: {}, as: ProjectCoordinator }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectCoordinator, captures: { cur_v: $.data.version } }
          trigger:
            - { call: "PATCH /api/projects/${proj}", payload: { product_model_id: "${mdl}", expected_project_version: "${cur_v}" }, as: ProjectCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /api/projects/${proj}/cancel", payload: {}, as: ProjectCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "PATCH: err1 == ERR_PROJECT_STATE_FORBIDS (state check fires even with a current OCC version)"
            - "cancel: err2 == ERR_PROJECT_STATE_FORBIDS"
            - "Project.${proj}.status remains CLOSED and final_invoice == 33000.00"

      - name: survey_double_complete_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SiteSurvey.SCHEDULED_to_COMPLETED"
          - "errors[ERR_SURVEY_STATE_FORBIDS]"
        distinguishing_aspect: "Completing an already-COMPLETED survey fails with ERR_SURVEY_STATE_FORBIDS; the recorded measurements are unchanged."
        test_recipe:
          setup: ["survey COMPLETED with pit 12"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 12, measured_overhead_clearance_inches: 96, shaft_width_inches: 40, shaft_depth_inches: 44, floors_served: 2 }, as: Surveyor, as_user_id: "${t_surv}" }
          trigger:
            - { call: "POST /api/surveys/${surv}/complete", payload: { measured_pit_depth_inches: 20, measured_overhead_clearance_inches: 120, shaft_width_inches: 48, shaft_depth_inches: 48, floors_served: 3 }, as: Surveyor, as_user_id: "${t_surv}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SURVEY_STATE_FORBIDS (http 409)"
            - "SiteSurvey.${surv}.measured_pit_depth_inches remains 12 and feasibility_verdict remains FEASIBLE"

      - name: permit_resubmit_from_under_review_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.PermitApplication.CORRECTIONS_REQUIRED_to_UNDER_REVIEW"
          - "errors[ERR_PERMIT_STATE_FORBIDS]"
        distinguishing_aspect: "resubmit is only legal from CORRECTIONS_REQUIRED; from UNDER_REVIEW it fails with ERR_PERMIT_STATE_FORBIDS."
        test_recipe:
          setup: ["project QUOTED; permit UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /api/properties", payload: { owner_user_id: "u-own-1", address_line: "1 Pine St", state_code: "CA" }, as: ProjectCoordinator, captures: { prop: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Sam Surveyor", certification: "CET_AND_QEI", home_region: "north" }, as: DealerAdmin, captures: { t_surv: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Ivy Installer", certification: "CET", home_region: "north" }, as: DealerAdmin, captures: { t_inst: $.data.id } }
            - { call: "POST /api/product-models", payload: { model_code: "HYD-100", drive_type: "HYDRAULIC", min_pit_depth_inches: 12, min_overhead_clearance_inches: 96, capacity_lbs: 750, base_price: 25000.00, install_labor_price: 8000.00 }, as: DealerAdmin, captures: { mdl: $.data.id } }
            - { call: "POST /api/surveys", payload: { property_id: "${prop}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv: $.data.id } }
