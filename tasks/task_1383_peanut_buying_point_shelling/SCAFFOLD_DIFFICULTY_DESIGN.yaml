            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/sheller-contracts"
              payload: { buying_point_id: "${bp}", sheller_ref: "sheller-acme", total_units_tons: 100.0, price_per_ton_cents: 61000, accepts_segregated: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: BuyingPointAdmin
              captures: { ct: $.data.id }
            - { call: "POST /buying-points/sheller-contracts/${ct}/activate", payload: {}, as: BuyingPointAdmin }
          trigger:
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 10.0, dock_window_start: "2026-09-10T08:00:00Z", dock_window_end: "2026-09-10T14:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dca: $.data.id }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 10.0, dock_window_start: "2026-09-10T15:00:00Z", dock_window_end: "2026-09-10T18:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { err: $.data.error_id }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 10.0, dock_window_start: "2026-09-10T16:00:00Z", dock_window_end: "2026-09-10T18:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dcc: $.data.id }
          assert:
            - "DeliveryCall.${dca} ISSUED (dock [08:00, 14:00])"
            - "Call starting 15:00 rejected: error_id == ERR_DOCK_WINDOW_OVERLAP (14:00 + 120min buffer = 16:00 earliest legal start; closed-interval+buffer semantics)"
            - "DeliveryCall.${dcc} ISSUED starting exactly 16:00 (buffer boundary inclusive-satisfied)"
            - "Contrast: under the dryer's half-open rule a start at 14:00 would already be legal — different geometry, different resource"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: warehouse_tons_partition_invariant
        grounds:
          - entities.Warehouse.fields.free_tons
          - entities.Warehouse.fields.stored_tons
          - entities.Warehouse.fields.reserved_tons
          - state_machines.DeliveryCall
        distinguishing_aspect: |
          Conserved quantity: warehouse tonnage partition. At every step,
          stored_tons + reserved_tons + free_tons == capacity_tons (2000)
          exactly — across the forward leg (allocate moves 10t free->reserved),
          the compensating leg (cancel returns 10t reserved->free with zero
          drift), and delivery (10t leaves stored entirely). The paired
          invariant conserves a different quantity (quota tons).
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE; WH-G GENERAL capacity 2000; WH-S 500 unused); grower G1; load A 25.0t STORED (rcptA)"
            - "Contract 100t ACTIVE; call1 10t dock 2026-09-10T08:00-12:00Z ISSUED; call2 created later"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-S", compartment: SEGREGATED, capacity_tons: 500 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/record-result", payload: { result_ppb: 8.0 }, as: LabTechnician, as_user_id: lab-1 }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
            - call: "POST /buying-points/storage-receipts"
              payload: { load_id: "${loadA}", warehouse_id: "${whg}" }
              as: BuyingPointAdmin
              captures: { rcptA: $.data.id }
            - call: "POST /buying-points/sheller-contracts"
              payload: { buying_point_id: "${bp}", sheller_ref: "sheller-acme", total_units_tons: 100.0, price_per_ton_cents: 61000, accepts_segregated: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: BuyingPointAdmin
              captures: { ct: $.data.id }
            - { call: "POST /buying-points/sheller-contracts/${ct}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 10.0, dock_window_start: "2026-09-10T08:00:00Z", dock_window_end: "2026-09-10T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc1: $.data.id, dc1_v: $.data.version }
          trigger:
            - { call: "POST /buying-points/delivery-calls/${dc1}/allocate", payload: { expected_delivery_call_version: "${dc1_v}" }, as: BuyingPointAdmin }
            - { call: "GET /buying-points/warehouses/${whg}", payload: {}, as: BuyingPointAdmin }
            - { call: "POST /buying-points/delivery-calls/${dc1}/cancel", payload: {}, as: BuyingPointAdmin }
            - { call: "GET /buying-points/warehouses/${whg}", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 10.0, dock_window_start: "2026-09-12T08:00:00Z", dock_window_end: "2026-09-12T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc2: $.data.id, dc2_v: $.data.version }
            - { call: "POST /buying-points/delivery-calls/${dc2}/allocate", payload: { expected_delivery_call_version: "${dc2_v}" }, as: BuyingPointAdmin }
            - { call: "POST /buying-points/delivery-calls/${dc2}/deliver", payload: {}, as: BuyingPointAdmin }
            - { call: "GET /buying-points/warehouses/${whg}", payload: {}, as: BuyingPointAdmin }
            - { call: "GET /buying-points/storage-receipts/${rcptA}", payload: {}, as: BuyingPointAdmin }
          assert:
            - "Baseline: stored 25, reserved 0, free 1975; sum == 2000"
            - "After allocate (forward): stored 25, reserved 10, free 1965; sum == 2000"
            - "After cancel (compensating): stored 25, reserved 0, free 1975; sum == 2000 — zero drift"
            - "After allocate+deliver on call2: stored 15, reserved 0, free 1985; sum == 2000"
            - "StorageReceipt.${rcptA}.tons_remaining == 15.0"

      - name: quota_consumption_invariant
        grounds:
          - entities.QuotaHistory.fields.used_quota_tons
          - state_machines.Settlement.COMPUTED_to_APPROVED
          - state_machines.Settlement.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: quota tons. used_quota_tons always equals the
          sum of quota_tons_applied over {APPROVED, PAID} settlements — the
          approve leg adds 23.375, the void leg subtracts exactly it (no
          drift), and a fresh recompute+approve re-adds it. Different
          conserved quantity than the warehouse tonnage partition instance.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000); grower G1 quota 100t; load A 25.0t STORED (payable 23.375)"
