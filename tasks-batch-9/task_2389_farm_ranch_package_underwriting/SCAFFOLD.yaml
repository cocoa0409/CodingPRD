    input: ["decision", "decision_note?"]
    output: FarmPolicy
    side_effects: ["APPROVE moves uw_status REFERRED -> RATED and re-derives quote_expires_at from the original rating_valuation_date", "RETURN moves REFERRED -> DRAFT with the full release / reversal cascade", "DECLINE moves REFERRED -> DECLINED, releases reservations, reverses the ledger and cancels SCHEDULED inspections", "clears referred_at, referred_by_user_id and referral_reason_code", "increments FarmPolicy.version by 1"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FARM_POLICY_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_POLICY_NOT_REFERRED, ERR_POLICY_TERMINAL]

