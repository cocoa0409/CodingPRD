  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_closed_interval_treats_a_shared_endpoint_as_overlap
        grounds:
          - validations.priority_66.ERR_PERMIT_PERIOD_OVERLAP
          - entities.StatePermit.fields.effective_date
          - entities.StatePermit.fields.expiration_date
          - state_machines.StatePermit.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Permit periods are CLOSED intervals [effective_date, expiration_date], so a new permit whose
          effective_date equals an existing permit's expiration_date collides — the day is claimed twice. The
          same request shifted one day later is accepted, and the exclusivity is scoped to non-REVOKED rows,
          so revoking the incumbent frees its exact interval for re-issue.
        test_recipe:
          setup:
            - "Winery Estate 1 exists with a TX StateRule and no permits yet. Clock 2026-08-01."
            - "Permit P1 covers 2026-01-01 through 2026-06-30 and is PENDING \u2014 exclusivity applies to every non-REVOKED status, not only ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments/${ce_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-A", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-06-30" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-B", permit_type: "DIRECT_SHIPPER", effective_date: "2026-06-30", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-C", permit_type: "DIRECT_SHIPPER", effective_date: "2026-07-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p3_id: $.data.id }
            - call: "POST /dtc/state-permits/${p1_id}/revoke"
              payload: { revocation_reason: "Superseded by a corrected filing" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-D", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-06-30" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p4_id: $.data.id }
          assert:
            - "shared endpoint collides: the first trigger call returns HTTP 409 with error_id \"ERR_PERMIT_PERIOD_OVERLAP\" because 2026-06-30 belongs to P1's closed interval"
            - "one day of separation is accepted: the second trigger call returns HTTP 201 and StatePermit.${p3_id}.effective_date == \"2026-07-01\" with status \"PENDING\""
            - "GET /dtc/state-permits?winery_id=${w_id}&state_code=TX returns exactly two rows after the second trigger call \u2014 the refused request persisted nothing"
            - "revocation frees the interval: StatePermit.${p1_id}.status == \"REVOKED\" and the fourth trigger call returns HTTP 201 with StatePermit.${p4_id}.effective_date == \"2026-01-01\" and expiration_date == \"2026-06-30\""
            - "StatePermit.${p4_id}.id != \"${p1_id}\" \u2014 a second row now carries the same interval, which is legal only because the first is REVOKED"
            - "no cascade fired on the revoke: Winery.${w_id}.suspended_subscription_count == 0, because no CLEARED order or ACTIVE subscription referenced P1"
      - name: remittance_half_open_period_allows_adjacency_and_is_family_scoped
        grounds:
          - validations.priority_68.ERR_REMITTANCE_PERIOD_OVERLAP
          - calculations.remittance_due_amounts.precision
          - entities.TaxRemittance.fields.basis
          - entities.TaxRemittance.fields.period_type
        distinguishing_aspect: |
          The opposite interval convention on a different resource: remittance periods are HALF-OPEN
          [period_start, period_end), so the adjacency that collides for permits is legal here — August may
          start exactly on July's period_end. Exclusivity is scoped by (winery, state, period_type, basis), so
          the identical July window is refused for the same basis, accepted for the other basis, and an ANNUAL
          period may enclose the MONTHLY ones without collision.
        test_recipe:
          setup:
            - "Winery Estate 1 exists with a TX StateRule and an ACTIVE TX permit; no orders exist, so every period is empty and the amounts are all zero. Clock 2026-08-01."
            - "One ACCRUAL_BASIS MONTHLY remittance already covers 2026-07-01 through 2026-08-01 (exclusive)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
