# =============================================================================
# Task 1146 — Scaffold Difficulty Design (Test Targeting Index, §1.8)
# 9 rules x 2 instances = 18 instances. All time/money literals pre-computed.
# Logical clock startup default: 2026-05-01T00:00:00Z.
# Common preamble abbreviations used in every chain:
#   register patient/physician/device, set clock, create order (capture id+version),
#   create enrollment (OCC), complete-education, activate (baseline 90) -> episode.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_billing_amounts
        grounds:
          - calculations.billing_amounts
          - calculations.billable_days
          - entities.BillingPeriod.fields.provisional_total_cents
          - entities.BillingPeriod.fields.total_amount_cents
        distinguishing_aspect: |
          Dual-variant pair on the BillingPeriod domain: identical windows produce
          provisional_total_cents == 60120 (30 assumed days) but FINAL
          total_amount_cents == 48096 (24 suspension-adjusted days); the second
          Rule-1 instance lives on a different entity domain (ArrhythmiaAlert SLA).
        test_recipe:
          setup:
            - "EVENT episode started 2026-05-01T00:00:00Z, prescribed 30 days, billing generated (window [05-01, 05-31))"
            - "Three gap strikes at 05-03/05-05/05-07 -> SUSPENDED at 05-07T00:00Z; resume at 05-13T00:00Z (6 suspension days)"
            - "Sweep at 2026-06-01 closes the window -> READY"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Ann Apex", date_of_birth: "1950-01-01", mrn: "MRN-1001", phone: "555-0101", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Hart", npi: "1000000001", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1001", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 30 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp_id: "$.data[0].id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev1_id: "$.data[0].id" } }
            - { call: "POST /v1/compliance-events/${ev1_id}/resolve", payload: { resolution_action: "CONTACTED_PATIENT" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev2_id: "$.data[0].id" } }
            - { call: "POST /v1/compliance-events/${ev2_id}/resolve", payload: { resolution_action: "CONTACTED_PATIENT" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev3_id: "$.data[0].id" } }
            - { call: "POST /v1/compliance-events/${ev3_id}/resolve", payload: { resolution_action: "DEVICE_REPLACED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/resume", payload: {}, as: EnrollmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/billing-periods/${bp_id}", as: BillingSpecialist }
          assert:
            - "BillingPeriod.${bp_id}.provisional_total_cents == 60120 (PROVISIONAL variant: 30 assumed days, TC 54915 + PC 5205)"
            - "BillingPeriod.${bp_id}.billable_days == 24 (30 window days minus 6 suspension days 05-07..05-13)"
            - "BillingPeriod.${bp_id}.tc_amount_cents == 43932"
            - "BillingPeriod.${bp_id}.pc_amount_cents == 4164"
            - "BillingPeriod.${bp_id}.total_amount_cents == 48096 (FINAL variant diverges from provisional by 12024 cents for identical windows)"
            - "BillingPeriod.${bp_id}.status == READY"

      - name: business_hours_vs_wall_clock_sla
        grounds:
          - calculations.notification_sla
          - entities.ArrhythmiaAlert.fields.sla_deadline
        distinguishing_aspect: |
          Dual-variant pair on the ArrhythmiaAlert domain (different entity domain
          from BillingPeriod in the sibling instance): the pinned BUSINESS_HOURS
          variant moves an out-of-hours URGENT deadline to 2026-05-02T08:30:00Z
          while the WALL_CLOCK variant would give 2026-05-01T22:30:00Z.
        test_recipe:
          setup:
            - "EVENT episode MONITORING; clock at 2026-05-01T21:30:00Z (outside 08:00-20:00 UTC business hours)"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Bob Beat", date_of_birth: "1955-02-02", mrn: "MRN-1002", phone: "555-0102", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Pace", npi: "1000000002", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1002", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 30 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "IN_PERSON" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T21:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "URGENT", arrhythmia_type: "AFIB" }, as: DeviceGateway, captures: { a_id: $.data.id } }
          assert:
            - "ArrhythmiaAlert.${a_id}.sla_deadline == 2026-05-02T08:30:00Z (BUSINESS_HOURS: next 08:00 + 30min)"
            - "ArrhythmiaAlert.${a_id}.sla_deadline != 2026-05-01T22:30:00Z (WALL_CLOCK variant: detected_at + 60min, NOT used)"
            - "ArrhythmiaAlert.${a_id}.detected_at == 2026-05-01T21:30:00Z"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: notification_sla_piecewise_multi_input
        grounds:
          - calculations.notification_sla
        distinguishing_aspect: |
          Mode (a): a piecewise formula with 3 inputs (severity x business-hours
          flag x base minutes) and nested branches — CRITICAL ignores hours,
          URGENT out-of-hours lands on next-open+30, ROUTINE in-hours adds 1440min;
          the sibling instance is mode (b) nested rounding, a different mode.
        test_recipe:
          setup:
            - "EVENT episode MONITORING; three alerts raised at three pinned clock positions"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Cara Pulse", date_of_birth: "1960-03-03", mrn: "MRN-1003", phone: "555-0103", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Node", npi: "1000000003", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1003", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 30 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "PHONE" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T21:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "CRITICAL", arrhythmia_type: "VTACH" }, as: DeviceGateway, captures: { a_crit: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "URGENT", arrhythmia_type: "AFIB" }, as: DeviceGateway, captures: { a_urg: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T07:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "ROUTINE", arrhythmia_type: "PAUSE" }, as: DeviceGateway, captures: { a_rout: $.data.id } }
          trigger:
            - { call: "GET /v1/alerts/${a_crit}", as: MonitoringTechnician }
            - { call: "GET /v1/alerts/${a_urg}", as: MonitoringTechnician }
            - { call: "GET /v1/alerts/${a_rout}", as: MonitoringTechnician }
          assert:
            - "ArrhythmiaAlert.${a_crit}.sla_deadline == 2026-05-01T21:45:00Z (CRITICAL ignores business hours: +15min)"
            - "ArrhythmiaAlert.${a_urg}.sla_deadline == 2026-05-02T11:00:00Z (URGENT in-hours: +60min)"
            - "ArrhythmiaAlert.${a_rout}.sla_deadline == 2026-05-03T10:00:00Z (ROUTINE out-of-hours: next 08:00 + 120min; wall-clock variant would give 2026-05-04T07:30:00Z)"

      - name: per_line_rounding_before_sum
        grounds:
          - calculations.billing_amounts
        distinguishing_aspect: |
          Mode (b): nested rounding order — pinning 'round each of TC/PC line to
          whole cents (round_half_up) then sum' yields 30061 for 15 days, while
          'sum then round' yields 30060; the sibling instance is mode (a), so the
          two instances exercise different combinatorial modes.
        test_recipe:
          setup:
            - "EVENT episode 2026-05-01T00:00:00Z, prescribed 15 days, no suspensions; window closed by sweep -> READY with billable_days 15"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Dana Roud", date_of_birth: "1965-04-04", mrn: "MRN-1004", phone: "555-0104", insurance_plan: "SELF_PAY" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Sum", npi: "1000000004", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1004", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 15 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp_id: "$.data[0].id" } }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "GET /v1/billing-periods/${bp_id}", as: BillingSpecialist }
          assert:
            - "BillingPeriod.${bp_id}.billable_days == 15"
            - "BillingPeriod.${bp_id}.tc_amount_cents == 27458 (round_half_up(54915*15/30)=round_half_up(27457.5))"
            - "BillingPeriod.${bp_id}.pc_amount_cents == 2603 (round_half_up(5205*15/30)=round_half_up(2602.5))"
            - "BillingPeriod.${bp_id}.total_amount_cents == 30061 (sum of rounded lines; sum-then-round would give 30060)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: episode_parallel_dimensions_independent
        grounds:
          - state_machines.MonitoringEpisode (clinical_status)
          - state_machines.MonitoringEpisode (compliance_status)
        distinguishing_aspect: |
          Parallel state dimensions on MonitoringEpisode: compliance transitions
          COMPLIANT->WATCH->SUSPENDED while clinical_status stays MONITORING, then
          clinical completes while compliance remains SUSPENDED; the sibling
          instance is a cycle on a different entity (ArrhythmiaAlert).
        test_recipe:
          setup:
            - "EVENT episode MONITORING from 2026-05-01; three gap strikes via sweeps (resolve between), no resume"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Erin Dimm", date_of_birth: "1970-05-05", mrn: "MRN-1005", phone: "555-0105", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Axes", npi: "1000000005", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1005", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 30 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "IN_PERSON" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev1_id: "$.data[0].id" } }
            - { call: "POST /v1/compliance-events/${ev1_id}/resolve", payload: { resolution_action: "CONTACTED_PATIENT" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev2_id: "$.data[0].id" } }
            - { call: "POST /v1/compliance-events/${ev2_id}/resolve", payload: { resolution_action: "CONTACTED_PATIENT" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-07T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/compliance-events?episode_id=${ep_id}&status=OPEN", as: EnrollmentCoordinator, captures: { ev3_id: "$.data[0].id" } }
            - { call: "POST /v1/compliance-events/${ev3_id}/resolve", payload: { resolution_action: "PHYSICIAN_NOTIFIED" }, as: EnrollmentCoordinator }
          trigger:
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
          assert:
            - "After 3rd sweep and before complete: episode compliance_status == SUSPENDED while clinical_status == MONITORING (dimensions evolve independently)"
            - "MonitoringEpisode.${ep_id}.clinical_status == COMPLETED after trigger"
            - "MonitoringEpisode.${ep_id}.compliance_status == SUSPENDED after trigger (clinical transition does not touch the compliance dimension)"

      - name: alert_acknowledge_release_cycle
        grounds:
          - state_machines.ArrhythmiaAlert.ACKNOWLEDGED_to_NEW (release)
          - entities.Technician.fields.open_alert_load
        distinguishing_aspect: |
          Cyclic machine on ArrhythmiaAlert (NEW->ACKNOWLEDGED->NEW->ACKNOWLEDGED)
          with per-cycle load ledger effects; the sibling instance is parallel
          dimensions on MonitoringEpisode — a different entity and a different
          non-linear shape.
        test_recipe:
          setup:
            - "EVENT episode MONITORING; two technicians T1 (capacity 5) and T2 (capacity 5); one CRITICAL alert NEW"
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Fred Loop", date_of_birth: "1972-06-06", mrn: "MRN-1006", phone: "555-0106", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Cyc", npi: "1000000006", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Tech One", certification_level: "CCT", shift_capacity: 5 }, as: PlatformAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /v1/technicians", payload: { full_name: "Tech Two", certification_level: "CRAT", shift_capacity: 5 }, as: PlatformAdmin, captures: { t2_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-1006", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 30 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/episodes/${ep_id}/alerts", payload: { severity: "CRITICAL", arrhythmia_type: "VTACH" }, as: DeviceGateway, captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /v1/alerts/${a_id}/acknowledge", payload: {}, as: MonitoringTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /v1/alerts/${a_id}/release", payload: {}, as: MonitoringTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /v1/alerts/${a_id}/acknowledge", payload: {}, as: MonitoringTechnician, as_user_id: "${t2_id}" }
          assert:
            - "After ack(T1): alert ACKNOWLEDGED, assigned_technician_id == ${t1_id}, Technician.${t1_id}.open_alert_load == 1"
            - "After release(T1): alert NEW again, assigned_technician_id == null, Technician.${t1_id}.open_alert_load == 0 (cycle closed, no load leak)"
            - "After ack(T2): alert ACKNOWLEDGED, assigned_technician_id == ${t2_id}, Technician.${t2_id}.open_alert_load == 1"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: gap_strike_suspension_cascade
        grounds:
          - state_machines.MonitoringEpisode (compliance_status).WATCH_to_SUSPENDED
          - state_machines.ComplianceEvent
          - calculations.compliance_strike_mapping
          - calculations.transmission_gap_detection
        distinguishing_aspect: |
          Depth-4 cascade from the sweep trigger: sweep creates TRANSMISSION_GAP
          ComplianceEvent -> strike_count increments -> strike 3 flips
