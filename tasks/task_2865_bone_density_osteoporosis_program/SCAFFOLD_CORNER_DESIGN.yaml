              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_a_version: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_a_version}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-7601", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10", vfa_requested: false }
              as: Scheduler
