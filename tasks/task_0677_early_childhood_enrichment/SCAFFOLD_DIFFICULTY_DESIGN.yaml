            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-17T09:00:00Z", end_at: "2026-05-17T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sessB_id: $.data.id, sessB_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam15@x.com", primary_contact_name: "Iv" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
