  - section: validations
    instances:
      - name: create_district_missing_auth_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["empty database; request sent with no auth headers"]
          setup_api_calls: []
          trigger:
            - call: "POST /preservation/districts"
              payload: { name: "No Auth", boundary_description: "x", significance_tier: "LOCAL" }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and http status 401"

      - name: applicant_create_district_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Applicant role cannot create districts — ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
