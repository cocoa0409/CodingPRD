# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# School Health Office & Nurse Records — indexes SCAFFOLD.yaml §1.1–§1.7
# against the nine §0.5 Difficulty Rules. 9 rule_ids x 2 instances = 18.
# Logical clock default: 2026-08-01T00:00:00Z (a Saturday).
# Coverage weekdays MON..FRI only, so every recipe that must satisfy the
# on-coverage check sets the clock to 2026-08-03T09:00:00Z (Monday, minute 540).
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: coverage_ratio_contracted_vs_delivered_diverge
        grounds:
          - calculations.school_nurse_coverage_ratio
          - entities.School.fields.contracted_students_per_nurse_fte
          - entities.School.fields.delivered_students_per_nurse_fte
          - entities.School.fields.contracted_weekly_minutes
          - entities.School.fields.delivered_weekly_minutes
          - entities.Nurse.fields.credential
          - entities.CoverageAssignment.fields.status
        distinguishing_aspect: |
          Subject domain is STAFFING on the School entity: the CONTRACTED variant
          admits SCHEDULED and ACTIVE blocks at full weight, the DELIVERED variant
          admits only ACTIVE blocks of ACTIVE nurses and multiplies each by
          credential_weight, so identical stored rows yield 5.53 vs 11.05 students
          per nurse FTE on the very same School row.
        test_recipe:
          setup:
            - "One School (LNC01) with three ENROLLED students and no medication stock lots."
            - "Three nurses: an RN (480 ACTIVE minutes), a delegated HEALTH_AIDE (300 ACTIVE minutes), and an LPN whose 360-minute block is still SCHEDULED because its effective_from is 2026-12-01, after the logical clock."
            - "Logical clock left at its 2026-08-01T00:00:00Z default, so the two 2026-07-01 blocks are ACTIVE and the 2026-12-01 block is SCHEDULED."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Lincoln Elementary", building_code: "LNC01", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Ada Pike", credential: "HEALTH_AIDE", weekly_contracted_minutes: 1200, delegation_authorized: true }
              as: DistrictHealthAdmin
              captures: { aide_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Lena Ruiz", credential: "LPN", weekly_contracted_minutes: 1200, delegation_authorized: true }
              as: DistrictHealthAdmin
              captures: { lpn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${aide_id}", school_id: "${sch_id}", weekday: "TUE", start_minute: 480, end_minute: 780, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_aide_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${lpn_id}", school_id: "${sch_id}", weekday: "WED", start_minute: 480, end_minute: 840, effective_from: "2026-12-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_lpn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Ann Reed", grade_level: 3, date_of_birth: "2017-04-11T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu1_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Ben Ortiz", grade_level: 4, date_of_birth: "2016-09-02T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu2_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Cara Diaz", grade_level: 5, date_of_birth: "2015-12-19T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu3_id: $.data.id }
          trigger:
            - call: "GET /health-office/coverage-assignments/${cov_lpn_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { lpn_block_status: $.data.status }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { sch_posture: $.data.coverage_posture }
          assert:
            - "CoverageAssignment.${cov_lpn_id}.status == SCHEDULED"
            - "CoverageAssignment.${cov_rn_id}.status == ACTIVE"
            - "School.${sch_id}.enrolled_student_count == 3"
            - "School.${sch_id}.contracted_weekly_minutes == 1140"
            - "School.${sch_id}.delivered_weekly_minutes == 570.0"
            - "School.${sch_id}.contracted_students_per_nurse_fte == 5.53"
            - "School.${sch_id}.delivered_students_per_nurse_fte == 11.05"
            - "School.${sch_id}.contracted_students_per_nurse_fte != School.${sch_id}.delivered_students_per_nurse_fte"
            - "School.${sch_id}.stock_protocol_status == DEPLETED"
            - "School.${sch_id}.coverage_posture == LIMITED"

      - name: student_risk_intake_vs_observed_diverge
        grounds:
          - calculations.student_risk_scoring
          - entities.Student.fields.intake_risk_score
          - entities.Student.fields.observed_risk_score
          - entities.Student.fields.effective_risk_score
          - entities.Student.fields.risk_tier
          - state_machines.HealthVisit.DISPOSITIONED_to_CLOSED
          - state_machines.AdministrationRecord.PREPARED_to_ADMINISTERED
        distinguishing_aspect: |
          Subject domain is CLINICAL RISK on the Student entity, not staffing:
          INTAKE reads only declared profile fields (15 points) while OBSERVED
          replays the trailing 90-day encounter window (26 points), and the
          risk_tier is driven by the OBSERVED variant, flipping the student from
          ROUTINE to ELEVATED even though the declared profile never changed.
        test_recipe:
          setup:
            - "One School (RSK18) with one RN on an ACTIVE Monday coverage block and one stock-protocol EPINEPHRINE lot of 10 units."
            - "One ENROLLED student with allergy_severity MILD, chronic_condition_codes [T1DM] and immunization_status COMPLIANT, giving intake_risk_score 15."
            - "Clock at 2026-08-03T09:00:00Z for the encounter, then advanced to 2026-08-03T09:30:00Z so the 90-day OBSERVED window (right-exclusive) actually contains the encounter timestamps."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Risk Ridge Elementary", building_code: "RSK18", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Dev Patel", grade_level: 6, date_of_birth: "2014-06-05T00:00:00Z", allergy_severity: "MILD", chronic_condition_codes: ["T1DM"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-RSK-1", is_stock_protocol: true, initial_quantity: 10, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { epi_lot_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "ILLNESS", acuity: "URGENT" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Wheeze on exertion, guardian contacted" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/administration-records/stock-emergency"
              payload: { visit_id: "${visit_id}", medication_code: "EPINEPHRINE", units: 1 }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { adm_id: $.data.id }
            - call: "POST /health-office/administration-records/${adm_id}/outcome"
              payload: { outcome: "ADMINISTERED" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/health-visits/${visit_id}/dispose"
              payload: { disposition: "SEND_HOME", guardian_notified: true }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: DistrictHealthAdmin
          trigger:
            - call: "POST /health-office/health-visits/${visit_id}/close"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { closed_status: $.data.status, mins: $.data.minutes_in_office }
            - call: "GET /health-office/students/${stu_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { tier: $.data.risk_tier }
          assert:
            - "HealthVisit.${visit_id}.status == CLOSED"
            - "HealthVisit.${visit_id}.minutes_in_office == 30"
            - "Student.${stu_id}.intake_risk_score == 15"
            - "Student.${stu_id}.observed_risk_score == 26"
            - "Student.${stu_id}.effective_risk_score == 26"
            - "Student.${stu_id}.risk_tier == ELEVATED"
            - "Student.${stu_id}.intake_risk_score != Student.${stu_id}.observed_risk_score"

  - rule_id: combinatorial_formula
    instances:

      - name: triage_nested_clamp_caps_risk_uplift_at_25
        grounds:
          - calculations.visit_triage_score
          - entities.HealthVisit.fields.triage_score
          - entities.HealthVisit.fields.requires_ems_review
          - entities.Student.fields.risk_tier
          - entities.School.fields.coverage_posture
          - state_machines.HealthVisit.null_to_OPEN
        distinguishing_aspect: |
          MODE (a) — four inputs with non-linear interaction: acuity base,
          complaint_points, a nested inner clamp min(25, tier_points +
          anaphylaxis_bonus) that fires before the outer clamp min(100, ...),
          and a coverage_penalty keyed on a derived School field. A CRITICAL
          anaphylaxis student on a MEDICATION complaint contributes exactly 25,
          not 35, so the stored score is 77 and not the naive 87.
        test_recipe:
          setup:
            - "School ADM02 with coverage_posture FULL: one RN on an ACTIVE Monday block (480 minutes), one ENROLLED student, and stock-protocol EPINEPHRINE (10 units) plus ALBUTEROL (40 units) lots giving epinephrine_days_of_supply 33.33 and albuterol_days_of_supply 33.33 => stock_protocol_status READY."
            - "The single student carries allergy_severity ANAPHYLAXIS, chronic_condition_codes [ASTHMA] and immunization_status NONCOMPLIANT, so intake_risk_score is 70 and risk_tier is CRITICAL."
            - "Logical clock left at its 2026-08-01T00:00:00Z default; visit creation has no on-coverage requirement."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Adams Middle", building_code: "ADM02", cot_capacity: 3, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Elin Cruz", grade_level: 7, date_of_birth: "2013-02-27T00:00:00Z", allergy_severity: "ANAPHYLAXIS", chronic_condition_codes: ["ASTHMA"], immunization_status: "NONCOMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-ADM-1", is_stock_protocol: true, initial_quantity: 10, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { epi_lot_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "ALBUTEROL", lot_number: "ALB-ADM-1", is_stock_protocol: true, initial_quantity: 40, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { alb_lot_id: $.data.id }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { posture_before: $.data.coverage_posture }
          trigger:
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "MEDICATION", acuity: "URGENT" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id, triage: $.data.triage_score }
          assert:
            - "School.${sch_id}.required_stock_units == 1"
            - "School.${sch_id}.epinephrine_days_of_supply == 33.33"
            - "School.${sch_id}.albuterol_days_of_supply == 33.33"
            - "School.${sch_id}.stock_protocol_status == READY"
            - "School.${sch_id}.delivered_students_per_nurse_fte == 4.38"
            - "School.${sch_id}.coverage_posture == FULL"
            - "Student.${stu_id}.intake_risk_score == 70"
            - "Student.${stu_id}.risk_tier == CRITICAL"
            - "HealthVisit.${visit_id}.triage_score == 77"
            - "HealthVisit.${visit_id}.triage_score != 87"
            - "HealthVisit.${visit_id}.requires_ems_review == false"

      - name: days_of_supply_rounds_each_lot_before_summing
        grounds:
          - calculations.school_days_of_supply
          - entities.MedicationStockLot.fields.days_of_supply
          - entities.School.fields.epinephrine_days_of_supply
          - entities.School.fields.albuterol_days_of_supply
          - entities.School.fields.stock_protocol_status
        distinguishing_aspect: |
          MODE (b) — nested rounding whose ORDER changes the cents: two
          EPINEPHRINE lots of 1 unit each round to 3.33 days apiece and sum to
          6.66, whereas summing the raw quotients first and rounding once gives
          6.67. The scaffold pins round-per-lot-then-sum-then-round, so the
          school field must read exactly 6.66.
        test_recipe:
          setup:
            - "School BEL03 with no nurses, no coverage blocks and no students."
            - "Two AVAILABLE stock-protocol EPINEPHRINE lots at that school, each holding exactly 1 unit, with different expiration dates so they are distinct rows."
            - "Logical clock left at its 2026-08-01T00:00:00Z default; both lots expire well after it."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Bell High", building_code: "BEL03", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-BEL-1", is_stock_protocol: true, initial_quantity: 1, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot1_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-BEL-2", is_stock_protocol: true, initial_quantity: 1, expiration_date: "2027-07-31T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot2_id: $.data.id }
          trigger:
            - call: "GET /health-office/medication-stock-lots/${lot1_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { lot1_dos: $.data.days_of_supply }
            - call: "GET /health-office/medication-stock-lots/${lot2_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { lot2_dos: $.data.days_of_supply }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { sch_epi_dos: $.data.epinephrine_days_of_supply }
          assert:
            - "MedicationStockLot.${lot1_id}.days_of_supply == 3.33"
            - "MedicationStockLot.${lot2_id}.days_of_supply == 3.33"
            - "School.${sch_id}.epinephrine_days_of_supply == 6.66"
            - "School.${sch_id}.epinephrine_days_of_supply != 6.67"
            - "School.${sch_id}.albuterol_days_of_supply == 0.0"
            - "School.${sch_id}.stock_protocol_status == DEPLETED"

  - rule_id: non_linear_state_machine
    instances:

      - name: authorization_consent_and_clinical_dimensions_move_independently
        grounds:
          - state_machines.MedicationAuthorization.CONSENT_GRANTED_to_CONSENT_WITHDRAWN
          - state_machines.MedicationAuthorization.CONSENT_WITHDRAWN_to_CONSENT_GRANTED
          - state_machines.MedicationAuthorization.UNVERIFIED_to_VERIFIED
          - state_machines.MedicationAuthorization.VERIFIED_to_SUSPENDED
          - entities.MedicationAuthorization.fields.consent_status
          - entities.MedicationAuthorization.fields.clinical_status
          - entities.MedicationAuthorization.fields.dispensable
        distinguishing_aspect: |
          Non-linear shape = PARALLEL STATE DIMENSIONS on the MedicationAuthorization
          row: consent_status cycles CONSENT_GRANTED -> CONSENT_WITHDRAWN ->
          CONSENT_GRANTED while clinical_status stays VERIFIED throughout, and a
          later SUSPEND moves clinical_status alone while consent_status stays
          CONSENT_GRANTED, so the row legally rests at (CONSENT_GRANTED, SUSPENDED).
        test_recipe:
          setup:
            - "School CAR04 with one RN on an ACTIVE Monday coverage block and one ENROLLED student."
            - "One PRN ALBUTEROL MedicationAuthorization for that student whose validity window 2026-07-01 .. 2027-06-30 brackets the default logical clock."
            - "The order has been consented (CONSENT_GRANTED) and clinically verified (VERIFIED), so dispensable is true before the trigger."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Carver Elementary", building_code: "CAR04", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Fay Lin", grade_level: 2, date_of_birth: "2018-03-14T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-authorizations"
              payload: { student_id: "${stu_id}", medication_code: "ALBUTEROL", route: "INHALED", dose_amount: 2, dose_unit: "PUFF", schedule_type: "PRN", prn_min_interval_minutes: 240, max_doses_per_day: 3, valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-06-30T00:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /health-office/medication-authorizations/${auth_id}/consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
            - call: "POST /health-office/medication-authorizations/${auth_id}/clinical-review"
              payload: { decision: "VERIFY" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { disp_before: $.data.dispensable }
          trigger:
            - call: "POST /health-office/medication-authorizations/${auth_id}/consent"
              payload: { decision: "WITHDRAW" }
              as: Guardian
              as_user_id: "${stu_id}"
              captures: { cs_after_withdraw: $.data.consent_status, cl_after_withdraw: $.data.clinical_status }
            - call: "POST /health-office/medication-authorizations/${auth_id}/consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
              captures: { cs_after_regrant: $.data.consent_status, disp_after_regrant: $.data.dispensable }
            - call: "POST /health-office/medication-authorizations/${auth_id}/clinical-review"
              payload: { decision: "SUSPEND" }
              as: SchoolPhysician
              as_user_id: "phys-md-01"
              captures: { cs_final: $.data.consent_status, cl_final: $.data.clinical_status, disp_final: $.data.dispensable }
          assert:
            - "After VERIFY: MedicationAuthorization.${auth_id}.dispensable == true"
            - "After WITHDRAW: MedicationAuthorization.${auth_id}.consent_status == CONSENT_WITHDRAWN"
            - "After WITHDRAW: MedicationAuthorization.${auth_id}.clinical_status == VERIFIED"
            - "After WITHDRAW: MedicationAuthorization.${auth_id}.dispensable == false"
            - "After re-GRANT: MedicationAuthorization.${auth_id}.consent_status == CONSENT_GRANTED"
            - "After re-GRANT: MedicationAuthorization.${auth_id}.clinical_status == VERIFIED"
            - "After re-GRANT: MedicationAuthorization.${auth_id}.dispensable == true"
            - "After SUSPEND: MedicationAuthorization.${auth_id}.consent_status == CONSENT_GRANTED"
            - "After SUSPEND: MedicationAuthorization.${auth_id}.clinical_status == SUSPENDED"
            - "After SUSPEND: MedicationAuthorization.${auth_id}.dispensable == false"
            - "All three trigger calls return 200; the pair (CONSENT_GRANTED, SUSPENDED) is a legal resting state"

      - name: health_visit_four_way_branch_then_reopen_cycle
        grounds:
          - state_machines.HealthVisit.IN_ASSESSMENT_to_DISPOSITIONED
          - state_machines.HealthVisit.CLOSED_to_REOPENED
          - state_machines.HealthVisit.REOPENED_to_IN_ASSESSMENT
          - entities.HealthVisit.fields.reopen_count
          - entities.HealthVisit.fields.disposition
          - entities.HealthVisit.fields.minutes_in_office
          - entities.School.fields.occupied_cot_count
        distinguishing_aspect: |
          Non-linear shape = BRANCHING FORK-JOIN PLUS A CYCLE on the HealthVisit
          entity (a different entity from the MedicationAuthorization instance):
          the same row first takes the RETURN_TO_CLASS branch (no guardian
          notification, no Screening displacement), then re-enters the machine via
          CLOSED -> REOPENED -> IN_ASSESSMENT and takes the SEND_HOME branch whose
          side-effect set is strictly different.
        test_recipe:
          setup:
            - "School DOV05 (cot_capacity 2) with one RN on an ACTIVE Monday block and one ENROLLED student whose profile scores intake_risk_score 0."
            - "No medication stock lots, so stock_protocol_status is DEPLETED and coverage_posture is LIMITED (coverage_penalty 8 in visit_triage_score)."
