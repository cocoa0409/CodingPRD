    instances:
      - name: density_bracket_boundary_15_00_versus_14_99
        grounds:
          - calculations.line_class_resolution
          - calculations.line_cube_and_density
          - entities.TariffVersion.fields.density_breaks
          - calculations.capture_variance_gate
        distinguishing_aspect: |
          The 15.00 pcf bracket edge is inclusive: a 1800 lb line on 120.00 cft measures exactly
          15.00 pcf and reclasses DOWN from declared class 85 to class 70 (a negative
          final_delta_cents of -7371), while an otherwise identical 1799 lb line measures 14.99 pcf,
          stays at class 85 and produces no notice at all.
