  - section: complexity_layers
    instances:
      - name: occ_stale_standard_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[standard-update-stale-version]", "errors[ERR_STALE_STANDARD_VERSION]"]
        distinguishing_aspect: "PUT /network/standards/{id} with the pre-update version is rejected 412; re-reading and re-sending the current version succeeds."
        test_recipe:
          setup: ["standard at version 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: NetworkManager }
            - { call: "POST /network/standards", payload: { specialty: "CARDIOLOGY", geo_class: "URBAN", max_members_per_provider: 1200, max_travel_minutes: 30, max_travel_miles: 15, max_wait_days_routine: 15, max_wait_days_urgent: 2 }, as: NetworkManager, captures: { std: "$.data.id", std_v: "$.data.version" } }
          trigger:
            - { call: "PUT /network/standards/${std}", payload: { expected_standard_version: "${std_v}", max_members_per_provider: 1100 }, as: NetworkManager, captures: { std_v2: "$.data.version" } }
            - { call: "PUT /network/standards/${std}", payload: { expected_standard_version: "${std_v}", max_members_per_provider: 1000 }, as: NetworkManager, captures: { err: "$.data.error_id" } }
          assert:
            - "first PUT succeeds and bumps version to 2"
            - "second PUT with stale version 1 -> 412 ERR_STALE_STANDARD_VERSION; max_members_per_provider remains 1100"

      - name: occ_stale_location_version_rejected
        claim_type: occ_stale_version
