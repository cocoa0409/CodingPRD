        grounds: [calculations.unsold_escalation]
        distinguishing_aspect: "First close-unsold increments unsold_count to 1 and returns the item to AUCTION_ELIGIBLE; the second reaches MAX_UNSOLD_CYCLES (>= 2) and escalates to DISPOSAL_PENDING with pending_disposal_method DESTRUCTION."
