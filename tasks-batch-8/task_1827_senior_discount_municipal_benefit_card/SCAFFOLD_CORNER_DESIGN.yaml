  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without X-User-Role/X-User-ID headers fails priority-1 authentication with ERR_UNAUTHENTICATED (401). The trigger below is sent WITHOUT any auth headers (the as: value only documents the intended role for the reader)."
        test_recipe:
          setup: ["one merchant exists so the target resource is valid"]
          setup_api_calls:
            - { call: "POST /senior-benefits/merchants", payload: { name: "Auth Deli", reimbursement_rate_pct: 25, monthly_reimbursement_cap_cents: 50000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
          trigger:
            - { call: "GET /senior-benefits/merchants/${m_id}", as: ProgramAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "with auth headers omitted: error_id == ERR_UNAUTHENTICATED, http 401"

      - name: specialist_cannot_create_merchant_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "EligibilitySpecialist is not in POST /merchants roles -> ERR_FORBIDDEN (403), even with a well-formed body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/merchants", payload: { name: "Spec Mart", reimbursement_rate_pct: 25, monthly_reimbursement_cap_cents: 50000 }, as: EligibilitySpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN, http 403"

      - name: auth_runs_before_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "An unauthenticated GET on a NONEXISTENT cardholder id returns 401 (priority 1), never 404 — resource existence is not leaked before authentication. Trigger is sent without auth headers."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "GET /senior-benefits/cardholders/00000000-0000-4000-8000-000000000000", as: ProgramAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "with auth headers omitted: error_id == ERR_UNAUTHENTICATED (401), NOT ERR_CARDHOLDER_NOT_FOUND"

      - name: existence_validates_path_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "With BOTH the application id and document id bogus, the review call returns ERR_APPLICATION_NOT_FOUND — the leftmost path resource is validated first."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications/00000000-0000-4000-8000-000000000000/documents/11111111-1111-4111-8111-111111111111/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_NOT_FOUND (http 404), not ERR_DOCUMENT_NOT_FOUND"

      - name: approver_who_reviewed_documents_segregation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.BenefitApplication.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "Segregation of duties is keyed on the PERSON (X-User-ID), not the role: the same user id 'spec-1' that verified documents cannot approve even when presenting the ProgramAdministrator role."
        test_recipe:
          setup: ["application UNDER_REVIEW with all three document types VERIFIED by X-User-ID 'spec-1' (also the intake reviewer)"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Seg Duty", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "43 Split St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "SD-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "SD-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "SD-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES, http 403"
            - "application remains UNDER_REVIEW"

      - name: analyst_cannot_clear_own_flag_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.UsageTransaction.FLAGGED_to_POSTED]
        distinguishing_aspect: "The fraud segregation pair: fraud-1 manually flagged the transaction, so fraud-1 cannot clear it (ERR_SEGREGATION_OF_DUTIES); a different analyst could."
        test_recipe:
          setup: ["cardholder onboarded; merchant + GROCERY offer; one POSTED transaction flagged by fraud-1"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Flag Self", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "44 Watch St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "FS-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "FS-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "FS-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Flag Store", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 100, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t1: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions/${t1}/flag", payload: { reason: "suspicious" }, as: FraudAnalyst, as_user_id: "fraud-1" }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions/${t1}/clear-flag", payload: {}, as: FraudAnalyst, as_user_id: "fraud-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES, http 403"
            - "transaction remains FLAGGED with flagged_by_user_id == 'fraud-1'"

      - name: approval_without_all_document_types_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_MISSING_REQUIRED_DOCUMENTS]", state_machines.BenefitApplication.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "Only PROOF_OF_AGE and PROOF_OF_INCOME are VERIFIED; approving without a VERIFIED PROOF_OF_RESIDENCY fails ERR_MISSING_REQUIRED_DOCUMENTS (422)."
