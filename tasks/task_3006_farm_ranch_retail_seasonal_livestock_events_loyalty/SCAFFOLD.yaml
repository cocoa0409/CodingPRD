# =============================================================================
# SCAFFOLD — Farm & Ranch Retail: Seasonal Livestock Events & Loyalty
# (chick-days live poultry, seasonal posture flips, weight-based bulk sales,
#  loyalty tiers with fuel-and-feed offers, BOPIS oversized load-out,
#  in-store pet wash / vet clinic events)
# =============================================================================

scenario: |
  Farm & Ranch Retail Seasonal Livestock Events & Loyalty Program (Tractor Supply Company): chick-days live poultry ordering with hatchery scheduling, minimum-purchase rules and brooder setup, live-animal care logs and mortality handling during the sale window, seasonal category flip between winter heating, spring planting and fall feed with planogram resets, bulk feed and propane exchange handling with weight-based pricing, loyalty program tier accrual with fuel-and-feed offers and receipt-free lookup, buy-online-pickup-in-store for oversized items requiring load-out assistance, pet wash station and vet clinic event scheduling inside the store

domain_name: farm-ranch-retail
api_prefix: "/"

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating   # Store.posture (derived from ACTIVE SeasonCampaign) gates chick sales, offer eligibility, accrual multipliers
  secondary_archetype: temporal_windowing    # chick sale windows, booking slot overlap, pickup windows, claim windows
  complexity_layers:
    - optimistic_concurrency                 # OCC on Store.version (campaign supersede) and LivestockLot.version (order create)
    - cascading_side_effects                 # mortality quarantine cascade; posture-flip cascade
    - dual_variant_calculation               # provisional-vs-final weight pricing; rolling-365 vs posture-season loyalty qualification
    - selector_policy                        # staging bay selection with eligibility/ranking/tie-break/empty-pool rules

  entity_topology: flat                      # peer resources with FK references; no URL nesting (except append-only logs)
  state_machine_shape: posture_driven        # compound: Store.posture = f(SeasonCampaign) gates child operations; ChickOrder and SeasonCampaign are cyclic; PickupOrder parallel
  relationship_patterns:
    - one_to_many
    - self_referential                       # LoyaltyLedgerEntry.related_entry_id -> LoyaltyLedgerEntry.id
    - cross_aggregate                        # ChickOrder references LivestockLot + LoyaltyAccount; WeightedSale references LoyaltyAccount
  role_model: hierarchical_override          # StoreAssociate < StoreManager < RegionalAdmin (each level can do everything below + more); Customer entity-backed; Anonymous for registration
  consistency_model: immediate               # all side effects atomic in the triggering request

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_name, type: string, source: input, description: "Store display name" }
      - { name: region_code, type: string, source: input, description: "Region code (e.g. TX-CENTRAL)" }
      - { name: posture, type: enum, source: computed, description: "OFFSEASON | WINTER_HEATING | SPRING_PLANTING | FALL_FEED — derived: season of the ACTIVE SeasonCampaign, else OFFSEASON. Recomputed on every campaign activation; recomputation increments Store.version.", constraints: "enum {OFFSEASON, WINTER_HEATING, SPRING_PLANTING, FALL_FEED}" }
      - { name: active_campaign_id, type: string, source: computed, description: "Id of the ACTIVE SeasonCampaign, null when OFFSEASON" }
      - { name: hazmat_gallons_used_today, type: number, source: computed, description: "Sum of propane gallons dispensed by FINALIZED PROPANE_EXCHANGE WeightedSales whose finalized_at calendar date (UTC, logical clock) equals the current logical date" }

  - name: SeasonCampaign
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store" }
      - { name: season, type: enum, source: input, description: "Season this campaign installs", constraints: "enum {WINTER_HEATING, SPRING_PLANTING, FALL_FEED}" }
      - { name: planogram_map, type: string, source: input, description: "Serialized planogram layout identifier for the category flip" }
      - { name: aisle_count, type: integer, source: input, description: "Total number of aisles the reset must touch; >= 1" }
      - { name: aisles_reset_count, type: integer, source: system, description: "Aisles reported reset at complete-reset; must equal aisle_count to advance", default: 0 }
      - { name: activated_at, type: datetime, source: system, description: "Logical timestamp when campaign became ACTIVE; null until activation", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT -> TEARDOWN -> VERIFY_PENDING -> READY -> ACTIVE; VERIFY_PENDING -> TEARDOWN on failed audit; non-terminal -> CANCELLED; ACTIVE -> COMPLETED when superseded", constraints: "enum {DRAFT, TEARDOWN, VERIFY_PENDING, READY, ACTIVE, COMPLETED, CANCELLED}" }

  - name: StagingBay
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store" }
      - { name: bay_no, type: integer, source: input, description: "Bay number; unique per store; >= 1" }
      - { name: size_class, type: enum, source: input, description: "Largest item class the bay can hold", constraints: "enum {M, L, XL}; capacity order M < L < XL" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OCCUPIED | OUT_OF_SERVICE", default: "AVAILABLE", constraints: "enum {AVAILABLE, OCCUPIED, OUT_OF_SERVICE}" }

  - name: HatcherySchedule
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store" }
      - { name: species, type: string, source: input, description: "Species code (e.g. CHICKEN_LAYER, CHICKEN_MEAT, DUCK)" }
      - { name: breed, type: string, source: input, description: "Breed label (e.g. Rhode Island Red)" }
      - { name: hatch_date, type: datetime, source: input, description: "Hatch date (ISO8601); sale window must start on or after hatch_date + 1 day" }
      - { name: sale_window_start, type: datetime, source: input, description: "First instant birds may be sold (inclusive, closed interval)" }
      - { name: sale_window_end, type: datetime, source: input, description: "Last instant birds may be sold (inclusive, closed interval); must be > sale_window_start" }
      - { name: daily_capacity, type: integer, source: input, description: "Max birds reserved across all lots of this schedule per calendar day (UTC logical); >= 1" }
      - { name: min_purchase_qty, type: integer, source: input, description: "Minimum birds per ChickOrder; >= 1" }
      - { name: base_price_cents_per_bird, type: integer, source: input, description: "Unit price before volume discount; >= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> CLOSED; DRAFT -> CANCELLED", constraints: "enum {DRAFT, PUBLISHED, CLOSED, CANCELLED}" }

  - name: LivestockLot
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store" }
      - { name: hatchery_schedule_id, type: string, source: input, description: "FK -> HatcherySchedule.id; schedule this lot was received under" }
      - { name: quantity_received, type: integer, source: input, description: "Birds received from hatchery; >= 1" }
      - { name: received_at, type: datetime, source: input, description: "Logical timestamp the lot was received" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "quantity_received - quantity_sold - mortality_count - quantity_quarantined - reserved_not_yet_fulfilled. Decremented at reservation, released at cancellation (unless lot SUSPENDED, then released into quantity_quarantined)" }
      - { name: quantity_sold, type: integer, source: system, description: "Birds fulfilled", default: 0 }
      - { name: mortality_count, type: integer, source: system, description: "In-store deaths recorded via MORTALITY CareLogEntries", default: 0 }
      - { name: quantity_quarantined, type: integer, source: system, description: "Reserved birds released into quarantine when their orders cancel while lot is SUSPENDED", default: 0 }
      - { name: mortality_rate, type: number, source: computed, description: "mortality_count / quantity_received, 4 decimal places round_half_up; rate > 0.05 triggers quarantine" }
      - { name: health_flag, type: enum, source: system, description: "NORMAL | QUARANTINED", default: "NORMAL", constraints: "enum {NORMAL, QUARANTINED}" }
      - { name: status, type: enum, source: system, description: "RECEIVING -> ON_SALE -> SALE_CLOSED -> DISPOSITIONED; ON_SALE -> SUSPENDED on quarantine; SUSPENDED -> SALE_CLOSED", constraints: "enum {RECEIVING, ON_SALE, SUSPENDED, SALE_CLOSED, DISPOSITIONED}" }

  - name: CareLogEntry
    parent: null
    common_fields: false   # append-only: id + created_at only
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> LivestockLot.id; lot being cared for" }
      - { name: entry_type, type: enum, source: input, description: "Kind of care event", constraints: "enum {FEEDING, WATER, TEMPERATURE, MORTALITY}" }
      - { name: measured_temp_f, type: number, source: input, description: "Brooder temperature in Fahrenheit; required when entry_type == TEMPERATURE", default: null }
      - { name: mortality_count, type: integer, source: input, description: "Dead birds found; required (>= 1) when entry_type == MORTALITY", default: null }
      - { name: note, type: string, source: input, description: "Free-text note", default: null }

  - name: ChickOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; selling store" }
      - { name: livestock_lot_id, type: string, source: input, description: "FK -> LivestockLot.id; lot the birds come from" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; ordering member (receipt-free identity)" }
      - { name: quantity, type: integer, source: input, description: "Birds ordered; >= schedule.min_purchase_qty" }
      - { name: pickup_date, type: datetime, source: input, description: "Intended pickup date; must fall inside the schedule sale window" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of schedule.base_price_cents_per_bird at reservation" }
      - { name: discount_pct, type: number, source: computed, description: "Volume discount bracket: 0.00 for 6-24, 0.10 for 25-49, 0.15 for >= 50 (brackets keyed on quantity)" }
      - { name: total_cents, type: integer, source: computed, description: "chick_order_total: round_half_up(quantity * unit_price_cents * (1 - discount_pct)) — line-level round, single line per order" }
      - { name: brooder_verified_at, type: datetime, source: system, description: "Logical timestamp of last successful brooder verification; null until verified. Stale after 72 hours.", default: null }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical fulfillment timestamp; null until fulfilled", default: null }
      - { name: claim_status, type: enum, source: system, description: "NONE | CLAIMED | APPROVED | REJECTED — post-purchase mortality guarantee claim", default: "NONE", constraints: "enum {NONE, CLAIMED, APPROVED, REJECTED}" }
      - { name: claimed_mortality_count, type: integer, source: system, description: "Birds in the currently open claim", default: 0 }
      - { name: approved_claim_count, type: integer, source: system, description: "Cumulative birds approved across claims", default: 0 }
      - { name: refund_cents, type: integer, source: system, description: "Cumulative approved refund", default: 0 }
      - { name: status, type: enum, source: system, description: "RESERVED -> BROODER_VERIFIED -> FULFILLED; BROODER_VERIFIED -> RESERVED on stale verification; RESERVED|BROODER_VERIFIED -> CANCELLED | EXPIRED", constraints: "enum {RESERVED, BROODER_VERIFIED, FULFILLED, CANCELLED, EXPIRED}" }

  - name: WeightedSale
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; selling store" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; optional member for points accrual/redemption", default: null }
      - { name: sale_kind, type: enum, source: input, description: "FEED_BULK | PROPANE_EXCHANGE", constraints: "enum {FEED_BULK, PROPANE_EXCHANGE}" }
      - { name: container_class, type: enum, source: input, description: "Container tare class", constraints: "enum {BAG_50, DRUM, TOTE, CYLINDER_20}; CYLINDER_20 mandatory for PROPANE_EXCHANGE" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Scale reading at creation; > 0" }
      - { name: provisional_tare_lbs, type: number, source: computed, description: "Standard tare from container class table: BAG_50=2, DRUM=20, TOTE=60, CYLINDER_20=17" }
      - { name: measured_tare_lbs, type: number, source: input, description: "Actual tare recorded at finalize; > 0 and <= gross_weight_lbs", default: null }
      - { name: provisional_total_cents, type: integer, source: computed, description: "weighted_sale_provisional_price at creation" }
      - { name: final_total_cents, type: integer, source: computed, description: "weighted_sale_final_price at finalize; null until FINALIZED", default: null }
      - { name: propane_gallons, type: number, source: computed, description: "PROPANE_EXCHANGE only: min(net_weight_lbs / 4.24, 20.0) rounded to 2dp half-up; 0 for FEED_BULK" }
      - { name: redeem_points, type: integer, source: input, description: "Loyalty points to redeem at finalize (1 point = 1 cent discount); requires loyalty_account_id", default: 0 }
      - { name: points_redeemed, type: integer, source: system, description: "Points actually debited at finalize", default: 0 }
      - { name: finalized_at, type: datetime, source: system, description: "Logical finalize timestamp", default: null }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> FINALIZED; PROVISIONAL -> VOIDED", constraints: "enum {PROVISIONAL, FINALIZED, VOIDED}" }

  - name: LoyaltyAccount
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: phone, type: string, source: input, description: "Phone number; unique across all accounts; receipt-free lookup key" }
      - { name: email, type: string, source: input, description: "Optional email", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> SUSPENDED; ACTIVE -> CLOSED", constraints: "enum {ACTIVE, SUSPENDED, CLOSED}" }
      - { name: tier, type: enum, source: computed, description: "NEIGHBOR | RANCH_HAND | HOMESTEAD; re-evaluated after every ledger write from tier_qualifying_points: >= 7500 HOMESTEAD, >= 2500 RANCH_HAND, else NEIGHBOR", constraints: "enum {NEIGHBOR, RANCH_HAND, HOMESTEAD}" }
      - { name: points_balance, type: integer, source: computed, description: "Sum of points_delta over ALL ledger entries; never negative (redemptions validated)" }
      - { name: tier_qualifying_points, type: integer, source: computed, description: "loyalty_tier_evaluation: chronological rolling sum of points_delta over entries with counts_toward_tier == true created in [now - 365 days, now] (inclusive both ends, logical clock)" }

  - name: LoyaltyLedgerEntry
    parent: null
    common_fields: false   # append-only: id + created_at only
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; owning account" }
      - { name: entry_type, type: enum, source: input, description: "ACCRUAL | REDEMPTION | ADJUSTMENT | REVERSAL", constraints: "enum {ACCRUAL, REDEMPTION, ADJUSTMENT, REVERSAL}" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; store where the earn/burn happened; required for ACCRUAL and REDEMPTION", default: null }
      - { name: base_amount_cents, type: integer, source: input, description: "Purchase subtotal in cents; required (> 0) for ACCRUAL", default: null }
      - { name: earn_context, type: enum, source: input, description: "FEED | FUEL | OTHER; required for ACCRUAL", default: null, constraints: "enum {FEED, FUEL, OTHER}" }
      - { name: points_delta, type: integer, source: computed, description: "For ACCRUAL computed by loyalty_points_accrual; for REDEMPTION/ADJUSTMENT/REVERSAL taken from client input (REDEMPTION must be negative, REVERSAL sign must oppose the referenced entry)" }
      - { name: related_entry_id, type: string, source: input, description: "FK -> LoyaltyLedgerEntry.id; required for REVERSAL (the entry being reversed)", default: null }
      - { name: counts_toward_tier, type: boolean, source: computed, description: "true for ACCRUAL and REVERSAL, false for REDEMPTION and ADJUSTMENT" }
      - { name: posture_at_entry, type: string, source: computed, description: "Store.posture at the entry's store at creation time (OFFSEASON when store_id null)" }

  - name: PickupOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; pickup store" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; ordering member" }
      - { name: item_sku, type: string, source: input, description: "Oversized item SKU" }
      - { name: item_size_class, type: enum, source: input, description: "M | L | XL", constraints: "enum {M, L, XL}" }
      - { name: requires_loadout_assistance, type: boolean, source: input, description: "True when customer needs associate load-out help" }
      - { name: staging_bay_id, type: string, source: computed, description: "FK -> StagingBay.id; assigned by staging_bay_selection at stage time; null until staged", default: null }
      - { name: ready_at, type: datetime, source: system, description: "Logical timestamp when marked ready", default: null }
      - { name: pickup_deadline, type: datetime, source: computed, description: "ready_at + 5 days; completing after this instant expires the order", default: null }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED -> STAGED -> READY_FOR_PICKUP -> COMPLETED; PLACED|STAGED|READY_FOR_PICKUP -> CANCELLED; READY_FOR_PICKUP -> EXPIRED", constraints: "enum {PLACED, STAGED, READY_FOR_PICKUP, COMPLETED, CANCELLED, EXPIRED}" }
      - { name: loadout_status, type: enum, source: system, description: "NOT_REQUIRED | ASSISTANCE_REQUESTED -> LOADOUT_DONE; independent parallel dimension", constraints: "enum {NOT_REQUIRED, ASSISTANCE_REQUESTED, LOADOUT_DONE}" }

  - name: ServiceEvent
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; hosting store" }
      - { name: event_kind, type: enum, source: input, description: "PET_WASH | VET_CLINIC", constraints: "enum {PET_WASH, VET_CLINIC}" }
      - { name: resource_name, type: string, source: input, description: "Physical resource identifier (e.g. wash-bay-1, clinic-room); overlap checks are per (event_kind's store, resource_name)" }
      - { name: event_date, type: datetime, source: input, description: "Calendar date (00:00:00Z) of the event" }
      - { name: slot_window_start, type: datetime, source: input, description: "First bookable slot start (inclusive)" }
      - { name: slot_window_end, type: datetime, source: input, description: "End of last bookable slot (exclusive upper bound for slot_end)" }
      - { name: slot_length_minutes, type: integer, source: input, description: "Duration of each booking slot; >= 5" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, description: "Mandatory gap around each booking's effective occupancy; 0 for open resources", default: 0 }
      - { name: capacity_per_slot, type: integer, source: input, description: "Max overlapping bookings on the resource; >= 1" }
      - { name: requires_vaccine_record, type: boolean, source: input, description: "True for vet clinic events requiring confirmed vaccine records" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PUBLISHED -> COMPLETED; DRAFT|PUBLISHED -> CANCELLED", constraints: "enum {DRAFT, PUBLISHED, COMPLETED, CANCELLED}" }

  - name: EventBooking
    parent: null
    common_fields: true
    fields:
      - { name: service_event_id, type: string, source: input, description: "FK -> ServiceEvent.id; event being booked" }
      - { name: loyalty_account_id, type: string, source: input, description: "FK -> LoyaltyAccount.id; booking member" }
      - { name: slot_start, type: datetime, source: input, description: "Slot start; must be >= slot_window_start and slot_start + slot_length_minutes <= slot_window_end, on event_date" }
      - { name: slot_end, type: datetime, source: computed, description: "slot_start + event.slot_length_minutes" }
      - { name: vaccine_record_confirmed, type: boolean, source: input, description: "Required true when event.requires_vaccine_record", default: false }
      - { name: status, type: enum, source: system, description: "BOOKED -> CHECKED_IN -> COMPLETED; BOOKED -> NO_SHOW; BOOKED -> CANCELLED", constraints: "enum {BOOKED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Store
    initial_state: OFFSEASON   # posture pseudo-state; derived field, not a stored lifecycle
    terminal_states: []
    transitions:
      - from: "*"
        to: "<season of newly activated campaign>"
        trigger: "POST /season-campaigns/{id}/activate (derived recompute)"
        actor: system
        preconditions:
          - "campaign transitioned READY -> ACTIVE"
        side_effects:
          - "Store.posture := campaign.season; Store.active_campaign_id := campaign.id; Store.version += 1; Store.updated_at refreshed"
          - "posture_cascade_on_activation runs (see calculations.posture_cascade_on_activation)"

  - entity: SeasonCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: TEARDOWN
        trigger: "POST /season-campaigns/{id}/begin-teardown"
        actor: StoreManager
        preconditions:
          - "campaign.status == DRAFT (ERR_CAMPAIGN_NOT_IN_DRAFT)"
        side_effects: []
      - from: TEARDOWN
        to: VERIFY_PENDING
        trigger: "POST /season-campaigns/{id}/complete-reset"
        actor: StoreManager
        preconditions:
          - "campaign.status == TEARDOWN (ERR_CAMPAIGN_NOT_IN_TEARDOWN)"
          - "aisles_reset_count input == campaign.aisle_count (ERR_AISLE_COUNT_MISMATCH)"
        side_effects:
          - "aisles_reset_count := input value"
      - from: VERIFY_PENDING
        to: READY
        trigger: "POST /season-campaigns/{id}/verify with audit_passed=true"
        actor: RegionalAdmin
        preconditions:
          - "campaign.status == VERIFY_PENDING (ERR_CAMPAIGN_NOT_VERIFY_PENDING)"
        side_effects: []
      - from: VERIFY_PENDING
        to: TEARDOWN
        trigger: "POST /season-campaigns/{id}/verify with audit_passed=false"
        actor: RegionalAdmin
        preconditions:
          - "campaign.status == VERIFY_PENDING (ERR_CAMPAIGN_NOT_VERIFY_PENDING)"
        side_effects:
          - "aisles_reset_count := 0 (rework required; cycle TEARDOWN -> VERIFY_PENDING may repeat)"
      - from: READY
        to: ACTIVE
        trigger: "POST /season-campaigns/{id}/activate"
        actor: RegionalAdmin
        preconditions:
          - "campaign.status == READY (ERR_CAMPAIGN_NOT_READY)"
          - "expected_store_version == Store.version (OCC, ERR_STALE_STORE_VERSION)"
        side_effects:
          - "hop1: any other ACTIVE SeasonCampaign on the same store -> COMPLETED (supersede)"
          - "hop2: Store.posture recomputed from this campaign.season; Store.version += 1"
          - "hop3: posture_cascade_on_activation — if new posture != SPRING_PLANTING: every PUBLISHED HatcherySchedule on this store -> CLOSED"
          - "hop4: each schedule closure -> every ON_SALE LivestockLot under it -> SALE_CLOSED"
          - "hop5: each lot closure -> every RESERVED or BROODER_VERIFIED ChickOrder against it -> EXPIRED, reserved quantity released back to quantity_on_hand"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /season-campaigns/{id}/cancel"
        actor: RegionalAdmin
        preconditions: []
        side_effects: []
      - from: TEARDOWN
        to: CANCELLED
        trigger: "POST /season-campaigns/{id}/cancel"
        actor: RegionalAdmin
        preconditions: []
        side_effects: []
      - from: VERIFY_PENDING
        to: CANCELLED
        trigger: "POST /season-campaigns/{id}/cancel"
        actor: RegionalAdmin
        preconditions: []
        side_effects: []

  - entity: HatcherySchedule
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /hatchery-schedules/{id}/publish"
        actor: StoreManager
        preconditions:
          - "schedule.status == DRAFT (ERR_SCHEDULE_NOT_DRAFT)"
          - "schedule_window_gap_check passes (ERR_SCHEDULE_WINDOW_OVERLAP)"
        side_effects: []
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /hatchery-schedules/{id}/close OR system cascade from posture flip"
        actor: "StoreManager | system"
        preconditions:
          - "schedule.status == PUBLISHED (ERR_SCHEDULE_NOT_PUBLISHED)"
        side_effects:
          - "every ON_SALE LivestockLot under this schedule -> SALE_CLOSED"
          - "each lot closure -> every RESERVED or BROODER_VERIFIED ChickOrder against it -> EXPIRED, reserved quantity released back to quantity_on_hand"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /hatchery-schedules/{id}/close with reason=CANCELLED"
        actor: StoreManager
        preconditions:
          - "schedule.status == DRAFT (ERR_SCHEDULE_NOT_DRAFT)"
        side_effects: []

  - entity: LivestockLot
    initial_state: RECEIVING
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: RECEIVING
        to: ON_SALE
        trigger: "POST /livestock-lots/{id}/open-sale"
        actor: StoreManager
        preconditions:
          - "lot.status == RECEIVING (ERR_LOT_NOT_RECEIVING)"
          - "parent HatcherySchedule.status == PUBLISHED (ERR_SCHEDULE_NOT_PUBLISHED)"
          - "now within [sale_window_start, sale_window_end] of the schedule (ERR_OUTSIDE_SALE_WINDOW)"
        side_effects: []
      - from: ON_SALE
        to: SUSPENDED
        trigger: "system (care_log_mortality_rate recomputation after a MORTALITY CareLogEntry pushes mortality_rate > 0.05)"
        actor: system
        preconditions:
          - "mortality_rate > 0.05"
        side_effects:
          - "health_flag := QUARANTINED"
          - "every RESERVED or BROODER_VERIFIED ChickOrder against this lot -> CANCELLED (system cause QUARANTINE); reserved quantity released into quantity_quarantined (NOT back to quantity_on_hand)"
          - "each such cancellation posts a LoyaltyLedgerEntry ADJUSTMENT of +QUARANTINE_GOODWILL_POINTS (500) to the order's loyalty_account_id"
      - from: ON_SALE
        to: SALE_CLOSED
        trigger: "POST /livestock-lots/{id}/close-sale OR system cascade from schedule close"
        actor: "StoreManager | system"
        preconditions:
          - "lot.status == ON_SALE (ERR_LOT_NOT_ON_SALE)"
        side_effects:
          - "every RESERVED or BROODER_VERIFIED ChickOrder against this lot -> EXPIRED, reserved quantity released back to quantity_on_hand"
      - from: SUSPENDED
        to: SALE_CLOSED
        trigger: "POST /livestock-lots/{id}/close-sale"
        actor: StoreManager
        preconditions:
          - "lot.status == SUSPENDED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SALE_CLOSED
        to: DISPOSITIONED
        trigger: "POST /livestock-lots/{id}/close-sale with disposition=true"
        actor: StoreManager
        preconditions:
          - "lot.status == SALE_CLOSED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: ChickOrder
    initial_state: RESERVED
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    transitions:
      - from: RESERVED
        to: BROODER_VERIFIED
        trigger: "POST /chick-orders/{id}/verify-brooder"
        actor: StoreAssociate
        preconditions:
          - "order.status == RESERVED (ERR_ORDER_NOT_RESERVED)"
          - "all three brooder flags true: heat_lamp_ok, thermometer_ok, bedding_ok (ERR_BROODER_CHECK_FAILED)"
        side_effects:
          - "brooder_verified_at := now (logical clock)"
      - from: BROODER_VERIFIED
        to: FULFILLED
        trigger: "POST /chick-orders/{id}/fulfill"
        actor: StoreAssociate
        preconditions:
          - "order.status == BROODER_VERIFIED; an order already moved to CANCELLED/EXPIRED by a cascade fails with ERR_INVALID_STATE_TRANSITION; an order still RESERVED fails with ERR_ORDER_NOT_VERIFIED"
          - "now <= brooder_verified_at + 72 hours, else order reverts BROODER_VERIFIED -> RESERVED and call fails (ERR_BROODER_VERIFICATION_EXPIRED)"
          - "order.livestock_lot_id -> LivestockLot.status == ON_SALE (ERR_LOT_NOT_ON_SALE)"
          - "now <= schedule.sale_window_end + 48 hours grace, else order -> EXPIRED and call fails (ERR_SALE_WINDOW_CLOSED)"
          - "care_log_freshness: lot has at least one CareLogEntry with created_at >= now - 12 hours (ERR_CARE_LOG_STALE)"
        side_effects:
          - "fulfilled_at := now; lot.quantity_sold += quantity; lot.quantity_on_hand unchanged (reservation converts to sale)"
      - from: BROODER_VERIFIED
        to: RESERVED
        trigger: "system (revert on stale verification detected at fulfill time)"
        actor: system
        preconditions:
          - "now > brooder_verified_at + 72 hours"
        side_effects:
          - "brooder_verified_at := null"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /chick-orders/{id}/cancel OR system (lot quarantine)"
        actor: "Customer | StoreManager | system"
        preconditions:
          - "order.status == RESERVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "reserved quantity released: lot.quantity_on_hand += quantity when lot not SUSPENDED; lot.quantity_quarantined += quantity when lot SUSPENDED"
          - "when cause is quarantine: LoyaltyLedgerEntry ADJUSTMENT +500 (QUARANTINE_GOODWILL_POINTS) posted to order's account"
      - from: BROODER_VERIFIED
        to: CANCELLED
        trigger: "POST /chick-orders/{id}/cancel OR system (lot quarantine)"
        actor: "Customer | StoreManager | system"
        preconditions:
          - "order.status == BROODER_VERIFIED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "same release semantics as RESERVED -> CANCELLED"
      - from: RESERVED
        to: EXPIRED
        trigger: "system (lot closure cascade, or fulfill attempt past sale_window_end + 48h)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved quantity released back to lot.quantity_on_hand"
      - from: BROODER_VERIFIED
        to: EXPIRED
        trigger: "system (lot closure cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved quantity released back to lot.quantity_on_hand"

  - entity: WeightedSale
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /weighted-sales/{id}/finalize"
        actor: StoreAssociate
        preconditions:
          - "sale.status == PROVISIONAL (ERR_SALE_NOT_PROVISIONAL)"
          - "measured_tare_lbs <= gross_weight_lbs (ERR_TARE_EXCEEDS_GROSS)"
          - "PROPANE_EXCHANGE: store.hazmat_gallons_used_today + propane_gallons <= HAZMAT_DAILY_CAP_GAL (ERR_HAZMAT_DAILY_CAP_EXCEEDED)"
          - "redeem_points > 0 requires loyalty_account_id present and LoyaltyAccount.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "redeem_points <= account.points_balance (ERR_INSUFFICIENT_POINTS)"
        side_effects:
          - "final_total_cents computed via weighted_sale_final_price; finalized_at := now"
          - "redeem_points > 0: LoyaltyLedgerEntry REDEMPTION (-redeem_points, counts_toward_tier=false) posted; points_redeemed := redeem_points"
          - "loyalty_account_id present: LoyaltyLedgerEntry ACCRUAL posted for (final_total_cents - points_redeemed) with earn_context FEED for FEED_BULK, FUEL for PROPANE_EXCHANGE"
      - from: PROVISIONAL
        to: VOIDED
        trigger: "POST /weighted-sales/{id}/void"
        actor: StoreManager
        preconditions:
          - "sale.status == PROVISIONAL (ERR_SALE_NOT_PROVISIONAL)"
        side_effects: []

  - entity: LoyaltyAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /loyalty-accounts/{id}/set-status status=SUSPENDED"
        actor: StoreManager
        preconditions:
          - "account.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /loyalty-accounts/{id}/set-status status=ACTIVE"
        actor: StoreManager
        preconditions:
          - "account.status == SUSPENDED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /loyalty-accounts/{id}/set-status status=CLOSED"
        actor: StoreManager
        preconditions:
          - "account.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: PickupOrder
    initial_state: "fulfillment=PLACED, loadout=NOT_REQUIRED (parallel dimensions)"
    terminal_states: [COMPLETED, CANCELLED, EXPIRED]   # fulfillment dimension; loadout dimension freezes with it
    transitions:
      - from: PLACED
        to: STAGED
        trigger: "POST /pickup-orders/{id}/stage"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == PLACED (ERR_INVALID_STATE_TRANSITION)"
          - "staging_bay_selection finds a bay (ERR_NO_STAGING_BAY_AVAILABLE)"
        side_effects:
          - "staging_bay_id := selected bay; StagingBay.status := OCCUPIED"
      - from: STAGED
        to: READY_FOR_PICKUP
        trigger: "POST /pickup-orders/{id}/mark-ready"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == STAGED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "ready_at := now; pickup_deadline := now + 5 days"
      - from: READY_FOR_PICKUP
        to: COMPLETED
        trigger: "POST /pickup-orders/{id}/complete"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == READY_FOR_PICKUP (ERR_INVALID_STATE_TRANSITION)"
          - "if loadout_status == ASSISTANCE_REQUESTED then loadout must already be LOADOUT_DONE (ERR_LOADOUT_NOT_COMPLETED)"
          - "now <= pickup_deadline, else order -> EXPIRED and call fails (ERR_PICKUP_WINDOW_EXPIRED)"
        side_effects:
          - "StagingBay.status := AVAILABLE (release)"
      - from: READY_FOR_PICKUP
        to: EXPIRED
        trigger: "system (complete attempted after pickup_deadline)"
        actor: system
        preconditions:
          - "now > pickup_deadline"
        side_effects:
          - "StagingBay.status := AVAILABLE (release)"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /pickup-orders/{id}/cancel"
        actor: "Customer | StoreManager"
        preconditions:
          - "fulfillment_status in {PLACED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: STAGED
        to: CANCELLED
        trigger: "POST /pickup-orders/{id}/cancel"
        actor: "Customer | StoreManager"
        preconditions:
          - "fulfillment_status in {STAGED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "StagingBay.status := AVAILABLE (release)"
      - from: READY_FOR_PICKUP
        to: CANCELLED
        trigger: "POST /pickup-orders/{id}/cancel"
        actor: "Customer | StoreManager"
        preconditions:
          - "fulfillment_status in {READY_FOR_PICKUP} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "StagingBay.status := AVAILABLE (release)"
      - from: "loadout NOT_REQUIRED"
        to: "loadout ASSISTANCE_REQUESTED"
        trigger: "POST /pickup-orders/{id}/request-loadout"
        actor: Customer
        preconditions:
          - "fulfillment_status == READY_FOR_PICKUP (ERR_INVALID_STATE_TRANSITION)"
          - "requires_loadout_assistance == true (ERR_LOADOUT_NOT_APPLICABLE)"
          - "loadout_status == NOT_REQUIRED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: "loadout ASSISTANCE_REQUESTED"
        to: "loadout LOADOUT_DONE"
        trigger: "POST /pickup-orders/{id}/complete-loadout"
        actor: StoreAssociate
        preconditions:
          - "loadout_status == ASSISTANCE_REQUESTED (ERR_INVALID_STATE_TRANSITION)"
          - "fulfillment_status == READY_FOR_PICKUP (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: ServiceEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /service-events/{id}/publish"
        actor: StoreManager
        preconditions:
          - "event.status == DRAFT (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: PUBLISHED
        to: COMPLETED
        trigger: "system (read-time derivation: now > slot_window_end and no BOOKED or CHECKED_IN bookings remain)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /service-events/{id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects: []
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /service-events/{id}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects:
          - "every BOOKED or CHECKED_IN EventBooking -> CANCELLED"

  - entity: EventBooking
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /event-bookings/{id}/check-in"
        actor: StoreAssociate
        preconditions:
          - "booking.status == BOOKED (ERR_INVALID_STATE_TRANSITION)"
          - "now >= slot_start - 15 minutes and now <= slot_end (ERR_OUTSIDE_CHECKIN_WINDOW)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /event-bookings/{id}/complete"
        actor: StoreAssociate
        preconditions:
          - "booking.status == CHECKED_IN (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /event-bookings/{id}/mark-no-show"
        actor: StoreAssociate
        preconditions:
          - "booking.status == BOOKED (ERR_INVALID_STATE_TRANSITION)"
          - "now > slot_end (ERR_BOOKING_NOT_EXPIRED)"
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /event-bookings/{id}/cancel OR system (event cancelled)"
        actor: "Customer | StoreManager | system"
        preconditions:
          - "booking.status == BOOKED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (event cancelled)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: campaign-activate-stale-store
    parent_entity: Store
    write_endpoint: "POST /season-campaigns/{id}/activate"
    occ_field: "expected_store_version"
    description: |
      Activating a SeasonCampaign against a Store whose version has advanced
      since the client last observed it is rejected. Activation legitimately
      supersedes any currently ACTIVE campaign on the store (the prior
      campaign completes), so a writer holding a stale store version is
      acting on an out-of-date view of which campaign is live.
    error_id: ERR_STALE_STORE_VERSION
    http_status: 412

  - rule_id: chick-order-create-stale-lot
    parent_entity: LivestockLot
    write_endpoint: "POST /chick-orders"
    occ_field: "expected_livestock_lot_version"
    description: |
      Creating a ChickOrder against a LivestockLot whose version has advanced
      since the client last observed it is rejected. Reservation legitimately
      decrements the lot's sellable quantity, so a writer holding a stale lot
      version is deciding on an out-of-date view of remaining availability.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: weighted_sale_provisional_price
    trigger: "POST /weighted-sales (creation)"
    algorithm: tiered_pricing
    formula: |
      net_lbs = gross_weight_lbs - provisional_tare_lbs   # provisional_tare from container class table
      if sale_kind == FEED_BULK:
        # marginal tiers, per-pound rates in cents
        tier1 = min(net_lbs, 50) * 40
        tier2 = min(max(net_lbs - 50, 0), 150) * 35
        tier3 = max(net_lbs - 200, 0) * 30
        price_cents = tier1 + tier2 + tier3
      if sale_kind == PROPANE_EXCHANGE:
        gallons = min(net_lbs / 4.24, 20.0) rounded to 2dp half_up
        price_cents = 1999 + round_half_up(gallons * 349)
      provisional_total_cents = round_half_up(price_cents)  # final rounding after all components
    input_set: "the WeightedSale being created; container class tare table constants"
    constants:
      TARE_BAG_50_LBS: 2
      TARE_DRUM_LBS: 20
      TARE_TOTE_LBS: 60
      TARE_CYLINDER_20_LBS: 17
      FEED_TIER1_LIMIT_LBS: 50
      FEED_TIER1_RATE_CENTS: 40
      FEED_TIER2_LIMIT_LBS: 150
      FEED_TIER2_RATE_CENTS: 35
      FEED_TIER3_RATE_CENTS: 30
      PROPANE_LBS_PER_GAL: 4.24
      PROPANE_CYLINDER_MAX_GAL: 20.0
      PROPANE_EXCHANGE_FLAT_CENTS: 1999
      PROPANE_PER_GAL_CENTS: 349
    precision: "integer cents; intermediate gallons 2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at creation; tare taken from the standard container-class table"
        difference: "uses provisional_tare_lbs (class table), so identical gross weights price differently once a measured tare is known"
      - name: final
        when: "at finalize; tare measured at the scale"
        difference: "uses measured_tare_lbs; see weighted_sale_final_price"

  - name: weighted_sale_final_price
    trigger: "POST /weighted-sales/{id}/finalize"
    algorithm: tiered_pricing
    formula: |
      Same tier structure as weighted_sale_provisional_price but:
        net_lbs = gross_weight_lbs - measured_tare_lbs
      Then: net_of_redemption = price_cents - points_redeemed  (1 point = 1 cent; floor 0)
      final_total_cents = max(net_of_redemption, 0)
      Evaluation order is pinned: (1) net weight, (2) tier/gallon price, (3) rounding to cents, (4) point redemption subtraction.
    input_set: "the WeightedSale being finalized; its measured_tare_lbs; points_redeemed"
    constants:
      TARE_BAG_50_LBS: 2
      TARE_DRUM_LBS: 20
      TARE_TOTE_LBS: 60
      TARE_CYLINDER_20_LBS: 17
      FEED_TIER1_LIMIT_LBS: 50
      FEED_TIER1_RATE_CENTS: 40
      FEED_TIER2_LIMIT_LBS: 150
      FEED_TIER2_RATE_CENTS: 35
      FEED_TIER3_RATE_CENTS: 30
      PROPANE_LBS_PER_GAL: 4.24
      PROPANE_CYLINDER_MAX_GAL: 20.0
      PROPANE_EXCHANGE_FLAT_CENTS: 1999
      PROPANE_PER_GAL_CENTS: 349
    precision: "integer cents, round_half_up; gallons 2dp round_half_up"
    variants:
      - name: provisional
        when: "creation (see weighted_sale_provisional_price)"
        difference: "class-table tare"
      - name: final
        when: "finalize"
        difference: "measured tare; identical inputs at creation vs finalize can therefore price differently"

  - name: chick_order_total
    trigger: "POST /chick-orders (reservation)"
    algorithm: aggregation
    formula: |
      discount_pct = 0.00 if quantity <= 24
                   = 0.10 if 25 <= quantity <= 49
                   = 0.15 if quantity >= 50
      # Rounding order is PINNED: discount the line first, round the line to cents, then sum lines.
      # Each ChickOrder has exactly one line, so:
      total_cents = round_half_up(quantity * unit_price_cents * (1 - discount_pct))
    input_set: "the order quantity and the unit price snapshot from the HatcherySchedule"
    constants:
      VOLUME_TIER2_MIN_QTY: 25
      VOLUME_TIER2_DISCOUNT: 0.10
      VOLUME_TIER3_MIN_QTY: 50
      VOLUME_TIER3_DISCOUNT: 0.15
    precision: "integer cents, round_half_up applied once at line level before any summation"

  - name: loyalty_points_accrual
    trigger: "POST /loyalty-accounts/{id}/ledger-entries with entry_type=ACCRUAL; also the ACCRUAL posted by WeightedSale finalize (base_amount_cents = final_total_cents, earn_context = FEED for FEED_BULK / FUEL for PROPANE_EXCHANGE, store_id = sale.store_id)"
    algorithm: threshold
    formula: |
      # Circular-looking dependency PINNED: points depend on tier multiplier, tier depends on
      # qualifying points which include this entry. Evaluation order resolves it:
      #   (1) base_points = floor(base_amount_cents / 100)
      #   (2) tier_snapshot = account.tier BEFORE this entry is posted
      #   (3) tier_mult = 1.0 NEIGHBOR | 1.25 RANCH_HAND | 1.5 HOMESTEAD  (from tier_snapshot)
      #   (4) posture_mult = 2.0 if (earn_context == FEED AND store.posture == FALL_FEED) else 1.0
      #        (store resolved via entry.store_id; posture read at entry creation time)
      #   (5) points_delta = round_half_up(base_points * tier_mult * posture_mult)
      #   (6) post entry; THEN re-evaluate tier (loyalty_tier_evaluation) for FUTURE purchases.
      # A tier crossing triggered by this entry never retroactively changes this entry's points.
    input_set: "the posting account, the entry's store, base_amount_cents, earn_context"
    constants:
      TIER_MULT_NEIGHBOR: 1.0
      TIER_MULT_RANCH_HAND: 1.25
      TIER_MULT_HOMESTEAD: 1.5
      POSTURE_MULT_FALL_FEED: 2.0
    precision: "integer points, round_half_up"

  - name: loyalty_tier_evaluation
    trigger: "after every LoyaltyLedgerEntry write (ACCRUAL, REDEMPTION, ADJUSTMENT, REVERSAL)"
    algorithm: chronological
    formula: |
      tier_qualifying_points = sum(points_delta) over entries where
        entry.account_id == account.id
        AND counts_toward_tier == true          # ACCRUAL (+) and REVERSAL (signed) only
        AND created_at >= now - 365 days AND created_at <= now   # both bounds inclusive, logical clock
      Process entries in created_at ASC order (tie-break: none needed, sum is order-insensitive).
      tier = HOMESTEAD if tier_qualifying_points >= 7500
           = RANCH_HAND if tier_qualifying_points >= 2500
           = NEIGHBOR otherwise
      Boundary is >= (2500 exactly promotes to RANCH_HAND; 2499 does not).
    input_set: "all LoyaltyLedgerEntries of the account, filtered as above"
    constants:
      TIER_RANCH_HAND_THRESHOLD: 2500
      TIER_HOMESTEAD_THRESHOLD: 7500
      TIER_WINDOW_DAYS: 365
    precision: "integer points"
    variants:
      - name: rolling_365d
        when: "authoritative variant driving the tier field"
        difference: "chronological rolling window over the last 365 days, all qualifying entries regardless of posture"
      - name: posture_season
        when: "drives fuel-and-feed offer eligibility only (see fuel_feed_offer_eligibility)"
        difference: "counts only ACCRUAL entries whose posture_at_entry equals the querying store's CURRENT posture; REVERSALs excluded; same purchase history therefore yields a different qualifying total and can make a member offer-eligible while their rolling-365 tier stays NEIGHBOR"

  - name: fuel_feed_offer_eligibility
    trigger: "GET /loyalty-accounts/{id}/offers"
    algorithm: aggregation
    formula: |
      season_qualifying_points = sum(points_delta) over entries where
        entry.account_id == account.id AND entry_type == ACCRUAL
        AND posture_at_entry == store.posture (store resolved from the store_id query input)
      fuel_discount_cents_per_gal = min(5 * floor(season_qualifying_points / 500), 50)
      feed_coupon_cents = 1000 if (store.posture == FALL_FEED AND account.tier in {RANCH_HAND, HOMESTEAD}) else 0
      eligible = (fuel_discount_cents_per_gal > 0) OR (feed_coupon_cents > 0)
    input_set: "account ledger entries; querying store's current posture"
    constants:
      FUEL_POINTS_STEP: 500
      FUEL_CENTS_PER_STEP: 5
      FUEL_MAX_CENTS_PER_GAL: 50
      FEED_COUPON_CENTS: 1000
    precision: "integer cents/points"

  - name: mortality_claim_refund
    trigger: "POST /chick-orders/{id}/review-mortality-claim with decision=APPROVE"
    algorithm: aggregation
    formula: |
      refund_cents = round_half_up(order.total_cents * claimed_mortality_count / order.quantity)
      goodwill_points = floor(refund_cents / 100)
      Side effects: approved_claim_count += claimed_mortality_count; refund_cents accumulated on order;
      LoyaltyLedgerEntry ADJUSTMENT +goodwill_points posted to order.loyalty_account_id.
    input_set: "the ChickOrder under claim"
    precision: "integer cents, round_half_up"

  - name: care_log_mortality_rate
    trigger: "POST /livestock-lots/{id}/care-logs with entry_type=MORTALITY"
    algorithm: threshold
    formula: |
      mortality_count += entry.mortality_count
      mortality_rate = round_half_up(mortality_count / quantity_received, 4)
      if mortality_rate > 0.05:   # strictly greater; exactly 0.05 does NOT quarantine
        lot -> SUSPENDED cascade (see LivestockLot state machine)
    input_set: "the lot's cumulative MORTALITY entries"
    constants:
      MORTALITY_QUARANTINE_RATE: 0.05
      QUARANTINE_GOODWILL_POINTS: 500
    precision: "4 decimal places, round_half_up"

  - name: staging_bay_selection
    trigger: "POST /pickup-orders/{id}/stage"
    algorithm: constraint_propagation
    formula: |
      eligibility: bays of the order's store with status == AVAILABLE AND size_class >= item_size_class
        (capacity order M < L < XL; a bay may hold anything its size or smaller)
      ranking: size_class ASC (smallest sufficient bay first)
      tie-break: bay_no ASC
      empty pool: reject with ERR_NO_STAGING_BAY_AVAILABLE (no queuing)
      Side effect of success: selected StagingBay.status := OCCUPIED
    input_set: "StagingBays of the store; the PickupOrder's item_size_class"

  - name: schedule_window_gap_check
    trigger: "POST /hatchery-schedules/{id}/publish"
    algorithm: interval_merge
    formula: |
      For the same store AND same species, the candidate's closed sale window
      [sale_window_start, sale_window_end] must be separated from every PUBLISHED
      schedule's closed window by a sanitization gap of >= 7 full days on BOTH sides:
        candidate.sale_window_start >= other.sale_window_end + 7 days
        OR candidate.sale_window_end + 7 days <= other.sale_window_start
      Exactly 7 days of gap is allowed (>=). Violation -> ERR_SCHEDULE_WINDOW_OVERLAP.
      DRAFT/CLOSED/CANCELLED schedules are ignored.
    input_set: "all HatcherySchedules of the same store with the same species and status == PUBLISHED"
    constants:
      SANITIZATION_GAP_DAYS: 7

  - name: event_booking_overlap_check
    trigger: "POST /event-bookings"
    algorithm: interval_merge
    formula: |
      For the candidate booking against event E on resource R:
      - PET_WASH semantics (aggregate capacity, half-open slots):
          candidate occupies [slot_start, slot_end). Adjacency is allowed: a booking
          starting exactly when another ends does NOT overlap.
          overlap set = bookings B on R (via events of the same store, same resource_name)
            with B.status in {BOOKED, CHECKED_IN} and B.slot_start < candidate.slot_end
            AND candidate.slot_start < B.slot_end
          reject ERR_BOOKING_OVERLAP if |overlap set| >= E.capacity_per_slot
      - VET_CLINIC semantics (buffered occupancy, capacity always 1):
          effective(B) = [B.slot_start - E.cleanup_buffer_minutes, B.slot_end + E.cleanup_buffer_minutes)
          reject ERR_BOOKING_OVERLAP if any B in {BOOKED, CHECKED_IN} on R has
            effective(B) intersect effective(candidate) non-empty
          (a cleanup buffer therefore forbids adjacency — back-to-back slots collide)
    input_set: "EventBookings on the same resource via same-store events sharing resource_name"

  - name: posture_cascade_on_activation
    trigger: "SeasonCampaign READY -> ACTIVE"
    algorithm: constraint_propagation
    formula: |
      hop1: prior ACTIVE campaign on the store -> COMPLETED
      hop2: Store.posture := new campaign.season; Store.version += 1
      hop3: if new posture != SPRING_PLANTING:
              every HatcherySchedule on the store with status == PUBLISHED -> CLOSED
      hop4: for each such closure, every ON_SALE LivestockLot under it -> SALE_CLOSED
      hop5: for each such lot closure, every RESERVED|BROODER_VERIFIED ChickOrder -> EXPIRED
            with reserved quantity released back to quantity_on_hand
      Each hop is caused by the previous hop's mutation, not by the activate call directly.
    input_set: "the activated campaign, its store, and the store's schedules/lots/orders"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Entity-backed identity: role Customer requires X-User-ID == the loyalty_account_id of the resource being created/acted on (or the path account id); operations on resources owned by another member are rejected"
    error_id: ERR_FORBIDDEN_IDENTITY
    http_status: 403
    applies_to: "POST /chick-orders, POST /chick-orders/{id}/cancel, POST /chick-orders/{id}/mortality-claims, POST /pickup-orders, POST /pickup-orders/{id}/request-loadout, POST /pickup-orders/{id}/cancel, POST /event-bookings, POST /event-bookings/{id}/cancel, GET /loyalty-accounts/{id} (Customer role)"

  - priority: 0
    category: existence
    check: "Request shape: required fields present, types and enum values valid (ERR_INVALID_REQUEST); receipt-free lookup phone resolves to an account (ERR_PHONE_NOT_FOUND)"
    error_id: "ERR_INVALID_REQUEST | ERR_PHONE_NOT_FOUND"
    http_status: 400
    applies_to: "all (ERR_INVALID_REQUEST, 400); POST /loyalty-accounts/lookup (ERR_PHONE_NOT_FOUND, 404)"

  - priority: 4
    category: existence
    check: "Resource ids in path and body exist (path left-to-right, then body FKs)"
    error_id: "ERR_STORE_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_BAY_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_PICKUP_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "OCC staleness: expected_store_version == Store.version at campaign activation (ERR_STALE_STORE_VERSION); expected_livestock_lot_version == LivestockLot.version at chick order creation (ERR_STALE_LOT_VERSION). Evaluated before all other state and business checks so a stale client view is always reported as staleness."
    error_id: "ERR_STALE_STORE_VERSION | ERR_STALE_LOT_VERSION"
    http_status: 412
    applies_to: "POST /season-campaigns/{id}/activate, POST /chick-orders"

  - priority: 6
    category: state
    check: "Store posture gates: chick order creation requires Store.posture == SPRING_PLANTING (ERR_POSTURE_NOT_SPRING_PLANTING); WeightedSale creation requires posture != OFFSEASON — the store floor is closed with no ACTIVE campaign (ERR_STORE_FLOOR_CLOSED)"
    error_id: "ERR_POSTURE_NOT_SPRING_PLANTING | ERR_STORE_FLOOR_CLOSED"
    http_status: 409
    applies_to: "POST /chick-orders, POST /weighted-sales"

  - priority: 7
    category: state
    check: "Resource state preconditions for the operation (campaign step states, lot ON_SALE / RECEIVING, order RESERVED / BROODER_VERIFIED, sale PROVISIONAL, account ACTIVE, event PUBLISHED, booking BOOKED, etc.)"
    error_id: "ERR_CAMPAIGN_NOT_IN_DRAFT | ERR_CAMPAIGN_NOT_IN_TEARDOWN | ERR_CAMPAIGN_NOT_VERIFY_PENDING | ERR_CAMPAIGN_NOT_READY | ERR_SCHEDULE_NOT_DRAFT | ERR_SCHEDULE_NOT_PUBLISHED | ERR_LOT_NOT_RECEIVING | ERR_LOT_NOT_ON_SALE | ERR_ORDER_NOT_RESERVED | ERR_ORDER_NOT_VERIFIED | ERR_SALE_NOT_PROVISIONAL | ERR_ACCOUNT_SUSPENDED | ERR_EVENT_NOT_PUBLISHED | ERR_INVALID_STATE_TRANSITION"
    http_status: 409
    applies_to: "state transition endpoints and state-gated creates"

  - priority: 8
    category: business_safety
    check: "Live-animal / hazmat / health safety: brooder flags all true (ERR_BROODER_CHECK_FAILED); brooder verification fresh <= 72h (ERR_BROODER_VERIFICATION_EXPIRED); care log fresh <= 12h before fulfillment (ERR_CARE_LOG_STALE); propane daily hazmat cap (ERR_HAZMAT_DAILY_CAP_EXCEEDED); vaccine record confirmed when required (ERR_VACCINE_RECORD_REQUIRED)"
    error_id: "ERR_BROODER_CHECK_FAILED | ERR_BROODER_VERIFICATION_EXPIRED | ERR_CARE_LOG_STALE | ERR_HAZMAT_DAILY_CAP_EXCEEDED | ERR_VACCINE_RECORD_REQUIRED"
    http_status: 422
    applies_to: "verify-brooder, fulfill, weighted-sale finalize, event booking create"

  - priority: 9
    category: business_temporal
    check: "Temporal windows and overlaps: order within sale window (ERR_OUTSIDE_SALE_WINDOW); fulfill grace window (ERR_SALE_WINDOW_CLOSED); mortality claim within 48h (ERR_CLAIM_WINDOW_EXPIRED); pickup within deadline (ERR_PICKUP_WINDOW_EXPIRED); schedule sanitization gap (ERR_SCHEDULE_WINDOW_OVERLAP); booking overlap (ERR_BOOKING_OVERLAP); check-in window (ERR_OUTSIDE_CHECKIN_WINDOW); no-show only after slot_end (ERR_BOOKING_NOT_EXPIRED)"
    error_id: "ERR_OUTSIDE_SALE_WINDOW | ERR_SALE_WINDOW_CLOSED | ERR_CLAIM_WINDOW_EXPIRED | ERR_PICKUP_WINDOW_EXPIRED | ERR_SCHEDULE_WINDOW_OVERLAP | ERR_BOOKING_OVERLAP | ERR_OUTSIDE_CHECKIN_WINDOW | ERR_BOOKING_NOT_EXPIRED"
    http_status: 409
    applies_to: "windowed creates/actions"

  - priority: 10
    category: business_constraint
    check: "Constraint satisfaction: minimum purchase (ERR_MIN_PURCHASE_NOT_MET); daily capacity (ERR_DAILY_CAPACITY_EXCEEDED); lot availability (ERR_LOT_CAPACITY_EXCEEDED); claim count within remaining (ERR_CLAIM_EXCEEDS_REMAINING); tare <= gross (ERR_TARE_EXCEEDS_GROSS); staging bay pool non-empty (ERR_NO_STAGING_BAY_AVAILABLE); phone uniqueness (ERR_PHONE_ALREADY_REGISTERED); bay_no uniqueness per store (ERR_BAY_NO_TAKEN); aisle count match (ERR_AISLE_COUNT_MISMATCH); loadout applicability (ERR_LOADOUT_NOT_APPLICABLE); completion gating on loadout (ERR_LOADOUT_NOT_COMPLETED)"
    error_id: "ERR_MIN_PURCHASE_NOT_MET | ERR_DAILY_CAPACITY_EXCEEDED | ERR_LOT_CAPACITY_EXCEEDED | ERR_CLAIM_EXCEEDS_REMAINING | ERR_TARE_EXCEEDS_GROSS | ERR_NO_STAGING_BAY_AVAILABLE | ERR_PHONE_ALREADY_REGISTERED | ERR_BAY_NO_TAKEN | ERR_AISLE_COUNT_MISMATCH | ERR_LOADOUT_NOT_APPLICABLE | ERR_LOADOUT_NOT_COMPLETED"
    http_status: 422
    applies_to: "creates and constrained actions"

  - priority: 11
    category: business_fiscal
    check: "Fiscal: redemption points <= points_balance (ERR_INSUFFICIENT_POINTS)"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "POST /weighted-sales/{id}/finalize"

  - priority: 12
    category: business_referential
    check: "Referential integrity on write payloads: reversal references an existing entry of the same account (ERR_ENTRY_NOT_FOUND); REVERSAL sign opposes referenced entry and does not exceed its remaining unreversed magnitude (ERR_REVERSAL_MISMATCH)"
    error_id: "ERR_ENTRY_NOT_FOUND | ERR_REVERSAL_MISMATCH"
    http_status: 422
    applies_to: "POST /loyalty-accounts/{id}/ledger-entries"


# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [RegionalAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Create a store; posture starts OFFSEASON, version 1"
    roles: [RegionalAdmin]
    code: 201
    input: [store_name, region_code]
    output: Store
    side_effects: []

  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/stores/{id}"
    description: "Get a store (includes computed posture, active_campaign_id, hazmat_gallons_used_today)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []

  # --- SeasonCampaign ---
  - method: POST
    path: "/season-campaigns"
    description: "Create a planogram-reset campaign in DRAFT"
    roles: [RegionalAdmin]
    code: 201
    input: [store_id, season, planogram_map, aisle_count]
    output: SeasonCampaign
    side_effects: []

  - method: GET
    path: "/season-campaigns"
    description: "List campaigns (filterable by store and status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: "SeasonCampaign[]"
    side_effects: []

  - method: GET
    path: "/season-campaigns/{id}"
    description: "Get a campaign"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: SeasonCampaign
    side_effects: []

  - method: POST
    path: "/season-campaigns/{id}/begin-teardown"
    description: "DRAFT -> TEARDOWN"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: []
    output: SeasonCampaign
    side_effects: ["campaign -> TEARDOWN"]

  - method: POST
    path: "/season-campaigns/{id}/complete-reset"
    description: "TEARDOWN -> VERIFY_PENDING; aisles_reset_count must equal aisle_count"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: [aisles_reset_count]
    output: SeasonCampaign
    side_effects: ["campaign -> VERIFY_PENDING"]

  - method: POST
    path: "/season-campaigns/{id}/verify"
    description: "VERIFY_PENDING -> READY (audit_passed=true) or back to TEARDOWN (audit_passed=false)"
    roles: [RegionalAdmin]
    code: 200
    input: [audit_passed]
    output: SeasonCampaign
    side_effects: ["campaign -> READY or TEARDOWN (aisles_reset_count reset to 0 on failure)"]

  - method: POST
    path: "/season-campaigns/{id}/activate"
    description: "READY -> ACTIVE; OCC on expected_store_version; supersedes any ACTIVE campaign; triggers posture cascade"
    roles: [RegionalAdmin]
    code: 200
    input: [expected_store_version]
    output: SeasonCampaign
    side_effects:
      - "prior ACTIVE campaign on store -> COMPLETED"
      - "Store.posture recomputed; Store.active_campaign_id set; increments Store.version by 1"
      - "posture_cascade_on_activation (schedules -> CLOSED, lots -> SALE_CLOSED, orders -> EXPIRED)"

  - method: POST
    path: "/season-campaigns/{id}/cancel"
    description: "DRAFT|TEARDOWN|VERIFY_PENDING -> CANCELLED"
    roles: [RegionalAdmin]
    code: 200
    input: []
    output: SeasonCampaign
    side_effects: ["campaign -> CANCELLED"]

  # --- StagingBay ---
  - method: POST
    path: "/staging-bays"
    description: "Create a staging bay (bay_no unique per store)"
    roles: [StoreManager, RegionalAdmin]
    code: 201
    input: [store_id, bay_no, size_class]
    output: StagingBay
    side_effects: []

  - method: GET
    path: "/staging-bays"
    description: "List bays (filterable by store and status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: "StagingBay[]"
    side_effects: []

  - method: GET
    path: "/staging-bays/{id}"
    description: "Get a bay"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: StagingBay
    side_effects: []

  - method: POST
    path: "/staging-bays/{id}/set-status"
    description: "Set bay status AVAILABLE | OUT_OF_SERVICE (OCCUPIED is managed by pickup staging)"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: [status]
    output: StagingBay
    side_effects: []

  # --- HatcherySchedule ---
  - method: POST
    path: "/hatchery-schedules"
    description: "Create a chick-days hatchery schedule in DRAFT"
    roles: [StoreManager, RegionalAdmin]
    code: 201
    input: [store_id, species, breed, hatch_date, sale_window_start, sale_window_end, daily_capacity, min_purchase_qty, base_price_cents_per_bird]
    output: HatcherySchedule
    side_effects: []

  - method: GET
    path: "/hatchery-schedules"
    description: "List schedules (filterable by store, species, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "species?", "status?", "limit?", "offset?"]
    output: "HatcherySchedule[]"
    side_effects: []

  - method: GET
    path: "/hatchery-schedules/{id}"
    description: "Get a schedule"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: HatcherySchedule
    side_effects: []

  - method: POST
    path: "/hatchery-schedules/{id}/publish"
    description: "DRAFT -> PUBLISHED; enforces 7-day sanitization gap vs other PUBLISHED schedules of same store+species"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: []
    output: HatcherySchedule
    side_effects: ["schedule_window_gap_check"]

  - method: POST
    path: "/hatchery-schedules/{id}/close"
    description: "PUBLISHED -> CLOSED (cascades to lots and orders); DRAFT -> CANCELLED with reason=CANCELLED"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: ["reason?"]
    output: HatcherySchedule
    side_effects: ["ON_SALE lots -> SALE_CLOSED; RESERVED|BROODER_VERIFIED orders -> EXPIRED with quantity release"]

  # --- LivestockLot ---
  - method: POST
    path: "/livestock-lots"
    description: "Receive a lot under a PUBLISHED schedule"
    roles: [StoreManager, RegionalAdmin]
    code: 201
    input: [store_id, hatchery_schedule_id, quantity_received, received_at]
    output: LivestockLot
    side_effects: ["quantity_on_hand := quantity_received"]

  - method: GET
    path: "/livestock-lots"
    description: "List lots (filterable by store, schedule, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "hatchery_schedule_id?", "status?", "limit?", "offset?"]
    output: "LivestockLot[]"
    side_effects: []

  - method: GET
    path: "/livestock-lots/{id}"
    description: "Get a lot (includes computed quantity_on_hand, mortality_rate)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: LivestockLot
    side_effects: []

  - method: POST
    path: "/livestock-lots/{id}/open-sale"
    description: "RECEIVING -> ON_SALE; requires schedule PUBLISHED and now within sale window"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: []
    output: LivestockLot
    side_effects: ["lot -> ON_SALE"]

  - method: POST
    path: "/livestock-lots/{id}/close-sale"
    description: "ON_SALE|SUSPENDED -> SALE_CLOSED; with disposition=true SALE_CLOSED -> DISPOSITIONED"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: ["disposition?"]
    output: LivestockLot
    side_effects: ["lot -> SALE_CLOSED (orders expire) or -> DISPOSITIONED"]

  - method: POST
    path: "/livestock-lots/{id}/care-logs"
    description: "Append a care log entry (FEEDING | WATER | TEMPERATURE | MORTALITY); MORTALITY drives mortality_rate and possible quarantine cascade"
    roles: [StoreAssociate, StoreManager, RegionalAdmin]
    code: 201
    input: [entry_type, "measured_temp_f?", "mortality_count?", "note?"]
    output: CareLogEntry
    side_effects: ["MORTALITY: mortality_count += n, mortality_rate recompute, quarantine cascade when rate > 0.05"]

  - method: GET
    path: "/livestock-lots/{id}/care-logs"
    description: "List care log entries for a lot (append-only log)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: "CareLogEntry[]"
    side_effects: []

  # --- ChickOrder ---
  - method: POST
    path: "/chick-orders"
    description: "Reserve birds against a lot; OCC on expected_livestock_lot_version; computes chick_order_total"
    roles: [Customer]
    code: 201
    input: [store_id, livestock_lot_id, loyalty_account_id, quantity, pickup_date, expected_livestock_lot_version]
    output: ChickOrder
    side_effects:
      - "lot.quantity_on_hand -= quantity; increments LivestockLot.version by 1"
      - "total_cents, unit_price_cents, discount_pct computed and stored"

  - method: GET
    path: "/chick-orders"
    description: "List chick orders (filterable by store, lot, account, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "livestock_lot_id?", "loyalty_account_id?", "status?", "limit?", "offset?"]
    output: "ChickOrder[]"
    side_effects: []

  - method: GET
    path: "/chick-orders/{id}"
    description: "Get a chick order"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: ChickOrder
    side_effects: []

  - method: POST
    path: "/chick-orders/{id}/verify-brooder"
    description: "RESERVED -> BROODER_VERIFIED; all three brooder flags must be true"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: [heat_lamp_ok, thermometer_ok, bedding_ok]
    output: ChickOrder
    side_effects: ["brooder_verified_at := now"]

  - method: POST
    path: "/chick-orders/{id}/fulfill"
    description: "BROODER_VERIFIED -> FULFILLED; checks verification freshness, lot ON_SALE, sale-window grace, care-log freshness"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: ChickOrder
    side_effects: ["fulfilled_at := now; lot.quantity_sold += quantity"]

  - method: POST
    path: "/chick-orders/{id}/cancel"
    description: "RESERVED|BROODER_VERIFIED -> CANCELLED; releases reserved quantity"
    roles: [Customer, StoreManager]
    code: 200
    input: ["reason?"]
    output: ChickOrder
    side_effects: ["quantity released to lot.quantity_on_hand (or quantity_quarantined when lot SUSPENDED)"]

  - method: POST
    path: "/chick-orders/{id}/mortality-claims"
    description: "Open a mortality guarantee claim on a FULFILLED order within 48h"
    roles: [Customer]
    code: 201
    input: [mortality_count]
    output: ChickOrder
    side_effects: ["claim_status -> CLAIMED; claimed_mortality_count := input"]

  - method: POST
    path: "/chick-orders/{id}/review-mortality-claim"
    description: "Approve (posts refund + goodwill ADJUSTMENT ledger entry) or reject an open claim"
    roles: [StoreManager]
    code: 200
    input: [decision]
    output: ChickOrder
    side_effects: ["APPROVE: mortality_claim_refund calc, approved_claim_count += claimed, refund_cents accumulated, LoyaltyLedgerEntry ADJUSTMENT posted; REJECT: claim_status -> REJECTED"]

  # --- WeightedSale ---
  - method: POST
    path: "/weighted-sales"
    description: "Create a bulk feed or propane exchange sale with provisional (class-table tare) pricing; requires the store floor open (posture != OFFSEASON)"
    roles: [StoreAssociate, StoreManager]
    code: 201
    input: [store_id, sale_kind, container_class, gross_weight_lbs, "loyalty_account_id?"]
    output: WeightedSale
    side_effects: ["provisional_tare_lbs and provisional_total_cents computed"]

  - method: GET
    path: "/weighted-sales"
    description: "List weighted sales (filterable by store, account, kind, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "loyalty_account_id?", "sale_kind?", "status?", "limit?", "offset?"]
    output: "WeightedSale[]"
    side_effects: []

  - method: GET
    path: "/weighted-sales/{id}"
    description: "Get a weighted sale"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: WeightedSale
    side_effects: []

  - method: POST
    path: "/weighted-sales/{id}/finalize"
    description: "Record measured tare, compute final price, apply point redemption, post ACCRUAL entry"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: [measured_tare_lbs, "redeem_points?"]
    output: WeightedSale
    side_effects: ["final_total_cents computed; hazmat gallon tally updated; REDEMPTION and ACCRUAL ledger entries posted"]

  - method: POST
    path: "/weighted-sales/{id}/void"
    description: "PROVISIONAL -> VOIDED"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: []
    output: WeightedSale
    side_effects: ["sale -> VOIDED"]

  # --- LoyaltyAccount ---
  - method: POST
    path: "/loyalty-accounts"
    description: "Register a loyalty account (public); phone unique"
    roles: [Anonymous]
    code: 201
    input: [full_name, phone, "email?"]
    output: LoyaltyAccount
    side_effects: ["tier := NEIGHBOR; points_balance := 0"]

  - method: GET
    path: "/loyalty-accounts"
    description: "List accounts (filterable by phone, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate]
    code: 200
    input: ["phone?", "status?", "limit?", "offset?"]
    output: "LoyaltyAccount[]"
    side_effects: []

  - method: GET
    path: "/loyalty-accounts/{id}"
    description: "Get an account (Customer may only read own account)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  - method: POST
    path: "/loyalty-accounts/lookup"
    description: "Receipt-free lookup by phone"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: [phone]
    output: LoyaltyAccount
    side_effects: []

  - method: POST
    path: "/loyalty-accounts/{id}/ledger-entries"
    description: "Post a ledger entry; ACCRUAL computes points via loyalty_points_accrual; re-evaluates tier"
    roles: [StoreAssociate, StoreManager]
    code: 201
    input: [entry_type, "store_id?", "base_amount_cents?", "earn_context?", "points_delta?", "related_entry_id?"]
    output: LoyaltyLedgerEntry
    side_effects: ["points_balance recomputed; tier re-evaluated via loyalty_tier_evaluation"]

  - method: GET
    path: "/loyalty-accounts/{id}/ledger-entries"
    description: "List ledger entries for an account"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: "LoyaltyLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/loyalty-ledger-entries/{id}"
    description: "Get a single ledger entry"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: LoyaltyLedgerEntry
    side_effects: []

  - method: GET
    path: "/loyalty-ledger-entries"
    description: "List ledger entries (filterable by account, store, related entry)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate]
    code: 200
    input: ["account_id?", "store_id?", "related_entry_id?", "limit?", "offset?"]
    output: "LoyaltyLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/loyalty-accounts/{id}/offers"
    description: "Computed fuel-and-feed offer eligibility for the account at a given store"
    roles: [StoreAssociate, StoreManager, Customer]
    code: 200
    input: [store_id]
    output: { fuel_discount_cents_per_gal: integer, feed_coupon_cents: integer, season_qualifying_points: integer, eligible: boolean }
    side_effects: []

  - method: POST
    path: "/loyalty-accounts/{id}/set-status"
    description: "ACTIVE <-> SUSPENDED; ACTIVE -> CLOSED"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: [status]
    output: LoyaltyAccount
    side_effects: []

  # --- PickupOrder ---
  - method: POST
    path: "/pickup-orders"
    description: "Create a BOPIS order for an oversized item"
    roles: [Customer]
    code: 201
    input: [store_id, loyalty_account_id, item_sku, item_size_class, requires_loadout_assistance]
    output: PickupOrder
    side_effects: ["fulfillment PLACED, loadout NOT_REQUIRED"]

  - method: GET
    path: "/pickup-orders"
    description: "List pickup orders (filterable by store, account, bay, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "loyalty_account_id?", "staging_bay_id?", "status?", "limit?", "offset?"]
    output: "PickupOrder[]"
    side_effects: []

  - method: GET
    path: "/pickup-orders/{id}"
    description: "Get a pickup order"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: PickupOrder
    side_effects: []

  - method: POST
    path: "/pickup-orders/{id}/stage"
    description: "PLACED -> STAGED; staging_bay_selection assigns a bay (smallest sufficient, bay_no tie-break)"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PickupOrder
    side_effects: ["staging_bay_id set; bay -> OCCUPIED"]

  - method: POST
    path: "/pickup-orders/{id}/mark-ready"
    description: "STAGED -> READY_FOR_PICKUP; sets ready_at and pickup_deadline (+5 days)"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PickupOrder
    side_effects: ["ready_at, pickup_deadline set"]

  - method: POST
    path: "/pickup-orders/{id}/request-loadout"
    description: "loadout NOT_REQUIRED -> ASSISTANCE_REQUESTED (Customer, own order, requires_loadout_assistance must be true)"
    roles: [Customer]
    code: 200
    input: []
    output: PickupOrder
    side_effects: []

  - method: POST
    path: "/pickup-orders/{id}/complete-loadout"
    description: "loadout ASSISTANCE_REQUESTED -> LOADOUT_DONE"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PickupOrder
    side_effects: []

  - method: POST
    path: "/pickup-orders/{id}/complete"
    description: "READY_FOR_PICKUP -> COMPLETED; releases bay; expires order if past pickup_deadline"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: PickupOrder
    side_effects: ["bay -> AVAILABLE"]

  - method: POST
    path: "/pickup-orders/{id}/cancel"
    description: "PLACED|STAGED|READY_FOR_PICKUP -> CANCELLED; releases bay when staged"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: PickupOrder
    side_effects: ["bay -> AVAILABLE when it was OCCUPIED by this order"]

  # --- ServiceEvent ---
  - method: POST
    path: "/service-events"
    description: "Create a pet wash or vet clinic event in DRAFT"
    roles: [StoreManager, RegionalAdmin]
    code: 201
    input: [store_id, event_kind, resource_name, event_date, slot_window_start, slot_window_end, slot_length_minutes, cleanup_buffer_minutes, capacity_per_slot, requires_vaccine_record]
    output: ServiceEvent
    side_effects: []

  - method: GET
    path: "/service-events"
    description: "List service events (filterable by store, kind, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["store_id?", "event_kind?", "status?", "limit?", "offset?"]
    output: "ServiceEvent[]"
    side_effects: []

  - method: GET
    path: "/service-events/{id}"
    description: "Get a service event"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: ServiceEvent
    side_effects: []

  - method: POST
    path: "/service-events/{id}/publish"
    description: "DRAFT -> PUBLISHED"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: []
    output: ServiceEvent
    side_effects: []

  - method: POST
    path: "/service-events/{id}/cancel"
    description: "DRAFT|PUBLISHED -> CANCELLED; cancels non-terminal bookings"
    roles: [StoreManager, RegionalAdmin]
    code: 200
    input: []
    output: ServiceEvent
    side_effects: ["BOOKED|CHECKED_IN bookings -> CANCELLED"]

  # --- EventBooking ---
  - method: POST
    path: "/event-bookings"
    description: "Book a slot on a PUBLISHED event; overlap/capacity/vaccine checks per event_booking_overlap_check"
    roles: [Customer]
    code: 201
    input: [service_event_id, loyalty_account_id, slot_start, "vaccine_record_confirmed?"]
    output: EventBooking
    side_effects: ["slot_end computed"]

  - method: GET
    path: "/event-bookings"
    description: "List bookings (filterable by event, account, status)"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: ["service_event_id?", "loyalty_account_id?", "status?", "limit?", "offset?"]
    output: "EventBooking[]"
    side_effects: []

  - method: GET
    path: "/event-bookings/{id}"
    description: "Get a booking"
    roles: [RegionalAdmin, StoreManager, StoreAssociate, Customer]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: POST
    path: "/event-bookings/{id}/check-in"
    description: "BOOKED -> CHECKED_IN within [slot_start - 15min, slot_end]"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: POST
    path: "/event-bookings/{id}/complete"
    description: "CHECKED_IN -> COMPLETED"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: POST
    path: "/event-bookings/{id}/mark-no-show"
    description: "BOOKED -> NO_SHOW once now > slot_end"
    roles: [StoreAssociate, StoreManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: POST
    path: "/event-bookings/{id}/cancel"
    description: "BOOKED -> CANCELLED"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_IDENTITY, http: 403, condition: "Customer role acts on a resource whose loyalty_account_id != X-User-ID" }
  # --- existence ---
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "store id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaign id does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "staging bay id does not exist" }
  - { id: ERR_SCHEDULE_NOT_FOUND, http: 404, condition: "hatchery schedule id does not exist" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "livestock lot id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "chick order id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "weighted sale id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "loyalty account id does not exist" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "ledger entry id does not exist (incl. reversal reference)" }
  - { id: ERR_PICKUP_NOT_FOUND, http: 404, condition: "pickup order id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "service event id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "event booking id does not exist" }
  - { id: ERR_PHONE_NOT_FOUND, http: 404, condition: "receipt-free lookup: no account with that phone" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, or invalid enum value" }
  # --- OCC ---
  - { id: ERR_STALE_STORE_VERSION, http: 412, condition: "expected_store_version != current Store.version at campaign activation" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "expected_livestock_lot_version != current LivestockLot.version at chick order creation" }
  # --- state ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "generic invalid-from state for the attempted transition" }
  - { id: ERR_CAMPAIGN_NOT_IN_DRAFT, http: 409, condition: "begin-teardown requires DRAFT" }
  - { id: ERR_CAMPAIGN_NOT_IN_TEARDOWN, http: 409, condition: "complete-reset requires TEARDOWN" }
  - { id: ERR_CAMPAIGN_NOT_VERIFY_PENDING, http: 409, condition: "verify requires VERIFY_PENDING" }
  - { id: ERR_CAMPAIGN_NOT_READY, http: 409, condition: "activate requires READY" }
  - { id: ERR_SCHEDULE_NOT_DRAFT, http: 409, condition: "publish or DRAFT-cancel requires DRAFT" }
  - { id: ERR_SCHEDULE_NOT_PUBLISHED, http: 409, condition: "close or lot open-sale requires PUBLISHED" }
  - { id: ERR_POSTURE_NOT_SPRING_PLANTING, http: 409, condition: "chick order creation requires store posture SPRING_PLANTING" }
  - { id: ERR_STORE_FLOOR_CLOSED, http: 409, condition: "weighted sale creation while store posture is OFFSEASON (no ACTIVE campaign)" }
  - { id: ERR_LOT_NOT_RECEIVING, http: 409, condition: "open-sale requires lot RECEIVING" }
  - { id: ERR_LOT_NOT_ON_SALE, http: 409, condition: "operation requires lot ON_SALE (also covers SUSPENDED quarantine)" }
  - { id: ERR_ORDER_NOT_RESERVED, http: 409, condition: "verify-brooder requires order RESERVED" }
  - { id: ERR_ORDER_NOT_VERIFIED, http: 409, condition: "fulfill requires order BROODER_VERIFIED" }
  - { id: ERR_SALE_NOT_PROVISIONAL, http: 409, condition: "finalize/void requires sale PROVISIONAL" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "operation requires LoyaltyAccount ACTIVE" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "booking requires ServiceEvent PUBLISHED" }
  # --- business_safety ---
  - { id: ERR_BROODER_CHECK_FAILED, http: 422, condition: "verify-brooder with any of heat_lamp_ok / thermometer_ok / bedding_ok false" }
  - { id: ERR_BROODER_VERIFICATION_EXPIRED, http: 422, condition: "fulfill attempted more than 72h after brooder_verified_at; order reverts to RESERVED" }
  - { id: ERR_CARE_LOG_STALE, http: 422, condition: "fulfill requires a care log entry on the lot within the last 12h" }
  - { id: ERR_HAZMAT_DAILY_CAP_EXCEEDED, http: 422, condition: "propane finalize would push store hazmat_gallons_used_today over 40 gal" }
  - { id: ERR_VACCINE_RECORD_REQUIRED, http: 422, condition: "vet clinic booking without vaccine_record_confirmed=true" }
  # --- business_temporal ---
  - { id: ERR_OUTSIDE_SALE_WINDOW, http: 409, condition: "now or pickup_date outside the schedule sale window (or lot open-sale outside window)" }
  - { id: ERR_SALE_WINDOW_CLOSED, http: 409, condition: "fulfill attempted after sale_window_end + 48h grace; order becomes EXPIRED" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "mortality claim attempted more than 48h after fulfilled_at" }
  - { id: ERR_PICKUP_WINDOW_EXPIRED, http: 409, condition: "complete attempted after pickup_deadline; order becomes EXPIRED" }
  - { id: ERR_SCHEDULE_WINDOW_OVERLAP, http: 409, condition: "publish would leave < 7 day sanitization gap vs another PUBLISHED schedule of same store+species" }
  - { id: ERR_BOOKING_OVERLAP, http: 409, condition: "booking collides under the event kind's interval semantics (half-open capacity vs buffered occupancy)" }
  - { id: ERR_OUTSIDE_CHECKIN_WINDOW, http: 409, condition: "check-in outside [slot_start - 15min, slot_end]" }
  - { id: ERR_BOOKING_NOT_EXPIRED, http: 409, condition: "mark-no-show before slot_end has passed" }
  # --- business_constraint ---
  - { id: ERR_MIN_PURCHASE_NOT_MET, http: 422, condition: "chick order quantity < schedule.min_purchase_qty" }
  - { id: ERR_DAILY_CAPACITY_EXCEEDED, http: 422, condition: "reservation would exceed schedule daily_capacity for the current UTC date" }
  - { id: ERR_LOT_CAPACITY_EXCEEDED, http: 422, condition: "order quantity > lot.quantity_on_hand" }
  - { id: ERR_CLAIM_EXCEEDS_REMAINING, http: 422, condition: "claimed mortality exceeds quantity - approved_claim_count" }
  - { id: ERR_TARE_EXCEEDS_GROSS, http: 422, condition: "measured_tare_lbs > gross_weight_lbs" }
  - { id: ERR_NO_STAGING_BAY_AVAILABLE, http: 422, condition: "no AVAILABLE staging bay with size_class >= item_size_class" }
  - { id: ERR_PHONE_ALREADY_REGISTERED, http: 409, condition: "loyalty account phone already exists" }
  - { id: ERR_BAY_NO_TAKEN, http: 409, condition: "bay_no already exists for the store" }
  - { id: ERR_AISLE_COUNT_MISMATCH, http: 422, condition: "complete-reset aisles_reset_count != campaign.aisle_count" }
  - { id: ERR_LOADOUT_NOT_APPLICABLE, http: 422, condition: "request-loadout on an order with requires_loadout_assistance=false" }
  - { id: ERR_LOADOUT_NOT_COMPLETED, http: 409, condition: "complete while loadout_status == ASSISTANCE_REQUESTED" }
  # --- business_fiscal ---
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "redeem_points > account.points_balance" }
  # --- business_referential ---
  - { id: ERR_REVERSAL_MISMATCH, http: 422, condition: "REVERSAL sign/magnitude inconsistent with the referenced entry's remaining unreversed amount" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegionalAdmin
    description: "Regional operator; owns stores, campaigns, clock; superset of StoreManager operations"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /stores"
      - "POST /season-campaigns"
      - "POST /season-campaigns/{id}/verify"
      - "POST /season-campaigns/{id}/activate"
      - "POST /season-campaigns/{id}/cancel"
    shared_operations:
      - "All StoreManager operations"
      - "All read endpoints"

  - name: StoreManager
    description: "Store manager; owns schedules, lots, bays, events, claim review, voids, account status; superset of StoreAssociate operations"
    identity: opaque
    exclusive_operations:
      - "POST /staging-bays, POST /staging-bays/{id}/set-status"
      - "POST /hatchery-schedules, POST /hatchery-schedules/{id}/publish, POST /hatchery-schedules/{id}/close"
      - "POST /livestock-lots, POST /livestock-lots/{id}/open-sale, POST /livestock-lots/{id}/close-sale"
      - "POST /chick-orders/{id}/review-mortality-claim"
      - "POST /weighted-sales/{id}/void"
      - "POST /loyalty-accounts/{id}/set-status"
      - "POST /service-events, POST /service-events/{id}/publish, POST /service-events/{id}/cancel"
      - "POST /season-campaigns/{id}/begin-teardown, POST /season-campaigns/{id}/complete-reset (shared with RegionalAdmin)"
    shared_operations:
      - "All StoreAssociate operations"
      - "All read endpoints"

  - name: StoreAssociate
    description: "Front-line associate; care logs, weighted sales, brooder verification, fulfillment, staging, load-out, check-in, ledger posting, receipt-free lookup"
    identity: opaque
    exclusive_operations:
      - "POST /livestock-lots/{id}/care-logs"
      - "POST /weighted-sales, POST /weighted-sales/{id}/finalize"
      - "POST /chick-orders/{id}/verify-brooder, POST /chick-orders/{id}/fulfill"
      - "POST /loyalty-accounts/{id}/ledger-entries"
      - "POST /loyalty-accounts/lookup"
      - "POST /pickup-orders/{id}/stage, /mark-ready, /complete-loadout, /complete"
      - "POST /event-bookings/{id}/check-in, /complete, /mark-no-show"
    shared_operations:
      - "All read endpoints"

  - name: Customer
    description: "Loyalty member; identity is the LoyaltyAccount id (X-User-ID == account id); orders, bookings, claims, load-out requests on own resources"
    identity: "entity_backed:LoyaltyAccount"
    exclusive_operations:
      - "POST /chick-orders, POST /chick-orders/{id}/mortality-claims"
      - "POST /pickup-orders, POST /pickup-orders/{id}/request-loadout"
      - "POST /event-bookings"
    shared_operations:
      - "POST /chick-orders/{id}/cancel (own, shared with StoreManager)"
      - "POST /pickup-orders/{id}/cancel (own, shared with StoreManager)"
      - "POST /event-bookings/{id}/cancel (own, shared with StoreManager)"
      - "GET /loyalty-accounts/{id} (own), GET /loyalty-accounts/{id}/offers, all public read endpoints"

  - name: Anonymous
    description: "Unauthenticated public caller; registration only"
    identity: opaque
    exclusive_operations:
      - "POST /loyalty-accounts"
    shared_operations: []
