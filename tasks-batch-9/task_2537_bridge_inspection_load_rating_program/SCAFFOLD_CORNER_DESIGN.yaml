              as: RatingEngineer
              as_user_id: "${ulla_id}"
              captures: { se_ulla_id: $.data.id }
            - call: "POST /bridges/${br_id}/scour-evaluations"
              payload: { evaluated_by_id: "${rita_id}", evaluation_method: "HEC18_SCREENING", scour_code: 5, foundation_type: "PILE", observed_scour_depth_m: 0.4 }
              as: RatingEngineer
              as_user_id: "${rita_id}"
              captures: { se_rita_id: $.data.id }
          trigger:
            - call: "POST /scour-evaluations/${se_ulla_id}/finalize"
              payload: {}
