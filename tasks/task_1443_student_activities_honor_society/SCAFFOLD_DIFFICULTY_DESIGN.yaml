          Error-category pair: state (priority 4: Chapter frozen) vs
          business_safety (priority 6: athletics conflict). When both fail,
          the priority-4 state error must surface. This pairing is distinct
          from the business_constraint vs business_fiscal pairing in the
          other instance.
