          Every derived figure is visible in the same request that caused it, with no second call
          needed: the confirm response already carries the pledge's own totals while the campaign
          aggregate is readable immediately afterwards, and the collections response already
          reports collected_amount 400.00 and uncollected 0.00 while the agency's
          designated_passthrough_ytd reads 278.25 on the very next call. No re-read delay, no
          lagging denormalized field.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency, one ACTIVE employer with one coordinator, one OPEN campaign."
            - "A 400.00 payroll pledge with a single 300.00 designation line (fee 21.75, net 278.25) recorded by the coordinator."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Bramble Court Hospice", ein: "640000003", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Cormorant Freight", employee_count: 110 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/employers/${emp}/coordinators"
              payload: { full_name: "Coordinator Charlie", email: "charlie.coord@cormorant.example" }
              as: UnitedFundAdmin
              captures: { co: $.data.id }
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "IM-001", giving_method: "PAYROLL_DEDUCTION", gross_amount: 400.00, designations: [ { agency_id: "${ag}", designated_amount: 300.00 } ] }
              as: CampaignCoordinator
              as_user_id: "${co}"
              captures: { pl: $.data.id, fee: $.data.designation_fee_total }
            - call: "GET /fundraising/employers/${emp}/coordinators"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/pledges/${pl}/confirm"
              payload: {}
              as: CampaignCoordinator
              as_user_id: "${co}"
              captures: { ds: $.data.designation_status }
            - call: "GET /fundraising/campaigns/${camp}"
              payload: {}
              as: CampaignCoordinator
              as_user_id: "${co}"
              captures: { cgt: $.data.confirmed_gross_total, dgt: $.data.designated_gross_total }
            - call: "POST /fundraising/pledges/${pl}/collections"
              payload: { amount: 400.00, remitted_on: "2026-08-05" }
              as: FinanceReviewer
              captures: { cs: $.data.collection_status, unc: $.data.uncollected_amount }
            - call: "GET /fundraising/agencies/${ag}"
              payload: {}
              as: AgencyRepresentative
              as_user_id: "${ag}"
              captures: { yt: $.data.designated_passthrough_ytd }
          assert:
            - "The create response itself carries designated_amount_total 300.00, designation_fee_total 21.75, net_designated_total 278.25 and undesignated_amount 100.00"
            - "The coordinator listing immediately shows recorded_pledge_count 1 for ${co}"
            - "The confirm response carries designation_status CONFIRMED, and the campaign read immediately after shows confirmed_gross_total 400.00, designated_gross_total 300.00, designation_fee_total 21.75, undesignated_gross_total 100.00"
            - "The collections response itself carries collection_status COLLECTED, collected_amount 400.00 and uncollected_amount 0.00"
            - "The agency read immediately after shows designated_passthrough_ytd 278.25 - the full net, because the pledge collected in full"
            - "No assertion requires a second read of the same resource to observe a settled value"
