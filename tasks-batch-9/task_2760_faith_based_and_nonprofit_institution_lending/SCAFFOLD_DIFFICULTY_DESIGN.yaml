        grounds:
          - state_machines.LoanApplication.transitions["COMMITTEE_REVIEW -> REVISION_REQUESTED"]
          - state_machines.LoanApplication.transitions["REVISION_REQUESTED -> UNDERWRITING"]
          - entities.LoanApplication.fields.revision_count
          - entities.LoanApplication.fields.revision_reason
          - endpoints["POST /loan-applications/{loan_application_id}/committee-decision"]
        distinguishing_aspect: |
          The cycle COMMITTEE_REVIEW -> REVISION_REQUESTED -> UNDERWRITING ->
          COMMITTEE_REVIEW -> APPROVED is a genuine loop, not a rewind: the second
          submit-underwriting RE-SNAPSHOTS the giving figures against the newly filed
          2026Q2 audit, so giving_base_cents moves 207000000 -> 217000000 and
          net_available_dollars moves 432001 -> 482000, revision_reason is cleared,
          prepared_by_user_id is overwritten with the second analyst, and revision_count
          stays at 1. A linear implementation rejects submit-underwriting from
          REVISION_REQUESTED; a naive loop replays the ORIGINAL snapshot instead of
          recomputing, or drops the collateral assignment that REQUEST_REVISION must
          preserve (unlike DECLINE, which releases it).
