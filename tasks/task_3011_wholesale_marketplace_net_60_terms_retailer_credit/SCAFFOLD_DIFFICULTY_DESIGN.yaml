              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand G", contact_email: "g@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 2 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders/${o_id}/deliver"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${o_id}", lines: [{ order_line_id: "line-of-${o_id}-0", qty: 2 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /wholesale/return-authorizations/${ra_id}/review"
              payload: { decision: "APPROVE" }
              as: Brand
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /wholesale/return-authorizations/${ra_id}/receive"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/invoices/${inv_id}"
              payload: {}
              as: PlatformAdmin
              captures: { inv_status: $.data.status, inv_due: $.data.amount_due_cents }
            - call: "GET /wholesale/orders/${o_id}"
              payload: {}
