      - name: committee_balance_variant_divergence_between_voting_and_roster_bases
        claim_type: variant_divergence
        grounds:
          - calculations.committee_balance_evaluation.variants.voting_basis
          - calculations.committee_balance_evaluation.variants.roster_basis
        distinguishing_aspect: "The same memberships must yield two different labels because the two variants select different member sets."
        excluded_because:
          difficulty_instance: committee_balance_voting_basis_vs_roster_basis_divergence
          rationale: "That §1.8 dual_variant_calculation instance builds the 3-ACTIVE-plus-2-SUSPENDED-PRODUCER roster and asserts voting_basis dominance 33.3 with BALANCED against roster_basis dominance 60.0 with PROVISIONAL on the same committee in the same request. A §1.9 probe of the divergence would be the identical setup and assertions."

      - name: ballot_approval_variant_selection_by_the_consuming_request
        claim_type: variant_selection
        grounds:
          - calculations.ballot_consensus_evaluation.variants.provisional_at_close
          - calculations.ballot_consensus_evaluation.variants.final_after_adjudication
        distinguishing_aspect: "Which variant runs is decided by the endpoint: close writes provisional_approval_pct, adjudicate writes final_approval_pct."
        excluded_because:
          difficulty_instance: ballot_provisional_close_vs_final_adjudicated_approval_divergence
          rationale: "That §1.8 dual_variant_calculation instance drives both requests in one chain and asserts that the close populated provisional_approval_pct with final_approval_pct still null, then that the adjudication populated final_approval_pct while preserving provisional_approval_pct — which is exactly the variant-selection claim."

      - name: ballot_approval_reconciliation_between_provisional_and_final_percentages
        claim_type: reconciliation
        grounds:
          - calculations.ballot_consensus_evaluation
          - entities.Ballot.fields.provisional_approval_pct
          - entities.Ballot.fields.final_approval_pct
        distinguishing_aspect: "The two stored percentages must reconcile against the same cast votes, with the historical figure never rewritten."
        excluded_because:
          difficulty_instance: ballot_provisional_close_vs_final_adjudicated_approval_divergence
          rationale: "The same §1.8 instance asserts the reconciliation numerically — provisional 66.7 from the cast positions versus final 100.0 after the PERSUASIVE ruling rewrote one negative to affirmative, on identical Vote rows — so a separate §1.9 reconciliation probe would restate its assertions."

