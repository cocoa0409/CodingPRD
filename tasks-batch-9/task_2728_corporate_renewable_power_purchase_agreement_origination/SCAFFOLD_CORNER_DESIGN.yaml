      - name: deemed_generation_input_set_excludes_uncovered_hours_and_unaccepted_claims
        claim_type: input_set_filtering
        grounds:
          - calculations.deemed_generation
          - endpoints.POST_/ppa/risk-events/{id}/review
          - entities.RiskEvent.fields.status
          - entities.MeterInterval.fields.curtailment_flag
        distinguishing_aspect: |
          Four hours of the same period, each failing a different limb of the deemed
          input-set filter, and only one of them earns a make-whole. Hour 1 is curtailed
          and covered by an ACCEPTED buyer-borne claim, so it is grossed up. Hour 2 sits
          inside the same accepted window but carries curtailment_flag NONE. Hour 3
          carries a curtailment flag but falls outside every accepted window. Hour 4
          carries a flag and falls inside a window that is still only CLAIMED - the
          review has not happened, so no deemed volume exists yet. An implementation
          that keys off the flag alone, or off any risk event regardless of status,
          gets three of the four hours wrong.
