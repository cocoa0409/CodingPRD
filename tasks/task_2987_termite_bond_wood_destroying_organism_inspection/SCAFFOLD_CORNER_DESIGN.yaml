      - name: auth_header_missing_x_user_role_outranks_the_role_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=10]
          - validations[priority=20]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: >-
          A request to a ComplianceOfficer-only endpoint with NO identity headers must be 401
          ERR_UNAUTHENTICATED, not 403: the server cannot decide authorisation for an absent role.
          An empty-string header counts as absent, and the only endpoint exempt from the pair is
          GET /_clock/current, which answers unauthenticated.
        test_recipe:
          setup:
            - "Nothing persisted; the checks fire before any lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { address_line1: "1 Nowhere", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
              headers: { X-User-Role: null, X-User-ID: null }
              captures: { e1: $.data.error_id }
            - call: "POST /properties"
              payload: { address_line1: "1 Nowhere", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
              headers: { X-User-Role: "ComplianceOfficer", X-User-ID: "" }
              captures: { e2: $.data.error_id }
            - call: "POST /properties"
              payload: { address_line1: "1 Nowhere", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: PropertyOwner
              as_user_id: "owner-1"
              captures: { e3: $.data.error_id }
            - call: "GET /_clock/current"
              payload: {}
              as: ComplianceOfficer
              headers: { X-User-Role: null, X-User-ID: null }
          assert:
            - "no headers at all -> 401 ERR_UNAUTHENTICATED"
            - "an empty-string X-User-ID with a valid role -> still 401 ERR_UNAUTHENTICATED, because the rule requires non-empty, not merely present"
            - "a well-formed PropertyOwner identity -> 403 ERR_UNAUTHORIZED, proving the 401 was about the headers and not about the role"
            - "GET /_clock/current answers 200 with the current logical clock even with no headers — the single declared exemption"
            - "no Property row is created by any of the three refused calls"

      - name: pagination_bounds_are_enforced_on_every_list_endpoint
        claim_type: violation_to_error
        grounds:
          - validations[priority=55]
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: >-
          limit is bounded on BOTH sides — 0 and 101 are equally invalid while 1 and 100 are
          accepted — and offset must be non-negative but is otherwise unbounded, so an offset past
          the end is a legal empty page rather than an error.
        test_recipe:
          setup:
            - "Two properties so that a legal page can be non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "411 Cypress Row", state_code: "FL", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { address_line1: "9 Peach Lane", state_code: "GA", construction_type: "SLAB", square_footage: 2000, linear_footage: 180, year_built: 1995 }
              as: ComplianceOfficer
          trigger:
            - call: "GET /properties"
              payload: { limit: 0, offset: 0 }
              as: BranchManager
              captures: { e1: $.data.error_id }
            - call: "GET /properties"
              payload: { limit: 101, offset: 0 }
              as: BranchManager
              captures: { e2: $.data.error_id }
            - call: "GET /properties"
              payload: { limit: 10, offset: -1 }
              as: BranchManager
              captures: { e3: $.data.error_id }
            - call: "GET /properties"
              payload: { limit: 100, offset: 0 }
              as: BranchManager
            - call: "GET /properties"
              payload: { limit: 1, offset: 500 }
              as: BranchManager
          assert:
            - "limit 0 -> 400 ERR_INVALID_PAGINATION; limit 101 -> 400 ERR_INVALID_PAGINATION; offset -1 -> 400 ERR_INVALID_PAGINATION"
            - "limit 100 offset 0 -> 200 with total_count 2, has_more false"
            - "limit 1 offset 500 -> 200 with an empty data array, total_count 2 and has_more false — past-the-end is not an error"
            - "the same three violations behave identically on GET /inspections and GET /bonds; the rule is declared for all list endpoints, not per-resource"
            - "omitting limit and offset entirely is legal and yields the endpoint default page"

