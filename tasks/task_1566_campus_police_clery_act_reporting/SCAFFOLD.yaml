scenario: |
  Campus Police & Clery Act Reporting (campus police department): incident report & crime classification by Clery geography, timely warning & emergency notification decision, daily crime log maintenance & public access, campus security authority training & report collection, annual security report compilation & disclosure deadline, VAWA offense statistics & drug/alcohol referral counting, fire safety report for residential facilities, program review & correction

domain_name: campus-police-clery
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: event_sourcing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CleryGeography
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Geography zone name" }
      - { name: category, type: enum, source: input, description: "ON_CAMPUS | ON_CAMPUS_RESIDENTIAL | NON_CAMPUS | PUBLIC_PROPERTY", constraints: "enum must be one of the four listed values" }
      - { name: is_residential_facility, type: boolean, source: input, default: false, description: "True only for on-campus student housing facilities; required true for fire-incident geography" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: CampusSecurityAuthority
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "CSA full name" }
      - { name: email, type: string, source: input, description: "CSA contact email" }
      - { name: department, type: string, source: input, description: "Department the CSA belongs to" }
      - { name: csa_category, type: enum, source: input, description: "DEAN | COACH | RESIDENT_ADVISOR | SECURITY_STAFF | OTHER_OFFICIAL" }
      - { name: status, type: enum, source: system, default: PENDING_TRAINING, description: "PENDING_TRAINING | ACTIVE | LAPSED | INACTIVE" }
      - { name: certification_expires_at, type: datetime, source: computed, description: "Null until first passing CSATrainingRecord; set by csa_certification_window" }
      - { name: active_training_record_id, type: string, source: system, description: "FK -> CSATrainingRecord.id; the record currently conferring certification, null when none" }

  - name: CSATrainingRecord
    parent: CampusSecurityAuthority
    common_fields: true
    fields:
      - { name: csa_id, type: string, source: system, description: "FK -> CampusSecurityAuthority.id" }
      - { name: completed_at, type: datetime, source: input, description: "When the training was completed" }
      - { name: score, type: integer, source: input, description: "0-100; pass threshold is TRAINING_PASS_SCORE (80), inclusive" }
      - { name: passed, type: boolean, source: computed, description: "score >= 80" }
      - { name: training_year, type: integer, source: computed, description: "Calendar year of completed_at" }
      - { name: valid_from, type: datetime, source: computed, description: "= completed_at" }
      - { name: valid_to, type: datetime, source: computed, description: "Per csa_certification_window: (training_year+1)-09-30T23:59:59Z; validity window is half-open [valid_from, valid_to)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED (system-set when logical clock passes valid_to)" }

  - name: CSAReferralReport
    parent: null
    common_fields: true
    fields:
      - { name: csa_id, type: string, source: system, description: "FK -> CampusSecurityAuthority.id; taken from X-User-ID of the CSA caller" }
      - { name: geography_id, type: string, source: input, description: "FK -> CleryGeography.id" }
      - { name: occurred_at, type: datetime, source: input, description: "When the reported incident occurred" }
      - { name: occurred_end_at, type: datetime, source: input, description: "Optional end of occurrence window; must be >= occurred_at" }
      - { name: offense_suspicion, type: enum, source: input, description: "Same offense enum as OffenseCount.offense_type" }
      - { name: narrative, type: string, source: input, description: "Free-text report narrative" }
      - { name: received_at, type: datetime, source: system, description: "= created_at" }
      - { name: forwarded_at, type: datetime, source: system, description: "Set on forward transition; null before" }
      - { name: forward_overdue, type: boolean, source: computed, description: "true when forwarded_at > received_at + 24h (strictly greater); false if forwarded within or at 24h" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | FORWARDED | LINKED | DUPLICATE" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: report_number, type: string, source: system, description: "Server-minted IR-<year>-<seq6>; client-supplied value ignored" }
      - { name: reported_at, type: datetime, source: input, description: "When the incident was reported to campus police" }
      - { name: occurred_at, type: datetime, source: input, description: "When the incident occurred; ASR year membership keyed to calendar year of occurred_at" }
      - { name: occurred_end_at, type: datetime, source: input, description: "Optional; must be >= occurred_at" }
      - { name: geography_id, type: string, source: input, description: "FK -> CleryGeography.id; confirmed or replaced at classify time" }
      - { name: source, type: enum, source: input, description: "POLICE_DIRECT | CSA_REFERRAL | ANONYMOUS" }
      - { name: referral_id, type: string, source: input, description: "FK -> CSAReferralReport.id; optional, required iff source == CSA_REFERRAL" }
      - { name: narrative, type: string, source: input, description: "Incident narrative" }
      - { name: is_clery_reportable, type: boolean, source: computed, description: "true once CLASSIFIED with at least one COUNTED OffenseCount" }
      - { name: classified_at, type: datetime, source: system, description: "Timestamp of most recent successful classify" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | UNDER_CLASSIFICATION | CLASSIFIED | UNDER_RECLASSIFICATION | UNFOUNDED | WITHDRAWN" }

  - name: OffenseCount
    parent: IncidentReport
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> IncidentReport.id" }
      - { name: offense_type, type: enum, source: input, description: "CRIMINAL_HOMICIDE | SEX_OFFENSE | ROBBERY | AGGRAVATED_ASSAULT | BURGLARY | MOTOR_VEHICLE_THEFT | ARSON | DOMESTIC_VIOLENCE | DATING_VIOLENCE | STALKING | HATE_CRIME | LIQUOR_LAW_REFERRAL | DRUG_LAW_REFERRAL | WEAPONS_LAW_REFERRAL | NON_CLERY" }
      - { name: victim_count, type: integer, source: input, default: 1, description: "Number of victims for countable offenses; >= 1" }
      - { name: referred_persons, type: integer, source: input, default: 0, description: "Persons referred for disciplinary action; only meaningful for *_REFERRAL offense types" }
      - { name: bias_motivation, type: enum, source: input, default: NONE, description: "NONE | RACE | RELIGION | SEXUAL_ORIENTATION | GENDER | GENDER_IDENTITY | ETHNICITY | NATIONAL_ORIGIN | DISABILITY" }
      - { name: hierarchy_rank, type: integer, source: computed, description: "Per offense_hierarchy_resolution rank table; client input ignored" }
      - { name: is_exempt_from_hierarchy, type: boolean, source: computed, description: "true for ARSON, DOMESTIC_VIOLENCE, DATING_VIOLENCE, STALKING, HATE_CRIME, and all *_REFERRAL types" }
      - { name: status, type: enum, source: system, description: "COUNTED | EXCLUDED_BY_HIERARCHY | EXCLUDED_UNFOUNDED" }

  - name: SafetyAlert
    parent: IncidentReport
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> IncidentReport.id" }
      - { name: alert_type, type: enum, source: input, description: "TIMELY_WARNING | EMERGENCY_NOTIFICATION" }
      - { name: decision, type: enum, source: system, description: "Null until decide; ISSUE | NO_ISSUE" }
      - { name: decision_rationale, type: string, source: input, description: "Required at decide" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding CleryCoordinator" }
      - { name: decided_at, type: datetime, source: system, description: "Null until decide" }
      - { name: decision_deadline_at, type: datetime, source: computed, description: "= incident.reported_at + WARNING_DECISION_HOURS (48h)" }
      - { name: decision_overdue, type: boolean, source: computed, description: "true iff decided_at > decision_deadline_at (strictly greater; exactly at deadline is on time)" }
      - { name: authorized_by, type: string, source: system, description: "X-User-ID of authorizing PoliceChief" }
      - { name: authorized_at, type: datetime, source: system, description: "Null until authorize" }
      - { name: dissemination_deadline_at, type: datetime, source: computed, description: "= authorized_at + DISSEMINATION_HOURS (24h)" }
      - { name: dissemination_overdue, type: boolean, source: computed, description: "true iff disseminated_at > dissemination_deadline_at (strictly greater)" }
      - { name: distribution_channels, type: array, source: input, description: "Non-empty subset of EMAIL | SMS | POSTERS | WEBSITE | SIREN at disseminate" }
      - { name: disseminated_at, type: datetime, source: system, description: "Null until disseminate" }
      - { name: closed_at, type: datetime, source: system, description: "Set on close; used by REOPEN_WINDOW_HOURS (72h) rule" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW | DECIDED_ISSUE | DECIDED_NO_ISSUE | AUTHORIZED | DISSEMINATED | CLOSED" }

  - name: DailyCrimeLogEntry
    parent: null
    common_fields: true
    fields:
      - { name: entry_number, type: string, source: system, description: "Server-minted CL-<seq6>, unique, never reused" }
      - { name: incident_id, type: string, source: system, description: "FK -> IncidentReport.id; exactly one entry per incident, created on incident submit" }
      - { name: nature, type: string, source: computed, description: "Primary offense label after classification; 'Unclassified' before" }
      - { name: date_reported, type: datetime, source: system, description: "Copied from incident.reported_at" }
      - { name: date_occurred, type: datetime, source: system, description: "Copied from incident.occurred_at" }
      - { name: general_location, type: string, source: computed, description: "Geography name at classification time" }
      - { name: disposition, type: enum, source: system, default: OPEN, description: "OPEN | INVESTIGATION_PENDING | CLEARED_BY_ARREST | CLEARED_EXCEPTIONAL | UNFOUNDED (UNFOUNDED set only by incident unfound cascade)" }
      - { name: last_disposition_change_at, type: datetime, source: system, description: "Set on every disposition mutation" }
      - { name: entry_overdue, type: boolean, source: computed, description: "Per log_entry_timeliness: entry created more than 2 business days after date_reported" }
      - { name: disposition_update_overdue, type: boolean, source: computed, description: "Per log_entry_timeliness applied to disposition changes vs the underlying decision time" }
      - { name: is_public, type: boolean, source: computed, description: "false when parent incident is DRAFT, WITHDRAWN, or UNFOUNDED; true otherwise" }

  - name: LogInspectionRequest
    parent: null
    common_fields: true
    fields:
      - { name: requester_name, type: string, source: input, description: "Public requester name" }
      - { name: requester_contact, type: string, source: input, description: "Public requester contact" }
      - { name: from_date, type: string, source: input, description: "ISO date, inclusive lower bound of requested log window" }
      - { name: to_date, type: string, source: input, description: "ISO date, inclusive upper bound; must be >= from_date" }
      - { name: requested_at, type: datetime, source: system, description: "= created_at" }
      - { name: due_at, type: datetime, source: computed, description: "Authoritative fulfillment deadline per inspection_fulfillment_window CALENDAR_DATE variant" }
      - { name: provisional_due_at, type: datetime, source: computed, description: "Provisional deadline per ELAPSED_HOURS variant; informational only" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Set on fulfill; set immediately at creation when all matching entries are inside the 60-day immediate window" }
      - { name: is_overdue, type: boolean, source: computed, description: "true iff status == PENDING and logical clock > due_at" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | FULFILLED" }

  - name: AnnualSecurityReport
    parent: null
    common_fields: true
    fields:
      - { name: report_year, type: integer, source: input, description: "Calendar year the ASR covers; unique across all ASRs" }
      - { name: statistics_version, type: integer, source: system, default: 0, description: "Increments on every successful compile" }
      - { name: compiled_at, type: datetime, source: system, description: "Timestamp of latest compile" }
      - { name: final_compile_done, type: boolean, source: system, default: false, description: "True once a FINAL-variant compile has succeeded" }
      - { name: statistics_stale, type: boolean, source: system, default: false, description: "Set true by the unfound cascade; cleared by the next successful compile" }
      - { name: amendment_started_at, type: datetime, source: system, description: "Set on begin-amendment" }
      - { name: published_at, type: datetime, source: system, description: "Set on publish/republish" }
      - { name: is_late, type: boolean, source: computed, description: "true iff published_at > (report_year+1)-10-01T00:00:00Z (strictly greater)" }
      - { name: status, type: enum, source: system, default: COLLECTING, description: "COLLECTING | UNDER_REVIEW | PUBLISHED | UNDER_AMENDMENT | REPUBLISHED" }

  - name: StatisticLine
    parent: AnnualSecurityReport
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> AnnualSecurityReport.id" }
      - { name: statistics_version, type: integer, source: system, description: "Snapshot membership; only rows with statistics_version == report.statistics_version are CURRENT" }
      - { name: compilation_variant, type: enum, source: system, description: "PROVISIONAL | FINAL" }
      - { name: offense_type, type: enum, source: system, description: "Same enum as OffenseCount.offense_type" }
      - { name: geography_column, type: enum, source: system, description: "ON_CAMPUS | ON_CAMPUS_RESIDENTIAL | NON_CAMPUS | PUBLIC_PROPERTY" }
      - { name: count, type: integer, source: computed, description: "Number of incidents counted for this cell per asr_statistics_compilation" }
      - { name: referred_persons_count, type: integer, source: computed, description: "Sum of OffenseCount.referred_persons for referral cells; 0 for non-referral cells" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "CURRENT | SUPERSEDED (set by recompile or the unfound cascade)" }

  - name: FireIncident
    parent: null
    common_fields: true
    fields:
      - { name: geography_id, type: string, source: input, description: "FK -> CleryGeography.id; must reference a geography with is_residential_facility == true" }
      - { name: occurred_at, type: datetime, source: input, description: "Fire occurrence time; report-year membership by calendar year of occurred_at" }
      - { name: cause_category, type: enum, source: input, description: "COOKING | ELECTRICAL | HEATING | SMOKING_MATERIALS | OPEN_FLAME | INTENTIONAL | UNDETERMINED" }
      - { name: injuries, type: integer, source: input, default: 0, description: "Fire-related injuries, >= 0" }
      - { name: deaths, type: integer, source: input, default: 0, description: "Fire-related deaths, >= 0" }
      - { name: estimated_damage_dollars, type: number, source: input, description: "Pre-adjudication estimate, >= 0" }
      - { name: adjudicated_damage_dollars, type: number, source: input, description: "Provided at finalize" }
      - { name: final_damage_dollars, type: integer, source: computed, description: "round_half_up(adjudicated_damage_dollars) to whole dollars at finalize; null before" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | FINALIZED | UNDER_ADJUSTMENT" }

  - name: FireSafetyReport
    parent: null
    common_fields: true
    fields:
      - { name: report_year, type: integer, source: input, description: "Calendar year covered; unique across all fire safety reports" }
      - { name: total_fires, type: integer, source: computed, default: 0, description: "Snapshot at compile: FINALIZED FireIncidents in report_year" }
      - { name: total_injuries, type: integer, source: computed, default: 0, description: "Snapshot at compile" }
      - { name: total_deaths, type: integer, source: computed, default: 0, description: "Snapshot at compile" }
      - { name: total_damage_dollars, type: integer, source: computed, default: 0, description: "Snapshot at compile: SUM of per-incident rounded final_damage_dollars (round-per-incident-then-sum; never round of sum)" }
      - { name: provisional_total_damage_dollars, type: number, source: computed, default: 0, description: "Snapshot at compile: SUM of estimated_damage_dollars over REPORTED (unfinalized) incidents; provisional variant only" }
      - { name: totals_stale, type: boolean, source: system, default: false, description: "Set true when a FireIncident in report_year is finalized/adjusted after the latest compile; cleared on compile" }
      - { name: published_at, type: datetime, source: system, description: "Set on publish/republish" }
      - { name: is_late, type: boolean, source: computed, description: "true iff published_at > (report_year+1)-10-01T00:00:00Z (strictly greater)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | COMPILED | PUBLISHED | UNDER_AMENDMENT | REPUBLISHED" }

  - name: ProgramReview
    parent: null
    common_fields: true
    fields:
      - { name: scope_year_start, type: integer, source: input, description: "First covered calendar year (inclusive)" }
      - { name: scope_year_end, type: integer, source: input, description: "Last covered calendar year (inclusive); must be >= scope_year_start; closed interval must not overlap any non-CLOSED review" }
      - { name: opened_at, type: datetime, source: system, description: "= created_at" }
      - { name: penalty_score, type: integer, source: computed, default: 0, description: "Per program_review_penalty_score: SUM of CorrectiveAction.weight over the review's actions" }
      - { name: escalated, type: boolean, source: computed, default: false, description: "true iff penalty_score >= ESCALATION_SCORE_THRESHOLD (100)" }
      - { name: open_action_count, type: integer, source: computed, default: 0, description: "Actions in OPEN or SUBMITTED status" }
      - { name: status, type: enum, source: system, default: OPENED, description: "OPENED | FINDINGS_ISSUED | CORRECTIVE_ACTION | UNDER_VERIFICATION | CLOSED" }

  - name: CorrectiveAction
    parent: ProgramReview
    common_fields: true
    fields:
      - { name: review_id, type: string, source: system, description: "FK -> ProgramReview.id" }
      - { name: finding_code, type: string, source: input, description: "Finding identifier; equality with an action in any CLOSED review marks a repeat" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: description, type: string, source: input, description: "Finding description" }
      - { name: due_date, type: string, source: input, description: "ISO date; must be >= date portion of review.opened_at" }
      - { name: is_repeat_finding, type: boolean, source: computed, description: "true iff same finding_code exists on a CorrectiveAction of any CLOSED ProgramReview" }
      - { name: weight, type: integer, source: computed, description: "LOW 10 | MEDIUM 25 | HIGH 50, doubled when is_repeat_finding" }
      - { name: resolution_summary, type: string, source: input, description: "Provided at submit" }
      - { name: rejection_count, type: integer, source: system, default: 0, description: "Increments on every reject" }
      - { name: verification_note, type: string, source: input, description: "Provided at reject" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | SUBMITTED | VERIFIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IncidentReport
    initial_state: DRAFT
    terminal_states: [UNFOUNDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /incident-reports/{id}/submit
        actor: CleryCoordinator
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade: create DailyCrimeLogEntry (exactly one per incident) copying date_reported/date_occurred, nature 'Unclassified', disposition OPEN; entry_overdue computed per log_entry_timeliness"
          - "Increments IncidentReport.version by 1"
      - from: SUBMITTED
        to: UNDER_CLASSIFICATION
        trigger: POST /incident-reports/{id}/begin-classification
        actor: CleryCoordinator
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Increments IncidentReport.version by 1"
      - from: UNDER_CLASSIFICATION
        to: CLASSIFIED
        trigger: POST /incident-reports/{id}/classify
        actor: CleryCoordinator
        preconditions:
          - "status == UNDER_CLASSIFICATION (ERR_INVALID_STATE)"
          - "expected_incident_version == current version (ERR_STALE_VERSION)"
          - "offense_counts non-empty and geography valid per validations"
        side_effects:
          - "Replace all OffenseCount rows with the submitted set; compute hierarchy_rank, is_exempt_from_hierarchy, status (COUNTED vs EXCLUDED_BY_HIERARCHY) per offense_hierarchy_resolution"
          - "Cascade: DailyCrimeLogEntry.nature := primary offense label; general_location := geography name"
          - "classified_at := now; is_clery_reportable recomputed"
          - "Increments IncidentReport.version by 1"
      - from: CLASSIFIED
        to: UNDER_RECLASSIFICATION
        trigger: POST /incident-reports/{id}/begin-reclassification
        actor: CleryCoordinator
        preconditions:
          - "status == CLASSIFIED (ERR_INVALID_STATE)"
          - "AnnualSecurityReport for year(occurred_at) must not exist in status PUBLISHED or REPUBLISHED (ERR_REPORT_LOCKED)"
        side_effects:
          - "Increments IncidentReport.version by 1"
      - from: UNDER_RECLASSIFICATION
        to: CLASSIFIED
        trigger: POST /incident-reports/{id}/classify
        actor: CleryCoordinator
        preconditions:
          - "status == UNDER_RECLASSIFICATION (ERR_INVALID_STATE)"
          - "expected_incident_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "Same OffenseCount replacement and log-entry cascade as UNDER_CLASSIFICATION -> CLASSIFIED"
          - "If an AnnualSecurityReport for year(occurred_at) exists in COLLECTING or UNDER_AMENDMENT with statistics_version > 0: set statistics_stale = true and mark its CURRENT StatisticLine rows SUPERSEDED"
          - "Increments IncidentReport.version by 1"
      - from: UNDER_CLASSIFICATION
        to: UNFOUNDED
        trigger: POST /incident-reports/{id}/unfound
        actor: PoliceChief
        preconditions:
          - "status in {UNDER_CLASSIFICATION, UNDER_RECLASSIFICATION, CLASSIFIED} (ERR_INVALID_STATE; from UNFOUNDED or WITHDRAWN ERR_INCIDENT_TERMINAL)"
          - "justification non-empty (ERR_UNFOUNDED_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "Cascade link 1: DailyCrimeLogEntry.disposition := UNFOUNDED, is_public := false, last_disposition_change_at := now"
          - "Cascade link 2 (from the log-entry mutation): AnnualSecurityReport for year(occurred_at), if statistics_version > 0, gets statistics_stale := true"
          - "Cascade link 3 (from statistics_stale flipping true): all CURRENT StatisticLine rows of that report -> SUPERSEDED"
          - "All OffenseCount rows -> EXCLUDED_UNFOUNDED"
          - "Increments IncidentReport.version by 1"
      - from: UNDER_RECLASSIFICATION
        to: UNFOUNDED
        trigger: POST /incident-reports/{id}/unfound
        actor: PoliceChief
        preconditions:
          - "justification non-empty (ERR_UNFOUNDED_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "Same cascade chain as UNDER_CLASSIFICATION -> UNFOUNDED"
          - "Increments IncidentReport.version by 1"
      - from: CLASSIFIED
        to: UNFOUNDED
        trigger: POST /incident-reports/{id}/unfound
        actor: PoliceChief
        preconditions:
          - "justification non-empty (ERR_UNFOUNDED_JUSTIFICATION_REQUIRED)"
        side_effects:
          - "Same cascade chain as UNDER_CLASSIFICATION -> UNFOUNDED"
          - "Increments IncidentReport.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /incident-reports/{id}/withdraw
        actor: CleryCoordinator
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Increments IncidentReport.version by 1"

  - entity: SafetyAlert
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: DECIDED_ISSUE
        trigger: POST /safety-alerts/{id}/decide with decision == ISSUE
        actor: CleryCoordinator
        preconditions:
          - "status == PENDING_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at := now; decided_by := caller; decision_overdue computed (decided_at > decision_deadline_at)"
      - from: PENDING_REVIEW
        to: DECIDED_NO_ISSUE
        trigger: POST /safety-alerts/{id}/decide with decision == NO_ISSUE
        actor: CleryCoordinator
        preconditions:
          - "status == PENDING_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "decided_at := now; decision_overdue computed"
      - from: DECIDED_ISSUE
        to: AUTHORIZED
        trigger: POST /safety-alerts/{id}/authorize
        actor: PoliceChief
        preconditions:
          - "status == DECIDED_ISSUE (ERR_INVALID_STATE)"
        side_effects:
          - "authorized_at := now; dissemination_deadline_at := authorized_at + 24h"
      - from: AUTHORIZED
        to: DISSEMINATED
        trigger: POST /safety-alerts/{id}/disseminate
        actor: PoliceChief
        preconditions:
          - "status == AUTHORIZED (ERR_INVALID_STATE)"
          - "distribution_channels non-empty (ERR_NO_DISTRIBUTION_CHANNELS)"
        side_effects:
          - "disseminated_at := now; dissemination_overdue computed (disseminated_at > dissemination_deadline_at)"
      - from: DISSEMINATED
        to: CLOSED
        trigger: POST /safety-alerts/{id}/close
        actor: CleryCoordinator
        preconditions:
          - "status in {DISSEMINATED, DECIDED_NO_ISSUE} (ERR_INVALID_STATE)"
        side_effects:
          - "closed_at := now"
      - from: DECIDED_NO_ISSUE
        to: CLOSED
        trigger: POST /safety-alerts/{id}/close
        actor: CleryCoordinator
        preconditions:
          - "status in {DISSEMINATED, DECIDED_NO_ISSUE} (ERR_INVALID_STATE)"
        side_effects:
          - "closed_at := now"
      - from: CLOSED
        to: PENDING_REVIEW
        trigger: POST /safety-alerts/{id}/reopen
        actor: CleryCoordinator
        preconditions:
          - "status == CLOSED (ERR_INVALID_STATE)"
          - "now <= closed_at + REOPEN_WINDOW_HOURS (72h) (ERR_ALERT_WINDOW_EXPIRED)"
        side_effects:
          - "decision, decided_at, authorized_at, disseminated_at, closed_at reset to null; decision_overdue/dissemination_overdue reset false"

  - entity: DailyCrimeLogEntry
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: INVESTIGATION_PENDING
        trigger: PATCH /daily-crime-log-entries/{id}/disposition with disposition == INVESTIGATION_PENDING
        actor: PoliceChief
        preconditions:
          - "disposition == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "last_disposition_change_at := now; disposition_update_overdue recomputed"
      - from: INVESTIGATION_PENDING
        to: CLEARED_BY_ARREST
        trigger: PATCH /daily-crime-log-entries/{id}/disposition with disposition == CLEARED_BY_ARREST
        actor: PoliceChief
        preconditions:
          - "disposition == INVESTIGATION_PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "last_disposition_change_at := now; disposition_update_overdue recomputed"
      - from: INVESTIGATION_PENDING
        to: CLEARED_EXCEPTIONAL
        trigger: PATCH /daily-crime-log-entries/{id}/disposition with disposition == CLEARED_EXCEPTIONAL
        actor: PoliceChief
        preconditions:
          - "disposition == INVESTIGATION_PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "last_disposition_change_at := now; disposition_update_overdue recomputed"
      - from: CLEARED_BY_ARREST
        to: OPEN
        trigger: PATCH /daily-crime-log-entries/{id}/disposition with disposition == OPEN (reopen)
        actor: PoliceChief
        preconditions:
          - "disposition in {CLEARED_BY_ARREST, CLEARED_EXCEPTIONAL} (ERR_INVALID_STATE)"
        side_effects:
          - "last_disposition_change_at := now"
      - from: CLEARED_EXCEPTIONAL
        to: OPEN
        trigger: PATCH /daily-crime-log-entries/{id}/disposition with disposition == OPEN (reopen)
        actor: PoliceChief
        preconditions:
          - "disposition in {CLEARED_BY_ARREST, CLEARED_EXCEPTIONAL} (ERR_INVALID_STATE)"
        side_effects:
          - "last_disposition_change_at := now"
      - from: OPEN
        to: UNFOUNDED
        trigger: system (cascade from IncidentReport unfound transition)
        actor: system
        preconditions: []
        side_effects:
          - "is_public := false; triggers ASR statistics_stale cascade (see IncidentReport unfound)"
      - from: INVESTIGATION_PENDING
        to: OPEN
        trigger: PATCH /daily-crime-log-entries/{id}/disposition with disposition == OPEN
        actor: PoliceChief
        preconditions:
          - "disposition == INVESTIGATION_PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "last_disposition_change_at := now"

  - entity: CampusSecurityAuthority
    initial_state: PENDING_TRAINING
    terminal_states: [INACTIVE]
    transitions:
      - from: PENDING_TRAINING
        to: ACTIVE
        trigger: POST /campus-security-authorities/{id}/training-records (passing score)
        actor: SystemAdmin
        preconditions:
          - "status in {PENDING_TRAINING, LAPSED} (ERR_INVALID_STATE)"
          - "score >= 80 and no window overlap (ERR_TRAINING_WINDOW_OVERLAP)"
        side_effects:
          - "certification_expires_at := new record valid_to; active_training_record_id := new record id"
      - from: LAPSED
        to: ACTIVE
        trigger: POST /campus-security-authorities/{id}/training-records (passing score)
        actor: SystemAdmin
        preconditions:
          - "status in {PENDING_TRAINING, LAPSED} (ERR_INVALID_STATE)"
          - "score >= 80 and no window overlap (ERR_TRAINING_WINDOW_OVERLAP)"
        side_effects:
          - "certification_expires_at := new record valid_to; active_training_record_id := new record id"
      - from: ACTIVE
        to: LAPSED
        trigger: system (logical clock passes certification_expires_at)
        actor: system
        preconditions:
          - "now > certification_expires_at"
        side_effects:
          - "Current CSATrainingRecord.status := EXPIRED"
      - from: PENDING_TRAINING
        to: INACTIVE
        trigger: POST /campus-security-authorities/{id}/deactivate
        actor: SystemAdmin
        preconditions:
          - "status != INACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: POST /campus-security-authorities/{id}/deactivate
        actor: SystemAdmin
        preconditions:
          - "status != INACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: LAPSED
        to: INACTIVE
        trigger: POST /campus-security-authorities/{id}/deactivate
        actor: SystemAdmin
        preconditions:
          - "status != INACTIVE (ERR_INVALID_STATE)"
        side_effects: []

  - entity: CSATrainingRecord
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: system (logical clock passes valid_to)
        actor: system
        preconditions:
          - "now > valid_to"
        side_effects:
          - "Parent CampusSecurityAuthority transitions ACTIVE -> LAPSED when this record is its active_training_record_id"

  - entity: CSAReferralReport
    initial_state: RECEIVED
    terminal_states: [LINKED, DUPLICATE]
    transitions:
      - from: RECEIVED
        to: FORWARDED
        trigger: POST /csa-referral-reports/{id}/forward
        actor: CampusSecurityAuthority
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
          - "caller X-User-ID == csa_id (ERR_FORBIDDEN)"
        side_effects:
          - "forwarded_at := now; forward_overdue := forwarded_at > received_at + 24h"
      - from: FORWARDED
        to: LINKED
        trigger: POST /incident-reports with referral_id == this report
        actor: CleryCoordinator
        preconditions:
          - "status == FORWARDED (ERR_INVALID_STATE)"
        side_effects:
          - "IncidentReport.referral_id set; incident created in DRAFT"
      - from: RECEIVED
        to: DUPLICATE
        trigger: POST /csa-referral-reports/{id}/mark-duplicate
        actor: CleryCoordinator
        preconditions:
          - "status in {RECEIVED, FORWARDED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: FORWARDED
        to: DUPLICATE
        trigger: POST /csa-referral-reports/{id}/mark-duplicate
        actor: CleryCoordinator
        preconditions:
          - "status in {RECEIVED, FORWARDED} (ERR_INVALID_STATE)"
        side_effects: []

  - entity: AnnualSecurityReport
    initial_state: COLLECTING
    terminal_states: []
    transitions:
      - from: COLLECTING
        to: UNDER_REVIEW
        trigger: POST /annual-security-reports/{id}/submit-review
        actor: CleryCoordinator
        preconditions:
          - "status == COLLECTING (ERR_INVALID_STATE)"
          - "final_compile_done == true (ERR_FINAL_COMPILE_REQUIRED)"
        side_effects: []
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: POST /annual-security-reports/{id}/publish
        actor: PoliceChief
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "published_at := now; is_late := published_at > (report_year+1)-10-01T00:00:00Z"
      - from: PUBLISHED
        to: UNDER_AMENDMENT
        trigger: POST /annual-security-reports/{id}/begin-amendment
        actor: CleryCoordinator
        preconditions:
          - "status in {PUBLISHED, REPUBLISHED} (ERR_INVALID_STATE)"
        side_effects:
          - "amendment_started_at := now"
      - from: REPUBLISHED
        to: UNDER_AMENDMENT
        trigger: POST /annual-security-reports/{id}/begin-amendment
        actor: CleryCoordinator
        preconditions:
          - "status in {PUBLISHED, REPUBLISHED} (ERR_INVALID_STATE)"
        side_effects:
          - "amendment_started_at := now"
      - from: UNDER_AMENDMENT
        to: REPUBLISHED
        trigger: POST /annual-security-reports/{id}/republish
        actor: PoliceChief
        preconditions:
          - "status == UNDER_AMENDMENT (ERR_INVALID_STATE)"
          - "compiled_at > amendment_started_at (ERR_RECOMPILE_REQUIRED)"
        side_effects:
          - "published_at := now; is_late recomputed"

  - entity: FireIncident
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: FINALIZED
        trigger: POST /fire-incidents/{id}/finalize
        actor: PoliceChief
        preconditions:
          - "status in {REPORTED, UNDER_ADJUSTMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "final_damage_dollars := round_half_up(adjudicated_damage_dollars, 0)"
          - "Cascade link 1: FireSafetyReport for year(occurred_at), if it exists and has been compiled at least once, gets totals_stale := true"
          - "Cascade link 2 (from totals_stale flipping true): if that FireSafetyReport.status == PUBLISHED or REPUBLISHED, status auto-transitions to UNDER_AMENDMENT"
      - from: UNDER_ADJUSTMENT
        to: FINALIZED
        trigger: POST /fire-incidents/{id}/finalize
        actor: PoliceChief
        preconditions:
          - "status in {REPORTED, UNDER_ADJUSTMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "Same as REPORTED -> FINALIZED"
      - from: FINALIZED
        to: UNDER_ADJUSTMENT
        trigger: POST /fire-incidents/{id}/begin-adjustment
        actor: PoliceChief
        preconditions:
          - "status == FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "FireSafetyReport for year(occurred_at) gets totals_stale := true (same cascade link 2 as finalize)"

  - entity: FireSafetyReport
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: COMPILED
        trigger: POST /fire-safety-reports/{id}/compile
        actor: CleryCoordinator
        preconditions:
          - "status in {DRAFT, COMPILED, UNDER_AMENDMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "Snapshot totals per fire_damage_aggregation; totals_stale := false"
      - from: COMPILED
        to: COMPILED
        trigger: POST /fire-safety-reports/{id}/compile
        actor: CleryCoordinator
        preconditions:
          - "status in {DRAFT, COMPILED, UNDER_AMENDMENT} (ERR_INVALID_STATE)"
        side_effects:
          - "Snapshot refreshed; totals_stale := false"
      - from: COMPILED
        to: PUBLISHED
        trigger: POST /fire-safety-reports/{id}/publish
        actor: PoliceChief
        preconditions:
          - "status == COMPILED (ERR_INVALID_STATE)"
        side_effects:
          - "published_at := now; is_late computed"
      - from: PUBLISHED
        to: UNDER_AMENDMENT
        trigger: POST /fire-safety-reports/{id}/begin-amendment OR system cascade from FireIncident finalize/adjustment
        actor: CleryCoordinator
        preconditions:
          - "status in {PUBLISHED, REPUBLISHED} (ERR_INVALID_STATE) for the manual trigger"
        side_effects: []
      - from: REPUBLISHED
        to: UNDER_AMENDMENT
        trigger: POST /fire-safety-reports/{id}/begin-amendment OR system cascade
        actor: CleryCoordinator
        preconditions:
          - "status in {PUBLISHED, REPUBLISHED} (ERR_INVALID_STATE) for the manual trigger"
        side_effects: []
      - from: UNDER_AMENDMENT
        to: REPUBLISHED
        trigger: POST /fire-safety-reports/{id}/publish
        actor: PoliceChief
        preconditions:
          - "status == UNDER_AMENDMENT and totals_stale == false (ERR_INVALID_STATE)"
        side_effects:
          - "published_at := now; is_late recomputed"

  - entity: ProgramReview
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: FINDINGS_ISSUED
        trigger: POST /program-reviews/{id}/advance
        actor: FederalReviewer
        preconditions:
          - "status == OPENED (ERR_INVALID_STATE)"
        side_effects: []
      - from: FINDINGS_ISSUED
        to: CORRECTIVE_ACTION
        trigger: POST /program-reviews/{id}/advance
        actor: FederalReviewer
        preconditions:
          - "status == FINDINGS_ISSUED (ERR_INVALID_STATE)"
          - "At least one CorrectiveAction exists (ERR_UNRESOLVED_ACTIONS)"
        side_effects: []
      - from: CORRECTIVE_ACTION
        to: UNDER_VERIFICATION
        trigger: POST /program-reviews/{id}/advance OR system auto-advance when open_action_count reaches 0
        actor: FederalReviewer
        preconditions:
          - "status == CORRECTIVE_ACTION (ERR_INVALID_STATE for manual)"
          - "open_action_count == 0 (ERR_UNRESOLVED_ACTIONS for manual)"
        side_effects:
          - "penalty_score recomputed; escalated recomputed"
      - from: UNDER_VERIFICATION
        to: CORRECTIVE_ACTION
        trigger: POST /program-reviews/{id}/return-for-correction
        actor: FederalReviewer
        preconditions:
          - "status == UNDER_VERIFICATION (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_VERIFICATION
        to: CLOSED
        trigger: POST /program-reviews/{id}/advance
        actor: FederalReviewer
        preconditions:
          - "status == UNDER_VERIFICATION (ERR_INVALID_STATE)"
          - "open_action_count == 0 (ERR_UNRESOLVED_ACTIONS)"
        side_effects:
          - "Closing a review makes its finding_codes visible to is_repeat_finding computation of later reviews"

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: POST /corrective-actions/{id}/submit
        actor: CleryCoordinator
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
          - "Parent ProgramReview.status == CORRECTIVE_ACTION (ERR_INVALID_STATE)"
        side_effects:
          - "resolution_summary stored"
      - from: SUBMITTED
        to: VERIFIED
        trigger: POST /corrective-actions/{id}/verify
        actor: FederalReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: ProgramReview.open_action_count decremented"
          - "Cascade link 2 (from open_action_count mutation): when it reaches 0 and review.status == CORRECTIVE_ACTION, review auto-transitions to UNDER_VERIFICATION"
      - from: SUBMITTED
        to: OPEN
        trigger: POST /corrective-actions/{id}/reject
        actor: FederalReviewer
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "rejection_count += 1; verification_note stored; review.open_action_count unchanged net (SUBMITTED->OPEN both count as open)"

  - entity: LogInspectionRequest
    initial_state: PENDING
    terminal_states: [FULFILLED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: POST /log-inspection-requests/{id}/fulfill OR system at creation when the whole requested window falls inside the 60-day immediate-access window
        actor: CleryCoordinator
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "fulfilled_at := now"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: classify-incident-stale-version
    parent_entity: IncidentReport
    write_endpoint: "POST /incident-reports/{id}/classify"
    occ_field: expected_incident_version
    description: |
      Classifying an IncidentReport whose version has advanced since the caller
      last observed it is rejected. This captures the case where another writer
      has just completed a classification (which legitimately supersedes the
      prior offense set under the classification rules) and the current
      caller's view of the incident is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: compile-asr-stale-version
    parent_entity: AnnualSecurityReport
    write_endpoint: "POST /annual-security-reports/{id}/compile"
    occ_field: expected_report_version
    description: |
      Compiling an AnnualSecurityReport whose version has advanced since the
      caller last observed it is rejected. A successful compile supersedes the
      prior statistics snapshot, so a caller holding a stale version must not
      silently overwrite a snapshot it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: offense_hierarchy_resolution
    trigger: "POST /incident-reports/{id}/classify (both UNDER_CLASSIFICATION and UNDER_RECLASSIFICATION paths)"
    algorithm: constraint_propagation
    formula: |
      RANK = { CRIMINAL_HOMICIDE: 10, SEX_OFFENSE: 20, ROBBERY: 30,
               AGGRAVATED_ASSAULT: 40, BURGLARY: 50, MOTOR_VEHICLE_THEFT: 60,
               ARSON: 70, DOMESTIC_VIOLENCE: 80, DATING_VIOLENCE: 81,
               STALKING: 82, HATE_CRIME: 90, LIQUOR_LAW_REFERRAL: 100,
               DRUG_LAW_REFERRAL: 101, WEAPONS_LAW_REFERRAL: 102, NON_CLERY: 999 }
      EXEMPT = { ARSON, DOMESTIC_VIOLENCE, DATING_VIOLENCE, STALKING, HATE_CRIME,
                 LIQUOR_LAW_REFERRAL, DRUG_LAW_REFERRAL, WEAPONS_LAW_REFERRAL }
      For each submitted offense: hierarchy_rank = RANK[offense_type];
        is_exempt_from_hierarchy = offense_type in EXEMPT.
      NON_CLERY offenses: status = EXCLUDED_BY_HIERARCHY always.
      Among the non-exempt, non-NON_CLERY offenses, primary = the one with the
        smallest hierarchy_rank; tie-break: earliest created_at within this
        classify call's submission order (array order), never id.
      Non-exempt non-primary offenses: status = EXCLUDED_BY_HIERARCHY.
      Primary and every exempt offense: status = COUNTED.
    input_set: "The offense_counts array submitted in the classify call; replaces any prior OffenseCount rows of the incident"
    constants:
      TRAINING_PASS_SCORE: 80
    precision: "integers only; no rounding"
    variants: []

  - name: geography_column_mapping
    trigger: "asr_statistics_compilation, per counted offense"
    algorithm: aggregation
    formula: |
      For each COUNTED OffenseCount on an included incident, let c = the
      incident's geography.category:
        ON_CAMPUS            -> increment column ON_CAMPUS only
        ON_CAMPUS_RESIDENTIAL-> increment BOTH ON_CAMPUS and ON_CAMPUS_RESIDENTIAL
        NON_CAMPUS           -> increment NON_CAMPUS only
        PUBLIC_PROPERTY      -> increment PUBLIC_PROPERTY only
      For *_REFERRAL offense types, referred_persons_count of the cell += the
      OffenseCount.referred_persons (persons referred, not incidents).
    input_set: "COUNTED OffenseCount rows of incidents selected by asr_statistics_compilation"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: asr_statistics_compilation
    trigger: "POST /annual-security-reports/{id}/compile"
    algorithm: aggregation
    formula: |
      Evaluation order (pinned, removes the apparent circularity between
      incident inclusion and report state):
        1) Freeze the incident set FIRST: all IncidentReports with
           calendar_year(occurred_at) == report_year whose status is in the
           variant's inclusion set, evaluated at compile time.
        2) Run offense_hierarchy_resolution results (already persisted as
           OffenseCount.status) and keep only COUNTED rows.
        3) Apply geography_column_mapping per counted row.
        4) Emit one StatisticLine per (offense_type, geography_column) cell
           whose count > 0 OR referred_persons_count > 0; zero cells emit no row.
      statistics_version += 1; prior CURRENT rows -> SUPERSEDED;
      statistics_stale := false; compiled_at := now.
    input_set: "FINAL variant: incidents with status == CLASSIFIED only. PROVISIONAL variant: status in {CLASSIFIED, UNDER_RECLASSIFICATION} (pending reclassification counted at last known classification). DRAFT, SUBMITTED, UNDER_CLASSIFICATION, UNFOUNDED, WITHDRAWN always excluded."
    constants: {}
    precision: "integer counts"
    variants:
      - name: PROVISIONAL
        when: "compile called with variant == PROVISIONAL"
        difference: "Includes UNDER_RECLASSIFICATION incidents using their current offense rows; FINAL excludes them"
      - name: FINAL
        when: "compile called with variant == FINAL"
        difference: "Includes only CLASSIFIED incidents; sets final_compile_done = true"

  - name: fire_damage_aggregation
    trigger: "POST /fire-safety-reports/{id}/compile"
    algorithm: aggregation
    formula: |
      FINAL totals (pinned rounding order — round-per-incident-then-sum):
        For each FireIncident with calendar_year(occurred_at) == report_year
        AND status == FINALIZED:
          per_incident = round_half_up(adjudicated_damage_dollars, 0)
          (already persisted as final_damage_dollars)
        total_fires = count of such incidents
        total_injuries = SUM(injuries); total_deaths = SUM(deaths)
        total_damage_dollars = SUM(final_damage_dollars)
      PROVISIONAL total (different algorithm, deliberately divergent):
        provisional_total_damage_dollars = SUM(estimated_damage_dollars) over
        incidents in report_year with status == REPORTED, NOT rounded.
      totals_stale := false after compile.
    input_set: "FINAL totals: status == FINALIZED only (REPORTED and UNDER_ADJUSTMENT excluded). PROVISIONAL: status == REPORTED only."
    constants: {}
    precision: "final per-incident values round_half_up to 0 decimals BEFORE summation; never round the sum"
    variants:
      - name: provisional_estimate
        when: "always computed alongside FINAL totals at compile"
        difference: "Sums unrounded estimated_damage_dollars over REPORTED incidents instead of rounded adjudicated values over FINALIZED ones; same incidents can therefore contribute different totals to the two figures"

  - name: inspection_fulfillment_window
    trigger: "POST /daily-crime-log/inspection-requests and is_overdue evaluation"
    algorithm: threshold
    formula: |
      Matching entries: DailyCrimeLogEntry rows with date portion of
      date_occurred in [from_date, to_date] inclusive.
      Authoritative variant CALENDAR_DATE:
        threshold_date = request_date - 60 calendar days (request_date = date
        portion of requested_at);
        all entries qualify for immediate access iff min(entry date) >= threshold_date;
        if so: status = FULFILLED at creation, fulfilled_at = requested_at,
          due_at = requested_at;
        else: status = PENDING, due_at = requested_at advanced by 2 business
          days (skip Saturday/Sunday; time-of-day preserved).
      Provisional variant ELAPSED_HOURS (informational only):
        age_hours = (requested_at - entry.date_occurred) in hours;
        within window iff age_hours <= 1440 (60*24, inclusive);
        provisional_due_at = requested_at when ALL entries within, else
        requested_at + 2 business days.
      is_overdue = (status == PENDING) && (now > due_at).
    input_set: "Log entries whose date_occurred date falls in [from_date, to_date]; empty match set => immediate fulfillment"
    constants:
      INSPECTION_IMMEDIATE_WINDOW_DAYS: 60
      INSPECTION_FULFILL_BUSINESS_DAYS: 2
    precision: "dates compared at day granularity for authoritative variant; hours for provisional"
    variants:
      - name: CALENDAR_DATE
        when: "authoritative for status, due_at, and is_overdue"
        difference: "An entry dated exactly request_date - 60 qualifies for immediate access regardless of time-of-day"
      - name: ELAPSED_HOURS
        when: "provisional_due_at display only"
        difference: "Same entry at 60 days plus a few hours of elapsed time fails the <= 1440h test and yields a 2-business-day provisional due date"

  - name: log_entry_timeliness
    trigger: "DailyCrimeLogEntry creation (at incident submit) and every disposition PATCH"
    algorithm: chronological
    formula: |
      business_days_between(t0, t1): count of dates strictly after date(t0)
      up to and including date(t1) that are Monday-Friday.
      entry_overdue (set at creation):
        business_days_between(incident.reported_at, entry.created_at) > 2
      disposition_update_overdue (set at each PATCH):
        business_days_between(decision instant, last_disposition_change_at) > 2,
        where decision instant = the logical clock value at the moment the
        triggering decision occurred (for the unfound cascade: the unfound
        transition time; for manual PATCH: the PATCH time itself, so manual
        updates are never self-overdue).
    input_set: "Single entry per evaluation"
    constants:
      LOG_UPDATE_BUSINESS_DAYS: 2
    precision: "day granularity, weekend-skipping"
    variants: []

  - name: timely_warning_deadline
    trigger: "SafetyAlert decide and disseminate transitions"
    algorithm: threshold
    formula: |
      decision_deadline_at = incident.reported_at + 48h
      decision_overdue = decided_at > decision_deadline_at   # strictly greater; exactly +48h is on time
      dissemination_deadline_at = authorized_at + 24h
      dissemination_overdue = disseminated_at > dissemination_deadline_at
    input_set: "Single alert"
    constants:
      WARNING_DECISION_HOURS: 48
      DISSEMINATION_HOURS: 24
    precision: "second granularity"
    variants: []

  - name: csa_certification_window
    trigger: "POST /campus-security-authorities/{id}/training-records; LAPSED evaluation on read/clock advance"
    algorithm: threshold
    formula: |
      passed = score >= 80   # inclusive boundary
      training_year = calendar year of completed_at
      valid_from = completed_at
      valid_to = (training_year + 1)-09-30T23:59:59Z
      Half-open validity window: [valid_from, valid_to).
      Overlap rule: a new passing record is rejected with
      ERR_TRAINING_WINDOW_OVERLAP iff any existing record for the same CSA has
      valid_from < new.valid_to AND new.valid_from < existing.valid_to.
      Adjacency permitted: new.valid_from == existing.valid_to does NOT overlap.
      CSA LAPSED when now > certification_expires_at and status == ACTIVE.
    input_set: "All CSATrainingRecords of the CSA"
    constants:
      TRAINING_PASS_SCORE: 80
    precision: "second granularity"
    variants: []

  - name: program_review_penalty_score
    trigger: "CorrectiveAction create/verify/reject; ProgramReview advance to UNDER_VERIFICATION"
    algorithm: weighted_scoring
    formula: |
      BASE = { LOW: 10, MEDIUM: 25, HIGH: 50 }
      is_repeat_finding = exists a CorrectiveAction with equal finding_code on
        any ProgramReview with status == CLOSED
      weight = BASE[severity] * (2 if is_repeat_finding else 1)
      penalty_score = SUM(weight) over all CorrectiveActions of the review
      escalated = penalty_score >= 100   # inclusive threshold
    input_set: "All CorrectiveActions of the review regardless of action status; repeat detection scans CLOSED reviews only"
    constants:
      ESCALATION_SCORE_THRESHOLD: 100
    precision: "integer"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed for the endpoint; entity-backed ownership: CSA may only forward/list-own referral reports (X-User-ID == csa_id)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Request body contains all required fields with well-formed types", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path-template ids resolve left-to-right (incident, alert, report, review, action, entry, CSA, geography)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Body foreign keys resolve: geography_id, referral_id", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "POST/PATCH endpoints with body FKs" }
  - { priority: 6, category: state, check: "Target entity in a from-state of the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Incident transitions attempted from UNFOUNDED or WITHDRAWN", error_id: ERR_INCIDENT_TERMINAL, http_status: 409, applies_to: "incident action endpoints" }
  - { priority: 6, category: state, check: "SafetyAlert creation requires the parent IncidentReport status in {SUBMITTED, UNDER_CLASSIFICATION, CLASSIFIED, UNDER_RECLASSIFICATION} (DRAFT, UNFOUNDED, WITHDRAWN rejected)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /incident-reports/{id}/safety-alerts" }
  - { priority: 6, category: state, check: "Anonymous access to a DailyCrimeLogEntry with is_public == false", error_id: ERR_ENTRY_NOT_PUBLIC, http_status: 403, applies_to: "GET /daily-crime-log, GET /daily-crime-log/{id}" }
  - { priority: 6, category: state, check: "OCC: expected_incident_version / expected_report_version equals current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /incident-reports/{id}/classify, POST /annual-security-reports/{id}/compile" }
  - { priority: 7, category: business_safety, check: "unfound requires non-empty justification", error_id: ERR_UNFOUNDED_JUSTIFICATION_REQUIRED, http_status: 422, applies_to: "POST /incident-reports/{id}/unfound" }
  - { priority: 7, category: business_safety, check: "Referral creation requires caller CSA status == ACTIVE", error_id: ERR_CSA_NOT_CERTIFIED, http_status: 422, applies_to: "POST /csa-referral-reports" }
  - { priority: 7, category: business_safety, check: "classify requires non-empty offense_counts and at least one offense that is not NON_CLERY", error_id: ERR_CLASSIFICATION_INCOMPLETE, http_status: 422, applies_to: "POST /incident-reports/{id}/classify" }
  - { priority: 7, category: business_safety, check: "begin-reclassification blocked when the ASR covering year(occurred_at) is PUBLISHED or REPUBLISHED", error_id: ERR_REPORT_LOCKED, http_status: 409, applies_to: "POST /incident-reports/{id}/begin-reclassification" }
  - { priority: 8, category: business_temporal, check: "SafetyAlert reopen within REOPEN_WINDOW_HOURS (72h) of closed_at", error_id: ERR_ALERT_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /safety-alerts/{id}/reopen" }
  - { priority: 9, category: business_constraint, check: "report_year unique for AnnualSecurityReport and FireSafetyReport respectively", error_id: ERR_DUPLICATE_REPORT_YEAR, http_status: 409, applies_to: "POST /annual-security-reports, POST /fire-safety-reports" }
  - { priority: 9, category: business_constraint, check: "ProgramReview [scope_year_start, scope_year_end] closed interval must not overlap any review with status != CLOSED (shared boundary year counts as overlap)", error_id: ERR_REVIEW_SCOPE_OVERLAP, http_status: 409, applies_to: "POST /program-reviews" }
  - { priority: 9, category: business_constraint, check: "CSATrainingRecord half-open validity windows of one CSA must not overlap (adjacency permitted)", error_id: ERR_TRAINING_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /campus-security-authorities/{id}/training-records" }
  - { priority: 9, category: business_constraint, check: "At most one SafetyAlert per incident in a non-CLOSED status", error_id: ERR_DUPLICATE_ACTIVE_ALERT, http_status: 409, applies_to: "POST /incident-reports/{id}/safety-alerts" }
  - { priority: 9, category: business_constraint, check: "submit-review requires final_compile_done", error_id: ERR_FINAL_COMPILE_REQUIRED, http_status: 422, applies_to: "POST /annual-security-reports/{id}/submit-review" }
  - { priority: 9, category: business_constraint, check: "republish requires compiled_at > amendment_started_at", error_id: ERR_RECOMPILE_REQUIRED, http_status: 422, applies_to: "POST /annual-security-reports/{id}/republish" }
  - { priority: 9, category: business_constraint, check: "ProgramReview advance gates: actions exist for FINDINGS_ISSUED->CORRECTIVE_ACTION; open_action_count == 0 for CORRECTIVE_ACTION->UNDER_VERIFICATION and UNDER_VERIFICATION->CLOSED", error_id: ERR_UNRESOLVED_ACTIONS, http_status: 422, applies_to: "POST /program-reviews/{id}/advance" }
  - { priority: 10, category: business_referential, check: "geography status must be ACTIVE at incident create / classify / referral create / fire-incident create", error_id: ERR_GEOGRAPHY_RETIRED, http_status: 422, applies_to: "POST /incident-reports, POST /incident-reports/{id}/classify, POST /csa-referral-reports, POST /fire-incidents" }
  - { priority: 10, category: business_referential, check: "Retiring a geography referenced by any non-terminal IncidentReport or FireIncident is blocked", error_id: ERR_GEOGRAPHY_IN_USE, http_status: 409, applies_to: "PATCH /clery-geographies/{id}" }
  - { priority: 10, category: business_referential, check: "FireIncident geography must have is_residential_facility == true", error_id: ERR_RESIDENTIAL_FACILITY_REQUIRED, http_status: 422, applies_to: "POST /fire-incidents" }
  - { priority: 10, category: business_referential, check: "referral_id required iff source == CSA_REFERRAL, and the referral must be in FORWARDED status", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "POST /incident-reports" }
  - { priority: 11, category: business_temporal, check: "occurred_end_at >= occurred_at; to_date >= from_date; scope_year_end >= scope_year_start; due_date >= date(opened_at)", error_id: ERR_VALIDATION_FAILED, http_status: 422, applies_to: "endpoints with date/range inputs" }
  - { priority: 11, category: business_temporal, check: "Enum fields take declared members only; score in 0..100; distribution_channels non-empty subset of declared members; victim_count >= 1; money >= 0", error_id: ERR_VALIDATION_FAILED, http_status: 422, applies_to: "all" }
  - { priority: 11, category: business_constraint, check: "disseminate requires non-empty distribution_channels", error_id: ERR_NO_DISTRIBUTION_CHANNELS, http_status: 422, applies_to: "POST /safety-alerts/{id}/disseminate" }

