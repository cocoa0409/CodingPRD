# =============================================================================
# §1.9 Scaffold Corner Design — Restaurant GPO & Rebate Administration
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; nothing invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no test_recipe.
#
# Shared fixture vocabulary (identical to §1.8 so the two files compose):
#   Logical clock            : 2026-08-01T00:00:00Z unless a recipe moves it
#   ProgramTier ELITE        : member_share 7500 / retention 2500 / admin_low 300 /
#                              admin_high 150 / compliance_min 8000 / markup_cap 700 /
#                              dispute_window 45 / reversal_posture_limit 2 here
#                              (§1.8 pins 1 where the posture flip is the subject)
#   Distributor METRO-01     : contracted_markup_bps 900  -> min(900, 700) = 700
#   Member Harbor Grill      : committed_annual_spend_cents 20000000
#   Deal PBC-2026            : 2026-01-01..2026-12-31, required_purchase_window_days 60
#   Item BEEF-PATTY-4OZ-CS40 : pack 40, baseline 9800, contract 8900
#   FLAT card                : PER_CASE 150 cents, 2026-01-01..2028-12-31
#   Lines                    : 30 and 40 cases @ invoice 9140, base 8533 / 8540
#   Accrual literals         : gross 4500 / 6000, fee 135 / 180, share 3274 / 4365,
#                              retention 1091 / 1455 (verified round_half_up)
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: program_tier_create_echoes_every_configured_field
        claim_type: creation
        grounds:
          - endpoints["POST /program-tiers"]
          - entities.ProgramTier
        distinguishing_aspect: |
          A create returns 201 with every input field stored verbatim plus the
          common fields, and the eight required knobs are all readable back —
          no silent coercion of basis points and no default overwriting an
          explicitly supplied reversal_posture_limit.
        test_recipe:
          setup:
            - "Empty database; no ProgramTier row exists yet."
          setup_api_calls: []
          trigger:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45, reversal_posture_limit: 1 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
          assert:
            - "201 with response_type == object"
            - "ProgramTier.${tier_id}: tier_code == ELITE, member_share_bps == 7500, gpo_retention_bps == 2500, admin_fee_bps_low == 300, admin_fee_bps_high == 150, compliance_min_ratio_bps == 8000, markup_cap_bps == 700, dispute_window_days == 45"
            - "reversal_posture_limit == 1 — the explicit value survives, it is not replaced by the default 2"
            - "version == 1 and created_at / updated_at are present and equal on a fresh row"
            - "GET /program-tiers returns exactly 1 row"

      - name: member_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /members/{member_id}"]
          - entities.Member
        distinguishing_aspect: |
          Retrieval returns the persisted row, including the twelve computed
          counters at their creation defaults — a create response is not the
          only place those defaults appear.
        test_recipe:
          setup:
            - "ProgramTier ELITE exists; Member Harbor Grill has just been created and is still PENDING."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /members/${m1_id}"
              as: RebateAnalyst
          assert:
            - "200 with data.id == ${m1_id}, legal_name == Harbor Grill LLC, tier_id == ${tier_id}, committed_annual_spend_cents == 20000000"
            - "enrollment_status == PENDING, reconciliation_posture == CLEAR, payout_hold == false"
            - "active_letter_count == 0, accrued_member_share_cents == 0, attributed_gpo_retention_cents == 0, attributed_admin_fee_cents == 0, ytd_net_snapshot_cents == 0, dispute_reversal_count == 0, recovery_credit_cents == 0"
            - "version == 1"

      - name: purchase_lines_list_paginates_and_filters_together
        claim_type: listing
        grounds:
          - endpoints["GET /purchase-lines"]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list endpoint applies the match_status filter BEFORE paginating,
          so total_count reports the filtered population (2), not the batch's
          three lines, and has_more is driven by that same filtered count.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill ACTIVE with a countersigned letter."
            - "Deal PBC-2026 ACTIVE with item BEEF-PATTY-4OZ-CS40 and an APPROVED PER_CASE 150 card."
            - "June batch carries three lines: 30 and 40 beef cases (MATCHED after normalize) and 20 fries cases reporting a key no ContractedItem owns (stays UNMATCHED)."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2028-12-31" }
              as: GpoAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 40, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8540, invoice_date: "2026-06-18" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-71004", vendor_item_description: "Shoestring fries 30lb", normalized_item_key_reported: "FRIES-UNKNOWN-CS30", cases_shipped: 20, invoice_unit_cost_cents: 8300, distributor_base_cost_cents: 7500, invoice_date: "2026-06-20" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l3_id: $.data.id }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
          trigger:
            - call: "GET /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", match_status: "MATCHED", limit: 1, offset: 0 }
              as: RebateAnalyst
              captures: { first_line_id: "$.data[0].id" }
            - call: "GET /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", match_status: "MATCHED", limit: 1, offset: 1 }
              as: RebateAnalyst
          assert:
            - "both responses are 200 with response_type == array and exactly 1 element each"
            - "the pagination fields report limit == 1, offset == 0, total_count == 2, has_more == true on the first page"
            - "second page: limit == 1, offset == 1, total_count == 2, has_more == false"
            - "the two pages return different line ids and together cover exactly {${l1_id}, ${l2_id}} — ${l3_id} is filtered out by match_status == MATCHED"
            - "GET /purchase-lines with purchase_batch_id only returns total_count == 3"
            - "GET /purchase-lines with match_status == UNMATCHED returns total_count == 1 and data[0].id == ${l3_id}"

      - name: unknown_path_ids_return_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=4].ERR_MEMBER_NOT_FOUND
          - errors[ERR_DISTRIBUTOR_NOT_FOUND]
          - errors[ERR_PROGRAM_TIER_NOT_FOUND]
          - errors[ERR_LETTER_NOT_FOUND]
          - errors[ERR_DEAL_NOT_FOUND]
          - errors[ERR_CONTRACTED_ITEM_NOT_FOUND]
          - errors[ERR_RATE_CARD_NOT_FOUND]
          - errors[ERR_BATCH_NOT_FOUND]
          - errors[ERR_PURCHASE_LINE_NOT_FOUND]
          - errors[ERR_ACCRUAL_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_COMPLIANCE_REVIEW_NOT_FOUND]
        distinguishing_aspect: |
          Every one of the thirteen 404 ids is reachable, and each names its own
          entity rather than a single generic NOT_FOUND — the path-id existence
          check at priority 4 runs before any body validation, so an unknown id
          plus a malformed body still yields the 404.
        test_recipe:
          setup:
            - "Empty database. The UUID 00000000-0000-0000-0000-0000000000ff belongs to no row of any entity."
          setup_api_calls: []
          trigger:
            - call: "GET /program-tiers/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /distributors/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /members/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /authorization-letters/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /manufacturer-deals/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /contracted-items/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /rate-cards/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /purchase-batches/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /purchase-lines/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /accruals/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /manufacturer-claims/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e11: $.data.error_id }
            - call: "GET /disputes/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e12: $.data.error_id }
            - call: "GET /compliance-reviews/00000000-0000-0000-0000-0000000000ff"
              as: GpoAdmin
              captures: { e13: $.data.error_id }
            - call: "POST /authorization-letters/00000000-0000-0000-0000-0000000000ff/countersign"
              payload: { decision: "NOT_AN_ENUM_VALUE" }
              as: DistributorFeed
              as_user_id: "00000000-0000-0000-0000-0000000000aa"
              captures: { e14: $.data.error_id }
          assert:
            - "all fourteen calls return 404 with response_type == error"
            - "${e1} == ERR_PROGRAM_TIER_NOT_FOUND, ${e2} == ERR_DISTRIBUTOR_NOT_FOUND, ${e3} == ERR_MEMBER_NOT_FOUND, ${e4} == ERR_LETTER_NOT_FOUND, ${e5} == ERR_DEAL_NOT_FOUND, ${e6} == ERR_CONTRACTED_ITEM_NOT_FOUND, ${e7} == ERR_RATE_CARD_NOT_FOUND"
            - "${e8} == ERR_BATCH_NOT_FOUND, ${e9} == ERR_PURCHASE_LINE_NOT_FOUND, ${e10} == ERR_ACCRUAL_NOT_FOUND, ${e11} == ERR_CLAIM_NOT_FOUND, ${e12} == ERR_DISPUTE_NOT_FOUND, ${e13} == ERR_COMPLIANCE_REVIEW_NOT_FOUND"
            - "${e14} == ERR_LETTER_NOT_FOUND — priority 4 beats the priority-7 enum failure and the priority-6 distributor scope check on the same request"
            - "every error body carries exactly error_id and message under data"

      - name: member_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints["POST /members"]
          - validations[priority=7].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          All three of POST /members' inputs are required with no default, so
          omitting committed_annual_spend_cents is a 400 rather than a row with
          a zero commitment — which would silently make every later compliance
          ratio divide by zero.
        test_recipe:
          setup:
            - "ProgramTier ELITE exists."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}" }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: "20000000" }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 0 }
              as: GpoAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with 400 — committed_annual_spend_cents omitted"
            - "${e2} == ERR_INVALID_REQUEST with 400 — a JSON string where the schema declares integer is not coerced"
            - "${e3} == ERR_INVALID_REQUEST with 400 — the declared constraint is >= 1, so 0 fails the same rule"
            - "GET /members returns total_count == 0: none of the three attempts persisted anything"

      - name: program_tier_reversal_posture_limit_defaults_to_two
        claim_type: defaults
        grounds:
          - entities.ProgramTier.fields.reversal_posture_limit
          - endpoints["POST /program-tiers"]
        distinguishing_aspect: |
          reversal_posture_limit is the only optional input in the whole write
          surface; omitting it must yield 2, and that stored 2 must be what the
          posture threshold later reads — a member reaches RESTRICTED on the
          second upheld dispute, not the first.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /program-tiers"
              payload: { tier_code: "CORE", member_share_bps: 6000, gpo_retention_bps: 4000, admin_fee_bps_low: 400, admin_fee_bps_high: 200, compliance_min_ratio_bps: 6000, markup_cap_bps: 900, dispute_window_days: 30 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
          assert:
            - "201 and ProgramTier.${tier_id}.reversal_posture_limit == 2"
            - "GET /program-tiers/${tier_id} also reports reversal_posture_limit == 2 — the default is persisted, not applied per-read"
            - "no other field was defaulted: dispute_window_days == 30 and markup_cap_bps == 900 as supplied"

      - name: purchase_line_extended_cost_is_computed_and_client_value_rejected
        claim_type: computed_fields
        grounds:
          - entities.PurchaseLine.fields.invoice_extended_cents
          - calculations.line_extended_cost
          - validations[priority=7].ERR_INVALID_REQUEST
        distinguishing_aspect: |
          invoice_extended_cents is source: computed, and POST /purchase-lines
          does not declare it as an input — so a client that tries to supply it
          (even with the arithmetically correct value) gets ERR_INVALID_REQUEST
          for an unknown field rather than having its value trusted.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributor METRO-01, Member Harbor Grill ACTIVE with a countersigned PURCHASE_DATA_AND_PRICING letter for that distributor."
            - "A RECEIVED June batch exists for the distributor."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05", invoice_extended_cents: 274200 }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_id: $.data.id }
          assert:
            - "${e1} == ERR_INVALID_REQUEST with 400 even though 30 * 9140 == 274200 is the value the server would itself compute"
            - "the rejected attempt left PurchaseBatch.${b1_id}.line_count == 0 and total_cases_ingested == 0"
            - "the clean attempt returns 201 with PurchaseLine.${l1_id}.invoice_extended_cents == 274200"
            - "the same line also shows the other computed defaults: match_status == UNMATCHED, contracted_item_id == null, accrual_block_reason == NONE, overbilled_cents == 0"
            - "PurchaseBatch.${b1_id}.line_count == 1, total_cases_ingested == 30, unmatched_cases == 30, matched_cases == 0"

      - name: system_fields_are_server_generated_and_client_supplied_id_rejected
        claim_type: system_fields
        grounds:
          - entities.Distributor
          - endpoints["POST /distributors"]
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-owned on every
          common_fields: true entity. A client id is an unknown field (400), and
          version is monotonic per row: the create leaves it at 1 and only a
          declared side effect moves it.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900, id: "00000000-0000-0000-0000-0000000000aa" }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900, version: 7 }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id, dist_v: $.data.version }
          assert:
            - "${e1} == ERR_INVALID_REQUEST (400) — id is not an accepted input"
            - "${e2} == ERR_INVALID_REQUEST (400) — version is not an accepted input either"
            - "the third call returns 201; ${dist_id} is a server-generated UUID that differs from 00000000-0000-0000-0000-0000000000aa"
            - "${dist_v} == 1, created_at and updated_at are set, and GET /distributors returns total_count == 1 (the two rejects persisted nothing)"

      - name: rate_card_shape_and_enum_constraints_are_rejected
