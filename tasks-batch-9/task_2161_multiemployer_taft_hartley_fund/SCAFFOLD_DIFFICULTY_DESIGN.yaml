      - name: withdrawal_demand_blocked_by_frozen_fund_posture
        grounds:
          - state_machines.WithdrawalAssessment.CERTIFIED_to_DEMANDED
          - calculations.governance_posture
          - errors[ERR_FUND_GOVERNANCE_FROZEN]
          - entities.Fund.fields.governance_posture
          - entities.Fund.fields.active_employer_trustees
        distinguishing_aspect: |
          A second, different entity pair: WithdrawalAssessment -> Fund. A CERTIFIED assessment
          cannot be demanded while the fund's governance_posture is FROZEN because no employer
          trustees are seated, and the identical demand succeeds unchanged once two UNION and
          two EMPLOYER trustees bring the posture to OPEN.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "A fund with zero trustees, so active_union_trustees and active_employer_trustees are both 0 and governance_posture is FROZEN."
            - "One employer whose PRESUMPTIVE assessment has been certified by the actuary, moving it to CERTIFIED with net_liability_cents 25000000."
          setup_api_calls:
