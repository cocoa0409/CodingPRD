  - rule_id: resource_temporal_overlap
    instances:
      - name: session_exclusive_occupancy_with_sixty_minute_cooldown
        grounds:
          - validations[priority=17]
          - global_constants.SESSION_COOLDOWN_MINUTES
          - entities.AuctionSession.fields.opens_at
          - entities.AuctionSession.fields.closes_at
          - state_machines.AuctionSession.LIVE_to_CANCELLED
          - errors.ERR_SESSION_WINDOW_CONFLICT
        distinguishing_aspect: |
          Resource entity: BuyerProgram, occupied exclusively by AuctionSession windows. Interval
          semantics: half-open [opens_at, closes_at) inflated by a 60-minute cooldown on BOTH sides,
          so an abutting window (new.opens_at == existing.closes_at) conflicts, a 30-minute gap
          conflicts, and a gap of exactly 60 minutes does not. The occupancy filter is also
          status-scoped: only SCHEDULED and LIVE sessions occupy the programme, so a CANCELLED
          window frees its slot for a fully overlapping replacement.
