scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: core_credit_provisional_vs_final
        grounds:
          - calculations.core_credit_calculation
          - entities.CoreReturn.fields.provisional_credit_cents
          - entities.CoreReturn.fields.final_credit_cents
        distinguishing_aspect: |
          Core-accounting domain (CoreReturn): the provisional variant evaluated at
          receipt (GRADE_A assumption, zero deductions) and the final variant
          evaluated at grading (actual multiplier + per-line deductions) produce
          different credits for the same core: 100000 vs 39999 here.
        test_recipe:
          setup:
            - "Distributor D-100 (FEDERAL, credit_limit 1000000, discount 0.15) exists"
            - "BuildSpec SBC-350/C1500-1996/FEDERAL is ACTIVE with core_base_credit_cents=100000"
            - "Logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-100", name: "Midwest Parts", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.15 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "C1500-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK", "REWORK"], allowed_interchange_groups: ["CRANK-SBC-3.48", "HEAD-SBC-VORTEC"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id, r1_prov: $.data.provisional_credit_cents }
          trigger:
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_B", missing_components: ["CAMSHAFT"] }
              as: CoreInspector
              captures: { r1_final: $.data.final_credit_cents }
            - call: "GET /distributors/${d1}"
              as: PlantAdmin
              captures: { d1_credit: $.data.credit_balance_cents }
          assert:
            - "captured r1_prov == 100000 (provisional variant: base x 1.00, no deductions)"
            - "captured r1_final == 39999 (final variant: round_half_up(100000 x 0.60) - round_half_up(33335 x 0.60) = 60000 - 20001)"
            - "captured r1_final != captured r1_prov"
            - "captured d1_credit == 39999"
            - "CoreReturn.${r1}.status == GRADED"

      - name: warranty_credit_vs_replacement_settlement
        grounds:
          - calculations.warranty_settlement_calculation
          - state_machines.WarrantyClaim.TEARDOWN_COMPLETE_to_APPROVED_CREDIT
          - state_machines.WarrantyClaim.TEARDOWN_COMPLETE_to_APPROVED_REPLACEMENT
        distinguishing_aspect: |
          Warranty domain (WarrantyClaim), distinct from the core-accounting domain
          of the sibling instance: two identical claims (same sale price 212500,
          same 3 months in service) settle differently — APPROVED_CREDIT pays
          151875 cash credit while APPROVED_REPLACEMENT pays 0 and consumes a
          sealed replacement unit instead.
        test_recipe:
          setup:
            - "Distributor D-CORE supplies cores; distributor D-BUY (discount 0.15) buys engines"
            - "BuildSpec (1-op route [CRANK_GRIND], list 250000, deposit 200000) ACTIVE"
            - "Engines E1 and E2 SOLD to D-BUY at 2026-08-01 (sale_price 212500 each); engine E3 SEALED and unsold"
            - "Claims C1 (on E1) and C2 (on E2) filed at 2026-11-04 (95 days -> months_in_service == 3), both torn down"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-CORE", name: "Core Supply Co", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcore: $.data.id }
            - call: "POST /distributors"
              payload: { distributor_code: "D-BUY", name: "Buyer Bros", emissions_requirement: "FEDERAL", credit_limit_cents: 2000000, volume_discount_pct: 0.15 }
              as: PlantAdmin
              captures: { dbuy: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "C1500-1996", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK", "REWORK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            # --- production chain for E1 ---
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { w1o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${w1o1}/perform"
              payload: { station_code: "STN-CRANK-1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-1", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            # --- production chain for E2 (identical) ---
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r2: $.data.id }
            - call: "POST /core-returns/${r2}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r2}" }
              as: PlantAdmin
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w2v: $.data.version }
            - call: "POST /work-orders/${w2}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w2v}" }
              as: ShopTechnician
              captures: { w2o1: $.data.id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${w2o1}/perform"
              payload: { station_code: "STN-CRANK-1", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w2}"
              as: PlantAdmin
              captures: { e2: $.data.reman_engine_id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e2}/dyno-tests"
              payload: { dyno_cell_code: "CELL-1", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T11:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e2}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            # --- production chain for E3 (sealed, stays unsold as replacement pool) ---
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r3: $.data.id }
            - call: "POST /core-returns/${r3}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r3}" }
              as: PlantAdmin
              captures: { w3: $.data.id }
            - call: "POST /work-orders/${w3}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w3v: $.data.version }
            - call: "POST /work-orders/${w3}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w3v}" }
              as: ShopTechnician
              captures: { w3o1: $.data.id }
            - call: "POST /work-orders/${w3}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${w3o1}/perform"
              payload: { station_code: "STN-CRANK-1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w3}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w3}"
              as: PlantAdmin
              captures: { e3: $.data.reman_engine_id }
            - call: "POST /work-orders/${w3}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e3}/dyno-tests"
              payload: { dyno_cell_code: "CELL-1", started_at: "2026-08-03T12:00:00Z", ended_at: "2026-08-03T13:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e3}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            # --- sell E1 and E2 to D-BUY ---
            - call: "GET /distributors/${dbuy}"
              as: PlantAdmin
              captures: { dbv1: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dbv1}" }
              as: Distributor
              as_user_id: "${dbuy}"
              captures: { e1_sold: $.data.id, e1_price: $.data.sale_price_cents }
            - call: "GET /distributors/${dbuy}"
              as: PlantAdmin
              captures: { dbv2: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dbv2}" }
              as: Distributor
              as_user_id: "${dbuy}"
              captures: { e2_sold: $.data.id }
            # --- file + teardown both claims at day 95 ---
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-04T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /warranty-claims"
              payload: { reman_engine_id: "${e1_sold}", distributor_id: "${dbuy}", failure_description: "rod knock under load" }
              as: Distributor
              as_user_id: "${dbuy}"
              captures: { c1: $.data.id, c1_months: $.data.months_in_service }
            - call: "POST /warranty-claims"
              payload: { reman_engine_id: "${e2_sold}", distributor_id: "${dbuy}", failure_description: "rod knock under load" }
              as: Distributor
              as_user_id: "${dbuy}"
              captures: { c2: $.data.id }
            - call: "POST /warranty-claims/${c1}/teardown"
              payload: { teardown_findings: "spun rod bearing, crank scored" }
              as: ShopTechnician
              as_user_id: "tech-9"
            - call: "POST /warranty-claims/${c2}/teardown"
              payload: { teardown_findings: "spun rod bearing, crank scored" }
              as: ShopTechnician
              as_user_id: "tech-9"
          trigger:
            - call: "POST /warranty-claims/${c1}/adjudicate"
              payload: { outcome: "APPROVED_CREDIT", teardown_fee_cents: 7500 }
              as: WarrantyAdjuster
              as_user_id: "adj-1"
              captures: { c1_credit: $.data.settled_credit_cents }
            - call: "POST /warranty-claims/${c2}/adjudicate"
              payload: { outcome: "APPROVED_REPLACEMENT", teardown_fee_cents: 7500 }
              as: WarrantyAdjuster
              as_user_id: "adj-1"
              captures: { c2_credit: $.data.settled_credit_cents }
            - call: "GET /reman-engines/${e3}"
              as: PlantAdmin
              captures: { e3_status: $.data.status, e3_price: $.data.sale_price_cents, e3_dist: $.data.distributor_id }
            - call: "GET /distributors/${dbuy}"
              as: PlantAdmin
              captures: { dbuy_credit: $.data.credit_balance_cents, dbuy_held: $.data.deposits_held_cents }
          assert:
            - "captured e1_price == 212500 (round_half_up(250000 x 0.85))"
            - "captured c1_months == 3 (floor(95/30))"
            - "captured c1_credit == 151875 (max(0, round_half_up(212500 x 9/12) - 7500) = 159375 - 7500)"
            - "captured c2_credit == 0 (replacement variant grants no cash credit)"
            - "captured e3_status == SOLD and captured e3_price == 0 and captured e3_dist == ${dbuy} (replacement unit consumed from sealed pool)"
            - "captured dbuy_credit == 151875"
            - "captured dbuy_held == 600000 (deposits on E1, E2, and replacement E3: 3 x 200000)"
            - "WarrantyClaim.${c1}.status == APPROVED_CREDIT and WarrantyClaim.${c2}.status == APPROVED_REPLACEMENT"

  # =================================================================
  # Rule 2 — combinatorial_formula
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: core_credit_per_line_deduction_rounding
        grounds:
          - calculations.core_credit_calculation
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-deduction-line then
          sum. GRADE_C (x0.30) with missing [CAMSHAFT, CYLINDER_HEAD] yields
          30000 - (10001 + 7502) = 12497; the forbidden sum-then-round order would
          yield 30000 - 17502 = 12498, one cent more.
        test_recipe:
          setup:
            - "Distributor D-200 exists; BuildSpec with core_base_credit_cents=100000 ACTIVE"
            - "CoreReturn R received from D-200"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-200", name: "Parts House", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "K2500-1997", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_C", missing_components: ["CAMSHAFT", "CYLINDER_HEAD"] }
              as: CoreInspector
              captures: { final: $.data.final_credit_cents }
          assert:
            - "captured final == 12497 (per-line rounding: 30000 - 10001 - 7502)"
            - "captured final != 12498 (the value the forbidden sum-then-round order would produce)"
            - "CoreReturn.${r1}.status == GRADED"

      - name: warranty_proration_multi_input_floor
        grounds:
          - calculations.warranty_settlement_calculation
        distinguishing_aspect: |
          Mode (a) non-linear multi-input formula: settled credit depends on
          sale_price_cents, months_in_service, teardown_fee_cents with a
          conditional branch on outcome and a nested max() floor — at months=3,
          fee=7500 the credit is 151875; at months=11, fee=20000 the floor
          activates and the credit is 0 despite a positive prorated amount 17708.
        test_recipe:
          setup:
            - "Distributor D-W (discount 0.15) bought engines E1 and E2 at 2026-08-01 (sale_price 212500 each)"
            - "Claim C1 on E1 filed at 2026-11-04 (day 95 -> months 3); claim C2 on E2 filed at 2027-07-26 (day 359 -> months 11, still inside the 360-day window); both torn down"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-CW", name: "Core World", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcore: $.data.id }
            - call: "POST /distributors"
              payload: { distributor_code: "D-W", name: "Warranty Buyer", emissions_requirement: "FEDERAL", credit_limit_cents: 2000000, volume_discount_pct: 0.15 }
              as: PlantAdmin
              captures: { dbuy: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "TAHOE-1998", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { w1o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${w1o1}/perform"
              payload: { station_code: "STN-CRANK-2", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-2", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r2: $.data.id }
            - call: "POST /core-returns/${r2}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r2}" }
              as: PlantAdmin
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w2v: $.data.version }
            - call: "POST /work-orders/${w2}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w2v}" }
              as: ShopTechnician
              captures: { w2o1: $.data.id }
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${w2o1}/perform"
              payload: { station_code: "STN-CRANK-2", scheduled_start: "2026-08-02T09:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w2}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w2}"
              as: PlantAdmin
