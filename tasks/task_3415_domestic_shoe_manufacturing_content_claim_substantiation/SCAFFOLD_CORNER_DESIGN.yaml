      - name: provisional_report_per_line_rounding_order
        claim_type: Precision
        grounds:
          - calculations.content_calculation
          - entities.DomesticContentReport.fields.material_cost_cents
        distinguishing_aspect: "Pinned rounding order (mode-b): two BOM lines of 1.5 x 333 each round PER LINE to 500 + 500 = 1000; summing first would give round(999.0) = 999. The provisional report's material_cost_cents must be 1000."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; factory; thread and upper components; model MRND with two BOM lines (1.5 units x 333c planned, both planned-domestic); a PLANNED STOCK run of 1 unit."
          setup_api_calls:
            - *k_clk
            - *k_fac
            - *k_comp_t
            - *k_comp_a
            - &k_model_rnd
              call: "POST /footwear/models"
              payload: { style_code: "MRND", production_policy: "DUAL_SOURCE", base_price_cents: 5000, import_cost_basis_cents: 2000, bom_lines: [ { component_id: "${c_t}", quantity_per_pair: 1.5, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 333, planned_is_domestic: true }, { component_id: "${c_a}", quantity_per_pair: 1.5, sourcing_requirement: "IMPORT_ALLOWED", planned_unit_cost_cents: 333, planned_is_domestic: true } ], standard_stitching_minutes: 0, standard_lasting_minutes: 0, standard_assembly_minutes: 0 }
              as: SourcingManager
              captures: { m_id: $.data.id }
            - *k_alloc
            - &k_run_rnd
              call: "POST /footwear/production-runs"
              payload: { model_id: "${m_id}", factory_id: "${f_id}", run_type: "STOCK", planned_units: 1, line_index: 1, start_day: "2026-09-07", end_day: "2026-09-11", iso_week: "2026-W36" }
              as: ProductionPlanner
              captures: { r_id: $.data.id, run_v0: $.data.version }
          trigger:
            - call: "POST /footwear/production-runs/${r_id}/content-reports"
              payload: { variant: "PROVISIONAL", expected_run_version: "${run_v0}" }
              as: ProductionPlanner
              captures: { rep: $.data.id }
          assert:
            - "DomesticContentReport.${rep}.material_cost_cents == 1000 (round_half_up(1.5*333) = 500 per line, summed AFTER rounding)"
            - "a sum-then-round implementation would report 999 — the 1-cent delta discriminates the pinned order"
            - "domestic_material_cost_cents == 1000 and us_content_pct == 100.00 (total 1600 with 600 overhead, domestic value 1600)"

