            - "fp_v_after == 2 and FloorPlan.${fp_id}.base_msrp_cents == 9000000"
            - "FloorPlan.${fp_id}.max_payload_lbs is still 3000 (gvwr and dry weight untouched)"
            - "UnitOrder.${ord_id}.locked_floor_plan_version == 1, not 2"
            - "UnitOrder.${ord_id}.provisional_invoice_cents == 6620350, computed from the 8000000 msrp"
            - "UnitOrder.${ord_id}.version == 2 — the reprice did not mutate the order row"
            - "UnitOrder.${ord_id}.status == CONFIG_VALIDATED"

