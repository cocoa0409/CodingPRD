            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/properties/${prop_id}/compactor-incidents"
              payload: { incident_type: "JAM", description: "chute jam on floor 2" }
              as: ValetOpsManager
              captures: { inc1_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/compactor-incidents"
              payload: { incident_type: "JAM", description: "ram stalled in the compactor room" }
              as: ValetOpsManager
              captures: { inc2_id: $.data.id }
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T05:00:00Z" }
