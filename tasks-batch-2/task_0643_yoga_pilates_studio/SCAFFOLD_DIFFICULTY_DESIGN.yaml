            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-25T10:00:00Z", end_utc: "2026-02-25T11:00:00Z", published_capacity: 1, waitlist_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
