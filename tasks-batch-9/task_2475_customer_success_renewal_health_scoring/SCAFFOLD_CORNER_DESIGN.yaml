      - name: renewal_forecast_parallel_axes_advance_independently_corner
        claim_type: valid_transition
        grounds:
          - state_machines.RenewalForecast
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / renewal_forecast_cs_and_finance_axes_advance_independently
          rationale: "The parallel-shape claim (cs_state and finance_state advancing on independent axes, including the VARIANCE_FLAGGED revision edge and the LOCKED lockdown) is asserted end-to-end by the named §1.8 instance."

      - name: coverage_assignment_branch_side_effects_corner
        claim_type: side_effect_execution
        grounds:
          - state_machines.CoverageAssignment.QUEUED_to_PREEMPTED
          - entities.CoverageAssignment.fields.superseded_by_assignment_id
        excluded_because:
          difficulty_instance: non_linear_state_machine / coverage_assignment_queued_fork_has_divergent_branch_side_effects
          rationale: "The fork from QUEUED into COMMITTED versus PREEMPTED, including superseded_by_assignment_id and the untouched capacity counters, is asserted by the named §1.8 instance."

      - name: escalation_withdraw_compensates_its_commitments_corner
        claim_type: side_effect_execution
        grounds:
          - state_machines.EscalationCase.COMMITTED_to_WITHDRAWN
          - state_machines.RemediationCommitment.ACCEPTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / remediation_credit_outstanding_returns_to_zero_after_case_withdrawal
          rationale: "The compensation pattern (case WITHDRAWN cascades every commitment to WITHDRAWN and unwinds the account credit ledger to zero) is asserted by the named §1.8 instance."

