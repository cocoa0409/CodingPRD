            - "Second review call: HTTP 200, data.status == \"ACCEPTED\", data.is_current is true."
            - "${err_not_reviewable} == \"ERR_CERT_NOT_REVIEWABLE\" with HTTP 409, not ERR_NO_PUBLISHED_ENTITLEMENT_RULE — priority 8 preempts priority 11."
            - "Case read-back: data.service_status == \"ELIGIBLE\", data.weekly_entitled_minutes == 390, data.entitlement_rule_id == ${rule_home_id} even though that rule is now RETIRED."

