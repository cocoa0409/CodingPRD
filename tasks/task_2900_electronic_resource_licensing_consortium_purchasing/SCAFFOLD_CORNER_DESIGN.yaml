        grounds:
          - validations.priority_9_ERR_MEMBER_OVER_COMMITTED
          - validations.priority_32_ERR_BUDGET_CEILING_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pledge_by_over_committed_member_reports_standing_before_budget_ceiling
          rationale: "Both rules are violated by one pledge and the higher-priority error is asserted there."
      - name: referential_rule_outranks_the_temporal_rule
        claim_type: priority_conflict
        grounds:
          - validations.priority_14_ERR_ARCHIVAL_DEPOSIT_UNVERIFIED
          - validations.priority_18_ERR_NOTICE_DEADLINE_PASSED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cancel_execution_reports_unverified_archive_before_notice_deadline
          rationale: "The cancellation execution violates both rules at once and the priority-14 error is asserted there."
