# SCAFFOLD.yaml — §1.0–§1.7
# Home Battery Storage Installation & Utility Rebate
scenario: |
  2790. Home Battery Storage Installation & Utility Rebate (Tesla Powerwall certified installer):
  load calculation and backup-panel scoping (whole-home vs essential loads), permit, interconnection
  application and utility approval-to-energize sequencing, rebate/incentive stacking with capacity and
  export commitments, installer certification and warranty registration requirements, commissioning
  tests and backup-transition verification, participation in a utility bring-your-own-device event
  program with performance payments, battery firmware/monitoring alerts and warranty claims, system
  expansion and inverter compatibility rules

domain_name: home-battery-storage
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  secondary_state_machine_shapes: [cyclic, branching]
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Every root collection is flat (no nested ownership URLs); children reference parents by FK and are
    discovered through filtered-list GETs. BatterySystem carries two independent state dimensions
    (build_status × grid_status) that must be advanced by different actors in a pinned interleaving;
    Permit and InterconnectionApplication both cycle (corrections / supplemental review). Money moves
    through a three-way IncentiveProgram ledger and BYOD capacity moves through a DispatchEvent
    capacity ledger; both must survive compensating actions with zero drift.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: InstallerAccount
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: company_name
        type: string
        source: input
        description: Legal name of the certified installation company.
        constraints: non-empty, max 120 chars
      - name: certification_level
        type: enum
        source: input
        description: Manufacturer certification tier held by the installer.
        default: CERTIFIED
        constraints: "one of {NONE, CERTIFIED, ADVANCED}"
      - name: certified_model_codes
        type: array
        source: input
        description: Battery model codes this installer is certified to install.
        constraints: "array of {PWX_A, PWX_B, PWX_C}; may be empty when certification_level == NONE"
      - name: certification_expires_on
        type: datetime
        source: input
        description: Instant at which the manufacturer certification lapses (exclusive upper bound).
        constraints: ISO 8601 UTC, three fractional digits
      - name: certification_status
        type: enum
        source: system
        description: Administrative standing of the certification, independent of expiry.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED written only by the clawback cascade"
      - name: clawback_count
        type: integer
        source: computed
        description: Number of RebateClaim rows for this installer's systems that reached CLAWED_BACK.
        default: 0
      - name: late_warranty_registration_count
        type: integer
        source: computed
        description: Number of BatterySystem rows whose warranty registration landed after the 30-day deadline.
        default: 0
      - name: commissioned_system_count
        type: integer
        source: computed
        description: Number of BatterySystem rows this installer drove to build_status COMMISSIONED.
        default: 0

  - name: Site
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: homeowner_name
        type: string
        source: input
        description: Name of the homeowner of record for this premise.
        constraints: non-empty
      - name: utility_territory_code
        type: enum
        source: input
        description: Utility territory the premise belongs to; scopes dispatch-event capacity.
        constraints: "one of {TER_WEST, TER_EAST, TER_NORTH}"
      - name: service_panel_amps
        type: integer
        source: input
        description: Main service panel rating in amps.
        constraints: "one of {100, 125, 200, 400}"
      - name: floor_area_sqft
        type: integer
        source: input
        description: Conditioned floor area used for the general lighting load.
        constraints: "> 0"
      - name: postal_code
        type: string
        source: input
        description: Postal code of the premise.
        constraints: 5 digits
      - name: existing_pv_kw_dc
        type: number
        source: input
        description: Nameplate DC rating of PV already on site; 0 when none.
        default: 0
        constraints: ">= 0"

  - name: LoadCalculation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; the premise this calculation sizes backup for.
      - name: method
        type: enum
        source: input
        description: Calculation method; selects the dual-variant branch of load_sizing.
        constraints: "one of {NEC_220_82_STANDARD, NEC_220_87_MEASURED}"
      - name: backup_scope
        type: enum
        source: input
        description: Backup-panel scoping decision that selects the sizing branch.
        constraints: "one of {WHOLE_HOME, ESSENTIAL_LOADS}"
      - name: lighting_area_sqft
        type: integer
        source: input
        description: Area used for the 3 VA/sqft general lighting term.
        constraints: ">= 0"
      - name: appliance_load_va
        type: number
        source: input
        description: Sum of nameplate VA for fastened-in-place appliances.
        constraints: ">= 0"
      - name: heating_va
        type: number
        source: input
        description: Nameplate VA of the heating equipment.
        constraints: ">= 0"
      - name: cooling_va
        type: number
        source: input
        description: Nameplate VA of the cooling equipment.
        constraints: ">= 0"
      - name: measured_peak_kw
        type: number
        source: input
        description: 15-minute measured peak demand; required when method == NEC_220_87_MEASURED, must be omitted otherwise.
        default: null
        constraints: "> 0 when present"
      - name: essential_circuits
        type: array
        source: input
        description: "Ordered list of objects { label: string, load_kw: number, has_motor: boolean }; MUST be empty when backup_scope == WHOLE_HOME and non-empty when backup_scope == ESSENTIAL_LOADS. Array order is the pinned tie-break for equal load_kw."
        default: []
      - name: connected_load_kw
        type: number
        source: computed
        description: Output of calculations.load_sizing (variant selected by method); 2 decimals, round_half_up.
      - name: required_continuous_kw
        type: number
        source: computed
        description: Continuous backup power the battery bank must supply; output of calculations.load_sizing.
      - name: required_surge_kw
        type: number
        source: computed
        description: Motor-start surge the backup gateway must ride through; output of calculations.load_sizing.
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the calculation review.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REVISION_REQUIRED, APPROVED}"
      - name: revision_round_count
        type: integer
        source: computed
        description: Number of times the reviewing authority sent this calculation back for revision.
        default: 0
      - name: reviewer_notes
        type: string
        source: system
        description: Free-text note recorded by the reviewing authority on the latest decision.
        default: null

  - name: BatterySystem
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: site_id
        type: string
        source: input
        description: FK -> Site.id; premise where the bank is installed.
      - name: installer_id
        type: string
        source: input
        description: FK -> InstallerAccount.id; installer accountable for the build and warranty registration.
      - name: load_calculation_id
        type: string
        source: input
        description: FK -> LoadCalculation.id; the sizing basis this bank must satisfy.
      - name: expands_system_id
        type: string
        source: system
        description: FK -> BatterySystem.id; set on an expansion row to the superseded base system, null on an original build.
        default: null
      - name: model_code
        type: enum
        source: input
        description: Battery model; keys the MODEL_CATALOG constants in calculations.
        constraints: "one of {PWX_A, PWX_B, PWX_C}"
      - name: unit_count
        type: integer
        source: input
        description: Number of battery units in the bank.
        constraints: ">= 1"
      - name: inverter_model
        type: enum
        source: input
        description: Gateway/inverter model paired with the bank.
        constraints: "one of {GW2_HOME, GW3_HOME}"
      - name: firmware_version
        type: string
        source: input
        description: Installed firmware, dotted integers (e.g. 24.8.1), compared component-wise.
      - name: installed_cost_cents
        type: integer
        source: input
        description: Total installed cost in cents; denominator of the incentive stacking ceiling.
        constraints: "> 0"
      - name: usable_kwh
        type: number
        source: computed
        description: unit_count * MODEL_CATALOG[model_code].usable_kwh_per_unit; design energy basis.
      - name: continuous_kw
        type: number
        source: computed
        description: unit_count * MODEL_CATALOG[model_code].continuous_kw_per_unit; design power basis.
      - name: build_status
        type: enum
        source: system
        description: Physical build dimension of the parallel state machine.
        default: DESIGN_DRAFT
        constraints: "one of {DESIGN_DRAFT, DESIGN_LOCKED, INSTALLED, COMMISSIONED, SUPERSEDED, DESIGN_HOLD}"
      - name: grid_status
        type: enum
        source: system
        description: Utility interconnection dimension of the parallel state machine; evolves independently of build_status.
        default: NOT_APPLIED
        constraints: "one of {NOT_APPLIED, APPLICATION_SUBMITTED, APPROVED_TO_INSTALL, PTO_GRANTED, DENIED}"
      - name: commissioned_at
        type: datetime
        source: system
        description: Logical-clock instant at which build_status became COMMISSIONED.
        default: null
      - name: verified_capacity_kwh
        type: number
        source: computed
        description: delivered_kwh of the RECORDED CAPACITY_DISCHARGE CommissioningTest; FINAL rebate basis.
        default: null
      - name: warranty_status
        type: enum
        source: system
        description: Manufacturer warranty registration standing for this bank.
        default: UNREGISTERED
        constraints: "one of {UNREGISTERED, ACTIVE, VOID}"
      - name: warranty_deadline_at
        type: datetime
        source: computed
        description: commissioned_at + WARRANTY_REGISTRATION_GRACE_DAYS; inclusive registration boundary.
        default: null
      - name: warranty_registered_at
        type: datetime
        source: system
        description: Logical-clock instant the registration call was accepted.
        default: null
      - name: warranty_coverage_years
        type: integer
        source: system
        description: Coverage term recorded at registration.
        default: null
      - name: serial_numbers
        type: array
        source: system
        description: Unit serial numbers captured at warranty registration; length must equal unit_count.
        default: []

  - name: Permit
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: battery_system_id
        type: string
        source: input
        description: FK -> BatterySystem.id; the bank this building permit covers.
      - name: jurisdiction_code
        type: enum
        source: input
        description: Authority having jurisdiction that reviews and inspects.
        constraints: "one of {AHJ_CITY, AHJ_COUNTY}"
      - name: plan_set_ref
        type: string
        source: input
        description: Reference of the submitted plan set revision.
      - name: status
        type: enum
        source: system
        description: Permit lifecycle state; corrections form a cycle back to SUBMITTED.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CORRECTIONS_REQUIRED, ISSUED, INSPECTION_FAILED, INSPECTION_PASSED}"
      - name: correction_round_count
        type: integer
        source: computed
        description: Number of CORRECTIONS_REQUIRED rounds so far; capped by PERMIT_MAX_CORRECTION_ROUNDS.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant the permit was issued.
        default: null
      - name: expires_on
        type: datetime
        source: input
        description: Instant after which the issued permit is no longer valid (exclusive); supplied by the authority on the ISSUE decision.
        default: null
      - name: inspection_findings
        type: string
        source: system
        description: Findings recorded on the latest inspection result.
        default: null

  - name: InterconnectionApplication
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: battery_system_id
        type: string
        source: input
        description: FK -> BatterySystem.id; the bank being interconnected.
      - name: export_mode
        type: enum
        source: input
        description: Export posture requested from the utility.
        constraints: "one of {NON_EXPORT, LIMITED_EXPORT, FULL_EXPORT}"
      - name: requested_export_kw
        type: number
        source: input
        description: Requested export limit in kW; must be 0 when export_mode == NON_EXPORT.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Application lifecycle; supplemental review forms a cycle back to SUBMITTED.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, SUPPLEMENTAL_REVIEW, APPROVED_TO_INSTALL, PTO_GRANTED, DENIED}"
      - name: supplemental_round_count
        type: integer
        source: computed
        description: Number of times the application entered SUPPLEMENTAL_REVIEW (reviewer-requested or cascaded).
        default: 0
      - name: approved_export_kw
        type: number
        source: system
        description: Export limit locked at the APPROVE_TO_INSTALL decision.
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the reviewer who moved the application to APPROVED_TO_INSTALL; segregation-of-duties basis for the PTO grant.
        default: null
      - name: pto_granted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the reviewer who granted permission to operate.
        default: null
      - name: pto_granted_at
        type: datetime
        source: system
        description: Logical-clock instant permission to operate was granted.
        default: null

  - name: IncentiveProgram
    parent: null
    common_fields: true
    kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Program name.
      - name: program_type
        type: enum
        source: input
        description: Funding source class of the program.
        constraints: "one of {STATE_CAPACITY, UTILITY_UPFRONT, FEDERAL_ADDER}"
      - name: total_budget_cents
        type: integer
        source: input
        description: Immutable size of the funding pool in cents.
        constraints: "> 0"
      - name: remaining_budget_cents
        type: number
        source: computed
        description: Unencumbered pool balance; total_budget_cents at creation.
      - name: reserved_budget_cents
        type: number
        source: computed
        description: Sum of amounts held for claims in {RESERVED, SUBMITTED, APPROVED}.
        default: 0
      - name: paid_budget_cents
        type: number
        source: computed
        description: Sum of final_amount_cents for claims in status PAID.
        default: 0
      - name: tier1_limit_kwh
        type: number
        source: input
        description: Upper bound of the first energy tier in kWh (inclusive).
        constraints: "> 0"
      - name: tier1_rate_cents_per_kwh
        type: integer
        source: input
        description: Cents per kWh applied to the first tier.
        constraints: ">= 0"
      - name: tier2_rate_cents_per_kwh
        type: integer
        source: input
        description: Cents per kWh applied to basis above tier1_limit_kwh.
        constraints: ">= 0"
      - name: per_project_cap_cents
        type: integer
        source: input
        description: Maximum award this program pays to one system.
        constraints: "> 0"
      - name: stack_priority
        type: integer
        source: input
        description: Waterfall order for stacking; lower value consumes stacking headroom first.
        constraints: ">= 1"
      - name: max_stack_pct_of_cost_bp
        type: integer
        source: input
        description: Program's cap on total stacked incentives as basis points of installed_cost_cents.
        constraints: "1..10000"
      - name: requires_export_commitment
        type: boolean
        source: input
        description: When true, a claim must commit to LIMITED_EXPORT or FULL_EXPORT.
        default: false
      - name: min_capacity_commitment_kw
        type: number
        source: input
        description: Minimum kW a claim must commit for this program.
        constraints: ">= 0"

  - name: RebateClaim
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: battery_system_id
        type: string
        source: input
        description: FK -> BatterySystem.id; the system claiming the incentive.
      - name: program_id
        type: string
        source: input
        description: FK -> IncentiveProgram.id; the funding pool being drawn on.
      - name: capacity_commitment_kw
        type: number
        source: input
        description: kW the homeowner commits to make available; bounded by program minimum and system continuous_kw.
        constraints: "> 0"
      - name: export_commitment
        type: enum
        source: input
        description: Export posture committed for the incentive term.
        constraints: "one of {NON_EXPORT, LIMITED_EXPORT, FULL_EXPORT}"
      - name: basis_kwh_reserved
        type: number
        source: computed
        description: Energy basis used by the RESERVED variant of calculations.rebate_award (design usable_kwh).
      - name: basis_kwh_final
        type: number
        source: computed
        description: Energy basis used by the FINAL variant (min of design usable_kwh and verified_capacity_kwh).
        default: null
      - name: reserved_amount_cents
        type: integer
        source: computed
        description: Award held against the program pool at reservation time.
      - name: final_amount_cents
        type: integer
        source: computed
        description: Award recomputed at the APPROVE decision, clamped to reserved_amount_cents.
        default: null
      - name: stack_ceiling_cents
        type: integer
        source: computed
        description: floor(installed_cost_cents * min max_stack_pct_of_cost_bp over involved programs / 10000) at the moment of reservation.
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state.
        default: RESERVED
        constraints: "one of {RESERVED, SUBMITTED, APPROVED, PAID, DENIED, VOID, CLAWED_BACK}"
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the administrator who approved; segregation-of-duties basis for payment.
        default: null
      - name: paid_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the administrator who released payment.
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: Logical-clock instant payment was released.
        default: null
      - name: clawback_reason
        type: string
        source: system
        description: Reason recorded when the paid award was recovered.
        default: null

  - name: CommissioningTest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: battery_system_id
        type: string
        source: input
        description: FK -> BatterySystem.id; the bank under test.
      - name: test_type
        type: enum
        source: input
        description: Which commissioning verification this row records.
        constraints: "one of {BACKUP_TRANSITION, CAPACITY_DISCHARGE, ANTI_ISLANDING, FIRMWARE_BASELINE}; unique per (battery_system_id, test_type) among rows of the same system"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the booked test window on the installer's calendar.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the booked test window; must be strictly after window_start.
      - name: status
        type: enum
        source: system
        description: Whether a result has been recorded yet.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RECORDED}"
      - name: result
        type: enum
        source: computed
        description: Verdict produced by calculations.commissioning_verdict.
        default: PENDING
        constraints: "one of {PENDING, PASS, FAIL}"
      - name: transition_ms
        type: integer
        source: input
        description: Measured grid-to-backup transition time in milliseconds; only for BACKUP_TRANSITION.
        default: null
      - name: delivered_kwh
        type: number
        source: input
        description: Energy delivered during the discharge test; only for CAPACITY_DISCHARGE.
        default: null
      - name: anti_islanding_trip_ms
        type: integer
        source: input
        description: Measured anti-islanding trip time in milliseconds; only for ANTI_ISLANDING.
        default: null
      - name: reported_firmware_version
        type: string
        source: input
        description: Firmware read off the gateway; only for FIRMWARE_BASELINE.
        default: null
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the result was recorded.
        default: null

  - name: MonitoringAlert
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: battery_system_id
        type: string
        source: input
        description: FK -> BatterySystem.id; the bank that raised the alert.
      - name: alert_code
        type: enum
        source: input
        description: Telemetry/firmware alert raised by the manufacturer cloud.
        constraints: "one of {FIRMWARE_UPDATE_FAILED, CELL_IMBALANCE, GATEWAY_OFFLINE, THERMAL_DERATE}"
      - name: severity
        type: enum
        source: input
        description: Severity of the alert; CRITICAL alerts gate BYOD participation.
        constraints: "one of {INFO, WARNING, CRITICAL}"
      - name: reported_firmware_version
        type: string
        source: input
        description: Firmware running when the alert fired, dotted integers.
      - name: status
        type: enum
        source: system
        description: Combined alert/warranty-claim lifecycle; INFO_REQUESTED cycles back to UNDER_REVIEW.
        default: OPEN
        constraints: "one of {OPEN, ACKNOWLEDGED, UNDER_REVIEW, INFO_REQUESTED, CLAIM_APPROVED, CLAIM_DENIED}"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID that acknowledged the alert (Site id for a homeowner, InstallerAccount id for an installer).
        default: null
      - name: claimed_component
        type: string
        source: system
        description: Component named on the warranty claim filed against this alert.
        default: null
      - name: claim_round_count
        type: integer
        source: computed
        description: Number of times the claim entered UNDER_REVIEW (initial filing plus each information resubmission).
        default: 0
      - name: resolution_notes
        type: string
        source: system
        description: Notes recorded by the manufacturer agent on the latest claim decision.
        default: null

  - name: ByodEnrollment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: battery_system_id
        type: string
        source: input
        description: FK -> BatterySystem.id; the enrolled bank.
      - name: pledged_kw
        type: number
        source: input
        description: kW pledged to the bring-your-own-device program per event.
        constraints: "> 0"
      - name: reserve_soc_pct
        type: integer
        source: input
        description: State-of-charge reserve the homeowner keeps for backup.
        constraints: "0..50"
      - name: season
        type: enum
        source: input
        description: Program season this enrollment belongs to.
        constraints: "one of {SUMMER_2026, WINTER_2026}"
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle state.
        default: PENDING_CONSENT
        constraints: "one of {PENDING_CONSENT, ENROLLED, SUSPENDED, WITHDRAWN}"
      - name: consented_by_user_id
        type: string
        source: system
        description: Site id of the homeowner who consented.
        default: null
      - name: consented_at
        type: datetime
        source: system
        description: Logical-clock instant consent was recorded.
        default: null
      - name: cumulative_credited_kw
        type: number
        source: computed
        description: Sum of credited_kw over this enrollment's SETTLED performances.
        default: 0
      - name: cumulative_pledged_kw
        type: number
        source: computed
        description: Sum of pledged_kw_snapshot over this enrollment's SETTLED performances.
        default: 0
      - name: season_compliance_ratio
        type: number
        source: computed
        description: cumulative_credited_kw / cumulative_pledged_kw, 4 decimals; 0 while no performance has settled.
        default: 0
      - name: settled_event_count
        type: integer
        source: computed
        description: Number of this enrollment's performances in status SETTLED.
        default: 0
      - name: performance_payment_cents_total
        type: integer
        source: computed
        description: Sum of net_payment_cents over this enrollment's SETTLED performances.
        default: 0

  - name: DispatchEvent
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: territory_code
        type: enum
        source: input
        description: Utility territory the event is called in; overlap capacity is scoped to this value.
        constraints: "one of {TER_WEST, TER_EAST, TER_NORTH}"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the dispatch window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the dispatch window; must be strictly after window_start.
      - name: event_type
        type: enum
        source: input
        description: Event class; EMERGENCY events pay the emergency multiplier.
        constraints: "one of {ECONOMIC, EMERGENCY}"
      - name: target_kw
        type: number
        source: input
        description: kW the utility is calling for from the territory during this window.
        constraints: "> 0"
      - name: payment_rate_cents_per_kw
        type: integer
        source: input
        description: Cents paid per credited kW for this event.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Event lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, SETTLED}"
      - name: enrolled_pledged_kw
        type: number
        source: computed
        description: Capacity ledger — sum of pledged_kw_snapshot over this event's performances in {PENDING, REPORTED, SETTLED}.
        default: 0
      - name: total_net_payment_cents
        type: integer
        source: computed
        description: Sum of net_payment_cents over this event's SETTLED performances.
        default: 0
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant the event was settled.
        default: null

  - name: DispatchPerformance
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: dispatch_event_id
        type: string
        source: input
        description: FK -> DispatchEvent.id; the event this participation belongs to.
      - name: byod_enrollment_id
        type: string
        source: input
        description: FK -> ByodEnrollment.id; the enrollment participating.
      - name: pledged_kw_snapshot
        type: number
        source: computed
        description: ByodEnrollment.pledged_kw copied at participation creation; the amount the event's capacity ledger holds.
      - name: delivered_kwh
        type: number
        source: input
        description: Metered energy delivered during the event window; written by the delivery report.
        default: null
      - name: avg_delivered_kw
        type: number
        source: computed
        description: delivered_kwh / event window hours, 2 decimals round_half_up.
        default: null
      - name: credited_kw
        type: number
        source: computed
        description: min(avg_delivered_kw, pledged_kw_snapshot).
        default: null
      - name: performance_ratio
        type: number
        source: computed
        description: avg_delivered_kw / pledged_kw_snapshot, 4 decimals round_half_up.
        default: null
      - name: gross_payment_cents
        type: integer
        source: computed
        description: Output of calculations.byod_settlement step 1.
        default: null
      - name: shortfall_penalty_cents
        type: integer
        source: computed
        description: Output of calculations.byod_settlement step 2; 0 when performance_ratio >= SHORTFALL_RATIO_FLOOR.
        default: null
      - name: bonus_cents
        type: integer
        source: computed
        description: Output of calculations.byod_settlement step 5, keyed on the post-update season_compliance_ratio.
        default: null
      - name: net_payment_cents
        type: integer
        source: computed
        description: max(0, gross_payment_cents - shortfall_penalty_cents + bonus_cents).
        default: null
      - name: status
        type: enum
        source: system
        description: Participation lifecycle state.
        default: PENDING
        constraints: "one of {PENDING, REPORTED, SETTLED, CANCELLED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: LoadCalculation
    dimension: status
    shape: branching_with_revision_cycle
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /load-calculations/{loadCalculationId}/submit"
        actor: CertifiedInstaller
        preconditions:
          - "status == DRAFT"
          - "when method == NEC_220_87_MEASURED, measured_peak_kw is present"
          - "when backup_scope == ESSENTIAL_LOADS, essential_circuits is non-empty; when WHOLE_HOME, essential_circuits is empty"
        side_effects:
          - "if any of method/backup_scope/measured_peak_kw/essential_circuits override fields are supplied, they replace the stored inputs first"
          - "recompute calculations.load_sizing -> connected_load_kw, required_continuous_kw, required_surge_kw"
      - from: REVISION_REQUIRED
        to: SUBMITTED
        trigger: "POST /load-calculations/{loadCalculationId}/submit"
        actor: CertifiedInstaller
        preconditions:
          - "status == REVISION_REQUIRED"
          - "same input-consistency preconditions as the DRAFT -> SUBMITTED transition, evaluated against the post-override values"
        side_effects:
          - "overrides replace stored inputs, then recompute calculations.load_sizing -> connected_load_kw, required_continuous_kw, required_surge_kw"
        note: "This is the revision cycle: REVISION_REQUIRED -> SUBMITTED -> REVISION_REQUIRED may repeat without limit."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /load-calculations/{loadCalculationId}/review with decision == APPROVE"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reviewer_notes := notes (null when omitted)"
      - from: SUBMITTED
        to: REVISION_REQUIRED
        trigger: "POST /load-calculations/{loadCalculationId}/review with decision == REQUEST_REVISION"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "revision_round_count += 1"
          - "reviewer_notes := notes (null when omitted)"

  - entity: BatterySystem
    dimension: build_status
    shape: parallel_dimension_1_of_2
    initial_state: DESIGN_DRAFT
    terminal_states: [SUPERSEDED, DESIGN_HOLD]
    note: |
      build_status and grid_status are independent dimensions of the same row: a system may sit at
      (DESIGN_LOCKED, PTO_GRANTED) or (COMMISSIONED, APPLICATION_SUBMITTED). Neither dimension's
      transitions imply the other's; the sequencing rules that couple them are expressed as
      cross-dimension preconditions below.
    transitions:
      - from: DESIGN_DRAFT
        to: DESIGN_LOCKED
        trigger: "POST /battery-systems/{batterySystemId}/lock-design"
        actor: CertifiedInstaller
        preconditions:
          - "build_status == DESIGN_DRAFT"
          - "LoadCalculation(load_calculation_id).status == APPROVED"
          - "continuous_kw >= LoadCalculation(load_calculation_id).required_continuous_kw"
          - "InstallerAccount(installer_id).certification_status == ACTIVE, current_utc < certification_expires_on, and model_code IN certified_model_codes"
        side_effects:
          - "no cross-entity writes; version += 1 and updated_at refreshed"
      - from: DESIGN_LOCKED
        to: INSTALLED
        trigger: "POST /battery-systems/{batterySystemId}/mark-installed"
        actor: CertifiedInstaller
        preconditions:
          - "build_status == DESIGN_LOCKED"
          - "the Permit whose battery_system_id == this system has status IN {ISSUED, INSPECTION_FAILED, INSPECTION_PASSED}"
          - "current_utc < that Permit.expires_on"
          - "grid_status == APPROVED_TO_INSTALL"
        side_effects:
          - "no cross-entity writes; version += 1 and updated_at refreshed"
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /battery-systems/{batterySystemId}/commission"
        actor: CertifiedInstaller
        preconditions:
          - "build_status == INSTALLED"
          - "for each of the four test_type values there is exactly one CommissioningTest with status == RECORDED and result == PASS"
          - "current_utc < Permit.expires_on for the Permit whose battery_system_id == this system"
        side_effects:
          - "CASCADE-B hop 1: build_status := COMMISSIONED; commissioned_at := current_utc; warranty_deadline_at := commissioned_at + WARRANTY_REGISTRATION_GRACE_DAYS; verified_capacity_kwh := delivered_kwh of the RECORDED CAPACITY_DISCHARGE test; InstallerAccount(installer_id).commissioned_system_count += 1"
          - "CASCADE-B hop 2 (caused by hop 1 writing verified_capacity_kwh): every RebateClaim whose battery_system_id == this system and status IN {RESERVED, SUBMITTED} runs calculations.rebate_award variant FINAL, writing basis_kwh_final and final_amount_cents := min(final_award_cents, reserved_amount_cents); claims are processed in IncentiveProgram.stack_priority ASC, then RebateClaim.created_at ASC"
          - "CASCADE-B hop 3 (caused by hop 2 lowering each claim's effective hold): for each such claim, delta := reserved_amount_cents - final_amount_cents; IncentiveProgram(program_id).reserved_budget_cents -= delta and remaining_budget_cents += delta"
      - from: COMMISSIONED
        to: SUPERSEDED
        trigger: "POST /battery-systems/{batterySystemId}/expansions"
        actor: CertifiedInstaller
        preconditions:
          - "build_status == COMMISSIONED"
          - "grid_status == PTO_GRANTED"
          - "expansion compatibility rules of calculations.expansion_compatibility all hold"
        side_effects:
          - "a new BatterySystem row is created with expands_system_id := this system's id, unit_count := this.unit_count + additional_unit_count, installed_cost_cents := this.installed_cost_cents + additional_cost_cents, same site_id/installer_id/load_calculation_id/model_code, build_status := DESIGN_LOCKED, grid_status := APPLICATION_SUBMITTED, warranty_status := UNREGISTERED"
          - "CASCADE-C hop 1: this system build_status := SUPERSEDED"
          - "CASCADE-C hop 2 (caused by hop 1): every ByodEnrollment whose battery_system_id == this system and status == ENROLLED becomes SUSPENDED"
          - "CASCADE-C hop 3 (caused by hop 2): for each such enrollment, every DispatchPerformance with status == PENDING whose DispatchEvent.status == SCHEDULED becomes CANCELLED, and that event's enrolled_pledged_kw -= the performance's pledged_kw_snapshot"
      - from: DESIGN_DRAFT
        to: DESIGN_HOLD
        trigger: "system event — CASCADE-D hop 4 (installer certification_status became SUSPENDED)"
        actor: system
        preconditions:
          - "build_status == DESIGN_DRAFT"
          - "InstallerAccount(installer_id).certification_status just became SUSPENDED"
        side_effects:
          - "version += 1 and updated_at refreshed"
      - from: DESIGN_LOCKED
        to: DESIGN_HOLD
        trigger: "system event — CASCADE-D hop 4 (installer certification_status became SUSPENDED)"
        actor: system
        preconditions:
          - "build_status == DESIGN_LOCKED"
          - "InstallerAccount(installer_id).certification_status just became SUSPENDED"
        side_effects:
          - "version += 1 and updated_at refreshed"

  - entity: BatterySystem
    dimension: grid_status
    shape: parallel_dimension_2_of_2
    initial_state: NOT_APPLIED
    terminal_states: [DENIED]
    transitions:
      - from: NOT_APPLIED
        to: APPLICATION_SUBMITTED
        trigger: "POST /interconnection-applications/{applicationId}/submit (side effect on the referenced system)"
        actor: CertifiedInstaller
        preconditions:
          - "grid_status IN {NOT_APPLIED, APPLICATION_SUBMITTED}"
        side_effects:
          - "grid_status := APPLICATION_SUBMITTED"
      - from: APPLICATION_SUBMITTED
        to: APPROVED_TO_INSTALL
        trigger: "POST /interconnection-applications/{applicationId}/review with decision == APPROVE_TO_INSTALL"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "grid_status == APPLICATION_SUBMITTED"
        side_effects:
          - "grid_status := APPROVED_TO_INSTALL"
      - from: APPLICATION_SUBMITTED
        to: DENIED
        trigger: "POST /interconnection-applications/{applicationId}/review with decision == DENY"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "grid_status == APPLICATION_SUBMITTED"
        side_effects:
          - "grid_status := DENIED (terminal: no further interconnection application may be created for this system)"
      - from: APPROVED_TO_INSTALL
        to: PTO_GRANTED
        trigger: "POST /interconnection-applications/{applicationId}/grant-pto"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "grid_status == APPROVED_TO_INSTALL"
          - "build_status == COMMISSIONED"
          - "the Permit whose battery_system_id == this system has status == INSPECTION_PASSED"
        side_effects:
          - "grid_status := PTO_GRANTED"
      - from: APPROVED_TO_INSTALL
        to: APPLICATION_SUBMITTED
        trigger: "system event — CASCADE-A hop 3 (linked application returned to SUPPLEMENTAL_REVIEW)"
        actor: system
        preconditions:
          - "grid_status == APPROVED_TO_INSTALL"
        side_effects:
          - "grid_status := APPLICATION_SUBMITTED"
      - from: PTO_GRANTED
        to: APPLICATION_SUBMITTED
        trigger: "system event — CASCADE-A hop 3 (linked application returned to SUPPLEMENTAL_REVIEW)"
        actor: system
        preconditions:
          - "grid_status == PTO_GRANTED"
        side_effects:
          - "grid_status := APPLICATION_SUBMITTED"
          - "CASCADE-A hop 4 (caused by leaving PTO_GRANTED): every ByodEnrollment whose battery_system_id == this system and status == ENROLLED becomes SUSPENDED"
          - "CASCADE-A hop 5 (caused by hop 4): for each such enrollment, every DispatchPerformance with status == PENDING whose DispatchEvent.status == SCHEDULED becomes CANCELLED and that event's enrolled_pledged_kw -= the performance's pledged_kw_snapshot"

  - entity: Permit
    dimension: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: []
    note: |
      Two cycles: SUBMITTED -> CORRECTIONS_REQUIRED -> SUBMITTED (bounded by PERMIT_MAX_CORRECTION_ROUNDS)
      and ISSUED -> INSPECTION_FAILED -> INSPECTION_PASSED -> INSPECTION_FAILED (unbounded re-inspection).
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /permits/{permitId}/submit"
        actor: CertifiedInstaller
        preconditions:
          - "status == DRAFT"
          - "BatterySystem(battery_system_id).build_status IN {DESIGN_LOCKED, INSTALLED}"
        side_effects:
          - "plan_set_ref := plan_set_ref override when supplied"
      - from: CORRECTIONS_REQUIRED
        to: SUBMITTED
        trigger: "POST /permits/{permitId}/submit"
        actor: CertifiedInstaller
        preconditions:
          - "status == CORRECTIONS_REQUIRED"
        side_effects:
          - "plan_set_ref := plan_set_ref override when supplied"
        note: "Correction cycle; the round counter is bumped on the CORRECTIONS_REQUIRED edge, not here."
      - from: SUBMITTED
        to: CORRECTIONS_REQUIRED
        trigger: "POST /permits/{permitId}/review with decision == REQUEST_CORRECTIONS"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == SUBMITTED"
          - "correction_round_count < PERMIT_MAX_CORRECTION_ROUNDS (3)"
        side_effects:
          - "correction_round_count += 1"
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /permits/{permitId}/review with decision == ISSUE"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == SUBMITTED"
          - "expires_on is supplied and is strictly after current_utc"
        side_effects:
          - "issued_at := current_utc; expires_on := supplied value"
      - from: ISSUED
        to: INSPECTION_PASSED
        trigger: "POST /permits/{permitId}/inspection-result with result == PASS"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status IN {ISSUED, INSPECTION_FAILED}"
          - "current_utc < expires_on"
          - "BatterySystem(battery_system_id).build_status IN {INSTALLED, COMMISSIONED}"
        side_effects:
          - "inspection_findings := findings (null when omitted)"
      - from: INSPECTION_FAILED
        to: INSPECTION_PASSED
        trigger: "POST /permits/{permitId}/inspection-result with result == PASS (re-inspection)"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == INSPECTION_FAILED"
          - "current_utc < expires_on"
        side_effects:
          - "inspection_findings := findings (null when omitted)"
      - from: ISSUED
        to: INSPECTION_FAILED
        trigger: "POST /permits/{permitId}/inspection-result with result == FAIL"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == ISSUED"
          - "current_utc < expires_on"
        side_effects:
          - "inspection_findings := findings (null when omitted)"
      - from: INSPECTION_PASSED
        to: INSPECTION_FAILED
        trigger: "POST /permits/{permitId}/inspection-result with result == FAIL (post-energization re-inspection)"
        actor: AuthorityHavingJurisdiction
        preconditions:
          - "status == INSPECTION_PASSED"
          - "current_utc < expires_on"
        side_effects:
          - "CASCADE-A hop 1: status := INSPECTION_FAILED; inspection_findings := findings"
          - "CASCADE-A hop 2 (caused by hop 1 removing the passed inspection): the InterconnectionApplication whose battery_system_id == this permit's battery_system_id and whose status IN {APPROVED_TO_INSTALL, PTO_GRANTED} becomes SUPPLEMENTAL_REVIEW, supplemental_round_count += 1, approved_export_kw := null, pto_granted_by_user_id := null, pto_granted_at := null"
          - "CASCADE-A hop 3 (caused by hop 2): BatterySystem.grid_status := APPLICATION_SUBMITTED"
          - "CASCADE-A hops 4-5 fire from the grid_status edge as declared in the BatterySystem grid_status machine"

  - entity: InterconnectionApplication
    dimension: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /interconnection-applications/{applicationId}/submit"
        actor: CertifiedInstaller
        preconditions:
          - "status == DRAFT"
          - "BatterySystem(battery_system_id).build_status IN {DESIGN_LOCKED, INSTALLED, COMMISSIONED}"
          - "BatterySystem(battery_system_id).grid_status != DENIED"
        side_effects:
          - "BatterySystem.grid_status := APPLICATION_SUBMITTED"
      - from: SUPPLEMENTAL_REVIEW
        to: SUBMITTED
        trigger: "POST /interconnection-applications/{applicationId}/submit (respond to supplemental review)"
        actor: CertifiedInstaller
        preconditions:
          - "status == SUPPLEMENTAL_REVIEW"
        side_effects:
          - "BatterySystem.grid_status := APPLICATION_SUBMITTED"
        note: "Supplemental-review cycle; may repeat without limit."
      - from: SUBMITTED
        to: SUPPLEMENTAL_REVIEW
        trigger: "POST /interconnection-applications/{applicationId}/review with decision == REQUEST_SUPPLEMENTAL"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "supplemental_round_count += 1"
      - from: SUBMITTED
        to: APPROVED_TO_INSTALL
        trigger: "POST /interconnection-applications/{applicationId}/review with decision == APPROVE_TO_INSTALL"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == SUBMITTED"
          - "when export_mode == NON_EXPORT, requested_export_kw == 0"
        side_effects:
          - "approved_export_kw := requested_export_kw; reviewed_by_user_id := X-User-ID of the caller"
          - "BatterySystem.grid_status := APPROVED_TO_INSTALL"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /interconnection-applications/{applicationId}/review with decision == DENY"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "BatterySystem.grid_status := DENIED"
      - from: APPROVED_TO_INSTALL
        to: PTO_GRANTED
        trigger: "POST /interconnection-applications/{applicationId}/grant-pto"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == APPROVED_TO_INSTALL"
          - "BatterySystem(battery_system_id).build_status == COMMISSIONED"
          - "the Permit whose battery_system_id == this application's battery_system_id has status == INSPECTION_PASSED"
          - "X-User-ID of the caller != reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "pto_granted_by_user_id := X-User-ID; pto_granted_at := current_utc"
          - "BatterySystem.grid_status := PTO_GRANTED"
      - from: APPROVED_TO_INSTALL
        to: SUPPLEMENTAL_REVIEW
        trigger: "system event — CASCADE-A hop 2 (linked permit inspection flipped to INSPECTION_FAILED)"
        actor: system
        preconditions:
          - "status == APPROVED_TO_INSTALL"
        side_effects:
          - "supplemental_round_count += 1; approved_export_kw := null"
      - from: PTO_GRANTED
        to: SUPPLEMENTAL_REVIEW
        trigger: "system event — CASCADE-A hop 2 (linked permit inspection flipped to INSPECTION_FAILED)"
        actor: system
        preconditions:
          - "status == PTO_GRANTED"
        side_effects:
          - "supplemental_round_count += 1; approved_export_kw := null; pto_granted_by_user_id := null; pto_granted_at := null"

  - entity: RebateClaim
    dimension: status
    shape: branching_with_compensation
    initial_state: RESERVED
    terminal_states: [PAID, DENIED, VOID, CLAWED_BACK]
    note: |
      effective_hold_cents := coalesce(final_amount_cents, reserved_amount_cents). Every ledger move
      below uses effective_hold_cents so that the IncentiveProgram invariant
      total_budget_cents == remaining_budget_cents + reserved_budget_cents + paid_budget_cents holds
      after every transition.
    transitions:
      - from: RESERVED
        to: SUBMITTED
        trigger: "POST /rebate-claims/{claimId}/submit"
        actor: CertifiedInstaller
        preconditions:
          - "status == RESERVED"
          - "BatterySystem(battery_system_id).build_status == COMMISSIONED"
          - "BatterySystem(battery_system_id).grid_status == PTO_GRANTED"
          - "BatterySystem(battery_system_id).warranty_status == ACTIVE"
        side_effects:
          - "no ledger move (the hold already sits in reserved_budget_cents)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rebate-claims/{claimId}/decision with decision == APPROVE"
        actor: RebateAdministrator
        preconditions:
          - "status == SUBMITTED"
          - "final_amount_cents is not null (written by CASCADE-B at commissioning)"
        side_effects:
          - "approved_by_user_id := X-User-ID of the caller"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rebate-claims/{claimId}/decision with decision == DENY"
        actor: RebateAdministrator
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "IncentiveProgram(program_id).reserved_budget_cents -= effective_hold_cents; remaining_budget_cents += effective_hold_cents"
      - from: APPROVED
        to: PAID
        trigger: "POST /rebate-claims/{claimId}/pay"
        actor: RebateAdministrator
        preconditions:
          - "status == APPROVED"
          - "X-User-ID of the caller != approved_by_user_id (segregation of duties)"
        side_effects:
          - "paid_by_user_id := X-User-ID; paid_at := current_utc"
          - "IncentiveProgram(program_id).reserved_budget_cents -= final_amount_cents; paid_budget_cents += final_amount_cents"
      - from: RESERVED
        to: VOID
        trigger: "POST /rebate-claims/{claimId}/void"
        actor: CertifiedInstaller
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "IncentiveProgram(program_id).reserved_budget_cents -= effective_hold_cents; remaining_budget_cents += effective_hold_cents"
          - "the claim stops counting toward other claims' stacking headroom (status VOID is excluded from the prior-committed set)"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /rebate-claims/{claimId}/clawback"
        actor: RebateAdministrator
        preconditions:
          - "status == PAID"
        side_effects:
          - "CASCADE-D hop 1: status := CLAWED_BACK; clawback_reason := reason; IncentiveProgram(program_id).paid_budget_cents -= final_amount_cents and remaining_budget_cents += final_amount_cents"
          - "CASCADE-D hop 2 (caused by hop 1): InstallerAccount(BatterySystem(battery_system_id).installer_id).clawback_count += 1"
          - "CASCADE-D hop 3 (caused by hop 2 reaching the threshold): when clawback_count >= CLAWBACK_SUSPENSION_THRESHOLD (2), that installer's certification_status := SUSPENDED"
          - "CASCADE-D hop 4 (caused by hop 3): every BatterySystem of that installer with build_status IN {DESIGN_DRAFT, DESIGN_LOCKED} becomes DESIGN_HOLD, processed in created_at ASC"

  - entity: MonitoringAlert
    dimension: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: [CLAIM_APPROVED, CLAIM_DENIED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /monitoring-alerts/{alertId}/acknowledge"
        actor: Homeowner | CertifiedInstaller
        preconditions:
          - "status == OPEN"
          - "when the caller is Homeowner, X-User-ID == BatterySystem(battery_system_id).site_id; when the caller is CertifiedInstaller, X-User-ID == BatterySystem(battery_system_id).installer_id"
        side_effects:
          - "acknowledged_by_user_id := X-User-ID"
      - from: ACKNOWLEDGED
        to: UNDER_REVIEW
        trigger: "POST /monitoring-alerts/{alertId}/file-claim"
        actor: CertifiedInstaller
        preconditions:
          - "status == ACKNOWLEDGED"
          - "BatterySystem(battery_system_id).warranty_status == ACTIVE"
        side_effects:
          - "claimed_component := claimed_component; claim_round_count += 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /monitoring-alerts/{alertId}/file-claim (supply the requested information)"
        actor: CertifiedInstaller
        preconditions:
          - "status == INFO_REQUESTED"
          - "BatterySystem(battery_system_id).warranty_status == ACTIVE"
        side_effects:
          - "claimed_component := claimed_component; claim_round_count += 1"
        note: "Claim review cycle; may repeat without limit."
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /monitoring-alerts/{alertId}/review-claim with decision == REQUEST_INFO"
        actor: ManufacturerWarrantyAgent
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "resolution_notes := notes (null when omitted)"
      - from: UNDER_REVIEW
        to: CLAIM_APPROVED
        trigger: "POST /monitoring-alerts/{alertId}/review-claim with decision == APPROVE"
        actor: ManufacturerWarrantyAgent
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "resolution_notes := notes (null when omitted)"
      - from: UNDER_REVIEW
        to: CLAIM_DENIED
        trigger: "POST /monitoring-alerts/{alertId}/review-claim with decision == DENY"
        actor: ManufacturerWarrantyAgent
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "resolution_notes := notes (null when omitted)"

  - entity: ByodEnrollment
    dimension: status
    shape: branching_with_compensation
    initial_state: PENDING_CONSENT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: PENDING_CONSENT
        to: ENROLLED
        trigger: "POST /byod-enrollments/{enrollmentId}/consent"
        actor: Homeowner
        preconditions:
          - "status == PENDING_CONSENT"
          - "X-User-ID == BatterySystem(battery_system_id).site_id"
          - "BatterySystem(battery_system_id).grid_status == PTO_GRANTED"
        side_effects:
          - "consented_by_user_id := X-User-ID; consented_at := current_utc"
      - from: PENDING_CONSENT
        to: WITHDRAWN
        trigger: "POST /byod-enrollments/{enrollmentId}/withdraw"
        actor: Homeowner | CertifiedInstaller
        preconditions:
          - "status == PENDING_CONSENT"
        side_effects:
          - "no capacity ledger move (a PENDING_CONSENT enrollment can hold no participations)"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /byod-enrollments/{enrollmentId}/withdraw"
        actor: Homeowner | CertifiedInstaller
        preconditions:
          - "status == ENROLLED"
        side_effects:
          - "COMPENSATION: every DispatchPerformance of this enrollment with status == PENDING whose DispatchEvent.status == SCHEDULED becomes CANCELLED, processed in DispatchPerformance.created_at ASC"
          - "for each cancelled performance, DispatchEvent.enrolled_pledged_kw -= that performance's pledged_kw_snapshot, restoring the capacity ledger to its pre-participation value"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "system event — CASCADE-A hop 4 or CASCADE-C hop 2"
        actor: system
        preconditions:
          - "status == ENROLLED"
        side_effects:
          - "every DispatchPerformance of this enrollment with status == PENDING whose DispatchEvent.status == SCHEDULED becomes CANCELLED and that event's enrolled_pledged_kw -= pledged_kw_snapshot"

  - entity: DispatchEvent
    dimension: status
    shape: linear
    initial_state: SCHEDULED
    terminal_states: [SETTLED]
    transitions:
      - from: SCHEDULED
        to: SETTLED
        trigger: "POST /dispatch-events/{eventId}/settle"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == SCHEDULED"
          - "current_utc >= window_end"
          - "every DispatchPerformance of this event with status != CANCELLED has status == REPORTED"
        side_effects:
          - "each non-CANCELLED performance is settled in DispatchPerformance.created_at ASC by calculations.byod_settlement, moving it to SETTLED"
          - "settled_at := current_utc; total_net_payment_cents := sum of net_payment_cents over the settled performances (0 when the event has no non-CANCELLED performances)"

  - entity: DispatchPerformance
    dimension: status
    shape: branching
    initial_state: PENDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PENDING
        to: REPORTED
        trigger: "POST /dispatch-performances/{performanceId}/report-delivery"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == PENDING"
          - "DispatchEvent(dispatch_event_id).status == SCHEDULED"
          - "current_utc >= DispatchEvent.window_end"
        side_effects:
          - "delivered_kwh := reported value; avg_delivered_kw, credited_kw and performance_ratio are computed by calculations.byod_settlement steps 1a-1c"
      - from: REPORTED
        to: SETTLED
        trigger: "POST /dispatch-events/{eventId}/settle (per-performance settlement)"
        actor: UtilityInterconnectionReviewer
        preconditions:
          - "status == REPORTED"
          - "DispatchEvent.status == SCHEDULED"
        side_effects:
          - "calculations.byod_settlement steps 2-7 write gross_payment_cents, shortfall_penalty_cents, bonus_cents, net_payment_cents"
          - "ByodEnrollment(byod_enrollment_id) accumulators are advanced: cumulative_credited_kw, cumulative_pledged_kw, season_compliance_ratio, settled_event_count, performance_payment_cents_total"
      - from: PENDING
        to: CANCELLED
        trigger: "system event — enrollment withdrawal, CASCADE-A hop 5 or CASCADE-C hop 3"
        actor: system
        preconditions:
          - "status == PENDING"
          - "DispatchEvent.status == SCHEDULED"
        side_effects:
          - "DispatchEvent.enrolled_pledged_kw -= pledged_kw_snapshot"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: claim-reserve-stale-system
    parent_entity: BatterySystem
    write_endpoint: "POST /rebate-claims"
    occ_field: "expected_battery_system_version"
    description: |
      Reserving a RebateClaim against a BatterySystem whose version has advanced since the client last
      observed it is rejected. A second reservation against the same system is legitimate product
      behaviour (incentives stack across programs), so the stale-view case cannot be caught by any state
      precondition: the guard is the version the client carries. Any prior write to the system —
      including a sibling claim reservation, which bumps the system version — invalidates the stale view.
    error_id: ERR_STALE_SYSTEM_VERSION
    http_status: 412

  - rule_id: participation-create-stale-event
    parent_entity: DispatchEvent
    write_endpoint: "POST /dispatch-events/{eventId}/participations"
    occ_field: "expected_dispatch_event_version"
    description: |
      Adding a participation to a DispatchEvent whose version has advanced since the client last read it
      is rejected. Adding another participation is legitimate (an event aggregates many enrollments), so
      no state precondition covers a client whose view of enrolled_pledged_kw is stale; the version check
      is what makes the aggregate capacity decision safe.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: load_sizing
    trigger: "On LoadCalculation creation (POST /load-calculations) and on every DRAFT|REVISION_REQUIRED -> SUBMITTED transition"
    algorithm: threshold
    entity_domain: LoadCalculation
    formula: |
      # --- step 1: connected load (dual variant, selected by `method`) -------------------
      lighting_va      = lighting_area_sqft * LIGHTING_VA_PER_SQFT
      other_load_va    = lighting_va + appliance_load_va
      general_va       = min(other_load_va, GENERAL_FIRST_VA) * GENERAL_FIRST_FACTOR
                       + max(0, other_load_va - GENERAL_FIRST_VA) * GENERAL_REMAINDER_FACTOR
      hvac_va          = max(heating_va, cooling_va)
      if method == NEC_220_82_STANDARD:
          connected_load_kw = round_half_up((general_va + hvac_va) / 1000, 2)
      else:  # NEC_220_87_MEASURED
          connected_load_kw = round_half_up(measured_peak_kw * MEASURED_METHOD_HEADROOM, 2)

      # --- step 2: backup sizing (branch on backup_scope) -----------------------------
      if backup_scope == WHOLE_HOME:
          required_continuous_kw = connected_load_kw
          required_surge_kw      = round_half_up(connected_load_kw * WHOLE_HOME_SURGE_FACTOR, 2)
      else:  # ESSENTIAL_LOADS
          ranked   = essential_circuits sorted by load_kw DESC,
                     tie-break: smaller index in the submitted essential_circuits array first
          top_kw   = sum(load_kw of the first ESSENTIAL_TOP_N entries of `ranked`)
          rest_kw  = sum(load_kw of the remaining entries of `ranked`)
          required_continuous_kw = round_half_up(
              min(top_kw + ESSENTIAL_REMAINDER_FACTOR * rest_kw, connected_load_kw), 2)
          motor_surge_kw = max({load_kw * MOTOR_SURGE_MULTIPLIER for circuits with has_motor == true}
                               union {0})
          required_surge_kw = round_half_up(
              motor_surge_kw + SURGE_HEADROOM_FACTOR * required_continuous_kw, 2)
    input_set: |
      Only the LoadCalculation's own stored input fields participate; Site fields are NOT read (the
      installer restates lighting_area_sqft on the calculation so a site edit cannot silently re-size an
      approved calculation). essential_circuits participates only when backup_scope == ESSENTIAL_LOADS.
    constants:
      LIGHTING_VA_PER_SQFT: 3
      GENERAL_FIRST_VA: 3000
      GENERAL_FIRST_FACTOR: 1.00
      GENERAL_REMAINDER_FACTOR: 0.40
      MEASURED_METHOD_HEADROOM: 1.25
      WHOLE_HOME_SURGE_FACTOR: 1.75
      ESSENTIAL_TOP_N: 2
      ESSENTIAL_REMAINDER_FACTOR: 0.50
      MOTOR_SURGE_MULTIPLIER: 3.0
      SURGE_HEADROOM_FACTOR: 0.25
    precision: "kW values: 2 decimals, round_half_up, computed on exact decimal arithmetic (no binary float intermediate rounding)"
    variants:
      - name: STANDARD_OPTIONAL_METHOD
        when: "method == NEC_220_82_STANDARD"
        difference: "connected_load_kw is derived from nameplate VA with the 3000 VA / 40 % demand split plus the larger of heating vs cooling; ignores measured_peak_kw entirely."
      - name: MEASURED_DEMAND_METHOD
        when: "method == NEC_220_87_MEASURED"
        difference: "connected_load_kw is measured_peak_kw * 1.25; the VA nameplate inputs are ignored, so the same premise yields a different connected_load_kw (and, under WHOLE_HOME, a different required_continuous_kw and required_surge_kw)."

  - name: rebate_award
    trigger: "RESERVED variant on POST /rebate-claims; FINAL variant as CASCADE-B hop 2 of the BatterySystem INSTALLED -> COMMISSIONED transition"
    algorithm: tiered_pricing
    entity_domain: RebateClaim
    formula: |
      # --- step 1: energy basis (dual variant) ----------------------------------------
      if variant == RESERVED:  basis_kwh = BatterySystem.usable_kwh
      if variant == FINAL:     basis_kwh = min(BatterySystem.usable_kwh,
                                               BatterySystem.verified_capacity_kwh)

      # --- step 2: tiered energy award, then export multiplier, THEN one rounding ------
      tier1_kwh   = min(basis_kwh, program.tier1_limit_kwh)
      tier2_kwh   = max(0, basis_kwh - program.tier1_limit_kwh)
      raw_cents   = program.tier1_rate_cents_per_kwh * tier1_kwh
                  + program.tier2_rate_cents_per_kwh * tier2_kwh          # NOT rounded here
      mult_bp     = EXPORT_MULTIPLIER_BP[export_commitment]
      award_cents = round_half_up(raw_cents * mult_bp / 10000, 0)         # the ONE rounding step
      award_cents = min(award_cents, program.per_project_cap_cents)

      # --- step 3: stacking ceiling and waterfall headroom ----------------------------
      involved_programs = { IncentiveProgram of every RebateClaim whose
                            battery_system_id == this system and status NOT IN {VOID, DENIED, CLAWED_BACK} }
                          union { this claim's program }
      ceiling_cents = floor(BatterySystem.installed_cost_cents
                            * min(p.max_stack_pct_of_cost_bp for p in involved_programs) / 10000)
      prior_committed_cents = sum over sibling claims (same battery_system_id, excluding this claim,
                              status NOT IN {VOID, DENIED, CLAWED_BACK}) of
                              coalesce(final_amount_cents, reserved_amount_cents),
                              accumulated in program.stack_priority ASC then claim.created_at ASC
      headroom_cents = max(0, ceiling_cents - prior_committed_cents)
      if headroom_cents == 0:  reject with ERR_STACK_CAP_EXCEEDED
      award_cents = min(award_cents, headroom_cents)      # waterfall truncation, not an error

      # --- step 4: variant-specific write --------------------------------------------
      if variant == RESERVED:
          basis_kwh_reserved   = basis_kwh
          stack_ceiling_cents  = ceiling_cents
          reserved_amount_cents = award_cents      # then calculations.program_budget_reservation runs
      if variant == FINAL:
          basis_kwh_final    = basis_kwh
          final_amount_cents = min(award_cents, reserved_amount_cents)   # reservation is a ceiling
    input_set: |
      Sibling claims of the SAME battery_system_id only; claims in VOID, DENIED or CLAWED_BACK are
      excluded from both `involved_programs` and `prior_committed_cents`. The FINAL variant re-reads the
      sibling set at commissioning time, so a claim voided between reservation and commissioning frees
      headroom for the survivors.
    constants:
      EXPORT_MULTIPLIER_BP: { NON_EXPORT: 7500, LIMITED_EXPORT: 9000, FULL_EXPORT: 10000 }
    precision: |
      Integer cents. Exactly one rounding step per claim per variant: the tier subtotals are summed
      unrounded, multiplied by the export multiplier, and only that product is rounded (round_half_up).
      Rounding each tier subtotal separately, or rounding before the multiplier, is WRONG and can differ
      by one cent. The stacking-cap comparison uses the rounded, capped per-claim values.
    variants:
      - name: RESERVED
        when: "at reservation time (POST /rebate-claims), before the bank is commissioned"
        difference: "basis_kwh is the design usable_kwh; writes reserved_amount_cents and encumbers the program pool."
      - name: FINAL
        when: "at commissioning, once verified_capacity_kwh is known"
        difference: "basis_kwh is min(usable_kwh, verified_capacity_kwh) and the result is clamped to reserved_amount_cents, so a bank that under-delivers on the capacity discharge test yields a strictly smaller award than the reservation and releases the difference back to the pool."

  - name: program_budget_reservation
    trigger: "POST /rebate-claims, immediately after calculations.rebate_award variant RESERVED produces reserved_amount_cents"
    algorithm: aggregation
    entity_domain: IncentiveProgram
    formula: |
      if program.remaining_budget_cents >= reserved_amount_cents:      # >= : exact equality succeeds
          program.remaining_budget_cents -= reserved_amount_cents
          program.reserved_budget_cents  += reserved_amount_cents
      else:
          reject with ERR_PROGRAM_BUDGET_EXHAUSTED
      # ledger invariant, checked after every claim transition:
      # total_budget_cents == remaining_budget_cents + reserved_budget_cents + paid_budget_cents
    input_set: "The single IncentiveProgram named by program_id; no other program's balances participate."
    constants: {}
    precision: "Integer cents; no rounding — every ledger move is an exact integer transfer between the three buckets."
    variants: []

  - name: byod_settlement
    trigger: "Steps 1a-1c on POST /dispatch-performances/{performanceId}/report-delivery; steps 2-7 on POST /dispatch-events/{eventId}/settle, per performance in created_at ASC"
    algorithm: weighted_scoring
    entity_domain: DispatchPerformance
    formula: |
      # --- step 1 (at delivery report) -------------------------------------------------
      window_hours     = (window_end - window_start) in hours, exact decimal
      avg_delivered_kw = round_half_up(delivered_kwh / window_hours, 2)          # 1a
      credited_kw      = min(avg_delivered_kw, pledged_kw_snapshot)              # 1b
      performance_ratio = round_half_up(avg_delivered_kw / pledged_kw_snapshot, 4)   # 1c

      # --- step 2 (at settlement): gross, one rounding after the multiplier ------------
      event_mult_bp       = EMERGENCY_MULTIPLIER_BP if event_type == EMERGENCY else 10000
      gross_payment_cents = round_half_up(
          credited_kw * event.payment_rate_cents_per_kw * event_mult_bp / 10000, 0)

      # --- step 3: shortfall penalty (strict < boundary) -------------------------------
      if performance_ratio < SHORTFALL_RATIO_FLOOR:
          shortfall_penalty_cents = round_half_up(
              (pledged_kw_snapshot * SHORTFALL_RATIO_FLOOR - avg_delivered_kw)
              * event.payment_rate_cents_per_kw * PENALTY_FACTOR, 0)
      else:
          shortfall_penalty_cents = 0

      # --- step 4: advance the enrollment accumulators BEFORE choosing the bonus tier --
      enrollment.cumulative_credited_kw += credited_kw
      enrollment.cumulative_pledged_kw  += pledged_kw_snapshot
      enrollment.season_compliance_ratio = round_half_up(
          enrollment.cumulative_credited_kw / enrollment.cumulative_pledged_kw, 4)

      # --- step 5: bonus tier read from the POST-update ratio (pinned evaluation order) -
      if   enrollment.season_compliance_ratio >= BONUS_TIER_HIGH_RATIO:  bonus_bp = BONUS_HIGH_BP
      elif enrollment.season_compliance_ratio >= BONUS_TIER_MID_RATIO:   bonus_bp = BONUS_MID_BP
      else:                                                              bonus_bp = 0
      bonus_cents = round_half_up(gross_payment_cents * bonus_bp / 10000, 0)

      # --- step 6: net, floored at zero ----------------------------------------------
      net_payment_cents = max(0, gross_payment_cents - shortfall_penalty_cents + bonus_cents)

      # --- step 7: roll up ------------------------------------------------------------
      enrollment.settled_event_count += 1
      enrollment.performance_payment_cents_total += net_payment_cents
      event.total_net_payment_cents += net_payment_cents
    input_set: |
      Only this event's performances with status == REPORTED are settled; CANCELLED performances are
      skipped entirely and contribute nothing to the enrollment accumulators or the event total. The
      enrollment accumulators span every SETTLED performance of that enrollment across all events in the
      season, ordered by settlement time.
    constants:
      EMERGENCY_MULTIPLIER_BP: 12500
      SHORTFALL_RATIO_FLOOR: 0.80
      PENALTY_FACTOR: 0.50
      BONUS_TIER_HIGH_RATIO: 0.95
      BONUS_HIGH_BP: 1000
      BONUS_TIER_MID_RATIO: 0.85
      BONUS_MID_BP: 500
    precision: |
      kW to 2 decimals, ratios to 4 decimals, money in integer cents, all round_half_up. The evaluation
      order of steps 4 and 5 is normative and non-negotiable: the bonus tier is selected from the
      season_compliance_ratio that ALREADY includes the event being settled. Reading the tier from the
      pre-event ratio is a different (wrong) number.
    variants: []

  - name: warranty_registration_grace
    trigger: "POST /battery-systems/{batterySystemId}/register-warranty"
    algorithm: threshold
    entity_domain: BatterySystem
    formula: |
      deadline = commissioned_at + WARRANTY_REGISTRATION_GRACE_DAYS days
      if current_utc <= deadline:            # inclusive: landing exactly on the deadline is on time
          warranty_status  := ACTIVE
      else:
          warranty_status  := VOID
          InstallerAccount(installer_id).late_warranty_registration_count += 1
      warranty_registered_at := current_utc
      warranty_coverage_years := coverage_years
      serial_numbers := supplied serials (length must equal unit_count)
    input_set: "The single BatterySystem; commissioned_at must be non-null (build_status == COMMISSIONED)."
    constants:
      WARRANTY_REGISTRATION_GRACE_DAYS: 30
    precision: "Millisecond-resolution comparison against the logical clock; the boundary is inclusive (<=)."
    variants: []

  - name: commissioning_verdict
    trigger: "POST /commissioning-tests/{testId}/record-result"
    algorithm: threshold
    entity_domain: CommissioningTest
    formula: |
      if test_type == BACKUP_TRANSITION:
          result = PASS if transition_ms <= MAX_TRANSITION_MS else FAIL
      if test_type == ANTI_ISLANDING:
          result = PASS if anti_islanding_trip_ms <= MAX_ANTI_ISLANDING_MS else FAIL
      if test_type == CAPACITY_DISCHARGE:
          result = PASS if delivered_kwh >= CAPACITY_PASS_FRACTION * BatterySystem.usable_kwh else FAIL
      if test_type == FIRMWARE_BASELINE:
          result = PASS if version_ge(reported_firmware_version,
                                      MODEL_CATALOG[BatterySystem.model_code].min_firmware) else FAIL
      status := RECORDED; recorded_at := current_utc
      # version_ge compares dotted integer components left to right, padding missing components with 0.
    input_set: "The single CommissioningTest plus its BatterySystem's usable_kwh and model_code."
    constants:
      MAX_TRANSITION_MS: 200
      MAX_ANTI_ISLANDING_MS: 2000
      CAPACITY_PASS_FRACTION: 0.90
    precision: "Integer milliseconds; kWh to 2 decimals; the capacity boundary is inclusive (>=)."
    variants: []

  - name: expansion_compatibility
    trigger: "POST /battery-systems/{batterySystemId}/expansions"
    algorithm: constraint_propagation
    entity_domain: BatterySystem
    formula: |
      base    = the system named in the path
      catalog = MODEL_CATALOG[base.model_code]
      # (1) inverter family must match the base gateway family
      if INVERTER_FAMILY[inverter_model] != INVERTER_FAMILY[base.inverter_model]:
          reject with ERR_INVERTER_INCOMPATIBLE
      # (2) firmware must be at least the base firmware AND the catalog minimum
      if not version_ge(firmware_version, base.firmware_version)
         or not version_ge(firmware_version, catalog.min_firmware):
          reject with ERR_FIRMWARE_TOO_OLD
      # (3) unit ceiling
      if base.unit_count + additional_unit_count > catalog.max_units:
          reject with ERR_UNIT_LIMIT_EXCEEDED
      # (4) the expanded bank inherits the sizing obligation
      new_unit_count   = base.unit_count + additional_unit_count
      new_usable_kwh   = round_half_up(new_unit_count * catalog.usable_kwh_per_unit, 2)
      new_continuous_kw = round_half_up(new_unit_count * catalog.continuous_kw_per_unit, 2)
      if new_continuous_kw < LoadCalculation(base.load_calculation_id).required_continuous_kw:
          reject with ERR_CAPACITY_BELOW_REQUIRED
    input_set: "The base BatterySystem, its LoadCalculation, and the MODEL_CATALOG / INVERTER_FAMILY constants."
    constants:
      MODEL_CATALOG:
        PWX_A: { usable_kwh_per_unit: 13.5, continuous_kw_per_unit: 5.0, max_units: 10, min_firmware: "24.4.0" }
        PWX_B: { usable_kwh_per_unit: 13.5, continuous_kw_per_unit: 11.5, max_units: 4, min_firmware: "25.2.0" }
        PWX_C: { usable_kwh_per_unit: 11.9, continuous_kw_per_unit: 4.6, max_units: 12, min_firmware: "24.4.0" }
      INVERTER_FAMILY: { GW2_HOME: GW2, GW3_HOME: GW3 }
      MODEL_INVERTER_FAMILY: { PWX_A: GW2, PWX_B: GW3, PWX_C: GW2 }
    precision: "kWh and kW to 2 decimals, round_half_up; firmware compared component-wise as integers."
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "The authenticated role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 25
    category: auth
    check: |
      Ownership for entity_backed roles. CertifiedInstaller: X-User-ID must equal the
      BatterySystem.installer_id (or the installer_id of the system reachable from the target
      LoadCalculation / Permit / InterconnectionApplication / RebateClaim / CommissioningTest /
      MonitoringAlert / ByodEnrollment). Homeowner: X-User-ID must equal Site.id (or the site_id
      of the system reachable from the target resource). Opaque roles are exempt.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints that name an existing resource in the path, except POST /_clock/set_current_utc"

  - priority: 30
    category: existence
    check: |
      Every referenced resource exists — path parameters first (left to right), then body foreign keys
      in the order they are listed in the endpoint's input. Each miss raises that entity's own 404.
    error_id: ERR_INSTALLER_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_LOAD_CALCULATION_NOT_FOUND | ERR_BATTERY_SYSTEM_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_ALERT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_PERFORMANCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters or FK inputs"

  - priority: 35
    category: business_constraint
    check: |
      Request shape: required input fields present and non-null, enums within their declared value sets,
      numbers non-negative, window_end strictly after window_start, essential_circuits non-empty when
      backup_scope == ESSENTIAL_LOADS, serial_numbers length equal to unit_count on register-warranty,
      firmware strings of the form <int>.<int>.<int>.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 40
    category: state
    check: |
      The target resource is in a state from which the requested transition is declared in §1.2. Includes
      the two independent BatterySystem dimensions: build_status errors raise ERR_SYSTEM_BUILD_STATE_INVALID,
      grid_status errors raise ERR_SYSTEM_GRID_STATE_INVALID.
    error_id: ERR_LOAD_CALC_STATE_INVALID | ERR_SYSTEM_BUILD_STATE_INVALID | ERR_SYSTEM_GRID_STATE_INVALID | ERR_PERMIT_STATE_INVALID | ERR_APPLICATION_STATE_INVALID | ERR_CLAIM_STATE_INVALID | ERR_ALERT_STATE_INVALID | ERR_ENROLLMENT_STATE_INVALID | ERR_EVENT_STATE_INVALID | ERR_PERFORMANCE_STATE_INVALID
    http_status: 409
    applies_to: "all action endpoints and all creates whose parent must be in a given state"

  - priority: 42
    category: state
    check: "Optimistic concurrency: the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_SYSTEM_VERSION | ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /rebate-claims, POST /battery-systems/{batterySystemId}/expansions, POST /dispatch-events/{eventId}/participations"

  - priority: 45
    category: business_safety
    check: |
      Segregation of duties. POST /interconnection-applications/{applicationId}/grant-pto: X-User-ID must
      differ from the application's reviewed_by_user_id. POST /rebate-claims/{claimId}/pay: X-User-ID must
      differ from the claim's approved_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /interconnection-applications/{applicationId}/grant-pto, POST /rebate-claims/{claimId}/pay"

  - priority: 50
    category: business_safety
    check: |
      Commissioning safety. POST /battery-systems/{batterySystemId}/commission requires that all four
      CommissioningTest types exist for the system with status RECORDED (else
      ERR_COMMISSIONING_TESTS_INCOMPLETE) and that every one of them has result == PASS — the
      BACKUP_TRANSITION test failing raises the specific ERR_BACKUP_TRANSITION_NOT_VERIFIED, any other
      failing test raises ERR_COMMISSIONING_TEST_FAILED.
    error_id: ERR_COMMISSIONING_TESTS_INCOMPLETE | ERR_BACKUP_TRANSITION_NOT_VERIFIED | ERR_COMMISSIONING_TEST_FAILED
    http_status: 422
    applies_to: "POST /battery-systems/{batterySystemId}/commission"

  - priority: 55
    category: business_referential
    check: |
      Certification and coverage prerequisites, evaluated in this order:
      (a) the acting installer's certification_status is ACTIVE, its certification covers the requested
          model_code, and certification_expires_on is on or after the current logical date
          -> ERR_INSTALLER_NOT_CERTIFIED;
      (b) the LoadCalculation named by load_calculation_id is APPROVED and belongs to the same site
          -> ERR_LOAD_CALC_NOT_APPROVED;
      (c) the system's continuous_kw is at least the calculation's required_continuous_kw
          -> ERR_CAPACITY_BELOW_REQUIRED;
      (d) warranty claim filing requires warranty_status == ACTIVE -> ERR_WARRANTY_NOT_ACTIVE.
    error_id: ERR_INSTALLER_NOT_CERTIFIED | ERR_LOAD_CALC_NOT_APPROVED | ERR_CAPACITY_BELOW_REQUIRED | ERR_WARRANTY_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /battery-systems, POST /battery-systems/{batterySystemId}/lock-design, POST /battery-systems/{batterySystemId}/expansions, POST /monitoring-alerts/{alertId}/file-claim"

  - priority: 58
    category: business_referential
    check: |
      Cross-entity workflow gating:
      (a) POST /interconnection-applications/{applicationId}/grant-pto requires the system's Permit to be
          in INSPECTION_PASSED -> ERR_PERMIT_NOT_PASSED;
      (b) POST /byod-enrollments requires the system's grid_status == PTO_GRANTED and build_status ==
          COMMISSIONED -> ERR_ENROLLMENT_REQUIRES_PTO;
      (c) POST /rebate-claims requires the system's build_status IN {DESIGN_LOCKED, INSTALLED} and
          grid_status IN {APPROVED_TO_INSTALL, PTO_GRANTED} -> ERR_SYSTEM_GRID_STATE_INVALID.
    error_id: ERR_PERMIT_NOT_PASSED | ERR_ENROLLMENT_REQUIRES_PTO
    http_status: 422
    applies_to: "POST /interconnection-applications/{applicationId}/grant-pto, POST /byod-enrollments, POST /rebate-claims"

  - priority: 60
    category: business_temporal
    check: |
      Temporal and overlap constraints, in this order:
      (a) the system's Permit has not passed its expires_on at the moment of commissioning
          -> ERR_PERMIT_EXPIRED;
      (b) a new CommissioningTest window must not overlap, after padding both sides by
          COMMISSIONING_TRAVEL_BUFFER_MIN (30) minutes, any other non-cancelled CommissioningTest window
          of the same installer; windows are half-open [start, end) and abutting windows separated by at
          least the buffer are allowed -> ERR_TEST_WINDOW_CONFLICT;
      (c) a new DispatchEvent's [window_start, window_end) must not push the sum of target_kw over
          TERRITORY_DISPATCH_CAP_KW (1500) for any instant in its territory_code; the interval is
          half-open with no buffer, so an event starting exactly when another ends never conflicts
          -> ERR_TERRITORY_CAPACITY_EXCEEDED.
    error_id: ERR_PERMIT_EXPIRED | ERR_TEST_WINDOW_CONFLICT | ERR_TERRITORY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /battery-systems/{batterySystemId}/commission, POST /commissioning-tests, POST /dispatch-events"

  - priority: 65
    category: business_constraint
    check: |
      Uniqueness and cardinality guards: at most one non-terminal Permit per system
      (ERR_DUPLICATE_PERMIT); at most one non-DENIED InterconnectionApplication per system
      (ERR_DUPLICATE_APPLICATION); at most one non-VOID/non-DENIED RebateClaim per
      (battery_system_id, program_id) pair (ERR_DUPLICATE_PROGRAM_CLAIM); at most one
      CommissioningTest per (battery_system_id, test_type) (ERR_DUPLICATE_TEST); at most one
      non-WITHDRAWN ByodEnrollment per (battery_system_id, season) (ERR_DUPLICATE_ENROLLMENT); at
      most one DispatchPerformance per (dispatch_event_id, byod_enrollment_id)
      (ERR_PARTICIPATION_DUPLICATE); Permit correction_round_count must be below
      PERMIT_MAX_CORRECTION_ROUNDS (3) to request further corrections
      (ERR_PERMIT_CORRECTION_LIMIT).
    error_id: ERR_DUPLICATE_PERMIT | ERR_DUPLICATE_APPLICATION | ERR_DUPLICATE_PROGRAM_CLAIM | ERR_DUPLICATE_TEST | ERR_DUPLICATE_ENROLLMENT | ERR_PARTICIPATION_DUPLICATE | ERR_PERMIT_CORRECTION_LIMIT
    http_status: 409
    applies_to: "POST /permits, POST /permits/{permitId}/review, POST /interconnection-applications, POST /rebate-claims, POST /commissioning-tests, POST /byod-enrollments, POST /dispatch-events/{eventId}/participations"

  - priority: 68
    category: business_constraint
    check: |
      Incentive and program commitments, in this order:
      (a) the program's requires_export_commitment implies export_commitment != NON_EXPORT and the
          system's InterconnectionApplication.export_mode is not NON_EXPORT
          -> ERR_EXPORT_COMMITMENT_REQUIRED;
      (b) capacity_commitment_kw must be at least the program's min_capacity_commitment_kw and at most
          the system's continuous_kw -> ERR_CAPACITY_COMMITMENT_INVALID;
      (c) the stacking headroom computed by calculations.rebate_award must be strictly positive
          -> ERR_STACK_CAP_EXCEEDED;
      (d) expansion compatibility per calculations.expansion_compatibility
          -> ERR_INVERTER_INCOMPATIBLE, then ERR_FIRMWARE_TOO_OLD, then ERR_UNIT_LIMIT_EXCEEDED;
      (e) a ByodEnrollment's pledged_kw must not exceed the system's continuous_kw and reserve_soc_pct
          must be between 0 and 50 inclusive -> ERR_PLEDGE_EXCEEDS_CAPACITY.
    error_id: ERR_EXPORT_COMMITMENT_REQUIRED | ERR_CAPACITY_COMMITMENT_INVALID | ERR_STACK_CAP_EXCEEDED | ERR_INVERTER_INCOMPATIBLE | ERR_FIRMWARE_TOO_OLD | ERR_UNIT_LIMIT_EXCEEDED | ERR_PLEDGE_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /rebate-claims, POST /battery-systems/{batterySystemId}/expansions, POST /byod-enrollments"

  - priority: 70
    category: business_fiscal
    check: |
      Fiscal capacity, evaluated last so that every state, referential, temporal and constraint objection
      is reported in preference to a budget objection: the program's remaining_budget_cents must be at
      least the reservation produced by calculations.rebate_award (equality passes).
    error_id: ERR_PROGRAM_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /rebate-claims"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# All collections live at the root; every FK has a filtered-list reverse GET.
# ---------------------------------------------------------------------------
endpoints:
  # --- InstallerAccount -----------------------------------------------------
  - method: POST
    path: "/installers"
    description: "Register a manufacturer-certified installer company. Certification level, covered model codes and expiry are issued by the manufacturer."
    roles: [ManufacturerWarrantyAgent]
    code: 201
    input: [company_name, certification_level, certified_model_codes, certification_expires_on]
    output: InstallerAccount
    side_effects: ["certification_status := ACTIVE", "clawback_count := 0", "late_warranty_registration_count := 0", "commissioned_system_count := 0"]

  - method: GET
    path: "/installers/{installerId}"
    description: "Read one installer account, including its certification and compliance counters."
    roles: [ManufacturerWarrantyAgent, CertifiedInstaller, RebateAdministrator, UtilityInterconnectionReviewer, AuthorityHavingJurisdiction]
    code: 200
    input: []
    output: InstallerAccount
    side_effects: []

  - method: POST
    path: "/installers/{installerId}/certification"
    description: "Manufacturer amends an installer's certification — renew the expiry, change the level, change the covered model codes, or set certification_status back to ACTIVE after a suspension."
    roles: [ManufacturerWarrantyAgent]
    code: 200
    input: ["certification_level?", "certified_model_codes?", "certification_expires_on?", "certification_status?"]
    output: InstallerAccount
    side_effects: ["only the supplied fields are replaced", "increments InstallerAccount.version by 1"]

  # --- Site -----------------------------------------------------------------
  - method: POST
    path: "/sites"
    description: "Create the premises record for a prospective installation. The site id doubles as the Homeowner role's X-User-ID."
    roles: [CertifiedInstaller]
    code: 201
    input: [homeowner_name, utility_territory_code, service_panel_amps, floor_area_sqft, postal_code, "existing_pv_kw_dc?"]
    output: Site
    side_effects: []

  - method: GET
    path: "/sites/{siteId}"
    description: "Read one site."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer, RebateAdministrator]
    code: 200
    input: []
    output: Site
    side_effects: []

  # --- LoadCalculation ------------------------------------------------------
  - method: POST
    path: "/load-calculations"
    description: "Create a load calculation and backup-scope design for a site. Runs calculations.load_sizing immediately, so the computed kW fields are present in the 201 response."
    roles: [CertifiedInstaller]
    code: 201
    input: [site_id, method, backup_scope, lighting_area_sqft, appliance_load_va, heating_va, cooling_va, "measured_peak_kw?", "essential_circuits?"]
    output: LoadCalculation
    side_effects: ["status := DRAFT", "revision_round_count := 0", "runs calculations.load_sizing to set connected_load_kw, required_continuous_kw, required_surge_kw"]

  - method: GET
    path: "/load-calculations/{loadCalculationId}"
    description: "Read one load calculation with its computed sizing figures."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer]
    code: 200
    input: []
    output: LoadCalculation
    side_effects: []

  - method: GET
    path: "/load-calculations"
    description: "List load calculations, optionally filtered by site or status. Reverse-reachability GET for LoadCalculation.site_id."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: LoadCalculation[]
    side_effects: []

  - method: POST
    path: "/load-calculations/{loadCalculationId}/submit"
    description: "Submit a DRAFT calculation, or resubmit one in REVISION_REQUIRED. Any input field supplied replaces the stored value before the sizing formula re-runs; omitting them all resubmits the calculation unchanged."
    roles: [CertifiedInstaller]
    code: 200
    input: ["method?", "backup_scope?", "lighting_area_sqft?", "appliance_load_va?", "heating_va?", "cooling_va?", "measured_peak_kw?", "essential_circuits?"]
    output: LoadCalculation
    side_effects: ["status := SUBMITTED", "re-runs calculations.load_sizing", "increments revision_round_count by 1 when resubmitting from REVISION_REQUIRED", "increments LoadCalculation.version by 1"]

  - method: POST
    path: "/load-calculations/{loadCalculationId}/review"
    description: "Authority review of a submitted calculation: APPROVE freezes it (terminal), REQUEST_REVISION sends it back to the installer."
    roles: [AuthorityHavingJurisdiction]
    code: 200
    input: [decision, "reviewer_notes?"]
    output: LoadCalculation
    side_effects: ["status := APPROVED or REVISION_REQUIRED", "reviewer_notes := supplied notes", "increments LoadCalculation.version by 1"]

  # --- BatterySystem --------------------------------------------------------
  - method: POST
    path: "/battery-systems"
    description: "Create a battery bank design against an APPROVED load calculation. usable_kwh and continuous_kw are derived from the model catalog and unit_count; the caller cannot set them."
    roles: [CertifiedInstaller]
    code: 201
    input: [site_id, installer_id, load_calculation_id, model_code, unit_count, inverter_model, firmware_version, installed_cost_cents]
    output: BatterySystem
    side_effects: ["build_status := DESIGN_DRAFT", "grid_status := NOT_APPLIED", "warranty_status := UNREGISTERED", "usable_kwh and continuous_kw derived from MODEL_CATALOG * unit_count", "verified_capacity_kwh := null"]

  - method: GET
    path: "/battery-systems/{batterySystemId}"
    description: "Read one battery system, including both independent status dimensions and its version (needed for the OCC-guarded writes)."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer, RebateAdministrator, ManufacturerWarrantyAgent]
    code: 200
    input: []
    output: BatterySystem
    side_effects: []

  - method: GET
    path: "/battery-systems"
    description: "List battery systems with optional filters. Reverse-reachability GET for BatterySystem.site_id, BatterySystem.installer_id, BatterySystem.load_calculation_id and the self-referential BatterySystem.expands_system_id."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer, RebateAdministrator, ManufacturerWarrantyAgent]
    code: 200
    input: ["site_id?", "installer_id?", "load_calculation_id?", "expands_system_id?", "build_status?", "grid_status?", "limit?", "offset?"]
    output: BatterySystem[]
    side_effects: []

  - method: POST
    path: "/battery-systems/{batterySystemId}/lock-design"
    description: "Freeze the design so permitting and interconnection can proceed. Requires the linked load calculation to be APPROVED and the bank's continuous_kw to meet its required_continuous_kw."
    roles: [CertifiedInstaller]
    code: 200
    input: []
    output: BatterySystem
    side_effects: ["build_status := DESIGN_LOCKED", "increments BatterySystem.version by 1"]

  - method: POST
    path: "/battery-systems/{batterySystemId}/mark-installed"
    description: "Record physical installation completion. Requires the permit to be ISSUED and the interconnection application to be APPROVED_TO_INSTALL."
    roles: [CertifiedInstaller]
    code: 200
    input: []
    output: BatterySystem
    side_effects: ["build_status := INSTALLED", "increments BatterySystem.version by 1"]

  - method: POST
    path: "/battery-systems/{batterySystemId}/commission"
    description: "Commission the bank. Head of CASCADE-B: sets verified_capacity_kwh from the CAPACITY_DISCHARGE test, re-runs every RESERVED rebate claim's award under the FINAL variant, releases the freed reservation back to each program pool, opens the 30-day warranty-registration window, and bumps the installer's commissioned_system_count."
    roles: [CertifiedInstaller]
    code: 200
    input: []
    output: BatterySystem
    side_effects: ["build_status := COMMISSIONED", "commissioned_at := current_utc", "warranty_deadline_at := commissioned_at + 30 days", "verified_capacity_kwh := CAPACITY_DISCHARGE test delivered_kwh", "CASCADE-B: re-runs calculations.rebate_award FINAL for every RESERVED claim and adjusts IncentiveProgram ledgers", "InstallerAccount.commissioned_system_count += 1", "increments BatterySystem.version by 1"]

  - method: POST
    path: "/battery-systems/{batterySystemId}/register-warranty"
    description: "Register the manufacturer warranty for a commissioned bank. Landing exactly on warranty_deadline_at is on time; later registrations void coverage and count against the installer."
    roles: [CertifiedInstaller]
    code: 200
    input: [coverage_years, serial_numbers]
    output: BatterySystem
    side_effects: ["runs calculations.warranty_registration_grace to set warranty_status ACTIVE or VOID", "warranty_registered_at := current_utc", "InstallerAccount.late_warranty_registration_count += 1 when late", "increments BatterySystem.version by 1"]

  - method: POST
    path: "/battery-systems/{batterySystemId}/expansions"
    description: "Add units to a commissioned bank. Creates a NEW BatterySystem whose expands_system_id points at the base bank and supersedes the base (CASCADE-C). OCC-guarded on the base system's version."
    roles: [CertifiedInstaller]
    code: 201
    input: [additional_unit_count, inverter_model, firmware_version, installed_cost_cents, expected_battery_system_version]
    output: BatterySystem
    side_effects: ["runs calculations.expansion_compatibility", "creates a BatterySystem with expands_system_id := base id, build_status := DESIGN_DRAFT, grid_status := NOT_APPLIED, warranty_status := UNREGISTERED", "CASCADE-C: base build_status := SUPERSEDED, base ByodEnrollment(s) := SUSPENDED, base PENDING DispatchPerformance(s) := CANCELLED with the event capacity ledger restored", "increments the base BatterySystem.version by 1"]

  # --- Permit ---------------------------------------------------------------
  - method: POST
    path: "/permits"
    description: "Open a building/electrical permit application for a design-locked system."
    roles: [CertifiedInstaller]
    code: 201
    input: [battery_system_id, jurisdiction_code, plan_set_ref]
    output: Permit
    side_effects: ["status := DRAFT", "correction_round_count := 0"]

  - method: GET
    path: "/permits/{permitId}"
    description: "Read one permit including its correction round count and inspection findings."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/permits"
    description: "List permits, optionally filtered. Reverse-reachability GET for Permit.battery_system_id."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer]
    code: 200
    input: ["battery_system_id?", "jurisdiction_code?", "status?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/permits/{permitId}/submit"
    description: "Submit a DRAFT permit, or resubmit one in CORRECTIONS_REQUIRED with an updated plan set."
    roles: [CertifiedInstaller]
    code: 200
    input: ["plan_set_ref?"]
    output: Permit
    side_effects: ["status := SUBMITTED", "plan_set_ref replaced when supplied", "increments Permit.version by 1"]

  - method: POST
    path: "/permits/{permitId}/review"
    description: "Jurisdiction review: ISSUE stamps the permit and starts its validity window, REQUEST_CORRECTIONS returns it to the installer (at most PERMIT_MAX_CORRECTION_ROUNDS times)."
    roles: [AuthorityHavingJurisdiction]
    code: 200
    input: [decision, "expires_on?", "inspection_findings?"]
    output: Permit
    side_effects: ["status := ISSUED (issued_at := current_utc, expires_on := supplied date) or CORRECTIONS_REQUIRED (correction_round_count += 1)", "increments Permit.version by 1"]

  - method: POST
    path: "/permits/{permitId}/inspection-result"
    description: "Record a field-inspection outcome. FAIL from INSPECTION_PASSED is the head of CASCADE-A: it revokes interconnection approval/PTO, suspends BYOD enrollment and cancels that enrollment's pending dispatch performances."
    roles: [AuthorityHavingJurisdiction]
    code: 200
    input: [result, "inspection_findings?"]
    output: Permit
    side_effects: ["status := INSPECTION_PASSED or INSPECTION_FAILED", "CASCADE-A on FAIL from INSPECTION_PASSED: InterconnectionApplication := SUPPLEMENTAL_REVIEW, BatterySystem.grid_status := APPLICATION_SUBMITTED, ByodEnrollment := SUSPENDED, PENDING DispatchPerformance := CANCELLED with the event capacity ledger restored", "increments Permit.version by 1"]

  # --- InterconnectionApplication -------------------------------------------
  - method: POST
    path: "/interconnection-applications"
    description: "File the utility interconnection application for a design-locked system, declaring the requested export mode and kW."
    roles: [CertifiedInstaller]
    code: 201
    input: [battery_system_id, export_mode, requested_export_kw]
    output: InterconnectionApplication
    side_effects: ["status := DRAFT", "supplemental_round_count := 0"]

  - method: GET
    path: "/interconnection-applications/{applicationId}"
    description: "Read one interconnection application, including reviewed_by_user_id and pto_granted_by_user_id (the two identities the segregation-of-duties rule compares)."
    roles: [CertifiedInstaller, Homeowner, UtilityInterconnectionReviewer, AuthorityHavingJurisdiction, RebateAdministrator]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: []

  - method: GET
    path: "/interconnection-applications"
    description: "List interconnection applications. Reverse-reachability GET for InterconnectionApplication.battery_system_id."
    roles: [CertifiedInstaller, Homeowner, UtilityInterconnectionReviewer, AuthorityHavingJurisdiction, RebateAdministrator]
    code: 200
    input: ["battery_system_id?", "status?", "export_mode?", "limit?", "offset?"]
    output: InterconnectionApplication[]
    side_effects: []

  - method: POST
    path: "/interconnection-applications/{applicationId}/submit"
    description: "Submit a DRAFT application, or respond to a supplemental-review request. Also advances the system's grid_status dimension."
    roles: [CertifiedInstaller]
    code: 200
    input: ["requested_export_kw?", "export_mode?"]
    output: InterconnectionApplication
    side_effects: ["status := SUBMITTED", "supplemental_round_count += 1 when responding from SUPPLEMENTAL_REVIEW", "BatterySystem.grid_status := APPLICATION_SUBMITTED", "increments InterconnectionApplication.version by 1"]

  - method: POST
    path: "/interconnection-applications/{applicationId}/review"
    description: "Utility review: APPROVE_TO_INSTALL (optionally derating the approved export kW), REQUEST_SUPPLEMENTAL, or DENY. Records the reviewing operator id used by the segregation-of-duties rule."
    roles: [UtilityInterconnectionReviewer]
    code: 200
    input: [decision, "approved_export_kw?"]
    output: InterconnectionApplication
    side_effects: ["status := APPROVED_TO_INSTALL | SUPPLEMENTAL_REVIEW | DENIED", "reviewed_by_user_id := X-User-ID", "approved_export_kw := supplied value (defaults to requested_export_kw on approval)", "BatterySystem.grid_status mirrors the decision", "increments InterconnectionApplication.version by 1"]

  - method: POST
    path: "/interconnection-applications/{applicationId}/grant-pto"
    description: "Grant permission to operate. Requires the system's permit to be INSPECTION_PASSED and a different operator than the one who approved the application."
    roles: [UtilityInterconnectionReviewer]
    code: 200
    input: []
    output: InterconnectionApplication
    side_effects: ["status := PTO_GRANTED", "pto_granted_by_user_id := X-User-ID", "pto_granted_at := current_utc", "BatterySystem.grid_status := PTO_GRANTED", "increments InterconnectionApplication.version by 1"]

  # --- IncentiveProgram -----------------------------------------------------
  - method: POST
    path: "/incentive-programs"
    description: "Create a funded incentive program with its two-tier energy rates, per-project cap, stacking priority and stacking ceiling in basis points of installed cost."
    roles: [RebateAdministrator]
    code: 201
    input: [name, program_type, total_budget_cents, tier1_limit_kwh, tier1_rate_cents_per_kwh, tier2_rate_cents_per_kwh, per_project_cap_cents, stack_priority, max_stack_pct_of_cost_bp, requires_export_commitment, min_capacity_commitment_kw]
    output: IncentiveProgram
    side_effects: ["remaining_budget_cents := total_budget_cents", "reserved_budget_cents := 0", "paid_budget_cents := 0"]

  - method: GET
    path: "/incentive-programs/{programId}"
    description: "Read one incentive program with its three-bucket cents ledger (remaining + reserved + paid always equals total)."
    roles: [RebateAdministrator, CertifiedInstaller, Homeowner, UtilityInterconnectionReviewer]
    code: 200
    input: []
    output: IncentiveProgram
    side_effects: []

  - method: GET
    path: "/incentive-programs"
    description: "List incentive programs."
    roles: [RebateAdministrator, CertifiedInstaller, Homeowner, UtilityInterconnectionReviewer]
    code: 200
    input: ["program_type?", "limit?", "offset?"]
    output: IncentiveProgram[]
    side_effects: []

  # --- RebateClaim ----------------------------------------------------------
  - method: POST
    path: "/rebate-claims"
    description: "Reserve an incentive for a system under one program, committing to a dispatchable capacity and an export posture. Runs the RESERVED award variant, applies the cross-program stacking waterfall, and encumbers the program pool. OCC-guarded on the battery system's version."
    roles: [CertifiedInstaller]
    code: 201
    input: [battery_system_id, program_id, capacity_commitment_kw, export_commitment, expected_battery_system_version]
    output: RebateClaim
    side_effects: ["status := RESERVED", "runs calculations.rebate_award variant RESERVED to set basis_kwh_reserved, stack_ceiling_cents, reserved_amount_cents", "runs calculations.program_budget_reservation (remaining -= award, reserved += award)", "increments BatterySystem.version by 1"]

  - method: GET
    path: "/rebate-claims/{claimId}"
    description: "Read one rebate claim, including both award variants and the approver/payer identities."
    roles: [RebateAdministrator, CertifiedInstaller, Homeowner]
    code: 200
    input: []
    output: RebateClaim
    side_effects: []

  - method: GET
    path: "/rebate-claims"
    description: "List rebate claims. Reverse-reachability GET for RebateClaim.battery_system_id and RebateClaim.program_id."
    roles: [RebateAdministrator, CertifiedInstaller, Homeowner]
    code: 200
    input: ["battery_system_id?", "program_id?", "status?", "limit?", "offset?"]
    output: RebateClaim[]
    side_effects: []

  - method: POST
    path: "/rebate-claims/{claimId}/submit"
    description: "Submit a reserved claim for administrator adjudication. Requires the system to be COMMISSIONED so the FINAL award has been computed."
    roles: [CertifiedInstaller]
    code: 200
    input: []
    output: RebateClaim
    side_effects: ["status := SUBMITTED", "increments RebateClaim.version by 1"]

  - method: POST
    path: "/rebate-claims/{claimId}/decision"
    description: "Administrator approves or denies a submitted claim. Denial releases the whole encumbrance back to the program's remaining budget."
    roles: [RebateAdministrator]
    code: 200
    input: [decision]
    output: RebateClaim
    side_effects: ["status := APPROVED (approved_by_user_id := X-User-ID) or DENIED (program reserved -= hold, remaining += hold)", "increments RebateClaim.version by 1"]

  - method: POST
    path: "/rebate-claims/{claimId}/pay"
    description: "Disburse an approved claim. Must be performed by an operator other than the approver; moves the encumbrance from reserved to paid."
    roles: [RebateAdministrator]
    code: 200
    input: []
    output: RebateClaim
    side_effects: ["status := PAID", "paid_by_user_id := X-User-ID", "paid_at := current_utc", "IncentiveProgram: reserved -= final_amount_cents, paid += final_amount_cents", "increments RebateClaim.version by 1"]

  - method: POST
    path: "/rebate-claims/{claimId}/clawback"
    description: "Reverse a paid claim. Head of CASCADE-D: restores the program pool, counts the clawback against the installer and suspends the installer's certification at the threshold, which in turn puts that installer's un-installed designs on hold."
    roles: [RebateAdministrator]
    code: 200
    input: [clawback_reason]
    output: RebateClaim
    side_effects: ["status := CLAWED_BACK", "IncentiveProgram: paid -= final_amount_cents, remaining += final_amount_cents", "InstallerAccount.clawback_count += 1", "CASCADE-D: at CLAWBACK_SUSPENSION_THRESHOLD the installer's certification_status := SUSPENDED and each of that installer's DESIGN_DRAFT/DESIGN_LOCKED systems moves to DESIGN_HOLD", "increments RebateClaim.version by 1"]

  - method: POST
    path: "/rebate-claims/{claimId}/void"
    description: "Withdraw a reservation before submission — the compensating action for the program ledger. Releases the exact reserved amount and frees stacking headroom for sibling claims."
    roles: [CertifiedInstaller]
    code: 200
    input: [reason]
    output: RebateClaim
    side_effects: ["status := VOID", "clawback_reason := reason (reused as the release audit note)", "IncentiveProgram: reserved -= reserved_amount_cents, remaining += reserved_amount_cents", "increments RebateClaim.version by 1"]

  # --- CommissioningTest ----------------------------------------------------
  - method: POST
    path: "/commissioning-tests"
    description: "Schedule one of the four required commissioning tests in a half-open [window_start, window_end) slot. The acting installer's other test windows are padded by COMMISSIONING_TRAVEL_BUFFER_MIN minutes on both sides before the overlap check."
    roles: [CertifiedInstaller]
    code: 201
    input: [battery_system_id, test_type, window_start, window_end]
    output: CommissioningTest
    side_effects: ["status := SCHEDULED", "result := PENDING"]

  - method: GET
    path: "/commissioning-tests/{testId}"
    description: "Read one commissioning test with its measured figures and verdict."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer, ManufacturerWarrantyAgent]
    code: 200
    input: []
    output: CommissioningTest
    side_effects: []

  - method: GET
    path: "/commissioning-tests"
    description: "List commissioning tests. Reverse-reachability GET for CommissioningTest.battery_system_id."
    roles: [CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer, ManufacturerWarrantyAgent]
    code: 200
    input: ["battery_system_id?", "test_type?", "status?", "result?", "limit?", "offset?"]
    output: CommissioningTest[]
    side_effects: []

  - method: POST
    path: "/commissioning-tests/{testId}/record-result"
    description: "Record the measured figures for a scheduled test. The PASS/FAIL verdict is computed by calculations.commissioning_verdict from the field relevant to the test_type; a caller-supplied verdict would be ignored, so none is accepted."
    roles: [CertifiedInstaller]
    code: 200
    input: ["transition_ms?", "delivered_kwh?", "anti_islanding_trip_ms?", "reported_firmware_version?"]
    output: CommissioningTest
    side_effects: ["status := RECORDED", "recorded_at := current_utc", "result := PASS or FAIL per calculations.commissioning_verdict", "increments CommissioningTest.version by 1"]

  # --- MonitoringAlert / warranty claim -------------------------------------
  - method: POST
    path: "/monitoring-alerts"
    description: "Raise a fleet-monitoring alert against a battery system (firmware update failure, cell imbalance, gateway offline, thermal derate)."
    roles: [ManufacturerWarrantyAgent, CertifiedInstaller]
    code: 201
    input: [battery_system_id, alert_code, severity, "reported_firmware_version?"]
    output: MonitoringAlert
    side_effects: ["status := OPEN", "claim_round_count := 0"]

  - method: GET
    path: "/monitoring-alerts/{alertId}"
    description: "Read one monitoring alert and its warranty-claim lifecycle state."
    roles: [ManufacturerWarrantyAgent, CertifiedInstaller, Homeowner]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: []

  - method: GET
    path: "/monitoring-alerts"
    description: "List monitoring alerts. Reverse-reachability GET for MonitoringAlert.battery_system_id."
    roles: [ManufacturerWarrantyAgent, CertifiedInstaller, Homeowner]
    code: 200
    input: ["battery_system_id?", "alert_code?", "severity?", "status?", "limit?", "offset?"]
    output: MonitoringAlert[]
    side_effects: []

  - method: POST
    path: "/monitoring-alerts/{alertId}/acknowledge"
    description: "Installer acknowledges an open alert and takes ownership of triage."
    roles: [CertifiedInstaller]
    code: 200
    input: []
    output: MonitoringAlert
    side_effects: ["status := ACKNOWLEDGED", "acknowledged_by_user_id := X-User-ID", "increments MonitoringAlert.version by 1"]

  - method: POST
    path: "/monitoring-alerts/{alertId}/file-claim"
    description: "File (or re-file after an information request) a warranty claim for the acknowledged alert. Requires the system's warranty_status to be ACTIVE."
    roles: [CertifiedInstaller]
    code: 200
    input: [claimed_component, "resolution_notes?"]
    output: MonitoringAlert
    side_effects: ["status := UNDER_REVIEW", "claimed_component := supplied component", "claim_round_count += 1 when re-filing from INFO_REQUESTED", "increments MonitoringAlert.version by 1"]

  - method: POST
    path: "/monitoring-alerts/{alertId}/review-claim"
    description: "Manufacturer adjudicates the warranty claim: APPROVE, DENY, or REQUEST_INFO (which cycles the claim back to the installer)."
    roles: [ManufacturerWarrantyAgent]
    code: 200
    input: [decision, "resolution_notes?"]
    output: MonitoringAlert
    side_effects: ["status := CLAIM_APPROVED | CLAIM_DENIED | INFO_REQUESTED", "resolution_notes := supplied notes", "increments MonitoringAlert.version by 1"]

  # --- ByodEnrollment -------------------------------------------------------
  - method: POST
    path: "/byod-enrollments"
    description: "Enroll a commissioned, PTO-granted system in a seasonal bring-your-own-device program with a pledged dispatchable kW and a reserve state-of-charge floor."
    roles: [CertifiedInstaller]
    code: 201
    input: [battery_system_id, pledged_kw, reserve_soc_pct, season]
    output: ByodEnrollment
    side_effects: ["status := PENDING_CONSENT", "cumulative_credited_kw := 0", "cumulative_pledged_kw := 0", "settled_event_count := 0", "performance_payment_cents_total := 0"]

  - method: GET
    path: "/byod-enrollments/{enrollmentId}"
    description: "Read one BYOD enrollment with its season-to-date compliance accumulators."
    roles: [CertifiedInstaller, Homeowner, UtilityInterconnectionReviewer]
    code: 200
    input: []
    output: ByodEnrollment
    side_effects: []

  - method: GET
    path: "/byod-enrollments"
    description: "List BYOD enrollments. Reverse-reachability GET for ByodEnrollment.battery_system_id."
    roles: [CertifiedInstaller, Homeowner, UtilityInterconnectionReviewer]
    code: 200
    input: ["battery_system_id?", "season?", "status?", "limit?", "offset?"]
    output: ByodEnrollment[]
    side_effects: []

  - method: POST
    path: "/byod-enrollments/{enrollmentId}/consent"
    description: "Homeowner consents to utility dispatch of their battery, activating the enrollment."
    roles: [Homeowner]
    code: 200
    input: []
    output: ByodEnrollment
    side_effects: ["status := ENROLLED", "consented_by_user_id := X-User-ID", "consented_at := current_utc", "increments ByodEnrollment.version by 1"]

  - method: POST
    path: "/byod-enrollments/{enrollmentId}/withdraw"
    description: "Withdraw from the program. Compensating action for the dispatch capacity ledger: every pending performance of this enrollment is cancelled and its pledged kW is returned to each event's enrolled_pledged_kw."
    roles: [Homeowner, CertifiedInstaller]
    code: 200
    input: ["reason?"]
    output: ByodEnrollment
    side_effects: ["status := WITHDRAWN", "each PENDING DispatchPerformance of this enrollment := CANCELLED", "DispatchEvent.enrolled_pledged_kw -= pledged_kw_snapshot for each cancelled performance", "increments ByodEnrollment.version by 1"]

  # --- DispatchEvent / DispatchPerformance ----------------------------------
  - method: POST
    path: "/dispatch-events"
    description: "Schedule a utility dispatch event in a territory over a half-open [window_start, window_end) window. The aggregate target_kw of overlapping scheduled events in the same territory may not exceed TERRITORY_DISPATCH_CAP_KW."
    roles: [UtilityInterconnectionReviewer]
    code: 201
    input: [territory_code, window_start, window_end, event_type, target_kw, payment_rate_cents_per_kw]
    output: DispatchEvent
    side_effects: ["status := SCHEDULED", "enrolled_pledged_kw := 0", "total_net_payment_cents := 0"]

  - method: GET
    path: "/dispatch-events/{eventId}"
    description: "Read one dispatch event, including enrolled_pledged_kw and its version (needed for the OCC-guarded participation write)."
    roles: [UtilityInterconnectionReviewer, CertifiedInstaller, Homeowner]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: []

  - method: GET
    path: "/dispatch-events"
    description: "List dispatch events, optionally by territory or status."
    roles: [UtilityInterconnectionReviewer, CertifiedInstaller, Homeowner]
    code: 200
    input: ["territory_code?", "status?", "event_type?", "limit?", "offset?"]
    output: DispatchEvent[]
    side_effects: []

  - method: POST
    path: "/dispatch-events/{eventId}/participations"
    description: "Call an enrolled battery into a scheduled event, snapshotting its pledged kW. Creates a DispatchPerformance. OCC-guarded on the event's version so a client working from a stale view of the event's committed capacity is rejected."
    roles: [UtilityInterconnectionReviewer]
    code: 201
    input: [byod_enrollment_id, expected_dispatch_event_version]
    output: DispatchPerformance
    side_effects: ["creates DispatchPerformance with status := PENDING and pledged_kw_snapshot := enrollment.pledged_kw", "DispatchEvent.enrolled_pledged_kw += pledged_kw_snapshot", "increments DispatchEvent.version by 1"]

  - method: GET
    path: "/dispatch-performances/{performanceId}"
    description: "Read one dispatch performance with its delivery figures and settlement money fields."
    roles: [UtilityInterconnectionReviewer, CertifiedInstaller, Homeowner]
    code: 200
    input: []
    output: DispatchPerformance
    side_effects: []

  - method: GET
    path: "/dispatch-performances"
    description: "List dispatch performances. Reverse-reachability GET for DispatchPerformance.dispatch_event_id and DispatchPerformance.byod_enrollment_id."
    roles: [UtilityInterconnectionReviewer, CertifiedInstaller, Homeowner]
    code: 200
    input: ["dispatch_event_id?", "byod_enrollment_id?", "status?", "limit?", "offset?"]
    output: DispatchPerformance[]
    side_effects: []

  - method: POST
    path: "/dispatch-performances/{performanceId}/report-delivery"
    description: "Report metered energy delivered during the event window. Computes avg_delivered_kw, credited_kw and performance_ratio (steps 1a-1c of calculations.byod_settlement) but no money."
    roles: [UtilityInterconnectionReviewer]
    code: 200
    input: [delivered_kwh]
    output: DispatchPerformance
    side_effects: ["status := REPORTED", "avg_delivered_kw, credited_kw, performance_ratio computed", "increments DispatchPerformance.version by 1"]

  - method: POST
    path: "/dispatch-events/{eventId}/settle"
    description: "Settle the event: for every REPORTED performance, in created_at ascending order, run steps 2-7 of calculations.byod_settlement. CANCELLED performances are skipped; an event with no REPORTED performances settles with a zero total."
    roles: [UtilityInterconnectionReviewer]
    code: 200
    input: []
    output: DispatchEvent
    side_effects: ["status := SETTLED", "settled_at := current_utc", "each REPORTED performance := SETTLED with gross/penalty/bonus/net money fields written", "each affected ByodEnrollment's cumulative_credited_kw, cumulative_pledged_kw, season_compliance_ratio, settled_event_count and performance_payment_cents_total updated", "total_net_payment_cents := sum of settled net payments", "increments DispatchEvent.version by 1"]

  # --- Test-driving endpoint (logical clock) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical current UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every deadline, expiry and window rule in this domain reads the logical clock."
    roles: [ManufacturerWarrantyAgent, CertifiedInstaller, Homeowner, AuthorityHavingJurisdiction, UtilityInterconnectionReviewer, RebateAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by every timestamp, deadline and window comparison is set to to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The authenticated role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own — CertifiedInstaller whose id differs from the system's installer_id, or Homeowner whose id differs from the system's site_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The operator granting PTO is the same user who approved the interconnection application, or the operator paying a claim is the same user who approved it"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, negative quantity, window_end not strictly after window_start, empty essential_circuits under ESSENTIAL_LOADS, serial_numbers length not equal to unit_count, or malformed firmware version string"

  # --- existence -----------------------------------------------------------
  - id: ERR_INSTALLER_NOT_FOUND
    http: 404
    condition: "No InstallerAccount with the given id"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "No Site with the given id"
  - id: ERR_LOAD_CALCULATION_NOT_FOUND
    http: 404
    condition: "No LoadCalculation with the given id"
  - id: ERR_BATTERY_SYSTEM_NOT_FOUND
    http: 404
    condition: "No BatterySystem with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "No Permit with the given id, or the system referenced by an operation that requires a permit has none"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "No InterconnectionApplication with the given id, or the system referenced by an operation that requires one has none"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No IncentiveProgram with the given id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No RebateClaim with the given id"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "No CommissioningTest with the given id"
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "No MonitoringAlert with the given id"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "No ByodEnrollment with the given id"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "No DispatchEvent with the given id"
  - id: ERR_PERFORMANCE_NOT_FOUND
    http: 404
    condition: "No DispatchPerformance with the given id"

  # --- state preconditions -------------------------------------------------
  - id: ERR_LOAD_CALC_STATE_INVALID
    http: 409
    condition: "Submit or review requested from a LoadCalculation status that does not declare that transition (e.g. reviewing a DRAFT, submitting an APPROVED)"
  - id: ERR_SYSTEM_BUILD_STATE_INVALID
    http: 409
    condition: "A build-lifecycle operation requested from an incompatible build_status (e.g. commissioning a DESIGN_LOCKED system, expanding a non-COMMISSIONED system, acting on a SUPERSEDED or DESIGN_HOLD system)"
  - id: ERR_SYSTEM_GRID_STATE_INVALID
    http: 409
    condition: "An operation requires a different grid_status (e.g. reserving a rebate before the interconnection application is approved, or filing a second application for a DENIED system)"
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "Submit, review or inspection-result requested from a Permit status that does not declare that transition"
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "Submit, review or grant-pto requested from an InterconnectionApplication status that does not declare that transition"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "Submit, decision, pay, void or clawback requested from a RebateClaim status that does not declare that transition"
  - id: ERR_ALERT_STATE_INVALID
    http: 409
    condition: "Acknowledge, file-claim or review-claim requested from a MonitoringAlert status that does not declare that transition"
  - id: ERR_ENROLLMENT_STATE_INVALID
    http: 409
    condition: "Consent or withdraw requested from a ByodEnrollment status that does not declare that transition, or a participation created for an enrollment that is not ENROLLED"
  - id: ERR_EVENT_STATE_INVALID
    http: 409
    condition: "Participation added to, or settlement requested for, a DispatchEvent that is already SETTLED"
  - id: ERR_PERFORMANCE_STATE_INVALID
    http: 409
    condition: "Delivery reported for a DispatchPerformance that is not PENDING"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_SYSTEM_VERSION
    http: 412
    condition: "expected_battery_system_version does not equal the battery system's current version (§1.2.1 claim-reserve-stale-system, expansion writes)"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_dispatch_event_version does not equal the dispatch event's current version (§1.2.1 participation-create-stale-event)"

  # --- commissioning safety ------------------------------------------------
  - id: ERR_COMMISSIONING_TESTS_INCOMPLETE
    http: 422
    condition: "Commissioning attempted while at least one of the four required test types is missing or still SCHEDULED"
  - id: ERR_BACKUP_TRANSITION_NOT_VERIFIED
    http: 422
    condition: "Commissioning attempted while the BACKUP_TRANSITION test result is FAIL — the specific safety objection, reported in preference to the generic failed-test error"
  - id: ERR_COMMISSIONING_TEST_FAILED
    http: 422
    condition: "Commissioning attempted while a recorded test other than BACKUP_TRANSITION has result FAIL"

  # --- certification / coverage referential --------------------------------
  - id: ERR_INSTALLER_NOT_CERTIFIED
    http: 422
    condition: "The acting installer is SUSPENDED, its certification_expires_on is before the current logical date, or its certified_model_codes does not cover the requested model_code"
  - id: ERR_LOAD_CALC_NOT_APPROVED
    http: 422
    condition: "The referenced LoadCalculation is not APPROVED, or belongs to a different site than the system"
  - id: ERR_CAPACITY_BELOW_REQUIRED
    http: 422
    condition: "The bank's continuous_kw is below the load calculation's required_continuous_kw"
  - id: ERR_WARRANTY_NOT_ACTIVE
    http: 422
    condition: "A warranty claim is filed for a system whose warranty_status is UNREGISTERED or VOID"

  # --- cross-entity workflow gating ----------------------------------------
  - id: ERR_PERMIT_NOT_PASSED
    http: 422
    condition: "PTO grant attempted while the system's Permit is not in INSPECTION_PASSED"
  - id: ERR_ENROLLMENT_REQUIRES_PTO
    http: 422
    condition: "BYOD enrollment attempted for a system that is not both COMMISSIONED and PTO_GRANTED"

  # --- temporal / overlap --------------------------------------------------
  - id: ERR_PERMIT_EXPIRED
    http: 422
    condition: "Commissioning attempted after the permit's expires_on has passed"
  - id: ERR_TEST_WINDOW_CONFLICT
    http: 409
    condition: "The requested commissioning window, padded by the 30-minute travel buffer, overlaps another non-cancelled window of the same installer"
  - id: ERR_TERRITORY_CAPACITY_EXCEEDED
    http: 409
    condition: "The new dispatch event would push the aggregate target_kw of time-overlapping SCHEDULED events in the same territory above TERRITORY_DISPATCH_CAP_KW"

  # --- uniqueness / cardinality --------------------------------------------
  - id: ERR_DUPLICATE_PERMIT
    http: 409
    condition: "The system already has a Permit that is not in a dead state"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "The system already has an InterconnectionApplication that is not DENIED"
  - id: ERR_DUPLICATE_PROGRAM_CLAIM
    http: 409
    condition: "The system already has a claim against the same program whose status is not VOID, DENIED or CLAWED_BACK"
  - id: ERR_DUPLICATE_TEST
    http: 409
    condition: "The system already has a CommissioningTest of the same test_type"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "The system already has a non-WITHDRAWN ByodEnrollment for the same season"
  - id: ERR_PARTICIPATION_DUPLICATE
    http: 409
    condition: "The enrollment already has a DispatchPerformance for this event"
  - id: ERR_PERMIT_CORRECTION_LIMIT
    http: 409
    condition: "Further corrections requested once correction_round_count has reached PERMIT_MAX_CORRECTION_ROUNDS (3)"

  # --- incentive constraints ------------------------------------------------
  - id: ERR_EXPORT_COMMITMENT_REQUIRED
    http: 422
    condition: "A program that requires an export commitment received a claim with export_commitment NON_EXPORT, or the system's interconnection export_mode is NON_EXPORT"
  - id: ERR_CAPACITY_COMMITMENT_INVALID
    http: 422
    condition: "capacity_commitment_kw is below the program's min_capacity_commitment_kw or above the system's continuous_kw"
  - id: ERR_STACK_CAP_EXCEEDED
    http: 422
    condition: "The stacking headroom (tightest max_stack_pct_of_cost_bp applied to installed_cost_cents, less the effective holds of sibling claims) is zero"
  - id: ERR_INVERTER_INCOMPATIBLE
    http: 422
    condition: "The expansion's inverter_model belongs to a different gateway family than the base system's"
  - id: ERR_FIRMWARE_TOO_OLD
    http: 422
    condition: "The expansion's firmware_version is lower than the base system's firmware or than the model catalog minimum"
  - id: ERR_UNIT_LIMIT_EXCEEDED
    http: 422
    condition: "base unit_count plus additional_unit_count exceeds the model catalog's max_units"
  - id: ERR_PLEDGE_EXCEEDS_CAPACITY
    http: 422
    condition: "pledged_kw exceeds the system's continuous_kw, or reserve_soc_pct is outside 0..50"

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_PROGRAM_BUDGET_EXHAUSTED
    http: 422
    condition: "The program's remaining_budget_cents is strictly less than the reservation this claim would take"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# ---------------------------------------------------------------------------
roles:
  - name: CertifiedInstaller
    description: "Manufacturer-certified installation company. Designs and builds the system, drives permitting and interconnection paperwork, schedules and records commissioning tests, registers the warranty, reserves incentives and files warranty claims."
    identity: "entity_backed:InstallerAccount"
    exclusive_operations:
      - "POST /sites"
      - "POST /load-calculations"
      - "POST /load-calculations/{loadCalculationId}/submit"
      - "POST /battery-systems"
      - "POST /battery-systems/{batterySystemId}/lock-design"
      - "POST /battery-systems/{batterySystemId}/mark-installed"
      - "POST /battery-systems/{batterySystemId}/commission"
      - "POST /battery-systems/{batterySystemId}/register-warranty"
      - "POST /battery-systems/{batterySystemId}/expansions"
      - "POST /permits"
      - "POST /permits/{permitId}/submit"
      - "POST /interconnection-applications"
      - "POST /interconnection-applications/{applicationId}/submit"
      - "POST /rebate-claims"
      - "POST /rebate-claims/{claimId}/submit"
      - "POST /rebate-claims/{claimId}/void"
      - "POST /commissioning-tests"
      - "POST /commissioning-tests/{testId}/record-result"
      - "POST /monitoring-alerts/{alertId}/acknowledge"
      - "POST /monitoring-alerts/{alertId}/file-claim"
      - "POST /byod-enrollments"
    shared_operations:
      - "POST /monitoring-alerts (with ManufacturerWarrantyAgent)"
      - "POST /byod-enrollments/{enrollmentId}/withdraw (with Homeowner)"
      - "all GET reads scoped to its own systems"
      - "POST /_clock/set_current_utc"

  - name: Homeowner
    description: "Owner of the premises. Consents to utility dispatch of their battery and may withdraw that consent; otherwise read-only."
    identity: "entity_backed:Site"
    exclusive_operations:
      - "POST /byod-enrollments/{enrollmentId}/consent"
    shared_operations:
      - "POST /byod-enrollments/{enrollmentId}/withdraw (with CertifiedInstaller)"
      - "all GET reads scoped to its own site"
      - "POST /_clock/set_current_utc"

  - name: AuthorityHavingJurisdiction
    description: "Building/electrical authority. Reviews load calculations, issues permits and records field-inspection outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /load-calculations/{loadCalculationId}/review"
      - "POST /permits/{permitId}/review"
      - "POST /permits/{permitId}/inspection-result"
    shared_operations:
      - "read access to sites, load calculations, systems, permits, applications and commissioning tests"
      - "POST /_clock/set_current_utc"

  - name: UtilityInterconnectionReviewer
    description: "Utility distributed-energy staff. Reviews interconnection applications, grants permission to operate, schedules and settles bring-your-own-device dispatch events and reports metered delivery."
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection-applications/{applicationId}/review"
      - "POST /interconnection-applications/{applicationId}/grant-pto"
      - "POST /dispatch-events"
      - "POST /dispatch-events/{eventId}/participations"
      - "POST /dispatch-events/{eventId}/settle"
      - "POST /dispatch-performances/{performanceId}/report-delivery"
    shared_operations:
      - "read access to sites, systems, permits, applications, programs, enrollments, events and performances"
      - "POST /_clock/set_current_utc"
    segregation_of_duties:
      - "grant-pto is forbidden to the operator whose X-User-ID is recorded in the application's reviewed_by_user_id"

  - name: RebateAdministrator
    description: "Incentive program administrator. Creates funded programs, adjudicates, pays and claws back rebate claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /incentive-programs"
      - "POST /rebate-claims/{claimId}/decision"
      - "POST /rebate-claims/{claimId}/pay"
      - "POST /rebate-claims/{claimId}/clawback"
    shared_operations:
      - "read access to installers, sites, systems, applications, programs and claims"
      - "POST /_clock/set_current_utc"
    segregation_of_duties:
      - "pay is forbidden to the operator whose X-User-ID is recorded in the claim's approved_by_user_id"

  - name: ManufacturerWarrantyAgent
    description: "Manufacturer certification and warranty desk. Certifies installer companies, amends or suspends certifications, raises fleet-monitoring alerts and adjudicates warranty claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /installers"
      - "POST /installers/{installerId}/certification"
      - "POST /monitoring-alerts/{alertId}/review-claim"
    shared_operations:
      - "POST /monitoring-alerts (with CertifiedInstaller)"
      - "read access to installers, systems, commissioning tests and alerts"
      - "POST /_clock/set_current_utc"
