        test_recipe:
          setup: ["DY DRAFT with one top-level RTO zone; DRAFT forecast revision 1"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MarketAdmin
