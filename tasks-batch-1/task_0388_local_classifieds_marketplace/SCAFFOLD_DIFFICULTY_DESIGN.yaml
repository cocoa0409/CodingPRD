  - rule_id: cross_entity_state_dependency
    instances:
      - name: listing_publish_requires_seller_active
        grounds:
          - state_machines.Listing.transitions.DRAFT_to_ACTIVE
          - state_machines.Member.transitions.ACTIVE_to_SUSPENDED
          - validations[priority=7]
        distinguishing_aspect: |
          Pair {Listing -> Member}: Listing DRAFT->ACTIVE (publish) is blocked when the owning
          Member.status == SUSPENDED — the listing's valid transition depends on a different
          entity's (the seller's) state.
        test_recipe:
          setup:
            - "Seller S has a DRAFT listing; Moderator suspends S before publish is attempted."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
