            - "One discharged encounter with a single RESULTED CT x2 ancillary line, its claim ADJUDICATED under protection_variant PROTECTED_NSA"
            - "A dispute case whose three negotiation rounds are exhausted with offers 240000/200000, 235000/205000, 230000/210000, then escalated so status is IDR_INITIATED and last_offer_cents 230000 / last_counteroffer_cents 210000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
