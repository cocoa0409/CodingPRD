# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Custom Crush & Bonded Winery Services — 9 rules x 2 instances = 18 instances
# Every grounds[] entry resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls chain drives an empty DB into the described state using
# only endpoints declared in §1.5. Standing user ids: FacilityAdmin "fa-carol",
# CellarSupervisor "cs-bob", ComplianceOfficer "co-alice" / "co-dave";
# ClientRep's X-User-ID is always the Client id it acts for.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: storage_accrual_occupancy_versus_vessel_footprint
        grounds:
          - calculations.storage_accrual
          - entities.Contract.fields.storage_rate_cents_per_gallon_month
          - entities.Lot.fields.aging_start_at
          - entities.VesselAllocation.fields.allocated_gallons
          - state_machines.Lot.PRESSED_to_AGING
        distinguishing_aspect: |
          The dual variant lives on the MONEY domain of Contract: for one lot aged
          91 days the OCCUPANCY reading charges Lot.volume_gallons (3135.00) and
          returns 237738 cents, while the VESSEL_FOOTPRINT reading charges
          VesselAllocation.allocated_gallons (4000) over the same 91 days and
          returns 303333 cents from byte-identical stored data.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Contract for client Coombsville Cellars with storage_rate_cents_per_gallon_month 25 and effective window 2026-08-01 .. 2027-07-31."
            - "One 4000-gallon TANK T-101 in CLEAN condition."
            - "One INTAKE-origin Lot of exactly 3135.00 gallons (19.0 tons at 23.50 Brix), committed into T-101 under a 4000-gallon allocation and advanced to AGING with aging_start_at 2026-09-01T00:00:00Z."
            - "Contract.storage_billed_through is still null, so both windows clip below at effective_from 2026-08-01 and the lot/allocation clocks (both 2026-09-01) dominate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /vessels"
              payload: { vessel_code: "T-101", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v1: $.data.id, v1_ver: $.data.version }
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-1001", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 42000, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id }
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "SAMPLE", brix: 23.50, ph: 3.62 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "CS-OAK-26-01", vintage_year: 2026, intake_ids: ["${in1}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot1: $.data.id }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 4000, expected_vessel_version: "${v1_ver}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al1: $.data.id }
            - call: "POST /vessel-allocations/${al1}/commit"
              payload: { lot_id: "${lot1}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot1}/transitions"
              payload: { action: "START_FERMENTATION" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot1}/transitions"
              payload: { action: "PRESS", loss_gallons: 0 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot1}/transitions"
              payload: { action: "START_AGING" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
          trigger:
            - call: "GET /contracts/${ct1}/storage-accrual"
              payload: { through_at: "2026-12-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { occ_cents: $.data.charge_cents, occ_variant: $.data.variant }
            - call: "GET /contracts/${ct1}/storage-accrual"
              payload: { through_at: "2026-12-01T00:00:00Z", variant: "VESSEL_FOOTPRINT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { vf_cents: $.data.charge_cents }
          assert:
            - "${occ_variant} == OCCUPANCY (the default reading when variant is omitted)"
            - "${occ_cents} == 237738"
            - "${vf_cents} == 303333"
            - "${vf_cents} - ${occ_cents} == 65595 on byte-identical stored data"
            - "Contract.${ct1}.billed_total_cents == 950000 (unchanged — GET /contracts/{id}/storage-accrual posts nothing)"
            - "Contract.${ct1}.storage_billed_through == null after both reads"

      - name: ttb_reconciliation_bonded_versus_gross_produced_gallons
        grounds:
          - calculations.ttb_reconciliation
          - entities.TTBReport.fields.produced_gallons
          - entities.TTBReport.fields.loss_gallons
          - entities.TTBReport.fields.variance_gallons
          - state_machines.TTBReport.OPEN_to_PREPARED
          - state_machines.TTBReport.PREPARED_to_OPEN
        distinguishing_aspect: |
          The second dual variant lives on the VOLUME domain of TTBReport, not on
          Contract money: over the same September period the BONDED reading reports
          produced_gallons 2431.25 with loss_gallons 20.00, while the GROSS reading
          of the identical stored data reports produced_gallons 3411.25 with
          loss_gallons 1000.00 — and both still reconcile to variance_gallons 0.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z for every production event, then advanced to 2026-10-01T00:00:00Z before the report is opened."
            - "One ACTIVE Contract; two INTAKE Lots aged in two tanks: lot1 CABERNET_SAUVIGNON/OAKVILLE 1565.00 gallons at 26.40 Brix, lot2 MERLOT/OAKVILLE 866.25 gallons at 24.00 Brix."
            - "One EXECUTED BlendTrial drawing 750.00 from lot1 and 250.00 from lot2 at 2.00 percent declared loss, minting a 980.00-gallon BLEND lot with loss_gallons 20.00."
            - "One EXECUTED TAXPAID_REMOVAL ReleaseOrder for 100.00 gallons off the blend lot, leaving it at 880.00 gallons and back at IN_BOND."
            - "Physical closing count over IN_BOND lots is 815.00 + 616.25 + 880.00 = 2311.25 gallons."
            - "No previously FILED TTBReport exists, so opening_gallons is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /vessels"
              payload: { vessel_code: "T-101", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v1: $.data.id, v1_ver: $.data.version }
            - call: "POST /vessels"
              payload: { vessel_code: "T-102", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v2: $.data.id, v2_ver: $.data.version }
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-1001", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 24000, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id }
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "SAMPLE", brix: 26.40, ph: 3.62 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "CS-OAK-26-01", vintage_year: 2026, intake_ids: ["${in1}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot1: $.data.id }
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-1002", varietal: "MERLOT", appellation: "OAKVILLE", block_code: "B07", gross_weight_lbs: 14500, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in2: $.data.id }
            - call: "POST /harvest-intakes/${in2}/transitions"
              payload: { action: "SAMPLE", brix: 24.00, ph: 3.55 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in2}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "ME-OAK-26-01", vintage_year: 2026, intake_ids: ["${in2}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot2: $.data.id }
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v1}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 2000, expected_vessel_version: "${v1_ver}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al1: $.data.id }
            - call: "POST /vessel-allocations/${al1}/commit"
              payload: { lot_id: "${lot1}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /vessel-allocations"
              payload: { contract_id: "${ct1}", vessel_id: "${v2}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-11-01T00:00:00Z", allocated_gallons: 1000, expected_vessel_version: "${v2_ver}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { al2: $.data.id }
            - call: "POST /vessel-allocations/${al2}/commit"
              payload: { lot_id: "${lot2}" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot1}/transitions"
              payload: { action: "START_FERMENTATION" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot1}/transitions"
              payload: { action: "PRESS", loss_gallons: 0 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot1}/transitions"
              payload: { action: "START_AGING" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot2}/transitions"
              payload: { action: "START_FERMENTATION" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot2}/transitions"
              payload: { action: "PRESS", loss_gallons: 0 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots/${lot2}/transitions"
              payload: { action: "START_AGING" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /blend-trials"
              payload: { contract_id: "${ct1}", trial_name: "Estate Cuvee", target_lot_code: "BLEND-26-01", declared_loss_pct: 2.00, components: [{ source_lot_id: "${lot1}", volume_gallons: 750.00 }, { source_lot_id: "${lot2}", volume_gallons: 250.00 }] }
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { bt1: $.data.id }
            - call: "POST /blend-trials/${bt1}/transitions"
              payload: { action: "SUBMIT" }
              as: ClientRep
              as_user_id: "${cl1}"
            - call: "POST /blend-trials/${bt1}/transitions"
              payload: { action: "APPROVE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "GET /contracts/${ct1}"
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /blend-trials/${bt1}/execute"
              payload: { expected_contract_version: "${ct1_v}" }
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { blot: $.data.result_lot_id }
            - call: "POST /release-orders"
              payload: { lot_id: "${blot}", release_type: "TAXPAID_REMOVAL", gallons: 100.00, cases: 40 }
              as: ClientRep
              as_user_id: "${cl1}"
              captures: { ro1: $.data.id }
            - call: "POST /release-orders/${ro1}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
            - call: "POST /release-orders/${ro1}/transitions"
              payload: { action: "EXECUTE" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
            - call: "POST /ttb-reports"
              payload: { client_id: "${cl1}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { tr1: $.data.id }
          trigger:
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "PREPARE", variant: "BONDED" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { prod_b: $.data.produced_gallons, loss_b: $.data.loss_gallons, var_b: $.data.variance_gallons, close_b: $.data.closing_gallons }
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "RECALL" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
            - call: "POST /ttb-reports/${tr1}/transitions"
              payload: { action: "PREPARE", variant: "GROSS" }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { prod_g: $.data.produced_gallons, loss_g: $.data.loss_gallons, var_g: $.data.variance_gallons, close_g: $.data.closing_gallons }
          assert:
            - "${prod_b} == 2431.25 and ${loss_b} == 20.00"
            - "${prod_g} == 3411.25 and ${loss_g} == 1000.00"
            - "${prod_g} - ${prod_b} == 980.00 (exactly the blend lot's minted volume)"
            - "${close_b} == 2311.25 and ${close_g} == 2311.25 (the physical count is variant-independent)"
            - "${var_b} == 0.00 and ${var_g} == 0.00"
            - "TTBReport.${tr1}.removed_taxpaid_gallons == 100.00 and removed_in_bond_gallons == 0.00 under both variants"
            - "TTBReport.${tr1}.opening_gallons == 0.00 (no FILED predecessor)"
            - "TTBReport.${tr1}.variant == GROSS after the second PREPARE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: crush_fee_rounds_each_tier_segment_before_summing
        grounds:
          - calculations.crush_fee
          - entities.HarvestIntake.fields.crush_fee_cents
          - entities.Contract.fields.tons_received
          - entities.Contract.fields.billed_total_cents
          - state_machines.HarvestIntake.SAMPLED_to_ACCEPTED
        distinguishing_aspect: |
          MODE (b) — nested rounding where the order changes the cents. The second
          load straddles the 25-ton tier boundary with fractional tons on BOTH
          sides (2.5625 t at 45000 and 2.6875 t at 40500): rounding each segment
          first yields 115313 + 108844 = 224157, while summing the unrounded
          segments (224156.25) and rounding once yields 224156. The scaffold pins
          round-then-sum, so 224157 is the only correct answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T00:00:00Z."
            - "One ACTIVE Contract with crush_rate_cents_per_ton 45000 and effective window 2026-08-01 .. 2027-07-31."
            - "A first ACCEPTED load of exactly 22.4375 tons (net 44875 lbs) at 23.50 Brix, which sits wholly inside tier 1 and leaves Contract.tons_received at 22.4375."
            - "A second load of exactly 5.25 tons (net 10500 lbs) at 23.00 Brix, whose acceptance straddles the 25-ton boundary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Pritchard Hill Partners", ttb_permit_number: "BW-CA-15002", contact_email: "cellar@pritchard.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 45000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-2001", varietal: "CABERNET_SAUVIGNON", appellation: "STAGS_LEAP", block_code: "H01", gross_weight_lbs: 48875, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { inP: $.data.id }
            - call: "POST /harvest-intakes/${inP}/transitions"
              payload: { action: "SAMPLE", brix: 23.50, ph: 3.60 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${inP}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { feeP: $.data.crush_fee_cents, galP: $.data.estimated_gallons }
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-2002", varietal: "CABERNET_SAUVIGNON", appellation: "STAGS_LEAP", block_code: "H02", gross_weight_lbs: 14500, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { inQ: $.data.id }
            - call: "POST /harvest-intakes/${inQ}/transitions"
              payload: { action: "SAMPLE", brix: 23.00, ph: 3.58 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
          trigger:
            - call: "POST /harvest-intakes/${inQ}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { feeQ: $.data.crush_fee_cents, galQ: $.data.estimated_gallons }
          assert:
            - "${feeP} == 1009688"
            - "${feeQ} == 224157 (NOT 224156, which is the sum-then-round reading)"
            - "${galP} == 3702.19 and ${galQ} == 866.25"
            - "Contract.${ct1}.tons_received == 27.6875"
            - "Contract.${ct1}.billed_total_cents == 1233845"
            - "HarvestIntake.${inQ}.net_weight_lbs == 10500 and status == ACCEPTED"

      - name: work_order_discount_tier_read_from_undiscounted_basis
        grounds:
          - calculations.work_order_billing
          - entities.WorkOrder.fields.volume_discount_pct
          - entities.WorkOrder.fields.billable_amount_cents
          - entities.Contract.fields.billed_total_cents
          - state_machines.WorkOrder.COMPLETED_to_BILLED
          - concurrency_rules[work-order-bill-stale-contract]
        distinguishing_aspect: |
          MODE (c) — a circular-looking dependency with a pinned evaluation order.
          The tier is chosen from the UNDISCOUNTED basis 950000 + 52000 = 1002000,
          which clears DISCOUNT_TIER1_CENTS, so 5 percent applies and the order
          bills 49400; the post-billing total 999400 falls back BELOW the
          threshold, and a fixed-point reading that re-selected the tier would
          bill 52000 at 0 percent instead.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z."
            - "One ACTIVE Contract with crush_rate_cents_per_ton 50000 and labor_rate_cents_per_hour 10000."
