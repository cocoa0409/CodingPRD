            - "${err} == ERR_CREW_LEDGER_NOT_CLEAR"
            - "Crew.${crew}.status == ACTIVE and Crew.${crew}.accrued_wage_cents == 4950"
            - "HarvestWindow.${win}.status == CLOSED and HarvestWindow.${win}.harvested_clamshells == 20"

      - name: pick_session_retally_loop_is_bounded_by_the_revision_cap
        claim_type: cyclic
        grounds:
          - state_machines.PickSession.DISPUTED_to_TALLIED
          - validations[priority=49]
        excluded_because:
          difficulty_instance: non_linear_state_machine / pick_session_dispute_retally_cycle_bounded_at_three_revisions
          rationale: "The cyclic-shape claim (entity loops back and the loop count is respected) is the whole subject of the named §1.8 instance, which drives three revisions and asserts ERR_TALLY_REVISION_LIMIT on the fourth."

      - name: block_quarantine_cascades_down_to_windows_and_sessions
        claim_type: cascade_down
        grounds:
          - state_machines.Block.CLEARED_to_QUARANTINED
          - state_machines.PickSession.TALLIED_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / block_quarantine_cascades_four_levels_to_crew_wage_ledger
          rationale: "The cascade-down pattern (parent change moves only the non-terminal children) is asserted level by level by the named §1.8 instance."

      - name: lot_rejection_releases_reserved_allocations_cross_entity
        claim_type: cross_entity
        grounds:
          - state_machines.FruitLot.RESERVED_to_REJECTED
          - state_machines.LotAllocation.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / lot_rejection_cascades_three_levels_to_buyer_commitment_exposure
          rationale: "The cross-entity side-effect pattern (lot change adjusts allocation and commitment, both verified) is the named §1.8 instance's assert set."

      - name: allocation_release_compensates_both_parents_without_drift
        claim_type: compensation
        grounds:
          - state_machines.LotAllocation.RESERVED_to_RELEASED
          - calculations.lot_pack_mass_balance
        excluded_because:
          difficulty_instance: compensating_invariant / allocation_release_restores_lot_and_commitment_pounds_exactly
          rationale: "The compensation pattern (undo reverses every original side effect with no drift) is asserted pound-for-pound by the named §1.8 instance."

      - name: payroll_settle_syncs_the_crew_wage_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.PayrollRun.LOCKED_to_SETTLED
          - calculations.crew_wage_ledger
        excluded_because:
          difficulty_instance: dual_variant_calc / payroll_period_average_diverges_from_per_session_guarantee
          rationale: "The ledger-sync pattern (state change updates the ancestor's derived field, before/after reconciled) is asserted on Crew.accrued_wage_cents, settled_wage_cents and reconciliation_delta_cents by the named §1.8 instance."

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:

      - name: single_sample_exceedance_at_411_forces_failed_and_quarantine
        claim_type: threshold_boundary
        grounds:
          - calculations.water_quality_status
          - calculations.block_food_safety_posture
          - entities.WaterTest.fields.single_sample_exceedance
        distinguishing_aspect: |
          SINGLE_SAMPLE_MAX_MPN is compared with a STRICT >: 411 MPN sets
          single_sample_exceedance true, water_status FAILED and auto-quarantines
          the block with reason SINGLE_SAMPLE_EXCEEDANCE, while a following 410
          MPN sample (exactly at the maximum) is NOT an exceedance and takes
          water_status back to PROVISIONAL — yet food_safety_posture stays
          QUARANTINED because the manual hold the exceedance raised is still open.
        test_recipe:
          setup:
            - "One STRAWBERRY block with no water samples (water_status NO_SAMPLES, posture RESTRICTED)."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C1", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "CANAL-C1" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-10", generic_ecoli_mpn: 411 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { wt1: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-11", generic_ecoli_mpn: 410 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { wt2: $.data.id }
          assert:
            - "WaterTest.${wt1}.single_sample_exceedance == true and WaterTest.${wt1}.resulting_water_status == FAILED"
            - "WaterTest.${wt2}.single_sample_exceedance == false and WaterTest.${wt2}.resulting_water_status == PROVISIONAL"
            - "Block.${blk}.water_sample_count == 2 and Block.${blk}.water_geomean_mpn == 410.5 and Block.${blk}.last_sample_date == 2026-07-11"
            - "Block.${blk}.water_status == PROVISIONAL"
            - "Block.${blk}.manual_quarantine_active == true and Block.${blk}.quarantine_reason_code == SINGLE_SAMPLE_EXCEEDANCE and Block.${blk}.quarantined_by_user_id == fso-1"
            - "Block.${blk}.food_safety_posture == QUARANTINED"

      - name: water_rolling_window_drops_the_oldest_sample_beyond_five
        claim_type: input_set_filtering
        grounds:
          - calculations.water_quality_status
          - entities.Block.fields.water_geomean_mpn
        distinguishing_aspect: |
          Only the trailing WATER_SAMPLE_WINDOW (5) samples participate: with
          400/100/100/100/100 the geometric mean is 132.0, above the 126 limit,
          so water_status is NON_COMPLIANT and posture RESTRICTED; a sixth 100
          MPN sample pushes the 400 out of the window, so the mean falls to 100.0
          and the block becomes COMPLIANT with water_sample_count still 5 rather
          than 6.
        test_recipe:
          setup:
            - "One STRAWBERRY block carrying five samples in sample_date order: 2026-07-01 at 400 MPN, then 2026-07-02, 07-03, 07-04, 07-05 all at 100 MPN."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C2", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "CANAL-C2" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-01", generic_ecoli_mpn: 400 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-02", generic_ecoli_mpn: 100 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-03", generic_ecoli_mpn: 100 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-04", generic_ecoli_mpn: 100 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-05", generic_ecoli_mpn: 100 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "GET /berry-ops/blocks/${blk}"
              payload: {}
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
          trigger:
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-06", generic_ecoli_mpn: 100 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
              captures: { wt6: $.data.id }
          assert:
            - "before the trigger: Block.${blk}.water_sample_count == 5 and Block.${blk}.water_geomean_mpn == 132.0 and Block.${blk}.water_status == NON_COMPLIANT and Block.${blk}.food_safety_posture == RESTRICTED"
            - "WaterTest.${wt6}.resulting_water_status == COMPLIANT and WaterTest.${wt6}.single_sample_exceedance == false"
            - "after the trigger: Block.${blk}.water_sample_count == 5 and Block.${blk}.water_geomean_mpn == 100.0"
            - "Block.${blk}.water_status == COMPLIANT and Block.${blk}.food_safety_posture == CLEARED and Block.${blk}.last_sample_date == 2026-07-06"
            - "Block.${blk}.manual_quarantine_active == false"

      - name: water_geomean_stored_rounding_decides_the_compliance_comparison
        claim_type: precision
        grounds:
          - calculations.water_quality_status
        excluded_because:
          difficulty_instance: boundary_precision_check / water_geometric_mean_exactly_at_limit_is_compliant
          rationale: "The precision claim (the comparison runs against the stored 1-dp value, so a mean of exactly 126.0 is COMPLIANT while 126.2 is not) is the entire subject of the named §1.8 instance."

      - name: window_crew_requirement_ripe_multiplier_at_exact_brix_target
        claim_type: constants_applied
        grounds:
          - calculations.window_crew_requirement
          - state_machines.HarvestWindow.PLANNED_to_CONFIRMED
        distinguishing_aspect: |
          The RIPE_MULTIPLIER test is >= BRIX_TARGET, so BLUEBERRY at exactly
          12.0 brix earns rate 19.80 and needs 2 pickers for 280.00 lbs over a
          7.50 h window, while 11.9 brix on an otherwise identical window keeps
          rate 18.00 and needs 3 — one tenth of a brix point is a whole extra
          picker.
        test_recipe:
          setup:
            - "Two BLUEBERRY blocks and one crew (confirm only requires the block not be QUARANTINED, so no water sample is needed)."
            - "Window R on block R with forecast_brix 12.0 and window S on block S with forecast_brix 11.9; both 2026-08-03T06:00:00Z -> 2026-08-03T13:30:00Z with planned_volume_lbs 280.00."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C4R", variety: "BLUEBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-C4" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_r: $.data.id }
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C4S", variety: "BLUEBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-C4" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk_s: $.data.id }
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-C4", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 3, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk_r}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T13:30:00Z", forecast_brix: 12.0, planned_volume_lbs: 280.00, piece_rate_cents_per_clamshell: 60, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win_r: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk_s}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T13:30:00Z", forecast_brix: 11.9, planned_volume_lbs: 280.00, piece_rate_cents_per_clamshell: 60, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win_s: $.data.id }
          trigger:
            - call: "POST /berry-ops/harvest-windows/${win_r}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win_s}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
          assert:
            - "HarvestWindow.${win_r}.status == CONFIRMED and HarvestWindow.${win_r}.window_hours == 7.50"
            - "HarvestWindow.${win_r}.effective_pick_rate_lbs_per_hour == 19.80 and HarvestWindow.${win_r}.required_picker_count == 2"
            - "HarvestWindow.${win_s}.status == CONFIRMED and HarvestWindow.${win_s}.window_hours == 7.50"
            - "HarvestWindow.${win_s}.effective_pick_rate_lbs_per_hour == 18.00 and HarvestWindow.${win_s}.required_picker_count == 3"

      - name: session_cull_rate_at_exactly_the_ceiling_meets_standard
        claim_type: threshold_boundary
        grounds:
          - calculations.session_pay_per_session
          - entities.PickSession.fields.quality_flag
          - entities.PickSession.fields.effective_piece_rate_cents
        distinguishing_aspect: |
          MAX_CULL_RATE is inclusive: 8 culls out of 100 clamshells is a
          cull_rate of exactly 0.0800 and MEETS_STANDARD at the full 45-cent
          rate (piece 4140, net 4140), while 9 out of 100 is 0.0900,
          BELOW_STANDARD at the 20%-derated 36-cent rate, and the derate drops
          piece earnings to 3276 — below the 3300-cent guarantee floor, so the
          make-up pays 24 cents and net lands on exactly the floor.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block, one DOMESTIC crew with two trained pickers, CERTIFIED."
            - "One OPEN window 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z, piece rate 45 cents, clamshell 1.00 lb, planned_volume_lbs 150.00 (required_picker_count 1)."
            - "Two OPEN sessions for 2026-08-03, one per picker."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-C5", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-C5" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { blk: $.data.id }
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-20", generic_ecoli_mpn: 40 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-C5", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 2, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker C5 A", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk1: $.data.id }
            - call: "POST /berry-ops/pickers"
              payload: { crew_id: "${crew}", full_name: "Picker C5 B", hygiene_training_on: "2026-06-01" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { pk2: $.data.id }
            - call: "POST /berry-ops/crews/${crew}/support-plan"
              payload: { housing_unit_code: "H-C5", beds_confirmed: 2, transport_route_code: "R-C5", vehicle_seats: 2 }
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/crews/${crew}/certify"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T06:00:00Z", end_at: "2026-08-03T14:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/harvest-windows/${win}/confirm"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/harvest-windows/${win}/open"
              payload: {}
              as: HarvestManager
              as_user_id: "hm-1"
            - call: "POST /berry-ops/pick-sessions"
              payload: { harvest_window_id: "${win}", picker_id: "${pk1}", work_date: "2026-08-03" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { ses_at: $.data.id }
            - call: "POST /berry-ops/pick-sessions"
              payload: { harvest_window_id: "${win}", picker_id: "${pk2}", work_date: "2026-08-03" }
              as: CrewSupervisor
              as_user_id: "sup-1"
              captures: { ses_over: $.data.id }
          trigger:
            - call: "POST /berry-ops/pick-sessions/${ses_at}/tally"
              payload: { hours_worked: 2.00, clamshells_filled: 100, culled_clamshells: 8 }
              as: CrewSupervisor
              as_user_id: "sup-1"
            - call: "POST /berry-ops/pick-sessions/${ses_over}/tally"
              payload: { hours_worked: 2.00, clamshells_filled: 100, culled_clamshells: 9 }
              as: CrewSupervisor
              as_user_id: "sup-1"
          assert:
            - "PickSession.${ses_at}.cull_rate == 0.0800 and PickSession.${ses_at}.quality_flag == MEETS_STANDARD"
            - "PickSession.${ses_at}.effective_piece_rate_cents == 45 and PickSession.${ses_at}.piece_cents == 4140"
            - "PickSession.${ses_at}.guarantee_floor_cents == 3300 and PickSession.${ses_at}.makeup_cents == 0 and PickSession.${ses_at}.gross_cents == 4140 and PickSession.${ses_at}.net_cents == 4140"
            - "PickSession.${ses_over}.cull_rate == 0.0900 and PickSession.${ses_over}.quality_flag == BELOW_STANDARD"
            - "PickSession.${ses_over}.effective_piece_rate_cents == 36 and PickSession.${ses_over}.piece_cents == 3276"
            - "PickSession.${ses_over}.guarantee_floor_cents == 3300 and PickSession.${ses_over}.makeup_cents == 24 and PickSession.${ses_over}.gross_cents == 3300 and PickSession.${ses_over}.net_cents == 3300"
            - "PickSession.${ses_at}.housing_deduction_cents == 0 and PickSession.${ses_over}.housing_deduction_cents == 0"

      - name: picker_productivity_full_recompute_across_two_pack_formats
        claim_type: aggregation
        grounds:
          - calculations.picker_productivity
          - entities.Picker.fields.avg_lbs_per_hour
          - entities.HarvestWindow.fields.clamshell_net_weight_lbs
        distinguishing_aspect: |
          The average is pounds per hour, not clamshells per hour, so each
          session is weighed with ITS OWN window's clamshell_net_weight_lbs: 20
          paid clamshells at 1.00 lb plus 24 paid clamshells at 0.50 lb is 32.00
          paid lbs over 5.00 h, giving avg_lbs_per_hour 6.40 — and
          total_clamshells_lifetime counts 44 paid clamshells, excluding the 6
          culled ones.
        test_recipe:
          setup:
            - "Two CLEARED STRAWBERRY blocks, one DOMESTIC crew with one trained picker."
            - "Window A on block A 2026-08-03T06:00:00Z -> 2026-08-03T14:00:00Z, piece rate 45, clamshell 1.00 lb; window B on block B 2026-08-04T06:00:00Z -> 2026-08-04T14:00:00Z, piece rate 50, clamshell 0.50 lb. Both OPEN."
            - "Session A (3.00 h, 20 clamshells, 0 culled) already APPROVED; session B created and still OPEN."
          setup_api_calls:
