            - call: "POST /merchants"
              payload: { owning_agent_id: "${a2}", processor_program_id: "${p1}", mid: "MID-A203", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m203: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a2}", processor_program_id: "${p1}", mid: "MID-A204", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m204: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a2}", processor_program_id: "${p1}", mid: "MID-A205", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
