  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: order_maturation_window_half_open_lower_bound_inclusive
        grounds:
          - state_machines.Order.PENDING_to_AVAILABLE
          - entities.Order.fields.settled_at
          - entities.Order.fields.matured_at
          - calculations.order_net_earnings
        distinguishing_aspect: |
          Interval semantics A — maturation half-open window [settled_at + maturation_days, ∞):
          the lower bound is INCLUSIVE (current_utc >= settled_at + 7d matures). At exactly
          settled_at + 7 days the order matures; one second earlier it does not. The resource is the
          Order and the geometric treatment is an inclusive lower bound on a time ray.
        test_recipe:
          setup:
            - "Order gross 10000 settled at 2026-01-01T00:00:00Z; maturation_days 7"
            - "Clock advanced to exactly 2026-01-08T00:00:00Z (settled_at + 7d)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Papa LLC", email: "papa@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1818" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-08T00:00:00Z" }
              as: PlatformFinance
          assert:
            - "Order.${order_id}.settlement_status == AVAILABLE"
            - "Order.${order_id}.matured_at == 2026-01-08T00:00:00.000Z"

      - name: chargeback_representment_window_closed_upper_bound_inclusive
        grounds:
          - state_machines.Chargeback.RECEIVED_to_REPRESENTED
          - entities.Chargeback.fields.representment_due_at
          - validations[priority=12]
          - errors[ERR_REPRESENTMENT_WINDOW_CLOSED]
        distinguishing_aspect: |
          Interval semantics B — representment closed window (-∞, representment_due_at]: the upper
          bound is INCLUSIVE (current_utc <= due is allowed). Advancing the clock strictly past
          representment_due_at closes the window so representment is rejected with
          ERR_REPRESENTMENT_WINDOW_CLOSED — a different resource (Chargeback) and a different geometric
          bound (inclusive upper bound) than the Order maturation ray.
        test_recipe:
          setup:
            - "Chargeback RECEIVED on an order with representment_due_at = receipt + 7 days (set by server)"
            - "Clock advanced to one day past representment_due_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Quebec LLC", email: "quebec@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1919" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /chargebacks"
              payload: { order_id: "${order_id}" }
              as: PlatformFinance
              captures: { cb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: PlatformFinance
          trigger:
            - call: "POST /chargebacks/${cb_id}/represent"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response error_id == ERR_REPRESENTMENT_WINDOW_CLOSED"
            - "Chargeback.${cb_id}.chargeback_status == RECEIVED"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_release_then_reverse_leaves_available_balance_unchanged
        grounds:
          - state_machines.Payout.SCHEDULED_to_RELEASED
          - state_machines.Payout.RELEASED_to_REVERSED
          - entities.Seller.fields.available_balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity #1 = seller.available_balance_cents. Release (PAYOUT -8130, sweep orders
          PAID) then reverse (PAYOUT reversal +8130, orders back to AVAILABLE) must net to zero:
          available_balance_cents == 8130 both before release and after reverse. The invariant is
          available_balance_cents pinned as sum of AVAILABLE ledger entries.
        test_recipe:
          setup:
