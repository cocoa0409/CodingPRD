      - name: determination_amount_invalid_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DETERMINATION_AMOUNT_INVALID]"]
        distinguishing_aspect: "PARTIALLY_DENIED with denied_amount_cents == billed_amount_cents (60000) violates the strict 0 < denied < billed band -> 422."
