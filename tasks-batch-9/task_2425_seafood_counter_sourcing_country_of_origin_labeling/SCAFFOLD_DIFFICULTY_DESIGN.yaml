  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: mismatch_cascade_depth_five_lot_label_shrink_chargeback_supplier
        grounds:
          - state_machines.SupplierLot.label_status.SAMPLED_to_MISMATCHED
          - state_machines.CaseLabel.PUBLISHED_to_WITHDRAWN
          - state_machines.SupplierLot.chargeback_status.NONE_to_ASSESSED
          - calculations.shrink_valuation
          - calculations.supplier_chargeback_assessment
          - calculations.counter_posture_derivation
        distinguishing_aspect: |
          Cascade A is five hops deep from one API call: sample result MISMATCH -> lot
          label_status MISMATCHED -> CaseLabel WITHDRAWN with SPECIES_MISMATCH -> system
          ShrinkEvent MISLABEL_DESTRUCTION valued at 18450 -> lot chargeback_status ASSESSED
          at 47840 -> Supplier ledger and standing, and hop 4 fires only because the
          withdraw_reason is SPECIES_MISMATCH.
