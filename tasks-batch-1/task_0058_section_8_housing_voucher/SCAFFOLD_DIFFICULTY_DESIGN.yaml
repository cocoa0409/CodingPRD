        grounds:
          - validations[priority=13]
          - state_machines.Inspection.FAILED_to_CURED
          - entities.Inspection.fields.cure_deadline
        distinguishing_aspect: |
          Interval semantics A (inclusive right boundary on a cure window):
          curing AT exactly cure_deadline (current_utc == deadline) succeeds;
          the window is closed on the right.
        test_recipe:
          setup:
            - "An ANNUAL inspection FAILED at scheduled 2026-06-15 with cure_deadline 2026-06-29 (14-day window); clock set to exactly 2026-06-29T00:00:00Z."
