  - section: errors
    instances:

      - name: pagination_bounds_are_enforced_on_list_reads
        claim_type: violation_to_error
        grounds:
          - validations[priority=5].ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit=0 and limit=101 must both return ERR_INVALID_PAGINATION (400) on GET /in-bond/movements, while limit=100 is accepted — the window is 1..100 inclusive."
        test_recipe:
          setup:
            - "Ports 4601 / 3901; carrier ACTIVE; CONTINUOUS bond 50000.00; one movement filed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
          trigger:
            - call: "GET /in-bond/movements"
              payload: { limit: 0, offset: 0 }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "GET /in-bond/movements"
              payload: { limit: 101, offset: 0 }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "GET /in-bond/movements"
              payload: { limit: 100, offset: 0 }
