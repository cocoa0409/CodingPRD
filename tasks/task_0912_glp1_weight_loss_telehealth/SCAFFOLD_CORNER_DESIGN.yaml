              payload: { patient_id: "${p_id}", consult_id: "${c_id}", prescriber_provider_id: "${d_id}", screening_id: "${s_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${p_v_old}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_v_new: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${p_id}", consult_id: "${c_id}", prescriber_provider_id: "${d_id}", screening_id: "${s_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${p_v_new}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { rx_id: "$.data.id" }
          assert:
            - "the stale-version create returns HTTP 412 with error_id ERR_STALE_PATIENT_VERSION"
            - "GET /glp1/prescriptions with patient_id ${p_id} returns total_count == 0 immediately after the rejection"
            - "the refreshed create returns HTTP 201 and Prescription.${rx_id}.clinical_status == ACTIVE"
            - "Patient.${p_id}.version increases by one again on the successful create"

      - name: occ_stale_prescription_version_rejects_order_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pharmacy-order-create-stale-prescription]
          - errors[ERR_STALE_PRESCRIPTION_VERSION]
          - endpoints[POST /glp1/pharmacy-orders]
        distinguishing_aspect: "A second pharmacy order create reusing the prescription version captured before the first order is refused with ERR_STALE_PRESCRIPTION_VERSION and HTTP 412, because creating the first order already advanced that version."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; CASH patient in CA with an ACTIVE dose_level 1 prescription for 2 units."
            - "A COMPOUNDED pharmacy serving CA holds lot L-0012 of 24 units at 0.25 mg, window capacity 6, expiring 2026-12-31."
            - "The client captured Prescription.version, then created one order, which advanced it."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "occ2@example.com", full_name: "Occ Two", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710016002" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/pharmacies"
              payload: { name: "Bay Compounding", dispense_type: "COMPOUNDED", served_state_codes: ["CA"], status: "ACTIVE" }
              as: PlatformAdmin
              captures: { ph_id: "$.data.id" }
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "L-0012", strength_mg: 0.25, total_units: 24, window_capacity_units: 6, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${p_id}", provider_id: "${d_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${p_id}"
              captures: { c_id: "$.data.id" }
            - call: "POST /glp1/consults/${c_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${d_id}"
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { p_v: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${p_id}", consult_id: "${c_id}", prescriber_provider_id: "${d_id}", screening_id: "${s_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${p_v}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { rx_id: "$.data.id", rx_v_old: "$.data.version" }
            - call: "GET /glp1/titration-steps"
              payload: { prescription_id: "${rx_id}", status: "DUE" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { ts1_id: "$.data[0].id" }
            - call: "POST /glp1/pharmacy-orders"
              payload: { prescription_id: "${rx_id}", titration_step_id: "${ts1_id}", units_requested: 2, window_start_at: "2026-06-02T00:00:00Z", window_end_at: "2026-06-09T00:00:00Z", expected_prescription_version: "${rx_v_old}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { po1_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/pharmacy-orders"
              payload: { prescription_id: "${rx_id}", titration_step_id: "${ts1_id}", units_requested: 2, window_start_at: "2026-06-12T00:00:00Z", window_end_at: "2026-06-19T00:00:00Z", expected_prescription_version: "${rx_v_old}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /glp1/prescriptions/${rx_id}"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
              captures: { rx_v_new: "$.data.version" }
            - call: "POST /glp1/pharmacy-orders"
              payload: { prescription_id: "${rx_id}", titration_step_id: "${ts1_id}", units_requested: 2, window_start_at: "2026-06-12T00:00:00Z", window_end_at: "2026-06-19T00:00:00Z", expected_prescription_version: "${rx_v_new}" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { po2_id: "$.data.id" }
          assert:
            - "the stale-version create returns HTTP 412 with error_id ERR_STALE_PRESCRIPTION_VERSION"
            - "the refreshed create returns HTTP 201"
            - "GET /glp1/pharmacy-orders with prescription_id ${rx_id} returns total_count == 2"
            - "Prescription.${rx_id}.fulfillment_status == ROUTED"
            - "SupplyLot.${lot_id}.available_units == 24, because creating an order reserves nothing"

      - name: version_increments_on_every_patient_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Patient.fields.current_bmi
          - endpoints[PATCH /glp1/patients/{patient_id}/vitals]
          - state_machines.EligibilityScreening.DRAFT_to_ELIGIBLE
        distinguishing_aspect: "Patient.version reads 1 at creation, 2 after a vitals update and 3 after the screening decision writes eligibility_status, proving cascaded side effects also bump the version."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; one CA patient at 170 cm and 95.0 kg and one CA clinician."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "occ3@example.com", full_name: "Occ Three", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "CASH", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { p_id: "$.data.id", v1: "$.data.version" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710016003" }
              as: PlatformAdmin
              captures: { d_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${p_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${d_id}"
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "PATCH /glp1/patients/${p_id}/vitals"
              payload: { weight_kg: 93.0 }
              as: Provider
              as_user_id: "${d_id}"
              captures: { v2: "$.data.version" }
            - call: "POST /glp1/screenings/${s_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${d_id}"
            - call: "GET /glp1/patients/${p_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v3: "$.data.version" }
          assert:
            - "Patient.${p_id}.version == 1 at creation"
            - "Patient.${p_id}.version == 2 after the vitals update and current_bmi == 32.2"
            - "Patient.${p_id}.version == 3 after the screening submit, and eligibility_status == ELIGIBLE"
            - "EligibilityScreening.${s_id}.assessed_bmi == 32.9, computed from the screening's own recorded weight rather than the updated one"

  # =========================================================================
  # Consistency model
  # =========================================================================
  - section: consistency_model
    instances:

      - name: cascade_visible_immediately_in_the_triggering_response
        claim_type: immediate
        grounds:
          - state_machines.CheckIn.SUBMITTED_to_ESCALATED
          - state_machines.Prescription.clinical_ACTIVE_to_clinical_HELD
        excluded_because:
          difficulty_instance: triage_escalation_five_hop_cascade_to_supply_lot
          rationale: "That instance asserts every hop of the chain right after the single triage call returns, which is exactly the immediate-consistency claim."

      - name: settlement_ledger_visible_immediately_after_settle
        claim_type: immediate
        grounds:
          - state_machines.BillingCycle.INVOICED_to_SETTLED
          - entities.Patient.fields.lifetime_charged_cents
        excluded_because:
          difficulty_instance: patient_cash_conserved_across_settle_then_void
          rationale: "lifetime_charged_cents is read immediately after the settle call in that instance."
