            - call: "POST /draft-service/service-visits"
              payload: { account_id: "${acct}", technician_id: "${tech2}", visit_kind: "ROUTINE_CLEANING", scheduled_date: "2026-08-05", scheduled_start_minute: 661, scheduled_end_minute: 780 }
              as: DispatchCoordinator
              as_user_id: "dispatch-1"
              captures: { v2: $.data.id }
          assert:
            - "first trigger POST /draft-service/service-visits returns HTTP 409 with error_id ERR_VENUE_SLOT_CONFLICT (660 <= 660 and 780 >= 540)"
            - "${err_venue} == ERR_VENUE_SLOT_CONFLICT"
            - "the first rejection is NOT ERR_TECHNICIAN_ROUTE_CONFLICT - the second technician has no other job that day"
