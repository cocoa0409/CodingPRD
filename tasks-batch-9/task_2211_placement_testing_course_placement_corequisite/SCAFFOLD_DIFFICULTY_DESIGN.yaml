  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: booking_state_precedes_retake_waiting_period
        error_category_pair: "state (priority 8) x business_temporal (priority 20)"
        grounds:
          - validations[priority=8].ERR_ADMINISTRATION_NOT_BOOKABLE
          - validations[priority=20].ERR_RETAKE_WAITING_PERIOD
          - endpoints[POST /test-attempts]
        distinguishing_aspect: |
          One request violates a session-state rule at priority 8 and a retake-timing
          rule at priority 20. Because the ordered check list puts state before
          business_temporal, the response must be ERR_ADMINISTRATION_NOT_BOOKABLE
          (409) and NOT ERR_RETAKE_WAITING_PERIOD (422) — the cheaper-looking
          temporal arithmetic must not be allowed to short-circuit ahead of the
          state gate. The instance then isolates each rule: a bookable session at
          the same instant yields the temporal error alone, and a bookable session
          at the gate instant yields a 201.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Session A1: room T01, proctor-1, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 5, driven to OPEN so a real attempt can be scored inside it."
            - "Student SK has no transcript and no self-guided pathway; one attempt in A1 scored raw_score 100 at the clock, so attempt_ordinal 1 and next_eligible_at = 2026-08-01T00:00:00Z + 14 days = 2026-08-15T00:00:00Z."
            - "Session A2: room T02, proctor-2, 2026-08-10T00:00:00Z-02:00:00Z, then driven to CANCELLED by director-1 — NOT bookable AND before the gate."
            - "Session A3: room T03, proctor-2, 2026-08-10T00:00:00Z-02:00:00Z, left SCHEDULED — bookable (only CLOSED and CANCELLED are unbookable) but still before the gate."
            - "Session A4: room T04, proctor-3, 2026-08-15T00:00:00Z-02:00:00Z, left SCHEDULED — bookable AND exactly at the gate."
            - "Distinct room codes keep validations priority 17 out of the way; distinct proctors keep the priority 19 daily cap (480 minutes) out of the way."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T01", subject_area: "MATH", proctor_user_id: "proctor-1", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a1: $.data.id }
            - call: "POST /test-administrations/${a1}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /students"
              payload: { student_number: "SK", full_name: "Student K", race_ethnicity_code: "ASIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sk: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${sk}", administration_id: "${a1}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att1: $.data.id }
            - call: "POST /test-attempts/${att1}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-1"
            - call: "POST /test-attempts/${att1}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-1"
              captures: { ord1: $.data.attempt_ordinal, gate1: $.data.next_eligible_at }
            - call: "POST /test-administrations"
              payload: { room_code: "T02", subject_area: "MATH", proctor_user_id: "proctor-2", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-10T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a2: $.data.id }
            - call: "POST /test-administrations/${a2}/status"
              payload: { target_status: "CANCELLED" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { a2_status: $.data.status }
            - call: "POST /test-administrations"
              payload: { room_code: "T03", subject_area: "MATH", proctor_user_id: "proctor-2", starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-10T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a3: $.data.id, a3_status: $.data.status }
            - call: "POST /test-administrations"
              payload: { room_code: "T04", subject_area: "MATH", proctor_user_id: "proctor-3", starts_at: "2026-08-15T00:00:00Z", ends_at: "2026-08-15T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { a4: $.data.id }
          trigger:
            - call: "POST /test-attempts"
              payload: { student_id: "${sk}", administration_id: "${a2}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_pair: $.data.error_id }
            - call: "POST /test-attempts"
              payload: { student_id: "${sk}", administration_id: "${a3}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err_temporal_alone: $.data.error_id }
            - call: "POST /test-attempts"
              payload: { student_id: "${sk}", administration_id: "${a4}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att2: $.data.id, att2_state: $.data.state, att2_ord: $.data.attempt_ordinal, att2_gate: $.data.next_eligible_at }
            - call: "GET /students/${sk}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sk_counts: $.data.attempt_counts, sk_remaining: $.data.remaining_attempts }
          assert:
            - "${ord1} == 1 and ${gate1} == \"2026-08-15T00:00:00Z\" (setup)"
            - "${a2_status} == \"CANCELLED\" and ${a3_status} == \"SCHEDULED\" (setup)"
            - "${err_pair} == \"ERR_ADMINISTRATION_NOT_BOOKABLE\" with HTTP 409 — priority 8 wins over priority 20"
            - "${err_pair} != \"ERR_RETAKE_WAITING_PERIOD\" — returning the 422 here is the exact failure this instance detects"
            - "${err_temporal_alone} == \"ERR_RETAKE_WAITING_PERIOD\" with HTTP 422 — priority 20 in isolation on a SCHEDULED session"
            - "${att2_state} == \"BOOKED\" and ${att2_ord} == 2 and ${att2_gate} == null — the gate instant is INCLUSIVE, and a BOOKED attempt carries no gate of its own"
            - "${sk_counts}.MATH == 1 and ${sk_remaining}.MATH == 2 — booking does not consume the retake budget; only scoring does"
            - "the two rejected calls created no TestAttempt: GET /test-attempts?student_id=${sk} returns total_count 2"

      - name: prerequisite_safety_precedes_placement_referential_mismatch
        error_category_pair: "business_safety (priority 12) x business_referential (priority 16)"
        grounds:
          - validations[priority=12].ERR_PREREQUISITE_NOT_MET
          - validations[priority=16].ERR_PLACEMENT_COURSE_MISMATCH
          - endpoints[POST /registrations/{registration_id}/confirm]
          - calculations.prerequisite_satisfaction_closure
        distinguishing_aspect: |
          A different category pair on a different endpoint: an academic-safety
          check (an unmet BLOCKING prerequisite) collides with a referential check
          (the section's course is not on the student's placement). Priority 12
          must win over 16 even though the referential check is a single field
          comparison while the safety check needs the closure algorithm. The
          instance then peels the checks apart — presenting an override clears
          only the safety rule and exposes the referential one — and finally shows
          a student for whom both hold, confirming into the SAME section.
