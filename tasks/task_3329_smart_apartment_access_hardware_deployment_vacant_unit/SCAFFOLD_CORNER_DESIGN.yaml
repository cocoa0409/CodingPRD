              payload: { name: "Not Allowed", address_line: "1 Nope Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: LeasingAgent
              captures: { e_la: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_device_alert_version_blocks_work_order_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[wo-create-stale-alert]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "An OCC guard on DeviceAlert.version: a work-order create carrying a version one behind the alert's current version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B with a LEAK_SENSOR S driven UNREACHABLE, producing alert A. The alert's current version is read first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Version Vale", address_line: "1 Stale St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_vv: $.data.id }
            - call: "POST /properties/${prop_vv}/buildings"
              payload: { name: "VV-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_vv: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "LEAK_SENSOR", building_id: "${bld_vv}", firmware_version: "OLD", battery_pct: 50 }
              as: HardwareTechnician
              captures: { dev_vv: $.data.id }
            - call: "POST /buildings/${bld_vv}/device-scans"
              payload: { reachable_device_ids: [] }
              as: HardwareTechnician
              captures: { al_vv: "$.data[0].id", al_vv_ver: "$.data[0].version" }
          trigger:
            - call: "POST /device-alerts/${al_vv}/work-orders"
              payload: { assigned_technician_id: "tech-paul", expected_device_alert_version: "${al_vv_ver} - 1" }
              as: HardwareTechnician
              captures: { e_vv: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "no WorkOrder is created for DeviceAlert.${al_vv}"

      - name: stale_building_version_blocks_second_installation_job
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[job-create-stale-building]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "An OCC guard on Building.version: after one job create bumps the building, a second create still carrying the pre-bump version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B; its version is captured at creation, then one InstallationJob is created (bumping the version)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Stale Summit", address_line: "2 Old Ver Way", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_vb: $.data.id }
            - call: "POST /properties/${prop_vb}/buildings"
              payload: { name: "VB-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_vb: $.data.id, bld_vb_v: $.data.version }
            - call: "POST /properties/${prop_vb}/units"
              payload: { unit_number: "U-VB1", building_id: "${bld_vb}" }
              as: PropertyManager
              captures: { unit_vb: $.data.id }
            - call: "POST /buildings/${bld_vb}/installation-jobs"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_vb}", requires_resident_coordination: false, access_window_start: "2026-09-03T09:00:00Z", access_window_end: "2026-09-03T12:00:00Z", expected_building_version: "${bld_vb_v}" }
              as: PropertyManager
          trigger:
            - call: "POST /buildings/${bld_vb}/installation-jobs"
              payload: { device_type: "THERMOSTAT", unit_id: "${unit_vb}", requires_resident_coordination: false, access_window_start: "2026-09-04T09:00:00Z", access_window_end: "2026-09-04T12:00:00Z", expected_building_version: "${bld_vb_v}" }
              as: PropertyManager
              captures: { e_vb: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "only one InstallationJob exists for Building.${bld_vb}"

      - name: resident_creation_immediately_marks_unit_occupied
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Unit.transitions.VACANT_to_OCCUPIED
          - entities.Unit.fields.occupancy_status
          - endpoints.GET_/units
        distinguishing_aspect: "Derived occupancy is reconciled immediately: a GET /units issued right after resident creation already reports OCCUPIED and hvac_mode OCCUPIED with setpoint 22.0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with unit U (VACANT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Sync Springs", address_line: "3 Now St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_sy: $.data.id }
            - call: "POST /properties/${prop_sy}/units"
              payload: { unit_number: "U-SY1" }
              as: PropertyManager
              captures: { unit_sy: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { property_id: "${prop_sy}", unit_id: "${unit_sy}", full_name: "Sasha Sync", email: "sasha@x.com" }
              as: PropertyManager
              captures: { res_sy: $.data.id }
            - call: "GET /units"
              payload: { property_id: "${prop_sy}" }
              as: PropertyManager
              captures: { unit_sy_status: "$.data[0].occupancy_status", unit_sy_sp: "$.data[0].target_setpoint_c" }
          assert:
            - "GET /units?property_id=${prop_sy} reports occupancy_status == OCCUPIED for ${unit_sy} in the same read"
            - "Unit.${unit_sy}.hvac_mode == OCCUPIED and target_setpoint_c == 22.0"

      - name: cascade_chain_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Resident.transitions.ACTIVE_to_DEACTIVATING
          - state_machines.AccessCredential.transitions.ACTIVE_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / resident_moveout_credential_revocation_three_hop_chain
          rationale: "The full N-level cascade and its ordering are asserted by the named §1.8 instance."

      - name: dual_variant_excluded
        claim_type: dual_variant_calculation
        grounds:
          - calculations.maintenance_budget_accrual_cents.variants.provisional
          - calculations.maintenance_budget_accrual_cents.variants.final
        excluded_because:
          difficulty_instance: dual_variant_calc / maintenance_accrual_provisional_vs_final
          rationale: "Both variants and their delta are asserted by the named §1.8 instance."

      - name: pagination_filter_excluded
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/units
        excluded_because:
          difficulty_instance: boundary_precision_check / maintenance_complete_rejects_zero_actual_hours
          rationale: "Pagination is exercised by the units_list_paginates_and_reports_total_count_and_has_more corner; the §1.8 instance named here is the closest difficulty instance and keeps the stub grounded."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: certificate_visit_side_effects_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - endpoints.POST_/maintenance-visits/{maintenanceVisitId}/certify_notice
          - entities.MaintenanceVisit.fields.accrued_cost_cents
        distinguishing_aspect: "Under immediate consistency the certify response itself already reports status NOTICE_CERTIFIED and the provisional accrued_cost_cents, with no re-read required."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with a non-emergency REQUESTED MaintenanceVisit V starting 2026-09-03T10:00:00Z (planned_hours 2.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Instant Inn", address_line: "1 Same St", unit_capacity: 1, temp_budget_cents_per_day: 500000 }
              as: PlatformAdmin
              captures: { prop_ii: $.data.id }
            - call: "POST /properties/${prop_ii}/units"
              payload: { unit_number: "U-II1" }
              as: PropertyManager
              captures: { unit_ii: $.data.id }
            - call: "POST /units/${unit_ii}/maintenance-visits"
              payload: { technician_id: "tech-mo", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_ii: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_ii}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
              captures: { visit_ii_status: $.data.status, visit_ii_cost: $.data.accrued_cost_cents }
          assert:
            - "the certify response data.status == NOTICE_CERTIFIED in the same request"
            - "the certify response data.accrued_cost_cents == 3400 (2000 + ceil(2.0)*700)"
            - "Property.${prop_ii}.budget_committed_cents == 3400 immediately, with no separate refresh call"