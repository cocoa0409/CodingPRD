              as: Carrier
              as_user_id: "${car1_id}"
          assert:
            - "With the agreement SUSPENDED the report returns 409 with ${suspended_error_id} == ERR_AGREEMENT_NOT_ACTIVE and ServicePeriod.${per1_id}.status stays OPEN"
            - "Reinstating only the carrier is not enough: the report still returns 409 with ${still_suspended_error_id} == ERR_AGREEMENT_NOT_ACTIVE, proving the guard reads ServiceAgreement.status and not Carrier.status"
            - "ServiceAgreement.${agr_id}.cumulative_scheduled_departures is still 0 after both refusals"
            - "After the agreement REINSTATE the same payload succeeds: ServicePeriod.${per1_id}.status == REPORTED with period_completion_factor == 0.8750"
            - "With the agreement in HOLD_IN the 2026-09 report also succeeds: ServicePeriod.${per2_id}.status == REPORTED with period_completion_factor == 0.9500"
            - "ServiceAgreement.${agr_id}.cumulative_scheduled_departures == 204 and cumulative_completed_departures == 186 across the two accepted reports"

  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_rate_intervals_per_community
        grounds:
          - validations.priority_18
          - errors.ERR_RATE_INTERVAL_OVERLAP
          - entities.ServiceAgreement.fields.rate_effective_from
          - entities.ServiceAgreement.fields.rate_effective_to
          - state_machines.Community.SUBSIDIZED_to_SUBSIDIZED
          - endpoints.POST_/eas/solicitations/{id}/selection-order
        overlap_dimension: "interval vs interval — the half-open rate interval [rate_effective_from, rate_effective_to) of two ServiceAgreements for the same Community"
        contended_resource: "the Community's subsidised service window"
        distinguishing_aspect: |
          Two intervals are compared, so the interesting cases are the half-open endpoint (one
          agreement's rate_effective_to equal to the other's rate_effective_from must be accepted) and
          the status-scoped sweep (HOLD_IN and TERMINATED agreements are invisible to the sweep, which
          is exactly what lets a replacement agreement legally overlap the predecessor it is
          replacing). The other overlap instance compares a single instant against a buffered point.
        test_recipe:
          setup:
            - "Community HYS with ACTIVE agreement A1 (Prairie Air, term 12) whose interval is [2026-08-01, 2027-08-01)."
            - "Community DDC with ACTIVE agreement B1 (Prairie Air, term 12) whose interval is [2026-08-01, 2027-08-01)."
            - "A second HYS solicitation is CLOSED at clock 2026-09-01 with one candidate from Frontier Regional, term 12."
