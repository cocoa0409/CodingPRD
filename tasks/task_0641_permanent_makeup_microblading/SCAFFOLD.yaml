# =============================================================================
# task_0641_permanent_makeup_microblading — SCAFFOLD (§1.0–§1.7)
# Permanent Makeup & Microblading Studio
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  641. Permanent Makeup & Microblading Studio: consultation & patch-test, procedure
  (brows/liner/lip) & color, deposit & session + touch-up package, healing protocol &
  aftercare, consent/medical & age verification, bloodborne-pathogen/license compliance,
  annual refresh, photo & redo policy

domain_name: permanent-makeup-studio
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.3) — calibrated to EXPERT (§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on Appointment.version for book-procedure supersede
    - cascading_side_effects        # license lapse -> appointment void -> deposit/kit reversal
    - dual_variant_calculation      # touch-up package payg vs bundle; client risk provisional vs final
    - rate_threshold_triggers       # risk >= 30 HIGH_RISK; no-show strike >= 3 BLOCKED
    - derived_field_reconciliation  # studio kit ledger; client risk band; appointment balance

  entity_topology: flat
  # Peer entities linked by foreign keys; clients, technicians, studio are top-level
  # roots; appointments / patch-tests / consents / deposits / packages / healing /
  # redo reference them by FK rather than nesting in URL paths.

  state_machine_shape: cyclic
  # Appointment carries parallel dimensions (lifecycle_status x payment_status) and
  # RedoRequest/touch-up form a revision cycle COMPLETED -> REDO_SCHEDULED ->
  # (new appointment) -> COMPLETED. Technician license + Studio posture are guards.

  relationship_patterns:
    - one_to_many        # Client -> Appointment, Client -> PatchTest, Appointment -> HealingLog
    - flat_with_references
    - cross_aggregate    # Appointment references Technician, ColorFormula, ConsentRecord, PatchTest

  role_model: peer_roles
  # FrontDesk owns scheduling/deposits/clients; Technician owns clinical procedure +
  # patch-test reads + healing; ComplianceOfficer owns license/consent/age + voids;
  # StudioAdmin is hierarchical_override superset.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Studio: singleton root holding the logical clock, sterile-kit ledger and
  #     compliance posture derived from technician license states. ---
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Studio trade name" }
      - { name: state_code, type: string, source: input, description: "US state of operation; drives min_client_age", constraints: "2-letter; e.g. CA, TX, FL" }
      - { name: min_client_age, type: integer, source: input, description: "Minimum legal age for PMU procedures in this state", default: 18, constraints: ">= 18" }
      - { name: sterile_kit_total, type: integer, source: input, description: "Total single-use BBP sterile kits stocked", constraints: ">= 0" }
      - { name: sterile_kit_consumed, type: integer, source: computed, description: "Count of kits consumed by procedures whose appointment lifecycle_status is IN_PROCEDURE, HEALING, or COMPLETED" }
      - { name: sterile_kit_available, type: integer, source: computed, description: "sterile_kit_total - sterile_kit_consumed; never negative" }
      - { name: compliance_posture, type: enum, source: computed, description: "OPEN when >=1 Technician is LICENSE_ACTIVE and sterile_kit_available>0; RESTRICTED when sterile_kit_available==0 but a licensed tech exists; FROZEN when no Technician is LICENSE_ACTIVE", constraints: "OPEN | RESTRICTED | FROZEN" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- Technician: clinical operator; license lifecycle gates all procedures. ---
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: full_name, type: string, source: input, description: "Technician legal name" }
      - { name: license_number, type: string, source: input, description: "State PMU/tattoo license number" }
      - { name: bbp_cert_expiry, type: datetime, source: input, description: "Bloodborne-pathogen certification expiry (ISO8601 UTC)" }
      - { name: license_expiry, type: datetime, source: input, description: "PMU license expiry (ISO8601 UTC)" }
      - { name: license_status, type: enum, source: system, description: "LICENSE_ACTIVE | LICENSE_SUSPENDED | LICENSE_EXPIRED; initial LICENSE_ACTIVE", constraints: "LICENSE_ACTIVE | LICENSE_SUSPENDED | LICENSE_EXPIRED" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- Client: customer; carries derived healing-risk band and no-show strike count. ---
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO8601 UTC date; used for age verification against Studio.min_client_age at booking time" }
      - { name: medical_flag_count, type: integer, source: input, description: "Number of disclosed contraindicating medical conditions from intake form", default: 0, constraints: ">= 0" }
      - { name: prior_adverse_reactions, type: integer, source: input, description: "Count of prior PMU adverse reactions disclosed", default: 0, constraints: ">= 0" }
      - { name: skin_sensitivity_self, type: integer, source: input, description: "Self-reported skin sensitivity 0-3 from intake questionnaire", default: 0, constraints: "0..3" }
      - { name: skin_sensitivity_observed, type: integer, source: system, description: "Patch-test observed reaction grade 0-3, null until a PatchTest is READ", constraints: "0..3 or null" }
      - { name: risk_score, type: integer, source: computed, description: "weighted_scoring; uses observed grade once a PatchTest is READ, else self-reported (see calculations.client_risk_score)" }
      - { name: risk_band, type: enum, source: computed, description: "STANDARD when risk_score < 30, HIGH_RISK when risk_score >= 30", constraints: "STANDARD | HIGH_RISK" }
      - { name: medical_cleared, type: boolean, source: system, description: "Set true only via ComplianceOfficer medical-clearance action; required to book when risk_band is HIGH_RISK", default: false }
      - { name: no_show_strikes, type: integer, source: computed, description: "Count of Appointments for this client in lifecycle_status NO_SHOW" }
      - { name: client_status, type: enum, source: computed, description: "ACTIVE when no_show_strikes < 3, BLOCKED when no_show_strikes >= 3", constraints: "ACTIVE | BLOCKED" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- ConsentRecord: append-only consent/medical/age verification; immutable. ---
  - name: ConsentRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits; signing timestamp" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: consent_type, type: enum, source: input, description: "PROCEDURE_CONSENT | MEDICAL_DISCLOSURE | PHOTO_RELEASE", constraints: "PROCEDURE_CONSENT | MEDICAL_DISCLOSURE | PHOTO_RELEASE" }
      - { name: age_verified, type: boolean, source: input, description: "Front-desk confirmed government ID and age >= Studio.min_client_age at signing" }
      - { name: signed_by_name, type: string, source: input, description: "Name as signed by client" }

  # --- PatchTest: allergy patch test; READ result feeds client risk; 48h cooling-off. ---
  - name: PatchTest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: applied_at, type: datetime, source: system, description: "Logical-clock time when patch was applied (ISO8601 UTC)" }
      - { name: read_at, type: datetime, source: system, description: "Logical-clock time when result was read; null until READ" }
      - { name: status, type: enum, source: system, description: "APPLIED | READ | VOIDED; initial APPLIED", constraints: "APPLIED | READ | VOIDED" }
      - { name: reaction_grade, type: integer, source: input, description: "Observed reaction 0-3 supplied at read; null until READ", constraints: "0..3 or null" }
      - { name: result, type: enum, source: computed, description: "PASS when reaction_grade <= 1, FAIL when reaction_grade >= 2; null until READ", constraints: "PASS | FAIL | null" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- ColorFormula: pigment recipe; pigment_count drives color surcharge tier. ---
  - name: ColorFormula
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: name, type: string, source: input, description: "Formula display name e.g. 'Warm Taupe'" }
      - { name: procedure_type, type: enum, source: input, description: "Procedure this formula is intended for", constraints: "BROWS | EYELINER | LIP_BLUSH" }
      - { name: pigment_count, type: integer, source: input, description: "Number of pigments blended; drives color_surcharge tier", constraints: ">= 1" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- Appointment: core resource; PARALLEL state dims lifecycle_status x payment_status. ---
  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id" }
      - { name: color_formula_id, type: string, source: input, description: "FK -> ColorFormula.id" }
      - { name: patch_test_id, type: string, source: input, description: "FK -> PatchTest.id; the READ, PASS patch test that gates this procedure" }
      - { name: procedure_type, type: enum, source: input, description: "Must equal color_formula.procedure_type", constraints: "BROWS | EYELINER | LIP_BLUSH" }
      - { name: appointment_kind, type: enum, source: input, description: "INITIAL initial procedure, TOUCH_UP package touch-up, ANNUAL_REFRESH yearly refresh, REDO free corrective redo", default: INITIAL, constraints: "INITIAL | TOUCH_UP | ANNUAL_REFRESH | REDO" }
      - { name: is_corrective, type: boolean, source: input, description: "True when procedure corrects prior faded PMU; adds complexity uplift to session price", default: false }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC scheduled procedure start; must be >= 48h after patch_test.applied_at" }
      - { name: lifecycle_status, type: enum, source: system, description: "BOOKED | IN_PROCEDURE | HEALING | COMPLETED | CANCELLED | NO_SHOW | VOIDED; initial BOOKED", constraints: "BOOKED | IN_PROCEDURE | HEALING | COMPLETED | CANCELLED | NO_SHOW | VOIDED" }
      - { name: payment_status, type: enum, source: system, description: "AWAITING_DEPOSIT | DEPOSIT_PAID | BALANCE_DUE | PAID_IN_FULL | REFUNDED; initial AWAITING_DEPOSIT (independent of lifecycle_status)", constraints: "AWAITING_DEPOSIT | DEPOSIT_PAID | BALANCE_DUE | PAID_IN_FULL | REFUNDED" }
      - { name: session_price_cents, type: integer, source: computed, description: "Computed at booking from procedure_type base + color surcharge + corrective uplift (see calculations.session_price)" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "20% of session_price_cents, round_half_up (see calculations.deposit_amount)" }
      - { name: deposit_paid_cents, type: integer, source: computed, description: "Sum of DepositTransaction.amount_cents with txn_type CHARGE minus REFUND for this appointment" }
      - { name: balance_due_cents, type: integer, source: computed, description: "session_price_cents - deposit_paid_cents while AWAITING/DEPOSIT_PAID; 0 once PAID_IN_FULL" }
      - { name: kit_consumed, type: boolean, source: system, description: "True once a sterile kit was consumed at IN_PROCEDURE start; false after VOID restores the kit", default: false }
      - { name: healing_outcome, type: enum, source: system, description: "GOOD | POOR; null until a HealingLog flags it; POOR + within redo window enables free REDO", constraints: "GOOD | POOR | null" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time when lifecycle reached COMPLETED; anchors touch-up and annual-refresh windows" }
      - { name: parent_appointment_id, type: string, source: input, description: "FK -> Appointment.id; set on TOUCH_UP/ANNUAL_REFRESH/REDO appointments to the originating COMPLETED appointment" }
      - { name: package_order_id, type: string, source: input, description: "FK -> PackageOrder.id; set on TOUCH_UP appointments drawing from a purchased package" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- PackageOrder: pre-paid touch-up bundle; remaining_sessions decremented per TOUCH_UP. ---
  - name: PackageOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id" }
      - { name: source_appointment_id, type: string, source: input, description: "FK -> Appointment.id; the COMPLETED INITIAL appointment this package's touch-ups extend" }
      - { name: included_sessions, type: integer, source: input, description: "Number of touch-up sessions in the bundle", constraints: ">= 1" }
      - { name: remaining_sessions, type: integer, source: computed, description: "included_sessions minus count of TOUCH_UP Appointments referencing this package not in CANCELLED/VOIDED" }
      - { name: pricing_mode, type: enum, source: input, description: "PAYG price each touch-up separately, BUNDLE single discounted up-front price", constraints: "PAYG | BUNDLE" }
      - { name: package_price_cents, type: integer, source: computed, description: "Computed from pricing_mode at purchase (see calculations.package_price)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED; initial ACTIVE; EXPIRED when touch-up window of source appt closes", constraints: "ACTIVE | EXHAUSTED | EXPIRED" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

  # --- DepositTransaction: append-only money event; conservation of deposit. ---
  - name: DepositTransaction
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits; transaction time" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id" }
      - { name: txn_type, type: enum, source: input, description: "CHARGE deposit collected, REFUND deposit returned, FORFEIT deposit kept on late cancel/no-show", constraints: "CHARGE | REFUND | FORFEIT" }
      - { name: amount_cents, type: integer, source: input, description: "Positive integer cents; for CHARGE must equal appointment.deposit_required_cents", constraints: "> 0" }

  # --- HealingLog: append-only aftercare follow-up; flags healing_outcome. ---
  - name: HealingLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits; logged at logical-clock time" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; must be a HEALING or COMPLETED appointment" }
      - { name: day_offset, type: integer, source: input, description: "Days since procedure when this check-in occurred", constraints: ">= 0" }
      - { name: outcome_flag, type: enum, source: input, description: "GOOD healing on track, POOR retention loss / complication", constraints: "GOOD | POOR" }
      - { name: notes, type: string, source: input, description: "Aftercare notes" }

  # --- RedoRequest: free corrective redo lifecycle; cyclic loop to a REDO appointment. ---
  - name: RedoRequest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the COMPLETED appointment whose result is disputed" }
      - { name: reason, type: string, source: input, description: "Client-stated reason for redo" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | SCHEDULED | FULFILLED; initial REQUESTED", constraints: "REQUESTED | APPROVED | DENIED | SCHEDULED | FULFILLED" }
      - { name: redo_appointment_id, type: string, source: system, description: "FK -> Appointment.id; the REDO appointment created when SCHEDULED; null otherwise" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 on every mutation incl. cascades" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ----- Technician license (linear-ish with revert; guards Studio posture) -----
  - entity: Technician
    field: license_status
    initial_state: LICENSE_ACTIVE
    terminal_states: []
    transitions:
      - from: LICENSE_ACTIVE
        to: LICENSE_SUSPENDED
        trigger: "POST /technicians/{id}/suspend-license"
        actor: ComplianceOfficer
        preconditions: ["Technician.license_status == LICENSE_ACTIVE"]
        side_effects:
          - "All this technician's Appointments in lifecycle_status BOOKED -> VOIDED (cascade L1)"
          - "Each voided appointment that had kit_consumed == true sets kit_consumed=false (cascade L2; Studio.sterile_kit_consumed recomputed)"
          - "Each voided appointment with payment_status DEPOSIT_PAID emits a REFUND DepositTransaction restoring deposit_paid_cents to 0 and sets payment_status=REFUNDED (cascade L2)"
          - "Studio.compliance_posture recomputed (cascade L3): FROZEN if no LICENSE_ACTIVE technician remains"
          - "increments Studio.version by 1"
      - from: LICENSE_SUSPENDED
        to: LICENSE_ACTIVE
        trigger: "POST /technicians/{id}/reinstate-license"
        actor: ComplianceOfficer
        preconditions: ["Technician.license_status == LICENSE_SUSPENDED", "Technician.license_expiry > current logical-clock time", "Technician.bbp_cert_expiry > current logical-clock time"]
        side_effects: ["Studio.compliance_posture recomputed; increments Studio.version by 1"]
      - from: [LICENSE_ACTIVE, LICENSE_SUSPENDED]
        to: LICENSE_EXPIRED
        trigger: "system: license_expiry or bbp_cert_expiry <= current logical-clock time observed at any procedure-gating check"
        actor: system
        preconditions: ["Technician.license_expiry <= current logical-clock time OR Technician.bbp_cert_expiry <= current logical-clock time"]
        side_effects: ["Studio.compliance_posture recomputed; increments Studio.version by 1"]

  # ----- PatchTest (linear with terminal VOIDED; READ feeds client risk) -----
  - entity: PatchTest
    field: status
    initial_state: APPLIED
    terminal_states: [READ, VOIDED]
    transitions:
      - from: APPLIED
        to: READ
        trigger: "POST /patch-tests/{id}/read"
        actor: Technician
        preconditions:
          - "PatchTest.status == APPLIED"
          - "current logical-clock time >= patch_test.applied_at + PATCH_READ_MIN_HOURS (48h)"
          - "reaction_grade supplied in 0..3"
        side_effects:
          - "read_at = current logical-clock time"
          - "result = PASS if reaction_grade <= 1 else FAIL"
          - "Client.skin_sensitivity_observed = reaction_grade (cross-entity); Client.risk_score & risk_band recomputed via client_risk_score FINAL variant"
          - "increments Client.version by 1"
      - from: APPLIED
        to: VOIDED
        trigger: "POST /patch-tests/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["PatchTest.status == APPLIED"]
        side_effects: ["patch test no longer usable to gate an Appointment"]

  # ----- Appointment lifecycle (CYCLIC via REDO + branching to CANCELLED/NO_SHOW/VOIDED) -----
  - entity: Appointment
    field: lifecycle_status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, VOIDED]
    note: "Parallel to payment_status machine on the same row; COMPLETED is non-final for redo/touch-up cycle (new linked appointments)."
    transitions:
      - from: BOOKED
        to: IN_PROCEDURE
        trigger: "POST /appointments/{id}/start"
        actor: Technician
        preconditions:
          - "Appointment.lifecycle_status == BOOKED"
          - "Appointment.payment_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
          - "Technician.license_status == LICENSE_ACTIVE (cross-entity)"
          - "Studio.compliance_posture == OPEN (cross-entity)"
          - "Studio.sterile_kit_available >= 1 (cross-entity)"
          - "linked PatchTest.status == READ and result == PASS (cross-entity)"
        side_effects:
          - "kit_consumed = true; Studio.sterile_kit_consumed += 1; Studio.sterile_kit_available recomputed (ledger sync)"
          - "Studio.compliance_posture recomputed (RESTRICTED if available hits 0); increments Studio.version by 1"
      - from: IN_PROCEDURE
        to: HEALING
        trigger: "POST /appointments/{id}/finish-procedure"
        actor: Technician
        preconditions: ["Appointment.lifecycle_status == IN_PROCEDURE"]
        side_effects: ["procedure recorded; awaits HealingLog entries"]
      - from: HEALING
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Technician
        preconditions:
          - "Appointment.lifecycle_status == HEALING"
          - "Appointment.payment_status == PAID_IN_FULL"
          - "at least one HealingLog exists for this appointment"
        side_effects:
          - "completed_at = current logical-clock time"
          - "healing_outcome = POOR if any HealingLog.outcome_flag == POOR else GOOD"
          - "anchors touch-up window [completed_at+30d, completed_at+60d] and annual-refresh eligibility completed_at+365d"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: FrontDesk
        preconditions: ["Appointment.lifecycle_status == BOOKED"]
        side_effects:
          - "If current logical-clock time <= scheduled_start - CANCEL_FREE_HOURS (48h): emit REFUND DepositTransaction for deposit_paid_cents, payment_status=REFUNDED (full refund)"
          - "Else (late cancel): emit FORFEIT DepositTransaction for deposit_paid_cents, payment_status stays DEPOSIT_PAID (deposit forfeited, not refunded)"
          - "deposit conservation: deposit_paid_cents == refunded + forfeited (invariant deposit_conservation)"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: FrontDesk
        preconditions: ["Appointment.lifecycle_status == BOOKED", "current logical-clock time >= scheduled_start"]
        side_effects:
          - "emit FORFEIT DepositTransaction for deposit_paid_cents (deposit forfeited)"
          - "Client.no_show_strikes recomputed (+1); Client.client_status recomputed -> BLOCKED if strikes >= 3 (cross-entity cascade); increments Client.version by 1"
      - from: BOOKED
        to: VOIDED
        trigger: "system: technician license suspended/expired (cascade) OR POST /appointments/{id}/void by ComplianceOfficer"
        actor: "system or ComplianceOfficer"
        preconditions: ["Appointment.lifecycle_status == BOOKED"]
        side_effects:
          - "If kit_consumed == true: kit_consumed=false, Studio.sterile_kit_consumed -= 1 (compensating: kit restored, invariant kit_conservation)"
          - "If payment_status == DEPOSIT_PAID: emit REFUND DepositTransaction for deposit_paid_cents, payment_status=REFUNDED"
          - "increments Studio.version by 1"

  # ----- Appointment payment (PARALLEL dimension on Appointment; evolves independently) -----
  - entity: Appointment
    field: payment_status
    initial_state: AWAITING_DEPOSIT
    terminal_states: [REFUNDED]
    note: "Independent axis from lifecycle_status; a BOOKED appointment can be AWAITING_DEPOSIT then DEPOSIT_PAID without any lifecycle change."
    transitions:
      - from: AWAITING_DEPOSIT
        to: DEPOSIT_PAID
        trigger: "POST /appointments/{id}/deposit"
        actor: FrontDesk
        preconditions:
          - "Appointment.payment_status == AWAITING_DEPOSIT"
          - "txn amount_cents == Appointment.deposit_required_cents"
        side_effects: ["emit CHARGE DepositTransaction; deposit_paid_cents recomputed = deposit_required_cents"]
      - from: DEPOSIT_PAID
        to: BALANCE_DUE
        trigger: "POST /appointments/{id}/finish-procedure (auto, same call that moves lifecycle IN_PROCEDURE->HEALING)"
        actor: Technician
        preconditions: ["Appointment.payment_status == DEPOSIT_PAID", "Appointment.lifecycle_status == IN_PROCEDURE"]
        side_effects: ["balance_due_cents = session_price_cents - deposit_paid_cents"]
      - from: BALANCE_DUE
        to: PAID_IN_FULL
        trigger: "POST /appointments/{id}/pay-balance"
        actor: FrontDesk
        preconditions: ["Appointment.payment_status == BALANCE_DUE", "txn amount_cents == Appointment.balance_due_cents"]
        side_effects: ["balance_due_cents = 0"]

  # ----- PackageOrder (linear with auto EXHAUSTED/EXPIRED) -----
  - entity: PackageOrder
    field: status
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: TOUCH_UP appointment booked draws the last remaining session (remaining_sessions reaches 0)"
        actor: system
        preconditions: ["PackageOrder.remaining_sessions == 0 after the draw"]
        side_effects: ["no further TOUCH_UP appointments may reference this package"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: booking attempt or status read after source appointment touch-up window closes (current logical-clock time > source_appointment.completed_at + TOUCHUP_WINDOW_CLOSE_DAYS 60d)"
        actor: system
        preconditions: ["current logical-clock time > source_appointment.completed_at + 60 days", "PackageOrder.remaining_sessions > 0"]
        side_effects: ["remaining sessions void; no further TOUCH_UP appointments may be booked from it"]

  # ----- RedoRequest (CYCLIC: COMPLETED appt -> redo -> SCHEDULED creates REDO appt -> COMPLETED) -----
  - entity: RedoRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, FULFILLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /redo-requests/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "RedoRequest.status == REQUESTED"
          - "linked Appointment.lifecycle_status == COMPLETED (cross-entity)"
          - "linked Appointment.healing_outcome == POOR (cross-entity)"
          - "current logical-clock time <= linked Appointment.completed_at + REDO_WINDOW_DAYS (90d)"
        side_effects: ["redo eligibility confirmed; awaits scheduling"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /redo-requests/{id}/deny"
        actor: ComplianceOfficer
        preconditions: ["RedoRequest.status == REQUESTED"]
        side_effects: ["no redo appointment created"]
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /redo-requests/{id}/schedule"
        actor: FrontDesk
        preconditions: ["RedoRequest.status == APPROVED"]
        side_effects:
          - "creates a new Appointment kind=REDO, parent_appointment_id = linked appointment, session_price_cents=0, deposit_required_cents=0 (free), payment_status=PAID_IN_FULL, lifecycle_status=BOOKED"
          - "redo_appointment_id set to the new appointment"
      - from: SCHEDULED
        to: FULFILLED
        trigger: "system: the REDO appointment reaches COMPLETED (cross-entity bubble-up)"
        actor: system
        preconditions: ["redo_appointment.lifecycle_status == COMPLETED (cross-entity)"]
        side_effects: ["redo loop closed"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — sanctioned mechanism only)
# =============================================================================
concurrency_rules:
  - rule_id: redo-schedule-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /redo-requests/{id}/schedule"
    occ_field: "expected_appointment_version"
    description: |
      Scheduling a redo creates a new REDO appointment linked to the COMPLETED
      source appointment and is the operation that consumes the source's
      one-redo allowance. A scheduling request whose expected_appointment_version
      no longer matches the source Appointment's current version is rejected:
      the source has been mutated since the client last observed it (e.g. another
      redo was already scheduled against it, which legitimately supersedes), so
      this client's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: touchup-book-stale-package
    parent_entity: PackageOrder
    write_endpoint: "POST /appointments/touch-up"
    occ_field: "expected_package_version"
    description: |
      Booking a TOUCH_UP appointment draws one session from a PackageOrder,
      decrementing remaining_sessions. A booking carrying an
      expected_package_version that no longer matches the PackageOrder's current
      version is rejected: another touch-up booking has already drawn from the
      package (legitimately superseding the remaining-session count the client
      saw), so this client's view of the package is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- dual-variant #1 (Appointment domain) ---
  - name: session_price
    trigger: "Appointment creation (POST /appointments, /appointments/touch-up, annual-refresh booking)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_RATE_CENTS[procedure_type]
      color_surcharge = 0            if color_formula.pigment_count <= 1
                        5000         if color_formula.pigment_count == 2
                        12000        if color_formula.pigment_count >= 3
      corrective_uplift = round_half_up(base * 0.25) if is_corrective else 0
      # evaluation order is pinned: base, then surcharge, then uplift, then sum
      session_price_cents = base + color_surcharge + corrective_uplift
      # ANNUAL_REFRESH override: session_price_cents = round_half_up(base * 0.50) (color surcharge & uplift ignored)
      # REDO override: session_price_cents = 0
    input_set: "single appointment's procedure_type, linked color_formula.pigment_count, is_corrective, appointment_kind"
    constants:
      BASE_RATE_CENTS: { BROWS: 60000, EYELINER: 50000, LIP_BLUSH: 70000 }
      COLOR_SURCHARGE_2: 5000
      COLOR_SURCHARGE_3PLUS: 12000
      CORRECTIVE_UPLIFT_PCT: 0.25
      ANNUAL_REFRESH_PCT: 0.50
    precision: "integer cents, round_half_up at each round_half_up() call"
    variants:
      - name: standard_session
        when: "appointment_kind IN {INITIAL, TOUCH_UP}"
        difference: "full base + color surcharge + optional corrective uplift"
      - name: annual_refresh_session
        when: "appointment_kind == ANNUAL_REFRESH"
        difference: "50% of base only; color surcharge and corrective uplift dropped"

  - name: deposit_amount
    trigger: "Appointment creation, after session_price computed"
    algorithm: threshold
    formula: |
      deposit_required_cents = round_half_up(session_price_cents * DEPOSIT_PCT)
      # REDO appointments: deposit_required_cents = 0 (session_price is 0)
    input_set: "single appointment session_price_cents"
    constants: { DEPOSIT_PCT: 0.20 }
    precision: "integer cents, round_half_up"

  # --- combinatorial mode (b): touch-up package — round-per-line vs sum-then-round ---
  - name: package_price
    trigger: "PackageOrder creation (POST /packages)"
    algorithm: tiered_pricing
    formula: |
      sp = session_price of the source INITIAL appointment (session_price_cents)
      per_touchup_gross = sp * TOUCHUP_PCT          # 0.40 of a full session
      n = included_sessions
      PAYG  (provisional, pay-as-you-go): line = round_half_up(per_touchup_gross); package_price_cents = line * n
            # ROUND-PER-LINE-THEN-SUM
      BUNDLE (final, discounted bundle): gross = per_touchup_gross * n; package_price_cents = round_half_up(gross * (1 - BUNDLE_DISCOUNT_PCT))
            # SUM(multiply)-THEN-ROUND, with 15% bundle discount
      # The two modes pin opposite rounding orders; for the same sp,n they yield different cents.
    input_set: "source appointment session_price_cents, included_sessions, pricing_mode"
    constants: { TOUCHUP_PCT: 0.40, BUNDLE_DISCOUNT_PCT: 0.15 }
    precision: "integer cents; PAYG rounds each line then sums; BUNDLE sums then rounds once"
    variants:
      - name: payg
        when: "pricing_mode == PAYG"
        difference: "round_half_up per touch-up line, then sum (no bundle discount)"
      - name: bundle
        when: "pricing_mode == BUNDLE"
        difference: "sum the products first, apply 15% discount, then round_half_up once"

  # --- dual-variant #2 (Client domain) — different entity than session_price ---
  - name: client_risk_score
    trigger: "Client creation (provisional), PatchTest read (final), and any client medical-field update"
    algorithm: weighted_scoring
    formula: |
      sensitivity = skin_sensitivity_observed  if a PatchTest for this client is READ (skin_sensitivity_observed != null)
                    else skin_sensitivity_self
      risk_score = (W_MEDICAL * medical_flag_count)
                 + (W_ADVERSE * prior_adverse_reactions)
                 + (W_SENS    * sensitivity)
      risk_band  = HIGH_RISK if risk_score >= HIGH_RISK_THRESHOLD else STANDARD
    input_set: "single client medical fields; sensitivity source switches on patch-test read state"
    constants: { W_MEDICAL: 8, W_ADVERSE: 12, W_SENS: 5, HIGH_RISK_THRESHOLD: 30 }
    precision: "integer score, no rounding"
    variants:
      - name: provisional_intake
        when: "no READ PatchTest exists for the client (skin_sensitivity_observed is null)"
        difference: "uses self-reported skin_sensitivity_self"
      - name: final_post_patch_test
        when: "a PatchTest for the client is READ"
        difference: "uses observed reaction grade skin_sensitivity_observed, overriding self-report"

  # --- derived ledgers / aggregations ---
  - name: studio_kit_ledger
    trigger: "appointment start (consume), appointment void (restore), studio read"
    algorithm: aggregation
    formula: |
      sterile_kit_consumed = count(Appointment a WHERE a.studio scope AND a.kit_consumed == true
                                   AND a.lifecycle_status IN {IN_PROCEDURE, HEALING, COMPLETED})
      sterile_kit_available = max(0, sterile_kit_total - sterile_kit_consumed)
      # kit_conservation invariant: sterile_kit_consumed + sterile_kit_available == sterile_kit_total
      #   (holds while sterile_kit_consumed <= sterile_kit_total)
    input_set: "appointments scoped to studio via technician_id -> Technician.studio_id, filtered by kit_consumed and lifecycle_status"
    precision: "integer counts"

  - name: client_no_show_strikes
    trigger: "appointment no-show, client read"
    algorithm: aggregation
    formula: |
      no_show_strikes = count(Appointment a WHERE a.client_id == client.id AND a.lifecycle_status == NO_SHOW)
      client_status = BLOCKED if no_show_strikes >= NO_SHOW_BLOCK_THRESHOLD else ACTIVE
    input_set: "this client's appointments filtered to lifecycle_status == NO_SHOW"
    constants: { NO_SHOW_BLOCK_THRESHOLD: 3 }
    precision: "integer count"

  - name: appointment_deposit_balance
    trigger: "deposit charge, refund, forfeit, balance payment, appointment read"
    algorithm: aggregation
    formula: |
      deposit_paid_cents = sum(t.amount_cents for CHARGE) - sum(t.amount_cents for REFUND)
                           over DepositTransaction t WHERE t.appointment_id == appointment.id
      # FORFEIT does not reduce deposit_paid_cents — the money is kept by the studio, not returned
      balance_due_cents  = session_price_cents - deposit_paid_cents while payment_status IN {AWAITING_DEPOSIT, DEPOSIT_PAID, BALANCE_DUE}
                           0 when payment_status == PAID_IN_FULL
    input_set: "this appointment's DepositTransaction rows by txn_type"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numerics in declared range, FK types match (e.g. appointment.procedure_type == color_formula.procedure_type)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource in a valid source state for the requested transition (lifecycle_status / payment_status / patch status / license_status / redo status / package status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_safety
    check: "Age verification: at booking, (scheduled_start - client.date_of_birth) in whole years >= Studio.min_client_age AND a PHOTO/PROCEDURE consent with age_verified==true exists"
    error_id: ERR_AGE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/touch-up, annual-refresh booking"

  - priority: 7
    category: business_safety
    check: "Consent present: a ConsentRecord of type PROCEDURE_CONSENT for the client must exist before booking; PHOTO_RELEASE required before any photo-flagged operation"
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/touch-up, annual-refresh booking"

  - priority: 8
    category: business_safety
    check: "Patch-test gate: linked PatchTest must be status READ with result PASS; a FAIL or non-READ patch test blocks booking and procedure start"
    error_id: ERR_PATCH_TEST_FAILED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/start"

  - priority: 9
    category: business_temporal
    check: "Cooling-off: scheduled_start must be >= patch_test.applied_at + PATCH_READ_MIN_HOURS (48h)"
    error_id: ERR_COOLING_OFF_VIOLATION
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/touch-up"

  - priority: 10
    category: business_safety
    check: "High-risk gate: if client.risk_band == HIGH_RISK then client.medical_cleared must be true to book"
    error_id: ERR_MEDICAL_CLEARANCE_REQUIRED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/touch-up, annual-refresh booking"

  - priority: 11
    category: business_constraint
    check: "Blocked client: client.client_status must be ACTIVE (not BLOCKED by >=3 no-show strikes) to book"
    error_id: ERR_CLIENT_BLOCKED
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/touch-up, annual-refresh booking"

  - priority: 12
    category: business_safety
    check: "License/posture gate: at procedure start technician.license_status==LICENSE_ACTIVE AND studio.compliance_posture==OPEN"
    error_id: ERR_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /appointments/{id}/start"

  - priority: 13
    category: business_referential
    check: "Touch-up window: a TOUCH_UP appointment's scheduled_start must fall within [source.completed_at + 30d, source.completed_at + 60d]; package must be ACTIVE with remaining_sessions > 0"
    error_id: ERR_TOUCHUP_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appointments/touch-up"

  - priority: 14
    category: business_temporal
    check: "Annual-refresh window: scheduled_start must be >= source.completed_at + ANNUAL_REFRESH_DAYS (365d)"
    error_id: ERR_REFRESH_NOT_DUE
    http_status: 422
    applies_to: "annual-refresh booking (POST /appointments/annual-refresh)"

  - priority: 15
    category: business_referential
    check: "Redo eligibility: source appointment must be COMPLETED with healing_outcome==POOR and current time <= completed_at + REDO_WINDOW_DAYS (90d)"
    error_id: ERR_REDO_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /redo-requests, POST /redo-requests/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "Deposit amount: CHARGE amount_cents must equal appointment.deposit_required_cents; pay-balance amount_cents must equal appointment.balance_due_cents"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /appointments/{id}/deposit, POST /appointments/{id}/pay-balance"

  - priority: 17
    category: business_fiscal
    check: "Kit availability: at procedure start studio.sterile_kit_available >= 1"
    error_id: ERR_NO_STERILE_KIT
    http_status: 422
    applies_to: "POST /appointments/{id}/start"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_<parent>_version must match parent's current version on supersede writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /redo-requests/{id}/schedule, POST /appointments/touch-up"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ----- test-driving clock -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is fixed at 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601; subsequent applied_at/read_at/completed_at/window checks use it"]

  # ----- Studio -----
  - method: POST
    path: "/studios"
    description: "Create the studio"
    roles: [StudioAdmin]
    code: 201
    input: [name, state_code, "min_client_age?", sterile_kit_total]
    output: Studio
    side_effects: ["compliance_posture computed (FROZEN until a LICENSE_ACTIVE technician exists)", "sterile_kit_consumed=0"]
  - method: GET
    path: "/studios/{id}"
    description: "Read studio incl. kit ledger and posture"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: Studio
    side_effects: []

  # ----- Technician -----
  - method: POST
    path: "/technicians"
    description: "Register a technician"
    roles: [StudioAdmin, ComplianceOfficer]
    code: 201
    input: [studio_id, full_name, license_number, bbp_cert_expiry, license_expiry]
    output: Technician
    side_effects: ["license_status=LICENSE_ACTIVE", "Studio.compliance_posture recomputed; Studio.version +1"]
  - method: GET
    path: "/technicians/{id}"
    description: "Read technician"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians"
    description: "List technicians; filter by studio_id"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: POST
    path: "/technicians/{id}/suspend-license"
    description: "Suspend a technician's license"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_studio_version]
    output: Technician
    side_effects:
      - "license_status LICENSE_ACTIVE->LICENSE_SUSPENDED"
      - "cascade: BOOKED appointments of this tech -> VOIDED; kit restore; deposit refund; Studio.compliance_posture recomputed; Studio.version +1"
  - method: POST
    path: "/technicians/{id}/reinstate-license"
    description: "Reinstate a suspended license"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Technician
    side_effects: ["license_status LICENSE_SUSPENDED->LICENSE_ACTIVE", "Studio.compliance_posture recomputed; Studio.version +1"]

  # ----- Client -----
  - method: POST
    path: "/clients"
    description: "Register a client"
    roles: [StudioAdmin, FrontDesk]
    code: 201
    input: [studio_id, full_name, date_of_birth, "medical_flag_count?", "prior_adverse_reactions?", "skin_sensitivity_self?"]
    output: Client
    side_effects: ["risk_score & risk_band computed via client_risk_score provisional variant", "no_show_strikes=0; client_status=ACTIVE; medical_cleared=false"]
  - method: GET
    path: "/clients/{id}"
    description: "Read client incl. risk band, strikes, status"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List clients; filter by studio_id"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/medical-clearance"
    description: "ComplianceOfficer grants medical clearance for a HIGH_RISK client"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Client
    side_effects: ["medical_cleared=true; Client.version +1"]

  # ----- ConsentRecord -----
  - method: POST
    path: "/consent-records"
    description: "Record a signed consent / medical disclosure / photo release"
    roles: [FrontDesk, ComplianceOfficer]
    code: 201
    input: [client_id, consent_type, age_verified, signed_by_name]
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/consent-records/{id}"
    description: "Read a consent record"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/consent-records"
    description: "List consent records; filter by client_id"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []

  # ----- PatchTest -----
  - method: POST
    path: "/patch-tests"
    description: "Apply a patch test on a client (stamps applied_at at logical-clock time)"
    roles: [Technician, FrontDesk]
    code: 201
    input: [client_id]
    output: PatchTest
    side_effects: ["status=APPLIED; applied_at=current logical-clock time"]
  - method: GET
    path: "/patch-tests/{id}"
    description: "Read a patch test"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: PatchTest
    side_effects: []
  - method: GET
    path: "/patch-tests"
    description: "List patch tests; filter by client_id"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: PatchTest[]
    side_effects: []
  - method: POST
    path: "/patch-tests/{id}/read"
    description: "Read patch-test result (>=48h after applied_at)"
    roles: [Technician]
    code: 200
    input: [reaction_grade]
    output: PatchTest
    side_effects: ["status APPLIED->READ; result computed; Client.skin_sensitivity_observed set; Client risk recomputed (FINAL); Client.version +1"]
  - method: POST
    path: "/patch-tests/{id}/void"
    description: "Void an applied patch test"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PatchTest
    side_effects: ["status APPLIED->VOIDED"]

  # ----- ColorFormula -----
  - method: POST
    path: "/color-formulas"
    description: "Create a pigment color formula"
    roles: [StudioAdmin, Technician]
    code: 201
    input: [studio_id, name, procedure_type, pigment_count]
    output: ColorFormula
    side_effects: []
  - method: GET
    path: "/color-formulas/{id}"
    description: "Read a color formula"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: ColorFormula
    side_effects: []
  - method: GET
    path: "/color-formulas"
    description: "List color formulas; filter by studio_id"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: ColorFormula[]
    side_effects: []

  # ----- Appointment -----
  - method: POST
    path: "/appointments"
    description: "Book an INITIAL procedure appointment"
    roles: [FrontDesk]
    code: 201
    input: [client_id, technician_id, color_formula_id, patch_test_id, procedure_type, "is_corrective?", scheduled_start]
    output: Appointment
    side_effects:
      - "lifecycle_status=BOOKED; payment_status=AWAITING_DEPOSIT; appointment_kind=INITIAL"
      - "session_price_cents (session_price), deposit_required_cents (deposit_amount) computed; balance_due_cents=session_price_cents"
  - method: GET
    path: "/appointments/{id}"
    description: "Read an appointment incl. both state dimensions and money fields"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: GET
    path: "/appointments"
    description: "List appointments; filter by client_id, technician_id, color_formula_id, patch_test_id, parent_appointment_id, package_order_id"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: ["client_id?", "technician_id?", "color_formula_id?", "patch_test_id?", "parent_appointment_id?", "package_order_id?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: POST
    path: "/appointments/{id}/deposit"
    description: "Collect the deposit (CHARGE)"
    roles: [FrontDesk]
    code: 200
    input: [amount_cents]
    output: Appointment
    side_effects: ["emit CHARGE DepositTransaction; payment_status AWAITING_DEPOSIT->DEPOSIT_PAID; deposit_paid_cents recomputed"]
  - method: POST
    path: "/appointments/{id}/start"
    description: "Start the procedure (consume sterile kit)"
    roles: [Technician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle BOOKED->IN_PROCEDURE; kit_consumed=true; Studio kit ledger & posture recomputed; Studio.version +1"]
  - method: POST
    path: "/appointments/{id}/finish-procedure"
    description: "Finish the needling work; move to HEALING and BALANCE_DUE"
    roles: [Technician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle IN_PROCEDURE->HEALING; payment DEPOSIT_PAID->BALANCE_DUE; balance_due_cents = session_price_cents - deposit_paid_cents"]
  - method: POST
    path: "/appointments/{id}/pay-balance"
    description: "Pay the remaining balance"
    roles: [FrontDesk]
    code: 200
    input: [amount_cents]
    output: Appointment
    side_effects: ["payment BALANCE_DUE->PAID_IN_FULL; balance_due_cents=0"]
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Complete the appointment after healing follow-up"
    roles: [Technician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle HEALING->COMPLETED; completed_at set; healing_outcome computed from HealingLogs; if appointment_kind==REDO and links a SCHEDULED RedoRequest, that RedoRequest->FULFILLED (cross-entity)"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a BOOKED appointment (refund or forfeit by 48h rule)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle BOOKED->CANCELLED; >=48h pre-start: REFUND, payment->REFUNDED; <48h: FORFEIT, deposit kept"]
  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Mark a BOOKED appointment a no-show after scheduled_start"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle BOOKED->NO_SHOW; FORFEIT deposit; Client.no_show_strikes & client_status recomputed; Client.version +1"]
  - method: POST
    path: "/appointments/{id}/void"
    description: "ComplianceOfficer voids a BOOKED appointment (restores kit, refunds deposit)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle BOOKED->VOIDED; if kit_consumed restore kit & Studio.version +1; if DEPOSIT_PAID emit REFUND, payment->REFUNDED"]
  - method: POST
    path: "/appointments/touch-up"
    description: "Book a TOUCH_UP appointment drawing one session from a PackageOrder (OCC on the package)"
    roles: [FrontDesk]
    code: 201
    input: [package_order_id, technician_id, color_formula_id, patch_test_id, procedure_type, scheduled_start, expected_package_version]
    output: Appointment
    side_effects:
      - "lifecycle_status=BOOKED; payment_status=AWAITING_DEPOSIT; appointment_kind=TOUCH_UP; parent_appointment_id=package.source_appointment_id; package_order_id set"
      - "session_price (standard_session) & deposit computed; PackageOrder.remaining_sessions -1; increments PackageOrder.version by 1; PackageOrder->EXHAUSTED if remaining hits 0"
  - method: POST
    path: "/appointments/annual-refresh"
    description: "Book an ANNUAL_REFRESH appointment off a COMPLETED appointment (>=365d)"
    roles: [FrontDesk]
    code: 201
    input: [parent_appointment_id, technician_id, color_formula_id, patch_test_id, procedure_type, scheduled_start]
    output: Appointment
    side_effects: ["lifecycle=BOOKED; payment=AWAITING_DEPOSIT; appointment_kind=ANNUAL_REFRESH; session_price annual_refresh_session variant; deposit computed"]

  # ----- PackageOrder -----
  - method: POST
    path: "/packages"
    description: "Purchase a touch-up package off a COMPLETED INITIAL appointment"
    roles: [FrontDesk]
    code: 201
    input: [client_id, source_appointment_id, included_sessions, pricing_mode]
    output: PackageOrder
    side_effects: ["status=ACTIVE; remaining_sessions=included_sessions; package_price_cents computed (package_price variant by mode)"]
  - method: GET
    path: "/packages/{id}"
    description: "Read a package order"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: []
    output: PackageOrder
    side_effects: []
  - method: GET
    path: "/packages"
    description: "List packages; filter by client_id, source_appointment_id"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: ["client_id?", "source_appointment_id?", "limit?", "offset?"]
    output: PackageOrder[]
    side_effects: []

  # ----- DepositTransaction (read / reverse-reachability) -----
  - method: GET
    path: "/deposit-transactions/{id}"
    description: "Read a deposit transaction"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: []
    output: DepositTransaction
    side_effects: []
  - method: GET
    path: "/deposit-transactions"
    description: "List deposit transactions; filter by appointment_id"
    roles: [StudioAdmin, FrontDesk, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: DepositTransaction[]
    side_effects: []

  # ----- HealingLog -----
  - method: POST
    path: "/healing-logs"
    description: "Record a healing/aftercare follow-up on a HEALING or COMPLETED appointment"
    roles: [Technician, FrontDesk]
    code: 201
    input: [appointment_id, day_offset, outcome_flag, "notes?"]
    output: HealingLog
    side_effects: ["if appointment is COMPLETED and outcome_flag==POOR, appointment.healing_outcome recomputed to POOR; Appointment.version +1"]
  - method: GET
    path: "/healing-logs/{id}"
    description: "Read a healing log"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: HealingLog
    side_effects: []
  - method: GET
    path: "/healing-logs"
    description: "List healing logs; filter by appointment_id"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: HealingLog[]
    side_effects: []

  # ----- RedoRequest -----
  - method: POST
    path: "/redo-requests"
    description: "Open a redo request against a COMPLETED appointment with POOR healing"
    roles: [FrontDesk, ComplianceOfficer]
    code: 201
    input: [appointment_id, reason]
    output: RedoRequest
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/redo-requests/{id}"
    description: "Read a redo request"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: RedoRequest
    side_effects: []
  - method: GET
    path: "/redo-requests"
    description: "List redo requests; filter by appointment_id (source) or redo_appointment_id (the created REDO appointment)"
    roles: [StudioAdmin, FrontDesk, Technician, ComplianceOfficer]
    code: 200
    input: ["appointment_id?", "redo_appointment_id?", "limit?", "offset?"]
    output: RedoRequest[]
    side_effects: []
  - method: POST
    path: "/redo-requests/{id}/approve"
    description: "Approve a redo request (eligibility re-checked)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RedoRequest
    side_effects: ["status REQUESTED->APPROVED"]
  - method: POST
    path: "/redo-requests/{id}/deny"
    description: "Deny a redo request"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RedoRequest
    side_effects: ["status REQUESTED->DENIED"]
  - method: POST
    path: "/redo-requests/{id}/schedule"
    description: "Schedule the free REDO appointment (OCC on the source appointment)"
    roles: [FrontDesk]
    code: 200
    input: [scheduled_start, technician_id, color_formula_id, patch_test_id, expected_appointment_version]
    output: RedoRequest
    side_effects:
      - "status APPROVED->SCHEDULED"
      - "creates REDO Appointment (session_price_cents=0, deposit_required_cents=0, payment_status=PAID_IN_FULL, lifecycle_status=BOOKED, parent_appointment_id=source); redo_appointment_id set"
      - "increments source Appointment.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range numeric, or procedure_type != color_formula.procedure_type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid source state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match parent's current version (OCC supersede)" }
  - { id: ERR_AGE_NOT_VERIFIED, http: 422, condition: "Client age at scheduled_start < Studio.min_client_age, or no age_verified consent on file" }
  - { id: ERR_CONSENT_MISSING, http: 422, condition: "Required PROCEDURE_CONSENT (or PHOTO_RELEASE for photo ops) not on file for client" }
  - { id: ERR_PATCH_TEST_FAILED, http: 422, condition: "Linked patch test is not READ, or its result is FAIL" }
  - { id: ERR_COOLING_OFF_VIOLATION, http: 422, condition: "scheduled_start earlier than patch_test.applied_at + 48h cooling-off" }
  - { id: ERR_MEDICAL_CLEARANCE_REQUIRED, http: 422, condition: "HIGH_RISK client booked without medical_cleared==true" }
  - { id: ERR_CLIENT_BLOCKED, http: 422, condition: "Client BLOCKED (>=3 no-show strikes) attempting to book" }
  - { id: ERR_LICENSE_INVALID, http: 422, condition: "Procedure start with technician not LICENSE_ACTIVE or studio posture not OPEN" }
  - { id: ERR_NO_STERILE_KIT, http: 422, condition: "Procedure start with studio.sterile_kit_available < 1" }
  - { id: ERR_TOUCHUP_WINDOW_CLOSED, http: 422, condition: "Touch-up scheduled_start outside [completed_at+30d, completed_at+60d] or package not ACTIVE / remaining_sessions==0" }
  - { id: ERR_REFRESH_NOT_DUE, http: 422, condition: "Annual-refresh scheduled_start earlier than completed_at + 365d" }
  - { id: ERR_REDO_NOT_ELIGIBLE, http: 422, condition: "Source appointment not COMPLETED+POOR, or beyond 90d redo window" }
  - { id: ERR_DEPOSIT_AMOUNT_MISMATCH, http: 422, condition: "CHARGE amount != deposit_required_cents, or pay-balance amount != balance_due_cents" }
  - { id: ERR_VALIDATION_RANGE, http: 422, condition: "reaction_grade / skin_sensitivity / pigment_count / sterile_kit_total out of declared numeric range" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioAdmin
    description: "Owner/operator; hierarchical superset. Manages studio, technicians, color formulas, sets the logical clock; can read everything."
    identity: opaque
    exclusive_operations:
      - "POST /studios"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /technicians (with ComplianceOfficer)"
      - "POST /color-formulas (with Technician)"
      - "POST /clients (with FrontDesk)"
      - "GET on all resources"

  - name: FrontDesk
    description: "Reception/scheduling/payments. Owns clients, consents, bookings, deposits, balances, cancellations, no-shows, packages, redo scheduling."
    identity: opaque
    exclusive_operations:
      - "POST /appointments"
      - "POST /appointments/touch-up"
      - "POST /appointments/annual-refresh"
      - "POST /appointments/{id}/deposit"
      - "POST /appointments/{id}/pay-balance"
      - "POST /appointments/{id}/cancel"
      - "POST /appointments/{id}/no-show"
      - "POST /packages"
      - "POST /redo-requests/{id}/schedule"
    shared_operations:
      - "POST /clients (with StudioAdmin)"
      - "POST /consent-records (with ComplianceOfficer)"
      - "POST /patch-tests (with Technician)"
      - "POST /healing-logs (with Technician)"
      - "POST /redo-requests (with ComplianceOfficer)"
      - "GET on most resources"

  - name: Technician
    description: "Clinical operator. Owns patch-test reads, procedure start/finish/complete, color formulas, healing logs."
    identity: entity_backed:Technician
    exclusive_operations:
      - "POST /patch-tests/{id}/read"
      - "POST /appointments/{id}/start"
      - "POST /appointments/{id}/finish-procedure"
      - "POST /appointments/{id}/complete"
    shared_operations:
      - "POST /color-formulas (with StudioAdmin)"
      - "POST /patch-tests (with FrontDesk)"
      - "POST /healing-logs (with FrontDesk)"
      - "GET on clinical resources"

  - name: ComplianceOfficer
    description: "Regulatory authority. Owns license suspend/reinstate, patch-test void, appointment void, medical clearance, redo approve/deny. Segregation: cannot book or take payment."
    identity: opaque
    exclusive_operations:
      - "POST /technicians/{id}/suspend-license"
      - "POST /technicians/{id}/reinstate-license"
      - "POST /patch-tests/{id}/void"
      - "POST /appointments/{id}/void"
      - "POST /clients/{id}/medical-clearance"
      - "POST /redo-requests/{id}/approve"
      - "POST /redo-requests/{id}/deny"
    shared_operations:
      - "POST /technicians (with StudioAdmin)"
      - "POST /consent-records (with FrontDesk)"
      - "POST /redo-requests (with FrontDesk)"
      - "GET on all resources"
