              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "PUBLIC_RECORD" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a1_id: $.data.id }
            - call: "POST /advancement/assessments/${a1_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { a1_adj: $.data.adjusted_capacity_cents, a1_band: $.data.capacity_band_result, a1_aff: $.data.affinity_score_result }
            - call: "POST /advancement/prospects"
              payload: { full_name: "P2", prospect_type: "INDIVIDUAL", contact_email: "p2@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p2_id: $.data.id }
            - call: "POST /advancement/prospects/${p2_id}/assessments"
              payload: { assessed_capacity_cents: 100000000, engagement_score: 50, philanthropy_score: 50, recency_score: 50, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a2_id: $.data.id }
            - call: "POST /advancement/assessments/${a2_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { a2_band: $.data.capacity_band_result }
            - call: "POST /advancement/prospects"
              payload: { full_name: "P3", prospect_type: "INDIVIDUAL", contact_email: "p3@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p3_id: $.data.id }
            - call: "POST /advancement/prospects/${p3_id}/assessments"
              payload: { assessed_capacity_cents: 99999999, engagement_score: 50, philanthropy_score: 50, recency_score: 50, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a3_id: $.data.id }
          trigger:
            - call: "POST /advancement/assessments/${a3_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { a3_band: $.data.capacity_band_result }
          assert:
            - "a1_adj == 24000000  # floor(30000000 * 0.8) PUBLIC_RECORD multiplier"
            - "a1_band == \"D\"  # 24000000 < BAND_C_MIN 25000000"
            - "a1_aff == 73  # round_half_up(0.5*80 + 0.3*70 + 0.2*60)"
            - "a2_band == \"B\"  # exactly BAND_B_MIN 100000000 qualifies (>=)"
            - "a3_band == \"C\"  # one cent below"

