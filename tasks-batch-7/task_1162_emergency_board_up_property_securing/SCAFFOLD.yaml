# =============================================================================
# Task 1162 — Emergency Board-Up & Property Securing — Seed Tables
# =============================================================================

scenario: |
  1162. Emergency Board-Up & Property Securing (emergency board-up contractor): dispatch after fire/storm/vandalism & response time, scope (board/tarp/fence) & material measurement, safety assessment & structural hazard identification, temporary power/lighting & security patrol, documentation for insurance billing, permit/notification requirements in some jurisdictions, removal after permanent repair, subcontractor network coverage by market

domain_name: emergency-board-up
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy            # dispatch picks one subcontractor from a coverage pool
    - optimistic_concurrency     # OCC on Job.version (scope adds) and DocumentPackage.version (artifact adds)
    - dual_variant_calculation   # provisional vs final invoice; lenient vs strict reliability
    - cascading_side_effects     # patrol-miss breach chain; subcontractor suspension chain
  entity_topology: graph         # peer resources + many-to-many Coverage junction + cross-aggregate FKs
  state_machine_shape: cyclic    # Job SECURED->BREACH_HOLD->ON_SITE->SECURED; Invoice SUBMITTED<->DISPUTED; TemporaryService ACTIVE<->PAUSED; Assignment forks
  relationship_patterns:
    - one_to_many                # Job -> ScopeItem / TemporaryService / PermitCase / Invoice ...
    - many_to_many               # Subcontractor <-> Market via Coverage
    - cross_aggregate            # Invoice gates on DocumentPackage + PermitCase; Job gates on SafetyAssessment
  role_model: segregation_of_duties   # safety assessor MUST differ from the assigned securing subcontractor
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market display name" }
      - { name: code, type: string, source: input, description: "Unique market code, e.g. SEA", constraints: "unique across markets" }
      - { name: sla_minutes_p1, type: integer, source: input, description: "Response SLA minutes for P1 jobs" }
      - { name: sla_minutes_p2, type: integer, source: input, description: "Response SLA minutes for P2 jobs" }
      - { name: sla_minutes_p3, type: integer, source: input, description: "Response SLA minutes for P3 jobs" }
      - { name: permit_required, type: boolean, source: input, description: "Jurisdiction requires a board-up permit before insurance billing" }
      - { name: notification_required, type: boolean, source: input, description: "Jurisdiction requires municipal notification after securing" }
      - { name: notification_deadline_hours, type: integer, source: input, description: "Hours after secured_at within which notification must be filed" }
      - { name: late_notification_fee_cents, type: integer, source: input, description: "Penalty billed once on the first invoice created after a late filing" }
      - { name: board_rate_per_sheet_cents, type: integer, source: input, description: "Rate per 4x8 plywood sheet installed" }
      - { name: tarp_rate_per_sqft_cents, type: integer, source: input, description: "Rate per tarped square foot" }
      - { name: fence_rate_per_linear_ft_cents, type: integer, source: input, description: "Rate per linear foot of temporary fence" }
      - { name: patrol_visit_fee_cents, type: integer, source: input, description: "Base fee per patrol visit before priority multiplier" }
      - { name: temp_power_daily_rate_cents, type: integer, source: input, description: "Daily rate for temporary power service" }
      - { name: temp_lighting_daily_rate_cents, type: integer, source: input, description: "Daily rate for temporary lighting service" }
      - { name: generator_pool_units, type: integer, source: input, description: "Aggregate generator units available market-wide (concurrent POWER services cap)" }
      - { name: removal_flat_fee_cents, type: integer, source: input, description: "Flat fee billed on FINAL invoice for board-up removal" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Subcontractor company name" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — toggled via PATCH; suspension cascades to open assignments", constraints: "ACTIVE | SUSPENDED" }
      - { name: completed_job_count, type: integer, source: computed, default: 0, description: "Assignments COMPLETED with sla_breach == false" }
      - { name: breached_job_count, type: integer, source: computed, default: 0, description: "Assignments COMPLETED with sla_breach == true" }
      - { name: expired_offer_count, type: integer, source: computed, default: 0, description: "Offers that lapsed OFFERED -> EXPIRED without response" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "count of own Assignments with status IN {ACCEPTED, ARRIVED}" }
      - { name: reliability_score_lenient, type: number, source: computed, description: "completed_job_count / (completed_job_count + breached_job_count); 1.0000 when denominator is 0; 4 dp round_half_up" }
      - { name: reliability_score_strict, type: number, source: computed, description: "completed_job_count / (completed_job_count + breached_job_count + expired_offer_count); 1.0000 when denominator is 0; 4 dp round_half_up" }

  - name: Coverage
    parent: null
    common_fields: true
    fields:
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; covered subcontractor" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; covered market" }
      - { name: max_concurrent_jobs, type: integer, source: input, description: "Cap on this subcontractor's active assignments in this market" }
      - { name: rank, type: integer, source: input, description: "Dispatcher-pinned preference within the market; lower is preferred" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | SUSPENDED — mirrors subcontractor.status", constraints: "ACTIVE | SUSPENDED" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Contact name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: kind, type: enum, source: input, description: "OWNER | ADJUSTER", constraints: "OWNER | ADJUSTER" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; jurisdiction market" }
      - { name: address_line, type: string, source: input, description: "Street address" }
      - { name: wind_zone, type: enum, source: input, description: "LOW | HIGH — HIGH doubles BOARD sheet quantities", constraints: "LOW | HIGH" }

  - name: Job
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; damaged property" }
      - { name: customer_id, type: string, source: computed, description: "FK -> Customer.id; derived from property.customer_id — any client-supplied value is ignored" }
      - { name: incident_type, type: enum, source: input, description: "FIRE | STORM | VANDALISM", constraints: "FIRE | STORM | VANDALISM" }
      - { name: priority, type: enum, source: input, description: "P1 | P2 | P3 — selects SLA minutes and emergency multiplier", constraints: "P1 | P2 | P3" }
      - { name: sla_minutes, type: integer, source: computed, description: "Snapshot of market sla_minutes_<priority> at creation" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical clock of the most recent INTAKE -> DISPATCHED transition" }
      - { name: secured_at, type: datetime, source: system, description: "Logical clock when work_status entered SECURED" }
      - { name: work_status, type: enum, source: system, description: "INTAKE | DISPATCHED | ON_SITE | SECURED | BREACH_HOLD | READY_FOR_REMOVAL | REMOVED | CLOSED", constraints: "see Job state machine" }
      - { name: safety_cleared, type: boolean, source: system, default: false, description: "True once a SafetyAssessment reaches CLEARED; reset to false on breach" }
      - { name: compliance_breach, type: boolean, source: system, default: false, description: "Latched true when a NOTIFICATION PermitCase expires unfiled; cleared by a late filing (penalty still bills)" }
      - { name: total_planned_sheets, type: integer, source: computed, default: 0, description: "Sum of planned_qty over own ScopeItems with kind BOARD and status IN {PLANNED, INSTALLED}" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; job this offer belongs to" }
      - { name: subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id; offeree" }
      - { name: offer_seq, type: integer, source: system, description: "Per-job monotone offer sequence, starts at 1" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | ARRIVED | COMPLETED | DECLINED | EXPIRED | CANCELLED", constraints: "see Assignment state machine" }
      - { name: offered_at, type: datetime, source: system, description: "Logical clock at offer creation" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "= offered_at + OFFER_EXPIRY_MINUTES (30)" }
      - { name: responded_at, type: datetime, source: system, description: "Logical clock of respond, when answered" }
      - { name: arrived_at, type: datetime, source: system, description: "Logical clock of crew check-in" }
      - { name: response_minutes, type: integer, source: computed, description: "= floor((arrived_at - dispatched_at of job) / 60 seconds), set at check-in" }
      - { name: sla_breach, type: boolean, source: computed, description: "true iff response_minutes > job.sla_minutes; exactly equal is compliant" }

  - name: SafetyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; assessed job" }
      - { name: assessor_subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id; equals X-User-ID of creator — MUST differ from the job's assigned subcontractor (segregation of duties)" }
      - { name: hazards, type: array, source: input, description: "List of hazard enums found on site", constraints: "members of COLLAPSE | ELECTRICAL | GAS | WATER | ASBESTOS" }
      - { name: structural_risk_score, type: integer, source: computed, description: "min(100, sum of HAZARD_WEIGHTS over hazards)" }
      - { name: hazard_level, type: enum, source: computed, description: "HIGH when score >= 70; MODERATE when 30 <= score < 70; LOW when score < 30", constraints: "LOW | MODERATE | HIGH" }
      - { name: moderate_ppe_required, type: boolean, source: computed, description: "true iff hazard_level == MODERATE" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | MITIGATION_REQUIRED | CLEARED | SUPERSEDED", constraints: "see SafetyAssessment state machine" }
      - { name: mitigation_note, type: string, source: input, description: "Set by mitigate action" }

  - name: ScopeItem
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; owning job" }
      - { name: kind, type: enum, source: input, description: "BOARD | TARP | FENCE", constraints: "BOARD | TARP | FENCE" }
      - { name: opening_count, type: integer, source: input, description: "BOARD: number of openings" }
      - { name: width_in, type: number, source: input, description: "BOARD: per-opening width in inches" }
      - { name: height_in, type: number, source: input, description: "BOARD: per-opening height in inches" }
      - { name: door_count, type: integer, source: input, default: 0, description: "BOARD: openings that are doors (+1 framing sheet each)" }
      - { name: length_ft, type: number, source: input, description: "TARP: damaged roof length in feet" }
      - { name: width_ft, type: number, source: input, description: "TARP: damaged roof width in feet" }
      - { name: linear_ft, type: number, source: input, description: "FENCE: perimeter feet" }
      - { name: planned_qty, type: number, source: computed, description: "BOARD: sheets via material formula; TARP: ceil(length_ft*width_ft*1.25) sqft; FENCE: linear_ft" }
      - { name: unit, type: enum, source: computed, description: "SHEETS for BOARD | SQFT for TARP | LINEAR_FT for FENCE", constraints: "SHEETS | SQFT | LINEAR_FT" }
      - { name: actual_qty, type: number, source: computed, description: "Same formula applied to the measurements supplied at install" }
      - { name: status, type: enum, source: system, description: "PLANNED | INSTALLED | VOIDED", constraints: "PLANNED | INSTALLED | VOIDED" }

  - name: TemporaryService
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; serviced job" }
      - { name: kind, type: enum, source: input, description: "POWER | LIGHTING | PATROL", constraints: "POWER | LIGHTING | PATROL" }
      - { name: starts_at, type: datetime, source: input, description: "Requested service window start" }
      - { name: ends_at, type: datetime, source: input, description: "Requested service window end (must be after starts_at)" }
      - { name: generator_units, type: integer, source: input, default: 1, description: "POWER only: generator units drawn from the market pool" }
      - { name: daily_rate_cents, type: integer, source: computed, description: "Snapshot of market temp_power_daily_rate_cents / temp_lighting_daily_rate_cents; 0 for PATROL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | COMPLETED", constraints: "ACTIVE | PAUSED | COMPLETED" }
      - { name: deactivated_at, type: datetime, source: system, description: "Logical clock of deactivation" }
      - { name: billable_days, type: integer, source: computed, description: "= max(1, ceil(active_seconds / 86400)) where active_seconds = min(ends_at, deactivated_at) - starts_at; paused time still bills (equipment on site)" }
      - { name: service_total_cents, type: integer, source: computed, description: "= billable_days * daily_rate_cents, computed at deactivation; 0 for PATROL (patrol bills per visit)" }

  - name: PatrolVisit
    parent: null
    common_fields: true
    fields:
      - { name: temporary_service_id, type: string, source: system, description: "FK -> TemporaryService.id; parent service must have kind PATROL" }
      - { name: window_start, type: datetime, source: input, description: "Half-open visit window start" }
      - { name: window_end, type: datetime, source: input, description: "Half-open visit window end (must be after window_start and strictly after current clock at creation)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CHECKED_IN | MISSED", constraints: "SCHEDULED | CHECKED_IN | MISSED" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock of check-in" }
      - { name: fee_cents, type: integer, source: computed, description: "= round_half_up(market.patrol_visit_fee_cents * job priority multiplier), computed per visit at creation" }

  - name: PermitCase
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; subject job" }
      - { name: kind, type: enum, source: input, description: "PERMIT | NOTIFICATION", constraints: "PERMIT | NOTIFICATION" }
      - { name: status, type: enum, source: system, description: "PENDING | FILED | APPROVED | REJECTED | EXPIRED", constraints: "see PermitCase state machine" }
      - { name: deadline_at, type: datetime, source: computed, description: "NOTIFICATION only: = job.secured_at + market.notification_deadline_hours; null for PERMIT" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock of filing" }
      - { name: confirmation_number, type: string, source: input, description: "Municipal confirmation number recorded by file action" }
      - { name: is_late, type: boolean, source: computed, description: "NOTIFICATION: true iff filed_at > deadline_at; PERMIT: always false" }
      - { name: penalty_billed, type: boolean, source: system, default: false, description: "Set true once market.late_notification_fee_cents has been billed on an invoice" }
      - { name: decision_note, type: string, source: input, description: "Recorded by record-decision" }

  - name: DocumentPackage
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; exactly one package per job" }
      - { name: photo_count, type: integer, source: computed, default: 0, description: "Count of PHOTO artifacts" }
      - { name: authorization_signed, type: boolean, source: computed, default: false, description: "True once an AUTHORIZATION artifact exists" }
      - { name: measurement_sheet_recorded, type: boolean, source: computed, default: false, description: "True once a MEASUREMENT_SHEET artifact exists" }
      - { name: required_photo_count, type: integer, source: computed, default: 0, description: "= 2 * count of job ScopeItems with status INSTALLED; recomputed on install/void" }
      - { name: status, type: enum, source: system, description: "INCOMPLETE | COMPLETE | LOCKED | AMENDED", constraints: "see DocumentPackage state machine" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: job_id, type: string, source: system, description: "FK -> Job.id; billed job" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL (planned quantities, job SECURED) | FINAL (actual quantities + services + removal, job REMOVED)", constraints: "PROVISIONAL | FINAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DISPUTED | PAID", constraints: "see Invoice state machine" }
      - { name: lines, type: array, source: computed, description: "Snapshot line objects {label, quantity, unit, rate_cents, multiplier, line_cents} computed at creation" }
      - { name: work_subtotal_cents, type: integer, source: computed, description: "Sum of rounded BOARD/TARP/FENCE lines" }
      - { name: service_subtotal_cents, type: integer, source: computed, description: "FINAL only: completed POWER/LIGHTING service totals + sum of terminal patrol visit fees; 0 on PROVISIONAL" }
      - { name: removal_fee_cents, type: integer, source: computed, description: "FINAL only: market.removal_flat_fee_cents; 0 on PROVISIONAL" }
      - { name: penalty_cents, type: integer, source: computed, description: "market.late_notification_fee_cents when an unbilled late FILED notification exists on the job; marks penalty_billed" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(work_subtotal_cents * tier_pct) where tier is keyed on pre_discount_total_cents" }
      - { name: pre_discount_total_cents, type: integer, source: computed, description: "= work_subtotal + service_subtotal + removal_fee + penalty" }
      - { name: total_cents, type: integer, source: computed, description: "= pre_discount_total_cents - discount_cents" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock of first submission" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock of payment" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Subcontractor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /subcontractors/{id} with status SUSPENDED"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All own Assignments with status IN {OFFERED, ACCEPTED, ARRIVED} -> CANCELLED (each cancellation itself cascades to its Job; expired_offer_count not incremented)"
          - "Own Coverage rows -> SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /subcontractors/{id} with status ACTIVE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Own Coverage rows -> ACTIVE"
          - "Previously CANCELLED assignments are NOT resurrected"

  - entity: Job
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: DISPATCHED
        trigger: "POST /jobs/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "work_status == INTAKE (ERR_INVALID_STATE / ERR_ALREADY_TERMINAL otherwise — dispatching a non-INTAKE job is rejected before any pool check)"
          - "Manual subcontractor_id given: subcontractor ACTIVE (ERR_SUBCONTRACTOR_SUSPENDED), has Coverage in job market (ERR_MARKET_MISMATCH), active_assignment_count < coverage.max_concurrent_jobs (ERR_CAPACITY_FULL)"
          - "No subcontractor_id given: selector pool non-empty (ERR_NO_COVERAGE)"
        side_effects:
          - "Create Assignment OFFERED offer_seq = 1 + max prior offer_seq for this job; subcontractor chosen by dispatch_selection when not pinned"
          - "dispatched_at = clock; job.version += 1"
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /jobs/{id}/check-in"
        actor: Subcontractor
        preconditions:
          - "Caller X-User-ID equals the subcontractor_id of this job's ACCEPTED Assignment (ERR_NOT_ASSIGNEE)"
        side_effects:
          - "That Assignment ACCEPTED -> ARRIVED; arrived_at = clock"
          - "response_minutes and sla_breach computed"
          - "job.version += 1"
      - from: ON_SITE
        to: SECURED
        trigger: "POST /jobs/{id}/complete-securing"
        actor: Subcontractor
        preconditions:
          - "Caller is the assignee subcontractor of this job (ERR_NOT_ASSIGNEE)"
          - "job.safety_cleared == true (ERR_HAZARD_NOT_MITIGATED)"
          - "At least one ScopeItem with status != VOIDED exists (ERR_SCOPE_EMPTY)"
          - "Every ScopeItem with status != VOIDED has status INSTALLED (ERR_SCOPE_ITEMS_PENDING)"
        side_effects:
          - "secured_at = clock"
          - "ARRIVED Assignment -> COMPLETED; subcontractor completed_job_count += 1 when sla_breach == false else breached_job_count += 1"
          - "Own TemporaryServices with status PAUSED -> ACTIVE (resume after breach)"
          - "job.version += 1"
      - from: SECURED
        to: BREACH_HOLD
        trigger: "system (automatic when a TemporaryService of this job transitions ACTIVE -> PAUSED because a PatrolVisit was marked MISSED)"
        actor: system
        preconditions: []
        side_effects:
          - "safety_cleared = false (a fresh assessment is required before re-securing)"
          - "Every OTHER TemporaryService of this job with status ACTIVE -> PAUSED (third hop of the patrol-miss cascade)"
          - "job.version += 1"
      - from: BREACH_HOLD
        to: ON_SITE
        trigger: "system (automatic when a new SafetyAssessment of this job reaches CLEARED)"
        actor: system
        preconditions: []
        side_effects: ["job.version += 1"]
      - from: DISPATCHED
        to: INTAKE
        trigger: "system (automatic when the last open offer of this job reaches DECLINED, EXPIRED or CANCELLED and the re-offer selector pool is empty)"
        actor: system
        preconditions: []
        side_effects: ["job.version += 1"]
      - from: ON_SITE
        to: INTAKE
        trigger: "system (automatic when this job's ACCEPTED or ARRIVED Assignment is CANCELLED by subcontractor suspension and the re-offer selector pool is empty)"
        actor: system
        preconditions: []
        side_effects: ["job.version += 1"]
      - from: SECURED
        to: READY_FOR_REMOVAL
        trigger: "POST /jobs/{id}/verify-repair with outcome VERIFIED"
        actor: Customer
        preconditions: ["Caller X-User-ID == job.customer_id (ERR_FORBIDDEN otherwise)"]
        side_effects: ["job.version += 1"]
      - from: READY_FOR_REMOVAL
        to: SECURED
        trigger: "POST /jobs/{id}/verify-repair with outcome REJECTED"
        actor: Customer
        preconditions: ["Caller X-User-ID == job.customer_id (ERR_FORBIDDEN otherwise)"]
        side_effects: ["job.version += 1"]
        note: "Customer retracts permanent-repair verification; securing stays in place"
      - from: READY_FOR_REMOVAL
        to: REMOVED
        trigger: "POST /jobs/{id}/record-removal"
        actor: Subcontractor
        preconditions:
          - "Caller is the assignee subcontractor of this job (ERR_NOT_ASSIGNEE)"
          - "No TemporaryService of this job with status IN {ACTIVE, PAUSED} (ERR_SERVICES_STILL_ACTIVE)"
        side_effects: ["job.version += 1"]
      - from: REMOVED
        to: CLOSED
        trigger: "POST /jobs/{id}/close"
        actor: Dispatcher
        preconditions:
          - "At least one FINAL Invoice exists for this job and every Invoice of this job has status PAID (ERR_INVOICES_UNPAID)"
        side_effects: ["job.version += 1"]

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/respond with outcome ACCEPT"
        actor: Subcontractor
        preconditions:
          - "Caller X-User-ID == assignment.subcontractor_id (ERR_NOT_ASSIGNEE)"
          - "clock <= offer_expires_at; if clock > offer_expires_at the assignment first transitions to EXPIRED and the call fails (ERR_OFFER_EXPIRED)"
        note: "A suspended subcontractor never reaches this check — suspension already cancelled its open offers, so respond then fails as ERR_ALREADY_TERMINAL"
        side_effects: ["responded_at = clock; active_assignment_count of subcontractor recomputed (+1)"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/respond with outcome DECLINE"
        actor: Subcontractor
        preconditions: ["Caller X-User-ID == assignment.subcontractor_id (ERR_NOT_ASSIGNEE)"]
        side_effects:
          - "responded_at = clock"
          - "Auto re-offer: run dispatch_selection for the job excluding subcontractors with a DECLINED/EXPIRED/CANCELLED offer on this job; on success create next OFFERED Assignment (job stays DISPATCHED); on empty pool job DISPATCHED -> INTAKE"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (lazy: a respond or withdraw arriving when clock > offer_expires_at transitions the offer to EXPIRED and the triggering call fails with ERR_OFFER_EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "subcontractor.expired_offer_count += 1"
          - "Same auto re-offer cascade as DECLINED"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /assignments/{id}/withdraw OR subcontractor suspension cascade"
        actor: Dispatcher
        preconditions: ["Withdraw when clock > offer_expires_at takes the EXPIRED path instead"]
        side_effects: ["Same auto re-offer cascade as DECLINED (withdrawn subcontractor excluded from retry)"]
      - from: ACCEPTED
        to: ARRIVED
        trigger: "system (via POST /jobs/{id}/check-in on the parent job)"
        actor: Subcontractor
        preconditions: []
        side_effects: ["arrived_at, response_minutes, sla_breach computed"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /assignments/{id}/withdraw OR subcontractor suspension cascade"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "active_assignment_count of subcontractor recomputed (-1)"
          - "Job re-offer cascade runs; on empty pool job -> INTAKE"
      - from: ARRIVED
        to: COMPLETED
        trigger: "system (via POST /jobs/{id}/complete-securing on the parent job)"
        actor: Subcontractor
        preconditions: []
        side_effects: ["subcontractor completion counters incremented per sla_breach; active_assignment_count recomputed (-1)"]
      - from: ARRIVED
        to: CANCELLED
        trigger: "subcontractor suspension cascade only"
        actor: system
        preconditions: []
        side_effects: ["active_assignment_count recomputed (-1); job ON_SITE -> INTAKE when no re-offer possible"]

  - entity: SafetyAssessment
    initial_state: SUBMITTED
    terminal_states: [CLEARED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: MITIGATION_REQUIRED
        trigger: "system (automatic on creation when structural_risk_score >= 70)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CLEARED
        trigger: "system (automatic on creation when structural_risk_score < 70)"
        actor: system
        preconditions: []
        side_effects:
          - "job.safety_cleared = true"
          - "If job.work_status == BREACH_HOLD: job BREACH_HOLD -> ON_SITE"
      - from: MITIGATION_REQUIRED
        to: CLEARED
        trigger: "POST /safety-assessments/{id}/mitigate"
        actor: Subcontractor
        preconditions: ["Caller X-User-ID == assessment.assessor_subcontractor_id (ERR_FORBIDDEN otherwise)"]
        side_effects:
          - "mitigation_note recorded"
          - "job.safety_cleared = true"
          - "If job.work_status == BREACH_HOLD: job BREACH_HOLD -> ON_SITE"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (automatic when a newer SafetyAssessment is created for the same job)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MITIGATION_REQUIRED
        to: SUPERSEDED
        trigger: "system (automatic when a newer SafetyAssessment is created for the same job)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScopeItem
    initial_state: PLANNED
    terminal_states: [INSTALLED, VOIDED]
    transitions:
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /scope-items/{id}/install"
        actor: Subcontractor
        preconditions:
          - "Caller is the assignee subcontractor of the parent job (ERR_NOT_ASSIGNEE)"
          - "Parent job work_status == ON_SITE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "actual_qty computed from supplied measurements"
          - "DocumentPackage.required_photo_count recomputed when a package exists"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /scope-items/{id}/void"
        actor: Dispatcher
        preconditions: ["Parent job work_status IN {INTAKE, DISPATCHED, ON_SITE, BREACH_HOLD} (ERR_INVALID_STATE otherwise)"]
        side_effects: ["Job.total_planned_sheets recomputed; DocumentPackage.required_photo_count recomputed when a package exists"]

  - entity: TemporaryService
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "system (a PatrolVisit of this service was marked MISSED, or the parent job entered BREACH_HOLD)"
        actor: system
        preconditions: []
        side_effects: ["When caused by a MISSED visit: this transition itself drives Job SECURED -> BREACH_HOLD"]
      - from: PAUSED
        to: ACTIVE
        trigger: "system (parent job completed securing again)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /temporary-services/{id}/deactivate"
        actor: Dispatcher
        preconditions: []
        side_effects: ["deactivated_at = clock; billable_days and service_total_cents computed"]
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /temporary-services/{id}/deactivate"
        actor: Dispatcher
        preconditions: []
        side_effects: ["deactivated_at = clock; billable_days and service_total_cents computed"]

  - entity: PatrolVisit
    initial_state: SCHEDULED
    terminal_states: [CHECKED_IN, MISSED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /patrol-visits/{id}/check-in with outcome CHECKED_IN"
        actor: Subcontractor
        preconditions:
          - "Caller is the assignee subcontractor of the parent job (ERR_NOT_ASSIGNEE)"
          - "window_start <= clock < window_end (ERR_VISIT_NOT_DUE)"
        side_effects: ["checked_in_at = clock"]
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /patrol-visits/{id}/check-in with outcome MISSED"
        actor: Subcontractor
        preconditions:
          - "Caller is the assignee subcontractor of the parent job (ERR_NOT_ASSIGNEE)"
          - "clock >= window_end (ERR_VISIT_NOT_DUE)"
        side_effects:
          - "Parent TemporaryService ACTIVE -> PAUSED (hop 1 of the breach cascade)"
          - "Spawn replacement PatrolVisit SCHEDULED with window shifted +24h (window_start+24h, window_end+24h), same fee recomputed at creation"
          - "Cascade then continues: service PAUSED -> job SECURED -> BREACH_HOLD -> other ACTIVE services -> PAUSED"

  - entity: PermitCase
    initial_state: PENDING
    terminal_states: [FILED, APPROVED, REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /permit-cases/{id}/file"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "filed_at = clock; is_late computed (NOTIFICATION: filed_at > deadline_at)"
          - "When is_late: job.compliance_breach is cleared (set false); the penalty remains billable via penalty_billed == false"
      - from: FILED
        to: APPROVED
        trigger: "POST /permit-cases/{id}/record-decision with decision APPROVED"
        actor: PlatformAdmin
        preconditions: ["kind == PERMIT (ERR_INVALID_STATE for NOTIFICATION, whose FILED is terminal)"]
        side_effects: []
      - from: FILED
        to: REJECTED
        trigger: "POST /permit-cases/{id}/record-decision with decision REJECTED"
        actor: PlatformAdmin
        preconditions: ["kind == PERMIT"]
        side_effects: []
        note: "REJECTED is terminal for the case; the dispatcher may create a replacement PERMIT case once no open case of that kind exists"
      - from: PENDING
        to: EXPIRED
        trigger: "system (NOTIFICATION only: evaluated when POST /_clock/set_current_utc advances the clock past deadline_at, and lazily when the case is read or when an invoice submission checks it)"
        actor: system
        preconditions: ["clock > deadline_at while still PENDING"]
        side_effects: ["job.compliance_breach = true"]

  - entity: DocumentPackage
    initial_state: INCOMPLETE
    terminal_states: []
    transitions:
      - from: INCOMPLETE
        to: COMPLETE
        trigger: "system (automatic on artifact add when authorization_signed AND measurement_sheet_recorded AND photo_count >= required_photo_count)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPLETE
        to: LOCKED
        trigger: "system (automatic when an Invoice of the parent job transitions DRAFT -> SUBMITTED or DISPUTED -> SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: AMENDED
        trigger: "system (automatic when the submitted Invoice is DISPUTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AMENDED
        to: LOCKED
        trigger: "system (automatic on invoice resubmission)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /invoices/{id}/submit"
        actor: Dispatcher
        preconditions:
          - "If market.permit_required: a PERMIT PermitCase of the job with status APPROVED exists (ERR_PERMIT_NOT_APPROVED)"
          - "DocumentPackage of the job has status IN {COMPLETE, LOCKED, AMENDED} — i.e. completeness was reached at least once; only INCOMPLETE fails (ERR_DOCS_INCOMPLETE)"
          - "If market.notification_required: no NOTIFICATION case still PENDING (ERR_NOTIFICATION_PENDING) and job.compliance_breach == false (ERR_NOTIFICATION_DEADLINE_EXPIRED)"
          - "FINAL variant: work_subtotal_cents <= round_half_up(provisional work_subtotal_cents * 1.20) unless variance_override == true (ERR_VARIANCE_CAP_EXCEEDED)"
        side_effects:
          - "submitted_at = clock"
          - "DocumentPackage COMPLETE -> LOCKED"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: Customer
        preconditions: ["Caller X-User-ID == job.customer_id (ERR_FORBIDDEN otherwise)"]
        side_effects: ["DocumentPackage LOCKED -> AMENDED"]
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /invoices/{id}/submit"
        actor: Dispatcher
        preconditions: ["Same gate set as DRAFT -> SUBMITTED"]
        side_effects: ["DocumentPackage AMENDED -> LOCKED"]
      - from: SUBMITTED
        to: PAID
        trigger: "POST /invoices/{id}/record-payment"
        actor: Dispatcher
        preconditions: []
        side_effects: ["paid_at = clock"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: scope-add-stale-job
    parent_entity: Job
    write_endpoint: "POST /jobs/{id}/scope-items"
    occ_field: expected_job_version
    description: |
      Adding a ScopeItem to a Job whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just added or voided a scope line (each of which legitimately advances
      Job.version) and the current writer's view of the job's scope is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: artifact-add-stale-package
    parent_entity: DocumentPackage
    write_endpoint: "POST /document-packages/{id}/artifacts"
    occ_field: expected_package_version
    description: |
      Adding an artifact to a DocumentPackage whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just added an artifact (each add legitimately advances
      DocumentPackage.version) and the current writer's completeness view is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: scope_planned_quantity
    trigger: "ScopeItem creation (planned_qty) and install (actual_qty, same formula over the supplied measurements)"
    algorithm: aggregation
    formula: |
      BOARD:
        area_sqft_total = opening_count * width_in * height_in / 144
        base_sheets = ceil(area_sqft_total / 32)
        framing = door_count * 1
        sheets = base_sheets + framing
        if property.wind_zone == HIGH: sheets = sheets * 2
        if opening_count > 0: sheets = max(sheets, 1)
        planned_qty = sheets  (unit SHEETS)
      TARP:  planned_qty = ceil(length_ft * width_ft * 1.25)  (unit SQFT)
      FENCE: planned_qty = linear_ft  (unit LINEAR_FT)
    input_set: "The ScopeItem's own measurement fields plus parent Property.wind_zone"
    constants:
      SHEET_COVERAGE_SQFT: 32
      SQIN_PER_SQFT: 144
      TARP_OVERLAP_FACTOR: 1.25
    precision: "integer quantities via ceil; FENCE linear_ft kept as given"

  - name: hazard_risk_score
    trigger: "SafetyAssessment creation"
    algorithm: weighted_scoring
    formula: |
      structural_risk_score = min(100, sum(HAZARD_WEIGHTS[h] for h in hazards))
      hazard_level = HIGH if score >= 70 else MODERATE if score >= 30 else LOW
      moderate_ppe_required = (hazard_level == MODERATE)
    input_set: "The hazards array of the assessment being created"
    constants:
      HAZARD_WEIGHTS: { COLLAPSE: 45, ELECTRICAL: 25, GAS: 20, WATER: 15, ASBESTOS: 10 }
      HAZARD_HIGH_THRESHOLD: 70
      HAZARD_MODERATE_THRESHOLD: 30
    precision: "integer score; thresholds inclusive at the lower bound (score == 70 is HIGH, score == 30 is MODERATE)"

  - name: response_sla_evaluation
    trigger: "POST /jobs/{id}/check-in (assignment ACCEPTED -> ARRIVED)"
    algorithm: threshold
    formula: |
      response_minutes = floor((arrived_at - job.dispatched_at) / 60 seconds)
      sla_breach = (response_minutes > job.sla_minutes)
      # boundary pinned: response_minutes == sla_minutes is NOT a breach
    input_set: "The ARRIVED assignment and its job's dispatched_at and sla_minutes snapshot"
    precision: "whole minutes, floor of elapsed seconds / 60"

  - name: subcontractor_reliability
    trigger: "Recomputed whenever completed_job_count, breached_job_count or expired_offer_count changes; read on GET /subcontractors/{id} and by dispatch_selection"
    algorithm: aggregation
    formula: |
      lenient: completed_job_count / (completed_job_count + breached_job_count)
      strict:  completed_job_count / (completed_job_count + breached_job_count + expired_offer_count)
      either variant = 1.0000 when its denominator is 0
    input_set: "The subcontractor's own counters"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: lenient
        when: "dispatch_selection ranking"
        difference: "Excludes expired offers; measures punctuality of completed work only"
      - name: strict
        when: "Surfaced for suspension review (GET /subcontractors/{id})"
        difference: "Additionally penalizes offers that lapsed unanswered; strictly <= lenient whenever expired_offer_count > 0"

  - name: invoice_amount
    trigger: "POST /jobs/{id}/invoices (all money fields computed once at creation and snapshotted into lines)"
    algorithm: tiered_pricing
    formula: |
      Work lines (one per eligible ScopeItem):
        line_cents = round_half_up(quantity * market_rate_for_kind * PRIORITY_MULTIPLIER[job.priority])
        work_subtotal_cents = sum of line_cents   # per-line rounding THEN sum (order pinned)
      Service subtotal (FINAL only):
        POWER/LIGHTING COMPLETED services: service_total_cents each
        PATROL: sum of fee_cents over visits with status IN {CHECKED_IN, MISSED}
      removal_fee_cents = (FINAL ? market.removal_flat_fee_cents : 0)
      penalty_cents = market.late_notification_fee_cents if an unbilled late-filed
                      NOTIFICATION case exists on the job (mark penalty_billed) else 0
      Evaluation order pinned (resolves the apparent tier/total circularity):
        (1) work_subtotal  (2) service_subtotal  (3) removal_fee  (4) penalty
        (5) pre_discount_total = (1)+(2)+(3)+(4)
        (6) tier lookup ON pre_discount_total: >= 500000 -> 0.10; >= 200000 -> 0.05; else 0
        (7) discount_cents = round_half_up(work_subtotal_cents * tier_pct)
        (8) total_cents = pre_discount_total - discount_cents
    input_set: |
      PROVISIONAL: ScopeItems of the job with status IN {PLANNED, INSTALLED}, quantity = planned_qty; no services.
      FINAL: ScopeItems with status INSTALLED, quantity = actual_qty; COMPLETED services; terminal patrol visits; removal fee.
    constants:
      PRIORITY_MULTIPLIER: { P1: 1.50, P2: 1.25, P3: 1.00 }
      DISCOUNT_TIER1_MIN_CENTS: 200000
      DISCOUNT_TIER2_MIN_CENTS: 500000
      DISCOUNT_TIER1_PCT: 0.05
      DISCOUNT_TIER2_PCT: 0.10
      VARIANCE_CAP_PCT: 0.20
    precision: "integer cents; round_half_up per line, then sum"
    variants:
      - name: provisional
        when: "job SECURED; insurance pre-authorization"
        difference: "Planned quantities of all non-VOIDED scope items; excludes services and removal; for identical measurements produces a different total than final whenever actuals diverge or services exist"
      - name: final
        when: "job REMOVED; settlement billing"
        difference: "Actual installed quantities only; adds completed services, terminal patrol fees, removal fee; requires an existing PROVISIONAL invoice as variance baseline"

  - name: patrol_fee_total
    trigger: "PatrolVisit creation (per-visit fee) and FINAL invoice creation (sum)"
    algorithm: aggregation
    formula: |
      per_visit fee_cents = round_half_up(market.patrol_visit_fee_cents * PRIORITY_MULTIPLIER[job.priority])
      invoice patrol contribution = sum of fee_cents over visits with status IN {CHECKED_IN, MISSED}
      # rounding order pinned: round per visit, THEN sum. Sum-then-round is a different result and is wrong.
    input_set: "Visits of the PATROL service with terminal status"
    precision: "integer cents per visit, round_half_up at the per-visit step"

  - name: service_billable_time
    trigger: "POST /temporary-services/{id}/deactivate"
    algorithm: chronological
    formula: |
      active_seconds = min(ends_at, deactivated_at) - starts_at
      billable_days = max(1, ceil(active_seconds / 86400))
      service_total_cents = billable_days * daily_rate_cents
      # paused intervals do NOT subtract; equipment remains on site
    input_set: "The deactivated POWER or LIGHTING service"
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer days, ceil; exactly 24h bills 1 day, 25h bills 2"

  - name: document_completeness
    trigger: "Artifact add, scope install, scope void"
    algorithm: aggregation
    formula: |
      required_photo_count = 2 * count(ScopeItems of job with status INSTALLED)
      complete = authorization_signed AND measurement_sheet_recorded AND photo_count >= required_photo_count
      # zero-scope edge: a package with required_photo_count == 0 still needs authorization and measurement sheet
    input_set: "The job's DocumentPackage artifact counters and INSTALLED scope items"
    precision: "integer counts; >= comparison (exactly meeting the count is COMPLETE)"

  - name: dispatch_selection
    trigger: "POST /jobs/{id}/dispatch without subcontractor_id, and the auto re-offer cascade after DECLINED / EXPIRED / CANCELLED offers"
    algorithm: weighted_scoring
    formula: |
      candidates = Subcontractors s where:
        s.status == ACTIVE
        AND exists Coverage c with c.subcontractor_id == s.id AND c.market_id == job.property.market_id
          AND c.status == ACTIVE
        AND s.active_assignment_count < c.max_concurrent_jobs
        AND (re-offer cascade only) s has no DECLINED/EXPIRED/CANCELLED offer on this job
      rank by: reliability_score_lenient DESC, then coverage.rank ASC, then s.created_at ASC
      pick first; empty pool -> ERR_NO_COVERAGE on dispatch, or job -> INTAKE on cascade
    input_set: "All subcontractors with coverage in the job's market"
    precision: "n/a (selection); id is never used as a tie-break — created_at is the final fallback"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; entity-backed ownership: Customer must own the job (verify-repair, dispute); Subcontractor must be the assignee (check-in, complete-securing, install, record-removal, patrol check-in) or the assessment author (mitigate)"
    error_id: "ERR_FORBIDDEN / ERR_NOT_ASSIGNEE"
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present (ERR_INVALID_REQUEST), enum members valid (ERR_INVALID_ENUM)"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_ENUM"
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references (property_id, subcontractor_id, market_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "Target in a terminal state rejects every action (ERR_ALREADY_TERMINAL); otherwise the action's from-state must match (ERR_INVALID_STATE)"
    error_id: "ERR_ALREADY_TERMINAL / ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Safety and regulatory gates, in this sub-order: (i) assessor != assignee segregation (ERR_SEGREGATION_OF_DUTIES); (ii) hazard cleared before securing (ERR_HAZARD_NOT_MITIGATED); (iii) permit APPROVED before invoice submit (ERR_PERMIT_NOT_APPROVED); (iv) documentation package must have reached completeness before invoice submit — status not INCOMPLETE (ERR_DOCS_INCOMPLETE); (v) artifacts only on an unlocked package (ERR_PACKAGE_LOCKED)"
    error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_HAZARD_NOT_MITIGATED / ERR_PERMIT_NOT_APPROVED / ERR_DOCS_INCOMPLETE / ERR_PACKAGE_LOCKED"
    http_status: 409
    applies_to: "assessment create, complete-securing, invoice submit, artifact add"
  - priority: 7
    category: business_temporal
    check: "Time-based gates: offer responded within expiry (ERR_OFFER_EXPIRED); patrol check-in inside its window / MISSED only after window end (ERR_VISIT_NOT_DUE); new visit window must not already be past (ERR_VISIT_WINDOW_PAST); invoice submit with notification still PENDING (ERR_NOTIFICATION_PENDING) or expired-unfiled (ERR_NOTIFICATION_DEADLINE_EXPIRED)"
    error_id: "ERR_OFFER_EXPIRED / ERR_VISIT_NOT_DUE / ERR_VISIT_WINDOW_PAST / ERR_NOTIFICATION_PENDING / ERR_NOTIFICATION_DEADLINE_EXPIRED"
    http_status: 409
    applies_to: "respond, withdraw, patrol scheduling and check-in, invoice submit"
  - priority: 8
    category: business_constraint
    check: "Structural constraints: positive measurements for the scope kind (ERR_INVALID_MEASUREMENT); non-empty scope for securing (ERR_SCOPE_EMPTY); all scope installed (ERR_SCOPE_ITEMS_PENDING); selector pool and capacity (ERR_NO_COVERAGE, ERR_CAPACITY_FULL); coverage market matches job market (ERR_MARKET_MISMATCH); subcontractor ACTIVE (ERR_SUBCONTRACTOR_SUSPENDED); uniqueness of coverage / document package / open permit case per kind / open invoice (ERR_DUPLICATE_COVERAGE, ERR_DUPLICATE_PACKAGE, ERR_PERMIT_CASE_OPEN, ERR_INVOICE_OPEN_EXISTS); invoice variant vs job state (ERR_INVOICE_VARIANT_INVALID); patrol visits only on PATROL services (ERR_SERVICE_NOT_PATROL); patrol window overlap (ERR_OVERLAP_CONFLICT); generator pool capacity (ERR_GENERATOR_POOL_EXHAUSTED); services deactivated before removal (ERR_SERVICES_STILL_ACTIVE)"
    error_id: "ERR_INVALID_MEASUREMENT / ERR_SCOPE_EMPTY / ERR_SCOPE_ITEMS_PENDING / ERR_NO_COVERAGE / ERR_CAPACITY_FULL / ERR_MARKET_MISMATCH / ERR_SUBCONTRACTOR_SUSPENDED / ERR_DUPLICATE_COVERAGE / ERR_DUPLICATE_PACKAGE / ERR_PERMIT_CASE_OPEN / ERR_INVOICE_OPEN_EXISTS / ERR_INVOICE_VARIANT_INVALID / ERR_SERVICE_NOT_PATROL / ERR_OVERLAP_CONFLICT / ERR_GENERATOR_POOL_EXHAUSTED / ERR_SERVICES_STILL_ACTIVE"
    http_status: 409
    applies_to: "resource creation and action endpoints"
  - priority: 9
    category: business_fiscal
    check: "Money gates: FINAL invoice work subtotal within 120% of provisional unless variance_override (ERR_VARIANCE_CAP_EXCEEDED); job close requires a PAID FINAL invoice and no unpaid invoices (ERR_INVOICES_UNPAID)"
    error_id: "ERR_VARIANCE_CAP_EXCEEDED / ERR_INVOICES_UNPAID"
    http_status: 409
    applies_to: "invoice submit, job close"
  - priority: 10
    category: state
    check: "OCC: expected_job_version on POST /jobs/{id}/scope-items and expected_package_version on POST /document-packages/{id}/artifacts must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /jobs/{id}/scope-items, POST /document-packages/{id}/artifacts"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Market / network configuration ---
  - method: POST
    path: "/markets"
    description: "Create a market with SLA matrix, jurisdiction flags and rate card"
    roles: [PlatformAdmin]
    code: 201
    input: [name, code, sla_minutes_p1, sla_minutes_p2, sla_minutes_p3, permit_required, notification_required, notification_deadline_hours, late_notification_fee_cents, board_rate_per_sheet_cents, tarp_rate_per_sqft_cents, fence_rate_per_linear_ft_cents, patrol_visit_fee_cents, temp_power_daily_rate_cents, temp_lighting_daily_rate_cents, generator_pool_units, removal_flat_fee_cents]
    output: Market
    side_effects: []

  - method: GET
    path: "/markets/{id}"
    description: "Get a market"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Market
    side_effects: []

  - method: POST
    path: "/subcontractors"
    description: "Onboard a subcontractor (status ACTIVE, counters 0, reliability scores 1.0000)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name]
    output: Subcontractor
    side_effects: []

  - method: GET
    path: "/subcontractors/{id}"
    description: "Get a subcontractor including computed counters and both reliability variants"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  - method: PATCH
    path: "/subcontractors/{id}"
    description: "Suspend or reinstate a subcontractor; suspension cascades to open assignments and their jobs"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?"]
    output: Subcontractor
    side_effects:
      - "SUSPENDED: own Assignments IN {OFFERED, ACCEPTED, ARRIVED} -> CANCELLED; each cancellation runs the re-offer cascade and may regress its Job to INTAKE; Coverage rows -> SUSPENDED"
      - "ACTIVE: Coverage rows -> ACTIVE; cancelled assignments NOT resurrected"

  - method: POST
    path: "/coverages"
    description: "Grant a subcontractor coverage in a market"
    roles: [PlatformAdmin]
    code: 201
    input: [subcontractor_id, market_id, max_concurrent_jobs, rank]
    output: Coverage
    side_effects: ["Duplicate (subcontractor_id, market_id) pair -> ERR_DUPLICATE_COVERAGE"]

  - method: GET
    path: "/coverages/{id}"
    description: "Get a coverage row"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: GET
    path: "/coverages"
    description: "List coverage rows, filterable by subcontractor or market"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["subcontractor_id?", "market_id?", "limit?", "offset?"]
    output: Coverage[]
    side_effects: []

  - method: POST
    path: "/customers"
    description: "Register a customer (property owner or insurance adjuster)"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, kind]
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get a customer"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/properties"
    description: "Register a property for a customer in a market"
    roles: [PlatformAdmin]
    code: 201
    input: [customer_id, market_id, address_line, wind_zone]
    output: Property
    side_effects: []

  - method: GET
    path: "/properties/{id}"
    description: "Get a property"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties, filterable by customer or market"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["customer_id?", "market_id?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # --- Job lifecycle ---
  - method: POST
    path: "/jobs"
    description: "Intake a new emergency job; customer_id derived from the property, sla_minutes snapshotted from the market"
    roles: [Dispatcher]
    code: 201
    input: [property_id, incident_type, priority]
    output: Job
    side_effects: ["work_status = INTAKE; reported_at = logical clock"]

  - method: GET
    path: "/jobs/{id}"
    description: "Get a job"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/jobs"
    description: "List jobs, filterable by property, customer or work_status"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["property_id?", "customer_id?", "work_status?", "limit?", "offset?"]
    output: Job[]
    side_effects: []

  - method: POST
    path: "/jobs/{id}/dispatch"
    description: "Dispatch the job: with subcontractor_id pin the offer manually (coverage/capacity checks still apply); without it run dispatch_selection; creates the OFFERED assignment and moves INTAKE -> DISPATCHED"
    roles: [Dispatcher]
    code: 201
    input: ["subcontractor_id?"]
    output: Assignment
    side_effects:
      - "Assignment created OFFERED with offer_seq = 1 + max prior offer_seq for the job; offer_expires_at = offered_at + 30 minutes"
      - "Job INTAKE -> DISPATCHED; dispatched_at = clock; increments Job.version by 1"

  - method: POST
    path: "/jobs/{id}/check-in"
    description: "Assignee crew arrives on site; computes response_minutes and sla_breach"
    roles: [Subcontractor]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment ACCEPTED -> ARRIVED; arrived_at = clock; response_minutes, sla_breach computed"
      - "Job DISPATCHED -> ON_SITE; increments Job.version by 1"

  - method: POST
    path: "/jobs/{id}/complete-securing"
    description: "Assignee marks securing complete; gated by cleared safety assessment and fully-installed scope"
    roles: [Subcontractor]
    code: 200
    input: []
    output: Job
    side_effects:
      - "Job ON_SITE -> SECURED; secured_at = clock; increments Job.version by 1"
      - "ARRIVED Assignment -> COMPLETED; subcontractor completion counters updated per sla_breach"
      - "PAUSED TemporaryServices of the job -> ACTIVE"

  - method: POST
    path: "/jobs/{id}/verify-repair"
    description: "Owning customer verifies (VERIFIED) or retracts (REJECTED) permanent repair completion"
    roles: [Customer]
    code: 200
    input: [outcome]
    output: Job
    side_effects:
      - "SECURED -> READY_FOR_REMOVAL on VERIFIED; READY_FOR_REMOVAL -> SECURED on REJECTED"
      - "increments Job.version by 1"

  - method: POST
    path: "/jobs/{id}/record-removal"
    description: "Assignee records board-up removal after permanent repair verification"
    roles: [Subcontractor]
    code: 200
    input: []
    output: Job
    side_effects: ["Job READY_FOR_REMOVAL -> REMOVED; increments Job.version by 1"]

  - method: POST
    path: "/jobs/{id}/close"
    description: "Close the job once removal is done and all invoices (including a FINAL) are PAID"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Job
    side_effects: ["Job REMOVED -> CLOSED; increments Job.version by 1"]

  # --- Assignments ---
  - method: GET
    path: "/assignments/{id}"
    description: "Get an assignment"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments, filterable by job, subcontractor or status"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["job_id?", "subcontractor_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/respond"
    description: "Offeree accepts or declines; answering after offer_expires_at transitions the offer to EXPIRED and fails with ERR_OFFER_EXPIRED"
    roles: [Subcontractor]
    code: 200
    input: [outcome]
    output: Assignment
    side_effects:
      - "OFFERED -> ACCEPTED or DECLINED; responded_at = clock"
      - "DECLINED / expired: auto re-offer cascade (excludes prior offerees); empty pool -> Job DISPATCHED -> INTAKE"

  - method: POST
    path: "/assignments/{id}/withdraw"
    description: "Dispatcher cancels an OFFERED or ACCEPTED assignment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment -> CANCELLED; active_assignment_count recomputed"
      - "Auto re-offer cascade; empty pool -> Job -> INTAKE"

  # --- Safety assessment ---
  - method: POST
    path: "/jobs/{id}/safety-assessments"
    description: "Submit a hazard assessment; requires job work_status IN {ON_SITE, BREACH_HOLD} (ERR_INVALID_STATE otherwise); creator must be an ACTIVE subcontractor different from the job's assignee (segregation of duties); supersedes any open assessment"
    roles: [Subcontractor]
    code: 201
    input: [hazards]
    output: SafetyAssessment
    side_effects:
      - "structural_risk_score, hazard_level, moderate_ppe_required computed"
      - "score >= 70 -> MITIGATION_REQUIRED; else -> CLEARED with job.safety_cleared = true (and BREACH_HOLD -> ON_SITE)"
      - "Prior open assessment (SUBMITTED / MITIGATION_REQUIRED) of the job -> SUPERSEDED"

  - method: GET
    path: "/safety-assessments/{id}"
    description: "Get a safety assessment"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: SafetyAssessment
    side_effects: []

  - method: GET
    path: "/safety-assessments"
    description: "List safety assessments, filterable by job or assessor"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["job_id?", "assessor_subcontractor_id?", "limit?", "offset?"]
    output: SafetyAssessment[]
    side_effects: []

  - method: POST
    path: "/safety-assessments/{id}/mitigate"
    description: "Assessment author records mitigation completion; MITIGATION_REQUIRED -> CLEARED"
    roles: [Subcontractor]
    code: 200
    input: [mitigation_note]
    output: SafetyAssessment
    side_effects: ["job.safety_cleared = true; if job BREACH_HOLD: -> ON_SITE"]

  # --- Scope & materials ---
  - method: POST
    path: "/jobs/{id}/scope-items"
    description: "Add a measured scope line (OCC-guarded on Job.version); allowed until the job is SECURED"
    roles: [Dispatcher]
    code: 201
    input: [kind, "opening_count?", "width_in?", "height_in?", "door_count?", "length_ft?", "width_ft?", "linear_ft?", expected_job_version]
    output: ScopeItem
    side_effects:
      - "planned_qty and unit computed; status PLANNED"
      - "increments Job.version by 1"

  - method: GET
    path: "/jobs/{id}/scope-items"
    description: "List scope items of a job"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: ScopeItem[]
    side_effects: []

  - method: POST
    path: "/scope-items/{id}/install"
    description: "Assignee records actual installed measurements; actual_qty recomputed with the same formula"
    roles: [Subcontractor]
    code: 200
    input: ["opening_count?", "width_in?", "height_in?", "door_count?", "length_ft?", "width_ft?", "linear_ft?"]
    output: ScopeItem
    side_effects:
      - "ScopeItem PLANNED -> INSTALLED; actual_qty computed"
      - "DocumentPackage.required_photo_count recomputed when a package exists"

  - method: POST
    path: "/scope-items/{id}/void"
    description: "Void a PLANNED scope item (compensating action for an erroneous add)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ScopeItem
    side_effects: ["ScopeItem PLANNED -> VOIDED; Job.total_planned_sheets recomputed; increments Job.version by 1"]

  # --- Temporary services & patrol ---
  - method: POST
    path: "/jobs/{id}/temporary-services"
    description: "Start a temporary power / lighting / patrol service on a SECURED job; POWER draws from the market generator pool (aggregate concurrent capacity)"
    roles: [Dispatcher]
    code: 201
    input: [kind, starts_at, ends_at, "generator_units?"]
    output: TemporaryService
    side_effects: ["status ACTIVE; daily_rate_cents snapshot for POWER/LIGHTING"]

  - method: GET
    path: "/jobs/{id}/temporary-services"
    description: "List temporary services of a job"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: TemporaryService[]
    side_effects: []

  - method: GET
    path: "/temporary-services/{id}"
    description: "Get a temporary service"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: TemporaryService
    side_effects: []

  - method: POST
    path: "/temporary-services/{id}/deactivate"
    description: "End a service; computes billable_days (ceil days, paused time still bills) and service_total_cents"
    roles: [Dispatcher]
    code: 200
    input: []
    output: TemporaryService
    side_effects: ["ACTIVE or PAUSED -> COMPLETED; deactivated_at = clock; billable_days, service_total_cents computed"]

  - method: POST
    path: "/temporary-services/{id}/patrol-visits"
    description: "Schedule a patrol visit inside a half-open window on a PATROL service; pairwise overlap rejected, adjacency allowed"
    roles: [Dispatcher]
    code: 201
    input: [window_start, window_end]
    output: PatrolVisit
    side_effects: ["fee_cents computed (per-visit rounding)"]

  - method: GET
    path: "/temporary-services/{id}/patrol-visits"
    description: "List patrol visits of a service"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: PatrolVisit[]
    side_effects: []

  - method: POST
    path: "/patrol-visits/{id}/check-in"
    description: "Record a patrol outcome; MISSED starts the breach cascade (service -> job -> sibling services) and spawns a +24h replacement visit"
    roles: [Subcontractor]
    code: 200
    input: [outcome]
    output: PatrolVisit
    side_effects:
      - "CHECKED_IN: checked_in_at = clock"
      - "MISSED: parent service ACTIVE -> PAUSED; job SECURED -> BREACH_HOLD (safety_cleared = false); sibling ACTIVE services -> PAUSED; replacement visit spawned with window shifted +24h"

  # --- Permits & notifications ---
  - method: POST
    path: "/jobs/{id}/permit-cases"
    description: "Open a PERMIT or NOTIFICATION case; NOTIFICATION requires the job SECURED (deadline anchors to secured_at); one open case per kind per job"
    roles: [Dispatcher]
    code: 201
    input: [kind]
    output: PermitCase
    side_effects: ["NOTIFICATION: deadline_at = job.secured_at + market.notification_deadline_hours"]

  - method: GET
    path: "/jobs/{id}/permit-cases"
    description: "List permit cases of a job"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitCase[]
    side_effects: []

  - method: POST
    path: "/permit-cases/{id}/file"
    description: "Record municipal filing with confirmation number; late notification filing clears compliance_breach but stays billable as a penalty"
    roles: [Dispatcher]
    code: 200
    input: [confirmation_number]
    output: PermitCase
    side_effects: ["PENDING -> FILED; filed_at = clock; is_late computed; when is_late: job.compliance_breach = false"]

  - method: POST
    path: "/permit-cases/{id}/record-decision"
    description: "Record the authority's decision on a filed PERMIT (APPROVED / REJECTED)"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: PermitCase
    side_effects: ["FILED -> APPROVED or REJECTED (PERMIT only)"]

  # --- Documentation ---
  - method: POST
    path: "/jobs/{id}/document-packages"
    description: "Create the job's insurance documentation package (exactly one per job); requires job SECURED or later"
    roles: [Dispatcher]
    code: 201
    input: []
    output: DocumentPackage
    side_effects: ["status INCOMPLETE; required_photo_count computed from INSTALLED scope items"]

  - method: GET
    path: "/jobs/{id}/document-packages"
    description: "List the job's document packages (array of length 0 or 1)"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: DocumentPackage[]
    side_effects: []

  - method: POST
    path: "/document-packages/{id}/artifacts"
    description: "Add an artifact (PHOTO / AUTHORIZATION / MEASUREMENT_SHEET) to an unlocked package (OCC-guarded on DocumentPackage.version)"
    roles: [Dispatcher]
    code: 200
    input: [kind, expected_package_version]
    output: DocumentPackage
    side_effects:
      - "Artifact counters updated; auto INCOMPLETE -> COMPLETE when authorization + measurement sheet + photo_count >= required_photo_count"
      - "increments DocumentPackage.version by 1"

  # --- Insurance billing ---
  - method: POST
    path: "/jobs/{id}/invoices"
    description: "Generate an invoice: PROVISIONAL (planned quantities) while SECURED, FINAL (actual quantities + services + removal) once REMOVED; FINAL requires an existing PROVISIONAL; one open invoice per job"
    roles: [Dispatcher]
    code: 201
    input: [variant]
    output: Invoice
    side_effects: ["All money fields computed and lines snapshotted; unbilled late-notification penalty attached and marked penalty_billed"]

  - method: GET
    path: "/jobs/{id}/invoices"
    description: "List invoices of a job"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [PlatformAdmin, Dispatcher, Customer, Subcontractor]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/invoices/{id}/submit"
    description: "Submit for insurance billing: permit, documentation, notification and variance gates run in validation priority order; locks the document package"
    roles: [Dispatcher]
    code: 200
    input: ["variance_override?"]
    output: Invoice
    side_effects: ["DRAFT or DISPUTED -> SUBMITTED; submitted_at = clock; DocumentPackage COMPLETE/AMENDED -> LOCKED"]

  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Owning customer disputes a submitted invoice; unlocks the package as AMENDED"
    roles: [Customer]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: ["SUBMITTED -> DISPUTED; DocumentPackage LOCKED -> AMENDED"]

  - method: POST
    path: "/invoices/{id}/record-payment"
    description: "Record insurer payment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Invoice
    side_effects: ["SUBMITTED -> PAID; paid_at = clock"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock sweeps PENDING NOTIFICATION permit cases past deadline_at into EXPIRED (latching job.compliance_breach)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["NOTIFICATION PermitCases with status PENDING and deadline_at < new clock -> EXPIRED; job.compliance_breach = true on each"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (wrong customer, wrong assessment author)" }
  - { id: ERR_NOT_ASSIGNEE, http: 403, condition: "Subcontractor caller is not the assignee of the job/assignment the action targets" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing or malformed value" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries a value outside its declared member set" }
  - { id: ERR_INVALID_MEASUREMENT, http: 422, condition: "Scope measurements missing or non-positive for the item's kind (e.g. BOARD width_in 0)" }
  - { id: ERR_MARKET_MISMATCH, http: 422, condition: "Manually pinned subcontractor has no coverage row in the job's market" }
  - { id: ERR_SERVICE_NOT_PATROL, http: 422, condition: "Patrol visit scheduled on a service whose kind is not PATROL" }
  - { id: ERR_VISIT_WINDOW_PAST, http: 422, condition: "Patrol visit window_end is not strictly after the current clock at scheduling time" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Safety assessment creator equals the job's assigned subcontractor" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action on an entity in a terminal state (CLOSED job, COMPLETED/DECLINED/EXPIRED/CANCELLED assignment, PAID invoice, ...)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Action's from-state does not match the entity's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_job_version / expected_package_version does not match the parent's current version (OCC)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Respond or withdraw arrived after offer_expires_at; the offer transitions to EXPIRED" }
  - { id: ERR_VISIT_NOT_DUE, http: 409, condition: "CHECKED_IN outside [window_start, window_end) or MISSED before window_end" }
  - { id: ERR_NOTIFICATION_PENDING, http: 409, condition: "Invoice submission while a required NOTIFICATION case is still PENDING" }
  - { id: ERR_NOTIFICATION_DEADLINE_EXPIRED, http: 409, condition: "Invoice submission while job.compliance_breach is latched by an EXPIRED notification" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Invoice submission in a permit_required market without an APPROVED PERMIT case" }
  - { id: ERR_DOCS_INCOMPLETE, http: 409, condition: "Invoice submission while the DocumentPackage is not COMPLETE" }
  - { id: ERR_PACKAGE_LOCKED, http: 409, condition: "Artifact add on a LOCKED DocumentPackage" }
  - { id: ERR_HAZARD_NOT_MITIGATED, http: 409, condition: "complete-securing while job.safety_cleared is false (no CLEARED assessment)" }
  - { id: ERR_SCOPE_EMPTY, http: 422, condition: "complete-securing with zero non-VOIDED scope items" }
  - { id: ERR_SCOPE_ITEMS_PENDING, http: 409, condition: "complete-securing while a non-VOIDED scope item is still PLANNED" }
  - { id: ERR_NO_COVERAGE, http: 409, condition: "Dispatch selector pool empty for the job's market" }
  - { id: ERR_CAPACITY_FULL, http: 409, condition: "Manually pinned subcontractor already at coverage.max_concurrent_jobs" }
  - { id: ERR_SUBCONTRACTOR_SUSPENDED, http: 409, condition: "Manual dispatch pinning a SUSPENDED subcontractor" }
  - { id: ERR_DUPLICATE_COVERAGE, http: 409, condition: "Coverage row already exists for the (subcontractor, market) pair" }
  - { id: ERR_DUPLICATE_PACKAGE, http: 409, condition: "Second DocumentPackage for the same job" }
  - { id: ERR_PERMIT_CASE_OPEN, http: 409, condition: "Second open (PENDING, or FILED for PERMIT) case of the same kind on the job" }
  - { id: ERR_INVOICE_OPEN_EXISTS, http: 409, condition: "Second invoice while one is DRAFT / SUBMITTED / DISPUTED" }
  - { id: ERR_INVOICE_VARIANT_INVALID, http: 409, condition: "PROVISIONAL before SECURED, FINAL before REMOVED, or FINAL without an existing PROVISIONAL" }
  - { id: ERR_OVERLAP_CONFLICT, http: 409, condition: "Patrol visit window overlaps an existing visit on the same service (half-open intervals; adjacency allowed)" }
  - { id: ERR_GENERATOR_POOL_EXHAUSTED, http: 409, condition: "Concurrent ACTIVE/PAUSED POWER services in the market would exceed generator_pool_units" }
  - { id: ERR_SERVICES_STILL_ACTIVE, http: 409, condition: "record-removal while a TemporaryService is ACTIVE or PAUSED" }
  - { id: ERR_VARIANCE_CAP_EXCEEDED, http: 409, condition: "FINAL work subtotal exceeds 120% of the provisional work subtotal and variance_override is not true" }
  - { id: ERR_INVOICES_UNPAID, http: 409, condition: "Job close without a PAID FINAL invoice or with any unpaid invoice" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Network operator staff; configures markets, subcontractors, coverage, customers, properties; records permit decisions; drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /markets"
      - "POST /subcontractors, PATCH /subcontractors/{id}"
      - "POST /coverages"
      - "POST /customers, POST /properties"
      - "POST /permit-cases/{id}/record-decision"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]

  - name: Dispatcher
    description: "24/7 dispatch operator; runs intake, dispatch, scope, services, permits, documentation and billing"
    identity: opaque
    exclusive_operations:
      - "POST /jobs, POST /jobs/{id}/dispatch, POST /jobs/{id}/close"
      - "POST /assignments/{id}/withdraw"
      - "POST /jobs/{id}/scope-items, POST /scope-items/{id}/void"
      - "POST /jobs/{id}/temporary-services, POST /temporary-services/{id}/deactivate, POST /temporary-services/{id}/patrol-visits"
      - "POST /jobs/{id}/permit-cases, POST /permit-cases/{id}/file"
      - "POST /jobs/{id}/document-packages, POST /document-packages/{id}/artifacts"
      - "POST /jobs/{id}/invoices, POST /invoices/{id}/submit, POST /invoices/{id}/record-payment"
    shared_operations: ["All GET endpoints"]

  - name: Customer
    description: "Property owner or insurance adjuster (Customer.kind); verifies permanent repair and disputes invoices on own jobs"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /jobs/{id}/verify-repair"
      - "POST /invoices/{id}/dispute"
    shared_operations: ["All GET endpoints"]

  - name: Subcontractor
    description: "Board-up crew company; responds to offers, checks in, assesses hazards (never its own job), installs scope, patrols, removes"
    identity: "entity_backed:Subcontractor"
    exclusive_operations:
      - "POST /assignments/{id}/respond"
      - "POST /jobs/{id}/check-in, POST /jobs/{id}/complete-securing, POST /jobs/{id}/record-removal"
      - "POST /jobs/{id}/safety-assessments, POST /safety-assessments/{id}/mitigate"
      - "POST /scope-items/{id}/install"
      - "POST /patrol-visits/{id}/check-in"
    shared_operations: ["All GET endpoints"]

  - name: Anonymous
    description: "Unauthenticated caller marker used only by negative tests; recognized nowhere"
    identity: opaque
    exclusive_operations: []
    shared_operations: []
