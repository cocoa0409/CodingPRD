            - "BuyerCommitment.${com_c}.open_lbs == 300.00 and BuyerCommitment.${com_c}.version == 1"
            - "GET /berry-ops/lot-allocations with fruit_lot_id ${lot} returns total_count == 0"

      - name: food_safety_hold_blocks_cooling_and_allocation_but_disposition_is_checked_first
        claim_type: priority_ordering
        grounds:
          - validations[priority=36]
          - validations[priority=40]
          - errors[ERR_LOT_ON_FOOD_SAFETY_HOLD]
          - errors[ERR_INVALID_DISPOSITION_STATE]
          - state_machines.Block.CLEARED_to_QUARANTINED
        distinguishing_aspect: |
          A block quarantine stamps food_safety_hold on its UNCOMMITTED lots, so
          both cooling and allocating that lot return 409
          ERR_LOT_ON_FOOD_SAFETY_HOLD. The already-REJECTED sibling lot is on
          hold too, yet repacking it returns ERR_INVALID_DISPOSITION_STATE, not
          the hold error: priority 36 is evaluated before priority 40, so the
          lifecycle answer wins over the food-safety answer when both apply.
        test_recipe:
          setup:
            - "One CLEARED STRAWBERRY block with a 40 MPN sample; one RECRUITING crew; one PLANNED window over 2026-08-03."
            - "Lot 1: 50 grade-A clamshells at 1.00 lb, still PACKED / UNCOMMITTED."
            - "Lot 2: 50 grade-A clamshells cooled through a 4-slot tunnel to COOLED, then rejected, so it is REJECTED with food_safety_hold already true."
            - "The block is then quarantined by fso-1, which sets food_safety_hold on lot 1."
          setup_api_calls:
            - call: "POST /berry-ops/blocks"
              payload: { name: "BLK-V12", variety: "STRAWBERRY", acres: 8.00, planting_year: 2021, irrigation_source_code: "WELL-V12" }
