        distinguishing_aspect: |
          A Policy ISSUE against a DRAFT (not ISSUED) commitment that ALSO has an open
          RAISED exception fails both the referential check (priority 7,
          ERR_COMMITMENT_NOT_ISSUED) and the safety check (priority 9,
          ERR_EXCEPTIONS_OPEN); the lower-priority number wins ->
          ERR_COMMITMENT_NOT_ISSUED. Error-category pair: business_referential vs
          business_safety (a different pair from the state/fiscal conflict).
        test_recipe:
          setup:
            - "An order with a DRAFT commitment (never issued) carrying one RAISED exception, and a PENDING OWNER policy bound to that commitment."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
