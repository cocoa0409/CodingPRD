      - name: endpoint_clock_action_reprojects_certification_and_scan_compliance
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.Assessor.fields.certification_status
          - entities.AsvVendor.fields.effective_approval
          - entities.Engagement.fields.quarterly_scan_compliant
        distinguishing_aspect: "The clock action returns { current_utc } rather than an entity and persists no row of its own, yet every clock-derived projection must move with it: advancing to 2026-10-01 pushes the engagement past the PASSING cycle's exclusive window_end so quarterly_scan_compliant flips to false, and advancing again to 2027-07-01 expires the lead's certification while the vendor's 2027-12-31 approval survives."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' is in SCOPING with lead Dana Reyes (certification_expires_at 2027-06-30T00:00:00Z)."
            - "AsvVendor 'Northstar ASV' has approval_expires_at 2027-12-31T00:00:00Z."
            - "ScanCycle '2026-Q3' has window_start 2026-07-01T00:00:00Z, was completed with no findings and is PASSING; its window_end is 2026-09-29T00:00:00Z, which contains the 2026-08-01 clock."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
