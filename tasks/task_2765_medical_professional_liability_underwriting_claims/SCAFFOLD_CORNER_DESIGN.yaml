      - name: negotiation_cycle_transitions_are_covered_by_the_difficulty_design
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.SettlementNegotiation.transitions
        excluded_because:
          difficulty_instance: negotiation_veto_revision_cycle_reopens_authority_and_bumps_round_index
          rationale: "That instance drives AUTHORITY_REQUESTED -> AUTHORITY_GRANTED -> CONSENT_REQUESTED -> VETOED -> AUTHORITY_REQUESTED and asserts the reopened authority, the cleared consent fields and the bumped round index, which is the whole cyclic-shape claim."

      - name: payment_side_effect_fan_out_is_covered_by_the_difficulty_design
        claim_type: side_effect_execution
        grounds:
          - state_machines.SettlementNegotiation.CONSENT_GRANTED_to_PAID
          - endpoints[POST /mpl/settlement-negotiations/{id}/payment]
        excluded_because:
          difficulty_instance: settlement_payment_cascades_limit_insured_score_and_npdb_obligation
          rationale: "Every declared side effect of the payment transition - paid_indemnity, the term's aggregate_limit_remaining, the insured's counters and rescored risk band, the claim reaching RESOLVED and the NPDBReport being minted - is asserted there."

      - name: parallel_claim_axes_are_covered_by_the_difficulty_design
        claim_type: parallel
        grounds:
          - state_machines.Claim.note
          - entities.Claim.fields.claim_status
          - entities.Claim.fields.coverage_status
        excluded_because:
          difficulty_instance: claim_handling_axis_advances_while_coverage_axis_holds_reserved_rights
          rationale: "That instance advances claim_status through LITIGATION while coverage_status stays RESERVED_RIGHTS, which is exactly the independent-dimension claim for the parallel shape."

      - name: peer_review_fork_join_is_covered_by_the_difficulty_design
        claim_type: branching
        grounds:
          - state_machines.PeerReviewCase.transitions
          - validations[priority=47]
        excluded_because:
          difficulty_instance: peer_review_fork_join_requires_both_tracks_before_committee_vote
          rationale: "Both review tracks, the REFERRED -> IN_REVIEW -> REVIEWS_COMPLETE join and the premature committee vote rejected with ERR_PEER_REVIEW_STATE_INVALID are all asserted there."

      - name: panel_removal_cascade_down_is_covered_by_the_difficulty_design
        claim_type: cascade_down
        grounds:
          - state_machines.CounselAssignment.ASSIGNED_to_REPLACED
          - endpoints[POST /mpl/counsel-firms/{id}/panel-status]
        excluded_because:
          difficulty_instance: panel_removal_cascades_to_assignment_claim_exclusions_and_capacity
          rationale: "Removing the firm from the panel is asserted to REPLACE only the non-terminal assignments, set counsel_reassignment_required, extend excluded_counsel_firm_ids and drain open_assignment_count."

      - name: premium_ledger_sync_is_covered_by_the_difficulty_design
        claim_type: ledger_sync
        grounds:
          - state_machines.PolicyTerm.IN_FORCE_to_CANCELLED_FLAT
          - entities.Policy.fields.written_premium_net_total
        excluded_because:
          difficulty_instance: flat_cancellation_unwinds_the_premium_ledger_and_voids_dependent_coverage
          rationale: "That instance reconciles Policy.written_premium_net_total before and after the cancellation, from 19285.00 back to exactly 0.00, which is the ancestor-ledger claim."

      - name: assignment_decline_compensation_is_covered_by_the_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines.CounselAssignment.ASSIGNED_to_DECLINED
          - entities.DefenseCounselFirm.fields.open_assignment_count
        excluded_because:
          difficulty_instance: declined_assignment_restores_firm_capacity_counter_without_drift
          rationale: "The declined assignment is asserted to return the firm's capacity counter to its pre-assignment value with no drift after a reassignment cycle, which is the compensation claim."

      - name: issuance_guard_on_credentialing_is_covered_by_the_difficulty_design
        claim_type: guarded_transitions
        grounds:
          - state_machines.PolicyTerm.DRAFT_to_IN_FORCE
          - validations[priority=51]
        excluded_because:
          difficulty_instance: term_issuance_hinges_on_the_insureds_credentialing_axis_status_and_expiry
          rationale: "Issuance is attempted against every credentialing posture - CREDENTIALED, PROVISIONAL, LAPSED and an expiry that falls inside the term - so the cross-entity guard is fully covered."

      - name: intake_coverage_resolution_is_covered_by_the_difficulty_design
        claim_type: cross_entity
        grounds:
          - endpoints[POST /mpl/claims]
          - calculations.coverage_trigger_resolution
        excluded_because:
          difficulty_instance: claim_intake_coverage_outcome_hinges_on_the_terms_status_not_its_dates
          rationale: "Claim intake is asserted against a DRAFT term, an IN_FORCE term and a flat-cancelled term with identical dates, so the cross-entity dependency on the other aggregate's state is covered."

  # =========================================================================
  # Table 3 (Calculations): 15 rules. The rounding-ladder ordering traps, the
  # hammer split and the two dual-variant rules are carried by
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml and recorded here as excluded stubs.
  # =========================================================================
  - section: calculations
    instances:
      - name: increased_limits_factor_of_one_point_four_five_flows_through_the_whole_ladder
        claim_type: constants_applied
        grounds:
          - calculations.claims_made_step_premium
          - entities.PolicyTerm.fields.increased_limits_factor
          - entities.PolicyTerm.fields.term_total
        distinguishing_aspect: "A 2M per-claim limit puts INCREASED_LIMITS_FACTOR at 1.45 in stage S1, so the ladder runs 55100.00 -> 55100.00 -> 79895.00 -> 27963.25 and the term totals 28819.04."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class (base 38000.00, hazard 7.0), COOK_IL insured at 40 percent high-severity procedures (score 4.20 -> R2 -> 1.00)."
            - "A CLAIMS_MADE policy at 2000000.00 / 6000000.00 limits, prior_acts_step_credit 0."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              as_user_id: "uw-1"
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 2000000.00, limit_aggregate: 6000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
