  # ===========================================================================
  - section: validations
    instances:
      - name: error_missing_auth_on_anonymous_call
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A call that omits X-User-ID/X-User-Role headers fails priority 1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even when the path id also does not exist — auth precedes existence."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /field-force/territories/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: undeclared_role_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "A syntactically present but undeclared role header on a permitted endpoint is rejected 403 at priority 2."
        test_recipe:
          setup:
            - "One region exists."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "KY-01", name: "Kentucky" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /field-force/regions"
              payload: {}
              as: SuperUser
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: existence_precedes_state_for_action_on_missing_disbursement
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - validations[priority=6]
        distinguishing_aspect: "capture-signature on a nonexistent disbursement id returns 404 ERR_NOT_FOUND — existence (priority 3) precedes the state check (priority 6) that would otherwise say PENDING_SIGNATURE required."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /field-force/sample-disbursements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/capture-signature"
              payload: { signature_payload: "AAAAAAAABBBBBBBBCCCCCCCCDDDDDDDDEEEEEEEE" }
              as: FieldRep
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"

      - name: segregation_counter_cannot_be_custodian_or_custodian_manager
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
        distinguishing_aspect: "counter_rep_id equal to the custodian OR to the custodian's manager both fail with the same segregation error — the three-way distinctness is a single invariant."
        test_recipe:
          setup:
            - "Custodian C with manager M in one territory."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "TN-01", name: "Tennessee" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TNA", name: "Nashville", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/representatives"
              payload: { employee_id: "E71010", full_name: "Mgr Pam", hire_date: "2018-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /field-force/territories/${t_id}/representatives"
              payload: { employee_id: "E71011", full_name: "Cust Raj", hire_date: "2022-01-01T00:00:00Z", manager_rep_id: "${m_id}" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /field-force/inventory-count-sessions"
              payload: { representative_id: "${c_id}", counter_rep_id: "${c_id}", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-21T00:00:00Z" }
              as: DistrictManager
              as_user_id: "${m_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /field-force/inventory-count-sessions"
              payload: { representative_id: "${c_id}", counter_rep_id: "${m_id}", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-21T00:00:00Z" }
              as: DistrictManager
              as_user_id: "${m_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "counter == custodian returns 422 ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "counter == custodian's manager returns 422 ERR_SEGREGATION_OF_DUTIES_VIOLATION"

      - name: transfer_sender_equals_receiver_rejected_as_segregation
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - entities.SampleTransfer.fields.to_rep_id
        distinguishing_aspect: "A self-transfer (to_rep_id == X-User-ID) is a segregation violation 422, evaluated before fiscal checks."
