            - "BookingRequest.${bk_id}.assigned_aircraft_id IS NULL (hop 2 — unassigned by the status change, not by the original call)"
            - "BookingRequest.${bk_id}.interchange_direction == NONE (hop 3 — prepared adjustment withdrawn)"
            - "BookingRequest.${bk_id}.booking_status still == CONFIRMED (cascade does NOT cancel)"

      - name: invoice_past_due_owner_delinquency_depth2
        grounds:
          - state_machines.Invoice.ISSUED_to_PAST_DUE
          - state_machines.Owner.GOOD_to_DELINQUENT
        distinguishing_aspect: |
          Depth-2 chain from the clock-set trigger (different trigger from the
          maintenance cascade): clock advance → Invoice ISSUED→PAST_DUE (hop 1,
          caused by clock sweep) → Owner GOOD→DELINQUENT (hop 2, caused by the
          invoice transition). The owner transition then gates further booking
          confirms (observed as ERR_OWNER_STANDING_BLOCKS).
        test_recipe:
          setup:
            - "Owner GOOD with ACTIVE 1/8 MID share; 2026-08 invoice issued at 2026-09-01, never paid"
            - "A second booking created and left REQUESTED, to observe the delinquency gate after the cascade"
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "FJX-TC2", currency: "USD", contract_year_start_month: 8, peak_day_calendar: [] }
              as: ProgramAdmin
