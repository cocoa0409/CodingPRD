          assert:
            - "HTTP 409 with ${e_dup} == ERR_DUPLICATE_VOTE"
            - "Interaction.${pollD}: vote_count == 1, tallies == {\"0\": 1, \"1\": 0}, voted_viewer_ids contains ${v1} exactly once"
            - "Interaction.${pollD}.state == OPEN"

      - name: ready_without_a_provisioned_channel_returns_simulcast_not_ready
        claim_type: error_triggerable
        grounds:
          - validations[priority=23]
          - errors[ERR_SIMULCAST_NOT_READY]
        distinguishing_aspect: "A DRAFT channel does not satisfy the simulcast precondition: with a lineup slot and a confirmed primary host in place but the channel never provisioned, ready returns 422 ERR_SIMULCAST_NOT_READY."
        test_recipe:
          setup:
            - "Show with a CONFIRMED PRIMARY booking, one slot on a substantiated product and one channel left in DRAFT."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
          trigger:
            - call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
              captures: { e_sim: $.data.error_id }
          assert:
            - "HTTP 422 with ${e_sim} == ERR_SIMULCAST_NOT_READY"
            - "Show.${sh1}.status == DRAFT and simulcast_readiness_index == 0"
            - "StreamChannel.${ch1}.status == DRAFT, health_report_count == 0"

      - name: ready_with_an_unconfirmed_primary_returns_primary_host_missing
        claim_type: error_triggerable
        grounds:
          - validations[priority=21]
          - errors[ERR_PRIMARY_HOST_MISSING]
        distinguishing_aspect: "A PENDING primary booking does not count: the show has a booking and a certified host, yet ready returns 422 ERR_PRIMARY_HOST_MISSING because no PRIMARY booking is CONFIRMED."
        test_recipe:
          setup:
            - "Show with a PENDING PRIMARY booking by a certified host, one slot on a substantiated product and one PROVISIONED channel with a healthy report."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
          trigger:
            - call: "POST /shows/${sh1}/ready"
              payload: {}
              as: ShowProducer
              captures: { e_prim: $.data.error_id }
          assert:
            - "HTTP 422 with ${e_prim} == ERR_PRIMARY_HOST_MISSING (priority 12 passes because the booked host IS certified)"
            - "Show.${sh1}.status == DRAFT and HostBooking.${b1}.status == PENDING"
            - "StreamChannel.${ch1}.readiness_index == 100 — the simulcast side was never the problem"

      - name: recover_after_every_offer_expired_returns_no_recoverable_items
        claim_type: error_triggerable
        grounds:
          - validations[priority=28]
          - errors[ERR_NO_RECOVERABLE_ITEMS]
          - state_machines.FlashOffer.ACTIVE_to_EXPIRED
        distinguishing_aspect: "Recovery inside the time window still fails when nothing is eligible: the cart abandoned at 18:10Z is recovered at 18:20Z (before its 18:30Z deadline) but the show ended at 18:15Z and expired the only offer, so the answer is 409 ERR_NO_RECOVERABLE_ITEMS rather than the window error."
        test_recipe:
          setup:
            - "Viewer 1 holds 2 units and abandons at 18:10Z; the show is ended at 18:15Z (expiring the offer) and the clock is moved to 18:20Z."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 2 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itN: $.data.id }
            - call: "POST /carts/${ct1}/abandon"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:15:00Z" }
              as: PlatformAdmin
            - call: "POST /shows/${sh1}/end"
              payload: {}
              as: ShowProducer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carts/${ct1}/recover"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { e_norec: $.data.error_id }
          assert:
            - "HTTP 409 with ${e_norec} == ERR_NO_RECOVERABLE_ITEMS (logical now 18:20Z is still before recovery_deadline_at 18:30Z)"
            - "FlashOffer.${o1}.status == EXPIRED and CartItem.${itN}.state == RELEASED"
            - "Cart.${ct1}: status == ABANDONED, recovered_count == 0, held_item_count == 0"

      - name: replay_marker_before_the_show_ends_returns_show_not_ended
        claim_type: error_triggerable
        grounds:
          - validations[priority=9]
          - errors[ERR_SHOW_NOT_ENDED]
        distinguishing_aspect: "Replay merchandising is gated on the broadcast being off air: setting a marker while the show is LIVE returns 409 ERR_SHOW_NOT_ENDED, because the offset range is only defined once ended_at exists."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with one lineup slot and no marker."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
          trigger:
            - call: "POST /lineup-slots/${sl1}/replay-marker"
              payload: { marker_offset_sec: 600, product_link_url: "https://shop.example.com/robe" }
              as: MerchandisingManager
              captures: { e_notend: $.data.error_id }
          assert:
            - "HTTP 409 with ${e_notend} == ERR_SHOW_NOT_ENDED"
            - "LineupSlot.${sl1}: replay_marker_status == NONE, replay_marker_offset_sec == null, replay_product_link_url == null"
            - "Show.${sh1}.status == LIVE and ended_at == null"

      - name: host_booking_overlap_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: host_booking_half_open_interval_with_buffer
          rationale: "§1.8 drives ERR_HOST_BOOKING_OVERLAP at the half-open interval boundary including the turnaround buffer, which is a strictly stronger trigger than a plain overlap."

      - name: offer_window_overlap_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: offer_window_closed_interval_per_product
          rationale: "§1.8 triggers ERR_OFFER_WINDOW_OVERLAP on a shared-endpoint (closed interval) collision for the same product and proves a different product with the same window is accepted."

      - name: stale_cart_version_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: checkout_stale_version_beats_empty_cart
          rationale: "§1.8 fires ERR_STALE_CART_VERSION from the concurrency rule cart-checkout-stale-cart and proves it outranks the empty-cart rule."

      - name: claim_not_substantiated_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: add_item_claim_safety_beats_fiscal_qty
          rationale: "§1.8 triggers ERR_CLAIM_NOT_SUBSTANTIATED while a fiscal rule is simultaneously violated, proving both the code and its priority."

      - name: offer_not_active_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: cart_item_requires_active_offer
          rationale: "§1.8 adds a line against a SCHEDULED and then an EXPIRED offer, asserting ERR_OFFER_NOT_ACTIVE in both directions."

      - name: host_certification_expired_error
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: booking_confirm_requires_certified_host
          rationale: "§1.8 confirms a booking for a host whose certification has lapsed and asserts ERR_HOST_CERTIFICATION_EXPIRED, then re-certifies and repeats the call."

      - name: invalid_show_state_on_offer_activate
        claim_type: error_triggerable
        excluded_because:
          difficulty_instance: offer_activate_requires_live_show
          rationale: "§1.8 activates an offer while the show is READY and then again once it is LIVE, asserting ERR_INVALID_SHOW_STATE on the first attempt."

  # ===========================================================================
  - section: rbac
    instances:

      - name: unknown_role_header_returns_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An X-Role value outside the seven declared roles is rejected at priority 1 with 401 ERR_UNAUTHENTICATED before any body validation runs, so a well-formed show body still creates nothing."
        test_recipe:
          setup:
            - "Empty database with the clock pinned."
          setup_api_calls:
            - *k_clock_t0
          trigger:
            - call: "POST /shows"
              payload: { title: "Ghost Show", scheduled_start_at: "2026-08-10T18:00:00Z", scheduled_end_at: "2026-08-10T20:00:00Z" }
              as: "NotARole"
              captures: { e_unauth: $.data.error_id }
          assert:
            - "HTTP 401 with ${e_unauth} == ERR_UNAUTHENTICATED"
            - "No Show row is created (a subsequent authorised read of any show id returns ERR_SHOW_NOT_FOUND)"

      - name: viewer_cannot_activate_a_flash_offer
        claim_type: role_not_permitted
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - rbac.MerchandisingManager.exclusive_operations
        distinguishing_aspect: "Offer activation is exclusive to MerchandisingManager: a Viewer — the role that most benefits from an active offer — gets 403 ERR_ROLE_NOT_PERMITTED and the offer stays SCHEDULED."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with a SCHEDULED offer inside its window and one registered viewer."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
          trigger:
            - call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { e_role: $.data.error_id }
          assert:
            - "HTTP 403 with ${e_role} == ERR_ROLE_NOT_PERMITTED"
            - "FlashOffer.${o1}.status == SCHEDULED with activated_at == null"

      - name: viewer_cannot_check_out_another_viewers_cart
        claim_type: not_resource_owner
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - complexity_profile.role_model
        distinguishing_aspect: "Ownership is checked at priority 3, ahead of the OCC rule at priority 7: viewer 2 presenting viewer 1's CURRENT cart version still gets 403 ERR_NOT_RESOURCE_OWNER, never 412."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z; viewer 1 holds one unit in their own cart and reads the cart version; viewer 2 exists and owns nothing."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_viewer2
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
          trigger:
            - call: "POST /carts/${ct1}/checkout"
