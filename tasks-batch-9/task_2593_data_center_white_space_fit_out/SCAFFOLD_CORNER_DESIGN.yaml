      - name: mop_target_resource_identifier_has_a_distinct_not_found_code
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MOP_TARGET_NOT_FOUND] (404, target_resource_id does not resolve to a row of the entity named by target_resource_type, or that row belongs to another hall)"
          - "errors[ERR_BUSWAY_NOT_FOUND] is reserved for a busway_id in a path or a plain body FK"
          - "endpoints[POST /mops].input includes target_resource_type and target_resource_id"
        distinguishing_aspect: "The polymorphic MOP target is validated against the entity family named by target_resource_type AND against the MOP's own hall, and it fails with the dedicated ERR_MOP_TARGET_NOT_FOUND rather than the per-entity 404. A busway that exists but lives in another hall is just as not-found as a random UUID, while a type/id mismatch (COOLING_UNIT type pointing at a busway id) is also rejected."
        test_recipe:
          setup: "Two halls: CX69 (the MOP's hall, with PDU-A1 + BW-A1 + CU-1) and CX70 (a foreign hall with its own busway BW-F1)."
          setup_api_calls:
            - name: create_hall_home
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "MOP Target Home", code: "CX69", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { home_hall: "$.data.id" }
            - name: create_hall_foreign
              call: "POST /halls"
              as: FacilityPlanner
              payload: { name: "MOP Target Foreign", code: "CX70", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              captures: { foreign_hall: "$.data.id" }
            - name: create_pdu_home
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${home_hall}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              captures: { pdu_home: "$.data.id" }
            - name: create_busway_home
              call: "POST /busways"
              as: ElectricalContractor
              payload: { pdu_id: "${pdu_home}", name: "BW-A1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              captures: { bw_home: "$.data.id" }
            - name: create_pdu_foreign
              call: "POST /pdus"
              as: ElectricalContractor
              payload: { hall_id: "${foreign_hall}", name: "PDU-A1", feed_side: "A", rated_kw: 300.00 }
              captures: { pdu_foreign: "$.data.id" }
            - name: create_busway_foreign
              call: "POST /busways"
              as: ElectricalContractor
              payload: { pdu_id: "${pdu_foreign}", name: "BW-F1", rated_amps: 400, voltage_v: 415, redundancy_topology: "N_PLUS_1" }
              captures: { bw_foreign: "$.data.id" }
          trigger:
            - name: mop_with_random_target_uuid_is_rejected
              call: "POST /mops"
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              payload: { hall_id: "${home_hall}", target_resource_type: "BUSWAY", target_resource_id: "00000000-0000-0000-0000-0000000000b1", title: "Ghost busway work", risk_class: "LOW", backout_plan: "none", window_start: "2026-08-10T02:00:00Z", window_end: "2026-08-10T06:00:00Z" }
              captures: { e_ghost: "$.data.error_id" }
            - name: mop_with_foreign_hall_target_is_rejected
              call: "POST /mops"
              as: ElectricalContractor
