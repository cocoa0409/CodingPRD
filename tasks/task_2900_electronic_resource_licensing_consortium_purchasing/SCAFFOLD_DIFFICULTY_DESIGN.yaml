  - rule_id: compensating_invariant
    instances:
      - name: withdrawing_a_confirmed_pledge_restores_the_member_ledger_identity
        grounds:
          - state_machines.Commitment.CONFIRMED_to_WITHDRAWN
          - state_machines.Commitment.PLEDGED_to_CONFIRMED
          - calculations.member_tier_price_cents
          - entities.Member.fields.annual_committed_cents
          - entities.Commitment.fields.tier_price_cents
        distinguishing_aspect: |
          Conserved quantity: money - the identity sum(Member.annual_committed_cents) ==
          sum(Commitment.tier_price_cents over CONFIRMED rows). Signing confirms three pledges at the
          settled participant-count-3 band price 4050000 each, so both sides read 12150000. Withdrawing
          one CONFIRMED pledge must decrement exactly that row's 4050000, null out its tier price and
          leave both sides at 8100000 with no drift and no re-pricing of the surviving rows.
        test_recipe:
          setup:
            - "Vendor, Product Atlas Humanities Collection (tier bands 1 -> 0 percent, 3 -> 10 percent, 5 -> 20 percent) and three members Alpha, Bravo and Charlie, each fte_count 4000, BACCALAUREATE, budget_ceiling_cents 9000000."
            - "Alpha's trial is ENDORSED and the negotiation is AGREED at 9000000 cents."
            - "All three members pledge (projections 4500000, 4500000 and 4050000), then signing confirms all three at the settled participant-count-3 price 4050000, so each member's ledger reads 4050000 and the consortium totals reconcile at 12150000."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
