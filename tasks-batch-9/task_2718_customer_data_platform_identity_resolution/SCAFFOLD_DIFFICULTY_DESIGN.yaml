  # =============================================================================
  # RULE 4 — transitive_cascade
  # Differentiation required by §0.5: DIFFERENT triggering transitions, and each hop must be
  # CAUSED by the previous hop. Instance 1 is triggered by a link REJECT (depth 3);
  # instance 2 is triggered by a vendor acknowledgement (depth 4).
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reject_lowers_precision_disables_rule_voids_sibling_link
        grounds:
          - state_machines.IdentityLink.PROPOSED_to_REJECTED
          - state_machines.MatchRule.ENABLED_to_DISABLED
          - state_machines.IdentityLink.PROPOSED_to_VOIDED
          - entities.MatchRule.fields.precision_estimate
          - entities.IdentityLink.fields.void_reason
        distinguishing_aspect: |
          Depth 3, triggered by POST /cdp/identity-links/{linkId}/decision with REJECT. Hop 1
          increments MatchRule.rejected_count and recomputes precision_estimate to 0.0000; hop 2
          fires ONLY because hop 1 dropped that value below min_precision 0.60, moving the rule
          ENABLED -> DISABLED; hop 3 fires ONLY because hop 2 disabled the rule, voiding the
          untouched sibling link with void_reason RULE_DISABLED. No Profile is mutated anywhere
          in the chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem POS_CASCADE and one PROMOTED batch of four fully valid records, so four RESOLVED / NORMAL Profiles exist."
            - "One PROBABILISTIC MatchRule PROB_CASC with the default min_precision 0.60, review_floor 0.65, auto_merge_threshold 0.92, STRICT_ZERO, confirmed_count 0, rejected_count 0, precision_estimate 1.0, status ENABLED."
            - "Two PROPOSED IdentityLinks minted by that rule, both at confidence 0.8500: link_target on (p1, p2) and link_sibling on (p3, p4)."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "POS_CASCADE"
                display_name: "POS Cascade Feed"
