# SCAFFOLD.yaml — Manufactured Home Chattel Lending (§1.0–§1.7)
# Generated by prd-bench-scaffold-generator.
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.

scenario: |
  Manufactured Home Chattel Lending (21st Mortgage): collateral classification as personal
  property versus real property with title and conversion rules, lien perfection through the
  state title agency and land-home documentation, valuation using book value guides with
  condition, location and installation adjustments, community versus private-land placement
  affecting term and rate, insurance requirements including wind and force-placed coverage,
  servicing with lot rent relationships and community operator agreements, default handling
  with repossession versus foreclosure paths by classification, resale, refurbishment and
  re-marketing of recovered units.

domain_name: manufactured-home-chattel-lending
api_prefix: /chattel

complexity_profile:
  difficulty_level: expert
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no entity is nested inside another's URL
  # path. Every collection sits directly under the /chattel prefix
  # (/chattel/loans, /chattel/units, /chattel/valuations, ...), and every relationship is
  # expressed as an FK field plus a filtered-list GET.

  state_machine_shape: branching
  # Loan carries three INDEPENDENT state dimensions on one row
  # (underwriting_state x servicing_state x perfection_state) that advance separately;
  # LienFiling.status is cyclic (SUBMITTED -> REJECTED -> SUBMITTED -> RECORDED, and
  # RECORDED -> RELEASED -> RECORDED on conversion rescission);
  # RecoveryCase.status forks by collateral classification
  # (OPENED -> {REPO_NOTICE_ISSUED | REDEMPTION_WINDOW} -> POSSESSION_OBTAINED) with a
  # different side-effect set on each arm and rejoins at POSSESSION_OBTAINED;
  # ManufacturedUnit.classification is cyclic
  # (PERSONAL_PROPERTY -> CONVERSION_PENDING -> REAL_PROPERTY -> PERSONAL_PROPERTY).

  relationship_patterns:
    - one_to_many          # Loan -> LienFiling, Loan -> InsurancePolicy, Loan -> PaymentTransaction
    - self_referential     # Loan.refinanced_from_loan_id -> Loan.id; PaymentTransaction.reverses_payment_id -> PaymentTransaction.id
    - cross_aggregate      # RecoveryCase reads Community.operator_agreement_status through ManufacturedUnit
    - polymorphic          # LienFiling.filing_type selects TITLE_LIEN vs LAND_HOME_DEED_OF_TRUST perfection instrument on the same table

  role_model: segregation_of_duties
  # The CreditAnalyst X-User-ID that certified the origination Valuation may not be the
  # CreditAnalyst X-User-ID that approves the Loan secured by it. Beyond that control the
  # roles are peers: CreditAnalyst owns underwriting, ClosingAgent owns perfection and
  # funding, Servicer owns cash and insurance, RecoveryManager owns default/remarketing,
  # CommunityOperator owns the lot-rent relationship for its own community only.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the obligor
      - name: credit_score
        type: integer
        source: input
        description: bureau score used for the credit tier spread
        constraints: "300..850 inclusive"
      - name: monthly_income_cents
        type: integer
        source: input
        description: verified monthly income in cents
        constraints: ">= 0"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the obligor's residence
      - name: status
        type: enum
        source: system
        description: credit standing gate for new originations
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED whenever units_under_recovery_hold_count > 0"
      - name: total_outstanding_principal_cents
        type: integer
        source: computed
        description: "sum of Loan.principal_balance_cents over this borrower's loans whose servicing_state IN {CURRENT, DELINQUENT, DEFAULT, RECOVERY}; see calculations.borrower_exposure"
        default: 0
      - name: units_under_recovery_hold_count
        type: integer
        source: computed
        description: "count of DISTINCT ManufacturedUnit.id where the unit is collateral for a loan of this borrower and ManufacturedUnit.recovery_hold == true; see calculations.borrower_exposure"
        default: 0

  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: manufactured home community (land-lease park) trade name
      - name: state_code
        type: string
        source: input
        description: two-letter US state code where the community sits
      - name: lot_count
        type: integer
        source: input
        description: number of rentable lots in the community
        constraints: "> 0"
      - name: monthly_lot_rent_cents
        type: integer
        source: input
        description: posted monthly lot rent in cents
        constraints: ">= 0"
      - name: sales_commission_bps
        type: integer
        source: input
        description: referral commission in basis points the operator charges the lender on a remarketed unit sold in-community
        default: 0
        constraints: "0..500"
      - name: operator_agreement_status
        type: enum
        source: system
        description: lifecycle of the community operator agreement between lender and operator
        default: NONE
        constraints: "one of {NONE, PENDING, EXECUTED, TERMINATED}"
      - name: lender_access_rights
        type: boolean
        source: system
        description: true only while operator_agreement_status == EXECUTED and the executed agreement granted on-site access for repossession and in-place resale
        default: false
      - name: agreement_executed_at
        type: datetime
        source: system
        description: logical-clock instant at which operator_agreement_status became EXECUTED; null before that
        default: null

  - name: BookValueGuide
    parent: null
    common_fields: false
    fields:
      - name: guide_edition
        type: string
        source: input
        description: published edition label of the manufactured-housing appraisal guide
      - name: region_code
        type: string
        source: input
        description: guide region whose base rate applies
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant from which this edition may be cited by a Valuation
      - name: base_value_per_sqft_cents
        type: integer
        source: input
        description: guide base value per square foot in cents
        constraints: "> 0"
      - name: single_wide_multiplier_bps
        type: integer
        source: input
        description: basis-point multiplier applied when width_class == SINGLE_WIDE
        constraints: "> 0"
      - name: multi_wide_multiplier_bps
        type: integer
        source: input
        description: basis-point multiplier applied when width_class == MULTI_WIDE
        constraints: "> 0"
      - name: annual_depreciation_bps
        type: integer
        source: input
        description: straight-line depreciation in basis points per year of unit age
        constraints: "0..1000"

  - name: ManufacturedUnit
    parent: null
    common_fields: true
    fields:
      - name: hud_label_number
        type: string
        source: input
        description: HUD certification label, globally unique across units
      - name: manufacturer
        type: string
        source: input
        description: builder of the unit
      - name: model_year
        type: integer
        source: input
        description: model year, drives depreciation and remaining useful life
      - name: width_class
        type: enum
        source: input
        description: guide multiplier selector
        constraints: "one of {SINGLE_WIDE, MULTI_WIDE}"
      - name: square_feet
        type: integer
        source: input
        description: heated floor area used by the guide base computation
        constraints: "> 0"
      - name: condition_grade
        type: enum
        source: input
        description: inspected condition grade driving the condition adjustment
        constraints: "one of {EXCELLENT, GOOD, FAIR, POOR}"
      - name: installation_type
        type: enum
        source: input
        description: how the unit is set, drives the installation adjustment and wind pricing
        constraints: "one of {PIER_AND_ANCHOR, PERMANENT_FOUNDATION}"
      - name: wind_zone
        type: integer
        source: input
        description: HUD wind zone of the site
        constraints: "1, 2 or 3"
      - name: placement_type
        type: enum
        source: input
        description: whether the unit sits on a rented community lot or on land the borrower owns
        constraints: "one of {COMMUNITY, PRIVATE_LAND}"
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; required when placement_type == COMMUNITY, MUST be null when placement_type == PRIVATE_LAND"
        default: null
      - name: lot_number
        type: string
        source: input
        description: community lot label the unit occupies; required when placement_type == COMMUNITY
        default: null
      - name: placement_start_date
        type: datetime
        source: input
        description: first day of the lot occupancy interval; required when placement_type == COMMUNITY
        default: null
      - name: placement_end_date
        type: datetime
        source: input
        description: last day of the lot occupancy interval; null means open-ended occupancy
        default: null
      - name: land_owner_borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id; the fee owner of the parcel, required when placement_type == PRIVATE_LAND, MUST be null when placement_type == COMMUNITY"
        default: null
      - name: land_parcel_apn
        type: string
        source: input
        description: assessor parcel number of the private land site
        default: null
      - name: land_county
        type: string
        source: input
        description: recording county for the land-home instruments
        default: null
      - name: land_value_cents
        type: integer
        source: input
        description: assessed land value in cents; excluded from the unit's book value
        default: 0
      - name: deed_recorded
        type: boolean
        source: system
        description: true once a DEED land document has been recorded on this unit's parcel
        default: false
      - name: affixation_affidavit_recorded
        type: boolean
        source: system
        description: true once an AFFIXATION_AFFIDAVIT land document has been recorded on this unit's parcel
        default: false
      - name: classification
        type: enum
        source: system
        description: collateral character of the unit
        default: PERSONAL_PROPERTY
        constraints: "one of {PERSONAL_PROPERTY, CONVERSION_PENDING, REAL_PROPERTY}"
      - name: title_status
        type: enum
        source: system
        description: state title agency status of the certificate of title
        default: ACTIVE_TITLE
        constraints: "one of {ACTIVE_TITLE, TITLE_ENCUMBERED, TITLE_SURRENDERED}"
      - name: recovery_hold
        type: boolean
        source: system
        description: true while an open RecoveryCase holds this unit off the market
        default: false

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> ManufacturedUnit.id"
      - name: guide_id
        type: string
        source: input
        description: "FK -> BookValueGuide.id"
      - name: variant
        type: enum
        source: input
        description: which of the two valuation algorithms to run
        constraints: "one of {ORIGINATION, RECOVERY_LIQUIDATION}"
      - name: valuation_year
        type: integer
        source: system
        description: calendar year of the logical clock at creation; fixes the age used for depreciation
      - name: location_key
        type: enum
        source: computed
        description: location adjustment selector derived from the unit's placement and its community's operator agreement
        constraints: "one of {COMMUNITY_WITH_AGREEMENT, COMMUNITY_WITHOUT_AGREEMENT, PRIVATE_LAND}"
      - name: book_base_cents
        type: integer
        source: computed
        description: depreciated guide base value before adjustments
      - name: condition_adjustment_cents
        type: integer
        source: computed
        description: signed condition adjustment applied to book_base_cents
      - name: location_adjustment_cents
        type: integer
        source: computed
        description: signed location adjustment applied to book_base_cents
      - name: installation_adjustment_cents
        type: integer
        source: computed
        description: installation adjustment; always 0 for variant RECOVERY_LIQUIDATION
      - name: forced_sale_discount_cents
        type: integer
        source: computed
        description: liquidation discount; always 0 for variant ORIGINATION
        default: 0
      - name: detach_and_move_cost_cents
        type: integer
        source: computed
        description: deduction for detaching and moving the unit off a community lot; always 0 for variant ORIGINATION
        default: 0
      - name: certified_value_cents
        type: integer
        source: computed
        description: final value this valuation stands behind; see calculations.unit_book_valuation
      - name: status
        type: enum
        source: system
        description: valuation lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, SUPERSEDED}"
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditAnalyst that certified this valuation; the segregation-of-duties control compares it to the approver
        default: null
      - name: certified_at
        type: datetime
        source: system
        description: logical-clock instant of certification
        default: null

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id"
      - name: unit_id
        type: string
        source: input
        description: "FK -> ManufacturedUnit.id; the collateral"
      - name: origination_valuation_id
        type: string
        source: input
        description: "FK -> Valuation.id; MUST be CERTIFIED, variant ORIGINATION, and on the same unit_id"
      - name: refinanced_from_loan_id
        type: string
        source: input
        description: "FK -> Loan.id; self-referential, set when this loan retires a prior loan on the same unit"
        default: null
      - name: principal_cents
        type: integer
        source: input
        description: contract amount advanced at funding
        constraints: "> 0"
      - name: requested_term_months
        type: integer
        source: input
        description: term the applicant asked for, before the term caps are applied
        constraints: "> 0"
      - name: collateral_classification
        type: enum
        source: system
        description: classification snapshot taken from ManufacturedUnit.classification at loan creation and re-synced by the conversion cascade; selects the perfection instrument, the default path and the payment waterfall variant
        constraints: "one of {PERSONAL_PROPERTY, REAL_PROPERTY}"
      - name: placement_type
        type: enum
        source: system
        description: placement snapshot taken from ManufacturedUnit.placement_type at loan creation
        constraints: "one of {COMMUNITY, PRIVATE_LAND}"
      - name: ltv_bps
        type: integer
        source: computed
        description: principal_cents over the origination valuation's certified_value_cents in basis points; see calculations.loan_rate_and_term
      - name: apr_bps
        type: integer
        source: computed
        description: priced annual rate in basis points; null until submit-underwriting succeeds
        default: null
      - name: term_months
        type: integer
        source: computed
        description: granted term after all caps; null until submit-underwriting succeeds
        default: null
      - name: underwriting_state
        type: enum
        source: system
        description: origination dimension of the loan's state
        default: DRAFT
        constraints: "one of {DRAFT, UNDERWRITING, APPROVED, FUNDED, DECLINED}"
      - name: servicing_state
        type: enum
        source: system
        description: cash/collection dimension of the loan's state
        default: NOT_SERVICING
        constraints: "one of {NOT_SERVICING, CURRENT, DELINQUENT, DEFAULT, RECOVERY, PAID_OFF, CHARGED_OFF}"
      - name: perfection_state
        type: enum
        source: system
        description: lien dimension of the loan's state
        default: UNPERFECTED
        constraints: "one of {UNPERFECTED, FILING_SUBMITTED, PERFECTED, RE_PERFECTION_REQUIRED, RELEASED}"
      - name: principal_balance_cents
        type: integer
        source: computed
        description: unpaid principal; set to principal_cents at funding, moved only by payment allocation and reversal
        default: 0
      - name: interest_accrued_unpaid_cents
        type: integer
        source: computed
        description: interest accrued and not yet allocated; see calculations.interest_accrual
        default: 0
      - name: fees_outstanding_cents
        type: integer
        source: computed
        description: unpaid late fees
        default: 0
      - name: escrow_target_cents
        type: integer
        source: input
        description: escrow balance the servicer is collecting toward; supplied at funding
        default: 0
      - name: escrow_balance_cents
        type: integer
        source: computed
        description: cash held in escrow for taxes and insurance
        default: 0
      - name: force_placed_premium_outstanding_cents
        type: integer
        source: computed
        description: unreimbursed force-placed insurance premium advanced by the lender
        default: 0
      - name: insurance_compliance
        type: enum
        source: computed
        description: whether an ACTIVE InsurancePolicy currently satisfies the requirement matrix for this loan's collateral_classification and the unit's wind_zone
        default: UNKNOWN
        constraints: "one of {UNKNOWN, COMPLIANT, NON_COMPLIANT}"
      - name: lot_rent_months_delinquent
        type: integer
        source: system
        description: months of lot rent the community operator has reported unpaid; 0 once a CURED report arrives
        default: 0
      - name: lot_rent_state
        type: enum
        source: system
        description: latest lot-rent standing reported by the community operator
        default: CURRENT
        constraints: "one of {CURRENT, DELINQUENT, EVICTION_FILED}"
      - name: next_due_date
        type: datetime
        source: system
        description: due date the delinquency clock measures from; set at funding from first_due_date
        default: null
      - name: last_accrual_date
        type: datetime
        source: system
        description: left edge of the next interest accrual window; set at funding, advanced by every accrual
        default: null
      - name: delinquent_days
        type: integer
        source: computed
        description: calendar days from next_due_date to the logical clock, floored at 0; refreshed by servicing-assessment
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditAnalyst that approved the loan
        default: null
      - name: funded_at
        type: datetime
        source: system
        description: logical-clock instant of funding
        default: null

  - name: LienFiling
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: unit_id
        type: string
        source: system
        description: "FK -> ManufacturedUnit.id; copied from the loan's unit_id at creation"
      - name: filing_type
        type: enum
        source: input
        description: perfection instrument; TITLE_LIEN is filed with the state title agency for personal property, LAND_HOME_DEED_OF_TRUST is recorded with the county for real property
        constraints: "one of {TITLE_LIEN, LAND_HOME_DEED_OF_TRUST}"
      - name: submitted_documents
        type: array
        source: input
        description: document codes tendered with this attempt
      - name: missing_documents
        type: array
        source: computed
        description: required document codes for filing_type that are absent from submitted_documents
      - name: status
        type: enum
        source: system
        description: filing lifecycle at the recording office
        default: SUBMITTED
        constraints: "one of {SUBMITTED, REJECTED, RECORDED, RELEASED}"
      - name: attempt_number
        type: integer
        source: system
        description: 1 on creation, incremented by every resubmit
        default: 1
      - name: agency_reference
        type: string
        source: system
        description: recording reference returned by the agency on a RECORDED outcome
        default: null
      - name: rejection_code
        type: enum
        source: system
        description: agency reason on a REJECTED outcome
        default: null
        constraints: "one of {MISSING_DOCUMENT, NAME_MISMATCH, FEE_SHORTFALL}"
      - name: recorded_at
        type: datetime
        source: system
        description: logical-clock instant of the RECORDED outcome
        default: null
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant the instrument was released; cleared again on reinstatement
        default: null

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: carrier_name
        type: string
        source: input
        description: issuing carrier
      - name: policy_number
        type: string
        source: input
        description: carrier policy identifier
      - name: dwelling_coverage_cents
        type: integer
        source: input
        description: stated dwelling coverage limit
        constraints: ">= 0"
      - name: wind_deductible_cents
        type: integer
        source: input
        description: named-storm/wind deductible
        constraints: ">= 0"
      - name: wind_endorsement
        type: boolean
        source: input
        description: whether a wind/named-storm endorsement is attached
      - name: effective_date
        type: datetime
        source: input
        description: first instant of coverage (interval left edge, inclusive)
      - name: expiry_date
        type: datetime
        source: input
        description: first instant after coverage (interval right edge, exclusive)
      - name: coverage_days
        type: integer
        source: computed
        description: calendar days from effective_date to expiry_date
      - name: premium_cents
        type: integer
        source: computed
        description: 0 for BORROWER_PROVIDED; the advanced premium for FORCE_PLACED; see calculations.force_placed_premium
        default: 0
      - name: required_coverage_cents
        type: integer
        source: computed
        description: coverage the requirement matrix demands for the loan at this policy's creation
      - name: compliance_state
        type: enum
        source: computed
        description: how this policy scores against the requirement matrix; recomputed whenever the loan's collateral_classification changes
        constraints: "one of {COMPLIANT, DEFICIENT_COVERAGE, DEFICIENT_WIND}"
      - name: source
        type: enum
        source: system
        description: who placed the coverage
        default: BORROWER_PROVIDED
        constraints: "one of {BORROWER_PROVIDED, FORCE_PLACED}"
      - name: status
        type: enum
        source: system
        description: policy lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, LAPSED, CANCELLED, SUPERSEDED}"
      - name: unearned_premium_refund_cents
        type: integer
        source: computed
        description: pro-rata unearned premium credited back when a FORCE_PLACED policy is CANCELLED
        default: 0

  - name: PaymentTransaction
    parent: null
    common_fields: false
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id"
      - name: reverses_payment_id
        type: string
        source: system
        description: "FK -> PaymentTransaction.id; self-referential, set only on a REVERSAL row"
        default: null
      - name: amount_cents
        type: integer
        source: input
        description: cash applied; negative on a REVERSAL row
      - name: payment_kind
        type: enum
        source: input
        description: how the cash is characterised
        constraints: "one of {SCHEDULED, PARTIAL, PAYOFF, REVERSAL}"
      - name: posted_at
        type: datetime
        source: system
        description: logical-clock instant of posting
      - name: accrual_days
        type: integer
        source: computed
        description: calendar days accrued at this posting, from loan.last_accrual_date to posted_at
      - name: accrued_interest_at_posting_cents
        type: integer
        source: computed
        description: interest added to loan.interest_accrued_unpaid_cents by this posting
      - name: allocation_variant
        type: enum
        source: computed
        description: which waterfall order this posting used; selected from the loan's collateral_classification
        constraints: "one of {CHATTEL_CONTRACT_ORDER, REAL_PROPERTY_ESCROW_FIRST}"
      - name: to_interest_cents
        type: integer
        source: computed
        description: cash allocated to accrued interest; negative on a REVERSAL row
      - name: to_fees_cents
        type: integer
        source: computed
        description: cash allocated to outstanding fees; negative on a REVERSAL row
      - name: to_force_placed_cents
        type: integer
        source: computed
        description: cash allocated to the outstanding force-placed premium; negative on a REVERSAL row
      - name: to_escrow_cents
        type: integer
        source: computed
        description: cash allocated to the escrow shortfall; negative on a REVERSAL row
      - name: to_principal_cents
        type: integer
        source: computed
        description: cash allocated to principal; negative on a REVERSAL row
      - name: reversed
        type: boolean
        source: system
        description: true once a REVERSAL row points at this row
        default: false

  - name: RecoveryCase
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: system
        description: "FK -> Loan.id; set by the default-declaration cascade, never by a client"
      - name: recovery_valuation_id
        type: string
        source: input
        description: "FK -> Valuation.id; the CERTIFIED RECOVERY_LIQUIDATION valuation attached when refurbishment begins"
        default: null
      - name: resale_loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the new loan written on the recovered unit at resale, when the buyer finances with the lender"
        default: null
      - name: path
        type: enum
        source: system
        description: enforcement path derived from Loan.collateral_classification at case creation
        constraints: "one of {REPOSSESSION, FORECLOSURE}"
      - name: status
        type: enum
        source: system
        description: recovery lifecycle; the two arms after OPENED are selected by path
        default: OPENED
        constraints: "one of {OPENED, REPO_NOTICE_ISSUED, REDEMPTION_WINDOW, POSSESSION_OBTAINED, REFURBISHING, REMARKETING, CLOSED_REDEEMED, CLOSED_DEFICIENCY, CLOSED_SURPLUS, CLOSED_SETTLED}"
      - name: notice_reference
        type: string
        source: system
        description: right-to-cure notice reference (REPOSSESSION) or foreclosure docket reference (FORECLOSURE)
        default: null
      - name: cure_deadline_date
        type: datetime
        source: system
        description: end of the chattel right-to-cure period; null on the FORECLOSURE arm
        default: null
      - name: redemption_window_ends_at
        type: datetime
        source: system
        description: end of the statutory redemption window; null on the REPOSSESSION arm
        default: null
      - name: possession_date
        type: datetime
        source: system
        description: logical-clock date possession of the unit was obtained
        default: null
      - name: recovery_expense_cents
        type: integer
        source: computed
        description: enforcement expenses charged to the payoff; seeded by the path expense constant and increased by every EXPENSED refurbishment line
        default: 0
      - name: refurbishment_line_items
        type: array
        source: computed
        description: "append-only list of objects { category, cost_cents, cost_class, recorded_at }; one entry per refurbishment-costs call"
        default: []
      - name: refurbishment_cost_cents
        type: integer
        source: computed
        description: sum of refurbishment_line_items[].cost_cents where cost_class == CAPITALIZED; 0 when no CAPITALIZED entry exists
        default: 0
      - name: asking_price_cents
        type: integer
        source: system
        description: list price set when the unit goes to market
        default: null
      - name: resale_price_cents
        type: integer
        source: system
        description: contract price at sale
        default: null
      - name: gross_proceeds_cents
        type: integer
        source: computed
        description: equals resale_price_cents; the tier selector for the commission rate
        default: null
      - name: commission_bps
        type: integer
        source: computed
        description: commission rate applied, tier plus in-community referral surcharge
        default: null
      - name: commission_cents
        type: integer
        source: computed
        description: commission withheld from gross proceeds
        default: null
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: gross proceeds less commission less CAPITALIZED refurbishment
        default: null
      - name: payoff_amount_cents
        type: integer
        source: computed
        description: total the collateral had to cover; see calculations.deficiency_settlement
        default: null
      - name: deficiency_balance_cents
        type: integer
        source: computed
        description: shortfall charged off against the borrower
        default: null
      - name: surplus_cents
        type: integer
        source: computed
        description: excess owed back to the borrower
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
# Loan carries three independent state dimensions on one row, so its three
# machines are declared separately and each names the field it governs via
# `state_field:`. Every other entity has exactly one state field.

state_machines:
  - entity: Loan
    state_field: underwriting_state
    initial_state: DRAFT
    terminal_states: [FUNDED, DECLINED]
    transitions:
      - from: DRAFT
        to: UNDERWRITING
        trigger: "POST /chattel/loans/{loan_id}/submit-underwriting"
        actor: CreditAnalyst
        preconditions:
          - "origination valuation status == CERTIFIED"
          - "origination valuation variant == ORIGINATION"
          - "origination valuation unit_id == loan.unit_id"
          - "computed ltv_bps <= LTV_CAP_BPS (9500)"
          - "computed term_months >= MIN_TERM_MONTHS (60)"
        side_effects:
          - "runs calculations.loan_rate_and_term: sets ltv_bps, apr_bps, term_months"
          - "increments Loan.version by 1"
      - from: UNDERWRITING
        to: APPROVED
        trigger: "POST /chattel/loans/{loan_id}/approve"
        actor: CreditAnalyst
        preconditions:
          - "acting X-User-ID != origination valuation certified_by_user_id (segregation of duties)"
          - "borrower.status == ACTIVE"
          - "borrower total_outstanding_principal_cents + loan.principal_cents <= EXPOSURE_CAP_CENTS"
        side_effects:
          - "sets approved_by_user_id to the acting X-User-ID"
          - "increments Loan.version by 1"
      - from: UNDERWRITING
        to: DECLINED
        trigger: "POST /chattel/loans/{loan_id}/decline"
        actor: CreditAnalyst
        preconditions: []
        side_effects:
          - "increments Loan.version by 1"
        note: "DECLINED is terminal on this dimension; servicing_state stays NOT_SERVICING forever"
      - from: APPROVED
        to: FUNDED
        trigger: "POST /chattel/loans/{loan_id}/fund"
        actor: ClosingAgent
        preconditions:
          - "perfection_state == PERFECTED"
          - "the RECORDED LienFiling's filing_type matches collateral_classification (TITLE_LIEN for PERSONAL_PROPERTY, LAND_HOME_DEED_OF_TRUST for REAL_PROPERTY)"
          - "an ACTIVE InsurancePolicy exists with compliance_state == COMPLIANT (wind endorsement required when unit.wind_zone == 3, or when wind_zone == 2 and installation_type == PIER_AND_ANCHOR)"
          - "when placement_type == COMMUNITY: community.operator_agreement_status == EXECUTED"
        side_effects:
          - "sets funded_at and last_accrual_date to the logical clock, next_due_date to first_due_date"
          - "sets principal_balance_cents = principal_cents, escrow_target_cents from the request"
          - "transitions servicing_state NOT_SERVICING -> CURRENT"
          - "increments Loan.version by 1"

  - entity: Loan
    state_field: servicing_state
    initial_state: NOT_SERVICING
    terminal_states: [PAID_OFF, CHARGED_OFF]
    transitions:
      - from: NOT_SERVICING
        to: CURRENT
        trigger: "POST /chattel/loans/{loan_id}/fund (cascade from the underwriting dimension)"
        actor: ClosingAgent
        preconditions: ["underwriting_state == APPROVED"]
        side_effects: ["borrower.total_outstanding_principal_cents increases by principal_cents"]
      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /chattel/loans/{loan_id}/servicing-assessment"
        actor: Servicer
        preconditions: ["delinquent_days >= DELINQUENCY_THRESHOLD_DAYS (30)"]
        side_effects:
          - "adds LATE_FEE_FLAT_CENTS (3500) to fees_outstanding_cents, once per assessment that crosses the threshold"
          - "accrues interest from last_accrual_date to the logical clock"
      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /chattel/loans/{loan_id}/payments with a payment that clears all accrued interest and fees"
        actor: Servicer
        preconditions: ["after allocation interest_accrued_unpaid_cents == 0 and fees_outstanding_cents == 0"]
        side_effects: ["advances next_due_date by one month", "resets delinquent_days to 0"]
      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /chattel/loans/{loan_id}/default-declare"
        actor: RecoveryManager
        preconditions:
          - "delinquent_days >= the classification-specific default threshold, after any lot-rent acceleration (see calculations.delinquency_and_default_eligibility)"
        side_effects:
          - "creates a RecoveryCase in status OPENED with path derived from collateral_classification"
          - "sets unit.recovery_hold = true and unit.title_status = TITLE_ENCUMBERED"
          - "sets borrower.status = SUSPENDED because units_under_recovery_hold_count becomes > 0"
          - "seeds RecoveryCase.recovery_expense_cents with the path expense constant"
      - from: DEFAULT
        to: RECOVERY
        trigger: "POST /chattel/recovery-cases/{case_id}/issue-notice"
        actor: RecoveryManager
        preconditions: ["the case is in status OPENED"]
        side_effects: ["case advances to REPO_NOTICE_ISSUED or REDEMPTION_WINDOW by path"]
      - from: RECOVERY
        to: CURRENT
        trigger: "POST /chattel/recovery-cases/{case_id}/redeem"
        actor: RecoveryManager
        preconditions: ["case status == REDEMPTION_WINDOW", "logical clock < redemption_window_ends_at"]
        side_effects:
          - "case moves to CLOSED_REDEEMED"
          - "clears unit.recovery_hold; borrower.status returns to ACTIVE when no other held unit remains"
      - from: RECOVERY
        to: CHARGED_OFF
        trigger: "POST /chattel/recovery-cases/{case_id}/finalize-sale resulting in deficiency_balance_cents > 0"
        actor: RecoveryManager
        preconditions: ["case status == REMARKETING"]
        side_effects:
          - "case moves to CLOSED_DEFICIENCY"
          - "principal_balance_cents, interest_accrued_unpaid_cents, fees_outstanding_cents and force_placed_premium_outstanding_cents are all zeroed"
          - "clears unit.recovery_hold and sets unit.title_status = ACTIVE_TITLE"
      - from: RECOVERY
        to: PAID_OFF
        trigger: "POST /chattel/recovery-cases/{case_id}/finalize-sale resulting in deficiency_balance_cents == 0"
        actor: RecoveryManager
        preconditions: ["case status == REMARKETING"]
        side_effects:
          - "case moves to CLOSED_SURPLUS when surplus_cents > 0, otherwise CLOSED_SETTLED"
          - "all obligation buckets are zeroed and perfection_state moves to RELEASED"
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /chattel/loans/{loan_id}/payments with payment_kind == PAYOFF covering the full payoff amount"
        actor: Servicer
        preconditions: ["amount_cents equals the computed payoff amount to the cent"]
        side_effects:
          - "zeroes every obligation bucket and refunds any escrow_balance_cents"
          - "moves perfection_state PERFECTED -> RELEASED and the RECORDED LienFiling -> RELEASED"

  - entity: Loan
    state_field: perfection_state
    initial_state: UNPERFECTED
    terminal_states: [RELEASED]
    transitions:
      - from: UNPERFECTED
        to: FILING_SUBMITTED
        trigger: "POST /chattel/lien-filings"
        actor: ClosingAgent
        preconditions:
          - "filing_type matches loan.collateral_classification"
          - "submitted_documents contains every required document code for filing_type"
        side_effects: ["creates a LienFiling in status SUBMITTED with attempt_number 1"]
      - from: FILING_SUBMITTED
        to: PERFECTED
        trigger: "POST /chattel/lien-filings/{filing_id}/agency-response with outcome RECORDED"
        actor: PlatformAdmin
        preconditions: ["filing status == SUBMITTED"]
        side_effects:
          - "filing status -> RECORDED with agency_reference and recorded_at"
          - "unit.title_status -> TITLE_ENCUMBERED for a TITLE_LIEN"
      - from: FILING_SUBMITTED
        to: UNPERFECTED
        trigger: "POST /chattel/lien-filings/{filing_id}/agency-response with outcome REJECTED"
        actor: PlatformAdmin
        preconditions: ["filing status == SUBMITTED"]
        side_effects: ["filing status -> REJECTED with rejection_code"]
        note: "cycle: resubmit returns the loan to FILING_SUBMITTED, up to MAX_FILING_ATTEMPTS"
      - from: UNPERFECTED
        to: FILING_SUBMITTED
        trigger: "POST /chattel/lien-filings/{filing_id}/resubmit"
        actor: ClosingAgent
        preconditions: ["filing status == REJECTED", "attempt_number < MAX_FILING_ATTEMPTS (3)"]
        side_effects: ["filing status -> SUBMITTED, attempt_number += 1, rejection_code cleared"]
      - from: PERFECTED
        to: RE_PERFECTION_REQUIRED
        trigger: "POST /chattel/units/{unit_id}/convert-classification with action COMPLETE (cascade)"
        actor: ClosingAgent
        preconditions: ["unit.classification == CONVERSION_PENDING"]
        side_effects:
          - "the RECORDED TITLE_LIEN -> RELEASED because the certificate of title is surrendered"
          - "loan.collateral_classification -> REAL_PROPERTY"
      - from: RE_PERFECTION_REQUIRED
        to: FILING_SUBMITTED
        trigger: "POST /chattel/lien-filings with filing_type LAND_HOME_DEED_OF_TRUST"
        actor: ClosingAgent
        preconditions: ["filing_type matches the loan's new collateral_classification"]
        side_effects: ["creates a second LienFiling on the same loan"]
      - from: PERFECTED
        to: RELEASED
        trigger: "payoff or recovery close-out (cascade from the servicing dimension)"
        actor: system
        preconditions: ["every obligation bucket is zero"]
        side_effects: ["the RECORDED LienFiling -> RELEASED with released_at set"]

  - entity: LienFiling
    state_field: status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: RECORDED
        trigger: "POST /chattel/lien-filings/{filing_id}/agency-response with outcome RECORDED"
        actor: PlatformAdmin
        preconditions: ["missing_documents is empty"]
        side_effects: ["sets agency_reference and recorded_at", "loan.perfection_state -> PERFECTED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /chattel/lien-filings/{filing_id}/agency-response with outcome REJECTED"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["sets rejection_code", "loan.perfection_state -> UNPERFECTED"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /chattel/lien-filings/{filing_id}/resubmit"
        actor: ClosingAgent
        preconditions: ["attempt_number < MAX_FILING_ATTEMPTS (3)"]
        side_effects: ["attempt_number += 1", "recomputes missing_documents from the new document list"]
      - from: RECORDED
        to: RELEASED
        trigger: "conversion COMPLETE, payoff, or recovery close-out (cascade)"
        actor: system
        preconditions: []
        side_effects: ["sets released_at"]
      - from: RELEASED
        to: RECORDED
        trigger: "POST /chattel/units/{unit_id}/convert-classification with action RESCIND (compensating cascade)"
        actor: ClosingAgent
        preconditions: ["the release was caused by a conversion COMPLETE, not by a payoff"]
        side_effects: ["clears released_at", "restores loan.perfection_state to PERFECTED"]
        note: "cycle: this is the compensation arm that preserves the count of RECORDED instruments across a conversion round-trip"

  - entity: RecoveryCase
    state_field: status
    initial_state: OPENED
    terminal_states: [CLOSED_REDEEMED, CLOSED_DEFICIENCY, CLOSED_SURPLUS, CLOSED_SETTLED]
    transitions:
      - from: OPENED
        to: REPO_NOTICE_ISSUED
        trigger: "POST /chattel/recovery-cases/{case_id}/issue-notice"
        actor: RecoveryManager
        preconditions: ["path == REPOSSESSION"]
        side_effects:
          - "sets notice_reference and cure_deadline_date = clock + RIGHT_TO_CURE_DAYS (10)"
          - "loan.servicing_state -> RECOVERY"
        note: "fork arm A — selected by path, which is derived from collateral_classification"
      - from: OPENED
        to: REDEMPTION_WINDOW
        trigger: "POST /chattel/recovery-cases/{case_id}/issue-notice"
        actor: RecoveryManager
        preconditions: ["path == FORECLOSURE"]
        side_effects:
          - "sets notice_reference and redemption_window_ends_at = clock + STATUTORY_REDEMPTION_DAYS (45)"
          - "loan.servicing_state -> RECOVERY"
        note: "fork arm B — a different side-effect set on the same trigger"
      - from: REDEMPTION_WINDOW
        to: CLOSED_REDEEMED
        trigger: "POST /chattel/recovery-cases/{case_id}/redeem"
        actor: RecoveryManager
        preconditions: ["logical clock < redemption_window_ends_at"]
        side_effects:
          - "loan.servicing_state -> CURRENT, unit.recovery_hold -> false"
          - "borrower.status -> ACTIVE when no other unit of that borrower is held"
      - from: REPO_NOTICE_ISSUED
        to: POSSESSION_OBTAINED
        trigger: "POST /chattel/recovery-cases/{case_id}/obtain-possession"
        actor: RecoveryManager
        preconditions:
          - "logical clock >= cure_deadline_date"
          - "a RECORDED LienFiling exists on the unit"
          - "when the unit sits in a community: community.lender_access_rights == true"
        side_effects: ["sets possession_date"]
        note: "join point — both arms converge here"
      - from: REDEMPTION_WINDOW
        to: POSSESSION_OBTAINED
        trigger: "POST /chattel/recovery-cases/{case_id}/obtain-possession"
        actor: RecoveryManager
        preconditions:
          - "logical clock >= redemption_window_ends_at"
          - "a RECORDED LienFiling exists on the unit"
        side_effects: ["sets possession_date"]
      - from: POSSESSION_OBTAINED
        to: REFURBISHING
        trigger: "POST /chattel/recovery-cases/{case_id}/begin-refurbishment"
        actor: RecoveryManager
        preconditions:
          - "recovery_valuation_id references a CERTIFIED Valuation with variant RECOVERY_LIQUIDATION on this unit"
        side_effects: ["attaches the liquidation valuation to the case"]
      - from: REFURBISHING
        to: REMARKETING
        trigger: "POST /chattel/recovery-cases/{case_id}/list-for-resale"
        actor: RecoveryManager
        preconditions: ["asking_price_cents > 0"]
        side_effects: ["sets asking_price_cents"]
      - from: REMARKETING
        to: CLOSED_DEFICIENCY
        trigger: "POST /chattel/recovery-cases/{case_id}/finalize-sale"
        actor: RecoveryManager
        preconditions: ["computed deficiency_balance_cents > 0"]
        side_effects:
          - "runs calculations.deficiency_settlement"
          - "loan.servicing_state -> CHARGED_OFF"
      - from: REMARKETING
        to: CLOSED_SETTLED
        trigger: "POST /chattel/recovery-cases/{case_id}/finalize-sale"
        actor: RecoveryManager
        preconditions: ["computed deficiency_balance_cents == 0 and surplus_cents == 0"]
        side_effects: ["loan.servicing_state -> PAID_OFF"]
      - from: REMARKETING
        to: CLOSED_SURPLUS
        trigger: "POST /chattel/recovery-cases/{case_id}/finalize-sale"
        actor: RecoveryManager
        preconditions: ["computed surplus_cents > 0"]
        side_effects: ["loan.servicing_state -> PAID_OFF and the surplus is recorded for remittance"]

  - entity: ManufacturedUnit
    state_field: classification
    initial_state: PERSONAL_PROPERTY
    terminal_states: []
    transitions:
      - from: PERSONAL_PROPERTY
        to: CONVERSION_PENDING
        trigger: "POST /chattel/units/{unit_id}/convert-classification with action INITIATE"
        actor: ClosingAgent
        preconditions:
          - "placement_type == PRIVATE_LAND"
          - "deed_recorded == true and affixation_affidavit_recorded == true"
        side_effects: []
      - from: CONVERSION_PENDING
        to: REAL_PROPERTY
        trigger: "POST /chattel/units/{unit_id}/convert-classification with action COMPLETE"
        actor: ClosingAgent
        preconditions: ["no LienFiling on this unit is in status SUBMITTED"]
        side_effects:
          - "title_status -> TITLE_SURRENDERED"
          - "every RECORDED TITLE_LIEN on this unit -> RELEASED"
          - "every non-terminal Loan on this unit: collateral_classification -> REAL_PROPERTY, and perfection_state PERFECTED -> RE_PERFECTION_REQUIRED"
          - "every ACTIVE InsurancePolicy on those loans is re-scored against REQUIRED_COVERAGE_BPS[REAL_PROPERTY], which can flip loan.insurance_compliance to NON_COMPLIANT"
      - from: REAL_PROPERTY
        to: PERSONAL_PROPERTY
        trigger: "POST /chattel/units/{unit_id}/convert-classification with action RESCIND"
        actor: ClosingAgent
        preconditions: ["no Loan on this unit has servicing_state in {RECOVERY, CHARGED_OFF}"]
        side_effects:
          - "title_status -> ACTIVE_TITLE"
          - "every TITLE_LIEN released by the COMPLETE step -> RECORDED again (compensation)"
          - "every affected Loan: collateral_classification -> PERSONAL_PROPERTY, perfection_state RE_PERFECTION_REQUIRED -> PERFECTED"
          - "every ACTIVE InsurancePolicy is re-scored against REQUIRED_COVERAGE_BPS[PERSONAL_PROPERTY]"
        note: "cyclic compensation arm; the count of RECORDED LienFilings is conserved across INITIATE -> COMPLETE -> RESCIND"

  - entity: InsurancePolicy
    state_field: status
    initial_state: ACTIVE
    terminal_states: [LAPSED, CANCELLED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /chattel/insurance-policies creating a newer BORROWER_PROVIDED policy on the same loan"
        actor: Servicer
        preconditions: ["the new policy's effective_date does not overlap an existing ACTIVE policy's coverage interval"]
        side_effects: ["loan.insurance_compliance is recomputed from the surviving ACTIVE policy"]
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /chattel/loans/{loan_id}/servicing-assessment observing logical clock >= expiry_date"
        actor: Servicer
        preconditions: []
        side_effects: ["loan.insurance_compliance -> NON_COMPLIANT"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /chattel/insurance-policies creating a COMPLIANT BORROWER_PROVIDED policy while a FORCE_PLACED policy is ACTIVE"
        actor: Servicer
        preconditions: ["source == FORCE_PLACED"]
        side_effects:
          - "computes unearned_premium_refund_cents pro-rata by remaining coverage days"
          - "reduces loan.force_placed_premium_outstanding_cents by the refund, floored at 0"

  - entity: Community
    state_field: operator_agreement_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: PENDING
        trigger: "POST /chattel/communities/{community_id}/operator-agreement with action PROPOSE"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PENDING
        to: EXECUTED
        trigger: "POST /chattel/communities/{community_id}/operator-agreement with action EXECUTE"
        actor: CommunityOperator
        preconditions: ["the acting X-User-ID equals this community's id"]
        side_effects:
          - "sets lender_access_rights = true and agreement_executed_at to the logical clock"
          - "raises the location adjustment key of future valuations on units in this community to COMMUNITY_WITH_AGREEMENT"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /chattel/communities/{community_id}/operator-agreement with action TERMINATE"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "sets lender_access_rights = false"
          - "blocks funding of any further loan on a unit in this community"
      - from: TERMINATED
        to: PENDING
        trigger: "POST /chattel/communities/{community_id}/operator-agreement with action PROPOSE"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: valuation-create-stale-unit
    parent_entity: ManufacturedUnit
    write_endpoint: "POST /chattel/valuations"
    occ_field: "expected_unit_version"
    description: |
      Creating a Valuation against a ManufacturedUnit whose version has
      advanced since the client last read it is rejected. A new valuation
      legitimately supersedes the prior valuation of the same variant on
      the same unit, so a writer holding a stale view of the unit would
      otherwise supersede a valuation that was itself computed from unit
      attributes the writer never saw (a re-graded condition, a recorded
      affixation affidavit, a completed classification conversion, or a
      recovery hold). The stale-version check forces the writer to re-read
      the unit and re-derive the valuation from current attributes.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: policy-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /chattel/insurance-policies"
    occ_field: "expected_loan_version"
    description: |
      Creating an InsurancePolicy against a Loan whose version has advanced
      since the client last read it is rejected. A newly created policy
      legitimately supersedes the loan's prior ACTIVE policy and cancels an
      ACTIVE force-placed policy, so a writer working from a stale loan view
      would score its coverage against a requirement matrix that no longer
      applies — the loan's collateral_classification may have moved to
      REAL_PROPERTY (raising required coverage from 8000 to 10000 basis
      points of certified value) or a force-placed premium may already have
      been advanced. The stale-version check forces a re-read before the
      supersede.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
# All money is integer cents. `round_half_up(x)` means: evaluate x in exact
# rational arithmetic, then round the single final quotient half-up to the
# nearest cent. Where a formula shows more than one round_half_up, each is a
# separately pinned rounding point and MUST NOT be combined or re-ordered.
# No calculation may use a random/UUID `id` as a selector, ordering key or
# tie-break; `created_at ASC` is the only sanctioned fallback ordering.

calculations:
  - name: unit_book_valuation
    trigger: "POST /chattel/valuations (both variants computed at creation; certified_value_cents is frozen when the valuation is certified)"
    algorithm: threshold
    formula: |
      # step 1 — age and depreciation, floored so an old unit never values at zero
      valuation_year = calendar year of the logical clock at creation
      age_years      = max(0, valuation_year - unit.model_year)
      depreciation_bps = min(age_years * guide.annual_depreciation_bps,
                             10000 - DEPRECIATION_FLOOR_BPS)          # cap 7000

      # step 2 — guide base, width multiplier, straight-line depreciation
      width_multiplier_bps = guide.multi_wide_multiplier_bps  if unit.width_class == MULTI_WIDE
                             else guide.single_wide_multiplier_bps
      book_base_cents = round_half_up(
          unit.square_feet * guide.base_value_per_sqft_cents
          * width_multiplier_bps / 10000
          * (10000 - depreciation_bps) / 10000 )

      # step 3 — location key (cross-aggregate read: unit -> community)
      location_key = PRIVATE_LAND                     if unit.placement_type == PRIVATE_LAND
                     else COMMUNITY_WITH_AGREEMENT    if community.operator_agreement_status == EXECUTED
                     else COMMUNITY_WITHOUT_AGREEMENT

      # step 4 — the three adjustments; both bps adjustments are taken on
      #          book_base_cents, never on a running subtotal
      condition_adjustment_cents    = round_half_up(book_base_cents * CONDITION_ADJUSTMENT_BPS[unit.condition_grade] / 10000)
      location_adjustment_cents     = round_half_up(book_base_cents * LOCATION_ADJUSTMENT_BPS[location_key] / 10000)
      installation_adjustment_cents = INSTALLATION_ADJUSTMENT_CENTS[unit.installation_type]  if variant == ORIGINATION
                                      else 0

      adjusted_cents = book_base_cents + condition_adjustment_cents
                       + location_adjustment_cents + installation_adjustment_cents

      # step 5 — variant divergence
      if variant == ORIGINATION:
          forced_sale_discount_cents = 0
          detach_and_move_cost_cents = 0
          certified_value_cents      = adjusted_cents
      else:   # RECOVERY_LIQUIDATION
          forced_sale_discount_cents = round_half_up(adjusted_cents * RECOVERY_FORCED_SALE_DISCOUNT_BPS / 10000)
          detach_and_move_cost_cents = DETACH_AND_MOVE_COST_CENTS
                                       if location_key == COMMUNITY_WITHOUT_AGREEMENT else 0
          certified_value_cents      = max(0, adjusted_cents - forced_sale_discount_cents
                                              - detach_and_move_cost_cents)
      # land_value_cents is NEVER part of the unit's value: the land is separate
      # collateral reached through the deed of trust, not through the guide.
    input_set: |
      Exactly one ManufacturedUnit and one BookValueGuide, plus the unit's
      Community when placement_type == COMMUNITY. The guide must satisfy
      guide.effective_date <= logical clock. Prior Valuations on the same unit
      do not feed this computation; creating a new one moves any earlier
      CERTIFIED valuation of the same variant to SUPERSEDED.
    constants:
      CONDITION_ADJUSTMENT_BPS: { EXCELLENT: 800, GOOD: 0, FAIR: -1200, POOR: -2500 }
      LOCATION_ADJUSTMENT_BPS: { COMMUNITY_WITH_AGREEMENT: 300, COMMUNITY_WITHOUT_AGREEMENT: -700, PRIVATE_LAND: 900 }
      INSTALLATION_ADJUSTMENT_CENTS: { PERMANENT_FOUNDATION: 850000, PIER_AND_ANCHOR: 250000 }
      DEPRECIATION_FLOOR_BPS: 3000
      RECOVERY_FORCED_SALE_DISCOUNT_BPS: 2200
      DETACH_AND_MOVE_COST_CENTS: 675000
    precision: "integer cents; round_half_up at each of the three marked points"
    variants:
      - name: ORIGINATION
        when: "underwriting a new loan; the valuation feeds ltv_bps and the insurance requirement"
        difference: "adds the installation adjustment; applies no forced-sale discount and no move cost"
      - name: RECOVERY_LIQUIDATION
        when: "valuing a recovered unit before refurbishment and remarketing"
        difference: "drops the installation adjustment entirely, then subtracts a 2200 bps forced-sale discount and, when the unit sits on a community lot with no executed operator agreement, a flat detach-and-move cost"

  - name: loan_rate_and_term
    trigger: "POST /chattel/loans/{loan_id}/submit-underwriting"
    algorithm: tiered_pricing
    formula: |
      # step 1 — leverage against the certified origination value
      ltv_bps = round_half_up(loan.principal_cents * 10000 / valuation.certified_value_cents)
      if ltv_bps > LTV_CAP_BPS: reject with ERR_LTV_CAP_EXCEEDED     # 9500, inclusive pass

      # step 2 — additive spread stack, then a two-sided clamp
      raw_apr_bps = BASE_APR_BPS
                  + PLACEMENT_SPREAD_BPS[loan.placement_type]
                  + CLASSIFICATION_SPREAD_BPS[loan.collateral_classification]
                  + credit_tier_bps(borrower.credit_score)
                  + ltv_tier_bps(ltv_bps)
                  + (WIND_EXPOSURE_SURCHARGE_BPS if unit.wind_zone == 3
                       and unit.installation_type == PIER_AND_ANCHOR else 0)
      apr_bps = min(APR_CEILING_BPS, max(APR_FLOOR_BPS, raw_apr_bps))

      # step 3 — nested term clamp; every cap applies, the smallest wins
      remaining_life_months = max(0, (USEFUL_LIFE_YEARS - (valuation_year - unit.model_year)) * 12)
      term_months = min(loan.requested_term_months,
                        MAX_TERM_BY_PLACEMENT[loan.placement_type],
                        MAX_TERM_BY_CLASSIFICATION[loan.collateral_classification],
                        remaining_life_months)
      if term_months < MIN_TERM_MONTHS: reject with ERR_TERM_FLOOR_UNREACHABLE

      credit_tier_bps(s) = -200 if s >= 780 else -125 if s >= 720 else 0 if s >= 660
                           else 200 if s >= 600 else 425
      ltv_tier_bps(l)    = 0 if l <= 8000 else 75 if l <= 9000 else 150   # l > 9500 already rejected
    input_set: "the loan under submission, its borrower, its unit, and the CERTIFIED ORIGINATION Valuation named by origination_valuation_id"
    constants:
      BASE_APR_BPS: 875
      PLACEMENT_SPREAD_BPS: { COMMUNITY: 225, PRIVATE_LAND: 50 }
      CLASSIFICATION_SPREAD_BPS: { PERSONAL_PROPERTY: 175, REAL_PROPERTY: 0 }
      CREDIT_TIER_BPS: { "780+": -200, "720-779": -125, "660-719": 0, "600-659": 200, "below-600": 425 }
      LTV_TIER_BPS: { "0-8000": 0, "8001-9000": 75, "9001-9500": 150 }
      WIND_EXPOSURE_SURCHARGE_BPS: 60
      APR_FLOOR_BPS: 799
      APR_CEILING_BPS: 1899
      LTV_CAP_BPS: 9500
      MAX_TERM_BY_PLACEMENT: { COMMUNITY: 240, PRIVATE_LAND: 300 }
      MAX_TERM_BY_CLASSIFICATION: { PERSONAL_PROPERTY: 240, REAL_PROPERTY: 360 }
      USEFUL_LIFE_YEARS: 40
      MIN_TERM_MONTHS: 60
    precision: "integer basis points; ltv_bps is the only rounded quantity (round_half_up); the clamp is applied AFTER the whole stack, never per-term"

  - name: interest_accrual
    trigger: "POST /chattel/loans/{loan_id}/payments and POST /chattel/loans/{loan_id}/servicing-assessment, before any allocation or state assessment"
    algorithm: chronological
    formula: |
      accrual_days = calendar_days(loan.last_accrual_date, logical_clock)   # half-open [from, to)
      accrued_cents = round_half_up(loan.principal_balance_cents
                                    * loan.apr_bps / 10000
                                    * accrual_days / 365)
      loan.interest_accrued_unpaid_cents += accrued_cents
      loan.last_accrual_date = logical_clock
    input_set: "one Loan whose underwriting_state == FUNDED and servicing_state not in {PAID_OFF, CHARGED_OFF}; accrual_days == 0 yields accrued_cents == 0 and is not an error"
    constants:
      DAY_COUNT_BASIS: "actual/365, half-open interval"
    precision: |
      integer cents, ONE round_half_up over the whole product. Accruing the same
      span in two steps (e.g. 31 days then 61 days) MUST NOT be substituted for
      accruing 92 days in one call — the intermediate rounding differs and the
      difference is observable in to_interest_cents.

  - name: payment_waterfall_allocation
    trigger: "POST /chattel/loans/{loan_id}/payments"
    algorithm: waterfall_allocation
    formula: |
      run interest_accrual once, then:
      buckets = { interest:    loan.interest_accrued_unpaid_cents,
                  fees:        loan.fees_outstanding_cents,
                  force_placed: loan.force_placed_premium_outstanding_cents,
                  escrow:      max(0, loan.escrow_target_cents - loan.escrow_balance_cents),
                  principal:   loan.principal_balance_cents }

      order = CHATTEL_CONTRACT_ORDER      if loan.collateral_classification == PERSONAL_PROPERTY
              else REAL_PROPERTY_ESCROW_FIRST

      remaining = amount_cents
      for bucket in order:                       # strictly sequential fill
          applied[bucket] = min(remaining, buckets[bucket])
          remaining      -= applied[bucket]
      if remaining > 0 and payment_kind != PAYOFF: reject with ERR_OVERPAYMENT_NOT_PERMITTED

      loan buckets are decremented by the applied amounts; a REVERSAL row writes
      the exact negatives of the original row's five to_* fields back onto the loan.
    input_set: "one FUNDED Loan and the single incoming PaymentTransaction; reversed rows are excluded from any later allocation"
    constants:
      CHATTEL_CONTRACT_ORDER: ["interest", "fees", "force_placed", "escrow", "principal"]
      REAL_PROPERTY_ESCROW_FIRST: ["escrow", "force_placed", "interest", "fees", "principal"]
    precision: "integer cents; no rounding occurs inside the waterfall — every bucket takes min(remaining, bucket) exactly"
    variants:
      - name: CHATTEL_CONTRACT_ORDER
        when: "loan.collateral_classification == PERSONAL_PROPERTY (retail installment contract on a titled chattel)"
        difference: "accrued interest is satisfied first and the escrow shortfall comes fourth, so a partial payment on a delinquent chattel loan clears interest and fees before it protects the tax-and-insurance escrow"
      - name: REAL_PROPERTY_ESCROW_FIRST
        when: "loan.collateral_classification == REAL_PROPERTY (land-home mortgage)"
        difference: "the escrow shortfall is funded first and the force-placed premium second, so the identical payment on the identical balance sheet leaves accrued interest untouched"

  - name: force_placed_premium
    trigger: "POST /chattel/loans/{loan_id}/force-place-insurance, and required_coverage_cents / compliance_state on every POST /chattel/insurance-policies"
    algorithm: threshold
    formula: |
      insurable_value_cents = certified_value_cents of the loan's CERTIFIED
                              ORIGINATION Valuation
      exposure_cents        = loan.principal_balance_cents if loan.underwriting_state == FUNDED
                              else loan.principal_cents
      required_coverage_cents = max(exposure_cents,
          round_half_up(insurable_value_cents
                        * REQUIRED_COVERAGE_BPS[loan.collateral_classification] / 10000))

      wind_required = (unit.wind_zone == 3)
                      or (unit.wind_zone == 2 and unit.installation_type == PIER_AND_ANCHOR)

      compliance_state = DEFICIENT_WIND      if wind_required and not policy.wind_endorsement
                         else DEFICIENT_COVERAGE if policy.dwelling_coverage_cents < required_coverage_cents
                         else COMPLIANT
      # wind is graded BEFORE coverage: a policy failing both reports DEFICIENT_WIND.

      # force-placed pricing (source == FORCE_PLACED)
      annual_premium_cents = round_half_up(required_coverage_cents
          * (FORCE_PLACED_BASE_RATE_BPS
             + FORCE_PLACED_WIND_SURCHARGE_BPS[unit.wind_zone]) / 10000)
      coverage_days  = calendar_days(effective_date, expiry_date)          # half-open
      premium_cents  = round_half_up(annual_premium_cents * coverage_days / 365)
      loan.force_placed_premium_outstanding_cents += premium_cents

      # refund when a compliant borrower policy displaces a force-placed one
      unearned_premium_refund_cents = round_half_up(
          premium_cents * calendar_days(logical_clock, expiry_date) / coverage_days)
    input_set: "one Loan, its unit, its CERTIFIED ORIGINATION Valuation, and the ACTIVE InsurancePolicy rows on that loan"
    constants:
      REQUIRED_COVERAGE_BPS: { PERSONAL_PROPERTY: 8000, REAL_PROPERTY: 10000 }
      FORCE_PLACED_BASE_RATE_BPS: 185
      FORCE_PLACED_WIND_SURCHARGE_BPS: { 1: 0, 2: 150, 3: 400 }
    precision: "integer cents; the annual premium is rounded first, then the pro-rated premium is rounded from the rounded annual figure — two pinned rounding points, in this order"

  - name: deficiency_settlement
    trigger: "POST /chattel/recovery-cases/{case_id}/finalize-sale"
    algorithm: tiered_pricing
    formula: |
      gross_proceeds_cents = resale_price_cents

      # the commission tier is selected by GROSS proceeds — never by net, and
      # never by the asking price or the liquidation valuation
      tier_bps = 700 if gross_proceeds_cents <= 3000000
                 else 550 if gross_proceeds_cents <= 6000000
                 else 400
      commission_bps = tier_bps + (community.sales_commission_bps
          if unit.placement_type == COMMUNITY
             and community.operator_agreement_status == EXECUTED else 0)
      commission_cents = round_half_up(gross_proceeds_cents * commission_bps / 10000)

      # only CAPITALIZED refurbishment reduces proceeds; EXPENSED refurbishment
      # was already added to recovery_expense_cents when it was recorded
      refurbishment_cost_cents = sum(li.cost_cents for li in refurbishment_line_items
                                     where li.cost_class == CAPITALIZED)
      net_proceeds_cents = gross_proceeds_cents - commission_cents - refurbishment_cost_cents

      payoff_amount_cents = loan.principal_balance_cents
                          + loan.interest_accrued_unpaid_cents
                          + loan.fees_outstanding_cents
                          + loan.force_placed_premium_outstanding_cents
                          + case.recovery_expense_cents
                          - loan.escrow_balance_cents

      deficiency_balance_cents = max(0, payoff_amount_cents - net_proceeds_cents)
      surplus_cents            = max(0, net_proceeds_cents - payoff_amount_cents)
      # exactly one of the two is non-zero; both are 0 on an exact settlement
    input_set: "one RecoveryCase in status REMARKETING, its Loan, the loan's unit, the unit's Community when placement_type == COMMUNITY, and the case's refurbishment_line_items"
    constants:
      COMMISSION_TIER_BPS: { "0-3000000": 700, "3000001-6000000": 550, "6000001+": 400 }
      COMMISSION_TIER_KEY: "gross_proceeds_cents"
    precision: "integer cents; a single round_half_up on the commission, computed from gross proceeds and the combined bps in one multiplication"

  - name: delinquency_and_default_eligibility
    trigger: "POST /chattel/loans/{loan_id}/servicing-assessment and POST /chattel/loans/{loan_id}/default-declare"
    algorithm: threshold
    formula: |
      delinquent_days = max(0, calendar_days(loan.next_due_date, logical_clock))

      default_threshold_days = DEFAULT_ELIGIBLE_DAYS[loan.collateral_classification]
      if loan.placement_type == COMMUNITY and loan.lot_rent_months_delinquent >= LOT_RENT_ACCELERATION_MONTHS:
          default_threshold_days = max(DELINQUENCY_THRESHOLD_DAYS,
                                       default_threshold_days - LOT_RENT_ACCELERATION_DAYS)

      servicing assessment: delinquent_days >= DELINQUENCY_THRESHOLD_DAYS moves
      CURRENT -> DELINQUENT and adds LATE_FEE_FLAT_CENTS once per crossing
      default-declare: requires delinquent_days >= default_threshold_days,
      otherwise ERR_DEFAULT_NOT_ELIGIBLE

      path         = REPOSSESSION if loan.collateral_classification == PERSONAL_PROPERTY else FORECLOSURE
      recovery_expense_cents (seed) = REPOSSESSION_EXPENSE_CENTS if path == REPOSSESSION
                                      else FORECLOSURE_EXPENSE_CENTS
      cure_deadline_date        = logical_clock + RIGHT_TO_CURE_DAYS          (REPOSSESSION arm)
      redemption_window_ends_at = logical_clock + STATUTORY_REDEMPTION_DAYS   (FORECLOSURE arm)
    input_set: "one FUNDED Loan with servicing_state in {CURRENT, DELINQUENT}; its lot-rent counters are maintained by POST /chattel/loans/{loan_id}/lot-rent-report"
    constants:
      DELINQUENCY_THRESHOLD_DAYS: 30
      DEFAULT_ELIGIBLE_DAYS: { PERSONAL_PROPERTY: 60, REAL_PROPERTY: 90 }
      LOT_RENT_ACCELERATION_MONTHS: 2
      LOT_RENT_ACCELERATION_DAYS: 30
      LATE_FEE_FLAT_CENTS: 3500
      REPOSSESSION_EXPENSE_CENTS: 185000
      FORECLOSURE_EXPENSE_CENTS: 425000
      RIGHT_TO_CURE_DAYS: 10
      STATUTORY_REDEMPTION_DAYS: 45
    precision: "whole calendar days, half-open intervals; no rounding"

  - name: borrower_exposure
    trigger: "POST /chattel/loans/{loan_id}/approve, and on every funding, payoff, charge-off, recovery-hold change and lot-placement write"
    algorithm: aggregation
    formula: |
      total_outstanding_principal_cents = sum(l.principal_balance_cents
          for l in loans where l.borrower_id == borrower.id
          and l.servicing_state in {CURRENT, DELINQUENT, DEFAULT, RECOVERY})

      units_under_recovery_hold_count = count(distinct l.unit_id
          for l in loans where l.borrower_id == borrower.id
          and unit(l.unit_id).recovery_hold == true)

      borrower.status = SUSPENDED if units_under_recovery_hold_count > 0 else ACTIVE

      approve gate: total_outstanding_principal_cents + candidate.principal_cents
                    <= EXPOSURE_CAP_CENTS      else ERR_EXPOSURE_CAP_EXCEEDED

      lot occupancy gate on POST /chattel/units and lot writes: a second unit may
      not claim (community_id, lot_number) when the half-open occupancy interval
      [placement_start_date, placement_end_date + LOT_TURNOVER_BUFFER_DAYS) of an
      existing unit contains the new placement_start_date, else
      ERR_LOT_OCCUPANCY_CONFLICT
    input_set: "all Loans of one Borrower in a non-terminal servicing state; PAID_OFF and CHARGED_OFF loans are excluded from the exposure total"
    constants:
      EXPOSURE_CAP_CENTS: 15000000
      LOT_TURNOVER_BUFFER_DAYS: 7
      MAX_FILING_ATTEMPTS: 3
    precision: "integer cents; whole days for the lot-turnover buffer"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the called endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for X-User-Role == CommunityOperator, X-User-ID equals the target Community.id (or the community_id of the target unit/loan); for X-User-Role == Borrower, X-User-ID equals the target Borrower.id (or the borrower_id of the target loan/payment/recovery case)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /chattel/communities/{community_id}/operator-agreement, POST /chattel/loans/{loan_id}/lot-rent-report, and every GET"

  - priority: 4
    category: existence
    check: "every id in the request path exists, resolved left to right"
    error_id: "ERR_BORROWER_NOT_FOUND | ERR_COMMUNITY_NOT_FOUND | ERR_GUIDE_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_FILING_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_RECOVERY_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key in the request body exists: borrower_id, unit_id, guide_id, community_id, land_owner_borrower_id, origination_valuation_id, refinanced_from_loan_id, loan_id, recovery_valuation_id, resale_loan_id"
    error_id: "ERR_BORROWER_NOT_FOUND | ERR_COMMUNITY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_GUIDE_NOT_FOUND | ERR_VALUATION_NOT_FOUND | ERR_LOAN_NOT_FOUND"
    http_status: 404
    applies_to: "POST /chattel/units, POST /chattel/valuations, POST /chattel/loans, POST /chattel/lien-filings, POST /chattel/insurance-policies, POST /chattel/recovery-cases/{case_id}/begin-refurbishment, POST /chattel/recovery-cases/{case_id}/finalize-sale"

  - priority: 6
    category: business_constraint
    check: "every required body field is present, every enum value is a declared member, every *_cents and *_bps value is an integer within its declared range, every date field parses as an ISO 8601 UTC instant, and pagination limit is 1..100 with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 8
    category: business_temporal
    check: "POST /chattel/_clock/set_current_utc may only move the logical clock forward or leave it unchanged; the clock reads 2026-08-01T00:00:00Z until the first successful call"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /chattel/_clock/set_current_utc"

  - priority: 10
    category: business_temporal
    check: "the cited BookValueGuide has effective_date <= the logical clock"
    error_id: ERR_GUIDE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /chattel/valuations"

  - priority: 12
    category: business_constraint
    check: "hud_label_number is not already used by another ManufacturedUnit"
    error_id: ERR_DUPLICATE_HUD_LABEL
    http_status: 409
    applies_to: "POST /chattel/units"

  - priority: 13
    category: business_constraint
    check: "placement fields are internally consistent: placement_type == COMMUNITY requires non-null community_id, lot_number and placement_start_date and null land_owner_borrower_id; placement_type == PRIVATE_LAND requires non-null land_owner_borrower_id, land_parcel_apn and land_county and null community_id"
    error_id: ERR_PLACEMENT_FIELDS_INCONSISTENT
    http_status: 422
    applies_to: "POST /chattel/units"

  - priority: 14
    category: business_temporal
    check: "no other ManufacturedUnit already occupies (community_id, lot_number) over an interval that collides with the new placement: the existing occupancy runs half-open from placement_start_date to placement_end_date + LOT_TURNOVER_BUFFER_DAYS (7), and the new placement_start_date must fall outside it"
    error_id: ERR_LOT_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /chattel/units"

  - priority: 16
    category: state
    check: "expected_unit_version equals the current ManufacturedUnit.version"
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412
    applies_to: "POST /chattel/valuations"

  - priority: 17
    category: state
    check: "expected_loan_version equals the current Loan.version"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /chattel/insurance-policies"

  - priority: 20
    category: state
    check: "the unit's classification permits the requested conversion action: INITIATE requires PERSONAL_PROPERTY, COMPLETE requires CONVERSION_PENDING, RESCIND requires REAL_PROPERTY"
    error_id: ERR_UNIT_CLASSIFICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /chattel/units/{unit_id}/convert-classification"

  - priority: 21
    category: state
    check: "no Loan on this unit has servicing_state in {RECOVERY, CHARGED_OFF} and unit.recovery_hold == false"
    error_id: ERR_RECOVERY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /chattel/units/{unit_id}/convert-classification, POST /chattel/units/{unit_id}/land-documents"

  - priority: 22
    category: state
    check: "the Valuation is in status DRAFT"
    error_id: ERR_VALUATION_NOT_CERTIFIABLE
    http_status: 409
    applies_to: "POST /chattel/valuations/{valuation_id}/certify"

  - priority: 23
    category: state
    check: "the operator-agreement action matches the Community's current status: PROPOSE requires NONE or TERMINATED, EXECUTE requires PENDING, TERMINATE requires EXECUTED"
    error_id: ERR_OPERATOR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /chattel/communities/{community_id}/operator-agreement"

  - priority: 24
    category: state
    check: "the LienFiling is in the status the action requires: agency-response requires SUBMITTED, resubmit requires REJECTED"
    error_id: ERR_FILING_INVALID_STATE
    http_status: 409
    applies_to: "POST /chattel/lien-filings/{filing_id}/agency-response, POST /chattel/lien-filings/{filing_id}/resubmit"

  - priority: 25
    category: business_referential
    check: "the requested action exists on the case's path at all: redeem is only available on path == FORECLOSURE (a REPOSSESSION-path case has a cure period, never a redemption window), and the cure-deadline check only applies on path == REPOSSESSION. This precedes the status check at priority 26 because a REPOSSESSION-path case can never reach status REDEMPTION_WINDOW, so the caller must be told the action does not exist on this arm rather than that the status is wrong."
    error_id: ERR_CLASSIFICATION_PATH_MISMATCH
    http_status: 409
    applies_to: "POST /chattel/recovery-cases/{case_id}/redeem"

  - priority: 26
    category: state
    check: "the RecoveryCase is in the status the action requires: issue-notice requires OPENED, redeem requires REDEMPTION_WINDOW, obtain-possession requires REPO_NOTICE_ISSUED or REDEMPTION_WINDOW, begin-refurbishment requires POSSESSION_OBTAINED, list-for-resale requires REFURBISHING, refurbishment-costs requires REFURBISHING, finalize-sale requires REMARKETING"
    error_id: ERR_RECOVERY_CASE_INVALID_STATE
    http_status: 409
    applies_to: "every POST /chattel/recovery-cases/{case_id}/* endpoint"

  - priority: 28
    category: state
    check: "the Loan's underwriting_state is the one the action requires: submit-underwriting requires DRAFT, approve and decline require UNDERWRITING, fund requires APPROVED"
    error_id: ERR_LOAN_UNDERWRITING_INVALID_STATE
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/submit-underwriting, /approve, /decline, /fund"

  - priority: 30
    category: state
    check: "the Loan's servicing_state is the one the action requires: payments, servicing-assessment and lot-rent-report require CURRENT or DELINQUENT, force-place-insurance requires CURRENT or DELINQUENT, default-declare requires DELINQUENT"
    error_id: ERR_LOAN_SERVICING_INVALID_STATE
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/payments, /servicing-assessment, /lot-rent-report, /force-place-insurance, /default-declare"

  - priority: 32
    category: state
    check: "the target PaymentTransaction has reversed == false and payment_kind != REVERSAL"
    error_id: ERR_PAYMENT_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /chattel/payments/{payment_id}/reverse"

  - priority: 34
    category: business_safety
    check: "the acting X-User-ID differs from the certified_by_user_id of the loan's origination Valuation (segregation of duties between valuation certification and credit approval)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/approve"

  - priority: 36
    category: business_referential
    check: "the cited Valuation has status CERTIFIED, the variant the caller needs (ORIGINATION for a loan, RECOVERY_LIQUIDATION for a recovery case) and unit_id equal to the target unit"
    error_id: ERR_VALUATION_VARIANT_MISMATCH
    http_status: 422
    applies_to: "POST /chattel/loans, POST /chattel/loans/{loan_id}/submit-underwriting, POST /chattel/recovery-cases/{case_id}/begin-refurbishment"

  - priority: 38
    category: business_referential
    check: "filing_type matches the loan's collateral_classification: TITLE_LIEN for PERSONAL_PROPERTY, LAND_HOME_DEED_OF_TRUST for REAL_PROPERTY"
    error_id: ERR_FILING_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /chattel/lien-filings"

  - priority: 39
    category: business_referential
    check: "submitted_documents contains every required code for filing_type: TITLE_LIEN needs [TITLE_APPLICATION, LIEN_ENTRY_FORM]; LAND_HOME_DEED_OF_TRUST needs [DEED_OF_TRUST, AFFIXATION_AFFIDAVIT, TITLE_SURRENDER_RECEIPT]"
    error_id: ERR_FILING_DOCUMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /chattel/lien-filings, POST /chattel/lien-filings/{filing_id}/resubmit"

  - priority: 40
    category: business_constraint
    check: "attempt_number < MAX_FILING_ATTEMPTS (3) before a resubmit increments it"
    error_id: ERR_FILING_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /chattel/lien-filings/{filing_id}/resubmit"

  - priority: 42
    category: business_temporal
    check: "expiry_date is strictly after effective_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /chattel/insurance-policies, POST /chattel/loans/{loan_id}/force-place-insurance"

  - priority: 44
    category: business_temporal
    check: "the new policy's half-open coverage interval [effective_date, expiry_date) does not intersect the half-open interval of any InsurancePolicy on the same loan with status == ACTIVE and source == BORROWER_PROVIDED; touching endpoints (one interval's expiry_date equal to the other's effective_date) do NOT intersect. A FORCE_PLACED policy is deliberately OUT of scope here: a borrower buying real coverage that overlaps a lender-placed policy is the intended way to displace it (that policy moves to CANCELLED with an unearned-premium refund)"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /chattel/insurance-policies"

  - priority: 48
    category: business_referential
    check: "the unit has deed_recorded == true and affixation_affidavit_recorded == true, and placement_type == PRIVATE_LAND"
    error_id: ERR_LAND_DOCUMENTS_INCOMPLETE
    http_status: 409
    applies_to: "POST /chattel/units/{unit_id}/convert-classification with action INITIATE"

  - priority: 50
    category: business_safety
    check: "at least one InsurancePolicy on the loan has status == ACTIVE and its coverage interval contains the logical clock"
    error_id: ERR_INSURANCE_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/fund"

  - priority: 52
    category: business_safety
    check: "when the unit requires wind coverage (wind_zone == 3, or wind_zone == 2 with installation_type == PIER_AND_ANCHOR), the ACTIVE policy has wind_endorsement == true"
    error_id: ERR_WIND_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/fund"

  - priority: 53
    category: business_safety
    check: "the ACTIVE policy's dwelling_coverage_cents >= required_coverage_cents from calculations.force_placed_premium"
    error_id: ERR_DWELLING_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/fund"

  - priority: 55
    category: state
    check: "loan.insurance_compliance == NON_COMPLIANT (there is nothing to force-place against a compliant loan)"
    error_id: ERR_INSURANCE_ALREADY_COMPLIANT
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/force-place-insurance"

  - priority: 56
    category: business_referential
    check: "when loan.placement_type == COMMUNITY, the unit's Community has operator_agreement_status == EXECUTED"
    error_id: ERR_OPERATOR_AGREEMENT_MISSING
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/fund"

  - priority: 57
    category: business_referential
    check: "when the unit sits in a Community, that Community has lender_access_rights == true"
    error_id: ERR_LENDER_ACCESS_NOT_GRANTED
    http_status: 409
    applies_to: "POST /chattel/recovery-cases/{case_id}/obtain-possession"

  - priority: 58
    category: business_referential
    check: "the loan has perfection_state == PERFECTED and exactly one LienFiling in status RECORDED"
    error_id: ERR_PERFECTION_NOT_ESTABLISHED
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/fund, POST /chattel/recovery-cases/{case_id}/obtain-possession"

  - priority: 60
    category: business_constraint
    check: "computed ltv_bps <= LTV_CAP_BPS (9500); exactly 9500 passes"
    error_id: ERR_LTV_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/submit-underwriting"

  - priority: 61
    category: business_constraint
    check: "the term surviving every cap in calculations.loan_rate_and_term is >= MIN_TERM_MONTHS (60)"
    error_id: ERR_TERM_FLOOR_UNREACHABLE
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/submit-underwriting"

  - priority: 62
    category: state
    check: "borrower.status == ACTIVE"
    error_id: ERR_BORROWER_SUSPENDED
    http_status: 409
    applies_to: "POST /chattel/loans, POST /chattel/loans/{loan_id}/approve"

  - priority: 63
    category: business_fiscal
    check: "borrower.total_outstanding_principal_cents + loan.principal_cents <= EXPOSURE_CAP_CENTS (15000000); exactly at the cap passes"
    error_id: ERR_EXPOSURE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/approve"

  - priority: 64
    category: business_temporal
    check: "delinquent_days >= the classification-specific default threshold after any lot-rent acceleration (see calculations.delinquency_and_default_eligibility)"
    error_id: ERR_DEFAULT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /chattel/loans/{loan_id}/default-declare"

  - priority: 65
    category: business_temporal
    check: "the logical clock is >= cure_deadline_date on the REPOSSESSION arm"
    error_id: ERR_CURE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /chattel/recovery-cases/{case_id}/obtain-possession"

  - priority: 66
    category: business_temporal
    check: "the logical clock is >= redemption_window_ends_at on the FORECLOSURE arm before possession may be taken"
    error_id: ERR_REDEMPTION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /chattel/recovery-cases/{case_id}/obtain-possession"

  - priority: 67
    category: business_temporal
    check: "the logical clock is < redemption_window_ends_at when the borrower redeems"
    error_id: ERR_REDEMPTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /chattel/recovery-cases/{case_id}/redeem"

  - priority: 68
    category: business_fiscal
    check: "for payment_kind in {SCHEDULED, PARTIAL} the waterfall must absorb the whole amount_cents; any unallocated remainder is refused"
    error_id: ERR_OVERPAYMENT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/payments"

  - priority: 69
    category: business_fiscal
    check: "for payment_kind == PAYOFF, amount_cents equals interest_accrued_unpaid_cents (after accrual) + fees_outstanding_cents + force_placed_premium_outstanding_cents + principal_balance_cents - escrow_balance_cents to the cent"
    error_id: ERR_PAYOFF_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /chattel/loans/{loan_id}/payments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table (all paths under api_prefix /chattel)
# ---------------------------------------------------------------------------

endpoints:
  # --- logical clock (test-driving endpoint, §1.5 priority ladder step 3) ----
  - method: POST
    path: "/chattel/_clock/set_current_utc"
    description: |
      Sets the server's logical UTC clock, which every deadline, accrual window,
      coverage interval and depreciation year reads. The clock's startup default
      is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the
      logical clock reads that instant and MUST NOT fall back to real wall-clock
      time. The clock may only move forward.
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects:
      - "no entity is mutated; subsequent reads of the clock return current_utc"

  # --- configuration ---------------------------------------------------------
  - method: POST
    path: "/chattel/book-value-guides"
    description: "Publishes an immutable edition of the manufactured-housing book value guide."
    roles: [PlatformAdmin]
    code: 201
    input: [guide_edition, region_code, effective_date, base_value_per_sqft_cents, single_wide_multiplier_bps, multi_wide_multiplier_bps, annual_depreciation_bps]
    output: BookValueGuide
    side_effects: []

  - method: GET
    path: "/chattel/book-value-guides/{guide_id}"
    description: "Reads one guide edition."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager]
    code: 200
    input: []
    output: BookValueGuide
    side_effects: []

  - method: POST
    path: "/chattel/borrowers"
    description: "Registers an obligor."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, credit_score, monthly_income_cents, state_code]
    output: Borrower
    side_effects:
      - "status defaults to ACTIVE; total_outstanding_principal_cents and units_under_recovery_hold_count default to 0"

  - method: GET
    path: "/chattel/borrowers/{borrower_id}"
    description: "Reads one borrower including the derived exposure fields."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: []
    output: Borrower
    side_effects: []

  - method: POST
    path: "/chattel/communities"
    description: "Registers a manufactured home community (land-lease park)."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, lot_count, monthly_lot_rent_cents, "sales_commission_bps?"]
    output: Community
    side_effects:
      - "operator_agreement_status defaults to NONE and lender_access_rights to false"
      - "sales_commission_bps defaults to 0 when the field is omitted"

  - method: GET
    path: "/chattel/communities/{community_id}"
    description: "Reads one community including its operator-agreement posture."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, CommunityOperator]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: POST
    path: "/chattel/communities/{community_id}/operator-agreement"
    description: |
      Drives the community operator agreement. action PROPOSE moves NONE or
      TERMINATED to PENDING (PlatformAdmin), action EXECUTE moves PENDING to
      EXECUTED and may only be called by the CommunityOperator whose X-User-ID
      equals this community's id, action TERMINATE moves EXECUTED to TERMINATED
      (PlatformAdmin).
    roles: [PlatformAdmin, CommunityOperator]
    code: 200
    input: [action]
    output: Community
    side_effects:
      - "EXECUTE sets lender_access_rights = true and agreement_executed_at to the logical clock"
      - "TERMINATE sets lender_access_rights = false and blocks funding on units in this community"
      - "increments Community.version by 1"

  # --- collateral ------------------------------------------------------------
  - method: POST
    path: "/chattel/units"
    description: "Registers a manufactured unit and its placement (community lot or private land)."
    roles: [PlatformAdmin, ClosingAgent]
    code: 201
    input: [hud_label_number, manufacturer, model_year, width_class, square_feet, condition_grade, installation_type, wind_zone, placement_type, "community_id?", "lot_number?", "placement_start_date?", "placement_end_date?", "land_owner_borrower_id?", "land_parcel_apn?", "land_county?", "land_value_cents?"]
    output: ManufacturedUnit
    side_effects:
      - "classification defaults to PERSONAL_PROPERTY and title_status to ACTIVE_TITLE"
      - "enforces the lot occupancy interval check from calculations.borrower_exposure"

  - method: GET
    path: "/chattel/units/{unit_id}"
    description: "Reads one unit including classification, title status and recovery hold."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, CommunityOperator, Borrower]
    code: 200
    input: []
    output: ManufacturedUnit
    side_effects: []

  - method: GET
    path: "/chattel/units"
    description: "Lists units, filterable by community, land owner, classification and placement."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, CommunityOperator, Borrower]
    code: 200
    input: ["community_id?", "land_owner_borrower_id?", "classification?", "placement_type?", "limit?", "offset?"]
    output: ManufacturedUnit[]
    side_effects: []

  - method: POST
    path: "/chattel/units/{unit_id}/land-documents"
    description: |
      Records a land-home document against the unit's parcel. document_type DEED
      sets deed_recorded, AFFIXATION_AFFIDAVIT sets affixation_affidavit_recorded.
      Only meaningful for placement_type == PRIVATE_LAND.
    roles: [ClosingAgent]
    code: 200
    input: [document_type]
    output: ManufacturedUnit
    side_effects:
      - "sets the matching recorded flag to true"
      - "increments ManufacturedUnit.version by 1"

  - method: POST
    path: "/chattel/units/{unit_id}/convert-classification"
    description: |
      Drives the personal-property / real-property classification cycle.
      action INITIATE requires recorded deed and affixation affidavit and moves
      PERSONAL_PROPERTY to CONVERSION_PENDING; action COMPLETE moves
      CONVERSION_PENDING to REAL_PROPERTY and runs the surrender/re-perfection/
      insurance cascade; action RESCIND moves REAL_PROPERTY back to
      PERSONAL_PROPERTY and compensates every side effect of COMPLETE.
    roles: [ClosingAgent]
    code: 200
    input: [action]
    output: ManufacturedUnit
    side_effects:
      - "COMPLETE: title_status -> TITLE_SURRENDERED; every RECORDED TITLE_LIEN -> RELEASED; every non-terminal Loan on the unit gets collateral_classification REAL_PROPERTY and perfection_state RE_PERFECTION_REQUIRED; every ACTIVE InsurancePolicy is re-scored at REQUIRED_COVERAGE_BPS[REAL_PROPERTY] and loan.insurance_compliance is recomputed"
      - "RESCIND: reverses all of the above, restoring released TITLE_LIENs to RECORDED"
      - "increments ManufacturedUnit.version by 1"

  # --- valuation -------------------------------------------------------------
  - method: POST
    path: "/chattel/valuations"
    description: |
      Values a unit against a guide edition. Runs
      calculations.unit_book_valuation in the requested variant. Requires
      expected_unit_version — a stale value is rejected with
      ERR_STALE_UNIT_VERSION (§1.2.1 valuation-create-stale-unit).
    roles: [CreditAnalyst, RecoveryManager]
    code: 201
    input: [unit_id, guide_id, variant, expected_unit_version]
    output: Valuation
    side_effects:
      - "computes location_key, book_base_cents, the three adjustments, the liquidation deductions and certified_value_cents"
      - "moves any earlier CERTIFIED Valuation of the same unit_id and variant to SUPERSEDED"
      - "increments ManufacturedUnit.version by 1"

  - method: GET
    path: "/chattel/valuations/{valuation_id}"
    description: "Reads one valuation with its full adjustment breakdown."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  - method: GET
    path: "/chattel/valuations"
    description: "Lists valuations, filterable by unit, guide, variant and status."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager]
    code: 200
    input: ["unit_id?", "guide_id?", "variant?", "status?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  - method: POST
    path: "/chattel/valuations/{valuation_id}/certify"
    description: "Freezes a DRAFT valuation, stamping the acting X-User-ID as its certifier."
    roles: [CreditAnalyst, RecoveryManager]
    code: 200
    input: []
    output: Valuation
    side_effects:
      - "status -> CERTIFIED, certified_by_user_id = acting X-User-ID, certified_at = logical clock"
      - "the certifier recorded here is the counterparty of the segregation-of-duties check at loan approval"

  # --- origination -----------------------------------------------------------
  - method: POST
    path: "/chattel/loans"
    description: "Opens a loan application against a unit and a CERTIFIED ORIGINATION valuation."
    roles: [CreditAnalyst]
    code: 201
    input: [borrower_id, unit_id, origination_valuation_id, principal_cents, requested_term_months, "refinanced_from_loan_id?"]
    output: Loan
    side_effects:
      - "snapshots collateral_classification from unit.classification and placement_type from unit.placement_type"
      - "underwriting_state DRAFT, servicing_state NOT_SERVICING, perfection_state UNPERFECTED"

  - method: GET
    path: "/chattel/loans/{loan_id}"
    description: "Reads one loan including all three state dimensions and every obligation bucket."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/chattel/loans"
    description: "Lists loans, filterable by borrower, unit, origination valuation, refinance parent and servicing state."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: ["borrower_id?", "unit_id?", "origination_valuation_id?", "refinanced_from_loan_id?", "servicing_state?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: POST
    path: "/chattel/loans/{loan_id}/submit-underwriting"
    description: "Prices the loan: runs calculations.loan_rate_and_term and moves underwriting_state DRAFT -> UNDERWRITING."
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "sets ltv_bps, apr_bps and term_months"
      - "increments Loan.version by 1"

  - method: POST
    path: "/chattel/loans/{loan_id}/approve"
    description: "Credit-approves the loan. Enforces segregation of duties against the valuation certifier and the borrower exposure cap."
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "underwriting_state UNDERWRITING -> APPROVED, approved_by_user_id = acting X-User-ID"
      - "increments Loan.version by 1"

  - method: POST
    path: "/chattel/loans/{loan_id}/decline"
    description: "Declines the loan; terminal on the underwriting dimension."
    roles: [CreditAnalyst]
    code: 200
    input: ["decline_reason?"]
    output: Loan
    side_effects:
      - "underwriting_state UNDERWRITING -> DECLINED"
      - "increments Loan.version by 1"

  - method: POST
    path: "/chattel/loans/{loan_id}/fund"
    description: |
      Funds the approved loan. Requires perfection, a compliant insurance policy
      and — for a community placement — an EXECUTED operator agreement. Starts
      servicing.
    roles: [ClosingAgent]
    code: 200
    input: [first_due_date, "escrow_target_cents?"]
    output: Loan
    side_effects:
      - "underwriting_state APPROVED -> FUNDED, servicing_state NOT_SERVICING -> CURRENT"
      - "escrow_target_cents defaults to 0 when the field is omitted, so the escrow bucket of the payment waterfall is empty"
      - "principal_balance_cents = principal_cents, last_accrual_date = logical clock, next_due_date = first_due_date"
      - "borrower.total_outstanding_principal_cents increases by principal_cents"
      - "increments Loan.version by 1"

  # --- lien perfection -------------------------------------------------------
  - method: POST
    path: "/chattel/lien-filings"
    description: "Submits a perfection instrument for the loan: a title lien with the state title agency, or a land-home deed of trust with the county."
    roles: [ClosingAgent]
    code: 201
    input: [loan_id, filing_type, submitted_documents]
    output: LienFiling
    side_effects:
      - "copies unit_id from the loan, computes missing_documents, sets attempt_number 1"
      - "loan.perfection_state -> FILING_SUBMITTED"
      - "increments Loan.version by 1"

  - method: GET
    path: "/chattel/lien-filings/{filing_id}"
    description: "Reads one filing including attempt count and agency outcome."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager]
    code: 200
    input: []
    output: LienFiling
    side_effects: []

  - method: GET
    path: "/chattel/lien-filings"
    description: "Lists filings, filterable by loan, unit, filing type and status."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager]
    code: 200
    input: ["loan_id?", "unit_id?", "filing_type?", "status?", "limit?", "offset?"]
    output: LienFiling[]
    side_effects: []

  - method: POST
    path: "/chattel/lien-filings/{filing_id}/agency-response"
    description: "Records the recording office's outcome for a SUBMITTED filing (outcome RECORDED or REJECTED)."
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "agency_reference?", "rejection_code?"]
    output: LienFiling
    side_effects:
      - "RECORDED: sets agency_reference and recorded_at, loan.perfection_state -> PERFECTED, and for a TITLE_LIEN sets unit.title_status = TITLE_ENCUMBERED"
      - "REJECTED: sets rejection_code, loan.perfection_state -> UNPERFECTED"
      - "increments Loan.version by 1"

  - method: POST
    path: "/chattel/lien-filings/{filing_id}/resubmit"
    description: "Re-tenders a REJECTED filing with a corrected document set, up to MAX_FILING_ATTEMPTS."
    roles: [ClosingAgent]
    code: 200
    input: [submitted_documents]
    output: LienFiling
    side_effects:
      - "status REJECTED -> SUBMITTED, attempt_number += 1, rejection_code cleared, missing_documents recomputed"
      - "loan.perfection_state -> FILING_SUBMITTED"
      - "increments Loan.version by 1"

  # --- insurance -------------------------------------------------------------
  - method: POST
    path: "/chattel/insurance-policies"
    description: |
      Records a borrower-provided hazard policy on the loan and scores it against
      the requirement matrix. Requires expected_loan_version — a stale value is
      rejected with ERR_STALE_LOAN_VERSION (§1.2.1 policy-create-stale-loan).
    roles: [Servicer, ClosingAgent]
    code: 201
    input: [loan_id, carrier_name, policy_number, dwelling_coverage_cents, wind_deductible_cents, wind_endorsement, effective_date, expiry_date, expected_loan_version]
    output: InsurancePolicy
    side_effects:
      - "computes required_coverage_cents, coverage_days and compliance_state; source = BORROWER_PROVIDED, premium_cents = 0"
      - "moves any earlier ACTIVE BORROWER_PROVIDED policy on the loan to SUPERSEDED"
      - "when the new policy is COMPLIANT and an ACTIVE FORCE_PLACED policy exists, that policy moves to CANCELLED and its unearned premium reduces loan.force_placed_premium_outstanding_cents"
      - "recomputes loan.insurance_compliance"
      - "increments Loan.version by 1"

  - method: GET
    path: "/chattel/insurance-policies/{policy_id}"
    description: "Reads one policy including its compliance grading and premium."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: "/chattel/insurance-policies"
    description: "Lists policies, filterable by loan, status and source."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: ["loan_id?", "status?", "source?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []

  - method: POST
    path: "/chattel/loans/{loan_id}/force-place-insurance"
    description: "Force-places lender-purchased coverage on a NON_COMPLIANT loan and advances the premium."
    roles: [Servicer]
    code: 201
    input: [carrier_name, policy_number, effective_date, expiry_date]
    output: InsurancePolicy
    side_effects:
      - "creates a policy with source = FORCE_PLACED, wind_endorsement = true and dwelling_coverage_cents = required_coverage_cents"
      - "computes premium_cents per calculations.force_placed_premium and adds it to loan.force_placed_premium_outstanding_cents"
      - "recomputes loan.insurance_compliance to COMPLIANT"
      - "increments Loan.version by 1"

  # --- servicing -------------------------------------------------------------
  - method: POST
    path: "/chattel/loans/{loan_id}/lot-rent-report"
    description: "The community operator reports the borrower's lot-rent standing, which can accelerate default eligibility."
    roles: [CommunityOperator]
    code: 200
    input: [months_delinquent, lot_rent_state]
    output: Loan
    side_effects:
      - "sets lot_rent_months_delinquent and lot_rent_state"
      - "increments Loan.version by 1"

  - method: POST
    path: "/chattel/loans/{loan_id}/payments"
    description: "Posts cash to the loan: accrues interest once, then runs the classification-selected waterfall."
    roles: [Servicer]
    code: 201
    input: [amount_cents, payment_kind]
    output: PaymentTransaction
    side_effects:
      - "runs calculations.interest_accrual then calculations.payment_waterfall_allocation"
      - "decrements every touched obligation bucket and credits escrow_balance_cents"
      - "a fully-cured DELINQUENT loan returns to CURRENT and next_due_date advances one month"
      - "payment_kind PAYOFF zeroes the loan, moves servicing_state to PAID_OFF, perfection_state to RELEASED and the RECORDED filing to RELEASED"
      - "increments Loan.version by 1"

  - method: GET
    path: "/chattel/payments/{payment_id}"
    description: "Reads one payment row with its five allocation buckets."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: []
    output: PaymentTransaction
    side_effects: []

  - method: GET
    path: "/chattel/payments"
    description: "Lists payment rows, filterable by loan, reversal target and kind; ordered by created_at ASC."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: ["loan_id?", "reverses_payment_id?", "payment_kind?", "limit?", "offset?"]
    output: PaymentTransaction[]
    side_effects: []

  - method: POST
    path: "/chattel/payments/{payment_id}/reverse"
    description: "Reverses a posted payment by writing a compensating REVERSAL row that negates each of the original's five allocation buckets."
    roles: [Servicer]
    code: 201
    input: ["reversal_reason?"]
    output: PaymentTransaction
    side_effects:
      - "creates a REVERSAL row with reverses_payment_id set and the five to_* fields as exact negatives of the original"
      - "restores every loan obligation bucket to its pre-payment amount without re-accruing interest"
      - "marks the original row reversed = true"
      - "increments Loan.version by 1"

  - method: POST
    path: "/chattel/loans/{loan_id}/servicing-assessment"
    description: |
      Advances servicing against the logical clock: accrues interest, refreshes
      delinquent_days, lapses an expired policy, and crosses the delinquency
      threshold when due.
    roles: [Servicer]
    code: 200
    input: []
    output: Loan
    side_effects:
      - "runs calculations.interest_accrual and calculations.delinquency_and_default_eligibility"
      - "an ACTIVE InsurancePolicy whose expiry_date is at or before the clock moves to LAPSED and insurance_compliance becomes NON_COMPLIANT"
      - "CURRENT -> DELINQUENT adds LATE_FEE_FLAT_CENTS once"
      - "increments Loan.version by 1"

  # --- default and recovery --------------------------------------------------
  - method: POST
    path: "/chattel/loans/{loan_id}/default-declare"
    description: "Declares default on a DELINQUENT loan and opens a RecoveryCase on the classification-appropriate enforcement path."
    roles: [RecoveryManager]
    code: 201
    input: []
    output: RecoveryCase
    side_effects:
      - "loan.servicing_state DELINQUENT -> DEFAULT"
      - "creates a RecoveryCase in OPENED with path REPOSSESSION or FORECLOSURE and the path expense seed"
      - "sets unit.recovery_hold = true and unit.title_status = TITLE_ENCUMBERED"
      - "borrower.units_under_recovery_hold_count += 1, which sets borrower.status = SUSPENDED"
      - "increments Loan.version by 1"

  - method: GET
    path: "/chattel/recovery-cases/{case_id}"
    description: "Reads one recovery case including refurbishment lines and the settlement figures."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: []
    output: RecoveryCase
    side_effects: []

  - method: GET
    path: "/chattel/recovery-cases"
    description: "Lists recovery cases, filterable by loan, liquidation valuation, resale loan, path and status."
    roles: [PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer, RecoveryManager, Borrower]
    code: 200
    input: ["loan_id?", "recovery_valuation_id?", "resale_loan_id?", "path?", "status?", "limit?", "offset?"]
    output: RecoveryCase[]
    side_effects: []

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/issue-notice"
    description: "Issues the enforcement notice; the arm taken and the deadline set depend on the case's path."
    roles: [RecoveryManager]
    code: 200
    input: [notice_reference]
    output: RecoveryCase
    side_effects:
      - "REPOSSESSION: status -> REPO_NOTICE_ISSUED, cure_deadline_date = clock + RIGHT_TO_CURE_DAYS"
      - "FORECLOSURE: status -> REDEMPTION_WINDOW, redemption_window_ends_at = clock + STATUTORY_REDEMPTION_DAYS"
      - "loan.servicing_state DEFAULT -> RECOVERY"

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/redeem"
    description: "The borrower redeems inside the statutory redemption window; only available on the FORECLOSURE arm."
    roles: [RecoveryManager]
    code: 200
    input: []
    output: RecoveryCase
    side_effects:
      - "status REDEMPTION_WINDOW -> CLOSED_REDEEMED"
      - "loan.servicing_state RECOVERY -> CURRENT"
      - "unit.recovery_hold = false; borrower.units_under_recovery_hold_count -= 1 and status returns to ACTIVE at zero"

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/obtain-possession"
    description: "Takes possession of the unit once the cure period or redemption window has run and the lien is recorded."
    roles: [RecoveryManager]
    code: 200
    input: []
    output: RecoveryCase
    side_effects:
      - "status -> POSSESSION_OBTAINED, possession_date = logical clock"

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/begin-refurbishment"
    description: "Attaches a CERTIFIED RECOVERY_LIQUIDATION valuation and opens refurbishment."
    roles: [RecoveryManager]
    code: 200
    input: [recovery_valuation_id]
    output: RecoveryCase
    side_effects:
      - "status POSSESSION_OBTAINED -> REFURBISHING and recovery_valuation_id is set"

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/refurbishment-costs"
    description: |
      Appends one refurbishment line. cost_class CAPITALIZED reduces net
      proceeds at sale; cost_class EXPENSED is charged immediately to
      recovery_expense_cents and therefore raises the payoff amount instead.
    roles: [RecoveryManager]
    code: 200
    input: [category, cost_cents, cost_class]
    output: RecoveryCase
    side_effects:
      - "appends { category, cost_cents, cost_class, recorded_at } to refurbishment_line_items"
      - "CAPITALIZED: refurbishment_cost_cents += cost_cents"
      - "EXPENSED: recovery_expense_cents += cost_cents"

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/list-for-resale"
    description: "Lists the refurbished unit for resale."
    roles: [RecoveryManager]
    code: 200
    input: [asking_price_cents]
    output: RecoveryCase
    side_effects:
      - "status REFURBISHING -> REMARKETING and asking_price_cents is set"

  - method: POST
    path: "/chattel/recovery-cases/{case_id}/finalize-sale"
    description: "Closes the sale and settles the loan: runs calculations.deficiency_settlement and closes the case on the deficiency, settled or surplus arm."
    roles: [RecoveryManager]
    code: 200
    input: [resale_price_cents, "resale_loan_id?"]
    output: RecoveryCase
    side_effects:
      - "computes gross_proceeds_cents, commission_bps, commission_cents, net_proceeds_cents, payoff_amount_cents, deficiency_balance_cents and surplus_cents"
      - "zeroes every loan obligation bucket and moves servicing_state to CHARGED_OFF (deficiency) or PAID_OFF (settled/surplus)"
      - "clears unit.recovery_hold, sets unit.title_status = ACTIVE_TITLE, and moves the RECORDED filing to RELEASED"
      - "borrower.units_under_recovery_hold_count -= 1 and status returns to ACTIVE at zero"
      - "increments Loan.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a CommunityOperator acts on a Community other than the one its X-User-ID names, or a Borrower reads a resource that does not belong to it"

  # existence
  - id: ERR_BORROWER_NOT_FOUND
    http: 404
    condition: "borrower_id or land_owner_borrower_id does not resolve"
  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "community_id does not resolve"
  - id: ERR_GUIDE_NOT_FOUND
    http: 404
    condition: "guide_id does not resolve"
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unit_id does not resolve"
  - id: ERR_VALUATION_NOT_FOUND
    http: 404
    condition: "valuation_id, origination_valuation_id or recovery_valuation_id does not resolve"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "loan_id, refinanced_from_loan_id or resale_loan_id does not resolve"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "filing_id does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id does not resolve"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment_id does not resolve"
  - id: ERR_RECOVERY_CASE_NOT_FOUND
    http: 404
    condition: "case_id does not resolve"

  # request shape and clock
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, undeclared enum member, out-of-range number, unparseable ISO 8601 instant, expiry_date not after effective_date, or pagination limit outside 1..100"
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "POST /chattel/_clock/set_current_utc asks the logical clock to move backwards"

  # collateral and valuation
  - id: ERR_DUPLICATE_HUD_LABEL
    http: 409
    condition: "another ManufacturedUnit already carries this hud_label_number"
  - id: ERR_PLACEMENT_FIELDS_INCONSISTENT
    http: 422
    condition: "the placement field set does not match placement_type (community fields on private land, or land fields on a community lot)"
  - id: ERR_LOT_OCCUPANCY_CONFLICT
    http: 409
    condition: "the requested (community_id, lot_number) is still occupied once the 7-day turnover buffer is added to the incumbent's placement_end_date"
  - id: ERR_GUIDE_NOT_EFFECTIVE
    http: 422
    condition: "the cited BookValueGuide's effective_date is after the logical clock"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version does not equal the ManufacturedUnit's current version (§1.2.1 valuation-create-stale-unit)"
  - id: ERR_VALUATION_NOT_CERTIFIABLE
    http: 409
    condition: "the target Valuation is not in status DRAFT"
  - id: ERR_VALUATION_VARIANT_MISMATCH
    http: 422
    condition: "the cited Valuation is not CERTIFIED, is of the wrong variant for the operation, or belongs to a different unit"
  - id: ERR_UNIT_CLASSIFICATION_INVALID_STATE
    http: 409
    condition: "the conversion action does not match the unit's current classification"
  - id: ERR_LAND_DOCUMENTS_INCOMPLETE
    http: 409
    condition: "conversion INITIATE attempted without both a recorded deed and a recorded affixation affidavit, or on a community placement"
  - id: ERR_RECOVERY_HOLD_ACTIVE
    http: 409
    condition: "the unit is under a recovery hold, or a loan on it is in servicing_state RECOVERY or CHARGED_OFF"

  # perfection
  - id: ERR_FILING_TYPE_MISMATCH
    http: 422
    condition: "filing_type does not match the loan's collateral_classification"
  - id: ERR_FILING_DOCUMENTS_INCOMPLETE
    http: 422
    condition: "submitted_documents omits a required document code for the filing_type"
  - id: ERR_FILING_INVALID_STATE
    http: 409
    condition: "agency-response on a filing that is not SUBMITTED, or resubmit on a filing that is not REJECTED"
  - id: ERR_FILING_ATTEMPT_LIMIT
    http: 409
    condition: "resubmit attempted when attempt_number has already reached MAX_FILING_ATTEMPTS (3)"
  - id: ERR_PERFECTION_NOT_ESTABLISHED
    http: 409
    condition: "funding or possession attempted without perfection_state == PERFECTED and a RECORDED LienFiling"

  # insurance
  - id: ERR_COVERAGE_PERIOD_OVERLAP
    http: 409
    condition: "the new policy's half-open coverage interval intersects an ACTIVE policy's interval on the same loan"
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "expected_loan_version does not equal the Loan's current version (§1.2.1 policy-create-stale-loan)"
  - id: ERR_INSURANCE_NON_COMPLIANT
    http: 409
    condition: "funding attempted with no ACTIVE InsurancePolicy covering the logical clock"
  - id: ERR_WIND_COVERAGE_INSUFFICIENT
    http: 422
    condition: "the unit requires a wind endorsement (zone 3, or zone 2 on piers and anchors) and the ACTIVE policy has none"
  - id: ERR_DWELLING_COVERAGE_INSUFFICIENT
    http: 422
    condition: "the ACTIVE policy's dwelling_coverage_cents is below required_coverage_cents"
  - id: ERR_INSURANCE_ALREADY_COMPLIANT
    http: 409
    condition: "force-placement attempted on a loan whose insurance_compliance is not NON_COMPLIANT"

  # origination and exposure
  - id: ERR_LOAN_UNDERWRITING_INVALID_STATE
    http: 409
    condition: "the loan's underwriting_state does not permit the requested origination action"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the approving X-User-ID is the same user that certified the origination valuation"
  - id: ERR_LTV_CAP_EXCEEDED
    http: 422
    condition: "computed ltv_bps exceeds 9500"
  - id: ERR_TERM_FLOOR_UNREACHABLE
    http: 422
    condition: "every term cap together leaves a term below MIN_TERM_MONTHS (60)"
  - id: ERR_BORROWER_SUSPENDED
    http: 409
    condition: "the borrower's status is SUSPENDED because a unit of theirs is under a recovery hold"
  - id: ERR_EXPOSURE_CAP_EXCEEDED
    http: 422
    condition: "approving the loan would push the borrower's outstanding principal above EXPOSURE_CAP_CENTS (15000000)"
  - id: ERR_OPERATOR_AGREEMENT_MISSING
    http: 409
    condition: "funding a community-placed loan whose Community is not in operator_agreement_status EXECUTED"
  - id: ERR_OPERATOR_AGREEMENT_INVALID_STATE
    http: 409
    condition: "the operator-agreement action does not match the Community's current operator_agreement_status"

  # servicing
  - id: ERR_LOAN_SERVICING_INVALID_STATE
    http: 409
    condition: "the loan's servicing_state does not permit the requested servicing or default action"
  - id: ERR_OVERPAYMENT_NOT_PERMITTED
    http: 422
    condition: "a SCHEDULED or PARTIAL payment leaves an unallocated remainder after the whole waterfall"
  - id: ERR_PAYOFF_AMOUNT_MISMATCH
    http: 422
    condition: "a PAYOFF payment's amount_cents differs from the computed payoff amount"
  - id: ERR_PAYMENT_ALREADY_REVERSED
    http: 409
    condition: "the target payment is already reversed, or is itself a REVERSAL row"

  # recovery
  - id: ERR_DEFAULT_NOT_ELIGIBLE
    http: 409
    condition: "delinquent_days has not reached the classification-specific default threshold after any lot-rent acceleration"
  - id: ERR_RECOVERY_CASE_INVALID_STATE
    http: 409
    condition: "the recovery action does not match the case's current status"
  - id: ERR_CLASSIFICATION_PATH_MISMATCH
    http: 409
    condition: "redemption attempted on a REPOSSESSION-path case, which has a cure period rather than a redemption window"
  - id: ERR_CURE_PERIOD_ACTIVE
    http: 409
    condition: "possession attempted before cure_deadline_date on the REPOSSESSION arm"
  - id: ERR_REDEMPTION_WINDOW_OPEN
    http: 409
    condition: "possession attempted before redemption_window_ends_at on the FORECLOSURE arm"
  - id: ERR_REDEMPTION_WINDOW_CLOSED
    http: 409
    condition: "redemption attempted at or after redemption_window_ends_at"
  - id: ERR_LENDER_ACCESS_NOT_GRANTED
    http: 409
    condition: "possession of a community-placed unit attempted while the Community's lender_access_rights is false"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: PlatformAdmin
    description: "operations staff: reference data, the logical clock, and the recording-agency inbound channel"
    identity: opaque
    exclusive_operations:
      - "POST /chattel/_clock/set_current_utc"
      - "POST /chattel/book-value-guides"
      - "POST /chattel/borrowers"
      - "POST /chattel/communities"
      - "POST /chattel/lien-filings/{filing_id}/agency-response"
      - "POST /chattel/communities/{community_id}/operator-agreement with action PROPOSE or TERMINATE"
    shared_operations:
      - "POST /chattel/units (with ClosingAgent)"
      - "every GET"

  - name: CreditAnalyst
    description: "underwriting: values collateral, prices the loan, approves or declines credit"
    identity: opaque
    exclusive_operations:
      - "POST /chattel/loans"
      - "POST /chattel/loans/{loan_id}/submit-underwriting"
      - "POST /chattel/loans/{loan_id}/approve"
      - "POST /chattel/loans/{loan_id}/decline"
    shared_operations:
      - "POST /chattel/valuations (with RecoveryManager)"
      - "POST /chattel/valuations/{valuation_id}/certify (with RecoveryManager)"
      - "every GET"
    note: "the X-User-ID that certifies a valuation may never be the X-User-ID that approves the loan secured by it"

  - name: ClosingAgent
    description: "closing and perfection: land documents, classification conversion, lien filings, funding"
    identity: opaque
    exclusive_operations:
      - "POST /chattel/units/{unit_id}/land-documents"
      - "POST /chattel/units/{unit_id}/convert-classification"
      - "POST /chattel/lien-filings"
      - "POST /chattel/lien-filings/{filing_id}/resubmit"
      - "POST /chattel/loans/{loan_id}/fund"
    shared_operations:
      - "POST /chattel/units (with PlatformAdmin)"
      - "POST /chattel/insurance-policies (with Servicer)"
      - "every GET"

  - name: Servicer
    description: "cash and coverage: payments, reversals, periodic assessment, force-placed insurance"
    identity: opaque
    exclusive_operations:
      - "POST /chattel/loans/{loan_id}/payments"
      - "POST /chattel/payments/{payment_id}/reverse"
      - "POST /chattel/loans/{loan_id}/servicing-assessment"
      - "POST /chattel/loans/{loan_id}/force-place-insurance"
    shared_operations:
      - "POST /chattel/insurance-policies (with ClosingAgent)"
      - "every GET"

  - name: RecoveryManager
    description: "default enforcement: declares default, works the repossession or foreclosure arm, refurbishes and remarkets recovered units"
    identity: opaque
    exclusive_operations:
      - "POST /chattel/loans/{loan_id}/default-declare"
      - "POST /chattel/recovery-cases/{case_id}/issue-notice"
      - "POST /chattel/recovery-cases/{case_id}/redeem"
      - "POST /chattel/recovery-cases/{case_id}/obtain-possession"
      - "POST /chattel/recovery-cases/{case_id}/begin-refurbishment"
      - "POST /chattel/recovery-cases/{case_id}/refurbishment-costs"
      - "POST /chattel/recovery-cases/{case_id}/list-for-resale"
      - "POST /chattel/recovery-cases/{case_id}/finalize-sale"
    shared_operations:
      - "POST /chattel/valuations (with CreditAnalyst) — used for the RECOVERY_LIQUIDATION variant"
      - "POST /chattel/valuations/{valuation_id}/certify (with CreditAnalyst)"
      - "every GET"

  - name: CommunityOperator
    description: "the community operator: executes its own operator agreement and reports lot-rent standing on units in its park"
    identity: "entity_backed:Community"
    exclusive_operations:
      - "POST /chattel/communities/{community_id}/operator-agreement with action EXECUTE"
      - "POST /chattel/loans/{loan_id}/lot-rent-report"
    shared_operations:
      - "GET /chattel/communities/{community_id}, GET /chattel/units and GET /chattel/units/{unit_id}, restricted to its own community"

  - name: Borrower
    description: "the obligor: reads its own loans, collateral, coverage, payments and recovery cases"
    identity: "entity_backed:Borrower"
    exclusive_operations: []
    shared_operations:
      - "GET /chattel/borrowers/{borrower_id}, GET /chattel/loans, GET /chattel/loans/{loan_id}, GET /chattel/units, GET /chattel/units/{unit_id}, GET /chattel/insurance-policies, GET /chattel/insurance-policies/{policy_id}, GET /chattel/payments, GET /chattel/payments/{payment_id}, GET /chattel/recovery-cases, GET /chattel/recovery-cases/{case_id} — restricted to resources whose borrower_id equals its X-User-ID"
