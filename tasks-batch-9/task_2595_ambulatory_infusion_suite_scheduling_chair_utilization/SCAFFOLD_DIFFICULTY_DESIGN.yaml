              payload: { center_id: "${ctr}", patient_id: "${pt2}", treatment_plan_id: "${pl2}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 780, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
