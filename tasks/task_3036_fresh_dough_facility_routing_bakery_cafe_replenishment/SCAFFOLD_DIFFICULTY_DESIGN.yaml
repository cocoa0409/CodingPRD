              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C2", facility_id: "${f1_id}", ownership_type: "COMPANY", credit_limit_cents: 200000 }
              as: FacilityPlanner
