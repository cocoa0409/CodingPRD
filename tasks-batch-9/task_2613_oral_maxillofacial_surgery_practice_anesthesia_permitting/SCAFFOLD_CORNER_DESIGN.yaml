        distinguishing_aspect: "Practice.open_adverse_event_count is a denormalized roll-up: it must read 1 from the moment a MODERATE event is reported, survive both review hops unchanged, and fall to 0 exactly on CLOSED - with Practice.version bumped by that cascade."
