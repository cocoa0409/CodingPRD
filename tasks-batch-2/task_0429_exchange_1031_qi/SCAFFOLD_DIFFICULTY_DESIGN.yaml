          Interval semantics B — a different resource (the Exchange's 180-day acquisition window
          on the replacement-properties endpoint) with a CLOSED-end inclusive boundary but a
          LONGER aggregate span: acquiring AFTER exchange_deadline_at (day 181, 2026-08-29) fails,
