              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la1_id: "$.data.id" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k2_id}", cause: "STOLEN_SUSPECTED", assessment_basis: "DEPRECIATED_BOOK", expected_keg_version: "${k2_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la2_id: "$.data.id" }
            - call: "POST /loss-assessments/${la2_id}/resolve"
              payload: { resolution: "WAIVED", resolution_notes: "Theft not substantiated; re-valuing as a trade loss." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
            - call: "GET /kegs/${k2_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k2_v2: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k2_id}", cause: "LOST_IN_TRADE", assessment_basis: "DEPRECIATED_BOOK", expected_keg_version: "${k2_v2}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la3_id: "$.data.id" }
          assert:
            - "all three creates return HTTP 201: an unusable basis is never ERR_INVALID_REQUEST"
            - "LossAssessment.${la1_id}.assessment_basis == REPLACEMENT_COST (coerced, because Keg.${k1_id}.fill_count == 0) with gross_value_cents == 23500, scrap_credit_cents == 0, assessed_value_cents == 23500, brewer_liability_pct_bp == 6000 and net_chargeback_cents == 14100"
            - "LossAssessment.${la2_id}.assessment_basis == REPLACEMENT_COST too (coerced by the cause, even though fill_count is 8) with gross_value_cents == 23500 and net_chargeback_cents == 0, because LIABILITY_BP[STOLEN_SUSPECTED] is 0"
            - "${la2_id}.chargeback_status == NONE and stays NONE after the WAIVE: a zero-liability assessment never issues a chargeback"
            - "LossAssessment.${la3_id}.assessment_basis == DEPRECIATED_BOOK — the same payload key is honoured here because fill_count 8 > 0 and the cause is not STOLEN_SUSPECTED"
            - "${la3_id} carries depreciation_bp 8 * 45 == 360, book_value == round_half_up(23500 * 9640 / 10000) == 22654, book_floor == round_half_up(23500 * 0.30) == 7050, gross_value_cents == max(22654, 7050) == 22654 and net_chargeback_cents == round_half_up(22654 * 6000 / 10000) == 13592"
            - "13592 != 14100: the honoured variant and the coerced variant differ for kegs out of the same pool, which is exactly the observable this coercion rule protects"
            - "no chargeback was issued by any of these creates: Brewer.${b1_id}.chargeback_balance_cents == 0 and upheld_loss_count == 0, since only an UPHELD resolution issues money"
            - "the commodity_index_id pinned on all three assessments is the 2026-07-01 row, and stainless_scrap_value_cents on both kegs is 3900 even though only a DAMAGED_BEYOND_REPAIR cause would ever credit it"

      - name: the_trailing_window_and_lifetime_loss_rates_disagree_about_probation
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: brewer_loss_rate_trailing_window_versus_lifetime_divergence
          rationale: "That §1.8 instance is built precisely on the second dual-variant calculation: it advances the logical clock until an upheld loss falls out of the 90-day window, asserts that loss_rate_bp_trailing_90d and loss_rate_bp_lifetime disagree, and proves the probation gate reads TRAILING_90D only. Every claim a layer-level instance could make about variant selection here is already asserted there."

      - name: both_probation_gates_arm_together_and_only_the_recorded_reason_can_be_undone
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.brewer_loss_rate_bp
          - state_machines.LossAssessment.assessment_status["DISPUTED/PROPOSED -> UPHELD"]
          - state_machines.LossAssessment.chargeback_status["ISSUED -> REVERSED"]
          - calculations.float_posture
        distinguishing_aspect: "Two independent rate/threshold gates fire inside ONE uphold (balance 50000 >= 25000 and trailing rate 10000 bp >= 1500 bp) and the recorded status_reason must be the balance one, because cascade L3 runs first and the loss-rate gate refuses to overwrite a non-ACTIVE status. The reversal then exposes the asymmetry that ordering creates: it lifts the probation it can name, the trailing rate is NOT recomputed by a money event, and the very next FILL scan re-probates the brewer with the other reason."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; brewer RDG credit_limit_cents 400000."
            - "Pool HB-BIG with replacement_cost_cents 50000 and four kegs, so a NOT_RETURNED_DWELL assessment at 10000 bp liability is worth the full 50000, twice the 25000 balance gate."
            - "Agreement float_size_kegs 4 at 2200 activated 2026-08-01; an order for TWO kegs allocated and dispatched, so a second dispatched keg is on hand to fill after the reversal."
            - "K-0001 is FILLed once at 10:00Z (the only FILL in the window, so the trailing denominator is 1), then analyst-1 opens a NOT_RETURNED_DWELL assessment on it at REPLACEMENT_COST."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-BIG", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 50000, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "B-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "B-0002" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k2_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "B-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "B-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 4, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-01T10:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "NOT_RETURNED_DWELL", assessment_basis: "REPLACEMENT_COST", expected_keg_version: "${k1_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la1_id: "$.data.id" }
          trigger:
            - call: "POST /loss-assessments/${la1_id}/resolve"
              payload: { resolution: "UPHELD", resolution_notes: "Never returned; dwell far past the limit." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
            - call: "GET /brewers/${b1_id}/loss-rate"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /loss-assessments/${la1_id}/chargeback-resolution"
              payload: { action: "REVERSE", resolution_notes: "Keg turned up in the distributor's back lot." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /kegs/${k2_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-01T20:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
          assert:
            - "the uphold returns HTTP 200 with net_chargeback_cents == 50000 (gross 50000, scrap credit 0, liability 10000 bp) and chargeback_status == ISSUED"
            - "both gates were armed: Brewer.${b1_id}.chargeback_balance_cents == 50000 (>= 25000) and loss_rate_bp_trailing_90d == 10000 (1 upheld / 1 FILL, >= 1500)"
            - "status == PROBATION with status_reason == CHARGEBACK_BALANCE_THRESHOLD, NOT LOSS_RATE_THRESHOLD: cascade L3 runs before the loss-rate gate, which then sees status != ACTIVE and does not overwrite the reason"
            - "GET /brewers/${b1_id}/loss-rate returns basis TRAILING_90D with loss_rate_bp == 10000, numerator 1, denominator 1 and basis_insufficient false; the LIFETIME variant is also 10000 here, so the divergence is not what drives this instance"
            - "FloatAgreement.${fa1_id}.float_posture == SUSPENDED and pending_replenishment_kegs == 0 while the brewer is on probation"
            - "the REVERSE returns HTTP 200: chargeback_status == REVERSED, assessment_status still UPHELD, Brewer.${b1_id}.chargeback_balance_cents == 0"
            - "the reversal lifts exactly the probation it can name: status == ACTIVE with status_reason == null, and FloatAgreement.${fa1_id}.float_posture is back to TIGHT with pending_replenishment_kegs == 3 (float_size 4 minus the one keg still at the brewer)"
            - "the loss counters are untouched by the money event: upheld_loss_count == 1 and loss_rate_bp_trailing_90d is still 10000 even though the brewer is ACTIVE again — a rate above the gate does not by itself re-probate anyone, because the gate is only evaluated on a resolution or a FILL"
            - "the FILL on ${k2_id} returns HTTP 201 (the float was released) and is exactly such an evaluation: the trailing rate recomputes to 1 upheld / 2 FILLs == 5000 bp, still >= 1500, and the brewer goes back to PROBATION with status_reason == LOSS_RATE_THRESHOLD"
            - "that second probation is not lifted by anything in this instance: FloatAgreement.${fa1_id}.float_posture == SUSPENDED again, and Keg.${k2_id}.custody_state == FILLED with fill_count 1"
            - "KegPool.${p1_id}: kegs_total == 4, kegs_available == 2, kegs_circulating == 1, kegs_written_off == 1 (${k1_id} is LOST), available_pct == 50.00, posture == OPEN — the reversal never resurrects the keg"

      - name: available_pct_exactly_on_the_restrict_threshold_is_still_open
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: pool_available_pct_exactly_at_restrict_threshold_stays_open
          rationale: "That §1.8 boundary instance already lands available_pct exactly on restrict_threshold_pct and on freeze_threshold_pct and asserts the inclusive comparison for both (25.00 -> OPEN, 10.00 -> RESTRICTED, one keg further -> the next posture down), together with the downstream float_posture and order verdicts. A layer-level rate_threshold_triggers instance would re-run the same census arithmetic."

  # ==========================================================================
  # CONSISTENCY MODEL — complexity_profile.consistency_model = immediate, so the
  # only claim_type used is `immediate`; `eventual` and `saga` are not declared
  # and are not probed. Nothing in this API is deferred: there is no background
  # worker, the logical clock only moves when a request moves it, and the
  # replenishment sweep is an operator-triggered endpoint, not a schedule.
  # ==========================================================================
  - section: Consistency Model
    instances:
      - name: every_cascade_of_a_write_is_readable_in_that_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.LossAssessment.assessment_status["PROPOSED -> UPHELD"]
          - calculations.pool_census_conserved
          - calculations.chargeback_ledger_conserved
        distinguishing_aspect: "One uphold rewrites five rows across four aggregates (assessment, keg, pool, brewer, agreement) and every one of them is already final in the response body of that request — the reads that follow only confirm it. The instance also pins the negative side of `immediate`: repeating the reads changes nothing, and the two conserved-quantity invariants hold at the END of the request rather than after some later reconciliation."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index 2026-07-01 at 480; brewer RDG credit_limit_cents 400000; pool HB-50L replacement_cost_cents 23500 with four kegs."
            - "Agreement float_size_kegs 4 at 2200 activated 2026-08-01; one keg allocated, dispatched and FILLed at 12:00Z (fill_count 1)."
            - "analyst-1 opens a LOST_IN_TRADE assessment at DEPRECIATED_BOOK: depreciation 45 bp, book 23394, floor 7050, gross 23394, net round_half_up(23394 * 0.6) == 14036, which is BELOW the 25000 balance gate so the probation reason is the loss-rate one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
              payload: { brewer_id: "${b1_id}", pool_id: "${p1_id}", float_size_kegs: 4, per_fill_rate_cents: 2200 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_id: "$.data.id" }
            - call: "POST /float-agreements/${fa1_id}/activate"
              payload: { effective_date: "2026-08-01" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { fa1_v: "$.data.version" }
            - call: "POST /issuance-orders"
              payload: { agreement_id: "${fa1_id}", requested_keg_count: 1 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { o1_id: "$.data.id" }
            - call: "POST /issuance-orders/${o1_id}/allocate"
              payload: { expected_agreement_version: "${fa1_v}" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /issuance-orders/${o1_id}/dispatch"
              payload: { dispatched_at: "2026-08-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /kegs/${k1_id}/scan"
              payload: { scan_point: "FILL", party_type: "BREWER", scanned_at: "2026-08-01T12:00:00Z", brand_code_scanned: "RDG", brewer_id: "${b1_id}" }
              as: Brewer
              as_user_id: "${b1_id}"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { k1_v: "$.data.version" }
            - call: "POST /loss-assessments"
              payload: { keg_id: "${k1_id}", cause: "LOST_IN_TRADE", assessment_basis: "DEPRECIATED_BOOK", expected_keg_version: "${k1_v}" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
              captures: { la1_id: "$.data.id" }
          trigger:
            - call: "POST /loss-assessments/${la1_id}/resolve"
              payload: { resolution: "UPHELD", resolution_notes: "Account confirms the keg was scrapped locally." }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-2"
            - call: "GET /brewers/${b1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /float-agreements/${fa1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /brewers/${b1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "the resolve response body ALREADY carries the whole outcome: assessment_status == UPHELD, resolved_by_user_id == analyst-2, chargeback_status == ISSUED and net_chargeback_cents == 14036 — nothing about it is pending"
            - "the first GET /brewers/${b1_id} shows chargeback_balance_cents == 14036, upheld_loss_count == 1, loss_rate_bp_trailing_90d == 10000, loss_rate_bp_lifetime == 10000, status == PROBATION and status_reason == LOSS_RATE_THRESHOLD (14036 < 25000, so the balance gate never armed)"
            - "the first GET /pools/${p1_id} shows kegs_total == 4, kegs_available == 3, kegs_circulating == 0, kegs_servicing == 0, kegs_held == 0, kegs_written_off == 1, available_pct == 75.00 and posture == OPEN"
            - "the census invariant holds on that very read: 4 == 3 + 0 + 0 + 0 + 1, so pool_census_conserved is satisfied at the end of the write, not after a later reconciliation"
            - "the ledger invariant holds on the same read: chargeback_balance_cents 14036 equals the sum of net_chargeback_cents over the brewer's assessments with chargeback_status IN {ISSUED, SETTLED}, which is the single row ${la1_id}"
            - "GET /kegs/${k1_id} shows custody_state == LOST, assessment_open == false and current_brewer_id still ${b1_id} (the chargeable party is retained on a written-off keg)"
            - "GET /float-agreements/${fa1_id} shows float_posture == SUSPENDED and pending_replenishment_kegs == 0, i.e. the fourth cascade link is visible on the first read too"
            - "the repeated GET /brewers/${b1_id} and GET /pools/${p1_id} return byte-identical bodies to the first pair, including every version field: no value converges, drifts or settles between reads"
            - "no request other than the resolve was needed to make any of this true: there is no sweep, no job and no clock advance between the write and the reads"

      - name: the_conserved_quantities_are_restored_by_the_compensating_write_itself
        claim_type: immediate
        excluded_because:
          difficulty_instance: pool_census_conserved_across_allocate_then_cancel
          rationale: "That §1.8 compensating-invariant instance already asserts the conserved census before the allocate, after the allocate and after the cancelling write, showing the quantity is restored by the compensating request itself with no intermediate inconsistent window; its sibling chargeback_ledger_conserved_across_uphold_then_reverse does the same for the money ledger. A second `immediate` instance on the same invariants would restate them."
