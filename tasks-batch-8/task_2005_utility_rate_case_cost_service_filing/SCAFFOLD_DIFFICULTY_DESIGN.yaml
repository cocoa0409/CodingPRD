            - { call: "POST /api/v1/rate-cases/${rc}/open-settlement-window", payload: {}, as: ALJ }
            - { call: "GET /api/v1/rate-cases/${rc}", payload: {}, as: UtilityFiler, captures: { rc_v: $.data.version } }
