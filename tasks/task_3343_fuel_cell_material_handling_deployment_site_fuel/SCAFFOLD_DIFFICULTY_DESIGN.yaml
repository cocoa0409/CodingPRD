              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.5, reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { contract_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${contract_id}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-X2", location_type: "OUTDOOR", capacity_kg_per_day: 200, storage_capacity_kg: 500, construction_start: "2026-10-01", construction_end: "2026-11-01" }
              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${st}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/start-construction"
              payload: {}
              as: SiteManager
          trigger:
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-X2", occurred_at: "2026-10-05T08:00:00Z", kg_dispensed: 10, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { err: $.data.error_id }
            - call: "POST /api/stations/${st}/commission"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-X2", occurred_at: "2026-10-05T08:00:00Z", kg_dispensed: 10, supply_contract_id: "${contract_id}" }
              as: SiteManager
              captures: { fe: $.data.id }
          assert:
            - "first fueling event rejected with ERR_STATION_NOT_COMMISSIONED (422) while station CONSTRUCTION"
            - "after commission the identical event is created (201) with station COMMISSIONED"
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_strict_overlap_touching_allowed
        grounds:
          - validations[priority=11]
          - entities.ConversionEvent.fields.scheduled_start
        distinguishing_aspect: |
          Datetime strict-overlap semantics on the Technician resource: touching
          intervals (existing 08:00-10:00, new 10:00-12:00, end == start) are
          ACCEPTED, while a one-minute overlap (09:59-11:00) is rejected with
          ERR_TECHNICIAN_DOUBLE_BOOKED; interval arithmetic is on ISO datetimes.
        test_recipe:
          setup:
            - "Site with APPROVED assessment and SCHEDULED plan; technician T with an existing event 2026-10-05T08:00-10:00 SCHEDULED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-OV1", name: "Overlap Site 1", address: "12 Shift Ave", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "Tech Overlap", certification_level: "MASTER", certified_until: "2027-01-01" }
              as: PlatformAdmin
              captures: { tech: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 5, duty_cycle_hours_per_day: 8.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/conversion-plans"
              payload: { name: "Wave OV", target_forklift_count: 3, transition_mode: "PARALLEL", start_date: "2026-10-01", end_date: "2026-10-31", baseline_productivity_units_per_hour: 50.0, expected_productivity_gain_pct: 10 }
              as: SiteManager
              captures: { plan: $.data.id, plan_v: $.data.version }
            - call: "POST /api/sites/${site_id}/conversion-plans/${plan}/schedule"
              payload: { expected_plan_version: "${plan_v}" }
              as: SiteManager
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-O1", scheduled_start: "2026-10-05T08:00:00Z", scheduled_end: "2026-10-05T10:00:00Z", technician_id: "${tech}" }
              as: SiteManager
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-O2", scheduled_start: "2026-10-05T10:00:00Z", scheduled_end: "2026-10-05T12:00:00Z", technician_id: "${tech}" }
              as: SiteManager
              captures: { ev2: $.data.id }
            - call: "POST /api/conversion-plans/${plan}/conversion-events"
              payload: { forklift_id: "FL-O3", scheduled_start: "2026-10-05T09:59:00Z", scheduled_end: "2026-10-05T11:00:00Z", technician_id: "${tech}" }
              as: SiteManager
              captures: { err: $.data.error_id }
          assert:
            - "touching event (10:00 start == existing 10:00 end) accepted (201)"
            - "overlapping event (09:59 start < 10:00 end) rejected with ERR_TECHNICIAN_DOUBLE_BOOKED (409)"
      - name: contract_half_open_same_mode_overlap
        grounds:
          - validations[priority=12]
          - entities.SupplyContract.fields.start_date
        distinguishing_aspect: |
          Different interval semantics and resource than the technician case:
          date-level half-open [start, end) overlap on the Site+supply_mode
          resource — a DELIVERED_LIQUID contract starting 2026-12-31 exactly
          when the existing one ends is ACCEPTED (back-to-back), while one
          starting 2026-12-30 overlaps by a day and is rejected; a PIPELINE
          contract over the same dates is unaffected (different mode).
        test_recipe:
          setup:
            - "Site with existing DELIVERED_LIQUID contract 2026-10-01..2026-12-31 (DRAFT or ACTIVE)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-OV2", name: "Overlap Site 2", address: "13 Contract Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "DELIVERED_LIQUID", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.0, reliability_sla_pct: 99.0, committed_monthly_kg: 50 }
              as: SiteManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "DELIVERED_LIQUID", start_date: "2026-12-31", end_date: "2027-03-31", base_price_per_kg: 2.1, reliability_sla_pct: 99.0, committed_monthly_kg: 50 }
              as: SiteManager
              captures: { c2: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "DELIVERED_LIQUID", start_date: "2026-12-30", end_date: "2027-03-31", base_price_per_kg: 2.1, reliability_sla_pct: 99.0, committed_monthly_kg: 50 }
              as: SiteManager
              captures: { err1: $.data.error_id }
            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-11-01", end_date: "2027-01-31", base_price_per_kg: 2.4, reliability_sla_pct: 99.5, committed_monthly_kg: 40 }
              as: SiteManager
              captures: { c3: $.data.id }
          assert:
            - "back-to-back DELIVERED_LIQUID contract (start 2026-12-31 == existing end) accepted (201)"
            - "overlapping DELIVERED_LIQUID contract (start 2026-12-30 < existing end) rejected with ERR_CONTRACT_PERIOD_OVERLAP (409)"
            - "same-period PIPELINE contract accepted (201): overlap rule is per (site, supply_mode)"
  - rule_id: compensating_invariant
    instances:
      - name: dispute_resolve_preserves_invoice_totals
        grounds:
          - state_machines.FuelInvoice.ISSUED_to_DISPUTED
          - state_machines.FuelInvoice.DISPUTED_to_ISSUED
        distinguishing_aspect: |
          Conserved quantity: invoice monetary totals. The dispute/resolve round
          trip must leave subtotal_cents, credit_cents, and total_cents bit-
          identical to their post-issue frozen values (17280/1000/16280) — any
          recompute drift on resolve violates the invariant.
        test_recipe:
          setup:
            - "Issued invoice with two 40 kg lines under a DELIVERED_LIQUID contract (base 2.00, committed 100): totals frozen at subtotal 17280, credit 1000, total 16280"
