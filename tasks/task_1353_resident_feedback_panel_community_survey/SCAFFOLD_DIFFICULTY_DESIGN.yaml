      - name: refresh_apply_attrition_forfeit_pool_credit_cascade
        grounds:
          - state_machines.RefreshRun.OPEN_to_APPLIED
          - state_machines.Panelist.LAPSED_to_ATTRITED
          - state_machines.IncentiveAward."payout AUTHORIZED_to_payout FORFEITED"
          - entities.SurveyWave.fields.incentive_pool_available_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by refresh-run apply (distinct trigger from wave
          close): apply attrits a grace-expired LAPSED panelist (hop 1), attrition
          forfeits the panelist's AUTHORIZED award (hop 2), and each forfeiture credits
          the wave pool (hop 3: available 98000 -> 100000, reserved 2000 -> 0).
