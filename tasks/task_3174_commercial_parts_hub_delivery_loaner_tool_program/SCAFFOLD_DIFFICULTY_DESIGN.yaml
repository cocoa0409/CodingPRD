      assert:
      - ToolCatalog.${t1}.wear_accumulated == 26.0 and ToolCatalog.${t1}.wear_band == LEVEL_2
      - ToolCatalog.${t1}.replacement_part_id is re-selected by replacement_selection level 2 to Part.${p_pad}.id — p_pad is FRONT and outranks p_bolt on depth
      - 'the self-transition fires: ToolLoan.${ln1}.replacement_part_id == Part.${p_pad}.id while ToolLoan.${ln1}.status is still CHECKED_OUT, so the pair was observed without leaving that state'
      - ToolLoan.${ln1}.status == CHECKED_OUT and ToolLoan.${ln1}.deposit_state == HELD — no re-checkout happened
      - a further adjust-wear of 59.0 then crosses to LEVEL_5 and a reset-wear returns wear_band to LEVEL_1 with wear_accumulated 0, completing the cycle
      - calling adjust-wear with wear_delta_units -100.0 floors wear_accumulated at 0 rather than going negative
- rule_id: transitive_cascade
  instances:
  - name: order_confirm_cascades_to_route_stop_resequencing
    grounds:
    - state_machines.PartOrder.field.status.transitions.CONFIRMED_to_VOID
    - state_machines.RouteStop.field.status.transitions.SEQUENCED_to_REJECTED
    - state_machines.ServiceRoute.field.status.transitions.DRAFT_to_PLANNED
    - calculations.stop_sequence_derivation
    distinguishing_aspect: 'A depth-3 chain that starts on the order-void trigger: releasing the

      reservation moves committed stock (B), the released capacity lets the

      previous owner confirm and take the slot (C), and sequencing the route

      re-projects the neighbouring stop (D) — each hop is caused by the hop

      before it, not by the original void.

      '
    test_recipe:
      setup:
      - Satellite s_sat with daily_capacity_units 6 and 5 x p_plug on hand; account A owns two draft orders O4 and O5
      - Account A also owns a draft route R1 with one stop carrying O4
