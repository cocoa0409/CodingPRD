    path: "/engagements"
    description: "Create an engagement"
    roles: [Principal]
    code: 201
    input: [name, client_name, fee_cap_cents, labor_rate_cents_per_hour]
    output: Engagement
    side_effects: ["status=SETUP", "risk_score=100", "posture=OPEN", "version=1"]
  - method: GET
    path: "/engagements"
    description: "List engagements"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Engagement[]"
    side_effects: []
  - method: GET
    path: "/engagements/{id}"
    description: "Get an engagement (includes computed posture, headroom, recognized/invoiced fees)"
    roles: [Principal, Consultant, Reviewer, FieldTechnician, ManufacturerRep]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: POST
    path: "/engagements/{id}/activate"
    description: "SETUP -> IN_PROGRESS"
    roles: [Principal]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status -> IN_PROGRESS", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{id}/begin-close-out"
    description: "IN_PROGRESS -> CLOSE_OUT; runs FINAL fee accrual variant"
    roles: [Principal]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status -> CLOSE_OUT", "engagement_fee_accrual FINAL recompute", "increments Engagement.version by 1"]
  - method: POST
    path: "/engagements/{id}/close"
    description: "CLOSE_OUT -> CLOSED"
    roles: [Principal]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status -> CLOSED", "increments Engagement.version by 1"]

  # --- Assembly ---
  - method: POST
    path: "/engagements/{id}/assemblies"
    description: "Create an assembly"
    roles: [Consultant]
    code: 201
    input: [tag, assembly_type, design_u_factor, required_airtightness_lps_m2]
