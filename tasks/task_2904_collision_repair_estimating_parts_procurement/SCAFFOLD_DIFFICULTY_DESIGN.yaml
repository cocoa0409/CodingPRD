              as: ShopAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /parts-vendors"
              payload: { name: "Metro OEM Parts", vendor_type: "OEM_DEALER", part_types_offered: ["OEM"], status: "ACTIVE", discount_pct: 0, max_qty_per_line: 4 }
              as: PartsManager
