              captures: { ea_status_final: "$.data[0].status" }
            - call: "GET /closing-protection-letters"
              payload: { agency_id: "${ag_id}" }
              as: ComplianceOfficer
              captures: { cpl_status_final: "$.data[0].status", cpl_decider_final: "$.data[0].decided_by_user_id" }
            - call: "GET /escrow-audits"
              payload: { follow_up_of_audit_id: "${au_id}" }
              as: ComplianceOfficer
              captures: { succ_type: "$.data[0].audit_type", succ_status: "$.data[0].status", succ_conductor: "$.data[0].conducted_by_user_id" }
          assert:
            - "${cpl_initial_status} == \"REQUESTED\" and ${f_v_severity} == \"CRITICAL\" and ${f_c1_severity} == \"CRITICAL\" and ${f_c2_severity} == \"CRITICAL\""
            - "hop 1: EscrowAudit.${au_id}.status == \"CLOSED_ADVERSE\", closed_by_user_id == \"officer-1\", and ${score_final} == 83 (25*3 CRITICAL findings + 8*1 adverse closure)"
            - "hop 2: ${standing_final} == \"DEFALCATION_RISK\" (83 >= DEFALCATION_RISK_THRESHOLD 60)"
            - "hop 3: ${posture_final} == \"FROZEN\""
            - "hop 4: ${ea_status_final} == \"RESTRICTED\" and ${cpl_status_final} == \"DECLINED\" and ${cpl_decider_final} == \"SYSTEM\""
            - "hop 5: GET /escrow-audits?follow_up_of_audit_id=${au_id} returns total_count == 1 with ${succ_type} == \"SURPRISE\", ${succ_status} == \"DRAFT\" and ${succ_conductor} == \"SYSTEM\""
            - "the auto-created successor audit does not recompute the score: ${score_final} is still 83 and ${standing_final} is still \"DEFALCATION_RISK\" after hop 5"

      - name: cascade_c_settlement_remits_policies_clears_ledger_and_relaxes_posture
        grounds:
          - state_machines.RemittanceStatement.RECONCILED_to_SETTLED
          - state_machines.PolicyFile.remittance_status.REPORTED_to_REMITTED
          - calculations.unremitted_premium_ledger
          - calculations.agency_oversight_posture
          - calculations.remittance_premium_split
        distinguishing_aspect: |
          A different trigger (POST /remittance-statements/{id}/state ->
          SETTLED) drives a four-hop chain on the fiscal side of the domain:
          settlement (hop 1) moves the three REPORTED policies to REMITTED
          (hop 2), which recomputes unremitted_premium_cents from 60000000 to 0
          (hop 3), which is what lifts oversight_posture from RESTRICTED to OPEN
          (hop 4). Hop 4 is caused only by hop 3 crossing the 50000000
          unremitted tolerance, not by anything the request said.
        test_recipe:
          setup:
            - "APPOINTED agency in CA with three ISSUED policy files of gross_premium_cents 20000000 each (closing 2026-07-05, 2026-07-12 and 2026-07-20), so unremitted_premium_cents is 60000000, above the 50000000 tolerance, and oversight_posture is RESTRICTED."
            - "One escrow account ESCROW-1 in status OPEN and no findings, so no other RESTRICTED condition holds."
            - "A statement for 2026-07-01..2026-07-31 carrying all three policies on lines, SUBMITTED at 2026-08-01 and RECONCILED with variance 0, unreported_policy_count 0 and late_fee_cents 0; underwriter_share_cents is 12000000 (3 x 4000000)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea1_id: "$.data.id" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v1: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-41", closing_date: "2026-07-05", liability_amount_cents: 40000000, gross_premium_cents: 20000000, complex_title_flag: false, expected_agency_version: "${ag_v1}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf1_id: "$.data.id" }
            - call: "POST /policy-files/${pf1_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-41" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v2: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-42", closing_date: "2026-07-12", liability_amount_cents: 40000000, gross_premium_cents: 20000000, complex_title_flag: false, expected_agency_version: "${ag_v2}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf2_id: "$.data.id" }
            - call: "POST /policy-files/${pf2_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-42" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v3: "$.data.version" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-43", closing_date: "2026-07-20", liability_amount_cents: 40000000, gross_premium_cents: 20000000, complex_title_flag: false, expected_agency_version: "${ag_v3}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf3_id: "$.data.id" }
            - call: "POST /policy-files/${pf3_id}/issuance-state"
