            - { call: "POST /score-sheets", payload: { registration_id: "${r1}", criteria_scores: [{ criterion: "EXTERIOR", points: 8 }, { criterion: "INTERIOR", points: 8 }, { criterion: "ENGINE", points: 7 }, { criterion: "AUTHENTICITY", points: 8 }, { criterion: "CONDITION", points: 7 }] }, as: Judge, as_user_id: "${j2}", captures: { s2: $.data.id, s2_total: $.data.sheet_total } }
            - { call: "POST /score-sheets", payload: { registration_id: "${r1}", criteria_scores: [{ criterion: "EXTERIOR", points: 8 }, { criterion: "INTERIOR", points: 7 }, { criterion: "ENGINE", points: 8 }, { criterion: "AUTHENTICITY", points: 8 }, { criterion: "CONDITION", points: 8 }] }, as: Judge, as_user_id: "${j3}", captures: { s3: $.data.id } }
            - { call: "POST /score-sheets/${s1}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /score-sheets/${s2}/submit", payload: {}, as: Judge, as_user_id: "${j2}" }
            - { call: "POST /score-sheets/${s3}/submit", payload: {}, as: Judge, as_user_id: "${j3}" }
