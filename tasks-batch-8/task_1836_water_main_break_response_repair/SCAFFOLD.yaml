# =============================================================================
# Task 1836 — Water Main Break Response & Repair (municipal water department)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1836. Water Main Break Response & Repair (municipal water department): break
  report & pressure/flow anomaly correlation, valve isolation & customer outage
  extent, crew dispatch & material sizing, boil-water advisory issuance &
  rescission testing, street restoration & pavement patch scheduling, traffic
  control & permit, cost accounting & claim for property damage, repeat-break
  pipe replacement candidate

domain_name: water-main-break-response
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat            # peer entities joined by FK references; URLs are flat
  state_machine_shape: branching   # BreakReport forks CONFIRMED vs FALSE_ALARM and loops REPAIRED→IN_REPAIR; PipeSegment cycles WATCH↔CANDIDATE
  relationship_patterns:
    - one_to_many        # BreakReport → advisories/claims/permits/isolation plans/work orders
    - cross_aggregate    # RestorationJob → TrafficPermit; WorkOrder → Crew
  role_model: segregation_of_duties  # advisory issuer cannot be its lifter; adjuster-only claim decisions
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PipeSegment
    parent: null
    common_fields: true
    fields:
      - { name: segment_ref, type: string, source: input, description: "Human-readable segment code, e.g. MAIN-12-OAK; unique" }
      - { name: material, type: enum, source: input, description: "CAST_IRON | DUCTILE_IRON | PVC | AC | STEEL" }
      - { name: diameter_inches, type: integer, source: input, description: "Nominal diameter; drives sizing tiers and crew class" }
      - { name: install_year, type: integer, source: input, description: "Year installed" }
      - { name: condition_status, type: enum, source: system, default: NONE, description: "NONE | WATCH | CANDIDATE | PROGRAMMED | REPLACED — repeat-break posture" }
      - { name: repeat_break_count_36mo, type: integer, source: computed, default: 0, description: "Official variant: breaks in REPAIRED/RESTORED/CLOSED confirmed within the trailing 36 months" }
      - { name: provisional_break_count_36mo, type: integer, source: computed, default: 0, description: "Provisional variant: breaks CONFIRMED or later (excl. FALSE_ALARM/REPORTED) within trailing 36 months, incl. in-progress" }
      - { name: replaced_at, type: datetime, source: system, description: "Set on mark-replaced; null otherwise", default: null }

  - name: Valve
    parent: null
    common_fields: true
    fields:
      - { name: valve_code, type: string, source: input, description: "Human-readable valve code; unique" }
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id; segment the valve serves" }
      - { name: coverage_zone, type: string, source: input, description: "Overlap zone label; closed valves sharing a zone cover overlapping customers (counted once, by zone max)" }
      - { name: customers_served, type: integer, source: input, description: "Customers downstream of this valve (> 0)" }
      - { name: valve_status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED" }

  - name: PressureAnomaly
    parent: null
    common_fields: true
    fields:
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id" }
      - { name: anomaly_type, type: enum, source: input, description: "PRESSURE_DROP | FLOW_SPIKE" }
      - { name: observed_at, type: datetime, source: input, description: "When SCADA observed the anomaly (logical clock domain)" }
      - { name: magnitude_pct, type: integer, source: input, description: "Deviation magnitude 1..100 percent" }
      - { name: correlated_break_report_id, type: string, source: system, default: null, description: "FK -> BreakReport.id; set by correlate action" }
      - { name: correlation_status, type: enum, source: system, default: UNCORRELATED, description: "UNCORRELATED | CORRELATED" }

  - name: BreakReport
    parent: null
    common_fields: true
    fields:
      - { name: location_description, type: string, source: input, description: "Free-text location of the reported break" }
      - { name: source, type: enum, source: input, description: "CUSTOMER_CALL | SENSOR_SCADA | CREW_OBSERVATION" }
      - { name: pipe_segment_id, type: string, source: system, default: null, description: "FK -> PipeSegment.id; assigned at confirm" }
      - { name: break_type, type: enum, source: system, default: null, description: "CIRCUMFERENTIAL | SPLIT | BLOWOUT; assigned at confirm" }
      - { name: severity, type: enum, source: system, default: null, description: "LOW | MEDIUM | HIGH; assigned at confirm" }
      - { name: break_status, type: enum, source: system, default: REPORTED, description: "REPORTED | CONFIRMED | ISOLATED | IN_REPAIR | REPAIRED | RESTORED | CLOSED | FALSE_ALARM" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock time of confirmation; claim filing window anchor" }
      - { name: repaired_at, type: datetime, source: system, default: null, description: "Logical-clock time repair completed; restoration deadline anchor" }
      - { name: customers_out_of_service, type: integer, source: computed, default: 0, description: "Outage extent set on isolation execute; returns to 0 when isolation restored" }
      - { name: total_repair_cost_cents, type: integer, source: computed, default: 0, description: "Sum of actual_cost_cents over all REPAIR_COMPLETE work orders of this break" }
      - { name: total_restoration_cost_cents, type: integer, source: computed, default: 0, description: "Sum of patch_cost_cents over COMPLETED restoration jobs of this break" }
      - { name: claims_liability_cents, type: integer, source: computed, default: 0, description: "Sum of approved_amount_cents over claims in APPROVED status (excludes PAID and VOIDED)" }
      - { name: total_claims_paid_cents, type: integer, source: computed, default: 0, description: "Sum of approved_amount_cents over claims in PAID status" }
      - { name: total_cost_cents, type: integer, source: computed, default: 0, description: "= total_repair_cost_cents + total_restoration_cost_cents + total_claims_paid_cents" }

  - name: IsolationEvent
    parent: null
    common_fields: true
    fields:
      - { name: break_report_id, type: string, source: input, description: "FK -> BreakReport.id" }
      - { name: valve_ids, type: array, source: input, description: "Valve ids to close; non-empty; all must serve the break's segment" }
      - { name: outage_extent_customers, type: integer, source: computed, default: null, description: "Zone-deduped customer count, computed at execute" }
      - { name: isolation_status, type: enum, source: system, default: PLANNED, description: "PLANNED | EXECUTED | RESTORED | SUPERSEDED" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical-clock time of execute" }
      - { name: restored_at, type: datetime, source: system, default: null, description: "Logical-clock time of auto-restore" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: crew_name, type: string, source: input, description: "Crew display name; unique" }
      - { name: crew_size, type: integer, source: input, description: "Headcount (> 0)" }
      - { name: equipment_class, type: enum, source: input, description: "LIGHT | HEAVY" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Per crew-hour rate (> 0)" }
      - { name: crew_status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | DISPATCHED" }
      - { name: completed_job_count, type: integer, source: computed, default: 0, description: "Work orders this crew completed; selector ranking key" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: break_report_id, type: string, source: input, description: "FK -> BreakReport.id" }
      - { name: est_pipe_length_ft, type: integer, source: input, description: "Estimated pipe length to replace (> 0); drives estimated cost" }
      - { name: crew_id, type: string, source: system, default: null, description: "FK -> Crew.id; assigned at dispatch (explicit or selector)" }
      - { name: work_status, type: enum, source: system, default: DRAFT, description: "DRAFT | DISPATCHED | ON_SITE | REPAIR_COMPLETE | CANCELLED" }
      - { name: required_equipment_class, type: enum, source: computed, description: "HEAVY iff segment diameter_inches > 12 OR break_type == BLOWOUT, else LIGHT" }
      - { name: required_clamp_kit, type: enum, source: computed, description: "CLAMP_A if diameter < 8, CLAMP_B if 8..16, CLAMP_C if > 16" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: null, description: "Forward-looking variant; computed at dispatch" }
      - { name: actual_cost_cents, type: integer, source: computed, default: null, description: "Chronological variant; computed at complete from logged labor and materials" }
      - { name: cost_variance_cents, type: integer, source: computed, default: null, description: "= actual_cost_cents - estimated_cost_cents at complete" }
      - { name: dispatch_window_start, type: datetime, source: system, default: null, description: "Logical-clock time of dispatch" }
      - { name: dispatch_window_end, type: datetime, source: system, default: null, description: "= dispatch_window_start + est_hours(break_type); crew overlap interval (closed, plus 60-minute buffer)" }

  - name: BoilWaterAdvisory
    parent: null
    common_fields: true
    fields:
      - { name: break_report_id, type: string, source: system, description: "FK -> BreakReport.id (input on manual issue; system on auto-issue)" }
      - { name: issue_reason, type: enum, source: system, description: "MANUAL | AUTO_OUTAGE_THRESHOLD" }
      - { name: advisory_status, type: enum, source: system, default: ISSUED, description: "ISSUED | LIFTED" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing officer, or the literal string \"system\" for auto-issue" }
      - { name: lifted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of lifting officer; must differ from issued_by_user_id" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time of issuance" }
      - { name: lifted_at, type: datetime, source: system, default: null, description: "Logical-clock time of rescission" }
      - { name: consecutive_pass_count, type: integer, source: computed, default: 0, description: "Consecutive PASS test_outcome count; reset to 0 by any FAIL" }
      - { name: last_sample_at, type: datetime, source: system, default: null, description: "sampled_at of most recent recorded test; 20-hour spacing anchor" }

  - name: WaterQualityTest
    parent: null
    common_fields: true
    fields:
      - { name: advisory_id, type: string, source: input, description: "FK -> BoilWaterAdvisory.id" }
      - { name: sampled_at, type: datetime, source: input, description: "Logical-clock-domain sample time" }
      - { name: chlorine_residual_mg_l, type: number, source: input, description: "Chlorine residual; PASS requires >= 0.20" }
      - { name: coliform_result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: test_outcome, type: enum, source: computed, description: "PASS iff coliform_result == PASS AND chlorine_residual_mg_l >= 0.20, else FAIL" }

  - name: RestorationJob
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; auto-created PENDING on repair completion" }
      - { name: restoration_status, type: enum, source: system, default: PENDING, description: "PENDING | SCHEDULED | OVERDUE | COMPLETED" }
      - { name: scheduled_start, type: datetime, source: input, default: null, description: "Patch window start (set at schedule)" }
      - { name: scheduled_end, type: datetime, source: input, default: null, description: "Patch window end; must be > scheduled_start" }
      - { name: traffic_permit_id, type: string, source: input, default: null, description: "FK -> TrafficPermit.id; set at schedule" }
      - { name: patch_cost_cents, type: integer, source: input, default: null, description: "Actual restoration cost recorded at complete (>= 0)" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock time of completion" }

  - name: TrafficPermit
    parent: null
    common_fields: true
    fields:
      - { name: break_report_id, type: string, source: input, description: "FK -> BreakReport.id" }
      - { name: street_block, type: string, source: input, description: "Block identifier for overlap grouping, e.g. OAK-100-BLK" }
      - { name: valid_from, type: datetime, source: input, description: "Validity start; half-open interval [valid_from, valid_to)" }
      - { name: valid_to, type: datetime, source: input, description: "Validity end (exclusive); must be > valid_from" }
      - { name: control_plan, type: enum, source: input, description: "LANE_CLOSURE | FULL_CLOSURE | FLAGGING" }
      - { name: permit_status, type: enum, source: system, default: APPLIED, description: "APPLIED | APPROVED | EXPIRED" }

  - name: DamageClaim
    parent: null
    common_fields: true
    fields:
      - { name: break_report_id, type: string, source: input, description: "FK -> BreakReport.id" }
      - { name: claimant_name, type: string, source: input, description: "Property owner / claimant" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed (> 0)" }
      - { name: claim_status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DENIED | PAID | VOIDED" }
      - { name: approved_amount_cents, type: integer, source: input, default: null, description: "Set at approve; must satisfy 0 < approved <= claimed" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BreakReport
    field: break_status
    initial_state: REPORTED
    terminal_states: [CLOSED, FALSE_ALARM]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /break-reports/{id}/confirm"
        actor: Dispatcher
        preconditions:
          - "Referenced pipe_segment_id exists"
          - "PipeSegment.condition_status != REPLACED (ERR_SEGMENT_REPLACED)"
        side_effects:
          - "break_status → CONFIRMED; confirmed_at = logical clock now"
          - "pipe_segment_id, break_type, severity recorded"
          - "Recompute PipeSegment provisional/official 36-month counts (provisional now includes this break)"
      - from: REPORTED
        to: FALSE_ALARM
        trigger: "POST /break-reports/{id}/false-alarm"
        actor: Dispatcher
        preconditions: []
        side_effects: ["Report excluded from all counts and downstream work"]
      - from: CONFIRMED
        to: ISOLATED
        trigger: "system (when an IsolationEvent for this break is executed)"
        actor: system
        preconditions: []
        side_effects:
          - "customers_out_of_service = isolation outage_extent_customers"
          - "If outage_extent_customers >= 500: auto-create BoilWaterAdvisory (ISSUED, AUTO_OUTAGE_THRESHOLD, issued_by_user_id=\"system\")"
      - from: ISOLATED
        to: IN_REPAIR
        trigger: "system (when a WorkOrder for this break arrives ON_SITE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REPAIR
        to: REPAIRED
        trigger: "system (when a WorkOrder for this break reaches REPAIR_COMPLETE)"
        actor: system
        preconditions: []
        side_effects:
          - "repaired_at = logical clock now"
          - "EXECUTED IsolationEvent for this break → RESTORED; its valves → OPEN; customers_out_of_service → 0"
          - "Auto-create RestorationJob (PENDING) for the completed work order"
      - from: REPAIRED
        to: ISOLATED
        trigger: "system (a new IsolationEvent for this break is executed — rework re-isolation)"
        actor: system
        preconditions: []
        side_effects:
          - "customers_out_of_service = new isolation outage_extent_customers"
          - "If outage_extent_customers >= 500 and no ISSUED advisory exists: auto-create BoilWaterAdvisory (AUTO_OUTAGE_THRESHOLD)"
        note: "Cyclic rework: REPAIRED -> ISOLATED -> IN_REPAIR -> REPAIRED again"
      - from: REPAIRED
        to: RESTORED
        trigger: "system (when every RestorationJob of this break is COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTORED
        to: CLOSED
        trigger: "POST /break-reports/{id}/close"
        actor: PublicWorksEngineer
        preconditions:
          - "No BoilWaterAdvisory for this break in ISSUED status (ERR_ADVISORY_STILL_ACTIVE)"
          - "No DamageClaim for this break in SUBMITTED or APPROVED status (ERR_CLAIMS_OPEN)"
        side_effects: []

  - entity: IsolationEvent
    field: isolation_status
    initial_state: PLANNED
    terminal_states: [RESTORED, SUPERSEDED]
    transitions:
      - from: PLANNED
        to: EXECUTED
        trigger: "POST /isolation-events/{id}/execute"
        actor: Dispatcher
        preconditions:
          - "Parent break is CONFIRMED or REPAIRED (ERR_INVALID_STATE otherwise; REPAIRED covers rework re-isolation)"
          - "Every valve in valve_ids exists, serves the break's pipe_segment_id (ERR_CROSS_REFERENCE_MISMATCH), and is OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "All listed valves → CLOSED"
          - "outage_extent_customers computed (zone-dedup); copied to break.customers_out_of_service"
          - "Break CONFIRMED/REPAIRED → ISOLATED (cascade link 2); auto-advisory cascade if extent >= 500 (link 3)"
      - from: PLANNED
        to: SUPERSEDED
        trigger: "system (when a new IsolationEvent is created for the same break)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXECUTED
        to: RESTORED
        trigger: "system (when the break reaches REPAIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "All listed valves → OPEN; restored_at set"
          - "Break customers_out_of_service → 0"

  - entity: Valve
    field: valve_status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (containing IsolationEvent executed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: OPEN
        trigger: "system (containing IsolationEvent restored)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Crew
    field: crew_status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: DISPATCHED
        trigger: "system (crew assigned at work-order dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: AVAILABLE
        trigger: "system (assigned work order completed or cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkOrder
    field: work_status
    initial_state: DRAFT
    terminal_states: [REPAIR_COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Parent break in ISOLATED (ERR_BREAK_NOT_ISOLATED)"
          - "Crew (explicit crew_id or selector) is AVAILABLE with sufficient equipment_class and no overlapping dispatch window (ERR_CREW_DOUBLE_BOOKED / ERR_NO_CREW_AVAILABLE)"
        side_effects:
          - "crew_id assigned; crew → DISPATCHED"
          - "dispatch_window_start = clock now; dispatch_window_end = start + est_hours(break_type)"
          - "estimated_cost_cents computed (forward-looking variant)"
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /work-orders/{id}/arrive"
        actor: CrewLead
        preconditions:
          - "Acting CrewLead's X-User-ID must equal work order crew_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "Break ISOLATED → IN_REPAIR (rework re-enters via REPAIRED → ISOLATED re-isolation first)"
      - from: ON_SITE
        to: REPAIR_COMPLETE
        trigger: "POST /work-orders/{id}/complete"
        actor: CrewLead
        preconditions:
          - "Acting CrewLead's X-User-ID must equal work order crew_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "actual_cost_cents computed (chronological variant); cost_variance_cents = actual - estimated"
          - "crew → AVAILABLE; crew.completed_job_count += 1"
          - "break.total_repair_cost_cents += actual_cost_cents"
          - "Cascade link 1: break IN_REPAIR → REPAIRED → link 2: isolation RESTORED (valves OPEN, customers_out_of_service 0) → link 3: advisory sampling window opens; RestorationJob PENDING auto-created"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects: ["Assigned crew → AVAILABLE; dispatch window cleared"]

  - entity: BoilWaterAdvisory
    field: advisory_status
    initial_state: ISSUED
    terminal_states: [LIFTED]
    transitions:
      - from: ISSUED
        to: LIFTED
        trigger: "POST /boil-water-advisories/{id}/lift"
        actor: WaterQualityOfficer
        preconditions:
          - "consecutive_pass_count >= 2 (ERR_ADVISORY_TESTS_INSUFFICIENT)"
          - "Acting officer X-User-ID != issued_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "lifted_at = clock now; lifted_by_user_id recorded"

  - entity: WaterQualityTest
    field: test_outcome
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only record; test_outcome computed at creation (PASS iff coliform PASS and chlorine >= 0.20). Recording a test mutates its advisory: PASS increments consecutive_pass_count, FAIL resets it to 0; last_sample_at updated."

  - entity: RestorationJob
    field: restoration_status
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /restoration-jobs/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "traffic_permit_id references a permit of the SAME break (ERR_CROSS_REFERENCE_MISMATCH)"
          - "Permit is APPROVED (ERR_PERMIT_NOT_APPROVED)"
          - "Permit [valid_from, valid_to) fully covers [scheduled_start, scheduled_end) (ERR_PERMIT_WINDOW_MISMATCH)"
          - "scheduled_start < scheduled_end (ERR_VALIDATION)"
        side_effects: ["scheduled window + permit recorded"]
      - from: OVERDUE
        to: SCHEDULED
        trigger: "POST /restoration-jobs/{id}/schedule"
        actor: Dispatcher
        preconditions: ["same as PENDING → SCHEDULED"]
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /restoration-jobs/{id}/complete"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "completed_at set; patch_cost_cents recorded"
          - "break.total_restoration_cost_cents += patch_cost_cents"
          - "If all RestorationJobs of the break COMPLETED: break REPAIRED → RESTORED"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /restoration-jobs/{id}/complete"
        actor: Dispatcher
        preconditions: []
        side_effects: ["same as SCHEDULED → COMPLETED"]
      - from: PENDING
        to: OVERDUE
        trigger: "system (ops run: logical clock now > parent break repaired_at + 14 days and job not COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (ops run: same deadline rule)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrafficPermit
    field: permit_status
    initial_state: APPLIED
    terminal_states: [EXPIRED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /traffic-permits/{id}/approve"
        actor: PublicWorksEngineer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (ops run: logical clock now >= valid_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: EXPIRED
        trigger: "system (ops run: logical clock now >= valid_to)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DamageClaim
    field: claim_status
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /damage-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "0 < approved_amount_cents <= claimed_amount_cents (ERR_INVALID_AMOUNT / ERR_AMOUNT_EXCEEDS_CLAIMED)"
        side_effects: ["break.claims_liability_cents += approved_amount_cents"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /damage-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /damage-claims/{id}/pay"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "break.claims_liability_cents -= approved_amount_cents"
          - "break.total_claims_paid_cents += approved_amount_cents"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /damage-claims/{id}/void"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["break.claims_liability_cents -= approved_amount_cents (compensation)"]

  - entity: PipeSegment
    field: condition_status
    initial_state: NONE
    terminal_states: [REPLACED]
    transitions:
      - from: NONE
        to: WATCH
        trigger: "system (ops run: official repeat_break_count_36mo == 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WATCH
        to: CANDIDATE
        trigger: "system (ops run: official repeat_break_count_36mo >= 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: NONE
        to: CANDIDATE
        trigger: "system (ops run: official repeat_break_count_36mo >= 3)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CANDIDATE
        to: WATCH
        trigger: "system (ops run: breaks aged out of the 36-month window so official count == 2)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Cyclic regression — replacement candidacy is re-derived every ops run"
      - from: WATCH
        to: NONE
        trigger: "system (ops run: official count <= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CANDIDATE
        to: NONE
        trigger: "system (ops run: official count <= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CANDIDATE
        to: PROGRAMMED
        trigger: "POST /pipe-segments/{id}/program-replacement"
        actor: PublicWorksEngineer
        preconditions: []
        side_effects: []
      - from: PROGRAMMED
        to: REPLACED
        trigger: "POST /pipe-replaced marker — POST /pipe-segments/{id}/mark-replaced"
        actor: PublicWorksEngineer
        preconditions: []
        side_effects:
          - "replaced_at = clock now"
          - "repeat/provisional counts frozen at their last computed values"
          - "New break confirmations against this segment are rejected (ERR_SEGMENT_REPLACED)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: isolation-plan-stale-break
    parent_entity: BreakReport
    write_endpoint: "POST /isolation-events"
    occ_field: "expected_break_report_version"
    description: |
      Creating an IsolationEvent supersedes any prior PLANNED plan for the same
      break and legitimately advances BreakReport.version, so a second creation
      that still carries the pre-supersede version is rejected as stale. The
      check is pure OCC: expected_break_report_version must equal the break's
      current version; on mismatch the server answers 412 ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: outage_extent_customers
    trigger: "IsolationEvent execute"
    algorithm: aggregation
    formula: |
      Group the executed plan's closed valves by coverage_zone.
      outage_extent_customers = sum over distinct zones of max(customers_served within that zone among the closed valves).
      Rationale: valves in one zone cover overlapping customer sets; the largest valve's customers include the others'.
    input_set: "Valves listed in the executed IsolationEvent.valve_ids (all must be OPEN at execute time)"
    precision: "integer customers"
    constants: {}

  - name: advisory_auto_issue
    trigger: "IsolationEvent execute, after outage_extent_customers is computed"
    algorithm: threshold
    formula: |
      if outage_extent_customers >= ADVISORY_OUTAGE_THRESHOLD
         and no ISSUED BoilWaterAdvisory exists for the break:
        auto-create BoilWaterAdvisory(issue_reason=AUTO_OUTAGE_THRESHOLD,
                                      advisory_status=ISSUED,
                                      issued_by_user_id="system",
                                      issued_at=clock now)
    constants:
      ADVISORY_OUTAGE_THRESHOLD: 500
    note: "Boundary is inclusive: exactly 500 issues an advisory; 499 does not."

  - name: material_sizing
    trigger: "WorkOrder creation"
    algorithm: constraint_propagation
    formula: |
      d = break.pipe_segment.diameter_inches; t = break.break_type
      required_equipment_class = HEAVY if (d > 12 or t == BLOWOUT) else LIGHT
      required_clamp_kit = CLAMP_A if d < 8 else (CLAMP_B if d <= 16 else CLAMP_C)
    input_set: "WorkOrder's break (CONFIRMED or later) and its PipeSegment"

  - name: estimated_cost_cents
    trigger: "WorkOrder dispatch"
    algorithm: forward_looking
    formula: |
      rate_per_ft = 12000 if d < 8 else (18000 if d <= 16 else 25000)
      multiplier  = 1.0 if CIRCUMFERENTIAL else (1.25 if SPLIT else 1.6)
      kit_fee     = 40000 if CIRCUMFERENTIAL else (85000 if SPLIT else 150000)
      est_hours   = 4 if CIRCUMFERENTIAL else (6 if SPLIT else 10)
      estimated_cost_cents =
          round_half_up(est_pipe_length_ft * rate_per_ft * multiplier)
        + kit_fee
        + crew.hourly_rate_cents * est_hours
    input_set: "The dispatched work order, its break (type), its segment (diameter), its assigned crew (rate)"
    precision: "integer cents; single round_half_up after the length*rate*multiplier product"
    variants:
      - name: actual_cost_cents
        when: "WorkOrder completion (chronological actuals instead of forward-looking estimate)"
        difference: "Computed from logged labor_hours and materials_used line items; see actual_cost_cents rule. Same work order, different value."

  - name: actual_cost_cents
    trigger: "WorkOrder complete"
    algorithm: chronological
    formula: |
      labor_cents = round_half_up(labor_hours * crew.hourly_rate_cents)
      PINNED ROUNDING ORDER: each materials line is rounded individually BEFORE summing:
        line_cents_i = round_half_up(quantity_i * unit_price_cents_i * MATERIAL_WASTE_FACTOR)
      actual_cost_cents = labor_cents + sum(line_cents_i)
      (Sum-then-round is the alternative interpretation and yields different cents; the per-line order above is the pinned one.)
    input_set: "Completing work order's labor_hours and materials_used lines; assigned crew rate"
    precision: "integer cents, round_half_up applied per line item"
    constants:
      MATERIAL_WASTE_FACTOR: 1.10

  - name: repeat_break_counts
    trigger: "ops run (recompute against logical clock)"
    algorithm: aggregation
    formula: |
      Window: breaks whose confirmed_at is within [clock_now - 36 months, clock_now], inclusive of the start boundary.
      official    = count of this segment's BreakReports in {REPAIRED, RESTORED, CLOSED}
      provisional = count of this segment's BreakReports in {CONFIRMED, ISOLATED, IN_REPAIR, REPAIRED, RESTORED, CLOSED}
      (REPORTED and FALSE_ALARM are excluded from both.)
    input_set: "BreakReports with pipe_segment_id == this segment"
    variants:
      - name: provisional
        when: "Early-warning view"
        difference: "Includes in-progress breaks (CONFIRMED/ISOLATED/IN_REPAIR), so it is >= official whenever a confirmed-but-unfinished break exists."
    constants:
      REPEAT_BREAK_WINDOW_MONTHS: 36

  - name: condition_status_derivation
    trigger: "ops run, after repeat_break_counts"
    algorithm: threshold
    formula: |
      official = repeat_break_count_36mo
      if official >= 3 -> CANDIDATE
      elif official == 2 -> WATCH
      else -> NONE
      (PROGRAMMED/REPLACED segments are not auto-regressed; manual transitions only.)
    constants:
      WATCH_THRESHOLD: 2
      CANDIDATE_THRESHOLD: 3

  - name: test_outcome
    trigger: "WaterQualityTest creation"
    algorithm: threshold
    formula: |
      test_outcome = PASS iff coliform_result == PASS and chlorine_residual_mg_l >= MIN_CHLORINE_MG_L else FAIL
      Boundary is inclusive: chlorine exactly 0.20 passes.
    constants:
      MIN_CHLORINE_MG_L: 0.20

  - name: consecutive_pass_count
    trigger: "WaterQualityTest creation (after test_outcome computed)"
    algorithm: aggregation
    formula: |
      if test_outcome == PASS: advisory.consecutive_pass_count += 1
      else: advisory.consecutive_pass_count = 0
      advisory.last_sample_at = sampled_at
    note: "Lift requires consecutive_pass_count >= 2 at the moment of lifting."

  - name: sample_spacing
    trigger: "WaterQualityTest creation, before recording"
    algorithm: threshold
    formula: |
      if advisory.last_sample_at is not null
         and sampled_at < advisory.last_sample_at + 20 hours:
        reject with ERR_TEST_SAMPLE_TOO_SOON
      sampled_at must also be >= advisory.issued_at (ERR_VALIDATION otherwise)
    constants:
      MIN_SAMPLE_SPACING_HOURS: 20

  - name: claim_filing_window
    trigger: "DamageClaim creation"
    algorithm: threshold
    formula: |
      Break must be CONFIRMED or later (not REPORTED / FALSE_ALARM).
      if clock_now > break.confirmed_at + 90 days: reject with ERR_CLAIM_FILED_LATE
      Boundary is inclusive: filing exactly at confirmed_at + 90 days is accepted.
    constants:
      CLAIM_FILING_WINDOW_DAYS: 90

  - name: permit_overlap
    trigger: "TrafficPermit creation"
    algorithm: interval_merge
    formula: |
      For the same street_block, reject if any existing permit in {APPLIED, APPROVED}
      has half-open overlap: existing.valid_from < new.valid_to AND new.valid_from < existing.valid_to
      Adjacent windows (new.valid_from == existing.valid_to) do NOT overlap (half-open semantics).
    input_set: "TrafficPermits with matching street_block in APPLIED or APPROVED"

  - name: crew_window_overlap
    trigger: "WorkOrder dispatch"
    algorithm: interval_merge
    formula: |
      A crew is unavailable for a new dispatch at clock time T if it has another work order in
      {DISPATCHED, ON_SITE} whose occupied interval [window_start, window_end + 60 min] contains T,
      i.e. reject when window_start <= T < window_end + 60 minutes (closed start, buffered end).
      At T exactly == window_end + 60 minutes the crew IS available (boundary inclusive of availability).
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    note: "Different interval semantics from permit_overlap: closed start + trailing buffer vs half-open adjacency."

  - name: crew_selector
    trigger: "WorkOrder dispatch when crew_id is omitted"
    algorithm: constraint_propagation
    formula: |
      Eligibility: crew_status == AVAILABLE
                   AND (required_equipment_class == LIGHT ? any class : equipment_class == HEAVY)
                   AND no overlapping occupied interval (crew_window_overlap)
      Ranking: completed_job_count ASC, then created_at ASC (earliest-created crew wins ties)
      Empty pool: reject with ERR_NO_CREW_AVAILABLE
    note: "id is never used for ranking or tie-break."

  - name: correlation_eligibility
    trigger: "POST /break-reports/{id}/correlate"
    algorithm: threshold
    formula: |
      Anomaly must be UNCORRELATED (ERR_INVALID_STATE otherwise).
      Anomaly.pipe_segment_id must equal break.pipe_segment_id (ERR_CROSS_REFERENCE_MISMATCH).
      |anomaly.observed_at - break.created_at| <= 6 hours (ERR_CORRELATION_WINDOW).
    constants:
      CORRELATION_WINDOW_HOURS: 6

  - name: break_cost_rollup
    trigger: "work order complete / restoration complete / claim pay or void"
    algorithm: aggregation
    formula: |
      total_repair_cost_cents      = sum(actual_cost_cents over REPAIR_COMPLETE work orders of the break)
      total_restoration_cost_cents = sum(patch_cost_cents over COMPLETED restoration jobs of the break)
      claims_liability_cents       = sum(approved_amount_cents over APPROVED claims)
      total_claims_paid_cents      = sum(approved_amount_cents over PAID claims)
      total_cost_cents             = total_repair_cost_cents + total_restoration_cost_cents + total_claims_paid_cents
    note: "Invariant: approve followed by void leaves claims_liability_cents, total_claims_paid_cents and total_cost_cents unchanged (compensating pair)."

  - name: ops_run_checkpoint
    trigger: "POST /ops-runs"
    algorithm: threshold
    formula: |
      At logical clock now:
      1. Permits in {APPLIED, APPROVED} with valid_to <= now -> EXPIRED
      2. RestorationJobs in {PENDING, SCHEDULED} whose break repaired_at + 14 days < now -> OVERDUE
      3. Recompute every non-REPLACED segment's repeat_break_counts and condition_status
    constants:
      RESTORATION_DEADLINE_DAYS: 14

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be in the endpoint's roles list; for CrewLead ownership actions (arrive/complete) X-User-ID must equal the work order's crew_id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids must exist (left-to-right in path)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC: expected_break_report_version must equal the break's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /isolation-events"

  - priority: 5
    category: state
    check: "Entity must be in a valid source state for the requested transition (incl. anomaly UNCORRELATED, valves OPEN, permit APPROVED as ERR_PERMIT_NOT_APPROVED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    note: "Permit-not-approved at restoration schedule surfaces as domain error ERR_PERMIT_NOT_APPROVED at this tier."

  - priority: 6
    category: business_safety
    check: "Water-quality compliance: advisory lift requires consecutive_pass_count >= 2; lifter must differ from issuer; samples >= 20h apart and not before issuance"
    error_id: "ERR_ADVISORY_TESTS_INSUFFICIENT / ERR_SEGREGATION_OF_DUTIES / ERR_TEST_SAMPLE_TOO_SOON"
    http_status: 409
    applies_to: "advisory lift, water-quality test creation"

  - priority: 7
    category: business_referential
    check: "Cross-references must belong to the same aggregate: anomaly segment == break segment; isolation valves serve break's segment; restoration permit belongs to same break; segment not REPLACED on confirm"
    error_id: "ERR_CROSS_REFERENCE_MISMATCH / ERR_SEGMENT_REPLACED"
    http_status: 409
    applies_to: "correlate, isolation create/execute, restoration schedule, break confirm"

  - priority: 8
    category: business_temporal
    check: "Time-window rules: claim filed within 90 days of confirmation; permit window covers schedule window; permit half-open overlap on street_block; crew dispatch window+buffer overlap; correlation within ±6h"
    error_id: "ERR_CLAIM_FILED_LATE / ERR_PERMIT_WINDOW_MISMATCH / ERR_PERMIT_OVERLAP / ERR_CREW_DOUBLE_BOOKED / ERR_CORRELATION_WINDOW"
    http_status: 409
    applies_to: "claim create, restoration schedule, permit create, work-order dispatch, correlate"

  - priority: 9
    category: business_constraint
    check: "Structural constraints: break ISOLATED before dispatch; no second active work order per break; no second ISSUED advisory per break; close guards (no ISSUED advisory, no open claims); crew selector pool non-empty"
    error_id: "ERR_BREAK_NOT_ISOLATED / ERR_DUPLICATE_ACTIVE_WORK_ORDER / ERR_ADVISORY_ALREADY_OPEN / ERR_ADVISORY_STILL_ACTIVE / ERR_CLAIMS_OPEN / ERR_NO_CREW_AVAILABLE"
    http_status: 409
    applies_to: "dispatch, work-order create, advisory create, break close"

  - priority: 10
    category: business_fiscal
    check: "Money rules: claimed/approved/patch amounts positive; approved <= claimed"
    error_id: "ERR_INVALID_AMOUNT / ERR_AMOUNT_EXCEEDS_CLAIMED"
    http_status: 400
    applies_to: "claim create/approve, restoration complete"
    note: "ERR_AMOUNT_EXCEEDS_CLAIMED is returned with http 409; ERR_VALIDATION (malformed fields, bad enums, start >= end) is 400 and checked within priority 3 alongside existence."

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- PipeSegment ---
  - method: POST
    path: "/pipe-segments"
    description: "Register a pipe segment"
    roles: [PublicWorksEngineer]
    code: 201
    input: [segment_ref, material, diameter_inches, install_year]
    output: PipeSegment
    side_effects: ["condition_status=NONE; counts 0; version 1"]

  - method: GET
    path: "/pipe-segments/{id}"
    description: "Get a pipe segment (condition posture + repeat-break counts)"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: []
    output: PipeSegment
    side_effects: []

  - method: GET
    path: "/pipe-segments/{id}/valves"
    description: "List valves serving a segment"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "Valve[]"
    side_effects: []

  - method: GET
    path: "/pipe-segments/{id}/pressure-anomalies"
    description: "List pressure/flow anomalies observed on a segment"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "PressureAnomaly[]"
    side_effects: []

  - method: GET
    path: "/pipe-segments/{id}/break-reports"
    description: "List break reports confirmed against a segment"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "BreakReport[]"
    side_effects: []

  - method: POST
    path: "/pipe-segments/{id}/program-replacement"
    description: "Program a CANDIDATE segment for replacement"
    roles: [PublicWorksEngineer]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["condition_status CANDIDATE → PROGRAMMED"]

  - method: POST
    path: "/pipe-segments/{id}/mark-replaced"
    description: "Mark a PROGRAMMED segment replaced (terminal); freezes counts"
    roles: [PublicWorksEngineer]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["condition_status PROGRAMMED → REPLACED; replaced_at = clock now"]

  # --- Valve ---
  - method: POST
    path: "/valves"
    description: "Register a valve on a segment"
    roles: [PublicWorksEngineer]
    code: 201
    input: [valve_code, pipe_segment_id, coverage_zone, customers_served]
    output: Valve
    side_effects: ["valve_status=OPEN"]

  # --- PressureAnomaly ---
  - method: POST
    path: "/pressure-anomalies"
    description: "Post a SCADA pressure/flow anomaly observation"
    roles: [System]
    code: 201
    input: [pipe_segment_id, anomaly_type, observed_at, magnitude_pct]
    output: PressureAnomaly
    side_effects: ["correlation_status=UNCORRELATED"]

  # --- BreakReport ---
  - method: POST
    path: "/break-reports"
    description: "File a break report (intake)"
    roles: [Dispatcher]
    code: 201
    input: [location_description, source]
    output: BreakReport
    side_effects: ["break_status=REPORTED"]

  - method: GET
    path: "/break-reports/{id}"
    description: "Get a break report including computed cost rollup fields"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: []
    output: BreakReport
    side_effects: []

  - method: POST
    path: "/break-reports/{id}/confirm"
    description: "Triage-confirm a report against a pipe segment"
    roles: [Dispatcher]
    code: 200
    input: [pipe_segment_id, break_type, severity]
    output: BreakReport
    side_effects:
      - "REPORTED → CONFIRMED; confirmed_at = clock now; segment provisional count includes this break; increments BreakReport.version by 1"
      - "ERR_SEGMENT_REPLACED if segment REPLACED"

  - method: POST
    path: "/break-reports/{id}/false-alarm"
    description: "Mark a report as false alarm (terminal)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: BreakReport
    side_effects: ["REPORTED → FALSE_ALARM"]

  - method: POST
    path: "/break-reports/{id}/correlate"
    description: "Correlate a pressure/flow anomaly with this break"
    roles: [Dispatcher]
    code: 200
    input: [pressure_anomaly_id]
    output: PressureAnomaly
    side_effects:
      - "anomaly.correlated_break_report_id = break id; correlation_status → CORRELATED"
      - "Requires break CONFIRMED; same segment (ERR_CROSS_REFERENCE_MISMATCH); |observed_at - break.created_at| <= 6h (ERR_CORRELATION_WINDOW); anomaly UNCORRELATED (ERR_INVALID_STATE)"

  - method: POST
    path: "/break-reports/{id}/close"
    description: "Close a fully restored break (terminal)"
    roles: [PublicWorksEngineer]
    code: 200
    input: []
    output: BreakReport
    side_effects: ["RESTORED → CLOSED; guards: no ISSUED advisory (ERR_ADVISORY_STILL_ACTIVE), no SUBMITTED/APPROVED claims (ERR_CLAIMS_OPEN)"]

  - method: GET
    path: "/break-reports/{id}/isolation-events"
    description: "List isolation plans for a break"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "IsolationEvent[]"
    side_effects: []

  - method: GET
    path: "/break-reports/{id}/pressure-anomalies"
    description: "List anomalies correlated to a break"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "PressureAnomaly[]"
    side_effects: []

  - method: GET
    path: "/break-reports/{id}/work-orders"
    description: "List work orders for a break"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/break-reports/{id}/advisories"
    description: "List boil-water advisories for a break"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoilWaterAdvisory[]"
    side_effects: []

  - method: GET
    path: "/break-reports/{id}/traffic-permits"
    description: "List traffic permits for a break"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrafficPermit[]"
    side_effects: []

  - method: GET
    path: "/break-reports/{id}/damage-claims"
    description: "List damage claims for a break"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "DamageClaim[]"
    side_effects: []

  # --- IsolationEvent ---
  - method: POST
    path: "/isolation-events"
    description: "Plan a valve isolation for a CONFIRMED break; supersedes any prior PLANNED plan; OCC-guarded on the break"
    roles: [Dispatcher]
    code: 201
    input: [break_report_id, valve_ids, expected_break_report_version]
    output: IsolationEvent
    side_effects:
      - "isolation_status=PLANNED"
      - "requires break_status in {CONFIRMED, REPAIRED} (ERR_INVALID_STATE otherwise)"
      - "prior PLANNED plan for same break → SUPERSEDED"
      - "increments BreakReport.version by 1"
      - "ERR_STALE_VERSION (412) when expected_break_report_version != break.version"

  - method: POST
    path: "/isolation-events/{id}/execute"
    description: "Execute a PLANNED isolation: close valves, compute outage extent, cascade"
    roles: [Dispatcher]
    code: 200
    input: []
    output: IsolationEvent
    side_effects:
      - "valves → CLOSED; outage_extent_customers computed (zone-dedup)"
      - "break → ISOLATED; customers_out_of_service = outage_extent_customers"
      - "if extent >= 500: auto-create ISSUED advisory (AUTO_OUTAGE_THRESHOLD)"

  # --- Crew ---
  - method: POST
    path: "/crews"
    description: "Register a repair crew"
    roles: [Dispatcher]
    code: 201
    input: [crew_name, crew_size, equipment_class, hourly_rate_cents]
    output: Crew
    side_effects: ["crew_status=AVAILABLE; completed_job_count=0"]

  - method: GET
    path: "/crews/{id}"
    description: "Get a crew (status, completed_job_count)"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: []
    output: Crew
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Create a repair work order for a break (material sizing computed)"
    roles: [Dispatcher]
    code: 201
    input: [break_report_id, est_pipe_length_ft]
    output: WorkOrder
    side_effects:
      - "work_status=DRAFT; required_equipment_class / required_clamp_kit computed"
      - "requires break_status in {CONFIRMED, ISOLATED, REPAIRED} (ERR_INVALID_STATE otherwise)"
      - "ERR_DUPLICATE_ACTIVE_WORK_ORDER if break has a work order in DRAFT/DISPATCHED/ON_SITE"

  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders, filterable by break or crew"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["break_report_id?", "crew_id?", "limit?", "offset?"]
    output: "WorkOrder[]"
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch a crew (explicit crew_id or deterministic selector); computes estimated cost"
    roles: [Dispatcher]
    code: 200
    input: ["crew_id?"]
    output: WorkOrder
    side_effects:
      - "DRAFT → DISPATCHED; crew → DISPATCHED; dispatch window [now, now + est_hours] set"
      - "estimated_cost_cents computed (forward-looking variant)"

  - method: POST
    path: "/work-orders/{id}/arrive"
    description: "Crew lead marks arrival on site"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["DISPATCHED → ON_SITE; break ISOLATED/REPAIRED → IN_REPAIR"]

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Crew lead logs actuals and completes the repair; cascades isolation restore + restoration creation"
    roles: [CrewLead]
    code: 200
    input: [actual_pipe_length_ft, labor_hours, materials_used]
    output: WorkOrder
    side_effects:
      - "ON_SITE → REPAIR_COMPLETE; actual_cost_cents (per-line rounding) + cost_variance_cents computed"
      - "crew → AVAILABLE; completed_job_count += 1; break.total_repair_cost_cents += actual"
      - "cascade: break → REPAIRED → isolation RESTORED (valves OPEN, customers_out_of_service 0) → RestorationJob PENDING auto-created; advisory sampling window opens"

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a DRAFT or DISPATCHED work order (releases crew)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["→ CANCELLED; if DISPATCHED: crew → AVAILABLE, window cleared"]

  # --- BoilWaterAdvisory / tests ---
  - method: POST
    path: "/boil-water-advisories"
    description: "Manually issue a boil-water advisory for a break"
    roles: [WaterQualityOfficer]
    code: 201
    input: [break_report_id]
    output: BoilWaterAdvisory
    side_effects:
      - "advisory_status=ISSUED; issue_reason=MANUAL; issued_by_user_id = X-User-ID; issued_at = clock now"
      - "requires break_status in {CONFIRMED, ISOLATED, IN_REPAIR, REPAIRED} (ERR_INVALID_STATE otherwise)"
      - "ERR_ADVISORY_ALREADY_OPEN if an ISSUED advisory exists for the break"

  - method: GET
    path: "/boil-water-advisories/{id}"
    description: "Get an advisory (pass count, sampling state)"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: []
    output: BoilWaterAdvisory
    side_effects: []

  - method: POST
    path: "/boil-water-advisories/{id}/lift"
    description: "Rescind an advisory after two consecutive passing tests; segregation of duties enforced"
    roles: [WaterQualityOfficer]
    code: 200
    input: []
    output: BoilWaterAdvisory
    side_effects: ["ISSUED → LIFTED; lifted_at / lifted_by_user_id recorded"]

  - method: POST
    path: "/water-quality-tests"
    description: "Record a water quality sample against an ISSUED advisory"
    roles: [WaterQualityOfficer]
    code: 201
    input: [advisory_id, sampled_at, chlorine_residual_mg_l, coliform_result]
    output: WaterQualityTest
    side_effects:
      - "test_outcome computed; PASS increments consecutive_pass_count, FAIL resets to 0; last_sample_at updated"
      - "ERR_TEST_SAMPLE_TOO_SOON when sampled_at < last_sample_at + 20h; sampled_at < issued_at → ERR_VALIDATION"

  - method: GET
    path: "/boil-water-advisories/{id}/tests"
    description: "List water quality tests for an advisory"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["limit?", "offset?"]
    output: "WaterQualityTest[]"
    side_effects: []

  # --- RestorationJob ---
  - method: GET
    path: "/restoration-jobs/{id}"
    description: "Get a restoration job"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: []
    output: RestorationJob
    side_effects: []

  - method: GET
    path: "/restoration-jobs"
    description: "List restoration jobs, filterable by work order or permit"
    roles: [Dispatcher, CrewLead, WaterQualityOfficer, ClaimsAdjuster, PublicWorksEngineer, System]
    code: 200
    input: ["work_order_id?", "traffic_permit_id?", "limit?", "offset?"]
    output: "RestorationJob[]"
    side_effects: []

  - method: POST
    path: "/restoration-jobs/{id}/schedule"
    description: "Schedule a pavement patch window under an approved permit"
    roles: [Dispatcher]
    code: 200
    input: [scheduled_start, scheduled_end, traffic_permit_id]
    output: RestorationJob
    side_effects: ["PENDING/OVERDUE → SCHEDULED"]

  - method: POST
    path: "/restoration-jobs/{id}/complete"
    description: "Complete a patch; rolls cost into the break and may restore the break"
    roles: [Dispatcher]
    code: 200
    input: [patch_cost_cents]
    output: RestorationJob
    side_effects: ["→ COMPLETED; break.total_restoration_cost_cents += patch_cost_cents; if all jobs of break COMPLETED: break → RESTORED"]

  # --- TrafficPermit ---
  - method: POST
    path: "/traffic-permits"
    description: "Apply for a traffic control permit on a street block"
    roles: [Dispatcher]
    code: 201
    input: [break_report_id, street_block, valid_from, valid_to, control_plan]
    output: TrafficPermit
    side_effects: ["permit_status=APPLIED; half-open overlap on street_block → ERR_PERMIT_OVERLAP; valid_from >= valid_to → ERR_VALIDATION"]

  - method: POST
    path: "/traffic-permits/{id}/approve"
    description: "Approve a permit"
    roles: [PublicWorksEngineer]
    code: 200
    input: []
    output: TrafficPermit
    side_effects: ["APPLIED → APPROVED"]

  # --- DamageClaim ---
  - method: POST
    path: "/damage-claims"
    description: "File a property-damage claim against a break"
    roles: [Dispatcher]
    code: 201
    input: [break_report_id, claimant_name, claimed_amount_cents]
    output: DamageClaim
    side_effects: ["claim_status=SUBMITTED; filing window 90 days from confirmed_at (ERR_CLAIM_FILED_LATE); claimed > 0 (ERR_INVALID_AMOUNT)"]

  - method: POST
    path: "/damage-claims/{id}/approve"
    description: "Approve a claim for an amount"
    roles: [ClaimsAdjuster]
    code: 200
    input: [approved_amount_cents]
    output: DamageClaim
    side_effects: ["SUBMITTED → APPROVED; break.claims_liability_cents += approved"]

  - method: POST
    path: "/damage-claims/{id}/deny"
    description: "Deny a claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["SUBMITTED → DENIED"]

  - method: POST
    path: "/damage-claims/{id}/pay"
    description: "Pay an approved claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["APPROVED → PAID; liability -= approved; total_claims_paid_cents += approved"]

  - method: POST
    path: "/damage-claims/{id}/void"
    description: "Void an approved claim (compensating action)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["APPROVED → VOIDED; break.claims_liability_cents -= approved"]

  # --- Test-driving / checkpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [System]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

  - method: POST
    path: "/ops-runs"
    description: "Operations checkpoint: expire permits past valid_to, flag overdue restorations, recompute segment repeat-break posture"
    roles: [System]
    code: 200
    input: []
    output: "{ expired_permit_ids: string[], overdue_restoration_ids: string[], updated_segment_ids: string[] }"
    side_effects:
      - "permits {APPLIED, APPROVED} with valid_to <= now → EXPIRED"
      - "restoration jobs {PENDING, SCHEDULED} past repaired_at + 14d → OVERDUE"
      - "segment repeat/provisional counts + condition_status recomputed vs 36-month window"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for endpoint, or CrewLead acting on a work order whose crew_id != X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum value, non-positive amount/quantity, window start >= end, or sample taken before advisory issuance" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_break_report_version does not match the break's current version (isolation plan creation)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid source state for the requested transition (incl. anomaly already correlated, valve already closed)" }
  - { id: ERR_ADVISORY_TESTS_INSUFFICIENT, http: 409, condition: "Advisory lift attempted with consecutive_pass_count < 2" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Advisory lift attempted by the same user id that issued it" }
  - { id: ERR_TEST_SAMPLE_TOO_SOON, http: 409, condition: "Sampled less than 20 hours after the previous sample on the same advisory" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 409, condition: "Cross-referenced entity belongs to a different aggregate (anomaly segment != break segment; isolation valve not on break's segment; restoration permit of another break)" }
  - { id: ERR_SEGMENT_REPLACED, http: 409, condition: "Break confirmation against a REPLACED pipe segment" }
  - { id: ERR_CLAIM_FILED_LATE, http: 409, condition: "Claim filed more than 90 days after break confirmation (boundary inclusive)" }
  - { id: ERR_PERMIT_WINDOW_MISMATCH, http: 409, condition: "Permit [valid_from, valid_to) does not fully cover the restoration schedule window" }
  - { id: ERR_PERMIT_OVERLAP, http: 409, condition: "Half-open overlap with an existing APPLIED/APPROVED permit on the same street_block (adjacency allowed)" }
  - { id: ERR_CREW_DOUBLE_BOOKED, http: 409, condition: "Crew has another DISPATCHED/ON_SITE work order whose window + 60-minute buffer contains dispatch time" }
  - { id: ERR_CORRELATION_WINDOW, http: 409, condition: "Anomaly observed more than 6 hours before/after the break report's creation time" }
  - { id: ERR_BREAK_NOT_ISOLATED, http: 409, condition: "Work-order dispatch while break is not ISOLATED" }
  - { id: ERR_PERMIT_NOT_APPROVED, http: 409, condition: "Restoration schedule references a permit not in APPROVED status" }
  - { id: ERR_NO_CREW_AVAILABLE, http: 409, condition: "Auto-select found no AVAILABLE crew with sufficient equipment class and a free window" }
  - { id: ERR_DUPLICATE_ACTIVE_WORK_ORDER, http: 409, condition: "Break already has a work order in DRAFT/DISPATCHED/ON_SITE" }
  - { id: ERR_ADVISORY_ALREADY_OPEN, http: 409, condition: "Manual advisory issue while another ISSUED advisory exists for the break" }
  - { id: ERR_ADVISORY_STILL_ACTIVE, http: 409, condition: "Break close blocked by an ISSUED advisory" }
  - { id: ERR_CLAIMS_OPEN, http: 409, condition: "Break close blocked by SUBMITTED or APPROVED claims" }
  - { id: ERR_INVALID_AMOUNT, http: 400, condition: "Monetary amount missing, zero, or negative" }
  - { id: ERR_AMOUNT_EXCEEDS_CLAIMED, http: 409, condition: "approved_amount_cents > claimed_amount_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Water department dispatcher: intake, triage, isolation planning/execution, crew and restoration scheduling, permit applications, claim intake"
    identity: opaque
    exclusive_operations:
      - "POST /break-reports, confirm, false-alarm, correlate"
      - "POST /isolation-events, execute"
      - "POST /crews"
      - "POST /work-orders, dispatch, cancel"
      - "POST /restoration-jobs/{id}/schedule, complete"
      - "POST /traffic-permits"
      - "POST /damage-claims"
    shared_operations: ["all GET endpoints"]

  - name: CrewLead
    description: "Field crew leader; X-User-ID equals the Crew id they lead (ownership-checked on arrive/complete)"
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /work-orders/{id}/arrive"
      - "POST /work-orders/{id}/complete"
    shared_operations: ["all GET endpoints"]

  - name: WaterQualityOfficer
    description: "Water quality compliance officer; issues and lifts boil-water advisories, records samples. Segregation: issuer of an advisory may not lift it."
    identity: opaque
    exclusive_operations:
      - "POST /boil-water-advisories"
      - "POST /boil-water-advisories/{id}/lift"
      - "POST /water-quality-tests"
    shared_operations: ["all GET endpoints"]

  - name: ClaimsAdjuster
    description: "Claims office adjuster; decides and settles property-damage claims"
    identity: opaque
    exclusive_operations:
      - "POST /damage-claims/{id}/approve, deny, pay, void"
    shared_operations: ["all GET endpoints"]

  - name: PublicWorksEngineer
    description: "City engineer; registers assets, approves traffic permits, programs replacement, closes breaks"
    identity: opaque
    exclusive_operations:
      - "POST /pipe-segments, program-replacement, mark-replaced"
      - "POST /valves"
      - "POST /traffic-permits/{id}/approve"
      - "POST /break-reports/{id}/close"
    shared_operations: ["all GET endpoints"]

  - name: System
    description: "Machine account: SCADA anomaly feed, logical clock, ops-run checkpoint"
    identity: opaque
    exclusive_operations:
      - "POST /pressure-anomalies"
      - "POST /_clock/set_current_utc"
      - "POST /ops-runs"
    shared_operations: ["all GET endpoints"]
