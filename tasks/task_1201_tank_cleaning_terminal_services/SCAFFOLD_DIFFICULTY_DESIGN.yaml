        distinguishing_aspect: |
          Metric safety_score on POST /ops/contractors/{id}/qualify: the
          threshold is INCLUSIVE (>=), so exactly 85.00 qualifies while 84.75
          is rejected — a different metric and endpoint than the LEL boundary.
        test_recipe:
          setup:
            - "clock 2026-05-01; terminal ROLLING_12MO threshold 85.0; contractor C1 with VIOLATION w=15 on 2026-04-20 (score exactly 85.00); contractor C2 with same VIOLATION plus NEAR_MISS w=1 (score 84.75)"
