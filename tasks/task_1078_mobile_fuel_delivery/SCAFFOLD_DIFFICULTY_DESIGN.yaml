          - errors[ERR_VEHICLE_SUSPENDED]
          - errors[ERR_VEHICLE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state (priority 4) vs business_fiscal (priority 9): an order on a
          SUSPENDED fleet vehicle whose estimated total ALSO exceeds the vehicle budget returns
          ERR_VEHICLE_SUSPENDED, never ERR_VEHICLE_BUDGET_EXCEEDED.
