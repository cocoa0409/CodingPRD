              payload: { citation_number: "Q2", violation_type: "METER_EXPIRED", fine_amount_cents: 25000, issued_at: "2026-05-01T00:00:00Z", due_at: "2026-12-31T00:00:00Z" }
              as: EnforcementOfficer
