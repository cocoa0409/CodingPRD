            - "Application.${app_id}.status remains DECLINED with no interview rows created"

      - name: employer_suspend_blocks_new_applications_and_offer_issuance
        claim_type: side_effect_execution
        grounds:
          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - errors.ERR_NO_OPENINGS
        distinguishing_aspect: "Suspending the employer flips Employer.status to SUSPENDED and immediately blocks BOTH new applications (at creation) and offer issuance (on an already-INTERVIEWING application) with ERR_NO_OPENINGS, while reads keep working."
        test_recipe:
