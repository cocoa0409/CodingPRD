            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T12:00:00Z", reference_activity_mbq: 20000, reference_time_at: "2026-08-01T12:00:00Z" }, as: Radiopharmacist, captures: { delA: $.data.id } }
          trigger:
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T12:10:00Z", reference_activity_mbq: 20000, reference_time_at: "2026-08-01T12:10:00Z" }, as: Radiopharmacist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_HOT_LAB_CAPACITY_EXCEEDED (windows [11:30,12:30) and [11:40,12:40) intersect; t_star = 12:10; load 18778.618 + 20000.000 = 38778.618 > 37000)"
            - "Delivery A remains SCHEDULED (rejection of B leaves no trace)"

  - rule_id: compensating_invariant
    instances:
      - name: vial_activity_balance_conserved
        grounds:
          - state_machines.DoseVial.ADMINISTERED_to_DISPOSED
          - entities.DoseVial.fields.residual_activity_mbq
          - entities.WasteContainer.fields.intake_activity_mbq
        distinguishing_aspect: |
          Conserved quantity: per-vial activity accountability. The forward
          action (administer) plus its compensating action (dispose) must satisfy
          measured == assayed + residual + decay_loss exactly: 220.000 ==
          110.000 + 110.000 + 0.000, and the container's intake equals the
          residual. Different conserved quantity from the sibling instance
          (license-wide possession total).
