  - section: consistency_model
    instances:
      - name: corner_registration_counters_visible_in_same_response
        claim_type: immediate
        grounds: [entities.Event.fields.registered_count, entities.TicketType.fields.sold_count]
        distinguishing_aspect: "The consistency model is immediate: the ticket type read right after a registration create already reports sold_count 1 and availability_status SOLD_OUT with no second write."
        test_recipe:
          setup: ["Event 'Immediate' PUBLISHED with a GENERAL ticket type of quota 1."]
          setup_api_calls:
            - call: "POST /api/events"
              payload: { name: "Immediate", timezone: "UTC", starts_at: "2026-11-19T09:00:00Z", ends_at: "2026-11-19T17:00:00Z", early_bird_ends_at: "2026-06-01T00:00:00Z", capacity: 25 }
              as: Organizer
              as_user_id: "org-1"
              captures: { ev_id: $.data.id }
            - call: "POST /api/events/${ev_id}/ticket-types"
              payload: { name: "General", tier: "GENERAL", price_cents: 20000, quota: 1, gating_level: "BOTH" }
              as: Organizer
              as_user_id: "org-1"
              captures: { tt_id: $.data.id }
            - call: "POST /api/events/${ev_id}/publish"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
            - call: "POST /api/registrations"
              payload: { event_id: "${ev_id}", ticket_type_id: "${tt_id}", attendee_email: "now@example.com" }
              as: Organizer
              as_user_id: "org-1"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "GET /api/ticket-types/${tt_id}"
              payload: {}
              as: Organizer
              as_user_id: "org-1"
              captures: { sold: $.data.sold_count, avail: $.data.availability_status }
          assert:
            - "${sold} == 1"
            - "${avail} == SOLD_OUT"
            - "Event.${ev_id}.registered_count == 1"
