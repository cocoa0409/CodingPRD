  - method: POST
    path: "/maker-events/{event_id}/applications/{app_id}/decide"
    description: "IN_REVIEW -> APPROVED | WAITLISTED | REJECTED; auto-grants Booth on APPROVE (OCC on MakerEvent)"
    roles: [EventCoordinator]
    code: 200
    input: [outcome, expected_event_version]
    output: VendorApplication
    side_effects:
      - "APPROVE: create BoothAssignment PENDING_PAYMENT + PROVISIONAL BoothFeeCharge; MakerEvent.version += 1"
      - "WAITLIST/REJECT: no assignment; MakerEvent.version += 1"

  - method: POST
    path: "/maker-events/{event_id}/applications/{app_id}/revoke"
    description: "APPROVED -> CANCELLED (coordinator revocation)"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["Assignment -> FORFEITED; refund minted; waitlist scan"]

  # ---------- JuryScore ----------
  - method: POST
    path: "/maker-events/{event_id}/applications/{app_id}/jury-scores"
    description: "Submit a jury score; one per (juror, application)"
    roles: [Juror]
    code: 201
    input: [craftsmanship, originality, booth_presentation]
    output: JuryScore
    side_effects: ["application.jury_score_total += total; application.jury_score_count += 1"]

  - method: GET
    path: "/maker-events/{event_id}/applications/{app_id}/jury-scores"
    description: "List jury scores for an application"
    roles: [EventCoordinator, Juror, Treasurer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "JuryScore[]"
    side_effects: []

  - method: GET
    path: "/jury-scores"
    description: "Filtered list of JuryScores"
    roles: [EventCoordinator, Juror, Treasurer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "vendor_application_id?"]
    output: "JuryScore[]"
    side_effects: []

  - method: GET
    path: "/jury-scores/{score_id}"
    description: "Canonical single JuryScore read (anchor for collection segment derivation)"
    roles: [EventCoordinator, Juror, Treasurer, PlatformAdmin]
    code: 200
    input: []
    output: JuryScore
    side_effects: []

  # ---------- BoothAssignment ----------
  - method: GET
    path: "/maker-events/{event_id}/assignments"
    description: "List BoothAssignments for an event"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "booth_id?", "vendor_application_id?"]
    output: "BoothAssignment[]"
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/assignments/{assignment_id}"
    description: "Read one BoothAssignment"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: []

  - method: GET
    path: "/booth-assignments/{assignment_id}"
    description: "Canonical single BoothAssignment read"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: []

  - method: GET
    path: "/booth-assignments"
    description: "Filtered list of BoothAssignments (FK reverse-reachability for booth_id, vendor_application_id)"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "booth_id?", "vendor_application_id?"]
    output: "BoothAssignment[]"
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/assignments/{assignment_id}/pay"
    description: "PENDING_PAYMENT -> ACTIVE; mints FINAL BoothFeeCharge"
    roles: [Vendor]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["FINAL charge minted; Booth.assigned_application_id set"]

  - method: POST
    path: "/maker-events/{event_id}/assignments/{assignment_id}/forfeit"
    description: "PENDING_PAYMENT|ACTIVE -> FORFEITED; mints REFUND; triggers waitlist scan"
    roles: [Vendor, EventCoordinator]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["REFUND charge; Booth.assigned_application_id cleared; waitlist promotion scan"]

  - method: POST
    path: "/maker-events/{event_id}/assignments/{assignment_id}/release"
    description: "PENDING_PAYMENT -> RELEASED (coordinator-only, no refund)"
    roles: [EventCoordinator]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["Booth.assigned_application_id cleared; waitlist promotion scan"]

  - method: POST
    path: "/maker-events/{event_id}/assignments/{assignment_id}/confirm"
    description: "Application APPROVED -> CONFIRMED once assignment is ACTIVE"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []

  # ---------- BoothFeeCharge ----------
  - method: GET
    path: "/maker-events/{event_id}/assignments/{assignment_id}/charges"
    description: "List BoothFeeCharge rows for an assignment"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BoothFeeCharge[]"
    side_effects: []

  - method: GET
    path: "/booth-fee-charges"
    description: "Filtered list of BoothFeeCharge (FK reverse-reachability for booth_assignment_id)"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "booth_assignment_id?"]
    output: "BoothFeeCharge[]"
    side_effects: []

  - method: GET
    path: "/booth-fee-charges/{charge_id}"
    description: "Canonical single BoothFeeCharge read (anchor for collection segment derivation)"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: BoothFeeCharge
    side_effects: []

  # ---------- LoadInSlot ----------
  - method: POST
    path: "/maker-events/{event_id}/load-in-slots"
    description: "Reserve a load-in or load-out slot on a bay"
    roles: [Vendor, EventCoordinator]
    code: 201
    input: [booth_assignment_id, kind, starts_at, ends_at, bay]
    output: LoadInSlot
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/load-in-slots"
    description: "List LoadInSlots for an event"
    roles: [EventCoordinator, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "bay?", "kind?", "booth_assignment_id?"]
    output: "LoadInSlot[]"
    side_effects: []

  - method: GET
    path: "/load-in-slots/{slot_id}"
    description: "Canonical single LoadInSlot read"
    roles: [EventCoordinator, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: LoadInSlot
    side_effects: []

  - method: GET
    path: "/load-in-slots"
    description: "Filtered list of LoadInSlots (FK reverse-reachability)"
    roles: [EventCoordinator, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "maker_event_id?", "booth_assignment_id?"]
    output: "LoadInSlot[]"
    side_effects: []

  # ---------- Ticket ----------
  - method: POST
    path: "/maker-events/{event_id}/tickets"
    description: "Sell a ticket"
    roles: [EventCoordinator, PlatformAdmin]
    code: 201
    input: [purchaser_email, kind, price_cents]
    output: Ticket
    side_effects: ["state=ISSUED"]

  - method: GET
    path: "/maker-events/{event_id}/tickets"
    description: "List tickets"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "state?", "kind?"]
    output: "Ticket[]"
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/tickets/{ticket_id}"
    description: "Read a ticket"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets/{ticket_id}"
    description: "Canonical single Ticket read"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "Filtered list of Tickets (FK reverse-reachability for maker_event_id)"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "maker_event_id?"]
    output: "Ticket[]"
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/tickets/{ticket_id}/redeem"
    description: "ISSUED -> REDEEMED; venue capacity gate; VIP double-count"
    roles: [GateAgent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["Attendance row appended"]

  - method: POST
    path: "/maker-events/{event_id}/tickets/{ticket_id}/refund"
    description: "ISSUED|REDEEMED -> REFUNDED with constraints"
    roles: [EventCoordinator]
    code: 200
    input: [reason]
    output: Ticket
    side_effects: []

  # ---------- Attendance ----------
  - method: GET
    path: "/maker-events/{event_id}/attendance"
    description: "List Attendance rows"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "ticket_id?", "on_site?"]
    output: "Attendance[]"
    side_effects: []

  - method: GET
    path: "/attendance/{attendance_id}"
    description: "Canonical single Attendance read"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: []
    output: Attendance
    side_effects: []

  - method: GET
    path: "/attendance"
    description: "Filtered list of Attendance (FK reverse-reachability)"
    roles: [EventCoordinator, Treasurer, GateAgent, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "maker_event_id?", "ticket_id?"]
    output: "Attendance[]"
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/attendance/{attendance_id}/exit"
    description: "Record exit scan (sets exited_at)"
    roles: [GateAgent]
    code: 200
    input: []
    output: Attendance
    side_effects: ["exited_at = clock_now"]

  # ---------- SalesLedgerEntry ----------
  - method: POST
    path: "/maker-events/{event_id}/sales-ledger"
    description: "Post a sale (positive gross_cents) or refund (negative gross_cents with reversal_of_entry_id)"
    roles: [Vendor]
    code: 201
    input: [booth_assignment_id, gross_cents, "reversal_of_entry_id?"]
    output: SalesLedgerEntry
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/sales-ledger"
    description: "List SalesLedgerEntries"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "booth_assignment_id?"]
    output: "SalesLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/sales-ledger-entries/{entry_id}"
    description: "Canonical single SalesLedgerEntry read"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: SalesLedgerEntry
    side_effects: []

  - method: GET
    path: "/sales-ledger-entries"
    description: "Filtered list of SalesLedgerEntries (FK reverse-reachability)"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "maker_event_id?", "booth_assignment_id?", "reversal_of_entry_id?"]
    output: "SalesLedgerEntry[]"
    side_effects: []

  # ---------- Settlement ----------
  - method: GET
    path: "/maker-events/{event_id}/settlements"
    description: "List Settlements"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?", "booth_assignment_id?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/maker-events/{event_id}/settlements/{settlement_id}"
    description: "Read one Settlement"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements/{settlement_id}"
    description: "Canonical single Settlement read"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/settlements"
    description: "Filtered list of Settlements (FK reverse-reachability for booth_assignment_id)"
    roles: [EventCoordinator, Treasurer, Vendor, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "booth_assignment_id?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/settlements/{settlement_id}/compute"
    description: "PENDING|DISPUTED -> COMPUTED"
    roles: [Treasurer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["gross_sales_cents, commission_cents, net_payout_cents recomputed"]

  - method: POST
    path: "/maker-events/{event_id}/settlements/{settlement_id}/approve"
    description: "COMPUTED -> APPROVED; segregation-of-duties & OCC on Settlement"
    roles: [Treasurer]
    code: 200
    input: [expected_settlement_version]
    output: Settlement
    side_effects: ["approved_by_user_id = X-User-ID; Settlement.version += 1"]

  - method: POST
    path: "/maker-events/{event_id}/settlements/{settlement_id}/dispute"
    description: "COMPUTED -> DISPUTED (vendor)"
    roles: [Vendor]
    code: 200
    input: ["reason?"]
    output: Settlement
    side_effects: []

  - method: POST
    path: "/maker-events/{event_id}/settlements/{settlement_id}/mark-paid"
    description: "APPROVED -> PAID; locks commission via commission_final"
    roles: [Treasurer]
    code: 200
    input: []
    output: Settlement
    side_effects: ["commission_cents re-quoted via commission_final and persisted"]

  - method: POST
    path: "/maker-events/{event_id}/settlements/{settlement_id}/cancel"
    description: "PENDING|COMPUTED -> CANCELLED"
    roles: [Treasurer]
    code: 200
    input: []
    output: Settlement
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 400, condition: "X-User-Role or X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not authorized for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_POSTURE_FORBIDS, http: 409, condition: "MakerEvent.posture does not permit this operation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a state that permits the requested transition" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation-of-duties: juror scored own application, juror is event coordinator, or settlement approver is event creator" }
  - { id: ERR_JURY_QUORUM_NOT_MET, http: 409, condition: "Fewer than jury_quorum distinct juror scores present at decide time" }
  - { id: ERR_JURY_DUPLICATE, http: 409, condition: "Same juror already scored this application" }
  - { id: ERR_CATEGORY_CAP_EXCEEDED, http: 409, condition: "Approving would push APPROVED count above the category_cap for the requested_category" }
  - { id: ERR_APPLICATION_WINDOW_CLOSED, http: 409, condition: "Submit attempted outside [application_window_start, application_window_end)" }
  - { id: ERR_BOOTH_CONSTRAINT_VIOLATION, http: 422, condition: "Booth tier mismatch or ANCHOR footprint < 20 sqm" }
  - { id: ERR_BOOTH_DOUBLE_BOOKED, http: 409, condition: "Another BoothAssignment in {PENDING_PAYMENT, ACTIVE} already occupies the Booth" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "LoadInSlot conflicts with an existing slot on same bay+kind under half-open [start, end) semantics" }
  - { id: ERR_PAYMENT_WINDOW_EXPIRED, http: 409, condition: "clock_now > payment_due_at at time of /pay" }
  - { id: ERR_VENUE_AT_CAPACITY, http: 409, condition: "Effective occupancy (with VIP double-count) >= venue_capacity at redeem time" }
  - { id: ERR_TICKET_NOT_REDEEMABLE, http: 409, condition: "Ticket not in ISSUED state, or weather_flag == SEVERE, or posture != LIVE" }
  - { id: ERR_TICKET_NOT_REFUNDABLE, http: 409, condition: "Ticket state and reason do not permit refund" }
  - { id: ERR_SETTLEMENT_NOT_COMPUTABLE, http: 409, condition: "Settlement is not in PENDING or DISPUTED at compute time" }
  - { id: ERR_SETTLEMENT_NOT_APPROVABLE, http: 409, condition: "Settlement is not in COMPUTED at approve time" }
  - { id: ERR_SETTLEMENT_NOT_PAYABLE, http: 409, condition: "Settlement is not in APPROVED at mark-paid time" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "VendorProfile.status == SUSPENDED blocks the operation" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "VendorProfile.contact_email already in use" }
  - { id: ERR_UNRESOLVED_APPLICATIONS, http: 409, condition: "Cannot begin scheduling: some applications still in SUBMITTED/IN_REVIEW" }
  - { id: ERR_UNRESOLVED_SETTLEMENTS, http: 409, condition: "Cannot close event: some Settlements are not APPROVED or PAID" }
  - { id: ERR_UNRESOLVED_ATTENDANCE, http: 409, condition: "Cannot end event: some Attendance rows have exited_at null" }
  - { id: ERR_INVALID_INPUT, http: 400, condition: "Field value fails type/enum/range validation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EventCoordinator
    description: "Owns the event lifecycle, booth map, decisions, weather and cancellation"
    identity: opaque
    exclusive_operations:
      - "POST /maker-events"
      - "POST /maker-events/{id}/open-applications, close-applications, begin-scheduling, go-live, end-event, close-event, cancel, weather"
      - "POST /maker-events/{id}/booth-zones and nested booths"
      - "POST /maker-events/{id}/applications/{aid}/decide, revoke"
      - "POST /maker-events/{id}/assignments/{aid}/release"
      - "POST /maker-events/{id}/tickets and /tickets/{tid}/refund"
    shared_operations:
      - "GET on all resources"
      - "POST /maker-events/{id}/load-in-slots"
      - "POST /maker-events/{id}/assignments/{aid}/forfeit"

  - name: Vendor
    description: "A maker applying to, paying for, and operating a booth"
    identity: "entity_backed:VendorProfile"
    exclusive_operations:
      - "POST /maker-events/{id}/applications (as the vendor_profile_id owner)"
      - "POST /maker-events/{id}/applications/{aid}/submit, withdraw"
      - "POST /maker-events/{id}/assignments/{aid}/pay, confirm"
      - "POST /maker-events/{id}/sales-ledger"
      - "POST /maker-events/{id}/settlements/{sid}/dispute"
    shared_operations:
      - "GET on MakerEvent, BoothZone, Booth, own VendorApplication, own BoothAssignment, own Settlement, own SalesLedgerEntry, LoadInSlot"
      - "POST /maker-events/{id}/load-in-slots"
      - "POST /maker-events/{id}/assignments/{aid}/forfeit"

  - name: Juror
    description: "Scores applications during JURY_REVIEW; must not be a vendor applicant on the same event nor the event creator"
    identity: opaque
    exclusive_operations:
      - "POST /maker-events/{id}/applications/{aid}/jury-scores"
    shared_operations:
      - "GET on MakerEvent, VendorApplication, JuryScore"

  - name: Treasurer
    description: "Owns settlement computation and payout; distinct from EventCoordinator (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /maker-events/{id}/settlements/{sid}/compute, approve, mark-paid, cancel"
    shared_operations:
      - "GET on all resources"

  - name: GateAgent
    description: "Redeems tickets at the gate and records exit scans"
    identity: opaque
    exclusive_operations:
      - "POST /maker-events/{id}/tickets/{tid}/redeem"
      - "POST /maker-events/{id}/attendance/{aid}/exit"
    shared_operations:
      - "GET on MakerEvent, Ticket, Attendance"

  - name: PlatformAdmin
    description: "Test-driving operations and vendor registration"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /vendor-profiles, /vendor-profiles/{vid}/suspend"
    shared_operations:
      - "GET on all resources"
