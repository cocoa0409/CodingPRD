              payload: { worker_code: "W-AP-AC", full_name: "A. Learner", classification: "APPRENTICE", apprentice_period: 3, home_jurisdiction_key: "J1", qualification_state_code: "AP-AC", percent_complete_certified: 20, percent_complete_verified: 20, safety_verified_status: "VERIFIED", safety_verification_code: "SAFE-AP-AC" }
