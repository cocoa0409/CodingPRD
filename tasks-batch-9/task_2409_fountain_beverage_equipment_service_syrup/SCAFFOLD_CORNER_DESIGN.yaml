              as: SupplyPlanner
          assert:
            - "OutletSupplyPosition.${sp}.forecast_units == 11.00"
            - "OutletSupplyPosition.${sp}.requested_units == 11"
            - "OutletSupplyPosition.${sp}.alert_level == LOW"

