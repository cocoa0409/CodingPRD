              payload: { cancellation_schedule_code: "STANDARD", travel_policy_code: "POLICY_B", recording_rights: "NONE", technical_rider_code: "STANDARD_AV", exclusivity_days: 0 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/send"
