      - name: offer_window_halfopen_boundary_at_valid_until
        grounds:
          - validations.priority_20
          - entities.AncillaryOffer.fields.valid_until
          - state_machines.AncillaryOffer.offer_status.PRESENTED_to_ACCEPTED
          - state_machines.AncillaryOffer.offer_status.PRESENTED_to_EXPIRED
          - endpoints.POST__clock_set_current_utc
          - calculations.channel_settlement_total
        overlap_dimension: "half-open validity window [valid_from, valid_until) against the logical clock"
        distinguishing_aspect: |
          Two offers are presented at 09:00:00Z with valid_until 10:00:00Z. The rank-1 offer is
          accepted at 09:59:59Z - the last instant inside the window - and must succeed. The
          clock then moves to exactly 10:00:00Z and the rank-2 offer must EXPIRE in the same
          request, with expired_offer_count 1: a clock equal to valid_until is outside the
          window. An inclusive upper bound leaves the rank-2 offer PRESENTED and reports
          expired_offer_count 0.
        test_recipe:
          setup:
            - "clock at 2026-08-10T09:00:00Z; BAG_CHECKED_1 is bundled into ECO_LITE, while SEAT_STANDARD (1900) and PRIORITY_BOARDING (1250) are merchandisable; no seat segment exists, so SEAT prices use WTP_ELASTIC"
            - "flight AC100 is PRESALE with demand snapshot 75 / 1200; one HELD booking sits on DIRECT_WEB (markup_bp 0)"
            - "an unfiltered BOOKING session presents exactly 2 offers: rank 1 SEAT_STANDARD at 2091 (expected_value 2302) and rank 2 PRIORITY_BOARDING at 1376 (expected_value 1515)"
