  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: effective_advertised_price_exactly_at_floor_is_compliant
        grounds:
          - calculations.effective_advertised_price
          - calculations.violation_points
          - entities.PriceObservation.fields.deviation_cents
          - entities.PriceObservation.fields.deviation_pct
          - state_machines.PriceObservation.CAPTURED_to_EVALUATED_COMPLIANT
          - state_machines.PriceObservation.CAPTURED_to_EVALUATED_BREACH
        distinguishing_aspect: |
          Metric: advertised price in cents against the MAP floor, at POST
          /price-observations/{id}/evaluate. 12000 - min(2000, floor(12000*0.40)==4800)
          == 10000 lands exactly on the 10000 floor and is COMPLIANT with
          deviation_cents 0 and an empty violation collection (the >= edge and the
          zero-count edge); the same listing one cent lower yields 9999, deviation 1
          and deviation_pct 0.0001, the smallest breach the model can express.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-K published with shipping_counts_as_advertised false, auto_coupon_counts_as_advertised true, promo_code_counts_as_advertised false, max_discount_attribution_pct 0.40."
            - "Product SKU-MAP-4 msrp_cents 15000, standard_map_floor_cents 10000, no exceptions (floor_source STANDARD)."
            - "Reseller AUTHORIZED / OPEN, primary_channel RETAILER_SITE, permitted_channels [RETAILER_SITE], violation_points_total 0."
            - "Clock at 2026-08-10T00:00:00Z."
            - "Two RETAILER_SITE observations matched to that reseller, both with shipping_cents 700 (excluded by policy), auto_coupon_cents 2000 (counted) and promo_code_cents 1500 (excluded): one at listed_price_cents 12000, one at 11999."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
