  - section: rbac
    instances:
      - name: every_role_is_refused_the_other_roles_exclusive_operations
        claim_type: exclusive_operations
        grounds:
          - rbac.RoyaltyAdmin.exclusive_operations
          - rbac.RightsOpsAnalyst.exclusive_operations
          - rbac.RightsHolderUser.exclusive_operations
          - rbac.RegulatoryOfficer.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          The four roles are peers with disjoint money/metadata/claim/rate powers, and priority 2
          runs before FK resolution — so each denial is provable with a syntactically valid body and
          an id that does not exist, and must still be ERR_FORBIDDEN_ROLE rather than a 404. In
          particular the analyst who matches usage cannot calculate a pool, the admin who pays money
          cannot match usage or open an audit on a holder's behalf, and the rate officer can touch
          neither statements nor claims.
        test_recipe:
          setup:
            - "Empty database; only bogus ids are used, because priority 2 precedes priority 3."
          setup_api_calls: []
          trigger:
            - name: analyst_cannot_calculate_a_pool
              call: "POST /royalties/pools/11111111-1111-4111-8111-111111111130/calculate"
              payload: {}
              as: RightsOpsAnalyst
              captures: { err1: "$.data.error_id" }
            - name: admin_cannot_match_a_usage_batch
              call: "POST /royalties/usage-batches/11111111-1111-4111-8111-111111111131/match"
              payload: {}
              as: RoyaltyAdmin
              captures: { err2: "$.data.error_id" }
            - name: admin_cannot_open_an_audit_engagement
              call: "POST /royalties/audit-engagements"
              payload: { rights_holder_id: "11111111-1111-4111-8111-111111111132", statement_id: "11111111-1111-4111-8111-111111111133", requested_scope_start: "2026-06-01", requested_scope_end: "2026-06-30" }
              as: RoyaltyAdmin
              captures: { err3: "$.data.error_id" }
            - name: analyst_cannot_record_audit_findings
              call: "POST /royalties/audit-engagements/11111111-1111-4111-8111-111111111134/findings"
              payload: { asserted_underpayment_cents: 5000 }
              as: RightsOpsAnalyst
              captures: { err4: "$.data.error_id" }
            - name: regulatory_officer_cannot_build_a_statement
              call: "POST /royalties/statements"
              payload: { rights_holder_id: "11111111-1111-4111-8111-111111111135", period_id: "11111111-1111-4111-8111-111111111136" }
              as: RegulatoryOfficer
              captures: { err5: "$.data.error_id" }
            - name: regulatory_officer_cannot_approve_a_claim
              call: "POST /royalties/rights-registrations/11111111-1111-4111-8111-111111111137/approve"
              payload: {}
              as: RegulatoryOfficer
              captures: { err6: "$.data.error_id" }
            - name: holder_user_cannot_promulgate_a_rate_schedule
              call: "POST /royalties/rate-schedules/11111111-1111-4111-8111-111111111138/promulgate"
              payload: {}
              as: RightsHolderUser
              as_user_id: "11111111-1111-4111-8111-111111111139"
              captures: { err7: "$.data.error_id" }
            - name: holder_user_cannot_seal_a_usage_batch
              call: "POST /royalties/usage-batches/11111111-1111-4111-8111-111111111140/seal"
              payload: {}
              as: RightsHolderUser
              as_user_id: "11111111-1111-4111-8111-111111111139"
              captures: { err8: "$.data.error_id" }
          assert:
            - "All eight calls return HTTP 403 with error_id ERR_FORBIDDEN_ROLE."
            - "None of them returns a 404 despite every referenced id being non-existent, which proves priority 2 runs before priority 3."
            - "No row of any kind is created by these calls."

      - name: shared_operations_succeed_for_every_permitted_role
        claim_type: shared_operations
        grounds:
          - rbac.RoyaltyAdmin.shared_operations
          - rbac.RightsOpsAnalyst.shared_operations
          - rbac.RightsHolderUser.shared_operations
          - rbac.RegulatoryOfficer.shared_operations
        distinguishing_aspect: |
          Four operations are genuinely shared and must not be quietly narrowed to one role: works
          and usage batches are creatable by both the admin and the analyst, a registration may be
          filed by the analyst ON BEHALF OF any claimant (the ownership rule at priority 6 binds
          RightsHolderUser callers, not analysts), the clock is settable by all four roles, and every
          GET is readable by all four.
        test_recipe:
          setup:
            - "One LABEL holder with direct_deal_rate_bps 800 and one OPEN period."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
