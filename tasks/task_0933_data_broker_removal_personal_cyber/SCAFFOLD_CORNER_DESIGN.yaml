              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof1_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner Alias", date_of_birth: "1984-03-02", primary_address: "9 Oak Ave, Springfield" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof2_id: $.data.id, p2v1: $.data.version }
            - call: "POST /monitored-profiles/${prof2_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana.alias@example.com", expected_profile_version: "${p2v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /monitored-profiles/${prof2_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
            - call: "POST /monitored-profiles/${prof1_id}/retire"
