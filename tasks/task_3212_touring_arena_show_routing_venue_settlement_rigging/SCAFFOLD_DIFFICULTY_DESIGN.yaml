# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3212 — Touring Arena Show Routing, Venue Settlement & Rigging Logistics
#
# Nine Difficulty Rules × ≥2 instances each = ≥18 instances.
# Every setup_api_calls chain is replays-against-§1.5 clean.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: dual_variant_calc — two calculations on different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: venue_share_flat_rent_vs_percentage_floor_binds
        grounds:
          - calculations.venue_share_settlement
          - entities.Settlement.fields.venue_share_cents
          - entities.Engagement.fields.deal_type
        distinguishing_aspect: |
          The venue_share_settlement calculation has two variants keyed on
          Engagement.deal_type: FLAT_RENT ignores gross; PERCENTAGE takes
          max(agreed_rent_cents, round_half_up(G * pct)). For identical gross
          G=100000_00 and agreed_rent=40000_00 with pct=0.30, FLAT_RENT yields
          40000_00 but PERCENTAGE yields max(40000_00, 30000_00) = 40000_00
          (floor binds). Doubling G to 200000_00 keeps FLAT_RENT at 40000_00
          but PERCENTAGE becomes max(40000_00, 60000_00) = 60000_00. Two
          engagements differing ONLY in deal_type produce different
          venue_share_cents at the same gross.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Tour T with royalty_reserve_pct=0 (no cap)."
            - "Venue V with percentage_share_pct=0.30, default_rent_cents=40000_00, union_rule_set=NON_UNION, load_in_dock_doors=4, capacity_seats=10000."
            - "Two OPEN DateAvails A1 (Sep 10-15) and A2 (Sep 20-25)."
            - "Two Engagements E_FLAT (deal_type=FLAT_RENT, agreed_rent=40000_00, avail A1) and E_PCT (deal_type=PERCENTAGE, agreed_rent=40000_00, avail A2), both CONFIRMED."
            - "Each engagement has a single TicketScale with base_price_cents=100_00, seats_allocated=2000, seats_sold=1000 (so G=100000_00 each)."
            - "Advance clock past first_show_at on both so they reach IN_PERFORMANCE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "Spectacular 2026", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "MetroDome", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_1: $.data.id, avail_1_v: $.data.version }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-20T00:00:00Z", closes_at: "2026-09-25T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_2: $.data.id, avail_2_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_1}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_1_v}" }
              as: TourManager
              captures: { eng_flat: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_flat}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_2}", load_in_at: "2026-09-20T08:00:00Z", first_show_at: "2026-09-21T19:00:00Z", load_out_at: "2026-09-23T23:00:00Z", deal_type: "PERCENTAGE", agreed_rent_cents: 4000000, expected_avail_version: "${avail_2_v}" }
              as: TourManager
              captures: { eng_pct: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_pct}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/engagements/${eng_flat}/ticket-scales"
              payload: { tier_label: "GOLD", base_price_cents: 10000, seats_allocated: 2000, tier_rank: 1, on_sale_at: "2026-09-01T00:00:00Z" }
              as: BoxOfficeManager
              captures: { scale_flat: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_pct}/ticket-scales"
              payload: { tier_label: "GOLD", base_price_cents: 10000, seats_allocated: 2000, tier_rank: 1, on_sale_at: "2026-09-01T00:00:00Z" }
              as: BoxOfficeManager
              captures: { scale_pct: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_flat}/ticket-sales"
              payload: { ticket_scale_id: "${scale_flat}", quantity: 1000 }
              as: BoxOfficeManager
            - call: "POST /tours/${tour_id}/engagements/${eng_pct}/ticket-sales"
              payload: { ticket_scale_id: "${scale_pct}", quantity: 1000 }
              as: BoxOfficeManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_flat}/settlement/reconcile"
              payload: {}
              as: TourManager
              captures: { settle_flat_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours/${tour_id}/engagements/${eng_pct}/settlement/reconcile"
              payload: {}
              as: TourManager
              captures: { settle_pct_id: $.data.id }
          assert:
            - "Settlement.${settle_flat_id}.gross_ticket_cents == 10000000"
            - "Settlement.${settle_flat_id}.venue_share_cents == 4000000 (FLAT_RENT ignores gross)"
            - "Settlement.${settle_pct_id}.gross_ticket_cents == 10000000"
            - "Settlement.${settle_pct_id}.venue_share_cents == 4000000 (PERCENTAGE floor binds: max(4000000, round(10000000*0.30)) = max(4000000, 3000000))"
            - "Both engagements reach SETTLED status; two variants both floor-bind at this gross"

      - name: labor_estimate_per_call_vs_final_per_worker
        grounds:
          - calculations.labor_call_cost_estimate
          - calculations.labor_call_final_cost
          - entities.LaborCall.fields.estimated_cost_cents
          - entities.LaborCall.fields.final_cost_cents
        distinguishing_aspect: |
          labor_call_cost_estimate computes per-CALL (effective_hours × headcount × rate);
          labor_call_final_cost computes per-WORKER from punch_records (each worker's hours
          rounded then costed, then summed). For the same LaborCall at IATSE (minimum=4h,
          OT threshold=8h, OT=1.5x) with headcount=2, hourly_rate=5000 cents, scheduled
          10h, the estimate is 2 × (8 + 2*1.5) × 5000 = 110000 cents. If actual punches
          show worker A worked 9h and worker B worked 11h, the final is
          (8+1*1.5)*5000 + (8+3*1.5)*5000 = 47500 + 62500 = 110000 cents (same total hours,
          same answer). BUT if A works 6h and B works 11h, the final is
          (6+0)*5000 + (8+3*1.5)*5000 = 30000 + 62500 = 92500 cents ≠ 110000 cents.
          The two variants legitimately diverge on the same LaborCall.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Tour T (ROUTING), Venue V (IATSE, load_in_dock_doors=4), DateAvail A1 OPEN Sep 10-15, Engagement E1 CONFIRMED with load_in 2026-09-10T08:00:00Z, first_show 2026-09-11T19:00:00Z."
            - "LaborCall L1: department=RIGGERS, headcount=2, call_start 2026-09-10T08:00:00Z, call_end 2026-09-10T18:00:00Z (10h), hourly_rate_cents=5000."
            - "L1 transitioned DRAFT → POSTED → FILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "Labor Tour", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "IATSE Arena", market_code: "NYC", capacity_seats: 15000, load_in_dock_doors: 4, union_rule_set: "IATSE", default_rent_cents: 5000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_1: $.data.id, avail_1_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_1}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 5000000, expected_avail_version: "${avail_1_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/labor-calls"
              payload: { department: "RIGGERS", headcount: 2, call_start_at: "2026-09-10T08:00:00Z", call_end_at: "2026-09-10T18:00:00Z", hourly_rate_cents: 5000 }
              as: LaborSteward
              captures: { call_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/labor-calls/${call_id}/post"
              payload: {}
              as: LaborSteward
              captures: { est_cost: $.data.estimated_cost_cents }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/labor-calls/${call_id}/fill"
              payload: {}
              as: LaborSteward
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/labor-calls/${call_id}/settle"
              payload: { punch_records: [{ punch_in_at: "2026-09-10T08:00:00Z", punch_out_at: "2026-09-10T14:00:00Z" }, { punch_in_at: "2026-09-10T08:00:00Z", punch_out_at: "2026-09-10T19:00:00Z" }] }
              as: LaborSteward
              captures: { final_cost: $.data.final_cost_cents, settled_call: $.data.id }
          assert:
            - "estimated_cost_cents == 110000 (per-call: 2 × (8 + 2*1.5) × 5000)"
            - "LaborCall.${settled_call}.final_cost_cents == 92500 (per-worker: 6h*5000 + (8+3*1.5)*5000 = 30000 + 62500)"
            - "final_cost_cents != estimated_cost_cents — the two variants legitimately diverge"
            - "LaborCall.${settled_call}.status == SETTLED"

  # ===========================================================================
  # Rule 2: combinatorial_formula — different modes {(a), (b), (c)}
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_withheld_pct_vs_guarantee_proration_with_reserve_cap
        grounds:
          - calculations.royalty_withheld
          - entities.Tour.fields.royalty_reserve_pct
          - entities.LicenseAgreement.fields.minimum_guarantee_cents
        distinguishing_aspect: |
          Mode (a) — three-input non-linear interaction: per-agreement pct sum vs
          prorated minimum-guarantee sum, then a max, then a cap at
          tour.royalty_reserve_pct. Four knobs (royalty_pct per license,
          minimum_guarantee_cents per license, tour.royalty_reserve_pct, count of
          confirmed engagements for proration) interact through max/min nesting.
          Pinning G=100000_00, license royalty_pct=0.08, min_guarantee=20000_00,
          prorate_count=1 (one engagement currently IN_PERFORMANCE),
          tour.royalty_reserve_pct=0.10:
          pct_part = round_half_up(100000_00 * 0.08) = 8000_00;
          guarantee_part = round_half_up(20000_00 / 1) = 20000_00;
          uncapped = max(8000_00, 20000_00) = 20000_00;
          cap = round_half_up(100000_00 × 0.10) = 10000_00;
          royalty_withheld = min(20000_00, 10000_00) = 10000_00.
          Dropping royalty_reserve_pct to 0 removes the cap; adding a second
          ACTIVE license royalty_pct=0.05 (no guarantee) raises pct_part to
          13000_00 while guarantee_part stays at 20000_00.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "Tour T with royalty_reserve_pct=0.10, market_cooldown_days=30."
            - "Venue V NON_UNION; DateAvail A1 Sep 10-15; Engagement E1 CONFIRMED on A1 (FLAT_RENT 40000_00)."
            - "LicenseAgreement L1: property_code='DINO', royalty_pct=0.08, minimum_guarantee_cents=2000000, starts_on=2026-09-01T00:00:00Z, ends_on=2027-06-30T00:00:00Z, status=ACTIVE."
            - "TicketScale on E1 with 1000 seats sold at 100_00 → G=100000_00."
            - "Engagement reaches IN_PERFORMANCE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "Royalty Tour", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0.10 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Royalty Arena", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_1: $.data.id, avail_1_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_1}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_1_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/license-agreements"
              payload: { property_code: "DINO", licensor_name: "Dino IP LLC", royalty_pct: 0.08, minimum_guarantee_cents: 2000000, starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: $.data.id }
            - call: "POST /tours/${tour_id}/license-agreements/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-scales"
              payload: { tier_label: "GOLD", base_price_cents: 10000, seats_allocated: 2000, tier_rank: 1, on_sale_at: "2026-09-01T00:00:00Z" }
              as: BoxOfficeManager
              captures: { scale_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-sales"
              payload: { ticket_scale_id: "${scale_id}", quantity: 1000 }
              as: BoxOfficeManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/reconcile"
              payload: {}
              as: TourManager
              captures: { settle_id: $.data.id }
          assert:
            - "Settlement.${settle_id}.gross_ticket_cents == 10000000"
            - "Settlement.${settle_id}.royalty_withheld_cents == 1000000"
            - "Settlement.${settle_id}.venue_share_cents == 4000000"
            - "Settlement.${settle_id}.labor_total_cents == 0"
            - "Settlement.${settle_id}.promoter_net_cents == 10000000 - 4000000 - 1000000 - 0 = 5000000"

      - name: family_pack_per_seat_division_rounding_order
        grounds:
          - calculations.family_pack_pricing
          - entities.TicketScale.fields.is_family_pack
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: divide per-seat price
          FIRST with round_half_up, then multiply; versus naive
          round_half_up(base * N / 4). For base_price_cents=9999 (so the
          4-seat bundle is 9999), per_loose_seat = round_half_up(9999/4) = 2500.
          An order of N=7 seats: 1 bundle (9999) + 3 loose (7500) = 17499.
          Naive formula round_half_up(9999*7/4) = round_half_up(17498.25) = 17498.
          The two formulas differ by exactly 1 cent. This order is pinned.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Tour T (ROUTING), Venue V NON_UNION, Avail A1 Sep 10-15, Engagement E1 CONFIRMED."
            - "TicketScale FAM: tier_label='FAMILY4', base_price_cents=9999, seats_allocated=100, tier_rank=2, on_sale_at=2026-09-01T00:00:00Z, is_family_pack=true, is_group_sales_only=true, min_group_size=4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "Family Tour", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "Family Arena", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_1: $.data.id, avail_1_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_1}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_1_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-scales"
              payload: { tier_label: "FAMILY4", base_price_cents: 9999, seats_allocated: 100, tier_rank: 2, on_sale_at: "2026-09-01T00:00:00Z", is_family_pack: true, is_group_sales_only: true, min_group_size: 4 }
              as: BoxOfficeManager
              captures: { scale_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-sales"
              payload: { ticket_scale_id: "${scale_id}", quantity: 7 }
              as: BoxOfficeManager
              captures: { sale_total: $.data.total_cents }
          assert:
            - "sale_total == 17499 (1 bundle at 9999 + 3 loose seats at round_half_up(9999/4)=2500 each = 9999 + 7500 = 17499)"
            - "sale_total != 17498 (the naive round-after-multiply result)"

  # ===========================================================================
  # Rule 3: non_linear_state_machine — different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rigging_plan_revision_cycle_draft_submit_reject_revise_draft
        grounds:
          - state_machines.RiggingPlan
        distinguishing_aspect: |
          RiggingPlan forms a CYCLE: DRAFT → SUBMITTED → REJECTED → DRAFT
          (via /revise) → SUBMITTED again, with revision_no incrementing on
          each revise. The same plan can loop multiple times before approval.
        test_recipe:
          setup:
            - "Tour/Venue/Avail/Engagement CONFIRMED. RiggingPlan P1 with one allocation, in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/rigging-points"
              payload: { label: "A-1", zone: "GRID", max_static_load_kg: 5000, max_dynamic_load_kg: 500 }
              as: VenueBooker
              captures: { point_id: $.data.id }
