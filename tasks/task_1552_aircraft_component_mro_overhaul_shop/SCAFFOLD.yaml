  - { method: POST, path: "/mro/work-orders/{workOrderId}/invoice", description: "Generate work-order invoice (TAT penalty + per-line rounding)", roles: [CustomerServiceRep], code: 201, input: [], output: Invoice, side_effects: ["Invoice ISSUED; Customer.current_exposure_cents += total_cents"] }
  - { method: GET, path: "/mro/invoices/{invoiceId}", description: "Get invoice", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/mro/invoices", description: "Filtered invoice list (reverse of work_order_id/lease_agreement_id/exchange_agreement_id/customer_id)", roles: [ShopManager, CustomerServiceRep, Technician, Inspector, PartsBuyer, Customer], code: 200, input: ["work_order_id?", "lease_agreement_id?", "exchange_agreement_id?", "customer_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/mro/invoices/{invoiceId}/pay", description: "Customer pays exact invoice total", roles: [Customer], code: 200, input: [amount_cents], output: Invoice, side_effects: ["ISSUED->PAID; exposure -= total_cents"] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/mro/_clock/set_current_utc", description: "Set logical clock (ISO8601). Server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock; setting the clock also sweeps FULFILLED exchange agreements past core_due_date + 5 grace days into DEFAULTED with settlement invoice", roles: [ShopManager], code: 200, input: [to_iso8601], output: "{ current_utc: string, defaulted_exchange_agreement_ids: string[] }", side_effects: ["exchange default sweep; exposure updates"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (generic)" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "PartCatalogEntry id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "ComponentUnit id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "WorkOrder id does not exist" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "PartsRequisition id does not exist" }
  - { id: ERR_TEST_CELL_NOT_FOUND, http: 404, condition: "TestCell id does not exist" }
  - { id: ERR_EXCHANGE_NOT_FOUND, http: 404, condition: "ExchangeAgreement id does not exist" }
  - { id: ERR_LEASE_NOT_FOUND, http: 404, condition: "LeaseAgreement id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, unknown field, invalid enum value, or invalid ownership/custody combination on unit registration" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "ComponentUnit serial_number already registered" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid-from transition (booking cancel, directive-compliance, small machines)" }
  - { id: ERR_WORK_ORDER_INVALID_STATE, http: 409, condition: "WorkOrder not in a from-state of the attempted transition (incl. close without invoice)" }
  - { id: ERR_REQUISITION_INVALID_STATE, http: 409, condition: "PartsRequisition not in a from-state of the attempted transition" }
  - { id: ERR_EXCHANGE_INVALID_STATE, http: 409, condition: "ExchangeAgreement not in a from-state of the attempted transition" }
  - { id: ERR_LEASE_INVALID_STATE, http: 409, condition: "LeaseAgreement not ACTIVE, or return before start_date" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "WarrantyClaim not SUBMITTED for review" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Invoice not ISSUED for payment" }
  - { id: ERR_DISCREPANCY_INVALID_STATE, http: 409, condition: "DiscrepancyCard not OPEN for disposition" }
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit custody_status != OFF_SITE at manual work-order induction" }
  - { id: ERR_OPEN_DISCREPANCIES, http: 409, condition: "OPEN DiscrepancyCards remain on the work order" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Inspector X-User-ID equals WorkOrder.technician_user_id" }
  - { id: ERR_AD_COMPLIANCE_INCOMPLETE, http: 403, condition: "Mandatory AD DirectiveCompliance still PENDING at complete-repair" }
  - { id: ERR_BER_SCRAP_ACK_REQUIRED, http: 403, condition: "ber_flag true but scrap_option_ack not true on quote" }
  - { id: ERR_SCRAP_REQUIRES_BER, http: 409, condition: "quote-decline disposition=SCRAP while ber_flag false" }
  - { id: ERR_NO_ACTIVE_TEST_BOOKING, http: 409, condition: "No BOOKED booking covers the current clock for this work order at test-results" }
  - { id: ERR_TEST_CELL_OVERLAP, http: 409, condition: "Half-open booking window overlaps an existing BOOKED window on the same cell" }
  - { id: ERR_LEASE_PERIOD_OVERLAP, http: 409, condition: "Day-closed lease interval shares a day with an ACTIVE lease on the same unit" }
  - { id: ERR_CELL_ATA_UNSUPPORTED, http: 422, condition: "Cell does not support the work order's part ATA chapter" }
  - { id: ERR_UNIT_NOT_LEASABLE, http: 422, condition: "Unit not SHOP-owned SERVICEABLE in custody IN_POOL/ON_LEASE, or end_date < start_date" }
  - { id: ERR_POOL_EMPTY, http: 422, condition: "No eligible pool unit for exchange fulfill (selector fallback)" }
  - { id: ERR_UNIT_OWNER_MISMATCH, http: 422, condition: "Unit owner != work-order customer, or core owner != agreement customer" }
  - { id: ERR_CORE_PART_MISMATCH, http: 422, condition: "Core unit part_id != agreement part_id" }
  - { id: ERR_INVOICE_ALREADY_EXISTS, http: 409, condition: "Work-order invoice already generated" }
  - { id: ERR_WARRANTY_REQUIRES_CLOSED_WO, http: 409, condition: "Original work order not CLOSED at claim creation" }
  - { id: ERR_WARRANTY_LIMIT_EXCEEDED, http: 422, condition: "claim_cycles_used > cycle limit OR claim_months_used > month limit" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Customer X-User-ID does not own the target resource" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "Payment amount_cents != invoice total_cents" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "Customer on credit hold (exposure >= credit limit) at quote or fulfill" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Repair-station accountable manager: configuration, catalog, directives, test cells, clock, warranty review"
    identity: opaque
    exclusive_operations:
      - "POST /mro/customers"
      - "POST /mro/part-catalog"
      - "POST /mro/part-catalog/{id}/directives"
      - "POST /mro/test-cells"
      - "POST /mro/warranty-claims/{claimId}/review"
      - "POST /mro/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: CustomerServiceRep
    description: "Front office: unit registration, work-order intake, quotes, bookings, exchanges, leases, invoicing, close"
    identity: opaque
    exclusive_operations:
      - "POST /mro/units"
      - "POST /mro/work-orders"
      - "POST /mro/work-orders/{workOrderId}/quote"
      - "POST /mro/work-orders/{workOrderId}/close"
      - "POST /mro/test-cells/{id}/bookings"
      - "POST /mro/test-cell-bookings/{bookingId}/cancel"
      - "POST /mro/exchange-agreements (+fulfill)"
      - "POST /mro/lease-agreements (+return)"
      - "POST /mro/work-orders/{workOrderId}/invoice"
    shared_operations: ["all GET endpoints"]
  - name: Technician
    description: "Certificated mechanic: teardown, discrepancy cards, AD/SB compliance, requisitions, test-core receipt"
    identity: opaque
    exclusive_operations:
      - "POST /mro/work-orders/{workOrderId}/teardown-complete"
      - "POST /mro/work-orders/{id}/discrepancies"
      - "POST /mro/discrepancies/{discrepancyId}/disposition"
      - "POST /mro/work-orders/{workOrderId}/directive-compliance"
      - "POST /mro/work-orders/{workOrderId}/complete-repair"
      - "POST /mro/work-orders/{id}/parts-requisitions"
      - "POST /mro/parts-requisitions/{requisitionId}/issue"
      - "POST /mro/exchange-agreements/{agreementId}/core-return"
    shared_operations: ["all GET endpoints"]
  - name: Inspector
    description: "Certificated inspector: ATP test results and 8130 release; MUST differ from the work order's technician (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /mro/work-orders/{workOrderId}/test-results"
      - "POST /mro/work-orders/{workOrderId}/release"
    shared_operations: ["all GET endpoints"]
  - name: PartsBuyer
    description: "Parts sourcing: OEM/PMA source approval and receiving"
    identity: opaque
    exclusive_operations:
      - "POST /mro/parts-requisitions/{requisitionId}/source-approval"
      - "POST /mro/parts-requisitions/{requisitionId}/receive"
    shared_operations: ["all GET endpoints"]
  - name: Customer
    description: "External operator: approves/declines quotes, approves PMA, files warranty claims, pays invoices"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /mro/work-orders/{workOrderId}/quote-approval"
      - "POST /mro/work-orders/{workOrderId}/quote-decline"
      - "POST /mro/parts-requisitions/{requisitionId}/pma-approval"
      - "POST /mro/warranty-claims"
      - "POST /mro/invoices/{invoiceId}/pay"
    shared_operations: ["all GET endpoints (own resources)"]
