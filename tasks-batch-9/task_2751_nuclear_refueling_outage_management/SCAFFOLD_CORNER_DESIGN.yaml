            - "The ledger returns exactly 2 rows, total_count == 2: a COMMIT of 180.00 with reason RWP_APPROVED and a RELEASE of 80.00 with reason RWP_CLOSED_UNDERRUN"
            - "Outage.${o_id}.dose_committed_mrem == 100.00 and dose_budget_remaining_mrem == 4900.00 — the replay is a net, not a last-row-wins read"
            - "Outage.${o_id}.alara_posture == NORMAL — 4900 / 5000 is far above ALARA_RESTRICTED_RATIO"

      - name: schedule_posture_thresholds_at_target_and_at_the_ten_percent_ceiling
        claim_type: threshold
        grounds: ["calculations.outage_schedule_posture.formula", "calculations.outage_schedule_posture.constants", "entities.Outage.fields.schedule_posture"]
        distinguishing_aspect: "Both posture comparisons are inclusive and are exercised exactly on their boundaries with a 100-hour target: projected 100.00 is ON_TRACK, projected 110.00 equals round_half_up(100 * 1.1, 2) and is AT_RISK, and projected 111.00 tips to RECOVERY_REQUIRED."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 with duration_target_hours 100, so the AT_RISK ceiling is exactly 110.00."
            - "Three unlinked root activities are added one at a time; each is a separate component so the projection is simply the longest one so far."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 100, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "P1 exactly on target", planned_start_offset_hours: 0, planned_duration_hours: 100 }
              as: OutagePlanner
              captures: { p1_id: "$.data.id" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { posture_at_target: "$.data.schedule_posture", projected_at_target: "$.data.projected_duration_hours" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "P2 exactly on the ceiling", planned_start_offset_hours: 0, planned_duration_hours: 110 }
              as: OutagePlanner
              captures: { p2_id: "$.data.id" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { posture_at_ceiling: "$.data.schedule_posture", projected_at_ceiling: "$.data.projected_duration_hours" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "P3 one hour past the ceiling", planned_start_offset_hours: 0, planned_duration_hours: 111 }
              as: OutagePlanner
              captures: { p3_id: "$.data.id" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { posture_past_ceiling: "$.data.schedule_posture", projected_past_ceiling: "$.data.projected_duration_hours" }
          assert:
            - "${projected_at_target} == 100.00 and ${posture_at_target} == ON_TRACK — projected exactly equal to target is ON_TRACK"
            - "${projected_at_ceiling} == 110.00 and ${posture_at_ceiling} == AT_RISK — projected exactly equal to target * 1.10 is AT_RISK, not RECOVERY_REQUIRED"
            - "${projected_past_ceiling} == 111.00 and ${posture_past_ceiling} == RECOVERY_REQUIRED"
            - "Outage.${o_id}.critical_path_activity_id == ${p3_id} at the end and is_critical_path is false for ${p1_id} and ${p2_id}"

      - name: pool_admission_variants_diverge_on_identical_pool_state
        claim_type: variant_divergence
        grounds: ["calculations.pool_cell_admission.variants", "complexity_profile.complexity_layers"]
        excluded_because:
          difficulty_instance: pool_headroom_nominal_admits_where_full_core_protected_rejects
          rationale: "That §1.8 dual-variant instance holds pool state and cells_requested identical and flips only `purpose`, showing the delta is exactly full_core_offload_reserve_cells — divergence and selection in one recipe."

      - name: performance_index_variant_selected_per_field
        claim_type: variant_selection
        grounds: ["calculations.outage_performance_review.variants", "entities.Outage.fields.adjusted_performance_index"]
        excluded_because:
          difficulty_instance: performance_index_gross_versus_emergent_adjusted_diverge
          rationale: "That §1.8 dual-variant instance already asserts that outage_performance_index reads the gross variant and adjusted_performance_index reads the emergent-adjusted variant from the same stored data, including the sign flip that zeroes the duration penalty."

      - name: performance_index_weighting_does_not_drift
        claim_type: weighted_scoring
        grounds: ["calculations.outage_performance_review.formula", "calculations.outage_performance_review.constants"]
        excluded_because:
          difficulty_instance: performance_index_gross_versus_emergent_adjusted_diverge
          rationale: "The pinned rounding chain — each variance rounded first, the three weighted products summed unrounded, the subtraction from 100 rounded once — is asserted numerically by that §1.8 instance for both variants, so a separate weight-accumulation claim would repeat it."

      - name: rad_area_and_safety_function_windows_use_opposite_endpoint_rules
        claim_type: interval_merge
        grounds: ["calculations.rad_area_window_occupancy", "calculations.safety_function_oos_capacity"]
        excluded_because:
          difficulty_instance: rad_area_half_open_buffered_window_admits_exact_adjacency
          rationale: "The §1.8 resource_temporal_overlap pair covers both interval semantics: the half-open buffered rad-area window (adjacency admitted, one hundredth earlier rejected) and the CLOSED safety-function window aggregated over distinct train labels."

      - name: alara_ratio_threshold_sits_exactly_on_one_quarter
        claim_type: threshold
        grounds: ["calculations.outage_alara_posture.constants", "entities.Outage.fields.alara_posture"]
        excluded_because:
          difficulty_instance: alara_ratio_exactly_one_quarter_is_restricted
          rationale: "That §1.8 boundary instance asserts the unrounded-quotient comparison at exactly 0.25 (RESTRICTED) against 251/1001 (NORMAL), which is the whole content of the threshold claim for this calculation."

      - name: dose_ledger_release_restores_the_prior_running_total
        claim_type: aggregation
        grounds: ["calculations.outage_dose_ledger", "state_machines.RadiologicalWorkPermit.transitions[APPROVED->VOIDED]"]
        excluded_because:
          difficulty_instance: permit_void_restores_outage_dose_ledger_exactly
          rationale: "The reversal leg of this aggregation is the §1.8 compensating invariant: the void appends a RELEASE equal to committed_dose_mrem and the replay returns dose_committed_mrem and dose_budget_remaining_mrem to their exact pre-approval values."

  # =========================================================================
  - section: validations
    instances:

      - name: shutdown_margin_below_the_floor_rejects_the_create
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SHUTDOWN_MARGIN_INSUFFICIENT]", "calculations.core_load_reactivity_margin"]
        distinguishing_aspect: "A pattern with fresh_assembly_count 20 and cycle_length_mwd_mtu 30000 computes 800 + 240 - 450 = 590.00 pcm, below MIN_SHUTDOWN_MARGIN_PCM 1000. The response is 422 and — because the gate fires before persistence — no CoreLoadPattern row exists afterwards and the parent version has not moved."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING at version 1 with no core load patterns."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
          trigger:
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 30000, fresh_assembly_count: 20, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${err_id} == ERR_SHUTDOWN_MARGIN_INSUFFICIENT"
            - "GET /outages/${o_id}/core-load-patterns returns 0 rows with total_count == 0 — a core that cannot be held subcritical is never persisted"
            - "Outage.${o_id}.version == ${o_v1} — the rejected create did not bump the parent"
            - "A subsequent lock-scope on this outage would still fail the pattern precondition, confirming nothing was stored"

      - name: badge_number_uniqueness_is_scoped_per_outage
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=19]", "errors[ERR_BADGE_NUMBER_TAKEN]", "calculations.outage_badging_rollup"]
        distinguishing_aspect: "The uniqueness predicate is qualified by outage_id and by status == BADGED. Issuing the identical badge_number B-1000 to a worker on a DIFFERENT outage is admitted, and each outage's badged_worker_count rises to 1 independently — a global uniqueness index would reject the second call."
        test_recipe:
          setup:
            - "Two outages, UNIT_1 / 1R24 and UNIT_2 / 2R24, each taking the default required_training_modules of 4."
            - "One worker per outage is driven to BADGE_READY: background_result CLEAR closes branch A, training-completion with modules_completed 4 closes branch B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o1_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_2", designation: "2R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o2_id: "$.data.id" }
            - call: "POST /outages/${o1_id}/supplemental-workers"
              payload: { full_name: "R. Kowalski", craft: "PIPEFITTER", sponsoring_contractor: "Northline Mechanical" }
              as: ContractorCoordinator
              captures: { w1_id: "$.data.id" }
            - call: "POST /outages/${o2_id}/supplemental-workers"
              payload: { full_name: "T. Abiodun", craft: "ELECTRICIAN", sponsoring_contractor: "Northline Mechanical" }
              as: ContractorCoordinator
              captures: { w2_id: "$.data.id" }
            - call: "POST /supplemental-workers/${w1_id}/background-result"
              payload: { outcome: "CLEAR" }
              as: AccessAuthority
            - call: "POST /supplemental-workers/${w1_id}/training-completion"
              payload: { modules_completed: 4 }
              as: AccessAuthority
            - call: "POST /supplemental-workers/${w2_id}/background-result"
              payload: { outcome: "CLEAR" }
              as: AccessAuthority
            - call: "POST /supplemental-workers/${w2_id}/training-completion"
              payload: { modules_completed: 4 }
              as: AccessAuthority
          trigger:
            - call: "POST /supplemental-workers/${w1_id}/badge"
              payload: { badge_number: "B-1000" }
              as: AccessAuthority
              captures: { w1_status: "$.data.status" }
            - call: "POST /supplemental-workers/${w2_id}/badge"
