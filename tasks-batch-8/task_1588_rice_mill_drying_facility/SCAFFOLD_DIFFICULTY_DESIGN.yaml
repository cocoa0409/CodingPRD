  - rule_id: priority_pair_validation_conflict
    instances:
      - name: season_state_beats_spot_cap_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_SEASON_INTAKE_NOT_OPEN]
          - errors[ERR_SPOT_CAP_REACHED]
        distinguishing_aspect: |
          Pair (state, business_fiscal/capacity): a SPOT lot created when the
          season is INTAKE_CLOSED AND the day's spot cap is already exhausted
          fails both checks; the state error ERR_SEASON_INTAKE_NOT_OPEN wins.
        test_recipe:
          setup:
            - "Season with spot_daily_cap 1; one SPOT lot already taken on 2026-08-10 (cap exhausted); season then INTAKE_CLOSED"
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 1 }
              as: MillAdmin
              captures: { s_id: $.data.id }
            - call: "POST /mill/seasons/${s_id}/open-intake"
              payload: {}
              as: MillAdmin
            - call: "POST /mill/growers"
