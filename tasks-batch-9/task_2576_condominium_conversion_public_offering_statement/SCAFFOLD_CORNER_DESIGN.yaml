              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { wc_ok: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-07-21T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /conversion-projects/${proj_id}/warranty-claims"
              payload: { major_component_id: "${mc_id}", defect_description: "second membrane defect", claimed_cost_cents: 400000 }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_warranty: "$.data.error_id" }
            - call: "POST /conversion-projects/${proj_id}/warranty-claims"
              payload: { major_component_id: "${mc_struct}", defect_description: "footing settlement crack", claimed_cost_cents: 400000 }
              as: ConverterSponsor
