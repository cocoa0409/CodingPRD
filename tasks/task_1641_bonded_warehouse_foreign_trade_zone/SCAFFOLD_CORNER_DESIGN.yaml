              captures: { ok2: "$.data.id" }
            - call: "POST /zones/access-events"
              payload: { zone_id: "${z}", badge_id: "${b}", direction: "OUT", occurred_at: "2026-08-10T12:00:00Z" }
              as: GateOfficer
              captures: { err2: "$.data.error_id" }
          assert:
            - "first IN accepted; second consecutive IN -> ERR_GATE_SEQUENCE_VIOLATION"
            - "OUT after IN accepted; second consecutive OUT -> ERR_GATE_SEQUENCE_VIOLATION"
            - "GET /zones/access-events?badge_id=${b} total_count == 2 (only the alternating pair persisted)"

