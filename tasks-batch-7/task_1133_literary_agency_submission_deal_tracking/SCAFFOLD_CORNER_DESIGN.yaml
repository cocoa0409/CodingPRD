            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 80000 }, as: Agent, as_user_id: "${agent1}", captures: { err2: $.data.error_id } }
            - { call: "POST /query-letters/${q1}/reject", payload: {}, as: Agent, as_user_id: "${agent1}" }
            - { call: "GET /agencies/${ag}", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { post2: $.data.posture } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 80000 }, as: Agent, as_user_id: "${agent1}", captures: { q3: $.data.id } }
          assert:
            - "${post1} == INTAKE_PAUSED   # count reached capacity 1 after first intake"
            - "${err2} == ERR_INTAKE_PAUSED   # 409 at the boundary"
            - "${post2} == NORMAL   # reject dropped the count below capacity"
