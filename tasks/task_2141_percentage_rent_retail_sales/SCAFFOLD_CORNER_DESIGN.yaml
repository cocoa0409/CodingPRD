        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[estimate-bill-stale-lease-year]
          - errors[ERR_STALE_LEASE_YEAR_VERSION]
          - entities.LeaseYear.fields.version
        distinguishing_aspect: "A LeaseYear.version captured before an acceptance is stale by the time the estimate is posted, so the estimate-bill returns 412 ERR_STALE_LEASE_YEAR_VERSION and no ESTIMATE charge is created."
        test_recipe:
          setup:
            - "One ACTIVE lease, MONTHLY, ARTIFICIAL breakpoint 40000000, reporting_deadline_days 10, with LeaseYear 1 holding a SUBMITTED September report and a PENDING October report."
            - "The client captured LeaseYear.version before accepting September; accepting it advanced the version."
            - "The clock has been moved to 2026-11-12, past the October due date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Stale LY LLC", trade_name: "StaleShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "9101", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 40000000, billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r1_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r2_id: $.data.id }
            - call: "POST /retail/sales-reports/${r1_id}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "GET /retail/lease-years/${ly_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { ly_v_stale: $.data.version }
            - call: "POST /retail/sales-reports/${r1_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T00:00:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /retail/sales-reports/${r2_id}/estimate-bill"
              payload: { expected_lease_year_version: "${ly_v_stale}" }
              as: LeaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 412 and data.error_id == \"ERR_STALE_LEASE_YEAR_VERSION\""
            - "SalesReport.${r2_id}.status == PENDING and SalesReport.${r2_id}.gross_sales_cents is null"
            - "Lease.${lease_id}.delinquency_strikes == 0"
            - "GET /retail/charges with lease_year_id=${ly_id} returns 0 rows"

      - name: stale_lease_version_on_amendment_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lease-amendment-stale-lease]
          - errors[ERR_STALE_LEASE_VERSION]
          - entities.Lease.fields.version
        distinguishing_aspect: "The version returned at lease creation is stale after activation, so an amendment carrying it returns 412 ERR_STALE_LEASE_VERSION; resending with the current version succeeds and bumps the version again."
        test_recipe:
          setup:
            - "One lease created (version 1) and then activated (version 2), with percentage_rate_bps 600 and a NATURAL breakpoint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Amend LLC", trade_name: "AmendShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "9201", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id, lease_v_create: $.data.version }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "GET /retail/leases/${lease_id}"
              payload: {}
              as: CenterAdmin
              captures: { lease_v_now: $.data.version }
          trigger:
            - call: "POST /retail/leases/${lease_id}/amendments"
              payload: { expected_lease_version: "${lease_v_create}", percentage_rate_bps: 500 }
              as: CenterAdmin
              captures: { err: $.data.error_id }
            - call: "POST /retail/leases/${lease_id}/amendments"
              payload: { expected_lease_version: "${lease_v_now}", percentage_rate_bps: 500 }
              as: CenterAdmin
          assert:
            - "The first amendment returns HTTP 412 with data.error_id == \"ERR_STALE_LEASE_VERSION\" and Lease.${lease_id}.percentage_rate_bps stays 600"
            - "The second amendment returns HTTP 200 and Lease.${lease_id}.percentage_rate_bps == 500"
            - "Lease.${lease_id}.natural_breakpoint_cents == 240000000 and effective_breakpoint_cents == 240000000"
            - "Lease.${lease_id}.version == 3"

      - name: rate_threshold_trigger_at_breakpoint_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.percentage_rent_charge
        excluded_because:
          difficulty_instance: cumulative_sales_exactly_at_breakpoint_bills_nothing
          rationale: "The breakpoint threshold trigger, including its exact-equality edge, is fully asserted by that difficulty instance."

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.SalesReport.SUBMITTED_to_ACCEPTED
        excluded_because:
          difficulty_instance: accept_report_cascades_to_lease_watchlist_depth_five
          rationale: "The five-hop acceptance cascade is asserted hop by hop there, including the ledger rows it appends."

      - name: dual_variant_calculation_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.percentage_rent_charge
        excluded_because:
          difficulty_instance: percentage_rent_billing_mode_divergence_on_lease_year
          rationale: "Both variants are computed on identical data and the 1,200,000 versus 3,200,000 delta is asserted there."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: accept_response_reflects_all_cascaded_state_in_the_same_request
        claim_type: immediate
        grounds:
          - state_machines.SalesReport.SUBMITTED_to_ACCEPTED
          - entities.LeaseYear.fields.cumulative_net_sales_cents
          - entities.Lease.fields.occupancy_cost_ratio_bps
        distinguishing_aspect: "consistency_model is immediate: the accept response already carries status ACCEPTED and net_sales_cents 30000000, and a read issued straight afterwards shows LeaseYear.cumulative_net_sales_cents 30000000 and Lease.occupancy_cost_ratio_bps 333 with no settling delay."
        test_recipe:
          setup:
            - "One ACTIVE lease with annual_base_rent_cents 12000000, MONTHLY, ARTIFICIAL breakpoint 200000000, and a SUBMITTED September report at 30,000,000 gross with no exclusions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Immediate LLC", trade_name: "ImmShop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "9301", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 200000000, billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r1_id: $.data.id }
            - call: "POST /retail/sales-reports/${r1_id}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${tenant_id}"
          trigger:
            - call: "POST /retail/sales-reports/${r1_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "GET /retail/lease-years/${ly_id}"
              payload: {}
              as: LeaseAdministrator
            - call: "GET /retail/leases/${lease_id}"
              payload: {}
              as: LeaseAdministrator
          assert:
            - "The accept response carries data.status == ACCEPTED and data.net_sales_cents == 30000000"
            - "The immediately following lease-year read shows cumulative_net_sales_cents == 30000000 and cumulative_billed_cents == 0"
            - "The immediately following lease read shows ytd_occupancy_cost_cents == 1000000 and occupancy_cost_ratio_bps == 333 and watchlist_status == NORMAL"
