              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { e2_compliance: $.data.compliance_status, e2_rate: $.data.last_take_up_rate_bp, e2_considered: $.data.offers_recorded_count, e2_undoc: $.data.undocumented_decline_count }
          assert:
            - "${initial_compliance} == \"COMPLIANT\" and ${d2_documented} == false and ${quoted_status} == \"QUOTED\""
            - "${e1_considered} == 4 (all four offers have offered_at inside the half-open window), ${e1_rate} == 2500 (10000 * 1 / 4), ${e1_undoc} == 3"
            - "${e1_compliance} == \"SANCTIONED\": 2500 is NOT below the 2500 bp floor so the take-up trigger does not fire, and the insurer nonetheless jumps from COMPLIANT straight to SANCTIONED on the undocumented-decline trigger"
            - "the first bind returns HTTP 409 with ${bind_err} == \"ERR_INSURER_SANCTIONED\" - the quote itself is flawless and the block comes entirely from the insurer's compliance dimension"
            - "${reinstated} == \"COMPLIANT\" and ${kept_undoc} == 3 - REINSTATE does not clear the counter"
            - "the second bind returns HTTP 200 with ${bound_status} == \"ACTIVE\", ${bound_premium} == 64000, ${bound_effective} == \"2026-08-01T00:00:00Z\""
            - "${e2_considered} == 0, ${e2_rate} == 0, ${e2_undoc} == 0 and ${e2_compliance} == \"COMPLIANT\": the counter is recomputed from the window, so an offer-free window zeroes it, and considered == 0 is below MIN_OFFER_SAMPLE so a reported rate of 0 downgrades nothing"

  - rule_id: compensating_invariant
    instances:
      - name: grant_pool_conservation_across_reserve_disburse_and_withdraw
        grounds:
          - calculations.grant_pool_waterfall
          - state_machines.RetrofitGrant.status.FUNDS_RESERVED_to_WITHDRAWN
          - entities.GrantCycle.fields.uncommitted_cents
        distinguishing_aspect: |
          reserved_cents + disbursed_cents + uncommitted_cents must equal total_pool_cents after every
          single write, so a PASS must move 250,000 from reserved to disbursed while leaving
          uncommitted untouched, a withdrawal must return 300,000 from reserved to uncommitted while
          leaving disbursed untouched, and a withdrawal attempt on the already-disbursed grant must be
          refused without moving anything.
