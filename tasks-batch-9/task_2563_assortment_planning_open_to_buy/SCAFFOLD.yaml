  - method: POST
    path: "/otb/category-plans/{id}/approve"
    description: "approve a SUBMITTED plan; computes the receipt budget and drives cascade-B through months, posture, option slots and size curves"
    roles: [PlanningDirector]
    code: 200
    input: ["approval_note?"]
    output: CategoryPlan
    side_effects:
      - "plan.status := APPROVED, plan.approved_by_user_id := X-User-ID, plan.receipt_budget_cents := calculations.plan_receipt_budget"
      - "cascade-B links 2..5: PlanMonth DRAFT -> LOCKED_PLAN with OTB fields, posture recomputation, OptionPlan OPEN -> SLOTTED with slot counts, SizeCurveCell allocation"
      - "increments CategoryPlan.version by 2 (link 1 and link 3), PlanMonth.version by 1 each, OptionPlan.version by 1 each"
