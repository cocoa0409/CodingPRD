# =============================================================================
# Task 1976 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims NOT already covered by §1.8.
# Clock default (no set_current_utc call): 2026-08-01T00:00:00Z.
# Names are unique across the union of §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: asset_create_defaults_orphan_pending_when_holderless
        claim_type: defaults
        grounds: [entities.Asset.fields.orphan_status, entities.Asset.fields.posture]
        distinguishing_aspect: "Asset created without rights_holder_id starts with orphan_status=DILIGENCE_PENDING and posture=ENCUMBERED; with a holder it starts NOT_ORPHAN/CLEAR."
        test_recipe:
          setup: ["RightsHolder H exists"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Default House", holder_kind: LABEL, mfn_floor_cents: 100, contact_verified: true }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
          trigger:
            - call: "POST /rights/assets"
              payload: { title: "No Holder", work_kind: STILL_IMAGE, permitted_media: [PRINT] }
              as: AssetCurator
              captures: { a_orphan: "$.data.orphan_status", a_posture: "$.data.posture" }
            - call: "POST /rights/assets"
              payload: { title: "Has Holder", work_kind: STILL_IMAGE, permitted_media: [PRINT], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { b_orphan: "$.data.orphan_status", b_posture: "$.data.posture" }
          assert:
            - "a_orphan == DILIGENCE_PENDING"
            - "a_posture == ENCUMBERED"
            - "b_orphan == NOT_ORPHAN"
            - "b_posture == CLEAR"

      - name: asset_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rights/assets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AssetCurator
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: clearance_request_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.ClearanceRequest.fields.requested_units, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting requested_units on create yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Holder + asset exist"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Req House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Req Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
          trigger:
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-10-01T00:00:00Z" }
              as: Requester
              as_user_id: req_c_1
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: clearance_request_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.ClearanceRequest.fields.media, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "media=CABLE_TV (not in enum) yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Holder + asset exist"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Enum House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Enum Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
          trigger:
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: CABLE_TV, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-10-01T00:00:00Z", requested_units: 1 }
              as: Requester
              as_user_id: req_c_2
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: diligence_log_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.RightsDiligenceLog]
        distinguishing_aspect: "RightsDiligenceLog has common_fields=false and no PATCH/PUT endpoint exists; the entity carries id + created_at only (no version, no updated_at)."
        test_recipe:
          setup: ["Holder-less asset exists; one diligence log appended"]
          setup_api_calls:
            - call: "POST /rights/assets"
              payload: { title: "Diligence Asset", work_kind: STILL_IMAGE, permitted_media: [PRINT] }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/diligence-logs"
              payload: { search_channel: COPYRIGHT_OFFICE, outcome: NO_RESULT, notes: "first pass" }
              as: AssetCurator
              captures: { log_id: "$.data.id" }
          trigger:
            - call: "GET /rights/assets/${asset_id}/diligence-logs"
              payload: {}
              as: AssetCurator
              captures: { first_id: "$.data[0].id" }
          assert:
            - "first_id == ${log_id}"
            - "Response row has no version field and no updated_at field (common_fields=false)"

      - name: license_computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.License.fields.units_reserved, entities.License.fields.units_consumed_net]
        distinguishing_aspect: "License.units_reserved / units_consumed_* are computed; grant response shows all three at 0 and no client payload can set them."
        test_recipe:
          setup: ["Full chain to granted license"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Computed House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Computed Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 4 }
              as: Requester
              as_user_id: req_c_3
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_1
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_reserved: "$.data.units_reserved", lic_gross: "$.data.units_consumed_gross", lic_net: "$.data.units_consumed_net", lic_fee_status: "$.data.fee_status", lic_lifecycle: "$.data.lifecycle" }
          assert:
            - "lic_reserved == 0 and lic_gross == 0 and lic_net == 0"
            - "lic_fee_status == UNPAID and lic_lifecycle == ACTIVE"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: clearance_advance_from_negotiating_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ClearanceRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "advance is only defined SUBMITTED→HOLDER_REVIEW→NEGOTIATING; calling advance on a NEGOTIATING request fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Request advanced twice into NEGOTIATING"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "State House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "State Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 2 }
              as: Requester
              as_user_id: req_c_4
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
              captures: { req_v3: "$.data.version" }
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v3}" }
              as: ClearanceOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: withdraw_terminal_request_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.ClearanceRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED request is terminal; withdraw on it fails with ERR_INVALID_STATE even by the owner."
        test_recipe:
          setup: ["Request created then denied by officer"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Term House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Term Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-09-01T00:00:00Z", use_end_at: "2026-11-01T00:00:00Z", requested_units: 2 }
              as: Requester
              as_user_id: req_c_5
              captures: { req_id: "$.data.id" }
            - call: "POST /rights/clearance-requests/${req_id}/deny"
              payload: {}
              as: ClearanceOfficer
          trigger:
            - call: "POST /rights/clearance-requests/${req_id}/withdraw"
              payload: {}
              as: Requester
              as_user_id: req_c_5
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: usage_event_on_suspended_license_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.UsageReservation.HELD_to_CONSUMED, "errors[ERR_LICENSE_NOT_ACTIVE]"]
        distinguishing_aspect: "Posting usage while license.lifecycle == SUSPENDED (takedown-lapsed cascade) fails with ERR_LICENSE_NOT_ACTIVE."
        test_recipe:
          setup: ["License granted; takedown filed at default clock (counter_due 2026-08-11); clock lapsed to 2026-08-12 → license SUSPENDED"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Susp House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Susp Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_c_6
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_2
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/takedown-notices"
              payload: { claimant_name: "Susp Claimant" }
              as: AssetCurator
            - call: "POST /rights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AssetCurator
          trigger:
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 1, used_at: "2026-08-11T00:00:00Z" }
              as: IngestionAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_LICENSE_NOT_ACTIVE"

      - name: usage_event_outside_term_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_USAGE_OUTSIDE_TERM]", "validations[priority=8]"]
        distinguishing_aspect: "used_at exactly == term_end_at (exclusive bound) is outside the half-open term and rejected."
        test_recipe:
          setup: ["License ACTIVE, term [2026-08-10, 2026-11-10)"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "TermBound House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "TermBound Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_c_7
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_3
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 1, used_at: "2026-11-10T00:00:00Z" }
              as: IngestionAgent
              captures: { err: "$.data.error_id" }
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 1, used_at: "2026-11-09T23:59:59Z" }
              as: IngestionAgent
              captures: { ok_kind: "$.data.posting_kind" }
          assert:
            - "err == ERR_USAGE_OUTSIDE_TERM  (term_end_at is exclusive)"
            - "ok_kind == POSTED  (one second inside passes)"

      - name: partial_consumption_keeps_reservation_held
        claim_type: side_effect_execution
        grounds: [state_machines.UsageReservation.HELD_to_CONSUMED]
        distinguishing_aspect: "Consuming fewer units than reserved leaves the reservation HELD with units reduced by the event; full consumption flips it to CONSUMED."
        test_recipe:
          setup: ["License ACTIVE unit_limit 10; reservation of 5 units HELD"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Partial House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Partial Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 10 }
              as: Requester
              as_user_id: req_c_8
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_4
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 5, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_id: "$.data.id" }
          trigger:
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 2, used_at: "2026-09-01T00:00:00Z", reservation_id: "${res_id}" }
              as: IngestionAgent
            - call: "GET /rights/usage-reservations/${res_id}"
              payload: {}
              as: IngestionAgent
              captures: { res_status: "$.data.status", res_units: "$.data.units" }
          assert:
            - "res_status == HELD"
            - "res_units == 3  (5 − 2 partial drawdown)"

      - name: usage_overdraw_of_reservation_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_USAGE_OVERDRAW]"]
        distinguishing_aspect: "Event units exceeding the reservation's remaining units fails with ERR_USAGE_OVERDRAW."
        test_recipe:
          setup: ["License ACTIVE unit_limit 10; reservation of 2 HELD"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Overdraw House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Overdraw Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2026-11-10T00:00:00Z", requested_units: 10 }
              as: Requester
              as_user_id: req_c_9
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
              as: ClearanceOfficer
              captures: { req_v2: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v2}" }
              as: ClearanceOfficer
            - call: "POST /rights/clearance-requests/${req_id}/rounds"
              payload: { offered_fee_cents: 200000, accept: true }
              as: Negotiator
              as_user_id: neg_c_5
            - call: "POST /rights/clearance-requests/${req_id}/grant"
              payload: { grant_fee_cents: 200000 }
              as: ClearanceOfficer
              captures: { lic_id: "$.data.id", lic_v: "$.data.version" }
            - call: "POST /rights/licenses/${lic_id}/usage-reservations"
              payload: { units: 2, expected_license_version: "${lic_v}" }
              as: IngestionAgent
              captures: { res_id: "$.data.id" }
          trigger:
            - call: "POST /rights/licenses/${lic_id}/usage-events"
              payload: { units: 3, used_at: "2026-09-01T00:00:00Z", reservation_id: "${res_id}" }
              as: IngestionAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_USAGE_OVERDRAW"

      - name: hold_forfeit_by_clock_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.UsageReservation.HELD_to_FORFEITED, calculations.desk_constants]
        distinguishing_aspect: "A HELD reservation whose hold_expires_at (created + 720h) passes is forfeited by the clock sweep and units_reserved is decremented."
        test_recipe:
          setup: ["License ACTIVE unit_limit 5; reservation of 2 created at default clock 2026-08-01 (expires 2026-08-31)"]
          setup_api_calls:
            - call: "POST /rights/rights-holders"
              payload: { legal_name: "Hold House", holder_kind: LABEL, mfn_floor_cents: 100 }
              as: AssetCurator
              captures: { holder_id: "$.data.id" }
            - call: "POST /rights/assets"
              payload: { title: "Hold Asset", work_kind: FILM_CLIP, permitted_media: [STREAMING], rights_holder_id: "${holder_id}" }
              as: AssetCurator
              captures: { asset_id: "$.data.id" }
            - call: "POST /rights/assets/${asset_id}/clearance-requests"
              payload: { media: STREAMING, territory: NA, use_start_at: "2026-08-10T00:00:00Z", use_end_at: "2027-08-10T00:00:00Z", requested_units: 5 }
              as: Requester
              as_user_id: req_c_10
              captures: { req_id: "$.data.id", req_v: "$.data.version" }
            - call: "POST /rights/clearance-requests/${req_id}/advance"
              payload: { expected_clearance_version: "${req_v}" }
