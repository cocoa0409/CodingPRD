              captures: { fund2_id: $.data.id, fund2_v: $.data.version }
            - call: "POST /lending/libraries/${lib2_id}/patrons"
              payload: { external_card_number: "Q-0", full_name: "Patron Q0", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib2_id}"
              captures: { patq0_id: $.data.id }
            - call: "POST /lending/libraries/${lib2_id}/patrons"
              payload: { external_card_number: "Q-1", full_name: "Patron Q1", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib2_id}"
              captures: { patq1_id: $.data.id }
            - call: "POST /lending/libraries/${lib2_id}/patrons"
              payload: { external_card_number: "Q-2", full_name: "Patron Q2", postal_code: "94301" }
