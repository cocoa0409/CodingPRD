          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o19}", staff_id: "${s_p}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${o19_v1}" }
