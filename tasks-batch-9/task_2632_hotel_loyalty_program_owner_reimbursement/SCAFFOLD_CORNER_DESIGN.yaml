      - name: liability_rounds_to_the_cent_and_solvency_to_four_decimals
        claim_type: precision
        grounds:
          - calculations.point_liability_valuation
          - entities.ProgramFund.fields.solvency_ratio
          - entities.ProgramFund.fields.point_liability_cents
          - endpoints.POST /loyalty/program-fund/breakage-rate
        distinguishing_aspect: |
          The empty ledger is pinned to solvency 999.0 and HEALTHY instead of dividing by zero;
          20000 outstanding points at the default 0.2 breakage value at 9600 cents and 25000 / 9600
          = 2.6041666 truncates to the fourth decimal as 2.6042; and after a 50-point goodwill
          adjustment and a breakage change to 0.35 the liability lands on a true half-cent,
          20050 * 0.39 = 7819.5, which rounds half up to 7820.
        test_recipe:
          setup:
            - "One member with an empty ledger and no purchases; the program fund is untouched."
          setup_api_calls:
            - call: "POST /loyalty/members"
              payload: { email: "pl1@example.com", full_name: "Greta Salo", enrollment_date: "2026-01-14" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { f0_liab: $.data.point_liability_cents, f0_solv: $.data.solvency_ratio, f0_status: $.data.status, f0_breakage: $.data.breakage_rate_pct }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 20000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/program-fund"
              payload: {}
              as: ProgramAuditor
              captures: { f1_out: $.data.outstanding_points, f1_liab: $.data.point_liability_cents, f1_solv: $.data.solvency_ratio, f1_status: $.data.status }
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v: $.data.version }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 50, adjustment_reason: "Odd-lot goodwill top-up.", expected_member_version: "${m_v}" }
              as: MemberCareAgent
              as_user_id: "care-pl-01"
              captures: { adj_points: $.data.points }
            - call: "POST /loyalty/program-fund/breakage-rate"
              payload: { breakage_rate_pct: 0.35 }
              as: ProgramAdministrator
              captures: { f2_breakage: $.data.breakage_rate_pct, f2_liab: $.data.point_liability_cents, f2_solv: $.data.solvency_ratio, f2_status: $.data.status }
          assert:
            - "${f0_liab} == 0, ${f0_solv} == 999.0, ${f0_status} == HEALTHY and ${f0_breakage} == 0.2 - the empty ledger is pinned, not divided by zero"
            - "${f1_out} == 20000 and ${f1_liab} == 9600 - round_half_up(20000 * 600 / 1000 * (1 - 0.2))"
            - "${f1_solv} == 2.6042 - 25000 / 9600 = 2.60416666 rounded half up at the fourth decimal, and ${f1_status} == HEALTHY"
            - "${adj_points} == 50 and Member.${m_id}.point_balance == 20050"
            - "${f2_breakage} == 0.35 and ${f2_liab} == 7820 - round_half_up(20050 * 600 / 1000 * 0.65) = round_half_up(7819.5), the half-cent case"
            - "${f2_solv} == 3.1969 - 25000 / 7820 = 3.19693... and ${f2_status} == HEALTHY"
            - "ProgramFund.last_revalued_at advanced to the logical clock instant of the breakage change"

