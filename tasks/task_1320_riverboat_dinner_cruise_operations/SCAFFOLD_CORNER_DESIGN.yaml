  # Section: endpoints — response envelope, pagination, computed read
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_envelope_and_defaults
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /cruises]"]
        distinguishing_aspect: "GET /cruises returns response_type array with pagination fields; default limit 10, offset 0, total_count and has_more present."
        test_recipe:
          setup: ["One cruise exists"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cruise_id: $.data.id } }
          trigger:
            - { call: "GET /cruises", payload: {}, as: OperationsManager }
          assert:
            - "Response envelope: response_type == array, meta.api_request_id present"
            - "Pagination fields present: total_count == 1, has_more == false with default limit 10 offset 0"

      - name: list_filter_by_status
        claim_type: listing
        grounds: ["endpoints[GET /cruises]"]
        distinguishing_aspect: "GET /cruises?status=CANCELLED returns only cancelled cruises (filter interaction with list)."
        test_recipe:
          setup: ["One SCHEDULED cruise and one weather-cancelled cruise"]
          setup_api_calls:
            - { call: "POST /docks", payload: { name: "Pier 9", parking_capacity: 10 }, as: OperationsManager, captures: { dock_id: $.data.id } }
            - { call: "POST /vessels", payload: { name: "Belle", coast_guard_capacity: 100, home_dock_id: "${dock_id}" }, as: OperationsManager, captures: { vessel_id: $.data.id } }
            - { call: "POST /menu-tiers", payload: { code: "STANDARD", base_price_cents: 8900, galley_load_per_cover: 2.5, bar_package_price_cents: 4200 }, as: OperationsManager, captures: { tier_id: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-10T19:00:00Z", return_at: "2026-08-10T22:00:00Z" }, as: OperationsManager, captures: { cr1: $.data.id } }
            - { call: "POST /cruises", payload: { vessel_id: "${vessel_id}", menu_tier_id: "${tier_id}", depart_at: "2026-08-12T19:00:00Z", return_at: "2026-08-12T22:00:00Z" }, as: OperationsManager, captures: { cr2: $.data.id } }
            - { call: "POST /weather-events", payload: { severity: "CANCELLATION_REQUIRED", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }, as: OperationsManager, captures: { wev: $.data.id } }
