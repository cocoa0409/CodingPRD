  - rule_id: cross_entity_state_dependency
    instances:
      - name: takedown_submit_gated_on_the_designations_own_effective_window
        grounds:
          - state_machines.TakedownSubmission.DRAFT_to_SUBMITTED
          - entities.AuthorizedRepresentative.fields.effective_to
          - validations[priority=30]
          - calculations.marketplace_decision_deadline
        distinguishing_aspect: |
          The TakedownSubmission transition is legal on its own row (DRAFT, claim
          SUBSTANTIATED, package SEALED, enrollment ACTIVE) yet is refused because a
          *different* entity — the acting AuthorizedRepresentative — has an
          effective_to in the past; the identical call by a sibling designation whose
          window covers now succeeds, so the gate is proven to live in the other
          entity and not in the takedown.
        test_recipe:
          setup:
            - "Two DESIGNATED representatives on the same ACTIVE enrollment with disjoint half-open windows: rep1 [2026-08-01, 2026-08-15) and rep2 [2026-08-16, 2027-08-01), both scope SUBMIT_TAKEDOWN"
            - "A takedown sits in DRAFT over a SUBSTANTIATED claim and a SEALED package"
            - "The clock is advanced to 2026-08-20T09:00:00Z, which is outside rep1's window and inside rep2's"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
