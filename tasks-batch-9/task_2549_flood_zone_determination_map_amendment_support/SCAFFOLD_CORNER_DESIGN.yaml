          - validations.priority_10_ERR_STALE_LOAN_FOLIO_VERSION
        distinguishing_aspect: "The OCC guard is exercised across three writes on one folio: the version the client captured at folio creation is already stale after the origination determination, and it is stale by exactly one, which is the smallest detectable amount."
