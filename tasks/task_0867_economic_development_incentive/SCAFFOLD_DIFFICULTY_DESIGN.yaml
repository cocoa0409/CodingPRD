          - entities.Covenant.measurement_end_date
        distinguishing_aspect: |
          Closed-interval semantics on Covenant: a second JOBS covenant whose window
          [2027-12-31, 2028-06-30] shares the boundary date 2027-12-31 with an existing
          JOBS covenant window [2027-01-01, 2027-12-31] is rejected (closed intervals treat
          a shared endpoint as overlap) with ERR_COVENANT_WINDOW_OVERLAP.
        test_recipe:
          setup:
