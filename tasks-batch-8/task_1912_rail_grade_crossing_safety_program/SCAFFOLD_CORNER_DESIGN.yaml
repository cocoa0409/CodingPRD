      - name: work_order_window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.MaintenanceWorkOrder.fields.window_end]
        distinguishing_aspect: "window_end not after window_start is a request-shape error."
        test_recipe:
          setup: ["Locality; ACTIVE crossing; ACTIVE SIGNAL assignment to RAILROAD"]
          setup_api_calls:
            - call: "POST /localities"
              payload: { locality_name: "Invert City", state_code: "KS", contact_email: "pw@inv2.gov" }
              as: ProgramAdministrator
              captures: { loc_id: $.data.id }
