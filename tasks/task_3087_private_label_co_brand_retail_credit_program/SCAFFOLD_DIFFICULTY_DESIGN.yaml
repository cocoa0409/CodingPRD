      assert:
      - PromoPlan.${pp_id}.plan_status == EXPIRED
      - PromoPlan.${pp_id}.subsidy_at_risk_cents == 0
      - PromoPlan.${pp_id}.promo_expires_at == 2027-08-30T00:00:00Z (promo_start_at 2026-09-01 plus 12*30 days)
      - at 363 days advanced the clock reads 2027-08-30T00:00:00Z, so the expiry is inclusive of its own instant
- rule_id: compensating_invariant
  instances:
  - name: settlement_variance_closes_after_corrected_settlement
    grounds:
    - calculations.promo_subsidy_settlement
    - calculations.program_reconciliation
    - entities.SettlementBatch.fields.variance_cents
    - validations[priority=14]
    distinguishing_aspect: The money-conservation invariant is variance_cents == gross_subsidy_cents - net_subsidy_cents and is restored exactly to 0 when a corrected batch re-settles the same plans to their projected value — a cents-conserved quantity, not a unit count.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Two promo plans (120000/12mo, 240000/6mo); batch A settled for [2026-09-01, 2026-10-01); plans remain ACTIVE after finalize.
