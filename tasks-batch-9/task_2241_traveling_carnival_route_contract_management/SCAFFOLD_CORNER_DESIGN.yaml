              payload: {}
              as: LotBoss
              captures: { sv4_c3: "$.data.version" }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_c3c}", route_stop_id: "${stop_c3}", expected_route_stop_version: "${sv4_c3}" }
              as: LotBoss
              captures: { alloc_c3c: "$.data.id" }
          assert:
            - "First reservation: HTTP 201 with footprint_charged_sqft == 5414 and power_charged_amps == 375.0"
            - "Second reservation: HTTP 201 with footprint_charged_sqft == 1925; RouteStop.${stop_c3}.allocated_sqft_used == 7339 — exactly the usable lot, admitted because the gate is <="
            - "Tea Cups at the full lot: HTTP 422 with data.error_id == \"ERR_LOT_CAPACITY_EXCEEDED\" (7339 + 11 > 7339)"
            - "After release: RideAllocation.${alloc_c3b}.status == \"RELEASED\" and RouteStop.${stop_c3}.allocated_sqft_used == 5414, power_amps_used == 375.0"
            - "Tea Cups retried: HTTP 201 with footprint_charged_sqft == 11 (ceil(10 * 1.10)) and power_charged_amps == 5.0; RouteStop.${stop_c3}.allocated_sqft_used == 5425"
            - "GET /route-stops/${stop_c3}/ride-allocations?status=RELEASED returns total_count == 1"

      - name: the_execute_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.Contract.transitions[SENT->EXECUTED]
        excluded_because:
          difficulty_instance: transitive_cascade / contract_execute_cascades_four_hops_to_inspection_slots_and_posture
          rationale: "That §1.8 instance walks all four hops of the execute cascade and asserts every field written at each hop, including the auto inspection order and the recomputed posture."

      - name: both_settlement_variants_produce_their_own_numbers
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.stop_settlement.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_provisional_vs_final_diverge_on_guarantee_basis_and_ride_count
          rationale: "Both variants are computed on identical data there and the delta between PROVISIONAL and FINAL is asserted cent by cent."

      - name: version_increments_on_every_write_including_cascaded_ones
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers
          - entities.RouteStop.fields.version
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_finalize_cascades_three_hops_to_crew_worker_and_route_closure
          rationale: "The finalize cascade there asserts the version of each entity it touches, including rows changed only as a side effect."

  # ===========================================================================
  # SECTION 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_cascaded_field_is_visible_in_the_same_response_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Contract.transitions[SENT->EXECUTED]
          - calculations.stop_compliance_posture
        distinguishing_aspect: |
          The declared consistency model is immediate, so nothing in this domain is allowed to settle lazily:
          the single execute call must leave the contract, its stop, the allocation, the ride and the derived
          posture all in their post-cascade state, readable on the very next request with no retry, no polling
          and no re-computation trigger. The probe reads five different entities straight after execute and
          asserts the cascaded values, including the derived posture that no request ever writes directly.
        test_recipe:
          setup:
            - "Jurisdiction OH, Venue V1, Ride Giant Wheel, Route R1 COMMITTED, stop A PLANNED with one RESERVED allocation, Contract C1 SENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, requires_state_ride_inspection: false, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_m1: "$.data.id" }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_m1}", name: "Franklin County Fairgrounds", city: "Columbus", lot_area_sqft: 100000, power_amps_available: 1200, expected_attendance: 20001, lot_surface: "GRAVEL" }
              as: PlatformAdmin
              captures: { ven_m1: "$.data.id" }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: false }
              as: PlatformAdmin
              captures: { ride_m1: "$.data.id" }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_m1: "$.data.id" }
            - call: "POST /route-stops"
              payload: { route_id: "${route_m1}", venue_id: "${ven_m1}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_m1: "$.data.id", sv_m1: "$.data.version" }
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_m1}", counterparty_name: "Franklin County Ag Society", revenue_split_pct_operator: 65, guarantee_cents: 900000, ride_minimum_count: 1, settlement_basis: "SPLIT_ONLY" }
              as: ContractNegotiator
              captures: { con_m1: "$.data.id" }
            - call: "POST /routes/${route_m1}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${con_m1}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_m1}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_m1}", route_stop_id: "${stop_m1}", expected_route_stop_version: "${sv_m1}" }
              as: LotBoss
              captures: { alloc_m1: "$.data.id" }
          trigger:
            - call: "POST /contracts/${con_m1}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
              captures: { st_m1: "$.data.status" }
            - call: "GET /route-stops/${stop_m1}"
              payload: {}
              as: GeneralManager
              captures: { stopst_m1: "$.data.status" }
            - call: "GET /ride-allocations/${alloc_m1}"
              payload: {}
              as: GeneralManager
              captures: { allst_m1: "$.data.status" }
            - call: "GET /rides/${ride_m1}"
              payload: {}
              as: GeneralManager
              captures: { ridest_m1: "$.data.status" }
            - call: "GET /route-stops/${stop_m1}/readiness"
              payload: {}
              as: GeneralManager
              captures: { post_m1: "$.data.compliance_posture" }
          assert:
            - "The execute response itself already carries status == \"EXECUTED\" and executed_by_user_id == \"user-gm-1\""
            - "First read after execute: RouteStop.${stop_m1}.status == \"CONFIRMED\" — no second call was needed to settle it"
            - "RideAllocation.${alloc_m1}.status == \"COMMITTED\" and Ride.${ride_m1}.status == \"ASSIGNED\" on their first reads"
            - "Readiness on its first read: compliance_posture == \"PERMIT_HOLD\", blocking_error_id == \"ERR_PERMIT_NOT_APPROVED\", committed_ride_count == 1, ride_minimum_required == 1"
            - "Repeating all four reads returns byte-identical data — nothing converges late"
