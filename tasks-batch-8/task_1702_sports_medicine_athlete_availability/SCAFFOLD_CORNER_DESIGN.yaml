scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: create_team_applies_defaults
        claim_type: defaults
        grounds: [entities.Team.fields.hipaa_mode, entities.Team.fields.acwr_variant, entities.Team.fields.current_utc]
        distinguishing_aspect: "Omitting optional hipaa_mode/acwr_variant applies defaults STRICT and ROLLING; current_utc initialized to the fixed default 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id, hipaa: $.data.hipaa_mode, variant: $.data.acwr_variant, clock: $.data.current_utc }
          trigger: []
          assert:
            - "Team.${t_id}.hipaa_mode == STRICT (default applied)"
            - "Team.${t_id}.acwr_variant == ROLLING (default applied)"
            - "Team.${t_id}.current_utc == 2026-08-01T00:00:00Z (fixed startup default, not wall clock)"

      - name: create_athlete_initializes_computed_fields
        claim_type: computed_field_initialization
        grounds: [entities.Athlete.fields.availability_tier, entities.Athlete.fields.load_flag, entities.Athlete.fields.roster_status]
        distinguishing_aspect: "New athlete starts roster_status ACTIVE, availability_tier FULL (no open cases), load_flag NONE, ACWR null."
        test_recipe:
          setup: ["Team exists"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id, tier: $.data.availability_tier, flag: $.data.load_flag, ratio: $.data.acute_chronic_workload_ratio, roster: $.data.roster_status }
          assert:
            - "Athlete.${a_id}.roster_status == ACTIVE"
            - "Athlete.${a_id}.availability_tier == FULL"
            - "Athlete.${a_id}.load_flag == NONE"
            - "Athlete.${a_id}.acute_chronic_workload_ratio is null"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Athlete.fields.position, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /athletes omitting required 'position' -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Team exists"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_INVALID_REQUEST (missing required position)"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.InjuryCase.fields.surface, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /injury-cases with surface=SAND (not in enum) -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Team; athlete; diagnosis code; clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
          trigger:
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "SAND", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_INVALID_REQUEST (surface enum violation)"

      - name: get_nonexistent_resource_returns_not_found
        claim_type: not_found
        grounds: [errors.ERR_NOT_FOUND, "endpoints[GET /sports-med/athletes/{athleteId}]"]
        distinguishing_aspect: "GET on a well-formed but non-existent athlete UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /sports-med/athletes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TeamAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_NOT_FOUND (404)"

      - name: injury_case_snapshots_immune_to_diagnosis_code_edit
        claim_type: computed_fields
        grounds: [entities.InjuryCase.fields.severity_class_snapshot, entities.InjuryCase.fields.is_concussion_snapshot]
        distinguishing_aspect: "severity_class_snapshot / is_concussion_snapshot are copied at intake from DiagnosisCode and never re-read; they drive the RTP gate even though DiagnosisCode is configuration."
        test_recipe:
          setup: ["Team; athlete; SEVERE concussion diagnosis code; clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "QB", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S06.0X1A", body_region: "HEAD_NECK", severity_class: "SEVERE", is_concussion: true }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
          trigger:
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id, sev: $.data.severity_class_snapshot, conc: $.data.is_concussion_snapshot }
          assert:
            - "InjuryCase.${case_id}.severity_class_snapshot == SEVERE (copied at intake)"
            - "InjuryCase.${case_id}.is_concussion_snapshot == true (copied at intake)"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: start_rehab_from_open_succeeds
        claim_type: valid_transition
        grounds: [state_machines.InjuryCase.OPEN_to_REHAB]
        distinguishing_aspect: "Case in OPEN with an is_current status entry transitions to REHAB on start-rehab."
        test_recipe:
          setup: ["Team; athlete; OPEN case with one status entry; clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-01", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
          trigger:
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
              captures: { st: $.data.status }
          assert:
            - "InjuryCase.${case_id}.status == REHAB"

      - name: close_from_open_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.InjuryCase.CLEARED_to_CLOSED, errors.ERR_CASE_NOT_CLEARED]
        distinguishing_aspect: "close on an OPEN case (not CLEARED) is rejected with ERR_CASE_NOT_CLEARED; no side effects fire."
        test_recipe:
          setup: ["Team; athlete; OPEN case; clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /sports-med/injury-cases/${case_id}/close"
              payload: {}
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_CASE_NOT_CLEARED"
            - "InjuryCase.${case_id}.status == OPEN (unchanged)"

      - name: treatment_plan_suspend_resume_cycle
        claim_type: valid_transition
        grounds: [state_machines.TreatmentPlan.ACTIVE_to_SUSPENDED, state_machines.TreatmentPlan.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Plan cycles ACTIVE -> SUSPENDED -> ACTIVE; suspension_reason set on suspend and cleared on resume."
        test_recipe:
          setup: ["Team; athlete; OPEN case; ACTIVE plan; clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-08-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.5", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/treatment-plans"
              payload: { injury_case_id: "${case_id}", title: "p", planned_sessions_per_week: 3, estimated_duration_weeks: 3 }
              as: MedicalStaff
              captures: { plan_id: $.data.id }
            - call: "POST /sports-med/treatment-plans/${plan_id}/activate"
              payload: {}
              as: MedicalStaff
          trigger:
            - call: "POST /sports-med/treatment-plans/${plan_id}/suspend"
              payload: { reason: "illness" }
              as: MedicalStaff
              captures: { st1: $.data.status, rsn: $.data.suspension_reason }
            - call: "POST /sports-med/treatment-plans/${plan_id}/resume"
              payload: {}
              as: MedicalStaff
              captures: { st2: $.data.status, rsn2: $.data.suspension_reason }
          assert:
            - "st1 == SUSPENDED and suspension_reason == illness"
            - "st2 == ACTIVE and suspension_reason cleared (null)"

      - name: advance_from_suspended_concussion_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.RTPProtocol.IN_PROGRESS_to_SUSPENDED_CONCUSSION, errors.ERR_PROTOCOL_NOT_ADVANCEABLE]
        distinguishing_aspect: "A concussion case whose latest entry has symptom_free=false auto-suspends the protocol; advances are then rejected with ERR_PROTOCOL_NOT_ADVANCEABLE until a symptom_free entry resumes it."
        test_recipe:
          setup: ["Team; athlete; concussion case in RTP; protocol IN_PROGRESS at stage 1; clock 2026-08-10"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "QB", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S06.0X1A", body_region: "HEAD_NECK", severity_class: "MINOR", is_concussion: true }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-02", designation: "OUT", symptom_free: false, functional_test_score: 30 }
              as: MedicalStaff
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/treatment-plans"
              payload: { injury_case_id: "${case_id}", title: "p", planned_sessions_per_week: 3, estimated_duration_weeks: 3 }
              as: MedicalStaff
              captures: { plan_id: $.data.id }
            - call: "POST /sports-med/treatment-plans/${plan_id}/activate"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/rtp-protocols"
              payload: { injury_case_id: "${case_id}", total_stages: 4 }
              as: MedicalStaff
              captures: { proto_id: $.data.id, pv0: $.data.version }
            # advance to stage 1 with a symptom_free entry (concussion floor: base2+conc1=3 days, floor 3; 08-02->08-06 = 4 days OK)
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-06", designation: "LIMITED", symptom_free: true, functional_test_score: 85 }
              as: MedicalStaff
            - call: "POST /sports-med/rtp-protocols/${proto_id}/advances"
              payload: { expected_protocol_version: "${pv0}" }
              as: MedicalStaff
            # now a symptom flare: symptom_free=false entry -> protocol auto-suspends
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-10", designation: "OUT", symptom_free: false, functional_test_score: 50 }
              as: MedicalStaff
            - call: "GET /sports-med/rtp-protocols/${proto_id}"
              payload: {}
              as: MedicalStaff
              captures: { proto_status: $.data.status, pv_now: $.data.version }
          trigger:
            - call: "POST /sports-med/rtp-protocols/${proto_id}/advances"
              payload: { expected_protocol_version: "${pv_now}" }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "RTPProtocol.${proto_id}.status == SUSPENDED_CONCUSSION (auto-set by the symptom_free=false entry)"
            - "trigger returns error_id ERR_PROTOCOL_NOT_ADVANCEABLE (advance blocked while suspended)"

      - name: concussion_floor_fires_before_composed_gate
        claim_type: precondition_enforcement
        grounds: ["calculations.rtp_stage_readiness", "errors.ERR_CONCUSSION_MIN_DAYS"]
        distinguishing_aspect: "For a MINOR concussion (composed min-days = base2+concussion1 = 3, hard floor = 3), an advance at day 2 breaches the hard floor and yields ERR_CONCUSSION_MIN_DAYS (floor evaluated first), distinguishing it from a generic ERR_READINESS_NOT_MET."
        test_recipe:
          setup: ["Team; athlete; MINOR concussion case progressed to RTP; protocol total_stages 4 created 2026-08-02 (stage 0 entered 08-02); a ready entry on 2026-08-04 (symptom_free, score 90); clock 2026-08-04 -> days_in_stage = 2"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "WR", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S06.0X0A", body_region: "HEAD_NECK", severity_class: "MINOR", is_concussion: true }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-02", designation: "OUT", symptom_free: false, functional_test_score: 30 }
              as: MedicalStaff
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/treatment-plans"
              payload: { injury_case_id: "${case_id}", title: "p", planned_sessions_per_week: 3, estimated_duration_weeks: 3 }
              as: MedicalStaff
              captures: { plan_id: $.data.id }
            - call: "POST /sports-med/treatment-plans/${plan_id}/activate"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/rtp-protocols"
              payload: { injury_case_id: "${case_id}", total_stages: 4 }
              as: MedicalStaff
              captures: { proto_id: $.data.id, pv0: $.data.version }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-04", designation: "LIMITED", symptom_free: true, functional_test_score: 90 }
              as: MedicalStaff
          trigger:
            - call: "POST /sports-med/rtp-protocols/${proto_id}/advances"
              payload: { expected_protocol_version: "${pv0}" }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_CONCUSSION_MIN_DAYS (days_in_stage 2 < hard floor 3 for a concussion case; floor evaluated before composed gate)"
            - "RTPProtocol.${proto_id}.current_stage_index == 0 (no mutation)"

      - name: terminal_state_lockdown_closed_case
        claim_type: terminal_state_lockdown
        grounds: [state_machines.InjuryCase, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "A CLOSED case rejects further transitions (start-rehab, mark-long-term) with a state error."
        test_recipe:
          setup: ["Team; athlete; case fully progressed to CLEARED then CLOSED (no open plans/claims); clock set"]
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "RB", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.2", body_region: "KNEE", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-02", surface: "TURF", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-02", designation: "OUT", symptom_free: false, functional_test_score: 30 }
              as: MedicalStaff
              as_user_id: "med-1"
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/treatment-plans"
