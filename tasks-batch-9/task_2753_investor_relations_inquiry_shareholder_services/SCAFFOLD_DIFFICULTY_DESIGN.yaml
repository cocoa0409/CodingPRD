              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ev_id: "$.data.id" }
            - call: "POST /roadshow-events/${ev_id}/open-requests"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${p1_id}", requested_slot_start: "2026-09-01T13:00:00Z", requested_slot_end: "2026-09-01T13:30:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
