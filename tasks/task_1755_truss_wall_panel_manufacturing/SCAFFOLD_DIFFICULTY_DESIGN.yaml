            - { call: "POST /plant/cranes", payload: { crane_code: "CR-HEAVY", capacity_lbs: 30000, crane_class: "HEAVY", hourly_rate_cents: 20000 }, as: PlantManager, captures: { craneh: $.data.id, craneh_v: $.data.version } }
