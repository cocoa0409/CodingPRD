              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/commercial-deals"
              payload: { sponsor_name: "Sponsor A", gross_value_cents: 100000, basis: "GROSS_BASIS", exclusivity_start: "2027-01-01T00:00:00Z", exclusivity_end: "2027-03-31T00:00:00Z" }
              as: CommitteeAdmin
