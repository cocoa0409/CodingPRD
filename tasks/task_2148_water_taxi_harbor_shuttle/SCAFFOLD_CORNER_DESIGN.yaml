  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_effect_is_readable_immediately_after_the_patch_returns
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.ServiceDay.NORMAL_to_SUSPENDED", "state_machines.Trip.SCHEDULED_to_CANCELLED"]
        distinguishing_aspect: |
          The consistency model is immediate: the very next reads after the suspending PATCH already show the
          trip CANCELLED, the slot VOIDED and the dock accrual back at 0, with no second call needed to settle
          the denormalised fields.
