      - name: occ_stale_version_layer
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[redemption-create-stale-account]', 'errors[ERR_STALE_ACCOUNT_VERSION]']
        excluded_because:
          difficulty_instance: compensating_invariant / confirm_then_reverse_conserves_consumed_lot_points
          rationale: "OCC stale-version behavior on /redemptions is fully exercised by §1.9 errors.stale_account_version_on_redemption_create plus the version-advancement asserts in the §1.8 redemption instances; the breadth OCC corner is covered there."

      - name: cascade_signup_grant_layer
        claim_type: cascading_side_effects
        grounds: [calculations.signup_bonus_progress]
        excluded_because:
          difficulty_instance: transitive_cascade / post_drives_qualifying_spend_then_signup_grant_then_balance_depth3
          rationale: "The 3-level cascade (post -> qualifying spend -> signup grant -> balance) is the named §1.8 instance."

      - name: tier_threshold_promotion_layer
        claim_type: rate_threshold_triggers
        grounds: [entities.CardProduct.fields.tier_thresholds, entities.CardAccount.fields.current_tier_index]
        excluded_because:
          difficulty_instance: combinatorial_formula / three_input_blend_category_quarterly_cap_tier_mode_a
          rationale: "Tier-threshold rate change is exercised by the §1.8 combinatorial instance and the §1.9 tier-promotion bubble-up instance."

      - name: derived_balance_reconciliation_after_refund
        claim_type: derived_field_reconciliation
        grounds: [entities.CardAccount.fields.annual_spend_cents, entities.CardAccount.fields.current_tier_index]
        distinguishing_aspect: "Refunding a POSTED txn that had promoted the account to tier 1 decrements annual_spend_cents and re-derives current_tier_index back to 0 (demotion)."
        test_recipe:
          setup: ["Product tier1 mult 150 at >=100000; account promoted to tier 1 by a single 100000 POSTED txn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Tier Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 365, tier_thresholds: [{ min_annual_spend_cents: 100000, tier_multiplier_bps: 150 }], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { tier_before: $.data.current_tier_index }
          trigger:
            - call: "POST /transactions/${txn_id}/refund"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Before refund: CardAccount.${acct_id}.current_tier_index == 1 and annual_spend_cents == 100000"
            - "After refund: CardAccount.${acct_id}.current_tier_index == 0 and annual_spend_cents == 0"

  # =====================================================================
  # Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: post_balance_visible_in_same_response
        claim_type: immediate
        grounds: [endpoints, entities.CardAccount.fields.points_balance]
        distinguishing_aspect: "Immediate consistency: after POST /transactions/{id}/post, an immediate GET /accounts/{id} reflects the new points_balance with no lag."
        test_recipe:
          setup: ["ACTIVE account; one PENDING OTHER txn of 100000 cents."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
              captures: { posted_pts: $.data.earned_points }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Transaction.${txn_id}.earned_points == 1000 and CardAccount.${acct_id}.points_balance == 1000 in the immediate GET"
