# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Natural Gas Meter Set & Service Line Installation
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: builder_creation_applies_defaults
        claim_type: creation_and_defaults
        grounds: [entities.Builder, "endpoints[POST /builders]"]
        distinguishing_aspect: "A builder created with only the three required inputs gets status ACTIVE, version 1, server-minted UUID id, and ISO8601 created_at."
        test_recipe:
          setup: ["empty database; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id, b_status: $.data.status, b_version: $.data.version }
          assert:
            - "HTTP 201; Builder.${b_id}.status == ACTIVE (default applied)"
            - "Builder.${b_id}.version == 1 and created_at is populated by the server"
            - "id is a bare UUID with no type prefix"

      - name: application_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.ServiceApplication.fields.pressure_class_requested, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pressure_class_requested accepts only LOW|MEDIUM; 'HIGH' is rejected at creation with 400."
        test_recipe:
          setup: ["builder exists"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", pressure_class_requested: "HIGH", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 ERR_INVALID_REQUEST (invalid enum member)"
            - "no ServiceApplication row created: GET /service-applications?builder_id=${b_id} → total_count == 0"

      - name: load_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.ApplianceLoad.fields.btuh_input_rating, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /appliance-loads without required btuh_input_rating fails 400; each required input (service_application_id, appliance_type, quantity, btuh_input_rating) is enforced."
        test_recipe:
          setup: ["builder + DRAFT application"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /appliance-loads"
              payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1 }
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 ERR_INVALID_REQUEST naming the missing field"
            - "no ApplianceLoad persisted: GET /appliance-loads?service_application_id=${app_id} → total_count == 0"

      - name: meter_set_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_METER_SET_NOT_FOUND]", "endpoints[GET /meter-sets/{id}]"]
        distinguishing_aspect: "Reading a random UUID yields the entity-specific 404, not a generic 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /meter-sets/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: NewBusinessRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_METER_SET_NOT_FOUND"

      - name: builder_system_fields_input_ignored
        claim_type: system_fields_ignored
        grounds: [entities.Builder, "endpoints[POST /builders]"]
        distinguishing_aspect: "Client-supplied id/version/created_at are ignored: server mints its own id and version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /builders"
              payload: { id: "99999999-8888-7777-6666-555555555555", version: 42, created_at: "1999-01-01T00:00:00Z", company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id, b_version: $.data.version }
          assert:
            - "Builder id != 99999999-8888-7777-6666-555555555555 (server-minted)"
            - "version == 1 (client-supplied 42 ignored); created_at reflects server time"

      - name: ciac_payment_immutable_event
        claim_type: immutability
        grounds: [entities.CIACPayment]
        distinguishing_aspect: "CIACPayment has common_fields: false — rows carry id + created_at only, no version/updated_at, and no PATCH/DELETE endpoint exists for the resource."
        test_recipe:
          setup:
            - "application CIAC_PENDING with invoice ISSUED amount_due 446203 (1 load, 200 ft, 1 crossing)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 200, crossings: [{ surface_type: ASPHALT, length_ft: 12.0, width_ft: 3.0 }], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - { call: "POST /main-extensions/${me_id}/accept-quote", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - call: "GET /ciac-invoices?main_extension_id=${me_id}"
              payload: {}
              as: BillingClerk
              as_user_id: "clerk-b"
              captures: { ci_id: "$.data[0].id" }
          trigger:
            - call: "POST /ciac-invoices/${ci_id}/payments"
              payload: { amount_cents: 100000, method: "CARD" }
              as: BillingClerk
              as_user_id: "clerk-b"
              captures: { pay_id: $.data.id }
          assert:
            - "CIACPayment.${pay_id} exposes id, created_at, ciac_invoice_id, direction == PAYMENT, amount_cents == 100000, method == CARD, recorded_by_user_id == clerk-b"
            - "CIACPayment.${pay_id} exposes NO version and NO updated_at field (append-only)"
            - "partial payment leaves invoice PARTIALLY_PAID with balance_due_cents == 346203"

      - name: load_with_unknown_application_not_found
        claim_type: fk_integrity
        grounds: [entities.ApplianceLoad.fields.service_application_id, "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "A child row referencing a non-existent parent FK is rejected with the parent's 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /appliance-loads"
              payload: { service_application_id: "11111111-2222-3333-4444-555555555555", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }
              as: Builder
              as_user_id: "11111111-2222-3333-4444-555555555555"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 ERR_APPLICATION_NOT_FOUND (FK target validated before any write)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancelled_application_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceApplication.ANY_NON_TERMINAL_to_CANCELLED, "errors[ERR_APPLICATION_TERMINAL]"]
        distinguishing_aspect: "From CANCELLED no further transition is possible: a second cancel returns 409 ERR_APPLICATION_TERMINAL and nothing else mutates."
        test_recipe:
          setup: ["builder + DRAFT application cancelled once"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /service-applications/${app_id}/cancel", payload: {}, as: Builder, as_user_id: "${b_id}" }
          trigger:
            - call: "POST /service-applications/${app_id}/cancel"
              payload: {}
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second cancel → HTTP 409 ERR_APPLICATION_TERMINAL"
            - "ServiceApplication.${app_id}.status remains CANCELLED; version unchanged by the rejected call"

      - name: confirm_load_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceApplication.SUBMITTED_to_LOAD_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm-load is only defined from SUBMITTED; calling it on a DRAFT application is an invalid-from rejection with no side effects."
        test_recipe:
          setup: ["builder + DRAFT application with one load"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
          trigger:
            - call: "POST /service-applications/${app_id}/confirm-load"
              payload: {}
              as: NewBusinessRep
              as_user_id: "rep-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 ERR_INVALID_STATE"
            - "ServiceApplication.${app_id}.status remains DRAFT and loads remain editable (PATCH of the load still succeeds afterwards)"

      - name: initial_states_pinned
        claim_type: initial_state
        grounds: [state_machines.ServiceApplication, state_machines.CrewBooking, state_machines.Permit]
        distinguishing_aspect: "New entities start in their declared initial states: application DRAFT, crew booking REQUESTED, permit DRAFT, meter set PLANNED, turn-on SCHEDULED."
        test_recipe:
          setup: ["builder + application + crew exist"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id, app_status: $.data.status }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: GENERAL, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 660, scope: SERVICE_INSTALL }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_status: $.data.status }
            - call: "POST /permits"
              payload: { service_application_id: "${app_id}", permit_type: EASEMENT, jurisdiction: "County", crossings: [] }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { p_status: $.data.status }
          assert:
            - "application created in DRAFT; crew booking created in REQUESTED; permit created in DRAFT"
            - "EASEMENT permit with empty crossings is legal and permit_fee_cents == 7500 (filing fee only)"

      - name: hold_gate_blocks_child_writes
        claim_type: guarded_transition
        grounds: [state_machines.ServiceApplication, "validations[priority=6]", "errors[ERR_APPLICATION_ON_HOLD]"]
        distinguishing_aspect: "The parallel hold axis gates ALL child mutations: while HELD_BY_BUILDER, creating an appliance load is rejected with ERR_APPLICATION_ON_HOLD even though the load write would otherwise be legal in DRAFT."
        test_recipe:
          setup: ["builder + DRAFT application; hold placed by the builder"]
          setup_api_calls:
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /service-applications/${app_id}/hold", payload: { reason: "customer financing" }, as: Builder, as_user_id: "${b_id}" }
          trigger:
            - call: "POST /appliance-loads"
              payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
            - { call: "POST /service-applications/${app_id}/resume", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - call: "POST /appliance-loads"
              payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }
              as: Builder
              as_user_id: "${b_id}"
              captures: { load_id: $.data.id }
          assert:
            - "while HELD_BY_BUILDER: HTTP 409 ERR_APPLICATION_ON_HOLD"
            - "hold did not change spine status (still DRAFT); hold_status == HELD_BY_BUILDER"
            - "after resume: identical load POST succeeds with 201"

      - name: inspection_fail_reschedule_cycle
        claim_type: cyclic_transition
        grounds: [state_machines.Inspection.COMPLETED_FAIL_to_SCHEDULED, state_machines.Inspection.SCHEDULED_to_COMPLETED_PASS]
        distinguishing_aspect: "Failed inspections re-enter SCHEDULED via reschedule with a revalidated window, then can complete PASS — the fail/reinspect loop on the Inspection entity."
        test_recipe:
          setup: ["DRAFT application; inspector with FINAL_SAFETY cert; inspection 2026-08-12 [540,600) SCHEDULED then recorded FAIL"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "9 Oak Ave", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp Lee", certifications: [FINAL_SAFETY] }
              as: SystemAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /inspections"
              payload: { service_application_id: "${app_id}", inspector_id: "${insp_id}", inspection_type: FINAL_SAFETY, inspection_date: "2026-08-12", start_minute: 540, end_minute: 600 }
              as: PermitCoordinator
              as_user_id: "perm-1"
              captures: { inspn_id: $.data.id }
            - { call: "POST /inspections/${inspn_id}/record-result", payload: { result: FAIL, notes: "venting defect" }, as: Inspector, as_user_id: "${insp_id}" }
          trigger:
            - { call: "POST /inspections/${inspn_id}/reschedule", payload: { inspection_date: "2026-08-13", start_minute: 600, end_minute: 660 }, as: PermitCoordinator, as_user_id: "perm-1" }
            - { call: "POST /inspections/${inspn_id}/record-result", payload: { result: PASS, notes: "rework verified" }, as: Inspector, as_user_id: "${insp_id}" }
          assert:
            - "after FAIL: status was COMPLETED_FAIL (non-terminal)"
            - "after reschedule: SCHEDULED with inspection_date == 2026-08-13 and window [600,660)"
            - "after second record-result: COMPLETED_PASS (terminal)"

      - name: gis_reject_resubmit_cycle
        claim_type: cyclic_transition
        grounds: [state_machines.GISAsBuilt.SUBMITTED_to_REJECTED, state_machines.GISAsBuilt.REJECTED_to_SUBMITTED, state_machines.GISAsBuilt.SUBMITTED_to_VALIDATED]
        distinguishing_aspect: "GIS as-built loops SUBMITTED→REJECTED→SUBMITTED→VALIDATED; resubmit carries corrected depth which then passes the 18-inch code check."
        test_recipe:
          setup: ["application ENERGIZED (zero-CIAC happy path through turn-on + energize); GIS record created with depth 16.0 then rejected by analyst"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - call: "POST /appliance-loads"
              payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }
              as: Builder
              as_user_id: "${b_id}"
              captures: { load_1: $.data.id }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /main-extensions"
              payload: { service_application_id: "${app_id}", design_footage_ft: 100, crossings: [], rock_excavation_expected: false }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { me_id: $.data.id }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - { call: "POST /main-extensions/${me_id}/accept-quote", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - call: "POST /field-crews"
              payload: { crew_name: "Crew A", specialty: SERVICE_LINE, daily_capacity_minutes: 480 }
              as: SystemAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 540, end_minute: 1020, scope: SERVICE_INSTALL }
              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_id: $.data.id }
            - { call: "POST /crew-bookings/${bk_id}/confirm", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /service-applications/${app_id}/schedule-construction", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - { call: "POST /crew-bookings/${bk_id}/complete", payload: {}, as: FieldSupervisor, as_user_id: "sup-1" }
            - call: "POST /meter-sets"
              payload: { service_application_id: "${app_id}" }
              as: MeterTechnician
              as_user_id: "tech-1"
              captures: { ms_id: $.data.id }
            - { call: "POST /meter-sets/${ms_id}/size", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /meter-sets/${ms_id}/mark-ordered", payload: { serial_number: "M-9001" }, as: MeterTechnician, as_user_id: "tech-1" }
            - { call: "POST /meter-sets/${ms_id}/install", payload: {}, as: MeterTechnician, as_user_id: "tech-1" }
            - call: "POST /purge-leak-tests"
              payload: { meter_set_id: "${ms_id}", purge_duration_min: 10, test_pressure_psi: 15.0, test_duration_min: 60, observed_pressure_drop_psi: 0.200 }
              as: MeterTechnician
              as_user_id: "tech-1"
              captures: { plt_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Insp Ray", certifications: [PRESSURE_TEST] }
              as: SystemAdmin
              captures: { insp_id: $.data.id }
            - { call: "POST /purge-leak-tests/${plt_id}/certify", payload: {}, as: Inspector, as_user_id: "${insp_id}" }
            - call: "POST /turn-on-events"
              payload: { service_application_id: "${app_id}", appliance_load_id: "${load_1}" }
              as: MeterTechnician
              as_user_id: "tech-1"
              captures: { toe_1: $.data.id }
            - { call: "POST /turn-on-events/${toe_1}/complete", payload: { co_reading_ppm: 2.0, odor_detected: false, ignition_verified: true, venting_verified: true }, as: MeterTechnician, as_user_id: "tech-1" }
            - { call: "POST /service-applications/${app_id}/energize", payload: {}, as: MeterTechnician, as_user_id: "tech-1" }
            - call: "POST /gis-as-builts"
              payload: { service_application_id: "${app_id}", geometry_geojson: "{\"type\":\"LineString\",\"coordinates\":[[-89.65,39.78],[-89.66,39.79]]}", pipe_material: PE, depth_inches: 16.0 }
              as: FieldSupervisor
