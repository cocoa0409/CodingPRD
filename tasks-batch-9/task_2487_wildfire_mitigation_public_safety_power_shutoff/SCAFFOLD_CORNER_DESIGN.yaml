      - name: resource_center_selector_reports_unmet_capacity_when_the_pool_is_short
        claim_type: Correct Result
        grounds:
          - calculations.resource_center_activation_selector
          - calculations.psps_net_benefit_ratio
        distinguishing_aspect: "When the candidate pool cannot cover the requirement the call still succeeds with the remainder reported rather than failing: 3 seats against 5 required gives unmet_capacity 2, and the partial coverage ratio 3/5 scales the credit to 0.74 instead of the full 1.24 — the shortfall propagates into the benefit arithmetic instead of being silently rounded away."
        test_recipe:
          setup:
            - "EV-MIKE armed exactly as above, but the only D-WEST resource centre is CRC-W4 with 3 seats."
          setup_api_calls:
            - *k_clock_default
