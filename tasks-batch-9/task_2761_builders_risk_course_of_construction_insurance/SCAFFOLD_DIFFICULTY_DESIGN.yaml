          trigger:
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v0}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
