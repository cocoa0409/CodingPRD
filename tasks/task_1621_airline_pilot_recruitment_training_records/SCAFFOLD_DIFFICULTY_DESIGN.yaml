            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 44 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/qualifications", payload: { applicant_id: "${ap1}", equipment_id: "${eq_id}" }, as: CrewScheduler, captures: { q1: $.data.id } }
            - { call: "POST /pilot-training/flight-activities", payload: { qualification_id: "${q1}", activity_date: "2026-05-16T12:00:00Z", landings: 1, hours: 1.5, activity_type: "REVENUE" }, as: CrewScheduler }
            - { call: "POST /pilot-training/flight-activities", payload: { qualification_id: "${q1}", activity_date: "2026-07-20T12:00:00Z", landings: 1, hours: 2.0, activity_type: "REVENUE" }, as: CrewScheduler }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-14T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/flight-activities", payload: { qualification_id: "${q1}", activity_date: "2026-08-01T12:00:00Z", landings: 1, hours: 2.2, activity_type: "REVENUE" }, as: CrewScheduler }
          trigger:
            - { call: "POST /pilot-training/qualifications/${q1}/refresh-currency", payload: {}, as: CrewScheduler, captures: { cs: $.data.currency_state, l90: $.data.landings_90d } }
          assert:
            - "Qualification.${q1}.landings_90d == 2 (the 2026-05-16T12:00:00Z landing is exactly 90 days old -> EXCLUDED by the strict-greater-than low bound)"
            - "Qualification.${q1}.currency_state == LAPSED"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_applicant_cleared
        grounds:
          - state_machines.Applicant.PRIA_VERIFIED_to_CLEARED
          - validations[priority=4]
          - errors[ERR_APPLICANT_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Enrollment -> Applicant: POST /enrollments is rejected
          unless the referenced Applicant.status == CLEARED; an applicant in
          PRIA_VERIFIED (records done, but never cleared) blocks the write even
          though the class is OPEN with seats free.
        test_recipe:
          setup:
            - "Applicant driven to PRIA_VERIFIED (records verified, medical issued) but POST /clear never called; OPEN class with free seats"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "B773", name: "Boeing 777-300", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Abe Fox", email: "abe@x.com", license_number: "L300", total_flight_hours: 2300 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 27 }, as: CrewScheduler }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Applicant.${ap1}.status == PRIA_VERIFIED"
            - "trigger returns 409 error_id == ERR_APPLICANT_INVALID_STATE (enrollment gated on the APPLICANT's state, not the class's)"
      - name: bid_award_eligibility_requires_valid_medical
        grounds:
          - calculations.bid_award_ranking
          - state_machines.MedicalCertificate.VALID_to_DOWNGRADED
          - entities.Bid.fields.denial_reason
        distinguishing_aspect: |
          Entity pair Bid -> MedicalCertificate (different pair from
          Enrollment -> Applicant): the MORE SENIOR bidder whose FIRST-class
          certificate is DOWNGRADED at award time is DENIED with denial_reason
          INELIGIBLE, and the seat falls through to the junior bidder — award
          ranking consumes another entity's scan-driven state.
        test_recipe:
          setup:
            - "Two cleared applicants: senior A (seniority 1, medical issued 2026-02-10 age 45 -> first-class valid through 2026-08-31) and junior B (seniority 2, medical valid); bid period seats_available 1, OPEN; both bid; clock advanced to 2026-09-01 and scan runs so A's medical is DOWNGRADED before award; period closed then awarded"
          setup_api_calls:
