        grounds: ['calculations.footprint_utilization', 'errors[ERR_FOOTPRINT_EXCEEDED]']
        distinguishing_aspect: "Venue cap 60 with store footprint 40 admits assortment products totaling exactly 20 units (equality allowed) but rejects 21 with ERR_FOOTPRINT_EXCEEDED."
        test_recipe:
          setup:
            - "ACTIVE agreement over a venue with max_equipment_footprint_units 60; store equipment_footprint_units 40; two footprint products (15 units, 6 units)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
