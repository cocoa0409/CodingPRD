              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "WY-5001", home_state_code: "WY", vessel_type: "OPEN_HULL", hull_length_ft: 17 }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspection-records"
              payload: { station_id: "${st_id}", watercraft_id: "${wc_id}", arrived_at: "2026-08-05T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_a}"
              captures: { rec_id: $.data.id }
            - call: "POST /inspection-records/${rec_id}/screening"
              payload: { expected_watercraft_version: "${wc_v}", residual_water_present: false, prior_water_body_id: "${wb_id}", presented_seal_number: "WY-42", presented_seal_state_code: "WY", presented_seal_issued_at: "2026-08-04T09:00:00Z" }
