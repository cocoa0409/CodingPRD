# §1.9 Scaffold Corner Design — breadth probe over the claim-extraction taxonomy.
# Sections and claim_type values are drawn ONLY from
# skills/prd-bench-scaffold-generator/references/claim-extraction-guide.md.
# Instances whose corner is already probed by §1.8 carry `excluded_because:` and NO test_recipe.
# Logical clock: POST /_clock/set_current_utc; server default is 2026-08-01T00:00:00Z.
scaffold_corner_design:

  - section: entities
    instances:

      - name: obstetric_unit_creation_echoes_declared_inputs_with_zeroed_breach_counters
        claim_type: Creation
        grounds:
          - entities.ObstetricUnit
          - entities.ObstetricUnit.fields.licensed_ldr_beds
          - entities.ObstetricUnit.fields.licensed_or_rooms
          - entities.ObstetricUnit.fields.max_daily_induction_bed_minutes
          - entities.ObstetricUnit.fields.coverage_deficit_units
          - entities.ObstetricUnit.fields.escalation_breach_count
          - entities.ObstetricUnit.fields.bundle_breach_count
          - entities.ObstetricUnit.fields.cesarean_readiness_state
          - entities.ObstetricUnit.fields.last_capacity_sweep_at
          - endpoints[POST /obstetric-units]
        distinguishing_aspect: |
          The root aggregate is born with EVERY derived counter at its documented zero and with
          cesarean_readiness_state == NOT_READY, because §1.3 cesarean_readiness_derivation reads only
          drills with status == VALIDATED and a brand-new unit owns none. An implementation that
          seeds cesarean_readiness_state to READY (the "nothing wrong yet" reading), or that leaves
          last_capacity_sweep_at as the creation instant instead of null, is caught here. It also
          pins that the three licensed/budget inputs are echoed verbatim rather than normalised.
        test_recipe:
          setup: |
            Only the logical clock is pinned; no unit, bed, staff member or encounter exists yet.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /obstetric-units
              payload: { unit_name: "Larkspur Perinatal Center LDR", licensed_ldr_beds: 6, licensed_or_rooms: 2, max_daily_induction_bed_minutes: 4320 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id, unit_v1: $.data.version }
          assert:
            - "HTTP 201"
            - "ObstetricUnit.${unit_id}.unit_name == \"Larkspur Perinatal Center LDR\""
            - "ObstetricUnit.${unit_id}.licensed_ldr_beds == 6"
            - "ObstetricUnit.${unit_id}.licensed_or_rooms == 2"
            - "ObstetricUnit.${unit_id}.max_daily_induction_bed_minutes == 4320"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"
            - "ObstetricUnit.${unit_id}.escalation_breach_count == 0"
            - "ObstetricUnit.${unit_id}.bundle_breach_count == 0"
            - "ObstetricUnit.${unit_id}.cesarean_readiness_state == \"NOT_READY\""
            - "ObstetricUnit.${unit_id}.last_capacity_sweep_at == null"
            - "ObstetricUnit.${unit_id}.version == 1"

      - name: omitting_max_daily_induction_bed_minutes_applies_the_2880_default
        claim_type: Defaults
        grounds:
          - entities.ObstetricUnit.fields.max_daily_induction_bed_minutes
          - endpoints[POST /obstetric-units]
          - calculations.induction_capacity_projection
        distinguishing_aspect: |
          max_daily_induction_bed_minutes is the ONLY optional input on unit creation and its default
          is the concrete literal 2880 (48 bed-hours), not zero and not unbounded. A zero default
          would make every priority-15 induction capacity test fail immediately; an unbounded default
          would make it never fail. Asserting the literal 2880 discriminates all three readings.
        test_recipe:
          setup: |
            Clock pinned; the creation payload carries only the three required inputs.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /obstetric-units
              payload: { unit_name: "Marigold Womens Pavilion LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
          assert:
            - "HTTP 201"
            - "ObstetricUnit.${unit_id}.max_daily_induction_bed_minutes == 2880"
            - "ObstetricUnit.${unit_id}.licensed_ldr_beds == 4"
            - "ObstetricUnit.${unit_id}.licensed_or_rooms == 1"
            - "ObstetricUnit.${unit_id}.version == 1"

      - name: omitted_encounter_optionals_default_to_singleton_vertex_without_prior_cesarean
        claim_type: Defaults
        grounds:
          - entities.LaborEncounter.fields.fetus_count
          - entities.LaborEncounter.fields.presentation
          - entities.LaborEncounter.fields.prior_cesarean
          - entities.LaborEncounter.fields.episiotomy_performed
          - entities.LaborEncounter.fields.magnesium_infusion_active
          - entities.LaborEncounter.fields.review_required
          - endpoints[POST /labor-encounters]
        distinguishing_aspect: |
          Three obstetric-risk optionals default to the LOW-risk reading (fetus_count 1,
          presentation VERTEX, prior_cesarean false) and four booleans default to false, which is
          what keeps the omitted-optional encounter at TIER_I. An implementation that leaves any of
          them null instead of applying the literal default would make §1.3
          encounter_required_coverage_units branch on a null and silently mis-tier the patient.
          One AVAILABLE LDR bed exists so that posture cannot be DIVERT and priority 8.02 cannot
          block the admission.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed and no staff, shifts or encounters. The clock
            sits at 2026-08-01T06:00:00Z.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Sagebrush Birth Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-DEF-1001", parity: 0, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { encounter_id: $.data.id }
          assert:
            - "HTTP 201"
            - "LaborEncounter.${encounter_id}.fetus_count == 1"
            - "LaborEncounter.${encounter_id}.presentation == \"VERTEX\""
            - "LaborEncounter.${encounter_id}.prior_cesarean == false"
            - "LaborEncounter.${encounter_id}.episiotomy_performed == false"
            - "LaborEncounter.${encounter_id}.magnesium_infusion_active == false"
            - "LaborEncounter.${encounter_id}.review_required == false"
            - "LaborEncounter.${encounter_id}.labor_phase == \"ANTEPARTUM\""
            - "LaborEncounter.${encounter_id}.staffing_state == \"UNASSIGNED\""
            - "LaborEncounter.${encounter_id}.bed_id == null"
            - "LaborEncounter.${encounter_id}.source_booking_id == null"
            - "LaborEncounter.${encounter_id}.is_ntsv == true"
            - "LaborEncounter.${encounter_id}.acuity_tier == \"TIER_I\""
            - "LaborEncounter.${encounter_id}.required_coverage_units == 0.5"
            - "LaborEncounter.${encounter_id}.assigned_coverage_units == 0.0"
            - "LaborEncounter.${encounter_id}.version == 1"

      - name: breech_multiparous_encounter_computes_tier_ii_required_0_8_and_is_ntsv_false
        claim_type: Computed Fields
        grounds:
          - entities.LaborEncounter.fields.acuity_tier
          - entities.LaborEncounter.fields.required_coverage_units
          - entities.LaborEncounter.fields.one_to_one_required
          - entities.LaborEncounter.fields.is_ntsv
          - calculations.encounter_required_coverage_units
          - endpoints[POST /labor-encounters]
        distinguishing_aspect: |
          Four computed fields are derived at creation from the SAME payload but by different rules:
          presentation != VERTEX alone lifts acuity_tier to TIER_II, required_coverage_units is
          round_half_up(ACUITY_UNITS[TIER_II] 1.5 * PHASE_MULTIPLIER[ANTEPARTUM] 0.5, 1) = 0.8
          (NOT the untruncated 0.75 and NOT 0.7 from truncation), one_to_one_required stays false
          because TIER_II is below the TIER_IV trigger, and is_ntsv is false for BOTH independent
          reasons present here (parity 2 != 0 and presentation != VERTEX). An implementation that
          computes required_coverage_units as ACUITY_UNITS only, ignoring the phase multiplier,
          returns 1.5 and is caught.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed; clock at 2026-08-01T06:00:00Z.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Ironwood Maternity LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-BRE-2002", parity: 2, gestational_age_weeks: 39, prior_cesarean: false, fetus_count: 1, presentation: "BREECH" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { encounter_id: $.data.id, tier: $.data.acuity_tier, required: $.data.required_coverage_units }
          assert:
            - "HTTP 201"
            - "LaborEncounter.${encounter_id}.acuity_tier == \"TIER_II\""
            - "LaborEncounter.${encounter_id}.required_coverage_units == 0.8"
            - "LaborEncounter.${encounter_id}.one_to_one_required == false"
            - "LaborEncounter.${encounter_id}.is_ntsv == false"
            - "LaborEncounter.${encounter_id}.presentation == \"BREECH\""
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.8"

      - name: encounter_admitted_at_is_stamped_from_the_logical_clock_at_the_moment_of_admission
        claim_type: System Fields
        grounds:
          - entities.LaborEncounter.fields.admitted_at
          - entities.LaborEncounter.fields.delivery_recorded_at
          - entities.LaborEncounter.fields.delivery_mode
          - endpoints[POST /labor-encounters]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          admitted_at is system-sourced from clock_now at the instant of the POST, not from the
          server's startup default (2026-08-01T00:00:00Z) and not from real wall-clock time. The
          clock is deliberately moved forward AFTER the unit and bed exist but BEFORE the admission,
          so a stamp of 06:00 would prove the value came from an earlier read and a stamp near real
          "now" would prove wall-clock leakage. The two delivery stamps must still be null at
          admission because no THIRD_STAGE_DELIVERED advance has happened.
        test_recipe:
          setup: |
            Unit and one AVAILABLE LDR bed are created at 2026-08-01T06:00:00Z; the clock is then
            advanced to 2026-08-01T09:15:00Z and the patient is admitted.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Foxglove Perinatal LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T09:15:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-SYS-3003", parity: 1, gestational_age_weeks: 40 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { encounter_id: $.data.id, admitted: $.data.admitted_at }
          assert:
            - "HTTP 201"
            - "LaborEncounter.${encounter_id}.admitted_at == \"2026-08-01T09:15:00Z\""
            - "LaborEncounter.${encounter_id}.delivery_recorded_at == null"
            - "LaborEncounter.${encounter_id}.delivery_mode == null"
            - "LaborEncounter.${encounter_id}.unit_id == \"${unit_id}\""
            - "LaborEncounter.${encounter_id}.version == 1"

      - name: get_labor_encounter_with_an_unknown_id_returns_encounter_not_found
        claim_type: Not Found
        grounds:
          - entities.LaborEncounter
          - endpoints[GET /labor-encounters/{encounterId}]
          - errors[ERR_ENCOUNTER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          A syntactically well-formed but unknown encounter id resolves to the entity-specific
          ERR_ENCOUNTER_NOT_FOUND at 404 — not a generic 404, not the priority-5
          ERR_INVALID_FIELD_VALUE at 400 (the id is a valid UUID, so no format rule fires), and not
          an empty 200 body. The id used is a valid v4-shaped UUID that no create call in the chain
          could have minted.
        test_recipe:
          setup: |
            Only the clock is pinned; nothing at all has been created, so no encounter can match.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: GET /labor-encounters/00000000-0000-4000-8000-000000000001
              payload: {}
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == \"ERR_ENCOUNTER_NOT_FOUND\""

      - name: retrieving_a_freshly_created_bed_returns_available_with_null_occupancy_pointers
        claim_type: Retrieval
        grounds:
          - entities.Bed
          - entities.Bed.fields.status
          - entities.Bed.fields.current_encounter_id
          - entities.Bed.fields.held_booking_id
          - entities.Bed.fields.turnover_clear_at
          - endpoints[POST /obstetric-units/{unitId}/beds]
          - endpoints[GET /beds/{bedId}]
        distinguishing_aspect: |
          GET /beds/{bedId} returns the stored row unchanged, including the initial_state AVAILABLE
          of the Bed machine and all THREE null occupancy pointers. Because current_encounter_id,
          held_booking_id and turnover_clear_at are the fields the priority-13.3 interval rule and
          the capacity sweep read, an implementation that seeds turnover_clear_at at creation (for
          example to clock_now) would make a brand-new bed look like it is inside a turnover buffer.
        test_recipe:
          setup: |
            One unit with a single LDR bed; clock at 2026-08-01T06:00:00Z. No encounter or booking
            has touched the bed.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Bluebell Family Birth LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-07", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_7: $.data.id }
          trigger:
            - call: GET /beds/${bed_ldr_7}
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-observer"
              captures: { bed_status: $.data.status, bed_label_read: $.data.bed_label }
          assert:
            - "HTTP 200"
            - "Bed.${bed_ldr_7}.bed_label == \"LDR-07\""
            - "Bed.${bed_ldr_7}.bed_type == \"LDR\""
            - "Bed.${bed_ldr_7}.status == \"AVAILABLE\""
            - "Bed.${bed_ldr_7}.unit_id == \"${unit_id}\""
            - "Bed.${bed_ldr_7}.current_encounter_id == null"
            - "Bed.${bed_ldr_7}.held_booking_id == null"
            - "Bed.${bed_ldr_7}.turnover_clear_at == null"
            - "Bed.${bed_ldr_7}.version == 1"

      - name: bed_listing_pages_in_bed_label_order_not_creation_order
        claim_type: Listing
        grounds:
          - entities.Bed.fields.bed_label
          - endpoints[GET /obstetric-units/{unitId}/beds]
          - endpoints[POST /obstetric-units/{unitId}/beds]
        distinguishing_aspect: |
          The three beds are created in the deliberately scrambled label order LDR-03, LDR-01,
          LDR-02, so creation order and bed_label order disagree. §1.5 pins bed_label ASC — the same
          lexicographic order the capacity sweep uses to pick among candidate beds — so page one
          (limit 2, offset 0) must be LDR-01 then LDR-02 and page two (limit 2, offset 2) must be the
          single row LDR-03. An implementation that falls back to created_at ASC returns LDR-03 first
          and is caught on the very first element; one that ignores offset returns LDR-01 twice.
        test_recipe:
          setup: |
            One unit with exactly three LDR beds inserted out of label order at a fixed clock.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Juniper Ridge Obstetrics LDR", licensed_ldr_beds: 6, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-03", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_3: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_2: $.data.id }
          trigger:
            - call: GET /obstetric-units/${unit_id}/beds
              payload: { limit: 2, offset: 0 }
              as: ChargeNurse
              as_user_id: "charge-nurse-observer"
              captures:
                page1_first: "$.data[0].bed_label"
                page1_second: "$.data[1].bed_label"
            - call: GET /obstetric-units/${unit_id}/beds
              payload: { limit: 2, offset: 2 }
              as: ChargeNurse
              as_user_id: "charge-nurse-observer"
              captures:
                page2_first: "$.data[0].bed_label"
          assert:
            - "HTTP 200"
            - "page1_first == \"LDR-01\""
            - "page1_second == \"LDR-02\""
            - "page2_first == \"LDR-03\""
            - "the first response body contains exactly 2 Bed rows"
            - "the second response body contains exactly 1 Bed row"
            - "Bed.${bed_ldr_1}.bed_label == \"LDR-01\""
            - "Bed.${bed_ldr_3}.bed_label == \"LDR-03\""

      - name: creating_an_encounter_without_parity_is_rejected_before_any_row_is_written
        claim_type: Required Fields
        grounds:
          - entities.LaborEncounter.fields.parity
          - endpoints[POST /labor-encounters]
          - validations[priority=5]
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: |
          parity is source: input with NO default, so omitting it must fail at priority 5 with
          ERR_INVALID_FIELD_VALUE (400) rather than being silently coerced to 0 — which would be
          indistinguishable from a true nullipara and would flip is_ntsv to true. The follow-up list
          call proves the failure was total: no LaborEncounter row exists for the unit, so the
          rejection happened before the encounter_required_coverage_units side effects ran and the
          unit's version was not bumped.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed (so posture cannot be the blocking factor) and
            no encounters. unit.version is 1 after creation and the bed create bumps it, so the
            recorded version is read back rather than assumed.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Hawthorn Womens Hospital LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-MISSING-4004", gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { err: $.data.error_id }
            - call: GET /labor-encounters
              payload: { unit_id: "${unit_id}", limit: 10, offset: 0 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
          assert:
            - "HTTP 400 on the POST /labor-encounters call"
            - "error_id == \"ERR_INVALID_FIELD_VALUE\""
            - "the GET /labor-encounters response body contains exactly 0 LaborEncounter rows"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"

      - name: gestational_age_weeks_of_45_is_rejected_as_out_of_the_declared_20_to_44_range
        claim_type: Type Constraints
        grounds:
          - entities.LaborEncounter.fields.gestational_age_weeks
          - endpoints[POST /labor-encounters]
          - validations[priority=5]
          - errors[ERR_INVALID_FIELD_VALUE]
        distinguishing_aspect: |
          gestational_age_weeks is declared integer 20..44 with BOTH bounds inclusive, so 45 is one
          step outside the range and must fail at priority 5 with ERR_INVALID_FIELD_VALUE (400)
          rather than being clamped to 44 or accepted as a plain positive integer. This matters
          because gestational_age_weeks feeds two independent derivations — the < 37 TIER_II trigger
          in encounter_required_coverage_units and the >= 39 ELECTIVE boundary in
          induction_priority_class — and silent clamping would corrupt both.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed; clock at 2026-08-01T06:00:00Z.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Cottonwood Perinatal LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-RANGE-5005", parity: 0, gestational_age_weeks: 45 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == \"ERR_INVALID_FIELD_VALUE\""

      - name: creating_a_bed_under_an_unknown_parent_unit_returns_unit_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Bed.fields.unit_id
          - endpoints[POST /obstetric-units/{unitId}/beds]
          - validations[priority=3]
          - errors[ERR_UNIT_NOT_FOUND]
        distinguishing_aspect: |
          Bed.unit_id is taken from the PATH, never from the body, so the parent must be proven to
          exist by the priority-3 path-id check BEFORE the priority-5 field checks and before the
          priority-13.1 duplicate-label check. A real unit with a real LDR-01 bed already exists in
          the fixture, so an implementation that resolves the nested route against "any unit" would
          either succeed or return ERR_DUPLICATE_BED_LABEL instead of the required 404
          ERR_UNIT_NOT_FOUND — both are distinguished here.
        test_recipe:
          setup: |
            One real unit exists and already owns a bed labelled LDR-01; the trigger addresses a
            different, non-existent unit id with that same label.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Alderbrook Birthing Suites LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /obstetric-units/00000000-0000-4000-8000-000000000002/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == \"ERR_UNIT_NOT_FOUND\""
            - "the real unit still owns exactly 1 Bed row"
            - "Bed.${bed_ldr_1}.unit_id == \"${unit_id}\""

      - name: patching_the_induction_budget_leaves_unit_name_and_licensed_counts_untouched
        claim_type: Immutability
        grounds:
          - entities.ObstetricUnit.fields.unit_name
          - entities.ObstetricUnit.fields.licensed_ldr_beds
          - entities.ObstetricUnit.fields.licensed_or_rooms
          - entities.ObstetricUnit.fields.max_daily_induction_bed_minutes
          - endpoints[PATCH /obstetric-units/{unitId}]
        distinguishing_aspect: |
          PATCH declares exactly ONE input, so unit_name and both licensed counts are immutable after
          creation and there is no route through which they can be edited. The single write bumps
          unit.version from 1 to exactly 2 — one increment, not two, even though the endpoint's
          description notes the budget change alters the outcome of the priority-15 capacity test
          without re-deriving posture. Asserting the exact successor version catches an
          implementation that recomputes and re-saves the unit twice per request.
        test_recipe:
          setup: |
            A single unit created with licensed_ldr_beds 4, licensed_or_rooms 1 and the default
            budget of 2880; nothing else exists, so unit.version is exactly 1 before the trigger.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Willowmere Perinatal LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id, unit_v_before: $.data.version }
          trigger:
            - call: PATCH /obstetric-units/${unit_id}
              payload: { max_daily_induction_bed_minutes: 5760 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_v_after: $.data.version, budget_after: $.data.max_daily_induction_bed_minutes }
          assert:
            - "HTTP 200"
            - "ObstetricUnit.${unit_id}.max_daily_induction_bed_minutes == 5760"
            - "ObstetricUnit.${unit_id}.unit_name == \"Willowmere Perinatal LDR\""
            - "ObstetricUnit.${unit_id}.licensed_ldr_beds == 4"
            - "ObstetricUnit.${unit_id}.licensed_or_rooms == 1"
            - "ObstetricUnit.${unit_id}.version == 2"
            - "${unit_v_before} == 1"

      - name: safety_bundle_activation_timeliness_score_is_computed_field_under_activation_anchoring
        claim_type: Computed Fields
        grounds:
          - entities.SafetyBundleActivation.fields.timeliness_score
          - entities.SafetyBundleActivation.fields.sequence_adjusted_score
          - entities.SafetyBundleActivation.fields.on_time_step_count
          - entities.SafetyBundleActivation.fields.late_step_count
          - calculations.bundle_intervention_timeliness
        excluded_because:
          difficulty_instance: dual_variant_calc / hypertension_bundle_activation_anchored_100_vs_sequence_anchored_87_50
          rationale: |
            That §1.8 instance already drives a SEVERE_HYPERTENSION activation through its four
            checklist completions and asserts both computed scores on the same row — timeliness_score
            100.00 from the authoritative activation_anchored variant beside sequence_adjusted_score
            87.50 from the advisory sequence_anchored variant, together with the on-time and late
            counters that feed them. A §1.9 Computed Fields probe on the same two fields would repeat
            that setup with strictly less discriminating power.
        # NO test_recipe.

      - name: induction_booking_projected_occupancy_minutes_is_a_computed_field_frozen_at_hold
        claim_type: Computed Fields
        grounds:
          - entities.InductionBooking.fields.projected_occupancy_minutes
          - entities.InductionBooking.fields.hold_expires_at
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
          - entities.ObstetricUnit.fields.held_bed_minutes_by_day
          - calculations.induction_capacity_projection
        excluded_because:
          difficulty_instance: combinatorial_formula / posture_buffer_projection_cycle_pinned_order_freezes_645_beside_675
          rationale: |
            projected_occupancy_minutes is only ever written by hold-capacity, and its value depends
            on the posture-derived turnover_buffer_minutes read at that instant (45 under OPEN, 75
            otherwise). The cited §1.8 instance already holds two bookings under two different
            postures and asserts the two frozen literals 645 and 675 side by side, which subsumes any
            single-value §1.9 Computed Fields assertion on this field.
        # NO test_recipe.

      - name: care_assignment_junction_row_is_reachable_from_both_the_encounter_and_the_shift
        claim_type: Parent Relationships
        grounds:
          - entities.CareAssignment
          - entities.CareAssignment.fields.encounter_id
          - entities.CareAssignment.fields.shift_assignment_id
          - entities.CareAssignment.fields.staff_id
          - endpoints[POST /care-assignments]
          - endpoints[GET /care-assignments]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          CareAssignment is the many-to-many junction of the graph topology: it has TWO independent
          parents (LaborEncounter and ShiftAssignment) plus a denormalised staff_id copied from the
          shift's staff member. The identical row must therefore surface under ?encounter_id= and
          under ?shift_assignment_id=, and its staff_id must equal the shift's staff_id rather than
          the acting X-User-ID. An implementation that stores only one edge, or that recomputes
          staff_id from the caller, is caught by comparing both list results against ${assignment_id}.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed. One RN_LABOR_DELIVERY
            staff member with ADVANCED monitoring certification and a credential expiring
            2027-06-30, holding a CHARGE shift 05:00-15:00 that is ACTIVE and contains clock_now, so
            capacity_units_effective froze at min(BASE_CAPACITY_UNITS[CHARGE] 3.0,
            CERT_CAP_UNITS[ADVANCED] 4.0) - CHARGE_ADMIN_OFFSET 1.0 = 2.0. One ANTEPARTUM TIER_I
            encounter (parity 0, GA 39, all optionals defaulted) with required_coverage_units 0.5.
            The encounter version is re-read immediately before the OCC-guarded junction create.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Redbud Perinatal Institute LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Dana Okoye RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { charge_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${charge_staff_id}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { charge_shift_id: $.data.id }
            - call: POST /shift-assignments/${charge_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { charge_capacity: $.data.capacity_units_effective }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-JXN-6006", parity: 0, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { encounter_id: $.data.id }
            - call: GET /labor-encounters/${encounter_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { enc_v: $.data.version }
            - call: POST /care-assignments
              payload: { encounter_id: "${encounter_id}", shift_assignment_id: "${charge_shift_id}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${enc_v}" }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures: { assignment_id: $.data.id, debited: $.data.acuity_units_consumed }
          trigger:
            - call: GET /care-assignments
              payload: { encounter_id: "${encounter_id}", limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures:
                by_encounter_id: "$.data[0].id"
                by_encounter_staff: "$.data[0].staff_id"
            - call: GET /care-assignments
              payload: { shift_assignment_id: "${charge_shift_id}", limit: 10, offset: 0 }
              as: ChargeNurse
              as_user_id: "${charge_staff_id}"
              captures:
                by_shift_id: "$.data[0].id"
                by_shift_mode: "$.data[0].coverage_mode"
          assert:
            - "HTTP 200 on both list calls"
            - "each list response body contains exactly 1 CareAssignment row"
            - "by_encounter_id == \"${assignment_id}\""
            - "by_shift_id == \"${assignment_id}\""
            - "CareAssignment.${assignment_id}.staff_id == \"${charge_staff_id}\""
            - "CareAssignment.${assignment_id}.coverage_mode == \"RATIO_SHARED\""
            - "CareAssignment.${assignment_id}.acuity_units_consumed == 0.5"
            - "CareAssignment.${assignment_id}.status == \"ACTIVE\""
            - "CareAssignment.${assignment_id}.superseded_by_assignment_id == null"
            - "CareAssignment.${assignment_id}.released_at == null"
            - "LaborEncounter.${encounter_id}.assigned_coverage_units == 0.5"
            - "LaborEncounter.${encounter_id}.staffing_state == \"RATIO_COVERED\""
            - "ShiftAssignment.${charge_shift_id}.assigned_acuity_load_units == 0.5"
            - "ShiftAssignment.${charge_shift_id}.capacity_units_effective == 2.0"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"

  - section: state_machines
    instances:

      - name: newly_requested_induction_booking_starts_in_requested_with_no_capacity_committed
        claim_type: Initial State
        grounds:
          - state_machines.InductionBooking
          - entities.InductionBooking.fields.status
          - entities.InductionBooking.fields.priority_class
          - entities.InductionBooking.fields.projected_occupancy_minutes
          - entities.InductionBooking.fields.hold_expires_at
          - entities.InductionBooking.fields.bump_count
          - endpoints[POST /induction-bookings]
          - calculations.induction_priority_class
        distinguishing_aspect: |
          The initial_state of the InductionBooking machine is REQUESTED, and REQUESTED means
          "nothing reserved": bed_id, encounter_id, projected_occupancy_minutes and hold_expires_at
          are all still null and bump_count is 0, because only hold-capacity freezes a projection.
          priority_class, by contrast, IS derived immediately — ELECTIVE_39_WEEK here because
          ELECTIVE_NO_INDICATION at gestational_age_weeks 39 hits the inclusive ELECTIVE_GA_WEEKS
          boundary. An implementation that defers priority_class until the hold, or that pre-commits
          bed minutes at request time, is caught.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z, one unit with one AVAILABLE LDR bed, no bookings yet.
            requested_start_utc is set a day ahead so the priority-14.2 future-dated check passes.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Tamarack Maternity LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
          trigger:
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-IND-7007", gestational_age_weeks: 39, indication_code: "ELECTIVE_NO_INDICATION", requested_start_utc: "2026-08-02T08:00:00Z", expected_labor_minutes: 600 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_id: $.data.id, klass: $.data.priority_class }
          assert:
            - "HTTP 201"
            - "InductionBooking.${booking_id}.status == \"REQUESTED\""
            - "InductionBooking.${booking_id}.priority_class == \"ELECTIVE_39_WEEK\""
            - "InductionBooking.${booking_id}.bed_id == null"
            - "InductionBooking.${booking_id}.encounter_id == null"
            - "InductionBooking.${booking_id}.projected_occupancy_minutes == null"
            - "InductionBooking.${booking_id}.hold_expires_at == null"
            - "InductionBooking.${booking_id}.bump_count == 0"
            - "InductionBooking.${booking_id}.expected_labor_minutes == 600"
            - "InductionBooking.${booking_id}.version == 1"
            - "Bed.${bed_ldr_1}.status == \"AVAILABLE\""
            - "Bed.${bed_ldr_1}.held_booking_id == null"

      - name: confirming_a_booking_that_never_held_capacity_returns_invalid_state_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.InductionBooking.CAPACITY_HELD_to_CONFIRMED
          - endpoints[POST /induction-bookings/{bookingId}/confirm]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          /confirm is declared only on the CAPACITY_HELD -> CONFIRMED edge, so firing it from
          REQUESTED must fail at priority 8 with ERR_INVALID_STATE_TRANSITION (409) — NOT with the
          later ERR_INDUCTION_HOLD_EXPIRED (which would be the tempting answer since hold_expires_at
          is null and a naive "now > null" test could be read as expired) and NOT by silently
          performing an implicit hold first. The booking must be byte-for-byte unchanged afterwards,
          including its version, proving the rejection happened before any side effect.
        test_recipe:
          setup: |
            Same fixture as the initial-state instance: clock 2026-08-01T06:00:00Z, one unit, one
            AVAILABLE LDR bed, one booking sitting in REQUESTED at version 1 with hold_expires_at
            still null. No hold-capacity call is made.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Chokecherry Womens Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-IND-8008", gestational_age_weeks: 41, indication_code: "POST_DATES_41W", requested_start_utc: "2026-08-02T08:00:00Z" }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { booking_id: $.data.id }
          trigger:
            - call: POST /induction-bookings/${booking_id}/confirm
              payload: {}
              as: ObstetricianAttending
              as_user_id: "attending-observer-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "InductionBooking.${booking_id}.status == \"REQUESTED\""
            - "InductionBooking.${booking_id}.priority_class == \"MEDICALLY_INDICATED\""
            - "InductionBooking.${booking_id}.hold_expires_at == null"
            - "InductionBooking.${booking_id}.projected_occupancy_minutes == null"
            - "InductionBooking.${booking_id}.version == 1"
            - "Bed.${bed_ldr_1}.status == \"AVAILABLE\""

      - name: activating_a_shift_before_its_window_opens_returns_shift_window_not_current
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ShiftAssignment.SCHEDULED_to_ACTIVE
          - endpoints[POST /shift-assignments/{shiftId}/activate]
          - validations[priority=8.08]
          - errors[ERR_SHIFT_WINDOW_NOT_CURRENT]
          - entities.ShiftAssignment.fields.capacity_units_effective
        distinguishing_aspect: |
          The SCHEDULED -> ACTIVE edge exists, so priority 8 is satisfied; what fails is the
          8.08 window precondition shift_start_utc <= clock_now < shift_end_utc. The clock sits at
          06:00 while the shift opens at 16:00, ten hours later, so the answer must be
          ERR_SHIFT_WINDOW_NOT_CURRENT (409) and NOT ERR_INVALID_STATE_TRANSITION. The shift must
          also still carry capacity_units_effective == null, since §1.5 pins that the capacity
          snapshot is frozen BY activation — a failed activation may not leave a snapshot behind.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit, one RN_LABOR_DELIVERY staff member with an
            unexpired credential, and one SCHEDULED CHARGE shift running 16:00 to 02:00 the next day
            (600 minutes, inside MAX_SHIFT_MINUTES 720, and the staff member's only shift so the
            13.2 overlap check cannot fire).
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Mulberry Perinatal Care LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Priya Raman RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-06-30T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { night_staff_id: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${night_staff_id}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T16:00:00Z", shift_end_utc: "2026-08-02T02:00:00Z" }
              as: ChargeNurse
              as_user_id: "${night_staff_id}"
              captures: { night_shift_id: $.data.id }
          trigger:
            - call: POST /shift-assignments/${night_shift_id}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "${night_staff_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == \"ERR_SHIFT_WINDOW_NOT_CURRENT\""
            - "ShiftAssignment.${night_shift_id}.status == \"SCHEDULED\""
            - "ShiftAssignment.${night_shift_id}.capacity_units_effective == null"
            - "ShiftAssignment.${night_shift_id}.assigned_acuity_load_units == 0.0"
            - "ShiftAssignment.${night_shift_id}.version == 1"

      - name: a_cancelled_shift_cannot_be_activated_or_cancelled_again
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ShiftAssignment
          - state_machines.ShiftAssignment.SCHEDULED_to_CANCELLED
          - endpoints[POST /shift-assignments/{shiftId}/cancel]
          - endpoints[POST /shift-assignments/{shiftId}/activate]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          CANCELLED is a terminal state of the ShiftAssignment machine, so BOTH remaining triggers
          must be refused from it with ERR_INVALID_STATE_TRANSITION (409) — the activate even though
          clock_now (06:00) sits squarely inside the shift's 05:00-15:00 window, which is precisely
          the condition that would let it succeed from SCHEDULED, and the second cancel even though
          it is nominally a no-op. The shift must remain at the version it reached on cancellation,
          proving neither refused call wrote anything.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit, one credentialled RN_LABOR_DELIVERY staff
            member, one CHARGE shift 05:00-15:00 (600 minutes) whose window already contains
            clock_now. It is cancelled while still SCHEDULED, which 8.08 permits because no
            CareAssignment references it, landing it in the terminal CANCELLED state.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
