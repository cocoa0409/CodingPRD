  # =================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_constraint_conflict_on_document_verify
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_DOCUMENT_NOT_SUBMITTED]
          - errors[ERR_DOC_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Pair (state, business_constraint): verifying an already-VERIFIED BANK_STATEMENT whose period also
          overlaps another VERIFIED statement of the same member must yield the state error
          ERR_DOCUMENT_NOT_SUBMITTED (priority 5), not the constraint error ERR_DOC_PERIOD_OVERLAP (priority 11).
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026; STANDARD application UNDER_REVIEW; member M"
            - "Two BANK_STATEMENT docs for M: D1 VERIFIED (2026-01-01..2026-01-31); D2 VERIFIED (2026-01-15..2026-02-15) — verified before D1 (so D2's own verify predates D1 and passed); second verify attempt on D2 now violates state AND would overlap D1"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
