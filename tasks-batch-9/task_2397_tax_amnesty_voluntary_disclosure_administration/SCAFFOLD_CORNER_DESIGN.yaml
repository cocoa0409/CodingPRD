            - "DisclosureReturn.${ret_a_id}.gross_penalty_cents == 50000"
            - "DisclosureReturn.${ret_a_id}.gross_interest_cents == 22500"
            - "DisclosureReturn.${ret_a_id}.waived_penalty_cents == 50000"
            - "DisclosureReturn.${ret_a_id}.waived_interest_cents == 11250"
            - "DisclosureReturn.${ret_a_id}.balance_due_cents == 1011250"
            - "DisclosureReturn.${ret_b_id}.days_late == 91"
            - "DisclosureReturn.${ret_b_id}.penalty_rate_applied == 0.15"
            - "DisclosureReturn.${ret_b_id}.gross_penalty_cents == 150000"
            - "DisclosureReturn.${ret_b_id}.gross_interest_cents == 22750"
            - "DisclosureReturn.${ret_b_id}.waived_interest_cents == 11375"
            - "DisclosureReturn.${ret_b_id}.balance_due_cents == 1011375"
            - "VoluntaryDisclosureAgreement.${agr_id}.gross_liability_cents == 2245250"
            - "VoluntaryDisclosureAgreement.${agr_id}.haircut_pct == 0.00"
            - "VoluntaryDisclosureAgreement.${agr_id}.waived_amount_cents == 222625"
            - "VoluntaryDisclosureAgreement.${agr_id}.total_due_cents == 2022625"

      - name: gross_liability_excludes_returns_still_in_draft
        claim_type: Input Set Filtering
        grounds:
          - calculations.agreement_effective_waiver_resolution
          - entities.VoluntaryDisclosureAgreement.fields.gross_liability_cents
          - entities.DisclosureReturn.fields.status
        distinguishing_aspect: |
          The aggregate window is status-scoped to FILED, ASSESSED and SETTLED: a DRAFT
          return sits on the agreement with every computed field still at its zero value
          and contributes nothing, and only /file pulls it into the rollup — which is why
          filing the second return moves gross_liability from 1350000 to 2025000 in one
          step rather than at draft time.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with one SALES_USE term"
            - "Taxpayer Kilnbrook holds an EXECUTED agreement with the canonical Q1 return already FILED"
