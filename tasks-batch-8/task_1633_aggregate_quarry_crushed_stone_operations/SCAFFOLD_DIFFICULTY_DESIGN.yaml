            - { call: "POST /plant-runs/${run}/complete", payload: { input_tons: 620.0, outputs: [ { stockpile_id: "${pile}", product_spec_id: "${spec}", tons: 620.0 } ] }, as: PlantOperator, as_user_id: "po-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_INVALID_STATE (http 409), NOT ERR_STOCKPILE_CAPACITY_EXCEEDED — state priority 5 beats fiscal priority 11"
