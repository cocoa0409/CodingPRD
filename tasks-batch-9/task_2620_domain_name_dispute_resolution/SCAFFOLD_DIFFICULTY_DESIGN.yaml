              captures: { outcome: "$.data.outcome", basis: "$.data.outcome_basis" }
          assert:
            - "The outsider's vote returns ERR_NOT_SEAT_HOLDER with HTTP 403, even though Panelist ${pan_outsider_id} exists on the roster and the caller's role is Panelist"
            - "The outsider's conflict-screening of ${apt_id} also returns ERR_NOT_SEAT_HOLDER with HTTP 403, because the appointment is held by ${pan_seated_id}"
            - "Neither refusal creates a row: GET /udrp/decisions/${dec_id}/votes returns meta.total_count == 0 before the seated panelist votes"
            - "PanelistAppointment.${apt_id}.conflict_score is still 0.00 and status is still ACCEPTED after the outsider's screening attempt"
            - "The seated panelist's vote succeeds: PanelVote.${vote_id}.voter_panelist_id == ${pan_seated_id}, seat == SOLE, vote == CANCELLATION, cast_at == 2026-08-01T00:00:00Z"
            - "The seated panelist's second vote returns ERR_VOTE_ALREADY_CAST with HTTP 409 and GET /udrp/decisions/${dec_id}/votes still returns meta.total_count == 1"
            - "The stored PanelVote.${vote_id}.vote is still CANCELLATION - the refused second vote does not overwrite it"
            - "Issuance then succeeds with Decision.${dec_id}.outcome == CANCELLATION, cancellation_votes == 1, transfer_votes == 0, deny_votes == 0, dissent_present == false"
            - "Decision.${dec_id}.outcome_basis names the unanimous single-member tally, and Case.${case_id}.status == IMPLEMENTATION_WAITING"

      - name: issuance_depends_on_the_aggregate_state_of_the_sibling_appointment_rows
        grounds:
          - validations[priority=91].ERR_PANEL_NOT_CONSTITUTED
          - validations[priority=93].ERR_VOTES_INCOMPLETE
          - state_machines.Case.PANEL_APPOINTMENT_to_PANEL_CONSTITUTED
          - calculations.panelist_honoraria_allocation
          - calculations.panel_outcome_tally
        distinguishing_aspect: |
          A Decision may be drafted from PANEL_APPOINTMENT, so the draft exists while one of the three
          seats is still WAIVER_PENDING; issuance then depends not on the Decision's own status but on
          a count over sibling PanelistAppointment rows, and the ladder answers
          ERR_PANEL_NOT_CONSTITUTED (409, priority 91) rather than the equally true
          ERR_VOTES_INCOMPLETE (422, priority 93). Granting the waiver flips the third row to ACCEPTED,
          which writes the honoraria split as a side effect and moves the failure to the vote count -
          so the same request returns three different results as two other entities change state.
