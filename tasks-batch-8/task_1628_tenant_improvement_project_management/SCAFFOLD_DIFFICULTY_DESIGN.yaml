  # =====================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_letter_negotiation_cycle
        grounds:
          - state_machines.WorkLetter.PROPOSED_to_COUNTERED
          - state_machines.WorkLetter.COUNTERED_to_PROPOSED
          - entities.WorkLetter.fields.round_number
        distinguishing_aspect: |
          WorkLetter exhibits a true cycle (PROPOSED -> COUNTERED -> PROPOSED)
          with round_number incrementing per loop — on entity WorkLetter, distinct
          from the sibling instance's PunchItem reopen cycle.
        test_recipe:
          setup:
            - "Project advanced to WORK_LETTER_NEGOTIATION via first work-letter creation; letter proposed by landlord"
            - "Tenant counters (round 1), landlord re-proposes, tenant counters again (round 2), landlord re-proposes, tenant accepts, landlord executes"
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { name: "Tower F", address: "6 Main St", max_concurrent_construction_projects: 2 }
              as: LandlordPM
              captures: { prop_id: $.data.id }
            - call: "POST /api/properties/${prop_id}/lease-spaces"
              payload: { suite_number: "100", floor: 1, rentable_sqft: 5000 }
              as: LandlordPM
              captures: { space_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { legal_name: "Tenant F", contact_email: "f@tenant.example", tax_id: "T-F" }
              as: LandlordPM
              captures: { tenant_id: $.data.id }
            - call: "POST /api/leases"
              payload: { space_id: "${space_id}", tenant_id: "${tenant_id}", base_rent_annual_cents: 36500000, scheduled_rent_commencement_date: "2026-10-01T00:00:00Z", lease_term_months: 60 }
              as: LandlordPM
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/activate"
              as: LandlordPM
            - call: "POST /api/leases/${lease_id}/ti-projects"
              payload: { project_name: "Suite 100 TI", base_contract_cents: 40000000 }
              as: LandlordPM
              captures: { proj_id: $.data.id }
            - call: "POST /api/ti-projects/${proj_id}/work-letters"
              payload: { scope_description: "v1", allowance_offer_cents: 45000000, work_delineation: "LANDLORD" }
              as: LandlordPM
              captures: { wl_id: $.data.id }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
          trigger:
            - call: "GET /api/work-letters/${wl_id}"
              as: LandlordPM
              captures: { wl_v_pre1: $.data.version }
            - call: "POST /api/work-letters/${wl_id}/counter"
              payload: { scope_description: "v2 tenant counter", allowance_offer_cents: 52000000, work_delineation: "SPLIT", expected_work_letter_version: "${wl_v_pre1}" }
              as: TenantRep
              as_user_id: "${tenant_id}"
              captures: { wl_v1: $.data.version }
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "GET /api/work-letters/${wl_id}"
              as: LandlordPM
              captures: { wl_v2: $.data.version }
            - call: "POST /api/work-letters/${wl_id}/counter"
              payload: { scope_description: "v3 tenant counter", allowance_offer_cents: 50000000, work_delineation: "SPLIT", expected_work_letter_version: "${wl_v2}" }
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/propose"
              as: LandlordPM
            - call: "POST /api/work-letters/${wl_id}/accept"
              as: TenantRep
              as_user_id: "${tenant_id}"
            - call: "POST /api/work-letters/${wl_id}/execute"
              as: LandlordPM
            - call: "GET /api/work-letters/${wl_id}"
              as: LandlordPM
              captures: { wl_final_round: $.data.round_number, wl_final_status: $.data.status }
          assert:
            - "WorkLetter.${wl_id}.round_number == 2 (two tenant counters)"
            - "WorkLetter.${wl_id}.status == EXECUTED"
            - "WorkLetter.${wl_id}.allowance_offer_cents == 50000000 (latest counter payload carried forward)"
            - "TIProject.${proj_id}.allowance_total_cents == 50000000"

