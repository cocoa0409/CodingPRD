      - name: machine_closed_interval_touching_conflicts
        grounds:
          - entities.MaintenanceEvent.fields.window_start
          - entities.MaintenanceEvent.fields.window_end
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: CLOSED [window_start, window_end] on DialysisMachine — an event starting
          exactly when another ends (12:00 vs 12:00) CONFLICTS (contrast with the chair's half-open
          adjacency), while a next-day window is accepted.
        test_recipe:
          setup:
            - "Program; one IN_STOCK machine; clock 2026-05-01"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program Q", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-17", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id } }
            - { call: "POST /api/maintenance-events", payload: { machine_id: "${mach}", event_type: PREVENTIVE, window_start: "2026-05-10T09:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: BiomedTechnician, captures: { evt1: $.data.id } }
          trigger:
            - { call: "POST /api/maintenance-events", payload: { machine_id: "${mach}", event_type: REPAIR, window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T15:00:00Z" }, as: BiomedTechnician, captures: { err: $.data.error_id } }
            - { call: "POST /api/maintenance-events", payload: { machine_id: "${mach}", event_type: DECONTAMINATION, window_start: "2026-05-11T09:00:00Z", window_end: "2026-05-11T12:00:00Z" }, as: BiomedTechnician, captures: { evt3: $.data.id, evt3_status: $.data.status } }
            - { call: "GET /api/dialysis-machines/${mach}/maintenance-events", as: ProgramAdmin, captures: { ev_second: "$.data[1].id" } }
          assert:
            - "touching [12:00,15:00] vs [09:00,12:00] on the same machine: error_id == ERR_EVENT_WINDOW_OVERLAP (closed intervals — shared endpoint conflicts)"
            - "disjoint next-day window: status == SCHEDULED"
            - "machine has exactly 2 maintenance events: data[0] and data[1] present (data[1].id == ${ev3}), data[2] absent (the rejected event was not persisted)"

  # ------------------------------------------------------------------ RULE 9
  - rule_id: compensating_invariant
    instances:
      - name: deliver_then_return_restores_on_hand
        grounds:
          - calculations.on_hand_units
          - calculations.return_credit
          - state_machines.DeliveryAppointment.SCHEDULED_to_DELIVERED
          - state_machines.WasteReturnRecord.REPORTED_to_CREDITED
        distinguishing_aspect: |
          Conserved quantity: patient on-hand supply units. Delivering 30 units then CREDIT-returning
          the same 30 units leaves on_hand_units == 0 (its pre-delivery value) — the compensating pair
          nets to zero while credit_cents (6000) is computed independently of the unit conservation.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient, cap 400, allowance 72; May order 30 DIALYSATE_2L APPROVED"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program R", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Eighteen", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: WATER_HANDLING, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att1: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: MACHINE_OPERATION, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att2: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: ASEPTIC_TECHNIQUE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att3: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: EMERGENCY_RESPONSE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att4: $.data.id } }
            - { call: "POST /api/training-attempts", payload: { patient_id: "${pat}", module_code: SUPPLY_STORAGE, score_pct: 90 }, as: HomeNurse, as_user_id: "nurse-1", captures: { att5: $.data.id } }
            - { call: "POST /api/training-attempts/${att1}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att2}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att3}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att4}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/training-attempts/${att5}/sign-off", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/home-assessments", payload: { patient_id: "${pat}", assessment_kind: INITIAL, water_chloramine_ppm: 0.05, electrical_dedicated_circuit: true, electrical_voltage_verified: true, storage_area_sqft: 100 }, as: HomeNurse, as_user_id: "nurse-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/home-assessments/${asmt}/accept", as: HomeNurse, as_user_id: "nurse-2" }
            - { call: "POST /api/dialysis-machines", payload: { program_id: "${prog}", serial_number: "SN-18", model: "HomeX" }, as: BiomedTechnician, captures: { mach: $.data.id, mach_v: $.data.version } }
            - { call: "POST /api/dialysis-machines/${mach}/assign", payload: { patient_id: "${pat}", expected_machine_version: "${mach_v}" }, as: BiomedTechnician }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v: $.data.version, onhand0: $.data.on_hand_units } }
            - { call: "POST /api/emergency-backup-plans", payload: { patient_id: "${pat}", plan_mode: IN_CENTER_CHAIR, expected_patient_version: "${pat_v}" }, as: HomeNurse, as_user_id: "nurse-1" }
            - { call: "POST /api/patients/${pat}/activate", as: Nephrologist }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { pat_v2: $.data.version } }
            - { call: "POST /api/supply-orders", payload: { patient_id: "${pat}", order_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", quantity: 30 } ], expected_patient_version: "${pat_v2}" }, as: Patient, as_user_id: "${pat}", captures: { ord: $.data.id } }
            - { call: "POST /api/supply-orders/${ord}/submit", as: Patient, as_user_id: "${pat}" }
            - { call: "POST /api/supply-orders/${ord}/review", payload: { decision: APPROVE }, as: SupplyCoordinator }
            - { call: "POST /api/delivery-appointments", payload: { supply_order_id: "${ord}", window_start: "2026-05-04T08:00:00Z", window_end: "2026-05-04T12:00:00Z" }, as: SupplyCoordinator, captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /api/delivery-appointments/${appt}/complete", payload: { delivered_units: 30 }, as: SupplyCoordinator }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { onhand1: $.data.on_hand_units } }
            - { call: "POST /api/waste-return-records", payload: { patient_id: "${pat}", record_type: RETURN, activity_month: "2026-05", lines: [ { sku: "DIALYSATE_2L", units: 30, expired: false } ] }, as: Patient, as_user_id: "${pat}", captures: { ret: $.data.id } }
            - { call: "POST /api/waste-return-records/${ret}/verify", payload: { approved: true }, as: SupplyCoordinator, captures: { credit: $.data.credit_cents } }
            - { call: "GET /api/patients/${pat}", as: ProgramAdmin, captures: { onhand2: $.data.on_hand_units } }
          assert:
            - "Patient.on_hand_units == 0 before delivery, == 30 after complete, == 0 after the CREDITED return (invariant: deliver-then-return conserves on-hand)"
            - "WasteReturnRecord.${ret}.credit_cents == 6000   (full tier 10*300 = 3000; overage 20 -> round(20*300*0.5) = 3000)"
            - "SupplyOrder.${ord}.fulfillment_status == DELIVERED"

      - name: reserve_then_cancel_restores_chair_availability
        grounds:
          - state_machines.BackupSlotReservation.RESERVED_to_CANCELLED
          - entities.Patient.fields.no_show_count
          - validations[priority=8]
        distinguishing_aspect: |
          Conserved quantity: a chair's RESERVED-reservation count for a day (distinct from supply
          units). Reserve-then-cancel returns the count to 0 and the identical interval can be booked
          again — proving the cancel fully compensates the reservation with no capacity drift.
