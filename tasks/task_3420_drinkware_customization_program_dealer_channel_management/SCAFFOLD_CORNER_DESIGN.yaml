  # ===========================================================================
  - section: rbac
    instances:
      - name: role_denied_for_other_roles_exclusive_ops
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_FOR_ROLE
          - roles
        distinguishing_aspect: "Role exclusivity is enforced on three axes at once: a Buyer cannot lock a print slot (ProductionLead-only), a Dealer cannot resolve an enforcement case (ChannelManager-only), and a PrepressTech cannot decide an application (ChannelManager-only) — all 403 ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup:
            - "Clock set; dealer + open application; enforcement case; print slot."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "AMAZON", seller_handle: "rb-1", listing_url: "https://amazon.example/d/rb1" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_rb: $.data.id }
            - *c_slot
          trigger:
            - call: "POST /drinkware/print-slots/${c_slot}/lock"
              payload: {}
              as: Buyer
              as_user_id: "buyer-std"
              captures: { err_rb1: $.data.error_id }
            - call: "POST /drinkware/enforcement-cases/${case_rb}/resolve"
              payload: { outcome: "DISMISSED", resolution_notes: "dealer trying to self-clear" }
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { err_rb2: $.data.error_id }
            - call: "POST /drinkware/dealer-applications/${c_app}/decide"
              payload: { decision: "APPROVE", decision_reason: "prepress overreach" }
              as: PrepressTech
              as_user_id: "pp-1"
              captures: { err_rb3: $.data.error_id }
          assert:
            - "err_rb1 == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "err_rb2 == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "err_rb3 == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "no state moved: slot OPEN, case UNDER_REVIEW, application SUBMITTED"

      - name: dealer_cannot_read_other_dealer
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - roles.Dealer
        distinguishing_aspect: "entity_backed ownership: Dealer A reading Dealer B's record is 403 ERR_FORBIDDEN_FOR_ROLE, while the same role reading its OWN record is 200 — the role alone does not gate, the identity match does."
        test_recipe:
          setup:
            - "Clock set; dealers A and B created."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Other Dealer Co", storefront_address: "99 Other St", region_code: "TX-W", sell_through_pct: 40, tenure_years: 2 }
              as: PlatformAdmin
              captures: { dealer_b_rb: $.data.id }
          trigger:
            - call: "GET /drinkware/dealers/${dealer_b_rb}"
              payload: {}
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { err_own: $.data.error_id }
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { ok_legal_name: $.data.legal_name }
          assert:
            - "err_own == ERR_FORBIDDEN_FOR_ROLE (403) for the cross-dealer read"
            - "ok_legal_name == \"Standard Dealer Co\" (200) for the own-record read"

      - name: buyer_cannot_submit_other_buyers_order
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - roles.Buyer
        distinguishing_aspect: "Buyer ownership is by buyer_ref: buyer-b submitting buyer-a's order is 403 ERR_FORBIDDEN_FOR_ROLE even though submit is a Buyer operation."
        test_recipe:
          setup:
            - "Clock set; canonical line/drop; order owned by buyer-std."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_order
          trigger:
            - call: "POST /drinkware/customization-orders/${c_order}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-intruder"
              captures: { err_own_submit: $.data.error_id }
          assert:
            - "err_own_submit == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "CustomizationOrder.${c_order}.payment_status stays UNPAID"

      - name: dealer_cannot_request_for_other_dealer
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - roles.Dealer
          - endpoints.POST_/drinkware/launch-allocations
        distinguishing_aspect: "The allocation body dealer_id must equal the acting Dealer identity: dealer D posting a request naming dealer E is 403 ERR_FORBIDDEN_FOR_ROLE before any window or credit logic runs."
        test_recipe:
          setup:
            - "Clock set; dealers D and E; canonical line and drop."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - call: "POST /drinkware/dealers"
              payload: { legal_name: "Spoof Target Co", storefront_address: "5 Target St", region_code: "TX-W", sell_through_pct: 40, tenure_years: 2 }
              as: PlatformAdmin
              captures: { dealer_e_rb: $.data.id }
            - *c_line
            - *c_drop
          trigger:
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${dealer_e_rb}", drop_id: "${c_drop}", requested_units: 3 }
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { err_spoof: $.data.error_id }
          assert:
            - "err_spoof == ERR_FORBIDDEN_FOR_ROLE (403)"
            - "GET /drinkware/launch-allocations?dealer_id=${dealer_e_rb} returns 0 rows"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_dealer_version_on_resolve_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enforcement-resolve-stale-dealer]
          - errors.ERR_STALE_DEALER_VERSION
        distinguishing_aspect: "OCC on Dealer.version: resolving a matched case with the pre-cascade version minus one is 412 ERR_STALE_DEALER_VERSION; resending with the current version succeeds and applies the points (4) exactly once."
        test_recipe:
          setup:
            - "Clock set; dealer authorized via canonical chain (version 2); one matched enforcement case."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - *c_sched
            - *c_clock2
            - *c_record
            - *c_docs
            - *c_decide
            - call: "POST /drinkware/enforcement-cases"
              payload: { marketplace: "EBAY", seller_handle: "occ-1", listing_url: "https://ebay.example/i/o1", matched_dealer_id: "${c_dealer}" }
              as: ChannelManager
              as_user_id: "cm-enf"
              captures: { case_occ: $.data.id }
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { occ_dv: $.data.version }
          trigger:
            - call: "POST /drinkware/enforcement-cases/${case_occ}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "MAP_VIOLATION", resolution_notes: "stale write", expected_dealer_version: "${occ_dv} - 1" }
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { err_occ: $.data.error_id }
            - call: "POST /drinkware/enforcement-cases/${case_occ}/resolve"
              payload: { outcome: "CONFIRMED_VIOLATION", infraction_category: "MAP_VIOLATION", resolution_notes: "fresh write", expected_dealer_version: "${occ_dv}" }
              as: ChannelManager
              as_user_id: "cm-1"
          assert:
            - "err_occ == ERR_STALE_DEALER_VERSION (412)"
            - "the stale attempt changed nothing: case still UNDER_REVIEW, dealer version still ${occ_dv}"
            - "fresh resolve: 200, EnforcementCase.${case_occ}.status == CONFIRMED_VIOLATION, infraction_points == 4"
            - "Dealer.${c_dealer}.infraction_points == 4 and version == ${occ_dv} + 1 (bumped exactly once)"

      - name: occ_stale_drop_version_on_lock_then_fresh_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[drop-lock-stale-request-set]
          - errors.ERR_STALE_DROP_VERSION
        distinguishing_aspect: "OCC on ColorwayDrop.version: an allocation request bumps the drop's version (request-set membership changed), so a lock carrying the pre-request version is 412 ERR_STALE_DROP_VERSION; re-reading and locking with the fresh version succeeds and allocates."
        test_recipe:
          setup:
            - "Clock set; dealer authorized; drop open at clock 2026-09-06; dealer requested 5 units (this bumped the drop version)."
          setup_api_calls:
            - *c_clock
            - *c_dealer
            - *c_app
            - *c_sched
            - *c_clock2
            - *c_record
            - *c_docs
            - *c_decide
            - *c_line
            - *c_drop
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${c_drop}/open-allocation"
              payload: {}
              as: PlatformAdmin
            - call: "GET /drinkware/colorway-drops/${c_drop}"
              payload: {}
              as: PlatformAdmin
              captures: { occ_drop_v: $.data.version }
            - call: "POST /drinkware/launch-allocations"
              payload: { dealer_id: "${c_dealer}", drop_id: "${c_drop}", requested_units: 5 }
              as: Dealer
              as_user_id: "${c_dealer}"
              captures: { alloc_occ: $.data.id }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /drinkware/colorway-drops/${c_drop}/lock-allocation"
              payload: { expected_drop_version: "${occ_drop_v}" }
              as: PlatformAdmin
              captures: { err_occ_lock: $.data.error_id }
            - call: "GET /drinkware/colorway-drops/${c_drop}"
              payload: {}
              as: PlatformAdmin
              captures: { occ_drop_v2: $.data.version }
            - call: "POST /drinkware/colorway-drops/${c_drop}/lock-allocation"
              payload: { expected_drop_version: "${occ_drop_v2}" }
              as: PlatformAdmin
          assert:
            - "err_occ_lock == ERR_STALE_DROP_VERSION (412) — the request bumped the version after the client's read"
            - "occ_drop_v2 == ${occ_drop_v} + 1 (exactly one bump from the allocation request)"
            - "fresh lock: 200, status == ALLOCATION_LOCKED"
            - "LaunchAllocation.${alloc_occ}: ALLOCATED with allocated_units == 5 (pool was sufficient)"
            - "GET /drinkware/launch-allocations/${alloc_occ} returns 200 with status == ALLOCATED and unit_price_cents == 1800 (request-time snapshot)"

      - name: orders_list_filter_plus_pagination
        claim_type: pagination_with_filtering
        grounds:
          - endpoints.GET_/drinkware/customization-orders
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filter and pagination compose: three orders exist (one HELD reservation); filtering reservation_status=HELD returns exactly 1 row, while unfiltered pages limit=2 slice 3 rows into 2+1 with total_count 3 throughout."
        test_recipe:
          setup:
            - "Clock set; canonical line/drop/slot; three submitted orders (buyer-f1..f3); only buyer-f1's order reserved."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-f1", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-f1"
              captures: { order_f1: $.data.id }
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-f2", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-f2"
            - call: "POST /drinkware/customization-orders"
              payload: { buyer_type: "INDIVIDUAL", buyer_ref: "buyer-f3", product_line_id: "${c_line}", colorway_drop_id: "${c_drop}", quantity: 10, declared_color_count: 1, declared_placement_count: 1, print_technology: "LASER", requested_ship_date: "2026-09-16T00:00:00Z" }
              as: Buyer
              as_user_id: "buyer-f3"
            - call: "POST /drinkware/customization-orders/${order_f1}/submit"
              payload: {}
              as: Buyer
              as_user_id: "buyer-f1"
            - call: "POST /drinkware/customization-orders/${order_f1}/reserve-slot"
              payload: { slot_id: "${c_slot}" }
              as: Buyer
              as_user_id: "buyer-f1"
          trigger:
            - call: "GET /drinkware/customization-orders"
              payload: { reservation_status: "HELD" }
              as: ProductionLead
              as_user_id: "pl-1"
              captures: { held_first_id: "$.data[0].id" }
            - call: "GET /drinkware/customization-orders"
              payload: { limit: 2, offset: 0 }
              as: ProductionLead
              as_user_id: "pl-1"
          assert:
            - "filter reservation_status=HELD returns exactly 1 row with total_count == 1 and held_first_id == ${order_f1}"
            - "unfiltered limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true"
            - "unfiltered limit=2&offset=2 returns 1 row with has_more == false"

      - name: warranty_same_colorway_replacement_reserves_drop_unit
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WarrantyClaim.FILED_to_APPROVED_REPLACEMENT
          - calculations.drop_unit_ledger
        distinguishing_aspect: "A SAME_COLORWAY replacement reaches across aggregates into the drop ledger: the claim's order colorway is ALLOCATION_LOCKED with unallocated stock, so the approval reserves exactly 1 unit (warranty_reserved_units 0 -> 1, unallocated 2500 -> 2499) while the total-unit invariant 3000 == 0 + 500 + 1 + 2499 holds."
        test_recipe:
          setup:
            - "Canonical order COMPLETE (completed 2026-09-14). Its drop then driven ANNOUNCED -> ALLOCATION_OPEN (09-06) -> ALLOCATION_LOCKED (09-21, zero requests). DTC INSULATION claim filed against the order at 09-21."
          setup_api_calls:
            - *c_clock
            - *c_line
            - *c_drop
            - *c_slot
            - *c_order
            - *c_submit
            - *c_reserve
            - *c_proof
            - *c_approve
            - *c_lock
            - *c_start
            - *c_complete
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${c_drop}/open-allocation"
              payload: {}
              as: PlatformAdmin
            - call: "GET /drinkware/colorway-drops/${c_drop}"
              payload: {}
              as: PlatformAdmin
              captures: { c_drop_vw: $.data.version }
            - call: "POST /drinkware/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /drinkware/colorway-drops/${c_drop}/lock-allocation"
              payload: { expected_drop_version: "${c_drop_vw}" }
              as: PlatformAdmin
            - call: "POST /drinkware/warranty-claims"
              payload: { claim_source: "DTC", buyer_ref: "buyer-std", order_id: "${c_order}", serial_number: "S-W1", component: "INSULATION", failure_description: "lost vacuum seal" }
              as: Buyer
              as_user_id: "buyer-std"
              captures: { claim_sc: $.data.id }
          trigger:
            - call: "POST /drinkware/warranty-claims/${claim_sc}/decide"
              payload: { outcome: "APPROVE_REPLACEMENT", decision_reason: "insulation failure is replace-only" }
              as: WarrantyAgent
              as_user_id: "wa-1"
          assert:
            - "WarrantyClaim.${claim_sc}.status == APPROVED_REPLACEMENT and replacement_colorway_resolution == SAME_COLORWAY"
            - "warranty anchor is the order's completed_at (2026-09-14) + 36 INSULATION months -> claim validly inside window at 2026-09-21"
            - "ColorwayDrop.${c_drop}.warranty_reserved_units == 1 and unallocated_units == 2499"
            - "unit invariant holds: total 3000 == dealer_committed 0 + dtc_reserved 500 + warranty_reserved 1 + unallocated 2499"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/drinkware/dealers/{id}
        distinguishing_aspect: "Immediate consistency: the POST /dealers response and the very next GET return identical field values (no lag, no read-your-write violation), and every mutation bumps updated_at and version in the same request."
        test_recipe:
          setup:
            - "Clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - *c_dealer
            - call: "GET /drinkware/dealers/${c_dealer}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { get_legal: $.data.legal_name, get_version: $.data.version }
          assert:
            - "get_legal == \"Standard Dealer Co\" and get_version == 1, identical to the create response"
            - "created_at and updated_at are present and equal on a fresh entity"
