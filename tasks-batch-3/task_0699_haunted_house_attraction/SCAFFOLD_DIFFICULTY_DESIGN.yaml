        grounds:
          - validations[priority=13]
          - entities.TimeSlot.fields.window_start
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: "TimeSlots use half-open [start,end) intersection with ZERO buffer: a new slot starting exactly at an existing slot's window_end (19:00) is accepted (adjacency allowed); a new slot starting at 18:30 inside [18:00,19:00) is rejected ERR_SLOT_OVERLAP. Pure-adjacency interval semantics on the Attraction resource."
