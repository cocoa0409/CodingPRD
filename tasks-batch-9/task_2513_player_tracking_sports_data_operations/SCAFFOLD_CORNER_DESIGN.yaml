scaffold_corner_design:

  # =========================================================================
  # From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:
      - name: venue_creation_returns_seeded_census_and_uncertified_posture
        claim_type: creation
        grounds:
          - endpoints["POST /venues"]
          - entities.Venue.fields.data_posture
          - entities.Venue.fields.active_installation_count
        distinguishing_aspect: |
          A freshly registered venue must come back 201 with every declared field present and the
          derived census seeded to zero: data_posture UNCERTIFIED (no CERTIFIED rig exists yet) and
          all five installation counters 0. Falsified if any counter is absent or non-zero.
        test_recipe:
          setup:
            - "empty database; logical clock at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 201"
            - "data.name == \"Harbor Arena\", data.city == \"Harbor\", data.tracking_tech == \"HYBRID\""
            - "data.required_certified_installations == 1, data.transport_capacity_mbps == 100, data.min_achievable_latency_ms == 200"
            - "data.data_posture == \"UNCERTIFIED\""
            - "data.active_installation_count == 0, data.certified_installation_count == 0, data.recalibrating_installation_count == 0, data.uncertified_installation_count == 0, data.retired_installation_count == 0"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at and data.updated_at present"

      - name: installation_retrieval_returns_null_run_mirrors_before_first_run
        claim_type: retrieval
        grounds:
          - endpoints["GET /installations/{id}"]
          - entities.TrackingInstallation.fields.latest_run_result
          - entities.TrackingInstallation.fields.certified_at_utc
        distinguishing_aspect: |
          GET returns exactly what POST stored, and the four latest_run_* mirror fields plus the two
          certification stamps are null - not absent, not 0 - while calibration_run_count and
          drift_flag_count are 0. Falsified if the mirrors are omitted from the payload.
        test_recipe:
          setup:
            - "one venue with one DEPLOYED installation, no calibration runs recorded"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
          trigger:
            - call: "GET /installations/${i_id}"
              as: CalibrationEngineer
              as_user_id: "eng-01"
          assert:
            - "HTTP 200"
            - "data.venue_id == ${v_id}, data.rig_label == \"RIG-A\", data.modality == \"UWB_ANCHOR\""
            - "data.status == \"DEPLOYED\""
            - "data.latest_run_result == null, data.latest_run_composite_rms_mm == null, data.latest_run_recorded_at_utc == null, data.latest_run_engineer_user_id == null"
            - "data.certified_at_utc == null, data.certified_by_user_id == null"
            - "data.calibration_run_count == 0, data.drift_flag_count == 0"

      - name: games_listing_returns_pagination_envelope_with_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /games"]
          - response_envelope.pagination
        distinguishing_aspect: |
          Two games exist and the list is requested with limit 1 / offset 0: the envelope must carry
          total_count 2 (the full match count, not the page size), has_more true, limit 1, offset 0 and
          exactly one row. Falsified if total_count mirrors the page length or has_more is false.
        test_recipe:
          setup:
            - "one venue, two clubs, two SCHEDULED games at that venue"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_away}", away_club_id: "${c_home}", scheduled_start_utc: "2026-08-02T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
          trigger:
            - call: "GET /games?limit=1&offset=0"
              as: LeagueDataOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 200"
            - "pagination.total_count == 2, pagination.has_more == true, pagination.limit == 1, pagination.offset == 0"
            - "len(data) == 1"
            - "every returned row carries collection_status \"SCHEDULED\" and certification_status \"PENDING\""

      - name: venue_missing_required_latency_floor_rejected
        claim_type: required_fields
        grounds:
          - validations[priority 15]
          - endpoints["POST /venues"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          min_achievable_latency_ms has source input and no default, so omitting it is a schema
          violation at priority 15 - 400 ERR_INVALID_REQUEST - and no Venue row is created.
          Falsified if the server defaults the field and returns 201.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == \"ERR_INVALID_REQUEST\""
            - "GET /games returns pagination.total_count == 0 - nothing was persisted by the failed call"

      - name: licensee_biometric_entitled_defaults_to_false
        claim_type: defaults
        grounds:
          - entities.DataLicensee.fields.biometric_entitled
          - entities.DataLicensee.fields.available_units
          - endpoints["POST /licensees"]
        distinguishing_aspect: |
          biometric_entitled is the only optional input on POST /licensees and its declared default is
          false; available_units must additionally be seeded from granted_units while reserved_units and
          consumed_units start at 0. Falsified if the omitted flag comes back true or null.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /licensees"
              payload: { name: "Northstar Data", licensee_class: "DEVELOPER", tier: "BRONZE", granted_units: 5000 }
              as: LeagueDataOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 201"
            - "data.biometric_entitled == false"
            - "data.granted_units == 5000, data.available_units == 5000, data.reserved_units == 0, data.consumed_units == 0"
            - "data.settled_charge_cents == 0, data.sla_credit_cents == 0, data.audit_flag_count == 0"

      - name: calibration_run_computed_composite_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.CalibrationRun.fields.composite_rms_mm
          - entities.CalibrationRun.fields.result
          - validations[priority 15]
        distinguishing_aspect: |
          composite_rms_mm and result are source computed and are not members of the endpoint's input
          list, so a client that tries to dictate them ("composite_rms_mm 5.0, result PASS") is refused
          at priority 15 as an unknown-field schema violation; the server never adopts the supplied
          verdict. Falsified if the run is created with composite_rms_mm 5.0.
        test_recipe:
          setup:
            - "one venue with one DEPLOYED installation"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16, composite_rms_mm: 5.0, result: "PASS" }
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == \"ERR_INVALID_REQUEST\""
            - "GET /installations/${i_id} still shows status \"DEPLOYED\", calibration_run_count == 0, latest_run_result == null"
            - "GET /installations/${i_id}/calibration-runs returns pagination.total_count == 0"

      - name: consent_record_system_fields_stamped_from_headers_and_clock
        claim_type: system_fields
        grounds:
          - entities.ConsentRecord.fields.submitted_by_club_id
          - entities.ConsentRecord.fields.status
          - endpoints["POST /players/{id}/consent-records"]
        distinguishing_aspect: |
          submitted_by_club_id and status are source system: the club id is taken from X-User-ID (never
          from the body) and status is forced to PENDING, while ratified_by_user_id / terminated_at_utc
          stay null. Falsified if the filing role can pre-set status or the club stamp is missing.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor FC club with player Ada Ruiz #9"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /players"
              payload: { club_id: "${c_home}", full_name: "Ada Ruiz", jersey_number: 9 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /players/${p_id}/consent-records"
              payload: { scope: "BIOMETRIC_TRACKING", cba_agreement_version: "CBA-2026A", effective_from_utc: "2026-08-01T12:00:00Z", expires_at_utc: "2026-08-31T00:00:00Z" }
              as: ClubDataOfficer
              as_user_id: "${c_home}"
          assert:
            - "HTTP 201"
            - "data.player_id == ${p_id}, data.scope == \"BIOMETRIC_TRACKING\", data.cba_agreement_version == \"CBA-2026A\""
            - "data.status == \"PENDING\", data.submitted_by_club_id == ${c_home}"
            - "data.ratified_by_user_id == null, data.terminated_at_utc == null, data.version == 1"
            - "GET /players/${p_id} still shows biometric_release_state \"NONE\" and active_consent_record_id null - filing alone grants nothing"

      - name: venue_invalid_tracking_tech_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Venue.fields.tracking_tech
          - entities.Venue.fields.required_certified_installations
          - validations[priority 15]
        distinguishing_aspect: |
          Enum closure and numeric range are both enforced at priority 15: tracking_tech "THERMAL" is
          not one of OPTICAL / SENSOR_UWB / HYBRID, and required_certified_installations 0 breaks the
          declared ">= 1". Each is a 400 ERR_INVALID_REQUEST, not a silent coercion to a legal member.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "THERMAL", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err_enum: $.data.error_id }
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 0, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err_range: $.data.error_id }
          assert:
            - "first call: HTTP 400 with error_id \"ERR_INVALID_REQUEST\""
            - "second call: HTTP 400 with error_id \"ERR_INVALID_REQUEST\""
            - "no Venue row exists after either call"

      - name: calibration_run_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.CalibrationRun
          - endpoints["GET /installations/{id}/calibration-runs"]
        distinguishing_aspect: |
          CalibrationRun declares common_fields false, so its rows carry id and created_at only - no
          version, no updated_at - and §1.5 exposes no PATCH/PUT/DELETE for them: a recorded accuracy
          measurement is an audit fact. Falsified if the row exposes version or an update route exists.
        test_recipe:
          setup:
            - "one venue, one installation, one recorded calibration run"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 90.0, axis_rms_y_mm: 90.0, axis_rms_z_mm: 90.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
          trigger:
            - call: "GET /installations/${i_id}/calibration-runs"
              as: CalibrationEngineer
              as_user_id: "eng-01"
          assert:
            - "HTTP 200 with pagination.total_count == 1"
            - "data[0].id and data[0].created_at are present"
            - "data[0] has no \"version\" key and no \"updated_at\" key"
            - "data[0].recorded_by_user_id == \"eng-01\", data[0].composite_rms_mm == 90.00, data[0].result == \"PASS\""

      - name: consent_record_requires_existing_parent_player
        claim_type: parent_relationships
        grounds:
          - validations[priority 10]
          - errors[ERR_PLAYER_NOT_FOUND]
          - endpoints["POST /players/{id}/consent-records"]
        distinguishing_aspect: |
          ConsentRecord's parent is Player and the parent id arrives through the path, so an unknown
          player id is refused at priority 10 with 404 ERR_PLAYER_NOT_FOUND before any body-level CBA
          or expiry check runs - the body here is deliberately also CBA-invalid to prove the ordering.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; Harbor FC club exists but no player was created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
          trigger:
            - call: "POST /players/00000000-0000-0000-0000-0000000000aa/consent-records"
              payload: { scope: "BIOMETRIC_TRACKING", cba_agreement_version: "CBA-2019Z", effective_from_utc: "2026-08-01T12:00:00Z", expires_at_utc: "2026-08-31T00:00:00Z" }
              as: ClubDataOfficer
              as_user_id: "${c_home}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == \"ERR_PLAYER_NOT_FOUND\" - not ERR_CBA_VERSION_MISMATCH (priority 52) and not ERR_NOT_RESOURCE_OWNER (priority 25)"

  # =========================================================================
  # From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:
      - name: installation_starts_in_deployed_and_leaves_venue_uncertified
        claim_type: initial_state
        grounds:
          - state_machines.TrackingInstallation.initial_state
          - calculations.venue_data_posture
          - endpoints["POST /installations"]
        distinguishing_aspect: |
          A newly deployed rig is created in DEPLOYED (not CALIBRATING), and because certified_count is
          still 0 the venue posture stays UNCERTIFIED while uncertified_installation_count and
          active_installation_count both become 1. Falsified if creation implies any calibration state.
        test_recipe:
          setup:
            - "one venue with required_certified_installations 1 and no installations"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "OPTICAL_CAMERA" }
              as: LeagueDataOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 201 with data.status == \"DEPLOYED\""
            - "GET /venues/${v_id} shows data_posture \"UNCERTIFIED\""
            - "GET /venues/${v_id} shows active_installation_count == 1, uncertified_installation_count == 1, certified_installation_count == 0, recalibrating_installation_count == 0, retired_installation_count == 0"

      - name: passing_calibration_run_auto_validates_rig_and_refreshes_mirrors
        claim_type: valid_transition
        grounds:
          - state_machines.TrackingInstallation.DEPLOYED_to_CALIBRATING
          - state_machines.TrackingInstallation.CALIBRATING_to_VALIDATED
          - entities.TrackingInstallation.fields.latest_run_engineer_user_id
        distinguishing_aspect: |
          One request crosses two transitions: DEPLOYED -> CALIBRATING on the run, then the system
          CALIBRATING -> VALIDATED because the run's result is PASS. The mirror fields must carry the
          run's own values, including latest_run_engineer_user_id "eng-01", the future segregation
          counterparty. Falsified if the rig is left in CALIBRATING after a PASS.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z; one venue with one DEPLOYED installation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /installations/${i_id}/calibration-runs"
              payload: { axis_rms_x_mm: 75.0, axis_rms_y_mm: 75.0, axis_rms_z_mm: 75.0, sample_count: 6000, reference_point_count: 16 }
              as: CalibrationEngineer
              as_user_id: "eng-01"
          assert:
            - "HTTP 201 with data.composite_rms_mm == 75.00, data.result == \"PASS\", data.recorded_by_user_id == \"eng-01\", data.recorded_at_utc == \"2026-08-01T12:00:00Z\""
            - "GET /installations/${i_id} shows status \"VALIDATED\" (not CALIBRATING)"
            - "GET /installations/${i_id} shows latest_run_result \"PASS\", latest_run_composite_rms_mm 75.00, latest_run_recorded_at_utc \"2026-08-01T12:00:00Z\", latest_run_engineer_user_id \"eng-01\", calibration_run_count 1"
            - "GET /venues/${v_id} shows data_posture \"UNCERTIFIED\", uncertified_installation_count 1, recalibrating_installation_count 0"

      - name: flag_drift_on_deployed_rig_rejects_with_invalid_installation_state
        claim_type: invalid_transitions
        grounds:
          - validations[priority 40]
          - errors[ERR_INVALID_INSTALLATION_STATE]
          - state_machines.TrackingInstallation.CERTIFIED_to_RECALIBRATION_REQUIRED
        distinguishing_aspect: |
          flag-drift declares a from-set of exactly {CERTIFIED}; a DEPLOYED rig has no accuracy claim to
          invalidate, so the trigger is refused 409 ERR_INVALID_INSTALLATION_STATE and drift_flag_count
          stays 0. Falsified if the rig moves to RECALIBRATION_REQUIRED from DEPLOYED.
        test_recipe:
          setup:
            - "one venue with one DEPLOYED installation, no runs recorded"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Harbor Arena", city: "Harbor", tracking_tech: "HYBRID", required_certified_installations: 1, transport_capacity_mbps: 100, min_achievable_latency_ms: 200 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { v_id: $.data.id }
            - call: "POST /installations"
              payload: { venue_id: "${v_id}", rig_label: "RIG-A", modality: "UWB_ANCHOR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /installations/${i_id}/flag-drift"
              as: CalibrationEngineer
              as_user_id: "eng-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id \"ERR_INVALID_INSTALLATION_STATE\""
            - "GET /installations/${i_id} still shows status \"DEPLOYED\" and drift_flag_count == 0"
            - "GET /venues/${v_id} still shows data_posture \"UNCERTIFIED\" and recalibrating_installation_count == 0"

      - name: retired_rig_refuses_every_further_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TrackingInstallation.terminal_states
          - validations[priority 40]
          - errors[ERR_INVALID_INSTALLATION_STATE]
        distinguishing_aspect: |
          RETIRED is terminal: after retirement neither a new calibration run, nor certify, nor
          flag-drift, nor a second retire is admitted - each is 409 ERR_INVALID_INSTALLATION_STATE, and
          the venue census keeps retired_installation_count 1 with active_installation_count 0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T12:00:00Z"
            - "one venue with one rig taken through PASS -> VALIDATED -> CERTIFIED -> RETIRED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
