            - "response.data.scheduled_count == 1"
            - "response.data.unreachable_count == 1"
            - "response.data.removed_count == 1"
            - "RecallCampaign.${camp_id}.completion_rate_pct == 33.33"
            - "RecallCampaign.${camp_id}.recall_population_count == 3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: claim_provisional_component_rounding_order_mode_b
        grounds:
          - calculations.claim_reimbursement
          - entities.RepairClaim.fields.provisional_amount_cents
          - endpoints[POST /repair-claims]
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: both components land on a half cent
          (1.55 x 152.30 = 236.065 and 3 x 21.90 x 1.15 = 75.555), so rounding each component to
          2 decimals before summing yields 32363 cents while summing the raw products and rounding
          once yields 32362 cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; campaign 26V-101 FILED with remedy REMEDY_RELEASED on 2026-08-03."
            - "One NE build record in the population; LaborOperation R101-01 flat_hours 1.10; RemedyPart unit_cost 21.90."
            - "Dealer D-NE-02 in NE with labor_rate_per_hour 152.30 (above the NE cap of 152.00) holds a 1-unit ALLOCATED allocation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-101", defect_type: "SAFETY_DEFECT", defect_description: "Driver airbag inflator may rupture on deployment", risk_severity: "MODERATE" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD", owner_name: "Ann Vega" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/population-rules"
              payload: { inclusion_mode: "INCLUDE", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_start_date: "2024-01-01", production_end_date: "2024-07-01", part_number_low: 1000, part_number_high: 1999 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/defect-determination"
              payload: { defect_determination_date: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
            - call: "POST /recall-campaigns/${camp_id}/population-runs"
              payload: {}
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /recall-campaigns/${camp_id}/filings"
              payload: { filing_type: "DEFECT_NOTICE", narrative: "Part 573 defect information report for 26V-101" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /recall-campaigns/${camp_id}/labor-operations"
              payload: { labor_op_code: "R101-01", description: "Replace driver airbag inflator", flat_hours: 1.10, rate_type: "WARRANTY", effective_from: "2026-08-01", effective_to: "2027-12-31" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { lop_id: $.data.id }
            - call: "POST /recall-campaigns/${camp_id}/remedy-parts"
              payload: { part_number: "P-88123", unit_cost: 21.90, total_procured_qty: 100 }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "GET /recall-campaigns/${camp_id}"
              payload: {}
              as: SafetyEngineer
              as_user_id: "u-eng-2"
              captures: { camp_v: $.data.version }
            - call: "POST /recall-campaigns/${camp_id}/remedy-releases"
              payload: { remedy_description: "Replace inflator with revised propellant module", labor_operation_id: "${lop_id}", expected_campaign_version: "${camp_v}" }
              as: SafetyEngineer
              as_user_id: "u-eng-2"
            - call: "POST /dealers"
              payload: { dealer_code: "D-NE-02", name: "Harbor Auto Group", region_code: "NE", labor_rate_per_hour: 152.30, monthly_repair_capacity: 40 }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { dlr_id: $.data.id }
            - call: "POST /parts-allocations"
              payload: { remedy_part_id: "${part_id}", dealer_id: "${dlr_id}", requested_qty: 3, expected_part_version: "${part_v}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { alloc_id: $.data.id }
            - call: "GET /affected-vehicles"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh1_id}" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
              captures: { av1_id: "$.data[0].id" }
          trigger:
            - call: "POST /repair-claims"
              payload: { affected_vehicle_id: "${av1_id}", dealer_id: "${dlr_id}", labor_operation_id: "${lop_id}", repair_date: "2026-08-03", claimed_labor_hours: 1.55, parts_used_qty: 3 }
              as: DealerServiceManager
              as_user_id: "${dlr_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "RepairClaim.${claim_id}.provisional_amount_cents == 32363"
            - "RepairClaim.${claim_id}.provisional_amount_cents != 32362 (summing the raw products 236.065 + 75.555 + 12.00 and rounding once is the wrong order)"
            - "RepairClaim.${claim_id}.status == SUBMITTED"
            - "RepairClaim.${claim_id}.final_amount_cents == null"
            - "RepairClaim.${claim_id}.parts_allocation_id == ${alloc_id}"
            - "LaborOperation.${lop_id}.claim_count == 1"
            - "PartsAllocation.${alloc_id}.consumed_qty == 0"

      - name: wave_release_circular_coverage_ratio_mode_c
        grounds:
          - calculations.wave_release_quota
          - entities.NotificationWave.fields.provisional_coverage_ratio
          - entities.NotificationWave.fields.parts_coverage_ratio
          - entities.NotificationWave.fields.coverage_tier_factor
          - state_machines.NotificationWave.PLANNED_to_RELEASE_APPROVED
        distinguishing_aspect: |
          Mode (c) circular dependency: parts_coverage_ratio depends on planned_vehicle_count,
          which depends on coverage_tier_factor, which depends on provisional_coverage_ratio, whose
          denominator is eligible_vehicle_count - so with 5 eligible owners and 4 uncommitted units
          the gate reads 0.8000 while the ratio stored on the wave reads 1.3333 (4/3).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; campaign 26V-101 MODERATE, FILED, remedy REMEDY_RELEASED."
            - "Five NE build records matched into the population, all UNREPAIRED and never notified."
            - "Dealer D-NE-01 in NE holds an ALLOCATED allocation of exactly 4 units with 0 consumed."
            - "A REMEDY wave targeting NE is PLANNED for 2026-08-10 and is the campaign's only wave."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SafetyEngineer
            - call: "POST /recall-campaigns"
              payload: { campaign_number: "26V-101", defect_type: "SAFETY_DEFECT", defect_description: "Driver airbag inflator may rupture on deployment", risk_severity: "MODERATE" }
              as: SafetyEngineer
              as_user_id: "u-eng-1"
              captures: { camp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004352", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-15", suspect_part_number: 1500, region_code: "NE", sale_status: "SOLD", owner_name: "Ann Vega" }
              as: RecallOperationsManager
              as_user_id: "u-ops-1"
            - call: "POST /vehicles"
              payload: { vin: "1HGCM82633A004353", plant_code: "PLT1", model_code: "MDLA", model_year: 2024, production_date: "2024-03-16", suspect_part_number: 1501, region_code: "NE", sale_status: "SOLD", owner_name: "Ben Ito" }
              as: RecallOperationsManager
