              as: PlatformAdmin
              captures: { types_2: $.data.triggered_alert_types, delta_2: $.data.cycle_delta }
            - call: "POST /warewashing/machine-placements/${pl_id}/telemetry-readings"
              payload: { reading_at: "2026-08-01T02:00:00Z", cycle_count_total: 133, wash_temp_f: 160, final_rinse_temp_f: 185, rinse_pressure_psi: 20, source: "DEVICE" }
