              payload: { action: "CHECK_IN" }
              as: UnloadTech
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "START_UNLOAD" }
              as: UnloadTech
          trigger:
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_solvent}", declared_kg: 25.0, net_weight_kg: 25.0 }
              as: UnloadTech
              captures: { dl_at: $.data.id, disp_at: $.data.disposition, cost_at: $.data.estimated_disposal_cost_cents, reason_at: $.data.rejection_reason_code }
            - call: "POST /hhw/dropoff-lines"
              payload: { appointment_id: "${appt_id}", material_category_id: "${cat_solvent}", declared_kg: 0.001, net_weight_kg: 0.001 }
              as: UnloadTech
              captures: { dl_over: $.data.id, disp_over: $.data.disposition, cost_over: $.data.estimated_disposal_cost_cents, reason_over: $.data.rejection_reason_code }
          assert:
            - "${disp_at} == ACCEPTED — 0.000 + 25.000 is not STRICTLY greater than 25.0"
            - "${reason_at} == null"
            - "${cost_at} == 7750"
            - "${disp_over} == REJECTED_OVER_EVENT_LIMIT — 25.000 + 0.001 == 25.001 > 25.0"
            - "${reason_over} == EVENT_LIMIT"
            - "${cost_over} == 0"
            - "Appointment.${appt_id}.settled_kg == 25.0"
            - "CollectionEvent.${ev_id}.accepted_tonnage_kg == 25.0"
            - "CollectionEvent.${ev_id}.rejected_tonnage_kg == 0.001"
            - "Resident.${res_id}.annual_quantity_settled_kg == 25.0"

      - name: empty_program_cost_summary_zero_participant_boundary
        grounds:
          - calculations.program_cost_rollup
          - endpoints.GET_/hhw/programs/{id}/cost-summary
          - entities.Program.fields.participant_count_ytd
        distinguishing_aspect: |
          A different metric on a different endpoint from the mass-limit boundary: the empty-collection /
          zero-count edge of GET /hhw/programs/{id}/cost-summary. With no received manifests the
          mobilization fee collapses to 0 instead of the tier-1 250000, and with participant_count == 0
          cost_per_participant_cents is 0 rather than a division error.
        test_recipe:
          setup:
            - "A freshly created Program with no sites, no events, no appointments and no manifests"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Empty Fiscal Year Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /hhw/programs/${prog_id}/cost-summary"
              as: ProgramAdmin
              captures: { events: $.data.event_count, participants: $.data.participant_count, subtotal: $.data.disposal_subtotal_cents, rec_ton: $.data.received_tonnage_kg, mobil: $.data.mobilization_fee_cents, rebate: $.data.volume_rebate_cents, staffing: $.data.staffing_cost_cents, pre: $.data.pre_contingency_cents, contingency: $.data.contingency_cents, total: $.data.total_program_cost_cents, cpp: $.data.cost_per_participant_cents }
          assert:
            - "HTTP status == 200"
            - "${events} == 0 and ${participants} == 0"
            - "${subtotal} == 0 and ${rec_ton} == 0.0"
            - "${mobil} == 0 — the tier table is bypassed entirely when no manifest has been received"
            - "${rebate} == 0 and ${staffing} == 0"
            - "${pre} == 0 and ${contingency} == 0 and ${total} == 0"
            - "${cpp} == 0 — zero participants yields 0, not a division error"
            - "Program.${prog_id}.participant_count_ytd == 0 and Program.${prog_id}.tonnage_ytd_kg == 0.0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: appointment_confirm_depends_on_event_containment_axis
        grounds:
          - state_machines.Appointment.REQUESTED_to_CONFIRMED
          - entities.CollectionEvent.fields.containment_status
          - validations[priority=12]
          - errors[ERR_CONTAINMENT_DEFICIENT]
        distinguishing_aspect: |
          Entity pair Appointment -> CollectionEvent: whether Appointment may leave REQUESTED depends on
          a field of a DIFFERENT row — the event's containment_status — even though the event's
          lifecycle_status is still OPEN_FOR_REGISTRATION and every appointment-local precondition holds.
        test_recipe:
          setup:
            - "Program (ceiling 500000), APPROVED site, event OPEN_FOR_REGISTRATION with a 12.00 h lane assignment"
            - "The event's containment axis was driven COMPLIANT and then DEFICIENT by a failed inspection"
            - "Resident Ana is ELIGIBLE and holds a REQUESTED appointment on that event"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/material-categories"
              payload: { program_id: "${prog_id}", code: "LATEX_PAINT", display_name: "Latex Paint", acceptance_policy: "ACCEPTED_WITH_LIMIT", compatibility_class: "TOXIC", dot_hazard_class: "NA", max_kg_per_resident_per_event: 25.0, max_kg_per_resident_per_year: 60.0, disposal_rate_cents_per_kg: 155 }
              as: ProgramAdmin
              captures: { cat_latex: $.data.id }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "OPEN_REGISTRATION" }
              as: EventCoordinator
            - call: "POST /hhw/residents"
              payload: { program_id: "${prog_id}", full_name: "Ana Ruiz", street_address: "12 Elm Street", claimed_jurisdiction_code: "CO-ARV" }
              as: Anonymous
              captures: { res_id: $.data.id }
            - call: "POST /hhw/residents/${res_id}/eligibility-actions"
              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-ARV" }
              as: EligibilityClerk
              captures: { res_v: $.data.version }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res_id}", slot_start_utc: "2026-09-12T09:00:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 7.0, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "FAIL", finding_code: "BERM-CRACK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cont_status: $.data.containment_status, life_status: $.data.lifecycle_status }
          trigger:
            - call: "POST /hhw/appointments/${appt_id}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
              captures: { err: $.data.error_id }
          assert:
            - "${cont_status} == DEFICIENT and ${life_status} == OPEN_FOR_REGISTRATION"
            - "${err} == ERR_CONTAINMENT_DEFICIENT"
            - "HTTP status == 409"
            - "Appointment.${appt_id}.status == REQUESTED"
            - "Resident.${res_id}.annual_quantity_reserved_kg == 0.0"
            - "CollectionEvent.${ev_id}.reserved_slot_count == 0"

      - name: event_site_confirmation_depends_on_site_status
        grounds:
          - state_machines.CollectionEvent.lifecycle_status.PLANNED_to_SITE_CONFIRMED
          - state_machines.Site.APPROVED_to_SUSPENDED
          - validations[priority=11]
          - errors[ERR_SITE_NOT_APPROVED]
        distinguishing_aspect: |
          A different entity pair — CollectionEvent -> Site: the event's PLANNED -> SITE_CONFIRMED
          transition is refused because the Site row it points at moved APPROVED -> SUSPENDED after the
          event was scheduled, even though nothing about the event itself changed.
        test_recipe:
          setup:
            - "Program and a site that was APPROVED, then used to schedule a PLANNED event 2026-09-12"
            - "The site is afterwards SUSPENDED by the containment inspector; the event is still PLANNED so no containment cascade fires"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "SUSPEND", finding_code: "PAD-SPALLING" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
              captures: { site_status: $.data.status, site_last: $.data.last_inspection_result }
          trigger:
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${site_status} == SUSPENDED and ${site_last} == FAIL"
            - "${err} == ERR_SITE_NOT_APPROVED"
            - "HTTP status == 409"
            - "CollectionEvent.${ev_id}.lifecycle_status == PLANNED"
            - "CollectionEvent.${ev_id}.containment_status == PENDING_INSPECTION — a PLANNED event is outside the SUSPEND cascade set"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: staffer_half_open_interval_with_trailing_decontamination_buffer
        grounds:
          - validations[priority=23]
          - errors[ERR_STAFFER_INTERVAL_CONFLICT]
          - entities.LaneAssignment.fields.start_utc
          - entities.Staffer.fields.assigned_hours
        distinguishing_aspect: |
          Staffer occupancy uses HALF-OPEN [start, end) geometry with a 30-minute buffer appended to the
          END ONLY — an asymmetric, one-sided widening — so a second assignment starting at 12:29Z
          collides while one starting at exactly 12:30Z (the buffered endpoint) is accepted.
        test_recipe:
          setup:
            - "Program, APPROVED 4-lane site, event 2026-09-12T08:00Z..20:00Z in SITE_CONFIRMED"
            - "Staffer Dana Reyes holds one ACTIVE assignment on lane 1 from 08:00Z to 12:00Z (4.00 h), so her buffered occupancy is [08:00Z, 12:30Z)"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_id: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T12:00:00.000Z" }
              as: EventCoordinator
              captures: { la1: $.data.id, la1_hours: $.data.duration_hours }
          trigger:
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 2, start_utc: "2026-09-12T12:29:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_id}", lane_number: 2, start_utc: "2026-09-12T12:30:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
              captures: { la2: $.data.id, la2_hours: $.data.duration_hours }
          assert:
            - "${la1_hours} == 4.0"
            - "${err} == ERR_STAFFER_INTERVAL_CONFLICT — 12:29Z lands inside the half-open buffered window [08:00Z, 12:30Z)"
            - "HTTP status == 409 for the 12:29Z attempt"
            - "${la2_hours} == 7.5 — starting exactly at the buffered endpoint 12:30Z is accepted"
            - "HTTP status == 201 for the 12:30Z attempt"
            - "Staffer.${staffer_id}.assigned_hours == 11.5"
            - "CollectionEvent.${ev_id}.open_lane_count == 2"
            - "CollectionEvent.${ev_id}.certified_staff_hours == 11.5"

      - name: site_closed_interval_with_symmetric_mobilisation_buffer
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - errors[ERR_SITE_INTERVAL_CONFLICT]
          - entities.CollectionEvent.fields.window_start_utc
        distinguishing_aspect: |
          Site occupancy uses a different geometry from staffer occupancy: CLOSED [start, end] on both
          endpoints widened SYMMETRICALLY by 48 hours on each side, plus an aggregate cap of 2 events per
          calendar month on the same resource row. A new event starting at exactly 2026-09-14T20:00Z —
          the buffered closing endpoint of the 2026-09-12T20:00Z event — collides, while 20:01Z does not.
        test_recipe:
          setup:
            - "Program and one APPROVED site"
            - "One PLANNED event E1 with window 2026-09-12T08:00Z..2026-09-12T20:00Z, so the site's buffered occupancy is the closed interval [2026-09-10T08:00Z, 2026-09-14T20:00Z]"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev1: $.data.id, ev1_date: $.data.event_date }
          trigger:
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-14T20:00:00.000Z", window_end_utc: "2026-09-14T22:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-14T20:01:00.000Z", window_end_utc: "2026-09-14T22:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev2: $.data.id, ev2_date: $.data.event_date, ev2_hours: $.data.window_duration_hours }
          assert:
            - "${ev1_date} == 2026-09-12"
            - "${err} == ERR_SITE_INTERVAL_CONFLICT — a closed interval touching the buffered endpoint at a single instant is a collision"
            - "HTTP status == 409 for the 20:00Z attempt"
            - "${ev2_date} == 2026-09-14 and ${ev2_hours} == 1.98"
            - "HTTP status == 201 for the 20:01Z attempt"
            - "CollectionEvent.${ev2}.lifecycle_status == PLANNED"
            - "CollectionEvent.${ev2}.containment_status == PENDING_INSPECTION"

