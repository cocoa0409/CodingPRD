            - "Account.${a1}.credit_used_cents == 0 and Account.${a2}.credit_used_cents == 0"

  # ===========================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_dye_lot_version_is_refused_then_state_takes_over
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dye-measurement-stale-lot]
          - endpoints[POST /mill/dye-lots/{dye_lot_id}/measurements]
          - errors[ERR_STALE_DYE_LOT_VERSION]
          - validations[priority 10]
        distinguishing_aspect: |
          Three readings against the same lot pin down where OCC sits in the ladder. From DYEING a
          stale expected_dye_lot_version is a clean 412 that mutates nothing — no delta_e, no
          shade_band, no version bump. The matching version then succeeds and bumps the version, so
          the very value that was fresh a moment ago is now stale; replaying it is refused with
          ERR_INVALID_STATE rather than 412, because the state guard at priority 8 outranks the OCC
          guard at priority 10. A test that only ever submits a stale version from a live state
          cannot tell those two orderings apart.
        test_recipe:
          setup:
            - "Piece-dye route: GREIGE run PR-01 off a PIECE_DYED_READY batch, vessel DV-01, dye lot DL-01 charged into the vessel and sitting in DYEING. Clock at 2026-08-06T08:00:00Z."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "PIECE_DYED_READY" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-PD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/dye-vessels"
              payload: { vessel_code: "DV-01", vessel_type: "BECK", capacity_kg: 2000.0 }
              as: DyeHouseOperator
              captures: { dv: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/dye-lots"
              payload: { lot_code: "DL-01", production_run_id: "${pr}", vessel_id: "${dv}", color_code: "PD-BEIGE-01", target_lab_l: 55.00, target_lab_a: 12.00, target_lab_b: -8.00, lot_kg: 1200.0, dye_start_utc: "2026-08-06T08:00:00Z", dye_end_utc: "2026-08-06T16:00:00Z", dyed_yards: 400.0 }
              as: DyeHouseOperator
              captures: { dl: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/dye-lots/${dl}/start-dyeing"
              payload: {}
              as: DyeHouseOperator
              captures: { dlv: $.data.version }
          trigger:
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 40.00, measured_lab_a: 12.00, measured_lab_b: -8.00, expected_dye_lot_version: "${dlv} - 1" }
              as: DyeHouseOperator
            - call: "GET /mill/dye-lots/${dl}"
              payload: {}
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 55.50, measured_lab_a: 12.63, measured_lab_b: -8.00, expected_dye_lot_version: "${dlv}" }
              as: DyeHouseOperator
            - call: "POST /mill/dye-lots/${dl}/measurements"
              payload: { measured_lab_l: 55.50, measured_lab_a: 12.63, measured_lab_b: -8.00, expected_dye_lot_version: "${dlv}" }
              as: DyeHouseOperator
          assert:
            - "the stale reading returns HTTP 412 with error.error_id == ERR_STALE_DYE_LOT_VERSION"
            - "the GET after it shows DyeLot.${dl}.status == DYEING, delta_e == null, shade_band == null, measured_lab_l == null and version == ${dlv} (unchanged)"
            - "the matching reading returns HTTP 200 with status == MEASURED, delta_e == 0.80, shade_band == A and version == ${dlv} + 1"
            - "the replay of the now-stale version returns HTTP 409 with error.error_id == ERR_INVALID_STATE, not 412, because the state guard at priority 8 precedes the OCC guard at priority 10"
            - "DyeLot.${dl}.delta_e is still 0.80 after the refused replay"

      - name: stale_expected_roll_good_version_on_manual_allocation_corner
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[manual-allocation-stale-roll]
          - endpoints[POST /mill/cut-orders/{cut_order_id}/allocations]
          - errors[ERR_STALE_ROLL_GOOD_VERSION]
        distinguishing_aspect: "The second declared OCC rule, on the manual-allocation write path."
        excluded_because:
          difficulty_instance: body_fk_existence_beats_occ_then_occ_beats_yardage_on_manual_allocation
          rationale: "The named §1.8 instance drives the manual allocation with a stale expected_roll_good_version for the 412, with a matching version for the success and with a version bump per write, all inside the three-rule priority ladder."

      - name: multi_hop_cascade_ordering_and_partial_failure_corner
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /mill/dye-lots/{dye_lot_id}/disposition]
          - state_machines.DyeLot.APPROVED_to_REJECTED
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The deepest declared cascade chain, verified end to end with its ordering."
        excluded_because:
          difficulty_instance: dye_lot_rejection_five_hop_cascade_to_style_replenishment_flag
          rationale: "The named §1.8 instance walks DyeLot -> RollGood -> CutAllocation -> CutOrder -> CarpetStyle in one response and pins the ordering by asserting the style's replenishment flag, which can only be right if the four upstream hops ran first."

      - name: both_uncommitted_yardage_variants_and_the_switch_delta_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.dye_lot_uncommitted_yards
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Two variants over identical data, plus the delta as an order moves CUT -> SHIPPED."
        excluded_because:
          difficulty_instance: dye_lot_uncommitted_yards_commitment_aware_vs_shipped_only
          rationale: "The named §1.8 instance asserts both variants diverge on the same reserved yardage and converge again once the order ships, with the delta computed explicitly."

  # ===========================================================================
  # SECTION 9 — CONSISTENCY MODEL
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: allocation_side_effects_are_all_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /mill/cut-orders/{cut_order_id}/allocate]
          - calculations.roll_good_yardage_ledger
          - calculations.cut_order_settlement
          - calculations.account_credit_ledger
        distinguishing_aspect: |
          One auto-allocation touches four entities. Under the declared immediate model the allocate
          response itself must already carry the recomputed order — status, allocated_yards, gross,
          freight, remnant credit and net — and the very next read of the roll and of the account must
          agree with it without any settling period. Every figure is asserted at both observation
          points, so an implementation that recomputes derived fields lazily on the next GET, or that
          returns the pre-allocation snapshot from the action endpoint, fails.
        test_recipe:
          setup:
            - "Solution-dyed style ST-SD-01 at 4275 cents/yard with an ACTIVE DOC_FF_1_70 certificate; PASSED and AVAILABLE roll RG-01 with 200.0 yards; account AC-01 with a 100000000-cent limit and a SUBMITTED 60.0-yard RUNNING_LINE order."
          setup_api_calls:
            - call: "POST /mill/polymer-lots"
              payload: { lot_code: "PL-N66-01", polymer_type: "NYLON_66", received_kg: 5000.000, melt_flow_index: 18.0 }
              as: ExtrusionOperator
              captures: { pl: $.data.id }
            - call: "POST /mill/fiber-batches"
              payload: { batch_code: "FB-01", polymer_lot_id: "${pl}", input_kg: 4000.000, denier_target: 1200.0, filament_count: 72, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01" }
              as: ExtrusionOperator
              captures: { fb: $.data.id }
            - call: "POST /mill/fiber-batches/${fb}/extrude"
              payload: { throughput_g_per_min: 7200.0, spin_speed_m_per_min: 750.0 }
              as: ExtrusionOperator
            - call: "POST /mill/fiber-batches/${fb}/disposition"
              payload: { disposition: "RELEASE" }
              as: ExtrusionOperator
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/tufting-machines"
              payload: { machine_code: "TM-01", native_gauge_code: "G_1_10", min_pile_height_mm: 4.0, max_pile_height_mm: 14.0, changeover_minutes: 0, needle_bar_width_in: 144.0 }
              as: MillPlanner
              captures: { tm: $.data.id }
            - call: "POST /mill/production-runs"
              payload: { run_code: "PR-01", style_id: "${st}", machine_id: "${tm}", fiber_batch_id: "${fb}", scheduled_start_utc: "2026-08-05T08:00:00Z", scheduled_end_utc: "2026-08-05T16:00:00Z" }
              as: MillPlanner
              captures: { pr: $.data.id }
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/production-runs/${pr}/load-setup"
              payload: { gauge_loaded_code: "G_1_10", pile_height_set_mm: 8.0, pattern_repeat_loaded_mm: 300.0, stitch_rate_per_inch: 10.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/complete-greige"
              payload: { greige_yards: 400.0 }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/apply-backing"
              payload: { sbr_pct: 80.0, filler_load_pct: 20.0, cure_temp_c: 150, cure_seconds: 120, secondary_backing_type: "ACTION_BAC" }
              as: MillPlanner
            - call: "POST /mill/production-runs/${pr}/roll-goods"
              payload: { roll_number: "RG-01", width_ft: 12.0, initial_yards: 200.0 }
              as: MillPlanner
              captures: { rg: $.data.id }
            - call: "POST /mill/product-tests"
              payload: { style_id: "${st}", roll_good_id: "${rg}", test_type: "FLAMMABILITY_PILL", result_value: 18.0 }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
              captures: { pt: $.data.id }
            - call: "POST /mill/certifications"
              payload: { style_id: "${st}", cert_type: "DOC_FF_1_70", source_test_ids: ["${pt}"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: CertificationOfficer
              as_user_id: "cert-officer-1"
            - call: "POST /mill/roll-goods/${rg}/qa-disposition"
              payload: { disposition: "RELEASE" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/accounts"
              payload: { account_code: "AC-01", account_type: "DEALER", credit_limit_cents: 100000000 }
              as: MillPlanner
              captures: { ac: $.data.id }
            - call: "POST /mill/cut-orders"
              payload: { order_code: "CO-01", account_id: "${ac}", style_id: "${st}", order_type: "RUNNING_LINE", requested_yards: 60.0, shade_tolerance: "ANY" }
              as: MillPlanner
              captures: { co: $.data.id }
          trigger:
            - call: "POST /mill/cut-orders/${co}/allocate"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/roll-goods/${rg}"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/accounts/${ac}"
              payload: {}
              as: MillPlanner
            - call: "GET /mill/cut-orders/${co}"
              payload: {}
              as: MillPlanner
          assert:
            - "the allocate response itself returns HTTP 200 with data.status == ALLOCATED, data.allocated_yards == 60.0, data.gross_cents == 256500, data.freight_cents == 0, data.remnant_credit_cents == 0 and data.net_invoice_cents == 256500"
            - "GET /mill/cut-orders/${co}/allocations returns exactly one RESERVED line with yards == 60.0, line_cents == 256500, shade_band == SOLUTION and from_remnant == false"
            - "the immediately following roll read shows RollGood.${rg}.available_yards == 140.0 with inventory_status == AVAILABLE (not COMMITTED, since the roll did not reach 0 yards) and qa_status == PASSED"
            - "the immediately following account read shows Account.${ac}.credit_used_cents == 256500 with status == ACTIVE"
            - "the re-read of the order is byte-identical in its computed fields to the allocate response — no value settles late"
