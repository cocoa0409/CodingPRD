                scan_scope: "FULL"
                expected_product_version: "${prod_comp_v}"
              as: ComplianceAnalyst
              captures:
                scan_comp_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_comp_id}"
              as: PlatformAdmin
            - call: "POST /oss-vulnerabilities"
              payload:
                cve_id: "CVE-2024-COMP"
                severity: "CRITICAL"
                cvss_score: 9.8
                published_at: "2026-08-01T00:00:00Z"
                affected_package_url: "pkg:npm/test@1.0.0"
              as: SecurityAnalyst
            - call: "GET /oss-products/${prod_comp_id}/vulnerability-findings"
