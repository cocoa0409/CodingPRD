              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "COLLISION", equipment_item_id: "${it1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 3000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "REPAIR" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/settle"
              payload: {}
              as: UnderwritingManager
              as_user_id: "mgr-1"
          trigger:
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { limit: 100, offset: 0 }
              as: UnderwritingManager
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { ledger: "PREMIUM", limit: 100, offset: 0 }
              as: UnderwritingManager
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { ledger: "LOSS", limit: 100, offset: 0 }
              as: UnderwritingManager
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { entry_type: "ENDORSEMENT_RETURN", limit: 100, offset: 0 }
              as: UnderwritingManager
            - call: "GET /inland-marine/claims/${clm}/ledger-entries"
              payload: { limit: 100, offset: 0 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "trigger[0] HTTP status == 200; 2 rows, total_count == 2, has_more == false, created_at ASC: INITIAL_PREMIUM then CLAIM_SETTLEMENT"
            - "trigger[1] response: 1 row, total_count == 1, entry_type == INITIAL_PREMIUM, ledger == PREMIUM, amount_cents == 180251, claim_id is null"
            - "trigger[2] response: 1 row, total_count == 1, entry_type == CLAIM_SETTLEMENT, ledger == LOSS, amount_cents == 2900000, claim_id == ${clm}, coverage_part_id == ${cp}"
            - "trigger[3] response: 0 rows, total_count == 0 - the REPAIR settlement takes nothing off risk, so no endorsement return exists"
            - "trigger[4] response: 1 row, total_count == 1, that row is the same CLAIM_SETTLEMENT +2900000 reached through the claim FK instead of the policy FK"
            - "after settle: Policy.${pol}.premium_balance_cents == 180251 and incurred_loss_cents == 2900000 - the two ledgers are summed separately and never netted against each other"
            - "after settle: CoveragePart.${cp}.aggregate_paid_net_cents == 2900000 and aggregate_available_cents == 197100000"
            - "after settle: Claim.${clm}.adjustment_status == CLOSED and EquipmentItem.${it1}.status == ACTIVE (a repair leaves the item on risk)"

  # =========================================================================
  - section: errors
    instances:

      - name: corner_not_found_is_namespaced_per_entity_path
        claim_type: Violation → Error
        grounds:
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_COVERAGE_PART_NOT_FOUND]
          - errors[ERR_RATE_RULE_NOT_FOUND]
          - errors[ERR_EQUIPMENT_ITEM_NOT_FOUND]
          - errors[ERR_JOBSITE_NOT_FOUND]
          - errors[ERR_INSTALLATION_FLOATER_NOT_FOUND]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_TRANSIT_SHIPMENT_NOT_FOUND]
          - errors[ERR_VALUE_REPORT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations[priority=30]
          - validations[priority=31]
          - validations[priority=32]
        distinguishing_aspect: "Ten reads with the same syntactically valid but unknown id return 404 with ten DIFFERENT error ids keyed to the path namespace, never a single generic ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Completely empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "The id 00000000-0000-0000-0000-0000000000ff is well formed and belongs to nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /inland-marine/policies/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/coverage-parts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/rate-rules/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Actuary
            - call: "GET /inland-marine/equipment-items/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/jobsites/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/installation-floaters/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/vehicles/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/transit-shipments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/value-reports/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/claims/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Underwriter
          assert:
            - "every trigger returns HTTP status == 404"
            - "trigger[0] error_id == ERR_POLICY_NOT_FOUND"
            - "trigger[1] error_id == ERR_COVERAGE_PART_NOT_FOUND"
            - "trigger[2] error_id == ERR_RATE_RULE_NOT_FOUND"
            - "trigger[3] error_id == ERR_EQUIPMENT_ITEM_NOT_FOUND"
            - "trigger[4] error_id == ERR_JOBSITE_NOT_FOUND"
            - "trigger[5] error_id == ERR_INSTALLATION_FLOATER_NOT_FOUND"
            - "trigger[6] error_id == ERR_VEHICLE_NOT_FOUND"
            - "trigger[7] error_id == ERR_TRANSIT_SHIPMENT_NOT_FOUND"
            - "trigger[8] error_id == ERR_VALUE_REPORT_NOT_FOUND"
            - "trigger[9] error_id == ERR_CLAIM_NOT_FOUND"
            - "all ten responses carry response_type == error with data.error_id and data.message present and data.message non-empty"
            - "the ten error ids are pairwise distinct"

      - name: corner_not_found_also_fires_for_ids_referenced_in_request_bodies
        claim_type: Violation → Error
        grounds:
          - validations[priority=33]
          - validations[priority=34]
          - errors[ERR_JOBSITE_NOT_FOUND]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_LOSS_SUBJECT_NOT_FOUND]
        distinguishing_aspect: "An unknown id in a request BODY is a 404 too, and it is the body-specific id that decides which error fires: assign-jobsite with a bogus jobsite_id gives ERR_JOBSITE_NOT_FOUND, a transit shipment with a bogus vehicle_id gives ERR_VEHICLE_NOT_FOUND, and a claim naming a bogus equipment_item_id gives ERR_LOSS_SUBJECT_NOT_FOUND rather than ERR_EQUIPMENT_ITEM_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "One QUOTED T2_URBAN policy with a SCHEDULED_EQUIPMENT part holding one RATED excavator, plus a TRANSIT part on the same policy - every PATH id in the triggers below resolves, so only the BODY id can be at fault."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
