            - call: "POST /cosmfg/formulas/${fm}/activate"
              as: FormulationChemist
            - call: "POST /cosmfg/production-orders"
              payload: { formula_id: "${fm}", requested_units: 2000 }
              as: CustomerRep
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "PATCH /cosmfg/production-orders/${ord}"
              payload: { requested_units: 1500, expected_production_order_version: "${ord_v}" }
