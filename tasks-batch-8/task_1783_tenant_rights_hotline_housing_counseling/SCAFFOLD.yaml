# =============================================================================
# PRD Benchmark Seed Tables — Tenant Rights Hotline & Housing Counseling
# =============================================================================

scenario: |
  Tenant Rights Hotline & Housing Counseling (HUD-approved housing counseling agency): call intake & issue triage (eviction/habitability/deposit), jurisdiction-specific rights information & script accuracy, referral to legal aid vs self-help resources, follow-up & case escalation for imminent eviction, interpreter access & accessibility, counselor training & information currency, call volume analytics & policy advocacy data, confidentiality & data retention

domain_name: tenant-rights-hotline
api_prefix: /hotline

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency      # OCC on Case.version (notes, referrals) and Caller.version (consents)
    - cascading_side_effects      # script publish -> supersede -> resource outdated -> referral cancel; consent revoke -> referral cancel -> slot release
    - scheduled_actions           # follow-ups, SLA deadlines, consent TTL expiry, retention purge, all driven by logical clock
    - rate_threshold_triggers     # urgency tiers, org weekly capacity, missed-follow-up escalation threshold
  entity_topology: flat           # peer entities with FK references, flat URL paths under /hotline
  state_machine_shape: cyclic     # Case escalation loops, CallSession parallel dimensions, Referral re-route loop
  relationship_patterns:
    - one_to_many
    - self_referential            # Jurisdiction.parent_jurisdiction_id; RightsScript.supersedes_script_id
    - cross_aggregate             # Referral -> LegalAidOrg / SelfHelpResource; Case -> CallSession
  role_model: segregation_of_duties  # script author != publisher; case opener != verifier; supervisor override; DPO-only purge
  consistency_model: immediate    # all changes atomic in single request; computed fields recomputed in-request

# =============================================================================
# Table 1: Entity-Relationship Table
# common_fields: true expands to id (server-minted UUID, identity only, never
# used in business decisions), created_at, updated_at, version (starts 1, +1 on
# every mutation including cascaded side effects).
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: parent_jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; null for STATE, required for COUNTY (parent must be STATE) and CITY (parent must be COUNTY)", constraints: "create-only hierarchy (no re-parenting endpoint exists), so cycles are structurally impossible; level must be exactly one deeper than parent" }
      - { name: code, type: string, source: input, description: "Jurisdiction code, e.g. 'CA', 'CA-LA', 'CA-LA-001'", constraints: "unique across all jurisdictions" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: level, type: enum, source: input, description: "STATE | COUNTY | CITY" }
      - { name: eviction_notice_days, type: integer, source: input, description: "Statutory minimum pay-or-quit notice period in days" }
      - { name: habitability_repair_days, type: integer, source: input, description: "Landlord cure period for habitability complaints, in days" }
      - { name: deposit_cap_months, type: number, source: input, description: "Security deposit cap as a multiple of monthly rent (e.g. 1.5)" }
      - { name: deposit_interest_required, type: boolean, source: input, description: "Whether the jurisdiction requires interest on held deposits" }
      - { name: deposit_interest_rate_pct, type: number, source: input, description: "Annual deposit interest rate in percent (e.g. 5.0); ignored when interest not required" }

  - name: RightsScript
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction this script's guidance applies to" }
      - { name: issue_category, type: enum, source: input, description: "EVICTION | HABITABILITY | DEPOSIT" }
      - { name: version_no, type: integer, source: input, description: "Monotonic version within the (jurisdiction_id, issue_category) chain; must equal supersedes.version_no + 1 when supersedes_script_id is set, else 1" }
      - { name: body, type: string, source: input, description: "Counselor-facing script text" }
      - { name: effective_from, type: datetime, source: system, description: "Set at publish from request payload; must be >= supersedes.effective_from and <= current logical time" }
      - { name: effective_until, type: datetime, source: system, description: "Set to the superseding script's effective_from at supersession; null while current" , constraints: "half-open windows [effective_from, effective_until) never overlap within a chain" }
      - { name: supersedes_script_id, type: string, source: input, description: "FK -> RightsScript.id; the currently-PUBLISHED script this version replaces (null for v1)", constraints: "same (jurisdiction_id, issue_category); target must be PUBLISHED at publish time" }
      - { name: author_counselor_id, type: string, source: system, description: "FK -> Counselor.id; taken from X-User-ID of the creating Counselor" }
      - { name: reviewer_counselor_id, type: string, source: system, description: "FK -> Counselor.id; taken from X-User-ID of the publishing Counselor; must differ from author_counselor_id (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_REVIEW -> PUBLISHED -> SUPERSEDED | RETIRED; IN_REVIEW -> DRAFT revert allowed", default: "DRAFT" }

  - name: SelfHelpResource
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: issue_category, type: enum, source: input, description: "EVICTION | HABITABILITY | DEPOSIT" }
      - { name: title, type: string, source: input, description: "Resource title" }
      - { name: body, type: string, source: input, description: "Caller-facing content" }
      - { name: language_code, type: string, source: input, description: "ISO language code of the content, e.g. 'en', 'es'" }
      - { name: linked_script_id, type: string, source: input, description: "FK -> RightsScript.id; script version whose content this resource derives from; must be PUBLISHED at link time" }
      - { name: status, type: enum, source: system, description: "CURRENT -> OUTDATED -> CURRENT (refresh) cycle; any -> RETIRED", default: "CURRENT" }

  - name: Counselor
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Counselor name" }
      - { name: languages, type: array, source: input, description: "ISO language codes the counselor can serve without an interpreter" }
      - { name: certified_jurisdiction_codes, type: array, source: input, description: "Jurisdiction codes the counselor is HUD-certified to counsel on" }
      - { name: certified_categories, type: array, source: input, description: "Issue categories the counselor is certified for" }
      - { name: certification_expires_at, type: datetime, source: input, description: "HUD certification expiry; assignment/start requires this to be after the current logical time" }
      - { name: is_script_reviewer, type: boolean, source: input, description: "Qualifies the counselor to review/publish scripts", default: false }
      - { name: trained_script_ids, type: array, source: system, description: "Script ids the counselor has passed training on (score >= 80); appended via training-certifications endpoint" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | INACTIVE", default: "ACTIVE" }

  - name: Interpreter
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Interpreter name" }
      - { name: language_code, type: string, source: input, description: "Language this interpreter covers" }

  - name: Caller
    parent: null
    common_fields: true
    fields:
      - { name: alias, type: string, source: input, description: "Pseudonymous handle; real names are never stored" }
      - { name: phone, type: string, source: input, description: "Callback number; must be null when is_anonymous is true", constraints: "null iff is_anonymous" }
      - { name: preferred_language, type: string, source: input, description: "ISO language code for the call" }
      - { name: channel, type: enum, source: input, description: "PHONE | CHAT | TTY | VIDEO" }
      - { name: accessibility_needs, type: array, source: input, description: "Accessibility flags, e.g. TTY, ASL, LARGE_PRINT", default: [] }
      - { name: is_anonymous, type: boolean, source: input, description: "Anonymous callers cannot grant FOLLOW_UP consent and cannot receive follow-ups" }
      - { name: pii_purged, type: boolean, source: system, description: "Set true by an executed PurgeJob; phone nulled and alias overwritten", default: false }
      - { name: do_not_aggregate, type: boolean, source: system, description: "Set true when DATA_SHARING consent is revoked; excludes caller from analytics denominators", default: false }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: caller_id, type: string, source: system, description: "FK -> Caller.id; from path" }
      - { name: consent_type, type: enum, source: input, description: "RECORDING | FOLLOW_UP | LEGAL_AID_RELEASE | DATA_SHARING" }
      - { name: status, type: enum, source: system, description: "GRANTED -> REVOKED | EXPIRED", default: "GRANTED" }
      - { name: granted_at, type: datetime, source: system, description: "Logical time at creation" }
      - { name: expires_at, type: datetime, source: system, description: "= granted_at + TTL_DAYS[consent_type]; TTLs: RECORDING 7, FOLLOW_UP 30, LEGAL_AID_RELEASE 90, DATA_SHARING 365 days" }
      - { name: revoked_at, type: datetime, source: system, description: "Set on revoke; null otherwise" }

  - name: CallSession
    parent: null
    common_fields: true
    fields:
      - { name: caller_id, type: string, source: input, description: "FK -> Caller.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; triaged jurisdiction" }
      - { name: issue_category, type: enum, source: input, description: "EVICTION | HABITABILITY | DEPOSIT; triage outcome" }
      - { name: triage_notes, type: string, source: input, description: "Intake notes", constraints: "optional" }
      - { name: counselor_id, type: string, source: system, description: "FK -> Counselor.id; set on ASSIGNED transition" }
      - { name: interpreter_id, type: string, source: system, description: "FK -> Interpreter.id; set on interpretation REQUEST" }
      - { name: scheduled_start_at, type: datetime, source: system, description: "Interpreter booking window start, from interpretation REQUEST payload" }
      - { name: scheduled_end_at, type: datetime, source: system, description: "Interpreter booking window end (half-open)" }
      - { name: actual_start_at, type: datetime, source: system, description: "Set on ACTIVE transition from logical clock" }
      - { name: actual_end_at, type: datetime, source: system, description: "Set on WRAPPED_UP / DROPPED transition" }
      - { name: queue_wait_seconds, type: integer, source: computed, description: "= actual_start_at - created_at in whole seconds (0 if never started)" }
      - { name: session_status, type: enum, source: system, description: "QUEUED -> ASSIGNED -> ACTIVE -> WRAPPED_UP | DROPPED; QUEUED|ASSIGNED -> ABANDONED", default: "QUEUED" }
      - { name: interpretation_status, type: enum, source: system, description: "Parallel dimension: NOT_REQUIRED -> REQUESTED -> CONNECTED | FAILED; FAILED -> REQUESTED retry (new interpreter)", default: "NOT_REQUIRED" }
      - { name: pinned_script_id, type: string, source: system, description: "FK -> RightsScript.id; current published script for (jurisdiction, category) pinned at ACTIVE time; later supersession does not change it" }
      - { name: failed_interpreter_ids, type: array, source: system, description: "Interpreter ids that FAILED on this session; re-requesting one is rejected", default: [] }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: caller_id, type: string, source: input, description: "FK -> Caller.id" }
      - { name: opened_from_session_id, type: string, source: input, description: "FK -> CallSession.id; session must be ACTIVE or WRAPPED_UP" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: issue_category, type: enum, source: input, description: "EVICTION | HABITABILITY | DEPOSIT" }
      - { name: opened_by_counselor_id, type: string, source: system, description: "FK -> Counselor.id; from X-User-ID; verifier must differ (segregation of duties)" }
      - { name: eviction_notice_date, type: string, source: input, description: "ISO date of the eviction deadline stated on the notice; nullable", constraints: "nullable" }
      - { name: notice_served_at, type: datetime, source: input, description: "When the notice was served; used by the VERIFIED score variant to detect defective notices", constraints: "nullable" }
      - { name: habitability_reported_at, type: datetime, source: input, description: "When the habitability issue was reported to the landlord", constraints: "nullable" }
      - { name: deposit_amount_cents, type: integer, source: input, description: "Deposit held, in cents", constraints: "nullable; required with monthly_rent_cents for deposit exposure" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Monthly rent, in cents", constraints: "nullable" }
      - { name: deposit_days_held, type: integer, source: input, description: "Whole days the deposit has been held", constraints: "nullable" }
      - { name: legal_hold, type: boolean, source: input, description: "Litigation hold; blocks purge of the caller", default: false }
      - { name: priority_score, type: integer, source: computed, description: "0..100 per case_priority_score calculation (variant per score_variant)" }
      - { name: urgency_tier, type: enum, source: computed, description: "STANDARD | ELEVATED | CRITICAL per urgency_tier_from_score thresholds (>= 70 CRITICAL, >= 40 ELEVATED)" }
      - { name: score_variant, type: enum, source: system, description: "PROVISIONAL at intake; VERIFIED after /verify", default: "PROVISIONAL" }
      - { name: verified_by_counselor_id, type: string, source: system, description: "FK -> Counselor.id; set on verify; must differ from opened_by_counselor_id" }
      - { name: missed_follow_up_count, type: integer, source: computed, description: "Count of follow-ups that entered MISSED; feeds priority recompute (+5 each)", default: 0 }
      - { name: required_follow_up_count, type: integer, source: computed, description: "= TIER_FOLLOWUPS[urgency_tier] (STANDARD 1, ELEVATED 2, CRITICAL 3); never retroactively reclassifies existing follow-ups", default: 1 }
      - { name: escalation_level, type: integer, source: system, description: "Number of escalations (manual + auto)", default: 0 }
      - { name: last_escalated_at, type: datetime, source: system, description: "Logical time of the most recent escalation; used by analytics", constraints: "nullable" }
      - { name: deposit_exposure_cents, type: integer, source: computed, description: "Per deposit_exposure_estimate; null unless deposit_amount_cents, monthly_rent_cents and deposit_days_held are all set", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Set on transition to CLOSED; anchors retention eligibility", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN -> IN_PROGRESS <-> PENDING_FOLLOW_UP; IN_PROGRESS <-> ESCALATED; -> RESOLVED -> CLOSED; RESOLVED -> IN_PROGRESS reopen", default: "OPEN" }

  - name: CaseNote
    parent: null
    common_fields: false   # immutable append-only: id + created_at only; no updated_at/version, no update endpoint
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; from path" }
      - { name: counselor_id, type: string, source: system, description: "FK -> Counselor.id; from X-User-ID; null for system-generated notes", constraints: "nullable" }
      - { name: body, type: string, source: input, description: "Note text" }
      - { name: is_confidential, type: boolean, source: input, description: "Confidential notes are excluded from caller-facing exports" }
      - { name: system_generated, type: boolean, source: system, description: "True for notes auto-created by follow-up completion and escalation events", default: false }

  - name: FollowUp
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; from path" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned callback time; must be after current logical time and >= 24h away from any other non-terminal follow-up on the same case" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> DUE -> COMPLETED | MISSED; SCHEDULED -> CANCELLED", default: "SCHEDULED" }
      - { name: completed_at, type: datetime, source: system, description: "Set on COMPLETED", constraints: "nullable" }
      - { name: outcome, type: string, source: system, description: "Required on COMPLETED transition", constraints: "nullable" }
      - { name: auto_created, type: boolean, source: system, description: "True when created by the escalation side effect; cancelled on de-escalation", default: false }
      - { name: required_count_at_schedule, type: integer, source: system, description: "Case.required_follow_up_count in force when this follow-up was scheduled; pins the no-retroactive-reclassification rule" }

  - name: LegalAidOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Organization name" }
      - { name: covered_jurisdiction_codes, type: array, source: input, description: "Jurisdiction codes the org serves" }
      - { name: accepted_categories, type: array, source: input, description: "Issue categories the org accepts" }
      - { name: weekly_capacity, type: integer, source: input, description: "Max new referrals dispatched per ISO week (Monday 00:00:00Z, half-open)" }
      - { name: current_week_reserved, type: integer, source: computed, description: "Count of referrals dispatched in the current ISO week whose current status is DISPATCHED or ACCEPTED" }
      - { name: status, type: enum, source: system, description: "ACTIVE <-> PAUSED", default: "ACTIVE" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; from path" }
      - { name: referral_type, type: enum, source: input, description: "LEGAL_AID | SELF_HELP" }
      - { name: legal_aid_org_id, type: string, source: input, description: "FK -> LegalAidOrg.id; required iff referral_type=LEGAL_AID", constraints: "nullable" }
      - { name: self_help_resource_id, type: string, source: input, description: "FK -> SelfHelpResource.id; required iff referral_type=SELF_HELP", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> DISPATCHED -> ACCEPTED | DECLINED | EXPIRED | CANCELLED; DECLINED -> PROPOSED re-route; PROPOSED -> EXPIRED | CANCELLED", default: "PROPOSED" }
      - { name: sla_dispatch_by, type: datetime, source: system, description: "= created_at + SLA_HOURS[case.urgency_tier at proposal] (CRITICAL 24h, ELEVATED 72h, STANDARD 168h); re-based on re-route" }
      - { name: accept_by, type: datetime, source: system, description: "= dispatched_at + 96h; EXPIRED when sweep passes it", constraints: "nullable" }
      - { name: dispatched_at, type: datetime, source: system, description: "Set on DISPATCHED; determines ISO week for org capacity", constraints: "nullable" }
      - { name: declined_org_ids, type: array, source: system, description: "Org ids that declined; re-route must name an org not in this list", default: [] }
      - { name: cancel_reason, type: enum, source: system, description: "OPERATOR | CONSENT_REVOKED | CONSENT_EXPIRED | SCRIPT_OUTDATED", constraints: "nullable" }

  - name: RetentionPolicy
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; null = applies to all jurisdictions", constraints: "nullable" }
      - { name: issue_category, type: enum, source: input, description: "EVICTION | HABITABILITY | DEPOSIT; null = applies to all categories", constraints: "nullable" }
      - { name: retention_days, type: integer, source: input, description: "Days after the caller's most recent case closure until PII must be purged" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; creating an ACTIVE policy for an occupied (jurisdiction_id, issue_category) pair auto-deactivates the prior one", default: "ACTIVE" }

  - name: PurgeJob
    parent: null
    common_fields: true
    fields:
      - { name: caller_id, type: string, source: system, description: "FK -> Caller.id; target of the purge" }
      - { name: status, type: enum, source: system, description: "PENDING -> EXECUTED | BLOCKED_BY_HOLD; BLOCKED_BY_HOLD -> EXECUTED on re-execute after hold lifted", default: "PENDING" }
      - { name: created_by_sweep, type: boolean, source: system, description: "Jobs are created only by POST /_ops/run_time_sweep", default: true }
      - { name: executed_at, type: datetime, source: system, description: "Set on EXECUTED", constraints: "nullable" }
      - { name: blocked_reason, type: string, source: system, description: "Set when BLOCKED_BY_HOLD", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RightsScript
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /hotline/scripts/{id}/state {to_status: IN_REVIEW}"
        actor: Counselor
        preconditions:
          - "actor's X-User-ID == author_counselor_id (ERR_FORBIDDEN otherwise)"
        side_effects: []
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /hotline/scripts/{id}/state {to_status: DRAFT} (reviewer returns for rework)"
        actor: Counselor
        preconditions:
          - "actor is a Counselor with is_script_reviewer=true"
        side_effects: []
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /hotline/scripts/{id}/state {to_status: PUBLISHED, effective_from: <ts>}"
        actor: Counselor
        preconditions:
          - "actor is a Counselor with is_script_reviewer=true (ERR_FORBIDDEN otherwise)"
          - "actor's X-User-ID != author_counselor_id — segregation of duties (ERR_SCRIPT_REVIEWER_CONFLICT)"
          - "effective_from present, effective_from <= current logical time, and (if supersedes_script_id set) effective_from > supersedes.effective_from (ERR_INVALID_REQUEST)"
          - "if supersedes_script_id set: target status == PUBLISHED and same (jurisdiction_id, issue_category) and version_no == supersedes.version_no + 1 (ERR_SCRIPT_VERSION_CHAIN_BROKEN)"
          - "if supersedes_script_id is null: no other PUBLISHED script exists for (jurisdiction_id, issue_category) (ERR_DUPLICATE_PUBLISHED_SCRIPT) and version_no == 1"
        side_effects:
          - "reviewer_counselor_id := actor X-User-ID; status PUBLISHED"
          - "CASCADE link 1: superseded script (if any) -> SUPERSEDED, effective_until := this script's effective_from"
          - "CASCADE link 2 (from link 1): every SelfHelpResource with linked_script_id == superseded script and status CURRENT -> OUTDATED"
          - "CASCADE link 3 (from link 2): every Referral with self_help_resource_id referencing a newly-OUTDATED resource and status PROPOSED -> CANCELLED with cancel_reason=SCRIPT_OUTDATED"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /hotline/scripts/{id}/state {to_status: RETIRED}"
        actor: HotlineSupervisor
        preconditions: []
        side_effects:
          - "CASCADE: SelfHelpResources linked to this script with status CURRENT -> OUTDATED (and their PROPOSED referrals -> CANCELLED with SCRIPT_OUTDATED, same as publish cascade links 2-3)"
          - "CallSessions that already pinned this script keep pinned_script_id unchanged (grandfathered)"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /hotline/scripts/{id}/state {to_status: RETIRED} (author withdraws)"
        actor: Counselor
        preconditions:
          - "actor's X-User-ID == author_counselor_id"
        side_effects: []

  - entity: SelfHelpResource
    initial_state: CURRENT
    terminal_states: [RETIRED]
    transitions:
      - from: CURRENT
        to: OUTDATED
        trigger: "system cascade: linked RightsScript is SUPERSEDED or RETIRED"
        actor: system
        preconditions: []
        side_effects:
          - "PROPOSED referrals referencing this resource -> CANCELLED (cancel_reason=SCRIPT_OUTDATED)"
      - from: OUTDATED
        to: CURRENT
        trigger: "POST /hotline/self-help-resources/{id}/state {to_status: CURRENT, linked_script_id: <current published script>}"
        actor: Counselor
        preconditions:
          - "new linked_script_id identifies a PUBLISHED RightsScript for this resource's (jurisdiction_id, issue_category) (ERR_SCRIPT_NOT_PUBLISHED)"
        side_effects:
          - "linked_script_id updated to the new script"
      - from: CURRENT
        to: RETIRED
        trigger: "POST /hotline/self-help-resources/{id}/state {to_status: RETIRED}"
        actor: HotlineSupervisor
        preconditions: []
        side_effects:
          - "PROPOSED referrals referencing this resource -> CANCELLED (cancel_reason=OPERATOR)"
      - from: OUTDATED
        to: RETIRED
        trigger: "POST /hotline/self-help-resources/{id}/state {to_status: RETIRED}"
        actor: HotlineSupervisor
        preconditions: []
        side_effects:
          - "PROPOSED referrals referencing this resource -> CANCELLED (cancel_reason=OPERATOR)"

  - entity: Counselor
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /hotline/counselors/{id} {status: SUSPENDED}"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /hotline/counselors/{id} {status: ACTIVE}"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /hotline/counselors/{id} {status: INACTIVE}"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: INACTIVE
        trigger: "PATCH /hotline/counselors/{id} {status: INACTIVE}"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []

  - entity: Caller
    initial_state: null
    terminal_states: []
    transitions: []
    note: "No status enum. Mutations: consent grant/revoke and purge side effects bump Caller.version and updated_at. pii_purged=true blocks consent grants (ERR_CALLER_PII_PURGED)."

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: GRANTED
        to: REVOKED
        trigger: "POST /hotline/consents/{id}/revoke"
        actor: Caller | DataProtectionOfficer
        preconditions:
          - "Caller actor: X-User-ID == consent.caller_id (ERR_FORBIDDEN)"
        side_effects:
          - "revoked_at := now; Caller.version += 1"
          - "CASCADE (FOLLOW_UP): SCHEDULED follow-ups on this caller's cases -> CANCELLED; each such case in PENDING_FOLLOW_UP with no remaining non-terminal follow-ups -> IN_PROGRESS"
          - "CASCADE (LEGAL_AID_RELEASE): PROPOSED and DISPATCHED LEGAL_AID referrals on this caller's cases -> CANCELLED (cancel_reason=CONSENT_REVOKED); each DISPATCHED cancellation releases its org slot (current_week_reserved -1)"
          - "CASCADE (DATA_SHARING): caller.do_not_aggregate := true"
      - from: GRANTED
        to: EXPIRED
        trigger: "system sweep: current logical time > expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE (FOLLOW_UP): same as revoke"
          - "CASCADE (LEGAL_AID_RELEASE): only PROPOSED referrals -> CANCELLED (cancel_reason=CONSENT_EXPIRED); DISPATCHED referrals are allowed to conclude"
          - "CASCADE (DATA_SHARING): caller.do_not_aggregate := true"

  - entity: CallSession
    initial_state: QUEUED   # session_status; interpretation_status starts NOT_REQUIRED
    terminal_states: [WRAPPED_UP, DROPPED, ABANDONED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /hotline/sessions/{id}/state {to_status: ASSIGNED, counselor_id: <id>}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "counselor.status == ACTIVE (ERR_COUNSELOR_INACTIVE)"
          - "counselor.certification_expires_at > now (ERR_CERTIFICATION_EXPIRED)"
          - "counselor.certified_jurisdiction_codes contains session.jurisdiction.code and certified_categories contains session.issue_category (ERR_LANGUAGE_UNSUPPORTED is NOT checked here; wrong cert scope -> ERR_INVALID_REQUEST)"
          - "a PUBLISHED script exists for (jurisdiction_id, issue_category) and counselor.trained_script_ids contains its id (ERR_TRAINING_NOT_CURRENT)"
        side_effects:
          - "counselor_id := payload counselor_id"
      - from: ASSIGNED
        to: ACTIVE
        trigger: "POST /hotline/sessions/{id}/state {to_status: ACTIVE}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "interpretation_status != REQUESTED (ERR_INVALID_STATE — cannot start while awaiting interpreter)"
          - "assigned counselor.status == ACTIVE at this moment (ERR_COUNSELOR_INACTIVE)"
          - "assigned counselor.certification_expires_at > now (ERR_CERTIFICATION_EXPIRED)"
          - "language rule: counselor.languages contains caller.preferred_language OR interpretation_status == CONNECTED (ERR_LANGUAGE_UNSUPPORTED)"
          - "a PUBLISHED script exists for (jurisdiction_id, issue_category) (ERR_SCRIPT_NOT_PUBLISHED) and counselor.trained_script_ids contains it (ERR_TRAINING_NOT_CURRENT)"
        side_effects:
          - "actual_start_at := now; queue_wait_seconds := actual_start_at - created_at (whole seconds)"
          - "pinned_script_id := the current published script id (selector: status PUBLISHED, effective_from <= now, and (effective_until null or now < effective_until); unique per §1.3 script chain invariant)"
      - from: ACTIVE
        to: WRAPPED_UP
        trigger: "POST /hotline/sessions/{id}/state {to_status: WRAPPED_UP}"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects:
          - "actual_end_at := now"
      - from: ACTIVE
        to: DROPPED
        trigger: "POST /hotline/sessions/{id}/state {to_status: DROPPED}"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects:
          - "actual_end_at := now"
      - from: QUEUED
        to: ABANDONED
        trigger: "POST /hotline/sessions/{id}/state {to_status: ABANDONED}"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects: []
      - from: ASSIGNED
        to: ABANDONED
        trigger: "POST /hotline/sessions/{id}/state {to_status: ABANDONED}"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects: []
    parallel_dimension:
      field: interpretation_status
      transitions:
        - from: NOT_REQUIRED
          to: REQUESTED
          trigger: "POST /hotline/sessions/{id}/interpretation {to_status: REQUESTED, interpreter_id, scheduled_start_at, scheduled_end_at}"
          actor: Counselor | HotlineSupervisor
          preconditions:
            - "session_status in {QUEUED, ASSIGNED} (ERR_INVALID_STATE otherwise)"
            - "interpreter.language_code == caller.preferred_language (ERR_INTERPRETER_LANGUAGE_MISMATCH)"
            - "scheduled_end_at > scheduled_start_at (ERR_INVALID_REQUEST)"
            - "no buffered overlap with the interpreter's other booked windows (ERR_INTERPRETER_OVERLAP; see interpreter_window_conflict)"
          side_effects:
            - "interpreter_id, scheduled_start_at, scheduled_end_at set on the session"
        - from: REQUESTED
          to: CONNECTED
          trigger: "POST /hotline/sessions/{id}/interpretation {to_status: CONNECTED}"
          actor: Counselor | HotlineSupervisor
          preconditions: []
          side_effects: []
        - from: REQUESTED
          to: FAILED
          trigger: "POST /hotline/sessions/{id}/interpretation {to_status: FAILED}"
          actor: Counselor | HotlineSupervisor
          preconditions: []
          side_effects:
            - "interpreter_id appended to failed_interpreter_ids; interpreter_id/scheduled window cleared"
        - from: FAILED
          to: REQUESTED
          trigger: "POST /hotline/sessions/{id}/interpretation {to_status: REQUESTED, interpreter_id, ...} (retry)"
          actor: Counselor | HotlineSupervisor
          preconditions:
            - "payload interpreter_id not in failed_interpreter_ids (ERR_INTERPRETER_PREVIOUSLY_FAILED)"
            - "same language/overlap/window checks as initial REQUEST"
          side_effects:
            - "interpreter_id, scheduled window set"
        - from: FAILED
          to: NOT_REQUIRED
          trigger: "POST /hotline/sessions/{id}/interpretation {to_status: NOT_REQUIRED} (caller opts to proceed without interpreter)"
          actor: Counselor | HotlineSupervisor
          preconditions: []
          side_effects: []
    note: "Two independent dimensions on one row; ACTIVE is gated on the interpretation dimension. Terminal session states freeze both dimensions."

  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /hotline/cases/{id}/state {to_status: IN_PROGRESS}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "a PUBLISHED RightsScript exists for (jurisdiction_id, issue_category) (ERR_SCRIPT_NOT_PUBLISHED) — no counseling without current, accurate information"
        side_effects: []
      - from: IN_PROGRESS
        to: PENDING_FOLLOW_UP
        trigger: "system: a FollowUp is created (auto-transition)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_FOLLOW_UP
        to: IN_PROGRESS
        trigger: "system: a follow-up is COMPLETED or CANCELLED and no other non-terminal follow-ups remain (bubble-up)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "POST /hotline/cases/{id}/state {to_status: ESCALATED}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "score_variant == VERIFIED (ERR_CASE_NOT_VERIFIED)"
          - "urgency_tier == CRITICAL (ERR_INVALID_STATE — only imminent-eviction-grade cases escalate manually)"
        side_effects:
          - "escalation_level += 1; last_escalated_at := now"
          - "CASCADE: auto-create FollowUp(scheduled_for = now + 24h, auto_created = true, required_count_at_schedule = required_follow_up_count)"
          - "CASCADE: system-generated CaseNote recording the escalation (bumps Case.version)"
      - from: ESCALATED
        to: IN_PROGRESS
        trigger: "POST /hotline/cases/{id}/state {to_status: IN_PROGRESS} (de-escalate)"
        actor: HotlineSupervisor
        preconditions: []
        side_effects:
          - "COMPENSATION: SCHEDULED follow-ups with auto_created=true -> CANCELLED"
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /hotline/cases/{id}/state {to_status: RESOLVED}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "no follow-ups in SCHEDULED or DUE (ERR_CASE_HAS_OPEN_ITEMS)"
          - "no referrals in PROPOSED or DISPATCHED (ERR_CASE_HAS_OPEN_ITEMS)"
        side_effects: []
      - from: PENDING_FOLLOW_UP
        to: RESOLVED
        trigger: "POST /hotline/cases/{id}/state {to_status: RESOLVED}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "no follow-ups in SCHEDULED or DUE (ERR_CASE_HAS_OPEN_ITEMS)"
          - "no referrals in PROPOSED or DISPATCHED (ERR_CASE_HAS_OPEN_ITEMS)"
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /hotline/cases/{id}/state {to_status: RESOLVED}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "no follow-ups in SCHEDULED or DUE (ERR_CASE_HAS_OPEN_ITEMS)"
          - "no referrals in PROPOSED or DISPATCHED (ERR_CASE_HAS_OPEN_ITEMS)"
        side_effects: []
      - from: RESOLVED
        to: IN_PROGRESS
        trigger: "POST /hotline/cases/{id}/state {to_status: IN_PROGRESS} (reopen)"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects:
          - "priority_score recomputed (missed_follow_up_count retained)"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /hotline/cases/{id}/state {to_status: CLOSED}"
        actor: HotlineSupervisor
        preconditions: []
        side_effects:
          - "closed_at := now (anchors retention eligibility)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /hotline/cases/{id}/state {to_status: CLOSED} (no-merit close)"
        actor: HotlineSupervisor
        preconditions: []
        side_effects:
          - "closed_at := now"
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "system: auto-escalation when a follow-up MISSED recompute yields tier CRITICAL and score_variant == VERIFIED"
        actor: system
        preconditions:
          - "score_variant == VERIFIED (unverified cases recompute score but do not auto-escalate)"
        side_effects:
          - "same side effects as manual escalation (level, timestamp, auto follow-up, system note)"
      - from: PENDING_FOLLOW_UP
        to: ESCALATED
        trigger: "system: auto-escalation when a follow-up MISSED recompute yields tier CRITICAL and score_variant == VERIFIED"
        actor: system
        preconditions:
          - "score_variant == VERIFIED (unverified cases recompute score but do not auto-escalate)"
        side_effects:
          - "same side effects as manual escalation (level, timestamp, auto follow-up, system note)"

  - entity: CaseNote
    initial_state: null
    terminal_states: []
    transitions: []
    note: "Append-only. Creating a note requires expected_case_version == current Case.version (OCC); success bumps Case.version by 1. No update or delete."

  - entity: FollowUp
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system sweep: now >= scheduled_for"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE
        to: COMPLETED
        trigger: "POST /hotline/follow-ups/{id}/state {to_status: COMPLETED, outcome: <text>}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "outcome present (ERR_INVALID_REQUEST)"
        side_effects:
          - "completed_at := now; outcome stored"
          - "CASCADE link 1: system-generated CaseNote on the parent case (bumps Case.version)"
          - "CASCADE link 2 (from link 1's case evaluation): if case is PENDING_FOLLOW_UP and no other non-terminal follow-ups remain -> case -> IN_PROGRESS"
      - from: DUE
        to: MISSED
        trigger: "system sweep: now > scheduled_for + 48h"
        actor: system
        preconditions: []
        side_effects:
          - "case.missed_follow_up_count += 1"
          - "CASCADE: priority_score recomputed (+5 per miss); if recompute crosses into CRITICAL, required_follow_up_count updates for future scheduling only (no retroactive reclassification)"
          - "CASCADE: if score_variant == VERIFIED and new tier == CRITICAL and case status in {IN_PROGRESS, PENDING_FOLLOW_UP} -> auto-escalation (see Case auto-escalation side effects); already-ESCALATED cases do not re-escalate (no double escalation)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hotline/follow-ups/{id}/state {to_status: CANCELLED} OR system cascade (consent revoke/expiry, de-escalation)"
        actor: Counselor | HotlineSupervisor | system
        preconditions: []
        side_effects:
          - "if case is PENDING_FOLLOW_UP and no other non-terminal follow-ups remain -> case -> IN_PROGRESS"

  - entity: LegalAidOrg
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "PATCH /hotline/legal-aid-orgs/{id} {status: PAUSED}"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "in-flight DISPATCHED referrals are unaffected; new dispatches blocked (ERR_ORG_NOT_ACCEPTING)"
      - from: PAUSED
        to: ACTIVE
        trigger: "PATCH /hotline/legal-aid-orgs/{id} {status: ACTIVE}"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []

  - entity: Referral
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, EXPIRED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: DISPATCHED
        trigger: "POST /hotline/referrals/{id}/state {to_status: DISPATCHED}"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "now <= sla_dispatch_by (ERR_SLA_BREACHED)"
          - "LEGAL_AID: org.status == ACTIVE (ERR_ORG_NOT_ACCEPTING)"
          - "LEGAL_AID: org.current_week_reserved < org.weekly_capacity (ERR_ORG_CAPACITY_FULL; == capacity rejects)"
        side_effects:
          - "dispatched_at := now; accept_by := now + 96h"
          - "LEGAL_AID: org slot consumed (current_week_reserved +1 — conserved per org_weekly_capacity invariant)"
      - from: DISPATCHED
        to: ACCEPTED
        trigger: "POST /hotline/referrals/{id}/state {to_status: ACCEPTED}"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects:
          - "slot remains consumed (ACCEPTED still counts in current_week_reserved)"
      - from: DISPATCHED
        to: DECLINED
        trigger: "POST /hotline/referrals/{id}/state {to_status: DECLINED}"
        actor: Counselor | HotlineSupervisor
        preconditions: []
        side_effects:
          - "org id appended to declined_org_ids"
          - "COMPENSATION: org slot released (current_week_reserved -1)"
      - from: DECLINED
        to: PROPOSED
        trigger: "POST /hotline/referrals/{id}/state {to_status: PROPOSED, legal_aid_org_id: <new org>} (re-route)"
        actor: Counselor | HotlineSupervisor
        preconditions:
          - "new legal_aid_org_id present, not in declined_org_ids (ERR_INVALID_REQUEST)"
          - "new org covers case jurisdiction + category (ERR_ORG_COVERAGE_MISMATCH)"
          - "caller's LEGAL_AID_RELEASE consent status == GRANTED (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "legal_aid_org_id := new org; sla_dispatch_by := now + SLA_HOURS[case.urgency_tier]"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system sweep: now > sla_dispatch_by"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: EXPIRED
        trigger: "system sweep: now > accept_by"
        actor: system
        preconditions: []
        side_effects:
          - "COMPENSATION: org slot released (current_week_reserved -1)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /hotline/referrals/{id}/state {to_status: CANCELLED} OR system cascade (consent revoke/expiry, resource outdated/retired)"
        actor: Counselor | HotlineSupervisor | system
        preconditions: []
        side_effects:
          - "cancel_reason set (OPERATOR | CONSENT_REVOKED | CONSENT_EXPIRED | SCRIPT_OUTDATED)"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /hotline/referrals/{id}/state {to_status: CANCELLED} OR system cascade (LEGAL_AID_RELEASE consent REVOKED only)"
        actor: Counselor | HotlineSupervisor | system
        preconditions: []
        side_effects:
          - "cancel_reason set"
          - "COMPENSATION: org slot released (current_week_reserved -1)"

  - entity: PurgeJob
    initial_state: PENDING
    terminal_states: [EXECUTED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /hotline/purge-jobs/{id}/execute"
        actor: DataProtectionOfficer
        preconditions:
          - "no case of the caller has legal_hold == true (otherwise transition to BLOCKED_BY_HOLD, not an error)"
          - "caller is retention-eligible: exists >= 1 CLOSED case and now >= max(closed_at) + applicable_policy.retention_days (ERR_RETENTION_NOT_EXPIRED); boundary is inclusive (>=)"
        side_effects:
          - "caller.phone := null; caller.alias := 'purged'; caller.pii_purged := true"
          - "CASCADE: caller's GRANTED consents -> EXPIRED (their normal expiry cascades apply)"
          - "executed_at := now"
      - from: PENDING
        to: BLOCKED_BY_HOLD
        trigger: "POST /hotline/purge-jobs/{id}/execute while any caller case has legal_hold == true"
        actor: DataProtectionOfficer
        preconditions: []
        side_effects:
          - "blocked_reason := 'LEGAL_HOLD'"
      - from: BLOCKED_BY_HOLD
        to: EXECUTED
        trigger: "POST /hotline/purge-jobs/{id}/execute after the hold is lifted"
        actor: DataProtectionOfficer
        preconditions:
          - "same eligibility checks as PENDING -> EXECUTED"
        side_effects:
          - "same scrub side effects as PENDING -> EXECUTED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serial-observable stale-version checks)
# =============================================================================
concurrency_rules:
  - rule_id: note-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /hotline/cases/{id}/notes"
    occ_field: expected_case_version
    description: |
      Creating a CaseNote against a Case whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just added a note, created a referral, or triggered a cascade
      that legitimately advanced the case, and the current writer's view of the
      case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: referral-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /hotline/cases/{id}/referrals"
    occ_field: expected_case_version
    description: |
      Creating a Referral against a Case whose version has advanced since the
      client last observed it is rejected. A referral commits case facts (tier,
      SLA baseline) that were computed from the observed version; a stale view
      would anchor the referral to superseded facts.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: consent-grant-stale-caller
    parent_entity: Caller
    write_endpoint: "POST /hotline/callers/{id}/consents"
    occ_field: expected_caller_version
    description: |
      Granting a ConsentRecord against a Caller whose version has advanced
      since the client last observed it is rejected. Consent grants supersede
      the caller's consent posture; a stale view would silently re-grant on top
      of a revocation or purge side effect the caller just performed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: case_priority_score
    trigger: "Case create, Case PATCH (facts), verify, follow-up MISSED side effect, case reopen"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned (see follow_up_cadence for the circular-break rule).
      base = 0
      # (1) eviction component — tiered on days-to-deadline
      if eviction_notice_date is not null:
          d = (eviction_notice_date - current_date) in whole calendar days   # may be negative
          if d <= 5:        ev = 50
          elif d <= 14:     ev = 30
          elif d <= 30:     ev = 15
          else:             ev = 0
          # VERIFIED variant only: defective-notice halving
          if score_variant-target == VERIFIED and notice_served_at is not null:
              given_days = (eviction_notice_date - date(notice_served_at)) in whole days
              if given_days < jurisdiction.eviction_notice_days: ev = floor(ev / 2)
          base += ev
      # (2) habitability component — conditional on landlord cure period
      if habitability_reported_at is not null:
          h = (current_time - habitability_reported_at) in whole days
          if h > 2 * jurisdiction.habitability_repair_days:      base += 25
          elif h > jurisdiction.habitability_repair_days:        base += 15
      # (3) deposit component
      if deposit_amount_cents is not null and monthly_rent_cents is not null:
          cap = monthly_rent_cents * jurisdiction.deposit_cap_months
          if deposit_amount_cents > cap: base += 10
      # (4) history components
      base += missed_follow_up_count * 5
      if score_variant-target == VERIFIED:
          base += escalation_level * 8
      priority_score = min(100, max(0, base))
    input_set: "The case's fact fields plus its jurisdiction row; missed_follow_up_count and escalation_level from the case itself"
    constants:
      EV_TIER1_DAYS: 5
      EV_TIER1_POINTS: 50
      EV_TIER2_DAYS: 14
      EV_TIER2_POINTS: 30
      EV_TIER3_DAYS: 30
      EV_TIER3_POINTS: 15
      HAB_OVERDUE_POINTS: 15
      HAB_EGREGIOUS_POINTS: 25
      DEPOSIT_OVER_CAP_POINTS: 10
      MISS_PENALTY: 5
      ESCALATION_HISTORY_POINTS: 8
      SCORE_MIN: 0
      SCORE_MAX: 100
    precision: "integer; no rounding"
    variants:
      - name: PROVISIONAL
        when: "At intake and on every PATCH before verification (score_variant == PROVISIONAL)"
        difference: "Ignores notice_served_at (no defective-notice halving) and ignores escalation_level; self-reported facts only"
      - name: VERIFIED
        when: "Recomputed at /verify and on every subsequent recompute trigger (score_variant == VERIFIED)"
        difference: "Applies defective-notice halving of the eviction component and adds escalation_level * 8; identical stored facts can therefore yield a different score than PROVISIONAL"

  - name: urgency_tier_from_score
    trigger: "Immediately after every case_priority_score recompute (same request)"
    algorithm: threshold
    formula: |
      if priority_score >= 70: urgency_tier = CRITICAL
      elif priority_score >= 40: urgency_tier = ELEVATED
      else: urgency_tier = STANDARD
      # Boundaries are inclusive-up: exactly 70 -> CRITICAL, exactly 40 -> ELEVATED, exactly 39 -> STANDARD.
    input_set: "case.priority_score"
    constants:
      CRITICAL_MIN: 70
      ELEVATED_MIN: 40
    precision: "n/a (enum)"
    variants: []

  - name: deposit_exposure_estimate
    trigger: "Case create and Case PATCH whenever deposit_amount_cents, monthly_rent_cents and deposit_days_held are all set (else field is null)"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: each component is rounded to integer cents
      # (round_half_up) BEFORE summation. Summing unrounded components and
      # rounding once at the end is NON-CONFORMANT and yields different cents.
      cap_cents      = round_half_up(monthly_rent_cents * jurisdiction.deposit_cap_months)   # already integer-safe
      over_cap_cents = max(0, deposit_amount_cents - cap_cents)
      if jurisdiction.deposit_interest_required:
          interest_cents = round_half_up(deposit_amount_cents * jurisdiction.deposit_interest_rate_pct * deposit_days_held / 36500)
      else:
          interest_cents = 0
      penalty_cents  = round_half_up(over_cap_cents * PENALTY_MULTIPLIER)
      deposit_exposure_cents = over_cap_cents + interest_cents + penalty_cents
    input_set: "The case's deposit fields plus its jurisdiction row"
    constants:
      PENALTY_MULTIPLIER: 1.5
      DAYS_PER_YEAR_CENTI: 36500    # rate in percent * days / 36500
    precision: "integer cents, round_half_up per component before summation (pinned order)"
    variants: []

  - name: follow_up_cadence
    trigger: "urgency_tier change (same request as the score recompute)"
    algorithm: constraint_propagation
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY, pinned evaluation order:
      #   score -> tier -> required_follow_up_count
      # Missed follow-ups raise the NEXT score recompute (+5 each); a higher
      # tier raises required_follow_up_count; but required/completed/missed
      # classification of EXISTING follow-ups is evaluated against
      # required_count_at_schedule captured when each follow-up was created.
      # A tier change NEVER retroactively reclassifies a COMPLETED or MISSED
      # follow-up.
      required_follow_up_count = TIER_FOLLOWUPS[urgency_tier]
    input_set: "case.urgency_tier"
    constants:
      TIER_FOLLOWUPS: { STANDARD: 1, ELEVATED: 2, CRITICAL: 3 }
    precision: "integer"
    variants: []

  - name: call_volume_metrics
    trigger: "GET /hotline/analytics/call-volume (computed on read over the request window [from_iso8601, to_iso8601), optional jurisdiction/category filters)"
    algorithm: aggregation
    formula: |
      # Inclusion filter (pinned): sessions with session_status in
      # {ACTIVE, WRAPPED_UP, DROPPED} (i.e., reached ACTIVE at least once)
      # and actual_start_at in [from, to). QUEUED-only/ABANDONED-never-started
      # sessions are excluded. Sessions whose caller has do_not_aggregate=true
      # are excluded from BOTH variants.
      eligible = sessions filtered as above (+ optional jurisdiction_id / issue_category)
      escalated = cases with last_escalated_at in [from, to) (+ same filters)
      if view == RAW:
          call_count = count(eligible)
      if view == DEDUPLICATED:
          call_count = count(distinct caller_id among eligible where caller.is_anonymous == false)
                     + count(eligible where caller.is_anonymous == true)   # anonymous callers cannot be deduplicated: each session counts 1
      escalated_case_count = count(escalated)
      escalation_rate = (call_count == 0) ? 0 : round_half_up(escalated_case_count / call_count, 4)
    input_set: "CallSessions reaching ACTIVE in the window; Cases escalated in the window"
    constants:
      RATE_DECIMALS: 4
    precision: "escalation_rate: 4 decimal places, round_half_up; zero denominator yields rate 0"
    variants:
      - name: RAW
        when: "view=RAW (default)"
        difference: "Counts every eligible session; denominator is total sessions"
      - name: DEDUPLICATED
        when: "view=DEDUPLICATED"
        difference: "Counts each identified caller once plus one per anonymous session; same window and same filters can yield a smaller denominator and therefore a different escalation_rate"

  - name: interpreter_window_conflict
    trigger: "interpretation REQUEST (initial or retry) on a CallSession"
    algorithm: interval_merge
    formula: |
      # Buffered half-open interval overlap on the interpreter resource.
      # Existing bookings: sessions of the same interpreter with
      # interpretation_status in {REQUESTED, CONNECTED} and session_status in
      # {QUEUED, ASSIGNED, ACTIVE}. Windows are half-open [start, end).
      conflict(new [s, e)) iff exists existing [s2, e2):
          s < e2 + BUFFER_MINUTES  AND  s2 < e + BUFFER_MINUTES
      # Consequences (pinned):
      #   back-to-back (s == e2) CONFLICTS, because s < e2 + 10.
      #   exactly one buffer apart (s == e2 + 10) does NOT conflict.
    input_set: "All sessions sharing the interpreter, in the states listed above"
    constants:
      BUFFER_MINUTES: 10
    precision: "minute granularity on ISO timestamps"
    variants: []

  - name: org_weekly_capacity
    trigger: "Referral DISPATCHED transition (LEGAL_AID) and any read of LegalAidOrg.current_week_reserved"
    algorithm: waterfall_allocation
    formula: |
      # Aggregate capacity over an ISO-week window — NOT pairwise overlap.
      # Week: Monday 00:00:00.000Z (inclusive) .. next Monday 00:00:00.000Z
      # (exclusive). A dispatch exactly at Monday 00:00:00Z belongs to the
      # NEW week.
      current_week_reserved(org, t) =
          count of referrals with legal_aid_org_id == org.id
            and dispatched_at in iso_week_of(t)
            and current status in {DISPATCHED, ACCEPTED}
      dispatch allowed iff current_week_reserved < weekly_capacity
      # Boundary: reserved == capacity rejects; reserved == capacity - 1 takes the last slot.
      # DECLINED / EXPIRED / CANCELLED referrals release the slot immediately
      # (status leaves the counted set) — the compensating half of the invariant.
    input_set: "Referrals of the org dispatched in the current ISO week"
    constants: {}
    precision: "integer count"
    variants: []

  - name: script_effective_window
    trigger: "RightsScript publish"
    algorithm: interval_merge
    formula: |
      # Gapless half-open supersession chain per (jurisdiction_id, issue_category).
      on publish(new):
          require new.effective_from <= now and new.effective_from > supersedes.effective_from
          supersedes.effective_until := new.effective_from
          supersedes.status := SUPERSEDED
      INVARIANT (conserved across publish pairs):
          (a) at most one PUBLISHED script per (jurisdiction_id, issue_category);
          (b) windows [effective_from, effective_until) across the chain are
              non-overlapping and gapless: each superseded window's
              effective_until equals its successor's effective_from.
      current_script(jurisdiction, category, t) selector:
          the PUBLISHED script with effective_from <= t and
          (effective_until is null or t < effective_until); unique by (a)+(b).
    input_set: "RightsScripts of one (jurisdiction_id, issue_category) chain"
    constants: {}
    precision: "ISO timestamps to the second"
    variants: []

  - name: retention_eligibility
    trigger: "POST /_ops/run_time_sweep (job creation) and POST /hotline/purge-jobs/{id}/execute (re-check)"
    algorithm: chronological
    formula: |
      # Applicable-policy PRECEDENCE CHAIN for a case with (J=case.jurisdiction_id, C=case.issue_category),
      # considering ACTIVE policies only:
      #   1. (jurisdiction_id == J, issue_category == C)
      #   2. (jurisdiction_id == J, issue_category null)
      #   3. (jurisdiction_id null, issue_category == C)
      #   4. (jurisdiction_id null, issue_category null)   # agency default
      # First match wins. No ACTIVE policy at any level -> caller not eligible.
      anchor(caller) = max(closed_at over caller's cases with status CLOSED)   # null if none
      policy = applicable policy for the anchor case's (J, C)
      eligible(caller, t) = anchor is not null
                            and t >= anchor + policy.retention_days   # boundary inclusive
                            and caller.pii_purged == false
                            and no PENDING PurgeJob exists for the caller (dedup)
    input_set: "Callers with at least one CLOSED case; ACTIVE RetentionPolicies"
    constants: {}
    precision: "day granularity; boundary >= (eligible exactly at anchor + retention_days)"
    variants: []

  - name: follow_up_timing
    trigger: "POST /_ops/run_time_sweep"
    algorithm: threshold
    formula: |
      for each follow-up:
          if status == SCHEDULED and t >= scheduled_for: -> DUE            # inclusive boundary
          if status == DUE and t > scheduled_for + DUE_WINDOW_HOURS: -> MISSED   # STRICT >: exactly at the window edge stays DUE
      # A single sweep may move SCHEDULED -> DUE -> MISSED if both conditions hold.
    input_set: "Non-terminal FollowUps"
    constants:
      DUE_WINDOW_HOURS: 48
    precision: "second granularity"
    variants: []

  - name: consent_ttl
    trigger: "ConsentRecord create; POST /_ops/run_time_sweep"
    algorithm: threshold
    formula: |
      expires_at = granted_at + TTL_DAYS[consent_type]
      sweep: GRANTED and t > expires_at -> EXPIRED   # STRICT >: exactly at expires_at remains GRANTED
    input_set: "GRANTED ConsentRecords"
    constants:
      TTL_DAYS: { RECORDING: 7, FOLLOW_UP: 30, LEGAL_AID_RELEASE: 90, DATA_SHARING: 365 }
    precision: "second granularity"
    variants: []

  - name: queue_wait_seconds
    trigger: "CallSession ACTIVE transition"
    algorithm: aggregation
    formula: |
      queue_wait_seconds = floor(actual_start_at - created_at) in whole seconds
      # Sessions that never reach ACTIVE report 0.
    input_set: "The session row"
    constants: {}
    precision: "integer seconds"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present except for role Anonymous"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; transition-level actor restrictions (e.g., case de-escalation and CLOSED transitions and script/resource RETIRED are HotlineSupervisor-only even though the endpoint role list is wider); ownership checks: Caller role must act on own record (X-User-ID == path caller id or consent.caller_id); Counselor submit/withdraw on own scripts only (X-User-ID == author_counselor_id); training-certifications actor must differ from the subject counselor"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Segregation of duties on script publish: actor is a Counselor with is_script_reviewer=true AND X-User-ID != script.author_counselor_id; and on case verify: X-User-ID != case.opened_by_counselor_id"
    error_id: ERR_SCRIPT_REVIEWER_CONFLICT
    http_status: 403
    applies_to: "POST /hotline/scripts/{id}/state (PUBLISHED), POST /hotline/cases/{id}/verify"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right (jurisdiction, caller, session, case, note parent, follow-up, org, referral, script, resource, counselor, interpreter, consent, policy, purge-job)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: business_constraint
    check: "Schema: required fields present; unknown payload fields rejected; enum membership; types; jurisdiction level/parent consistency (STATE has null parent; COUNTY parent is STATE; CITY parent is COUNTY — else ERR_JURISDICTION_LEVEL_MISMATCH); referral type/target coherence (LEGAL_AID requires legal_aid_org_id and forbids self_help_resource_id; SELF_HELP the reverse — else ERR_REFERRAL_TARGET_MISMATCH); anonymous caller must have null phone; case caller_id must equal the referenced session's caller_id"
    error_id: ERR_INVALID_REQUEST
    http_status: "400/422"
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_case_version / expected_caller_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hotline/cases/{id}/notes, POST /hotline/cases/{id}/referrals, POST /hotline/callers/{id}/consents"
  - priority: 7
    category: state
    check: "State-machine legality: transition listed for current state (terminal states reject everything); parallel-dimension gate (ACTIVE forbidden while interpretation REQUESTED); case status gates on create-note/create-referral (case must be IN_PROGRESS, PENDING_FOLLOW_UP or ESCALATED for referrals); session must be ACTIVE or WRAPPED_UP to open a case"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state and child-creation endpoints"
  - priority: 8
    category: state
    check: "Derived-state gate: manual escalation requires score_variant == VERIFIED"
    error_id: ERR_CASE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /hotline/cases/{id}/state (ESCALATED)"
  - priority: 9
    category: business_safety
    check: "Safety/compliance first among business rules, in this order: anonymous-caller follow-up or FOLLOW_UP consent (ERR_ANONYMOUS_FOLLOW_UP_FORBIDDEN); action on PII-purged caller (ERR_CALLER_PII_PURGED); counselor not ACTIVE (ERR_COUNSELOR_INACTIVE); counselor certification expired (ERR_CERTIFICATION_EXPIRED); counselor training not current on the published script (ERR_TRAINING_NOT_CURRENT); counselor/caller language without interpreter (ERR_LANGUAGE_UNSUPPORTED); interpreter language mismatch (ERR_INTERPRETER_LANGUAGE_MISMATCH)"
    error_id: "ERR_ANONYMOUS_FOLLOW_UP_FORBIDDEN / ERR_CALLER_PII_PURGED / ERR_COUNSELOR_INACTIVE / ERR_CERTIFICATION_EXPIRED / ERR_TRAINING_NOT_CURRENT / ERR_LANGUAGE_UNSUPPORTED / ERR_INTERPRETER_LANGUAGE_MISMATCH"
    http_status: "409/422"
    applies_to: "session assignment/start, interpretation request, follow-up creation, consent creation"
  - priority: 10
    category: business_temporal
    check: "Deadlines and windows: dispatch after sla_dispatch_by (ERR_SLA_BREACHED); follow-up scheduled_for in the past or < 24h from a sibling non-terminal follow-up (ERR_FOLLOW_UP_TOO_SOON); purge before retention expiry (ERR_RETENTION_NOT_EXPIRED)"
    error_id: "ERR_SLA_BREACHED / ERR_FOLLOW_UP_TOO_SOON / ERR_RETENTION_NOT_EXPIRED"
    http_status: 409
    applies_to: "referral dispatch, follow-up creation, purge execute"
  - priority: 11
    category: business_referential
    check: "Referenced-entity state: missing/EXPIRED LEGAL_AID_RELEASE consent (ERR_CONSENT_REQUIRED); no PUBLISHED script for pair (ERR_SCRIPT_NOT_PUBLISHED); SELF_HELP resource not CURRENT (ERR_RESOURCE_OUTDATED); org PAUSED (ERR_ORG_NOT_ACCEPTING); org does not cover jurisdiction+category (ERR_ORG_COVERAGE_MISMATCH); case close/resolve with open follow-ups or referrals (ERR_CASE_HAS_OPEN_ITEMS)"
    error_id: "ERR_CONSENT_REQUIRED / ERR_SCRIPT_NOT_PUBLISHED / ERR_RESOURCE_OUTDATED / ERR_ORG_NOT_ACCEPTING / ERR_ORG_COVERAGE_MISMATCH / ERR_CASE_HAS_OPEN_ITEMS"
    http_status: "409/422"
    applies_to: "referral create/dispatch/re-route, case IN_PROGRESS/RESOLVED transitions, session start, resource refresh"
  - priority: 12
    category: business_constraint
    check: "Aggregate/constraint rules last: interpreter buffered overlap (ERR_INTERPRETER_OVERLAP); interpreter previously failed on this session (ERR_INTERPRETER_PREVIOUSLY_FAILED); org weekly capacity exhausted (ERR_ORG_CAPACITY_FULL); duplicate PUBLISHED script for pair (ERR_DUPLICATE_PUBLISHED_SCRIPT); broken supersession chain (ERR_SCRIPT_VERSION_CHAIN_BROKEN)"
    error_id: "ERR_INTERPRETER_OVERLAP / ERR_INTERPRETER_PREVIOUSLY_FAILED / ERR_ORG_CAPACITY_FULL / ERR_DUPLICATE_PUBLISHED_SCRIPT / ERR_SCRIPT_VERSION_CHAIN_BROKEN"
    http_status: 409
    applies_to: "interpretation request, referral dispatch, script publish"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Jurisdiction ---
  - { method: POST, path: "/hotline/jurisdictions", description: "Create a jurisdiction (STATE/COUNTY/CITY with statutory parameters)", roles: [AgencyAdmin], code: 201, input: ["parent_jurisdiction_id?", code, name, level, eviction_notice_days, habitability_repair_days, deposit_cap_months, deposit_interest_required, deposit_interest_rate_pct], output: Jurisdiction, side_effects: ["level/parent consistency + cycle checks"] }
  - { method: GET, path: "/hotline/jurisdictions/{id}", description: "Get one jurisdiction", roles: [AgencyAdmin, Counselor, HotlineSupervisor, DataProtectionOfficer, Analyst], code: 200, input: [], output: Jurisdiction, side_effects: [] }
  - { method: GET, path: "/hotline/jurisdictions", description: "List jurisdictions with filters", roles: [AgencyAdmin, Counselor, HotlineSupervisor, DataProtectionOfficer, Analyst], code: 200, input: ["parent_jurisdiction_id?", "level?", "limit?", "offset?"], output: "Jurisdiction[]", side_effects: [] }

  # --- RightsScript ---
  - { method: POST, path: "/hotline/scripts", description: "Author a new script version (DRAFT); author = X-User-ID", roles: [Counselor], code: 201, input: [jurisdiction_id, issue_category, version_no, body, "supersedes_script_id?"], output: RightsScript, side_effects: ["status=DRAFT", "author_counselor_id := X-User-ID"] }
  - { method: GET, path: "/hotline/scripts/{id}", description: "Get one script", roles: [Counselor, HotlineSupervisor, AgencyAdmin, DataProtectionOfficer, Analyst], code: 200, input: [], output: RightsScript, side_effects: [] }
  - { method: GET, path: "/hotline/scripts", description: "List scripts with filters", roles: [Counselor, HotlineSupervisor, AgencyAdmin, DataProtectionOfficer, Analyst], code: 200, input: ["jurisdiction_id?", "issue_category?", "status?", "supersedes_script_id?", "author_counselor_id?", "reviewer_counselor_id?", "limit?", "offset?"], output: "RightsScript[]", side_effects: [] }
  - { method: POST, path: "/hotline/scripts/{id}/state", description: "Transition script (IN_REVIEW submit by author; PUBLISHED by reviewer != author with effective_from; DRAFT return by reviewer; RETIRED by supervisor or author-from-DRAFT)", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status, "effective_from?"], output: RightsScript, side_effects: ["per RightsScript state machine incl. supersession cascade to SelfHelpResource and PROPOSED referrals"] }

  # --- SelfHelpResource ---
  - { method: POST, path: "/hotline/self-help-resources", description: "Create a caller-facing self-help resource linked to a PUBLISHED script", roles: [Counselor, HotlineSupervisor], code: 201, input: [jurisdiction_id, issue_category, title, body, language_code, linked_script_id], output: SelfHelpResource, side_effects: ["status=CURRENT; ERR_SCRIPT_NOT_PUBLISHED if linked script not PUBLISHED"] }
  - { method: GET, path: "/hotline/self-help-resources/{id}", description: "Get one resource", roles: [Counselor, HotlineSupervisor, AgencyAdmin, Analyst], code: 200, input: [], output: SelfHelpResource, side_effects: [] }
  - { method: GET, path: "/hotline/self-help-resources", description: "List resources with filters", roles: [Counselor, HotlineSupervisor, AgencyAdmin, Analyst], code: 200, input: ["jurisdiction_id?", "linked_script_id?", "status?", "limit?", "offset?"], output: "SelfHelpResource[]", side_effects: [] }
  - { method: POST, path: "/hotline/self-help-resources/{id}/state", description: "Refresh (OUTDATED->CURRENT with new linked_script_id) or retire a resource", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status, "linked_script_id?"], output: SelfHelpResource, side_effects: ["per SelfHelpResource state machine; retire cancels PROPOSED referrals"] }

  # --- Counselor ---
  - { method: POST, path: "/hotline/counselors", description: "Register a counselor", roles: [AgencyAdmin], code: 201, input: [display_name, languages, certified_jurisdiction_codes, certified_categories, certification_expires_at, is_script_reviewer], output: Counselor, side_effects: ["status=ACTIVE, trained_script_ids=[]"] }
  - { method: GET, path: "/hotline/counselors/{id}", description: "Get one counselor", roles: [AgencyAdmin, Counselor, HotlineSupervisor, DataProtectionOfficer], code: 200, input: [], output: Counselor, side_effects: [] }
  - { method: PATCH, path: "/hotline/counselors/{id}", description: "Update counselor (status SUSPENDED/ACTIVE/INACTIVE, certification renewal, scopes)", roles: [AgencyAdmin], code: 200, input: ["display_name?", "languages?", "certified_jurisdiction_codes?", "certified_categories?", "certification_expires_at?", "is_script_reviewer?", "status?"], output: Counselor, side_effects: ["status transitions per Counselor state machine"] }
  - { method: POST, path: "/hotline/counselors/{id}/training-certifications", description: "Record completed training on a script version; actor (supervisor) must differ from subject counselor; score >= 80 appends script id to trained_script_ids", roles: [HotlineSupervisor], code: 201, input: [script_id, score], output: Counselor, side_effects: ["if score >= 80 and script PUBLISHED/SUPERSEDED: trained_script_ids append (idempotent within array)"] }

  # --- Interpreter ---
  - { method: POST, path: "/hotline/interpreters", description: "Register an interpreter", roles: [AgencyAdmin], code: 201, input: [display_name, language_code], output: Interpreter, side_effects: [] }
  - { method: GET, path: "/hotline/interpreters/{id}", description: "Get one interpreter", roles: [AgencyAdmin, Counselor, HotlineSupervisor], code: 200, input: [], output: Interpreter, side_effects: [] }

  # --- Caller & Consent ---
  - { method: POST, path: "/hotline/callers", description: "Register a pseudonymous caller (public intake)", roles: [Anonymous], code: 201, input: [alias, "phone?", preferred_language, channel, "accessibility_needs?", is_anonymous], output: Caller, side_effects: ["pii_purged=false, do_not_aggregate=false; anonymous callers must have null phone"] }
  - { method: GET, path: "/hotline/callers/{id}", description: "Get one caller (own record for Caller role)", roles: [Caller, Counselor, HotlineSupervisor, DataProtectionOfficer], code: 200, input: [], output: Caller, side_effects: [] }
  - { method: POST, path: "/hotline/callers/{id}/consents", description: "Grant a consent (OCC on caller version); expires_at = now + TTL_DAYS[type]", roles: [Caller], code: 201, input: [consent_type, expected_caller_version], output: ConsentRecord, side_effects: ["status=GRANTED, granted_at/expires_at computed", "increments Caller.version by 1", "FOLLOW_UP consent on anonymous caller -> ERR_ANONYMOUS_FOLLOW_UP_FORBIDDEN", "purged caller -> ERR_CALLER_PII_PURGED"] }
  - { method: GET, path: "/hotline/callers/{id}/consents", description: "List a caller's consents", roles: [Caller, Counselor, HotlineSupervisor, DataProtectionOfficer], code: 200, input: ["consent_type?", "status?", "limit?", "offset?"], output: "ConsentRecord[]", side_effects: [] }
  - { method: POST, path: "/hotline/consents/{id}/revoke", description: "Revoke a GRANTED consent (own caller or DPO)", roles: [Caller, DataProtectionOfficer], code: 200, input: [], output: ConsentRecord, side_effects: ["per ConsentRecord REVOKED cascades (follow-ups cancelled, LEGAL_AID referrals cancelled + slots released, do_not_aggregate)", "increments Caller.version by 1"] }

  # --- CallSession ---
  - { method: POST, path: "/hotline/sessions", description: "Intake a call (QUEUED, interpretation NOT_REQUIRED)", roles: [Anonymous], code: 201, input: [caller_id, jurisdiction_id, issue_category, "triage_notes?"], output: CallSession, side_effects: ["session_status=QUEUED, interpretation_status=NOT_REQUIRED"] }
  - { method: GET, path: "/hotline/sessions/{id}", description: "Get one session", roles: [Counselor, HotlineSupervisor], code: 200, input: [], output: CallSession, side_effects: [] }
  - { method: GET, path: "/hotline/sessions", description: "List sessions with filters", roles: [Counselor, HotlineSupervisor], code: 200, input: ["caller_id?", "counselor_id?", "interpreter_id?", "jurisdiction_id?", "pinned_script_id?", "session_status?", "limit?", "offset?"], output: "CallSession[]", side_effects: [] }
  - { method: POST, path: "/hotline/sessions/{id}/state", description: "Transition session_status (ASSIGNED with counselor_id; ACTIVE pins script + computes queue_wait; WRAPPED_UP/DROPPED/ABANDONED)", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status, "counselor_id?"], output: CallSession, side_effects: ["per CallSession state machine incl. eligibility and language/training gates"] }
  - { method: POST, path: "/hotline/sessions/{id}/interpretation", description: "Transition interpretation_status (REQUEST with interpreter_id + scheduled window; CONNECTED; FAILED; retry; NOT_REQUIRED fallback)", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status, "interpreter_id?", "scheduled_start_at?", "scheduled_end_at?"], output: CallSession, side_effects: ["per parallel dimension; overlap/language/retry-exclusion checks; FAILED appends failed_interpreter_ids"] }

  # --- Case ---
  - { method: POST, path: "/hotline/cases", description: "Open a case from a session; computes provisional priority_score, urgency_tier, required_follow_up_count, deposit_exposure_cents", roles: [Counselor, HotlineSupervisor], code: 201, input: [caller_id, opened_from_session_id, jurisdiction_id, issue_category, "eviction_notice_date?", "notice_served_at?", "habitability_reported_at?", "deposit_amount_cents?", "monthly_rent_cents?", "deposit_days_held?", "legal_hold?"], output: Case, side_effects: ["status=OPEN; score/tier/exposure computed per PROVISIONAL variant"] }
  - { method: GET, path: "/hotline/cases/{id}", description: "Get one case", roles: [Counselor, HotlineSupervisor, DataProtectionOfficer], code: 200, input: [], output: Case, side_effects: [] }
  - { method: GET, path: "/hotline/cases", description: "List cases with filters", roles: [Counselor, HotlineSupervisor, DataProtectionOfficer], code: 200, input: ["caller_id?", "jurisdiction_id?", "opened_from_session_id?", "opened_by_counselor_id?", "verified_by_counselor_id?", "status?", "urgency_tier?", "limit?", "offset?"], output: "Case[]", side_effects: [] }
  - { method: PATCH, path: "/hotline/cases/{id}", description: "Update case facts; recomputes score/tier/exposure with the CURRENT score_variant; fact edits rejected on CLOSED (ERR_INVALID_STATE), but a legal_hold-only toggle IS allowed on CLOSED cases (litigation holds attach after closure)", roles: [Counselor, HotlineSupervisor], code: 200, input: ["eviction_notice_date?", "notice_served_at?", "habitability_reported_at?", "deposit_amount_cents?", "monthly_rent_cents?", "deposit_days_held?", "legal_hold?"], output: Case, side_effects: ["score/tier/exposure recompute; increments Case.version"] }
  - { method: POST, path: "/hotline/cases/{id}/verify", description: "Verify case facts (verifier != opener, SoD); switches score_variant to VERIFIED and recomputes with the VERIFIED variant", roles: [Counselor, HotlineSupervisor], code: 200, input: [], output: Case, side_effects: ["score_variant=VERIFIED; verified_by_counselor_id := X-User-ID; recompute per VERIFIED variant"] }
  - { method: POST, path: "/hotline/cases/{id}/state", description: "Transition case status (IN_PROGRESS/ESCALATED by counselor; de-escalate and CLOSED by supervisor; RESOLVED; reopen)", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status], output: Case, side_effects: ["per Case state machine incl. escalation cascade + auto follow-up and de-escalation compensation"] }
  - { method: POST, path: "/hotline/cases/{id}/notes", description: "Append an immutable case note (OCC on case version)", roles: [Counselor, HotlineSupervisor], code: 201, input: [body, is_confidential, expected_case_version], output: CaseNote, side_effects: ["increments Case.version by 1"] }
  - { method: GET, path: "/hotline/cases/{id}/notes", description: "List notes of a case (append-only log)", roles: [Counselor, HotlineSupervisor, DataProtectionOfficer], code: 200, input: ["limit?", "offset?"], output: "CaseNote[]", side_effects: [] }
  - { method: GET, path: "/hotline/counselors/{id}/notes", description: "Audit read: list notes authored by a counselor across cases (quality review)", roles: [HotlineSupervisor, DataProtectionOfficer], code: 200, input: ["limit?", "offset?"], output: "CaseNote[]", side_effects: [] }
  - { method: POST, path: "/hotline/cases/{id}/follow-ups", description: "Schedule a follow-up (case must be IN_PROGRESS, PENDING_FOLLOW_UP or ESCALATED); case IN_PROGRESS auto-moves to PENDING_FOLLOW_UP", roles: [Counselor, HotlineSupervisor], code: 201, input: [scheduled_for], output: FollowUp, side_effects: ["status=SCHEDULED; required_count_at_schedule pinned; spacing >= 24h vs non-terminal siblings (ERR_FOLLOW_UP_TOO_SOON); scheduled_for must be after now (ERR_INVALID_REQUEST); anonymous caller -> ERR_ANONYMOUS_FOLLOW_UP_FORBIDDEN; case auto-transition to PENDING_FOLLOW_UP"] }
  - { method: GET, path: "/hotline/cases/{id}/follow-ups", description: "List follow-ups of a case", roles: [Counselor, HotlineSupervisor], code: 200, input: ["status?", "limit?", "offset?"], output: "FollowUp[]", side_effects: [] }
  - { method: POST, path: "/hotline/follow-ups/{id}/state", description: "Complete (outcome required) or cancel a follow-up", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status, "outcome?"], output: FollowUp, side_effects: ["per FollowUp state machine incl. system CaseNote + case bubble-up"] }

  # --- LegalAidOrg ---
  - { method: POST, path: "/hotline/legal-aid-orgs", description: "Register a legal-aid organization", roles: [AgencyAdmin], code: 201, input: [name, covered_jurisdiction_codes, accepted_categories, weekly_capacity], output: LegalAidOrg, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/hotline/legal-aid-orgs/{id}", description: "Get one org incl. computed current_week_reserved", roles: [AgencyAdmin, Counselor, HotlineSupervisor], code: 200, input: [], output: LegalAidOrg, side_effects: [] }
  - { method: PATCH, path: "/hotline/legal-aid-orgs/{id}", description: "Pause/activate org or adjust weekly_capacity", roles: [AgencyAdmin], code: 200, input: ["status?", "weekly_capacity?"], output: LegalAidOrg, side_effects: ["PAUSED blocks new dispatches; in-flight DISPATCHED unaffected"] }

  # --- Referral ---
  - { method: POST, path: "/hotline/cases/{id}/referrals", description: "Propose a referral (OCC on case version); computes sla_dispatch_by from the case's current tier", roles: [Counselor, HotlineSupervisor], code: 201, input: [referral_type, "legal_aid_org_id?", "self_help_resource_id?", expected_case_version], output: Referral, side_effects: ["status=PROPOSED; sla_dispatch_by := now + SLA_HOURS[tier]; increments Case.version by 1", "LEGAL_AID: org coverage + LEGAL_AID_RELEASE consent checks", "SELF_HELP: resource must be CURRENT"] }
  - { method: GET, path: "/hotline/referrals/{id}", description: "Get one referral", roles: [Counselor, HotlineSupervisor], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: GET, path: "/hotline/referrals", description: "List referrals with filters", roles: [Counselor, HotlineSupervisor], code: 200, input: ["case_id?", "legal_aid_org_id?", "self_help_resource_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: POST, path: "/hotline/referrals/{id}/state", description: "Transition referral (DISPATCHED/ACCEPTED/DECLINED/CANCELLED; PROPOSED re-route with new legal_aid_org_id from DECLINED)", roles: [Counselor, HotlineSupervisor], code: 200, input: [to_status, "legal_aid_org_id?"], output: Referral, side_effects: ["per Referral state machine incl. slot consume/release compensation and SLA checks"] }

  # --- RetentionPolicy ---
  - { method: POST, path: "/hotline/retention-policies", description: "Create a retention policy; an ACTIVE policy for an occupied (jurisdiction_id, issue_category) pair auto-deactivates the prior one", roles: [DataProtectionOfficer], code: 201, input: ["jurisdiction_id?", "issue_category?", retention_days], output: RetentionPolicy, side_effects: ["auto-supersede prior ACTIVE policy for the same pair"] }
  - { method: GET, path: "/hotline/retention-policies/{id}", description: "Get one policy", roles: [DataProtectionOfficer, HotlineSupervisor, AgencyAdmin], code: 200, input: [], output: RetentionPolicy, side_effects: [] }
  - { method: GET, path: "/hotline/retention-policies", description: "List policies with filters", roles: [DataProtectionOfficer, HotlineSupervisor, AgencyAdmin], code: 200, input: ["jurisdiction_id?", "issue_category?", "status?", "limit?", "offset?"], output: "RetentionPolicy[]", side_effects: [] }

  # --- PurgeJob ---
  - { method: GET, path: "/hotline/purge-jobs/{id}", description: "Get one purge job", roles: [DataProtectionOfficer, HotlineSupervisor], code: 200, input: [], output: PurgeJob, side_effects: [] }
  - { method: GET, path: "/hotline/purge-jobs", description: "List purge jobs with filters", roles: [DataProtectionOfficer, HotlineSupervisor], code: 200, input: ["caller_id?", "status?", "limit?", "offset?"], output: "PurgeJob[]", side_effects: [] }
  - { method: POST, path: "/hotline/purge-jobs/{id}/execute", description: "Execute a purge job: scrubs caller PII and EXPIRES granted consents; legal hold transitions job to BLOCKED_BY_HOLD instead of erroring", roles: [DataProtectionOfficer], code: 200, input: [], output: PurgeJob, side_effects: ["per PurgeJob state machine"] }

  # --- Analytics (computed reads; no persisted snapshot entity) ---
  - { method: GET, path: "/hotline/analytics/call-volume", description: "Call-volume & escalation metrics over [from_iso8601, to_iso8601) per call_volume_metrics; view RAW (default) or DEDUPLICATED; excludes do_not_aggregate callers", roles: [Analyst, HotlineSupervisor, AgencyAdmin], code: 200, input: ["jurisdiction_id?", "issue_category?", "from_iso8601?", "to_iso8601?", "view?"], output: "{ call_count: integer, escalated_case_count: integer, escalation_rate: number, view: string }", side_effects: [] }

  # --- Test-driving / ops endpoints ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time.", roles: [AgencyAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["moves the logical clock used by every time-dependent rule"] }
  - { method: POST, path: "/_ops/run_time_sweep", description: "Advance all clock-driven transitions at the current logical time: consents -> EXPIRED, follow-ups SCHEDULED->DUE->MISSED (with cascades), referrals PROPOSED/DISPATCHED -> EXPIRED (slot release), create PENDING PurgeJobs for retention-eligible callers (dedup). Processing order pinned: consents first, then follow-ups by scheduled_for ASC (tie-break created_at ASC), then referrals by created_at ASC, then purge-job creation by caller created_at ASC.", roles: [AgencyAdmin], code: 200, input: [], output: "{ consents_expired: integer, follow_ups_due: integer, follow_ups_missed: integer, referrals_expired: integer, purge_jobs_created: integer }", side_effects: ["per follow_up_timing, consent_ttl, referral expiry, retention_eligibility"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, enum violation, jurisdiction level/parent inconsistency (see ERR_JURISDICTION_LEVEL_MISMATCH for 422 variant), referral type/target mismatch (ERR_REFERRAL_TARGET_MISMATCH), anonymous caller with non-null phone, re-route org missing or already declined, effective_from invalid" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or invalid" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or ownership check failed (Caller acting on another's record; counselor submitting another's script; supervisor recording training for themselves is impossible since role differs; reviewer flag missing on publish)" }
  - { id: ERR_SCRIPT_REVIEWER_CONFLICT, http: 403, condition: "Segregation of duties violated: script publisher == author, or case verifier == opener" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version / expected_caller_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not listed for the current state; terminal-state mutation; ACTIVE while interpretation REQUESTED; case opened from a session not ACTIVE/WRAPPED_UP; note/referral on a case not in an open counseling state; manual escalation of a non-CRITICAL case" }
  - { id: ERR_CASE_NOT_VERIFIED, http: 409, condition: "Manual escalation attempted while score_variant == PROVISIONAL" }
  - { id: ERR_CASE_HAS_OPEN_ITEMS, http: 409, condition: "RESOLVED attempted with follow-ups in SCHEDULED/DUE or referrals in PROPOSED/DISPATCHED" }
  - { id: ERR_SCRIPT_VERSION_CHAIN_BROKEN, http: 409, condition: "Publish with supersedes target not PUBLISHED, wrong pair, or version_no != supersedes.version_no + 1" }
  - { id: ERR_DUPLICATE_PUBLISHED_SCRIPT, http: 409, condition: "Publish of a non-superseding script while another PUBLISHED script exists for (jurisdiction_id, issue_category)" }
  - { id: ERR_SCRIPT_NOT_PUBLISHED, http: 409, condition: "Operation requires a PUBLISHED script for the pair (resource create/refresh, case IN_PROGRESS, session start) and none exists" }
  - { id: ERR_RESOURCE_OUTDATED, http: 409, condition: "SELF_HELP referral targeting a resource whose status is OUTDATED (or RETIRED)" }
  - { id: ERR_JURISDICTION_LEVEL_MISMATCH, http: 422, condition: "COUNTY parent not a STATE, CITY parent not a COUNTY, STATE with a non-null parent" }
  - { id: ERR_COUNSELOR_INACTIVE, http: 409, condition: "Assigned/assigning counselor not ACTIVE at assignment or session start" }
  - { id: ERR_CERTIFICATION_EXPIRED, http: 409, condition: "Counselor certification_expires_at <= current logical time" }
  - { id: ERR_TRAINING_NOT_CURRENT, http: 409, condition: "Counselor.trained_script_ids lacks the current PUBLISHED script for the session's (jurisdiction, category)" }
  - { id: ERR_LANGUAGE_UNSUPPORTED, http: 409, condition: "At session start: counselor does not speak caller.preferred_language and interpretation_status != CONNECTED" }
  - { id: ERR_INTERPRETER_LANGUAGE_MISMATCH, http: 409, condition: "Interpreter.language_code != caller.preferred_language on interpretation REQUEST" }
  - { id: ERR_INTERPRETER_OVERLAP, http: 409, condition: "Requested window conflicts with an existing buffered booking of the same interpreter (10-minute buffer, half-open windows)" }
  - { id: ERR_INTERPRETER_PREVIOUSLY_FAILED, http: 409, condition: "Re-requesting an interpreter id present in the session's failed_interpreter_ids" }
  - { id: ERR_ANONYMOUS_FOLLOW_UP_FORBIDDEN, http: 422, condition: "FOLLOW_UP consent grant or follow-up scheduling for an anonymous caller" }
  - { id: ERR_CALLER_PII_PURGED, http: 409, condition: "Consent grant or new case/session intake for a caller whose PII has been purged" }
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "LEGAL_AID referral create/re-route without a GRANTED LEGAL_AID_RELEASE consent (absent, EXPIRED or REVOKED)" }
  - { id: ERR_ORG_NOT_ACCEPTING, http: 409, condition: "Dispatch to a PAUSED org" }
  - { id: ERR_ORG_CAPACITY_FULL, http: 409, condition: "Dispatch when current_week_reserved >= weekly_capacity" }
  - { id: ERR_ORG_COVERAGE_MISMATCH, http: 422, condition: "Org's covered_jurisdiction_codes / accepted_categories do not include the case's jurisdiction/category" }
  - { id: ERR_REFERRAL_TARGET_MISMATCH, http: 422, condition: "referral_type LEGAL_AID without legal_aid_org_id (or with self_help_resource_id), or SELF_HELP without self_help_resource_id" }
  - { id: ERR_SLA_BREACHED, http: 409, condition: "Dispatch attempted after sla_dispatch_by" }
  - { id: ERR_FOLLOW_UP_TOO_SOON, http: 409, condition: "scheduled_for within 24h of another non-terminal follow-up on the same case (strictly-less-than 24h gap rejects; exactly 24h passes). A scheduled_for in the past is a schema error (ERR_INVALID_REQUEST)" }
  - { id: ERR_RETENTION_NOT_EXPIRED, http: 409, condition: "Purge execute before now >= anchor closed_at + applicable retention_days, or no applicable policy, or no CLOSED case" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public intake channel (hotline callers before registration)"
    identity: opaque
    exclusive_operations:
      - "POST /hotline/callers — register a pseudonymous caller"
      - "POST /hotline/sessions — intake a call session"
    shared_operations: []

  - name: Caller
    description: "A registered pseudonymous tenant; may only act on own record (X-User-ID == caller id)"
    identity: "entity_backed:Caller"
    exclusive_operations:
      - "POST /hotline/callers/{id}/consents — grant own consent (OCC)"
    shared_operations:
      - "GET /hotline/callers/{id} — read own record (shared with Counselor, HotlineSupervisor, DataProtectionOfficer)"
      - "GET /hotline/callers/{id}/consents — list own consents"
      - "POST /hotline/consents/{id}/revoke — revoke own consent (shared with DataProtectionOfficer)"

  - name: Counselor
    description: "HUD-certified hotline counselor; authors scripts, runs sessions/cases, but cannot publish own scripts, verify own cases, or record own training (segregation of duties)"
    identity: "entity_backed:Counselor"
    exclusive_operations:
      - "POST /hotline/scripts — author a script version"
      - "POST /hotline/scripts/{id}/state — submit/return/publish (publish requires is_script_reviewer and != author)"
    shared_operations:
      - "Sessions: assign/start/wrap/interpretation (shared with HotlineSupervisor)"
      - "Cases: create/patch/verify/state/notes/follow-ups/referrals (shared with HotlineSupervisor; verify requires != opener)"
      - "Self-help resources: create/refresh (shared with HotlineSupervisor)"
      - "Reads: jurisdictions, scripts, resources, counselors, interpreters, orgs, callers, consents, cases, sessions, referrals, notes, follow-ups"

  - name: HotlineSupervisor
    description: "Shift supervisor with hierarchical override over counselors; exclusive hold on de-escalation, case closure, training certification, script/resource retirement"
    identity: opaque
    exclusive_operations:
      - "POST /hotline/counselors/{id}/training-certifications — certify counselor training"
      - "Case de-escalation (ESCALATED -> IN_PROGRESS) and CLOSED transitions"
      - "Script RETIRED from PUBLISHED; resource RETIRED"
    shared_operations:
      - "All Counselor case/session/referral operations except script authoring"
      - "Reads: all staff-facing resources incl. purge-jobs, retention-policies, analytics"

  - name: DataProtectionOfficer
    description: "Privacy officer; sole executor of purge jobs and author of retention policies; cannot modify cases or sessions (segregation of duties vs. counseling staff)"
    identity: opaque
    exclusive_operations:
      - "POST /hotline/retention-policies — create retention policy"
      - "POST /hotline/purge-jobs/{id}/execute — execute a purge"
    shared_operations:
      - "GET callers/cases/notes/consents/purge-jobs/retention-policies — audit reads"
      - "POST /hotline/consents/{id}/revoke — revoke any consent (shared with Caller own)"

  - name: AgencyAdmin
    description: "Agency administrator; owns reference data (jurisdictions, counselors, interpreters, orgs) and operates the logical clock and time sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /hotline/jurisdictions, POST/PATCH /hotline/counselors, POST /hotline/interpreters, POST/PATCH /hotline/legal-aid-orgs"
      - "POST /_clock/set_current_utc, POST /_ops/run_time_sweep"
    shared_operations:
      - "GET jurisdictions/scripts/resources/counselors/interpreters/orgs/retention-policies, GET /hotline/analytics/call-volume"

  - name: Analyst
    description: "Policy-advocacy analyst; reads aggregates only — no access to caller-identified resources (sessions, cases, notes, consents)"
    identity: opaque
    exclusive_operations:
      - "GET /hotline/analytics/call-volume (shared with HotlineSupervisor, AgencyAdmin)"
    shared_operations:
      - "GET jurisdictions/scripts/self-help-resources — reference reads"
