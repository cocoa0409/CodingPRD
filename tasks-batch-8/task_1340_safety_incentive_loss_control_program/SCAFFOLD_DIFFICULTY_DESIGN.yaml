# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1340 — Safety Incentive & Loss Control Program
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: emr_provisional_vs_final_divergence
        grounds:
          - calculations.emr_forecast
          - entities.EMRForecast.fields.emr_provisional
          - entities.EMRForecast.fields.emr_final
          - entities.ClaimRecord.fields.effective_incurred_cents
        distinguishing_aspect: |
          Same stored program + claims yield two different EMRs because the PROVISIONAL
          variant includes REPORTED claims and annualized payroll while FINAL includes
          only ACCEPTED|CLOSED claims on recorded payroll — entity domain: ClaimRecord/
          SafetyProgram, distinct from the incentive-points domain of the second instance.
        test_recipe:
          setup:
            - "ACTIVE 2026 program; payroll LOW $400000 / MODERATE $300000 / HIGH $100000 with ELR 1.10/1.80/3.20 (E = $13000)"
            - "Claim C1 INDEMNITY $20000 ACCEPTED (primary 15000, excess 5000)"
            - "Claim C2 MEDICAL_ONLY $8000 ACCEPTED (effective $2400 after ERA 0.3 factor; primary 2400, excess 0)"
            - "Claim C3 INDEMNITY $50000 REPORTED — provisional-only (primary 15000, excess 35000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 40000000 }, { hazard_class: "MODERATE", payroll_cents: 30000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.10 }, { hazard_class: "MODERATE", elr: 1.80 }, { hazard_class: "HIGH", elr: 3.20 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin, captures: { p_v2: $.data.version } }
            - { call: "POST /safety/job-roles", payload: { title: "EHS Manager", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Mgr One", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-01", kind: "INDEMNITY", incurred_cents: 2000000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /safety/claims/${c1_id}/accept", payload: {}, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-03-05", kind: "MEDICAL_ONLY", incurred_cents: 800000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /safety/claims/${c2_id}/accept", payload: {}, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/claims", payload: { program_id: "${p_id}", occurred_on: "2026-04-01", kind: "INDEMNITY", incurred_cents: 5000000 }, as: SafetyManager, as_user_id: "${m_id}", captures: { c3_id: $.data.id } }
          trigger:
            - { call: "POST /safety/emr-forecasts", payload: { program_id: "${p_id}", expected_program_version: "${p_v2}", as_of: "2027-01-15T00:00:00Z" }, as: EHSAdmin, captures: { f_prov: $.data.emr_provisional, f_fin: $.data.emr_final } }
          assert:
            - "EMRForecast.emr_final == 1.80"
            - "EMRForecast.emr_provisional == 2.97"
            - "EMRForecast.emr_provisional != EMRForecast.emr_final"
            - "EMRForecast.expected_losses_final_cents == 1300000"
            - "EMRForecast.weighting_w == 0.05"
            - "EMRForecast.ballast_final_cents == 130000"
            - "EMRForecast.actual_primary_final_cents == 1740000"
            - "EMRForecast.actual_excess_final_cents == 500000"
            - "EMRForecast.actual_primary_provisional_cents == 3240000"
            - "EMRForecast.actual_excess_provisional_cents == 4000000"
            - "EMRForecast.payroll_factor == 1.0 (as_of after program year end)"

      - name: incentive_leading_only_vs_balanced_payout
        grounds:
          - calculations.incentive_event_points
          - calculations.award_payout
          - entities.IncentiveAward.fields.payout_cents
          - entities.IncentiveEvent.fields.source_type
        distinguishing_aspect: |
          Identical leading-indicator activity scores 34 points / $51.00 payout under
          LEADING_ONLY but 84 points / $168.00 under BALANCED (claims-free bonus 50
          points added, tier flips BRONZE->SILVER) — entity domain: Employee incentive
          ledger, distinct from the EMR claim domain of the first instance; the bonus
          is withheld (never negative) whenever any claim is accepted, so reporting can
          never reduce an employee's award below the LEADING_ONLY floor.
        test_recipe:
          setup:
            - "Two ACTIVE 2026 programs, identical except scoring_variant LEADING_ONLY vs BALANCED; quorum_min 1; zero claims in either"
            - "In each: LOW-class employee A is committee member, reports one OBSERVATION (validated via linked hazard close), implements one control verified ON TIME (due 2026-06-20, verified 2026-06-01), attends one held meeting"
            - "Points per program for A: 10 (observation) + round(15*1.0*1.25)=19 (control on time) + 5 (meeting) = 34"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }
              as: EHSAdmin
              captures: { p_l: $.data.id }
            - { call: "POST /safety/programs/${p_l}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_l}", location: "Dock 1", description: "Frayed cable", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_l: $.data.id } }
            - { call: "POST /safety/hazards/${h_l}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_l}/controls", payload: { description: "Replace cable", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_l: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_l}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Cable sparks", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o_l: $.data.id } }
            - { call: "POST /safety/observations/${o_l}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_l}" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/controls/${c_l}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
            - { call: "POST /safety/controls/${c_l}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_l}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_l: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt_l}/hold", payload: { attendee_ids: ["${a_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt_l}/publish-minutes", payload: { minutes_text: "Reviewed dock hazards" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/programs/${p_l}/close", payload: {}, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2027, scoring_variant: "BALANCED", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }
              as: EHSAdmin
              captures: { p_b: $.data.id }
            - { call: "POST /safety/programs/${p_b}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_b}", location: "Dock 2", description: "Blocked exit", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_b: $.data.id } }
            - { call: "POST /safety/hazards/${h_b}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_b}/controls", payload: { description: "Clear exit", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_b: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_b}", reporter_id: "${a_id}", kind: "OBSERVATION", description: "Exit blocked", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${a_id}", captures: { o_b: $.data.id } }
            - { call: "POST /safety/observations/${o_b}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_b}" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/controls/${c_b}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
            - { call: "POST /safety/controls/${c_b}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_b}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_b: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt_b}/hold", payload: { attendee_ids: ["${a_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt_b}/publish-minutes", payload: { minutes_text: "Reviewed exits" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/programs/${p_b}/close", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_l}", employee_id: "${a_id}" }, as: EHSAdmin, captures: { aw_l_pay: "$.data[0].payout_cents", aw_l_pts: "$.data[0].points_earned", aw_l_tier: "$.data[0].tier" } }
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_b}", employee_id: "${a_id}" }, as: EHSAdmin, captures: { aw_b_pay: "$.data[0].payout_cents", aw_b_pts: "$.data[0].points_earned", aw_b_tier: "$.data[0].tier" } }
          assert:
            - "LEADING_ONLY award: points_earned == 34, tier == BRONZE, payout_cents == 5100"
            - "BALANCED award: points_earned == 84, tier == SILVER, payout_cents == 16800"
            - "aw_l_pay != aw_b_pay (same activity, two variants, different payouts)"
            - "no CLAIMS_FREE_BONUS event exists in program ${p_l} (variant selection)"

  - rule_id: combinatorial_formula
    instances:
      - name: prequal_score_weighted_band_selection
        grounds:
          - calculations.prequal_score
          - entities.ContractorOrg.fields.prequal_score
          - entities.ContractorOrg.fields.computed_decision
        distinguishing_aspect: |
          Mode (a): four inputs with nested clamp (emr_component, trir_component) plus a
          day-banded insurance component and tiered band selection; emr 0.50 / trir 0.0 /
          audit 80 / cert 105 days out yields exactly 0.4*60 + 0.3*100 + 0.2*80 + 0.1*100 = 80.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01; contractor metrics chosen so components are 60, 100, 80, 100"
            - "insurance_cert_expires_on 2026-12-15 is 105 days out -> insurance_component 100"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/contractor-orgs", payload: { name: "Acme Erectors", contact_email: "safety@acme.example", emr: 0.50, trir: 0.0, safety_audit_pct: 80, insurance_cert_expires_on: "2026-12-15" }, as: EHSAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /safety/contractor-orgs/${c_id}/submit", payload: {}, as: ContractorRep, as_user_id: "${c_id}", captures: { score: $.data.prequal_score, band: $.data.computed_decision } }
          assert:
            - "ContractorOrg.prequal_score == 80.00"
            - "ContractorOrg.computed_decision == APPROVE"
            - "ContractorOrg.status == UNDER_REVIEW"

      - name: award_payout_rounding_order
        grounds:
          - calculations.award_payout
          - entities.IncentiveAward.fields.payout_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: each employee's payout is rounded half-up to whole
          dollars BEFORE summation. Two BRONZE employees with 5 points each: per-employee
          5*150 = 750c -> $7.50 -> $8.00; per-employee-first total is $16.00 while
          sum-first rounding would give $15.00 — the pinned order changes the cents.
        test_recipe:
          setup:
            - "ACTIVE LEADING_ONLY program, quorum_min 1, zero claims"
            - "Committee members A and B (both LOW class) attend one held meeting: each earns exactly 5 points (BRONZE)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Bob B", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_id: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt_id}/hold", payload: { attendee_ids: ["${a_id}", "${b_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt_id}/publish-minutes", payload: { minutes_text: "Quarterly review" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/programs/${p_id}/close", payload: {}, as: EHSAdmin }
          trigger:
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_id}", employee_id: "${a_id}" }, as: EHSAdmin, captures: { pay_a: "$.data[0].payout_cents" } }
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_id}", employee_id: "${b_id}" }, as: EHSAdmin, captures: { pay_b: "$.data[0].payout_cents" } }
          assert:
            - "Award A payout_cents == 800 (5 * 150 = 750c rounded half-up to whole dollars)"
            - "Award B payout_cents == 800"
            - "Program payout total == 1600; sum-then-round would produce 1500 — per-employee-first rounding is observable"

  - rule_id: non_linear_state_machine
    instances:
      - name: hazard_verification_revision_loop
        grounds:
          - state_machines.Hazard.PENDING_VERIFICATION_to_IN_PROGRESS
          - state_machines.Hazard.PENDING_VERIFICATION_to_CLOSED
          - state_machines.Hazard.CLOSED_to_OPEN
          - state_machines.ControlItem.IMPLEMENTED_to_PLANNED
        distinguishing_aspect: |
          Hazard machine is cyclic: a FAILed verify loops PENDING_VERIFICATION ->
          IN_PROGRESS and a CLOSED hazard can reopen to OPEN — a different entity than
          the ContractorOrg cycles of the sibling instance.
        test_recipe:
          setup:
            - "ACTIVE program; LOW-class employees A (implementer) and M (verifier/manager)"
            - "Hazard assessed MEDIUM (severity 3 x probability 2 = 6, SLA 30 days) with two controls c1, c2 (due 2026-06-20), both IMPLEMENTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }] }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "Line 3", description: "Unguarded roller", identified_by: "${a_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Install guard", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Add e-stop", implementer_id: "${a_id}", due_date: "2026-06-20T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /safety/controls/${c1_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
            - { call: "POST /safety/controls/${c2_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
            - { call: "POST /safety/controls/${c1_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /safety/controls/${c2_id}/verify", payload: { outcome: "FAIL", outcome_note: "E-stop not wired", due_date: "2026-06-25T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c2_status: $.data.status, c2_due: $.data.due_date } }
            - { call: "POST /safety/controls/${c2_id}/implement", payload: {}, as: Supervisor, as_user_id: "${a_id}" }
            - { call: "POST /safety/controls/${c2_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/reopen", payload: { reason: "recurrence found in audit" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_status: $.data.status } }
          assert:
            - "After FAIL: ControlItem c2.status == PLANNED and c2.due_date == 2026-06-25T00:00:00Z"
            - "After FAIL: Hazard.status == IN_PROGRESS (revision loop, not stuck at PENDING_VERIFICATION)"
            - "After re-implement: Hazard.status == PENDING_VERIFICATION"
            - "After second PASS: Hazard.status == CLOSED"
            - "After reopen: Hazard.status == OPEN and sla_breached == false (cycle CLOSED -> OPEN)"

      - name: contractor_prequal_cycles
        grounds:
          - state_machines.ContractorOrg.CONDITIONAL_to_UNDER_REVIEW
          - state_machines.ContractorOrg.SUSPENDED_to_UNDER_REVIEW
          - state_machines.ContractorOrg.UNDER_REVIEW_to_APPROVED
          - state_machines.ContractorOrg.APPROVED_to_SUSPENDED
        distinguishing_aspect: |
          ContractorOrg machine cycles CONDITIONAL -> UNDER_REVIEW (remediation) and
          APPROVED -> SUSPENDED -> UNDER_REVIEW (re-review) — a different entity than the
          Hazard revision loop; each resubmit recomputes prequal_score from new metrics.
        test_recipe:
          setup:
