# =============================================================================
# PRD Benchmark Seed Tables — task_2289
# Festival Talent Buying & Radius Administration
# Difficulty band: beyond Expert (§0.4) — 12 entities, 60 endpoints, 10 state
# machine dimensions (2 cyclic + 1 parallel two-dimension entity), 14
# calculations, 51 ordered validations, 69 error codes, 5 roles.
# =============================================================================

scenario: |
  2289. Festival Talent Buying & Radius Administration (music festival promoter): lineup construction with headliner anchors, budget allocation across tiers and genre balance, offer negotiation with guarantees, billing position, stage time and production requirements, radius clause negotiation restricting competing performances by distance and time window with enforcement, contract riders covering technical, hospitality and travel with cost estimation, artist advance with stage plots, input lists and schedule coordination across stages, lineup announcement sequencing tied to ticket sales phases, cancellation and replacement handling with deposit recovery and lineup communication, artist payment schedule with deposits and day-of-show balances

domain_name: festival-talent-buying
api_prefix: /festival-ops

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection under /festival-ops with FK references in
  # the request body; only three read sub-resources hang off /bookings/{id}.
  # No entity is addressed through a nested creation path.

  state_machine_shape: cyclic
  # Offer runs ISSUED -> COUNTERED -> ISSUED negotiation rounds; AdvancePacket
  # runs SUBMITTED -> RETURNED -> SUBMITTED revision rounds; AnnouncementWave
  # runs PLANNED -> LOCKED -> PLANNED on cascade-driven de-population; Booking
  # additionally carries two independent state dimensions (contract_status x
  # settlement_status) on the same row.

  relationship_patterns:
    - one_to_many          # Festival -> BudgetTier / Stage / Offer / Booking / AnnouncementWave
    - self_referential     # Booking.replaces_booking_id -> Booking.id (replacement chain)
    - cross_aggregate      # PaymentInstallment release gated by RadiusClause state
    - polymorphic          # RadiusClause attaches to an Offer first and to its Booking after acceptance

  role_model: segregation_of_duties
  # AdvancePacket approval MUST be performed by an X-User-ID different from the
  # X-User-ID that submitted it, even when both act under ProductionManager.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Festival
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Festival edition name.
        constraints: "1..120 chars"
      - name: edition_year
        type: integer
        source: input
        description: Calendar year of this edition.
        constraints: "2020..2100"
      - name: market_latitude
        type: number
        source: input
        description: Decimal-degree latitude of the festival market, used as the radius-clause centre point.
        constraints: "-90.0..90.0"
      - name: market_longitude
        type: number
        source: input
        description: Decimal-degree longitude of the festival market, used as the radius-clause centre point.
        constraints: "-180.0..180.0"
      - name: event_start_date
        type: string
        source: input
        description: First show date, ISO 8601 calendar date (YYYY-MM-DD), interpreted in UTC.
        constraints: "must be <= event_end_date"
      - name: event_end_date
        type: string
        source: input
        description: Last show date, ISO 8601 calendar date (YYYY-MM-DD), interpreted in UTC.
        constraints: "must be >= event_start_date"
      - name: talent_budget_cents
        type: integer
        source: input
        description: Gross talent budget for the edition in cents.
        constraints: ">= 100000"
      - name: contingency_reserve_pct
        type: number
        source: input
        description: Fraction of talent_budget_cents held back from tier allocation.
        default: 0.05
        constraints: "0.00..0.25"
      - name: allocatable_budget_cents
        type: integer
        source: computed
        description: "talent_budget_cents minus the contingency reserve; see calculations.tier_allocation_waterfall."
      - name: committed_budget_cents
        type: integer
        source: computed
        description: "Sum of BudgetTier.committed_cents across this festival's tiers; conserved quantity of compensating invariant budget_commitment_conservation."
        default: 0
      - name: tiers_allocated
        type: boolean
        source: computed
        description: "True once POST /festival-ops/festivals/{id}/allocate-tiers has stamped allocation_cents on every BudgetTier of this festival."
        default: false
      - name: announcement_phase
        type: enum
        source: computed
        description: "Ticket-sales phase gating announcement waves; advanced only by POST /festival-ops/festivals/{id}/advance-phase."
        default: PRESALE
        constraints: "PRESALE | TIER1_ONSALE | TIER2_ONSALE | GA_ONSALE"
      - name: lineup_posture
        type: enum
        source: computed
        description: "Derived gate over offer issuance and acceptance; see calculations.festival_lineup_posture."
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: headliner_anchor_count
        type: integer
        source: computed
        description: "Count of Bookings of this festival whose BudgetTier.tier_code == HEADLINER and contract_status NOT IN {CANCELLED}."
        default: 0

  - name: BudgetTier
    parent: null
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; the edition this tier budgets."
      - name: tier_code
        type: enum
        source: input
        description: Lineup tier this row budgets.
        constraints: "HEADLINER | DIRECT_SUPPORT | MID_CARD | EMERGING; unique per festival_id"
      - name: tier_rank
        type: integer
        source: input
        description: Allocation precedence, 1 = highest; also the waterfall processing order.
        constraints: "1..4; unique per festival_id"
      - name: allocation_pct
        type: number
        source: input
        description: Share of Festival.allocatable_budget_cents requested for this tier.
        constraints: "0.01..1.00"
      - name: max_slots
        type: integer
        source: input
        description: Maximum number of non-cancelled Bookings this tier may carry.
        constraints: "1..40"
      - name: genre_focus
        type: enum
        source: input
        description: Programming genre this tier is curated around; informational, never used as a selector.
        constraints: "ELECTRONIC | HIP_HOP | ROCK | POP | LATIN | JAZZ_SOUL | COUNTRY | MIXED"
        default: MIXED
      - name: allocation_cents
        type: integer
        source: computed
        description: "Cents allocated by calculations.tier_allocation_waterfall; 0 until allocate-tiers runs."
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of (guarantee_cents + production_fee_cents) over this tier's Bookings with contract_status NOT IN {CANCELLED}."
        default: 0
      - name: slots_committed
        type: integer
        source: computed
        description: "Count of this tier's Bookings with contract_status NOT IN {CANCELLED}."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "OPEN while the tier can absorb another booking; CLOSED once slots_committed == max_slots or committed_cents >= allocation_cents."
        default: OPEN
        constraints: "OPEN | CLOSED"

  - name: Stage
    parent: null
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; the edition this stage belongs to."
      - name: name
        type: string
        source: input
        description: Stage name.
        constraints: "1..80 chars; unique per festival_id"
      - name: capacity
        type: integer
        source: input
        description: Standing capacity of the stage field.
        constraints: ">= 500"
      - name: changeover_buffer_minutes
        type: integer
        source: input
        description: Minutes of changeover that must separate two set intervals on this stage.
        default: 20
        constraints: "0..90"
      - name: daily_curfew_minute
        type: integer
        source: input
        description: Hard curfew as minutes elapsed from 00:00 UTC of the set's start date; 1500 == 01:00 UTC next day.
        constraints: "600..1560"
      - name: daily_program_minutes_cap
        type: integer
        source: input
        description: Aggregate cap on (set minutes + changeover buffer) that may be scheduled on this stage on one UTC calendar date.
        constraints: "60..1200"
      - name: is_flagship
        type: boolean
        source: input
        description: True for the main stage; a HEADLINER-tier offer at billing_position 1 must target a flagship stage.
        default: false
      - name: booked_minutes
        type: integer
        source: computed
        description: "Sum of set_length_minutes over this stage's Bookings with contract_status NOT IN {CANCELLED}; conserved quantity of compensating invariant stage_minutes_conservation."
        default: 0

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Contracting legal entity name.
        constraints: "1..120 chars"
      - name: performing_name
        type: string
        source: input
        description: Billing name used in announcements.
        constraints: "1..120 chars; globally unique"
      - name: primary_genre
        type: enum
        source: input
        description: Genre used by the genre-balance calculation.
        constraints: "ELECTRONIC | HIP_HOP | ROCK | POP | LATIN | JAZZ_SOUL | COUNTRY"
      - name: agency
        type: string
        source: input
        description: Booking agency of record.
        constraints: "1..120 chars"
      - name: draw_score
        type: integer
        source: input
        description: Promoter's 0..100 estimate of ticket-driving power; feeds the guarantee ceiling and both risk-score variants.
        constraints: "0..100"
      - name: default_radius_miles
        type: integer
        source: input
        description: Radius mileage the agency normally demands; used as the default when an offer omits radius_miles.
        default: 75
        constraints: "0..500"
      - name: reported_conflict_count
        type: integer
        source: computed
        description: "Count of this artist's CompetingPerformance rows with status == REPORTED and conflict_assessment == CONFLICT."
        default: 0
      - name: radius_breach_count
        type: integer
        source: computed
        description: "Count of this artist's CompetingPerformance rows with status == VIOLATION."
        default: 0
      - name: strict_risk_score
        type: integer
        source: computed
        description: "STRICT variant of calculations.artist_radius_risk_score."
        default: 0
      - name: adjudicated_risk_score
        type: integer
        source: computed
        description: "ADJUDICATED variant of calculations.artist_radius_risk_score; this variant alone gates offer issuance."
        default: 0

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; the edition being offered."
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the offeree."
      - name: budget_tier_id
        type: string
        source: input
        description: "FK -> BudgetTier.id; the tier the guarantee is drawn from; must belong to festival_id."
      - name: stage_id
        type: string
        source: input
        description: "FK -> Stage.id; the stage the set is proposed on; must belong to festival_id."
      - name: replaces_booking_id
        type: string
        source: input
        description: "FK -> Booking.id; set only on a replacement offer written against a CANCELLED booking; null otherwise."
        default: null
      - name: guarantee_cents
        type: integer
        source: input
        description: Artist guarantee in cents currently on the table.
        constraints: ">= 0"
      - name: production_fee_cents
        type: integer
        source: input
        description: Promoter-borne production cost attached to this offer; charged against the tier alongside the guarantee.
        default: 0
        constraints: ">= 0"
      - name: billing_position
        type: integer
        source: input
        description: Lineup billing slot, 1 = top billing; unique per stage and UTC slot date across Offers with status IN {DRAFT, ISSUED, COUNTERED, ACCEPTED} and Bookings with contract_status NOT IN {CANCELLED} (enforced by validations priority 60, not at creation).
        constraints: "1..200"
      - name: set_length_minutes
        type: integer
        source: input
        description: Stage time offered.
        constraints: "20..180"
      - name: slot_start_utc
        type: datetime
        source: input
        description: Proposed set start, ISO 8601 UTC with three fractional digits.
      - name: slot_end_utc
        type: datetime
        source: computed
        description: "slot_start_utc + set_length_minutes."
      - name: offer_expires_utc
        type: datetime
        source: input
        description: Instant after which the offer may be swept to EXPIRED.
      - name: status
        type: enum
        source: computed
        description: Negotiation state; see state_machines.Offer.
        default: DRAFT
        constraints: "DRAFT | ISSUED | COUNTERED | ACCEPTED | DECLINED | EXPIRED | SUPERSEDED"
      - name: round_number
        type: integer
        source: computed
        description: Count of promoter-side issuances (issue plus each revise); capped by MAX_NEGOTIATION_ROUNDS.
        default: 0
      - name: counter_guarantee_cents
        type: integer
        source: computed
        description: Guarantee demanded by the most recent artist counter; null until a counter is recorded.
        default: null
      - name: counter_billing_position
        type: integer
        source: computed
        description: Billing position demanded by the most recent artist counter; null when the counter did not move it.
        default: null
      - name: counter_set_length_minutes
        type: integer
        source: computed
        description: Set length demanded by the most recent artist counter; null when the counter did not move it.
        default: null
      - name: counter_note
        type: string
        source: computed
        description: Free-text rationale supplied with the most recent artist counter.
        default: null
      - name: guarantee_ceiling_cents
        type: integer
        source: computed
        description: "Ceiling stamped at the most recent issue/revise; see calculations.offer_guarantee_ceiling."
        default: 0
      - name: genre_balance_factor
        type: number
        source: computed
        description: "Factor applied inside the ceiling formula, derived from the artist genre's committed share excluding this offer."
        default: 1.0
      - name: issued_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the TalentBuyer that last issued or revised this offer; never compared to any entity id.
        default: null

  - name: RadiusClause
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: system
        description: "FK -> Offer.id; the offer this clause was created with by POST /festival-ops/offers."
      - name: booking_id
        type: string
        source: computed
        description: "FK -> Booking.id; stamped when the offer is accepted; null while the offer is unaccepted."
        default: null
      - name: artist_id
        type: string
        source: system
        description: "FK -> Artist.id; copied from the offer so enforcement can be evaluated per artist."
      - name: radius_miles
        type: integer
        source: input
        description: Great-circle mileage from the festival market inside which competing performances are restricted.
        constraints: "0..500"
      - name: window_start_date
        type: string
        source: input
        description: First restricted calendar date (YYYY-MM-DD, UTC); the window is closed and includes this date.
      - name: window_end_date
        type: string
        source: input
        description: Last restricted calendar date (YYYY-MM-DD, UTC); the window is closed and includes this date.
        constraints: "must be >= window_start_date"
      - name: exclusivity_scope
        type: enum
        source: input
        description: Which competing performances the clause reaches.
        default: FULL
        constraints: "FULL | TICKETED_ONLY | FESTIVAL_ONLY"
      - name: enforcement_status
        type: enum
        source: computed
        description: Enforcement state; see state_machines.RadiusClause.
        default: PROVISIONAL
        constraints: "PROVISIONAL | ACTIVE | BREACHED | WAIVED | RELEASED"
      - name: waiver_status
        type: enum
        source: computed
        description: Waiver negotiation state driven by waiver-request and waiver-decision.
        default: NONE
        constraints: "NONE | REQUESTED | GRANTED | DENIED"
      - name: waiver_competing_performance_id
        type: string
        source: computed
        description: "FK -> CompetingPerformance.id; the performance the pending or decided waiver concerns; null while waiver_status == NONE."
        default: null
      - name: waiver_fee_offer_cents
        type: integer
        source: input
        description: Fee the artist side offers to buy the waiver; recorded by waiver-request.
        default: 0
        constraints: ">= 0"
      - name: waiver_fee_cents
        type: integer
        source: computed
        description: Fee finally imposed by waiver-decision; enters the settlement total.
        default: 0
      - name: breach_count
        type: integer
        source: computed
        description: Number of times this clause has been driven to BREACHED by an adjudicated violation.
        default: 0

  - name: CompetingPerformance
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the performer of the reported gig."
      - name: venue_city
        type: string
        source: input
        description: Venue city label.
        constraints: "1..80 chars"
      - name: venue_latitude
        type: number
        source: input
        description: Decimal-degree latitude of the reported venue.
        constraints: "-90.0..90.0"
      - name: venue_longitude
        type: number
        source: input
        description: Decimal-degree longitude of the reported venue.
        constraints: "-180.0..180.0"
      - name: performance_date
        type: string
        source: input
        description: Calendar date of the reported gig (YYYY-MM-DD, UTC).
      - name: is_ticketed
        type: boolean
        source: input
        description: True when tickets are sold to the public.
      - name: is_festival
        type: boolean
        source: input
        description: True when the reported gig is itself a festival appearance.
      - name: announced_capacity
        type: integer
        source: input
        description: Announced venue capacity; informational only.
        constraints: ">= 0"
      - name: distance_to_market_miles
        type: number
        source: computed
        description: "Great-circle miles from the conflicting clause's festival market, rounded to 2 decimals; null when conflict_assessment == NO_CONFLICT."
        default: null
      - name: conflict_assessment
        type: enum
        source: computed
        description: "Set at creation by calculations.radius_conflict_detection."
        default: NO_CONFLICT
        constraints: "NO_CONFLICT | CONFLICT"
      - name: conflicting_radius_clause_id
        type: string
        source: computed
        description: "FK -> RadiusClause.id; the single clause selected by calculations.radius_conflict_detection; null when conflict_assessment == NO_CONFLICT."
        default: null
      - name: status
        type: enum
        source: computed
        description: Adjudication state; see state_machines.CompetingPerformance.
        default: REPORTED
        constraints: "REPORTED | CLEARED | VIOLATION | WAIVED"
      - name: reported_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the reporter; never compared to any entity id.

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: computed
        description: "FK -> Festival.id; copied from the accepted offer."
      - name: artist_id
        type: string
        source: computed
        description: "FK -> Artist.id; copied from the accepted offer."
      - name: offer_id
        type: string
        source: computed
        description: "FK -> Offer.id; the accepted offer; unique across Bookings."
      - name: budget_tier_id
        type: string
        source: computed
        description: "FK -> BudgetTier.id; the tier debited by this booking."
      - name: stage_id
        type: string
        source: computed
        description: "FK -> Stage.id; the stage occupied by this booking."
      - name: replaces_booking_id
        type: string
        source: computed
        description: "FK -> Booking.id; copied from the accepted offer's replaces_booking_id; null on an original booking."
        default: null
      - name: announcement_wave_id
        type: string
        source: computed
        description: "FK -> AnnouncementWave.id; stamped by POST /festival-ops/announcement-waves/{id}/assignments; null while unassigned."
        default: null
      - name: reveal_order
        type: integer
        source: computed
        description: Position of this booking inside its announcement wave; null while unassigned.
        default: null
      - name: guarantee_cents
        type: integer
        source: computed
        description: Contracted guarantee; copied from the accepted offer and rewritten by guarantee-amendment.
      - name: production_fee_cents
        type: integer
        source: computed
        description: Contracted production fee; copied from the accepted offer.
      - name: billing_position
        type: integer
        source: computed
        description: Contracted billing position; copied from the accepted offer.
      - name: set_length_minutes
        type: integer
        source: computed
        description: Contracted stage time; copied from the accepted offer.
      - name: slot_start_utc
        type: datetime
        source: computed
        description: Contracted set start; copied from the accepted offer.
      - name: slot_end_utc
        type: datetime
        source: computed
        description: Contracted set end; copied from the accepted offer.
      - name: contract_status
        type: enum
        source: computed
        description: Contracting dimension of the booking; evolves independently of settlement_status.
        default: PENDING_RIDER
        constraints: "PENDING_RIDER | RIDER_SETTLED | COUNTERSIGNED | CLOSED_OUT | CANCELLED"
      - name: settlement_status
        type: enum
        source: computed
        description: Money dimension of the booking; evolves independently of contract_status.
        default: UNFUNDED
        constraints: "UNFUNDED | DEPOSIT_PAID | BALANCE_DUE | SETTLED | WITHHELD | RECOVERY_PENDING | RECOVERED"
      - name: rider_proposed_cents
        type: integer
        source: computed
        description: "PROPOSED_SCOPE variant of calculations.rider_cost_estimate."
        default: 0
      - name: rider_estimate_cents
        type: integer
        source: computed
        description: "CONTRACTED_SCOPE variant of calculations.rider_cost_estimate; the figure that enters the settlement total."
        default: 0
      - name: settlement_total_cents
        type: integer
        source: computed
        description: "Day-of-show settlement figure; see calculations.settlement_total."
        default: 0
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: Sum of paid_amount_cents over this booking's PaymentInstallment rows with installment_type == DEPOSIT and status IN {PAID, CLAWBACK_PENDING, RECOVERED}.
        default: 0
      - name: cancelled_at
        type: datetime
        source: computed
        description: Logical-clock instant of cancellation; null while not cancelled.
        default: null
      - name: cancellation_reason
        type: string
        source: computed
        description: Free text supplied with cancel; null while not cancelled.
        default: null
      - name: cancelling_party
        type: enum
        source: computed
        description: Party that triggered the cancellation; drives the recovery percentages.
        default: null
        constraints: "ARTIST | PROMOTER | FORCE_MAJEURE | null"
      - name: contractual_recovery_cents
        type: integer
        source: computed
        description: "CONTRACTUAL variant of calculations.deposit_recovery; the ceiling on clawbacks."
        default: 0
      - name: actual_recovered_cents
        type: integer
        source: computed
        description: "ACTUAL_CHRONOLOGICAL variant of calculations.deposit_recovery; sum of recovered_cents booked by clawbacks."
        default: 0

  - name: RiderItem
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking whose rider carries this line."
      - name: category
        type: enum
        source: input
        description: Rider chapter this line belongs to.
        constraints: "TECHNICAL | HOSPITALITY | TRAVEL"
      - name: description
        type: string
        source: input
        description: Line description as written in the rider.
        constraints: "1..200 chars"
      - name: quantity
        type: integer
        source: input
        description: Units demanded.
        constraints: "1..500"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Promoter's estimated cost per unit.
        constraints: ">= 0"
      - name: is_promoter_provided
        type: boolean
        source: input
        description: True when the promoter supplies the item in kind; such lines cost 0 in the CONTRACTED_SCOPE variant.
        default: false
      - name: approval_status
        type: enum
        source: computed
        description: Production decision on this line; see state_machines.RiderItem.
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | REJECTED | SUBSTITUTED"
      - name: substitute_unit_cost_cents
        type: integer
        source: computed
        description: Per-unit cost of the substitution accepted by production; null unless approval_status == SUBSTITUTED.
        default: null
      - name: line_cost_cents
        type: integer
        source: computed
        description: "Per-line rounded cost used by both rider variants; see calculations.rider_cost_estimate."
        default: 0

  - name: AdvancePacket
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking being advanced."
      - name: stage_plot_ref
        type: string
        source: input
        description: Reference to the stage plot document.
        constraints: "1..120 chars"
      - name: input_channel_count
        type: integer
        source: input
        description: Number of input-list channels requested.
        constraints: "1..96"
      - name: monitor_mix_count
        type: integer
        source: input
        description: Number of monitor mixes requested.
        constraints: "0..24"
      - name: travel_party_size
        type: integer
        source: input
        description: Head count travelling.
        constraints: "1..60"
      - name: load_in_offset_minutes
        type: integer
        source: input
        description: Minutes before slot_start_utc that load-in must begin.
        constraints: "30..480"
      - name: status
        type: enum
        source: computed
        description: Advance review state; see state_machines.AdvancePacket.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED | APPROVED"
      - name: submission_count
        type: integer
        source: computed
        description: Number of times this packet has been submitted; capped by MAX_ADVANCE_SUBMISSIONS.
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the most recent submitter; compared only against approved_by_user_id for segregation of duties.
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the approver; never compared to any entity id.
        default: null
      - name: return_reason
        type: string
        source: computed
        description: Reason recorded by the most recent return; null until returned once.
        default: null
      - name: channel_overage
        type: integer
        source: computed
        description: "max(0, stage-day input_channel_count total including this packet - STAGE_CHANNEL_ADVISORY (96)); re-stamped on every submit. The hard cap STAGE_CHANNEL_HARD_MAX (112) is a separate gate (validations priority 67), so a packet can be accepted with a positive advisory overage."
        default: 0

  - name: PaymentInstallment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: computed
        description: "FK -> Booking.id; the booking this installment pays."
      - name: installment_type
        type: enum
        source: computed
        description: Deposit or day-of-show balance.
        constraints: "DEPOSIT | BALANCE"
      - name: sequence_index
        type: integer
        source: computed
        description: 1 for DEPOSIT, 2 for BALANCE; stable ordering key inside a booking.
      - name: amount_cents
        type: integer
        source: computed
        description: "Scheduled amount; see calculations.payment_schedule_build."
      - name: due_date
        type: string
        source: computed
        description: Calendar date the installment falls due (YYYY-MM-DD, UTC).
      - name: status
        type: enum
        source: computed
        description: Installment state; see state_machines.PaymentInstallment.
        default: SCHEDULED
        constraints: "SCHEDULED | HELD | RELEASED | PAID | VOIDED | CLAWBACK_PENDING | RECOVERED"
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant of release; null until released.
        default: null
      - name: paid_at
        type: datetime
        source: computed
        description: Logical-clock instant of payment; null until paid.
        default: null
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Amount actually paid; equals amount_cents on mark-paid.
        default: 0
      - name: recovered_cents
        type: integer
        source: computed
        description: Amount clawed back from this installment.
        default: 0

  - name: AnnouncementWave
    parent: null
    common_fields: true
    fields:
      - name: festival_id
        type: string
        source: input
        description: "FK -> Festival.id; the edition being announced."
      - name: wave_number
        type: integer
        source: input
        description: Sequence number of the wave inside the edition.
        constraints: "1..20; unique per festival_id"
      - name: phase
        type: enum
        source: input
        description: Ticket-sales phase this wave is tied to; the festival must have reached this phase before the wave may publish.
        constraints: "PRESALE | TIER1_ONSALE | TIER2_ONSALE | GA_ONSALE"
      - name: scheduled_reveal_utc
        type: datetime
        source: input
        description: Earliest instant the wave may be published.
      - name: status
        type: enum
        source: computed
        description: Wave state; see state_machines.AnnouncementWave.
        default: PLANNED
        constraints: "PLANNED | LOCKED | PUBLISHED"
      - name: assignment_count
        type: integer
        source: computed
        description: Count of Bookings whose announcement_wave_id equals this wave and contract_status NOT IN {CANCELLED}.
        default: 0
      - name: headliner_count
        type: integer
        source: computed
        description: Count of those assigned Bookings whose billing_position == 1 (the headliner ordinal).
        default: 0
      - name: published_at
        type: datetime
        source: computed
        description: Logical-clock instant of publication; null until published.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- 1. Offer: cyclic negotiation (ISSUED -> COUNTERED -> ISSUED) ----------
  - entity: Offer
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /festival-ops/offers/{id}/issue"
        actor: TalentBuyer
        preconditions:
          - "Offer.status == DRAFT"
          - "Festival.tiers_allocated == true"
          - "Festival.lineup_posture IN {OPEN, RESTRICTED}"
          - "BudgetTier.status == OPEN"
          - "BudgetTier.slots_committed < BudgetTier.max_slots"
          - "Artist.adjudicated_risk_score < RISK_BLOCK_THRESHOLD (60)"
          - "Offer.round_number < MAX_NEGOTIATION_ROUNDS (3)"
          - "date(Offer.slot_start_utc) BETWEEN Festival.event_start_date AND Festival.event_end_date, inclusive"
          - "minutes_from_midnight(Offer.slot_end_utc relative to date(slot_start_utc)) <= Stage.daily_curfew_minute"
          - "no stage-interval collision per calculations.stage_interval_conflict"
          - "no other Offer with status IN {DRAFT, ISSUED, COUNTERED, ACCEPTED} and no Booking with contract_status NOT IN {CANCELLED} on the same stage and the same UTC slot date holds this billing_position (see validations priority 60)"
          - "the artist holds no Booking with contract_status NOT IN {CANCELLED} on date(slot_start_utc) in this festival"
          - "stage day load per calculations.stage_day_load <= Stage.daily_program_minutes_cap"
          - "guarantee_cents + production_fee_cents <= calculations.offer_guarantee_ceiling"
          - "projected genre share including this offer <= GENRE_CAP_PCT (0.40)"
          - "if billing_position == 1 then Stage.is_flagship == true, whatever the offer's tier_code (validations priority 62)"
        side_effects:
          - "Offer.round_number += 1"
          - "Offer.genre_balance_factor stamped from calculations.offer_guarantee_ceiling step 2"
          - "Offer.guarantee_ceiling_cents stamped from calculations.offer_guarantee_ceiling"
          - "Offer.issued_by_user_id = X-User-ID"
          - "Offer.slot_end_utc recomputed as slot_start_utc + set_length_minutes"
      - from: ISSUED
        to: COUNTERED
        trigger: "POST /festival-ops/offers/{id}/counter"
        actor: ArtistRep
        preconditions:
          - "Offer.status == ISSUED"
          - "X-User-ID == Offer.artist_id"
          - "clock_now < Offer.offer_expires_utc"
        side_effects:
          - "Offer.counter_guarantee_cents, counter_billing_position, counter_set_length_minutes, counter_note recorded from the request"
          - "Offer.round_number unchanged — only promoter-side issuances consume rounds"
      - from: COUNTERED
        to: ISSUED
        trigger: "POST /festival-ops/offers/{id}/revise"
        actor: TalentBuyer
        note: "The revision cycle; each pass through this edge consumes one negotiation round."
        preconditions:
          - "Offer.status == COUNTERED"
          - "Offer.round_number < MAX_NEGOTIATION_ROUNDS (3)"
          - "every DRAFT->ISSUED precondition re-evaluated against the revised guarantee_cents / billing_position / set_length_minutes"
        side_effects:
          - "Offer.guarantee_cents, billing_position, set_length_minutes overwritten with the revised values (omitted fields keep their current values)"
          - "Offer.round_number += 1"
          - "Offer.guarantee_ceiling_cents and genre_balance_factor recomputed and re-stamped"
          - "Offer.counter_guarantee_cents, counter_billing_position, counter_set_length_minutes, counter_note reset to null"
          - "Offer.issued_by_user_id = X-User-ID"
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /festival-ops/offers/{id}/accept"
        actor: ArtistRep
        note: "CASCADE-1, depth 4. Each hop below is caused by the hop above it, not by the accept call."
        preconditions:
          - "Offer.status == ISSUED"
          - "X-User-ID == Offer.artist_id"
          - "clock_now < Offer.offer_expires_utc"
          - "Festival.lineup_posture IN {OPEN, RESTRICTED}"
          - "BudgetTier.status == OPEN"
          - "BudgetTier.committed_cents + guarantee_cents + production_fee_cents <= BudgetTier.allocation_cents"
          - "no stage-interval collision per calculations.stage_interval_conflict re-evaluated at acceptance time"
          - "billing_position still unheld per the DRAFT->ISSUED uniqueness clause"
          - "if Offer.replaces_booking_id is not null then that Booking.contract_status == CANCELLED"
        side_effects:
          - "hop 1: Offer.status = ACCEPTED; a Booking row is created with contract_status = PENDING_RIDER, settlement_status = UNFUNDED, and every contracted field copied from the offer; RadiusClause.booking_id stamped and RadiusClause.enforcement_status PROVISIONAL -> ACTIVE"
          - "hop 2: the new Booking debits its BudgetTier — committed_cents += (guarantee_cents + production_fee_cents), slots_committed += 1 — and occupies its Stage — booked_minutes += set_length_minutes"
          - "hop 3: the tier debit of hop 2 re-derives BudgetTier.status, which flips OPEN -> CLOSED when slots_committed == max_slots OR committed_cents >= allocation_cents; the same debit re-derives Festival.committed_budget_cents and Festival.headliner_anchor_count, which re-derive Festival.lineup_posture per calculations.festival_lineup_posture"
          - "hop 4: a tier that reached CLOSED in hop 3 transitions every other Offer of that same budget_tier_id with status IN {DRAFT, ISSUED, COUNTERED} to SUPERSEDED, and each superseded offer's RadiusClause goes PROVISIONAL -> RELEASED"
          - "two PaymentInstallment rows (DEPOSIT then BALANCE) are created per calculations.payment_schedule_build"
          - "Booking.settlement_total_cents computed per calculations.settlement_total"
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /festival-ops/offers/{id}/decline"
        actor: ArtistRep
        preconditions:
          - "Offer.status == COUNTERED"
          - "X-User-ID == Offer.artist_id"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /festival-ops/offers/{id}/decline"
        actor: ArtistRep
        preconditions:
          - "Offer.status == ISSUED"
          - "X-User-ID == Offer.artist_id"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /festival-ops/offers/sweep-expired (ops-run checkpoint)"
        actor: system
        preconditions:
          - "Offer.status IN {ISSUED, COUNTERED}"
          - "clock_now >= Offer.offer_expires_utc"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"
          - "the sweep response reports expired_count and expired_offer_ids ordered by Offer.offer_expires_utc ASC, tie-break created_at ASC"
      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /festival-ops/offers/sweep-expired (ops-run checkpoint)"
        actor: system
        preconditions:
          - "Offer.status IN {ISSUED, COUNTERED}"
          - "clock_now >= Offer.offer_expires_utc"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, hop 4 of CASCADE-1 when the offer's BudgetTier reaches CLOSED"
        actor: system
        preconditions:
          - "Offer.status IN {DRAFT, ISSUED, COUNTERED}"
          - "BudgetTier.status transitioned OPEN -> CLOSED in this request"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system, hop 4 of CASCADE-1 when the offer's BudgetTier reaches CLOSED"
        actor: system
        preconditions:
          - "Offer.status IN {DRAFT, ISSUED, COUNTERED}"
          - "BudgetTier.status transitioned OPEN -> CLOSED in this request"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"
      - from: COUNTERED
        to: SUPERSEDED
        trigger: "system, hop 4 of CASCADE-1 when the offer's BudgetTier reaches CLOSED"
        actor: system
        preconditions:
          - "Offer.status IN {DRAFT, ISSUED, COUNTERED}"
          - "BudgetTier.status transitioned OPEN -> CLOSED in this request"
        side_effects:
          - "Offer.RadiusClause enforcement_status -> RELEASED (PROVISIONAL when the offer was never issued, ACTIVE when it was)"

  # --- 2. Booking, dimension A: contract_status -----------------------------
  - entity: Booking
    dimension: contract_status
    initial_state: PENDING_RIDER
    terminal_states: [CLOSED_OUT, CANCELLED]
    note: "Dimension A of a parallel-dimension machine; it advances independently of settlement_status on the same row."
    transitions:
      - from: PENDING_RIDER
        to: RIDER_SETTLED
        trigger: "system, on POST /festival-ops/rider-items/{id}/decision when the last PROPOSED line is decided"
        actor: system
        preconditions:
          - "the booking has >= 1 RiderItem"
          - "zero RiderItem rows of this booking have approval_status == PROPOSED"
        side_effects:
          - "Booking.rider_proposed_cents and Booking.rider_estimate_cents recomputed per calculations.rider_cost_estimate"
          - "Booking.settlement_total_cents recomputed per calculations.settlement_total"
      - from: RIDER_SETTLED
        to: COUNTERSIGNED
        trigger: "POST /festival-ops/bookings/{id}/countersign"
        actor: BusinessAffairs
        preconditions:
          - "Booking.contract_status == RIDER_SETTLED"
          - "the booking's RadiusClause.enforcement_status IN {ACTIVE, WAIVED}"
          - "the booking has an AdvancePacket with status == APPROVED"
        side_effects:
          - "Booking.settlement_total_cents recomputed per calculations.settlement_total"
      - from: COUNTERSIGNED
        to: CLOSED_OUT
        trigger: "system, when Booking.settlement_status becomes SETTLED"
        actor: system
        preconditions:
          - "Booking.contract_status == COUNTERSIGNED"
          - "Booking.settlement_status == SETTLED"
        side_effects:
          - "no further contract dimension transitions are accepted"
      - from: PENDING_RIDER
        to: CANCELLED
        trigger: "POST /festival-ops/bookings/{id}/cancel"
        actor: "TalentBuyer or BusinessAffairs"
        note: "CASCADE-2, depth 4."
        preconditions:
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED, COUNTERSIGNED}"
          - "cancelling_party IN {ARTIST, PROMOTER, FORCE_MAJEURE}"
        side_effects:
          - "hop 1: Booking.contract_status = CANCELLED, cancelled_at = clock_now, cancellation_reason and cancelling_party recorded; Booking.contractual_recovery_cents computed per calculations.deposit_recovery variant CONTRACTUAL"
          - "hop 2: the cancellation credits back its BudgetTier — committed_cents -= (guarantee_cents + production_fee_cents), slots_committed -= 1 — releases its Stage — booked_minutes -= set_length_minutes — voids every PaymentInstallment with status IN {SCHEDULED, HELD, RELEASED} to VOIDED, flags every PaymentInstallment with status == PAID to CLAWBACK_PENDING, and releases the RadiusClause (enforcement_status -> RELEASED, ACTIVE or BREACHED or WAIVED all collapse to RELEASED)"
          - "hop 3: the tier credit of hop 2 re-derives BudgetTier.status (CLOSED -> OPEN when slots_committed < max_slots AND committed_cents < allocation_cents) and re-derives Festival.committed_budget_cents, Festival.headliner_anchor_count and thence Festival.lineup_posture; independently the installment flags of hop 2 set Booking.settlement_status = RECOVERY_PENDING when >= 1 installment is CLAWBACK_PENDING, else RECOVERED with actual_recovered_cents = 0"
          - "hop 4: the booking leaving its wave decrements AnnouncementWave.assignment_count and headliner_count; a wave whose assignment_count reaches 0 while status == LOCKED auto-reverts LOCKED -> PLANNED"
      - from: RIDER_SETTLED
        to: CANCELLED
        trigger: "POST /festival-ops/bookings/{id}/cancel"
        actor: "TalentBuyer or BusinessAffairs"
        preconditions:
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED, COUNTERSIGNED}"
          - "cancelling_party IN {ARTIST, PROMOTER, FORCE_MAJEURE}"
        side_effects:
          - "identical to the PENDING_RIDER -> CANCELLED cascade (CASCADE-2 hops 1-4)"
      - from: COUNTERSIGNED
        to: CANCELLED
        trigger: "POST /festival-ops/bookings/{id}/cancel"
        actor: "TalentBuyer or BusinessAffairs"
        preconditions:
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED, COUNTERSIGNED}"
          - "cancelling_party IN {ARTIST, PROMOTER, FORCE_MAJEURE}"
        side_effects:
          - "identical to the PENDING_RIDER -> CANCELLED cascade (CASCADE-2 hops 1-4)"

  # --- 3. Booking, dimension B: settlement_status ---------------------------
  - entity: Booking
    dimension: settlement_status
    initial_state: UNFUNDED
    terminal_states: [CLOSED_SETTLEMENT_NONE]
    note: "Dimension B of the same parallel-dimension machine. It has no terminal state of its own — SETTLED and RECOVERED are absorbing in practice but the row stays writable through contract_status; the placeholder CLOSED_SETTLEMENT_NONE is never written and exists only to keep the schema key populated."
    transitions:
      - from: UNFUNDED
        to: DEPOSIT_PAID
        trigger: "system, on POST /festival-ops/payment-installments/{id}/mark-paid for the DEPOSIT installment"
        actor: system
        preconditions:
          - "the DEPOSIT installment of this booking reached status == PAID"
          - "Booking.settlement_status == UNFUNDED"
        side_effects:
          - "Booking.deposit_paid_cents = sum of paid_amount_cents over DEPOSIT installments with status IN {PAID, CLAWBACK_PENDING, RECOVERED}"
          - "Booking.settlement_total_cents recomputed per calculations.settlement_total"
      - from: DEPOSIT_PAID
        to: BALANCE_DUE
        trigger: "system, on POST /festival-ops/payment-installments/{id}/release for the BALANCE installment"
        actor: system
        preconditions:
          - "the BALANCE installment of this booking reached status == RELEASED"
          - "Booking.settlement_status == DEPOSIT_PAID"
        side_effects:
          - "Booking.settlement_total_cents recomputed per calculations.settlement_total"
      - from: BALANCE_DUE
        to: SETTLED
        trigger: "system, on POST /festival-ops/payment-installments/{id}/mark-paid for the BALANCE installment"
        actor: system
        preconditions:
          - "the BALANCE installment of this booking reached status == PAID"
        side_effects:
          - "Booking.contract_status COUNTERSIGNED -> CLOSED_OUT bubbles up when the contract dimension is COUNTERSIGNED"
      - from: UNFUNDED
        to: WITHHELD
        trigger: "system, hop 4 of CASCADE-3 when the booking's RadiusClause reaches BREACHED"
        actor: system
        preconditions:
          - "Booking.settlement_status IN {UNFUNDED, DEPOSIT_PAID, BALANCE_DUE}"
          - ">= 1 PaymentInstallment of this booking moved SCHEDULED -> HELD in this request"
        side_effects:
          - "no money may be released while WITHHELD — POST /festival-ops/payment-installments/{id}/release is rejected with ERR_RADIUS_BREACH_ACTIVE"
      - from: DEPOSIT_PAID
        to: WITHHELD
        trigger: "system, hop 4 of CASCADE-3 when the booking's RadiusClause reaches BREACHED"
        actor: system
        preconditions:
          - "Booking.settlement_status IN {UNFUNDED, DEPOSIT_PAID, BALANCE_DUE}"
          - ">= 1 PaymentInstallment of this booking moved SCHEDULED -> HELD in this request"
        side_effects:
          - "prior settlement_status memorised implicitly — the WITHHELD -> * recovery edge re-derives it from installment statuses"
      - from: BALANCE_DUE
        to: WITHHELD
        trigger: "system, hop 4 of CASCADE-3 when the booking's RadiusClause reaches BREACHED"
        actor: system
        preconditions:
          - "Booking.settlement_status IN {UNFUNDED, DEPOSIT_PAID, BALANCE_DUE}"
          - ">= 1 PaymentInstallment of this booking moved SCHEDULED -> HELD in this request"
        side_effects:
          - "prior settlement_status memorised implicitly — the WITHHELD -> * recovery edge re-derives it from installment statuses"
      - from: WITHHELD
        to: DEPOSIT_PAID
        trigger: "system, on POST /festival-ops/radius-clauses/{id}/waiver-decision with decision == GRANTED (CASCADE-4)"
        actor: system
        note: "Compensating edge. The target state is re-derived, never remembered: SETTLED if both installments are PAID, else BALANCE_DUE if the BALANCE installment is RELEASED, else DEPOSIT_PAID if the DEPOSIT installment is PAID, else UNFUNDED."
        preconditions:
          - "Booking.settlement_status == WITHHELD"
          - "the booking's RadiusClause.enforcement_status became WAIVED in this request"
        side_effects:
          - "every PaymentInstallment of this booking with status == HELD returns to SCHEDULED"
          - "Booking.settlement_total_cents recomputed per calculations.settlement_total, now including RadiusClause.waiver_fee_cents"
      - from: WITHHELD
        to: UNFUNDED
        trigger: "system, on POST /festival-ops/radius-clauses/{id}/waiver-decision with decision == GRANTED (CASCADE-4)"
        actor: system
        preconditions:
          - "Booking.settlement_status == WITHHELD"
          - "no PaymentInstallment of this booking has status IN {PAID, RELEASED}"
        side_effects:
          - "every PaymentInstallment of this booking with status == HELD returns to SCHEDULED"
      - from: UNFUNDED
        to: RECOVERY_PENDING
        trigger: "system, hop 3 of CASCADE-2"
        actor: system
        preconditions:
          - "Booking.contract_status became CANCELLED in this request"
          - ">= 1 PaymentInstallment of this booking has status == CLAWBACK_PENDING"
        side_effects:
          - "Booking.contractual_recovery_cents stamped per calculations.deposit_recovery variant CONTRACTUAL"
      - from: DEPOSIT_PAID
        to: RECOVERY_PENDING
        trigger: "system, hop 3 of CASCADE-2"
        actor: system
        preconditions:
          - "Booking.contract_status became CANCELLED in this request"
          - ">= 1 PaymentInstallment of this booking has status == CLAWBACK_PENDING"
        side_effects:
          - "Booking.contractual_recovery_cents stamped per calculations.deposit_recovery variant CONTRACTUAL"
      - from: RECOVERY_PENDING
        to: RECOVERED
        trigger: "system, on POST /festival-ops/payment-installments/{id}/clawback when the last CLAWBACK_PENDING installment is resolved"
        actor: system
        preconditions:
          - "Booking.settlement_status == RECOVERY_PENDING"
          - "zero PaymentInstallment rows of this booking have status == CLAWBACK_PENDING"
        side_effects:
          - "Booking.actual_recovered_cents = sum of recovered_cents over this booking's installments in due_date ASC, created_at ASC order per calculations.deposit_recovery variant ACTUAL_CHRONOLOGICAL"
      - from: UNFUNDED
        to: RECOVERED
        trigger: "system, hop 3 of CASCADE-2 when nothing was ever paid"
        actor: system
        preconditions:
          - "Booking.contract_status became CANCELLED in this request"
          - "zero PaymentInstallment rows of this booking have status == CLAWBACK_PENDING"
        side_effects:
          - "Booking.actual_recovered_cents = 0 and Booking.contractual_recovery_cents stamped per calculations.deposit_recovery variant CONTRACTUAL"

  # --- 4. AdvancePacket: cyclic revision loop -------------------------------
  - entity: AdvancePacket
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /festival-ops/advance-packets/{id}/submit"
        actor: "ArtistRep or ProductionManager"
        preconditions:
          - "AdvancePacket.status IN {DRAFT, RETURNED}"
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED}"
          - "AdvancePacket.submission_count < MAX_ADVANCE_SUBMISSIONS (3)"
          - "sum(input_channel_count over AdvancePacket rows with status IN {SUBMITTED, APPROVED} whose booking shares this stage and this UTC slot date) + this packet's input_channel_count <= STAGE_CHANNEL_HARD_MAX (112)"
        side_effects:
          - "AdvancePacket.submission_count += 1"
          - "AdvancePacket.submitted_by_user_id = X-User-ID"
          - "AdvancePacket.channel_overage = max(0, stage-day input_channel_count total including this packet - STAGE_CHANNEL_ADVISORY (96))"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /festival-ops/advance-packets/{id}/return"
        actor: ProductionManager
        preconditions:
          - "AdvancePacket.status == SUBMITTED"
        side_effects:
          - "AdvancePacket.return_reason recorded"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /festival-ops/advance-packets/{id}/submit"
        actor: "ArtistRep or ProductionManager"
        note: "The revision cycle; submission_count is the loop counter and MAX_ADVANCE_SUBMISSIONS is the termination condition."
        preconditions:
          - "AdvancePacket.status IN {DRAFT, RETURNED}"
          - "AdvancePacket.submission_count < MAX_ADVANCE_SUBMISSIONS (3)"
        side_effects:
          - "AdvancePacket.submission_count += 1"
          - "AdvancePacket.submitted_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /festival-ops/advance-packets/{id}/approve"
        actor: ProductionManager
        preconditions:
          - "AdvancePacket.status == SUBMITTED"
          - "X-User-ID != AdvancePacket.submitted_by_user_id (segregation of duties)"
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED}"
          - "load_in_offset_minutes fits before the slot: slot_start_utc - load_in_offset_minutes >= 00:00 UTC of date(slot_start_utc)"
        side_effects:
          - "AdvancePacket.approved_by_user_id = X-User-ID"
          - "AdvancePacket.channel_overage left exactly as the last submit stamped it — approval never recomputes it"

  # --- 5. PaymentInstallment ------------------------------------------------
  - entity: PaymentInstallment
    initial_state: SCHEDULED
    terminal_states: [VOIDED, RECOVERED]
    transitions:
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /festival-ops/payment-installments/{id}/release"
        actor: FinanceController
        preconditions:
          - "PaymentInstallment.status == SCHEDULED"
          - "Booking.settlement_status != WITHHELD"
          - "the booking's RadiusClause.enforcement_status NOT IN {BREACHED}"
          - "if installment_type == BALANCE then Booking.contract_status == COUNTERSIGNED"
          - "date(clock_now) >= due_date - RELEASE_WINDOW_DAYS (7)"
        side_effects:
          - "PaymentInstallment.released_at = clock_now"
          - "for installment_type == BALANCE: Booking.settlement_status DEPOSIT_PAID -> BALANCE_DUE"
      - from: RELEASED
        to: PAID
        trigger: "POST /festival-ops/payment-installments/{id}/mark-paid"
        actor: FinanceController
        preconditions:
          - "PaymentInstallment.status == RELEASED"
        side_effects:
          - "PaymentInstallment.paid_at = clock_now, paid_amount_cents = amount_cents"
          - "for installment_type == DEPOSIT: Booking.deposit_paid_cents recomputed and Booking.settlement_status UNFUNDED -> DEPOSIT_PAID"
          - "for installment_type == BALANCE: Booking.settlement_status BALANCE_DUE -> SETTLED, which bubbles Booking.contract_status COUNTERSIGNED -> CLOSED_OUT"
          - "Booking.settlement_total_cents recomputed per calculations.settlement_total"
      - from: SCHEDULED
        to: HELD
        trigger: "system, hop 3 of CASCADE-3"
        actor: system
        preconditions:
          - "PaymentInstallment.status == SCHEDULED"
          - "the booking's RadiusClause.enforcement_status became BREACHED in this request"
        side_effects:
          - "hop 4 of CASCADE-3: Booking.settlement_status -> WITHHELD"
      - from: HELD
        to: SCHEDULED
        trigger: "system, CASCADE-4 on waiver-decision GRANTED"
        actor: system
        preconditions:
          - "PaymentInstallment.status == HELD"
          - "the booking's RadiusClause.enforcement_status became WAIVED in this request"
        side_effects:
          - "Booking.settlement_status re-derived off installment statuses per the WITHHELD -> * edges"
      - from: SCHEDULED
        to: VOIDED
        trigger: "system, hop 2 of CASCADE-2, or PATCH /festival-ops/bookings/{id}/guarantee-amendment"
        actor: system
        preconditions:
          - "PaymentInstallment.status IN {SCHEDULED, HELD, RELEASED}"
          - "the booking was cancelled, or its guarantee was amended, in this request"
        side_effects:
          - "on guarantee-amendment the voided rows are replaced by rebuilt SCHEDULED rows whose amounts absorb the whole difference, so that sum(amount_cents for installments with status NOT IN {VOIDED}) again equals Booking.guarantee_cents; PAID and RELEASED rows are never rewritten"
      - from: HELD
        to: VOIDED
        trigger: "system, hop 2 of CASCADE-2"
        actor: system
        preconditions:
          - "PaymentInstallment.status IN {SCHEDULED, HELD, RELEASED}"
          - "the booking was cancelled in this request"
        side_effects:
          - "no money movement — a HELD installment was never released"
      - from: RELEASED
        to: VOIDED
        trigger: "system, hop 2 of CASCADE-2, or PATCH /festival-ops/bookings/{id}/guarantee-amendment"
        actor: system
        preconditions:
          - "PaymentInstallment.status IN {SCHEDULED, HELD, RELEASED}"
          - "the booking was cancelled, or its guarantee was amended, in this request"
        side_effects:
          - "no money movement — a RELEASED installment was never marked paid"
      - from: PAID
        to: CLAWBACK_PENDING
        trigger: "system, hop 2 of CASCADE-2"
        actor: system
        preconditions:
          - "PaymentInstallment.status == PAID"
          - "the booking was cancelled in this request"
        side_effects:
          - "Booking.settlement_status -> RECOVERY_PENDING (hop 3 of CASCADE-2)"
      - from: CLAWBACK_PENDING
        to: RECOVERED
        trigger: "POST /festival-ops/payment-installments/{id}/clawback"
        actor: FinanceController
        preconditions:
          - "PaymentInstallment.status == CLAWBACK_PENDING"
          - "recovered_cents <= Booking.contractual_recovery_cents - Booking.actual_recovered_cents"
          - "recovered_cents <= PaymentInstallment.paid_amount_cents"
        side_effects:
          - "PaymentInstallment.recovered_cents = request recovered_cents"
          - "Booking.actual_recovered_cents += recovered_cents"
          - "when zero installments of the booking remain CLAWBACK_PENDING: Booking.settlement_status RECOVERY_PENDING -> RECOVERED"

  # --- 6. RadiusClause -----------------------------------------------------
  - entity: RadiusClause
    initial_state: PROVISIONAL
    terminal_states: [RELEASED]
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "system, on POST /festival-ops/offers/{id}/issue; hop 1 of CASCADE-1 on POST /festival-ops/offers/{id}/accept additionally stamps booking_id"
        actor: system
        preconditions:
          - "RadiusClause.enforcement_status == PROVISIONAL"
          - "the clause's Offer.status became ISSUED or ACCEPTED in this request"
        side_effects:
          - "the clause enters calculations.radius_conflict_detection's candidate set from issuance onward, with booking_id still null until acceptance"
          - "RadiusClause.booking_id stamped with the new Booking.id when the cause was an acceptance"
      - from: ACTIVE
        to: BREACHED
        trigger: "system, hop 2 of CASCADE-3 on POST /festival-ops/competing-performances/{id}/adjudicate with finding == VIOLATION"
        actor: system
        preconditions:
          - "RadiusClause.enforcement_status == ACTIVE"
          - "the adjudicated CompetingPerformance.conflicting_radius_clause_id == this clause id"
        side_effects:
          - "RadiusClause.breach_count += 1"
          - "hop 3 of CASCADE-3: every PaymentInstallment of RadiusClause.booking_id with status == SCHEDULED moves to HELD"
      - from: BREACHED
        to: WAIVED
        trigger: "POST /festival-ops/radius-clauses/{id}/waiver-decision with decision == GRANTED"
        actor: BusinessAffairs
        note: "CASCADE-4, the compensating chain for CASCADE-3."
        preconditions:
          - "RadiusClause.enforcement_status == BREACHED"
          - "RadiusClause.waiver_status == REQUESTED"
          - "waiver_fee_cents >= RadiusClause.waiver_fee_offer_cents"
        side_effects:
          - "RadiusClause.waiver_status = GRANTED, waiver_fee_cents recorded"
          - "the waived CompetingPerformance moves VIOLATION -> WAIVED, which re-derives Artist.radius_breach_count and both Artist risk-score variants"
          - "every HELD PaymentInstallment of the booking returns to SCHEDULED, which re-derives Booking.settlement_status off installment statuses"
          - "Booking.settlement_total_cents recomputed, now including waiver_fee_cents"
      - from: BREACHED
        to: BREACHED
        trigger: "POST /festival-ops/radius-clauses/{id}/waiver-decision with decision == DENIED"
        actor: BusinessAffairs
        note: "Self-edge: the denial records waiver_status = DENIED and leaves enforcement_status BREACHED, so the money stays HELD."
        preconditions:
          - "RadiusClause.enforcement_status == BREACHED"
          - "RadiusClause.waiver_status == REQUESTED"
        side_effects:
          - "RadiusClause.waiver_status = DENIED, waiver_fee_cents stays 0"
      - from: PROVISIONAL
        to: RELEASED
        trigger: "system, on the clause's Offer reaching DECLINED, EXPIRED or SUPERSEDED"
        actor: system
        preconditions:
          - "RadiusClause.enforcement_status == PROVISIONAL"
          - "the clause's Offer.status IN {DECLINED, EXPIRED, SUPERSEDED}"
        side_effects:
          - "the clause stops participating in calculations.radius_conflict_detection candidate sets"
      - from: ACTIVE
        to: RELEASED
        trigger: "system, hop 2 of CASCADE-2 on POST /festival-ops/bookings/{id}/cancel, or on the clause's Offer reaching DECLINED, EXPIRED or SUPERSEDED before it was ever accepted"
        actor: system
        preconditions:
          - "RadiusClause.enforcement_status IN {ACTIVE, BREACHED, WAIVED}"
          - "the clause's Booking.contract_status became CANCELLED in this request, or the clause's Offer.status became DECLINED, EXPIRED or SUPERSEDED in this request"
        side_effects:
          - "the clause stops participating in calculations.radius_conflict_detection candidate sets"
      - from: BREACHED
        to: RELEASED
        trigger: "system, hop 2 of CASCADE-2 on POST /festival-ops/bookings/{id}/cancel"
        actor: system
        preconditions:
          - "RadiusClause.enforcement_status IN {ACTIVE, BREACHED, WAIVED}"
          - "the clause's Booking.contract_status became CANCELLED in this request"
        side_effects:
          - "the clause stops participating in calculations.radius_conflict_detection candidate sets"
      - from: WAIVED
        to: RELEASED
        trigger: "system, hop 2 of CASCADE-2 on POST /festival-ops/bookings/{id}/cancel"
        actor: system
        preconditions:
          - "RadiusClause.enforcement_status IN {ACTIVE, BREACHED, WAIVED}"
          - "the clause's Booking.contract_status became CANCELLED in this request"
        side_effects:
          - "the clause stops participating in calculations.radius_conflict_detection candidate sets"

  # --- 7. CompetingPerformance: branching adjudication ----------------------
  - entity: CompetingPerformance
    initial_state: REPORTED
    terminal_states: [CLEARED, WAIVED]
    transitions:
      - from: REPORTED
        to: CLEARED
        trigger: "POST /festival-ops/competing-performances/{id}/adjudicate with finding == CLEARED"
        actor: BusinessAffairs
        note: "Branch 1 of the fork. Its side-effect set is disjoint from branch 2's."
        preconditions:
          - "CompetingPerformance.status == REPORTED"
          - "CompetingPerformance.conflict_assessment IN {CONFLICT, NO_CONFLICT} — a CLEARED finding is how business affairs rules that a detected CONFLICT is not a breach, so it is the branch that reverses Artist.reported_conflict_count"
        side_effects:
          - "Artist.reported_conflict_count re-derived (this row leaves the REPORTED set)"
          - "Artist.strict_risk_score and Artist.adjudicated_risk_score recomputed per calculations.artist_radius_risk_score"
      - from: REPORTED
        to: VIOLATION
        trigger: "POST /festival-ops/competing-performances/{id}/adjudicate with finding == VIOLATION"
        actor: BusinessAffairs
        note: "Branch 2 of the fork and hop 1 of CASCADE-3, depth 4."
        preconditions:
          - "CompetingPerformance.status == REPORTED"
          - "CompetingPerformance.conflict_assessment == CONFLICT"
          - "CompetingPerformance.conflicting_radius_clause_id is not null"
        side_effects:
          - "hop 1: CompetingPerformance.status = VIOLATION; Artist.radius_breach_count and Artist.reported_conflict_count re-derived; both Artist risk-score variants recomputed"
          - "hop 2: the violation drives the conflicting RadiusClause ACTIVE -> BREACHED and increments its breach_count"
          - "hop 3: the clause reaching BREACHED moves every PaymentInstallment of RadiusClause.booking_id with status == SCHEDULED to HELD"
          - "hop 4: those holds set Booking.settlement_status -> WITHHELD"
      - from: VIOLATION
        to: WAIVED
        trigger: "system, CASCADE-4 on POST /festival-ops/radius-clauses/{id}/waiver-decision with decision == GRANTED"
        actor: system
        preconditions:
          - "CompetingPerformance.status == VIOLATION"
          - "the clause's waiver_competing_performance_id == this performance id"
        side_effects:
          - "Artist.radius_breach_count re-derived and both Artist risk-score variants recomputed"

  # --- 8. RiderItem --------------------------------------------------------
  - entity: RiderItem
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, SUBSTITUTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /festival-ops/rider-items/{id}/decision with decision == APPROVED"
        actor: ProductionManager
        preconditions:
          - "RiderItem.approval_status == PROPOSED"
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED}"
        side_effects:
          - "RiderItem.line_cost_cents recomputed per calculations.rider_cost_estimate step 1"
          - "Booking.rider_proposed_cents and rider_estimate_cents recomputed; Booking.settlement_total_cents recomputed"
          - "when zero RiderItem rows of the booking remain PROPOSED: Booking.contract_status PENDING_RIDER -> RIDER_SETTLED"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /festival-ops/rider-items/{id}/decision with decision == REJECTED"
        actor: ProductionManager
        preconditions:
          - "RiderItem.approval_status == PROPOSED"
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED}"
        side_effects:
          - "RiderItem.line_cost_cents recomputed (a REJECTED line still carries its own line cost but leaves both variant input sets)"
          - "Booking.rider_proposed_cents and rider_estimate_cents recomputed; Booking.settlement_total_cents recomputed"
          - "when zero RiderItem rows of the booking remain PROPOSED: Booking.contract_status PENDING_RIDER -> RIDER_SETTLED"
      - from: PROPOSED
        to: SUBSTITUTED
        trigger: "POST /festival-ops/rider-items/{id}/decision with decision == SUBSTITUTED"
        actor: ProductionManager
        preconditions:
          - "RiderItem.approval_status == PROPOSED"
          - "Booking.contract_status IN {PENDING_RIDER, RIDER_SETTLED}"
          - "substitute_unit_cost_cents is present and >= 0"
        side_effects:
          - "RiderItem.substitute_unit_cost_cents recorded and line_cost_cents recomputed off it"
          - "Booking.rider_proposed_cents and rider_estimate_cents recomputed; Booking.settlement_total_cents recomputed"
          - "when zero RiderItem rows of the booking remain PROPOSED: Booking.contract_status PENDING_RIDER -> RIDER_SETTLED"

  # --- 9. AnnouncementWave: lock/unlock cycle ------------------------------
  - entity: AnnouncementWave
    initial_state: PLANNED
    terminal_states: [PUBLISHED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /festival-ops/announcement-waves/{id}/lock"
        actor: "TalentBuyer or BusinessAffairs"
        preconditions:
          - "AnnouncementWave.status == PLANNED"
          - "AnnouncementWave.assignment_count >= 1"
          - "every Booking with announcement_wave_id == this wave and contract_status NOT IN {CANCELLED} has contract_status == COUNTERSIGNED"
          - "AnnouncementWave.phase == Festival.announcement_phase (validations priority 36)"
          - "AnnouncementWave.scheduled_reveal_utc < 00:00:00.000Z of Festival.event_start_date"
        side_effects:
          - "the wave's assigned bookings can no longer be reassigned to another wave"
      - from: LOCKED
        to: PLANNED
        trigger: "system, hop 4 of CASCADE-2 when assignment_count reaches 0"
        actor: system
        note: "The lock/unlock cycle; the only edge back to PLANNED."
        preconditions:
          - "AnnouncementWave.status == LOCKED"
          - "AnnouncementWave.assignment_count reached 0 in this request"
        side_effects:
          - "AnnouncementWave.headliner_count re-derived to 0"
      - from: LOCKED
        to: PUBLISHED
        trigger: "POST /festival-ops/announcement-waves/{id}/publish"
        actor: TalentBuyer
        preconditions:
          - "AnnouncementWave.status == LOCKED"
          - "clock_now >= AnnouncementWave.scheduled_reveal_utc"
          - "AnnouncementWave.phase == Festival.announcement_phase (validations priority 36)"
        side_effects:
          - "AnnouncementWave.published_at = clock_now"

  # --- 10. Festival announcement phase ------------------------------------
  - entity: Festival
    dimension: announcement_phase
    initial_state: PRESALE
    terminal_states: [GA_ONSALE]
    transitions:
      - from: PRESALE
        to: TIER1_ONSALE
        trigger: "POST /festival-ops/festivals/{id}/advance-phase"
        actor: TalentBuyer
        preconditions:
          - "Festival.announcement_phase == PRESALE"
          - "at least one AnnouncementWave of this festival has phase == PRESALE and every such wave has status == PUBLISHED (validations priority 59)"
        side_effects:
          - "Festival.lineup_posture recomputed per calculations.festival_lineup_posture"
      - from: TIER1_ONSALE
        to: TIER2_ONSALE
        trigger: "POST /festival-ops/festivals/{id}/advance-phase"
        actor: TalentBuyer
        preconditions:
          - "Festival.announcement_phase == TIER1_ONSALE"
          - "at least one AnnouncementWave of this festival has phase == TIER1_ONSALE and every such wave has status == PUBLISHED (validations priority 59)"
        side_effects:
          - "Festival.lineup_posture recomputed per calculations.festival_lineup_posture"
      - from: TIER2_ONSALE
        to: GA_ONSALE
        trigger: "POST /festival-ops/festivals/{id}/advance-phase"
        actor: TalentBuyer
        preconditions:
          - "Festival.announcement_phase == TIER2_ONSALE"
          - "at least one AnnouncementWave of this festival has phase == TIER2_ONSALE and every such wave has status == PUBLISHED (validations priority 59)"
        side_effects:
          - "Festival.lineup_posture recomputed per calculations.festival_lineup_posture — GA_ONSALE forces FROZEN, which rejects every further offer issue and offer accept with ERR_LINEUP_FROZEN"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: tier-allocation-stale-festival
    parent_entity: Festival
    write_endpoint: "POST /festival-ops/festivals/{id}/allocate-tiers"
    occ_field: "expected_festival_version"
    description: |
      Re-running the tier waterfall against a Festival whose version has
      advanced since the client last read it is rejected. A re-allocation
      legitimately supersedes the previous allocation_cents figures, so the
      operation is repeatable by design; the OCC check is what stops a client
      from overwriting an allocation it never observed (for example one written
      after another BudgetTier was added, which changed the pct denominator).
    error_id: ERR_STALE_FESTIVAL_VERSION
    http_status: 412

  - rule_id: guarantee-amendment-stale-booking
    parent_entity: Booking
    write_endpoint: "PATCH /festival-ops/bookings/{id}/guarantee-amendment"
    occ_field: "expected_booking_version"
    description: |
      Amending a Booking's guarantee supersedes its whole scheduled installment
      pair, so a second amendment is legitimate on its own terms. The OCC check
      rejects an amendment computed against a stale view of the booking — the
      version the client holds predates an earlier amendment, a rider decision
      that moved settlement_total_cents, or a deposit payment.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

  - rule_id: wave-assignment-stale-wave
    parent_entity: AnnouncementWave
    write_endpoint: "POST /festival-ops/announcement-waves/{id}/assignments"
    occ_field: "expected_announcement_wave_version"
    description: |
      Assigning a Booking into an AnnouncementWave is rejected when the wave's
      version has advanced past the client's last read. Each assignment mutates
      the wave's assignment_count and headliner_count, so a client that decided
      reveal_order from a stale wave snapshot would be sequencing against a
      lineup it never saw.
    error_id: ERR_STALE_WAVE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: tier_allocation_waterfall
    trigger: "POST /festival-ops/festivals/{id}/allocate-tiers"
    algorithm: waterfall_allocation
    formula: |
      # step 0 - the reserve is taken off the top, once, with round_half_up
      allocatable_budget_cents =
          Festival.talent_budget_cents
        - round_half_up(Festival.talent_budget_cents * Festival.contingency_reserve_pct)

      # step 1 - candidate set and order are explicit; tier_rank is unique per
      # festival so the created_at tie-break can never actually fire
      tiers = [BudgetTier rows with festival_id == Festival.id]
              sorted by tier_rank ASC, then created_at ASC
      reject with ERR_ALLOCATION_PCT_INVALID unless abs(sum(t.allocation_pct for t in tiers) - 1.00) <= 1e-9
      reject with ERR_ALLOCATION_PCT_INVALID when tiers is empty

      # step 2 - PINNED ROUNDING ORDER: floor every tier first, never round_half_up
      for t in tiers:
          t.allocation_cents = floor(allocatable_budget_cents * t.allocation_pct)

      # step 3 - the whole floor remainder goes to the single lowest tier_rank,
      # it is never spread across tiers and never re-floored
      remainder = allocatable_budget_cents - sum(t.allocation_cents for t in tiers)
      tiers[0].allocation_cents += remainder

      Festival.tiers_allocated = true
      Festival.version += 1
    input_set: "All BudgetTier rows of the festival regardless of status; no tier is skipped. Requires Festival.committed_budget_cents == 0."
    constants: {}
    precision: "Integer cents. floor() per tier, single round_half_up on the reserve, remainder assigned whole to tier_rank 1."
    variants: []

  - name: genre_balance_share
    trigger: "Evaluated twice inside POST /festival-ops/offers/{id}/issue and POST /festival-ops/offers/{id}/revise — once excluding the evaluated offer (to pick the ceiling factor) and once including it (to apply the cap)."
    algorithm: aggregation
    formula: |
      numerator(G, include_evaluated_offer) =
          sum(b.guarantee_cents for b in Bookings
              where b.festival_id == F.id
                and b.contract_status NOT IN {CANCELLED}
                and Artist(b.artist_id).primary_genre == G)
        + sum(o.guarantee_cents for o in Offers
              where o.festival_id == F.id
                and o.status IN {ISSUED, COUNTERED}
                and o.id != evaluated_offer.id
                and Artist(o.artist_id).primary_genre == G)
        + (evaluated_offer.guarantee_cents if include_evaluated_offer else 0)

      denominator = Festival.allocatable_budget_cents      # never 0
      share(G, include) = numerator(G, include) / denominator     # exact rational, no intermediate rounding

      cap check  : reject with ERR_GENRE_CAP_EXCEEDED when share(G, include=true) > GENRE_CAP_PCT
                   -- a share of exactly GENRE_CAP_PCT passes (strict >)
      factor input: share(G, include=false) feeds offer_guarantee_ceiling step 3
    input_set: "Bookings with contract_status NOT IN {CANCELLED} plus Offers with status IN {ISSUED, COUNTERED}; DRAFT, ACCEPTED, DECLINED, EXPIRED and SUPERSEDED offers are excluded because an ACCEPTED offer is already represented by its Booking."
    constants:
      GENRE_CAP_PCT: 0.40
      GENRE_SOFT_PCT: 0.30
    precision: "Exact rational comparison against the constants; the share itself is never rounded or stored."
    variants: []

  - name: offer_guarantee_ceiling
    trigger: "POST /festival-ops/offers/{id}/issue and POST /festival-ops/offers/{id}/revise; the result is stamped on Offer.guarantee_ceiling_cents and the factor on Offer.genre_balance_factor."
    algorithm: threshold
    formula: |
      # >= 3 independent inputs with nested min/max and a conditional branch
      step 1: tier_headroom     = BudgetTier.allocation_cents - BudgetTier.committed_cents
      step 2: festival_headroom = Festival.allocatable_budget_cents - Festival.committed_budget_cents
      step 3: s = genre_balance_share(Artist.primary_genre, include_evaluated_offer = false)
              genre_balance_factor = 1.00 if s <= GENRE_SOFT_PCT
                                     0.85 if GENRE_SOFT_PCT < s <= GENRE_CAP_PCT
                                     0.60 if s > GENRE_CAP_PCT
      step 4: draw_component = max(BASE_FLOOR_CENTS, Artist.draw_score * DRAW_UNIT_CENTS)
      step 5: scaled = floor(draw_component * genre_balance_factor)     # single rounding step
      step 6: guarantee_ceiling_cents = min(tier_headroom, festival_headroom, scaled)

      gate: reject with ERR_GUARANTEE_CEILING_EXCEEDED when
            Offer.guarantee_cents + Offer.production_fee_cents > guarantee_ceiling_cents
            -- equality passes (strict >)
    input_set: "The offer's own BudgetTier and Festival aggregates as of this request, plus the artist's draw_score and the genre share excluding this offer."
    constants:
      BASE_FLOOR_CENTS: 500000
      DRAW_UNIT_CENTS: 25000
      GENRE_SOFT_PCT: 0.30
      GENRE_CAP_PCT: 0.40
    precision: "Integer cents; floor() applied once at step 5, never per-input."
    variants: []

  - name: rider_cost_estimate
    trigger: "POST /festival-ops/rider-items/{id}/decision (both variants re-stamped on Booking.rider_proposed_cents and Booking.rider_estimate_cents), and read on demand via GET /festival-ops/bookings/{id}/rider-estimate."
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: each line is rounded to whole cents FIRST, then the
      # rounded line values are summed. Summing raw products and rounding once at
      # the end is the wrong reading and yields a different total.
      step 1 (per RiderItem r of the booking):
          effective_unit = r.substitute_unit_cost_cents if r.approval_status == SUBSTITUTED
                           else r.unit_cost_cents
          escalation     = TRAVEL_ESCALATION_PCT if r.category == TRAVEL else 0.00
          r.line_cost_cents = round_half_up(r.quantity * effective_unit * (1 + escalation))

      step 2 (variant PROPOSED_SCOPE):
          included = [r where r.approval_status IN {PROPOSED, APPROVED, SUBSTITUTED}]
          value(r) = r.line_cost_cents                        # promoter-provided lines count in full, no caps
          Booking.rider_proposed_cents = sum(value(r) for r in included)

      step 3 (variant CONTRACTED_SCOPE):
          included = [r where r.approval_status IN {APPROVED, SUBSTITUTED}]
          value(r) = 0                                                    if r.is_promoter_provided == true
                     min(r.line_cost_cents, HOSPITALITY_LINE_CAP_CENTS)   if r.category == HOSPITALITY
                     r.line_cost_cents                                    otherwise
          Booking.rider_estimate_cents = sum(value(r) for r in included)
    input_set: "All RiderItem rows of the booking. PROPOSED_SCOPE includes undecided lines and excludes REJECTED; CONTRACTED_SCOPE includes only APPROVED and SUBSTITUTED lines."
    constants:
      TRAVEL_ESCALATION_PCT: 0.12
      HOSPITALITY_LINE_CAP_CENTS: 150000
    precision: "round_half_up per line to whole cents, then integer summation."
    variants:
      - name: PROPOSED_SCOPE
        when: "Reported as Booking.rider_proposed_cents and as proposed_scope_cents; it is the figure production negotiates against."
        difference: "Includes still-PROPOSED lines, charges promoter-provided lines at full cost, and applies no hospitality cap."
      - name: CONTRACTED_SCOPE
        when: "Reported as Booking.rider_estimate_cents and is the only rider figure that enters settlement_total."
        difference: "Drops PROPOSED and REJECTED lines, zeroes promoter-provided lines, and caps every HOSPITALITY line at HOSPITALITY_LINE_CAP_CENTS."

  - name: artist_radius_risk_score
    trigger: "Recomputed on POST /festival-ops/competing-performances (creation), on adjudicate, and on waiver-decision GRANTED; read on demand via GET /festival-ops/artists/{id}/radius-risk."
    algorithm: weighted_scoring
    formula: |
      reported = count(p in CompetingPerformance
                       where p.artist_id == A.id
                         and p.status == REPORTED
                         and p.conflict_assessment == CONFLICT)
      breaches = count(p in CompetingPerformance
                       where p.artist_id == A.id
                         and p.status == VIOLATION)
      draw_penalty = round_half_up(DRAW_PENALTY_WEIGHT * (100 - A.draw_score))

      strict_risk_score      = min(100, REPORT_WEIGHT * reported + BREACH_WEIGHT * breaches + draw_penalty)
      adjudicated_risk_score = min(100, BREACH_WEIGHT * breaches + draw_penalty)

      gate: POST /festival-ops/offers/{id}/issue and /revise reject with
            ERR_ARTIST_RISK_BLOCKED when adjudicated_risk_score >= RISK_BLOCK_THRESHOLD
    input_set: "CompetingPerformance rows with status == REPORTED and conflict_assessment == CONFLICT feed `reported`; rows with status == VIOLATION feed `breaches`; rows with status IN {CLEARED, WAIVED} feed neither."
    constants:
      REPORT_WEIGHT: 12
      BREACH_WEIGHT: 25
      DRAW_PENALTY_WEIGHT: 0.20
      RISK_BLOCK_THRESHOLD: 60
    precision: "Integer score, clamped to a 0..100 ceiling; round_half_up on the draw penalty only."
    variants:
      - name: STRICT
        when: "Default variant of GET /festival-ops/artists/{id}/radius-risk and the value stored in Artist.strict_risk_score."
        difference: "Charges 12 points for every still-unadjudicated CONFLICT report in addition to adjudicated breaches."
      - name: ADJUDICATED
        when: "Stored in Artist.adjudicated_risk_score; this variant alone gates offer issuance."
        difference: "Ignores unadjudicated reports entirely, so an artist with three open reports and no adjudicated violation is not blocked."

  - name: radius_conflict_detection
    trigger: "POST /festival-ops/competing-performances — stamps conflict_assessment, conflicting_radius_clause_id and distance_to_market_miles at creation."
    algorithm: interval_merge
    formula: |
      hav(lat1, lon1, lat2, lon2):
          dlat = radians(lat2 - lat1); dlon = radians(lon2 - lon1)
          a = sin(dlat/2)^2 + cos(radians(lat1)) * cos(radians(lat2)) * sin(dlon/2)^2
          return 2 * EARTH_RADIUS_MILES * asin(sqrt(a))

      # eligibility filter - explicit predicate over fields, no fuzzy adjectives
      candidates = [c in RadiusClause where
                      c.artist_id == P.artist_id
                      and c.enforcement_status IN {ACTIVE}
                      and c.window_start_date <= P.performance_date <= c.window_end_date   # CLOSED interval, day granularity, both endpoints restricted
                      and round_half_up(hav(Festival(c).market_latitude, Festival(c).market_longitude,
                                            P.venue_latitude, P.venue_longitude), 2) <= c.radius_miles   # inclusive
                      and (c.exclusivity_scope == FULL
                           or (c.exclusivity_scope == TICKETED_ONLY and P.is_ticketed == true)
                           or (c.exclusivity_scope == FESTIVAL_ONLY and P.is_festival == true))]

      # ranking / tie-break / empty-set fallback
      if candidates is empty:
          P.conflict_assessment = NO_CONFLICT; P.conflicting_radius_clause_id = null; P.distance_to_market_miles = null
      else:
          winner = candidates sorted by radius_miles DESC, then window_start_date ASC, then created_at ASC -> first
          P.conflict_assessment = CONFLICT
          P.conflicting_radius_clause_id = winner.id
          P.distance_to_market_miles = round_half_up(hav(Festival(winner).market, P.venue), 2)
    input_set: "RadiusClause rows with enforcement_status == ACTIVE only; PROVISIONAL, BREACHED, WAIVED and RELEASED clauses never enter the candidate set."
    constants:
      EARTH_RADIUS_MILES: 3958.7613
    precision: "Distance rounded half-up to 2 decimals before the <= comparison; the comparison is inclusive at exactly radius_miles."
    variants: []

  - name: stage_interval_conflict
    trigger: "POST /festival-ops/offers/{id}/issue, POST /festival-ops/offers/{id}/revise, POST /festival-ops/offers/{id}/accept"
    algorithm: interval_merge
    formula: |
      occupants(S) = [o in Offers where o.stage_id == S.id and o.status IN {DRAFT, ISSUED, COUNTERED} and o.id != evaluated.id]
                   + [b in Bookings where b.stage_id == S.id and b.contract_status NOT IN {CANCELLED}]

      buffer = S.changeover_buffer_minutes
      conflict iff exists x in occupants(S) such that
            evaluated.slot_start_utc < x.slot_end_utc   + buffer minutes
        and x.slot_start_utc         < evaluated.slot_end_utc + buffer minutes

      # INTERVAL SEMANTICS: half-open [start, end) inflated symmetrically by the
      # stage's changeover buffer. Exact abutment (evaluated.slot_start_utc ==
      # x.slot_end_utc) IS a conflict when buffer > 0 and is NOT a conflict when
      # buffer == 0.
      reject with ERR_STAGE_SLOT_CONFLICT on conflict
    input_set: "Offers of the same stage with status IN {DRAFT, ISSUED, COUNTERED} plus Bookings of the same stage with contract_status NOT IN {CANCELLED}; the offer under evaluation is excluded from its own occupant set."
    constants: {}
    precision: "Minute arithmetic on UTC instants; comparisons are strict `<` on both sides."
    variants: []

  - name: stage_day_load
    trigger: "POST /festival-ops/offers/{id}/issue, POST /festival-ops/offers/{id}/revise"
    algorithm: aggregation
    formula: |
      D = date(evaluated.slot_start_utc)
      load = sum(o.set_length_minutes + S.changeover_buffer_minutes
                 for o in Offers where o.stage_id == S.id
                                   and o.status IN {DRAFT, ISSUED, COUNTERED}
                                   and o.id != evaluated.id
                                   and date(o.slot_start_utc) == D)
           + sum(b.set_length_minutes + S.changeover_buffer_minutes
                 for b in Bookings where b.stage_id == S.id
                                     and b.contract_status NOT IN {CANCELLED}
                                     and date(b.slot_start_utc) == D)
           + (evaluated.set_length_minutes + S.changeover_buffer_minutes)

      # INTERVAL SEMANTICS: aggregate capacity over one UTC calendar date, not a
      # pairwise geometric test. A load exactly equal to the cap passes.
      reject with ERR_STAGE_DAY_CAP_EXCEEDED when load > S.daily_program_minutes_cap
    input_set: "Same occupant set as stage_interval_conflict, narrowed to date(slot_start_utc) == D, with the evaluated offer counted exactly once."
    constants: {}
    precision: "Integer minutes; the comparison is strict `>` so equality with the cap is allowed."
    variants: []

  - name: payment_schedule_build
    trigger: "POST /festival-ops/offers/{id}/accept (initial pair) and PATCH /festival-ops/bookings/{id}/guarantee-amendment (replacement pair)"
    algorithm: threshold
    formula: |
      days_until_show = date(Festival.event_start_date) - date(clock_now)      # whole days, may be negative

      deposit_pct = 0.50 if days_until_show >= DEPOSIT_TIER_FAR_DAYS           # exactly 120 -> 0.50
                    0.40 if DEPOSIT_TIER_NEAR_DAYS <= days_until_show < DEPOSIT_TIER_FAR_DAYS
                    0.25 if days_until_show < DEPOSIT_TIER_NEAR_DAYS

      deposit_cents = round_half_up(Booking.guarantee_cents * deposit_pct)
      balance_cents = Booking.guarantee_cents - deposit_cents        # exact complement, never re-rounded

      deposit_due_date = max(date(clock_now),
                            min(date(clock_now) + DEPOSIT_LEAD_DAYS,
                                date(Festival.event_start_date) - DEPOSIT_CUTOFF_DAYS))
      balance_due_date = date(Booking.slot_start_utc)

      rows: (installment_type DEPOSIT, sequence_index 1, amount_cents deposit_cents, due_date deposit_due_date)
            (installment_type BALANCE, sequence_index 2, amount_cents balance_cents, due_date balance_due_date)

      # INVARIANT installment_total_conservation:
      #   sum(amount_cents for i in installments(booking) where i.status NOT IN {VOIDED})
      #     == Booking.guarantee_cents
      # holds after accept, after any guarantee-amendment, and after any hold/release.
    input_set: "Exactly the booking under construction; no other booking's installments participate."
    constants:
      DEPOSIT_TIER_FAR_DAYS: 120
      DEPOSIT_TIER_NEAR_DAYS: 60
      DEPOSIT_LEAD_DAYS: 30
      DEPOSIT_CUTOFF_DAYS: 14
      RELEASE_WINDOW_DAYS: 7
    precision: "round_half_up once on the deposit; the balance is the exact integer complement so the pair always sums to the guarantee."
    variants: []

  - name: settlement_total
    trigger: "Recomputed on rider decision, countersign, deposit payment, balance payment and waiver-decision GRANTED; stored on Booking.settlement_total_cents."
    algorithm: constraint_propagation
    formula: |
      # This looks circular: the promoter share depends on a gross that contains
      # the rider figure, and the rider figure that lands in the total has already
      # been scaled by the share. The evaluation order below is PINNED, so the
      # value is well defined. Step 3 deliberately uses the UNADJUSTED rider.
      1. rider  = Booking.rider_estimate_cents                       # CONTRACTED_SCOPE variant
      2. waiver = RadiusClause(booking).waiver_fee_cents  (0 when the booking has no clause row)
      3. gross_pre_share = Booking.guarantee_cents + rider + waiver  # UNADJUSTED rider on purpose
      4. promoter_share_pct = 0.60 if gross_pre_share >= SHARE_BRACKET_HI_CENTS
                              0.75 if SHARE_BRACKET_LO_CENTS <= gross_pre_share < SHARE_BRACKET_HI_CENTS
                              0.90 if gross_pre_share < SHARE_BRACKET_LO_CENTS
      5. reimbursed_rider = round_half_up(rider * promoter_share_pct)
      6. settlement_total_cents = Booking.guarantee_cents + reimbursed_rider + waiver
                                - Booking.deposit_paid_cents
    input_set: "The booking's own CONTRACTED_SCOPE rider figure, its clause's granted waiver fee, and the deposit actually paid; nothing from sibling bookings."
    constants:
      SHARE_BRACKET_HI_CENTS: 5000000
      SHARE_BRACKET_LO_CENTS: 2000000
    precision: "Integer cents; a single round_half_up at step 5. Selecting the bracket at step 4 from the share-adjusted rider (the circular reading) changes the result whenever the gross sits near a bracket edge."
    variants: []

  - name: deposit_recovery
    trigger: "CONTRACTUAL is stamped by POST /festival-ops/bookings/{id}/cancel; ACTUAL_CHRONOLOGICAL is recomputed by POST /festival-ops/payment-installments/{id}/clawback."
    algorithm: forward_looking
    formula: |
      # --- variant CONTRACTUAL (forward-looking, one shot at cancellation) -----
      days_until_show = date(Festival.event_start_date) - date(Booking.cancelled_at)   # whole days
      party_pct = 1.00 if Booking.cancelling_party == ARTIST
                  0.50 if Booking.cancelling_party == FORCE_MAJEURE
                  0.00 if Booking.cancelling_party == PROMOTER
      liq_pct   = 0.10 if Booking.cancelling_party == ARTIST and days_until_show < LATE_CANCEL_DAYS
                  0.05 if Booking.cancelling_party == ARTIST and days_until_show >= LATE_CANCEL_DAYS
                  0.00 otherwise
      Booking.contractual_recovery_cents = round_half_up(Booking.deposit_paid_cents * party_pct)
                                         + round_half_up(Booking.guarantee_cents * liq_pct)

      # --- variant ACTUAL_CHRONOLOGICAL (replay of what was really clawed back) -
      running = 0
      for i in installments(booking) sorted by due_date ASC, then created_at ASC:
          if i.status == RECOVERED: running += i.recovered_cents
      Booking.actual_recovered_cents = min(running, Booking.contractual_recovery_cents)
    input_set: "CONTRACTUAL reads only the booking's own deposit_paid_cents, guarantee_cents, cancelling_party and cancellation date. ACTUAL_CHRONOLOGICAL replays only installments with status == RECOVERED, in due_date ASC / created_at ASC order."
    constants:
      LATE_CANCEL_DAYS: 30
    precision: "Two independent round_half_up steps in CONTRACTUAL (deposit share and liquidated damages are rounded separately, never summed first); integer accumulation in ACTUAL_CHRONOLOGICAL."
    variants:
      - name: CONTRACTUAL
        when: "Stamped on Booking.contractual_recovery_cents at cancellation and used as the ceiling on every clawback."
        difference: "Adds liquidated damages computed off the full guarantee, an amount no installment ever carried, so it can exceed everything the promoter actually paid out."
      - name: ACTUAL_CHRONOLOGICAL
        when: "Recomputed on Booking.actual_recovered_cents after each clawback."
        difference: "Only counts cash actually returned by RECOVERED installments and is clamped at the CONTRACTUAL figure, so the two values differ whenever liquidated damages are owed but unpaid."

  - name: festival_lineup_posture
    trigger: "Recomputed whenever Festival.committed_budget_cents changes (offer accept, booking cancel, guarantee amendment), whenever a BudgetTier.status flips, and on POST /festival-ops/festivals/{id}/advance-phase."
    algorithm: threshold
    formula: |
      committed_ratio = Festival.committed_budget_cents / Festival.allocatable_budget_cents   # exact rational

      lineup_posture =
        FROZEN     if Festival.announcement_phase == GA_ONSALE
                   or committed_ratio >= 1.00
                   or (the festival has >= 1 BudgetTier and every BudgetTier.status == CLOSED)
        RESTRICTED if POSTURE_RESTRICTED_RATIO <= committed_ratio < 1.00
        OPEN       otherwise

      gate: FROZEN rejects POST /festival-ops/offers/{id}/issue, /revise and /accept with ERR_LINEUP_FROZEN.
            RESTRICTED permits all three -- it is an advisory posture that only narrows the ceiling
            through festival_headroom.
    input_set: "The festival's own tiers (all of them, including CLOSED ones) and its announcement_phase."
    constants:
      POSTURE_RESTRICTED_RATIO: 0.85
    precision: "Exact rational comparison; a ratio of exactly 0.85 is RESTRICTED and a ratio of exactly 1.00 is FROZEN."
    variants: []

  - name: budget_commitment_conservation
    trigger: "Asserted after every offer accept, booking cancel and guarantee amendment."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 1 (currency)
      Festival.committed_budget_cents
        == sum(t.committed_cents for t in BudgetTier where t.festival_id == F.id)
        == sum(b.guarantee_cents + b.production_fee_cents
               for b in Bookings where b.festival_id == F.id and b.contract_status NOT IN {CANCELLED})

      # Compensating pair: accept debits (guarantee + production_fee) into the
      # tier; cancel credits exactly the same amount back. Running accept then
      # cancel on the same offer MUST return all three expressions to their
      # pre-accept values with zero drift, including when the tier flipped
      # CLOSED and back to OPEN in between.
    input_set: "Bookings with contract_status NOT IN {CANCELLED}; CANCELLED bookings contribute 0 to all three expressions."
    constants: {}
    precision: "Exact integer equality — no tolerance."
    variants: []

  - name: stage_minutes_conservation
    trigger: "Asserted after every offer accept and booking cancel."
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY 2 (stage time, minutes)
      Stage.booked_minutes
        == sum(b.set_length_minutes for b in Bookings
               where b.stage_id == S.id and b.contract_status NOT IN {CANCELLED})

      # Compensating pair: accept adds set_length_minutes to the stage; cancel
      # subtracts exactly the same minutes. A replacement booking created after
      # the cancellation re-adds its own set_length_minutes, so a cancel +
      # replace of equal length leaves Stage.booked_minutes unchanged while
      # Stage.version has advanced twice.
    input_set: "Bookings with contract_status NOT IN {CANCELLED} on that stage."
    constants: {}
    precision: "Exact integer equality — no tolerance."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (strictly ordered; lower priority number wins)
#
# Band map:
#   1-9    auth
#   10-19  existence + row-level ownership
#   20-29  uniqueness (business_constraint)
#   30-39  state
#   40-44  business_safety
#   45-48  business_referential
#   49-59  business_temporal
#   60-69  business_constraint
#   70-79  business_fiscal
#
# Every priority number is unique. When two rules are violated by the same
# request the lower number is the response, and the higher-numbered check is
# never evaluated (so its side effects and error never appear).
# =============================================================================
validations:

  # ---- auth (1-9) ----------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Id and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Checked before anything else, including request-shape parsing, so a malformed body with no headers still returns ERR_UNAUTHENTICATED."

  - priority: 2
    category: auth
    check: "X-User-Role is one of TalentBuyer, ArtistRep, BusinessAffairs, ProductionManager, FinanceController"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "An unrecognised role string is an authentication failure, not an authorization failure."

  - priority: 3
    category: auth
    check: "X-User-Role appears in the endpoint's authorized_roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
    description: "Evaluated against the static endpoint matrix in §1.7, before any path resource is loaded, so a forbidden role on a non-existent id gets 403 not 404."

  - priority: 5
    category: auth
    check: "Request body and query parameters parse: required fields present, JSON types correct, enum values members of the declared set, integers non-negative where declared, dates ISO-8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all"
    description: "Pure shape validation with no database reads."

  - priority: 6
    category: auth
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: ["GET /festival-ops/offers", "GET /festival-ops/bookings", "GET /festival-ops/radius-clauses", "GET /festival-ops/competing-performances", "GET /festival-ops/announcement-waves", "GET /festival-ops/festivals/{id}/stages", "GET /festival-ops/festivals/{id}/budget-tiers", "GET /festival-ops/bookings/{id}/rider-items", "GET /festival-ops/bookings/{id}/advance-packets", "GET /festival-ops/bookings/{id}/payment-installments"]
    description: "limit == 0 and limit == 101 both fail; limit == 1 and limit == 100 both pass."

  # ---- existence (10-19) ---------------------------------------------------
  - priority: 10
    category: existence
    check: "Every path parameter resolves to a stored row, resolved left-to-right"
    error_id: "ERR_FESTIVAL_NOT_FOUND | ERR_BUDGET_TIER_NOT_FOUND | ERR_STAGE_NOT_FOUND | ERR_ARTIST_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_RADIUS_CLAUSE_NOT_FOUND | ERR_COMPETING_PERFORMANCE_NOT_FOUND | ERR_RIDER_ITEM_NOT_FOUND | ERR_ADVANCE_PACKET_NOT_FOUND | ERR_PAYMENT_INSTALLMENT_NOT_FOUND | ERR_ANNOUNCEMENT_WAVE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "The error is keyed to the entity of the segment that failed; a syntactically valid but unknown UUID is a 404, never a 422."

  - priority: 11
    category: existence
    check: "Every id-bearing body field resolves to a stored row"
    error_id: "ERR_FESTIVAL_NOT_FOUND | ERR_BUDGET_TIER_NOT_FOUND | ERR_STAGE_NOT_FOUND | ERR_ARTIST_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_COMPETING_PERFORMANCE_NOT_FOUND | ERR_ANNOUNCEMENT_WAVE_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /festival-ops/budget-tiers", "POST /festival-ops/stages", "POST /festival-ops/offers", "POST /festival-ops/competing-performances", "POST /festival-ops/announcement-waves", "POST /festival-ops/announcement-waves/{id}/assignments", "POST /festival-ops/radius-clauses/{id}/waiver-request", "POST /festival-ops/advance-packets", "POST /festival-ops/bookings/{id}/rider-items"]
    description: "Body FKs are resolved in the field order declared in the endpoint's input list."

  - priority: 12
    category: existence
    check: "Body FKs that must belong to the same Festival do: BudgetTier.festival_id == Stage.festival_id == the offer's festival_id; AnnouncementWave.festival_id == Booking.festival_id"
    error_id: ERR_FESTIVAL_MISMATCH
    http_status: 409
    applies_to: ["POST /festival-ops/offers", "POST /festival-ops/announcement-waves/{id}/assignments"]
    description: "Referential coherence across sibling aggregates; each row exists but they belong to different festivals."

  - priority: 13
    category: auth
    check: "When X-User-Role == ArtistRep, X-User-Id equals the artist_id of the Offer, Booking, RadiusClause, RiderItem, AdvancePacket, PaymentInstallment or CompetingPerformance addressed by the request"
    error_id: ERR_ARTIST_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints reachable by ArtistRep that address an artist-owned row"
    description: "Row-level ownership, so it can only be evaluated after existence. An ArtistRep hitting another artist's booking gets 403 even when the operation itself is permitted for the role."

  # ---- OCC (15) ------------------------------------------------------------
  - priority: 15
    category: state
    check: "expected_<parent>_version in the body equals the current version of the parent row named by the matching §1.2.1 rule"
    error_id: "ERR_STALE_FESTIVAL_VERSION | ERR_STALE_BOOKING_VERSION | ERR_STALE_WAVE_VERSION"
    http_status: 412
    applies_to: ["POST /festival-ops/festivals/{id}/allocate-tiers", "PATCH /festival-ops/bookings/{id}/guarantee-amendment", "POST /festival-ops/announcement-waves/{id}/assignments"]
    description: "Evaluated after existence and ownership but before every state, safety and fiscal check, so a stale version on an otherwise-invalid request still returns 412."

  # ---- uniqueness (20-29) --------------------------------------------------
  - priority: 20
    category: business_constraint
    check: "(festival_id, tier_code) and (festival_id, tier_rank) are each unique across BudgetTier"
    error_id: ERR_DUPLICATE_TIER_CODE
    http_status: 409
    applies_to: ["POST /festival-ops/budget-tiers"]
    description: "tier_code collision and tier_rank collision both surface the same error id."

  - priority: 21
    category: business_constraint
    check: "(festival_id, name) is unique across Stage"
    error_id: ERR_DUPLICATE_STAGE_NAME
    http_status: 409
    applies_to: ["POST /festival-ops/stages"]
    description: "Stage names are the human key production uses on the day sheet."

  - priority: 22
    category: business_constraint
    check: "performing_name is globally unique across Artist"
    error_id: ERR_DUPLICATE_ARTIST_NAME
    http_status: 409
    applies_to: ["POST /festival-ops/artists"]
    description: "Prevents two roster rows for the same act, which would silently defeat radius enforcement."

  - priority: 23
    category: business_constraint
    check: "(festival_id, wave_number) is unique across AnnouncementWave"
    error_id: ERR_DUPLICATE_WAVE_NUMBER
    http_status: 409
    applies_to: ["POST /festival-ops/announcement-waves"]
    description: "Wave numbers drive announcement ordering and must not collide."

  # ---- state (30-39) -------------------------------------------------------
  - priority: 30
    category: state
    check: "The addressed row is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_OFFER_NOT_NEGOTIABLE | ERR_INVALID_BOOKING_STATE | ERR_INVALID_CLAUSE_STATE | ERR_PERFORMANCE_ALREADY_ADJUDICATED | ERR_RIDER_ITEM_ALREADY_DECIDED | ERR_INVALID_ADVANCE_STATE | ERR_INVALID_INSTALLMENT_STATE | ERR_INVALID_WAVE_STATE"
    http_status: 409
    applies_to: "all action endpoints"
    description: "Includes terminal-state lockdown and the second-call idempotency failure. RULE 5 CONFLICT PAIR A: an offer in ACCEPTED whose revise body also breaches the guarantee ceiling returns ERR_OFFER_NOT_NEGOTIABLE (priority 30), never ERR_GUARANTEE_CEILING_EXCEEDED (priority 73)."

  - priority: 32
    category: state
    check: "Festival.lineup_posture != FROZEN"
    error_id: ERR_LINEUP_FROZEN
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
    description: "A cross-entity gate: the offer itself is perfectly valid, the parent festival is closed for business."

  - priority: 34
    category: state
    check: "Festival.tiers_allocated == true"
    error_id: ERR_TIERS_NOT_ALLOCATED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue"]
    description: "Issuing before the waterfall has run would compare a guarantee against a zero allocation."

  - priority: 36
    category: state
    check: "AnnouncementWave.phase equals Festival.announcement_phase"
    error_id: ERR_WAVE_PHASE_MISMATCH
    http_status: 409
    applies_to: ["POST /festival-ops/announcement-waves/{id}/lock", "POST /festival-ops/announcement-waves/{id}/publish"]
    description: "A wave planned for TIER2_ONSALE cannot lock while the festival is still in PRESALE."

  # ---- business_safety (40-44) --------------------------------------------
  - priority: 40
    category: business_safety
    check: "No RadiusClause of the addressed booking has enforcement_status == BREACHED"
    error_id: ERR_RADIUS_BREACH_ACTIVE
    http_status: 409
    applies_to: ["POST /festival-ops/bookings/{id}/countersign", "POST /festival-ops/payment-installments/{id}/release", "POST /festival-ops/payment-installments/{id}/mark-paid"]
    description: "RULE 5 CONFLICT PAIR B: a booking in RIDER_SETTLED with a BREACHED clause AND no APPROVED AdvancePacket returns ERR_RADIUS_BREACH_ACTIVE (business_safety, priority 40), never ERR_ADVANCE_NOT_APPROVED (business_referential, priority 45)."

  - priority: 41
    category: business_safety
    check: "Artist.adjudicated_risk_score < 60"
    error_id: ERR_ARTIST_RISK_BLOCKED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
    description: "Uses the ADJUDICATED variant only; an artist with open unadjudicated reports and a high STRICT score is still issuable."

  - priority: 42
    category: business_safety
    check: "X-User-Id differs from AdvancePacket.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /festival-ops/advance-packets/{id}/approve", "POST /festival-ops/advance-packets/{id}/return"]
    description: "Segregation of duties on the advance: whoever submitted the packet cannot adjudicate it, even holding ProductionManager."

  # ---- business_referential (45-49) ---------------------------------------
  - priority: 45
    category: business_referential
    check: "The booking has at least one AdvancePacket with status == APPROVED"
    error_id: ERR_ADVANCE_NOT_APPROVED
    http_status: 409
    applies_to: ["POST /festival-ops/bookings/{id}/countersign"]
    description: "Cross-entity dependency: Booking cannot reach COUNTERSIGNED until its AdvancePacket reaches APPROVED."

  - priority: 46
    category: business_referential
    check: "Every Booking assigned to the wave has contract_status == COUNTERSIGNED"
    error_id: ERR_WAVE_BOOKING_NOT_COUNTERSIGNED
    http_status: 409
    applies_to: ["POST /festival-ops/announcement-waves/{id}/lock"]
    description: "Cross-entity dependency in the other direction: the parent wave cannot lock while any member booking is still PENDING_RIDER or RIDER_SETTLED."

  - priority: 47
    category: business_referential
    check: "For a waiver-decision, the referenced CompetingPerformance is the same row recorded as RadiusClause.waiver_competing_performance_id and its status is VIOLATION"
    error_id: ERR_ADJUDICATION_MISMATCH
    http_status: 409
    applies_to: ["POST /festival-ops/radius-clauses/{id}/waiver-decision"]
    description: "Prevents waiving clause X on the strength of an unrelated performance report."

  - priority: 48
    category: business_referential
    check: "When replaces_booking_id is present, that booking belongs to the same festival and has contract_status == CANCELLED"
    error_id: ERR_REPLACEMENT_TARGET_NOT_CANCELLED
    http_status: 409
    applies_to: ["POST /festival-ops/offers"]
    description: "Self-referential integrity: a replacement offer may only point at an already-cancelled booking."

  # ---- business_temporal (49-59) ------------------------------------------
  - priority: 49
    category: business_temporal
    check: "clock_now < Offer.offer_expires_utc"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/counter", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
    description: "Expiry is clock-derived, not stored state: the offer still reads ISSUED until the sweep runs, so this check fires before the sweep has ever been called. clock_now exactly equal to offer_expires_utc is expired (strict <)."

  - priority: 50
    category: business_temporal
    check: "calculations.stage_interval_conflict finds no buffered overlap on the target stage"
    error_id: ERR_STAGE_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
    description: "RULE 5 CONFLICT PAIR C: an issue request that both overlaps a live slot AND reuses a taken billing position returns ERR_STAGE_SLOT_CONFLICT (business_temporal, priority 50), never ERR_BILLING_POSITION_TAKEN (business_constraint, priority 60)."

  - priority: 51
    category: business_temporal
    check: "minutes_from_midnight(slot_end_utc) <= Stage.daily_curfew_minute, where a slot ending after midnight is measured as 1440 + minutes past midnight"
    error_id: ERR_CURFEW_EXCEEDED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
    description: "Per-stage municipal curfew; equality with the curfew minute passes."

  - priority: 52
    category: business_temporal
    check: "calculations.stage_day_load <= Stage.daily_program_minutes_cap"
    error_id: ERR_STAGE_DAY_CAP_EXCEEDED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
    description: "Aggregate check: each individual slot fits and no pair overlaps, yet the day's total programmed minutes exceed the cap."

  - priority: 53
    category: business_temporal
    check: "The artist has no other live Offer or non-CANCELLED Booking at this festival whose slot starts on the same UTC date"
    error_id: ERR_ARTIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/accept"]
    description: "Cross-stage protection: the two slots do not overlap in time but the act cannot play two stages on one day."

  - priority: 54
    category: business_temporal
    check: "date(slot_start_utc) and date(slot_end_utc) both fall within [Festival.event_start_date, Festival.event_end_date] inclusive"
    error_id: ERR_SLOT_OUTSIDE_EVENT_WINDOW
    http_status: 422
    applies_to: ["POST /festival-ops/offers", "POST /festival-ops/offers/{id}/revise"]
    description: "Closed date interval on both ends; a slot starting exactly on event_end_date is inside."

  - priority: 55
    category: business_temporal
    check: "window_start_date <= window_end_date and both lie within 365 days of Festival.event_start_date"
    error_id: ERR_RADIUS_WINDOW_INVALID
    http_status: 422
    applies_to: ["POST /festival-ops/offers"]
    description: "Governs the RadiusClause created alongside the offer."

  - priority: 56
    category: business_temporal
    check: "AnnouncementWave.scheduled_reveal_utc is strictly before Festival.event_start_date at 00:00Z"
    error_id: ERR_REVEAL_AFTER_EVENT_START
    http_status: 422
    applies_to: ["POST /festival-ops/announcement-waves", "POST /festival-ops/announcement-waves/{id}/lock"]
    description: "An announcement that lands after the gates open is not an announcement."

  - priority: 57
    category: business_temporal
    check: "clock_now >= AnnouncementWave.scheduled_reveal_utc"
    error_id: ERR_REVEAL_NOT_DUE
    http_status: 409
    applies_to: ["POST /festival-ops/announcement-waves/{id}/publish"]
    description: "Equality passes: publishing exactly at the reveal instant is allowed."

  - priority: 58
    category: business_temporal
    check: "clock_now >= PaymentInstallment.due_date minus RELEASE_WINDOW_DAYS (7) at 00:00Z"
    error_id: ERR_PAYMENT_NOT_RELEASABLE
    http_status: 409
    applies_to: ["POST /festival-ops/payment-installments/{id}/release"]
    description: "Money cannot leave more than a week ahead of the due date; the boundary instant itself is releasable."

  - priority: 59
    category: business_temporal
    check: "The target announcement_phase is exactly one step ahead of the current phase, at least one AnnouncementWave of this festival has phase == the current phase, and every such wave has status == PUBLISHED"
    error_id: ERR_PHASE_PREREQ_UNMET
    http_status: 409
    applies_to: ["POST /festival-ops/festivals/{id}/advance-phase"]
    description: "Phase progression is gated on the announcement waves belonging to the phase being left."

  # ---- business_constraint (60-69) ----------------------------------------
  - priority: 60
    category: business_constraint
    check: "No other live Offer or non-CANCELLED Booking on the same stage and the same UTC date holds this billing_position"
    error_id: ERR_BILLING_POSITION_TAKEN
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "POST /festival-ops/offers/{id}/accept"]
    description: "billing_position is an integer slot ordinal (1 = headliner, 2 = sub-headliner, ... 5 = opener) and is unique per stage-day."

  - priority: 61
    category: business_constraint
    check: "The offer's BudgetTier has status == OPEN and slots_committed < max_slots"
    error_id: ERR_TIER_CLOSED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/accept"]
    description: "Slot exhaustion and an explicitly CLOSED tier surface the same error."

  - priority: 62
    category: business_constraint
    check: "An offer with billing_position == 1 targets a Stage with is_flagship == true"
    error_id: ERR_HEADLINER_STAGE_REQUIRED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
    description: "Conditional rule: applies only when billing_position == 1 (the headliner ordinal) and is silent for every other ordinal."

  - priority: 63
    category: business_constraint
    check: "AnnouncementWave.assignment_count >= 1"
    error_id: ERR_EMPTY_WAVE
    http_status: 409
    applies_to: ["POST /festival-ops/announcement-waves/{id}/lock"]
    description: "EMPTY-COLLECTION BOUNDARY: a wave with zero assignments is rejected rather than locking vacuously; assignment_count == 1 locks."

  - priority: 64
    category: business_constraint
    check: "Booking.announcement_wave_id is null"
    error_id: ERR_BOOKING_ALREADY_ASSIGNED
    http_status: 409
    applies_to: ["POST /festival-ops/announcement-waves/{id}/assignments"]
    description: "A booking belongs to at most one wave; re-assigning requires the first wave to fall back to PLANNED."

  - priority: 65
    category: business_constraint
    check: "AdvancePacket.submission_count < MAX_ADVANCE_SUBMISSIONS (3)"
    error_id: ERR_ADVANCE_SUBMISSIONS_EXHAUSTED
    http_status: 409
    applies_to: ["POST /festival-ops/advance-packets/{id}/submit"]
    description: "Cycle terminator for the DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED loop."

  - priority: 66
    category: business_constraint
    check: "Offer.round_number < MAX_NEGOTIATION_ROUNDS (3)"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/revise"]
    description: "Cycle terminator for the ISSUED -> COUNTERED -> ISSUED loop; the fourth promoter issuance is refused."

  - priority: 67
    category: business_constraint
    check: "sum(input_channel_count over every AdvancePacket with status IN {SUBMITTED, APPROVED} whose booking shares this stage and this UTC slot date) + this packet's input_channel_count <= STAGE_CHANNEL_HARD_MAX (112)"
    error_id: ERR_STAGE_CHANNEL_CAP_EXCEEDED
    http_status: 409
    applies_to: ["POST /festival-ops/advance-packets/{id}/submit"]
    description: "Aggregate production constraint across bookings sharing a stage-day; each packet fits the console on its own but the day's total does not. AdvancePacket.channel_overage independently stores max(0, running_total - STAGE_CHANNEL_ADVISORY (96)) for reporting, so a packet that clears the hard cap can still carry a positive advisory overage."

  # ---- business_fiscal (70-79) --------------------------------------------
  - priority: 70
    category: business_fiscal
    check: "abs(sum(BudgetTier.allocation_pct) - 1.00) <= 1e-9 and the festival has at least one tier"
    error_id: ERR_ALLOCATION_PCT_INVALID
    http_status: 422
    applies_to: ["POST /festival-ops/festivals/{id}/allocate-tiers"]
    description: "The waterfall refuses to run on percentages that do not close."

  - priority: 71
    category: business_fiscal
    check: "Festival.committed_budget_cents == 0"
    error_id: ERR_ALLOCATION_LOCKED
    http_status: 409
    applies_to: ["POST /festival-ops/festivals/{id}/allocate-tiers"]
    description: "Re-running the waterfall after money is committed would strand existing commitments."

  - priority: 72
    category: business_fiscal
    check: "calculations.genre_balance_share with the evaluated offer included <= GENRE_CAP_PCT (0.40)"
    error_id: ERR_GENRE_CAP_EXCEEDED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise"]
    description: "THRESHOLD BOUNDARY: a projected share of exactly 0.40 passes and 0.40 + one cent of numerator fails."

  - priority: 73
    category: business_fiscal
    check: "Offer.guarantee_cents + Offer.production_fee_cents <= calculations.offer_guarantee_ceiling"
    error_id: ERR_GUARANTEE_CEILING_EXCEEDED
    http_status: 422
    applies_to: ["POST /festival-ops/offers/{id}/issue", "POST /festival-ops/offers/{id}/revise", "PATCH /festival-ops/bookings/{id}/guarantee-amendment"]
    description: "Equality with the ceiling passes. Lowest-priority fiscal gate, so it is masked by every state, safety and temporal failure above."

  - priority: 74
    category: business_fiscal
    check: "BudgetTier.committed_cents + guarantee_cents + production_fee_cents <= BudgetTier.allocation_cents"
    error_id: ERR_TIER_ALLOCATION_EXCEEDED
    http_status: 409
    applies_to: ["POST /festival-ops/offers/{id}/accept", "PATCH /festival-ops/bookings/{id}/guarantee-amendment"]
    description: "Re-checked at accept because the ceiling stamped at issue may have been overtaken by a sibling acceptance."

  - priority: 75
    category: business_fiscal
    check: "The waiver_fee_cents supplied on a GRANTED decision is >= RadiusClause.waiver_fee_offer_cents"
    error_id: ERR_WAIVER_FEE_BELOW_OFFER
    http_status: 422
    applies_to: ["POST /festival-ops/radius-clauses/{id}/waiver-decision"]
    description: "A granted waiver may not be priced below the artist's own request."

  - priority: 76
    category: business_fiscal
    check: "Booking.actual_recovered_cents + recovered_cents <= Booking.contractual_recovery_cents"
    error_id: ERR_RECOVERY_EXCEEDS_CONTRACTUAL
    http_status: 422
    applies_to: ["POST /festival-ops/payment-installments/{id}/clawback"]
    description: "Compensating-invariant guard: recovery can never exceed the contractual figure stamped at cancellation."

# =============================================================================
# §1.5 API Endpoint Table
#
# Every collection sits directly under the /festival-ops namespace prefix so
# that each entity has a canonical `GET /festival-ops/<collection>/{id}` read.
# Sub-resource reads always name the parent path parameter `{id}`.
# Ordering contract for every `[]` response: as documented per endpoint;
# `created_at ASC` is the universal final tie-break and `id` is never sorted on.
# =============================================================================
endpoints:

  # ---- Festival ------------------------------------------------------------
  - method: POST
    path: /festival-ops/festivals
    description: "Register a festival edition with its market coordinates, event window and talent budget."
    roles: [TalentBuyer]
    input: [name, edition_year, market_latitude, market_longitude, event_start_date, event_end_date, talent_budget_cents, "contingency_reserve_pct?"]
    output: Festival
    success_code: 201
    side_effects:
      - "allocatable_budget_cents = talent_budget_cents - round_half_up(talent_budget_cents * contingency_reserve_pct)"
      - "committed_budget_cents = 0, tiers_allocated = false, announcement_phase = PRESALE, lineup_posture = OPEN, headliner_anchor_count = 0"
      - "version = 1"

  - method: GET
    path: /festival-ops/festivals/{id}
    description: "Read one festival edition including its derived budget and posture fields."
    roles: [TalentBuyer, BusinessAffairs, ProductionManager, FinanceController]
    input: []
    output: Festival
    success_code: 200
    side_effects: []

  - method: POST
    path: /festival-ops/festivals/{id}/allocate-tiers
    description: "Run the budget waterfall across every BudgetTier of the festival."
    roles: [TalentBuyer]
    input: [expected_festival_version]
    output: "BudgetTier[]"
    success_code: 200
    side_effects:
      - "calculations.tier_allocation_waterfall stamps allocation_cents on every tier, remainder to the lowest tier_rank"
      - "Festival.tiers_allocated = true; Festival.version += 1"
      - "response ordered by tier_rank ASC, then created_at ASC"

  - method: POST
    path: /festival-ops/festivals/{id}/advance-phase
    description: "Move the festival one step along PRESALE -> TIER1_ONSALE -> TIER2_ONSALE -> GA_ONSALE."
    roles: [TalentBuyer]
    input: [target_phase]
    output: Festival
    success_code: 200
    side_effects:
      - "validations priority 59 requires every AnnouncementWave of the phase being left to be PUBLISHED"
      - "calculations.festival_lineup_posture re-derived; GA_ONSALE forces lineup_posture = FROZEN"
      - "Festival.version += 1"

  - method: GET
    path: /festival-ops/festivals/{id}/budget-summary
    description: "Computed read reconciling the festival ledger against its tiers and bookings."
    roles: [TalentBuyer, BusinessAffairs, FinanceController]
    input: []
    output: "{ allocatable_budget_cents: integer, committed_budget_cents: integer, tier_committed_sum_cents: integer, booking_committed_sum_cents: integer, committed_ratio: number, lineup_posture: string, open_tier_count: integer, closed_tier_count: integer, headliner_anchor_count: integer }"
    success_code: 200
    side_effects:
      - "asserts calculations.budget_commitment_conservation: committed_budget_cents == tier_committed_sum_cents == booking_committed_sum_cents"

  - method: GET
    path: /festival-ops/festivals/{id}/budget-tiers
    description: "List the festival's budget tiers, ordered by tier_rank ASC then created_at ASC."
    roles: [TalentBuyer, BusinessAffairs, FinanceController]
    input: ["status?", "limit?", "offset?"]
    output: "BudgetTier[]"
    success_code: 200
    side_effects: []

  - method: GET
    path: /festival-ops/festivals/{id}/stages
    description: "List the festival's stages, ordered by is_flagship DESC then name ASC then created_at ASC."
    roles: [TalentBuyer, BusinessAffairs, ProductionManager, FinanceController]
    input: ["is_flagship?", "limit?", "offset?"]
    output: "Stage[]"
    success_code: 200
    side_effects: []

  # ---- BudgetTier ----------------------------------------------------------
  - method: POST
    path: /festival-ops/budget-tiers
    description: "Add a budget tier to a festival before the waterfall is run."
    roles: [TalentBuyer]
    input: [festival_id, tier_code, tier_rank, allocation_pct, max_slots, "genre_focus?"]
    output: BudgetTier
    success_code: 201
    side_effects:
      - "allocation_cents = 0, committed_cents = 0, slots_committed = 0, status = OPEN"
      - "(festival_id, tier_code) and (festival_id, tier_rank) uniqueness enforced at priority 20"

  - method: GET
    path: /festival-ops/budget-tiers/{id}
    description: "Read one budget tier including its allocation and commitment counters."
    roles: [TalentBuyer, BusinessAffairs, FinanceController]
    input: []
    output: BudgetTier
    success_code: 200
    side_effects: []

  # ---- Stage ---------------------------------------------------------------
  - method: POST
    path: /festival-ops/stages
    description: "Add a stage with its changeover buffer, curfew minute and daily programming cap."
    roles: [ProductionManager]
    input: [festival_id, name, capacity, daily_curfew_minute, daily_program_minutes_cap, "changeover_buffer_minutes?", "is_flagship?"]
    output: Stage
    success_code: 201
    side_effects:
      - "booked_minutes = 0"

  - method: GET
    path: /festival-ops/stages/{id}
    description: "Read one stage including its booked_minutes ledger."
    roles: [TalentBuyer, BusinessAffairs, ProductionManager, FinanceController]
    input: []
    output: Stage
    success_code: 200
    side_effects: []

  # ---- Artist --------------------------------------------------------------
  - method: POST
    path: /festival-ops/artists
    description: "Add an act to the roster with its draw score and default radius."
    roles: [TalentBuyer]
    input: [legal_name, performing_name, primary_genre, agency, draw_score, "default_radius_miles?"]
    output: Artist
    success_code: 201
    side_effects:
      - "reported_conflict_count = 0, radius_breach_count = 0, strict_risk_score = 0, adjudicated_risk_score = 0"

  - method: GET
    path: /festival-ops/artists/{id}
    description: "Read one roster act including both stored risk scores."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, ProductionManager, FinanceController]
    input: []
    output: Artist
    success_code: 200
    side_effects: []

  - method: GET
    path: /festival-ops/artists/{id}/radius-risk
    description: "Computed read of calculations.artist_radius_risk_score; variant defaults to STRICT."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs]
    input: ["variant?"]
    output: "{ variant: string, reported_conflict_count: integer, radius_breach_count: integer, draw_penalty: integer, risk_score: integer, blocked: boolean }"
    success_code: 200
    side_effects:
      - "variant accepts STRICT (default) or ADJUDICATED; any other value is ERR_INVALID_REQUEST"
      - "blocked reflects risk_score >= RISK_BLOCK_THRESHOLD for the requested variant"

  # ---- Offer ---------------------------------------------------------------
  - method: POST
    path: /festival-ops/offers
    description: "Draft an offer for an act on a stage slot, together with the radius clause it will carry."
    roles: [TalentBuyer]
    input: [festival_id, artist_id, budget_tier_id, stage_id, guarantee_cents, billing_position, set_length_minutes, slot_start_utc, offer_expires_utc, radius_miles, window_start_date, window_end_date, "production_fee_cents?", "exclusivity_scope?", "waiver_fee_offer_cents?", "replaces_booking_id?"]
    output: Offer
    success_code: 201
    side_effects:
      - "slot_end_utc = slot_start_utc + set_length_minutes; status = DRAFT; round_number = 0"
      - "creates exactly one RadiusClause with offer_id = this offer, artist_id = this artist, enforcement_status = PROVISIONAL, waiver_status = NONE (read it back with GET /festival-ops/radius-clauses?offer_id=...)"
      - "no budget is committed and no stage time is reserved at DRAFT"

  - method: GET
    path: /festival-ops/offers/{id}
    description: "Read one offer including its stamped ceiling, genre factor and counter fields."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, FinanceController]
    input: []
    output: Offer
    success_code: 200
    side_effects: []

  - method: GET
    path: /festival-ops/offers
    description: "Filtered, paginated offer list ordered by slot_start_utc ASC then created_at ASC."
    roles: [TalentBuyer, ArtistRep, BusinessAffairs, FinanceController]
    input: ["festival_id?", "artist_id?", "budget_tier_id?", "stage_id?", "replaces_booking_id?", "status?", "limit?", "offset?"]
    output: "Offer[]"
    success_code: 200
    side_effects:
      - "ArtistRep callers are implicitly restricted to their own artist_id"

  - method: POST
    path: /festival-ops/offers/{id}/issue
    description: "Send the offer to the agent: the heaviest validation gate in the system."
    roles: [TalentBuyer]
    input: []
    output: Offer
    success_code: 200
    side_effects:
      - "runs validations 32, 34, 41, 50, 51, 52, 53, 60, 61, 62, 72, 73 in that order"
      - "stamps Offer.genre_balance_factor and Offer.guarantee_ceiling_cents from calculations.offer_guarantee_ceiling"
      - "status DRAFT -> ISSUED; issued_by_user_id = X-User-Id; round_number += 1"
      - "RadiusClause.enforcement_status PROVISIONAL -> ACTIVE, so the clause starts participating in calculations.radius_conflict_detection from issuance, before any booking exists"

  - method: POST
    path: /festival-ops/offers/{id}/counter
    description: "Agent-side counter: records the artist's ask without changing the promoter's terms."
    roles: [ArtistRep]
    input: [counter_guarantee_cents, "counter_billing_position?", "counter_set_length_minutes?", "counter_note?"]
    output: Offer
    success_code: 200
    side_effects:
      - "status ISSUED -> COUNTERED; round_number unchanged (only promoter issuances consume rounds)"
      - "guarantee_cents, billing_position, set_length_minutes and the slot are untouched"

  - method: POST
    path: /festival-ops/offers/{id}/revise
    description: "Promoter re-issues against a counter; consumes one negotiation round."
    roles: [TalentBuyer]
    input: [guarantee_cents, "production_fee_cents?", "billing_position?", "set_length_minutes?", "slot_start_utc?", "offer_expires_utc?"]
    output: Offer
    success_code: 200
    side_effects:
      - "validations priority 66 rejects the request when round_number is already MAX_NEGOTIATION_ROUNDS (3)"
      - "round_number += 1; status COUNTERED -> ISSUED; counter_* fields cleared to null"
      - "ceiling, genre factor, slot conflict, day load, curfew and billing position are all re-evaluated against the revised terms"

  - method: POST
    path: /festival-ops/offers/{id}/accept
    description: "Agent accepts: creates the Booking and fires the depth-4 commitment cascade."
    roles: [ArtistRep]
    input: []
    output: Booking
    success_code: 201
    side_effects:
      - "CASCADE-1 hop 1: Offer.status -> ACCEPTED and a Booking is created in contract_status PENDING_RIDER / settlement_status UNFUNDED, copying every commercial term from the offer"
      - "CASCADE-1 hop 2: BudgetTier.committed_cents += guarantee_cents + production_fee_cents, slots_committed += 1; Stage.booked_minutes += set_length_minutes; the offer's RadiusClause gains booking_id"
      - "CASCADE-1 hop 3: BudgetTier.status re-derived (OPEN -> CLOSED when committed_cents == allocation_cents or slots_committed == max_slots); Festival.committed_budget_cents += the same amount and lineup_posture re-derived"
      - "CASCADE-1 hop 4: a tier that just closed supersedes every sibling Offer of that tier in {DRAFT, ISSUED, COUNTERED} to SUPERSEDED and RELEASEs their RadiusClauses"
      - "calculations.payment_schedule_build creates the DEPOSIT and BALANCE installments"
      - "Festival.headliner_anchor_count += 1 when billing_position == 1"

  - method: POST
    path: /festival-ops/offers/{id}/decline
    description: "Agent declines; the offer and its provisional clause go cold."
    roles: [ArtistRep]
    input: ["decline_reason?"]
    output: Offer
    success_code: 200
    side_effects:
      - "status ISSUED or COUNTERED -> DECLINED; RadiusClause.enforcement_status -> RELEASED"
      - "no budget or stage ledger is touched because none was ever committed"

  - method: POST
    path: /festival-ops/offers/sweep-expired
    description: "Clock-driven sweep moving every live offer past its expiry to EXPIRED."
    roles: [TalentBuyer, BusinessAffairs]
    input: ["festival_id?"]
    output: "{ expired_count: integer, expired_offer_ids: string[], released_clause_count: integer }"
    success_code: 200
    side_effects:
      - "every Offer with status IN {ISSUED, COUNTERED} and offer_expires_utc <= clock_now becomes EXPIRED; a DRAFT offer is never swept because no DRAFT -> EXPIRED transition is declared"
      - "each expired offer's RadiusClause becomes RELEASED, so radius_conflict_detection stops seeing it"
      - "expired_offer_ids is ordered by offer_expires_utc ASC then created_at ASC"
      - "a second call with no newly-expired offers returns expired_count 0 and is not an error"

