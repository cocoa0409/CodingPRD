            - "Device.${dev1_id}.status == QC_LOCKED and Device.${dev1_id}.qc_lock_reason == QC_FAILURE"
            - "TestResult.${tr1_id}.posting_status == HELD, TestResult.${tr2_id}.posting_status == HELD, TestResult.${tr3_id}.posting_status == HELD"
            - "TestResult.${tr1_id}.held_by_device_lock_at == 2026-08-01T00:00:00Z"
