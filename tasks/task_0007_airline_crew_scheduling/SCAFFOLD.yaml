scenario: |
  Airline Crew Scheduling: FAA Duty Time, Pairing construction, Bidding/Reserve,
  Deadhead, Sick Call, union rules, Crew Rest minimum interval, Trip Trade

domain_name: airline-crew-scheduling
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: "Airline-issued employee code, unique"
        constraints: "matches /^[A-Z]{2}[0-9]{4}$/"
      - name: full_name
        type: string
        source: input
        description: "Crew member full name"
      - name: rank
        type: enum
        source: input
        description: "Crew rank"
        constraints: "one of {CAPTAIN, FIRST_OFFICER, PURSER, FLIGHT_ATTENDANT}"
      - name: base_airport
        type: string
        source: input
        description: "Home base IATA code, 3 letters"
        constraints: "^[A-Z]{3}$"
      - name: seniority_number
        type: integer
        source: input
        description: "Seniority rank within rank+base (1 = most senior); unique within (rank, base_airport)"
        constraints: ">= 1"
      - name: line_type
        type: enum
        source: input
        description: "Bid line type"
        constraints: "one of {LINEHOLDER, RESERVE}"
      - name: status
        type: enum
        source: computed
        description: "Operational status"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_DUTY, ON_REST, SICK, INACTIVE}"
      - name: total_flight_minutes_7d
        type: integer
        source: computed
        description: "Aggregated actual flight minutes in trailing 7 days; recomputed on Assignment COMPLETED and on clock advances"
        default: 0
      - name: total_duty_minutes_7d
        type: integer
        source: computed
        description: "Aggregated actual duty minutes (deadhead + flight + reporting) in trailing 7 days"
        default: 0
      - name: last_off_duty_utc
        type: datetime
        source: computed
        description: "ISO 8601 UTC of the most recent off-duty transition; null until first Assignment completes"
        default: null

  - name: Pairing
    parent: null
    common_fields: true
    fields:
      - name: pairing_code
        type: string
        source: input
        description: "Pairing identifier, unique across all Pairings"
        constraints: "matches /^P-[0-9]{4}-[0-9]{3}$/"
      - name: origin_base
        type: string
        source: input
        description: "Originating base airport (3-letter IATA)"
        constraints: "^[A-Z]{3}$"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Scheduled duty start (ISO 8601 UTC)"
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Scheduled duty end (ISO 8601 UTC); must be > scheduled_start_utc"
      - name: required_captains
        type: integer
        source: input
        description: "Number of CAPTAIN seats required"
        constraints: ">= 1, <= 2"
      - name: required_first_officers
        type: integer
        source: input
        description: "Number of FIRST_OFFICER seats required"
        constraints: ">= 1, <= 2"
      - name: required_cabin_crew
        type: integer
        source: input
        description: "Number of FLIGHT_ATTENDANT seats required (PURSER counted under cabin crew)"
        constraints: ">= 0, <= 8"
      - name: state
        type: enum
        source: computed
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, BID_OPEN, BID_CLOSED, AWARDED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: bidding_close_utc
        type: datetime
        source: input
        description: "When BID_OPEN auto-closes; must be < scheduled_start_utc"
      - name: total_flight_minutes
        type: integer
        source: computed
        description: "Sum of (flight_minutes) over child FlightLeg rows where leg_type=REVENUE"
        default: 0
      - name: total_duty_minutes
        type: integer
        source: computed
        description: "scheduled_end_utc - scheduled_start_utc in minutes, plus FAA report+debrief constants"
        default: 0
      - name: scheduled_block_minutes
        type: integer
        source: computed
        description: "calc pairing_credit_block scheduled_estimate variant; set when Pairing transitions to AWARDED; locked thereafter"
        default: 0
      - name: actual_block_minutes
        type: integer
        source: computed
        description: "calc pairing_credit_block actual_block variant; set when Pairing transitions to COMPLETED; locked thereafter"
        default: 0

  - name: FlightLeg
    parent: Pairing
    common_fields: true
    fields:
      - name: pairing_id
        type: string
        source: input
        description: "FK -> Pairing.id; the parent pairing"
      - name: leg_sequence
        type: integer
        source: input
        description: "Order within pairing, 1-based; unique within pairing_id"
        constraints: ">= 1"
      - name: departure_airport
        type: string
        source: input
        description: "Departure IATA"
        constraints: "^[A-Z]{3}$"
      - name: arrival_airport
        type: string
        source: input
        description: "Arrival IATA"
        constraints: "^[A-Z]{3}$"
      - name: scheduled_departure_utc
        type: datetime
        source: input
        description: "Scheduled departure (ISO 8601 UTC)"
      - name: scheduled_arrival_utc
        type: datetime
        source: input
        description: "Scheduled arrival; must be > scheduled_departure_utc"
      - name: leg_type
        type: enum
        source: input
        description: "Whether this leg is revenue flight or positioning deadhead"
        constraints: "one of {REVENUE, DEADHEAD}"
      - name: flight_minutes
        type: integer
        source: computed
        description: "Server-computed: floor((scheduled_arrival_utc - scheduled_departure_utc) / 60s)"

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - name: pairing_id
        type: string
        source: input
        description: "FK -> Pairing.id"
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the bidder"
      - name: requested_seat
        type: enum
        source: input
        description: "Which seat type the crew member is bidding for"
        constraints: "one of {CAPTAIN, FIRST_OFFICER, PURSER, FLIGHT_ATTENDANT}; must match the crew member's rank"
      - name: state
        type: enum
        source: computed
        description: "Bid state"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, AWARDED, UNSUCCESSFUL, WITHDRAWN}"

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - name: pairing_id
        type: string
        source: input
        description: "FK -> Pairing.id"
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id"
      - name: seat
        type: enum
        source: input
        description: "Seat assignment"
        constraints: "one of {CAPTAIN, FIRST_OFFICER, PURSER, FLIGHT_ATTENDANT}"
      - name: source
        type: enum
        source: input
        description: "How the assignment was created"
        constraints: "one of {BID_AWARD, RESERVE_CALLUP, TRIP_TRADE}"
      - name: state
        type: enum
        source: computed
        description: "Assignment lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, CONFIRMED, ACTIVE, COMPLETED, RELEASED, RECOVERED, CANCELLED}"
      - name: actual_duty_start_utc
        type: datetime
        source: computed
        description: "Set when state transitions to ACTIVE"
        default: null
      - name: actual_duty_end_utc
        type: datetime
        source: computed
        description: "Set when state transitions to COMPLETED"
        default: null
      - name: flight_minutes_credited
        type: integer
        source: computed
        description: "Snapshot of pairing.total_flight_minutes at the moment Assignment COMPLETED fires; locked thereafter"
        default: 0
      - name: duty_minutes_credited
        type: integer
        source: computed
        description: "Snapshot of pairing.total_duty_minutes at the moment Assignment COMPLETED fires; locked thereafter"
        default: 0

  - name: SickCall
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; assignment being sick-called out of"
      - name: reported_utc
        type: datetime
        source: system
        description: "Server timestamp at SickCall creation"
      - name: reason_code
        type: enum
        source: input
        description: "Sick-call category"
        constraints: "one of {ILLNESS, INJURY, FAMILY_EMERGENCY}"
      - name: state
        type: enum
        source: computed
        description: "Sick-call lifecycle"
        default: REPORTED
        constraints: "one of {REPORTED, ACKNOWLEDGED, CLOSED}"
      - name: hours_before_departure
        type: integer
        source: computed
        description: "Computed at creation: integer hours from reported_utc to the assignment's pairing.scheduled_start_utc; negative if past departure"

  - name: ReserveCallup
    parent: null
    common_fields: true
    fields:
      - name: sick_call_id
        type: string
        source: input
        description: "FK -> SickCall.id; the sick call this callup is recovering"
      - name: callup_sequence
        type: integer
        source: computed
        description: "1-based attempt counter within sick_call_id"
        default: 1
      - name: selected_reserve_id
        type: string
        source: computed
        description: "FK -> CrewMember.id; reserve picked by selector policy"
      - name: state
        type: enum
        source: computed
        description: "Callup state"
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, EXPIRED}"
      - name: offered_utc
        type: datetime
        source: system
        description: "Server timestamp when offered"
      - name: replacement_assignment_id
        type: string
        source: computed
        description: "FK -> Assignment.id; populated when state=ACCEPTED with the new Assignment created"
        default: null

  - name: TripTrade
    parent: null
    common_fields: true
    fields:
      - name: initiator_assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; assignment offered by the initiator"
      - name: counterparty_assignment_id
        type: string
        source: input
        description: "FK -> Assignment.id; assignment offered by the counterparty"
      - name: initiator_id
        type: string
        source: computed
        description: "FK -> CrewMember.id; copied from initiator_assignment.crew_member_id at creation"
      - name: counterparty_id
        type: string
        source: computed
        description: "FK -> CrewMember.id; copied from counterparty_assignment.crew_member_id at creation"
      - name: state
        type: enum
        source: computed
        description: "Trade lifecycle"
        default: PROPOSED
        constraints: "one of {PROPOSED, COUNTERSIGNED, APPROVED, EXECUTED, REJECTED, WITHDRAWN}"
      - name: rejection_reason
        type: string
        source: computed
        description: "Populated when state=REJECTED"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Pairing
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: BID_OPEN
        trigger: "POST /pairings/{id}/open-bidding"
        actor: SchedulingPlanner
        preconditions:
          - "Pairing has at least one FlightLeg with leg_type=REVENUE"
          - "bidding_close_utc < scheduled_start_utc"
          - "scheduled_start_utc > current_utc"
        side_effects:
          - "Pairing.state := BID_OPEN"
          - "Pairing.version increments by 1"
      - from: BID_OPEN
        to: BID_CLOSED
        trigger: "POST /_clock/set_current_utc (system event when current_utc >= bidding_close_utc) OR POST /pairings/{id}/close-bidding"
        actor: system
        preconditions:
          - "current_utc >= bidding_close_utc"
        side_effects:
          - "Pairing.state := BID_CLOSED"
          - "Pairing.version increments by 1"
      - from: BID_CLOSED
        to: AWARDED
        trigger: "POST /pairings/{id}/award"
        actor: SchedulingPlanner
        preconditions:
          - "Pairing.state == BID_CLOSED"
          - "Bid pool covers all (required_captains + required_first_officers + required_cabin_crew) seats by rank"
        side_effects:
          - "For each required seat, the senior-most SUBMITTED Bid by seniority_number ASC (tie-break: created_at ASC) is awarded -> Bid.state := AWARDED, an Assignment is created (state=SCHEDULED, source=BID_AWARD)"
          - "All other Bids on this Pairing transition SUBMITTED -> UNSUCCESSFUL"
          - "Pairing.scheduled_block_minutes := calc pairing_credit_block scheduled_estimate variant"
          - "Pairing.state := AWARDED"
          - "Pairing.version increments by 1"
      - from: AWARDED
        to: IN_PROGRESS
        trigger: "system: clock advances such that current_utc >= scheduled_start_utc"
        actor: system
        preconditions:
          - "current_utc >= scheduled_start_utc"
          - "All Assignments for this Pairing are in state CONFIRMED"
        side_effects:
          - "Pairing.state := IN_PROGRESS"
          - "Each child Assignment transitions SCHEDULED|CONFIRMED -> ACTIVE; Assignment.actual_duty_start_utc := current_utc; CrewMember.status := ON_DUTY"
          - "Pairing.version increments by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /pairings/{id}/complete"
        actor: OperationsController
        preconditions:
          - "current_utc >= scheduled_end_utc"
        side_effects:
          - "Pairing.state := COMPLETED"
          - "Each ACTIVE Assignment transitions ACTIVE -> COMPLETED; Assignment.actual_duty_end_utc := current_utc; Assignment.flight_minutes_credited := pairing.total_flight_minutes; Assignment.duty_minutes_credited := pairing.total_duty_minutes; CrewMember.status := ON_REST; CrewMember.last_off_duty_utc := current_utc; CrewMember.total_flight_minutes_7d and CrewMember.total_duty_minutes_7d recomputed (calc rolling_duty_window)"
          - "Pairing.actual_block_minutes := calc pairing_credit_block actual_block variant"
          - "Pairing.version increments by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /pairings/{id}/cancel"
        actor: SchedulingPlanner
        preconditions: ["Pairing.state == DRAFT"]
        side_effects:
          - "Pairing.state := CANCELLED"
          - "Pairing.version increments by 1"
      - from: BID_OPEN
        to: CANCELLED
        trigger: "POST /pairings/{id}/cancel"
        actor: SchedulingPlanner
        preconditions: []
        side_effects:
          - "All Bids on this Pairing with state=SUBMITTED transition to WITHDRAWN"
          - "Pairing.state := CANCELLED"
          - "Pairing.version increments by 1"

  - entity: Assignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, RELEASED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /assignments/{id}/confirm"
        actor: CrewMember
        preconditions:
          - "Assignment.crew_member_id == acting CrewMember.id"
          - "Pairing.state == AWARDED"
          - "Validation rolling_duty_window does not project FAA violation when this assignment is added"
        side_effects:
          - "Assignment.state := CONFIRMED"
          - "Assignment.version increments by 1"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /trip-trades/{id}/execute (cascade leg, from trip-trade EXECUTED transition)"
        actor: system
        preconditions:
          - "TripTrade.state transitioning to EXECUTED references this assignment"
        side_effects:
          - "Assignment.state := RELEASED"
          - "Assignment.version increments by 1"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /trip-trades/{id}/execute (cascade leg)"
        actor: system
        preconditions:
          - "TripTrade.state transitioning to EXECUTED references this assignment"
        side_effects:
          - "Assignment.state := RELEASED"
          - "Assignment.version increments by 1"
      - from: CONFIRMED
        to: RECOVERED
        trigger: "POST /sick-calls (cascade leg when SickCall created against this assignment) -> POST /reserve-callups/{id}/accept (cascade leg from ReserveCallup ACCEPTED transition)"
        actor: system
        preconditions:
          - "A ReserveCallup with sick_call_id referencing this assignment transitions to ACCEPTED"
        side_effects:
          - "Assignment.state := RECOVERED"
          - "Assignment.version increments by 1"
          - "A new Assignment is created with source=RESERVE_CALLUP, crew_member_id=ReserveCallup.selected_reserve_id, state=CONFIRMED"
      - from: CONFIRMED
        to: ACTIVE
        trigger: "system (Pairing IN_PROGRESS cascade)"
        actor: system
        preconditions:
          - "Pairing transitioned AWARDED -> IN_PROGRESS"
        side_effects:
          - "Assignment.state := ACTIVE"
          - "Assignment.actual_duty_start_utc := current_utc"
          - "CrewMember.status := ON_DUTY"
          - "Assignment.version increments by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (Pairing COMPLETED cascade)"
        actor: system
        preconditions:
          - "Pairing transitioned IN_PROGRESS -> COMPLETED"
        side_effects:
          - "Assignment.state := COMPLETED"
          - "Assignment.actual_duty_end_utc := current_utc"
          - "Assignment.flight_minutes_credited := pairing.total_flight_minutes"
          - "Assignment.duty_minutes_credited := pairing.total_duty_minutes"
          - "CrewMember.status := ON_REST, CrewMember.last_off_duty_utc := current_utc"
          - "CrewMember.total_flight_minutes_7d, total_duty_minutes_7d recomputed via calc rolling_duty_window"
          - "Assignment.version increments by 1"

  - entity: SickCall
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ACKNOWLEDGED
        trigger: "POST /sick-calls/{id}/acknowledge"
        actor: OperationsController
        preconditions:
          - "Assignment.state IN {SCHEDULED, CONFIRMED}"
        side_effects:
          - "SickCall.state := ACKNOWLEDGED"
          - "A ReserveCallup is created (state=OFFERED, callup_sequence=1, selected_reserve_id chosen by calc reserve_selector)"
          - "Acknowledging crew member's CrewMember.status := SICK"
          - "SickCall.version increments by 1"
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "system: when the ReserveCallup chain reaches state ACCEPTED for this sick_call_id"
        actor: system
        preconditions:
          - "Latest ReserveCallup for this sick_call has state == ACCEPTED"
        side_effects:
          - "SickCall.state := CLOSED"
          - "SickCall.version increments by 1"

  - entity: ReserveCallup
    initial_state: OFFERED
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /reserve-callups/{id}/accept"
        actor: CrewMember
        preconditions:
          - "selected_reserve_id == acting CrewMember.id"
          - "Validation rolling_duty_window does not project FAA violation for this reserve crew member when this assignment is added"
        side_effects:
          - "ReserveCallup.state := ACCEPTED"
          - "Original Assignment transitions CONFIRMED -> RECOVERED; a replacement Assignment is created (state=CONFIRMED, source=RESERVE_CALLUP, crew_member_id=selected_reserve_id, seat=original.seat); ReserveCallup.replacement_assignment_id := new assignment id"
          - "SickCall transitions ACKNOWLEDGED -> CLOSED"
          - "ReserveCallup.version increments by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /reserve-callups/{id}/decline"
        actor: CrewMember
        preconditions:
          - "selected_reserve_id == acting CrewMember.id"
        side_effects:
          - "ReserveCallup.state := DECLINED"
          - "A new ReserveCallup is created (callup_sequence := prior + 1, OFFERED, selected_reserve_id := next reserve per calc reserve_selector with this declining crew excluded)"
          - "ReserveCallup.version increments by 1"

  - entity: TripTrade
    initial_state: PROPOSED
    terminal_states: [EXECUTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: COUNTERSIGNED
        trigger: "POST /trip-trades/{id}/countersign"
        actor: CrewMember
        preconditions:
          - "Acting CrewMember.id == counterparty_id"
          - "Both Assignment.state ∈ {SCHEDULED, CONFIRMED}"
        side_effects:
          - "TripTrade.state := COUNTERSIGNED"
          - "TripTrade.version increments by 1"
      - from: COUNTERSIGNED
        to: APPROVED
        trigger: "POST /trip-trades/{id}/approve"
        actor: OperationsController
        preconditions:
          - "Validation rolling_duty_window does not project FAA violation for either crew member after the swap"
          - "Both crew member's rank == respective new assignment.seat"
        side_effects:
          - "TripTrade.state := APPROVED"
          - "TripTrade.version increments by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /trip-trades/{id}/execute"
        actor: OperationsController
        preconditions:
          - "Both Assignments still in state ∈ {SCHEDULED, CONFIRMED}"
        side_effects:
          - "Initiator's original Assignment transitions to RELEASED"
          - "Counterparty's original Assignment transitions to RELEASED"
          - "Two new Assignments created (state=CONFIRMED, source=TRIP_TRADE), each carrying the swapped pairing_id with the original seat, crew_member_id of the new owner"
          - "TripTrade.state := EXECUTED"
          - "TripTrade.version increments by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /trip-trades/{id}/reject"
        actor: CrewMember
        preconditions:
          - "Acting CrewMember.id == counterparty_id"
        side_effects:
          - "TripTrade.state := REJECTED"
          - "TripTrade.rejection_reason := request.reason"
          - "TripTrade.version increments by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /trip-trades/{id}/withdraw"
        actor: CrewMember
        preconditions:
          - "Acting CrewMember.id == initiator_id"
        side_effects:
          - "TripTrade.state := WITHDRAWN"
          - "TripTrade.version increments by 1"
      - from: COUNTERSIGNED
        to: WITHDRAWN
        trigger: "POST /trip-trades/{id}/withdraw"
        actor: CrewMember
        preconditions:
          - "Acting CrewMember.id == initiator_id"
        side_effects:
          - "TripTrade.state := WITHDRAWN"
          - "TripTrade.version increments by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: trade-execute-stale-pairing
    parent_entity: TripTrade
    write_endpoint: "POST /trip-trades/{id}/execute"
    occ_field: "expected_trip_trade_version"
    description: |
      Executing a TripTrade whose version has advanced since the operator last
      observed it (e.g., counterparty withdrew or it was already executed by
      another operator path) is rejected. Two strictly sequential executes
      using the same stale version observe the second attempt failing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: pairing-award-stale-version
    parent_entity: Pairing
    write_endpoint: "POST /pairings/{id}/award"
    occ_field: "expected_pairing_version"
    description: |
      Awarding a Pairing using a stale expected_pairing_version (e.g., the
      bidding window auto-closed and bumped the version) is rejected. The
      planner's view of the Pairing is provably stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pairing_duty_window
    trigger: "On Pairing creation; on FlightLeg create/update under a non-terminal Pairing"
    algorithm: interval_merge
    formula: |
      total_duty_minutes := minutes(scheduled_end_utc - scheduled_start_utc) + REPORT_BUFFER_MIN + DEBRIEF_BUFFER_MIN
      total_flight_minutes := sum(leg.flight_minutes) for leg in FlightLeg
                                where leg.pairing_id == this.id AND leg.leg_type == 'REVENUE'
      # DEADHEAD legs are excluded from total_flight_minutes but included in total_duty_minutes
      # (already captured because they fall inside scheduled_start..scheduled_end)
    input_set: "All FlightLeg rows with pairing_id == this.id and leg_type IN {REVENUE} for flight, both REVENUE and DEADHEAD subsumed by the outer duty window"
    constants:
      REPORT_BUFFER_MIN: 60
      DEBRIEF_BUFFER_MIN: 30
    precision: "Integer minutes; floor for partial minutes during leg duration"

  - name: rolling_duty_window
    trigger: "On Assignment ACTIVE->COMPLETED; on POST /_clock/set_current_utc; on POST /assignments/{id}/confirm (as preview to enforce FAA); on POST /reserve-callups/{id}/accept (preview); on POST /trip-trades/{id}/approve (preview)"
    algorithm: aggregation
    formula: |
      window_start := current_utc - 168 hours  # trailing 7 days
      total_flight_minutes_7d :=
        sum(a.flight_minutes_credited) for a in Assignment
          where a.crew_member_id == this.id
            AND a.state IN {COMPLETED}
            AND a.actual_duty_end_utc >= window_start
            AND a.actual_duty_end_utc <= current_utc
      total_duty_minutes_7d :=
        sum(a.duty_minutes_credited) for a in Assignment with same filter
      # PREVIEW form (preconditions): include the candidate assignment's pairing values as if completed
      preview_total_duty_minutes_7d :=
        total_duty_minutes_7d + candidate_pairing.total_duty_minutes
      FAA violation iff preview_total_duty_minutes_7d > FAA_DUTY_CAP_7D_MIN
                     OR preview_total_flight_minutes_7d > FAA_FLIGHT_CAP_7D_MIN
    input_set: "Assignment rows in state=COMPLETED with actual_duty_end_utc within (current_utc - 168h, current_utc]; ordered by actual_duty_end_utc ASC, tie-break created_at ASC"
    constants:
      FAA_DUTY_CAP_7D_MIN: 3600     # 60 hours = 3600 min
      FAA_FLIGHT_CAP_7D_MIN: 1800   # 30 hours = 1800 min
      WINDOW_HOURS: 168
    precision: "Integer minutes; boundary uses strict greater-than (> cap is violation; == cap passes)"
    variants:
      - name: completed_actual
        when: "Persisted on CrewMember after each Assignment COMPLETED transition"
        difference: "Uses Assignment.flight_minutes_credited and duty_minutes_credited as locked at completion"
      - name: preview_with_candidate
        when: "Evaluated as a precondition guard before assignment confirm / reserve accept / trip-trade approve"
        difference: "Adds the candidate Pairing's projected total_*_minutes to the persisted 7d totals; never written to CrewMember"

  - name: crew_rest_interval
    trigger: "Precondition check before assignment confirm, reserve callup accept, trip-trade approve; also pre-check for next pairing start"
    algorithm: threshold
    formula: |
      if CrewMember.last_off_duty_utc IS NULL:
        rest_minutes := infinity  # never been on duty
      else:
        rest_minutes := minutes(candidate_pairing.scheduled_start_utc - CrewMember.last_off_duty_utc)
      pass iff rest_minutes >= MIN_REST_MINUTES
    input_set: "Single CrewMember; single candidate Pairing"
    constants:
      MIN_REST_MINUTES: 600   # 10 hours
    precision: "Integer minutes; exactly MIN_REST_MINUTES passes; one minute less fails"

  - name: pairing_credit_block
    trigger: "On Pairing transition to AWARDED (scheduled variant snapshot); on Pairing transition to COMPLETED (actual variant snapshot)"
    algorithm: aggregation
    formula: |
      # SCHEDULED variant — uses planned window
      scheduled_block_minutes := minutes(scheduled_end_utc - scheduled_start_utc) - REPORT_BUFFER_MIN - DEBRIEF_BUFFER_MIN
      # ACTUAL variant — uses sum over child Assignment.actual_duty_*_utc
      actual_block_minutes :=
        sum(minutes(a.actual_duty_end_utc - a.actual_duty_start_utc) for a in Assignment
            where a.pairing_id == this.id
              AND a.state == COMPLETED) / count(such Assignments)
      # When both variants exist, scheduled is set at AWARDED; actual is set at COMPLETED.
    input_set: "this Pairing; all Assignment rows where pairing_id == this.id and state == COMPLETED"
    constants:
      REPORT_BUFFER_MIN: 60
      DEBRIEF_BUFFER_MIN: 30
    precision: "Integer minutes; floor division for averaging"
    variants:
      - name: scheduled_estimate
        when: "Computed at Pairing AWARDED — uses scheduled_start_utc/scheduled_end_utc"
        difference: "Uses planned window only; ignores any later real-world duty timing"
      - name: actual_block
        when: "Computed at Pairing COMPLETED — uses the average of Assignment.actual_duty_*_utc"
        difference: "Uses real actual_duty_start_utc/end_utc averaged across child Assignments; can differ from scheduled when clock-set advances duty start beyond scheduled_start_utc"

  - name: reserve_selector
    trigger: "On SickCall ACKNOWLEDGED (create ReserveCallup); on ReserveCallup OFFERED -> DECLINED (next ReserveCallup)"
    algorithm: weighted_scoring
    formula: |
      # Eligibility filter
      candidates := { c in CrewMember |
                        c.line_type == 'RESERVE'
                        AND c.status == 'AVAILABLE'
                        AND c.rank matches required seat
                        AND c.base_airport == pairing.origin_base
                        AND c.id NOT IN {ids of crew already offered for this sick_call_id} }
      # Ranking: lowest total_duty_minutes_7d first; tie-break seniority_number ASC (most senior wins); tie-break created_at ASC
      sort candidates by (total_duty_minutes_7d ASC, seniority_number ASC, created_at ASC)
      selected := candidates[0]
      if candidates is empty: raise ERR_NO_RESERVE_AVAILABLE
    input_set: "Reserve crew members at the same base as the orphaned pairing, of matching rank, not yet offered this sick_call"
    constants:
      MAX_CALLUP_ATTEMPTS: 5
    precision: "Total_duty_minutes_7d compared as integer minutes; first-bucket fill (lowest workload first)"

# =============================================================================
# §1.4 Validation Rules Table (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-segment ids resolve to existing entities, left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: existence
    check: "All FK fields in the request body reference existing parent entities"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (confirm, award, accept, decline, countersign, approve, execute, cancel, complete)"
  - priority: 6
    category: state
    check: "Cross-entity state guard: confirm / reserve-accept / trip-trade approve require dependent entity (Pairing, SickCall, related Assignment) to be in compatible state"
    error_id: ERR_CROSS_ENTITY_STATE
    http_status: 409
    applies_to: "POST /assignments/{id}/confirm, POST /reserve-callups/{id}/accept, POST /trip-trades/{id}/approve, POST /trip-trades/{id}/execute"
  - priority: 7
    category: business_safety
    check: "FAA duty cap: rolling_duty_window preview must NOT project total_duty_minutes_7d > FAA_DUTY_CAP_7D_MIN for the candidate crew member"
    error_id: ERR_FAA_DUTY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments/{id}/confirm, POST /reserve-callups/{id}/accept, POST /trip-trades/{id}/approve"
  - priority: 8
    category: business_safety
    check: "FAA flight cap: rolling_duty_window preview must NOT project total_flight_minutes_7d > FAA_FLIGHT_CAP_7D_MIN"
    error_id: ERR_FAA_FLIGHT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments/{id}/confirm, POST /reserve-callups/{id}/accept, POST /trip-trades/{id}/approve"
  - priority: 9
    category: business_safety
    check: "crew_rest_interval: candidate pairing.scheduled_start_utc - CrewMember.last_off_duty_utc must be >= MIN_REST_MINUTES (10 hours)"
    error_id: ERR_CREW_REST_VIOLATION
    http_status: 422
    applies_to: "POST /assignments/{id}/confirm, POST /reserve-callups/{id}/accept, POST /trip-trades/{id}/approve"
  - priority: 10
    category: business_referential
    check: "Bid: requested_seat must match crew member's rank (CAPTAIN→CAPTAIN, FIRST_OFFICER→FIRST_OFFICER, FLIGHT_ATTENDANT→{PURSER,FLIGHT_ATTENDANT})"
    error_id: ERR_RANK_SEAT_MISMATCH
    http_status: 422
    applies_to: "POST /bids, POST /trip-trades, POST /trip-trades/{id}/approve"
  - priority: 11
    category: business_temporal
    check: "Pairing.bidding_close_utc must be strictly less than Pairing.scheduled_start_utc; scheduled_end_utc strictly greater than scheduled_start_utc"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /pairings, POST /pairings/{id}/open-bidding"
  - priority: 12
    category: business_temporal
    check: "TripTrade overlap rule: the swapped pairings must not have overlapping duty windows for either crew member's existing CONFIRMED assignments (half-open intervals [start, end); back-to-back where end_A == start_B is permitted, end_A > start_B is conflict)"
    error_id: ERR_PAIRING_OVERLAP
    http_status: 422
    applies_to: "POST /trip-trades/{id}/approve"
  - priority: 13
    category: business_constraint
    check: "Bid uniqueness: only one Bid per (pairing_id, crew_member_id) in non-terminal state {SUBMITTED, AWARDED}"
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    applies_to: "POST /bids"
  - priority: 14
    category: business_constraint
    check: "FlightLeg overlap rule within a Pairing: distinct legs of the same pairing must not have overlapping [scheduled_departure_utc, scheduled_arrival_utc] windows; closed intervals (touching at a single instant is a conflict)"
    error_id: ERR_LEG_OVERLAP
    http_status: 422
    applies_to: "POST /pairings/{id}/flight-legs"
  - priority: 15
    category: business_constraint
    check: "OCC: when expected_<parent>_version is supplied, it must equal current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pairings/{id}/award, POST /trip-trades/{id}/execute"
  - priority: 16
    category: business_constraint
    check: "Reserve callup attempts cannot exceed reserve_selector.MAX_CALLUP_ATTEMPTS"
    error_id: ERR_NO_RESERVE_AVAILABLE
    http_status: 422
    applies_to: "POST /reserve-callups/{id}/decline, POST /sick-calls/{id}/acknowledge"
  - priority: 17
    category: business_constraint
    check: "Required-field presence; type and format conformance (enums, regexes); strict-extra rejection"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- CrewMember -----
  - method: POST
    path: "/crew-members"
    description: "Create a crew member"
    roles: [SchedulingPlanner]
    code: 201
    input: [employee_code, full_name, rank, base_airport, seniority_number, line_type]
    output: CrewMember
    side_effects: []
  - method: GET
    path: "/crew-members"
    description: "List crew members (paginated)"
    roles: [SchedulingPlanner, OperationsController]
    code: 200
    input: ["limit?", "offset?", "rank?", "base_airport?", "line_type?", "status?"]
    output: CrewMember[]
    side_effects: []
  - method: GET
    path: "/crew-members/{id}"
    description: "Read a crew member"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # ----- Pairing -----
  - method: POST
    path: "/pairings"
    description: "Create a pairing in DRAFT"
    roles: [SchedulingPlanner]
    code: 201
    input: [pairing_code, origin_base, scheduled_start_utc, scheduled_end_utc, required_captains, required_first_officers, required_cabin_crew, bidding_close_utc]
    output: Pairing
    side_effects:
      - "calc pairing_duty_window initializes total_duty_minutes and total_flight_minutes (0 legs at create)"
  - method: GET
    path: "/pairings"
    description: "List pairings (paginated)"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: ["limit?", "offset?", "state?", "origin_base?"]
    output: Pairing[]
    side_effects: []
  - method: GET
    path: "/pairings/{id}"
    description: "Read a pairing"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: []
    output: Pairing
    side_effects: []
  - method: POST
    path: "/pairings/{id}/open-bidding"
    description: "Open bidding for a DRAFT pairing"
    roles: [SchedulingPlanner]
    code: 200
    input: []
    output: Pairing
    side_effects:
      - "Pairing.state transitions DRAFT -> BID_OPEN"
      - "Pairing.version increments by 1"
  - method: POST
    path: "/pairings/{id}/close-bidding"
    description: "Manually close bidding before scheduled bidding_close_utc"
    roles: [SchedulingPlanner]
    code: 200
    input: []
    output: Pairing
    side_effects:
      - "Pairing.state transitions BID_OPEN -> BID_CLOSED"
      - "Pairing.version increments by 1"
  - method: POST
    path: "/pairings/{id}/award"
    description: "Award seats by seniority to SUBMITTED bidders; transitions BID_CLOSED -> AWARDED"
    roles: [SchedulingPlanner]
    code: 200
    input: [expected_pairing_version]
    output: Pairing
    side_effects:
      - "Awards senior-most SUBMITTED bid per required seat (calc reserve_selector NOT used here; pure seniority ordering)"
      - "Creates Assignment rows for each awarded bid (source=BID_AWARD, state=SCHEDULED)"
      - "Other SUBMITTED Bids on this Pairing -> UNSUCCESSFUL"
      - "Pairing.state := AWARDED; Pairing.version increments by 1"
  - method: POST
    path: "/pairings/{id}/complete"
    description: "Mark a Pairing IN_PROGRESS -> COMPLETED; cascades Assignment completions"
    roles: [OperationsController]
    code: 200
    input: []
    output: Pairing
    side_effects:
      - "Pairing.state := COMPLETED; Pairing.version increments by 1"
      - "Each ACTIVE Assignment cascades ACTIVE -> COMPLETED with credited minutes locked from pairing totals"
      - "Each affected CrewMember's status -> ON_REST, last_off_duty_utc := current_utc"
      - "calc rolling_duty_window completed_actual updates total_flight_minutes_7d, total_duty_minutes_7d on each CrewMember"
  - method: POST
    path: "/pairings/{id}/cancel"
    description: "Cancel a Pairing from DRAFT or BID_OPEN"
    roles: [SchedulingPlanner]
    code: 200
    input: []
    output: Pairing
    side_effects:
      - "Pairing.state := CANCELLED"
      - "If from BID_OPEN: all SUBMITTED Bids on this pairing -> WITHDRAWN"
      - "Pairing.version increments by 1"

  # ----- FlightLeg (sub-resource) -----
  - method: POST
    path: "/pairings/{id}/flight-legs"
    description: "Add a FlightLeg to a Pairing in DRAFT"
    roles: [SchedulingPlanner]
    code: 201
    input: [leg_sequence, departure_airport, arrival_airport, scheduled_departure_utc, scheduled_arrival_utc, leg_type]
    output: FlightLeg
    side_effects:
      - "calc pairing_duty_window recomputes Pairing.total_flight_minutes and Pairing.total_duty_minutes"
      - "Pairing.version increments by 1"
  - method: GET
    path: "/pairings/{id}/flight-legs"
    description: "List FlightLegs for a Pairing"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: ["limit?", "offset?"]
    output: FlightLeg[]
    side_effects: []

  # ----- Bid -----
  - method: POST
    path: "/bids"
    description: "Crew member submits a Bid for a Pairing in BID_OPEN"
    roles: [CrewMember]
    code: 201
    input: [pairing_id, crew_member_id, requested_seat]
    output: Bid
    side_effects:
      - "Bid created in state=SUBMITTED"
  - method: GET
    path: "/bids"
    description: "List Bids (paginated, filterable)"
    roles: [SchedulingPlanner, CrewMember]
    code: 200
    input: ["limit?", "offset?", "pairing_id?", "crew_member_id?", "state?"]
    output: Bid[]
    side_effects: []
  - method: GET
    path: "/bids/{id}"
    description: "Read a Bid"
    roles: [SchedulingPlanner, CrewMember]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: POST
    path: "/bids/{id}/withdraw"
    description: "Crew member withdraws their own SUBMITTED Bid before BID_CLOSED"
    roles: [CrewMember]
    code: 200
    input: []
    output: Bid
    side_effects:
      - "Bid.state := WITHDRAWN"
      - "Bid.version increments by 1"

  # ----- Assignment -----
  - method: GET
    path: "/assignments"
    description: "List Assignments (paginated)"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: ["limit?", "offset?", "pairing_id?", "crew_member_id?", "state?"]
    output: Assignment[]
    side_effects: []
  - method: GET
    path: "/assignments/{id}"
    description: "Read an Assignment"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/assignments/{id}/confirm"
    description: "Crew member confirms a SCHEDULED Assignment (subject to FAA + rest checks)"
    roles: [CrewMember]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "Assignment.state := CONFIRMED"
      - "Assignment.version increments by 1"

  # ----- SickCall -----
  - method: POST
    path: "/sick-calls"
    description: "Crew member reports sick for one of their own Assignments"
    roles: [CrewMember]
    code: 201
    input: [assignment_id, reason_code]
    output: SickCall
    side_effects:
      - "SickCall created in state=REPORTED; hours_before_departure computed at creation"
  - method: GET
    path: "/sick-calls"
    description: "List SickCalls"
    roles: [OperationsController, SchedulingPlanner]
    code: 200
    input: ["limit?", "offset?", "assignment_id?", "state?"]
    output: SickCall[]
    side_effects: []
  - method: GET
    path: "/sick-calls/{id}"
    description: "Read a SickCall"
    roles: [OperationsController, SchedulingPlanner, CrewMember]
    code: 200
    input: []
    output: SickCall
    side_effects: []
  - method: POST
    path: "/sick-calls/{id}/acknowledge"
    description: "Operations acknowledges a SickCall and triggers ReserveCallup"
    roles: [OperationsController]
    code: 200
    input: []
    output: SickCall
    side_effects:
      - "SickCall.state := ACKNOWLEDGED"
      - "ReserveCallup created (state=OFFERED, callup_sequence=1, selected_reserve_id via calc reserve_selector)"
      - "CrewMember (the sick-calling crew).status := SICK"
      - "SickCall.version increments by 1"

  # ----- ReserveCallup -----
  - method: GET
    path: "/reserve-callups"
    description: "List ReserveCallups"
    roles: [OperationsController, CrewMember]
    code: 200
    input: ["limit?", "offset?", "sick_call_id?", "selected_reserve_id?", "replacement_assignment_id?", "state?"]
    output: ReserveCallup[]
    side_effects: []
  - method: GET
    path: "/reserve-callups/{id}"
    description: "Read a ReserveCallup"
    roles: [OperationsController, CrewMember]
    code: 200
    input: []
    output: ReserveCallup
    side_effects: []
  - method: POST
    path: "/reserve-callups/{id}/accept"
    description: "Reserve crew accepts an OFFERED callup; cascades to RECOVERED + new Assignment + SickCall CLOSED"
    roles: [CrewMember]
    code: 200
    input: []
    output: ReserveCallup
    side_effects:
      - "ReserveCallup.state := ACCEPTED"
      - "Original Assignment CONFIRMED -> RECOVERED"
      - "New Assignment created (state=CONFIRMED, source=RESERVE_CALLUP, crew_member_id=selected_reserve_id, seat=original.seat)"
      - "ReserveCallup.replacement_assignment_id := new assignment id"
      - "SickCall ACKNOWLEDGED -> CLOSED"
      - "ReserveCallup.version increments by 1"
  - method: POST
    path: "/reserve-callups/{id}/decline"
    description: "Reserve crew declines an OFFERED callup; system attempts next reserve"
    roles: [CrewMember]
    code: 200
    input: []
    output: ReserveCallup
    side_effects:
      - "ReserveCallup.state := DECLINED"
      - "New ReserveCallup created (callup_sequence := prior + 1, OFFERED, next reserve via calc reserve_selector excluding the declining crew)"
      - "ReserveCallup.version increments by 1"

  # ----- TripTrade -----
  - method: POST
    path: "/trip-trades"
    description: "Initiator proposes a trip trade between two Assignments"
    roles: [CrewMember]
    code: 201
    input: [initiator_assignment_id, counterparty_assignment_id]
    output: TripTrade
    side_effects:
      - "TripTrade created (state=PROPOSED); initiator_id and counterparty_id copied from the assignments"
  - method: GET
    path: "/trip-trades"
    description: "List TripTrades"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: ["limit?", "offset?", "initiator_id?", "counterparty_id?", "initiator_assignment_id?", "counterparty_assignment_id?", "state?"]
    output: TripTrade[]
    side_effects: []
  - method: GET
    path: "/trip-trades/{id}"
    description: "Read a TripTrade"
    roles: [SchedulingPlanner, OperationsController, CrewMember]
    code: 200
    input: []
    output: TripTrade
    side_effects: []
  - method: POST
    path: "/trip-trades/{id}/countersign"
    description: "Counterparty agrees; trade -> COUNTERSIGNED"
    roles: [CrewMember]
    code: 200
    input: []
    output: TripTrade
    side_effects:
      - "TripTrade.state := COUNTERSIGNED; TripTrade.version increments by 1"
  - method: POST
    path: "/trip-trades/{id}/reject"
    description: "Counterparty rejects PROPOSED trade"
    roles: [CrewMember]
    code: 200
    input: ["reason?"]
    output: TripTrade
    side_effects:
      - "TripTrade.state := REJECTED; rejection_reason captured; TripTrade.version increments by 1"
  - method: POST
    path: "/trip-trades/{id}/withdraw"
    description: "Initiator withdraws PROPOSED or COUNTERSIGNED trade"
    roles: [CrewMember]
    code: 200
    input: []
    output: TripTrade
    side_effects:
      - "TripTrade.state := WITHDRAWN; TripTrade.version increments by 1"
  - method: POST
    path: "/trip-trades/{id}/approve"
    description: "Operations approves a COUNTERSIGNED trade after FAA + rest + overlap checks"
    roles: [OperationsController]
    code: 200
    input: []
    output: TripTrade
    side_effects:
      - "TripTrade.state := APPROVED; TripTrade.version increments by 1"
  - method: POST
    path: "/trip-trades/{id}/execute"
    description: "Execute an APPROVED trade — atomic swap of the two assignments"
    roles: [OperationsController]
    code: 200
    input: [expected_trip_trade_version]
    output: TripTrade
    side_effects:
      - "Initiator's original Assignment -> RELEASED; counterparty's original Assignment -> RELEASED"
      - "Two new Assignments created (state=CONFIRMED, source=TRIP_TRADE) carrying swapped pairing_id with original seat"
      - "TripTrade.state := EXECUTED; TripTrade.version increments by 1"

  # ----- Test-driving endpoints (under /_) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock; advances state-machine auto-transitions that depend on time (bidding close, IN_PROGRESS)"
    roles: [SchedulingPlanner, OperationsController]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Server's logical current_utc := to_iso8601"
      - "For each Pairing in BID_OPEN with current_utc >= bidding_close_utc: cascade to BID_CLOSED"
      - "For each Pairing in AWARDED with current_utc >= scheduled_start_utc and all Assignments CONFIRMED: cascade to IN_PROGRESS (Assignments CONFIRMED -> ACTIVE)"
      - "calc rolling_duty_window completed_actual re-evaluated on each CrewMember whose Assignments completed within the new window"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not authorized for this endpoint, or crew acting on resource not their own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or FK does not resolve to an existing entity"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is defined"
  - id: ERR_CROSS_ENTITY_STATE
    http: 409
    condition: "Dependent entity (e.g., Pairing, related Assignment) is not in a compatible state for this operation"
  - id: ERR_FAA_DUTY_CAP_EXCEEDED
    http: 422
    condition: "Adding the candidate Pairing's duty minutes would project total_duty_minutes_7d > FAA_DUTY_CAP_7D_MIN"
  - id: ERR_FAA_FLIGHT_CAP_EXCEEDED
    http: 422
    condition: "Adding the candidate Pairing's flight minutes would project total_flight_minutes_7d > FAA_FLIGHT_CAP_7D_MIN"
  - id: ERR_CREW_REST_VIOLATION
    http: 422
    condition: "Candidate scheduled_start_utc - CrewMember.last_off_duty_utc < MIN_REST_MINUTES"
  - id: ERR_RANK_SEAT_MISMATCH
    http: 422
    condition: "Bid.requested_seat or new Assignment.seat does not match the CrewMember.rank under the rank↔seat compatibility table"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "Pairing has bidding_close_utc >= scheduled_start_utc, or scheduled_end_utc <= scheduled_start_utc, or FlightLeg arrival <= departure"
  - id: ERR_PAIRING_OVERLAP
    http: 422
    condition: "TripTrade target pairings have duty windows overlapping the swap-recipient's already-confirmed assignments under half-open interval semantics"
  - id: ERR_LEG_OVERLAP
    http: 422
    condition: "Two FlightLegs of the same Pairing have overlapping [departure, arrival] closed-interval windows"
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "Crew member already has a non-terminal Bid for the same Pairing"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "Supplied expected_<parent>_version does not equal current parent.version"
  - id: ERR_NO_RESERVE_AVAILABLE
    http: 422
    condition: "calc reserve_selector finds no eligible reserve, or MAX_CALLUP_ATTEMPTS exceeded"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, unknown field present, or type/format/enum violation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchedulingPlanner
    description: "Plans pairings, opens/closes bidding, awards seats, cancels pairings"
    identity: opaque
    exclusive_operations:
      - "POST /pairings"
      - "POST /pairings/{id}/open-bidding"
      - "POST /pairings/{id}/close-bidding"
      - "POST /pairings/{id}/award"
      - "POST /pairings/{id}/cancel"
      - "POST /pairings/{id}/flight-legs"
      - "POST /crew-members"
    shared_operations:
      - "GET /pairings, GET /pairings/{id}, GET /pairings/{id}/flight-legs"
      - "GET /crew-members, GET /crew-members/{id}"
      - "GET /bids"
      - "GET /assignments, GET /assignments/{id}"
      - "GET /sick-calls"
      - "GET /trip-trades"
      - "GET /reserve-callups"
      - "POST /_clock/set_current_utc"

  - name: OperationsController
    description: "Day-of-operations control: completes pairings, acknowledges sick calls, approves and executes trades"
    identity: opaque
    exclusive_operations:
      - "POST /pairings/{id}/complete"
      - "POST /sick-calls/{id}/acknowledge"
      - "POST /trip-trades/{id}/approve"
      - "POST /trip-trades/{id}/execute"
    shared_operations:
      - "GET /crew-members, GET /crew-members/{id}, GET /pairings, GET /pairings/{id}, GET /pairings/{id}/flight-legs"
      - "GET /sick-calls, GET /reserve-callups, GET /trip-trades, GET /assignments, GET /assignments/{id}"
      - "POST /_clock/set_current_utc"

  - name: CrewMember
    description: "Crew members act on their own resources: bid, confirm, sick call, reserve accept/decline, trip-trade flow"
    identity: "entity_backed:CrewMember"
    exclusive_operations:
      - "POST /bids (must use own crew_member_id)"
      - "POST /bids/{id}/withdraw (must own the bid)"
      - "POST /assignments/{id}/confirm (must own the assignment)"
      - "POST /sick-calls (must own the assignment)"
      - "POST /reserve-callups/{id}/accept (must be selected_reserve_id)"
      - "POST /reserve-callups/{id}/decline (must be selected_reserve_id)"
      - "POST /trip-trades (must be initiator on initiator_assignment)"
      - "POST /trip-trades/{id}/countersign (must be counterparty_id)"
      - "POST /trip-trades/{id}/reject (must be counterparty_id)"
      - "POST /trip-trades/{id}/withdraw (must be initiator_id)"
    shared_operations:
      - "GET /crew-members/{id} (own only)"
      - "GET /pairings, GET /pairings/{id}, GET /pairings/{id}/flight-legs"
      - "GET /bids (filtered to own)"
      - "GET /assignments, GET /assignments/{id} (filtered to own)"
      - "GET /reserve-callups (filtered to selected_reserve_id == own)"
      - "GET /trip-trades (filtered to initiator_id == own OR counterparty_id == own)"
