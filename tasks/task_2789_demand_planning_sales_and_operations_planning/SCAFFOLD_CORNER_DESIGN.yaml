            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-A", name: "Family A", accountable_planner_user_id: "planner-a", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_a: $.data.id }
