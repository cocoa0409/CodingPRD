# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Uniform & Workwear Rental Program — breadth probe over §1.1-§1.7.
# Taxonomy sections/claim_types per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_computed_defaults
        claim_type: Creation
        grounds:
          - entities.Account
          - endpoints[POST /accounts]
        distinguishing_aspect: "POST /accounts with required fields returns 201; billing_status=CURRENT, outstanding_cents=0, active_wearer_count=0 are set by the server."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { legal_name: "Cornerco", service_day: "MON", shortage_grace_units: 3 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Account.${acct}.billing_status == CURRENT"
            - "Account.${acct}.outstanding_cents == 0"
            - "Account.${acct}.active_wearer_count == 0"

      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Account
          - endpoints[GET /accounts/{id}]
        distinguishing_aspect: "GET /accounts/{id} returns the stored account with matching legal_name and version 1."
        test_recipe:
          setup: ["One account created."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "ReadMe Co", service_day: "TUE" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "GET /accounts/${acct}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "data.legal_name == 'ReadMe Co'"
            - "data.version == 1"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Account
          - endpoints[GET /accounts]
        distinguishing_aspect: "GET /accounts returns response_type array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two accounts created."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "A1", service_day: "MON" }
              as: ProgramAdmin
            - call: "POST /accounts"
              payload: { legal_name: "A2", service_day: "MON" }
              as: ProgramAdmin
          trigger:
            - call: "GET /accounts?limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response_type == 'array'"
            - "total_count >= 2"
            - "has_more == true"

      - name: get_account_not_found
        claim_type: Not Found
        grounds:
          - entities.Account
          - endpoints[GET /accounts/{id}]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET /accounts/{random-uuid} returns ERR_RESOURCE_NOT_FOUND with 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND"
            - "HTTP status == 404"

      - name: missing_required_field_on_wearer_create
        claim_type: Required Fields
        grounds:
          - entities.Wearer.fields.shirt_size
          - endpoints[POST /accounts/{id}/wearers]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST wearer omitting shirt_size returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "WReq Co", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "NoSize", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: shortage_grace_units_default_applied
        claim_type: Defaults
        grounds:
          - entities.Account.fields.shortage_grace_units
          - endpoints[POST /accounts]
        distinguishing_aspect: "POST /accounts omitting shortage_grace_units applies default 2."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { legal_name: "DefCo", service_day: "WED" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
          assert:
            - "Account.${acct}.shortage_grace_units == 2"

      - name: garment_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Garment.fields.lifecycle_status
          - entities.Garment.fields.wash_location
          - entities.Garment.fields.soil_strikes
          - endpoints[POST /accounts/{id}/garments]
        distinguishing_aspect: "POST garment yields lifecycle_status=IN_STOCK, wash_location=AT_PLANT, soil_strikes=0 regardless of any client-sent values."
        test_recipe:
          setup: ["One account + garment type."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "CompCo", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-CF", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
          assert:
            - "Garment.${g1}.lifecycle_status == IN_STOCK"
            - "Garment.${g1}.wash_location == AT_PLANT"
            - "Garment.${g1}.soil_strikes == 0"

      - name: invalid_enum_shirt_size_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Wearer.fields.shirt_size
          - endpoints[POST /accounts/{id}/wearers]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST wearer with shirt_size='XXXL' (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One account."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "EnumCo", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Bad", shirt_size: "XXXL", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: wearer_requires_existing_parent_account
        claim_type: Parent Relationships
        grounds:
          - entities.Wearer
          - endpoints[POST /accounts/{id}/wearers]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "POST wearer under a non-existent account id returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts/00000000-0000-4000-8000-000000000000/wearers"
              payload: { full_name: "Orphan", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESOURCE_NOT_FOUND"
            - "HTTP status == 404"

      - name: fk_reverse_assignments_by_account
        claim_type: Foreign key references validated
        grounds:
          - entities.Assignment.fields.account_id
          - endpoints[GET /assignments]
        distinguishing_aspect: "GET /assignments?account_id={acct} returns the assignment array for that account (reverse-reachability of Assignment.account_id)."
        test_recipe:
          setup: ["One account with one ASSIGNED garment."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "RevCo", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-RV", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Rv", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /assignments?account_id=${acct}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response_type == 'array'"
            - "total_count == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: pickup_from_delivered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_PICKED_UP
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling pickup on a visit already DELIVERED (not SCHEDULED) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A visit delivered (1 garment, washed)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "InvCo", service_day: "MON", shortage_grace_units: 5 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-IV", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /wash-stations"
              payload: { station_code: "WS-IV", capacity: 5 }
              as: ProgramAdmin
              captures: { ws: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Iv", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
            - call: "POST /routes"
              payload: { route_code: "R-IV", service_day: "MON", driver_user_id: "drv-iv" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v: $.data.id }
            - call: "POST /service-visits/${v}/pickup"
              payload: { actual_soil_count: 1 }
              as: RouteDriver
            - call: "POST /garments/${g1}/start-wash"
              payload: { wash_station_id: "${ws}", slot_start_min: 600, slot_end_min: 660 }
              as: CleanroomTech
            - call: "POST /garments/${g1}/finish-wash"
              payload: {}
              as: CleanroomTech
            - call: "POST /service-visits/${v}/deliver"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /service-visits/${v}/pickup"
              payload: { actual_soil_count: 1 }
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: reconciled_visit_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ServiceVisit.DELIVERED_to_RECONCILED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second reconcile on an already-RECONCILED (terminal) visit returns ERR_INVALID_STATE before OCC is even consulted."
        test_recipe:
          setup: ["A reconciled visit."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "TermCo", service_day: "MON", shortage_grace_units: 5 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-TM", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /wash-stations"
              payload: { station_code: "WS-TM", capacity: 5 }
              as: ProgramAdmin
              captures: { ws: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Tm", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
            - call: "POST /routes"
              payload: { route_code: "R-TM", service_day: "MON", driver_user_id: "drv-tm" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v: $.data.id }
            - call: "POST /service-visits/${v}/pickup"
              payload: { actual_soil_count: 1 }
              as: RouteDriver
            - call: "POST /garments/${g1}/start-wash"
              payload: { wash_station_id: "${ws}", slot_start_min: 600, slot_end_min: 660 }
              as: CleanroomTech
            - call: "POST /garments/${g1}/finish-wash"
              payload: {}
              as: CleanroomTech
            - call: "POST /service-visits/${v}/deliver"
              payload: {}
              as: RouteDriver
              captures: { vdel: $.data.version }
            - call: "POST /service-visits/${v}/reconcile"
              payload: { expected_service_visit_version: "${vdel}" }
              as: ProgramAdmin
              captures: { vrec: $.data.version }
          trigger:
            - call: "POST /service-visits/${v}/reconcile"
              payload: { expected_service_visit_version: "${vrec}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: new_visit_starts_scheduled
        claim_type: Initial State
        grounds:
          - state_machines.ServiceVisit.initial_state
          - endpoints[POST /route-stops/{id}/service-visits]
        distinguishing_aspect: "A freshly created ServiceVisit has status SCHEDULED and version 1."
        test_recipe:
          setup: ["A route stop."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "InitCo", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R-IN", service_day: "MON", driver_user_id: "drv-in" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
          trigger:
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v: $.data.id }
          assert:
            - "ServiceVisit.${v}.status == SCHEDULED"
            - "ServiceVisit.${v}.version == 1"

      - name: wearer_ramp_down_then_reinstate_revert
        claim_type: cyclic
        grounds:
          - state_machines.Wearer.ACTIVE_to_RAMP_DOWN
          - state_machines.Wearer.RAMP_DOWN_to_ACTIVE
        distinguishing_aspect: "Wearer ACTIVE->RAMP_DOWN->ACTIVE revert edge: after ramp-down then reinstate, roster_status is ACTIVE and version incremented twice."
        test_recipe:
          setup: ["One ACTIVE wearer."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "RevW Co", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Rw", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /wearers/${wr}/ramp-down"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /wearers/${wr}/reinstate"
              payload: {}
              as: AccountManager
          assert:
            - "Wearer.${wr}.roster_status == ACTIVE"
            - "Wearer.${wr}.version == 3"

      - name: return_side_effect_restocks_garment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Assignment.ASSIGNED_to_RETURNED
        excluded_because:
          difficulty_instance: compensating_invariant / return_conserves_garment_assigned_count
          rationale: "The return cross-entity side-effect (Garment ASSIGNED->IN_STOCK and count decrement) is asserted by the named §1.8 invariant instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: emblem_first_setup_then_free_reapply
        claim_type: Correct Result
        grounds:
          - calculations.emblem_setup_charge
          - endpoints[POST /garments/{id}/apply-emblem]
          - entities.Garment.fields.emblem_text
        distinguishing_aspect: "First apply-emblem on a garment (emblem_text null) creates an EMBLEM_SETUP charge of 1500; a second apply-emblem changes text but creates no new charge."
        test_recipe:
          setup: ["One garment, type emblem_setup_cents=1500, no emblem yet."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "EmbCo", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-EM", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 1500 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /garments/${g1}/apply-emblem"
              payload: { emblem_text: "ACME" }
              as: AccountManager
          trigger:
            - call: "POST /garments/${g1}/apply-emblem"
              payload: { emblem_text: "ACME-2" }
              as: AccountManager
          assert:
            - "Garment.${g1}.emblem_text == 'ACME-2'"
            - "count(ServiceCharge where charge_type==EMBLEM_SETUP and account_id==${acct}) == 1"
            - "the single EMBLEM_SETUP charge has amount_cents == 1500"

      - name: damage_light_tier_at_strike_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.loss_damage_fee
          - entities.Garment.fields.soil_strikes
        distinguishing_aspect: "At soil_strikes exactly 2 (LIGHT_STRIKE_THRESHOLD), damage uses MODERATE_DAMAGE_PCT 0.50: floor(8000*0.50)=4000, proving the >= boundary at the threshold."
        test_recipe:
          setup: ["One garment replacement 8000 driven to soil_strikes=2 over two kept-garment visits, then damaged."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "LtCo", service_day: "MON", shortage_grace_units: 0 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-LT", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Lt", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
              captures: { a1: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R-LT", service_day: "MON", driver_user_id: "drv-lt" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v0: $.data.id }
            - call: "POST /service-visits/${v0}/pickup"
              payload: { actual_soil_count: 0 }
              as: RouteDriver
            - call: "POST /service-visits/${v0}/deliver"
              payload: {}
              as: RouteDriver
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 1 }
              as: ProgramAdmin
              captures: { v1: $.data.id }
            - call: "POST /service-visits/${v1}/pickup"
              payload: { actual_soil_count: 0 }
              as: RouteDriver
            - call: "POST /service-visits/${v1}/deliver"
              payload: {}
              as: RouteDriver
          trigger:
            - call: "POST /assignments/${a1}/declare-damage"
              payload: {}
              as: AccountManager
          assert:
            - "Garment.${g1}.soil_strikes == 2"
            - "ServiceCharge DAMAGE on g1 has amount_cents == 4000"

      - name: provisional_variant_selected_at_delivered
        claim_type: Variant Selection
        grounds:
          - calculations.provisional_service_charge
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_finalized_service_charge_on_visit
          rationale: "Provisional-at-DELIVERED vs finalized-at-RECONCILED variant selection is the core assertion of the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: deliver_blocked_while_garment_still_in_soil
        claim_type: Violation -> Error
        grounds:
          - state_machines.ServiceVisit.PICKED_UP_to_DELIVERED
          - errors[ERR_VISIT_GARMENTS_NOT_CLEAN]
        distinguishing_aspect: "Calling deliver while a picked-up garment is still IN_SOIL (never washed) returns ERR_VISIT_GARMENTS_NOT_CLEAN (409)."
        test_recipe:
          setup: ["A visit PICKED_UP with one garment moved IN_SOIL but not washed."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "SoilCo", service_day: "MON", shortage_grace_units: 5 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-SL", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
