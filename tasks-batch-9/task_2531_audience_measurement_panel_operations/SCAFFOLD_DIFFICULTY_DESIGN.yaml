# ==========================================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: Audience Measurement Panel Operations  (task 2531)
#
# Every instance grounds in SCAFFOLD.yaml SS1.1-SS1.7 only. Deleting this file leaves the
# declared behaviour identical; it only makes coverage harder to audit.
#
# Fixture conventions used by every chain below:
#   * The logical clock starts at 2026-08-01T00:00:00Z (the fixed startup default declared on
#     POST /_clock/set_current_utc). Chains that need a later instant move it forward with an
#     explicit POST /_clock/set_current_utc; the clock is monotonic so it is never rewound.
#   * Market.version bumps on POST /markets/{id}/budget-adjustments, POST /markets/{id}/quota-cells,
#     POST /universe-estimates and POST /processing-runs. Every OCC payload therefore reads the
#     version back through GET /markets/{market_id} immediately before the write, per contract 3c.
#   * X-User-ID values are pinned as literals wherever segregation of duties (validation
#     priority 44) is in play, and as ${client_id} for the entity_backed ClientUser role.
# ==========================================================================================
scaffold_difficulty_design:

  # ----------------------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: design_vs_final_weighting_diverge_on_one_edited_run
        grounds:
          - calculations.household_base_weight
          - calculations.weight_cap_redistribution
          - calculations.projected_average_audience
          - state_machines.ProcessingRun.WEIGHTED_to_WEIGHTED
          - entities.HouseholdWeight.fields.base_weight
          - entities.ProcessingRun.fields.projected_average_audience
          - entities.ProcessingRun.fields.total_weight_mass
          - validations[priority=39]
        distinguishing_aspect: |
          The dual variant lives on the projection domain (ProcessingRun / HouseholdWeight): the
          same edited window re-weighted FINAL then DESIGN yields projected_average_audience 69722
          then 55139 and total_weight_mass 200000.0000 then 140000.0000, because DESIGN divides the
          cell population by every non-retired recruit (2 in cell A) while FINAL divides it by the
          contributing in-tab households only (1 in cell A).
        test_recipe:
          setup:
            - "Market DMA-501 with two quota cells: cell A (target 3, base incentive 2000) and cell B (target 1, base incentive 3000)."
            - "Published universe vintage 2026Q3 with cell populations A=120000 and B=80000 households."
            - "Published edit rule set: ascription window 60, invalid-tuning ceiling 900, outlier household cap 1200, outlier weight ratio cap 2.5, fault threshold 1440."
            - "Household h1 ACTIVE in cell A and household h2 ACTIVE in cell B, each with one installed HEALTHY TV_TUNER."
            - "Household h3 recruited into cell A and left in RECRUITED - no meter, no enumeration - so it counts for DESIGN but not for FINAL."
            - "Clock at 2026-08-11T00:00:00Z. One in-home tuning interval per active household on 2026-08-10: h1 350 minutes, h2 730 minutes."
            - "Run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) (window_minutes 1440) already edited, so both intervals are EDITED with usable_minutes 350 and 730 and contributing_household_count is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PanelOperationsManager
            - call: "POST /markets"
              payload: { name: "Metro Alpha", market_code: "DMA-501", dma_rank: 1, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m1_id: "$.data.id" }
            - call: "POST /markets/${m1_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 3, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_a_id: "$.data.id" }
            - call: "POST /markets/${m1_id}/quota-cells"
              payload: { age_band: "P35_54", income_band: "HIGH", geo_zone: "SUBURBAN", target_households: 1, base_incentive_cents: 3000 }
              as: PanelOperationsManager
              captures: { cell_b_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs1_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs1_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m1_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m1_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m1_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${cell_a_id}", population_households: 120000, population_persons: 300000 }, { quota_cell_id: "${cell_b_id}", population_households: 80000, population_persons: 160000 }], expected_market_version: "${m1_v_before_universe}" }
              as: MethodologyStatistician
              captures: { ue1_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue1_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
              payload: { market_id: "${m1_id}", quota_cell_id: "${cell_a_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h1_id}", meter_type: "TV_TUNER", serial_no: "MT-000001" }
              as: FieldTechnician
              captures: { mt1_id: "$.data.id" }
            - call: "POST /meters/${mt1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /households"
              payload: { market_id: "${m1_id}", quota_cell_id: "${cell_b_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 3 }
              as: PanelOperationsManager
              captures: { h2_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${h2_id}", meter_type: "TV_TUNER", serial_no: "MT-000002" }
              as: FieldTechnician
              captures: { mt2_id: "$.data.id" }
            - call: "POST /meters/${mt2_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h2_id}/enumerations"
              payload: { roster_persons_count: 3, tv_sets_count: 2 }
              as: FieldTechnician
            - call: "POST /households"
              payload: { market_id: "${m1_id}", quota_cell_id: "${cell_a_id}", recruitment_source: "RDD_PHONE", persons_count: 1 }
              as: PanelOperationsManager
              captures: { h3_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
              captures: { t1_id: "$.data.id" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt2_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T06:00:00Z", end_iso: "2026-08-10T18:10:00Z", station_code: "WXYZ", tuning_minutes: 730 }
              as: MethodologyStatistician
              captures: { t2_id: "$.data.id" }
            - call: "GET /markets/${m1_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m1_v_before_run: "$.data.version" }
            - call: "POST /processing-runs"
              payload: { market_id: "${m1_id}", universe_estimate_id: "${ue1_id}", edit_rule_set_id: "${rs1_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m1_v_before_run}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-1"
              captures: { run1_id: "$.data.id" }
            - call: "POST /processing-runs/${run1_id}/edit"
              payload: {}
              as: MethodologyStatistician
          trigger:
            - call: "POST /processing-runs/${run1_id}/weight"
              payload: { weight_variant: "FINAL" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-1"
              captures: { final_projected: "$.data.projected_average_audience", final_mass: "$.data.total_weight_mass" }
            - call: "POST /processing-runs/${run1_id}/weight"
              payload: { weight_variant: "DESIGN" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-1"
              captures: { design_projected: "$.data.projected_average_audience", design_mass: "$.data.total_weight_mass" }
          assert:
            - "After the FINAL pass: ProcessingRun.${run1_id}.weight_variant == FINAL"
            - "After the FINAL pass: ProcessingRun.${run1_id}.contributing_household_count == 2"
            - "After the FINAL pass: HouseholdWeight for (${run1_id}, ${h1_id}).base_weight == 120000.0000 and .adjusted_weight == 120000.0000 and .capped == false and .usable_minutes == 350 and .contribution == 29166.67"
            - "After the FINAL pass: HouseholdWeight for (${run1_id}, ${h2_id}).base_weight == 80000.0000 and .adjusted_weight == 80000.0000 and .capped == false and .usable_minutes == 730 and .contribution == 40555.56"
            - "After the FINAL pass: ProcessingRun.${run1_id}.total_weight_mass == 200000.0000"
            - "After the FINAL pass: ProcessingRun.${run1_id}.projected_average_audience == 69722"
            - "After the DESIGN pass: ProcessingRun.${run1_id}.weight_variant == DESIGN and state == WEIGHTED"
            - "After the DESIGN pass: exactly 2 HouseholdWeight rows exist for ${run1_id} - the FINAL rows were deleted, not appended to"
            - "After the DESIGN pass: HouseholdWeight for (${run1_id}, ${h1_id}).base_weight == 60000.0000 and .contribution == 14583.33 - h3 in RECRUITED raised the cell A denominator from 1 to 2"
            - "After the DESIGN pass: HouseholdWeight for (${run1_id}, ${h2_id}).base_weight == 80000.0000 and .contribution == 40555.56 - cell B denominator is 1 under both variants"
            - "After the DESIGN pass: ProcessingRun.${run1_id}.total_weight_mass == 140000.0000"
            - "After the DESIGN pass: ProcessingRun.${run1_id}.projected_average_audience == 55139"
            - "${final_projected} == 69722 and ${design_projected} == 55139, so the two variants differ by exactly 14583 projected households"
            - "Household.${h3_id}.status == RECRUITED and no HouseholdWeight row exists for (${run1_id}, ${h3_id}) under either variant"

      - name: compliance_rolling_30_vs_run_scoped_diverge_for_one_household
        grounds:
          - calculations.household_compliance_rate
          - entities.Household.fields.compliance_rate_rolling_30
          - entities.HouseholdWeight.fields.run_compliance_rate
          - entities.TuningInterval.fields.state
          - endpoints[POST /tuning-intervals]
        distinguishing_aspect: |
          The dual variant lives on the panel-health domain (Household / HouseholdWeight compliance),
          not on the projection domain: one household with a 10-minute day on 2026-08-09 and a
          350-minute day on 2026-08-10 scores compliance_rate_rolling_30 == 0.5000 (denominator = the
          2 REPORTED days in the rolling window, RAW data included) while the same household scores
          run_compliance_rate == 1.0000 on a run whose window is only 2026-08-10 (denominator = the 1
          calendar day of the window, EDITED data only).
        test_recipe:
          setup:
            - "Market DMA-502 with one quota cell (target 1, base incentive 2000) and a published 2026Q3 universe of 120000 households for that cell."
            - "Published edit rule set with invalid-tuning ceiling 900, ascription window 60, outlier household cap 1200, outlier weight ratio cap 2.5, fault threshold 1440."
            - "Household h1 ACTIVE with one installed HEALTHY TV_TUNER."
            - "Clock at 2026-08-11T00:00:00Z. Two ingested intervals for that meter: 10 minutes on 2026-08-09 and 350 minutes on 2026-08-10."
            - "A run over [2026-08-10T00:00:00Z, 2026-08-11T00:00:00Z) so only the 350-minute record falls inside the window; the 10-minute record stays RAW."
            - "POST /processing-runs/{id}/detect-faults is deliberately NOT called, so the stored ROLLING_30 snapshot is the one written by the last ingest."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Beta", market_code: "DMA-502", dma_rank: 2, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m2_id: "$.data.id" }
            - call: "POST /markets/${m2_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 1, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { cell_c_id: "$.data.id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs2_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs2_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "GET /markets/${m2_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m2_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
              payload: { market_id: "${m2_id}", vintage_label: "2026Q3", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", cell_populations: [{ quota_cell_id: "${cell_c_id}", population_households: 120000, population_persons: 300000 }], expected_market_version: "${m2_v_before_universe}" }
              as: MethodologyStatistician
              captures: { ue2_id: "$.data.id" }
            - call: "POST /universe-estimates/${ue2_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /households"
              payload: { market_id: "${m2_id}", quota_cell_id: "${cell_c_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hb1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hb1_id}", meter_type: "TV_TUNER", serial_no: "MT-000101" }
              as: FieldTechnician
              captures: { mtb1_id: "$.data.id" }
            - call: "POST /meters/${mtb1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hb1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtb1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
              captures: { tb_in_window_id: "$.data.id" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtb1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-09T20:00:00Z", end_iso: "2026-08-09T20:10:00Z", station_code: "WXYZ", tuning_minutes: 10 }
              as: MethodologyStatistician
              captures: { tb_out_window_id: "$.data.id" }
            - call: "GET /markets/${m2_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m2_v_before_run: "$.data.version" }
            - call: "POST /processing-runs"
              payload: { market_id: "${m2_id}", universe_estimate_id: "${ue2_id}", edit_rule_set_id: "${rs2_id}", window_start_iso: "2026-08-10T00:00:00Z", window_end_iso: "2026-08-11T00:00:00Z", expected_market_version: "${m2_v_before_run}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-2"
              captures: { runb_id: "$.data.id" }
            - call: "POST /processing-runs/${runb_id}/edit"
              payload: {}
              as: MethodologyStatistician
          trigger:
            - call: "POST /processing-runs/${runb_id}/weight"
              payload: { weight_variant: "FINAL" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-2"
            - call: "GET /households/${hb1_id}"
              payload: {}
              as: PanelOperationsManager
              captures: { rolling_rate: "$.data.compliance_rate_rolling_30" }
            - call: "GET /household-weights"
              payload: { processing_run_id: "${runb_id}", household_id: "${hb1_id}" }
              as: MethodologyStatistician
              captures: { scoped_rate: "$.data[0].run_compliance_rate" }
          assert:
            - "${rolling_rate} == 0.5000 - 1 compliant day out of the 2 days the household actually reported inside [2026-07-12T00:00:00Z, 2026-08-11T00:00:00Z)"
            - "${scoped_rate} == 1.0000 - 1 compliant day out of the 1 calendar day of the run window"
            - "Household.${hb1_id}.compliance_rate_rolling_30 == 0.5000 is unchanged by the weighting pass - only HouseholdWeight.run_compliance_rate is written there"
            - "TuningInterval.${tb_out_window_id}.state == RAW and .processing_run_id == null - it sits outside the run window and is still counted by the ROLLING_30 denominator"
            - "TuningInterval.${tb_in_window_id}.state == EDITED and .usable_minutes == 350 and .processing_run_id == ${runb_id}"
            - "HouseholdWeight for (${runb_id}, ${hb1_id}).base_weight == 120000.0000 and .usable_minutes == 350 and .contribution == 29166.67"
            - "ProcessingRun.${runb_id}.projected_average_audience == 29167 and .total_weight_mass == 120000.0000"

  # ----------------------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: incentive_accrual_component_rounding_order_mode_b
        grounds:
          - calculations.incentive_accrual_cents
          - entities.Household.fields.incentive_accrued_cents
          - entities.Household.fields.accrual_periods
          - entities.Market.fields.incentive_budget_committed_cents
          - entities.QuotaCell.fields.effective_incentive_multiplier
          - endpoints[POST /households/{household_id}/accrue-incentive]
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the cents: rounding the compliance bonus and
          the out-of-home supplement OFF the already-rounded tenure_amount and then summing the three
          rounded components gives 3225 + 276 + 131 == 3604 + 28 == 3632 cents, whereas summing the
          unrounded components (3225 + 275.7375 + 130.6125 == 3631.35) and rounding once gives 3631;
          the scaffold pins the per-component order so 3632 is the only correct answer.
        test_recipe:
          setup:
            - "Market DMA-503 with incentive budget 1000000 cents and one quota cell (target 1, base incentive 3000)."
            - "Household h1 ACTIVE in that cell, so the cell is FILLED, incentive_boost_active is false and effective_incentive_multiplier is 1.00."
            - "The household holds an installed TV_TUNER and an installed PORTABLE_OOH meter, both HEALTHY, so the out-of-home supplement applies and the fault penalty does not."
            - "One 350-minute in-home interval reported on 2026-08-10 and ingested at clock 2026-08-11T00:00:00Z, which stores compliance_rate_rolling_30 == 1.0000 (1 compliant day out of the 1 reported day)."
            - "Clock advanced to 2027-02-15T00:00:00Z, which is 198 whole days after recruited_at, i.e. floor(198/30) == 6 tenure months, so the tenure multiplier is 1.075."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Gamma", market_code: "DMA-503", dma_rank: 3, incentive_budget_cents: 1000000 }
              as: PanelOperationsManager
              captures: { m3_id: "$.data.id" }
            - call: "POST /markets/${m3_id}/quota-cells"
              payload: { age_band: "P35_54", income_band: "HIGH", geo_zone: "SUBURBAN", target_households: 1, base_incentive_cents: 3000 }
              as: PanelOperationsManager
              captures: { cell_d_id: "$.data.id" }
            - call: "POST /households"
              payload: { market_id: "${m3_id}", quota_cell_id: "${cell_d_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { hc1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hc1_id}", meter_type: "TV_TUNER", serial_no: "MT-000201" }
              as: FieldTechnician
              captures: { mtc1_id: "$.data.id" }
            - call: "POST /meters"
              payload: { household_id: "${hc1_id}", meter_type: "PORTABLE_OOH", serial_no: "MT-000202" }
              as: FieldTechnician
              captures: { mtc2_id: "$.data.id" }
            - call: "POST /meters/${mtc1_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /meters/${mtc2_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${hc1_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mtc1_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-10T18:00:00Z", end_iso: "2026-08-10T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-15T00:00:00Z" }
              as: PanelOperationsManager
          trigger:
            - call: "POST /households/${hc1_id}/accrue-incentive"
              payload: { period_label: "2027-02" }
              as: PanelOperationsManager
              captures: { accrued_total: "$.data.incentive_accrued_cents" }
          assert:
            - "QuotaCell.${cell_d_id}.quota_status == FILLED and .effective_incentive_multiplier == 1.00, so cell_base == 3000"
            - "Household.${hc1_id}.compliance_rate_rolling_30 == 1.0000, which clears the 0.90 bonus threshold"
            - "${accrued_total} == 3632 - tenure_amount 3225 + bonus 276 + ooh 131, each rounded before the sum"
            - "Household.${hc1_id}.incentive_accrued_cents == 3632 and NOT 3631 (the sum-then-round answer)"
            - "Household.${hc1_id}.accrual_periods contains exactly one entry with period_label 2027-02, accrued_cents 3632 and reversed false"
            - "Market.${m3_id}.incentive_budget_committed_cents == 3632"
            - "Market.${m3_id}.incentive_budget_reserved_cents == 0 - the boost reservation was released when the cell filled"

      - name: deliverable_billing_penalty_bracket_keyed_on_gross_mode_c
        grounds:
          - calculations.deliverable_billing
          - entities.ClientDeliverable.fields.gross_cents
          - entities.ClientDeliverable.fields.discount_cents
          - entities.ClientDeliverable.fields.late_penalty_cents
          - entities.ClientDeliverable.fields.total_cents
          - entities.Client.fields.delivery_sla_credit_cents
          - state_machines.ClientDeliverable.SCHEDULED_to_DELIVERED
          - endpoints[POST /client-deliverables/{client_deliverable_id}/dispatch]
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order the scaffold pins: the
          lateness penalty rate looks like it should key on the discounted net, but both bracket
          lookups key on gross_cents, so a 155000-cent gross that discounts to a 131750-cent net
          still pays the 0.025 rate and totals 124000 cents rather than the 127100 cents the
          net-keyed reading would produce.
        test_recipe:
          setup:
