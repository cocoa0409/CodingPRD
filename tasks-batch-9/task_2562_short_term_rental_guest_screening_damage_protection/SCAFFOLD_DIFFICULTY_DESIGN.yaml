            - call: "GET /rentals/reservations/${r1}"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { r1v: $.data.version }
            - call: "POST /rentals/damage-claims"
              payload: { reservation_id: "${r1}", claimed_amount_cents: 60000, description: "Scorched countertop and cracked tiles." , expected_reservation_version: "${r1v}" }
              as: Host
              as_user_id: "${h1}"
              captures: { c1: $.data.id }
            - call: "POST /rentals/claim-evidence"
