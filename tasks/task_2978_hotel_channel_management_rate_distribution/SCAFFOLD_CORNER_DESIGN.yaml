              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "GEOCH", channel_kind: "DIRECT_BRAND", commission_bp: 0, geo_market_codes: ["US-CA"] }
              as: PlatformAdmin
              captures: { geo_ch_id: $.data.id }
            - call: "POST /distribution/channels/${geo_ch_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://geoch.example.com/ari" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "ANYCH", channel_kind: "DIRECT_BRAND", commission_bp: 0 }
              as: PlatformAdmin
              captures: { any_ch_id: $.data.id }
            - call: "POST /distribution/channels/${any_ch_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://anych.example.com/ari" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${geo_ch_id}", room_type_id: "${king_id}", external_rate_code: "BAR-GEOCH-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { geo_map_id: $.data.id }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${any_ch_id}", room_type_id: "${king_id}", external_rate_code: "BAR-ANYCH-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { any_map_id: $.data.id }
          trigger:
            - call: "GET /distribution/channel-mappings/${geo_map_id}/quoted-rate"
              payload: { stay_date: "2026-09-10", geo_market_code: "US-NY" }
              as: RevenueManager
            - call: "GET /distribution/channel-mappings/${geo_map_id}/quoted-rate"
              payload: { stay_date: "2026-09-10", geo_market_code: "US-CA" }
              as: RevenueManager
            - call: "GET /distribution/channel-mappings/${any_map_id}/quoted-rate"
              payload: { stay_date: "2026-09-10", geo_market_code: "US-NY" }
              as: RevenueManager
          assert:
            - "GEOCH with US-NY: HTTP 422 with data.error_id == ERR_GEO_MARKET_NOT_SERVED"
            - "GEOCH with US-CA: HTTP 200 with sell_amount_cents 25000 and applied_promotion_codes == [] - no promotion exists, so the market code only gates access"
            - "ANYCH with US-NY: HTTP 200 with sell_amount_cents 25000 - an empty geo_market_codes list serves every market"
            - "The two 200 responses are byte-identical in their amount fields, so the only difference between the refusal and the success is the channel's configured market list"

      - name: horizon_check_bounds_the_arrival_strictly_after_today_and_the_departure_at_the_edge
