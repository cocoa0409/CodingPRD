# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Campground & RV Park Reservation (private) — Expert
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_park_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - endpoints.POST_/parks
          - entities.Park.fields.deposit_pct
          - entities.Park.fields.quiet_hours_start
        distinguishing_aspect: "POST /parks with only name -> 201; deposit_pct defaults 0.30, tax_rate 0.08, check_in_time 15:00, quiet_hours_start 22:00, long_stay_nights_threshold 28."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { name: "Pinewood" }
              as: Operator
              captures: { park_id: $.data.id, dep: $.data.deposit_pct, qhs: $.data.quiet_hours_start }
          assert:
            - "HTTP status == 201"
            - "Park.${park_id}.deposit_pct == 0.30"
            - "Park.${park_id}.tax_rate == 0.08"
            - "Park.${park_id}.check_in_time == 15:00"
            - "Park.${park_id}.quiet_hours_start == 22:00"
            - "Park.${park_id}.long_stay_nights_threshold == 28"
            - "Park.${park_id}.version == 1"

      - name: create_park_missing_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/parks
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /parks without name -> ERR_INVALID_REQUEST (422); name has source:input and no default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { timezone: "America/Denver" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: get_reservation_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/reservations/{reservation_id}
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /reservations/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: reservation_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Reservation.fields.reservation_status
          - entities.Reservation.fields.payment_status
          - endpoints.POST_/sites/{site_id}/reservations
        distinguishing_aspect: "POST reservation: server sets reservation_status=REQUESTED, payment_status=UNPAID, id/created_at/version regardless of input; status fields are not accepted from the body."
        test_recipe:
          setup: ["RV Site S; Guest G; clock 2026-07-01."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, v: $.data.version }
          assert:
            - "Reservation.${res_id}.reservation_status == REQUESTED"
            - "Reservation.${res_id}.payment_status == UNPAID"
            - "Reservation.${res_id}.version == 1"

      - name: payment_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Payment
          - endpoints.POST_/reservations/{reservation_id}/payments
        distinguishing_aspect: "Payment has common_fields:false — it carries only id and created_at, no version, no update endpoint; it is an append-only ledger row."
        test_recipe:
          setup: ["Reservation R with deposit_due known; deposit recorded."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
          trigger:
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { pay_id: $.data.id, pay_created: $.data.created_at }
          assert:
            - "HTTP status == 201"
            - "Payment.${pay_id}.type == DEPOSIT"
            - "Payment response has id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_already_confirmed_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Reservation.reservation_status.REQUESTED_to_CONFIRMED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming an already-CONFIRMED reservation a second time -> ERR_INVALID_STATE (409); the REQUESTED->CONFIRMED transition is undefined from CONFIRMED."
        test_recipe:
          setup: ["Reservation R CONFIRMED (deposit paid)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, dep_due: $.data.deposit_due_cents }
            - call: "POST /reservations/${res_id}/payments"
              payload: { type: "DEPOSIT", amount_cents: "${dep_due}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: check_in_from_requested_without_confirm_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.reservation_status.CONFIRMED_to_CHECKED_IN
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Check-in from REQUESTED (skipping confirm) -> ERR_INVALID_STATE (409); CHECKED_IN is only reachable from CONFIRMED."
        test_recipe:
          setup: ["Reservation R REQUESTED (no confirm)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-08-02T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: terminal_cancelled_reservation_cannot_confirm
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Reservation.reservation_status.REQUESTED_to_CANCELLED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCELLED is terminal — confirm on a CANCELLED reservation -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Reservation R CANCELLED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/cancellation-policies"
              payload: { full_refund_min_days: 14, half_refund_min_days: 7 }
              as: Operator
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: retired_site_rejects_new_reservation
        claim_type: guarded transitions
        grounds:
          - state_machines.Site.status.ACTIVE_to_RETIRED
          - validations[priority=9]
          - errors[ERR_SITE_UNAVAILABLE]
        distinguishing_aspect: "Creating a reservation on a RETIRED site -> ERR_SITE_UNAVAILABLE (409)."
        test_recipe:
          setup: ["RV Site S RETIRED (no live reservations)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/retire"
              payload: { expected_site_version: "${site_v0}" }
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_SITE_UNAVAILABLE"

      - name: cleared_maintenance_hold_no_longer_blocks_reservation
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MaintenanceHold.status.ACTIVE_to_CLEARED
          - validations[priority=10]
          - entities.MaintenanceHold.fields.status
        distinguishing_aspect: "After clearing a maintenance hold, a reservation overlapping its former (buffered) window is accepted (201) — the CLEARED hold no longer blocks."
        test_recipe:
          setup: ["RV Site S buffer 0 with an ACTIVE hold 2026-08-10..2026-08-12, then CLEARED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30, turnover_buffer_days: 0 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /sites/${site_id}/maintenance-holds"
              payload: { start_date: "2026-08-10", end_date: "2026-08-12", reason: "repair", expected_site_version: "${site_v0}" }
              as: Operator
              captures: { hold_id: $.data.id }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /maintenance-holds/${hold_id}/clear"
              payload: {}
              as: Operator
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Operator
              captures: { site_v1: $.data.version }
          trigger:
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-10", check_out_date: "2026-08-12", expected_site_version: "${site_v1}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Reservation.${res_id}.reservation_status == REQUESTED"

      - name: corner_site_cycle_covered_by_difficulty
        claim_type: cyclic
        grounds:
          - state_machines.Site.status.ACTIVE_to_MAINTENANCE
          - state_machines.Site.status.MAINTENANCE_to_ACTIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / site_cyclic_active_maintenance_active
          rationale: "The ACTIVE<->MAINTENANCE cycle is exercised by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: addon_recompute_changes_total_and_tax
        claim_type: Correct Result
        grounds:
          - calculations.reservation_total
          - entities.Reservation.fields.addon_total_cents
          - entities.AddOn.fields.amount_cents
        distinguishing_aspect: "Adding a taxable PET_FEE of 2000 to a 10-night RV reservation (stay 45000, no season) sets addon_total_cents=2000, pre_discount_subtotal=47000, taxable_base=47000, tax=round_half_up(47000*0.08)=3760, total_due=50760."
        test_recipe:
          setup: ["RV Reservation R REQUESTED, 10 nights, no season, guest tier 0."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/add-ons"
              payload: { kind: "PET_FEE", amount_cents: 2000, taxable: true }
              as: Guest
              as_user_id: "${g_id}"
              captures: { addon_id: $.data.id }
          assert:
            - "Reservation.${res_id}.addon_total_cents == 2000"
            - "Reservation.${res_id}.tax_cents == 3760"
            - "Reservation.${res_id}.total_due_cents == 50760"

      - name: nontaxable_addon_excluded_from_taxable_base
        claim_type: Input Set Filtering
        grounds:
          - calculations.reservation_total
          - entities.AddOn.fields.taxable
        distinguishing_aspect: "A non-taxable add-on of 2000 raises total via subtotal but not via tax: pre_discount_subtotal=47000, taxable_base=45000 (add-on excluded), tax=round_half_up(45000*0.08)=3600, total_due=50600."
        test_recipe:
          setup: ["RV Reservation R REQUESTED, 10 nights, no season, guest tier 0."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: Operator
            - call: "POST /parks"
              payload: { name: "Pinewood", deposit_pct: 0.30, tax_rate: 0.08 }
              as: Operator
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/rate-plans"
              payload: { site_type: "RV", nightly_rate_cents: 5000, weekly_rate_cents: 30000, monthly_rate_cents: 100000 }
              as: Operator
              captures: { rp_id: $.data.id }
            - call: "POST /parks/${park_id}/sites"
              payload: { rate_plan_id: "${rp_id}", label: "A-1", site_type: "RV", hookup_level: "FULL", max_length_of_stay_nights: 30 }
              as: Operator
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /guests"
              payload: { email: "g1@x.com", full_name: "Guest One" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /sites/${site_id}/reservations"
              payload: { guest_id: "${g_id}", check_in_date: "2026-08-01", check_out_date: "2026-08-11", expected_site_version: "${site_v0}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/add-ons"
              payload: { kind: "EXTRA_VEHICLE", amount_cents: 2000, taxable: false }
              as: Guest
              as_user_id: "${g_id}"
