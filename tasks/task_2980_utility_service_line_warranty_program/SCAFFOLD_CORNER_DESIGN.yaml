            - "${pending_total_after} == 0  # nothing lingers in the pre-batch status"
            - "${claim_status_at_create} == TRIAGE and ${claim_list_total} == 1 and ${claim_list_first} == ${claim_id} and ${claim_list_status} == TRIAGE  # a row created after the batch is immediately visible to the filtered read"
