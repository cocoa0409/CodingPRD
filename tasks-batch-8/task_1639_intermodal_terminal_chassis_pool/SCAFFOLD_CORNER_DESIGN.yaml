# =============================================================================
# §1.9 Scaffold Corner Design — task_1639_intermodal_terminal_chassis_pool
# Breadth coverage of every §1.1–§1.7 testable claim not already covered in §1.8.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: terminal_creation_applies_defaults_and_computed_fields
        claim_type: creation
        grounds:
          - "entities.Terminal"
        distinguishing_aspect: |
          POST /terminals with valid input returns 201 + computed fields populated:
          yard_slots_in_use=0, yard_slots_free=yard_slot_count, posture=OPEN,
          ops_run_index=0, version=1.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
          trigger:
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {free: $.data.yard_slots_free, posture: $.data.posture, in_use: $.data.yard_slots_in_use, ops_idx: $.data.ops_run_index}
          assert:
            - "Terminal.${tid}.yard_slots_in_use == 0"
            - "Terminal.${tid}.yard_slots_free == 20"
            - "Terminal.${tid}.posture == OPEN"
            - "Terminal.${tid}.ops_run_index == 0"

      - name: terminal_get_not_found
        claim_type: not_found
        grounds:
          - "entities.Terminal"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /terminals/{tid} with non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /terminals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: TerminalManager
              captures: {err: $.data.error_id}
          assert:
            - "$.data.error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: chassis_creation_defaults_roadable
        claim_type: defaults
        grounds:
          - "entities.Chassis"
        distinguishing_aspect: |
          POST /chassis creates with status=AVAILABLE and roadability_status=ROADABLE
          by default; pool counts incremented.
        test_recipe:
          setup: ["Terminal + Pool exist"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch_status: $.data.status, ch_road: $.data.roadability_status}
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {pool_avail: $.data.available_chassis_count, pool_total: $.data.total_chassis_count}
          assert:
            - "Chassis.status == AVAILABLE"
            - "Chassis.roadability_status == ROADABLE"
            - "ChassisPool.available_chassis_count == 1"
            - "ChassisPool.total_chassis_count == 1"

      - name: container_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Container"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /containers missing container_number returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Terminal + Train ARRIVED"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/containers"
              payload: { iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {err: $.data.error_id}
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: container_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Container"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /containers with iso_type='60FT' (not in enum) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Terminal + Train exist"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "60FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {err: $.data.error_id}
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: yard_slot_list_pagination
        claim_type: listing
        grounds:
          - "entities.YardSlot"
          - "response_envelope"
        distinguishing_aspect: "GET /terminals/{tid}/slots returns paginated list with total_count and has_more."
        test_recipe:
          setup: ["Terminal with 3 slots"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 5 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-02-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-03-1", row: "A", tier_max: 3 }
              as: YardPlanner
          trigger:
            - call: "GET /terminals/${tid}/slots"
              payload: {}
              as: YardPlanner
          assert:
            - "$.response_type == 'array'"
            - "$.meta has api_request_id and api_request_timestamp"
            - "length($.data) == 3"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: chassis_initial_state_available
        claim_type: initial_state
        grounds:
          - "state_machines.Chassis"
        distinguishing_aspect: "Newly created Chassis starts in AVAILABLE with roadability_status=ROADABLE."
        test_recipe:
          setup: ["Terminal + Pool"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch_status: $.data.status}
          assert:
            - "Chassis.status == AVAILABLE"

      - name: chassis_invalid_transition_from_retired_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Chassis"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "RETIRED is terminal; POST /reserve on RETIRED chassis returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Chassis CH1 retired"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch1}/retire"
              payload: {}
              as: TerminalManager
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {p_v: $.data.version}
          trigger:
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch1}/reserve"
              payload: { appointment_id: "00000000-0000-0000-0000-000000000000", expected_pool_version: "${p_v}" }
              as: GateSupervisor
              captures: {err: $.data.error_id}
          assert:
            - "$.data.error_id == ERR_INVALID_STATE (or ERR_NOT_FOUND — the appointment doesn't exist; existence priority 3 fires before state priority 5)"
            - "HTTP status IN (404, 409)"

      - name: train_terminal_lockdown_departed
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Train"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Train in DEPARTED is terminal; POST /mark_arrived returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Train DEPARTED"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/trains/${trid}/begin_loading"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/trains/${trid}/mark_departed"
              payload: {}
              as: RailCoordinator
          trigger:
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
              captures: {err: $.data.error_id}
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: appointment_no_show_transition_at_run_ops
        claim_type: valid_transition
        grounds:
          - "state_machines.GateAppointment"
        distinguishing_aspect: "BOOKED appointment with window_end_utc < current clock auto-transitions to NO_SHOW at run_ops."
        test_recipe:
          setup:
            - "Terminal, Carrier, Container grounded, OUT appointment BOOKED with window [2026-08-02T09:00:00Z, 2026-08-02T11:00:00Z]"
            - "Server clock at 2026-08-02T12:00:00Z (after window_end)"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car: $.data.id}
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car}", container_id: "${cid}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: TerminalManager
          trigger:
            - call: "POST /terminals/${tid}/run_ops"
              payload: {}
              as: TerminalManager
            - call: "GET /terminals/${tid}/appointments/${appt}"
              payload: {}
              as: GateClerk
              captures: {appt_status: $.data.status}
          assert:
            - "GateAppointment.${appt}.status == NO_SHOW"

      - name: damage_waive_from_open
        claim_type: valid_transition
        grounds:
          - "state_machines.DamageInspection"
        distinguishing_aspect: "DamageInspection OPEN -> WAIVED via TerminalManager waive endpoint."
        test_recipe:
          setup: ["Terminal, Pool, Chassis, Carrier, Container grounded, Transaction completed (out-gate), DamageInspection OPEN"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car}" }
              as: PoolAdministrator
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: TerminalManager
            - call: "POST /terminals/${tid}/appointments"
              payload: { carrier_id: "${car}", container_id: "${cid}", direction: "OUT", window_start_utc: "2026-08-02T09:00:00Z", window_end_utc: "2026-08-02T11:00:00Z" }
              as: GateSupervisor
              captures: {appt: $.data.id}
            - call: "POST /terminals/${tid}/appointments/${appt}/check_in"
              payload: { driver_id: "DRV-A" }
              as: GateClerk
            - call: "GET /terminals/${tid}/pools/${pid}"
              payload: {}
              as: PoolAdministrator
              captures: {p_v: $.data.version}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis/${ch1}/reserve"
              payload: { appointment_id: "${appt}", expected_pool_version: "${p_v}" }
              as: GateSupervisor
            - call: "POST /terminals/${tid}/transactions"
              payload: { appointment_id: "${appt}", driver_id: "DRV-A", gate_lane: "L1", chassis_id: "${ch1}" }
              as: GateClerk
              captures: {tx: $.data.id}
            - call: "POST /terminals/${tid}/damage"
              payload: { gate_transaction_id: "${tx}", chassis_id: "${ch1}", damage_kind: "TIRE", severity: "MINOR", repair_cost_cents: 5000 }
              as: GateClerk
              captures: {did: $.data.id}
          trigger:
            - call: "POST /terminals/${tid}/damage/${did}/waive"
              payload: {}
              as: TerminalManager
              captures: {d_status: $.data.status}
          assert:
            - "DamageInspection.${did}.status == WAIVED"

      - name: container_terminal_voided_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Container"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Container in VOIDED state rejects ground with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Container voided"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/trains"
              payload: { train_symbol: "Z-ALTCHI", scheduled_departure_utc: "2026-08-10T12:00:00Z" }
              as: RailCoordinator
              captures: {trid: $.data.id}
            - call: "POST /terminals/${tid}/trains/${trid}/mark_arrived"
              payload: {}
              as: RailCoordinator
            - call: "POST /terminals/${tid}/containers"
              payload: { container_number: "BMOU1234567", iso_type: "40FT", planned_train_id: "${trid}" }
              as: RailCoordinator
              captures: {cid: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v: $.data.version}
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v}" }
              as: YardPlanner
            - call: "POST /terminals/${tid}/containers/${cid}/void"
              payload: {}
              as: TerminalManager
            - call: "GET /terminals/${tid}"
              payload: {}
              as: TerminalManager
              captures: {t_v2: $.data.version}
          trigger:
            - call: "POST /terminals/${tid}/containers/${cid}/ground"
              payload: { expected_terminal_version: "${t_v2}" }
              as: YardPlanner
              captures: {err: $.data.error_id}
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: driver_turn_minutes_ceil_boundary
        claim_type: correct_result
        grounds:
          - "calculations.driver_turn_minutes"
        distinguishing_aspect: |
          driver_turn_minutes uses ceil on seconds/60. checked_in at T0, completed at T0+3600s = exactly 60 minutes (not 61).
        test_recipe:
          setup: ["Terminal, Pool, Chassis, Carrier, Container grounded; OUT appointment checked in at 2026-08-02T10:00:00Z; chassis reserved; transaction pending"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { terminal_code: "BNSF-LA", rail_cutoff_minutes_before_departure: 60, gate_free_hours: 48, per_diem_rate_cents: 15000, storage_rate_cents: 8000, flip_fee_cents: 5000, max_stack_height: 3, yard_slot_count: 20 }
              as: TerminalManager
              captures: {tid: $.data.id}
            - call: "POST /terminals/${tid}/slots"
              payload: { slot_code: "A-01-1", row: "A", tier_max: 3 }
              as: YardPlanner
            - call: "POST /terminals/${tid}/pools"
              payload: { pool_code: "UP-POOL-A" }
              as: PoolAdministrator
              captures: {pid: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/chassis"
              payload: { chassis_number: "CH-001" }
              as: PoolAdministrator
              captures: {ch1: $.data.id}
            - call: "POST /carriers"
              payload: { scac_code: "CARA", carrier_name: "Carrier A", billing_credit_limit_cents: 1000000 }
              as: TerminalManager
              captures: {car: $.data.id}
            - call: "POST /terminals/${tid}/pools/${pid}/memberships"
              payload: { carrier_id: "${car}" }
              as: PoolAdministrator
            - call: "POST /terminals/${tid}/trains"
