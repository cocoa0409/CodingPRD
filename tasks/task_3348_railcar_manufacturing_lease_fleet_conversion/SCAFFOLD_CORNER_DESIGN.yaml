          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-L5
          component_class: WHEELSET
          unit_cost_cents: 1100
          lead_time_days: 4
        as: SupplyChainCoordinator
        captures:
          ws2_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          po_v: $.data.version
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws_id}
          substitute_component_id: ${ws2_id}
          substitute_qty_per_car: 2
          decides_material: false
          expected_production_order_version: ${po_v}
        as: ProductionPlanner
        as_user_id: user-planner-11b
        captures:
          se_id: $.data.id
          se_status: $.data.status
      trigger:
      - call: GET /api/v1/substitution-endorsements?production_order_id=${po_id}
        payload: {}
        as: PlatformAdmin
        captures:
          from_order: $.data[0].id
      - call: GET /api/v1/substitution-endorsements?original_component_id=${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          from_original: $.data[0].id
      - call: GET /api/v1/substitution-endorsements?substitute_component_id=${ws2_id}
        payload: {}
        as: PlatformAdmin
        captures:
          from_substitute: $.data[0].id
      - call: GET /api/v1/substitution-endorsements/${se_id}
        payload: {}
        as: PlatformAdmin
        captures:
          read_po: $.data.production_order_id
          read_orig: $.data.original_component_id
          read_sub: $.data.substitute_component_id
          read_status: $.data.status
      assert:
      - 'The endorsement was created PENDING: data.status == ${se_status} == "PENDING"'
      - 'The order side of the link resolves: GET /substitution-endorsements?production_order_id=${po_id}
        returns ${from_order} == ${se_id}'
      - 'The original-component side of the link resolves: GET /substitution-endorsements?original_component_id=${ws_id}
        returns ${from_original} == ${se_id}'
      - 'The substitute-component side of the link resolves: GET /substitution-endorsements?substitute_component_id=${ws2_id}
        returns ${from_substitute} == ${se_id}'
      - 'The by-id read confirms all three foreign keys: production_order_id == ${read_po} == ${po_id},
        original_component_id == ${read_orig} == ${ws_id}, substitute_component_id == ${read_sub} == ${ws2_id}'
      - All three directions return exactly one row each, so the link is a single junction row rather
        than duplicated per direction; status reads back ${read_status} == "PENDING"
  - name: endpoint_computed_read_component_reserved_qty_after_release
    claim_type: Computed read
    grounds:
    - calculations.component_allocation
    - entities.Component.fields.reserved_qty
    - entities.Component.fields.on_hand_qty
    - GET /api/v1/components/{id}
    distinguishing_aspect: 'GET /components/{id} surfaces the derived reserved_qty rather than a stored
      input: it reads 0 while the order is COMPONENT_RESERVED and jumps to 10 == qty_per_car 2 * quantity
      5 once the order is RELEASED, while on_hand_qty stays at the 90 committed at reservation.'
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-E (BOXCAR, build_hours 1, regulatory_life_years 25, line_count_family LINE-E) with
        one WHEELSET WS-E row at qty_per_car 2; 100 units on hand via a received ComponentReceipt.
      - A SOLD order of 5 cars is reserved, which commits 2 * 5 == 10 units and leaves on_hand_qty 90;
        the order is not yet released, so no RELEASED reservation exists.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-E
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-E
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-E
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_id}
          component_id: ${ws_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 100
          unit_cost_cents: 1000
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_ws: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws}
          component_id: ${ws_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 5
          planned_shop_days: 5
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-12-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          reserved_status: $.data.status
      trigger:
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          on_hand_pre: $.data.on_hand_qty
          reserved_pre: $.data.reserved_qty
      - call: POST /api/v1/production-orders/${po_id}/release
        payload: {}
        as: ProductionPlanner
        captures:
          released_status: $.data.status
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: PlatformAdmin
        captures:
          on_hand_post: $.data.on_hand_qty
          reserved_post: $.data.reserved_qty
      assert:
      - 'The reservation committed stock: after POST /production-orders/${po_id}/reserve-components the
        order reads ${reserved_status} == "COMPONENT_RESERVED" and Component.${ws_id}.on_hand_qty == ${on_hand_pre}
        == 90 (100 - 2 * 5)'
      - 'While the order is COMPONENT_RESERVED the derived reserved_qty is 0: data.reserved_qty == ${reserved_pre}
        == 0, because component_allocation counts only ProductionOrder rows in status RELEASED'
      - 'After POST /production-orders/${po_id}/release returns ${released_status} == "RELEASED", the
        derived value moves without any new stock movement: data.reserved_qty == ${reserved_post} == 10'
      - 10 == qty_per_car 2 * quantity 5, the exact reservations term of §1.3 component_allocation
      - 'on_hand_qty is untouched by the release: data.on_hand_qty == ${on_hand_post} == ${on_hand_pre}
        == 90, so reserved_qty is re-derived from order state rather than patched from the commit'
      - The same read exposes shortfall_qty == 0, since reserved_qty 10 <= on_hand_qty 90 makes the shortfall
        term zero
