          setup:
            - "One project with adjusted basis 60000000 cents and a single QRE HARD_CONSTRUCTION cost of 30000000 cents incurred 2027-05-01, so the substantial test is NOT_MET before the revision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /developers"
              payload: { legal_name: "Elm Mill Partners LLC", taxpayer_id_last4: "4821", entity_type: "LLC" }
