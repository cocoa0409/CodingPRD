          setup:
            - "TIER_A sponsor b1; property purchase 20,000,000 / ARV 32,000,000; three APPROVED lines totalling 10,000,000"
            - "loan closed 2026-08-10: funded 13,151,375, interest reserve 802,338, holdback 10,000,000, note rate 1150 bps, PER_DIEM_360"
