              as: StoreManager
              captures: { sp_id: $.data.id }
            - call: "POST /animals"
              payload: { species_id: "${sp_id}", morph: "Coastal", acquisition_cost_cents: 3000, list_price_cents: 11000 }
              as: StoreManager
              as_user_id: "mgr-intake"
              captures: { an_id: $.data.id }
            - call: "POST /animals/${an_id}/start-quarantine"
              payload: {}
              as: VetTech
              captures: { qr_id: $.data.id }
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/health-checks"
              payload: { result: "PASS" }
              as: VetTech
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
