            - call: "POST /audit-programs/${prog_id}/protocol-versions"
              payload: { protocol_family: "MPDS_CARDSET", version_label: "MPDS-13.0", effective_from: "2026-07-01T00:00:00Z", case_entry_weight: 0.2000, key_questions_weight: 0.3500, pre_arrival_weight: 0.3000, final_coding_weight: 0.1500 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pv_id: $.data.id }
            - call: "POST /protocol-versions/${pv_id}/approve"
              payload: { approval_note: "adopted" }
              as: MedicalDirector
              as_user_id: "dir-1"
            - call: "POST /dispatchers"
              payload: { program_id: "${prog_id}", employee_code: "EMD-401", full_name: "Devon Park" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { d1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /dispatchers/${d1_id}/call-records"
              payload: { call_reference: "C-4001", call_type: "CHEST_PAIN", received_at: "2026-08-05T09:00:00Z", dispatched_determinant_code: "10-C-4" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id }
            - call: "POST /audit-programs/${prog_id}/sampling-periods"
              payload: { call_type: "CHEST_PAIN", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", sampling_mode: "MIXED", target_sample_count: 1 }
              as: QaSupervisor
              as_user_id: "sup-1"
              captures: { sp_id: $.data.id }
            - call: "POST /sampling-periods/${sp_id}/target-review"
              payload: { call_record_id: "${c1_id}", selection_reason: "HIGH_RISK_OUTCOME" }
              as: QaSupervisor
              as_user_id: "sup-1"
