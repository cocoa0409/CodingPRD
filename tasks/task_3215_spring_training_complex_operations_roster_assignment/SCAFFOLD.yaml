    input: [complex_id, opponent_name, home_away, game_datetime, travel_radius_miles, duration_units, split_squad]
    output: GameSchedule
    side_effects: ["game_schedule_status=DRAFT", "gameday_status=NOT_GAMEDAY", "game_interval_start / game_interval_end derived"]
  - method: GET
    path: "/camp-ops/games/{gameId}"
    description: "Get a game schedule"
    roles: [PlatformAdmin, ComplexDirector, FieldCoordinator, Analytics]
    code: 200
    input: []
    output: GameSchedule
    side_effects: []
  - method: GET
    path: "/camp-ops/games"
    description: "List games, filterable by complex"
    roles: [PlatformAdmin, ComplexDirector, Analytics]
    code: 200
    input: ["complex_id?", "game_schedule_status?", "limit?", "offset?"]
    output: GameSchedule[]
    side_effects: []
  - method: GET
    path: "/camp-ops/complexes/{complexId}/games"
    description: "List games belonging to a complex"
    roles: [PlatformAdmin, ComplexDirector, FieldCoordinator]
    code: 200
    input: []
    output: GameSchedule[]
    side_effects: []
  - method: POST
    path: "/camp-ops/games/{gameId}/publish"
    description: "Publish a game after travel-radius, posture and overlap checks"
    roles: [ComplexDirector]
    code: 200
    input: [expected_game_version]
    output: GameSchedule
    side_effects:
      - "game_schedule_status -> PUBLISHED"
      - "gameday_status -> GAMEDAY when the clock is within the gameday box"
      - "ThrowingProgramRequirementCalculation recomputed for participating pitchers"
      - "GameSchedule.version incremented by 1"
  - method: POST
    path: "/camp-ops/games/{gameId}/revert-to-draft"
    description: "Send a published game back to draft"
    roles: [ComplexDirector]
    code: 200
    input: []
    output: GameSchedule
    side_effects: ["game_schedule_status -> DRAFT", "gameday_status -> NOT_GAMEDAY", "GameSchedule.version incremented by 1"]
  - method: POST
    path: "/camp-ops/games/{gameId}/record-result"
    description: "Mark a published game played"
    roles: [ComplexDirector]
    code: 200
    input: []
    output: GameSchedule
    side_effects: ["game_schedule_status -> PLAYED", "gameday_status -> NOT_GAMEDAY", "participating pitchers' requirement scores recomputed"]
  - method: POST
    path: "/camp-ops/games/{gameId}/cancel"
    description: "Cancel a game and withdraw its participations"
    roles: [ComplexDirector]
    code: 200
    input: []
    output: GameSchedule
    side_effects: ["game_schedule_status -> CANCELLED", "participations -> WITHDRAWN", "participating pitchers' requirement scores recomputed"]

  # --- GameParticipation ---
  - method: POST
    path: "/camp-ops/games/{gameId}/participations"
    description: "Add a player to an exhibition game roster"
    roles: [FieldCoordinator]
    code: 201
    input: [game_schedule_id, player_id, squad_side, throw_count]
    output: GameParticipation
    side_effects: ["participation_status=SCHEDULED", "GameSchedule.version incremented by 1"]
  - method: GET
    path: "/camp-ops/game-participations/{participationId}"
    description: "Get a game participation"
    roles: [PlatformAdmin, FieldCoordinator, Analytics]
    code: 200
    input: []
    output: GameParticipation
    side_effects: []
  - method: GET
    path: "/camp-ops/game-participations"
    description: "List game participations, filterable by game or player"
    roles: [PlatformAdmin, FieldCoordinator, Analytics]
    code: 200
    input: ["game_schedule_id?", "player_id?", "limit?", "offset?"]
    output: GameParticipation[]
    side_effects: []
  - method: GET
    path: "/camp-ops/games/{gameId}/participations"
    description: "List participations belonging to a game"
    roles: [PlatformAdmin, FieldCoordinator, ComplexDirector]
    code: 200
    input: []
    output: GameParticipation[]
    side_effects: []
  - method: POST
    path: "/camp-ops/games/{gameId}/participations/{participationId}/confirm"
    description: "Confirm a gameday participation (OCC-guarded on the game's version; split-squad and throwing gates apply)"
    roles: [FieldCoordinator]
    code: 200
    input: [expected_game_version]
    output: GameParticipation
    side_effects:
      - "participation_status -> CONFIRMED"
      - "SplitSquadEligibilityCalculation evaluated"
      - "ThrowingProgramRequirementCalculation recomputed for this pitcher"
      - "GameSchedule.version incremented by 1"
  - method: POST
    path: "/camp-ops/games/{gameId}/participations/{participationId}/withdraw"
    description: "Withdraw a scheduled or confirmed participation"
    roles: [FieldCoordinator]
    code: 200
    input: []
    output: GameParticipation
    side_effects: ["participation_status -> WITHDRAWN", "GameSchedule.version incremented by 1"]
  - method: POST
    path: "/camp-ops/games/{gameId}/package-roster"
    description: "Package the gameday roster inside the 6-hour window, locking confirmed participations"
    roles: [ComplexDirector]
    code: 200
    input: []
    output: { locked_count: integer, game_id: string, gameday_status: string }
    side_effects: ["every CONFIRMED participation -> LOCKED", "GameSchedule.version incremented by 1"]

  # --- SpringTrail ---
  - method: POST
    path: "/camp-ops/players/{playerId}/spring-trails"
    description: "Map a player onto a minor league spring trail (excludes them from farm-scoped camp entities)"
    roles: [MinorLeagueCoordinator]
    code: 201
    input: [player_id, trail_level]
    output: SpringTrail
    side_effects: ["trail_status=ACTIVE", "mapped_at = current logical clock"]
  - method: GET
    path: "/camp-ops/spring-trails/{trailId}"
    description: "Get a spring trail mapping"
    roles: [PlatformAdmin, MinorLeagueCoordinator, Analytics]
    code: 200
    input: []
    output: SpringTrail
    side_effects: []
  - method: GET
    path: "/camp-ops/players/{playerId}/spring-trails"
    description: "List spring trail mappings belonging to a player"
    roles: [PlatformAdmin, MinorLeagueCoordinator, RosterManager]
    code: 200
    input: []
    output: SpringTrail[]
    side_effects: []
  - method: GET
    path: "/camp-ops/spring-trails"
    description: "List spring trail mappings, filterable by player"
    roles: [PlatformAdmin, MinorLeagueCoordinator, Analytics]
    code: 200
    input: ["player_id?", "trail_status?", "limit?", "offset?"]
    output: SpringTrail[]
    side_effects: []
  - method: POST
    path: "/camp-ops/spring-trails/{trailId}/end"
    description: "End a spring trail mapping"
    roles: [MinorLeagueCoordinator]
    code: 200
    input: []
    output: SpringTrail
    side_effects: ["trail_status -> ENDED", "SpringTrail.version incremented by 1"]

  - method: POST
    path: "/camp-ops/players/{playerId}/minor-league-assignments"
    description: "Open the post-break-out minor league assignment record for a player"
    roles: [MinorLeagueCoordinator]
    code: 201
    input: [player_id, roster_record_id, assigned_level, affiliate_name, effective_datetime]
    output: MinorLeagueAssignment
    side_effects: ["assignment_status=PENDING", "MinorLeagueAssignmentCalculation evaluates travel_day_count and break_out_liability_cents"]
  - method: GET
    path: "/camp-ops/minor-league-assignments/{assignmentId}"
    description: "Get a minor league break-out assignment"
    roles: [PlatformAdmin, MinorLeagueCoordinator, Analytics]
    code: 200
    input: []
    output: MinorLeagueAssignment
    side_effects: []
  - method: GET
    path: "/camp-ops/players/{playerId}/minor-league-assignments"
    description: "List minor league assignments belonging to a player"
    roles: [PlatformAdmin, MinorLeagueCoordinator, RosterManager]
    code: 200
    input: []
    output: MinorLeagueAssignment[]
    side_effects: []
  - method: GET
    path: "/camp-ops/minor-league-assignments"
    description: "List minor league assignments, filterable by player"
    roles: [PlatformAdmin, MinorLeagueCoordinator, Analytics]
    code: 200
    input: ["player_id?", "roster_record_id?", "assignment_status?", "limit?", "offset?"]
    output: MinorLeagueAssignment[]
    side_effects: []
  - method: POST
    path: "/camp-ops/minor-league-assignments/{assignmentId}/settle"
    description: "Settle a pending minor league assignment (segregation of duties applies)"
    roles: [MinorLeagueCoordinator]
    code: 200
    input: []
    output: MinorLeagueAssignment
    side_effects: ["assignment_status -> SETTLED", "settlement_actor_id = acting X-User-ID", "MinorLeagueAssignment.version incremented by 1"]
  - method: POST
    path: "/camp-ops/minor-league-assignments/{assignmentId}/void-breakout"
    description: "Void a settled break-out (compensating action; SOD gate applies)"
    roles: [MinorLeagueCoordinator]
    code: 200
    input: []
    output: MinorLeagueAssignment
    side_effects: ["assignment_status -> BREAKOUT_VOIDED", "MinorLeagueAssignmentCalculation (VOID_BREAKOUT variant) re-evaluates break_out_liability_cents as 0", "MinorLeagueAssignment.version incremented by 1"]

  # --- ops runs / sweeps ---
  - method: POST
    path: "/camp-ops/ops-runs"
    description: "Run a periodic camp operations checkpoint (invitation-report-sweep | registration-roster-sweep)"
    roles: [PlatformAdmin, ComplexDirector]
    code: 200
    input: [run_type]
    output: { run_type: string, stale_invitations_expired: integer, posture_sweeps_run: integer, ops_run_index: integer }
    side_effects:
      - "invitation-report-sweep drives stale CampInvitations ISSUED -> NO_SHOW and runs their CASCADE 1 unwind"
      - "registration-roster-sweep recomputes every PlayerRosterRecord.option_eligibility and waivers_required"
      - "every Complex.posture_sweep_index incremented by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header is missing or the role name is not declared in §1.7" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not in the endpoint's permitted role set" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "The finalizing actor's X-User-ID equals last_decision_actor_id on the roster record (same person applied and finalized the decision)" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "A path resource does not exist, or the child resource does not belong to the named parent" }
  - { id: ERR_FOREIGN_KEY_NOT_FOUND, http: 404, condition: "An id supplied in the request body does not resolve to a declared entity" }
  - { id: ERR_ROSTER_STATUS_INVALID_TRANSITION, http: 409, condition: "The roster record's current_roster_status is not a from-state for the requested decision or break-out action" }
  - { id: ERR_ROSTER_ALREADY_FINAL, http: 409, condition: "The roster record has reached a terminal status (RELEASED, NRI_RELEASED, ASSIGNED_AAA, ASSIGNED_AA)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "A facility, agreement, ticketing, workout-group or game entity is not in a from-state for the requested transition" }
  - { id: ERR_OUTSIDE_WINDOW, http: 422, condition: "The logical clock sits outside the endpoint's declared window (report window, lease window, packaging window, void-decision cutoff)" }
  - { id: ERR_PHYSICAL_WINDOW_LEAD, http: 422, condition: "A non-domestic player's physical is scheduled less than 5 days before the invitation's report_current_date" }
  - { id: ERR_MEDICAL_CLEARANCE_REQUIRED, http: 422, condition: "The effective player's clearance_status is not CAMP_CLEARED at the instant of the operation" }
  - { id: ERR_INJURY_TRAVEL_UNSAFE, http: 422, condition: "An AWAY participation is confirmed for a player whose throwing program is in a strict-precursor phase without an injury-travel clearance" }
  - { id: ERR_MAINTENANCE_CONFLICT, http: 409, condition: "A CLOSED field-maintenance action is requested while a provisional group assignment still occupies a seat on the complex" }
  - { id: ERR_TEMPORAL_OVERLAP, http: 409, condition: "A candidate game interval touches a scheduled workout session interval on the same complex, including a zero-length gap" }
  - { id: ERR_PHYSICAL_DOUBLE_BOOKED, http: 409, condition: "Two performed physicals on the same player have examination intervals that collide inside the clearance buffer" }
  - { id: ERR_GROUP_CAPACITY_EXCEEDED, http: 409, condition: "The create or call-up would raise the group's assigned_units above its capacity_units" }
  - { id: ERR_PLAYER_ALREADY_ASSIGNED, http: 409, condition: "The player already holds an ACTIVE group assignment" }
  - { id: ERR_BUCKET_MISMATCH, http: 422, condition: "The assignment's roster_bucket differs from the owning workout group's roster_bucket" }
  - { id: ERR_TRAVEL_RADIUS_EXCEEDED, http: 422, condition: "An AWAY game carries travel_radius_miles greater than 250" }
  - { id: ERR_DUPLICATE_IDP_NUMBER, http: 409, condition: "A player create repeats an existing idp_number" }
  - { id: ERR_THROW_REQUIREMENT_UNMET, http: 422, condition: "A group publish or assignment call-up would proceed while a member pitcher's requirement_status is UNMET" }
  - { id: ERR_WAIVER_WINDOW_EXPIRED, http: 409, condition: "The waiver claim window computed by WaiverClaimCountdownCalculation has elapsed at finalize time" }
  - { id: ERR_FARM_ENTITY_EXCLUDED, http: 409, condition: "A farm-scoped camp entity is mutated for a player mapped into an ACTIVE SpringTrail row" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Ticketing is opened while the owning agreement is not ACTIVE or the lease window has closed" }
  - { id: ERR_INVITATION_LETTER_MISSING, http: 409, condition: "A travel arrangement is confirmed while the invitation letter is still pending" }
  - { id: ERR_SPONSORSHIP_NOT_FULLY_FUNDED, http: 422, condition: "A sponsorship is settled while received_amount_cents is below committed_amount_cents" }
  - { id: ERR_AGREEMENT_UNDERFUNDED, http: 402, condition: "A travel draw exceeds the community ledger's available agreement funding" }
  - { id: ERR_POSTURE_BLOCKS_FISCAL, http: 409, condition: "A settlement void is attempted while the owning complex's facility_posture is not NORMAL" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "A required body field is missing or a value is structurally invalid (unknown enum, capacity below 1, negative amount, final report date before current)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "An expected_*_version input does not match the parent entity's current version" }

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Opaque system operator: configures complexes, agreements and runs operations checkpoints"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/complexes"
      - "POST /camp-ops/_clock/set_current_utc"
      - "POST /camp-ops/ops-runs"
      - "POST /camp-ops/complexes/{complexId}/posture-sweeps"
      - "POST /camp-ops/players"
    shared_operations:
      - "GET /camp-ops/complexes/{complexId}"
      - "GET /camp-ops/community-agreements/{agreementId}"
      - "GET /camp-ops/players/{playerId}"
      - "GET /camp-ops/roster-records/{recordId}"
      - "GET /camp-ops/host-community-records/{recordId}"
      - "GET /camp-ops/host-community-records/{recordId}/ledger"

  - name: ComplexDirector
    description: "Owns facility posture, field maintenance, workout-group publication, gameday packaging and complex scoped reporting"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/complexes/{complexId}/field-maintenance"
      - "POST /camp-ops/workout-groups/{groupId}/publish"
      - "POST /camp-ops/workout-groups/{groupId}/disband"
      - "POST /camp-ops/games/{gameId}/publish"
      - "POST /camp-ops/games/{gameId}/revert-to-draft"
      - "POST /camp-ops/games/{gameId}/record-result"
      - "POST /camp-ops/games/{gameId}/cancel"
      - "POST /camp-ops/games/{gameId}/package-roster"
    shared_operations:
      - "POST /camp-ops/complexes/{complexId}/workout-groups"
      - "GET /camp-ops/complexes/{complexId}"
      - "GET /camp-ops/games/{gameId}"
      - "GET /camp-ops/workout-groups/{groupId}"

  - name: CommunityLiaison
    description: "Owns host-community relationships: stadium lease agreements, ticketing, sponsorships and travel funding draws"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/community-agreements/{agreementId}/activate"
      - "POST /camp-ops/community-agreements/{agreementId}/revert-to-draft"
      - "POST /camp-ops/community-agreements/{agreementId}/terminate"
      - "POST /camp-ops/host-community-records/{recordId}/open-ticketing"
      - "POST /camp-ops/host-community-records/{recordId}/close-ticketing"
      - "POST /camp-ops/host-community-records/{recordId}/sell-tickets"
      - "POST /camp-ops/sponsorships/{sponsorshipId}/contribute"
      - "POST /camp-ops/sponsorships/{sponsorshipId}/settle"
      - "POST /camp-ops/sponsorships/{sponsorshipId}/recognize"
      - "POST /camp-ops/sponsorships/{sponsorshipId}/void-settlement"
    shared_operations:
      - "POST /camp-ops/community-agreements"
      - "POST /camp-ops/community-agreements/{agreementId}/host-community-record"
      - "POST /camp-ops/host-community-records/{recordId}/sponsorships"
      - "POST /camp-ops/travel-arrangements/{arrangementId}/cancel"
      - "GET /camp-ops/host-community-records/{recordId}/ledger"

  - name: FieldCoordinator
    description: "Owns daily workout group rosters, field session blocks and gameday participation lists"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/workout-groups/{groupId}/sessions"
      - "POST /camp-ops/workout-groups/{groupId}/sessions/{sessionId}/publish-session"
      - "POST /camp-ops/group-assignments/{assignmentId}/call-up"
      - "POST /camp-ops/games/{gameId}/participations"
      - "POST /camp-ops/games/{gameId}/participations/{participationId}/confirm"
      - "POST /camp-ops/games/{gameId}/participations/{participationId}/withdraw"
    shared_operations:
      - "POST /camp-ops/complexes/{complexId}/workout-groups"
      - "POST /camp-ops/workout-groups/{groupId}/assignments"
      - "POST /camp-ops/group-assignments/{assignmentId}/withdraw"
      - "GET /camp-ops/group-assignments"
      - "GET /camp-ops/games/{gameId}/participations"

  - name: PitchingCoordinator
    description: "Owns pitcher throwing programs: sessions, phase advances, shutdowns and pitching-side assignment calls"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/group-assignments/{assignmentId}/throw-programs"
      - "POST /camp-ops/throw-programs/{programId}/sessions"
      - "POST /camp-ops/throw-programs/{programId}/advance-phase"
      - "POST /camp-ops/throw-programs/{programId}/shutdown"
      - "POST /camp-ops/throw-programs/{programId}/reinstate"
    shared_operations:
      - "POST /camp-ops/workout-groups/{groupId}/assignments"
      - "POST /camp-ops/group-assignments/{assignmentId}/withdraw"
      - "GET /camp-ops/throw-programs/{programId}"

  - name: TravelCoordinator
    description: "Owns report-date invitations, letters, travel arrangements and arrival recording"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/players/{playerId}/camp-invitations"
      - "POST /camp-ops/camp-invitations/{invitationId}/send-letter"
      - "POST /camp-ops/camp-invitations/{invitationId}/arrive"
      - "POST /camp-ops/camp-invitations/{invitationId}/mark-visa-blocked"
      - "POST /camp-ops/camp-invitations/{invitationId}/travel-arrangement"
      - "POST /camp-ops/travel-arrangements/{arrangementId}/revert"
    shared_operations:
      - "POST /camp-ops/travel-arrangements/{arrangementId}/cancel"
      - "GET /camp-ops/camp-invitations/{invitationId}"
      - "GET /camp-ops/travel-arrangements"

  - name: TeamPhysician
    description: "Owns pre-season medical evaluations: physicals, results, clearance reinstatement"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/players/{playerId}/program-profile"
      - "POST /camp-ops/players/{playerId}/program-profile/reinstate"
      - "POST /camp-ops/players/{playerId}/clearance/pend"
      - "POST /camp-ops/players/{playerId}/physicals"
      - "POST /camp-ops/physicals/{physicalId}/perform"
      - "POST /camp-ops/physicals/{physicalId}/void"
    shared_operations:
      - "GET /camp-ops/program-profiles/{profileId}"
      - "GET /camp-ops/physicals/{physicalId}"
      - "GET /camp-ops/players/{playerId}/physicals"

  - name: RosterManager
    description: "Owns roster decisions: option status, waivers, non-roster invitee outcomes and active-roster selection"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/players/{playerId}/roster-record"
      - "POST /camp-ops/players/{playerId}/roster-record/select-active-roster"
      - "POST /camp-ops/players/{playerId}/roster-record/decide"
      - "POST /camp-ops/players/{playerId}/roster-record/request-waivers"
      - "POST /camp-ops/players/{playerId}/roster-record/record-waiver-outcome"
      - "POST /camp-ops/players/{playerId}/roster-record/finalize-decision"
      - "POST /camp-ops/players/{playerId}/roster-record/void-decision"
    shared_operations:
      - "POST /camp-ops/players"
      - "POST /camp-ops/players/{playerId}/camp-invitations"
      - "GET /camp-ops/roster-records/{recordId}"
      - "GET /camp-ops/players/{playerId}"

  - name: MinorLeagueCoordinator
    description: "Owns camp break-out logistics and minor league assignment mapping"
    identity: opaque
    exclusive_operations:
      - "POST /camp-ops/roster-records/{recordId}/break-out-camp"
      - "POST /camp-ops/players/{playerId}/spring-trails"
      - "POST /camp-ops/spring-trails/{trailId}/end"
    shared_operations:
      - "GET /camp-ops/roster-records/{recordId}"
      - "GET /camp-ops/players/{playerId}/spring-trails"

  - name: Analytics
    description: "Read-only reporting principal; no mutating operation exists for this role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /camp-ops/complexes/{complexId}"
      - "GET /camp-ops/players/{playerId}"
      - "GET /camp-ops/host-community-records/{recordId}/ledger"
      - "GET /camp-ops/group-assignments"
      - "GET /camp-ops/throw-programs/{programId}"

  - name: Player
    description: "The invited player acting on their own invitation; identity is the Player entity's own id"
    identity: "entity_backed:Player"
    exclusive_operations:
      - "POST /camp-ops/camp-invitations/{invitationId}/acknowledge"
    shared_operations:
      - "GET /camp-ops/camp-invitations/{invitationId}"
      - "GET /camp-ops/players/{playerId}"