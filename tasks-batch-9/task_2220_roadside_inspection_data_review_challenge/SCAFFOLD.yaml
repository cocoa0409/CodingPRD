scenario: "2220. Roadside Inspection Data Review & Challenge (carrier safety data quality team): inspection report ingestion with violation codes, severity weights and time weighting in safety scores, error identification for wrong carrier attribution, duplicate reports and incorrect violation codes, formal data challenge submission with supporting evidence and response tracking, adjudicated citation results submitted to update violation records, driver-level violation attribution and coaching assignment, score threshold monitoring against intervention thresholds by category, roadside inspection selection risk from screening systems, corrective action plan for safety fitness determinations"
domain_name: "roadside-inspection-data-review"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
    - ops_run_checkpoint

  entity_topology: graph
  # Peer collections at the URL root (api_prefix "/"), joined by explicit foreign keys.
  # Self-referential edges (InspectionReport.duplicate_master_report_id,
  # CorrectiveActionPlan.superseded_cap_id) plus cross-aggregate edges
  # (Violation -> Driver, CoachingAssignment -> Violation, BasicScore -> InterventionThreshold)
  # make the reference structure a graph, not a tree.

  state_machine_shape: cyclic
  secondary_state_machine_shapes: [branching, parallel, compound, guarded]
  # DataChallenge is cyclic (UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW, max 3 rounds);
  # CitationAdjudication carries two independent state dimensions on one row
  # (court_status x record_update_status); CorrectiveActionPlan forks into two review
  # branches and joins on a compound child condition; InspectionReport cycles
  # SCORED -> AMENDED -> SCORED.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: beyond_expert
  difficulty_notes: |
    Above the Expert band on purpose: 15 entities, 61 endpoints, 34 priority-ordered
    validation rules, 61 error codes,
    7 calculations (3 of them with divergent variants), 6 state machines
    (one cyclic, one with parallel dimensions, one fork-join compound), and
    3 OCC-guarded create-with-supersede endpoints. The density, not the volume,
    is the point: every score number is a function of five entities
    (ViolationCode weight pin, Violation time weight, InspectionReport status,
    Carrier fleet size/utilisation, InterventionThreshold reference measures),
    and every challenge/adjudication transition perturbs that function through a
    4-6 hop cascade.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: dot_number
        type: string
        source: input
        description: "USDOT number; globally unique"
        constraints: "6-8 digits, unique across Carrier"
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the motor carrier"
        constraints: "1..200 chars"
      - name: average_power_units
        type: integer
        source: input
        description: "Average number of power units in the fleet; denominator input for per-unit BASIC measures"
        constraints: ">= 0"
      - name: annual_vmt
        type: integer
        source: input
        description: "Annual vehicle miles travelled; numerator of the utilisation ratio"
        constraints: ">= 0"
      - name: carrier_segment
        type: enum
        source: computed
        description: "Fleet-size band used to select InterventionThreshold rows and the challenge quota limit"
        constraints: "SMALL when average_power_units <= 15; MEDIUM when 16..100; LARGE when > 100"
      - name: utilization_factor
        type: number
        source: computed
        description: "Tiered multiplier applied to average_power_units in per-unit denominators"
        constraints: "1.0 | 1.2 | 1.5 | 1.8 per calculations.basic_measure_recompute tiers"
      - name: safety_fitness_status
        type: enum
        source: system
        description: "Safety fitness determination currently on record"
        default: UNRATED
        constraints: "UNRATED | SATISFACTORY | CONDITIONAL | UNSATISFACTORY"
      - name: fitness_determined_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent fitness determination; null when UNRATED"
      - name: fitness_determined_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FmcsaProgramAuditor who issued the current determination; the segregation-of-duties bar for CAP decisions"
      - name: intervention_status
        type: enum
        source: computed
        description: "Derived intervention posture from BasicScore alert set"
        default: NONE
        constraints: "NONE | WARNING_LETTER | INVESTIGATION"
      - name: open_alert_count
        type: integer
        source: computed
        description: "Number of BasicScore rows of this carrier whose alert_status == ALERT"
        default: 0
      - name: max_percentile
        type: number
        source: computed
        description: "Highest non-null BasicScore.percentile across the carrier's four categories; null when every row is NOT_ENOUGH_DATA"
      - name: oos_violation_count_24mo
        type: integer
        source: computed
        description: "Count of violations with out_of_service == true, status IN {ACTIVE, RECODED}, on SCORED reports of this carrier with time_weight > 0"
        default: 0
      - name: scored_violation_count
        type: integer
        source: computed
        description: "Count of violations with status IN {ACTIVE, RECODED} on this carrier's reports whose status == SCORED (all ages)"
        default: 0
      - name: unattributed_violation_count
        type: integer
        source: computed
        description: "Subset of scored_violation_count whose driver_id is null"
        default: 0
      - name: iss_pre_credit_value
        type: number
        source: computed
        description: "Inspection Selection System risk value before the data-quality credit; 1 decimal"
        default: 0.0
      - name: data_quality_credit_pct
        type: number
        source: computed
        description: "Credit fraction earned from accepted data challenges; tier is keyed on iss_pre_credit_value, never on the adjusted value"
        default: 0.0
      - name: iss_value
        type: number
        source: computed
        description: "Final screening risk value after the data-quality credit; 1 decimal"
        default: 0.0
      - name: selection_band
        type: enum
        source: computed
        description: "Roadside screening band derived from iss_value"
        default: PASS
        constraints: "INSPECT when iss_value >= 75.0; OPTIONAL when >= 50.0; else PASS"
      - name: challenge_quota_used
        type: integer
        source: system
        description: "Rolling-window counter of filed challenges; incremented on submit, decremented on withdraw, re-derived by every scoring run"
        default: 0
      - name: challenge_quota_limit
        type: integer
        source: computed
        description: "Maximum challenges per rolling 30 days by segment: SMALL 1, MEDIUM 3, LARGE 6"
      - name: accepted_challenge_count_24mo
        type: integer
        source: computed
        description: "Count of this carrier's challenges with status == RESOLVED_ACCEPTED and resolved_at within 730 days of the current logical clock"
        default: 0
      - name: resolved_challenge_count_24mo
        type: integer
        source: computed
        description: "Count of this carrier's challenges with status IN {RESOLVED_ACCEPTED, RESOLVED_REJECTED} and resolved_at within 730 days of the current logical clock"
        default: 0
      - name: open_coaching_count
        type: integer
        source: computed
        description: "Count of CoachingAssignment rows of this carrier with status IN {ASSIGNED, IN_PROGRESS, OVERDUE}"
        default: 0

  - name: Driver
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; employing carrier"
      - name: cdl_number
        type: string
        source: input
        description: "Commercial licence number; unique within the employing carrier"
        constraints: "unique per (carrier_id, cdl_number)"
      - name: full_name
        type: string
        source: input
        description: "Driver name as printed on the licence"
      - name: employment_status
        type: enum
        source: input
        description: "Employment posture; gates coaching assignment"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | TERMINATED"
      - name: attributed_violation_count
        type: integer
        source: computed
        description: "Count of violations with driver_id == this driver, status IN {ACTIVE, RECODED}, on SCORED reports"
        default: 0
      - name: strict_attribution_score
        type: number
        source: computed
        description: "Sum of time_weighted_severity over the driver's attributed violations, ignoring court outcomes; 2 decimals"
        default: 0.0
      - name: adjudicated_attribution_score
        type: number
        source: computed
        description: "Same sum weighted by CitationAdjudication.severity_factor per violation; 2 decimals"
        default: 0.0
      - name: coaching_required
        type: boolean
        source: computed
        description: "True when adjudicated_attribution_score >= COACHING_TRIGGER (12.0)"
        default: false
      - name: open_coaching_count
        type: integer
        source: computed
        description: "Count of this driver's CoachingAssignment rows with status IN {ASSIGNED, IN_PROGRESS, OVERDUE}"
        default: 0

  - name: ViolationCode
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "FMCSR citation code, e.g. 392.2-SLLS2; globally unique"
        constraints: "unique across ViolationCode"
      - name: description
        type: string
        source: input
        description: "Human-readable violation text"
      - name: basic_category
        type: enum
        source: input
        description: "Behaviour category the code scores into"
        constraints: "UNSAFE_DRIVING | HOURS_OF_SERVICE | VEHICLE_MAINTENANCE | DRIVER_FITNESS"
      - name: severity_weight
        type: integer
        source: input
        description: "Base severity weight of the code"
        constraints: "1..10"
      - name: oos_add_on
        type: integer
        source: input
        description: "Additional weight applied when the violation was placed out of service"
        default: 2
        constraints: "0..5"
      - name: driver_attributable
        type: boolean
        source: input
        description: "Whether the code may drive a driver coaching assignment"
        default: true

  - name: InterventionThreshold
    parent: null
    common_fields: true
    fields:
      - name: basic_category
        type: enum
        source: input
        description: "Category this reference row applies to"
        constraints: "UNSAFE_DRIVING | HOURS_OF_SERVICE | VEHICLE_MAINTENANCE | DRIVER_FITNESS"
      - name: carrier_segment
        type: enum
        source: input
        description: "Fleet-size band this reference row applies to"
        constraints: "SMALL | MEDIUM | LARGE"
      - name: effective_from
        type: datetime
        source: input
        description: "First instant at which this row may be selected"
      - name: measure_at_p50
        type: number
        source: input
        description: "Reference measure mapping to percentile 50.0"
        constraints: "> 0"
      - name: measure_at_p65
        type: number
        source: input
        description: "Reference measure mapping to percentile 65.0"
        constraints: "> measure_at_p50"
      - name: measure_at_p80
        type: number
        source: input
        description: "Reference measure mapping to percentile 80.0"
        constraints: "> measure_at_p65"
      - name: intervention_percentile
        type: number
        source: input
        description: "Percentile at or above which alert_status becomes ALERT"
        default: 65.0
        constraints: "0 < value <= 100"
      - name: monitor_percentile
        type: number
        source: input
        description: "Percentile at or above which alert_status becomes MONITOR"
        default: 50.0
        constraints: "0 < value < intervention_percentile"
      - name: investigation_percentile
        type: number
        source: input
        description: "Percentile at or above which the carrier's intervention_status escalates to INVESTIGATION"
        default: 85.0
        constraints: ">= intervention_percentile"

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - name: report_number
        type: string
        source: input
        description: "State-issued inspection report number; globally unique"
        constraints: "unique across InspectionReport"
      - name: inspection_state
        type: string
        source: input
        description: "Two-letter state code where the inspection occurred"
        constraints: "exactly 2 uppercase letters"
      - name: inspection_level
        type: integer
        source: input
        description: "MCSAP inspection level"
        constraints: "1..6"
      - name: inspection_start
        type: datetime
        source: input
        description: "Start instant of the roadside inspection; the aging basis for time weighting"
      - name: inspection_end
        type: datetime
        source: input
        description: "End instant of the roadside inspection"
        constraints: "> inspection_start"
      - name: vehicle_vin
        type: string
        source: input
        description: "VIN of the inspected power unit; the resource whose occupation window duplicate detection guards"
      - name: attributed_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; carrier the report currently scores against; rewritten by an accepted WRONG_CARRIER challenge"
      - name: original_carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; carrier the report was ingested against, set only when reattributed"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver recorded on the report, nullable"
      - name: duplicate_master_report_id
        type: string
        source: system
        description: "FK -> InspectionReport.id; surviving report this one was rescinded in favour of"
      - name: selection_source
        type: enum
        source: input
        description: "Why the vehicle was pulled in"
        constraints: "ISS_SCREENING | RANDOM | POST_CRASH | COMPLAINT | WEIGH_STATION"
      - name: iss_value_at_selection
        type: number
        source: system
        description: "Snapshot of Carrier.iss_value at ingestion"
      - name: selection_band_at_selection
        type: enum
        source: system
        description: "Snapshot of Carrier.selection_band at ingestion"
        constraints: "PASS | OPTIONAL | INSPECT"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: RECEIVED
        constraints: "RECEIVED | VALIDATED | SCORED | AMENDED | RESCINDED"
      - name: reattributed
        type: boolean
        source: system
        description: "True once attributed_carrier_id has been rewritten by an accepted WRONG_CARRIER challenge"
        default: false
      - name: active_violation_count
        type: integer
        source: computed
        description: "Count of this report's violations with status IN {ACTIVE, RECODED}"
        default: 0
      - name: total_time_weighted_severity
        type: number
        source: computed
        description: "Sum of time_weighted_severity over this report's violations with status IN {ACTIVE, RECODED}"
        default: 0.0
      - name: scored_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent scoring pass"
      - name: severity_basis_utc
        type: datetime
        source: system
        description: "Snapshot instant whose distance from inspection_start produced the current time weights"

  - name: Violation
    parent: InspectionReport
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> InspectionReport.id; owning report"
      - name: violation_code_id
        type: string
        source: input
        description: "FK -> ViolationCode.id; code as originally written by the inspector"
      - name: effective_violation_code_id
        type: string
        source: system
        description: "FK -> ViolationCode.id; code currently in force; equals violation_code_id until a correction lands"
      - name: basic_category
        type: enum
        source: computed
        description: "basic_category of the effective violation code"
        constraints: "UNSAFE_DRIVING | HOURS_OF_SERVICE | VEHICLE_MAINTENANCE | DRIVER_FITNESS"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver this violation is attributed to, nullable"
      - name: attributed_carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; denormalised copy of the owning report's attributed_carrier_id"
      - name: out_of_service
        type: boolean
        source: input
        description: "Whether the violation resulted in an out-of-service order"
        default: false
      - name: unit_type
        type: enum
        source: input
        description: "Whether the violation was written against the vehicle or the driver"
        constraints: "VEHICLE | DRIVER"
      - name: status
        type: enum
        source: system
        description: "Record state"
        default: ACTIVE
        constraints: "ACTIVE | RECODED | REMOVED"
      - name: removal_reason
        type: enum
        source: system
        description: "Why the violation left the scored population; null while status != REMOVED"
        constraints: "CHALLENGE_ACCEPTED | ADJUDICATION_DISMISSED | DUPLICATE_RESCINDED | AMENDMENT_REMOVAL"
      - name: under_challenge
        type: boolean
        source: system
        description: "True while an open DataChallenge covers this violation; excluded from certified_measure"
        default: false
      - name: code_weight_snapshot
        type: integer
        source: system
        description: "severity_weight of the effective code pinned at the last scoring pass"
      - name: oos_add_on_snapshot
        type: integer
        source: system
        description: "oos_add_on applied at the last scoring pass; 0 when out_of_service is false"
      - name: pinned_violation_code_version
        type: integer
        source: system
        description: "ViolationCode.version observed at the last scoring pass"
      - name: has_stale_code_pin
        type: boolean
        source: computed
        description: "True when the effective ViolationCode.version differs from pinned_violation_code_version"
        default: false
      - name: time_weight
        type: integer
        source: system
        description: "Age-band multiplier pinned at the last scoring pass"
        default: 0
        constraints: "0 | 1 | 2 | 3"
      - name: time_weighted_severity
        type: number
        source: computed
        description: "(code_weight_snapshot + oos_add_on_snapshot) * time_weight; 0.0 before the first scoring pass and for REMOVED violations"
        default: 0.0

  - name: ReportAmendment
    parent: InspectionReport
    common_fields: false
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> InspectionReport.id; amended report"
      - name: amendment_type
        type: enum
        source: input
        description: "Kind of correction the issuing state agency applied"
        constraints: "VIOLATION_CODE_CORRECTION | DRIVER_ATTRIBUTION_CORRECTION | CARRIER_REATTRIBUTION | VIOLATION_REMOVAL"
      - name: target_violation_id
        type: string
        source: input
        description: "FK -> Violation.id; violation being corrected; required for every type except CARRIER_REATTRIBUTION"
      - name: corrected_violation_code_id
        type: string
        source: input
        description: "FK -> ViolationCode.id; replacement code; required for VIOLATION_CODE_CORRECTION"
      - name: corrected_driver_id
        type: string
        source: input
        description: "FK -> Driver.id; replacement driver attribution; required for DRIVER_ATTRIBUTION_CORRECTION"
      - name: corrected_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; replacement attributed carrier; required for CARRIER_REATTRIBUTION"
      - name: source_challenge_id
        type: string
        source: system
        description: "FK -> DataChallenge.id; set when the amendment was generated by an accepted challenge rather than filed directly"
      - name: rationale
        type: string
        source: input
        description: "Free-text justification recorded on the amendment"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the amendment mutated the report"
      - name: report_version_before
        type: integer
        source: system
        description: "InspectionReport.version observed before the amendment applied"
      - name: report_version_after
        type: integer
        source: system
        description: "InspectionReport.version after the amendment applied"

  - name: DataChallenge
    parent: InspectionReport
    common_fields: true
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> InspectionReport.id; report whose data is disputed"
      - name: carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; filing carrier, copied from the report's attributed_carrier_id at creation"
      - name: challenge_type
        type: enum
        source: input
        description: "Nature of the asserted data error"
        constraints: "WRONG_CARRIER | DUPLICATE_REPORT | INCORRECT_VIOLATION_CODE | VIOLATION_NOT_SUPPORTED"
      - name: target_violation_id
        type: string
        source: input
        description: "FK -> Violation.id; disputed violation; required for INCORRECT_VIOLATION_CODE and VIOLATION_NOT_SUPPORTED"
      - name: asserted_correct_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; carrier the filer says the report belongs to; required for WRONG_CARRIER"
      - name: duplicate_of_report_id
        type: string
        source: input
        description: "FK -> InspectionReport.id; surviving report; required for DUPLICATE_REPORT"
      - name: asserted_correct_violation_code_id
        type: string
        source: input
        description: "FK -> ViolationCode.id; code the filer says should apply; required for INCORRECT_VIOLATION_CODE"
      - name: narrative
        type: string
        source: input
        description: "Filer's written argument"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | RESOLVED_ACCEPTED | RESOLVED_REJECTED | WITHDRAWN"
      - name: info_request_count
        type: integer
        source: system
        description: "Number of completed information-request rounds; capped at MAX_INFO_ROUNDS (3)"
        default: 0
      - name: info_response_deadline
        type: datetime
        source: system
        description: "info_requested_at + 30 days; the scoring run auto-rejects past this instant"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit"
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of resolution"
      - name: resolution_disposition
        type: enum
        source: system
        description: "Outcome label written at resolution"
        constraints: "REATTRIBUTED | REPORT_RESCINDED | CODE_CORRECTED | VIOLATION_REMOVED | INSUFFICIENT_EVIDENCE | NOT_SUBSTANTIATED | EXPIRED_NO_RESPONSE"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FmcsaReviewOfficer who resolved the challenge; null for scoring-run expiry"
      - name: evidence_count
        type: integer
        source: computed
        description: "Count of ChallengeEvidence rows attached to this challenge"
        default: 0
      - name: filing_age_days_at_submit
        type: integer
        source: system
        description: "Whole days between the report's inspection_start and the most recent submit instant"

  - name: ChallengeEvidence
    parent: DataChallenge
    common_fields: false
    fields:
      - name: challenge_id
        type: string
        source: input
        description: "FK -> DataChallenge.id; challenge this document supports"
      - name: evidence_type
        type: enum
        source: input
        description: "Document class"
        constraints: "BILL_OF_LADING | LEASE_AGREEMENT | GPS_LOG | ELD_RECORD | PHOTO | COURT_DOCUMENT | OTHER"
      - name: document_uri
        type: string
        source: input
        description: "Storage locator of the uploaded document"
      - name: description
        type: string
        source: input
        description: "What the document proves"
      - name: submitted_round
        type: integer
        source: system
        description: "DataChallenge.info_request_count observed at upload; distinguishes original from follow-up evidence"

  - name: CitationAdjudication
    parent: Violation
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: input
        description: "FK -> Violation.id; violation the citation was written for"
      - name: citation_number
        type: string
        source: input
        description: "Court citation number"
      - name: court_date
        type: datetime
        source: input
        description: "Scheduled or actual court date"
      - name: court_status
        type: enum
        source: system
        description: "Adjudication dimension; evolves independently of record_update_status"
        default: PENDING
        constraints: "PENDING | CONVICTED | DISMISSED | REDUCED | NOT_GUILTY"
      - name: record_update_status
        type: enum
        source: system
        description: "Record-keeping dimension; evolves independently of court_status"
        default: NOT_APPLIED
        constraints: "NOT_APPLIED | APPLIED | NOT_APPLICABLE"
      - name: reduced_to_violation_code_id
        type: string
        source: input
        description: "FK -> ViolationCode.id; code the citation was reduced to; required when court_status becomes REDUCED"
      - name: severity_factor
        type: number
        source: computed
        description: "Driver-attribution multiplier from court_status: 0.0 for DISMISSED and NOT_GUILTY, 0.5 for REDUCED, 1.0 for PENDING and CONVICTED"
        default: 1.0
      - name: court_result_recorded_at
        type: datetime
        source: system
        description: "Logical-clock instant the court result was recorded"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant the result was pushed into the violation record"
      - name: applied_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FmcsaReviewOfficer who applied the result"
      - name: superseded
        type: boolean
        source: system
        description: "True once a later adjudication for the same violation was created (appeal outcome)"
        default: false

  - name: BasicScore
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; scored carrier"
      - name: basic_category
        type: enum
        source: system
        description: "Scored category; one row per (carrier_id, basic_category)"
        constraints: "UNSAFE_DRIVING | HOURS_OF_SERVICE | VEHICLE_MAINTENANCE | DRIVER_FITNESS"
      - name: scoring_run_id
        type: string
        source: system
        description: "FK -> ScoringRun.id; run that last wrote this row; null when the last write came from an on-demand scoring pass"
      - name: threshold_id
        type: string
        source: system
        description: "FK -> InterventionThreshold.id; reference row used for the percentile mapping; null when included_violation_count == 0"
      - name: snapshot_utc
        type: datetime
        source: system
        description: "Aging basis of the current numbers"
      - name: total_time_weighted_severity
        type: number
        source: computed
        description: "Sum of time_weighted_severity over included violations, including those under challenge"
        default: 0.0
      - name: challenged_time_weighted_severity
        type: number
        source: computed
        description: "Portion of total_time_weighted_severity contributed by violations with under_challenge == true"
        default: 0.0
      - name: included_violation_count
        type: integer
        source: computed
        description: "Count of included violations (status IN {ACTIVE, RECODED}, report SCORED, time_weight > 0, matching category)"
        default: 0
      - name: relevant_inspection_count
        type: integer
        source: computed
        description: "Count of the carrier's reports with status == SCORED whose inspection_start is within 730 whole days of snapshot_utc"
        default: 0
      - name: denominator_value
        type: number
        source: computed
        description: "Category-specific exposure denominator actually used"
        default: 1.0
      - name: provisional_measure
        type: number
        source: computed
        description: "total_time_weighted_severity / denominator_value, 3 decimals; the all-data variant"
        default: 0.0
      - name: certified_measure
        type: number
        source: computed
        description: "(total_time_weighted_severity - challenged_time_weighted_severity) / denominator_value, 3 decimals; the operative variant"
        default: 0.0
      - name: percentile
        type: number
        source: computed
        description: "Piecewise-linear mapping of certified_measure through the selected threshold row, 1 decimal; null when relevant_inspection_count == 0"
      - name: alert_status
        type: enum
        source: computed
        description: "Threshold posture"
        default: CLEAR
        constraints: "CLEAR | MONITOR | ALERT | NOT_ENOUGH_DATA"

  - name: CoachingAssignment
    parent: Driver
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: system
        description: "FK -> Carrier.id; copied from the driver at creation"
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; coached driver"
      - name: violation_id
        type: string
        source: input
        description: "FK -> Violation.id; violation that motivated the coaching"
      - name: curriculum_code
        type: enum
        source: input
        description: "Coaching module to deliver"
        constraints: "UNSAFE_DRIVING_101 | HOS_ELD_REFRESH | PRETRIP_INSPECTION | CDL_COMPLIANCE"
      - name: session_start
        type: datetime
        source: input
        description: "Start of the reserved coaching window on the driver's calendar"
      - name: session_end
        type: datetime
        source: input
        description: "End of the reserved coaching window; half-open [start, end)"
        constraints: "> session_start"
      - name: due_at
        type: datetime
        source: system
        description: "session_end + 14 days; the scoring run marks OVERDUE past this instant"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state"
        default: ASSIGNED
        constraints: "ASSIGNED | IN_PROGRESS | COMPLETED | OVERDUE | WAIVED | ESCALATED"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the session started"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the session was attested complete"
      - name: attestation_note
        type: string
        source: system
        description: "Safety manager's completion attestation text"
      - name: waived_reason
        type: enum
        source: system
        description: "Why the assignment was waived; null while status != WAIVED"
        constraints: "VIOLATION_REMOVED | SCORE_BELOW_TRIGGER | DRIVER_SEPARATED | ATTRIBUTION_CLEARED"
      - name: overdue_marked_run_id
        type: string
        source: system
        description: "FK -> ScoringRun.id; run that flipped this assignment to OVERDUE"

  - name: CorrectiveActionPlan
    parent: Carrier
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; carrier submitting the plan"
      - name: superseded_cap_id
        type: string
        source: system
        description: "FK -> CorrectiveActionPlan.id; RETURNED plan this one replaces"
      - name: narrative
        type: string
        source: input
        description: "Root-cause narrative"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state; PENDING_DECISION is reached only by the compound join condition"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | IN_REVIEW | PENDING_DECISION | ACCEPTED | RETURNED | SUPERSEDED"
      - name: triggering_fitness_status
        type: enum
        source: system
        description: "Carrier.safety_fitness_status observed at plan creation"
        constraints: "CONDITIONAL | UNSATISFACTORY"
      - name: safety_review_outcome
        type: enum
        source: system
        description: "Outcome of the SAFETY review branch"
        constraints: "CLEARED | DEFICIENT"
      - name: safety_review_user_id
        type: string
        source: system
        description: "X-User-ID of the auditor who recorded the SAFETY branch review"
      - name: data_review_outcome
        type: enum
        source: system
        description: "Outcome of the DATA review branch"
        constraints: "CLEARED | DEFICIENT"
      - name: data_review_user_id
        type: string
        source: system
        description: "X-User-ID of the auditor who recorded the DATA branch review"
      - name: item_count
        type: integer
        source: computed
        description: "Count of CapActionItem rows with status != REJECTED_ITEM"
        default: 0
      - name: committed_item_count
        type: integer
        source: computed
        description: "Count of CapActionItem rows with status IN {COMMITTED, IMPLEMENTED, VERIFIED}"
        default: 0
      - name: verified_item_count
        type: integer
        source: computed
        description: "Count of CapActionItem rows with status == VERIFIED"
        default: 0
      - name: completion_pct
        type: number
        source: computed
        description: "100.0 * verified_item_count / max(1, item_count), 1 decimal"
        default: 0.0
      - name: decision
        type: enum
        source: system
        description: "Final auditor decision"
        constraints: "ACCEPT | RETURN"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the auditor who decided"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the decision"

  - name: CapActionItem
    parent: CorrectiveActionPlan
    common_fields: true
    fields:
      - name: cap_id
        type: string
        source: input
        description: "FK -> CorrectiveActionPlan.id; owning plan"
      - name: basic_category
        type: enum
        source: input
        description: "Category this action item addresses"
        constraints: "UNSAFE_DRIVING | HOURS_OF_SERVICE | VEHICLE_MAINTENANCE | DRIVER_FITNESS"
      - name: description
        type: string
        source: input
        description: "What the carrier will change"
      - name: target_completion_date
        type: datetime
        source: input
        description: "Date the carrier commits to finish this item"
      - name: status
        type: enum
        source: system
        description: "Item lifecycle state; REJECTED_ITEM re-enters the loop via COMMIT"
        default: PROPOSED
        constraints: "PROPOSED | COMMITTED | IMPLEMENTED | VERIFIED | REJECTED_ITEM"
      - name: rejection_note
        type: string
        source: system
        description: "Auditor note recorded with a REJECT action"
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the auditor who verified the item"

  - name: ScoringRun
    parent: null
    common_fields: true
    fields:
      - name: snapshot_utc
        type: datetime
        source: system
        description: "Logical-clock instant that becomes the aging basis for every score written by this run"
      - name: note
        type: string
        source: input
        description: "Operator note describing why the run was triggered"
      - name: carriers_scored
        type: integer
        source: system
        description: "Number of carriers whose BasicScore rows this run rewrote"
        default: 0
      - name: scores_updated
        type: integer
        source: system
        description: "Number of BasicScore rows written by this run"
        default: 0
      - name: challenges_expired
        type: integer
        source: system
        description: "Number of INFO_REQUESTED challenges auto-rejected by this run"
        default: 0
      - name: coaching_marked_overdue
        type: integer
        source: system
        description: "Number of coaching assignments flipped to OVERDUE by this run"
        default: 0
      - name: coaching_waived
        type: integer
        source: system
        description: "Number of coaching assignments waived by this run for SCORE_BELOW_TRIGGER"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Run state; a run is created and completed atomically"
        default: COMPLETED
        constraints: "COMPLETED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: InspectionReport
    initial_state: RECEIVED
    terminal_states: [RESCINDED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /inspection-reports/{id}/validate"
        actor: StateInspectionOfficer
        preconditions:
          - "report.status == RECEIVED"
          - "every violation of the report with unit_type == DRIVER has a non-null driver_id on either the violation or the report, else ERR_DRIVER_ATTRIBUTION_MISSING"
        side_effects:
          - "no score is written yet; total_time_weighted_severity stays 0.0"
          - "refreshes InspectionReport.updated_at and increments InspectionReport.version by 1"
      - from: VALIDATED
        to: SCORED
        trigger: "POST /inspection-reports/{id}/score"
        actor: StateInspectionOfficer | FmcsaProgramAuditor
        preconditions:
          - "report.status IN {VALIDATED, AMENDED}"
          - "for every basic_category holding at least one includable violation of the report's attributed carrier, an InterventionThreshold row is selectable, else ERR_THRESHOLD_NOT_CONFIGURED"
        side_effects:
          - "pins code_weight_snapshot, oos_add_on_snapshot, pinned_violation_code_version, time_weight and severity_basis_utc on every violation with status IN {ACTIVE, RECODED} per calculations.violation_severity_pin"
          - "recomputes Violation.time_weighted_severity, then InspectionReport.total_time_weighted_severity and active_violation_count"
          - "because the report's totals changed, recomputes all four BasicScore rows of report.attributed_carrier_id per calculations.basic_measure_recompute"
          - "because BasicScore.alert_status may have changed, recomputes Carrier.open_alert_count, max_percentile and intervention_status per calculations.intervention_posture"
          - "because the carrier's percentiles changed, recomputes Carrier.iss_pre_credit_value, data_quality_credit_pct, iss_value and selection_band per calculations.screening_risk_recompute"
          - "recomputes Driver.strict_attribution_score / adjudicated_attribution_score / coaching_required for every driver referenced by the report's violations"
          - "sets scored_at and severity_basis_utc; increments InspectionReport.version by 1"
      - from: AMENDED
        to: SCORED
        trigger: "POST /inspection-reports/{id}/score"
        actor: StateInspectionOfficer | FmcsaProgramAuditor
        preconditions:
          - "report.status IN {VALIDATED, AMENDED}"
        side_effects:
          - "identical to the VALIDATED -> SCORED side effects; re-pins weights so a post-amendment code change takes effect"
        note: "SCORED -> AMENDED -> SCORED is the correction cycle; while AMENDED the report is excluded from every measure."
      - from: SCORED
        to: AMENDED
        trigger: "POST /inspection-reports/{id}/amendments"
        actor: StateInspectionOfficer
        preconditions:
          - "report.status IN {VALIDATED, SCORED, AMENDED}"
          - "expected_report_version == report.version, else ERR_STALE_REPORT_VERSION"
          - "target_violation_id, corrected_violation_code_id, corrected_driver_id and corrected_carrier_id satisfy the amendment_type's conditional requirements, else ERR_AMENDMENT_PAYLOAD_INCOMPLETE"
          - "target_violation_id, when supplied, belongs to this report, else ERR_AMENDMENT_TARGET_MISMATCH"
        side_effects:
          - "VIOLATION_CODE_CORRECTION: sets target violation effective_violation_code_id and status := RECODED"
          - "DRIVER_ATTRIBUTION_CORRECTION: sets target violation driver_id := corrected_driver_id"
          - "CARRIER_REATTRIBUTION: sets report.original_carrier_id := old attributed_carrier_id, attributed_carrier_id := corrected_carrier_id, reattributed := true, and rewrites attributed_carrier_id on every violation of the report"
          - "VIOLATION_REMOVAL: sets target violation status := REMOVED, removal_reason := AMENDMENT_REMOVAL, time_weighted_severity := 0.0"
          - "because the report left SCORED, recomputes all four BasicScore rows of the old and (for CARRIER_REATTRIBUTION) the new attributed carrier, which in turn recomputes each carrier's intervention posture and screening risk"
          - "because violation attribution may have changed, recomputes affected Driver aggregates and waives their ASSIGNED/IN_PROGRESS coaching assignments whose linked violation became REMOVED (waived_reason VIOLATION_REMOVED) or lost its driver (waived_reason ATTRIBUTION_CLEARED)"
          - "writes the ReportAmendment row with report_version_before/report_version_after; increments InspectionReport.version by 1"
      - from: VALIDATED
        to: AMENDED
        trigger: "POST /inspection-reports/{id}/amendments"
        actor: StateInspectionOfficer
        preconditions:
          - "report.status IN {VALIDATED, SCORED, AMENDED}"
          - "expected_report_version == report.version, else ERR_STALE_REPORT_VERSION"
        side_effects:
          - "same correction side effects as SCORED -> AMENDED; no score recompute is needed because the report was never scored"
      - from: SCORED
        to: RESCINDED
        trigger: "system: DataChallenge review action RESOLVE_ACCEPT on a DUPLICATE_REPORT challenge"
        actor: system
        preconditions:
          - "challenge.challenge_type == DUPLICATE_REPORT and challenge.status == UNDER_REVIEW"
          - "duplicate_of_report_id references a report with the same vehicle_vin and same attributed_carrier_id whose status != RESCINDED, else ERR_DUPLICATE_TARGET_INVALID"
        side_effects:
          - "sets duplicate_master_report_id := challenge.duplicate_of_report_id"
          - "because the report was rescinded, every violation of the report moves to REMOVED with removal_reason DUPLICATE_RESCINDED and time_weighted_severity := 0.0"
          - "because those violations left the scored population, all four BasicScore rows of the carrier are recomputed (relevant_inspection_count drops by one)"
          - "because alert_status may have changed, Carrier.open_alert_count / intervention_status recompute, and then Carrier screening risk recomputes"
          - "because attributed violations disappeared, affected Driver aggregates recompute and their ASSIGNED/IN_PROGRESS coaching assignments are waived with waived_reason VIOLATION_REMOVED"
      - from: VALIDATED
        to: RESCINDED
        trigger: "system: DataChallenge review action RESOLVE_ACCEPT on a DUPLICATE_REPORT challenge"
        actor: system
        preconditions:
          - "same as SCORED -> RESCINDED"
        side_effects:
          - "violations move to REMOVED; no score recompute is required because the report was never scored"

  - entity: DataChallenge
    initial_state: DRAFT
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /data-challenges/{id}/submit"
        actor: CarrierAnalyst
        preconditions:
          - "challenge.status IN {DRAFT, INFO_REQUESTED}"
          - "report.status IN {VALIDATED, SCORED, AMENDED}, else ERR_INVALID_REPORT_STATE"
          - "whole days between report.inspection_start and the logical clock <= CHALLENGE_FILING_WINDOW_DAYS (730), else ERR_CHALLENGE_FILING_WINDOW_CLOSED"
          - "evidence_count satisfies the challenge_type's required evidence set, else ERR_EVIDENCE_REQUIRED"
          - "no other challenge with the same (report_id, challenge_type, target_violation_id) is in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED}, else ERR_DUPLICATE_OPEN_CHALLENGE"
          - "carrier.challenge_quota_used < carrier.challenge_quota_limit, else ERR_CHALLENGE_QUOTA_EXCEEDED"
        side_effects:
          - "sets submitted_at and filing_age_days_at_submit"
          - "increments Carrier.challenge_quota_used by 1"
          - "sets under_challenge := true on the covered violations (target_violation_id only for INCORRECT_VIOLATION_CODE and VIOLATION_NOT_SUPPORTED; every violation of the report for WRONG_CARRIER and DUPLICATE_REPORT)"
          - "because under_challenge changed, recomputes the affected BasicScore rows' challenged_time_weighted_severity and certified_measure, which changes percentile and alert_status"
          - "because alert_status changed, Carrier.open_alert_count / max_percentile / intervention_status recompute, and then Carrier screening risk recomputes"
          - "increments DataChallenge.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /data-challenges/{id}/submit"
        actor: CarrierAnalyst
        preconditions:
          - "challenge.status IN {DRAFT, INFO_REQUESTED}"
          - "logical clock <= info_response_deadline, else ERR_INFO_RESPONSE_WINDOW_CLOSED"
          - "at least one ChallengeEvidence row exists with submitted_round == challenge.info_request_count, else ERR_EVIDENCE_REQUIRED"
        side_effects:
          - "sets submitted_at and filing_age_days_at_submit; leaves under_challenge and challenge_quota_used untouched (the round was already counted)"
          - "increments DataChallenge.version by 1"
        note: "Cycle closer: UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED -> UNDER_REVIEW, at most MAX_INFO_ROUNDS (3) rounds."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /data-challenges/{id}/review with action ASSIGN"
        actor: FmcsaReviewOfficer
        preconditions:
          - "challenge.status == SUBMITTED"
        side_effects:
          - "records the reviewing officer; increments DataChallenge.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /data-challenges/{id}/review with action REQUEST_INFO"
        actor: FmcsaReviewOfficer
        preconditions:
          - "challenge.status == UNDER_REVIEW"
          - "info_request_count < MAX_INFO_ROUNDS (3), else ERR_CHALLENGE_ROUND_LIMIT_EXCEEDED"
        side_effects:
          - "increments info_request_count by 1 and sets info_response_deadline := logical clock + 30 days"
          - "increments DataChallenge.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_ACCEPTED
        trigger: "POST /data-challenges/{id}/review with action RESOLVE_ACCEPT"
        actor: FmcsaReviewOfficer
        preconditions:
          - "challenge.status == UNDER_REVIEW"
          - "for VIOLATION_NOT_SUPPORTED and INCORRECT_VIOLATION_CODE on an out-of-service violation, a non-superseded CitationAdjudication with court_status IN {DISMISSED, NOT_GUILTY} exists on the target, else ERR_OOS_REMOVAL_REQUIRES_ADJUDICATION"
          - "for DUPLICATE_REPORT, duplicate_of_report_id is valid per ERR_DUPLICATE_TARGET_INVALID"
        side_effects:
          - "sets resolved_at, resolved_by_user_id, status := RESOLVED_ACCEPTED and the type-specific resolution_disposition"
          - "clears under_challenge on the covered violations"
          - "WRONG_CARRIER (disposition REATTRIBUTED): rewrites InspectionReport.attributed_carrier_id, sets original_carrier_id and reattributed := true; that report mutation rewrites attributed_carrier_id on every violation of the report and clears driver_id on violations whose driver belongs to a different carrier; those violation mutations force a BasicScore recompute for the losing and the gaining carrier; each BasicScore change forces that carrier's intervention posture recompute; each posture change forces that carrier's screening-risk recompute; each cleared driver_id forces a Driver aggregate recompute which waives that driver's ASSIGNED/IN_PROGRESS coaching assignments with waived_reason ATTRIBUTION_CLEARED"
          - "DUPLICATE_REPORT (disposition REPORT_RESCINDED): drives InspectionReport SCORED -> RESCINDED with the cascade declared there"
          - "INCORRECT_VIOLATION_CODE (disposition CODE_CORRECTED): sets target violation effective_violation_code_id := asserted_correct_violation_code_id, status := RECODED, re-pins code_weight_snapshot / oos_add_on_snapshot / pinned_violation_code_version and recomputes time_weighted_severity; the changed violation forces a BasicScore recompute of both affected categories, which forces intervention-posture and screening-risk recomputes; also writes a ReportAmendment row with source_challenge_id"
          - "VIOLATION_NOT_SUPPORTED (disposition VIOLATION_REMOVED): sets target violation status := REMOVED, removal_reason := CHALLENGE_ACCEPTED, time_weighted_severity := 0.0; the removal forces BasicScore, intervention-posture and screening-risk recomputes, plus a Driver aggregate recompute that waives coaching assignments linked to that violation with waived_reason VIOLATION_REMOVED"
          - "recomputes Carrier.accepted_challenge_count_24mo and resolved_challenge_count_24mo before the screening-risk recompute so the data-quality credit sees this resolution"
          - "increments DataChallenge.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED_REJECTED
        trigger: "POST /data-challenges/{id}/review with action RESOLVE_REJECT"
        actor: FmcsaReviewOfficer
        preconditions:
          - "challenge.status == UNDER_REVIEW"
          - "resolution_disposition IN {INSUFFICIENT_EVIDENCE, NOT_SUBSTANTIATED} supplied in the body, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets resolved_at, resolved_by_user_id, resolution_disposition and status := RESOLVED_REJECTED"
          - "clears under_challenge on the covered violations, which restores certified_measure, which recomputes percentile and alert_status, which recomputes the carrier's intervention posture and then its screening risk"
          - "recomputes Carrier.resolved_challenge_count_24mo (accepted_challenge_count_24mo unchanged)"
          - "increments DataChallenge.version by 1"
      - from: INFO_REQUESTED
        to: RESOLVED_REJECTED
        trigger: "system: POST /scoring-runs when info_response_deadline < run.snapshot_utc"
        actor: system
        preconditions:
          - "challenge.status == INFO_REQUESTED"
          - "challenge.info_response_deadline < run.snapshot_utc"
        side_effects:
          - "sets resolution_disposition := EXPIRED_NO_RESPONSE, resolved_at := run.snapshot_utc, resolved_by_user_id := null"
          - "clears under_challenge on the covered violations, which restores certified_measure and cascades through alert_status, intervention posture and screening risk"
          - "increments ScoringRun.challenges_expired by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /data-challenges/{id}/withdraw"
        actor: CarrierAnalyst
        preconditions:
          - "challenge.status IN {DRAFT, SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "no quota adjustment: a DRAFT challenge never consumed quota"
          - "increments DataChallenge.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /data-challenges/{id}/withdraw"
        actor: CarrierAnalyst
        preconditions:
          - "challenge.status IN {DRAFT, SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "decrements Carrier.challenge_quota_used by 1 (compensation for the submit increment)"
          - "clears under_challenge on the covered violations, which restores certified_measure and cascades through alert_status, intervention posture and screening risk"
          - "increments DataChallenge.version by 1"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /data-challenges/{id}/withdraw"
        actor: CarrierAnalyst
        preconditions:
          - "challenge.status IN {DRAFT, SUBMITTED, INFO_REQUESTED}"
        side_effects:
          - "decrements Carrier.challenge_quota_used by 1 and clears under_challenge with the same downstream cascade as SUBMITTED -> WITHDRAWN"

  - entity: CitationAdjudication
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CONVICTED
        trigger: "POST /citation-adjudications/{id}/court-result with court_status CONVICTED"
        actor: StateInspectionOfficer
        preconditions:
          - "adjudication.court_status == PENDING"
          - "adjudication.superseded == false, else ERR_ADJUDICATION_SUPERSEDED"
        side_effects:
          - "sets court_result_recorded_at and severity_factor := 1.0"
          - "record_update_status stays NOT_APPLIED: the record dimension is independent of the court dimension"
          - "recomputes the linked violation's driver aggregates (adjudicated_attribution_score) because severity_factor is an input to them"
      - from: PENDING
        to: DISMISSED
        trigger: "POST /citation-adjudications/{id}/court-result with court_status DISMISSED"
        actor: StateInspectionOfficer
        preconditions:
          - "adjudication.court_status == PENDING"
        side_effects:
          - "sets severity_factor := 0.0 and court_result_recorded_at"
          - "recomputes Driver.adjudicated_attribution_score for the violation's driver, which now diverges from strict_attribution_score because the violation record itself is untouched until apply-to-record runs"
          - "if that recompute drops coaching_required to false, ASSIGNED/IN_PROGRESS coaching assignments remain untouched (only a scoring run waives on score)"
      - from: PENDING
        to: REDUCED
        trigger: "POST /citation-adjudications/{id}/court-result with court_status REDUCED"
        actor: StateInspectionOfficer
        preconditions:
          - "adjudication.court_status == PENDING"
          - "reduced_to_violation_code_id supplied, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets severity_factor := 0.5, reduced_to_violation_code_id and court_result_recorded_at"
          - "recomputes Driver.adjudicated_attribution_score for the violation's driver"
      - from: PENDING
        to: NOT_GUILTY
        trigger: "POST /citation-adjudications/{id}/court-result with court_status NOT_GUILTY"
        actor: StateInspectionOfficer
        preconditions:
          - "adjudication.court_status == PENDING"
        side_effects:
          - "sets severity_factor := 0.0 and court_result_recorded_at; recomputes Driver.adjudicated_attribution_score"
      - from: NOT_APPLIED
        to: APPLIED
        trigger: "POST /citation-adjudications/{id}/apply-to-record (court_status IN {DISMISSED, NOT_GUILTY, REDUCED})"
        actor: FmcsaReviewOfficer
        preconditions:
          - "adjudication.record_update_status == NOT_APPLIED, else ERR_ALREADY_APPLIED_TO_RECORD"
          - "adjudication.court_status != PENDING, else ERR_INVALID_ADJUDICATION_STATE"
          - "linked violation.status IN {ACTIVE, RECODED}, else ERR_VIOLATION_NOT_ACTIVE"
        side_effects:
          - "DISMISSED or NOT_GUILTY: sets violation.status := REMOVED, removal_reason := ADJUDICATION_DISMISSED, time_weighted_severity := 0.0"
          - "REDUCED: sets violation.effective_violation_code_id := reduced_to_violation_code_id, status := RECODED, re-pins code_weight_snapshot / oos_add_on_snapshot / pinned_violation_code_version and recomputes time_weighted_severity"
          - "because the violation record changed, InspectionReport.active_violation_count and total_time_weighted_severity recompute"
          - "because the report totals changed, the carrier's BasicScore rows for the affected categories recompute"
          - "because alert_status may have changed, Carrier.open_alert_count / max_percentile / intervention_status recompute, then Carrier screening risk recomputes"
          - "because the violation left or changed the driver's attributed set, Driver aggregates recompute; every ASSIGNED/IN_PROGRESS CoachingAssignment whose violation_id points at a now-REMOVED violation moves to WAIVED with waived_reason VIOLATION_REMOVED, which decrements Carrier.open_coaching_count"
          - "sets applied_at, applied_by_user_id; increments CitationAdjudication.version by 1"
        note: "Second, independent state dimension on the same row: record_update_status evolves without constraining court_status."
      - from: NOT_APPLIED
        to: NOT_APPLICABLE
        trigger: "POST /citation-adjudications/{id}/apply-to-record (court_status == CONVICTED)"
        actor: FmcsaReviewOfficer
        preconditions:
          - "adjudication.record_update_status == NOT_APPLIED"
          - "adjudication.court_status == CONVICTED"
        side_effects:
          - "leaves the violation record untouched: a conviction confirms the citation"
          - "sets applied_at, applied_by_user_id and record_update_status := NOT_APPLICABLE; increments CitationAdjudication.version by 1"

  - entity: CoachingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, WAIVED, ESCALATED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /coaching-assignments/{id}/start"
        actor: CarrierSafetyManager
        preconditions:
          - "assignment.status IN {ASSIGNED, OVERDUE}"
          - "driver.employment_status == ACTIVE, else ERR_DRIVER_NOT_EMPLOYED"
        side_effects:
          - "sets started_at; increments CoachingAssignment.version by 1"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /coaching-assignments/{id}/start"
        actor: CarrierSafetyManager
        preconditions:
          - "assignment.status IN {ASSIGNED, OVERDUE}"
        side_effects:
          - "sets started_at; the OVERDUE stamp (overdue_marked_run_id) is retained for audit"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /coaching-assignments/{id}/complete"
        actor: CarrierSafetyManager
        preconditions:
          - "assignment.status == IN_PROGRESS"
        side_effects:
          - "sets completed_at and attestation_note"
          - "decrements Carrier.open_coaching_count and Driver.open_coaching_count"
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system: POST /scoring-runs when due_at < run.snapshot_utc"
        actor: system
        preconditions:
          - "assignment.status IN {ASSIGNED, IN_PROGRESS}"
          - "assignment.due_at < run.snapshot_utc"
        side_effects:
          - "sets overdue_marked_run_id := run.id; increments ScoringRun.coaching_marked_overdue by 1"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system: POST /scoring-runs when due_at < run.snapshot_utc"
        actor: system
        preconditions:
          - "assignment.status IN {ASSIGNED, IN_PROGRESS}"
          - "assignment.due_at < run.snapshot_utc"
        side_effects:
          - "sets overdue_marked_run_id := run.id; increments ScoringRun.coaching_marked_overdue by 1"
      - from: OVERDUE
        to: ESCALATED
        trigger: "system: POST /scoring-runs when due_at + 30 days < run.snapshot_utc"
        actor: system
        preconditions:
          - "assignment.status == OVERDUE"
          - "assignment.due_at + 30 days < run.snapshot_utc"
        side_effects:
          - "decrements Carrier.open_coaching_count and Driver.open_coaching_count"
      - from: ASSIGNED
        to: WAIVED
        trigger: "system: violation removal cascade, driver termination, or POST /scoring-runs score sweep"
        actor: system
        preconditions:
          - "assignment.status IN {ASSIGNED, IN_PROGRESS, OVERDUE}"
          - "one of: linked violation.status == REMOVED; linked violation.driver_id no longer equals assignment.driver_id; driver.employment_status == TERMINATED; run sweep observes driver.coaching_required == false"
        side_effects:
          - "sets waived_reason to VIOLATION_REMOVED, ATTRIBUTION_CLEARED, DRIVER_SEPARATED or SCORE_BELOW_TRIGGER respectively"
          - "decrements Carrier.open_coaching_count and Driver.open_coaching_count"
      - from: IN_PROGRESS
        to: WAIVED
        trigger: "system: violation removal cascade, driver termination, or POST /scoring-runs score sweep"
        actor: system
        preconditions:
          - "same as ASSIGNED -> WAIVED"
        side_effects:
          - "same as ASSIGNED -> WAIVED"

  - entity: CorrectiveActionPlan
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/submit"
        actor: CarrierSafetyManager
        preconditions:
          - "cap.status IN {DRAFT, RETURNED}"
          - "cap.item_count >= 1 and cap.committed_item_count == cap.item_count, else ERR_CAP_ITEMS_INCOMPLETE"
          - "carrier.safety_fitness_status IN {CONDITIONAL, UNSATISFACTORY}, else ERR_CAP_NOT_REQUIRED"
        side_effects:
          - "clears any prior branch review outcomes and reviewer ids so the fork restarts"
          - "increments CorrectiveActionPlan.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/submit"
        actor: CarrierSafetyManager
        preconditions:
          - "cap.status IN {DRAFT, RETURNED}"
          - "cap.item_count >= 1 and cap.committed_item_count == cap.item_count"
        side_effects:
          - "same as DRAFT -> SUBMITTED; this is the revision loop"
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /corrective-action-plans/{id}/reviews (first branch, outcome CLEARED)"
        actor: FmcsaProgramAuditor
        preconditions:
          - "cap.status IN {SUBMITTED, IN_REVIEW}"
          - "the named branch has no recorded outcome yet, else ERR_REVIEW_BRANCH_ALREADY_RECORDED"
          - "X-User-ID differs from the other branch's reviewer id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "records safety_review_outcome / safety_review_user_id or data_review_outcome / data_review_user_id"
          - "increments CorrectiveActionPlan.version by 1"
      - from: IN_REVIEW
        to: PENDING_DECISION
        trigger: "system: join condition met after a reviews call or a cap-action-items status VERIFY"
        actor: system
        preconditions:
          - "safety_review_outcome == CLEARED and data_review_outcome == CLEARED"
          - "cap.completion_pct == 100.0 (every non-rejected action item is VERIFIED)"
        side_effects:
          - "no field other than status changes; increments CorrectiveActionPlan.version by 1"
        note: "Fork-join with a compound guard: both branch reviews plus the aggregate child condition."
      - from: IN_REVIEW
        to: RETURNED
        trigger: "POST /corrective-action-plans/{id}/reviews with outcome DEFICIENT"
        actor: FmcsaProgramAuditor
        preconditions:
          - "cap.status IN {SUBMITTED, IN_REVIEW}"
          - "the named branch has no recorded outcome yet"
        side_effects:
          - "records the branch outcome as DEFICIENT and short-circuits the join: status := RETURNED without waiting for the other branch"
          - "increments CorrectiveActionPlan.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /corrective-action-plans/{id}/reviews with outcome DEFICIENT"
        actor: FmcsaProgramAuditor
        preconditions:
          - "cap.status IN {SUBMITTED, IN_REVIEW}"
        side_effects:
          - "same as IN_REVIEW -> RETURNED"
      - from: PENDING_DECISION
        to: ACCEPTED
        trigger: "POST /corrective-action-plans/{id}/decision with decision ACCEPT"
        actor: FmcsaProgramAuditor
        preconditions:
          - "cap.status == PENDING_DECISION, else ERR_INVALID_CAP_STATE"
          - "X-User-ID != carrier.fitness_determined_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets decision := ACCEPT, decided_by_user_id, decided_at"
          - "upgrades carrier.safety_fitness_status one step: UNSATISFACTORY -> CONDITIONAL, CONDITIONAL -> SATISFACTORY"
          - "increments Carrier.version by 1 and CorrectiveActionPlan.version by 1"
      - from: PENDING_DECISION
        to: RETURNED
        trigger: "POST /corrective-action-plans/{id}/decision with decision RETURN"
        actor: FmcsaProgramAuditor
        preconditions:
          - "cap.status == PENDING_DECISION"
          - "X-User-ID != carrier.fitness_determined_by_user_id"
        side_effects:
          - "sets decision := RETURN, decided_by_user_id, decided_at; carrier.safety_fitness_status is unchanged"
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system: POST /corrective-action-plans creates a replacement plan for the same carrier"
        actor: system
        preconditions:
          - "the prior plan's status == RETURNED"
        side_effects:
          - "sets the new plan's superseded_cap_id := prior plan id and the prior plan's status := SUPERSEDED"
          - "increments the prior plan's version by 1"

  - entity: CapActionItem
    initial_state: PROPOSED
    terminal_states: []
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /cap-action-items/{id}/status with action COMMIT"
        actor: CarrierAnalyst
        preconditions:
          - "item.status IN {PROPOSED, REJECTED_ITEM}"
          - "cap.status IN {DRAFT, RETURNED, SUBMITTED, IN_REVIEW}, else ERR_INVALID_CAP_STATE"
        side_effects:
          - "recomputes cap.item_count / committed_item_count / verified_item_count / completion_pct"
      - from: REJECTED_ITEM
        to: COMMITTED
        trigger: "POST /cap-action-items/{id}/status with action COMMIT"
        actor: CarrierAnalyst
        preconditions:
          - "item.status IN {PROPOSED, REJECTED_ITEM}"
        side_effects:
          - "recomputes the plan's aggregates; this is the item-level revision loop"
      - from: COMMITTED
        to: IMPLEMENTED
        trigger: "POST /cap-action-items/{id}/status with action IMPLEMENT"
        actor: CarrierSafetyManager
        preconditions:
          - "item.status == COMMITTED"
        side_effects:
          - "recomputes the plan's aggregates"
      - from: IMPLEMENTED
        to: VERIFIED
        trigger: "POST /cap-action-items/{id}/status with action VERIFY"
        actor: FmcsaProgramAuditor
        preconditions:
          - "item.status == IMPLEMENTED"
        side_effects:
          - "sets verified_by_user_id; recomputes cap.verified_item_count and completion_pct"
          - "because completion_pct may have reached 100.0, evaluates the CAP join condition and may drive IN_REVIEW -> PENDING_DECISION"
      - from: IMPLEMENTED
        to: REJECTED_ITEM
        trigger: "POST /cap-action-items/{id}/status with action REJECT"
        actor: FmcsaProgramAuditor
        preconditions:
          - "item.status IN {COMMITTED, IMPLEMENTED}"
        side_effects:
          - "sets rejection_note; the item drops out of item_count, which raises completion_pct for the remaining items"
      - from: COMMITTED
        to: REJECTED_ITEM
        trigger: "POST /cap-action-items/{id}/status with action REJECT"
        actor: FmcsaProgramAuditor
        preconditions:
          - "item.status IN {COMMITTED, IMPLEMENTED}"
        side_effects:
          - "same as IMPLEMENTED -> REJECTED_ITEM"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: cap-create-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /corrective-action-plans"
    occ_field: "expected_carrier_version"
    description: |
      Creating a CorrectiveActionPlan against a Carrier whose version has advanced
      since the client last read it is rejected. This captures the create-with-supersede
      case: a plan created for a carrier whose prior RETURNED plan has just been
      superseded (or whose fitness determination has just been re-issued) legitimately
      replaces the earlier plan, so the writer's view of the carrier must be current.
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

  - rule_id: amendment-create-stale-report
    parent_entity: InspectionReport
    write_endpoint: "POST /inspection-reports/{id}/amendments"
    occ_field: "expected_report_version"
    description: |
      Filing a ReportAmendment against an InspectionReport whose version has advanced
      since the client last read it is rejected. A later amendment legitimately supersedes
      an earlier correction of the same violation, so the amendment must be written against
      the report state the issuing officer actually reviewed.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

  - rule_id: adjudication-create-stale-violation
    parent_entity: Violation
    write_endpoint: "POST /citation-adjudications"
    occ_field: "expected_violation_version"
    description: |
      Creating a CitationAdjudication against a Violation whose version has advanced
      since the client last read it is rejected. An appeal outcome legitimately supersedes
      the prior adjudication of the same violation, so the new record must be written
      against the violation state the filer observed.
    error_id: ERR_STALE_VIOLATION_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: violation_severity_pin
    trigger: "POST /inspection-reports/{id}/score; POST /scoring-runs; and every side effect that re-pins a violation (challenge CODE_CORRECTED, amendment VIOLATION_CODE_CORRECTION, adjudication REDUCED applied)"
    algorithm: decay_function
    formula: |
      basis_utc      = ScoringRun.snapshot_utc when the pin runs inside a run,
                       otherwise the current logical clock
      age_days       = floor((basis_utc - report.inspection_start) / 86400 seconds)
      time_weight    = 3 when age_days <= 182
                       2 when 183 <= age_days <= 365
                       1 when 366 <= age_days <= 730
                       0 when age_days >= 731
      code           = ViolationCode identified by violation.effective_violation_code_id
      code_weight_snapshot         = code.severity_weight
      oos_add_on_snapshot          = code.oos_add_on when violation.out_of_service else 0
      pinned_violation_code_version = code.version
      time_weighted_severity = (code_weight_snapshot + oos_add_on_snapshot) * time_weight
      # REMOVED violations are forced to time_weighted_severity = 0.0 and are never re-pinned.
    input_set: "Violations with status IN {ACTIVE, RECODED} whose report.status IN {VALIDATED, SCORED, AMENDED}"
    constants:
      WEIGHT_3_MAX_AGE_DAYS: 182
      WEIGHT_2_MAX_AGE_DAYS: 365
      WEIGHT_1_MAX_AGE_DAYS: 730
    precision: "time_weighted_severity is exact to 1 decimal (integer inputs); age_days is whole days, floor"
    variants:
      - name: pinned_weight
        when: "between two scoring passes"
        difference: "the pinned snapshot governs the score even after ViolationCode.severity_weight changes; has_stale_code_pin becomes true and the score only moves at the next pass"
      - name: repinned_weight
        when: "a scoring pass or a correction side effect runs"
        difference: "the current ViolationCode row is read again and the snapshot is overwritten"

  - name: basic_measure_recompute
    trigger: "Every side effect that declares 'recomputes BasicScore rows' — report scoring, amendment, rescission, challenge submit/withdraw/resolution, adjudication apply-to-record, and POST /scoring-runs"
    algorithm: weighted_scoring
    formula: |
      # Denominator inputs
      vmt_per_pu          = carrier.annual_vmt / max(1, carrier.average_power_units)
      utilization_factor  = 1.0 when vmt_per_pu < 20000
                            1.2 when 20000 <= vmt_per_pu < 60000
                            1.5 when 60000 <= vmt_per_pu < 100000
                            1.8 when vmt_per_pu >= 100000
      power_unit_exposure = max(1.0, carrier.average_power_units * utilization_factor)
      relevant_inspection_count = count of InspectionReport rows with
                            attributed_carrier_id == carrier.id
                            AND status == SCORED
                            AND floor((snapshot_utc - inspection_start)/86400) <= 730
      denominator_value(k) =
            k == VEHICLE_MAINTENANCE -> max(1.0, relevant_inspection_count)
            k == HOURS_OF_SERVICE    -> max(1.0, min(power_unit_exposure, relevant_inspection_count * 2.0))
            otherwise                -> power_unit_exposure
      # Numerators, over included violations of category k:
      #   status IN {ACTIVE, RECODED} AND report.status == SCORED
      #   AND report.attributed_carrier_id == carrier.id AND time_weight > 0
      total_time_weighted_severity      = sum(v.time_weighted_severity)
      challenged_time_weighted_severity = sum(v.time_weighted_severity where v.under_challenge)
      included_violation_count          = count(v)
      provisional_measure = round_half_up(total_time_weighted_severity / denominator_value(k), 3)
      certified_measure   = round_half_up((total_time_weighted_severity
                                           - challenged_time_weighted_severity)
                                          / denominator_value(k), 3)
      # Threshold selection (deterministic):
      #   candidates: InterventionThreshold rows with basic_category == k
      #               AND carrier_segment == carrier.carrier_segment
      #               AND effective_from <= snapshot_utc
      #   ranking: effective_from DESC, then created_at DESC
      #   empty candidate set AND included_violation_count > 0 -> ERR_THRESHOLD_NOT_CONFIGURED
      #   empty candidate set AND included_violation_count == 0 -> threshold_id := null
      m = certified_measure ; t = selected threshold row
      percentile =
            relevant_inspection_count == 0 -> null
            m <= 0                         -> 0.0
            m <= t.measure_at_p50          -> round_half_up(50.0 * m / t.measure_at_p50, 1)
            m <= t.measure_at_p65          -> round_half_up(50.0 + 15.0 * (m - t.measure_at_p50)
                                                            / (t.measure_at_p65 - t.measure_at_p50), 1)
            m <= t.measure_at_p80          -> round_half_up(65.0 + 15.0 * (m - t.measure_at_p65)
                                                            / (t.measure_at_p80 - t.measure_at_p65), 1)
            otherwise                      -> round_half_up(min(100.0, 80.0 + 20.0
                                                            * (m - t.measure_at_p80) / t.measure_at_p80), 1)
      alert_status =
            relevant_inspection_count == 0            -> NOT_ENOUGH_DATA
            percentile >= t.intervention_percentile   -> ALERT
            percentile >= t.monitor_percentile        -> MONITOR
            otherwise                                 -> CLEAR
      # threshold_id == null (no included violations) => percentile 0.0, alert_status CLEAR
      # unless relevant_inspection_count == 0, which wins and yields NOT_ENOUGH_DATA.
    input_set: "One row per (carrier_id, basic_category); rows are created lazily on the first scoring event for the carrier and updated in place thereafter (never duplicated)"
    constants:
      LOOKBACK_DAYS: 730
      UTILIZATION_TIER_1_MAX_VMT_PER_PU: 20000
      UTILIZATION_TIER_2_MAX_VMT_PER_PU: 60000
      UTILIZATION_TIER_3_MAX_VMT_PER_PU: 100000
      HOS_INSPECTION_MULTIPLIER: 2.0
    precision: "measures 3 decimals round_half_up; percentile 1 decimal round_half_up; percentile is computed from the already-rounded certified_measure"
    variants:
      - name: provisional_measure
        when: "reported to the carrier as the all-data view"
        difference: "includes violations with under_challenge == true in the numerator"
      - name: certified_measure
        when: "drives percentile, alert_status, intervention posture and screening risk"
        difference: "subtracts challenged_time_weighted_severity, so filing a challenge immediately lowers the operative measure while the report data is untouched"

  - name: intervention_posture
    trigger: "Every side effect that declares 'recomputes Carrier.open_alert_count / intervention_status'"
    algorithm: threshold
    formula: |
      open_alert_count = count of this carrier's BasicScore rows with alert_status == ALERT
      max_percentile   = max over the carrier's BasicScore rows of percentile,
                         ignoring rows whose percentile is null; null when every row is null
      investigation_bar = the investigation_percentile of the threshold row selected for the
                          category holding max_percentile
      intervention_status =
            open_alert_count >= 2                                        -> INVESTIGATION
            max_percentile is not null AND max_percentile >= investigation_bar -> INVESTIGATION
            open_alert_count >= 1                                        -> WARNING_LETTER
            otherwise                                                    -> NONE
    input_set: "The four BasicScore rows of one carrier"
    constants:
      INVESTIGATION_ALERT_COUNT: 2
    precision: "counts are integers; max_percentile keeps the 1-decimal precision of its source row"

  - name: screening_risk_recompute
    trigger: "Every side effect that declares 'recomputes Carrier screening risk', immediately after intervention_posture"
    algorithm: waterfall_allocation
    formula: |
      CATEGORY_WEIGHT = { UNSAFE_DRIVING: 0.35, HOURS_OF_SERVICE: 0.30,
                          VEHICLE_MAINTENANCE: 0.25, DRIVER_FITNESS: 0.10 }
      # Step 1 - per-category contribution, ROUNDED FIRST (pinned order).
      contribution(k) = 0.00 when the row's alert_status == NOT_ENOUGH_DATA or percentile is null
                        else round_half_up(BasicScore(k).percentile * CATEGORY_WEIGHT[k], 2)
      # Weights of NOT_ENOUGH_DATA categories are NOT redistributed.
      # Step 2 - sum the already-rounded contributions. Summing unrounded products and
      # rounding once at the end is WRONG and yields a different value.
      raw = contribution(UNSAFE_DRIVING) + contribution(HOURS_OF_SERVICE)
          + contribution(VEHICLE_MAINTENANCE) + contribution(DRIVER_FITNESS)
      oos_adder = min(10.0, carrier.oos_violation_count_24mo * 0.5)
      iss_pre_credit_value = round_half_up(min(100.0, raw + oos_adder), 1)
      # Step 3 - credit tier is keyed on iss_pre_credit_value, NEVER on the adjusted value.
      credit_tier = 0.06 when iss_pre_credit_value >= 75.0
                    0.04 when iss_pre_credit_value >= 50.0
                    0.02 otherwise
      accepted_rate = carrier.accepted_challenge_count_24mo
                      / max(1, carrier.resolved_challenge_count_24mo)
      data_quality_credit_pct = round_half_up(credit_tier * min(1.0, accepted_rate), 4)
      # Step 4 - apply the credit to the already-rounded pre-credit value, then round again.
      iss_value = round_half_up(iss_pre_credit_value * (1.0 - data_quality_credit_pct), 1)
      selection_band = INSPECT when iss_value >= 75.0
                       OPTIONAL when iss_value >= 50.0
                       else PASS
    input_set: "The carrier's four BasicScore rows plus its resolved-challenge counters over the last 730 days"
    constants:
      OOS_ADDER_PER_VIOLATION: 0.5
      OOS_ADDER_CAP: 10.0
      BAND_INSPECT_MIN: 75.0
      BAND_OPTIONAL_MIN: 50.0
    precision: "contributions 2 decimals round_half_up; iss_pre_credit_value and iss_value 1 decimal round_half_up; credit 4 decimals round_half_up"
    variants:
      - name: pre_credit
        when: "stored on Carrier.iss_pre_credit_value and snapshotted onto reports as iss_value_at_selection's basis"
        difference: "no data-quality credit applied; this is the value the credit tier is keyed on"
      - name: post_credit
        when: "stored on Carrier.iss_value and drives selection_band"
        difference: "multiplied by (1 - data_quality_credit_pct); re-deriving the tier from this value is the classic wrong answer"

  - name: driver_attribution_scores
    trigger: "Every side effect that declares 'recomputes Driver aggregates', plus POST /violations/{id}/driver-attribution, DELETE /violations/{id}/driver-attribution and POST /scoring-runs"
    algorithm: aggregation
    formula: |
      # Included set: violations with driver_id == driver.id, status IN {ACTIVE, RECODED},
      # report.status == SCORED, time_weight > 0.
      attributed_violation_count = count of violations with driver_id == driver.id
                                   AND status IN {ACTIVE, RECODED} AND report.status == SCORED
      strict_attribution_score = round_half_up(sum over the included set
                                               of v.time_weighted_severity, 2)
      # Per-violation factor: the violation's non-superseded CitationAdjudication with the
      # latest court_result_recorded_at; ties broken by created_at DESC. No adjudication,
      # or court_status PENDING -> factor 1.0.
      factor(v) = 0.0 when court_status IN {DISMISSED, NOT_GUILTY}
                  0.5 when court_status == REDUCED
                  1.0 otherwise
      adjudicated_attribution_score = round_half_up(sum over the included set
                                        of v.time_weighted_severity * factor(v), 2)
      coaching_required = adjudicated_attribution_score >= COACHING_TRIGGER
    input_set: "Violations attributed to one driver on SCORED reports with time_weight > 0"
    constants:
      COACHING_TRIGGER: 12.0
    precision: "2 decimals round_half_up on both scores"
    variants:
      - name: strict_attribution
        when: "reported as the carrier's raw exposure per driver"
        difference: "ignores court outcomes entirely, so a DISMISSED-but-not-yet-applied citation still counts"
      - name: adjudicated_attribution
        when: "drives coaching_required and the scoring run's coaching waiver sweep"
        difference: "multiplies each violation by its adjudication severity_factor, so it diverges from strict_attribution the moment a court result is recorded and before apply-to-record touches the record"

  - name: challenge_quota_ledger
    trigger: "POST /data-challenges/{id}/submit (increment), POST /data-challenges/{id}/withdraw (decrement), POST /scoring-runs (full re-derivation)"
    algorithm: chronological
    formula: |
      challenge_quota_limit = 1 when carrier.carrier_segment == SMALL
                              3 when MEDIUM
                              6 when LARGE
      # Incremental maintenance between runs:
      submit   -> challenge_quota_used += 1
      withdraw -> challenge_quota_used -= 1   (floor 0)
      # Full re-derivation performed by every scoring run, in ascending
      # DataChallenge.submitted_at order (ties broken by created_at ASC):
      challenge_quota_used = count of this carrier's challenges with
            status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED,
                       RESOLVED_ACCEPTED, RESOLVED_REJECTED}
            AND submitted_at > run.snapshot_utc - 30 days
            AND submitted_at <= run.snapshot_utc
      # Withdrawn and never-submitted challenges are excluded from the re-derivation.
    input_set: "DataChallenge rows of one carrier with a non-null submitted_at"
    constants:
      QUOTA_WINDOW_DAYS: 30
      QUOTA_LIMIT_SMALL: 1
      QUOTA_LIMIT_MEDIUM: 3
      QUOTA_LIMIT_LARGE: 6
    precision: "integer counter, floored at 0"

  - name: cap_completion_rollup
    trigger: "Every POST /corrective-action-plans/{id}/action-items and POST /cap-action-items/{id}/status"
    algorithm: aggregation
    formula: |
      item_count           = count of items with status != REJECTED_ITEM
      committed_item_count = count of items with status IN {COMMITTED, IMPLEMENTED, VERIFIED}
      verified_item_count  = count of items with status == VERIFIED
      completion_pct       = round_half_up(100.0 * verified_item_count / max(1, item_count), 1)
      # Join guard evaluated after every rollup:
      # cap.status == IN_REVIEW AND safety_review_outcome == CLEARED
      #   AND data_review_outcome == CLEARED AND completion_pct == 100.0
      #   -> cap.status := PENDING_DECISION
    input_set: "CapActionItem rows of one plan"
    constants:
      JOIN_COMPLETION_PCT: 100.0
    precision: "1 decimal round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "request body and query shape: required fields present, enum members valid, numeric ranges honoured (inspection_level 1..6, severity_weight 1..10, oos_add_on 0..5, limit 1..100, offset >= 0), inspection_end > inspection_start, session_end > session_start, measure_at_p50 < measure_at_p65 < measure_at_p80, monitor_percentile < intervention_percentile <= investigation_percentile, and conditional body requirements (resolution_disposition present only for RESOLVE_REJECT, court_status a legal target)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "path resources resolve, left to right: carrier_id, driver_id, violation_code_id, report_id, violation_id, report_amendment_id, challenge_id, adjudication_id, basic_score_id, coaching_assignment_id, cap_id, cap_action_item_id, scoring_run_id"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_VIOLATION_CODE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_VIOLATION_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_CHALLENGE_NOT_FOUND | ERR_ADJUDICATION_NOT_FOUND | ERR_BASIC_SCORE_NOT_FOUND | ERR_COACHING_NOT_FOUND | ERR_CAP_NOT_FOUND | ERR_CAP_ITEM_NOT_FOUND | ERR_SCORING_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: "body foreign keys resolve: attributed_carrier_id, driver_id, violation_code_id, corrected_*, asserted_correct_*, duplicate_of_report_id, target_violation_id, reduced_to_violation_code_id, violation_id, carrier_id"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_DRIVER_NOT_FOUND | ERR_VIOLATION_CODE_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_VIOLATION_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying foreign keys"

  - priority: 6
    category: auth
    check: "carrier scope: when the acting role is CarrierAnalyst or CarrierSafetyManager, X-User-ID must equal the carrier_id of the addressed resource (Carrier.id, Driver.carrier_id, Violation.attributed_carrier_id, DataChallenge.carrier_id, CoachingAssignment.carrier_id, CorrectiveActionPlan.carrier_id, or the report's attributed_carrier_id); list endpoints are silently filtered to that carrier instead of erroring"
    error_id: ERR_CARRIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all single-resource reads and all writes performed by CarrierAnalyst or CarrierSafetyManager"

  - priority: 7
    category: state
    check: "optimistic concurrency: expected_carrier_version, expected_report_version and expected_violation_version equal the referenced parent's current version"
    error_id: "ERR_STALE_CARRIER_VERSION | ERR_STALE_REPORT_VERSION | ERR_STALE_VIOLATION_VERSION"
    http_status: 412
    applies_to: "POST /corrective-action-plans, POST /inspection-reports/{id}/amendments, POST /citation-adjudications"

  - priority: 8
    category: state
    check: "the target resource is in a state that permits the requested transition, per the §1.2 transition tables (report status, challenge status, adjudication court/record dimensions, coaching status, CAP status, item status, violation status)"
    error_id: "ERR_INVALID_REPORT_STATE | ERR_INVALID_CHALLENGE_STATE | ERR_INVALID_ADJUDICATION_STATE | ERR_ALREADY_APPLIED_TO_RECORD | ERR_ADJUDICATION_SUPERSEDED | ERR_INVALID_COACHING_STATE | ERR_INVALID_CAP_STATE | ERR_INVALID_CAP_ITEM_STATE | ERR_VIOLATION_NOT_ACTIVE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_safety
    check: "segregation of duties: the CAP decision maker is not the auditor recorded in carrier.fitness_determined_by_user_id, and the two CAP review branches are not recorded by the same X-User-ID"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /corrective-action-plans/{id}/decision, POST /corrective-action-plans/{id}/reviews"

  - priority: 10
    category: business_safety
    check: "an out-of-service violation may not be removed or recoded by an accepted challenge unless a non-superseded CitationAdjudication with court_status IN {DISMISSED, NOT_GUILTY} exists on it"
    error_id: ERR_OOS_REMOVAL_REQUIRES_ADJUDICATION
    http_status: 422
    applies_to: "POST /data-challenges/{id}/review with action RESOLVE_ACCEPT"

  - priority: 11
    category: business_referential
    check: "coaching eligibility: driver.employment_status == ACTIVE, the violation's driver_id equals the assignment's driver_id, the violation's report.status == SCORED, and the effective ViolationCode.driver_attributable == true"
    error_id: "ERR_DRIVER_NOT_EMPLOYED | ERR_VIOLATION_NOT_ATTRIBUTED_TO_DRIVER | ERR_INVALID_REPORT_STATE | ERR_CODE_NOT_DRIVER_ATTRIBUTABLE"
    http_status: 422
    applies_to: "POST /coaching-assignments, POST /coaching-assignments/{id}/start"

  - priority: 12
    category: business_temporal
    check: "the challenge filing window is open: whole days between report.inspection_start and the logical clock <= 730"
    error_id: ERR_CHALLENGE_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /data-challenges/{id}/submit"

  - priority: 13
    category: business_temporal
    check: "an information-request response arrives at or before info_response_deadline"
    error_id: ERR_INFO_RESPONSE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /data-challenges/{id}/submit from status INFO_REQUESTED"

  - priority: 14
    category: business_temporal
    check: "a new scoring run's snapshot_utc is not earlier than the most recent run's snapshot_utc"
    error_id: ERR_SCORING_RUN_SNAPSHOT_REGRESSION
    http_status: 409
    applies_to: "POST /scoring-runs"

  - priority: 15
    category: business_referential
    check: "challenge payload completeness by type: WRONG_CARRIER needs asserted_correct_carrier_id different from the filing carrier; DUPLICATE_REPORT needs duplicate_of_report_id; INCORRECT_VIOLATION_CODE needs target_violation_id and asserted_correct_violation_code_id; VIOLATION_NOT_SUPPORTED needs target_violation_id; target_violation_id must belong to report_id"
    error_id: "ERR_CHALLENGE_PAYLOAD_INCOMPLETE | ERR_CHALLENGE_TARGET_MISMATCH"
    http_status: 422
    applies_to: "POST /data-challenges"

  - priority: 16
    category: business_referential
    check: "duplicate_of_report_id references a different report with the same vehicle_vin and same attributed_carrier_id whose status != RESCINDED"
    error_id: ERR_DUPLICATE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /data-challenges, POST /data-challenges/{id}/review with action RESOLVE_ACCEPT"

  - priority: 17
    category: business_referential
    check: "amendment payload completeness by type and target ownership: target_violation_id belongs to report_id; VIOLATION_CODE_CORRECTION needs corrected_violation_code_id; DRIVER_ATTRIBUTION_CORRECTION needs corrected_driver_id; CARRIER_REATTRIBUTION needs corrected_carrier_id different from the current one"
    error_id: "ERR_AMENDMENT_PAYLOAD_INCOMPLETE | ERR_AMENDMENT_TARGET_MISMATCH"
    http_status: 422
    applies_to: "POST /inspection-reports/{id}/amendments"

  - priority: 18
    category: business_referential
    check: "the report carries the driver attribution its violations require: every violation with unit_type == DRIVER has a non-null driver_id on the violation or on the report"
    error_id: ERR_DRIVER_ATTRIBUTION_MISSING
    http_status: 422
    applies_to: "POST /inspection-reports/{id}/validate"

  - priority: 19
    category: business_referential
    check: "a driver being attributed to a violation is employed by the violation's attributed carrier"
    error_id: ERR_DRIVER_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /violations/{id}/driver-attribution, POST /inspection-reports/{id}/violations, POST /inspection-reports"

  - priority: 20
    category: business_referential
    check: "evidence sufficiency at submit: WRONG_CARRIER requires at least one evidence row of type IN {BILL_OF_LADING, LEASE_AGREEMENT}; INCORRECT_VIOLATION_CODE requires at least one of {PHOTO, ELD_RECORD, COURT_DOCUMENT}; DUPLICATE_REPORT and VIOLATION_NOT_SUPPORTED require evidence_count >= 1; a resubmit from INFO_REQUESTED requires at least one row whose submitted_round == info_request_count"
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /data-challenges/{id}/submit"

  - priority: 21
    category: business_referential
    check: "an InterventionThreshold row is selectable for every category holding at least one includable violation"
    error_id: ERR_THRESHOLD_NOT_CONFIGURED
    http_status: 409
    applies_to: "POST /inspection-reports/{id}/score, POST /scoring-runs"

  - priority: 22
    category: business_constraint
    check: "duplicate inspection window on a vehicle: reject when a non-RESCINDED report exists with the same vehicle_vin whose closed interval [inspection_start, inspection_end] intersects the new report's interval expanded by DUPLICATE_BUFFER_MINUTES (120) on both ends; touching endpoints count as an intersection"
    error_id: ERR_DUPLICATE_INSPECTION_WINDOW
    http_status: 409
    applies_to: "POST /inspection-reports"

  - priority: 23
    category: business_constraint
    check: "coaching window conflict on a driver: reject when another assignment of the same driver with status IN {ASSIGNED, IN_PROGRESS, OVERDUE} has a half-open interval [session_start, session_end) that intersects the new half-open interval; adjacency (existing end == new start, or new end == existing start) is permitted and no buffer is applied"
    error_id: ERR_COACHING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /coaching-assignments"

  - priority: 24
    category: business_constraint
    check: "uniqueness: Carrier.dot_number, ViolationCode.code, InspectionReport.report_number globally; Driver.cdl_number within its carrier"
    error_id: "ERR_DUPLICATE_DOT_NUMBER | ERR_DUPLICATE_VIOLATION_CODE | ERR_DUPLICATE_REPORT_NUMBER | ERR_DUPLICATE_CDL"
    http_status: 409
    applies_to: "POST /carriers, POST /violation-codes, POST /inspection-reports, POST /drivers"

  - priority: 25
    category: business_constraint
    check: "one open challenge per (report_id, challenge_type, target_violation_id): no other challenge in {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED} shares the triple"
    error_id: ERR_DUPLICATE_OPEN_CHALLENGE
    http_status: 409
    applies_to: "POST /data-challenges/{id}/submit"

  - priority: 26
    category: business_constraint
    check: "information-request rounds are capped: info_request_count < MAX_INFO_ROUNDS (3)"
    error_id: ERR_CHALLENGE_ROUND_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /data-challenges/{id}/review with action REQUEST_INFO"

  - priority: 27
    category: business_constraint
    check: "a violation may carry at most one non-superseded adjudication whose court_status == PENDING"
    error_id: ERR_ADJUDICATION_PENDING_EXISTS
    http_status: 409
    applies_to: "POST /citation-adjudications"

  - priority: 28
    category: business_constraint
    check: "a carrier may hold at most one CorrectiveActionPlan in {DRAFT, SUBMITTED, IN_REVIEW, PENDING_DECISION}; a plan in RETURNED is legitimately superseded by a new one"
    error_id: ERR_ACTIVE_CAP_EXISTS
    http_status: 409
    applies_to: "POST /corrective-action-plans"

  - priority: 29
    category: business_constraint
    check: "a CorrectiveActionPlan may only exist for a carrier whose safety_fitness_status IN {CONDITIONAL, UNSATISFACTORY}"
    error_id: ERR_CAP_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /corrective-action-plans, POST /corrective-action-plans/{id}/submit"

  - priority: 30
    category: business_constraint
    check: "a CAP submit requires item_count >= 1 and committed_item_count == item_count"
    error_id: ERR_CAP_ITEMS_INCOMPLETE
    http_status: 422
    applies_to: "POST /corrective-action-plans/{id}/submit"

  - priority: 31
    category: business_constraint
    check: "each CAP review branch may be recorded once per submission cycle"
    error_id: ERR_REVIEW_BRANCH_ALREADY_RECORDED
    http_status: 409
    applies_to: "POST /corrective-action-plans/{id}/reviews"

  - priority: 32
    category: business_constraint
    check: "screening-selection consistency: a report whose selection_source == ISS_SCREENING may only be ingested when the attributed carrier's selection_band IN {OPTIONAL, INSPECT}"
    error_id: ERR_SCREENING_SELECTION_INCONSISTENT
    http_status: 422
    applies_to: "POST /inspection-reports"

  - priority: 33
    category: business_constraint
    check: "violations may only be appended while the owning report's status == RECEIVED"
    error_id: ERR_INVALID_REPORT_STATE
    http_status: 409
    applies_to: "POST /inspection-reports/{id}/violations"

  - priority: 34
    category: business_fiscal
    check: "the filing carrier's challenge_quota_used is below challenge_quota_limit for the rolling 30-day window"
    error_id: ERR_CHALLENGE_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /data-challenges/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- clock and ops-run checkpoint -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server starts at the fixed default 2026-08-01T00:00:00Z and never falls back to wall-clock time; every age, deadline and window rule reads this clock."
    roles: [FmcsaProgramAuditor]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime, previous_utc: datetime }
    side_effects: ["no entity is mutated; subsequent scoring, deadline and window evaluations use the new instant"]

  - method: POST
    path: "/scoring-runs"
    description: "Ops-run checkpoint: advance the scoring epoch. Re-pins time weights at the run snapshot, rewrites every BasicScore row, expires overdue information requests, sweeps coaching assignments and re-derives challenge quotas."
    roles: [FmcsaProgramAuditor]
    code: 201
    input: ["note?"]
    output: ScoringRun
    side_effects:
      - "sets snapshot_utc := logical clock; rejects with ERR_SCORING_RUN_SNAPSHOT_REGRESSION when earlier than the previous run"
      - "re-pins violation_severity_pin for every violation on VALIDATED/SCORED/AMENDED reports"
      - "rewrites all BasicScore rows of every carrier, then each carrier's intervention posture, then each carrier's screening risk"
      - "auto-rejects INFO_REQUESTED challenges past info_response_deadline (disposition EXPIRED_NO_RESPONSE) with the under_challenge clearing cascade"
      - "marks ASSIGNED/IN_PROGRESS assignments past due_at as OVERDUE, escalates OVERDUE assignments past due_at + 30 days, waives assignments whose driver.coaching_required == false with waived_reason SCORE_BELOW_TRIGGER"
      - "re-derives Carrier.challenge_quota_used per calculations.challenge_quota_ledger"
      - "increments the version of every entity it mutates by 1"

  - method: GET
    path: "/scoring-runs/{id}"
    description: "Read one scoring run and its counters."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: ScoringRun
    side_effects: []

  # ---- carriers -------------------------------------------------------------
  - method: POST
    path: "/carriers"
    description: "Register a motor carrier."
    roles: [FmcsaProgramAuditor]
    code: 201
    input: ["dot_number", "legal_name", "average_power_units", "annual_vmt"]
    output: Carrier
    side_effects:
      - "derives carrier_segment, utilization_factor and challenge_quota_limit"
      - "initialises safety_fitness_status UNRATED, intervention_status NONE, iss_value 0.0, selection_band PASS; writes no BasicScore rows"

  - method: GET
    path: "/carriers"
    description: "List carriers with filters and pagination; carrier-side roles see only their own row."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["safety_fitness_status?", "intervention_status?", "selection_band?", "carrier_segment?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: GET
    path: "/carriers/{id}"
    description: "Read one carrier including its derived posture and screening risk fields."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: Carrier
    side_effects: []

  - method: POST
    path: "/carriers/{id}/fitness-determination"
    description: "Issue a safety fitness determination; records the deciding auditor as the segregation-of-duties bar for later CAP decisions."
    roles: [FmcsaProgramAuditor]
    code: 200
    input: ["determination", "basis_note"]
    output: Carrier
    side_effects:
      - "sets safety_fitness_status := determination, fitness_determined_at := logical clock, fitness_determined_by_user_id := X-User-ID"
      - "increments Carrier.version by 1"

  - method: GET
    path: "/carriers/{id}/screening-risk"
    description: "Computed read of the carrier's roadside screening risk with the per-category contribution breakdown used by calculations.screening_risk_recompute; pure read, no recomputation."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: { carrier_id: string, iss_pre_credit_value: number, data_quality_credit_pct: number, iss_value: number, selection_band: string, oos_adder: number, oos_violation_count_24mo: integer, category_contributions: array, not_enough_data_categories: array }
    side_effects: []

  # ---- drivers --------------------------------------------------------------
  - method: POST
    path: "/drivers"
    description: "Register a driver under the acting carrier."
    roles: [CarrierSafetyManager]
    code: 201
    input: ["carrier_id", "cdl_number", "full_name", "employment_status?"]
    output: Driver
    side_effects: ["initialises all attribution aggregates to 0 and coaching_required to false"]

  - method: GET
    path: "/drivers"
    description: "List drivers with filters and pagination."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["carrier_id?", "employment_status?", "coaching_required?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []

  - method: GET
    path: "/drivers/{id}"
    description: "Read one driver."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: Driver
    side_effects: []

  - method: PATCH
    path: "/drivers/{id}"
    description: "Update driver name or employment status."
    roles: [CarrierSafetyManager]
    code: 200
    input: ["full_name?", "employment_status?"]
    output: Driver
    side_effects:
      - "employment_status := TERMINATED waives the driver's ASSIGNED/IN_PROGRESS/OVERDUE coaching assignments with waived_reason DRIVER_SEPARATED, which decrements Carrier.open_coaching_count and Driver.open_coaching_count"
      - "increments Driver.version by 1"

  - method: GET
    path: "/drivers/{id}/attribution-summary"
    description: "Computed read of the driver's two attribution variants and the per-violation severity factors behind them."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: { driver_id: string, attributed_violation_count: integer, strict_attribution_score: number, adjudicated_attribution_score: number, coaching_required: boolean, factor_breakdown: array }
    side_effects: []

  # ---- violation codes ------------------------------------------------------
  - method: POST
    path: "/violation-codes"
    description: "Publish a violation code with its severity weight."
    roles: [FmcsaProgramAuditor]
    code: 201
    input: ["code", "description", "basic_category", "severity_weight", "oos_add_on?", "driver_attributable?"]
    output: ViolationCode
    side_effects: []

  - method: GET
    path: "/violation-codes"
    description: "List violation codes."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["basic_category?", "driver_attributable?", "limit?", "offset?"]
    output: ViolationCode[]
    side_effects: []

  - method: GET
    path: "/violation-codes/{id}"
    description: "Read one violation code."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: ViolationCode
    side_effects: []

  - method: PATCH
    path: "/violation-codes/{id}"
    description: "Revise a published code. Already-pinned violations keep their snapshot until the next scoring pass, which is how has_stale_code_pin becomes true."
    roles: [FmcsaProgramAuditor]
    code: 200
    input: ["severity_weight?", "oos_add_on?", "description?", "driver_attributable?"]
    output: ViolationCode
    side_effects:
      - "increments ViolationCode.version by 1"
      - "no BasicScore is recomputed; violations whose pinned_violation_code_version now lags report has_stale_code_pin == true"

  # ---- intervention thresholds and scores -----------------------------------
  - method: POST
    path: "/intervention-thresholds"
    description: "Publish a percentile reference and intervention threshold row for one (category, segment)."
    roles: [FmcsaProgramAuditor]
    code: 201
    input: ["basic_category", "carrier_segment", "effective_from", "measure_at_p50", "measure_at_p65", "measure_at_p80", "intervention_percentile?", "monitor_percentile?", "investigation_percentile?"]
    output: InterventionThreshold
    side_effects: ["no score is recomputed until the next scoring event selects the row"]

  - method: GET
    path: "/intervention-thresholds"
    description: "List threshold rows."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["basic_category?", "carrier_segment?", "limit?", "offset?"]
    output: InterventionThreshold[]
    side_effects: []

  - method: GET
    path: "/basic-scores"
    description: "List BASIC score rows with filters; the reverse-reachability channel for scores written as a cascade side effect."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["carrier_id?", "basic_category?", "alert_status?", "scoring_run_id?", "threshold_id?", "limit?", "offset?"]
    output: BasicScore[]
    side_effects: []

  - method: GET
    path: "/basic-scores/{id}"
    description: "Read one BASIC score row including both measure variants."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: BasicScore
    side_effects: []

  # ---- inspection reports and violations ------------------------------------
  - method: POST
    path: "/inspection-reports"
    description: "Ingest a roadside inspection report; runs duplicate-window detection on the vehicle and snapshots the carrier's screening risk."
    roles: [StateInspectionOfficer]
    code: 201
    input: ["report_number", "inspection_state", "inspection_level", "inspection_start", "inspection_end", "vehicle_vin", "attributed_carrier_id", "selection_source", "driver_id?"]
    output: InspectionReport
    side_effects:
      - "sets status := RECEIVED, iss_value_at_selection := carrier.iss_value, selection_band_at_selection := carrier.selection_band"
      - "rejects overlapping vehicle windows per ERR_DUPLICATE_INSPECTION_WINDOW and inconsistent screening selection per ERR_SCREENING_SELECTION_INCONSISTENT"

  - method: GET
    path: "/inspection-reports"
    description: "List inspection reports with filters and pagination."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["attributed_carrier_id?", "original_carrier_id?", "driver_id?", "duplicate_master_report_id?", "status?", "vehicle_vin?", "limit?", "offset?"]
    output: InspectionReport[]
    side_effects: []

  - method: GET
    path: "/inspection-reports/{id}"
    description: "Read one inspection report including its rolled-up severity total."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: InspectionReport
    side_effects: []

  - method: POST
    path: "/inspection-reports/{id}/violations"
    description: "Append a violation to a report that is still RECEIVED."
    roles: [StateInspectionOfficer]
    code: 201
    input: ["violation_code_id", "unit_type", "out_of_service?", "driver_id?"]
    output: Violation
    side_effects:
      - "sets effective_violation_code_id := violation_code_id, basic_category from the code, attributed_carrier_id from the report, status := ACTIVE, time_weight := 0, time_weighted_severity := 0.0"
      - "recomputes InspectionReport.active_violation_count and increments InspectionReport.version by 1"

  - method: POST
    path: "/inspection-reports/{id}/validate"
    description: "Mark a received report validated after driver-attribution completeness checks."
    roles: [StateInspectionOfficer]
    code: 200
    output: InspectionReport
    side_effects: ["status := VALIDATED; increments InspectionReport.version by 1"]

  - method: POST
    path: "/inspection-reports/{id}/score"
    description: "Pin severity weights and time weights, then drive the full score cascade for the attributed carrier."
    roles: [StateInspectionOfficer, FmcsaProgramAuditor]
    code: 200
    output: InspectionReport
    side_effects:
      - "status := SCORED; runs calculations.violation_severity_pin over the report's violations"
      - "recomputes the carrier's four BasicScore rows, then intervention posture, then screening risk"
      - "recomputes Driver aggregates for every driver referenced by the report's violations"
      - "increments InspectionReport.version by 1"

  - method: POST
    path: "/inspection-reports/{id}/amendments"
    description: "File a state-agency correction against a report. OCC-guarded on the report's version because a later amendment supersedes an earlier correction of the same violation."
    roles: [StateInspectionOfficer]
    code: 201
    input: ["expected_report_version", "amendment_type", "rationale", "target_violation_id?", "corrected_violation_code_id?", "corrected_driver_id?", "corrected_carrier_id?"]
    output: ReportAmendment
    side_effects:
      - "applies the type-specific correction listed in state_machines.InspectionReport.SCORED_to_AMENDED"
      - "sets report.status := AMENDED and increments InspectionReport.version by 1"
      - "recomputes the affected carriers' BasicScore rows, intervention posture and screening risk, and the affected Driver aggregates"

  - method: GET
    path: "/report-amendments"
    description: "List report amendments with filters; the reverse-reachability channel for amendments written as a challenge side effect."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["report_id?", "target_violation_id?", "corrected_violation_code_id?", "corrected_driver_id?", "corrected_carrier_id?", "source_challenge_id?", "limit?", "offset?"]
    output: ReportAmendment[]
    side_effects: []

  - method: GET
    path: "/report-amendments/{id}"
    description: "Read one amendment record, including the report version bracket it applied across."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: ReportAmendment
    side_effects: []

  - method: GET
    path: "/violations"
    description: "List violations with filters and pagination; the reverse-reachability channel for every Violation foreign key."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["report_id?", "violation_code_id?", "effective_violation_code_id?", "driver_id?", "attributed_carrier_id?", "status?", "basic_category?", "under_challenge?", "out_of_service?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []

  - method: GET
    path: "/violations/{id}"
    description: "Read one violation including its pinned weights and current time-weighted severity."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: Violation
    side_effects: []

  - method: POST
    path: "/violations/{id}/driver-attribution"
    description: "Attribute or re-attribute a violation to one of the carrier's drivers."
    roles: [CarrierSafetyManager]
    code: 200
    input: ["driver_id"]
    output: Violation
    side_effects:
      - "sets Violation.driver_id and increments Violation.version by 1"
      - "recomputes the previous and the new driver's attribution aggregates and coaching_required"
      - "recomputes Carrier.unattributed_violation_count and scored_violation_count"

  - method: DELETE
    path: "/violations/{id}/driver-attribution"
    description: "Compensating action: clear a violation's driver attribution."
    roles: [CarrierSafetyManager]
    code: 200
    output: Violation
    side_effects:
      - "sets Violation.driver_id := null and increments Violation.version by 1"
      - "recomputes the released driver's aggregates and waives that driver's ASSIGNED/IN_PROGRESS assignments for this violation with waived_reason ATTRIBUTION_CLEARED"
      - "recomputes Carrier.unattributed_violation_count so the conservation identity holds"

  # ---- data challenges ------------------------------------------------------
  - method: POST
    path: "/data-challenges"
    description: "Open a draft data challenge against a report."
    roles: [CarrierAnalyst]
    code: 201
    input: ["report_id", "challenge_type", "narrative", "target_violation_id?", "asserted_correct_carrier_id?", "duplicate_of_report_id?", "asserted_correct_violation_code_id?"]
    output: DataChallenge
    side_effects: ["sets carrier_id := report.attributed_carrier_id, status := DRAFT, info_request_count := 0; consumes no quota"]

  - method: GET
    path: "/data-challenges"
    description: "List data challenges with filters and pagination."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["report_id?", "carrier_id?", "status?", "challenge_type?", "target_violation_id?", "asserted_correct_carrier_id?", "duplicate_of_report_id?", "asserted_correct_violation_code_id?", "limit?", "offset?"]
    output: DataChallenge[]
    side_effects: []

  - method: GET
    path: "/data-challenges/{id}"
    description: "Read one data challenge with its round counter and deadline."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: DataChallenge
    side_effects: []

  - method: POST
    path: "/data-challenges/{id}/evidence"
    description: "Attach a supporting document to a challenge that is not yet resolved."
    roles: [CarrierAnalyst]
    code: 201
    input: ["evidence_type", "document_uri", "description"]
    output: ChallengeEvidence
    side_effects:
      - "sets submitted_round := challenge.info_request_count"
      - "recomputes DataChallenge.evidence_count and increments DataChallenge.version by 1"

  - method: GET
    path: "/data-challenges/{id}/evidence"
    description: "List the evidence attached to a challenge."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: ChallengeEvidence[]
    side_effects: []

  - method: POST
    path: "/data-challenges/{id}/submit"
    description: "Submit a draft challenge, or respond to an information request, for federal review."
    roles: [CarrierAnalyst]
    code: 200
    output: DataChallenge
    side_effects:
      - "DRAFT -> SUBMITTED: consumes quota and sets under_challenge on the covered violations, cascading into certified_measure, alert_status, intervention posture and screening risk"
      - "INFO_REQUESTED -> SUBMITTED: no quota change, no under_challenge change"
      - "increments DataChallenge.version by 1"

  - method: POST
    path: "/data-challenges/{id}/withdraw"
    description: "Withdraw a challenge before resolution."
    roles: [CarrierAnalyst]
    code: 200
    input: ["withdraw_note?"]
    output: DataChallenge
    side_effects:
      - "from SUBMITTED or INFO_REQUESTED: decrements Carrier.challenge_quota_used and clears under_challenge with the full score cascade"
      - "from DRAFT: no quota or score change"

  - method: POST
    path: "/data-challenges/{id}/review"
    description: "Federal review action on a challenge: ASSIGN, REQUEST_INFO, RESOLVE_ACCEPT or RESOLVE_REJECT."
    roles: [FmcsaReviewOfficer]
    code: 200
    input: ["action", "review_note", "resolution_disposition?"]
    output: DataChallenge
    side_effects:
      - "ASSIGN: SUBMITTED -> UNDER_REVIEW"
      - "REQUEST_INFO: UNDER_REVIEW -> INFO_REQUESTED, bumps info_request_count and sets info_response_deadline := clock + 30 days"
      - "RESOLVE_ACCEPT: writes the type-specific disposition and drives the reattribution / rescission / recode / removal cascade declared in state_machines.DataChallenge"
      - "RESOLVE_REJECT: clears under_challenge and restores certified_measure with the downstream posture and screening-risk cascade"
      - "increments DataChallenge.version by 1"

  # ---- citation adjudications ----------------------------------------------
  - method: POST
    path: "/citation-adjudications"
    description: "Record that a citation was written for a violation. OCC-guarded on the violation's version because an appeal outcome supersedes the prior adjudication."
    roles: [StateInspectionOfficer]
    code: 201
    input: ["violation_id", "citation_number", "court_date", "expected_violation_version"]
    output: CitationAdjudication
    side_effects:
      - "sets court_status := PENDING, record_update_status := NOT_APPLIED, severity_factor := 1.0"
      - "marks any earlier adjudication of the same violation superseded := true"
      - "increments Violation.version by 1"

  - method: GET
    path: "/citation-adjudications"
    description: "List adjudications with filters over both state dimensions."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["violation_id?", "reduced_to_violation_code_id?", "court_status?", "record_update_status?", "superseded?", "limit?", "offset?"]
    output: CitationAdjudication[]
    side_effects: []

  - method: GET
    path: "/citation-adjudications/{id}"
    description: "Read one adjudication including its derived severity_factor."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: CitationAdjudication
    side_effects: []

  - method: POST
    path: "/citation-adjudications/{id}/court-result"
    description: "Record the court outcome. Moves the court dimension only; the violation record is untouched until apply-to-record runs."
    roles: [StateInspectionOfficer]
    code: 200
    input: ["court_status", "reduced_to_violation_code_id?", "court_note?"]
    output: CitationAdjudication
    side_effects:
      - "sets court_status, severity_factor and court_result_recorded_at"
      - "recomputes the linked driver's adjudicated_attribution_score and coaching_required, leaving strict_attribution_score untouched"
      - "increments CitationAdjudication.version by 1"

  - method: POST
    path: "/citation-adjudications/{id}/apply-to-record"
    description: "Push an adjudicated result into the violation record, driving the removal or recode cascade."
    roles: [FmcsaReviewOfficer]
    code: 200
    output: CitationAdjudication
    side_effects:
      - "DISMISSED / NOT_GUILTY: violation REMOVED with removal_reason ADJUDICATION_DISMISSED; REDUCED: violation RECODED and re-pinned; CONVICTED: record_update_status := NOT_APPLICABLE and no record change"
      - "cascades report totals -> BasicScore -> intervention posture -> screening risk, and Driver aggregates -> coaching waiver"
      - "increments CitationAdjudication.version by 1"

  # ---- coaching -------------------------------------------------------------
  - method: POST
    path: "/coaching-assignments"
    description: "Assign driver coaching for an attributed violation, reserving a half-open window on the driver's calendar."
    roles: [CarrierSafetyManager]
    code: 201
    input: ["driver_id", "violation_id", "curriculum_code", "session_start", "session_end"]
    output: CoachingAssignment
    side_effects:
      - "sets carrier_id from the driver, status := ASSIGNED, due_at := session_end + 14 days"
      - "increments Carrier.open_coaching_count and Driver.open_coaching_count"

  - method: GET
    path: "/coaching-assignments"
    description: "List coaching assignments with filters and pagination."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["driver_id?", "violation_id?", "carrier_id?", "status?", "overdue_marked_run_id?", "limit?", "offset?"]
    output: CoachingAssignment[]
    side_effects: []

  - method: GET
    path: "/coaching-assignments/{id}"
    description: "Read one coaching assignment."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: CoachingAssignment
    side_effects: []

  - method: POST
    path: "/coaching-assignments/{id}/start"
    description: "Start a coaching session."
    roles: [CarrierSafetyManager]
    code: 200
    output: CoachingAssignment
    side_effects: ["status := IN_PROGRESS, started_at := logical clock; increments version by 1"]

  - method: POST
    path: "/coaching-assignments/{id}/complete"
    description: "Attest completion of a coaching session."
    roles: [CarrierSafetyManager]
    code: 200
    input: ["attestation_note"]
    output: CoachingAssignment
    side_effects:
      - "status := COMPLETED, completed_at := logical clock, attestation_note recorded"
      - "decrements Carrier.open_coaching_count and Driver.open_coaching_count"

  # ---- corrective action plans ---------------------------------------------
  - method: POST
    path: "/corrective-action-plans"
    description: "Open a corrective action plan for a carrier under a CONDITIONAL or UNSATISFACTORY determination. OCC-guarded on the carrier's version because a new plan supersedes a RETURNED one."
    roles: [CarrierAnalyst]
    code: 201
    input: ["carrier_id", "expected_carrier_version", "narrative"]
    output: CorrectiveActionPlan
    side_effects:
      - "sets status := DRAFT and triggering_fitness_status := carrier.safety_fitness_status"
      - "when a RETURNED plan exists for the carrier, sets superseded_cap_id and moves that plan to SUPERSEDED"
      - "increments Carrier.version by 1"

  - method: GET
    path: "/corrective-action-plans"
    description: "List corrective action plans with filters and pagination."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    input: ["carrier_id?", "status?", "superseded_cap_id?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []

  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Read one plan including its item rollup and completion percentage."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: CorrectiveActionPlan
    side_effects: []

  - method: POST
    path: "/corrective-action-plans/{id}/action-items"
    description: "Add an action item to a plan."
    roles: [CarrierAnalyst]
    code: 201
    input: ["basic_category", "description", "target_completion_date"]
    output: CapActionItem
    side_effects: ["status := PROPOSED; recomputes the plan's item rollup and completion_pct"]

  - method: GET
    path: "/corrective-action-plans/{id}/action-items"
    description: "List a plan's action items."
    roles: [FmcsaProgramAuditor, FmcsaReviewOfficer, StateInspectionOfficer, CarrierAnalyst, CarrierSafetyManager]
    code: 200
    output: CapActionItem[]
    side_effects: []

  - method: POST
    path: "/cap-action-items/{id}/status"
    description: "Advance an action item: COMMIT (analyst), IMPLEMENT (safety manager), VERIFY or REJECT (auditor)."
    roles: [CarrierAnalyst, CarrierSafetyManager, FmcsaProgramAuditor]
    code: 200
    input: ["action", "note?"]
    output: CapActionItem
    side_effects:
      - "applies the item transition and recomputes the plan's rollup and completion_pct"
      - "VERIFY may satisfy the CAP join condition and drive IN_REVIEW -> PENDING_DECISION"

  - method: POST
    path: "/corrective-action-plans/{id}/submit"
    description: "Submit the plan for federal review once every action item is committed."
    roles: [CarrierSafetyManager]
    code: 200
    output: CorrectiveActionPlan
    side_effects: ["status := SUBMITTED; clears both branch review outcomes and reviewer ids; increments version by 1"]

  - method: POST
    path: "/corrective-action-plans/{id}/reviews"
    description: "Record one of the two parallel review branches (SAFETY or DATA). A DEFICIENT outcome short-circuits the join and returns the plan."
    roles: [FmcsaProgramAuditor]
    code: 200
    input: ["branch", "outcome", "note?"]
    output: CorrectiveActionPlan
    side_effects:
      - "records the branch outcome and reviewer id; rejects a second recording of the same branch and rejects the same X-User-ID on both branches"
      - "CLEARED on both branches with completion_pct == 100.0 drives IN_REVIEW -> PENDING_DECISION; DEFICIENT drives RETURNED"
      - "increments version by 1"

  - method: POST
    path: "/corrective-action-plans/{id}/decision"
    description: "Accept or return a plan awaiting decision. The auditor who issued the carrier's fitness determination may not decide."
    roles: [FmcsaProgramAuditor]
    code: 200
    input: ["decision", "note?"]
    output: CorrectiveActionPlan
    side_effects:
      - "ACCEPT upgrades carrier.safety_fitness_status one step and increments Carrier.version by 1"
      - "RETURN leaves the fitness status untouched and makes the plan supersedable"
      - "increments CorrectiveActionPlan.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_CARRIER_SCOPE_VIOLATION
    http: 403
    condition: "a CarrierAnalyst or CarrierSafetyManager addresses a resource belonging to a different carrier than X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the CAP decision is attempted by carrier.fitness_determined_by_user_id, or both CAP review branches are recorded by the same X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, out-of-range number, inspection_end <= inspection_start, session_end <= session_start, non-monotonic threshold reference measures, limit outside 1..100, or a conditionally forbidden field such as resolution_disposition on a non-reject review"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "carrier_id in the path or body does not resolve"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "driver_id in the path or body does not resolve"
  - id: ERR_VIOLATION_CODE_NOT_FOUND
    http: 404
    condition: "violation_code_id, corrected_violation_code_id, asserted_correct_violation_code_id or reduced_to_violation_code_id does not resolve"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "report_id or duplicate_of_report_id does not resolve"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "violation_id or target_violation_id does not resolve"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "report_amendment_id does not resolve"
  - id: ERR_CHALLENGE_NOT_FOUND
    http: 404
    condition: "challenge_id does not resolve"
  - id: ERR_ADJUDICATION_NOT_FOUND
    http: 404
    condition: "adjudication_id does not resolve"
  - id: ERR_BASIC_SCORE_NOT_FOUND
    http: 404
    condition: "basic_score_id does not resolve"
  - id: ERR_COACHING_NOT_FOUND
    http: 404
    condition: "coaching_assignment_id does not resolve"
  - id: ERR_CAP_NOT_FOUND
    http: 404
    condition: "cap_id does not resolve"
  - id: ERR_CAP_ITEM_NOT_FOUND
    http: 404
    condition: "cap_action_item_id does not resolve"
  - id: ERR_SCORING_RUN_NOT_FOUND
    http: 404
    condition: "scoring_run_id does not resolve"
  - id: ERR_STALE_CARRIER_VERSION
    http: 412
    condition: "expected_carrier_version does not equal Carrier.version on POST /corrective-action-plans"
  - id: ERR_STALE_REPORT_VERSION
    http: 412
    condition: "expected_report_version does not equal InspectionReport.version on POST /inspection-reports/{id}/amendments"
  - id: ERR_STALE_VIOLATION_VERSION
    http: 412
    condition: "expected_violation_version does not equal Violation.version on POST /citation-adjudications"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "the report is not in a state that permits validate, score, violation append, challenge submit or coaching assignment"
  - id: ERR_INVALID_CHALLENGE_STATE
    http: 409
    condition: "the challenge is not in a state that permits submit, withdraw, or the requested review action"
  - id: ERR_INVALID_ADJUDICATION_STATE
    http: 409
    condition: "a court result is recorded on a non-PENDING adjudication, or apply-to-record runs while court_status is PENDING"
  - id: ERR_ALREADY_APPLIED_TO_RECORD
    http: 409
    condition: "apply-to-record runs on an adjudication whose record_update_status is already APPLIED or NOT_APPLICABLE"
  - id: ERR_ADJUDICATION_SUPERSEDED
    http: 409
    condition: "a court result or record application is attempted on an adjudication whose superseded flag is true"
  - id: ERR_VIOLATION_NOT_ACTIVE
    http: 409
    condition: "apply-to-record or driver attribution targets a violation whose status is REMOVED"
  - id: ERR_INVALID_COACHING_STATE
    http: 409
    condition: "start or complete is called from a coaching status that does not permit it"
  - id: ERR_INVALID_CAP_STATE
    http: 409
    condition: "submit, reviews, decision or an item transition is attempted from a CAP status that does not permit it"
  - id: ERR_INVALID_CAP_ITEM_STATE
    http: 409
    condition: "the requested action does not match the action item's current status"
  - id: ERR_OOS_REMOVAL_REQUIRES_ADJUDICATION
    http: 422
    condition: "an accepted challenge would remove or recode an out-of-service violation with no DISMISSED or NOT_GUILTY adjudication on record"
  - id: ERR_DRIVER_NOT_EMPLOYED
    http: 422
    condition: "coaching is assigned or started for a driver whose employment_status is not ACTIVE"
  - id: ERR_VIOLATION_NOT_ATTRIBUTED_TO_DRIVER
    http: 422
    condition: "a coaching assignment names a violation whose driver_id is not the assignment's driver"
  - id: ERR_CODE_NOT_DRIVER_ATTRIBUTABLE
    http: 422
    condition: "a coaching assignment names a violation whose effective code has driver_attributable == false"
  - id: ERR_DRIVER_CARRIER_MISMATCH
    http: 422
    condition: "a driver is attributed to a violation or report of a carrier that does not employ that driver"
  - id: ERR_DRIVER_ATTRIBUTION_MISSING
    http: 422
    condition: "validate is called while a DRIVER unit_type violation has no driver on the violation or the report"
  - id: ERR_CHALLENGE_FILING_WINDOW_CLOSED
    http: 422
    condition: "the challenged report's inspection_start is more than 730 whole days before the logical clock at submit"
  - id: ERR_INFO_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "a response to an information request is submitted after info_response_deadline"
  - id: ERR_SCORING_RUN_SNAPSHOT_REGRESSION
    http: 409
    condition: "a new scoring run's snapshot_utc precedes the most recent run's snapshot_utc"
  - id: ERR_CHALLENGE_PAYLOAD_INCOMPLETE
    http: 422
    condition: "the challenge type's conditionally required fields are absent, or asserted_correct_carrier_id equals the filing carrier"
  - id: ERR_CHALLENGE_TARGET_MISMATCH
    http: 422
    condition: "target_violation_id does not belong to report_id"
  - id: ERR_DUPLICATE_TARGET_INVALID
    http: 422
    condition: "duplicate_of_report_id is the same report, has a different vehicle_vin or carrier, or is already RESCINDED"
  - id: ERR_AMENDMENT_PAYLOAD_INCOMPLETE
    http: 422
    condition: "the amendment type's conditionally required correction field is absent, or CARRIER_REATTRIBUTION repeats the current carrier"
  - id: ERR_AMENDMENT_TARGET_MISMATCH
    http: 422
    condition: "target_violation_id does not belong to the amended report"
  - id: ERR_EVIDENCE_REQUIRED
    http: 422
    condition: "the challenge type's required evidence set is unmet at submit, or a resubmit carries no evidence for the current round"
  - id: ERR_THRESHOLD_NOT_CONFIGURED
    http: 409
    condition: "no InterventionThreshold row is selectable for a category that holds at least one includable violation"
  - id: ERR_DUPLICATE_INSPECTION_WINDOW
    http: 409
    condition: "the ingested report's buffered window intersects an existing non-RESCINDED report on the same vehicle_vin"
  - id: ERR_COACHING_WINDOW_CONFLICT
    http: 409
    condition: "the requested coaching window intersects another non-terminal assignment of the same driver"
  - id: ERR_DUPLICATE_DOT_NUMBER
    http: 409
    condition: "dot_number already registered"
  - id: ERR_DUPLICATE_VIOLATION_CODE
    http: 409
    condition: "violation code already published"
  - id: ERR_DUPLICATE_REPORT_NUMBER
    http: 409
    condition: "report_number already ingested"
  - id: ERR_DUPLICATE_CDL
    http: 409
    condition: "cdl_number already registered for that carrier"
  - id: ERR_DUPLICATE_OPEN_CHALLENGE
    http: 409
    condition: "another challenge with the same (report_id, challenge_type, target_violation_id) is already open"
  - id: ERR_CHALLENGE_ROUND_LIMIT_EXCEEDED
    http: 409
    condition: "a fourth information request is attempted on one challenge"
  - id: ERR_ADJUDICATION_PENDING_EXISTS
    http: 409
    condition: "a violation already carries a non-superseded adjudication whose court_status is PENDING"
  - id: ERR_ACTIVE_CAP_EXISTS
    http: 409
    condition: "the carrier already holds a plan in DRAFT, SUBMITTED, IN_REVIEW or PENDING_DECISION"
  - id: ERR_CAP_NOT_REQUIRED
    http: 422
    condition: "a plan is created or submitted for a carrier whose safety_fitness_status is UNRATED or SATISFACTORY"
  - id: ERR_CAP_ITEMS_INCOMPLETE
    http: 422
    condition: "a plan is submitted with no action items or with an item that is not yet committed"
  - id: ERR_REVIEW_BRANCH_ALREADY_RECORDED
    http: 409
    condition: "the named CAP review branch already has an outcome for this submission cycle"
  - id: ERR_SCREENING_SELECTION_INCONSISTENT
    http: 422
    condition: "selection_source is ISS_SCREENING while the attributed carrier's selection_band is PASS"

  - id: ERR_CHALLENGE_QUOTA_EXCEEDED
    http: 409
    condition: "the filing carrier's challenge_quota_used already equals challenge_quota_limit for the rolling 30-day window"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierAnalyst
    description: "Carrier-side safety data quality analyst: files data challenges with evidence, drafts corrective action plans and commits action items."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /data-challenges"
      - "POST /data-challenges/{id}/evidence"
      - "POST /data-challenges/{id}/submit"
      - "POST /data-challenges/{id}/withdraw"
      - "POST /corrective-action-plans"
      - "POST /corrective-action-plans/{id}/action-items"
    shared_operations:
      - "POST /cap-action-items/{id}/status (COMMIT only)"
      - "all GET endpoints, scoped to X-User-ID's carrier"

  - name: CarrierSafetyManager
    description: "Carrier-side safety manager: manages drivers, driver-level violation attribution, coaching assignments and CAP submission."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /drivers"
      - "PATCH /drivers/{id}"
      - "POST /violations/{id}/driver-attribution"
      - "DELETE /violations/{id}/driver-attribution"
      - "POST /coaching-assignments"
      - "POST /coaching-assignments/{id}/start"
      - "POST /coaching-assignments/{id}/complete"
      - "POST /corrective-action-plans/{id}/submit"
    shared_operations:
      - "POST /cap-action-items/{id}/status (IMPLEMENT only)"
      - "all GET endpoints, scoped to X-User-ID's carrier"

  - name: StateInspectionOfficer
    description: "State enforcement agency officer: ingests inspection reports and violations, files amendments and records citations and court results."
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection-reports"
      - "POST /inspection-reports/{id}/violations"
      - "POST /inspection-reports/{id}/validate"
      - "POST /inspection-reports/{id}/amendments"
      - "POST /citation-adjudications"
      - "POST /citation-adjudications/{id}/court-result"
    shared_operations:
      - "POST /inspection-reports/{id}/score (with FmcsaProgramAuditor)"
      - "all GET endpoints, unscoped"

  - name: FmcsaReviewOfficer
    description: "Federal data review officer: adjudicates data challenges and pushes adjudicated citation results into violation records."
    identity: "opaque"
    exclusive_operations:
      - "POST /data-challenges/{id}/review"
      - "POST /citation-adjudications/{id}/apply-to-record"
    shared_operations:
      - "all GET endpoints, unscoped"

  - name: FmcsaProgramAuditor
    description: "Federal program auditor: owns reference data, the scoring epoch, fitness determinations and corrective action plan review and decision. Segregation of duties bars the determining auditor from deciding the resulting plan and bars one auditor from recording both CAP review branches."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers"
      - "POST /carriers/{id}/fitness-determination"
      - "POST /violation-codes"
      - "PATCH /violation-codes/{id}"
      - "POST /intervention-thresholds"
      - "POST /scoring-runs"
      - "POST /_clock/set_current_utc"
      - "POST /corrective-action-plans/{id}/reviews"
      - "POST /corrective-action-plans/{id}/decision"
    shared_operations:
      - "POST /inspection-reports/{id}/score (with StateInspectionOfficer)"
      - "POST /cap-action-items/{id}/status (VERIFY and REJECT only)"
      - "all GET endpoints, unscoped"
