          - entities.FieldLot.fields.aflatoxin_ppb
        distinguishing_aspect: |
          FieldLot's GRADED -> ROUTED_KERNEL transition depends on LabTest
          state (a RECORDED AFLATOXIN PASS must exist): with only the
          MOISTURE_KERNEL test the route is rejected; recording the aflatoxin
          PASS on the linked LabTest aggregate unblocks the same request.
