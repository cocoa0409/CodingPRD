  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_departure_version_on_reserve_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[booking-reserve-stale-departure]"
          - endpoints
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: |
          Client reads Departure.version, reserves booking A (version advances), then reserves booking B still
          carrying the pre-A version (${d_v0}) — rejected with ERR_STALE_VERSION (412). Two strictly sequential
          requests; the second carries a now-stale expected_departure_version.
        test_recipe:
          setup: ["SCHEDULED departure seat_capacity 12; two DRAFT bookings party 3 and party 3"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G1", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g1_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G2", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g2_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g1_id}", pickup_point_id: "${pickup_id}", party_size: 3 }
              as: Guest
              as_user_id: "${g1_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g2_id}", pickup_point_id: "${pickup_id}", party_size: 3 }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /bookings/${b1_id}/reserve"
              payload: { expected_departure_version: "${d_v0}" }
              as: Guest
              as_user_id: "${g1_id}"
          trigger:
            - call: "POST /bookings/${b2_id}/reserve"
              payload: { expected_departure_version: "${d_v0}" }
              as: Guest
              as_user_id: "${g2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response status == 412"

      - name: version_increments_on_every_departure_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Departure.fields.version
          - endpoints
        distinguishing_aspect: "Departure.version starts at 1 on create and increments by exactly 1 per reserve (1 -> 2 after one reserve)."
        test_recipe:
          setup: ["SCHEDULED departure; one DRAFT booking party 3"]
          setup_api_calls:
            - call: "POST /tour-products"
              payload: { name: "P", theme: "WINE", base_price_per_person_cents: 9000 }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /tour-products/${p_id}/publish"
              payload: {}
              as: Operator
            - call: "POST /vehicles"
              payload: { label: "V", seat_capacity: 12 }
              as: Operator
              captures: { veh_id: $.data.id }
            - call: "POST /pickup-points"
              payload: { name: "Hub", address: "1 Main" }
              as: Operator
              captures: { pickup_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_product_id: "${p_id}", vehicle_id: "${veh_id}", depart_at: "2026-04-10T18:00:00Z", return_at: "2026-04-10T23:00:00Z" }
              as: Operator
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", birth_date: "1990-01-01T00:00:00Z" }
              as: Guest
              captures: { g_id: $.data.id }
            - call: "POST /bookings"
              payload: { departure_id: "${d_id}", lead_guest_id: "${g_id}", pickup_point_id: "${pickup_id}", party_size: 3 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/reserve"
              payload: { expected_departure_version: "${d_v0}" }
              as: Guest
              as_user_id: "${g_id}"
            - call: "GET /departures/${d_id}"
              payload: {}
              as: Operator
              captures: { v_after: $.data.version }
          assert:
            - "Departure.${d_id}.version == 2"

      - name: cascade_side_effects_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Departure.CONFIRMED_to_CANCELLED_WEATHER
        distinguishing_aspect: "Multi-hop cascade end-to-end."
        excluded_because:
          difficulty_instance: transitive_cascade / weather_cancel_cascade_depth3_booking_payment_seatpool
          rationale: "The depth-3 cascade is verified end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: reserve_seat_math_visible_same_request
        claim_type: immediate
        grounds:
          - entities.Departure.fields.seats_taken
          - endpoints
        distinguishing_aspect: "After a reserve, the reserve response's booking is RESERVED and a same-turn GET of the departure already reflects the updated seats_taken — immediate consistency."
        excluded_because:
          difficulty_instance: compensating_invariant / seat_pool_conserved_under_reserve_then_cancel
          rationale: "Immediate visibility of seat-pool mutation is asserted within the named §1.8 invariant instance (seats_taken read right after the mutations)."
