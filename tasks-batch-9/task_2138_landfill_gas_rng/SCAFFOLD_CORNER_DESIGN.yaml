            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-09T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-09T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { process_mode: "UPGRADING" }
              as: PlantOperator
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-09T02:00:00Z", methane_pct: 60.0, oxygen_pct: 5.00, nitrogen_pct: 2.0, temperature_f: 120.0, flow_scfm: 500.0, vacuum_inhg: 24.0 }
              as: WellfieldTechnician
            - call: "POST /plants/${plant_id}/status"
              payload: { spec_status: "QUARANTINE" }
              as: PlantOperator
            - call: "POST /plants/${plant_id}/status"
              payload: { spec_status: "ON_SPEC" }
              as: PlantOperator
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-09T03:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/readings"
              payload: { taken_at: "2026-08-09T04:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 480.0, vacuum_inhg: 22.5 }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/status"
              payload: { to_state: "THROTTLED", reason: "Two consecutive good readings" }
              as: WellfieldTechnician
            - call: "POST /wells/${w1_id}/readings"
