              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex SA", date_of_birth: "2000-01-15", id_document_type: "PASSPORT", id_document_number: "PSA1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v1: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v1}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex SB", date_of_birth: "1999-03-20", id_document_type: "NATIONAL_ID", id_document_number: "NSB1", id_document_expiry: "2028-01-01" }
              as: ProgramAdmin
              captures: { ex_b: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v2: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_b}", expected_session_version: "${s_v2}" }
              as: Examinee
              as_user_id: "${ex_b}"
              captures: { r_b: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PSA1", id_document_expiry: "2027-06-01", biometric_sample: "bio-sa" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/registrations/${r_b}/check-in"
              payload: { id_document_number: "NSB1", id_document_expiry: "2028-01-01", biometric_sample: "bio-sb" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/administer"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/score-entry"
              payload: { section_raws: [10, 10, 10], prior_best_scaled_score: 23, matched_responses_count: 34, total_scored_items: 40, same_form: true, adjacent_seated: true }
              as: ScoreAnalyst
              captures: { sc_a: $.data.id }
            - call: "POST /ets/registrations/${r_b}/score-entry"
              payload: { section_raws: [20, 20, 20], prior_best_scaled_score: 68, matched_responses_count: 33, total_scored_items: 40, same_form: true, adjacent_seated: true }
              as: ScoreAnalyst
              captures: { sc_b: $.data.id }
          trigger:
            - call: "POST /ets/score-analysis/run"
              payload: { session_id: "${s_id}" }
              as: ScoreAnalyst
              as_user_id: "analyst-1"
              captures: { run_flagged: $.data.flagged_count }
            - call: "GET /ets/registrations/${r_a}/review-cases"
              as: ScoreAnalyst
              captures: { case_a: "$.data[0].id", case_a_reason: "$.data[0].trigger_reason" }
          assert:
            - "trigger run: processed_count == 2, flagged_count == 1, released_count == 1"
            - "ScoreRecord.${sc_a}.scaled_score == 23  (30 + floor(0.5*(30-45.00)+0.5))"
            - "ScoreRecord.${sc_a}.status == UNDER_REVIEW  (34/40 * 1.0 * 1.0 = 0.85 >= 0.85 and 34 >= 20)"
            - "ScoreReviewCase.${case_a}.trigger_reason == RESPONSE_SIMILARITY"
            - "ScoreRecord.${sc_b}.status == RELEASED  (33/40 = 0.825 < 0.85)"
            - "ScoreRecord.${sc_b}.scaled_score == 68  (60 + floor(0.5*(60-45.00)+0.5))"

      - name: equated_mean_includes_self_order
        grounds:
          - calculations.equated_final_scaled_score
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — each record's equated score
          depends on the session mean, which itself includes that record. The
          scaffold pins the order (all raws -> mean 107.00 -> equate), yielding
          91 for raw 94; excluding self (mean 120.00) would yield 85, so the
          pinned order is observable. A different mode than (a) and (b).
        test_recipe:
          setup:
            - "same two-examinee fixture as score_scaling_provisional_vs_equated: raws [33,21,40] (raw_total 94) and [40,40,40] (raw_total 120)"
