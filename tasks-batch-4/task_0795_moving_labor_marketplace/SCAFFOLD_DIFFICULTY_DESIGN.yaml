            - "http_status == 409"

      - name: claim_approve_wrong_state_beats_coverage_cap
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CLAIM_EXCEEDS_COVERAGE]
        distinguishing_aspect: "A POST /claims/{id}/approve on a FILED (not UNDER_REVIEW) claim whose claimed_amount 300000 also exceeds the BASIC cap 200000 violates both state (priority 4) and business_fiscal (priority 8); the priority-4 ERR_INVALID_STATE is returned."
