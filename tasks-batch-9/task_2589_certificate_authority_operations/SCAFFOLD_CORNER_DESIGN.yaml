              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { auth_b: $.data.id, token_b: $.data.challenge_token }
            - call: "POST /ca/domain-authorizations/${auth_b}/validate"
              payload: { challenge_token: "${token_b}" }
