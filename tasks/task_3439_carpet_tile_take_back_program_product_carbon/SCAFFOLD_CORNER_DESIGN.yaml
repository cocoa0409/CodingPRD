            - call: "POST /carpetloop/take-back-requests/${tb1}/collect"
              payload: { collected_kg: 160 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { err: $.data.error_id }
            - *c_clock_sep12
            - *c_collect1
          assert:
            - "first collect: err == ERR_COLLECT_WINDOW_NOT_OPEN (422); status remains SCHEDULED and collected_kg null"
            - "after the clock advances to 2026-09-12T06:00:00Z (inside the window): collect succeeds, status == COLLECTED, collected_kg == 160"

      - name: schedule_window_shape_and_pastness_validated
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TakeBackRequest.REQUESTED_to_SCHEDULED
          - errors[ERR_PICKUP_WINDOW_INVALID]
        distinguishing_aspect: "Schedule validates both window shape (start < end) and futurity against the logical clock: an inverted window and a window opening before the current clock both fail ERR_PICKUP_WINDOW_INVALID."
        test_recipe:
          setup: ["Collection GAT; site INSTALLED; two take-backs REQUESTED; clock at 2026-09-12T06:00:00Z."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_site1
            - *c_install1
            - *c_tb1
            - call: "POST /carpetloop/take-back-requests"
              payload: { site_id: "${site1}", collection_id: "${col_id}", condition_grade: "A", declared_area_m2: 25 }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { tb2: $.data.id }
            - *c_clock_sep12
          trigger:
            - call: "POST /carpetloop/take-back-requests/${tb1}/schedule"
              payload: { pickup_window_start: "2026-09-20T00:00:00Z", pickup_window_end: "2026-09-19T00:00:00Z" }
              as: Installer
              as_user_id: "inst-bob"
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/take-back-requests/${tb2}/schedule"
              payload: { pickup_window_start: "2026-09-10T00:00:00Z", pickup_window_end: "2026-09-20T00:00:00Z" }
              as: Installer
              as_user_id: "inst-bob"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_PICKUP_WINDOW_INVALID (start 2026-09-20 >= end 2026-09-19)"
            - "err2 == ERR_PICKUP_WINDOW_INVALID (start 2026-09-10 not after the logical clock 2026-09-12T06:00:00Z)"
            - "both take-backs remain REQUESTED with null pickup windows"

      - name: order_terminal_and_state_guards
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ReplacementOrder
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ORDER_NOT_MATCHED]
          - errors[ERR_ZONE_NOT_IN_SERVICE]
        distinguishing_aspect: "Three distinct order-state guards on one fixture: match on a COMPLETED order fails ERR_INVALID_STATE; complete on a DRAFT order fails ERR_ORDER_NOT_MATCHED; creating an order on the just-REPLACED zone fails ERR_ZONE_NOT_IN_SERVICE."
        test_recipe:
          setup:
            - "Collection GAT; batch DL-100 (100 m2) RELEASED; site IN_SERVICE (budget 1000000); zone Z-1 (50 m2) from DL-100."
            - "ORD-1 on Z-1 matched against DL-100 (exact lot, quote 60000 = 50 m2 x 1200 x 1.00) and COMPLETED: Z-1 REPLACED, replacement zone Z-1R created IN_SERVICE from DL-100 (available now 0 -> EXHAUSTED)."
            - "ORD-2 created on Z-1R, left DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_lot_net200
            - *c_lot_vir200
            - *c_qc_lot1
            - *c_qc_lot2
            - *c_batch_b1
            - *c_alloc1
            - *c_alloc2
            - *c_rel_b1
            - *c_site1
            - *c_install1
            - call: "POST /carpetloop/sites/${site1}/zones"
              payload: { batch_id: "${b1}", zone_code: "Z-1", area_m2: 50 }
              as: Installer
              as_user_id: "inst-bob"
              captures: { z1: $.data.id }
            - *c_get_site
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "DAMAGE", new_zone_code: "Z-1R", expected_site_version: "${sv1}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ord1: $.data.id }
            - call: "POST /carpetloop/replacement-orders/${ord1}/match"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - call: "POST /carpetloop/replacement-orders/${ord1}/complete"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
            - call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: PlatformAdmin
              captures: { sv2: $.data.version }
            - call: "GET /carpetloop/zones"
              payload: { site_id: "${site1}", status: "IN_SERVICE" }
              as: PlatformAdmin
              captures: { z1r: "$.data[0].id" }
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1r}", reason: "WEAR", new_zone_code: "Z-1RR", expected_site_version: "${sv2}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { ord2: $.data.id }
          trigger:
            - call: "POST /carpetloop/replacement-orders/${ord1}/match"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
              captures: { err1: $.data.error_id }
            - call: "POST /carpetloop/replacement-orders/${ord2}/complete"
              payload: {}
              as: Installer
              as_user_id: "inst-bob"
              captures: { err2: $.data.error_id }
            - call: "GET /carpetloop/sites/${site1}"
              payload: {}
              as: PlatformAdmin
              captures: { sv3: $.data.version }
            - call: "POST /carpetloop/replacement-orders"
              payload: { site_id: "${site1}", zone_id: "${z1}", reason: "WEAR", new_zone_code: "Z-1X", expected_site_version: "${sv3}" }
              as: Specifier
              as_user_id: "spec-ada"
              captures: { err3: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_STATE (COMPLETED is terminal for match)"
            - "err2 == ERR_ORDER_NOT_MATCHED (DRAFT cannot complete)"
            - "err3 == ERR_ZONE_NOT_IN_SERVICE (Z-1 is REPLACED)"
            - "the replacement zone Z-1R was created from batch DL-100 with area_m2 == 50 and status IN_SERVICE (captured via the filtered zones list)"

  # ===========================================================================
  - section: calculations
    instances:

      - name: pcf_input_set_filters_by_status_and_half_open_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.pcf_footprint
          - entities.TileBatch.fields.production_date
        distinguishing_aspect: "The report's batch set excludes a QUARANTINE batch inside the window and a RELEASED batch outside it: with both present, the submitted operational value is exactly the in-window RELEASED batch's 6.000, proving both filters."
        test_recipe:
          setup:
            - "Collection GAT. B-Q: produced 2026-09-05, never released (QUARANTINE). B-OUT: produced 2026-08-20 (before the window), released, embodied 6.200. B-IN: produced 2026-09-20, released, embodied 6.000 (50 m2, mix 100 kg @0.40 + 100 kg @2.10, intensity 1.0)."
            - "Report period [2026-09-01, 2026-10-01)."
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 100, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { lotA: $.data.id }
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 200, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lotB: $.data.id }
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "POST_CONSUMER_TILE", quantity_kg: 100, carbon_factor_kgco2e_per_kg: 0.40 }
              as: PlatformAdmin
              captures: { lotC: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lotA}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /carpetloop/feedstock-lots/${lotB}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /carpetloop/feedstock-lots/${lotC}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-Q", production_date: "2026-09-05T00:00:00Z", produced_m2: 50, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.1 }
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-OUT", production_date: "2026-08-20T00:00:00Z", produced_m2: 50, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.2 }
              as: PlatformAdmin
              captures: { bO: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lotA}/allocate"
              payload: { batch_id: "${bO}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - call: "POST /carpetloop/feedstock-lots/${lotB}/allocate"
              payload: { batch_id: "${bO}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - call: "POST /carpetloop/batches/${bO}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-IN", production_date: "2026-09-20T00:00:00Z", produced_m2: 50, mfg_intensity_kgco2e_per_m2: 1.0, delta_e: 0.3 }
              as: PlatformAdmin
              captures: { bI: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lotC}/allocate"
              payload: { batch_id: "${bI}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - call: "POST /carpetloop/feedstock-lots/${lotB}/allocate"
              payload: { batch_id: "${bI}", quantity_kg: 100 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - call: "POST /carpetloop/batches/${bI}/release"
              payload: {}
              as: PlatformAdmin
            - *c_rep_gate
          trigger:
            - *c_submit1
          assert:
            - "PCFReport.${rep1}.operational_kgco2e_per_m2 == 6.000 — only B-IN contributes"
            - "B-Q (QUARANTINE, in-window) and B-OUT (RELEASED, produced 2026-08-20 before the half-open window) are both excluded; either leaking would move the value"
            - "PCFReport.${rep1}.lifecycle_kgco2e_per_m2 == 6.350 (no credited take-backs: 6.000 + 0.350)"

      - name: supplier_reliability_pass_rate_over_decided_lots
        claim_type: Correct Result
        grounds:
          - calculations.supplier_reliability
          - entities.FeedstockLot.fields.supplier_reliability_pct
        distinguishing_aspect: "Reliability is computed chronologically at each lot's creation over that supplier's decided lots only: first lot 100.00 by default, then 50.00 after a 100 kg PASS plus 100 kg FAIL, then 80.00 once a 300 kg PASS enters the decided set — RECEIVED lots never count."
        test_recipe:
          setup: ["Supplier NETCO sequence: lot R1 (100 kg) -> PASS; lot R2 (100 kg) -> FAIL; lot R3 (300 kg) -> PASS; lot R4 (50 kg) created last."]
          setup_api_calls:
            - *c_clock
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 100, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { r1: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${r1}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "RECLAIMED_FISHING_NET", quantity_kg: 100, carbon_factor_kgco2e_per_kg: 0.50 }
              as: PlatformAdmin
              captures: { r2: $.data.id, rel2: $.data.supplier_reliability_pct }
            - call: "POST /carpetloop/feedstock-lots/${r2}/qc"
              payload: { outcome: "FAIL" }
              as: PlatformAdmin
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "POST_CONSUMER_TILE", quantity_kg: 300, carbon_factor_kgco2e_per_kg: 0.40 }
              as: PlatformAdmin
              captures: { r3: $.data.id, rel3: $.data.supplier_reliability_pct }
            - call: "POST /carpetloop/feedstock-lots/${r3}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "POST_INDUSTRIAL_SCRAP", quantity_kg: 50, carbon_factor_kgco2e_per_kg: 0.90 }
              as: PlatformAdmin
              captures: { r4: $.data.id, rel4: $.data.supplier_reliability_pct }
          assert:
            - "FeedstockLot.${r1}.supplier_reliability_pct == 100.00 (no prior decided lots)"
            - "rel2 == 100.00 (only R1 PASS decided at R2's creation)"
            - "rel3 == 50.00 (PASS 100 of decided 200 kg)"
            - "rel4 == 80.00 (PASS 400 of decided 500 kg; R3's PASS counts only after its QC decision)"

      - name: target_posture_threshold_boundaries
        claim_type: Constants Applied
        grounds:
          - calculations.target_posture
          - entities.ManufacturingTarget.fields.posture
        distinguishing_aspect: "Threshold precision on the posture rule with baseline 8.0 and reduction 0.25 (target 6.0): current 6.0 lands ON_TRACK (inclusive <=), 6.001 falls to AT_RISK, exactly-baseline 8.0 stays AT_RISK, and 8.0001 tips BREACHED — each reading becoming current by latest period_end."
        test_recipe:
          setup: ["Target PG (baseline 8.0, reduction 0.25) created — initial current equals baseline."]
          setup_api_calls:
            - *c_clock
            - &c_tgt_pg
              call: "POST /carpetloop/manufacturing-targets"
              payload: { program_name: "PG", baseline_intensity_kgco2e_per_m2: 8.0, target_reduction_pct: 0.25 }
              as: PlatformAdmin
              captures: { tgt1: $.data.id, pos0: $.data.posture }
          trigger:
            - call: "POST /carpetloop/manufacturing-targets/${tgt1}/readings"
              payload: { period_end: "2026-10-01T00:00:00Z", intensity_kgco2e_per_m2: 6.0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { pos1: $.data.posture }
            - call: "POST /carpetloop/manufacturing-targets/${tgt1}/readings"
              payload: { period_end: "2026-10-02T00:00:00Z", intensity_kgco2e_per_m2: 6.001 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { pos2: $.data.posture }
            - call: "POST /carpetloop/manufacturing-targets/${tgt1}/readings"
              payload: { period_end: "2026-10-03T00:00:00Z", intensity_kgco2e_per_m2: 8.0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { pos3: $.data.posture }
            - call: "POST /carpetloop/manufacturing-targets/${tgt1}/readings"
              payload: { period_end: "2026-10-04T00:00:00Z", intensity_kgco2e_per_m2: 8.0001 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { pos4: $.data.posture }
          assert:
            - "pos0 == AT_RISK (initial current == baseline 8.0, above target 6.0)"
            - "pos1 == ON_TRACK (6.0 <= 6.0 inclusive boundary)"
            - "pos2 == AT_RISK (6.001 > 6.0)"
            - "pos3 == AT_RISK (8.0 <= 8.0 baseline inclusive)"
            - "pos4 == BREACHED (8.0001 > 8.0)"

      - name: release_mass_constant_and_embodied_formula
        claim_type: Correct Result
        grounds:
          - calculations.batch_embodied_carbon
          - calculations.batch_recycled_content
          - state_machines.TileBatch.QUARANTINE_to_RELEASED
        distinguishing_aspect: "The release gate measures allocated mass against produced_m2 x 4.0 kg exactly: a 25 m2 batch with 100 kg allocated releases, yielding recycled_content_pct 50.00 and embodied 5.900 (= round((20 + 105)/25, 4) + 0.9 at the pinned precision)."
        test_recipe:
          setup: ["Collection GAT; batch DL-25 (25 m2, intensity 0.9) with mix 50 kg post-consumer @0.40 + 50 kg virgin @2.10."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "NETCO", source_type: "POST_CONSUMER_TILE", quantity_kg: 50, carbon_factor_kgco2e_per_kg: 0.40 }
              as: PlatformAdmin
              captures: { lotP: $.data.id }
            - call: "POST /carpetloop/feedstock-lots"
              payload: { supplier_name: "POLYCO", source_type: "VIRGIN", quantity_kg: 50, carbon_factor_kgco2e_per_kg: 2.10 }
              as: PlatformAdmin
              captures: { lotV: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lotP}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /carpetloop/feedstock-lots/${lotV}/qc"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /carpetloop/collections/${col_id}/batches"
              payload: { dye_lot_code: "DL-25", production_date: "2026-09-05T00:00:00Z", produced_m2: 25, mfg_intensity_kgco2e_per_m2: 0.9, delta_e: 0.2 }
              as: PlatformAdmin
              captures: { b25: $.data.id }
            - call: "POST /carpetloop/feedstock-lots/${lotP}/allocate"
              payload: { batch_id: "${b25}", quantity_kg: 50 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
            - call: "POST /carpetloop/feedstock-lots/${lotV}/allocate"
              payload: { batch_id: "${b25}", quantity_kg: 50 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          trigger:
            - call: "POST /carpetloop/batches/${b25}/release"
              payload: {}
              as: PlatformAdmin
          assert:
            - "release succeeds: allocated_mass_kg 100 == 25 x 4.0 at 2dp"
            - "TileBatch.${b25}.status == RELEASED, recycled_content_pct == 50.00"
            - "embodied_carbon_kg_per_m2 == 5.900 (feedstock component (50*0.40 + 50*2.10)/25 = 5.0000 at 4dp, plus intensity 0.9)"

      - name: credit_rounding_order_pinned
        claim_type: Precision
        grounds:
          - calculations.takeback_credit
          - entities.TakeBackRequest.fields.credit_cents
        distinguishing_aspect: "Nested rounding order pinned: recovered m2 rounded to 2dp BEFORE applying the grade rate — 160.26 kg -> 40.07 m2 -> 6010.5 -> 6011 cents; the rejected multiply-then-divide order would produce 6010."
        test_recipe:
          setup: ["Collection GAT (claim_intent NONE -> STANDARD variant); site INSTALLED; take-back grade B collected 160.26 kg."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_site1
            - *c_install1
            - *c_tb1
            - *c_sched1
            - *c_clock_sep12
            - call: "POST /carpetloop/take-back-requests/${tb1}/collect"
              payload: { collected_kg: 160.26 }
              as: Installer
              as_user_id: "inst-bob"
          trigger:
            - call: "POST /carpetloop/take-back-requests/${tb1}/sort"
              payload: { reuse_kg: 40.26, depolymerize_kg: 80, downcycle_kg: 40, landfill_kg: 0 }
              as: SustainabilityManager
              as_user_id: "sm-carol"
          assert:
            - "TakeBackRequest.${tb1}.credit_cents == 6011 (40.065 rounds to 40.07 at 2dp half-up; 40.07 x 150 = 6010.5 -> 6011 half-up)"
            - "the naive order round(160.26 x 150 / 4) would give 6010 — the pinned order is observable"
            - "credit_variant == STANDARD"

      - name: pcf_submit_with_empty_input_set_returns_422
        claim_type: Input Set Filtering
        grounds:
          - calculations.pcf_footprint
          - errors[ERR_EMPTY_REPORT_INPUT]
        distinguishing_aspect: "The empty-set edge: a report whose period contains no RELEASED or EXHAUSTED batches cannot be submitted — ERR_EMPTY_REPORT_INPUT at submit, not a division by zero."
        test_recipe:
          setup: ["Collection GAT with no batches at all; report created for [2026-09-01, 2026-10-01)."]
          setup_api_calls:
            - *c_clock
            - *c_col_gate_none
            - *c_rep_gate
          trigger:
            - call: "POST /carpetloop/pcf-reports/${rep1}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
          assert:
