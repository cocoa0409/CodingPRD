      - name: error_employee_cannot_create_unit_returns_unauthorized
        claim_type: role_denial
        grounds: ["validations[priority=2]", roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Employee role invoking POST /units (PropertyManager-exclusive) returns ERR_UNAUTHORIZED (403)."
