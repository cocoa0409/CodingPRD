# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# domain: charitable-solicitation-registration
# Nine §0.5 rule blocks, 21 instances. Every literal in an `assert:` line was
# computed by executing the §1.3 formula it derives from.
# Logical clock starts at 2026-08-01T00:00:00Z in every chain below.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: assurance_basis_divergence_ca_review_vs_ny_none
        grounds:
          - calculations.assurance_requirement_derivation
          - calculations.assurance_requirement_derivation.variants.contributions_only_basis
          - calculations.assurance_requirement_derivation.variants.gross_revenue_basis
          - entities.StateProfile.fields.assurance_basis
          - entities.StateRegistration.fields.required_financial_attestation
        distinguishing_aspect: |
          One and the same FinancialStatement row (total_revenue_cents 26000000,
          contributions_cents 20000000) yields required_financial_attestation == REVIEW on the
          CA filing under gross_revenue_basis and NONE on the NY filing under
          contributions_only_basis, because CA measures total_revenue_cents against its
          20000000 review threshold while NY measures contributions_cents against its
          25000000 review threshold.
        test_recipe:
          setup:
            - "StateProfile CA with assurance_basis GROSS_REVENUE, review_threshold_cents 20000000, online_presence_counts true, online_surcharge_cents 1000."
            - "StateProfile NY with assurance_basis CONTRIBUTIONS_ONLY, review_threshold_cents 25000000, online_presence_counts false, online_surcharge_cents 0."
            - "Organization with fiscal_year_end_month 6, domicile CA, has_online_donation_page true, solicitation_posture CLEAR."
            - "One CURRENT FinancialStatement for fiscal_year 2026 with total_revenue_cents 26000000 and contributions_cents 20000000."
            - "Two DRAFT INITIAL StateRegistration rows for fiscal_year 2026, one in CA and one in NY, both pointing at that statement."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, donor_count_trigger: 25, contribution_trigger_cents: 2500000, online_presence_counts: true, extension_allowed: true, extension_max_days: 90, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE", "FINANCIAL_STATEMENT_AVAILABILITY"], fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
            - call: "POST /state-profiles"
              payload: { state_code: "NY", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "CONTRIBUTIONS_ONLY", review_threshold_cents: 25000000, audit_threshold_cents: 100000000, donor_count_trigger: 25, contribution_trigger_cents: 2500000, online_presence_counts: false, extension_allowed: false, extension_max_days: 0, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE", "TAX_DEDUCTIBILITY"], fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: false, coventure_buffer_days: 0, base_filing_fee_cents: 2500, online_surcharge_cents: 0, per_contract_fee_cents: 0, filing_fee_cap_cents: 30000, late_fee_base_cents: 5000, late_fee_escalation_pct: 0.1, late_fee_cap_cents: 12000, cure_period_days: 15, reinstatement_fee_cents: 25000 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_ca_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "NY", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_ny_id: $.data.id }
          assert:
            - "StateRegistration.${reg_ca_id}.required_financial_attestation == REVIEW"
            - "StateRegistration.${reg_ny_id}.required_financial_attestation == NONE"
            - "StateRegistration.${reg_ca_id}.financial_statement_id == ${reg_ny_id}.financial_statement_id"
            - "StateRegistration.${reg_ca_id}.filing_fee_cents == 24000"
            - "StateRegistration.${reg_ny_id}.filing_fee_cents == 22500"
            - "FinancialStatement.${fs_id}.functional_expense_total_cents == 24000000"
            - "FinancialStatement.${fs_id}.program_ratio == 0.75"

      - name: coventure_projected_vs_actual_benefit_divergence
        grounds:
          - calculations.coventure_benefit_determination
          - calculations.coventure_benefit_determination.variants.projected_guarantee_basis
          - calculations.coventure_benefit_determination.variants.actual_settlement_basis
          - state_machines.CoventurePromotion.DRAFT_to_FILED
          - state_machines.CoventurePromotion.ACTIVE_to_SETTLED
          - entities.CoventurePromotion.fields.projected_benefit_cents
          - entities.CoventurePromotion.fields.final_benefit_cents
        distinguishing_aspect: |
          From identical stored inputs (guaranteed_minimum_cents 500000, per_unit_cents 250)
          the projected_guarantee_basis variant returns 750000 at DRAFT -> FILED because
          projected_units 3000 makes the per-unit term dominate, while the
          actual_settlement_basis variant returns 500000 at settlement because actual_units
          1600 lets the guaranteed minimum bind — a 250000 delta on one row.
        test_recipe:
          setup:
            - "StateProfile CA with coventure_filing_required true and fundraiser_bond_minimum_cents 2500000."
            - "Organization domiciled CA with solicitation_posture CLEAR and one certifying officer."
            - "ProfessionalFundraiser of type COMMERCIAL_COVENTURER with an ACTIVE FundraiserRegistration in CA."
            - "CoventurePromotion in CA for window [2026-09-01, 2026-09-30] with guaranteed_minimum_cents 500000, per_unit_cents 250, projected_units 3000."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, extension_allowed: true, extension_max_days: 90, disclosure_required_clauses: ["REGISTRATION_DISCLOSURE", "FINANCIAL_STATEMENT_AVAILABILITY"], fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /professional-fundraisers"
              payload: { legal_name: "BrightMart Retail Co", fundraiser_type: "COMMERCIAL_COVENTURER", bond_amount_cents: 2500000, bond_expires_at: "2028-12-31T00:00:00Z" }
              as: SystemAdmin
              captures: { cv_id: $.data.id }
            - call: "POST /fundraiser-registrations"
              payload: { fundraiser_id: "${cv_id}", state_code: "CA", bond_on_file_cents: 2500000, expires_at: "2027-12-31T00:00:00Z" }
              as: FundraiserAgent
              as_user_id: "${cv_id}"
            - call: "POST /coventure-promotions"
              payload: { organization_id: "${org_id}", coventurer_id: "${cv_id}", state_codes: ["CA"], promo_start: "2026-09-01T00:00:00Z", promo_end: "2026-09-30T00:00:00Z", guaranteed_minimum_cents: 500000, per_unit_cents: 250, projected_units: 3000 }
              as: ComplianceOfficer
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /coventure-promotions/${promo_id}/file"
              payload: {}
              as: ComplianceOfficer
              captures: { projected_after_file: $.data.projected_benefit_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /coventure-promotions/${promo_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /coventure-promotions/${promo_id}/settle"
              payload: { actual_units: 1600, remitted_cents: 500000 }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
          assert:
            - "CoventurePromotion.${promo_id}.projected_benefit_cents == 750000"
            - "CoventurePromotion.${promo_id}.final_benefit_cents == 500000"
            - "CoventurePromotion.${promo_id}.shortfall_cents == 0"
            - "CoventurePromotion.${promo_id}.status == SETTLED"
            - "CoventurePromotion.${promo_id}.projected_benefit_cents - CoventurePromotion.${promo_id}.final_benefit_cents == 250000"
            - "CoventurePromotion.${promo_id}.disclosure_clause_required == true"

  - rule_id: combinatorial_formula
    instances:

      - name: filing_fee_clamp_applied_after_initial_multiplier_ca
        grounds:
          - calculations.filing_fee_assessment
          - calculations.filing_fee_assessment.constants.INITIAL_FILING_MULTIPLIER
          - calculations.filing_fee_assessment.constants.TIER_4_BASE_CENTS
          - entities.StateProfile.fields.filing_fee_cap_cents
          - entities.StateProfile.fields.online_surcharge_cents
          - entities.StateRegistration.fields.filing_fee_cents
        distinguishing_aspect: |
          Mode (a) — clamp/multiplier ordering. Four inputs (contributions tier, the pair of
          online flags, per-contract count, registration_type) combine so that the INITIAL
          filing lands on 30000 only because round_half_up(41000 * 1.5) = 61500 is clamped
          afterwards; clamping first would yield 30000 * 1.5 = 45000, and the RENEWAL filing
          on the same organization lands on 16000 with no multiplier at all.
        test_recipe:
          setup:
            - "StateProfile CA with base_filing_fee_cents 2500, online_surcharge_cents 1000, per_contract_fee_cents 1500, filing_fee_cap_cents 30000, online_presence_counts true."
            - "Organization with has_online_donation_page true and no FundraisingContract rows at all."
            - "CURRENT FinancialStatement for fiscal_year 2026 with contributions_cents 50000000 (tier 4)."
            - "CURRENT FinancialStatement for fiscal_year 2025 with contributions_cents 20000000 (tier 3)."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, extension_allowed: true, extension_max_days: 90, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 50000000, contributions_cents: 50000000, program_expense_cents: 40000000, fundraising_expense_cents: 6000000, management_expense_cents: 4000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs26_id: $.data.id }
            - call: "GET /organizations/${org_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { org_v2: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2025, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v2}" }
              as: ComplianceOfficer
              captures: { fs25_id: $.data.id }
          trigger:
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs26_id}" }
              as: ComplianceOfficer
              captures: { reg_initial_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "RENEWAL", fiscal_year: 2025, coverage_start: "2024-07-01T00:00:00Z", coverage_end: "2025-07-01T00:00:00Z", financial_statement_id: "${fs25_id}" }
              as: ComplianceOfficer
              captures: { reg_renewal_id: $.data.id }
          assert:
            - "StateRegistration.${reg_initial_id}.filing_fee_cents == 30000"
            - "StateRegistration.${reg_renewal_id}.filing_fee_cents == 16000"
            - "StateRegistration.${reg_initial_id}.required_financial_attestation == REVIEW"
            - "StateRegistration.${reg_initial_id}.renewal_due_date == 2026-11-14T00:00:00Z"
            - "StateRegistration.${reg_renewal_id}.renewal_due_date == 2025-11-14T00:00:00Z"

      - name: late_penalty_per_month_rounding_before_summation_ca
        grounds:
          - calculations.late_penalty_accrual
          - calculations.late_penalty_accrual.constants.DAYS_PER_ACCRUAL_MONTH
          - entities.StateProfile.fields.late_fee_base_cents
          - entities.StateProfile.fields.late_fee_escalation_pct
          - entities.EnforcementAction.fields.penalty_cents
          - entities.EnforcementAction.fields.cure_deadline
        distinguishing_aspect: |
          Mode (b) — rounding order. With late_fee_base_cents 2004, late_fee_escalation_pct
          0.125 and 106 days late (months_late 4) the pinned round-each-month-then-sum order
          yields 2004 + 2255 + 2505 + 2756 = 9520, whereas summing the unrounded monthly
          multipliers first (2004 * 4.75 = 9519.0) and rounding once yields 9519.
        test_recipe:
          setup:
            - "StateProfile CA with late_fee_base_cents 2004, late_fee_escalation_pct 0.125, late_fee_cap_cents 50000, cure_period_days 30."
            - "Organization with fiscal_year_end_month 6, so the CA fiscal_year 2026 filing has renewal_due_date 2026-11-14T00:00:00Z and no extension."
            - "That filing is REGISTERED, and the logical clock has been moved to 2027-02-28T00:00:00Z (106 days past due)."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, extension_allowed: true, extension_max_days: 90, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "FINANCIAL_STATEMENT", prepared_by_officer_id: "${prep_id}", page_count: 8 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "REVIEW_REPORT", prepared_by_officer_id: "${prep_id}", page_count: 4 }
              as: ComplianceOfficer
            - call: "POST /state-registrations/${reg_id}/submit"
              payload: { certification_note: "Certified under penalty of perjury." }
              as: CertifyingOfficer
              as_user_id: "${cert_id}"
            - call: "POST /state-registrations/${reg_id}/review"
              payload: { decision: "APPROVE" }
              as: StateRegulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-28T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /enforcement-actions"
              payload: { organization_id: "${org_id}", registration_id: "${reg_id}", action_type: "PENALTY_ASSESSMENT" }
              as: StateRegulator
              captures: { act_id: $.data.id, act_penalty: $.data.penalty_cents }
          assert:
            - "EnforcementAction.${act_id}.penalty_cents == 9520"
            - "EnforcementAction.${act_id}.penalty_cents != 9519"
            - "EnforcementAction.${act_id}.cure_deadline == 2027-03-30T00:00:00Z"
            - "EnforcementAction.${act_id}.status == OPEN"
            - "EnforcementAction.${act_id}.state_code == CA"
            - "Organization.${org_id}.penalty_outstanding_cents == 9520"

      - name: remediation_settlement_discount_keyed_on_penalty_subtotal_ca
        grounds:
          - calculations.remediation_settlement_total
          - calculations.remediation_settlement_total.constants.DISCOUNT_TIER_2_MIN_CENTS
          - entities.StateProfile.fields.reinstatement_fee_cents
          - entities.EnforcementAction.fields.settlement_total_cents
          - state_machines.EnforcementAction.OPEN_to_REMEDIATION_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — apparent circularity. With penalty_subtotal 18000 and
          reinstatement_fee_cents 12500 the pinned 1->2->3->4 order gives discount_pct 0.00,
          fee 12500 and settlement_total_cents 30500; keying the discount tier on the
          resulting total (30500 >= 20000 -> 0.10) would instead give 11250 and 29250.
        test_recipe:
          setup:
            - "StateProfile CA with reinstatement_fee_cents 12500 and cure_period_days 30."
            - "A REGISTERED CA filing for fiscal_year 2026 on an organization with no other enforcement history."
            - "One OPEN EnforcementAction of type PENALTY_ASSESSMENT on that filing whose penalty_cents was overridden to 18000, issued at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, online_presence_counts: true, extension_allowed: true, extension_max_days: 90, fundraiser_contract_filing_days: 10, fundraiser_bond_minimum_cents: 2500000, coventure_filing_required: true, coventure_buffer_days: 7, base_filing_fee_cents: 2500, online_surcharge_cents: 1000, per_contract_fee_cents: 1500, filing_fee_cap_cents: 30000, late_fee_base_cents: 2004, late_fee_escalation_pct: 0.125, late_fee_cap_cents: 50000, cure_period_days: 30, reinstatement_fee_cents: 12500 }
              as: SystemAdmin
            - call: "POST /organizations"
              payload: { legal_name: "Harbor Light Foundation", ein: "123456789", domicile_state_code: "CA", fiscal_year_end_month: 6, has_online_donation_page: true }
              as: ComplianceOfficer
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /financial-statements"
              payload: { organization_id: "${org_id}", fiscal_year: 2026, total_revenue_cents: 26000000, contributions_cents: 20000000, program_expense_cents: 18000000, fundraising_expense_cents: 4000000, management_expense_cents: 2000000, assurance_level: "REVIEW", expected_organization_version: "${org_v}" }
              as: ComplianceOfficer
              captures: { fs_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Dana Reyes", title: "PRESIDENT", is_certifying_officer: true }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /officer-disclosures"
              payload: { organization_id: "${org_id}", officer_name: "Sam Okoye", title: "SECRETARY" }
              as: ComplianceOfficer
              captures: { prep_id: $.data.id }
            - call: "POST /state-registrations"
              payload: { organization_id: "${org_id}", state_code: "CA", registration_type: "INITIAL", fiscal_year: 2026, coverage_start: "2025-07-01T00:00:00Z", coverage_end: "2026-07-01T00:00:00Z", financial_statement_id: "${fs_id}" }
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registration-documents"
              payload: { registration_id: "${reg_id}", doc_type: "GOVERNING_DOCUMENT", prepared_by_officer_id: "${prep_id}", page_count: 12 }
              as: ComplianceOfficer
            - call: "POST /registration-documents"
