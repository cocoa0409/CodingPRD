            - call: "GET /actuarial/exam-windows/${win_id}"
              as: Registrar
              captures: { seats_after: $.data.seats_held, waitl_after: $.data.waitlist_count }
            - call: "GET /actuarial/candidates/${cand2_id}/registrations"
              as: Registrar
              captures: { reg2_logi2: "$.data[0].logistics_status", reg2_fee: "$.data[0].fee_charged_cents" }
          assert:
            - "${reg2_logi} == WAITLISTED and ${seats_before} == 1 and ${waitl_before} == 1 (capacity boundary: == capacity waitlists)"
            - "${reg1_refund} == 30450 (cancel before deadline: 100%)"
            - "${seats_after} == 1 and ${waitl_after} == 0 — seats_held conserved across the cancel+promote pair"
            - "${reg2_logi2} == REGISTERED and ${reg2_fee} == 30450 (promotion charged the early-tier fee)"
      - name: net_fee_paid_invariant_under_register_then_full_refund_cancel
        grounds:
          - calculations.registration_fee_cents
          - calculations.refund_cents
          - entities.ExamRegistration.fields.fee_charged_cents
          - entities.ExamRegistration.fields.refund_cents
        distinguishing_aspect: |
          Conserved quantity = money (different from the sibling's seat count): the
          candidate's net fee paid, sum(fee_charged_cents) - sum(refund_cents) over
          their registrations, must equal 0 before AND after a register + cancel
          pair inside the full-refund window — the cancel exactly compensates the
          registration.
        test_recipe:
          setup:
            - "Window P-2026-10; cand1 REGISTERED early (fee 30450); clock still 2026-09-01 (before the 2026-10-01 deadline)"
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand1_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { reg1_id: $.data.id, fee: $.data.fee_charged_cents }
          trigger:
            - call: "POST /actuarial/exam-registrations/${reg1_id}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand1_id}"
              captures: { refund: $.data.refund_cents, logi: $.data.logistics_status }
          assert:
            - "${fee} == 30450 (early tier: 30000 + round_half_up(30000*0.015)=450)"
            - "${refund} == 30450 (cancel before deadline: 100% of fee)"
            - "${logi} == CANCELLED"
            - "net fee paid == 30450 - 30450 == 0 — the pair conserves the money invariant"
