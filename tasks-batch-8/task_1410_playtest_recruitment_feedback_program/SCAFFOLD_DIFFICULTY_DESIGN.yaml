            - "pa_status == SUSPENDED                    # cascade link 1"
            - "pa_risk == 25                             # MAJOR severity weight"
            - "bka_status == CANCELLED                   # cascade link 2 (from the suspension, not the substantiation directly)"
            - "bkb_status == PROMOTED                    # cascade link 3 (from the freed seat)"
