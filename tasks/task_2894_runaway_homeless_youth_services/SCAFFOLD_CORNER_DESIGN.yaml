        grounds:
          - roles.OutreachWorker.exclusive_operations
          - roles.ShelterCaseManager.exclusive_operations
          - roles.ReunificationSpecialist.exclusive_operations
          - roles.TlpCoordinator.exclusive_operations
          - roles.ProgramAdmin.exclusive_operations
          - roles.YouthMember.exclusive_operations
        distinguishing_aspect: "The positive half of the matrix: one pass exercises at least one exclusive write per role - intake, admission, case opening, placement, program licensing and vote casting - and every one returns its declared success code, proving the role lists are permissive as well as restrictive."
