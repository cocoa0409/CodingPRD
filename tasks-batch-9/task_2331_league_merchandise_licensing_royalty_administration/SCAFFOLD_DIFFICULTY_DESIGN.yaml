      - name: underreport_rate_cost_shift_threshold_inclusive_at_500_bps
        grounds:
          - calculations.underreporting_recovery_assessment
          - calculations.underreporting_recovery_assessment.constants.COST_SHIFT_THRESHOLD_BPS
          - entities.AuditEngagement.fields.underreport_rate_bps
          - entities.AuditEngagement.fields.cost_shift_applied
          - state_machines.AuditEngagement.FINDINGS_ISSUED_to_DISPUTED
          - state_machines.AuditEngagement.DISPUTED_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          cost_shift_applied is (underreport_rate_bps >= 500), an INCLUSIVE boundary,
          and the rate itself is FLOORED. Round one restates gross to 6562500:
          underreported 25000 on reported 500000 is exactly 500 bps, so the 750000
          audit-cost recovery attaches and recovery_assessed_cents is 775375. The
          licensee disputes; round two restates gross to 6561875, giving underreported
          24950 and floor(24950 * 10000 / 500000) == 499 bps — one basis point below —
          so the cost recovery vanishes and recovery_assessed_cents collapses to 25324.
          Rounding the rate instead of flooring it would report 499 as 500 and keep the
          750000. The re-issue also exercises the DISPUTED -> FINDINGS_ISSUED cycle,
          which must OVERWRITE the whole findings block rather than accumulate it.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z, so opened_quarter == 2026Q3 and ELAPSED_QUARTERS(2026Q2, 2026Q3) == 1"
