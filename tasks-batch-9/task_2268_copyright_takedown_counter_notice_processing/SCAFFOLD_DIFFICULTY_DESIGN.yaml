              as: ComplianceOfficer
              captures: { prov_id: "$.data.id" }
            - call: "POST /dmca/providers/${prov_id}/publish-contact"
              payload: { public_contact_url: "https://northstar.example/legal/dmca-agent" }
              as: ComplianceOfficer
              captures: { prov_v1: "$.data.version" }
            - call: "POST /dmca/designated-agents"
              payload: { provider_id: "${prov_id}", agent_name: "Dana Reyes", agent_email: "dmca@northstar.example", agent_phone: "+1-555-0100", mailing_address: "1 Harbor Way, Springfield, IL 62701" }
              as: ComplianceOfficer
              captures: { agent_id: "$.data.id" }
            - call: "POST /dmca/designated-agents/${agent_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /dmca/designated-agents/${agent_id}/register"
              payload: { expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
            - call: "POST /dmca/rights-holders"
              payload: { legal_name: "Orbit Records LLC", contact_email: "legal@orbit.example" }
              as: ComplianceOfficer
              captures: { rh_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_at_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], signature_present: true, work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
              as: TakedownAgent
              captures: { n_below_id: "$.data.id" }
            - call: "POST /dmca/notices"
              payload: { rights_holder_id: "${rh_id}", submission_channel: "WEB_FORM", claimed_urls: ["https://northstar.example/v/1"], work_identification: "Sound recording: Orbit Vol. 1, track 3", material_identification: "Track 3 posted at /v/1", contact_email: "legal@orbit.example", good_faith_statement: true, accuracy_statement: true, authority_statement: true, sworn_under_penalty: true }
