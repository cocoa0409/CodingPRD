            - call: "POST /advocacy/committees/${cm_id}/seats"
              payload: { member_id: "${m1_id}", seat_role: "CHAIR" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${cm_id}/seats"
              payload: { member_id: "${m2_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/committees/${cm_id}/seats"
              payload: { member_id: "${m3_id}", seat_role: "MEMBER" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions"
              payload: { committee_id: "${cm_id}", title: "Oppose Section 232 Expansion", jurisdiction_code: "FEDERAL", summary: "Association position on tariff scope." }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { pos_id: $.data.id }
            - call: "POST /advocacy/policy-positions/${pos_id}/open-ballot"
              payload: { ballot_deadline_date: "2026-08-15" }
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m1_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "SUPPORT" }
              as: MemberDelegate
              as_user_id: "${m2_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/votes"
              payload: { ballot: "OPPOSE", dissent_statement: "Gamma Forge dissents on scope." }
              as: MemberDelegate
              as_user_id: "${m3_id}"
            - call: "POST /advocacy/policy-positions/${pos_id}/tally"
              payload: {}
              as: GovAffairsDirector
              as_user_id: "gad-1"
            - call: "POST /advocacy/policy-positions/${pos_id}/adopt"
              payload: {}
              as: BoardTrustee
              as_user_id: "bt-1"
            - call: "POST /advocacy/lobbying-registrations"
              payload: { jurisdiction_code: "FEDERAL", registrant_name: "National Metals Association", coverage_start_date: "2026-01-01", coverage_end_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_id: $.data.id }
            - call: "POST /advocacy/lobbying-registrations/${reg_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /advocacy/lobbying-registrations/${reg_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_v_stale: $.data.version }
            - call: "POST /advocacy/lobbying-activities"
              payload: { registration_id: "${reg_id}", position_id: "${pos_id}", activity_kind: "DIRECT_LOBBYING", activity_date: "2026-02-15", hours: 2.0, expenditure_cents: 300000 }
              as: GovAffairsDirector
              as_user_id: "gad-1"
              captures: { act_id: $.data.id }
          trigger:
            - call: "POST /advocacy/expenditure-reports"
              payload: { registration_id: "${reg_id}", period_code: "2026Q1", basis: "METHOD_A", expected_registration_version: "${reg_v_stale}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /advocacy/lobbying-registrations/${reg_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { reg_v_current: $.data.version }
            - call: "POST /advocacy/expenditure-reports"
              payload: { registration_id: "${reg_id}", period_code: "2026Q1", basis: "METHOD_A", expected_registration_version: "${reg_v_current}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rep_id: $.data.id }
          assert:
            - "reg_v_stale was read after file and before the activity; logging the activity incremented the registration version, so reg_v_current == reg_v_stale + 1"
            - "The first create returns HTTP 412 with error_id ERR_STALE_REGISTRATION_VERSION and no ExpenditureReport row is created"
            - "The second create - identical except for the version - returns HTTP 201 with status OPEN, included_activity_count 1, method_a_total_cents 300000 and filed_total_cents 300000"
            - "GET /advocacy/lobbying-registrations/${reg_id}/expenditure-reports returns total_count == 1"
            - "The registration version increments on every accepted write and never on a rejected one: it is unchanged by the 412 attempt"
      - name: adoption_cascade_runs_end_to_end_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / adopt_position_cascades_votes_to_members_to_seats_to_committee
          rationale: "That instance verifies the four-level chain (vote dissent_status -> member recorded_dissent_count -> seat status DAMPENED -> committee total_voting_weight and roster_state) inside the single adopt response and its read-backs, including that only non-superseded votes participate."
      - name: both_expenditure_bases_are_computed_on_every_report
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / expenditure_report_method_a_vs_method_b_divergence
          rationale: "That instance asserts method_a_total_cents and method_b_total_cents on identical activity sets, the per-activity rounding that makes them diverge, and which one filed_total_cents copies for each basis."
      - name: reportable_threshold_flips_the_registration_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.LobbyingRegistration
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / log_activity_blocked_by_auto_amendment_pending_registration_rejected
          rationale: "That instance drives the cumulative ytd_reportable_cents onto the JURISDICTION_RULES threshold exactly (>= semantics), shows the auto-amendment firing in the same request that created the activity, shows the next log refused with ERR_REGISTRATION_NOT_ACTIVE, and shows the one-shot arming reset by amendment_round so the threshold never fires twice."
  - section: Consistency Model
    instances:
      - name: every_derived_field_is_current_in_the_mutating_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transitive_cascade / board_approve_cascades_fund_posture_to_sibling_contribution_to_candidate
          rationale: "That instance asserts the fund accumulators, the flipped posture, the sibling contribution's suspension and the candidate's re-aggregated support totals from the single board-approve response and its immediate read-backs, which is exactly the immediate-consistency claim for this scaffold."
