  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_activation_blocked_while_network_loop_is_isolated
        grounds:
          - validations[priority=12]
          - errors[ERR_LOOP_ISOLATED]
          - state_machines.ConnectionAgreement.PENDING_CAPACITY_to_ACTIVE
          - state_machines.NetworkLoop.NORMAL_to_ISOLATED
          - entities.NetworkLoop.fields.posture
        distinguishing_aspect: |
          Entity pair ConnectionAgreement to NetworkLoop: the PENDING_CAPACITY to ACTIVE transition
          is legal only while the referenced NetworkLoop.posture is not ISOLATED, so the identical
          activate call returns ERR_LOOP_ISOLATED while an excavation holds the loop isolated and
          succeeds — raising committed_reserved_kw from 0.0 to 5000.0 — once completion returns the
          loop to NORMAL.
