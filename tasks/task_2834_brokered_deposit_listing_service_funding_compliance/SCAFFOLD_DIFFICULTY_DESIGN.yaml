            - "compensating leg: Institution.${inst_id}.brokered_deposits_cents == 0 and total_deposits_cents == 40000000000 — exactly the pre-ACTIVATE values"
            - "compensating leg: DepositProgram.${prog_id}.outstanding_principal_cents == 0"
            - "compensating leg: ConcentrationLimit.${lim_id}.current_value_bps == 0 and breach_state == WITHIN, so Institution.${inst_id}.concentration_posture == OPEN again"
            - "compensating leg: the second summary has wholesale_funding_ratio_bps == 0 and single_broker_max_ratio_bps == 0"
            - "the placement's compliance_status is UNREVIEWED throughout — the funding dimension moved twice and the compliance dimension never moved"

      - name: classify_then_reclassify_conserves_exception_reliance_count
        grounds:
          - entities.PrimaryPurposeException.fields.reliant_program_count
          - state_machines.DepositProgram
          - calculations.deposit_classification_determination
        distinguishing_aspect: |
          Conserved quantity 2 - PrimaryPurposeException.reliant_program_count, a
          reference count rather than a money balance. The forward leg is the
          exception-relying classification (+1) and the compensating leg is the
          reclassification that drops the reliance (-1); the count must return to its
          exact prior value even though the two legs run through different transitions of
          the DepositProgram machine and leave two immutable classification rows behind.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A LISTING_SERVICE Broker WITH placement discretion under an APPROVED agreement, so the determination flips between LISTING_SERVICE_NON_BROKERED and BROKERED purely on exception reliance."
            - "One ACKNOWLEDGED TWENTY_FIVE_PERCENT_TEST exception on the same broker and institution (4,000,000,000 / 40,000,000,000 == 1000 bps, QUALIFIED)."
            - "One PENDING_CLASSIFICATION program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /institutions"
              payload: { legal_name: "Refcount Bank NA", cert_id: "CERT-2834-22", capital_category: "WELL_CAPITALIZED", core_deposits_cents: 40000000000, total_liabilities_cents: 50000000000, tier1_capital_cents: 5000000000, liquidity_buffer_cents: 1000000000 }
              as: SystemAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Refcount Listing Services LLC", broker_type: "LISTING_SERVICE", has_placement_discretion: true, fee_structure: "PER_ACCOUNT_FEE", fee_flat_cents: 1000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-22", fee_structure: "PER_ACCOUNT_FEE", fee_flat_cents: 1000, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /primary-purpose-exceptions"
              payload: { broker_id: "${brk_id}", institution_id: "${inst_id}", exception_basis: "TWENTY_FIVE_PERCENT_TEST", designated_business_line: "wealth sweep", total_customer_assets_cents: 40000000000, deposits_placed_at_ifs_cents: 4000000000 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { exc_id: $.data.id }
            - call: "POST /primary-purpose-exceptions/${exc_id}/filing-actions"
              payload: { action: "SUBMIT" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Refcount Sweep MMDA", funding_channel_claim: "LISTING_SERVICE", product_type: "MONEY_MARKET", tenor_days: 0, offered_rate_bps: 420, early_withdrawal_penalty_days: 0, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v}", rationale_code: "PPE_RELIANCE_25PCT", relied_exception_id: "${exc_id}" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { cls1_id: $.data.id, prog_v2: $.data.program_version_at_determination }
            - call: "POST /deposit-programs/${prog_id}/state-actions"
              payload: { action: "START_RECLASSIFICATION" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /deposit-classifications"
              payload: { program_id: "${prog_id}", expected_program_version: "${prog_v2}", rationale_code: "RELIANCE_WITHDRAWN_BROKER_PRONG" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
              captures: { cls2_id: $.data.id, prog_v3: $.data.program_version_at_determination }
          assert:
            - "before the pair: PrimaryPurposeException.${exc_id}.status == ACKNOWLEDGED and reliant_program_count == 0"
            - "forward leg: DepositClassification.${cls1_id}.determined_class == LISTING_SERVICE_NON_BROKERED, deposit_broker_prong == NOT_APPLICABLE, call_report_line == RC_E_M2_LISTING, relied_exception_id == ${exc_id}"
            - "forward leg: PrimaryPurposeException.${exc_id}.reliant_program_count == 1 and DepositProgram.${prog_id}.governing_classification_id == ${cls1_id}"
            - "forward leg: DepositProgram.${prog_id}.version == 2 and DepositClassification.${cls1_id}.program_version_at_determination == 2"
            - "START_RECLASSIFICATION leaves DepositProgram.${prog_id}.state == RECLASSIFICATION_PENDING, attested_by_user_id == null, and version still 2 — state-actions never bump the version"
            - "compensating leg: DepositClassification.${cls2_id}.determined_class == BROKERED, deposit_broker_prong == PLACEMENT_DISCRETION, call_report_line == RC_E_M1_BROKERED, relied_exception_id == null"
            - "compensating leg: PrimaryPurposeException.${exc_id}.reliant_program_count == 0 — exactly the pre-classification value, because the superseded classification's exception is decremented"
            - "compensating leg: DepositProgram.${prog_id}.governing_classification_id == ${cls2_id}, state == CLASSIFIED, version == 3, and DepositClassification.${cls2_id}.program_version_at_determination == 3"
            - "GET /deposit-classifications?program_id=${prog_id} returns total_count == 2 — both immutable determinations survive; the count is restored without deleting history"
            - "GET /deposit-classifications?relied_exception_id=${exc_id} returns total_count == 1, the superseded row only"
            - "PrimaryPurposeException.${exc_id}.status is still ACKNOWLEDGED and reporting_due_date is still \"2026-10-30\" — the reclassification does not disturb the filing"
