              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t1_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "DIR-Y", full_name: "Director Y", staff_role: "DISTRICT_DIRECTOR" }
