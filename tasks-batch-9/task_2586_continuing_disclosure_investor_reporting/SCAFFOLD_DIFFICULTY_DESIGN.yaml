            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { score3: "$.data.disclosure_risk_score", tier3: "$.data.remediation_tier", posture3: "$.data.compliance_posture", missed3: "$.data.missed_event_count" }
          assert:
            - "${n1_deadline} == \"2026-08-03\" and ${n2_deadline} == \"2026-08-05\" and ${n3_deadline} == \"2026-08-07\""
            - "${n1_perse} == false — UNSCHEDULED_DRAW_ON_RESERVE is not in PER_SE_MATERIAL_EVENT_TYPES"
            - "${tier_initial} == TIER_0 and ${score_initial} == 0.00"
            - "${sweep1_missed} == 1 and ${sweep1_failures} == 1"
            - "${missed1} == 1, ${score1} == 20.00, ${tier1} == TIER_0, ${posture1} == COMPLIANT"
            - "${sweep2_missed} == 1"
