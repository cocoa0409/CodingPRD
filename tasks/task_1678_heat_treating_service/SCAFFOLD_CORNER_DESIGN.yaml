            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1", captures: { test_recorder: $.data.recorded_by_user_id } }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id" } }
          trigger:
            - call: "POST /disposition-cases/${case_id}/decide"
              payload: { decision: "RE_TREAT" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
            - { call: "POST /disposition-cases/${case_id}/decide", payload: { decision: "RE_TREAT" }, as: QualityEngineer, as_user_id: "qe-2" }
          assert:
            - "InspectionTest.recorded_by_user_id == qe-1 (stamped from X-User-ID)"
            - "Decide by qe-1: error_id == ERR_SEGREGATION_OF_DUTIES with http 403; case stays OPEN"
            - "Decide by qe-2: succeeds, case DECIDED with decision RE_TREAT and decided_by_user_id == qe-2"

      - name: duplicate_recipe_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_DUPLICATE_RECIPE]
        distinguishing_aspect: "The (alloy_code, spec_code) pair is unique across recipes; a second 4140/AMS2759 recipe is rejected."
        test_recipe:
          setup: ["one recipe (4140, AMS2759) already created"]
          setup_api_calls:
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
          trigger:
            - call: "POST /furnace-recipes"
              payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1700, soak_tolerance_f: 15, min_soak_minutes: 90, quench_media: "WATER", required_furnace_class: "CLASS_5", max_retreats: 0, fixture_distortion_allowance_in: 0.01, hardness_min_hrc: 30, hardness_max_hrc: 40 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_RECIPE with http 409"

      - name: rush_guarantee_window_floor_and_presence
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_GUARANTEE_WINDOW]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "RUSH orders require guaranteed_turnaround_hours >= 4: 2 hours is rejected with ERR_INVALID_GUARANTEE_WINDOW (422), and omitting the field entirely on a RUSH order is ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["customer and DRAFT recipe exist (work-order intake does not require recipe approval)"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Floor Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 2 }
              as: CustomerServiceRep
              captures: { err_low: $.data.error_id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH" }
              as: CustomerServiceRep
              captures: { err_missing: $.data.error_id }
          assert:
            - "2-hour guarantee: error_id == ERR_INVALID_GUARANTEE_WINDOW with http 422"
            - "missing guarantee on RUSH: error_id == ERR_INVALID_REQUEST with http 400"

      - name: recipe_class_and_quench_mismatch_at_load_create
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_RECIPE_CLASS_MISMATCH]
          - errors[ERR_QUENCH_MEDIA_INCOMPATIBLE]
        distinguishing_aspect: "Furnace-recipe compatibility is checked at load creation: a CLASS_5 furnace (rank 5) cannot run a CLASS_3 recipe (rank 3), and a furnace without OIL support cannot run an OIL recipe."
        test_recipe:
          setup: ["APPROVED CLASS_3 OIL recipe; CLASS_5 furnace F-A supporting OIL; CLASS_3 furnace F-B supporting only WATER"]
          setup_api_calls:
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-C5", furnace_class: "CLASS_5", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_a: $.data.id } }
            - { call: "POST /furnaces", payload: { furnace_code: "F-W", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["WATER"] }, as: ShopScheduler, captures: { furn_b: $.data.id } }
          trigger:
            - call: "POST /load-batches"
              payload: { furnace_id: "${furn_a}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }
              as: ShopScheduler
              captures: { err_class: $.data.error_id }
            - call: "POST /load-batches"
              payload: { furnace_id: "${furn_b}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }
              as: ShopScheduler
              captures: { err_quench: $.data.error_id }
          assert:
            - "CLASS_5 furnace vs CLASS_3 recipe: error_id == ERR_RECIPE_CLASS_MISMATCH with http 422"
            - "WATER-only furnace vs OIL recipe: error_id == ERR_QUENCH_MEDIA_INCOMPATIBLE with http 422"

      - name: recipe_mismatch_on_assignment
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_RECIPE_MISMATCH]
        distinguishing_aspect: "An order can only join a load built for the same recipe: assigning a recipe-B order to a recipe-A load fails with ERR_RECIPE_MISMATCH."
        test_recipe:
          setup: ["APPROVED recipes A (4140) and B (8620); order on recipe B; BUILDING load on recipe A"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Mix Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_a: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_a}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "8620", spec_code: "AMS2759", soak_temp_f: 1600, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 30, hardness_max_hrc: 40 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_b: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_b}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_b}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_a}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
          trigger:
            - call: "POST /load-batches/${load_id}/assignments"
              payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }
              as: ShopScheduler
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RECIPE_MISMATCH with http 422; no assignment created; load version unchanged at ${load_v}"

      - name: draft_recipe_cannot_back_load
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_RECIPE_NOT_APPROVED]
        distinguishing_aspect: "Only APPROVED recipes can back a load; a DRAFT recipe fails load creation with ERR_RECIPE_NOT_APPROVED."
        test_recipe:
          setup: ["one DRAFT recipe (never approved); one furnace"]
          setup_api_calls:
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id, recipe_status: $.data.status } }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
          trigger:
            - call: "POST /load-batches"
              payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }
              as: ShopScheduler
              captures: { err: $.data.error_id }
          assert:
            - "Recipe initial status == DRAFT"
            - "error_id == ERR_RECIPE_NOT_APPROVED with http 409"

      - name: credit_hold_rejects_and_existence_beats_fiscal
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
          - errors[ERR_RECIPE_NOT_FOUND]
        distinguishing_aspect: "Fiscal checks run last: a credit-held customer with a valid recipe gets ERR_CUSTOMER_CREDIT_HOLD (402), but with a nonexistent recipe the existence error ERR_RECIPE_NOT_FOUND (priority 4) beats the fiscal error (priority 10)."
        test_recipe:
          setup: ["customer with credit_hold true; one existing recipe"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Held Co", credit_hold: true }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }
              as: CustomerServiceRep
              captures: { err_hold: $.data.error_id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", recipe_id: "00000000-0000-0000-0000-000000000000", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }
              as: CustomerServiceRep
              captures: { err_prio: $.data.error_id }
          assert:
            - "Valid recipe + credit hold: error_id == ERR_CUSTOMER_CREDIT_HOLD with http 402"
            - "Nonexistent recipe + credit hold: error_id == ERR_RECIPE_NOT_FOUND with http 404 (existence beats fiscal)"

      - name: schedule_overlap_and_purge_gap
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_FURNACE_SCHEDULE_OVERLAP]"
          - "errors[ERR_QUENCH_PURGE_GAP_VIOLATION]"
        excluded_because:
          difficulty_instance: furnace_schedule_buffered_purge_gap
          rationale: "Both errors asserted there with buffered-adjacency boundary cases."

      - name: pyrometry_window_containment
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PYROMETRY_WINDOW_VIOLATION]"
        excluded_because:
          difficulty_instance: pyrometry_validity_containment_at_release
          rationale: "Containment violation and the fully-contained positive case are asserted there."

      - name: weight_capacity_boundary
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LOAD_WEIGHT_EXCEEDED]"
        excluded_because:
          difficulty_instance: load_weight_exactly_at_capacity_allowed
          rationale: "The == capacity allowed / +1 lb rejected boundary is asserted there."

      - name: retreat_limit_boundary
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RETREAT_LIMIT_REACHED]"
        excluded_because:
          difficulty_instance: retreat_count_at_max_rejected
          rationale: "The 0 < max allowed / 1 == max rejected boundary is asserted there."

      - name: release_dual_failure_priority
        claim_type: priority_ordering
        grounds:
          - "validations[priority=5]"
          - "validations[priority=6]"
        excluded_because:
          difficulty_instance: release_state_error_beats_furnace_safety_error
          rationale: "State-beats-safety ordering asserted there."

      - name: intake_existence_beats_temporal
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=8]"
        excluded_because:
          difficulty_instance: existence_beats_temporal_on_work_order_create
          rationale: "Existence-beats-temporal ordering asserted there."

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_pagination_and_filter_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more, and compose with filters: 3 orders (2 STANDARD, 1 RUSH) page as 2+1 and filter to 1 by service_lane=RUSH."
        test_recipe:
          setup: ["one customer with 3 work orders (2 STANDARD, 1 RUSH)"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Page Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "STANDARD" }, as: CustomerServiceRep }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 48 }, as: CustomerServiceRep }
          trigger:
            - { call: "GET /work-orders?customer_id=${cust_id}&limit=2", payload: {}, as: CustomerServiceRep }
            - { call: "GET /work-orders?customer_id=${cust_id}&limit=2&offset=2", payload: {}, as: CustomerServiceRep }
            - { call: "GET /work-orders?customer_id=${cust_id}&service_lane=RUSH", payload: {}, as: CustomerServiceRep }
          assert:
            - "Page 1 (limit 2): data has 2 items, total_count == 3, has_more == true"
            - "Page 2 (limit 2, offset 2): data has 1 item, total_count == 3, has_more == false"
            - "Filter service_lane=RUSH: total_count == 1 and the item is the RUSH order"
            - "Response envelope carries meta.api_request_id and response_type == array on list endpoints"

      - name: not_found_returns_404_per_resource
        claim_type: not_found
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_RECIPE_NOT_FOUND]
          - errors[ERR_FURNACE_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_LOAD_BATCH_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_DISPOSITION_CASE_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_AUDIT_PACKAGE_NOT_FOUND]
          - errors[ERR_PYROMETRY_RECORD_NOT_FOUND]
          - errors[ERR_THERMOCOUPLE_READING_NOT_FOUND]
          - errors[ERR_INSPECTION_TEST_NOT_FOUND]
        distinguishing_aspect: "Every single-resource GET maps an unknown id to its resource-specific 404 error id, in the standard error envelope (error_id + message, response_type error)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /customer-accounts/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e1: $.data.error_id } }
            - { call: "GET /furnace-recipes/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e2: $.data.error_id } }
            - { call: "GET /furnaces/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e3: $.data.error_id } }
            - { call: "GET /work-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e4: $.data.error_id } }
            - { call: "GET /load-batches/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e5: $.data.error_id } }
            - { call: "GET /load-assignments/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e6: $.data.error_id } }
            - { call: "GET /disposition-cases/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e7: $.data.error_id } }
            - { call: "GET /liability-claims/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e8: $.data.error_id } }
            - { call: "GET /audit-packages/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e9: $.data.error_id } }
            - { call: "GET /pyrometry-records/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e10: $.data.error_id } }
            - { call: "GET /thermocouple-readings/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e11: $.data.error_id } }
            - { call: "GET /inspection-tests/00000000-0000-0000-0000-000000000000", payload: {}, as: CustomerServiceRep, captures: { e12: $.data.error_id } }
          assert:
            - "${e1} == ERR_CUSTOMER_NOT_FOUND, ${e2} == ERR_RECIPE_NOT_FOUND, ${e3} == ERR_FURNACE_NOT_FOUND (all http 404)"
            - "${e4} == ERR_WORK_ORDER_NOT_FOUND, ${e5} == ERR_LOAD_BATCH_NOT_FOUND, ${e6} == ERR_ASSIGNMENT_NOT_FOUND"
            - "${e7} == ERR_DISPOSITION_CASE_NOT_FOUND, ${e8} == ERR_CLAIM_NOT_FOUND, ${e9} == ERR_AUDIT_PACKAGE_NOT_FOUND"
            - "${e10} == ERR_PYROMETRY_RECORD_NOT_FOUND, ${e11} == ERR_THERMOCOUPLE_READING_NOT_FOUND, ${e12} == ERR_INSPECTION_TEST_NOT_FOUND"
            - "Each error body has response_type == error and data.error_id + data.message"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: role_denied_for_exclusive_operations
        claim_type: role_exclusive_denied
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Exclusive operations reject other roles with ERR_INSUFFICIENT_PERMISSIONS regardless of payload validity: Customer cannot create work orders, NadcapAuditor cannot create furnaces, FurnaceOperator cannot record pyrometry, CalibrationTech cannot record inspections, QualityEngineer cannot create customers."
        test_recipe:
          setup: ["empty database (role check fires at priority 2 before existence)"]
          setup_api_calls: []
          trigger:
            - call: "POST /work-orders"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", recipe_id: "00000000-0000-0000-0000-000000000000", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }
              as: Customer
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { r1: $.data.error_id }
            - call: "POST /furnaces"
              payload: { furnace_code: "F-X", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }
              as: NadcapAuditor
              captures: { r2: $.data.error_id }
            - call: "POST /pyrometry-records"
              payload: { furnace_id: "00000000-0000-0000-0000-000000000000", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }
              as: FurnaceOperator
              captures: { r3: $.data.error_id }
            - call: "POST /inspection-tests"
              payload: { work_order_id: "00000000-0000-0000-0000-000000000000", hardness_readings: [40], measured_distortion_in: 0.004 }
              as: CalibrationTech
              captures: { r4: $.data.error_id }
            - call: "POST /customer-accounts"
              payload: { name: "Nope Co" }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { r5: $.data.error_id }
          assert:
            - "${r1} == ${r2} == ${r3} == ${r4} == ${r5} == ERR_INSUFFICIENT_PERMISSIONS, all http 403"

      - name: customer_ownership_scope_enforced
        claim_type: ownership_scope
        grounds:
          - validations[priority=3]
          - errors[ERR_OWNERSHIP_MISMATCH]
          - roles[Customer]
        distinguishing_aspect: "Customer is entity_backed by CustomerAccount: the owning customer reads its own order (200), another customer gets ERR_OWNERSHIP_MISMATCH on the same read, and a non-owner cannot accept the owner's liability claim."
        test_recipe:
          setup: ["customers A and B; A's order scrapped with a PENDING claim"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Owner Co", liability_tier: "STANDARD" }, as: CustomerServiceRep, captures: { cust_a: $.data.id } }
            - { call: "POST /customer-accounts", payload: { name: "Other Co", liability_tier: "STANDARD" }, as: CustomerServiceRep, captures: { cust_b: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_a}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 1000000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /inspection-tests", payload: { work_order_id: "${wo_id}", hardness_readings: [50, 50], measured_distortion_in: 0.004 }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "GET /disposition-cases?work_order_id=${wo_id}", payload: {}, as: QualityEngineer, as_user_id: "qe-2", captures: { case_id : "$.data[0].id" } }
            - { call: "POST /disposition-cases/${case_id}/decide", payload: { decision: "SCRAP" }, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "GET /liability-claims?work_order_id=${wo_id}", payload: {}, as: CustomerServiceRep, captures: { claim_id : "$.data[0].id" } }
          trigger:
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: Customer, as_user_id: "${cust_a}", captures: { own_ok: $.data.id } }
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err_read: $.data.error_id }
            - call: "POST /liability-claims/${claim_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_b}"
              captures: { err_accept: $.data.error_id }
          assert:
            - "Owner read succeeds: returned id == ${wo_id}"
            - "Non-owner read: error_id == ERR_OWNERSHIP_MISMATCH with http 403"
            - "Non-owner claim accept: error_id == ERR_OWNERSHIP_MISMATCH with http 403; claim stays PENDING"

      - name: audit_package_compile_issue_role_separation
        claim_type: role_exclusive_denied
        grounds:
          - roles[QualityEngineer]
          - roles[NadcapAuditor]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Compile/issue segregation is by role: the QualityEngineer compiles the DRAFT package but cannot issue it (403); only the NadcapAuditor issues it."
        test_recipe:
          setup: ["QUALIFIED furnace; one COMPLETED load; DRAFT audit package compiled by QE"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Sep Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "TUS", performed_at: "2026-08-01T00:00:00Z", result: "PASS" }, as: CalibrationTech }
            - { call: "POST /pyrometry-records", payload: { furnace_id: "${furn_id}", record_type: "INSTRUMENT_CALIBRATION", performed_at: "2026-08-01T00:00:00Z", result: "PASS", instrument_id: "TC-CAL-9" }, as: CalibrationTech }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_id}", expected_load_batch_version: "${load_v}" }, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/release", payload: {}, as: ShopScheduler }
            - { call: "POST /load-batches/${load_id}/start-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /load-batches/${load_id}/complete-run", payload: {}, as: FurnaceOperator }
            - { call: "POST /audit-packages", payload: { furnace_id: "${furn_id}", load_batch_ids: ["${load_id}"] }, as: QualityEngineer, as_user_id: "qe-1", captures: { pkg_id: $.data.id, pkg_status: $.data.status } }
          trigger:
            - call: "POST /audit-packages/${pkg_id}/issue"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { err: $.data.error_id }
            - { call: "POST /audit-packages/${pkg_id}/issue", payload: {}, as: NadcapAuditor, captures: { pkg_issued: $.data.status } }
          assert:
            - "Package compiled as DRAFT by QualityEngineer"
            - "Issue attempt by QualityEngineer: error_id == ERR_INSUFFICIENT_PERMISSIONS with http 403; package stays DRAFT"
            - "Issue by NadcapAuditor: succeeds, status == ISSUED"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_conflict_and_fresh_retry
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[load-assign-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Each assignment write carries expected_load_batch_version: after a first successful assign advances LoadBatch.version from 1 to 2, a second assign still carrying version 1 fails with ERR_STALE_VERSION (412), and the same assign with the freshly read version 2 succeeds."
        test_recipe:
          setup: ["customer, APPROVED recipe, furnace; two RECEIVED orders; BUILDING load at version 1"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "OCC Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /furnaces", payload: { furnace_code: "F-1", furnace_class: "CLASS_3", max_load_weight_lb: 1000, quench_media_supported: ["OIL"] }, as: ShopScheduler, captures: { furn_id: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_1: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000 }, as: CustomerServiceRep, captures: { wo_2: $.data.id } }
            - { call: "POST /load-batches", payload: { furnace_id: "${furn_id}", recipe_id: "${recipe_id}", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z" }, as: ShopScheduler, captures: { load_id: $.data.id, load_v1: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_1}", expected_load_batch_version: "${load_v1}" }, as: ShopScheduler }
          trigger:
            - call: "POST /load-batches/${load_id}/assignments"
              payload: { work_order_id: "${wo_2}", expected_load_batch_version: "${load_v1}" }
              as: ShopScheduler
              captures: { err: $.data.error_id }
            - { call: "GET /load-batches/${load_id}", payload: {}, as: ShopScheduler, captures: { load_v2: $.data.version } }
            - { call: "POST /load-batches/${load_id}/assignments", payload: { work_order_id: "${wo_2}", expected_load_batch_version: "${load_v2}" }, as: ShopScheduler }
          assert:
            - "Stale assign (expected_load_batch_version == 1 after the first assign bumped it to 2): error_id == ERR_STALE_VERSION with http 412; no assignment created"
            - "Fresh assign with version == 2: succeeds; LoadBatch.version == 3, total_weight_lb == 200"
            - "WorkOrder.${wo_2}.processing_status == SCHEDULED only after the fresh retry"

      - name: cascading_scrap_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.DispositionCase.OPEN_to_DECIDED]
        excluded_because:
          difficulty_instance: scrap_disposition_four_hop_cascade
          rationale: "The 4-hop cascade is asserted hop by hop there."

      - name: posture_hold_cascade
        claim_type: cascading_side_effects
        grounds: [calculations.furnace_qualification_posture]
        excluded_because:
          difficulty_instance: pyrometry_fail_hold_and_requalify_cascade
          rationale: "FAIL -> UNQUALIFIED -> HOLD and the re-qualification reverse cascade are asserted there."

      - name: liability_exposure_invariant
        claim_type: derived_field_reconciliation
        grounds: [entities.CustomerAccount.fields.outstanding_liability_exposure_cents]
        excluded_because:
          difficulty_instance: claim_pay_restores_customer_exposure
          rationale: "Exposure create/accept/pay reconciliation to zero is asserted there."

      - name: load_weight_invariant
        claim_type: derived_field_reconciliation
        grounds: [calculations.load_weight_utilization]
        excluded_because:
          difficulty_instance: assign_unassign_restores_load_weight
          rationale: "Assign/unassign weight reconciliation is asserted there."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a follow-up GET in the same test flow reflects the mutation with all computed fields already settled — the created customer reads back with exposure 0, and the created RUSH order reads back with promised_due_at and the 35000-cent quote already populated."
        test_recipe:
          setup: ["customer and APPROVED recipe exist"]
          setup_api_calls:
            - { call: "POST /customer-accounts", payload: { name: "Now Co" }, as: CustomerServiceRep, captures: { cust_id: $.data.id } }
            - { call: "POST /furnace-recipes", payload: { alloy_code: "4140", spec_code: "AMS2759", soak_temp_f: 1650, soak_tolerance_f: 10, min_soak_minutes: 60, quench_media: "OIL", required_furnace_class: "CLASS_3", max_retreats: 1, fixture_distortion_allowance_in: 0.005, hardness_min_hrc: 38, hardness_max_hrc: 44 }, as: QualityEngineer, as_user_id: "qe-1", captures: { recipe_id: $.data.id } }
            - { call: "POST /furnace-recipes/${recipe_id}/approve", payload: {}, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /work-orders", payload: { customer_id: "${cust_id}", recipe_id: "${recipe_id}", part_quantity: 5, received_weight_lb: 100, declared_value_cents: 500000, processing_charge_cents: 100000, service_lane: "RUSH", guaranteed_turnaround_hours: 48 }, as: CustomerServiceRep, captures: { wo_id: $.data.id } }
          trigger:
            - { call: "GET /customer-accounts/${cust_id}", payload: {}, as: CustomerServiceRep }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: CustomerServiceRep }
          assert:
            - "GET customer: name == Now Co, liability_tier == STANDARD, outstanding_liability_exposure_cents == 0, version == 1"
            - "GET work order: promised_due_at == 2026-08-03T00:00:00Z and rush_surcharge_quoted_cents == 35000 already computed in the read"
