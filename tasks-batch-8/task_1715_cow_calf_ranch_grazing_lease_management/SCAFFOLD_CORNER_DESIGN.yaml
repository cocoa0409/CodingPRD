      - name: reduction_response_reflects_head_decrement
        claim_type: action_endpoint
        grounds: ["endpoints[POST /api/herd-groups/{id}/reductions]", entities.HerdGroup.fields.head_count]
        distinguishing_aspect: "The action endpoint returns the mutated aggregate immediately: 60-head group reduced by 10 returns head_count 50 in the same response."
        test_recipe:
          setup: ["Ranch R; group G 60 MATURE_COW"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /api/herd-groups/${g}/reductions", payload: { head_count: 10, reason: "SALE" }, as: HerdManager, captures: { after: $.data.head_count } }
          assert:
            - "${after} == 50 (immediate consistency — no read-back needed)"
            - "HerdGroup.${g}.group_status == ACTIVE (no destock order involved)"

  # ---------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_aum_budget_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_AUM_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / aum_budget_exact_equality_boundary"
          rationale: "The 40.01-demand trigger in that instance asserts ERR_AUM_BUDGET_EXCEEDED."

      - name: error_pasture_overlap_and_rest_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_PASTURE_WINDOW_OVERLAP]", "errors[ERR_PASTURE_REST_VIOLATION]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / pasture_assignment_rest_buffer"
          rationale: "Both 409s are asserted as named triggers in that instance."

      - name: error_bull_turnout_overlap_and_turnaround_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_BULL_TURNOUT_OVERLAP]", "errors[ERR_BULL_TURNAROUND_TOO_SHORT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / bull_turnout_closed_interval_turnaround"
          rationale: "Both 409s asserted there."

      - name: error_lease_capacity_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEASE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / lease_allotment_aggregate_capacity"
          rationale: "Asserted on the third lease activation."

      - name: error_posture_and_destock_blocking_triggers
        claim_type: violation_to_error
        grounds: ["errors[ERR_DROUGHT_POSTURE_BLOCKS_COMMITMENT]", "errors[ERR_DESTOCK_ORDER_BLOCKING]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / assignment_blocked_by_drought_posture and transitive_cascade / drought_finalize_critical_cascade"
          rationale: "Posture gate asserted in the former; order-blocking asserted in the latter."

      - name: error_bull_battery_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_BULL_BATTERY_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / begin_breeding_requires_bull_battery"
          rationale: "Asserted as the failing begin-breeding attempt."

      - name: error_lease_not_active_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_LEASE_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / assignment_requires_active_covering_lease"
          rationale: "Asserted for both DRAFT and SUSPENDED lease states."

      - name: error_precon_days_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRECON_DAYS_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / precon_certify_45_day_boundary"
          rationale: "Day-44 rejection asserted there."

      - name: error_segregation_statement_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / segregation_vs_terminal_state_auth_wins"
          rationale: "Asserted twice (ISSUED self-approval and APPROVED self-re-approval)."

      - name: error_crop_not_weaned_extra_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CROP_NOT_WEANED]"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / calf_crop_parallel_wean_precon_axes"
          rationale: "Certify-on-UNWEANED asserted there; lot-create path covered by corner lot_create_unweaned_crop_rejected."

