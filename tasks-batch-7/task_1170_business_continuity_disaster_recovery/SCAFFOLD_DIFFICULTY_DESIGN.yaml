              as: BIAAnalyst
              captures: { bia_id: $.data.id }
            - call: "POST /resilience/bias/${bia_id}/submit"
              payload: {}
              as: BIAAnalyst
            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans"
              payload: { process_id: "${p_id}", title: "Swift DR", version_no: 1, strategy_type: "ACTIVE_ACTIVE", rto_committed_hours: 8, rpo_committed_hours: 2 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "RECOVERY_STRATEGY", content: "s1", order_index: 1 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "DEPENDENCY_MAP", content: "s2", order_index: 2 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/sections"
              payload: { section_type: "COMMS_PLAN", content: "s3", order_index: 3 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/submit"
              payload: {}
              as: PlanAuthor
              as_user_id: "${c2_id}"
            - call: "POST /resilience/plans/${plan_id}/approve"
              payload: {}
              as: PlanApprover
              as_user_id: "${c1_id}"
            - call: "POST /resilience/exercises"
              payload: { process_id: "${p_id}", plan_id: "${plan_id}", exercise_type: "FAILOVER", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T17:00:00Z" }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { ex1_id: $.data.id }
          trigger:
            - call: "POST /resilience/exercises"
              payload: { process_id: "${p_id}", plan_id: "${plan_id}", exercise_type: "FAILOVER", scheduled_start: "2026-09-01T17:00:00Z", scheduled_end: "2026-09-01T20:00:00Z" }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { err_touch: $.data.error_id }
            - call: "POST /resilience/exercises"
              payload: { process_id: "${p_id}", plan_id: "${plan_id}", exercise_type: "TABLETOP", scheduled_start: "2026-09-01T10:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }
              as: ExerciseOfficer
              as_user_id: "${c2_id}"
              captures: { tt_id: $.data.id }
          assert:
            - "first trigger capture err_touch == ERR_EXERCISE_WINDOW_OVERLAP (touching endpoints count under closed-interval semantics)"
            - "second trigger succeeds (tt_id present): TABLETOP windows are exempt even when fully inside a FAILOVER window"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: site_seats_reserve_release_capacity_invariant
        grounds:
          - state_machines.SiteReservation.CONFIRMED_to_RELEASED
          - calculations.site_capacity_utilization
        distinguishing_aspect: |
          Conserved quantity — seat-window capacity on an AlternateSite:
          reserve (forward) paired with release (compensating) returns
          reserved_seats and utilization_pct to their exact pre-reserve
          values, and a blocked over-capacity attempt leaves the ledger
          untouched.
        test_recipe:
          setup:
            - "Clock 2026-06-01; contacts C1 (creator), C2 (releaser); site S capacity 8; processes P1, P2"
            - "R-base: P1 3 seats 2026-08-10T09:00Z..12:00Z CONFIRMED (utilization 37.5 at probe 10:00)"
          setup_api_calls:
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ResilienceAdmin
            - call: "POST /resilience/contacts"
              payload: { full_name: "Sam Site", email: "sam@x.com", role_title: "Site Coordinator" }
              as: ResilienceAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /resilience/contacts"
              payload: { full_name: "Sue Site", email: "sue@x.com", role_title: "Site Coordinator" }
              as: ResilienceAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P1", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /resilience/processes"
              payload: { name: "P2", business_unit: "BU", owner_contact_id: "${c1_id}", criticality_tier: "TIER_2" }
              as: ResilienceAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /resilience/alternate-sites"
              payload: { name: "SiteDelta", site_type: "HOT", region: "us-east", capacity_seats: 8, contracted_through: "2027-01-01T00:00:00Z", monthly_cost: 8000 }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { s_id: $.data.id }
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p1_id}", purpose: "EXERCISE", seats_reserved: 3, starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { r_base: $.data.id }
            - call: "GET /resilience/alternate-sites/${s_id}/utilization"
              payload: { probe_at: "2026-08-10T10:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { seats_before: $.data.reserved_seats, pct_before: $.data.utilization_pct }
          trigger:
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p2_id}", purpose: "INCIDENT", seats_reserved: 4, starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { r_fwd: $.data.id }
            - call: "POST /resilience/site-reservations"
              payload: { site_id: "${s_id}", process_id: "${p2_id}", purpose: "INCIDENT", seats_reserved: 2, starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", created_by_contact_id: "${c1_id}" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { err_over: $.data.error_id }
            - call: "POST /resilience/site-reservations/${r_fwd}/release"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${c2_id}"
              captures: { rel_status: $.data.status }
            - call: "GET /resilience/alternate-sites/${s_id}/utilization"
              payload: { probe_at: "2026-08-10T10:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${c1_id}"
              captures: { seats_after: $.data.reserved_seats, pct_after: $.data.utilization_pct }
          assert:
            - "seats_before == 3 and pct_before == 37.5 (3/8, one decimal)"
            - "err_over == ERR_SITE_CAPACITY_EXCEEDED (3 + 4 + 2 = 9 > 8) and the rejected attempt created no reservation"
            - "rel_status == RELEASED; seats_after == seats_before == 3 and pct_after == pct_before == 37.5 — the forward/compensating pair conserved the seat ledger"

      - name: finding_verify_closes_gap_backlog_invariant
        grounds:
          - state_machines.Finding.OPEN_to_REMEDIATING
          - state_machines.Finding.REMEDIATING_to_VERIFIED
          - calculations.gap_backlog_pressure
        distinguishing_aspect: |
          Conserved quantity — the process's open-gap backlog: remediate
          (forward) adds exactly one OPEN remediation gap, verify
          (compensating) closes exactly that gap; the end-state backlog
          equals the pre-finding backlog, a different conserved quantity
          (remediation obligations, not seat capacity) than the site
          invariant.
