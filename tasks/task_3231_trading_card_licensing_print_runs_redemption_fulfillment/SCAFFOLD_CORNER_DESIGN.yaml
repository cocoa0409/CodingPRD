# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3231_trading_card_licensing_print_runs_redemption_fulfillment
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe, and their names are in the closed §1.8 instance name set.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: license_create_returns_every_declared_field_and_starts_draft
        claim_type: Creation
        grounds:
          - entities.License
          - "endpoints.POST_/api/licenses"
        distinguishing_aspect: "A license registered with only grantor_name, exclusivity_scope, term_starts_on and term_ends_on comes back 201 with status DRAFT, rights_version 0, set_count 0 and approved_set_count 0 — status and rights_version are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object and meta.api_request_id is present"
            - "License.${lic_id}.status == DRAFT and rights_version == 0"
            - "License.${lic_id}.approval_window_days == 10"
            - "License.${lic_id}.set_count == 0 and approved_set_count == 0"
            - "License.${lic_id}.version == 1 and created_at and updated_at are both server-stamped"
            - "the response data carries no client-supplied rights_version or status"

      - name: card_set_get_returns_stored_tier_configuration_and_compound_print_run_status
        claim_type: Retrieval
        grounds:
          - entities.CardSet
          - "endpoints.GET_/api/card-sets/{cardSetId}"
          - entities.CardSet.fields.print_run_status
        setup_note: ""
        distinguishing_aspect: "Every stored CardSet field round-trips through GET unchanged while the compound print_run_status reads UNDECIDED on a freshly approved set, since no PrintRunDecision is frozen."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S approved at tier BASE with print_run_quantity 500, serial_numbered true and announced true."
          setup_api_calls:
            - *k_clock
            - &k_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_id: $.data.id, lic_v0: $.data.version }
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - &k_line
              call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { line_id: $.data.id, line_v1: $.data.version }
            - &k_set
              call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: true, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { set_id: $.data.id, set_v0: $.data.version }
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
          trigger:
            - call: "GET /api/card-sets/${set_id}"
              payload: {}
              as: ProductManager
          assert:
            - "the response status is 200 and response_type is object"
            - "CardSet.${set_id}.set_name == \"Flagship Base\" and set_tier == BASE"
            - "CardSet.${set_id}.print_run_quantity == 500 and announced == true and serial_numbered == true"
            - "CardSet.${set_id}.status == APPROVED and rights_pinned_version == 1"
            - "CardSet.${set_id}.print_run_status == UNDECIDED — the compound field reflects the absence of a frozen decision, not the set's own status"

      - name: licenses_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints.GET_/api/licenses"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three licenses on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the remaining 1 row with has_more false, and total_count counts the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three licenses: two for the players association and one for a league."
          setup_api_calls:
            - *k_clock
            - call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_a_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "NON_EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2027-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { lic_b_id: $.data.id }
            - call: "POST /api/licenses"
              payload: { grantor_name: "National Football League", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-02-01T00:00:00Z", term_ends_on: "2030-12-31T00:00:00Z", approval_window_days: 20 }
              as: LicensingManager
              captures: { lic_c_id: $.data.id }
          trigger:
            - call: "GET /api/licenses"
              payload: { limit: 2, offset: 0 }
              as: LicensingManager
          assert:
            - "the response status is 200 and response_type is array"
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/licenses?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/licenses?grantor_name=National%20Football%20League returns exactly 1 row and total_count == 1"
            - "GET /api/licenses?status=DRAFT returns all 3 rows, since every license is still DRAFT"
            - "GET /api/licenses with no query parameters returns 3 rows, with limit defaulting to 10 and offset to 0"

      - name: quality_claim_get_with_an_unknown_id_returns_quality_claim_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_/api/quality-claims/{qualityClaimId}"
          - errors.ERR_QUALITY_CLAIM_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on a path segment produces the entity-specific 404 ERR_QUALITY_CLAIM_NOT_FOUND, not the generic ERR_REFERENCE_NOT_FOUND and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No quality claim has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /api/quality-claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QualityAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_QUALITY_CLAIM_NOT_FOUND"
            - "error_id != ERR_REFERENCE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: card_set_create_missing_required_set_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CardSet.fields.set_name
          - entities.CardSet.fields.set_tier
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "set_name is a required input with no default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check rather than a 404 or a 422."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active and line PL exists."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
          trigger:
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the set was not created: GET /api/card-sets?product_line_id=${line_id} returns 0 rows"
            - "error_id != ERR_PRODUCT_LINE_NOT_FOUND"

      - name: license_create_omitting_approval_window_applies_the_declared_default
        claim_type: Defaults
        grounds:
          - entities.License.fields.approval_window_days
          - "endpoints.POST_/api/licenses"
        distinguishing_aspect: "approval_window_days declares a default of 10, so omitting it stores 10 rather than null, and the artwork deadline built from it lands ten days after submission."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /api/licenses"
              payload: { grantor_name: "National Football League", exclusivity_scope: "NON_EXCLUSIVE", term_starts_on: "2026-02-01T00:00:00Z", term_ends_on: "2030-12-31T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: $.data.id }
          assert:
            - "License.${lic_id}.approval_window_days == 10"
            - "GET /api/licenses/${lic_id} returns approval_window_days 10, not null"
            - "a license created explicitly with approval_window_days 20 reports 20, so the default is not a hard floor"

      - name: card_set_aggregate_counters_are_computed_from_child_records
        claim_type: Computed Fields
        grounds:
          - entities.CardSet.fields.quality_claim_count
          - entities.CardSet.fields.autograph_planned_count
          - entities.License.fields.set_count
        distinguishing_aspect: "CardSet.quality_claim_count and License.set_count are recomputed from child rows rather than client-supplied: posting two claims yields 2, and posting a second set under the same license yields set_count 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active and line PL READY_FOR_APPROVAL."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
          trigger:
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "DAMAGE", severity: "MAJOR", affected_quantity: 25, filed_on: "2026-08-20T00:00:00Z" }
              as: QualityAnalyst
              captures: { qc_one_id: $.data.id }
            - call: "POST /api/card-sets/${set_id}/quality-claims"
              payload: { claim_type: "MISSING_HIT", severity: "CRITICAL", affected_quantity: 5, filed_on: "2026-08-21T00:00:00Z" }
              as: QualityAnalyst
              captures: { qc_two_id: $.data.id }
          assert:
            - "QualityClaim.${qc_one_id}.claim_weight == 2 and QualityClaim.${qc_two_id}.claim_weight == 3, derived from severity and never client-supplied"
            - "GET /api/card-sets/${set_id} reports quality_claim_count == 2 after the two claims"
            - "License.${lic_id}.set_count == 1 while only one set exists under the line"
            - "after a second set is created under the same line, License.${lic_id}.set_count == 2"
            - "the created claims came back with status FILED, not with a client-supplied status"

      - name: product_line_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ProductLine.fields.status
          - entities.ProductLine.fields.sets_per_case
          - "endpoints.POST_/api/product-lines"
        distinguishing_aspect: "A caller that posts status APPROVED and sets_per_case 999 gets back status PLANNING and the derived sets_per_case 2000 — both system fields ignore the input rather than honouring it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
          trigger:
            - call: "POST /api/product-lines"
              payload: { license_id: "${lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z", status: "APPROVED", sets_per_case: 999 }
              as: ProductManager
              captures: { line_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ProductLine.${line_id}.status == PLANNING, not APPROVED"
            - "ProductLine.${line_id}.sets_per_case == 2000, not 999"
            - "ProductLine.${line_id}.version == 1 and its id was server-minted"

      - name: card_set_create_with_an_unknown_tier_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CardSet.fields.set_tier
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "set_tier accepts only BASE, INSERT or PREMIUM — a fourth value is refused at the type boundary rather than silently stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active and line PL exists."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
          trigger:
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${line_id}", set_name: "Flagship Rare", set_tier: "ULTRA", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 100 }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_PRINT_RUN_NOT_ALLOWED, since the tier never resolved to a known member"
            - "GET /api/card-sets?product_line_id=${line_id} returns 0 rows"

      - name: card_set_create_with_an_unknown_product_line_returns_reference_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CardSet.fields.product_line_id
          - validations[priority=5]
          - errors.ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: "The parent product line must resolve before any tier rule is evaluated, so an unknown product_line_id produces ERR_REFERENCE_NOT_FOUND at Priority 5 rather than a set-level 422."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No product line has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /api/card-sets"
              payload: { product_line_id: "00000000-0000-4000-8000-000000000000", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_REFERENCE_NOT_FOUND"
            - "error_id != ERR_PRODUCT_LINE_NOT_FOUND"
            - "GET /api/card-sets returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: signing_session_create_starts_scheduled_with_a_computed_ship_date
        claim_type: Initial State
        grounds:
          - "state_machines.SigningSession.SCHEDULED_to_STOCK_PREPARED"
          - entities.SigningSession.fields.ship_date
        distinguishing_aspect: "A newly booked session starts SCHEDULED and its ship_date is derived as scheduled_on minus the ship lead rather than supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, set S approved with autograph_planned_count 200."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
          trigger:
            - call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${lic_id}", scheduled_on: "2026-10-05T00:00:00Z", allocation_lines: [{ card_set_id: "${set_id}", player_id: "kgj", quantity_delivered: 100 }] }
              as: SigningCoordinator
              captures: { sess_id: $.data.id }
          assert:
            - "the response status is 201 and SigningSession.${sess_id}.status == SCHEDULED"
            - "SigningSession.${sess_id}.ship_date == 2026-09-26T00:00:00Z, nine days before scheduled_on"
            - "SigningSession.${sess_id}.total_allocated_count == 100"
            - "SigningSession.${sess_id}.version == 1"

      - name: shipping_a_reserved_distribution_allocation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.DistributionAllocation.RESERVED_to_UTF"
          - "state_machines.DistributionAllocation.UTF_to_SHIPPED"
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From RESERVED the only legal transition is to UTF, so calling ship directly is refused even though the line and quantities would satisfy every ship-time rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-12T00:00:00Z. License L active, line PL packed out with cases_printed 50, one RESERVED HOBBY allocation of 10 cases."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - call: "POST /api/distribution-allocations"
              payload: { product_line_id: "${line_id}", channel: "HOBBY", quantity_allocated: 10, effective_price_cents: 72000 }
              as: DistributionManager
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /api/distribution-allocations/${alloc_id}/ship"
              payload: {}
              as: DistributionManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "DistributionAllocation.${alloc_id}.status == RESERVED and shipped_quantity == 0"
            - "error_id != ERR_DISTRIBUTION_WINDOW_CLOSED and != ERR_ALLOCATION_EXCEEDS_PRINT_RUN, since the state check precedes the fiscal checks"

      - name: a_cancelled_redemption_is_terminal_and_rejects_close
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Redemption.FULFILLED_to_CLOSED"
          - "state_machines.Redemption.ISSUED_to_CANCELLED"
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is listed as terminal, so a close attempt on it is refused with ERR_INVALID_STATE rather than silently succeeding or returning a fiscal error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, set S approved, one redemption on S with estimated_value_cents 400000 opened 2026-09-01 and deadline_days 730, then cancelled by advancing the clock past the deadline."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/redemptions"
              payload: { redemption_code: "RDM-1001", signer_name: "Ken Griffey Jr", estimated_value_cents: 400000, opened_on: "2026-09-01T00:00:00Z" }
              as: RedemptionFulfilmentAnalyst
              captures: { red_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/redemptions/${red_id}/cancel"
              payload: {}
              as: RedemptionFulfilmentAnalyst
          trigger:
            - call: "POST /api/redemptions/${red_id}/close"
              payload: {}
              as: RedemptionFulfilmentAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the cancel call returns 200 with Redemption.${red_id}.status == CANCELLED and estimated_value_cents == 0 before the trigger"
            - "the close call returns 409 with error_id == ERR_INVALID_STATE"
            - "error_id != ERR_REDEMPTION_DEADLINE_EXCEEDED, since the terminal-state check precedes the deadline check"
            - "Redemption.${red_id}.status is still CANCELLED"

      - name: preparing_stock_twice_on_one_signing_session_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.SigningSession.SCHEDULED_to_STOCK_PREPARED"
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The same trigger issued twice is refused the second time because STOCK_PREPARED has no self-edge, so the transition is not idempotent even though the request body is identical."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, set S approved with autograph_planned_count 200, one SCHEDULED session for 2026-10-05."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/approve"
              payload: { expected_card_set_version: "${set_v0}" }
              as: ProductManager
            - call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${lic_id}", scheduled_on: "2026-10-05T00:00:00Z", allocation_lines: [{ card_set_id: "${set_id}", player_id: "kgj", quantity_delivered: 100 }] }
              as: SigningCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /api/signing-sessions/${sess_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
          trigger:
            - call: "POST /api/signing-sessions/${sess_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "SigningSession.${sess_id}.status == STOCK_PREPARED, unchanged by the second call"
            - "CardSet.${set_id}.autograph_secured_count is still 0, so no side effect fires on the refused call"

      - name: rejecting_the_only_artwork_leaves_the_card_set_unsubmittable
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.ArtworkApproval.SUBMITTED_to_REJECTED"
          - "state_machines.CardSet.UNDER_REVIEW_to_DRAFT"
          - errors.ERR_ARTWORK_NOT_APPROVED
        distinguishing_aspect: "The rejection's declared side effect is that a set with no remaining approved artwork cannot hold UNDER_REVIEW, so the rejection both lands on the artwork row and keeps the set out of submission on the next attempt."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S DRAFT holding one SUBMITTED artwork and no approved artwork."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-25T00:00:00Z" }
              as: ProductManager
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /api/artwork-approvals/${art_id}/decide"
              payload: { decision: "REJECT", decided_on: "2026-08-26T00:00:00Z" }
              as: LicensorApprover
              as_user_id: "${lic_id}"
          assert:
            - "the response status is 200 and ArtworkApproval.${art_id}.status == REJECTED"
            - "ArtworkApproval.${art_id}.decided_on == 2026-08-26T00:00:00Z"
            - "CardSet.${set_id}.status == DRAFT — the rejection's side effect leaves the set with no approved artwork and therefore out of UNDER_REVIEW"
            - "CardSet.${set_id}.print_run_status == UNDECIDED"
            - "a following POST /api/card-sets/${set_id}/submit returns 409 with error_id == ERR_ARTWORK_NOT_APPROVED, proving the rejection propagated rather than being a no-op"
            - "License.${lic_id}.approved_set_count == 0"

      - name: card_set_submit_without_approved_artwork_returns_artwork_not_approved
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.CardSet.DRAFT_to_UNDER_REVIEW"
          - errors.ERR_ARTWORK_NOT_APPROVED
        distinguishing_aspect: "The artwork precondition is enforced before the submission is allowed even though the parent line is correctly READY_FOR_APPROVAL, so the two preconditions are independently observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, set S with one SUBMITTED artwork and none approved."
          setup_api_calls:
            - *k_clock
            - *k_lic
            - call: "POST /api/licenses/${lic_id}/activate"
              payload: {}
              as: LicensingManager
            - *k_line
            - *k_set
            - call: "POST /api/product-lines/${line_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${set_id}/artwork-approvals"
              payload: { artwork_code: "ART-BASE-001", approver_id: "${lic_id}", submitted_on: "2026-08-25T00:00:00Z" }
              as: ProductManager
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /api/card-sets/${set_id}/submit"
              payload: {}
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ARTWORK_NOT_APPROVED"
            - "error_id != ERR_PRODUCT_LINE_NOT_READY and != ERR_ARTWORK_APPROVAL_PENDING"
            - "CardSet.${set_id}.status == DRAFT"
            - "after the artwork is approved the same submit succeeds, so the block was the precondition and not the state"

  # ===========================================================================
  - section: calculations
    instances:

      - name: license_set_counts_track_sets_across_two_lines
        claim_type: Aggregate Validation
        grounds:
          - calculations.license_set_counts
          - entities.License.fields.set_count
          - entities.License.fields.approved_set_count
        distinguishing_aspect: "Aggregate over 3 sets spread across 2 lines of ONE license gives set_count 3 and approved_set_count 2, so the aggregate follows the license chain rather than a single direct FK."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active with two lines L1 and L2 ready for approval, and one approved set under each."
          setup_api_calls:
            - *k_clock
            - &m_lic
              call: "POST /api/licenses"
              payload: { grantor_name: "Major League Baseball Players Association", exclusivity_scope: "EXCLUSIVE", term_starts_on: "2026-01-01T00:00:00Z", term_ends_on: "2029-12-31T00:00:00Z", approval_window_days: 10 }
              as: LicensingManager
              captures: { m_lic_id: $.data.id }
            - call: "POST /api/licenses/${m_lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /api/product-lines"
              payload: { license_id: "${m_lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { m_l1_id: $.data.id }
            - call: "POST /api/product-lines"
              payload: { license_id: "${m_lic_id}", line_name: "2026 Chrome Baseball", line_kind: "INSERT", packs_per_box: 5, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { m_l2_id: $.data.id }
            - call: "POST /api/product-lines/${m_l1_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/product-lines/${m_l2_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${m_l1_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 500 }
              as: ProductManager
              captures: { m_s1_id: $.data.id, m_s1_v0: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${m_l2_id}", set_name: "Chrome Base", set_tier: "INSERT", announced: false, serial_numbered: false, autograph_planned_count: 0, print_run_quantity: 0 }
              as: ProductManager
              captures: { m_s2_id: $.data.id, m_s2_v0: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${m_l2_id}", set_name: "Chrome Refractor", set_tier: "INSERT", announced: false, serial_numbered: true, autograph_planned_count: 0, print_run_quantity: 0 }
              as: ProductManager
              captures: { m_s3_id: $.data.id, m_s3_v0: $.data.version }
            - call: "POST /api/card-sets/${m_s1_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${m_s1_id}/approve"
              payload: { expected_card_set_version: "${m_s1_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${m_s2_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${m_s2_id}/approve"
              payload: { expected_card_set_version: "${m_s2_v0}" }
              as: ProductManager
          trigger:
            - call: "GET /api/licenses/${m_lic_id}"
              payload: {}
              as: LicensingManager
          assert:
            - "License.${m_lic_id}.set_count == 3 across both product lines"
            - "License.${m_lic_id}.approved_set_count == 2, excluding the third set that is still DRAFT"
            - "CardSet.${m_s3_id}.status == DRAFT"
            - "GET /api/licenses/${m_lic_id}/product-lines returns 2 rows"

      - name: signer_royalty_charge_sums_over_every_allocation_line
        claim_type: Constant Application
        grounds:
          - calculations.autograph_royalty_charge
          - entities.SigningSession.fields.total_allocated_count
        distinguishing_aspect: "The royalty is charged per allocation line at a fixed 750 cents each and accumulated across three lines, so a formula that charges once per session reports 750 instead of the correct 45000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active, line PL READY_FOR_APPROVAL, three approved BASE sets S1, S2 and S3 with autograph_planned_count 200 each. One SCHEDULED session allocating 20, 30 and 10 cards to them."
          setup_api_calls:
            - *k_clock
            - *m_lic
            - call: "POST /api/licenses/${m_lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /api/product-lines"
              payload: { license_id: "${m_lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { r_l1_id: $.data.id }
            - call: "POST /api/product-lines/${r_l1_id}/ready-for-approval"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${r_l1_id}", set_name: "Flagship Base", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 200, print_run_quantity: 500 }
              as: ProductManager
              captures: { r_s1_id: $.data.id, r_s1_v0: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${r_l1_id}", set_name: "Flagship Auto", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 200, print_run_quantity: 1000 }
              as: ProductManager
              captures: { r_s2_id: $.data.id, r_s2_v0: $.data.version }
            - call: "POST /api/card-sets"
              payload: { product_line_id: "${r_l1_id}", set_name: "Flagship Patch", set_tier: "BASE", announced: true, serial_numbered: false, autograph_planned_count: 200, print_run_quantity: 1500 }
              as: ProductManager
              captures: { r_s3_id: $.data.id, r_s3_v0: $.data.version }
            - call: "POST /api/card-sets/${r_s1_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${r_s1_id}/approve"
              payload: { expected_card_set_version: "${r_s1_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${r_s2_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${r_s2_id}/approve"
              payload: { expected_card_set_version: "${r_s2_v0}" }
              as: ProductManager
            - call: "POST /api/card-sets/${r_s3_id}/submit"
              payload: {}
              as: ProductManager
            - call: "POST /api/card-sets/${r_s3_id}/approve"
              payload: { expected_card_set_version: "${r_s3_v0}" }
              as: ProductManager
            - call: "POST /api/signing-sessions"
              payload: { signer_name: "Ken Griffey Jr", signer_kind: "PLAYER_ASSOCIATION", license_id: "${m_lic_id}", scheduled_on: "2026-10-05T00:00:00Z", allocation_lines: [{ card_set_id: "${r_s1_id}", player_id: "kgj", quantity_delivered: 20 }, { card_set_id: "${r_s2_id}", player_id: "kgj", quantity_delivered: 30 }, { card_set_id: "${r_s3_id}", player_id: "kgj", quantity_delivered: 10 }] }
              as: SigningCoordinator
              captures: { r_sess_id: $.data.id }
            - call: "POST /api/signing-sessions/${r_sess_id}/prepare-stock"
              payload: {}
              as: SigningCoordinator
          trigger:
            - call: "POST /api/signing-sessions/${r_sess_id}/ship-stock"
              payload: {}
              as: SigningCoordinator
              captures: { sess_ship_v: $.data.version }
          assert:
            - "the response status is 200 and SigningSession.${r_sess_id}.status == STOCK_SHIPPED"
            - "SigningSession.${r_sess_id}.total_allocated_count == 60"
            - "the charged royalty is 45000 cents = 750 x 60, summed over all three lines"
            - "the charge is not 750, which a once-per-session formula would report"
            - "CardSet.${r_s1_id}.autograph_secured_count == 20 and CardSet.${r_s2_id}.autograph_secured_count == 30 and CardSet.${r_s3_id}.autograph_secured_count == 10"

      - name: available_cards_never_drop_below_zero_on_a_set
        claim_type: Correct Result
        grounds:
          - calculations.tier_snap_aggregate
          - entities.CardSet.fields.quality_claim_count
          - entities.ProductLine.fields.allocated_cards
        distinguishing_aspect: "Degenerate boundaries hold exactly: a line with no card sets reports allocated_cards 0 rather than failing, and a set with no claims reports quality_claim_count 0 rather than null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. License L active and one product line PL created with NO card sets."
          setup_api_calls:
            - *k_clock
            - *m_lic
            - call: "POST /api/licenses/${m_lic_id}/activate"
              payload: {}
              as: LicensingManager
            - call: "POST /api/product-lines"
              payload: { license_id: "${m_lic_id}", line_name: "2026 Flagship Baseball", line_kind: "BASE", packs_per_box: 10, cards_per_pack: 10, boxes_per_case: 20, cases_printed: 50, run_planned_on: "2026-10-01T00:00:00Z" }
              as: ProductManager
              captures: { e_line_id: $.data.id }
          trigger:
            - call: "GET /api/product-lines/${e_line_id}"
              payload: {}
              as: ProductManager
              captures: { line_cards: $.data.allocated_cards }
          assert:
            - "ProductLine.${e_line_id}.allocated_cards == 0 and not null"
            - "ProductLine.${e_line_id}.sets_per_case == 2000"
            - "GET /api/product-lines/${e_line_id}/card-sets returns 0 rows with total_count == 0 and has_more == false"
            - "no error is raised for the empty set, so the aggregation has a defined zero case"

      - name: print_run_projection_marks_its_input_set
        claim_type: Input Set Filtering
        grounds:
          - calculations.print_run_projection
          - calculations.print_run_quality_floor
          - entities.QualityClaim.fields.status
        distinguishing_aspect: "Only APPROVED and SETTLED claims enter the sales-history base and only APPROVED claims enter the verifiable floor, so a FILED claim counts toward neither while its siblings do."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. License L active, line PL with 25 cases reserved across HOBBY and MASS, set S approved. Three claims on S: one APPROVED, one FILED, one DENIED."
