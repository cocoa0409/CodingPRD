              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /chipping-runs"
              payload: { program_id: "${pid}", site_id: "${sid}", scheduled_start: "2027-01-17T08:00:00Z", scheduled_end: "2027-01-17T10:00:00Z", material_class: "MIXED_LOAD" }
              as: ProgramAdmin
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /chipping-runs"
              payload: { program_id: "${pid}", site_id: "${sid}", scheduled_start: "2027-01-17T10:30:00Z", scheduled_end: "2027-01-17T12:00:00Z", material_class: "HARDWOOD" }
              as: ProgramAdmin
              captures: { e: $.data.error_id }
            - call: "POST /chipping-runs"
              payload: { program_id: "${pid}", site_id: "${sid}", scheduled_start: "2027-01-17T12:00:00Z", scheduled_end: "2027-01-17T14:00:00Z", material_class: "HARDWOOD" }
              as: ProgramAdmin
              captures: { rc: $.data.id }
          assert:
            - "0.5h gap after run A: error_id == ERR_RUN_OVERLAP (409)"
            - "Exactly 2h gap admitted: ChippingRun.${rc}.status == SCHEDULED"
            - "ChippingRun.${ra}.status remains SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: intake_record_void_stockpile_conservation
        grounds:
          - calculations.site_stockpile_balance
          - state_machines.IntakeEvent.RECORDED_to_VOIDED
          - entities.DropOffSite.fields.stockpile_cy
        distinguishing_aspect: |
          Conserved quantity: site stockpile CUBIC YARDS. Invariant:
          stockpile_cy == sum(net_volume_cy over RECORDED intakes) - sum(input_cy over
          COMPLETED runs). Recording an intake (net 4.50) then voiding it returns the
          stockpile to exactly 0.0 with no drift.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPEN, capacity 50, stockpile 0"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 50, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { sid: $.data.id, s_v: $.data.version }
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "PATCH /sites/${sid}"
              payload: { status: "OPEN", expected_site_version: "${s_v}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /intake-events"
              payload: { site_id: "${sid}", source_type: "RESIDENT_SELF_HAUL", tree_count: 10, size_class: "LARGE", contaminated_cy: 0.5 }
              as: SiteSupervisor
              captures: { ie: $.data.id }
            - call: "GET /sites/${sid}"
              as: ProgramAdmin
            - call: "POST /intake-events/${ie}/void"
              payload: { reason: "duplicate entry at gate" }
              as: SiteSupervisor
            - call: "GET /sites/${sid}"
              as: ProgramAdmin
          assert:
            - "After record: IntakeEvent.${ie}.gross_volume_cy == 5.0, net_volume_cy == 4.5, DropOffSite.${sid}.stockpile_cy == 4.5"
            - "After void: IntakeEvent.${ie}.status == VOIDED and DropOffSite.${sid}.stockpile_cy == 0.0"
            - "Invariant holds: stockpile_cy == sum(RECORDED net) - sum(COMPLETED input) == 0.0 after the compensate pair"

      - name: booking_create_cancel_capacity_conservation
        grounds:
          - calculations.route_capacity_consumption
          - state_machines.CurbsideBooking.CONFIRMED_to_CANCELLED
          - entities.ServiceZone.fields.remaining_capacity
        distinguishing_aspect: |
          Conserved quantity: route TREE-SLOT count (different quantity than stockpile
          cubic yards). Invariant: reserved_trees + remaining_capacity ==
          daily_tree_capacity at every step; a create(+2) paired with cancel(-2) leaves
          both counters exactly at their pre-action values.
        test_recipe:
          setup:
            - "Program ACTIVE; zone capacity 5, no bookings"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
              captures: { pid: $.data.id, p_v: $.data.version }
            - call: "POST /sites"
              payload: { program_id: "${pid}", name: "North Lot", address: "1 Pine Ave", capacity_cy: 100, open_date: "2027-01-02T00:00:00Z", close_date: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /zones"
              payload: { program_id: "${pid}", zone_code: "NW-1", collection_date: "2027-01-09T00:00:00Z", daily_tree_capacity: 5 }
              as: ProgramAdmin
              captures: { zid: $.data.id }
            - call: "PATCH /programs/${pid}"
              payload: { status: "PUBLISHED", expected_program_version: "${p_v}" }
              as: ProgramAdmin
              captures: { p_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "PATCH /programs/${pid}"
              payload: { status: "ACTIVE", expected_program_version: "${p_v2}" }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { program_id: "${pid}", zone_id: "${zid}", address: "10 Oak St", contact_email: "h1@x.com" }
              as: Anonymous
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { household_id: "${h1}", zone_id: "${zid}", tree_count: 2, size_class: "MEDIUM", prep_attestation: true }
              as: Resident
              as_user_id: "${h1}"
              captures: { b1: $.data.id }
            - call: "POST /bookings/${b1}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${h1}"
          assert:
            - "After create: ServiceZone.${zid}.reserved_trees == 2, remaining_capacity == 3 (sum == 5)"
            - "After cancel: CurbsideBooking.${b1}.status == CANCELLED; reserved_trees == 0, remaining_capacity == 5"
            - "Invariant holds at every observed step: reserved_trees + remaining_capacity == daily_tree_capacity == 5"
