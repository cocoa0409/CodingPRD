            - "First trigger call: HTTP 201 with $.data.weight_points == 2.00 and $.data.submitted_by_user_id == \"analyst-1\""
            - "Second trigger call: $.data.evidence_points == -12.00 (10.00 + 2.00, both negative-signed)"
            - "Second trigger call: $.data.evidence_adjustment == -18.00 (-12.00 * BAND_MULTIPLIER_P1 1.5), NOT -6.00"
            - "Second trigger call: $.data.effective_score == 68.00, NOT 80.00"
            - "Second trigger call: $.data.base_band == P1 and $.data.priority_band == P3 (the band moved but the multiplier did not)"
            - "Second trigger call: $.data.match_score == 86.00 and $.data.version == 5"

      - name: duplicate_rate_bps_rounds_half_up_from_a_repeating_ratio
        claim_type: precision
        grounds:
          - calculations.site_duplicate_rate.precision
          - global_constants.BPS_SCALE
