          assert:
            - "the assessment is created with status == DRAFT, revision_round == 0, submitted_at == null, approved_at == null, approved_by_staff_id == null, supersedes_assessment_id == null, review_notes == null"
            - "its computed components are all 0 at creation: public_exposure_component == 0, residential_component_snapshot == 0, composite_risk_score == 0 — they are written by the submit edge, not by create"
            - "the policy is created with status == UNVERIFIED, verified_at == null, verification_note == null, excluded_country_codes == []"
            - "the policy is UNVERIFIED even though effective_from <= clock_now < effective_to: an open window does not imply verification"

      - name: submit_assessment_before_the_residential_survey_returns_survey_incomplete
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RiskAssessment.DRAFT_to_SUBMITTED.preconditions
          - validations[priority=28]
          - errors.ERR_RESIDENTIAL_SURVEY_INCOMPLETE
        distinguishing_aspect: |
          The blocking precondition lives on a different entity than the one transitioning, and
          only PENDING blocks: the same submit must fail while Executive.residential_survey_status
          is PENDING and succeed once the survey is recorded DEFICIENT — the deficient outcome is
          a finding, not a missing survey. The failed attempt must leave the assessment in DRAFT
          with submitted_at still null.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive with NO residential survey recorded; one DRAFT assessment authored by the acting analyst"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
