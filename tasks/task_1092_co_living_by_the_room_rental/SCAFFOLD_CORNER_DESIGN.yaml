              captures: { t1_id: $.data.id }
            - call: "POST /co-living/tickets"
              payload: { house_id: "${house_id}", area: "LAUNDRY", severity: "NORMAL", description: "Dryer drum squeals" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { t2_id: $.data.id }
            - call: "GET /co-living/houses/${house_id}"
              payload: {}
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { hv1: $.data.version }
          trigger:
