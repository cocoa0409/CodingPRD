              as: SystemAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Survey Methods Four", agency_code: "NIH", sensitivity_level: "STANDARD", award_amount_cents: 10000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /projects/${p1_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "PI", committed_person_months: 1.00 }
              as: SystemAdmin
              captures: { pers1_id: $.data.id }
            - call: "POST /projects/${p2_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "CO_PI", committed_person_months: 1.00 }
