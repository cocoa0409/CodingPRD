            - call: "POST /gas-ops/incidents/${inc_id}/make-safe/complete"
              payload: { leak_confirmed: false, no_make_safe_required: true }
              as: FieldTechnician
              as_user_id: "${tech_id}"
          assert:
            - "First complete: error_id == ERR_ATMOSPHERIC_READING_REQUIRED, HTTP 422 (empty reading set blocks)"
            - "After exactly one reading (pct_lel 0.0): complete succeeds, lifecycle_status == MONITORING"
            - "GasIncident.${inc_id}.make_safe_completed == true"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_triaged_incident
        grounds:
          - state_machines.GasIncident
          - errors[ERR_INCIDENT_NOT_TRIAGED]
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair DispatchAssignment -> GasIncident: dispatch creation is
          gated on the incident's lifecycle (TRIAGED); attempting dispatch
          while the incident is NEW fails, and the same request succeeds after
          triage — a different entity pair than shutoff->entry or
          workorder->determination.
        test_recipe:
          setup:
            - "T1; technician on shift; incident created (NEW) but not yet triaged"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /gas-ops/territories"
              payload: { name: "T1", p1_threshold_minutes: 30, p2_threshold_minutes: 60, p3_threshold_minutes: 240, p4_threshold_minutes: 1440, recurrence_window_hours: 72, repair_budget_cap_cents: 1000000 }
              as: SystemAdmin
              captures: { terr_id: "$.data.id" }
            - call: "POST /gas-ops/technicians"
              payload: { full_name: "Tech One", badge_number: "B001", home_territory_id: "${terr_id}", hourly_rate_cents: 6000 }
              as: SystemAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /gas-ops/technicians/${tech_id}/shifts"
              payload: { shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T12:00:00Z" }
              as: Supervisor
            - call: "POST /gas-ops/emergency-calls"
              payload: { caller_name: "Quinn", caller_phone: "555-0116", address_line: "40 Fir St", city: "Springfield", territory_id: "${terr_id}", location_context: "INSIDE_STRUCTURE", occupancy_type: "SINGLE_FAMILY", odor_reported: true, symptoms_reported: false, hissing_reported: false }
              as: Dispatcher
              captures: { inc_id: "$.data.incident_id" }
          trigger:
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
            - call: "POST /gas-ops/incidents/${inc_id}/triage"
              payload: { priority: "P2" }
              as: Dispatcher
            - call: "POST /gas-ops/incidents/${inc_id}/dispatches"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
              captures: { disp_id: "$.data.id" }
          assert:
            - "First dispatch attempt: error_id == ERR_INCIDENT_NOT_TRIAGED, HTTP 409"
            - "After triage: dispatch succeeds, DispatchAssignment.${disp_id}.status == EN_ROUTE"
            - "GasIncident.${inc_id}.lifecycle_status == DISPATCHED"

      - name: shutoff_execute_requires_entry_authorization
        grounds:
          - state_machines.ShutoffOrder.AUTHORIZED_to_EXECUTED
          - errors[ERR_ENTRY_NOT_AUTHORIZED]
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair ShutoffOrder -> GasIncident.entry_status (driven by
          PremiseEntryAuthorization records): an AUTHORIZED shutoff with
          entry_required=true cannot execute while entry_status is
          AWAITING_AUTHORIZATION; recording a CUSTOMER_CONSENT authorization
          flips the parallel dimension and unlocks execution — a distinct pair
          from dispatch->incident and workorder->determination.
        test_recipe:
          setup:
