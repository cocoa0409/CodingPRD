            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "DD", grade: 9, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-DD-1", instrument_type: "HORN", replacement_value_cents: 50000 }, as: EquipmentManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-07-15T00:00:00Z" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
