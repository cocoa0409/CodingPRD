    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: []
    output: MaintenanceTicket
    side_effects: []
  - method: GET
    path: "/backline/maintenance-tickets"
    description: "List tickets (filterable)"
    roles: [OpsManager, TourManager, LogisticsCoordinator, WarehouseTech]
    code: 200
    input: ["limit?", "offset?", "gear_unit_id?", "status?"]
    output: MaintenanceTicket[]
    side_effects: []
  - method: POST
