      - name: breakage_risk_index_precision_with_thin_wall_penalty
        claim_type: precision
        grounds:
          - calculations.breakage_risk_index
          - calculations.design_lead_time_days
          - entities.BottleDesign.fields.breakage_risk_index
        distinguishing_aspect: |
          A 500.00 ml / 170.00 g / 1.50 mm / 600.00 bpm design scores 8 x 2.0 + 12 x 2.4 + 0 + 8 = 52.80
          exactly: rounding the 28.8 speed term or the thinness term before summing would give a different
          value, and the 52.80 index lands in the >45.00 lead-time band so lead_time_days is 85 for 10 cavities.
        test_recipe:
          setup:
            - "Customer CUST-C2 with quality_standing GOOD"
            - "DRAFT design BD-C2 (500.00 ml, 170.00 g, wall 1.50 mm, 600.00 bpm, 10 cavities)"
          setup_api_calls:
            - call: "POST /glass-plant/customers"
              payload: { name: "Beta Filling", account_code: "CUST-C2", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-C2", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 170.00, min_wall_thickness_mm: 1.50, cavity_count: 10, target_line_speed_bpm: 600.00, container_price_usd: 0.1500, mold_owner: "PLANT" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
          trigger:
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
          assert:
            - "HTTP 200 and BottleDesign.${d}.status == SUBMITTED"
            - "BottleDesign.${d}.breakage_risk_index == 52.80"
            - "BottleDesign.${d}.lead_time_days == 85"
            - "BottleDesign.${d}.revision_count == 0 and version == 2"
            - "Customer.${c}.quality_standing == GOOD (history_factor 0 contributed nothing to the 52.80)"

