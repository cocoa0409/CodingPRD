      - call: GET /network/attestations/${att_id}
        as: NetworkAdmin
      - call: GET /network/shops/${shop_id}
        as: NetworkAdmin
      assert:
      - Requirement.${req_id}.status == SUPERSEDED and Requirement.${req2_id}.supersedes_requirement_id == ${req_id} (link 1a)
      - ShopAttestation.${att_id}.status == LAPSED with lapse_reason 'REQUIREMENT_REVISED' (link 1b)
      - 'Shop.${shop_id}.live_compliance_score == 85.0 (link 2: the attestation lapse recomputed the score; EQUIPMENT cat 0/1 -> 0)'
