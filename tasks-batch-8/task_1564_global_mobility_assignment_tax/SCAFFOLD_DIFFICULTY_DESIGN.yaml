  - rule_id: boundary_precision_check
    instances:
      - name: per_diem_annual_cap_exact_boundary
        grounds:
          - calculations.per_diem_annual_cap
          - validations[priority=11]
          - errors[ERR_PER_DIEM_ANNUAL_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric: cumulative day count; endpoint: record post. The cap is
          INCLUSIVE — cumulative 50 == cap 50 posts successfully, while 50 + 1
          trips ERR_PER_DIEM_ANNUAL_CAP_EXCEEDED; the failing record stays DRAFT
          and ytd_per_diem_days is unchanged.
        test_recipe:
          setup:
            - "Program with per_diem_annual_day_cap == 50; activated 2027 assignment (totalization_applies false)"
            - "January record posted with 30 days (cumulative 30); February record posted with 20 days (cumulative 50 == cap)"
