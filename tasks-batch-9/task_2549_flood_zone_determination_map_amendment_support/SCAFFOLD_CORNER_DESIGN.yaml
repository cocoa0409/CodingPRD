              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: Lender
              as_user_id: "${lender_id}"
              captures: { posture_2: $.data.compliance_posture }
            - call: "POST /flood-zone/properties/${pr_a_id}/geocode-corrections"
              payload: { latitude: 25.7618, longitude: -80.1919, geocode_method: "ROOFTOP", geocode_confidence_score: 0.99 }
              as: ProviderAnalyst
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: Lender
              as_user_id: "${lender_id}"
              captures: { posture_3: $.data.compliance_posture }
          assert:
            - "posture_1 == NOTICE_PENDING at clock 2026-08-01 (clause 6: a SENT MANDATORY_PURCHASE notice with response_deadline_at 2026-09-15 >= clock)"
            - "posture_2 == FORCE_PLACE_ELIGIBLE at clock 2026-09-16 (clause 5: the same notice is still SENT but its deadline has lapsed) - the posture moved with the clock alone, with no write in between"
            - "posture_3 == REVIEW_PENDING after the geocode correction, because LoanFolio.${f_a_id}.pending_redetermination_count == 1 makes clause 3 fire before clause 5"
            - "ComplianceNotice.${n_id}.status is still SENT throughout and its .response_deadline_at is unchanged: clause 3 masks the lapsed notice, it does not resolve it"
            - "Determination.${det_a_id}.status == FLAGGED_FOR_REVIEW and LoanFolio.${f_a_id}.required_coverage_cents == 25000000 with .reported_coverage_cents == 0, so clause 4 never applies"
            - "clause 3 masking clause 5 is exactly what blocks force placement while a map/geocode review is outstanding"

      - name: corner_zone_determination_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.structure_zone_determination.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / zone_determination_strict_vs_lenient_on_indeterminate_structure
          rationale: "That instance drives both variants over identical Structure/Property/MapPanel inputs and asserts the sfha_flag delta plus the downstream required_coverage_cents delta."

      - name: corner_force_place_premium_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.force_place_premium.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / force_place_premium_forward_estimate_vs_chronological_actual
          rationale: "That instance pins which variant each endpoint selects (estimate at notice send, actual at force placement) and asserts 144000 versus 142027 on the two entities."

      - name: corner_amendment_fee_tier_boundary
        claim_type: correct_result
        grounds:
          - calculations.map_amendment_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / amendment_fee_tier_keyed_on_pre_surcharge_base
          rationale: "The tier boundary, the resubmission surcharge interaction and the pre-surcharge keying are all asserted there, including the 65000-versus-72500 divergence."

      - name: corner_escrow_settlement_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.escrow_settlement
        excluded_because:
          difficulty_instance: compensating_invariant / escrow_cash_conserved_across_force_placement_and_replacement
          rationale: "That instance asserts the earned/refund split and the exact conservation identity across the forward and compensating actions."

