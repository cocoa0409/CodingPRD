  - rule_id: transitive_cascade
    instances:

      - name: severe_finding_cascades_condition_to_posture_to_activity_to_segment
        grounds:
          - endpoints[POST /siting/nonconformances].side_effects
          - calculations.certificate_compliance_index
          - state_machines.Certificate.ACTIVE_to_STOP_WORK
          - state_machines.ConstructionActivity.IN_PROGRESS_to_SUSPENDED
          - state_machines.RouteSegment.ACTIVE_to_HALTED
        distinguishing_aspect: |
          Trigger = filing a SEVERE nonconformance. Depth-4 chain where each link is caused only by
          the previous one: (1) CertificateCondition ENV-BLACKOUT-1 := VIOLATED, which (2) drops
          compliance_index_rolling to 52.00 below STOP_WORK_FLOOR 60.00 so Certificate.posture :=
          STOP_WORK, which (3) suspends the IN_PROGRESS activity on segment 1, which (4) flips that
          segment's construction_state from ACTIVE to HALTED. Removing link 2 (a MINOR finding,
          rolling 95.20) leaves links 3 and 4 unfired.
