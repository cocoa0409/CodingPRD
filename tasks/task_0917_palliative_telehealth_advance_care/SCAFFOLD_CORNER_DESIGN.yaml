scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: patient_creation_returns_the_full_default_field_set
        claim_type: creation
        grounds:
          - entities.Patient
          - endpoints["POST /palliative/patients"]
        distinguishing_aspect: "A created Patient starts at program_status REFERRED, capacity_status HAS_CAPACITY, code_status FULL_CODE, code_status_rank 1, records_frozen false, every ledger at zero and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock set to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2001", full_name: "Ana Petrescu", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Patient.${p_id}.program_status == REFERRED"
            - "Patient.${p_id}.capacity_status == HAS_CAPACITY"
            - "Patient.${p_id}.code_status == FULL_CODE"
            - "Patient.${p_id}.code_status_rank == 1"
            - "Patient.${p_id}.records_frozen == false"
            - "Patient.${p_id}.active_daily_mme == 0"
            - "Patient.${p_id}.acp_minutes_claimed == 0"
            - "Patient.${p_id}.acp_paid_cents_ytd == 0"
            - "Patient.${p_id}.open_symptom_count == 0"
            - "Patient.${p_id}.version == 1"
            - "Patient.${p_id}.created_at == 2026-06-01T00:00:00.000Z"

      - name: care_plan_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /palliative/care-plans"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three care plans on one patient with limit 2 and offset 0 return exactly two rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with exactly three CarePlan rows in status DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2002", full_name: "Ben Sato", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan A", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan B", problem_list: ["dyspnea"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan C", problem_list: ["nausea"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          trigger:
            - call: "GET /palliative/care-plans"
              payload: { patient_id: "${p_id}", limit: 2, offset: 0 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          assert:
            - "The response data array has length 2"
            - "meta or envelope total_count == 3"
            - "has_more == true"
            - "Every returned CarePlan.patient_id == ${p_id}"

      - name: patient_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A GET against a well-formed but unknown UUID returns ERR_RESOURCE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty database with the logical clock at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /palliative/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == ERR_RESOURCE_NOT_FOUND"

      - name: medication_order_missing_required_drug_returns_validation
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints["POST /palliative/medication-orders"]
        distinguishing_aspect: "Omitting the required drug field on a medication order returns ERR_VALIDATION with HTTP 400 and creates no row."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2003", full_name: "Cai Duarte", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
          trigger:
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", dose_amount: 30, days_supply: 14 }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_VALIDATION"
            - "GET /palliative/patients/${p_id}/medication-orders returns an empty array"

      - name: patient_opioid_status_defaults_to_opioid_naive_when_omitted
        claim_type: defaults
        grounds:
          - entities.Patient.fields.opioid_status
          - endpoints["POST /palliative/patients"]
        distinguishing_aspect: "Omitting opioid_status stores OPIOID_NAIVE, which then selects the NAIVE MME variant on the patient's first medication order."
        test_recipe:
          setup:
            - "Empty database with the logical clock set to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2004", full_name: "Dana Krol", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
          trigger:
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", drug: "MORPHINE_PO", dose_amount: 40, days_supply: 14 }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { mo_id: $.data.id }
          assert:
            - "Patient.${p_id}.opioid_status == OPIOID_NAIVE"
            - "MedicationOrder.${mo_id}.mme_variant == NAIVE"
            - "MedicationOrder.${mo_id}.mme_daily == 30.0"
            - "MedicationOrder.${mo_id}.breakthrough_dose_mg is null"

      - name: dme_inventory_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.DmeInventoryItem
          - endpoints["POST /palliative/dme-inventory"]
        distinguishing_aspect: "A created DmeInventoryItem has a server-minted UUID id with no type prefix, created_at equal to the logical clock, version 1, available_units seeded to total_units and both other counters at zero."
        test_recipe:
          setup:
            - "Empty database with the logical clock set to 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /palliative/dme-inventory"
              payload: { device_type: "SUCTION_MACHINE", total_units: 4, prior_auth_required: false }
              as: ProgramAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "DmeInventoryItem.${inv_id}.id is a bare UUID with no type prefix"
            - "DmeInventoryItem.${inv_id}.created_at == 2026-06-01T00:00:00.000Z"
            - "DmeInventoryItem.${inv_id}.version == 1"
            - "DmeInventoryItem.${inv_id}.available_units == 4"
            - "DmeInventoryItem.${inv_id}.reserved_units == 0"
            - "DmeInventoryItem.${inv_id}.delivered_units == 0"

      - name: symptom_item_score_above_ten_returns_validation
        claim_type: type_constraints
        grounds:
          - entities.SymptomAssessment.fields.item_pain
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "An item score of 11 is outside the declared 0..10 range and is rejected with ERR_VALIDATION before any distress score is computed."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with one ACTIVE CarePlan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2005", full_name: "Eli Farrow", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          trigger:
            - call: "POST /palliative/symptom-assessments"
              payload: { patient_id: "${p_id}", care_plan_id: "${cp_id}", reporter_type: "SELF", item_pain: 11, item_dyspnea: 2, item_nausea: 2, item_anxiety: 2, item_fatigue: 2 }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${err} == ERR_VALIDATION"
            - "Patient.${p_id}.open_symptom_count == 0"

      - name: advance_care_document_supersedes_filter_returns_the_superseding_child
        claim_type: parent_relationships
        grounds:
          - entities.AdvanceCareDocument.fields.supersedes_document_id
          - endpoints["GET /palliative/advance-care-documents"]
        distinguishing_aspect: "The self-referential FK is reverse-reachable: filtering the document list by supersedes_document_id of doc1 returns exactly the one document that names it, proving the graph edge is queryable in both directions."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE."
            - "AdvanceCareDocument doc1 in status DRAFT and doc2 in status DRAFT with supersedes_document_id pointing at doc1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2006", full_name: "Fia Lundgren", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "DNR" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc1_id: $.data.id }
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "DNR_DNI", supersedes_document_id: "${doc1_id}" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc2_id: $.data.id }
          trigger:
            - call: "GET /palliative/advance-care-documents"
              payload: { supersedes_document_id: "${doc1_id}" }
              as: SocialWorker
              as_user_id: "u_sw_1"
          assert:
            - "The response data array has length 1"
            - "The single returned AdvanceCareDocument.id == ${doc2_id}"
            - "AdvanceCareDocument.${doc2_id}.status == DRAFT"
            - "AdvanceCareDocument.${doc2_id}.execution_ready == false"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: referral_re_referral_cycle_stops_at_the_declared_limit
        claim_type: cyclic
        grounds:
          - state_machines.Referral.DECLINED_to_RECEIVED
          - validations[priority=10]
          - errors[ERR_REREFERRAL_LIMIT]
        distinguishing_aspect: "The DECLINED to RECEIVED back-edge fires twice, driving re_referral_count to MAX_REREFERRALS, and the third RE_REFER is rejected with ERR_REREFERRAL_LIMIT while the referral stays DECLINED."
        test_recipe:
          setup:
            - "One Patient in program_status REFERRED with one Referral in status RECEIVED and triage_score 90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2007", full_name: "Gil Andersson", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "DECLINE", decline_reason_code: "OUT_OF_SERVICE_AREA" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "RE_REFER" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "DECLINE", decline_reason_code: "DUPLICATE_REFERRAL" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "RE_REFER" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "DECLINE", decline_reason_code: "PATIENT_DECLINED" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "RE_REFER" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_REREFERRAL_LIMIT"
            - "Referral.${ref_id}.status == DECLINED"
            - "Referral.${ref_id}.re_referral_count == 2"
            - "Referral.${ref_id}.decline_reason_code == PATIENT_DECLINED"
            - "Referral.${ref_id}.triage_score == 90"
            - "Patient.${p_id}.program_status == REFERRED"

      - name: care_plan_revision_cycle_increments_revision_number_twice
        claim_type: cyclic
        grounds:
          - state_machines.CarePlan.ACTIVE_to_UNDER_REVISION
          - state_machines.CarePlan.UNDER_REVISION_to_ACTIVE
          - entities.CarePlan.fields.revision_number
          - concurrency_rules[care-plan-revision-stale-plan]
        distinguishing_aspect: "Two full ACTIVE to UNDER_REVISION to ACTIVE loops leave revision_number at 2 and the problem_list equal to the last supplied revised_problem_list, with each revision carrying the plan version read immediately before it."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with one CarePlan in status ACTIVE and revision_number 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2008", full_name: "Hedy Novak", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Comfort plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_v1: $.data.version }
          trigger:
            - call: "POST /palliative/care-plans/${cp_id}/revisions"
              payload: { expected_care_plan_version: "${cp_v1}", revised_problem_list: ["pain", "dyspnea"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: { activation_note: "revision one accepted" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "GET /palliative/care-plans/${cp_id}"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_v2: $.data.version }
            - call: "POST /palliative/care-plans/${cp_id}/revisions"
              payload: { expected_care_plan_version: "${cp_v2}", revised_problem_list: ["pain", "dyspnea", "delirium"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: { activation_note: "revision two accepted" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
          assert:
            - "CarePlan.${cp_id}.status == ACTIVE"
            - "CarePlan.${cp_id}.revision_number == 2"
            - "CarePlan.${cp_id}.problem_list has length 3"

      - name: escalation_tier_promotion_is_capped_at_tier_three
        claim_type: invalid_transition
        grounds:
          - state_machines.OnCallEscalation.TIER_NOTIFIED_to_TIER_NOTIFIED
          - calculations.escalation_tier_deadline
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Promotion is refused one minute before ack_due_at, accepted at exactly ack_due_at for tiers 1 and 2, and refused outright at ESCALATION_TIER_MAX because no promote transition leaves tier 3."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with an ACTIVE CarePlan and one SymptomAssessment."
            - "One OnCallEscalation at tier 1 created at 2026-06-01T00:00:00Z with ack_due_at 2026-06-01T00:15:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
