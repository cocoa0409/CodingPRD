scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (two different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: participation_score_census_vs_activity_on_watch_group
        grounds:
          - calculations.participation_score
          - entities.WatchGroup.fields.participation_score
          - state_machines.WatchGroup.FORMATION_to_OPERATIONAL
        distinguishing_aspect: |
          WatchGroup domain: identical raw child data (2 REGISTERED blocks, 5 ACTIVE
          members, 2 quorum meetings, 1 corroborated incident)
          yields participation_score == 30 under the CENSUS variant (FORMATION
          posture) but 43 under the ACTIVITY variant (OPERATIONAL posture) — the
          variant is selected by the group's own posture axis, not by the data.
        test_recipe:
          setup:
            - "WatchGroup WG with 2 REGISTERED blocks and 5 ACTIVE members, posture FORMATION after registration but before training completion; participation_score recomputed in FORMATION = 30 (10*2 + 2*5)."
            - "After BIAS_AVOIDANCE training completes and both blocks hold ACTIVE captains, posture becomes OPERATIONAL; then 2 HELD quorum meetings and 1 CORROBORATED incident exist; participation_score = 30 + 5*2 + 3*1 = 43 (event term contributes 0: no COMPLETED events, and event completion is certification-gated so it cannot appear pre-certification)."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Maple Watch", precinct_code: "PCT1" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "100-199 Maple St", household_count: 20 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "200-299 Maple St", household_count: 15 }
              as: ProgramCoordinator
              captures: { b2: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/blocks/${b2}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b2_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "M1", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "M2", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m2: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "M3", contact_channel: "SMS" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b2}", full_name: "M4", contact_channel: "EMAIL" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b2}", full_name: "M5", contact_channel: "SMS" }
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { score_census: $.data.participation_score, posture_mid: $.data.posture }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B100", full_name: "Officer A", precinct_code: "PCT1" }
              as: ProgramCoordinator
              captures: { off_a: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off_a}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off_a}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}", "${m2}"] }
              as: LiaisonOfficer
              as_user_id: "${off_a}"
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "POST /watch/blocks/${b2}/captain-assignments"
              payload: { member_id: "${m2}", expected_block_version: "${b2_v}" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off_a}", room_slot_start: "2026-08-05T18:00:00Z", room_slot_end: "2026-08-05T19:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off_a}"
              captures: { mt1: $.data.id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T18:30:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings/${mt1}/mark-held"
              payload: { attendee_count: 3 }
              as: LiaisonOfficer
              as_user_id: "${off_a}"
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off_a}", room_slot_start: "2026-08-06T18:00:00Z", room_slot_end: "2026-08-06T19:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off_a}"
              captures: { mt2: $.data.id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T18:30:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings/${mt2}/mark-held"
              payload: { attendee_count: 3 }
              as: LiaisonOfficer
              as_user_id: "${off_a}"
            - call: "POST /watch/data-share-agreements"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off_a}", scope: "INCIDENT_SUMMARIES", expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramCoordinator
              captures: { dsa: $.data.id }
            - call: "POST /watch/data-share-agreements/${dsa}/activate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off_a}"
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "VANDALISM", occurred_at: "2026-08-04T12:00:00Z", severity: 2 }
              as: Member
              as_user_id: "${m1}"
              captures: { ir: $.data.id }
            - call: "POST /watch/incident-reports/${ir}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports/${ir}/corroborate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off_a}"
          trigger:
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { score_final: $.data.participation_score, posture_final: $.data.posture }
          assert:
            - "score_census == 30 (CENSUS variant: 10*2 blocks + 2*5 members, evaluated while posture == FORMATION)"
            - "posture_mid == FORMATION"
            - "posture_final == OPERATIONAL"
            - "score_final == 43 (ACTIVITY variant: 30 + 5*2 meetings + 8*0 events + 3*1 incident)"
            - "score_final - score_census == 13 (activity terms only; census terms identical)"

      - name: block_risk_heat_provisional_vs_corroborated_only
        grounds:
          - calculations.block_risk_heat
          - entities.Block.fields.risk_heat_score
          - state_machines.DataShareAgreement.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Block/IncidentReport domain (distinct from the WatchGroup participation
          domain of the sibling instance): the same two reports (severities 4 and 3,
          one CORROBORATED, one CLEARED) produce risk_heat_score == 5.5 under the
          PROVISIONAL variant while a share agreement is ACTIVE, and 4.0 under the
          CORROBORATED_ONLY variant after revocation zeroes the CLEARED report.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "WatchGroup with 1 REGISTERED block, 2 ACTIVE members, an ACTIVE DataShareAgreement."
            - "Report R1 severity 4 occurred 2026-07-20 (age 26d -> weight 1.0), CORROBORATED then CLEARED."
            - "Report R2 severity 3 occurred 2026-06-25 (age 51d -> weight 0.5), CORROBORATED (stays CORROBORATED)."
            - "PROVISIONAL heat = round2(4*1.0) + round2(3*0.5) = 4.0 + 1.5 = 5.5."
          setup_api_calls:
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/watch-groups"
              payload: { name: "Heat Watch", precinct_code: "PCT2" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-99 Oak Ave", household_count: 10 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "R1", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "R2", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m2: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B200", full_name: "Officer H", precinct_code: "PCT2" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/data-share-agreements"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off}", scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramCoordinator
              captures: { dsa: $.data.id }
            - call: "POST /watch/data-share-agreements/${dsa}/activate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "PROPERTY_CRIME", occurred_at: "2026-07-20T08:00:00Z", severity: 4 }
              as: Member
              as_user_id: "${m1}"
              captures: { ir1: $.data.id }
            - call: "POST /watch/incident-reports/${ir1}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports/${ir1}/corroborate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/incident-reports/${ir1}/clear"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m2}", category: "SUSPICIOUS_ACTIVITY", occurred_at: "2026-06-25T08:00:00Z", severity: 3 }
              as: Member
              as_user_id: "${m2}"
              captures: { ir2: $.data.id }
            - call: "POST /watch/incident-reports/${ir2}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports/${ir2}/corroborate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "GET /watch/blocks/${b1}"
              payload: {}
              as: ProgramCoordinator
              captures: { heat_prov: $.data.risk_heat_score }
          trigger:
            - call: "POST /watch/data-share-agreements/${dsa}/revoke"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /watch/blocks/${b1}"
              payload: {}
              as: ProgramCoordinator
              captures: { heat_corr_only: $.data.risk_heat_score }
          assert:
            - "heat_prov == 5.5 (PROVISIONAL variant: CLEARED report R1 contributes round2(4*1.0)=4.0; CORROBORATED R2 contributes round2(3*0.5)=1.5)"
            - "heat_corr_only == 1.5 (CORROBORATED_ONLY variant: CLEARED R1 with revoked share contributes 0; CORROBORATED R2 still contributes 1.5)"
            - "heat_prov - heat_corr_only == 4.0 (exactly the excluded CLEARED report's contribution)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: certification_points_tiered_branch_mode_a
        grounds:
          - calculations.certification_points
          - state_machines.CertificationReview.PENDING_to_CONDITIONAL
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction (min-caps, conditional
          event_pts branch, thresholded alert_pts branch): the pinned fixture lands
          at exactly 45 points (5 member + 10 meeting + 0 event + 15 captain + 15
          three-alert branch), inside [CONDITIONAL_FLOOR 40, APPROVAL_THRESHOLD
          60), so decide CONDITIONAL succeeds and PROVISIONAL is granted — a
          single-point shift in any of the five inputs changes the tier.
        test_recipe:
          setup:
            - "WatchGroup with 1 REGISTERED block, 5 ACTIVE bias-trained members (member_pts = min(25,5) = 5)."
            - "2 HELD quorum meetings (meeting_pts = min(25,10) = 10)."
            - "No COMPLETED events (event_pts = 0 — event completion is certification-gated and unreachable pre-review)."
            - "The single REGISTERED block has an ACTIVE captain (captain_pts = 15)."
            - "Exactly 3 SENT alerts (alert_pts = 15)."
            - "certification_points == 45 at review creation; reviewing officer differs from trainer."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Cert Watch", precinct_code: "PCT3" }
              as: ProgramCoordinator
              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-50 Pine Rd", household_count: 12 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "C1", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "C2", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m2: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "C3", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m3: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "C4", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m4: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "C5", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m5: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B300", full_name: "Officer T", precinct_code: "PCT3" }
              as: ProgramCoordinator
              captures: { off_t: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B301", full_name: "Officer R", precinct_code: "PCT3" }
              as: ProgramCoordinator
              captures: { off_r: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off_t}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off_t}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}", "${m2}", "${m3}", "${m4}", "${m5}"] }
              as: LiaisonOfficer
              as_user_id: "${off_t}"
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off_t}", room_slot_start: "2026-08-05T18:00:00Z", room_slot_end: "2026-08-05T19:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off_t}"
              captures: { mt1: $.data.id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T18:30:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings/${mt1}/mark-held"
              payload: { attendee_count: 2 }
              as: LiaisonOfficer
              as_user_id: "${off_t}"
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off_t}", room_slot_start: "2026-08-06T18:00:00Z", room_slot_end: "2026-08-06T19:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off_t}"
              captures: { mt2: $.data.id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T18:30:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings/${mt2}/mark-held"
              payload: { attendee_count: 2 }
              as: LiaisonOfficer
              as_user_id: "${off_t}"
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v_cur: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T12:00:00Z", expected_watch_group_version: "${wg_v_cur}" }
              as: ProgramCoordinator
              captures: { al: $.data.id }
            - call: "POST /watch/alerts/${al}/queue"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T12:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/alerts/${al}/send"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v_c2: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "MEETING_NOTICE", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T13:00:00Z", expected_watch_group_version: "${wg_v_c2}" }
              as: ProgramCoordinator
              captures: { al2: $.data.id }
            - call: "POST /watch/alerts/${al2}/queue"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T13:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/alerts/${al2}/send"
              payload: {}
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v_c3: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "EVENT_NOTICE", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T14:00:00Z", expected_watch_group_version: "${wg_v_c3}" }
              as: ProgramCoordinator
              captures: { al3: $.data.id }
            - call: "POST /watch/alerts/${al3}/queue"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T14:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/alerts/${al3}/send"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/certification-reviews"
              payload: { watch_group_id: "${wg}", reviewing_officer_id: "${off_r}" }
              as: ProgramCoordinator
              captures: { cr: $.data.id, cr_points: $.data.certification_points }
          trigger:
            - call: "POST /watch/certification-reviews/${cr}/decide"
              payload: { decision: "CONDITIONAL" }
              as: LiaisonOfficer
              as_user_id: "${off_r}"
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { cert_status: $.data.certification_status }
          assert:
            - "cr_points == 45 (5 member + 10 meeting + 0 event + 15 captain + 15 alert)"
            - "decide CONDITIONAL succeeds because 40 <= 45 < 60"
            - "cert_status == PROVISIONAL"

      - name: alert_fanout_per_block_ceil_order_mode_b
        grounds:
          - calculations.alert_fanout
          - entities.Alert.fields.recipient_count
          - state_machines.Alert.QUEUED_to_SENT
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two REGISTERED blocks each
          holding exactly one ACTIVE PHONE_TREE member yield raw 2.5 per block;
          the pinned per-block-ceil-then-sum order produces recipient_count == 6
          (ceil(2.5)+ceil(2.5) = 3+3), whereas the forbidden sum-then-ceil order
          would produce ceil(5.0) == 5 — a one-recipient divergence the test pins.
        test_recipe:
          setup:
            - "OPERATIONAL WatchGroup with 2 REGISTERED blocks; block A has one ACTIVE PHONE_TREE member (also captain), block B has one ACTIVE PHONE_TREE member (captain of B)."
            - "GROUP-scope SAFETY_TIP alert QUEUED, scheduled_send_at 2026-08-09T12:00:00Z, clock set to that instant."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Fanout Watch", precinct_code: "PCT4" }
              as: ProgramCoordinator
              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "10-20 Elm St", household_count: 8 }
              as: ProgramCoordinator
              captures: { bA: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "30-40 Elm St", household_count: 8 }
              as: ProgramCoordinator
              captures: { bB: $.data.id }
            - call: "POST /watch/blocks/${bA}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { bA_v: $.data.version }
            - call: "POST /watch/blocks/${bB}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { bB_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${bA}", full_name: "Tree A", contact_channel: "PHONE_TREE" }
              as: ProgramCoordinator
              captures: { mA: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${bB}", full_name: "Tree B", contact_channel: "PHONE_TREE" }
              as: ProgramCoordinator
              captures: { mB: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "B400", full_name: "Officer F", precinct_code: "PCT4" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${mA}", "${mB}"] }
