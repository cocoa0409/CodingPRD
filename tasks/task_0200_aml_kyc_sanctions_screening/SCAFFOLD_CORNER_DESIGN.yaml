  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_case_link
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[case-link-alert-stale-case]", "entities.Case.fields.version"]
        distinguishing_aspect: "Case.version increments by 1 on each successful link; a second link carrying the pre-link version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A case with two OPEN alerts (same customer); first link succeeds, version advances."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Occ Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "1985-05-05" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-OCC-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 950000, posted_at: "2026-06-26T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 5000, posted_at: "2026-06-26T09:00:00Z", counterparty_country: "IR" }
              as: SystemFeed
            - call: "GET /accounts/${acct_id}/alerts"
              payload: { status: "OPEN" }
              as: Analyst
              as_user_id: "an-1"
              captures: { alert1: "$.data[0].id", alert2: "$.data[1].id" }
            - call: "POST /cases"
              payload: { customer_id: "${cust_id}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /cases/${case_id}/alerts"
              payload: { alert_id: "${alert1}", expected_case_version: "${case_v0}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_v1: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/alerts"
              payload: { alert_id: "${alert2}", expected_case_version: "${case_v0}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { err: $.data.error_id }
          assert:
            - "Case.${case_id}.version == ${case_v0} + 1 after first link"
            - "response code == 412 and error_id == ERR_STALE_VERSION (stale ${case_v0})"

      - name: occ_apply_rating_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[customer-apply-rating-stale-customer]", "entities.Customer.fields.version"]
        distinguishing_aspect: "apply-rating with the correct expected_customer_version succeeds and increments Customer.version by 1."
        test_recipe:
          setup: ["A NEW customer with one unapplied assessment."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "OccOk Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1984-04-04" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 1, product_factor: 1, pep_factor: 1, adverse_media_factor: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { newv: $.data.version, st: $.data.cdd_status }
          assert:
            - "Customer.${cust_id}.cdd_status == RISK_RATED"
            - "Customer.${cust_id}.version == ${cust_v0} + 1"

      - name: rate_threshold_structuring_band_lower_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.transaction_monitoring", "entities.Transaction.fields.triggered_rule"]
        distinguishing_aspect: "A CASH_IN of exactly 900,000 (== STRUCT_LOW) fires STRUCTURING (inclusive lower boundary); 899,999 fires nothing."
        test_recipe:
          setup: ["Two ACTIVE accounts for two single-transaction probes."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Str Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "1983-03-03" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-STR-LOW", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_low: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-STR-UND", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_und: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_low}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 900000, posted_at: "2026-06-27T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_low: $.data.triggered_rule }
            - call: "POST /accounts/${acct_und}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 899999, posted_at: "2026-06-27T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_und: $.data.triggered_rule }
          assert:
            - "Transaction(low).triggered_rule == STRUCTURING (900,000 == STRUCT_LOW, inclusive)"
            - "Transaction(und).triggered_rule == null (899,999 below STRUCT_LOW)"

      - name: cascade_offboard_freezes_all_accounts
        claim_type: cascading_side_effects
        grounds: ["state_machines.Customer.APPROVED_to_OFFBOARDED", "state_machines.Account.kyc_status_KYC_OK_to_KYC_BLOCKED"]
        distinguishing_aspect: "Offboarding an APPROVED customer with two accounts cascades BOTH to FROZEN + KYC_BLOCKED in one request."
        test_recipe:
          setup: ["An APPROVED customer with two KYC_OK accounts."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Multi Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "1982-02-02" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-MUL-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct1: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-MUL-2", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct2: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 1, product_factor: 1, pep_factor: 1, adverse_media_factor: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /customers/${cust_id}/offboard"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /customers/${cust_id}/accounts"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { a0_kyc: "$.data[0].kyc_status", a1_kyc: "$.data[1].kyc_status" }
          assert:
            - "Account.${acct1}.kyc_status == KYC_BLOCKED and monitoring_status == FROZEN"
            - "Account.${acct2}.kyc_status == KYC_BLOCKED and monitoring_status == FROZEN"

