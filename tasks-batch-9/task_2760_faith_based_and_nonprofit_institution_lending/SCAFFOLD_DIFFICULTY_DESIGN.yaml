  - rule_id: cross_entity_state_dependency
    instances:
      - name: workout_proposal_gated_by_loan_posture_derived_from_covenant
        grounds:
          - validations[priority=25].ERR_WORKOUT_INVALID_STATE
          - calculations.loan_risk_posture
          - calculations.mission_impact_score
          - state_machines.WorkoutPlan.transitions["PROPOSED -> APPROVED"]
          - endpoints["POST /workout-plans"]
        distinguishing_aspect: |
          Whether a WorkoutPlan may be created depends on the state of a THIRD entity:
          the plan is refused with ERR_WORKOUT_INVALID_STATE while Loan.risk_posture is
