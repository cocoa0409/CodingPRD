            - call: "GET /oversight/marketing-reviews"
              payload: { agreement_id: "${agr_a_id}" }
              as: InternalAudit
              as_user_id: "ia-erin"
              captures: { l_mr_total: $.total_count, l_mr_first: "$.data[0].id" }
            - call: "GET /oversight/custody-accounts"
