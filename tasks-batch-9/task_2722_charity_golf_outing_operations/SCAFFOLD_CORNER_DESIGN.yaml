      - name: the_user_who_recorded_a_sale_cannot_issue_that_items_receipt
        claim_type: Violation → Error
        grounds:
          - validations[priority=15]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: "The bar is per subject and per user, not per role: the very same CharityTreasurer user who stamped recorded_by_user_id on a fundraising item is refused as its receipt issuer, yet that user may still receipt a DIFFERENT subject, and a second treasurer may receipt the barred item - so the check reads the stored recorded_by_user_id rather than the caller's role."
        test_recipe:
          setup:
            - "An OPEN outing with one CONFIRMED registration and two DONATION items, each asking 50000 and each already PAID."
            - "Two CharityTreasurer users act in this recipe: X-User-Id 'ct-seller' records both sales and both payments, X-User-Id 'ct-issuer' is a second treasurer who records nothing."
