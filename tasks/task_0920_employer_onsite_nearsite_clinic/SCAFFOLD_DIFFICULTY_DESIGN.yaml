      - name: eligibility_closed_span_covers_the_termination_date_itself
        grounds:
          - calculations.eligibility_coverage
          - validations[priority=12]
          - errors[ERR_NOT_ELIGIBLE_ON_DATE]
          - entities.EligibilityRecord.fields.termination_date
        distinguishing_aspect: |
          Interval semantics: a CLOSED date span on the EligibilityRecord resource - the deliberate
          opposite of the half-open appointment geometry - so a service date equal to termination_date is
          covered while the next calendar day is not.
        test_recipe:
          setup:
            - "One eligibility row effective 2026-01-01 with termination_date 2026-06-08, and a participant enrolled while the clock reads 2026-06-01."
            - "Staffing shifts exist on both 2026-06-08 and 2026-06-09 so scheduling rungs cannot mask the eligibility rung."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
