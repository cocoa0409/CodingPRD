# =============================================================================
# PRD Benchmark Scaffold — Task 3270
# Micro-Task Marketplace Qualification, Rejection & Payment
# (§1.0–§1.7; §1.8 and §1.9 live in their own sibling files)
# =============================================================================

scenario: |
  Micro-Task Marketplace Qualification, Rejection & Payment (Amazon Mechanical
  Turk): requester task publication with reward amounts, time limits and
  required worker qualifications, worker qualification tests and system-assigned
  qualifications based on approval rate and task history, assignment acceptance,
  expiration and return mechanics with per-worker concurrency limits, submitted
  work review with approval, rejection and bonus payment by the requester,
  rejection dispute handling where a worker's approval rate is damaged with
  limited recourse, requester prepayment of rewards and fees with refund of
  unclaimed assignments, worker payment methods, thresholds and identity
  verification, abusive task detection and requester suspension.

domain_name: micro-task-marketplace
api_prefix: /mkt

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal display name of the requester account" }
      - { name: prepaid_balance_cents, type: integer, source: computed, default: 0, description: "= sum of SUCCEEDED RequesterDeposit.amount_cents - requester.escrowed_cents - requester.lifetime_spent_cents; the spendable remainder" }
      - { name: escrowed_cents, type: integer, source: computed, default: 0, description: "= sum of HIT.escrowed_cents over this requester's non-terminal HITs (DRAFT/PUBLISHED/DISPATCHED); funds committed and not yet spent or refunded" }
      - { name: lifetime_spent_cents, type: integer, source: computed, default: 0, description: "= sum over all this requester's HITs of (spent_rewards_cents + spent_bonus_cents); grows on every approval and bonus credit, never decreases" }
      - { name: approved_count, type: integer, source: computed, default: 0, description: "Count of this requester's reviews with kind APPROVAL (own HITs only)" }
      - { name: rejected_count, type: integer, source: computed, default: 0, description: "Count of this requester's reviews with kind REJECTION (own HITs only)" }
      - { name: lifetime_rejection_rate_pct, type: integer, source: computed, default: 100, description: "Lifetime variant of the rejection rate: = round_half_up(100 * rejected_count / (approved_count + rejected_count)); 100 when the denominator is zero" }
      - { name: abuse_score, type: integer, source: computed, default: 0, description: "Running sum of Review-level abuse points; +2 on each rejection while the requester task_abuse_flag is TRUE, +0 otherwise; decayed by -all points on appeal overturn" }
      - { name: task_abuse_flag, type: boolean, source: system, default: false, description: "Set TRUE by POST /requesters/{requester_id}/abuse-review when rejection_rate over the pinned window crosses the review threshold; gates publication (ERR_REQUESTER_TASK_BLOCKED)" }
      - { name: suspension_reason, type: enum, source: system, description: "NONE | ABUSE_AUTO | ADMIN_MANUAL | null while status is not SUSPENDED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | PENDING_REVIEW" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Public worker handle" }
      - { name: country, type: enum, source: input, description: "US | IN | PH | BR (payment-method eligibility gate)" }
      - { name: approval_rate_pct, type: integer, source: computed, default: 100, description: "= round_half_up(100 * approved_count / (approved_count + rejected_count)); 100 when the denominator is zero" }
      - { name: approved_count, type: integer, source: computed, default: 0, description: "Count of the worker's assignments that reached APPROVED" }
      - { name: rejected_count, type: integer, source: computed, default: 0, description: "Count of the worker's assignments that reached REJECTED" }
      - { name: returned_count, type: integer, source: computed, default: 0, description: "Count of the worker's assignments that reached RETURNED" }
      - { name: expired_count, type: integer, source: computed, default: 0, description: "Count of the worker's assignments that reached EXPIRED" }
      - { name: total_earned_cents, type: integer, source: computed, default: 0, description: "= sum over the worker's APPROVED assignments of (reward_cents + bonus_cents - round_half_up((reward_cents + bonus_cents) * 0.10)); monotone non-decreasing" }
      - { name: withdrawable_cents, type: integer, source: computed, default: 0, description: "= total_earned_cents - (sum of this worker's PayoutRequest.amount_cents for statuses PAID and HELD_FOR_VETTING); REJECTED payouts release their reservation" }
      - { name: identity_verified, type: boolean, source: system, default: false, description: "Set TRUE by POST /workers/{worker_id}/identity-verifications success; withdrawal requires TRUE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: WorkerQualification
    parent: Worker
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; the worker holding this qualification" }
      - { name: qualification_type_id, type: string, source: input, description: "FK -> QualificationType.id; the qualification held" }
      - { name: score, type: integer, source: computed, default: 0, description: "Grant score; = qualification_type.default_score when awarded by the rate cascade, or the exam attempt's score when awarded by an exam pass" }
      - { name: source, type: enum, source: system, description: "CASCADE | EXAM — CASCADE rows are minted by the approval-rate threshold cascade; EXAM rows by POST /mkt/qualification-exams/{exam_id}/attempts" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED — only CASCADE rows are revoked by the approval-rate drop cascade; EXAM rows are never revoked" }

  - name: QualificationType
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable qualification name (e.g. Transcription Accuracy)" }
      - { name: kind, type: enum, source: input, description: "SYSTEM | REQUESTER — classification only; a QualificationExam may be created for a type of either kind" }
      - { name: exam_available, type: boolean, source: input, default: false, description: "When true a QualificationExam may be created for this type" }
      - { name: auto_assign_threshold_pct, type: integer, source: input, description: "Approval-rate threshold (0..100); reaching it awards this SYSTEM qualification automatically via the rate-threshold cascade" }
      - { name: default_score, type: integer, source: input, default: 0, description: "Score stamped on system-awarded and exam-passed WorkerQualification rows for this type" }

  - name: QualificationExam
    parent: QualificationType
    common_fields: true
    fields:
      - { name: qualification_type_id, type: string, source: input, description: "FK -> QualificationType.id; the qualification this exam grants on pass" }
      - { name: passing_score, type: integer, source: input, description: "Minimum integer score (0..100) that passes the exam" }
      - { name: max_attempts, type: integer, source: input, default: 3, description: "Per-worker cap on scored attempts; the next attempt is rejected with ERR_QUALIFICATION_EXAM_ATTEMPTS_EXCEEDED" }
      - { name: retake_cooldown_days, type: integer, source: input, default: 0, description: "Minimum whole days between the last scored attempt and a new attempt" }

  - name: QualificationExamAttempt
    parent: QualificationExam
    common_fields: true
    fields:
      - { name: exam_id, type: string, source: input, description: "FK -> QualificationExam.id; the exam attempted" }
      - { name: sequence, type: integer, source: system, description: "Attempt ordinal for this worker, starting at 1" }
      - { name: score, type: integer, source: input, description: "Raw score 0..100 supplied by the exam runner (no clock-relative normalization)" }
      - { name: outcome, type: enum, source: computed, description: "PASSED | FAILED (only these two values are ever written; the attempt count that gates max_attempts is the count of rows, not an outcome state)" }

  - name: HIT
    parent: Requester
    common_fields: true
    fields:
      - { name: requester_id, type: string, source: input, description: "FK -> Requester.id; the requester that publishes this task" }
      - { name: title, type: string, source: input, description: "Task title shown to workers" }
      - { name: reward_cents, type: integer, source: input, description: "Per-assignment reward in cents; must be a positive multiple of 1 (ERR_REWARD_INVALID otherwise)" }
      - { name: required_qualification_ids, type: array, source: input, description: "QualificationType ids a worker must hold live grants for; empty array means no qualification gate" }
      - { name: max_assignments, type: integer, source: input, description: "Total assignments that may ever be ACCEPTED for this HIT (finite pool)" }
      - { name: assignment_duration_minutes, type: integer, source: input, description: "Clock window from acceptance to the assignment deadline" }
      - { name: time_limit_minutes, type: integer, source: input, description: "Minutes allowed for a worker to hold an ACCEPTED assignment before the automatic EXPIRED sweep collects it" }
      - { name: bonus_budget_cents, type: integer, source: input, default: 0, description: "Cap on cumulative bonus paid on this HIT; a bonus that would exceed it is rejected (ERR_BONUS_BUDGET_EXCEEDED)" }
      - { name: funds_required_cents, type: integer, source: computed, description: "= max_assignments * reward_cents + max_assignments * ceil(reward_cents * COMMISSION_RATE) + bonus_budget_cents + max_assignments * FEE_PER_ASSIGNMENT_CENTS; recomputed on every mutation of the pinned inputs" }
      - { name: escrowed_cents, type: integer, source: computed, default: 0, description: "Held funds = funds_required_cents while status is DRAFT/PUBLISHED/DISPATCHED; released to 0 on COMPLETED/CANCELLED" }
      - { name: accepted_count, type: integer, source: computed, default: 0, description: "Assignments currently or formerly ACCEPTED (bounded by max_assignments)" }
      - { name: assignment_count, type: integer, source: computed, default: 0, description: "Current live assignments (states ACCEPTED/SUBMITTED/RETURNED)" }
      - { name: committed_assignments, type: integer, source: computed, default: 0, description: "= count of this HIT's assignments whose committed flag is TRUE; a return or expiry clears the flag (the slot is not refilled)" }
      - { name: spent_rewards_cents, type: integer, source: computed, default: 0, description: "Chronological sum of reward_cents for APPROVED assignments only (REJECTED/SUBMITTED/EXPIRED/RETURNED/ACCEPTED excluded); reversed when an admin-resolution overturn flips a REJECTED assignment to APPROVED" }
      - { name: spent_bonus_cents, type: integer, source: computed, default: 0, description: "Sum of bonus_cents over assignments carrying a non-zero bonus (a bonus is only ever added, so the sum is monotone)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | DISPATCHED | COMPLETED | CANCELLED" }

  - name: Assignment
    parent: HIT
    common_fields: true
    fields:
      - { name: hit_id, type: string, source: input, description: "FK -> HIT.id; the task this assignment belongs to" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; the worker that accepted the task" }
      - { name: sequence, type: integer, source: system, description: "Stable per-worker assignment ordinal minted at acceptance; used only as the deterministic tie-break when POST /workers/{worker_id}/assignments/concurrency-check must choose which live assignment to expire" }
      - { name: deadline_at, type: datetime, source: computed, description: "= accepted_at + HIT.assignment_duration_minutes; stamped at acceptance" }
      - { name: review_expires_at, type: datetime, source: computed, description: "= submitted_at + REVIEW_WINDOW_HOURS; stamped on submission, consulted by the review-expiry cascade" }
      - { name: submitted_at, type: datetime, source: system, description: "Stamped when the assignment reaches SUBMITTED; null before that — the bonus window and the median-review-days metric both read it" }
      - { name: approved_at, type: datetime, source: system, description: "Stamped when the assignment reaches APPROVED; null before that" }
      - { name: bonus_cents, type: integer, source: computed, default: 0, description: "Bonus credited by the requester while status is APPROVED or while SUBMITTED (the two states in which the bonus endpoint accepts); contributes to the worker earning" }
      - { name: eligible_for_approval, type: boolean, source: computed, default: false, description: "TRUE once the elapsed time-since-acceptance delta reaches at least assignment_duration_minutes/2; gates the approval transition (ERR_REVIEW_TOO_EARLY otherwise)" }
      - { name: approval_rate_effect_applied, type: boolean, source: computed, default: false, description: "TRUE once this assignment has contributed its +1 to either approved_count or rejected_count" }
      - { name: committed, type: boolean, source: computed, default: true, description: "TRUE while the assignment's reward is reserved against HIT.max_assignments; set FALSE when it reaches RETURNED or EXPIRED" }
      - { name: rejection_reason, type: string, source: input, description: "Free-text reason recorded on rejection; null unless status REJECTED or DISPUTED" }
      - { name: dispute_reason, type: string, source: input, description: "Free-text dispute text supplied by the worker; null unless a DISPUTED transition occurred" }
      - { name: status, type: enum, source: system, description: "ACCEPTED | SUBMITTED | APPROVED | REJECTED | DISPUTED | RETURNED | EXPIRED" }
      - { name: assignment_expired, type: boolean, source: computed, default: false, description: "TRUE once the logical clock has passed accepted_at + HIT.time_limit_minutes and the expiry sweep has expired the assignment; the write-path expiry guard reads this same predicate" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: RequesterDeposit
    parent: Requester
    common_fields: true
    fields:
      - { name: requester_id, type: string, source: input, description: "FK -> Requester.id; the prepaying requester" }
      - { name: amount_cents, type: integer, source: input, description: "Face value of the prepayment" }
      - { name: status, type: enum, source: system, description: "PENDING | SUCCEEDED | FAILED" }
      - { name: escrowed_cents, type: integer, source: computed, default: 0, description: "Informationally mirrors the requester's current escrowed_cents; the deposit is a fungible pool, so this figure is derived and is NOT consulted by any conservation check" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Cumulative refund paid back from this deposit as HITs are cancelled or complete unclaimed" }

  - name: PayoutRequest
    parent: Worker
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; the withdrawing worker" }
      - { name: payment_method, type: enum, source: input, description: "BANK_TRANSFER | PAYPAL | GIFT_CARD — must be in the country's eligible method set (ERR_PAYOUT_METHOD_INELIGIBLE)" }
      - { name: amount_cents, type: integer, source: input, description: "Requested withdrawal amount; gated by the worker's country tier (ERR_PAYOUT_THRESHOLD_NOT_MET)" }
      - { name: hold_until_at, type: datetime, source: computed, description: "= created_at + HOLD_DAYS; the identity-verification vetting hold timestamp" }
      - { name: identity_verified_at, type: datetime, source: system, description: "Stamped by POST /mkt/payouts/{payout_id}/verify at release; null while HELD_FOR_VETTING" }
      - { name: status, type: enum, source: system, description: "HELD_FOR_VETTING | PAID | REJECTED (a payout is always minted in HELD_FOR_VETTING)" }
      - { name: rejection_reason, type: string, source: system, description: "Populated only when status is REJECTED" }

  - name: Review
    parent: Assignment
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the reviewed assignment" }
      - { name: actor_requester_id, type: string, source: input, description: "FK -> Requester.id; the requester whose review this is (approve/reject actor)" }
      - { name: actor_role, type: enum, source: input, description: "REQUESTER | REVIEWER | PLATFORM_ADMIN" }
      - { name: kind, type: enum, source: input, description: "APPROVAL | REJECTION | BONUS" }
      - { name: bonus_cents, type: integer, source: input, default: 0, description: "Bonus amount in cents; non-zero only for kind BONUS" }
      - { name: abuse_points, type: integer, source: computed, default: 0, description: "Abuse points this review contributes to Requester.abuse_score; equals 2 when kind == REJECTION and the requester task_abuse_flag is TRUE, else 0" }
      - { name: reason, type: string, source: input, description: "Reason text; required non-empty when kind == REJECTION (ERR_REJECTION_REASON_REQUIRED)" }# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # NOTE: the Requester abuse lifecycle at entry 3 IS the machine whose
  # ACTIVE_to_SUSPENDED chain (depth 4) is the deep cascade (Rule 4).
  # NOTE: the Assignment machine at entry 2 IS a branching machine
  # (SUBMITTED forks to APPROVED or REJECTED; REJECTED forks to DISPUTED
  # or stays terminal) — the non-linear shape (Rule 3).
  # NOTE: HIT is cyclic-ish only in that CANCELLED is reachable from two
  # non-terminal states; its non-linearity lives in the fork at the
  # DISPATCHED→COMPLETED vs CANCELLED boundary. Rule 3 is carried by the
  # Assignment branch and the Requester suspension/reinstate cycle.

  - entity: HIT
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /mkt/hits/{hit_id}/publish"
        actor: Requester
        preconditions:
          - "acting requester owns the HIT (ERR_FORBIDDEN)"
          - "requester status is ACTIVE and task_abuse_flag is FALSE (ERR_REQUESTER_TASK_BLOCKED)"
          - "requester prepaid_balance_cents >= funds_required_cents (ERR_INSUFFICIENT_FUNDS)"
        side_effects:
          - "requester.escrowed_cents += funds_required_cents"
          - "hit.escrowed_cents = funds_required_cents"
          - "hit.status → PUBLISHED"
      - from: PUBLISHED
        to: DISPATCHED
        trigger: "POST /mkt/hits/{hit_id}/assignments (first acceptance)"
        actor: Worker
        preconditions:
          - "worker status is ACTIVE (ERR_WORKER_SUSPENDED)"
          - "worker holds a WorkerQualification with score >= 0 for every id in hit.required_qualification_ids (ERR_QUALIFICATION_REQUIRED)"
          - "hit.accepted_count < hit.max_assignments (ERR_HIT_MAX_ASSIGNMENTS_REACHED)"
          - "worker live assignment count < MAX_CONCURRENT_ASSIGNMENTS (ERR_CONCURRENCY_LIMIT_EXCEEDED)"
        side_effects:
          - "hit.accepted_count += 1"
          - "hit.assignment_count += 1"
          - "hit.committed_assignments += 1"
          - "hit.status → DISPATCHED"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (automatic when accepted_count == max_assignments AND every assignment is terminal and committed_assignments == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "hit.escrowed_cents = 0"
          - "requester.escrowed_cents -= (funds held for this HIT at completion)"
          - "requester.prepaid_balance_cents += (funds released overall at completion)"
          - "hit.spent_rewards_cents = chronological sum of reward_cents over APPROVED assignments (pinned order: accepted_at ASC, then sequence ASC)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mkt/hits/{hit_id}/cancel"
        actor: Requester
        preconditions:
          - "acting requester owns the HIT (ERR_FORBIDDEN)"
          - "hit.accepted_count == 0 (ERR_INVALID_STATE) — a HIT that has ever accepted a worker may not be cancelled; it must complete"
        side_effects:
          - "hit.escrowed_cents = 0 (no funds were held while DRAFT)"
          - "hit.status → CANCELLED"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /mkt/hits/{hit_id}/cancel"
        actor: Requester
        preconditions:
          - "acting requester owns the HIT (ERR_FORBIDDEN)"
          - "hit.accepted_count == 0 (ERR_INVALID_STATE)"
        side_effects:
          - "requester.prepaid_balance_cents += hit.escrowed_cents (refund unclaimed reward and fee pool)"
          - "requester.escrowed_cents -= hit.escrowed_cents"
          - "hit.escrowed_cents = 0"
          - "hit.status → CANCELLED"

  - entity: Assignment
    initial_state: ACCEPTED
    terminal_states: [APPROVED, RETURNED, EXPIRED]
    transitions:
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "POST /mkt/assignments/{assignment_id}/submit"
        actor: Worker
        preconditions:
          - "acting worker owns the assignment (ERR_FORBIDDEN)"
          - "auto-expire BEFORE submit: if the logical clock is at or after accepted_at + hit.time_limit_minutes, expiry wins (ERR_ASSIGNMENT_EXPIRED) and the assignment is EXPIRED"
        side_effects:
          - "assignment.review_expires_at = submitted_at + REVIEW_WINDOW_HOURS"
          - "assignment.status → SUBMITTED"
      - from: ACCEPTED
        to: RETURNED
        trigger: "POST /mkt/assignments/{assignment_id}/return"
        actor: Worker
        preconditions:
          - "acting worker owns the assignment (ERR_FORBIDDEN)"
          - "current logical time < accepted_at + hit.time_limit_minutes (else ERR_ASSIGNMENT_EXPIRED)"
          - "assignment is not the worker's last live assignment against a HIT they already accepted (ERR_ALREADY_COMPLETED_HIT)"
        side_effects:
          - "worker.returned_count += 1"
          - "hit.assignment_count -= 1 (committed_assignments -= 1)"
          - "hit.accepted_count unchanged — the pool does NOT refill (ERR_HIT_MAX_ASSIGNMENTS_REACHED on a replacement attempt)"
          - "assignment.committed = false"
          - "assignment.status → RETURNED"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "POST /mkt/_clock/advance_to (automatic sweep) or POST /mkt/hits/{hit_id}/sweep-expired"
        actor: system
        preconditions:
          - "logical clock >= accepted_at + hit.time_limit_minutes (the sweep endpoint raises ERR_ASSIGNMENT_NOT_EXPIRED when no ACCEPTED assignment has elapsed its window)"
          - "assignment is still ACCEPTED"
        side_effects:
          - "worker.expired_count += 1"
          - "hit.assignment_count -= 1 (committed_assignments -= 1)"
          - "hit.accepted_count unchanged — no pool refill"
          - "assignment.committed = false"
          - "assignment.status → EXPIRED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mkt/assignments/{assignment_id}/approve"
        actor: Requester
        preconditions:
          - "assignment.eligible_for_approval is TRUE (ERR_REVIEW_TOO_EARLY)"
          - "no Review with kind REJECTION already exists for this assignment (ERR_INVALID_STATE)"
        side_effects:
          - "worker.approved_count += 1"
          - "worker.approval_rate_pct recomputed → cascades to system qualifications and to requester suspension"
          - "hit.spent_rewards_cents += hit.reward_cents (chronological order: approved_at ASC, then assignment.sequence ASC)"
          - "assignment.approval_rate_effect_applied = true"
          - "assignment.approved_at = current logical timestamp"
          - "assignment.status → APPROVED (terminal)"
          - "bubble-up: if hit.accepted_count == hit.max_assignments and every assignment terminal and committed_assignments == 0 then hit.status → COMPLETED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mkt/assignments/{assignment_id}/reject"
        actor: Requester
        preconditions:
          - "review body carries a non-empty reason (ERR_REJECTION_REASON_REQUIRED)"
          - "no Review with kind APPROVAL already exists for this assignment (ERR_INVALID_STATE)"
        side_effects:
          - "a Review row kind=REJECTION is appended with actor_requester_id"
          - "worker.rejected_count += 1"
          - "worker.approval_rate_pct recomputed → cascades to system qualifications and itself triggers the requester-suspension evaluation"
          - "hit.assignment_count -= 1 (committed_assignments -= 1); hit.accepted_count unchanged"
          - "assignment.committed = false"
          - "assignment.approval_rate_effect_applied = true"
          - "assignment.rejection_reason recorded"
          - "assignment.status → REJECTED"
      - from: REJECTED
        to: DISPUTED
        trigger: "POST /mkt/assignments/{assignment_id}/dispute"
        actor: Worker
        preconditions:
          - "acting worker owns the assignment (ERR_FORBIDDEN)"
          - "the assignment is within DISPUTE_WINDOW_HOURS of the rejection (ERR_DISPUTE_WINDOW_CLOSED)"
          - "the assignment has never been DISPUTED before (one dispute per assignment; ERR_DISPUTE_ALREADY_USED)"
        side_effects:
          - "assignment.dispute_reason recorded"
          - "assignment.status → DISPUTED"
          - "the originating REJECTION Review is NOT removed — the worker's rejected_count stays incremented (damage is not undone by disputing)"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /mkt/assignments/{assignment_id}/admin-resolve"
        actor: PlatformAdmin
        preconditions:
          - "resolution body carries decision APPROVE (ERR_INVALID_STATE for any other decision on a DISPUTED assignment)"
        side_effects:
          - "a Review row kind=APPROVAL with actor_role=PLATFORM_ADMIN is appended"
          - "worker.rejected_count -= 1; worker.approved_count += 1 (the damage is undone — the only path that reverses approval-rate damage)"
          - "worker.approval_rate_pct recomputed → cascades to system qualifications and to requester-suspension rollback"
          - "hit.spent_rewards_cents += hit.reward_cents (chronological order again)"
          - "assignment.status → APPROVED; if every assignment now terminal and committed_assignments == 0, hit bubbles up to COMPLETED"
      - from: DISPUTED
        to: REJECTED
        trigger: "POST /mkt/assignments/{assignment_id}/admin-resolve"
        actor: PlatformAdmin
        preconditions:
          - "resolution body carries decision UPHOLD (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "the rejection stands; worker.rejected_count unchanged; assignment.status → REJECTED (terminal again)"
          - "no further dispute is permitted (ERR_DISPUTE_ALREADY_USED)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "system (automatic review-expiry sweep at submitted_at + REVIEW_WINDOW_HOURS)"
        actor: system
        preconditions:
          - "logical clock >= assignment.review_expires_at"
          - "assignment is still SUBMITTED (an explicit review makes this a no-op)"
        side_effects:
          - "worker.approved_count += 1"
          - "worker.approval_rate_pct recomputed → cascades to system qualifications"
          - "hit.spent_rewards_cents += hit.reward_cents (chronological order: review_expires_at ASC, then assignment.sequence ASC)"
          - "assignment.approved_at = review_expires_at"
          - "assignment.status → APPROVED (terminal)"
          - "bubble-up: hit → COMPLETED when accepted_count == max_assignments and every assignment terminal and committed_assignments == 0"

  - entity: Requester
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mkt/requesters/{requester_id}/abuse-review with ABUSE_FLAG_THRESHOLD_PCT <= rejection_rate_pct < FRAUD_REVIEW_THRESHOLD_PCT"
        actor: PlatformAdmin
        preconditions:
          - "the requester's rolling rejection_rate_pct over the last REVIEW_WINDOW_DAYS is >= ABUSE_FLAG_THRESHOLD_PCT (ERR_REQUESTER_REVIEW_NOT_TRIGGERED otherwise)"
        side_effects:
          - "requester.task_abuse_flag = TRUE"
          - "requester.abuse_score recomputed from the weighted risk score"
          - "requester.status stays ACTIVE — the flag blocks new publication but leaves the in-flight lifecycle open"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mkt/requesters/{requester_id}/abuse-review with rejection_rate_pct >= FRAUD_REVIEW_THRESHOLD_PCT"
        actor: system
        preconditions:
          - "the requester's rolling rejection_rate_pct over the last REVIEW_WINDOW_DAYS is >= FRAUD_REVIEW_THRESHOLD_PCT"
          - "the requester's rolling rejection_rate_pct over the last REVIEW_WINDOW_DAYS is >= ABUSE_FLAG_THRESHOLD_PCT (ERR_REQUESTER_REVIEW_NOT_TRIGGERED otherwise)"
        side_effects:
          - "requester.abuse_score = 10 (stamped at suspension)"
          - "requester.suspension_reason = ABUSE_AUTO"
          - "requester.status → SUSPENDED"
          - "EVERY HIT owned by this requester in {DRAFT, PUBLISHED, DISPATCHED} → CANCELLED"
          - "for each cancelled HIT: requester.prepaid_balance_cents += hit.escrowed_cents, requester.escrowed_cents -= hit.escrowed_cents, hit.escrowed_cents = 0"
          - "for each CANCELLED HIT: every live assignment (ACCEPTED/SUBMITTED/RETURNED) → EXPIRED; worker.expired_count += 1; assignment.committed = false"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mkt/requesters/{requester_id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "acting role is PlatformAdmin (ERR_FORBIDDEN for Requester)"
        side_effects:
          - "requester.task_abuse_flag = FALSE"
          - "requester.abuse_score = 0"
          - "requester.suspension_reason = NONE"
          - "requester.status → ACTIVE"
          - "cancelled HITs are NOT revived (terminal states are not re-entered)"

  - entity: PayoutRequest
    initial_state: HELD_FOR_VETTING
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: HELD_FOR_VETTING
        to: PAID
        trigger: "POST /mkt/payouts/{payout_id}/verify"
        actor: PlatformAdmin
        preconditions:
          - "worker.identity_verified is TRUE (ERR_IDENTITY_NOT_VERIFIED otherwise — the operator must first record POST /mkt/workers/{worker_id}/identity-verifications with outcome VERIFIED)"
          - "logical clock >= payout.hold_until_at (ERR_VETTING_HOLD_ACTIVE otherwise)"
        side_effects:
          - "payout.identity_verified_at = current logical timestamp"
          - "payout.status → PAID (terminal)"
      - from: HELD_FOR_VETTING
        to: PAID
        trigger: "system (automatic sweep at created_at + HOLD_DAYS when identity_verified is TRUE)"
        actor: system
        preconditions:
          - "logical clock >= payout.hold_until_at"
        side_effects:
          - "payout.status → PAID (terminal)"
      - from: HELD_FOR_VETTING
        to: REJECTED
        trigger: "POST /mkt/payouts/{payout_id}/reject"
        actor: PlatformAdmin
        preconditions:
          - "the verification body denies identity (identity_verified stays FALSE)"
        side_effects:
          - "worker.withdrawable_cents += payout.amount_cents (reserved funds released)"
          - "payout.rejection_reason recorded"
          - "payout.status → REJECTED (terminal)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; every entry passes the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: hit-cancel-stale-version
    parent_entity: HIT
    write_endpoint: "POST /mkt/hits/{hit_id}/cancel"
    occ_field: "expected_hit_version"
    description: |
      Cancelling a HIT whose version has advanced since the requester last
      observed it is rejected. Publishing and child acceptances legitimately
      advance HIT.version between the requester's read and this call, so a
      stale expected_hit_version is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hit-sweep-expired-stale-version
    parent_entity: HIT
    write_endpoint: "POST /mkt/hits/{hit_id}/sweep-expired"
    occ_field: "expected_hit_version"
    description: |
      Running the expiration sweep against a HIT whose version has advanced
      since the caller last observed it is rejected: every acceptance and
      prior sweep advances HIT.version, so a stale expected_hit_version is
      rejected with ERR_STALE_VERSION even though the sweep target itself is
      still valid.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: hit_funds_required
    trigger: "POST /mkt/hits (creation) and POST /mkt/hits/{hit_id}/publish (revalidation); recomputed whenever reward_cents, max_assignments or bonus_budget_cents changes"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED, left to right. commission_rate is selected
      # from gross_pool_cents; the per-assignment fee tier is then selected from
      # the INTERMEDIATE pre_fee_cents (which already contains the commission) —
      # a circular-looking dependency whose order must be explicit for the value
      # to be well-defined.
      gross_pool_cents        = max_assignments * reward_cents + bonus_budget_cents
      if gross_pool_cents < 10000:      commission_rate = 0.20
      elif gross_pool_cents < 50000:    commission_rate = 0.15
      else:                             commission_rate = 0.10
      commission_cents        = round_half_up(gross_pool_cents * commission_rate)
      pre_fee_cents           = gross_pool_cents + commission_cents
      if pre_fee_cents < 20000:         fee_per_assignment_cents = 5
      else:                             fee_per_assignment_cents = 3
      funds_required_cents    = pre_fee_cents + max_assignments * fee_per_assignment_cents
    input_set: "All HITs regardless of status; the pool is keyed only on the pinned input fields, never on assignment outcomes"
    constants:
      COMMISSION_RATE_LOW: 0.20
      COMMISSION_RATE_MID: 0.15
      COMMISSION_RATE_HIGH: 0.10
      COMMISSION_TIER_MID_CENTS: 10000
      COMMISSION_TIER_HIGH_CENTS: 50000
      FEE_PER_ASSIGNMENT_LOW_CENTS: 5
      FEE_PER_ASSIGNMENT_HIGH_CENTS: 3
      FEE_TIER_CENTS: 20000
    precision: "cents are integers; round_half_up at the commission step only"
    variants:
      - name: commission_tier_boundary_inclusive
        when: "gross_pool_cents lands exactly on 10000 or 50000"
        difference: "A value of exactly 10000 uses rate 0.15 (>= tier is inclusive on the lower bound and exclusive on the upper); 50000 uses 0.10"
      - name: fee_tier_uses_intermediate
        when: "pre_fee_cents crosses 20000 while gross_pool_cents did not"
        difference: "The fee tier keys on pre_fee_cents, so a HIT can pay 3c/assignment purely because the commission pushed it over — not because the reward pool grew"

  - name: worker_net_earning
    trigger: "approval or admin-resolution overturn that credits a worker; recomputed per approved assignment"
    algorithm: aggregation
    formula: |
      # Nested-rounding order is PINNED: round PER assignment, then sum.
      # "sum the gross first and round once" is a different (rejected) reading.
      For each Assignment with status APPROVED, in order (approved_at ASC, sequence ASC):
        gross_cents      = reward_cents + bonus_cents
        commission_cents = round_half_up(gross_cents * WORKER_COMMISSION_RATE)
        net_cents        = gross_cents - commission_cents
      worker.total_earned_cents = sum(net_cents over those assignments)
    input_set: "Only assignments whose status is APPROVED. REJECTED, SUBMITTED, ACCEPTED, RETURNED and EXPIRED assignments contribute zero."
    constants:
      WORKER_COMMISSION_RATE: 0.10
      BONUS_ABUSE_POINTS: 2
    precision: "per-assignment integer cents; sum is exact integer addition"
    variants:
      - name: round_per_assignment_then_sum
        when: "always (the pinned, authoritative order)"
        difference: "N assignments each grossing 5c with rate 0.10 cost 0c commission each (round_half_up(0.5)=1 -> 5-1=4 per item); rounding the 5N total once would give a different sum for N>1"
      - name: required_minimum_guard
        when: "net_cents would compute to 0 or below"
        difference: "net_cents is floored at 0; a commission can never turn an earning negative"

  - name: requester_rejection_rate
    trigger: "POST /mkt/requesters/{requester_id}/abuse-review and the automatic evaluation chained off every Review append"
    algorithm: threshold
    formula: |
      # Window variant (used by abuse-review and suspension):
      window_rows      = Review rows of this requester whose created_at is within REVIEW_WINDOW_DAYS
                         of the logical clock (inclusive at the boundary: created_at >= clock - REVIEW_WINDOW_DAYS)
      window_rejected  = count(window_rows where kind == REJECTION)
      window_total     = count(window_rows where kind in {APPROVAL, REJECTION})
      rejection_rate_pct = 100 if window_total == 0 else round_half_up(100 * window_rejected / window_total)
      # Lifetime variant (used by the requester's public profile):
      lifetime_rate_pct  = 100 if (approved_count + rejected_count) == 0
                           else round_half_up(100 * rejected_count / (approved_count + rejected_count))
    input_set: "Reviews whose assignment belongs to this requester via Assignment.hit_id -> HIT.requester_id; BONUS reviews are excluded from both numerator and denominator"
    constants:
      REVIEW_WINDOW_DAYS: 30
      FRAUD_REVIEW_THRESHOLD_PCT: 40
      ABUSE_FLAG_THRESHOLD_PCT: 20
    precision: "integer percent; round_half_up"
    variants:
      - name: window_variant
        when: "abuse-review and the automatic suspension chain"
        difference: "Only the last 30 days of reviews count, so an old clean record cannot mask a recent rejection spree"
      - name: lifetime_variant
        when: "GET /mkt/requesters/{requester_id} profile rendering"
        difference: "Counts every review ever, so window and lifetime diverge whenever rejections cluster and the older history was clean"

  - name: hit_spent_cents
    trigger: "approval, admin-resolution overturn, and completion of a HIT; also read by the requester statement"
    algorithm: chronological
    formula: |
      # Final variant (authoritative for hit.spent_rewards_cents):
      spent_rewards_cents = sum(reward_cents for assignments with status APPROVED)
      # chosen in order (approved_at ASC, assignment.sequence ASC)
      # Provisional variant (requester-facing estimate, NOT persisted):
      provisional_spent_cents = sum(reward_cents for assignments
                                    with status in {APPROVED, SUBMITTED})
      # chosen in order (deadline_at ASC, assignment.sequence ASC)
    input_set: "Both variants filter to this HIT's own assignments (Assignment.hit_id == HIT.id); other HITs never contribute"
    precision: "exact integer cents; ordering only matters for the chronological replay, not for the sum"
    variants:
      - name: final_approved_only
        when: "hit.spent_rewards_cents and the completion ledger release"
        difference: "A SUBMITTED-but-unreviewed assignment contributes 0 to the final figure even though its reward will very likely be paid"
      - name: provisional_includes_submitted
        when: "requester statement / what-if projection while assignments are SUBMITTED"
        difference: "The provisional figure is strictly greater than the final figure whenever any assignment sits in SUBMITTED"

  - name: requester_risk_score
    trigger: "POST /mkt/requesters/{requester_id}/abuse-review"
    algorithm: weighted_scoring
    formula: |
      risk = rejection_rate_pct * W_REJECTION
           + distinct_workers_rejected * W_DISTINCT_WORKER
           + max(0, ABUSE_DECAY_DAYS - median_review_days) * W_SPEED
      risk = min(100, max(0, risk))
      # distinct_workers_rejected = count of distinct Assignment.worker_id among
      #   this requester's REJECTION reviews inside the window
      # median_review_days = median of (approved_at or rejected_at - submitted_at)
      #   in days over the same window; 0 when the window is empty
    input_set: "Reviews inside the 30-day window only; BONUS reviews excluded"
    constants:
      W_REJECTION: 1.2
      W_DISTINCT_WORKER: 3.0
      W_SPEED: 0.5
      ABUSE_DECAY_DAYS: 7
    precision: "integer; min/max clamp applied last"
    variants:
      - name: clamped_ceiling
        when: "weighted sum exceeds 100"
        difference: "risk saturates at 100 rather than growing without bound, so two very different requester behaviours can share the ceiling"
      - name: zero_on_empty_window
        when: "no reviews in the window"
        difference: "risk is 0, not undefined — the median term collapses to its max(0, ...) floor"

  - name: assignment_eligible_for_approval
    trigger: "POST /mkt/assignments/{assignment_id}/approve and the review-expiry sweep"
    algorithm: threshold
    formula: |
      elapsed_minutes = floor((logical_now - accepted_at) / 60s)
      half_window     = hit.assignment_duration_minutes / 2
      eligible_for_approval = elapsed_minutes >= half_window
    constants:
      REVIEW_WINDOW_HOURS: 72
    precision: "elapsed measured in whole minutes; the boundary is >= (exactly half is already eligible)"
    variants:
      - name: exact_half_is_eligible
        when: "elapsed_minutes == half_window exactly"
        difference: "The assignment is already approvable; a strict > would have rejected the boundary case"
      - name: auto_approve_on_expiry
        when: "the review window lapses with the assignment still SUBMITTED"
        difference: "The system approves it rather than leaving it stuck — the same eligible flag is ignored because the clock, not the requester, drives it"

  - name: hit_assignment_selector
    trigger: "POST /mkt/workers/{worker_id}/assignments/concurrency-check when the worker is at the concurrency cap and must free one slot"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter: assignments of this worker with status in
      #     {ACCEPTED} (SUBMITTED rows are never candidates)
      # (b) ranking expression: deadline_at ASC (the closest deadline first)
      # (c) tie-break: assignment.sequence ASC (stable per-worker ordinal)
      # (d) empty candidate set: no assignment is expired and the endpoint
      #     returns ERR_CONCURRENCY_LIMIT_EXCEEDED for the attempted accept
      # The selector NEVER consults Assignment.id or Worker.id.
    input_set: "Assignments owned by the requesting worker only; status == ACCEPTED"
    precision: "n/a (selection only)"
    variants:
      - name: nearest_deadline_first
        when: "several ACCEPTED assignments are candidates"
        difference: "The one that would be lost soonest is expired, preserving the worker's longest-running work"
      - name: empty_candidate_fallback
        when: "every live assignment is SUBMITTED"
        difference: "Nothing is expired and the accept is refused with ERR_CONCURRENCY_LIMIT_EXCEEDED instead of silently dropping submitted work"

  - name: payout_threshold_by_country
    trigger: "POST /mkt/workers/{worker_id}/payouts"
    algorithm: threshold
    formula: |
      if worker.country == "US": minimum_cents = 100
      elif worker.country in {"IN", "PH"}: minimum_cents = 500
      elif worker.country == "BR": minimum_cents = 1000
      else: minimum_cents = 500
      if requested_amount_cents < minimum_cents:
        reject with ERR_PAYOUT_THRESHOLD_NOT_MET
    input_set: "The worker's own withdrawable_cents and country"
    constants:
      PAYOUT_MIN_US_CENTS: 100
      PAYOUT_MIN_IN_PH_CENTS: 500
      PAYOUT_MIN_BR_CENTS: 1000
      HOLD_DAYS: 3
    precision: "integer cents; the boundary is >= (an amount exactly equal to the minimum is payable)"
    variants:
      - name: country_tier
        when: "the worker's country changes the floor"
        difference: "A BR worker's 500c request fails while a US worker's identical 500c request succeeds"
      - name: exact_minimum_passes
        when: "requested_amount_cents == minimum_cents"
        difference: "The request is accepted — the comparison is >=, not >"

  - name: hit_completion_release
    trigger: "bubble-up from the Assignment machine and the stale-assignment sweep"
    algorithm: aggregate_gate
    formula: |
      complete_when = (hit.accepted_count == hit.max_assignments)
                      AND (every assignment of this HIT is terminal)
                      AND (hit.committed_assignments == 0)
      balance_released_cents = hit.escrowed_cents - hit.spent_rewards_cents - hit.spent_bonus_cents
    input_set: "All assignments of the HIT regardless of status, plus the HIT's own escrow"
    precision: "integer cents; balance_released_cents can be 0 when every pool slot was approved"
    variants:
      - name: exact_fill_required
        when: "accepted_count < max_assignments"
        difference: "The HIT never completes and the residual escrow is never released"
      - name: released_after_full_terminality
        when: "accepted_count == max_assignments and all assignments terminal"
        difference: "Unspent escrow (from rejected or returned slots) returns to prepaid_balance_cents"

  - name: qualification_gate_snapshot
    trigger: "POST /mkt/hits/{hit_id}/assignments at acceptance time (precondition check), and again at the full-cap snapshot"
    algorithm: snapshot_capture
    formula: |
      # The worker's qualification grants are consulted ONCE, at acceptance.
      holds_all_required = all(qualification_type_id in {wq.qualification_type_id for wq
                             in WorkerQualification where wq.worker_id == worker_id
                             and wq.status == ACTIVE} for qualification_type_id
                             in hit.required_qualification_ids)
      # A grant REVOKED after acceptance does NOT retroactively invalidate an
      # already-accepted assignment or its submission — the gate is evaluated
      # only on the acceptance path and on the full-cap snapshot below.
      admission_rate_pct = worker.approval_rate_pct at the instant accepted_count
                           reaches hit.max_assignments; stamped onto the worker's
                           counts at that moment.
    input_set: "WorkerQualification rows with status ACTIVE for the accepting worker"
    precision: "n/a (predicate + snapshot only)"
    variants:
      - name: revoke_after_accept_is_inert
        when: "a CASCADE grant is revoked between acceptance and submission"
        difference: "The accepted assignment still submits and can be approved; a fresh acceptance of the same HIT would be refused"
      - name: snapshot_freezes_at_full_cap
        when: "accepted_count == max_assignments"
        difference: "The approval-rate snapshot taken at full capacity is the value that drives any later appraisal, even if the worker's live rate later diverges"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and naming a registered actor"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /mkt/requesters, POST /mkt/workers, POST /mkt/qualification-types and POST /mkt/_clock/*"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles and, for requester-owned resources, the acting requester/worker is the owner (X-User-ID == resource.requester_id / resource.worker_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-restricted endpoints"

  - priority: 3
    category: existence
    check: "Every {id} path segment resolves to an existing row of its collection, left to right in path order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (publish, cancel, accept, submit, return, approve, reject, dispute, admin-resolve, verify, reject-payout)"

  - priority: 5
    category: business_safety
    check: "Acting worker status is ACTIVE and acting requester status is ACTIVE with task_abuse_flag FALSE"
    error_id: ERR_WORKER_SUSPENDED
    http_status: 409
    applies_to: "POST /mkt/hits/{hit_id}/assignments, POST /mkt/assignments/{assignment_id}/submit, POST /mkt/assignments/{assignment_id}/return"
    note: "Requester-side counterpart is ERR_REQUESTER_TASK_BLOCKED, raised by POST /mkt/hits/{hit_id}/publish; both outrank every fiscal check"

  - priority: 6
    category: business_constraint
    check: "Qualification and pool constraints: required qualification grants held, per-worker concurrency cap not exceeded, HIT pool not exhausted, duplicate-accept guard, and exam_available TRUE when creating an exam"
    error_id: "ERR_QUALIFICATION_REQUIRED / ERR_EXAM_NOT_AVAILABLE"
    http_status: 409
    applies_to: "POST /mkt/hits/{hit_id}/assignments and POST /mkt/workers/{worker_id}/assignments/concurrency-check"

  - priority: 7
    category: business_temporal
    check: "Clock-relative windows: assignment not already expired, approval not attempted before the half-window, rejection not disputed after the dispute window, vetting hold not bypassed"
    error_id: ERR_REVIEW_TOO_EARLY
    http_status: 409
    applies_to: "POST /mkt/assignments/{assignment_id}/approve, POST /mkt/assignments/{assignment_id}/dispute, POST /mkt/payouts/{payout_id}/verify"

  - priority: 8
    category: business_referential
    check: "Optimistic concurrency: expected_*_version equals the parent row's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mkt/assignments/{assignment_id}/submit, POST /mkt/hits/{hit_id}/cancel, POST /mkt/payouts/{payout_id}/verify"

  - priority: 9
    category: business_fiscal
    check: "Money constraints evaluated last: requester prepaid balance covers funds_required_cents, bonus fits the HIT bonus budget, payout clears the country threshold, payout method is eligible for the country"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /mkt/hits/{hit_id}/publish, POST /mkt/assignments/{assignment_id}/bonus, POST /mkt/workers/{worker_id}/payouts"# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Requester ---
  - method: POST
    path: "/mkt/requesters"
    description: "Register a requester account"
    roles: [Anonymous]
    code: 201
    input: [name]
    output: Requester
    side_effects: ["status=ACTIVE, prepaid_balance_cents=0, abuse_score=0, task_abuse_flag=false"]

  - method: GET
    path: "/mkt/requesters/{requester_id}"
    description: "Get a requester profile (carries the lifetime rejection rate variant)"
    roles: [Requester, PlatformAdmin]
    code: 200
    input: []
    output: Requester
    side_effects: []

  - method: POST
    path: "/mkt/requesters/{requester_id}/deposits"
    description: "Create a prepayment deposit"
    roles: [Requester, PlatformAdmin]
    code: 201
    input: [amount_cents]
    output: RequesterDeposit
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/mkt/requester-deposits"
    description: "List deposits, optionally filtered by requester"
    roles: [Requester, PlatformAdmin]
    code: 200
    input: ["requester_id?", "limit?", "offset?"]
    output: RequesterDeposit[]
    side_effects: []

  - method: GET
    path: "/mkt/requester-deposits/{id}"
    description: "Get a deposit by id (collection anchor for FK reverse-reachability)"
    roles: [Requester, PlatformAdmin]
    code: 200
    input: []
    output: RequesterDeposit
    side_effects: []

  - method: POST
    path: "/mkt/requester-deposits/{deposit_id}/settle"
    description: "Settle or fail a deposit (simulated payment outcome)"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: RequesterDeposit
    side_effects: ["status → SUCCEEDED (credits requester.prepaid_balance_cents += amount_cents) or FAILED (no credit)", "if SUCCEEDED: requester.prepaid_balance_cents += amount_cents"]

  - method: POST
    path: "/mkt/requesters/{requester_id}/abuse-review"
    description: "Evaluate the requester's rolling rejection rate; suspend the requester when it crosses the fraud threshold"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Requester
    side_effects:
      - "requester.abuse_score recomputed from the weighted risk score"
      - "when window rejection_rate_pct >= 40: requester.status → SUSPENDED, suspension_reason=ABUSE_AUTO, all owned HITs cancelled, all live assignments expired, escrow refunded"
      - "when below threshold: task_abuse_flag = FALSE, status unchanged"

  - method: POST
    path: "/mkt/requesters/{requester_id}/reinstate"
    description: "Reinstate a suspended requester"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Requester
    side_effects: ["status → ACTIVE, task_abuse_flag=false, abuse_score=0, suspension_reason=NONE"]

  # --- Worker ---
  - method: POST
    path: "/mkt/workers"
    description: "Register a worker account"
    roles: [Anonymous]
    code: 201
    input: [display_name, country]
    output: Worker
    side_effects: ["status=ACTIVE, approval_rate_pct=100, counts=0, identity_verified=false"]

  - method: GET
    path: "/mkt/workers/{worker_id}"
    description: "Get a worker profile"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: []
    output: Worker
    side_effects: []

  - method: POST
    path: "/mkt/workers/{worker_id}/identity-verifications"
    description: "Submit identity verification for a worker"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome]
    output: Worker
    side_effects: ["outcome VERIFIED → worker.identity_verified = true", "outcome FAILED → identity_verified stays false"]

  - method: GET
    path: "/mkt/worker-qualifications"
    description: "List worker qualifications, optionally filtered by worker or type"
    roles: [Worker, Requester, PlatformAdmin]
    code: 200
    input: ["worker_id?", "qualification_type_id?", "limit?", "offset?"]
    output: WorkerQualification[]
    side_effects: []

  - method: GET
    path: "/mkt/worker-qualifications/{id}"
    description: "Get a worker-qualification grant by id (collection anchor for FK reverse-reachability)"
    roles: [Worker, Requester, PlatformAdmin]
    code: 200
    input: []
    output: WorkerQualification
    side_effects: []

  - method: POST
    path: "/mkt/workers/{worker_id}/suspend"
    description: "Suspend a worker account"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Worker
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/mkt/workers/{worker_id}/reinstate"
    description: "Reinstate a suspended worker account"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Worker
    side_effects: ["status → ACTIVE"]

  # --- QualificationType / QualificationExam / QualificationExamAttempt ---
  - method: POST
    path: "/mkt/qualification-types"
    description: "Create a qualification type"
    roles: [PlatformAdmin, Requester]
    code: 201
    input: [name, kind, auto_assign_threshold_pct, "exam_available?", "default_score?"]
    output: QualificationType
    side_effects: []

  - method: GET
    path: "/mkt/qualification-types/{qualification_type_id}"
    description: "Get a qualification type"
    roles: [Worker, Requester, PlatformAdmin]
    code: 200
    input: []
    output: QualificationType
    side_effects: []

  - method: POST
    path: "/mkt/qualification-types/{id}/exams"
    description: "Create the qualification exam for a type"
    roles: [PlatformAdmin]
    code: 201
    input: [passing_score, "max_attempts?", "retake_cooldown_days?"]
    output: QualificationExam
    side_effects: []

  - method: GET
    path: "/mkt/qualification-types/{id}/exams"
    description: "List exams belonging to a qualification type (FK reverse-reachability)"
    roles: [Worker, Requester, PlatformAdmin]
    code: 200
    input: []
    output: QualificationExam[]
    side_effects: []

  - method: GET
    path: "/mkt/qualification-exams/{exam_id}"
    description: "Get a qualification exam (collection anchor for FK reverse-reachability)"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: []
    output: QualificationExam
    side_effects: []

  - method: POST
    path: "/mkt/qualification-exams/{exam_id}/attempts"
    description: "Submit a scored exam attempt; a passing score grants the qualification"
    roles: [Worker]
    code: 201
    input: [score]
    output: QualificationExamAttempt
    side_effects:
      - "sequence assigned (per worker, starting at 1)"
      - "outcome = PASSED iff score >= passing_score else FAILED"
      - "on PASSED: a WorkerQualification row (source=EXAM, status=ACTIVE, score=attempt.score) is upserted; re-grant refreshes score and status"

  - method: GET
    path: "/mkt/qualification-exams/{id}/attempts"
    description: "List attempts against an exam"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: ["worker_id?", "limit?", "offset?"]
    output: QualificationExamAttempt[]
    side_effects: []

  # --- HIT ---
  - method: POST
    path: "/mkt/hits"
    description: "Create a task in DRAFT"
    roles: [Requester]
    code: 201
    input: [requester_id, title, reward_cents, max_assignments, assignment_duration_minutes, time_limit_minutes, "required_qualification_ids?", "bonus_budget_cents?"]
    output: HIT
    side_effects: ["status=DRAFT", "funds_required_cents computed", "escrowed_cents=0"]

  - method: GET
    path: "/mkt/hits/{hit_id}"
    description: "Get a HIT"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: []
    output: HIT
    side_effects: []

  - method: GET
    path: "/mkt/hits"
    description: "List HITs with filters"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: ["requester_id?", "status?", "limit?", "offset?"]
    output: HIT[]
    side_effects: []

  - method: GET
    path: "/mkt/requesters/{requester_id}/hits"
    description: "List the HITs owned by a requester (FK reverse-reachability)"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HIT[]
    side_effects: []

  - method: POST
    path: "/mkt/hits/{hit_id}/publish"
    description: "Publish a DRAFT HIT, holding funds from the requester's prepaid balance"
    roles: [Requester]
    code: 200
    input: []
    output: HIT
    side_effects: ["status → PUBLISHED", "requester.escrowed_cents += funds_required_cents", "hit.escrowed_cents = funds_required_cents"]

  - method: POST
    path: "/mkt/hits/{hit_id}/cancel"
    description: "Cancel a DRAFT or PUBLISHED HIT and refund unclaimed escrow"
    roles: [Requester]
    code: 200
    input: [expected_hit_version]
    output: HIT
    side_effects: ["status → CANCELLED", "requester.prepaid_balance_cents += hit.escrowed_cents", "requester.escrowed_cents -= hit.escrowed_cents", "hit.escrowed_cents = 0", "increments HIT.version by 1"]

  - method: POST
    path: "/mkt/hits/{hit_id}/sweep-expired"
    description: "Run the expiration sweep for a HIT's ACCEPTED assignments past their time limit"
    roles: [Requester]
    code: 200
    input: [expected_hit_version]
    output: HIT
    side_effects: ["increments HIT.version by 1", "rejects with ERR_ASSIGNMENT_NOT_EXPIRED when the HIT has no ACCEPTED assignment past accepted_at + time_limit_minutes", "each ACCEPTED assignment past accepted_at + time_limit_minutes → EXPIRED", "worker.expired_count += 1 per expired assignment", "hit.assignment_count -= 1 per expired assignment", "committed_assignments -= 1 per expired assignment"]

  - method: GET
    path: "/mkt/hits/{hit_id}/assignments"
    description: "List the assignments of a HIT (FK reverse-reachability)"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  # --- Assignment ---
  - method: POST
    path: "/mkt/hits/{hit_id}/assignments"
    description: "Accept a task: mints an Assignment and consumes a pool slot"
    roles: [Worker]
    code: 201
    input: [worker_id]
    output: Assignment
    side_effects:
      - "assignment.status=ACCEPTED, deadline_at = accepted_at + assignment_duration_minutes"
      - "sequence minted (per worker)"
      - "hit.accepted_count += 1, hit.assignment_count += 1, hit.committed_assignments += 1"
      - "hit.status → DISPATCHED when it was PUBLISHED"
      - "if hit.accepted_count == hit.max_assignments: credit the worker's approval counts at the pinned acceptance-rate snapshot"

  - method: GET
    path: "/mkt/assignments"
    description: "List assignments with filters"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: ["hit_id?", "worker_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/mkt/assignments/{assignment_id}"
    description: "Get an assignment"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/mkt/workers/{worker_id}/assignments/concurrency-check"
    description: "Resolve a worker's concurrency cap: expire the nearest-deadline ACCEPTED assignment or refuse"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: [hit_id]
    output: Assignment
    side_effects:
      - "if the worker has a free slot: creates a new ACCEPTED assignment for hit_id"
      - "if at MAX_CONCURRENT_ASSIGNMENTS: expires the candidate chosen by hit_assignment_selector (deadline_at ASC, sequence ASC) and returns it"
      - "if every live assignment is SUBMITTED: no expiry, ERR_CONCURRENCY_LIMIT_EXCEEDED"

  - method: POST
    path: "/mkt/assignments/{assignment_id}/submit"
    description: "Submit completed work for review"
    roles: [Worker]
    code: 200
    input: [expected_assignment_version]
    output: Assignment
    side_effects: ["status → SUBMITTED", "review_expires_at = submitted_at + 72h", "increments Assignment.version by 1"]

  - method: POST
    path: "/mkt/assignments/{assignment_id}/return"
    description: "Return an accepted assignment before its deadline"
    roles: [Worker]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status → RETURNED", "worker.returned_count += 1", "hit.assignment_count -= 1, committed_assignments -= 1", "hit.accepted_count unchanged"]

  - method: POST
    path: "/mkt/assignments/{assignment_id}/approve"
    description: "Approve submitted work"
    roles: [Requester]
    code: 200
    input: []
    output: Assignment
    side_effects:
      - "status → APPROVED"
      - "a Review row kind=APPROVAL is appended"
      - "worker.approved_count += 1; approval_rate_pct recomputed"
      - "hit.spent_rewards_cents += reward_cents"
      - "cascade: system-qualification grant/revoke; HIT completion check"

  - method: POST
    path: "/mkt/assignments/{assignment_id}/reject"
    description: "Reject submitted work"
    roles: [Requester]
    code: 200
    input: [reason]
    output: Assignment
    side_effects:
      - "status → REJECTED"
      - "a Review row kind=REJECTION is appended with abuse_points"
      - "worker.rejected_count += 1; approval_rate_pct recomputed"
      - "hit.assignment_count -= 1, committed_assignments -= 1; accepted_count unchanged"
      - "cascade: system-qualification revoke; automatic requester-suspension evaluation"

  - method: POST
    path: "/mkt/assignments/{assignment_id}/bonus"
    description: "Pay a bonus to the worker for an approved or submitted assignment"
    roles: [Requester]
    code: 200
    input: [bonus_cents]
    output: Assignment
    side_effects:
      - "assignment.bonus_cents += bonus_cents"
      - "a Review row kind=BONUS is appended"
      - "hit.spent_bonus_cents += bonus_cents"
      - "worker.total_earned_cents and withdrawable_cents += net (per-assignment rounding)"

  - method: POST
    path: "/mkt/assignments/{assignment_id}/dispute"
    description: "Dispute a rejection"
    roles: [Worker]
    code: 200
    input: [reason]
    output: Assignment
    side_effects: ["status → DISPUTED", "dispute_reason recorded", "the rejected_count damage is NOT undone yet"]

  - method: POST
    path: "/mkt/assignments/{assignment_id}/admin-resolve"
    description: "Platform-admin resolution of a dispute"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "reason?"]
    output: Assignment
    side_effects:
      - "decision APPROVE → status APPROVED; worker.rejected_count -= 1, approved_count += 1; approval_rate_pct recomputed; cascade to qualifications and to requester suspension rollback"
      - "decision UPHOLD → status REJECTED; counts unchanged"

  # --- Review ---
  - method: GET
    path: "/mkt/requesters/{id}/reviews"
    description: "List the reviews authored by a requester (FK reverse-reachability)"
    roles: [Requester, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Review[]
    side_effects: []

  - method: GET
    path: "/mkt/assignments/{id}/reviews"
    description: "List the reviews of an assignment (FK reverse-reachability)"
    roles: [Requester, Worker, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Review[]
    side_effects: []

  # --- PayoutRequest ---
  - method: POST
    path: "/mkt/workers/{id}/payouts"
    description: "Request a withdrawal"
    roles: [Worker]
    code: 201
    input: [payment_method, amount_cents]
    output: PayoutRequest
    side_effects:
      - "status := HELD_FOR_VETTING always (minted held); hold_until_at = created_at + HOLD_DAYS"
      - "worker.withdrawable_cents -= amount_cents"

  - method: GET
    path: "/mkt/payouts/{payout_id}"
    description: "Get a payout request"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: []
    output: PayoutRequest
    side_effects: []

  - method: GET
    path: "/mkt/workers/{id}/payouts"
    description: "List a worker's payout requests (FK reverse-reachability)"
    roles: [Worker, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PayoutRequest[]
    side_effects: []

  - method: POST
    path: "/mkt/payouts/{payout_id}/verify"
    description: "Verify identity and release a held payout"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_payout_request_version]
    output: PayoutRequest
    side_effects: ["status → PAID", "payout.identity_verified_at = current logical timestamp", "increments PayoutRequest.version by 1"]

  - method: POST
    path: "/mkt/payouts/{payout_id}/reject"
    description: "Reject a held payout and release the reserved funds"
    roles: [PlatformAdmin]
    code: 200
    input: [rejection_reason]
    output: PayoutRequest
    side_effects: ["status → REJECTED", "worker.withdrawable_cents += amount_cents"]

  # --- Custom test-driving endpoints (last resort per §1.5 priority ladder) ---
  - method: POST
    path: "/mkt/_clock/set_current_utc"
    description: "Set the logical clock to an absolute instant. Server startup default is fixed at 2026-09-01T00:00:00Z; before any call the clock reads exactly that default and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock := current_utc"]

  - method: POST
    path: "/mkt/_clock/advance_to"
    description: "Advance the logical clock to a later instant and run every automatic sweep due at or before it (assignment expiry, provisional/final auto-approval on review-window lapse, payout vetting settlement, HIT completion bubble-up)"
    roles: [PlatformAdmin]
    code: 200
    input: [target_utc]
    output: null
    side_effects:
      - "logical clock := target_utc"
      - "ACCEPTED assignments past accepted_at + time_limit_minutes → EXPIRED"
      - "SUBMITTED assignments past review_expires_at → APPROVED (final auto-approval)"
      - "HELD_FOR_VETTING payouts past hold_until_at with identity_verified → PAID"
      - "HITs meeting the completion gate → COMPLETED with escrow release"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this endpoint, or acting requester/worker is not the resource owner"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-segment id does not resolve to a row of its collection"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, or a field outside its declared enum/type"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is declared"
  - id: ERR_REQUESTER_NOT_ACTIVE
    http: 409
    condition: "Acting requester status is SUSPENDED or PENDING_REVIEW; publication and lifecycle writes are closed"
  - id: ERR_REQUESTER_TASK_BLOCKED
    http: 409
    condition: "Requester task_abuse_flag is TRUE, so new HIT publication is refused"
  - id: ERR_WORKER_SUSPENDED
    http: 409
    condition: "Acting worker status is SUSPENDED"
  - id: ERR_QUALIFICATION_REQUIRED
    http: 409
    condition: "Worker does not hold a live WorkerQualification for every id in HIT.required_qualification_ids"
  - id: ERR_EXAM_NOT_AVAILABLE
    http: 409
    condition: "POST /mkt/qualification-types/{qualification_type_id}/exams for a type whose exam_available is FALSE"
  - id: ERR_QUALIFICATION_EXAM_ATTEMPTS_EXCEEDED
    http: 409
    condition: "Worker's scored attempt count for the exam has reached exam.max_attempts"
  - id: ERR_QUALIFICATION_EXAM_COOLDOWN_ACTIVE
    http: 409
    condition: "Fewer than exam.retake_cooldown_days have elapsed since the worker's last scored attempt"
  - id: ERR_CONCURRENCY_LIMIT_EXCEEDED
    http: 409
    condition: "Worker holds MAX_CONCURRENT_ASSIGNMENTS live assignments and no ACCEPTED assignment is available to expire"
  - id: ERR_HIT_MAX_ASSIGNMENTS_REACHED
    http: 409
    condition: "hit.accepted_count has already reached hit.max_assignments and no live assignment is being returned"
  - id: ERR_REWARD_INVALID
    http: 400
    condition: "reward_cents is not a positive integer, or max_assignments / time limits are not positive"
  - id: ERR_ASSIGNMENT_EXPIRED
    http: 409
    condition: "The assignment's time limit has elapsed; the write-path guard expires it and refuses the operation"
  - id: ERR_ASSIGNMENT_NOT_EXPIRED
    http: 409
    condition: "POST /mkt/hits/{hit_id}/sweep-expired was called on a HIT with no ACCEPTED assignment whose time limit has elapsed"
  - id: ERR_REVIEW_TOO_EARLY
    http: 409
    condition: "Approval attempted before elapsed time reaches half of hit.assignment_duration_minutes"
  - id: ERR_REJECTION_REASON_REQUIRED
    http: 400
    condition: "A rejection was submitted with an empty or missing reason"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "More than DISPUTE_WINDOW_HOURS have elapsed since the rejection"
  - id: ERR_DISPUTE_ALREADY_USED
    http: 409
    condition: "The assignment has already used its single dispute"
  - id: ERR_REQUESTER_REVIEW_NOT_TRIGGERED
    http: 409
    condition: "abuse-review was called but the rolling rejection rate over the window is below ABUSE_FLAG_THRESHOLD_PCT (20)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent row's current version"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "requester.prepaid_balance_cents is below hit.funds_required_cents at publication"
  - id: ERR_BONUS_BUDGET_EXCEEDED
    http: 409
    condition: "The bonus would push hit.spent_bonus_cents above hit.bonus_budget_cents"
  - id: ERR_PAYOUT_THRESHOLD_NOT_MET
    http: 409
    condition: "Requested amount is below the worker country's minimum payout threshold"
  - id: ERR_PAYOUT_METHOD_INELIGIBLE
    http: 409
    condition: "payment_method is not in the worker country's eligible method set"
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 409
    condition: "Payout verification attempted while the worker's identity has not been recorded as VERIFIED"
  - id: ERR_VETTING_HOLD_ACTIVE
    http: 409
    condition: "Payout verification attempted before payout.hold_until_at"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller permitted only to register requesters and workers"
    identity: opaque
    exclusive_operations:
      - "POST /mkt/requesters"
      - "POST /mkt/workers"
    shared_operations: []

  - name: Requester
    description: "Publishes tasks, prepays rewards, reviews work, disputes outcomes with the platform"
    identity: entity_backed:Requester
    exclusive_operations:
      - "POST /mkt/hits"
      - "POST /mkt/hits/{hit_id}/publish"
      - "POST /mkt/hits/{hit_id}/cancel"
      - "POST /mkt/hits/{hit_id}/sweep-expired"
      - "POST /mkt/assignments/{assignment_id}/approve"
      - "POST /mkt/assignments/{assignment_id}/reject"
      - "POST /mkt/assignments/{assignment_id}/bonus"
      - "POST /mkt/requesters/{requester_id}/deposits"
    shared_operations:
      - "GET /mkt/requesters/{requester_id}"
      - "GET /mkt/hits"
      - "GET /mkt/hits/{hit_id}"
      - "GET /mkt/requesters/{requester_id}/hits"
      - "GET /mkt/hits/{hit_id}/assignments"
      - "GET /mkt/assignments"
      - "GET /mkt/assignments/{assignment_id}"
      - "GET /mkt/assignments/{assignment_id}/reviews"
      - "POST /mkt/qualification-types"
      - "GET /mkt/qualification-types/{qualification_type_id}"

  - name: Worker
    description: "Accepts tasks, submits work, disputes rejections, and withdraws earnings"
    identity: entity_backed:Worker
    exclusive_operations:
      - "POST /mkt/hits/{hit_id}/assignments"
      - "POST /mkt/workers/{worker_id}/assignments/concurrency-check"
      - "POST /mkt/assignments/{assignment_id}/submit"
      - "POST /mkt/assignments/{assignment_id}/return"
      - "POST /mkt/assignments/{assignment_id}/dispute"
      - "POST /mkt/qualification-exams/{exam_id}/attempts"
      - "POST /mkt/workers/{worker_id}/payouts"
    shared_operations:
      - "GET /mkt/workers/{worker_id}"
      - "GET /mkt/hits"
      - "GET /mkt/hits/{hit_id}"
      - "GET /mkt/hits/{hit_id}/assignments"
      - "GET /mkt/assignments"
      - "GET /mkt/assignments/{assignment_id}"
      - "GET /mkt/assignments/{assignment_id}/reviews"
      - "GET /mkt/worker-qualifications"
      - "GET /mkt/qualification-types/{qualification_type_id}"
      - "GET /mkt/qualification-types/{qualification_type_id}/exams"
      - "GET /mkt/qualification-exams/{exam_id}"
      - "GET /mkt/qualification-exams/{exam_id}/attempts"
      - "GET /mkt/payout-requests"
      - "GET /mkt/payouts/{payout_id}"

  - name: PlatformAdmin
    description: "Trust-and-safety operator: funds deposits, verifies identity, resolves disputes, suspensions and vettings"
    identity: opaque
    exclusive_operations:
      - "POST /mkt/requester-deposits/{deposit_id}/settle"
      - "POST /mkt/requesters/{requester_id}/abuse-review"
      - "POST /mkt/requesters/{requester_id}/reinstate"
      - "POST /mkt/workers/{worker_id}/identity-verifications"
      - "POST /mkt/workers/{worker_id}/suspend"
      - "POST /mkt/workers/{worker_id}/reinstate"
      - "POST /mkt/qualification-types/{qualification_type_id}/exams"
      - "POST /mkt/assignments/{assignment_id}/admin-resolve"
      - "POST /mkt/payouts/{payout_id}/verify"
      - "POST /mkt/payouts/{payout_id}/reject"
      - "POST /mkt/_clock/set_current_utc"
      - "POST /mkt/_clock/advance_to"
