          setup:
            - "One concession at OPERATIONS with monthly_unitary_charge_cents 8604167 and deduction_cap_pct 0.20."
            - "Two adjacent ServicePeriods: P1 (period_index 1, 2027-03-01 .. 2027-04-01, 31 days) and P2 (period_index 2, 2027-04-01 .. 2027-05-01, 30 days), each with gross_unitary_charge_cents 8604167 and deduction_cap_cents 1720833."
            - "Each period carries one SUBMITTED PerformanceReport of 100 unavailable minutes, 2 category A and 4 category B failures, so reported_points == 2*100 + 40*2 + 10*4 == 320."
            - "Logical clock at 2027-05-02T00:00:00Z."
