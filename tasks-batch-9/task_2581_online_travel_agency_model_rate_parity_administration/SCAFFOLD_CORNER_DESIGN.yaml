            - "DisputeCase.${dc_hi}.refund_due_cents == 24240, because claim_cents 60000 is capped at charged_total_cents 24240 minus refunded_cents 0"
            - "DisputeCase.${dc_hi}.mediation_fee_pct == 0.020 and mediation_fee_cents == 2985, since the tier is keyed on the CAPPED refund_due_cents 24240, not on the 60000 claim"
            - "DisputeCase.${dc_hi}.settlement_total_cents == 27225"
            - "both cases show that mediation_fee_cents - round_half_up(refund_due_cents * mediation_fee_pct) == 2500, the MEDIATION_FEE_BASE_CENTS constant"

