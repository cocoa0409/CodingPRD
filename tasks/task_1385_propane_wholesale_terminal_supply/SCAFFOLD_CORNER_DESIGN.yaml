  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected 401 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { name: "T-V1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "with auth headers stripped, error_id == ERR_UNAUTHENTICATED (http 401)"
      - name: dealer_role_cannot_create_terminal_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", roles]
        distinguishing_aspect: "Role check: DealerUser on POST /terminals (SupplyAdmin-exclusive) is rejected ERR_FORBIDDEN even though the dealer id is valid."
        test_recipe:
          setup: ["one dealer exists"]
          setup_api_calls:
            - call: "POST /dealers"
              payload: { legal_name: "Dealer V2", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id }
          trigger:
            - call: "POST /terminals"
              payload: { name: "T-V2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: DealerUser
              as_user_id: "${dl}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (http 403)"
