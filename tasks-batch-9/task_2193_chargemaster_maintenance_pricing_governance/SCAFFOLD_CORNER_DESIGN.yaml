          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001 (NEAREST_CENT); revenue code 0300; department CC-100; COST_PLUS_MARKUP rule with the default tiers."
            - "Three ACTIVE items: CDM-1001 (code 93458), CDM-1002 (code 93460) and CDM-1003 (also code 93460) — the last two make 93460 an ambiguous crosswalk target."
            - "CodeUpdateCycle 2027/CPT in status LOADED with no entries yet."
