        claim_type: correct_result
        grounds: ["calculations.compliance_posture_derivation"]
        distinguishing_aspect: "Pinned evaluation order: with both an ACTIVE hold and an ACTIVE FULL_EXCLUSION restriction, posture is ON_HOLD (holds checked before restrictions), not WORK_EXCLUDED."
        test_recipe:
