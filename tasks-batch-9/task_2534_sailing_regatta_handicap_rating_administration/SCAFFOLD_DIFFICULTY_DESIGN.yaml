# Scaffold Difficulty Design (Test Targeting Index) - SKILL.md 1.8
# Task 2534 - Sailing Regatta & Handicap Rating Administration
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml 1.1-1.7.
# Nothing here adds behaviour; it only indexes the difficulty surface for the
# downstream unit-test generator.
#
# Shared world conventions used by the setup chains:
#   * the logical clock starts at 2026-08-01T00:00:00Z (POST /regatta-ops/_clock/set_current_utc)
#   * certificates are measured valid_from 2026-01-01 / valid_until 2026-12-31
#   * regattas race on 2026-08-05 with series_start_utc 2026-08-05T00:00:00Z
#   * fleet_minimum 2 and Division.min_entries 2 keep the smallest legal fleet
#   * jury_quorum_required 2, so one POST /regatta-ops/jury-panels/{id}/seats bubbles FORMING -> SEATED
#   * safety_category CAT_4 with course_code DISTANCE_COASTAL keeps the required
#     duty positions at PRO / TIMEKEEPER / SIGNALS only
#   * one whole-regatta duty window 2026-08-05T12:00:00Z .. 2026-08-05T20:00:00Z
#     (race_id omitted) fully covers the [S-30min, S+120min] coverage window of
#     every race scheduled between 14:00 and 18:00 that day
#   * measured boats reused across instances:
#       A  sail USA-4410  68.0 / 11.0 / 5200 / 2.10 MONOHULL -> raw 0.6545, TOD 171.3, TOT 0.8582 (band 171.3)
#       B  sail USA-3308  52.0 /  9.4 / 4100 / 1.95 MONOHULL -> raw 0.5294, TOD 218.8
#       D  sail USA-5502  61.0 / 10.2 / 4700 / 2.35 MONOHULL -> raw 0.5767, TOD 200.9, TOT 0.8037 (band 200.8)
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: corrected_time_tod_versus_tot_on_identical_elapsed
        grounds:
          - calculations.corrected_time
          - entities.RaceResult.fields.corrected_seconds
          - entities.RatingCertificate.fields.rating_value
          - entities.RatingCertificate.fields.band_key_spm
          - state_machines.Race.NOT_SCORED_to_PROVISIONAL
        distinguishing_aspect: |
          This dual variant lives on the RaceResult domain: two boats measured with identical
          measurement data and identical elapsed_seconds 4800.0 over the same 6.0 nm course get
          different corrected_seconds only because one certificate is TOD_PHRF (TIME_ON_DISTANCE,
          4800.0 - 171.3 * 6.0 = 3772.2) and the other TOT_ORC (TIME_ON_TIME,
          4800.0 * 0.8582 = 4119.4) - a 347.2 s divergence that decides the finishing order.
        test_recipe:
          setup:
            - "Nine club members: a licensed measurer, a regatta chair, three duty volunteers, two judges, two helms."
            - "Two MONOHULL boats measured identically (68.0 / 11.0 / 5200 / 2.10); one holds an ISSUED TOD_PHRF certificate (rating_value 171.3, band_key_spm 171.3), the other an ISSUED TOT_ORC certificate (rating_value 0.8582, band_key_spm 171.3)."
            - "A LOW_POINT / PER_CERTIFICATE regatta with NOR and SI published, division A (MONOHULL, band 150.0 .. 230.0) CONFIRMED with both entries ACCEPTED, a SEATED jury panel, status RACING, three CONFIRMED whole-regatta duties, race 1 STARTED over 6.0 nm."
            - "The logical clock sits at 2026-08-05T18:00:00Z when the two results are recorded."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Tom Isley", email: "tom.isley@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_tk: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Sara Quill", email: "sara.quill@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_sg: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Nils Brandt", email: "nils.brandt@yc.test", judge_certification_level: "REGIONAL" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_jc: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Ida Moss", email: "ida.moss@yc.test", judge_certification_level: "CLUB" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_j2: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_tod: $.data.id, b_tod_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4411", boat_name: "Windward Thorn", owner_member_id: "${m_h2}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h2}", captures: { b_tot: $.data.id, b_tot_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_tod}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_tod_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_tod: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_tod}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_tot}", rule_code: "TOT_ORC", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_tot_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_tot: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates/${c_tot}/issue", payload: {}, as: Measurer, as_user_id: "${m_mea}" }
            - { call: "POST /regatta-ops/regattas", payload: { name: "Autumn Handicap Series", host_club_name: "Harbor Yacht Club", scoring_system: "LOW_POINT", discard_policy: "NONE", handicap_basis: "PER_CERTIFICATE", planned_race_count: 6, fleet_minimum: 2, protest_time_limit_minutes: 90, jury_quorum_required: 2, safety_category: "CAT_4", series_start_utc: "2026-08-05T00:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg: $.data.id, reg_v1: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "NOR", body_summary: "Notice of race revision 1", effective_utc: "2026-07-10T00:00:00Z", expected_regatta_version: "${reg_v1}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_nor: $.data.id } }
            - { call: "GET /regatta-ops/regattas/${reg}", payload: {}, as: RegattaChair, as_user_id: "${m_ch}", captures: { reg_v2: $.data.version } }
            - { call: "POST /regatta-ops/race-documents", payload: { regatta_id: "${reg}", doc_type: "SI", body_summary: "Sailing instructions revision 1", effective_utc: "2026-07-15T00:00:00Z", expected_regatta_version: "${reg_v2}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { doc_si: $.data.id } }
            - { call: "POST /regatta-ops/divisions", payload: { regatta_id: "${reg}", code: "A", boat_type_filter: "MONOHULL", rating_band_low: 150.0, rating_band_high: 230.0, min_entries: 2 }, as: RegattaChair, as_user_id: "${m_ch}", captures: { div_a: $.data.id } }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_tod}", certificate_id: "${c_tod}", helm_member_id: "${m_h1}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h1}", captures: { e_tod: $.data.id } }
            - { call: "POST /regatta-ops/entries/${e_tod}/crew", payload: { member_id: "${m_h1}", position: "HELM", weight_kg: 84.0 }, as: Competitor, as_user_id: "${m_h1}" }
            - { call: "POST /regatta-ops/entries/${e_tod}/inspect", payload: { outcome: "PASS" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/entries/${e_tod}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_tod}/accept", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries", payload: { regatta_id: "${reg}", boat_id: "${b_tot}", certificate_id: "${c_tot}", helm_member_id: "${m_h2}", declared_crew_count: 1 }, as: Competitor, as_user_id: "${m_h2}", captures: { e_tot: $.data.id } }
            - { call: "POST /regatta-ops/entries/${e_tot}/crew", payload: { member_id: "${m_h2}", position: "HELM", weight_kg: 79.0 }, as: Competitor, as_user_id: "${m_h2}" }
            - { call: "POST /regatta-ops/entries/${e_tot}/inspect", payload: { outcome: "PASS" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/entries/${e_tot}/assign-division", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/entries/${e_tot}/accept", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/divisions/${div_a}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/jury-panels", payload: { regatta_id: "${reg}", chair_member_id: "${m_jc}" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { pnl: $.data.id } }
            - { call: "POST /regatta-ops/jury-panels/${pnl}/seats", payload: { member_id: "${m_j2}" }, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/regattas/${reg}/open-racing", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_pro}", position: "PRO", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { dut_pro: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${dut_pro}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_tk}", position: "TIMEKEEPER", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { dut_tk: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${dut_tk}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/duty-assignments", payload: { regatta_id: "${reg}", member_id: "${m_sg}", position: "SIGNALS", window_start_utc: "2026-08-05T12:00:00Z", window_end_utc: "2026-08-05T20:00:00Z" }, as: RegattaChair, as_user_id: "${m_ch}", captures: { dut_sg: $.data.id } }
            - { call: "POST /regatta-ops/duty-assignments/${dut_sg}/confirm", payload: {}, as: RegattaChair, as_user_id: "${m_ch}" }
            - { call: "POST /regatta-ops/races", payload: { regatta_id: "${reg}", race_number: 1, course_code: "DISTANCE_COASTAL", course_distance_nm: 6.0, scheduled_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { r1: $.data.id } }
            - { call: "POST /regatta-ops/races/${r1}/start-sequence", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/races/${r1}/start", payload: { actual_start_utc: "2026-08-05T14:00:00Z" }, as: RaceOfficer, as_user_id: "${m_pro}" }
            - { call: "POST /regatta-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T18:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1" }
          trigger:
            - { call: "POST /regatta-ops/race-results", payload: { race_id: "${r1}", entry_id: "${e_tod}", finish_status: "FINISHED", elapsed_seconds: 4800.0 }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { rr_tod: $.data.id, rr_tod_corr: $.data.corrected_seconds } }
            - { call: "POST /regatta-ops/race-results", payload: { race_id: "${r1}", entry_id: "${e_tot}", finish_status: "FINISHED", elapsed_seconds: 4800.0 }, as: RaceOfficer, as_user_id: "${m_pro}", captures: { rr_tot: $.data.id, rr_tot_corr: $.data.corrected_seconds } }
            - { call: "POST /regatta-ops/races/${r1}/score", payload: {}, as: RaceOfficer, as_user_id: "${m_pro}" }
          assert:
            - "RatingCertificate.${c_tod}.rating_value == 171.3 and RatingCertificate.${c_tod}.band_key_spm == 171.3"
            - "RatingCertificate.${c_tot}.rating_value == 0.8582 and RatingCertificate.${c_tot}.band_key_spm == 171.3"
            - "RaceResult.${rr_tod}.corrected_seconds == 3772.2"
            - "RaceResult.${rr_tot}.corrected_seconds == 4119.4"
            - "RaceResult.${rr_tot}.corrected_seconds - RaceResult.${rr_tod}.corrected_seconds == 347.2"
            - "RaceResult.${rr_tod}.place == 1 and RaceResult.${rr_tod}.points == 1.0"
            - "RaceResult.${rr_tot}.place == 2 and RaceResult.${rr_tot}.points == 2.0"
            - "Race.${r1}.points_pool_total == 3.0"
            - "Entry.${e_tod}.series_points_gross == 1.0 and Entry.${e_tot}.series_points_gross == 2.0"

      - name: series_standing_low_point_versus_bonus_point_on_identical_race_data
        grounds:
          - calculations.series_standing
          - calculations.race_points_and_places
          - entities.Entry.fields.series_points_gross
          - entities.Entry.fields.series_rank
          - entities.Race.fields.points_pool_total
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain - the Entry series ledger, not the
          RaceResult correction: two regattas fed byte-identical corrected times (D 3900.0, A and B
          tied on 4000.0, N_div 3) produce LOW_POINT gross 1.0 / 2.5 / 2.5 with pool 6.0 versus
          BONUS_POINT gross 0.0 / 4.4 / 4.4 with pool 8.8, so the same race data yields different
          Entry.series_points_gross and a different Race.points_pool_total per scoring system.
        test_recipe:
          setup:
            - "Ten club members and three measured MONOHULL boats with ISSUED TOD_PHRF certificates: A 171.3, B 218.8, D 200.9."
            - "Regatta ONE is LOW_POINT with series_start_utc 2026-08-05T00:00:00Z and race 1 STARTED on 2026-08-05 at 14:00 over 6.0 nm."
            - "Regatta TWO is BONUS_POINT with series_start_utc 2026-08-06T00:00:00Z and race 1 STARTED on 2026-08-06 at 14:00 over 6.0 nm."
            - "Both regattas carry division A (MONOHULL, band 150.0 .. 230.0, min_entries 2) CONFIRMED with the same three boats ACCEPTED, a SEATED jury panel, status RACING and three CONFIRMED whole-regatta duties on their own race day."
            - "The logical clock sits at 2026-08-06T18:00:00Z when results are recorded."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Piers Holt", email: "piers.holt@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_ch: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Dana Reeve", email: "dana.reeve@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_pro: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Tom Isley", email: "tom.isley@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_tk: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Sara Quill", email: "sara.quill@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_sg: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Nils Brandt", email: "nils.brandt@yc.test", judge_certification_level: "REGIONAL" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_jc: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Ida Moss", email: "ida.moss@yc.test", judge_certification_level: "CLUB" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_j2: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h1: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Rhea Voss", email: "rhea.voss@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h2: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Kai Larsen", email: "kai.larsen@yc.test", safety_course_expiry_utc: "2027-06-30T00:00:00Z" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_h3: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_h1}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_h1}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-3308", boat_name: "Sea Fern", owner_member_id: "${m_h2}", boat_type: "MONOHULL", loa_meters: 9.8 }, as: Competitor, as_user_id: "${m_h2}", captures: { b_b: $.data.id, b_b_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-5502", boat_name: "Tide Runner", owner_member_id: "${m_h3}", boat_type: "MONOHULL", loa_meters: 10.6 }, as: Competitor, as_user_id: "${m_h3}", captures: { b_d: $.data.id, b_d_v: $.data.version } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
