  - section: validations
    instances:
      - name: dependency_edge_from_a_node_to_itself_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_27
          - errors.ERR_SELF_DEPENDENCY
        distinguishing_aspect: "Priority 27 fires on node identity, not on kind: an APPLICATION -> APPLICATION edge whose from_node_id equals its to_node_id returns 422 ERR_SELF_DEPENDENCY and no edge row is created, so the group projection is unchanged."
        test_recipe:
          setup:
            - "The bootstrap through the creation of AST-DB1 exists; APP-CORE is AGREED at TIER_1 60/15."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
          trigger:
            - call: "POST /dependency-edges"
              payload: { from_node_kind: "APPLICATION", from_node_id: "${a1_id}", to_node_kind: "APPLICATION", to_node_id: "${a1_id}", edge_kind: "HARD" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { self_error: $.data.error_id }
          assert:
            - "HTTP 422 with self_error == ERR_SELF_DEPENDENCY, not ERR_DEPENDENCY_CYCLE — priority 27 precedes priority 28"
            - "GET /dependency-edges?from_node_id=${a1_id} returns total_count == 0"

      - name: tier_rto_cap_accepts_exactly_sixty_and_rejects_sixty_one
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_33
          - errors.ERR_TIER_RTO_EXCEEDS_CAP
        distinguishing_aspect: "TIER_RTO_CAP[TIER_1] is 60 and the comparison is <=, so a proposal of exactly 60 is accepted while 61 on an otherwise identical application returns 422 ERR_TIER_RTO_EXCEEDS_CAP."
        test_recipe:
          setup:
            - "The clock, stakeholders and sites exist; two DRAFT applications APP-CAPA and APP-CAPB are created."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - call: "POST /applications"
              payload: { name: "Cap probe A", app_code: "APP-CAPA", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 4 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { capA_id: $.data.id }
            - call: "POST /applications"
              payload: { name: "Cap probe B", app_code: "APP-CAPB", business_owner_id: "${bo1_id}", primary_site_id: "${sp_id}", criticality_weight: 4 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { capB_id: $.data.id }
          trigger:
            - call: "POST /applications/${capA_id}/tier-proposals"
              payload: { proposed_tier: "TIER_1", proposed_rto_minutes: 60, proposed_rpo_minutes: 15, rationale: "Exactly at both caps" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /applications/${capB_id}/tier-proposals"
              payload: { proposed_tier: "TIER_1", proposed_rto_minutes: 61, proposed_rpo_minutes: 15, rationale: "One minute over the cap" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { cap_error: $.data.error_id }
          assert:
            - "the first call returns 201: Application.${capA_id}.tier_agreement_status == TIER_PROPOSED with proposed_rto_minutes 60, proposed_rpo_minutes 15 and proposed_by_id ${c1_id}"
            - "the second call returns 422 with cap_error == ERR_TIER_RTO_EXCEEDS_CAP"
            - "Application.${capB_id}.tier_agreement_status is still DRAFT with proposed_tier == null"
            - "Application.${capA_id}.rto_minutes == null — the agreed objectives are only written on AGREE, not on the proposal"

      - name: observation_exactly_at_the_clock_is_accepted_and_one_second_ahead_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_45
          - errors.ERR_OBSERVATION_IN_FUTURE
        distinguishing_aspect: "Priority 45 compares observed_at <= the logical clock, so an observation stamped exactly at 2026-08-01T00:00:00Z is stored while one at 2026-08-01T00:00:01Z is rejected — equality is on the accepting side."
        test_recipe:
          setup:
            - "The clock reads 2026-08-01T00:00:00Z and AST-DB1 exists as a DATA_STORE."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
          trigger:
            - call: "POST /assets/${d1_id}/replication-observations"
              payload: { observed_at: "2026-08-01T00:00:00Z", replication_lag_seconds: 120, unreplicated_txn_count: 300 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { obs_ok_id: $.data.id }
            - call: "POST /assets/${d1_id}/replication-observations"
              payload: { observed_at: "2026-08-01T00:00:01Z", replication_lag_seconds: 120, unreplicated_txn_count: 300 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { future_error: $.data.error_id }
          assert:
            - "the first call returns 201 with ReplicationObservation.${obs_ok_id}.observed_at == 2026-08-01T00:00:00Z"
            - "the second call returns 422 with future_error == ERR_OBSERVATION_IN_FUTURE"
            - "GET /assets/${d1_id}/replication-observations returns total_count == 1"

      - name: coverless_step_skips_the_agreement_check_that_a_covering_step_fails
        claim_type: conditional_validation
        grounds:
          - validations.priority_25
          - errors.ERR_STEP_COVERS_UNAGREED_APPLICATION
        distinguishing_aspect: "Priority 25 is conditional on covers_application_id being non-null: with APP-CORE still TIER_PROPOSED, validating the coverless step succeeds while validating the step that covers APP-CORE returns 422."
        test_recipe:
          setup:
            - "The clock, stakeholders, sites and APP-CORE exist; APP-CORE is TIER_PROPOSED and never agreed."
            - "Recovery group RG-C holds runbook rbC in IN_REVIEW with step 1 covering APP-CORE and step 2 covering nothing."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - call: "POST /recovery-groups"
              payload: { name: "Conditional probe group", group_code: "RG-C", recovery_site_id: "${sr_id}", lead_coordinator_id: "${c1_id}", recovery_order: 4 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { gc_id: $.data.id, gc_v: $.data.version }
            - call: "POST /runbooks"
              payload: { recovery_group_id: "${gc_id}", title: "Conditional probe runbook", author_id: "${c1_id}", expected_recovery_group_version: "${gc_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { rbC_id: $.data.id }
            - call: "POST /runbook-steps"
              payload: { runbook_id: "${rbC_id}", step_number: 1, description: "Promote the unagreed application", owner_id: "${op1_id}", expected_minutes: 10, weight: 10, covers_application_id: "${a1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { sC1_id: $.data.id }
            - call: "POST /runbook-steps"
              payload: { runbook_id: "${rbC_id}", step_number: 2, description: "Announce the cutover on the bridge call", owner_id: "${op1_id}", expected_minutes: 5, weight: 10 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { sC2_id: $.data.id }
            - call: "POST /runbooks/${rbC_id}/transitions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /runbook-steps/${sC2_id}/validations"
              payload: { validation_note: "No application coverage, nothing to check" }
              as: ITOperator
              as_user_id: "${op1_id}"
            - call: "POST /runbook-steps/${sC1_id}/validations"
              payload: { validation_note: "Covers an application that is still only proposed" }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { unagreed_error: $.data.error_id }
          assert:
            - "the coverless step validates: RunbookStep.${sC2_id}.validation_status == VALIDATED with last_validated_at == 2026-08-01T00:00:00Z"
            - "the covering step is rejected with 422 and unagreed_error == ERR_STEP_COVERS_UNAGREED_APPLICATION"
            - "RunbookStep.${sC1_id}.validation_status is still PENDING"
            - "Runbook.${rbC_id}.readiness_score == 50.00 — one VALIDATED weight-10 step and one PENDING weight-10 step over total_weight 20"
            - "RecoveryGroup.${gc_id}.posture == RESTRICTED with posture_reason == NO_VALIDATED_RUNBOOK — the runbook is still IN_REVIEW"

      - name: retest_scope_check_runs_only_after_the_finding_state_check
        claim_type: cascading_validation
        grounds:
          - validations.priority_14
          - validations.priority_32
          - errors.ERR_INVALID_FINDING_STATE
          - errors.ERR_RETEST_SCOPE_MISMATCH
        distinguishing_aspect: "SCHEDULE_RETEST on an OPEN finding reports ERR_INVALID_FINDING_STATE and never reaches the scope check; once the finding is REMEDIATED the same nomination reports ERR_RETEST_SCOPE_MISMATCH, so the ordering of the two checks is observable from one payload."
        test_recipe:
          setup:
            - "The clock, stakeholders, sites, APP-CORE and RG-1 exist."
            - "Exercise exSrc carries one OPEN finding on RG-1; exercise exRet is a DRAFT exercise with no scope items at all."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - call: "POST /exercises"
              payload: { name: "Source exercise", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-20T00:00:00Z", planned_end_at: "2026-08-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exSrc_id: $.data.id }
            - call: "POST /exercises"
              payload: { name: "Unscoped retest candidate", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-09-20T00:00:00Z", planned_end_at: "2026-09-20T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exRet_id: $.data.id }
            - call: "POST /findings"
              payload: { exercise_id: "${exSrc_id}", recovery_group_id: "${g1_id}", severity: "MAJOR", title: "Runbook step ownership unclear", description: "Nobody could name the owner of the promotion step." }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { fSc_id: $.data.id }
          trigger:
            - call: "POST /findings/${fSc_id}/transitions"
              payload: { action: "SCHEDULE_RETEST", retest_exercise_id: "${exRet_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { state_first_error: $.data.error_id }
            - call: "POST /findings/${fSc_id}/transitions"
              payload: { action: "ASSIGN", owner_id: "${op1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /findings/${fSc_id}/transitions"
              payload: { action: "REMEDIATE", note: "Ownership recorded on every step" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /findings/${fSc_id}/transitions"
              payload: { action: "SCHEDULE_RETEST", retest_exercise_id: "${exRet_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { scope_second_error: $.data.error_id }
          assert:
            - "the first SCHEDULE_RETEST returns 409 with state_first_error == ERR_INVALID_FINDING_STATE — priority 14 answers before priority 32"
            - "after ASSIGN and REMEDIATE, Finding.${fSc_id}.state == REMEDIATED with owner_id == ${op1_id}"
            - "the second SCHEDULE_RETEST returns 422 with scope_second_error == ERR_RETEST_SCOPE_MISMATCH — ${exRet_id} holds no scope item on ${g1_id}"
            - "Finding.${fSc_id}.state is still REMEDIATED and retest_exercise_id is still null"
            - "RecoveryGroup.${g1_id}.open_finding_count == 1 throughout — REMEDIATED is non-terminal"

      - name: exercise_state_answers_before_the_site_window
        claim_type: priority_ordering
        grounds:
          - validations.priority_8
          - validations.priority_37
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / scoped_exercise_with_overlapping_window_rejects_on_state_before_window_conflict
          rationale: "That §1.8 instance violates both rules with one call and asserts the lower-priority window error is never reported."

      - name: freeze_answers_before_the_site_mismatch
        claim_type: priority_conflict
        grounds:
          - validations.priority_24
          - validations.priority_26
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / frozen_group_scoped_from_wrong_site_rejects_on_freeze_before_site_mismatch
          rationale: "That §1.8 instance violates priority 24 and priority 26 together and includes the control call that proves the mismatch is genuinely violated."

      - name: impact_submission_validity_depends_on_another_entity
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_23
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / impact_submission_depends_on_recovery_group_posture_ready
          rationale: "That §1.8 instance tests the same call against a RESTRICTED group and then against a READY one."

      - name: individually_valid_exercises_collectively_exceed_the_site
        claim_type: aggregate_validation
        grounds:
          - validations.priority_41
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_exactly_equal_to_usable_is_allowed_one_unit_over_rejects
          rationale: "That §1.8 instance schedules exercises that each fit until the aggregate reaches the ceiling exactly and then one unit past it."

  - section: endpoints
    instances:
      - name: patch_stakeholder_updates_authority_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH./stakeholders/{id}
          - entities.Stakeholder.fields.approval_authority_level
        distinguishing_aspect: "PATCH /stakeholders/{id} is the only mutating update in the register: it accepts a partial body, writes only the supplied field and bumps version from 1 to 2 while leaving full_name and email untouched."
        test_recipe:
          setup:
            - "The clock and the five entity-backed stakeholders exist; the audit liaison holds approval_authority_level LEVEL_1."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
          trigger:
            - call: "PATCH /stakeholders/${al1_id}"
              payload: { approval_authority_level: "LEVEL_2" }
              as: PlatformAdmin
          assert:
            - "Stakeholder.${al1_id}.approval_authority_level == LEVEL_2 and version == 2"
            - "Stakeholder.${al1_id}.full_name == \"Ally Ito\", email == \"ally.ito@example.com\", org_roles == [AUDIT_LIAISON] and status == ACTIVE — the omitted fields are unchanged"
            - "Stakeholder.${ra3_id}.version == 1 — no other row was touched"

      - name: change_freeze_stores_the_interval_and_bumps_the_group_version
        claim_type: action_endpoint
        grounds:
          - endpoints.POST./recovery-groups/{id}/change-freeze
          - entities.RecoveryGroup.fields.change_freeze_start_at
          - validations.priority_44
        distinguishing_aspect: "The change-freeze action writes both endpoints of the interval onto the group and bumps its version, which is what later makes an optimistically concurrent runbook publish stale; an equal start and end is accepted because priority 44 uses >= on this window."
        test_recipe:
          setup:
            - "The clock, stakeholders, sites, APP-CORE, AST-DB1 and RG-1 exist; RG-1 has no freeze window and version 1."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
          trigger:
            - call: "POST /recovery-groups/${g1_id}/change-freeze"
              payload: { change_freeze_start_at: "2026-08-20T00:00:00Z", change_freeze_end_at: "2026-08-20T00:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { frozen_group_version: $.data.version }
          assert:
            - "RecoveryGroup.${g1_id}.change_freeze_start_at == 2026-08-20T00:00:00Z and change_freeze_end_at == 2026-08-20T00:00:00Z — a zero-length window is legal under priority 44's >="
            - "frozen_group_version == 2 — the write bumps the group version"
            - "RecoveryGroup.${g1_id}.posture == RESTRICTED with posture_reason == NO_VALIDATED_RUNBOOK — a freeze window is not the FROZEN posture"

      - name: asset_group_assignment_links_both_rows_and_recomputes_the_projection
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST./assets/{id}/group-assignments
          - entities.Asset.fields.recovery_group_id
          - calculations.projected_recovery_minutes_critical_path
        distinguishing_aspect: "The group-assignment link is what pulls a node into the projection: with the HARD APP-CORE -> AST-DB1 edge already present but AST-DB1 outside the group, projected_recovery_minutes is 60; assigning the asset makes both edge endpoints members and the projection becomes 80."
        test_recipe:
          setup:
            - "The bootstrap through the dependency edge exists, except that AST-DB1 has NOT been assigned to RG-1."
            - "RG-1 therefore holds APP-CORE only, and the HARD edge has one endpoint outside the group."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p16
          trigger:
            - call: "POST /assets/${d1_id}/group-assignments"
              payload: { recovery_group_id: "${g1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          assert:
            - "before the trigger, RecoveryGroup.${g1_id}.projected_recovery_minutes == 60 with recovery_sequence == [${a1_id}] — the edge is ignored while AST-DB1 is not a member"
            - "after the trigger, Asset.${d1_id}.recovery_group_id == ${g1_id}"
            - "after the trigger, RecoveryGroup.${g1_id}.projected_recovery_minutes == 80 with recovery_sequence == [${a1_id}, ${d1_id}]"
            - "DependencyEdge.${e_a1d1_id} is unchanged — the association lives on the Asset row, not on the edge"

      - name: recovery_group_read_reflects_the_three_node_hard_chain
        claim_type: computed_read
        grounds:
          - endpoints.GET./recovery-groups/{id}
          - calculations.projected_recovery_minutes_critical_path
        distinguishing_aspect: "A plain GET returns the stored derived values, so extending the chain with an INFRA_COMPONENT of restore_minutes 12 moves projected_recovery_minutes from 80 to 92 and lengthens recovery_sequence to three ids in source-to-sink order."
        test_recipe:
          setup:
            - "The bootstrap through the dependency edge exists: RG-1 holds APP-CORE (60) and AST-DB1 (20) with a HARD APP-CORE -> AST-DB1 edge."
            - "AST-NET1 is created as an INFRA_COMPONENT with restore_minutes 12, assigned to RG-1, and a HARD AST-DB1 -> AST-NET1 edge is added."
          setup_api_calls:
            - *p01
            - *p02
            - *p03
            - *p04
            - *p05
            - *p06
            - *p07
            - *p08
            - *p09
            - *p10
            - *p11
            - *p12
            - *p13
            - *p14
            - *p15
            - *p16
            - call: "POST /assets"
              payload: { name: "Core network fabric", asset_code: "AST-NET1", asset_kind: "INFRA_COMPONENT", site_id: "${sp_id}", replication_mode: "SYNCHRONOUS", restore_minutes: 12 }
              as: ITOperator
              as_user_id: "${op1_id}"
              captures: { i1_id: $.data.id }
            - call: "POST /assets/${i1_id}/group-assignments"
              payload: { recovery_group_id: "${g1_id}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /dependency-edges"
              payload: { from_node_kind: "ASSET", from_node_id: "${d1_id}", to_node_kind: "ASSET", to_node_id: "${i1_id}", edge_kind: "HARD" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
          trigger:
            - call: "GET /recovery-groups/${g1_id}"
              payload: {}
              as: AuditLiaison
              as_user_id: "${al1_id}"
              captures: { read_projection: $.data.projected_recovery_minutes, read_sequence: $.data.recovery_sequence }
          assert:
            - "read_projection == 92 — 60 + 20 + 12 along the only HARD path"
            - "read_sequence == [${a1_id}, ${d1_id}, ${i1_id}] in source-to-sink order"
            - "the read is side-effect free: RecoveryGroup.${g1_id}.version is unchanged by the GET"
            - "RecoveryGroup.${g1_id}.posture == RESTRICTED with posture_reason == NO_VALIDATED_RUNBOOK — no runbook exists in this variant"

