          assert:
            - "trigger call 1 (retention 249,999.99) returns 201 with data.net_premium_usd == 181500.00 and data.gross_premium_usd == 207428.57: floor(249999.99 / 250000) == 0, so the credit is exactly 0.00 and the base 22000 x 8.25 passes through untouched"
            - "trigger call 2 (retention 250,000.00) returns 201 with data.net_premium_usd == 172425.00 and data.gross_premium_usd == 197057.14: one cent more retention steps the credit to 0.05 and removes 9075.00 == 181500.00 x 0.05"
            - "trigger call 3 (retention 499,999.99) returns 201 with data.net_premium_usd == 172425.00 — byte-identical to trigger call 2, because the credit is flat across the whole 250,000-wide block"
            - "trigger call 4 (retention 500,000.00) returns 201 with data.net_premium_usd == 163350.00 and data.gross_premium_usd == 186685.71: the second step takes the credit to 0.10"
            - "the four net premiums form the step sequence 181500.00, 172425.00, 172425.00, 163350.00 — strictly decreasing only at the exact multiples, which no linear-in-retention formula can reproduce"
            - "all four quotes carry data.risk_band_at_quote == ELEVATED and no Side C load, so the only moving part is the retention credit"
            - "none of the four net premiums is clamped: each sits strictly between NET_PREMIUM_FLOOR_USD 25000 and NET_PREMIUM_CEILING_USD 2500000"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: advance_blocked_by_delinquent_policy_premium
        grounds:
          - validations[priority=84]
          - state_machines.DefenseInvoice.SUBMITTED_to_ADVANCED
          - state_machines.Policy.INVOICED_to_DELINQUENT
          - state_machines.Policy.INVOICED_to_PAID
          - calculations.defense_cost_allocation
          - calculations.defense_advancement_waterfall
          - concurrency_rules[defense-allocation-stale-claim]
        distinguishing_aspect: |
          The write is on a DefenseInvoice, its precondition reads the grandparent Policy's OTHER
          state dimension (premium_status), and the entity that changes to unblock it is neither the
          invoice nor the claim but the Policy. The blocked call must also leave the claim's OCC
          token untouched, which is proved by replaying the identical expected_claim_version after
          the premium is paid: a naive implementation that bumps Claim.version on the rejected
          attempt would turn the retry into a 412.
        test_recipe:
          setup:
            - "One bound Policy of Vantiq Bio Inc: 10,000,000 limit, 250,000 retention, 5,000,000 Side C sublimit, gross_premium_usd 236,468.57, premium_due_date 2026-08-31T00:00:00Z."
            - "The clock is moved to 2026-09-01T00:00:00Z and one ops run is taken, so coverage_status is ACTIVE and premium_status is DELINQUENT."
            - "One SECURITIES_CLASS_ACTION Claim in COVERAGE_ACCEPTED with allocation_method RELATIVE_EXPOSURE and retention_remaining_usd 250,000."
            - "One SUBMITTED DefenseInvoice for 400,000 billed = 150,000 covered + 200,000 mixed + 50,000 uncovered, with 3 insured-person defendants and 1 entity defendant."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
              as: Underwriter
              captures: { insured_id: "$.data.id" }
            - call: "POST /dno/insureds/${insured_id}/disclosure-packages"
              payload: { fiscal_year: 2025, filed_date: "2026-03-01T00:00:00Z", restatement_flag: true, material_weakness_count: 1, going_concern_flag: false, negative_operating_cash_flow_flag: false, debt_to_equity: 1.1, independent_director_ratio: 0.40, dual_class_shares_flag: false, staggered_board_flag: false, combined_ceo_chair_flag: true, auditor_change_flag: false }
              as: Underwriter
            - call: "POST /dno/insureds/${insured_id}/litigation-events"
              payload: { case_type: "SECURITIES_CLASS_ACTION", filed_date: "2024-06-15T00:00:00Z", resolved_date: "2025-01-15T00:00:00Z", indemnity_paid_usd: 4000000, outcome: "SETTLED" }
              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 20000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2027-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
              captures: { sub_id: "$.data.id" }
            - call: "POST /dno/submissions/${sub_id}/score"
              payload: { variant: "INDICATIVE" }
              as: Underwriter
              captures: { sub_v: "$.data.version" }
            - call: "POST /dno/submissions/${sub_id}/quotes"
              payload: { expected_submission_version: "${sub_v}", offered_limit_usd: 10000000, offered_retention_usd: 250000, offered_side_c_sublimit_usd: 5000000, quote_valid_until: "2026-08-31T00:00:00Z" }
              as: Underwriter
              captures: { quote_id: "$.data.id" }
            - call: "GET /dno/quotes/${quote_id}/exclusion-terms"
              payload: {}
              as: Underwriter
              captures: { conduct_term_id: "$.data[0].id" }
            - call: "POST /dno/exclusion-terms/${conduct_term_id}/resolve"
              payload: { resolution: "AGREE" }
