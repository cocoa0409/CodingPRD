            - "Second trigger call, issued immediately after with no intervening write: qualifying_income_monthly_cents == 647041, pitia_monthly_cents == 274764, dti_pct == 56.37, residual_income_cents == 282277, documented_reserves_months == 14.56 and dscr_ratio == null"
            - "The same read also shows the dependent fields recomputed in the same breath: overlay_breach_codes and unresolved_overlay_breach_count reflect the new income, and securitization_eligible is false because the file is not CLOSED"
            - "Third trigger call returns the identical worksheet numbers as the first trigger call's body, field for field - the write response is not a preliminary view that a later read corrects"
