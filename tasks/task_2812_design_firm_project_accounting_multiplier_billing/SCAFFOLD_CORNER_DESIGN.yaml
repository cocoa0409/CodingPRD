              payload: { project_id: "${p_priv}", phase_id: "${ph_priv}", category: "ENTERTAINMENT", amount: 200.00, incurred_on: "2026-05-15", receipt_attached: false }
              as: ProjectAccountant
              as_user_id: "acct-001"
              captures: { ex_priv: $.data.id }
            - call: "POST /expenses/${ex_priv}/review"
