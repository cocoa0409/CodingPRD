      - name: asset_retire_deprecates_library_entry_and_restores_descendant_points
        claim_type: conditional_cascade
        grounds:
          - state_machines.Asset.PUBLISHED_to_RETIRED
          - state_machines.Asset.LIBRARY_APPROVED_to_LIBRARY_DEPRECATED
          - entities.Asset.fields.reuse_source_stale
          - calculations.asset_reuse_credit
        distinguishing_aspect: |
          The deprecation cascade is conditional on the other dimension's state: retiring a LIBRARY_APPROVED
          asset deprecates the library entry and restores its descendant's full 200.00 complexity points,
          while retiring a PRIVATE asset with no descendants fires no cascade at all.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION"
            - "asset AD01_CHAR_HERO (300.00 points) is PUBLISHED and LIBRARY_APPROVED"
            - "asset AD01_CHAR_SIDEKICK (200.00 points) is derived from it, so it carries a depth-1 discount"
            - "asset AD01_PROP_01 (50.00 points) is PUBLISHED but still PRIVATE and has no descendants"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
