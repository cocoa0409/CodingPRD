# =============================================================================
# §1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 1913: Industrial Gas Production & Cylinder Fill
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: cylinder_created_with_derived_defaults
        claim_type: creation
        grounds:
                 - "entities.CylinderAsset"
        distinguishing_aspect: "POST /api/cylinders returns 201 with server id, status IN_STOCK, water_capacity_liters 50 derived from STANDARD, hydro_due_date computed as last_hydro + 12 months for O2, version 1."
        test_recipe:
          setup: ["Empty database; clock at default 2026-08-01"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN1", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c: $.data.id, wc: $.data.water_capacity_liters, due: $.data.hydro_due_date, st: $.data.status, v: $.data.version } }
          assert:
            - "CylinderAsset.${c}.water_capacity_liters == 50 (SIZE_SPECS[STANDARD])"
            - "hydro_due_date == 2026-09-01 (O2 interval 12 months); hydro_status == COMPLIANT at clock 2026-08-01"
            - "status == IN_STOCK; version == 1; id is a server-minted UUID"

      - name: cylinder_duplicate_serial_rejected
        claim_type: type_constraints
        grounds:
                 - "entities.CylinderAsset.fields.serial_number"
                 - "errors[ERR_DUPLICATE_CYLINDER_SERIAL]"
        distinguishing_aspect: "Uniqueness spans terminal states: a serial registered once is rejected even after the original is RETIRED."
        test_recipe:
          setup: ["One registered cylinder SN-EN2"]
          setup_api_calls:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN2", size_code: "SMALL", service_gas: "N2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN2", size_code: "LARGE", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_CYLINDER_SERIAL (409)"

      - name: cylinder_invalid_enum_value_rejected
        claim_type: type_constraints
        grounds:
                 - "entities.CylinderAsset.fields.size_code"
                 - "errors[ERR_INVALID_ENUM_VALUE]"
        distinguishing_aspect: "Undeclared enum member HUGE for size_code fails with ERR_INVALID_ENUM_VALUE (400), distinct from ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN3", size_code: "HUGE", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM_VALUE"

      - name: tank_missing_required_field_rejected
        claim_type: required_fields
        grounds:
                 - "entities.StorageTank"
                 - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting capacity_liters from POST /api/tanks fails at priority 3 with ERR_INVALID_REQUEST before any existence or state work."
        test_recipe:
          setup: ["One plant"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-EN4" }, as: PlantManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", initial_level_liters: 100, reorder_point_liters: 10 }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (capacity_liters missing)"

      - name: fk_reference_not_found_returns_404
        claim_type: parent_relationships
        grounds:
                 - "entities.FillLot.fields.tank_id"
                 - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "A fill lot referencing a nonexistent tank id fails existence validation with ERR_NOT_FOUND (404); no lot is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/fill-lots", payload: { tank_id: "00000000-0000-0000-0000-000000000000", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: telemetry_reading_immutable_no_version
        claim_type: immutability
        grounds:
                 - "entities.TelemetryReading"
        distinguishing_aspect: "common_fields: false — the reading response carries id and created_at but no version/updated_at, and the surface exposes no update or delete endpoint for readings."
        test_recipe:
          setup: ["One tank"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-EN6" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 4900, measured_at: "2026-08-01T00:00:00Z", source: "MANUAL_DIP" }, as: ProductionOperator, captures: { rd: $.data.id } }
          assert:
            - "TelemetryReading.${rd} response contains id and created_at but no version key (append-only)"
            - "GET /api/telemetry-readings/${rd} returns the stored reading with measured_level_liters == 4900"

      - name: tank_computed_level_input_ignored
        claim_type: computed_fields
        grounds:
                 - "entities.StorageTank.fields.current_level_liters"
        distinguishing_aspect: "Client-supplied current_level_liters on create is ignored; the computed value derives from the seeded INITIAL_LOAD reading only."
        test_recipe:
          setup: ["One plant"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-EN7" }, as: PlantManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500, current_level_liters: 1 }, as: PlantManager, captures: { t: $.data.id, lvl: $.data.current_level_liters } }
          assert:
            - "StorageTank.${t}.current_level_liters == 5000 (computed from the INITIAL_LOAD reading; client value 1 ignored)"

      - name: cylinder_list_pagination_envelope
        claim_type: listing
        grounds:
                 - "response_envelope"
                 - "endpoints"
        distinguishing_aspect: "List envelope honors limit/offset with total_count and has_more: 3 cylinders, limit 2 -> first page has 2 items, has_more true, total_count 3; offset 2 -> 1 item, has_more false."
        test_recipe:
          setup: ["Three cylinders registered"]
          setup_api_calls:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN8-A", size_code: "SMALL", service_gas: "N2", last_hydro_date: "2025-09-01" }, as: ProductionOperator }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN8-B", size_code: "SMALL", service_gas: "N2", last_hydro_date: "2025-09-01" }, as: ProductionOperator }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-EN8-C", size_code: "SMALL", service_gas: "N2", last_hydro_date: "2025-09-01" }, as: ProductionOperator }
          trigger:
            - { call: "GET /api/cylinders", as: ProductionOperator }
          assert:
            - "GET /api/cylinders?limit=2&offset=0 -> 2 items, total_count == 3, has_more == true"
            - "GET /api/cylinders?limit=2&offset=2 -> 1 item, total_count == 3, has_more == false"
            - "Default page (no params) returns all 3 with limit defaulting to 10"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: vented_lot_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
                 - "state_machines.FillLot"
                 - "errors[ERR_FILL_LOT_INVALID_STATE]"
        distinguishing_aspect: "VENTED is terminal: rework, start-fill, and recall on a vented lot all fail with ERR_FILL_LOT_INVALID_STATE and mutate nothing."
        test_recipe:
          setup: ["Lot vented from FILLING after one cylinder was assigned"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-SM1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-SM1-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/vent", payload: {}, as: ProductionOperator }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/rework", payload: {}, as: ProductionOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator, captures: { err2: $.data.error_id } }
            - { call: "POST /api/fill-lots/${lot}/recall", payload: {}, as: QualityManager, captures: { err3: $.data.error_id } }
          assert:
            - "All three triggers return ERR_FILL_LOT_INVALID_STATE"
            - "FillLot.${lot}.status remains VENTED; CylinderAsset.${c1} remains IN_STOCK"

      - name: complete_fill_from_planned_rejected
        claim_type: invalid_transition
        grounds:
                 - "state_machines.FillLot.FILLING_to_AWAITING_ANALYSIS"
                 - "errors[ERR_FILL_LOT_INVALID_STATE]"
        distinguishing_aspect: "complete-fill requires FILLING; calling it on a PLANNED lot (never started) fails with ERR_FILL_LOT_INVALID_STATE."
        test_recipe:
          setup: ["PLANNED lot with one cylinder assigned"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-SM2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-SM2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
          trigger:
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FILL_LOT_INVALID_STATE; lot remains PLANNED; tank reserved_liters == 0"

      - name: billing_run_post_before_finalize_rejected
        claim_type: invalid_transition
        grounds:
                 - "state_machines.BillingRun"
                 - "errors[ERR_BILLING_RUN_INVALID_STATE]"
        distinguishing_aspect: "post on a DRAFT run fails; finalize is mandatory before posting."
        test_recipe:
          setup: ["One DRAFT billing run"]
          setup_api_calls:
            - { call: "POST /api/billing-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-10" }, as: BillingClerk, captures: { br: $.data.id } }
          trigger:
            - { call: "POST /api/billing-runs/${br}/post", payload: {}, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BILLING_RUN_INVALID_STATE; run remains DRAFT; charge_lines empty"

      - name: rental_double_return_rejected
        claim_type: idempotency
        grounds:
                 - "state_machines.CylinderRental"
                 - "errors[ERR_RENTAL_NOT_ACTIVE]"
        distinguishing_aspect: "Returning an already-RETURNED rental fails with ERR_RENTAL_NOT_ACTIVE; the second call posts no additional charge."
        test_recipe:
          setup: ["Rental returned once already (final charge 3000 posted)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-SM4" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-SM4-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1" }
            - { call: "POST /api/customers", payload: { account_name: "C-SM4", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/rentals", payload: { customer_id: "${cu}", cylinder_id: "${c1}", daily_rate_cents: 1000, planned_days: 3 }, as: BillingClerk, captures: { r: $.data.id } }
            - { call: "POST /api/rentals/${r}/return", payload: { return_condition: "OK" }, as: BillingClerk }
          trigger:
            - { call: "POST /api/rentals/${r}/return", payload: { return_condition: "OK" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RENTAL_NOT_ACTIVE"
            - "CustomerAccount.${cu}.outstanding_balance_cents == 3000 (unchanged by the rejected second return)"

      - name: replenish_on_proposed_installation_rejected
        claim_type: precondition_enforcement
        grounds:
                 - "state_machines.ReplenishmentOrder"
                 - "errors[ERR_INSTALLATION_INVALID_STATE]"
        distinguishing_aspect: "Replenishment create requires an ACTIVE installation; PROPOSED fails with ERR_INSTALLATION_INVALID_STATE even with a fresh OCC version."
        test_recipe:
          setup: ["Installation in initial state PROPOSED"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-SM5", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/bulk-installations", payload: { customer_id: "${cu}", product_code: "O2", capacity_liters: 5000, initial_level_liters: 2000, reorder_point_liters: 400, max_order_qty_liters: 3000 }, as: PlantManager, captures: { inst: $.data.id, iv: $.data.version } }
          trigger:
            - { call: "POST /api/replenishment-orders", payload: { installation_id: "${inst}", scheduled_delivery_at: "2026-08-05T08:00:00Z", expected_installation_version: "${iv}" }, as: LogisticsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSTALLATION_INVALID_STATE (initial_state PROPOSED blocks replenishment)"

      - name: quarantine_release_returns_cylinder_to_stock
        claim_type: valid_transition
        grounds:
                 - "state_machines.CylinderAsset.QUARANTINED_to_IN_STOCK"
        distinguishing_aspect: "QualityManager release of a quarantined cylinder (failed hydro retest) returns it to IN_STOCK and clears current_fill_lot_id."
        test_recipe:
          setup: ["Cylinder QUARANTINED via a FAIL hydro retest recorded from IN_STOCK"]
          setup_api_calls:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-SM6-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/cylinders/${c1}/hydro-retests", payload: { test_date: "2026-08-01", result: "FAIL" }, as: ProductionOperator }
          trigger:
            - { call: "POST /api/cylinders/${c1}/release-quarantine", payload: {}, as: QualityManager, captures: { st: $.data.status } }
          assert:
            - "CylinderAsset.${c1}.status == QUARANTINED after the FAIL retest"
            - "After release: status == IN_STOCK and current_fill_lot_id == null"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: telemetry_late_reading_does_not_reorder
        claim_type: correct_result
        grounds:
                 - "calculations.telemetry_level_reconciliation"
        distinguishing_aspect: "Projection with late events: a reading backdated before the current latest measured_at must NOT move current_level_liters; a newer one does."
        test_recipe:
          setup: ["Tank seeded at 5000 (INITIAL_LOAD at 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CA1" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 4000, measured_at: "2026-08-01T02:00:00Z", source: "IOT_SENSOR" }, as: ProductionOperator }
          trigger:
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 4500, measured_at: "2026-08-01T01:00:00Z", source: "MANUAL_DIP" }, as: ProductionOperator }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { lvl_late: $.data.current_level_liters } }
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 4200, measured_at: "2026-08-01T03:00:00Z", source: "IOT_SENSOR" }, as: ProductionOperator }
            - { call: "GET /api/tanks/${t}", as: ProductionOperator, captures: { lvl_new: $.data.current_level_liters } }
          assert:
            - "After the 02:00 reading: level 4000"
            - "Late 01:00 reading of 4500 does NOT move the level: still 4000"
            - "Newer 03:00 reading moves it to 4200"

      - name: purity_marginal_band_then_override_releases
        claim_type: constants_applied
        grounds:
                 - "calculations.purity_result_determination"
                 - "state_machines.PurityAnalysis.RECORDED_to_OVERRIDDEN"
        distinguishing_aspect: "CO reading exactly at limit*1.5 (15 == 1.5*10) lands in MARGINAL (equality at the marginal ceiling is MARGINAL, not FAIL); the lot waits for override, which releases it as PASS_OVERRIDE."
        test_recipe:
          setup: ["Lot AWAITING_ANALYSIS with one cylinder"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CA2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CA2-A", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2025-09-01" }, as: ProductionOperator, captures: { c1: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
            - { call: "POST /api/fill-lots/${lot}/cylinders", payload: { cylinder_id: "${c1}" }, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/start-fill", payload: {}, as: ProductionOperator }
            - { call: "POST /api/fill-lots/${lot}/complete-fill", payload: { measured_residuals: [ { cylinder_id: "${c1}", residual_pressure_bar: 15 } ] }, as: ProductionOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 15 } ] }, as: LabAnalyst, as_user_id: "lab-1", captures: { an: $.data.id, res: $.data.result } }
            - { call: "POST /api/purity-analyses/${an}/override", payload: {}, as: QualityManager, as_user_id: "qm-1" }
          assert:
            - "Analysis result == MARGINAL at exactly 1.5x the CO limit; FillLot remains AWAITING_ANALYSIS until override"
            - "After override: analysis status OVERRIDDEN with result PASS_OVERRIDE; FillLot.${lot} RELEASED; CylinderAsset.${c1} FILLED"

      - name: blend_conformance_tolerance_equality_passes
        claim_type: precision
        grounds:
                 - "calculations.blend_conformance_result"
        distinguishing_aspect: "Deviation exactly equal to tolerance is OK (<=): readings 21.50/78.50 against targets 21.00/79.00 with tolerance 0.50 produce PASS and release the blend."
        test_recipe:
          setup: ["Blend AWAITING_ANALYSIS (approved, blended from O2/N2 tanks)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CA3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { tO: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "N2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { tN: $.data.id } }
            - { call: "POST /api/customers", payload: { account_name: "C-CA3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/blend-orders", payload: { customer_id: "${cu}", batch_qty_liters: 1000, components: [ { product_code: "O2", target_pct: 21.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 300 }, { product_code: "N2", target_pct: 79.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 100 } ] }, as: BillingClerk, captures: { bo: $.data.id } }
            - { call: "POST /api/blend-orders/${bo}/approve", payload: {}, as: QualityManager }
            - { call: "POST /api/blend-orders/${bo}/start-blend", payload: {}, as: ProductionOperator }
            - { call: "POST /api/blend-orders/${bo}/complete-blend", payload: {}, as: ProductionOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /api/purity-analyses", payload: { subject_type: "BLEND_ORDER", blend_order_id: "${bo}", readings: [ { product_code: "O2", actual_pct: 21.50 }, { product_code: "N2", actual_pct: 78.50 } ] }, as: LabAnalyst, as_user_id: "lab-1", captures: { res: $.data.result } }
          assert:
            - "result == PASS (deviation 0.50 == tolerance 0.50 is inside the OK band)"
            - "BlendOrder.${bo}.status == RELEASED"
            - "Tank draws: O2 tank drawn_liters == 210.0 and N2 tank drawn_liters == 790.0 (levels 4790.0 and 4210.0)"

      - name: blend_tank_selector_picks_highest_level
        claim_type: correct_result
        grounds:
                 - "state_machines.BlendOrder.APPROVED_to_BLENDING"
        distinguishing_aspect: "Selector determinism: among eligible tanks (matching product, IN_SERVICE, level >= required + 100), the highest current_level_liters wins; created_at ASC breaks ties; an empty pool yields ERR_TANK_LEVEL_TOO_LOW."
        test_recipe:
          setup: ["Two eligible O2 tanks (5000 and 3000 liters) and one N2 tank (5000); approved blend needs 210 O2 + 790 N2"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-CA4" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 3000, reorder_point_liters: 500 }, as: PlantManager, captures: { tO_low: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { tO_high: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "N2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { tN: $.data.id } }
            - { call: "POST /api/customers", payload: { account_name: "C-CA4", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/blend-orders", payload: { customer_id: "${cu}", batch_qty_liters: 1000, components: [ { product_code: "O2", target_pct: 21.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 300 }, { product_code: "N2", target_pct: 79.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 100 } ] }, as: BillingClerk, captures: { bo: $.data.id } }
            - { call: "POST /api/blend-orders/${bo}/approve", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /api/blend-orders/${bo}/start-blend", payload: {}, as: ProductionOperator }
          assert:
            - "O2 component selected_tank_id == ${tO_high} (5000 > 3000 wins by level DESC; never the id)"
            - "N2 component selected_tank_id == ${tN}"
            - "BlendOrder.${bo}.status == BLENDING"

      - name: hydro_interval_differs_by_gas
        claim_type: constants_applied
        grounds:
                 - "calculations.hydro_status_derivation"
        distinguishing_aspect: "HYDRO_INTERVAL_MONTHS is per gas: CO2 (6 months) vs O2 (12 months) on the same last_hydro_date 2026-02-01 gives due dates 2026-08-01 (DUE_SOON at default clock) vs 2027-02-01 (COMPLIANT)."
        test_recipe:
          setup: ["Empty database; clock at default 2026-08-01"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CA5-A", size_code: "STANDARD", service_gas: "CO2", last_hydro_date: "2026-02-01" }, as: ProductionOperator, captures: { co2_due: $.data.hydro_due_date, co2_hs: $.data.hydro_status } }
            - { call: "POST /api/cylinders", payload: { serial_number: "SN-CA5-B", size_code: "STANDARD", service_gas: "O2", last_hydro_date: "2026-02-01" }, as: ProductionOperator, captures: { o2_due: $.data.hydro_due_date, o2_hs: $.data.hydro_status } }
          assert:
            - "CO2 cylinder: hydro_due_date == 2026-08-01, hydro_status == DUE_SOON (due exactly today)"
            - "O2 cylinder: hydro_due_date == 2027-02-01, hydro_status == COMPLIANT"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: auth_missing_header_rejected
        claim_type: violation_to_error
        grounds:
                 - "validations[priority=1]"
                 - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1 beats everything: a request without X-User-Role to a perfectly valid endpoint fails 400 before role, existence, or state checks run."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/plants", as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: telemetry_future_dated_rejected
        claim_type: violation_to_error
        grounds:
                 - "validations[priority=11]"
                 - "errors[ERR_TELEMETRY_FUTURE_DATED]"
        distinguishing_aspect: "measured_at strictly later than the logical clock is rejected; measured_at exactly equal to the clock is accepted."
        test_recipe:
          setup: ["One tank; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-VA2" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 4900, measured_at: "2026-08-01T00:00:01Z", source: "IOT_SENSOR" }, as: ProductionOperator, captures: { err: $.data.error_id } }
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", measured_level_liters: 4900, measured_at: "2026-08-01T00:00:00Z", source: "IOT_SENSOR" }, as: ProductionOperator, captures: { rd: $.data.id } }
          assert:
            - "One second after the clock: error_id == ERR_TELEMETRY_FUTURE_DATED (422)"
            - "Exactly at the clock: accepted (201)"

      - name: telemetry_xor_violation_rejected
        claim_type: violation_to_error
        grounds:
                 - "validations[priority=3]"
                 - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Supplying both tank_id and installation_id (XOR violation) fails with ERR_INVALID_REQUEST even though each id exists."
        test_recipe:
          setup: ["One tank and one installation, both existing"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-VA3" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/customers", payload: { account_name: "C-VA3", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
            - { call: "POST /api/bulk-installations", payload: { customer_id: "${cu}", product_code: "O2", capacity_liters: 5000, initial_level_liters: 2000, reorder_point_liters: 400, max_order_qty_liters: 3000 }, as: PlantManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /api/telemetry-readings", payload: { tank_id: "${t}", installation_id: "${inst}", measured_level_liters: 100, measured_at: "2026-08-01T00:00:00Z", source: "MANUAL_DIP" }, as: ProductionOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (both polymorphic targets supplied)"

      - name: blend_component_sum_invalid_rejected
        claim_type: violation_to_error
        grounds:
                 - "validations[priority=15]"
                 - "errors[ERR_BLEND_COMPONENT_SUM_INVALID]"
        distinguishing_aspect: "Target percentages summing to 99.99 after 2dp rounding (not 100.00) are rejected; single-component blends are also rejected."
        test_recipe:
          setup: ["ACTIVE customer"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { account_name: "C-VA4", billing_variant: "CALENDAR_DAY", free_days: 0, credit_limit_cents: 100000 }, as: BillingClerk, captures: { cu: $.data.id } }
          trigger:
            - { call: "POST /api/blend-orders", payload: { customer_id: "${cu}", batch_qty_liters: 1000, components: [ { product_code: "O2", target_pct: 20.99, tolerance_pct: 0.50, unit_cost_cents_per_liter: 300 }, { product_code: "N2", target_pct: 79.00, tolerance_pct: 0.50, unit_cost_cents_per_liter: 100 } ] }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BLEND_COMPONENT_SUM_INVALID (99.99 != 100.00)"

      - name: analysis_on_planned_lot_rejected
        claim_type: violation_to_error
        grounds:
                 - "validations[priority=5]"
                 - "errors[ERR_ANALYSIS_INVALID_STATE]"
        distinguishing_aspect: "Recording an analysis for a lot that never reached AWAITING_ANALYSIS fails with ERR_ANALYSIS_INVALID_STATE; no result is persisted."
        test_recipe:
          setup: ["PLANNED lot (no cylinders, never started)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { plant_name: "P-VA5" }, as: PlantManager, captures: { p: $.data.id } }
            - { call: "POST /api/tanks", payload: { plant_id: "${p}", product_code: "O2", capacity_liters: 10000, initial_level_liters: 5000, reorder_point_liters: 500 }, as: PlantManager, captures: { t: $.data.id } }
            - { call: "POST /api/fill-lots", payload: { tank_id: "${t}", product_code: "O2", target_fill_pressure_bar: 200 }, as: ProductionOperator, captures: { lot: $.data.id } }
          trigger:
            - { call: "POST /api/purity-analyses", payload: { subject_type: "FILL_LOT", fill_lot_id: "${lot}", readings: [ { analyte: "CO", reading_ppm: 5 } ] }, as: LabAnalyst, as_user_id: "lab-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ANALYSIS_INVALID_STATE; FillLot.${lot} remains PLANNED"

      - name: priority_conflict_state_vs_safety
        claim_type: priority_ordering
        grounds:
                 - "validations[priority=5]"
                 - "validations[priority=6]"
        excluded_because:
          difficulty_instance: assign_conflict_state_beats_safety
          rationale: "Asserted as the failure path of the named §1.8 instance (state beats safety on cylinder assign)."
      - name: priority_conflict_safety_vs_temporal
        claim_type: priority_ordering
        grounds:
                 - "validations[priority=8]"
                 - "validations[priority=10]"
        excluded_because:
          difficulty_instance: dispatch_assign_conflict_safety_beats_temporal
          rationale: "Asserted as the failure path of the named §1.8 instance (safety beats temporal on assign-driver)."
      - name: priority_conflict_state_vs_fiscal
        claim_type: priority_ordering
        grounds:
                 - "validations[priority=5]"
                 - "validations[priority=16]"
        excluded_because:
          difficulty_instance: rental_conflict_state_beats_fiscal
          rationale: "Asserted as the failure path of the named §1.8 instance (state beats fiscal on rental checkout)."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: driver_completes_own_assigned_route
        claim_type: conditional_action
        grounds:
                 - "state_machines.DeliveryRoute.DISPATCHED_to_COMPLETED"
                 - "endpoints"
        distinguishing_aspect: "Entity-backed Driver role completes a DISPATCHED route where driver_id == X-User-ID; the same call by a different Driver id is denied."
        test_recipe:
          setup: ["Two drivers d1, d2; route assigned to d1 and dispatched"]
          setup_api_calls:
            - { call: "POST /api/drivers", payload: { driver_name: "D-EP1-A", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2027-01-01" }, as: LogisticsCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /api/drivers", payload: { driver_name: "D-EP1-B", cdl_class: "A", hazmat_endorsements: [ { endorsement_class: "NONFLAMMABLE_GAS", expiry_date: "2027-01-01" } ], medical_card_expiry: "2027-01-01" }, as: LogisticsCoordinator, captures: { d2: $.data.id } }
            - { call: "POST /api/routes", payload: { route_date: "2026-08-05", window_start_hour: 8, window_end_hour: 12, stops: [ { stop_name: "S1", hazmat_classes: ["NONFLAMMABLE_GAS"] } ] }, as: LogisticsCoordinator, captures: { ro: $.data.id } }
            - { call: "POST /api/routes/${ro}/assign-driver", payload: { driver_id: "${d1}" }, as: LogisticsCoordinator }
            - { call: "POST /api/routes/${ro}/dispatch", payload: {}, as: LogisticsCoordinator }
          trigger:
            - { call: "POST /api/routes/${ro}/set-status", payload: { target_status: "COMPLETED" }, as: Driver, as_user_id: "${d2}", captures: { err: $.data.error_id } }
            - { call: "POST /api/routes/${ro}/set-status", payload: { target_status: "COMPLETED" }, as: Driver, as_user_id: "${d1}", captures: { ok_route: $.data.id } }
          assert:
            - "Other driver: error_id == ERR_UNAUTHORIZED_ROLE"
            - "Assigned driver: DeliveryRoute.${ro}.status == COMPLETED"

      - name: fill_release_side_effects_visible_via_gets
        claim_type: side_effect_execution
        grounds:
                 - "state_machines.FillLot.AWAITING_ANALYSIS_to_RELEASED"
                 - "endpoints"
        excluded_because:
          difficulty_instance: fill_lot_rework_cycle_reentry
          rationale: "PASS release side effects (lot RELEASED, cylinder FILLED, last_fill_lot_id provenance) are asserted by the named §1.8 instance and by purity_marginal_band_then_override_releases."

