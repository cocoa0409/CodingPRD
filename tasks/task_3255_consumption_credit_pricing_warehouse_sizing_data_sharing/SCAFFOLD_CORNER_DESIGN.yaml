            - "GET billing-summary data.per_component.ACTIVE == 231.00"
            - "GET billing-summary data.per_component.FAIL_SAFE == 60.60"
            - "StorageUsageRecord.${sur_rt}.billable_storage_tb == 17.0, so the volume still counts the unretained terabyte"
      - name: bulk_replication_sweep_reports_per_configuration_outcomes
        claim_type: Correct Result
        grounds:
          - calculations.replication_transfer_cost
          - entities.ReplicationConfiguration.fields.replication_state
        distinguishing_aspect: "A sweep over several configurations is best-effort rather than transactional, so a failed region and a succeeded region coexist and each keeps its own state and cost."
        test_recipe:
          setup: ["one account with two replication configurations in different regions"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Calc Bulk", account_locator: "cb2114", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_bk: $.data.id }
            - call: "POST /v1/replication-configurations"
              payload: { account_id: "${acct_bk}", name: "REPL_BK_A", target_region: "us-west-2", target_cloud: "SAME_CLOUD", replicated_tb: 2.0 }
              as: DataEngineer
              captures: { repl_bk_a: $.data.id }
            - call: "POST /v1/replication-configurations"
              payload: { account_id: "${acct_bk}", name: "REPL_BK_B", target_region: "ap-southeast-1", target_cloud: "CROSS_CLOUD", replicated_tb: 2.0 }
              as: DataEngineer
              captures: { repl_bk_b: $.data.id }
          trigger:
            - call: "POST /v1/replication-configurations/${repl_bk_a}/refresh"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/replication-configurations/${repl_bk_b}/refresh"
              payload: {}
              as: DataEngineer
          assert:
            - "ReplicationConfiguration.${repl_bk_a}.transfer_cost_dollars == 11.0"
            - "ReplicationConfiguration.${repl_bk_b}.transfer_cost_dollars == 17.55"
            - "both configurations are REFRESHED and neither refresh rolled back the other"
            - "Account.${acct_bk}.account_dollars_balance == 28.55"
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 fires before resource resolution, so a request with no role header is rejected as unauthenticated even when the path id is also unknown."
        test_recipe:
          setup: ["no resources exist"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Auth", account_locator: "ca2115", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_au: $.data.id }
          trigger:
            - call: "GET /v1/warehouses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3"
              payload: {}
              as: Anonymous
              captures: { err_au: $.data.error_id }
          assert:
            - "${err_au} == ERR_UNAUTHENTICATED"
            - "the same request with a valid role header instead returns ERR_RESOURCE_NOT_FOUND, so priority 1 precedes priority 3"
      - name: publisher_role_cannot_activate_contract
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "The share publisher role is not on the activate endpoint's role list, so the attempt is a 403 and not a state error."
        test_recipe:
          setup: ["one DRAFT contract"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Role", account_locator: "cr2116", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_ro: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_ro}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_ro: $.data.id }
          trigger:
            - call: "POST /v1/capacity-contracts/${ct_ro}/activate"
              payload: {}
              as: DataEngineer
              captures: { err_ro: $.data.error_id }
          assert:
            - "${err_ro} == ERR_FORBIDDEN_ROLE"
            - "CapacityContract.${ct_ro}.status == DRAFT"
      - name: priority_nine_beats_budget_range_on_over_allowance
        claim_type: Satisfaction to Pass
        grounds:
          - validations[priority=9]
          - errors[ERR_CONTRACT_CREDIT_EXHAUSTED]
        distinguishing_aspect: "The allowance ceiling is checked before any allocation, so a drawdown that would breach the ceiling leaves drawn_credits exactly where it was."
        test_recipe:
          setup: ["one ACTIVE contract with base 1000 and rollover cap 200, already drawn to 1150"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Ceiling", account_locator: "cc2117", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_cl: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_cl}", name: "WH_CL", size: "SMALL", auto_suspend_seconds: 600 }
              as: DataEngineer
              captures: { wh_cl: $.data.id }
            - call: "POST /v1/capacity-contracts"
              payload: { account_id: "${acct_cl}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", base_credits: 1000, overage_rate_per_credit: 3.00, rollover_cap_credits: 200, currency: "USD" }
              as: FinanceController
              captures: { ct_cl: $.data.id }
            - call: "POST /v1/capacity-contracts/${ct_cl}/activate"
              payload: {}
              as: FinanceController
          trigger:
            - call: "GET /v1/capacity-contracts/${ct_cl}"
              payload: {}
              as: FinanceController
              captures: { ct_cl_v: $.data.version }
            - call: "POST /v1/credit-drawdowns"
              payload: { contract_id: "${ct_cl}", warehouse_id: "${wh_cl}", amount_credits: 700, source_kind: "SESSION", idempotency_key: "cl-700", expected_contract_version: "${ct_cl_v}" }
              as: DataEngineer
              captures: { err_cl: $.data.error_id }
          assert:
            - "${err_cl} == ERR_CONTRACT_CREDIT_EXHAUSTED"
            - "CapacityContract.${ct_cl}.drawn_credits == 0.0 and drawdown_count == 0"
            - "GET /v1/credit-drawdowns?contract_id=${ct_cl} returns total_count 0"
      - name: duplicate_warehouse_name_within_account_is_refused
        claim_type: Violation to Error
        grounds:
          - validations[priority=12]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Name uniqueness is scoped to the owning account, so the same name is refused inside one account and accepted in another."
        test_recipe:
          setup: ["two accounts, one warehouse named WH_DUP in the first"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Dup A", account_locator: "cd2118", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_da: $.data.id }
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Dup B", account_locator: "cd2119", cloud_provider: "SAME_CLOUD", region: "us-east-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_db: $.data.id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_da}", name: "WH_DUP", size: "SMALL" }
              as: DataEngineer
          trigger:
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_da}", name: "WH_DUP", size: "LARGE" }
              as: DataEngineer
              captures: { err_da: $.data.error_id }
            - call: "POST /v1/warehouses"
              payload: { account_id: "${acct_db}", name: "WH_DUP", size: "LARGE" }
              as: DataEngineer
          assert:
            - "${err_da} == ERR_DUPLICATE_RESOURCE"
            - "GET /v1/warehouses?account_id=${acct_da} returns total_count 1"
            - "the same name in ${acct_db} was accepted, so uniqueness is account-scoped"
      - name: same_region_replication_target_is_refused
        claim_type: Violation to Error
        grounds:
          - validations[priority=23]
          - errors[ERR_REPLICATION_REGION_INVALID]
        distinguishing_aspect: "A target region equal to the account's own region is a reference-semantics failure rather than a range failure, so it returns the region error and not a 400."
        test_recipe:
          setup: ["one account in eu-central-1"]
          setup_api_calls:
            - call: "POST /v1/accounts"
              payload: { org_name: "Corp Region", account_locator: "cr2120", cloud_provider: "SAME_CLOUD", region: "eu-central-1", monitor_scope: "ACCOUNT_ONLY" }
              as: PlatformOperator
              captures: { acct_rg: $.data.id }
          trigger:
            - call: "POST /v1/replication-configurations"
              payload: { account_id: "${acct_rg}", name: "REPL_RG", target_region: "eu-central-1", target_cloud: "SAME_CLOUD", replicated_tb: 1.0 }
              as: DataEngineer
              captures: { err_rg: $.data.error_id }
          assert:
            - "${err_rg} == ERR_REPLICATION_REGION_INVALID"
            - "the same body against ap-southeast-1 succeeds, isolating the region check"
            - "GET /v1/replication-configurations?account_id=${acct_rg} returns total_count 0"
      - name: free_listing_payout_is_not_payable
        claim_type: Violation to Error
        grounds:
          - validations[priority=20]
          - errors[ERR_FREE_LISTING_NOT_PAYABLE]
        distinguishing_aspect: "The payable-pricing check is a distinct error from the published-state check, so a FREE listing that is PUBLISHED still cannot produce a payout."
        test_recipe:
