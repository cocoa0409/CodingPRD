              payload: { chapter_id: "${ch_id}", full_name: "Owen Diaz", email: "owen@example.org" }
              as: WishCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id }
