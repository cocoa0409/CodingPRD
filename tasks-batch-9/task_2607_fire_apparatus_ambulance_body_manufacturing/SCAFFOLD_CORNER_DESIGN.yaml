            - call: "POST /specifications/${spec1_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
          assert:
            - "${e_empty} == ERR_SPEC_HAS_NO_CLAUSES with HTTP 422 and BidSpecification.${spec1_id}.status is still \"DRAFT\" with version 1"
            - "${e_dup} == ERR_DUPLICATE_CLAUSE_CODE with HTTP 409; clause_count stays 1"
            - "the same code on ${spec2_id} is 201 (${c1b_id}) — uniqueness is per specification, not per program"
            - "the second submit-review is 200 with BidSpecification.${spec1_id}.status == \"UNDER_REVIEW\""
            - "GET /clauses?specification_id=${spec1_id} returns total_count == 1 — the duplicate never persisted"

