  # ===========================================================================
  # Cross-cutting complexity layers - one row per declared layer of
  # complexity_profile.complexity_layers. optimistic_concurrency is exercised
  # on both of its parents (RankList and InterviewWave, two error ids at the
  # same priority); the other three layers are owned outright by §1.8.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_expected_rank_list_version_is_refused_and_the_refreshed_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.rank-list-entry-stale-version
          - errors.ERR_STALE_RANK_LIST_VERSION
          - validations.priority 6
        distinguishing_aspect: >
          The first entry consumed version 1 and bumped the list to version 2, so replaying version 1 is
          412 ERR_STALE_RANK_LIST_VERSION - a distinct status from every other failure mode in this API - and
          the rejected attempt writes nothing: entry_count stays 1. Re-reading the list and resending with
          the current version then succeeds with the same body, which shows the refusal was about staleness
          alone.
        test_recipe:
          setup:
            - "a DRAFT rank list holding one entry, and a second application to rank"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
