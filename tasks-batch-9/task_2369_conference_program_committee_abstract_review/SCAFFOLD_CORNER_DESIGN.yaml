              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "GEN", name: "General Oncology", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: false }
              as: ConferenceAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /authors"
