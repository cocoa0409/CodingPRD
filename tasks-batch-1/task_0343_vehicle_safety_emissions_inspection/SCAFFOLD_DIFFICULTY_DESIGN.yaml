# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids × 2 instances = 18 instances. Every grounds[] ref resolves to a
# declared element; every setup_api_calls/trigger call resolves to a §1.5 endpoint.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: repair_spend_documented_only_vs_documented_plus_estimated
        grounds:
          - calculations.compute_qualifying_repair_spend
          - entities.RepairOrder.fields.documented_cost_cents
          - entities.RepairOrder.fields.estimated_cost_cents
          - entities.WaiverRequest.fields.cost_basis
          - validations[priority=15]
        distinguishing_aspect: >-
          On the SAME set of VERIFIED emissions RepairOrders (documented 55000, estimated 10000,
          limit 60000), the DOCUMENTED_ONLY basis yields 55000 (below limit, waiver denied) while
          DOCUMENTED_PLUS_ESTIMATED yields 65000 (at/over limit, waiver approvable) — divergent
          results on the RepairOrder/WaiverRequest domain.
        test_recipe:
          setup:
            - "Station ZZ with repair_cost_limit_cents=60000, PASSENGER profile obd_required=true checklist_item_count=2."
            - "A PASSENGER record that has FAILED on emissions (MIL on)."
            - "Two VERIFIED emissions-related RepairOrders: #1 documented 30000, #2 documented 25000 + estimated 10000."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "ZZ Station", state_code: "ZZ", certificate_serial_prefix: "ZZ-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
              captures: { prof_id: $.data.id }
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "PASS" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 3, readiness_monitors_incomplete: 0, mil_on: true }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
            - call: "POST /repair-orders"
              payload: { record_id: "${rec_id}", shop_name: "Acme Auto", documented_cost_cents: 30000, estimated_cost_cents: 0, emissions_related: true }
              as: Receptionist
              captures: { ro1_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { record_id: "${rec_id}", shop_name: "Beta Auto", documented_cost_cents: 25000, estimated_cost_cents: 10000, emissions_related: true }
              as: Receptionist
              captures: { ro2_id: $.data.id }
            - call: "POST /repair-orders/${ro1_id}/verify"
              payload: {}
              as: StationManager
            - call: "POST /repair-orders/${ro2_id}/verify"
              payload: {}
              as: StationManager
          trigger:
            - call: "GET /inspection-records/${rec_id}/waiver-eligibility"
              payload: {}
              as: StationManager
              captures: { doc_only: $.data.documented_only_spend_cents, doc_est: $.data.documented_plus_estimated_spend_cents }
          assert:
            - "waiver-eligibility.documented_only_spend_cents == 55000"
            - "waiver-eligibility.documented_plus_estimated_spend_cents == 65000"
            - "waiver-eligibility.eligible_documented_only == false"
            - "waiver-eligibility.eligible_documented_plus_estimated == true"

      - name: inspection_fee_full_vs_free_first_reinspection
        grounds:
          - calculations.compute_inspection_fee
          - entities.InspectionRecord.fields.fee_cents
          - entities.InspectionRecord.fields.reinspection_index
          - state_machines.InspectionRecord.IN_PROGRESS_to_PASSED
          - state_machines.InspectionRecord.FAILED_to_IN_PROGRESS
        distinguishing_aspect: >-
          The original PASSENGER+OBD inspection freezes fee_cents=3700 (2500+1000+200), but the
          first reinspection (reinspection_index==1) within the 30-day window freezes fee_cents=200
          (service waived, only state env fee) — divergent results on the InspectionRecord domain,
          a different entity than dual-variant instance #1.
        test_recipe:
          setup:
            - "PASSENGER+OBD station/profile (base 2500, window 30d), clock at 2026-06-10T09:00:00Z."
            - "An original record that FAILED (safety FAIL on one checklist item), then a reinspection record opened the same day."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "FF Station", state_code: "FF", certificate_serial_prefix: "FF-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt1_id}" }
              as: Inspector
              captures: { rec1_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec1_id}", item_code: "BRAKES", outcome: "FAIL", severity: "MAJOR" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec1_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec1_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec1_id}/decide"
              payload: {}
              as: Inspector
              captures: { rec1_fee: $.data.fee_cents }
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T10:30:00Z" }
              as: Receptionist
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt2_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records/${rec1_id}/reinspect"
              payload: { reinspection_appointment_id: "${appt2_id}" }
              as: Inspector
              captures: { rec2_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec2_id}", item_code: "BRAKES", outcome: "PASS" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec2_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec2_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
          trigger:
            - call: "POST /inspection-records/${rec2_id}/decide"
              payload: {}
              as: Inspector
              captures: { rec2_fee: $.data.fee_cents, rec2_idx: $.data.reinspection_index, rec2_status: $.data.status }
          assert:
            - "InspectionRecord.${rec1_id}.fee_cents == 3700"
            - "InspectionRecord.${rec2_id}.reinspection_index == 1"
            - "InspectionRecord.${rec2_id}.fee_cents == 200"
            - "InspectionRecord.${rec2_id}.status == PASSED"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: inspection_fee_three_input_nonlinear_branching
        grounds:
          - calculations.compute_inspection_fee
          - entities.VehicleClassProfile.fields.base_fee_cents
          - entities.VehicleClassProfile.fields.obd_required
          - entities.VehicleClassProfile.fields.reinspection_window_days
          - entities.InspectionRecord.fields.reinspection_index
        distinguishing_aspect: >-
          MODE (a): fee depends on >=3 inputs with conditional branches on entity state — base_fee_cents,
          obd_required (adds 1000), and the reinspection_index × window threshold (waives service) — a
          MOTORCYCLE (no OBD, base 1500) PASSED record freezes 1700 (1500+0+200), not 3700.
        test_recipe:
          setup:
            - "Station with MOTORCYCLE profile obd_required=false base 1500 checklist_item_count=1."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "MC Station", state_code: "MC", certificate_serial_prefix: "MC-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "MOTORCYCLE", base_fee_cents: 1500, obd_required: false, checklist_item_count: 1, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: false, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "JH2SC82A4MM100001", vehicle_class: "MOTORCYCLE", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:20:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "PASS" }
              as: Inspector
          trigger:
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
              captures: { fee: $.data.fee_cents, emi: $.data.emissions_result, status: $.data.status }
          assert:
            - "InspectionRecord.${rec_id}.emissions_result == NOT_APPLICABLE"
            - "InspectionRecord.${rec_id}.fee_cents == 1700"
            - "InspectionRecord.${rec_id}.status == PASSED"

      - name: state_surcharge_round_per_line_then_sum
        grounds:
          - calculations.compute_state_surcharge
          - calculations.compute_batch_totals
          - entities.StateReportLine.fields.fee_cents
          - entities.StateReportBatch.fields.total_reported_fee_cents
          - endpoints.GET /inspection-records/{id}/state-surcharge
        distinguishing_aspect: >-
          MODE (b): rounding order is pinned to round-per-line-then-sum. Two lines with fee 3700
          (service 3500 -> 263) and 1700 (service 1500 -> 113) sum to 376, whereas sum-then-round
          (5000*0.075=375) would give 375; the per-record GET returns 263 for the 3700-fee line.
        test_recipe:
          setup:
            - "A PASSENGER+OBD PASSED record with fee 3700 at station SR."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "SR Station", state_code: "SR", certificate_serial_prefix: "SR-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "PASS" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
          trigger:
            - call: "GET /inspection-records/${rec_id}/state-surcharge"
              payload: {}
              as: StationManager
              captures: { svc: $.data.service_portion_cents, sur: $.data.state_surcharge_cents }
          assert:
            - "state-surcharge.service_portion_cents == 3500"
            - "state-surcharge.state_surcharge_cents == 263"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_record_failed_to_in_progress_reinspection_cycle
        grounds:
          - state_machines.InspectionRecord.FAILED_to_IN_PROGRESS
          - state_machines.InspectionRecord.IN_PROGRESS_to_FAILED
          - entities.InspectionRecord.fields.original_record_id
          - entities.InspectionRecord.fields.reinspection_index
        distinguishing_aspect: >-
          CYCLE on InspectionRecord: a FAILED record returns to IN_PROGRESS via reinspect on a fresh
          record (reinspection_index increments 0 -> 1), a genuine revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "A PASSENGER+OBD record that FAILED on safety; a CHECKED_IN reinspection appointment exists."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "CY Station", state_code: "CY", certificate_serial_prefix: "CY-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt1_id: $.data.id }
            - call: "POST /appointments/${appt1_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt1_id}" }
              as: Inspector
              captures: { rec1_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec1_id}", item_code: "BRAKES", outcome: "FAIL", severity: "CRITICAL" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec1_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec1_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec1_id}/decide"
              payload: {}
              as: Inspector
              captures: { rec1_status: $.data.status }
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T10:30:00Z" }
              as: Receptionist
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt2_id}/check-in"
              payload: {}
              as: Receptionist
          trigger:
            - call: "POST /inspection-records/${rec1_id}/reinspect"
              payload: { reinspection_appointment_id: "${appt2_id}" }
              as: Inspector
              captures: { rec2_id: $.data.id, rec2_idx: $.data.reinspection_index, rec2_status: $.data.status, rec2_orig: $.data.original_record_id }
          assert:
            - "InspectionRecord.${rec1_id}.status == FAILED"
            - "InspectionRecord.${rec2_id}.status == IN_PROGRESS"
            - "InspectionRecord.${rec2_id}.reinspection_index == 1"
            - "InspectionRecord.${rec2_id}.original_record_id == ${rec1_id}"

      - name: state_report_batch_rejected_to_open_reopen_cycle
        grounds:
          - state_machines.StateReportBatch.REJECTED_to_OPEN
          - state_machines.StateReportBatch.SUBMITTED_to_REJECTED
          - state_machines.StateReportBatch.OPEN_to_SUBMITTED
          - entities.StateReportBatch.fields.status
        distinguishing_aspect: >-
          CYCLE on StateReportBatch (a different entity than instance #1): OPEN -> SUBMITTED -> REJECTED
          -> OPEN via reopen, a branching submit/reject revision loop returning the batch to editable.
        test_recipe:
          setup:
            - "A station SB with one terminal (FAILED) record attached as a line to an OPEN batch."
          setup_api_calls:
            - call: "POST /stations"
              payload: { name: "SB Station", state_code: "SB", certificate_serial_prefix: "SB-", repair_cost_limit_cents: 60000, analyzer_count: 1 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /vehicle-class-profiles"
              payload: { station_id: "${st_id}", vehicle_class: "PASSENGER", base_fee_cents: 2500, obd_required: true, checklist_item_count: 2, reinspection_window_days: 30 }
              as: StationManager
            - call: "POST /lanes"
              payload: { station_id: "${st_id}", lane_number: 1, supports_obd: true, turnaround_buffer_minutes: 0 }
              as: StationManager
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StationManager
            - call: "POST /appointments"
              payload: { lane_id: "${lane_id}", vehicle_vin: "1HGCM82633A004352", vehicle_class: "PASSENGER", kind: "WALK_IN", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T09:30:00Z" }
              as: Receptionist
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Receptionist
            - call: "POST /inspection-records"
              payload: { appointment_id: "${appt_id}" }
              as: Inspector
              captures: { rec_id: $.data.id }
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "BRAKES", outcome: "FAIL", severity: "MAJOR" }
              as: Inspector
            - call: "POST /checklist-results"
              payload: { record_id: "${rec_id}", item_code: "LIGHTS", outcome: "PASS" }
              as: Inspector
            - call: "POST /emissions-tests"
              payload: { record_id: "${rec_id}", protocol: "OBD2_CAN", dtc_count: 0, readiness_monitors_incomplete: 0, mil_on: false }
              as: Inspector
            - call: "POST /inspection-records/${rec_id}/decide"
              payload: {}
              as: Inspector
            - call: "POST /state-report-batches"
              payload: { station_id: "${st_id}", period_label: "2026-06" }
              as: StationManager
              captures: { batch_id: $.data.id }
            - call: "POST /state-report-batches/${batch_id}/lines"
              payload: { record_id: "${rec_id}" }
              as: StationManager
              captures: { batch_v_after_attach: $.data.version }
            - call: "POST /state-report-batches/${batch_id}/submit"
              payload: { expected_batch_version: "${batch_v_after_attach}" }
              as: StationManager
              captures: { batch_v_after_submit: $.data.version }
            - call: "POST /state-report-batches/${batch_id}/decide"
              payload: { decision: "REJECT" }
              as: StateAuditor
              captures: { batch_status_rejected: $.data.status }
          trigger:
            - call: "POST /state-report-batches/${batch_id}/reopen"
              payload: {}
              as: StationManager
              captures: { batch_status_reopened: $.data.status }
          assert:
            - "StateReportBatch.${batch_id}.status == OPEN"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reinspect_passed_head_voids_certificate_then_revokes_sticker
        grounds:
          - state_machines.InspectionRecord.PASSED_to_IN_PROGRESS
          - state_machines.Certificate.ACTIVE_to_VOID
          - entities.Certificate.fields.status
          - entities.Certificate.fields.sticker_number
        distinguishing_aspect: >-
          DEPTH 3 from trigger POST /inspection-records/{id}/reinspect on a PASSED head: LINK1 supersede
          the PASSED chain-head record (version bump) -> LINK2 (caused by the supersession) the head's
          ACTIVE Certificate transitions ACTIVE->VOID -> LINK3 (caused by the VOID) the sticker is
          surrendered; each link is caused by the previous, not by the raw reinspect action.
        test_recipe:
