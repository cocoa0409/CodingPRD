        distinguishing_aspect: "Approving a filing increments Contract.version by 1 (bubble-up ledger sync): the parent's version observed before and after the approval differs by exactly 1."
        test_recipe:
          setup:
            - "ACTIVE contract; season; room class; REGISTERED study; filing F in UNDER_REVIEW. Contract version captured before approval."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
            - *df_room
            - *df_study
            - *df_getc
            - *df_filing
            - *df_rev
            - &bu_pre
              call: "GET /contracts/${c_id}"
              payload: {}
              as: AgencyRateAnalyst
              captures: { v_pre: $.data.version }
          trigger:
            - call: "POST /contracts/${c_id}/rate-filings/${f_id}/approve"
              payload: {}
              as: AgencyRateAnalyst
            - call: "GET /contracts/${c_id}"
              payload: {}
              as: AgencyRateAnalyst
              captures: { v_post: $.data.version }
          assert:
            - "v_post == v_pre + 1 (bubble-up side effect)"
            - "RateFiling.${f_id}.status == APPROVED and effective_date == 2027-06-01T00:00:00Z"

