              as: Caseworker
              as_user_id: "${cw_id}"
              captures: { child_w: $.data.id }
            - call: "POST /case-plans"
              payload: { case_id: "${case_w}", required_visits_per_month: 4, objectives_total: 5 }
              as: Caseworker
