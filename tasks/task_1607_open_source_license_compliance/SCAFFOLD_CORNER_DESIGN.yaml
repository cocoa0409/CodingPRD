                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_comp_id: "$.data.id"
                prod_comp_v: "$.data.version"
            - call: "POST /oss-products/${prod_comp_id}/dependency-scans"
              payload:
