scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: score_scaling_provisional_vs_equated
        grounds:
          - calculations.provisional_scaled_score
          - calculations.equated_final_scaled_score
          - entities.ScoreRecord.fields.provisional_scaled_score
          - entities.ScoreRecord.fields.scaled_score
        distinguishing_aspect: |
          ScoreRecord domain: two valid scoring algorithms over identical raw
          input produce different integers — provisional (per-section rounded
          sum, no equating) yields 97 where the equated final (session-mean
          adjusted) yields 91 for raws [33,21,40]. Paired with the
          CenterAudit-domain dual variant, this satisfies the
          different-entity-domain clause.
        test_recipe:
          setup:
            - "AUTHORIZED center with manager+proctor staff, a PUBLISHED session 2026-10-10 08:00-12:00 seats 10, two examinees registered CONFIRMED, both ADMITTED after check-in, session ADMINISTERED, scores entered: A raws [33,21,40] prior 80, B raws [40,40,40] prior 100"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center DV", facility_seat_capacity: 40, equipment_list: ["computers", "cameras"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr A", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc A", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 10, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex A", date_of_birth: "2000-01-15", id_document_type: "PASSPORT", id_document_number: "PAAA", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v1: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v1}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex B", date_of_birth: "1999-03-20", id_document_type: "NATIONAL_ID", id_document_number: "NBBB", id_document_expiry: "2028-01-01" }
              as: ProgramAdmin
              captures: { ex_b: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v2: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_b}", expected_session_version: "${s_v2}" }
              as: Examinee
              as_user_id: "${ex_b}"
              captures: { r_b: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PAAA", id_document_expiry: "2027-06-01", biometric_sample: "bio-a" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/registrations/${r_b}/check-in"
              payload: { id_document_number: "NBBB", id_document_expiry: "2028-01-01", biometric_sample: "bio-b" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/administer"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/score-entry"
              payload: { section_raws: [33, 21, 40], prior_best_scaled_score: 80, matched_responses_count: 0, total_scored_items: 40, same_form: true, adjacent_seated: false }
              as: ScoreAnalyst
              captures: { sc_a: $.data.id }
            - call: "POST /ets/registrations/${r_b}/score-entry"
              payload: { section_raws: [40, 40, 40], prior_best_scaled_score: 100, matched_responses_count: 0, total_scored_items: 40, same_form: true, adjacent_seated: false }
              as: ScoreAnalyst
              captures: { sc_b: $.data.id }
          trigger:
            - call: "POST /ets/score-analysis/run"
              payload: { session_id: "${s_id}" }
              as: ScoreAnalyst
              as_user_id: "analyst-1"
          assert:
            - "ScoreRecord.${sc_a}.provisional_scaled_score == 97"
            - "ScoreRecord.${sc_a}.scaled_score == 91  (97 + floor(0.5*(94-107.00)+0.5) = 97 - 6)"
            - "ScoreRecord.${sc_b}.provisional_scaled_score == 120"
            - "ScoreRecord.${sc_b}.scaled_score == 127  (120 + floor(0.5*(120-107.00)+0.5) = 120 + 7)"
            - "ScoreRecord.${sc_a}.provisional_scaled_score != ScoreRecord.${sc_a}.scaled_score (97 != 91 for identical raw input)"
            - "ScoreRecord.${sc_a}.status == RELEASED and ScoreRecord.${sc_b}.status == RELEASED"

      - name: audit_scoring_announced_vs_unannounced
        grounds:
          - calculations.audit_compliance_score
          - entities.CenterAudit.fields.compliance_score
          - entities.CenterAudit.fields.outcome
        distinguishing_aspect: |
          CenterAudit domain (distinct from the ScoreRecord domain of
          score_scaling_provisional_vs_equated): identical findings (1,1,2,0)
          yield compliance_score 82 / outcome PASSED under the ANNOUNCED
          variant but 73 / FAILED under the UNANNOUNCED 1.5x variant, so the
          variant choice flips the center's authorization.
        test_recipe:
          setup:
            - "two APPLIED centers, each with one scheduled audit of a different audit_type"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center AN", facility_seat_capacity: 30, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_an: $.data.id }
            - call: "POST /ets/test-centers"
              payload: { name: "Center UN", facility_seat_capacity: 30, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_un: $.data.id }
            - call: "POST /ets/test-centers/${c_an}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_an: $.data.id }
            - call: "POST /ets/test-centers/${c_un}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "UNANNOUNCED" }
              as: ProgramAdmin
              captures: { a_un: $.data.id }
          trigger:
            - call: "POST /ets/audits/${a_an}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/audits/${a_un}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
          assert:
            - "CenterAudit.${a_an}.compliance_score == 82  (100 - (5+7+6))"
            - "CenterAudit.${a_an}.outcome == PASSED"
            - "CenterAudit.${a_un}.compliance_score == 73  (100 - round_half_up(1.5*18) = 100 - 27)"
            - "CenterAudit.${a_un}.outcome == FAILED"
            - "TestCenter.${c_an}.authorization_status == AUTHORIZED"
            - "TestCenter.${c_un}.authorization_status == APPLIED (FAILED on a never-authorized center does not suspend)"

  - rule_id: combinatorial_formula
    instances:
      - name: rounding_order_per_section_then_sum
        grounds:
          - calculations.provisional_scaled_score
          - entities.ScoreRecord.fields.provisional_scaled_score
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-section-then-sum.
          Raws [33,21,40] MUST give 97 (40+17+40); the rejected sum-then-round
          order would give 96 (round_half_up(96.4)). The two orders differ by a
          full point on the same input.
        test_recipe:
          setup:
            - "AUTHORIZED center, PUBLISHED session 2026-10-10, one examinee CONFIRMED then ADMITTED, session ADMINISTERED"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center RB", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
              captures: { a_id: $.data.id }
            - call: "POST /ets/audits/${a_id}/complete"
              payload: { facility_findings: 1, staffing_findings: 1, equipment_findings: 2, high_severity_findings: 0 }
              as: Auditor
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Mgr RB", staff_role: "CENTER_MANAGER", certification_level: "ADVANCED" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/staff"
              payload: { full_name: "Proc RB", staff_role: "PROCTOR", certification_level: "BASIC" }
              as: ProgramAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/sessions"
              payload: { test_date: "2026-10-10", start_time: "08:00", end_time: "12:00", room_label: "R1", total_seats: 5, reserved_accommodation_seats: 0 }
              as: ProgramAdmin
              captures: { s_id: $.data.id }
            - call: "POST /ets/sessions/${s_id}/publish"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/examinees"
              payload: { full_name: "Ex RB", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PRB1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
              payload: { examinee_id: "${ex_a}", expected_session_version: "${s_v}" }
              as: Examinee
              as_user_id: "${ex_a}"
              captures: { r_a: $.data.id }
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T07:45:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/lock"
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /ets/registrations/${r_a}/check-in"
              payload: { id_document_number: "PRB1", id_document_expiry: "2027-06-01", biometric_sample: "bio-rb" }
              as: Proctor
              as_user_id: "${pro_id}"
            - call: "POST /ets/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ets/sessions/${s_id}/administer"
              as: CenterManager
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /ets/registrations/${r_a}/score-entry"
              payload: { section_raws: [33, 21, 40], prior_best_scaled_score: 80, matched_responses_count: 0, total_scored_items: 40, same_form: true, adjacent_seated: false }
              as: ScoreAnalyst
              captures: { sc_a: $.data.id }
          assert:
            - "ScoreRecord.${sc_a}.provisional_scaled_score == 97  (round_half_up(39.6)+round_half_up(16.8)+round_half_up(40.0) = 40+17+40)"
            - "ScoreRecord.${sc_a}.provisional_scaled_score != 96  (sum-then-round rejected order gives round_half_up(96.4))"
            - "ScoreRecord.${sc_a}.raw_total == 94"

      - name: similarity_weighted_nonlinear_threshold
        grounds:
          - calculations.response_similarity_index
          - entities.ScoreReviewCase.fields.trigger_reason
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear conditional interaction —
          matched/total is scaled by a state-dependent form factor and an
          adjacency factor, then conjunctively gated by MIN_MATCHED_ITEMS.
          34/40 same-form adjacent lands exactly on 0.85 and flags; 33/40
          (0.825) does not. A different mode than the rounding-order instance.
        test_recipe:
          setup:
            - "AUTHORIZED center, PUBLISHED session 2026-10-10, two examinees ADMITTED, session ADMINISTERED; score A raws [10,10,10] with matched 34/40 same-form adjacent, score B raws [20,20,20] with matched 33/40 same-form adjacent; priors set to the computed equated scores (23 and 68) so gains are zero"
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center SM", facility_seat_capacity: 20, equipment_list: ["computers"] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /ets/test-centers/${c_id}/audits"
              payload: { scheduled_date: "2026-09-05", audit_type: "ANNOUNCED" }
              as: ProgramAdmin
