  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_overlap_no_buffer_closed_open
        grounds:
          - validations[priority=12]
          - errors[ERR_TECH_DOUBLE_BOOKED]
          - entities.Technician.fields.id
          - entities.ServiceType.fields.duration_minutes
        distinguishing_aspect: |
          Technician interval semantics: closed-open [start, start+duration) with NO
          buffer. A second booking starting exactly at the first's end (10:30 when
          first ran 10:00-10:30) is ALLOWED for the technician (adjacency permitted);
          an overlapping 10:15 start is rejected ERR_TECH_DOUBLE_BOOKED. Tests the
          overlapping-start rejection.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; one tech, two rooms (so room overlap does not mask tech overlap); a 30-min WALK_IN booking at 10:00 on room1."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Techoverlap", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Leg", duration_minutes: 30, list_price_cents: 4000, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room 1" }
              as: StudioAdmin
              captures: { room1_id: $.data.id, room1_v: $.data.version }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room 2" }
              as: StudioAdmin
              captures: { room2_id: $.data.id, room2_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Tess", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Tana", email: "tana@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room1_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room1_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room2_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:15:00Z", payment_method: "WALK_IN", expected_room_version: "${room2_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_TECH_DOUBLE_BOOKED"

      - name: room_overlap_buffer_inclusive_adjacency_blocked
        grounds:
          - validations[priority=13]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - entities.Room.fields.id
          - entities.ServiceType.fields.buffer_minutes
        distinguishing_aspect: |
          Room interval semantics differ from technician: room window is
          buffer-inclusive [start, start+duration+buffer). With a 5-minute buffer,
          a first 10:00-10:30 booking holds room until 10:35; a second booking on the
          SAME room+different tech starting 10:30 (allowed for technician) is REJECTED
          for the room ERR_ROOM_DOUBLE_BOOKED because 10:30 < 10:35 buffer end.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; one room, two certified techs; a 30-min booking 10:00-10:30 (buffer 5) on the room with tech1."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Roomoverlap", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Side", duration_minutes: 30, list_price_cents: 3300, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room Only" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Ty1", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Ty2", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech2_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Roma", email: "roma@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech1_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v0}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res1_id: $.data.id, room_v1: $.data.version }
          trigger:
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech2_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:30:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v1}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_ROOM_DOUBLE_BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: timely_credit_cancel_conserves_credit_pool
        grounds:
          - state_machines.Reservation.UNSETTLED_to_CREDIT_HELD
          - state_machines.Reservation.CREDIT_HELD_to_REFUNDED
          - calculations.membership_credit_balance
          - entities.CreditLedgerEntry.fields.delta_credits
        distinguishing_aspect: |
          Conserved quantity #1 = total credit pool = credit_balance + sum(credits_held
          on non-terminal CREDIT reservations). A CREDIT booking (DEBIT -1) followed by
          a timely cancel (REFUND +1) leaves the pool unchanged: credit_balance returns
          to its pre-booking value 8 and no credit leaks. Invariant:
          credit_balance_after_refund == credit_balance_before_booking.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; ACTIVE PLUS membership 8 credits; one CREDIT reservation BOOKED for 2026-06-25T10:00:00Z (>24h so timely cancel)."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Conserve1", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Half", duration_minutes: 30, list_price_cents: 3000, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room CV" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Cova", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Cova M", email: "covam@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 8, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v: $.data.version }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-25T10:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v}", expected_membership_version: "${mbr_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /studio/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { sett: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.booking_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "Membership.${mbr_id}.credit_balance == 8"

      - name: timely_deposit_cancel_conserves_cents_pool
        grounds:
          - state_machines.Reservation.UNSETTLED_to_DEPOSIT_HELD
          - state_machines.Reservation.DEPOSIT_HELD_to_REFUNDED
          - entities.Member.fields.wallet_credit_cents
          - entities.Reservation.fields.deposit_held_cents
        distinguishing_aspect: |
          Conserved quantity #2 (different from credits) = total cents =
          Member.wallet_credit_cents + sum(deposit_held_cents on non-terminal DEPOSIT
          reservations). A DEPOSIT booking holds 1000 cents; a timely cancel returns
          exactly 1000 cents to wallet. Invariant: wallet_after == wallet_before + 1000,
          deposit_held released to 0; no cents created or destroyed.
        test_recipe:
          setup:
            - "Clock 2026-06-15T12:00:00Z; member wallet 0; one DEPOSIT reservation BOOKED for 2026-06-25T10:00:00Z (timely)."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Conserve2", state_code: "CA", deposit_required_cents: 1000 }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Toe", duration_minutes: 15, list_price_cents: 1000, buffer_minutes: 5, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "Room CW" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "Cowa", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Coda", email: "coda@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-25T10:00:00Z", payment_method: "DEPOSIT", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id, dep: $.data.deposit_held_cents }
          trigger:
            - call: "POST /studio/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { sett: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.booking_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == REFUNDED"
            - "Member.${mem_id}.wallet_credit_cents == 1000"
