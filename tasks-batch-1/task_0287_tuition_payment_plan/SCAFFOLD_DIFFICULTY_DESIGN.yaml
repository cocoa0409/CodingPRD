              captures: { pay_r: $.data.id }
            - call: "POST /institutions/payments/${pay_r}/settle"
              as: Bursar
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_18}", kind: "FEE", amount_cents: 60000 }
              as: Registrar
              captures: { chg_r: $.data.id }
          trigger:
            - call: "POST /institutions/charges/${chg_r}/reverse"
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_18}"
              as: Registrar
              captures: { r_sched: $.data.scheduled_balance_cents, r_net: $.data.net_after_aid_cents }
          assert:
            - "Enrollment.${enr_18}.scheduled_balance_cents == 320000"
            - "Enrollment.${enr_18}.net_after_aid_cents == 400000"
            - "Invariant: Enrollment.${enr_18}.scheduled_balance_cents + Enrollment.${enr_18}.paid_principal_cents == Enrollment.${enr_18}.net_after_aid_cents (320000 + 80000 == 400000)"
