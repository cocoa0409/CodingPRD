# =============================================================================
# §1.9 Scaffold Corner Design — task_2710_sales_tax_audit_assessment_appeal
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# Every corner already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml is emitted as
# an `excluded_because:` stub naming that §1.8 instance.
#
# Two fixtures recur below and are spelled out call-by-call in every instance
# that uses them:
#   MINI  - Ridgeline Tools (NAICS 444140), THRESHOLD project with threshold 0,
#           DESK audit scoped 2026-01-01..2026-06-30, single-stratum
#           RATIO_ESTIMATION agreement (100 units / 10000000 cents,
#           minimum_sample_size 1), one NO_ERROR sample unit, then a CONSUMABLE
#           use-tax purchase. With the clock parked on 2026-06-30 interest_days
#           is 0, so a 76192-cent purchase assesses tax 4762 / total 4762
#           (penalty waived at the 5000-cent boundary) and a 76208-cent purchase
#           assesses tax 4763 / penalty 238 / total 5001.
#   SCOPED - the same chain stopped right after POST /audits/{id}/scope, used by
#           every waiver, stratum-geometry and statute corner.
# Role user ids are fixed: selection analysts are unnamed, "auditor-1" develops
# the audit, "supervisor-1" reviews it, "collections-1" collects, "appeals-1"
# presides at the informal conference and "judge-1" at the tribunal.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: taxpayer_creation_returns_the_full_success_envelope
        claim_type: Creation
        grounds: [entities.Taxpayer, endpoints.POST /taxpayers, response_envelope]
        distinguishing_aspect: |
          A single POST with every required field returns 201 with the declared
          envelope (meta.api_request_id, response_type "object", data) and every
          computed field already populated: with no information returns on file
          info_variance_bp is 0, delinquency_bp is 2*2500, magnitude_bp is
          round_half_up(250000000*10000/5000000000) = 500, prior_audit_bp is the
          neutral 3500 and screening_score is round_half_up(40*5000/1000) = 200.
        test_recipe:
          setup:
            - "Empty database; the logical clock is left at its 2026-08-01 default."
          setup_api_calls: []
          trigger:
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-E1", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
          assert:
            - "response.status == 201 and response_type == object"
            - "Taxpayer.${te_id}.info_variance_bp == 0"
            - "Taxpayer.${te_id}.delinquency_bp == 5000"
            - "Taxpayer.${te_id}.magnitude_bp == 500"
            - "Taxpayer.${te_id}.prior_audit_bp == 3500"
            - "Taxpayer.${te_id}.screening_score == 200"
            - "Taxpayer.${te_id}.reported_total_cents == 0 and matched_total_cents == 0"
            - "Taxpayer.${te_id}.open_audit_count == 0 and compliance_status == COMPLIANT"
            - "Taxpayer.${te_id}.version == 1 and id and created_at are server-minted"

      - name: taxpayer_optional_fields_take_their_declared_defaults
        claim_type: Defaults
        grounds: [entities.Taxpayer.fields.delinquent_period_count, entities.Taxpayer.fields.prior_audit_error_rate_bp, entities.Taxpayer.fields.compliance_status]
        distinguishing_aspect: |
          Omitting the three optional inputs must apply the declared defaults —
          delinquent_period_count 0, prior_audit_error_rate_bp null and
          compliance_status COMPLIANT — which drives delinquency_bp to 0,
          prior_audit_bp to the neutral 3500 and screening_score to 0. A default
          of 0 for prior_audit_error_rate_bp instead of the neutral prior would
          change every FULL score in the domain.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /taxpayers"
              payload: { legal_name: "Summit Market Inc", permit_number: "P-2710-E2", industry_naics_code: "445110", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
          assert:
            - "Taxpayer.${te_id}.delinquent_period_count == 0"
            - "Taxpayer.${te_id}.prior_audit_error_rate_bp is null"
            - "Taxpayer.${te_id}.compliance_status == COMPLIANT"
            - "Taxpayer.${te_id}.delinquency_bp == 0 and prior_audit_bp == 3500"
            - "Taxpayer.${te_id}.magnitude_bp == 200 and screening_score == 0"

      - name: taxpayer_creation_without_permit_number_rejected
        claim_type: Required Fields
        grounds: [validations.priority_5, errors.ERR_INVALID_REQUEST, endpoints.POST /taxpayers]
        distinguishing_aspect: |
          permit_number carries no default, so omitting it must fail the priority-5
          body-schema check with ERR_INVALID_REQUEST (400) and create nothing —
          not fall through to the priority-14 uniqueness check.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /taxpayers"
              payload: { legal_name: "Nameless Trading Co", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /taxpayers returns total_count 0"

      - name: taxpayer_creation_with_an_undeclared_filing_frequency_rejected
        claim_type: Type Constraints
        grounds: [entities.Taxpayer.fields.filing_frequency, validations.priority_5, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          filing_frequency is constrained to MONTHLY, QUARTERLY and ANNUAL; the
          value BIWEEKLY must be rejected with ERR_INVALID_REQUEST (400) rather
          than stored as an opaque string.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /taxpayers"
              payload: { legal_name: "Biweekly Filers LLC", permit_number: "P-2710-E4", industry_naics_code: "445110", filing_frequency: "BIWEEKLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /taxpayers returns total_count 0"

      - name: taxpayer_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET /taxpayers, response_envelope.pagination_fields]
        distinguishing_aspect: |
          With two taxpayers on file, limit 1 offset 0 must return one row with
          total_count 2 and has_more true, and limit 1 offset 1 must return the
          other row with has_more false. total_count reports the filtered
          population, not the page size.
        test_recipe:
          setup:
            - "Two taxpayers, both COMPLIANT, created in a fixed order."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-E5A", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { t1_id: "$.data.id" }
            - call: "POST /taxpayers"
              payload: { legal_name: "Summit Market Inc", permit_number: "P-2710-E5B", industry_naics_code: "445110", filing_frequency: "QUARTERLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { t2_id: "$.data.id" }
          trigger:
            - call: "GET /taxpayers"
              payload: { limit: 1, offset: 0 }
              as: SelectionAnalyst
            - call: "GET /taxpayers"
              payload: { limit: 1, offset: 1 }
              as: SelectionAnalyst
            - call: "GET /taxpayers"
              payload: { industry_naics_code: "445110", limit: 10, offset: 0 }
              as: SelectionAnalyst
          assert:
            - "trigger call 1: response_type == array, one element, total_count == 2, has_more == true"
            - "trigger call 2: one element, total_count == 2, has_more == false"
            - "trigger calls 1 and 2 together return exactly ${t1_id} and ${t2_id}"
            - "trigger call 3: two elements, total_count == 2, has_more == false"

      - name: information_return_is_immutable_and_rolls_up_to_the_taxpayer
        claim_type: Immutability
        grounds: [entities.InformationReturn, endpoints.POST /information-returns, "endpoints.GET /information-returns/{id}"]
        distinguishing_aspect: |
          InformationReturn declares common_fields false, so the stored row carries
          id and created_at but no version and no updated_at, and §1.5 offers no
          update or delete for it. Loading it must compute variance_cents 30000000,
          match_status UNDER_REPORTED and in_scoring_window true, and roll
          reported_total_cents / matched_total_cents onto the Taxpayer, lifting
          info_variance_bp to 2500 and screening_score from 200 to 350.
        test_recipe:
          setup:
            - "Harbor Foods with delinquent_period_count 2 and no returns yet (screening_score 200)."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-E6", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
          trigger:
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${te_id}", source_type: "FEDERAL_1099K", period_start: "2026-01-01", period_end: "2026-03-31", reported_amount_cents: 120000000, matched_return_amount_cents: 90000000 }
              as: SelectionAnalyst
              captures: { ir_id: "$.data.id" }
            - call: "GET /information-returns/${ir_id}"
              payload: {}
              as: SelectionAnalyst
          assert:
            - "trigger call 1: response.status == 201"
            - "InformationReturn.${ir_id}.variance_cents == 30000000"
            - "InformationReturn.${ir_id}.match_status == UNDER_REPORTED"
            - "InformationReturn.${ir_id}.in_scoring_window == true"
            - "trigger call 2: the payload carries id and created_at but no version and no updated_at field"
            - "Taxpayer.${te_id}.reported_total_cents == 120000000 and matched_total_cents == 90000000"
            - "Taxpayer.${te_id}.info_variance_bp == 2500 and screening_score == 350"

      - name: sample_unit_body_foreign_key_must_resolve
        claim_type: Parent Relationships
        grounds: [validations.priority_6, errors.ERR_SAMPLING_AGREEMENT_NOT_FOUND, endpoints.POST /sample-units]
        distinguishing_aspect: |
          The topology is flat, so parents arrive as body foreign keys rather than
          path segments; a sampling_agreement_id that resolves to nothing must be
          rejected at priority 6 with ERR_SAMPLING_AGREEMENT_NOT_FOUND (404) before
          any state or geometry rule is consulted.
        test_recipe:
          setup:
            - "Empty database — no sampling agreement exists at all."
          setup_api_calls: []
          trigger:
            - call: "POST /sample-units"
              payload: { sampling_agreement_id: "00000000-0000-0000-0000-000000000000", stratum_index: 0, invoice_reference: "GHOST-1", invoice_date: "2026-03-02", invoice_amount_cents: 100000, error_class: "NO_ERROR" }
              as: FieldAuditor
              as_user_id: "auditor-1"
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SAMPLING_AGREEMENT_NOT_FOUND"
            - "response.data.error_id != ERR_AGREEMENT_NOT_AGREED"

      - name: taxpayer_read_of_a_missing_id_returns_not_found
        claim_type: Not Found
        grounds: [validations.priority_3, errors.ERR_TAXPAYER_NOT_FOUND]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / path_existence_priority_3_outranks_ownership_priority_4
          rationale: "That instance probes a non-existent taxpayer id and asserts ERR_TAXPAYER_NOT_FOUND (404) as the priority-3 answer."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: audit_created_by_conversion_starts_in_planned
        claim_type: Initial State
        grounds: [state_machines.Audit.initial_state, "endpoints.POST /audit-leads/{id}/convert", entities.Audit]
        distinguishing_aspect: |
          The Audit is minted by lead conversion, not by a POST /audits, and it must
          land in PLANNED with every derived field at its declared pre-scope value:
          statute_status UNSET (not PROTECTED — no scope means no expiry yet),
          projection_status NOT_RUN, projection_method NONE, agreed_agreement_id null,
          reopen_count 0, version 1. Conversion also moves the lead to CONVERTED and
          lifts Taxpayer.open_audit_count to 1 without touching selections_used.
        test_recipe:
          setup:
            - "MINI selection: one taxpayer in NAICS 444140 and a THRESHOLD project with selection_threshold_score 0 and selection_quota 2, so the single lead is SELECTED."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-S1", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware Retail 2026", industry_naics_code: "444140", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_id: "$.data[0].id" }
          trigger:
            - call: "POST /audit-leads/${lead_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Audit.${audit_id}.status == PLANNED and version == 1"
            - "Audit.${audit_id}.statute_status == UNSET and statute_expiry_date is null and base_statute_expiry_date is null"
            - "Audit.${audit_id}.projection_status == NOT_RUN and projection_method == NONE"
            - "Audit.${audit_id}.agreed_agreement_id is null and reopen_count == 0 and waiver_days_added == 0 and tolled_days == 0"
            - "Audit.${audit_id}.taxpayer_id == ${te_id} and audit_lead_id == ${lead_id} and lead_auditor_user_id == auditor-1"
            - "AuditLead.${lead_id}.status == CONVERTED"
            - "Taxpayer.${te_id}.open_audit_count == 1"
            - "IndustryProject.${proj_id}.selections_used == 1 and selections_remaining == 1"

      - name: agreeing_the_methodology_opens_fieldwork_and_supersedes_the_rival
        claim_type: Side Effect Execution
        grounds: ["endpoints.POST /sampling-agreements/{id}/agree", state_machines.Audit.SCOPED_to_FIELDWORK, state_machines.SamplingAgreement]
        distinguishing_aspect: |
          One agree call must land three separate side effects: the agreement itself
          goes PROPOSED -> AGREED, the Audit goes SCOPED -> FIELDWORK with
          agreed_agreement_id pointing at the agreed row, and every OTHER PROPOSED or
          COUNTERED agreement of the same audit is driven to SUPERSEDED. An
          implementation that only flips the agreement leaves the rival agreement
          live and the audit stuck in SCOPED.
        test_recipe:
          setup:
            - "A DESK audit scoped 2026-01-01..2026-06-30 with two competing PROPOSED agreements; each POST /sampling-agreements consumes and bumps the audit version, so the second one re-reads it."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-S2", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware Retail 2026", industry_naics_code: "444140", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "DESK", scope_period_start: "2026-01-01", scope_period_end: "2026-06-30" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { av1: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${av1}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9500, minimum_sample_size: 1, strata: [ { period_start: "2026-01-01", period_end: "2026-07-01", population_base_amount_cents: 10000000, population_unit_count: 100 } ] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_a: "$.data.id" }
            - call: "GET /audits/${audit_id}"
              payload: {}
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { av2: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${av2}", methodology: "MEAN_PER_UNIT", confidence_level_bp: 9000, minimum_sample_size: 2, strata: [ { period_start: "2026-01-01", period_end: "2026-07-01", population_base_amount_cents: 10000000, population_unit_count: 100 } ] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_b: "$.data.id" }
          trigger:
            - call: "POST /sampling-agreements/${agr_a}/agree"
              payload: { agreed_by_name: "R. Vance" }
              as: Taxpayer
              as_user_id: "${te_id}"
          assert:
            - "response.status == 200"
            - "SamplingAgreement.${agr_a}.status == AGREED and agreed_by_name == R. Vance"
            - "SamplingAgreement.${agr_b}.status == SUPERSEDED"
            - "Audit.${audit_id}.status == FIELDWORK"
            - "Audit.${audit_id}.agreed_agreement_id == ${agr_a}"
            - "Audit.${audit_id}.projection_method == NONE and projection_status == NOT_RUN"

      - name: countering_an_already_agreed_methodology_is_refused
        claim_type: Invalid Transitions
        grounds: ["endpoints.POST /sampling-agreements/{id}/counter", state_machines.SamplingAgreement.AGREED, validations.priority_7, errors.ERR_INVALID_STATE]
        distinguishing_aspect: |
          counter is only declared out of PROPOSED. Applied to an AGREED agreement it
          must fail the priority-7 state gate with ERR_INVALID_STATE (409) and leave
          both the agreement AGREED and the audit in FIELDWORK — the counter must not
          drag a live audit back into negotiation.
        test_recipe:
          setup:
            - "MINI up to the agreed agreement: audit in FIELDWORK, agreement ${agr_id} AGREED."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-S3", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware Retail 2026", industry_naics_code: "444140", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
              payload: { audit_type: "DESK", scope_period_start: "2026-01-01", scope_period_end: "2026-06-30" }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { av1: "$.data.version" }
            - call: "POST /sampling-agreements"
              payload: { audit_id: "${audit_id}", expected_audit_version: "${av1}", methodology: "RATIO_ESTIMATION", confidence_level_bp: 9500, minimum_sample_size: 1, strata: [ { period_start: "2026-01-01", period_end: "2026-07-01", population_base_amount_cents: 10000000, population_unit_count: 100 } ] }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { agr_id: "$.data.id" }
            - call: "POST /sampling-agreements/${agr_id}/agree"
              payload: { agreed_by_name: "R. Vance" }
              as: Taxpayer
              as_user_id: "${te_id}"
          trigger:
            - call: "POST /sampling-agreements/${agr_id}/counter"
              payload: { counter_note: "We want a bigger sample after all", requested_minimum_sample_size: 5 }
              as: Taxpayer
              as_user_id: "${te_id}"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "SamplingAgreement.${agr_id}.status == AGREED and round_number == 1 and counter_note is null"
            - "Audit.${audit_id}.status == FIELDWORK"

      - name: agreeing_the_same_methodology_twice_is_refused
        claim_type: Idempotency
        grounds: ["endpoints.POST /sampling-agreements/{id}/agree", state_machines.SamplingAgreement, errors.ERR_INVALID_STATE]
        distinguishing_aspect: |
          agree is not idempotent: the second call must be refused with
          ERR_INVALID_STATE (409) rather than re-running the side effects, because
          re-running them would re-enter Audit SCOPED -> FIELDWORK and could clobber
          agreed_agreement_id or re-supersede rows.
        test_recipe:
          setup:
            - "MINI up to the agreed agreement (identical to countering_an_already_agreed_methodology_is_refused, permit P-2710-S4)."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-S4", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Hardware Retail 2026", industry_naics_code: "444140", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 0, selection_quota: 2 }
              as: SelectionAnalyst
              captures: { proj_id: "$.data.id" }
            - call: "POST /industry-projects/${proj_id}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_id}", status: "SELECTED" }
              as: SelectionAnalyst
              captures: { lead_id: "$.data[0].id" }
            - call: "POST /audit-leads/${lead_id}/convert"
              payload: { lead_auditor_user_id: "auditor-1", audit_type: "DESK" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /audits/${audit_id}/scope"
