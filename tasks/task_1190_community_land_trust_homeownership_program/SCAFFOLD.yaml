    code: 200
    input: []
    output: DefaultNotice
    side_effects: ["status → ESCALATED"]

  - method: POST
    path: "/programs/{id}/units/{unitId}/leases/{leaseId}/default-notices/{noticeId}/dismiss"
    description: "Dismiss a default notice"
    roles: [LeaseManager]
    code: 200
    input: []
    output: DefaultNotice
    side_effects: ["status → DISMISSED"]

  # --- InspectionRecord ---
  - method: POST
    path: "/programs/{id}/units/{unitId}/inspections"
    description: "Schedule an inspection"
    roles: [Inspector, LeaseManager]
    code: 201
    input: [scheduled_for]
    output: InspectionRecord
    side_effects: ["result=PENDING; inspector_user_id=acting X-User-ID"]

  - method: GET
    path: "/programs/{id}/units/{unitId}/inspections"
    description: "List inspections for a unit"
    roles: [PlatformAdmin, ProgramAdmin, LeaseManager, Inspector, Household]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: "InspectionRecord[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}/units/{unitId}/inspections/{inspectionId}"
    description: "Get inspection"
    roles: [PlatformAdmin, ProgramAdmin, LeaseManager, Inspector, Household]
    code: 200
    input: []
    output: InspectionRecord
    side_effects: []

  - method: POST
    path: "/programs/{id}/units/{unitId}/inspections/{inspectionId}/record-result"
    description: "Record inspection result"
    roles: [Inspector]
    code: 200
    input: [result, "findings?"]
    output: InspectionRecord
    side_effects: ["result set; completed_at=now; Unit.last_inspection_passed_at and next_inspection_due_at recomputed on PASSED; on FAILED, DefaultNotice(MAINTENANCE) auto-issued on active lease, linked_notice_id set"]

  # --- WaitlistEntry ---
