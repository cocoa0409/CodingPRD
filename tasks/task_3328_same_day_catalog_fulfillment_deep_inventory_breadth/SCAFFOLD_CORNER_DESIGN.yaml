              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CatalogCurator
              captures: { error_id: $.data.error_id }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CatalogCurator
              captures: { error_id2: $.data.error_id }
          assert:
            - "the curator's POST /orders returns 403 with error_id == ERR_UNAUTHORIZED"
            - "the curator's allocate returns 403 with error_id == ERR_UNAUTHORIZED"
            - "CatalogOrder.${order_id}.fulfillment_status is still AWAITING_RELEASE"
            - "GET /orders?account_id=${acct_id} still returns exactly 1 row, so the denied order creation added nothing"

      - name: shared_read_operations_are_open_to_both_peer_roles
        claim_type: Peer roles
        grounds:
          - roles.CustomerAccount.shared_operations
          - roles.DCManager.shared_operations
          - endpoints.GET_/orders/{id}
        distinguishing_aspect: "Peer exclusivity is not blanket isolation: GET /orders/{id} is a shared operation, so both the owning CustomerAccount and an unrelated DCManager receive the same order body, while the exclusive write remains refused to the DCManager."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account, one curated item and one DRAFT order belonging to that account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
