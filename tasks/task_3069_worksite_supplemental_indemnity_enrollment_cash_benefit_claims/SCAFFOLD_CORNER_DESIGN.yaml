  # ===========================================================================
  - section: endpoints
    instances:
      - name: schedule_create_with_duplicate_event_codes_rejected
        claim_type: computed_read
        grounds: ["endpoints.POST_/benefit-schedules", entities.BenefitSchedule.fields.benefit_items, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "benefit_items with a duplicated event_code inside one schedule is rejected with ERR_INVALID_REQUEST — the uniqueness constraint is within the array, not across schedules."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Series SF2 created (DRAFT)."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /policy-series", payload: { series_code: "SF2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sf2: $.data.id } }
          trigger:
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sf2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "DUP", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }, { event_code: "DUP", benefit_amount_cents: 200, max_occurrences_per_year: 2, lifetime_max_cents: 2000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { err_f: $.data.error_id } }
          assert:
            - "${err_f} == ERR_INVALID_REQUEST (duplicate event_code within benefit_items)"

      - name: schedule_version_must_increase_within_series
        claim_type: conditional_action
        grounds: ["endpoints.POST_/benefit-schedules", "errors[ERR_SCHEDULE_VERSION_CONFLICT]", "validations[priority=7]"]
        distinguishing_aspect: "Creating a schedule with schedule_version <= the series' max existing version fails with ERR_SCHEDULE_VERSION_CONFLICT; a strictly greater version succeeds."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z. Series SG2 DRAFT with one schedule at schedule_version 1."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /policy-series", payload: { series_code: "SG2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sg2: $.data.id } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sg2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "V1", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin }
          trigger:
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sg2}", schedule_version: 1, effective_date: "2026-06-01T00:00:00Z", benefit_items: [{ event_code: "V1", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { err_g: $.data.error_id } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sg2}", schedule_version: 2, effective_date: "2026-06-01T00:00:00Z", benefit_items: [{ event_code: "V1", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schg2: $.data.id } }
          assert:
            - "Repeating schedule_version 1 fails: ${err_g} == ERR_SCHEDULE_VERSION_CONFLICT (HTTP 409)"
            - "schedule_version 2 with a later effective_date succeeds: BenefitSchedule.${schg2}.status == DRAFT"

      - name: policy_application_outside_window_rejected
        claim_type: conditional_action
        grounds: ["endpoints.POST_/policies", "errors[ERR_WINDOW_EXPIRED]", entities.EnrollmentCampaign.fields.window_end]
        distinguishing_aspect: "POST /policies requires the campaign OPEN and the clock strictly inside [window_start, window_end): applying at exactly window_end fails with ERR_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group GH2X ACTIVE; counselor CH2; series SH2 ACTIVE with PUBLISHED schedule (event H2 amount 100, max 1, lifetime 1000; premium 100; wellness 50/0/0); campaign CH2-CAM OPEN window 2026-09-01..2026-09-05 guaranteed_issue; employee EH2 ACTIVE."
            - "Clock advanced to exactly 2026-09-05T00:00:00Z (window end; campaign still OPEN because nobody locked it)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "GH2X", group_code: "GH2X", participation_minimum_pct: 0.0, participation_minimum_count: 0 }, as: CarrierAdmin, captures: { gh2x: $.data.id } }
            - { call: "POST /employer-groups/${gh2x}/activate", payload: {}, as: CarrierAdmin }
