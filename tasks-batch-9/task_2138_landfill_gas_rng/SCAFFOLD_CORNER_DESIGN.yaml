              captures: { ctr_v1: $.data.version }
          trigger:
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-11T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "data.error_id == 'ERR_INTERVAL_INVALID'"
            - "GET /pipeline-nominations?contract_id=${contract_id}&limit=10&offset=0 returns total_count == 0"

      - name: nomination_outside_contract_term_is_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=110]", "errors[ERR_CONTRACT_TERM_WINDOW]", "entities.OfftakeContract.fields.term_end"]
        distinguishing_aspect: "The nominated window must sit inside [term_start, term_end); a gas day on 2026-09-05 against a contract ending 2026-09-01T00:00:00Z returns 422 ERR_CONTRACT_TERM_WINDOW even though the volume is well inside the MDQ."
        test_recipe:
