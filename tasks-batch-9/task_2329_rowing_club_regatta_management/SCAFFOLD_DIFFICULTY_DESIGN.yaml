              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T18:00:00Z", planned_end_at: "2026-08-01T19:00:00Z", athlete_member_ids: ["${rita_id}"] }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
              captures: { s7_id: $.data.id }
            - call: "POST /boathouse/water-sessions/${s7_id}/clear"
              payload: { reading_id: "${reading_open_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
            - call: "POST /boathouse/water-sessions/${s7_id}/launch"
              payload: {}
              as: SafetyOfficer
              as_user_id: "${officer_id}"
            - call: "POST /boathouse/water-sessions/${s7_id}/return"
