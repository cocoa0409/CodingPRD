            - "ServiceRoute.${route_id}.status == DISPATCHED"

      - name: rate_threshold_snow_just_above_two_dispatches
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=13]", state_machines.ServiceRoute.OPEN_to_DISPATCHED]
        distinguishing_aspect: "A reading at depth 2.1 (just above 2.0) crosses the threshold and dispatches; route -> DISPATCHED and reading processed."
        test_recipe:
