            - *a_bl1_s3_24
            - *a_bl1_fin
            - &a_bl1_pack225 { call: "POST /bag-lots/${bl1}/packout", payload: { requested_bags: 22500, expected_bag_lot_version: "${v_bl}" }, as: ConvertingOperator }
            - &a_cd1_new { call: "POST /compliance-dossiers", payload: { dossier_code: "CD-1", bag_lot_id: "${bl1}", food_contact_declared: true, recycled_content_claim_pct: 0.0 }, as: QualityManager, as_user_id: "u-qm-1", captures: { cd1: "$.data.id" } }
