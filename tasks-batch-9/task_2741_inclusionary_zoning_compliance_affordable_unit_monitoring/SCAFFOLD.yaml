  - priority: 39
    category: business_referential
    check: "prior_transaction_id, when supplied, references a CLOSED ResaleTransaction of the SAME unit; when omitted, the unit must have no CLOSED resale history"
    error_id: ERR_PRIOR_TRANSACTION_MISMATCH
    http_status: 422
