            - { call: "POST /production-runs/${rp1}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs/${rp1}/complete", payload: { actual_units: 150, mix_metered_litres: 60.0, zone_id: "${zr}" }, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /production-runs", payload: { run_code: "R-P2", product_id: "${p_pint}", line_id: "${lb}", planned_units: 150, scheduled_start: "2026-08-10T16:00:00Z" }, as: ProductionPlanner, captures: { rp2: $.data.id } }
            - { call: "POST /changeovers", payload: { line_id: "${lb}", to_product_id: "${p_pint}" }, as: ProductionPlanner, captures: { chp2: $.data.id } }
            - { call: "POST /changeovers/${chp2}/complete", payload: {}, as: LineOperator, as_user_id: "op_1" }
            - { call: "POST /changeovers/${chp2}/verify", payload: { outcome: PASS }, as: QAManager, as_user_id: "qa_1" }
            - { call: "POST /tunnel-bookings", payload: { tunnel_id: "${t2}", run_id: "${rp2}", start_at: "2026-08-10T15:00:00Z", end_at: "2026-08-10T16:00:00Z" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rp2}/assign-mix", payload: { mix_batch_id: "${m1}" }, as: ProductionPlanner }
            - { call: "POST /production-runs/${rp2}/start", payload: {}, as: LineOperator, as_user_id: "op_1" }
          trigger:
            - call: "POST /production-runs/${rp2}/complete"
              payload: { actual_units: 150, mix_metered_litres: 60.0, zone_id: "${zr}" }
              as: LineOperator
              as_user_id: "op_1"
            - call: "GET /freezer-zones/${zr}"
              payload: {}
              as: QAManager
              captures: { zone_occ: $.data.occupied_pallets }
          assert:
            - "each lot.pallets == 2 (ceil(150/100) per lot)"
            - "FreezerZone.${zr}.occupied_pallets == 4 — per-lot ceil THEN sum; the naive ceil(300/100) == 3 order is observably wrong"
            - "second run completes successfully because 4 <= zone capacity 10"

      - name: contract_shortfall_penalty_pinned_order
        grounds:
          - calculations.contract_fulfillment
          - entities.CoPackContract.fields.shortfall_penalty_cents
          - entities.CoPackContract.fields.fulfillment_pct
        distinguishing_aspect: |
          Mode (c) pinned evaluation order over a circular-looking dependency: the
          penalty tier is keyed on fulfillment_pct, so the scaffold pins
          delivered_units -> pct -> tier -> penalty. With 4000/10000 delivered the
          pct is 40.00 (< 50 => rate 0.35) giving penalty 525000 cents; an
          implementation that tiers on unrounded ratio or applies the mid tier (0.20)
          produces a different number.
        test_recipe:
          setup:
            - "Product CP-BAR (co_pack_only true, NOVELTY); Customer PL-1 (PRIVATE_LABEL)"
            - "Contract CT-1: committed 10000 units at 250 cents, start 2026-08-01, end 2027-08-01; submitted, approved (pins product version), ACTIVE after clock passes start_date"
            - "One lot of 4000 CP-BAR units produced; shipment SH-C1 under CT-1 delivers exactly 4000 units"
          setup_api_calls:
            - { call: "POST /products", payload: { sku_code: "CP-BAR", product_name: "Private Label Bar", format: NOVELTY, flavor_family: VANILLA, allergens: [MILK], fill_volume_ml_per_unit: 70, target_overrun_pct: 40, units_per_pallet: 100, shelf_life_days: 540, co_pack_only: true }, as: PlantManager, captures: { p_cp: $.data.id } }
            - { call: "POST /customers", payload: { customer_code: "PL-1", display_name: "Big Retailer", kind: PRIVATE_LABEL }, as: PlantManager, captures: { c_pl: $.data.id } }
