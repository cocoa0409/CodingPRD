            - "Trigger step 1 response: status == SUBMITTED, budgetary_operating_5y_cents == 78961530, budgetary_tco_cents == 388961531, baseline_year1_opex_cents == 14228624"
            - "Trigger step 2 returns HTTP 422 with error_id == ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE"
            - "ReplacementRequest.${r2_id}.status == DRAFT and budgetary_tco_cents == 0 and revision_count == 0"
            - "EquipmentAsset.${asset_a1_id}.age_years == 6.00 and EquipmentAsset.${asset_a2_id}.age_years == 6.00"

