            - { call: "POST /api/surveys", payload: { property_id: "${prop1}", surveyor_technician_id: "${t_surv}", scheduled_date: "2026-08-05T09:00:00Z" }, as: ProjectCoordinator, captures: { surv1: $.data.id } }
