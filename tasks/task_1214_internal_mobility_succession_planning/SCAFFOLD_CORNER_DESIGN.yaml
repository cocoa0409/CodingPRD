      - name: error_session_window_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_WINDOW_CONFLICT]"]
        excluded_because: { difficulty_instance: "session_calendar_half_open_adjacency", rationale: "The overlapping-session trigger asserts ERR_SESSION_WINDOW_CONFLICT." }
      - name: error_posting_window_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_POSTING_WINDOW_CONFLICT]"]
