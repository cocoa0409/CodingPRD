        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / sod_beats_supervisor_cap_on_adjustment_approve"
          rationale: "That instance shows the cap error emerging once the segregation-of-duties violation is removed, and confirms only a ShrinkController can clear it — it exercises this id under a harder ordering constraint than a standalone corner would."

      - name: self_review_of_own_step_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations.priority_50_ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / sod_beats_supervisor_cap_on_adjustment_approve"
          rationale: "The same instance triggers ERR_SEGREGATION_OF_DUTIES with the requester approving their own adjustment and proves it outranks the cap rule, covering the priority-50 rule at its hardest point."

      - name: posting_an_adjustment_before_its_investigation_closes_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVESTIGATION_NOT_CLOSED
          - validations.priority_60_ERR_INVESTIGATION_NOT_CLOSED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / adjustment_post_requires_investigation_closed"
          rationale: "That instance drives the linked investigation through each non-CLOSED state and asserts the id every time, plus the success case after close — a superset of this corner."

      - name: certifying_while_the_period_is_open_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SHRINK_PERIOD_STILL_OPEN
          - validations.priority_54_ERR_SHRINK_PERIOD_STILL_OPEN
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / physical_certify_requires_shrink_period_not_open"
          rationale: "That instance certifies against a deliberately still-OPEN covering period and then succeeds after a provisional close, exercising the inverted-polarity guard pair in one chain."

      - name: overlapping_count_window_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COUNT_WINDOW_OVERLAP
          - validations.priority_72_ERR_COUNT_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / count_window_half_open_adjacency_accepted_overlap_rejected"
          rationale: "That instance pins the half-open boundary — touching windows accepted, one-second overlap rejected with this id — which is the only interesting form of this corner."

      - name: overhead_reader_pool_exhausted_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OVERHEAD_READER_CAPACITY_EXCEEDED
          - validations.priority_73_ERR_OVERHEAD_READER_CAPACITY_EXCEEDED
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / overhead_reader_pool_aggregate_capacity_exceeded"
          rationale: "That instance fills the pool from different categories so the aggregate rule fires while the same-category overlap rule cannot, isolating this id exactly."

      - name: physical_inventory_blackout_conflict_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT
          - validations.priority_74_ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / physical_inventory_closed_interval_blackout_buffer"
          rationale: "That instance tests the padded closed interval at the exact touching endpoint and one day beyond, covering both polarities of the buffer arithmetic."

      - name: second_chargeback_out_of_one_period_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CHARGEBACK_ALREADY_ISSUED
          - validations.priority_104_ERR_CHARGEBACK_ALREADY_ISSUED
        excluded_because:
          difficulty_instance: "compensating_invariant / vendor_chargeback_credit_conserves_gross"
          rationale: "That instance issues one chargeback, proves the second attempt returns ERR_CHARGEBACK_ALREADY_ISSUED, and also drives ERR_CREDIT_EXCEEDS_BALANCE at the exact balance boundary."

      - name: credit_above_the_vendor_balance_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CREDIT_EXCEEDS_BALANCE
          - validations.priority_105_ERR_CREDIT_EXCEEDS_BALANCE
        excluded_because:
          difficulty_instance: "compensating_invariant / vendor_chargeback_credit_conserves_gross"
          rationale: "That instance credits balance+1, then exactly balance, then 1 more, showing the money invariant never goes negative — strictly stronger than a single over-credit corner."

  # ==========================================================================
  # RBAC — role_model is segregation_of_duties over seven roles, three of them
  # entity_backed, so both axes are probed: role membership (priority 2,
  # ERR_ROLE_NOT_PERMITTED) and identity scope (priority 4,
  # ERR_IDENTITY_SCOPE_VIOLATION).
  # ==========================================================================
  - section: rbac
    instances:

      - name: reference_data_writes_by_non_admin_roles_return_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - roles.SystemAdmin.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "SystemAdmin owns reference data outright: no operational role, not even ShrinkController who outranks everyone financially, may mint a Category, Store, Vendor, CounterFirm or Item."
        test_recipe:
          setup:
            - "An empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /inventory-integrity/categories as InventoryAnalyst returns 200 with total_count 0 — the write was refused, and reads remain open to every internal role"
            - "the same POST as InventorySupervisor, as ShrinkController, as StoreOps, as VendorRep and as ThirdPartyCounter each return 403 ERR_ROLE_NOT_PERMITTED"
            - "POST /inventory-integrity/stores, /vendors, /counter-firms, /items and POST /_clock/set_current_utc behave identically for those six roles, and all six succeed for SystemAdmin"

      - name: shrink_closure_and_chargeback_ops_by_supervisor_return_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - roles.ShrinkController.exclusive_operations
          - roles.InventorySupervisor.shared_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "InventorySupervisor and ShrinkController share adjustment and investigation authority, which makes the boundary interesting: the supervisor may OPEN a shrink period but may never close, reopen, charge back, reconcile a physical inventory or certify one."
        test_recipe:
          setup:
            - "Store S100 and one OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30, created by the InventorySupervisor to prove the shared write is allowed."
          setup_api_calls:
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { sp1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/shrink-periods/${sp1}/provisional-close"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "the setup shrink-period create returned 201, proving InventorySupervisor holds the shared open operation"
            - "response status 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /inventory-integrity/shrink-periods/${sp1} still reads status \"OPEN\""
            - "/reopen and /final-close on the same period, POST /inventory-integrity/vendors/{id}/chargebacks and /chargeback-credits, and POST /inventory-integrity/physical-inventories/{id}/reconcile and /certify all return 403 for InventorySupervisor and 200 or 201 for ShrinkController"
            - "InventoryAnalyst, StoreOps, VendorRep and ThirdPartyCounter are likewise refused on every one of those paths"

      - name: count_calendar_control_ops_by_analyst_return_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - roles.InventorySupervisor.exclusive_operations
          - roles.InventoryAnalyst.shared_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The analyst builds and executes counts but cannot judge them: return-to-count, reconcile, void, pause and resume are supervisor-side controls, so the producer of the count data can never adjudicate it."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100 and an ACTIVE HANDHELD schedule first due 2026-08-01, created by the InventoryAnalyst to prove the shared write is allowed."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-schedules/${sched1}/pause"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "GET /inventory-integrity/count-schedules/${sched1} still reads status \"ACTIVE\""
            - "the identical pause as InventorySupervisor returns 200 with status \"PAUSED\", and /resume returns it to \"ACTIVE\""
            - "POST /count-tasks/{id}/return-to-count, /reconcile and /void also return 403 for InventoryAnalyst and are accepted for InventorySupervisor and ShrinkController, the two roles that list them"

      - name: store_ops_write_outside_the_counting_surface_returns_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - roles.StoreOps.shared_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "StoreOps has the narrowest surface of the three entity_backed roles — receive/verify a tag batch and start/line/submit a count task — and it cannot author the adjustments its own counts provoke, nor read the analyst-side collections."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Item TEE-001 and a stock position at S100 with 100 on-hand."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "GET /inventory-integrity/stock-positions/${pos_tee1}"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { pos_v1: "$.data.version" }
          trigger:
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: -3, reason_code: "DAMAGE", expected_stock_position_version: "${pos_v1}" }
              as: StoreOps
              as_user_id: "${store_s100}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\" — the OCC version quoted is perfectly current, so the refusal is purely about the role"
            - "GET /inventory-integrity/adjustments as InventoryAnalyst returns total_count 0"
            - "POST /inventory-integrity/count-schedules, /stock-positions and /stock-positions/{id}/integrity-scan also return 403 for StoreOps"
            - "GET /inventory-integrity/stock-positions as StoreOps returns 403 ERR_ROLE_NOT_PERMITTED because StoreOps does not carry the blanket GET grant that the four opaque roles have"

      - name: vendor_rep_encode_of_another_vendors_batch_returns_forbidden
        claim_type: identity_scope_enforced
        grounds:
          - roles.VendorRep
          - errors.ERR_IDENTITY_SCOPE_VIOLATION
          - validations.priority_4_ERR_IDENTITY_SCOPE_VIOLATION
        distinguishing_aspect: "VendorRep is entity_backed on Vendor, so the scoping check compares X-User-ID against TagBatch.vendor_id rather than against the store — a second vendor holding a batch for the same item and store is still refused."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendors VEND1 and VEND2, Item TEE-001 sourced from VEND1."
            - "A DRAFT TagBatch opened by VEND1 for TEE-001 destined for S100."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND2", name: "Vendor Two" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor2: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/tag-batches/${batch1}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_IDENTITY_SCOPE_VIOLATION\", not ERR_ROLE_NOT_PERMITTED — VendorRep does hold /encode"
            - "GET /inventory-integrity/tag-batches/${batch1} still reads status \"DRAFT\" and encoding_scheme null"
            - "POST /inventory-integrity/tag-batches with vendor_id ${vendor1} while presenting ${vendor2} also returns 403 ERR_IDENTITY_SCOPE_VIOLATION — the body and the header must agree"
            - "the identical encode presenting ${vendor1} returns 200 with status \"ENCODED\""

      - name: third_party_counter_cannot_reconcile_or_certify_its_own_count_returns_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - roles.ThirdPartyCounter
          - roles.ShrinkController.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The independence of the annual count rests on this split: the firm that produces the numbers holds start, lines and complete-pass but neither reconcile nor certify, so it can never bless its own work even for the inventory assigned to it."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Item TEE-001, a stock position with 100 on-hand, CounterFirm CF1 TIER_1 max_lines_per_pass 500, and an OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
            - "A PhysicalInventory for (S100, CF1) scheduled 2026-09-10..2026-09-12, started by CF1, given one line counting 100 units, first pass completed — so every state precondition for reconcile is satisfied and only the role is wrong."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counting Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm1: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${firm1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12", recount_threshold_bps: 150 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/start"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pi_v1: "$.data.version" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 100, expected_physical_inventory_version: "${pi_v1}" }
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pil1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/complete-pass"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
          trigger:
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/reconcile"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\", not ERR_IDENTITY_SCOPE_VIOLATION — the firm owns this inventory, it simply does not own this verb"
            - "GET /inventory-integrity/physical-inventories/${pi1} still reads status \"FIRST_PASS_COMPLETE\""
            - "/certify and /order-recount likewise return 403 for ThirdPartyCounter, while the same reconcile as ShrinkController u_ctrl_1 returns 200"
            - "the three operations the firm does hold — /start, /lines and /complete-pass — all succeeded in the setup, so its grant is exactly the three-verb window"

      - name: third_party_counter_line_on_another_firms_inventory_returns_forbidden
        claim_type: identity_scope_enforced
        grounds:
          - roles.ThirdPartyCounter
          - errors.ERR_IDENTITY_SCOPE_VIOLATION
        distinguishing_aspect: "Identity scope is checked at priority 4, ahead of the OCC comparison at 30, so a rival firm quoting a version it could only have guessed is refused as out-of-scope rather than as stale."
        test_recipe:
          setup:
            - "The same fixture as the reconcile case, plus CounterFirm CF2 at TIER_2 with max_lines_per_pass 200."
            - "The PhysicalInventory is assigned to CF1 and started by CF1, so its version is known and current."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counting Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm1: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF2", name: "Counting Firm Two", certification_level: "TIER_2", max_lines_per_pass: 200 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm2: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${firm1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12", recount_threshold_bps: 150 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/start"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pi_v1: "$.data.version" }
          trigger:
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 77, expected_physical_inventory_version: "${pi_v1}" }
              as: ThirdPartyCounter
              as_user_id: "${firm2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_IDENTITY_SCOPE_VIOLATION\""
            - "GET /inventory-integrity/physical-inventory-lines?physical_inventory_id=${pi1} as InventoryAnalyst returns total_count 0"
            - "the identical call presenting ${firm1} returns 201 with counted_units 77 and superseded false"
            - "POST /inventory-integrity/physical-inventories/${pi1}/start and /complete-pass presented by ${firm2} also return 403 ERR_IDENTITY_SCOPE_VIOLATION"

      - name: store_ops_start_of_another_stores_count_task_returns_forbidden
        claim_type: identity_scope_enforced
        grounds:
          - roles.StoreOps
          - errors.ERR_IDENTITY_SCOPE_VIOLATION
        distinguishing_aspect: "For StoreOps the scoping entity is reached transitively — CountTask carries store_id through its CountSchedule — so the check must follow the reference rather than compare a field on the task's own payload."
        test_recipe:
          setup:
            - "Category APPAREL, Stores S100 and S200, and an ACTIVE HANDHELD schedule at S100 first due 2026-08-01 with one PLANNED count task on the 2026-08-01..2026-08-03 window."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S200", name: "Store 200", reader_capability: "HANDHELD_ONLY", overhead_reader_capacity: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s200: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s200}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_IDENTITY_SCOPE_VIOLATION\""
            - "GET /inventory-integrity/count-tasks/${task1} as InventoryAnalyst still reads status \"PLANNED\" and started_at null"
            - "the identical start presenting ${store_s100} returns 200 with status \"COUNTING\""
            - "/lines and /submit presented by ${store_s200} also return 403 ERR_IDENTITY_SCOPE_VIOLATION, and the opaque roles InventoryAnalyst and InventorySupervisor may start the task without any scoping id"

      - name: role_membership_is_checked_before_path_resolution_returns_forbidden
        claim_type: other_role_exclusive_denied
        grounds:
          - validations.priority_2_ERR_ROLE_NOT_PERMITTED
          - validations.priority_10_path_ids
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Priority 2 sits above path resolution at 10, so an unauthorised caller cannot use 404-versus-403 as an existence oracle: an entirely fictional id returns the same 403 as a real one."
        test_recipe:
          setup:
            - "An empty database, so the id used below certainly does not exist."
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-integrity/shrink-periods/00000000-0000-4000-8000-0000000000ff/final-close"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\", NOT 404 ERR_SHRINK_PERIOD_NOT_FOUND"
            - "the same request with no X-User-Role header returns 401 ERR_UNAUTHENTICATED, so priority 1 in turn outranks priority 2"
            - "the same request as ShrinkController u_ctrl_1 returns 404 ERR_SHRINK_PERIOD_NOT_FOUND, which is how the ladder becomes observable"
            - "an entity_backed role presenting a well-formed but unknown scoping id on a path it does hold returns 403 ERR_IDENTITY_SCOPE_VIOLATION rather than a not-found for the identity"

      - name: same_user_cannot_review_the_step_they_authored
        claim_type: segregation_of_duties
        grounds:
          - roles.InventorySupervisor
          - errors.ERR_SEGREGATION_OF_DUTIES
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / sod_beats_supervisor_cap_on_adjustment_approve"
          rationale: "That instance covers the segregation-of-duties axis at its hardest point — the requester's own approval is refused even though a second supervisor would be refused for a different reason — and asserts the successful third-party path, so a separate corner adds nothing."

  # ==========================================================================
  # Cross-cutting complexity layers — complexity_profile.complexity_layers is
  # [optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  # rate_threshold_triggers]. Each of the three §1.2.1 concurrency rules gets
  # its own stale-version instance using that rule's declared write_endpoint
  # and occ_field.
  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: adjustment_create_with_stale_position_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.adjustment-create-stale-position
          - errors.ERR_STALE_STOCK_POSITION_VERSION
          - validations.priority_30_ERR_STALE_STOCK_POSITION_VERSION
        distinguishing_aspect: "The position's version moves for reasons that have nothing to do with adjustments — here a failed tag verification sets tag_integrity_hold — so an analyst holding a read from before that cascade is forced to re-read before authoring a correction."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Item TEE-001 at 1234 cents with SGTIN_96 / prefix 7, and a stock position at S100 with 100 on-hand whose version is captured immediately after creation."
            - "A TagBatch of 1000 units is then encoded, received and verified with sampled 50 / readable 48 — read_rate_bps 9600 < 9800, outcome FAIL — which writes tag_integrity_hold true onto that position and advances its version."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id", pos_v_stale: "$.data.version" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch1}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
            - call: "POST /inventory-integrity/tag-batches/${batch1}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches/${batch1}/verify"
              payload: { sampled_units: 50, readable_units: 48, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
          trigger:
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: -20, reason_code: "THEFT", expected_stock_position_version: "${pos_v_stale}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 412 and data.error_id == \"ERR_STALE_STOCK_POSITION_VERSION\""
            - "GET /inventory-integrity/adjustments?stock_position_id=${pos_tee1} returns total_count 0 — nothing was created"
            - "GET /inventory-integrity/stock-positions/${pos_tee1} reads a version strictly greater than the captured stale value, tag_integrity_hold true, and on_hand_units still 100"
            - "re-issuing the identical body with the version from that fresh read returns 201 with approval_state \"PENDING\", so the only defect was the stale read"
            - "the 412 leaves the position's version unchanged: a failed OCC write does not itself bump the counter"

      - name: physical_inventory_line_with_stale_inventory_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.physical-line-submit-stale-inventory
          - errors.ERR_STALE_PHYSICAL_INVENTORY_VERSION
        distinguishing_aspect: "Here the OCC guard protects a legitimate supersede edge: a second line for the same item replaces the first, so a counter working from a stale read would silently overwrite an aggregate that another crew member has already moved."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Items TEE-001 at 1234 cents and TEE-002 at 2500 cents, a stock position at S100 for each (100 and 40 on-hand), CounterFirm CF1 TIER_1 max_lines_per_pass 500."
            - "A PhysicalInventory for (S100, CF1) scheduled 2026-09-10..2026-09-12, started — the version at that moment is captured — and then given one line for TEE-001, which advances the inventory's version."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-002", description: "V-neck tee", unit_cost_cents: 2500, retail_price_cents: 4999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee2: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee2}", baseline_on_hand_units: 40, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee2: "$.data.id" }
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counting Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { firm1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${firm1}", scheduled_start_date: "2026-09-10", scheduled_end_date: "2026-09-12", recount_threshold_bps: 150 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/start"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pi_v_stale: "$.data.version" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 100, expected_physical_inventory_version: "${pi_v_stale}" }
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { pil1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee2}", counted_units: 40, expected_physical_inventory_version: "${pi_v_stale}" }
              as: ThirdPartyCounter
              as_user_id: "${firm1}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the first line, quoting the version read at start, was accepted with 201 — the same value is only stale on the second attempt"
            - "response status 412 and data.error_id == \"ERR_STALE_PHYSICAL_INVENTORY_VERSION\""
            - "GET /inventory-integrity/physical-inventory-lines?physical_inventory_id=${pi1} returns total_count 1"
            - "re-issuing the TEE-002 line with the version from a fresh GET of the inventory returns 201, and a THIRD line re-counting TEE-001 with the then-current version returns 201 while the original TEE-001 line flips to superseded true"
            - "GET /inventory-integrity/physical-inventory-lines?physical_inventory_id=${pi1}&superseded=false returns total_count 2 once both items are counted and the recount has landed"

      - name: cause_proposal_with_stale_investigation_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.cause-proposal-stale-investigation
          - errors.ERR_STALE_INVESTIGATION_VERSION
        distinguishing_aspect: "CAUSE_PROPOSED -> CAUSE_PROPOSED is a legal supersede edge, so without the guard a second analyst could overwrite a colleague's evidence note; the assignment step alone is enough to invalidate a pre-assignment read."
        test_recipe:
          setup:
            - "Category APPAREL (tolerance 2 units / 20000 cents), Store S100, Vendor VEND1, Item TEE-001 at 1234 cents, a stock position with 100 on-hand, and an OPEN ShrinkPeriod for S100 covering 2026-07-01..2026-09-30."
            - "A started count task on the 2026-08-01..2026-08-03 window with one line counting 90 units, submitted — which mints one OPEN investigation. Its version is captured from the investigation read, then the investigation is assigned to u_analyst_2, advancing the version."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/shrink-periods"
              payload: { store_id: "${store_s100}", period_start: "2026-07-01", period_end: "2026-09-30", sales_at_cost_cents: 5000000 }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { sp1: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { task1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/start"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/count-tasks/${task1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 90, read_mode_used: "HANDHELD" }
              as: StoreOps
              as_user_id: "${store_s100}"
              captures: { line1: "$.data.id" }
            - call: "POST /inventory-integrity/count-tasks/${task1}/submit"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "GET /inventory-integrity/variance-investigations"
              payload: {}
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { inv1: "$.data[0].id", inv_v_stale: "$.data[0].version" }
            - call: "POST /inventory-integrity/variance-investigations/${inv1}/assign"
              payload: { assigned_investigator_id: "u_analyst_2" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          trigger:
            - call: "POST /inventory-integrity/variance-investigations/${inv1}/propose-cause"
              payload: { proposed_root_cause: "PROCESS_ERROR", evidence_note: "Receiving mis-scan on 2026-07-28", expected_investigation_version: "${inv_v_stale}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_2"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 412 and data.error_id == \"ERR_STALE_INVESTIGATION_VERSION\""
            - "GET /inventory-integrity/variance-investigations/${inv1} still reads status \"IN_REVIEW\", proposed_root_cause null and evidence_note null"
            - "re-issuing the identical body with the version from that fresh read returns 200 with status \"CAUSE_PROPOSED\""
            - "a second proposal quoting the version captured BEFORE the first proposal returns 412 again, so the supersede edge cannot be walked from a stale read even though the edge itself is legal"
            - "a supervisor return of the proposal advances the version once more, and the next proposal must quote that newest value"

      - name: vendor_sample_band_crosses_at_nine_thousand_bps
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.tag_verification_outcome
          - global_constants.TAG_PASS_REWARD_BPS
          - global_constants.TAG_FAIL_PENALTY_BPS
          - entities.Vendor.fields.required_verification_sample_pct
        distinguishing_aspect: "The vendor's sampling obligation is a cumulative rate threshold with asymmetric steps — one FAIL costs 1500 bps while each PASS earns only 200 — so recovery takes four consecutive passes, and the band flips back exactly when the score reaches 9000, not above it."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1 fresh at tag_compliance_score_bps 10000 and required_verification_sample_pct 5, Item TEE-001 with SGTIN_96 / prefix length 7."
            - "Batch A of 1000 units is encoded (freezing required_sample_units at ceil(1000 * 5 / 100) = 50), received, and verified sampled 50 / readable 48 -> read_rate_bps 9600 < 9800 -> FAIL, so the score falls to max(0, 10000 - 1500) = 8500 and the band moves to 10 percent."
            - "Batch B of 1000 units is then encoded, freezing required_sample_units at ceil(1000 * 10 / 100) = 100, received, and verified sampled 100 / readable 100 -> PASS, score 8700."
            - "Batch C, identical, PASS -> score 8900, still inside the 10 percent band because 8900 < 9000."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch_a: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch_a}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
            - call: "POST /inventory-integrity/tag-batches/${batch_a}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches/${batch_a}/verify"
              payload: { sampled_units: 50, readable_units: 48, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch_b: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch_b}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
            - call: "POST /inventory-integrity/tag-batches/${batch_b}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches/${batch_b}/verify"
              payload: { sampled_units: 100, readable_units: 100, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch_c: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch_c}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
            - call: "POST /inventory-integrity/tag-batches/${batch_c}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches/${batch_c}/verify"
              payload: { sampled_units: 100, readable_units: 100, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
            - call: "POST /inventory-integrity/tag-batches"
              payload: { vendor_id: "${vendor1}", item_id: "${item_tee1}", destination_store_id: "${store_s100}", quantity_encoded: 1000 }
              as: VendorRep
              as_user_id: "${vendor1}"
              captures: { batch_d: "$.data.id" }
            - call: "POST /inventory-integrity/tag-batches/${batch_d}/encode"
              payload: { encoding_scheme: "SGTIN_96", epc_prefix: "0614141" }
              as: VendorRep
              as_user_id: "${vendor1}"
            - call: "POST /inventory-integrity/tag-batches/${batch_d}/receive"
              payload: {}
              as: StoreOps
              as_user_id: "${store_s100}"
          trigger:
            - call: "POST /inventory-integrity/tag-batches/${batch_d}/verify"
              payload: { sampled_units: 100, readable_units: 100, duplicate_epc_count: 0, unencoded_units: 0 }
              as: StoreOps
              as_user_id: "${store_s100}"
              captures: { outcome: "$.data.verification_outcome" }
          assert:
            - "response status 200 with data.read_rate_bps 10000 and data.verification_outcome \"PASS\""
            - "GET /inventory-integrity/vendors/${vendor1} reads tag_compliance_score_bps 9100 and required_verification_sample_pct 5 — the fourth consecutive pass carried 8900 + 200 = 9100 over the 9000 boundary"
            - "before this trigger the same read gave tag_compliance_score_bps 8900 and required_verification_sample_pct 10, so the band flipped on this single write and nothing else changed"
            - "a batch of 1000 units encoded AFTER this trigger freezes required_sample_units at 50 again, while batch_d keeps its frozen 100 — the band is read at encode time, not at verify time"
            - "the reward is capped: from 9900 a PASS gives min(10000, 10100) = 10000, and from 500 a FAIL gives max(0, -1000) = 0, at which point required_verification_sample_pct is 20"

      # ---- layers whose sharpest form already lives in §1.8 ----

      - name: adjustment_post_cascade_reaches_store_posture
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - calculations.position_promising_state
          - calculations.store_fulfillment_posture
        excluded_because:
          difficulty_instance: "transitive_cascade / adjustment_post_cascades_position_to_store_fulfillment"
          rationale: "That instance walks the full three-hop chain adjustment -> position on-hand and accuracy -> promising_state -> store fulfillment posture and asserts every hop's field, which is exactly this layer's end-to-end claim."

      - name: investigation_close_cascade_reaches_shrink_and_vendor
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - calculations.shrink_attribution
        excluded_because:
          difficulty_instance: "transitive_cascade / investigation_close_cascades_shrink_vendor_tag_sample"
          rationale: "That instance covers the second, independent cascade fan-out — investigation close moving the shrink buckets, the vendor's shortage exposure and the tag sampling obligation — including the conditional hop that fires only for VENDOR_SHORTAGE."

      - name: cascade_reversal_leaves_no_drift
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.CountTask
        excluded_because:
          difficulty_instance: "compensating_invariant / count_return_to_count_waives_investigations_and_restores_shrink_unresolved"
          rationale: "Partial-undo behaviour of a cascade is asserted there: return-to-count waives the spawned investigations and restores the shrink period's unresolved bucket to its pre-submit value, proving the reverse path is symmetric."

      - name: shrink_attribution_variant_switch_applies_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.shrink_attribution.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / shrink_attribution_provisional_vs_final_diverge"
          rationale: "That instance runs the same data through the provisional and final variants, shows the non-terminal investigation parked in unresolved_cents by one and dropped by the other, and pins the delta applied at the switch."

      - name: accuracy_variant_unit_versus_value
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.stock_accuracy_pct.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / stock_accuracy_unit_vs_value_diverge"
          rationale: "That instance produces two different percentages from one count and shows which variant each consumer reads, covering both variant divergence and variant selection for this layer."

      - name: tolerance_threshold_evaluated_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.count_variance_valuation
        excluded_because:
          difficulty_instance: "boundary_precision_check / variance_value_exactly_at_tolerance_opens_investigation"
          rationale: "The instantaneous-threshold half of this layer is asserted there at exactly the tolerance value, where the rule's strict-versus-inclusive comparison decides whether an investigation is minted."

  # ==========================================================================
  # Consistency model — immediate: every derived field, cascade hop and ledger
  # bucket must be readable in the very response that caused it.
  # ==========================================================================
  - section: consistency_model
    instances:

      - name: posting_response_already_carries_every_derived_field
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_adjustments_post
        distinguishing_aspect: "The consistency model is immediate, so the posting response itself — not a later GET — must already show the re-derived position, and a read issued straight afterwards must agree with it field for field."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, Item TEE-001 at 1234 cents, a stock position at S100 with 100 on-hand and no tag hold."
            - "An adjustment of -20 units for THEFT is created quoting the current position version (value_impact 24680 >= threshold 10000, so approval_state is PENDING) and approved by a supervisor who is not its requester."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96", epc_prefix_length: 7 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id", pos_v1: "$.data.version" }
            - call: "POST /inventory-integrity/stock-positions/${pos_tee1}/adjustments"
              payload: { delta_units: -20, reason_code: "THEFT", expected_stock_position_version: "${pos_v1}" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { adj1: "$.data.id" }
            - call: "POST /inventory-integrity/adjustments/${adj1}/approve"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
          trigger:
            - call: "POST /inventory-integrity/adjustments/${adj1}/post"
              payload: {}
              as: InventorySupervisor
              as_user_id: "u_super_1"
              captures: { posting_state: "$.data.posting_state" }
          assert:
            - "response status 200 with data.posting_state \"POSTED\", data.approval_state \"APPROVED\" and data.posted_at \"2026-08-01T00:00:00Z\" — no field is left for a later refresh to fill in"
            - "GET /inventory-integrity/stock-positions/${pos_tee1} issued immediately afterwards reads on_hand_units 80 and a version strictly greater than the captured pos_v1"
            - "GET /inventory-integrity/stock-positions/${pos_tee1}/accuracy issued immediately afterwards already reflects the new on-hand rather than the pre-posting figure"
            - "GET /inventory-integrity/adjustments?stock_position_id=${pos_tee1}&posting_state=POSTED returns total_count 1 on the first attempt, with no retry needed"
            - "no second read ever changes an answer: repeating each GET returns byte-identical data, so there is no eventual-consistency window to observe"

      - name: reversal_is_visible_and_conserving_in_one_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_adjustments_reverse
        excluded_because:
          difficulty_instance: "compensating_invariant / adjustment_reverse_conserves_on_hand_units"
          rationale: "That instance reverses a posted adjustment and asserts the position returns to its pre-posting on-hand within the same call chain, which simultaneously demonstrates immediate visibility of the compensating write."
