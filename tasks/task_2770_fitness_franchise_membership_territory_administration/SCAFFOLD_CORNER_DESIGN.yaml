      - name: corner_allocating_a_pool_with_no_enrolled_agreement_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_ELIGIBLE_FRANCHISEE
          - calculations.corporate_allocation
        distinguishing_aspect: "An ACTIVE, nationally eligible franchisee still carries weight 0 while no agreement names the corporate account, so the eligible set is empty and the allocation is refused with ERR_NO_ELIGIBLE_FRANCHISEE - the funded 100000-cent pool is left intact rather than being silently retained or spread over zero recipients."
        test_recipe:
          setup:
            - "One ACTIVE nationally eligible franchisee with no membership agreements at all."
            - "One USAGE_SHARE corporate account funded with 100000 cents and never allocated."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example", national_account_eligible: true }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/corporate-accounts"
              payload: { name: "Meridian Logistics", corporate_credit_pct: 0.045, allocation_method: "USAGE_SHARE" }
              as: BrandAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /franchise/corporate-accounts/${ca_id}/fund"
              payload: { amount_cents: 100000 }
              as: BrandAdministrator
          trigger:
            - call: "POST /franchise/corporate-accounts/${ca_id}/allocate"
              payload: { note: "Nobody is enrolled." }
              as: BrandAdministrator
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_NO_ELIGIBLE_FRANCHISEE"
            - "CorporateAccount.${ca_id}.enrolled_agreement_count == 0"
            - "CorporateAccount.${ca_id}.pool_balance_cents == 100000"
            - "CorporateAccount.${ca_id}.allocated_cents == 0"
            - "CorporateAccount.${ca_id}.lifetime_funded_cents == 100000"
            - "Franchisee.${f1_id}.corporate_allocation_cents == 0"

