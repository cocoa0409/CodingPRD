        distinguishing_aspect: "Zero/empty-collection edge on POST /downloads: a plan with download_quota_per_profile=0 rejects the very FIRST download (0 < 0 is false) with ERR_DOWNLOAD_QUOTA_REACHED — a different metric (collection-count vs the numeric cadence boundary) on a different endpoint."
