  - rule_id: cross_entity_state_dependency
    instances:
      - name: dual_energy_configuration_approval_blocked_until_second_agency_listing_completes_scope_coverage
        grounds:
          - validations[priority=26]
          - calculations.certification_posture
          - state_machines.ChainConfiguration.ENG_REVIEW_to_ENG_APPROVED
          - state_machines.CertificationListing.UNDER_REVIEW_to_LISTED
        distinguishing_aspect: |
          The gating state does not live on the ChainConfiguration or on any ancestor of it in the
          write path: it is the DERIVED certification_posture of the EquipmentModel, which is itself
          a union over sibling CertificationListing rows. A DUAL-energy model needs all three scopes,
          so an AGENCY_ALPHA listing alone leaves posture PARTIAL and engineering approval is
          rejected; granting a second, independent AGENCY_BETA listing flips posture to LISTED and
          the identical approval call then succeeds with no change to the configuration itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "EquipmentModel GRL-500 with energy_type DUAL, so required_scopes is [SANITATION, GAS, ELECTRICAL]."
            - "One AGENCY_ALPHA CertificationListing GRANTed for scopes [SANITATION] only, leaving certification_posture PARTIAL."
            - "ChainAccount CHN-1 and ChainConfiguration CFG-1 on that model with a PASSED PerformanceValidation, submitted so status is ENG_REVIEW."
