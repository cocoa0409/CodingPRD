      - name: demographics_sync_idempotent_duplicate
        claim_type: idempotency
        grounds: [endpoints, entities.DemographicsSyncJob.fields.idempotency_key, entities.Patient.fields.demographics_revision]
        distinguishing_aspect: "Two POST /demographics-sync-jobs with the same idempotency_key on the same session: the first COMMITTED bumps patient.demographics_revision to 2; the second returns SKIPPED_DUPLICATE and does not bump again."
        test_recipe:
          setup: ["Session opened; patient demographics_revision starts at 1."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE21" }
