  - rule_id: resource_temporal_overlap
    instances:
      - name: route_window_overlap_on_vehicle
        grounds:
          - validations[priority=8]
          - errors[ERR_ROUTE_WINDOW_CONFLICT]
          - entities.Route.fields.window_start
          - entities.Route.fields.window_end
        distinguishing_aspect: |
          A second Route on the same vehicle and service_date with window [11:00,13:00) overlapping the first
          [09:00,12:00) is rejected with ERR_ROUTE_WINDOW_CONFLICT under half-open interval semantics on the
          Vehicle resource (adjacency prev.end==new.start would be allowed).
        test_recipe:
          setup:
            - "Partner; vehicle capacity 100; route1 [09:00,12:00) on the vehicle for 2026-03-15."
          setup_api_calls:
            - call: "POST /partners"
              payload: { name: "WinCo", region_code: "CA-BAY", tax_id: "EIN-15", accepted_categories: ["FURNITURE"] }
              as: PlatformAdmin
              captures: { partner_id: $.data.id }
