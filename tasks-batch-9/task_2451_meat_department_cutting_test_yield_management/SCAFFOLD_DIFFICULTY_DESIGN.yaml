      - name: pre_order_staging_gated_on_case_plan_line_hold_state
        grounds:
          - state_machines.PreOrder.CONFIRMED_to_STAGED
          - state_machines.CasePlan.PUBLISHED_to_SUSPENDED
          - state_machines.CasePlan.SUSPENDED_to_PUBLISHED
          - state_machines.CasePlanLine.FILLED_to_HELD
          - errors[ERR_LINE_ON_HOLD]
          - entities.CasePlanLine.fields.staged_lb
        distinguishing_aspect: |
          The gating pair is PreOrder <- CasePlanLine across two aggregates: the STAGE transition
          is refused with ERR_LINE_ON_HOLD (409) while the target line is HELD because its plan
          was SUSPENDED, and the byte-identical STAGE succeeds after RESUME returns the line to
          FILLED — the PreOrder never leaves CONFIRMED in between, so the flip is caused purely
          by the other entity's state. The sibling instance gates a RetailItem activation on a
          CuttingTest.
