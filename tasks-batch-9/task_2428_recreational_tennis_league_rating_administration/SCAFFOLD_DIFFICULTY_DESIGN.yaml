  # ===========================================================================
  # RULE 9 — compensating_invariant
  # Three DIFFERENT conserved quantities, each restored by a different
  # compensating action:
  #   9a: the weighted strike ledger (issue -> rescind)
  #   9b: the league standings ledger invariants A-D (verify -> forfeit void)
  #   9c: the provisional standings credit (submit -> dispute -> amend)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: strike_rescission_restores_the_weighted_ledger_and_only_its_own_spots
        grounds:
          - calculations.strike_weight_ledger
          - state_machines.Strike.ACTIVE_to_RESCINDED
          - state_machines.Player.STRIKE_SUSPENDED_to_ACTIVE
          - entities.RosterSpot.fields.source_strike_id
          - entities.Team.fields.roster_compliant
        distinguishing_aspect: |
          The conserved quantity is Player.strike_count == SUM(weight of ACTIVE strikes): issuing
          the weight-2 strike takes h2 from 1 to 3 and suspends him, and rescinding exactly that
          strike returns the ledger to 1 with Player ACTIVE, RosterSpot ACTIVE and both
          ineligible_reason and source_strike_id cleared, while the untouched weight-1
          NO_SHOW_DEFAULT strike stays ACTIVE. Team.active_roster_size and roster_compliant and
          League.noncompliant_team_count all return to their pre-issue values, so an
          implementation that recomputes the ledger by subtracting a flat 1, or that restores
          every INELIGIBLE spot rather than only those whose source_strike_id matches, diverges.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with strike_limit 3 and disqualification_strike_limit 6; SECTION league with min_active_roster_size 2."
            - "Team H (captain h1 plus h2) and Team A (captain a1 plus a2) are IN_PLAY with two ACTIVE spots each, both roster_compliant, League.noncompliant_team_count 0."
            - "Player h2 already carries one NO_SHOW_DEFAULT strike sh1 of weight 1, so strike_count is 1 and h2 is ACTIVE."
            - "Player pch backs the CommitteeChair and holds no roster spot."
            - "Clock stays at 2026-08-08T00:00:00Z and no match exists, so the ledger is the only thing that can move a player's status."
          setup_api_calls:
            - { call: "POST /tennis/sections", payload: { code: "SOCAL-2026", name: "Southern California", season_year: 2026, min_matches_for_playoff_eligibility: 1, strike_limit: 3, disqualification_strike_limit: 6 }, as: SectionAdmin, captures: { sec: $.data.id } }
            - { call: "POST /tennis/facilities", payload: { section_id: "${sec}", name: "Balboa Courts", court_count: 3, turnaround_buffer_minutes: 30 }, as: SectionAdmin, captures: { fac: $.data.id } }
            - { call: "POST /tennis/leagues", payload: { section_id: "${sec}", tier: "SECTION", ntrp_level: 4.0, age_group: "AGE_18_OVER", format: "MENS_DOUBLES", lines_per_match: 3, min_active_roster_size: 2, max_teams: 8, match_duration_minutes: 180, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-08T00:00:00Z", roster_lock_at: "2026-08-08T00:00:00Z", season_end_at: "2026-10-31T00:00:00Z" }, as: SectionAdmin, captures: { lg: $.data.id } }
            - { call: "POST /tennis/leagues/${lg}/open-registration", payload: {}, as: SectionAdmin }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H1 Alvarez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H2 Boyd", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A1 Garza", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A2 Haruki", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "Chair Nakamura", birth_year: 1975, gender: "M" }, as: SectionAdmin, captures: { pch: $.data.id } }
            - { call: "POST /tennis/players/${ph1}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${ph2}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa1}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa2}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
