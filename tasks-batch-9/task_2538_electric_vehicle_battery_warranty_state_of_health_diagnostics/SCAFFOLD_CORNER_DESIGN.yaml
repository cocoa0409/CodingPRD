            - call: "GET /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: {}
              as: VehicleOwner
              as_user_id: "${veh_id}"
          assert:
            - "the technician's snapshot ingest returns 403 ERR_UNAUTHORIZED - TelematicsGateway is the only writer of that route"
            - "the gateway's assessment create returns 403 ERR_UNAUTHORIZED and no vehicle version is consumed"
            - "the adjudicator's vehicle create returns 403 ERR_UNAUTHORIZED and GET /battery-warranty/vehicles still has total_count 1"
            - "the owner's thermal event create returns 403 ERR_UNAUTHORIZED - the route admits only ServiceTechnician and TelematicsGateway"
            - "the owner's snapshot LISTING returns 200 with total_count 0 - the read side of the same resource is open to all seven roles"

      - name: adjudicate_with_missing_required_actor_header_returns_actor_required
