scaffold_corner_design:
  - section: entities
    instances:
      - name: contractor_creation_applies_system_defaults
        claim_type: creation
        grounds: [entities.Contractor.fields.status, entities.Contractor.fields.workmanship_score]
        distinguishing_aspect: "A freshly created contractor has status ACTIVE, workmanship_score 100, complaint_score_24mo 0, lifetime_substantiated_count 0, outstanding_liability_cents 0, version 1."
        test_recipe:
          setup: ["empty DB, clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /program/contractors", payload: { legal_name: "New Co", license_number: "LIC-N", license_expiry: "2030-01-01", insurance_expiry: "2030-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cn_id: $.data.id } }
          trigger:
            - { call: "GET /program/contractors/${cn_id}", payload: {}, as: ProgramAdmin }
          assert:
            - "status == ACTIVE, workmanship_score == 100, complaint_score_24mo == 0, lifetime_substantiated_count == 0, outstanding_liability_cents == 0, version == 1"

      - name: get_contractor_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_RESOURCE_NOT_FOUND, not 400 or 500."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /program/contractors/11111111-2222-3333-4444-555555555555", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "status == 404 and error_id == ERR_RESOURCE_NOT_FOUND"

      - name: contractor_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field insurance_expiry yields 400 ERR_INVALID_REQUEST before any existence or state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program/contractors", payload: { legal_name: "Bad Co", license_number: "LIC-X", license_expiry: "2030-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: contractor_create_client_supplied_version_input_ignored
        claim_type: system_fields
        grounds: [entities.Contractor.fields.workmanship_score]
        distinguishing_aspect: "Client-supplied system/computed fields (id, version, workmanship_score) in a create payload are ignored; the server mints id and starts version at 1, score at 100."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /program/contractors", payload: { legal_name: "Sneaky Co", license_number: "LIC-SN", license_expiry: "2030-01-01", insurance_expiry: "2030-01-01", territory_codes: ["T1"], version: 99, workmanship_score: 5 }, as: ProgramAdmin, captures: { cs_id: $.data.id, cs_v: $.data.version, cs_score: $.data.workmanship_score } }
          assert:
            - "response version == 1 and workmanship_score == 100 (client-supplied values ignored)"

      - name: registration_component_duplicate_type_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_COMPONENT_TYPE]"]
        distinguishing_aspect: "Two component lines with the same component_type on one registration are rejected even though each line is individually valid."
        test_recipe:
          setup:
            - "BRONZE contractor with ACTIVE cert and a DRAFT registration; catalog has two SHINGLE SKUs"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Dup Co", license_number: "LIC-DU", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cd_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cd_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cd_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cd_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H DU", property_postal_code: "30012", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cd_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G2", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cd_id}" }
          trigger:
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G2", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cd_id}", captures: { err: $.data.error_id } }
          assert:
            - "status == 409 and error_id == ERR_DUPLICATE_COMPONENT_TYPE"

      - name: claim_evidence_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.WarrantyClaim.fields.evidence, "validations[priority=3]"]
        distinguishing_aspect: "evidence_type VIDEO is not in {PHOTO, CORE_SAMPLE, DOCUMENT} and is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "ACTIVE registration with one filed claim (SUBMITTED)"
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Enum Co", license_number: "LIC-EN", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { ce_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${ce_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${ce_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${ce_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H EN", property_postal_code: "30013", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${ce_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ce_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ce_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ce_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ce_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "c", claim_labor_cost_cents: 1000 }, as: Claimant, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "VIDEO", note: "clip" }, as: Claimant, captures: { err: $.data.error_id } }
          assert:
            - "status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: lead_assignment_end_before_start_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.LeadAssignment.fields.end_date]
        distinguishing_aspect: "end_date <= start_date is a schema-level 400, checked before any territory/overlap logic."
        test_recipe:
          setup: ["distributor exists (any), contractor reference need not resolve because schema check fires first"]
          setup_api_calls:
            - { call: "POST /program/distributors", payload: { name: "Dist V", territory_codes: ["T1"], lead_pool_total: 1 }, as: ProgramAdmin, captures: { dist_id: $.data.id } }
          trigger:
            - { call: "POST /program/lead-assignments", payload: { distributor_id: "${dist_id}", contractor_id: "11111111-2222-3333-4444-555555555555", territory_code: "T1", required_tier: "BRONZE", start_date: "2026-11-01", end_date: "2026-10-01" }, as: Distributor, as_user_id: "${dist_id}", captures: { err: $.data.error_id } }
          assert:
            - "status == 400 and error_id == ERR_INVALID_REQUEST (schema priority 3 beats existence priority 4 for the unknown contractor_id)"

  - section: state_machines
    instances:
      - name: certification_initial_state_pending_verification
        claim_type: initial_state
        grounds: [state_machines.Certification]
        distinguishing_aspect: "A newly applied certification starts in PENDING_VERIFICATION, not ACTIVE."
        test_recipe:
          setup: ["BRONZE-eligible contractor"]
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Init Co", license_number: "LIC-IN", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { ci_id: $.data.id } }
          trigger:
            - { call: "POST /program/certifications", payload: { contractor_id: "${ci_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${ci_id}", captures: { st: $.data.status } }
          assert:
            - "response status == PENDING_VERIFICATION"

      - name: claim_evidence_auto_transition_at_second_photo
        claim_type: valid_transition
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_EVIDENCE_REVIEW]
        distinguishing_aspect: "The SUBMITTED -> EVIDENCE_REVIEW transition is automatic when photo_count reaches exactly 2: one photo leaves the claim SUBMITTED; the second photo flips it in the same response."
        test_recipe:
          setup: ["ACTIVE registration with a filed claim"]
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Auto Co", license_number: "LIC-AU", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${ca_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${ca_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${ca_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H AU", property_postal_code: "30014", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${ca_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ca_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ca_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ca_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${ca_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "c", claim_labor_cost_cents: 1000 }, as: Claimant, captures: { claim_id: $.data.id } }
          trigger:
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "one" }, as: Claimant, captures: { st1: $.data.status, pc1: $.data.photo_count } }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "two" }, as: Claimant, captures: { st2: $.data.status, pc2: $.data.photo_count } }
          assert:
            - "after first PHOTO: status == SUBMITTED, photo_count == 1"
            - "after second PHOTO: status == EVIDENCE_REVIEW, photo_count == 2 (auto-transition fires at exactly 2)"

      - name: claim_denied_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WarrantyClaim, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After adjudicate with NO_DEFECT the claim is DENIED (terminal); any further evidence post returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["claim in EVIDENCE_REVIEW (2 photos) then adjudicated NO_DEFECT"]
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Deny Co", license_number: "LIC-DE", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { cde_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${cde_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${cde_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${cde_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H DE", property_postal_code: "30015", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${cde_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cde_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cde_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cde_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${cde_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "c", claim_labor_cost_cents: 1000 }, as: Claimant, captures: { claim_id: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "x" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "y" }, as: Claimant, captures: { cv: $.data.version } }
            - { call: "POST /program/warranty-claims/${claim_id}/adjudicate", payload: { determination: "NO_DEFECT", expected_claim_version: "${cv}" }, as: ProgramAdmin, captures: { st_denied: $.data.status } }
          trigger:
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "late" }, as: Claimant, captures: { err: $.data.error_id } }
          assert:
            - "adjudicate with NO_DEFECT yields status == DENIED and no RemedyAllocation (GET remedy-allocation returns empty array)"
            - "post-denial evidence call returns 409 ERR_INVALID_STATE"

      - name: inspection_order_complete_before_schedule_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.InspectionOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a REQUESTED (never scheduled) order is not a declared transition and returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["claim in INSPECTION_REQUESTED with one REQUESTED order"]
          setup_api_calls:
            - { call: "POST /program/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /program/contractors", payload: { legal_name: "Ord Co", license_number: "LIC-OR", license_expiry: "2035-01-01", insurance_expiry: "2035-01-01", territory_codes: ["T1"] }, as: ProgramAdmin, captures: { co_id: $.data.id } }
            - { call: "POST /program/training-courses", payload: { title: "Basics", credits: 4, validity_months: 36 }, as: ProgramAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /program/training-enrollments", payload: { contractor_id: "${co_id}", course_id: "${course_id}" }, as: ProgramAdmin, captures: { enr_id: $.data.id } }
            - { call: "POST /program/training-enrollments/${enr_id}/complete", payload: { completed_at: "2026-09-01" }, as: ProgramAdmin }
            - { call: "POST /program/certifications", payload: { contractor_id: "${co_id}", tier: "BRONZE" }, as: Contractor, as_user_id: "${co_id}", captures: { cert_id: $.data.id } }
            - { call: "POST /program/certifications/${cert_id}/verify", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - { call: "POST /program/warranty-registrations", payload: { certification_id: "${cert_id}", homeowner_name: "H OR", property_postal_code: "30016", install_date: "2026-09-10" }, as: Contractor, as_user_id: "${co_id}", captures: { reg_id: $.data.id } }
            - { call: "POST /program/component-catalog-items", payload: { sku: "SH-G", component_type: "SHINGLE", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "UN-G", component_type: "UNDERLAYMENT", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "ST-G", component_type: "STARTER", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/component-catalog-items", payload: { sku: "RC-G", component_type: "RIDGE_CAP", manufacturer: "GAF" }, as: ProgramAdmin }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "SH-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${co_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "UN-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${co_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "ST-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${co_id}" }
            - { call: "POST /program/registration-components", payload: { registration_id: "${reg_id}", catalog_sku: "RC-G", material_cost_cents: 25000 }, as: Contractor, as_user_id: "${co_id}" }
            - { call: "POST /program/warranty-registrations/${reg_id}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /program/warranty-claims", payload: { registration_id: "${reg_id}", description: "c", claim_labor_cost_cents: 1000 }, as: Claimant, captures: { claim_id: $.data.id } }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "x" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_id}/evidence", payload: { evidence_type: "PHOTO", note: "y" }, as: Claimant }
            - { call: "POST /program/warranty-claims/${claim_id}/request-inspection", payload: {}, as: ProgramAdmin, captures: { ord_id: $.data.id } }
          trigger:
