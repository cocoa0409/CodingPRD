              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Incumbent", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T11:00:00Z", planned_headcount: 40, guaranteed_headcount: 40, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
