            - "err1 == ERR_QUALIFICATION_MISMATCH (sub A holds SCIENCE only)"
            - "err2 == ERR_SUBSTITUTE_DO_NOT_RETURN (ACTIVE DNR mark; safety layer beats qualification which would have passed)"

      - name: substitute_activation_gating_and_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Substitute.PENDING_CLEARANCE_to_ACTIVE
          - errors[ERR_SUBSTITUTE_INVALID_STATE]
          - errors[ERR_CLEARANCE_INVALID]
        distinguishing_aspect: "Activation without verified required clearances fails ERR_CLEARANCE_INVALID; activating an already-ACTIVE substitute fails ERR_SUBSTITUTE_INVALID_STATE; suspending a PENDING_CLEARANCE substitute also fails ERR_SUBSTITUTE_INVALID_STATE."
        test_recipe:
          setup: ["Sub A with no clearances; Sub B fully cleared and ACTIVE"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub B", base_daily_rate_cents: 18000 }, as: DistrictAdmin, captures: { subB: $.data.id } }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB1: $.data.id } }
            - { call: "POST /clearances/${clrB1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subB}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clrB2: $.data.id } }
            - { call: "POST /clearances/${clrB2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subB}/activate", payload: {}, as: DistrictAdmin }
          trigger:
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /substitutes/${subA}/suspend", payload: {}, as: DistrictAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /substitutes/${subB}/activate", payload: {}, as: DistrictAdmin, captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_CLEARANCE_INVALID (no verified required clearances)"
            - "err2 == ERR_SUBSTITUTE_INVALID_STATE (suspend requires ACTIVE; A is PENDING_CLEARANCE)"
            - "err3 == ERR_SUBSTITUTE_INVALID_STATE (B already ACTIVE)"

  - section: endpoints
    instances:
      - name: absence_list_pagination_and_filters
        claim_type: listing_pagination
        grounds:
          - endpoints[GET /absences]
          - response_envelope
        distinguishing_aspect: "Filter + pagination interact: 3 absences for one teacher with limit 2 returns 2 rows, total_count 3, has_more true; offset 2 returns the final row with has_more false; the fill_status filter narrows the set."
        test_recipe:
          setup: ["Teacher T1 with three non-overlapping 1-day absences (Aug 3, 4, 5); the Aug 5 one cancelled"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-04", end_date: "2026-08-04", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}" }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-05", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs3: $.data.id } }
            - { call: "POST /absences/${abs3}/cancel", payload: {}, as: Teacher, as_user_id: "${t1}" }
          trigger:
            - { call: "GET /absences", payload: { staff_member_id: "${t1}", limit: 2, offset: 0 }, as: DistrictAdmin, captures: { tc: $.total_count, hm: $.has_more, n0: "$.data[0].id" } }
            - { call: "GET /absences", payload: { staff_member_id: "${t1}", limit: 2, offset: 2 }, as: DistrictAdmin, captures: { hm2: $.has_more } }
            - { call: "GET /absences", payload: { staff_member_id: "${t1}", fill_status: "CANCELLED" }, as: DistrictAdmin, captures: { tc3: $.total_count } }
          assert:
            - "Page 1: total_count == 3, has_more == true, exactly 2 rows in data"
            - "Page 2 (offset 2): has_more == false, exactly 1 row"
            - "Filtered by fill_status=CANCELLED: total_count == 1"

      - name: payroll_export_empty_period_and_double_export_lockout
        claim_type: conditional_action
        grounds:
          - state_machines.PayrollPeriod.OPEN_to_EXPORTED
          - errors[ERR_PAYROLL_PERIOD_INVALID_STATE]
        distinguishing_aspect: "Export of a period with nothing in scope succeeds with zero totals, and the EXPORTED period is terminal — a second export fails ERR_PAYROLL_PERIOD_INVALID_STATE."
        test_recipe:
          setup: ["District with no absences at all; period 2026-08-03..2026-08-07"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /payroll-periods", payload: { district_id: "${dist}", period_start: "2026-08-03", period_end: "2026-08-07" }, as: PayrollClerk, captures: { pp: $.data.id } }
          trigger:
            - { call: "POST /payroll-periods/${pp}/export", payload: {}, as: PayrollClerk, captures: { total: $.data.total_payout_cents, npaid: $.data.assignments_paid_count, ncomp: $.data.coverages_compensated_count, st: $.data.status } }
            - { call: "POST /payroll-periods/${pp}/export", payload: {}, as: PayrollClerk, captures: { err: $.data.error_id } }
          assert:
            - "First export: status == EXPORTED, total_payout_cents == 0, assignments_paid_count == 0, coverages_compensated_count == 0, exported_at set"
            - "Second export: error_id == ERR_PAYROLL_PERIOD_INVALID_STATE (409)"

      - name: performance_flag_review_terminal_lockdown
        claim_type: invalid_transition
        grounds:
          - state_machines.PerformanceFlag.OPEN_to_RESOLVED
          - errors[ERR_PERFORMANCE_FLAG_INVALID_STATE]
        distinguishing_aspect: "A RESOLVED flag is terminal: any further review fails ERR_PERFORMANCE_FLAG_INVALID_STATE and creates no mark."
        test_recipe:
          setup: ["Sub and school; MINOR QUALITY flag created and resolved"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /performance-flags", payload: { substitute_id: "${subA}", school_id: "${sch}", flag_type: "QUALITY", severity: "MINOR" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { flag: $.data.id } }
            - { call: "POST /performance-flags/${flag}/review", payload: { decision: "RESOLVE" }, as: DistrictAdmin, captures: { st: $.data.status } }
          trigger:
            - { call: "POST /performance-flags/${flag}/review", payload: { decision: "ESCALATE" }, as: DistrictAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /substitutes/${subA}/marks", payload: {}, as: DistrictAdmin, captures: { nmarks: $.total_count } }
          assert:
            - "First review moved flag to RESOLVED"
            - "Second review: error_id == ERR_PERFORMANCE_FLAG_INVALID_STATE (409)"
            - "No DO_NOT_RETURN mark exists for the substitute (total_count == 0) and trailing score == 97 (single FLAG_MINOR -3)"

