      - name: event_cancel_deep_cascade
        grounds:
          - state_machines.Event.RACE_DAY_to_CANCELLED
          - state_machines.Shift.IN_PROGRESS_to_CANCELLED
          - state_machines.Signup.CHECKED_IN_to_CANCELLED
          - state_machines.DistributionRecord.ISSUED_to_REVOKED
        distinguishing_aspect: |
          Depth-4 cascade from a DIFFERENT trigger (event cancel mid-race, vs the
          no-show trigger above): Event RACE_DAY -> CANCELLED (1) causes Shift
          IN_PROGRESS -> CANCELLED (2) which causes a CHECKED_IN Signup -> CANCELLED
          (3) which causes its ISSUED credential and supply DistributionRecords ->
          REVOKED and decrements SupplyInventory.quantity_issued (4).
        test_recipe:
          setup:
            - "Event RACE_DAY; shift 06:00-14:00 headcount 2; S1 CHECKED_IN holding one credential and one SAFETY_VEST; S2 CONFIRMED"
            - "SupplyInventory SAFETY_VEST quantity_total 1, quantity_issued 1"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
