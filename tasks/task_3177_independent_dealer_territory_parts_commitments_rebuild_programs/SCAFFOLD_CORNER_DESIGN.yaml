          - entities.PartsCommitment.fields.fill_rate_pct
          - entity_services.GET_/dealer-network/machine-population-records/forecast
        distinguishing_aspect: "The commitment read exposes the derived fields together and consistently: fill_rate_pct reads the received-over-reserved ratio while available_commitment_units reads the mandate minus the outstanding reservation, and both move together after a receipt."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. The T-410 commitment is ORDER_READY with an ORDERED batch of 10 units."
          setup_api_calls:
            - *n_clock
            - *n_dealer
            - *n_agree
            - *n_cert1
            - *n_cert2
            - *n_read_dealer
            - *n_commit
            - *n_submit
            - *n_submit_agree
            - *n_ready
            - call: "POST /dealer-network/parts-order-batches"
              payload: { commitment_id: "${cm_id}", product_family: "EXCAVATION", requested_units: 10, core_units: 0, core_return_required: false, requested_at: "2026-08-28T00:00:00Z" }
              as: PartsManager
              captures: { bt_id: $.data.id }
            - call: "POST /dealer-network/parts-order-batches/${bt_id}/place-order"
              payload: {}
              as: PartsManager
          trigger:
            - call: "GET /dealer-network/parts-commitments/${cm_id}"
              payload: {}
              as: PartsManager
          assert:
