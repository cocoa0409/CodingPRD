  - rule_id: resource_temporal_overlap
    instances:
      - name: officer_rest_buffer_treats_a_sixty_minute_gap_as_overlap_on_both_sides
        grounds:
          - calculations.officer_interview_buffer_overlap
          - validations[priority=11]
          - endpoints["POST /investigations/{id}/interview-sessions"]
          - entities.InterviewSession.fields.scheduled_start
