# =============================================================================
# PRD Benchmark Scaffold — Driver Incentive Structures & Weekly Earnings
# Guarantees (rideshare platform)
#
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Driver Incentive Structures & Weekly Earnings Guarantees (Lyft): incentive design
  across ride streaks, bonus zones and time-bounded challenges with eligibility rules,
  earnings guarantee computation comparing actual earnings to a promised threshold with
  make-up payments, incentive targeting to correct supply shortfalls by market, hour and
  geography, driver eligibility gating on acceptance and cancellation rates with appeal
  handling, incentive cost forecasting against ride volume lift and cannibalization,
  promotion stacking rules and exclusion of certain ride types, fraud detection on
  artificially inflated rides and collusion between driver accounts, earnings statement
  transparency and dispute resolution.

domain_name: driver-incentives
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine          # guarantee / streak / zone payout computation
  secondary_archetype: ledger_reconciliation # statement vs settlement reconciliation
  complexity_layers:
    - optimistic_concurrency       # OCC on Market.version and IncentiveProgram.version
    - cascading_side_effects       # fraud confirm → posture → enrollments → settlement recompute
    - dual_variant_calculation     # provisional vs final make-up; acute vs chronic fraud score
    - rate_threshold_triggers      # acceptance/cancellation thresholds gate eligibility
  entity_topology: hybrid          # Market root + flat peers linked by FK
  state_machine_shape: parallel    # Driver carries two independent posture dimensions
  relationship_patterns:
    - one_to_many
    - many_to_many                 # IncentiveEnrollment = Driver × IncentiveProgram junction
    - cross_aggregate              # FraudFlag references ring members across drivers
  role_model: peer_roles           # IncentiveOps, FraudAnalyst, PaymentsOfficer, Driver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (12 entities)
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Unique market code, e.g. SFO, AUS" }
      - { name: geo_cells, type: array, source: input, description: "List of geo cell identifiers that partition the market; incentive targeting addresses these cells" }
      - { name: incentive_budget_cents, type: integer, source: input, description: "Weekly incentive budget ceiling; must be >= 0" }
      - { name: budget_spent_cents, type: integer, source: computed, description: "Sum of make_up_cents on GuaranteeSettlements in PAID status + bonus payout ledger for the current week" }
      - { name: budget_reserved_cents, type: integer, source: computed, description: "Sum of promised_make_up_max_cents across ACTIVE GUARANTEE programs in this market" }
      - { name: budget_available_cents, type: integer, source: computed, description: "incentive_budget_cents - budget_spent_cents - budget_reserved_cents; never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | CLOSED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; driver's home market" }
      - { name: display_name, type: string, source: input, description: "Driver display name" }
      - { name: rate_posture, type: enum, source: computed, description: "Parallel dimension 1: ELIGIBLE | PROBATION | INELIGIBLE — derived from rolling acceptance/cancellation rates" }
      - { name: fraud_posture, type: enum, source: computed, description: "Parallel dimension 2: CLEAR | WATCH | RESTRICTED — derived from FraudFlags; independent of rate_posture" }
      - { name: acceptance_rate_bps, type: integer, source: computed, description: "Rolling acceptance rate in basis points over the trailing ACCEPTANCE_WINDOW (see calculations); 10000 = 100%" }
      - { name: cancellation_rate_bps, type: integer, source: computed, description: "Rolling cancellation rate in basis points over the trailing window" }
      - { name: offers_total, type: integer, source: computed, description: "Count of dispatch offers recorded in the trailing window (accepted + declined)" }
      - { name: accepted_total, type: integer, source: computed, description: "Count of accepted offers in the trailing window" }
      - { name: cancelled_total, type: integer, source: computed, description: "Count of driver-cancellations after acceptance in the trailing window" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | DEACTIVATED" }

  - name: IncentiveProgram
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; program scoped to one market" }
      - { name: program_type, type: enum, source: input, description: "STREAK | BONUS_ZONE | CHALLENGE | GUARANTEE" }
      - { name: title, type: string, source: input, description: "Human-readable title" }
      - { name: window_start_utc, type: datetime, source: input, description: "Half-open window start [start, end); must be < window_end_utc" }
      - { name: window_end_utc, type: datetime, source: input, description: "Half-open window end; adjacency (end == another program's start) is NOT an overlap" }
      - { name: geo_cell_id, type: string, source: input, description: "Required for BONUS_ZONE; must be a member of Market.geo_cells; null otherwise" }
      - { name: stacking_class, type: enum, source: input, description: "STACKABLE | EXCLUSIVE — EXCLUSIVE programs suppress STACKABLE payouts on the same ride" }
      - { name: excluded_ride_types, type: array, source: input, description: "Ride types excluded from progress and payout; e.g. [SHARED, SCHEDULED]" }
      - { name: streak_length, type: integer, source: input, description: "Required for STREAK: rides in a row with no decline/cancel to complete the streak" }
      - { name: streak_payout_cents, type: integer, source: input, description: "Required for STREAK: payout on streak completion" }
      - { name: zone_multiplier_bps, type: integer, source: input, description: "Required for BONUS_ZONE: bonus = base_fare * (zone_multiplier_bps - 10000) / 10000; must be > 10000" }
      - { name: challenge_ride_target, type: integer, source: input, description: "Required for CHALLENGE: total qualifying rides within the window" }
      - { name: challenge_payout_cents, type: integer, source: input, description: "Required for CHALLENGE: payout on target reached" }
      - { name: guaranteed_weekly_cents, type: integer, source: input, description: "Required for GUARANTEE: promised weekly gross earnings threshold" }
      - { name: guaranteed_min_rides, type: integer, source: input, description: "Required for GUARANTEE: minimum qualifying completed rides for guarantee to apply" }
      - { name: promised_make_up_max_cents, type: integer, source: computed, description: "For GUARANTEE programs: guaranteed_weekly_cents (worst-case reservation); 0 otherwise. Feeds Market.budget_reserved_cents while program is ACTIVE" }
      - { name: capacity, type: integer, source: input, description: "Required for BONUS_ZONE: max concurrently ACTIVE enrollments; null = uncapped" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | RETIRED" }
      - { name: forecast_headroom_cents, type: integer, source: computed, description: "incentive budget remaining after the latest APPROVED CostForecast for this program; recomputed on forecast approval" }

  - name: Ride
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; ride market (may differ from driver home market)" }
      - { name: ride_type, type: enum, source: input, description: "STANDARD | SHARED | SCHEDULED | LUX" }
      - { name: geo_cell_id, type: string, source: input, description: "Geo cell of pickup; used for bonus-zone qualification" }
      - { name: base_fare_cents, type: integer, source: input, description: "Driver base fare component; >= 0" }
      - { name: tips_cents, type: integer, source: input, description: "Tips; >= 0; excluded from guarantee earnings basis per guarantee_earnings_basis" }
      - { name: request_offer_recorded, type: boolean, source: computed, description: "True once this ride's offer event has been folded into the driver's rolling acceptance rate" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | COMPLETED | DRIVER_CANCELLED | RIDER_CANCELLED | DECLINED | UNDER_REVIEW | VOIDED" }
      - { name: qualifying_earnings_cents, type: integer, source: computed, description: "Amount counting toward incentive progress and guarantee basis; 0 for excluded ride types, voided, or non-COMPLETED rides" }

  - name: IncentiveEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: program_id, type: string, source: input, description: "FK -> IncentiveProgram.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | EXPIRED | CANCELLED" }
      - { name: progress_count, type: integer, source: computed, description: "STREAK: current consecutive-run length; CHALLENGE: qualifying rides so far; GUARANTEE: qualifying completed rides this week" }
      - { name: streak_broken, type: boolean, source: computed, description: "STREAK only: latched true when a decline or driver-cancel breaks the run before completion" }
      - { name: payout_cents, type: integer, source: computed, description: "Bonus paid or payable by this enrollment. STREAK/CHALLENGE: 0 until COMPLETED (suppressed-to-0 when an EXCLUSIVE program outranks this STACKABLE one on the deciding ride). BONUS_ZONE: accumulates per-ride zone bonus floor(base_fare_cents * (zone_multiplier_bps - 10000) / 10000) on each qualifying COMPLETED ride — rounding is pinned PER RIDE (round each ride's bonus, then accumulate); multiplying the summed fares and rounding once is forbidden." }
      - { name: earned_qualifying_cents, type: integer, source: computed, description: "GUARANTEE only: sum of qualifying_earnings_cents over this driver's COMPLETED rides in the program window for the current week" }

  - name: GuaranteeSettlement
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: program_id, type: string, source: input, description: "FK -> IncentiveProgram.id; must reference a GUARANTEE program" }
      - { name: week_start_utc, type: datetime, source: input, description: "Monday 00:00:00Z of the settled week" }
      - { name: promised_cents, type: integer, source: computed, description: "Snapshot of program.guaranteed_weekly_cents at compute time" }
      - { name: actual_gross_cents, type: integer, source: computed, description: "Sum of qualifying_earnings_cents for the driver's COMPLETED, non-excluded rides with completed week = week_start" }
      - { name: qualifying_ride_count, type: integer, source: computed, description: "Count of rides contributing to actual_gross_cents" }
      - { name: make_up_cents, type: integer, source: computed, description: "max(0, promised_cents - actual_gross_cents) when qualifying_ride_count >= guaranteed_min_rides, else 0 — variant-dependent; see calculations.guarantee_make_up" }
      - { name: basis_variant, type: enum, source: computed, description: "PROVISIONAL (excludes UNDER_REVIEW rides) | FINAL (includes rides whose review resolved to COMPLETED)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | PAID | REOPENED | VOID" }
      - { name: paid_at_utc, type: datetime, source: system, description: "Set on PAID transition; null otherwise" }

  - name: EarningsStatement
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: week_start_utc, type: datetime, source: input, description: "Monday 00:00:00Z of statement week" }
      - { name: base_fares_cents, type: integer, source: computed, description: "Sum of base_fare_cents over the driver's COMPLETED rides that week" }
      - { name: tips_cents_total, type: integer, source: computed, description: "Sum of tips over the driver's COMPLETED rides that week" }
      - { name: bonus_total_cents, type: integer, source: computed, description: "Sum of IncentiveEnrollment.payout_cents for enrollments COMPLETED that week" }
      - { name: make_up_total_cents, type: integer, source: computed, description: "Sum of make_up_cents over the driver's GuaranteeSettlements PAID that week" }
      - { name: adjustments_cents, type: integer, source: computed, description: "Signed total of dispute adjustments applied via appeal resolution" }
      - { name: total_cents, type: integer, source: computed, description: "base_fares + tips + bonuses + make_up + adjustments; reconciliation invariant with ledger" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | DISPUTED | AMENDED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; must match the acting Driver identity" }
      - { name: subject_type, type: enum, source: input, description: "ELIGIBILITY | STATEMENT" }
      - { name: statement_id, type: string, source: input, description: "FK -> EarningsStatement.id; required iff subject_type == STATEMENT, else null" }
      - { name: reason, type: string, source: input, description: "Free-text appeal reason" }
      - { name: round_count, type: integer, source: computed, description: "Number of MORE_INFO -> UNDER_REVIEW cycles consumed; max 2" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | MORE_INFO | RESOLVED_UPHELD | RESOLVED_OVERTURNED | ESCALATED | WITHDRAWN" }
      - { name: adjustment_cents, type: integer, source: input, description: "On RESOLVED_OVERTURNED of a STATEMENT appeal: signed credit/debit applied to the statement" }

  - name: FraudFlag
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; flagged driver" }
      - { name: ride_id, type: string, source: input, description: "FK -> Ride.id; the suspicious ride (anchor)" }
      - { name: ring_id, type: string, source: input, description: "Collusion ring identifier shared across flagged driver accounts; may be null for solo fraud" }
      - { name: signal_type, type: enum, source: input, description: "INFLATED_RIDE | COLLUSION | LOCATION_SPOOF" }
      - { name: acute_score, type: integer, source: computed, description: "Variant A of fraud_score: flat sum of signal severities on CONFIRMED flags" }
      - { name: chronic_score, type: integer, source: computed, description: "Variant B of fraud_score: decay-weighted sum — each confirmed flag's severity halved per full 4-week age bucket" }
      - { name: severity, type: integer, source: input, description: "Signal severity 1..10" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | DISMISSED" }

  - name: SupplyShortfall
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: geo_cell_id, type: string, source: input, description: "Geo cell in shortage; must be a member of Market.geo_cells" }
      - { name: hour_bucket, type: integer, source: input, description: "Hour of week 0..167 the shortfall applies to" }
      - { name: severity_bps, type: integer, source: input, description: "Shortage magnitude in basis points of demand unmet; 1..10000" }
      - { name: recommended_bonus_cents, type: integer, source: computed, description: "Suggested per-ride bonus: ceil(severity_bps * market median base fare / 10000); see calculations.shortfall_recommended_bonus" }
      - { name: status, type: enum, source: system, description: "OPEN | ADDRESSED | EXPIRED" }

  - name: CostForecast
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> IncentiveProgram.id" }
      - { name: baseline_rides, type: integer, source: input, description: "Projected rides in program window without the incentive" }
      - { name: lift_bps, type: integer, source: input, description: "Projected volume lift in basis points attributable to the incentive" }
      - { name: cannibalization_bps, type: integer, source: input, description: "Share of lifted rides cannibalized from other programs, in basis points of lifted volume" }
      - { name: projected_incremental_rides, type: integer, source: computed, description: "floor(baseline_rides * lift_bps / 10000)" }
      - { name: projected_cannibalized_rides, type: integer, source: computed, description: "floor(projected_incremental_rides * cannibalization_bps / 10000)" }
      - { name: projected_cost_cents, type: integer, source: computed, description: "Cost of the incentive per calculations.cost_forecast; evaluation order pinned there (circular-looking dependency)" }
      - { name: forecast_revision, type: integer, source: computed, description: "Monotonic per-program revision number starting at 1; new forecast supersedes prior APPROVED one" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Market
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /markets/{id}/freeze"
        actor: PlatformAdmin
        preconditions: ["market.status == ACTIVE"]
        side_effects:
          - "All IncentivePrograms in this market with status ACTIVE or DRAFT transition to PAUSED"
          - "Each PAUSED program's promised_make_up_max_cents stops contributing to market.budget_reserved_cents"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /markets/{id}/unfreeze"
        actor: PlatformAdmin
        preconditions: ["market.status == FROZEN"]
        side_effects:
          - "Programs PAUSED by the freeze do NOT auto-resume; each must be resumed explicitly"
          - "market.budget_reserved_cents recomputed from currently ACTIVE programs"
      - from: [ACTIVE, FROZEN]
        to: CLOSED
        trigger: "POST /markets/{id}/close"
        actor: PlatformAdmin
        preconditions: ["No IncentiveProgram in this market has status ACTIVE", "No GuaranteeSettlement in this market has status DRAFT or REOPENED"]
        side_effects:
          - "All remaining IncentivePrograms -> RETIRED"
          - "All OPEN SupplyShortfalls in this market -> EXPIRED"

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: [DEACTIVATED]
    transitions:
      # Parallel dimension 1: rate_posture (ELIGIBLE | PROBATION | INELIGIBLE)
      - from: "rate_posture: any"
        to: "rate_posture: recomputed"
        trigger: "POST /drivers/{id}/rate-events (each offer/accept/decline/cancel event)"
        actor: Driver
        preconditions: ["driver.account_status == ACTIVE"]
        side_effects:
          - "acceptance_rate_bps and cancellation_rate_bps recomputed per calculations.rolling_rates"
          - "rate_posture updated per calculations.rate_posture_derivation"
          - "If rate_posture became INELIGIBLE: every IncentiveEnrollment of this driver in ACTIVE status -> CANCELLED, and each such cancellation re-evaluates its program's BONUS_ZONE capacity headroom (capacity_release)"
      # Parallel dimension 2: fraud_posture (CLEAR | WATCH | RESTRICTED)
      - from: "fraud_posture: CLEAR or WATCH"
        to: "fraud_posture: recomputed"
        trigger: "FraudFlag confirm/dismiss transitions"
        actor: system
        preconditions: []
        side_effects:
          - "fraud_posture updated per calculations.fraud_posture_derivation"
          - "If fraud_posture became RESTRICTED: driver's ACTIVE IncentiveEnrollments -> CANCELLED; those cancellations mark the enrollments' rides ineligible for pending GuaranteeSettlement recompute (settlement recompute -> EarningsStatement adjustment draft)"
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /drivers/{id}/deactivate"
        actor: PlatformAdmin
        preconditions: ["driver.account_status == ACTIVE", "No GuaranteeSettlement for this driver in DRAFT or REOPENED"]
        side_effects:
          - "All ACTIVE enrollments -> CANCELLED"
          - "All OPEN FraudFlags for this driver -> DISMISSED"

  - entity: IncentiveProgram
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /incentive-programs/{id}/activate"
        actor: IncentiveOps
        preconditions:
          - "program.market.status == ACTIVE"
          - "If GUARANTEE: market.budget_available_cents >= program.guaranteed_weekly_cents (reservation must fit)"
          - "If BONUS_ZONE: no other ACTIVE BONUS_ZONE program in the same market covers the same geo_cell_id with an overlapping half-open window [window_start_utc, window_end_utc)"
          - "Latest CostForecast for this program (if any) is APPROVED with projected_cost_cents <= market.budget_available_cents, or no forecast exists yet (DRAFT activation without forecast allowed; enrollment still gated)"
        side_effects:
          - "If GUARANTEE: market.budget_reserved_cents += program.guaranteed_weekly_cents and promised_make_up_max_cents = guaranteed_weekly_cents"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /incentive-programs/{id}/pause or market freeze cascade"
        actor: "IncentiveOps or system"
        preconditions: ["program.status == ACTIVE"]
        side_effects:
          - "If GUARANTEE: market.budget_reserved_cents -= program.guaranteed_weekly_cents, promised_make_up_max_cents -> 0"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /incentive-programs/{id}/resume"
        actor: IncentiveOps
        preconditions: ["program.status == PAUSED", "program.market.status == ACTIVE", "If GUARANTEE: reservation fits recomputed budget_available_cents"]
        side_effects:
          - "If GUARANTEE: reservation re-added to market.budget_reserved_cents"
      - from: [DRAFT, ACTIVE, PAUSED]
        to: RETIRED
        trigger: "POST /incentive-programs/{id}/retire or market close cascade"
        actor: "IncentiveOps or system"
        preconditions: ["No IncentiveEnrollment on this program has status ACTIVE"]
        side_effects:
          - "If GUARANTEE and was ACTIVE: reservation released from market"
          - "All OPEN SupplyShortfalls whose recommended program was this one -> ADDRESSED (link via matching geo_cell_id and hour bucket coverage)"

  - entity: Ride
    initial_state: OFFERED
    terminal_states: [COMPLETED, DRIVER_CANCELLED, RIDER_CANCELLED, DECLINED, VOIDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /rides/{id}/accept"
        actor: Driver
        preconditions: ["ride.driver.account_status == ACTIVE", "ride.status == OFFERED"]
        side_effects:
          - "Driver rolling rates updated (offer counted, accept counted) via POST-equivalent internal fold"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /rides/{id}/decline"
        actor: Driver
        preconditions: ["ride.status == OFFERED"]
        side_effects:
          - "Driver rolling rates updated; any STREAK enrollment ACTIVE for this driver with an open run -> streak_broken = true, progress_count = 0"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /rides/{id}/complete"
        actor: Driver
        preconditions: ["ride.status == ACCEPTED"]
        side_effects:
          - "qualifying_earnings_cents computed per calculations.qualifying_earnings (0 if ride_type in any covering program's excluded_ride_types... per-enrollment evaluation)"
          - "For each ACTIVE IncentiveEnrollment of the driver whose program window covers now: progress_count advanced per program type rules; streak completion -> enrollment COMPLETED with payout_cents set and Market.budget_spent_cents += payout"
          - "BONUS_ZONE enrollments: payout_cents accumulates per-ride zone bonus (floor per ride per calculations.zone_bonus); Market.budget_spent_cents incremented per ride"
          - "CHALLENGE completion -> enrollment COMPLETED, payout_cents = challenge_payout_cents, budget_spent += payout"
      - from: ACCEPTED
        to: DRIVER_CANCELLED
        trigger: "POST /rides/{id}/cancel with cancelled_by=DRIVER"
        actor: Driver
        preconditions: ["ride.status == ACCEPTED"]
        side_effects:
          - "Driver cancelled_total += 1, rolling rates recomputed"
          - "ACTIVE STREAK enrollments -> streak_broken = true, progress_count = 0"
      - from: ACCEPTED
        to: RIDER_CANCELLED
        trigger: "POST /rides/{id}/cancel with cancelled_by=RIDER"
        actor: Driver
        preconditions: ["ride.status == ACCEPTED"]
        side_effects:
          - "No cancellation-rate impact; streaks unaffected"
      - from: COMPLETED
        to: UNDER_REVIEW
        trigger: "POST /rides/{id}/flag-review (fraud screening)"
        actor: FraudAnalyst
        preconditions: ["ride.status == COMPLETED"]
        side_effects:
          - "Ride excluded from PROVISIONAL guarantee basis (still in FINAL if review resolves back)"
          - "Any GuaranteeSettlement for this driver+week already in FINALIZED status -> REOPENED (revision loop), triggering EarningsStatement adjustments draft"
      - from: UNDER_REVIEW
        to: COMPLETED
        trigger: "POST /rides/{id}/clear-review"
        actor: FraudAnalyst
        preconditions: ["ride.status == UNDER_REVIEW"]
        side_effects:
          - "Re-included in FINAL guarantee basis"
      - from: UNDER_REVIEW
        to: VOIDED
        trigger: "POST /rides/{id}/void (confirmed fraud)"
        actor: FraudAnalyst
        preconditions: ["ride.status == UNDER_REVIEW", "A CONFIRMED FraudFlag exists with ride_id == this ride"]
        side_effects:
          - "qualifying_earnings_cents -> 0; any payouts computed from this ride clawed back via negative adjustment on the week EarningsStatement"
          - "Driver fraud_posture recomputed; if RESTRICTED, enrollment cancellation cascade fires (see Driver transitions)"

  - entity: IncentiveEnrollment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (progress target reached on ride completion)"
        actor: system
        preconditions: ["per program type: STREAK progress_count == streak_length with streak_broken false; CHALLENGE progress_count == challenge_ride_target"]
        side_effects:
          - "payout_cents set per stacking resolution: if the deciding ride also qualifies an ACTIVE EXCLUSIVE program enrollment, STACKABLE payouts are suppressed to 0"
          - "Market.budget_spent_cents += payout_cents"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock passes program.window_end_utc)"
        actor: system
        preconditions: []
        side_effects: ["progress retained for audit; no payout"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel or Driver posture cascade (INELIGIBLE / RESTRICTED / DEACTIVATED)"
        actor: "Driver, IncentiveOps, or system"
        preconditions: ["enrollment.status == ACTIVE"]
        side_effects:
          - "If program is BONUS_ZONE with capacity: one slot released (capacity headroom recomputed)"

  - entity: GuaranteeSettlement
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: PaymentsOfficer
        preconditions:
          - "settlement.status == DRAFT"
          - "All Ride rows for this driver with completed-week == settlement.week_start_utc are in a terminal state (no UNDER_REVIEW)"
          - "basis_variant recomputed as FINAL at this point"
        side_effects:
          - "make_up_cents recomputed under FINAL variant"
      - from: FINALIZED
        to: PAID
        trigger: "POST /settlements/{id}/pay"
        actor: PaymentsOfficer
        preconditions: ["settlement.status == FINALIZED", "market.budget_available_cents >= make_up_cents"]
        side_effects:
          - "Market.budget_spent_cents += make_up_cents"
          - "If GUARANTEE program still ACTIVE: budget_reserved_cents unchanged (reservation release happens at week rollover / program retire)"
          - "EarningsStatement for driver+week: make_up_total_cents and total_cents recomputed"
      - from: FINALIZED
        to: REOPENED
        trigger: "POST /settlements/{id}/reopen or ride flag-review cascade"
        actor: "PaymentsOfficer or system"
        preconditions: ["settlement.status == FINALIZED"]
        side_effects: ["basis_variant back to PROVISIONAL semantics until re-finalized"]
      - from: REOPENED
        to: FINALIZED
        trigger: "POST /settlements/{id}/finalize"
        actor: PaymentsOfficer
        preconditions: ["same as DRAFT->FINALIZED"]
        side_effects: ["make_up_cents recomputed under FINAL variant; EarningsStatement adjustment drafted for the delta"]
      - from: [DRAFT, FINALIZED, REOPENED]
        to: VOID
        trigger: "POST /settlements/{id}/void"
        actor: PaymentsOfficer
        preconditions: ["settlement.status != PAID"]
        side_effects: ["Excluded from all budget and statement aggregations"]

  - entity: EarningsStatement
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /statements/{id}/publish"
        actor: PaymentsOfficer
        preconditions: ["statement.status == DRAFT", "All GuaranteeSettlements for this driver+week are in PAID or VOID"]
        side_effects: []
      - from: PUBLISHED
        to: DISPUTED
        trigger: "POST /appeals with subject_type=STATEMENT referencing this statement"
        actor: Driver
        preconditions: ["statement.status == PUBLISHED"]
        side_effects: []
      - from: DISPUTED
        to: AMENDED
        trigger: "Appeal RESOLVED_OVERTURNED with adjustment_cents applied"
        actor: system
        preconditions: []
        side_effects:
          - "adjustments_cents += appeal.adjustment_cents; total_cents recomputed"
          - "Invariant: total_cents == base_fares_cents + tips_cents_total + bonus_total_cents + make_up_total_cents + adjustments_cents"
      - from: DISPUTED
        to: PUBLISHED
        trigger: "Appeal RESOLVED_UPHELD or WITHDRAWN"
        actor: system
        preconditions: []
        side_effects: ["No monetary change"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_OVERTURNED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/start-review"
        actor: PaymentsOfficer
        preconditions: ["appeal.status == FILED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: MORE_INFO
        trigger: "POST /appeals/{id}/request-info"
        actor: PaymentsOfficer
        preconditions: ["appeal.status == UNDER_REVIEW", "appeal.round_count < 2"]
        side_effects: []
      - from: MORE_INFO
        to: UNDER_REVIEW
        trigger: "POST /appeals/{id}/provide-info"
        actor: Driver
        preconditions: ["appeal.status == MORE_INFO", "acting driver is appeal.driver_id"]
        side_effects: ["round_count += 1"]
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /appeals/{id}/resolve with outcome=UPHELD"
        actor: PaymentsOfficer
        preconditions: ["appeal.status == UNDER_REVIEW"]
        side_effects: ["If subject_type == STATEMENT: statement -> PUBLISHED (unchanged)"]
      - from: UNDER_REVIEW
        to: RESOLVED_OVERTURNED
        trigger: "POST /appeals/{id}/resolve with outcome=OVERTURNED"
        actor: PaymentsOfficer
        preconditions: ["appeal.status == UNDER_REVIEW", "If subject_type == STATEMENT: adjustment_cents must be provided and non-zero"]
        side_effects:
          - "If subject_type == STATEMENT: statement -> AMENDED with adjustments_cents applied"
          - "If subject_type == ELIGIBILITY: driver rate_posture reset to ELIGIBLE and rolling counters zeroed (manual override; logged)"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /appeals/{id}/escalate"
        actor: PaymentsOfficer
        preconditions: ["appeal.status == UNDER_REVIEW", "appeal.round_count == 2 (both info rounds exhausted)"]
        side_effects: []
      - from: ESCALATED
        to: RESOLVED_OVERTURNED
        trigger: "POST /appeals/{id}/resolve with outcome=OVERTURNED"
        actor: PlatformAdmin
        preconditions: ["appeal.status == ESCALATED"]
        side_effects: ["Same as UNDER_REVIEW -> RESOLVED_OVERTURNED"]
      - from: ESCALATED
        to: RESOLVED_UPHELD
        trigger: "POST /appeals/{id}/resolve with outcome=UPHELD"
        actor: PlatformAdmin
        preconditions: ["appeal.status == ESCALATED"]
        side_effects: []
      - from: [FILED, UNDER_REVIEW, MORE_INFO]
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Driver
        preconditions: ["acting driver is appeal.driver_id"]
        side_effects: ["If subject_type == STATEMENT and statement.status == DISPUTED: statement -> PUBLISHED"]

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /fraud-flags/{id}/confirm"
        actor: FraudAnalyst
        preconditions: ["flag.status == OPEN"]
        side_effects:
          - "flag.driver fraud_posture recomputed (acute_score and chronic_score variants)"
          - "anchor ride, if COMPLETED, forced -> UNDER_REVIEW"
          - "If ring_id non-null: all other drivers with an OPEN or CONFIRMED flag sharing ring_id get fraud_posture recomputed (WATCH floor)"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /fraud-flags/{id}/dismiss"
        actor: FraudAnalyst
        preconditions: ["flag.status == OPEN"]
        side_effects: ["driver fraud_posture recomputed"]

  - entity: SupplyShortfall
    initial_state: OPEN
    terminal_states: [ADDRESSED, EXPIRED]
    transitions:
      - from: OPEN
        to: ADDRESSED
        trigger: "POST /supply-shortfalls/{id}/address or IncentiveProgram RETIRE cascade"
        actor: "IncentiveOps or system"
        preconditions: ["shortfall.status == OPEN"]
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "system (logical clock passes the shortfall's hour bucket in the following week) or market close cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CostForecast
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /cost-forecasts/{id}/approve (OCC on program version)"
        actor: IncentiveOps
        preconditions:
          - "forecast.status == DRAFT"
          - "expected_program_version == program.version (OCC)"
          - "projected_cost_cents <= program.market.budget_available_cents"
        side_effects:
          - "Any prior APPROVED forecast for the same program -> SUPERSEDED"
          - "program.forecast_headroom_cents recomputed"
          - "program.version incremented by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /cost-forecasts/{id}/reject"
        actor: IncentiveOps
        preconditions: ["forecast.status == DRAFT"]
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer forecast for the same program is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: forecast-approve-stale-program
    parent_entity: IncentiveProgram
    write_endpoint: "POST /cost-forecasts/{id}/approve"
    occ_field: "expected_program_version"
    description: |
      Approving a CostForecast against an IncentiveProgram whose version has
      advanced since the client last observed it is rejected. Approval legitimately
      supersedes any prior APPROVED forecast, so a second approval built on the
      old program snapshot must not silently overwrite the newer headroom math.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: market-budget-update-stale
    parent_entity: Market
    write_endpoint: "PUT /markets/{id}"
    occ_field: "expected_market_version"
    description: |
      Updating a Market's incentive_budget_cents with a stale expected_market_version
      is rejected. Budget mutations interleave with program activations that reserve
      budget; a client whose snapshot predates the latest reservation must not
      shrink the ceiling below committed spend.
    error_id: ERR_STALE_MARKET_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rolling_rates
    trigger: "POST /drivers/{id}/rate-events; also folded internally by ride accept/decline/cancel"
    algorithm: aggregation
    formula: |
      Window: the trailing 100 dispatch events (offer, accept-after-offer excluded;
      an event = OFFER_RECORDED, ACCEPT_RECORDED, DECLINE_RECORDED, DRIVER_CANCEL_RECORDED),
      evicting oldest beyond 100, ordered by event recorded_at ASC with tie-break
      created_at ASC (never id).
      offers_total = count(events) where type in (OFFER_ACCEPTED, OFFER_DECLINED)
      accepted_total = count(OFFER_ACCEPTED)
      cancelled_total = count(DRIVER_CANCEL)
      acceptance_rate_bps = offers_total == 0 ? 10000 : floor(10000 * accepted_total / offers_total)
      cancellation_rate_bps = accepted_total == 0 ? 0 : floor(10000 * cancelled_total / accepted_total)
    input_set: "Driver rate events in the trailing window; evicted events excluded"
    constants:
      WINDOW_SIZE: 100
    precision: "integer basis points, floor"

  - name: rate_posture_derivation
    trigger: "after rolling_rates recompute"
    algorithm: threshold
    formula: |
      if offers_total < MIN_OFFERS: rate_posture unchanged (insufficient data)
      else if acceptance_rate_bps >= ACCEPT_OK_BPS and cancellation_rate_bps <= CANCEL_OK_BPS: ELIGIBLE
      else if acceptance_rate_bps >= ACCEPT_MIN_BPS and cancellation_rate_bps <= CANCEL_MAX_BPS: PROBATION
      else: INELIGIBLE
      Boundary: comparisons are >= and <= exactly as written (9000 passes ACCEPT_OK_BPS).
    constants:
      ACCEPT_OK_BPS: 9000
      ACCEPT_MIN_BPS: 7500
      CANCEL_OK_BPS: 1000
      CANCEL_MAX_BPS: 2000
      MIN_OFFERS: 20

  - name: qualifying_earnings
    trigger: "ride COMPLETED transition"
    algorithm: aggregation
    formula: |
      Per enrollment-program evaluation:
        qualifying_earnings_cents(per program) = 0 if ride.ride_type in program.excluded_ride_types
                                                 else base_fare_cents
      Ride-level qualifying_earnings_cents (for guarantee basis) =
        0 if ride.status != COMPLETED
        else base_fare_cents   (tips never count toward guarantee basis)
      Rounding: per-ride integer cents; no fractional rounding occurs at this layer.
    precision: "integer cents"

  - name: weekly_earnings_total
    trigger: "GuaranteeSettlement compute; EarningsStatement publish"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED: round per-ride first (each ride's qualifying
      earnings are integer cents already), then sum. "Sum then round" is
      FORBIDDEN because it diverges from per-ride rounding when fractional
      multipliers (zone multipliers) are applied upstream.
      actual_gross_cents = sum(ride.qualifying_earnings_cents) over the driver's
        COMPLETED rides whose completion week == settlement.week_start_utc,
        excluding VOIDED and (PROVISIONAL variant) UNDER_REVIEW rides.
    precision: "integer cents, round_half_up where a multiplier applies before this layer"
    variants:
      - name: per_ride_then_sum
        when: "always (pinned)"
        difference: "Round each line item to integer cents first, then sum"

  - name: guarantee_make_up
    trigger: "POST /settlements/compute (DRAFT creation), POST /settlements/{id}/finalize"
    algorithm: threshold
    formula: |
      if qualifying_ride_count < program.guaranteed_min_rides: make_up_cents = 0
      else make_up_cents = max(0, promised_cents - actual_gross_cents)
      PROVISIONAL variant (DRAFT compute): input set EXCLUDES rides in UNDER_REVIEW.
      FINAL variant (finalize): input set INCLUDES rides whose review resolved to
        COMPLETED, excludes VOIDED.
      Same ride set with one UNDER_REVIEW ride therefore yields different
      make_up_cents between variants.
    input_set: "driver's rides with completion week == week_start_utc; see variant filter"
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "settlement DRAFT compute"
        difference: "excludes UNDER_REVIEW rides from actual_gross_cents and qualifying_ride_count"
      - name: FINAL
        when: "settlement finalize"
        difference: "includes rides resolved back to COMPLETED; excludes VOIDED"

  - name: streak_payout
    trigger: "ride COMPLETED while STREAK enrollment ACTIVE"
    algorithm: threshold
    formula: |
      >=3 inputs with non-linear interaction:
        qualifies(ride, program) = ride.geo_cell_id in market.geo_cells
          AND ride.ride_type not in program.excluded_ride_types
          AND ride completion timestamp in [window_start_utc, window_end_utc)
          AND streak_broken == false
      On qualify: progress_count += 1
      On completion (progress_count == program.streak_length):
        base_payout = program.streak_payout_cents
        zone_boost = (an ACTIVE BONUS_ZONE enrollment covers ride.geo_cell_id)
          ? floor(base_payout * (zone_multiplier_bps - 10000) / 10000) : 0
        raw = base_payout + zone_boost
        suppressed = (the same ride advanced an ACTIVE EXCLUSIVE enrollment)
        payout_cents = suppressed ? 0 : min(raw, market.budget_available_cents)
      Nested min and conditional branches make this non-linear.
    constants:
      STACKING_EXCLUSIVE_WINS: true
    precision: "integer cents, floor on multiplier"

  - name: zone_bonus
    trigger: "ride COMPLETED while BONUS_ZONE enrollment ACTIVE and ride.geo_cell_id == program.geo_cell_id and ride_type not excluded"
    algorithm: aggregation
    formula: |
      per_ride_bonus = floor(ride.base_fare_cents * (program.zone_multiplier_bps - 10000) / 10000)
      enrollment.payout_cents += per_ride_bonus
      Rounding order PINNED: floor is applied PER RIDE and the integer results
      are accumulated. Computing floor over the sum of base fares is forbidden —
      e.g. three rides of 333 cents at multiplier 15000 yield
      3 * floor(333 * 5000 / 10000) = 3 * 166 = 498, not floor(999 * 5000 / 10000) = 499.
    precision: "integer cents, floor per ride"

  - name: cost_forecast
    trigger: "POST /incentive-programs/{id}/cost-forecasts"
    algorithm: projection
    formula: |
      Circular-looking dependency, evaluation order PINNED (1)-(4):
      (1) projected_incremental_rides = floor(baseline_rides * lift_bps / 10000)
      (2) projected_cannibalized_rides = floor(projected_incremental_rides * cannibalization_bps / 10000)
      (3) net_new_rides = projected_incremental_rides - projected_cannibalized_rides
      (4) projected_cost_cents depends on program_type:
            STREAK:    floor(net_new_rides / max(1, streak_length)) * streak_payout_cents
            BONUS_ZONE: sum over net_new_rides of floor(median_base_fare * (zone_multiplier_bps-10000)/10000)
                        where median_base_fare = market median COMPLETED-ride base_fare
                        over the prior 4 weeks (0 if no history)
            CHALLENGE: floor(net_new_rides / max(1, challenge_ride_target)) * challenge_payout_cents
            GUARANTEE: guaranteed_weekly_cents (worst case; independent of volume)
      The dependency is circular-looking because projected_cost feeds
      forecast_headroom which feeds activation gating which changes realized
      volume — the pinned order (1)-(4) makes the value well-defined at write time.
    precision: "integer cents, floor at each stage"

  - name: fraud_score
    trigger: "FraudFlag CONFIRMED / DISMISSED"
    algorithm: decay_function
    formula: |
      Two variants computed on different semantics of the same CONFIRMED flag set:
      acute_score   = sum(severity) over driver's CONFIRMED flags (flat, no decay)
      chronic_score = sum over driver's CONFIRMED flags of
                      floor(severity * 100 / (2 ^ age_bucket) / 100)
                      where age_bucket = full 4-week buckets since flag confirmed_at
      fraud_posture: RESTRICTED if acute_score >= RESTRICT_MIN else
                     WATCH if acute_score >= WATCH_MIN or chronic_score >= WATCH_MIN else CLEAR
    constants:
      RESTRICT_MIN: 10
      WATCH_MIN: 4
      DECAY_BUCKET_WEEKS: 4
    precision: "integer score"
    variants:
      - name: acute
        when: "immediate enforcement"
        difference: "flat sum, no time decay"
      - name: chronic
        when: "posture floor and audit views"
        difference: "severity halves per full 4-week age bucket"

  - name: shortfall_recommended_bonus
    trigger: "SupplyShortfall creation"
    algorithm: threshold
    formula: |
      median_base = median base_fare_cents of COMPLETED rides in the market's
        geo_cell over the prior 4 weeks (0 if no history)
      recommended_bonus_cents = ceil(severity_bps * median_base / 10000)
      Severity boundary: severity_bps == 10000 doubles the median fare exactly.
    precision: "integer cents, ceil"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role matches endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 2
    category: existence
    check: "Path ids exist, validated left-to-right (market, then program/driver, then child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 3
    category: state
    check: "Target resource in a state that permits the operation (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints
  - priority: 4
    category: business_safety
    check: "Fraud gating: driver.fraud_posture == RESTRICTED blocks enrollment, streak progress payout, and settlement finalize"
    error_id: ERR_FRAUD_RESTRICTED
    http_status: 422
    applies_to: [enrollments.create, settlements.finalize]
  - priority: 5
    category: business_temporal
    check: "Program window well-formed (start < end); activation only within or before window; no BONUS_ZONE same-cell half-open overlap; BONUS_ZONE aggregate capacity not exceeded"
    error_id: ERR_PROGRAM_WINDOW_CONFLICT
    http_status: 422
    applies_to: [incentive-programs.create, incentive-programs.activate, enrollments.create]
  - priority: 6
    category: business_referential
    check: "Referenced entities coherent: enrollment's driver.market == program.market; appeal.statement.driver == appeal.driver; ride.market exists; geo_cell_id member of market.geo_cells"
    error_id: ERR_CROSS_MARKET_REFERENCE
    http_status: 422
    applies_to: [enrollments.create, appeals.create, rides.create, supply-shortfalls.create]
  - priority: 7
    category: business_constraint
    check: "Eligibility gating: driver.rate_posture must be ELIGIBLE or PROBATION to enroll; INELIGIBLE rejected"
    error_id: ERR_DRIVER_INELIGIBLE
    http_status: 422
    applies_to: [enrollments.create]
  - priority: 8
    category: business_fiscal
    check: "Budget checks: GUARANTEE activation reservation fits budget_available; settlement pay make_up fits budget_available; market budget update cannot drop ceiling below spent + reserved"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: [incentive-programs.activate, settlements.pay, markets.update]
  - priority: 9
    category: business_constraint
    check: "Program-type required-field completeness (STREAK needs streak_length+streak_payout_cents, BONUS_ZONE needs zone_multiplier_bps+geo_cell_id+capacity, CHALLENGE needs challenge_ride_target+challenge_payout_cents, GUARANTEE needs guaranteed_weekly_cents+guaranteed_min_rides)"
    error_id: ERR_PROGRAM_CONFIG_INCOMPLETE
    http_status: 400
    applies_to: [incentive-programs.create]
  - priority: 10
    category: business_constraint
    check: "Request shape: required fields present, enums valid, integers in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table (33 endpoints)
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default at server startup (before any call) is exactly 2026-09-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["EXPIRED transitions evaluated lazily on next read/write"]

  # --- Markets ---
  - method: POST
    path: "/markets"
    description: "Create a market"
    roles: [PlatformAdmin]
    code: 201
    input: [market_code, geo_cells, incentive_budget_cents]
    output: Market
    side_effects: ["status=ACTIVE; budget_spent=0; budget_reserved=0; budget_available=incentive_budget_cents"]
  - method: GET
    path: "/markets/{id}"
    description: "Get a market"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst, Driver]
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: GET
    path: "/markets"
    description: "List markets"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Market[]"
    side_effects: []
  - method: PUT
    path: "/markets/{id}"
    description: "Update market budget (OCC)"
    roles: [PlatformAdmin]
    code: 200
    input: [incentive_budget_cents, expected_market_version]
    output: Market
    side_effects: ["market.version += 1", "budget_available recomputed; ERR_BUDGET_EXCEEDED if new ceiling < spent + reserved"]
  - method: POST
    path: "/markets/{id}/freeze"
    description: "Freeze market (pause programs)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Market
    side_effects: ["ACTIVE/DRAFT programs -> PAUSED; reservations released"]
  - method: POST
    path: "/markets/{id}/unfreeze"
    description: "Unfreeze market"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Market
    side_effects: ["Programs stay PAUSED until explicitly resumed"]
  - method: POST
    path: "/markets/{id}/close"
    description: "Close market"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Market
    side_effects: ["Programs -> RETIRED; OPEN shortfalls -> EXPIRED"]
  - method: GET
    path: "/markets/{id}/supply-shortfalls"
    description: "List shortfalls in market (reverse FK)"
    roles: [PlatformAdmin, IncentiveOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SupplyShortfall[]"
    side_effects: []

  # --- Drivers ---
  - method: POST
    path: "/drivers"
    description: "Onboard a driver"
    roles: [IncentiveOps]
    code: 201
    input: [market_id, display_name]
    output: Driver
    side_effects: ["account_status=ACTIVE; rate_posture=ELIGIBLE; fraud_posture=CLEAR; counters zeroed"]
  - method: GET
    path: "/drivers/{id}"
    description: "Get a driver"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst, Driver]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: GET
    path: "/drivers"
    description: "List drivers"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst]
    code: 200
    input: ["market_id?", "rate_posture?", "fraud_posture?", "limit?", "offset?"]
    output: "Driver[]"
    side_effects: []
  - method: POST
    path: "/drivers/{id}/rate-events"
    description: "Record a batch of dispatch rate events (offer accepted/declined/driver-cancel) and recompute rolling posture"
    roles: [IncentiveOps]
    code: 200
    input: [events]
    output: Driver
    side_effects: ["rolling_rates recompute; rate_posture derivation; INELIGIBLE cascade cancels ACTIVE enrollments"]
  - method: POST
    path: "/drivers/{id}/deactivate"
    description: "Deactivate driver"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Driver
    side_effects: ["ACTIVE enrollments -> CANCELLED; OPEN fraud flags -> DISMISSED"]
  - method: GET
    path: "/drivers/{id}/enrollments"
    description: "List driver enrollments (reverse FK)"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, Driver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "IncentiveEnrollment[]"
    side_effects: []
  - method: GET
    path: "/drivers/{id}/rides"
    description: "List driver rides (reverse FK)"
    roles: [PlatformAdmin, IncentiveOps, PaymentsOfficer, FraudAnalyst, Driver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Ride[]"
    side_effects: []
  - method: GET
    path: "/drivers/{id}/settlements"
    description: "List driver guarantee settlements (reverse FK)"
    roles: [PlatformAdmin, PaymentsOfficer, Driver]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GuaranteeSettlement[]"
    side_effects: []
  - method: GET
    path: "/drivers/{id}/statements"
