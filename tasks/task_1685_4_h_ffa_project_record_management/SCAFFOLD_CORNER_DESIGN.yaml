  # =========================================================================
  # Section: cross-cutting complexity layers (optimistic_concurrency)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: record_book_submit_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[record-book-submit-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Submitting a RecordBook with an expected_record_book_version captured before an intervening mutation (the first submit bumped the version) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "A DRAFT record book whose version was captured, then advanced by a first successful submit"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "OCC Club", county_code: "OC" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
