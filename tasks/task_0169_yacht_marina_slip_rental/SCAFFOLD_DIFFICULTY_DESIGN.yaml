# =============================================================================
# Scaffold Difficulty Design — Test Targeting Index (§1.8)
# Single top-level key. Grounds in SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: forward_vs_chronological_reservation_total
        grounds:
          - calculations.forward_looking_reservation_total
          - calculations.chronological_reservation_total
          - state_machines.Reservation.DRAFT_to_APPROVED
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - entities.Reservation.fields.estimated_total_cents
          - entities.Reservation.fields.final_total_cents
        distinguishing_aspect: |
          Same Reservation inputs (LOA=30.0ft, slip flat=2000, base=500/ft, no liveaboard,
          3 nights 2024-08-30 → 2024-09-02 crossing PEAK→SHOULDER) yield estimated_total_cents=73500
          but final_total_cents=69000 because forward_looking freezes the PEAK multiplier
          at check_in_date while chronological re-evaluates the season per night. Same entity
          (Reservation) but different calculation variants on the rent-pricing domain.
        test_recipe:
          setup:
            - "POST /marinas -> base_daily_rate_cents=500, liveaboard_quota=10"
            - "POST /_clock/advance to 2024-08-29T12:00:00.000Z"
            - "POST /marinas/{m}/boaters -> Boater B1"
            - "POST /marinas/{m}/boaters/B1/vessels -> Vessel V1 loa_feet=30.0, beam_feet=10.0, draft_feet=4.0"
            - "POST /marinas/{m}/slips -> Slip S1 length_feet=40.0, beam_feet=14.0, depth_feet=6.0, flat_daily_charge_cents=2000, liveaboard_allowed=true"
            - "POST /marinas/{m}/boaters/B1/policies -> InsurancePolicy P1 effective_date=2024-08-01, expiration_date=2024-09-30, liability_limit_cents=1000000"
            - "POST /marinas/{m}/reservations -> Reservation R1 check_in_date=2024-08-30, check_out_date=2024-09-02, liveaboard=false, slip=S1, vessel=V1, policy=P1"
          trigger:
            - "POST /marinas/{m}/reservations/R1/approve"
            - "POST /_clock/advance to 2024-08-30T12:00:00.000Z"
            - "POST /marinas/{m}/reservations/R1/check-in"
            - "POST /_clock/advance to 2024-09-02T12:00:00.000Z"
            - "POST /marinas/{m}/reservations/R1/check-out"
          assert:
            - "Reservation.estimated_total_cents == 73500"
            - "Reservation.final_total_cents == 69000"
            - "Reservation.estimated_total_cents != Reservation.final_total_cents"

      - name: tow_event_charge_vs_utility_settlement_billing
        grounds:
          - calculations.tow_event_charge
          - calculations.liveaboard_utility_settlement
          - entities.TowAssistContract.fields.tows_remaining
          - entities.UtilitySettlement.fields.total_cents
          - entities.TowEvent.fields.charge_cents
        distinguishing_aspect: |
          Dual-variant billing on different entity domains. A BASIC TowAssistContract with
          tows_remaining=1 charges 0 for the first tow but 25000 for the second tow
          (same TowEvent fields, threshold-driven divergence). Concurrently a CHECKED_OUT
          liveaboard Reservation produces UtilitySettlement.total_cents=4500
          (kWh+water+sewage), demonstrating that the scaffold has dual-variant billing on
          two unrelated subjects (tow contracts vs utilities) — not the same metric twice.
        test_recipe:
          setup:
            - "Create Marina, Boater B1"
            - "POST /marinas/{m}/boaters/B1/tow-contracts -> Contract C1 tier=BASIC (tows_remaining=2)"
            - "Create Boater B2, Vessel V2 (liveaboard-ready), Slip S2 (liveaboard_allowed=true), policy spanning term"
            - "Approve+check-in Reservation R2 with liveaboard=true, check_in=2024-02-01, check_out=2024-02-02 (1 night, OFF season)"
            - "POST /reservations/R2/utility-readings -> read_at=2024-02-01T20:00Z, kwh_delta=100, water_gallons_delta=50"
          trigger:
            - "POST /tow-contracts/C1/tow-events -> TowEvent T1 (consumes 1 of 2)"
            - "POST /tow-contracts/C1/tow-events -> TowEvent T2 (consumes the last; tows_remaining=0)"
            - "POST /tow-contracts/C1/tow-events -> TowEvent T3 (out of coverage)"
            - "POST /_clock/advance to 2024-02-02T12:00Z"
            - "POST /reservations/R2/check-out"
          assert:
            - "TowEvent T1.charge_cents == 0"
            - "TowEvent T2.charge_cents == 0"
            - "TowEvent T3.charge_cents == 25000"
            - "TowAssistContract C1.tows_remaining == 0 after T3 (unchanged once at floor)"
            - "UtilitySettlement.total_cents == 4500"
            - "UtilitySettlement.kwh_total == 100 AND UtilitySettlement.water_gallons_total == 50 AND UtilitySettlement.sewage_charge_cents == 2500"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: per_night_rounding_order_pinned
        grounds:
          - calculations.chronological_reservation_total
          - calculations.forward_looking_reservation_total
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          "round_half_up per-night raw value to integer cents, THEN sum across
          nights." With per-night raw = 7112.2 cents and 3 nights:
          round-then-sum  = 7112 * 3 = 21336.
          sum-then-round  = round_half_up(7112.2 * 3) = round_half_up(21336.6) = 21337.
          The pinned order yields 21336; an implementation that sums-then-rounds
          produces a different number (21337) — that mismatch is the test.
        test_recipe:
          setup:
            - "Marina base_daily_rate_cents=167"
            - "Boater B1, Vessel V loa_feet=30.5, beam_feet=10.0, draft_feet=4.0"
            - "Slip S length_feet=40.0, beam_feet=14.0, depth_feet=6.0, flat_daily_charge_cents=1000"
            - "ACTIVE policy spanning 2024"
            - "Reservation R DRAFT 2024-04-10 → 2024-04-13 (3 nights, SHOULDER multiplier 1.20), liveaboard=false"
          trigger:
            - "POST /reservations/R/approve"
            - "POST /_clock/advance to 2024-04-10T12:00Z"
            - "POST /reservations/R/check-in"
            - "POST /_clock/advance to 2024-04-13T12:00Z"
            - "POST /reservations/R/check-out"
          assert:
            - "per_night_raw = 167 * 30.5 * 1.20 + 1000 = 7112.2 (fractional)"
            - "per_night_rounded = round_half_up(7112.2) = 7112"
            - "Reservation.estimated_total_cents == 21336 (= 7112 * 3, per-night rounded THEN summed)"
            - "Reservation.final_total_cents == 21336 (same season throughout)"

      - name: forward_total_combinatorial_three_inputs
        grounds:
          - calculations.forward_looking_reservation_total
          - entities.Marina.fields.base_daily_rate_cents
          - entities.Slip.fields.flat_daily_charge_cents
          - entities.Vessel.fields.loa_feet
          - entities.Reservation.fields.liveaboard
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction. Total combines
          (base × LOA × season_multiplier) with slip flat-rate add, with a conditional
          liveaboard flat surcharge, then multiplied by nights. Four entity fields
          (base_daily_rate_cents, LOA, flat_daily_charge_cents, liveaboard) each
          contribute in distinct ways; a tiered season_multiplier selects 1.00/1.20/1.50.
          Distinct from rounding-order mode (b).
        test_recipe:
          setup:
            - "Marina base_daily_rate_cents=500, liveaboard_quota=5"
            - "Vessel.loa_feet=30.0, beam=10.0, draft=4.0, holding_tank_gallons=40"
            - "Slip length=40, beam=14, depth=6, flat_daily_charge_cents=2000, liveaboard_allowed=true"
            - "Policy spans whole 2024"
            - "Reservation: 5 nights 2024-07-10 → 2024-07-15 (PEAK), liveaboard=true"
          trigger:
            - "POST /reservations/R/approve"
          assert:
            - "Per-night raw = 500*30*1.50 + 2000 + 1500 = 26000; rounded = 26000"
            - "Reservation.estimated_total_cents == 130000 (= 26000 * 5)"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: slip_transfer_cyclic_revision_loop
        grounds:
          - state_machines.SlipTransferRequest.REQUESTED_to_OFFERED
          - state_machines.SlipTransferRequest.OFFERED_to_DECLINED
          - state_machines.SlipTransferRequest.DECLINED_to_REQUESTED
          - state_machines.SlipTransferRequest.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          SlipTransferRequest exhibits a cyclic shape REQUESTED → OFFERED → DECLINED →
          REQUESTED (revision loop). The same request may pass through REQUESTED twice
          without being recreated, which a linear pipeline cannot model. Entity:
          SlipTransferRequest — a different entity than the Reservation machine below.
        test_recipe:
          setup:
            - "Create Marina, Boater, Vessel, two Slips S1 and S2, policy, active reservation on S1"
            - "POST /transfer-requests -> TR1 desired_slip_id=S2"
          trigger:
            - "POST /transfer-requests/TR1/offer (REQUESTED→OFFERED)"
            - "POST /transfer-requests/TR1/decline (OFFERED→DECLINED)"
            - "POST /transfer-requests/TR1/requeue (DECLINED→REQUESTED)"
            - "POST /transfer-requests/TR1/offer again (REQUESTED→OFFERED a second time)"
          assert:
            - "TR1.status sequence is REQUESTED, OFFERED, DECLINED, REQUESTED, OFFERED — proving cycle"
            - "TR1.id stays the same across the cycle (no re-creation)"

      - name: reservation_branching_with_expiry_branch
        grounds:
          - state_machines.Reservation.DRAFT_to_APPROVED
          - state_machines.Reservation.DRAFT_to_CANCELLED
          - state_machines.Reservation.APPROVED_to_CHECKED_IN
          - state_machines.Reservation.APPROVED_to_CANCELLED
          - state_machines.Reservation.APPROVED_to_EXPIRED
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          Reservation has branching fork shape from APPROVED: {CHECKED_IN, CANCELLED, EXPIRED}
          with different side-effect sets per branch (CANCELLED preserves liveaboard count
          increment reversal symmetrically with EXPIRED, while CHECKED_IN holds the count
          and only releases it at CHECKED_OUT). Entity Reservation — a different entity than
          the SlipTransferRequest cycle above.
        test_recipe:
          setup:
            - "Setup two reservations R_A and R_B with liveaboard=true on different slips, both approved"
          trigger:
            - "POST /reservations/R_A/cancel (APPROVED→CANCELLED branch)"
            - "Advance clock past check_in_date+1 day for R_B, POST /_ops/run"
          assert:
            - "R_A.status == CANCELLED AND Marina.liveaboard_active_count decremented by 1"
            - "R_B.status == EXPIRED AND Marina.liveaboard_active_count decremented by 1 (different branch, same side effect type)"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pump_out_complete_to_utility_reading_to_settlement
        grounds:
          - state_machines.PumpOutJob.SCHEDULED_to_COMPLETED
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - entities.UtilityReading
          - entities.UtilitySettlement
          - calculations.liveaboard_utility_settlement
        distinguishing_aspect: |
          Depth-3 cascade triggered by completing a PumpOutJob: PumpOutJob.COMPLETED
          (link 1: action on PumpOutJob) → appends a new UtilityReading row
          (link 2: PumpOutJob completion CAUSES the reading insert; the reading would
          not exist without the pump-out completing) → next Reservation.check-out then
          consumes that reading inside liveaboard_utility_settlement (link 3: the
          reading's presence CAUSES a different UtilitySettlement.total_cents). Without
          the pump-out, the settlement would be 100*18 + 0*4 + 0 = 1800; with it,
          100*18 + 50*4 + 2500 = 4500.
        test_recipe:
          setup:
            - "Create Marina, Boater, Vessel V1 with holding_tank_gallons=60, Slip with liveaboard_allowed=true, ACTIVE policy"
            - "POST /reservations -> R liveaboard=true, 2024-02-01→2024-02-02"
            - "Approve R; clock-advance to 2024-02-01T10:00Z; check-in"
            - "POST /reservations/R/utility-readings -> kwh_delta=100, water_gallons_delta=0, read_at=2024-02-01T18:00Z"
            - "POST /pump-out-jobs -> PJ1 reservation_id=R, scheduled_start=2024-02-01T19:00Z, scheduled_end=2024-02-01T19:30Z"
          trigger:
            - "POST /pump-out-jobs/PJ1/complete tank_gallons_drained=50  (link 1→2: appends UtilityReading)"
            - "POST /_clock/advance to 2024-02-02T12:00Z"
            - "POST /reservations/R/check-out (link 2→3: settlement reads the appended row)"
          assert:
            - "After complete: a UtilityReading exists with water_gallons_delta=50 caused by PumpOutJob.complete"
            - "UtilitySettlement.water_gallons_total == 50 (not 0)"
            - "UtilitySettlement.total_cents == 4500 (chain visible in the final number)"

      - name: hub_clock_advance_to_policy_expiry_to_approval_block
        grounds:
          - state_machines.InsurancePolicy.ACTIVE_to_EXPIRED
          - state_machines.Reservation.DRAFT_to_APPROVED
          - validations[priority=8]
          - endpoints["POST /_ops/run"]
          - endpoints["POST /_clock/advance"]
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger than Rule 4 instance 1.
          POST /_clock/advance (link 1: action on Marina) → next POST /_ops/run flips
          InsurancePolicy.status ACTIVE → EXPIRED (link 2: the policy expiry is caused
          by the new clock value, not by any boater action). A subsequent attempt to
          POST /reservations/{id}/approve referencing that policy fails with
          ERR_INSURANCE_LAPSED, observable through the validation chain. Originates
          from a different transition than the pump-out chain.
        test_recipe:
          setup:
            - "Create Marina, Boater, Vessel V1, Slip S1, Policy P1 effective_date=2024-01-01, expiration_date=2024-06-01"
            - "Create Reservation R DRAFT, check_in_date=2024-07-01, check_out_date=2024-07-05, policy=P1"
          trigger:
            - "POST /_clock/advance to 2024-06-02T00:00Z (link 1)"
            - "POST /_ops/run (link 2: P1 ACTIVE → EXPIRED via cascade)"
            - "POST /reservations/R/approve (observe ERR_INSURANCE_LAPSED caused by chain)"
          assert:
            - "After POST /_ops/run: InsurancePolicy P1.status == EXPIRED (caused by clock advance through ops sweep)"
            - "POST /reservations/R/approve returns ERR_INSURANCE_LAPSED 422"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_loa_on_approve_after_cancel
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.Reservation.DRAFT_to_CANCELLED
          - state_machines.Reservation.DRAFT_to_APPROVED
        distinguishing_aspect: |
          Pair (state) vs (business_safety). A Reservation that was cancelled in DRAFT
          state — and that was referencing a Slip too small for its Vessel — would
          fail BOTH (state: must be DRAFT to approve, currently CANCELLED) AND
          (safety: Vessel.loa_feet > Slip.length_feet). Priority 4 (state) fires
          first: ERR_INVALID_STATE wins, not ERR_LOA_EXCEEDS_SLIP.
        test_recipe:
          setup:
            - "Marina, Boater B1, ACTIVE Policy spanning"
            - "Slip S_small length_feet=20.0, beam_feet=14.0, depth_feet=6.0"
            - "Vessel V_big loa_feet=40.0, beam_feet=10.0, draft_feet=4.0"
            - "POST /reservations -> R DRAFT vessel=V_big slip=S_small"
            - "POST /reservations/R/cancel (R DRAFT → CANCELLED)"
          trigger:
            - "POST /reservations/R/approve (would fail both state and LOA)"
          assert:
            - "Response status 409 with error_id ERR_INVALID_STATE (state at priority 4 fires before LOA at priority 5)"

      - name: liveaboard_quota_fiscal_vs_slip_occupied_temporal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          Pair (business_fiscal) vs (business_temporal). A request both (a) would push
          Marina.liveaboard_active_count above quota AND (b) overlaps an existing
          APPROVED reservation on the requested slip. Priority 10 must fire before
          priority 11: ERR_LIVEABOARD_QUOTA_EXCEEDED wins, not ERR_SLIP_OCCUPIED. A
          completely different error-category pair than (state vs safety) above.
        test_recipe:
          setup:
            - "Marina with liveaboard_quota=1; one liveaboard Reservation R_existing APPROVED on Slip S1 for 2024-03-01→2024-03-05 (active_count=1)"
            - "Second liveaboard Reservation R_new DRAFT on the SAME Slip S1 for 2024-03-02→2024-03-06 (overlapping with R_existing)"
          trigger:
            - "POST /reservations/R_new/approve"
          assert:
            - "Response status 409 with error_id ERR_LIVEABOARD_QUOTA_EXCEEDED (fiscal at priority 10 fires before temporal at priority 11)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: loa_exact_match_boundary
        grounds:
          - validations[priority=5]
          - entities.Slip.fields.length_feet
          - entities.Vessel.fields.loa_feet
          - endpoints["POST /marinas/:marina_id/reservations/:reservation_id/approve"]
        distinguishing_aspect: |
          Numeric metric boundary (>= vs >). Slip.length_feet=40.0 vs Vessel.loa_feet=40.0
          must PASS (>= is inclusive); Vessel.loa_feet=40.1 must FAIL with
          ERR_LOA_EXCEEDS_SLIP. Reached through POST /reservations/:id/approve.
        test_recipe:
          setup:
            - "Slip S1 length_feet=40.0, beam_feet=14.0, depth_feet=6.0"
            - "Vessel V_exact loa_feet=40.0, beam_feet=10.0, draft_feet=4.0"
            - "Vessel V_over  loa_feet=40.1, beam_feet=10.0, draft_feet=4.0"
            - "Reservation R_exact uses V_exact; Reservation R_over uses V_over"
          trigger:
            - "POST /reservations/R_exact/approve"
            - "POST /reservations/R_over/approve"
          assert:
            - "R_exact.status == APPROVED (boundary inclusive)"
            - "POST /reservations/R_over/approve -> 422 ERR_LOA_EXCEEDS_SLIP"

      - name: empty_candidate_set_waitlist_no_promotion
        grounds:
          - calculations.slip_match_selector
          - state_machines.WaitlistEntry.QUEUED_to_PROMOTED
          - endpoints["POST /marinas/:marina_id/_ops/run"]
        distinguishing_aspect: |
          Empty-set boundary on a DIFFERENT metric (collection-empty vs numeric).
          When the candidate Slip set is empty, the waitlist entry MUST remain QUEUED
          (no promotion); only when a slip becomes available on a later _ops/run
          tick does promotion occur. Reached through POST /_ops/run, a different
          endpoint than approve.
        test_recipe:
          setup:
            - "Marina with one Slip S_small length_feet=20.0 (too small)"
            - "Boater B1, Vessel V_big loa_feet=30.0, beam_feet=10.0, draft_feet=4.0"
            - "POST /waitlist -> entry W1 vessel=V_big, requested_check_in=2024-05-01, requested_check_out=2024-05-05"
          trigger:
            - "POST /_ops/run (candidate set empty -> no promotion)"
            - "POST /slips -> Slip S_big length_feet=40.0, beam_feet=14.0, depth_feet=6.0"
            - "POST /_ops/run (now candidate set is non-empty)"
          assert:
            - "After first ops/run: W1.status == QUEUED (empty-set boundary; no error, no promotion)"
            - "After second ops/run: W1.status == PROMOTED AND a new Reservation was created APPROVED on S_big"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_approve_depends_on_insurance_policy_status
        grounds:
          - state_machines.Reservation.DRAFT_to_APPROVED
          - validations[priority=8]
          - state_machines.InsurancePolicy.ACTIVE_to_EXPIRED
          - entities.InsurancePolicy.fields.status
        distinguishing_aspect: |
          Cross-entity pair Reservation ↔ InsurancePolicy. Reservation.DRAFT→APPROVED
          requires the referenced InsurancePolicy.status == ACTIVE (a different
          entity's state field). If the policy is EXPIRED or CANCELLED, approval is
          blocked with ERR_INSURANCE_LAPSED.
        test_recipe:
          setup:
            - "Boater B1, ACTIVE Policy P1 effective_date=2024-01-01, expiration_date=2024-03-01"
            - "Cancel Policy P1 (ACTIVE → CANCELLED) — but make sure no APPROVED reservation references it yet"
            - "Reservation R DRAFT references P1, check_in=2024-02-01, check_out=2024-02-05"
          trigger:
            - "POST /policies/P1/cancel"
            - "POST /reservations/R/approve"
          assert:
            - "Policy P1.status == CANCELLED"
            - "POST /reservations/R/approve -> 422 ERR_INSURANCE_LAPSED (Reservation approval blocked by another entity's state)"

      - name: reservation_checkout_depends_on_pumpoutjob_status
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - state_machines.PumpOutJob.SCHEDULED_to_COMPLETED
          - validations[priority=14]
          - entities.PumpOutJob.fields.status
        distinguishing_aspect: |
          Different cross-entity pair Reservation ↔ PumpOutJob. CHECKED_IN→CHECKED_OUT
          requires no PumpOutJob.status == SCHEDULED references this reservation.
          Distinct entity pair from instance 1 (Reservation↔InsurancePolicy).
        test_recipe:
          setup:
            - "Reservation R CHECKED_IN, liveaboard=true"
            - "POST /pump-out-jobs -> PJ1 reservation_id=R, status=SCHEDULED"
          trigger:
            - "POST /reservations/R/check-out (should fail because PJ1 is SCHEDULED)"
            - "POST /pump-out-jobs/PJ1/cancel"
            - "POST /reservations/R/check-out (now should succeed)"
          assert:
            - "First check-out call -> 409 ERR_HAS_DEPENDENCIES (caused by PumpOutJob's state)"
            - "After PJ1 cancelled: second check-out call succeeds, R.status == CHECKED_OUT"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_overlap_half_open_intervals
        grounds:
          - validations[priority=11]
          - entities.Reservation.fields.check_in_date
          - entities.Reservation.fields.check_out_date
        distinguishing_aspect: |
          Half-open interval semantics on Slip occupation. [check_in_date, check_out_date)
          means reservations are adjacent-allowed: R_A 2024-05-01→2024-05-05 and R_B
          2024-05-05→2024-05-10 do NOT overlap (because 5/5 is exclusive on R_A and
          inclusive on R_B). But R_C 2024-05-04→2024-05-06 DOES overlap R_A.
          Resource: Slip; geometry: half-open closed-at-start.
        test_recipe:
          setup:
            - "Slip S1 with sufficient size, policy spanning"
            - "Approve Reservation R_A on S1 for 2024-05-01→2024-05-05"
          trigger:
            - "POST /reservations -> R_B same slip 2024-05-05→2024-05-10; approve"
            - "POST /reservations -> R_C same slip 2024-05-04→2024-05-06; approve"
          assert:
            - "R_B approve succeeds (adjacent, no overlap under half-open arithmetic)"
            - "R_C approve fails 409 ERR_SLIP_OCCUPIED (overlaps R_A by [5/4, 5/5))"

      - name: pump_out_overlap_open_left_closed_right
        grounds:
          - validations[priority=12]
          - entities.PumpOutJob.fields.scheduled_start
          - entities.PumpOutJob.fields.scheduled_end
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource. PumpOutJob windows
          use (scheduled_start, scheduled_end] — open at start, closed at end (the
          opposite parity to reservations). Two pump-outs at the same slip:
          (10:00, 11:00] and (11:00, 12:00] do NOT overlap (because 11:00 is closed
          on first and open on second). But (10:30, 11:30] DOES overlap (10:00, 11:00].
          Distinct resource entity (PumpOutJob) and distinct interval parity from
          the reservation overlap above.
        test_recipe:
          setup:
            - "CHECKED_IN Reservation R on Slip S1"
            - "POST /pump-out-jobs -> PJ1 scheduled_start=10:00, scheduled_end=11:00"
          trigger:
            - "POST /pump-out-jobs -> PJ2 scheduled_start=11:00, scheduled_end=12:00 (adjacent)"
            - "POST /pump-out-jobs -> PJ3 scheduled_start=10:30, scheduled_end=11:30 (overlap)"
          assert:
            - "PJ2 created successfully (adjacent under open-left/closed-right arithmetic)"
            - "PJ3 creation fails 409 ERR_PUMP_OUT_CONFLICT"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: liveaboard_active_count_conservation
        grounds:
          - entities.Marina.fields.liveaboard_active_count
          - state_machines.Reservation.DRAFT_to_APPROVED
          - state_machines.Reservation.APPROVED_to_CANCELLED
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - state_machines.Reservation.APPROVED_to_EXPIRED
        distinguishing_aspect: |
          Conserved quantity: Marina.liveaboard_active_count. INVARIANT:
          Marina.liveaboard_active_count ==
          count(Reservation WHERE marina_id=M AND liveaboard=true AND status IN
          {APPROVED, CHECKED_IN}). Forward APPROVE (+1) paired with any of CANCEL,
          EXPIRE, or CHECKED_OUT (-1) MUST leave this aggregate at its pre-approve
          value. Quantity type: a counter / population aggregate.
        test_recipe:
          setup:
            - "Marina M with liveaboard_quota=3; assert M.liveaboard_active_count == 0"
            - "Three Slips with liveaboard_allowed=true, three Vessels with holding_tank_gallons set, ACTIVE policy each"
            - "Create three liveaboard Reservations R1 R2 R3 all DRAFT on distinct slips with non-overlapping dates"
          trigger:
            - "POST /reservations/R1/approve (DRAFT→APPROVED: +1 → 1)"
            - "POST /reservations/R2/approve (DRAFT→APPROVED: +1 → 2)"
            - "POST /reservations/R1/cancel  (APPROVED→CANCELLED: -1 → 1)"
            - "Advance clock to R2.check_in; POST /reservations/R2/check-in (APPROVED→CHECKED_IN: 0 → 1, no change)"
            - "POST /reservations/R3/approve (DRAFT→APPROVED: +1 → 2)"
            - "Advance clock past R3.check_out; POST /reservations/R3/check-out (CHECKED_IN→CHECKED_OUT: -1 → 1)"
            - "Advance clock past R2.check_out; POST /reservations/R2/check-out (-1 → 0)"
          assert:
            - "After every individual transition: Marina.liveaboard_active_count equals count(Reservation WHERE marina_id=M AND liveaboard=true AND status IN {APPROVED, CHECKED_IN})"
            - "Final Marina.liveaboard_active_count == 0"

      - name: tow_assist_coverage_pool_conservation
        grounds:
          - entities.TowAssistContract.fields.tows_remaining
          - calculations.tow_event_charge
          - entities.TowEvent.fields.charge_cents
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance 1's population counter — here
          it is an integer COVERAGE POOL on a BASIC tow contract. INVARIANT:
          for any sequence of TowEvents on a BASIC contract,
          tows_remaining + (count of TowEvents with charge_cents == 0) ==
          initial_tows_remaining (i.e., 2 for BASIC).
          A free tow (compensating action of "use coverage") decrements
          tows_remaining by 1 and produces a 0-cent event; an out-of-coverage tow
          (the alternative branch) leaves tows_remaining unchanged at 0 and
          produces a TOW_FLAT_FEE_CENTS=25000 charge. The pool is conserved.
        test_recipe:
          setup:
            - "Boater B1, BASIC TowAssistContract C1 (tows_remaining=2)"
            - "Three AVAILABLE Slips dest1, dest2, dest3"
          trigger:
            - "POST /tow-contracts/C1/tow-events to_slip_id=dest1"
            - "POST /tow-contracts/C1/tow-events to_slip_id=dest2"
            - "POST /tow-contracts/C1/tow-events to_slip_id=dest3 (out of coverage)"
          assert:
            - "After event 1: C1.tows_remaining == 1 AND event1.charge_cents == 0"
            - "After event 2: C1.tows_remaining == 0 AND event2.charge_cents == 0"
            - "After event 3: C1.tows_remaining == 0 (unchanged at floor) AND event3.charge_cents == 25000"
            - "Invariant holds: C1.tows_remaining + (count of events with charge_cents == 0) == 2"
