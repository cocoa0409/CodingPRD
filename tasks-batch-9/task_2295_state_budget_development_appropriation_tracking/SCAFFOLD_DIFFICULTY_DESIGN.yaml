              payload: { appropriation_id: "${appr_id}", quarter: 1, amount_cents: 250000000, object_code: "5100", vendor_reference: "INV-77001" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { exp_id: $.data.id }
            - call: "POST /fiscal/federal-grants/${grant_id}/moe-assessment"
              payload: { basis: "SINGLE_YEAR" }
              as: BudgetAnalyst
            - call: "POST /fiscal/expenditures/${exp_id}/void"
              payload: { reason: "charge posted to the wrong appropriation" }
              as: StateController
            - call: "POST /fiscal/federal-grants/${grant_id}/moe-assessment"
              payload: { basis: "SINGLE_YEAR" }
              as: BudgetAnalyst
            - call: "POST /fiscal/expenditures/${exp_id}/void"
              payload: { reason: "duplicate void attempt" }
              as: StateController
          assert:
            - "after the posting: Expenditure.${exp_id}.status == POSTED and Appropriation.${appr_id}.expended_cents == 250000000"
            - "after the posting: GET /fiscal/appropriations/${appr_id}/balance-summary reports available_cash_cents == 150000000 and available_authority_cents == 1750000000"
            - "the first moe-assessment returns moe_current_spend_cents == 250000000, moe_assessed_basis == SINGLE_YEAR, moe_compliance_status == COMPLIANT and moe_compliance_ratio == 1.250000"
            - "after the void: Expenditure.${exp_id}.status == VOIDED and Appropriation.${appr_id}.expended_cents == 0"
            - "after the void: GET /fiscal/appropriations/${appr_id}/balance-summary reports available_cash_cents == 400000000 and available_authority_cents == 2000000000, identical to the pre-posting reading"
            - "the second moe-assessment returns moe_current_spend_cents == 0, moe_compliance_status == DEFICIENT and moe_compliance_ratio == 0.000000"
            - "Appropriation.${appr_id}.released_cents remains 400000000 and BudgetCycle.${cyc_id}.total_released_cents remains 400000000, so the void touched only the expenditure ledger"
            - "the second POST /fiscal/expenditures/${exp_id}/void returns HTTP 409 with error_id == ERR_INVALID_STATE"
