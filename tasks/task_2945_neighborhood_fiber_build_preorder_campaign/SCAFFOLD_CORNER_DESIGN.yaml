  - section: endpoints
    instances:
      - name: qualification_run_evaluates_the_past_deadline_zone_and_silently_skips_the_extended_one
        claim_type: Bulk action
        grounds:
          - endpoints["POST /campaigns/{id}/qualification-run"]
          - validations[priority 17 ERR_PREREG_DEADLINE_NOT_REACHED]
        distinguishing_aspect: "Skip-not-fail semantics inside one campaign-wide sweep: the zone whose deadline has passed is evaluated and closed out, while the zone that bought a 30-day extension is left untouched with null final numbers, and the response body contains only the evaluated zone -- one call, two different outcomes, no error."
        test_recipe:
          setup:
            - "One campaign closing 2026-09-30T23:59:00Z with extension_grant_days 30, and two zones with household_count 10 and no preorders at all."
            - "Zone Beta extended once, so its deadline is 2026-10-30T23:59:00Z and its campaign_status is PREREG_EXTENDED."
            - "The clock then moved to 2026-10-01T00:00:00Z, past Alpha's deadline but inside Beta's."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000, max_deadline_extensions: 2, extension_grant_days: 30 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Beta", zone_code: "B1", household_count: 10 }
              as: ProgramManager
              captures: { z2: $.data.id }
            - call: "POST /build-zones/${z2}/extend-deadline"
              payload: {}
              as: ProgramManager
              captures: { beta_deadline: $.data.prereg_deadline_at, beta_version_before: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /campaigns/${camp}/qualification-run"
              payload: {}
              as: ProgramManager
              captures: { evaluated_id: "$.data[0].id", evaluated_status: "$.data[0].campaign_status", evaluated_rate: "$.data[0].final_rate_pct" }
          assert:
            - "${beta_deadline} == 2026-10-30T23:59:00Z"
            - "the response is HTTP 200 with total_count 1 and ${evaluated_id} == ${z1}"
            - "${evaluated_status} == NOT_QUALIFIED and ${evaluated_rate} == 0.00 with final_qualifying_count 0"
            - "BuildZone.${z2}.campaign_status == PREREG_EXTENDED with final_rate_pct == null, final_qualifying_count == null and version == ${beta_version_before}"

      - name: campaign_zone_count_is_a_derived_read
        claim_type: Computed read
        grounds:
          - entities.Campaign.fields.zone_count
          - endpoints["GET /campaigns/{id}"]
        distinguishing_aspect: "zone_count is derived on read from the zones that actually reference the campaign: it is 0 immediately after creation, 2 after two zones are added, and it counts NOT_QUALIFIED and PREREG_OPEN zones alike because no state filter applies."
        test_recipe:
          setup:
            - "One campaign with no zones."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id, count_at_create: $.data.zone_count }
          trigger:
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Beta", zone_code: "B1", household_count: 40 }
              as: ProgramManager
              captures: { z2: $.data.id }
            - call: "GET /campaigns/${camp}"
              payload: {}
              as: InstallCoordinator
              captures: { count_after: $.data.zone_count }
          assert:
            - "${count_at_create} == 0"
            - "${count_after} == 2"
            - "GET /build-zones?campaign_id=${camp} returns total_count 2 with ${z1} and ${z2}"
            - "the derived count is readable by a non-ProgramManager role, since GET /campaigns/{id} lists all eight roles"

      - name: pole_acceptance_rolls_the_quote_into_the_zone_make_ready_cost
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /pole-attachment-requests/{id}/decision"]
          - entities.BuildZone.fields.make_ready_cost_cents
          - calculations.make_ready_share_allocation
        distinguishing_aspect: "Ledger-style sync driven by a state transition: the surveyed quote sits outside the zone's make_ready_cost_cents while the request is merely SURVEYED, is folded in the instant it is ACCEPTED, and a second request that is DENIED never contributes -- so the zone total is 45600, not 45600 + 90000."
        test_recipe:
          setup:
            - "One campaign and one zone with two pole requests, each SURVEYED: the first quoted at 45600 cents, the second at 90000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /pole-attachment-requests"
              payload: { build_zone_id: "${z1}", utility_owner: "Aurora Power", pole_count: 12 }
              as: ProgramManager
              captures: { pr1: $.data.id }
            - call: "POST /pole-attachment-requests"
              payload: { build_zone_id: "${z1}", utility_owner: "Aurora Telecom", pole_count: 20 }
              as: ProgramManager
              captures: { pr2: $.data.id }
            - call: "POST /pole-attachment-requests/${pr1}/survey"
              payload: { make_ready_cost_cents: 45600 }
              as: UtilityOperator
            - call: "POST /pole-attachment-requests/${pr2}/survey"
              payload: { make_ready_cost_cents: 90000 }
              as: UtilityOperator
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { cost_before: $.data.make_ready_cost_cents }
          trigger:
            - call: "POST /pole-attachment-requests/${pr1}/decision"
              payload: { decision: "ACCEPT" }
              as: ProgramManager
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { cost_after_accept: $.data.make_ready_cost_cents }
            - call: "POST /pole-attachment-requests/${pr2}/decision"
              payload: { decision: "DENY", denial_reason: "Capacity unavailable on the shared route." }
              as: UtilityOperator
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { cost_after_deny: $.data.make_ready_cost_cents, posture: $.data.readiness_posture, construction: $.data.construction_status }
          assert:
            - "${cost_before} == 0 -- a SURVEYED quote contributes nothing"
            - "${cost_after_accept} == 45600"
            - "${cost_after_deny} == 45600 -- the DENIED 90000 quote is excluded"
            - "PoleAttachmentRequest.${pr2}.status == DENIED with denial_reason recorded"
            - "${construction} == NOT_STARTED, so the DENY cascade to SUSPENDED did not fire on a zone that never broke ground"
            - "${posture} == POLE_PENDING because no request is ATTACHED yet"

      - name: fallback_offer_only_sees_options_of_the_addresses_own_campaign
        claim_type: Cross-reference link
        grounds:
          - endpoints["POST /service-addresses/{id}/fallback-offers"]
          - calculations.fallback_option_selection.input_set
          - validations[priority 32 ERR_NO_FALLBACK_OPTION_AVAILABLE]
        distinguishing_aspect: "The candidate pool is scoped through a two-hop reference -- address to build zone to campaign -- so an ENABLED, generously-reaching option that belongs to a second campaign is invisible and the run is refused with ERR_NO_FALLBACK_OPTION_AVAILABLE instead of borrowing it."
        test_recipe:
          setup:
            - "Two campaigns. The first has a zone with an unserved SINGLE_FAMILY address at 400 m and no options of its own."
            - "The second campaign owns one ENABLED FIXED_WIRELESS option with reach 5000 m that would fit that address perfectly."
            - "One RESIDENT account to receive an offer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp1: $.data.id }
            - call: "POST /campaigns"
              payload: { name: "Fiberhood East", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp2: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp1}", name: "Zone Alpha", zone_code: "A1", household_count: 10 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "12 Quarry Rd", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 400 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "NOT_SERVICEABLE", not_serviceable_reason: "EXCESSIVE_DISTANCE" }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "REQUEST", exception_reason: "No route to the node; resident wants an alternative." }
              as: ProgramManager
            - call: "POST /service-addresses/${a1}/unserved-exception"
              payload: { action: "GRANT" }
              as: ProgramManager
            - call: "POST /fallback-options"
              payload: { campaign_id: "${camp2}", technology: "FIXED_WIRELESS", min_downstream_mbps: 400, monthly_price_cents: 5000, max_serviceable_distance_m: 5000, priority_rank: 1 }
              as: ProgramManager
              captures: { o_other: $.data.id }
            - call: "POST /accounts"
              payload: { full_name: "Cass Doyle", email: "cass@example.com", phone: "+13035550103", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
          trigger:
            - call: "POST /service-addresses/${a1}/fallback-offers"
              payload: { account_id: "${acct1}", expires_at: "2026-09-01T00:00:00Z" }
              as: ProgramManager
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_NO_FALLBACK_OPTION_AVAILABLE"
            - "FallbackTechnologyOption.${o_other}.option_status == ENABLED and max_serviceable_distance_m == 5000 -- it was eligible on every dimension except campaign membership"
            - "GET /fallback-offers?service_address_id=${a1} returns total_count 0"
            - "ServiceAddress.${a1}.exception_status == GRANTED and active_fallback_technology == null"

      - name: install_crew_create_read_and_filtered_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints["POST /install-crews"]
          - endpoints["GET /install-crews/{id}"]
          - endpoints["GET /install-crews"]
        distinguishing_aspect: "The crew's three read/write surfaces agree with each other and the crew_type filter partitions them: two crews are created, the BURY filter returns exactly one, and the counters that later gate scheduling both start at 0 on a freshly created crew."
        test_recipe:
          setup:
            - "No fixtures beyond the clock; crews are top-level rows with no parent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "POST /install-crews"
              payload: { name: "Bury Crew 1", crew_type: "BURY", travel_buffer_minutes: 45, daily_capacity_minutes: 600 }
              as: InstallCoordinator
              captures: { c1: $.data.id, booked: $.data.booked_minutes_total, count: $.data.scheduled_appointment_count, ver: $.data.version }
            - call: "POST /install-crews"
              payload: { name: "Aerial Crew 1", crew_type: "AERIAL" }
              as: InstallCoordinator
              captures: { c2: $.data.id }
            - call: "GET /install-crews/${c1}"
