              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_STALE_VERSION (412) — OCC/state outranks safety"
            - "err2 == ERR_SITE_POSTURE_BLOCKS_DROP (409) — fresh version reaches the safety check"

      - name: referential_vs_temporal_priority
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_ACCESS_GRANT_INVALID]
          - errors[ERR_DROP_OUTSIDE_AGREEMENT_TERM]
        distinguishing_aspect: |
          Different category pair (business_referential vs business_temporal):
          a drop whose occurred_at precedes the agreement term AND whose grant
          is REVOKED must fail ERR_ACCESS_GRANT_INVALID (priority 8) before
          ERR_DROP_OUTSIDE_AGREEMENT_TERM (priority 9).
        test_recipe:
          setup:
            - "Program ACTIVE; site OPERATIONAL with agreement [2026-06-01, 2027-01-01)"
            - "Participant's grant REVOKED (buckets_checked_out == 0)"
            - "Drop occurred_at = 2026-05-01 (before term start) — temporally invalid too"
          setup_api_calls:
