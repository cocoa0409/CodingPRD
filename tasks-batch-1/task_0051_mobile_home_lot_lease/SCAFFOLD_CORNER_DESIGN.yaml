      - name: increase_too_soon_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INCREASE_TOO_SOON]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rent_increase_12_month_spacing_overlap
          rationale: "ERR_INCREASE_TOO_SOON is the asserted failure path of the named §1.8 overlap instance."

      - name: stale_lot_version_on_supersede
        claim_type: violation_to_error
