          - validations[priority=18]
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
          - errors[ERR_ROUTE_NOT_OPEN]
        distinguishing_aspect: |
          Category pair business_fiscal (capacity, priority 17) vs state (route-not-open,
          priority 18): a booking that is BOTH over capacity AND on a LOCKED route returns
          ERR_ROUTE_CAPACITY_EXCEEDED (lower priority number wins).
        test_recipe:
          setup:
