          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Theta", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000, crisis_sla_minutes: 15 }
