              as: RegistrarOfficer
              captures: { ff: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
            - call: "POST /ir/survey-components/${comp}/metrics"
              payload: { metric_key: "TOTAL_HEADCOUNT", reported_value: 1000, prior_year_value: 1000, source_field_path: "sis.enrollment.total_headcount" }
              as: IRAnalyst
            - call: "POST /ir/survey-components/${comp}/prepare"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
            - call: "POST /ir/external-submissions"
              payload: { cycle_id: "${cyc}", component_id: "${comp}", target_type: "STATE", target_name: "State Board of Higher Education", metric_key: "TOTAL_HEADCOUNT", reported_value: 1005 }
              as: IRAnalyst
              captures: { sub: $.data.id }
          trigger:
            - call: "POST /ir/external-submissions/${sub}/reconcile"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
            - call: "POST /ir/survey-components/${comp}/certify"
              payload: { certification_statement: "I certify the fall enrollment headcount for state reporting." }
              as: IRDirector
              as_user_id: "director-1"
            - call: "POST /ir/external-submissions/${sub}/reconcile"
              payload: {}
              as: IRAnalyst
              as_user_id: "analyst-1"
          assert:
            - "First reconcile: HTTP status == 409 and response.error_id == \"ERR_SOURCE_NOT_CERTIFIED\""
            - "After the refused reconcile: ExternalSubmission.${sub}.status == DRAFT, federal_value is null, raw_delta_pct is null, allowance_pct is null, effective_delta_pct is null, tolerance_pct is null"
            - "SurveyComponent.${comp}.prep_status == CERTIFIED after the certify call"
            - "Second reconcile: ExternalSubmission.${sub}.status == RECONCILED"
            - "ExternalSubmission.${sub}.federal_value == 1000"
            - "ExternalSubmission.${sub}.raw_delta_pct == 0.50"
            - "ExternalSubmission.${sub}.allowance_pct == 0.00"
            - "ExternalSubmission.${sub}.effective_delta_pct == 0.50"
            - "ExternalSubmission.${sub}.tolerance_pct == 0.50"
  - rule_id: resource_temporal_overlap
    instances:
      - name: frozen_file_closed_coverage_windows_reject_shared_end_date
        grounds:
          - calculations.frozen_file_coverage_overlap
          - validations[priority=25]
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
          - entities.FrozenFile.fields.coverage_start_date
          - entities.FrozenFile.fields.coverage_end_date
          - calculations.cycle_active_record_count
        distinguishing_aspect: |
          Coverage windows are CLOSED date intervals scoped to (cycle_id, domain), so a
          second ENROLLMENT extract starting on 2026-10-15 - the day the incumbent ends - is
          rejected, while the same extract starting one day later on 2026-10-16 is accepted
          and an identical window in the COMPLETIONS domain never conflicts at all.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is OPEN (logical clock at the 2026-08-01T00:00:00Z startup default, before the 2026-10-15 census date)."
            - "Extract EX-1 is registered for domain ENROLLMENT over the closed window 2026-09-01 to 2026-10-15 with record_count 1000 and is ACTIVE."
          setup_api_calls:
