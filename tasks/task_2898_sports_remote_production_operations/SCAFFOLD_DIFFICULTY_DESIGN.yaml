  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: satellite_transponder_exclusive_window_with_symmetric_guard_band
        grounds:
          - calculations.path_window_load_mbps
          - validations[priority=48]
          - errors[ERR_PATH_WINDOW_CONFLICT]
          - entities.TransmissionPath.fields.guard_band_minutes
        distinguishing_aspect: |
          Resource entity: TransmissionPath (SATELLITE). Interval semantics: *exclusive* occupation,
          inflated by guard_band_minutes on BOTH ends, compared half-open. A trailing booking is
          accepted at a gap of exactly 10 minutes and refused at 9; a leading booking is accepted at
          a gap of exactly 10 and refused at 9. Both directions matter, so a one-sided guard-band
          implementation passes half of this test and fails the other half.
        test_recipe:
          setup:
            - "One SATELLITE path SAT-1: capacity_mbps 300, guard_band_minutes 10, PRIMARY_ELIGIBLE."
            - "Three TIER_3 productions A, B and C, each PLANNED (path bookings do not require a survey)."
            - "Production A holds the incumbent booking 2026-08-15T20:00:00Z .. 22:00:00Z at 100 Mbps, status RESERVED (an ACTIVE booking)."
          setup_api_calls:
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "SAT-1", path_type: "SATELLITE", carrier_code: "TELE1", capacity_mbps: 300, guard_band_minutes: 10, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { sat_id: $.data.id }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T20:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a_id: $.data.id, pva: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbour Dome", venue_power_capacity_amps: 400, venue_roof_type: "FIXED", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T22:30:00Z", scheduled_end_utc: "2026-08-15T23:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b_id: $.data.id, pvb: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Northgate Field", venue_power_capacity_amps: 400, venue_roof_type: "RETRACTABLE", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:30:00Z", scheduled_end_utc: "2026-08-15T19:30:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_c_id: $.data.id, pvc: $.data.version }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_a_id}", path_id: "${sat_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T20:00:00Z", window_end_utc: "2026-08-15T22:00:00Z", requested_mbps: 100, expected_production_version: "${pva}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_a_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_b_id}", path_id: "${sat_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T22:09:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 100, expected_production_version: "${pvb}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err_trailing: $.data.error_id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_b_id}", path_id: "${sat_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T22:10:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 100, expected_production_version: "${pvb}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_b_id: $.data.id, booking_b_status: $.data.status }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_c_id}", path_id: "${sat_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T18:00:00Z", window_end_utc: "2026-08-15T19:51:00Z", requested_mbps: 100, expected_production_version: "${pvc}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err_leading: $.data.error_id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_c_id}", path_id: "${sat_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T18:00:00Z", window_end_utc: "2026-08-15T19:50:00Z", requested_mbps: 100, expected_production_version: "${pvc}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_c_id: $.data.id }
          assert:
            - "Trailing gap 9 minutes: HTTP 422 with error_id == ERR_PATH_WINDOW_CONFLICT"
            - "Trailing gap exactly 10 minutes: HTTP 201, PathBooking.${booking_b_id}.status == RESERVED"
            - "Leading gap 9 minutes: HTTP 422 with error_id == ERR_PATH_WINDOW_CONFLICT"
            - "Leading gap exactly 10 minutes: HTTP 201, PathBooking.${booking_c_id}.status == RESERVED"
            - "TransmissionPath.${sat_id}.active_booking_count == 3 and committed_mbps_total == 300"
            - "GET /broadcast-ops/path-bookings?path_id=${sat_id} returns total_count == 3 (the two rejected attempts left no rows)"
            - "Production.${prod_b_id}.version advanced exactly once and Production.${prod_c_id}.version advanced exactly once across the four attempts"

      - name: truck_travel_occupation_window_asymmetric_buffers
        grounds:
          - calculations.truck_travel_occupation_window
          - validations[priority=46]
          - errors[ERR_TRUCK_TRAVEL_WINDOW_CONFLICT]
          - state_machines.ProductionTruck.ASSIGNED_to_ASSIGNED
        distinguishing_aspect: |
          A different resource entity (ProductionTruck) with genuinely different interval semantics:
          the occupation window is ASYMMETRIC - 24 hours of travel-in before scheduled_start and only
          12 hours of tear-down after scheduled_end - and compared half-open. Production A
          (08-15 18:00..22:00) occupies [08-14T18:00, 08-16T10:00). A remote starting 08-17T10:00
          touches that end exactly and is accepted; starting one hour earlier it is refused. A
          symmetric +/-24h rule would reject the accepted case, and a symmetric +/-12h rule would
          accept the rejected case.
        test_recipe:
          setup:
            - "One TIER_3 truck TRK-01 (AVAILABLE, engine_hours_since_service 100, service_interval_hours 500)."
            - "Production A: 2026-08-15T18:00:00Z .. 22:00:00Z, already holding TRK-01 (truck ASSIGNED, A still PLANNED so it has not released the truck)."
            - "Production B: 2026-08-17T09:00:00Z .. 13:00:00Z - occupation [2026-08-16T09:00:00Z, 2026-08-18T01:00:00Z), one hour into A's tail."
            - "Production C: 2026-08-17T10:00:00Z .. 14:00:00Z - occupation [2026-08-16T10:00:00Z, 2026-08-18T02:00:00Z), starting exactly at A's tail end."
          setup_api_calls:
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA", engine_hours_since_service: 100, service_interval_hours: 500 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a_id: $.data.id, pva: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbour Dome", venue_power_capacity_amps: 400, venue_roof_type: "FIXED", venue_curfew_utc: "2026-08-17T20:00:00Z", scheduled_start_utc: "2026-08-17T09:00:00Z", scheduled_end_utc: "2026-08-17T13:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b_id: $.data.id, pvb: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Northgate Field", venue_power_capacity_amps: 400, venue_roof_type: "RETRACTABLE", venue_curfew_utc: "2026-08-17T22:00:00Z", scheduled_start_utc: "2026-08-17T10:00:00Z", scheduled_end_utc: "2026-08-17T14:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_c_id: $.data.id, pvc: $.data.version }
            - call: "POST /broadcast-ops/productions/${prod_a_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pva}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { a_truck: $.data.truck_id }
          trigger:
            - call: "POST /broadcast-ops/productions/${prod_b_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pvb}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/productions/${prod_c_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pvc}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { c_truck: $.data.truck_id, c_status: $.data.status }
          assert:
            - "Production B: HTTP 422 with error_id == ERR_TRUCK_TRAVEL_WINDOW_CONFLICT and Production.${prod_b_id}.truck_id == null"
            - "Production C: HTTP 200 and Production.${prod_c_id}.truck_id == ${truck_id}"
            - "ProductionTruck.${truck_id}.status == ASSIGNED (held by A and C at once) with engine_hours_since_service == 100 and hours_to_service == 400"
            - "GET /broadcast-ops/productions?truck_id=${truck_id} returns total_count == 2"
            - "Production.${prod_b_id}.version is unchanged by the rejected assignment"

      - name: crew_member_turnaround_directional_gap_from_latest_reference_release
        grounds:
          - calculations.crew_turnaround_reference
          - validations[priority=37]
          - entities.CrewCall.fields.turnaround_minutes_before_call
          - errors[ERR_CREW_TURNAROUND_VIOLATION]
        distinguishing_aspect: |
          A third resource entity (CrewMember) with a third interval semantics: not an overlap test at
          all but a DIRECTIONAL minimum gap measured backwards from the member's most recent reference
          release to the new call_time_utc, with the candidate set ranked reference_release DESC and
          restricted to {OFFERED, ACCEPTED, RELEASED}. 599 minutes is refused, 600 exactly is accepted,
          the reference then moves forward to the newest call (so a later call can be refused against
          it even though the original call is 20 hours away), and cancelling that call moves the
          reference back.
        test_recipe:
          setup:
            - "Three TIER_3 productions A, B and C, each with labor_budget_total_cents = 2000000."
            - "One STAFF member cm1 certified TIER_3 at 9000 cents/h; separate productions are used so ERR_DUPLICATE_CREW_CALL never fires."
            - "Call on A: 2026-08-15T16:00:00Z .. 2026-08-15T20:00:00Z, ACCEPTED - reference release 2026-08-15T20:00:00Z."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a_id: $.data.id, pva: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbour Dome", venue_power_capacity_amps: 400, venue_roof_type: "FIXED", venue_curfew_utc: "2026-08-17T06:00:00Z", scheduled_start_utc: "2026-08-16T18:00:00Z", scheduled_end_utc: "2026-08-16T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b_id: $.data.id, pvb: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Northgate Field", venue_power_capacity_amps: 400, venue_roof_type: "RETRACTABLE", venue_curfew_utc: "2026-08-18T06:00:00Z", scheduled_start_utc: "2026-08-17T18:00:00Z", scheduled_end_utc: "2026-08-17T22:00:00Z", labor_budget_total_cents: 2000000 }
