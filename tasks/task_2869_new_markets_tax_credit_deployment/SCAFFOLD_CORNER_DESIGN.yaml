# =============================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Task 2869 — New Markets Tax Credit Deployment
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; no categories are invented.
# Every numeric literal below was computed by executing the matching §1.3
# formula. All "year" arithmetic is the 365-day convention from
# global_conventions.year_length. The logical clock starts at
# 2026-08-01T00:00:00.000Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_cde_returns_201_with_certified_status_and_zero_award_count
        claim_type: creation
        grounds:
          - entities.CDE
          - endpoints[POST /nmtc/cdes]
          - entities.CDE.fields.certification_status
        distinguishing_aspect: "A POST with all three required inputs returns 201 and every declared CDE field, with certification_status CERTIFIED, award_count 0 and version 1."
        test_recipe:
          setup:
            - "Empty database; logical clock left at its 2026-08-01 start value."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast Community Development Entity", certification_number: "CDE-2869-101", service_area_scope: "STATEWIDE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
          assert:
            - "HTTP 201 and the envelope has response_type == \"object\" with meta.api_request_id present"
            - "CDE.${cde_id}.legal_name == \"Gulf Coast Community Development Entity\", certification_number == \"CDE-2869-101\", service_area_scope == \"STATEWIDE\""
            - "CDE.${cde_id}.certification_status == \"CERTIFIED\" (the system default, not client supplied)"
            - "CDE.${cde_id}.award_count == 0, decertified_at == null, decertification_reason == null"
            - "CDE.${cde_id}.version == 1 and created_at == \"2026-08-01T00:00:00.000Z\" with exactly three fractional digits"

      - name: get_census_tract_returns_the_stored_computed_distress_profile
        claim_type: retrieval
        grounds:
          - endpoints[GET /nmtc/census-tracts/{id}]
          - calculations.tract_distress_profile
          - entities.CensusTract.fields.distress_tier
        distinguishing_aspect: "A GET by id returns the same computed distress profile that the POST returned — is_low_income_community true, severe_criteria_met_count 3, distress_score 100.00, distress_tier SEVERE."
        test_recipe:
          setup:
            - "One census tract registered with poverty 32.00, MFI ratio 55.00 and unemployment ratio 1.80."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
          trigger:
            - call: "GET /nmtc/census-tracts/${tract_id}"
              payload: {}
              as: ComplianceReviewer
          assert:
            - "HTTP 200 and CensusTract.${tract_id}.tract_code == \"28049000100\", state_code == \"MS\""
            - "is_low_income_community == true, qualifies_by_contiguity == false, eligible_for_qlici == true"
            - "severe_criteria_met_count == 3, distress_score == 100.00, distress_tier == \"SEVERE\""
            - "The GET body's data is field-for-field identical to the POST response body's data"

      - name: list_qalicbs_returns_pagination_fields_with_default_limit
        claim_type: listing
        grounds:
          - endpoints[GET /nmtc/qalicbs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "A list call with no pagination inputs applies limit 10 / offset 0 and reports total_count 3 with has_more false and response_type array."
        test_recipe:
          setup:
            - "Three QALICBs registered in the same SEVERE census tract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Machine Works LLC", state_code: "MS", naics_code: "332710" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Clinic LLC", state_code: "MS", naics_code: "621111" }
              as: QALICBSponsor
              as_user_id: "sponsor-echo"
          trigger:
            - call: "GET /nmtc/qalicbs"
              payload: {}
              as: CertifyingAgency
          assert:
            - "HTTP 200 with response_type == \"array\""
            - "limit == 10, offset == 0, total_count == 3, has_more == false"
            - "The array holds exactly 3 QALICB objects, each with eligibility_status == \"PENDING\""

      - name: get_qei_with_an_unknown_id_returns_qei_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /nmtc/qeis/{id}]
          - errors[ERR_QEI_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "A path id that matches no QEI row returns 404 ERR_QEI_NOT_FOUND, ahead of every business rule."
        test_recipe:
          setup:
            - "Empty database — no QEI has ever been issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "GET /nmtc/qeis/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CDESponsor
              as_user_id: "sponsor-unknown"
          assert:
            - "HTTP 404 with error_id == \"ERR_QEI_NOT_FOUND\" and response_type == \"error\""
            - "data.message is a non-empty string"
            - "The 404 is returned even though the acting CDESponsor owns no resource at all — path existence at priority 6 precedes ownership at priority 8"

      - name: create_allocation_award_without_allocation_amount_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /nmtc/allocation-awards]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required allocation_amount_cents input returns 400 ERR_INVALID_REQUEST and persists no award, even though the referenced CDE exists and is CERTIFIED."
        test_recipe:
          setup:
            - "One CERTIFIED CDE with award_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-102", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
          trigger:
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
          assert:
            - "HTTP 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "GET /nmtc/allocation-awards?cde_id=${cde_id} returns total_count == 0"
            - "CDE.${cde_id}.award_count == 0 and version == 1 (the refused request bumped nothing)"

      - name: new_qalicb_defaults_to_pending_with_null_certification_and_zero_counters
        claim_type: defaults
        grounds:
          - entities.QALICB.fields.eligibility_status
          - entities.QALICB.fields.consecutive_failed_test_count
          - entities.QALICB.fields.funding_qlici_count
        distinguishing_aspect: "A freshly created QALICB has eligibility_status PENDING, last_certified_at null, latest_test_result null, consecutive_failed_test_count 0 and funding_qlici_count 0 — none of which are client-supplied inputs."
        test_recipe:
          setup:
            - "One eligible SEVERE census tract."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
          trigger:
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
          assert:
            - "HTTP 201 and QALICB.${qalicb_id}.eligibility_status == \"PENDING\""
            - "last_certified_at == null and latest_test_result == null"
            - "consecutive_failed_test_count == 0 and funding_qlici_count == 0"
            - "sponsor_user_id == \"sponsor-delta\", stamped from the X-User-ID header and not from the body"
            - "version == 1"

      - name: qei_reserve_and_deadline_fields_are_computed_not_client_controlled
        claim_type: computed_fields
        grounds:
          - calculations.qei_reserve_and_net_deployable
          - entities.QEI.fields.reserve_bps
          - entities.QEI.fields.deployment_deadline_at
          - entities.QEI.fields.issued_at
        distinguishing_aspect: "POST /nmtc/qeis accepts only four inputs, yet the created QEI carries reserve_bps 500, permitted_fees_cents 5000000, net_deployable_cents 95000000, uninvested_cash_cents 95000000, issued_at 2026-09-01 and deployment_deadline_at 2027-09-01 — all server-derived."
        test_recipe:
          setup:
            - "One ACTIVE award with 5,000,000,000 cents of authority and one FUNDED fund holding 100,000,000 cents."
            - "Logical clock at 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-103", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund I LLC", equity_contribution_cents: 65000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 35000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_id}/closing"
              payload: { equity_received_cents: 65000000, leverage_received_cents: 35000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
          trigger:
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_id}", qei_amount_cents: 100000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_id: $.data.id }
          assert:
            - "HTTP 201 and QEI.${qei_id}.reserve_bps == 500, permitted_fees_cents == 5000000, net_deployable_cents == 95000000, uninvested_cash_cents == 95000000"
            - "QEI.${qei_id}.issued_at == \"2026-09-01T00:00:00.000Z\" and deployment_deadline_at == \"2027-09-01T00:00:00.000Z\""
            - "QEI.${qei_id}.issued_by_user_id == \"${cde_id}\", deployment_status == \"ISSUED\", compliance_status == \"COMPLIANT\""
            - "QEI.${qei_id}.substantially_all_pct_direct == 0.00, compliance_years_completed == 0, accrued_unpaid_fee_cents == 0, recapture_trigger_type == \"NONE\""
            - "AllocationAward.${award_id}.remaining_authority_cents == 4900000000 and version == ${award_v_signed} + 1"

      - name: qalicb_sponsor_and_identity_fields_are_stamped_by_the_system_not_the_body
        claim_type: system_fields
        grounds:
          - entities.QALICB.fields.sponsor_user_id
          - endpoints[POST /nmtc/qalicbs]
          - global_conventions.actor_identity
        distinguishing_aspect: "id, created_at, updated_at, version and sponsor_user_id are all system-sourced: sponsor_user_id comes from the X-User-ID header of the creating request, and body values offered for any of these five fields are ignored rather than rejected."
        test_recipe:
          setup:
            - "One SEVERE census tract; clock at 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
          trigger:
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
          assert:
            - "HTTP 201 and QALICB.${qalicb_id}.sponsor_user_id == \"sponsor-delta\", taken from the X-User-ID header of this request"
            - "QALICB.${qalicb_id}.id is a server-generated identifier, not any client-supplied value"
            - "created_at == updated_at == \"2026-08-01T00:00:00.000Z\", both from the logical clock rather than wall time"
            - "version == 1 on creation"
            - "The same POST repeated by a different acting sponsor would stamp that sponsor's id — sponsor_user_id is never read from the request body, which has no such key"

      - name: create_allocation_award_with_an_unknown_substantially_all_method_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.AllocationAward.fields.substantially_all_method
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "An enum input outside {DIRECT_TRACING, AGGREGATE_BALANCE} is a shape failure at priority 4, returning 400 ERR_INVALID_REQUEST rather than being silently coerced to a default."
        test_recipe:
          setup:
            - "One CERTIFIED CDE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-104", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
          trigger:
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "TIME_WEIGHTED" }
              as: CertifyingAgency
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
          assert:
            - "HTTP 400 with error_id == \"ERR_INVALID_REQUEST\""
            - "After the first trigger call no AllocationAward row exists"
            - "The second trigger call — identical except substantially_all_method \"DIRECT_TRACING\" — returns 201, proving only the enum value was at fault"
            - "AllocationAward.${award_id}.substantially_all_method == \"DIRECT_TRACING\" and lifecycle_status == \"ANNOUNCED\""

      - name: eligibility_test_rows_are_immutable_with_no_version_field_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.EligibilityTest
          - endpoints[GET /nmtc/qalicbs/{id}/eligibility-tests]
        distinguishing_aspect: "EligibilityTest declares common_fields false, so its rows expose no version field and §1.5 offers no update or delete endpoint; a second test appends a new immutable row instead of mutating the first."
        test_recipe:
          setup:
            - "One QALICB in a SEVERE tract with one PASS eligibility test already recorded at 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { test_1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 90.00, services_lic_pct: 90.00, tangible_property_lic_pct: 90.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 0.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { test_2_id: $.data.id }
            - call: "GET /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
          assert:
            - "Neither EligibilityTest body contains a version field (common_fields is false for this entity)"
            - "EligibilityTest.${test_1_id}.gross_income_lic_pct == 72.00 and performed_at == \"2026-08-01T00:00:00.000Z\" — unchanged by the second test"
            - "EligibilityTest.${test_2_id}.gross_income_lic_pct == 90.00 and performed_at == \"2026-08-15T00:00:00.000Z\""
            - "The list returns total_count == 2, oldest performed_at first"
            - "QALICB.${qalicb_id}.last_certified_at == \"2026-08-15T00:00:00.000Z\" — the parent moves forward, the historical rows do not"

      - name: create_qalicb_referencing_an_unknown_census_tract_returns_census_tract_not_found
        claim_type: parent_relationships
        grounds:
          - entities.QALICB.fields.census_tract_id
          - validations[priority=7]
          - errors[ERR_CENSUS_TRACT_NOT_FOUND]
        distinguishing_aspect: "A body FK naming a non-existent census tract returns 404 ERR_CENSUS_TRACT_NOT_FOUND at priority 7, before the tract-eligibility check at priority 22 can run."
        test_recipe:
          setup:
            - "Empty database — no census tract has been registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "00000000-0000-4000-8000-0000000000aa", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
          assert:
            - "HTTP 404 with error_id == \"ERR_CENSUS_TRACT_NOT_FOUND\""
            - "The response is NOT \"ERR_TRACT_NOT_LIC_ELIGIBLE\" and NOT HTTP 422"
            - "GET /nmtc/qalicbs returns total_count == 0"

      - name: one_qalicb_funded_by_two_qlicis_of_the_same_award_forms_the_many_to_many_graph
        claim_type: graph
        grounds:
          - entities.QLICI
          - complexity_profile.entity_topology
        excluded_because:
          difficulty_instance: resource_temporal_overlap / qalicb_compliance_period_occupancy_is_half_open_with_a_30_day_buffer_and_a_same_award_exemption
          rationale: "That instance's second trigger deploys a second QLICI from the same award to the same QALICB and asserts funding_qlici_count == 2, which is exactly the many-to-many junction claim."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: signing_the_allocation_agreement_moves_the_award_announced_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.AllocationAward.lifecycle_status
          - endpoints[POST /nmtc/allocation-awards/{id}/allocation-agreement]
        distinguishing_aspect: "The signing call moves lifecycle_status ANNOUNCED -> ACTIVE, stamps allocation_agreement_signed_at from the logical clock and bumps version from 1 to 2."
        test_recipe:
          setup:
            - "One CERTIFIED CDE with one ANNOUNCED award of 5,000,000,000 cents."
            - "Logical clock at 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-105", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
          trigger:
