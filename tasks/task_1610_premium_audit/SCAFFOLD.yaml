# =============================================================================
# PRD Benchmark Seed Tables — Premium Audit (workers' compensation & GL)
# =============================================================================

scenario: |
  Premium Audit (workers' compensation & general liability): audit selection by policy size & class, records request (payroll/subcontractor) & appointment scheduling, classification code verification & payroll allocation, subcontractor certificate review & inclusion rules, audit result & additional/return premium billing, dispute & re-audit process, non-compliance estimated audit & cancellation, experience modification impact

domain_name: premium-audit
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit        # regulatory audit trail, SoD, cooling-off windows
  secondary_archetype: pricing_engine        # per-class rates, mod factor, minimum premium, rounding traps
  complexity_layers:
    - optimistic_concurrency                 # OCC on AuditWorkOrder.version for create-with-supersede writes
    - cascading_side_effects                 # clock sweep -> overdue -> noncompliance -> estimated billing -> cancellation
    - dual_variant_calculation               # provisional vs final audit figures
    - rate_threshold_triggers                # selection tiers, dispute/billing windows, mod bands
  entity_topology: flat                      # peer entities joined by FKs; no nested URL ownership
  state_machine_shape: cyclic                # dispute -> re-audit loop; appointment no-show -> reschedule loop
  relationship_patterns:
    - one_to_many                            # Policy -> AuditWorkOrder -> RecordsRequest / Appointment / Allocation / SubExposure
    - self_referential                       # AuditWorkOrder.reaudit_of_work_order_id
    - cross_aggregate                        # Dispute -> AuditResult; ModRevision -> Policy + AuditWorkOrder
  role_model: segregation_of_duties          # noncompliance marker != estimated approver; result issuer != dispute reviewer
  consistency_model: immediate               # all derived fields recomputed within the mutating request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Carrier-unique policy number; uniqueness enforced" }
      - { name: insured_name, type: string, source: input, description: "Named insured" }
      - { name: coverage_line, type: enum, source: input, description: "WC | GL" }
      - { name: state_code, type: string, source: input, description: "Two-letter governing state (drives auditor territory and class-code jurisdiction)" }
      - { name: effective_date, type: datetime, source: input, description: "Policy term start (ISO 8601); must be strictly before expiration_date" }
      - { name: expiration_date, type: datetime, source: input, description: "Policy term end (ISO 8601); eligible for audit selection once expiration_date <= current clock" }
      - { name: estimated_annual_premium_cents, type: integer, source: input, description: "Original estimated premium charged for the term, in cents; > 0" }
      - { name: minimum_premium_cents, type: integer, source: input, description: "Minimum earned premium floor in cents; > 0 and <= estimated_annual_premium_cents" }
      - { name: payroll_estimate_dollars, type: integer, source: input, description: "Estimated exposure basis in whole dollars; > 0" }
      - { name: experience_mod_factor, type: number, source: input, default: 1.00, description: "Experience modification factor in force at inception; WC: within [0.75, 1.50]; GL: must equal 1.00" }
      - { name: class_code_ids, type: array, source: input, description: "Array of ClassificationCode ids bound at inception; each must exist, match coverage_line and state_code, and have an effective window overlapping the policy term" }
      - { name: status, type: enum, source: system, description: "ACTIVE | AUDIT_PENDING | AUDIT_FINALIZED | CANCELLED" }

  - name: Auditor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Auditor display name" }
      - { name: territory_states, type: array, source: input, description: "Non-empty array of two-letter state codes the auditor may serve" }
      - { name: level, type: enum, source: input, description: "STAFF | SENIOR" }

  - name: ClassificationCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Class code digits (e.g. 8810); unique per (code, state_code, coverage_line)" }
      - { name: description, type: string, source: input, description: "Class description" }
      - { name: state_code, type: string, source: input, description: "Governing state" }
      - { name: coverage_line, type: enum, source: input, description: "WC | GL" }
      - { name: rate_per_100_cents, type: integer, source: input, description: "Manual rate in cents per $100 of exposure; > 0" }
      - { name: high_hazard, type: boolean, source: input, default: false, description: "High-hazard classes force PHYSICAL audit tier regardless of premium" }
      - { name: effective_from, type: datetime, source: input, description: "Rate effective window start; must be strictly before effective_to" }
      - { name: effective_to, type: datetime, source: input, description: "Rate effective window end" }

  - name: AuditSelectionRun
    parent: null
    common_fields: true
    fields:
      - { name: run_at, type: datetime, source: system, description: "Logical clock time at which the run executed" }
      - { name: evaluated_count, type: integer, source: computed, description: "Policies scanned: status == ACTIVE and expiration_date <= run clock" }
      - { name: physical_count, type: integer, source: computed, description: "Work orders created at PHYSICAL tier" }
      - { name: voluntary_count, type: integer, source: computed, description: "Work orders created at VOLUNTARY_REPORT tier" }
      - { name: exempt_count, type: integer, source: computed, description: "Evaluated policies exempted (no work order created)" }

  - name: AuditWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy under audit" }
      - { name: selection_run_id, type: string, source: system, description: "FK -> AuditSelectionRun.id; null for REAUDIT work orders created by the dispute-upheld cascade" }
      - { name: reaudit_of_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id; null unless audit_type == REAUDIT" }
      - { name: assigned_auditor_id, type: string, source: system, description: "FK -> Auditor.id; null until assigned" }
      - { name: audit_type, type: enum, source: system, description: "PHYSICAL | VOLUNTARY_REPORT | REAUDIT" }
      - { name: audit_period_start, type: datetime, source: system, description: "Copied from Policy.effective_date at creation" }
      - { name: audit_period_end, type: datetime, source: system, description: "Copied from Policy.expiration_date at creation" }
      - { name: status, type: enum, source: system, description: "SELECTED | RECORDS_REQUESTED | APPOINTMENT_SCHEDULED | FIELD_WORK_DONE | RESULT_DRAFTED | BILLED | DISPUTED | NONCOMPLIANT_PENDING | ESTIMATED_BILLED | CLOSED | SUPERSEDED_BY_REAUDIT | CANCELLED" }
      - { name: no_show_count, type: integer, source: system, default: 0, description: "Appointments that ended NO_SHOW; new appointment creation blocked at >= 2" }
      - { name: marked_noncompliant_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the AuditManager who marked NONCOMPLIANT_PENDING; null otherwise" }
      - { name: total_premium_base_dollars, type: integer, source: computed, description: "Recomputed on every allocation/certificate mutation: SUM(auditable_payroll_dollars of VERIFIED PayrollAllocations) + SUM(included_dollars of all SubcontractorExposures) for this work order" }

  - name: RecordsRequest
    parent: null
    common_fields: true
    fields:
      - { name: audit_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id" }
      - { name: request_type, type: enum, source: input, description: "PAYROLL_SUMMARY | TAX_FILINGS | SUBCONTRACTOR_LIST | CERTIFICATES_OF_INSURANCE | SALES_LEDGER; one non-terminal request per type per work order" }
      - { name: status, type: enum, source: system, description: "OPEN | RECEIVED | OVERDUE | WAIVED" }
      - { name: requested_at, type: datetime, source: system, description: "Logical clock time of creation" }
      - { name: due_at, type: datetime, source: computed, description: "= requested_at + 15 days" }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time of receipt; null until RECEIVED" }

  - name: AuditAppointment
    parent: null
    common_fields: true
    fields:
      - { name: audit_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id" }
      - { name: auditor_id, type: string, source: system, description: "FK -> Auditor.id; copied from AuditWorkOrder.assigned_auditor_id at creation" }
      - { name: scheduled_start, type: datetime, source: input, description: "Must satisfy audit_period_end < scheduled_start <= audit_period_end + 60 days" }
      - { name: scheduled_end, type: datetime, source: input, description: "Must be strictly after scheduled_start" }
      - { name: location_type, type: enum, source: input, description: "INSURED_PREMISES | VIRTUAL | AUDITOR_OFFICE" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED" }

  - name: PayrollAllocation
    parent: null
    common_fields: true
    fields:
      - { name: audit_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id" }
      - { name: class_code_id, type: string, source: input, description: "FK -> ClassificationCode.id; code's coverage_line must equal the audited policy's coverage_line" }
      - { name: period_start, type: datetime, source: input, description: "Allocation coverage start (closed interval); must be < period_end" }
      - { name: period_end, type: datetime, source: input, description: "Allocation coverage end (closed interval)" }
      - { name: gross_payroll_dollars, type: integer, source: input, description: "Gross remuneration in whole dollars; >= 0" }
      - { name: overtime_excess_dollars, type: integer, source: input, default: 0, description: "Overtime premium portion (the half-time excess); excludable only when overtime_documented is true; >= 0" }
      - { name: overtime_documented, type: boolean, source: input, default: false, description: "Whether payroll records separately show the overtime excess" }
      - { name: severance_dollars, type: integer, source: input, default: 0, description: "Severance payments; always excludable; >= 0" }
      - { name: other_exclusions_dollars, type: integer, source: input, default: 0, description: "Other statutory exclusions; >= 0" }
      - { name: auditable_payroll_dollars, type: integer, source: computed, description: "= max(gross - (overtime_excess if overtime_documented else 0) - severance - other_exclusions, 0)" }
      - { name: status, type: enum, source: system, description: "DRAFT | VERIFIED | REJECTED" }

  - name: SubcontractorExposure
    parent: null
    common_fields: true
    fields:
      - { name: audit_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id" }
      - { name: subcontractor_name, type: string, source: input, description: "Subcontractor legal name" }
      - { name: payments_dollars, type: integer, source: input, description: "Total payments to the subcontractor during the audit period; >= 0" }
      - { name: governing_class_code_id, type: string, source: input, description: "FK -> ClassificationCode.id; included dollars accumulate into this class code's premium base" }
      - { name: included_dollars, type: integer, source: computed, description: "Dollars added to the premium base per subcontractor_inclusion calculation; recomputed on certificate verify/reject" }
      - { name: status, type: enum, source: system, description: "EXCLUDED | INCLUDED | PARTIAL_INCLUDED" }

  - name: CertificateOfInsurance
    parent: null
    common_fields: true
    fields:
      - { name: subcontractor_exposure_id, type: string, source: system, description: "FK -> SubcontractorExposure.id" }
      - { name: insurer_name, type: string, source: input, description: "Carrier that issued the certificate" }
      - { name: wc_coverage_present, type: boolean, source: input, description: "Certificate evidences workers' compensation coverage" }
      - { name: gl_coverage_present, type: boolean, source: input, description: "Certificate evidences general liability coverage" }
      - { name: coverage_effective_date, type: datetime, source: input, description: "Certificate coverage start (closed interval); must be <= coverage_expiration_date" }
      - { name: coverage_expiration_date, type: datetime, source: input, description: "Certificate coverage end (closed interval)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED" }
      - { name: rejection_reason, type: enum, source: system, description: "INSUFFICIENT_COVERAGE | EXPIRED | OTHER; null unless REJECTED" }

  - name: AuditResult
    parent: null
    common_fields: true
    fields:
      - { name: audit_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id; at most one result per work order" }
      - { name: variant, type: enum, source: system, description: "STANDARD | ESTIMATED_NONCOMPLIANCE" }
      - { name: status, type: enum, source: system, description: "PRELIMINARY | ISSUED | DISPUTED | SUPERSEDED" }
      - { name: total_payroll_dollars, type: integer, source: computed, description: "Exposure dollars that fed manual_premium (variant-dependent input set)" }
      - { name: manual_premium_cents, type: integer, source: computed, description: "Sum of per-class-code rounded premiums (see manual_premium calculation)" }
      - { name: mod_factor_applied, type: number, source: computed, description: "Policy.experience_mod_factor captured at computation time; never retroactively changed" }
      - { name: earned_premium_cents, type: integer, source: computed, description: "See earned_premium calculation (variant branches)" }
      - { name: adjustment_cents, type: integer, source: computed, description: "= earned_premium_cents - Policy.estimated_annual_premium_cents (signed); computed only at ISSUED" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the auditor who submitted the draft; null for estimated results" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the AuditManager who issued; null until ISSUED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time of issuance; null until ISSUED" }

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - { name: audit_result_id, type: string, source: system, description: "FK -> AuditResult.id" }
      - { name: grounds, type: enum, source: input, description: "CLASSIFICATION_ERROR | PAYROLL_ERROR | SUBCONTRACTOR_INCLUSION | CERT_REVIEW_ERROR | OTHER" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock time at filing; must be <= result.issued_at + 30 days" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | UPHELD | OVERRULED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the reviewing AuditManager; null until UNDER_REVIEW" }

  - name: BillingTransaction
    parent: null
    common_fields: true
    fields:
      - { name: audit_result_id, type: string, source: system, description: "FK -> AuditResult.id" }
      - { name: type, type: enum, source: system, description: "ADDITIONAL_PREMIUM_INVOICE (adjustment > 0) | RETURN_PREMIUM_CREDIT (adjustment < 0)" }
      - { name: amount_cents, type: integer, source: computed, description: "= abs(result.adjustment_cents)" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative payments/applications recorded against this transaction" }
      - { name: issued_at, type: datetime, source: system, description: "Logical clock time of billing creation" }
      - { name: due_at, type: datetime, source: computed, description: "= issued_at + 30 days" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | APPLIED | PAST_DUE | CANCELLED" }

  - name: ModRevision
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: source_work_order_id, type: string, source: system, description: "FK -> AuditWorkOrder.id; audit that produced the payroll variance" }
      - { name: prior_mod_factor, type: number, source: system, description: "Policy.experience_mod_factor at revision creation" }
      - { name: payroll_variance_ratio, type: number, source: computed, description: "= (audited payroll total - payroll_estimate_dollars) / payroll_estimate_dollars, kept unrounded" }
      - { name: revised_mod_factor, type: number, source: computed, description: "See mod_revision calculation (trunc toward zero, clamp [0.75, 1.50])" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPLIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Policy
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: AUDIT_PENDING
        trigger: "system: POST /audit-selection-runs creates a work order for this policy"
        actor: system
        preconditions: ["policy tier is PHYSICAL or VOLUNTARY_REPORT per audit_selection_tier"]
        side_effects: ["Policy.version increments"]
      - from: AUDIT_PENDING
        to: AUDIT_FINALIZED
        trigger: "system: an AuditWorkOrder for this policy reaches CLOSED and no other work order of the same policy is in a non-terminal state (not in {CLOSED, SUPERSEDED_BY_REAUDIT, CANCELLED})"
        actor: system
        preconditions: []
        side_effects: ["Policy.version increments"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel OR system: a BillingTransaction of this policy remains unpaid past due_at + 30 days (evaluated on clock set)"
        actor: Underwriter | system
        preconditions: []
        side_effects:
          - "Every AuditWorkOrder of this policy in a non-terminal state transitions to CANCELLED"
          - "Every AuditAppointment of those work orders in {SCHEDULED, CONFIRMED} transitions to CANCELLED"
          - "Every BillingTransaction of this policy's results in {ISSUED, PAST_DUE} transitions to CANCELLED"
          - "Policy.version increments"
      - from: AUDIT_PENDING
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel OR system: billing grace expiry on clock set"
        actor: Underwriter | system
        preconditions: []
        side_effects:
          - "Every AuditWorkOrder of this policy in a non-terminal state transitions to CANCELLED"
          - "Every AuditAppointment of those work orders in {SCHEDULED, CONFIRMED} transitions to CANCELLED"
          - "Every BillingTransaction of this policy's results in {ISSUED, PAST_DUE} transitions to CANCELLED"
          - "Policy.version increments"
      - from: AUDIT_FINALIZED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel OR system: billing grace expiry on clock set"
        actor: Underwriter | system
        preconditions: []
        side_effects:
          - "Every BillingTransaction of this policy's results in {ISSUED, PAST_DUE} transitions to CANCELLED"
          - "Policy.version increments"

  - entity: AuditWorkOrder
    initial_state: SELECTED
    terminal_states: [CLOSED, SUPERSEDED_BY_REAUDIT, CANCELLED]
    transitions:
      - from: SELECTED
        to: RECORDS_REQUESTED
        trigger: "POST /audit-work-orders/{id}/records-requests (first request on the work order)"
        actor: AuditManager
        preconditions: ["request_type has no existing non-terminal (OPEN or OVERDUE) RecordsRequest on this work order (ERR_DUPLICATE_RECORDS_REQUEST)"]
        side_effects: ["RecordsRequest created with status OPEN, requested_at = clock, due_at = requested_at + 15 days", "AuditWorkOrder.version increments"]
      - from: RECORDS_REQUESTED
        to: APPOINTMENT_SCHEDULED
        trigger: "POST /audit-work-orders/{id}/appointments"
        actor: Auditor
        preconditions:
          - "audit_type in {PHYSICAL, REAUDIT} (else ERR_INVALID_STATE_TRANSITION)"
          - "assigned_auditor_id == caller X-User-ID (else ERR_FORBIDDEN_SCOPE)"
          - "no_show_count < 2 (else ERR_RESCHEDULE_LIMIT_EXCEEDED)"
          - "audit_period_end < scheduled_start <= audit_period_end + 60 days and scheduled_end > scheduled_start (else ERR_APPOINTMENT_OUTSIDE_WINDOW)"
          - "no SCHEDULED or CONFIRMED appointment of the same auditor half-open-overlaps [scheduled_start, scheduled_end) (else ERR_APPOINTMENT_OVERLAP)"
          - "expected_work_order_version == current version (else ERR_STALE_VERSION)"
        side_effects:
          - "AuditAppointment created SCHEDULED with auditor_id = assigned_auditor_id"
          - "Any prior appointment of this work order in {SCHEDULED, CONFIRMED} transitions to CANCELLED (supersede)"
          - "AuditWorkOrder.version increments"
      - from: APPOINTMENT_SCHEDULED
        to: APPOINTMENT_SCHEDULED
        trigger: "POST /audit-work-orders/{id}/appointments (reschedule after NO_SHOW)"
        actor: Auditor
        preconditions: ["same as RECORDS_REQUESTED -> APPOINTMENT_SCHEDULED"]
        side_effects: ["new AuditAppointment SCHEDULED; prior {SCHEDULED, CONFIRMED} appointment CANCELLED", "AuditWorkOrder.version increments"]
      - from: APPOINTMENT_SCHEDULED
        to: FIELD_WORK_DONE
        trigger: "POST /appointments/{id}/complete on the work order's active appointment"
        actor: Auditor
        preconditions: ["appointment status in {SCHEDULED, CONFIRMED}", "caller is the assigned auditor"]
        side_effects: ["AuditAppointment -> COMPLETED", "AuditWorkOrder.version increments"]
      - from: FIELD_WORK_DONE
        to: RESULT_DRAFTED
        trigger: "POST /audit-work-orders/{id}/submit-draft"
        actor: Auditor
        preconditions:
          - "audit_type in {PHYSICAL, REAUDIT}"
          - "every RecordsRequest of this work order is in {RECEIVED, WAIVED} (else ERR_OPEN_RECORDS_REQUESTS)"
          - "caller is the assigned auditor"
        side_effects:
          - "AuditResult created: variant STANDARD, status PRELIMINARY, provisional figures per manual_premium/provisional + earned_premium/provisional"
          - "AuditResult.drafted_by_user_id = caller X-User-ID"
          - "AuditWorkOrder.version increments"
      - from: RECORDS_REQUESTED
        to: RESULT_DRAFTED
        trigger: "POST /audit-work-orders/{id}/submit-draft"
        actor: Auditor
        preconditions:
          - "audit_type == VOLUNTARY_REPORT (PHYSICAL/REAUDIT must go through FIELD_WORK_DONE; else ERR_INVALID_STATE_TRANSITION)"
          - "every RecordsRequest of this work order is in {RECEIVED, WAIVED} (else ERR_OPEN_RECORDS_REQUESTS)"
          - "caller is the assigned auditor"
        side_effects:
          - "AuditResult created: variant STANDARD, status PRELIMINARY, provisional figures"
          - "AuditResult.drafted_by_user_id = caller X-User-ID"
          - "AuditWorkOrder.version increments"
      - from: RESULT_DRAFTED
        to: BILLED
        trigger: "POST /audit-work-orders/{id}/issue-result"
        actor: AuditManager
        preconditions:
          - "no PayrollAllocation of this work order is in DRAFT (else ERR_DRAFT_ALLOCATIONS_PENDING)"
        side_effects:
          - "AuditResult recomputed with final input sets (VERIFIED allocations, VERIFIED certificates only); mod_factor_applied = current Policy.experience_mod_factor"
          - "AuditResult: PRELIMINARY -> ISSUED; issued_at = clock; issued_by_user_id = caller; adjustment_cents computed"
          - "If adjustment_cents != 0: BillingTransaction created (ADDITIONAL_PREMIUM_INVOICE if > 0 else RETURN_PREMIUM_CREDIT), amount_cents = abs(adjustment_cents), due_at = issued_at + 30 days, status ISSUED"
          - "If coverage_line == WC and |payroll_variance_ratio| >= 0.05: ModRevision created DRAFT (see mod_revision calculation)"
          - "AuditWorkOrder.version increments"
      - from: RECORDS_REQUESTED
        to: NONCOMPLIANT_PENDING
        trigger: "POST /audit-work-orders/{id}/mark-noncompliant"
        actor: AuditManager
        preconditions: ["at least one RecordsRequest of this work order is OVERDUE (else ERR_NO_NONCOMPLIANCE_BASIS)"]
        side_effects: ["marked_noncompliant_by_user_id = caller X-User-ID", "AuditWorkOrder.version increments"]
      - from: APPOINTMENT_SCHEDULED
        to: NONCOMPLIANT_PENDING
        trigger: "POST /audit-work-orders/{id}/mark-noncompliant"
        actor: AuditManager
        preconditions: ["at least one RecordsRequest of this work order is OVERDUE (else ERR_NO_NONCOMPLIANCE_BASIS)"]
        side_effects: ["marked_noncompliant_by_user_id = caller X-User-ID", "AuditWorkOrder.version increments"]
      - from: NONCOMPLIANT_PENDING
        to: ESTIMATED_BILLED
        trigger: "POST /audit-work-orders/{id}/approve-estimated"
        actor: AuditManager
        preconditions: ["caller X-User-ID != marked_noncompliant_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "AuditResult created directly in ISSUED: variant ESTIMATED_NONCOMPLIANCE, earned_premium_cents = round_half_up(estimated_annual_premium_cents * 1.25), issued_at = clock, issued_by_user_id = caller, adjustment_cents computed"
          - "BillingTransaction created (ADDITIONAL_PREMIUM_INVOICE if adjustment > 0 else RETURN_PREMIUM_CREDIT), due_at = issued_at + 30 days"
          - "AuditWorkOrder.version increments"
      - from: BILLED
        to: DISPUTED
        trigger: "POST /audit-results/{id}/disputes on this work order's ISSUED result"
        actor: Insured
        preconditions: ["AuditResult.status == ISSUED", "clock <= result.issued_at + 30 days (else ERR_DISPUTE_WINDOW_CLOSED)"]
        side_effects: ["Dispute created FILED, filed_at = clock", "AuditResult: ISSUED -> DISPUTED", "AuditWorkOrder.version increments"]
      - from: ESTIMATED_BILLED
        to: DISPUTED
        trigger: "POST /audit-results/{id}/disputes"
        actor: Insured
        preconditions: ["AuditResult.status == ISSUED", "clock <= result.issued_at + 30 days (else ERR_DISPUTE_WINDOW_CLOSED)"]
        side_effects: ["Dispute created FILED", "AuditResult: ISSUED -> DISPUTED", "AuditWorkOrder.version increments"]
      - from: DISPUTED
        to: BILLED
        trigger: "POST /disputes/{id}/overrule (result variant STANDARD)"
        actor: AuditManager
        preconditions: ["dispute status == UNDER_REVIEW"]
        side_effects: ["Dispute -> OVERRULED", "AuditResult: DISPUTED -> ISSUED", "AuditWorkOrder.version increments"]
      - from: DISPUTED
        to: ESTIMATED_BILLED
        trigger: "POST /disputes/{id}/overrule (result variant ESTIMATED_NONCOMPLIANCE)"
        actor: AuditManager
        preconditions: ["dispute status == UNDER_REVIEW"]
        side_effects: ["Dispute -> OVERRULED", "AuditResult: DISPUTED -> ISSUED", "AuditWorkOrder.version increments"]
      - from: DISPUTED
        to: SUPERSEDED_BY_REAUDIT
        trigger: "POST /disputes/{id}/uphold"
        actor: AuditManager
        preconditions: ["dispute status == UNDER_REVIEW", "caller X-User-ID != result.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "Dispute -> UPHELD"
          - "AuditResult: DISPUTED -> SUPERSEDED"
          - "Every BillingTransaction of that result in {ISSUED, PAST_DUE} -> CANCELLED (compensation)"
          - "New AuditWorkOrder created: audit_type REAUDIT, status SELECTED, reaudit_of_work_order_id = this work order, selection_run_id = null, audit period copied from the policy, assigned_auditor_id = null"
          - "AuditWorkOrder.version increments"
      - from: BILLED
        to: CLOSED
        trigger: "POST /audit-work-orders/{id}/close"
        actor: AuditManager
        preconditions:
          - "every BillingTransaction of this work order's result is in {PAID, APPLIED} or no billing exists (zero adjustment) (else ERR_INVALID_STATE_TRANSITION)"
          - "clock > result.issued_at + 30 days (dispute window elapsed) (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["Policy -> AUDIT_FINALIZED if no other non-terminal work order for the policy", "AuditWorkOrder.version increments"]
      - from: ESTIMATED_BILLED
        to: CLOSED
        trigger: "POST /audit-work-orders/{id}/close"
        actor: AuditManager
        preconditions:
          - "every BillingTransaction of this work order's result is in {PAID, APPLIED} or none exists (else ERR_INVALID_STATE_TRANSITION)"
          - "clock > result.issued_at + 30 days (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["Policy -> AUDIT_FINALIZED if no other non-terminal work order for the policy", "AuditWorkOrder.version increments"]
      - from: ANY_NON_TERMINAL
        to: CANCELLED
        trigger: "system: Policy cancellation cascade"
        actor: system
        preconditions: ["status not in {CLOSED, SUPERSEDED_BY_REAUDIT, CANCELLED}"]
        side_effects: ["Active {SCHEDULED, CONFIRMED} appointments of this work order -> CANCELLED", "AuditWorkOrder.version increments"]

  - entity: RecordsRequest
    initial_state: OPEN
    terminal_states: [RECEIVED, WAIVED]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "system: POST /_clock/set_current_utc when clock > due_at (strictly greater)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RECEIVED
        trigger: "POST /records-requests/{id}/receive"
        actor: Auditor
        preconditions: ["caller is the assigned auditor of the parent work order"]
        side_effects: ["received_at = clock"]
      - from: OVERDUE
        to: RECEIVED
        trigger: "POST /records-requests/{id}/receive (late receipt permitted)"
        actor: Auditor
        preconditions: ["caller is the assigned auditor of the parent work order"]
        side_effects: ["received_at = clock"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /records-requests/{id}/waive"
        actor: AuditManager
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /records-requests/{id}/waive"
        actor: AuditManager
        preconditions: []
        side_effects: []

  - entity: AuditAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /appointments/{id}/confirm"
        actor: Insured | Auditor
        preconditions: ["Insured caller must own the audited policy (X-User-ID == policy_id); Auditor caller must be the appointment's auditor"]
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Auditor
        preconditions: ["caller is the appointment's auditor"]
        side_effects: ["Parent AuditWorkOrder: APPOINTMENT_SCHEDULED -> FIELD_WORK_DONE, version increments"]
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: Auditor
        preconditions: ["caller is the appointment's auditor"]
        side_effects: ["Parent AuditWorkOrder: APPOINTMENT_SCHEDULED -> FIELD_WORK_DONE, version increments"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Auditor
        preconditions: ["caller is the appointment's auditor"]
        side_effects: ["Parent AuditWorkOrder.no_show_count += 1", "AuditWorkOrder.version increments"]
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/no-show"
        actor: Auditor
        preconditions: ["caller is the appointment's auditor"]
        side_effects: ["Parent AuditWorkOrder.no_show_count += 1", "AuditWorkOrder.version increments"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: superseded by a newly created appointment on the same work order, or Policy cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system: superseded by a newly created appointment on the same work order, or Policy cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayrollAllocation
    initial_state: DRAFT
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: DRAFT
        to: VERIFIED
        trigger: "POST /payroll-allocations/{id}/verify"
        actor: Auditor
        preconditions: ["caller is the assigned auditor", "parent work order status in {RECORDS_REQUESTED, APPOINTMENT_SCHEDULED, FIELD_WORK_DONE, RESULT_DRAFTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /payroll-allocations/{id}/reject"
        actor: Auditor
        preconditions: ["caller is the assigned auditor", "parent work order status in {RECORDS_REQUESTED, APPOINTMENT_SCHEDULED, FIELD_WORK_DONE, RESULT_DRAFTED} (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["AuditWorkOrder.total_premium_base_dollars recomputed"]

  - entity: SubcontractorExposure
    initial_state: INCLUDED
    terminal_states: []
    transitions:
      - from: INCLUDED
        to: EXCLUDED
        trigger: "system: a CertificateOfInsurance of this exposure is VERIFIED and its closed coverage interval fully contains the audit period"
        actor: system
        preconditions: []
        side_effects: ["included_dollars = 0", "AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: INCLUDED
        to: PARTIAL_INCLUDED
        trigger: "system: a CertificateOfInsurance is VERIFIED but covers only part of the audit period"
        actor: system
        preconditions: []
        side_effects: ["included_dollars = round_half_up(payments_dollars * uncovered_days / audit_period_days)", "AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: EXCLUDED
        to: PARTIAL_INCLUDED
        trigger: "system: a subsequent certificate verification/rejection changes coverage (recompute)"
        actor: system
        preconditions: []
        side_effects: ["included_dollars recomputed", "AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: PARTIAL_INCLUDED
        to: EXCLUDED
        trigger: "system: recompute after certificate events"
        actor: system
        preconditions: []
        side_effects: ["included_dollars recomputed", "AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: EXCLUDED
        to: INCLUDED
        trigger: "system: certificate REJECTED leaving no VERIFIED certificate"
        actor: system
        preconditions: []
        side_effects: ["included_dollars = payments_dollars", "AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: PARTIAL_INCLUDED
        to: INCLUDED
        trigger: "system: certificate REJECTED leaving no VERIFIED certificate"
        actor: system
        preconditions: []
        side_effects: ["included_dollars = payments_dollars", "AuditWorkOrder.total_premium_base_dollars recomputed"]

  - entity: CertificateOfInsurance
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /certificates/{id}/verify"
        actor: Auditor
        preconditions:
          - "caller is the assigned auditor of the parent work order"
          - "coverage flag matching the policy coverage_line is present (WC policy requires wc_coverage_present; GL requires gl_coverage_present) (else ERR_CERT_INSUFFICIENT_COVERAGE)"
          - "certificate closed coverage interval intersects the audit period (else ERR_CERT_WINDOW_INSUFFICIENT)"
        side_effects: ["Parent SubcontractorExposure status/included_dollars recomputed", "AuditWorkOrder.total_premium_base_dollars recomputed"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certificates/{id}/reject"
        actor: Auditor
        preconditions: ["caller is the assigned auditor of the parent work order", "reason in {INSUFFICIENT_COVERAGE, EXPIRED, OTHER}"]
        side_effects: ["rejection_reason = reason", "Parent SubcontractorExposure status/included_dollars recomputed", "AuditWorkOrder.total_premium_base_dollars recomputed"]

  - entity: AuditResult
    initial_state: PRELIMINARY
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PRELIMINARY
        to: ISSUED
        trigger: "POST /audit-work-orders/{id}/issue-result"
        actor: AuditManager
        preconditions: ["no DRAFT PayrollAllocations on the work order (else ERR_DRAFT_ALLOCATIONS_PENDING)"]
        side_effects:
          - "Figures recomputed with final input sets; mod_factor_applied = current Policy.experience_mod_factor"
          - "issued_at = clock; issued_by_user_id = caller; adjustment_cents computed"
          - "BillingTransaction created when adjustment_cents != 0"
          - "ModRevision DRAFT created when WC and |variance| >= 0.05"
          - "AuditWorkOrder: RESULT_DRAFTED -> BILLED, version increments"
        note: "ESTIMATED_NONCOMPLIANCE results are created directly in ISSUED by approve-estimated; they never pass through PRELIMINARY"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /audit-results/{id}/disputes"
        actor: Insured
        preconditions: ["clock <= issued_at + 30 days (else ERR_DISPUTE_WINDOW_CLOSED)"]
        side_effects: ["Dispute created FILED", "AuditWorkOrder -> DISPUTED, version increments"]
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /disputes/{id}/overrule"
        actor: AuditManager
        preconditions: ["dispute UNDER_REVIEW", "caller != issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["AuditWorkOrder -> BILLED (STANDARD) or ESTIMATED_BILLED (ESTIMATED_NONCOMPLIANCE), version increments"]
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "POST /disputes/{id}/uphold"
        actor: AuditManager
        preconditions: ["dispute UNDER_REVIEW", "caller != issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects:
          - "BillingTransactions of this result in {ISSUED, PAST_DUE} -> CANCELLED"
          - "AuditWorkOrder -> SUPERSEDED_BY_REAUDIT, version increments"
          - "New REAUDIT AuditWorkOrder created (SELECTED)"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [UPHELD, OVERRULED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/start-review"
        actor: AuditManager
        preconditions: ["caller X-User-ID != result.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["reviewed_by_user_id = caller"]
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/uphold"
        actor: AuditManager
        preconditions: ["caller X-User-ID != result.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["AuditResult: DISPUTED -> SUPERSEDED cascade (see AuditResult)"]
      - from: UNDER_REVIEW
        to: OVERRULED
        trigger: "POST /disputes/{id}/overrule"
        actor: AuditManager
        preconditions: ["caller X-User-ID != result.issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["AuditResult: DISPUTED -> ISSUED", "AuditWorkOrder -> BILLED or ESTIMATED_BILLED by variant"]

  - entity: BillingTransaction
    initial_state: ISSUED
    terminal_states: [PAID, APPLIED, CANCELLED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /billing-transactions/{id}/record-payment with paid_cents reaching amount_cents (type ADDITIONAL_PREMIUM_INVOICE)"
        actor: BillingClerk
        preconditions: ["payment amount <= amount_cents - paid_cents (else ERR_OVERPAYMENT)"]
        side_effects: ["paid_cents += amount_cents of the payment"]
      - from: ISSUED
        to: APPLIED
        trigger: "POST /billing-transactions/{id}/record-payment with paid_cents reaching amount_cents (type RETURN_PREMIUM_CREDIT; payment represents credit application)"
        actor: BillingClerk
        preconditions: ["payment amount <= amount_cents - paid_cents (else ERR_OVERPAYMENT)"]
        side_effects: ["paid_cents += amount"]
      - from: PAST_DUE
        to: PAID
        trigger: "POST /billing-transactions/{id}/record-payment reaching full amount"
        actor: BillingClerk
        preconditions: ["payment amount <= remaining (else ERR_OVERPAYMENT)"]
        side_effects: ["paid_cents += amount"]
      - from: PAST_DUE
        to: APPLIED
        trigger: "POST /billing-transactions/{id}/record-payment reaching full amount (credit)"
        actor: BillingClerk
        preconditions: ["payment amount <= remaining (else ERR_OVERPAYMENT)"]
        side_effects: ["paid_cents += amount"]
      - from: ISSUED
        to: PAST_DUE
        trigger: "system: POST /_clock/set_current_utc when clock > due_at (strictly greater)"
        actor: system
        preconditions: []
        side_effects: ["If clock > due_at + 30 days and still unpaid: parent Policy -> CANCELLED with full cancellation cascade"]
      - from: ISSUED
        to: CANCELLED
        trigger: "system: AuditResult SUPERSEDED (dispute upheld) or Policy cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: CANCELLED
        trigger: "system: AuditResult SUPERSEDED (dispute upheld) or Policy cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ModRevision
    initial_state: DRAFT
    terminal_states: [APPLIED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /mod-revisions/{id}/apply"
        actor: Underwriter
        preconditions: ["parent Policy status != CANCELLED (else ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["Policy.experience_mod_factor = revised_mod_factor", "Policy.version increments"]

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-create-stale-work-order
    parent_entity: AuditWorkOrder
    write_endpoint: "POST /audit-work-orders/{id}/appointments"
    occ_field: expected_work_order_version
    description: |
      Creating an AuditAppointment against an AuditWorkOrder whose version has
      advanced since the client last observed it is rejected. Scheduling
      legitimately supersedes any prior active appointment, so a writer acting
      on a stale version of the work order must re-read before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-work-order
    parent_entity: AuditWorkOrder
    write_endpoint: "POST /audit-work-orders/{id}/payroll-allocations"
    occ_field: expected_work_order_version
    description: |
      Creating a PayrollAllocation against an AuditWorkOrder whose version has
      advanced since the client last observed it is rejected. Each allocation
      shifts the work order's derived premium base, so a writer holding a stale
      version must re-read before adding exposure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: audit_selection_tier
    trigger: "POST /audit-selection-runs"
    algorithm: threshold
    formula: |
      eligible = [p in Policy where p.status == ACTIVE and p.expiration_date <= clock]
      eligible processed in order: expiration_date ASC, tie-break policy_number ASC (never id)
      for each policy, skip silently if it already has an AuditWorkOrder with
        status NOT IN {CLOSED, SUPERSEDED_BY_REAUDIT, CANCELLED}
      tier(p):
        PHYSICAL          if p.estimated_annual_premium_cents >= PHYSICAL_MIN_PREMIUM_CENTS
                          OR any class code in p.class_code_ids has high_hazard == true
        VOLUNTARY_REPORT  elif p.estimated_annual_premium_cents >= VOLUNTARY_MIN_PREMIUM_CENTS
        EXEMPT            otherwise (no work order; policy stays ACTIVE)
      Thresholds are INCLUSIVE (>=): exactly 1000000 cents -> PHYSICAL; exactly 500000 -> VOLUNTARY_REPORT.
    input_set: "Policies: status == ACTIVE and expiration_date <= clock; policies with an open work order are skipped without error"
    constants:
      PHYSICAL_MIN_PREMIUM_CENTS: 1000000
      VOLUNTARY_MIN_PREMIUM_CENTS: 500000
    precision: "integer cents; threshold comparisons on exact integers"

  - name: auditable_payroll
    trigger: "on PayrollAllocation creation (computed field auditable_payroll_dollars)"
    algorithm: aggregation
    formula: |
      excludable_overtime = overtime_excess_dollars if overtime_documented == true else 0
      auditable_payroll_dollars = max(gross_payroll_dollars - excludable_overtime
                                      - severance_dollars - other_exclusions_dollars, 0)
    input_set: "the single PayrollAllocation being created"
    constants: {}
    precision: "whole dollars (integers); floor at 0"

  - name: manual_premium
    trigger: "AuditResult computation at submit-draft (provisional variant) and at issue-result / approve-estimated (final variant)"
    algorithm: aggregation
    formula: |
      base_by_code = {}
      for each included PayrollAllocation (input set per variant): add auditable_payroll_dollars to base_by_code[class_code_id]
      for each SubcontractorExposure of the work order: add included_dollars (per variant cert rule) to base_by_code[governing_class_code_id]
      # ROUNDING ORDER IS PINNED: round each class code's premium FIRST, then sum.
      for each class code c: premium_cents[c] = round_half_up(base_by_code[c] * rate_per_100_cents[c] / 100)
      manual_premium_cents = SUM(premium_cents[c])
      # The alternative order (sum bases first, round once) is FORBIDDEN and yields
      # different cents (e.g. two codes at rate 25 with bases 150 each: per-code 38+38=76 vs sum-first round(300*25/100)=75).
    input_set: |
      provisional (PRELIMINARY at submit-draft): PayrollAllocations with status IN {DRAFT, VERIFIED};
        subcontractor included_dollars computed treating SUBMITTED certificates as if VERIFIED at full coverage.
      final (ISSUED at issue-result): PayrollAllocations with status == VERIFIED only;
        subcontractor included_dollars computed with VERIFIED certificates only (SUBMITTED counts as no certificate).
    constants: {}
    precision: "round_half_up per class code to integer cents, then sum"
    variants:
      - name: provisional
        when: "submit-draft (AuditResult PRELIMINARY)"
        difference: "input set includes DRAFT allocations and treats SUBMITTED certificates as full-coverage exclusions"
      - name: final
        when: "issue-result (AuditResult ISSUED)"
        difference: "input set restricted to VERIFIED allocations and VERIFIED certificates"

  - name: earned_premium
    trigger: "AuditResult computation (same points as manual_premium)"
    algorithm: tiered_pricing
    formula: |
      if variant == ESTIMATED_NONCOMPLIANCE:
        earned_premium_cents = round_half_up(Policy.estimated_annual_premium_cents * ESTIMATED_AUDIT_MULTIPLIER)
        # estimated variant BYPASSES the minimum-premium floor and the mod factor
      else:
        modified_premium_cents = round_half_up(manual_premium_cents * Policy.experience_mod_factor)
        earned_premium_cents  = max(modified_premium_cents, Policy.minimum_premium_cents)
    input_set: "manual_premium_cents of the same computation pass; Policy.experience_mod_factor and Policy.minimum_premium_cents at computation time"
    constants:
      ESTIMATED_AUDIT_MULTIPLIER: 1.25
    precision: "round_half_up to integer cents after each multiplication"
    variants:
      - name: standard
        when: "audit path with records"
        difference: "mod factor applied, minimum premium floor enforced via max()"
      - name: estimated_noncompliance
        when: "approve-estimated on NONCOMPLIANT_PENDING work order"
        difference: "flat 1.25x multiplier on estimated annual premium; no mod factor; no minimum-premium floor"

  - name: billing_adjustment
    trigger: "AuditResult reaches ISSUED (issue-result or approve-estimated)"
    algorithm: aggregation
    formula: |
      adjustment_cents = earned_premium_cents - Policy.estimated_annual_premium_cents
      if adjustment_cents > 0: create BillingTransaction(ADDITIONAL_PREMIUM_INVOICE, amount_cents = adjustment_cents)
      elif adjustment_cents < 0: create BillingTransaction(RETURN_PREMIUM_CREDIT, amount_cents = -adjustment_cents)
      else: no BillingTransaction is created
      INVARIANT (per Policy): SUM over BillingTransactions with status != CANCELLED of
        sign(type) * amount_cents  ==  adjustment_cents of the latest ISSUED (non-SUPERSEDED) AuditResult
        across all of the policy's work orders. (sign: invoice +1, credit -1)
      due_at = issued_at + 30 days
      PAST_DUE sweep: clock > due_at (strictly) -> PAST_DUE
      cancellation sweep: clock > due_at + 30 days and status == PAST_DUE -> Policy CANCELLED cascade
    input_set: "the ISSUED AuditResult and its Policy"
    constants:
      BILLING_DUE_DAYS: 30
      CANCELLATION_GRACE_DAYS: 30
    precision: "integer cents; window boundaries strict-greater"

  - name: subcontractor_inclusion
    trigger: "certificate verify/reject (immediate recompute) and AuditResult computation (variant-dependent)"
    algorithm: interval_merge
    formula: |
      audit period = [AuditWorkOrder.audit_period_start, AuditWorkOrder.audit_period_end]  (CLOSED interval, day granularity)
      period_days = inclusive day count of the audit period
      cert = the exposure's certificate acceptable under the variant (provisional: SUBMITTED or VERIFIED; final: VERIFIED only)
      if cert exists:
        overlap_days = inclusive day count of [cert.coverage_effective_date, cert.coverage_expiration_date] INTERSECT audit period
        if overlap_days == period_days: included_dollars = 0            (status EXCLUDED)
        else: included_dollars = round_half_up(payments_dollars * (period_days - overlap_days) / period_days)   (status PARTIAL_INCLUDED)
      else:
        included_dollars = payments_dollars                              (status INCLUDED)
      # Worked example: period 2026-01-01..2026-07-31 = 212 days; cert 2026-03-01..2026-07-31 = 153 days;
      # uncovered 59 days; payments 20000 -> round_half_up(20000 * 59 / 212) = round_half_up(5566.0377...) = 5566.
    input_set: "SubcontractorExposures of the work order and their certificates"
    constants: {}
    precision: "round_half_up to whole dollars; closed-interval inclusive day counts"
    variants:
      - name: provisional
        when: "submit-draft"
        difference: "SUBMITTED certificates count as full-coverage exclusions"
      - name: final
        when: "issue-result"
        difference: "only VERIFIED certificates count"

  - name: mod_revision
    trigger: "after AuditResult ISSUED via issue-result (STANDARD variant only), when policy coverage_line == WC"
    algorithm: threshold
    formula: |
      audited_total = AuditResult.total_payroll_dollars (final input set)
      variance = (audited_total - Policy.payroll_estimate_dollars) / Policy.payroll_estimate_dollars
      if abs(variance) < 0.05: no ModRevision is created
      else:
        steps = trunc(variance * 20)          # truncation TOWARD ZERO; one 0.01 step per full 5% of variance
        revised = prior_mod + steps * 0.01
        revised_mod_factor = clamp(round_half_up(revised, 2), 0.75, 1.50)
      EVALUATION ORDER IS PINNED (circular-looking dependency):
        (1) final payroll totals -> (2) manual_premium -> (3) earned_premium with the PRE-REVISION mod factor
        -> (4) billing adjustment -> (5) ModRevision computed LAST from the finalized payroll.
        The issued result therefore always reflects the mod factor in force at issue time;
        the revision only takes effect when applied via POST /mod-revisions/{id}/apply.
      # Worked examples: audited 95000 vs estimate 100000 -> variance -0.05 -> trunc(-1.0) = -1 -> 1.20 - 0.01 = 1.19.
      # audited 92500 -> variance -0.075 -> trunc(-1.5) = -1 -> 1.19 (floor would give 1.18).
      # prior 1.48 with variance +0.25 -> 1.48 + 0.05 = 1.53 -> clamp -> 1.50.
    input_set: "the ISSUED AuditResult and its Policy (WC only)"
    constants:
      VARIANCE_THRESHOLD: 0.05
      STEPS_PER_UNIT_VARIANCE: 20
      MOD_FLOOR: 0.75
      MOD_CEILING: 1.50
    precision: "ratio unrounded; trunc toward zero; final round_half_up to 2 decimals; clamp"

  - name: records_request_due
    trigger: "RecordsRequest creation and clock sweep"
    algorithm: chronological
    formula: |
      due_at = requested_at + 15 days
      on POST /_clock/set_current_utc: every RecordsRequest with status IN {OPEN} and clock > due_at -> OVERDUE
      Boundary: clock == due_at exactly leaves the request OPEN (strictly-greater comparison).
    input_set: "RecordsRequests with status OPEN"
    constants:
      RECORDS_DUE_DAYS: 15
    precision: "ISO 8601 timestamps; strict >"

  - name: appointment_window
    trigger: "POST /audit-work-orders/{id}/appointments"
    algorithm: threshold
    formula: |
      valid iff audit_period_end < scheduled_start AND scheduled_start <= audit_period_end + 60 days
      AND scheduled_end > scheduled_start
    input_set: "the appointment being created and the parent work order's audit period"
    constants:
      APPOINTMENT_WINDOW_DAYS: 60
    precision: "ISO 8601; lower bound strict (>), upper bound inclusive (<=)"

  - name: auditor_calendar_overlap
    trigger: "POST /audit-work-orders/{id}/appointments"
    algorithm: interval_merge
    formula: |
      For the assigned auditor, consider existing AuditAppointments with status IN {SCHEDULED, CONFIRMED}
      across ALL work orders (any policy). Intervals are HALF-OPEN [scheduled_start, scheduled_end).
      Conflict iff new.start < existing.end AND existing.start < new.end.
      Back-to-back is allowed: new.start == existing.end does NOT conflict.
    input_set: "appointments of the assigned auditor in {SCHEDULED, CONFIRMED}"
    constants: {}
    precision: "ISO 8601; half-open intersection"

  - name: allocation_period_overlap
    trigger: "POST /audit-work-orders/{id}/payroll-allocations"
    algorithm: interval_merge
    formula: |
      Within the same work order, for the SAME class_code_id, periods of non-REJECTED allocations
      are CLOSED intervals [period_start, period_end] and MUST NOT overlap:
      conflict iff new.start <= existing.end AND existing.start <= new.end.
      Sharing a boundary day (new.start == existing.end) DOES conflict (closed semantics).
      Different class codes may use identical periods without conflict.
    input_set: "non-REJECTED PayrollAllocations of the same work order with the same class_code_id"
    constants: {}
    precision: "closed-interval inclusive comparison"

  - name: dispute_window
    trigger: "POST /audit-results/{id}/disputes"
    algorithm: threshold
    formula: |
      filing valid iff clock <= result.issued_at + 30 days   (INCLUSIVE upper bound)
      exactly issued_at + 30 days -> allowed; one second later -> ERR_DISPUTE_WINDOW_CLOSED
    input_set: "the AuditResult being disputed"
    constants:
      DISPUTE_WINDOW_DAYS: 30
    precision: "ISO 8601; inclusive <="

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: business_constraint
    check: "Request shape: required fields present, types valid, enum members valid, effective_date < expiration_date, scheduled_end > scheduled_start, coverage_effective_date <= coverage_expiration_date, period_start < period_end, amounts >= 0, minimum_premium_cents <= estimated_annual_premium_cents, WC experience_mod_factor within [0.75, 1.50], GL experience_mod_factor == 1.00, no undeclared fields"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 3
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 4
    category: auth
    check: "Ownership scoping: Insured (X-User-ID == Policy.id) may only touch resources of their own policy graph; Auditor (X-User-ID == Auditor.id) may only mutate children of work orders where assigned_auditor_id == X-User-ID"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all entity-backed role endpoints"
  - priority: 5
    category: auth
    check: "Segregation of duties: approve-estimated caller != marked_noncompliant_by_user_id; dispute start-review/uphold/overrule caller != result.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "approve-estimated, dispute start-review/uphold/overrule"
  - priority: 6
    category: existence
    check: "Path ids and body FK references exist (left-to-right); class_code_id / governing_class_code_id / auditor_id / policy class_code_ids resolve"
    error_id: "ERR_POLICY_NOT_FOUND | ERR_AUDITOR_NOT_FOUND | ERR_CLASS_CODE_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_RECORDS_REQUEST_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_SUB_EXPOSURE_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_AUDIT_RESULT_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_BILLING_NOT_FOUND | ERR_MOD_REVISION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 7
    category: state
    check: "Target resource is in a from-state permitted by its state machine; terminal states reject all transitions"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_work_order_version == current AuditWorkOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /audit-work-orders/{id}/appointments, POST /audit-work-orders/{id}/payroll-allocations"
  - priority: 9
    category: business_temporal
    check: "Time-window rules: appointment within (audit_period_end, audit_period_end + 60d]; dispute filed within issued_at + 30d"
    error_id: "ERR_APPOINTMENT_OUTSIDE_WINDOW | ERR_DISPUTE_WINDOW_CLOSED"
    http_status: 409
    applies_to: "appointments create, disputes create"
  - priority: 10
    category: business_constraint
    check: "Constraint rules: auditor calendar overlap; allocation period overlap; open records requests; draft allocations pending; reschedule cap; certificate coverage flag/window; auditor territory; noncompliance basis; duplicate records request type; duplicate policy number; duplicate class code"
    error_id: "ERR_APPOINTMENT_OVERLAP | ERR_ALLOCATION_PERIOD_OVERLAP | ERR_OPEN_RECORDS_REQUESTS | ERR_DRAFT_ALLOCATIONS_PENDING | ERR_RESCHEDULE_LIMIT_EXCEEDED | ERR_CERT_INSUFFICIENT_COVERAGE | ERR_CERT_WINDOW_INSUFFICIENT | ERR_AUDITOR_TERRITORY_MISMATCH | ERR_NO_NONCOMPLIANCE_BASIS | ERR_DUPLICATE_RECORDS_REQUEST | ERR_DUPLICATE_POLICY_NUMBER | ERR_DUPLICATE_CLASS_CODE"
    http_status: 409
    applies_to: "various (see error catalog)"
  - priority: 11
    category: business_fiscal
    check: "Fiscal: payment does not exceed remaining balance on the billing transaction"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /billing-transactions/{id}/record-payment"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server default before any call is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Setting the clock triggers sweeps: RecordsRequests past due_at -> OVERDUE; BillingTransactions past due_at -> PAST_DUE; BillingTransactions unpaid past due_at + 30 days -> Policy CANCELLED cascade."
    roles: [AuditManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["records OVERDUE sweep", "billing PAST_DUE sweep", "policy cancellation cascade"]

  # --- Policy ---
  - method: POST
    path: "/policies"
    description: "Create a policy (status ACTIVE)"
    roles: [Underwriter]
    code: 201
    input: [policy_number, insured_name, coverage_line, state_code, effective_date, expiration_date, estimated_annual_premium_cents, minimum_premium_cents, payroll_estimate_dollars, "experience_mod_factor?", class_code_ids]
    output: Policy
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/policies"
    description: "List policies with pagination"
    roles: [Insured, Auditor, AuditManager, Underwriter, BillingClerk]
    code: 200
    input: ["status?", "coverage_line?", "limit?", "offset?"]
    output: Policy[]
    side_effects: ["Insured callers see only the policy whose id == X-User-ID"]
  - method: GET
    path: "/policies/{id}"
    description: "Get a policy"
    roles: [Insured, Auditor, AuditManager, Underwriter, BillingClerk]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/policies/{id}/cancel"
    description: "Manually cancel a policy (cascades to work orders, appointments, billings)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["non-terminal work orders -> CANCELLED", "active appointments -> CANCELLED", "unpaid billings -> CANCELLED", "Policy.version increments"]
  - method: GET
    path: "/policies/{id}/mod-revisions"
    description: "List mod revisions of a policy (FK reverse reachability)"
    roles: [Insured, AuditManager, Underwriter]
    code: 200
    input: []
    output: ModRevision[]
    side_effects: []

  # --- Auditor ---
