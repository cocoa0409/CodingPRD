        distinguishing_aspect: "Claim CREATION does not gate on vetting (an APPLIED applicant with score 50 can file a PENDING claim), but ACCEPT does: the owner's accept fails 409 ERR_MEMBER_NOT_VETTED with the claimant still APPLIED."
