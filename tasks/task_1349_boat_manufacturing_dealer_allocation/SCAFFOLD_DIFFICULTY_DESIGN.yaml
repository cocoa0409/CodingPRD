            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 291748, option_package_ids: ["${opt_tower}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id, ord_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "PATCH /dealer-orders/${ord1}"
              payload: { expected_order_version: "${ord_v}", option_package_ids: ["${opt_tower}", "${opt_ballast}"], deposit_paid_cents: 1 }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPTION_CUTOFF_PASSED (business_temporal priority 9 fires before business_fiscal priority 11)"
            - "http_status == 422"
            - "NOT ERR_DEPOSIT_INSUFFICIENT despite deposit 1 being below any required_deposit"

  # ========================================================================= rule 6
  # boundary_precision_check: two boundaries on DIFFERENT metrics + DIFFERENT endpoints.
  - rule_id: boundary_precision_check
    instances:
      - name: slot_capacity_equality_allows_booking
        grounds:
          - calculations.allocation_usage_count
          - entities.BuildSlot.fields.capacity_hours
          - entities.BuildSlot.fields.reserved_hours
        distinguishing_aspect: |
          Numeric equality boundary on the BuildSlot metric through POST /dealer-orders:
          slot.capacity_hours=50 and order.production_hours=50 means
          reserved_hours + needed == capacity (== allowed, > rejected). Tests the
          greater-than-vs-greater-than-or-equal boundary exactly at 50.
        test_recipe:
          setup:
            - "SP190 model prod 40 + TOWER 6 + BALLAST 4 = 50 total production_hours"
            - "Slot cap exactly 50"
            - "Dealer quota 5, floor_plan_limit high"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "WAKE-TOWER", name: "Wake Tower", price_cents: 350000, production_hours: 6 }
              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /option-packages"
              payload: { model_id: "${m_sp}", option_code: "BALLAST", name: "Ballast System", price_cents: 180000, production_hours: 4 }
              as: SystemAdmin
              captures: { opt_ballast: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 50 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
          trigger:
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 309361, option_package_ids: ["${opt_tower}", "${opt_ballast}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id, ord_status: $.data.status }
          assert:
            - "DealerOrder.${ord1}.status == ALLOCATED (equality allowed at boundary 50 == 50)"
            - "BuildSlot.${slot1}.reserved_hours == 50"
            - "No ERR_SLOT_CAPACITY_EXCEEDED raised"

      - name: quota_equality_blocks_second_booking
        grounds:
          - calculations.allocation_usage_count
          - entities.Dealer.fields.annual_allocation_quota
          - entities.Dealer.fields.allocation_used
        distinguishing_aspect: |
          Empty-set/zero-count boundary on the Dealer.allocation_used metric through a
          DIFFERENT endpoint than instance 1: quota=1, after first ALLOCATED booking
          used=1; a second POST /dealer-orders hits allocation_used == quota -> rejected
          with ERR_QUOTA_EXCEEDED. The metric (count) and rule (== blocks, < allows) are
          on a different entity+metric pair than slot hours, and a different code path
          (quota gate vs slot-capacity gate) within the same endpoint.
        test_recipe:
          setup:
            - "Dealer with annual_allocation_quota=1"
            - "First order booked ALLOCATED -> allocation_used=1"
            - "Second order on a different slot would take allocation_used to 2 > quota 1"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
              captures: { m_sp: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 1, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
