# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Customer role acting on a resource owned by a different customer" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive amount, or both/neither of equipment_item_id and own_gear_description" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition (incl. terminal lockdown)" }
  - { id: ERR_DATE_RANGE_INVALID, http: 422, condition: "end_date < start_date or end_time <= start_time" }
  - { id: ERR_WINDOW_EXPIRED, http: 422, condition: "Pickup window end datetime is in the past at booking time" }
  - { id: ERR_DEMO_CREDIT_EXPIRED, http: 422, condition: "Demo credit expires_at <= logical now at purchase time" }
  - { id: ERR_DIN_MISMATCH, http: 422, condition: "Preferred unit's DIN range does not cover the customer's computed fitment DIN" }
  - { id: ERR_EQUIPMENT_NOT_AVAILABLE, http: 409, condition: "Preferred/requested unit is IN_SERVICE, AWAITING_INSPECTION, RETIRED, LOST, or SOLD" }
  - { id: ERR_EQUIPMENT_OCCUPANCY_CONFLICT, http: 409, condition: "Requested window collides with an existing closed date-window on the unit (1 free day required between windows)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New pickup window strictly overlaps an existing window at the same location/date (half-open semantics; adjacency allowed)" }
  - { id: ERR_WINDOW_FULL, http: 409, condition: "Pickup window posture is FULL (booked_count >= van_capacity)" }
  - { id: ERR_CAPACITY_MISSING, http: 422, condition: "No ShopDayCapacity row for date(ticket created_at)" }
  - { id: ERR_RUSH_CAPACITY_EXCEEDED, http: 409, condition: "rush_booked_minutes + labor_minutes > rush_reserved_minutes" }
  - { id: ERR_CAPACITY_FULL, http: 409, condition: "booked_minutes + labor_minutes > base_labor_minutes at start/qc-fail" }
  - { id: ERR_CAPACITY_EXISTS, http: 409, condition: "ShopDayCapacity row already exists for service_date" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED, http: 409, condition: "qc-fail when rework_count == 2" }
  - { id: ERR_SWAP_LIMIT_EXCEEDED, http: 409, condition: "swap when swap_count == 2" }
  - { id: ERR_JUNIOR_AGE_EXCEEDED, http: 422, condition: "Junior older than 12 full years at season_start_date" }
  - { id: ERR_GUARDIAN_INVALID, http: 422, condition: "Guardian equals junior or is under 18 at season_start_date" }
  - { id: ERR_NOT_JUNIOR_TIER, http: 422, condition: "Leased unit not tier JUNIOR or gear_type mismatch with package_tier" }
  - { id: ERR_NOT_DEMO_TIER, http: 422, condition: "Demo credit recorded against a non-DEMO unit" }
  - { id: ERR_RESERVATION_NOT_CONFIRMED, http: 409, condition: "Pickup booking against a reservation not in CONFIRMED fulfillment" }
  - { id: ERR_ITEMS_UNASSIGNED, http: 409, condition: "Confirm without any ASSIGNED item, or pickup while QUEUED items remain" }
  - { id: ERR_ITEMS_PENDING_INSPECTION, http: 409, condition: "Close while a unit of the reservation is OUT or AWAITING_INSPECTION" }
  - { id: ERR_ITEM_NOT_IN_RESERVATION, http: 422, condition: "DamageAssessment unit was never an item of the given reservation" }
  - { id: ERR_DEMO_CREDIT_NOT_REDEEMABLE, http: 409, condition: "demo_credit_id not owned by the customer or not ACTIVE" }
  - { id: ERR_DEPOSIT_BELOW_MINIMUM, http: 422, condition: "deposit_authorized_cents < deposit_minimum_cents at confirm" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Renting/owning customer; may only touch own resources"
    identity: "entity_backed:Customer"
    exclusive_operations: ["Approve own tune-ticket quotes", "Dispute own damage invoices"]
    shared_operations: ["Create/cancel/confirm own reservations and items", "Book/cancel own slope-side pickups", "Create own tune tickets", "Purchase and pay", "Read own resources"]
  - name: FrontDesk
    description: "Counter staff: reservations, handouts, returns, invoicing, pickups"
    identity: "opaque"
    exclusive_operations: ["Invoice damage assessments", "Close reservations", "Register customers", "Record demo credits"]
    shared_operations: ["Reservation lifecycle actions", "Assign/release reservation items", "Pickup bookings", "Purchase fulfillment"]
  - name: Technician
    description: "Shop technician: tuning pipeline, inspection, damage assessment"
    identity: "opaque"
    exclusive_operations: ["Quote/start/complete/QC tune tickets", "Inspect and service-complete equipment", "Create damage assessments"]
    shared_operations: ["Create tune tickets", "Read fleet and tickets"]
  - name: Manager
    description: "Hierarchical override: superset of FrontDesk and Technician plus fleet, window, capacity, dispute-resolution, and clock administration"
    identity: "opaque"
    exclusive_operations: ["Create/retire equipment", "Create pickup windows", "Declare shop-day capacity", "Resolve disputes", "Reinstate leases", "Set the logical clock"]
    shared_operations: ["All FrontDesk and Technician operations", "Approve quotes and dispute resolutions on behalf of customers"]
