              payload: { dry_weather_avg_gpm: 60, peak_storm_gpm: 425 }
              as: DistrictEngineer
          trigger:
            - call: "POST /sewer/flow-periods/${fpost_id}/analyze"
              payload: {}
              as: DistrictEngineer
              captures: { dry_pct: $.data.dry_weather_reduction_pct, storm_pct: $.data.storm_event_reduction_pct, met: $.data.basin_target_met }
          assert:
            - "analyze response dry_weather_reduction_pct == 40.0"
            - "analyze response storm_event_reduction_pct == 15.0"
            - "analyze response basin_target_met == true (dry 40.0 >= target 30; storm 15.0 < 30 must NOT be used for the gate)"
  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mobilization_tier_three_input_nonlinear_mode_a
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.mobilization_tier
        distinguishing_aspect: |
          Mode (a): mobilization tier is a >=3-input conditional branch
          (diameter_mm, length_m, evaluation order MOB_LARGE-first) with
          non-linear interaction — a 700mm/50m segment and a 200mm/400m
          segment both map to MOB_LARGE via different predicates, and the
          pinned evaluation order decides ties when both predicates fire.
        test_recipe:
          setup:
            - "District D; segment SBIG: 700mm RCP length 400m (both LARGE predicates true)"
            - "CERTIFIED baseline on SBIG with structural_grade 4 -> plan FULL_REPLACE proposed/approved -> work order W issued"
            - "Clock 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-CF1", ii_reduction_target_pct: 25, budget_cents: 100000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Coder CF1", nassco_cert_number: "PACP-CF1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "QA CF1", nassco_cert_number: "PACP-QF1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Crew CF1", nassco_cert_number: "PACP-WF1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CREW_LEAD"] }
              as: DistrictEngineer
              captures: { tw_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-CF1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-7->MH-8", diameter_mm: 700, material: "RCP", length_m: 400, install_year: 1960 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T08:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
