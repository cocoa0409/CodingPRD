              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/tanks/${t12}/cleaning-records/${cr12_init}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
            # Run a FLAMMABLE batch through to set last_product_ghs
            - call: "POST /toll-operations/customers/${c12}/batch-jobs"
              payload: { recipe_id: "${r12}", pricing_agreement_id: "${pa12}", tank_id: "${t12}", batch_size_l: 100, scheduled_start: "2026-10-20T08:00:00Z", scheduled_end: "2026-10-20T12:00:00Z" }
              as: BatchScheduler
              captures: { bj12: $.data.id, bj12_v: $.data.version }
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/release"
              payload: { expected_batch_job_version: "${bj12_v}" }
              as: BatchScheduler
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/batch-charges"
              payload: { raw_material_lot_id: "${l12}", charge_order: 1, charged_qty_kg: 80 }
              as: TankOperator
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/start-charging"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/start-mixing"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/hold-for-qa"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/sds"
              payload: { ghs_classification: "FLAMMABLE", signal_word: "DANGER", hazard_statements: ["H225"] }
              as: SDSAuthor
              captures: { sds12: $.data.id }
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/sds/${sds12}/issue"
              payload: {}
              as: SDSAuthor
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/package-config"
              payload: { package_type: "DRUM_205L", un_rated: true, package_count: 1 }
              as: ShippingClerk
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/heel-disposals"
              payload: { raw_material_lot_id: "${l12}", heel_returned_kg: 5, heel_disposed_kg: 0, disposed_at: "2026-10-20T11:00:00Z" }
              as: TankOperator
              captures: { hd12: $.data.id }
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/heel-disposals/${hd12}/post"
              payload: {}
              as: TankOperator
            - call: "POST /toll-operations/customers/${c12}/batch-jobs/${bj12}/complete"
              payload: { actual_output_kg: 75 }
              as: QAValidator
            # Tank is now DIRTY with last_product_ghs=FLAMMABLE; submit cleaning at exactly 50 ppm
            - call: "POST /toll-operations/tanks/${t12}/cleaning-records"
              payload: { method: "SOLVENT_FLUSH", started_at: "2026-10-21T08:00:00Z", completed_at: "2026-10-21T09:00:00Z", residue_ppm: 50 }
              as: TankOperator
              captures: { cr50: $.data.id }
            - call: "POST /toll-operations/tanks/${t12}/cleaning-records/${cr50}/submit"
              payload: {}
              as: TankOperator
          trigger:
            - call: "POST /toll-operations/tanks/${t12}/cleaning-records/${cr50}/validate"
              payload: { decision: "PASS" }
              as: QAValidator
              captures: { cr50_outcome: $.data.validation_outcome }
          assert:
            - "CleaningRecord.${cr50}.validation_outcome == PASSED (residue_ppm=50 satisfies <= 50 limit)"
            - "Tank.${t12}.cleaning_state == CLEAN_VALIDATED"
            - "Tank.${t12}.last_product_ghs == null (cleared by validated cleaning)"

