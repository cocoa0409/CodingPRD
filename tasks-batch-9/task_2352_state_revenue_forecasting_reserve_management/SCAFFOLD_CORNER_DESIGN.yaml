        distinguishing_aspect: |
          The rating analyst is a peer with draft-and-edit rights, not an approver: it may create and
          PATCH a DRAFT briefing, but publish is the ForecastDirector's exclusive act, so the
          analyst's publish returns ERR_UNAUTHORIZED 403 with the briefing still DRAFT and
          published_at null.
