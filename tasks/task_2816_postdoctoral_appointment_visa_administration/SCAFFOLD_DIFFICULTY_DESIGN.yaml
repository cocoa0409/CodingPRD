  - rule_id: compensating_invariant
    instances:

      - name: offer_withdrawal_releases_the_exact_encumbrance_and_restores_reusable_budget
        grounds:
          - state_machines.Appointment.OFFER_ISSUED_to_WITHDRAWN
          - calculations.funding_encumbrance
          - validations.priority_31_ERR_FUNDING_BUDGET_EXCEEDED
          - entities.FundingSource.fields.encumbered_usd
          - entities.FundingSource.fields.available_balance_usd
        distinguishing_aspect: |
          Conserved quantity: MONEY — the identity
          encumbered_usd + available_balance_usd == annual_budget_usd must hold
          before the offer, after the offer, and after the withdrawal. The
          invariant is tested destructively rather than by inspection: the award is
          sized at 100000.00 so that a single 90780.00 encumbrance leaves only
          9220.00, a competing offer is refused for budget, and the withdrawal must
          release exactly 90780.00 — not a proration, not a rounded remainder — for
          that competing offer to then encumber exactly 90780.00 again. Any drift of
          one cent leaves the second issue-offer refused or the ledger unbalanced.
        test_recipe:
          setup:
            - "Two US-citizen scholars needing no sponsorship and one mentor with valid training."
            - "One VERIFIED NIH_SCALE FEDERAL_GRANT with annual_budget_usd 100000.00, requires_mentoring_plan true, covering 2026-09-01 to 2027-12-31."
            - "Two DRAFT POSTDOC_ASSOCIATE appointments 2026-10-01 to 2027-09-30 at 68000.00, one per scholar."
            - "The first appointment has had its offer issued, so encumbered_usd is 90780.00 and available_balance_usd is 9220.00."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "D. Yilmaz", department: "Genetics", mentor_training_valid_through: "2029-04-30", max_concurrent_postdocs: 3 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { m18_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH R21-1800", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 100000.00, requires_mentoring_plan: true, requires_idp: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { f18_id: "$.data.id" }
            - call: "POST /funding-sources/${f18_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_1"
              captures: { f18_avail_initial: "$.data.available_balance_usd" }
            - call: "POST /postdocs"
              payload: { full_name: "Ulla Mattson", email: "ulla.m@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-01-10", prior_external_months_in_rank: 0 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { pu_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Viktor Halgren", email: "viktor.h@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-01-11", prior_external_months_in_rank: 0 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { pv_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${pu_id}", mentor_id: "${m18_id}", funding_source_id: "${f18_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 68000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { au_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${pv_id}", mentor_id: "${m18_id}", funding_source_id: "${f18_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 68000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { av_id: "$.data.id" }
            - call: "POST /appointments/${au_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { au_enc: "$.data.encumbrance_usd" }
            - call: "GET /funding-sources/${f18_id}"
              payload: {}
              as: HRCompensationApprover
              captures: { f18_enc_after_offer: "$.data.encumbered_usd", f18_avail_after_offer: "$.data.available_balance_usd" }
            - call: "GET /appointments/${au_id}/development-documents"
              payload: { doc_type: "MENTORING_PLAN" }
              as: PostdocAffairsOfficer
              captures: { mp18_id: "$.data[0].id" }
            - call: "GET /appointments/${au_id}/export-control-reviews"
              payload: { status: "QUEUED" }
              as: ExportControlReviewer
              captures: { ecr18_id: "$.data[0].id" }
            - call: "POST /appointments/${av_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { budget_err: "$.data.error_id" }
          trigger:
            - call: "POST /appointments/${au_id}/withdraw"
              payload: { withdraw_reason: "CANDIDATE_DECLINED" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { au_status: "$.data.appointment_status", au_enc_after: "$.data.encumbrance_usd", au_reason: "$.data.withdraw_reason" }
            - call: "GET /funding-sources/${f18_id}"
              payload: {}
              as: HRCompensationApprover
              captures: { f18_enc_released: "$.data.encumbered_usd", f18_avail_released: "$.data.available_balance_usd" }
            - call: "POST /appointments/${av_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_18"
              captures: { av_enc: "$.data.encumbrance_usd", av_status: "$.data.appointment_status" }
            - call: "GET /funding-sources/${f18_id}"
              payload: {}
              as: HRCompensationApprover
              captures: { f18_enc_reused: "$.data.encumbered_usd", f18_avail_reused: "$.data.available_balance_usd" }
          assert:
            - "${f18_avail_initial} == 100000.00"
            - "${au_enc} == 90780.00"
            - "${f18_enc_after_offer} == 90780.00"
            - "${f18_avail_after_offer} == 9220.00"
            - "${budget_err} == ERR_FUNDING_BUDGET_EXCEEDED"
            - "the refused issue-offer response http_status == 422"
            - "${au_status} == WITHDRAWN"
            - "${au_reason} == CANDIDATE_DECLINED"
            - "${au_enc_after} == 0.00"
            - "${f18_enc_released} == 0.00"
            - "${f18_avail_released} == 100000.00"
            - "DevelopmentDocument.${mp18_id}.status == VOIDED"
            - "ExportControlReview.${ecr18_id}.status == VOIDED"
            - "${av_status} == OFFER_ISSUED"
            - "${av_enc} == 90780.00"
            - "${f18_enc_reused} == 90780.00"
            - "${f18_avail_reused} == 9220.00"

      - name: exit_revocation_returns_the_bench_seat_days_to_the_laboratory_pool
        grounds:
          - calculations.lab_bench_occupancy
          - state_machines.LabAccessGrant.PROVISIONED_to_REVOKED
          - validations.priority_28_ERR_LAB_CAPACITY_EXCEEDED
          - entities.Laboratory.fields.bench_capacity
        distinguishing_aspect: |
          Conserved quantity: BENCH-SEAT-DAYS — for every calendar day, the seats
          occupied in a laboratory equal the sum of bench_seats over grants in
          {PROVISIONED, SUSPENDED} covering that day, and a REVOKED grant must
          contribute zero. This is a per-day physical count rather than the
          monetary identity of the previous instance, and the compensating action is
          a cascade from a different entity entirely (an ExitRecord creation), not
          the reversal of the write that created the reservation. The proof is
          re-admission: the identical interval that was refused becomes grantable
          only after the revocation, so an implementation that merely marks the old
          grant inactive without excluding it from the occupancy sum stays blocked.
        test_recipe:
          setup:
            - "One mentor with valid training for both scholars; one VERIFIED NIH_SCALE FEDERAL_GRANT (600000.00, 2026-09-01 to 2027-12-31)."
            - "One BSL1 laboratory, bench_capacity 1, decontamination_buffer_days 0, status OPEN."
            - "Appointments AK and AL, both ACTIVE with compliance CLEARED, terms 2026-10-01 to 2027-09-30 at 62000.00."
