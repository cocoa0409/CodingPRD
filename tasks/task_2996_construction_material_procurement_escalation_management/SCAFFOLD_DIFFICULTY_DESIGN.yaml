      assert:
      - SubstitutionRequest.${sr_a_id}.status == APPROVED with applied_cost_delta == 45000.00 and applied_schedule_delta_days == 12
      - SubstitutionRequest.${sr_b_id}.status == APPROVED_AS_NOTED with applied_cost_delta == 45000.00 and applied_schedule_delta_days == 0
      - MaterialPackage.${pkg_id}.fabrication_duration_days == 82 and lead_time_days == 123
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-10-29T00:00:00.000Z" and float_days == 89
      - MaterialPackage.${pkg2_id}.fabrication_duration_days == 70 and lead_time_days == 111
      - MaterialPackage.${pkg2_id}.release_for_fabrication_date == "2026-11-10T00:00:00.000Z" and float_days == 101
      - MaterialPackage.${pkg_id}.estimated_cost == 1245000.00 and MaterialPackage.${pkg2_id}.estimated_cost == 1245000.00
      - both packages report rff_risk_band == ON_TRACK
- rule_id: transitive_cascade
  instances:
  - name: clock_sweep_expires_quote_lapses_clause_voids_po_stalls_package
    grounds:
    - state_machines.Quote.OPEN_to_EXPIRED
    - state_machines.EscalationAgreement.PROPOSED_to_LAPSED
    - state_machines.PurchaseCommitment.PENDING_to_VOIDED
    - state_machines.MaterialPackage.BOUGHT_OUT_to_SOURCING_STALLED
    distinguishing_aspect: 'FOUR-HOP chain headed by POST /procurement/_clock/set_current_utc: Quote OPEN -> EXPIRED, then its PROPOSED clause -> LAPSED, then the PENDING commitment attached to that clause -> VOIDED, then the package BOUGHT_OUT -> SOURCING_STALLED because the sweep left it with open_quote_count 0.'
    test_recipe:
      setup:
      - Clock at its 2026-08-01T00:00:00Z startup default
      - Steel package with a single OPEN quote received 2026-08-01 with price_hold_days 45, so expires_at is 2026-09-15
      - PPI_STEEL_MILL reading published for 2026-07 at 310.00
      - Escalation clause on that quote at status PROPOSED (never executed)
      - PurchaseCommitment created with that clause attached and left at commitment_status PENDING, so the package is BOUGHT_OUT
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
