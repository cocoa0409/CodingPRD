        distinguishing_aspect: "Ownership scoping within a role: GroupChairman gc-2 holds the right role but the wrong identity for a group chaired by gc-1 — the completion is rejected with 403 ERR_CHAIRMAN_OWNERSHIP while all state gates are satisfied."
