        claim_type: correct_result
        grounds: ["calculations.payment_allocation", "entities.RecoveryTransaction.fields.applied_to_interest_cents", "entities.RecoveryTransaction.fields.applied_to_principal_cents"]
        distinguishing_aspect: "With 1353 accrued interest, a 5000 posting allocates 1353 to interest first then 3647 to principal."
        test_recipe:
          setup:
