              as_user_id: "${mgr1_id}"
              captures: { org_used: $.data.referral_slots_used }
            - call: "GET /appointments/${appt_id}"
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { appt_stat: $.data.status, appt_sys: $.data.cancelled_by_system }
          assert:
            - "Case.${case_id}.privacy_posture == SEALED (m1)"
            - "Referral.${ref_id}.status == SUSPENDED and suspension_reason == CASE_SEALED (m2, caused by m1)"
            - "Organization.${orgx_id}.referral_slots_used == 0 (m3a, caused by the referral suspension)"
            - "Appointment.${appt_id}.status == CANCELLED and cancelled_by_system == true (m3b, caused by the referral suspension)"

      - name: assessment_verify_supersede_plan_revision_cascade
        grounds:
          - state_machines.NeedsAssessment.SUBMITTED_to_VERIFIED
          - state_machines.CasePlan.ACTIVE_to_DRAFT
          - calculations.acuity_index
        distinguishing_aspect: |
          Depth-3 cascade from a verification trigger (different trigger than the seal cascade):
          verifying assessment A2 (m1) supersedes the previously VERIFIED A1 (m2, caused by the
          verification), and the supersession itself forces the ACTIVE plan based on A1 back to
          DRAFT with plan_revision incremented (m3, caused by the supersession).
        test_recipe:
          setup:
            - "Case ACTIVE via assessment A1 (scores all 2) and plan P ACTIVE with basis_assessment_id == A1; a second DRAFT assessment A2 (scores all 4) created by mgr1 and submitted"
