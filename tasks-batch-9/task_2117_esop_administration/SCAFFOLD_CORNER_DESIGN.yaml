            - "EsopPlan.${plan_id}.plan_status == VALUATION_PENDING"
            - "EsopPlan.${plan_id}.version == 2"

      - name: frozen_plan_is_terminal_and_refuses_every_mutation
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EsopPlan.OPEN_to_FROZEN
          - validations[priority=7]
          - errors[ERR_PLAN_FROZEN]
        distinguishing_aspect: "Once FROZEN the plan accepts no further mutation: close-year, rollover, participant enrolment and a second freeze all return ERR_PLAN_FROZEN (409), while GET /plans/{plan_id} still succeeds."
        test_recipe:
          setup: ["One OPEN plan with one ACTIVE participant, frozen by the trustee."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
