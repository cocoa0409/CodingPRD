scaffold_corner_design:
- section: entities
  instances:
  - name: veteran_create_defaults_and_account_cascade
    claim_type: creation_defaults
    grounds:
    - entities.Veteran
    - entities.EntitlementAccount
    distinguishing_aspect: Creating a veteran without is_surviving_spouse defaults it false; an EntitlementAccount is cascade-created with basic
      3600000 and county 76655000.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Def
          ssn_last4: '2001'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vc1: $.data.id
      trigger:
      - call: GET /va-loans/veterans/${vc1}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vc1_spouse: $.data.is_surviving_spouse
          vc1_days: $.data.total_qualifying_service_days
          vc1_coe: $.data.has_issued_coe
      - call: GET /va-loans/veterans/${vc1}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          ac1_basic: $.data[0].basic_entitlement_cents
          ac1_bonus: $.data[0].remaining_with_bonus_cents
      assert:
      - Veteran.${vc1}.is_surviving_spouse == false (default applied)
      - Veteran.${vc1}.total_qualifying_service_days == 0
      - Veteran.${vc1}.has_issued_coe == false
      - Veteran.${vc1}.version == 1
      - EntitlementAccount[${vc1}].basic_entitlement_cents == 3600000
      - EntitlementAccount[${vc1}].remaining_with_bonus_cents == 19163750
  - name: veteran_create_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Veteran.fields.ssn_last4
    - errors[ERR_VALIDATION]
    distinguishing_aspect: Omitting required ssn_last4 fails with ERR_VALIDATION 400 before any persistence.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Miss
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          errc2: $.data.error_id
      assert:
      - status == 400
      - error_id == ERR_VALIDATION
  - name: veteran_create_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.Veteran.fields.character_of_discharge
    - errors[ERR_INVALID_ENUM]
    distinguishing_aspect: An undeclared enum member for character_of_discharge is rejected with ERR_INVALID_ENUM.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Enum
          ssn_last4: '2002'
          service_category: REGULAR_MILITARY
          character_of_discharge: EXEMPLARY
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          errc3: $.data.error_id
      assert:
      - status == 400
      - error_id == ERR_INVALID_ENUM
  - name: veteran_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_VETERAN_NOT_FOUND]
    distinguishing_aspect: GET on a random UUID yields ERR_VETERAN_NOT_FOUND 404 inside the standard error envelope.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /va-loans/veterans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          errc4: $.data.error_id
      assert:
      - status == 404
      - error_id == ERR_VETERAN_NOT_FOUND
  - name: service_period_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    - entities.ServicePeriod
    distinguishing_aspect: List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope.
    test_recipe:
      setup:
      - veteran vc5 with 3 service periods
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Page
          ssn_last4: '2003'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vc5: $.data.id
      - call: POST /va-loans/veterans/${vc5}/service-periods
        payload:
          branch: ARMY
          start_date: '2010-01-01'
          end_date: '2011-01-01'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vc5}/service-periods
        payload:
          branch: ARMY
          start_date: '2012-01-01'
          end_date: '2013-01-01'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vc5}/service-periods
        payload:
          branch: NAVY
          start_date: '2014-01-01'
          end_date: '2015-01-01'
          discharge_character: GENERAL
        as: LoanOfficer
        as_user_id: lo-1
      trigger:
      - call: GET /va-loans/veterans/${vc5}/service-periods?limit=2&offset=2
        as: LoanOfficer
        as_user_id: lo-1
      assert:
      - response_type == array; data has exactly 1 entry (offset 2 of 3 with limit 2)
      - 'meta/pagination: total_count == 3 and has_more == false'
      - third period is the NAVY GENERAL one (stable created_at ASC order)
  - name: loan_computed_fields_ignore_client_input
    claim_type: computed_fields
    grounds:
    - entities.Loan.fields.loan_amount_cents
    - entities.Loan.fields.loan_use
    distinguishing_aspect: 'loan_amount_cents and loan_use are computed: amount = price - down; FIRST_USE when the borrower has no charged loans.'
    test_recipe:
      setup:
      - veteran vc6 with ISSUED COE
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Comp
          ssn_last4: '2004'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vc6: $.data.id
      - call: POST /va-loans/veterans/${vc6}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vc6}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coec6: $.data.id
      - call: POST /va-loans/coe-requests/${coec6}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /va-loans/veterans/${vc6}/loans
        payload:
          coe_id: ${coec6}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 25000000
          down_payment_cents: 5000000
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loanc6_amt: $.data.loan_amount_cents
          loanc6_use: $.data.loan_use
          loanc6_dp: $.data.down_payment_pct
      assert:
      - Loan.loan_amount_cents == 20000000 (computed, not client-supplied)
      - Loan.loan_use == FIRST_USE
      - Loan.down_payment_pct == 20.0000
  - name: service_period_qualifying_days_inclusive_endpoints
    claim_type: computed_fields
    grounds:
    - entities.ServicePeriod.fields.qualifying_days
    - calculations.qualifying_service_days
    distinguishing_aspect: 'qualifying_days uses inclusive closed-interval counting: 2019-03-01..2019-06-30 = 122 days; DISHONORABLE period counts
      0.'
    test_recipe:
      setup:
      - veteran vc7
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Days
          ssn_last4: '2005'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vc7: $.data.id
      trigger:
      - call: POST /va-loans/veterans/${vc7}/service-periods
        payload:
          branch: ARMY
          start_date: '2019-03-01'
          end_date: '2019-06-30'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          sp7_days: $.data.qualifying_days
      - call: POST /va-loans/veterans/${vc7}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-01'
          end_date: '2020-12-31'
          discharge_character: DISHONORABLE
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          sp7b_days: $.data.qualifying_days
      assert:
      - first period qualifying_days == 122
      - DISHONORABLE period qualifying_days == 0
      - Veteran.${vc7}.total_qualifying_service_days == 122 (dishonorable period excluded)
  - name: audit_event_immutable_no_version
    claim_type: immutability
    grounds:
    - entities.AuditEvent
    distinguishing_aspect: 'AuditEvent has common_fields false: entries expose id and created_at but no version or updated_at, and no update endpoint
      exists.'
    test_recipe:
      setup:
      - one veteran created (produces an AuditEvent)
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Aud
          ssn_last4: '2006'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vc8: $.data.id
      trigger:
      - call: GET /va-loans/audit-events?entity_id=${vc8}
        as: ProgramAdmin
        as_user_id: admin-1
      assert:
      - exactly 1 AuditEvent for entity_id ${vc8} with action describing veteran creation
      - AuditEvent has id and created_at but no version field
      - actor_role == LoanOfficer and actor_user_id == lo-1
- section: state_machines
  instances:
  - name: coe_issued_terminal_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.CertificateOfEligibility
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: "From ISSUED (terminal) every action \u2014 issue, deny, reconsider \u2014 is rejected ERR_INVALID_STATE."
    test_recipe:
      setup:
      - veteran with an ISSUED COE coes1
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Term
          ssn_last4: '2007'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vs1: $.data.id
      - call: POST /va-loans/veterans/${vs1}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vs1}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coes1: $.data.id
      - call: POST /va-loans/coe-requests/${coes1}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /va-loans/coe-requests/${coes1}/deny
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          errs1a: $.data.error_id
      - call: POST /va-loans/coe-requests/${coes1}/reconsider
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          errs1b: $.data.error_id
      - call: POST /va-loans/coe-requests/${coes1}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          errs1c: $.data.error_id
      assert:
      - all three actions return 409 ERR_INVALID_STATE
      - CertificateOfEligibility.${coes1}.status == ISSUED (unchanged)
  - name: appraisal_value_issued_terminal_lockdown
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Appraisal
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: A VALUE_ISSUED appraisal rejects further submit-report calls with ERR_INVALID_STATE (terminal).
    test_recipe:
      setup:
      - loan with VALUE_ISSUED appraisal aprs2 by appraiser appT2
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V ApT
          ssn_last4: '2008'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vs2: $.data.id
      - call: POST /va-loans/veterans/${vs2}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vs2}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coes2: $.data.id
      - call: POST /va-loans/coe-requests/${coes2}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${vs2}/loans
        payload:
          coe_id: ${coes2}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 20000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loans2: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App T2
          region: SOUTH
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          appT2: $.data.id
      - call: POST /va-loans/loans/${loans2}/appraisal-requests
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          aprs2: $.data.id
      - call: POST /va-loans/appraisal-requests/${aprs2}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 20000000
        as: Appraiser
        as_user_id: ${appT2}
      trigger:
      - call: POST /va-loans/appraisal-requests/${aprs2}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 21000000
        as: Appraiser
        as_user_id: ${appT2}
        captures:
          errs2: $.data.error_id
      assert:
      - status == 409, error_id == ERR_INVALID_STATE
      - Appraisal.${aprs2}.appraised_value_cents == 20000000 (unchanged)
      - Appraisal.${aprs2}.report_round == 1 (unchanged)
  - name: close_idempotency_second_close_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.Loan
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Repeating close on an already-CLOSED loan fails ERR_INVALID_STATE; entitlement is charged exactly once.
    test_recipe:
      setup:
      - fully approved loan loans3 already CLOSED with charge 5000000 (price 20000000, 0 down)
      setup_api_calls:
      - call: POST /va-loans/veterans
        payload:
          full_name: V Idem
          ssn_last4: '2009'
          service_category: REGULAR_MILITARY
          character_of_discharge: HONORABLE
          receives_disability_compensation: false
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          vs3: $.data.id
      - call: POST /va-loans/veterans/${vs3}/service-periods
        payload:
          branch: ARMY
          start_date: '2020-01-10'
          end_date: '2022-06-15'
          discharge_character: HONORABLE
        as: LoanOfficer
        as_user_id: lo-1
      - call: POST /va-loans/veterans/${vs3}/coe-requests
        payload:
          entitlement_code: ERA_GULF
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          coes3: $.data.id
      - call: POST /va-loans/coe-requests/${coes3}/issue
        payload: {}
        as: ProgramAdmin
        as_user_id: admin-1
      - call: POST /va-loans/veterans/${vs3}/loans
        payload:
          coe_id: ${coes3}
          purpose: PURCHASE
          property_region: SOUTH
          purchase_price_cents: 20000000
          down_payment_cents: 0
          interest_rate_percent: 6.5
          rate_type: FIXED
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          loans3: $.data.id
      - call: POST /va-loans/appraisers
        payload:
          name: App T3
          region: SOUTH
        as: ProgramAdmin
        as_user_id: admin-1
        captures:
          appT3: $.data.id
      - call: POST /va-loans/loans/${loans3}/appraisal-requests
        payload: {}
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          aprs3: $.data.id
      - call: POST /va-loans/appraisal-requests/${aprs3}/submit-report
        payload:
          outcome: VALUE_ISSUED
          appraised_value_cents: 20000000
        as: Appraiser
        as_user_id: ${appT3}
      - call: POST /va-loans/loans/${loans3}/underwriting-decisions
        payload:
          gross_monthly_income_cents: 600000
          new_housing_payment_cents: 150000
          other_obligations_annual_cents: []
          family_size: 4
          region: SOUTH
        as: Underwriter
        as_user_id: uw-1
      - call: POST /va-loans/loans/${loans3}/close
        payload:
          closing_date: '2026-03-10'
          first_payment_due_date: '2026-05-01'
        as: LoanOfficer
        as_user_id: lo-1
      trigger:
      - call: POST /va-loans/loans/${loans3}/close
        payload:
          closing_date: '2026-03-11'
          first_payment_due_date: '2026-05-01'
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          errs3: $.data.error_id
      - call: GET /va-loans/veterans/${vs3}/entitlement-account
        as: LoanOfficer
        as_user_id: lo-1
        captures:
          acs3_charged: $.data[0].total_charged_cents
      assert:
      - 'second close: 409 ERR_INVALID_STATE'
      - EntitlementAccount.total_charged_cents == 5000000 (charged exactly once)
      - Loan.${loans3}.closing_date == 2026-03-10 (first close stands)
  - name: record_payoff_from_not_closed_invalid_state
    claim_type: invalid_transition
    grounds:
