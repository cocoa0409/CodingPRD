  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: agreement_volume_conserved_across_acknowledge_and_cancel
        grounds:
          - calculations.order_pricing
          - state_machines.ProjectOrder.SUBMITTED_to_ACKNOWLEDGED
          - state_machines.ProjectOrder.ACKNOWLEDGED_to_CANCELLED
          - entities.VolumeAgreement.fields.cumulative_volume_cents
        distinguishing_aspect: |
          Conserved quantity: money (agreement cumulative volume cents).
          Invariant: cumulative_volume_cents == sum of pre_discount_total_cents
          over that agreement's orders in {ACKNOWLEDGED, CLOSED}. Acknowledge
          debits +500000; its compensating cancel credits exactly -500000; two
          acknowledges and one cancel leave 500000 — zero drift.
        test_recipe:
          setup:
            - "agreement active; locked 4-chair configuration (pre-discount 500000 per order)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { o1: "$.data.id", o1v: "$.data.version" } }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { o2: "$.data.id", o2v: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${o1}/submit", payload: { expected_order_version: "${o1v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${o1}/acknowledge", as: ManufacturerAdmin }
            - { call: "GET /volume-agreements/${agr_id}", as: ManufacturerAdmin, captures: { cum1: "$.data.cumulative_volume_cents" } }
            - { call: "POST /project-orders/${o2}/submit", payload: { expected_order_version: "${o2v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${o2}/acknowledge", as: ManufacturerAdmin }
            - { call: "GET /volume-agreements/${agr_id}", as: ManufacturerAdmin, captures: { cum2: "$.data.cumulative_volume_cents" } }
            - { call: "POST /project-orders/${o1}/cancel", payload: { reason: "downsized" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "GET /volume-agreements/${agr_id}", as: ManufacturerAdmin, captures: { cum3: "$.data.cumulative_volume_cents" } }
          assert:
            - "after ack1: cumulative_volume_cents == 500000"
            - "after ack2: cumulative_volume_cents == 1000000"
            - "after cancel1: cumulative_volume_cents == 500000 (compensation exactly reverses the debit; invariant cumulative == sum of pre_discount over {ACKNOWLEDGED, CLOSED} orders holds)"

      - name: plant_capacity_conserved_across_reserve_and_cancel
        grounds:
          - calculations.plant_capacity_available
          - state_machines.InstallationPhase
          - state_machines.ProjectOrder.ACKNOWLEDGED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: manufacturing units (per plant-day), not money.
          Invariant: reserved(P,D) + available(P,D) == PLANT_DAILY_CAPACITY[P]
          (120 for PLANT_GR). Reserving 120 drives available to 0; the
          compensating order cancel restores exactly 120 — a retried
          reservation then succeeds.
        test_recipe:
          setup:
            - "two acknowledged orders on the same 4-chair configuration; order A phase reserves all 120 PLANT_GR units on 2026-11-02; order B phase (1 unit) already rejected"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
