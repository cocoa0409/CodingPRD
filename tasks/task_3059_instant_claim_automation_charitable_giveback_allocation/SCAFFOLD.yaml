    input: [treaty_id]
    output: Cohort
    side_effects: ["treaty attached; every ESCALATED claim in the cohort gets reinsurance_share_cents = round_half_up(reserve_cents * quota_share_pct); every PAID claim's reinsurance_share_cents recomputed likewise on payout_cents; cohort reinsurance_ceded_cents, retained_claims_*, giveback_* recomputed; increments Cohort.version by 1"]
  - method: POST
    path: "/cohorts/{id}/run-giveback"
    description: "Run the annual giveback allocation for a CLOSED cohort; returns the per-cause donation breakdown"
    roles: [FinanceOps]
    code: 200
    input: []
    output: { cohort_id: string, giveback_total_cents: integer, cause_allocations: array }
    side_effects: ["per-cause donation amounts computed per giveback_allocation; cohort status → DONATED"]
  - method: POST
    path: "/cohorts/{id}/close"
    description: "Close an OPEN cohort (e.g., at year boundary); closed cohorts accept no new binds or ledger entries"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Cohort
    side_effects: ["status → CLOSED"]

  # --- Policyholder ---
  - method: POST
    path: "/policyholders"
    description: "Register a policyholder"
    roles: [Anonymous]
    code: 201
    input: [email, full_name, state_code]
    output: Policyholder
    side_effects: ["status=ACTIVE; fraud_strike_count=0"]
  - method: GET
    path: "/policyholders/{id}"
    description: "Get a policyholder"
    roles: [Policyholder, PlatformAdmin, UnderwritingAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Policyholder
    side_effects: []
  - method: GET
    path: "/policyholders/{id}/applications"
    description: "List applications of a policyholder"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PolicyApplication[]
    side_effects: []

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Create a quote for the acting policyholder"
    roles: [Policyholder]
    code: 201
    input: [coverage_amount_cents, premium_cents]
    output: Quote
    side_effects: ["status=OPEN; expires_at = now + 30 days"]
  - method: GET
    path: "/quotes/{id}"
    description: "Get a quote"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: GET
    path: "/quotes/{id}/policies"
    description: "List policies bound from this quote (0 or 1)"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/policyholders/{id}/quotes"
    description: "List quotes of a policyholder"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: POST
    path: "/quotes/{id}/bind"
    description: "Straight-through conversational bind: binds an OPEN quote without human underwriting review, only when zero behavioral signals fired"
    roles: [Policyholder]
    code: 201
    input: [checkout_velocity_seconds, device_reuse_count, answers_ipa_acknowledged]
    output: Policy
    side_effects: ["behavioral signals computed; if behavioral_signal_count == 0 and quote not expired: quote → BOUND, Policy created in the OPEN cohort for the bind year with the state's ACTIVE FeeConfig, Policy.fraud_flag = false; if any signal fired: ERR_APPLICATION_AUTO_DECLINE_REQUIRED (no application row is created); expired quote: ERR_QUOTE_EXPIRED"]

  # --- PolicyApplication ---
  - method: POST
    path: "/applications"
    description: "Submit an application against a quote (behavioral signals captured)"
    roles: [Policyholder]
    code: 201
    input: [quote_id, checkout_velocity_seconds, device_reuse_count, answers_ipa_acknowledged]
    output: PolicyApplication
    side_effects: ["behavioral_signal_count computed; status=UNDER_REVIEW or auto-DECLINED"]
  - method: GET
    path: "/applications/{id}"
    description: "Get an application"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PolicyApplication
    side_effects: []
  - method: GET
    path: "/quotes/{id}/applications"
    description: "List applications against a quote"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PolicyApplication[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/approve"
    description: "Approve an application; binds the policy"
    roles: [UnderwritingAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: ["application → APPROVED; quote → BOUND; Policy created in the OPEN cohort for the bind year with the state's ACTIVE FeeConfig"]
  - method: POST
    path: "/applications/{id}/decline"
    description: "Decline an application"
    roles: [UnderwritingAdmin]
    code: 200
    input: []
    output: PolicyApplication
    side_effects: ["application → DECLINED; quote stays OPEN"]
  - method: POST
    path: "/applications/{id}/resubmit"
    description: "Policyholder re-opens a DECLINED application with corrected behavioral answers, returning it to UNDER_REVIEW"
    roles: [Policyholder]
    code: 200
    input: [checkout_velocity_seconds, device_reuse_count, answers_ipa_acknowledged]
    output: PolicyApplication
    side_effects: ["behavioral_signal_count recomputed from the new answers; status → UNDER_REVIEW unless signals >= FRAUD_HARD_THRESHOLD (stays DECLINED); quote must still be OPEN (else ERR_QUOTE_EXPIRED)"]

  # --- Policy ---
  - method: GET
    path: "/policies/{id}"
    description: "Get a policy"
    roles: [Policyholder, UnderwritingAdmin, ClaimsAdjuster, FinanceOps, PlatformAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/policyholders/{id}/policies"
    description: "List policies of a policyholder"
    roles: [Policyholder, UnderwritingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/cohorts/{id}/policies"
    description: "List policies in a cohort"
    roles: [PlatformAdmin, FinanceOps, UnderwritingAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: POST
    path: "/policies/{id}/cause-election"
    description: "Elect the charitable cause for a policy (OCC)"
    roles: [Policyholder]
    code: 200
    input: [cause_id, expected_policy_version]
    output: Policy
    side_effects: ["cause_id set; cause_election_version += 1; increments Policy.version by 1"]
  - method: POST
    path: "/policies/{id}/premium-payments"
    description: "Record a premium payment against the policy"
    roles: [FinanceOps]
    code: 201
    input: [amount_cents]
    output: PolicyLedgerEntry
    side_effects: ["fee split calculation; three ledger entries appended (returns PREMIUM_CHARGE entry); policy premium_paid/outstanding updated; cohort aggregates recomputed"]
  - method: POST
    path: "/policies/{id}/cancel"
    description: "Policyholder cancels the policy"
    roles: [Policyholder]
    code: 200
    input: []
    output: Policy
    side_effects: ["status → CANCELLED"]
  - method: POST
    path: "/policies/{id}/lapse"
    description: "Lapse a policy whose premium is outstanding past the grace period"
    roles: [FinanceOps]
    code: 200
    input: []
    output: Policy
    side_effects: ["status → LAPSED"]
  - method: GET
    path: "/policies/{id}/ledger"
    description: "List ledger entries for a policy"
    roles: [Policyholder, FinanceOps, PlatformAdmin]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: PolicyLedgerEntry[]
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "First notice of loss: video statement + automated triage + instant pay when clean and low-value"
    roles: [Policyholder]
    code: 201
    input: [policy_id, video_statement_ref, claimed_amount_cents, fraud_score]
    output: Claim
    side_effects: ["triage routing; on auto-approve: payment + ledger + cohort recompute in same request; on escalate: reserve set + cohort projection recompute"]
  - method: GET
    path: "/claims/{id}"
    description: "Get a claim"
    roles: [Policyholder, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List claims with filters"
    roles: [ClaimsAdjuster, PlatformAdmin, FinanceOps]
    code: 200
    input: ["policy_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/claims/{id}/payments"
    description: "List payments of a claim (0 or 1 entries)"
    roles: [Policyholder, ClaimsAdjuster, FinanceOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimPayment[]
    side_effects: []
  - method: GET
    path: "/claims/{id}/ledger"
    description: "List ledger entries associated with this claim (CLAIM_PAYOUT / CLAIM_PAYOUT_REVERSAL rows)"
    roles: [Policyholder, ClaimsAdjuster, FinanceOps, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: PolicyLedgerEntry[]
    side_effects: []
  - method: GET
    path: "/policies/{id}/claims"
    description: "List claims of a policy"
    roles: [Policyholder, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/approve"
    description: "Adjuster approves an ESCALATED claim with a payout (OCC)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [payout_cents, expected_claim_version]
    output: Claim
    side_effects: ["claim → PAID; payment; ledger; cohort recompute; increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/deny"
    description: "Adjuster denies an ESCALATED claim (OCC)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [denial_reason, expected_claim_version]
    output: Claim
    side_effects: ["claim → DENIED; reserve released; appeal_deadline set; FRAUD denial increments policyholder strike; increments Claim.version by 1"]
  - method: POST
    path: "/claims/{id}/appeals"
    description: "Policyholder appeals a DENIED claim"
    roles: [Policyholder]
    code: 201
    input: [statement]
    output: Appeal
    side_effects: ["appeal created PENDING; claim → APPEALED; appeal_count += 1"]

  # --- Appeal ---
  - method: GET
    path: "/appeals/{id}"
    description: "Get an appeal"
    roles: [Policyholder, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/claims/{id}/appeals"
    description: "List appeals of a claim"
    roles: [Policyholder, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{id}/uphold"
    description: "Uphold the denial (reviewer must differ from original denier)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [review_note]
    output: Appeal
    side_effects: ["appeal → UPHELD; claim → DENIED"]
  - method: POST
    path: "/appeals/{id}/overturn"
    description: "Overturn the denial and pay (reviewer must differ from original denier)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [payout_cents, review_note]
    output: Appeal
    side_effects: ["appeal → OVERTURNED; claim → PAID; payment + ledger + cohort recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum/number range" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for this endpoint, or ownership check failed (policyholder acting on another's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the entity's current version" }
  - { id: ERR_FILING_NOT_SUBMITTED, http: 409, condition: "Approve/reject attempted on a filing not in SUBMITTED" }
  - { id: ERR_RATE_FILING_NOT_APPROVED, http: 422, condition: "FeeConfig references a filing that is not APPROVED" }
  - { id: ERR_FLAT_FEE_VIOLATES_FILING, http: 422, condition: "Fee exceeds the governing filing cap (absolute-cents cap or pct-of-premium cap per filing_mode)" }
  - { id: ERR_FEE_CONFIG_ALREADY_ACTIVE, http: 409, condition: "Another ACTIVE FeeConfig exists for the state_code" }
  - { id: ERR_FEE_CONFIG_NOT_FOUND, http: 422, condition: "No ACTIVE FeeConfig for the policy's state at bind time" }
  - { id: ERR_TREATY_IN_USE, http: 409, condition: "Retire attempted on a treaty attached to a cohort" }
  - { id: ERR_COHORT_NOT_OPEN, http: 422, condition: "Bind requires a unique OPEN cohort for the bind year" }
  - { id: ERR_COHORT_CLOSED, http: 409, condition: "Operation requires an OPEN cohort (cause election, treaty attach)" }
  - { id: ERR_COHORT_NOT_CLOSED, http: 409, condition: "Giveback run requires cohort status CLOSED" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Quote EXPIRED or past expires_at at application submission" }
  - { id: ERR_POLICYHOLDER_DEBARRED, http: 422, condition: "Policyholder DEBARRED (3 fraud strikes); application or approve rejected" }
  - { id: ERR_APPLICATION_AUTO_DECLINE_REQUIRED, http: 422, condition: "Behavioral signals >= hard threshold; manual approve forbidden, application must be declined" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "FNOL or premium operation requires policy.status == ACTIVE" }
  - { id: ERR_PREMIUM_ALREADY_PAID, http: 422, condition: "premium_outstanding_cents == 0; further premium payments rejected" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "Appeal attempted after appeal_deadline" }
  - { id: ERR_APPEAL_LIMIT_REACHED, http: 409, condition: "appeal_count already at MAX_APPEALS_PER_CLAIM (1)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Appeal reviewer's X-User-ID equals the original denying adjuster's id" }
  - { id: ERR_CAUSE_NOT_ACTIVE, http: 422, condition: "Referenced cause is RETIRED or nonexistent for cohort creation / cause election" }
  - { id: ERR_LAPSE_GRACE_NOT_ELAPSED, http: 409, condition: "Lapse attempted before Policy.created_at + LAPSE_GRACE_DAYS (60)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated registration entry point"
    identity: opaque
    exclusive_operations:
      - "POST /policyholders"
    shared_operations: []

  - name: Policyholder
    description: "Insurance customer; owns quotes, applications, policies, claims, appeals"
    identity: "entity_backed:Policyholder"
    exclusive_operations:
      - "POST /quotes, /quotes/{id}/bind"
      - "POST /applications, /applications/{id}/resubmit"
      - "POST /policies/{id}/cause-election"
      - "POST /policies/{id}/cancel"
      - "POST /claims"
      - "POST /claims/{id}/appeals"
    shared_operations:
      - "GET own policyholder/quotes/applications/policies/claims/appeals/ledger"

  - name: UnderwritingAdmin
    description: "Manages rate filings, fee configs, and application decisions; never touches claims or giveback (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /rate-filings, /rate-filings/{id}/approve, /rate-filings/{id}/reject"
      - "POST /fee-configs, /fee-configs/{id}/update, /fee-configs/{id}/activate, /fee-configs/{id}/retire"
      - "POST /applications/{id}/approve, /applications/{id}/decline"
    shared_operations:
      - "GET rate-filings, fee-configs, cohorts, policies, quotes, applications, policyholders"

  - name: ClaimsAdjuster
    description: "Adjudicates escalated claims and reviews appeals; cannot configure fees or run giveback"
    identity: opaque
    exclusive_operations:
      - "POST /claims/{id}/approve, /claims/{id}/deny"
      - "POST /appeals/{id}/uphold, /appeals/{id}/overturn"
    shared_operations:
      - "GET claims, appeals, policies, cohorts, policyholders"

  - name: FinanceOps
    description: "Runs premium payments, reinsurance treaties, and the annual giveback"
    identity: opaque
    exclusive_operations:
      - "POST /reinsurance-treaties, /reinsurance-treaties/{id}/activate, /reinsurance-treaties/{id}/retire"
      - "POST /cohorts/{id}/reinsurance, /cohorts/{id}/run-giveback"
      - "POST /policies/{id}/premium-payments, /policies/{id}/lapse"
    shared_operations:
      - "GET cohorts, treaties, policies, rate-filings, claims"

  - name: PlatformAdmin
    description: "Platform operator: causes, cohorts, logical clock; read-mostly elsewhere"
    identity: opaque
    exclusive_operations:
      - "POST /causes, /causes/{id}/retire"
      - "POST /cohorts"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET most resources"
