            - { call: "GET /newsroom/slots/${slot_id}", payload: {}, as: NewsDirector, captures: { rc2: "$.data.reserved_count" } }
            - { call: "GET /newsroom/staff/${rep_id}", payload: {}, as: NewsDirector, captures: { ac2: "$.data.active_assignment_count" } }
          assert:
            - "rc1 == 1 (story held the reservation before activation)"
            - "bump_status == BUMPED and bump_link == ${ev_id} (hop 1: 22.00 < 60 and windows intersect)"
            - "s_status == ON_HOLD (hop 2: last active reporter assignment was bumped)"
            - "s_slot == null and rc2 == 0 (hop 3: leaving SCHEDULED released the slot)"
            - "ac2 == 0 (staff workload counter reconciled)"

