  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: qalicb_eligibility_status_cycles_pending_certified_failed_certified
        grounds:
          - state_machines.QALICB.eligibility_status.PENDING_to_CERTIFIED
          - state_machines.QALICB.eligibility_status.CERTIFIED_to_FAILED
          - state_machines.QALICB.eligibility_status.FAILED_to_CERTIFIED
          - entities.QALICB.fields.consecutive_failed_test_count
          - calculations.qalicb_eligibility_evaluation
        distinguishing_aspect: |
          Cycle shape on the QALICB entity: the row re-enters CERTIFIED after leaving it
          (PENDING -> CERTIFIED -> FAILED -> CERTIFIED), and the loop's termination condition is
          consecutive_failed_test_count, which the requalifying PASS resets to 0 — so a later
          single FAIL cannot jump straight to DISQUALIFIED.
        test_recipe:
          setup:
            - "One SEVERE census tract in MS and one QALICB in it, starting in eligibility_status PENDING."
            - "Logical clock stepped 2026-09-01 -> 2026-10-01 -> 2026-11-01 so the three tests have distinct performed_at values."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { test_pass_1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 48.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 6.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { test_fail_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 55.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 2.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
              captures: { test_pass_2_id: $.data.id }
          assert:
            - "EligibilityTest.${test_pass_1_id}.result == PASS and EligibilityTest.${test_pass_1_id}.failed_prongs == []"
            - "EligibilityTest.${test_fail_id}.result == FAIL"
            - "EligibilityTest.${test_fail_id}.failed_prongs == [\"GROSS_INCOME\", \"COLLECTIBLES\"] in exactly that order"
            - "EligibilityTest.${test_pass_2_id}.result == PASS"
            - "QALICB.${qalicb_id}.eligibility_status == CERTIFIED (re-entered after leaving)"
            - "QALICB.${qalicb_id}.consecutive_failed_test_count == 0"
            - "QALICB.${qalicb_id}.latest_test_result == PASS"
            - "QALICB.${qalicb_id}.last_certified_at == \"2026-11-01T00:00:00.000Z\""
            - "GET /nmtc/qalicbs/${qalicb_id}/eligibility-tests returns exactly 3 rows"

      - name: qei_deployment_and_compliance_dimensions_advance_independently
        grounds:
          - state_machines.QEI.deployment_status.DEPLOYING_to_REINVESTMENT_PENDING
          - state_machines.QEI.compliance_status.COMPLIANT_to_AT_RISK
          - state_machines.QEI.compliance_status.AT_RISK_to_COMPLIANT
          - state_machines.ReinvestmentObligation.OPEN_to_SATISFIED
          - calculations.substantially_all_percentage
        distinguishing_aspect: |
          Parallel state dimensions on a DIFFERENT entity from the QALICB cycle: the same QEI row
          carries deployment_status (driven by cash position) and compliance_status (driven by the
          qualifying ratio). A repayment moves the pair (DEPLOYING, COMPLIANT) ->
          (REINVESTMENT_PENDING, AT_RISK); the reinvestment then moves it to (DEPLOYING, COMPLIANT)
          rather than back to FULLY_DEPLOYED — the two dimensions do not mirror each other.
        test_recipe:
          setup:
            - "One ACTIVE award with substantially_all_method DIRECT_TRACING."
            - "One QEI of 100,000,000 cents issued 2026-09-01 (net deployable 95,000,000)."
            - "One QLICI of 85,000,000 cents deployed 2026-09-01, leaving 10,000,000 uninvested (deployment_status DEPLOYING, compliance_status COMPLIANT, direct ratio 89.47)."
            - "Logical clock advanced to 2026-12-01 for the repayment and 2026-12-15 for the reinvestment."
