              captures: { v0: $.data.version }
          trigger:
            - call: "POST /atl/loans/${loan}/renewals"
              payload: { expected_loan_version: "${v0}", new_term_months: 6 }
              as: LoanServicer
              captures: { np: $.data.new_principal_cents, ridx: $.data.renewal_index }
            - call: "GET /atl/loans/${loan}"
              payload: {}
              as: LoanServicer
              captures: { pb: $.data.principal_balance_cents }
          assert:
            - "Renewal.new_principal_cents == 600000 and Renewal.renewal_index == 1"
            - "Loan.principal_balance_cents == 600000"

      - name: declare_default_cascade_to_repo
        claim_type: cascading_side_effects
        grounds: [state_machines.Loan.DELINQUENT_to_DEFAULT, state_machines.Device.ENABLED_to_DISABLED]
        excluded_because:
          difficulty_instance: transitive_cascade / declare_default_to_repo_to_device_disable_depth3
          rationale: "Depth-3 default->repo->device cascade asserted by the named §1.8 instance."

      - name: vehicle_lien_state_reconciliation_on_origination
        claim_type: derived_field_reconciliation
        grounds: [entities.Vehicle.fields.lien_state, state_machines.LoanApplication.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "On application approval the collateral Vehicle.lien_state flips CLEAR -> ENCUMBERED as a derived consequence of loan origination."
        test_recipe:
          setup: ["CA vehicle CLEAR; application SUBMITTED"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "ve@x.com", full_name: "VE", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINVE0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-ve"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
          trigger:
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-ve"
            - call: "GET /atl/vehicles/${v}"
              payload: {}
              as: Underwriter
              captures: { ls: $.data.lien_state }
          assert:
            - "Vehicle.${v}.lien_state == ENCUMBERED"

  # ===================================================================
  # Consistency model — immediate
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_balance_visible_after_payment
        claim_type: immediate
        grounds: [entities.Loan.fields.principal_balance_cents, calculations.payment_allocation]
        distinguishing_aspect: "A REGULAR payment of 200000 on a clean loan is immediately reflected on the next GET /atl/loans/{id}: principal_balance_cents == 400000 (no eventual lag)."
        test_recipe:
          setup: ["CA clean loan principal 600000"]
          setup_api_calls:
            - call: "POST /atl/regulatory-profiles"
              payload: { state_code: "CA", max_apr_bps: 3600, max_ltv_bps: 5000, max_renewals: 2, min_term_months: 3, max_term_months: 24, redemption_grace_days: 10, valuation_basis: "AUCTION" }
              as: ComplianceAdmin
            - call: "POST /atl/borrowers"
              payload: { email: "im@x.com", full_name: "IM", state_code: "CA", monthly_income_cents: 500000 }
              as: Underwriter
              captures: { b: $.data.id }
            - call: "POST /atl/vehicles"
              payload: { borrower_id: "${b}", vin: "VINIM0001", year: 2019, make: "Mazda", model: "6", odometer_miles: 40000 }
              as: Appraiser
              captures: { v: $.data.id }
            - call: "POST /atl/appraisals"
              payload: { vehicle_id: "${v}", trade_in_value_cents: 2000000, auction_value_cents: 1600000, condition_grade: "GOOD" }
              as: Appraiser
              captures: { a: $.data.id }
            - call: "POST /atl/appraisals/${a}/finalize"
              payload: {}
              as: Appraiser
              as_user_id: "appr-im"
            - call: "POST /atl/applications"
              payload: { borrower_id: "${b}", appraisal_id: "${a}", requested_principal_cents: 600000, contract_apr_bps: 3600, term_months: 3 }
              as: Underwriter
              captures: { app: $.data.id }
            - call: "POST /atl/applications/${app}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw-im"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /atl/loans/${loan}/payments"
              payload: { amount_cents: 200000, payment_type: "REGULAR" }
              as: LoanServicer
            - call: "GET /atl/loans/${loan}"
              payload: {}
              as: LoanServicer
              captures: { pb: $.data.principal_balance_cents }
          assert:
            - "Loan.${loan}.principal_balance_cents == 400000"
