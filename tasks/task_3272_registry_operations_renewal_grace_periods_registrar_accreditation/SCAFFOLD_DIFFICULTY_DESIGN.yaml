  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: domain_create_gated_on_registrar_active_status
        grounds:
          - state_machines.Domain
          - validations[priority=8]
          - errors.ERR_REGISTRAR_NOT_ACTIVE
        distinguishing_aspect: "Domain -> Registrar dependency: POST /domains succeeds only while the sponsoring Registrar is ACTIVE; suspending the registrar (a different entity) flips the domain-create outcome without any change to the domain payload."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, registrar accredited (ACTIVE)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8501, legal_name: "Gate Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/domains"
              payload: { name: "gate-open", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_ok: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/suspend"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "gate-closed", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the create while ACTIVE succeeds (Domain.${dom_ok} exists, status ACTIVE)"
            - "the identical create after suspension is rejected 409 with error_id == ERR_REGISTRAR_NOT_ACTIVE"

      - name: transfer_request_gated_on_domain_lock_status
        grounds:
          - state_machines.Domain.ACTIVE_to_TRANSFERRING
          - errors.ERR_DOMAIN_LOCKED
        distinguishing_aspect: "Transfer -> Domain dependency (a different pair than Domain -> Registrar): POST /transfers is gated on the target Domain's lock_status dimension — a REGISTRY_LOCK engaged by RegistryAdmin blocks the gaining registrar's transfer request even though the Transfer entity itself is untouched."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A and B ACTIVE, domain created by A at 2026-01-02. Clock 2026-03-10 (window open). RegistryAdmin engages REGISTRY_LOCK."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8502, legal_name: "Lock Registrar A", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8503, legal_name: "Lock Registrar B", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registry/registrars/${reg_a}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_b}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "locked-gate", registrar_id: "${reg_a}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { dom_id: $.data.id, dom_v: $.data.version }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/domains/${dom_id}/lock"
              payload: { lock_action: "REGISTRY_LOCK", expected_domain_version: "${dom_v}", lock_token: "s3cret" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_b}" }
              as: RegistrarOperator
              as_user_id: "${reg_b}"
              captures: { err: $.data.error_id }
          assert:
            - "the transfer request is rejected 409 with error_id == ERR_DOMAIN_LOCKED"
            - "Domain.${dom_id}.status remains ACTIVE (no TRANSFERRING flip) and registrar_id unchanged"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: second_pending_transfer_overlaps_in_flight_transfer
        grounds:
          - state_machines.Domain.ACTIVE_to_TRANSFERRING
          - errors.ERR_TRANSFER_ALREADY_PENDING
        distinguishing_aspect: "Point-instant interval semantics on the Transfer resource: the domain's transfer window [requested_at, resolution) is a half-open occupation — a second request while the first is REQUESTED collides even though no clock overlap of 'sessions' exists; the occupation ends only at a terminal Transfer state."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A, B, C ACTIVE, domain by A at 2026-01-02, clock 2026-03-10, transfer to B already REQUESTED."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 8601, legal_name: "Overlap A", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8602, legal_name: "Overlap B", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_b: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8603, legal_name: "Overlap C", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_c: $.data.id }
            - call: "POST /registry/registrars/${reg_a}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_b}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_c}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "overlap-domain", registrar_id: "${reg_a}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_a}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_b}" }
              as: RegistrarOperator
              as_user_id: "${reg_b}"
              captures: { xfer_b: $.data.id }
          trigger:
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_c}" }
              as: RegistrarOperator
              as_user_id: "${reg_c}"
              captures: { err: $.data.error_id }
            - call: "POST /registry/transfers/${xfer_b}/nack"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_a}"
            - call: "POST /registry/transfers"
              payload: { domain_id: "${dom_id}", to_registrar_id: "${reg_c}" }
              as: RegistrarOperator
              as_user_id: "${reg_c}"
              captures: { xfer_c: $.data.id }
          assert:
            - "the second request while the first is pending is rejected 409 ERR_TRANSFER_ALREADY_PENDING"
            - "after the NACK (occupation released), the retry to registrar C succeeds: Transfer.${xfer_c}.status == REQUESTED"

      - name: price_schedule_effectiveness_windows_partition_time
        grounds:
          - state_machines.PriceSchedule.PROPOSED_to_EFFECTIVE
          - calculations.lifecycle_invoice
        distinguishing_aspect: "Half-open calendar-window semantics on the PriceSchedule resource (different from the point-instant transfer occupation): effectiveness windows are [effective_on, next effective_on) with adjacency allowed — an invoice minted exactly at the boundary instant belongs to the NEW schedule, and the old schedule's window ends with no gap and no overlap."
        test_recipe:
          setup:
            - "Clock 2026-01-01. Schedule S1 (create 700) effective 2026-01-01; schedule S2 (create 750, within cap) announced 2026-01-01 with effective_on 2026-07-01 (>180 days notice). Registrar ACTIVE."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
              captures: { s1: $.data.id }
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 750, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-12-31T00:00:00Z", supersedes_schedule_id: "${s1}" }
              as: RegistryAdmin
              captures: { s2: $.data.id }
            - call: "POST /registry/registrars"
              payload: { iana_number: 8604, legal_name: "Window Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-30T23:59:59Z" }
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "before-boundary", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_before: $.data.id }
          trigger:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "at-boundary", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_at: $.data.id }
            - call: "GET /registry/invoices"
              payload: { domain_id: "${dom_before}", kind: "CREATE" }
              as: RegistryFinance
              captures: { inv_before_sched: "$.data[0].price_schedule_id" }
            - call: "GET /registry/invoices"
              payload: { domain_id: "${dom_at}", kind: "CREATE" }
              as: RegistryFinance
              captures: { inv_at_sched: "$.data[0].price_schedule_id", inv_at_base: "$.data[0].base_cents" }
          assert:
            - "the pre-boundary CREATE invoice references schedule ${s1} with base_cents == 700"
            - "the boundary-instant CREATE invoice references schedule ${s2} with base_cents == 750 — the boundary instant belongs to the new window"
            - "PriceSchedule.${s1}.status == SUPERSEDED and PriceSchedule.${s2}.status == EFFECTIVE after the clock advance"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: auto_renew_and_lapse_leave_ledger_net_zero
        grounds:
          - state_machines.Domain.ACTIVE_to_AUTO_RENEW_GRACE
          - state_machines.Domain.AUTO_RENEW_GRACE_to_REDEMPTION_GRACE
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: "Conserved quantity: registrar ledger balance. The forward auto-renew debit (-850) paired with the lapse-triggered VOID_CREDIT (+850) leaves sum(LedgerEntry.amount_cents) for the registrar unchanged versus before expiry — and Domain.expires_on also returns to its pre-auto-renew value."
        test_recipe:
          setup:
