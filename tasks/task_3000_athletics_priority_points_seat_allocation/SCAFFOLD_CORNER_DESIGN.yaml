              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 2000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Bot Sum", email: "bot.sum@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
