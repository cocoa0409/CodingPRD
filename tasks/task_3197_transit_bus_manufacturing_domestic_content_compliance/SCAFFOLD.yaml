  - method: GET
    path: "/api/parts-stocks"
    description: "List parts stocks with FK filters (agency_id, component_id)"
    roles: [PlatformAdmin, WarrantyAdmin, AgencyAdmin]
    code: 200
    input: ["agency_id?", "component_id?", "status?", "limit?", "offset?"]
    output: PartsStock[]
    side_effects: []

  - method: GET
    path: "/api/training-sessions"
    description: "List training sessions with agency filter"
    roles: [PlatformAdmin, WarrantyAdmin, AgencyAdmin]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or unknown enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine has no transition for this trigger from the current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contract_version does not match current Contract.version on OCC-guarded write" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same user id attempted both sides of a segregated step (submit/verify, approve/pay, issue/audit)" }
  - { id: ERR_DOMESTIC_CONTENT_BELOW_THRESHOLD, http: 422, condition: "Federally funded bus lacks ISSUED certificate with domestic_content_pct >= threshold_pct at plant-inspection submission" }
  - { id: ERR_CERTIFICATE_MISSING, http: 422, condition: "Bus has no ISSUED ComplianceCertificate where one is required" }
  - { id: ERR_ACCESSIBILITY_SAFETY, http: 422, condition: "Federally funded bus engineered on a configuration whose accessibility_features lack WHEELCHAIR_LIFT" }
  - { id: ERR_SCHEDULE_CONFLICT, http: 409, condition: "Production slot interval overlaps another slot on the same line, or training session collides on agency+calendar-date" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violated: agency_code, serial_number, ISSUED certificate per bus, (agency_id, component_id) stock pair" }
  - { id: ERR_DEADLINE_PASSED, http: 422, condition: "Action attempted after its deadline (option exercise, training cancel, warranty window)" }
  - { id: ERR_AUDIT_INCOMPLETE, http: 409, condition: "Contract activation attempted without a COMPLETED PASS PRE_AWARD audit" }
  - { id: ERR_AUDIT_PRECONDITION, http: 422, condition: "Audit completion preconditions unmet (unverified propulsion docs, auditor/issuer collision, buses out of scope state)" }
  - { id: ERR_KIT_INCOMPLETE, http: 409, condition: "start-production attempted while slot kit_status == NOT_KITTED" }
  - { id: ERR_PRODUCTION_NOT_KITTED, http: 409, condition: "start-production attempted before the linked PartsKit reached COMPLETE (kit_status still NOT_KITTED)" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Referenced entity missing or in unusable state (non-FROZEN config, unknown component id)" }
  - { id: ERR_FISCAL_VIOLATION, http: 422, condition: "Non-positive quantity/price/claim amount or stock quantity below reserved" }
  - { id: ERR_AGENCY_SUSPENDED, http: 409, condition: "Contract creation attempted for a SUSPENDED agency" }
  - { id: ERR_REVIEW_LOOP_EXHAUSTED, http: 409, condition: "Warranty claim attempted second APPROVED -> UNDER_REVIEW revision" }
  - { id: ERR_INSPECTION_DEFECTS_REQUIRED, http: 400, condition: "FAIL inspection recorded with empty defects list" }
  - { id: ERR_VALIDATION, http: 422, condition: "Catch-all business validation failure not otherwise classified" }

roles:
  - name: PlatformAdmin
    description: "Manufacturer platform operator; owns clock and agency onboarding"
    identity: "opaque"
    exclusive_operations: ["POST /api/_clock/set_current_utc", "POST /api/agencies"]
    shared_operations: ["all GET endpoints"]
  - name: ProcurementOfficer
    description: "Manufacturer contracting officer; owns contract lifecycle and option exercise"
    identity: "opaque"
    exclusive_operations: ["POST /api/contracts", "POST /api/contracts/{id}/award", "POST /api/contracts/{id}/activate", "POST /api/contracts/{id}/complete", "POST /api/contracts/{id}/terminate", "POST /api/option-orders/{id}/exercise", "POST /api/bus-units/{id}/record-payment"]
    shared_operations: ["GET contract/agency/bus endpoints"]
  - name: ConfigEngineer
    description: "Bus configuration engineer; owns configuration lifecycle and bus engineering"
    identity: "opaque"
    exclusive_operations: ["POST /api/bus-configurations", "POST /api/bus-configurations/{id}/submit-review", "POST /api/bus-configurations/{id}/freeze", "POST /api/bus-configurations/{id}/return-to-draft", "POST /api/bus-configurations/{id}/obsolete", "POST /api/bus-units/{id}/engineer"]
    shared_operations: ["GET configuration/bus endpoints"]
  - name: ComplianceOfficer
    description: "Domestic content compliance officer; issues certificates and verifies supplier docs"
    identity: "opaque"
    exclusive_operations: ["POST /api/components/{id}/verify-docs", "POST /api/components/{id}/reject-docs", "POST /api/bus-units/{id}/compliance-certificates", "POST /api/compliance-certificates/{id}/revoke"]
    shared_operations: ["POST /api/components", "GET component/certificate endpoints"]
  - name: SupplierRep
    description: "Supplier representative; submits component origin documentation. X-User-ID is the supplier operator id recorded as the submitter for segregation-of-duties checks"
    identity: "opaque"
    exclusive_operations: ["POST /api/components/{id}/supplier-docs"]
    shared_operations: ["GET component endpoints"]
  - name: Auditor
    description: "Independent pre-award / post-delivery auditor"
    identity: "opaque"
    exclusive_operations: ["POST /api/audit-records", "POST /api/audit-records/{id}/findings", "POST /api/audit-records/{id}/complete"]
    shared_operations: ["GET audit/contract/component endpoints"]
  - name: ProductionPlanner
    description: "Plant production planner; owns slots, kits, bus build and delivery"
    identity: "opaque"
    exclusive_operations: ["POST /api/bus-units", "POST /api/production-slots", "POST /api/production-slots/{id}/assign", "POST /api/production-slots/{id}/start-production", "POST /api/production-slots/{id}/complete-production", "POST /api/production-slots/{id}/cancel", "POST /api/parts-kits", "POST /api/bus-units/{id}/submit-plant-inspection", "POST /api/bus-units/{id}/deliver"]
    shared_operations: ["GET slot/kit/bus endpoints"]
  - name: AgencyInspector
    description: "Agency inspector performing plant and delivery acceptance inspections"
    identity: "opaque"
    exclusive_operations: ["POST /api/inspection-records", "POST /api/bus-units/{id}/accept"]
    shared_operations: ["GET bus/inspection endpoints"]
  - name: WarrantyAdmin
    description: "Warranty administrator; owns claims, training sessions, parts stock"
    identity: "opaque"
    exclusive_operations: ["POST /api/warranty-claims/{id}/start-review", "POST /api/warranty-claims/{id}/approve", "POST /api/warranty-claims/{id}/deny", "POST /api/warranty-claims/{id}/pay", "POST /api/warranty-claims/{id}/close", "POST /api/training-sessions", "POST /api/training-sessions/{id}/complete", "POST /api/training-sessions/{id}/cancel", "POST /api/parts-stocks", "PATCH /api/parts-stocks/{id}"]
    shared_operations: ["POST /api/warranty-claims", "GET claim/stock/training endpoints"]
  - name: AgencyAdmin
    description: "Agency administrator; manages own agency profile and files warranty claims"
    identity: "entity_backed:Agency"
    exclusive_operations: ["PATCH /api/agencies/{id}"]
    shared_operations: ["POST /api/warranty-claims", "GET agency/bus/claim endpoints"]
