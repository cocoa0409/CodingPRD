            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/start"
              payload: { expected_job_version: "${job_v2}" }
              as: ScheduleCoordinator
              captures: { job_v3: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jobs/${job_id}/adjourn"
              payload: { expected_job_version: "${job_v3}" }
              as: ScheduleCoordinator
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "STANDARD", certified_copy: true, estimated_pages: 30 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { to_id: $.data.id }
          trigger:
