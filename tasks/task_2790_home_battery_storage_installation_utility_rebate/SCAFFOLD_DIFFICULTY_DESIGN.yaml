  - rule_id: non_linear_state_machine
    instances:
      - name: permit_corrections_cycle_returns_to_submitted_then_issues
        grounds:
          - state_machines.Permit.SUBMITTED_to_CORRECTIONS_REQUIRED
          - state_machines.Permit.CORRECTIONS_REQUIRED_to_SUBMITTED
          - state_machines.Permit.SUBMITTED_to_ISSUED
          - entities.Permit.fields.correction_round_count
          - errors[ERR_PERMIT_CORRECTION_LIMIT]
        distinguishing_aspect: |
          The Permit machine re-enters SUBMITTED from CORRECTIONS_REQUIRED, so SUBMITTED is reachable twice
          in one lifecycle and correction_round_count (not the status) is what distinguishes the two visits —
          after one round trip the permit is ISSUED with correction_round_count == 1, never 0 or 2.
        test_recipe:
          setup:
