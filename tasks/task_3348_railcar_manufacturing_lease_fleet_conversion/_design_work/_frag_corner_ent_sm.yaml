          difficulty_instance: boundary_precision_check / boundary_component_stock_exact_vs_one_short
          rationale: "The on_hand_qty >= qty_per_car * quantity boundary is asserted as that §1.8 instance's success/failure pair (exactly 10 commits the stock, 9 returns ERR_COMPONENT_SHORTAGE), so the entity-side range claim is already realised."

      - name: car_assignment_mileage_allowance_boundary_covered_by_1_8
        claim_type: Type Constraints
        grounds:
          - entities.CarAssignment.fields.mileage_allowance
          - entities.CarReturn.fields.mileage_overage_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_mileage_allowance_exact_vs_one_mile_over
          rationale: "The mileage_allowance >= 0 range and its max(0, mileage_used - included_miles) clamp are asserted as that §1.8 instance's mileage_used 1000 vs 1001 pair (overage 0 vs 12), so the entity-side boundary claim is already realised."

      - name: lease_fleet_car_retained_creation_cascade_covered_by_1_8
        claim_type: Creation
        grounds:
          - entities.LeaseFleetCar.fields.acquisition_cost_cents
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade / retained_completion_fleet_capital_cascade
          rationale: "The retained-completion car creation with acquisition_cost_cents 660000 per car and its downstream capital hop is asserted end-to-end by that §1.8 instance, which also pins the 2 x 660000 count."

      - name: lease_contract_capital_allocation_variants_covered_by_1_8
        claim_type: Computed Fields
        grounds:
          - entities.LeaseContract.fields.capital_allocation_cents
          - calculations.lease_fleet_capital_allocation
        excluded_because:
          difficulty_instance: dual_variant_calc / capital_allocation_retained_vs_sold_basis
          rationale: "Both treatments of capital_allocation_cents (5480000 under retained_basis vs unchanged under sold_basis) are asserted by that §1.8 instance, so the computed-field claim is already realised."

      - name: car_return_settlement_status_gate_covered_by_1_8
        claim_type: Computed Fields
        grounds:
          - entities.CarReturn.fields.settlement_status
          - validations[priority=23]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settle_returns_gated_on_car_return_settlement
          rationale: "The PENDING -> SETTLED gate that must clear before the car leaves UNDER_REPAIR is asserted as that §1.8 instance's ERR_UNSETTLED_RETURNS failure and its subsequent success path."

  - section: state_machines
    instances:
      - name: production_order_complete_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
          - entities.ProductionOrder.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /production-orders/{id}/complete issued on a DRAFT order — a from-state the declared IN_PRODUCTION_to_COMPLETED transition never admits — returns 409 ERR_INVALID_STATE and leaves status DRAFT with completed_qty 0 and the version unbumped."
        test_recipe:
          setup:
            - "Empty DB; one DRAFT order exists that has never been component-reserved."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
          trigger:
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1 }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "POST /production-orders/${po_id}/complete from DRAFT returns HTTP 409"
            - "error_id == \"ERR_INVALID_STATE\""
            - "ProductionOrder.${po_id}.status == \"DRAFT\" (unchanged)"
            - "ProductionOrder.${po_id}.completed_qty == 0 (no side effect fired)"
            - "ProductionOrder.${po_id}.version == ${po_v} (unchanged)"

      - name: production_order_cancel_twice_second_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.ProductionOrder.DRAFT_to_CANCELLED
          - entities.ProductionOrder.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling a DRAFT order succeeds once and the identical second POST /production-orders/{id}/cancel returns 409 ERR_INVALID_STATE, leaving status CANCELLED — the trigger is not idempotent at the API level."
        test_recipe:
          setup:
            - "Empty DB; one DRAFT order exists."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "BOX-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 25, line_count_family: "LINE-A" }
              as: ProductionPlanner
              captures: { ct_box_id: $.data.id }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_box_id}", quantity: 1, planned_shop_days: 10, disposition: "SOLD", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-11-30" }
              as: ProductionPlanner
              captures: { po_id: $.data.id, po_v: $.data.version }
          trigger:
            - call: "POST /api/v1/production-orders/${po_id}/cancel"
              payload: { reason: "customer withdrew" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/cancel"
              payload: { reason: "customer withdrew" }
              as: ProductionPlanner
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/production-orders/${po_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the first POST /production-orders/${po_id}/cancel returns HTTP 200 with status CANCELLED"
            - "the second identical POST returns HTTP 409"
            - "error_id == \"ERR_INVALID_STATE\""
            - "ProductionOrder.${po_id}.status == \"CANCELLED\" (unchanged by the second attempt)"
            - "ProductionOrder.${po_id}.version == ${po_v} + 1 (bumped only by the successful cancel)"

      - name: production_order_complete_after_completed_already_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ProductionOrder.IN_PRODUCTION_to_COMPLETED
          - validations[priority=6]
          - entities.ProductionOrder.fields.status
        distinguishing_aspect: "COMPLETED is a declared terminal state and POST /production-orders/{id}/complete is one of §1.4 priority 6's three listed endpoints, so a repeat complete returns 409 ERR_ALREADY_TERMINAL and creates no second LeaseFleetCar."
        test_recipe:
          setup:
            - "Empty DB; one RETAINED order driven all the way to COMPLETED, which already minted its single fleet car."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
