      - name: offer_issue_before_the_waterfall_is_rejected_at_priority_34
        claim_type: priority_ordering
        grounds:
          - validations[priority 34]
          - validations[priority 73]
          - errors[ERR_TIERS_NOT_ALLOCATED]
          - entities.Festival.fields.tiers_allocated
        distinguishing_aspect: |
          The tiers exist but allocate-tiers has never run, so allocation_cents is 0 on
          every tier and the guarantee also breaks the ceiling. Two rules are violated
          by one request and priority 34 must win: the response is
          ERR_TIERS_NOT_ALLOCATED (409), never ERR_GUARANTEE_CEILING_EXCEEDED (422),
          and after the waterfall runs the identical issue call succeeds.
        test_recipe:
          setup:
            - "Festival with three tiers created but tiers_allocated still false, one flagship stage, Nova Kade, one DRAFT offer at guarantee 1800000."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
