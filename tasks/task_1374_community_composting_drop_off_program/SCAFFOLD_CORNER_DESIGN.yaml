scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, defaults, computed fields, not-found, etc.
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_defaults
        claim_type: defaults
        grounds:
          - entities.Program.fields.posture_contam_threshold
          - entities.Program.fields.diversion_credit_rate
        distinguishing_aspect: "Creating a Program without posture_contam_threshold/posture_complaint_threshold/diversion_credit_rate applies defaults 3/2/1.0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "PD", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { pct: $.data.posture_contam_threshold, plct: $.data.posture_complaint_threshold, rate: $.data.diversion_credit_rate, status: $.data.status }
          assert:
            - "pct == 3"
            - "plct == 2"
            - "rate == 1.0"
            - "status == DRAFT"

      - name: site_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints."GET /programs/{programId}/sites/{siteId}"
        distinguishing_aspect: "GET with a random UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: drop_event_computed_provisional_net
        claim_type: computed_fields
        grounds:
          - entities.DropEvent.fields.provisional_net_kg
          - calculations.drop_provisional_net_kg
        distinguishing_aspect: "provisional_net_kg is computed as round(gross − contamination, 2); any client-supplied provisional_net_kg would be ignored (field is source:computed)."
        test_recipe:
          setup: ["Program ACTIVE; site OPERATIONAL with agreement and material; participant with grant"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 7.50, contamination_kg: 2.25, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { drop_id: $.data.id, pnet: $.data.provisional_net_kg }
          assert:
            - "pnet == 5.25"
            - "DropEvent.verification_state == PENDING_AUDIT and credit_state == UNCREDITED"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Site.fields.capacity_kg
        distinguishing_aspect: "POST /programs/{id}/sites missing capacity_kg → ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: participant_immutable_no_put
        claim_type: immutability
        grounds:
          - entities.DistributionAllocation
          - entities.DiversionReport
        distinguishing_aspect: "DistributionAllocation and DiversionReport have common_fields: false — they carry no version field and expose no PUT/PATCH endpoint."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}/diversion-reports"
              payload: {}
              as: MunicipalAuditor
          assert:
            - "Returns 200 with empty list — confirms DiversionReport exists as a resource but exposes no mutation endpoint beyond create/certify (no PUT/PATCH declared in §1.5)"

  # ===========================================================================
  # Section: state_machines — valid/invalid transitions, initial, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: participant_initial_state_pending_verify
        claim_type: initial_state
        grounds:
          - state_machines.Participant
        distinguishing_aspect: "Newly registered Participant starts in PENDING_VERIFY; drops before verify fail."
        test_recipe:
          setup: ["Program ACTIVE; site OPERATIONAL with agreement/material"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_status: $.data.status }
          assert:
            - "part_status == PENDING_VERIFY"

      - name: complaint_terminal_close_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ComplaintTicket
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CLOSED ComplaintTicket rejects further resolve/reopen attempts with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Complaint RESOLVED; one ops run elapsed; complaint CLOSED"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints"
              payload: { reporter_contact: "n1", kind: "ODOR", description: "smell", reported_at: "2026-08-01T09:00:00Z" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/resolve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/run_ops"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/resolve"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (CLOSED is terminal)"

      - name: route_stop_collect_requires_dispatched_route
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RouteStop.SCHEDULED_to_COLLECTED
          - errors[ERR_ROUTE_NOT_DISPATCHED]
        distinguishing_aspect: "Collect on a stop of a PLANNED (not dispatched) route fails ERR_ROUTE_NOT_DISPATCHED."
        test_recipe:
          setup: ["Route PLANNED with one SCHEDULED stop"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/partners"
              payload: { name: "PP", intake_capacity_kg_per_day: 10000, yield_ratio: 0.5, contamination_reject_threshold_pct: 25.0 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes"
              payload: { route_code: "R1", vehicle_capacity_kg: 5000, processing_partner_id: "${partner_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: RouteOperator
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops"
              payload: { site_id: "${site_id}", planned_pickup_kg: 10, stop_sequence: 1, expected_route_version: "${route_v}" }
              as: RouteOperator
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops/${stop_id}/collect"
              payload: { actual_pickup_kg: 10.00 }
              as: RouteOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ROUTE_NOT_DISPATCHED"

      - name: invalid_transition_reject_on_pending_drop
        claim_type: invalid_transition
        grounds:
          - state_machines.DropEvent
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reject on a PENDING_AUDIT drop (not FLAGGED_CONTAMINATED) is not a declared transition → ERR_INVALID_STATE."
        test_recipe:
          setup: ["Drop in PENDING_AUDIT"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 5.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { drop_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops/${drop_id}/reject"
              payload: {}
              as: SiteHost
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (reject only valid from FLAGGED_CONTAMINATED)"

      - name: program_activate_requires_operational_site
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Program.DRAFT_to_ACTIVE
          - errors[ERR_PROGRAM_NO_OPERATIONAL_SITE]
        distinguishing_aspect: "Program activate with zero OPERATIONAL sites fails ERR_PROGRAM_NO_OPERATIONAL_SITE."
        test_recipe:
          setup: ["Program DRAFT with a site still ONBOARDING; material exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROGRAM_NO_OPERATIONAL_SITE"

  # ===========================================================================
  # Section: calculations — correct results, input-set filtering, boundaries
  # ===========================================================================
  - section: calculations
    instances:
      - name: diversion_report_empty_window_zero_division
        claim_type: correct_result
        grounds:
          - calculations.diversion_net_kg
        distinguishing_aspect: "DiversionReport over an empty window: gross=0 → diversion_rate_pct pinned to 0 (not divide-by-zero)."
        test_recipe:
          setup: ["Program ACTIVE with no drops in the window"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/diversion-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", method: "PROVISIONAL_NET" }
              as: MunicipalAuditor
              captures: { rep_id: $.data.id }
          assert:
            - "DiversionReport.${rep_id}.gross_diverted_kg == 0"
            - "DiversionReport.${rep_id}.diversion_rate_pct == 0"

      - name: material_season_wrap_around_window
        claim_type: correct_result
        grounds:
          - calculations.material_season_window
        distinguishing_aspect: "Season window 11-01 → 03-31 wraps the year boundary: a drop on 2026-12-15 accepted; on 2026-06-15 rejected with ERR_MATERIAL_NOT_ACCEPTED."
        test_recipe:
          setup: ["Program ACTIVE; site OPERATIONAL; material YARD with wrap window 11-01..03-31; participant with grant; clock at 2026-08-01"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "YARD", description: "yard waste", accepted_start_month_day: "11-01", accepted_end_month_day: "03-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv_aug: $.data.version }
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 5.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv_aug}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { err_aug: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
