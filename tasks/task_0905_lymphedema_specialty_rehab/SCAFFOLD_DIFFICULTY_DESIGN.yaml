          - entities.Session.fields.therapist_id
        distinguishing_aspect: "A second session for the same therapist starting 10 minutes after the first ends is rejected with ERR_THERAPIST_DOUBLE_BOOKED — half-open intervals with a 15-minute buffer on the Therapist resource."
        test_recipe:
