              as: CityAdmin
              captures: { plan1_status: $.data.status }
          assert:
            - "Second create with the stale version: error_id == ERR_STALE_VERSION (412)"
            - "Re-reading the request and retrying with the fresh version succeeds (201)"
            - "The successful retry superseded plan 1: plan1.status == WITHDRAWN"

      - name: occ_stale_version_on_ranking_republish
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[ranking-publish-stale-cycle]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Re-publish OCC: after a first publication bumps the cycle version, a re-publication carrying the pre-publication expected_funding_cycle_version fails with ERR_STALE_VERSION; retrying with the current version succeeds and re-runs the waterfall over the re-entered waitlist pool."
        test_recipe:
          setup:
            - "Two eligible requests (both score 60; R2 created after R1); cycle budget 11000 fits only rank 1 (10750) so R2 is WAITLISTED"
            - "Cycle published once (version advanced from cyc_v0 to cyc_v1)"
