            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "CORR is a registered mark, exhibit A attached.", evidence_count: 1, similarity_claim: "IDENTICAL" }
