              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "GET /network/originators/${o1}"
              payload: {}
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { ov: $.data.version }
          trigger:
            - call: "PATCH /network/originators/${o1}/exposure-limit"
              payload: { exposure_limit_cents: 5000000, expected_originator_version: "${ov}" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { ov2: $.data.version, lim2: $.data.exposure_limit_cents }
            - call: "PATCH /network/originators/${o1}/exposure-limit"
              payload: { exposure_limit_cents: 6000000, expected_originator_version: "${ov}" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "the first PATCH succeeds: exposure_limit_cents == 5000000 and version advanced ${ov} -> ${ov2} (= 2 -> 3)"
            - "the second PATCH replaying version ${ov} fails 412 with ERR_STALE_VERSION; the limit remains 5000000"

