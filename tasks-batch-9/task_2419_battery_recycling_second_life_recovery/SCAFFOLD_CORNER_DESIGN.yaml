      - name: replumbing_a_line_is_blocked_while_a_campaign_runs_on_it
        claim_type: conditional_action
        grounds:
          - endpoints[POST /recycling/processing-lines/{line_id}/replumb]
          - errors[ERR_LINE_HAS_RUNNING_CAMPAIGN]
          - entities.ProcessingLine.chemistry_family
        distinguishing_aspect: "Re-plumbing is allowed exactly while no campaign on the line is RUNNING: the same call is refused with ERR_LINE_HAS_RUNNING_CAMPAIGN mid-campaign and accepted once that campaign's only lot is voided and the campaign cancelled, proving the guard reads campaign status rather than mere existence."
        test_recipe:
          setup:
            - "Clock 2026-08-20T00:00:00.000Z; one campus; one AVAILABLE NICKEL_RICH HYDROMET line at 100.0 kg/h; one SCHEDULED campaign over 2026-08-20..2026-08-21 with planned_input_kg 1000.0."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
