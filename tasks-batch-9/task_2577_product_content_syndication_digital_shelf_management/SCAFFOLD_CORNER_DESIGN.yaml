        claim_type: aggregation
        grounds:
          - calculations.alert_rollup.formula
          - entities.Product.fields.governance_flag
          - entities.Product.fields.open_alert_count
        distinguishing_aspect: "With one HEALTH_DEGRADED and one UNAUTHORIZED_LISTING alert open the flag is LISTING_RISK, and resolving only the UNAUTHORIZED_LISTING row drops it back to CONTENT_AT_RISK while the count falls from 2 to 1 — the precedence is evaluated top to bottom, not by alert recency."
