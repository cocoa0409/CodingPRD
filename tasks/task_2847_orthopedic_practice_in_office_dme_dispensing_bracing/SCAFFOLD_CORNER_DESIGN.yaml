      - name: corner_returned_encounter_and_inspected_return_are_locked_down_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[DispenseEncounter.clinical_status].terminal_states
          - state_machines[ProductReturn].REQUESTED -> RESTOCKED
          - validations[priority=20]
          - validations[priority=25]
          - validations[priority=55]
          - errors[ERR_INVALID_CLINICAL_STATE]
          - errors[ERR_INVALID_RETURN_STATE]
          - errors[ERR_RETURN_ALREADY_EXISTS]
        distinguishing_aspect: "Once the encounter reaches the terminal RETURNED state and the return has been inspected, three different replays each fail with their OWN diagnosis: a second inspection is ERR_INVALID_RETURN_STATE, a second return request is ERR_RETURN_ALREADY_EXISTS (the pinned carve-out in the priority-20 rule), and both a medical-necessity note and a dispense are ERR_INVALID_CLINICAL_STATE -- and none of them mutates the frozen money fields."
