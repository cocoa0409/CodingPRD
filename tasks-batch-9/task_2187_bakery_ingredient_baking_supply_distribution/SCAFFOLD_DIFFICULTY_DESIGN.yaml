            - "OPEN NONE zone Z-NON-01 holding two AVAILABLE lots: LOT-A manufactured 2026-06-06 (expires 2026-09-04, exactly 30 days of remaining life) with 5000 lb, and LOT-B manufactured 2026-06-05 (expires 2026-09-03, 29 days) with 9000 lb."
