            - call: "POST /allocation/programs/${prog_id}/activate"
              payload: {}
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s1_id}", item_id: "${item_id}", on_hand_units: 6, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 4 }, { size_code: "L", units: 2 }, { size_code: "XL", units: 0 }], on_order_units: 4, min_units: 12, max_units: 48, weekly_forecast_units: 9, trailing_4wk_sales_units: 30 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p1_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s2_id}", item_id: "${item_id}", on_hand_units: 20, size_on_hand: [{ size_code: "S", units: 5 }, { size_code: "M", units: 7 }, { size_code: "L", units: 6 }, { size_code: "XL", units: 2 }], min_units: 8, max_units: 24, weekly_forecast_units: 5, trailing_4wk_sales_units: 16 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p2_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s3_id}", item_id: "${item_id}", on_hand_units: 2, size_on_hand: [{ size_code: "S", units: 0 }, { size_code: "M", units: 1 }, { size_code: "L", units: 1 }, { size_code: "XL", units: 0 }], min_units: 8, max_units: 20, weekly_forecast_units: 3, trailing_4wk_sales_units: 6 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p3_id: $.data.id }
            - call: "POST /allocation/store-positions"
              payload: { store_id: "${s4_id}", item_id: "${item_id}", on_hand_units: 0, size_on_hand: [], min_units: 6, max_units: 20, weekly_forecast_units: 2, trailing_4wk_sales_units: 5 }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { p4_id: $.data.id }
            - call: "POST /allocation/receipts"
              payload: { program_id: "${prog_id}", item_id: "${item_id}", reference: "ASN-9008", units_received: 44, size_received: [{ size_code: "S", units: 8 }, { size_code: "M", units: 16 }, { size_code: "L", units: 14 }, { size_code: "XL", units: 6 }], receipt_date: "2026-08-01T00:00:00Z" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { rcpt_id: $.data.id, rcpt_v1: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v1}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l1_s1: "$.data[0].id" }
          trigger:
            - call: "POST /allocation/allocation-runs/${run_id}/recall"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/receipts/${rcpt_id}"
              payload: {}
              as: Allocator
              captures: { rcpt_v2: $.data.version }
            - call: "POST /allocation/receipts/${rcpt_id}/allocation-runs"
              payload: { method: "DEMAND_DRIVEN", need_basis: "FORWARD_LOOKING", expected_receipt_version: "${rcpt_v2}" }
              as: Allocator
              as_user_id: "u-alloc-1"
              captures: { run2_id: $.data.id }
            - call: "POST /allocation/allocation-runs/${run2_id}/propose"
              payload: {}
              as: Allocator
              as_user_id: "u-alloc-1"
            - call: "POST /allocation/allocation-runs/${run2_id}/commit"
              payload: {}
              as: AllocationManager
              as_user_id: "u-mgr-1"
            - call: "GET /allocation/allocation-lines"
              payload: { run_id: "${run2_id}", store_id: "${s1_id}" }
              as: Allocator
              captures: { l2_s1: "$.data[0].id" }
          assert:
            - "After recall: AllocationRun.${run_id}.status == RECALLED, every line has units_allocated == 0 and fulfillment_status == RECALLED"
            - "After recall the ledger reads 44 = 0 + 44: Receipt.${rcpt_id}.units_committed == 0, units_unallocated == 44, units_received == 44, status back to ALLOCATING"
            - "After recall AllocationProgram.${prog_id}.total_units_committed == 0 and open_reserve_units == 44, with total_units_received unchanged at 44"
            - "The second run is created against the REFRESHED receipt version and AllocationRun.${run2_id}.supersedes_run_id == null, because a RECALLED run is terminal and is not superseded"
            - "The second propose reproduces the identical spread - lines 26 / 10 / 8 for stores 0101 / 0103 / 0104 - because no unit ever moved and no position changed"
            - "After the second commit the ledger reads 44 = 44 + 0 again: units_committed == 44, units_unallocated == 0, status ALLOCATED, open_reserve_units == 0 - zero drift across the full cycle"
            - "AllocationLine.${l1_s1}.units_allocated is still 0 (RECALLED) while AllocationLine.${l2_s1}.units_allocated == 26: six lines exist in total but only the three of the COMMITTED run contribute to units_committed"
            - "Receipt.${rcpt_id}.units_received was never written by any of these operations - only the committed and unallocated legs move, and they always sum to it"
      - name: network_on_hand_is_conserved_across_approve_cancel_and_approve_dispatch_receive
        grounds:
          - calculations.network_on_hand_invariant
          - entities.StorePosition.fields.in_transit_units
          - entities.StorePosition.fields.reserved_out_units
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/cancel
          - endpoints.POST /allocation/transfer-recommendations/{recommendationId}/receive
        distinguishing_aspect: |
          A second, different invariant with a different compensation pair: NET(item) = sum over positions
          of (on_hand_units + in_transit_units) must equal 39 after every one of the seven calls in this
          chain, because no transfer operation may create or destroy a unit. Cancel is the exact inverse of
          approve (the donor reservation is released and available_units returns to 30), and the full
          approve -> dispatch -> receive arm merely relocates units - donor on_hand down 6, receiver
          in_transit up 6, then receiver in_transit down 6 and on_hand up 6.
