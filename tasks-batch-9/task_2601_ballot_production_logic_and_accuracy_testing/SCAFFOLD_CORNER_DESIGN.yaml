            - call: "GET /elections/00000000-0000-0000-0000-0000000000ff/custody-events"
              payload: {}
              as: PublicObserver
              captures: { e5: $.data.error_id }
          assert:
            - "All five calls return HTTP 404 with success == false."
            - "${e1} == ${e2} == ${e3} == ${e4} == ${e5} == \"ERR_ELECTION_NOT_FOUND\"."
            - "Each error envelope carries a non-empty message and a non-empty error_id, and data is otherwise absent."
            - "No Contest, Precinct, BallotStyle or TabulatorUnit row was created: the path-entity-exists rule (priority 40) fires before any business rule."

      - name: en_custody_event_ledger_is_immutable_and_append_only
        claim_type: immutability
        grounds:
          - entities.CustodyEvent
          - endpoints.GET /elections/{id}/custody-events
          - endpoints.POST /ballot-lots/{id}/receive
          - endpoints.POST /ballot-lots/{id}/issue
        distinguishing_aspect: "CustodyEvent is written only as a side effect and never edited: three separate custody actions on the same lot leave three rows whose sequence_index is 1, 2, 3 and whose from_state/to_state pairs chain end-to-end; §1.5 exposes no PUT, PATCH or DELETE for the ledger, and the earlier rows are byte-identical after the later actions."
