# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (9 rules x 2 instances)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_diverge
        grounds:
          - calculations.settlement_total
          - entities.Booking.fields.provisional_estimate_cents
          - entities.Booking.fields.final_settlement_cents
          - state_machines.Booking.CONFIRMED_to_CHECKED_OUT
          - state_machines.Booking.RETURNED_to_CLOSED
        distinguishing_aspect: |
          Same booking, two settlement variants on the Booking ledger domain: PROVISIONAL at checkout
          prices FUEL with the 50% estimated burn (150.0 gal -> 105000) while FINAL at settle uses the
          measured gauge delta (114.0 gal -> 79800); the estimate (145000) and the final (134800) differ.
          Entity domain differs from the sibling instance (Renter risk scoring).
        test_recipe:
          setup:
            - "LUXE_56 vessel (tank 300) with PEAK rate 90000 (2026-06-01..2026-08-31) and SHOULDER rate 65000 (2026-09-01..2026-10-31), weekly 10%"
            - "Qualified renter (VERIFIED cert expires 2027-06-30); booking 2026-08-28 -> 2026-09-12 CONFIRMED with APPROVED itinerary and COUNTERSIGNED orientation"
          setup_api_calls:
            - call: "POST /vessels"
              payload: { name: "Luxe One", size_class: "LUXE_56", berth_count: 8, home_marina: "Wahweap", fuel_tank_capacity_gallons: 300 }
              as: FleetManager
              captures: { v_id: $.data.id }
            - call: "POST /season-rates"
              payload: { size_class: "LUXE_56", season: "PEAK", start_date: "2026-06-01", end_date: "2026-08-31", nightly_rate_cents: 90000, weekly_discount_pct: 10 }
              as: FleetManager
            - call: "POST /season-rates"
              payload: { size_class: "LUXE_56", season: "SHOULDER", start_date: "2026-09-01", end_date: "2026-10-31", nightly_rate_cents: 65000, weekly_discount_pct: 10 }
              as: FleetManager
            - call: "POST /renters"
              payload: { full_name: "Rae Dual", email: "rae@x.com", date_of_birth: "1985-04-02" }
              as: Renter
              captures: { r_id: $.data.id }
            - call: "POST /renters/${r_id}/certificates"
              payload: { cert_number: "C-100", issuing_authority: "NASBLA", issued_on: "2026-01-15", expires_on: "2027-06-30" }
              as: Renter
              as_user_id: "${r_id}"
              captures: { c_id: $.data.id }
            - call: "POST /certificates/${c_id}/decision"
              payload: { decision: "VERIFY" }
              as: DockStaff
            - call: "POST /bookings"
              payload: { vessel_id: "${v_id}", renter_id: "${r_id}", start_date: "2026-08-28", end_date: "2026-09-12", party_size: 4 }
              as: Renter
              as_user_id: "${r_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /geo-zones"
              payload: { zone_code: "ZP-RAINBOW", name: "Rainbow Bridge", max_vessels_per_night: 5, allowed_size_classes: ["COMPACT_36", "STANDARD_44", "LUXE_56"] }
              as: FleetManager
              captures: { z_id: $.data.id }
            - call: "PUT /bookings/${b_id}/itinerary"
              payload: { waypoints: [ { zone_id: "${z_id}", night_date: "2026-08-28" } ] }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "SAFETY_BRIEF" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "DOCKING" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "ANCHORING" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "GENERATOR_OPS" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "THRUSTER_OPS" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/sign-item"
              payload: { item_code: "SEWAGE_PUMPOUT" }
              as: Renter
              as_user_id: "${r_id}"
            - call: "POST /bookings/${b_id}/orientation/countersign"
              payload: { approved: true }
              as: DockStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-28T09:00:00Z" }
              as: FleetManager
            - call: "POST /bookings/${b_id}/checkout"
              payload: { fuel_gauge_percent: 100, pump_out_done: true }
              as: DockStaff
              captures: { prov: $.data.provisional_estimate_cents }
          trigger:
            - call: "POST /bookings/${b_id}/return"
              payload: { fuel_gauge_percent: 62, pump_out_done: false, actual_return_at: "2026-09-12T13:00:00Z" }
              as: DockStaff
            - call: "GET /bookings/${b_id}/cleaning-turns"
              payload: {}
              as: DockStaff
              captures: { t_id: "$.data[0].id" }
            - call: "POST /cleaning-turns/${t_id}/inspect"
              payload: { passed: true }
              as: DockStaff
            - call: "POST /bookings/${b_id}/settle"
              payload: {}
              as: DockStaff
              captures: { final: $.data.final_settlement_cents, applied: $.data.deposit_applied_cents, released: $.data.deposit_released_cents }
          assert:
            - "Booking.${b_id}.provisional_estimate_cents == 145000 (PROVISIONAL: 150.0 gal x 700 + 15000 pump-out + 25000 cleaning)"
            - "Booking.${b_id}.final_settlement_cents == 134800 (FINAL: 79800 fuel + 15000 pump-out + 25000 cleaning + 15000 late)"
            - "provisional_estimate_cents != final_settlement_cents (145000 != 134800)"
            - "Booking.${b_id}.deposit_applied_cents == 134800 and deposit_released_cents == 115200"
            - "Booking.${b_id}.settlement_status == FINALIZED and status == CLOSED"

      - name: renter_risk_lifetime_vs_rolling_window
        grounds:
          - calculations.renter_risk_score
          - calculations.deposit_requirement
          - entities.Renter.fields.risk_score_lifetime
          - entities.Renter.fields.risk_score_rolling_24m
          - state_machines.Incident.REPORTED_to_RESOLVED
        distinguishing_aspect: |
          Same incident history, two scoring variants on the Renter entity (different domain than the
          sibling Booking-settlement instance): LIFETIME counts the 2024-06-12 MAJOR grounding (35)
          while ROLLING_24M excludes it at the 2026-08-01 evaluation date (10); deposit_requirement
          consumes only ROLLING_24M, so a new booking's deposit_required_cents is 150000 and not the
          225000 the LIFETIME score would produce.
        test_recipe:
          setup:
            - "COMPACT_36 vessel; COMPACT rates for 2024 PEAK (2024-06-01..2024-08-31, 45000) and 2026 PEAK (2026-06-01..2026-08-31, 45000), weekly 10%"
            - "Renter with VERIFIED cert (expires 2027-01-15); two completed bookings: P1 (2024-06-10->2024-06-13, GROUNDING MAJOR resolved) and P2 (2026-07-05->2026-07-08, GROUNDING MINOR resolved)"
            - "Logical clock travelled: 2024-06-01 for P1, 2026-07-01 for P2, 2026-08-01 for evaluation"
