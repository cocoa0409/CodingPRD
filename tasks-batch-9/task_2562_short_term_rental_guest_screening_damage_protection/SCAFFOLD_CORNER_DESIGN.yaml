              payload: { full_name: "Shared Read Guest", email: "sharedread@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED", turnover_buffer_nights: 0 }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "GET /rentals/properties/${p1}"
