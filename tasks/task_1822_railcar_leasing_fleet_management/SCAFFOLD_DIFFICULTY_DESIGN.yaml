            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /mileage-reports", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", report_month: "2026-08", loaded_miles: 1000, empty_miles: 200 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id" } }
