scenario: |
  2892. Design System Governance (product design system team): component inventory with maturity levels, adoption status and platform coverage across web and mobile, contribution process with proposal, design critique, engineering review and acceptance criteria, versioning strategy with breaking change policy, deprecation timelines and migration guides, accessibility conformance requirements per component with automated and manual testing evidence, token architecture for color, typography and spacing with theming and brand variation support, adoption measurement through code scanning and design file linting with team-level dashboards, exception and one-off component approval with technical debt tracking, documentation site maintenance and release communication

domain_name: design-system-governance
api_prefix: "/design-system"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval

  entity_topology: graph
  # Component <-> Component through the ComponentDependency junction (DAG, cycle-rejected)
  # and DesignToken -> DesignToken through alias_of_token_id (self-referential alias chains,
  # cycle-rejected, depth-capped). No entity is expressed as a nested URL child of another
  # entity's aggregate for identity purposes; every entity is addressable at its own
  # top-level collection and linked by explicit foreign keys.

  state_machine_shape: cyclic
  # ContributionProposal cycles CHANGES_REQUESTED -> DESIGN_CRITIQUE -> ENGINEERING_REVIEW ->
  # CHANGES_REQUESTED across numbered revision rounds and branches three ways out of
  # ENGINEERING_REVIEW; PlatformImplementation cycles SHIPPED -> BLOCKED -> SHIPPED;
  # Component carries two independent state dimensions (maturity_level x lifecycle_state),
  # and the maturity dimension itself admits STABLE -> BETA demotion.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The same X-User-ID may not file both the DESIGN_CRITIQUE and the ENGINEERING_REVIEW
  # verdict on one proposal; the authoring ContributingTeam may not file any review; the
  # DesignSystemLead who accepts a proposal is structurally distinct from both reviewers.

  consistency_model: immediate

  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Team
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human-readable product/design team name
        constraints: 1..120 chars, non-blank
      - name: slug
        type: string
        source: input
        description: URL-safe team key
        constraints: unique across all Team rows, lowercase kebab-case
      - name: platform_scope
        type: enum
        source: input
        description: which platforms this team ships on
        default: ALL
        constraints: one of {WEB_ONLY, MOBILE_ONLY, ALL}
      - name: debt_budget_points
        type: number
        source: input
        description: maximum outstanding technical-debt points the team may carry
        default: 40.00
        constraints: 2 decimal places, >= 0.00
      - name: outstanding_debt_points
        type: number
        source: computed
        description: "calculations.exception_debt_points, team_rollup variant: rounded sum of debt_points over this team's ExceptionGrant rows whose state IN {APPROVED, EXPIRED}"
        default: 0.00
        constraints: 2 decimal places, >= 0.00
      - name: lifetime_debt_points
        type: number
        source: computed
        description: "rounded sum of debt_points over this team's ExceptionGrant rows whose state IN {APPROVED, EXPIRED, REPAID}; never decreases"
        default: 0.00
        constraints: 2 decimal places, monotonically non-decreasing
      - name: debt_state
        type: enum
        source: computed
        description: "FROZEN when outstanding_debt_points >= debt_budget_points, else CLEAR"
        default: CLEAR
        constraints: one of {CLEAR, FROZEN}
      - name: blocked_implementation_count
        type: integer
        source: computed
        description: "count of PlatformImplementation rows whose component's owning_team_id == this team and whose status == BLOCKED"
        default: 0
        constraints: ">= 0"
      - name: adoption_index_latest
        type: number
        source: computed
        description: "calculations.team_adoption_index, latest_scan variant"
        default: 0.00
        constraints: 2 decimal places, 0.00..100.00
      - name: adoption_index_trailing
        type: number
        source: computed
        description: "calculations.team_adoption_index, trailing_window variant"
        default: 0.00
        constraints: 2 decimal places, 0.00..100.00

  - name: Component
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: component display name, e.g. "Action Button"
        constraints: 1..120 chars, non-blank
      - name: slug
        type: string
        source: input
        description: URL-safe component key
        constraints: unique across all Component rows, lowercase kebab-case
      - name: owning_team_id
        type: string
        source: input
        description: "FK -> Team.id; the team accountable for this component's governance"
        constraints: must resolve to an existing Team
      - name: maturity_level
        type: enum
        source: system
        description: "maturity dimension of the parallel state machine; advanced by POST /design-system/components/{id}/promote-maturity and demoted by upstream-sunset / conformance-regression cascades"
        default: EXPERIMENTAL
        constraints: one of {EXPERIMENTAL, BETA, STABLE}
      - name: lifecycle_state
        type: enum
        source: system
        description: "lifecycle dimension of the parallel state machine; advanced by DeprecationPlan transitions, independent of maturity_level"
        default: ACTIVE
        constraints: one of {ACTIVE, DEPRECATION_ANNOUNCED, SUNSET, REMOVED}
      - name: current_major_version
        type: integer
        source: system
        description: "major version of this component's public API; incremented by every accepted BREAKING_CHANGE proposal"
        default: 1
        constraints: ">= 1"
      - name: docs_state
        type: enum
        source: input
        description: "documentation-site page state for this component"
        default: MISSING
        constraints: one of {MISSING, DRAFT, PUBLISHED}
      - name: docs_last_reviewed_at
        type: datetime
        source: system
        description: "logical-clock instant at which docs_state last became PUBLISHED; null while MISSING/DRAFT"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null
      - name: shipped_platform_count
        type: integer
        source: computed
        description: "calculations.platform_coverage_state: cardinality of the distinct platform set over PlatformImplementation rows for this component whose status == SHIPPED"
        default: 0
        constraints: 0..3
      - name: coverage_state
        type: enum
        source: computed
        description: "calculations.platform_coverage_state output"
        default: NONE
        constraints: one of {NONE, WEB_ONLY, MOBILE_ONLY, PARTIAL, FULL}
      - name: governance_conformance_score
        type: number
        source: computed
        description: "calculations.a11y_conformance_score, governance_sweep variant, minimised over this component's PlatformImplementation rows whose status IN {SHIPPED, BLOCKED}; 0.00 when that set is empty"
        default: 0.00
        constraints: 2 decimal places, 0.00..100.00
      - name: conformance_baseline_at
        type: datetime
        source: system
        description: "start of the governance-sweep evidence window, compared against AccessibilityAudit.audited_at with >=; set to the logical clock at component creation and reset to the logical clock on every successful maturity promotion"
        constraints: ISO 8601 UTC with three fractional digits
      - name: blocked_dependency_count
        type: integer
        source: computed
        description: "count of ComponentDependency rows whose consumer_component_id == this component and whose compatibility_state IN {INCOMPATIBLE, SUNSET_PROVIDER}"
        default: 0
        constraints: ">= 0"
      - name: pending_breaking_change_count
        type: integer
        source: system
        description: "number of accepted BREAKING_CHANGE proposals against this component not yet carried by a PUBLISHED Release"
        default: 0
        constraints: ">= 0"
      - name: maturity_demotion_reason
        type: enum
        source: system
        description: "why the maturity dimension was last demoted; reset to NONE on every successful promotion"
        default: NONE
        constraints: one of {NONE, UPSTREAM_SUNSET, CONFORMANCE_REGRESSION}
      - name: one_off_exception_count
        type: integer
        source: computed
        description: "count of ExceptionGrant rows whose substitute_for_component_id == this component and whose state IN {APPROVED, EXPIRED}"
        default: 0
        constraints: ">= 0"

  - name: PlatformImplementation
    parent: null
    common_fields: true
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> Component.id; the component this implementation realises"
        constraints: must resolve to an existing Component
      - name: platform
        type: enum
        source: input
        description: delivery platform
        constraints: one of {WEB, IOS, ANDROID}; unique per (component_id, platform)
      - name: package_name
        type: string
        source: input
        description: distributed package/module name
        constraints: 1..160 chars, non-blank
      - name: package_version
        type: string
        source: input
        description: semver of the shipped package
        constraints: "matches ^\\d+\\.\\d+\\.\\d+$"
      - name: token_compliance_ratio
        type: number
        source: input
        description: "fraction of styling declarations in this package resolved through DesignToken values rather than raw literals, as reported by code scanning"
        default: 0.00
        constraints: 2 decimal places, 0.00..1.00
      - name: status
        type: enum
        source: system
        description: "implementation state machine position"
        default: PLANNED
        constraints: one of {PLANNED, SHIPPED, BLOCKED, RETIRED}
      - name: conformance_score
        type: number
        source: computed
        description: "calculations.a11y_conformance_score, latest_evidence variant, for this implementation"
        default: 0.00
        constraints: 2 decimal places, 0.00..100.00
      - name: last_audit_sequence
        type: integer
        source: system
        description: "highest audit_sequence minted for this implementation; 0 when no audit exists"
        default: 0
        constraints: ">= 0"
      - name: blocked_reason
        type: enum
        source: system
        description: "why this implementation was moved to BLOCKED; reset to NONE on re-ship"
        default: NONE
        constraints: one of {NONE, UPSTREAM_BREAKING_CHANGE, PROVIDER_SUNSET}
      - name: shipped_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent successful ship; null while never shipped"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null

  - name: ComponentDependency
    parent: null
    common_fields: true
    fields:
      - name: consumer_component_id
        type: string
        source: input
        description: "FK -> Component.id; the component that consumes the provider"
        constraints: must resolve to an existing Component; must differ from provider_component_id
      - name: provider_component_id
        type: string
        source: input
        description: "FK -> Component.id; the component being consumed"
        constraints: must resolve to an existing Component; unique per (consumer_component_id, provider_component_id)
      - name: pinned_provider_major
        type: integer
        source: input
        description: "provider major version the consumer is built against"
        constraints: ">= 1"
      - name: compatibility_state
        type: enum
        source: system
        description: "COMPATIBLE while pinned_provider_major == provider.current_major_version and the provider is not sunset; set by breaking-change and sunset cascades"
        default: COMPATIBLE
        constraints: one of {COMPATIBLE, INCOMPATIBLE, SUNSET_PROVIDER}

  - name: TokenSet
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: token set display name, e.g. "Core Foundations 2026"
        constraints: 1..120 chars, non-blank
      - name: slug
        type: string
        source: input
        description: URL-safe token set key
        constraints: unique across all TokenSet rows, lowercase kebab-case
      - name: default_brand
        type: enum
        source: input
        description: brand layer used when a resolved-tokens read omits brand
        default: BASE
        constraints: one of {BASE, BRAND_A, BRAND_B}
      - name: default_mode
        type: enum
        source: input
        description: mode layer used when a resolved-tokens read omits mode
        default: LIGHT
        constraints: one of {LIGHT, DARK}
      - name: token_count
        type: integer
        source: computed
        description: "count of DesignToken rows whose token_set_id == this token set"
        default: 0
        constraints: ">= 0"
      - name: max_alias_depth
        type: integer
        source: computed
        description: "maximum alias_depth over this token set's DesignToken rows"
        default: 0
        constraints: 0..5

  - name: DesignToken
    parent: null
    common_fields: true
    fields:
      - name: token_set_id
        type: string
        source: input
        description: "FK -> TokenSet.id; the token set this token belongs to"
        constraints: must resolve to an existing TokenSet
      - name: name
        type: string
        source: input
        description: dotted token path, e.g. "color.action.primary"
        constraints: unique per (token_set_id, name, brand, mode)
      - name: category
        type: enum
        source: input
        description: token architecture category
        constraints: one of {COLOR, TYPOGRAPHY, SPACING}
      - name: brand
        type: enum
        source: input
        description: brand-variation layer this token belongs to
        default: BASE
        constraints: one of {BASE, BRAND_A, BRAND_B}
      - name: mode
        type: enum
        source: input
        description: theming mode layer; ANY applies to both LIGHT and DARK reads
        default: ANY
        constraints: one of {LIGHT, DARK, ANY}
      - name: raw_value
        type: string
        source: input
        description: literal value when this token is a leaf; null when the token is an alias
        default: null
        constraints: exactly one of raw_value / alias_of_token_id must be non-null
      - name: alias_of_token_id
        type: string
        source: input
        description: "FK -> DesignToken.id; when set, this token resolves to the referenced token's resolved value"
        default: null
        constraints: must resolve to an existing DesignToken in the same token_set_id, or be null
      - name: alias_depth
        type: integer
        source: computed
        description: "calculations.token_alias_resolution: number of alias hops from this token to its leaf; 0 for a leaf token"
        default: 0
        constraints: 0..5
      - name: resolved_value
        type: string
        source: computed
        description: "calculations.token_alias_resolution: raw_value of the leaf reached by following alias_of_token_id; equals raw_value for a leaf"
        default: null
        constraints: non-null once the alias chain terminates in a leaf

  - name: ContributionProposal
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: proposal title
        constraints: 1..160 chars, non-blank
      - name: author_team_id
        type: string
        source: input
        description: "FK -> Team.id; the contributing team that authored the proposal"
        constraints: must resolve to an existing Team; must equal X-User-ID when the caller is ContributingTeam
      - name: target_component_id
        type: string
        source: input
        description: "FK -> Component.id; the component the proposal changes"
        constraints: must resolve to an existing Component
      - name: pinned_token_set_id
        type: string
        source: input
        description: "FK -> TokenSet.id; the token set the proposal's design is authored against"
        constraints: must resolve to an existing TokenSet
      - name: released_in_release_id
        type: string
        source: system
        description: "FK -> Release.id; set at acceptance to the DRAFT release the proposal lands in"
        default: null
        constraints: null until the proposal reaches ACCEPTED
      - name: proposal_kind
        type: enum
        source: input
        description: contribution class driving evidence requirements and version impact
        constraints: one of {NEW_COMPONENT, ENHANCEMENT, BREAKING_CHANGE}
      - name: touches_public_api
        type: boolean
        source: input
        description: whether the change alters the component's documented public props/API surface
        default: false
        constraints: boolean
      - name: state
        type: enum
        source: system
        description: contribution-process state machine position
        default: DRAFT
        constraints: one of {DRAFT, DESIGN_CRITIQUE, ENGINEERING_REVIEW, CHANGES_REQUESTED, READY_FOR_ACCEPTANCE, ACCEPTED, REJECTED}
      - name: revision_round
        type: integer
        source: system
        description: "1 on first submit; incremented on every CHANGES_REQUESTED -> DESIGN_CRITIQUE resubmit"
        default: 0
        constraints: 0..3
      - name: pinned_token_set_version
        type: integer
        source: system
        description: "TokenSet.version observed at the most recent submit; re-validated at acceptance"
        default: null
        constraints: ">= 1 once submitted"
      - name: required_evidence_kinds
        type: array
        source: computed
        description: "calculations.required_evidence_kinds output; recomputed on every submit"
        default: []
        constraints: sorted ascending, members of {A11Y_AUTOMATED, A11Y_MANUAL, TOKEN_COMPLIANCE, DOC_PAGE, MIGRATION_GUIDE, PLATFORM_PARITY}
      - name: submitted_evidence_kinds
        type: array
        source: system
        description: "evidence kinds accepted so far; pruned on resubmit per calculations.required_evidence_kinds carry-over rule"
        default: []
        constraints: sorted ascending, no duplicates
      - name: raw_change_class
        type: enum
        source: computed
        description: "calculations.release_version_bump step 1 output for this proposal"
        default: null
        constraints: one of {PATCH, MINOR, MAJOR}
      - name: effective_change_class
        type: enum
        source: computed
        description: "calculations.release_version_bump step 5 output for this proposal; null until the carrying Release is published"
        default: null
        constraints: one of {PATCH, MINOR, MAJOR} or null
      - name: design_critique_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewer who filed the most recent DESIGN_CRITIQUE verdict"
        default: null
        constraints: opaque operator id, or null
      - name: engineering_reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewer who filed the most recent ENGINEERING_REVIEW verdict"
        default: null
        constraints: opaque operator id, or null
      - name: submitted_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent submit"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null
      - name: accepted_at
        type: datetime
        source: system
        description: "logical-clock instant of acceptance"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null

  - name: ReviewRecord
    parent: null
    common_fields: false
    fields:
      - name: proposal_id
        type: string
        source: input
        description: "FK -> ContributionProposal.id; the proposal being reviewed"
        constraints: must resolve to an existing ContributionProposal
      - name: stage
        type: enum
        source: input
        description: which review gate this verdict belongs to
        constraints: one of {DESIGN_CRITIQUE, ENGINEERING_REVIEW}
      - name: verdict
        type: enum
        source: input
        description: reviewer decision
        constraints: one of {APPROVE, REQUEST_CHANGES, BLOCK}
      - name: notes
        type: string
        source: input
        description: reviewer rationale
        constraints: 1..2000 chars, non-blank
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the reviewer, captured from the request headers"
        constraints: non-blank opaque operator id
      - name: revision_round
        type: integer
        source: system
        description: "the proposal's revision_round at the moment the verdict was filed"
        constraints: 1..3
      - name: resulting_proposal_state
        type: enum
        source: system
        description: "ContributionProposal.state immediately after this verdict was applied"
        constraints: one of {ENGINEERING_REVIEW, CHANGES_REQUESTED, READY_FOR_ACCEPTANCE, REJECTED}

  - name: Release
    parent: null
    common_fields: true
    fields:
      - name: semver_base
        type: string
        source: input
        description: "the currently published design-system version this release bumps from"
        constraints: "matches ^\\d+\\.\\d+\\.\\d+$"
      - name: channel
        type: enum
        source: input
        description: distribution channel
        default: STABLE
        constraints: one of {STABLE, NEXT}
      - name: state
        type: enum
        source: system
        description: release state machine position
        default: DRAFT
        constraints: one of {DRAFT, PUBLISHED}
      - name: semver
        type: string
        source: computed
        description: "calculations.release_version_bump step 6 output; null until published"
        default: null
        constraints: "matches ^\\d+\\.\\d+\\.\\d+$ once published"
      - name: policy_tier
        type: enum
        source: computed
        description: "calculations.release_version_bump step 4 output; null until published"
        default: null
        constraints: one of {INCREMENTAL, BATCHED} or null
      - name: breaking_ratio
        type: number
        source: computed
        description: "calculations.release_version_bump step 3 output; null until published"
        default: null
        constraints: 4 decimal places, 0.0000..1.0000, or null
      - name: breaking_change_count
        type: integer
        source: computed
        description: "count of carried proposals whose effective_change_class == MAJOR; 0 until published"
        default: 0
        constraints: ">= 0"
      - name: escalated_proposal_count
        type: integer
        source: computed
        description: "count of carried proposals whose effective_change_class differs from raw_change_class, counting both the step-2 maturity de-escalation and the step-5 BATCHED escalation; 0 until published"
        default: 0
        constraints: ">= 0"
      - name: release_notes_state
        type: enum
        source: system
        description: "release-communication state; flips to PUBLISHED as a side effect of publishing the release"
        default: PENDING
        constraints: one of {PENDING, PUBLISHED}
      - name: published_at
        type: datetime
        source: system
        description: "logical-clock instant of publication"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null

  - name: DeprecationPlan
    parent: null
    common_fields: true
    fields:
      - name: component_id
        type: string
        source: input
        description: "FK -> Component.id; the component being deprecated"
        constraints: must resolve to an existing Component
      - name: replacement_component_id
        type: string
        source: input
        description: "FK -> Component.id; the recommended replacement component, or null when none"
        default: null
        constraints: must resolve to an existing Component and differ from component_id, or be null
      - name: announced_at
        type: datetime
        source: input
        description: "instant the deprecation is announced; opens the half-open occupancy window [announced_at, removal_at)"
        constraints: ISO 8601 UTC with three fractional digits
      - name: sunset_at
        type: datetime
        source: input
        description: "instant after which the component may be moved to SUNSET"
        constraints: ISO 8601 UTC with three fractional digits, > announced_at
      - name: removal_at
        type: datetime
        source: input
        description: "instant after which the component may be moved to REMOVED; closes the half-open occupancy window"
        constraints: ISO 8601 UTC with three fractional digits, > sunset_at
      - name: migration_guide_url
        type: string
        source: input
        description: canonical documentation-site URL of the migration guide
        default: null
        constraints: non-blank string, or null
      - name: migration_guide_state
        type: enum
        source: system
        description: migration-guide publication state
        default: MISSING
        constraints: one of {MISSING, DRAFT, PUBLISHED}
      - name: required_notice_days
        type: integer
        source: computed
        description: "calculations.deprecation_notice_window required_notice_days output, frozen at plan creation"
        constraints: ">= 14"
      - name: actual_notice_days
        type: integer
        source: computed
        description: "calculations.deprecation_notice_window actual_notice_days output, frozen at plan creation"
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: deprecation plan state machine position
        default: DRAFT
        constraints: one of {DRAFT, ANNOUNCED, SUNSET, REMOVED, RESCINDED}
      - name: blocked_dependent_count
        type: integer
        source: system
        description: "number of consumer Components this plan moved to compatibility_state SUNSET_PROVIDER; the exact amount a rescind must give back"
        default: 0
        constraints: ">= 0"
      - name: rescinded_at
        type: datetime
        source: system
        description: "logical-clock instant of rescission"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null

  - name: AccessibilityAudit
    parent: null
    common_fields: false
    fields:
      - name: platform_implementation_id
        type: string
        source: input
        description: "FK -> PlatformImplementation.id; the implementation this evidence covers"
        constraints: must resolve to an existing PlatformImplementation
      - name: method
        type: enum
        source: input
        description: testing method producing this evidence
        constraints: one of {AUTOMATED, MANUAL}
      - name: wcag_level
        type: enum
        source: input
        description: conformance level the audit was run at; only AA audits enter the conformance score
        constraints: one of {A, AA, AAA}
      - name: violations_critical
        type: integer
        source: input
        description: count of critical-severity findings
        constraints: ">= 0"
      - name: violations_serious
        type: integer
        source: input
        description: count of serious-severity findings
        constraints: ">= 0"
      - name: violations_moderate
        type: integer
        source: input
        description: count of moderate-severity findings
        constraints: ">= 0"
      - name: evidence_url
        type: string
        source: input
        description: link to the stored report or manual test script run
        constraints: 1..500 chars, non-blank
      - name: audit_sequence
        type: integer
        source: system
        description: "server-minted per-implementation monotonic counter starting at 1; the deterministic recency key for evidence selection (never the row id)"
        constraints: ">= 1, unique per platform_implementation_id"
      - name: defect_load
        type: integer
        source: computed
        description: "calculations.a11y_conformance_score defect_load: 10*violations_critical + 4*violations_serious + 1*violations_moderate"
        constraints: ">= 0"
      - name: audited_at
        type: datetime
        source: system
        description: "logical-clock instant at which this evidence was filed"
        constraints: ISO 8601 UTC with three fractional digits

  - name: AdoptionScan
    parent: null
    common_fields: false
    fields:
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; the team whose surface was scanned"
        constraints: must resolve to an existing Team
      - name: scan_kind
        type: enum
        source: input
        description: measurement channel
        constraints: one of {CODE_SCAN, DESIGN_LINT}
      - name: window_start_at
        type: datetime
        source: input
        description: "inclusive start of the closed measurement interval [window_start_at, window_end_at]"
        constraints: ISO 8601 UTC with three fractional digits
      - name: window_end_at
        type: datetime
        source: input
        description: "inclusive end of the closed measurement interval"
        constraints: ISO 8601 UTC with three fractional digits, > window_start_at
      - name: system_instance_count
        type: integer
        source: input
        description: occurrences resolved to a design-system component/token
        constraints: ">= 0"
      - name: legacy_instance_count
        type: integer
        source: input
        description: occurrences of pre-system legacy markup/styles
        constraints: ">= 0"
      - name: one_off_instance_count
        type: integer
        source: input
        description: occurrences of one-off components covered or not covered by an exception
        constraints: ">= 0"
      - name: adoption_ratio
        type: number
        source: computed
        description: "calculations.team_adoption_index scan_adoption_ratio for this scan"
        constraints: 2 decimal places, 0.00..100.00
      - name: scanned_at
        type: datetime
        source: system
        description: "logical-clock instant the scan was filed; recency tie-break after window_end_at"
        constraints: ISO 8601 UTC with three fractional digits

  - name: ExceptionGrant
    parent: null
    common_fields: true
    fields:
      - name: requesting_team_id
        type: string
        source: input
        description: "FK -> Team.id; the team asking to ship outside the system"
        constraints: must resolve to an existing Team; must equal X-User-ID when the caller is ContributingTeam
      - name: substitute_for_component_id
        type: string
        source: input
        description: "FK -> Component.id; the system component this one-off stands in for"
        constraints: must resolve to an existing Component
      - name: exception_kind
        type: enum
        source: input
        description: class of governance exception
        constraints: one of {ONE_OFF_COMPONENT, FORK_OF_SYSTEM_COMPONENT, RAW_TOKEN_USAGE}
      - name: platform_scope
        type: enum
        source: input
        description: platforms the exception covers
        constraints: one of {WEB, IOS, ANDROID, ALL}
      - name: justification
        type: string
        source: input
        description: written rationale required by the governance policy
        constraints: 1..2000 chars, non-blank
      - name: expires_at
        type: datetime
        source: input
        description: "instant at which an APPROVED grant becomes EXPIRED"
        constraints: ISO 8601 UTC with three fractional digits
      - name: state
        type: enum
        source: system
        description: exception grant state machine position
        default: REQUESTED
        constraints: one of {REQUESTED, APPROVED, DENIED, EXPIRED, REPAID}
      - name: debt_points
        type: number
        source: computed
        description: "calculations.exception_debt_points grant_points output, frozen at approval; 0.00 while REQUESTED or DENIED"
        default: 0.00
        constraints: 2 decimal places, >= 0.00
      - name: pinned_maturity_level
        type: enum
        source: system
        description: "substitute_for_component.maturity_level observed at approval, pinned so later demotions do not restate historic debt"
        default: null
        constraints: one of {EXPERIMENTAL, BETA, STABLE} or null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DesignSystemLead who approved or denied the grant"
        default: null
        constraints: opaque operator id, or null
      - name: decided_at
        type: datetime
        source: system
        description: "logical-clock instant of the approve/deny decision"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null
      - name: repaid_at
        type: datetime
        source: system
        description: "logical-clock instant the debt was repaid"
        default: null
        constraints: ISO 8601 UTC with three fractional digits, or null

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # ---- Cyclic + branching contribution process -----------------------------
  - entity: ContributionProposal
    dimension: state
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: DESIGN_CRITIQUE
        trigger: "POST /design-system/contribution-proposals/{id}/submit"
        actor: ContributingTeam
        preconditions:
          - "X-User-ID == ContributionProposal.author_team_id"
          - "Team(author_team_id).debt_state == CLEAR"
          - "Component(target_component_id).lifecycle_state IN {ACTIVE, DEPRECATION_ANNOUNCED}"
          - "revision_round + 1 <= 3"
        side_effects:
          - "sets revision_round = 1"
          - "sets submitted_at = logical clock"
          - "pins pinned_token_set_version = TokenSet(pinned_token_set_id).version"
          - "recomputes required_evidence_kinds per calculations.required_evidence_kinds"
          - "clears submitted_evidence_kinds to [] (no evidence exists in round 1)"
          - "increments ContributionProposal.version by 1"
      - from: CHANGES_REQUESTED
        to: DESIGN_CRITIQUE
        trigger: "POST /design-system/contribution-proposals/{id}/submit"
        actor: ContributingTeam
        preconditions:
          - "X-User-ID == ContributionProposal.author_team_id"
          - "Team(author_team_id).debt_state == CLEAR"
          - "Component(target_component_id).lifecycle_state IN {ACTIVE, DEPRECATION_ANNOUNCED}"
          - "revision_round + 1 <= 3, else ERR_REVISION_LIMIT_EXCEEDED"
        side_effects:
          - "increments revision_round by 1"
          - "sets submitted_at = logical clock"
          - "re-pins pinned_token_set_version = TokenSet(pinned_token_set_id).version (stale-reference re-validation happens later, at acceptance)"
          - "recomputes required_evidence_kinds per calculations.required_evidence_kinds"
          - "prunes submitted_evidence_kinds to its intersection with {DOC_PAGE, MIGRATION_GUIDE} (round-scoped evidence invalidation)"
          - "increments ContributionProposal.version by 1"
        note: "the revision cycle; round 4 is refused rather than silently capped"
      - from: DESIGN_CRITIQUE
        to: ENGINEERING_REVIEW
        trigger: "POST /design-system/contribution-proposals/{id}/reviews with stage=DESIGN_CRITIQUE, verdict=APPROVE"
        actor: DesignCritiqueReviewer
        preconditions:
          - "request stage == DESIGN_CRITIQUE == the stage implied by state, else ERR_REVIEW_STAGE_MISMATCH"
          - "X-User-ID != engineering_reviewer_user_id (segregation of duties)"
        side_effects:
          - "appends a ReviewRecord with reviewer_user_id = X-User-ID, revision_round = proposal.revision_round, resulting_proposal_state = ENGINEERING_REVIEW"
          - "sets design_critique_reviewer_user_id = X-User-ID"
          - "increments ContributionProposal.version by 1"
      - from: DESIGN_CRITIQUE
        to: CHANGES_REQUESTED
        trigger: "POST /design-system/contribution-proposals/{id}/reviews with stage=DESIGN_CRITIQUE, verdict=REQUEST_CHANGES"
        actor: DesignCritiqueReviewer
        preconditions:
          - "request stage == DESIGN_CRITIQUE, else ERR_REVIEW_STAGE_MISMATCH"
        side_effects:
          - "appends a ReviewRecord with resulting_proposal_state = CHANGES_REQUESTED"
          - "sets design_critique_reviewer_user_id = X-User-ID"
          - "increments ContributionProposal.version by 1"
      - from: ENGINEERING_REVIEW
        to: READY_FOR_ACCEPTANCE
        trigger: "POST /design-system/contribution-proposals/{id}/reviews with stage=ENGINEERING_REVIEW, verdict=APPROVE"
        actor: EngineeringReviewer
        preconditions:
          - "request stage == ENGINEERING_REVIEW, else ERR_REVIEW_STAGE_MISMATCH"
          - "X-User-ID != design_critique_reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "appends a ReviewRecord with resulting_proposal_state = READY_FOR_ACCEPTANCE"
          - "sets engineering_reviewer_user_id = X-User-ID"
          - "increments ContributionProposal.version by 1"
        note: "fork point: the same from-state branches to READY_FOR_ACCEPTANCE, CHANGES_REQUESTED or REJECTED with disjoint side-effect sets"
      - from: ENGINEERING_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /design-system/contribution-proposals/{id}/reviews with stage=ENGINEERING_REVIEW, verdict=REQUEST_CHANGES"
        actor: EngineeringReviewer
        preconditions:
          - "request stage == ENGINEERING_REVIEW, else ERR_REVIEW_STAGE_MISMATCH"
          - "X-User-ID != design_critique_reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "appends a ReviewRecord with resulting_proposal_state = CHANGES_REQUESTED"
          - "sets engineering_reviewer_user_id = X-User-ID"
          - "increments ContributionProposal.version by 1"
      - from: ENGINEERING_REVIEW
        to: REJECTED
        trigger: "POST /design-system/contribution-proposals/{id}/reviews with stage=ENGINEERING_REVIEW, verdict=BLOCK"
        actor: EngineeringReviewer
        preconditions:
          - "request stage == ENGINEERING_REVIEW, else ERR_REVIEW_STAGE_MISMATCH"
          - "X-User-ID != design_critique_reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "appends a ReviewRecord with resulting_proposal_state = REJECTED"
          - "sets engineering_reviewer_user_id = X-User-ID"
          - "clears required_evidence_kinds to [] and submitted_evidence_kinds to []"
          - "increments ContributionProposal.version by 1"
        note: "terminal branch; BLOCK is only available from ENGINEERING_REVIEW, never from DESIGN_CRITIQUE"
      - from: READY_FOR_ACCEPTANCE
        to: ACCEPTED
        trigger: "POST /design-system/contribution-proposals/{id}/accept"
        actor: DesignSystemLead
        preconditions:
          - "payload expected_component_version == Component(target_component_id).version, else ERR_STALE_COMPONENT_VERSION"
          - "TokenSet(pinned_token_set_id).version == pinned_token_set_version, else ERR_PINNED_TOKEN_SET_STALE"
          - "Release(release_id).state == DRAFT, else ERR_INVALID_RELEASE_STATE"
          - "set(submitted_evidence_kinds) is a superset of set(required_evidence_kinds), else ERR_ACCEPTANCE_EVIDENCE_INCOMPLETE"
        side_effects:
          - "sets state = ACCEPTED, accepted_at = logical clock, released_in_release_id = release_id"
          - "sets Component.docs_state = PUBLISHED and Component.docs_last_reviewed_at = logical clock when DOC_PAGE is in submitted_evidence_kinds"
          - "CASCADE HOP 1 (only when proposal_kind == BREAKING_CHANGE): increments Component.current_major_version by 1 and Component.pending_breaking_change_count by 1, and increments Component.version by 1"
          - "CASCADE HOP 2 (caused by hop 1's Component.current_major_version change, not by the accept itself): every ComponentDependency whose provider_component_id == Component.id and whose pinned_provider_major < the new current_major_version flips compatibility_state COMPATIBLE -> INCOMPATIBLE, and each affected consumer Component's blocked_dependency_count is recomputed upward"
          - "CASCADE HOP 3 (caused by hop 2's consumer blocked_dependency_count change): every PlatformImplementation of an affected consumer Component whose status == SHIPPED moves SHIPPED -> BLOCKED with blocked_reason = UPSTREAM_BREAKING_CHANGE, and that consumer's shipped_platform_count / coverage_state are recomputed"
          - "CASCADE HOP 4 (caused by hop 3's implementation status change): Team(consumer.owning_team_id).blocked_implementation_count is recomputed upward"
          - "increments ContributionProposal.version by 1"
        note: "OCC-guarded write; hops 2-4 each fire because of the preceding hop's mutation, never directly from the accept call"

  # ---- Component, maturity dimension (independent of lifecycle) -------------
  - entity: Component
    dimension: maturity_level
    initial_state: EXPERIMENTAL
    terminal_states: []
    transitions:
      - from: EXPERIMENTAL
        to: BETA
        trigger: "POST /design-system/components/{id}/promote-maturity with target_maturity_level=BETA"
        actor: DesignSystemLead
        preconditions:
          - "shipped_platform_count >= 1, else ERR_PLATFORM_COVERAGE_INSUFFICIENT (the empty-SHIPPED-set edge)"
          - "governance_conformance_score >= 70.00, else ERR_A11Y_CONFORMANCE_INSUFFICIENT"
          - "blocked_dependency_count == 0, else ERR_BLOCKED_DEPENDENCY"
          - "no DeprecationPlan for this component in state IN {ANNOUNCED, SUNSET}, else ERR_COMPONENT_DEPRECATION_IN_PROGRESS"
        side_effects:
          - "sets maturity_level = BETA and maturity_demotion_reason = NONE"
          - "resets conformance_baseline_at = logical clock"
          - "recomputes governance_conformance_score against the new baseline (evidence older than the reset is dropped from the sweep)"
          - "increments Component.version by 1"
      - from: BETA
        to: STABLE
        trigger: "POST /design-system/components/{id}/promote-maturity with target_maturity_level=STABLE"
        actor: DesignSystemLead
        preconditions:
          - "coverage_state IN {PARTIAL, FULL}, else ERR_PLATFORM_COVERAGE_INSUFFICIENT"
          - "governance_conformance_score >= 90.00, else ERR_A11Y_CONFORMANCE_INSUFFICIENT"
          - "docs_state == PUBLISHED, else ERR_INVALID_COMPONENT_MATURITY_TRANSITION"
          - "blocked_dependency_count == 0, else ERR_BLOCKED_DEPENDENCY"
          - "no DeprecationPlan for this component in state IN {ANNOUNCED, SUNSET}, else ERR_COMPONENT_DEPRECATION_IN_PROGRESS"
        side_effects:
          - "sets maturity_level = STABLE and maturity_demotion_reason = NONE"
          - "resets conformance_baseline_at = logical clock"
          - "recomputes governance_conformance_score against the new baseline"
          - "increments Component.version by 1"
      - from: STABLE
        to: BETA
        trigger: "system: cascade hop 3 of the DeprecationPlan ANNOUNCED->SUNSET transition on a provider component"
        actor: system
        preconditions:
          - "blocked_dependency_count transitioned from 0 to a positive value in the same request"
        side_effects:
          - "sets maturity_level = BETA and maturity_demotion_reason = UPSTREAM_SUNSET"
          - "increments Component.version by 1"
        note: "closes the maturity cycle STABLE -> BETA -> STABLE; conformance_baseline_at is NOT reset by a demotion"
      - from: BETA
        to: BETA
        trigger: "system: filing an AccessibilityAudit whose governance_sweep score drops governance_conformance_score below 70.00"
        actor: system
        preconditions:
          - "maturity_level == BETA and the recomputed governance_conformance_score < 70.00"
        side_effects:
          - "sets maturity_demotion_reason = CONFORMANCE_REGRESSION (maturity_level stays BETA; EXPERIMENTAL is never re-entered)"
          - "increments Component.version by 1"

  # ---- Component, lifecycle dimension (independent of maturity) -------------
  - entity: Component
    dimension: lifecycle_state
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: DEPRECATION_ANNOUNCED
        trigger: "system: DeprecationPlan DRAFT->ANNOUNCED for this component"
        actor: system
        preconditions:
          - "lifecycle_state == ACTIVE"
        side_effects:
          - "sets lifecycle_state = DEPRECATION_ANNOUNCED"
          - "increments Component.version by 1"
      - from: DEPRECATION_ANNOUNCED
        to: SUNSET
        trigger: "system: DeprecationPlan ANNOUNCED->SUNSET for this component"
        actor: system
        preconditions:
          - "lifecycle_state == DEPRECATION_ANNOUNCED"
        side_effects:
          - "sets lifecycle_state = SUNSET"
          - "increments Component.version by 1"
      - from: SUNSET
        to: REMOVED
        trigger: "system: DeprecationPlan SUNSET->REMOVED for this component"
        actor: system
        preconditions:
          - "lifecycle_state == SUNSET"
        side_effects:
          - "sets lifecycle_state = REMOVED"
          - "moves every PlatformImplementation of this component whose status IN {PLANNED, SHIPPED, BLOCKED} to RETIRED"
          - "recomputes shipped_platform_count = 0 and coverage_state = NONE"
          - "increments Component.version by 1"
      - from: DEPRECATION_ANNOUNCED
        to: ACTIVE
        trigger: "system: DeprecationPlan ANNOUNCED->RESCINDED for this component"
        actor: system
        preconditions:
          - "lifecycle_state == DEPRECATION_ANNOUNCED"
        side_effects:
          - "sets lifecycle_state = ACTIVE"
          - "increments Component.version by 1"
      - from: SUNSET
        to: ACTIVE
        trigger: "system: DeprecationPlan SUNSET->RESCINDED for this component"
        actor: system
        preconditions:
          - "lifecycle_state == SUNSET"
        side_effects:
          - "sets lifecycle_state = ACTIVE"
          - "gives back exactly DeprecationPlan.blocked_dependent_count consumer blocks: every ComponentDependency whose provider_component_id == this component and whose compatibility_state == SUNSET_PROVIDER returns to COMPATIBLE, and each consumer's blocked_dependency_count is recomputed downward"
          - "increments Component.version by 1"
        note: "compensating branch of the sunset cascade; the conserved quantity is the dependency-block total"

  # ---- Platform implementation: cyclic ship/block/re-ship ------------------
  - entity: PlatformImplementation
    dimension: status
    initial_state: PLANNED
    terminal_states: [RETIRED]
    transitions:
      - from: PLANNED
        to: SHIPPED
        trigger: "POST /design-system/platform-implementations/{id}/ship"
        actor: ContributingTeam
        preconditions:
          - "X-User-ID == Component(component_id).owning_team_id, else ERR_NOT_RESOURCE_OWNER"
          - "Component(component_id).lifecycle_state IN {ACTIVE, DEPRECATION_ANNOUNCED}, else ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP"
          - "the highest-audit_sequence AUTOMATED AA AccessibilityAudit for this implementation exists and has violations_critical == 0, else ERR_A11Y_CRITICAL_VIOLATIONS_OPEN"
          - "payload token_compliance_ratio >= 0.90, else ERR_INVALID_REQUEST"
          - "Component(component_id).blocked_dependency_count == 0, else ERR_BLOCKED_DEPENDENCY"
        side_effects:
          - "sets status = SHIPPED, shipped_at = logical clock, blocked_reason = NONE"
          - "overwrites package_version and token_compliance_ratio from the payload"
          - "recomputes Component.shipped_platform_count and Component.coverage_state per calculations.platform_coverage_state"
          - "recomputes Component.governance_conformance_score per calculations.a11y_conformance_score governance_sweep variant"
          - "increments PlatformImplementation.version by 1 and Component.version by 1"
      - from: SHIPPED
        to: BLOCKED
        trigger: "system: cascade hop 3 of the ContributionProposal READY_FOR_ACCEPTANCE->ACCEPTED transition on a provider component"
        actor: system
        preconditions:
          - "the owning Component's blocked_dependency_count became positive in the same request"
        side_effects:
          - "sets status = BLOCKED and blocked_reason = UPSTREAM_BREAKING_CHANGE"
          - "recomputes Component.shipped_platform_count and Component.coverage_state downward"
          - "increments PlatformImplementation.version by 1"
      - from: BLOCKED
        to: SHIPPED
        trigger: "POST /design-system/platform-implementations/{id}/ship"
        actor: ContributingTeam
        preconditions:
          - "X-User-ID == Component(component_id).owning_team_id, else ERR_NOT_RESOURCE_OWNER"
          - "Component(component_id).blocked_dependency_count == 0, else ERR_BLOCKED_DEPENDENCY (the consumer must first re-pin its ComponentDependency to the provider's new major)"
          - "the highest-audit_sequence AUTOMATED AA AccessibilityAudit has violations_critical == 0, else ERR_A11Y_CRITICAL_VIOLATIONS_OPEN"
          - "payload token_compliance_ratio >= 0.90, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets status = SHIPPED, shipped_at = logical clock, blocked_reason = NONE"
          - "recomputes Component.shipped_platform_count / coverage_state / governance_conformance_score"
          - "recomputes Team(Component.owning_team_id).blocked_implementation_count downward"
          - "increments PlatformImplementation.version by 1 and Component.version by 1"
        note: "closes the SHIPPED -> BLOCKED -> SHIPPED cycle"
      - from: SHIPPED
        to: RETIRED
        trigger: "system: Component lifecycle_state SUNSET->REMOVED"
        actor: system
        preconditions:
          - "the owning Component reached lifecycle_state REMOVED in the same request"
        side_effects:
          - "sets status = RETIRED"
          - "increments PlatformImplementation.version by 1"
      - from: BLOCKED
        to: RETIRED
        trigger: "system: Component lifecycle_state SUNSET->REMOVED"
        actor: system
        preconditions:
          - "the owning Component reached lifecycle_state REMOVED in the same request"
        side_effects:
          - "sets status = RETIRED"
          - "recomputes Team(Component.owning_team_id).blocked_implementation_count downward"
          - "increments PlatformImplementation.version by 1"
      - from: PLANNED
        to: RETIRED
        trigger: "system: Component lifecycle_state SUNSET->REMOVED"
        actor: system
        preconditions:
          - "the owning Component reached lifecycle_state REMOVED in the same request"
        side_effects:
          - "sets status = RETIRED"
          - "increments PlatformImplementation.version by 1"

  # ---- Deprecation plan: forward advance + compensating rescind -------------
  - entity: DeprecationPlan
    dimension: state
    initial_state: DRAFT
    terminal_states: [REMOVED, RESCINDED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /design-system/deprecation-plans/{id}/migration-guide with publish=true"
        actor: DesignSystemLead
        preconditions:
          - "payload migration_guide_url is non-blank, else ERR_INVALID_REQUEST"
          - "Component(component_id).lifecycle_state == ACTIVE, else ERR_INVALID_DEPRECATION_PLAN_STATE"
          - "when Component(component_id).maturity_level == STABLE, publish must be true (a STABLE component may not be announced without a published guide), else ERR_MIGRATION_GUIDE_REQUIRED"
        side_effects:
          - "sets migration_guide_url and migration_guide_state = PUBLISHED"
          - "sets state = ANNOUNCED"
          - "drives Component lifecycle_state ACTIVE -> DEPRECATION_ANNOUNCED"
          - "increments DeprecationPlan.version by 1"
        note: "publish=false only sets migration_guide_url and migration_guide_state = DRAFT and leaves state = DRAFT"
      - from: ANNOUNCED
        to: SUNSET
        trigger: "POST /design-system/deprecation-plans/{id}/advance"
        actor: DesignSystemLead
        preconditions:
          - "logical clock >= sunset_at, else ERR_DEPRECATION_ADVANCE_NOT_DUE"
          - "migration_guide_state == PUBLISHED, else ERR_MIGRATION_GUIDE_REQUIRED"
        side_effects:
          - "sets state = SUNSET"
          - "CASCADE HOP 1: drives Component lifecycle_state DEPRECATION_ANNOUNCED -> SUNSET and increments that Component.version by 1"
          - "CASCADE HOP 2 (caused by hop 1's Component.lifecycle_state change): every ComponentDependency whose provider_component_id == component_id and whose compatibility_state == COMPATIBLE flips to SUNSET_PROVIDER; each consumer Component's blocked_dependency_count is recomputed upward; DeprecationPlan.blocked_dependent_count is set to the number of consumer Components whose blocked_dependency_count increased"
          - "CASCADE HOP 3 (caused by hop 2's consumer blocked_dependency_count change): every affected consumer Component whose maturity_level == STABLE is demoted to BETA with maturity_demotion_reason = UPSTREAM_SUNSET"
          - "increments DeprecationPlan.version by 1"
      - from: SUNSET
        to: REMOVED
        trigger: "POST /design-system/deprecation-plans/{id}/advance"
        actor: DesignSystemLead
        preconditions:
          - "logical clock >= removal_at, else ERR_DEPRECATION_ADVANCE_NOT_DUE"
        side_effects:
          - "sets state = REMOVED"
          - "drives Component lifecycle_state SUNSET -> REMOVED (which retires every PlatformImplementation of that component)"
          - "increments DeprecationPlan.version by 1"
      - from: ANNOUNCED
        to: RESCINDED
        trigger: "POST /design-system/deprecation-plans/{id}/rescind"
        actor: DesignSystemLead
        preconditions:
          - "state IN {ANNOUNCED, SUNSET}, else ERR_INVALID_DEPRECATION_PLAN_STATE"
        side_effects:
          - "sets state = RESCINDED and rescinded_at = logical clock"
          - "drives Component lifecycle_state DEPRECATION_ANNOUNCED -> ACTIVE"
          - "releases the plan's half-open [announced_at, removal_at) occupancy window on the component"
          - "increments DeprecationPlan.version by 1"
      - from: SUNSET
        to: RESCINDED
        trigger: "POST /design-system/deprecation-plans/{id}/rescind"
        actor: DesignSystemLead
        preconditions:
          - "state IN {ANNOUNCED, SUNSET}, else ERR_INVALID_DEPRECATION_PLAN_STATE"
        side_effects:
          - "sets state = RESCINDED and rescinded_at = logical clock"
          - "drives Component lifecycle_state SUNSET -> ACTIVE, which returns every SUNSET_PROVIDER ComponentDependency of this component to COMPATIBLE and decrements each consumer's blocked_dependency_count by exactly the amount hop 2 of the sunset added"
          - "sets blocked_dependent_count = 0"
          - "releases the plan's half-open occupancy window on the component"
          - "increments DeprecationPlan.version by 1"
        note: "exact compensation of the ANNOUNCED->SUNSET cascade; consumer maturity demotions caused by UPSTREAM_SUNSET are NOT auto-promoted back (a demotion is a governance fact), which is why the conserved quantity is the dependency-block total and not maturity_level"

  # ---- Exception grant: request / decide / repay / expire -------------------
  - entity: ExceptionGrant
    dimension: state
    initial_state: REQUESTED
    terminal_states: [DENIED, REPAID]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /design-system/exception-grants/{id}/decision with decision=APPROVE"
        actor: DesignSystemLead
        preconditions:
          - "state == REQUESTED, else ERR_INVALID_EXCEPTION_GRANT_STATE"
          - "Component(substitute_for_component_id).lifecycle_state != REMOVED, else ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP"
          - "Team(requesting_team_id).outstanding_debt_points + this grant's computed grant_points <= Team.debt_budget_points, else ERR_TEAM_DEBT_BUDGET_EXCEEDED"
        side_effects:
          - "pins pinned_maturity_level = Component(substitute_for_component_id).maturity_level"
          - "computes and freezes debt_points per calculations.exception_debt_points"
          - "sets state = APPROVED, decided_by_user_id = X-User-ID, decided_at = logical clock"
          - "recomputes Team.outstanding_debt_points, Team.lifetime_debt_points and Team.debt_state"
          - "recomputes Component.one_off_exception_count upward"
          - "increments ExceptionGrant.version by 1 and Team.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /design-system/exception-grants/{id}/decision with decision=DENY"
        actor: DesignSystemLead
        preconditions:
          - "state == REQUESTED, else ERR_INVALID_EXCEPTION_GRANT_STATE"
        side_effects:
          - "sets state = DENIED, decided_by_user_id = X-User-ID, decided_at = logical clock; debt_points stays 0.00"
          - "increments ExceptionGrant.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the logical clock to or past expires_at"
        actor: system
        preconditions:
          - "state == APPROVED and expires_at <= the new logical clock"
        side_effects:
          - "sets state = EXPIRED; debt_points is retained and outstanding_debt_points does NOT fall (expiry is not repayment)"
          - "increments ExceptionGrant.version by 1"
        note: "grants are expired in created_at ASC order within one clock advance so that budget checks in the same request see a deterministic sequence"
      - from: APPROVED
        to: REPAID
        trigger: "POST /design-system/exception-grants/{id}/repay"
        actor: ContributingTeam
        preconditions:
          - "X-User-ID == requesting_team_id, else ERR_NOT_RESOURCE_OWNER"
          - "state IN {APPROVED, EXPIRED}, else ERR_INVALID_EXCEPTION_GRANT_STATE"
        side_effects:
          - "sets state = REPAID and repaid_at = logical clock; debt_points is retained on the row as the historic amount"
          - "recomputes Team.outstanding_debt_points downward by exactly this grant's debt_points, leaving Team.lifetime_debt_points unchanged"
          - "recomputes Team.debt_state"
          - "recomputes Component.one_off_exception_count downward"
          - "increments ExceptionGrant.version by 1 and Team.version by 1"
      - from: EXPIRED
        to: REPAID
        trigger: "POST /design-system/exception-grants/{id}/repay"
        actor: ContributingTeam
        preconditions:
          - "X-User-ID == requesting_team_id, else ERR_NOT_RESOURCE_OWNER"
          - "state IN {APPROVED, EXPIRED}"
        side_effects:
          - "same as APPROVED -> REPAID"
          - "increments ExceptionGrant.version by 1 and Team.version by 1"

  # ---- Release: draft then publish ----------------------------------------
  - entity: Release
    dimension: state
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /design-system/releases/{id}/publish"
        actor: SystemAdmin
        preconditions:
          - "state == DRAFT, else ERR_INVALID_RELEASE_STATE"
          - "at least one ContributionProposal has released_in_release_id == this release and state == ACCEPTED, else ERR_INVALID_RELEASE_STATE"
          - "after calculations.release_version_bump has run, every carried proposal whose effective_change_class == MAJOR has MIGRATION_GUIDE in its submitted_evidence_kinds, else ERR_MIGRATION_GUIDE_REQUIRED (a MINOR proposal escalated to MAJOR by the BATCHED tier can fail here even though its own accept gate passed)"
        side_effects:
          - "runs calculations.release_version_bump and writes raw_change_class / effective_change_class on every carried proposal plus semver, policy_tier, breaking_ratio, breaking_change_count, escalated_proposal_count on the release"
          - "sets state = PUBLISHED, release_notes_state = PUBLISHED, published_at = logical clock"
          - "resets Component.pending_breaking_change_count to 0 for every target component of a carried BREAKING_CHANGE proposal"
          - "increments Release.version by 1 and each carried ContributionProposal.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: proposal-accept-stale-component
    parent_entity: Component
    write_endpoint: "POST /design-system/contribution-proposals/{id}/accept"
    occ_field: "expected_component_version"
    description: |
      Accepting a proposal against a Component whose version has advanced since
      the DesignSystemLead last read it is rejected as a stale write. This is a
      genuine race rather than a state precondition: two different proposals may
      each legitimately reach READY_FOR_ACCEPTANCE against the same component and
      each accept is individually valid, so the second accept cannot be refused by
      any state check - it is refused only because the accepting client's view of
      the component's major version and blocked-dependency picture is out of date.
    error_id: ERR_STALE_COMPONENT_VERSION
    http_status: 412

  - rule_id: token-create-stale-token-set
    parent_entity: TokenSet
    write_endpoint: "POST /design-system/tokens"
    occ_field: "expected_token_set_version"
    description: |
      Adding a DesignToken to a TokenSet whose version has advanced since the
      author last read it is rejected as a stale write. A second sequential token
      creation with a different name is legitimate under the product semantics, so
      no state precondition rejects it; the rejection exists purely so a brand or
      theming layer added by another author cannot be silently overwritten by an
      author who never saw it.
    error_id: ERR_STALE_TOKEN_SET_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: a11y_conformance_score
    trigger: "on POST /design-system/platform-implementations/{id}/accessibility-audits (both variants), on POST /design-system/platform-implementations/{id}/ship (governance_sweep variant, writing Component.governance_conformance_score) and on POST /design-system/components/{id}/promote-maturity (governance_sweep variant, after the baseline reset)"
    algorithm: weighted_scoring
    formula: |
      DEFECT LOAD (per AccessibilityAudit row, stored on the row):
        defect_load = 10 * violations_critical + 4 * violations_serious + 1 * violations_moderate

      QUALIFYING EVIDENCE for a PlatformImplementation impl:
        Q = { AccessibilityAudit a : a.platform_implementation_id == impl.id
                                     AND a.wcag_level == 'AA' }
        (A-level and AAA-level audits are filed and stored but never enter the score.)

      PER-METHOD LOAD, variant `latest_evidence`:
        for m in {AUTOMATED, MANUAL}:
          Qm = { a in Q : a.method == m }
          L(m) = defect_load of the single row of Qm with the greatest audit_sequence
                 (audit_sequence is a server-minted per-implementation monotonic
                  integer, never the row id); L(m) = MISSING when Qm is empty.

      PER-METHOD LOAD, variant `governance_sweep`:
        for m in {AUTOMATED, MANUAL}:
          Qm = { a in Q : a.method == m
                          AND a.audited_at >= Component.conformance_baseline_at }
          L(m) = MAX over Qm of defect_load  (worst evidence in the window, not latest)
          L(m) = MISSING when Qm is empty.

      SCORE (identical arithmetic for both variants, only the L(m) selection differs):
        missing_methods = count of m in {AUTOMATED, MANUAL} with L(m) == MISSING
        loaded = AUTOMATED_WEIGHT * (L(AUTOMATED) if present else 0)
               + MANUAL_WEIGHT    * (L(MANUAL)    if present else 0)
        raw = 100 - loaded - MISSING_METHOD_PENALTY * missing_methods
        score = round_half_up(max(raw, 0.00), 2)

      ROLL-UP to the component (governance_sweep variant only):
        S = { PlatformImplementation p : p.component_id == c.id
                                         AND p.status IN {SHIPPED, BLOCKED} }
        Component.governance_conformance_score =
            0.00                     when S is empty
            MIN over S of score(p)   otherwise
    input_set: "AA-level AccessibilityAudit rows of the implementation. latest_evidence takes exactly one row per method (greatest audit_sequence). governance_sweep takes the worst row per method among those with audited_at >= Component.conformance_baseline_at, so a promotion's baseline reset can drop historic evidence out of the window entirely."
    constants:
      CRITICAL_WEIGHT: 10
      SERIOUS_WEIGHT: 4
      MODERATE_WEIGHT: 1
      AUTOMATED_WEIGHT: 0.4
      MANUAL_WEIGHT: 0.6
      MISSING_METHOD_PENALTY: 25.0
      BETA_MIN_SCORE: 70.00
      STABLE_MIN_SCORE: 90.00
    precision: "2 decimal places, round_half_up; floored at 0.00, never negative"
    variants:
      - name: latest_evidence
        when: "written to PlatformImplementation.conformance_score on every audit filing; this is the number an implementing engineer sees"
        difference: "selects the single greatest-audit_sequence AA audit per method and ignores every earlier audit, so remediating a bad audit with a good one immediately raises the score"
      - name: governance_sweep
        when: "written to Component.governance_conformance_score and used by every maturity-promotion gate"
        difference: "selects the WORST AA audit per method within the conformance_baseline_at window, so an earlier bad audit keeps depressing the component score until the baseline is reset by a promotion; identical evidence therefore yields a strictly lower number than latest_evidence whenever any superseded audit was worse than the latest"

  - name: team_adoption_index
    trigger: "on POST /design-system/teams/{id}/adoption-scans (writes Team.adoption_index_latest and Team.adoption_index_trailing) and on GET /design-system/teams/{id}/dashboard (selects which variant to surface via the `view` query field)"
    algorithm: aggregation
    formula: |
      PER-SCAN RATIO (stored on the AdoptionScan row):
        denom = system_instance_count + legacy_instance_count + one_off_instance_count
        adoption_ratio = 0.00 when denom == 0
                       = round_half_up(100 * system_instance_count / denom, 2) otherwise

      RECENCY ORDER within one (team_id, scan_kind) group, most recent first:
        ORDER BY window_end_at DESC, scanned_at DESC, created_at DESC
        (no id ever participates in this ordering)

      variant `latest_scan`:
        for k in {CODE_SCAN, DESIGN_LINT}:
          R(k) = adoption_ratio of the first row in the recency order of group k
               = 0.00 when group k is empty
        index = round_half_up(CODE_SCAN_WEIGHT * R(CODE_SCAN)
                              + DESIGN_LINT_WEIGHT * R(DESIGN_LINT), 2)

      variant `trailing_window`:
        for k in {CODE_SCAN, DESIGN_LINT}:
          T(k) = the first min(2, group size) rows in the recency order of group k
          A(k) = 0.00 when T(k) is empty
               = round_half_up(sum of adoption_ratio over T(k) / |T(k)|, 2)
        index = round_half_up(CODE_SCAN_WEIGHT * A(CODE_SCAN)
                              + DESIGN_LINT_WEIGHT * A(DESIGN_LINT), 2)
    input_set: "every AdoptionScan row of the team, partitioned by scan_kind. AdoptionScan is append-only and immutable, so both variants read the same rows; latest_scan uses exactly one row per kind, trailing_window averages the two most recent rows per kind."
    constants:
      CODE_SCAN_WEIGHT: 0.70
      DESIGN_LINT_WEIGHT: 0.30
      TRAILING_WINDOW_SIZE: 2
    precision: "2 decimal places, round_half_up at each of the two stages (per-scan ratio, then per-kind average, then the weighted index)"
    variants:
      - name: latest_scan
        when: "Team.adoption_index_latest, and GET /design-system/teams/{id}/dashboard with view=LATEST_SCAN (the default)"
        difference: "one row per kind; a single good scan immediately moves the dashboard"
      - name: trailing_window
        when: "Team.adoption_index_trailing, and GET /design-system/teams/{id}/dashboard with view=TRAILING_WINDOW"
        difference: "averages the two most recent rows per kind before weighting, so a team that has just improved reads materially lower than under latest_scan on identical scan rows"

  - name: exception_debt_points
    trigger: "on POST /design-system/exception-grants/{id}/decision with decision=APPROVE (freezes ExceptionGrant.debt_points), and on every mutation that changes an ExceptionGrant's state (recomputes Team.outstanding_debt_points / lifetime_debt_points / debt_state)"
    algorithm: tiered_pricing
    formula: |
      PER-GRANT POINTS (frozen onto the row at approval):
        base       = BASE_POINTS_BY_KIND[grant.exception_kind]
        plat_mult  = PLATFORM_MULTIPLIER[grant.platform_scope]
        mat_mult   = MATURITY_MULTIPLIER[grant.pinned_maturity_level]
                     (pinned_maturity_level is the substitute component's
                      maturity_level observed at approval; a later demotion or
                      promotion never restates an already-frozen grant)
        grant_points = round_half_up(base * plat_mult * mat_mult, 2)
                       # <-- ROUNDING HAPPENS HERE, ONCE PER GRANT

      TEAM ROLL-UP (pinned evaluation order: round per grant FIRST, then sum):
        outstanding_debt_points = round_half_up(
            SUM over { g : g.requesting_team_id == team.id
                           AND g.state IN {APPROVED, EXPIRED} } of g.debt_points, 2)
        lifetime_debt_points    = round_half_up(
            SUM over { g : g.requesting_team_id == team.id
                           AND g.state IN {APPROVED, EXPIRED, REPAID} } of g.debt_points, 2)
        debt_state = FROZEN when outstanding_debt_points >= debt_budget_points else CLEAR

      REJECTED ALTERNATIVE (explicitly NOT the rule): summing the unrounded
      products base * plat_mult * mat_mult and rounding once at the end. The two
      orders diverge: three RAW_TOKEN_USAGE / IOS / BETA grants give
      round(5*1.25*0.75, 2) * 3 = 4.69 * 3 = 14.07 under the pinned order and
      round(3 * 4.6875, 2) = 14.06 under the rejected order.
    input_set: "ExceptionGrant rows of the team filtered by state; REQUESTED and DENIED grants carry debt_points 0.00 and never enter either sum. EXPIRED grants stay inside outstanding_debt_points - expiry is a governance escalation, not a repayment."
    constants:
      BASE_POINTS_BY_KIND: { ONE_OFF_COMPONENT: 12, FORK_OF_SYSTEM_COMPONENT: 8, RAW_TOKEN_USAGE: 5 }
      PLATFORM_MULTIPLIER: { WEB: 1.00, IOS: 1.25, ANDROID: 1.25, ALL: 1.75 }
      MATURITY_MULTIPLIER: { EXPERIMENTAL: 0.50, BETA: 0.75, STABLE: 1.50 }
    precision: "2 decimal places, round_half_up, applied per grant before summation and once again on the sum"
    variants:
      - name: grant_points
        when: "at approval, written to ExceptionGrant.debt_points"
        difference: "single-grant tiered product, rounded immediately"
      - name: team_rollup
        when: "on every ExceptionGrant state change, written to Team.outstanding_debt_points / lifetime_debt_points"
        difference: "sums already-rounded per-grant values; the rounding order is pinned so the roll-up is reproducible from the stored rows alone"

  - name: release_version_bump
    trigger: "on POST /design-system/releases/{id}/publish"
    algorithm: constraint_propagation
    formula: |
      CARRIED SET (order-independent; every step below is a set computation):
        C = { ContributionProposal p : p.released_in_release_id == release.id
                                       AND p.state == ACCEPTED }
        total_count = |C|   (publish is refused when total_count == 0)

      STEP 1 - raw_change_class(p), written to p.raw_change_class:
        BREAKING_CHANGE                        -> MAJOR
        NEW_COMPONENT                          -> MINOR
        ENHANCEMENT AND touches_public_api      -> MINOR
        ENHANCEMENT AND NOT touches_public_api  -> PATCH

      STEP 2 - maturity_adjusted_class(p):
        MAJOR -> MINOR when Component(p.target_component_id).maturity_level
                           == EXPERIMENTAL at publish time
                 (an EXPERIMENTAL component carries no stability contract)
        otherwise unchanged.

      STEP 3 - breaking_ratio (PINNED: computed from the STEP-2 classes, never
               from the STEP-1 classes and never from the STEP-5 classes):
        major_2 = |{ p in C : maturity_adjusted_class(p) == MAJOR }|
        breaking_ratio = round_half_up(major_2 / total_count, 4)

      STEP 4 - policy_tier:
        BATCHED     when breaking_ratio >= BATCHED_RATIO_THRESHOLD
        INCREMENTAL otherwise

      STEP 5 - effective_change_class(p), written to p.effective_change_class:
        policy_tier == BATCHED:
            maturity_adjusted_class(p) == MINOR AND p.touches_public_api
                -> MAJOR   (batched breaking window absorbs public-API minors)
            otherwise maturity_adjusted_class(p)
        policy_tier == INCREMENTAL:
            maturity_adjusted_class(p)

      STEP 6 - PINNED: breaking_ratio and policy_tier are NOT recomputed from the
        STEP-5 classes. The evaluation is a single forward pass; no fixed point is
        sought even though STEP 5 can change the very population STEP 3 measured.
        effective_major_count = |{ p in C : effective_change_class(p) == MAJOR }|
        escalated_proposal_count =
            |{ p in C : effective_change_class(p) != raw_change_class(p) }|
        (base_major, base_minor, base_patch) = parse(release.semver_base)
        semver = f"{base_major+1}.0.0"                when effective_major_count >= 1
               = f"{base_major}.{base_minor+1}.0"     when no MAJOR but some MINOR
               = f"{base_major}.{base_minor}.{base_patch+1}"   otherwise
        breaking_change_count = effective_major_count
    input_set: "ACCEPTED proposals whose released_in_release_id points at this release. Proposals in any other state, and proposals attached to a different release, are excluded. Component maturity is read at publish time, not at accept time."
    constants:
      BATCHED_RATIO_THRESHOLD: 0.50
    precision: "breaking_ratio to 4 decimal places, round_half_up; counts are integers; semver components are integers"
    variants:
      - name: single_pass_pinned
        when: "always - this is the only sanctioned evaluation order"
        difference: "breaking_ratio comes from step 2 and is never refreshed after step 5"
      - name: naive_fixed_point
        when: "never - documented only to name the divergence the pinned order forbids"
        difference: "computing breaking_ratio from step-1 classes (or re-running steps 3-5 until stable) flips policy_tier for the very same carried set and multiplies breaking_change_count; e.g. two BREAKING_CHANGE proposals (one on an EXPERIMENTAL component) plus one public-API ENHANCEMENT give breaking_ratio 0.3333 / INCREMENTAL / breaking_change_count 1 under the pinned order and 0.6667 / BATCHED / breaking_change_count 3 under the naive order"

  - name: token_alias_resolution
    trigger: "on POST /design-system/tokens (writes alias_depth, resolved_value, TokenSet.token_count, TokenSet.max_alias_depth and enforces the cycle and depth rules) and on GET /design-system/token-sets/{id}/resolved-tokens"
    algorithm: topological
    formula: |
      LAYER SELECTION for a resolved-tokens read of (token_set_id, brand, mode):
        for each distinct token `name` in the set, choose the first present layer
        in this strictly ordered precedence list:
          1. (brand,  mode)
          2. (brand,  ANY)
          3. (BASE,   mode)
          4. (BASE,   ANY)
        Uniqueness on (token_set_id, name, brand, mode) makes each layer hold at
        most one row, so no tie-break is ever needed.

      ALIAS CHAIN RESOLUTION for a chosen token t:
        hops = 0; cur = t
        while cur.alias_of_token_id is not null:
            hops = hops + 1
            if hops > MAX_ALIAS_DEPTH -> ERR_TOKEN_ALIAS_DEPTH_EXCEEDED
            cur = DesignToken(cur.alias_of_token_id)
            if cur.id == t.id or cur has already been visited on this walk
               -> ERR_TOKEN_ALIAS_CYCLE
        t.alias_depth = hops
        t.resolved_value = cur.raw_value
        (alias targets are resolved by explicit id; the alias never re-enters
         layer selection, so a BRAND_A token aliasing a BASE token resolves to
         the BASE leaf value regardless of the read's brand)

      WRITE-TIME ENFORCEMENT on POST /design-system/tokens:
        a payload alias_of_token_id whose walk reaches the new token's own
        (token_set_id, name, brand, mode) coordinates, or reaches a token already
        visited, is refused with ERR_TOKEN_ALIAS_CYCLE (409) before any row is
        written; a walk longer than MAX_ALIAS_DEPTH hops is refused with
        ERR_TOKEN_ALIAS_DEPTH_EXCEEDED (422).

      TokenSet.max_alias_depth = MAX over the set's tokens of alias_depth (0 when empty)
    input_set: "DesignToken rows of one token_set_id. Alias edges may only point inside the same token set, so each token set is an independent DAG; cross-set aliases are refused at write time as ERR_INVALID_REQUEST."
    constants:
      MAX_ALIAS_DEPTH: 5
      LAYER_PRECEDENCE: ["(brand,mode)", "(brand,ANY)", "(BASE,mode)", "(BASE,ANY)"]
    precision: "integers for depth; resolved_value is the leaf raw_value string verbatim, never re-formatted"

  - name: platform_coverage_state
    trigger: "on POST /design-system/platform-implementations/{id}/ship, on the system SHIPPED->BLOCKED and *->RETIRED transitions, and on POST /design-system/components/{id}/platform-implementations"
    algorithm: aggregation
    formula: |
      P = { distinct p.platform : PlatformImplementation p,
                                  p.component_id == c.id,
                                  p.status == SHIPPED }
      shipped_platform_count = |P|
      coverage_state =
        NONE        when |P| == 0
        WEB_ONLY    when P == {WEB}
        MOBILE_ONLY when WEB not in P and |P| >= 1
        PARTIAL     when WEB in P and |P intersect {IOS, ANDROID}| == 1
        FULL        when WEB in P and {IOS, ANDROID} is a subset of P
      MATURITY GATES:
        BETA   requires shipped_platform_count >= 1
        STABLE requires coverage_state IN {PARTIAL, FULL}
    input_set: "PlatformImplementation rows of the component with status == SHIPPED exactly; PLANNED, BLOCKED and RETIRED rows are excluded, which is why a breaking-change cascade that blocks an implementation immediately downgrades coverage_state."
    constants:
      PLATFORMS: [WEB, IOS, ANDROID]
      MOBILE_PLATFORMS: [IOS, ANDROID]
    precision: "integer count 0..3; coverage_state is an enum"

  - name: deprecation_notice_window
    trigger: "on POST /design-system/components/{id}/deprecation-plans (freezes required_notice_days and actual_notice_days onto the plan)"
    algorithm: threshold
    formula: |
      base_days      = MIN_NOTICE_DAYS_BY_MATURITY[component.maturity_level]
      surcharge_days = COVERAGE_SURCHARGE_DAYS[component.coverage_state]
      required_notice_days = base_days + surcharge_days
      actual_notice_days   = floor((sunset_at - announced_at) / 86400 seconds)
      GATE A: actual_notice_days >= required_notice_days
              else ERR_DEPRECATION_NOTICE_TOO_SHORT
              (>= is inclusive: exactly required_notice_days passes)
      GATE B: floor((removal_at - sunset_at) / 86400 seconds) >= MIN_SUNSET_DAYS
              else ERR_DEPRECATION_NOTICE_TOO_SHORT
      OVERLAP GEOMETRY (half-open, adjacency permitted): the plan occupies
        [announced_at, removal_at) on its component. A new plan collides with an
        existing plan of the same component whose state IN {DRAFT, ANNOUNCED, SUNSET}
        when new.announced_at < existing.removal_at AND existing.announced_at < new.removal_at.
        Touching windows (new.announced_at == existing.removal_at) do NOT collide.
        Plans in state REMOVED or RESCINDED release their window and never collide.
    input_set: "the component's maturity_level and coverage_state as of plan creation, plus every DeprecationPlan of the same component whose state IN {DRAFT, ANNOUNCED, SUNSET}."
    constants:
      MIN_NOTICE_DAYS_BY_MATURITY: { EXPERIMENTAL: 14, BETA: 45, STABLE: 90 }
      COVERAGE_SURCHARGE_DAYS: { NONE: 0, WEB_ONLY: 0, MOBILE_ONLY: 0, PARTIAL: 15, FULL: 30 }
      MIN_SUNSET_DAYS: 30
      SECONDS_PER_DAY: 86400
    precision: "integer whole days, floor toward zero; comparisons are inclusive (>=)"

  - name: required_evidence_kinds
    trigger: "on POST /design-system/contribution-proposals/{id}/submit (both the DRAFT->DESIGN_CRITIQUE and the CHANGES_REQUESTED->DESIGN_CRITIQUE transition)"
    algorithm: aggregation
    formula: |
      base = BASE_EVIDENCE_BY_KIND[proposal.proposal_kind]
      parity = {PLATFORM_PARITY} when Component(target_component_id).coverage_state
                                     IN {PARTIAL, FULL} else {}
      required_evidence_kinds = sorted(base union parity)

      CARRY-OVER RULE on resubmit (CHANGES_REQUESTED -> DESIGN_CRITIQUE):
        submitted_evidence_kinds := sorted(
            set(submitted_evidence_kinds) intersect ROUND_DURABLE_KINDS)
        Every other kind must be re-filed against the new revision_round; this is
        why a proposal that satisfied its evidence gate in round 1 can fail
        ERR_ACCEPTANCE_EVIDENCE_INCOMPLETE in round 2 without any requirement
        having changed.

      ACCEPTANCE GATE:
        set(submitted_evidence_kinds) is a superset of set(required_evidence_kinds)
        else ERR_ACCEPTANCE_EVIDENCE_INCOMPLETE
    input_set: "proposal_kind, and the target component's coverage_state as of the submit call. Coverage measured at a later instant is irrelevant - the requirement set is frozen per round."
    constants:
      BASE_EVIDENCE_BY_KIND:
        NEW_COMPONENT: [A11Y_AUTOMATED, A11Y_MANUAL, DOC_PAGE, TOKEN_COMPLIANCE]
        ENHANCEMENT: [A11Y_AUTOMATED, TOKEN_COMPLIANCE]
        BREAKING_CHANGE: [A11Y_AUTOMATED, A11Y_MANUAL, DOC_PAGE, MIGRATION_GUIDE, TOKEN_COMPLIANCE]
      ROUND_DURABLE_KINDS: [DOC_PAGE, MIGRATION_GUIDE]
      ALL_EVIDENCE_KINDS: [A11Y_AUTOMATED, A11Y_MANUAL, DOC_PAGE, MIGRATION_GUIDE, PLATFORM_PARITY, TOKEN_COMPLIANCE]
    precision: "sets are stored as ascending-sorted arrays of the enum members, no duplicates"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty strings (a header sent as \"\" or as whitespace only is treated as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body / query shape: every required input field present, enum members valid, integers non-negative, numbers within their declared scale, datetimes ISO 8601 UTC, semver strings well-formed, limit within 1..100 and offset >= 0, exactly one of DesignToken.raw_value / alias_of_token_id non-null, PlatformImplementation ship token_compliance_ratio >= 0.90, DeprecationPlan announced_at < sunset_at < removal_at, AdoptionScan window_start_at < window_end_at, ComponentDependency consumer_component_id != provider_component_id, DesignToken alias target in the same token_set_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_TEAM_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_COMPONENT_DEPENDENCY_NOT_FOUND | ERR_PLATFORM_IMPLEMENTATION_NOT_FOUND | ERR_TOKEN_SET_NOT_FOUND | ERR_TOKEN_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_RELEASE_NOT_FOUND | ERR_DEPRECATION_PLAN_NOT_FOUND | ERR_EXCEPTION_GRANT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_TEAM_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_PLATFORM_IMPLEMENTATION_NOT_FOUND | ERR_TOKEN_SET_NOT_FOUND | ERR_TOKEN_NOT_FOUND | ERR_RELEASE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /design-system/components, POST /design-system/components/{id}/dependencies, POST /design-system/tokens, POST /design-system/contribution-proposals, POST /design-system/contribution-proposals/{id}/accept, POST /design-system/components/{id}/deprecation-plans, POST /design-system/exception-grants"

  - priority: 6
    category: auth
    check: "when X-User-Role == ContributingTeam, X-User-ID equals the owning Team id of the target resource (Team.id itself, Component.owning_team_id, Component(component_id).owning_team_id for an implementation, Component(consumer_component_id).owning_team_id for a ComponentDependency, ContributionProposal.author_team_id, ExceptionGrant.requesting_team_id, AdoptionScan.team_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include ContributingTeam"

  - priority: 7
    category: state
    check: "the target resource is in a state from which the requested transition is declared in section 1.2"
    error_id: "ERR_INVALID_PROPOSAL_STATE | ERR_INVALID_COMPONENT_MATURITY_TRANSITION | ERR_INVALID_IMPLEMENTATION_STATE | ERR_INVALID_DEPRECATION_PLAN_STATE | ERR_INVALID_EXCEPTION_GRANT_STATE | ERR_INVALID_RELEASE_STATE"
    http_status: 409
    applies_to: "every state-changing POST"

  - priority: 8
    category: state
    check: "Component(component_id).lifecycle_state IN {ACTIVE, DEPRECATION_ANNOUNCED} when shipping an implementation, and != REMOVED when approving an exception grant against it"
    error_id: ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP
    http_status: 409
    applies_to: "POST /design-system/platform-implementations/{id}/ship, POST /design-system/exception-grants/{id}/decision"

  - priority: 9
    category: state
    check: "the OCC field matches the parent's current version: expected_component_version == Component(target_component_id).version on accept; expected_token_set_version == TokenSet(token_set_id).version on every token write (POST /design-system/tokens and PUT /design-system/tokens/{id})"
    error_id: "ERR_STALE_COMPONENT_VERSION | ERR_STALE_TOKEN_SET_VERSION"
    http_status: 412
    applies_to: "POST /design-system/contribution-proposals/{id}/accept, POST /design-system/tokens, PUT /design-system/tokens/{id}"

  - priority: 10
    category: state
    check: "the review's stage matches the gate implied by the proposal's current state (DESIGN_CRITIQUE only from DESIGN_CRITIQUE, ENGINEERING_REVIEW only from ENGINEERING_REVIEW), and verdict=BLOCK is only accepted at the ENGINEERING_REVIEW stage"
    error_id: ERR_REVIEW_STAGE_MISMATCH
    http_status: 409
    applies_to: "POST /design-system/contribution-proposals/{id}/reviews"

  - priority: 11
    category: business_safety
    check: "segregation of duties: the reviewer's X-User-ID differs from the user id already recorded for the other review stage on this proposal (design_critique_reviewer_user_id when filing ENGINEERING_REVIEW, engineering_reviewer_user_id when filing DESIGN_CRITIQUE)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /design-system/contribution-proposals/{id}/reviews"

  - priority: 12
    category: business_safety
    check: "governance_conformance_score >= 70.00 for a BETA promotion and >= 90.00 for a STABLE promotion (inclusive at the boundary)"
    error_id: ERR_A11Y_CONFORMANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /design-system/components/{id}/promote-maturity"

  - priority: 13
    category: business_safety
    check: "the greatest-audit_sequence AUTOMATED AA AccessibilityAudit for the implementation exists and reports violations_critical == 0"
    error_id: ERR_A11Y_CRITICAL_VIOLATIONS_OPEN
    http_status: 422
    applies_to: "POST /design-system/platform-implementations/{id}/ship"

  - priority: 14
    category: business_referential
    check: "TokenSet(pinned_token_set_id).version still equals the proposal's pinned_token_set_version recorded at the most recent submit"
    error_id: ERR_PINNED_TOKEN_SET_STALE
    http_status: 409
    applies_to: "POST /design-system/contribution-proposals/{id}/accept"

  - priority: 15
    category: business_referential
    check: "no DeprecationPlan of the component is in state ANNOUNCED or SUNSET"
    error_id: ERR_COMPONENT_DEPRECATION_IN_PROGRESS
    http_status: 422
    applies_to: "POST /design-system/components/{id}/promote-maturity"

  - priority: 16
    category: business_referential
    check: "Component.blocked_dependency_count == 0 for the component being promoted or the component owning the implementation being shipped"
    error_id: ERR_BLOCKED_DEPENDENCY
    http_status: 409
    applies_to: "POST /design-system/components/{id}/promote-maturity, POST /design-system/platform-implementations/{id}/ship"

  - priority: 17
    category: business_referential
    check: "the requested alias edge does not close a cycle inside the token set"
    error_id: ERR_TOKEN_ALIAS_CYCLE
    http_status: 409
    applies_to: "POST /design-system/tokens, PUT /design-system/tokens/{id}"

  - priority: 18
    category: business_referential
    check: "the requested dependency edge does not close a cycle in the component dependency graph (transitive closure over ComponentDependency rows in any compatibility_state)"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 409
    applies_to: "POST /design-system/components/{id}/dependencies"

  - priority: 19
    category: business_constraint
    check: "uniqueness: Team.slug, Component.slug, TokenSet.slug globally; (component_id, platform) for PlatformImplementation; (consumer_component_id, provider_component_id) for ComponentDependency; (token_set_id, name, brand, mode) for DesignToken"
    error_id: "ERR_UNIQUENESS_CONFLICT | ERR_TOKEN_NAME_CONFLICT"
    http_status: 409
    applies_to: "POST /design-system/teams, POST /design-system/components, POST /design-system/token-sets, POST /design-system/tokens, POST /design-system/components/{id}/platform-implementations, POST /design-system/components/{id}/dependencies"

  - priority: 20
    category: business_constraint
    check: "the alias walk from the new token terminates within MAX_ALIAS_DEPTH = 5 hops"
    error_id: ERR_TOKEN_ALIAS_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /design-system/tokens, PUT /design-system/tokens/{id}"

  - priority: 21
    category: business_constraint
    check: "platform coverage sufficient for the requested maturity: shipped_platform_count >= 1 for BETA, coverage_state IN {PARTIAL, FULL} for STABLE"
    error_id: ERR_PLATFORM_COVERAGE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /design-system/components/{id}/promote-maturity"

  - priority: 22
    category: business_constraint
    check: "revision_round + 1 <= 3 on a resubmit"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /design-system/contribution-proposals/{id}/submit"

  - priority: 23
    category: business_constraint
    check: "set(submitted_evidence_kinds) is a superset of set(required_evidence_kinds)"
    error_id: ERR_ACCEPTANCE_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /design-system/contribution-proposals/{id}/accept"

  - priority: 24
    category: business_constraint
    check: "migration guide present where the governance policy demands it: migration_guide_state == PUBLISHED before an ANNOUNCED plan may advance to SUNSET; a STABLE component may not be announced with publish=false; every carried proposal whose effective_change_class resolves to MAJOR at publish time carries MIGRATION_GUIDE in submitted_evidence_kinds"
    error_id: ERR_MIGRATION_GUIDE_REQUIRED
    http_status: 422
    applies_to: "POST /design-system/deprecation-plans/{id}/migration-guide, POST /design-system/deprecation-plans/{id}/advance, POST /design-system/releases/{id}/publish"

  - priority: 25
    category: business_temporal
    check: "actual_notice_days >= required_notice_days AND floor((removal_at - sunset_at)/86400) >= 30"
    error_id: ERR_DEPRECATION_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /design-system/components/{id}/deprecation-plans"

  - priority: 26
    category: business_constraint
    check: "the new plan's half-open window [announced_at, removal_at) does not intersect the window of any DeprecationPlan of the same component whose state IN {DRAFT, ANNOUNCED, SUNSET}; adjacency (new.announced_at == existing.removal_at) is permitted"
    error_id: ERR_DEPRECATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /design-system/components/{id}/deprecation-plans"

  - priority: 27
    category: business_constraint
    check: "the new scan's CLOSED window [window_start_at, window_end_at] does not intersect the window of any existing AdoptionScan with the same (team_id, scan_kind); adjacency is NOT permitted - new.window_start_at == existing.window_end_at collides"
    error_id: ERR_SCAN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /design-system/teams/{id}/adoption-scans"

  - priority: 28
    category: business_temporal
    check: "the logical clock has reached the due instant for the requested advance: >= sunset_at for ANNOUNCED->SUNSET, >= removal_at for SUNSET->REMOVED"
    error_id: ERR_DEPRECATION_ADVANCE_NOT_DUE
    http_status: 409
    applies_to: "POST /design-system/deprecation-plans/{id}/advance"

  - priority: 29
    category: business_fiscal
    check: "Team(author_team_id).debt_state == CLEAR"
    error_id: ERR_TEAM_DEBT_FROZEN
    http_status: 422
    applies_to: "POST /design-system/contribution-proposals, POST /design-system/contribution-proposals/{id}/submit"

  - priority: 30
    category: business_fiscal
    check: "Team(requesting_team_id).outstanding_debt_points + the grant's computed grant_points <= Team.debt_budget_points"
    error_id: ERR_TEAM_DEBT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /design-system/exception-grants/{id}/decision"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. The logical clock starts at the fixed default 2026-08-01T00:00:00.000Z and MUST NOT fall back to real wall-clock time; every deadline, notice window, expiry and audited_at stamp reads from this clock only. Advancing the clock expires APPROVED ExceptionGrant rows whose expires_at <= the new instant, processed in created_at ASC order."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime, expired_exception_grant_ids: array, expired_count: integer }
    side_effects:
      - "sets the logical clock to to_iso8601 (the clock may move backwards; no monotonicity is assumed)"
      - "APPROVED -> EXPIRED for every ExceptionGrant with expires_at <= the new clock, in created_at ASC order"
      - "recomputes Team.outstanding_debt_points / lifetime_debt_points / debt_state for every affected team (expiry leaves outstanding_debt_points unchanged by design)"

  - method: POST
    path: "/design-system/teams"
    description: "Register a product/design team that consumes and contributes to the design system."
    roles: [SystemAdmin]
    code: 201
    input: [name, slug, "platform_scope?", "debt_budget_points?"]
    output: Team
    side_effects:
      - "initialises outstanding_debt_points 0.00, lifetime_debt_points 0.00, debt_state CLEAR, blocked_implementation_count 0, adoption_index_latest 0.00, adoption_index_trailing 0.00"

  - method: GET
    path: "/design-system/teams/{id}"
    description: "Read one team including its computed debt and adoption roll-ups."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/design-system/teams/{id}/dashboard"
    description: "Team-level adoption dashboard. `view` selects which calculations.team_adoption_index variant is surfaced: LATEST_SCAN (default) or TRAILING_WINDOW. Field semantics are pinned: `adoption_index` is that variant's weighted index; `code_scan_ratio` / `design_lint_ratio` are that same variant's per-kind inputs (R(k) under LATEST_SCAN, A(k) under TRAILING_WINDOW), 0.00 when the kind has no scan; `outstanding_debt_points`, `debt_state` and `blocked_implementation_count` mirror the Team row; `open_exception_count` counts this team's ExceptionGrant rows whose state == REQUESTED; `scanned_kind_count` counts the distinct scan_kind values with at least one AdoptionScan row for this team (0..2)."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["view?"]
    output: { team_id: string, view: string, adoption_index: number, code_scan_ratio: number, design_lint_ratio: number, outstanding_debt_points: number, debt_state: string, blocked_implementation_count: integer, open_exception_count: integer, scanned_kind_count: integer }
    side_effects: []

  - method: POST
    path: "/design-system/teams/{id}/adoption-scans"
    description: "File one code-scanning or design-file-linting measurement for the team over a closed time window."
    roles: [ContributingTeam, SystemAdmin]
    code: 201
    input: [scan_kind, window_start_at, window_end_at, system_instance_count, legacy_instance_count, one_off_instance_count]
    output: AdoptionScan
    side_effects:
      - "stamps scanned_at from the logical clock and computes adoption_ratio"
      - "recomputes Team.adoption_index_latest and Team.adoption_index_trailing per calculations.team_adoption_index"
      - "increments Team.version by 1"

  - method: GET
    path: "/design-system/teams/{id}/adoption-scans"
    description: "List the team's adoption scans, newest measurement window first; the reverse-reachability channel for AdoptionScan.team_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["scan_kind?", "limit?", "offset?"]
    output: AdoptionScan[]
    side_effects: []

  - method: POST
    path: "/design-system/token-sets"
    description: "Create a token set: the container for one coherent token architecture (color, typography, spacing) with brand and mode layers."
    roles: [SystemAdmin, DesignSystemLead]
    code: 201
    input: [name, slug, "default_brand?", "default_mode?"]
    output: TokenSet
    side_effects:
      - "initialises token_count 0 and max_alias_depth 0"

  - method: GET
    path: "/design-system/token-sets"
    description: "List token sets with pagination; the catalogue view of the token architecture."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["limit?", "offset?"]
    output: TokenSet[]
    side_effects: []

  - method: GET
    path: "/design-system/token-sets/{id}"
    description: "Read one token set including token_count, max_alias_depth and the `version` that callers must echo as expected_token_set_version on token writes and that proposals pin at submit."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: TokenSet
    side_effects: []

  - method: POST
    path: "/design-system/tokens"
    description: "Add a design token to a token set, either as a leaf (raw_value) or as an alias of another token in the same set. OCC-guarded on the token set."
    roles: [DesignSystemLead]
    code: 201
    input: [token_set_id, name, category, expected_token_set_version, "brand?", "mode?", "raw_value?", "alias_of_token_id?"]
    output: DesignToken
    side_effects:
      - "runs calculations.token_alias_resolution to compute alias_depth and resolved_value, refusing cycles and over-deep chains before any row is written"
      - "recomputes TokenSet.token_count and TokenSet.max_alias_depth"
      - "increments TokenSet.version by 1"

  - method: GET
    path: "/design-system/tokens"
    description: "List design tokens with filters; the reverse-reachability channel for DesignToken.token_set_id and DesignToken.alias_of_token_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["token_set_id?", "alias_of_token_id?", "category?", "brand?", "mode?", "limit?", "offset?"]
    output: DesignToken[]
    side_effects: []

  - method: GET
    path: "/design-system/tokens/{id}"
    description: "Read one design token including its computed alias_depth and resolved_value."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: DesignToken
    side_effects: []

  - method: PUT
    path: "/design-system/tokens/{id}"
    description: "Re-point an existing token during a brand refresh: replace its raw_value or move its alias_of_token_id to a different target in the same token set. OCC-guarded on the token set; exactly one of raw_value / alias_of_token_id must be supplied, and the resulting alias graph is re-checked for cycles and depth before anything is written."
    roles: [DesignSystemLead]
    code: 200
    input: [expected_token_set_version, "raw_value?", "alias_of_token_id?"]
    output: DesignToken
    side_effects:
      - "re-runs calculations.token_alias_resolution, refusing a re-point that closes a cycle (ERR_TOKEN_ALIAS_CYCLE) or that makes any walk exceed MAX_ALIAS_DEPTH (ERR_TOKEN_ALIAS_DEPTH_EXCEEDED) before any row is written"
      - "rewrites this token's alias_of_token_id / raw_value, alias_depth and resolved_value, and recomputes alias_depth / resolved_value for every token whose alias walk passes through it"
      - "recomputes TokenSet.max_alias_depth"
      - "increments DesignToken.version by 1 and TokenSet.version by 1"

  - method: GET
    path: "/design-system/token-sets/{id}/resolved-tokens"
    description: "Computed read: resolve every token name in the set for a given brand and mode using the four-layer precedence, following alias chains to their leaf values. Omitted brand/mode fall back to the set's default_brand / default_mode."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["brand?", "mode?"]
    output: { token_set_id: string, brand: string, mode: string, max_alias_depth: integer, resolved_count: integer, resolved: array }
    side_effects: []

  - method: POST
    path: "/design-system/components"
    description: "Register a component in the inventory. It starts EXPERIMENTAL on the maturity dimension and ACTIVE on the lifecycle dimension."
    roles: [DesignSystemLead, SystemAdmin]
    code: 201
    input: [name, slug, owning_team_id, "docs_state?"]
    output: Component
    side_effects:
      - "sets conformance_baseline_at to the logical clock, current_major_version 1, coverage_state NONE, shipped_platform_count 0, governance_conformance_score 0.00, blocked_dependency_count 0"
      - "sets docs_last_reviewed_at to the logical clock when the supplied docs_state is PUBLISHED, and to null otherwise"

  - method: GET
    path: "/design-system/components"
    description: "List components with filters; the reverse-reachability channel for Component.owning_team_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["owning_team_id?", "maturity_level?", "lifecycle_state?", "coverage_state?", "limit?", "offset?"]
    output: Component[]
    side_effects: []

  - method: GET
    path: "/design-system/components/{id}"
    description: "Read one component with both state dimensions and every governance roll-up."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: Component
    side_effects: []

  - method: POST
    path: "/design-system/components/{id}/promote-maturity"
    description: "Advance the component's maturity dimension one step (EXPERIMENTAL->BETA or BETA->STABLE). Resets conformance_baseline_at, which drops pre-promotion accessibility evidence out of the governance sweep."
    roles: [DesignSystemLead]
    code: 200
    input: [target_maturity_level]
    output: Component
    side_effects:
      - "sets maturity_level, clears maturity_demotion_reason to NONE"
      - "resets conformance_baseline_at to the logical clock and recomputes governance_conformance_score against the new window"
      - "increments Component.version by 1"

  - method: POST
    path: "/design-system/components/{id}/dependencies"
    description: "Declare that the path component (consumer) depends on another component (provider) at a pinned provider major version. Refuses edges that would close a cycle in the dependency graph."
    roles: [DesignSystemLead, ContributingTeam]
    code: 201
    input: [provider_component_id, pinned_provider_major]
    output: ComponentDependency
    side_effects:
      - "sets consumer_component_id from the path id and compatibility_state COMPATIBLE when pinned_provider_major == provider.current_major_version and the provider's lifecycle_state is not SUNSET; INCOMPATIBLE or SUNSET_PROVIDER otherwise"
      - "recomputes the consumer Component.blocked_dependency_count"
      - "increments the consumer Component.version by 1"

  - method: GET
    path: "/design-system/components/{id}/dependencies"
    description: "List dependency edges touching the path component; the reverse-reachability channel for both ComponentDependency.consumer_component_id and ComponentDependency.provider_component_id. `direction` accepts ALL (default), CONSUMES (path component is the consumer) or PROVIDES (path component is the provider)."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["direction?", "compatibility_state?", "limit?", "offset?"]
    output: ComponentDependency[]
    side_effects: []

  - method: PUT
    path: "/design-system/component-dependencies/{id}"
    description: "Re-pin an existing dependency edge to a new provider major version. This is how a consumer clears an UPSTREAM_BREAKING_CHANGE block before re-shipping."
    roles: [DesignSystemLead, ContributingTeam]
    code: 200
    input: [pinned_provider_major]
    output: ComponentDependency
    side_effects:
      - "recomputes compatibility_state: COMPATIBLE when pinned_provider_major == provider.current_major_version and the provider's lifecycle_state is not SUNSET; SUNSET_PROVIDER when the provider is SUNSET; INCOMPATIBLE otherwise"
      - "recomputes the consumer Component.blocked_dependency_count downward when the edge became COMPATIBLE"
      - "increments ComponentDependency.version by 1 and the consumer Component.version by 1"

  - method: POST
    path: "/design-system/components/{id}/platform-implementations"
    description: "Declare a per-platform implementation of the component. It starts PLANNED and contributes nothing to coverage until shipped."
    roles: [ContributingTeam, DesignSystemLead]
    code: 201
    input: [platform, package_name, package_version, "token_compliance_ratio?"]
    output: PlatformImplementation
    side_effects:
      - "sets component_id from the path id, status PLANNED, conformance_score 0.00, last_audit_sequence 0, blocked_reason NONE"

  - method: GET
    path: "/design-system/components/{id}/platform-implementations"
    description: "List the component's platform implementations; the reverse-reachability channel for PlatformImplementation.component_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["status?", "platform?", "limit?", "offset?"]
    output: PlatformImplementation[]
    side_effects: []

  - method: GET
    path: "/design-system/platform-implementations/{id}"
    description: "Read one platform implementation including its latest_evidence conformance_score."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: PlatformImplementation
    side_effects: []

  - method: POST
    path: "/design-system/platform-implementations/{id}/ship"
    description: "Ship (or re-ship after a block) this platform implementation. Gated on zero open critical accessibility violations, token compliance, the owning component's lifecycle state and a clear dependency picture."
    roles: [ContributingTeam]
    code: 200
    input: [package_version, token_compliance_ratio]
    output: PlatformImplementation
    side_effects:
      - "status PLANNED|BLOCKED -> SHIPPED, shipped_at = logical clock, blocked_reason = NONE"
      - "recomputes Component.shipped_platform_count and Component.coverage_state per calculations.platform_coverage_state"
      - "recomputes Component.governance_conformance_score per calculations.a11y_conformance_score governance_sweep"
      - "recomputes Team.blocked_implementation_count when the ship cleared a BLOCKED row"
      - "increments PlatformImplementation.version by 1 and Component.version by 1"

  - method: POST
    path: "/design-system/platform-implementations/{id}/accessibility-audits"
    description: "File one immutable accessibility testing evidence record (AUTOMATED scan or MANUAL assistive-technology pass) against this implementation."
    roles: [ContributingTeam, DesignSystemLead]
    code: 201
    input: [method, wcag_level, violations_critical, violations_serious, violations_moderate, evidence_url]
    output: AccessibilityAudit
    side_effects:
      - "mints audit_sequence = PlatformImplementation.last_audit_sequence + 1 and stores it on the row; stamps audited_at from the logical clock; computes defect_load"
      - "advances PlatformImplementation.last_audit_sequence and recomputes PlatformImplementation.conformance_score per calculations.a11y_conformance_score latest_evidence"
      - "recomputes Component.governance_conformance_score per the governance_sweep variant, and sets Component.maturity_demotion_reason = CONFORMANCE_REGRESSION when a BETA component's swept score falls below 70.00"
      - "increments PlatformImplementation.version by 1 and Component.version by 1"

  - method: GET
    path: "/design-system/platform-implementations/{id}/accessibility-audits"
    description: "List the implementation's accessibility evidence in audit_sequence ASC order; the reverse-reachability channel for AccessibilityAudit.platform_implementation_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["method?", "wcag_level?", "limit?", "offset?"]
    output: AccessibilityAudit[]
    side_effects: []

  - method: POST
    path: "/design-system/contribution-proposals"
    description: "Open a contribution proposal in DRAFT. Blocked when the authoring team's technical-debt state is FROZEN."
    roles: [ContributingTeam]
    code: 201
    input: [title, author_team_id, target_component_id, pinned_token_set_id, proposal_kind, "touches_public_api?"]
    output: ContributionProposal
    side_effects:
      - "sets state DRAFT, revision_round 0, required_evidence_kinds [], submitted_evidence_kinds []"

  - method: GET
    path: "/design-system/contribution-proposals"
    description: "List contribution proposals with filters; the reverse-reachability channel for ContributionProposal.author_team_id, target_component_id, pinned_token_set_id and released_in_release_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["author_team_id?", "target_component_id?", "pinned_token_set_id?", "released_in_release_id?", "state?", "limit?", "offset?"]
    output: ContributionProposal[]
    side_effects: []

  - method: GET
    path: "/design-system/contribution-proposals/{id}"
    description: "Read one contribution proposal including its evidence sets, revision round and pinned token set version."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: ContributionProposal
    side_effects: []

  - method: POST
    path: "/design-system/contribution-proposals/{id}/submit"
    description: "Submit (or resubmit) the proposal into DESIGN_CRITIQUE. Pins the token set version, recomputes the required evidence set and increments the revision round."
    roles: [ContributingTeam]
    code: 200
    input: []
    output: ContributionProposal
    side_effects:
      - "state DRAFT|CHANGES_REQUESTED -> DESIGN_CRITIQUE; revision_round += 1; submitted_at = logical clock"
      - "pins pinned_token_set_version = TokenSet.version"
      - "recomputes required_evidence_kinds and prunes submitted_evidence_kinds to the round-durable kinds"
      - "increments ContributionProposal.version by 1"

  - method: POST
    path: "/design-system/contribution-proposals/{id}/acceptance-evidence"
    description: "Attach one or more acceptance-criteria evidence kinds to the proposal for its current revision round."
    roles: [ContributingTeam]
    code: 200
    input: [evidence_kinds, evidence_url]
    output: ContributionProposal
    side_effects:
      - "unions evidence_kinds into submitted_evidence_kinds and re-sorts it ascending"
      - "increments ContributionProposal.version by 1"

  - method: POST
    path: "/design-system/contribution-proposals/{id}/reviews"
    description: "File one immutable review verdict at the design-critique or engineering-review gate. The verdict drives the proposal's cyclic state machine and is subject to segregation of duties."
    roles: [DesignCritiqueReviewer, EngineeringReviewer]
    code: 201
    input: [stage, verdict, notes]
    output: ReviewRecord
    side_effects:
      - "appends the ReviewRecord with reviewer_user_id = X-User-ID, revision_round = the proposal's current round, resulting_proposal_state = the post-transition state"
      - "moves ContributionProposal.state per the section 1.2 branch selected by (stage, verdict)"
      - "sets design_critique_reviewer_user_id or engineering_reviewer_user_id"
      - "increments ContributionProposal.version by 1"

  - method: GET
    path: "/design-system/contribution-proposals/{id}/reviews"
    description: "List the proposal's review records in created_at ASC order; the reverse-reachability channel for ReviewRecord.proposal_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["stage?", "revision_round?", "limit?", "offset?"]
    output: ReviewRecord[]
    side_effects: []

  - method: POST
    path: "/design-system/contribution-proposals/{id}/accept"
    description: "Accept a READY_FOR_ACCEPTANCE proposal into a DRAFT release. OCC-guarded on the target component's version; re-validates the pinned token set and the acceptance evidence set; a BREAKING_CHANGE acceptance starts the four-hop dependency cascade."
    roles: [DesignSystemLead]
    code: 200
    input: [release_id, expected_component_version]
    output: ContributionProposal
    side_effects:
      - "state READY_FOR_ACCEPTANCE -> ACCEPTED; accepted_at = logical clock; released_in_release_id = release_id"
      - "publishes the component's documentation page when DOC_PAGE evidence was filed"
      - "for BREAKING_CHANGE: Component.current_major_version += 1 and pending_breaking_change_count += 1, then the dependency / implementation / team cascade hops 2-4"
      - "increments Component.version by 1 and ContributionProposal.version by 1"

  - method: POST
    path: "/design-system/releases"
    description: "Cut a DRAFT release that accepted proposals can be attached to."
    roles: [SystemAdmin]
    code: 201
    input: [semver_base, "channel?"]
    output: Release
    side_effects:
      - "sets state DRAFT, release_notes_state PENDING, breaking_change_count 0, escalated_proposal_count 0, semver null"

  - method: POST
    path: "/design-system/releases/{id}/publish"
    description: "Publish the release: runs calculations.release_version_bump over the carried proposals, writes the semver and the breaking-change policy tier, and flips release communication to PUBLISHED."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: Release
    side_effects:
      - "runs calculations.release_version_bump and writes raw_change_class / effective_change_class on every carried proposal"
      - "writes semver, policy_tier, breaking_ratio, breaking_change_count, escalated_proposal_count"
      - "state DRAFT -> PUBLISHED, release_notes_state -> PUBLISHED, published_at = logical clock"
      - "resets Component.pending_breaking_change_count to 0 for every carried BREAKING_CHANGE target"
      - "increments Release.version by 1 and each carried ContributionProposal.version by 1"

  - method: POST
    path: "/design-system/components/{id}/deprecation-plans"
    description: "Draft a deprecation plan for the component. Freezes the required and actual notice windows and reserves the half-open [announced_at, removal_at) window on the component."
    roles: [DesignSystemLead]
    code: 201
    input: [announced_at, sunset_at, removal_at, "replacement_component_id?", "migration_guide_url?"]
    output: DeprecationPlan
    side_effects:
      - "sets component_id from the path id, state DRAFT, migration_guide_state MISSING (or DRAFT when migration_guide_url is supplied), blocked_dependent_count 0"
      - "computes and freezes required_notice_days and actual_notice_days per calculations.deprecation_notice_window"

  - method: GET
    path: "/design-system/components/{id}/deprecation-plans"
    description: "List the component's deprecation plans; the reverse-reachability channel for DeprecationPlan.component_id and DeprecationPlan.replacement_component_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: DeprecationPlan[]
    side_effects: []

  - method: POST
    path: "/design-system/deprecation-plans/{id}/migration-guide"
    description: "Attach the migration guide to a DRAFT plan. With publish=true the guide becomes PUBLISHED and the plan announces, driving the component's lifecycle dimension to DEPRECATION_ANNOUNCED; with publish=false only the guide URL and DRAFT guide state are recorded."
    roles: [DesignSystemLead]
    code: 200
    input: [migration_guide_url, publish]
    output: DeprecationPlan
    side_effects:
      - "sets migration_guide_url and migration_guide_state (PUBLISHED when publish is true, DRAFT otherwise)"
      - "when publish is true: state DRAFT -> ANNOUNCED and Component.lifecycle_state ACTIVE -> DEPRECATION_ANNOUNCED"
      - "increments DeprecationPlan.version by 1 and, when announcing, Component.version by 1"

  - method: POST
    path: "/design-system/deprecation-plans/{id}/advance"
    description: "Advance the plan one step along ANNOUNCED -> SUNSET -> REMOVED. Refused until the logical clock reaches the due instant. The SUNSET step fires the three-hop provider-sunset cascade."
    roles: [DesignSystemLead]
    code: 200
    input: []
    output: DeprecationPlan
    side_effects:
      - "ANNOUNCED -> SUNSET: Component.lifecycle_state -> SUNSET; every COMPATIBLE dependency edge on this provider flips to SUNSET_PROVIDER; each affected consumer's blocked_dependency_count rises; blocked_dependent_count records how many consumers were affected; STABLE consumers are demoted to BETA with maturity_demotion_reason UPSTREAM_SUNSET"
      - "SUNSET -> REMOVED: Component.lifecycle_state -> REMOVED and every implementation of that component is RETIRED"
      - "increments DeprecationPlan.version by 1 and Component.version by 1"

  - method: POST
    path: "/design-system/deprecation-plans/{id}/rescind"
    description: "Compensating action: rescind an ANNOUNCED or SUNSET plan, returning the component's lifecycle dimension to ACTIVE and giving back exactly the dependency blocks the sunset cascade took."
    roles: [DesignSystemLead]
    code: 200
    input: [reason]
    output: DeprecationPlan
    side_effects:
      - "state ANNOUNCED|SUNSET -> RESCINDED, rescinded_at = logical clock, blocked_dependent_count -> 0"
      - "Component.lifecycle_state -> ACTIVE; every SUNSET_PROVIDER edge on this provider returns to COMPATIBLE and each consumer's blocked_dependency_count falls by exactly the amount the sunset added"
      - "releases the plan's half-open occupancy window on the component"
      - "increments DeprecationPlan.version by 1 and Component.version by 1"

  - method: POST
    path: "/design-system/exception-grants"
    description: "Request approval to ship a one-off, a fork, or raw token usage instead of the system component, accepting the technical-debt points that come with it."
    roles: [ContributingTeam]
    code: 201
    input: [requesting_team_id, substitute_for_component_id, exception_kind, platform_scope, justification, expires_at]
    output: ExceptionGrant
    side_effects:
      - "sets state REQUESTED, debt_points 0.00, pinned_maturity_level null"

  - method: GET
    path: "/design-system/exception-grants"
    description: "List exception grants with filters; the reverse-reachability channel for ExceptionGrant.requesting_team_id and ExceptionGrant.substitute_for_component_id."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: ["requesting_team_id?", "substitute_for_component_id?", "state?", "exception_kind?", "limit?", "offset?"]
    output: ExceptionGrant[]
    side_effects: []

  - method: GET
    path: "/design-system/exception-grants/{id}"
    description: "Read one exception grant including its frozen debt_points and pinned_maturity_level."
    roles: [SystemAdmin, DesignSystemLead, DesignCritiqueReviewer, EngineeringReviewer, ContributingTeam]
    code: 200
    input: []
    output: ExceptionGrant
    side_effects: []

  - method: POST
    path: "/design-system/exception-grants/{id}/decision"
    description: "Approve or deny a REQUESTED exception grant. Approval pins the substitute component's maturity level, freezes the grant's debt points and charges them to the requesting team's budget."
    roles: [DesignSystemLead]
    code: 200
    input: [decision, "decision_notes?"]
    output: ExceptionGrant
    side_effects:
      - "APPROVE: pins pinned_maturity_level, freezes debt_points per calculations.exception_debt_points, state -> APPROVED, recomputes Team.outstanding_debt_points / lifetime_debt_points / debt_state and Component.one_off_exception_count"
      - "DENY: state -> DENIED, debt_points stays 0.00, no team roll-up changes"
      - "sets decided_by_user_id = X-User-ID and decided_at = logical clock"
      - "increments ExceptionGrant.version by 1 and, on APPROVE, Team.version by 1"

  - method: POST
    path: "/design-system/exception-grants/{id}/repay"
    description: "Compensating action: retire the technical debt behind an APPROVED or EXPIRED grant, returning the team's outstanding debt to exactly its pre-approval value while leaving the lifetime total untouched."
    roles: [ContributingTeam]
    code: 200
    input: [remediation_notes]
    output: ExceptionGrant
    side_effects:
      - "state APPROVED|EXPIRED -> REPAID, repaid_at = logical clock; debt_points is retained on the row as the historic amount"
      - "recomputes Team.outstanding_debt_points downward by exactly this grant's debt_points; Team.lifetime_debt_points is unchanged; Team.debt_state recomputed"
      - "recomputes Component.one_off_exception_count downward"
      - "increments ExceptionGrant.version by 1 and Team.version by 1"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank on any endpoint other than POST /_clock/set_current_utc"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting X-User-Role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a ContributingTeam acts on a resource whose owning team is not the team id in X-User-ID (adoption scans, proposals, implementations, exception grants)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID files the engineering review after having filed the design critique for the same proposal, or the accepting DesignSystemLead user id equals either reviewer user id on the proposal"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, an enum value is outside its declared set, a numeric field is out of range, a ratio is outside 0.0000-1.0000, an instant is not ISO-8601, or an interval's start is not strictly before its end"

  # --- not found ---
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "the referenced Team id does not exist"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "the referenced Component id (target, provider, substitute or replacement) does not exist"
  - id: ERR_COMPONENT_DEPENDENCY_NOT_FOUND
    http: 404
    condition: "the referenced ComponentDependency id does not exist"
  - id: ERR_PLATFORM_IMPLEMENTATION_NOT_FOUND
    http: 404
    condition: "the referenced PlatformImplementation id does not exist"
  - id: ERR_TOKEN_SET_NOT_FOUND
    http: 404
    condition: "the referenced TokenSet id does not exist"
  - id: ERR_TOKEN_NOT_FOUND
    http: 404
    condition: "the referenced DesignToken id (including alias_of_token_id) does not exist"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "the referenced ContributionProposal id does not exist"
  - id: ERR_RELEASE_NOT_FOUND
    http: 404
    condition: "the referenced Release id does not exist"
  - id: ERR_DEPRECATION_PLAN_NOT_FOUND
    http: 404
    condition: "the referenced DeprecationPlan id does not exist"
  - id: ERR_EXCEPTION_GRANT_NOT_FOUND
    http: 404
    condition: "the referenced ExceptionGrant id does not exist"

  # --- optimistic concurrency ---
  - id: ERR_STALE_COMPONENT_VERSION
    http: 412
    condition: "expected_component_version on proposal acceptance does not equal the target Component's current version"
  - id: ERR_STALE_TOKEN_SET_VERSION
    http: 412
    condition: "expected_token_set_version on a token create or update does not equal the TokenSet's current version"

  # --- state machine guards ---
  - id: ERR_INVALID_PROPOSAL_STATE
    http: 409
    condition: "the trigger is not a declared transition out of the ContributionProposal's current state"
  - id: ERR_INVALID_IMPLEMENTATION_STATE
    http: 409
    condition: "the trigger is not a declared transition out of the PlatformImplementation's current status (e.g. shipping an already SHIPPED or a RETIRED implementation)"
  - id: ERR_INVALID_COMPONENT_MATURITY_TRANSITION
    http: 409
    condition: "target_maturity_level is not the next step on the maturity dimension (e.g. EXPERIMENTAL straight to STABLE), or the docs_state == PUBLISHED precondition of a STABLE promotion is unmet"
  - id: ERR_INVALID_DEPRECATION_PLAN_STATE
    http: 409
    condition: "the trigger is not a declared transition out of the DeprecationPlan's current state (advancing a DRAFT or REMOVED plan, rescinding a DRAFT / REMOVED / RESCINDED plan, re-attaching a guide to a non-DRAFT plan)"
  - id: ERR_INVALID_EXCEPTION_GRANT_STATE
    http: 409
    condition: "deciding a grant that is not REQUESTED, or repaying a grant that is not APPROVED or EXPIRED"
  - id: ERR_INVALID_RELEASE_STATE
    http: 409
    condition: "attaching a proposal to a non-DRAFT release, or publishing a release that is already PUBLISHED"
  - id: ERR_REVIEW_STAGE_MISMATCH
    http: 409
    condition: "the review's stage does not match the proposal's current gate, or the acting role is not the reviewer role for that stage (DesignCritiqueReviewer for DESIGN_CRITIQUE, EngineeringReviewer for ENGINEERING_REVIEW)"
  - id: ERR_DEPRECATION_ADVANCE_NOT_DUE
    http: 409
    condition: "the logical clock has not yet reached the plan's sunset_at (ANNOUNCED -> SUNSET) or removal_at (SUNSET -> REMOVED)"

  # --- business rules: accessibility and quality gates ---
  - id: ERR_A11Y_CRITICAL_VIOLATIONS_OPEN
    http: 422
    condition: "the implementation's newest accessibility audit reports violations_critical > 0 when shipping"
  - id: ERR_A11Y_CONFORMANCE_INSUFFICIENT
    http: 422
    condition: "the governance-sweep conformance score for the component is below the maturity level's required floor (BETA 70.00, STABLE 90.00), or a required evidence method is missing from the sweep window"
  - id: ERR_PLATFORM_COVERAGE_INSUFFICIENT
    http: 422
    condition: "promotion to BETA is attempted while shipped_platform_count == 0, or promotion to STABLE while coverage_state is not in {PARTIAL, FULL}"

  # --- business rules: tokens ---
  - id: ERR_TOKEN_ALIAS_CYCLE
    http: 409
    condition: "the requested alias_of_token_id would close a cycle in the alias graph, including a token aliasing itself"
  - id: ERR_TOKEN_ALIAS_DEPTH_EXCEEDED
    http: 422
    condition: "the resulting alias chain would exceed the MAX_ALIAS_DEPTH constant of 5 hops"
  - id: ERR_UNIQUENESS_CONFLICT
    http: 409
    condition: "a globally unique slug (Team.slug, Component.slug, TokenSet.slug), a (component_id, platform) implementation pair or a (consumer_component_id, provider_component_id) dependency edge already exists"
  - id: ERR_TOKEN_NAME_CONFLICT
    http: 409
    condition: "a token with the same (token_set_id, name, brand, mode) tuple already exists in that token set"
  - id: ERR_PINNED_TOKEN_SET_STALE
    http: 409
    condition: "on acceptance the proposal's pinned_token_set_version no longer equals the TokenSet's current version, so the design was reviewed against tokens that have since changed"

  # --- business rules: contribution process ---
  - id: ERR_ACCEPTANCE_EVIDENCE_INCOMPLETE
    http: 422
    condition: "submitted_evidence_kinds does not cover every kind in required_evidence_kinds at acceptance"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "resubmission is attempted when revision_round has already reached the max_revision_rounds constant of 3"
  - id: ERR_MIGRATION_GUIDE_REQUIRED
    http: 422
    condition: "a carried proposal whose effective_change_class is MAJOR has no MIGRATION_GUIDE evidence at release publish time, a STABLE component's deprecation plan is announced with publish=false, or an ANNOUNCED plan is advanced to SUNSET while migration_guide_state is not PUBLISHED"

  # --- business rules: dependencies and lifecycle ---
  - id: ERR_DEPENDENCY_CYCLE
    http: 409
    condition: "the requested dependency edge would create a cycle in the component dependency graph"
  - id: ERR_BLOCKED_DEPENDENCY
    http: 409
    condition: "shipping is attempted while the component's blocked_dependency_count is greater than zero (an INCOMPATIBLE or SUNSET_PROVIDER edge is outstanding)"
  - id: ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP
    http: 409
    condition: "shipping is attempted for a component whose lifecycle_state is SUNSET or REMOVED"
  - id: ERR_COMPONENT_DEPRECATION_IN_PROGRESS
    http: 422
    condition: "a contribution proposal is submitted or accepted against a component whose lifecycle_state is not ACTIVE"
  - id: ERR_DEPRECATION_NOTICE_TOO_SHORT
    http: 422
    condition: "the plan's actual_notice_days is below the required_notice_days computed from the component's maturity level, adoption footprint and dependent count"
  - id: ERR_DEPRECATION_WINDOW_OVERLAP
    http: 409
    condition: "the plan's half-open [announced_at, removal_at) window overlaps a live plan's window on the same component; touching endpoints are permitted"

  # --- business rules: adoption and technical debt ---
  - id: ERR_SCAN_WINDOW_OVERLAP
    http: 409
    condition: "the adoption scan's closed [window_start_at, window_end_at] window overlaps an existing scan of the same scan_kind for the team; a shared endpoint instant is an overlap"
  - id: ERR_TEAM_DEBT_FROZEN
    http: 422
    condition: "a team whose debt_state is FROZEN opens a new contribution proposal or submits an existing one (POST /design-system/contribution-proposals and POST /design-system/contribution-proposals/{id}/submit only; exception-grant requests remain open so the team can document the debt it already carries)"
  - id: ERR_TEAM_DEBT_BUDGET_EXCEEDED
    http: 422
    condition: "approving the exception grant would push the requesting team's outstanding_debt_points above its debt_budget_points"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:

  - name: SystemAdmin
    description: "Design-system platform operator. Owns tenant registration, token-set provisioning, release cutting and publication, and the logical clock. Does not review or accept contributions and cannot approve exceptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /design-system/teams"
      - "POST /design-system/releases"
      - "POST /design-system/releases/{id}/publish"
    shared_operations:
      - "POST /design-system/token-sets (with DesignSystemLead)"
      - "POST /design-system/components (with DesignSystemLead)"
      - "POST /design-system/teams/{id}/adoption-scans (with ContributingTeam; admin-filed scans are not ownership-checked)"
      - "all GET reads"

  - name: DesignSystemLead
    description: "Steward of the design system. Owns the component inventory, token architecture, maturity promotion, deprecation planning and migration guides, proposal acceptance and exception-grant decisions. Cannot cut or publish releases and cannot file review verdicts."
    identity: "opaque"
    exclusive_operations:
      - "POST /design-system/tokens"
      - "POST /design-system/components/{id}/promote-maturity"
      - "POST /design-system/contribution-proposals/{id}/accept"
      - "POST /design-system/components/{id}/deprecation-plans"
      - "POST /design-system/deprecation-plans/{id}/migration-guide"
      - "POST /design-system/deprecation-plans/{id}/advance"
      - "POST /design-system/deprecation-plans/{id}/rescind"
      - "POST /design-system/exception-grants/{id}/decision"
    shared_operations:
      - "POST /design-system/token-sets (with SystemAdmin)"
      - "POST /design-system/components (with SystemAdmin)"
      - "POST /design-system/components/{id}/dependencies (with ContributingTeam)"
      - "PUT /design-system/component-dependencies/{id} (with ContributingTeam)"
      - "POST /design-system/components/{id}/platform-implementations (with ContributingTeam)"
      - "POST /design-system/platform-implementations/{id}/accessibility-audits (with ContributingTeam)"
      - "all GET reads"

  - name: DesignCritiqueReviewer
    description: "Design critique gate reviewer. May only file review verdicts whose stage is DESIGN_CRITIQUE, and only while the proposal sits at that gate. Under segregation of duties the same user id may not later file the engineering review for the same proposal."
    identity: "opaque"
    exclusive_operations:
      - "POST /design-system/contribution-proposals/{id}/reviews with stage DESIGN_CRITIQUE"
    shared_operations:
      - "POST /design-system/contribution-proposals/{id}/reviews (endpoint shared with EngineeringReviewer; stage authority is disjoint)"
      - "all GET reads"

  - name: EngineeringReviewer
    description: "Engineering review gate reviewer. May only file review verdicts whose stage is ENGINEERING_REVIEW, and only after the design critique has approved. Cannot approve at the design-critique gate and cannot accept a proposal."
    identity: "opaque"
    exclusive_operations:
      - "POST /design-system/contribution-proposals/{id}/reviews with stage ENGINEERING_REVIEW"
    shared_operations:
      - "POST /design-system/contribution-proposals/{id}/reviews (endpoint shared with DesignCritiqueReviewer; stage authority is disjoint)"
      - "all GET reads"

  - name: ContributingTeam
    description: "A product team consuming and contributing to the design system. X-User-ID is the Team id. May only act on resources owned by that team: its own adoption scans, its own proposals, implementations of components it owns, and its own exception grants. Cannot promote maturity, accept proposals, decide exceptions or publish releases."
    identity: "entity_backed:Team"
    exclusive_operations:
      - "POST /design-system/contribution-proposals"
      - "POST /design-system/contribution-proposals/{id}/submit"
      - "POST /design-system/contribution-proposals/{id}/acceptance-evidence"
      - "POST /design-system/platform-implementations/{id}/ship"
      - "POST /design-system/exception-grants"
      - "POST /design-system/exception-grants/{id}/repay"
    shared_operations:
      - "POST /design-system/teams/{id}/adoption-scans (with SystemAdmin)"
      - "POST /design-system/components/{id}/dependencies (with DesignSystemLead)"
      - "PUT /design-system/component-dependencies/{id} (with DesignSystemLead)"
      - "POST /design-system/components/{id}/platform-implementations (with DesignSystemLead)"
      - "POST /design-system/platform-implementations/{id}/accessibility-audits (with DesignSystemLead)"
      - "all GET reads"
