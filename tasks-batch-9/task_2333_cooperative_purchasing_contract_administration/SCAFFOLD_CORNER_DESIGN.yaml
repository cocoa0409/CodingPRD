        grounds:
          - validations.priority_29
          - errors.ERR_LOCAL_WAIVER_REQUIRED
          - calculations.piggyback_authority
          - entities.PiggybackAnalysis.fields.local_waiver_required
          - state_machines.PiggybackAnalysis.status.PENDING_to_VOIDED
