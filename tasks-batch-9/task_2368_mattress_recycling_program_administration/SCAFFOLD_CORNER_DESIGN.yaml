      - name: reserve_balance_and_recommendation_reconcile_after_a_partial_refund
        layer: derived_field_reconciliation
        claim_type: Derived field recomputed from source rows
        grounds:
          - calculations.program_ledger_reconciliation
          - calculations.fee_rate_recommendation
          - endpoints[POST /sales-remittances/{id}/refund]
        distinguishing_aspect: "After a 200000c refund of a 550000c payment the program reports fee_collected_cents 350000 net (not 550000 with a separate refund bucket), and reserve, coverage and recommended rate are all recomputed from that net figure in one pass."
        test_recipe:
          setup:
            - "CHAIN-P filed and paid 550000c; posture is NORMAL."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
