      - name: composite_score_non_expert_cap_before_rounding
        grounds:
          - calculations.composite_score
          - entities.Score.fields.expertise_match
          - entities.Juror.fields.expertise_categories
        distinguishing_aspect: |
          Mode (a) min/max clamp: NON_EXPERT_CAP 8.00 is applied via min() to the weighted raw value
          BEFORE the 2-dp round_half_up, so a (10,10,10) PAINTING score is 10.00 from a
          PAINTING-credentialed juror and exactly 8.00 from a SCULPTURE-only juror, while a
          (6,7,7) score from the same non-expert stays 6.60 because the clamp is inert below 8.00.
        test_recipe:
          setup:
            - "Exhibition JURYING with weights 0.40/0.35/0.25 and allowed media PAINTING/PHOTOGRAPHY/SCULPTURE."
            - "Two SUBMITTED PAINTING artworks from one MEMBER artist."
