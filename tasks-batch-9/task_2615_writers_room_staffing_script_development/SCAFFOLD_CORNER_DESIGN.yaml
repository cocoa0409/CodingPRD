      - name: clearance_item_creation_records_the_catalogue_weight_but_scores_nothing_yet
        claim_type: creation
        grounds:
          - entities.ClearanceItem
          - entities.ClearanceItem.fields.risk_weight
          - entities.ClearanceReview.fields.item_count
          - calculations.clearance_risk_score
          - endpoints.POST_/clearance-reviews/{review_id}/items
        distinguishing_aspect: |
          Creation and scoring are deliberately split: the item stores the raw catalogue weight
          (DEPICTION -> 25) at create while the review's risk_score stays 0 and its posture stays PENDING,
          because an item whose decision is still SUBMITTED is outside the scoring input set. item_count
          moves but decided_item_count does not.
        test_recipe:
          setup:
            - "ClearanceReview CR (posture PENDING, item_count 0) exists on assignment A1."
            - "Agreement clearance_item_weights: NAME 5, TRADEMARK 15, DEPICTION 25."
          setup_api_calls:
