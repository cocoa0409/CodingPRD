# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3039_franchise_development_agent_territory_encroachment_review
# Breadth probe across the claim-extraction-guide taxonomy. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: territory_create_returns_all_fields_and_unassigned_status
        claim_type: Creation
        grounds:
          - entities.Territory
          - endpoints.POST_/territories
        distinguishing_aspect: "A territory created with the four required inputs returns 201 with status UNASSIGNED, assigned_agent_id null, open_store_count 0, version 1, and system-stamped id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z (default). Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /territories"
              payload: { code: "T-CR-1", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Territory.${terr_id}.status == UNASSIGNED and assigned_agent_id is null"
            - "Territory.${terr_id}.open_store_count == 0 and version == 1"
            - "the response carries non-null id, created_at, updated_at and meta.api_request_id"

      - name: store_get_returns_stored_data_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Store
          - endpoints.GET_/stores/{id}
        distinguishing_aspect: "Every Store input field round-trips through GET exactly as posted, including the two sales figures and geo coordinates."
        test_recipe:
          setup: ["Logical clock default; territory T and franchisee FR exist; store S registered."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CR-2", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SCR-1", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 900000 }
              as: FranchisorOps
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /stores/${s1}"
              payload: {}
              as: Franchisee
              as_user_id: "${fr1}"
          assert:
            - "the response status is 200"
            - "Store.${s1}.store_number == \"SCR-1\" and status == OPEN"
            - "Store.${s1}.estimated_weekly_sales_cents == 1000000 and actual_avg_weekly_sales_cents == 900000"
            - "Store.${s1}.consecutive_failed_inspections == 0 and source_site_application_id is null"

      - name: protests_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/protests
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two protests on file, limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false."
        test_recipe:
          setup:
            - "Logical clock default; assigned territory with APPROVED application A and two OPEN protester stores owned by P1 and P2; both file protests."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CR-3", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "P1", contact_email: "p1@example.com" }
              as: FranchisorOps
              captures: { p1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "P2", contact_email: "p2@example.com" }
              as: FranchisorOps
              captures: { p2: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "APP", contact_email: "a@example.com" }
              as: FranchisorOps
              captures: { appf: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SCR-2", territory_id: "${terr_id}", franchisee_id: "${p1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { ps1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SCR-3", territory_id: "${terr_id}", franchisee_id: "${p2}", address: "2 C St", geo_lat: 40.1, geo_lng: -75.1, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { ps2: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "9 Oak", proposed_lat: 40.05, proposed_lng: -75.05, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da}"
              captures: { app: $.data.id }
            - call: "POST /site-applications/${app}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da}"
            - call: "POST /site-applications/${app}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { stu: $.data.id }
            - call: "POST /impact-studies/${stu}/finalize"
              payload: {}
              as: FranchisorOps
            - call: "POST /site-applications/${app}/approve"
              payload: {}
              as: FranchisorOps
            - call: "POST /protests"
              payload: { site_application_id: "${app}", protesting_store_id: "${ps1}", grounds: "g1" }
              as: Franchisee
              as_user_id: "${p1}"
            - call: "POST /protests"
              payload: { site_application_id: "${app}", protesting_store_id: "${ps2}", grounds: "g2" }
              as: Franchisee
              as_user_id: "${p2}"
          trigger:
            - call: "GET /protests"
              payload: { limit: 1, offset: 0 }
              as: FranchisorOps
          assert:
            - "the response status is 200 and response_type is array"
            - "the first page returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /protests?limit=1&offset=1 returns 1 row with total_count == 2 and has_more == false"
            - "GET /protests?protesting_franchisee_id=${p1} returns exactly 1 row"

      - name: store_get_unknown_id_returns_store_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/stores/{id}
          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated store id returns the entity-specific 404 ERR_STORE_NOT_FOUND, not a generic not-found and not a 400."
        test_recipe:
          setup: ["Logical clock default; empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FranchisorOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_STORE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: site_application_create_missing_open_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SiteApplication.fields.proposed_open_date
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "proposed_open_date is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the required-field check, not a state or business error."
        test_recipe:
          setup: ["Logical clock default; assigned territory with DA and applicant franchisee."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CR-4", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "APP", contact_email: "a@example.com" }
              as: FranchisorOps
              captures: { appf: $.data.id }
          trigger:
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "9 Oak", proposed_lat: 40.05, proposed_lng: -75.05, expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /territories/${terr_id}/site-applications returns 0 rows"

      - name: transfer_fee_frozen_at_creation_even_as_store_mutates
        claim_type: Computed Fields
        grounds:
          - entities.TransferRequest.fields.transfer_fee_cents
          - calculations.transfer_fee
        distinguishing_aspect: "transfer_fee_cents is computed once at creation (sale 40,000,000 mid tier 2% -> 800,000; store age 10 years -> 10% off -> 720,000) and stays frozen through later store state changes."
        test_recipe:
          setup: ["Logical clock default; territory with OPEN store opened 2016-09-01 (exactly 10 years old); transfer created at sale 40,000,000."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CR-5", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Seller", contact_email: "s@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer", contact_email: "b@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SCR-4", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2016-09-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id, s1_v: $.data.version }
          trigger:
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { tr1: $.data.id }
          assert:
            - "TransferRequest.${tr1}.transfer_fee_cents == 720000 (800,000 mid-tier fee x 0.90 ten-year age discount)"
            - "TransferRequest.${tr1}.seller_franchisee_id == ${fr1}"
            - "Store.${s1}.version == ${s1_v} + 1 (transfer creation bumped the OCC parent)"

      - name: promotion_create_supplied_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Promotion.fields.status
          - endpoints.POST_/promotions
        distinguishing_aspect: "Promotion.status is source system with initial PROPOSED; a client-supplied status ACTIVE in the create body is ignored and the row is created PROPOSED with version 1."
        test_recipe:
          setup: ["Logical clock default."]
          setup_api_calls: []
          trigger:
            - call: "POST /promotions"
              payload: { name: "Sneaky", voting_open: "2026-09-01T00:00:00Z", voting_close: "2026-09-10T00:00:00Z", active_start: "2026-10-01T00:00:00Z", active_end: "2026-11-01T00:00:00Z", base_cost_per_store_cents: 200000, status: "ACTIVE" }
              as: FranchisorOps
              captures: { p1: $.data.id, err: $.data.error_id }
          assert:
            - "the response status is 201 and Promotion.${p1}.status == PROPOSED"
            - "Promotion.${p1}.votes_for == 0 and eligible_voter_count == 0"

      - name: vote_create_with_out_of_enum_ballot_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.PromotionVote.fields.ballot
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "ballot is a closed enum FOR/AGAINST/ABSTAIN; a value such as MAYBE is a 400 ERR_INVALID_REQUEST, never silently tallied."
        test_recipe:
          setup: ["Logical clock default; territory with one OPEN store; promotion in VOTING (window covers 2026-09-01)."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CR-6", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SCR-5", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id }
            - call: "POST /promotions"
              payload: { name: "EnumCheck", voting_open: "2026-09-01T00:00:00Z", voting_close: "2026-09-10T00:00:00Z", active_start: "2026-10-01T00:00:00Z", active_end: "2026-11-01T00:00:00Z", base_cost_per_store_cents: 200000 }
              as: FranchisorOps
              captures: { p1: $.data.id }
            - call: "POST /promotions/${p1}/open-voting"
              payload: {}
              as: FranchisorOps
          trigger:
            - call: "POST /promotions/${p1}/votes"
              payload: { store_id: "${s1}", ballot: "MAYBE" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /promotions/${p1}/votes returns 0 rows"

      - name: transfer_create_unknown_store_id_returns_store_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.TransferRequest.fields.store_id
          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "Flat topology puts store_id in the request body; an unknown store id is a 404 ERR_STORE_NOT_FOUND at body-FK existence (priority 4) even when every other field is valid."
        test_recipe:
          setup: ["Logical clock default; buyer franchisee exists; a throwaway store supplies a live version reference."]
          setup_api_calls:
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer", contact_email: "b@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /territories"
              payload: { code: "T-CR-7", region: "Corner", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SCR-9", territory_id: "${terr_id}", franchisee_id: "${fr2}", address: "9 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { any_store_v: $.data.version }
          trigger:
            - call: "POST /transfer-requests"
              payload: { store_id: "00000000-0000-4000-8000-000000000001", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${any_store_v}" }
              as: Franchisee
              as_user_id: "${fr2}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_STORE_NOT_FOUND (existence at priority 4 precedes the priority-5 OCC check)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: site_application_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.SiteApplication
        distinguishing_aspect: "A newly created SiteApplication reads DRAFT with revision_count 0 and store_id null before any submit."
        test_recipe:
          setup: ["Logical clock default; assigned territory, DA, applicant."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-SM-1", region: "SM", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "APP", contact_email: "a@example.com" }
              as: FranchisorOps
              captures: { appf: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "9 Oak", proposed_lat: 40.05, proposed_lng: -75.05, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da}"
              captures: { app: $.data.id }
          trigger:
            - call: "GET /site-applications/${app}"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da}"
          assert:
            - "SiteApplication.${app}.status == DRAFT and revision_count == 0"
            - "SiteApplication.${app}.store_id is null and approved_on is null"

      - name: approve_from_draft_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.SiteApplication.transitions.IMPACT_REVIEW_to_APPROVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Approve is only declared from IMPACT_REVIEW; from DRAFT the same endpoint is a 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["Logical clock default; assigned territory, DA, applicant; application in DRAFT."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-SM-2", region: "SM", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "APP", contact_email: "a@example.com" }
              as: FranchisorOps
              captures: { appf: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "9 Oak", proposed_lat: 40.05, proposed_lng: -75.05, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /site-applications/${app}/approve"
              payload: {}
              as: FranchisorOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "SiteApplication.${app}.status is still DRAFT"

      - name: withdrawn_application_rejects_all_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SiteApplication
        distinguishing_aspect: "WITHDRAWN is terminal: submit, approve, reject, request-revision and a second withdraw all return 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Logical clock default; assigned territory, DA, applicant; application withdrawn from DRAFT."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-SM-3", region: "SM", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "APP", contact_email: "a@example.com" }
              as: FranchisorOps
              captures: { appf: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "9 Oak", proposed_lat: 40.05, proposed_lng: -75.05, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da}"
              captures: { app: $.data.id }
            - call: "POST /site-applications/${app}/withdraw"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da}"
          trigger:
            - call: "POST /site-applications/${app}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da}"
              captures: { err: $.data.error_id }
          assert:
            - "the resubmit returns 409 and err == ERR_INVALID_STATE"
            - "approve, reject, request-revision and withdraw on ${app} each return 409 ERR_INVALID_STATE"
