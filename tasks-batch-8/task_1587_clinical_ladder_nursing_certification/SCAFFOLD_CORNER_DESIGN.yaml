      - name: reimbursement_cap_partial_approval_arithmetic
        claim_type: correct_result
        grounds: [calculations.calc_reimbursement_cap, "validations[priority=20]"]
        distinguishing_aspect: "Cap arithmetic: first claim 120000 fully approved; second claim 60000 partially approved to 30000 (150000 ceiling); third claim rejected with ERR_REIMBURSEMENT_CAP_EXHAUSTED."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse RC with SPECIALTY cert exam_fee 200000"]
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/budget-lines"
              payload: { unit: "MED-2E", fiscal_year: 2027, allocated_cents: 9000000 }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RC2", full_name: "Rc Two", hire_date: "2021-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { rc_nurse: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${rc_nurse}", track: "SPECIALTY", certifying_body: "ANCC", exam_fee_cents: 200000, obtained_on: "2026-07-01T00:00:00Z", expires_on: "2031-07-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { rc_cert: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${rc_cert}", claimed_amount_cents: 120000 }
              as: Nurse
              as_user_id: "${rc_nurse}"
              captures: { rc_c1: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${rc_c1}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${rc_cert}", claimed_amount_cents: 60000 }
              as: Nurse
              as_user_id: "${rc_nurse}"
              captures: { rc_c2: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${rc_c2}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { rc_c2_amt: $.data.approved_amount_cents }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${rc_cert}", claimed_amount_cents: 10000 }
              as: Nurse
              as_user_id: "${rc_nurse}"
              captures: { rc_c3: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${rc_c3}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { rc_c3_err: $.data.error_id }
          assert:
            - "rc_c2_amt == 30000 (partial to ceiling)"
            - "rc_c3_err == ERR_REIMBURSEMENT_CAP_EXHAUSTED"

      - name: retention_rollup_zero_denominator
        claim_type: correct_result
        grounds: [calculations.calc_retention_rollup]
        distinguishing_aspect: "A unit with zero nurses yields demotion_rate == 0.0000 (pinned zero-denominator rule) rather than an error; avg risk over empty population is 0.00."
        test_recipe:
