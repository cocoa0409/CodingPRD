# =============================================================================
# §1.8 Scaffold Difficulty Design — Industrial Gearbox Remanufacturing
# Nine Difficulty Rules × 2 instances each. All arithmetic literals in assert:
# lines were pre-computed by executing the §1.3 formulas as code.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains: (1) pricing on RemanOrder (provisional estimate vs final
  # invoice), (2) warranty eligibility on WarrantyClaim (hours basis vs
  # calendar basis).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_estimate_vs_final_invoice_on_reman_order
        grounds:
          - calculations.final_invoice_total
          - calculations.component_line_total
          - calculations.freight_charge
          - entities.RemanOrder.fields.quoted_estimate_cents
          - entities.RemanOrder.fields.final_invoice_cents
        distinguishing_aspect: |
          Same RemanOrder carries two price figures from different algorithms:
          quoted_estimate_cents is the forward-looking intake estimate (flat
          input), final_invoice_cents is the chronological post-teardown actual
          (per-line rounded scope + freight surcharge) — for identical order
          data they MUST differ (500000 quoted vs 746300 final).
        test_recipe:
          setup:
            - "Customer CU with credit_limit_cents 50000000; GearUnit U checked in (AT_SHOP) with cumulative_service_hours 1200"
            - "RemanOrder O in SCOPE_APPROVAL with quoted_estimate_cents=500000 and two PENDING decisions: REGRIND 4.0h/12000 and CUT_NEW 6.5h/450000 (approved_scope_cents=588300)"
            - "OUTBOUND FreightShipment for O: 1500kg, 4 rigging hours (freight_charge_cents=158000), DELIVERED"
            - "O approved, built, assembled (in tolerance), run-in PASS"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Acme Mining", credit_limit_cents: 50000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-1001", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 1200 }
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 1200, quoted_estimate_cents: 500000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 3, notes: "flank wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "GEAR_2", condition: "CUT_ONLY", severity: 4, notes: "pitting" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 4.0, material_cents: 12000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "GEAR_2", action: "CUT_NEW", labor_hours: 6.5, material_cents: 450000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.12, radial_clearance_mm: 0.03, axial_clearance_mm: 0.04 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 1500, rigging_bay_date: "2026-08-10", rigging_bay_hours: 4 }
              as: IntakeCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /reman/shipments/${ship_id}/dispatch"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/shipments/${ship_id}/deliver"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 88.0, vibration_mm_s: 3.1, oil_particle_count: 2400 }
              as: QualityInspector
              captures: { rit_id: $.data.id }
            - call: "GET /reman/orders/${order_id}"
              payload: {}
              as: ServiceManager
          assert:
            - "RemanOrder.${order_id}.quoted_estimate_cents == 500000"
            - "RemanOrder.${order_id}.approved_scope_cents == 588300"
            - "RemanOrder.${order_id}.final_invoice_cents == 746300"
            - "RemanOrder.${order_id}.final_invoice_cents != RemanOrder.${order_id}.quoted_estimate_cents"
            - "RemanOrder.${order_id}.status == READY_TO_SHIP"

      - name: warranty_hours_basis_vs_calendar_basis_on_claim
        grounds:
          - calculations.warranty_eligibility
          - entities.WarrantyClaim.fields.eligibility
          - entities.WarrantyClaim.fields.hours_since_reman
        distinguishing_aspect: |
          Same WarrantyClaim data yields two different verdicts from the two
          variants: hours basis (hours_since_reman=1800 <= 2000 → COVERED) and
          calendar basis (claim filed 461 whole days after completion > 365 →
          EXPIRED_CALENDAR); the pinned precedence evaluates hours first, so
          the single eligibility field resolves to EXPIRED_CALENDAR — the
          variants diverge on identical claim input.
        test_recipe:
          setup:
            - "Completed order for unit U with warranty clock start at cumulative_service_hours=1200; order completed at logical date 2025-06-01 (clock never advanced during the pipeline)"
            - "RunInTest with oil_baseline_established=true exists for the order"
            - "Logical clock advanced to 2026-09-05T00:00:00Z (calendar age 461 days > 365)"
            - "Unit's cumulative_service_hours advanced to 3000 in service (hours_since_reman = 3000-1200 = 1800)"
          setup_api_calls:
            - call: "POST /reman/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: ServiceManager
            - call: "POST /reman/customers"
              payload: { legal_name: "Borealis Paper", credit_limit_cents: 50000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-2002", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 1200 }
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 1200, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.10, radial_clearance_mm: 0.02, axial_clearance_mm: 0.02 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/run-in-tests"
              payload: { duration_minutes: 120, max_temp_c: 80.0, vibration_mm_s: 2.0, oil_particle_count: 1500 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/shipments"
              payload: { direction: "OUTBOUND", weight_kg: 400, rigging_bay_date: "2025-07-20", rigging_bay_hours: 2 }
              as: IntakeCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/ship"
              payload: {}
              as: ServiceManager
            - call: "POST /reman/shipments/${ship_id}/deliver"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/orders/${order_id}/complete"
              payload: {}
              as: ServiceManager
            - call: "POST /reman/units/${unit_id}/record-service-hours"
              payload: { hours: 3000 }
              as: IntakeCoordinator
            - call: "POST /reman/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /reman/orders/${order_id}/warranty-claims"
              payload: { reported_hours: 3000, claim_reason: "output seal leak" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "WarrantyClaim.${claim_id}.hours_since_reman == 1800"
            - "WarrantyClaim.${claim_id}.warranty_clock_start_hours == 1200"
            - "hours basis verdict would be COVERED (1800 <= 2000) while calendar basis verdict is EXPIRED_CALENDAR (400 > 365) — the variants diverge on identical claim data"
            - "WarrantyClaim.${claim_id}.eligibility == EXPIRED_CALENDAR"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two calculations in DIFFERENT modes:
  # (a) >=3 inputs with non-linear interaction — component_line_total
  #     (action-tier rate × labor_hours × rush multiplier + material);
  # (b) nested rounding order — per-line round then sum vs sum-then-round.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_labor_rate_times_rush_multiplier_times_hours
        grounds:
          - calculations.component_line_total
          - entities.ComponentDecision.fields.line_total_cents
        distinguishing_aspect: |
          Mode (a): four inputs (action tier rate, labor_hours, rush flag,
          material_cents) interact non-linearly — tiered rate selection by
          action, then multiplicative rush factor on labor only, then additive
          material: rush CUT_NEW 6.5h/450000 yields 565375, its non-rush twin
          542300, and the difference lands entirely in labor (material immune).
        test_recipe:
          setup:
            - "Two customers/units/orders in TEARDOWN, identical single finding CUT_ONLY and decision CUT_NEW 6.5h/450000; order R has rush=true, order N has rush=false"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Rush Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_r: $.data.id }
            - call: "POST /reman/customers/${cust_r}/units"
              payload: { serial_number: "GBX-R1", model: "HZ-450", rated_torque_nm: 9000 }
              as: IntakeCoordinator
              captures: { unit_r: $.data.id }
            - call: "POST /reman/units/${unit_r}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_r}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 700000, rush: true }
              as: IntakeCoordinator
              captures: { order_r: $.data.id }
            - call: "POST /reman/orders/${order_r}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_r}/findings"
              payload: { component_code: "GEAR_2", condition: "CUT_ONLY", severity: 4, notes: "pitting" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_r}/decisions"
              payload: { component_code: "GEAR_2", action: "CUT_NEW", labor_hours: 6.5, material_cents: 450000 }
              as: RemanEngineer
              captures: { dec_r: $.data.id }
            - call: "POST /reman/customers"
              payload: { legal_name: "Normal Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_n: $.data.id }
            - call: "POST /reman/customers/${cust_n}/units"
              payload: { serial_number: "GBX-N1", model: "HZ-450", rated_torque_nm: 9000 }
              as: IntakeCoordinator
              captures: { unit_n: $.data.id }
            - call: "POST /reman/units/${unit_n}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_n}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 700000, rush: false }
              as: IntakeCoordinator
              captures: { order_n: $.data.id }
            - call: "POST /reman/orders/${order_n}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_n}/findings"
              payload: { component_code: "GEAR_2", condition: "CUT_ONLY", severity: 4, notes: "pitting" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_n}/decisions"
              payload: { component_code: "GEAR_2", action: "CUT_NEW", labor_hours: 6.5, material_cents: 450000 }
              as: RemanEngineer
              captures: { dec_n: $.data.id }
          trigger:
            - call: "GET /reman/orders/${order_r}/decisions"
              payload: {}
              as: RemanEngineer
            - call: "GET /reman/orders/${order_n}/decisions"
              payload: {}
              as: RemanEngineer
          assert:
            - "ComponentDecision.${dec_r}.line_total_cents == 565375"
            - "ComponentDecision.${dec_n}.line_total_cents == 542300"
            - "rush premium == 23075, entirely in labor: 565375-542300 == round_half_up(6.5*14200*1.25) - round_half_up(6.5*14200*1.0) == 115375 - 92300"

      - name: per_line_round_then_sum_beats_sum_then_round
        grounds:
          - calculations.component_line_total
          - calculations.approved_scope_total
          - entities.RemanOrder.fields.approved_scope_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned as round-per-line-then-sum. Two
          REGRIND lines 1.335h and 2.665h with zero material yield per-line
          11348 + 22653 = 34001, while sum-then-round would give 34000 — the
          scaffold mandates 34001.
        test_recipe:
          setup:
            - "Order in TEARDOWN with two findings (PINION_1, GEAR_2) and two REGRIND decisions: 1.335h/0 and 2.665h/0, non-rush"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Round Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-RND", model: "HZ-200", rated_torque_nm: 5000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "GEAR_2", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 1.335, material_cents: 0 }
              as: RemanEngineer
              captures: { dec1: $.data.id }
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "GEAR_2", action: "REGRIND", labor_hours: 2.665, material_cents: 0 }
              as: RemanEngineer
              captures: { dec2: $.data.id }
          trigger:
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "GET /reman/orders/${order_id}"
              payload: {}
              as: RemanEngineer
          assert:
            - "ComponentDecision.${dec1}.line_total_cents == 11348"
            - "ComponentDecision.${dec2}.line_total_cents == 22653"
            - "RemanOrder.${order_id}.approved_scope_cents == 34001"
            - "approved_scope_cents != 34000 (the sum-then-round result is non-conformant)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on different entities:
  # (1) RemanOrder revision loop SCOPE_APPROVAL → SCOPE_APPROVAL;
  # (2) GearUnit parallel dimensions physical_status × commercial_status.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reman_order_scope_approval_revision_loop
        grounds:
          - state_machines.RemanOrder.SCOPE_APPROVAL_to_SCOPE_APPROVAL
          - calculations.approved_scope_total
          - "concurrency_rules[scope-revision-stale-order]"
        distinguishing_aspect: |
          RemanOrder exhibits a true cycle: revise-scope loops SCOPE_APPROVAL
          back into itself, superseding the prior PENDING decision set and
          recomputing approved_scope_cents (first 46000, then 22653 after the
          revision) — not a linear pipeline step.
        test_recipe:
          setup:
            - "Order in SCOPE_APPROVAL with one PENDING decision REGRIND 4.0h/12000 (scope 46000)"
            - "Engineer posts a replacement decision REGRIND 2.665h/0, then revise-scope"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Loop Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-L1", model: "HZ-200", rated_torque_nm: 5000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 100000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 4.0, material_cents: 12000 }
              as: RemanEngineer
              captures: { dec_old: $.data.id }
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "GET /reman/orders/${order_id}"
              payload: {}
              as: RemanEngineer
              captures: { order_v: $.data.version }
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.665, material_cents: 0 }
              as: RemanEngineer
              captures: { dec_new: $.data.id }
          trigger:
            - call: "POST /reman/orders/${order_id}/revise-scope"
              payload: { expected_order_version: "${order_v}" }
              as: RemanEngineer
            - call: "GET /reman/orders/${order_id}"
              payload: {}
              as: RemanEngineer
          assert:
            - "RemanOrder.${order_id}.status == SCOPE_APPROVAL (looped back into same state)"
            - "ComponentDecision.${dec_old}.approval_status == SUPERSEDED"
            - "ComponentDecision.${dec_new}.approval_status == PENDING"
            - "RemanOrder.${order_id}.approved_scope_cents == 22653"

      - name: gear_unit_parallel_physical_and_commercial_dimensions
        grounds:
          - state_machines.GearUnit
          - entities.GearUnit.fields.physical_status
          - entities.GearUnit.fields.commercial_status
        distinguishing_aspect: |
          GearUnit carries two independent state axes on one row: a warranty
          claim moves commercial_status STANDARD→UNDER_WARRANTY_REVIEW while
          physical_status stays IN_SERVICE, and a later check-in attempt is
          gated only by commercial WARRANTY_FLAGGED — the dimensions evolve
          independently and gate independently.
        test_recipe:
          setup:
            - "Completed order O for unit U (U back IN_SERVICE, commercial STANDARD)"
            - "Warranty claim opened on O, moved to UNDER_REVIEW (U.commercial_status → UNDER_WARRANTY_REVIEW)"
          setup_api_calls:
            - call: "POST /reman/customers"
              payload: { legal_name: "Parallel Co", credit_limit_cents: 90000000 }
              as: IntakeCoordinator
              captures: { cust_id: $.data.id }
            - call: "POST /reman/customers/${cust_id}/units"
              payload: { serial_number: "GBX-P1", model: "HZ-450", rated_torque_nm: 12000 }
              as: IntakeCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /reman/units/${unit_id}/check-in"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /reman/units/${unit_id}/orders"
              payload: { intake_hours: 0, quoted_estimate_cents: 10000, rush: false }
              as: IntakeCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /reman/orders/${order_id}/start-teardown"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/findings"
              payload: { component_code: "PINION_1", condition: "REGRINDABLE", severity: 2, notes: "wear" }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/decisions"
              payload: { component_code: "PINION_1", action: "REGRIND", labor_hours: 2.0, material_cents: 5000 }
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/submit-scope"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/approve-scope"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /reman/orders/${order_id}/start-build"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/start-assembly"
              payload: {}
              as: RemanEngineer
            - call: "POST /reman/orders/${order_id}/assembly-records"
              payload: { backlash_mm: 0.10, radial_clearance_mm: 0.02, axial_clearance_mm: 0.02 }
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/submit-assembly"
              payload: {}
              as: QualityInspector
            - call: "POST /reman/orders/${order_id}/run-in-tests"
