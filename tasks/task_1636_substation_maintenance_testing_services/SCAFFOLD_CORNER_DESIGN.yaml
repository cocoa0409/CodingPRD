              payload: {}
              as: OutageCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OUTSIDE_WINDOW"
      - name: asset_filter_combined_with_pagination
        claim_type: pagination_with_filtering
        grounds: ["endpoints.\"GET /assets\""]
        distinguishing_aspect: "Filter and pagination interact: asset_class=CIRCUIT_BREAKER over a mixed fleet returns total_count of only the matching subset."
        test_recipe:
          setup: ["two POWER_TRANSFORMER assets and one CIRCUIT_BREAKER asset"]
