  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_on_contribution
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contribution-post-stale-account]", "validations[priority=16]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "A second contribution carrying the pre-first-contribution expected_account_version (now stale) returns 412 ERR_STALE_ACCOUNT_VERSION."
        test_recipe:
          setup: ["An ACTIVE HSA. One contribution has already advanced Account.version; the test reuses the now-stale version captured before it."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "occ@x.com", full_name: "OCC", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { acc_v_stale: $.data.version }
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 50000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${acc_v_stale}" }
              as: PlanAdmin
          trigger:
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 50000, source: "EMPLOYER", posted_at: "2026-03-01T00:00:00Z", expected_account_version: "${acc_v_stale}" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response code 412; error_id == ERR_STALE_ACCOUNT_VERSION (version advanced by the first contribution)"
            - "Account.${acc_id}.contributed_cents == 50000 (stale second contribution not applied)"

      - name: occ_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: [entities.Account.fields.version, calculations.Available-Balance]
        distinguishing_aspect: "Account.version starts at 1 on create, becomes 2 after activate, and 3 after one contribution — one increment per mutation."
        test_recipe:
          setup: ["A fresh HSA account."]
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "vi@x.com", full_name: "VI", birth_date: "1990-01-01", hdhp_covered: true }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "HSA", coverage_tier: "SELF_ONLY", elected_amount_cents: 437500 }
              as: PlanAdmin
              captures: { acc_id: $.data.id, v_create: $.data.version }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { v_activate: $.data.version }
          trigger:
            - call: "POST /accounts/${acc_id}/contributions"
              payload: { amount_cents: 10000, source: "PAYROLL", posted_at: "2026-02-01T00:00:00Z", expected_account_version: "${v_activate}" }
              as: PlanAdmin
            - call: "GET /accounts/${acc_id}"
              payload: {}
              as: PlanAdmin
              captures: { v_after: $.data.version }
          assert:
            - "Account.${acc_id}.version == 1 at create, 2 after activate, 3 after the contribution"

      - name: derived_reimbursed_cents_reconciles_after_clawback_excluded
        claim_type: derived_field_reconciliation
        grounds: [entities.Account.fields.reimbursed_cents, calculations.Available-Balance]
        excluded_because:
          difficulty_instance: compensating_invariant / reimburse_then_clawback_conserves_fsa_election_pool
          rationale: "Reconciliation of reimbursed_cents/available_balance_cents after a clawback is asserted by the named §1.8 instance."

      - name: rate_threshold_contribution_cap_excluded
        claim_type: rate_threshold_triggers
        grounds: [calculations.HSA-Contribution-Cap, "validations[priority=12]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / hsa_cap_exact_boundary_on_contributions_endpoint
          rationale: "The cumulative-threshold boundary at the cap is asserted by the named §1.8 instance."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_balance_visible_in_same_disburse_response_chain_excluded
        claim_type: immediate
        grounds: [calculations.Available-Balance, state_machines.Account.ACTIVE_to_DEPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / disburse_cascade_depth3_claim_ledger_account_depletion
          rationale: "The synchronous (immediate) recompute of balance and funding_status within the disburse request is asserted by the named §1.8 instance."

      - name: immediate_contribution_balance_visible_on_read
        claim_type: immediate
        grounds: [calculations.Available-Balance, entities.Account.fields.available_balance_cents]
        distinguishing_aspect: "available_balance_cents reflects a posted contribution immediately on the very next GET (immediate consistency, no lag)."
