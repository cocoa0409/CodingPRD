        grounds:
          - state_machines.Voyage.BOOKING_OPEN_to_BLANKED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / blank_sailing_cascade_depth4
          rationale: "N-level cascade ordering is asserted link-by-link there; booking_cancel_cascade_depth3 covers the second trigger."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.demurrage_detention_charge
          - calculations.credit_exposure
          - calculations.ocean_freight_charge
        excluded_because:
          difficulty_instance: dual_variant_calc / demurrage_provisional_vs_final_divergence
          rationale: "All three variant pairs (demurrage, exposure, contract-vs-spot) are asserted with literal divergent values in §1.8."

