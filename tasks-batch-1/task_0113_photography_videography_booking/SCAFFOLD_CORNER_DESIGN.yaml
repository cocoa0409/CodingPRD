            - call: "POST /studio/galleries"
              payload: { booking_id: "${bk7}" }
              as: Photographer
              as_user_id: "${pe7}"
              captures: { g7: $.data.id }
            - call: "POST /studio/galleries/${g7}/upload"
              payload: { delivered_image_count: 30 }
