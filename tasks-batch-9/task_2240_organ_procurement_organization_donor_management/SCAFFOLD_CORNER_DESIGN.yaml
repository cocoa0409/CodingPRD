              as: MedicalDirector
              as_user_id: "md-1"
              captures: { int_final: $.data.status, int_processor: $.data.tissue_processor_code }
            - call: "GET /opo/donor-cases/${case_id}"
              payload: {}
              as: OpoAdmin
              captures: { nontx: $.data.organs_nontransplantable_count, alloc: $.data.allocation_status, posture: $.data.case_posture }
          assert:
            - "${panc_state} == NON_TRANSPLANTABLE with ${panc_reason} == ANATOMIC_ANOMALY"
            - "${panc_final} == RESEARCH_REFERRED with ${panc_protocol} == IRB-4471"
            - "${int_final} == TISSUE_REFERRED with ${int_processor} == TP-88"
            - "${nontx} == 2 and DonorCase.${case_id}.organs_recovered_count == 2 (both organs are in the recovered-or-beyond family)"
            - "${alloc} == NOT_STARTED and ${posture} == OPEN: no declared transition closes an allocation dimension that never opened"

      - name: parallel_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.DonorCase
        excluded_because:
          difficulty_instance: non_linear_state_machine / donor_case_parallel_dimensions_advance_independently
          rationale: "That §1.8 instance already drives the physiologic and allocation dimensions across each other and asserts the combined state after every step."

      - name: screening_information_request_cycle
        claim_type: cyclic
        grounds:
          - state_machines.EligibilityScreening.PENDING_to_INFO_REQUESTED
          - state_machines.EligibilityScreening.INFO_REQUESTED_to_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / screening_info_request_cycle_capped_at_two_loops
          rationale: "The two PENDING<->INFO_REQUESTED loops and the capped third request are asserted there."

      - name: authorization_rescission_cascade
        claim_type: cascade_down
        grounds:
          - state_machines.Authorization.AUTHORIZED_to_RESCINDED
          - state_machines.Organ.PENDING_EVAL_ALLOCATABLE_OFFERING_ACCEPTED_to_NON_TRANSPLANTABLE
        excluded_because:
          difficulty_instance: transitive_cascade / authorization_rescission_cascade_depth_five
          rationale: "The five-hop rescission cascade over referral, case, organ, run, offers and operation is asserted end to end there."

      - name: viability_hold_cascade_from_decompensation
        claim_type: conditional_cascade
        grounds:
          - state_machines.DonorCase.physiologic_status_OPTIMIZED_to_DECOMPENSATING
          - entities.Organ.fields.viability_hold
        excluded_because:
          difficulty_instance: transitive_cascade / physiologic_decompensation_cascade_depth_four
          rationale: "The thoracic-only hold, the closed run and the bypassed offers - with the abdominal control organ untouched - are asserted there."

      - name: acceptance_withdrawal_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.OrganOffer.ACCEPTED_to_WITHDRAWN
          - state_machines.MatchRun.CLOSED_to_OPEN
        excluded_because:
          difficulty_instance: compensating_invariant / allocation_slot_conservation_across_acceptance_withdrawal
          rationale: "The withdrawal restores the bypassed peers, re-promotes them and returns the slot ledger with no drift there."

      - name: team_or_minutes_ledger_sync
        claim_type: ledger_sync
        grounds:
          - entities.RecoveryTeam.fields.booked_or_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / recovery_team_or_minutes_ledger_returns_to_zero_on_cancel
          rationale: "Booking and cancellation reconcile the ancestor ledger before and after there."

