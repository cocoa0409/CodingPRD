  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_cycles_five_times_then_hits_round_cap
        grounds:
          - state_machines.Negotiation.AGENCY_OFFER_to_SELLER_COUNTER
          - state_machines.Negotiation.SELLER_COUNTER_to_AGENCY_OFFER
          - state_machines.Negotiation.SELLER_COUNTER_to_ACCEPTED
          - entities.Negotiation.fields.round_number
          - validations[priority 28]
          - errors.ERR_NEGOTIATION_ROUND_CAP_REACHED
        distinguishing_aspect: |
          The negotiation revisits AGENCY_OFFER and SELLER_COUNTER three times each, so
          status alone cannot say whether the next move is legal - only round_number can.
          The 7th move is refused with ERR_NEGOTIATION_ROUND_CAP_REACHED while the exit
          transition to ACCEPTED from the very same SELLER_COUNTER state still succeeds,
          proving the cap gates the cycle edges and not the state.
        test_recipe:
          setup:
            - "one advertiser, one seller and an APPROVED campaign whose single LINEAR_TV allocation is LOCKED"
            - "a negotiation opened at 3,000,000 impressions and CPM 2000, then cycled: counter, revise, counter, revise, counter"
            - "after those five moves round_number is 6 - the declared MAX_NEGOTIATION_ROUNDS - and the seller counter of 2,900,000 impressions at CPM 2025 is on the table"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Solstice Retail", category_code: "RETAIL", credit_limit_cents: 80000000, payment_terms_days: 30, sequential_liability_enabled: true }
