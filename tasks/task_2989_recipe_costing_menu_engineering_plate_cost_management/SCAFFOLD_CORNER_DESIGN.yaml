            - "${b_appr} == PENDING but ${open_after_submit} == 2 and ${v_after_submit} == ${v_2} — submission moves the ORDER's dimension and leaves the recipe entirely alone, counter included"
            - "${b_appr2} == REJECTED with ${b_reason} stored, and ${open_3} == 1 with ${v_3} == ${v_2} + 1 — a rejection decrements"
            - "${comp_count_3} == 1, ${sodium_3} == 620000 and ${state_3} == FRESH — the rejection released the counter without touching the specification, so a rejected order costs the recipe nothing but a version"
            - "${e_double} == ERR_SCO_INVALID_STATE (409) and ${open_after_double} == 1 — the counter cannot be driven negative by replaying a rejection"
            - "the approval decrements the other unit: ${a_appr} == APPROVED and ${open_4} == 0 exactly, with the snapshots ${a_pre_qty} == 400, ${a_pre_batch} == 3880071 and ${a_pre_mask} == 1 captured BEFORE the edit"
            - "${comp_count_4} == 1 (a quantity change adds no component), ${sodium_4} == 775000 == round_half_up(500*6200/4), ${kcal_4} == 500000000 and ${state_4} == STALE"
            - "${batch_4} == 3880071 — approve deliberately does not re-cost, so the batch figure still describes the 400-gram specification while cost_state says so"
            - "${mi_sodium1} == 775000 refreshed onto the item, ${mi_plate_state1} == STALE and ${mi_class1} == UNCLASSIFIED — the counter's reconciliation and the cascade are independent effects of the same call"

      - name: n_level_cascade_ordering_and_partial_reach
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: price_feed_publication_five_hop_invalidation_from_ingredient_to_margin_class
          rationale: "The cascading_side_effects layer asks for an N-level chain verified end to end with its ordering pinned. The §1.8 transitive_cascade pair already does exactly that twice over: the price-feed publication instance walks all five hops from the IngredientPrice row through the recipe, its parents, the menu item and the margin class, and the spec-change instance walks the four-hop approval cascade down to the reverted LTO campaign and the OUT_OF_DATE prep guide and count lines, each asserting which entities are deliberately NOT reached. A third chain here would restate the same hops with less precise figures."

      - name: both_cost_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: recipe_cost_rollup_latest_published_versus_weighted_average_on_recipe
          rationale: "The dual_variant_calculation layer asks that both variants produce their own expected result and that the delta on switching is correct. The §1.8 dual_variant_calc pair covers both declared variant families end to end — LATEST_PUBLISHED versus WEIGHTED_AVG_90D on the recipe roll-up, including the duration weights and the fallback, and SALES_MIX_BASED versus USAGE_BASED on the period review's theoretical cost — with the divergence computed on identical data. The §1.9 calculations section additionally pins the cross-basis rejection (ERR_COST_STALE when a child is FRESH under the other basis), so the switch semantics are covered from both sides."

  - section: consistency_model
    instances:
      - name: every_cascade_and_every_derived_field_is_visible_to_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model immediate
          - state_machines[PriceFeed] DRAFT -> PUBLISHED
          - endpoints[POST /culinary/menu-period-reviews/{id}/count-lines]
        distinguishing_aspect: "The consistency contract is immediate, so this instance refuses every excuse for lag. Derived fields appear in the WRITE's own response body — the count line comes back with its expected usage and variance already computed — and a multi-hop cascade is fully settled by the time the publish call returns: the read that immediately follows sees the recipe STALE, the menu item STALE and its margin class cleared, with no retry, no re-read and no second call. The instance also pins what must NOT move in the same breath: the price move leaves the count line's sync_state CURRENT, because a cost change is not a specification change."
        test_recipe:
          setup:
            - "GRILL WORLD in MW at the July price: CHEDDAR-BLOCK PUBLISHED at 22000000 micros / 2268 from 2026-07-01, PLATE-GRILL ACTIVE with CHEDDAR ep 400 over 4 portions, MI-GRILL-MW ACTIVE at 400 cents with plate_cost_cents 100."
