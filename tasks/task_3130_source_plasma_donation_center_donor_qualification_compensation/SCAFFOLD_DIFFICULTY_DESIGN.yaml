  # =====================================================================
  # Rule 3 — non_linear_state_machine: non-linear shapes on DIFFERENT
  # entities (DonationUnit cycle, Donor cycle, PlasmaCenter cycle).
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: donation_unit_quarantine_release_lookback_cycle
        grounds:
          - state_machines.DonationUnit.QUARANTINED_to_RELEASED
          - state_machines.DonationUnit.RELEASED_to_LOOKBACK_HOLD
          - state_machines.DonationUnit.LOOKBACK_HOLD_to_RELEASED
          - state_machines.LookBackCase.OPEN_to_UNITS_QUARANTINED
        distinguishing_aspect: |
          Entity = DonationUnit, shape = CYCLE: a unit travels
          QUARANTINED -> RELEASED (donor qualification) -> LOOKBACK_HOLD (later
          reactive screening of the same donor) -> RELEASED (false-positive look-back
          resolution). A linear machine could never revisit RELEASED; the cycle also
          preserves released_at across the hold and re-stamps it on re-release.
        test_recipe:
          setup:
            - "Center with schedule; donor COMPLETES d1 (2026-09-01) and d2 (2026-09-04) -> donor QUALIFIED and both units auto-RELEASED"
            - "A third screening s3 for the same donor is IN_PROGRESS on 2026-09-05 with IDENTITY/HEALTH/PHYSICAL recorded PASS"
