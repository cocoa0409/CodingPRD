      - name: weighted_strike_total_suspends_only_at_exactly_the_strike_limit
        grounds:
          - calculations.strike_weight_ledger
          - entities.Section.fields.strike_limit
          - entities.Player.fields.strike_count
          - state_machines.Player.ACTIVE_to_STRIKE_SUSPENDED
          - entities.RosterSpot.fields.ineligible_reason
        distinguishing_aspect: |
          Weighted totals, not strike counts, drive suspension: player h2 accumulates
          NO_SHOW_DEFAULT (1) plus INELIGIBLE_LINEUP (2) == exactly strike_limit 3 and becomes
          STRIKE_SUSPENDED, while player a2 holds a single INELIGIBLE_LINEUP of weight 2 and
          stays ACTIVE even though both players are one strike away by count — and h2 reached
          the limit with two rows while a2 did not with one, so a row-counting implementation
          suspends a2 too early or h2 too late.
        test_recipe:
          setup:
            - "Section SOCAL-2026 with strike_limit 3 and disqualification_strike_limit 6."
            - "SECTION league with min_active_roster_size 2; Team H (captain h1, plus h2) and Team A (captain a1, plus a2) both IN_PLAY with two ACTIVE spots each, so both teams start roster_compliant."
            - "Player a2 already carries one INELIGIBLE_LINEUP strike (weight 2, strike_count 2 < 3) and is still ACTIVE with its spot ACTIVE."
            - "Player h2 already carries one NO_SHOW_DEFAULT strike (weight 1, strike_count 1)."
            - "Clock stays at 2026-08-08T00:00:00Z; no match exists, so nothing but the ledger can change a player's status."
