      - name: appeal_create_rejects_a_stale_determination_version
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.appeal-create-stale-determination, "errors[ERR_STALE_DETERMINATION_VERSION]"]
        distinguishing_aspect: |
          The appeal's OCC parent is the DETERMINATION, and the evidence axis is enough
          to move it: promoting evidence to VERIFIED bumps the version, so a client that
          read the determination before that promotion is refused. Filing an appeal bumps
          it again, which is why a replayed filing gets 412 rather than the auto-withdraw
          path that a second legitimate appeal would take.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 and MATH-100; one ACTIVE rule TRANSCRIPT_GPA -> MATH-050."
            - "Student SX4 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z) with one determination at version 1."
