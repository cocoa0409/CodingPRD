  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints GET /recordkeepers"]
        distinguishing_aspect: "Pagination contract: limit=2 over 3 rows returns exactly 2 with total_count == 3 and has_more == true; offset=2 returns the last row with has_more == false."
        test_recipe:
          setup: ["three recordkeepers created"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps }
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-B", legal_name: "Recordkeeper B" }, as: ProviderOps }
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-C", legal_name: "Recordkeeper C" }, as: ProviderOps }
          trigger:
            - { call: "GET /recordkeepers?limit=2&offset=0", payload: {}, as: ProviderOps, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /recordkeepers?limit=2&offset=2", payload: {}, as: ProviderOps }
          assert:
            - "Page 1: response_type == array, data length == 2, total_count == 3, has_more == true"
            - "Page 2 (offset=2): data length == 1, total_count == 3, has_more == false"
            - "Default limit is 10 when limit/offset are omitted (fourth call without params returns all 3)"

      - name: error_envelope_shape
        claim_type: computed_read
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every error response carries meta.api_request_id, meta.api_request_timestamp, response_type == error, and data.error_id + data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /recordkeepers/00000000-0000-0000-0000-000000000000", payload: {}, as: ProviderOps, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND; body has meta.api_request_id (non-empty string), meta.api_request_timestamp, response_type == error, and data.message (non-empty)"

      - name: filtered_list_cases_by_status
        claim_type: listing
        grounds: ["endpoints GET /distribution-cases"]
        distinguishing_aspect: "Filter semantics: case_status=NOTIFIED returns exactly the notified case; case_status=EXECUTED returns an empty array with total_count == 0 (not an error)."
        test_recipe:
          setup: ["batch LOCKED with two cases; case A NOTIFIED (notice delivered), case B IDENTIFIED (notice SENT only)"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
