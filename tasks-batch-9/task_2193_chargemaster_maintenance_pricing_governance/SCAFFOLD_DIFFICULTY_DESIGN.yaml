      - CapturedCharge.${l1_id}.expected_charge_cents == 128000 and CapturedCharge.${l1_id}.line_variance_bp == 195 and CapturedCharge.${l1_id}.match_status == PRICE_VARIANCE
      - CapturedCharge.${l2_id}.expected_charge_cents == 128000 and CapturedCharge.${l2_id}.line_variance_bp == -234 and CapturedCharge.${l2_id}.match_status == PRICE_VARIANCE
      - CapturedCharge.${l3_id}.expected_charge_cents == 6400000 and CapturedCharge.${l3_id}.line_variance_bp == 0 and CapturedCharge.${l3_id}.match_status == MATCHED
