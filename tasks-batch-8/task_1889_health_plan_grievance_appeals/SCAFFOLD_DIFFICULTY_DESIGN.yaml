              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (reopening requires source case CLOSED; case is IN_REVIEW)"
            - "No Reopening row is created for ${c_ce3}"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: deadline_policy_active_uniqueness_point_overlap
        grounds:
          - entities.DeadlinePolicy.fields.active
          - entities.DeadlinePolicy.fields.program
        distinguishing_aspect: |
          Point-in-key-space overlap semantics: only one ACTIVE DeadlinePolicy
          may occupy the (program, case_kind, priority_track) key point at any
          instant — creating a second active policy for the same triple
          deactivates the first (replacement semantics, not interval rejection).
        test_recipe:
          setup:
            - "Existing active policy P1 for (MEDICARE, APPEAL, STANDARD) with resolution_hours 168"
          setup_api_calls:
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 168, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
              captures: { pol1: $.data.id }
          trigger:
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD", resolution_hours: 120, extension_hours: 0, effectuation_hours: 48 }
              as: PlatformAdmin
              captures: { pol2: $.data.id }
            - call: "GET /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "APPEAL", priority_track: "STANDARD" }
              as: ComplianceOfficer
              captures: { rows: $.data }
          assert:
            - "Policy ${pol2}.active == true and Policy ${pol1}.active == false after the second create (new active policy occupies the key point and evicts the incumbent)"
            - "GET with active=true returns exactly 1 row for the triple"

      - name: duplicate_case_intake_one_hour_window
        grounds:
          - validations[priority=20]
          - entities.GrievanceAppealCase.fields.received_at
        distinguishing_aspect: |
          Sliding-window interval overlap semantics on the Case resource: a new
          intake collides with an existing non-terminal case for the same
          (member_id, case_kind, provider_id) when received within a 1h
          half-open look-back window — a duration-window overlap, different
          from the policy key-point semantics above and from the reopening
          window below.
        test_recipe:
          setup:
            - "Case C1 for member M (GRIEVANCE, no provider) received at 2026-08-01T00:00, still RECEIVED"
            - "Clock at 2026-08-01T00:30 (inside 1h window) for the colliding attempt; then 2026-08-01T01:00 (boundary) and 2026-08-01T01:01 (outside)"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-TO2", full_name: "Gus Yang", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_to2: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_to2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_to2: $.data.id }
          trigger:
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_to2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { err_dup: $.data.error_id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:01:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_to2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_to2_ok: $.data.id }
          assert:
            - "Intake at +30min: error_id == ERR_DUPLICATE_CASE (inside the 1h window)"
            - "Intake at +61min succeeds (outside the window) and creates case ${c_to2_ok}"

      - name: reopening_window_180_day_interval_membership
        grounds:
          - validations[priority=11]
          - state_machines.Reopening.UNDER_REVIEW_to_GRANTED
        distinguishing_aspect: |
          Fixed-deadline interval membership semantics on the Reopening
          resource: NEW_EVIDENCE requests must fall inside [closed_at,
          closed_at + 180 days]; at exactly 180 days the request is inside
          (inclusive end), at 180 days + 1h it fails — a third interval
          semantic (closed interval membership vs sliding window vs key-point
          replacement).
        test_recipe:
          setup:
            - "GRIEVANCE case decided UNFAVORABLE, notified, closed at 2026-08-02T00:00:00Z"
            - "Reopening requests attempted at closed_at + 180d (inside) — succeeds; a separate case closed at same time gets a request at closed_at + 180d + 1h (outside) — fails"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-TO3", full_name: "Hana Lee", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_to3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_to3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_to3: $.data.id }
            - call: "POST /appeals/cases/${c_to3}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_to3}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases/${c_to3}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_to3}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_to3: $.data.id }
            - call: "POST /appeals/notifications/${n_to3}/mark-sent"
              payload: {}
              as: MemberServicesRep
            - call: "POST /appeals/cases/${c_to3}/close"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/reopenings"
              payload: { case_id: "${c_to3}", request_reason: "NEW_EVIDENCE" }
              as: ComplianceOfficer
              captures: { r_to3: $.data.id }
          assert:
            - "Reopening at exactly closed_at + 180 days (2026-08-02 + 180d = 2027-01-29) is accepted: Reopening.${r_to3}.status == REQUESTED (inclusive interval end)"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: member_open_case_count_create_withdraw_invariant
        grounds:
          - entities.Member.fields.open_case_count
          - state_machines.GrievanceAppealCase.IN_REVIEW_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: Member.open_case_count. Forward action (case
          intake) increments it; the compensating action (withdraw) decrements
          it; intake followed by withdrawal MUST leave the count unchanged —
          invariant over the case-lifecycle pair.
        test_recipe:
          setup:
            - "Member with open_case_count == 0"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CI1", full_name: "Iris Cho", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ci1: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ci1}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_ci1: $.data.id }
            - call: "POST /appeals/cases/${c_ci1}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ci1}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ci1}/withdraw"
              payload: {}
              as: MemberServicesRep
            - call: "GET /appeals/members/${m_ci1}"
              payload: {}
              as: ComplianceOfficer
              captures: { oc_final: $.data.open_case_count }
          assert:
            - "After intake: open_case_count == 1; after withdraw: open_case_count == 0 — invariant count(final) == count(initial) holds across the forward/compensating pair"
            - "Case.${c_ci1}.status == WITHDRAWN"

      - name: ctm_linked_count_link_unlink_invariant
        grounds:
          - entities.Member.fields.ctm_linked_case_count
          - endpoints["POST /appeals/cases/{id}/events"]
        distinguishing_aspect: |
          Conserved quantity: Member.ctm_linked_case_count. CTM_LINKED event
          increments it; the compensating CTM_UNLINKED event decrements it
          (floor 0); link followed by unlink on the same case MUST leave the
          count unchanged — invariant over a different quantity than
          open_case_count.
        test_recipe:
          setup:
            - "Member with one RECEIVED case; ctm_linked_case_count == 0"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CI2", full_name: "Jae Kim", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ci2: $.data.id }
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ci2}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_ci2: $.data.id }
          trigger:
            - call: "POST /appeals/cases/${c_ci2}/events"
              payload: { event_type: "CTM_LINKED", body: "x" }
              as: IntakeSpecialist
            - call: "GET /appeals/members/${m_ci2}"
              payload: {}
              as: ComplianceOfficer
              captures: { cnt_linked: $.data.ctm_linked_case_count }
            - call: "POST /appeals/cases/${c_ci2}/events"
              payload: { event_type: "CTM_UNLINKED", body: "x" }
              as: IntakeSpecialist
            - call: "GET /appeals/members/${m_ci2}"
              payload: {}
              as: ComplianceOfficer
              captures: { cnt_unlinked: $.data.ctm_linked_case_count }
          assert:
            - "After CTM_LINKED: ctm_linked_case_count == 1 and Case.ctm_linked == true"
            - "After CTM_UNLINKED: ctm_linked_case_count == 0 and Case.ctm_linked == false — count(end) == count(start), no drift"
            - "A second CTM_UNLINKED keeps the count at 0 (floor semantics, never negative)"

      - name: reopening_grant_spawn_conserves_total_case_lineage
        grounds:
          - state_machines.Reopening.UNDER_REVIEW_to_GRANTED
          - entities.GrievanceAppealCase.fields.reopened_from_case_id
        distinguishing_aspect: |
          Conserved quantity: case lineage cardinality — for every GRANTED
          reopening, exactly one new case exists with reopened_from_case_id ==
          source.id, and the source case's open/closed accounting balances:
          source was excluded from open_case_count when CLOSED; grant adds
          exactly 1 (the spawn), so the net open-case delta of the whole
          grant cascade is exactly +1 — invariant over the reopening lineage.
        test_recipe:
          setup:
            - "Closed GRIEVANCE case (decided UNFAVORABLE, notified, closed); member open_case_count == 0; Reopening UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /appeals/members"
              payload: { member_ref: "MBR-CI3", full_name: "Kai Nos", program: "MEDICARE" }
              as: PlatformAdmin
              captures: { m_ci3: $.data.id }
            - call: "POST /appeals/deadline-policies"
              payload: { program: "MEDICARE", case_kind: "GRIEVANCE", priority_track: "STANDARD", resolution_hours: 720, extension_hours: 0, effectuation_hours: 72 }
              as: PlatformAdmin
            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_ci3}", case_kind: "GRIEVANCE" }
              as: IntakeSpecialist
              captures: { c_ci3: $.data.id }
            - call: "POST /appeals/cases/${c_ci3}/triage"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /appeals/cases/${c_ci3}/begin-review"
              payload: {}
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ci3}/decide"
              payload: { decision_outcome: "UNFAVORABLE" }
              as: CaseAnalyst
            - call: "POST /appeals/cases/${c_ci3}/notifications"
              payload: { recipient_kind: "MEMBER", notification_kind: "DECISION", supplied_elements: ["citation_of_criteria", "appeal_rights", "decision_rationale", "expedited_availability", "ire_notice", "contact_information", "language_assistance"] }
              as: MemberServicesRep
              captures: { n_ci3: $.data.id }
            - call: "POST /appeals/notifications/${n_ci3}/mark-sent"
              payload: {}
              as: MemberServicesRep
            - call: "POST /appeals/cases/${c_ci3}/close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /appeals/reopenings"
              payload: { case_id: "${c_ci3}", request_reason: "CLERICAL_ERROR" }
              as: ComplianceOfficer
              captures: { r_ci3: $.data.id }
            - call: "POST /appeals/reopenings/${r_ci3}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /appeals/cases/${c_ci3}"
              payload: {}
              as: ComplianceOfficer
              captures: { cv_ci3: $.data.version }
            - call: "GET /appeals/members/${m_ci3}"
              payload: {}
              as: ComplianceOfficer
              captures: { oc_ci3_pre: $.data.open_case_count }
          trigger:
            - call: "POST /appeals/reopenings/${r_ci3}/grant"
              payload: { expected_case_version: "${cv_ci3}" }
              as: ComplianceOfficer
              captures: { spawned_ci3: $.data.spawned_case_id }
            - call: "GET /appeals/members/${m_ci3}"
              payload: {}
              as: ComplianceOfficer
              captures: { oc_ci3_post: $.data.open_case_count }
            - call: "GET /appeals/cases"
              payload: { member_id: "${m_ci3}" }
              as: ComplianceOfficer
              captures: { all_cases: $.data }
          assert:
            - "open_case_count after grant == open_case_count before grant + 1 (exactly one spawn, no double-count of the REOPENED source)"
            - "Exactly one case in the member's list has reopened_from_case_id == ${c_ci3} (lineage cardinality == 1)"
            - "Reopening.${r_ci3}.spawned_case_id == ${spawned_ci3} matches the spawned case's id"
