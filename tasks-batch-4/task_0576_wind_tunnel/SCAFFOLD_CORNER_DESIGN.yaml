            - call: "POST /bookings"
              payload: { member_id: "${m_id}", package_id: "${pkg_id}", booking_type: "WALK_IN", party_size: 1 }
              as: FrontDesk
              captures: { b_id: $.data.id }
            - call: "POST /sessions"
              payload: { tunnel_id: "${t_id}", start_utc: "2026-05-10T10:00:00Z", end_utc: "2026-05-10T10:30:00Z", capacity: 4 }
              as: FrontDesk
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /sessions/${s_id}/assign-instructor"
              payload: { instructor_id: "${i_id}", expected_session_version: "${s_v}" }
              as: FrontDesk
            - call: "POST /flights"
              payload: { booking_id: "${b_id}", session_id: "${s_id}", member_id: "${m_id}", scheduled_minutes: 2 }
              as: FrontDesk
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /flights/${f_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert: ["captured err == ERR_WEIGHT_LIMIT_EXCEEDED"]

  # -------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: tunnel_maintenance_toggle_updates_status
        claim_type: Action endpoint
        grounds: [entities.Tunnel.fields.status]
        distinguishing_aspect: "POST /tunnels/{id}/maintenance with mode MAINTENANCE then OPERATIONAL flips Tunnel.status accordingly."
        test_recipe:
          setup: ["One OPERATIONAL tunnel."]
          setup_api_calls:
            - call: "POST /tunnels"
              payload: { name: "T1", max_weight_kg: 120, default_capacity: 4, turnaround_minutes: 15 }
              as: Manager
              captures: { t_id: $.data.id }
            - call: "POST /tunnels/${t_id}/maintenance"
              payload: { mode: "MAINTENANCE" }
              as: Manager
          trigger:
            - call: "POST /tunnels/${t_id}/maintenance"
              payload: { mode: "OPERATIONAL" }
              as: Manager
          assert: ["Tunnel.${t_id}.status == OPERATIONAL"]

