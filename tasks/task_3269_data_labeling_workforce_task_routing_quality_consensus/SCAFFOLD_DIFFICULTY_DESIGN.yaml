            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c_hi: "$.data[0].id", c_mid: "$.data[1].id", c_low: "$.data[2].id" }
          trigger:
            - call: "POST /api/items/${it1_id}/reviewer-action"
              payload: { reviewer_action: "RESOLVE_PANEL_DECISION", decision_value: "Y" }
              as: PlatformReviewer
              captures: { consensus: "$.data.consensus_status", holds: "$.data.holds_quorum" }
          assert:
            - "the item certifies with consensus_status CERTIFIED only when the dispatched panel reaches the engagement quorum of 3 non-abstaining commits"
            - "a reviewer tie-break attempted while the committed count is 2 is rejected with ERR_QUORUM_NOT_REACHED at status 409, so the gate is the engagement's own commitment_quorum rather than a constant"
            - "the same engagement created with commitment_quorum 2 accepts the tie-break after two commits, so the cross-entity dependency is on a program field and not on the item"
            - "a second engagement with the same item shape but commitment_quorum 3 rejects the identical two-commit tie-break, which is the falsifiable contrast"
            - "the panel members are ordered by dispatch_rank at dispatch time, so the highest ranked member from calculations.worker_selection carries dispatch_rank 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: half_open_coverage_window_versus_blackout
        grounds:
          - validations[priority=8]
          - entities.SpecUnit.coverage_start_utc
          - entities.CustomerProgram.blackout_start_utc
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the customer calendar: a coverage window ending exactly at
          the blackout start is adjacent and admitted, while any overlap of positive length is
          rejected -- the geometry of adjacency rather than of active capacity.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement whose blackout runs from 2026-09-20T00:00:00Z to 2026-09-25T00:00:00Z, with three published units whose coverage windows differ only at the boundary."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_code: "AX-4414", name: "Calendar Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-ADJ", max_items: 5, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-10T00:00:00Z", coverage_end_utc: "2026-09-20T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u_adj_id: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-OVER", max_items: 5, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-19T23:00:00Z", coverage_end_utc: "2026-09-20T01:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u_over_id: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-EQ", max_items: 5, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-20T00:00:00Z", coverage_end_utc: "2026-09-21T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u_eq_id: "$.data.id" }
          trigger:
            - call: "POST /api/spec-units/${u_adj_id}/advance-unit"
              payload: { unit_action: "ACTIVATE" }
              as: PlatformAdmin
              captures: { adj_status: "$.data.status" }
          assert:
            - "the unit whose coverage window ends exactly at 2026-09-20T00:00:00Z activates successfully, because a zero-length adjacency is not an overlap"
            - "activating the unit that ends at 2026-09-20T01:00:00Z is rejected with ERR_COVERAGE_WINDOW_OVERLAP at status 409, because the intersection with the blackout has positive length of one hour"
            - "activating the unit that begins exactly at the blackout start is also rejected, because a window starting at the blackout start lies wholly inside it"
            - "the three units differ only by one hour at the boundary, so the test isolates interval geometry rather than window content"

      - name: closed_worker_lane_intervals_versus_disjoint_slots
        grounds:
          - validations[priority=8]
          - calculations.worker_selection
          - errors[ERR_WORKER_LANE_CONFLICT]
          - entities.Commit.commit_deadline_at
        distinguishing_aspect: |
          Closed interval semantics at the workforce level: a worker may not hold two dispatched
          assignments whose dispatch-to-deadline intervals touch at a single instant, which is the
          opposite geometry from the adjacent-admitted calendar rule above and sits on a different
          resource.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with commit_deadline_seconds 3600 and one published unit at panel_size 1, holding two released items; the pool holds exactly one eligible es-MX worker."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "tomas-ibarra" }
              as: Anonymous
              captures: { tomas_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4415", name: "Lane Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commit_deadline_seconds: 3600, commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
