# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role unrecognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint, or ownership check failed (officer not the device's assigned officer / not the recording's uploader)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body reference does not exist, or belongs to a different agency" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field shape/constraint violation: bad enum, hash not 64 lowercase hex, duration out of range, expiry days out of 1..90, recorded_at in the future, duplicate badge/serial/case_number, trigger_code not in ACTIVE policy's recording_triggers" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition (generic state-machine rejection)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the case's current version (OCC on share-grant creation)" }
  - { id: ERR_POLICY_ALREADY_ACTIVE, http: 409, condition: "Activating a policy while another policy is ACTIVE for the same agency" }
  - { id: ERR_PLAN_NOT_LATER, http: 409, condition: "New storage budget plan's effective_from_month is not strictly later than the current ACTIVE plan's" }
  - { id: ERR_DEVICE_STILL_ASSIGNED, http: 409, condition: "Officer suspend/retire attempted while a device is ASSIGNED to the officer" }
  - { id: ERR_LEAD_CASES_OPEN, http: 409, condition: "Officer retire attempted while officer is lead on an OPEN or UNDER_REVIEW case" }
  - { id: ERR_OFFICER_NOT_ACTIVE, http: 409, condition: "Device assignment target officer is not ACTIVE" }
  - { id: ERR_OFFICER_ALREADY_HAS_DEVICE, http: 409, condition: "Device assignment target officer already has an ASSIGNED device" }
  - { id: ERR_DEVICE_UNHEALTHY, http: 409, condition: "Device assignment attempted on a device whose health_status is not HEALTHY" }
  - { id: ERR_BATTERY_TOO_LOW, http: 409, condition: "Device assignment attempted with battery_pct < 20" }
  - { id: ERR_DEVICE_NOT_DOCKED, http: 409, condition: "Assign/unassign/retire/upload attempted while device dock_status is UNDOCKED" }
  - { id: ERR_CATEGORY_REQUIRED, http: 422, condition: "Upload or categorize missing category while ACTIVE policy has tagging_required == true" }
  - { id: ERR_INTEGRITY_FAILED, http: 409, condition: "Operation attempted on a recording whose upload_status is INTEGRITY_FAILED" }
  - { id: ERR_CASE_EMPTY, http: 409, condition: "Case submit-review with evidence_count == 0" }
  - { id: ERR_EVIDENCE_NOT_READY, http: 409, condition: "Case submit-review while a LINKED recording is not in ACTIVE or RETENTION_DUE" }
  - { id: ERR_REVIEWS_OUTSTANDING, http: 409, condition: "Case close attempted while a LINKED recording is PENDING_REVIEW" }
  - { id: ERR_ACTIVE_SHARE_GRANTS, http: 409, condition: "Case archive or evidence unlink attempted while an ACTIVE ShareGrant exists on the case" }
  - { id: ERR_LEGAL_HOLD_ACTIVE, http: 409, condition: "Case archive attempted while an ACTIVE case-scoped LegalHold exists (purge-time holds skip rather than error)" }
  - { id: ERR_GRANT_EXPIRED, http: 410, condition: "Share access attempted with a grant whose expires_at <= logical now (lazy expiry), or a grant already REVOKED/EXPIRED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "RedactionJob approve attempted by the same X-User-ID that submitted the job" }
  - { id: ERR_NO_ACTIVE_POLICY, http: 409, condition: "Recording upload, share-grant creation, or any policy-dependent action attempted with no ACTIVE AgencyPolicy for the agency" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency administrator; superset of administrative operations. Owns policy configuration, budget plans, officer lifecycle, retention execution, share-grant sweep, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /agencies; POST /_clock/set_current_utc"
      - "POST/GET policies; policy activate/supersede"
      - "POST/GET storage-budget-plans; GET storage/budget-projection"
      - "POST officers; officer suspend/reinstate/retire"
      - "POST retention/run; POST share-grants/sweep"
    shared_operations:
      - "GET agencies/{id}; GET audit-log; GET legal-holds; GET share-grants; GET cases; GET recordings; GET custody-events"

  - name: DeviceCoordinator
    description: "Quartermaster role; owns the device fleet: registration, assignment, docking, undocking, retirement."
    identity: opaque
    exclusive_operations:
      - "POST devices; device assign/unassign/retire"
    shared_operations:
      - "device dock/undock (with assigned Officer); GET devices; GET officers"

  - name: Officer
    description: "Sworn officer; uploads recordings from their assigned device, categorizes own recordings, builds cases and links evidence. Entity-backed: X-User-ID must equal the Officer id."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST recordings (upload from assigned device); PATCH categorize (own recordings); POST cases; POST case evidence link/unlink; POST submit-review"
    shared_operations:
      - "device dock/undock (own assigned device only); POST reverify (own recordings); GET recordings/cases/custody-events (agency scope)"

  - name: Supervisor
    description: "Shift supervisor; reviews sampled recordings and adjudicates case lifecycle. Entity-backed: X-User-ID must equal the Officer id of an officer with rank SERGEANT or LIEUTENANT."
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST mark-reviewed; POST case close/reopen"
    shared_operations:
      - "GET recordings/officers/devices/cases/audit-log; POST reverify; POST case evidence link/unlink"

  - name: RedactionTechnician
    description: "Redaction specialist; performs face/audio redaction work. Cannot approve or release own work (segregation of duties against RecordsOfficer)."
    identity: opaque
    exclusive_operations:
      - "redaction-job start/submit"
    shared_operations:
      - "redaction-job create/cancel; GET redaction-jobs; GET recordings"

  - name: RecordsOfficer
    description: "Records/release authority; approves and releases redactions, manages share grants and legal holds, archives cases."
    identity: opaque
    exclusive_operations:
      - "redaction-job approve/return/release; share-grant create/revoke; legal-hold create/release; case archive"
    shared_operations:
      - "redaction-job create/cancel; GET redaction-jobs/recordings/cases/audit-log/legal-holds/share-grants; GET storage/budget-projection"

  - name: Prosecutor
    description: "External prosecutor; accesses shared case evidence via access token only."
    identity: opaque
    exclusive_operations:
      - "POST share-access (recipient_role PROSECUTOR grants)"
    shared_operations: []

  - name: DefenseCounsel
    description: "External defense counsel; accesses shared case evidence via access token only."
    identity: opaque
    exclusive_operations:
      - "POST share-access (recipient_role DEFENSE grants)"
    shared_operations: []


