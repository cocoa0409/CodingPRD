  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ship_unallocated_order_over_the_annual_cap_reports_state_before_fiscal
        grounds:
          - validations.priority_30
          - validations.priority_60
          - errors.ERR_ORDER_NOT_ALLOCATED
          - errors.ERR_SELF_DISTRIBUTION_CAP_EXCEEDED
        distinguishing_aspect: |
          Category pair state (priority 30) x business_fiscal (priority 60). Both conditions are
          live in the same request: the order is still SUBMITTED, and the license's
          barrels_shipped_ytd (1200.000 carried in) already exceeds its 1000.00 annual cap, so the
          self-distribution ceiling is breached no matter what is allocated. The lower priority
          number must win, so the response is ERR_ORDER_NOT_ALLOCATED (409) and never the fiscal
          error - a shipment is refused for the reason the operator can act on first.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT and COLA_APPROVED."
            - "ID StateLicense, SELF_DISTRIBUTION, annual_barrel_cap 1000.00, with carry_in_barrels_ytd set to 1200.000 so barrels_shipped_ytd is already over the ceiling."
            - "Order SO-4002 for 5.00 bbl into ID created and deliberately left in state SUBMITTED - allocate is never called."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "15.5 GAL", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /state-licenses/${lic_id}/ytd-adjustments"
              payload: { carry_in_barrels_ytd: 1200.000 }
              as: ComplianceOfficer
            - call: "POST /distribution-orders"
              payload: { beer_id: "${beer_id}", state_license_id: "${lic_id}", order_code: "SO-4002", bbl_requested: 5.00, ship_to_state_code: "ID", distance_miles: 120, requested_ship_utc: "2026-08-15T15:00:00Z" }
              as: BreweryAdmin
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /distribution-orders/${order_id}/ship"
              payload: {}
              as: BreweryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_ORDER_NOT_ALLOCATED"
            - "error_id != ERR_SELF_DISTRIBUTION_CAP_EXCEEDED"
            - "DistributionOrder.${order_id}.state == SUBMITTED (unchanged)"
            - "DistributionOrder.${order_id}.shipped_at_utc is null"
            - "StateLicense.${lic_id}.barrels_shipped_ytd == 1200.000 (unchanged)"

      - name: understrength_sanitizer_with_self_attested_growler_reports_safety_before_duties
        grounds:
          - validations.priority_46
          - validations.priority_50
          - calculations.growler_sanitation_verdict
          - errors.ERR_SANITATION_BELOW_STANDARD
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          A different category pair - business_safety (priority 46) x business_referential
          (priority 50) - on a different endpoint. The growler fill is submitted at 90 ppm (below
          the 150 ppm floor, so growler_sanitation_verdict is FAIL) AND names the pouring user
          u_taproom_1 as its own attester. Public-health first: ERR_SANITATION_BELOW_STANDARD (422)
          is returned, ERR_SEGREGATION_OF_DUTIES is suppressed, and because a FAIL verdict is never
          persisted no TaproomPour row exists afterwards.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT and taproom_sellable."
            - "One COMPLETED TAPROOM HALF_BBL_KEG run; KEG-0001 cleaned, filled and TAPPED with no pours yet."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
