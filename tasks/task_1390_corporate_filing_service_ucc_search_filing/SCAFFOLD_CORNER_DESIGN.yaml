        grounds: ["entities.FilingRequest.fields.quoted_fee_cents"]
        distinguishing_aspect: "quoted_fee_cents is a frozen snapshot: later profile changes do not rewrite it."
        excluded_because:
          difficulty_instance: "dual_variant_calc / fee_quote_vs_charged_after_profile_update"
          rationale: "That instance asserts quoted == 10000 after the profile base rose to 12000 — the frozen-snapshot property is its core assertion."

  # ============================================================ errors
  - section: errors
    instances:
      - name: duplicate_state_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_STATE_CODE]", "entities.JurisdictionProfile.fields.state_code"]
        distinguishing_aspect: "Second JurisdictionProfile with state_code CA is rejected with ERR_DUPLICATE_STATE_CODE (409) — tenant-wide uniqueness of the configuration key."
        test_recipe:
          setup: ["CA profile already registered"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 5000, per_additional_debtor_fee_cents: 500, county_surcharge_cents: 0, county_filing_collateral_classes: [], county_names: [], individual_name_rule: "DL_SAFE_HARBOR", expedited_daily_capacity: 1 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_STATE_CODE and http status 409"

      - name: client_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /client-accounts/{random uuid} yields ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /client-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLIENT_NOT_FOUND and http status 404"

      - name: unknown_jurisdiction_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_JURISDICTION_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "A filing request referencing jurisdiction_code ZZ (no profile) fails body-reference existence with ERR_JURISDICTION_NOT_FOUND."
        test_recipe:
          setup: ["CA profile only; client, debtor, secured party exist"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${cid}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spid}", jurisdiction_code: "ZZ", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JURISDICTION_NOT_FOUND and http status 404"

      - name: body_debtor_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEBTOR_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "A random debtor_id in the request body fails with ERR_DEBTOR_NOT_FOUND."
        test_recipe:
          setup: ["CA profile; client and secured party exist"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Acme Lending" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /client-accounts/${cid}/secured-parties", payload: { name: "Acme Lending" }, as: ClientManager, as_user_id: "${cid}", captures: { spid: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${cid}", kind: "NEW_UCC1", debtor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", secured_party_id: "${spid}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEBTOR_NOT_FOUND and http status 404"

      - name: secured_party_cross_client_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_SECURED_PARTY_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "A secured party registered under client B cannot be referenced by client A's request: FK integrity is scoped by ownership and fails as ERR_SECURED_PARTY_NOT_FOUND (not a generic error)."
        test_recipe:
          setup: ["two clients A and B; debtor under A; secured party under B"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
            - { call: "POST /client-accounts", payload: { name: "Client A" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /client-accounts", payload: { name: "Client B" }, as: PlatformAdmin, captures: { cb: $.data.id } }
            - { call: "POST /client-accounts/${ca}/debtors", payload: { debtor_type: "ORGANIZATION", legal_name: "Acme Manufacturing, Inc.", jurisdiction_of_formation: "DE" }, as: ClientManager, as_user_id: "${ca}", captures: { did: $.data.id } }
            - { call: "POST /client-accounts/${cb}/secured-parties", payload: { name: "B's Bank" }, as: ClientManager, as_user_id: "${cb}", captures: { spb: $.data.id } }
          trigger:
            - { call: "POST /filing-requests", payload: { client_id: "${ca}", kind: "NEW_UCC1", debtor_id: "${did}", secured_party_id: "${spb}", jurisdiction_code: "CA", collateral_class: "GENERAL", fee_authorization_cents: 100000 }, as: FilingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SECURED_PARTY_NOT_FOUND and http status 404"

      - name: request_search_report_not_found
        claim_type: violation_to_error
        grounds: ["errors[ERR_REQUEST_NOT_FOUND]", "errors[ERR_SEARCH_NOT_FOUND]", "errors[ERR_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "Remaining per-resource 404s: random UUIDs on the request, search, and report single-GET routes each yield their domain-specific error id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /jurisdiction-profiles", payload: { state_code: "CA", base_fee_cents: 10000, per_additional_debtor_fee_cents: 1500, county_surcharge_cents: 2500, county_filing_collateral_classes: ["FIXTURE"], county_names: ["LOS_ANGELES", "ORANGE"], individual_name_rule: "LEGAL_NAME_ONLY", expedited_daily_capacity: 2 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /filing-requests/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /lien-searches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /perfection-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlatformAdmin, captures: { e3: $.data.error_id } }
          assert:
            - "e1 == ERR_REQUEST_NOT_FOUND (404)"
            - "e2 == ERR_SEARCH_NOT_FOUND (404)"
            - "e3 == ERR_REPORT_NOT_FOUND (404)"

