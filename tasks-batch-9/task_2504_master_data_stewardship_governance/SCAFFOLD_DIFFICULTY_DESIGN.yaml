  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_domain_version_precedes_assignment_overlap
        grounds:
          - validations.priority_7_ERR_STALE_DOMAIN_VERSION
          - validations.priority_13_ERR_ASSIGNMENT_OVERLAP
          - concurrency_rules.steward-assignment-supersede-stale-domain
        distinguishing_aspect: |
          One request violates priority 7 (stale expected_domain_version) and priority 13
          (half-open interval overlap with the incumbent DATA_STEWARD) at once. The optimistic
          concurrency check must fire first - ERR_STALE_DOMAIN_VERSION / 412 - and no
          assignment may be persisted; only after the caller re-reads the version does the
          temporal conflict surface as ERR_ASSIGNMENT_OVERLAP / 409.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER in DRAFT; version 1 is captured as dom_v1 before any assignment exists."
            - "A DATA_OWNER assignment and then a DATA_STEWARD assignment [2026-08-01T00:00:00Z, null) are created, each bumping Domain.version, so dom_v1 is two writes stale."
