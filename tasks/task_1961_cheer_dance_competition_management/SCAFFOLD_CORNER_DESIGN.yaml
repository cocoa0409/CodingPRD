      - name: sold_out_session_rejects_new_order
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SESSION_SOLD_OUT]"]
        distinguishing_aspect: "Pure capacity check on a REGISTRATION_OPEN event: session capacity 10, existing HELD 6 + PAID 4 -> a 1-ticket order is rejected (held + sold + requested > capacity)."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; session cap 10 with 6 HELD (spec-1) and 4 PAID (spec-2)"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
