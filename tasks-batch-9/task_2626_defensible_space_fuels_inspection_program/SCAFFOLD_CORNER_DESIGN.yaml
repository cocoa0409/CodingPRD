  # ==========================================================================
  - section: rbac
    instances:

      - name: title_agent_cannot_perform_program_admin_exclusive_writes
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - validations.priority_12
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.TitleAgent.exclusive_operations
        distinguishing_aspect: |
          Priority 12 runs before existence (20) and before every business rule, so a role absent from an
          endpoint's roles: list is refused 403 ERR_FORBIDDEN_ROLE even when the payload is perfect and
          even when the path id does not exist. TitleAgent — read-only apart from opening certificate
          requests — is refused on parcel creation, and the mirror-image denials hold for the other roles'
          exclusive verbs.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; nothing else is required — the denial precedes existence checks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-6201", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: TitleAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 and ${err} == \"ERR_FORBIDDEN_ROLE\" — POST /fire-district/parcels lists only ProgramAdmin"
            - "GET /fire-district/parcels as ProgramAdmin returns total_count == 0: no row was created"
            - "POST /fire-district/violation-notices/vn_missing/void as ProgramAdmin returns 403 ERR_FORBIDDEN_ROLE, NOT 404 — priority 12 precedes priority 20 (void is FireMarshal-exclusive)"
            - "POST /fire-district/inspections/insp_missing/complete as FireMarshal returns 403 ERR_FORBIDDEN_ROLE (completion is Inspector-exclusive)"
            - "POST /fire-district/communities/com_missing/submit-certification as ProgramAdmin returns 403 ERR_FORBIDDEN_ROLE (CommunityOrganizer-exclusive)"
            - "POST /fire-district/abatement-orders/ao_missing/complete-work as ProgramAdmin returns 403 ERR_FORBIDDEN_ROLE (Contractor-exclusive)"

      - name: each_role_performs_its_own_declared_operations
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - roles.Inspector.exclusive_operations
          - roles.FireMarshal.exclusive_operations
          - roles.PropertyOwner.shared_operations
          - roles.TitleAgent.shared_operations
        distinguishing_aspect: |
          The positive half of the RBAC matrix: one chain in which ProgramAdmin schedules and notices,
          the assigned Inspector evaluates and completes, the PropertyOwner extends its OWN notice and
          opens a certificate request on its OWN parcel, the TitleAgent opens another request on the same
          parcel, and the FireMarshal voids the notice — every call returning 2xx, so an implementation
          that over-restricts (e.g. limits extend to ProgramAdmin) is distinguishable.
        test_recipe:
          setup:
            - "Active cycle; one HIGH-risk parcel; clock 2026-08-01T00:00:00Z; the parcel's FAIL inspection produces one ISSUED notice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-6301", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0 }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { ins1_result: "$.data.result" }
            - call: "GET /fire-district/violation-notices"
              payload: { parcel_id: "${p1}" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { n1: "$.data[0].id" }
            - call: "POST /fire-district/violation-notices/${n1}/extend"
              payload: { reason: "Contractor booked for October" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { n1_status: "$.data.status", n1_deadline: "$.data.deadline_utc" }
            - call: "POST /fire-district/parcels/${p1}/compliance-certificates"
              payload: { requester_kind: "INSURANCE", transaction_reference: "POL-3391" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { cert_owner: "$.data.id" }
            - call: "POST /fire-district/parcels/${p1}/compliance-certificates"
              payload: { requester_kind: "REAL_ESTATE", transaction_reference: "ESC-4410" }
              as: TitleAgent
              captures: { cert_agent: "$.data.id" }
          trigger:
            - call: "POST /fire-district/violation-notices/${n1}/void"
              payload: { reason: "Issued against the wrong structure" }
              as: FireMarshal
              captures: { void_status: "$.data.status", void_reason: "$.data.void_reason" }
          assert:
            - "${ins1_result} == \"FAIL\" — the assigned Inspector could record all three zones and complete"
            - "${n1_status} == \"EXTENDED\" and ${n1_deadline} == \"2026-10-05T23:59:59Z\": the PropertyOwner's own extension moved the base deadline 2026-09-05T23:59:59Z by EXTENSION_DAYS 30"
            - "${cert_owner} and ${cert_agent} are distinct ids, both created 201 — the shared certificate-request operation works for BOTH PropertyOwner and TitleAgent"
            - "HTTP 200 on the trigger with ${void_status} == \"VOIDED\" and ${void_reason} == \"Issued against the wrong structure\""
            - "Parcel.${p1}.open_violation_count == 0 after the void and compliance_status == \"NON_COMPLIANT\" (no passed inspection exists to restore COMPLIANT)"
            - "Contractor and CommunityOrganizer positive paths are exercised by payment_above_outstanding_balance_rejected and community_submit_below_member_floor_rejected respectively"

