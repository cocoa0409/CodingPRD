              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_2"
          trigger:
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_window_open: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:30:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/key-ceremonies/${cer_id}/attest"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { attested_state: $.data.state, attestation_expiry: $.data.attestation_expires_at }
          assert:
