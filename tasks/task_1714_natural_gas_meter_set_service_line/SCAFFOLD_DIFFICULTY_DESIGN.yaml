              as: FieldSupervisor
              as_user_id: "sup-1"
              captures: { bk_a: $.data.id }
            - call: "POST /crew-bookings"
              payload: { service_application_id: "${app_id}", field_crew_id: "${crew_id}", work_date: "2026-08-10", start_minute: 1050, end_minute: 1080, scope: SERVICE_INSTALL }
              as: FieldSupervisor
