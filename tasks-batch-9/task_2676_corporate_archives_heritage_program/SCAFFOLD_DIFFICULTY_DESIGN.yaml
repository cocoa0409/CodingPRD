            - call: "POST /archival-items"
              payload: { accession_id: "${accA_id}", storage_zone_id: "${zone_id}", item_label: "BRAND-2022", unit_count: 1, condition_grade: "GOOD", original_format: "PAPER", sensitivity_level: "INTERNAL", brand_use_year: 2022 }
