          assert:
            - "SurveyOrder.${order_id}.estimated_fee_cents == 539500"
            - "Invoice.${inv_id}.subtotal_cents == 539500"
            - "Invoice.${inv_id}.tax_cents == 44509"
            - "Invoice.${inv_id}.total_cents == 583999"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plat_revision_cycle_seal_to_in_revision_to_drafted
        grounds:
          - state_machines.PlatDrawing.SEALED_to_IN_REVISION
          - state_machines.PlatDrawing.IN_REVISION_to_DRAFTED
          - state_machines.PlatDrawing.DRAFTED_to_UNDER_REVIEW
          - entities.PlatDrawing.fields.sealed_by_id
        distinguishing_aspect: |
          PlatDrawing is cyclic: SEALED -> IN_REVISION (clears sealed_by_id to null) -> DRAFTED ->
          UNDER_REVIEW -> SEALED again, demonstrating a revision loop that returns to a prior state
          with sealed_by_id re-populated — non-linear on the PlatDrawing entity.
        test_recipe:
          setup:
            - "A SEALED plat (sealed_by_id set) with one REQUESTED CLIENT_CHANGE revision."
          setup_api_calls:
            - call: "POST /crew-members"
