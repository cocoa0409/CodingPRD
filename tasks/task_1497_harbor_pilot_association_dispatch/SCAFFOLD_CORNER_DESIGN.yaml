- section: rbac
  instances:
  - name: rbac_pilot_cannot_dispatch_forbidden
    claim_type: violation_to_error
    grounds:
    - roles.Dispatcher
    - roles.Pilot
    - errors[ERR_FORBIDDEN]
    distinguishing_aspect: Dispatch is Dispatcher-exclusive; an entity-backed Pilot identity is rejected 403 even on a valid order.
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed cap 100000; boat BA; O1 BOOKED
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
