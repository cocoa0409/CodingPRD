  - name: the_crm_text_requirement_applies_only_while_the_documented_flag_is_set
    claim_type: conditional
    grounds:
    - validations[priority=20]
    - errors[ERR_CRM_TEXT_REQUIRED]
    - endpoints.PATCH /control-implementations/{id}
    distinguishing_aspect: 'Priority 20 is conditional on crm_documented: with the flag false the missing text is fine, with
      the flag true it is a 422, and an empty string counts as absent. The same conditional fires again on PATCH, so flipping
      the flag on without supplying text is refused while flipping it off with the text left behind is accepted.'
