  - rule_id: transitive_cascade
    instances:

      - name: second_pt_failure_suspends_analyst_releases_hours_and_requeues_case
        grounds:
          - state_machines.ProficiencyTest.SUBMITTED_to_SCORED
          - state_machines.Analyst.QUALIFIED_to_PROBATION
          - state_machines.Analyst.PROBATION_to_SUSPENDED
          - state_machines.Assignment.ACTIVE_to_RELEASED
          - state_machines.ExaminationRequest.ASSIGNED_to_QUEUED
          - state_machines.Case.IN_PROGRESS_to_AWAITING_ASSIGNMENT
          - calculations.proficiency_test_grading
          - calculations.committed_casework_hours_invariant
        distinguishing_aspect: |
          A five-hop chain fired by one score call whose ORIGIN is a cumulative counter crossing
          PT_SUSPENSION_THRESHOLD: score -> consecutive_pt_failures 2 -> PROBATION to SUSPENDED ->
          FULL_RELEASE releases the ACTIVE assignment regardless of the case's P3_ROUTINE class
          (the earlier first-failure PROBATION_RELEASE deliberately spared that same assignment)
          -> request falls back to QUEUED -> CASE_RECOMPUTE flips the case to AWAITING_ASSIGNMENT.
