            - "The enrollment on session W returns HTTP 409 with data.error_id == ERR_PARTICIPANT_TIME_CONFLICT"
            - "GET /recreation/enrollments filtered by participant_id ${p1} returns total_count 2"

      - name: pooled_item_admits_two_concurrent_holds_serialized_item_admits_one
        grounds:
          - calculations.equipment_fit_eligibility
          - validations[priority=51]
          - entities.EquipmentItem.fields.pooled_total
          - entities.EquipmentItem.fields.pooled_available
          - errors[ERR_EQUIPMENT_UNAVAILABLE]
        distinguishing_aspect: |
          Resource EquipmentItem, with AGGREGATE-CAPACITY occupancy rather than the
          pairwise interval arithmetic used for staff and participants: a POOLED row with
