              as: Underwriter
              captures: { pa_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${z1_id}", agency_id: "${agency_id}", address_line: "82 Crag Rd", grid_risk_block: "CRAG-A" }
              as: Underwriter
              captures: { pb_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${z1_id}", agency_id: "${agency_id}", address_line: "83 Crag Rd", grid_risk_block: "CRAG-A" }
              as: Underwriter
              captures: { pc_id: $.data.id }
            - call: "POST /hnw/wildfire-events/properties/${pa_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/properties/${pb_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/properties/${pc_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/wildfire-events/vendors/poll"
              payload: { risk_zone_id: "${z1_id}" }
              as: Underwriter
            - call: "POST /hnw/wildfire-events/vendors/poll"
              payload: { risk_zone_id: "${z1_id}" }
              as: Underwriter
          trigger:
            - call: "POST /hnw/wildfire-events/vendors/poll"
              payload: { risk_zone_id: "${z1_id}" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the third poll of ZM1 is refused with status 422 and error_id == ERR_NO_ELIGIBLE_VENDOR, because the zone already holds two overlapping assignments and the third dispatch is excluded from the pool"
            - "GET /hnw/risk-zones/${z1_id}/wildfire-dispatches shows exactly 2 rows in VENDOR_ASSIGNED and 1 row still REQUESTED"
            - "a poll of ZM2, which has an ACTIVE event but zero dispatch requests, is refused with the SAME error_id ERR_NO_ELIGIBLE_VENDOR — an empty pool and a saturated pool are the same refusal class but reachable by two different fixtures"
            - "with the zone event set to WATCH through POST /hnw/risk-zones/${z2_id}/set-event, the outstanding assignments of ZM1 are cancelled and a follow-up poll of ZM1 succeeds"

