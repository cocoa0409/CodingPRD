      - name: duplicate_excise_report_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
          - "errors[ERR_DUPLICATE_REPORT]"
        distinguishing_aspect: |
          Two OPEN ExciseReports for same (year, month, regulator) ->
