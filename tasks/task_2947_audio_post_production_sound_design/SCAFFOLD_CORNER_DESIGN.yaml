              payload: {}
              as: Mixer
              as_user_id: "${mixer_one_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-bookings/${booking_id}/start"
              payload: {}
              as: Mixer
              as_user_id: "${mixer_one_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T12:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-bookings/${booking_id}/complete"
              payload: {}
              as: Mixer
              as_user_id: "${mixer_one_id}"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_now: $.data.version }
          trigger:
            - call: "POST /deliverables"
              payload: { expected_project_version: "${proj_v_now} - 1", project_id: "${proj_id}", platform_spec_id: "${spec_id}", stem_package_id: "${sp_id}", mix_booking_id: "${booking_id}" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { stale_error: $.data.error_id }
            - call: "POST /deliverables"
              payload: { expected_project_version: "${proj_v_now}", project_id: "${proj_id}", platform_spec_id: "${spec_id}", stem_package_id: "${sp_id}", mix_booking_id: "${booking_id}" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { deliv_id: $.data.id }
          assert:
            - "the decremented-version create returns HTTP 412 with error_id == ERR_STALE_PROJECT_VERSION"
            - "GET /deliverables?project_id=${proj_id} returns an empty list immediately after the rejection"
            - "Project.${proj_id}.version is unchanged by the rejected create"
            - "the create carrying the observed version returns HTTP 201 with Deliverable.${deliv_id}.status == PREPARED and remediation_round == 0"
            - "Deliverable.${deliv_id}.prepared_by_user_id == 'sup-1' and Project.${proj_id}.version is exactly one higher than the observed ${proj_v_now}"

      - name: occ_stale_stem_package_version_blocks_cue_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cue-create-stale-stem-package]
          - errors[ERR_STALE_STEM_PACKAGE_VERSION]
        distinguishing_aspect: "The third OCC rule pins a different parent entity: the version observed at package creation is consumed by the first cue, so the second cue carrying that same version is refused with ERR_STALE_STEM_PACKAGE_VERSION (412) — protecting the same-cue_number supersede path from a stale view — and the re-read version admits it."
        test_recipe:
          setup:
            - "One project and one DRAFT stem package, version 1 at create."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { title: "Occ Cues", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_id: $.data.id, sp_v_at_create: $.data.version }
          trigger:
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v_at_create}", cue_number: "1M1", duration_seconds: 90, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { cue_one_id: $.data.id }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v_at_create}", cue_number: "1M2", duration_seconds: 90, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { stale_error: $.data.error_id }
            - call: "GET /stem-packages/${sp_id}"
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_v_reread: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v_reread}", cue_number: "1M2", duration_seconds: 90, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { cue_two_id: $.data.id }
          assert:
            - "StemPackage.${sp_id}.version == 1 at create and == 2 after the first cue"
            - "the second cue reusing version 1 returns HTTP 412 with error_id == ERR_STALE_STEM_PACKAGE_VERSION"
            - "GET /stem-packages/${sp_id}/music-cues returns exactly 1 cue after the rejection and StemPackage.${sp_id}.version is still 2"
            - "the re-read version equals 2 and the retry returns HTTP 201 with MusicCue.${cue_two_id}.cue_number == '1M2' and status ACTIVE"
            - "StemPackage.${sp_id}.version == 3 and active_cue_count == 2 after the retry"
            - "MusicCue.${cue_one_id}.status is still ACTIVE (a different cue_number supersedes nothing)"

      - name: derived_counts_reconcile_across_two_sibling_stem_packages
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.project_posture
          - calculations.stem_conform_fee
          - entities.Project.fields.conformed_stem_count
        distinguishing_aspect: "Project-level derived counts must aggregate over siblings, not over the last write: conforming two packages gives conformed_stem_count 2 with 6000 in conform fees, revising a cue in the second drops it to 1 conformed / 1 stale and flips posture to RESTRICTED while keeping the already-accrued fee, and reconforming reprices that package to 6000 for a total of 9000 with posture back to OPEN."
        test_recipe:
          setup:
            - "One project with two packages, each carrying a single 120-second cue."
            - "The revision doubles package B's cue to 240 seconds (4.00 stem minutes at 1500 = 6000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { title: "Sibling Counts", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_a_id: $.data.id, sp_a_v0: $.data.version }
            - call: "POST /stem-packages/${sp_a_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_a_v0}", cue_number: "1M1", duration_seconds: 120, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R2", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_b_id: $.data.id, sp_b_v0: $.data.version }
            - call: "POST /stem-packages/${sp_b_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_b_v0}", cue_number: "2M1", duration_seconds: 120, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
          trigger:
            - call: "POST /stem-packages/${sp_a_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { fee_a: $.data.conform_fee_cents }
            - call: "POST /stem-packages/${sp_b_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { fee_b_first: $.data.conform_fee_cents }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { total_after_two_conforms: $.data.conform_fee_total_cents }
            - call: "GET /stem-packages/${sp_b_id}"
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_b_v_conformed: $.data.version }
            - call: "POST /stem-packages/${sp_b_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_b_v_conformed}", cue_number: "2M1", duration_seconds: 240, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { revised_cue_id: $.data.id }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { posture_after_revision: $.data.posture, stale_count: $.data.stale_stem_count }
            - call: "POST /stem-packages/${sp_b_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { fee_b_second: $.data.conform_fee_cents }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { total_final: $.data.conform_fee_total_cents, posture_final: $.data.posture }
          assert:
            - "after both conforms: conform_fee_cents == 3000 on each package, conform_fee_total_cents == 6000, conformed_stem_count == 2, stale_stem_count == 0, posture == OPEN"
            - "after the revision: StemPackage.${sp_b_id}.status == STALE with stale_reason CUE_REVISED and conform_fee_cents still 3000"
            - "after the revision the ledger reports conformed_stem_count == 1, stale_stem_count == 1, posture == RESTRICTED and conform_fee_total_cents == 6000 (the accrued fee is not clawed back)"
            - "MusicCue.${revised_cue_id}.status == ACTIVE and the prior 2M1 cue is SUPERSEDED, so active_cue_count on package B stays 1"
            - "after the reconform: StemPackage.${sp_b_id}.conform_fee_cents == 6000 (240 seconds = 4.00 stem minutes * 1500) with conform_round == 2"
            - "the final ledger reports conform_fee_total_cents == 9000, conformed_stem_count == 2, stale_stem_count == 0, posture == OPEN and billing_total_cents == 9000"
            - "StemPackage.${sp_a_id} is untouched throughout: status CONFORMED, conform_round 1, conform_fee_cents 3000"

      - name: cascading_side_effects_four_levels_from_a_broken_picture_lock
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / break_picture_lock_depth_four_stem_deliverable_booking_ledger
          rationale: "The end-to-end four-level chain and its ordering sensitivity are asserted there, together with the library-asset revoke cascade in the sibling instance."

      - name: dual_variant_calculation_over_one_usage_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / license_risk_intake_snapshot_vs_delivery_audit_divergence
          rationale: "Both variants over one usage set, their delta and the gate that reads only the audit variant are asserted there; the provisional-vs-final stage cost pair covers the switch delta."

  - section: consistency_model
    instances:

      - name: immediate_visibility_of_every_derived_field_in_the_writing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
        distinguishing_aspect: "The declared model is immediate, so no read-after-write lag is tolerated anywhere: the conform response itself carries the recomputed fee, the booking response carries the provisional cost, and a ledger read issued immediately afterwards reports the identical figures with no second write in between."
        test_recipe:
          setup:
            - "One project, one stage at 100000, one mixer certified STREAMING, one package with a single 120-second cue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_M1", display_name: "Stage M1", hourly_rate_cents: 100000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { stage_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Immediate Ida", certified_platforms: ["STREAMING"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_one_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Immediate Consistency", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_id: $.data.id, sp_v0: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v0}", cue_number: "1M1", duration_seconds: 120, source: "COMPOSER_ORIGINAL" }
              as: SoundEditor
              as_user_id: "editor-1"
          trigger:
            - call: "POST /stem-packages/${sp_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { conform_fee_in_write_response: $.data.conform_fee_cents, conform_status: $.data.status }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { conform_total_read: $.data.conform_fee_total_cents }
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v: $.data.version }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "PREMIX", platform: "STREAMING", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T12:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { booking_id: $.data.id, provisional_in_write_response: $.data.provisional_cost_cents }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { subtotal_read: $.data.stage_cost_subtotal_cents, total_read: $.data.billing_total_cents }
          assert:
            - "the conform response itself carries status CONFORMED and conform_fee_cents == 3000 — no follow-up read is needed to observe the fee"
            - "the ledger read immediately after the conform reports conform_fee_total_cents == 3000 and conformed_stem_count == 1"
            - "the booking create response itself carries reserved_hours == 2.00 and provisional_cost_cents == 200000"
            - "the ledger read immediately after the create reports stage_hours_reserved == 2.00, stage_hours_available == 38.00 and stage_cost_subtotal_cents == 200000"
            - "that same ledger read reports billing_total_cents == 203000, so the denormalised Project.billing_total_cents and the computed read never disagree within one request boundary"
            - "every response in this recipe carries the §1.0 envelope with meta.api_request_id and response_type 'object'"
