  - rule_id: cross_entity_state_dependency
    instances:
      - name: appeal_requires_student_suspension
        grounds:
          - validations[priority=9]
          - state_machines.Student.GOOD_STANDING_to_WARNING
        distinguishing_aspect: |
          Entity pair (Appeal, Student): Appeal creation is gated on the Student's
          sap_status being SUSPENSION; a WARNING student holding a valid OFFICIAL
          evaluation cannot open an appeal. Sibling instance crosses the
          (Term, TermEnrollment) pair.
        test_recipe:
          setup:
            - "Program required_credits=120; T1; Student S evaluated to WARNING (attempted 12 earned 6 QP 24.0 gh 12)"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-ART", name: "Art", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-9301", full_name: "Gail Gated", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t1}", as: AidOfficer, captures: { ev1: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
          trigger:
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev1}", reason_category: "OTHER", statement: "I want to appeal my warning", documents: [{ doc_type: "NOTE", description: "Statement" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STUDENT_NOT_SUSPENDED (Student.sap_status == WARNING blocks Appeal creation)"
            - "GET /sap/appeals?student_id=${stu} total_count == 0"

      - name: term_close_requires_all_enrollments_posted
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Term.OPEN_to_GRADING_CLOSED
        distinguishing_aspect: |
          Entity pair (Term, TermEnrollment): the Term's OPEN -> GRADING_CLOSED
          transition is guarded by the state of its child enrollments (no IN_PROGRESS
          may remain), and evaluation is in turn gated on the Term's own state — a
          different cross-entity pair than (Appeal, Student).
        test_recipe:
          setup:
            - "Program required_credits=120; T1; Student S; one enrollment IN_PROGRESS (not yet posted)"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-GEOL", name: "Geology", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-9302", full_name: "Hal Pending", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 12 }, as: Registrar, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer, captures: { err_eval: $.data.error_id } }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar, captures: { err_close: $.data.error_id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 12, quality_points: 48.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar, captures: { t_status: $.data.status } }
          assert:
            - "evaluate on OPEN term: ERR_TERM_NOT_READY"
            - "close-grading with an IN_PROGRESS enrollment: ERR_ENROLLMENTS_PENDING"
            - "after posting the enrollment, close-grading succeeds: Term.status == GRADING_CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: term_date_intervals_touching_rejected
        grounds:
          - validations[priority=15]
          - errors[ERR_TERM_DATE_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the Term-calendar resource: a new term whose
          start_date equals an existing term's end_date counts as overlap (touching
          endpoints conflict); only a strictly-later start is accepted. Sibling uses
          half-open ordinal coverage on the plan resource — different interval
          semantics and a different resource.
        test_recipe:
          setup:
            - "T1 exists with [2026-01-12, 2026-05-08], seq 1"
          setup_api_calls:
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /sap/terms", payload: { code: "T2-TOUCH", seq: 2, start_date: "2026-05-08", end_date: "2026-08-14" }, as: Registrar, captures: { err_touch: $.data.error_id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-09", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id, t2_status: $.data.status } }
          assert:
            - "touching intervals rejected: ERR_TERM_DATE_OVERLAP for [2026-05-08, 2026-08-14] vs existing [2026-01-12, 2026-05-08]"
            - "gap-of-one-day interval accepted: T2 [2026-05-09, 2026-08-14] created with status OPEN"

      - name: plan_term_coverage_half_open_overlap
        grounds:
          - validations[priority=16]
          - entities.AcademicPlan.fields.coverage_end_seq_exclusive
          - errors[ERR_PLAN_TERM_OVERLAP]
        distinguishing_aspect: |
          Half-open ordinal-coverage semantics on the student's plan-coverage resource:
          plan1 covers seqs [3,5); a second plan starting at seq 3 conflicts, but one
          starting at exactly seq 5 (adjacency at the exclusive bound) is allowed.
          Different interval semantics (half-open discrete vs closed dates) and
          different resource than the sibling.
        test_recipe:
          setup:
            - "Program required_credits=120; T1..T5 (seqs 1..5); Student S suspended at T2; appeal approved WITH_PLAN"
            - "Plan1 ACTIVE: start T3, checkpoints T3/T4 each required_earned 12, total 24 -> coverage [3,5)"
            - "T3 enrollment attempted 12 posted earned 0 QP 0.0 gh 12; T3 evaluated -> checkpoint MISSED -> plan1 FAILED, S back to SUSPENSION with a fresh T3 evaluation"
            - "Second appeal approved WITH_PLAN (standing PLAN_PENDING)"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-MECH", name: "Mechanical Eng", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T3", seq: 3, start_date: "2026-08-24", end_date: "2026-12-11" }, as: Registrar, captures: { t3: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T4", seq: 4, start_date: "2027-01-11", end_date: "2027-05-07" }, as: Registrar, captures: { t4: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T5", seq: 5, start_date: "2027-05-17", end_date: "2027-08-13" }, as: Registrar, captures: { t5: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-9401", full_name: "Pam Overlap", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v1: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MEDICAL", statement: "First appeal", documents: [{ doc_type: "NOTE", description: "Note" }], expected_student_version: "${s_v1}" }, as: Student, as_user_id: "${stu}", captures: { ap1: $.data.id } }
            - { call: "POST /sap/appeals/${ap1}/screen", as: AidOfficer }
            - { call: "POST /sap/appeals/${ap1}/decide", payload: { decision: "APPROVED", resolution: "WITH_PLAN", rationale: "Plan required" }, as: CommitteeMember }
            - { call: "POST /sap/plans", payload: { student_id: "${stu}", appeal_id: "${ap1}", start_term_id: "${t3}", total_required_credits: 24, checkpoints: [{ term_id: "${t3}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 12 }, { term_id: "${t4}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 12 }] }, as: AidOfficer, captures: { plan1: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t3}", attempted_credits: 12 }, as: Registrar, captures: { e3: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e3}/post", payload: { earned_credits: 0, quality_points: 0.0, gpa_hours: 12 }, as: Registrar }
            - { call: "POST /sap/terms/${t3}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t3}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t3}", as: AidOfficer, captures: { ev3: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v2: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev3}", reason_category: "FAMILY_EMERGENCY", statement: "Second appeal", documents: [{ doc_type: "AFFIDAVIT", description: "Affidavit" }], expected_student_version: "${s_v2}" }, as: Student, as_user_id: "${stu}", captures: { ap2: $.data.id } }
            - { call: "POST /sap/appeals/${ap2}/screen", as: AidOfficer }
            - { call: "POST /sap/appeals/${ap2}/decide", payload: { decision: "APPROVED", resolution: "WITH_PLAN", rationale: "Second chance with plan" }, as: CommitteeMember }
          trigger:
            - { call: "POST /sap/plans", payload: { student_id: "${stu}", appeal_id: "${ap2}", start_term_id: "${t3}", total_required_credits: 24, checkpoints: [{ term_id: "${t3}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 12 }, { term_id: "${t4}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 12 }] }, as: AidOfficer, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /sap/plans", payload: { student_id: "${stu}", appeal_id: "${ap2}", start_term_id: "${t5}", total_required_credits: 24, checkpoints: [{ term_id: "${t5}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 24 }] }, as: AidOfficer, captures: { plan2: $.data.id, plan2_status: $.data.status, plan2_cs: $.data.coverage_start_seq, plan2_ce: $.data.coverage_end_seq_exclusive } }
          assert:
            - "plan1 covered [3,5); restart at seq 3 rejected with ERR_PLAN_TERM_OVERLAP (half-open intersection [3,5) vs [3,5))"
            - "start at seq 5 accepted (adjacency at the exclusive bound is disjoint): plan2 created"
            - "plan2.status == ACTIVE, coverage_start_seq == 5, coverage_end_seq_exclusive == 6"
            - "GET /sap/students/${stu}.sap_status == PLAN_ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: enrollment_amendment_conserves_cumulative_earned
        grounds:
          - state_machines.TermEnrollment.POSTED_to_AMENDED
          - entities.Student.fields.cumulative_earned_credits
        distinguishing_aspect: |
          Conserved quantity: the earned-credit ledger — student.cumulative_earned_credits
          == SUM(earned_credits) over POSTED|AMENDED enrollments. The forward action
          (amend 3 -> 0) paired with its compensating action (amend 0 -> 3) leaves the
          ledger exactly unchanged (9 -> 6 -> 9), while attempted credits stay 12
          throughout. Sibling conserves a different quantity (plan credit budget).
        test_recipe:
          setup:
            - "Program required_credits=120; T1; Student S; E1 attempted 6 POSTED earned 6 QP 24.0 gh 6; E2 attempted 6 POSTED earned 3 QP 9.0 gh 6"
            - "No evaluation run (term stays OPEN->not evaluated), so no re-evaluation cascade fires"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-STAT", name: "Statistics", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-9501", full_name: "Amy Ledger", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 6, quality_points: 24.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 9.0, gpa_hours: 6 }, as: Registrar }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { earn_0: $.data.cumulative_earned_credits, att_0: $.data.cumulative_attempted_credits } }
          trigger:
            - { call: "POST /sap/term-enrollments/${e2}/amend", payload: { earned_credits: 0, quality_points: 0.0, gpa_hours: 6, amendment_reason: "Grade changed B -> F" }, as: Registrar, captures: { e2_status: $.data.status } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { earn_1: $.data.cumulative_earned_credits, att_1: $.data.cumulative_attempted_credits } }
            - { call: "POST /sap/term-enrollments/${e2}/amend", payload: { earned_credits: 3, quality_points: 9.0, gpa_hours: 6, amendment_reason: "Grade appeal upheld: F -> B restored" }, as: Registrar, captures: { e2_amend_count: $.data.amendment_count } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { earn_2: $.data.cumulative_earned_credits, att_2: $.data.cumulative_attempted_credits, pace_2: $.data.pace_pct } }
          assert:
            - "initial: cumulative_earned_credits == 9 (6 + 3), cumulative_attempted_credits == 12"
            - "after forward amend (3 -> 0): cumulative_earned_credits == 6 == SUM over POSTED|AMENDED rows (6 + 0)"
            - "after compensating amend (0 -> 3): cumulative_earned_credits == 9 — the ledger is exactly restored, no drift"
            - "cumulative_attempted_credits == 12 at every step (amend never touches attempted)"
            - "E2.amendment_count == 2 and status == AMENDED; final pace_pct == 75.0"

      - name: plan_revision_conserves_credit_budget
        grounds:
          - calculations.plan_credit_budget_invariant
          - validations[priority=17]
        distinguishing_aspect: |
          Conserved quantity: the plan credit budget — plan.total_required_credits ==
          SUM(checkpoints.required_earned_credits) == 24 across create and revise. A
          rebalancing revise (12+12 -> 10+14) conserves it; an unbalanced revise
          (10+15) is rejected with ERR_PLAN_CREDIT_MISMATCH leaving the plan untouched.
          Different conserved quantity than the sibling's earned-credit ledger.
        test_recipe:
          setup:
            - "Program required_credits=120; T1..T4; Student S suspended at T2; appeal approved WITH_PLAN"
            - "Plan ACTIVE: total 24, checkpoints T3: 12, T4: 12"
          setup_api_calls:
            - { call: "POST /sap/programs", payload: { code: "BS-FIN", name: "Finance", required_credits: 120 }, as: Registrar, captures: { prog: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T1", seq: 1, start_date: "2026-01-12", end_date: "2026-05-08" }, as: Registrar, captures: { t1: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T2", seq: 2, start_date: "2026-05-18", end_date: "2026-08-14" }, as: Registrar, captures: { t2: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T3", seq: 3, start_date: "2026-08-24", end_date: "2026-12-11" }, as: Registrar, captures: { t3: $.data.id } }
            - { call: "POST /sap/terms", payload: { code: "T4", seq: 4, start_date: "2027-01-11", end_date: "2027-05-07" }, as: Registrar, captures: { t4: $.data.id } }
            - { call: "POST /sap/students", payload: { student_number: "S-9502", full_name: "Bud Jet", program_id: "${prog}" }, as: Registrar, captures: { stu: $.data.id } }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t1}", attempted_credits: 6 }, as: Registrar, captures: { e1: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e1}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t1}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t1}/evaluate", as: AidOfficer }
            - { call: "POST /sap/term-enrollments", payload: { student_id: "${stu}", term_id: "${t2}", attempted_credits: 6 }, as: Registrar, captures: { e2: $.data.id } }
            - { call: "POST /sap/term-enrollments/${e2}/post", payload: { earned_credits: 3, quality_points: 6.0, gpa_hours: 6 }, as: Registrar }
            - { call: "POST /sap/terms/${t2}/close-grading", as: Registrar }
            - { call: "POST /sap/terms/${t2}/evaluate", as: AidOfficer }
            - { call: "GET /sap/evaluations?student_id=${stu}&term_id=${t2}", as: AidOfficer, captures: { ev2: "$.data[0].id" } }
            - { call: "GET /sap/students/${stu}", as: AidOfficer, captures: { s_v: $.data.version } }
            - { call: "POST /sap/appeals", payload: { sap_evaluation_id: "${ev2}", reason_category: "MILITARY", statement: "Deployment", documents: [{ doc_type: "ORDERS", description: "Deployment orders" }], expected_student_version: "${s_v}" }, as: Student, as_user_id: "${stu}", captures: { ap: $.data.id } }
            - { call: "POST /sap/appeals/${ap}/screen", as: AidOfficer }
            - { call: "POST /sap/appeals/${ap}/decide", payload: { decision: "APPROVED", resolution: "WITH_PLAN", rationale: "Plan appropriate" }, as: CommitteeMember }
            - { call: "POST /sap/plans", payload: { student_id: "${stu}", appeal_id: "${ap}", start_term_id: "${t3}", total_required_credits: 24, checkpoints: [{ term_id: "${t3}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 12 }, { term_id: "${t4}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 12 }] }, as: AidOfficer, captures: { plan: $.data.id } }
          trigger:
            - { call: "POST /sap/plans/${plan}/revise", payload: { checkpoints: [{ term_id: "${t3}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 10 }, { term_id: "${t4}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 14 }] }, as: AidOfficer, captures: { plan_total: $.data.total_required_credits } }
            - { call: "GET /sap/checkpoints?plan_id=${plan}&term_id=${t3}", as: AidOfficer, captures: { ck_t3: "$.data[0].required_earned_credits" } }
            - { call: "GET /sap/checkpoints?plan_id=${plan}&term_id=${t4}", as: AidOfficer, captures: { ck_t4: "$.data[0].required_earned_credits" } }
            - { call: "POST /sap/plans/${plan}/revise", payload: { checkpoints: [{ term_id: "${t3}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 10 }, { term_id: "${t4}", required_term_gpa: 2.0, required_term_pace_pct: 67.0, required_earned_credits: 15 }] }, as: AidOfficer, captures: { err_mismatch: $.data.error_id } }
          assert:
            - "balanced revise (10 + 14 = 24) succeeds; plan.total_required_credits == 24 (unchanged)"
            - "checkpoint(T3).required_earned_credits == 10 and checkpoint(T4).required_earned_credits == 14; SUM == 24 == total_required_credits"
            - "unbalanced revise (10 + 15 = 25) rejected with ERR_PLAN_CREDIT_MISMATCH"
            - "after the rejection the checkpoints are still 10 and 14 (no partial write, no budget drift)"
