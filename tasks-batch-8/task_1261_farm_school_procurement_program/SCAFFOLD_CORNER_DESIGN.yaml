          rationale: "Both OCC write endpoints assert the 412 path."

      - name: err_farm_not_compliant_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FARM_NOT_COMPLIANT]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / delivery_safety_beats_temporal_conflict"
          rationale: "Asserted as the winning error of the named section 1.8 instance."

