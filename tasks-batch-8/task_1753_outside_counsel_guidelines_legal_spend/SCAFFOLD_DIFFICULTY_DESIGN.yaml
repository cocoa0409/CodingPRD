              captures: { tk_a1: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "Assoc2", tk_class: "ASSOCIATE" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_a2: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "Assoc3", tk_class: "ASSOCIATE" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_a3: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_p}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_a1}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_a2}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_a3}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_p}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_a1}", hourly_rate_cents: 50000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_a2}", hourly_rate_cents: 50000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/rates"
              payload: { timekeeper_id: "${tk_a3}", hourly_rate_cents: 50000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card_id}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/matters"
              payload: { panel_firm_id: "${firm_id}", title: "Matter S", budget_cents: 100000000 }
              as: LegalOpsReviewer
              captures: { matter_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/engage"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { matter_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/matters/${matter_id}/invoices"
              payload:
                invoice_number: "INV-S-001"
                billing_period_start: "2026-08-01T00:00:00Z"
                billing_period_end: "2026-09-01T00:00:00Z"
                expected_matter_version: "${matter_v}"
                line_items:
                  - { timekeeper_id: "${tk_p}", utbms_task_code: "L110", narrative: "Strategy L110", hours: 50.00, rate_cents: 100000 }
                  - { timekeeper_id: "${tk_a1}", utbms_task_code: "L120", narrative: "Research L120", hours: 10.00, rate_cents: 50000 }
