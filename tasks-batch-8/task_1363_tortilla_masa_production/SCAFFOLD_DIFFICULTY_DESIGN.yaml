      - name: run_create_safety_beats_business_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_ALLERGEN_ZONE_VIOLATION]
          - errors[ERR_LINE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair
          from state-vs-fiscal): the new run is a WHEAT_FLOUR product on a
          DEDICATED_CORN line (safety) AND its window overlaps an existing run
          (temporal); priority 6 safety wins with ERR_ALLERGEN_ZONE_VIOLATION.
        test_recipe:
          setup:
            - "DEDICATED_CORN line with an existing CORN_ONLY run 10:00-12:00 (line version advanced to 2)"
            - "WHEAT_FLOUR product registered"
          setup_api_calls:
            - { call: "POST /plant/products", payload: { sku_code: "CORN-6-P2", diameter_in: "D6", count_per_pack: 12, packs_per_case: 10, unit_weight_g: 30, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "CORN_ONLY" }, as: PlantManager, captures: { corn_id: "$.data.id" } }
            - { call: "POST /plant/products", payload: { sku_code: "WHEAT-8-10", diameter_in: "D8", count_per_pack: 10, packs_per_case: 8, unit_weight_g: 45, channel: "RETAIL", preservative_system: "PROPIONATE", allergen_class: "WHEAT_FLOUR" }, as: PlantManager, captures: { wheat_id: "$.data.id" } }
            - { call: "POST /plant/lines", payload: { line_code: "L-DED", allergen_zone: "DEDICATED_CORN", cases_per_hour: 100 }, as: PlantManager, captures: { line_id: "$.data.id", lv1: "$.data.version" } }
            - { call: "POST /plant/runs", payload: { product_id: "${corn_id}", line_id: "${line_id}", planned_cases: 100, start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T12:00:00Z", expected_line_version: "${lv1}" }, as: LineScheduler, captures: { run_a: "$.data.id" } }
            - { call: "GET /plant/lines/${line_id}", payload: {}, as: LineScheduler, captures: { lv2: "$.data.version" } }
          trigger:
            - { call: "POST /plant/runs", payload: { product_id: "${wheat_id}", line_id: "${line_id}", planned_cases: 50, start_at: "2026-08-02T11:00:00Z", end_at: "2026-08-02T13:00:00Z", expected_line_version: "${lv2}" }, as: LineScheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ALLERGEN_ZONE_VIOLATION (priority 6 business_safety beats priority 7 business_temporal)"
            - "ERR_LINE_WINDOW_OVERLAP is NOT returned despite [11:00,13:00) overlapping [10:00,12:00)"

      - name: stop_create_constraint_beats_business_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
          - errors[ERR_ALLOTMENT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_constraint vs business_fiscal (a third
          distinct pair): requested 45 cases exceed BOTH route open_cases 40
          (constraint) and strict-window allotment remaining 40 (fiscal);
          priority 8 constraint wins with ERR_ROUTE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "strict window ACTIVE (mult 1.5, forecast 500, dates 2026-08-10..16); customer tier A base 33 -> allotment 50"
