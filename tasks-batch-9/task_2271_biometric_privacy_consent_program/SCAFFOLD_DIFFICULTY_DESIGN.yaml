            - "The trigger returns 409 with error_id ERR_PROGRAM_POSTURE_BLOCKED"
            - "The response error_id is NOT ERR_VENDOR_RISK_TOO_HIGH and the status is NOT 422"
            - "BiometricAsset.${a2_id}.status remains CLASSIFIED with pinned_policy_id null and collection_started_at null"

      - name: notice_lead_priority_11_outranks_subject_class_mismatch_priority_13
        grounds:
          - validations[priority=11].ERR_NOTICE_LEAD_NOT_MET
          - validations[priority=13].ERR_SUBJECT_CLASS_MISMATCH
