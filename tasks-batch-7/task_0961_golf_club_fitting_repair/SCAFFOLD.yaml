scenario: "961. Golf-Club Fitting & Repair: fitting session & launch-monitor, build spec & component order, regrip/reshaft ticket, trade-in/used, turnaround & rush, warranty, lesson linkage, inventory"

domain_name: golf-club-fitting-repair
api_prefix: /golf-shop

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite component stock: reserved / allocated / released / consumed
  secondary_archetype: temporal_windowing    # launch-monitor bay + specialist scheduling with distinct interval semantics
  complexity_layers:
    - optimistic_concurrency                 # OCC on ClubBuildSpec.version and TradeInAppraisal.version (supersede patterns)
    - cascading_side_effects                 # receive -> stock -> order -> spec ; ticket cancel -> stock -> order -> spec
    - dual_variant_calculation               # provisional vs final build price; grade-matrix vs market-comp trade-in value
    - scheduled_actions                      # logical clock sweeps: offer expiry, reservation expiry, package expiry, no-show
  entity_topology: flat                      # peer entities with FK references; no nested URL ownership
  state_machine_shape: cyclic                # rework loop, re-quote loop, re-offer loop, appeal loop, package EXHAUSTED<->ACTIVE
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties          # appraising staff member may not adjust resale price of the same listing
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer display name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers", constraints: "unique" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }
      - { name: completed_builds_count, type: integer, source: computed, default: 0, description: "Count of ClubBuildSpec rows for this customer that reached DELIVERED; incremented on deliver" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all CreditLedgerEntry rows with customer_id = this customer" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff display name" }
      - { name: staff_role, type: enum, source: input, description: "FITTING_SPECIALIST | REPAIR_TECHNICIAN | INSTRUCTOR | SHOP_MANAGER" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the staff member may be assigned to new work" }

  - name: LaunchMonitorBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_name, type: string, source: input, description: "Bay display name; unique", constraints: "unique" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | MAINTENANCE" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 15, description: "Required gap in minutes between consecutive sessions on this bay" }

  - name: LessonPackage
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; package owner" }
      - { name: total_credits, type: integer, source: input, description: "Total lesson/fitting credits purchased; >= 1" }
      - { name: credits_used, type: integer, source: computed, default: 0, description: "Credits consumed by bookings minus credits refunded by early cancellations" }
      - { name: price_cents, type: integer, source: input, description: "Package purchase price" }
      - { name: expires_at, type: datetime, source: input, description: "ISO8601 UTC instant after which the package is swept to EXPIRED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXHAUSTED | EXPIRED; derived from credits_used vs total_credits and expires_at" }

  - name: FittingSession
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: bay_id, type: string, source: input, description: "FK -> LaunchMonitorBay.id" }
      - { name: specialist_id, type: string, source: input, description: "FK -> StaffMember.id; the assigned fitting specialist" }
      - { name: lesson_package_id, type: string, source: input, description: "FK -> LessonPackage.id; optional; when present one credit is consumed at booking", constraints: "nullable" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC session start; must be < ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "ISO8601 UTC session end" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: credit_consumed, type: boolean, source: system, default: false, description: "True when booking consumed one lesson-package credit" }
      - { name: credit_refunded, type: boolean, source: system, default: false, description: "True when an early cancellation refunded the consumed credit" }

  - name: ComponentItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit; unique", constraints: "unique" }
      - { name: component_type, type: enum, source: input, description: "HEAD | SHAFT | GRIP" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Shop acquisition cost; used in final build pricing" }
      - { name: msrp_cents, type: integer, source: input, description: "List price; used in provisional build quotes" }
      - { name: stock_on_hand, type: integer, source: system, description: "Unreserved physical stock = received_total - reserved - consumed_total" }
      - { name: stock_reserved, type: integer, source: system, default: 0, description: "Units reserved by ALLOCATED ComponentOrders or in-progress reshaft tickets" }
      - { name: consumed_total, type: integer, source: system, default: 0, description: "Units permanently consumed by completed builds/repairs" }
      - { name: received_total, type: integer, source: system, description: "initial_stock + sum of all receipt qty" }

  - name: ClubBuildSpec
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: fitting_session_id, type: string, source: input, description: "FK -> FittingSession.id; the session that produced this spec" }
      - { name: head_item_id, type: string, source: input, description: "FK -> ComponentItem.id; must have component_type HEAD" }
      - { name: shaft_item_id, type: string, source: input, description: "FK -> ComponentItem.id; must have component_type SHAFT" }
      - { name: grip_item_id, type: string, source: input, description: "FK -> ComponentItem.id; must have component_type GRIP" }
      - { name: length_inches, type: number, source: input, description: "Build length" }
      - { name: loft_deg, type: number, source: input, description: "Loft angle" }
      - { name: lie_deg, type: number, source: input, description: "Lie angle" }
      - { name: labor_cents, type: integer, source: input, description: "Flat build labor charge" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | QUOTED | ORDERED | IN_BUILD | READY | DELIVERED | CANCELLED" }
      - { name: provisional_quote_cents, type: integer, source: computed, description: "MSRP-based quote (calculations.build_provisional_quote); null until first quote", constraints: "nullable" }
      - { name: final_price_cents, type: integer, source: computed, description: "Unit-cost-based final price (calculations.build_final_price); set at approve", constraints: "nullable" }
      - { name: payment_method, type: enum, source: system, description: "CREDIT | EXTERNAL; recorded at approve", constraints: "nullable" }
      - { name: delivered_at, type: datetime, source: system, description: "ISO8601 UTC instant of DELIVERED transition; warranty clock anchor", constraints: "nullable" }

  - name: ComponentOrder
    parent: null
    common_fields: true
    fields:
      - { name: build_spec_id, type: string, source: system, description: "FK -> ClubBuildSpec.id; created as a side effect of spec approve" }
      - { name: status, type: enum, source: system, default: PENDING_ALLOCATION, description: "PENDING_ALLOCATION | ALLOCATED | BACKORDERED | CLOSED | CANCELLED" }
      - { name: lines, type: array, source: computed, description: "Three entries derived from the spec: [{component_item_id, required_qty: 1, allocated_qty}] for head, shaft, grip" }
      - { name: required_units, type: integer, source: computed, default: 3, description: "Total required units across lines (always 3 in v1)" }

  - name: RepairTicket
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: club_description, type: string, source: input, description: "Free-text description of the club being repaired" }
      - { name: service_type, type: enum, source: input, description: "REGRIP | RESHAFT | LOFT_LIE_ADJUST" }
      - { name: rush, type: boolean, source: input, default: false, description: "Rush turnaround requested" }
      - { name: shaft_item_id, type: string, source: input, description: "FK -> ComponentItem.id; required iff service_type == RESHAFT; must have component_type SHAFT", constraints: "nullable; required when service_type=RESHAFT" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "calculations.repair_quote: service base price + rush fee" }
      - { name: promised_at, type: datetime, source: computed, description: "created_at + 24h (rush) or + 72h (standard)" }
      - { name: deposit_cents, type: integer, source: computed, description: "round_half_up(quoted_total_cents * 0.5); balance payment is the remainder" }
      - { name: work_status, type: enum, source: system, default: QUOTED, description: "QUOTED | APPROVED | IN_PROGRESS | READY | PICKED_UP | CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: UNPAID, description: "UNPAID | DEPOSIT_PAID | PAID | REFUNDED; parallel dimension independent of work_status" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of failed quality checks (IN_PROGRESS self-loops)" }
      - { name: picked_up_at, type: datetime, source: system, description: "ISO8601 UTC instant of PICKED_UP transition; warranty clock anchor", constraints: "nullable" }

  - name: TradeInAppraisal
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: clubs, type: array, source: input, description: "Non-empty array of {club_type: DRIVER|FAIRWAY|HYBRID|IRON_SET|WEDGE|PUTTER, condition_grade: A|B|C|D}" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | OFFERED | DECLINED | ACCEPTED | EXPIRED" }
      - { name: offer_basis, type: enum, source: system, description: "GRADE_MATRIX | MARKET_COMP; basis of the current offer", constraints: "nullable" }
      - { name: offered_value_cents, type: integer, source: computed, description: "calculations.tradein_offer_value under the current offer_basis", constraints: "nullable" }
      - { name: offer_expires_at, type: datetime, source: computed, description: "Offer creation instant + 168h; swept to EXPIRED past this", constraints: "nullable" }
      - { name: offered_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; X-User-ID of the staff member who issued the current offer", constraints: "nullable" }

  - name: UsedClubListing
    parent: null
    common_fields: true
    fields:
      - { name: appraisal_id, type: string, source: system, description: "FK -> TradeInAppraisal.id; source appraisal" }
      - { name: appraised_by_staff_id, type: string, source: system, description: "FK -> StaffMember.id; copied from TradeInAppraisal.offered_by_staff_id at listing creation; segregation-of-duties anchor" }
      - { name: list_price_cents, type: integer, source: computed, description: "Initially round_half_up(offered_value_cents * 1.4); mutable via adjust-price" }
      - { name: status, type: enum, source: system, default: LISTED, description: "LISTED | RESERVED | SOLD" }
      - { name: reserved_by_customer_id, type: string, source: system, description: "FK -> Customer.id; set on reserve, cleared on expiry sweep", constraints: "nullable" }
      - { name: reserved_until, type: datetime, source: system, description: "Reserve instant + 24h; swept back to LISTED past this", constraints: "nullable" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; copied from the subject's customer" }
      - { name: build_spec_id, type: string, source: input, description: "FK -> ClubBuildSpec.id; exactly one of build_spec_id / repair_ticket_id must be present", constraints: "nullable; xor with repair_ticket_id" }
      - { name: repair_ticket_id, type: string, source: input, description: "FK -> RepairTicket.id; exactly one of build_spec_id / repair_ticket_id must be present", constraints: "nullable; xor with build_spec_id" }
      - { name: description, type: string, source: input, description: "Claim description" }
      - { name: coverage_pct, type: integer, source: computed, description: "calculations.warranty_coverage: 0 | 50 | 100" }
      - { name: covered_estimate_cents, type: integer, source: computed, description: "round_half_up(subject price * coverage_pct / 100); subject price is spec final_price_cents or ticket quoted_total_cents" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DENIED | RESOLVED" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of DENIED -> SUBMITTED appeals; hard cap 2" }
      - { name: denial_reason, type: string, source: system, description: "Recorded when decided DENIED", constraints: "nullable" }

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; positive grants credit, negative redeems it" }
      - { name: reason, type: enum, source: system, description: "TRADE_IN_ACCEPT | BUILD_PAYMENT | BUILD_REFUND | WARRANTY_RESOLUTION | TICKET_PAYMENT | TICKET_REFUND" }
      - { name: reference_id, type: string, source: system, description: "Id of the originating entity (appraisal, spec, claim, or ticket); identity only, never used for ordering or selection" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FittingSession
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /golf-shop/fitting-sessions/{id}/check-in"
        actor: FittingSpecialist
        preconditions:
          - "LaunchMonitorBay (bay_id) status == AVAILABLE (ERR_BAY_UNAVAILABLE)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /golf-shop/fitting-sessions/{id}/complete"
        actor: FittingSpecialist
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /golf-shop/fitting-sessions/{id}/cancel"
        actor: "Customer (owner), FittingSpecialist, or ShopManager"
        preconditions: []
        side_effects:
          - "If credit_consumed and starts_at - now >= 24h: LessonPackage.credits_used -= 1, credit_refunded = true; if that package was EXHAUSTED it flips back to ACTIVE (refund threshold is inclusive: exactly 24h refunds)"
          - "If credit_consumed and starts_at - now < 24h: credit forfeited, no package mutation"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system: POST /golf-shop/_clock/set_current_utc sweep when now > ends_at"
        actor: system
        preconditions: []
        side_effects:
          - "Consumed lesson-package credit is forfeited (no refund)"

  - entity: LessonPackage
    field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: credit consumption pushes credits_used == total_credits"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: early-cancel credit refund makes credits_used < total_credits"
        actor: system
        preconditions: []
        side_effects: []
      - from: [ACTIVE, EXHAUSTED]
        to: EXPIRED
        trigger: "system: POST /golf-shop/_clock/set_current_utc sweep when now > expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClubBuildSpec
    field: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /golf-shop/build-specs/{id}/quote"
        actor: FittingSpecialist
        preconditions:
          - "OCC: expected_build_spec_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "provisional_quote_cents recomputed via calculations.build_provisional_quote"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /golf-shop/build-specs/{id}/quote (re-quote supersedes the prior quote)"
        actor: FittingSpecialist
        preconditions:
          - "OCC: expected_build_spec_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "provisional_quote_cents recomputed and replaces the prior quote"
      - from: QUOTED
        to: ORDERED
        trigger: "POST /golf-shop/build-specs/{id}/approve"
        actor: "Customer (owner)"
        preconditions:
          - "Customer (customer_id) status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
          - "If payment_method == CREDIT: customer credit_balance_cents >= resulting final_price_cents (ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "final_price_cents computed via calculations.build_final_price (unit costs locked at this instant)"
          - "ComponentOrder created (PENDING_ALLOCATION) with lines for head/shaft/grip, then allocation sweep runs"
          - "If payment_method == CREDIT: CreditLedgerEntry(-final_price_cents, BUILD_PAYMENT) and customer credit_balance_cents recomputed"
          - "If the sweep fully allocated the order, this spec advances ORDERED -> IN_BUILD in the same request"
      - from: ORDERED
        to: IN_BUILD
        trigger: "system: its ComponentOrder flips to ALLOCATED (at approve or after any later stock event sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_BUILD
        to: READY
        trigger: "POST /golf-shop/build-specs/{id}/mark-ready"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "ComponentOrder -> CLOSED; each line's allocated units consumed: ComponentItem.stock_reserved -= allocated_qty, consumed_total += allocated_qty"
      - from: READY
        to: DELIVERED
        trigger: "POST /golf-shop/build-specs/{id}/deliver"
        actor: "FittingSpecialist or ShopManager"
        preconditions: []
        side_effects:
          - "delivered_at = logical clock now"
          - "Customer.completed_builds_count += 1"
      - from: [DRAFT, QUOTED, ORDERED, IN_BUILD]
        to: CANCELLED
        trigger: "POST /golf-shop/build-specs/{id}/cancel"
        actor: "Customer (owner) or FittingSpecialist"
        preconditions: []
        side_effects:
          - "Its ComponentOrder (PENDING_ALLOCATION | BACKORDERED | ALLOCATED) -> CANCELLED; allocated units released: ComponentItem.stock_reserved -= allocated_qty, stock_on_hand += allocated_qty"
          - "Release triggers the allocation sweep over remaining BACKORDERED / PENDING_ALLOCATION orders"
          - "If payment_method == CREDIT: CreditLedgerEntry(+final_price_cents, BUILD_REFUND) and credit_balance_cents recomputed"

  - entity: ComponentOrder
    field: status
    initial_state: PENDING_ALLOCATION
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PENDING_ALLOCATION
        to: ALLOCATED
        trigger: "system: allocation sweep (at creation, after receipt, after release)"
        actor: system
        preconditions:
          - "Every line's required_qty can be satisfied from ComponentItem.stock_on_hand"
        side_effects:
          - "Per line: ComponentItem.stock_on_hand -= required_qty, stock_reserved += required_qty, allocated_qty = required_qty"
          - "Parent ClubBuildSpec ORDERED -> IN_BUILD"
      - from: PENDING_ALLOCATION
        to: BACKORDERED
        trigger: "system: allocation sweep when at least one line is short"
        actor: system
        preconditions: []
        side_effects:
          - "Partial per-line allocation: allocated_qty = min(remaining required, available); short lines keep remainder pending"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system: allocation sweep after a receipt or release event"
        actor: system
        preconditions:
          - "All line remainders now satisfiable"
        side_effects:
          - "Same stock mutations as PENDING_ALLOCATION -> ALLOCATED for the remainders"
          - "Parent ClubBuildSpec ORDERED -> IN_BUILD"
      - from: ALLOCATED
        to: CLOSED
        trigger: "system: parent spec mark-ready consumes the reservation"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING_ALLOCATION, BACKORDERED, ALLOCATED]
        to: CANCELLED
        trigger: "system: parent spec cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "Allocated units released back to stock_on_hand"

  - entity: RepairTicket
    field: work_status
    initial_state: QUOTED
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: QUOTED
        to: APPROVED
        trigger: "POST /golf-shop/repair-tickets/{id}/approve"
        actor: "Customer (owner)"
        preconditions:
          - "Customer status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects: []
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /golf-shop/repair-tickets/{id}/start-work"
        actor: RepairTechnician
        preconditions:
          - "payment_status == DEPOSIT_PAID or PAID (ERR_DEPOSIT_REQUIRED)"
          - "If shaft_item_id present: that ComponentItem.stock_on_hand >= 1 (ERR_COMPONENT_SHORTAGE)"
        side_effects:
          - "If shaft_item_id present: ComponentItem.stock_on_hand -= 1, stock_reserved += 1"
      - from: IN_PROGRESS
        to: READY
        trigger: "POST /golf-shop/repair-tickets/{id}/submit-qc with passed=true"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "If shaft_item_id present: reserved shaft consumed: stock_reserved -= 1, consumed_total += 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /golf-shop/repair-tickets/{id}/submit-qc with passed=false (rework loop)"
        actor: RepairTechnician
        preconditions: []
        side_effects:
          - "rework_count += 1"
      - from: READY
        to: PICKED_UP
        trigger: "POST /golf-shop/repair-tickets/{id}/pickup"
        actor: "Customer (owner) or RepairTechnician"
        preconditions:
          - "payment_status == PAID (ERR_TICKET_UNPAID)"
        side_effects:
          - "picked_up_at = logical clock now"
      - from: [QUOTED, APPROVED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /golf-shop/repair-tickets/{id}/cancel"
        actor: "Customer (owner) or RepairTechnician"
        preconditions: []
        side_effects:
          - "If payment_status in {DEPOSIT_PAID, PAID}: CreditLedgerEntry(+paid total, TICKET_REFUND) when payments were made by CREDIT; payment_status -> REFUNDED"
          - "If a shaft reservation is held (IN_PROGRESS with shaft_item_id): stock_reserved -= 1, stock_on_hand += 1; the release triggers the allocation sweep over BACKORDERED / PENDING_ALLOCATION orders"

  - entity: RepairTicketPayment
    field: payment_status
    note: "Parallel state dimension on RepairTicket; evolves independently of work_status except where transitions above gate on it"
    entity_ref: RepairTicket
    initial_state: UNPAID
    terminal_states: [PAID, REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /golf-shop/repair-tickets/{id}/payments with kind=DEPOSIT"
        actor: "Customer (owner)"
        preconditions:
          - "work_status in {QUOTED, APPROVED, IN_PROGRESS, READY} (ERR_INVALID_STATE_TRANSITION)"
          - "kind == DEPOSIT while UNPAID (ERR_PAYMENT_SEQUENCE)"
          - "If method == CREDIT: customer credit_balance_cents >= deposit_cents (ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "If method == CREDIT: CreditLedgerEntry(-deposit_cents, TICKET_PAYMENT); balance recomputed"
      - from: DEPOSIT_PAID
        to: PAID
        trigger: "POST /golf-shop/repair-tickets/{id}/payments with kind=BALANCE"
        actor: "Customer (owner)"
        preconditions:
          - "kind == BALANCE while DEPOSIT_PAID (ERR_PAYMENT_SEQUENCE)"
          - "If method == CREDIT: credit covers quoted_total_cents - deposit_cents (ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "If method == CREDIT: CreditLedgerEntry(-(quoted_total_cents - deposit_cents), TICKET_PAYMENT); balance recomputed"
      - from: [DEPOSIT_PAID, PAID]
        to: REFUNDED
        trigger: "system: ticket cancelled"
        actor: system
        preconditions: []
        side_effects:
          - "Full refund of amounts paid by CREDIT via CreditLedgerEntry(+paid, TICKET_REFUND)"

  - entity: TradeInAppraisal
    field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: [SUBMITTED, OFFERED, DECLINED]
        to: OFFERED
        trigger: "POST /golf-shop/trade-in-appraisals/{id}/offers"
        actor: "FittingSpecialist or ShopManager"
        preconditions:
          - "OCC: expected_appraisal_version == current version (ERR_STALE_VERSION)"
          - "If basis == MARKET_COMP: market_comps_cents must be present with one entry per club (ERR_VALIDATION)"
        side_effects:
          - "offered_value_cents computed via calculations.tradein_offer_value; a new offer supersedes any prior offer"
          - "offer_expires_at = now + 168h; offer_basis and offered_by_staff_id (X-User-ID) recorded"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /golf-shop/trade-in-appraisals/{id}/accept"
        actor: "Customer (owner)"
        preconditions: []
        side_effects:
          - "CreditLedgerEntry(+offered_value_cents, TRADE_IN_ACCEPT); customer credit_balance_cents recomputed"
          - "UsedClubListing created LISTED with appraised_by_staff_id copied from offered_by_staff_id and list_price_cents = round_half_up(offered_value_cents * 1.4)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /golf-shop/trade-in-appraisals/{id}/decline"
        actor: "Customer (owner)"
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: EXPIRED
        trigger: "system: POST /golf-shop/_clock/set_current_utc sweep when now > offer_expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: UsedClubListing
    field: status
    initial_state: LISTED
    terminal_states: [SOLD]
    transitions:
      - from: LISTED
        to: RESERVED
        trigger: "POST /golf-shop/used-club-listings/{id}/reserve"
        actor: "Customer (any ACTIVE customer)"
        preconditions:
          - "Acting customer status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects:
          - "reserved_by_customer_id = X-User-ID; reserved_until = now + 24h"
      - from: RESERVED
        to: LISTED
        trigger: "system: POST /golf-shop/_clock/set_current_utc sweep when now > reserved_until"
        actor: system
        preconditions: []
        side_effects:
          - "reserved_by_customer_id and reserved_until cleared"
      - from: LISTED
        to: SOLD
        trigger: "POST /golf-shop/used-club-listings/{id}/purchase (direct buy)"
        actor: "Customer (any ACTIVE customer)"
        preconditions:
          - "Acting customer status == ACTIVE (ERR_CUSTOMER_SUSPENDED)"
        side_effects: []
      - from: RESERVED
        to: SOLD
        trigger: "POST /golf-shop/used-club-listings/{id}/purchase by the reserving customer"
        actor: "Customer (the reserved_by customer)"
        preconditions:
          - "reserved_by_customer_id == X-User-ID (ERR_LISTING_RESERVED_BY_OTHER)"
        side_effects: []
      - from: LISTED
        to: LISTED
        trigger: "POST /golf-shop/used-club-listings/{id}/adjust-price"
        actor: ShopManager
        preconditions:
          - "Acting staff member id != appraised_by_staff_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "list_price_cents = new_price_cents"

  - entity: WarrantyClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [RESOLVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /golf-shop/warranty-claims/{id}/decide with decision=APPROVED"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /golf-shop/warranty-claims/{id}/decide with decision=DENIED"
        actor: ShopManager
        preconditions:
          - "denial_reason present when decision == DENIED (ERR_VALIDATION)"
        side_effects:
          - "denial_reason recorded"
      - from: APPROVED
        to: RESOLVED
        trigger: "POST /golf-shop/warranty-claims/{id}/resolve"
        actor: ShopManager
        preconditions: []
        side_effects:
          - "CreditLedgerEntry(+covered_estimate_cents, WARRANTY_RESOLUTION); customer credit_balance_cents recomputed"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /golf-shop/warranty-claims/{id}/appeal"
        actor: "Customer (owner)"
        preconditions:
          - "appeal_count < 2 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "appeal_count += 1; denial_reason cleared"

  - entity: Customer
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /golf-shop/customers/{id}/set-status with target_status=SUSPENDED"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /golf-shop/customers/{id}/set-status with target_status=ACTIVE"
        actor: ShopManager
        preconditions: []
        side_effects: []

  - entity: LaunchMonitorBay
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /golf-shop/launch-monitor-bays/{id}/set-status with target_status=MAINTENANCE"
        actor: ShopManager
        preconditions: []
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /golf-shop/launch-monitor-bays/{id}/set-status with target_status=AVAILABLE"
        actor: ShopManager
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: build-spec-requote-stale
    parent_entity: ClubBuildSpec
    write_endpoint: "POST /golf-shop/build-specs/{id}/quote"
    occ_field: "expected_build_spec_version"
    description: |
      Quoting a ClubBuildSpec whose version has advanced since the client last
      observed it is rejected. A re-quote legitimately supersedes the prior
      quote under product semantics, so the only protection against acting on a
      stale view is the version check; a client carrying an older
      expected_build_spec_version is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appraisal-offer-supersede-stale
    parent_entity: TradeInAppraisal
    write_endpoint: "POST /golf-shop/trade-in-appraisals/{id}/offers"
    occ_field: "expected_appraisal_version"
    description: |
      Issuing an offer on a TradeInAppraisal whose version has advanced since
      the client last observed it is rejected. A new offer legitimately
      supersedes the prior offer (including after a DECLINED), so the version
      check is the only stale-view protection; a client carrying an older
      expected_appraisal_version is rejected with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: build_provisional_quote
    trigger: "POST /golf-shop/build-specs/{id}/quote (initial quote and every re-quote)"
    algorithm: tiered_pricing
    formula: |
      component_msrp_sum = head.msrp_cents + shaft.msrp_cents + grip.msrp_cents
      tier_rate = 0.10 if component_msrp_sum >= TIER2_MIN else (0.05 if component_msrp_sum >= TIER1_MIN else 0)
      loyalty_rate = LOYALTY_RATE if customer.completed_builds_count >= LOYALTY_MIN_BUILDS else 0
      discount_rate = min(tier_rate + loyalty_rate, RATE_CAP)
      discount_cents = round_half_up(component_msrp_sum * discount_rate)
      provisional_quote_cents = component_msrp_sum - discount_cents + labor_cents
    input_set: "Spec's three ComponentItems (any stock state), customer.completed_builds_count at quote time"
    constants:
      TIER1_MIN: 200000
      TIER2_MIN: 500000
      LOYALTY_RATE: 0.05
      LOYALTY_MIN_BUILDS: 2
      RATE_CAP: 0.15
    precision: "integer cents; round_half_up applied exactly once, to the discount"
    variants:
      - name: provisional
        when: "at quote / re-quote time"
        difference: "uses msrp_cents, applies tier+loyalty discount, no fitting rebate"
      - name: final
        when: "at approve time (see calculations.build_final_price)"
        difference: "uses unit_cost_cents and applies the fitting-fee rebate; produces a different total for identical spec inputs"

  - name: build_final_price
    trigger: "POST /golf-shop/build-specs/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
      (1) component_cost_sum = head.unit_cost_cents + shaft.unit_cost_cents + grip.unit_cost_cents
      (2) tier selected on component_cost_sum BEFORE any rebate:
          tier_rate = 0.10 if component_cost_sum >= TIER2_MIN else (0.05 if component_cost_sum >= TIER1_MIN else 0)
      (3) loyalty_rate as in build_provisional_quote; discount_rate = min(tier_rate + loyalty_rate, RATE_CAP)
      (4) discount_cents = round_half_up(component_cost_sum * discount_rate)
      (5) rebate_cents = FITTING_FEE_REBATE if the linked FittingSession status == COMPLETED else 0
      (6) final_price_cents = max(0, component_cost_sum - discount_cents + labor_cents - rebate_cents)
      The rebate never influences tier selection.
    input_set: "Spec's three ComponentItems (unit costs locked at approve instant), linked FittingSession status, customer.completed_builds_count"
    constants:
      TIER1_MIN: 200000
      TIER2_MIN: 500000
      LOYALTY_RATE: 0.05
      LOYALTY_MIN_BUILDS: 2
      RATE_CAP: 0.15
      FITTING_FEE_REBATE: 7500
    precision: "integer cents; round_half_up applied exactly once, to the discount"
    variants:
      - name: final
        when: "at approve"
        difference: "unit-cost basis + rebate; see build_provisional_quote for the paired provisional variant"

  - name: repair_quote
    trigger: "POST /golf-shop/repair-tickets (computed at creation; ticket is born QUOTED)"
    algorithm: tiered_pricing
    formula: |
      base_cents = SERVICE_BASE[service_type]
      rush_fee_cents = 0 if not rush else max(RUSH_MIN_FEE, round_half_up(base_cents * RUSH_RATE))
      quoted_total_cents = base_cents + rush_fee_cents
      promised_at = created_at + (RUSH_HOURS if rush else STANDARD_HOURS)
      deposit_cents = round_half_up(quoted_total_cents * DEPOSIT_RATE)
      balance payment = quoted_total_cents - deposit_cents (remainder keeps cents exact on odd totals)
    input_set: "service_type, rush flag; shaft item price is NOT part of the quote (parts billed separately via stock reservation)"
    constants:
      SERVICE_BASE: { REGRIP: 1800, RESHAFT: 6500, LOFT_LIE_ADJUST: 2500 }
      RUSH_RATE: 0.35
      RUSH_MIN_FEE: 1500
      RUSH_HOURS: 24
      STANDARD_HOURS: 72
      DEPOSIT_RATE: 0.5
    precision: "integer cents; round_half_up"

  - name: tradein_offer_value
    trigger: "POST /golf-shop/trade-in-appraisals/{id}/offers"
    algorithm: weighted_scoring
    formula: |
      GRADE_MATRIX basis (per-line rounding pinned; round each club THEN sum):
        value = SUM over clubs of round_half_up(BOOK_VALUE[club.club_type] * GRADE_MULT[club.condition_grade])
      MARKET_COMP basis (same per-line rounding order):
        value = SUM over i of round_half_up(market_comps_cents[i] * COMP_FACTOR)
      Note: per-line round-then-sum is the pinned order; sum-then-round of the same
      inputs can differ by cents and is NOT the specified behavior.
    input_set: "appraisal.clubs (all clubs regardless of grade); market_comps_cents array for MARKET_COMP"
    constants:
      BOOK_VALUE: { DRIVER: 29999, FAIRWAY: 21999, HYBRID: 17999, IRON_SET: 44999, WEDGE: 8999, PUTTER: 14999 }
      GRADE_MULT: { A: 0.60, B: 0.45, C: 0.30, D: 0.15 }
      COMP_FACTOR: 0.8
    precision: "integer cents; round_half_up per line, then summed"
    variants:
      - name: grade_matrix
        when: "offer basis == GRADE_MATRIX"
        difference: "values clubs from the book-value/grade matrix"
      - name: market_comp
        when: "offer basis == MARKET_COMP"
        difference: "values clubs from staff-supplied comparables; same clubs generally produce a different total than grade_matrix"

  - name: allocation_sweep
    trigger: "ComponentOrder creation (spec approve), POST /golf-shop/component-items/{id}/receive, and any reservation release (spec cancel, ticket cancel)"
    algorithm: waterfall_allocation
    formula: |
      candidate orders = ComponentOrder with status in {PENDING_ALLOCATION, BACKORDERED}
      processing order: created_at ASC; exact created_at ties broken by required_units ASC (never by id)
      for each order in that order:
        for each line: allocatable = min(line required remainder, item.stock_on_hand)
          item.stock_on_hand -= allocatable; item.stock_reserved += allocatable; line.allocated_qty += allocatable
        order -> ALLOCATED if all lines satisfied else BACKORDERED
        on ALLOCATED: parent ClubBuildSpec ORDERED -> IN_BUILD
    input_set: "ComponentOrders in {PENDING_ALLOCATION, BACKORDERED} only; ALLOCATED/CLOSED/CANCELLED orders never re-enter the sweep"
    constants: {}
    precision: "integer units"

  - name: warranty_coverage
    trigger: "POST /golf-shop/warranty-claims (computed at creation)"
    algorithm: threshold
    formula: |
      age_days = floor((now - subject_anchor) / 86400) where subject_anchor is
      spec.delivered_at or ticket.picked_up_at
      BUILD_SPEC subject:   coverage_pct = 100 if age_days <= 90; 50 if age_days <= 365; else claim rejected (ERR_CLAIM_WINDOW_EXPIRED)
      REPAIR_TICKET subject: coverage_pct = 100 if age_days <= 30; else claim rejected (ERR_CLAIM_WINDOW_EXPIRED)
      covered_estimate_cents = round_half_up(subject_price * coverage_pct / 100)
      subject_price = spec.final_price_cents or ticket.quoted_total_cents
      Boundaries are inclusive: age_days == 90 yields 100 for a spec; age_days == 30 yields 100 for a ticket.
    input_set: "the claim's subject (DELIVERED spec or PICKED_UP ticket) and the logical clock"
    constants:
      SPEC_FULL_DAYS: 90
      SPEC_PARTIAL_DAYS: 365
      TICKET_FULL_DAYS: 30
    precision: "integer cents; round_half_up"

  - name: customer_credit_balance
    trigger: "every CreditLedgerEntry write (trade-in accept, CREDIT build payment/refund, CREDIT ticket payment/refund, warranty resolution)"
    algorithm: aggregation
    formula: |
      customer.credit_balance_cents = SUM(amount_cents) over ALL CreditLedgerEntry rows with customer_id = customer.id
      Invariant: balance always equals the ledger sum; no other field ever mutates the balance.
    input_set: "all ledger entries for the customer, no status filter (entries are append-only)"
    constants: {}
    precision: "integer cents"

  - name: session_conflict_checks
    trigger: "POST /golf-shop/fitting-sessions"
    algorithm: interval_merge
    formula: |
      Existing sessions considered: same resource, status in {BOOKED, CHECKED_IN} only.
      Bay rule (buffered half-open): conflict iff NOT( new.ends_at <= exist.starts_at - buffer
        OR new.starts_at >= exist.ends_at + buffer ), buffer = bay.cleanup_buffer_minutes.
        A gap of exactly buffer minutes is allowed.
      Specialist rule (closed interval, no buffer): conflict iff new.starts_at <= exist.ends_at
        AND new.ends_at >= exist.starts_at. Adjacency (end == start) IS a conflict for a specialist.
      Bay conflict is evaluated before specialist conflict.
    input_set: "sessions on the same bay / with the same specialist in {BOOKED, CHECKED_IN}; CANCELLED, NO_SHOW, COMPLETED sessions never conflict"
    constants: {}
    precision: "ISO8601 instants compared exactly"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enum values valid, starts_at < ends_at, xor constraint on warranty subject, market_comps_cents present with one entry per club when basis=MARKET_COMP, denial_reason present when decision=DENIED"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; then body FK ids exist (customer_id, bay_id, specialist_id, lesson_package_id, fitting_session_id, component item ids, shaft_item_id, build_spec_id/repair_ticket_id)"
    error_id: "ERR_CUSTOMER_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_BAY_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_SPEC_NOT_FOUND | ERR_COMPONENT_ITEM_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_APPRAISAL_NOT_FOUND | ERR_LISTING_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 5
    category: auth
    check: "Ownership: for entity-backed actors acting on an owned resource, X-User-ID must match the resource's customer_id (approve/cancel/payments/accept/decline/appeal/reserve/purchase, self-reads); body customer_id on create endpoints must equal X-User-ID when the caller is Customer"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "owner-scoped endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version (quote, offers)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /golf-shop/build-specs/{id}/quote; POST /golf-shop/trade-in-appraisals/{id}/offers"
  - priority: 7
    category: state
    check: "Target entity in a valid from-state for the requested transition (ERR_SPEC_NOT_QUOTED, ERR_SPEC_NOT_IN_BUILD, ERR_SPEC_NOT_READY, ERR_SESSION_NOT_BOOKED, ERR_SESSION_NOT_CHECKED_IN, ERR_TICKET_NOT_QUOTED, ERR_TICKET_NOT_APPROVED, ERR_TICKET_NOT_IN_PROGRESS, ERR_TICKET_NOT_READY, ERR_APPRAISAL_NOT_OFFERED, ERR_LISTING_NOT_LISTED, ERR_CLAIM_NOT_SUBMITTED, ERR_CLAIM_NOT_APPROVED, ERR_CLAIM_NOT_DENIED, ERR_INVALID_STATE_TRANSITION, ERR_SUBJECT_NOT_CLAIMABLE, ERR_PACKAGE_NOT_ACTIVE)"
    error_id: "(per-transition domain errors, see 1.6)"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: the staff member adjusting a listing's price must not be the staff member who appraised it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /golf-shop/used-club-listings/{id}/adjust-price"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: bay buffered overlap (ERR_BAY_TIME_CONFLICT), specialist closed-interval overlap (ERR_SPECIALIST_TIME_CONFLICT), warranty window (ERR_CLAIM_WINDOW_EXPIRED)"
    error_id: "ERR_BAY_TIME_CONFLICT | ERR_SPECIALIST_TIME_CONFLICT | ERR_CLAIM_WINDOW_EXPIRED"
    http_status: "409 | 409 | 422"
    applies_to: "session creation, warranty claim creation"
  - priority: 10
    category: business_fiscal
    check: "Fiscal rules before parts/commitment: customer ACTIVE for spend (ERR_CUSTOMER_SUSPENDED), credit sufficiency (ERR_INSUFFICIENT_CREDIT), lesson credit remaining (ERR_NO_CREDITS_REMAINING), deposit before work (ERR_DEPOSIT_REQUIRED), payment kind sequence (ERR_PAYMENT_SEQUENCE), full payment before pickup (ERR_TICKET_UNPAID)"
    error_id: "ERR_CUSTOMER_SUSPENDED | ERR_INSUFFICIENT_CREDIT | ERR_NO_CREDITS_REMAINING | ERR_DEPOSIT_REQUIRED | ERR_PAYMENT_SEQUENCE | ERR_TICKET_UNPAID"
    http_status: "409 | 402 | 422 | 422 | 409 | 422"
    applies_to: "approve, payments, start-work, pickup, session booking, listing reserve/purchase"
  - priority: 11
    category: business_constraint
    check: "Constraint rules: reshaft requires shaft_item_id with component_type SHAFT (ERR_RESHAFT_REQUIRES_SHAFT_ITEM), spec component types must match their slots (ERR_COMPONENT_TYPE_MISMATCH), shaft stock for start-work (ERR_COMPONENT_SHORTAGE), appeal cap (ERR_APPEAL_LIMIT_REACHED), duplicate open claim on same subject (ERR_DUPLICATE_CLAIM)"
    error_id: "ERR_RESHAFT_REQUIRES_SHAFT_ITEM | ERR_COMPONENT_TYPE_MISMATCH | ERR_COMPONENT_SHORTAGE | ERR_APPEAL_LIMIT_REACHED | ERR_DUPLICATE_CLAIM"
    http_status: "400 | 400 | 409 | 422 | 409"
    applies_to: "ticket creation, spec creation, start-work, appeal, claim creation"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: /golf-shop/customers
    description: "Register a customer"
    roles: [ShopAdmin, ShopManager]
    code: 201
    input: [full_name, email]
    output: Customer
    side_effects: []
  - method: GET
    path: /golf-shop/customers/{id}
    description: "Read a customer including computed credit_balance_cents"
    roles: [ShopAdmin, ShopManager, FittingSpecialist, RepairTechnician, Instructor, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: /golf-shop/customers/{id}/set-status
    description: "Suspend or reactivate a customer"
    roles: [ShopManager]
    code: 200
    input: [target_status]
    output: Customer
    side_effects: ["Customer.status -> target_status; increments Customer.version"]
  # --- Staff ---
  - method: POST
    path: /golf-shop/staff
    description: "Onboard a staff member"
    roles: [ShopAdmin]
    code: 201
    input: [full_name, staff_role]
    output: StaffMember
    side_effects: []
  - method: GET
    path: /golf-shop/staff/{id}
    description: "Read a staff member"
    roles: [ShopAdmin, ShopManager]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  # --- Launch monitor bays ---
  - method: POST
    path: /golf-shop/launch-monitor-bays
    description: "Register a launch-monitor bay"
    roles: [ShopManager, ShopAdmin]
    code: 201
    input: [bay_name, "cleanup_buffer_minutes?"]
    output: LaunchMonitorBay
    side_effects: []
  - method: GET
    path: /golf-shop/launch-monitor-bays/{id}
    description: "Read a bay"
    roles: [ShopAdmin, ShopManager, FittingSpecialist, RepairTechnician, Instructor]
    code: 200
    input: []
    output: LaunchMonitorBay
    side_effects: []
  - method: POST
    path: /golf-shop/launch-monitor-bays/{id}/set-status
    description: "Toggle bay between AVAILABLE and MAINTENANCE"
    roles: [ShopManager]
    code: 200
    input: [target_status]
    output: LaunchMonitorBay
    side_effects: ["LaunchMonitorBay.status -> target_status; increments version"]
  # --- Fitting sessions ---
  - method: POST
    path: /golf-shop/fitting-sessions
    description: "Book a fitting session on a launch-monitor bay, optionally consuming a lesson-package credit"
    roles: [FittingSpecialist, Customer]
    code: 201
    input: [customer_id, bay_id, specialist_id, starts_at, ends_at, "lesson_package_id?"]
    output: FittingSession
    side_effects:
      - "If lesson_package_id present: package must not be EXPIRED (ERR_PACKAGE_NOT_ACTIVE) and credits_used must be < total_credits (ERR_NO_CREDITS_REMAINING); on success credits_used += 1 (package flips ACTIVE -> EXHAUSTED at equality); session.credit_consumed = true"
  - method: GET
    path: /golf-shop/fitting-sessions/{id}
    description: "Read a fitting session"
    roles: [ShopAdmin, ShopManager, FittingSpecialist, RepairTechnician, Instructor, Customer]
    code: 200
    input: []
    output: FittingSession
    side_effects: []
  - method: GET
    path: /golf-shop/fitting-sessions
    description: "List fitting sessions with filters and pagination"
