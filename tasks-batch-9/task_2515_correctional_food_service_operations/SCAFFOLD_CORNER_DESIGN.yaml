          setup:
            - "ACTIVE contract CFS-2515-E13, Facility FAC-E13, ACTIVE cycle, LOCKED LUNCH forecast and one OPEN MealServiceRecord."
            - "One ACTIVE RELIGIOUS diet order, and a DIET_NOT_HONORED grievance filed at 2026-08-01T00:00:00Z naming both, routed to DIET_REVIEW and closed with finding KITCHEN_AT_FAULT."
