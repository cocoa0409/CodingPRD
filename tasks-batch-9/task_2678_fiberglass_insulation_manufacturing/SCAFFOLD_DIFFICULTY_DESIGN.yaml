# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2678 · Fiberglass Insulation Manufacturing
#
# Nine §0.5 Difficulty Rules × 2 differentiated instances = 18 instances.
# Every numeric literal in every `assert:` was computed by executing the
# corresponding §1.3 formula against its `constants:` block.
#
# Shared fixture literals reused across instances (all pinned, never placeholders):
#   PROGRAM RCERT-PS  PER_SPECIMEN, r_value_tolerance 0.30, min_specimen_count 3,
#                     max_concurrent_lab_tests 2, retest_limit 2, derate_allowed true
#   PROGRAM RCERT-LM  LOT_MEAN, same tolerance/specimen/retest, concurrency 1
#   PLANT   NWK       4 oven zones, 120 ft oven, 2 forming lines,
#                     max_cullet_fraction 0.30, cullet_restrict_fraction 0.28,
#                     max_width_change_in 8.0, formaldehyde_allowance_kg 0.200,
#                     voc_allowance_kg 12.0
#   BINDER  BF-FREE-1 formaldehyde-free, ppm 0, voc 3.2, cure 420F / 150s
#   BINDER  BF-PHEN-1 phenolic, ppm 250, voc 4.1, cure 430F / 160s
#   SKU     PL-A "R13-15-UF"   BATT 0.80 pcf UNFACED 15 in, R13.0, bag 88.0 sqft,
#                              bale 21.0 ft3 / 12.5 kg, CR 6.0, 34.5 kg/min
#   SKU     PL-B "R19-23-KR"   BATT 1.20 pcf KRAFT 23 in, R19.0, bag 49.0 sqft,
#                              bale 25.5 ft3 / 15.0 kg, CR 5.0, 41.0 kg/min
#   SKU     PL-C "R13-16-UF-LM" as PL-A but 16 in and on RCERT-LM
#   SKU     PL-E "R30-24-FSK"  BATT 2.00 pcf FSK 24 in, R30.0, bag 32.0 sqft,
#                              bale 30.0 ft3 / 18.0 kg, CR 6.0, 45.0 kg/min
#   SKU     PL-D "R19-23-KR-PH" as PL-B but on the phenolic binder BF-PHEN-1
#   SKU     PL-F "R13-15-UF-DR" as PL-A but on the never-submitted DRAFT binder
#   A run at target_pull_kg 9200 always yields total_charge_kg 10000.00 and
#   allowed_cullet_kg 3000.00; 120 bags of PL-A is produced_sqft 10560.00.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: changeover_scrap_provisional_versus_reconciled_on_same_event
        grounds:
          - calculations.changeover_scrap_accounting
          - state_machines.ChangeoverEvent.null_to_OPEN
          - state_machines.ChangeoverEvent.OPEN_to_CLOSED
          - entities.ChangeoverEvent.fields.provisional_scrap_kg
          - entities.ChangeoverEvent.fields.reconciled_scrap_kg
          - entities.ChangeoverEvent.fields.scrap_variance_kg
        distinguishing_aspect: |
          Both variants run against ONE ChangeoverEvent row in the ProductionRun /
          ChangeoverEvent manufacturing domain: PROVISIONAL is a time-based purge
          estimate fixed at creation (1897.50 kg) and RECONCILED is the scale-based
          net loss fixed at close (243.00 kg), so the same row carries a
          scrap_variance_kg of -277.50 and the outgoing run's changeover_scrap_kg is
          overwritten from 1897.50 to 243.00.
        test_recipe:
          setup:
            - "Plant NWK exists with 4 oven zones, a 120 ft oven, 2 forming lines and max_width_change_in 8.0."
            - "Binder BF-FREE-1 is CERTIFIED; SKUs PL-A (0.80 pcf, UNFACED, 15 in, 34.5 kg/min) and PL-B (1.20 pcf, KRAFT, 23 in) both exist on it."
            - "Run RUN-A on line 1 for PL-A occupies [2026-08-03T06:00:00Z, 2026-08-03T14:00:00Z) and has reached PACKAGED."
            - "Run RUN-B on line 1 for PL-B is SCHEDULED for [2026-08-03T15:00:00Z, 2026-08-03T23:00:00Z)."
            - "The logical clock reads 2026-08-03T16:00:00Z, i.e. past the changeover window end, so the event may be closed."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /product-lines"
              payload: { sku: "R19-23-KR", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 1.20, facing_type: "KRAFT", width_in: 23, thickness_in: 6.25, declared_r_value: 19.0, bag_sqft: 49.0, bale_volume_ft3: 25.5, bale_mass_kg: 15.0, mass_rate_kg_per_min: 41.0, compression_ratio: 5.0 }
              as: CorporateOps
              captures: { pl_b: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_a: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_b}", line_index: 1, scheduled_start: "2026-08-03T15:00:00Z", scheduled_end: "2026-08-03T23:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [480, 480, 480, 480] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_b: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
            - call: "POST /production-runs/${run_a}/start-melt"
              payload: { cullet_batch_ids: [] }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/start-cure"
              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/package"
              payload: { bags_produced: 120 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: CorporateOps
          trigger:
            - call: "POST /changeover-events"
              payload: { plant_id: "${plant_id}", outgoing_run_id: "${run_a}", incoming_run_id: "${run_b}", line_index: 1, window_start: "2026-08-03T14:00:00Z", window_end: "2026-08-03T15:00:00Z" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { chg_1: "$.data.id", prov: "$.data.provisional_scrap_kg" }
            - call: "POST /changeover-events/${chg_1}/close"
              payload: { weighed_trim_kg: 1620.00, recovered_cullet_kg: 1377.00 }
              as: PlantOperator
              as_user_id: "${plant_id}"
          assert:
            - "ChangeoverEvent.${chg_1}.density_delta_pct == 50.00"
            - "ChangeoverEvent.${chg_1}.purge_minutes == 55.00"
            - "ChangeoverEvent.${chg_1}.provisional_scrap_kg == 1897.50 (PROVISIONAL variant: 12 + min(20, 50.00*0.40) + 8 + 15 = 55.00 min × 34.5 kg/min)"
            - "ChangeoverEvent.${chg_1}.facing_changed == true and from_width_in == 15 and to_width_in == 23"
            - "ChangeoverEvent.${chg_1}.reconciled_scrap_kg == 243.00 (RECONCILED variant: 1620.00 - 1377.00)"
            - "ChangeoverEvent.${chg_1}.scrap_variance_kg == -277.50 (1620.00 - 1897.50)"
            - "ChangeoverEvent.${chg_1}.reconciled_scrap_kg != ChangeoverEvent.${chg_1}.provisional_scrap_kg"
            - "ProductionRun.${run_a}.changeover_scrap_kg == 243.00, overwritten from the 1897.50 booked at creation"
            - "ChangeoverEvent.${chg_1}.status == CLOSED"
            - "exactly one CulletBatch exists with plant_id ${plant_id}, source_run_id ${run_a}, source_type CHANGEOVER_SCRAP, status STAGED and mass_kg == 1377.00"
            - "Plant.${plant_id}.cullet_received_kg_ytd == 1377.00 and Plant.${plant_id}.cullet_on_hand_kg == 1377.00"

      - name: thermal_verdict_per_specimen_versus_lot_mean_on_identical_specimens
        grounds:
          - calculations.thermal_conformance_verdict
          - entities.CertificationProgram.fields.conformance_basis
          - entities.ThermalTest.fields.conformance_basis
          - entities.ThermalTest.fields.conformance_verdict
          - state_machines.ThermalTest.IN_LAB_to_COMPLETED
        distinguishing_aspect: |
          This pair lives in the certification/quality domain rather than the
          manufacturing-scrap domain of the other dual_variant_calc instance, and its
          divergence is categorical rather than numeric: the identical specimen array
          [12.70, 13.10, 12.40] against the identical declared R-13.0 and identical
          0.30 tolerance yields conformance_verdict NONCONFORMING under PER_SPECIMEN
          (min 12.40 < 12.70) and CONFORMING under LOT_MEAN (mean 12.73 >= 12.70).
        test_recipe:
          setup:
            - "Two certification programs exist with identical tolerance 0.30 and min_specimen_count 3, differing only in conformance_basis: RCERT-PS is PER_SPECIMEN, RCERT-LM is LOT_MEAN."
            - "Plant NWK has 2 forming lines; binder BF-FREE-1 is CERTIFIED."
            - "SKU PL-A (declared_r_value 13.0) is on RCERT-PS; SKU PL-C is identical except width_in 16 and program RCERT-LM."
            - "Run RUN-A (PL-A, line 1) and run RUN-C (PL-C, line 2) have both reached CURING, so each has qc_status UNSAMPLED."
            - "One ThermalTest is IN_LAB on each run, each pinning its program's basis and declared_r_value_at_test 13.0."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /certification-programs"
              payload: { code: "RCERT-LM", conformance_basis: "LOT_MEAN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 1, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_lm: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /product-lines"
              payload: { sku: "R13-16-UF-LM", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_lm}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 16, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_c: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_a: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_c}", line_index: 2, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_c: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
            - call: "POST /production-runs/${run_a}/start-melt"
              payload: { cullet_batch_ids: [] }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_a}/start-cure"
              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_c}/start-melt"
              payload: { cullet_batch_ids: [] }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /production-runs/${run_c}/start-cure"
              payload: { avg_zone_temp_f: 470.0, line_speed_fpm: 40.0, binder_applied_kg: 900.0 }
              as: PlantOperator
              as_user_id: "${plant_id}"
            - call: "POST /thermal-tests"
              payload: { production_run_id: "${run_a}", product_line_id: "${pl_a}", certification_program_id: "${prog_ps}", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T12:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-2"
              captures: { test_ps: "$.data.id" }
            - call: "POST /thermal-tests"
              payload: { production_run_id: "${run_c}", product_line_id: "${pl_c}", certification_program_id: "${prog_lm}", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T12:00:00Z" }
              as: QualityEngineer
              as_user_id: "qe-2"
              captures: { test_lm: "$.data.id" }
            - call: "POST /thermal-tests/${test_ps}/start-lab"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /thermal-tests/${test_lm}/start-lab"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
          trigger:
            - call: "POST /thermal-tests/${test_ps}/record-result"
              payload: { specimen_r_values: [12.70, 13.10, 12.40] }
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /thermal-tests/${test_lm}/record-result"
              payload: { specimen_r_values: [12.70, 13.10, 12.40] }
              as: QualityEngineer
              as_user_id: "qe-2"
          assert:
            - "ThermalTest.${test_ps}.conformance_basis == PER_SPECIMEN and ThermalTest.${test_lm}.conformance_basis == LOT_MEAN"
            - "ThermalTest.${test_ps}.declared_r_value_at_test == 13.0 and ThermalTest.${test_lm}.declared_r_value_at_test == 13.0"
            - "ThermalTest.${test_ps}.specimen_count == 3 and ThermalTest.${test_ps}.mean_r_value == 12.73 and ThermalTest.${test_ps}.min_r_value == 12.40"
            - "ThermalTest.${test_lm}.specimen_count == 3 and ThermalTest.${test_lm}.mean_r_value == 12.73 and ThermalTest.${test_lm}.min_r_value == 12.40"
            - "ThermalTest.${test_ps}.conformance_verdict == NONCONFORMING (PER_SPECIMEN: min 12.40 < floor 12.70)"
            - "ThermalTest.${test_lm}.conformance_verdict == CONFORMING (LOT_MEAN: mean 12.73 >= floor 12.70)"
            - "ThermalTest.${test_ps}.conformance_verdict != ThermalTest.${test_lm}.conformance_verdict on byte-identical specimen_r_values"
            - "ThermalTest.${test_ps}.status == COMPLETED and ThermalTest.${test_lm}.status == COMPLETED"
            - "ProductionRun.${run_a}.qc_status == NONCONFORMING and ProductionRun.${run_c}.qc_status == CONFORMING"

  - rule_id: combinatorial_formula
    instances:
      - name: packaging_economics_nested_min_max_with_dual_truck_limits
        grounds:
          - calculations.packaging_compression_economics
          - entities.ProductLine.fields.recovered_thickness_pct
          - entities.ProductLine.fields.compressed_bale_volume_ft3
          - entities.ProductLine.fields.bales_per_truck
          - entities.ProductLine.fields.freight_cost_per_sqft
          - entities.ProductLine.fields.recovery_penalty_per_sqft
          - entities.ProductLine.fields.net_landed_cost_per_sqft
        distinguishing_aspect: |
          §0.5 mode (a): six chained outputs from five independent inputs
          (compression_ratio, bale_volume_ft3, bale_mass_kg, bag_sqft, facing_type)
          combined through a conditional facing branch, a max() recovery floor, a
          min() over TWO independent truck limits (cube 3800 ft3 vs payload 19500 kg)
          and a max() shortfall clamp — so the same compression ratio produces
          different binding limits and different net costs on an UNFACED versus a
          FACED SKU, and pushing PL-B to ratio 8.0 activates BOTH the 80.00 recovery
          floor and the cube limit at once (0.059982 USD/sqft).
        test_recipe:
          setup:
            - "Certification program RCERT-PS and plant NWK exist; binder BF-FREE-1 is CERTIFIED."
            - "SKU PL-A is UNFACED with compression_ratio 6.0, bale_volume_ft3 21.0, bale_mass_kg 12.5 and bag_sqft 88.0."
            - "SKU PL-B is KRAFT-faced with compression_ratio 5.0, bale_volume_ft3 25.5, bale_mass_kg 15.0 and bag_sqft 49.0."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /product-lines"
