scenario: |
  Stationery & Custom-Invitation Shop: catalog & customization (proof), event
  package (wedding/announcement) & quantity-tier, proof approval & revision,
  paper/finish & lead time, addressing/assembly add-on, rush, reorder, deposit.

domain_name: stationery-invitation-shop
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - version_pinning_on_approval

  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential          # Order.prior_order_id -> Order.id (reorder chain)
    - cross_aggregate           # Design references catalog aggregates

  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1  Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email,                 type: string,   source: input,    description: "Contact email (unique)" }
      - { name: full_name,             type: string,   source: input,    description: "Customer full name" }
      - { name: phone,                 type: string,   source: input,    description: "Contact phone" }
      - { name: credit_balance_cents,  type: integer,  source: computed, description: "Shop store-credit balance in cents; increased by cancellation refunds", default: 0 }
      - { name: cumulative_deposits_paid_cents, type: integer, source: computed, description: "Running total of deposit dollars this customer has funded via /_payments/simulate across all their orders (never decremented on refund; refunds move value into credit_balance_cents instead)", default: 0 }

  - name: Designer
    parent: null
    common_fields: true
    fields:
      - { name: full_name,       type: string,  source: input,    description: "Designer full name" }
      - { name: active,          type: boolean, source: input,    description: "Whether designer is currently accepting work", default: true }

  - name: PaperStock
    parent: null
    common_fields: true
    fields:
      - { name: name,             type: string,  source: input,    description: "Human-readable name (e.g., 'Ivory Cotton 220gsm')" }
      - { name: base_price_cents, type: integer, source: input,    description: "Per-unit paper cost in cents; MUST be > 0" }
      - { name: lead_days,        type: integer, source: input,    description: "Number of business days needed to source the paper" }
      - { name: status,           type: enum,    source: input,    description: "Lifecycle status of the paper stock", constraints: "one of {ACTIVE, DISCONTINUED}", default: "ACTIVE" }
      - { name: reserved_units,   type: integer, source: computed, description: "Aggregate of LineItem.quantity across all LineItems whose Order.status is in {DEPOSIT_PENDING, IN_PRODUCTION, READY_TO_SHIP}", default: 0 }

  - name: FinishOption
    parent: null
    common_fields: true
    fields:
      - { name: name,                  type: string,  source: input, description: "Finish name (e.g., 'Gold Foil')" }
      - { name: surcharge_cents,       type: integer, source: input, description: "Per-unit finish surcharge in cents; MUST be >= 0" }
      - { name: additional_lead_days,  type: integer, source: input, description: "Extra business days added to a design that uses this finish; MUST be >= 0" }
      - { name: status,                type: enum,    source: input, description: "Lifecycle status", constraints: "one of {ACTIVE, DISCONTINUED}", default: "ACTIVE" }

  - name: EventPackage
    parent: null
    common_fields: true
    fields:
      - { name: name,               type: string,  source: input, description: "Package name (e.g., 'Wedding Suite Std')" }
      - { name: package_type,       type: enum,    source: input, description: "Event category", constraints: "one of {WEDDING, ANNOUNCEMENT, CUSTOM}" }
      - { name: deposit_pct,        type: number,  source: input, description: "Fraction of (subtotal - reorder_discount) held as deposit; range (0.0, 1.0]" }
      - { name: min_qty,            type: integer, source: input, description: "Minimum required quantity per LineItem; MUST be >= 1" }
      - { name: proof_expiry_days,  type: integer, source: input, description: "Standard number of days a submitted proof remains valid before auto-expiry; MUST be >= 1" }
      - { name: status,             type: enum,    source: input, description: "Lifecycle status", constraints: "one of {ACTIVE, DISCONTINUED}", default: "ACTIVE" }

  - name: Design
    parent: null
    common_fields: true
    fields:
      - { name: customer_id,        type: string,  source: input,    description: "FK -> Customer.id; owner of this design" }
      - { name: designer_id,        type: string,  source: computed, description: "FK -> Designer.id; set on first proof creation, nullable while DRAFT" }
      - { name: event_package_id,   type: string,  source: input,    description: "FK -> EventPackage.id; drives min_qty, deposit_pct, and proof expiry" }
      - { name: paper_stock_id,     type: string,  source: input,    description: "FK -> PaperStock.id; must be ACTIVE at design creation" }
      - { name: finish_option_id,   type: string,  source: input,    description: "FK -> FinishOption.id; must be ACTIVE at design creation" }
      - { name: notes,              type: string,  source: input,    description: "Free-text customer instructions", default: "" }
      - { name: status,             type: enum,    source: computed, description: "Compound state derived from associated Proof / Order lifecycle", constraints: "one of {DRAFT, PROOFING, APPROVED, ARCHIVED}", default: "DRAFT" }

  - name: Proof
    parent: null
    common_fields: true
    fields:
      - { name: design_id,             type: string,   source: input,    description: "FK -> Design.id" }
      - { name: designer_id,           type: string,   source: input,    description: "FK -> Designer.id; the designer who owns this proof workflow" }
      - { name: current_revision_number, type: integer, source: computed, description: "1-indexed count of submissions; increments on each POST /proofs/{id}/submit", default: 0 }
      - { name: revision_fee_cents,    type: integer,  source: computed, description: "Accumulated revision fees in cents (first 3 submissions free; each additional submission adds 2500)", default: 0 }
      - { name: submitted_at,          type: datetime, source: computed, description: "Timestamp of the most recent transition into SUBMITTED (null while DRAFT / CHANGES_REQUESTED)" }
      - { name: expires_at,            type: datetime, source: computed, description: "Auto-expiry deadline; see calculations.proof_expires_at" }
      - { name: approved_at,           type: datetime, source: computed, description: "Timestamp customer approved this proof; null while not APPROVED" }
      - { name: status,                type: enum,     source: computed, description: "Proof workflow state", constraints: "one of {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED, EXPIRED, CANCELLED}", default: "DRAFT" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id,           type: string,   source: input,    description: "FK -> Customer.id; the order owner" }
      - { name: design_id,             type: string,   source: input,    description: "FK -> Design.id; the design being manufactured" }
      - { name: proof_id,              type: string,   source: computed, description: "FK -> Proof.id; set at POST /orders/{id}/confirm (nullable while CART)" }
      - { name: event_package_id,      type: string,   source: computed, description: "FK -> EventPackage.id; snapshotted from Design at order creation" }
      - { name: prior_order_id,        type: string,   source: input,    description: "FK -> Order.id; optional reorder parent (must be in DELIVERED status and same customer)", default: null }
      - { name: rush_requested,        type: boolean,  source: computed, description: "True once POST /orders/{id}/apply-rush succeeds", default: false }
      - { name: rush_deadline,         type: datetime, source: input,    description: "Client-supplied ship-by deadline used to compute rush eligibility (nullable until rush is applied)" }
      - { name: subtotal_cents,        type: integer,  source: computed, description: "Sum of LineItem.line_price_cents (per-line rounded); see calculations.order_subtotal_cents", default: 0 }
      - { name: reorder_discount_cents,type: integer,  source: computed, description: "10% off subtotal if within 365-day reorder window; see calculations.reorder_discount_cents", default: 0 }
      - { name: rush_surcharge_cents,  type: integer,  source: computed, description: "Rush multiplier applied at apply-rush time; see calculations.rush_surcharge_cents", default: 0 }
      - { name: total_cents,           type: integer,  source: computed, description: "subtotal_cents - reorder_discount_cents + rush_surcharge_cents (recomputed on every mutation to line items / rush / reorder)", default: 0 }
      - { name: deposit_due_cents,     type: integer,  source: computed, description: "Locked at POST /orders/{id}/confirm; see calculations.deposit_due_cents", default: 0 }
      - { name: deposit_paid_cents,    type: integer,  source: computed, description: "Cash received against the deposit (bumped by /_payments/simulate); goes to 0 on cancellation refund", default: 0 }
      - { name: deposit_paid_at,       type: datetime, source: computed, description: "Timestamp deposit was fully paid; null until paid" }
      - { name: balance_due_cents,     type: integer,  source: computed, description: "max(0, total_cents - deposit_paid_cents); final due at ship", default: 0 }
      - { name: expected_lead_days,    type: integer,  source: computed, description: "Total lead time computed from paper + finish + addressing; see calculations.expected_lead_days", default: 0 }
      - { name: status,                type: enum,     source: computed, description: "Order lifecycle", constraints: "one of {CART, DEPOSIT_PENDING, IN_PRODUCTION, READY_TO_SHIP, SHIPPED, DELIVERED, CANCELLED}", default: "CART" }

  - name: LineItem
    parent: null
    common_fields: true
    fields:
      - { name: order_id,                        type: string,  source: input,    description: "FK -> Order.id; parent order" }
      - { name: paper_stock_id,                  type: string,  source: input,    description: "FK -> PaperStock.id; must be ACTIVE (unless this line is being carried forward on a reorder)" }
      - { name: finish_option_id,                type: string,  source: input,    description: "FK -> FinishOption.id; must be ACTIVE (same reorder exception)" }
      - { name: quantity,                        type: integer, source: input,    description: "Number of units to print; MUST be >= parent Order's event_package.min_qty" }
      - { name: captured_base_price_cents,       type: integer, source: computed, description: "Snapshot of PaperStock.base_price_cents at line-item creation (used by reorder-locked variant)" }
      - { name: captured_finish_surcharge_cents, type: integer, source: computed, description: "Snapshot of FinishOption.surcharge_cents at line-item creation" }
      - { name: line_price_cents,                type: integer, source: computed, description: "Per-line price in cents; see calculations.line_item_price_cents" }

  - name: AddressingJob
    parent: null
    common_fields: true
    fields:
      - { name: order_id,        type: string,   source: input,    description: "FK -> Order.id; parent order this job belongs to" }
      - { name: job_type,        type: enum,     source: input,    description: "Add-on category", constraints: "one of {ADDRESSING, ASSEMBLY}" }
      - { name: quantity,        type: integer,  source: input,    description: "Envelopes/pieces to address or assemble; MUST be >= 1" }
      - { name: scheduled_date,  type: string,   source: input,    description: "ISO 8601 date (YYYY-MM-DD) the job is scheduled to run" }
      - { name: unit_price_cents,type: integer,  source: input,    description: "Per-unit price for this add-on; MUST be > 0" }
      - { name: status,          type: enum,     source: computed, description: "Set by WorkOrder addressing-dim transitions on parent order", constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}", default: "SCHEDULED" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_id,              type: string,   source: input,    description: "FK -> Order.id; created by cascade at Order confirm+proof-approve" }
      - { name: press_id,              type: string,   source: input,    description: "Identifier of the physical press to run this job on" }
      - { name: press_slot_start,      type: datetime, source: input,    description: "Closed-interval start of the reserved press window" }
      - { name: press_slot_end,        type: datetime, source: input,    description: "Closed-interval end of the reserved press window (inclusive); MUST be > press_slot_start" }
      - { name: production_status,     type: enum,     source: computed, description: "Production dimension", constraints: "one of {NOT_STARTED, PRINTING, FINISHING, COMPLETED}", default: "NOT_STARTED" }
      - { name: addressing_status,     type: enum,     source: computed, description: "Addressing dimension (independent of production_status)", constraints: "one of {NOT_APPLICABLE, PENDING, IN_PROGRESS, COMPLETED}", default: "NOT_APPLICABLE" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id,        type: string,   source: input,    description: "FK -> Order.id; created by cascade when parent WorkOrder reaches COMPLETED on both dimensions" }
      - { name: tracking_number, type: string,   source: computed, description: "Server-minted tracking id" }
      - { name: dispatched_at,   type: datetime, source: computed, description: "Time the shipment was dispatched" }
      - { name: delivered_at,    type: datetime, source: computed, description: "Time the shipment was marked delivered" }
      - { name: status,          type: enum,     source: computed, description: "Shipment lifecycle", constraints: "one of {PREPARING, DISPATCHED, DELIVERED, CANCELLED}", default: "PREPARING" }

# ---------------------------------------------------------------------------
# §1.2  State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Proof
    initial_state: DRAFT
    terminal_states: [APPROVED, EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /proofs/{id}/submit"
        actor: Designer
        preconditions:
          - "Design.status == PROOFING (i.e., parent order past CART)"
          - "acting Designer.id == Proof.designer_id"
        side_effects:
          - "Proof.current_revision_number += 1"
          - "Proof.submitted_at = current_utc"
          - "Proof.expires_at = calculations.proof_expires_at result"
          - "Order.expected_lead_days recomputed (idempotent)"
        note: "First submission: revision_number becomes 1; no revision fee yet."

      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /proofs/{id}/request-changes"
        actor: Customer
        preconditions:
          - "acting Customer.id == Design.customer_id"
          - "current_utc <= Proof.expires_at"
        side_effects:
          - "Proof.submitted_at = null"

      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /proofs/{id}/submit"
        actor: Designer
        preconditions:
          - "acting Designer.id == Proof.designer_id"
        side_effects:
          - "Proof.current_revision_number += 1"
          - "Proof.submitted_at = current_utc"
          - "Proof.expires_at recomputed"
          - "if current_revision_number > 3: Proof.revision_fee_cents += 2500 AND Order.total_cents recomputed"
        note: "Cycle: CHANGES_REQUESTED -> SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED ..."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: Customer
        preconditions:
          - "acting Customer.id == Design.customer_id"
          - "current_utc <= Proof.expires_at"
        side_effects:
          - "Proof.approved_at = current_utc"
          - "Design.status = APPROVED"
          - "If Order.deposit_paid_at is not null: Order auto-transitions DEPOSIT_PENDING -> IN_PRODUCTION (see Order state machine)"

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system: current_utc > Proof.expires_at observed on read"
        actor: system
        preconditions:
          - "current_utc > Proof.expires_at"
        side_effects:
          - "Order auto-transitions to CANCELLED (see Order state machine); Design.status = ARCHIVED"

      - from: DRAFT
        to: CANCELLED
        trigger: "cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: []
        side_effects: []

      - from: CHANGES_REQUESTED
        to: CANCELLED
        trigger: "cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: CART
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: CART
        to: DEPOSIT_PENDING
        trigger: "POST /orders/{id}/confirm"
        actor: Customer
        preconditions:
          - "acting Customer.id == Order.customer_id"
          - "at least one LineItem exists"
          - "every LineItem.quantity >= Order.event_package.min_qty"
          - "PaperStock.status == ACTIVE for every LineItem (unless this order has a prior_order_id; then discontinued is tolerated for a reorder)"
          - "FinishOption.status == ACTIVE for every LineItem (same reorder exception)"
        side_effects:
          - "Order.subtotal_cents, Order.reorder_discount_cents, Order.total_cents, Order.deposit_due_cents recomputed"
          - "Proof entity created with status=DRAFT, designer_id=null (assigned on first POST /designs/{id}/proofs)"
          - "Design.status = PROOFING"
          - "For each LineItem: PaperStock.reserved_units += LineItem.quantity"

      - from: DEPOSIT_PENDING
        to: IN_PRODUCTION
        trigger: "system: fired at whichever of POST /orders/{id}/pay-deposit or POST /proofs/{id}/approve completes second (Proof.status == APPROVED AND Order.deposit_paid_at is not null)"
        actor: system
        preconditions:
          - "Proof.status == APPROVED"
          - "Order.deposit_paid_at is not null"
        side_effects:
          - "WorkOrder created with production_status=NOT_STARTED and addressing_status = (NOT_APPLICABLE if no AddressingJobs exist, else PENDING)"

      - from: IN_PRODUCTION
        to: READY_TO_SHIP
        trigger: "system: fired when parent WorkOrder reaches production_status=COMPLETED AND addressing_status in {NOT_APPLICABLE, COMPLETED}"
        actor: system
        preconditions:
          - "WorkOrder.production_status == COMPLETED"
          - "WorkOrder.addressing_status in {NOT_APPLICABLE, COMPLETED}"
        side_effects:
          - "Shipment created with status=PREPARING and server-minted tracking_number"

      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /shipments/{id}/dispatch"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "Shipment.status = DISPATCHED; Shipment.dispatched_at = current_utc"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /shipments/{id}/mark-delivered"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "Shipment.status = DELIVERED; Shipment.delivered_at = current_utc"
          - "Design.status = ARCHIVED"
          - "Customer.cumulative_deposits_paid_cents is retained (never decremented on this transition)"
          - "For each LineItem: PaperStock.reserved_units -= LineItem.quantity"
          - "Order.balance_due_cents unchanged (final invoice out of band)"

      - from: CART
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "acting role is Customer AND Customer.id == Order.customer_id, OR acting role is ShopAdmin"
        side_effects:
          - "AddressingJobs on this order (if any) -> CANCELLED"

      - from: DEPOSIT_PENDING
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "acting role is Customer AND Customer.id == Order.customer_id, OR acting role is ShopAdmin"
        side_effects:
          - "Proof cascaded to CANCELLED (see Proof cascade transitions)"
          - "If Order.deposit_paid_cents > 0: Customer.credit_balance_cents += Order.deposit_paid_cents AND Order.deposit_paid_cents = 0 (cash-conservation invariant, see calculations.cash_conservation_invariant)"
          - "For each LineItem: PaperStock.reserved_units -= LineItem.quantity"
          - "AddressingJobs on this order -> CANCELLED"

      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: ShopAdmin
        preconditions:
          - "acting role is ShopAdmin (Customer cannot cancel from IN_PRODUCTION)"
        side_effects:
          - "WorkOrder cancelled; Shipment (if created) -> CANCELLED"
          - "Design.status = ARCHIVED"
          - "Deposit forfeited (Order.deposit_paid_cents retained on Order; NOT refunded to credit_balance)"
          - "For each LineItem: PaperStock.reserved_units -= LineItem.quantity"

  - entity: WorkOrder
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED]
    note: |
      WorkOrder has two INDEPENDENT (parallel) state dimensions: production_status and
      addressing_status. Each mutation endpoint advances exactly one dimension. The parent
      Order's IN_PRODUCTION -> READY_TO_SHIP transition fires only when BOTH dimensions
      reach a completion state.
    transitions:
      - from: "production_status:NOT_STARTED"
        to: "production_status:PRINTING"
        trigger: "POST /work-orders/{id}/production with new_status=PRINTING"
        actor: ShopAdmin
        preconditions:
          - "parent Order.status == IN_PRODUCTION"
          - "no other WorkOrder on the same press_id has an overlapping [press_slot_start, press_slot_end] closed interval (adjacency at the boundary is also rejected)"
        side_effects: []

      - from: "production_status:PRINTING"
        to: "production_status:FINISHING"
        trigger: "POST /work-orders/{id}/production with new_status=FINISHING"
        actor: ShopAdmin
        preconditions: []
        side_effects: []

      - from: "production_status:FINISHING"
        to: "production_status:COMPLETED"
        trigger: "POST /work-orders/{id}/production with new_status=COMPLETED"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "If addressing_status is in {NOT_APPLICABLE, COMPLETED}: Order auto-transitions IN_PRODUCTION -> READY_TO_SHIP (spawns Shipment)"

      - from: "addressing_status:PENDING"
        to: "addressing_status:IN_PROGRESS"
        trigger: "POST /work-orders/{id}/addressing with new_status=IN_PROGRESS"
        actor: ShopAdmin
        preconditions:
          - "parent Order has at least one AddressingJob"
          - "aggregate: sum of AddressingJob.quantity across ALL AddressingJobs whose scheduled_date == today AND whose parent Order's WorkOrder.addressing_status ∈ {IN_PROGRESS} MUST NOT exceed the daily capacity constant (500)"
        side_effects:
          - "All AddressingJobs on this order -> IN_PROGRESS"

      - from: "addressing_status:IN_PROGRESS"
        to: "addressing_status:COMPLETED"
        trigger: "POST /work-orders/{id}/addressing with new_status=COMPLETED"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "All AddressingJobs on this order -> COMPLETED"
          - "If production_status == COMPLETED: Order auto-transitions IN_PRODUCTION -> READY_TO_SHIP (spawns Shipment)"

  - entity: Shipment
    initial_state: PREPARING
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PREPARING
        to: DISPATCHED
        trigger: "POST /shipments/{id}/dispatch"
        actor: ShopAdmin
        preconditions:
          - "parent WorkOrder.production_status == COMPLETED"
          - "parent WorkOrder.addressing_status in {NOT_APPLICABLE, COMPLETED}"
        side_effects:
          - "Order.status = SHIPPED; Shipment.dispatched_at = current_utc"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /shipments/{id}/mark-delivered"
        actor: ShopAdmin
        preconditions: []
        side_effects:
          - "Order.status = DELIVERED; Design.status = ARCHIVED"
          - "For each LineItem: PaperStock.reserved_units -= LineItem.quantity"

      - from: PREPARING
        to: CANCELLED
        trigger: "cascade from POST /orders/{id}/cancel while Order.status == IN_PRODUCTION or READY_TO_SHIP"
        actor: system
        preconditions: []
        side_effects: []

# ---------------------------------------------------------------------------
# §1.2.1  Concurrency Rules  (OCC on parent version; single true race)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: line-item-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/line-items"
    occ_field: "expected_order_version"
    description: |
      Adding a LineItem to an Order whose version has advanced since the
      client last observed it is rejected. This captures the case where
      another writer has just added, removed, or repriced a line item on
      the same order (each of which legitimately supersedes the current
      writer's view of the line-item set on which its quantity decision
      was based). The stale request is rejected on the version compare;
      the client re-reads and retries against the fresh version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3  Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: line_item_price_cents
    trigger: "on POST /orders/{id}/line-items (after captured_* snapshot); on POST /orders/{id}/confirm recompute; on reorder-lock switch"
    algorithm: tiered_pricing
    formula: |
      # Rule 2 mode (a): 3+ inputs, non-linear (tier selection is a branch on quantity).
      # tier_multiplier is chosen from QUANTITY_TIERS by the smallest tier whose min <= qty <= max.
      # Uses captured_base_price_cents and captured_finish_surcharge_cents (which are set at line-item
      # creation) unless the order is a REORDER, in which case the previous order's captured values
      # for the equivalent line are used (see variants).
      def line_item_price(qty, captured_base, captured_finish):
          tier_multiplier = pick_tier(qty)            # 1.00 / 0.90 / 0.80 / 0.70
          paper_component = round_half_up(captured_base * qty * tier_multiplier)
          finish_component = captured_finish * qty
          return paper_component + finish_component   # ALREADY per-line-rounded
    input_set: "the single LineItem being priced (per-line pricing; aggregation is done by order_subtotal_cents)"
    constants:
      QUANTITY_TIERS:
        - { min: 1,   max: 49,     multiplier: 1.00, note: "below shop minimum; validation ERR_QUANTITY_BELOW_MIN blocks before this fires unless package.min_qty < 50" }
        - { min: 50,  max: 99,     multiplier: 1.00 }
        - { min: 100, max: 199,    multiplier: 0.90 }
        - { min: 200, max: 499,    multiplier: 0.80 }
        - { min: 500, max: 999999, multiplier: 0.70 }
    precision: "2 decimal places in dollars = integer cents; per-line rounding uses round_half_up"
    variants:
      - name: list_price
        when: "Order.prior_order_id is null (first-time order) OR reorder outside the 365-day window"
        difference: "captured_base = live PaperStock.base_price_cents at line-item creation; captured_finish = live FinishOption.surcharge_cents"
      - name: reorder_locked
        when: "Order.prior_order_id != null AND (Order.created_at - prior_order.created_at) <= 365 days AND paper_stock_id / finish_option_id match the prior line"
        difference: |
          captured_base = the ORIGINAL LineItem.captured_base_price_cents from the matching prior line; captured_finish likewise.
          Effect: if PaperStock.base_price_cents changed between the two orders, list_price and reorder_locked differ.

  - name: order_subtotal_cents
    trigger: "on any LineItem create/delete; on POST /orders/{id}/confirm"
    algorithm: aggregation
    formula: |
      # Rule 2 mode (b): nested rounding — per-line rounding then sum. Pinned explicitly.
      # NOT round(sum), which for tier-multiplier * base * qty products would yield
      # a different result across the whole order.
      def order_subtotal(line_items):
          return sum(li.line_price_cents for li in line_items)   # each li already round_half_up per line
    input_set: "all LineItems whose order_id == this Order.id and whose parent order is not CANCELLED"
    constants: {}
    precision: "integer cents; per-line-then-sum ordering PINNED"

  - name: reorder_discount_cents
    trigger: "on POST /orders/{id}/confirm; recomputed on any subsequent line-item change while Order.status == CART"
    algorithm: threshold
    formula: |
      def reorder_discount(order, prior_order, current_utc):
          if prior_order is None:                       return 0
          if prior_order.customer_id != order.customer_id:  return 0
          if prior_order.status != "DELIVERED":         return 0
          days = (order.created_at - prior_order.created_at).days     # calendar day diff
          if days <= REORDER_WINDOW_DAYS:               # 365
              return round_half_up(order.subtotal_cents * REORDER_DISCOUNT_PCT)   # 0.10
          return 0
    input_set: "the current Order plus prior Order (if prior_order_id set)"
    constants:
      REORDER_WINDOW_DAYS: 365
      REORDER_DISCOUNT_PCT: 0.10
    precision: "integer cents, round_half_up"

  - name: rush_surcharge_cents
    trigger: "on POST /orders/{id}/apply-rush"
    algorithm: threshold
    formula: |
      # Rate breakpoints on days_to_deadline = (rush_deadline - current_utc).days.
      # Applied to (subtotal - reorder_discount) — the same base the deposit is computed on.
      def rush_surcharge(order, current_utc):
          days = (order.rush_deadline - current_utc).days
          if days >= 14:                                  # too far out for rush
              raise ERR_RUSH_NOT_NEEDED_OR_SIMILAR         # (mapped to ERR_RUSH_INFEASIBLE per §1.6)
          if 7 <= days < 14:  pct = 0.15
          elif 3 <= days < 7: pct = 0.30
          else:                                            # days < 3
              raise ERR_RUSH_INFEASIBLE
          base = order.subtotal_cents - order.reorder_discount_cents
          return round_half_up(base * pct)
    input_set: "this Order only"
    constants:
      RUSH_TIER_15D_PCT: 0.15
      RUSH_TIER_7D_PCT:  0.30
      RUSH_MIN_DAYS:     3
      RUSH_MAX_DAYS:     14
    precision: "integer cents, round_half_up"

  - name: deposit_due_cents
    trigger: "on POST /orders/{id}/confirm (locked; NOT recomputed after)"
    algorithm: aggregation
    formula: |
      # Locked at confirm time so a downstream apply-rush cannot retroactively increase the deposit.
      def deposit_due(order, pkg):
          base = order.subtotal_cents - order.reorder_discount_cents
          return round_half_up(base * pkg.deposit_pct)
    input_set: "this Order at confirm time"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: total_cents
    trigger: "on any line-item mutation, on POST /orders/{id}/apply-rush, on POST /orders/{id}/confirm, on proof revision-fee accrual"
    algorithm: aggregation
    formula: |
      def total(order, proof):
          return (order.subtotal_cents
                  - order.reorder_discount_cents
                  + order.rush_surcharge_cents
                  + (proof.revision_fee_cents if proof else 0))
    input_set: "this Order + its Proof (if any)"
    constants: {}
    precision: "integer cents"

  - name: expected_lead_days
    trigger: "on POST /orders/{id}/confirm; recomputed on apply-rush"
    algorithm: aggregation
    formula: |
      # Simple aggregation: paper takes MAX days across chosen stocks, plus finish adder, plus
      # addressing adder if any AddressingJob exists on the order; rush subtracts 4 (floor 1).
      def expected_lead_days(order, line_items, addressing_jobs):
          paper_max_days = max(li.paper_stock.lead_days for li in line_items)
          finish_max_days = max(li.finish_option.additional_lead_days for li in line_items)
          add_days = ADDRESSING_LEAD_DAYS if addressing_jobs else 0                  # 3
          rush_speedup = RUSH_LEAD_DAY_SPEEDUP if order.rush_requested else 0        # 4
          return max(1, paper_max_days + finish_max_days + add_days - rush_speedup)
    input_set: "this Order's LineItems + AddressingJobs"
    constants:
      ADDRESSING_LEAD_DAYS: 3
      RUSH_LEAD_DAY_SPEEDUP: 4
    precision: "integer days"

  - name: proof_expires_at
    trigger: "on Proof DRAFT->SUBMITTED and CHANGES_REQUESTED->SUBMITTED"
    algorithm: threshold
    formula: |
      # Rule 1 dual-variant on the Proof (lifecycle) entity — different domain from
      # order_subtotal (fiscal).
      def proof_expires_at(proof, order, pkg, current_utc):
          # Days added to submitted_at; branch on parent Order.rush_requested.
          if order.rush_requested:
              days = math.ceil(pkg.proof_expiry_days / 2)      # rush variant: half (rounded up)
          else:
              days = pkg.proof_expiry_days                     # standard variant
          return current_utc + timedelta(days=days)
    input_set: "the Proof, its parent Order, and the Order's EventPackage"
    constants: {}
    precision: "datetime (UTC)"
    variants:
      - name: standard_expiry
        when: "Order.rush_requested == false"
        difference: "days = pkg.proof_expiry_days"
      - name: rush_expiry
        when: "Order.rush_requested == true"
        difference: "days = ceil(pkg.proof_expiry_days / 2)"

  - name: cash_conservation_invariant
    trigger: "audit: recomputed on every /_payments/simulate and every Order cancel"
    algorithm: aggregation
    formula: |
      # Rule 9 conserved-quantity #1 (money). The named global quantity is:
      #
      #     cust_ledger(c) =
      #         Customer[c].credit_balance_cents
      #       + Σ Order.deposit_paid_cents  for orders where customer_id == c
      #                                     AND status ∈ {DEPOSIT_PENDING, IN_PRODUCTION,
      #                                                    READY_TO_SHIP, SHIPPED, DELIVERED}
      #
      # Invariant: for a given cumulative-deposits-paid value X (Customer.cumulative_deposits_paid_cents),
      # cust_ledger(c) == X at all times. A DEPOSIT_PENDING -> CANCELLED transition MUST
      # move deposit_paid_cents into credit_balance_cents so cust_ledger is unchanged.
      def cust_ledger(customer, orders_for_customer):
          eligible_statuses = {"DEPOSIT_PENDING","IN_PRODUCTION","READY_TO_SHIP","SHIPPED","DELIVERED"}
          return customer.credit_balance_cents + sum(
              o.deposit_paid_cents for o in orders_for_customer if o.status in eligible_statuses)
    input_set: "one customer + all their orders"
    constants: {}
    precision: "integer cents"

  - name: paper_reserved_conservation_invariant
    trigger: "audit: recomputed on every LineItem add/delete, on order confirm, and on order cancel/deliver"
    algorithm: aggregation
    formula: |
      # Rule 9 conserved-quantity #2 (physical inventory).
      # For each PaperStock p, the invariant is:
      #
      #     PaperStock[p].reserved_units ==
      #         Σ LineItem.quantity  for lines where paper_stock_id == p
      #                              AND Order.status ∈ {DEPOSIT_PENDING, IN_PRODUCTION, READY_TO_SHIP}
      #
      # Notes:
      #   - CART orders do NOT reserve (customer hasn't confirmed yet).
      #   - SHIPPED and DELIVERED orders release the reservation on transition.
      #   - CANCELLED orders release too.
      def paper_reserved(paper_stock, all_line_items):
          eligible = {"DEPOSIT_PENDING","IN_PRODUCTION","READY_TO_SHIP"}
          return sum(li.quantity for li in all_line_items
                     if li.paper_stock_id == paper_stock.id
                     and li.order.status in eligible)
    input_set: "one PaperStock + all LineItems that reference it"
    constants: {}
    precision: "integer units"

# ---------------------------------------------------------------------------
# §1.4  Validation Rules Table (ordered)
# ---------------------------------------------------------------------------
validations:

  # ---- Priority band 1: authentication ------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  # ---- Priority band 2: authorization -------------------------------------
  - priority: 2
    category: auth
    check: "acting role is in endpoint.roles AND (for entity_backed roles) X-User-ID equals the resource owner id per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- Priority band 3: existence -----------------------------------------
  - priority: 3
    category: existence
    check: "referenced Customer exists"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "any endpoint with customer_id in path or body"

  - priority: 3
    category: existence
    check: "referenced Designer exists"
    error_id: ERR_DESIGNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /designs/{id}/proofs"

  - priority: 3
    category: existence
    check: "referenced Design exists"
    error_id: ERR_DESIGN_NOT_FOUND
    http_status: 404
    applies_to: "any endpoint with design in path or design_id in body"

  - priority: 3
    category: existence
    check: "referenced Proof exists"
    error_id: ERR_PROOF_NOT_FOUND
    http_status: 404
    applies_to: "POST /proofs/{id}/*, GET /proofs/{id}"

  - priority: 3
    category: existence
    check: "referenced Order exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "any endpoint with order in path"

  - priority: 3
    category: existence
    check: "referenced LineItem exists on the given Order"
    error_id: ERR_LINE_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "DELETE /orders/{id}/line-items/{lid}"

  - priority: 3
    category: existence
    check: "referenced WorkOrder exists"
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /work-orders/{id}/*"

  - priority: 3
    category: existence
    check: "referenced Shipment exists"
    error_id: ERR_SHIPMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /shipments/{id}/*"

  - priority: 3
    category: existence
    check: "referenced PaperStock / FinishOption / EventPackage exists"
    error_id: ERR_PAPER_STOCK_NOT_FOUND
    http_status: 404
    applies_to: "any endpoint with paper_stock_id / finish_option_id / event_package_id"
    note: "This entry compresses three not-found errors; ERR_FINISH_OPTION_NOT_FOUND and ERR_EVENT_PACKAGE_NOT_FOUND fire on the parallel field. All three sit at the same priority within the existence band."

  # ---- Priority band 4: state preconditions -------------------------------
  - priority: 4
    category: state
    check: "OCC: POST /orders/{id}/line-items requires expected_order_version == current Order.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/line-items"

  - priority: 4
    category: state
    check: "operation valid for target entity's current state per §1.2 (e.g., approving proof requires SUBMITTED; confirming order requires CART)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 4
    category: state
    check: "target entity is not already terminal (e.g., cancel on already-CANCELLED / DELIVERED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /orders/{id}/cancel, POST /proofs/{id}/*"

  - priority: 4
    category: state
    check: "Proof.expires_at has not passed (any customer-side proof action)"
    error_id: ERR_PROOF_EXPIRED
    http_status: 409
    applies_to: "POST /proofs/{id}/approve, POST /proofs/{id}/request-changes"

  - priority: 4
    category: state
    check: "IN_PRODUCTION -> READY_TO_SHIP requires linked Proof.status == APPROVED (cross-entity precondition; §0.5 Rule 7 pair 1: Order↔Proof)"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "system transition Order.IN_PRODUCTION -> Order.READY_TO_SHIP; also POST /orders/{id}/pay-deposit when proof already required (defensive)"

  - priority: 4
    category: state
    check: "Order cancel from IN_PRODUCTION requires role ShopAdmin (Customer cannot cancel this state)"
    error_id: ERR_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /orders/{id}/cancel"

  - priority: 4
    category: state
    check: "apply-rush is only valid before Proof.status == APPROVED"
    error_id: ERR_RUSH_TOO_LATE
    http_status: 409
    applies_to: "POST /orders/{id}/apply-rush"

  - priority: 4
    category: state
    check: "Order.confirm requires deposit not already paid (i.e., must be in CART, defensive against double confirm)"
    error_id: ERR_DEPOSIT_NOT_PAID
    http_status: 409
    applies_to: "POST /shipments/{id}/dispatch"
    note: "The other side of this coin — cannot dispatch if deposit was never fully paid — reuses this error."

  # ---- Priority band 5: business rules (domain order) ---------------------
  # 5a. business_safety — regulatory / catalog integrity
  - priority: 5
    category: business_safety
    check: "PaperStock referenced by a LineItem must be ACTIVE at line-item creation (unless carried forward on a reorder)"
    error_id: ERR_PAPER_DISCONTINUED
    http_status: 422
    applies_to: "POST /orders/{id}/line-items, POST /orders/{id}/confirm, POST /designs"

  - priority: 5
    category: business_safety
    check: "FinishOption referenced by a LineItem must be ACTIVE at line-item creation (unless carried forward on a reorder)"
    error_id: ERR_FINISH_DISCONTINUED
    http_status: 422
    applies_to: "POST /orders/{id}/line-items, POST /orders/{id}/confirm, POST /designs"

  # 5b. business_constraint — quantities, dates, uniqueness
  - priority: 6
    category: business_constraint
    check: "LineItem.quantity >= parent Order's event_package.min_qty"
    error_id: ERR_QUANTITY_BELOW_MIN
    http_status: 422
    applies_to: "POST /orders/{id}/line-items, POST /orders/{id}/confirm"

  - priority: 6
    category: business_constraint
    check: "LineItem.quantity > 0 (and integer)"
    error_id: ERR_QUANTITY_INVALID
    http_status: 422
    applies_to: "POST /orders/{id}/line-items"

  - priority: 6
    category: business_constraint
    check: "AddressingJob daily aggregate capacity: for a given scheduled_date, sum of AddressingJob.quantity across all orders currently IN_PROGRESS on addressing_status must not exceed 500 (Rule 8 aggregate-interval variant)"
    error_id: ERR_ADDRESSING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /work-orders/{id}/addressing (with new_status=IN_PROGRESS)"

  - priority: 6
    category: business_temporal
    check: "WorkOrder press slot must not overlap another WorkOrder on the same press_id; closed interval semantics; adjacent intervals (end_A == start_B) also rejected (Rule 8 closed-interval variant)"
    error_id: ERR_PRESS_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /work-orders/{id}/production (with new_status=PRINTING)"

  - priority: 6
    category: business_temporal
    check: "SHIPPED -> DELIVERED requires linked WorkOrder both dimensions COMPLETED (cross-entity; §0.5 Rule 7 pair 2: Shipment↔WorkOrder)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /shipments/{id}/dispatch"

  # 5c. business_referential — reorder eligibility
  - priority: 7
    category: business_referential
    check: "prior_order_id (if given) must reference an Order with status=DELIVERED, same customer, and created within REORDER_WINDOW_DAYS (365)"
    error_id: ERR_REORDER_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /orders"

  # 5d. business_fiscal — rush eligibility, deposit
  - priority: 8
    category: business_fiscal
    check: "apply-rush requires (rush_deadline - current_utc).days ∈ [RUSH_MIN_DAYS=3, RUSH_MAX_DAYS=14) — Rule 6 boundary metric #2"
    error_id: ERR_RUSH_INFEASIBLE
    http_status: 422
    applies_to: "POST /orders/{id}/apply-rush"

  - priority: 8
    category: business_fiscal
    check: "pay-deposit amount must equal Order.deposit_due_cents (no partial deposits)"
    error_id: ERR_DEPOSIT_NOT_PAID
    http_status: 422
    applies_to: "POST /_payments/simulate, POST /orders/{id}/pay-deposit"

# ---------------------------------------------------------------------------
# §1.5  API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:

  # ---- Customer ------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Register a customer (admin creates the account on behalf of a person)."
    roles: [ShopAdmin]
    code: 201
    input: [email, full_name, phone]
    output: Customer
    side_effects:
      - "creates Customer with credit_balance_cents=0, cumulative_deposits_paid_cents=0"

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer."
    roles: [ShopAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/designs"
    description: "List designs owned by a customer (reverse-reachability for Design.customer_id)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Design[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/orders"
    description: "List orders owned by a customer (reverse-reachability for Order.customer_id)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Order[]
    side_effects: []

  # ---- Designer ------------------------------------------------------------
  - method: POST
    path: "/designers"
    description: "Register a designer."
    roles: [ShopAdmin]
    code: 201
    input: [full_name, "active?"]
    output: Designer
    side_effects: []

  - method: GET
    path: "/designers/{id}"
    description: "Fetch a designer."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: []
    output: Designer
    side_effects: []

  - method: GET
    path: "/designers"
    description: "List designers."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Designer[]
    side_effects: []

  # ---- Catalog: paper --------------------------------------------------------
  - method: POST
    path: "/paper-stocks"
    description: "Create a paper stock."
    roles: [ShopAdmin]
    code: 201
    input: [name, base_price_cents, lead_days, "status?"]
    output: PaperStock
    side_effects: []

  - method: POST
    path: "/paper-stocks/{id}/discontinue"
    description: "Flip PaperStock.status to DISCONTINUED. Existing orders keep running; new orders cannot reference this stock (unless via reorder)."
    roles: [ShopAdmin]
    code: 200
    input: []
    output: PaperStock
    side_effects:
      - "PaperStock.status = DISCONTINUED"

  - method: PATCH
    path: "/paper-stocks/{id}"
    description: "Admin re-prices a paper stock (business endpoint for catalog repricing)."
    roles: [ShopAdmin]
    code: 200
    input: ["base_price_cents?", "lead_days?"]
    output: PaperStock
    side_effects:
      - "PaperStock.base_price_cents / lead_days updated in place; existing captured_base_price_cents on LineItems is UNCHANGED (that's the whole point of the reorder-locked variant)"

  - method: GET
    path: "/paper-stocks/{id}"
    description: "Fetch a paper stock (observation for reserved_units, base_price_cents, status)."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: []
    output: PaperStock
    side_effects: []

  - method: GET
    path: "/paper-stocks"
    description: "List paper stocks."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PaperStock[]
    side_effects: []

  # ---- Catalog: finish ------------------------------------------------------
  - method: POST
    path: "/finish-options"
    description: "Create a finish option."
    roles: [ShopAdmin]
    code: 201
    input: [name, surcharge_cents, additional_lead_days, "status?"]
    output: FinishOption
    side_effects: []

  - method: GET
    path: "/finish-options/{id}"
    description: "Fetch a finish option."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: []
    output: FinishOption
    side_effects: []

  - method: GET
    path: "/finish-options"
    description: "List finish options."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinishOption[]
    side_effects: []

  # ---- Catalog: event package ----------------------------------------------
  - method: POST
    path: "/event-packages"
    description: "Create an event package."
    roles: [ShopAdmin]
    code: 201
    input: [name, package_type, deposit_pct, min_qty, proof_expiry_days, "status?"]
    output: EventPackage
    side_effects: []

  - method: GET
    path: "/event-packages/{id}"
    description: "Fetch an event package."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: []
    output: EventPackage
    side_effects: []

  - method: GET
    path: "/event-packages"
    description: "List event packages."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["package_type?", "status?", "limit?", "offset?"]
    output: EventPackage[]
    side_effects: []

  # ---- Design --------------------------------------------------------------
  - method: POST
    path: "/designs"
    description: "Customer creates a design draft."
    roles: [Customer]
    code: 201
    input: [customer_id, event_package_id, paper_stock_id, finish_option_id, "notes?"]
    output: Design
    side_effects:
      - "creates Design with status=DRAFT"

  - method: GET
    path: "/designs/{id}"
    description: "Fetch a design."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: []
    output: Design
    side_effects: []

  - method: PATCH
    path: "/designs/{id}"
    description: "Customer updates design (paper, finish, or notes) while status=DRAFT."
    roles: [Customer]
    code: 200
    input: ["paper_stock_id?", "finish_option_id?", "notes?"]
    output: Design
    side_effects:
      - "Design.updated_at, Design.version bumped"

  - method: GET
    path: "/designs"
    description: "Filtered list of designs; supports FK reverse-reachability for Designer, EventPackage, PaperStock, FinishOption, Customer."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["customer_id?", "designer_id?", "event_package_id?", "paper_stock_id?", "finish_option_id?", "status?", "limit?", "offset?"]
    output: Design[]
    side_effects: []

  # ---- Proof ---------------------------------------------------------------
  - method: POST
    path: "/designs/{id}/proofs"
    description: "Designer creates the initial Proof record for a Design that is in PROOFING state (i.e., its Order was confirmed)."
    roles: [Designer]
    code: 201
    input: [designer_id]
    output: Proof
    side_effects:
      - "Proof created with status=DRAFT and current_revision_number=0"
      - "Design.designer_id = the acting designer"

  - method: POST
    path: "/proofs/{id}/submit"
    description: "Designer submits (or resubmits after CHANGES_REQUESTED) the proof for customer review."
    roles: [Designer]
    code: 200
    input: []
    output: Proof
    side_effects:
      - "Proof.status = SUBMITTED; current_revision_number += 1; submitted_at = current_utc; expires_at recomputed"
      - "if current_revision_number > 3: Proof.revision_fee_cents += 2500 (Order.total_cents recomputed accordingly)"

  - method: POST
    path: "/proofs/{id}/request-changes"
    description: "Customer rejects the current submission and asks for changes."
    roles: [Customer]
    code: 200
    input: []
    output: Proof
    side_effects:
      - "Proof.status = CHANGES_REQUESTED"

  - method: POST
    path: "/proofs/{id}/approve"
    description: "Customer approves the submitted proof (terminal state for proof workflow)."
    roles: [Customer]
    code: 200
    input: []
    output: Proof
    side_effects:
      - "Proof.status = APPROVED; approved_at = current_utc; Design.status = APPROVED"
      - "If Order.deposit_paid_at is not null: cascade Order.DEPOSIT_PENDING -> IN_PRODUCTION (spawns WorkOrder)"

  - method: GET
    path: "/proofs/{id}"
    description: "Fetch a proof."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: []
    output: Proof
    side_effects: []

  - method: GET
    path: "/designs/{id}/proofs"
    description: "List proofs for a design (reverse-reachability for Proof.design_id)."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["limit?", "offset?"]
    output: Proof[]
    side_effects: []

  - method: GET
    path: "/proofs"
    description: "Filtered list of proofs (reverse-reachability for Proof.designer_id and Proof.design_id)."
    roles: [ShopAdmin, Customer, Designer]
    code: 200
    input: ["designer_id?", "design_id?", "status?", "limit?", "offset?"]
    output: Proof[]
    side_effects: []

  # ---- Order ---------------------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Customer places a new order in CART status; snapshots event_package_id from Design."
    roles: [Customer]
    code: 201
    input: [customer_id, design_id, "prior_order_id?", "rush_deadline?"]
    output: Order
    side_effects:
      - "Order created with status=CART, subtotal_cents=0, total_cents=0"
      - "Order.event_package_id snapshotted from Design"

  - method: POST
    path: "/orders/{id}/line-items"
    description: "Add a LineItem to an Order (only while CART). REQUIRES OCC via expected_order_version."
    roles: [Customer]
    code: 201
    input: [paper_stock_id, finish_option_id, quantity, expected_order_version]
    output: LineItem
    side_effects:
      - "LineItem created with captured_base_price_cents and captured_finish_surcharge_cents snapshotted from live catalog"
      - "line_price_cents computed via calculations.line_item_price_cents"
      - "Order.subtotal_cents, Order.total_cents recomputed"
      - "increments Order.version by 1"

  - method: DELETE
    path: "/orders/{id}/line-items/{lid}"
    description: "Remove a LineItem from an Order while CART."
    roles: [Customer]
    code: 204
    input: []
    output: null
    side_effects:
      - "LineItem deleted"
      - "Order.subtotal_cents, Order.total_cents recomputed"
      - "increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/apply-rush"
    description: "Mark this order as rush; compute rush surcharge based on rush_deadline vs current_utc. Only valid before proof approval."
    roles: [Customer, ShopAdmin]
    code: 200
    input: [rush_deadline]
    output: Order
    side_effects:
      - "Order.rush_requested = true; Order.rush_deadline set"
      - "Order.rush_surcharge_cents computed via calculations.rush_surcharge_cents"
      - "Order.total_cents, Order.expected_lead_days recomputed"
      - "Proof.expires_at recomputed to rush variant if proof already exists in DRAFT/SUBMITTED/CHANGES_REQUESTED"

  - method: POST
    path: "/orders/{id}/confirm"
    description: "Customer confirms the order (CART -> DEPOSIT_PENDING). Locks pricing, computes reorder discount and deposit, creates the Proof workflow, and reserves paper."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.status = DEPOSIT_PENDING"
      - "reorder_discount_cents, deposit_due_cents, expected_lead_days computed"
      - "Proof(status=DRAFT) created (designer_id assigned on first POST /designs/{id}/proofs)"
      - "Design.status = PROOFING"
      - "For each LineItem: PaperStock.reserved_units += quantity"

  - method: POST
    path: "/orders/{id}/pay-deposit"
    description: "Customer records a deposit payment (thin wrapper around /_payments/simulate that pins the amount to Order.deposit_due_cents)."
    roles: [Customer]
    code: 200
    input: [amount_cents]
    output: Order
    side_effects:
      - "Order.deposit_paid_cents += amount_cents"
      - "if Order.deposit_paid_cents == Order.deposit_due_cents: Order.deposit_paid_at = current_utc; Customer.cumulative_deposits_paid_cents += amount_cents"
      - "if Proof.status == APPROVED at that moment: cascade Order.DEPOSIT_PENDING -> IN_PRODUCTION"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order. Customer may cancel from CART or DEPOSIT_PENDING; ShopAdmin may additionally cancel from IN_PRODUCTION (deposit forfeited)."
    roles: [Customer, ShopAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.status = CANCELLED"
      - "cascade: Proof -> CANCELLED (unless already terminal); WorkOrder cancelled if exists; Shipment -> CANCELLED if PREPARING"
      - "if cancelling from DEPOSIT_PENDING AND Order.deposit_paid_cents > 0: Customer.credit_balance_cents += Order.deposit_paid_cents AND Order.deposit_paid_cents = 0 (cash conservation)"
      - "for each LineItem: PaperStock.reserved_units -= quantity"

  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order."
    roles: [ShopAdmin, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "Filtered list of orders; supports FK reverse-reachability for Design.id, Proof.id, EventPackage.id, prior Order.id (self-ref), Customer.id."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["customer_id?", "design_id?", "proof_id?", "event_package_id?", "prior_order_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  # ---- Line items (filtered list for reverse-reachability of catalog FKs) --
  - method: GET
    path: "/orders/{id}/line-items"
    description: "List LineItems on an Order (reverse-reachability for LineItem.order_id)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: LineItem[]
    side_effects: []

  - method: GET
    path: "/line-items/{id}"
    description: "Fetch a line item by id."
    roles: [ShopAdmin, Customer]
    code: 200
    input: []
    output: LineItem
    side_effects: []

  - method: GET
    path: "/line-items"
    description: "Filtered list of line items; supports FK reverse-reachability for PaperStock.id and FinishOption.id."
    roles: [ShopAdmin]
    code: 200
    input: ["order_id?", "paper_stock_id?", "finish_option_id?", "limit?", "offset?"]
    output: LineItem[]
    side_effects: []

  # ---- Addressing jobs -----------------------------------------------------
  - method: POST
    path: "/orders/{id}/addressing-jobs"
    description: "Add an addressing or assembly add-on to an order (while CART or DEPOSIT_PENDING)."
    roles: [Customer, ShopAdmin]
    code: 201
    input: [job_type, quantity, scheduled_date, unit_price_cents]
    output: AddressingJob
    side_effects:
      - "AddressingJob created with status=SCHEDULED"
      - "Order.expected_lead_days recomputed (adds 3 addressing days when first job is added)"

  - method: GET
    path: "/orders/{id}/addressing-jobs"
    description: "List addressing jobs for an order (reverse-reachability for AddressingJob.order_id)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: AddressingJob[]
    side_effects: []

  # ---- Work orders ---------------------------------------------------------
  - method: POST
    path: "/work-orders/{id}/production"
    description: "Advance the production_status dimension of a WorkOrder (NOT_STARTED -> PRINTING -> FINISHING -> COMPLETED)."
    roles: [ShopAdmin]
    code: 200
    input: [new_status, "press_id?", "press_slot_start?", "press_slot_end?"]
    output: WorkOrder
    side_effects:
      - "on new_status=PRINTING: press_id, press_slot_start, press_slot_end are locked in (rejected if overlap)"
      - "on new_status=COMPLETED AND addressing_status ∈ {NOT_APPLICABLE, COMPLETED}: cascade Order.IN_PRODUCTION -> READY_TO_SHIP (spawns Shipment)"

  - method: POST
    path: "/work-orders/{id}/addressing"
    description: "Advance the addressing_status dimension of a WorkOrder (PENDING -> IN_PROGRESS -> COMPLETED). Independent from production dimension."
    roles: [ShopAdmin]
    code: 200
    input: [new_status]
    output: WorkOrder
    side_effects:
      - "AddressingJobs cascaded to IN_PROGRESS or COMPLETED accordingly"
      - "on new_status=COMPLETED AND production_status == COMPLETED: cascade Order.IN_PRODUCTION -> READY_TO_SHIP (spawns Shipment)"

  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a work order."
    roles: [ShopAdmin, Customer]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/orders/{id}/work-orders"
    description: "List work orders for an order (reverse-reachability for WorkOrder.order_id)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  # ---- Shipments -----------------------------------------------------------
  - method: POST
    path: "/shipments/{id}/dispatch"
    description: "Dispatch a shipment (PREPARING -> DISPATCHED)."
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "Shipment.status = DISPATCHED; dispatched_at = current_utc; Order.status = SHIPPED"

  - method: POST
    path: "/shipments/{id}/mark-delivered"
    description: "Mark a shipment as delivered (DISPATCHED -> DELIVERED); triggers cascade to Order.DELIVERED and Design.ARCHIVED."
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "Shipment.status = DELIVERED; delivered_at = current_utc"
      - "Order.status = DELIVERED; Design.status = ARCHIVED"
      - "for each LineItem: PaperStock.reserved_units -= quantity"

  - method: GET
    path: "/shipments/{id}"
    description: "Fetch a shipment."
    roles: [ShopAdmin, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/orders/{id}/shipments"
    description: "List shipments for an order (reverse-reachability for Shipment.order_id)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/addressing-jobs/{id}"
    description: "Fetch an addressing job (observe status)."
    roles: [ShopAdmin, Customer]
    code: 200
    input: []
    output: AddressingJob
    side_effects: []

  # ---- Test-driving endpoints (custom /_ namespace) ------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the logical UTC clock used by all deadline/expiry rules. Server startup default is
      2026-03-01T00:00:00Z; this default sits at or before every fixture date, so an unset clock
      is a deterministic 'earliest' instant rather than wall-clock time.
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "server logical clock advanced to to_iso8601 (must be monotonically non-decreasing)"

  - method: POST
    path: "/_payments/simulate"
    description: "Simulate an external deposit payment for testing. Applies to Order.deposit_paid_cents; behaves like /orders/{id}/pay-deposit but is admin-only and allows exact-amount payment simulation."
    roles: [ShopAdmin]
    code: 200
    input: [order_id, amount_cents, outcome]
    output: Order
    side_effects:
      - "on outcome=SUCCEEDED: Order.deposit_paid_cents += amount_cents; if fully paid: deposit_paid_at set AND Customer.cumulative_deposits_paid_cents += amount_cents"
      - "if Proof.status == APPROVED at that moment: cascade Order.DEPOSIT_PENDING -> IN_PRODUCTION"

# ---------------------------------------------------------------------------
# §1.6  Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "missing or invalid X-User-Role" }
  - { id: ERR_UNAUTHORIZED,              http: 403, condition: "role not permitted for this endpoint, or entity_backed role's X-User-ID does not match resource owner" }
  - { id: ERR_INVALID_REQUEST,           http: 400, condition: "missing/malformed required field, invalid enum value, or type mismatch" }
  - { id: ERR_CUSTOMER_NOT_FOUND,        http: 404, condition: "referenced Customer.id does not exist" }
  - { id: ERR_DESIGNER_NOT_FOUND,        http: 404, condition: "referenced Designer.id does not exist" }
  - { id: ERR_DESIGN_NOT_FOUND,          http: 404, condition: "referenced Design.id does not exist" }
  - { id: ERR_PROOF_NOT_FOUND,           http: 404, condition: "referenced Proof.id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND,           http: 404, condition: "referenced Order.id does not exist" }
  - { id: ERR_LINE_ITEM_NOT_FOUND,       http: 404, condition: "referenced LineItem.id does not exist on the target Order" }
  - { id: ERR_ADDRESSING_JOB_NOT_FOUND,  http: 404, condition: "referenced AddressingJob.id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND,      http: 404, condition: "referenced WorkOrder.id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND,        http: 404, condition: "referenced Shipment.id does not exist" }
  - { id: ERR_PAPER_STOCK_NOT_FOUND,     http: 404, condition: "referenced PaperStock.id does not exist" }
  - { id: ERR_FINISH_OPTION_NOT_FOUND,   http: 404, condition: "referenced FinishOption.id does not exist" }
  - { id: ERR_EVENT_PACKAGE_NOT_FOUND,   http: 404, condition: "referenced EventPackage.id does not exist" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "endpoint invoked from a state where the transition is not allowed per §1.2" }
  - { id: ERR_ALREADY_TERMINAL,          http: 409, condition: "target entity is already in a terminal state and the requested operation cannot re-fire" }
  - { id: ERR_PROOF_NOT_APPROVED,        http: 409, condition: "operation requires a linked Proof in APPROVED status" }
  - { id: ERR_DEPOSIT_NOT_PAID,          http: 409, condition: "operation requires Order.deposit_paid_at to be set OR the pay-deposit amount does not match deposit_due_cents" }
  - { id: ERR_ORDER_NOT_CANCELLABLE,     http: 409, condition: "cancel invoked on an order in a state where the acting role cannot cancel (e.g., Customer canceling IN_PRODUCTION)" }
  - { id: ERR_STALE_VERSION,             http: 412, condition: "expected_order_version does not match the current Order.version" }
  - { id: ERR_PROOF_EXPIRED,             http: 409, condition: "customer proof action after Proof.expires_at" }
  - { id: ERR_QUANTITY_BELOW_MIN,        http: 422, condition: "LineItem.quantity < event_package.min_qty" }
  - { id: ERR_QUANTITY_INVALID,          http: 422, condition: "LineItem.quantity <= 0 or non-integer" }
  - { id: ERR_PAPER_DISCONTINUED,        http: 422, condition: "LineItem or Design references a DISCONTINUED PaperStock outside of a valid reorder" }
  - { id: ERR_FINISH_DISCONTINUED,       http: 422, condition: "LineItem or Design references a DISCONTINUED FinishOption outside of a valid reorder" }
  - { id: ERR_PRESS_SLOT_OVERLAP,        http: 409, condition: "WorkOrder press_slot overlaps or is adjacent to another WorkOrder on the same press_id" }
  - { id: ERR_ADDRESSING_CAPACITY_EXCEEDED, http: 409, condition: "addressing_status IN_PROGRESS transition would push same-day aggregate quantity over the 500-unit daily cap" }
  - { id: ERR_RUSH_INFEASIBLE,           http: 422, condition: "days_to_deadline < 3, or >= 14 (rush not applicable)" }
  - { id: ERR_RUSH_TOO_LATE,             http: 409, condition: "apply-rush invoked after Proof.status == APPROVED" }
  - { id: ERR_REORDER_WINDOW_EXPIRED,    http: 422, condition: "prior_order_id references an order older than REORDER_WINDOW_DAYS (365) or a different customer, or a non-DELIVERED status" }

# ---------------------------------------------------------------------------
# §1.7  RBAC Matrix
# ---------------------------------------------------------------------------
roles:

  - name: Customer
    description: "End-user who owns Designs and Orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /designs                                     (with customer_id == self)"
      - "PATCH /designs/{id}                               (Design.customer_id == self)"
      - "POST /orders                                      (customer_id == self)"
      - "POST /orders/{id}/line-items                      (Order.customer_id == self)"
      - "DELETE /orders/{id}/line-items/{lid}              (Order.customer_id == self)"
      - "POST /orders/{id}/confirm                         (Order.customer_id == self)"
      - "POST /orders/{id}/pay-deposit                     (Order.customer_id == self)"
      - "POST /proofs/{id}/request-changes                 (Design.customer_id == self)"
      - "POST /proofs/{id}/approve                         (Design.customer_id == self)"
    shared_operations:
      - "POST /orders/{id}/apply-rush                      (shared with ShopAdmin)"
      - "POST /orders/{id}/cancel                          (CART / DEPOSIT_PENDING only; IN_PRODUCTION reserved for ShopAdmin)"
      - "POST /orders/{id}/addressing-jobs                 (shared with ShopAdmin)"
      - "GET /designs/{id}, /orders/{id}, /proofs/{id}, /customers/{id}, /customers/{id}/designs, /customers/{id}/orders, /orders/{id}/*, /orders, /designs, /designs/{id}/proofs (all scoped to own resources)"

  - name: Designer
    description: "Shop staff who create and submit proofs."
    identity: "entity_backed:Designer"
    exclusive_operations:
      - "POST /designs/{id}/proofs                         (designer_id == self)"
      - "POST /proofs/{id}/submit                          (Proof.designer_id == self)"
    shared_operations:
      - "GET /designs/{id}, /proofs/{id}, /designs, /designs/{id}/proofs"

  - name: ShopAdmin
    description: "Shop operator with full catalog, production, shipping, and administrative authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /designers"
      - "POST /paper-stocks, POST /paper-stocks/{id}/discontinue"
      - "POST /finish-options"
      - "POST /event-packages"
      - "POST /work-orders/{id}/production"
      - "POST /work-orders/{id}/addressing"
      - "POST /shipments/{id}/dispatch"
      - "POST /shipments/{id}/mark-delivered"
      - "POST /_clock/set_current_utc"
      - "POST /_payments/simulate"
    shared_operations:
      - "POST /orders/{id}/apply-rush, POST /orders/{id}/cancel, POST /orders/{id}/addressing-jobs (see Customer)"
      - "GET /customers/{id}, /designs, /designs/{id}, /designs/{id}/proofs, /proofs/{id}, /orders, /orders/{id}, /orders/{id}/*, /line-items, /customers/{id}/designs, /customers/{id}/orders"
