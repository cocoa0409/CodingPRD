# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2811 - Private-Label Grocery Brand Development
# Taxonomy: references/claim-extraction-guide.md - nine sections, per-section
# claim_type rows only. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7.
# Logical clock default: 2026-08-01T00:00:00Z (POST /_clock/set_current_utc).
# Corners already asserted by a §1.8 instance are emitted as excluded_because
# stubs citing that instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_create_returns_zeroed_ledger_counters
        claim_type: creation
        grounds:
          - endpoints[POST /private-label/programs]
          - entities.BrandProgram.fields.committed_budget_cents
          - entities.BrandProgram.fields.active_item_count
          - entities.BrandProgram.fields.status
        distinguishing_aspect: "A newly created BrandProgram returns 201 with every ledger counter at 0, status ACTIVE and version 1 - no counter is left null."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "BrandProgram.${prog_id}.brand_name == Harvest Lane"
            - "BrandProgram.${prog_id}.dev_budget_cents == 5000000"
            - "BrandProgram.${prog_id}.committed_budget_cents == 0"
            - "BrandProgram.${prog_id}.lifetime_committed_cents == 0"
            - "BrandProgram.${prog_id}.lifetime_released_cents == 0"
            - "BrandProgram.${prog_id}.active_item_count == 0"
            - "BrandProgram.${prog_id}.status == ACTIVE"
            - "BrandProgram.${prog_id}.version == 1"

      - name: supplier_get_by_id_returns_stored_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /private-label/suppliers/{supplier_id}]
          - entities.Supplier.fields.qualification_status
          - entities.Supplier.fields.qualified_at
        distinguishing_aspect: "GET /suppliers/{supplier_id} echoes the stored creation fields and the untouched system defaults PROSPECT / null qualified_at / probation_item_count 0."
        test_recipe:
          setup:
            - "One program with one freshly created supplier that has had no audit and no qualification decision."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
          trigger:
            - call: "GET /private-label/suppliers/${sup_id}"
              payload: {}
              as: QualityAuditor
              as_user_id: "u-quality-5"
          assert:
            - "the response status is 200"
            - "Supplier.${sup_id}.legal_name == Northmill Bakers"
            - "Supplier.${sup_id}.plant_country == US"
            - "Supplier.${sup_id}.gfsi_certificate_expiry == 2027-06-30T00:00:00Z"
            - "Supplier.${sup_id}.qualification_status == PROSPECT"
            - "Supplier.${sup_id}.qualified_at == null"
            - "Supplier.${sup_id}.probation_item_count == 0"
            - "Supplier.${sup_id}.weighted_complaint_points == 0"
            - "Supplier.${sup_id}.version == 1"

      - name: category_gaps_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /private-label/category-gaps]
          - response_envelope.pagination_fields
          - entities.CategoryGap.fields.program_id
        distinguishing_aspect: "With three gaps under one program, limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One program carrying three DRAFT category gaps (CRACKERS, COOKIES, PRETZELS)."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_a_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "COOKIES", national_brand_name: "Chipmont", nb_retail_price_cents: 420, category_annual_sales_cents: 180000000, pl_share_pct: 25.0, unit_velocity_per_week: 400, shelf_slots_quota: 1 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_b_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "PRETZELS", national_brand_name: "Twistco", nb_retail_price_cents: 300, category_annual_sales_cents: 90000000, pl_share_pct: 30.0, unit_velocity_per_week: 260, shelf_slots_quota: 1 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_c_id: $.data.id }
          trigger:
            - call: "GET /private-label/category-gaps"
              payload: { program_id: "${prog_id}", limit: 2, offset: 0 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "GET /private-label/category-gaps"
              payload: { program_id: "${prog_id}", limit: 2, offset: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
          assert:
            - "the first read returns response_type array with exactly 2 data rows"
            - "the first read returns total_count 3, limit 2, offset 0 and has_more true"
            - "the second read returns exactly 1 data row"
            - "the second read returns total_count 3, limit 2, offset 2 and has_more false"
            - "every returned row has program_id == ${prog_id}"

      - name: plant_line_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /private-label/plant-lines/{plant_line_id}]
          - validations[priority=5]
          - errors[ERR_PLANT_LINE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown plant_line_id returns 404 ERR_PLANT_LINE_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "One program exists; no PlantLine has ever been created."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /private-label/plant-lines/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "response_type is error and data.error_id == ERR_PLANT_LINE_NOT_FOUND"

      - name: program_create_missing_dev_budget_cents_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /private-label/programs]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "dev_budget_cents has source input with no default, so omitting it returns 422 ERR_INVALID_REQUEST and no BrandProgram row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { err: $.data.error_id }
            - call: "GET /private-label/programs"
              payload: { limit: 10, offset: 0 }
              as: ProgramDirector
              as_user_id: "u-director-1"
          assert:
            - "the create response status is 422 with error_id ERR_INVALID_REQUEST"
            - "the subsequent program list returns total_count 0"

      - name: plant_line_create_omitting_changeover_buffer_defaults_to_120
        claim_type: defaults
        grounds:
          - endpoints[POST /private-label/plant-lines]
          - entities.PlantLine.fields.changeover_buffer_minutes
        distinguishing_aspect: "Omitting changeover_buffer_minutes stores the declared default 120, not 0 and not null."
        test_recipe:
          setup:
            - "One program with one supplier."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /private-label/plant-lines"
              payload: { supplier_id: "${sup_id}", line_code: "CRK-9", daily_capacity_units: 48000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { line_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PlantLine.${line_id}.changeover_buffer_minutes == 120"
            - "PlantLine.${line_id}.daily_capacity_units == 48000"
            - "PlantLine.${line_id}.version == 1"

      - name: gap_create_starts_with_null_score_and_zero_slot_counters
        claim_type: computed_fields
        grounds:
          - endpoints[POST /private-label/category-gaps]
          - entities.CategoryGap.fields.gap_score
          - entities.CategoryGap.fields.recommended_tier
          - entities.CategoryGap.fields.slots_open
        distinguishing_aspect: "At create the computed gap_score, recommended_tier and approved_tier are null while slots_open equals shelf_slots_quota and both lifetime slot counters are 0."
        test_recipe:
          setup:
            - "One program exists."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CategoryGap.${gap_id}.status == DRAFT"
            - "CategoryGap.${gap_id}.gap_score == null"
            - "CategoryGap.${gap_id}.recommended_tier == null"
            - "CategoryGap.${gap_id}.approved_tier == null"
            - "CategoryGap.${gap_id}.slots_consumed == 0"
            - "CategoryGap.${gap_id}.slots_open == 2"
            - "CategoryGap.${gap_id}.slots_consumed_lifetime == 0"
            - "CategoryGap.${gap_id}.slots_released_lifetime == 0"

      - name: supplier_create_stamps_system_fields_and_version_one
        claim_type: system_fields
        grounds:
          - endpoints[POST /private-label/suppliers]
          - entities.Supplier.fields.qualification_status
        distinguishing_aspect: "id, created_at, updated_at and version are server-generated on supplier create: version is 1 and created_at equals the logical clock 2026-08-05T00:00:00Z set beforehand."
        test_recipe:
          setup:
            - "One program exists and the logical clock has been set to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "u-director-1"
          trigger:
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Supplier.${sup_id}.id is a non-empty server-generated string"
            - "Supplier.${sup_id}.created_at == 2026-08-05T00:00:00Z"
            - "Supplier.${sup_id}.updated_at == 2026-08-05T00:00:00Z"
            - "Supplier.${sup_id}.version == 1"
            - "Supplier.${sup_id}.qualification_status == PROSPECT"

      - name: plant_audit_create_with_invalid_enum_audit_type_rejected
        claim_type: type_constraints
        grounds:
          - endpoints[POST /private-label/plant-audits]
          - entities.PlantAudit.fields.audit_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "audit_type outside {CAPABILITY, ONGOING_QUALITY} returns 422 ERR_INVALID_REQUEST from the shape gate, before any window or capacity rule runs."
        test_recipe:
          setup:
            - "One program with one supplier and no audits."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/suppliers"
              payload: { program_id: "${prog_id}", legal_name: "Northmill Bakers", plant_country: "US", gfsi_certificate_expiry: "2027-06-30T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /private-label/plant-audits"
              payload: { supplier_id: "${sup_id}", audit_type: "SUPPLIER_VISIT", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-09T08:00:00Z" }
              as: QualityAuditor
              as_user_id: "u-quality-5"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 with error_id ERR_INVALID_REQUEST"
            - "the error is the shape error, not ERR_WINDOW_INVALID, even though window_end precedes window_start"
            - "no PlantAudit row exists for supplier ${sup_id}"

      - name: complaint_is_append_only_without_version_field
        claim_type: immutability
        grounds:
          - entities.Complaint.common_fields
          - entities.Complaint.fields.received_at
          - endpoints[POST /private-label/complaints]
        distinguishing_aspect: "Complaint is the only common_fields:false entity: its read exposes id, created_at and received_at but no version and no updated_at, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "One program, a TIER_APPROVED NBE gap and one CONCEPT item; the logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/items"
              payload: { gap_id: "${gap_id}", item_name: "Harvest Lane Wheat Crackers", tier: "NBE", pack_size_desc: "12 oz carton", trailing_90d_units: 50000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /private-label/complaints"
              payload: { item_id: "${item_id}", defect_category: "PACKAGING", severity: "MINOR", lot_code: "L-0801", narrative: "Carton flap unsealed" }
              as: QualityAuditor
              as_user_id: "u-quality-5"
              captures: { comp_id: $.data.id }
            - call: "GET /private-label/complaints/${comp_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "u-reg-7"
          assert:
            - "the create response status is 201"
            - "Complaint.${comp_id}.received_at == 2026-08-01T00:00:00Z"
            - "Complaint.${comp_id}.received_at equals Complaint.${comp_id}.created_at"
            - "the complaint read body carries no version field and no updated_at field"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint under /private-label/complaints"

      - name: cost_model_create_with_unknown_supplier_id_rejected
        claim_type: foreign_key_validation
        grounds:
          - endpoints[POST /private-label/cost-models]
          - validations[priority=6]
          - errors[ERR_SUPPLIER_NOT_FOUND]
        distinguishing_aspect: "In the flat topology every body foreign key is resolved left to right, so an unknown supplier_id on cost-model create returns 404 ERR_SUPPLIER_NOT_FOUND even though item_id is valid."
        test_recipe:
          setup:
            - "One program, a TIER_APPROVED NBE gap and one CONCEPT item; no supplier carries the id used in the trigger."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { gap_id: $.data.id }
            - call: "POST /private-label/category-gaps/${gap_id}/analyze"
              payload: {}
              as: SourcingManager
              as_user_id: "u-sourcing-3"
            - call: "POST /private-label/category-gaps/${gap_id}/tier-decision"
              payload: { decision: "APPROVE", approved_tier: "NBE" }
              as: ProgramDirector
              as_user_id: "u-director-1"
            - call: "POST /private-label/items"
              payload: { gap_id: "${gap_id}", item_name: "Harvest Lane Wheat Crackers", tier: "NBE", pack_size_desc: "12 oz carton", trailing_90d_units: 50000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /private-label/cost-models"
              payload: { item_id: "${item_id}", supplier_id: "22222222-2222-4222-8222-222222222222", ingredient_cost_cents_per_unit: 142, packaging_cost_cents_per_unit: 31, conversion_cost_cents_per_unit: 48, quoted_yield_pct: 96.5, freight_cents_per_pallet: 48000, units_per_pallet: 1200, moq_units: 12000, tooling_cents: 400000 }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_SUPPLIER_NOT_FOUND"
            - "ProductItem.${item_id}.supplier_id == null"
            - "ProductItem.${item_id}.development_status == CONCEPT"

      - name: item_create_with_unknown_gap_id_rejected
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /private-label/items]
          - validations[priority=6]
          - errors[ERR_GAP_NOT_FOUND]
        distinguishing_aspect: "ProductItem's gap_id is its only mandatory parent reference; an unknown gap_id returns 404 ERR_GAP_NOT_FOUND before the TIER_APPROVED and slot-quota gates are consulted."
        test_recipe:
          setup:
            - "One program exists; no CategoryGap carries the id used in the trigger."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /private-label/items"
              payload: { gap_id: "33333333-3333-4333-8333-333333333333", item_name: "Harvest Lane Wheat Crackers", tier: "NBE", pack_size_desc: "12 oz carton" }
              as: SourcingManager
              as_user_id: "u-sourcing-3"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with error_id ERR_GAP_NOT_FOUND"
            - "BrandProgram.${prog_id}.active_item_count == 0"

  # ===========================================================================
  # 2. State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: item_initial_state_is_concept_and_green
        claim_type: initial_state
        grounds:
          - state_machines.ProductItem.initial_state
          - entities.ProductItem.fields.development_status
          - entities.ProductItem.fields.quality_posture
        distinguishing_aspect: "ProductItem carries two independent state dimensions, so a fresh item starts CONCEPT on the development dimension AND GREEN on the quality dimension, with complaint_ppm_90d 0.00 and spec_revision_count 0."
        test_recipe:
          setup:
            - "One program with a TIER_APPROVED NBE gap whose shelf_slots_quota is 2."
          setup_api_calls:
            - call: "POST /private-label/programs"
              payload: { brand_name: "Harvest Lane", retailer_name: "MidState Grocers", fiscal_year: 2026, dev_budget_cents: 5000000 }
              as: ProgramDirector
              as_user_id: "u-director-1"
              captures: { prog_id: $.data.id }
            - call: "POST /private-label/category-gaps"
              payload: { program_id: "${prog_id}", category_code: "CRACKERS", national_brand_name: "Sunbite", nb_retail_price_cents: 360, category_annual_sales_cents: 250000000, pl_share_pct: 20.0, unit_velocity_per_week: 520, shelf_slots_quota: 2 }
              as: SourcingManager
