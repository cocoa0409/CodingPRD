              as: Pharmacist
              captures: { pr1: $.data.id }
            - call: "POST /appointments/${ap1}/drug-preparations"
              payload: { units_requested: 1 }
              as: Pharmacist
              captures: { pr2: $.data.id }
          trigger:
            - call: "POST /appointments/${ap1}/drug-preparations"
