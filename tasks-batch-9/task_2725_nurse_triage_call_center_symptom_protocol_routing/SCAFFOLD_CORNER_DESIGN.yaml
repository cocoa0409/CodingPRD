        excluded_because:
          difficulty_instance: assign_nurse_call_state_priority_17_beats_nurse_capacity_priority_51_rejected
          rationale: "§1.8 already violates both rules in a single assign-nurse call on an already-ASSIGNED call whose preferred nurse is saturated and asserts the priority-17 error, so a §1.9 duplicate would add no coverage."

      - name: disposition_priority_conflict_between_licensure_and_assessment_mismatch
        claim_type: Priority Ordering
        grounds:
          - validations[priority=24]        # ERR_NURSE_NOT_LICENSED_IN_STATE
          - validations[priority=34]        # ERR_ASSESSMENT_CALL_MISMATCH
        excluded_because:
          difficulty_instance: disposition_licensure_priority_24_beats_assessment_mismatch_priority_34_rejected
          rationale: "§1.8 posts a disposition that is both unlicensed for the caller's state and built on the sibling call's assessment, and asserts the priority-24 error, which is exactly the Priority Ordering claim for this pair."

      - name: nurse_shift_temporal_overlap_validation
        claim_type: Temporal validation
        grounds:
          - validations[priority=40]        # ERR_SHIFT_OVERLAP
