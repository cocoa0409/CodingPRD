# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_ORG, http: 403, condition: "OrgOwner acting on a resource owned by a different org" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine precondition violated or transition from terminal state" }
  - { id: ERR_ORG_SUSPENDED, http: 409, condition: "Org standing SUSPENDED or migration MIGRATED blocks the business write" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "coverage_start >= coverage_end, term_start > term_end, or malformed date" }
  - { id: ERR_SUBSCRIPTION_OVERLAP, http: 409, condition: "Half-open coverage interval collides with existing same-tier subscription (adjacency allowed)" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Closed term interval collides with existing same-platform agreement (adjacency counts as conflict)" }
  - { id: ERR_LTS_WINDOW_OVERLAP, http: 409, condition: "Closed LTS window collides with another version on the same major_line" }
  - { id: ERR_VERSION_UNSUPPORTED, http: 422, condition: "Referenced editor version missing or SUNSET at project create/ship" }
  - { id: ERR_AGREEMENT_INACTIVE, http: 409, condition: "Export build references agreement that is missing, wrong platform, wrong org, or not ACTIVE" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "Declaration/report for an already-covered period, or duplicate version_string/change_code" }
  - { id: ERR_TIER_FEATURE_NOT_ALLOWED, http: 422, condition: "Tier lacks marketplace selling, console export, or education eligibility" }
  - { id: ERR_SEAT_CAPACITY, http: 409, condition: "Assign with no available seats or release with no active seats" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount != outstanding balance, or pay on zero-outstanding invoice" }
  - { id: ERR_WAIVER_NOT_ALLOWED, http: 422, condition: "Invoice ineligible for waiver or amount exceeds cap" }
  - { id: ERR_MIGRATION_BLOCKED, http: 409, condition: "Migration completion blocked: unpaid invoices, open audit, or cooling-off not elapsed" }
  - { id: ERR_AUDIT_IN_PROGRESS, http: 409, condition: "Install report submission blocked by open audit case" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch on expected_org_version / expected_project_version" }
  - { id: ERR_PROJECT_FROZEN, http: 409, condition: "Project FROZEN (editor SUNSET) or ARCHIVED — no new install reports or exports" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing/invalid required fields, bad enum, negative amounts" }
  - { id: ERR_BUYER_IS_CREATOR, http: 422, condition: "Org attempts to purchase its own asset listing" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 409, condition: "Refund attempted more than 14 days after purchased_at or on already-REFUNDED purchase" }
  - { id: ERR_APPEAL_EXHAUSTED, http: 409, condition: "Appeal on case with appeal_count >= 2 or case not CONVERTED" }
  - { id: ERR_POLICY_WINDOW_TOO_SHORT, http: 422, condition: "Activating retroactive policy with grandfather_window_days < 30" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Engine platform operator; superset role with override power"
    identity: opaque
    exclusive_operations:
      - "create/supersede tier configs"
      - "register editor versions and advance support lifecycle"
      - "create/activate/rescind policy changes"
      - "activate/revoke export agreements"
      - "register orgs"
    shared_operations:
      - "read any resource"
      - "refund purchases"
      - "open audit cases"
      - "set logical clock"
  - name: OrgOwner
    description: "Owner of a DeveloperOrg; manages own org's seats, projects, reports, listings, agreements, migration"
    identity: "entity_backed:DeveloperOrg"
    exclusive_operations:
      - "submit/revise install reports for own org's projects"
      - "assign/release seats"
      - "ship projects"
      - "submit/revise/delist own listings, purchase others' listings"
      - "request export agreements and record export builds"
      - "appeal audit conversions"
      - "start/advance own migration assessment"
    shared_operations:
      - "declare revenue for own org"
      - "read own org resources and public reference data (tiers, editor versions)"
  - name: FinanceOps
    description: "Billing operator; finalizes, collects, and waives invoices"
    identity: opaque
    exclusive_operations:
      - "finalize invoices"
      - "record invoice payments"
      - "waive eligible invoices"
    shared_operations:
      - "read any resource"
      - "refund purchases"
  - name: Auditor
    description: "Compliance auditor for tier eligibility"
    identity: opaque
    exclusive_operations:
      - "request evidence on audit cases"
      - "resolve audit cases (CLEAR/CONVERT)"
    shared_operations:
      - "read any resource"
      - "open audit cases"
  - name: ReviewBoard
    description: "Content and install-report reviewer"
    identity: opaque
    exclusive_operations:
      - "review install reports (REVIEW/ACCEPT/DISPUTE)"
      - "review asset listings (APPROVE/REJECT)"
    shared_operations:
      - "read projects, reports, listings, tiers, editor versions"
