  # =====================================================================
  - section: consistency_model
    instances:
      - name: credit_balance_visible_immediately_after_missed_event
        claim_type: immediate
        grounds: [entities.ServiceAccount.fields.credit_balance_cents, calculations.account_balance]
        distinguishing_aspect: "Immediately after a MISSED event issues a 300 credit, GET /accounts/{id} reflects credit_balance_cents == 300 in the same flow (no lag)."
        test_recipe:
          setup: ["An ACTIVE STANDARD account; first TRASH schedule reported MISSED."]
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "98 Oak St", holder_name: "Ss N" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "TRASH" }
              as: Dispatcher
              captures: { s0_id: $.data.0.id, s0_eff: $.data.0.effective_pickup_date }
