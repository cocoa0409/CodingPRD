          assert:
            - "Endorsement.${end_peak}.status == REJECTED with premium_cents 0, decision_note stored, decided_by_user_id set and version 2"
            - "no PremiumTransaction was appended: the ledger still holds 2 rows summing to 269200"
            - "FarmPolicy.${pol_id}.version is still 2 and endorsement_premium_cents is 0"
            - "the rescind attempt returns HTTP 409 ERR_ENDORSEMENT_NOT_APPROVED and changes nothing"

      - name: corner_endorsement_rescission_removes_its_premium
        claim_type: side_effect_execution
        grounds: ["state_machines.Endorsement[APPROVED->RESCINDED]", "endpoints.POST_/endorsements/{id}/rescind", "calculations.premium_rollup"]
        distinguishing_aspect: "Rescinding an APPROVED endorsement appends an ENDORSEMENT_REMOVE row with reason_code ENDORSEMENT_RESCISSION, zeroes premium_cents on the row and walks base / total back down, leaving cat_load_cents untouched."
        test_recipe:
          setup:
