  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_visibility
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: every mutation (charge, tap, disposition credit) is visible in the very next GET without any delay — the tap response itself shows remaining_metal_kg and the following GET returns identical values."
