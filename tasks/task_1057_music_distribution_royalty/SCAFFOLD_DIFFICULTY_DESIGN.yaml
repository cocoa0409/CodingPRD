          assert:
            - "Before pay: Collaborator.${c1}.pending_payout_cents == 2000, lifetime_paid_cents == 0, reversed_payout_cents == 0 (settled total 2000)"
            - "After pay: Collaborator.${c1}.pending_payout_cents == 0, lifetime_paid_cents == 2000, reversed_payout_cents == 0 (settled total 2000)"
            - "After reverse: Collaborator.${c1}.pending_payout_cents == 0, lifetime_paid_cents == 0, reversed_payout_cents == 2000 (settled total 2000)"
            - "Payout.${payout_id}.status == REVERSED"
            - "Payout.${payout_id}.reversal_reason_code == BANK_RETURNED"
            - "RoyaltyStatement.${stmt_id}.net_cents == 2000 and is unchanged by the pay/reverse pair"

      - name: submit_then_withdraw_conserves_subscription_release_slots
        grounds:
          - calculations.release_slot_usage
          - state_machines.Release.DRAFT_to_SUBMITTED
          - state_machines.Release.SUBMITTED_to_DRAFT
          - entities.Subscription.fields.releases_used
          - entities.SubscriptionPlan.fields.included_release_slots
        distinguishing_aspect: |
          Conserved quantity of a different type — a NON-MONETARY slot count:
          Subscription.releases_used equals count(Release with status IN {SUBMITTED, IN_REVIEW,
          APPROVED, LIVE}) and returns to its pre-submit value of 1 after the compensating withdraw,
          proving the counter is recomputed from the release set rather than incremented blindly.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Plan DUO with included_release_slots == 2."
            - "Artist FORNAX on an ACTIVE DUO subscription."
            - "Release ONE already SUBMITTED (releases_used == 1) and release TWO still in DRAFT, each with one track."
