              payload: { lot_code: "PG1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 100000, unit_count: 10, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
