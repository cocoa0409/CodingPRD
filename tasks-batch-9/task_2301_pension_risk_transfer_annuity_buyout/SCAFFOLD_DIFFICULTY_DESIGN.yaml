  - rule: compensating_invariant
    instances:
      - name: abandonment_conserves_insurer_capacity_and_never_touches_plan_liability
        grounds:
          - state_machines.BuyoutTranche.PRICING_LOCKED_to_ABANDONED
          - calculations.insurer_committed_capacity
          - entities.Insurer.fields.capacity_cents
          - entities.PensionPlan.fields.total_liability_cents
        distinguishing_aspect: |
          The conserved quantity is the identity capacity_cents ==
          committed_capacity_cents + available_capacity_cents, and abandonment is
          the compensating action that must restore its split exactly, not
          approximately. The instance locks 12000000 of a 20000000 capacity,
          abandons from PRICING_LOCKED, and requires the insurer to return to
          committed 0 / available 20000000 with the locked quote moved to EXPIRED
          rather than left LOCKED. The second invariant is negative and is where
          naive implementations drift: abandonment must NOT touch
          plan.total_liability_cents, plan.plan_assets_cents,
          cumulative_settlement_charge_cents or the SettlementEntry ledger,
          because liability only leaves the plan at settlement. Proof of true
          restoration is that a rebuilt tranche re-locks the identical 12000000
          afterward — if the first lock had leaked capacity, the rebuild would
          fail with ERR_INSURER_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a PensionPlan (total_liability 100000000, assets 92000000) authorized with amendment_scope BUYOUT_ONLY and an AFFIRMATIVE expert opinion"
            - "one cleansed DEFERRED_VESTED participant at stated monthly 100000"
