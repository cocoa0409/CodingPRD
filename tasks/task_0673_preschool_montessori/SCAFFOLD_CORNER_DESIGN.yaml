scaffold_corner_design:
  # =====================================================================
  - section: entities
    instances:
      - name: create_classroom_returns_201_with_computed_defaults
        claim_type: Creation
        grounds: [entities.Classroom, endpoints]
        distinguishing_aspect: "POST /classrooms with all required fields returns 201 with placed_count=0, assigned_staff_count=0, compliance_status=COMPLIANT, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary Z", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
          assert:
            - "Response status 201; data.placed_count == 0; data.assigned_staff_count == 0; data.compliance_status == COMPLIANT; data.version == 1"

      - name: get_classroom_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Classroom, endpoints]
        distinguishing_aspect: "GET /classrooms/{id} returns the stored classroom with matching id and fields."
        test_recipe:
          setup: ["A created classroom."]
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary Z", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
          trigger:
            - call: "GET /montessori/classrooms/${room_id}"
              payload: {}
              as: Registrar
              captures: { got: $.data.id }
          assert:
            - "Response status 200; data.id == ${room_id}; data.name == 'Primary Z'"

      - name: list_classrooms_paginated_envelope
        claim_type: Listing
        grounds: [entities.Classroom, endpoints]
        distinguishing_aspect: "GET /classrooms returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two classrooms created."]
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Room 1", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
            - call: "POST /montessori/classrooms"
              payload: { name: "Room 2", level: "TODDLER", capacity: 6, min_age_months: 18, max_age_months: 36 }
              as: ComplianceOfficer
          trigger:
            - call: "GET /montessori/classrooms"
              payload: { limit: 1, offset: 0 }
              as: Registrar
          assert:
            - "Response response_type == array; meta.total_count == 2; data length == 1; has_more == true"

      - name: get_classroom_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Classroom, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /classrooms/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /montessori/classrooms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Response status 404; data.error_id == ERR_NOT_FOUND"

      - name: create_tier_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.TuitionTier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tiers omitting required base_annual_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /montessori/tiers"
              payload: { code: "BADTIER", level: "PRIMARY", deposit_pct: 0.10 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Response status 400; data.error_id == ERR_INVALID_REQUEST"

      - name: tier_installments_default_applied
        claim_type: Defaults
        grounds: [entities.TuitionTier.fields.installments]
        distinguishing_aspect: "POST /tiers omitting installments applies default 10."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /montessori/tiers"
              payload: { code: "DEFTIER", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10 }
              as: Registrar
              captures: { inst: $.data.installments }
          assert:
            - "Response status 201; data.installments == 10; data.extended_day_annual_cents == 0; data.active == true"

      - name: deposit_computed_off_base_not_net
        claim_type: Computed Fields
        grounds: [entities.Enrollment.fields.deposit_cents, calculations.deposit]
        distinguishing_aspect: "Enrollment.deposit_cents == round_half_up(base_annual_cents * deposit_pct) independent of sibling/extended-day/aid; STANDARD base 1000000 deposit_pct 0.10 yields 100000."
        test_recipe:
          setup: ["Clock 2026-09-01. STANDARD tier base 1000000 deposit_pct 0.10. PRIMARY room compliant. Child enrolling."]
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { dep: $.data.deposit_cents }
          assert:
            - "data.deposit_cents == 100000; data.net_annual_cents == 1000000; data.monthly_installment_cents == 100000"

      - name: tier_invalid_level_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.TuitionTier.fields.level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /tiers with level outside {TODDLER, PRIMARY, ELEMENTARY} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /montessori/tiers"
              payload: { code: "X", level: "MIDDLE_SCHOOL", base_annual_cents: 1000000, deposit_pct: 0.10 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Response status 400; data.error_id == ERR_INVALID_REQUEST"

      - name: observation_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Observation]
        distinguishing_aspect: "Observation has common_fields:false — its create response exposes id and created_at but no version field and there is no update/transition endpoint."
        test_recipe:
          setup: ["A classroom."]
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
          trigger:
            - call: "POST /montessori/observations"
              payload: { classroom_id: "${room_id}", observer_name: "V", window_start_at: "2026-10-01T15:00:00Z", window_end_at: "2026-10-01T15:30:00Z" }
              as: ComplianceOfficer
              captures: { obs_id: $.data.id }
          assert:
            - "Response status 201; data.id present; data.created_at present; data has no 'version' key"

      - name: application_with_nonexistent_student_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Application.fields.student_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /applications referencing a nonexistent student_id returns ERR_NOT_FOUND (404) — body FK existence validated."
        test_recipe:
          setup: ["A classroom and tier exist; no such student."]
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10 }
              as: Registrar
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /montessori/applications"
              payload: { student_id: "00000000-0000-4000-8000-000000000000", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Response status 404; data.error_id == ERR_NOT_FOUND"

      - name: flat_fk_enrollment_filter_by_student_id
        claim_type: Creation
        grounds: [entities.Enrollment.fields.student_id, endpoints]
        distinguishing_aspect: "Flat topology FK integrity: GET /enrollments?student_id=X returns the enrollment whose student_id == X (reverse-reachability)."
        test_recipe:
          setup: ["A child enrolled (PLACED) in a compliant PRIMARY room."]
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "GET /montessori/enrollments"
              payload: { student_id: "${stu_id}" }
              as: Registrar
          assert:
            - "Response response_type == array; data length == 1; data[0].id == ${enr_id}; data[0].student_id == ${stu_id}"

  # =====================================================================
  - section: state_machines
    instances:
      - name: start_review_from_already_under_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Application.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling start-review twice: the second call (status already UNDER_REVIEW) returns ERR_INVALID_STATE (409); no version change."
        test_recipe:
          setup: ["An Application moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409; data.error_id == ERR_INVALID_STATE"

      - name: application_initial_state_is_submitted
        claim_type: Initial State
        grounds: [state_machines.Application, entities.Application.fields.status]
        distinguishing_aspect: "A newly created Application has status == SUBMITTED and version == 1."
        test_recipe:
          setup: ["A classroom, tier, and student exist."]
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { st: $.data.status }
          assert:
            - "Response status 201; data.status == SUBMITTED; data.version == 1; data.priority_score == 0"

      - name: terminal_enrolled_application_rejects_decline
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Application, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An ENROLLED Application is terminal: POST /applications/{id}/decline-offer returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A child ENROLLED (Application terminal ENROLLED) in a compliant room."]
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
          trigger:
            - call: "POST /montessori/applications/${app_id}/decline-offer"
              payload: {}
              as: Parent
              as_user_id: "parent-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409; data.error_id == ERR_INVALID_STATE"

      - name: no_show_before_end_at_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ConferenceSlot.BOOKED_to_NO_SHOW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "no-show on a BOOKED slot is rejected with ERR_INVALID_STATE while the clock is before slot.end_at (precondition current_clock >= end_at not met)."
        test_recipe:
          setup: ["Clock 2026-09-01. A guide slot 2026-10-01 15:00-15:30 BOOKED by an enrolled child; clock still 2026-09-01 (before end_at)."]
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/conference-slots"
              payload: { guide_user_id: "guide-1", classroom_id: "${room_id}", start_at: "2026-10-01T15:00:00Z", end_at: "2026-10-01T15:30:00Z" }
              as: Guide
              as_user_id: "guide-1"
              captures: { slot_id: $.data.id }
            - call: "POST /montessori/conference-slots/${slot_id}/book"
              payload: { booked_student_id: "${stu_id}" }
              as: Parent
              as_user_id: "parent-1"
          trigger:
            - call: "POST /montessori/conference-slots/${slot_id}/no-show"
              payload: {}
              as: Guide
              as_user_id: "guide-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409; data.error_id == ERR_INVALID_STATE (clock before end_at)"

      - name: cancel_slot_clears_booked_student_compensation
        claim_type: Side Effect Execution
        grounds: [state_machines.ConferenceSlot.OPEN or BOOKED_to_CANCELLED, entities.ConferenceSlot.fields.booked_student_id]
        distinguishing_aspect: "Cancelling a BOOKED slot sets status CANCELLED and clears booked_student_id to null."
        test_recipe:
          setup: ["A BOOKED conference slot for an enrolled child."]
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Room", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/conference-slots"
              payload: { guide_user_id: "guide-1", classroom_id: "${room_id}", start_at: "2026-10-01T15:00:00Z", end_at: "2026-10-01T15:30:00Z" }
              as: Guide
              as_user_id: "guide-1"
              captures: { slot_id: $.data.id }
            - call: "POST /montessori/conference-slots/${slot_id}/book"
