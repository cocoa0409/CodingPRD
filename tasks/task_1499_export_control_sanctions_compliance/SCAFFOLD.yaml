scenario: |
  Export Control & Sanctions Compliance (corporate trade compliance office): product/technology classification (ECCN/USML) & jurisdiction determination, license requirement analysis by destination/end-user/end-use, restricted party screening at order & shipment, deemed export & foreign national access control, license application & condition tracking, technology control plan & data segregation, violation identification & voluntary self-disclosure, recordkeeping & audit

domain_name: export-control-compliance
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Product SKU code" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: controlled_content_pct, type: number, source: input, description: "Percent of controlled-origin content (0-100 inclusive) used for de minimis analysis" }
      - { name: unit_value_cents, type: integer, source: input, description: "Unit value in cents; must be > 0" }
      - { name: active_classification_id, type: string, source: computed, description: "id of the currently ACTIVE Classification for this product; null when none (not an FK declaration; see Classification.product_id for the owning relation)" }
      - { name: classification_count, type: integer, source: computed, default: 0, description: "Number of Classification records ever created for this product; monotone, never decremented" }
      - { name: status, type: enum, source: computed, description: "UNCLASSIFIED | CLASSIFIED — CLASSIFIED iff active_classification_id is non-null" }

  - name: Classification
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product this determination applies to" }
      - { name: jurisdiction, type: enum, source: input, description: "EAR | ITAR — jurisdiction determination" }
      - { name: classification_code, type: string, source: input, description: "ECCN (e.g. '5A002'), 'EAR99', or USML category (e.g. 'XI')" }
      - { name: determination_basis, type: enum, source: input, description: "SELF_CLASSIFICATION | CCATS | CJ_DETERMINATION" }
      - { name: sequence, type: integer, source: system, description: "Per-product monotone sequence assigned at creation: equals Product.classification_count at creation time (after increment)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | REJECTED | SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit; SoD anchor" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID captured at review; null until reviewed" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Party legal name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-3 country code, e.g. 'IRN'" }
      - { name: city, type: string, source: input, description: "City of principal address" }
      - { name: party_type, type: enum, source: input, description: "CUSTOMER | CONSIGNEE | END_USER | FOREIGN_NATIONAL" }
      - { name: is_foreign_national, type: boolean, source: input, default: false, description: "True if the party is a foreign national person (deemed-export scope)" }
      - { name: screening_posture, type: enum, source: computed, default: "UNSCREENED", description: "UNSCREENED | CLEAR | REVIEW_REQUIRED | BLOCKED — derived from ScreeningResult set per calculation party_screening_posture" }
      - { name: active_grant_count, type: integer, source: computed, default: 0, description: "Count of AccessGrant rows for this party with status ACTIVE" }
      - { name: last_screened_at, type: datetime, source: computed, description: "created_at of the most recent ScreeningResult for this party; null when never screened" }

  - name: ScreeningListEntry
    parent: null
    common_fields: true
    fields:
      - { name: list_source, type: enum, source: input, description: "SDN | DENIED_PERSONS | ENTITY_LIST | EMBARGOED_COUNTRY" }
      - { name: match_name, type: string, source: input, description: "Name text to match against Party.legal_name (for EMBARGOED_COUNTRY entries this is informational; embargo matching uses country_code only)" }
      - { name: country_code, type: string, source: input, description: "ISO alpha-3 country associated with the entry" }
      - { name: severity, type: enum, source: input, description: "PROHIBITED | RESTRICTED — PROHIBITED entries cannot be licensed around; RESTRICTED entries drive POTENTIAL_MATCH review" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE — initial ACTIVE" }

  - name: ScreeningResult
    parent: null
    common_fields: true
    fields:
      - { name: party_id, type: string, source: input, description: "FK -> Party.id; screened party" }
      - { name: trigger_context, type: enum, source: system, description: "ORDER | SHIPMENT | MANUAL | LIST_CHANGE" }
      - { name: matched_entry_id, type: string, source: system, description: "FK -> ScreeningListEntry.id; best-match entry; null when outcome CLEAR" }
      - { name: algorithm_variant, type: enum, source: system, description: "EXACT | FUZZY — EXACT for ORDER context, FUZZY otherwise" }
      - { name: score, type: number, source: computed, description: "Best match score, 2 decimal places round_half_up; 0.00 when CLEAR" }
      - { name: threshold_used, type: number, source: computed, description: "Threshold the score was compared against (0.85 for PROHIBITED entries, 0.70 otherwise); null when CLEAR" }
      - { name: status, type: enum, source: system, description: "CLEAR | POTENTIAL_MATCH | FALSE_POSITIVE | CONFIRMED_MATCH" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID captured at resolve; null until resolved" }

  - name: ExportOrder
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: party_id, type: string, source: input, description: "FK -> Party.id; the end user" }
      - { name: destination_country, type: string, source: input, description: "ISO alpha-3 destination country" }
      - { name: end_use, type: enum, source: input, description: "CIVILIAN | MILITARY | DUAL_USE" }
      - { name: quantity, type: integer, source: input, description: "Ordered units; must be > 0" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; set by attach-license; null until attached" }
      - { name: provisional_determination, type: enum, source: computed, description: "NOT_REQUIRED | LICENSE_REQUIRED | PROHIBITED — computed at creation via license_determination provisional variant" }
      - { name: determination, type: enum, source: computed, description: "NOT_REQUIRED | LICENSE_REQUIRED | PROHIBITED — final determination computed at submit; null until submitted" }
      - { name: determination_classification_sequence, type: integer, source: system, description: "Sequence of the ACTIVE Classification pinned at submit; null until submitted (version-pinning)" }
      - { name: goods_value_cents, type: integer, source: computed, description: "= quantity * Product.unit_value_cents, computed at creation" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Compliance surcharge per calculation order_total_value" }
      - { name: total_value_cents, type: integer, source: computed, description: "= goods_value_cents + surcharge_cents" }
      - { name: accumulated_fees_cents, type: integer, source: computed, default: 0, description: "Sum of per-shipment rounded compliance fees (calculation shipment_compliance_fee)" }
      - { name: shipped_quantity, type: integer, source: computed, default: 0, description: "Sum of quantity over shipments in status RELEASED | IN_TRANSIT | DELIVERED" }
      - { name: pre_hold_status, type: enum, source: system, description: "CLEARED | LICENSED | null — records which status an auto-held order returns to on release-hold" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | CLEARED | HELD | LICENSED | RELEASED | CLOSED | CANCELLED" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: issuing_authority, type: enum, source: input, description: "BIS | DDTC | OFAC" }
      - { name: approved_value_cents, type: integer, source: input, description: "Total authorized value in cents; must be > 0" }
      - { name: approved_quantity, type: integer, source: input, description: "Total authorized units; must be > 0" }
      - { name: valid_from, type: string, source: input, description: "First valid date, YYYY-MM-DD (inclusive)" }
      - { name: valid_until, type: string, source: input, description: "Last valid date, YYYY-MM-DD (inclusive); must be >= valid_from" }
      - { name: conditions, type: array, source: input, default: [], description: "Array of condition codes: NO_REEXPORT | NO_MILITARY_END_USE | QUARTERLY_REPORTING" }
      - { name: license_number, type: string, source: system, description: "Assigned at approval: 'LIC-' + 6-digit zero-padded monotone counter starting at 000001; null until APPROVED" }
      - { name: remaining_value_cents, type: integer, source: computed, description: "Initialized to approved_value_cents at approval; decremented/restored by shipment release/return" }
      - { name: remaining_quantity, type: integer, source: computed, description: "Initialized to approved_quantity at approval; decremented/restored by shipment release/return" }
      - { name: consumed_value_cents, type: integer, source: computed, default: 0, description: "Sum of consumed_value_cents over shipments in RELEASED | IN_TRANSIT | DELIVERED against this license" }
      - { name: consumed_quantity, type: integer, source: computed, default: 0, description: "Sum of quantity over shipments in RELEASED | IN_TRANSIT | DELIVERED against this license" }
      - { name: applicant_user_id, type: string, source: system, description: "X-User-ID captured at submit; SoD anchor" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID captured at review; null until reviewed" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | RETURNED_FOR_INFO | EXPIRED | EXHAUSTED | REVOKED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ExportOrder.id" }
      - { name: quantity, type: integer, source: input, description: "Units in this shipment; must be > 0" }
      - { name: planned_ship_date, type: string, source: input, description: "Planned ship date, YYYY-MM-DD" }
      - { name: screening_result_id, type: string, source: system, description: "id of the ScreeningResult created by this shipment's screen action; null until screened (not an FK declaration)" }
      - { name: consumed_value_cents, type: integer, source: computed, description: "= quantity * Product.unit_value_cents of the parent order's product; computed at release; 0 before release" }
      - { name: fee_cents, type: integer, source: computed, description: "Per-shipment compliance fee per calculation shipment_compliance_fee; 0 before release" }
      - { name: status, type: enum, source: system, description: "PLANNED | SCREENED | HELD | RELEASED | IN_TRANSIT | DELIVERED | RETURNED | CANCELLED" }

  - name: TechnologyControlPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "TCP name" }
      - { name: enclave_id, type: string, source: input, description: "Identifier of the segregated data enclave / lab zone governed by this plan" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; controlled technology covered" }
      - { name: segregation_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 — data-segregation strictness" }
      - { name: effective_from, type: string, source: input, description: "First effective date, YYYY-MM-DD (closed interval start)" }
      - { name: effective_to, type: string, source: input, description: "Last effective date, YYYY-MM-DD (closed interval end); must be >= effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: tcp_id, type: string, source: input, description: "FK -> TechnologyControlPlan.id" }
      - { name: party_id, type: string, source: input, description: "FK -> Party.id; must reference a party with is_foreign_national = true" }
      - { name: start_date, type: string, source: input, description: "First access date, YYYY-MM-DD (half-open interval start, inclusive)" }
      - { name: end_date, type: string, source: input, description: "End of access, YYYY-MM-DD (half-open interval end, EXCLUSIVE); must be > start_date" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID captured at creation; SoD anchor" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID captured at review; null until reviewed" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | ACTIVE | REVOKED | EXPIRED" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: source_type, type: enum, source: input, description: "ORDER | SHIPMENT | ACCESS_GRANT | SCREENING | OTHER" }
      - { name: source_id, type: string, source: input, description: "Polymorphic id of the source entity (interpreted via source_type; not an FK declaration)" }
      - { name: severity, type: enum, source: input, description: "MINOR | MATERIAL | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text description of the suspected violation" }
      - { name: identified_by_user_id, type: string, source: system, description: "X-User-ID captured at creation; SoD anchor" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID captured at SUBSTANTIATE/DISMISS; null until adjudicated" }
      - { name: disclosure_reference, type: string, source: system, description: "Assigned at VSD submission: 'VSD-' + 6-digit zero-padded monotone counter starting at 000001; null until DISCLOSED" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | UNDER_REVIEW | SUBSTANTIATED | UNFOUNDED | DISCLOSED | CLOSED" }

  - name: AuditRecord
    parent: null
    common_fields: false
    fields:
      - { name: event_type, type: enum, source: system, description: "CLASSIFICATION_ACTIVATED | LICENSE_APPROVED | LICENSE_REVOKED | ORDER_RELEASED | SHIPMENT_RELEASED | SHIPMENT_RETURNED | GRANT_ACTIVATED | GRANT_REVOKED | SCREENING_CONFIRMED_MATCH | VSD_SUBMITTED | VIOLATION_CLOSED" }
      - { name: entity_type, type: string, source: system, description: "Entity type of the audited event subject, e.g. 'License'" }
      - { name: entity_id, type: string, source: system, description: "Polymorphic id of the audited event subject (interpreted via entity_type; not an FK declaration)" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor whose action produced the event" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor whose action produced the event" }
      - { name: detail, type: string, source: system, description: "Human-readable event summary" }
      - { name: retain_until, type: datetime, source: system, description: "= created_at + 1825 days (5-year recordkeeping retention); purge deletes only records with retain_until strictly before the current clock" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    initial_state: UNCLASSIFIED
    terminal_states: []
    transitions:
      - from: UNCLASSIFIED
        to: CLASSIFIED
        trigger: "system (automatic when a Classification for this product becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "active_classification_id set to the newly ACTIVE classification"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "system (automatic when a newer Classification activates; active_classification_id repoints)"
        actor: system
        preconditions: []
        side_effects:
          - "active_classification_id repointed to the newly ACTIVE classification"
        note: "Product never returns to UNCLASSIFIED; SUPERSEDED classifications do not unset the pointer"

  - entity: Classification
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance/classifications/{id}/submit"
        actor: ComplianceAnalyst
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /compliance/classifications/{id}/review with decision=APPROVE"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "any other Classification of the same product with status ACTIVE -> SUPERSEDED"
          - "Product.active_classification_id := this classification; Product.status := CLASSIFIED; increments Product.version by 1"
          - "writes AuditRecord(CLASSIFICATION_ACTIVATED, entity_type='Classification')"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/classifications/{id}/review with decision=REJECT"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /compliance/classifications/{id}/revise"
        actor: ComplianceAnalyst
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE)"
        side_effects: []
        note: "revision loop: REJECTED determinations return to DRAFT for editing and resubmission"

  - entity: ExportOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /compliance/orders/{id}/submit"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "Product of product_id has status CLASSIFIED (ERR_CLASSIFICATION_REQUIRED)"
        side_effects:
          - "creates ScreeningResult for party_id with trigger_context=ORDER, algorithm_variant=EXACT"
          - "recomputes final determination via license_determination final variant; sets determination and determination_classification_sequence (pinned ACTIVE classification sequence)"
          - "Party.last_screened_at and screening_posture recomputed"
          - "auto-continues to CLEARED or HELD (see below)"
      - from: IN_REVIEW
        to: CLEARED
        trigger: "system (automatic at submit when screening outcome is CLEAR and determination != PROHIBITED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: HELD
        trigger: "system (automatic at submit when screening outcome is POTENTIAL_MATCH or CONFIRMED_MATCH, or determination == PROHIBITED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_hold_status := null (review hold returns to CLEARED)"
      - from: HELD
        to: CLEARED
        trigger: "POST /compliance/orders/{id}/release-hold"
        actor: ComplianceManager
        preconditions:
          - "status == HELD (ERR_INVALID_STATE)"
          - "Party.screening_posture == CLEAR (ERR_SCREENING_REVIEW_PENDING when REVIEW_REQUIRED, ERR_PARTY_BLOCKED when BLOCKED)"
          - "determination != PROHIBITED (ERR_ORDER_PROHIBITED)"
          - "if pre_hold_status == LICENSED: attached License status == APPROVED (ERR_INVALID_STATE) and valid_from <= current date <= valid_until (ERR_LICENSE_WINDOW_INVALID)"
        side_effects:
          - "status := pre_hold_status if pre_hold_status is non-null else CLEARED; pre_hold_status := null"
        note: "an order auto-held from LICENSED returns to LICENSED; a review-held order returns to CLEARED"
      - from: CLEARED
        to: LICENSED
        trigger: "POST /compliance/orders/{id}/attach-license"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == CLEARED (ERR_INVALID_STATE)"
          - "determination == LICENSE_REQUIRED (ERR_LICENSE_NOT_REQUIRED)"
          - "License exists (ERR_NOT_FOUND) and status == APPROVED (ERR_INVALID_STATE)"
          - "License.product_id == order.product_id (ERR_LICENSE_PRODUCT_MISMATCH)"
          - "License.valid_from <= current date <= License.valid_until (ERR_LICENSE_WINDOW_INVALID)"
        side_effects:
          - "license_id := license id"
      - from: CLEARED
        to: RELEASED
        trigger: "POST /compliance/orders/{id}/release"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == CLEARED (ERR_INVALID_STATE)"
          - "determination == NOT_REQUIRED (ERR_LICENSE_REQUIRED)"
        side_effects:
          - "writes AuditRecord(ORDER_RELEASED, entity_type='ExportOrder')"
      - from: LICENSED
        to: RELEASED
        trigger: "POST /compliance/orders/{id}/release"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == LICENSED (ERR_INVALID_STATE)"
          - "attached License status == APPROVED (ERR_INVALID_STATE)"
          - "License.valid_from <= current date <= License.valid_until (ERR_LICENSE_WINDOW_INVALID)"
        side_effects:
          - "writes AuditRecord(ORDER_RELEASED, entity_type='ExportOrder')"
      - from: CLEARED
        to: HELD
        trigger: "system (cascade: party screening_posture becomes REVIEW_REQUIRED or BLOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_hold_status := CLEARED"
        note: "a CLEARED order never has shipments (creation requires LICENSED | RELEASED), so no shipment cascade fires here"
      - from: LICENSED
        to: HELD
        trigger: "system (cascade: attached License REVOKED, or party screening_posture becomes REVIEW_REQUIRED or BLOCKED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_hold_status := LICENSED; license_id retained"
          - "shipments of this order in PLANNED or SCREENED -> HELD"
      - from: RELEASED
        to: CLOSED
        trigger: "system (automatic when every shipment of the order is in a terminal state and sum of DELIVERED shipment quantity == order.quantity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /compliance/orders/{id}/cancel"
        actor: TradeOpsSpecialist
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: CANCELLED
        trigger: "POST /compliance/orders/{id}/cancel"
        actor: TradeOpsSpecialist
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: CANCELLED
        trigger: "POST /compliance/orders/{id}/cancel"
        actor: TradeOpsSpecialist
        preconditions: []
        side_effects: []
      - from: HELD
        to: CANCELLED
        trigger: "POST /compliance/orders/{id}/cancel"
        actor: TradeOpsSpecialist
        preconditions: []
        side_effects: []

  - entity: License
    initial_state: DRAFT
    terminal_states: [DENIED, EXPIRED, EXHAUSTED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance/licenses/{id}/submit"
        actor: ComplianceAnalyst
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "Product of product_id has status CLASSIFIED (ERR_CLASSIFICATION_REQUIRED)"
        side_effects:
          - "applicant_user_id := X-User-ID"
      - from: RETURNED_FOR_INFO
        to: SUBMITTED
        trigger: "POST /compliance/licenses/{id}/submit (resubmission)"
        actor: ComplianceAnalyst
        preconditions:
          - "status == RETURNED_FOR_INFO (ERR_INVALID_STATE)"
        side_effects:
          - "applicant_user_id := X-User-ID (resubmission re-anchors SoD)"
        note: "resubmission loop"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /compliance/licenses/{id}/review with decision=APPROVE"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != applicant_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; license_number assigned (LIC-000001 sequence)"
          - "remaining_value_cents := approved_value_cents; remaining_quantity := approved_quantity"
          - "writes AuditRecord(LICENSE_APPROVED, entity_type='License')"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /compliance/licenses/{id}/review with decision=DENY"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != applicant_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: SUBMITTED
        to: RETURNED_FOR_INFO
        trigger: "POST /compliance/licenses/{id}/review with decision=RETURN"
        actor: ComplianceManager
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != applicant_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic after a shipment release or return when remaining_quantity == 0 or remaining_value_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []
        note: "EXHAUSTED -> APPROVED reactivation happens when a shipment RETURN restores remaining above 0"
      - from: EXHAUSTED
        to: APPROVED
        trigger: "system (automatic when a shipment RETURN restores remaining_quantity > 0 and remaining_value_cents > 0 and current date <= valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (sweep on POST /compliance/_clock/set_current_utc when current date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REVOKED
        trigger: "POST /compliance/licenses/{id}/revoke"
        actor: ComplianceDirector
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "orders with license_id == this license and status == LICENSED -> HELD (pre_hold_status := LICENSED)"
          - "shipments of those orders in PLANNED or SCREENED -> HELD"
          - "writes AuditRecord(LICENSE_REVOKED, entity_type='License')"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, RETURNED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCREENED
        trigger: "POST /compliance/shipments/{id}/screen"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == PLANNED or HELD (ERR_INVALID_STATE)"
        side_effects:
          - "creates ScreeningResult for the parent order's party with trigger_context=SHIPMENT, algorithm_variant=FUZZY; screening_result_id set"
          - "Party.last_screened_at and screening_posture recomputed"
          - "if outcome is POTENTIAL_MATCH or CONFIRMED_MATCH: shipment -> HELD instead of SCREENED"
      - from: HELD
        to: SCREENED
        trigger: "POST /compliance/shipments/{id}/screen (re-screen after review resolution)"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == PLANNED or HELD (ERR_INVALID_STATE)"
        side_effects:
          - "same as PLANNED -> SCREENED"
      - from: SCREENED
        to: RELEASED
        trigger: "POST /compliance/shipments/{id}/release"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == SCREENED (ERR_INVALID_STATE)"
          - "parent ExportOrder status == RELEASED (ERR_INVALID_STATE)"
          - "Party.screening_posture != BLOCKED (ERR_PARTY_BLOCKED) and != REVIEW_REQUIRED (ERR_SCREENING_REVIEW_PENDING)"
          - "if order.license_id non-null: License status == APPROVED (ERR_INVALID_STATE); License.valid_from <= current date <= valid_until (ERR_LICENSE_WINDOW_INVALID); NO_MILITARY_END_USE condition forbids order.end_use == MILITARY (ERR_LICENSE_CONDITION_VIOLATION); quantity <= License.remaining_quantity (ERR_LICENSE_QUANTITY_INSUFFICIENT); consumed_value_cents <= License.remaining_value_cents (ERR_LICENSE_VALUE_INSUFFICIENT)"
        side_effects:
          - "consumed_value_cents := quantity * Product.unit_value_cents; fee_cents computed per shipment_compliance_fee"
          - "License.remaining_quantity -= quantity; License.remaining_value_cents -= consumed_value_cents; License.consumed_quantity += quantity; License.consumed_value_cents += consumed_value_cents; increments License.version by 1"
          - "ExportOrder.accumulated_fees_cents += fee_cents; ExportOrder.shipped_quantity += quantity; increments ExportOrder.version by 1"
          - "if License.remaining_quantity == 0 or remaining_value_cents == 0: License -> EXHAUSTED"
          - "writes AuditRecord(SHIPMENT_RELEASED, entity_type='Shipment')"
      - from: RELEASED
        to: IN_TRANSIT
        trigger: "POST /compliance/shipments/{id}/advance with event=DEPART"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == RELEASED (ERR_INVALID_STATE)"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /compliance/shipments/{id}/advance with event=DELIVER"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == IN_TRANSIT (ERR_INVALID_STATE)"
        side_effects:
          - "ExportOrder.shipped_quantity unchanged (already counted); order auto-CLOSED check runs"
      - from: IN_TRANSIT
        to: RETURNED
        trigger: "POST /compliance/shipments/{id}/advance with event=RETURN"
        actor: TradeOpsSpecialist
        preconditions:
          - "status == IN_TRANSIT (ERR_INVALID_STATE)"
        side_effects:
          - "if order.license_id non-null: License.remaining_quantity += quantity; License.remaining_value_cents += consumed_value_cents; License.consumed_quantity -= quantity; License.consumed_value_cents -= consumed_value_cents; increments License.version by 1"
          - "ExportOrder.shipped_quantity -= quantity; increments ExportOrder.version by 1"
          - "if License was EXHAUSTED and remaining_quantity > 0 and remaining_value_cents > 0 and current date <= valid_until: License -> APPROVED"
          - "writes AuditRecord(SHIPMENT_RETURNED, entity_type='Shipment')"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /compliance/shipments/{id}/advance with event=CANCEL"
        actor: TradeOpsSpecialist
        preconditions:
          - "status in PLANNED | SCREENED | HELD (ERR_INVALID_STATE)"
        side_effects: []
      - from: SCREENED
        to: CANCELLED
        trigger: "POST /compliance/shipments/{id}/advance with event=CANCEL"
        actor: TradeOpsSpecialist
        preconditions:
          - "status in PLANNED | SCREENED | HELD (ERR_INVALID_STATE)"
        side_effects: []
      - from: HELD
        to: CANCELLED
        trigger: "POST /compliance/shipments/{id}/advance with event=CANCEL"
        actor: TradeOpsSpecialist
        preconditions:
          - "status in PLANNED | SCREENED | HELD (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: HELD
        trigger: "system (cascade: parent order auto-held by license revocation or party posture change)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCREENED
        to: HELD
        trigger: "system (cascade: parent order auto-held by license revocation or party posture change)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ScreeningResult
    initial_state: "CLEAR or POTENTIAL_MATCH (decided at creation by score vs threshold; CLEAR results never transition)"
    terminal_states: [CLEAR, FALSE_POSITIVE, CONFIRMED_MATCH]
    transitions:
      - from: POTENTIAL_MATCH
        to: FALSE_POSITIVE
        trigger: "POST /compliance/screening-results/{id}/resolve with resolution=FALSE_POSITIVE"
        actor: ComplianceManager
        preconditions:
          - "status == POTENTIAL_MATCH (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_by_user_id := X-User-ID"
          - "Party.screening_posture recomputed"
      - from: POTENTIAL_MATCH
        to: CONFIRMED_MATCH
        trigger: "POST /compliance/screening-results/{id}/resolve with resolution=CONFIRMED_MATCH"
        actor: ComplianceManager
        preconditions:
          - "status == POTENTIAL_MATCH (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_by_user_id := X-User-ID"
          - "Party.screening_posture recomputed (-> BLOCKED)"
          - "orders of this party in CLEARED or LICENSED -> HELD (pre_hold_status recorded); their shipments in PLANNED or SCREENED -> HELD"
          - "writes AuditRecord(SCREENING_CONFIRMED_MATCH, entity_type='ScreeningResult')"

  - entity: ScreeningListEntry
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /compliance/screening-list-entries/{id}/set-status with to=INACTIVE"
        actor: ComplianceDirector
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /compliance/screening-list-entries/{id}/set-status with to=ACTIVE"
        actor: ComplianceDirector
        preconditions:
          - "status == INACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "re-screen sweep: for every Party referenced by an ExportOrder in status CLEARED or LICENSED (processed in order of that party's earliest such order created_at ASC, tie-break Party.created_at ASC), compute screening_match_score FUZZY variant against this entry; if score >= threshold_used, create ScreeningResult(trigger_context=LIST_CHANGE, status=POTENTIAL_MATCH) and recompute Party.screening_posture"
          - "each affected Party's orders in CLEARED or LICENSED -> HELD (pre_hold_status recorded); their shipments in PLANNED or SCREENED -> HELD"

  - entity: TechnologyControlPlan
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /compliance/tcps/{id}/set-status with to=ACTIVE"
        actor: ComplianceAnalyst
        preconditions:
          - "status in DRAFT | SUSPENDED (ERR_INVALID_STATE)"
          - "no other TCP with same enclave_id, status in ACTIVE | SUSPENDED, and closed-interval overlap [effective_from, effective_to] (ERR_TCP_PERIOD_OVERLAP)"
          - "Product of product_id has status CLASSIFIED (ERR_CLASSIFICATION_REQUIRED)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /compliance/tcps/{id}/set-status with to=ACTIVE (reinstate)"
        actor: ComplianceAnalyst
        preconditions:
          - "status in DRAFT | SUSPENDED (ERR_INVALID_STATE)"
          - "no other TCP with same enclave_id, status in ACTIVE | SUSPENDED, and closed-interval overlap (ERR_TCP_PERIOD_OVERLAP)"
        side_effects: []
        note: "suspend/reinstate cycle"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /compliance/tcps/{id}/set-status with to=SUSPENDED"
        actor: ComplianceAnalyst
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /compliance/tcps/{id}/set-status with to=TERMINATED"
        actor: ComplianceAnalyst
        preconditions:
          - "status in DRAFT | ACTIVE | SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "AccessGrants of this TCP in REQUESTED -> DENIED; in APPROVED or ACTIVE -> REVOKED (active_grant_count decremented per ACTIVE grant)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /compliance/tcps/{id}/set-status with to=TERMINATED"
        actor: ComplianceAnalyst
        preconditions:
          - "status in DRAFT | ACTIVE | SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "AccessGrants of this TCP in REQUESTED -> DENIED; in APPROVED or ACTIVE -> REVOKED (active_grant_count decremented per ACTIVE grant)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /compliance/tcps/{id}/set-status with to=TERMINATED"
        actor: ComplianceAnalyst
        preconditions:
          - "status in DRAFT | ACTIVE | SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "AccessGrants of this TCP in REQUESTED -> DENIED; in APPROVED or ACTIVE -> REVOKED (active_grant_count decremented per ACTIVE grant)"

  - entity: AccessGrant
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /compliance/access-grants/{id}/review with decision=APPROVE"
        actor: ComplianceManager
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "no other AccessGrant with same party_id and same tcp_id, status in APPROVED | ACTIVE, and half-open overlap [start_date, end_date) (ERR_GRANT_PERIOD_OVERLAP)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /compliance/access-grants/{id}/review with decision=DENY"
        actor: ComplianceManager
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
          - "reviewer X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /compliance/access-grants/{id}/activate"
        actor: ComplianceManager
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
          - "TechnologyControlPlan status == ACTIVE (ERR_TCP_INACTIVE)"
          - "start_date <= current date < end_date (ERR_GRANT_WINDOW_INVALID)"
          - "Party.screening_posture != BLOCKED (ERR_PARTY_BLOCKED)"
          - "no other AccessGrant with same party_id and same tcp_id, status in APPROVED | ACTIVE, and half-open overlap [start_date, end_date): overlap iff self.start_date < other.end_date AND other.start_date < self.end_date (ERR_GRANT_PERIOD_OVERLAP)"
        side_effects:
          - "Party.active_grant_count += 1"
          - "writes AuditRecord(GRANT_ACTIVATED, entity_type='AccessGrant')"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /compliance/access-grants/{id}/revoke"
        actor: ComplianceManager
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Party.active_grant_count -= 1"
          - "writes AuditRecord(GRANT_REVOKED, entity_type='AccessGrant')"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (sweep on POST /compliance/_clock/set_current_utc when current date >= end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Party.active_grant_count -= 1"

  - entity: Violation
    initial_state: IDENTIFIED
    terminal_states: [CLOSED]
    transitions:
      - from: IDENTIFIED
        to: UNDER_REVIEW
        trigger: "POST /compliance/violations/{id}/advance with event=START_REVIEW"
        actor: ComplianceManager
        preconditions:
          - "status == IDENTIFIED (ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /compliance/violations/{id}/advance with event=SUBSTANTIATE"
        actor: ComplianceManager
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "actor X-User-ID != identified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: UNFOUNDED
        trigger: "POST /compliance/violations/{id}/advance with event=DISMISS"
        actor: ComplianceManager
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "actor X-User-ID != identified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID"
      - from: SUBSTANTIATED
        to: DISCLOSED
        trigger: "POST /compliance/violations/{id}/submit-disclosure"
        actor: ComplianceDirector
        preconditions:
          - "status == SUBSTANTIATED (ERR_INVALID_STATE)"
        side_effects:
          - "disclosure_reference assigned (VSD-000001 sequence)"
          - "writes AuditRecord(VSD_SUBMITTED, entity_type='Violation')"
      - from: DISCLOSED
        to: CLOSED
        trigger: "POST /compliance/violations/{id}/advance with event=CLOSE"
        actor: ComplianceManager
        preconditions:
          - "status in DISCLOSED | UNFOUNDED (ERR_INVALID_STATE)"
          - "actor X-User-ID != identified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes AuditRecord(VIOLATION_CLOSED, entity_type='Violation')"
      - from: UNFOUNDED
        to: CLOSED
        trigger: "POST /compliance/violations/{id}/advance with event=CLOSE"
        actor: ComplianceManager
        preconditions:
          - "status in DISCLOSED | UNFOUNDED (ERR_INVALID_STATE)"
          - "actor X-User-ID != identified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "writes AuditRecord(VIOLATION_CLOSED, entity_type='Violation')"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: classification-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /compliance/classifications"
    occ_field: "expected_product_version"
    description: |
      Creating a Classification against a Product whose version has advanced
      since the client last observed it is rejected. A Classification draft is
      prepared against the product's current posture; when the product has
      since changed (for example another classification activated and repointed
      active_classification_id), the drafter's view is stale and the create is
      refused with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_match_score
    trigger: "a screening run: POST /compliance/parties/{id}/screen (MANUAL), POST /compliance/orders/{id}/submit (ORDER), POST /compliance/shipments/{id}/screen (SHIPMENT), or list-activation sweep (LIST_CHANGE)"
    algorithm: weighted_scoring
    formula: |
      Candidate set: all ScreeningListEntry rows with status ACTIVE.
      For party P and entry E:
        tokens(s) = lowercase alphanumeric token sequences of s (split on non-alphanumeric, drop empties).
        s_name(EXACT)  = 1.00 if normalized Party.legal_name == normalized E.match_name else 0.00
        s_name(FUZZY)  = round(|tokens(P.legal_name) INTERSECT tokens(E.match_name)| / |tokens(P.legal_name) UNION tokens(E.match_name)|, 2, round_half_up); 0.00 when union empty; exact normalized equality yields 1.00
        s_country      = 1.00 if P.country_code == E.country_code else 0.00
        s_city         = 1.00 if lowercase trim P.city == lowercase trim E.country-associated city text else 0.00; for this benchmark entries carry no city, so s_city := 1.00 when s_country == 1.00 else 0.00
        Hard gate: if E.severity == PROHIBITED and s_country < 1.00: score := 0.00
        Else: score = round(0.60 * s_name + 0.25 * s_country + 0.15 * s_city, 2, round_half_up)
      threshold_used = 0.85 when E.severity == PROHIBITED else 0.70.
      Best entry = max score; tie-break: severity PROHIBITED first, then E.created_at ASC.
      outcome: if best score >= threshold_used -> POTENTIAL_MATCH (result row created with matched_entry_id, score, threshold_used);
               else CLEAR (result row created with matched_entry_id=null, score=0.00, threshold_used=null).
      LIST_CHANGE sweeps evaluate only the newly activated entry, never create CONFIRMED_MATCH, and skip creating a row when score < threshold.
    input_set: "ACTIVE ScreeningListEntry rows only; INACTIVE rows excluded"
    constants:
      W_NAME: 0.60
      W_COUNTRY: 0.25
      W_CITY: 0.15
      THRESHOLD_RESTRICTED: 0.70
      THRESHOLD_PROHIBITED: 0.85
    precision: "2 decimal places, round_half_up"
    variants:
      - name: EXACT
        when: "trigger_context == ORDER (order submission screening)"
        difference: "s_name in {0.00, 1.00} only; near-miss names score 0.00 on the name component"
      - name: FUZZY
        when: "trigger_context in SHIPMENT | MANUAL | LIST_CHANGE"
        difference: "s_name uses token-overlap ratio rounded to 2dp before weighting"

  - name: license_determination
    trigger: "POST /compliance/orders (provisional variant at creation) and POST /compliance/orders/{id}/submit (final variant)"
    algorithm: threshold
    formula: |
      Let C = the Product's ACTIVE classification at evaluation time (both variants require one; create rejects embargo before this, submit enforces ERR_CLASSIFICATION_REQUIRED).
      1. If destination_country has an ACTIVE ScreeningListEntry with list_source == EMBARGOED_COUNTRY, country_code == destination_country, severity == PROHIBITED -> PROHIBITED.
      2. Else if Party.screening_posture == BLOCKED -> PROHIBITED.
      3. Else if C.jurisdiction == ITAR -> LICENSE_REQUIRED.
      4. Else if order.end_use == MILITARY -> LICENSE_REQUIRED.
      5. Else if C.classification_code == "EAR99" -> NOT_REQUIRED.
      6. Else (EAR with ECCN): let T = 10 when destination_country in GROUP_E else 25; if Product.controlled_content_pct > T -> LICENSE_REQUIRED else NOT_REQUIRED.
      Boundary: controlled_content_pct exactly == T is NOT_REQUIRED (strictly greater than triggers LICENSE_REQUIRED).
    input_set: "destination_country, Party.screening_posture at evaluation time, ACTIVE Classification fields, Product.controlled_content_pct"
    constants:
      GROUP_E: ["CUB", "IRN", "PRK", "SYR"]
      DE_MINIMIS_GROUP_E: 10
      DE_MINIMIS_DEFAULT: 25
    precision: "integer percent comparison; no rounding"
    variants:
      - name: provisional
        when: "computed at POST /compliance/orders; stored in provisional_determination"
        difference: "evaluated against the classification ACTIVE at creation time; later classification changes do not retroactively update it"
      - name: final
        when: "computed at POST /compliance/orders/{id}/submit; stored in determination with determination_classification_sequence pinned"
        difference: "evaluated against the classification ACTIVE at submit time; identical order data yields a different result whenever the ACTIVE classification changed between create and submit"

  - name: order_total_value
    trigger: "POST /compliance/orders (at creation, after goods_value_cents is known)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned to break the apparent circle (surcharge feeds total, tier looks like it depends on total):
      1. goods_value_cents = quantity * Product.unit_value_cents
      2. tier_rate = 0.02 when goods_value_cents < 100000 else 0.035   (tier keyed on goods_value_cents ONLY, never on total_value_cents; boundary: exactly 100000 takes 0.035)
      3. surcharge_cents = round(goods_value_cents * tier_rate, 0, round_half_up)
      4. total_value_cents = goods_value_cents + surcharge_cents
    input_set: "order quantity, Product.unit_value_cents"
    constants:
      TIER_BOUNDARY_CENTS: 100000
      TIER_LOW_RATE: 0.02
      TIER_HIGH_RATE: 0.035
    precision: "integer cents, round_half_up"

  - name: shipment_compliance_fee
    trigger: "POST /compliance/shipments/{id}/release (at release, per shipment)"
    algorithm: aggregation
    formula: |
      Rounding order is pinned: compute and round EACH shipment's fee at release time, then accumulate.
      shipment.fee_cents = round(shipment.consumed_value_cents * 0.015, 0, round_half_up)
      ExportOrder.accumulated_fees_cents = sum of fee_cents over the order's shipments that reached RELEASED (returns do NOT refund the fee).
      The alternative (sum all shipment values, then round once) is FORBIDDEN and produces different cents.
    input_set: "shipments of the order that reach RELEASED status"
    constants:
      FEE_RATE: 0.015
    precision: "integer cents per shipment, round_half_up"

  - name: party_screening_posture
    trigger: "ScreeningResult creation and every resolve transition"
    algorithm: aggregation
    formula: |
      Over all ScreeningResult rows for the party:
      BLOCKED         if any row has status CONFIRMED_MATCH
      REVIEW_REQUIRED else if any row has status POTENTIAL_MATCH
      CLEAR           else if any row exists (status CLEAR or FALSE_POSITIVE)
      UNSCREENED      else (no rows)
      last_screened_at = created_at of the most recent row (max created_at).
    input_set: "all ScreeningResult rows of the party regardless of age"
    precision: "n/a"

  - name: license_consumption
    trigger: "shipment release (decrement) and shipment RETURN (restore)"
    algorithm: aggregation
    formula: |
      shipment.consumed_value_cents = shipment.quantity * Product.unit_value_cents (exact integer, no rounding)
      On release: License.remaining_quantity -= quantity; remaining_value_cents -= consumed_value_cents;
                  consumed_quantity += quantity; consumed_value_cents += consumed_value_cents.
      On RETURN: the same fields are restored by the same amounts.
      Invariant: License.approved_value_cents == remaining_value_cents + consumed_value_cents at all times after approval;
                 License.approved_quantity == remaining_quantity + consumed_quantity at all times after approval.
      Auto-EXHAUSTED: after any decrement, if remaining_quantity == 0 or remaining_value_cents == 0 -> License EXHAUSTED.
      Boundary: release is allowed when quantity == remaining_quantity or consumed_value == remaining_value_cents (<= comparison; equality succeeds and exhausts).
    input_set: "shipments of orders attached to the license in status RELEASED | IN_TRANSIT | DELIVERED"
    precision: "integer cents/units"

  - name: audit_retention
    trigger: "AuditRecord creation (retain_until) and POST /compliance/audit-records/purge"
    algorithm: threshold
    formula: |
      AuditRecord.retain_until = AuditRecord.created_at + 1825 days.
      Purge deletes exactly the records with retain_until STRICTLY earlier than the current clock time.
      Boundary: retain_until == current clock -> record RETAINED (comparison is strict).
    input_set: "all AuditRecord rows"
    constants:
      RETENTION_DAYS: 1825
    precision: "second precision on datetime comparison"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-templated resource ids exist, validated left-to-right; body-supplied FK references (product_id, party_id, tcp_id, license_id, order_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present; types valid; enum membership valid; date format YYYY-MM-DD; quantity > 0; unit_value_cents > 0; approved_value_cents > 0; approved_quantity > 0; 0 <= controlled_content_pct <= 100; valid_from <= valid_until; effective_from <= effective_to; start_date < end_date; conditions entries within declared enum set"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_product_version equals Product.version (only on POST /compliance/classifications)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /compliance/classifications"
  - priority: 6
    category: state
    check: "Target entity is in a valid from-state for the requested transition (includes attached-license APPROVED checks on order release and shipment release)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Sanctions safety: destination embargo at order create; party BLOCKED at shipment release / grant create / grant activate; unresolved POTENTIAL_MATCH at release-hold / shipment release; PROHIBITED order release-hold; NO_MILITARY_END_USE license condition breach at shipment release"
    error_id: "ERR_DESTINATION_EMBARGOED | ERR_PARTY_BLOCKED | ERR_SCREENING_REVIEW_PENDING | ERR_ORDER_PROHIBITED | ERR_LICENSE_CONDITION_VIOLATION"
    http_status: 409
    applies_to: "POST /compliance/orders, POST /compliance/orders/{id}/release-hold, POST /compliance/shipments/{id}/release, POST /compliance/access-grants, POST /compliance/access-grants/{id}/activate"
  - priority: 8
    category: business_constraint
    check: "Structural compliance constraints: segregation of duties (reviewer != submitter/applicant/requester/identifier); TCP closed-interval overlap; grant half-open overlap; grant activation window; order submit requires CLASSIFIED product; license submit requires CLASSIFIED product; release of LICENSE_REQUIRED order without license; attach-license when NOT_REQUIRED; grant activate under non-ACTIVE TCP"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_TCP_PERIOD_OVERLAP | ERR_GRANT_PERIOD_OVERLAP | ERR_GRANT_WINDOW_INVALID | ERR_CLASSIFICATION_REQUIRED | ERR_LICENSE_REQUIRED | ERR_LICENSE_NOT_REQUIRED | ERR_TCP_INACTIVE"
    http_status: 409
    applies_to: "review/activate/submit/release endpoints as specified per transition"
  - priority: 9
    category: business_referential
    check: "Cross-entity reference consistency: license product matches order product at attach; license valid window covers current date at attach / release-hold / order release / shipment release; access grant party is a foreign national"
    error_id: "ERR_LICENSE_PRODUCT_MISMATCH | ERR_LICENSE_WINDOW_INVALID | ERR_FOREIGN_NATIONAL_REQUIRED"
    http_status: 409
    applies_to: "POST /compliance/orders/{id}/attach-license, POST /compliance/orders/{id}/release-hold, POST /compliance/orders/{id}/release, POST /compliance/shipments/{id}/release, POST /compliance/access-grants"
  - priority: 10
    category: business_fiscal
    check: "Fiscal sufficiency at shipment release and shipment creation: quantity <= License.remaining_quantity; consumed_value_cents <= License.remaining_value_cents; new shipment quantity keeps order shipped+planned total <= order.quantity"
    error_id: "ERR_LICENSE_QUANTITY_INSUFFICIENT | ERR_LICENSE_VALUE_INSUFFICIENT | ERR_ORDER_QUANTITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /compliance/shipments/{id}/release, POST /compliance/shipments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Products ---
  - method: POST
    path: "/compliance/products"
    description: "Create a product"
    roles: [ComplianceAnalyst]
    code: 201
    input: [sku, name, controlled_content_pct, unit_value_cents]
    output: Product
    side_effects: ["status=UNCLASSIFIED, classification_count=0, active_classification_id=null"]

  - method: GET
    path: "/compliance/products/{id}"
    description: "Get a product"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Classifications ---
  - method: POST
    path: "/compliance/classifications"
    description: "Create a draft classification for a product (OCC-guarded on Product.version)"
    roles: [ComplianceAnalyst]
    code: 201
    input: [product_id, expected_product_version, jurisdiction, classification_code, determination_basis]
    output: Classification
    side_effects:
      - "status=DRAFT; sequence := Product.classification_count + 1"
      - "increments Product.version by 1; Product.classification_count += 1"

  - method: GET
    path: "/compliance/classifications/{id}"
    description: "Get a classification"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: Classification
    side_effects: []

  - method: GET
    path: "/compliance/classifications"
    description: "List classifications (FK reverse lookup for Classification.product_id)"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["product_id?", "status?"]
    output: "Classification[]"
    side_effects: []

  - method: POST
    path: "/compliance/classifications/{id}/submit"
    description: "Submit a draft classification for review"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: Classification
    side_effects: ["status -> SUBMITTED; submitted_by_user_id := X-User-ID"]

  - method: POST
    path: "/compliance/classifications/{id}/review"
    description: "Approve or reject a submitted classification"
    roles: [ComplianceManager]
    code: 200
    input: [decision]
    output: Classification
    side_effects:
      - "decision=APPROVE: status -> ACTIVE; prior ACTIVE classification of same product -> SUPERSEDED; Product.active_classification_id repointed; Product.status := CLASSIFIED; increments Product.version by 1; writes AuditRecord(CLASSIFICATION_ACTIVATED)"
      - "decision=REJECT: status -> REJECTED"

  - method: POST
    path: "/compliance/classifications/{id}/revise"
    description: "Return a rejected classification to DRAFT (revision loop)"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: Classification
    side_effects: ["status -> DRAFT"]

  # --- Parties ---
  - method: POST
    path: "/compliance/parties"
    description: "Create a party"
    roles: [ComplianceAnalyst, TradeOpsSpecialist]
    code: 201
    input: [legal_name, country_code, city, party_type, "is_foreign_national?"]
    output: Party
    side_effects: ["screening_posture=UNSCREENED, active_grant_count=0"]

  - method: GET
    path: "/compliance/parties/{id}"
    description: "Get a party"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: Party
    side_effects: []

  - method: GET
    path: "/compliance/parties"
    description: "List parties with filter + pagination; sorted by created_at ASC"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["screening_posture?", "country_code?", "party_type?", "limit?", "offset?"]
    output: "Party[]"
    side_effects: []

  - method: POST
    path: "/compliance/parties/{id}/screen"
    description: "Run a manual restricted-party screening (FUZZY variant)"
    roles: [ComplianceAnalyst, TradeOpsSpecialist]
    code: 201
    input: []
    output: ScreeningResult
    side_effects:
      - "creates ScreeningResult(trigger_context=MANUAL, algorithm_variant=FUZZY)"
      - "Party.screening_posture and last_screened_at recomputed"

  # --- Screening list entries ---
  - method: POST
    path: "/compliance/screening-list-entries"
    description: "Create a screening list entry (ACTIVE on creation)"
    roles: [ComplianceDirector]
    code: 201
    input: [list_source, match_name, country_code, severity]
    output: ScreeningListEntry
    side_effects: ["status=ACTIVE; triggers the same re-screen sweep as set-status to ACTIVE (entry is born ACTIVE)"]

  - method: POST
    path: "/compliance/screening-list-entries/{id}/set-status"
    description: "Activate or deactivate a list entry; activation runs the LIST_CHANGE re-screen sweep"
    roles: [ComplianceDirector]
    code: 200
    input: [to]
    output: ScreeningListEntry
    side_effects:
      - "to=ACTIVE from INACTIVE: re-screen sweep per ScreeningListEntry state machine"
      - "to=INACTIVE from ACTIVE: no sweep"

  # --- Screening results ---
  - method: GET
    path: "/compliance/screening-results/{id}"
    description: "Get a screening result"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: ScreeningResult
    side_effects: []

  - method: GET
    path: "/compliance/screening-results"
    description: "List screening results (FK reverse lookup for party_id and matched_entry_id); sorted by created_at ASC"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["party_id?", "matched_entry_id?", "status?", "trigger_context?", "limit?", "offset?"]
    output: "ScreeningResult[]"
    side_effects: []

  - method: POST
    path: "/compliance/screening-results/{id}/resolve"
    description: "Resolve a POTENTIAL_MATCH as FALSE_POSITIVE or CONFIRMED_MATCH"
    roles: [ComplianceManager]
    code: 200
    input: [resolution]
    output: ScreeningResult
    side_effects:
      - "status -> FALSE_POSITIVE | CONFIRMED_MATCH; resolved_by_user_id := X-User-ID"
      - "Party.screening_posture recomputed"
      - "CONFIRMED_MATCH: party's orders in CLEARED | LICENSED -> HELD (pre_hold_status recorded); their shipments in PLANNED | SCREENED -> HELD; writes AuditRecord(SCREENING_CONFIRMED_MATCH)"

  # --- Export orders ---
  - method: POST
    path: "/compliance/orders"
    description: "Create an export order (provisional determination computed)"
    roles: [TradeOpsSpecialist]
    code: 201
    input: [product_id, party_id, destination_country, end_use, quantity]
    output: ExportOrder
    side_effects:
      - "status=DRAFT; provisional_determination, goods_value_cents, surcharge_cents, total_value_cents computed"
      - "precondition: Product status == CLASSIFIED (ERR_CLASSIFICATION_REQUIRED) — provisional determination requires an ACTIVE classification"
      - "ERR_DESTINATION_EMBARGOED when destination has ACTIVE PROHIBITED EMBARGOED_COUNTRY entry"

  - method: GET
    path: "/compliance/orders/{id}"
    description: "Get an order"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: ExportOrder
    side_effects: []

  - method: GET
    path: "/compliance/orders"
    description: "List orders (FK reverse lookup for product_id, party_id, license_id); sorted by created_at ASC"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["product_id?", "party_id?", "license_id?", "status?", "limit?", "offset?"]
    output: "ExportOrder[]"
    side_effects: []

  - method: POST
    path: "/compliance/orders/{id}/submit"
    description: "Submit an order: runs ORDER-context screening and final license determination"
    roles: [TradeOpsSpecialist]
    code: 200
    input: []
    output: ExportOrder
    side_effects:
      - "creates ScreeningResult(trigger_context=ORDER, algorithm_variant=EXACT)"
      - "determination and determination_classification_sequence pinned"
      - "status -> CLEARED or HELD"

  - method: POST
    path: "/compliance/orders/{id}/release-hold"
    description: "Release a HELD order after screening resolution (returns to pre-hold status)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: ExportOrder
    side_effects: ["status -> pre_hold_status (or CLEARED); pre_hold_status := null"]

  - method: POST
    path: "/compliance/orders/{id}/attach-license"
    description: "Attach an APPROVED license to a CLEARED LICENSE_REQUIRED order"
    roles: [TradeOpsSpecialist]
    code: 200
    input: [license_id]
    output: ExportOrder
    side_effects: ["license_id set; status -> LICENSED"]

  - method: POST
    path: "/compliance/orders/{id}/release"
    description: "Release a CLEARED (NOT_REQUIRED) or LICENSED order for fulfillment"
    roles: [TradeOpsSpecialist]
    code: 200
    input: []
    output: ExportOrder
    side_effects: ["status -> RELEASED; writes AuditRecord(ORDER_RELEASED)"]

  - method: POST
    path: "/compliance/orders/{id}/cancel"
    description: "Cancel an order from DRAFT, IN_REVIEW, CLEARED, or HELD"
    roles: [TradeOpsSpecialist]
    code: 200
    input: []
    output: ExportOrder
    side_effects: ["status -> CANCELLED"]

  # --- Licenses ---
  - method: POST
    path: "/compliance/licenses"
    description: "Create a draft license application"
    roles: [ComplianceAnalyst]
    code: 201
    input: [product_id, issuing_authority, approved_value_cents, approved_quantity, valid_from, valid_until, "conditions?"]
    output: License
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/compliance/licenses/{id}"
    description: "Get a license"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/compliance/licenses"
    description: "List licenses (FK reverse lookup for License.product_id)"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: "License[]"
    side_effects: []

  - method: POST
    path: "/compliance/licenses/{id}/submit"
    description: "Submit (or resubmit from RETURNED_FOR_INFO) a license application"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: License
    side_effects: ["status -> SUBMITTED; applicant_user_id := X-User-ID"]

  - method: POST
    path: "/compliance/licenses/{id}/review"
    description: "Approve, deny, or return a submitted license application"
    roles: [ComplianceManager]
    code: 200
    input: [decision]
    output: License
    side_effects:
      - "decision=APPROVE: status -> APPROVED; license_number assigned; remaining_* initialized to approved_*; writes AuditRecord(LICENSE_APPROVED)"
      - "decision=DENY: status -> DENIED; decision=RETURN: status -> RETURNED_FOR_INFO"

  - method: POST
    path: "/compliance/licenses/{id}/revoke"
    description: "Revoke an APPROVED license (cascades to attached orders and their shipments)"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: License
    side_effects:
      - "status -> REVOKED; orders LICENSED with this license -> HELD; their shipments PLANNED | SCREENED -> HELD"
      - "writes AuditRecord(LICENSE_REVOKED)"

  # --- Shipments ---
  - method: POST
    path: "/compliance/shipments"
    description: "Create a shipment under a RELEASED order"
    roles: [TradeOpsSpecialist]
    code: 201
    input: [order_id, quantity, planned_ship_date]
    output: Shipment
    side_effects:
      - "status=PLANNED"
      - "precondition: order status in LICENSED | RELEASED (ERR_INVALID_STATE); sum of order's shipments in PLANNED | SCREENED | HELD | RELEASED | IN_TRANSIT | DELIVERED quantity + new quantity <= order.quantity (ERR_ORDER_QUANTITY_EXCEEDED)"

  - method: GET
    path: "/compliance/shipments/{id}"
    description: "Get a shipment"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/compliance/shipments"
    description: "List shipments (FK reverse lookup for Shipment.order_id)"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: POST
    path: "/compliance/shipments/{id}/screen"
    description: "Run SHIPMENT-context screening (FUZZY) on the order's party"
    roles: [TradeOpsSpecialist]
    code: 201
    input: []
    output: ScreeningResult
    side_effects:
      - "creates ScreeningResult(trigger_context=SHIPMENT, algorithm_variant=FUZZY); shipment.screening_result_id set"
      - "shipment -> SCREENED (outcome CLEAR) or HELD (POTENTIAL_MATCH/CONFIRMED_MATCH)"
      - "Party.screening_posture and last_screened_at recomputed"

  - method: POST
    path: "/compliance/shipments/{id}/release"
    description: "Release a SCREENED shipment; consumes license value/quantity when a license is attached"
    roles: [TradeOpsSpecialist]
    code: 200
    input: []
    output: Shipment
    side_effects:
      - "status -> RELEASED; consumed_value_cents and fee_cents computed"
      - "License remaining_/consumed_ updated; increments License.version by 1; EXHAUSTED check"
      - "ExportOrder.accumulated_fees_cents and shipped_quantity updated; increments ExportOrder.version by 1"
      - "writes AuditRecord(SHIPMENT_RELEASED)"

  - method: POST
    path: "/compliance/shipments/{id}/advance"
    description: "Advance a shipment: DEPART (RELEASED->IN_TRANSIT), DELIVER (IN_TRANSIT->DELIVERED), RETURN (IN_TRANSIT->RETURNED with license restoration), CANCEL (PLANNED|SCREENED|HELD->CANCELLED)"
    roles: [TradeOpsSpecialist]
    code: 200
    input: [event]
    output: Shipment
    side_effects:
      - "RETURN: License remaining_/consumed_ restored; increments License.version by 1; EXHAUSTED->APPROVED reactivation check; ExportOrder.shipped_quantity decremented; writes AuditRecord(SHIPMENT_RETURNED)"
      - "DELIVER: order auto-CLOSED check runs"

  # --- Technology control plans ---
  - method: POST
    path: "/compliance/tcps"
    description: "Create a technology control plan"
    roles: [ComplianceAnalyst]
    code: 201
    input: [name, enclave_id, product_id, segregation_level, effective_from, effective_to]
    output: TechnologyControlPlan
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/compliance/tcps/{id}"
    description: "Get a TCP"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: TechnologyControlPlan
    side_effects: []

  - method: GET
    path: "/compliance/tcps"
    description: "List TCPs (FK reverse lookup for TechnologyControlPlan.product_id)"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["product_id?", "status?", "enclave_id?", "limit?", "offset?"]
    output: "TechnologyControlPlan[]"
    side_effects: []

  - method: POST
    path: "/compliance/tcps/{id}/set-status"
    description: "Transition TCP: to=ACTIVE (from DRAFT|SUSPENDED, closed-interval overlap check), to=SUSPENDED (from ACTIVE), to=TERMINATED (from DRAFT|ACTIVE|SUSPENDED, cascades grants)"
    roles: [ComplianceAnalyst]
    code: 200
    input: [to]
    output: TechnologyControlPlan
    side_effects:
      - "to=TERMINATED: grants REQUESTED -> DENIED; APPROVED | ACTIVE -> REVOKED (Party.active_grant_count decremented per ACTIVE grant)"

  # --- Access grants ---
  - method: POST
    path: "/compliance/access-grants"
    description: "Request a foreign-national access grant under a TCP"
    roles: [ComplianceAnalyst]
    code: 201
    input: [tcp_id, party_id, start_date, end_date]
    output: AccessGrant
    side_effects:
      - "status=REQUESTED; requested_by_user_id := X-User-ID"
      - "preconditions: party.is_foreign_national == true (ERR_FOREIGN_NATIONAL_REQUIRED); party.screening_posture != BLOCKED (ERR_PARTY_BLOCKED)"

  - method: GET
    path: "/compliance/access-grants/{id}"
    description: "Get an access grant"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: AccessGrant
    side_effects: []

  - method: GET
    path: "/compliance/access-grants"
    description: "List access grants (FK reverse lookup for tcp_id and party_id)"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["tcp_id?", "party_id?", "status?", "limit?", "offset?"]
    output: "AccessGrant[]"
    side_effects: []

  - method: POST
    path: "/compliance/access-grants/{id}/review"
    description: "Approve or deny a requested access grant (SoD: reviewer != requester)"
    roles: [ComplianceManager]
    code: 200
    input: [decision]
    output: AccessGrant
    side_effects: ["status -> APPROVED | DENIED; reviewed_by_user_id := X-User-ID"]

  - method: POST
    path: "/compliance/access-grants/{id}/activate"
    description: "Activate an APPROVED grant (window, TCP-active, posture, half-open overlap checks)"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["status -> ACTIVE; Party.active_grant_count += 1; writes AuditRecord(GRANT_ACTIVATED)"]

  - method: POST
    path: "/compliance/access-grants/{id}/revoke"
    description: "Revoke an ACTIVE grant"
    roles: [ComplianceManager]
    code: 200
    input: []
    output: AccessGrant
    side_effects: ["status -> REVOKED; Party.active_grant_count -= 1; writes AuditRecord(GRANT_REVOKED)"]

  # --- Violations ---
  - method: POST
    path: "/compliance/violations"
    description: "Identify a potential violation"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist]
    code: 201
    input: [source_type, source_id, severity, description]
    output: Violation
    side_effects: ["status=IDENTIFIED; identified_by_user_id := X-User-ID"]

  - method: GET
    path: "/compliance/violations/{id}"
    description: "Get a violation"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/compliance/violations/{id}/advance"
    description: "Advance a violation: START_REVIEW (IDENTIFIED->UNDER_REVIEW), SUBSTANTIATE / DISMISS (UNDER_REVIEW->SUBSTANTIATED|UNFOUNDED, SoD), CLOSE (DISCLOSED|UNFOUNDED->CLOSED, SoD)"
    roles: [ComplianceManager]
    code: 200
    input: [event]
    output: Violation
    side_effects: ["CLOSE writes AuditRecord(VIOLATION_CLOSED)"]

  - method: POST
    path: "/compliance/violations/{id}/submit-disclosure"
    description: "Submit a voluntary self-disclosure for a SUBSTANTIATED violation (Director only)"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: Violation
    side_effects: ["status -> DISCLOSED; disclosure_reference assigned (VSD-000001 sequence); writes AuditRecord(VSD_SUBMITTED)"]

  # --- Audit records ---
  - method: GET
    path: "/compliance/audit-records"
    description: "List audit records with filters and pagination (recordkeeping query); sorted by created_at ASC"
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: ["entity_type?", "entity_id?", "event_type?", "limit?", "offset?"]
    output: "AuditRecord[]"
    side_effects: []

  - method: POST
    path: "/compliance/audit-records/purge"
    description: "Purge audit records whose retain_until is strictly before the current clock"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: "{ purged_count: integer }"
    side_effects: ["deletes AuditRecord rows with retain_until < current clock; records with retain_until == current clock are retained"]

  # --- Test-driving clock ---
  - method: POST
    path: "/compliance/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time. Setting the clock runs the expiry sweep: APPROVED licenses with current date > valid_until -> EXPIRED; ACTIVE access grants with current date >= end_date -> EXPIRED."
    roles: [ComplianceAnalyst, ComplianceManager, TradeOpsSpecialist, ComplianceDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["license expiry sweep; access grant expiry sweep (Party.active_grant_count decremented per expired ACTIVE grant)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted to call this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, unknown or computed/system field in body, bad type, invalid enum, bad date format, or range violation (quantity <= 0, pct out of [0,100], start/end ordering)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_product_version does not match Product.version on POST /compliance/classifications" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition" }
  - { id: ERR_DESTINATION_EMBARGOED, http: 409, condition: "POST /compliance/orders destination_country matches an ACTIVE EMBARGOED_COUNTRY entry with severity PROHIBITED" }
  - { id: ERR_PARTY_BLOCKED, http: 409, condition: "Party.screening_posture == BLOCKED at shipment release, access grant create, or grant activate" }
  - { id: ERR_SCREENING_REVIEW_PENDING, http: 409, condition: "Party.screening_posture == REVIEW_REQUIRED at order release-hold or shipment release" }
  - { id: ERR_ORDER_PROHIBITED, http: 409, condition: "release-hold attempted on an order whose determination == PROHIBITED" }
  - { id: ERR_LICENSE_CONDITION_VIOLATION, http: 409, condition: "Shipment release against a license carrying NO_MILITARY_END_USE when order.end_use == MILITARY" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Reviewer/adjudicator/closer X-User-ID equals the submitter/applicant/requester/identifier X-User-ID" }
  - { id: ERR_TCP_PERIOD_OVERLAP, http: 409, condition: "TCP activation conflicts with another ACTIVE|SUSPENDED TCP on the same enclave_id under closed-interval overlap (shared endpoint date counts as overlap)" }
  - { id: ERR_GRANT_PERIOD_OVERLAP, http: 409, condition: "Grant activation conflicts with another APPROVED|ACTIVE grant for the same party_id and tcp_id under half-open overlap (adjacent intervals do NOT conflict)" }
  - { id: ERR_GRANT_WINDOW_INVALID, http: 409, condition: "Grant activation outside [start_date, end_date): current date < start_date or >= end_date" }
  - { id: ERR_CLASSIFICATION_REQUIRED, http: 409, condition: "Order submit, license submit, or TCP activation against a product with no ACTIVE classification" }
  - { id: ERR_LICENSE_REQUIRED, http: 409, condition: "Release attempted on a CLEARED order whose determination == LICENSE_REQUIRED" }
  - { id: ERR_LICENSE_NOT_REQUIRED, http: 409, condition: "attach-license attempted on an order whose determination != LICENSE_REQUIRED" }
  - { id: ERR_TCP_INACTIVE, http: 409, condition: "Grant activation while the parent TCP is not ACTIVE" }
  - { id: ERR_LICENSE_PRODUCT_MISMATCH, http: 409, condition: "attach-license with a license whose product_id differs from the order's product_id" }
  - { id: ERR_LICENSE_WINDOW_INVALID, http: 409, condition: "License valid window does not cover the current date at attach-license, order release, release-hold (pre-hold LICENSED), or shipment release" }
  - { id: ERR_FOREIGN_NATIONAL_REQUIRED, http: 409, condition: "Access grant requested for a party with is_foreign_national == false" }
  - { id: ERR_LICENSE_QUANTITY_INSUFFICIENT, http: 409, condition: "Shipment release quantity > License.remaining_quantity (equality is allowed)" }
  - { id: ERR_LICENSE_VALUE_INSUFFICIENT, http: 409, condition: "Shipment release consumed_value_cents > License.remaining_value_cents (equality is allowed)" }
  - { id: ERR_ORDER_QUANTITY_EXCEEDED, http: 409, condition: "New shipment would push the order's non-terminal shipment quantity total above order.quantity" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAnalyst
    description: "Trade compliance analyst: drafts classifications, manages products/parties/TCPs, requests access grants, applies for licenses, identifies violations"
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/products"
      - "POST /compliance/classifications, /classifications/{id}/submit, /classifications/{id}/revise"
      - "POST /compliance/tcps, /tcps/{id}/set-status"
      - "POST /compliance/access-grants"
      - "POST /compliance/licenses, /licenses/{id}/submit"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/parties, /parties/{id}/screen (shared with TradeOpsSpecialist)"
      - "POST /compliance/violations (shared with ComplianceManager, TradeOpsSpecialist)"
      - "POST /compliance/_clock/set_current_utc (shared with all roles)"

  - name: ComplianceManager
    description: "Compliance manager: reviews classifications/licenses/grants, resolves screening matches, releases order holds, adjudicates and closes violations; segregation-of-duties checked against the initiating user"
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/classifications/{id}/review"
      - "POST /compliance/screening-results/{id}/resolve"
      - "POST /compliance/orders/{id}/release-hold"
      - "POST /compliance/licenses/{id}/review"
      - "POST /compliance/access-grants/{id}/review, /access-grants/{id}/activate, /access-grants/{id}/revoke"
      - "POST /compliance/violations/{id}/advance"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/violations (shared)"
      - "POST /compliance/_clock/set_current_utc (shared with all roles)"

  - name: TradeOpsSpecialist
    description: "Trade operations specialist: creates and submits export orders, attaches licenses, releases orders, manages shipments and their screening"
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/orders, /orders/{id}/submit, /orders/{id}/attach-license, /orders/{id}/release, /orders/{id}/cancel"
      - "POST /compliance/shipments, /shipments/{id}/screen, /shipments/{id}/release, /shipments/{id}/advance"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/parties, /parties/{id}/screen (shared with ComplianceAnalyst)"
      - "POST /compliance/violations (shared)"
      - "POST /compliance/_clock/set_current_utc (shared with all roles)"

  - name: ComplianceDirector
    description: "Compliance director: administers screening list entries, revokes licenses, submits voluntary self-disclosures, purges expired audit records"
    identity: "opaque"
    exclusive_operations:
      - "POST /compliance/screening-list-entries, /screening-list-entries/{id}/set-status"
      - "POST /compliance/licenses/{id}/revoke"
      - "POST /compliance/violations/{id}/submit-disclosure"
      - "POST /compliance/audit-records/purge"
    shared_operations:
      - "All GET endpoints"
      - "POST /compliance/_clock/set_current_utc (shared with all roles)"
