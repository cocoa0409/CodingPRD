            - "the response status is 400 and ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: clinical_allocation_preempts_latest_starting_commercial_first
        claim_type: selector_determinism
        grounds:
          - calculations.firm_capacity_waterfall
          - state_machines.Campaign.ALLOCATED_to_PREEMPTED
        distinguishing_aspect: "The preemption selector is pinned: COMMERCIAL ALLOCATED campaigns in the same site-month ranked planned_start_utc DESC (tie created_at ASC), preempted one at a time until coverage. With CA1 (Oct 5) and CA2 (Oct 20) both holding 72 h of a 150 h month, a 72 h CLINICAL allocation preempts exactly CA2 and stops."
        test_recipe:
          setup:
            - "Site monthly capacity 150; CA1 (Oct 5-15, created 00:00) and CA2 (Oct 20-30, created 01:00) COMMERCIAL ALLOCATED on trains TR-A and TR-B; CL1 CLINICAL (Oct 12-22) on TR-C."
          setup_api_calls:
            - *k_clock
            - call: "POST /sites"
              payload: { name: "Breda Pilot Plant", region: "NL-BRE", monthly_capacity_hours: 150, cold_storage_capacity_units: 10000000, licensed_authorities: ["EMA"] }
              as: PlatformAdmin
              captures: { site_p: $.data.id }
            - *k_product
            - call: "POST /sites/${site_p}/trains"
              payload: { train_code: "TR-A", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { tr_a: $.data.id }
            - call: "POST /sites/${site_p}/trains"
              payload: { train_code: "TR-B", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { tr_b: $.data.id }
            - call: "POST /sites/${site_p}/trains"
              payload: { train_code: "TR-C", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { tr_c: $.data.id }
            - call: "POST /trains/${tr_a}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-05T00:00:00Z", planned_end_utc: "2026-10-15T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { ca1: $.data.id }
            - call: "POST /campaigns/${ca1}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trains/${tr_b}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-20T00:00:00Z", planned_end_utc: "2026-10-30T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { ca2: $.data.id }
            - call: "POST /campaigns/${ca2}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - call: "POST /trains/${tr_c}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "CLINICAL", planned_start_utc: "2026-10-12T00:00:00Z", planned_end_utc: "2026-10-22T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /campaigns/${cl1}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
          assert:
            - "Campaign.${cl1}.status == ALLOCATED (72 h needed, 6 h free, covered by preemption)"
            - "Campaign.${ca2}.status == PREEMPTED (latest planned_start is preempted first)"
            - "Campaign.${ca1}.status == ALLOCATED (exactly one preemption sufficed; earliest-starting campaign survives)"

      - name: preempted_campaign_not_resurrected_when_posture_thaws
        claim_type: cascade_irreversibility
        grounds:
          - calculations.site_release_posture
          - state_machines.Campaign.PROPOSED_to_PREEMPTED
        distinguishing_aspect: "The FROZEN cascade is one-way: after two CRITICAL deviations freeze the site and preempt a PROPOSED commercial campaign, closing BOTH deviations returns the posture to CLEAR but the preempted campaign stays PREEMPTED (terminal)."
        test_recipe:
          setup:
            - "Site with TR-1 (main campaign, batch in UPSTREAM) and TR-2 (victim V, PROPOSED COMMERCIAL). Two CRITICAL PROCESS deviations open on the batch, posture FROZEN, V preempted."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - call: "POST /sites/${site_id}/trains"
              payload: { train_code: "TR-2", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_2: $.data.id }
            - call: "POST /trains/${train_2}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_v: $.data.id }
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "PROCESS", severity: "CRITICAL", description: "Deviation one of two" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { dev_1: $.data.id }
            - call: "POST /batches/${batch_id}/deviations"
              payload: { kind: "PROCESS", severity: "CRITICAL", description: "Deviation two of two" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { dev_2: $.data.id }
            - call: "GET /campaigns/${camp_v}"
              payload: {}
              as: Any
              captures: { v_frozen: $.data.status }
          trigger:
            - call: "POST /deviations/${dev_1}/action"
              payload: { action: "CLOSE", conclusion: "CAPA_COMPLETED", capa_summary: "CAPA for deviation one" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - call: "POST /deviations/${dev_2}/action"
              payload: { action: "CLOSE", conclusion: "CAPA_COMPLETED", capa_summary: "CAPA for deviation two" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Any
              captures: { posture_final: $.data.release_posture }
            - call: "GET /campaigns/${camp_v}"
              payload: {}
              as: Any
              captures: { v_final: $.data.status }
          assert:
            - "${v_frozen} == PREEMPTED (posture froze at 2 open criticals and cascaded)"
            - "${posture_final} == CLEAR after both deviations close"
            - "${v_final} == PREEMPTED (preemption is NOT undone by the thaw)"

      - name: oos_posture_freeze_cascade
        claim_type: cascade_side_effects
        grounds:
          - state_machines.InProcessTest.RECORDED_to_OOS_SUSPECT
          - calculations.site_release_posture
        excluded_because:
          difficulty_instance: "transitive_cascade / oos_verify_cascades_to_posture_freeze_and_campaign_preemption"
          rationale: "The full depth-3 cascade (test -> deviation -> posture -> campaign preemption) is asserted end-to-end by the named 1.8 instance."

      - name: excursion_dual_variant_verdicts
        claim_type: dual_variant_calculation
        grounds:
          - calculations.excursion_evaluation
        excluded_because:
          difficulty_instance: "dual_variant_calc / excursion_screening_vs_mkt_verdicts_diverge"
          rationale: "Both variants and their divergent verdicts on identical readings are asserted by the named 1.8 instance."

      - name: batch_yield_variant_switch_at_process_complete
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.batch_yield
          - entities.BatchLot.fields.quantity_units
        excluded_because:
          difficulty_instance: "dual_variant_calc / batch_yield_provisional_then_final_diverge"
          rationale: "The provisional-to-final quantity_units reconciliation (400000 -> 625000) is asserted by the named 1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_response_and_next_read
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/campaigns/{id}/advance
        distinguishing_aspect: "Immediate consistency: the advance response itself carries status ALLOCATED and version 2, and an independent GET right after returns the same values (no lag, no async reconciliation)."
        test_recipe:
          setup:
            - "One PROPOSED campaign."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
          trigger:
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
              captures: { resp_status: $.data.status, resp_version: $.data.version }
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: Any
              captures: { get_status: $.data.status, get_version: $.data.version }
          assert:
            - "${resp_status} == ALLOCATED and ${resp_version} == 2 in the mutation response itself"
            - "${get_status} == ALLOCATED and ${get_version} == 2 on the immediate re-read"
