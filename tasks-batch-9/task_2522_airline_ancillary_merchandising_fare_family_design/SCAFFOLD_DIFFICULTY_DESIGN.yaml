          endpoint must still answer 201 with candidate_count 0, presented_offer_ids [] and
          suppression_reason "NO_ELIGIBLE_CANDIDATES", and must create ZERO AncillaryOffer
          rows - not a 404, not a 422, and not a session with a null offer list.
