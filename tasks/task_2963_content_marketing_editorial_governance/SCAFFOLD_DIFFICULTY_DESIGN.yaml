  - rule_id: resource_temporal_overlap
    instances:

      - name: expert_review_window_interior_overlap_rejected_but_touching_window_accepted
        grounds:
          - validations[priority=30]
          - errors[ERR_EXPERT_WINDOW_OVERLAP]
          - entities.ContentBrief.fields.review_window_start
          - entities.ContentBrief.fields.review_window_end
          - endpoints[POST /editorial/briefs/{id}/assign-sme]
        distinguishing_aspect: |
          One expert already owns the review window [2026-08-03T09:00:00.000Z, 2026-08-05T09:00:00.000Z). A
          brief whose window starts one day inside that interval is rejected with
          ERR_EXPERT_WINDOW_OVERLAP, while a brief whose window starts at the exact instant the first
          one ends is accepted, so the overlap test must be strict half-open interior overlap
          (start_b < end_a and start_a < end_b) and not a closed-interval intersection. The expert has
          40 weekly hours against 3 + 3 reserved, so the capacity rule at priority 40 never fires and
          only the overlap geometry is under test.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-03T08:00:00.000Z."
            - "Campaign CMP-OVL1 is ACTIVE, persona IT_BUYER, primary_funnel_stage AWARENESS."
            - "One SubjectMatterExpert with expertise_tags [security] and weekly_capacity_hours 40, so the ISO-week capacity is never the binding constraint."
            - "Three DRAFT briefs, all NAVIGATIONAL / 500 words / AWARENESS / security, each clamped to effort_points 6 and sme_reserved_hours 3."
            - "Brief A is assigned first and holds the window 2026-08-03T09:00:00.000Z to 2026-08-05T09:00:00.000Z; brief B's window 2026-08-04T09:00:00.000Z to 2026-08-06T09:00:00.000Z overlaps its interior by one day; brief C's window 2026-08-05T09:00:00.000Z to 2026-08-07T09:00:00.000Z merely touches its end instant."
            - "All three windows lie inside the single ISO week beginning 2026-08-03."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
              as: ManagingEditor
            - call: "POST /editorial/campaigns"
              payload: { code: "CMP-OVL1", persona: "IT_BUYER", primary_funnel_stage: "AWARENESS", quarter_code: "2026Q3" }
              as: ManagingEditor
              captures: { cmp_id: $.data.id }
            - call: "POST /editorial/campaigns/${cmp_id}/activate"
              payload: {}
              as: ManagingEditor
            - call: "POST /editorial/experts"
              payload: { full_name: "Dana Vo", expertise_tags: ["security"], weekly_capacity_hours: 40 }
              as: ManagingEditor
              captures: { exp_id: $.data.id, exp_v1: $.data.version }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "AWARENESS", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust glossary", target_word_count: 500, required_expertise_tag: "security", review_window_start: "2026-08-03T09:00:00.000Z", review_window_end: "2026-08-05T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_a_id: $.data.id }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "AWARENESS", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust starter checklist", target_word_count: 500, required_expertise_tag: "security", review_window_start: "2026-08-04T09:00:00.000Z", review_window_end: "2026-08-06T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_b_id: $.data.id }
            - call: "POST /editorial/briefs"
              payload: { campaign_id: "${cmp_id}", funnel_stage: "AWARENESS", search_intent: "NAVIGATIONAL", primary_keyword: "zero trust myth list", target_word_count: 500, required_expertise_tag: "security", review_window_start: "2026-08-05T09:00:00.000Z", review_window_end: "2026-08-07T09:00:00.000Z" }
              as: ManagingEditor
              captures: { brief_c_id: $.data.id }
            - call: "POST /editorial/briefs/${brief_a_id}/assign-sme"
              payload: { sme_expert_id: "${exp_id}", expected_expert_version: "${exp_v1}" }
              as: ManagingEditor
            - call: "GET /editorial/experts/${exp_id}"
              payload: {}
              as: ManagingEditor
              captures: { exp_v2: $.data.version }
          trigger:
