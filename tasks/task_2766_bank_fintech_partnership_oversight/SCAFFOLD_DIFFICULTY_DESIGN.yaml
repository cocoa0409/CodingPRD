# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty
# Rules. Not an independent rule source: every instance grounds in elements
# already declared in SCAFFOLD.yaml. All numeric assert values were computed by
# executing the relevant calculations[].formula against its constants.
#
# Shared fixture conventions used by every instance below:
#   * logical clock starts at 2026-08-01T00:00:00Z (§1.5 /_clock/set_current_utc)
#   * user ids: po_1 / po_2 (ProgramOfficer), co_1 / co_2 (ComplianceOfficer),
#     rc_1 / rc_2 (RiskCommittee), ia_1 (InternalAudit); FintechPartner acts
#     with as_user_id equal to the Partner id it is bound to (§1.7 entity_backed)
#   * cycle 1 = [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z),
#     cycle 2 = [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)
#   * FBO_END_USER balances are seeded with a manual VARIANCE_ADJUSTMENT
#     LedgerEntry, which validation priority 73 permits on either account type
#     and which priorities 38 / 52 / 82 / 84 do not gate (those apply only to
#     END_USER_CREDIT). This is the only way to reach a non-zero end-user
#     custody balance before go-live, and the only way to escape the
#     concentration-cap bootstrap (the first END_USER_CREDIT in an empty bank
#     always yields a 100.00 ratio, which priority 84 refuses inclusively).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: renewal_variant_reunderwrites_composite_from_live_complaint_rate
        grounds:
          - calculations.diligence_composite_score
          - calculations.complaint_rate_bps
          - state_machines.DiligenceReview.DRAFT_to_SUBMITTED
          - state_machines.Partner.DILIGENCE_PASSED_to_IN_DILIGENCE
          - concurrency_rules[diligence-create-stale-partner]
          - entities.DiligenceReview.fields.effective_complaint_history_score
          - validations[priority=70]
        distinguishing_aspect: |
          Two DiligenceReview rows on the SAME partner carrying byte-identical
          analyst sub-scores (91/87/89/100) resolve to different composite_score
          and different tier because review_type=INITIAL consumes the submitted
          complaint_history_score verbatim (100 -> 91.1 -> TIER_1) while
          review_type=RENEWAL discards it and substitutes
          max(0, 100 - floor(partner.complaint_rate_bps / 5)) = 63 -> 83.7 ->
          TIER_2; the variant subject is risk scoring on DiligenceReview driven
          by an aggregate persisted on Partner.
        test_recipe:
          setup:
            - "One OversightCycle OPEN over [2026-08-01, 2026-09-01); logical clock at 2026-08-01T00:00:00Z."
            - "Partner 'Aurora Wallet' (DEPOSIT_WALLET, end_user_account_count = 160) taken through an INITIAL diligence review scored 91/87/89/100, decided PASSED, and left in DILIGENCE_PASSED with no ProgramAgreement drafted, because §1.2 DiligenceReview DRAFT -> SUBMITTED requires partner.status IN {PROSPECT, DILIGENCE_PASSED} and a contracted partner could never submit a renewal."
            - "Three EMAIL complaints received inside the trailing-90-day window, all still RECEIVED, so Partner.complaint_rate_bps = round_half_up(3 * 10000 / 160) = 188."
            - "The partner is in DILIGENCE_PASSED, which calculation partner_oversight_posture skips, so oversight_posture stays OPEN even at 188 bps."
            - "A second DiligenceReview with review_type = RENEWAL and the identical sub-scores 91/87/89/100 sits in DRAFT."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { cyc1_id: "$.data.id" }
            - call: "POST /oversight/partners"
              payload: { legal_name: "Aurora Wallet Inc", business_model: "DEPOSIT_WALLET", funding_stage: "SERIES_A", months_runway: 24, disclosed_complaints_per_10k: 12.50, end_user_account_count: 160 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${p_id}", review_type: "INITIAL", business_model_score: 91, funding_score: 87, compliance_capability_score: 89, complaint_history_score: 100, expected_partner_version: "${p_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { dr_init_id: "$.data.id" }
            - call: "POST /oversight/diligence-reviews/${dr_init_id}/submit"
              payload: { submission_note: "initial underwrite" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/diligence-reviews/${dr_init_id}/decide"
              payload: { outcome: "PASSED", decision_note: "tier 1" }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-07-10T00:00:00Z", narrative: "unexpected monthly fee", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "EMAIL", category: "SERVICING", severity: "LOW", received_at: "2026-07-11T00:00:00Z", narrative: "slow support reply", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "EMAIL", category: "ACCOUNT_ACCESS", severity: "MEDIUM", received_at: "2026-07-12T00:00:00Z", narrative: "locked out of app", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "GET /oversight/partners/${p_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_v3: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${p_id}", review_type: "RENEWAL", business_model_score: 91, funding_score: 87, compliance_capability_score: 89, complaint_history_score: 100, expected_partner_version: "${p_v3}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { dr_ren_id: "$.data.id" }
          trigger:
            - call: "POST /oversight/diligence-reviews/${dr_ren_id}/submit"
              payload: { submission_note: "annual renewal" }
              as: ProgramOfficer
              as_user_id: po_1
          assert:
            - "Partner.${p_id}.complaint_rate_bps == 188"
            - "DiligenceReview.${dr_ren_id}.complaint_history_score == 100"
            - "DiligenceReview.${dr_ren_id}.effective_complaint_history_score == 63"
            - "DiligenceReview.${dr_ren_id}.composite_score == 83.7"
            - "DiligenceReview.${dr_ren_id}.tier == TIER_2"
            - "DiligenceReview.${dr_ren_id}.status == SUBMITTED"
            - "DiligenceReview.${dr_init_id}.effective_complaint_history_score == 100"
            - "DiligenceReview.${dr_init_id}.composite_score == 91.1"
            - "DiligenceReview.${dr_init_id}.tier == TIER_1"
            - "Partner.${p_id}.latest_composite_score == 91.1"
            - "Partner.${p_id}.capability_tier == TIER_1"
            - "Partner.${p_id}.status == IN_DILIGENCE"
            - "Partner.${p_id}.oversight_posture == OPEN"

      - name: settlement_reserve_basis_gross_versus_net_variant
        grounds:
          - calculations.settlement_net_to_partner_cents
          - state_machines.SettlementBatch.funding_status=UNFUNDED_to_funding_status=FUNDED
          - state_machines.SettlementBatch.reconciliation_status=VARIANCE_OPEN_to_reconciliation_status=VARIANCE_CLEARED
          - entities.SettlementBatch.fields.reserve_funding_cents
          - validations[priority=75]
        distinguishing_aspect: |
          Two SettlementBatch rows with byte-identical gross_settlement_cents
          (8000000), interchange_cents (120000) and returns_cents (45000) produce
          reserve_funding_cents 400000 versus 405250 and net_to_partner_cents
          7614000 versus 7638750, purely because the reconciliation dimension
          selects the gross basis on MATCHED and the settlement-base basis on
          VARIANCE_CLEARED; the variant subject is money movement on
          SettlementBatch, a different entity domain from the DiligenceReview
          risk-scoring variant above.
        test_recipe:
          setup:
            - "Partner 'Vector Cards' LIVE with an EXECUTED agreement at reserve_requirement_bps = 500 and max_end_user_balance_cents = 500000000."
            - "FBO_END_USER custody balance seeded to 20000000 cents and RESERVE seeded to 1250000 cents, so reserve_shortfall_cents == 0 and oversight_posture == OPEN before either fund."
            - "Batch A over [2026-07-01, 2026-07-15) reconciled MATCHED (bank net == partner net == 8000000)."
            - "Batch B over [2026-07-15, 2026-07-29) reconciled to VARIANCE_OPEN (bank net 8030000 vs partner net 8000000) and then cleared with variance_adjustment_cents = 30000."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners"
              payload: { legal_name: "Vector Cards Inc", business_model: "CARD_ISSUING", funding_stage: "SERIES_B_PLUS", months_runway: 30, disclosed_complaints_per_10k: 4.00, end_user_account_count: 5000 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${p_id}", review_type: "INITIAL", business_model_score: 91, funding_score: 87, compliance_capability_score: 89, complaint_history_score: 100, expected_partner_version: "${p_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { dr_id: "$.data.id" }
            - call: "POST /oversight/diligence-reviews/${dr_id}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/diligence-reviews/${dr_id}/decide"
              payload: { outcome: "PASSED" }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "GET /oversight/partners/${p_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_v2: "$.data.version" }
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${p_id}", kyc_owner: "BANK", dispute_owner: "BANK", marketing_owner: "PARTNER", oversight_rights_level: "FULL_ACCESS", audit_access_notice_days: 5, termination_triggers: ["RESERVE_SHORTFALL", "VOLUNTARY"], monthly_growth_cap_pct: 25.00, concentration_cap_pct: 60.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${p_v2}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { ag_id: "$.data.id" }
            - call: "POST /oversight/agreements/${ag_id}/submit-for-approval"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/agreements/${ag_id}/risk-decision"
              payload: { decision: "EXECUTE" }
              as: RiskCommittee
              as_user_id: rc_1
            - call: "GET /oversight/custody-accounts?partner_id=${p_id}&account_type=FBO_END_USER"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { fbo_id: "$.data[0].id", fbo_v1: "$.data[0].version" }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${p_id}", custody_account_id: "${fbo_id}", entry_type: "VARIANCE_ADJUSTMENT", amount_cents: 20000000, effective_at: "2026-08-01T00:00:00Z", expected_custody_account_version: "${fbo_v1}", memo: "opening end-user custody migration" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "GET /oversight/custody-accounts?partner_id=${p_id}&account_type=RESERVE"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { res_id: "$.data[0].id", res_v1: "$.data[0].version" }
            - call: "POST /oversight/ledger-entries"
              payload: { partner_id: "${p_id}", custody_account_id: "${res_id}", entry_type: "RESERVE_FUND", amount_cents: 1250000, effective_at: "2026-08-01T00:00:00Z", expected_custody_account_version: "${res_v1}", memo: "initial reserve at HEIGHTENED multiplier" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners/${p_id}/go-live"
              payload: { attestation_note: "launch" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/settlement-batches"
              payload: { partner_id: "${p_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-15T00:00:00Z", gross_settlement_cents: 8000000, interchange_cents: 120000, returns_cents: 45000, partner_reported_net_cents: 8000000 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { batch_a_id: "$.data.id" }
            - call: "POST /oversight/settlement-batches/${batch_a_id}/reconcile"
              payload: { bank_reported_net_cents: 8000000 }
              as: InternalAudit
              as_user_id: ia_1
            - call: "POST /oversight/settlement-batches"
              payload: { partner_id: "${p_id}", window_start: "2026-07-15T00:00:00Z", window_end: "2026-07-29T00:00:00Z", gross_settlement_cents: 8000000, interchange_cents: 120000, returns_cents: 45000, partner_reported_net_cents: 8000000 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { batch_b_id: "$.data.id" }
            - call: "POST /oversight/settlement-batches/${batch_b_id}/reconcile"
              payload: { bank_reported_net_cents: 8030000 }
              as: InternalAudit
              as_user_id: ia_1
            - call: "POST /oversight/settlement-batches/${batch_b_id}/clear-variance"
              payload: { variance_adjustment_cents: 30000, root_cause_note: "late interchange posting" }
              as: InternalAudit
              as_user_id: ia_1
          trigger:
            - call: "POST /oversight/settlement-batches/${batch_a_id}/fund"
              payload: { funding_reference: "WIRE-A-0001" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/settlement-batches/${batch_b_id}/fund"
              payload: { funding_reference: "WIRE-B-0002" }
              as: ProgramOfficer
              as_user_id: po_1
          assert:
            - "SettlementBatch.${batch_a_id}.bank_fee_bps_applied == 45"
            - "SettlementBatch.${batch_a_id}.bank_fee_cents == 61000"
            - "SettlementBatch.${batch_a_id}.settlement_base_cents == 8075000"
            - "SettlementBatch.${batch_a_id}.reserve_funding_cents == 400000"
            - "SettlementBatch.${batch_a_id}.net_to_partner_cents == 7614000"
            - "SettlementBatch.${batch_a_id}.shortfall_carry_cents == 0"
            - "SettlementBatch.${batch_b_id}.bank_fee_bps_applied == 45"
            - "SettlementBatch.${batch_b_id}.bank_fee_cents == 61000"
            - "SettlementBatch.${batch_b_id}.settlement_base_cents == 8105000"
            - "SettlementBatch.${batch_b_id}.reserve_funding_cents == 405250"
            - "SettlementBatch.${batch_b_id}.net_to_partner_cents == 7638750"
            - "SettlementBatch.${batch_b_id}.reserve_funding_cents - SettlementBatch.${batch_a_id}.reserve_funding_cents == 5250"
            - "CustodyAccount.${fbo_id}.balance_cents == 3820000"
            - "CustodyAccount.${res_id}.balance_cents == 1933250"
            - "Partner.${p_id}.cumulative_paid_out_cents == 15252750"
            - "Partner.${p_id}.cumulative_bank_fee_cents == 122000"
            - "Partner.${p_id}.required_reserve_cents == 250000"
            - "Partner.${p_id}.reserve_shortfall_cents == 0"
            - "Partner.${p_id}.unreconciled_variance_cents == 0"
            - "Partner.${p_id}.oversight_posture == OPEN"

      - name: complaint_sla_calendar_versus_business_basis_from_identical_intake_instant
        grounds:
          - calculations.complaint_response_due_at
          - calculations.complaint_rate_bps
          - calculations.partner_oversight_posture
          - entities.Complaint.fields.response_due_at
          - entities.Complaint.fields.handling_owner
          - validations[priority=66]
        distinguishing_aspect: |
          Four complaints intaken with the same received_at 2026-07-04T15:00:00Z
          (a Saturday) resolve to three different response_due_at values because
          CALENDAR channels do straight instant arithmetic preserving 15:00:00
          (CFPB_PORTAL -> 2026-07-19T15:00:00.000Z) while BUSINESS channels
          normalise to the next Monday midnight anchor and pin end-of-day
          (STATE_AG -> 2026-07-20T23:59:59.999Z, SOCIAL ->
          2026-07-13T23:59:59.999Z), and a STATE_AG complaint intaken on the
          following Monday 2026-07-06T09:00:00Z lands on the SAME deadline as the
          Saturday STATE_AG one.
        test_recipe:
          setup:
            - "One OversightCycle OPEN over [2026-08-01, 2026-09-01); logical clock at 2026-08-01T00:00:00Z, so every received_at below is in the past (validation priority 66) and inside the trailing-90-day complaint window."
            - "Partner 'Lumen Lending' (LENDING, end_user_account_count = 160) contracted by an EXECUTED ProgramAgreement whose dispute_owner = PARTNER."
            - "No complaints exist before the trigger, so the four intakes below are the entire numerator: 4 * 10000 / 160 = 250 bps exactly."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners"
              payload: { legal_name: "Lumen Lending Inc", business_model: "LENDING", funding_stage: "SEED", months_runway: 14, disclosed_complaints_per_10k: 30.00, end_user_account_count: 160 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${p_id}", review_type: "INITIAL", business_model_score: 82, funding_score: 80, compliance_capability_score: 84, complaint_history_score: 88, expected_partner_version: "${p_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { dr_id: "$.data.id" }
            - call: "POST /oversight/diligence-reviews/${dr_id}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/diligence-reviews/${dr_id}/decide"
              payload: { outcome: "PASSED" }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "GET /oversight/partners/${p_id}"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_v2: "$.data.version" }
            - call: "POST /oversight/agreements"
              payload: { partner_id: "${p_id}", kyc_owner: "SHARED", dispute_owner: "PARTNER", marketing_owner: "BANK", oversight_rights_level: "STANDARD", audit_access_notice_days: 20, termination_triggers: ["COMPLAINT_RATE", "VOLUNTARY"], monthly_growth_cap_pct: 25.00, concentration_cap_pct: 60.00, max_end_user_balance_cents: 500000000, reserve_requirement_bps: 500, effective_date: "2026-08-01T00:00:00Z", expected_partner_version: "${p_v2}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { ag_id: "$.data.id" }
            - call: "POST /oversight/agreements/${ag_id}/submit-for-approval"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/agreements/${ag_id}/risk-decision"
              payload: { decision: "EXECUTE" }
              as: RiskCommittee
              as_user_id: rc_1
          trigger:
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "CFPB_PORTAL", category: "FEES", severity: "HIGH", received_at: "2026-07-04T15:00:00Z", narrative: "APR not disclosed at origination", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
              captures: { c_cfpb_id: "$.data.id" }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "STATE_AG", category: "DISCLOSURE", severity: "HIGH", received_at: "2026-07-04T15:00:00Z", narrative: "state attorney general inquiry", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
              captures: { c_ag_sat_id: "$.data.id" }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "SOCIAL", category: "SERVICING", severity: "LOW", received_at: "2026-07-04T15:00:00Z", narrative: "public post about payoff delay", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
              captures: { c_social_id: "$.data.id" }
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${p_id}", channel: "STATE_AG", category: "CREDIT_REPORTING", severity: "MEDIUM", received_at: "2026-07-06T09:00:00Z", narrative: "furnishing dispute", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: co_1
              captures: { c_ag_mon_id: "$.data.id" }
          assert:
            - "Complaint.${c_cfpb_id}.response_due_at == 2026-07-19T15:00:00.000Z"
            - "Complaint.${c_ag_sat_id}.response_due_at == 2026-07-20T23:59:59.999Z"
            - "Complaint.${c_social_id}.response_due_at == 2026-07-13T23:59:59.999Z"
            - "Complaint.${c_ag_mon_id}.response_due_at == 2026-07-20T23:59:59.999Z"
            - "Complaint.${c_ag_sat_id}.response_due_at == Complaint.${c_ag_mon_id}.response_due_at"
            - "Complaint.${c_cfpb_id}.handling_owner == PARTNER"
            - "Complaint.${c_cfpb_id}.status == RECEIVED"
            - "Partner.${p_id}.total_complaint_count == 4"
            - "Partner.${p_id}.open_complaint_count == 4"
            - "Partner.${p_id}.complaint_rate_bps == 250"
            - "Partner.${p_id}.oversight_posture == RESTRICTED"

  - rule_id: combinatorial_formula
    instances:

      - name: required_reserve_three_way_max_multiplier_and_ceiling_walk
        grounds:
          - calculations.required_reserve_cents
          - calculations.partner_oversight_posture
          - entities.Partner.fields.required_reserve_cents
          - entities.Partner.fields.reserve_shortfall_cents
          - entities.ProgramAgreement.fields.max_end_user_balance_cents
          - concurrency_rules[ledger-entry-stale-custody-account]
        distinguishing_aspect: |
          §0.5 mode (a): required_reserve_cents takes four heterogeneous inputs
          (fbo_balance x reserve_requirement_bps, trailing 90-day MATCHED gross x
          150 bps, a 250000-cent absolute floor, and a posture-keyed multiplier)
          through a nested max, then a multiply-and-floor, then a min against the
          contractual ceiling; this walk makes each of the three max branches win
          in turn, flips the multiplier both ways, and lets the ceiling bind, and
          it pins floor-before-max against floor-after-multiply (617283 x 1.25
          floors to 771603, whereas the un-floored 12345679 x 500 / 10000 x 1.25
