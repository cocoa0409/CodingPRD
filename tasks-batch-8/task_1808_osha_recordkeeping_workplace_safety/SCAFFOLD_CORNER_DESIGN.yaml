# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Task 1808 OSHA Recordkeeping
# §1.9 Coverage Index: breadth claims across §1.1–§1.7 not covered by §1.8.
# Sections follow the claim-extraction-guide taxonomy.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: company_creation_success_and_defaults
        claim_type: creation
        grounds: [entities.Company, endpoints]
        distinguishing_aspect: "POST /safety/companies with required fields returns 201 and server-minted id/created_at/version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Corner Co", fein: "11-0000001" }
              as: PlatformAdmin
              captures: { co_id: $.data.id, co_ver: $.data.version }
          trigger:
            - call: "GET /safety/companies/${co_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "create returned 201 with version == 1 and non-empty id (UUID shape)"
            - "GET returns legal_name == 'Corner Co' and fein == '11-0000001'"

      - name: company_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Company.fields.fein, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required fein -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /safety/companies"
              payload: { legal_name: "No Fein Co" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: company_duplicate_fein_rejected
        claim_type: type_constraints
        grounds: [entities.Company.fields.fein, "validations[priority=8]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second company with same fein -> ERR_DUPLICATE 409 (uniqueness constraint)."
        test_recipe:
          setup: ["Company C with fein '22-0000002' exists"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "First Co", fein: "22-0000002" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/companies"
              payload: { legal_name: "Second Co", fein: "22-0000002" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE and http status 409"

      - name: get_nonexistent_case_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a random UUID that does not exist -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /safety/cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"

      - name: establishment_is_partially_exempt_default_false
        claim_type: defaults
        grounds: [entities.Establishment.fields.is_partially_exempt]
        distinguishing_aspect: "Omitting is_partially_exempt on create -> false; posture defaults CLEAR, risk_score 0."
        test_recipe:
          setup: ["Company C exists"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Default Co", fein: "33-0000003" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site D", naics_code: "332710", state_code: "OH", size_class: "STANDARD" }
              as: PlatformAdmin
              captures: { est_posture: $.data.posture, est_risk: $.data.risk_score, est_exempt: $.data.is_partially_exempt }
          assert:
            - "is_partially_exempt == false (default applied)"
            - "posture == CLEAR and risk_score == 0 and current_year_hours == 0"

      - name: employee_invalid_enum_employment_status_rejected
        claim_type: type_constraints
        grounds: [entities.Employee.fields.employment_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "employment_status 'RETIRED' is not in {ACTIVE, SEPARATED} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Company C exists"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Enum Co", fein: "44-0000004" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Bad Enum", job_title: "X", hire_date: "2020-01-01", employment_status: "RETIRED" }
              as: RecordkeepingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: system_fields_ignored_on_input
        claim_type: system_fields
        grounds: [entities.IncidentCase.fields.case_number, entities.IncidentCase.fields.log_year]
        distinguishing_aspect: "Client-supplied case_number/log_year/status are ignored; server stamps case_number, computes log_year from occurred_at, forces status PENDING_REVIEW."
        test_recipe:
          setup: ["Company C, Establishment E, Employee W exist"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "SysField Co", fein: "55-0000005" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site S", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Sys Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2025-12-31T10:00:00Z", description: "Year-edge injury", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { k_status: $.data.status, k_logyear: $.data.log_year, k_casenum: $.data.case_number }
          assert:
            - "status == PENDING_REVIEW (INTAKE auto-advanced by system)"
            - "log_year == 2025 (computed from occurred_at, not from clock 2026-08-01)"
            - "case_number non-empty and server-minted (contains establishment sequence)"

      - name: corrective_action_linkage_xor_enforced
        claim_type: type_constraints
        grounds: [entities.CorrectiveAction.fields.case_id, "errors[ERR_LINKAGE_XOR]"]
        distinguishing_aspect: "Supplying BOTH case_id and citation_id (or neither) -> ERR_LINKAGE_XOR 422."
        test_recipe:
          setup: ["Company C, Establishment E, Employee W, case K exist"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Xor Co", fein: "66-0000006" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site X", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Xor Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "X", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", description: "No link", assigned_to: "op-1", due_date: "2026-09-01", priority: "LOW" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LINKAGE_XOR (neither case_id nor citation_id supplied)"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationships
        grounds: [entities.IncidentCase.fields.establishment_id, endpoints]
        distinguishing_aspect: "GET /safety/establishments/{id}/cases returns the establishment's cases; empty list when none."
        test_recipe:
          setup: ["Company C, Establishment E, Employee W; one case created"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "FK Co", fein: "77-0000007" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site F", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "FK Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "F", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /safety/establishments/${est_id}/cases"
              payload: {}
              as: SafetyOfficer
              captures: { first_id: "$.data[0].id" }
          assert:
            - "list contains exactly 1 case with id == created case id"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: invalid_transition_finalize_from_intake_adjacent_states
        claim_type: invalid_transition
        grounds: [state_machines.IncidentCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "close-day-count on a PENDING_REVIEW case -> ERR_INVALID_STATE (transition only exists from RECORDABLE)."
        test_recipe:
          setup: ["Case K PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "SM Co", fein: "88-0000008" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site SM", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "SM Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "S", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /safety/cases/${case_id}/close-day-count"
              payload: { expected_case_version: "${case_v}" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; case stays PENDING_REVIEW"

      - name: terminal_state_lockdown_not_recordable
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncidentCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From NOT_RECORDABLE (terminal), reclassify -> ERR_INVALID_STATE; no transition list contains NOT_RECORDABLE as from-state."
        test_recipe:
          setup: ["Case K classified FIRST_AID_ONLY -> NOT_RECORDABLE"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "TL Co", fein: "99-0000009" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site TL", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "TL Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "T", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "FIRST_AID_ONLY", expected_case_version: "${case_v}" }
              as: SafetyOfficer
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /safety/cases/${case_id}/reclassify"
              payload: { expected_case_version: "${case_v2}" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (NOT_RECORDABLE is terminal for reclassify)"

      - name: initial_state_intake_pending_review
        claim_type: initial_state
        grounds: [state_machines.IncidentCase]
        distinguishing_aspect: "Newly created case lands in PENDING_REVIEW (INTAKE auto-advanced), is_recordable false, revision_index 0."
        test_recipe:
          setup: ["Company C, Establishment E, Employee W exist"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "IS Co", fein: "12-0000010" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site IS", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "IS Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "I", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { st: $.data.status, rec: $.data.is_recordable, rev: $.data.revision_index }
          assert:
            - "status == PENDING_REVIEW; is_recordable == false; is_dart == false; revision_index == 0"

      - name: investigation_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.IncidentInvestigation.ROOT_CAUSE_SUBMITTED_to_OPEN]
        distinguishing_aspect: "ROOT_CAUSE_SUBMITTED -> OPEN via reopen is legal (cyclic investigation loop); close from OPEN is invalid."
        test_recipe:
          setup: ["Case K RECORDABLE; investigation in ROOT_CAUSE_SUBMITTED"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "IR Co", fein: "23-0000011" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site IR", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "IR Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "R", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "POST /safety/investigations"
              payload: { case_id: "${case_id}", lead_supervisor_id: "sup-200" }
              as: SafetyOfficer
              captures: { inv_id: $.data.id }
            - call: "POST /safety/investigations/${inv_id}/submit-root-cause"
              payload: { root_cause: "PROCESS", contributing_factors: "No JHA" }
              as: InvestigatingSupervisor
              as_user_id: "sup-200"
          trigger:
            - call: "POST /safety/investigations/${inv_id}/reopen"
              payload: {}
              as: InvestigatingSupervisor
              as_user_id: "sup-200"
              captures: { st: $.data.status }
            - call: "POST /safety/investigations/${inv_id}/close"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "reopen -> status == OPEN"
            - "close from OPEN -> error_id == ERR_INVALID_STATE (must pass through ROOT_CAUSE_SUBMITTED)"

      - name: inspection_close_blocked_when_citations_exist
        claim_type: precondition_enforcement
        grounds: [state_machines.Inspection.OPEN_to_CLOSED_NO_CITATION, "errors[ERR_CITATIONS_EXIST]"]
        distinguishing_aspect: "Closing an inspection that already has a citation -> ERR_CITATIONS_EXIST; inspection auto-flipped to CITATIONS_ISSUED on first citation."
        test_recipe:
          setup: ["Company C, Establishment E, Inspection I with one citation"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "IC Co", fein: "34-0000012" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site IC", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/inspections"
              payload: { establishment_id: "${est_id}", opened_on: "2026-08-01", inspection_type: "PROGRAMMED", scope: "PARTIAL" }
              as: SafetyOfficer
              captures: { insp_id: $.data.id }
            - call: "POST /safety/citations"
              payload: { inspection_id: "${insp_id}", standard_cited: "29 CFR 1910.95", violation_type: "SERIOUS", proposed_penalty_usd: 5000, abatement_due_date: "2026-09-01" }
              as: SafetyOfficer
          trigger:
            - call: "POST /safety/inspections/${insp_id}/close"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
            - call: "GET /safety/inspections/${insp_id}"
              payload: {}
              as: SafetyOfficer
              captures: { insp_status: $.data.status }
          assert:
            - "close -> error_id == ERR_CITATIONS_EXIST"
            - "inspection status == CITATIONS_ISSUED (auto-transition fired on citation create)"

      - name: corrective_action_verify_requires_completed_state
        claim_type: invalid_transition
        grounds: [state_machines.CorrectiveAction, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify on an OPEN (never completed) action -> ERR_INVALID_STATE; only COMPLETED -> VERIFIED exists."
        test_recipe:
          setup: ["Case K RECORDABLE; corrective action CA OPEN"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "CV Co", fein: "45-0000013" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site CV", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "CV Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-30T10:00:00Z", description: "C", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "POST /safety/corrective-actions"
              payload: { establishment_id: "${est_id}", case_id: "${case_id}", description: "Fix", assigned_to: "op-7", due_date: "2026-09-01", priority: "LOW" }
              as: SafetyOfficer
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /safety/corrective-actions/${ca_id}/verify"
              payload: {}
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (OPEN -> VERIFIED not a declared transition)"

      - name: severe_report_duplicate_per_case_rejected
        claim_type: invalid_transition
        grounds: [entities.SevereInjuryReport.fields.case_id, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second severe report for the same case -> ERR_DUPLICATE (one report per case)."
        test_recipe:
          setup: ["Case K (severe INPATIENT_HOSPITALIZATION) with one report already filed"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "SR Co", fein: "56-0000014" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site SR", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "SR Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T10:00:00Z", description: "Sev", body_part: "eyes", event_type: "INJURY", is_severe_event: "EYE_LOSS" }
              as: SafetyOfficer
              captures: { case_id: $.data.id }
            - call: "POST /safety/cases/${case_id}/severe-reports"
              payload: { report_kind: "EYE_LOSS", occurred_at: "2026-08-01T10:00:00Z", reported_to_agency_at: "2026-08-01T20:00:00Z" }
              as: SafetyOfficer
          trigger:
            - call: "POST /safety/cases/${case_id}/severe-reports"
              payload: { report_kind: "EYE_LOSS", occurred_at: "2026-08-01T10:00:00Z", reported_to_agency_at: "2026-08-01T21:00:00Z" }
              as: SafetyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE (one SevereInjuryReport per case)"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: trir_input_set_filtering_excludes_not_recordable
        claim_type: input_set_filtering
        grounds: [calculations.trir_rate]
        distinguishing_aspect: "NOT_RECORDABLE (FIRST_AID_ONLY) cases and PENDING_REVIEW cases are excluded from the live recordable count; only is_recordable == true rows count."
        test_recipe:
          setup:
            - "Company C, Establishment E, Employee W"
            - "1 RECORDABLE case, 1 NOT_RECORDABLE case, 1 PENDING_REVIEW case (all log_year 2026)"
            - "1 APPROVED hour log for current year 2026 month 8 with 40000 hours (enough for live read)"
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Calc Co", fein: "67-0000015" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site Calc", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Calc Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T10:00:00Z", description: "A", body_part: "arm", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /safety/cases/${c1}/classify"
              payload: { classification: "MEDICAL_TREATMENT", expected_case_version: "${c1_v}" }
              as: SafetyOfficer
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-02T09:00:00Z", description: "B", body_part: "leg", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /safety/cases/${c2}/classify"
              payload: { classification: "FIRST_AID_ONLY", expected_case_version: "${c2_v}" }
              as: SafetyOfficer
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-02T09:30:00Z", description: "C pending", body_part: "hand", event_type: "INJURY" }
              as: SafetyOfficer
            - call: "POST /safety/hour-logs"
              payload: { establishment_id: "${est_id}", year: 2026, month: 8, hours_worked: 40000, employment_count: 10 }
              as: RecordkeepingCoordinator
              captures: { hl: $.data.id }
            - call: "POST /safety/hour-logs/${hl}/approve"
              payload: {}
              as: RecordkeepingCoordinator
          trigger:
            - call: "GET /safety/establishments/${est_id}/rates?year=2026"
              payload: { year: 2026 }
              as: SafetyOfficer
              captures: { trir: $.data.trir, cases: $.data.total_recordable_cases, hours: $.data.total_hours_worked }
          assert:
            - "total_recordable_cases == 1 (NOT_RECORDABLE and PENDING_REVIEW excluded)"
            - "total_hours_worked == 40000 (only APPROVED logs count)"
            - "trir == 5.0 (1 x 200000 / 40000)"

      - name: severe_injury_fatality_8h_clock
        claim_type: constants_applied
        grounds: [calculations.severe_injury_clock]
        distinguishing_aspect: "FATALITY uses the 8-hour constant (not 24h): report at occurred+9h is LATE for FATALITY but would be TIMELY for hospitalization."
        test_recipe:
          setup: ["Case K with is_severe_event FATALITY, occurred 2026-08-01T06:00:00Z"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Fat Co", fein: "78-0000016" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site Fat", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Fat Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-08-01T06:00:00Z", description: "Fatality", body_part: "multiple", event_type: "INJURY", is_severe_event: "FATALITY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /safety/cases/${case_id}/severe-reports"
              payload: { report_kind: "FATALITY", occurred_at: "2026-08-01T06:00:00Z", reported_to_agency_at: "2026-08-01T15:00:00Z" }
              as: SafetyOfficer
              captures: { st: $.data.status, dl: $.data.deadline }
          assert:
            - "deadline == 2026-08-01T14:00:00Z (8h constant)"
            - "status == LATE (reported 15:00 > 14:00); would have been TIMELY under the 24h rule"

      - name: day_count_cap_days_away_precedence
        claim_type: correct_result
        grounds: [calculations.day_count_rollup]
        distinguishing_aspect: "When combined raw days exceed 180, days-away fills the cap first: 100 away + 100 restricted -> (180, 0), not (100, 80)."
        test_recipe:
          setup: ["Case K RECORDABLE DAYS_AWAY with 100 away + 100 restricted entries"]
          setup_api_calls:
            - call: "POST /safety/companies"
              payload: { legal_name: "Cap Co", fein: "89-0000017" }
              as: PlatformAdmin
              captures: { co_id: $.data.id }
            - call: "POST /safety/establishments"
              payload: { company_id: "${co_id}", site_name: "Site Cap", naics_code: "332710", state_code: "OH", size_class: "SMALL" }
              as: PlatformAdmin
              captures: { est_id: $.data.id }
            - call: "POST /safety/employees"
              payload: { company_id: "${co_id}", full_name: "Cap Worker", job_title: "Aide", hire_date: "2024-01-01" }
              as: RecordkeepingCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /safety/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/cases"
              payload: { establishment_id: "${est_id}", employee_id: "${emp_id}", occurred_at: "2026-07-01T10:00:00Z", description: "Severe injury", body_part: "spine", event_type: "INJURY" }
              as: SafetyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /safety/cases/${case_id}/classify"
              payload: { classification: "DAYS_AWAY", expected_case_version: "${case_v}" }
              as: SafetyOfficer
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "DAYS_AWAY", start_date: "2026-07-02", end_date: "2026-10-09" }
              as: SafetyOfficer
            - call: "POST /safety/cases/${case_id}/day-entries"
              payload: { day_type: "RESTRICTED", start_date: "2026-10-10", end_date: "2027-01-17" }
              as: SafetyOfficer
          trigger:
            - call: "GET /safety/cases/${case_id}"
              payload: {}
              as: SafetyOfficer
              captures: { away: $.data.days_away_count, restr: $.data.restricted_days_count, closed: $.data.day_count_closed }
          assert:
            - "days_away_count == 180 (min(100, 180) with precedence)"
            - "restricted_days_count == 0 (cap consumed by days-away)"
            - "day_count_closed == true (combined cap reached auto-closes counting)"

      - name: trir_null_when_zero_hours_on_prepare
        claim_type: correct_result
        grounds: [calculations.trir_rate, "errors[ERR_HOURS_INCOMPLETE]"]
