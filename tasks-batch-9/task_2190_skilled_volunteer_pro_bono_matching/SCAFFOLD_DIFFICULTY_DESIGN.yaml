      - name: frozen_cycle_posture_and_suspended_partner_block_new_commitments
        grounds:
          - calculations.cycle_posture
          - state_machines.ProjectRequest.SCOPED_to_MATCHING
          - state_machines.PartnerOrg.ACTIVE_to_SUSPENDED
          - validations.priority_51.ERR_CYCLE_CAPACITY_FROZEN
          - validations.priority_31.ERR_PARTNER_SUSPENDED
        distinguishing_aspect: |
          The other instances hang the gate on a child row of the write target (its
          agreement, its pinned scope). This one hangs it on two ancestors that the write
          target merely points at: the ProgramCycle it consumes a slot from and the
          PartnerOrg that owns it. The matching run is fully legal on its own terms -
          ProjectRequest.status == SCOPED is exactly the from-state POST
          /project-requests/{id}/match requires (priority 20 passes), active_scope_revision_no
          is 1, the partner is ACTIVE with open_engagement_count 0 < max_concurrent_engagements
          6 (priority 53 passes), a vetted ACTIVE SENIOR volunteer with the required skill and
          260.00 unheld window hours is in the candidate set (priority 57 passes) - yet the
          call is refused at priority 51 because ProgramCycle.posture is FROZEN, a value no
          field of the request itself can see. utilization_ratio sits at exactly 1.0000 on the
          inclusive FROZEN_FLOOR, reached by a single OFFERED hold on a cycle deliberately
          narrowed to capacity_slot_total 1 (the canonical 10-slot cycle would need ten holds
          to say the same thing). Releasing that hold with a withdraw - a write to a sibling
          request, never to this one - flips the posture back to OPEN and the identical match
          call then succeeds, which is the proof that nothing about the target entity ever
          changed.
          The second remote gate is the partner's own status, and it is deliberately probed on
          POST /project-requests rather than on the match endpoint: the ACTIVE -> SUSPENDED
          cascade abandons every request of that partner in DRAFT, SCOPING, SCOPED, MATCHING or
          RESCOPING and withdraws their OFFERED offers, so a post-suspension match on any
          existing request would trip priority 20 ERR_INVALID_REQUEST_STATE first and would no
          longer isolate the remote cause. A brand-new creation has no own state at all to be
          blamed, both of its foreign keys resolve (priority 14 passes), its payload is
          schema-complete (priority 17 passes), and the cycle it names is back to posture OPEN -
          so 403 ERR_PARTNER_SUSPENDED can only be about the remote PartnerOrg row.
