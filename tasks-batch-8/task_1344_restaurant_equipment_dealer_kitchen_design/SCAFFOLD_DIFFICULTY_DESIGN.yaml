  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: delivery_window_buffer_conflict
        grounds:
          - validations[priority=6]
          - errors[ERR_DELIVERY_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource = DeliveryJob on a Project. Interval semantics = half-open
          windows with a 2-hour buffer: a second job on the same Project with
          the same rigging_required flag must satisfy gap >= 2 hours between
          its scheduled_start and the existing job's scheduled_end. A 1-hour
          gap is rejected.
        test_recipe:
          setup:
            - "Customer, Project CITY_HEALTH; Layout APPROVED; Quote accepted; Project CONTRACTED"
            - "DeliveryJob J1 already PLANNED: 2026-08-05T08:00 → 12:00, rigging_required=false"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Overlap Cust", contact_email: "o@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cust_id}", project_name: "Overlap", site_address: "29 Alder", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
