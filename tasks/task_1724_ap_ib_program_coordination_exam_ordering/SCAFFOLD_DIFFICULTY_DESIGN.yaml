            - call: "POST /exam-cycles"
              payload: { name: "CYCLE-B", registration_deadline_at: "2026-11-01T12:00:00Z", order_deadline_at: "2026-11-15T12:00:00Z", score_release_at: "2027-07-05T12:00:00Z", exam_window_start_at: "2027-05-03T00:00:00Z", exam_window_end_at: "2027-05-21T23:59:59Z", late_fee_cents: 4000, unused_exam_penalty_cents: 1500, fee_reduction_cents: 3600, budget_cap_cents: 100000000, rebate_rate_bp: 900 }
              as: ApCoordinator
              captures: { cyB: $.data.id }
