  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: screening_score_exactly_three_substantive
        grounds:
          - calculations.screening_score
          - state_machines.ThreatCase.TRIAGED_to_UNDER_ASSESSMENT
        distinguishing_aspect: |
          Metric = screening factor count on POST /threat-cases/{id}/screening:
          exactly 3 true factors (>= 3) lands SUBSTANTIVE -> UNDER_ASSESSMENT,
          while 2 true factors lands NON_SUBSTANTIVE -> CLOSED_NO_THREAT; the
          >= boundary is exact.
        test_recipe:
          setup:
            - "Two triaged cases A and B on one school; clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Boundary ES", school_code: "BES", enrollment_count: 400 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-B1", reporter_channel: "TIP_LINE", summary: "boundary 3" }
              as: IntakeCoordinator
              captures: { case_a: $.data.id }
            - call: "POST /threat-cases/${case_a}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases"
              payload: { school_id: "${school_id}", subject_alias: "STU-B2", reporter_channel: "TIP_LINE", summary: "boundary 2" }
              as: IntakeCoordinator
              captures: { case_b: $.data.id }
            - call: "POST /threat-cases/${case_b}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /threat-cases/${case_a}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: true, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { a_score: $.data.screening_score, a_outcome: $.data.screening_outcome, a_status: $.data.status }
            - call: "POST /threat-cases/${case_b}/screening"
              payload: { threat_of_violence: true, weapon_mention: true, target_identified: false, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
              captures: { b_score: $.data.screening_score, b_outcome: $.data.screening_outcome, b_status: $.data.status }
          assert:
            - "Case A: screening_score == 3, screening_outcome == SUBSTANTIVE, status == UNDER_ASSESSMENT"
            - "Case B: screening_score == 2, screening_outcome == NON_SUBSTANTIVE, status == CLOSED_NO_THREAT"
            - "Case B: closed_at set and retention_purge_after == 2027-08-01 (365-day default)"

      - name: retention_purge_on_exact_date
        grounds:
          - calculations.retention_purge_eligibility
          - state_machines.ThreatCase.CLOSED_NO_THREAT_to_PURGED
        distinguishing_aspect: |
          Metric = elapsed calendar days vs retention_purge_after on
          POST /records-retention/purge (different metric and endpoint than the
          screening-count sibling): a case whose purge date EQUALS the current
          logical date is purged (>= semantics) while a case one day short is
          not.
        test_recipe:
          setup:
            - "School A with retention_days 365 and school B with retention_days 366"
            - "Case A (school A) and case B (school B) both CLOSED_NO_THREAT at 2026-08-01 with one CaseDocument each; purge dates 2027-08-01 (A) and 2027-08-02 (B)"
            - "Clock advanced to exactly 2027-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Retention A", school_code: "RA", enrollment_count: 300, retention_days: 365 }
              as: DistrictAdministrator
              captures: { sch_a: $.data.id }
            - call: "POST /schools"
              payload: { name: "Retention B", school_code: "RB", enrollment_count: 300, retention_days: 366 }
              as: DistrictAdministrator
              captures: { sch_b: $.data.id }
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_a}", subject_alias: "STU-R1", reporter_channel: "TIP_LINE", summary: "purge me on boundary" }
              as: IntakeCoordinator
              captures: { case_a: $.data.id }
            - call: "POST /threat-cases/${case_a}/triage"
              payload: { triage_priority: "ROUTINE", triage_notes: "t" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_a}/documents"
              payload: { doc_type: "INTAKE_NOTE", body: "intake narrative A" }
              as: IntakeCoordinator
            - call: "POST /threat-cases/${case_a}/screening"
              payload: { threat_of_violence: true, weapon_mention: false, target_identified: false, plan_described: false, prior_incidents: false, current_distress: false }
              as: ThreatAssessor
              as_user_id: ta_1
            - call: "POST /threat-cases"
              payload: { school_id: "${sch_b}", subject_alias: "STU-R2", reporter_channel: "TIP_LINE", summary: "not yet purgeable" }
              as: IntakeCoordinator
              captures: { case_b: $.data.id }
            - call: "POST /threat-cases/${case_b}/triage"
