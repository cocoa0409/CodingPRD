  # --- AdvisoryAgreement ---
  - { method: POST, path: "/advisory/advisory-agreements", description: "Draft an advisory agreement (fee schedule)", roles: [CommodityAdvisor], code: 201, input: [operation_id, fee_type, "rate_per_bushel?", "flat_annual_fee?", "annual_cap_dollars?"], output: AdvisoryAgreement, side_effects: ["status=DRAFT", "disclosure_status=NONE"] }
