            - "the second call returns HTTP 404 with data.error_id == ERR_HOLDER_NOT_FOUND"
            - "the third call returns HTTP 422 ERR_INVALID_REQUEST, because conversion_ratio 1.5 is outside the 0.001..1.000 range of priority 3"
            - "GET /fairtrade/supply-chain-nodes?holder_id=${prod_id} returns 0 rows, so no refusal created a node"

