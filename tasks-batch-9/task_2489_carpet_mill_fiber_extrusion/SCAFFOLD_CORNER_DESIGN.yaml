              as: MillPlanner
          assert:
            - "every POST returns 200 or 201 and none returns 403"
            - "FiberBatch.${fb}.status == RELEASED and denier_actual == 1200.0"
            - "CarpetStyle.${st}.status == ACTIVE"
            - "the clock call returns current_utc == 2026-08-05T08:00:00Z with all three cascade arrays empty"
            - "ProductionRun.${pr}.status == TUFTING"

      - name: disallowed_roles_are_rejected_as_unauthorized
        claim_type: role_denied
        grounds:
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
          - roles.QALabTechnician
          - roles.DealerBuyer
        distinguishing_aspect: |
          Five cross-role attempts on five endpoints all return 403 and never leak the resource's
          existence: the DealerBuyer allocate is refused before the unknown cut-order id is even
          looked up, because the RBAC check sits at priority 2 and the path-existence check at
          priority 5.
        test_recipe:
          setup:
            - "One ACTIVE style and one PENDING roll are irrelevant to the outcome; the database may be empty."
          setup_api_calls: []
          trigger:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-X", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "PIECE_DYED", list_price_cents_per_yard: 4275 }
              as: ExtrusionOperator
            - call: "POST /mill/product-tests"
              payload: { style_id: "00000000-0000-4000-8000-000000000404", roll_good_id: "00000000-0000-4000-8000-000000000404", test_type: "WEAR_TARR", result_value: 4.0 }
              as: MillPlanner
            - call: "POST /mill/certifications"
              payload: { style_id: "00000000-0000-4000-8000-000000000404", cert_type: "DOC_FF_1_70", source_test_ids: ["00000000-0000-4000-8000-000000000404"], expires_at_utc: "2027-08-01T00:00:00Z" }
              as: DyeHouseOperator
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: QALabTechnician
              as_user_id: "qa-tech-1"
            - call: "POST /mill/cut-orders/00000000-0000-4000-8000-000000000404/allocate"
              payload: {}
              as: DealerBuyer
              as_user_id: "00000000-0000-4000-8000-000000000001"
          assert:
            - "all five calls return HTTP 403 with error.error_id == ERR_UNAUTHORIZED"
            - "none of them returns 404, so the RBAC check precedes path resolution"
            - "GET /mill/styles as PlantAdmin returns meta.total_count == 0"

      - name: certificate_issued_by_the_testing_technician_returns_segregation_of_duties
        claim_type: segregation_of_duties
