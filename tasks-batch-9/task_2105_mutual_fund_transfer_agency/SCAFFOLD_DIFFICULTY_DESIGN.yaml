  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: materiality_threshold_is_inclusive_at_exactly_fifty_basis_points
        grounds:
          - calculations.pricing_error_materiality
          - state_machines.PricingErrorCase.DETECTED_to_ASSESSED
          - errors[ERR_INVALID_CASE_STATE]
          - entities.PricingErrorCase.fields.error_bps
        distinguishing_aspect: |
          The boundary metric is the basis-point pricing error on POST /pricing-error-cases/{id}/assess:
          an 11.0000 to 11.0550 move is exactly 50.00 bps and must be MATERIAL because the comparison is
          >=, while an 11.0000 to 11.0540 move is 49.09 bps and must be IMMATERIAL.
        test_recipe:
          setup:
            - "Two share classes Z and Y, both seeded at 11.0000 with zero shares outstanding, so each NAV strike returns exactly 11.0000."
            - "A FINAL NavRecord for 2026-08-03 on each class."
            - "One DETECTED case on class Z proposing 11.0550 and one DETECTED case on class Y proposing 11.0540."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /funds"
              payload: { name: "Meridian Income Fund", fund_family_code: "MER", cutoff_time_utc: "16:00:00" }
              as: FundAccountant
              captures: { fund_id: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "I", seed_nav_per_share: 11.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_z: $.data.id }
            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "C", seed_nav_per_share: 11.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0}], cdsc_enabled: false }
              as: FundAccountant
              captures: { sc_y: $.data.id }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_z}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav_z: $.data.id }
            - call: "POST /nav-records/${nav_z}/finalize"
              payload: {}
              as: FundAccountant
              captures: { nav_z_v: $.data.version }
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_y}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav_y: $.data.id }
            - call: "POST /nav-records/${nav_y}/finalize"
              payload: {}
              as: FundAccountant
              captures: { nav_y_v: $.data.version }
            - call: "POST /pricing-error-cases"
              payload: { nav_record_id: "${nav_z}", corrected_nav_per_share: 11.0550, error_reason: "Exactly at the materiality threshold", expected_nav_record_version: "${nav_z_v}" }
              as: FundAccountant
              as_user_id: "fa-1"
              captures: { case_z: $.data.id }
            - call: "POST /pricing-error-cases"
              payload: { nav_record_id: "${nav_y}", corrected_nav_per_share: 11.0540, error_reason: "One ten-thousandth below the threshold", expected_nav_record_version: "${nav_y_v}" }
              as: FundAccountant
              as_user_id: "fa-1"
              captures: { case_y: $.data.id }
          trigger:
            - call: "POST /pricing-error-cases/${case_z}/assess"
              payload: {}
              as: FundAccountant
              as_user_id: "fa-1"
            - call: "POST /pricing-error-cases/${case_y}/assess"
              payload: {}
              as: FundAccountant
              as_user_id: "fa-1"
            - call: "POST /pricing-error-cases/${case_z}/close-immaterial"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_close: $.data.error_id }
          assert:
            - "NavRecord.${nav_z}.nav_per_share == 11.0000 and NavRecord.${nav_y}.nav_per_share == 11.0000"
            - "PricingErrorCase.${case_z}.error_bps == 50.00"
            - "PricingErrorCase.${case_z}.materiality == MATERIAL"
            - "PricingErrorCase.${case_y}.error_bps == 49.09"
            - "PricingErrorCase.${case_y}.materiality == IMMATERIAL"
            - "the close-immaterial call on ${case_z} returns HTTP 409 with error_id ERR_INVALID_CASE_STATE"
            - "PricingErrorCase.${case_z}.status == ASSESSED after the rejected close-immaterial call"

      - name: blue_sky_capacity_accepts_exact_remaining_and_rejects_one_cent_more
        grounds:
          - calculations.blue_sky_capacity_ledger
          - "validations[priority=140]"
          - state_machines.BlueSkyRegistration.ACTIVE_to_EXHAUSTED
