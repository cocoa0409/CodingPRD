        distinguishing_aspect: |
          Mode b - order of operations. The three buckets must be rounded per owner FIRST and only
          then closed with one signed residual per bucket, in the fixed order capital, operating,
          overhead. Odd pools (capital 1000005, operating 100003) make every per-owner raw share land
          on a half cent, so both money buckets overshoot by one cent and the operator absorbs a
          NEGATIVE residual in each: direct_capital 500002 (not 500003) and direct_operating 50001,
