              as: Admin
              captures: { referrer: "$.data.id" }
            - call: "POST /api/leads"
              payload: { full_name: "Referee E2", address: "21 Referee Rd", phone: "555-0211", region: "NE", sales_rep_id: "${rep}" }
              as: Admin
              captures: { referee: "$.data.id" }
            - call: "POST /api/referrals"
              payload: { referrer_lead_id: "${referrer}", referee_lead_id: "${referee}" }
              as: Admin
              captures: { ref: "$.data.id" }
            - call: "POST /api/appointments"
              payload: { lead_id: "${referee}", sales_rep_id: "${rep}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: Admin
              captures: { appt: "$.data.id" }
            - call: "POST /api/appointments/${appt}/transition"
              payload: { to_status: "COMPLETED", measured_linear_feet: 200 }
              as: Admin
            - call: "GET /api/leads/${referee}"
              payload: {}
              as: Admin
              captures: { lv: "$.data.version" }
            - call: "POST /api/quotes"
              payload: { lead_id: "${referee}", appointment_id: "${appt}", sales_rep_id: "${rep}", product_id: "${pid}", color: "WHITE", estimated_linear_feet: 200, downspout_count: 0, discount_pct: 0, expected_lead_version: "${lv}" }
              as: Admin
              captures: { qid: "$.data.id" }
            - call: "POST /api/quotes/${qid}/present"
              payload: {}
              as: Admin
            - call: "POST /api/quotes/${qid}/transition"
              payload: { to_status: "ACCEPTED" }
              as: Admin
            - call: "GET /api/jobs"
              payload: { quote_id: "${qid}" }
              as: Admin
              captures: { jid: "$.data[0].id" }
            - call: "POST /api/jobs/${jid}/schedule"
              payload: { crew_id: "${crew}", install_date: "2026-06-10" }
              as: Admin
            - call: "GET /api/leads/${referrer}"
              payload: {}
              as: Admin
              captures: { credit_before: "$.data.credit_balance_cents" }
          trigger:
            - call: "POST /api/jobs/${jid}/transition"
              payload: { to_status: "CANCELED" }
              as: Admin
            - call: "GET /api/referrals/${ref}"
              payload: {}
              as: Admin
              captures: { refstat: "$.data.status" }
            - call: "GET /api/leads/${referrer}"
              payload: {}
              as: Admin
              captures: { credit_after: "$.data.credit_balance_cents" }
          assert:
            - "credit_before == 17100 (forward: PAYABLE credited the referrer round(570000*0.03))"
            - "refstat == CLAWED_BACK and credit_after == 0 (compensating clawback removes exactly payout_cents; invariant Lead.credit_balance_cents == SUM over PAYABLE/PAID holds at 0)"
