      setup:
      - The logical clock is at the mandatory default 2026-08-01T00:00:00Z.
      - Vendor V-CROSS is created COMMISSION at 1500 bps, taken through begin-integration, all four message types
        recorded and evaluated PASS, given one ACTIVE coverage row US-WEST / GROUND with transit_days 4 and cutoff_hour_utc
        18, and certified by X-User-ID ops-certifier-cross, so onboarding_status is CERTIFIED.
      - Offer IC (sku SKU-RUG-2, unit_retail_cents 12000, GROUND, lead_time_days 3) is created against V-CROSS while
        the vendor is CERTIFIED, which is allowed, so IC sits in DRAFT.
