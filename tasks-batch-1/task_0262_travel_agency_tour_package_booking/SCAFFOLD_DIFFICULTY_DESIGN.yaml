              as: TravelAgent
              captures: { va1: $.data.version }
            - call: "POST /agencies/bookings/${bka}/reserve"
              payload: { expected_booking_version: "${va1}" }
              as: TravelAgent
            - call: "GET /agencies/milestones?booking_id=${bka}&kind=DEPOSIT"
              payload: {}
              as: TravelAgent
              captures: { dep_a: "$.data[0].id" }
            # Booking B: stays DRAFT; we attempt a payment on it (referencing booking A's real milestone id) -> blocked by booking-B-state gate.
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-01T00:00:00.000Z" }
              as: TravelAgent
              captures: { bkb: $.data.id, vb0: $.data.version }
            - call: "POST /agencies/bookings/${bkb}/travelers"
              payload: { full_name: "TB", expected_booking_version: "${vb0}" }
              as: TravelAgent
          trigger:
            - call: "POST /agencies/payments"
              payload: { booking_id: "${bkb}", milestone_id: "${dep_a}", amount_cents: 1000, method: "CARD" }
              as: TravelAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_hotel_within_booking_half_open
        grounds:
          - calculations.component_overlap_detection
          - validations[priority=9]
          - errors[ERR_COMPONENT_OVERLAP]
        distinguishing_aspect: "Half-open within-booking semantics on the Booking's HOTEL schedule: a second HOTEL component [10:00,12:00) overlapping [08:00,11:00) on the same booking/supplier is rejected, but a back-to-back [11:00,13:00) touching the first's ends_at is accepted (strict '<')."
        test_recipe:
          setup:
            - "DRAFT booking with a HOTEL component h1 [2026-06-01T08:00,11:00) from supplier sup_h; request an overlapping HOTEL h2 [10:00,12:00)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "Hotel1", kind: "HOTEL", auto_confirm: true }
              as: AgencyAdmin
              captures: { sup_h: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "P", base_price_per_person_cents: 100000 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-10T00:00:00.000Z" }
              as: TravelAgent
              captures: { bk: $.data.id }
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup_h}", kind: "HOTEL", starts_at: "2026-06-01T08:00:00.000Z", ends_at: "2026-06-01T11:00:00.000Z", is_mandatory: true }
              as: TravelAgent
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /agencies/components"
              payload: { booking_id: "${bk}", supplier_id: "${sup_h}", kind: "HOTEL", starts_at: "2026-06-01T10:00:00.000Z", ends_at: "2026-06-01T12:00:00.000Z", is_mandatory: true }
              as: TravelAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMPONENT_OVERLAP"
            - "HTTP status == 409"
      - name: rto_flight_cross_booking_supplier_buffer
        grounds:
          - calculations.component_overlap_detection
          - validations[priority=10]
          - errors[ERR_SUPPLIER_CAPACITY_CONFLICT]
        distinguishing_aspect: "Buffered aggregate-capacity semantics on a DIFFERENT resource (the Supplier) and DIFFERENT entity pair across bookings: a FLIGHT on supplier sup_f for booking B2 [11:05,13:00) collides with sup_f's existing FLIGHT on booking B1 [08:00,11:00) because 11:05 < 11:00 + 7200s buffer, even though the raw intervals do not overlap."
        test_recipe:
          setup:
            - "Booking B1 with a CONFIRMED FLIGHT [2026-06-01T08:00,11:00) on auto_confirm supplier sup_f; a separate booking B2 requests a FLIGHT [11:05,13:00) on the SAME supplier (within the 2h buffer)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/customers"
              payload: { agency_id: "${ag}", email: "c@x.com", full_name: "C" }
              as: AgencyAdmin
              captures: { cust: $.data.id }
            - call: "POST /agencies/suppliers"
              payload: { agency_id: "${ag}", name: "FlightCo", kind: "FLIGHT", auto_confirm: true }
              as: AgencyAdmin
              captures: { sup_f: $.data.id }
            - call: "POST /agencies/tour-packages"
              payload: { agency_id: "${ag}", title: "P", base_price_per_person_cents: 100000 }
              as: TravelAgent
              captures: { pkg: $.data.id }
            - call: "POST /agencies/tour-packages/${pkg}/publish"
              payload: {}
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-10T00:00:00.000Z" }
              as: TravelAgent
              captures: { b1: $.data.id }
            - call: "POST /agencies/components"
              payload: { booking_id: "${b1}", supplier_id: "${sup_f}", kind: "FLIGHT", starts_at: "2026-06-01T08:00:00.000Z", ends_at: "2026-06-01T11:00:00.000Z", is_mandatory: true }
              as: TravelAgent
            - call: "POST /agencies/bookings"
              payload: { agency_id: "${ag}", customer_id: "${cust}", tour_package_id: "${pkg}", departure_date: "2026-06-12T00:00:00.000Z" }
              as: TravelAgent
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /agencies/components"
              payload: { booking_id: "${b2}", supplier_id: "${sup_f}", kind: "FLIGHT", starts_at: "2026-06-01T11:05:00.000Z", ends_at: "2026-06-01T13:00:00.000Z", is_mandatory: true }
              as: TravelAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SUPPLIER_CAPACITY_CONFLICT"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_payment_ledger_conserved_on_cancel
        grounds:
          - state_machines.Payment.APPLIED_to_REFUNDED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.paid_cents
          - entities.PaymentMilestone.fields.settled_amount_cents
        distinguishing_aspect: "Conserved quantity = the booking payment ledger identity paid_cents == sum(APPLIED Payment.amount_cents) == sum(milestone.settled_amount_cents): apply DEPOSIT 20000 (paid_cents=20000, settled=20000), then cancel refunds it so paid_cents==0 AND settled_amount_cents==0 — no drift."
        test_recipe:
          setup:
            - "CONFIRMED booking, grand=100000, DEPOSIT 20000 SETTLED, paid_cents=20000; departure 2026-06-01 (TIER_FREE, penalty 0)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Globe", currency: "USD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
