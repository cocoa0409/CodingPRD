          assert:
            - "Loan.${loan_id}.coverage_status == CANCELLED"
            - "Loan.${loan_id}.cancellation_effective_utc == 2026-10-15T00:00:00Z, clamped forward to the notice instant plus 30 days"
            - "CancellationNotice.${notice_id}.refund_cents == 3000000, being the lesser of the evidence amount and the 7500000-cent maximum refund"
            - "Loan.${loan_id}.annual_premium_cents == 52700 and 11 * Loan.${loan_id}.monthly_period_cents + Loan.${loan_id}.final_period_cents == 52700"
            - "the loan's premium schedule still sums to 52700 after cancellation, so the compensating refund left the conserved quantity intact"
            - "Loan.${loan_id}.coverage_status == ACTIVE and the loan's schedule total == 52700 before the cancellation, so the quantity is unchanged across the action and its compensation"

