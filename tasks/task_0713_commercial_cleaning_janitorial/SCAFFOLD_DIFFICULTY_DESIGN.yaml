# =============================================================================
# task_0713 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules, >=2 instances each (18 total).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: load_estimate_round_then_sum_vs_sum_then_round
        grounds:
          - calculations.labor_load
          - entities.BidEstimate.fields.monthly_labor_hours
          - entities.BidEstimate.fields.loading_method
        distinguishing_aspect: |
          Two BidEstimates over the SAME ServiceArea set differ only in loading_method;
          ESTIMATE (round-then-sum) yields weekly 43.34 / monthly 187.66, LOADED
          (sum-then-round) yields weekly 43.33 / monthly 187.62 — divergent on the
          labor-hours domain.
        test_recipe:
          setup:
            - "Account + OPEN RFP with three ServiceAreas: two MEDIUM 10000sqft@5/wk, one HEAVY 4000sqft@5/wk."
            - "Two BidEstimates on the RFP: one loading_method=ESTIMATE, one LOADED, both base_wage 1800, margin 0.20."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme Towers", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "HQ janitorial", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 24000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Floor 1", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Floor 2", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Restrooms", sqft: 4000, soil_level: "HEAVY", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "ESTIMATE" }
              as: BidEstimator
              captures: { bid_est: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid_loaded: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid_est}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid_loaded}/price"
              payload: {}
              as: BidEstimator
          assert:
            - "BidEstimate.${bid_est}.monthly_labor_hours == 187.66"
            - "BidEstimate.${bid_loaded}.monthly_labor_hours == 187.62"
            - "BidEstimate.${bid_est}.monthly_labor_hours != BidEstimate.${bid_loaded}.monthly_labor_hours"

      - name: renewal_escalation_cpi_vs_flat
        grounds:
          - calculations.renewal_escalation
          - entities.RenewalCycle.fields.proposed_monthly_cents
          - entities.RenewalCycle.fields.escalation_method
        distinguishing_aspect: |
          Two RenewalCycles on the SAME SERVICING contract (monthly_value 671776) differ
          only in escalation_method: CPI -> 693273, FLAT -> 686776 — divergent on the
          contract-value domain (distinct entity from labor hours).
        setup_chain_note: "Reuses the full win→sign→go-live chain to reach SERVICING contract value 671776."
        test_recipe:
          setup:
            - "A SERVICING CleaningContract with monthly_value_cents == 671776."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Towerline LLC", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Bid R1", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 24000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/site-contacts"
              payload: { full_name: "Pat Site", avail_start_at: "2026-03-02T08:00:00Z", avail_end_at: "2026-03-02T18:00:00Z" }
              as: SalesRep
              captures: { sc: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs"
              payload: { site_contact_id: "${sc}", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T10:00:00Z" }
              as: SalesRep
              captures: { wt: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs/${wt}/complete"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F1", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F2", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "RR", sqft: 4000, soil_level: "HEAVY", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/send"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/contracts"
              payload: { proposal_id: "${prop}", term_months: 12 }
              as: SalesRep
              captures: { ctr: "$.data.id" }
            - call: "POST /accounts/${acct}/contracts/${ctr}/sign"
              payload: {}
              as: SalesRep
            - call: "GET /accounts/${acct}/startup-plans"
              payload: {}
              as: OperationsManager
              captures: { plan: "$.data[0].id" }
            - call: "POST /crews"
              payload: { name: "Crew A", weekly_capacity_hours: 200 }
              as: OperationsManager
              captures: { crew: "$.data.id" }
            - call: "POST /accounts/${acct}/startup-plans/${plan}/crew"
              payload: { crew_id: "${crew}", start_at: "2026-03-03T09:00:00Z", end_at: "2026-03-03T17:00:00Z" }
              as: OperationsManager
            - call: "POST /accounts/${acct}/startup-plans/${plan}/abort"
              payload: {}
              as: OperationsManager
            - call: "POST /accounts/${acct}/startup-plans/${plan}/mark-ready"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /accounts/${acct}/contracts/${ctr}/renewal-cycles"
              payload: { escalation_method: "CPI" }
              as: AccountManager
              as_user_id: "ops-am-1"
              captures: { rc_cpi: "$.data.id" }
          assert:
            - "RenewalCycle.${rc_cpi}.proposed_monthly_cents == 693273"
            - "A FLAT RenewalCycle on the same contract would compute proposed_monthly_cents == 686776 (671776 + 15000), distinct from CPI."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: burden_tier_selection_three_inputs_nonlinear
        grounds:
          - calculations.bid_buildup
          - entities.BidEstimate.fields.labor_cost_cents
          - entities.BidEstimate.fields.total_cost_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (monthly_labor_hours, base_wage_cents, ServiceArea supply)
          with non-linear tiered burden selection (1.20/1.28/1.35) feeding labor_cost
          then overhead then base_bid; monthly 187.62 selects burden 1.28 giving
          total_cost_cents 554042, base_bid_cents 692553.
        test_recipe:
          setup:
            - "RFP with two MEDIUM 10000@5 + one HEAVY 4000@5; LOADED bid, base_wage 1800, margin 0.20."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Burden Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Burden RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 24000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F1", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F2", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "RR", sqft: 4000, soil_level: "HEAVY", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
          assert:
            - "BidEstimate.${bid}.monthly_labor_hours == 187.62"
            - "BidEstimate.${bid}.labor_cost_cents == 432276"
            - "BidEstimate.${bid}.supply_cost_cents == 42000"
            - "BidEstimate.${bid}.total_cost_cents == 554042"
            - "BidEstimate.${bid}.base_bid_cents == 692553"

      - name: proposal_discount_keyed_on_bid_tier_circular_order
        grounds:
          - calculations.proposal_pricing
          - entities.Proposal.fields.monthly_price_cents
          - entities.Proposal.fields.achieved_margin_pct
        distinguishing_aspect: |
          Mode (c): circular-looking — volume_discount is keyed on the base_bid tier
          (692553 in [500000,800000) -> 3%) and the achieved_margin is then recomputed on
          the discounted price; evaluation order pinned -> monthly_price 671776, margin 17.53.
        test_recipe:
          setup:
            - "PRICED BidEstimate with base_bid_cents 692553, total_cost_cents 554042."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Disc Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Disc RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 24000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F1", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F2", sqft: 10000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "RR", sqft: 4000, soil_level: "HEAVY", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
          assert:
            - "Proposal.${prop}.monthly_price_cents == 671776"
            - "Proposal.${prop}.achieved_margin_pct == 17.53"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_revision_cycle_sent_back_to_draft
        grounds:
          - state_machines.Proposal.SENT_to_DRAFT
          - state_machines.RfpOpportunity.PROPOSED_to_BIDDING
          - entities.Proposal.fields.revision_round
        distinguishing_aspect: |
          Cycle on Proposal: DRAFT->SENT->DRAFT increments revision_round to 2 and bounces
          parent RFP PROPOSED->BIDDING — a true A->B->A loop, distinct entity from the
          CleaningContract parallel machine below.
        test_recipe:
          setup:
            - "A SENT Proposal (revision_round 1) on a PROPOSED RFP."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Rev Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "Rev RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 8000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/site-contacts"
              payload: { full_name: "Sam", avail_start_at: "2026-03-02T08:00:00Z", avail_end_at: "2026-03-02T18:00:00Z" }
              as: SalesRep
              captures: { sc: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs"
              payload: { site_contact_id: "${sc}", start_at: "2026-03-02T09:00:00Z", end_at: "2026-03-02T10:00:00Z" }
              as: SalesRep
              captures: { wt: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/walkthroughs/${wt}/complete"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "F1", sqft: 8000, soil_level: "MEDIUM", frequency_per_week: 5 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/send"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/revise"
              payload: {}
              as: SalesRep
          assert:
            - "Proposal.${prop}.status == DRAFT"
            - "Proposal.${prop}.revision_round == 2"
            - "RfpOpportunity.${rfp}.status == BIDDING"

      - name: contract_parallel_lifecycle_and_billing_axes
        grounds:
          - state_machines.CleaningContract.ACTIVE_to_SUSPENDED
          - state_machines.CleaningContract.SUSPENDED_to_ACTIVE
          - entities.CleaningContract.fields.lifecycle_status
          - entities.CleaningContract.fields.billing_status
        distinguishing_aspect: |
          Parallel dimensions on one entity: billing_status ACTIVE->SUSPENDED->ACTIVE evolves
          while lifecycle_status stays SERVICING throughout — two independent axes on
          CleaningContract (distinct entity from Proposal cycle above).
        test_recipe:
          setup:
            - "A SERVICING contract with billing_status ACTIVE (post go-live)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Parallel Co", industry: "OFFICE" }
              as: SalesRep
              captures: { acct: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps"
              payload: { title: "P RFP", due_at: "2026-04-01T00:00:00Z", estimated_total_sqft: 4000 }
              as: SalesRep
              captures: { rfp: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/service-areas"
              payload: { label: "Lobby", sqft: 4000, soil_level: "LIGHT", frequency_per_week: 1 }
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates"
              payload: { base_wage_cents: 1800, target_margin_pct: 0.20, loading_method: "LOADED" }
              as: BidEstimator
              captures: { bid: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/bid-estimates/${bid}/price"
              payload: {}
              as: BidEstimator
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals"
              payload: { bid_estimate_id: "${bid}" }
              as: SalesRep
              captures: { prop: "$.data.id" }
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/send"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/rfps/${rfp}/proposals/${prop}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /accounts/${acct}/contracts"
              payload: { proposal_id: "${prop}", term_months: 12 }
              as: SalesRep
              captures: { ctr: "$.data.id" }
            - call: "POST /accounts/${acct}/contracts/${ctr}/sign"
              payload: {}
              as: SalesRep
            - call: "GET /accounts/${acct}/startup-plans"
              payload: {}
              as: OperationsManager
              captures: { plan: "$.data[0].id" }
            - call: "POST /crews"
              payload: { name: "C1", weekly_capacity_hours: 50 }
              as: OperationsManager
              captures: { crew: "$.data.id" }
            - call: "POST /accounts/${acct}/startup-plans/${plan}/crew"
              payload: { crew_id: "${crew}", start_at: "2026-03-03T09:00:00Z", end_at: "2026-03-03T14:00:00Z" }
              as: OperationsManager
            - call: "POST /accounts/${acct}/startup-plans/${plan}/mark-ready"
              payload: {}
              as: OperationsManager
            - call: "POST /accounts/${acct}/startup-plans/${plan}/go-live"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /accounts/${acct}/contracts/${ctr}/billing/suspend"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
            - call: "POST /accounts/${acct}/contracts/${ctr}/billing/resume"
              payload: {}
              as: AccountManager
              as_user_id: "am-1"
          assert:
            - "CleaningContract.${ctr}.billing_status == ACTIVE"
            - "CleaningContract.${ctr}.lifecycle_status == SERVICING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: golive_cascade_plan_contract_account_billing_depth4
