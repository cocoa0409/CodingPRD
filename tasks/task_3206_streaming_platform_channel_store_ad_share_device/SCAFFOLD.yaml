    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: TvManufacturer
    side_effects: ["license_status -> SUSPENDED"]
  - method: POST
    path: "/manufacturers/{id}/reinstate"
    description: "Reinstate a SUSPENDED license; requires no OVERDUE device models"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TvManufacturer
    side_effects: ["license_status -> LICENSED"]
  - method: GET
    path: "/manufacturers/{id}/device-models"
    description: "List a manufacturer's device models (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceModel[]"
    side_effects: []
  - method: GET
    path: "/manufacturers/{id}/lab-bookings"
    description: "List a manufacturer's lab bookings (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: ["limit?", "offset?"]
    output: "LabBooking[]"
    side_effects: []

  # --- Device models ---
  - method: POST
    path: "/device-models"
    description: "Submit a device model for certification (initial cert_status SUBMITTED)"
    roles: [TvManufacturer]
    code: 201
    input: [manufacturer_id, model_code, recovery_policy]
    output: DeviceModel
    side_effects: ["cert_status=SUBMITTED, update_compliance=COMPLIANT"]
  - method: GET
    path: "/device-models/{id}"
    description: "Get a device model"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: []
    output: DeviceModel
    side_effects: []
  - method: POST
    path: "/device-models/{id}/lab-bookings"
    description: "Book a certification lab bench; moves model SUBMITTED -> LAB_TESTING"
    roles: [TvManufacturer]
    code: 201
    input: [bench_code, window_start, window_end]
    output: LabBooking
    side_effects: ["LabBooking BOOKED; model cert_status -> LAB_TESTING; lab_overlap_and_capacity_check enforced"]
  - method: GET
    path: "/device-models/{id}/lab-bookings"
    description: "List a model's lab bookings (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: ["limit?", "offset?"]
    output: "LabBooking[]"
    side_effects: []
  - method: POST
    path: "/device-models/{id}/certify"
    description: "Certify a model whose lab window has finished"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeviceModel
    side_effects: ["cert_status LAB_TESTING -> CERTIFIED; its BOOKED lab booking -> COMPLETED"]
  - method: POST
    path: "/device-models/{id}/reject"
    description: "Reject a model in LAB_TESTING"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: DeviceModel
    side_effects: ["cert_status -> REJECTED; BOOKED lab bookings -> CANCELLED"]
  - method: POST
    path: "/device-models/{id}/resubmit"
    description: "Resubmit a REJECTED model (revision loop)"
    roles: [TvManufacturer]
    code: 200
    input: []
    output: DeviceModel
    side_effects: ["cert_status REJECTED -> SUBMITTED"]
  - method: POST
    path: "/device-models/{id}/decertify"
    description: "Decertify a CERTIFIED model (terminal for certification)"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: DeviceModel
    side_effects: ["cert_status CERTIFIED -> DECERTIFIED"]
  - method: POST
    path: "/device-models/{id}/refresh-compliance"
    description: "Re-evaluate update_compliance against mandatory OS updates and the logical clock; OVERDUE cascades to manufacturer license SUSPENDED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeviceModel
    side_effects: ["update_compliance re-derived per DeviceModel.update_compliance machine; OVERDUE suspends the manufacturer license"]
  - method: GET
    path: "/device-models/{id}/device-units"
    description: "List a model's device units (FK reverse reachability)"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceUnit[]"
    side_effects: []

  # --- OS updates ---
  - method: POST
    path: "/os-updates"
    description: "Announce a platform OS update with compliance deadline"
    roles: [PlatformAdmin]
    code: 201
    input: [version_tag, mandatory, rollout_start, compliance_deadline]
    output: OsUpdate
    side_effects: ["status=ROLLING"]
  - method: GET
    path: "/os-updates"
    description: "List OS updates"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: ["mandatory?", "limit?", "offset?"]
    output: "OsUpdate[]"
    side_effects: []
  - method: GET
    path: "/os-updates/{id}"
    description: "Get an OS update"
    roles: [PlatformAdmin, AdOps, TvManufacturer]
    code: 200
    input: []
    output: OsUpdate
    side_effects: []
  - method: POST
    path: "/os-updates/{id}/withdraw"
    description: "Withdraw an OS update"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: OsUpdate
    side_effects: ["status -> WITHDRAWN; withdrawn updates no longer impose compliance"]

  # --- Device units ---
  - method: POST
    path: "/device-units"
    description: "Manufacture a device unit (model CERTIFIED, manufacturer LICENSED)"
    roles: [TvManufacturer]
    code: 201
    input: [device_model_id, serial_number, hardware_cost_cents, sale_price_cents]
    output: DeviceUnit
    side_effects: ["status=MANUFACTURED; subsidy_cents computed; os_version_tag=BASE"]
  - method: GET
    path: "/device-units"
    description: "List device units"
    roles: [PlatformAdmin, AdOps, TvManufacturer, Viewer]
    code: 200
    input: ["device_model_id?", "viewer_id?", "status?", "limit?", "offset?"]
    output: "DeviceUnit[]"
    side_effects: []
  - method: GET
    path: "/device-units/{id}"
    description: "Get a device unit"
    roles: [PlatformAdmin, AdOps, TvManufacturer, Viewer]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: []
  - method: POST
    path: "/device-units/{id}/sell"
    description: "Sell a unit at its near-cost price"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["status MANUFACTURED -> SOLD"]
  - method: POST
    path: "/device-units/{id}/activate"
    description: "Activate a sold unit for the calling viewer"
    roles: [Viewer]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["status SOLD -> ACTIVATED; viewer_id set to caller"]
  - method: POST
    path: "/device-units/{id}/deactivate"
    description: "Deactivate own unit; outstanding subsidy is written off"
    roles: [Viewer]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["status ACTIVATED -> DEACTIVATED; outstanding subsidy -> written_off (INV-SUBSIDY conserved)"]
  - method: POST
    path: "/device-units/{id}/apply-os-update"
    description: "Apply a ROLLING OS update to own activated unit"
    roles: [Viewer]
    code: 200
    input: [os_update_id]
    output: DeviceUnit
    side_effects: ["os_version_tag set to the update's version_tag"]
  - method: POST
    path: "/device-units/{id}/record-ad-revenue"
    description: "Record attributed ad revenue; recovers subsidy for MONETIZATION models"
    roles: [AdOps]
    code: 200
    input: [revenue_cents]
    output: DeviceUnit
    side_effects: ["device_subsidy_recovery MONETIZATION variant applied"]
  - method: POST
    path: "/device-units/{id}/accrue-straight-line"
    description: "Accrue one month of straight-line subsidy recovery (STRAIGHT_LINE models)"
    roles: [AdOps]
    code: 200
    input: []
    output: DeviceUnit
    side_effects: ["device_subsidy_recovery STRAIGHT_LINE variant applied"]

  # --- Revenue statements ---
  - method: POST
    path: "/statements/generate"
    description: "Generate or refresh OPEN statements for every publisher for a period (provisional amounts)"
    roles: [PlatformAdmin]
    code: 200
    input: [period]
    output: { generated_count: integer }
    side_effects: ["OPEN RevenueStatement per publisher (skipped when a FINALIZED/DISPUTED/SETTLED statement already exists for that period)"]
  - method: GET
    path: "/statements"
    description: "List revenue statements"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["publisher_id?", "period?", "status?", "limit?", "offset?"]
    output: "RevenueStatement[]"
    side_effects: []
  - method: GET
    path: "/statements/{id}"
    description: "Get a revenue statement"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: []
  - method: POST
    path: "/statements/{id}/finalize"
    description: "Finalize an OPEN statement: tier assignment, fee, payouts locked; negative net accrues to outstanding balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: ["revenue_tier_assignment + statement_net_payout locked; status OPEN -> FINALIZED"]
  - method: POST
    path: "/statements/{id}/settle"
    description: "Settle a FINALIZED statement; clears its negative-net contribution to outstanding balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RevenueStatement
    side_effects: ["status FINALIZED -> SETTLED; outstanding balance reduced"]
  - method: POST
    path: "/statements/{id}/disputes"
    description: "Raise a statement dispute (owner publisher); statement FINALIZED -> DISPUTED"
    roles: [Publisher]
    code: 201
    input: [reason]
    output: Dispute
    side_effects: ["Dispute FILED with subject_type=STATEMENT; statement -> DISPUTED; increments RevenueStatement.version by 1"]

  # --- Disputes ---
  - method: POST
    path: "/disputes"
    description: "Raise a channel-removal dispute for a REMOVED channel"
    roles: [Publisher]
    code: 201
    input: [publisher_id, subject_type, "channel_id?", reason]
    output: Dispute
    side_effects: ["Dispute FILED"]
  - method: GET
    path: "/disputes"
    description: "List disputes"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: ["publisher_id?", "channel_id?", "statement_id?", "status?", "limit?", "offset?"]
    output: "Dispute[]"
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Get a dispute"
    roles: [PlatformAdmin, AdOps, Publisher]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/triage"
    description: "Triage a FILED dispute"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status FILED -> TRIAGE"]
  - method: POST
    path: "/disputes/{id}/request-evidence"
    description: "Move a TRIAGE or APPEALED dispute to evidence gathering"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> EVIDENCE"]
  - method: POST
    path: "/disputes/{id}/decide"
    description: "Decide an EVIDENCE dispute; OVERTURNED channel-removal reinstates the channel to PUBLISHED"
    roles: [PlatformAdmin]
    code: 200
    input: [decision]
    output: Dispute
    side_effects: ["status -> DECIDED; decided_at set; compensating reinstatement on OVERTURNED channel-removal"]
  - method: POST
    path: "/disputes/{id}/appeal"
    description: "Appeal a DECIDED dispute within 7 days of decided_at (owner publisher)"
    roles: [Publisher]
    code: 200
    input: [reason]
    output: Dispute
    side_effects: ["status DECIDED -> APPEALED"]
  - method: POST
    path: "/disputes/{id}/close"
    description: "Close a DECIDED dispute; a STATEMENT dispute returns its statement to FINALIZED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status DECIDED -> CLOSED; linked statement DISPUTED -> FINALIZED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed for endpoint, or entity-backed caller does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, bad enum, non-positive amount, inverted or zero-length window, bad period format" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state machine rejects the transition from its current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_CHANNEL_NOT_PUBLISHED, http: 409, condition: "Cross-entity gate: channel not PUBLISHED for subscription, campaign schedule/start/resume, or booking" }
  - { id: ERR_CAMPAIGN_NOT_ACTIVE, http: 409, condition: "Campaign not ACTIVE for impression recording or placement booking" }
  - { id: ERR_CAMPAIGN_OUTSIDE_FLIGHT, http: 409, condition: "Logical clock now outside [flight_start, flight_end) for start/resume" }
  - { id: ERR_CONTENT_POLICY_BLOCK, http: 422, condition: "Channel under a content-policy hold (policy_hold) blocks bookings and scheduling" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open placement window intersects a HELD/CONFIRMED booking on the same slot_code" }
  - { id: ERR_BENCH_OVERLAP, http: 409, condition: "Closed lab window plus 24h buffer intersects a BOOKED booking on the same bench_code" }
  - { id: ERR_BOOKING_WINDOW_PAST, http: 409, condition: "window_end <= logical clock now at creation" }
  - { id: ERR_LAB_CAPACITY_EXCEEDED, http: 409, condition: "Manufacturer already has 3 device models in LAB_TESTING" }
  - { id: ERR_DUPLICATE_SERIAL, http: 409, condition: "serial_number already exists" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "viewer email already exists" }
  - { id: ERR_DUPLICATE_MODEL_CODE, http: 409, condition: "model_code already exists for this manufacturer" }
  - { id: ERR_DUPLICATE_VERSION_TAG, http: 409, condition: "os update version_tag already exists" }
  - { id: ERR_GRANT_PERIOD_DUPLICATE, http: 409, condition: "An OPEN grant already exists for this channel and period" }
  - { id: ERR_PUBLISHER_SUSPENDED, http: 409, condition: "Publisher standing not in {GOOD, PROBATION} for version submission, publish, or reinstate" }
  - { id: ERR_REVIEW_IN_PROGRESS, http: 409, condition: "A version of this channel is already IN_REVIEW; new submissions blocked until decided" }
  - { id: ERR_MODEL_NOT_CERTIFIED, http: 409, condition: "Device model cert_status is not CERTIFIED for unit creation or activation" }
  - { id: ERR_MANUFACTURER_NOT_LICENSED, http: 409, condition: "Manufacturer license_status is not LICENSED" }
  - { id: ERR_UPDATE_OVERDUE, http: 409, condition: "Device model update_compliance == OVERDUE blocks unit activation" }
  - { id: ERR_UPDATE_NOT_APPLICABLE, http: 409, condition: "OS update not ROLLING (withdrawn) or unit already on that version" }
  - { id: ERR_RECOVERY_POLICY_MISMATCH, http: 409, condition: "Recovery endpoint does not match the device model's recovery_policy" }
  - { id: ERR_OUTSTANDING_BALANCE, http: 422, condition: "Publisher outstanding balance exceeds the campaign credit limit (100000 cents)" }
  - { id: ERR_BUDGET_EXHAUSTED, http: 422, condition: "Impression cost would push spent_cents above budget_cents" }
  - { id: ERR_PRIVACY_OPTED_OUT, http: 422, condition: "PERSONALIZED-targeted measurement on a viewer whose ad_consent is not PERSONALIZED" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "Appeal attempted more than 7 days after decided_at" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns onboarding, certification decisions, standing, removal, statements, OS updates, disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /publishers; POST /publishers/{id}/standing"
      - "POST /channels/{id}/publish|suspend|reinstate|remove|policy-hold"
      - "POST /channel-versions/{id}/review|decide"
      - "POST /viewer-accounts; POST /subscriptions/{id}/refund"
      - "POST /ad-slot-grants; POST /ad-slot-grants/{id}/resplit|close"
      - "POST /manufacturers; POST /manufacturers/{id}/suspend|reinstate"
      - "POST /device-models/{id}/certify|reject|decertify|refresh-compliance"
      - "POST /os-updates; POST /os-updates/{id}/withdraw"
      - "POST /device-units/{id}/sell"
      - "POST /statements/generate; POST /statements/{id}/finalize|settle"
      - "POST /disputes/{id}/triage|request-evidence|decide|close"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: AdOps
    description: "Ad operations; runs campaigns, measurement, bookings, grants revenue, subsidy recovery"
    identity: "opaque"
    exclusive_operations:
      - "POST /campaigns/{id}/start|pause|resume"
      - "POST /campaigns/{id}/impressions"
      - "POST /placement-bookings/{id}/confirm|release"
      - "POST /ad-slot-grants/{id}/record-revenue"
      - "POST /device-units/{id}/record-ad-revenue|accrue-straight-line"
    shared_operations: ["all GET endpoints"]
  - name: Publisher
    description: "Content publisher; owns channels, versions, campaigns, bookings, disputes"
    identity: "entity_backed:Publisher"
    exclusive_operations:
      - "POST /channels; POST /channels/{id}/versions"
      - "POST /campaigns; POST /campaigns/{id}/schedule|cancel"
      - "POST /placement-bookings"
      - "POST /statements/{id}/disputes; POST /disputes; POST /disputes/{id}/appeal"
    shared_operations: ["GET endpoints"]
  - name: Viewer
    description: "End viewer; subscribes, manages privacy controls, activates devices"
    identity: "entity_backed:ViewerAccount"
    exclusive_operations:
      - "POST /subscriptions; POST /subscriptions/{id}/cancel"
      - "PATCH /viewer-accounts/{id}/privacy"
      - "POST /device-units/{id}/activate|deactivate|apply-os-update"
    shared_operations: ["GET endpoints"]
  - name: TvManufacturer
    description: "Television OEM; submits device models, books lab benches, manufactures units"
    identity: "entity_backed:TvManufacturer"
    exclusive_operations:
      - "POST /device-models; POST /device-models/{id}/resubmit"
      - "POST /device-models/{id}/lab-bookings"
      - "POST /device-units"
    shared_operations: ["GET endpoints"]
