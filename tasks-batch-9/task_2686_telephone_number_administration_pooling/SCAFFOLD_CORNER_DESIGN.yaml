          setup: ["Carrier A holds block 614-554-0 in COLUMBUS as RESERVED with activation_due_at 2027-01-28T00:00:00Z and activated_at null. At clock 2027-01-29T00:00:00Z a sweep issued one ACTIVATION_DEADLINE_MISSED order and moved the block to RECLAMATION_PENDING."]
