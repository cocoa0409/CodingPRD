  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with an unknown/absent role fails at priority 1 with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fraudops/accounts", as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 401, error == ERR_UNAUTHENTICATED"
      - name: cardholder_cannot_act_on_other_account
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles[Cardholder]
        distinguishing_aspect: "Cardholder identity is entity_backed by Account: responding to an alert whose account_id != X-User-ID yields ERR_NOT_RESOURCE_OWNER even though the role is correct for the endpoint."
        test_recipe:
          setup: ["Accounts A1 (owns alert) and A2 (the caller); alert OPEN on A1"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-V2A", cardholder_name: "Owner A", home_country: "US" }, as: FraudOpsManager, captures: { acct1: "$.data.id" } }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-V2B", cardholder_name: "Owner B", home_country: "US" }, as: FraudOpsManager, captures: { acct2: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct1}", pan_token: "PT-V2", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card1: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct1}", card_id: "${card1}" }, as: FraudAnalyst, captures: { al: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/fraud-alerts/${al}/respond", payload: { outcome: "CONFIRMED_LEGIT" }, as: Cardholder, as_user_id: "${acct2}", captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_NOT_RESOURCE_OWNER (403); FraudAlert.${al}.alert_status remains OPEN"
      - name: travel_window_inverted_returns_invalid_window
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "end_date <= start_date on a travel notice is a 422 ERR_INVALID_WINDOW shape error, checked before overlap semantics."
        test_recipe:
          setup: ["ACTIVE account with card"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-V3", cardholder_name: "Val Three", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-V3", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/travel-notices", payload: { card_id: "${card}", region_country: "MX", start_date: "2026-08-10", end_date: "2026-08-05" }, as: FraudAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 422, error == ERR_INVALID_WINDOW"
      - name: ruleset_threshold_order_enforced
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_THRESHOLD_ORDER_INVALID]
          - entities.RuleSet.fields.review_threshold
        distinguishing_aspect: "review_threshold == decline_threshold is invalid (strict less-than); review == decline - 1 succeeds."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
