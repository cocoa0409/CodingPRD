              as: Backer
              as_user_id: "${b2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Second create with the stale ${camp_v1} (current version is ${camp_v2}) rejected error_id == ERR_STALE_CAMPAIGN_VERSION and HTTP status == 412."

      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pledge-create-stale-campaign]
