          setup:
            - "The league is IN_PLAY with fixture 1 scheduled. After start-play, one home player took a SCORECARD_FALSIFICATION strike of weight 3, so that player is STRIKE_SUSPENDED, the spot is INELIGIBLE and the home team reads active_roster_size 1 with roster_compliant false."
