# ============================================================================
# §1.7 RBAC MATRIX
# role_model: segregation_of_duties. The reporting faculty member, the panel,
# the office, the dean and the registrar are five separate hands; no single
# X-User-ID may occupy two of them on the same case.
# ============================================================================
roles:
  - name: IntegrityOfficer
    backing: opaque
    header_note: "X-User-ID is an opaque office-staff identifier that need not resolve to any entity"
    exclusive_operations:
      - "POST /integrity/departments, /integrity/faculty-members, /integrity/students, /integrity/course-offerings, /integrity/hearing-rooms"
      - "POST /integrity/reports/{id}/triage"
      - "POST /integrity/cases, POST /integrity/cases/legacy-import"
      - "POST /integrity/cases/{id}/pathway, POST /integrity/cases/{id}/dismiss, POST /integrity/cases/{id}/notifications"
      - "POST /integrity/advisor-engagements/{id}/review"
      - "POST /integrity/hearing-sessions, POST /integrity/hearing-sessions/{id}/cancel"
      - "POST /integrity/sanctions, POST /integrity/sanctions/{id}/impose, POST /integrity/sanctions/{id}/complete"
    shared_operations:
      - "POST /integrity/case-meetings and POST /integrity/case-meetings/{id}/outcome (shared with FacultyReporter; only the CANCELLED outcome is officer-only in practice because HELD and NO_SHOW require instructor ownership)"
      - "POST /integrity/faculty-members/{id}/training-completions (shared with FacultyReporter)"
      - "every GET except /integrity/students/{id} student self-reads"
    forbidden:
      - "POST /integrity/reports, POST /integrity/evidence-items, POST /integrity/cases/{id}/informal-resolution -> ERR_ROLE_NOT_PERMITTED"
      - "POST /integrity/hearing-sessions/{id}/convene, /adjourn, /decide and POST /integrity/panel-votes -> ERR_ROLE_NOT_PERMITTED"
      - "POST /integrity/appeals, /integrity/appeals/{id}/screen, /integrity/appeals/{id}/decide -> ERR_ROLE_NOT_PERMITTED"
      - "POST /integrity/cases/{id}/notation/post and both expungement endpoints -> ERR_ROLE_NOT_PERMITTED"
  - name: FacultyReporter
    backing: "entity_backed: FacultyMember"
    header_note: "X-User-ID must resolve to a FacultyMember row, else ERR_UNAUTHENTICATED"
    exclusive_operations:
      - "POST /integrity/reports"
      - "POST /integrity/evidence-items"
      - "POST /integrity/reports/{id}/submit"
      - "POST /integrity/cases/{id}/informal-resolution"
    shared_operations:
      - "POST /integrity/case-meetings and POST /integrity/case-meetings/{id}/outcome (shared with IntegrityOfficer)"
      - "POST /integrity/faculty-members/{id}/training-completions (shared with IntegrityOfficer)"
      - "GET /integrity/reports, GET /integrity/cases/{id}, GET /integrity/cases/{id}/severity-assessment"
    ownership_rules:
      - "submit, evidence attachment and informal-resolution require the acting id to equal the report's reporter_id, else ERR_NOT_RESOURCE_OWNER"
      - "recording a HELD or NO_SHOW meeting outcome requires the acting id to equal the meeting's instructor_id"
    forbidden:
      - "POST /integrity/cases, /integrity/reports/{id}/triage, /integrity/sanctions -> ERR_ROLE_NOT_PERMITTED"
      - "POST /integrity/hearing-sessions and every panel or appeal endpoint -> ERR_ROLE_NOT_PERMITTED"
  - name: PanelChair
    backing: "entity_backed: FacultyMember"
    header_note: "X-User-ID must resolve to a FacultyMember row, else ERR_UNAUTHENTICATED"
    exclusive_operations:
      - "POST /integrity/hearing-sessions/{id}/convene"
      - "POST /integrity/hearing-sessions/{id}/adjourn"
      - "POST /integrity/hearing-sessions/{id}/decide"
      - "POST /integrity/panel-votes"
    shared_operations:
      - "GET /integrity/hearing-sessions, GET /integrity/panel-votes, GET /integrity/cases/{id}, GET /integrity/cases/{id}/advisor-engagements, GET /integrity/hearing-rooms"
    ownership_rules:
      - "every session action requires the acting id to equal session.chair_id, else ERR_NOT_RESOURCE_OWNER"
    segregation_of_duties:
      - "a FacultyMember who is the reporter of the case, or the instructor of its offering, may never be the chair or a panelist -> ERR_PANEL_CONFLICT_OF_INTEREST"
    forbidden:
      - "POST /integrity/reports, /integrity/sanctions, /integrity/appeals/{id}/decide -> ERR_ROLE_NOT_PERMITTED"
  - name: Student
    backing: "entity_backed: Student"
    header_note: "X-User-ID must resolve to a Student row, else ERR_UNAUTHENTICATED"
    exclusive_operations:
      - "POST /integrity/cases/{id}/informal-response"
      - "POST /integrity/notifications/{id}/acknowledge"
      - "POST /integrity/advisor-engagements"
      - "POST /integrity/cases/{id}/notation/expungement-request"
      - "POST /integrity/appeals"
    shared_operations:
      - "GET /integrity/cases/{id}, GET /integrity/cases/{id}/notifications, GET /integrity/cases/{id}/appeals, GET /integrity/cases/{id}/advisor-engagements, GET /integrity/sanctions, GET /integrity/students/{id}"
    ownership_rules:
      - "every student write requires the acting id to equal case.student_id (or the notification's case student), else ERR_NOT_RESOURCE_OWNER"
    forbidden:
      - "every office, panel, dean and registrar write -> ERR_ROLE_NOT_PERMITTED"
      - "GET /integrity/cases (the unscoped case list) and GET /integrity/departments -> ERR_ROLE_NOT_PERMITTED"
  - name: AppealsDean
    backing: opaque
    header_note: "X-User-ID is an opaque dean identifier that need not resolve to any entity"
    exclusive_operations:
      - "POST /integrity/appeals/{id}/screen"
      - "POST /integrity/appeals/{id}/decide"
    shared_operations:
      - "GET /integrity/cases, GET /integrity/cases/{id}, GET /integrity/cases/{id}/appeals, GET /integrity/hearing-sessions, GET /integrity/panel-votes, GET /integrity/evidence-items, GET /integrity/sanctions"
    segregation_of_duties:
      - "the dean cannot create, impose or complete a sanction, so a reduced sanction can only ever be produced as a side effect of the SANCTION_REDUCED outcome"
    forbidden:
      - "POST /integrity/sanctions and /integrity/sanctions/{id}/impose -> ERR_ROLE_NOT_PERMITTED"
      - "POST /integrity/hearing-sessions/{id}/decide -> ERR_ROLE_NOT_PERMITTED"
  - name: RegistrarOfficer
    backing: opaque
    header_note: "X-User-ID is an opaque registrar identifier that need not resolve to any entity"
    exclusive_operations:
      - "POST /integrity/cases/{id}/notation/post"
      - "POST /integrity/cases/{id}/notation/expungement-decision"
    shared_operations:
      - "GET /integrity/cases, GET /integrity/cases/{id}, GET /integrity/students, GET /integrity/students/{id}, GET /integrity/sanctions, GET /integrity/departments, GET /integrity/departments/{id}/reporting-metrics"
    segregation_of_duties:
      - "the registrar owns the notation dimension exclusively and can touch nothing on the adjudication dimension, so posting a notation can never advance or close a case"
    forbidden:
      - "every adjudication write, including POST /integrity/cases/{id}/dismiss -> ERR_ROLE_NOT_PERMITTED"

