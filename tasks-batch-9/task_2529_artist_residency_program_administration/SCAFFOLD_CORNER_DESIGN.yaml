  # ===================================================================================
  # From Table 4 (Validations)
  # ===================================================================================
  - section: validations
    instances:

      - name: first_submission_window_is_inclusive_and_shuts_the_next_day
        claim_type: temporal
        grounds: ["validations[priority 42]", "errors[ERR_SUBMISSION_WINDOW_CLOSED]", "entities.Cycle.close_at", "endpoints[POST /applications/{id}/submit]"]
        distinguishing_aspect: "P42 compares date(logical clock now) against an INCLUSIVE window and applies to a FIRST submission only. Two calls one logical day apart therefore straddle the boundary, and the same rule must NOT fire on a REVISION_REQUESTED resubmission - screening happens after close_at by design, so re-checking the window there would deadlock every revision."
        test_recipe:
          setup: ["An OPEN cycle with open_at 2026-08-01 and close_at 2026-09-30, one applicant, and one DRAFT application that is otherwise fully submittable: fee WAIVED and one IMAGE portfolio item against a discipline requiring 1..6 items including IMAGE."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art}"
              captures: { app: "$.data.id" }
            - call: "POST /applications/${app}/fee-resolution"
              payload: { action: "WAIVE", reason: "income below ceiling" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /portfolio-items"
              payload: { application_id: "${app}", media_type: "IMAGE", title: "Plate I", file_size_mb: 12.5 }
              as: Applicant
              as_user_id: "${art}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:01Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /applications/${app}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${art}"
              captures: { err: "$.data.error_id" }
          assert:
            - "one logical day past close_at the submission is refused: 422 ERR_SUBMISSION_WINDOW_CLOSED, with status still 'DRAFT' and Application.version unchanged"
            - "the window is closed by the CLOCK, not by the cycle: GET /cycles/${cyc} still reads status 'OPEN', so P17 was satisfied and P42 is what fired"
            - "the upper bound is inclusive to the whole day: rewinding the clock to '2026-09-30T23:59:59Z' and repeating the submit returns 200 with status 'SUBMITTED', because date(now) 2026-09-30 is inside [2026-08-01, 2026-09-30]"
            - "the lower bound is inclusive too: at exactly '2026-08-01T00:00:00Z' (the startup default) the same submission succeeds, while at '2026-07-31T23:59:59Z' it returns 422 ERR_SUBMISSION_WINDOW_CLOSED"
            - "the rule is scoped to a FIRST submission: after the cycle is staged to SCREENING and a REQUEST_REVISION decision sends the application back, a resubmission at clock '2026-10-15T00:00:00Z' returns 200 with status 'SUBMITTED' - well past close_at and deliberately not window-checked"
            - "the temporal check sits below the stage and shape checks: with the clock past close_at AND the cycle still DRAFT, the error is 409 ERR_CYCLE_NOT_OPEN (P17), not the P42 window error"

      - name: multi_bed_housing_capacity_is_an_aggregate_over_shared_nights
        claim_type: aggregate
        grounds: ["validations[priority 69]", "errors[ERR_HOUSING_CAPACITY_EXCEEDED]", "calculations.housing_occupancy", "entities.HousingUnit.bed_count"]
