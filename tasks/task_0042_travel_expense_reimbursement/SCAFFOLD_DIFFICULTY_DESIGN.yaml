              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-05", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Lodging Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "LODGING", claimed_amount_cents: 30000, check_in_date: "2026-06-01", check_out_date: "2026-06-03" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line1: $.data.id }
          trigger:
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "LODGING", claimed_amount_cents: 20000, check_in_date: "2026-06-03", check_out_date: "2026-06-05" }
              as: Traveler
