        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: |
          Authentication is checked before anything else: with no X-User-Role or X-User-ID header the read
          fails 401 ERR_UNAUTHENTICATED even though the application id is perfectly valid and every role in the
          system may read it.
        test_recipe:
          setup:
            - "Full catalog, the Aurora Health account and a DRAFT application, all created by an authenticated Underwriter."
            - "The trigger request carries neither X-User-Role nor X-User-ID."
          setup_api_calls:
            - call: "POST /cyber/_clock/set_current_utc"
