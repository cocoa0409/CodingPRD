  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: simulation_verdict_inclusive_thresholds
        claim_type: constants_applied
        grounds: [calculations.simulation_verdict]
        distinguishing_aspect: "all three thresholds are inclusive-pass: separation exactly == min, draw exactly 80, speed exactly 12.0 all PASS; 2.99 / 81 / 12.5 each FAIL independently."
        test_recipe:
          setup: ["Site A; Show S; design D1 (min_separation 3.0)"]
          setup_api_calls:
            - { call: "POST /api/sites", payload: { name: "Site A", latitude: 34.0, longitude: -118.0, ground_length_m: 1000, ground_width_m: 800, site_max_wind_kt: 20, site_max_gust_kt: 25, site_max_altitude_ft: 500 }, as: ProductionPlanner, captures: { site_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S", window_start: "2026-08-10T19:00:00Z", window_end: "2026-08-10T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { show_id: $.data.id } }
            - { call: "POST /api/show-designs", payload: { show_event_id: "${show_id}", drone_count: 10, max_altitude_ft: 300, duration_sec: 600, min_separation_m: 3.0 }, as: ProductionPlanner, captures: { design_id: $.data.id } }
          trigger:
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.0, battery_draw_pct: 80, max_speed_mps: 12.0 }, as: ProductionPlanner, captures: { v_edge: $.data.verdict } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 2.99, battery_draw_pct: 50, max_speed_mps: 9.0 }, as: ProductionPlanner, captures: { v_sep: $.data.verdict } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 81, max_speed_mps: 9.0 }, as: ProductionPlanner, captures: { v_draw: $.data.verdict } }
            - { call: "POST /api/simulation-runs", payload: { show_design_id: "${design_id}", min_separation_observed_m: 3.5, battery_draw_pct: 50, max_speed_mps: 12.5 }, as: ProductionPlanner, captures: { v_speed: $.data.verdict } }
          assert:
            - "${v_edge} == PASS (3.0 >= 3.0, 80 <= 80, 12.0 <= 12.0 — all inclusive)"
            - "${v_sep} == FAIL (2.99 < 3.0)"
            - "${v_draw} == FAIL (81 > 80)"
            - "${v_speed} == FAIL (12.5 > 12.0)"

      - name: evaluation_uses_latest_reading_in_lookback
        claim_type: input_set_filtering
        grounds: [calculations.go_no_go_verdict]
        distinguishing_aspect: "only the LATEST reading (recorded_at DESC) inside the 60-minute lookback decides: an over-limit 18:20 reading followed by a calm 18:35 reading yields GO; a later 18:40 gusty reading flips it back to NO_GO."
        test_recipe:
          setup: ["Site A; Show S AUTHORIZED (design 300ft/10 -> limit 16.2); clock 2026-08-10T18:45:00Z"]
          setup_api_calls:
