      - name: portfolio_risk_defaults_to_trailing_settled_while_the_persisted_index_never_marks_to_market
        claim_type: Variant Selection
        grounds:
          - "calculations.market_performance_index.variants"
          - "calculations.market_performance_index.input_set"
          - "entities.Market.fields.performance_index"
          - "endpoints[GET /markets/{market_id}/portfolio-risk]"
        distinguishing_aspect: "Variant SELECTION rather than variant arithmetic: on a market with one live show and zero settled shows, the default read and the explicit TRAILING_SETTLED read must both be 0 while MARK_TO_MARKET is 40 — so the default is pinned to the backward-looking variant, not to 'whatever the caller last asked for'. The persisted Market.performance_index stays 0 as well, proving the mark-to-market figure is a read-time projection that is never written. A second CONFIRMED show in the same market must appear in NEITHER variant: including it in the mark-to-market denominator would report 20."
