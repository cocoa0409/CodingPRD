              as: TourPlanner
              captures: { w1_id: $.data.id, w1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${w1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${w1_id}/lock"
              payload: { expected_event_version: "${w1_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${w1_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "W2", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-06", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { w2_id: $.data.id, w2_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${w2_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${w2_id}/lock"
              payload: { expected_event_version: "${w2_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${w2_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "Q3F1", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-07", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { qf1_id: $.data.id, qf1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${qf1_id}", talent_id: "${t_id}", segment_label: "MATCH_1" }
              as: TourPlanner
            - call: "POST /touring/events/${qf1_id}/lock"
              payload: { expected_event_version: "${qf1_v}" }
              as: TourPlanner
            - call: "POST /touring/events/${qf1_id}/complete"
              payload: {}
              as: TourPlanner
            - call: "POST /touring/events"
              payload: { name: "PE1", event_type: "PREMIUM", arena_id: "${ar_id}", event_date: "2026-09-20", start_time: "20:00", end_time: "23:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { pe1_id: $.data.id, pe1_v: $.data.version }
            - call: "POST /touring/bookings"
              payload: { event_id: "${pe1_id}", talent_id: "${t_id}", segment_label: "MAIN_EVENT" }
              as: TourPlanner
            - call: "POST /touring/events/${pe1_id}/lock"
              payload: { expected_event_version: "${pe1_v}" }
              as: TourPlanner
