            - "${ovg_state} == ACTIVE_CUTIN with the flag set, and the spot is PREEMPTED"
            - "${ordg_credit} == 100000 == the FULL per-spot rate (1 ordered spot at 100000): a forced preemption of a GUARANTEED spot accrues full credit, and SpotOrder.status becomes PARTIALLY_CREDITED with credited_spots 1"
            - "${e_plmismatch} == ERR_ITEM_PLAYLIST_MISMATCH (409): the target playlist belongs to channel 12.2 while the order belongs to 12.1 — the makegood deadline, the credited-spot count and the sequence number are all valid, isolating rule 60"
            - "rule 59 (ERR_SPOT_ORDER_CHANNEL_MISMATCH) is the mirror image and fires on POST /playlists/{id}/traffic-revisions when a submitted item names an order from another channel"
