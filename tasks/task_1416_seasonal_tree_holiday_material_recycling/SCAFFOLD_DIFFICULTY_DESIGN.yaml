          CurbsideBooking): the UPHELD branch fires a strike + booking rejection and the
          appeal sub-branch OVERTURNED compensates them (strike revoked, booking restored),
          while the DISMISSED branch fires nothing. Two tickets on two bookings of one
          household demonstrate the divergent side-effect sets.
