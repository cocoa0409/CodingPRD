              payload: { model_id: "${model}", code: "CD-2026-01", severity: "ADVISORY", remediation_window_days: 90 }
              as: ComplianceOfficer
              captures: { camp: $.data.id }
            - call: "POST /recall-campaigns/${camp}/open"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /recall-remediations"
              payload: { unit_id: "${unit}" }
              as: ServiceManager
              captures: { rem: "$.data[0].id" }
            - call: "POST /units/${unit}/decommission"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /recall-remediations/${rem}/schedule"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Unit.${unit}.operating_status == DECOMMISSIONED"
            - "schedule returns 409 with error_id == ERR_INVALID_STATE (gated by the linked Unit's operating_status)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_buffer_overlap_half_open_4h
        grounds:
          - validations[priority=17]
          - errors[ERR_TECH_DOUBLE_BOOKED]
          - entities.MaintenanceVisit.fields.assigned_tech_id
          - entities.MaintenanceVisit.fields.scheduled_for
        distinguishing_aspect: "Technician resource uses a BUFFERED half-open interval: a new visit assigned to a tech within 4h of an existing SCHEDULED visit collides; the two visits are on DIFFERENT units so the Unit same-day rule does not fire. Interval semantics = +/-4h buffer."
        test_recipe:
          setup:
            - "Two ACTIVATED units (unit A, unit B) each with an ACTIVE plan; one SCHEDULED visit on unit A's plan at 2026-04-10T09:00:00Z assigned to tech T."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "to1@x.com", full_name: "TO One", service_address: "15 O St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech T", license_no: "LICTO1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "TOSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { projA: $.data.id }
            - call: "POST /projects/${projA}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { asmtA: $.data.id }
            - call: "POST /projects/${projA}/size"
              payload: { assessment_id: "${asmtA}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${projA}/permit"
              payload: { permit_number: "PTOA", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${projA}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${projA}/activate"
              payload: { serial_no: "SNTOA" }
              as: ServiceManager
              captures: { unitA: $.data.unit_id }
            - call: "POST /units/${unitA}/maintenance-plans"
              payload: { frequency: "ANNUAL" }
              as: ServiceManager
              captures: { planA: $.data.id }
            - call: "POST /maintenance-plans/${planA}/visits"
              payload: { scheduled_for: "2026-04-10T09:00:00Z", assigned_tech_id: "${tech}" }
              as: ServiceManager
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { projB: $.data.id }
            - call: "POST /projects/${projB}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { asmtB: $.data.id }
            - call: "POST /projects/${projB}/size"
              payload: { assessment_id: "${asmtB}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${projB}/permit"
              payload: { permit_number: "PTOB", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${projB}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${projB}/activate"
              payload: { serial_no: "SNTOB" }
              as: ServiceManager
              captures: { unitB: $.data.unit_id }
            - call: "POST /units/${unitB}/maintenance-plans"
              payload: { frequency: "ANNUAL" }
              as: ServiceManager
              captures: { planB: $.data.id }
          trigger:
            - call: "POST /maintenance-plans/${planB}/visits"
              payload: { scheduled_for: "2026-04-10T11:00:00Z", assigned_tech_id: "${tech}" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Scheduling tech T at 2026-04-10T11:00:00Z (2h after the 09:00 visit on a different unit) returns 409 with error_id == ERR_TECH_DOUBLE_BOOKED"

      - name: unit_same_day_collision_closed_daybucket
        grounds:
          - validations[priority=18]
          - errors[ERR_UNIT_VISIT_COLLISION]
          - entities.MaintenanceVisit.fields.scheduled_for
          - entities.MaintenanceVisit.fields.unit_id
        distinguishing_aspect: "Unit resource uses a CLOSED day-bucket interval: a second visit on the SAME unit anywhere on the same UTC calendar day collides even when 11h apart and with NO tech assigned (so the tech-buffer rule cannot fire). Interval semantics = whole-day bucket, distinct from the 4h buffer."
        test_recipe:
          setup:
            - "An ACTIVATED unit with an ACTIVE plan and one SCHEDULED visit at 2026-04-12T09:00:00Z (no tech assigned)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "uc1@x.com", full_name: "UC One", service_address: "16 P St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech U", license_no: "LICUC1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "UCSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PUC1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNUC1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/maintenance-plans"
              payload: { frequency: "SEMI_ANNUAL" }
              as: ServiceManager
              captures: { plan: $.data.id }
            - call: "POST /maintenance-plans/${plan}/visits"
              payload: { scheduled_for: "2026-04-12T09:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /maintenance-plans/${plan}/visits"
              payload: { scheduled_for: "2026-04-12T20:00:00Z" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Scheduling a second visit on the same unit at 2026-04-12T20:00:00Z (same UTC day, 11h later, no tech) returns 409 with error_id == ERR_UNIT_VISIT_COLLISION"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tech_load_count_conserved_assign_then_cancel
        grounds:
          - state_machines.RepairDispatch.REQUESTED_to_DISPATCHED
          - state_machines.RepairDispatch.DISPATCHED_to_CANCELLED
          - entities.Technician.fields.open_dispatch_count
        distinguishing_aspect: "Conserved quantity (counter): Technician.open_dispatch_count. assign (+1) followed by its compensating cancel (-1) returns open_dispatch_count to its pre-assign value (0); global invariant sum(open_dispatch_count) == |{dispatches in DISPATCHED or IN_PROGRESS}| holds before and after."
        test_recipe:
          setup:
            - "An ACTIVATED unit, a fresh technician (open_dispatch_count 0), and a REQUESTED PAID dispatch."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci1@x.com", full_name: "CI One", service_address: "17 Q St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech I", license_no: "LICCI1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "CISKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PCI1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNCI1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/repair-dispatches"
              payload: { labor_cents: 5000 }
              as: ServiceManager
              captures: { disp: $.data.id, disp_v0: $.data.version }
            - call: "POST /repair-dispatches/${disp}/assign"
              payload: { assigned_tech_id: "${tech}", expected_dispatch_version: "${disp_v0}" }
              as: ServiceManager
          trigger:
            - call: "POST /repair-dispatches/${disp}/cancel"
              payload: {}
              as: ServiceManager
          assert:
            - "After assign-then-cancel, Technician.${tech}.open_dispatch_count == 0 (back to pre-assign value)"
            - "RepairDispatch.${disp}.status == CANCELLED"

      - name: plan_price_conserved_suspend_then_resume
        grounds:
          - state_machines.MaintenancePlan.ACTIVE_to_SUSPENDED
          - state_machines.MaintenancePlan.SUSPENDED_to_ACTIVE
          - entities.MaintenancePlan.fields.annual_price_cents
        distinguishing_aspect: "Conserved quantity (money): MaintenancePlan.annual_price_cents. suspend followed by its compensating resume leaves annual_price_cents unchanged (no re-pricing drift) — a different conserved-quantity TYPE (priced cents) than the open_dispatch_count counter."
        test_recipe:
          setup:
            - "An ACTIVATED 26kW unit with an ACTIVE SEMI_ANNUAL monitoring-bundled plan priced at 66600."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cp1@x.com", full_name: "CP One", service_address: "18 R St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech Y", license_no: "LICCP1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "CPSKU1", rated_kw: 26, fuel_types: ["NG"], unit_price_cents: 900000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 4000, starting_watts: 12000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PCP1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNCP1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/maintenance-plans"
              payload: { frequency: "SEMI_ANNUAL", monitoring_bundled: true }
              as: ServiceManager
              captures: { plan: $.data.id }
            - call: "POST /maintenance-plans/${plan}/suspend"
              payload: {}
              as: ServiceManager
          trigger:
            - call: "POST /maintenance-plans/${plan}/resume"
              payload: {}
              as: ServiceManager
              captures: { price: $.data.annual_price_cents }
          assert:
            - "After suspend-then-resume, MaintenancePlan.${plan}.status == ACTIVE"
            - "MaintenancePlan.${plan}.annual_price_cents == 66600 (unchanged across the suspend/resume cycle)"
