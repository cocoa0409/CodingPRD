      - name: counter_stale_version_returns_412
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STALE_VERSION]", "concurrency_rules[loi-counter-stale-version]"]
        distinguishing_aspect: "OCC: after the TenantRep's submit advanced LOI.version from 1 to 2, a counter carrying the stale expected_loi_version 1 is rejected 412 ERR_STALE_VERSION (sequential requests, no wall-clock dependence)."
        test_recipe:
          setup: ["LOI_A created (version 1) then submitted (version 2) on toured SITE_A"]
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
