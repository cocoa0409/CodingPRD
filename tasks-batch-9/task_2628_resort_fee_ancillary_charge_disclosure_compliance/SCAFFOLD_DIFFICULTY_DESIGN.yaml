  - rule_id: resource_temporal_overlap
    instances:

      - name: fee_program_half_open_effective_interval_allows_exact_adjacency
        grounds:
          - validations[priority=27]
          - entities.FeeProgram.effective_from
          - entities.FeeProgram.effective_to
          - state_machines.FeeProgram.UNDER_REVIEW_to_PUBLISHED
        distinguishing_aspect: |
          INTERVAL SEMANTICS: HALF-OPEN [effective_from, effective_to), and the
          contended RESOURCE is the Property (its publication calendar). The
          collision predicate is strict on both sides, so two programs that touch
          at a single instant are LEGAL — the earlier program's exclusive end may
          equal the later program's inclusive start with no gap and no error.
          One second of genuine overlap is rejected. This is the exact opposite
          adjacency verdict from the ChannelDisclosureProfile instance below,
          which contends over a Channel with a CLOSED buffered window.
        test_recipe:
          setup:
            - "One ACTIVE property with no disclosure profiles at all, so disclosure_posture is COMPLIANT (null min score) and priority 17 cannot mask the temporal check"
            - "fp1 is PUBLISHED for the half-open interval [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z)"
            - "fp2 is authored for [2026-11-30T23:59:59Z, 2027-03-01T00:00:00Z) — one second of overlap with fp1 — and driven to UNDER_REVIEW"
            - "fp3 is authored for [2026-12-01T00:00:00Z, 2027-03-01T00:00:00Z) — exactly touching fp1's exclusive end — and also driven to UNDER_REVIEW"
            - "The clock stays at 2026-08-01T00:00:00Z so every effective_from is in the future and priority 29 stays satisfied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
