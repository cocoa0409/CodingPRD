          - "state_machines.Payout.FAILED_to_SCHEDULED"
        distinguishing_aspect: "After 3 consumed retries the 4th RETRY -> ERR_RETRY_LIMIT_REACHED; the cap is a state-level check that fires before any fiscal gate."
        test_recipe:
          setup: ["W9-verified channel; TIP 100000@0bps cleared; payout opened and failed+retried three times (retry_count == 3, currently FAILED)"]
