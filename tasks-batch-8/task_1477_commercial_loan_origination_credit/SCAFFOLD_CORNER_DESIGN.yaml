        grounds: ["validations[priority=18]", "errors[ERR_APPRAISER_NOT_ELIGIBLE]", entities.Appraiser.fields.status]
        distinguishing_aspect: "Suspending the appraiser (ELIGIBLE -> SUSPENDED via PATCH) blocks the very next engagement order with ERR_APPRAISER_NOT_ELIGIBLE; reinstating ELIGIBLE unblocks it."
        test_recipe:
          setup: ["Clean 20,000,000 application in APPRAISAL_REVIEW; appraiser registered then SUSPENDED"]
          setup_api_calls:
