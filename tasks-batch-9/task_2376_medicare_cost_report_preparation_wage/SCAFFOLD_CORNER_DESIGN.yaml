            - "WageIndexSubmission.${wis_id}.unadjusted_ahw_cents == 2500"
            - "WageIndexSubmission.${wis_id}.effective_ahw_cents == 2500"

      - name: final_settlement_subtracts_the_prior_tentative_payment
        claim_type: chronological
        grounds:
          - calculations.settlement_amount
          - entities.Settlement.fields.prior_tentative_paid_cents
          - entities.Settlement.fields.amount_due_provider_cents
          - entities.CostReport.fields.allowable_cost_per_discharge_cents
          - state_machines.CostReport.TENTATIVE_SETTLED_to_FINAL_SETTLED
        distinguishing_aspect: "The FINAL settlement of the same report pays (120000000 - 20000000) + 7300000 - 75000000 == 32300000, i.e. it subtracts the earlier TENTATIVE settlement's 75000000 instead of being 4/3 of it."
        test_recipe:
