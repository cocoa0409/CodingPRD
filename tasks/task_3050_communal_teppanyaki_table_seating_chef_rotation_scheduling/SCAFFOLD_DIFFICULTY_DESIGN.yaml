              payload: { event_type: "SUBMIT" }
              as: Host
            - call: "POST /service-floor/reservations/${res_k}/holds"
              payload: { expected_table_version: "${t3_v}", table_id: "${table3_id}" }
              as: Host
            - call: "POST /service-floor/reservations/${res_k}/seat"
              payload: {}
              as: Host
