  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: writer_capacity_equality_admitted_then_strict_excess_rejected
        grounds:
          - validations[priority=61]
          - calculations.writer_capacity_load_points
          - calculations.writer_committed_load_points
          - entities.Writer.fields.capacity_points
        distinguishing_aspect: |
          An INCLUSIVE-CEILING boundary on a fiscal comparison: committed load exactly equal to
          capacity_points (26.00 against 26) is admitted, and only a strict excess is rejected.
          The second assignment is deliberately placed at window_start 2026-08-16 — exactly the
          2-day handoff gap after the first window's end — so the priority-52 overlap rule does
          NOT fire and the capacity rule is reached in isolation, isolating the '<=' boundary
          from the scheduling rule.
        test_recipe:
          setup:
            - "One release train ATLAS 22.0, one SENIOR writer with capacity_points 26."
            - "Plan item A: STANDARD, 6 pages, complexity 10, NEW_TOPIC -> load_points exactly 26.00, assigned 2026-08-03..2026-08-14 and ACCEPTED at exact equality (committed_load_points 26.00 == capacity_points 26)."
            - "Plan item B: INTERNAL, 2 pages, complexity 4, EXISTING_TOPIC_UPDATE -> (4 + 4 + 1) * 0.75 / 1.0 = 6.75 load points for this SENIOR writer."
            - "B is requested for 2026-08-16..2026-08-26, a gap of exactly HANDOFF_BUFFER_DAYS (2) after A's window end, so no overlap is reported."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "22.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 26 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-billing", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_a: $.data.id }
            - call: "POST /plan-items/${pi_a}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
              captures: { load_a: $.data.load_points }
            - call: "GET /writers/${w1_id}"
              payload: {}
              as: DocsLead
              captures: { committed_after_a: $.data.committed_load_points }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-internal-notes", ia_placement: "EXISTING_TOPIC_UPDATE", audience_tier: "INTERNAL", planned_page_count: 2, complexity_points: 4 }
              as: DocsLead
              captures: { pi_b: $.data.id }
          trigger:
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-16", window_end_date: "2026-08-26" }
              as: DocsLead
              captures: { err: "$.data.error_id" }
          assert:
            - "${load_a} == 26.00 and ${committed_after_a} == 26.00 — the equality case was ADMITTED, not rejected"
            - "${err} == ERR_WRITER_CAPACITY_EXCEEDED with HTTP 409 (26.00 + 6.75 = 32.75 > 26 is a strict excess)"
            - "the response is NOT ERR_WRITER_WINDOW_OVERLAP — a gap of exactly 2 days clears the handoff buffer"
            - "DocPlanItem.${pi_b}.status is still DRAFTED with load_points null and assigned_writer_id null"
            - "Writer.${w1_id}.committed_load_points == 26.00 and assignment_count == 1"

      - name: release_note_empty_candidate_set_rejected
        grounds:
          - validations[priority=57]
          - errors.ERR_NO_PUBLISHABLE_CHANGES
          - state_machines.ChangeRecord.SUBMITTED_to_EXCLUDED
          - concurrency_rules[release-note-compile-stale-doc-set]
        distinguishing_aspect: |
          An EMPTY-SET boundary rather than a numeric one, and on the release-note axis: the
          train has two change records but ZERO in EDITORIALLY_APPROVED (one still SUBMITTED,
          one EXCLUDED), which is the count == 0 edge of the compilation candidate set. The
          contract rejects instead of emitting a note with an empty body and a zero impact
          score, so the boundary is observable as an error rather than as a 0.00 score.
        test_recipe:
          setup:
