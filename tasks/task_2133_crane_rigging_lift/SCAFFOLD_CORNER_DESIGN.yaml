        distinguishing_aspect: "effective_wll_lb walks 30000 -> 28500 -> 27000 for repair_count 0/1/2 and stops at 21000 from repair_count 6 onward, because max(1 - 0.05*n, 0.70) clamps at the floor and a 7th repair changes nothing."
        test_recipe:
          setup: ["A SERVICEABLE sling rated 30000 lb after its acceptance inspection."]
          setup_api_calls:
