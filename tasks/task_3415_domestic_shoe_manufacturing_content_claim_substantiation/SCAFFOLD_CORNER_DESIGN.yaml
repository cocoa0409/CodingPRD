        distinguishing_aspect: "One open enrollment per (worker, operation): a second STITCHING enrollment while the first is ENROLLED returns 409 ERR_ENROLLMENT_ALREADY_OPEN; after the first reaches a terminal state a new enrollment for the same operation is accepted."
