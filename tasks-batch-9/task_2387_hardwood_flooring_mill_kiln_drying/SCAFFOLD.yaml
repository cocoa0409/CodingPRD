      - "Recompute estimated_liability_cents and clear info_request_note."
  - method: POST
    path: /mill/warranty-claims/{warranty_claim_id}/adjudicate
    description: "Adjudicate a claim on inspector-verified figures, charging the reserve on approval."
    roles: [WarrantyAdjudicator]
    input: [decision, adjudicated_affected_sf, adjudicated_subfloor_moisture_pct, adjudicated_ambient_rh_pct, "denial_reason?"]
    output: WarrantyClaim
    code: 200
    side_effects:
      - "Compute the responsibility split, depreciation and adjudicated_liability_cents."
      - "On approval debit the reserve, recompute posture and hold SCHEDULED prefinish runs on the line."
  - method: POST
    path: /mill/warranty-claims/{warranty_claim_id}/reverse
    description: "Reverse an approved claim and return its charge to the reserve."
    roles: [WarrantyAdjudicator, MillAdmin]
    input: [reversal_reason]
    output: WarrantyClaim
    code: 200
    side_effects:
      - "Credit the reserve, recompute posture and cancel any open remediation."
  - method: POST
    path: /mill/warranty-claims/{warranty_claim_id}/start_remediation
    description: "Start remediation work on an approved claim."
    roles: [WarrantyAdjudicator, MillSupervisor]
    input: []
    output: WarrantyClaim
    code: 200
  - method: POST
    path: /mill/warranty-claims/{warranty_claim_id}/complete_remediation
    description: "Complete remediation work on an approved claim."
    roles: [WarrantyAdjudicator, MillSupervisor]
    input: []
    output: WarrantyClaim
    code: 200

errors:
  - { error_id: ERR_UNAUTHENTICATED, status: 401, message: "Authentication required.", trigger: "Missing X-Role header." }
  - { error_id: ERR_FORBIDDEN_ROLE, status: 403, message: "Role not permitted for this operation.", trigger: "Role outside the endpoint role list." }
  - { error_id: ERR_INVALID_REQUEST, status: 400, message: "Request payload failed schema validation.", trigger: "Missing required field, wrong type, unknown enum value or out-of-range pagination." }
  - { error_id: ERR_CONFIG_NOT_FOUND, status: 404, message: "Referenced configuration record was not found.", trigger: "Unknown species profile, drying schedule, kiln chamber, product line, core stock or prefinish line." }
  - { error_id: ERR_RECEIPT_NOT_FOUND, status: 404, message: "Green receipt was not found.", trigger: "Unknown green_receipt_id." }
  - { error_id: ERR_CHARGE_NOT_FOUND, status: 404, message: "Kiln charge was not found.", trigger: "Unknown kiln_charge_id." }
  - { error_id: ERR_LOT_NOT_FOUND, status: 404, message: "Flooring lot was not found.", trigger: "Unknown flooring_lot_id." }
  - { error_id: ERR_GRADE_RUN_NOT_FOUND, status: 404, message: "Grade run was not found.", trigger: "Unknown grade_run_id or replacement_grade_run_id." }
  - { error_id: ERR_PREFINISH_RUN_NOT_FOUND, status: 404, message: "Prefinish run was not found.", trigger: "Unknown prefinish_run_id." }
  - { error_id: ERR_BATCH_NOT_FOUND, status: 404, message: "Byproduct batch was not found.", trigger: "Unknown byproduct_batch_id." }
  - { error_id: ERR_CLAIM_NOT_FOUND, status: 404, message: "Warranty claim was not found.", trigger: "Unknown warranty_claim_id." }
  - { error_id: ERR_STALE_SPECIES_PROFILE_VERSION, status: 412, message: "Species profile version is stale.", trigger: "expected_species_profile_version does not match the stored version." }
  - { error_id: ERR_STALE_LOT_VERSION, status: 412, message: "Flooring lot version is stale.", trigger: "expected_lot_version does not match the stored version." }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status: 403, message: "The submitter of a claim may not adjudicate it.", trigger: "Adjudicating X-User-ID equals submitted_by_user_id." }
  - { error_id: ERR_RECEIPT_STATE_INVALID, status: 409, message: "Green receipt is not in a state allowing this operation.", trigger: "Accepting an accepted receipt, allocating a RECEIVED or CONSUMED receipt, deallocating an unallocated receipt." }
  - { error_id: ERR_CHARGE_STATE_INVALID, status: 409, message: "Kiln charge is not in a state allowing this operation.", trigger: "Loading a DISPLACED charge, stress testing outside CONDITIONING, drawing a lot from a non-RELEASED charge, rescheduling a SCHEDULED charge." }
  - { error_id: ERR_CHAMBER_STATE_INVALID, status: 409, message: "Kiln chamber is not in a state allowing this operation.", trigger: "Loading into an OCCUPIED or MAINTENANCE chamber, starting maintenance on an occupied chamber." }
  - { error_id: ERR_LOT_STATE_INVALID, status: 409, message: "Flooring lot is not in a state allowing this operation.", trigger: "Milling a MILLED lot, finalizing a PLANNED lot, grading a non-MILLED lot, voiding a terminal lot." }
  - { error_id: ERR_GRADE_RUN_STATE_INVALID, status: 409, message: "Grade run is not in a state allowing this operation.", trigger: "Adding bundles to a FINALIZED run, finalizing twice, superseding a DRAFT run, finalizing a lot against a DRAFT or SUPERSEDED run." }
  - { error_id: ERR_PREFINISH_RUN_STATE_INVALID, status: 409, message: "Prefinish run is not in a state allowing this operation.", trigger: "Starting a HELD run, releasing a SCHEDULED run, completing a non-RUNNING run." }
  - { error_id: ERR_CLAIM_STATE_INVALID, status: 409, message: "Warranty claim is not in a state allowing this operation.", trigger: "Adjudicating an INFO_REQUESTED or already adjudicated claim, reversing a non-APPROVED claim, remediating an unapproved claim." }
  - { error_id: ERR_PRODUCT_LINE_POSTURE_BLOCKED, status: 409, message: "Product line posture blocks prefinishing.", trigger: "Scheduling, starting or releasing a run on a RESTRICTED or FROZEN line." }
  - { error_id: ERR_REDRY_LIMIT_EXCEEDED, status: 409, message: "Charge has exhausted its redry allowance.", trigger: "A failing stress test when redry_count is already 2." }
  - { error_id: ERR_LOT_NOT_GRADED, status: 409, message: "Only a graded lot may be prefinished.", trigger: "Scheduling a prefinish run for a PLANNED, MILLED, QUARANTINED or VOIDED lot." }
  - { error_id: ERR_MC_PLAN_DEVIATION, status: 422, message: "Charge green moisture deviates from the schedule design.", trigger: "Loading when the weighted green moisture is more than 3.0 points from the schedule design moisture." }
  - { error_id: ERR_PROFILE_TOLERANCE_EXCEEDED, status: 422, message: "Milled width is outside the profile tolerance.", trigger: "abs(actual_milled_width_in - planned_finished_width_in) greater than 0.006 in." }
  - { error_id: ERR_BYPRODUCT_SALE_EXISTS, status: 409, message: "Lot has byproduct sales and cannot be voided.", trigger: "Voiding a MILLED lot whose batches already carry a sale." }
  - { error_id: ERR_SPECIES_MISMATCH, status: 422, message: "Receipt species does not match the charge schedule species.", trigger: "Allocating a receipt of another species." }
  - { error_id: ERR_CORE_STOCK_REQUIRED, status: 422, message: "Engineered lots require core stock.", trigger: "Creating an ENGINEERED lot without core_stock_id." }
  - { error_id: ERR_CORE_STOCK_NOT_ALLOWED, status: 422, message: "Solid lots may not reference core stock.", trigger: "Creating a SOLID lot with core_stock_id." }
  - { error_id: ERR_CORE_STOCK_LINE_MISMATCH, status: 422, message: "Core stock belongs to a different product line.", trigger: "Creating a lot with core stock from another line." }
  - { error_id: ERR_GRADE_RUN_LOT_MISMATCH, status: 422, message: "Grade run belongs to a different flooring lot.", trigger: "Finalizing a lot against another lot's run, or superseding with another lot's run." }
  - { error_id: ERR_CHARACTER_GRADE_NOT_PERMITTED, status: 422, message: "Character grades require the MILL_CHARACTER ruleset.", trigger: "Adding a CHARACTER or CABIN bundle to an NHLA run." }
  - { error_id: ERR_PREFINISH_WINDOW_INVALID, status: 422, message: "Prefinish window is empty or too long.", trigger: "window_end_utc at or before window_start_utc, or a window longer than 24 hours." }
  - { error_id: ERR_CHAMBER_WINDOW_CONFLICT, status: 409, message: "Chamber occupancy windows collide.", trigger: "A charge window touching or overlapping another window on the same chamber, cooldown buffer included." }
  - { error_id: ERR_INSTALL_DATE_IN_FUTURE, status: 422, message: "Installation date is in the future.", trigger: "installation_date after the current logical date." }
  - { error_id: ERR_WARRANTY_PERIOD_EXPIRED, status: 422, message: "Warranty period has expired.", trigger: "A claim filed more than 60 whole months after installation." }
  - { error_id: ERR_ACCEPTED_BF_EXCEEDS_RECEIVED, status: 422, message: "Accepted board feet exceed the received quantity.", trigger: "accepted_board_feet greater than received_board_feet." }
  - { error_id: ERR_CHAMBER_CAPACITY_EXCEEDED, status: 422, message: "Charge exceeds the chamber capacity.", trigger: "Allocating a receipt that pushes charged_green_bf above capacity_board_feet." }
  - { error_id: ERR_CHARGE_DRY_BF_EXCEEDED, status: 422, message: "Lot draw exceeds the remaining kiln-dry volume.", trigger: "input_dry_bf greater than KilnCharge.remaining_dry_bf." }
  - { error_id: ERR_CORE_STOCK_INSUFFICIENT, status: 422, message: "Core stock has insufficient available square footage.", trigger: "A reservation pushing reserved_square_feet above available_square_feet." }
  - { error_id: ERR_MILL_MASS_BALANCE_VIOLATION, status: 422, message: "Milling outputs exceed the kiln-dry input.", trigger: "net_flooring_bf plus shorts_bf plus residue_bf greater than input_dry_bf." }
  - { error_id: ERR_WASTE_LIMIT_EXCEEDED, status: 422, message: "Unaccounted waste exceeds the mill limit.", trigger: "waste_bf above 12 percent of input_dry_bf." }
  - { error_id: ERR_NO_GRADE_BUNDLES, status: 422, message: "Grade run has no bundles.", trigger: "Finalizing a run with an empty bundle set." }
  - { error_id: ERR_BUNDLE_BF_EXCEEDS_LOT, status: 422, message: "Bundle board feet exceed the lot net flooring volume.", trigger: "Adding or finalizing bundles whose total exceeds net_flooring_bf." }
  - { error_id: ERR_PREFINISH_CAPACITY_EXCEEDED, status: 422, message: "Prefinish line capacity exceeded for the overlapping window set.", trigger: "Aggregate scheduled linear feet above daily_capacity_linear_feet." }
  - { error_id: ERR_BYPRODUCT_QUANTITY_EXCEEDS_BATCH, status: 422, message: "Sale quantity exceeds the unsold batch tonnage.", trigger: "sold_tons plus quantity_tons above available_tons." }
  - { error_id: ERR_TOO_MANY_OPEN_CLAIMS, status: 409, message: "Product line already carries the maximum open claims.", trigger: "Filing a fourth SUBMITTED or INFO_REQUESTED claim on one line." }
  - { error_id: ERR_DUPLICATE_CODE, status: 409, message: "Configuration code already exists.", trigger: "Re-using species_code, schedule_code, chamber_code or line_code." }
  - { error_id: ERR_ADJUDICATED_SF_EXCEEDS_CLAIM, status: 422, message: "Adjudicated area exceeds the claimed area.", trigger: "adjudicated_affected_sf greater than affected_square_feet." }
  - { error_id: ERR_WARRANTY_RESERVE_INSUFFICIENT, status: 422, message: "Warranty reserve cannot cover the adjudicated liability.", trigger: "adjudicated_liability_cents above warranty_balance_cents." }

rbac:
  model: peer_roles + segregation_of_duties
  user_header: X-User-ID
  role_header: X-Role
  roles:
    - name: Anonymous
      description: "Unauthenticated caller. No operations; every request is rejected with ERR_UNAUTHENTICATED."
      exclusive_operations: []
      shared_operations: []
    - name: MillAdmin
      description: "Configures reference data, funds and freezes product lines, and can act as a backstop on most workflows."
      exclusive_operations:
        - "POST /mill/species-profiles"
        - "POST /mill/kiln-chambers"
        - "POST /mill/product-lines"
        - "POST /mill/prefinish-lines"
        - "POST /mill/product-lines/{product_line_id}/fund_warranty"
        - "POST /mill/product-lines/{product_line_id}/freeze"
        - "POST /mill/product-lines/{product_line_id}/unfreeze"
      shared_operations:
        - "POST /mill/drying-schedules"
        - "POST /mill/green-receipts and its accept / reject actions"
        - "POST /mill/core-stocks"
        - "POST /mill/kiln-charges, allocate_receipt, deallocate_receipt, reschedule"
        - "POST /mill/kiln-chambers/{kiln_chamber_id}/start_maintenance and complete_maintenance"
        - "POST /mill/flooring-lots and void"
        - "POST /mill/grade-runs/{grade_run_id}/supersede"
        - "POST /mill/prefinish-runs and release_hold"
        - "POST /mill/byproduct-sales"
        - "POST /mill/warranty-claims, resubmit, reverse"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: ProcurementClerk
      description: "Owns the receiving deck."
      exclusive_operations: []
      shared_operations:
        - "POST /mill/green-receipts"
        - "POST /mill/green-receipts/{green_receipt_id}/accept"
        - "POST /mill/green-receipts/{green_receipt_id}/reject"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: KilnOperator
      description: "Owns kiln chambers and charges through release."
      exclusive_operations:
        - "POST /mill/kiln-charges/{kiln_charge_id}/load"
        - "POST /mill/kiln-charges/{kiln_charge_id}/start_drying"
        - "POST /mill/kiln-charges/{kiln_charge_id}/begin_conditioning"
        - "POST /mill/kiln-charges/{kiln_charge_id}/record_stress_test"
        - "POST /mill/kiln-charges/{kiln_charge_id}/resume_conditioning"
      shared_operations:
        - "POST /mill/drying-schedules"
        - "POST /mill/kiln-charges, allocate_receipt, deallocate_receipt, reschedule"
        - "POST /mill/kiln-chambers/{kiln_chamber_id}/start_maintenance and complete_maintenance"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: MillSupervisor
      description: "Owns milling: lot planning, milling completion and voiding."
      exclusive_operations:
        - "POST /mill/flooring-lots/{flooring_lot_id}/complete_milling"
      shared_operations:
        - "POST /mill/flooring-lots and void"
        - "POST /mill/flooring-lots/{flooring_lot_id}/finalize"
        - "POST /mill/core-stocks"
        - "POST /mill/warranty-claims/{warranty_claim_id}/start_remediation and complete_remediation"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: GradeInspector
      description: "Owns grading under industry rules."
      exclusive_operations:
        - "POST /mill/grade-runs"
        - "POST /mill/grade-runs/{grade_run_id}/bundles"
        - "POST /mill/grade-runs/{grade_run_id}/finalize"
      shared_operations:
        - "POST /mill/grade-runs/{grade_run_id}/supersede"
        - "POST /mill/flooring-lots/{flooring_lot_id}/finalize"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: PrefinishScheduler
      description: "Owns the prefinishing lines."
      exclusive_operations:
        - "POST /mill/prefinish-runs/{prefinish_run_id}/start"
        - "POST /mill/prefinish-runs/{prefinish_run_id}/complete"
      shared_operations:
        - "POST /mill/prefinish-runs"
        - "POST /mill/prefinish-runs/{prefinish_run_id}/release_hold"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: ByproductBroker
      description: "Sells sawdust, shavings and shorts."
      exclusive_operations: []
      shared_operations:
        - "POST /mill/byproduct-sales"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
    - name: WarrantyAdjudicator
      description: "Files and adjudicates cupping and gapping claims; may never adjudicate a claim it submitted."
      exclusive_operations:
        - "POST /mill/warranty-claims/{warranty_claim_id}/request_info"
        - "POST /mill/warranty-claims/{warranty_claim_id}/adjudicate"
      shared_operations:
        - "POST /mill/warranty-claims"
        - "POST /mill/warranty-claims/{warranty_claim_id}/resubmit"
        - "POST /mill/warranty-claims/{warranty_claim_id}/reverse"
        - "POST /mill/warranty-claims/{warranty_claim_id}/start_remediation and complete_remediation"
        - "All GET endpoints"
        - "POST /_clock/set_current_utc"
  segregation_of_duties:
    - rule: "The X-User-ID that submitted a warranty claim may not adjudicate it, even with the WarrantyAdjudicator role."
      error_id: ERR_SEGREGATION_OF_DUTIES
