        residuals}) for ${h17c} == 3000000 — the conserved ledger total is unchanged by the distribution
      - Contribution.${ctr17_old}.status == DISTRIBUTED (oldest by contribution_date drained first)
      - Contribution.${ctr17_new} shows 750000 POSTED residual with a 250000 DISTRIBUTED/RECHARACTERIZED sibling — waterfall
        order oldest-first, tie-break created_at ASC, partial split on the last item
      - excise_tax_cents == 0 (executed 2027-03-01 <= deadline 2027-12-31)
  - name: unlock_relock_conserves_census_snapshot_integrity
    grounds:
    - state_machines.PlanYear.CENSUS_LOCKED_to_CENSUS_COLLECTING
    - state_machines.PlanYear.CENSUS_COLLECTING_to_CENSUS_LOCKED
    - calculations.hce_determination
    distinguishing_aspect: 'Conserved quantity: the HCE/NHCE cohort composition derived from

      unchanged census inputs. The forward action (unlock) plus its

      compensating action (re-lock with NO census mutation) must reproduce

      identical hce_status, key_employee_status, and attributed_ownership_pct

      on every employee — while census_lock_version strictly increases

      (proving the lock actually re-ran rather than being skipped).

      '
    test_recipe:
      setup:
      - Echo-style locked plan year with 3 employees; unlock then immediately re-lock with no census edits
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Romeo Corp
          ein: '933456789'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          emp18_id: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/employers/${emp18_id}/plans
        payload:
          plan_name: Romeo 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          plan18_id: $.data.id
      - call: POST /ndt/plans/${plan18_id}/plan-versions
        payload:
          effective_start: '2026-01-01'
          effective_end: '2026-12-31'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          pv18_id: $.data.id
      - call: POST /ndt/plan-versions/${pv18_id}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${plan18_id}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          py18_id: $.data.id
          py18_v0: $.data.version
      - call: POST /ndt/plan-years/${py18_id}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${py18_id}/census-employees
        payload:
          ssn: '939390001'
          full_name: Hana
          date_of_birth: '1975-01-01'
          date_of_hire: '2015-01-01'
          employment_status: ACTIVE
          ownership_pct_direct: 6
        as: PlanAdministrator
        captures:
          h18: $.data.id
      - call: POST /ndt/plan-years/${py18_id}/census-employees
        payload:
          ssn: '939390002'
          full_name: Ivan
          date_of_birth: '1985-01-01'
          date_of_hire: '2019-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          n18a: $.data.id
      - call: POST /ndt/plan-years/${py18_id}/census-employees
        payload:
          ssn: '939390003'
          full_name: Juno
          date_of_birth: '1988-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          n18b: $.data.id
      - call: POST /ndt/census-employees/${h18}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 30000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${n18a}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 10000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${n18b}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 9000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: GET /ndt/plan-years/${py18_id}
        payload: {}
        as: PlanAdministrator
        captures:
          occ_v_19: $.data.version
      - call: POST /ndt/plan-years/${py18_id}/lock-census
        payload:
          expected_plan_year_version: ${occ_v_19}
        as: PlanAdministrator
        captures:
          py18_v_locked: $.data.version
      trigger:
      - call: POST /ndt/plan-years/${py18_id}/unlock-census
        payload: {}
        as: PlanAdministrator
      - call: GET /ndt/plan-years/${py18_id}
        payload: {}
        as: PlanAdministrator
        captures:
          occ_v_20: $.data.version
      - call: POST /ndt/plan-years/${py18_id}/lock-census
        payload:
          expected_plan_year_version: ${occ_v_20}
        as: PlanAdministrator
      - call: GET /ndt/census-employees/${h18}
        payload: {}
        as: ComplianceAnalyst
      - call: GET /ndt/census-employees/${n18a}
        payload: {}
        as: ComplianceAnalyst
      - call: GET /ndt/plan-years/${py18_id}
        payload: {}
        as: ComplianceAnalyst
        captures:
          py18_final: $.data.census_lock_version
      assert:
      - CensusEmployee.${h18}.hce_status == HCE and attributed_ownership_pct == 6 — identical to the first lock's output
      - CensusEmployee.${n18a}.hce_status == NHCE and key_employee_status == NON_KEY — cohort composition conserved across
        unlock+relock
      - PlanYear.census_lock_version == 2 (the compensating action re-ran the lock rather than restoring a cached snapshot)
