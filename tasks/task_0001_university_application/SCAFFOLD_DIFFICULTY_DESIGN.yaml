            - "A successful yield-management run promotes Applicant 1 from WAITLISTED to ADMITTED — this sets AdmissionCycle.last_yield_run_at and yield_run_count=1 while school still has 0 confirmed enrollments and posture==OPEN"
            - "Applicant 1 then accepts the offer → School.confirmed_enrollment_count=1 == target, posture=AT_TARGET"
            - "Server clock advanced only 1 hour after the prior yield run (within 86_400_000 ms cooldown)"
          setup_api_calls:
