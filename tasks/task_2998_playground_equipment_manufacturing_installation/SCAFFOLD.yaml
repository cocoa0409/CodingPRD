scenario: |
  2998. Playground Equipment Manufacturing & Installation (commercial playground equipment
  manufacturer): design consultation with age group separation, accessibility requirements and
  site constraints, component manufacturing across posts, decks, plastic slides and metal
  climbers with color options, safety standard compliance with certification, use zone
  specification and surfacing requirements, quote and design rendering process with community
  input and fundraising timelines, order fulfillment with kitting, hardware bagging and
  installation instruction packages, certified installer network with installation inspection
  and post-installation safety audit, warranty by component category with parts availability
  for older systems, replacement part sales and equipment retrofit for compliance updates

domain_name: playground-equipment-manufacturing-installation
api_prefix: "/playground"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # ComponentPlacement forms a DAG through `attached_to_placement_id` (posts <- decks <-
  # slides/climbers) and ComponentModel forms a supersession chain through
  # `supersedes_model_id`; PlaygroundStandard forms a supersession chain through
  # `superseded_by_standard_id`. Cross-aggregate references (WarrantyClaim -> ComponentModel,
  # DesignRendering -> PlaygroundStandard) cut across the DesignProject tree.

  state_machine_shape: cyclic
  # DesignProject.design_status cycles RENDERED -> COMMUNITY_REVIEW -> REVISION_REQUESTED ->
  # RENDERED. InstallationJob.status cycles INSPECTION_PENDING -> INSPECTION_FAILED ->
  # REWORK_IN_PROGRESS -> INSPECTION_PENDING. ComponentModel.certification_status cycles
  # CERTIFIED -> DECERTIFIED -> CERTIFIED. CertifiedInstaller.status cycles ACTIVE ->
  # SUSPENDED -> ACTIVE. DesignProject additionally carries a second, independent state
  # dimension (compliance_status) and ManufacturingOrder carries two parallel prep dimensions
  # (kitting_status x bagging_status) that fork at IN_PRODUCTION and join at READY_TO_SHIP.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The DesignConsultant who authored a project may not certify its compliance; the
  # SafetyAuditor who filed the INSTALL_INSPECTION for a job may not file that job's
  # POST_INSTALL_AUDIT.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 67 endpoints / 79 error codes / 9 calculations (2 dual-variant) /
  # 16 state machines over 13 entities (4 cyclic, ManufacturingOrder carrying three
  # parallel dimensions with a fork-join, DesignProject and ComponentModel two each).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: PlaygroundStandard
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Standard family code, e.g. ASTM_F1487"
        constraints: "1..40 chars; uppercase letters, digits and underscore only"
      - name: edition_year
        type: integer
        source: input
        description: "Edition year of this standard revision"
        constraints: "2000..2100; (code, edition_year) is globally unique"
      - name: effective_from
        type: string
        source: input
        description: "Date (YYYY-MM-DD) from which this edition may be activated"
      - name: min_use_zone_clearance_cm
        type: integer
        source: input
        description: "Minimum clear distance required between use zones of different age groups"
        constraints: ">= 0"
      - name: max_fall_height_cm_toddler
        type: integer
        source: input
        description: "Maximum permitted designated play surface height for age_group TODDLER_6_23M"
        constraints: "> 0"
      - name: max_fall_height_cm_preschool
        type: integer
        source: input
        description: "Maximum permitted designated play surface height for age_group PRESCHOOL_2_5"
        constraints: "> 0"
      - name: max_fall_height_cm_school_age
        type: integer
        source: input
        description: "Maximum permitted designated play surface height for age_group SCHOOL_AGE_5_12"
        constraints: "> 0"
      - name: requires_accessible_route
        type: boolean
        source: input
        description: "Whether this edition mandates an accessible transfer point per play area"
        default: true
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the standard edition"
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED}; at most one row may be ACTIVE at any time"
      - name: superseded_by_standard_id
        type: string
        source: system
        description: "FK -> PlaygroundStandard.id; set when this edition is superseded; null while DRAFT or ACTIVE"
        default: null

  - name: ComponentModel
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Manufacturer catalogue SKU"
        constraints: "1..40 chars; globally unique"
      - name: category
        type: enum
        source: input
        description: "Manufacturing / warranty category of the component"
        constraints: "one of {POST, DECK, PLASTIC_SLIDE, METAL_CLIMBER, HARDWARE_KIT}"
      - name: age_group
        type: enum
        source: input
        description: "Age band this model is designed for"
        constraints: "one of {TODDLER_6_23M, PRESCHOOL_2_5, SCHOOL_AGE_5_12}"
      - name: deck_height_cm
        type: integer
        source: input
        description: "Designated play surface height contributed by this model; 0 for ground-level components"
        constraints: ">= 0 and <= 400"
      - name: use_zone_footprint_cm
        type: integer
        source: input
        description: "Half-extent of the model's use zone along the site axis, measured from its anchor point"
        constraints: ">= 0"
      - name: color_options
        type: array
        source: input
        description: "Ordered list of selectable colors; element 0 is the no-cost default color"
        constraints: "1..8 distinct uppercase strings"
      - name: unit_price_cents
        type: integer
        source: input
        description: "List price per unit in cents, excluding color uplift and freight"
        constraints: "> 0"
      - name: hardware_bag_count
        type: integer
        source: input
        description: "Number of hardware bags shipped per unit during hardware bagging"
        constraints: ">= 0"
      - name: warranty_years
        type: integer
        source: input
        description: "Warranty term in years for this model"
        constraints: ">= 1 and <= 50"
      - name: parts_support_until_year
        type: integer
        source: input
        description: "Last calendar year in which replacement parts for this model are sold"
        constraints: "2000..2200"
      - name: accessible_transfer_ready
        type: boolean
        source: input
        description: "Whether this model provides a compliant accessible transfer point"
        default: false
      - name: supersedes_model_id
        type: string
        source: input
        description: "FK -> ComponentModel.id; the older model this one replaces for retrofit purposes; null for new families"
        default: null
      - name: certification_status
        type: enum
        source: system
        description: "Safety certification state of the model"
        default: UNCERTIFIED
        constraints: "one of {UNCERTIFIED, CERTIFIED, DECERTIFIED}"
      - name: certified_against_standard_id
        type: string
        source: system
        description: "FK -> PlaygroundStandard.id; the edition this model was certified against; null while UNCERTIFIED"
        default: null
      - name: lifecycle_status
        type: enum
        source: system
        description: "Commercial availability of the model; LEGACY models carry a replacement-part surcharge"
        default: ACTIVE
        constraints: "one of {ACTIVE, LEGACY, DISCONTINUED}"

  - name: DesignProject
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: "Name of the commissioning client (school, municipality, HOA)"
        constraints: "1..120 chars"
      - name: consultant_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the DesignConsultant that created the project; used by the segregation-of-duties check on compliance certification"
      - name: site_length_cm
        type: integer
        source: input
        description: "Usable site extent along the layout axis; play areas are allocated inside [0, site_length_cm)"
        constraints: "> 0 and <= 100000"
      - name: site_width_cm
        type: integer
        source: input
        description: "Usable site extent perpendicular to the layout axis"
        constraints: "> 0 and <= 100000"
      - name: site_soil_type
        type: enum
        source: input
        description: "Subgrade soil classification; CLAY adds a surfacing depth uplift"
        constraints: "one of {SANDY_LOAM, GRAVEL, CLAY}"
      - name: budget_cents
        type: integer
        source: input
        description: "Client hard budget ceiling in cents; FIRM quotes may not exceed it"
        constraints: "> 0"
      - name: fundraising_deadline
        type: string
        source: input
        description: "Date (YYYY-MM-DD) after which pledges may no longer be collected"
      - name: required_age_groups
        type: array
        source: input
        description: "Age bands the finished playground must serve; every band needs its own PlayArea before a rendering can be issued"
        constraints: "1..3 distinct members of {TODDLER_6_23M, PRESCHOOL_2_5, SCHOOL_AGE_5_12}"
      - name: accessible_route_required
        type: boolean
        source: input
        description: "Whether the client contract mandates an accessible transfer point in every play area"
        default: true
      - name: design_status
        type: enum
        source: system
        description: "Primary design lifecycle dimension"
        default: DRAFT
        constraints: "one of {DRAFT, CONSULTATION, RENDERED, COMMUNITY_REVIEW, REVISION_REQUESTED, DESIGN_APPROVED, CERTIFIED, ORDERED, INSTALLED, AUDITED, CANCELLED}"
      - name: compliance_status
        type: enum
        source: system
        description: "Second, independent state dimension tracking regulatory posture; evolves separately from design_status"
        default: NOT_ASSESSED
        constraints: "one of {NOT_ASSESSED, COMPLIANT, RETROFIT_REQUIRED, NON_COMPLIANT}"
      - name: revision_rounds
        type: integer
        source: computed
        description: "Number of completed community review rounds that ended in REVISION_REQUESTED"
        default: 0
      - name: installed_on
        type: string
        source: system
        description: "Date (YYYY-MM-DD, from the logical clock) on which design_status became INSTALLED; warranty elapsed time is measured from it; null until then"
        default: null
      - name: funds_collected_cents
        type: integer
        source: computed
        description: "Sum of FundraisingPledge.amount_cents for this project whose status == COLLECTED"
        default: 0
      - name: alloc_permit_freight_cents
        type: integer
        source: computed
        description: "Waterfall bucket 1 allocation of funds_collected_cents"
        default: 0
      - name: alloc_surfacing_cents
        type: integer
        source: computed
        description: "Waterfall bucket 2 allocation of funds_collected_cents"
        default: 0
      - name: alloc_structure_cents
        type: integer
        source: computed
        description: "Waterfall bucket 3 allocation of funds_collected_cents"
        default: 0
      - name: alloc_contingency_cents
        type: integer
        source: computed
        description: "Waterfall bucket 4 allocation; absorbs every remaining cent"
        default: 0

  - name: PlayArea
    parent: DesignProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: system
        description: "FK -> DesignProject.id; owning project, taken from the request path"
      - name: age_group
        type: enum
        source: input
        description: "Single age band this area serves; every ComponentPlacement inside must use a model of the same band"
        constraints: "one of {TODDLER_6_23M, PRESCHOOL_2_5, SCHOOL_AGE_5_12}; unique per (project_id, age_group)"
      - name: axis_origin_cm
        type: integer
        source: input
        description: "Inclusive start of the area's half-open interval [axis_origin_cm, axis_origin_cm + axis_length_cm) on the site axis"
        constraints: ">= 0"
      - name: axis_length_cm
        type: integer
        source: input
        description: "Length of the area's half-open interval on the site axis"
        constraints: "> 0; axis_origin_cm + axis_length_cm <= project.site_length_cm"
      - name: surfacing_material
        type: enum
        source: input
        description: "Protective surfacing product specified for this area"
        constraints: "one of {ENGINEERED_WOOD_FIBER, POURED_RUBBER}"
      - name: surfacing_depth_cm
        type: integer
        source: input
        description: "Depth of protective surfacing the design specifies for this area"
        constraints: ">= 0 and <= 120"
      - name: critical_fall_height_cm
        type: integer
        source: computed
        description: "Highest deck_height_cm among this area's placements with status IN {DRAFT, VALIDATED}; 0 when that set is empty"
        default: 0
      - name: required_surfacing_depth_cm
        type: integer
        source: computed
        description: "Output of calculations.surfacing_depth_requirement for this area; recomputed on every placement create, validate, delete and retrofit"
        default: 15
      - name: status
        type: enum
        source: system
        description: "Area lifecycle; LOCKED once the owning project reaches ORDERED"
        default: PLANNED
        constraints: "one of {PLANNED, ZONED, LOCKED}"

  - name: ComponentPlacement
    parent: PlayArea
    common_fields: true
    fields:
      - name: play_area_id
        type: string
        source: system
        description: "FK -> PlayArea.id; owning play area, taken from the request path"
      - name: component_model_id
        type: string
        source: input
        description: "FK -> ComponentModel.id; the catalogue model being placed"
      - name: attached_to_placement_id
        type: string
        source: input
        description: "FK -> ComponentPlacement.id; parent placement this component bolts onto (slides and climbers attach to decks, decks attach to posts); null for free-standing placements"
        default: null
      - name: color_choice
        type: string
        source: input
        description: "Selected color; must be a member of the model's color_options. Any value other than color_options[0] incurs the color uplift"
      - name: x_start_cm
        type: integer
        source: input
        description: "Anchor coordinate of the component on the site axis"
        constraints: ">= 0"
      - name: quantity
        type: integer
        source: input
        description: "Number of identical units at this placement"
        constraints: ">= 1 and <= 50"
      - name: use_zone_start_cm
        type: integer
        source: computed
        description: "Inclusive start of the placement's closed use-zone interval, per calculations.use_zone_extent"
      - name: use_zone_end_cm
        type: integer
        source: computed
        description: "Inclusive end of the placement's closed use-zone interval, per calculations.use_zone_extent"
      - name: status
        type: enum
        source: system
        description: "Placement lifecycle; PROVISIONAL quotes price DRAFT + VALIDATED, FIRM quotes price VALIDATED only"
        default: DRAFT
        constraints: "one of {DRAFT, VALIDATED, NEEDS_RECERTIFICATION}"
      - name: retrofit_model_id
        type: string
        source: system
        description: "FK -> ComponentModel.id; model supplied by the most recent accepted retrofit/replacement order against this placement; null until then"
        default: null
      - name: retrofit_quantity
        type: integer
        source: system
        description: "Units purchased on the most recent retrofit/replacement order"
        default: 0
      - name: retrofit_unit_price_cents
        type: integer
        source: computed
        description: "Per-unit price of the most recent retrofit/replacement, including any legacy surcharge"
        default: 0
      - name: retrofit_handling_cents
        type: integer
        source: computed
        description: "Handling charge on the most recent retrofit/replacement; 0 when waived"
        default: 0
      - name: retrofit_total_cents
        type: integer
        source: computed
        description: "Total charge for the most recent retrofit/replacement"
        default: 0
      - name: legacy_surcharge_applied
        type: boolean
        source: computed
        description: "Whether the most recent retrofit/replacement priced in the LEGACY surcharge"
        default: false

  - name: DesignRendering
    parent: DesignProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: system
        description: "FK -> DesignProject.id; owning project, taken from the request path"
      - name: pinned_standard_id
        type: string
        source: input
        description: "FK -> PlaygroundStandard.id; the edition this rendering is certified against. Must equal the single ACTIVE standard at issue time; the pin is frozen afterwards even if that edition is later superseded"
      - name: round_number
        type: integer
        source: computed
        description: "1 for the project's first rendering; previous max round_number + 1 afterwards"
      - name: use_zone_snapshot
        type: object
        source: computed
        description: "Frozen map { play_area_id: { critical_fall_height_cm, required_surfacing_depth_cm, surfacing_depth_cm, placement_count } } captured at issue time"
      - name: yes_votes
        type: integer
        source: system
        description: "Cumulative community yes votes recorded against this rendering"
        default: 0
      - name: no_votes
        type: integer
        source: system
        description: "Cumulative community no votes recorded against this rendering"
        default: 0
      - name: community_approval_pct
        type: number
        source: computed
        description: "Output of calculations.community_approval_pct; 0.0 while no votes exist"
        default: 0.0
      - name: status
        type: enum
        source: system
        description: "Rendering lifecycle; only an ISSUED rendering may back a Quote"
        default: ISSUED
        constraints: "one of {ISSUED, SUPERSEDED, WITHDRAWN}"

  - name: Quote
    parent: DesignProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DesignProject.id; project being quoted"
      - name: rendering_id
        type: string
        source: input
        description: "FK -> DesignRendering.id; the ISSUED rendering this quote prices; must belong to project_id"
      - name: variant
        type: enum
        source: input
        description: "Pricing algorithm selector; see calculations.quote_pricing variants"
        constraints: "one of {PROVISIONAL, FIRM}"
      - name: valid_until
        type: string
        source: input
        description: "Date (YYYY-MM-DD) up to and including which the quote may be accepted"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of priced placement lines per calculations.quote_pricing step 3"
      - name: freight_cents
        type: integer
        source: computed
        description: "Freight charge per calculations.quote_pricing step 4"
      - name: discount_cents
        type: integer
        source: computed
        description: "Volume discount per calculations.quote_pricing step 5; the tier is selected on subtotal_cents only"
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + freight_cents - discount_cents"
      - name: priced_unit_count
        type: integer
        source: computed
        description: "Sum of quantity over the placements included by this variant"
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle"
        default: ISSUED
        constraints: "one of {ISSUED, ACCEPTED, EXPIRED}"

  - name: FundraisingPledge
    parent: DesignProject
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: system
        description: "FK -> DesignProject.id; owning project, taken from the request path"
      - name: amount_cents
        type: integer
        source: input
        description: "Pledged amount in cents"
        constraints: "> 0"
      - name: pledged_at
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the pledge was made; must be <= the logical clock date"
      - name: status
        type: enum
        source: system
        description: "Pledge lifecycle; only COLLECTED pledges count toward funds_collected_cents"
        default: PLEDGED
        constraints: "one of {PLEDGED, COLLECTED, REFUNDED}"

  - name: ManufacturingOrder
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the ACCEPTED FIRM quote this order fulfils"
      - name: production_status
        type: enum
        source: system
        description: "Primary fulfilment axis; the join transition into READY_TO_SHIP fires only when both prep dimensions are DONE"
        default: CREATED
        constraints: "one of {CREATED, IN_PRODUCTION, READY_TO_SHIP, SHIPPED, CANCELLED}"
      - name: kitting_status
        type: enum
        source: system
        description: "First parallel prep dimension: bundling components into shipping kits"
        default: PENDING
        constraints: "one of {PENDING, IN_PROGRESS, DONE}"
      - name: bagging_status
        type: enum
        source: system
        description: "Second parallel prep dimension: bagging fasteners per kit; evolves independently of kitting_status"
        default: PENDING
        constraints: "one of {PENDING, IN_PROGRESS, DONE}"
      - name: kit_line_count
        type: integer
        source: computed
        description: "Number of distinct ComponentPlacement lines kitted; written only by the kitting DONE branch"
        default: 0
      - name: hardware_bag_total
        type: integer
        source: computed
        description: "Sum over the quote's priced placements of model.hardware_bag_count * placement.quantity; written only by the bagging DONE branch"
        default: 0
      - name: instruction_package_revision
        type: integer
        source: computed
        description: "Installation instruction package revision; written only by the join transition into READY_TO_SHIP as rendering.round_number"
        default: 0

  - name: CertifiedInstaller
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Installer company name"
        constraints: "1..120 chars; globally unique"
      - name: certification_level
        type: enum
        source: input
        description: "Installer certification tier"
        constraints: "one of {APPRENTICE, CERTIFIED, MASTER}"
      - name: certified_categories
        type: array
        source: input
        description: "Component categories this installer is certified to install"
        constraints: "1..5 distinct members of {POST, DECK, PLASTIC_SLIDE, METAL_CLIMBER, HARDWARE_KIT}"
      - name: crew_capacity_per_day
        type: integer
        source: input
        description: "Maximum crew members the company can field on any single calendar day"
        constraints: ">= 1 and <= 200"
      - name: certification_expires_on
        type: string
        source: input
        description: "Date (YYYY-MM-DD) up to and including which the certification is valid"
      - name: region_code
        type: string
        source: input
        description: "Service region code"
        constraints: "exactly 2 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Network membership state"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, REVOKED}"
      - name: open_audit_failures
        type: integer
        source: computed
        description: "Count of this installer's InstallationJob rows currently in status AUDIT_FAILED"
        default: 0
      - name: committed_crew_days
        type: integer
        source: computed
        description: "Output of calculations.installer_committed_crew_days; recomputed on every job create, reschedule, cancel and status change"
        default: 0

  - name: InstallationJob
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> ManufacturingOrder.id; the order whose kit this job installs; an order may carry several phased jobs"
      - name: installer_id
        type: string
        source: input
        description: "FK -> CertifiedInstaller.id; the assigned installer company"
      - name: scheduled_start_date
        type: string
        source: input
        description: "Inclusive first calendar day (YYYY-MM-DD) of the booking's closed date interval"
      - name: scheduled_end_date
        type: string
        source: input
        description: "Inclusive last calendar day (YYYY-MM-DD) of the booking's closed date interval; must be >= scheduled_start_date"
      - name: crew_size
        type: integer
        source: input
        description: "Crew members committed for every day of the booking"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Job lifecycle; cycles through the rework loop"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, INSPECTION_PENDING, INSPECTION_FAILED, REWORK_IN_PROGRESS, AUDIT_PENDING, AUDIT_PASSED, AUDIT_FAILED, CANCELLED}"
      - name: rework_cycles
        type: integer
        source: computed
        description: "Number of completed rework loops; incremented by the rework COMPLETE transition"
        default: 0
      - name: last_failed_inspection_kind
        type: enum
        source: system
        description: "Kind of the most recent FAIL inspection; decides which state the rework COMPLETE transition returns to"
        default: null
        constraints: "null or one of {INSTALL_INSPECTION, POST_INSTALL_AUDIT}"
      - name: install_inspector_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SafetyAuditor that filed the first INSTALL_INSPECTION for this job; the segregation-of-duties check compares the auditor against it"
        default: null
      - name: booked_crew_days
        type: integer
        source: computed
        description: "crew_size * (scheduled_end_date - scheduled_start_date + 1); this job's contribution to installer.committed_crew_days while its status is non-excluded"

  - name: InstallationInspection
    parent: InstallationJob
    common_fields: false
    fields:
      - name: job_id
        type: string
        source: system
        description: "FK -> InstallationJob.id; owning job, taken from the request path"
      - name: kind
        type: enum
        source: input
        description: "Which of the two mandated checks this record captures"
        constraints: "one of {INSTALL_INSPECTION, POST_INSTALL_AUDIT}"
      - name: result
        type: enum
        source: input
        description: "Outcome of the check"
        constraints: "one of {PASS, FAIL}"
      - name: performed_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SafetyAuditor that filed the record"
      - name: deficiency_count
        type: integer
        source: input
        description: "Number of deficiencies noted"
        constraints: ">= 0"
      - name: fall_height_measured_cm
        type: integer
        source: input
        description: "Highest measured designated play surface height on site"
        constraints: ">= 0"
      - name: surfacing_depth_measured_cm
        type: integer
        source: input
        description: "Shallowest measured protective surfacing depth on site"
        constraints: ">= 0"
      - name: sequence_number
        type: integer
        source: computed
        description: "1 for the job's first inspection record, previous max + 1 afterwards; append-only log ordering"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> DesignProject.id; the installed project the failure occurred on"
      - name: placement_id
        type: string
        source: input
        description: "FK -> ComponentPlacement.id; the failed placement; must belong to a PlayArea of project_id"
      - name: component_model_id
        type: string
        source: system
        description: "FK -> ComponentModel.id; copied from placement.component_model_id at claim time and frozen"
      - name: claim_category
        type: enum
        source: computed
        description: "Copied from the model's category; selects the warranty coverage variant"
        constraints: "one of {POST, DECK, PLASTIC_SLIDE, METAL_CLIMBER, HARDWARE_KIT}"
      - name: quantity
        type: integer
        source: input
        description: "Number of failed units claimed"
        constraints: ">= 1"
      - name: failure_date
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the failure occurred; must be >= project.installed_on and <= the logical clock date"
      - name: elapsed_years
        type: integer
        source: computed
        description: "floor(days between project.installed_on and failure_date / 365)"
      - name: coverage_variant
        type: enum
        source: computed
        description: "Which calculations.warranty_coverage variant was applied"
        constraints: "one of {PRORATED, STEP}"
      - name: covered_pct
        type: integer
        source: computed
        description: "Percentage of list price covered, per calculations.warranty_coverage"
      - name: reimbursement_cents
        type: integer
        source: computed
        description: "Payable amount per calculations.warranty_coverage"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DENIED}"

state_machines:
  - entity: PlaygroundStandard
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /playground/standards/{id}/activate"
        actor: ManufacturerAdmin
        preconditions:
          - "standard.status == DRAFT"
          - "no other PlaygroundStandard has status == ACTIVE (else ERR_ACTIVE_STANDARD_EXISTS)"
        side_effects:
          - "sets status = ACTIVE"
          - "increments PlaygroundStandard.version by 1"
        note: "The invariant 'at most one ACTIVE standard' makes the phrase 'the ACTIVE standard' a deterministic singleton selector everywhere else in the scaffold."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /playground/standards/{id}/supersede"
        actor: ManufacturerAdmin
        preconditions:
          - "standard.status == ACTIVE"
          - "body successor_standard_id resolves to a PlaygroundStandard with status == DRAFT (else ERR_SUCCESSOR_NOT_DRAFT)"
          - "successor.effective_from <= the logical clock date (else ERR_SUCCESSOR_NOT_EFFECTIVE)"
        side_effects:
          - "sets status = SUPERSEDED and superseded_by_standard_id = successor_standard_id"
          - "sets successor.status = ACTIVE (preserving the single-ACTIVE invariant)"
          - "CASCADE HOP 1 -> because this edition is now SUPERSEDED, every ComponentModel with certified_against_standard_id == this.id and certification_status == CERTIFIED gets certification_status = DECERTIFIED"
          - "CASCADE HOP 2 -> because those models are now DECERTIFIED, every ComponentPlacement whose component_model_id is one of them, whose status IN {DRAFT, VALIDATED}, and whose owning project's design_status IN {CONSULTATION, RENDERED, COMMUNITY_REVIEW, REVISION_REQUESTED, DESIGN_APPROVED, CERTIFIED, ORDERED} gets status = NEEDS_RECERTIFICATION"
          - "CASCADE HOP 3 -> because those placements now need recertification, every owning DesignProject gets compliance_status = RETROFIT_REQUIRED, and additionally any such project whose design_status IN {RENDERED, COMMUNITY_REVIEW, CERTIFIED} gets design_status = REVISION_REQUESTED (projects already in DESIGN_APPROVED keep their community sign-off and are NOT reverted)"
          - "CASCADE HOP 4 -> because those projects reverted to REVISION_REQUESTED, each of their DesignRendering rows with status == ISSUED gets status = SUPERSEDED and each of their Quote rows with status == ISSUED gets status = EXPIRED"
          - "recomputes PlayArea.critical_fall_height_cm and PlayArea.required_surfacing_depth_cm for every play area touched by hop 2 (NEEDS_RECERTIFICATION placements leave the DRAFT/VALIDATED input set)"
          - "increments version by 1 on this standard, the successor, and every entity mutated by hops 1-4"

  - entity: ComponentModel
    state_field: certification_status
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /playground/component-models/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "model.certification_status IN {UNCERTIFIED, DECERTIFIED}"
          - "body standard_id resolves to a PlaygroundStandard with status == ACTIVE (else ERR_STANDARD_NOT_ACTIVE)"
          - "model.deck_height_cm <= the standard's max_fall_height_cm for model.age_group (else ERR_FALL_HEIGHT_EXCEEDS_STANDARD)"
        side_effects:
          - "sets certification_status = CERTIFIED and certified_against_standard_id = standard_id"
          - "increments ComponentModel.version by 1"
      - from: CERTIFIED
        to: DECERTIFIED
        trigger: "system event: the standard in certified_against_standard_id is superseded (POST /playground/standards/{id}/supersede, cascade hop 1)"
        actor: system
        preconditions:
          - "model.certification_status == CERTIFIED"
          - "model.certified_against_standard_id == the standard being superseded"
        side_effects:
          - "sets certification_status = DECERTIFIED (certified_against_standard_id is retained as the historical pin)"
          - "increments ComponentModel.version by 1"
      - from: DECERTIFIED
        to: CERTIFIED
        trigger: "POST /playground/component-models/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "model.certification_status == DECERTIFIED"
          - "body standard_id resolves to a PlaygroundStandard with status == ACTIVE"
          - "model.deck_height_cm <= the standard's max_fall_height_cm for model.age_group"
        side_effects:
          - "sets certification_status = CERTIFIED and certified_against_standard_id = the new standard_id"
          - "increments ComponentModel.version by 1"
        note: "Recertification closes the DECERTIFIED -> CERTIFIED half of the model certification cycle."

  - entity: ComponentModel
    state_field: lifecycle_status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: LEGACY
        trigger: "POST /playground/component-models/{id}/lifecycle with lifecycle_status = LEGACY"
        actor: ManufacturerAdmin
        preconditions: ["model.lifecycle_status == ACTIVE"]
        side_effects:
          - "sets lifecycle_status = LEGACY; subsequent replacement-part sales of this model price in LEGACY_SURCHARGE_PCT"
          - "increments ComponentModel.version by 1"
      - from: LEGACY
        to: DISCONTINUED
        trigger: "POST /playground/component-models/{id}/lifecycle with lifecycle_status = DISCONTINUED"
        actor: ManufacturerAdmin
        preconditions: ["model.lifecycle_status == LEGACY"]
        side_effects:
          - "sets lifecycle_status = DISCONTINUED; the model may no longer be placed on new designs (ERR_MODEL_DISCONTINUED)"
          - "increments ComponentModel.version by 1"

  - entity: DesignProject
    state_field: design_status
    initial_state: DRAFT
    terminal_states: [AUDITED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONSULTATION
        trigger: "POST /playground/projects/{id}/start-consultation"
        actor: DesignConsultant
        preconditions:
          - "project.design_status == DRAFT"
          - "exactly one PlaygroundStandard has status == ACTIVE (else ERR_NO_ACTIVE_STANDARD)"
        side_effects:
          - "sets design_status = CONSULTATION; play areas and placements may now be created (project becomes editable)"
          - "increments DesignProject.version by 1"
      - from: CONSULTATION
        to: RENDERED
        trigger: "POST /playground/projects/{id}/renderings"
        actor: DesignConsultant
        preconditions:
          - "project.design_status IN {CONSULTATION, REVISION_REQUESTED}"
          - "for every age band in project.required_age_groups there is a PlayArea with that age_group"
          - "every PlayArea of the project has >= 1 ComponentPlacement with status IN {DRAFT, VALIDATED} (else ERR_PLAY_AREA_EMPTY)"
          - "body pinned_standard_id equals the id of the single ACTIVE PlaygroundStandard (else ERR_STANDARD_NOT_ACTIVE)"
          - "if project.accessible_route_required OR the ACTIVE standard's requires_accessible_route is true, then every PlayArea has >= 1 placement with status IN {DRAFT, VALIDATED} whose model.accessible_transfer_ready == true (else ERR_ACCESSIBLE_ROUTE_MISSING)"
        side_effects:
          - "creates a DesignRendering with status = ISSUED, round_number = previous max round_number + 1 (1 when none), use_zone_snapshot frozen from the project's play areas, pinned_standard_id frozen"
          - "sets any other DesignRendering of this project with status == ISSUED to status = SUPERSEDED"
          - "sets design_status = RENDERED"
          - "increments DesignProject.version by 1"
      - from: RENDERED
        to: COMMUNITY_REVIEW
        trigger: "POST /playground/renderings/{id}/community-votes"
        actor: ClientRepresentative
        preconditions:
          - "rendering.status == ISSUED"
          - "owning project.design_status IN {RENDERED, COMMUNITY_REVIEW}"
        side_effects:
          - "adds body yes_votes to rendering.yes_votes and body no_votes to rendering.no_votes"
          - "recomputes rendering.community_approval_pct via calculations.community_approval_pct"
          - "sets project.design_status = COMMUNITY_REVIEW (idempotent when already COMMUNITY_REVIEW)"
          - "increments DesignRendering.version and DesignProject.version by 1"
      - from: COMMUNITY_REVIEW
        to: DESIGN_APPROVED
        trigger: "POST /playground/renderings/{id}/close-review when rendering.community_approval_pct >= APPROVAL_THRESHOLD_PCT"
        actor: DesignConsultant
        preconditions:
          - "rendering.status == ISSUED and owning project.design_status == COMMUNITY_REVIEW"
          - "rendering.yes_votes + rendering.no_votes >= MIN_REVIEW_VOTES (else ERR_INSUFFICIENT_COMMUNITY_INPUT)"
          - "rendering.community_approval_pct >= 60.0"
        side_effects:
          - "sets project.design_status = DESIGN_APPROVED (rendering.status stays ISSUED so it can back a Quote)"
          - "increments DesignProject.version by 1"
      - from: COMMUNITY_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /playground/renderings/{id}/close-review when rendering.community_approval_pct < APPROVAL_THRESHOLD_PCT"
        actor: DesignConsultant
        preconditions:
          - "rendering.status == ISSUED and owning project.design_status == COMMUNITY_REVIEW"
          - "rendering.yes_votes + rendering.no_votes >= MIN_REVIEW_VOTES"
          - "rendering.community_approval_pct < 60.0"
        side_effects:
          - "sets rendering.status = WITHDRAWN"
          - "sets project.design_status = REVISION_REQUESTED and increments project.revision_rounds by 1"
          - "sets every Quote of the project with status == ISSUED to status = EXPIRED"
          - "increments DesignRendering.version and DesignProject.version by 1"
        note: "Divergent side-effect set versus the DESIGN_APPROVED branch of the same trigger: this branch withdraws the rendering, bumps revision_rounds and expires open quotes; the approval branch does none of those."
      - from: REVISION_REQUESTED
        to: RENDERED
        trigger: "POST /playground/projects/{id}/renderings"
        actor: DesignConsultant
        preconditions:
          - "project.design_status == REVISION_REQUESTED"
          - "same rendering preconditions as the CONSULTATION -> RENDERED transition"
        side_effects:
          - "same as the CONSULTATION -> RENDERED transition; the new rendering's round_number is previous max + 1"
        note: "Closes the revision cycle RENDERED -> COMMUNITY_REVIEW -> REVISION_REQUESTED -> RENDERED."
      - from: DESIGN_APPROVED
        to: CERTIFIED
        trigger: "POST /playground/projects/{id}/certify-compliance"
        actor: ComplianceOfficer
        preconditions:
          - "project.design_status == DESIGN_APPROVED"
          - "X-User-ID != project.consultant_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the project's DesignRendering with status == ISSUED has pinned_standard_id whose PlaygroundStandard.status == ACTIVE (else ERR_STANDARD_NOT_ACTIVE)"
          - "every ComponentPlacement of the project has status == VALIDATED (else ERR_PLACEMENTS_NOT_VALIDATED)"
          - "for every PlayArea: surfacing_depth_cm >= required_surfacing_depth_cm (else ERR_SURFACING_DEPTH_INSUFFICIENT)"
        side_effects:
          - "sets design_status = CERTIFIED and compliance_status = COMPLIANT"
          - "increments DesignProject.version by 1"
      - from: CERTIFIED
        to: ORDERED
        trigger: "POST /playground/orders"
        actor: DesignConsultant
        preconditions:
          - "project.design_status == CERTIFIED"
          - "body quote_id resolves to a Quote of this project with status == ACCEPTED and variant == FIRM (else ERR_QUOTE_NOT_ACCEPTED)"
          - "project.funds_collected_cents >= quote.total_cents (else ERR_FUNDING_SHORTFALL)"
        side_effects:
          - "creates a ManufacturingOrder with production_status = CREATED, kitting_status = PENDING, bagging_status = PENDING"
          - "sets design_status = ORDERED"
          - "sets every PlayArea of the project to status = LOCKED (placements can no longer be created, validated, deleted)"
          - "increments DesignProject.version by 1"
      - from: ORDERED
        to: INSTALLED
        trigger: "system event: POST /playground/installation-jobs/{id}/inspections with kind = INSTALL_INSPECTION and result = PASS"
        actor: system
        preconditions:
          - "project.design_status == ORDERED"
          - "the passing job's order_id belongs to this project's ManufacturingOrder"
        side_effects:
          - "sets design_status = INSTALLED and installed_on = the logical clock date (YYYY-MM-DD)"
          - "increments DesignProject.version by 1"
      - from: INSTALLED
        to: AUDITED
        trigger: "system event: POST /playground/installation-jobs/{id}/inspections with kind = POST_INSTALL_AUDIT and result = PASS"
        actor: system
        preconditions:
          - "project.design_status == INSTALLED"
        side_effects:
          - "sets design_status = AUDITED and compliance_status = COMPLIANT"
          - "increments DesignProject.version by 1"
      - from: CERTIFIED
        to: REVISION_REQUESTED
        trigger: "system event: POST /playground/standards/{id}/supersede (cascade hop 3)"
        actor: system
        preconditions:
          - "project.design_status IN {RENDERED, COMMUNITY_REVIEW, CERTIFIED}"
          - "at least one of the project's placements was moved to NEEDS_RECERTIFICATION by cascade hop 2"
        side_effects:
          - "sets design_status = REVISION_REQUESTED and compliance_status = RETROFIT_REQUIRED"
          - "increments DesignProject.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /playground/projects/{id}/cancel"
        actor: DesignConsultant
        preconditions:
          - "project.design_status IN {DRAFT, CONSULTATION, RENDERED, COMMUNITY_REVIEW, REVISION_REQUESTED, DESIGN_APPROVED, CERTIFIED, ORDERED} (else ERR_PROJECT_NOT_CANCELLABLE)"
        side_effects:
          - "sets design_status = CANCELLED"
          - "CASCADE HOP 1 -> because the project is CANCELLED, its ManufacturingOrder (if any) with production_status IN {CREATED, IN_PRODUCTION} gets production_status = CANCELLED"
          - "CASCADE HOP 2 -> because that order is CANCELLED, every InstallationJob of that order with status IN {SCHEDULED, IN_PROGRESS} gets status = CANCELLED"
          - "CASCADE HOP 3 -> because those jobs are CANCELLED, each affected CertifiedInstaller has committed_crew_days recomputed via calculations.installer_committed_crew_days"
          - "sets every FundraisingPledge of the project with status IN {PLEDGED, COLLECTED} to status = REFUNDED, then recomputes funds_collected_cents and the four allocation buckets (all become 0)"
          - "sets every Quote of the project with status == ISSUED to status = EXPIRED"
          - "increments version by 1 on the project and on every entity mutated by hops 1-3"
        note: "Applies from any non-terminal design_status; the from: value shown is representative."

  - entity: DesignProject
    state_field: compliance_status
    initial_state: NOT_ASSESSED
    terminal_states: []
    note: "Second, independent state dimension on DesignProject. It advances on its own triggers and can hold any value while design_status sits anywhere in its own axis, e.g. (design_status = DESIGN_APPROVED, compliance_status = RETROFIT_REQUIRED)."
    transitions:
      - from: NOT_ASSESSED
        to: COMPLIANT
        trigger: "POST /playground/projects/{id}/certify-compliance"
        actor: ComplianceOfficer
        preconditions: ["project.compliance_status IN {NOT_ASSESSED, RETROFIT_REQUIRED}"]
        side_effects: ["sets compliance_status = COMPLIANT"]
      - from: COMPLIANT
        to: RETROFIT_REQUIRED
        trigger: "system event: POST /playground/standards/{id}/supersede (cascade hop 3)"
        actor: system
        preconditions: ["at least one placement of the project moved to NEEDS_RECERTIFICATION"]
        side_effects: ["sets compliance_status = RETROFIT_REQUIRED"]
      - from: RETROFIT_REQUIRED
        to: COMPLIANT
        trigger: "system event: POST /playground/placements/{id}/retrofit clears the project's last NEEDS_RECERTIFICATION placement"
        actor: system
        preconditions:
          - "project.compliance_status == RETROFIT_REQUIRED"
          - "count of the project's placements with status == NEEDS_RECERTIFICATION becomes 0 after this retrofit"
        side_effects: ["sets compliance_status = COMPLIANT"]
      - from: COMPLIANT
        to: NON_COMPLIANT
        trigger: "system event: POST /playground/installation-jobs/{id}/inspections with kind = POST_INSTALL_AUDIT and result = FAIL (cascade hop 2)"
        actor: system
        preconditions: ["the failing job's order belongs to this project"]
        side_effects: ["sets compliance_status = NON_COMPLIANT"]
      - from: NON_COMPLIANT
        to: COMPLIANT
        trigger: "system event: POST /playground/installation-jobs/{id}/inspections with kind = POST_INSTALL_AUDIT and result = PASS"
        actor: system
        preconditions: ["project.compliance_status == NON_COMPLIANT"]
        side_effects: ["sets compliance_status = COMPLIANT"]

  - entity: PlayArea
    state_field: status
    initial_state: PLANNED
    terminal_states: [LOCKED]
    transitions:
      - from: PLANNED
        to: ZONED
        trigger: "system event: POST /playground/placements/{id}/validate moves the area's first placement to VALIDATED"
        actor: system
        preconditions: ["play_area.status == PLANNED"]
        side_effects: ["sets status = ZONED", "increments PlayArea.version by 1"]
      - from: ZONED
        to: LOCKED
        trigger: "system event: POST /playground/orders (project CERTIFIED -> ORDERED)"
        actor: system
        preconditions: ["owning project transitions to ORDERED"]
        side_effects: ["sets status = LOCKED; further placement create/validate/delete on this area is rejected with ERR_PLAY_AREA_LOCKED"]

  - entity: ComponentPlacement
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /playground/placements/{id}/validate"
        actor: DesignConsultant
        preconditions:
          - "placement.status == DRAFT (else ERR_PLACEMENT_INVALID_STATE)"
          - "owning project.design_status IN {CONSULTATION, REVISION_REQUESTED} (else ERR_PROJECT_NOT_EDITABLE)"
          - "owning play_area.status != LOCKED (else ERR_PLAY_AREA_LOCKED)"
          - "model.certification_status == CERTIFIED (else ERR_MODEL_NOT_CERTIFIED)"
          - "no other ComponentPlacement in the same play area with status == VALIDATED has a use-zone interval that overlaps this one, unless the two are directly attached (else ERR_USE_ZONE_OVERLAP)"
          - "if placement.attached_to_placement_id is set, that parent placement has status == VALIDATED (else ERR_PARENT_PLACEMENT_NOT_VALIDATED)"
        side_effects:
          - "sets status = VALIDATED"
          - "sets play_area.status = ZONED when it was PLANNED"
          - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
          - "increments ComponentPlacement.version, PlayArea.version by 1"
      - from: VALIDATED
        to: NEEDS_RECERTIFICATION
        trigger: "system event: POST /playground/standards/{id}/supersede (cascade hop 2)"
        actor: system
        preconditions:
          - "placement.status IN {DRAFT, VALIDATED}"
          - "placement.component_model_id was moved to DECERTIFIED by cascade hop 1"
        side_effects:
          - "sets status = NEEDS_RECERTIFICATION (leaves the DRAFT/VALIDATED pricing and fall-height input sets)"
          - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
          - "increments ComponentPlacement.version, PlayArea.version by 1"
      - from: NEEDS_RECERTIFICATION
        to: VALIDATED
        trigger: "POST /playground/placements/{id}/retrofit with a certified superseding model"
        actor: ClientRepresentative
        preconditions:
          - "placement.status == NEEDS_RECERTIFICATION"
          - "body replacement_model_id resolves to a ComponentModel whose supersedes_model_id == placement.component_model_id (else ERR_RETROFIT_MODEL_MISMATCH)"
          - "the replacement model's certification_status == CERTIFIED (else ERR_MODEL_NOT_CERTIFIED)"
          - "the logical clock year <= replacement model's parts_support_until_year (else ERR_PARTS_NO_LONGER_AVAILABLE)"
        side_effects:
          - "sets component_model_id = replacement_model_id, status = VALIDATED, retrofit_model_id / retrofit_quantity / retrofit_unit_price_cents / retrofit_handling_cents / retrofit_total_cents / legacy_surcharge_applied per calculations.replacement_retrofit_pricing"
          - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
          - "CASCADE -> when the owning project has no remaining placement with status == NEEDS_RECERTIFICATION, sets project.compliance_status = COMPLIANT"
          - "increments ComponentPlacement.version, PlayArea.version, DesignProject.version by 1"

  - entity: DesignRendering
    state_field: status
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system event: POST /playground/projects/{id}/renderings issues a newer rendering, or POST /playground/standards/{id}/supersede cascade hop 4"
        actor: system
        preconditions: ["rendering.status == ISSUED"]
        side_effects: ["sets status = SUPERSEDED", "increments DesignRendering.version by 1"]
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /playground/renderings/{id}/close-review on the below-threshold branch"
        actor: DesignConsultant
        preconditions: ["rendering.status == ISSUED", "rendering.community_approval_pct < 60.0"]
        side_effects: ["sets status = WITHDRAWN", "increments DesignRendering.version by 1"]

  - entity: Quote
    state_field: status
    initial_state: ISSUED
    terminal_states: [ACCEPTED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /playground/quotes/{id}/accept"
        actor: ClientRepresentative
        preconditions:
          - "quote.status == ISSUED"
          - "quote.variant == FIRM (else ERR_PROVISIONAL_QUOTE_NOT_ACCEPTABLE)"
          - "the logical clock date <= quote.valid_until (else ERR_QUOTE_EXPIRED)"
          - "the backing rendering.status == ISSUED (else ERR_RENDERING_NOT_ISSUED)"
        side_effects:
          - "sets status = ACCEPTED"
          - "sets every other Quote of the same project with status == ISSUED to status = EXPIRED"
          - "increments Quote.version by 1 on every quote touched"
      - from: ISSUED
        to: EXPIRED
        trigger: "system event: a newer Quote is issued for the project (POST /playground/quotes), a sibling quote is accepted, the review is closed below threshold, the project is cancelled, or standard-supersede cascade hop 4 fires"
        actor: system
        preconditions: ["quote.status == ISSUED"]
        side_effects: ["sets status = EXPIRED", "increments Quote.version by 1"]

  - entity: FundraisingPledge
    state_field: status
    initial_state: PLEDGED
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: COLLECTED
        trigger: "POST /playground/pledges/{id}/collect"
        actor: ClientRepresentative
        preconditions:
          - "pledge.status == PLEDGED"
          - "the logical clock date <= project.fundraising_deadline (else ERR_FUNDRAISING_DEADLINE_PASSED)"
          - "owning project.design_status NOT IN {CANCELLED, AUDITED} (else ERR_PROJECT_NOT_FUNDABLE)"
        side_effects:
          - "sets status = COLLECTED"
          - "recomputes project.funds_collected_cents and the four allocation buckets from scratch via calculations.fundraising_allocation"
          - "increments FundraisingPledge.version and DesignProject.version by 1"
      - from: COLLECTED
        to: REFUNDED
        trigger: "POST /playground/pledges/{id}/refund"
        actor: ClientRepresentative
        preconditions:
          - "pledge.status IN {PLEDGED, COLLECTED}"
          - "owning project.design_status NOT IN {ORDERED, INSTALLED, AUDITED} (else ERR_FUNDS_ALREADY_COMMITTED)"
        side_effects:
          - "sets status = REFUNDED (the compensating action for collect)"
          - "recomputes project.funds_collected_cents and the four allocation buckets from scratch, restoring them to their pre-collect values"
          - "increments FundraisingPledge.version and DesignProject.version by 1"
      - from: PLEDGED
        to: REFUNDED
        trigger: "POST /playground/pledges/{id}/refund, or system event: POST /playground/projects/{id}/cancel"
        actor: ClientRepresentative
        preconditions: ["pledge.status == PLEDGED"]
        side_effects:
          - "sets status = REFUNDED; funds_collected_cents is unchanged because a PLEDGED pledge never entered it"
          - "increments FundraisingPledge.version by 1"

  - entity: ManufacturingOrder
    state_field: production_status
    initial_state: CREATED
    terminal_states: [SHIPPED, CANCELLED]
    note: "Fork-join shape. The fork happens at IN_PRODUCTION, where the two independent prep dimensions kitting_status and bagging_status become writable and evolve in either order with divergent side-effect sets. The join into READY_TO_SHIP is a system transition that fires only when both dimensions reach DONE."
    transitions:
      - from: CREATED
        to: IN_PRODUCTION
        trigger: "POST /playground/orders/{id}/start-production"
        actor: ManufacturerAdmin
        preconditions:
          - "order.production_status == CREATED"
          - "the backing quote's project.design_status == ORDERED"
        side_effects:
          - "sets production_status = IN_PRODUCTION; kitting_status and bagging_status become writable (fork)"
          - "increments ManufacturingOrder.version by 1"
      - from: IN_PRODUCTION
        to: READY_TO_SHIP
        trigger: "system event: the second of kitting_status / bagging_status reaches DONE (join)"
        actor: system
        preconditions:
          - "order.production_status == IN_PRODUCTION"
          - "order.kitting_status == DONE AND order.bagging_status == DONE"
        side_effects:
          - "sets production_status = READY_TO_SHIP"
          - "sets instruction_package_revision = the backing rendering's round_number (written only here, by the join)"
          - "increments ManufacturingOrder.version by 1"
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /playground/orders/{id}/ship"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == READY_TO_SHIP"]
        side_effects:
          - "sets production_status = SHIPPED"
          - "increments ManufacturingOrder.version by 1"
      - from: CREATED
        to: CANCELLED
        trigger: "system event: POST /playground/projects/{id}/cancel (cascade hop 1)"
        actor: system
        preconditions: ["order.production_status IN {CREATED, IN_PRODUCTION}"]
        side_effects:
          - "sets production_status = CANCELLED"
          - "increments ManufacturingOrder.version by 1"

  - entity: ManufacturingOrder
    state_field: kitting_status
    initial_state: PENDING
    terminal_states: [DONE]
    note: "First parallel prep dimension. Independent of bagging_status: either may be advanced first, and advancing one never mutates the other."
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /playground/orders/{id}/kitting with kitting_status = IN_PROGRESS"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == IN_PRODUCTION (else ERR_ORDER_NOT_IN_PRODUCTION)", "order.kitting_status == PENDING"]
        side_effects: ["sets kitting_status = IN_PROGRESS", "increments ManufacturingOrder.version by 1"]
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /playground/orders/{id}/kitting with kitting_status = DONE"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == IN_PRODUCTION", "order.kitting_status IN {PENDING, IN_PROGRESS}"]
        side_effects:
          - "sets kitting_status = DONE"
          - "sets kit_line_count = count of the placements priced by the backing quote (the kitting branch writes ONLY this field)"
          - "fires the join into READY_TO_SHIP when bagging_status is already DONE"
          - "increments ManufacturingOrder.version by 1"
      - from: PENDING
        to: DONE
        trigger: "POST /playground/orders/{id}/kitting with kitting_status = DONE (fast path when no partial kitting was recorded)"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == IN_PRODUCTION", "order.kitting_status == PENDING"]
        side_effects: ["identical to the IN_PROGRESS -> DONE transition"]

  - entity: ManufacturingOrder
    state_field: bagging_status
    initial_state: PENDING
    terminal_states: [DONE]
    note: "Second parallel prep dimension, with a side-effect set disjoint from the kitting branch's."
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /playground/orders/{id}/hardware-bagging with bagging_status = IN_PROGRESS"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == IN_PRODUCTION", "order.bagging_status == PENDING"]
        side_effects: ["sets bagging_status = IN_PROGRESS", "increments ManufacturingOrder.version by 1"]
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /playground/orders/{id}/hardware-bagging with bagging_status = DONE"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == IN_PRODUCTION", "order.bagging_status IN {PENDING, IN_PROGRESS}"]
        side_effects:
          - "sets bagging_status = DONE"
          - "sets hardware_bag_total per calculations.hardware_bag_total (the bagging branch writes ONLY this field)"
          - "fires the join into READY_TO_SHIP when kitting_status is already DONE"
          - "increments ManufacturingOrder.version by 1"
      - from: PENDING
        to: DONE
        trigger: "POST /playground/orders/{id}/hardware-bagging with bagging_status = DONE (fast path)"
        actor: ManufacturerAdmin
        preconditions: ["order.production_status == IN_PRODUCTION", "order.bagging_status == PENDING"]
        side_effects: ["identical to the IN_PROGRESS -> DONE transition"]

  - entity: CertifiedInstaller
    state_field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /playground/installers/{id}/status with status = SUSPENDED (administrative suspension)"
        actor: ManufacturerAdmin
        preconditions: ["installer.status == ACTIVE"]
        side_effects:
          - "sets status = SUSPENDED"
          - "increments CertifiedInstaller.version by 1"
        note: "An ADMINISTRATIVE suspension deliberately does NOT cancel existing bookings; it only blocks new job creation and blocks SCHEDULED -> IN_PROGRESS. Contrast with the compliance suspension driven by the audit-failure cascade, which does cancel SCHEDULED and IN_PROGRESS jobs."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: POST /playground/installation-jobs/{id}/inspections POST_INSTALL_AUDIT FAIL pushes open_audit_failures to AUDIT_FAILURE_SUSPENSION_THRESHOLD (cascade hop 3)"
        actor: system
        preconditions:
          - "installer.status == ACTIVE"
          - "installer.open_audit_failures >= AUDIT_FAILURE_SUSPENSION_THRESHOLD after the increment, where AUDIT_FAILURE_SUSPENSION_THRESHOLD == 1 (a single failed post-installation audit compliance-suspends the installer)"
        side_effects:
          - "sets status = SUSPENDED (compliance suspension)"
          - "CASCADE HOP 4 -> because the installer is now compliance-suspended, every other InstallationJob of this installer with status IN {SCHEDULED, IN_PROGRESS} gets status = CANCELLED, and committed_crew_days is then recomputed"
          - "increments CertifiedInstaller.version by 1 and each cancelled job's version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /playground/installers/{id}/status with status = ACTIVE"
        actor: ManufacturerAdmin
        preconditions:
          - "installer.status == SUSPENDED"
          - "installer.open_audit_failures == 0 (else ERR_AUDIT_FAILURES_OPEN)"
        side_effects:
          - "sets status = ACTIVE; jobs cancelled by a prior compliance suspension are NOT resurrected"
          - "increments CertifiedInstaller.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle."
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /playground/installers/{id}/status with status = REVOKED"
        actor: ManufacturerAdmin
        preconditions: ["installer.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "sets status = REVOKED"
          - "every InstallationJob of this installer with status IN {SCHEDULED, IN_PROGRESS} gets status = CANCELLED, then committed_crew_days is recomputed"
          - "increments CertifiedInstaller.version by 1 and each cancelled job's version by 1"

  - entity: InstallationJob
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [AUDIT_PASSED, CANCELLED]
    note: "Cyclic shape: INSPECTION_PENDING -> INSPECTION_FAILED -> REWORK_IN_PROGRESS -> INSPECTION_PENDING, bounded by MAX_REWORK_CYCLES."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /playground/installation-jobs/{id}/start"
        actor: InstallerOperator
        preconditions:
          - "job.status == SCHEDULED"
          - "X-User-ID == job.installer_id (else ERR_NOT_JOB_OWNER)"
          - "installer.status == ACTIVE (else ERR_INSTALLER_NOT_ACTIVE)"
          - "installer.certification_expires_on >= the logical clock date (else ERR_INSTALLER_CERTIFICATION_EXPIRED)"
          - "the logical clock date >= job.scheduled_start_date (else ERR_JOB_NOT_YET_STARTABLE)"
        side_effects: ["sets status = IN_PROGRESS", "increments InstallationJob.version by 1"]
      - from: IN_PROGRESS
        to: INSPECTION_PENDING
        trigger: "POST /playground/installation-jobs/{id}/complete"
        actor: InstallerOperator
        preconditions: ["job.status == IN_PROGRESS", "X-User-ID == job.installer_id"]
        side_effects: ["sets status = INSPECTION_PENDING", "increments InstallationJob.version by 1"]
      - from: INSPECTION_PENDING
        to: AUDIT_PENDING
        trigger: "POST /playground/installation-jobs/{id}/inspections with kind = INSTALL_INSPECTION and result = PASS"
        actor: SafetyAuditor
        preconditions:
          - "job.status == INSPECTION_PENDING"
          - "inspection.surfacing_depth_measured_cm >= the max required_surfacing_depth_cm over the project's play areas (else ERR_SURFACING_DEPTH_INSUFFICIENT)"
        side_effects:
          - "creates an InstallationInspection with kind = INSTALL_INSPECTION, result = PASS, sequence_number = previous max + 1"
          - "sets job.install_inspector_user_id = X-User-ID when it is still null (this is what the audit segregation-of-duties check compares against)"
          - "sets status = AUDIT_PENDING"
          - "sets the owning project's design_status = INSTALLED and installed_on = the logical clock date"
          - "increments InstallationJob.version and DesignProject.version by 1"
      - from: INSPECTION_PENDING
        to: INSPECTION_FAILED
        trigger: "POST /playground/installation-jobs/{id}/inspections with kind = INSTALL_INSPECTION and result = FAIL"
        actor: SafetyAuditor
        preconditions: ["job.status == INSPECTION_PENDING"]
        side_effects:
          - "creates an InstallationInspection with result = FAIL"
          - "sets job.install_inspector_user_id = X-User-ID when it is still null"
          - "sets status = INSPECTION_FAILED and last_failed_inspection_kind = INSTALL_INSPECTION"
          - "increments InstallationJob.version by 1"
      - from: INSPECTION_FAILED
        to: REWORK_IN_PROGRESS
        trigger: "POST /playground/installation-jobs/{id}/rework with action = START"
        actor: InstallerOperator
        preconditions:
          - "job.status IN {INSPECTION_FAILED, AUDIT_FAILED}"
          - "X-User-ID == job.installer_id"
          - "job.rework_cycles < MAX_REWORK_CYCLES (else ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects: ["sets status = REWORK_IN_PROGRESS", "increments InstallationJob.version by 1"]
      - from: REWORK_IN_PROGRESS
        to: INSPECTION_PENDING
        trigger: "POST /playground/installation-jobs/{id}/rework with action = COMPLETE and last_failed_inspection_kind == INSTALL_INSPECTION"
        actor: InstallerOperator
        preconditions: ["job.status == REWORK_IN_PROGRESS", "X-User-ID == job.installer_id", "job.last_failed_inspection_kind == INSTALL_INSPECTION"]
        side_effects:
          - "sets status = INSPECTION_PENDING and increments rework_cycles by 1"
          - "increments InstallationJob.version by 1"
        note: "Closes the rework cycle. Conditional target: when last_failed_inspection_kind is POST_INSTALL_AUDIT the same trigger lands on AUDIT_PENDING instead."
      - from: REWORK_IN_PROGRESS
        to: AUDIT_PENDING
        trigger: "POST /playground/installation-jobs/{id}/rework with action = COMPLETE and last_failed_inspection_kind == POST_INSTALL_AUDIT"
        actor: InstallerOperator
        preconditions: ["job.status == REWORK_IN_PROGRESS", "X-User-ID == job.installer_id", "job.last_failed_inspection_kind == POST_INSTALL_AUDIT"]
        side_effects:
          - "sets status = AUDIT_PENDING and increments rework_cycles by 1"
          - "increments InstallationJob.version by 1"
      - from: AUDIT_PENDING
        to: AUDIT_PASSED
        trigger: "POST /playground/installation-jobs/{id}/inspections with kind = POST_INSTALL_AUDIT and result = PASS"
        actor: SafetyAuditor
        preconditions:
          - "job.status == AUDIT_PENDING"
          - "X-User-ID != job.install_inspector_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "creates an InstallationInspection with kind = POST_INSTALL_AUDIT, result = PASS"
          - "sets status = AUDIT_PASSED"
          - "sets the owning project's design_status = AUDITED and compliance_status = COMPLIANT"
          - "recomputes installer.committed_crew_days (AUDIT_PASSED leaves the committed set) and installer.open_audit_failures"
          - "increments InstallationJob.version, DesignProject.version and CertifiedInstaller.version by 1"
      - from: AUDIT_PENDING
        to: AUDIT_FAILED
        trigger: "POST /playground/installation-jobs/{id}/inspections with kind = POST_INSTALL_AUDIT and result = FAIL"
        actor: SafetyAuditor
        preconditions:
          - "job.status == AUDIT_PENDING"
          - "X-User-ID != job.install_inspector_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "creates an InstallationInspection with kind = POST_INSTALL_AUDIT, result = FAIL"
          - "CASCADE HOP 1 -> sets status = AUDIT_FAILED and last_failed_inspection_kind = POST_INSTALL_AUDIT"
          - "CASCADE HOP 2 -> because the job is now AUDIT_FAILED, the owning DesignProject gets compliance_status = NON_COMPLIANT"
          - "CASCADE HOP 3 -> because that project is now NON_COMPLIANT, the installer's open_audit_failures is incremented, and when it reaches AUDIT_FAILURE_SUSPENSION_THRESHOLD (1) the installer's status becomes SUSPENDED"
          - "CASCADE HOP 4 -> because the installer is now compliance-suspended, its other InstallationJob rows with status IN {SCHEDULED, IN_PROGRESS} get status = CANCELLED and committed_crew_days is recomputed"
          - "increments version by 1 on the job, project, installer and every cancelled sibling job"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /playground/installation-jobs/{id}/cancel, or system event (project cancel hop 2, compliance-suspension hop 4, installer revocation)"
        actor: DesignConsultant
        preconditions: ["job.status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects:
          - "sets status = CANCELLED (the compensating action for job creation)"
          - "recomputes installer.committed_crew_days, restoring it to its pre-creation value"
          - "increments InstallationJob.version and CertifiedInstaller.version by 1"

  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /playground/warranty-claims/{id}/decide with decision = APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.covered_pct > 0 (else ERR_WARRANTY_EXPIRED)"
        side_effects: ["sets status = APPROVED", "increments WarrantyClaim.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /playground/warranty-claims/{id}/decide with decision = DENIED"
        actor: ComplianceOfficer
        preconditions: ["claim.status == SUBMITTED"]
        side_effects: ["sets status = DENIED", "increments WarrantyClaim.version by 1"]

concurrency_rules:
  - rule_id: quote-create-stale-project
    parent_entity: DesignProject
    write_endpoint: "POST /playground/quotes"
    occ_field: "expected_project_version"
    description: |
      Issuing a Quote against a DesignProject whose version has advanced past the
      version the client last observed is rejected with a stale-version error. A new
      quote legitimately supersedes the project's prior ISSUED quote (see the Quote
      ISSUED -> EXPIRED transition), so a writer whose view of the project predates
      another writer's successful quote issuance would silently expire a quote it never
      saw. The OCC check on DesignProject.version turns that into a deterministic
      precondition failure.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: job-reschedule-stale-installer
    parent_entity: CertifiedInstaller
    write_endpoint: "POST /playground/installation-jobs/{id}/reschedule"
    occ_field: "expected_installer_version"
    description: |
      Rescheduling an InstallationJob into a new date window against a CertifiedInstaller
      whose version has advanced past the version the client last observed is rejected
      with a stale-version error. A reschedule legitimately supersedes the job's previous
      booking window and re-derives the installer's committed_crew_days, so a writer
      holding a stale view of the installer's booking book would compute the travel-buffer
      and crew-day checks against calendar occupancy that no longer exists. The OCC check
      on CertifiedInstaller.version makes the rejection deterministic.
    error_id: ERR_STALE_INSTALLER_VERSION
    http_status: 412

calculations:
  - name: quote_pricing
    trigger: "POST /playground/quotes (a quote's monetary fields are computed once at issue time and frozen thereafter)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — input set (variant-dependent, see variants:)
      placements = every ComponentPlacement whose PlayArea belongs to quote.project_id
                   AND whose status is in the variant's included_statuses,
                   ordered by created_at ASC (the only sanctioned ordering; never by id)
      if placements is empty: reject with ERR_QUOTE_EMPTY_SCOPE

      # Step 2 — per-line raw amount (exact rational arithmetic, no rounding yet)
      for each placement p (in created_at ASC order):
          model = ComponentModel[p.component_model_id]
          base_line = model.unit_price_cents * p.quantity
          if p.color_choice != model.color_options[0]:
              raw_line[p] = base_line * (1 + COLOR_UPLIFT_PCT)
          else:
              raw_line[p] = base_line

      # Step 3 — subtotal (ROUNDING POINT IS VARIANT-DEPENDENT, see variants:)
      #   PROVISIONAL: subtotal_cents = sum over p of round_half_up(raw_line[p])
      #   FIRM:        subtotal_cents = round_half_up(sum over p of raw_line[p])
      # The two orders differ by up to (line count - 1) cents on identical placement data.

      # Step 4 — freight
      priced_unit_count = sum over p of p.quantity
      freight_cents = FREIGHT_BASE_CENTS + FREIGHT_PER_UNIT_CENTS * priced_unit_count

      # Step 5 — volume discount; the tier is selected on subtotal_cents ALONE,
      #          never on subtotal + freight, and freight is never discounted
      if subtotal_cents >= DISCOUNT_TIER_2_MIN_CENTS:   pct = DISCOUNT_TIER_2_PCT
      elif subtotal_cents >= DISCOUNT_TIER_1_MIN_CENTS: pct = DISCOUNT_TIER_1_PCT
      else:                                             pct = 0
      discount_cents = round_half_up(subtotal_cents * pct)

      # Step 6
      total_cents = subtotal_cents + freight_cents - discount_cents
    input_set: "ComponentPlacement rows under the project's PlayAreas, filtered by the variant's included_statuses; NEEDS_RECERTIFICATION placements are never priced by either variant"
    constants:
      COLOR_UPLIFT_PCT: 0.07
      FREIGHT_BASE_CENTS: 48000
      FREIGHT_PER_UNIT_CENTS: 1250
      DISCOUNT_TIER_1_MIN_CENTS: 2000000
      DISCOUNT_TIER_1_PCT: 0.03
      DISCOUNT_TIER_2_MIN_CENTS: 5000000
      DISCOUNT_TIER_2_PCT: 0.06
    precision: "integer cents; round_half_up at exactly the variant's declared rounding point and at step 5"
    variants:
      - name: PROVISIONAL
        when: "quote.variant == PROVISIONAL — an early budgetary quote issued while the design is still being validated"
        difference: "included_statuses = {DRAFT, VALIDATED} (an unvalidated placement is still priced); step 3 rounds EACH line to whole cents and then sums the rounded lines"
      - name: FIRM
        when: "quote.variant == FIRM — the contractual quote a ManufacturingOrder may be raised against"
        difference: "included_statuses = {VALIDATED} only; step 3 sums the exact unrounded lines and rounds ONCE at the end. On a placement set where every placement is VALIDATED the two variants see identical input yet can differ: three lines whose exact values end in .5 give PROVISIONAL a subtotal one cent above FIRM's."

  - name: surfacing_depth_requirement
    trigger: "recomputed for a PlayArea on every ComponentPlacement create, validate, delete and retrofit under it, and read by the FIRM-quote and install-inspection surfacing checks"
    algorithm: threshold
    formula: |
      cfh = area.critical_fall_height_cm
            = max over the area's placements with status IN {DRAFT, VALIDATED} of
              ComponentModel[placement.component_model_id].deck_height_cm
            = 0 when that placement set is empty

      if cfh > MAX_CRITICAL_FALL_HEIGHT_CM: reject with ERR_FALL_HEIGHT_EXCEEDS_STANDARD

      # tier lookup on the material, by ascending fall-height band (<= comparison)
      if cfh == 0:
          base = 0                      # nothing to fall from; no attenuation band applies
      elif area.surfacing_material == ENGINEERED_WOOD_FIBER:
          base = 23 if cfh <= 150 else (30 if cfh <= 200 else 38)
      else:  # POURED_RUBBER
          base = 5  if cfh <= 150 else (8  if cfh <= 200 else 13)

      # the two uplifts are NOT additive: each is applied to the base independently and
      # the requirement is the largest of the candidates, floored at the absolute minimum
      toddler_candidate = base + (TODDLER_UPLIFT_CM if area.age_group == TODDLER_6_23M else 0)
      soil_candidate    = base + (CLAY_SOIL_UPLIFT_CM if project.site_soil_type == CLAY else 0)
      required_surfacing_depth_cm = max(toddler_candidate, soil_candidate, MIN_SURFACING_DEPTH_CM)
    input_set: "the PlayArea's own placements with status IN {DRAFT, VALIDATED}; NEEDS_RECERTIFICATION placements drop out of the fall-height maximum"
    constants:
      TODDLER_UPLIFT_CM: 5
      CLAY_SOIL_UPLIFT_CM: 3
      MIN_SURFACING_DEPTH_CM: 15
      MAX_CRITICAL_FALL_HEIGHT_CM: 305
    precision: "whole centimetres; no rounding (all terms are integers)"

  - name: use_zone_extent
    trigger: "on ComponentPlacement create and on POST /playground/placements/{id}/validate; writes use_zone_start_cm and use_zone_end_cm"
    algorithm: interval_merge
    formula: |
      model = ComponentModel[placement.component_model_id]
      use_zone_start_cm = placement.x_start_cm - model.use_zone_footprint_cm
      use_zone_end_cm   = placement.x_start_cm + model.use_zone_footprint_cm
                          + (SLIDE_EXIT_EXTRA_CM if model.category == PLASTIC_SLIDE else 0)

      # The interval is CLOSED on both ends: [use_zone_start_cm, use_zone_end_cm].
      # Two zones overlap iff a.start <= b.end AND b.start <= a.end, so zones that merely
      # touch at a single coordinate (a.end == b.start) DO overlap, while a one-centimetre
      # gap does not.
      # A pair is exempt from the overlap rule iff one placement is attached_to_placement_id
      # of the other (a slide bolted to its deck must overlap that deck's zone).
      # Cross-age-group pairs must additionally be separated by the active standard's
      # min_use_zone_clearance_cm: b.start - a.end - 1 >= min_use_zone_clearance_cm.
    input_set: "the single placement being written, plus every other placement with status == VALIDATED (same play area for the overlap comparison, other play areas of the same DesignProject for the cross-age-group clearance comparison); DRAFT and NEEDS_RECERTIFICATION placements are ignored by both comparisons"
    constants:
      SLIDE_EXIT_EXTRA_CM: 122
    precision: "whole centimetres; closed intervals on both ends"

  - name: community_approval_pct
    trigger: "POST /playground/renderings/{id}/community-votes; recomputed on every vote batch"
    algorithm: aggregation
    formula: |
      yes_votes = sum of every recorded yes vote batch for this rendering
      no_votes  = sum of every recorded no vote batch for this rendering
      total = yes_votes + no_votes
      community_approval_pct = 0.0 if total == 0
                               else round_half_up(100 * yes_votes / total, 1)

      # Review-closing gate (POST /playground/renderings/{id}/close-review):
      #   total >= MIN_REVIEW_VOTES  else ERR_INSUFFICIENT_COMMUNITY_INPUT
      # Once that gate passes, the comparison against APPROVAL_THRESHOLD_PCT selects the
      # branch rather than raising an error: >= 60.0 sends the project to DESIGN_APPROVED,
      # < 60.0 sends it to REVISION_REQUESTED. The comparison is INCLUSIVE: exactly 60.0
      # approves.
    input_set: "all vote batches recorded against the rendering while its status == ISSUED"
    constants:
      MIN_REVIEW_VOTES: 25
      APPROVAL_THRESHOLD_PCT: 60.0
    precision: "1 decimal place, round_half_up"

  - name: warranty_coverage
    trigger: "POST /playground/warranty-claims; writes elapsed_years, coverage_variant, covered_pct and reimbursement_cents once and freezes them"
    algorithm: decay_function
    formula: |
      model = ComponentModel[claim.component_model_id]      # frozen copy of the placement's model
      wy = model.warranty_years
      elapsed_years = floor((claim.failure_date - project.installed_on) in days / DAYS_PER_YEAR)

      # covered_pct is variant-dependent, see variants:
      #   PRORATED: covered_pct = 0 if elapsed_years >= wy
      #                           else round_half_up(100 * (wy - elapsed_years) / wy)
      #   STEP:     half = ceil(wy / 2)
      #             covered_pct = 100 if elapsed_years <= half
      #                           else (STEP_LATE_PCT if elapsed_years < wy else 0)

      reimbursement_cents = round_half_up(model.unit_price_cents * claim.quantity * covered_pct / 100)

      # A claim whose covered_pct == 0 is still CREATED (the record of the out-of-warranty
      # failure is kept); it is the APPROVED decision that is refused with ERR_WARRANTY_EXPIRED.
      # Replacement parts for the failed model may only be SOLD while
      # the logical clock year <= model.parts_support_until_year (ERR_PARTS_NO_LONGER_AVAILABLE),
      # which is an independent gate from warranty coverage.
    input_set: "the single WarrantyClaim being created, its frozen ComponentModel, and the owning project's installed_on"
    constants:
      DAYS_PER_YEAR: 365
      STEP_LATE_PCT: 50
    precision: "covered_pct is a whole percent; reimbursement_cents is integer cents, round_half_up"
    variants:
      - name: PRORATED
        when: "claim.claim_category IN {POST, DECK, METAL_CLIMBER} — structural steel and lumber components depreciate continuously"
        difference: "coverage declines one wy-th per elapsed year: a 10-year model claimed in elapsed year 3 covers 70%"
      - name: STEP
        when: "claim.claim_category IN {PLASTIC_SLIDE, HARDWARE_KIT} — rotomoulded plastics and fasteners are covered in full for the first half of the term"
        difference: "coverage is a step function: 100% through ceil(wy/2) elapsed years, then 50%, then 0%. On identical inputs (same warranty_years, same unit_price_cents, same elapsed_years) the two variants diverge: elapsed_years 3 on a 10-year 215450-cent model pays 150815 under PRORATED and 215450 under STEP."

  - name: fundraising_allocation
    trigger: "POST /playground/pledges/{id}/collect and POST /playground/pledges/{id}/refund; the four alloc_* fields are FULLY RECOMPUTED from scratch on every call, never incrementally patched"
    algorithm: waterfall_allocation
    formula: |
      funds_collected_cents = sum of amount_cents over this project's pledges with status == COLLECTED
      quote = the project's most recently created Quote with status IN {ISSUED, ACCEPTED}
              (created_at ASC ordering, take the last); when none exists every bucket is 0
              and alloc_contingency_cents absorbs the whole collected amount

      # bucket targets, in strict fill order
      target_1 = quote.freight_cents                                    # PERMIT_AND_FREIGHT
      target_2 = round_half_up(quote.subtotal_cents * SURFACING_SHARE_PCT)  # SURFACING
      target_3 = quote.subtotal_cents - target_2                        # STRUCTURE
      # STRUCTURE's target is whatever the equipment subtotal has left after surfacing,
      # so target_2 + target_3 == quote.subtotal_cents exactly, with no rounding remainder.
      # CONTINGENCY has no target; it absorbs everything left over.

      remaining = funds_collected_cents
      alloc_permit_freight_cents = min(remaining, target_1); remaining -= alloc_permit_freight_cents
      alloc_surfacing_cents      = min(remaining, target_2); remaining -= alloc_surfacing_cents
      alloc_structure_cents      = min(remaining, target_3); remaining -= alloc_structure_cents
      alloc_contingency_cents    = remaining

      # INVARIANT (checked after every collect and every refund):
      #   alloc_permit_freight_cents + alloc_surfacing_cents
      #     + alloc_structure_cents + alloc_contingency_cents == funds_collected_cents
      # Refunding a collected pledge therefore drains the buckets in reverse fill order
      # purely as a consequence of the full recompute.
    input_set: "FundraisingPledge rows of this project with status == COLLECTED; the project's latest ISSUED-or-ACCEPTED Quote supplies the bucket targets"
    constants:
      SURFACING_SHARE_PCT: 0.20
    precision: "integer cents; round_half_up on target_2 only; every allocation is exact"

  - name: installer_committed_crew_days
    trigger: "recomputed on InstallationJob create, reschedule, cancel, start, inspection outcome and on any CertifiedInstaller status change"
    algorithm: aggregation
    formula: |
      committed_crew_days =
        sum over every InstallationJob j with j.installer_id == installer.id
            AND j.status NOT IN EXCLUDED_STATUSES
        of j.booked_crew_days
      where j.booked_crew_days = j.crew_size * (days_inclusive(j.scheduled_start_date, j.scheduled_end_date))
            and days_inclusive(a, b) = (b - a) in days + 1   # the interval is closed on both ends

      # Booking admission checks on POST /playground/installation-jobs and .../reschedule,
      # evaluated against the installer's OTHER jobs whose status is not in EXCLUDED_STATUSES:
      #   (1) date-interval overlap: closed intervals [start, end] must not intersect
      #       -> ERR_INSTALLER_BOOKING_CONFLICT
      #   (2) travel buffer: the new interval must leave TRAVEL_BUFFER_DAYS fully clear
      #       calendar day(s) after any earlier job and before any later one, i.e.
      #       new.start >= other.end + 1 + TRAVEL_BUFFER_DAYS
      #       -> ERR_INSTALLER_BOOKING_CONFLICT
      #   (3) crew capacity: crew_size <= installer.crew_capacity_per_day
      #       -> ERR_CREW_CAPACITY_EXCEEDED
      # Cancelling a job is the exact compensating action for creating it: the recompute
      # restores committed_crew_days to its pre-creation value with no drift.
    input_set: "InstallationJob rows of this installer with status NOT IN {AUDIT_PASSED, AUDIT_FAILED, CANCELLED} (a finished or cancelled job no longer occupies the calendar)"
    constants:
      EXCLUDED_STATUSES: "AUDIT_PASSED, AUDIT_FAILED, CANCELLED"
      TRAVEL_BUFFER_DAYS: 1
    precision: "whole crew-days; closed date intervals counted inclusively"

  - name: hardware_bag_total
    trigger: "POST /playground/orders/{id}/hardware-bagging with bagging_status = DONE; written only by that branch"
    algorithm: aggregation
    formula: |
      quote = Quote[order.quote_id]
      placements = the placement set the quote priced, i.e. every ComponentPlacement under
                   the quote's project whose status == VALIDATED (the quote is always FIRM),
                   ordered created_at ASC
      hardware_bag_total = sum over p of
                           ComponentModel[p.component_model_id].hardware_bag_count * p.quantity

      # The sibling kitting branch instead writes kit_line_count = count(placements),
      # so the two parallel prep dimensions touch disjoint fields.
    input_set: "VALIDATED ComponentPlacement rows under the ordered quote's project"
    constants: {}
    precision: "whole bags; no rounding"

  - name: replacement_retrofit_pricing
    trigger: "POST /playground/placements/{id}/retrofit; writes retrofit_unit_price_cents, retrofit_handling_cents, retrofit_total_cents and legacy_surcharge_applied"
    algorithm: threshold
    formula: |
      model = ComponentModel[request.replacement_model_id]

      # (a) legacy surcharge — older-system parts cost more to source
      if model.lifecycle_status == LEGACY:
          retrofit_unit_price_cents = model.unit_price_cents
                                      + round_half_up(model.unit_price_cents * LEGACY_SURCHARGE_PCT)
          legacy_surcharge_applied = true
      else:
          retrofit_unit_price_cents = model.unit_price_cents
          legacy_surcharge_applied = false

      # (b) line amount
      line_cents = retrofit_unit_price_cents * request.quantity

      # (c) handling waiver — THE WAIVER IS EVALUATED ON line_cents, BEFORE handling is
      #     added, and never on the resulting total. A line of 247000 with a 3500 handling
      #     charge totals 250500, which is above the threshold, yet handling still applies
      #     because the decision was made on 247000. A line of exactly 250000 waives.
      retrofit_handling_cents = 0 if line_cents >= FREE_HANDLING_LINE_THRESHOLD_CENTS
                                  else HANDLING_BASE_CENTS

      retrofit_total_cents = line_cents + retrofit_handling_cents

      # Eligibility gates, checked before pricing:
      #   logical clock year <= model.parts_support_until_year  else ERR_PARTS_NO_LONGER_AVAILABLE
      #   replacement_model_id == placement.component_model_id
      #     OR model.supersedes_model_id == placement.component_model_id
      #                                                          else ERR_RETROFIT_MODEL_MISMATCH
    input_set: "the single ComponentPlacement being retrofitted and the requested replacement ComponentModel"
    constants:
      LEGACY_SURCHARGE_PCT: 0.18
      HANDLING_BASE_CENTS: 3500
      FREE_HANDLING_LINE_THRESHOLD_CENTS: 250000
    precision: "integer cents; round_half_up on the surcharge only"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 10
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 12
    category: auth
    check: "on installer-driven job operations (start, complete, rework) the acting InstallerOperator's X-User-ID equals job.installer_id"
    error_id: ERR_NOT_JOB_OWNER
    http_status: 403
    applies_to: "POST /playground/installation-jobs/{id}/start, /complete, /rework"

  - priority: 14
    category: auth
    check: "the ComplianceOfficer certifying a project's compliance must not be the DesignConsultant that created it: X-User-ID != project.consultant_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /playground/projects/{id}/certify-compliance"

  - priority: 15
    category: auth
    check: "the SafetyAuditor filing a POST_INSTALL_AUDIT must not be the auditor recorded in job.install_inspector_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /playground/installation-jobs/{id}/inspections (kind = POST_INSTALL_AUDIT)"

  - priority: 20
    category: existence
    check: "every {id} path segment resolves to an existing row, validated left-to-right along the path"
    error_id: "ERR_<ENTITY>_NOT_FOUND (per §1.6: ERR_STANDARD_NOT_FOUND, ERR_MODEL_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_PLAY_AREA_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_RENDERING_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_PLEDGE_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_INSTALLER_NOT_FOUND, ERR_JOB_NOT_FOUND, ERR_CLAIM_NOT_FOUND)"
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 22
    category: existence
    check: "every FK supplied in a request body resolves to an existing row (component_model_id, attached_to_placement_id, pinned_standard_id, rendering_id, project_id, quote_id, installer_id, order_id, placement_id, replacement_model_id, successor_standard_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND (same catalog as priority 20)"
    http_status: 404
    applies_to: "all write endpoints carrying FK inputs"

  - priority: 25
    category: state
    check: "request body shape: required fields present, types correct, enum members valid, string lengths and numeric ranges within each field's declared constraints, unknown fields ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 26
    category: state
    check: "limit is an integer in 1..100 and offset is an integer >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 30
    category: state
    check: "OCC: the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_PROJECT_VERSION / ERR_STALE_INSTALLER_VERSION"
    http_status: 412
    applies_to: "POST /playground/quotes, POST /playground/installation-jobs/{id}/reschedule"

  - priority: 40
    category: state
    check: "the target row's state field permits the requested transition (per §1.2); a trigger fired from a state with no matching transition, or fired twice, is rejected"
    error_id: "the transition's declared state error (ERR_STANDARD_NOT_DRAFT, ERR_STANDARD_NOT_ACTIVE, ERR_MODEL_NOT_CERTIFIABLE, ERR_PROJECT_NOT_EDITABLE, ERR_PROJECT_INVALID_STATE, ERR_PLACEMENT_INVALID_STATE, ERR_RENDERING_NOT_ISSUED, ERR_QUOTE_NOT_ACCEPTED, ERR_ORDER_INVALID_STATE, ERR_ORDER_NOT_IN_PRODUCTION, ERR_JOB_INVALID_STATE, ERR_PLEDGE_INVALID_STATE, ERR_CLAIM_INVALID_STATE, ERR_INSTALLER_INVALID_STATE)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 42
    category: state
    check: "design content may only be mutated while project.design_status IN {CONSULTATION, REVISION_REQUESTED}"
    error_id: ERR_PROJECT_NOT_EDITABLE
    http_status: 409
    applies_to: "POST/DELETE on play areas and placements, POST /playground/placements/{id}/validate"

  - priority: 43
    category: state
    check: "a PlayArea with status == LOCKED (its project reached ORDERED) accepts no further placement writes"
    error_id: ERR_PLAY_AREA_LOCKED
    http_status: 409
    applies_to: "POST /playground/play-areas/{id}/placements, DELETE /playground/placements/{id}"

  - priority: 44
    category: business_referential
    check: "cross-entity state gates: the placed ComponentModel must be CERTIFIED (ERR_MODEL_NOT_CERTIFIED) and not DISCONTINUED (ERR_MODEL_DISCONTINUED); an attachment parent must be a placement in the same PlayArea with status == VALIDATED (ERR_PARENT_PLACEMENT_NOT_VALIDATED); a quote's rendering must be ISSUED (ERR_RENDERING_NOT_ISSUED); an order's quote must be an ACCEPTED FIRM quote (ERR_QUOTE_NOT_ACCEPTED, ERR_PROVISIONAL_QUOTE_NOT_ACCEPTABLE); a job's installer must be ACTIVE (ERR_INSTALLER_NOT_ACTIVE); a rendering's pinned standard must still be the ACTIVE edition when compliance is certified (ERR_STANDARD_NOT_ACTIVE)"
    error_id: "as listed in the check"
    http_status: 409
    applies_to: "placement create/validate, quote create, order create, job create/start, project certify-compliance"

  - priority: 45
    category: business_referential
    check: "at most one PlaygroundStandard may be ACTIVE: activating a DRAFT edition while another is ACTIVE is rejected"
    error_id: ERR_ACTIVE_STANDARD_EXISTS
    http_status: 409
    applies_to: "POST /playground/standards/{id}/activate"

  - priority: 46
    category: business_referential
    check: "operations that must resolve 'the ACTIVE standard' fail when no edition is ACTIVE"
    error_id: ERR_NO_ACTIVE_STANDARD
    http_status: 409
    applies_to: "POST /playground/component-models/{id}/certify, POST /playground/play-areas/{id}/placements, POST /playground/projects/{id}/renderings"

  - priority: 47
    category: business_referential
    check: "a supersede request's successor edition must be status == DRAFT (ERR_SUCCESSOR_NOT_DRAFT) and its effective_from must be <= the logical clock date (ERR_SUCCESSOR_NOT_EFFECTIVE)"
    error_id: "ERR_SUCCESSOR_NOT_DRAFT / ERR_SUCCESSOR_NOT_EFFECTIVE"
    http_status: 409
    applies_to: "POST /playground/standards/{id}/supersede"

  - priority: 48
    category: business_referential
    check: "a rendering may only be issued when every PlayArea required by project.required_age_groups exists and every PlayArea holds at least one placement with status IN {DRAFT, VALIDATED}"
    error_id: "ERR_AGE_GROUP_COVERAGE_INCOMPLETE / ERR_PLAY_AREA_EMPTY"
    http_status: 409
    applies_to: "POST /playground/projects/{id}/renderings"

  - priority: 50
    category: business_safety
    check: "a placement's model deck_height_cm must not exceed the ACTIVE standard's max_fall_height_cm_<age_group> for the owning area's age group"
    error_id: ERR_FALL_HEIGHT_EXCEEDS_STANDARD
    http_status: 422
    applies_to: "POST /playground/play-areas/{id}/placements, POST /playground/placements/{id}/retrofit"

  - priority: 52
    category: business_safety
    check: "use zones of placements belonging to PlayAreas of different age groups must be separated by at least standard.min_use_zone_clearance_cm clear centimetres"
    error_id: ERR_AGE_GROUP_SEPARATION_VIOLATION
    http_status: 409
    applies_to: "POST /playground/placements/{id}/validate"

  - priority: 53
    category: business_safety
    check: "a placement's model age_group must equal the owning PlayArea's age_group"
    error_id: ERR_AGE_GROUP_MISMATCH
    http_status: 422
    applies_to: "POST /playground/play-areas/{id}/placements, POST /playground/placements/{id}/retrofit"

  - priority: 54
    category: business_safety
    check: "area.surfacing_depth_cm must be >= area.required_surfacing_depth_cm for every play area of the project (checked when a FIRM quote is issued and when an INSTALL_INSPECTION is filed, where the measured depth is compared instead)"
    error_id: ERR_SURFACING_DEPTH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /playground/quotes (variant FIRM), POST /playground/installation-jobs/{id}/inspections"

  - priority: 56
    category: business_safety
    check: "when project.accessible_route_required or standard.requires_accessible_route is true, every PlayArea must hold at least one placement whose model has accessible_transfer_ready == true"
    error_id: ERR_ACCESSIBLE_ROUTE_MISSING
    http_status: 422
    applies_to: "POST /playground/quotes (variant FIRM), POST /playground/projects/{id}/certify-compliance"

  - priority: 58
    category: business_constraint
    check: "job.rework_cycles must be < MAX_REWORK_CYCLES (2) before a rework may be started"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /playground/installation-jobs/{id}/rework (action = START)"

  - priority: 60
    category: business_constraint
    check: "the validated placement's closed use-zone interval must not intersect the use-zone interval of any other placement with status == VALIDATED in the same play area, unless the two are in an attachment parent/child relationship (DRAFT placements are ignored by the overlap comparison, so validation order matters)"
    error_id: ERR_USE_ZONE_OVERLAP
    http_status: 409
    applies_to: "POST /playground/placements/{id}/validate"

  - priority: 61
    category: business_constraint
    check: "the placement's use-zone interval must lie inside its PlayArea's half-open axis interval [axis_origin_cm, axis_origin_cm + axis_length_cm)"
    error_id: ERR_USE_ZONE_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /playground/play-areas/{id}/placements"

  - priority: 63
    category: business_constraint
    check: "attachment direction must respect the catalogue: PLASTIC_SLIDE and METAL_CLIMBER attach to a DECK, DECK attaches to a POST, POST and HARDWARE_KIT attach to nothing"
    error_id: ERR_INVALID_ATTACHMENT_TARGET
    http_status: 422
    applies_to: "POST /playground/play-areas/{id}/placements"

  - priority: 64
    category: business_temporal
    check: "the job's closed date interval must not intersect any other non-excluded job of the same installer, and must leave TRAVEL_BUFFER_DAYS (1) fully clear calendar day between consecutive bookings"
    error_id: ERR_INSTALLER_BOOKING_CONFLICT
    http_status: 409
    applies_to: "POST /playground/installation-jobs, POST /playground/installation-jobs/{id}/reschedule"

  - priority: 65
    category: business_constraint
    check: "crew_size must not exceed installer.crew_capacity_per_day"
    error_id: ERR_CREW_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /playground/installation-jobs, POST /playground/installation-jobs/{id}/reschedule"

  - priority: 66
    category: business_constraint
    check: "installer.certified_categories must cover every ComponentModel.category present in the ordered quote's priced placements"
    error_id: ERR_INSTALLER_CATEGORY_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /playground/installation-jobs"

  - priority: 67
    category: business_constraint
    check: "closing a community review requires yes_votes + no_votes >= MIN_REVIEW_VOTES (25); the approval percentage then selects the DESIGN_APPROVED or REVISION_REQUESTED branch and is never itself an error"
    error_id: ERR_INSUFFICIENT_COMMUNITY_INPUT
    http_status: 422
    applies_to: "POST /playground/renderings/{id}/close-review"

  - priority: 68
    category: business_temporal
    check: "a pledge may only be collected while the logical clock date <= project.fundraising_deadline"
    error_id: ERR_FUNDRAISING_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /playground/pledges/{id}/collect"

  - priority: 69
    category: business_temporal
    check: "a quote may only be accepted while the logical clock date <= quote.valid_until"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /playground/quotes/{id}/accept"

  - priority: 70
    category: business_temporal
    check: "replacement parts may only be sold while the logical clock year <= model.parts_support_until_year"
    error_id: ERR_PARTS_NO_LONGER_AVAILABLE
    http_status: 409
    applies_to: "POST /playground/placements/{id}/retrofit"

  - priority: 71
    category: business_temporal
    check: "an installer may only start a job while installer.certification_expires_on >= the logical clock date, and only on or after job.scheduled_start_date"
    error_id: "ERR_INSTALLER_CERTIFICATION_EXPIRED / ERR_JOB_NOT_YET_STARTABLE"
    http_status: 409
    applies_to: "POST /playground/installation-jobs/{id}/start"

  - priority: 72
    category: business_referential
    check: "a retrofit's replacement_model_id must be the placement's own model or a model whose supersedes_model_id is the placement's model"
    error_id: ERR_RETROFIT_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /playground/placements/{id}/retrofit"

  - priority: 74
    category: business_referential
    check: "a warranty claim's placement_id must belong to a PlayArea of the claim's project_id, and the project must have installed_on set"
    error_id: "ERR_WARRANTY_PLACEMENT_MISMATCH / ERR_PROJECT_NOT_INSTALLED"
    http_status: 422
    applies_to: "POST /playground/warranty-claims"

  - priority: 75
    category: business_temporal
    check: "failure_date must be >= project.installed_on and <= the logical clock date"
    error_id: ERR_INVALID_FAILURE_DATE
    http_status: 422
    applies_to: "POST /playground/warranty-claims"

  - priority: 76
    category: business_referential
    check: "a quote's rendering_id must belong to the quote's project_id"
    error_id: ERR_RENDERING_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /playground/quotes"

  - priority: 78
    category: business_constraint
    check: "a FIRM quote must price at least one placement; an empty VALIDATED placement set is rejected"
    error_id: ERR_QUOTE_EMPTY_SCOPE
    http_status: 422
    applies_to: "POST /playground/quotes"

  - priority: 79
    category: business_constraint
    check: "an order may only be raised from a quote whose project has design_status == CERTIFIED, and every placement the quote priced must still be VALIDATED (none demoted to NEEDS_RECERTIFICATION)"
    error_id: ERR_PLACEMENTS_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /playground/orders"

  - priority: 80
    category: business_fiscal
    check: "a FIRM quote's total_cents must not exceed project.budget_cents (fiscal checks run after every safety and constraint check)"
    error_id: ERR_QUOTE_EXCEEDS_BUDGET
    http_status: 422
    applies_to: "POST /playground/quotes (variant FIRM)"

  - priority: 82
    category: business_fiscal
    check: "an order may only be raised when project.funds_collected_cents >= quote.total_cents"
    error_id: ERR_FUNDING_SHORTFALL
    http_status: 402
    applies_to: "POST /playground/orders"

  - priority: 83
    category: business_fiscal
    check: "a collected pledge may not be refunded once the project has reached ORDERED (its funds are committed)"
    error_id: ERR_FUNDS_ALREADY_COMMITTED
    http_status: 409
    applies_to: "POST /playground/pledges/{id}/refund"

  - priority: 84
    category: business_fiscal
    check: "a claim may only be APPROVED when covered_pct > 0"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /playground/warranty-claims/{id}/decide"

  - priority: 85
    category: business_constraint
    check: "an installer may only be reinstated to ACTIVE while open_audit_failures == 0"
    error_id: ERR_AUDIT_FAILURES_OPEN
    http_status: 409
    applies_to: "POST /playground/installers/{id}/status (status = ACTIVE)"

  - priority: 86
    category: business_constraint
    check: "a project may only be cancelled while design_status NOT IN {INSTALLED, AUDITED, CANCELLED}, and may only accept pledges while NOT IN {CANCELLED, INSTALLED, AUDITED}"
    error_id: "ERR_PROJECT_NOT_CANCELLABLE / ERR_PROJECT_NOT_FUNDABLE"
    http_status: 409
    applies_to: "POST /playground/projects/{id}/cancel, POST /playground/projects/{id}/pledges"

  - priority: 88
    category: business_temporal
    check: "the requested logical clock instant must not move time backwards past any recorded installed_on date"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 422
    applies_to: "POST /playground/_clock/set_current_utc"

endpoints:
  # ---------------------------------------------------------------- standards
  - method: POST
    path: "/playground/standards"
    description: "Register a new playground safety standard edition; it starts in DRAFT and must be activated before it governs anything"
    roles: [ManufacturerAdmin, ComplianceOfficer]
    code: 201
    input: [code, edition_year, effective_from, min_use_zone_clearance_cm, max_fall_height_cm_toddler, max_fall_height_cm_preschool, max_fall_height_cm_school_age, "requires_accessible_route?"]
    output: PlaygroundStandard
    side_effects: ["creates a PlaygroundStandard with status = DRAFT and superseded_by_standard_id = null"]

  - method: GET
    path: "/playground/standards"
    description: "List standard editions; superseded_by_standard_id filters the editions that were superseded by a given edition (FK reverse lookup)"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["status?", "code?", "superseded_by_standard_id?", "limit?", "offset?"]
    output: PlaygroundStandard[]
    side_effects: []

  - method: GET
    path: "/playground/standards/{id}"
    description: "Fetch one standard edition"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: PlaygroundStandard
    side_effects: []

  - method: POST
    path: "/playground/standards/{id}/activate"
    description: "Activate a DRAFT edition; rejected while any other edition is ACTIVE, so exactly one edition governs at a time"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PlaygroundStandard
    side_effects: ["sets status = ACTIVE", "increments PlaygroundStandard.version by 1"]

  - method: POST
    path: "/playground/standards/{id}/supersede"
    description: "Supersede the ACTIVE edition with a DRAFT successor, firing the five-hop compliance cascade over models, placements, projects, renderings and quotes"
    roles: [ComplianceOfficer]
    code: 200
    input: [successor_standard_id]
    output: PlaygroundStandard
    side_effects:
      - "sets this edition status = SUPERSEDED and superseded_by_standard_id = successor_standard_id; atomically sets the successor status = ACTIVE"
      - "CASCADE HOP 1: every ComponentModel with certified_against_standard_id == this edition and certification_status == CERTIFIED becomes DECERTIFIED"
      - "CASCADE HOP 2: every ComponentPlacement of those models with status IN {DRAFT, VALIDATED} becomes NEEDS_RECERTIFICATION; owning play areas recompute critical_fall_height_cm and required_surfacing_depth_cm"
      - "CASCADE HOP 3: owning DesignProjects get compliance_status = RETROFIT_REQUIRED, and those with design_status IN {RENDERED, COMMUNITY_REVIEW, CERTIFIED} additionally get design_status = REVISION_REQUESTED"
      - "CASCADE HOP 4: for exactly those projects whose design_status was reverted to REVISION_REQUESTED by hop 3, their ISSUED DesignRenderings become SUPERSEDED and their ISSUED Quotes become EXPIRED; a project already in DESIGN_APPROVED keeps its ISSUED rendering, which now pins a SUPERSEDED edition, so its later compliance certification fails with ERR_STANDARD_NOT_ACTIVE"
      - "increments version by 1 on every row touched"

  # ---------------------------------------------------------- component models
  - method: POST
    path: "/playground/component-models"
    description: "Add a catalogue component model (post, deck, plastic slide, metal climber or hardware kit) with its color options and warranty terms"
    roles: [ManufacturerAdmin]
    code: 201
    input: [sku, category, age_group, deck_height_cm, use_zone_footprint_cm, color_options, unit_price_cents, hardware_bag_count, warranty_years, parts_support_until_year, "accessible_transfer_ready?", "supersedes_model_id?"]
    output: ComponentModel
    side_effects: ["creates a ComponentModel with certification_status = UNCERTIFIED and lifecycle_status = ACTIVE"]

  - method: GET
    path: "/playground/component-models"
    description: "List catalogue models; supersedes_model_id and certified_against_standard_id are FK reverse lookups"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["category?", "age_group?", "certification_status?", "lifecycle_status?", "supersedes_model_id?", "certified_against_standard_id?", "limit?", "offset?"]
    output: ComponentModel[]
    side_effects: []

  - method: GET
    path: "/playground/component-models/{id}"
    description: "Fetch one catalogue model"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: ComponentModel
    side_effects: []

  - method: POST
    path: "/playground/component-models/{id}/certify"
    description: "Certify (or re-certify a DECERTIFIED) model against the single ACTIVE standard edition"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComponentModel
    side_effects: ["sets certification_status = CERTIFIED and certified_against_standard_id = the ACTIVE edition's id", "increments ComponentModel.version by 1"]

  - method: POST
    path: "/playground/component-models/{id}/lifecycle"
    description: "Move a model along its commercial lifecycle (ACTIVE -> LEGACY -> DISCONTINUED); LEGACY models carry the replacement-part surcharge"
    roles: [ManufacturerAdmin]
    code: 200
    input: [lifecycle_status]
    output: ComponentModel
    side_effects: ["sets lifecycle_status", "increments ComponentModel.version by 1"]

  # ----------------------------------------------------------------- projects
  - method: POST
    path: "/playground/projects"
    description: "Open a design consultation project for a client site, recording site constraints, budget, fundraising deadline and the age groups that must be served"
    roles: [DesignConsultant]
    code: 201
    input: [client_name, site_length_cm, site_width_cm, site_soil_type, budget_cents, fundraising_deadline, required_age_groups, "accessible_route_required?"]
    output: DesignProject
    side_effects: ["creates a DesignProject with design_status = DRAFT, compliance_status = NOT_ASSESSED and consultant_user_id = X-User-ID"]

  - method: GET
    path: "/playground/projects"
    description: "List design projects"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["design_status?", "compliance_status?", "limit?", "offset?"]
    output: DesignProject[]
    side_effects: []

  - method: GET
    path: "/playground/projects/{id}"
    description: "Fetch one design project, including funds_collected_cents and the four waterfall allocation buckets"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: DesignProject
    side_effects: []

  - method: POST
    path: "/playground/projects/{id}/start-consultation"
    description: "Move a DRAFT project into CONSULTATION, making play areas and placements editable"
    roles: [DesignConsultant]
    code: 200
    input: []
    output: DesignProject
    side_effects: ["sets design_status = CONSULTATION", "increments DesignProject.version by 1"]

  - method: POST
    path: "/playground/projects/{id}/play-areas"
    description: "Carve out an age-separated play area on the site axis and specify its protective surfacing"
    roles: [DesignConsultant]
    code: 201
    input: [age_group, axis_origin_cm, axis_length_cm, surfacing_material, surfacing_depth_cm]
    output: PlayArea
    side_effects: ["creates a PlayArea with status = PLANNED, critical_fall_height_cm = 0 and required_surfacing_depth_cm = 15", "increments DesignProject.version by 1"]

  - method: GET
    path: "/playground/projects/{id}/play-areas"
    description: "List the play areas of a project (FK reverse lookup for PlayArea.project_id)"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["age_group?", "limit?", "offset?"]
    output: PlayArea[]
    side_effects: []

  - method: POST
    path: "/playground/projects/{id}/renderings"
    description: "Issue a design rendering pinned to the ACTIVE standard edition, freezing a use-zone snapshot for community review"
    roles: [DesignConsultant]
    code: 201
    input: [pinned_standard_id]
    output: DesignRendering
    side_effects:
      - "creates a DesignRendering with status = ISSUED and round_number = previous max + 1"
      - "supersedes any other ISSUED rendering of the project"
      - "sets project.design_status = RENDERED"
      - "increments DesignProject.version by 1"

  - method: GET
    path: "/playground/projects/{id}/renderings"
    description: "List the renderings of a project (FK reverse lookup for DesignRendering.project_id)"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DesignRendering[]
    side_effects: []

  - method: POST
    path: "/playground/projects/{id}/certify-compliance"
    description: "Certify the approved design against the pinned standard edition; the certifying ComplianceOfficer may not be the project's own consultant"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DesignProject
    side_effects: ["sets design_status = CERTIFIED and compliance_status = COMPLIANT", "increments DesignProject.version by 1"]

  - method: POST
    path: "/playground/projects/{id}/cancel"
    description: "Cancel a project, cascading to its order, that order's jobs, the installer crew-day ledger and every outstanding pledge"
    roles: [DesignConsultant]
    code: 200
    input: []
    output: DesignProject
    side_effects:
      - "sets design_status = CANCELLED"
      - "CASCADE HOP 1: the project's ManufacturingOrder with production_status IN {CREATED, IN_PRODUCTION} becomes CANCELLED"
      - "CASCADE HOP 2: that order's InstallationJobs with status IN {SCHEDULED, IN_PROGRESS} become CANCELLED"
      - "CASCADE HOP 3: each affected CertifiedInstaller's committed_crew_days is recomputed"
      - "every FundraisingPledge with status IN {PLEDGED, COLLECTED} becomes REFUNDED and the four allocation buckets and funds_collected_cents are recomputed to 0"
      - "every ISSUED Quote becomes EXPIRED"
      - "increments version by 1 on every row touched"

  - method: POST
    path: "/playground/projects/{id}/pledges"
    description: "Record a community fundraising pledge against a project"
    roles: [ClientRepresentative, DesignConsultant]
    code: 201
    input: [amount_cents, pledged_at]
    output: FundraisingPledge
    side_effects: ["creates a FundraisingPledge with status = PLEDGED (funds_collected_cents is untouched until collection)"]

  - method: GET
    path: "/playground/projects/{id}/pledges"
    description: "List the pledges of a project (FK reverse lookup for FundraisingPledge.project_id)"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FundraisingPledge[]
    side_effects: []

  # --------------------------------------------------- play areas & placements
  - method: GET
    path: "/playground/play-areas/{id}"
    description: "Fetch one play area, including its computed critical_fall_height_cm and required_surfacing_depth_cm"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: PlayArea
    side_effects: []

  - method: POST
    path: "/playground/play-areas/{id}/placements"
    description: "Place a catalogue component in a play area, computing its use-zone interval and the area's surfacing requirement; the placement starts in DRAFT"
    roles: [DesignConsultant]
    code: 201
    input: [component_model_id, color_choice, x_start_cm, quantity, "attached_to_placement_id?"]
    output: ComponentPlacement
    side_effects:
      - "creates a ComponentPlacement with status = DRAFT and use_zone_start_cm / use_zone_end_cm per calculations.use_zone_extent"
      - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
      - "increments PlayArea.version by 1"

  - method: GET
    path: "/playground/play-areas/{id}/placements"
    description: "List the placements of a play area (FK reverse lookup for ComponentPlacement.play_area_id)"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComponentPlacement[]
    side_effects: []

  - method: GET
    path: "/playground/placements"
    description: "List placements across the catalogue; play_area_id, component_model_id, attached_to_placement_id and retrofit_model_id are FK reverse lookups"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["play_area_id?", "component_model_id?", "attached_to_placement_id?", "retrofit_model_id?", "status?", "limit?", "offset?"]
    output: ComponentPlacement[]
    side_effects: []

  - method: GET
    path: "/playground/placements/{id}"
    description: "Fetch one placement, including its use-zone interval and the pricing of its most recent retrofit/replacement order"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: ComponentPlacement
    side_effects: []

  - method: POST
    path: "/playground/placements/{id}/validate"
    description: "Validate a DRAFT placement against the ACTIVE standard: use-zone overlap, age-group separation, attachment integrity and model certification are all checked here"
    roles: [DesignConsultant]
    code: 200
    input: []
    output: ComponentPlacement
    side_effects:
      - "sets status = VALIDATED"
      - "sets play_area.status = ZONED when it was PLANNED"
      - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
      - "increments ComponentPlacement.version and PlayArea.version by 1"

  - method: POST
    path: "/playground/placements/{id}/retrofit"
    description: "Buy a replacement part or retrofit the placement to a superseding model, pricing the legacy surcharge and the handling waiver; a compliance retrofit returns a NEEDS_RECERTIFICATION placement to VALIDATED"
    roles: [ClientRepresentative, DesignConsultant]
    code: 200
    input: [replacement_model_id, quantity]
    output: ComponentPlacement
    side_effects:
      - "writes retrofit_model_id, retrofit_quantity, retrofit_unit_price_cents, retrofit_handling_cents, retrofit_total_cents and legacy_surcharge_applied per calculations.replacement_retrofit_pricing"
      - "when the placement was NEEDS_RECERTIFICATION and the replacement supersedes its model: sets component_model_id = replacement_model_id and status = VALIDATED"
      - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
      - "sets project.compliance_status = COMPLIANT once the project holds no remaining NEEDS_RECERTIFICATION placement"
      - "increments ComponentPlacement.version, PlayArea.version and DesignProject.version by 1"

  - method: DELETE
    path: "/playground/placements/{id}"
    description: "Remove a placement from an editable, unlocked play area"
    roles: [DesignConsultant]
    code: 204
    input: []
    output: null
    side_effects:
      - "deletes the ComponentPlacement and clears attached_to_placement_id on any child placement"
      - "recomputes play_area.critical_fall_height_cm and play_area.required_surfacing_depth_cm"
      - "increments PlayArea.version by 1"

  # --------------------------------------------------------------- renderings
  - method: GET
    path: "/playground/renderings"
    description: "List renderings; project_id and pinned_standard_id are FK reverse lookups"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["project_id?", "pinned_standard_id?", "status?", "limit?", "offset?"]
    output: DesignRendering[]
    side_effects: []

  - method: GET
    path: "/playground/renderings/{id}"
    description: "Fetch one rendering, including its frozen use_zone_snapshot and community vote tallies"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: DesignRendering
    side_effects: []

  - method: POST
    path: "/playground/renderings/{id}/community-votes"
    description: "Record a batch of community yes/no votes against an ISSUED rendering and recompute its approval percentage"
    roles: [ClientRepresentative]
    code: 200
    input: [yes_votes, no_votes]
    output: DesignRendering
    side_effects:
      - "adds the batch to rendering.yes_votes / rendering.no_votes and recomputes community_approval_pct"
      - "sets project.design_status = COMMUNITY_REVIEW"
      - "increments DesignRendering.version and DesignProject.version by 1"

  - method: POST
    path: "/playground/renderings/{id}/close-review"
    description: "Close the community review round; at or above 60.0% approval the project is DESIGN_APPROVED, below it the rendering is withdrawn and a revision round is opened"
    roles: [DesignConsultant]
    code: 200
    input: []
    output: DesignProject
    side_effects:
      - "APPROVE BRANCH (community_approval_pct >= 60.0): sets project.design_status = DESIGN_APPROVED and leaves the rendering ISSUED"
      - "REVISE BRANCH (community_approval_pct < 60.0): sets rendering.status = WITHDRAWN, project.design_status = REVISION_REQUESTED, increments project.revision_rounds, and expires the project's ISSUED quotes"
      - "increments version by 1 on every row touched"

  # -------------------------------------------------------------------- quotes
  - method: POST
    path: "/playground/quotes"
    description: "Issue a PROVISIONAL or FIRM quote against an ISSUED rendering; expected_project_version is the version of the DesignProject the client last observed"
    roles: [DesignConsultant]
    code: 201
    input: [project_id, rendering_id, variant, valid_until, expected_project_version]
    output: Quote
    side_effects:
      - "creates a Quote with status = ISSUED and subtotal_cents / freight_cents / discount_cents / total_cents / priced_unit_count per calculations.quote_pricing"
      - "expires any other ISSUED Quote of the project"
      - "increments DesignProject.version by 1"

  - method: GET
    path: "/playground/quotes"
    description: "List quotes; project_id and rendering_id are FK reverse lookups"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative]
    code: 200
    input: ["project_id?", "rendering_id?", "status?", "variant?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: GET
    path: "/playground/quotes/{id}"
    description: "Fetch one quote with its frozen pricing"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/playground/quotes/{id}/accept"
    description: "Accept a FIRM quote before it expires; sibling ISSUED quotes are expired"
    roles: [ClientRepresentative]
    code: 200
    input: []
    output: Quote
    side_effects: ["sets status = ACCEPTED and expires the project's other ISSUED quotes", "increments Quote.version by 1 on every quote touched"]

  # ------------------------------------------------------------------ pledges
  - method: GET
    path: "/playground/pledges/{id}"
    description: "Fetch one fundraising pledge"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative]
    code: 200
    input: []
    output: FundraisingPledge
    side_effects: []

  - method: POST
    path: "/playground/pledges/{id}/collect"
    description: "Collect a pledge before the fundraising deadline, recomputing the project's funds and the four waterfall allocation buckets from scratch"
    roles: [ClientRepresentative]
    code: 200
    input: []
    output: FundraisingPledge
    side_effects:
      - "sets status = COLLECTED"
      - "recomputes project.funds_collected_cents and alloc_permit_freight_cents / alloc_surfacing_cents / alloc_structure_cents / alloc_contingency_cents per calculations.fundraising_allocation"
      - "increments FundraisingPledge.version and DesignProject.version by 1"

  - method: POST
    path: "/playground/pledges/{id}/refund"
    description: "Refund a pledge (the compensating action for collection), recomputing the project's funds and allocation buckets from scratch"
    roles: [ClientRepresentative]
    code: 200
    input: []
    output: FundraisingPledge
    side_effects:
      - "sets status = REFUNDED"
      - "recomputes project.funds_collected_cents and the four allocation buckets, restoring their pre-collect values exactly"
      - "increments FundraisingPledge.version and DesignProject.version by 1"

  # ------------------------------------------------------- manufacturing orders
  - method: POST
    path: "/playground/orders"
    description: "Raise a manufacturing order from an ACCEPTED FIRM quote once the community funds cover it; locks the project's play areas"
    roles: [DesignConsultant]
    code: 201
    input: [quote_id]
    output: ManufacturingOrder
    side_effects:
      - "creates a ManufacturingOrder with production_status = CREATED, kitting_status = PENDING, bagging_status = PENDING"
      - "sets project.design_status = ORDERED and every PlayArea of the project to status = LOCKED"
      - "increments DesignProject.version and each PlayArea.version by 1"

  - method: GET
    path: "/playground/orders"
    description: "List manufacturing orders; quote_id is an FK reverse lookup"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator]
    code: 200
    input: ["quote_id?", "production_status?", "kitting_status?", "bagging_status?", "limit?", "offset?"]
    output: ManufacturingOrder[]
    side_effects: []

  - method: GET
    path: "/playground/orders/{id}"
    description: "Fetch one manufacturing order with both prep dimensions, kit_line_count, hardware_bag_total and instruction_package_revision"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator]
    code: 200
    input: []
    output: ManufacturingOrder
    side_effects: []

  - method: POST
    path: "/playground/orders/{id}/start-production"
    description: "Start production, forking the independent kitting and hardware-bagging prep dimensions"
    roles: [ManufacturerAdmin]
    code: 200
    input: []
    output: ManufacturingOrder
    side_effects: ["sets production_status = IN_PRODUCTION", "increments ManufacturingOrder.version by 1"]

  - method: POST
    path: "/playground/orders/{id}/kitting"
    description: "Advance the kitting prep dimension; reaching DONE writes kit_line_count and, when bagging is already DONE, fires the join into READY_TO_SHIP"
    roles: [ManufacturerAdmin]
    code: 200
    input: [kitting_status]
    output: ManufacturingOrder
    side_effects:
      - "sets kitting_status; on DONE also sets kit_line_count"
      - "on DONE with bagging_status == DONE: sets production_status = READY_TO_SHIP and instruction_package_revision = the backing rendering's round_number"
      - "increments ManufacturingOrder.version by 1"

  - method: POST
    path: "/playground/orders/{id}/hardware-bagging"
    description: "Advance the hardware-bagging prep dimension; reaching DONE writes hardware_bag_total and, when kitting is already DONE, fires the join into READY_TO_SHIP"
    roles: [ManufacturerAdmin]
    code: 200
    input: [bagging_status]
    output: ManufacturingOrder
    side_effects:
      - "sets bagging_status; on DONE also sets hardware_bag_total per calculations.hardware_bag_total"
      - "on DONE with kitting_status == DONE: sets production_status = READY_TO_SHIP and instruction_package_revision = the backing rendering's round_number"
      - "increments ManufacturingOrder.version by 1"

  - method: POST
    path: "/playground/orders/{id}/ship"
    description: "Ship a READY_TO_SHIP order together with its installation instruction package"
    roles: [ManufacturerAdmin]
    code: 200
    input: []
    output: ManufacturingOrder
    side_effects: ["sets production_status = SHIPPED", "increments ManufacturingOrder.version by 1"]

  # -------------------------------------------------------- installer network
  - method: POST
    path: "/playground/installers"
    description: "Admit a company to the certified installer network with its crew capacity and certified component categories"
    roles: [ManufacturerAdmin]
    code: 201
    input: [company_name, certification_level, certified_categories, crew_capacity_per_day, certification_expires_on, region_code]
    output: CertifiedInstaller
    side_effects: ["creates a CertifiedInstaller with status = ACTIVE, committed_crew_days = 0 and open_audit_failures = 0"]

  - method: GET
    path: "/playground/installers"
    description: "List certified installers with their committed crew-day ledger"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, SafetyAuditor, InstallerOperator]
    code: 200
    input: ["status?", "region_code?", "certification_level?", "limit?", "offset?"]
    output: CertifiedInstaller[]
    side_effects: []

  - method: GET
    path: "/playground/installers/{id}"
    description: "Fetch one certified installer, including committed_crew_days and open_audit_failures"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, SafetyAuditor, InstallerOperator]
    code: 200
    input: []
    output: CertifiedInstaller
    side_effects: []

  - method: POST
    path: "/playground/installers/{id}/status"
    description: "Administratively suspend, reinstate or revoke an installer. An administrative SUSPENDED does not cancel existing bookings (only the audit-failure cascade and REVOKED do)"
    roles: [ManufacturerAdmin]
    code: 200
    input: [status]
    output: CertifiedInstaller
    side_effects:
      - "sets status"
      - "on REVOKED: cancels the installer's SCHEDULED and IN_PROGRESS jobs and recomputes committed_crew_days"
      - "increments CertifiedInstaller.version by 1 (and each cancelled job's version)"

  # ------------------------------------------------------- installation jobs
  - method: POST
    path: "/playground/installation-jobs"
    description: "Book a certified installer for a phased installation window; enforces booking overlap, the one clear travel day, crew capacity and category certification"
    roles: [DesignConsultant]
    code: 201
    input: [order_id, installer_id, scheduled_start_date, scheduled_end_date, crew_size]
    output: InstallationJob
    side_effects:
      - "creates an InstallationJob with status = SCHEDULED and booked_crew_days = crew_size * inclusive day count"
      - "recomputes installer.committed_crew_days per calculations.installer_committed_crew_days"
      - "increments CertifiedInstaller.version by 1"

  - method: GET
    path: "/playground/installation-jobs"
    description: "List installation jobs; order_id and installer_id are FK reverse lookups"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["order_id?", "installer_id?", "status?", "limit?", "offset?"]
    output: InstallationJob[]
    side_effects: []

  - method: GET
    path: "/playground/installation-jobs/{id}"
    description: "Fetch one installation job with its rework counter and booked crew days"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: []
    output: InstallationJob
    side_effects: []

  - method: POST
    path: "/playground/installation-jobs/{id}/reschedule"
    description: "Move a SCHEDULED job to a new window; expected_installer_version is the version of the CertifiedInstaller the client last observed"
    roles: [DesignConsultant]
    code: 200
    input: [scheduled_start_date, scheduled_end_date, expected_installer_version, "crew_size?"]
    output: InstallationJob
    side_effects:
      - "rewrites the booking window and booked_crew_days"
      - "recomputes installer.committed_crew_days"
      - "increments InstallationJob.version and CertifiedInstaller.version by 1"

  - method: POST
    path: "/playground/installation-jobs/{id}/start"
    description: "Installer starts its own booked job on or after the scheduled start date"
    roles: [InstallerOperator]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["sets status = IN_PROGRESS", "increments InstallationJob.version by 1"]

  - method: POST
    path: "/playground/installation-jobs/{id}/complete"
    description: "Installer reports the installation finished and hands it to inspection"
    roles: [InstallerOperator]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["sets status = INSPECTION_PENDING", "increments InstallationJob.version by 1"]

  - method: POST
    path: "/playground/installation-jobs/{id}/rework"
    description: "Start or complete a rework cycle after a failed inspection or audit; COMPLETE returns to whichever check failed, bounded by MAX_REWORK_CYCLES"
    roles: [InstallerOperator]
    code: 200
    input: [action]
    output: InstallationJob
    side_effects:
      - "action START: sets status = REWORK_IN_PROGRESS"
      - "action COMPLETE: increments rework_cycles and sets status = INSPECTION_PENDING or AUDIT_PENDING according to last_failed_inspection_kind"
      - "increments InstallationJob.version by 1"

  - method: POST
    path: "/playground/installation-jobs/{id}/cancel"
    description: "Cancel a booked or in-progress job, releasing the installer's committed crew days"
    roles: [DesignConsultant]
    code: 200
    input: []
    output: InstallationJob
    side_effects:
      - "sets status = CANCELLED"
      - "recomputes installer.committed_crew_days back to its pre-booking value"
      - "increments InstallationJob.version and CertifiedInstaller.version by 1"

  - method: POST
    path: "/playground/installation-jobs/{id}/inspections"
    description: "File an installation inspection or a post-installation safety audit; the audit must be filed by a different SafetyAuditor than the installation inspection, and a failed audit fires the four-hop compliance cascade"
    roles: [SafetyAuditor]
    code: 201
    input: [kind, result, deficiency_count, fall_height_measured_cm, surfacing_depth_measured_cm]
    output: InstallationInspection
    side_effects:
      - "creates an immutable InstallationInspection with sequence_number = previous max + 1 and performed_by_user_id = X-User-ID"
      - "INSTALL_INSPECTION PASS: job -> AUDIT_PENDING, project -> INSTALLED with installed_on set from the logical clock; records install_inspector_user_id"
      - "INSTALL_INSPECTION FAIL: job -> INSPECTION_FAILED with last_failed_inspection_kind = INSTALL_INSPECTION"
      - "POST_INSTALL_AUDIT PASS: job -> AUDIT_PASSED, project -> AUDITED and COMPLIANT, installer ledger recomputed"
      - "POST_INSTALL_AUDIT FAIL: fires the cascade job -> AUDIT_FAILED, project -> NON_COMPLIANT, installer -> SUSPENDED at the failure threshold, that installer's other SCHEDULED/IN_PROGRESS jobs -> CANCELLED"
      - "increments version by 1 on every mutable row touched"

  - method: GET
    path: "/playground/installation-jobs/{id}/inspections"
    description: "List a job's append-only inspection log in sequence_number order (FK reverse lookup for InstallationInspection.job_id)"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: ["kind?", "result?", "limit?", "offset?"]
    output: InstallationInspection[]
    side_effects: []

  # ---------------------------------------------------------- warranty claims
  - method: POST
    path: "/playground/warranty-claims"
    description: "File a warranty claim against an installed placement; the coverage variant, elapsed years, covered percentage and reimbursement are computed once and frozen"
    roles: [ClientRepresentative, ComplianceOfficer]
    code: 201
    input: [project_id, placement_id, quantity, failure_date]
    output: WarrantyClaim
    side_effects: ["creates a WarrantyClaim with status = SUBMITTED and the frozen outputs of calculations.warranty_coverage"]

  - method: GET
    path: "/playground/warranty-claims"
    description: "List warranty claims; project_id, placement_id and component_model_id are FK reverse lookups"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative]
    code: 200
    input: ["project_id?", "placement_id?", "component_model_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/playground/warranty-claims/{id}"
    description: "Fetch one warranty claim with its frozen coverage computation"
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/playground/warranty-claims/{id}/decide"
    description: "Approve or deny a submitted claim; approval is refused once coverage has decayed to 0%"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: WarrantyClaim
    side_effects: ["sets status = APPROVED or DENIED", "increments WarrantyClaim.version by 1"]

  # ------------------------------------------------------- test-driving surface
  - method: POST
    path: "/playground/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to an explicit ISO-8601 UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and MUST NOT fall back to real wall-clock time. Every deadline, expiry, warranty-elapsed and booking-window rule reads this clock."
    roles: [ManufacturerAdmin, ComplianceOfficer, DesignConsultant, ClientRepresentative, InstallerOperator, SafetyAuditor]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["sets the logical clock; no business rows are mutated"]

errors:
  # ---- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or naming a role outside §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_JOB_OWNER
    http: 403
    condition: "an InstallerOperator acts on an InstallationJob whose installer_id is not its own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ComplianceOfficer certifying a project is its own consultant, or the SafetyAuditor filing the post-installation audit already filed that job's installation inspection"

  # ---- existence
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: "no PlaygroundStandard with the given id (path or successor_standard_id / pinned_standard_id body field)"
  - id: ERR_MODEL_NOT_FOUND
    http: 404
    condition: "no ComponentModel with the given id (path, component_model_id, supersedes_model_id or replacement_model_id)"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no DesignProject with the given id"
  - id: ERR_PLAY_AREA_NOT_FOUND
    http: 404
    condition: "no PlayArea with the given id"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "no ComponentPlacement with the given id (path, attached_to_placement_id or placement_id)"
  - id: ERR_RENDERING_NOT_FOUND
    http: 404
    condition: "no DesignRendering with the given id"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "no Quote with the given id"
  - id: ERR_PLEDGE_NOT_FOUND
    http: 404
    condition: "no FundraisingPledge with the given id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no ManufacturingOrder with the given id"
  - id: ERR_INSTALLER_NOT_FOUND
    http: 404
    condition: "no CertifiedInstaller with the given id"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "no InstallationJob with the given id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no WarrantyClaim with the given id"

  # ---- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, enum value outside the declared set, or a value outside a declared numeric/length constraint"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset < 0 on a list endpoint"

  # ---- optimistic concurrency (§1.2.1)
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version on POST /playground/quotes does not equal the DesignProject's current version"
  - id: ERR_STALE_INSTALLER_VERSION
    http: 412
    condition: "expected_installer_version on POST /playground/installation-jobs/{id}/reschedule does not equal the CertifiedInstaller's current version"

  # ---- state preconditions
  - id: ERR_STANDARD_NOT_DRAFT
    http: 409
    condition: "activating a PlaygroundStandard whose status is not DRAFT"
  - id: ERR_STANDARD_NOT_ACTIVE
    http: 409
    condition: "superseding an edition that is not ACTIVE, pinning a rendering to a non-ACTIVE edition, or certifying compliance while the rendering's pinned edition is no longer ACTIVE"
  - id: ERR_ACTIVE_STANDARD_EXISTS
    http: 409
    condition: "activating a DRAFT edition while another edition is already ACTIVE"
  - id: ERR_NO_ACTIVE_STANDARD
    http: 409
    condition: "an operation that must resolve the single ACTIVE edition runs while no edition is ACTIVE"
  - id: ERR_SUCCESSOR_NOT_DRAFT
    http: 409
    condition: "the successor_standard_id of a supersede request is not in status DRAFT"
  - id: ERR_SUCCESSOR_NOT_EFFECTIVE
    http: 409
    condition: "the successor edition's effective_from is later than the logical clock date"
  - id: ERR_MODEL_NOT_CERTIFIABLE
    http: 409
    condition: "certifying a ComponentModel whose certification_status is already CERTIFIED, or whose lifecycle_status is DISCONTINUED"
  - id: ERR_MODEL_NOT_CERTIFIED
    http: 409
    condition: "placing or validating a ComponentModel whose certification_status is not CERTIFIED, or retrofitting to an uncertified replacement model"
  - id: ERR_MODEL_DISCONTINUED
    http: 409
    condition: "placing a ComponentModel whose lifecycle_status is DISCONTINUED"
  - id: ERR_PLACEMENT_INVALID_STATE
    http: 409
    condition: "a placement-level trigger fired from a status that declares no such transition, for example validating a placement that is already VALIDATED or is NEEDS_RECERTIFICATION"
  - id: ERR_PROJECT_INVALID_STATE
    http: 409
    condition: "a project-level trigger fired from a design_status that declares no such transition (including firing the same trigger twice)"
  - id: ERR_PROJECT_NOT_EDITABLE
    http: 409
    condition: "mutating design content while project.design_status is outside {CONSULTATION, REVISION_REQUESTED}"
  - id: ERR_PROJECT_NOT_CANCELLABLE
    http: 409
    condition: "cancelling a project whose design_status is INSTALLED, AUDITED or already CANCELLED"
  - id: ERR_PROJECT_NOT_FUNDABLE
    http: 409
    condition: "pledging to or collecting for a project whose design_status is CANCELLED, INSTALLED or AUDITED"
  - id: ERR_PROJECT_NOT_INSTALLED
    http: 422
    condition: "filing a warranty claim against a project whose installed_on is still null"
  - id: ERR_PLAY_AREA_LOCKED
    http: 409
    condition: "creating, validating or deleting a placement inside a PlayArea whose status is LOCKED"
  - id: ERR_PLAY_AREA_EMPTY
    http: 409
    condition: "issuing a rendering while some PlayArea of the project holds no placement with status IN {DRAFT, VALIDATED}"
  - id: ERR_AGE_GROUP_COVERAGE_INCOMPLETE
    http: 409
    condition: "issuing a rendering while some age band in project.required_age_groups has no PlayArea"
  - id: ERR_PARENT_PLACEMENT_NOT_VALIDATED
    http: 409
    condition: "validating a placement whose attachment parent is not itself VALIDATED"
  - id: ERR_PLACEMENTS_NOT_VALIDATED
    http: 409
    condition: "certifying compliance or raising an order while some placement of the project is not VALIDATED (e.g. left in DRAFT or demoted to NEEDS_RECERTIFICATION)"
  - id: ERR_RENDERING_NOT_ISSUED
    http: 409
    condition: "quoting against, voting on, closing the review of, or accepting a quote backed by a rendering whose status is not ISSUED"
  - id: ERR_QUOTE_NOT_ACCEPTED
    http: 409
    condition: "raising a ManufacturingOrder from a Quote whose status is not ACCEPTED"
  - id: ERR_PROVISIONAL_QUOTE_NOT_ACCEPTABLE
    http: 409
    condition: "accepting a Quote whose variant is PROVISIONAL"
  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "an order trigger fired from a production_status that declares no such transition"
  - id: ERR_ORDER_NOT_IN_PRODUCTION
    http: 409
    condition: "advancing kitting_status or bagging_status while production_status is not IN_PRODUCTION"
  - id: ERR_JOB_INVALID_STATE
    http: 409
    condition: "a job trigger fired from a status that declares no such transition (start on a non-SCHEDULED job, inspection filed in the wrong phase, rework outside {INSPECTION_FAILED, AUDIT_FAILED}, and so on)"
  - id: ERR_PLEDGE_INVALID_STATE
    http: 409
    condition: "collecting a pledge that is not PLEDGED, or refunding one already REFUNDED"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "deciding a WarrantyClaim whose status is not SUBMITTED"
  - id: ERR_INSTALLER_INVALID_STATE
    http: 409
    condition: "an installer status change with no declared transition from the current status (e.g. REVOKED -> ACTIVE)"
  - id: ERR_INSTALLER_NOT_ACTIVE
    http: 409
    condition: "booking or starting a job on an installer whose status is SUSPENDED or REVOKED"
  - id: ERR_AUDIT_FAILURES_OPEN
    http: 409
    condition: "reinstating an installer to ACTIVE while open_audit_failures > 0"

  # ---- safety / compliance
  - id: ERR_FALL_HEIGHT_EXCEEDS_STANDARD
    http: 422
    condition: "a placement's model deck_height_cm exceeds the ACTIVE standard's maximum for the area's age group, or the resulting critical fall height exceeds MAX_CRITICAL_FALL_HEIGHT_CM"
  - id: ERR_AGE_GROUP_MISMATCH
    http: 422
    condition: "the placed or replacement model's age_group differs from the owning PlayArea's age_group"
  - id: ERR_AGE_GROUP_SEPARATION_VIOLATION
    http: 409
    condition: "use zones of placements in play areas of different age groups are closer than the ACTIVE standard's min_use_zone_clearance_cm"
  - id: ERR_SURFACING_DEPTH_INSUFFICIENT
    http: 422
    condition: "a play area's specified (or, at inspection, measured) surfacing depth is below required_surfacing_depth_cm"
  - id: ERR_ACCESSIBLE_ROUTE_MISSING
    http: 422
    condition: "a play area has no accessible-transfer-ready placement while the project or the ACTIVE standard requires an accessible route"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "starting a rework cycle when rework_cycles has already reached MAX_REWORK_CYCLES (2)"

  # ---- geometry / graph constraints
  - id: ERR_USE_ZONE_OVERLAP
    http: 409
    condition: "the validated placement's closed use-zone interval intersects the interval of another placement with status == VALIDATED in the same play area and the two are not directly attached"
  - id: ERR_USE_ZONE_OUT_OF_BOUNDS
    http: 422
    condition: "the placement's use-zone interval falls outside its play area's half-open axis interval"
  - id: ERR_INVALID_ATTACHMENT_TARGET
    http: 422
    condition: "the attachment direction violates the catalogue rule (slides and climbers attach to decks, decks attach to posts, posts and hardware kits attach to nothing)"

  # ---- scheduling / temporal
  - id: ERR_INSTALLER_BOOKING_CONFLICT
    http: 409
    condition: "the requested window intersects another non-excluded job of the same installer, or leaves fewer than TRAVEL_BUFFER_DAYS clear calendar days between consecutive bookings"
  - id: ERR_CREW_CAPACITY_EXCEEDED
    http: 422
    condition: "crew_size exceeds installer.crew_capacity_per_day"
  - id: ERR_INSTALLER_CATEGORY_NOT_CERTIFIED
    http: 409
    condition: "the installer's certified_categories do not cover every component category in the ordered quote's priced placements"
  - id: ERR_INSTALLER_CERTIFICATION_EXPIRED
    http: 409
    condition: "starting a job after installer.certification_expires_on"
  - id: ERR_JOB_NOT_YET_STARTABLE
    http: 409
    condition: "starting a job before its scheduled_start_date"
  - id: ERR_FUNDRAISING_DEADLINE_PASSED
    http: 409
    condition: "collecting a pledge after project.fundraising_deadline"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "accepting a quote after quote.valid_until"
  - id: ERR_PARTS_NO_LONGER_AVAILABLE
    http: 409
    condition: "buying a replacement part after the model's parts_support_until_year"
  - id: ERR_INVALID_FAILURE_DATE
    http: 422
    condition: "failure_date is before project.installed_on or after the logical clock date"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 422
    condition: "the requested logical clock instant is earlier than a recorded installed_on date"

  # ---- referential / commercial
  - id: ERR_INSUFFICIENT_COMMUNITY_INPUT
    http: 422
    condition: "closing a community review with fewer than MIN_REVIEW_VOTES (25) total votes"
  - id: ERR_RETROFIT_MODEL_MISMATCH
    http: 422
    condition: "replacement_model_id is neither the placement's own model nor a model that supersedes it"
  - id: ERR_WARRANTY_PLACEMENT_MISMATCH
    http: 422
    condition: "the claimed placement does not belong to a PlayArea of the claim's project_id"
  - id: ERR_RENDERING_PROJECT_MISMATCH
    http: 422
    condition: "a quote's rendering_id belongs to a different project than its project_id"
  - id: ERR_QUOTE_EMPTY_SCOPE
    http: 422
    condition: "the variant's placement input set is empty, so there is nothing to price"

  # ---- fiscal
  - id: ERR_QUOTE_EXCEEDS_BUDGET
    http: 422
    condition: "a FIRM quote's total_cents exceeds project.budget_cents"
  - id: ERR_FUNDING_SHORTFALL
    http: 402
    condition: "project.funds_collected_cents is below the accepted quote's total_cents when the order is raised"
  - id: ERR_FUNDS_ALREADY_COMMITTED
    http: 409
    condition: "refunding a pledge after the project reached ORDERED"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "approving a warranty claim whose covered_pct has decayed to 0"

roles:
  - name: ManufacturerAdmin
    description: "Plant administration: catalogue, standards registration, production floor and installer network membership"
    identity: opaque
    exclusive_operations:
      - "POST /playground/component-models"
      - "POST /playground/component-models/{id}/lifecycle"
      - "POST /playground/orders/{id}/start-production"
      - "POST /playground/orders/{id}/kitting"
      - "POST /playground/orders/{id}/hardware-bagging"
      - "POST /playground/orders/{id}/ship"
      - "POST /playground/installers"
      - "POST /playground/installers/{id}/status"
    shared_operations:
      - "POST /playground/standards (with ComplianceOfficer)"
      - "all GET read endpoints"
      - "POST /playground/_clock/set_current_utc"

  - name: DesignConsultant
    description: "Runs the design consultation: projects, play areas, placements, renderings, quotes, orders and installer bookings"
    identity: opaque
    exclusive_operations:
      - "POST /playground/projects"
      - "POST /playground/projects/{id}/start-consultation"
      - "POST /playground/projects/{id}/play-areas"
      - "POST /playground/projects/{id}/renderings"
      - "POST /playground/projects/{id}/cancel"
      - "POST /playground/play-areas/{id}/placements"
      - "POST /playground/placements/{id}/validate"
      - "DELETE /playground/placements/{id}"
      - "POST /playground/renderings/{id}/close-review"
      - "POST /playground/quotes"
      - "POST /playground/orders"
      - "POST /playground/installation-jobs"
      - "POST /playground/installation-jobs/{id}/reschedule"
      - "POST /playground/installation-jobs/{id}/cancel"
    shared_operations:
      - "POST /playground/projects/{id}/pledges (with ClientRepresentative)"
      - "POST /playground/placements/{id}/retrofit (with ClientRepresentative)"
      - "all GET read endpoints"
      - "POST /playground/_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Owns safety certification: activates and supersedes standard editions, certifies models and designs, decides warranty claims. Cannot certify a design it consulted on"
    identity: opaque
    exclusive_operations:
      - "POST /playground/standards/{id}/activate"
      - "POST /playground/standards/{id}/supersede"
      - "POST /playground/component-models/{id}/certify"
      - "POST /playground/projects/{id}/certify-compliance"
      - "POST /playground/warranty-claims/{id}/decide"
    shared_operations:
      - "POST /playground/standards (with ManufacturerAdmin)"
      - "POST /playground/warranty-claims (with ClientRepresentative)"
      - "all GET read endpoints"
      - "POST /playground/_clock/set_current_utc"

  - name: ClientRepresentative
    description: "Acts for the commissioning community: fundraising, community input, quote acceptance, replacement parts and warranty claims"
    identity: opaque
    exclusive_operations:
      - "POST /playground/renderings/{id}/community-votes"
      - "POST /playground/quotes/{id}/accept"
      - "POST /playground/pledges/{id}/collect"
      - "POST /playground/pledges/{id}/refund"
    shared_operations:
      - "POST /playground/projects/{id}/pledges (with DesignConsultant)"
      - "POST /playground/placements/{id}/retrofit (with DesignConsultant)"
      - "POST /playground/warranty-claims (with ComplianceOfficer)"
      - "GET reads on projects, play areas, placements, renderings, quotes, pledges, orders, jobs and claims"
      - "POST /playground/_clock/set_current_utc"

  - name: InstallerOperator
    description: "A company in the certified installer network acting on its own bookings. X-User-ID is the CertifiedInstaller id, which every job-ownership check compares against installer_id"
    identity: "entity_backed:CertifiedInstaller"
    exclusive_operations:
      - "POST /playground/installation-jobs/{id}/start"
      - "POST /playground/installation-jobs/{id}/complete"
      - "POST /playground/installation-jobs/{id}/rework"
    shared_operations:
      - "GET reads on standards, component models, projects, play areas, placements, orders, installers and jobs"
      - "POST /playground/_clock/set_current_utc"

  - name: SafetyAuditor
    description: "Independent inspector filing installation inspections and post-installation safety audits; the auditor of an installation inspection may not audit the same job"
    identity: opaque
    exclusive_operations:
      - "POST /playground/installation-jobs/{id}/inspections"
    shared_operations:
      - "GET reads on standards, component models, projects, play areas, placements, installers and jobs"
      - "POST /playground/_clock/set_current_utc"
