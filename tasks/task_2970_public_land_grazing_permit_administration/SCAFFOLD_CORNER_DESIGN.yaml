            - call: "POST /allotments"
              payload: { admin_unit_code: "NV-165", acres: 4000, total_permitted_aums: 120, season_start: "01-01", season_end: "12-31" }
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          assert:
            - "first call: HTTP 201 with response_type == \"object\", a non-empty meta.api_request_id, an ISO-8601 meta.api_request_timestamp, and data.id == ${c_a62_id}"
            - "second call: HTTP 200 with response_type == \"array\" and data carrying items, limit 10, offset 0, total_count >= 1 and has_more false"
            - "third call: HTTP 404 with response_type == \"error\", data.error_id == \"ERR_ALLOTMENT_NOT_FOUND\", a non-empty data.message string, and NO data.id field"
            - "fourth call: HTTP 400 with response_type == \"error\" and data.error_id == \"ERR_VALIDATION\" (name is required); meta.api_request_id is present on this failing response too"
            - "the api_request_id values of the four responses are all distinct"

      - name: corner_validation_error_covers_every_input_defect
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VALIDATION
          - validations.priority_1
        distinguishing_aspect: "One code, HTTP 400 ERR_VALIDATION, absorbs every shape defect — wrong JSON type, unknown enum member, negative quantity, out-of-range score, out-of-range percentage, too-short string, malformed email and a season code that is not MM-DD — and because priority 1 runs before any lookup, it is returned even when the body's foreign keys name rows that were never minted."
        test_recipe:
          setup:
            - "No setup at all: priority 1 precedes the path-id and body-FK lookups, so never-minted ids are legal fixture material here"
          setup_api_calls: []
