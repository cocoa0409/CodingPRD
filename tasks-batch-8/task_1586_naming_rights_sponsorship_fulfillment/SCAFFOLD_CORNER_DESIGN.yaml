# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Naming Rights & Sponsorship Fulfillment
# Breadth probe over §1.1-§1.7 claims not covered by §1.8. All chains replay
# from empty DB against §1.5. Fixture conventions match SCAFFOLD_DIFFICULTY_DESIGN.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: venue_create_applies_epoch_default
        claim_type: defaults
        grounds: [entities.Venue.fields.current_season]
        distinguishing_aspect: "A new venue starts at current_season 2026 with version 1; client cannot set the epoch."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id, v_season: $.data.current_season, v_ver: $.data.version } }
          assert:
            - "v_season == 2026 (system default epoch)"
            - "v_ver == 1 and id is a server-minted UUID"

      - name: contract_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.SponsorshipContract.fields.escalator_mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required escalator_mode (no default) fails with ERR_INVALID_REQUEST 400 before any state is persisted."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
          trigger:
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03 }, as: SponsorshipSales, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"
            - "GET /contracts?sponsor_id=${sp_id} returns zero rows (nothing persisted)"

      - name: asset_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Asset.fields.asset_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "asset_class outside {SIGNAGE, DIGITAL, HOSPITALITY} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Venue V"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
          trigger:
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Radio Booth", asset_class: "RADIO", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"

      - name: sponsor_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent sponsor id returns ERR_NOT_FOUND 404 (existence check left-to-right)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sponsors/00000000-0000-0000-0000-000000000000", as: SponsorshipSales, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: contract_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.SponsorshipContract.fields.scheduled_total_cents]
        distinguishing_aspect: "Client-supplied scheduled_total_cents is ignored: the response carries the computed default 0 until countersign runs the schedule calculation."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
          trigger:
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "SIMPLE", scheduled_total_cents: 999 }, as: SponsorshipSales, captures: { c_id: $.data.id, c_total: $.data.scheduled_total_cents } }
          assert:
            - "c_total == 0 — client input for a computed field is ignored (not 999)"
            - "SponsorshipContract.${c_id}.receivable_cents == 0 and make_good_outstanding_cents == 0"

      - name: asset_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with defaults limit=10 offset=0; explicit limit=2 pages deterministically by created_at ASC."
        test_recipe:
          setup: ["Venue V with 3 assets created in order A1, A2, A3"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "A1", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a1_id: $.data.id } }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "A2", asset_class: "DIGITAL", rate_card_unit_cents: 80000, avg_impressions_per_unit: 200000, cpm_cents: 3000 }, as: VenueAdmin }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "A3", asset_class: "HOSPITALITY", rate_card_unit_cents: 250000, avg_impressions_per_unit: 0, cpm_cents: 0 }, as: VenueAdmin }
          trigger:
            - { call: "GET /assets", payload: { venue_id: "${v_id}", limit: 2 }, as: VenueAdmin, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /assets", payload: { venue_id: "${v_id}", limit: 2, offset: 2 }, as: VenueAdmin, captures: { third_id: "$.data[0].id" } }
          assert:
            - "Page 1: total_count == 3, has_more == true, 2 rows, first row is ${a1_id} (created_at ASC)"
            - "Page 2 (offset 2): has_more == false, exactly 1 row"
            - "Every response carries meta.api_request_id and meta.api_request_timestamp"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_terminal_lockdown_and_patch_gate
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SponsorshipContract, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is locked: PROPOSE on a TERMINATED contract fails ERR_INVALID_STATE; PATCH outside DRAFT (e.g. on PROPOSED) also fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; contract C ACTIVE (term 2026-2028)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
          trigger:
            - { call: "PATCH /contracts/${c_id}", payload: { base_fee_cents: 11000000 }, as: SponsorshipSales, captures: { patch_err: $.data.error_id } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "TERMINATE" }, as: SponsorshipSales }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { term_err: $.data.error_id } }
          assert:
            - "patch_err == ERR_INVALID_STATE (PATCH allowed only while DRAFT)"
            - "term_err == ERR_INVALID_STATE (terminal TERMINATED accepts no further transitions)"

      - name: evidence_double_approve_rejected
        claim_type: idempotency
        grounds: [state_machines.EvidenceSubmission, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPROVE is a one-shot transition: a second APPROVE on an APPROVED submission fails ERR_INVALID_STATE and approved_units is not double-counted."
        test_recipe:
          setup: ["Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2026; asset LED; deliverable D contracted 10 IN_PROGRESS; evidence E (4 units) already APPROVED"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 4, evidence_uri: "s3://pop/e.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-2" }
          trigger:
            - { call: "POST /evidence-submissions/${e_id}/transition", payload: { action: "APPROVE" }, as: ActivationManager, as_user_id: "am-3", captures: { err: $.data.error_id } }
            - { call: "GET /deliverables/${d_id}", as: ActivationManager, captures: { d_units: $.data.approved_units } }
          assert:
            - "err == ERR_INVALID_STATE (APPROVED is terminal for review)"
            - "d_units == 4 — no double accrual"

      - name: invoice_double_issue_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Invoice.DRAFT_to_ISSUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ISSUE is legal only from DRAFT; re-issuing an ISSUED invoice fails ERR_INVALID_STATE and receivable is unchanged."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; contract C base 10,000,000 COMPOUND 0.03 term 2026-2028 ACTIVE; SIGNING invoice I1 ISSUED (receivable 12,363,600)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i1_id}/transition", payload: { action: "ISSUE" }, as: FinanceManager }
          trigger:
            - { call: "POST /invoices/${i1_id}/transition", payload: { action: "ISSUE" }, as: FinanceManager, captures: { err: $.data.error_id } }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { recv: $.data.receivable_cents } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "recv == 12363600 — unchanged by the rejected re-issue"

      - name: deliverable_cancel_voids_open_evidence
        claim_type: cascade_down
        grounds: [state_machines.Deliverable.IN_PROGRESS_to_CANCELLED, state_machines.EvidenceSubmission.SUBMITTED_to_VOIDED]
        distinguishing_aspect: "Cancelling an IN_PROGRESS deliverable voids only OPEN evidence (SUBMITTED and REJECTED); APPROVED evidence is terminal and survives, and approved_units is retained."
        test_recipe:
          setup: ["Venue V (2026); ACTIVE sponsor S; ACTIVE contract C term 2026-2026; asset LED; D contracted 10 IN_PROGRESS with E1 SUBMITTED (3 units) and E2 REJECTED (2 units)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /deliverables", payload: { contract_id: "${c_id}", asset_id: "${a_id}", season: 2026, unit_kind: "GAME_DISPLAY", contracted_units: 10 }, as: ActivationManager, captures: { d_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 3, evidence_uri: "s3://pop/e1.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e1_id: $.data.id } }
            - { call: "POST /evidence-submissions", payload: { deliverable_id: "${d_id}", units_claimed: 2, evidence_uri: "s3://pop/e2.pdf" }, as: ActivationManager, as_user_id: "am-1", captures: { e2_id: $.data.id } }
            - { call: "POST /evidence-submissions/${e2_id}/transition", payload: { action: "REJECT", review_note: "insufficient proof" }, as: ActivationManager, as_user_id: "am-2" }
          trigger:
            - { call: "POST /deliverables/${d_id}/transition", payload: { action: "CANCEL" }, as: ActivationManager, captures: { d_status: $.data.deliverable_status } }
            - { call: "GET /evidence-submissions/${e1_id}", as: ActivationManager, captures: { e1_status: $.data.submission_status } }
            - { call: "GET /evidence-submissions/${e2_id}", as: ActivationManager, captures: { e2_status: $.data.submission_status } }
          assert:
            - "d_status == CANCELLED"
            - "e1_status == VOIDED (SUBMITTED at cancel time)"
            - "e2_status == VOIDED (REJECTED at cancel time)"

      - name: league_window_release_restores_grant_and_rights
        claim_type: compensation
        grounds: [state_machines.RightsWindow.ACTIVE_to_RELEASED, state_machines.ExclusivityGrant.CONFLICTED_to_ACTIVE]
        distinguishing_aspect: "Releasing the sole blocking LEAGUE window re-activates the CONFLICTED grant and flips the contract's rights_status back to CLEAR — the contest cascade has an exact inverse."
        test_recipe:
          setup: ["Venue V (2026); ACTIVE sponsor S; contract C ACTIVE with grant G BEVERAGE [2026,2028] ACTIVE; LEAGUE window W BEVERAGE [2027,2029] ACTIVATEd -> G CONFLICTED, C CONTESTED"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /exclusivity-grants", payload: { contract_id: "${c_id}", category: "BEVERAGE", first_season: 2026, last_season: 2028 }, as: SponsorshipSales, captures: { g_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "POST /exclusivity-grants/${g_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "POST /rights-windows", payload: { venue_id: "${v_id}", holder: "LEAGUE", category: "BEVERAGE", first_season: 2027, last_season: 2029 }, as: VenueAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /rights-windows/${w_id}/transition", payload: { action: "ACTIVATE" }, as: VenueAdmin }
          trigger:
            - { call: "POST /rights-windows/${w_id}/transition", payload: { action: "RELEASE" }, as: VenueAdmin, captures: { w_status: $.data.window_status } }
            - { call: "GET /exclusivity-grants/${g_id}", as: VenueAdmin, captures: { g_status: $.data.grant_status } }
            - { call: "GET /contracts/${c_id}", as: SponsorshipSales, captures: { c_rights: $.data.rights_status } }
          assert:
            - "w_status == RELEASED"
            - "g_status == ACTIVE (sole blocker released)"
            - "c_rights == CLEAR — contest fully compensated"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: receivable_counts_only_open_invoices
        claim_type: input_set_filtering
        grounds: [calculations.receivable_cents]
        distinguishing_aspect: "receivable_cents includes only ISSUED/PARTIALLY_PAID/PAID/WRITTEN_OFF invoices: at countersign (3 DRAFT) it is 0; issuing SIGNING makes it 12,363,600; voiding a DRAFT invoice changes nothing."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; contract C base 10,000,000 COMPOUND 0.03 term 2026-2028, countersigned (3 DRAFT invoices) then ACTIVE"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2028, base_fee_cents: 10000000, escalator_pct: 0.03, escalator_mode: "COMPOUND" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "PROPOSE" }, as: SponsorshipSales, captures: { c_v: $.data.version } }
            - { call: "POST /contracts/${c_id}/countersign", payload: { expected_contract_version: "${c_v}" }, as: SponsorContact, as_user_id: "${sp_id}" }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { recv_at_sign: $.data.receivable_cents } }
            - { call: "POST /contracts/${c_id}/transition", payload: { action: "ACTIVATE" }, as: SponsorshipSales }
            - { call: "GET /invoices", payload: { contract_id: "${c_id}" }, as: FinanceManager, captures: { i1_id: "$.data[0].id", i2_id: "$.data[1].id" } }
          trigger:
            - { call: "POST /invoices/${i1_id}/transition", payload: { action: "ISSUE" }, as: FinanceManager }
            - { call: "POST /invoices/${i2_id}/transition", payload: { action: "VOID" }, as: FinanceManager }
            - { call: "GET /contracts/${c_id}", as: FinanceManager, captures: { recv_end: $.data.receivable_cents } }
          assert:
            - "recv_at_sign == 0 (DRAFT invoices excluded)"
            - "recv_end == 12363600 (only ISSUED SIGNING invoice counts; voiding DRAFT MID_SEASON is a no-op)"

      - name: report_excludes_cancelled_deliverables
        claim_type: input_set_filtering
        grounds: [calculations.delivered_value, entities.ValuationReport.fields.fulfillment_pct]
        distinguishing_aspect: "The report's input set drops CANCELLED deliverables: with D2 (contracted 4) cancelled, the season report over D1 alone shows provisional 350,000, final 2,100,000, fulfillment_pct 0.7, make_good_due 0 (auto-credit still REQUESTED)."
        test_recipe:
          setup: ["Venue V (2026); ACTIVE sponsor S; ACTIVE contract C base 10,000,000 SIMPLE 0 term 2026-2026; asset LED rate 50,000 imp 120,000 cpm 2,500; D1 contracted 10 approved 7; D2 contracted 4 created then CANCELLED; venue advanced to 2027 (D1 -> MISSED, auto-credit REQUESTED)"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /sponsors", payload: { legal_name: "FizzCo Beverages LLC", display_name: "FizzCo", industry_category: "BEVERAGE" }, as: SponsorshipSales, captures: { sp_id: $.data.id } }
            - { call: "POST /sponsors/${sp_id}/transition", payload: { action: "QUALIFY" }, as: SponsorshipSales }
            - { call: "POST /assets", payload: { venue_id: "${v_id}", name: "Bowl LED Ribbon", asset_class: "SIGNAGE", rate_card_unit_cents: 50000, avg_impressions_per_unit: 120000, cpm_cents: 2500 }, as: VenueAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /contracts", payload: { venue_id: "${v_id}", sponsor_id: "${sp_id}", title: "Naming", term_first_season: 2026, term_last_season: 2026, base_fee_cents: 10000000, escalator_pct: 0, escalator_mode: "SIMPLE" }, as: SponsorshipSales, captures: { c_id: $.data.id } }
