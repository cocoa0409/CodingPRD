      - name: address_search_escalates_three_tiers_then_lands_unlocatable
        claim_type: valid_transition
        grounds:
          - state_machines.ParticipantRecord.address_status
          - constants.ADDRESS_SEARCH_MAX_TIERS
          - calculations.data_confidence_score
        distinguishing_aspect: |
          The address dimension is a self-loop that must count: two NO_MATCH results
          leave the record UNCONFIRMED at TIER_2 while the mortality and
          participant_status dimensions stay untouched, and the third NO_MATCH — the
          one taken at attempts == 2 — leaves the loop for terminal UNLOCATABLE with
          tier TIER_3. The confidence score must move from 25 to 40 on that last
          step because the address deduction drops from 40 to 25.
        test_recipe:
          setup:
            - "one PensionPlan with one never-cleansed participant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-LOST", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 20000, final_average_monthly_earnings_cents: 100000, credited_service_months: 160, date_of_birth: "1967-01-01" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { pa_id: $.data.id, score_at_create: $.data.data_confidence_score }
          trigger:
            - call: "POST /prt/participants/${pa_id}/address-searches"
              payload: { search_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { tier1: $.data.address_search_tier, attempts1: $.data.address_search_attempts }
            - call: "POST /prt/participants/${pa_id}/address-searches"
              payload: { search_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { tier2: $.data.address_search_tier, attempts2: $.data.address_search_attempts, status2: $.data.address_status }
            - call: "POST /prt/participants/${pa_id}/address-searches"
              payload: { search_result: "NO_MATCH" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { tier3: $.data.address_search_tier, attempts3: $.data.address_search_attempts, status3: $.data.address_status, score3: $.data.data_confidence_score }
          assert:
            - "after the first NO_MATCH address_status == UNCONFIRMED, address_search_attempts == 1, address_search_tier == TIER_1"
            - "after the second NO_MATCH address_status == UNCONFIRMED, address_search_attempts == 2, address_search_tier == TIER_2 — the self-loop stayed in state and only the counter moved"
            - "after the third NO_MATCH address_status == UNLOCATABLE, address_search_attempts == 3, address_search_tier == TIER_3"
            - "data_confidence_score was 25 at creation and after the first two searches, then 40 once UNLOCATABLE replaces the 40-point unconfirmed deduction with the 25-point unlocatable deduction"
            - "mortality_status is still UNVERIFIED and participant_status is still IN_PLAN across all three calls — the other two dimensions of this record are independent of the address dimension"
            - "confirmed_address_line1 and confirmed_postal_code are still null and ParticipantRecord.${pa_id}.version == 4 after three searches on a row created at version 1"

      - name: disqualified_expert_is_terminal_and_can_neither_opine_nor_be_re_reviewed
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.IndependentExpert.terminal_states
          - errors.ERR_EXPERT_NOT_ENGAGED
          - errors.ERR_EXPERT_STATE_INVALID
        distinguishing_aspect: |
          DISQUALIFIED is terminal and the two ways out fail with different codes:
          the opinion endpoint reports ERR_EXPERT_NOT_ENGAGED because its guard is
          phrased on ENGAGED, while a second independence-review reports the generic
          own-state ERR_EXPERT_STATE_INVALID. Collapsing them to one code fails, and
          so does allowing a disqualified firm to be re-reviewed into ENGAGED.
        test_recipe:
          setup:
            - "one PensionPlan and one expert proposed with conflict_disclosed true, then disqualified"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanFiduciary
              as_user_id: "fiduciary-01"
            - call: "POST /prt/plans"
