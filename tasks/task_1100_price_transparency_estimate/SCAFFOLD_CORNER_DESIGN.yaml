scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_procedure_success
        claim_type: Creation
        grounds:
          - entities.Procedure
          - 'endpoints["POST /procedures"]'
        distinguishing_aspect: "POST /procedures with all required fields returns 201 and echoes code_system=CPT, code=70450, gross_charge_cents=300000 plus a server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.code_system == CPT"
            - "response.data.code == 70450"
            - "response.data.gross_charge_cents == 300000"
            - "response.data.version == 1"

      - name: procedure_default_is_shoppable_applied
        claim_type: Defaults
        grounds:
          - entities.Procedure.fields.is_shoppable
        distinguishing_aspect: "Omitting is_shoppable defaults it to true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
          assert:
            - "response.data.is_shoppable == true"
            - "response.data.requires_prior_auth == false"

      - name: get_procedure_not_found_returns_404
        claim_type: Not Found
        grounds:
          - 'errors[ERR_PROCEDURE_NOT_FOUND]'
          - 'endpoints["GET /procedures/{id}"]'
        distinguishing_aspect: "GET /procedures with a non-existent UUID returns ERR_PROCEDURE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /procedures/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_PROCEDURE_NOT_FOUND"

      - name: create_procedure_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Procedure.fields.gross_charge_cents
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "Omitting the required gross_charge_cents yields ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT" }
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: create_estimate_contract_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Estimate.fields.contract_id
          - 'errors[ERR_CONTRACT_NOT_FOUND]'
        distinguishing_aspect: "POST /estimates (GFE_INSURED) with a real patient but a non-existent contract_id returns ERR_CONTRACT_NOT_FOUND (404); FK existence (priority 4) is checked before the OCC version (priority 5)."
        test_recipe:
          setup: ["A real patient exists; the referenced contract_id does not."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat NF", member_id: "M-NF", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
          trigger:
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "00000000-0000-4000-8000-000000000001", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CONTRACT_NOT_FOUND"

      - name: create_estimate_type_contract_mismatch
        claim_type: Type Constraints
        grounds:
          - entities.Estimate.fields.estimate_type
          - 'errors[ERR_ESTIMATE_TYPE_CONTRACT_MISMATCH]'
        distinguishing_aspect: "A GFE_SELFPAY estimate supplied with a contract_id is rejected with ERR_ESTIMATE_TYPE_CONTRACT_MISMATCH (422)."
        test_recipe:
          setup: ["A patient and a contract exist."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat Q", member_id: "M-Q", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_SELFPAY", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ESTIMATE_TYPE_CONTRACT_MISMATCH"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: issue_already_issued_estimate_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Estimate.DRAFT_to_ISSUED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Issuing an estimate already in ISSUED returns ERR_INVALID_STATE (409); no fields change."
        test_recipe:
          setup: ["A GFE_INSURED estimate has been issued (ISSUED)."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat R", member_id: "M-R", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
          trigger:
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: accept_draft_estimate_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Estimate.ISSUED_to_ACCEPTED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Accepting a DRAFT (never issued) estimate returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A GFE_SELFPAY estimate exists in DRAFT."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat S", member_id: "M-S", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_SELFPAY", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: PatientUser
              as_user_id: "${pat_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_already_completed_appointment_idempotency
        claim_type: Idempotency
        grounds:
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Completing an already COMPLETED appointment returns ERR_INVALID_STATE (409); accumulators are not double-counted."
        test_recipe:
          setup: ["A completed appointment (its estimate already SETTLED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat T", member_id: "M-T", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: PatientUser
              as_user_id: "${pat_id}"
            - call: "POST /providers"
              payload: { name: "Dr Ray", npi: "1000000009", specialty: "Radiology" }
              as: ProviderStaff
              captures: { prov_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "CT-1", room_type: "IMAGING" }
              as: ProviderStaff
              captures: { room_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", estimate_id: "${est_id}", provider_id: "${prov_id}", room_id: "${room_id}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: ProviderStaff
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: ProviderStaff
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Patient.${pat_id}.oop_met_cents == 122500"

      - name: issue_estimate_with_no_lines_returns_no_lines
        claim_type: Precondition Enforcement
        grounds:
          - 'validations[priority=8]'
          - 'errors[ERR_ESTIMATE_NO_LINES]'
        distinguishing_aspect: "Issuing a GFE_INSURED estimate with zero lines (contract ACTIVE, so the state check passes) returns ERR_ESTIMATE_NO_LINES (422)."
        test_recipe:
          setup: ["An ACTIVE contract and a DRAFT insured estimate with no lines."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat U", member_id: "M-U", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ESTIMATE_NO_LINES"

      - name: schedule_with_expired_prior_auth_returns_expired
        claim_type: guarded transitions
        grounds:
          - 'errors[ERR_PRIOR_AUTH_EXPIRED]'
          - entities.PriorAuthorization.fields.expiration_date
        distinguishing_aspect: "An APPROVED prior auth whose expiration_date (2026-06-01) precedes the appointment start (2026-06-02) blocks scheduling with ERR_PRIOR_AUTH_EXPIRED (409)."
        test_recipe:
          setup: ["Accepted insured estimate for a requires_prior_auth procedure; prior auth APPROVED but expiring 2026-06-01; free provider/room."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Admin
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat V", member_id: "M-V", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "FEE_SCHEDULE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "27447", description: "Knee arthroplasty", setting: "INPATIENT", requires_prior_auth: true, gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "FLAT", flat_amount_cents: 200000, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /providers"
              payload: { name: "Dr Ortho", npi: "1000000010", specialty: "Orthopedics" }
              as: ProviderStaff
              captures: { prov_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "OR-1", room_type: "PROCEDURE" }
              as: ProviderStaff
              captures: { room_id: $.data.id }
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_INSURED", contract_id: "${contract_id}", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: PatientUser
              as_user_id: "${pat_id}"
            - call: "POST /prior-authorizations"
              payload: { estimate_id: "${est_id}", procedure_code: "27447", requested_units: 1 }
              as: ProviderStaff
              captures: { pa_id: $.data.id }
            - call: "POST /prior-authorizations/${pa_id}/approve"
              payload: { auth_number: "AUTH-9", approved_units: 1, expiration_date: "2026-06-01T00:00:00Z" }
              as: PayerAnalyst
          trigger:
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", estimate_id: "${est_id}", provider_id: "${prov_id}", room_id: "${room_id}", prior_auth_id: "${pa_id}", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: ProviderStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PRIOR_AUTH_EXPIRED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: self_pay_estimate_pricing
        claim_type: Correct Result
        grounds:
          - calculations.line_allowed_amount
          - calculations.estimate_patient_responsibility
        distinguishing_aspect: "A GFE_SELFPAY estimate for a gross-300000 procedure prices allowed=195000 (gross * 0.65), patient_responsibility=195000, plan_paid=0, copay=0 — no benefit applied."
        test_recipe:
          setup: ["A patient and one procedure gross 300000; a self-pay estimate with one line."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat W", member_id: "M-W", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /estimates"
              payload: { patient_id: "${pat_id}", estimate_type: "GFE_SELFPAY", expected_patient_version: "${pat_v0}" }
              as: ProviderStaff
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/lines"
              payload: { procedure_id: "${proc_id}" }
              as: ProviderStaff
          trigger:
            - call: "POST /estimates/${est_id}/issue"
              payload: {}
              as: ProviderStaff
          assert:
            - "Estimate.${est_id}.allowed_amount_cents == 195000"
            - "Estimate.${est_id}.patient_responsibility_cents == 195000"
            - "Estimate.${est_id}.plan_paid_cents == 0"
            - "Estimate.${est_id}.copay_cents == 0"

      - name: percent_of_charge_rate_allowed
        claim_type: Constants Applied
        grounds:
          - calculations.line_allowed_amount
          - entities.NegotiatedRate.fields.percent_of_charge
        distinguishing_aspect: "A PERCENT rate of 0.60 on a gross-300000 procedure prices line allowed=180000; with a fresh deductible the estimate patient_responsibility=118500 (ded 100000 + coins 16000 + copay 2500)."
        test_recipe:
          setup: ["Fresh patient; ACTIVE PERCENT_OF_CHARGE contract with a PERCENT 0.60 rate for a gross-300000 procedure; single-line insured estimate."]
          setup_api_calls:
            - call: "POST /benefit-plans"
              payload: { payer_name: "Acme Health", plan_year: 2026, individual_deductible_cents: 100000, individual_oop_max_cents: 500000, coinsurance_rate: 0.20, copay_cents: 2500 }
              as: PayerAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { name: "Pat X", member_id: "M-X", benefit_plan_id: "${plan_id}" }
              as: ProviderStaff
              captures: { pat_id: $.data.id, pat_v0: $.data.version }
            - call: "POST /payer-contracts"
              payload: { payer_name: "Acme Health", payer_type: "COMMERCIAL", methodology: "PERCENT_OF_CHARGE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: PayerAnalyst
              captures: { contract_id: $.data.id }
            - call: "POST /payer-contracts/${contract_id}/activate"
              payload: {}
              as: PayerAnalyst
              captures: { con_v1: $.data.version }
            - call: "POST /procedures"
              payload: { code_system: "CPT", code: "70450", description: "CT Head", setting: "OUTPATIENT", gross_charge_cents: 300000 }
              as: ProviderStaff
              captures: { proc_id: $.data.id }
            - call: "POST /negotiated-rates"
              payload: { contract_id: "${contract_id}", procedure_id: "${proc_id}", rate_type: "PERCENT", percent_of_charge: 0.60, expected_contract_version: "${con_v1}" }
              as: PayerAnalyst
            - call: "POST /estimates"
