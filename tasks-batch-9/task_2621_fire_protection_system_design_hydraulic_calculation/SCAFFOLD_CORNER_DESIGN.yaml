            - "every row: effective_hazard_class == ORDINARY_1, design_area_sqft == 1500, hose_allowance_gpm == 250.0"

      - name: in_rack_head_count_is_clamped_by_the_floor_and_the_cap_and_scales_between_them
        claim_type: constants_applied
        grounds:
          - calculations.auxiliary_system_demand
          - entities.AuxiliarySystem.fields.demand_gpm
          - calculations.project_demand_ledger
        distinguishing_aspect: |
          IN_RACK demand is 30.0 gpm per head squeezed between IN_RACK_FLOOR_GPM 150.0 and
          IN_RACK_CAP_GPM 480.0: 3 heads would compute 90.0 and is lifted to the floor, 10 heads is
          300.0 and 12 heads is 360.0 untouched, and 20 heads would compute 600.0 and is cut to the cap.
          The four rows also prove the clamped - not the raw - figures are what the ledger sums:
          150.0 + 300.0 + 360.0 + 480.0 == 1290.0, not 90.0 + 300.0 + 360.0 + 600.0.
        test_recipe:
          setup:
            - "Project FP-2601 with the CLASS_IV rack storage area Rack Storage Bay A (required by the IN_RACK hazard cross-check)"
            - "No hydraulic calculation exists, so governing_demand_gpm stays 0.0 and the ledger total is the auxiliary roll-up alone"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /hazard-areas"
              payload: { project_id: "${p1}", label: "Rack Storage Bay A", hazard_class: "ORDINARY_2", commodity_class: "CLASS_IV", storage_height_ft: 18.0, ceiling_height_ft: 36.0, area_sqft: 24000.0, sprinkler_system_type: "WET", ceiling_slope_pct: 4.0 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ha1: $.data.id }
          trigger:
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "IN_RACK", label: "Rack tier 3 heads", hazard_area_id: "${ha1}", in_rack_head_count: 3 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ir_a: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "IN_RACK", label: "Rack tier 10 heads", hazard_area_id: "${ha1}", in_rack_head_count: 10 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ir_b: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "IN_RACK", label: "Rack tier 12 heads", hazard_area_id: "${ha1}", in_rack_head_count: 12 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ir_c: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "IN_RACK", label: "Rack tier 20 heads", hazard_area_id: "${ha1}", in_rack_head_count: 20 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { ir_d: $.data.id }
          assert:
            - "AuxiliarySystem.${ir_a}.demand_gpm == 150.0 - clamped up from 90.0 by IN_RACK_FLOOR_GPM"
            - "AuxiliarySystem.${ir_b}.demand_gpm == 300.0"
            - "AuxiliarySystem.${ir_c}.demand_gpm == 360.0"
            - "AuxiliarySystem.${ir_d}.demand_gpm == 480.0 - clamped down from 600.0 by IN_RACK_CAP_GPM"
            - "every row: interlock_required == false and status == PROPOSED"
            - "Project.${p1}.auxiliary_demand_gpm == 1290.0"
            - "Project.${p1}.governing_demand_gpm == 0.0 and total_system_demand_gpm == 1290.0"

      - name: class_i_standpipe_cap_moves_only_above_the_high_rise_trigger
        claim_type: threshold
        grounds:
          - calculations.auxiliary_system_demand
          - entities.Project.fields.building_height_ft
          - entities.AuxiliarySystem.fields.riser_count
        distinguishing_aspect: |
          The cap is chosen by the PROJECT's building_height_ft, not by anything on the auxiliary row:
          four risers compute 500.0 + 250.0 x 3 == 1250.0, which is cut to 1000.0 at 42.0 ft, still cut
          to 1000.0 at exactly the 150.0 ft trigger because the comparison is <=, and passes through
          untouched at 200.0 ft. Two risers stay at 750.0 under every cap, proving the cap and not the
          per-riser rate is what moved.
        test_recipe:
          setup:
            - "Three projects sharing one lead engineer and one reviewer, at building_height_ft 42.0, 150.0 and 200.0"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
