            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam D", primary_email: "d@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Dee", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-13" }, as: SchoolAdmin, captures: { se1: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/sessions", payload: { session_date: "2026-09-20" }, as: SchoolAdmin, captures: { se2: $.data.id } }
          trigger:
            - { call: "POST /school/teachers/${t_id}/separate", payload: {}, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin }
            - { call: "GET /school/sessions/${se1}", payload: {}, as: SchoolAdmin }
            - { call: "GET /school/sessions/${se2}", payload: {}, as: SchoolAdmin }
            - { call: "GET /school/milestones?student_id=${stu}", payload: {}, as: SchoolAdmin, captures: { m_status: "$.data[0].status" } }
