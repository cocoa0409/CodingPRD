              payload: {}
              as: StateAdmin
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: StateAdmin
            - call: "GET /efap/agency-allocations"
              payload: { cycle_id: "${cy1}", agency_id: "${ag1}" }
              as: StateAdmin
              captures: { al1: "$.data[0].id", al1_v: "$.data[0].version" }
            - call: "POST /efap/commodity-orders"
              payload: { cycle_id: "${cy1}", agency_id: "${ag1}", warehouse_id: "${wh_n}", expected_agency_allocation_version: "${al1_v}" }
