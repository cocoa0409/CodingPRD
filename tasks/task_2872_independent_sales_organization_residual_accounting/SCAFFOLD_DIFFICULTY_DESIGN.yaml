              payload: { paid_on: "2026-08-15" }
              as: ResidualController
          assert:
            - "before the trigger: AgentStatement.${st}.lifecycle_state == DRAFT and settlement_state == UNSETTLED and net_payable_cents == 14643"
            - "after issue: lifecycle_state == ISSUED, settlement_state == UNSETTLED, minimum_true_up_cents == 0, advance_recoupment_cents == 0, net_payable_cents == 14643, issued_at is non-null"
            - "after hold: lifecycle_state == ISSUED (unchanged), settlement_state == HELD, hold_reason == BANK_DETAILS_UNVERIFIED"
            - "after finalize: lifecycle_state == FINALIZED while settlement_state stays HELD   # the dimensions do not gate each other"
            - "after release-hold: lifecycle_state == FINALIZED, settlement_state == UNSETTLED, hold_reason == null"
            - "after settle: lifecycle_state == FINALIZED, settlement_state == SETTLED, paid_on == 2026-08-15"
            - "AgentStatement.${st}.version increased by exactly 5 across the five trigger calls"

