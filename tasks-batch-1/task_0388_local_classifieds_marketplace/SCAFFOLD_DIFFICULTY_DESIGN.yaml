  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: offer_floor_inclusive_boundary
        grounds:
          - calculations.compute_min_floor_autoreject
          - state_machines.Offer.transitions.PROPOSED_to_REJECTED
          - entities.Listing.fields.min_acceptable_price_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /offers: an offer exactly AT the floor (8000)
          is PROPOSED (strict `<` auto-reject), while 7999 is auto-REJECTED — the >= vs > edge
          on the min_acceptable_price_cents metric.
        test_recipe:
          setup:
            - "Published listing ask 10000, floor 8000; two buyers each open a conversation."
          setup_api_calls:
            - call: "POST /categories"
              payload: { slug: "furniture", name: "Furniture" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "s@x.com", display_name: "S", role_kind: "SELLER" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b1@x.com", display_name: "B1", role_kind: "BUYER" }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b2@x.com", display_name: "B2", role_kind: "BUYER" }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", category_slug: "furniture", title: "Desk", description: "oak", ask_price_cents: 10000, min_acceptable_price_cents: 8000 }
              as: Seller
              as_user_id: "${s_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b1_id}" }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { conv1_id: $.data.id }
            - call: "POST /conversations"
              payload: { listing_id: "${lst_id}", buyer_id: "${b2_id}" }
              as: Buyer
              as_user_id: "${b2_id}"
              captures: { conv2_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { conversation_id: "${conv1_id}", amount_cents: 8000 }
              as: Buyer
              as_user_id: "${b1_id}"
              captures: { at_floor_status: $.data.status }
            - call: "POST /offers"
              payload: { conversation_id: "${conv2_id}", amount_cents: 7999 }
