            - call: "POST /class-sessions/${sess_id}/lock-roster"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr_id}/attendance"
              payload: { attended: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:05:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions/${sess_id}/open-exam"
              payload: { proctor_trainer_id: "${tr_id}" }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /enrollments/${enr_id}/exam-attempts"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
              captures: { att_id: $.data.id }
            - call: "POST /exam-attempts/${att_id}/submit"
              payload: { raw_correct_count: 34, proctor_attestation: true }
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T18:30:00Z" }
              as: ProgramAdmin
            - call: "POST /class-sessions/${sess_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${tr_id}"
            - call: "GET /certificates"
              payload: { alcohol_server_id: "${srv_id}" }
              as: ProgramAdmin
              captures: { cert_id: "$.data[0].id" }
            - call: "POST /employer-locations/${loc_a_id}/server-assignments"
              payload: { alcohol_server_id: "${srv_id}", role_title: "Bartender" }
              as: EmployerAdmin
              as_user_id: "${emp_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-10T18:30:00Z" }
