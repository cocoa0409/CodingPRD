            - { call: "POST /reslife/rooms", payload: { dorm_id: "${dorm_id}", room_number: "W-103", beds: 1 }, as: SchoolAdmin, captures: { room_id: "$.data.id" } }
            - { call: "POST /reslife/terms", payload: { name: "FALL_2026", starts_on: "2026-08-24", ends_on: "2026-12-18" }, as: SchoolAdmin, captures: { term_id: "$.data.id" } }
            - { call: "POST /reslife/terms/${term_id}/activate", payload: {}, as: SchoolAdmin }
            - { call: "POST /reslife/parents", payload: { full_name: "Pat AJ", email: "paj@x.com" }, as: SchoolAdmin, captures: { par: "$.data.id" } }
            - { call: "POST /reslife/students", payload: { legal_name: "Stu AJ", grade: 11, gender: "MALE", is_international: false, parent_id: "${par}", sleep_schedule: 3, cleanliness: 3, noise_tolerance: 3, guests_comfort: 3 }, as: SchoolAdmin, captures: { stu: "$.data.id", stu_v: "$.data.version" } }
            - { call: "POST /reslife/dorm-assignments", payload: { student_id: "${stu}", room_id: "${room_id}", term_id: "${term_id}", expected_student_version: "${stu_v}" }, as: SchoolAdmin, captures: { asg: "$.data.id" } }
          trigger:
            - { call: "POST /reslife/dorm-assignments/${asg}/confirm", payload: {}, as: SchoolAdmin, captures: { a_status: "$.data.status", a_checkin: "$.data.check_in_at" } }
