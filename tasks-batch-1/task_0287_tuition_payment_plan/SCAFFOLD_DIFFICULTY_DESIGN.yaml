            - call: "POST /institutions/students"
              payload: { institution_id: "${inst_k}", external_ref: "S11", full_name: "Stu Eleven", email: "s11@x.edu" }
              as: Registrar
              captures: { stu_11: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_k}", name: "5PAY", installment_count: 5, down_payment_pct: 0, plan_fee_cents: 0, late_fee_grace_days: 3 }
              as: Registrar
              captures: { tpl_k: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_11}", term_id: "${term_k}", plan_template_id: "${tpl_k}" }
              as: Registrar
              captures: { enr_11: $.data.id }
