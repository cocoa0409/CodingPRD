- rule_id: resource_temporal_overlap
  instances:
  - name: overlapping_active_temporary_access_grants_rejected
    grounds:
    - validations[priority=11]
    - state_machines.TemporaryAccessGrant
    distinguishing_aspect: 'Interval semantics: occupancy-based exclusion on the IdentityAccount

      resource — at most one grant occupies the ACTIVE state-interval at a

      time, regardless of how short the requested duration is; a second

      create fails while the first is ACTIVE and succeeds after the first

      is voided.

      '
    test_recipe:
      setup:
      - ORG14 (STANDARD/STANDARD, idp [FIDO2]); employee EMP14 + account ACCT14
      setup_api_calls:
      - call: POST /v1/organizations
        payload:
          legal_name: Overlap Org
          assurance_tier: STANDARD
          authentication_policy: STANDARD
          idp_protocols:
          - FIDO2
          backup_key_minimum: 2
        as: PlatformAdmin
        as_user_id: pa1
        captures:
          org14: $.data.id
      - call: POST /v1/organizations/${org14}/employees
        payload:
          employee_ref: E-O1
          location: HQ
          directory_user_id: u-o1
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          emp14: $.data.id
          acct14: $.data.identity_account_id
      - call: POST /v1/identity-accounts/${acct14}/temporary-access
        payload:
          method: SMART_CARD
          duration_hours: 1
        as: HelpDeskAgent
        as_user_id: hd1
        captures:
          g14a: $.data.id
      trigger:
      - call: POST /v1/identity-accounts/${acct14}/temporary-access
        payload:
          method: SERVICE_DESK_TOKEN
          duration_hours: 1
        as: HelpDeskAgent
        as_user_id: hd1
        captures:
          err14: $.data.error_id
      - call: POST /v1/identity-accounts/${acct14}/temporary-access/${g14a}/void
        payload: {}
        as: HelpDeskAgent
        as_user_id: hd1
      - call: POST /v1/identity-accounts/${acct14}/temporary-access
        payload:
          method: SERVICE_DESK_TOKEN
          duration_hours: 1
        as: HelpDeskAgent
        as_user_id: hd1
        captures:
          g14b: $.data.id
          g14b_st: $.data.status
      assert:
      - err14 == ERR_GRANT_WINDOW (second grant overlaps the ACTIVE occupancy)
      - g14b_st == ACTIVE (after voiding, the occupancy interval is free)
