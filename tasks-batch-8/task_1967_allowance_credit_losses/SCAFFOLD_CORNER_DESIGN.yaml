              as: ChiefCreditOfficer
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q2", loss_model_id: "${m_id}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 6000 }, { scenario_id: "${sc_adv}", weight_bps: 4000 } ] }
              as: CreditAnalyst
              captures: { run_2: $.data.id }
            - call: "POST /cecl/model-runs/${run_2}/execute"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /cecl/model-runs/${run_2}/submit_for_review"
              payload: {}
              as: CreditAnalyst
            - call: "POST /cecl/model-runs/${run_2}/approve"
              payload: {}
              as: ChiefCreditOfficer
              as_user_id: "cco-1"
          trigger:
            - call: "POST /cecl/model-runs/${run_2}/finalize"
              payload: { period_charge_offs_cents: 30000, period_recoveries_cents: 5000 }
              as: ChiefCreditOfficer
            - call: "GET /cecl/model-runs/${run_1}/disclosure-reports"
              payload: {}
              as: CreditAnalyst
              captures: { dr1_beg: "$.data[0].beginning_allowance_cents", dr1_prov: "$.data[0].provision_cents" }
            - call: "GET /cecl/model-runs/${run_2}/disclosure-reports"
              payload: {}
              as: CreditAnalyst
              captures: { dr2_beg: "$.data[0].beginning_allowance_cents", dr2_end: "$.data[0].ending_allowance_cents", dr2_prov: "$.data[0].provision_cents" }
          assert:
            - "Run1 report: beginning_allowance_cents == 0 (${dr1_beg}; no prior FINALIZED run) and provision_cents == 55000 (${dr1_prov})"
            - "Run2 total at finalize == 80000 (55000 quantitative + 25000 qualitative)"
            - "Run2 report: beginning 55000 (${dr2_beg}), ending 80000 (${dr2_end}), provision == 50000 (${dr2_prov} = 80000 - 55000 + 30000 - 5000)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: loans_create_missing_auth_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Missing X-User-Role/X-User-ID headers yield ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cecl/loans"
              payload: { segment_id: "33333333-3333-4333-8333-333333333333", loan_number: "LN-H1", amortized_cost_cents: 1000, risk_rating: PASS }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (${err}); http 400"

      - name: factor_approve_forbidden_for_analyst
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "CreditAnalyst calling the ChiefCreditOfficer-only approve endpoint gets ERR_FORBIDDEN_FOR_ROLE (403) even when the factor is in the correct state."
        test_recipe:
          setup: ["DOCUMENTED factor"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "CC-PRIME-2024", name: "Prime Cards", product_type: CREDIT_CARD, risk_rating_band: PRIME, vintage_year: 2024 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/qualitative-factors"
              payload: { segment_id: "${seg_id}", factor_code: POLICY_CHANGE, adjustment_bps: 15, effective_from_period: "2026-Q1", effective_to_period: "2026-Q2" }
              as: CreditAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /cecl/qualitative-factors/${f_id}/document"
              payload: { documentation_text: "Underwriting policy tightened in March 2026; overlay reflects reduced risk appetite per committee minutes." }
              as: CreditAnalyst
          trigger:
            - call: "POST /cecl/qualitative-factors/${f_id}/approve"
              payload: {}
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (${err}); http 403; factor remains DOCUMENTED"

      - name: execute_not_found_beats_state
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "Existence (priority 3) precedes state (priority 5): executing a nonexistent run id returns ERR_NOT_FOUND, never a state error."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cecl/model-runs/44444444-4444-4444-8444-444444444444/execute"
              payload: {}
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (${err}); http 404"

      - name: recovery_exceeds_charge_off_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_RECOVERY_EXCEEDS_CHARGE_OFF]"]
        distinguishing_aspect: "Cumulative recoveries may not exceed cumulative charge-offs: after charging off 50000, a recovery of 50001 is rejected (422); exactly 50000 is accepted."
        test_recipe:
          setup: ["Loan 100000 with a prior partial charge-off of 50000"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2023", name: "Auto NP", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-RC", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_id: $.data.id }
            - call: "POST /cecl/loans/${loan_id}/charge_off"
              payload: { charge_off_amount_cents: 50000, charge_off_period: "2026-Q1" }
              as: CreditAnalyst
          trigger:
            - call: "POST /cecl/loans/${loan_id}/record_recovery"
              payload: { recovery_amount_cents: 50001, recovery_period: "2026-Q2" }
              as: CreditAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /cecl/loans/${loan_id}/record_recovery"
              payload: { recovery_amount_cents: 50000, recovery_period: "2026-Q2" }
              as: CreditAnalyst
              captures: { ok: $.data.recovered_total_cents }
          assert:
            - "50001 -> error_id == ERR_RECOVERY_EXCEEDS_CHARGE_OFF (${err})"
            - "Exactly 50000 (cumulative == charged) is accepted: recovered_total_cents == 50000 (${ok})"

      - name: charge_off_exceeds_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CHARGE_OFF_EXCEEDS_BALANCE]"]
        distinguishing_aspect: "charge_off_amount_cents greater than the remaining amortized cost is rejected (422); an amount equal to the balance succeeds and flips the loan to CHARGED_OFF."
        test_recipe:
          setup: ["Segment with one PASS loan 100000"]
          setup_api_calls:
            - call: "POST /cecl/portfolio-segments"
              payload: { segment_code: "AUTO-NP-2023", name: "Auto NP", product_type: AUTO, risk_rating_band: NEAR_PRIME, vintage_year: 2023 }
              as: CreditAnalyst
              captures: { seg_id: $.data.id }
            - call: "POST /cecl/loans"
              payload: { segment_id: "${seg_id}", loan_number: "LN-CB", amortized_cost_cents: 100000, risk_rating: PASS }
              as: CreditAnalyst
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /cecl/loans/${loan_id}/charge_off"
