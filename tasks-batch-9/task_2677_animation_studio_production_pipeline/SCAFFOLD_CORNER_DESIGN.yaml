            - "${preempted_count} == 0 — the CRITICAL job preempts nothing because its window is disjoint from the LOW job's window"
      - name: reserved_render_job_excluded_from_acwp_until_settled
        claim_type: input_set_filtering
        grounds:
          - calculations.shot_earned_value.input_set
          - entities.Shot.fields.render_cost_committed_cents
          - entities.Shot.fields.render_cost_actual_cents
        distinguishing_aspect: |
          A RESERVED job's 840 cents sit only in render_cost_committed_cents; acwp stays 0. The very same 840
          moves into render_cost_actual_cents and into acwp at settlement, and the committed figure drops back
          to 0 — an implementation that counts reservations as actuals double-counts across the transition.
        test_recipe:
          setup:
            - "render pool FARM_A has 100 cores at 175 cents per core-hour"
            - "production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 and its LAYOUT task IN_PROGRESS"
            - "no hours are logged, so labor contributes nothing to acwp"
