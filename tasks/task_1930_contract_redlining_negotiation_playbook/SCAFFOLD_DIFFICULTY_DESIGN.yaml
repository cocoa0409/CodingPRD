scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: routing_bucket_system_vs_analyst_override
        grounds:
          - calculations.routing_bucket_derivation
          - entities.IntakeRequest.fields.routing_bucket
          - entities.TriageDecision.fields.decided_by
        distinguishing_aspect: |
          Same IntakeRequest inputs produce different routing_bucket values
          depending on which variant runs: SYSTEM applies the 4x4 tier/risk
          mapping; ANALYST_OVERRIDE shifts the bucket up by exactly one level
          when the analyst supplies override_routing_bucket. The two variants
          diverge observably on the IntakeRequest.routing_bucket field.
        test_recipe:
          setup:
            - "OpsAdmin creates a BusinessOwner user (bo_id) and a LegalCounsel user (lc_id) for routing defaults"
            - "OpsAdmin creates a ContractType with low=100000, mid=500000, high=2000000, auto_approve_below=50000, requires_chief_counsel_above=5000000, default_business_owner_id=bo, default_legal_counsel_id=lc"
            - "OpsAdmin creates a Counterparty with risk_tier=STANDARD"
            - "ContractAnalyst submits two IntakeRequests at value=40000 (LOW tier, < auto_approve_below_cents) so system bucket = SELF_SERVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "NDA", display_name: "NDA", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 5000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_nda: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "Acme Corp", jurisdiction: "US-DE", risk_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cp_acme: $.data.id }
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_nda}", counterparty_id: "${cp_acme}", contract_value_cents: 40000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_sys: $.data.id }
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_nda}", counterparty_id: "${cp_acme}", contract_value_cents: 40000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_ovr: $.data.id }
          trigger:
            - call: "POST /intake-requests/${ir_sys}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /intake-requests/${ir_ovr}/triage"
              payload: { override_routing_bucket: "STANDARD" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
          assert:
            - "IntakeRequest.${ir_sys}.routing_bucket == SELF_SERVE"
            - "IntakeRequest.${ir_ovr}.routing_bucket == STANDARD"
            - "IntakeRequest.${ir_sys}.triage_decision_id != IntakeRequest.${ir_ovr}.triage_decision_id"

      - name: cycle_time_percentile_vs_active_cohort_provisional
        grounds:
          - calculations.cycle_time_aggregation
          - entities.Negotiation.fields.cycle_time_seconds
        distinguishing_aspect: |
          Two variants of cycle time produce different numbers on the same
          population: the executed-cohort variant uses (executed_at - created_at)
          for CLOSED negotiations only, while the active-cohort variant uses
          (current_server_utc - created_at) for in-flight negotiations and
          EXCLUDES ABORTED entirely. A cohort containing one EXECUTED (100s)
          and one in-flight (created 200s ago) reports different p50 under the
          two variants.
        test_recipe:
          setup:
            - "One EXECUTED Negotiation with cycle_time_seconds = 100"
            - "One in-flight Negotiation created 200 seconds ago (draft_status=REDLINING)"
            - "Clock is pinned at the moment of analytic read"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo2@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc2@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca2@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc2@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "sg2@x.com", display_name: "SG", primary_role: "SIGNATORY", can_sign_above_cents: 100000000 }
              as: OpsAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "MSA", display_name: "MSA", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 5000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_msa: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "Beta LLC", jurisdiction: "US-CA", risk_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cp_beta: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "StdPlaybook" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "GOVERNING_LAW", category: "REGULATORY", standard_text: "Delaware law governs", fallback_positions: ["NY law"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { clause_gl: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            # -- Executed negotiation: created at T0, executed at T0+100 --
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_msa}", counterparty_id: "${cp_beta}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_exec: $.data.id }
            - call: "POST /intake-requests/${ir_exec}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_exec_v: $.data.version }
            - call: "POST /intake-requests/${ir_exec}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_exec_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_exec: $.data.id, neg_exec_v: $.data.version }
            - call: "POST /negotiations/${neg_exec}/rounds"
              payload: { change_summary: "Initial" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_exec}/finalize-redlining"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_exec_v2: $.data.version }
            - call: "POST /negotiations/${neg_exec}/signature-packets"
              payload: { signatories: [{ user_id: "${sg_id}", order_index: 1, authority_cap_cents: 100000000 }], signature_window_opens_at: "2026-08-01T00:00:00Z", signature_window_closes_at: "2026-12-31T23:59:59Z", expected_negotiation_version: "${neg_exec_v2}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { pkt_exec: $.data.id }
            - call: "POST /negotiations/${neg_exec}/signature-packets/${pkt_exec}/sign"
              payload: {}
              as: Signatory
              as_user_id: "${sg_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:01:40Z" }
              as: OpsAdmin
            - call: "POST /negotiations/${neg_exec}/signature-packets/${pkt_exec}/record-execution"
              payload: { execution_timestamp: "2026-08-01T00:01:40Z" }
              as: Signatory
              as_user_id: "${sg_id}"
            # -- In-flight negotiation: created at T0+100, still open at read time --
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_msa}", counterparty_id: "${cp_beta}", contract_value_cents: 80000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_inflt: $.data.id }
            - call: "POST /intake-requests/${ir_inflt}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_inflt_v: $.data.version }
            - call: "POST /intake-requests/${ir_inflt}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_inflt_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_inflt: $.data.id }
            - call: "POST /negotiations/${neg_inflt}/rounds"
              payload: { change_summary: "kickoff" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            # Advance clock by another 100s so in-flight has been open 100s
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:03:20Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /analytics/cycle-time"
              payload: { from_iso: "2026-08-01T00:00:00Z", to_iso: "2026-08-02T00:00:00Z", cohort: "executed" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { p50_exec: $.data.p50_seconds }
            - call: "GET /analytics/cycle-time"
              payload: { from_iso: "2026-08-01T00:00:00Z", to_iso: "2026-08-02T00:00:00Z", cohort: "active" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { p50_active: $.data.p50_seconds }
          assert:
            - "GET /analytics/cycle-time?cohort=executed returns cohort_size == 1"
            - "p50_exec == 100"
            - "p50_active == 100"
            - "p50_exec != cycle_time_seconds of ${neg_inflt} measured against server now (would be 100 only because in-flight opened at T0+100 and read at T0+200)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_weighted_sum_with_cap
        grounds:
          - calculations.deviation_risk_score
          - entities.Deviation.fields.risk_score
        distinguishing_aspect: |
          Mode (a) — nested min/max with conditional branches on entity state.
          Formula has 5 additive inputs (severity, category, value-tier,
          counterparty-risk, round-penalty) then applies min(cap, base) where
          cap depends on ClauseTemplate.deviation_severity_cap. Two inputs
          identical except cap: a HIGH-cap clause yields risk_score=70; the
          LOW-cap clause yields 30, demonstrating non-linear cap interaction.
        test_recipe:
          setup:
            - "Playbook with two ClauseTemplates: ClauseA cap=HIGH, ClauseB cap=LOW"
            - "Negotiation at value=3,000,000 (HIGH tier -> val_score=15), Counterparty HIGH_RISK (15)"
            - "Both deviations have severity=NON_STANDARD (30) and category=RISK (20), opened in round 2 (round_penalty=2)"
            - "Base = 30+20+15+15+2 = 82; HIGH cap => 82 (still below 100). LOW cap => min(30, 82) = 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo3@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc3@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca3@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc3@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "RESA", display_name: "Resale", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_resa: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "RiskyCo", jurisdiction: "US-NY", risk_tier: "HIGH_RISK" }
              as: OpsAdmin
              captures: { cp_risky: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "RiskPlaybook" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "LOI", category: "RISK", standard_text: "std", fallback_positions: ["fb1"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "HIGH" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { clause_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "PAYMENT", category: "RISK", standard_text: "std", fallback_positions: ["fb1"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { clause_b: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_resa}", counterparty_id: "${cp_risky}", contract_value_cents: 3000000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "Round 1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { rd1_id: $.data.id }
            # Open two deviations, then approve them so round can close
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "alt1", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_a1: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_a1}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
            - call: "GET /negotiations/${neg_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_v: $.data.version }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_a1}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
            - call: "POST /negotiations/${neg_id}/rounds/${rd1_id}/close"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "Round 2" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { rd2_id: $.data.id }
          trigger:
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "nonstd", fallback_index: -1 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_a_ns: $.data.id, dev_a_score: $.data.risk_score }
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_b}", proposed_text: "nonstd", fallback_index: -1 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_b_ns: $.data.id, dev_b_score: $.data.risk_score }
          assert:
            - "Deviation.${dev_a_ns}.risk_score == 82"
            - "Deviation.${dev_b_ns}.risk_score == 30"
            - "Deviation.${dev_a_ns}.severity == NON_STANDARD"
            - "Deviation.${dev_b_ns}.severity == NON_STANDARD"

      - name: signature_window_bracketing_nested_rounding
        grounds:
          - calculations.signature_authority_check
          - calculations.obligation_due_date
        distinguishing_aspect: |
          Mode (b) — nested threshold / boundary ordering where evaluation
          order matters. Signatory authority check (strict >) composes with
          signature window [open, close] (inclusive both ends) AND the
          record-execution path also re-verifies each signer's authority.
          A signatory with can_sign_above_cents == contract_value_cents fails
          sign (strict >) even when within window — the order of checks
          (window first vs authority first) determines which error is
          returned. The scaffold pins authority check at priority 16 BEFORE
          window check at priority 17.
        test_recipe:
          setup:
            - "Negotiation with contract_value_cents = 5,000,000 at AWAITING_COUNTERSIGN"
            - "Signatory user with can_sign_above_cents = 5,000,000 (boundary: equal, NOT strictly greater)"
            - "SignaturePacket with window [2026-08-01, 2026-12-31]; clock is inside window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo4@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc4@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca4@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc4@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "sg4@x.com", display_name: "SG", primary_role: "SIGNATORY", can_sign_above_cents: 5000000 }
              as: OpsAdmin
              captures: { sg_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "SOW", display_name: "SOW", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_sow: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "Gamma Inc", jurisdiction: "US-TX", risk_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cp_gamma: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "SigPlaybook" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "STD", category: "OPERATIONAL", standard_text: "std", fallback_positions: [], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_sow}", counterparty_id: "${cp_gamma}", contract_value_cents: 5000000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_id}/finalize-redlining"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_v: $.data.version }
            - call: "POST /negotiations/${neg_id}/signature-packets"
              payload: { signatories: [{ user_id: "${sg_id}", order_index: 1, authority_cap_cents: 5000000 }], signature_window_opens_at: "2026-08-01T00:00:00Z", signature_window_closes_at: "2026-12-31T23:59:59Z", expected_negotiation_version: "${neg_v}" }
              as: LegalCounsel
