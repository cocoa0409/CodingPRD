              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "022222000002", description: "Frozen Empanadas 10ct", case_pack_units: 10, list_price_cents: 2000, unit_cost_cents: 1150 }
              as: BrokerAccountManager
              captures: { i2: $.data.id }
            - call: "POST /items/${i2}/catalog-submissions"
              payload: { gtin14: "00022222000002", dimensions_cm: "22x16x8", gross_weight_g: 950, nutrition_panel_url: "https://cdn.example/n2.pdf", shelf_life_days: 300 }
              as: BrokerAccountManager
            - call: "POST /items/${i2}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /items"
              payload: { principal_id: "${prin}", upc: "033333000003", description: "Churro Bites 8ct", case_pack_units: 8, list_price_cents: 2500, unit_cost_cents: 1400 }
              as: BrokerAccountManager
