            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_pool
            - call: "POST /protected-rivalries"
              payload: { conference_id: "${conf_id}", member_a_id: "${m_n_id}", member_b_id: "${m_s_id}", required_annual_meetings: 1, label: "Prairie Rivalry" }
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
              captures: { pr_host_id: $.data.id }
            - call: "GET /members/${m_n_id}/schedule-compliance"
              payload: {}
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
          trigger:
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_n_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_e_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
              captures: { ce_ok_id: $.data.id }
          assert:
            - "the compliance read returns unmet_rivalry_count == 1 and schedule_compliance_score == 85 for North"
            - "the North award returns HTTP 422 with error.error_id == ERR_HOST_COMPLIANCE_INSUFFICIENT and creates no ChampionshipEvent"
            - "the East award returns HTTP 201 with ChampionshipEvent.${ce_ok_id}.status == \"SCHEDULED\" and .host_compliance_score_at_award == 100"
            - "the refused award consumed no venue capacity, so the East event fits the same window at ${v2_id} whose concurrent_event_capacity is 2"

      - name: corner_settling_into_a_closed_pool_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 58]
          - errors.ERR_POOL_CLOSED_TO_REVENUE
          - endpoints[POST /championship-events/{id}/settle]
        distinguishing_aspect: |
          Event settlement restates the linked pool's gross revenue, so it is
          refused once that pool reaches the terminal CLOSED state - 409, with
          the event still HOSTED rather than half-settled: net_event_revenue_cents,
          host_share_cents and participant_pool_cents all stay 0 and the pool's
          gross stays at 500000000.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members; South hosts a wrestling championship at Eastport Arena and the event is HOSTED."
            - "The linked FY2027 pool has been opened, closed at 0 audited expense and then CLOSED."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_pool
            - call: "POST /championship-events"
              payload: { conference_id: "${conf_id}", venue_id: "${v2_id}", host_member_id: "${m_s_id}", revenue_pool_id: "${rp_id}", sport: "WRESTLING", fiscal_year: 2027, window_start: "2027-03-01T00:00:00Z", window_end: "2027-03-05T00:00:00Z" }
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
              captures: { ce_closed_id: $.data.id }
            - call: "POST /championship-events/${ce_closed_id}/host"
              payload: {}
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
            - *c_pool_open
            - call: "POST /revenue-pools/${rp_id}/close-books"
              payload: { audited_expense_cents: 0 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /revenue-pools/${rp_id}/close"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          trigger:
            - call: "POST /championship-events/${ce_closed_id}/settle"
              payload: { ticket_revenue_cents: 48000000, sponsorship_revenue_cents: 12000000, event_expense_cents: 21000000 }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "GET /championship-events/${ce_closed_id}"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
          assert:
            - "the settle returns HTTP 409 with error.error_id == ERR_POOL_CLOSED_TO_REVENUE"
            - "ChampionshipEvent.${ce_closed_id}.status is still \"HOSTED\" with net_event_revenue_cents 0, host_share_cents 0 and participant_pool_cents 0"
            - "RevenuePool.${rp_id}.status is still \"CLOSED\" and .gross_revenue_cents is still 500000000, so not one cent of the 39000000 net leaked in"

      - name: corner_reconciliation_imbalance_blocks_issue
        claim_type: Violation → Error
        grounds:
          - validations[priority 59]
          - errors.ERR_RECONCILIATION_IMBALANCE
          - calculations.pool_reconciliation_identity
        distinguishing_aspect: |
          The identity is re-evaluated at issue time, not at draft time: drafting
          the report against a COMPUTED run and then superseding that run voids
          all four of its lines, so the recomputed delta becomes the whole
          596000000 net pool less the 6000000 reserve draw - 590000000 - and the
          issue is refused 422 with reconciliation_delta_cents persisted for the
          membership to see while the report stays DRAFT.
        test_recipe:
          setup:
            - "The FY2026 EQUAL_SHARE pool is BOOKS_CLOSED with a COMPUTED FINAL_AUDITED run and a DRAFT audit report attesting it."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_p26
            - *c_p26_open
            - *c_p26_cb
            - *c_p26_read
            - *c_r26
            - *c_ar26
            - call: "GET /revenue-pools/${p26_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { p26_v2: $.data.version }
            - call: "POST /revenue-pools/${p26_id}/distribution-runs"
              payload: { variant: "FINAL_AUDITED", expected_pool_version: "${p26_v2}", memo: "recomputed settlement" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { r26b_id: $.data.id }
          trigger:
            - call: "POST /audit-reports/${ar26_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /audit-reports/${ar26_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "GET /distribution-runs/${r26_id}/reconciliation"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "DistributionRun.${r26_id}.status == \"SUPERSEDED\" with superseded_by_run_id == ${r26b_id} and all four of its lines \"VOIDED\""
            - "the issue returns HTTP 422 with error.error_id == ERR_RECONCILIATION_IMBALANCE"
            - "AuditReport.${ar26_id}.status is still \"DRAFT\", .issued_by_user_id is null and .reconciliation_delta_cents == 590000000"
            - "the reconciliation read for ${r26_id} returns total_net_payable_cents 0, total_withheld_cents 0, total_governance_fee_cents 0, total_gor_offset_cents 0 and reconciliation_delta_cents 590000000 (596000000 - 6000000)"
            - "the replacement run ${r26b_id} reconciles to 0, so the imbalance is a property of the attested run and not of the pool"

      - name: corner_satisfaction_to_pass_at_the_approval_threshold
        claim_type: Satisfaction → Pass
        grounds:
          - calculations.vote_tally
          - state_machines.MembershipAction.VOTING_to_APPROVED
        excluded_because:
          difficulty_instance: boundary_precision_check / admit_vote_approval_ratio_exactly_7500_bps_passes
          rationale: "That instance lands approval_ratio_bps on exactly ADMIT_APPROVAL_BPS with quorum met and asserts the APPROVED outcome, the satisfaction side of the vote-threshold rule."

      - name: corner_conflicting_validations_resolve_by_priority_number
        claim_type: Priority Ordering
        grounds:
          - validations[priority 22]
          - validations[priority 62]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pool_state_precedes_reserve_posture_frozen
          rationale: "That instance arms a DRAFT pool and a FROZEN reserve simultaneously and asserts ERR_POOL_STATE_INVALID wins, then clears only the state defect to expose ERR_RESERVE_POSTURE_FROZEN underneath."

  # ===================================================================
  # SECTION 5 - ENDPOINTS
  # ===================================================================
  - section: endpoints
    instances:

      - name: corner_phase_advance_action_endpoint_walks_the_ladder
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /members/{id}/phase-advance]
          - calculations.member_phase_schedule
          - state_machines.Member.ADMITTED_PHASING_to_FULL_SHARE
        distinguishing_aspect: |
          phase_schedule_years 3 makes the ladder min(10000, 10000*phase_year/4),
          so four advances give 2500 -> 5000 -> 7500 -> 10000 and the fourth rung
          also promotes the member to FULL_SHARE - the promotion is keyed on the
          bps reaching 10000, not on phase_year reaching phase_schedule_years. A
          fifth advance is then refused 409 because FULL_SHARE is off the ladder,
          and voting_weight_bps tracks distribution_phase_bps at every rung.
        test_recipe:
          setup:
            - "The conference is OPERATING with an APPROVED FY2027 budget and a PETITIONED Central Plains University carrying a zero entry fee."
            - "The FY2028 ADMIT action has been approved 4-0 and executed, seating Central at phase_year 1."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_mc
            - *c_ma_admit
            - *c_ma_open
            - *c_ma_read
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR", expected_action_version: "${ma_v} + 1" }
              as: MemberRepresentative
              as_user_id: "${m_s_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_e_id}", choice: "FOR", expected_action_version: "${ma_v} + 2" }
              as: MemberRepresentative
              as_user_id: "${m_e_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_w_id}", choice: "FOR", expected_action_version: "${ma_v} + 3" }
              as: MemberRepresentative
              as_user_id: "${m_w_id}"
            - call: "POST /membership-actions/${ma_id}/close-voting"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "POST /membership-actions/${ma_id}/execute"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
          trigger:
            - call: "POST /members/${m_c_id}/phase-advance"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members/${m_c_id}/phase-advance"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members/${m_c_id}/phase-advance"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members/${m_c_id}/phase-advance"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
          assert:
            - "before the first advance Member.${m_c_id}.status == \"ADMITTED_PHASING\" with phase_year 1, distribution_phase_bps 2500 and voting_weight_bps 2500"
            - "advance 1 returns phase_year 2 with distribution_phase_bps 5000 and voting_weight_bps 5000, still ADMITTED_PHASING"
            - "advance 2 returns phase_year 3 with distribution_phase_bps 7500 and voting_weight_bps 7500, still ADMITTED_PHASING"
            - "advance 3 returns phase_year 4 with distribution_phase_bps 10000, voting_weight_bps 10000 and status \"FULL_SHARE\""
            - "advance 4 returns HTTP 409 with error.error_id == ERR_MEMBER_STATE_INVALID and phase_year is still 4"

      - name: corner_computed_read_reconciliation_matches_line_sums
        claim_type: Computed read
        grounds:
          - endpoints[GET /distribution-runs/{id}/reconciliation]
          - calculations.pool_reconciliation_identity
        excluded_because:
          difficulty_instance: compensating_invariant / distribution_run_conserves_every_cent_of_the_net_pool
          rationale: "That instance reads the reconciliation endpoint across compute, post and reverse and asserts every component sum plus a zero delta at each step, which is exactly the computed-read claim for this endpoint."

      - name: corner_conditional_action_post_requires_a_second_user
        claim_type: Conditional action
        grounds:
          - endpoints[POST /distribution-runs/{id}/post]
          - validations[priority 33]
          - validations[priority 56]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / segregation_of_duties_precedes_audit_report_requirement
          rationale: "That instance drives the post endpoint through both of its conditions - a distinct actor at priority 33 and an ISSUED report at priority 56 - and asserts which one fires when both are unmet."

  # ===================================================================
  # SECTION 6 - ERRORS
  # ===================================================================
  - section: errors
    instances:

      - name: corner_pagination_bounds_and_error_envelope_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 11]
          - errors.ERR_INVALID_PAGINATION
          - response_envelope
        distinguishing_aspect: |
          The pagination window is the closed interval 1..100 with offset >= 0,
          so limit 0 and limit 101 are both 400 while limit 1 and limit 100 are
          both accepted - the two rejections bracket the two acceptances. Each
          rejection must also carry the full failure envelope: HTTP 400, data
          null, and an error object with both error_id and a non-empty message,
          never a bare string or a 200 with an empty page.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
          trigger:
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 0, offset: 0 }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 101, offset: 0 }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 2, offset: -1 }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 1, offset: 0 }
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members"
              payload: { conference_id: "${conf_id}", limit: 100, offset: 0 }
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "limit 0 returns HTTP 400 with data null and error.error_id == ERR_INVALID_PAGINATION and a non-empty error.message"
            - "limit 101 returns HTTP 400 with error.error_id == ERR_INVALID_PAGINATION"
            - "offset -1 returns HTTP 400 with error.error_id == ERR_INVALID_PAGINATION"
            - "limit 1 returns HTTP 200 with 1 row, total_count 4 and has_more true"
            - "limit 100 returns HTTP 200 with 4 rows, total_count 4 and has_more false"

      - name: corner_venue_capacity_error_carries_the_offending_ids
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VENUE_CAPACITY_EXCEEDED
          - validations[priority 39]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / championship_venue_capacity_uses_half_open_windows
          rationale: "That instance saturates a two-event venue with half-open windows and asserts the 409 ERR_VENUE_CAPACITY_EXCEEDED on the third overlapping award, together with the touching-window case that must be accepted."

  # ===================================================================
  # SECTION 7 - RBAC
  # ===================================================================
  - section: RBAC
    instances:

      - name: corner_missing_auth_headers_returns_unauthenticated
        claim_type: Role authentication
        grounds:
          - validations[priority 1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 1 sits above the conference-singleton guard and above every
          existence check, so an unauthenticated request gets 401 rather than
          409, 404 or a leaked read: reads and writes alike are refused, and the
          refusal reveals nothing about whether the addressed member exists.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
            - "The trigger calls are issued with neither X-User-Role nor X-User-ID present."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
          trigger:
            - call: "GET /conference"
              payload: {}
              as: NONE
            - call: "POST /venues"
              payload: { name: "Anonymous Field", city: "Nowhere", seating_capacity: 10000, concurrent_event_capacity: 1 }
              as: NONE
            - call: "GET /members/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: NONE
            - call: "POST /venues"
              payload: { name: "Anonymous Field", city: "Nowhere", seating_capacity: 10000, concurrent_event_capacity: 1 }
              as: PlatformAdmin
              as_user_id: "u_adm_1"
              captures: { v_retry_id: $.data.id }
          assert:
            - "each of the three header-less calls returns HTTP 401 with data null and error.error_id == ERR_UNAUTHENTICATED"
            - "the unknown member id returns 401, not 404, because priority 1 precedes priority 8"
            - "the authenticated retry of the identical POST /venues returns HTTP 201 with a fresh id ${v_retry_id} and version 1, so the anonymous attempt persisted nothing"

      - name: corner_peer_role_cannot_perform_another_roles_exclusive_operation
        claim_type: Role permission denial
        grounds:
          - roles.Commissioner
          - roles.FinanceOfficer
          - roles.Treasurer
          - roles.ScheduleCoordinator
          - validations[priority 2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The role model is peer segregation, not a hierarchy: the Commissioner
          cannot open a revenue pool, the FinanceOfficer cannot post the run it
          computed even at the role level, the Treasurer cannot seat a member and
          the ScheduleCoordinator cannot draft an audit report - four 403s that
          no "senior role does everything" implementation would produce. Each
          refusal is checked before any state precondition, so the FinanceOfficer
          gets ERR_UNAUTHORIZED rather than ERR_AUDIT_REPORT_NOT_ISSUED.
        test_recipe:
          setup:
            - "The FY2026 EQUAL_SHARE pool is BOOKS_CLOSED with a COMPUTED FINAL_AUDITED run and no audit report yet."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_p26
            - *c_p26_open
            - *c_p26_cb
            - *c_p26_read
            - *c_r26
          trigger:
            - call: "POST /revenue-pools"
              payload: { conference_id: "${conf_id}", fiscal_year: 2028, pool_type: "MEDIA_RIGHTS", allocation_method: "EQUAL_SHARE", gross_revenue_cents: 100000000, estimated_expense_cents: 0 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /distribution-runs/${r26_id}/post"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Treasurer's Pick College", institution_code: "TPC", admission_path: "PETITIONED", home_venue_id: "${v2_id}", grant_of_rights_through_fiscal_year: 2034 }
              as: Treasurer
              as_user_id: "u_trs_1"
            - call: "POST /audit-reports"
              payload: { conference_id: "${conf_id}", distribution_run_id: "${r26_id}", fiscal_year: 2026, opinion: "UNQUALIFIED", note: "not my job" }
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
          assert:
            - "all four calls return HTTP 403 with error.error_id == ERR_UNAUTHORIZED"
            - "the FinanceOfficer's post attempt returns ERR_UNAUTHORIZED, not ERR_AUDIT_REPORT_NOT_ISSUED or ERR_SEGREGATION_OF_DUTIES, because priority 2 precedes priorities 33 and 56"
            - "DistributionRun.${r26_id}.status is still \"COMPUTED\" with posted_by_user_id null"
            - "GET /revenue-pools returns total_count 1, GET /members total_count 4 and GET /audit-reports total_count 0"

      - name: corner_member_representative_cannot_act_for_another_member
        claim_type: Segregation of duties
        grounds:
          - roles.MemberRepresentative
          - validations[priority 3]
          - errors.ERR_NOT_MEMBER_OWNER
        distinguishing_aspect: |
          MemberRepresentative identity is entity_backed, so ownership is checked
          against both the path id and the body's member_id: North's
          representative is refused 403 when it PATCHes South's profile (path
          mismatch), when it files a bowl appearance under South's id (path
          mismatch) and when it casts South's ballot (body mismatch) - the last
          one is the case a path-only ownership check would wrongly allow.
        test_recipe:
          setup:
            - "The FY2028 ADMIT action for Central Plains University is VOTING and no ballots have been cast."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_mc
            - *c_ma_admit
            - *c_ma_open
            - *c_ma_read
            - call: "GET /members/${m_s_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_s_v: $.data.version }
          trigger:
            - call: "PATCH /members/${m_s_id}"
              payload: { expected_member_version: "${m_s_v}", grant_of_rights_through_fiscal_year: 2040 }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /members/${m_s_id}/bowl-appearances"
              payload: { fiscal_year: 2027, event_name: "Impostor Invitational", event_tier: "BOWL", payout_cents: 5000000, submitted_expense_cents: 1000000, travel_miles: 100, units_claimed: 1 }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
          assert:
            - "the cross-member PATCH returns HTTP 403 with error.error_id == ERR_NOT_MEMBER_OWNER and Member.${m_s_id}.version is still ${m_s_v}"
            - "the cross-member bowl appearance returns HTTP 403 with error.error_id == ERR_NOT_MEMBER_OWNER and GET /members/${m_s_id}/bowl-appearances returns total_count 0"
            - "the ballot whose body names South while X-User-ID is North returns HTTP 403 with error.error_id == ERR_NOT_MEMBER_OWNER, proving the body member_id is checked too"
            - "the ballot North casts for itself returns HTTP 201 and MembershipAction.${ma_id}.cast_weight_bps == 10000"

      - name: corner_proposer_cannot_close_the_vote_it_opened
        claim_type: Segregation of duties
        grounds:
          - validations[priority 33]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.ComplianceOfficer
          - entities.MembershipAction.fields.proposed_by_user_id
        distinguishing_aspect: |
          Closing the vote is a shared operation for Commissioner and
          ComplianceOfficer, so the refusal cannot be role-based: u_com_1 holds
          the closing role yet is refused 409 because it is the recorded
          proposed_by_user_id, while u_cmp_1 - a different user in a different
          role - closes the identical action successfully. The refusal must not
          tally the votes either: status stays VOTING with approval_ratio_bps 0.
        test_recipe:
          setup:
            - "The FY2028 ADMIT action proposed by u_com_1 is VOTING with four FOR ballots cast."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_mc
            - *c_ma_admit
            - *c_ma_open
            - *c_ma_read
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_s_id}", choice: "FOR", expected_action_version: "${ma_v} + 1" }
              as: MemberRepresentative
              as_user_id: "${m_s_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_e_id}", choice: "FOR", expected_action_version: "${ma_v} + 2" }
              as: MemberRepresentative
              as_user_id: "${m_e_id}"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_w_id}", choice: "FOR", expected_action_version: "${ma_v} + 3" }
              as: MemberRepresentative
              as_user_id: "${m_w_id}"
          trigger:
            - call: "POST /membership-actions/${ma_id}/close-voting"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /membership-actions/${ma_id}/close-voting"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          assert:
            - "MembershipAction.${ma_id}.proposed_by_user_id == \"u_com_1\" from the proposal call"
            - "the proposer's close returns HTTP 409 with error.error_id == ERR_SEGREGATION_OF_DUTIES even though Commissioner is a declared role for the endpoint"
            - "after the refusal MembershipAction.${ma_id}.status is still \"VOTING\" with approval_ratio_bps 0 and closed_by_user_id null"
            - "u_cmp_1's close returns HTTP 200 with status \"APPROVED\", cast_weight_bps 40000, for_weight_bps 40000, quorum_met true, approval_ratio_bps 10000 and closed_by_user_id \"u_cmp_1\""

  # ===================================================================
  # SECTION 8 - CROSS-CUTTING COMPLEXITY LAYERS
  # ===================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: corner_occ_stale_version_on_all_four_declared_write_endpoints
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.distribution-run-create-stale-pool
          - concurrency_rules.ballot-cast-stale-action
          - concurrency_rules.reserve-transfer-stale-conference
          - concurrency_rules.member-profile-update-stale-member
        distinguishing_aspect: |
          All four §1.2.1 rules must be wired to their own parent entity and
          their own 412 code: a stale pool version yields ERR_STALE_POOL_VERSION,
          a stale action version ERR_STALE_ACTION_VERSION, a stale conference
          version ERR_STALE_CONFERENCE_VERSION and a stale member version
          ERR_STALE_MEMBER_VERSION - never one shared code and never a 409. Each
          refusal must also leave the parent version unchanged, which is why the
          success half of the instance re-uses the very same captured version and
          still succeeds, and each success then increments that version by one.
        test_recipe:
          setup:
            - "The conference is OPERATING with an APPROVED FY2027 budget and a 12000000 reserve, so the posture is OPEN."
            - "The FY2027 MEDIA_RIGHTS pool is OPEN; the FY2028 ADMIT action for Central Plains University is VOTING."
            - "The current version of the pool, the action, the conference and East Harbor College have all been read."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_mc
            - *c_ma_admit
            - *c_ma_open
            - *c_pool
            - *c_pool_open
            - *c_pool_read
            - call: "GET /membership-actions/${ma_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { ma_v4: $.data.version }
            - call: "GET /conference"
              payload: {}
              as: Treasurer
              as_user_id: "u_trs_1"
              captures: { conf_v4: $.data.version }
            - call: "GET /members/${m_e_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
              captures: { m_e_v4: $.data.version }
          trigger:
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v} - 1", memo: "stale pool view" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v4} - 1" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /conference/reserve-transfers"
              payload: { transfer_type: "CONTRIBUTION", amount_cents: 1000000, expected_conference_version: "${conf_v4} - 1", memo: "stale conference view" }
              as: Treasurer
              as_user_id: "u_trs_1"
            - call: "PATCH /members/${m_e_id}"
              payload: { expected_member_version: "${m_e_v4} - 1", grant_of_rights_through_fiscal_year: 2035 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /revenue-pools/${rp_id}/distribution-runs"
              payload: { variant: "PROVISIONAL", expected_pool_version: "${rp_v}", memo: "current pool view" }
              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { occ_run_id: $.data.id }
            - call: "POST /membership-actions/${ma_id}/ballots"
              payload: { member_id: "${m_n_id}", choice: "FOR", expected_action_version: "${ma_v4}" }
              as: MemberRepresentative
              as_user_id: "${m_n_id}"
            - call: "POST /conference/reserve-transfers"
              payload: { transfer_type: "CONTRIBUTION", amount_cents: 1000000, expected_conference_version: "${conf_v4}", memo: "current conference view" }
              as: Treasurer
              as_user_id: "u_trs_1"
            - call: "PATCH /members/${m_e_id}"
              payload: { expected_member_version: "${m_e_v4}", grant_of_rights_through_fiscal_year: 2035 }
              as: Commissioner
              as_user_id: "u_com_1"
          assert:
            - "the stale run attempt returns HTTP 412 with error.error_id == ERR_STALE_POOL_VERSION and creates no DistributionRun"
            - "the stale ballot returns HTTP 412 with error.error_id == ERR_STALE_ACTION_VERSION and casts no Ballot"
            - "the stale reserve transfer returns HTTP 412 with error.error_id == ERR_STALE_CONFERENCE_VERSION and leaves reserve_balance_cents at 12000000"
            - "the stale member PATCH returns HTTP 412 with error.error_id == ERR_STALE_MEMBER_VERSION and leaves grant_of_rights_through_fiscal_year at 2032"
            - "each retry at the exact captured version succeeds, proving no refusal bumped its parent: RevenuePool.${rp_id}.version == ${rp_v} + 1, MembershipAction.${ma_id}.version == ${ma_v4} + 1, Conference.version == ${conf_v4} + 1 and Member.${m_e_id}.version == ${m_e_v4} + 1"
            - "DistributionRun.${occ_run_id}.net_pool_cents == 480000000, .reserve_draw_cents == 6000000 and .total_weight_bps == 40000 - Central at 0 bps receives no line at all"

      - name: corner_cascading_side_effects_depth_five_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /championship-events/{id}/settle]
        excluded_because:
          difficulty_instance: transitive_cascade / championship_settlement_invalidates_computed_run_depth_five
          rationale: "That instance walks the full five-hop chain - settle, pool gross restated, pool reverted to DRAFT with audited cleared, COMPUTED run SUPERSEDED, its lines VOIDED - and asserts every hop end to end."

      - name: corner_dual_variant_calculation_layer_delta_on_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.distribution_share_allocation
        excluded_because:
          difficulty_instance: dual_variant_calc / rolling_six_year_vs_current_year_only_unit_valuation
          rationale: "That instance switches the unit-valuation variant by filing a withdrawal notice and asserts the exact delta between the ROLLING_SIX_YEAR and CURRENT_YEAR_ONLY results on identical unit data."

      - name: corner_rate_threshold_reserve_posture_at_both_boundaries
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.reserve_posture_derivation
        excluded_because:
          difficulty_instance: boundary_precision_check / reserve_funded_ratio_exactly_6000_bps_is_open
          rationale: "That instance tests the funded-ratio thresholds one cent either side of both POSTURE_RESTRICTED_BPS and POSTURE_FROZEN_BPS, which is the cumulative-threshold boundary claim for this layer."

  # ===================================================================
  # SECTION 9 - CONSISTENCY MODEL
  # ===================================================================
  - section: consistency model
    instances:

      - name: corner_immediate_visibility_of_derived_fields_within_the_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /bowl-appearances/{id}/approve]
          - calculations.bowl_expense_reimbursement
          - calculations.postseason_unit_valuation
        distinguishing_aspect: |
          The consistency model is immediate, so the approve response itself must
          already carry the five reimbursement figures - no follow-up read is
          needed to see them - and every ancestor counter the approval touched
          must be correct on the very next request rather than converging later:
          escrow 4800000, unit count 2, and a member valuation of 68000000 that
          depends on units minted inside the same call.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
            - "North's FY2027 tournament appearance (payout 12000000, submitted 9500000, 1400 miles, 2 units) is UNDER_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_ba_n
            - call: "POST /bowl-appearances/${ba_n_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
          trigger:
            - call: "POST /bowl-appearances/${ba_n_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_cmp_1"
            - call: "GET /conference"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - call: "GET /members/${m_n_id}/postseason-unit-valuation"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
            - call: "GET /bowl-appearances/${ba_n_id}/postseason-units"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
          assert:
            - "the approve response body itself carries status \"APPROVED\", allowable_expense_cents 8000000, travel_allowance_cents 133000, reimbursement_ceiling_cents 7200000, reimbursed_cents 7200000 and residual_to_pool_cents 4800000"
            - "the immediately following conference read shows escrow_balance_cents == 4800000 and validated_postseason_unit_count == 2 with no intervening call"
            - "the valuation read returns validated_unit_count == 2 and valuation_cents == 68000000, derived from units that did not exist before the approve call"
            - "the unit listing returns 2 rows, both status \"VALIDATED\" with fiscal_year 2027 and unit_index 1 and 2"
