            - "BusUnit.${unit_august_id}.service_status and BusUnit.${unit_propane_id}.service_status are both still NONE"
            - "the dealer holds 3 open tasks -> RESTRICTED, so all three escalate: escalated_task_count == 3"
            - "kits: hop 1 reserves 3 of 5; two escalations take the last 2 (reserved_kits == 5, available_kits == 0) and the third finds available_kits 0, so kit_shortfall_count == 1 and that task keeps kits_reserved 1"
            - "the sum of kits_reserved over the three tasks == 5 == total_kits, independent of which task was escalated last"
            - "the second launch fails 409 ERR_CAMPAIGN_NOT_DRAFT and no additional RemedyTask is created"

      - name: dealer_prep_fee_is_rounded_per_line_item
        claim_type: correct_result
        grounds:
          - calculations.bid_unit_price
        excluded_because:
          difficulty_instance: "combinatorial_formula / dealer_prep_fee_rounded_per_line_item_not_on_line_total"
          rationale: |
            The exact per-line rounding of the 2.375% prep fee, and the divergence from the sum-then-round
            variant, is the entire subject of that §1.8 instance with its pinned 14,641,571 unit price.

      - name: contract_total_walks_the_volume_and_freight_tiers
        claim_type: tiered_pricing
        grounds:
          - calculations.contract_total
        excluded_because:
          difficulty_instance: "combinatorial_formula / contract_total_freight_tier_keyed_on_discounted_subtotal"
          rationale: |
            The volume-discount bands and the freight tier keyed on the DISCOUNTED subtotal (including the
            case where the pre-discount subtotal would have chosen a different tier) are already pinned
            there with worked totals.

      - name: derated_route_range_keeps_one_decimal_place
        claim_type: precision
        grounds:
          - calculations.range_validation.precision
        excluded_because:
          difficulty_instance: "boundary_precision_check / route_range_inclusive_boundary_at_one_decimal_place"
          rationale: |
            Truncation to one decimal place and the inclusive >= comparison at the exact boundary is that
            instance's claim, including the value that passes at equality and the neighbour that fails.

      - name: electric_and_liquid_fuel_range_formulas_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.range_validation
        excluded_because:
          difficulty_instance: "dual_variant_calc / range_validation_electric_versus_liquid_fuel_variant"
          rationale: |
            Both branches (HVAC-loaded kWh consumption versus gallons x mpg) are computed side by side on the
            same model and terrain there, which is strictly stronger than any single-branch corner probe.

      - name: award_selects_the_final_price_variant
        claim_type: variant_selection
        grounds:
          - calculations.bid_unit_price
        excluded_because:
          difficulty_instance: "dual_variant_calc / bid_price_provisional_firm_versus_final_award_variant"
          rationale: |
            Which variant applies at submit versus at award, and the escalation factor that separates them,
            is that instance's whole point; the corner set only reuses its provisional literal.

  - section: validations
    instances:

      - name: promised_delivery_date_passes_at_equality_and_fails_one_day_later
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=52]
          - errors[ERR_PROMISE_EXCEEDS_REQUIRED_DATE]
          - endpoints[POST /bids/{id}/award]
        distinguishing_aspect: |
          The award-time promise check is `promised_delivery_date <= required_delivery_date`, so the same
          bid is awarded successfully when the promise equals the district's required date and refused when
          it slips by exactly one day. The refused award leaves the bid SUBMITTED and the solicitation
          CLOSED, so the second attempt can proceed on the untouched aggregate.
        test_recipe:
          setup:
            - "TX fixture; SOL-TX-110 for 1 unit with required_delivery_date 2026-12-01, bid submitted at clock 2026-08-15 and the solicitation CLOSED at clock 2026-09-01"
          setup_api_calls:
            - call: "POST /bus-models"
              payload: { model_code: "TYPE_C_CONV", body_class: "TYPE_C", base_seat_capacity: 71, base_emergency_exit_count: 5, base_price_cents: 12750000, body_joint_strength_kn: 58.0, max_battery_bays: 6, curb_weight_lb: 21500 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { model_c_id: $.data.id }
            - call: "POST /propulsion-packages"
              payload: { package_code: "DSL-100", compatible_bus_model_id: "${model_c_id}", propulsion_type: "DIESEL", option_price_cents: 1250000, cold_weather_derate_pct: 0.03, reserve_floor_pct: 0.05, fuel_capacity_gal: 100.0, rated_mpg: 7.2 }
