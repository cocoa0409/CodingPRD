            - "CrashEvent.${ce_nc}.severity_score still computed (67.0) — the event is persisted as an audit record, not dropped"

      - name: insurance_sharing_grant_requires_data_collection_consent
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=9]
          - state_machines.DataConsent.REVOKED_to_GRANTED
