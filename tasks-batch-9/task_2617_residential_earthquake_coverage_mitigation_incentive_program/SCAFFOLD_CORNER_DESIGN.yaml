            - call: "POST /eqp/_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eqp/catastrophe-events"
              payload: { event_code: "EQ-2026-LIFE", magnitude: 6.5, epicenter_county_code: "06075", occurred_at: "2026-09-05T00:00:00Z", retention_cents: 100000000 }
