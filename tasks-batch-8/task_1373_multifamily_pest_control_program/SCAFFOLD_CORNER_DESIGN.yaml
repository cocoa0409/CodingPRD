        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Default pagination (limit 10, offset 0) on 12 units returns 10 rows with total_count 12 and has_more true; limit=5&offset=10 returns 2 rows with has_more false; floor=1 filter narrows the set."
