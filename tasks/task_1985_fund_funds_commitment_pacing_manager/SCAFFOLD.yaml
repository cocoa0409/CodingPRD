scenario: |
  1985. Fund-of-Funds Commitment Pacing & Manager Selection (institutional
  fund-of-funds): pacing model to target allocation & vintage diversification,
  manager due diligence & investment committee approval, commitment sizing &
  concentration limits, capital call forecasting & liquidity buffer, secondary
  purchase/sale evaluation, underlying fund reporting aggregation & look-through
  exposure, valuation lag & performance reporting, fee layering analysis.

domain_name: fund-of-funds-pacing
api_prefix: /fof

complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: quota / allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: FoFProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_name, type: string, source: input, description: "Program display name" }
      - { name: base_currency, type: enum, source: input, description: "USD | EUR | GBP — accounting currency for all aggregates" }
      - { name: total_nav_budget, type: number, source: input, description: "Total program capital budget in base currency; must be > 0" }
      - { name: strategy_cap_pct, type: number, source: input, description: "Max share of total_nav_budget that ACTIVE or EXECUTED commitments in any single strategy may occupy; 0 < x <= 1" }
      - { name: manager_cap_pct, type: number, source: input, description: "Max share of total_nav_budget committed to any single manager across all vehicles; 0 < x <= 1" }
      - { name: max_vintage_band_years, type: integer, source: input, description: "Max span in years between earliest and latest vintage_year among EXECUTED commitments; >= 1" }
      - { name: liquidity_buffer_min, type: number, source: input, description: "Minimum unrestricted_cash the program must retain after any cash outflow; >= 0" }
      - { name: overdue_grace_days, type: integer, source: input, description: "Days after a capital call due_date before it flips to OVERDUE; >= 0" }
      - { name: secondary_premium_cap_pct, type: number, source: input, description: "Max (price - nav_basis)/nav_basis allowed on a secondary PURCHASE; 0 <= x <= 1" }
      - { name: secondary_discount_cap_pct, type: number, source: input, description: "Max (nav_basis - price)/nav_basis allowed on a secondary SALE; 0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SUSPENDED | CLOSED" }
      - { name: unrestricted_cash, type: number, source: computed, description: "Current unrestricted cash = sum of signed CashLedgerEntry amounts; recomputed on every ledger append" }
      - { name: committed_total, type: number, source: computed, description: "Sum of sized_amount for Commitment rows in status EXECUTED" }
      - { name: deployed_total, type: number, source: computed, description: "Sum of amount on CapitalCall rows in status PAID" }
      - { name: returned_total, type: number, source: computed, description: "Sum of amount on Distribution rows in status RECEIVED" }
      - { name: unfunded_total, type: number, source: computed, description: "committed_total - deployed_total + secondary_purchase_unfunded_total" }
      - { name: secondary_purchase_unfunded_total, type: number, source: computed, description: "Sum of unfunded_assumed on SecondaryBid rows in status SETTLED with side PURCHASE" }
      - { name: posture, type: enum, source: computed, description: "Derived gating posture: NORMAL | RESTRICTED | FROZEN; see calculations.program_posture" }

  - name: PacingPlan
    parent: FoFProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; owning program" }
      - { name: plan_label, type: string, source: input, description: "Human label, unique within program" }
      - { name: horizon_years, type: integer, source: input, description: "Number of vintage years the plan spans; >= 1" }
      - { name: start_vintage_year, type: integer, source: input, description: "First vintage year targeted by the plan; >= 2000" }
      - { name: target_strategy_mix, type: array, source: input, description: "List of {strategy, weight} objects; weights must sum to exactly 1.0 across at most 4 entries" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | ARCHIVED" }
      - { name: target_commit_by_year, type: array, source: computed, description: "Per-year deployment targets produced by calculations.pacing_targets; one row per vintage year in plan" }
      - { name: projected_total_commit, type: number, source: computed, description: "Sum of target_commit_by_year amounts" }

  - name: Manager
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Manager legal name; globally unique" }
      - { name: domicile_country, type: string, source: input, description: "ISO-3166 alpha-2 country code" }
      - { name: relationship_since_year, type: integer, source: input, description: "First year program invested with this manager; >= 1980" }
      - { name: status, type: enum, source: system, description: "PROSPECT | APPROVED | SUSPENDED | EXITED" }

  - name: FundVehicle
    parent: Manager
    common_fields: true
    fields:
      - { name: manager_id, type: string, source: system, description: "FK -> Manager.id; managing entity" }
      - { name: fund_name, type: string, source: input, description: "Fund name, unique within manager" }
      - { name: strategy, type: enum, source: input, description: "BUYOUT | VENTURE | GROWTH | CREDIT | REAL_ASSETS | SECONDARIES" }
      - { name: vintage_year, type: integer, source: input, description: "Declared vintage year; >= 2000" }
      - { name: fund_size_target, type: number, source: input, description: "Target fund size; > 0" }
      - { name: mgmt_fee_rate_early, type: number, source: input, description: "Annual management fee rate during investment period; 0 < x <= 0.05" }
      - { name: mgmt_fee_rate_late, type: number, source: input, description: "Annual management fee rate after investment period; 0 < x <= 0.05" }
      - { name: investment_period_years, type: integer, source: input, description: "Years from vintage during which early fee rate applies; >= 1" }
      - { name: carry_rate, type: number, source: input, description: "Carried interest rate on profits above hurdle; 0 <= x <= 0.30" }
      - { name: hurdle_rate, type: number, source: input, description: "Preferred return hurdle; 0 <= x <= 0.15" }
      - { name: status, type: enum, source: system, description: "SCREENING | IN_DILIGENCE | APPROVED | DECLINED | CLOSED_TO_NEW" }

  - name: DueDiligenceReview
    parent: FundVehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> FundVehicle.id; review subject" }
      - { name: round_index, type: integer, source: computed, description: "Monotonic review round per vehicle starting at 1" }
      - { name: score_strategy_fit, type: number, source: input, description: "Analyst score 0..100" }
      - { name: score_track_record, type: number, source: input, description: "Analyst score 0..100" }
      - { name: score_operations, type: number, source: input, description: "Analyst score 0..100" }
      - { name: score_compliance, type: number, source: input, description: "Analyst score 0..100" }
      - { name: composite_score, type: number, source: computed, description: "Weighted score from calculations.dd_composite_score" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | INFO_REQUESTED | COMPLETED | WITHDRAWN" }

  - name: InvestmentProposal
    parent: FundVehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> FundVehicle.id; proposed vehicle" }
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; program committing capital" }
      - { name: pacing_plan_id, type: string, source: input, description: "FK -> PacingPlan.id; the APPROVED pacing plan this proposal draws against" }
      - { name: proposed_amount, type: number, source: input, description: "Requested commitment amount; > 0" }
      - { name: recommended_by_analyst_id, type: string, source: system, description: "Analyst (entity-backed) who created the proposal; set from X-User-ID at creation" }
      - { name: concentration_strategy_pct, type: number, source: computed, description: "Post-trade strategy share computed by calculations.concentration_check" }
      - { name: concentration_manager_pct, type: number, source: computed, description: "Post-trade manager share computed by calculations.concentration_check" }
      - { name: status, type: enum, source: system, description: "DRAFT | RECOMMENDED | IC_APPROVED | IC_REJECTED | WITHDRAWN" }

  - name: Commitment
    parent: FoFProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; committing program" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> FundVehicle.id; destination vehicle" }
      - { name: proposal_id, type: string, source: system, description: "FK -> InvestmentProposal.id; nullable — null only for commitments created by a secondary PURCHASE settle" }
      - { name: sized_amount, type: number, source: input, description: "Final commitment size; > 0; may differ from proposed_amount within +/-10%" }
      - { name: unfunded_amount, type: number, source: computed, description: "sized_amount - sum(PAID capital calls); reduced further only via reduction events" }
      - { name: status, type: enum, source: system, description: "PENDING_DOCS | EXECUTED | REDUCED | CANCELLED" }
      - { name: executed_at, type: datetime, source: system, description: "Set when status becomes EXECUTED" }

  - name: CapitalCall
    parent: Commitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "FK -> Commitment.id; funding commitment" }
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; denormalized for ledger queries" }
      - { name: call_number, type: integer, source: computed, description: "Per-commitment monotonic counter starting at 1" }
      - { name: amount, type: number, source: input, description: "Call amount; > 0" }
      - { name: purpose, type: enum, source: input, description: "INVESTMENT | FEES | EXPENSES" }
      - { name: issued_on, type: datetime, source: system, description: "Server clock time at issuance" }
      - { name: due_date, type: datetime, source: input, description: "Payment deadline; must be strictly after issued_on" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | OVERDUE | CANCELLED" }

  - name: Distribution
    parent: Commitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "FK -> Commitment.id; distributing commitment" }
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; denormalized" }
      - { name: amount, type: number, source: input, description: "Distribution amount; > 0" }
      - { name: distribution_type, type: enum, source: input, description: "RETURN_OF_CAPITAL | GAIN | INCOME" }
      - { name: received_at, type: datetime, source: input, description: "Date cash was received" }
      - { name: status, type: enum, source: system, description: "PENDING | RECEIVED | CANCELLED" }

  - name: CashLedgerEntry
    parent: FoFProgram
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; ledger owner" }
      - { name: entry_kind, type: enum, source: system, description: "CONTRIBUTION | CAPITAL_CALL_PAYMENT | DISTRIBUTION_RECEIPT | SECONDARY_SETTLEMENT_OUT | SECONDARY_SETTLEMENT_IN | MANUAL_ADJUSTMENT" }
      - { name: amount, type: number, source: system, description: "Signed amount; positive = cash in, negative = cash out" }
      - { name: ref_entity, type: string, source: system, description: "Entity type of source row (CapitalCall | Distribution | SecondaryBid | null)" }
      - { name: ref_id, type: string, source: system, description: "Id of source row; null for CONTRIBUTION and MANUAL_ADJUSTMENT" }
      - { name: note, type: string, source: input, description: "Free-text note for manual entries" }
      - { name: balance_after, type: number, source: computed, description: "Running unrestricted_cash immediately after this entry" }

  - name: SecondaryBid
    parent: FoFProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; transacting program" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> FundVehicle.id; underlying vehicle traded" }
      - { name: side, type: enum, source: input, description: "PURCHASE (program buys a position) | SALE (program sells its position)" }
      - { name: nav_basis, type: number, source: input, description: "Latest reported NAV basis for the position; > 0" }
      - { name: price, type: number, source: input, description: "Agreed transaction price; > 0" }
      - { name: unfunded_assumed, type: number, source: input, description: "Unfunded commitment transferred with the position; >= 0; required for PURCHASE, must be 0 for SALE" }
      - { name: pricing_deviation_pct, type: number, source: computed, description: "(price - nav_basis)/nav_basis, signed" }
      - { name: linked_commitment_id, type: string, source: input, description: "FK -> Commitment.id; required for SALE (the program's own position being sold); must be null for PURCHASE" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED | SETTLED | REJECTED | WITHDRAWN" }

  - name: HoldingSnapshot
    parent: Commitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: system, description: "FK -> Commitment.id; reporting commitment" }
      - { name: vehicle_id, type: string, source: system, description: "FK -> FundVehicle.id; denormalized for roll-ups" }
      - { name: as_of_quarter, type: string, source: input, description: "Quarter label YYYY-Qn; unique per commitment" }
      - { name: reported_nav, type: number, source: input, description: "GP-reported NAV for the program's stake; >= 0" }
      - { name: reported_at, type: datetime, source: system, description: "Server clock time when the snapshot was recorded" }
      - { name: is_final, type: boolean, source: computed, description: "True once status reaches FINAL; false while PROVISIONAL or after RESTATED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | RESTATED" }

  - name: LookThroughLine
    parent: HoldingSnapshot
    common_fields: false
    fields:
      - { name: snapshot_id, type: string, source: system, description: "FK -> HoldingSnapshot.id; parent snapshot" }
      - { name: sector, type: enum, source: input, description: "TECH | HEALTHCARE | INDUSTRIALS | CONSUMER | FINANCIALS | ENERGY | OTHER" }
      - { name: geography, type: enum, source: input, description: "NA | EU | APAC | LATAM | MEA" }
      - { name: exposure_amount, type: number, source: input, description: "Look-through exposure in base currency; >= 0" }

  - name: ValuationReport
    parent: FoFProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> FoFProgram.id; reporting program" }
      - { name: as_of_quarter, type: string, source: input, description: "Quarter label YYYY-Qn; unique per program" }
      - { name: nav_provisional, type: number, source: computed, description: "NAV from provisional snapshots only, per calculations.nav_rollup" }
      - { name: nav_final, type: number, source: computed, description: "NAV from final snapshots only (with lag policy), per calculations.nav_rollup" }
      - { name: nav_reported, type: number, source: computed, description: "Published NAV = nav_final if any FINAL snapshot exists for the quarter, else nav_provisional" }
      - { name: irr_provisional_pct, type: number, source: computed, description: "IRR using provisional NAV as terminal value" }
      - { name: irr_final_pct, type: number, source: computed, description: "IRR using final NAV as terminal value" }
      - { name: total_fee_burden_pct, type: number, source: computed, description: "Fee-layering output from calculations.fee_layering" }
      - { name: status, type: enum, source: system, description: "OPEN | PUBLISHED | RESTATED" }

  - name: StaffUser
    parent: null
    common_fields: false
    fields:
      - { name: display_name, type: string, source: input, description: "Full name of the staff member" }
      - { name: staff_role, type: enum, source: input, description: "ANALYST | IC_MEMBER | OPS_ANALYST — maps the row to the entity-backed role it backs" }
      - { name: email, type: string, source: input, description: "Work email; NOT unique — two StaffUser rows sharing an email model the same person holding two role appointments (drives the SoD check)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FoFProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: POST /fof/programs/{id}/open
        actor: CIO
        preconditions:
          - "unrestricted_cash >= liquidity_buffer_min (ERR_BUFFER_BREACH)"
          - "At least one CashLedgerEntry of kind CONTRIBUTION exists"
        side_effects:
          - "posture recomputed via calculations.program_posture"
      - from: OPEN
        to: SUSPENDED
        trigger: POST /fof/programs/{id}/suspend
        actor: CIO
        preconditions: []
        side_effects:
          - "posture -> FROZEN while SUSPENDED; all posture-gated writes rejected"
      - from: SUSPENDED
        to: OPEN
        trigger: POST /fof/programs/{id}/resume
        actor: CIO
        preconditions:
          - "unrestricted_cash >= liquidity_buffer_min (ERR_BUFFER_BREACH)"
        side_effects:
          - "posture recomputed via calculations.program_posture"
      - from: OPEN
        to: CLOSED
        trigger: POST /fof/programs/{id}/close
        actor: CIO
        preconditions:
          - "No Commitment in status PENDING_DOCS or EXECUTED with unfunded_amount > 0"
          - "No CapitalCall in status ISSUED or OVERDUE"
          - "No SecondaryBid in status PROPOSED, COUNTERED, or ACCEPTED"
        side_effects:
          - "All PacingPlan rows in status APPROVED -> ARCHIVED"
          - "All InvestmentProposal rows in status DRAFT or RECOMMENDED -> WITHDRAWN"
          - "posture -> FROZEN"

  - entity: PacingPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: POST /fof/programs/{id}/pacing-plans/{planId}/approve
        actor: CIO
        preconditions:
          - "FoFProgram.status == OPEN"
          - "FoFProgram.posture != FROZEN"
          - "target_strategy_mix weights sum to 1.0 (ERR_MIX_SUM_INVALID)"
          - "Every strategy in target_strategy_mix is one of the six declared strategies"
          - "No other PacingPlan for this program is currently APPROVED (ERR_ACTIVE_PLAN_EXISTS)"
        side_effects:
          - "target_commit_by_year populated via calculations.pacing_targets"
          - "projected_total_commit recomputed"
      - from: APPROVED
        to: SUPERSEDED
        trigger: POST /fof/programs/{id}/pacing-plans/{planId}/supersede
        actor: CIO
        preconditions:
          - "FoFProgram.status == OPEN"
          - "replacement_plan_id references a PacingPlan of the same program in status DRAFT (ERR_PLAN_NOT_DRAFT)"
        side_effects:
          - "replacement plan transitions DRAFT -> APPROVED and runs pacing_targets"
          - "InvestmentProposal rows in status DRAFT tied to this plan -> WITHDRAWN"
          - "increments FoFProgram.version by 1"
      - from: APPROVED
        to: ARCHIVED
        trigger: "system (automatic when FoFProgram closes)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Manager
    initial_state: PROSPECT
    terminal_states: [EXITED]
    transitions:
      - from: PROSPECT
        to: APPROVED
        trigger: POST /fof/managers/{id}/approve
        actor: CIO
        preconditions:
          - "At least one FundVehicle of this manager has reached status APPROVED (ERR_NO_APPROVED_VEHICLE)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: POST /fof/managers/{id}/suspend
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "All FundVehicle rows of this manager in status IN_DILIGENCE -> DECLINED"
          - "All DueDiligenceReview rows on ANY of this manager's vehicles in status DRAFT/SUBMITTED/INFO_REQUESTED -> WITHDRAWN"
          - "All InvestmentProposal rows on ANY of this manager's vehicles in status DRAFT/RECOMMENDED -> WITHDRAWN"
      - from: SUSPENDED
        to: APPROVED
        trigger: POST /fof/managers/{id}/reinstate
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXITED
        trigger: POST /fof/managers/{id}/exit
        actor: CIO
        preconditions:
          - "No Commitment on any of the manager's vehicles in status PENDING_DOCS or EXECUTED with unfunded_amount > 0"
        side_effects:
          - "All FundVehicle rows of this manager not yet CLOSED_TO_NEW -> CLOSED_TO_NEW"

  - entity: FundVehicle
    initial_state: SCREENING
    terminal_states: [DECLINED, CLOSED_TO_NEW]
    transitions:
      - from: SCREENING
        to: IN_DILIGENCE
        trigger: POST /fof/managers/{id}/vehicles/{vehicleId}/begin-diligence
        actor: Analyst
        preconditions:
          - "Manager.status == PROSPECT or APPROVED (ERR_MANAGER_NOT_ELIGIBLE)"
        side_effects:
          - "A DueDiligenceReview round (round_index = 1) is created in status DRAFT"
      - from: IN_DILIGENCE
        to: APPROVED
        trigger: POST /fof/managers/{id}/vehicles/{vehicleId}/approve-vehicle
        actor: InvestmentCommittee
        preconditions:
          - "Latest DueDiligenceReview (highest round_index) has status COMPLETED"
          - "Latest review composite_score >= 70 (ERR_DD_SCORE_TOO_LOW)"
        side_effects:
          - "If Manager.status == PROSPECT, Manager transitions PROSPECT -> APPROVED"
      - from: IN_DILIGENCE
        to: DECLINED
        trigger: POST /fof/managers/{id}/vehicles/{vehicleId}/decline-vehicle
        actor: InvestmentCommittee
        preconditions: []
        side_effects:
          - "All non-terminal DueDiligenceReview rows on this vehicle -> WITHDRAWN"
      - from: APPROVED
        to: CLOSED_TO_NEW
        trigger: POST /fof/managers/{id}/vehicles/{vehicleId}/close-to-new
        actor: InvestmentCommittee
        preconditions:
          - "No InvestmentProposal on this vehicle in status DRAFT or RECOMMENDED"
        side_effects: []

  - entity: DueDiligenceReview
    initial_state: DRAFT
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /fof/vehicles/{id}/dd-reviews/{reviewId}/submit
        actor: Analyst
        preconditions:
          - "All four score_* fields are non-null (ERR_INVALID_REQUEST)"
        side_effects:
          - "composite_score computed via calculations.dd_composite_score"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: POST /fof/vehicles/{id}/dd-reviews/{reviewId}/request-info
        actor: InvestmentCommittee
        preconditions: []
        side_effects: []
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: POST /fof/vehicles/{id}/dd-reviews/{reviewId}/resubmit
        actor: Analyst
        preconditions: []
        side_effects:
          - "composite_score recomputed via calculations.dd_composite_score"
        note: "Cycle SUBMITTED -> INFO_REQUESTED -> SUBMITTED may repeat; each resubmit recomputes the composite"
      - from: SUBMITTED
        to: COMPLETED
        trigger: POST /fof/vehicles/{id}/dd-reviews/{reviewId}/complete
        actor: InvestmentCommittee
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /fof/vehicles/{id}/dd-reviews/{reviewId}/withdraw
        actor: Analyst
        preconditions: []
        side_effects: []

  - entity: InvestmentProposal
    initial_state: DRAFT
    terminal_states: [IC_REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: RECOMMENDED
        trigger: POST /fof/proposals/{id}/recommend
        actor: Analyst
        preconditions:
          - "FoFProgram.status == OPEN and posture == NORMAL (ERR_POSTURE_GATED)"
          - "FundVehicle.status == APPROVED (ERR_VEHICLE_NOT_APPROVED)"
          - "Manager.status == APPROVED (ERR_MANAGER_NOT_ELIGIBLE)"
          - "pacing_plan_id references a PacingPlan in status APPROVED for this program (ERR_PLAN_NOT_APPROVED)"
          - "Acting analyst's X-User-ID == recommended_by_analyst_id (analyst who created the proposal)"
        side_effects:
          - "concentration_strategy_pct and concentration_manager_pct computed via calculations.concentration_check and stored"
      - from: RECOMMENDED
        to: IC_APPROVED
        trigger: POST /fof/proposals/{id}/ic-approve
        actor: InvestmentCommittee
        preconditions:
          - "FoFProgram.status == OPEN and posture == NORMAL (ERR_POSTURE_GATED)"
          - "concentration_strategy_pct <= FoFProgram.strategy_cap_pct (ERR_STRATEGY_CAP_EXCEEDED)"
          - "concentration_manager_pct <= FoFProgram.manager_cap_pct (ERR_MANAGER_CAP_EXCEEDED)"
          - "proposed_amount within remaining pacing capacity for the vehicle's vintage year under the APPROVED plan (ERR_PACING_CAPACITY_EXCEEDED)"
          - "Segregation of duties: acting IC member's StaffUser.email != the recommending analyst's StaffUser.email (ERR_SOD_VIOLATION)"
        side_effects:
          - "A Commitment is created in status PENDING_DOCS with sized_amount = proposed_amount"
      - from: RECOMMENDED
        to: IC_REJECTED
        trigger: POST /fof/proposals/{id}/ic-reject
        actor: InvestmentCommittee
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /fof/proposals/{id}/withdraw
        actor: Analyst
        preconditions:
          - "Acting analyst's X-User-ID == recommended_by_analyst_id"
        side_effects: []

  - entity: Commitment
    initial_state: PENDING_DOCS
    terminal_states: [REDUCED, CANCELLED]
    transitions:
      - from: PENDING_DOCS
        to: EXECUTED
        trigger: POST /fof/programs/{id}/commitments/{commitmentId}/execute
        actor: OperationsAnalyst
        preconditions:
          - "FoFProgram.status == OPEN and posture == NORMAL (ERR_POSTURE_GATED)"
          - "sized_amount <= proposed_amount * 1.10 and sized_amount >= proposed_amount * 0.90 (ERR_SIZE_OUT_OF_BAND)"
          - "Vintage band check: |vintage_year - min(existing EXECUTED vintage years)| and |vintage_year - max(existing EXECUTED vintage years)| do not exceed FoFProgram.max_vintage_band_years (ERR_VINTAGE_BAND_BREACH)"
          - "Program-level unfunded after execution leaves projected liquidity coverage >= buffer (ERR_BUFFER_BREACH)"
        side_effects:
          - "executed_at set to server clock"
          - "FoFProgram.committed_total, unfunded_total recomputed; FoFProgram.version incremented"
      - from: EXECUTED
        to: REDUCED
        trigger: POST /fof/programs/{id}/commitments/{commitmentId}/reduce
        actor: OperationsAnalyst
        preconditions:
          - "reduce_to >= sum(PAID capital calls on this commitment) (ERR_REDUCE_BELOW_PAID)"
        side_effects:
          - "sized_amount set to reduce_to; unfunded_amount recomputed"
          - "FoFProgram.committed_total and unfunded_total recomputed; FoFProgram.version incremented"
      - from: PENDING_DOCS
        to: CANCELLED
        trigger: POST /fof/programs/{id}/commitments/{commitmentId}/cancel
        actor: OperationsAnalyst
        preconditions: []
        side_effects:
          - "FoFProgram aggregates recomputed; version incremented"

  - entity: CapitalCall
    initial_state: ISSUED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: POST /fof/calls/{callId}/pay
        actor: OperationsAnalyst
        preconditions:
          - "Commitment.status == EXECUTED (ERR_COMMITMENT_NOT_EXECUTED)"
          - "amount <= commitment.unfunded_amount (ERR_OVERFUNDED)"
          - "Program unrestricted_cash - amount >= liquidity_buffer_min (ERR_BUFFER_BREACH)"
        side_effects:
          - "CashLedgerEntry appended: kind CAPITAL_CALL_PAYMENT, amount = -amount"
          - "Commitment.unfunded_amount -= amount; Commitment.version incremented"
          - "FoFProgram.deployed_total and unrestricted_cash recomputed; FoFProgram.version incremented; posture recomputed"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (clock sweep when current_utc > due_date + overdue_grace_days)"
        actor: system
        preconditions: []
        side_effects:
          - "posture recomputed via calculations.program_posture (OVERDUE calls force RESTRICTED)"
        note: "OVERDUE -> PAID remains allowed; paying an overdue call restores posture"
      - from: OVERDUE
        to: PAID
        trigger: POST /fof/calls/{callId}/pay
        actor: OperationsAnalyst
        preconditions:
          - "Same preconditions as ISSUED -> PAID"
        side_effects:
          - "Same side effects as ISSUED -> PAID; posture recomputed"
      - from: ISSUED
        to: CANCELLED
        trigger: POST /fof/calls/{callId}/cancel
        actor: OperationsAnalyst
        preconditions:
          - "Current server clock time <= due_date (ERR_CALL_OVERDUE)"
        side_effects: []

  - entity: Distribution
    initial_state: PENDING
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: POST /fof/distributions/{distributionId}/receive
        actor: OperationsAnalyst
        preconditions:
          - "Commitment.status == EXECUTED or REDUCED (ERR_COMMITMENT_NOT_EXECUTED)"
        side_effects:
          - "CashLedgerEntry appended: kind DISTRIBUTION_RECEIPT, amount = +amount"
          - "FoFProgram.returned_total and unrestricted_cash recomputed; version incremented; posture recomputed"
      - from: PENDING
        to: CANCELLED
        trigger: POST /fof/distributions/{distributionId}/cancel
        actor: OperationsAnalyst
        preconditions: []
        side_effects: []

  - entity: SecondaryBid
    initial_state: PROPOSED
    terminal_states: [SETTLED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: POST /fof/programs/{id}/secondary-bids/{bidId}/counter
        actor: InvestmentCommittee
        preconditions:
          - "FoFProgram.posture != FROZEN"
        side_effects: []
      - from: COUNTERED
        to: ACCEPTED
        trigger: POST /fof/programs/{id}/secondary-bids/{bidId}/accept
        actor: CIO
        preconditions:
          - "FoFProgram.status == OPEN and posture == NORMAL (ERR_POSTURE_GATED)"
          - "PURCHASE: pricing_deviation_pct <= secondary_premium_cap_pct (ERR_PREMIUM_CAP_EXCEEDED)"
          - "SALE: -pricing_deviation_pct <= secondary_discount_cap_pct (ERR_DISCOUNT_CAP_EXCEEDED)"
          - "SALE: linked_commitment_id references a Commitment in status EXECUTED of this program and vehicle"
        side_effects: []
      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /fof/programs/{id}/secondary-bids/{bidId}/accept
        actor: CIO
        preconditions:
          - "Same preconditions as COUNTERED -> ACCEPTED"
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: POST /fof/programs/{id}/secondary-bids/{bidId}/settle
        actor: OperationsAnalyst
        preconditions:
          - "FoFProgram.posture != FROZEN (ERR_POSTURE_GATED)"
          - "PURCHASE: unrestricted_cash - price >= liquidity_buffer_min (ERR_BUFFER_BREACH)"
          - "SALE: linked commitment's unfunded_amount == sized_amount - paid calls at settle time (consistency recheck)"
        side_effects:
          - "PURCHASE: CashLedgerEntry SECONDARY_SETTLEMENT_OUT -price; new Commitment created on vehicle_id in status EXECUTED with sized_amount = price + unfunded_assumed, unfunded_amount = unfunded_assumed, proposal_id = null"
          - "PURCHASE: FoFProgram.secondary_purchase_unfunded_total, committed_total, unfunded_total, unrestricted_cash recomputed"
          - "SALE: CashLedgerEntry SECONDARY_SETTLEMENT_IN +price; linked Commitment -> REDUCED with sized_amount set to paid-to-date; unfunded_amount -> 0"
          - "FoFProgram.version incremented; posture recomputed"
      - from: PROPOSED
        to: REJECTED
        trigger: POST /fof/programs/{id}/secondary-bids/{bidId}/reject
        actor: CIO
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST /fof/programs/{id}/secondary-bids/{bidId}/withdraw
        actor: Analyst
        preconditions: []
        side_effects: []

  - entity: HoldingSnapshot
    initial_state: PROVISIONAL
    terminal_states: [FINAL, RESTATED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: POST /fof/snapshots/{id}/finalize
        actor: OperationsAnalyst
        preconditions: []
        side_effects:
          - "is_final set true"
          - "Any ValuationReport for the same program and as_of_quarter in status PUBLISHED -> RESTATED; nav fields recomputed on next publish"
      - from: FINAL
        to: RESTATED
        trigger: POST /fof/snapshots/{id}/restate
        actor: OperationsAnalyst
        preconditions: []
        side_effects:
          - "A replacement PROVISIONAL snapshot may be created for the same quarter afterwards"
          - "Any ValuationReport for the same program/quarter in status PUBLISHED -> RESTATED"

  - entity: ValuationReport
    initial_state: OPEN
    terminal_states: [PUBLISHED, RESTATED]
    transitions:
      - from: OPEN
        to: PUBLISHED
        trigger: POST /fof/programs/{id}/valuation-reports/{reportId}/publish
        actor: OperationsAnalyst
        preconditions:
          - "At least one HoldingSnapshot exists for this program with as_of_quarter == report.as_of_quarter (ERR_NO_SNAPSHOTS)"
        side_effects:
          - "nav_provisional, nav_final, nav_reported, irr_provisional_pct, irr_final_pct computed via calculations.nav_rollup and calculations.irr_dual"
          - "total_fee_burden_pct computed via calculations.fee_layering"
      - from: PUBLISHED
        to: RESTATED
        trigger: "system (snapshot finalize/restate cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTATED
        to: PUBLISHED
        trigger: POST /fof/programs/{id}/valuation-reports/{reportId}/publish
        actor: OperationsAnalyst
        preconditions:
          - "Same as OPEN -> PUBLISHED"
        side_effects:
          - "All computed fields recomputed from current snapshot set"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: pacing-plan-supersede-stale-program
    parent_entity: FoFProgram
    write_endpoint: "POST /fof/programs/{id}/pacing-plans/{planId}/supersede"
    occ_field: "expected_program_version"
    description: |
      Superseding the APPROVED pacing plan against a FoFProgram whose version
      has advanced since the client last observed it is rejected. The version
      advances on every commitment execution, ledger append, and aggregate
      recompute, so a stale read of the program's capacity cannot be used to
      justify replacing the plan.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: commitment-execute-stale-program
    parent_entity: FoFProgram
    write_endpoint: "POST /fof/programs/{id}/commitments/{commitmentId}/execute"
    occ_field: "expected_program_version"
    description: |
      Executing a Commitment against a FoFProgram whose version has advanced
      since the client last observed it is rejected. Concentration headroom,
      vintage band bounds, and the liquidity buffer all derive from program
      aggregates that shift with every executed commitment and ledger entry,
      so the execution must be re-validated against a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: secondary-settle-stale-program
    parent_entity: FoFProgram
    write_endpoint: "POST /fof/programs/{id}/secondary-bids/{bidId}/settle"
    occ_field: "expected_program_version"
    description: |
      Settling a SecondaryBid against a FoFProgram whose version has advanced
      since the client last observed it is rejected. The liquidity buffer and
      the linked commitment's funded position both mutate between accept and
      settle, so the settlement is rejected with a stale-version error and
      must be re-attempted against the current program version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: pacing_targets
    trigger: "PacingPlan DRAFT -> APPROVED (and on supersede for the replacement plan)"
    algorithm: waterfall_allocation
    formula: |
      remaining_budget = total_nav_budget - committed_total (EXECUTED only)
      annual_pool = remaining_budget / horizon_years
      For each year y in [start_vintage_year, start_vintage_year + horizon_years - 1]:
        year_amount = annual_pool
        For each mix entry m in target_strategy_mix:
          row = { vintage_year: y, strategy: m.strategy,
                  amount: year_amount * m.weight }
      Remainder cents from per-row rounding accumulate into the FIRST row
      (earliest vintage year, first strategy in mix order) so that
      sum(row amounts) == round(remaining_budget, 2) exactly.
      Sort order for accumulation: vintage_year ASC, then strategy as listed
      in target_strategy_mix order (input order, never id).
    input_set: "FoFProgram (committed_total across Commitment rows in status EXECUTED only), PacingPlan.target_strategy_mix"
    constants:
      MAX_MIX_ENTRIES: 4
    precision: "2 decimal places, round_half_up; per-row rounding THEN remainder sweep into first row"
    variants: []

  - name: concentration_check
    trigger: "InvestmentProposal DRAFT -> RECOMMENDED"
    algorithm: aggregation
    formula: |
      base = total_nav_budget
      strat_committed = sum(sized_amount of Commitment in status EXECUTED
                            whose vehicle.strategy == proposal vehicle.strategy)
      mgr_committed = sum(sized_amount of Commitment in status EXECUTED
                          whose vehicle.manager_id == proposal vehicle.manager_id)
      concentration_strategy_pct = (strat_committed + proposed_amount) / base
      concentration_manager_pct  = (mgr_committed  + proposed_amount) / base
      Both percentages reported as fractions (0..1), 4 decimal places.
      Inclusion filter: only Commitment.status == EXECUTED counts; PENDING_DOCS,
      REDUCED (uses reduced sized_amount), and CANCELLED are excluded except
      REDUCED rows which count at their reduced sized_amount.
    input_set: "Commitment rows with status == EXECUTED or REDUCED, joined to FundVehicle"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: capital_call_forecast
    trigger: "GET /fof/programs/{id}/liquidity-forecast"
    algorithm: forward_looking
    formula: |
      For each Commitment in status EXECUTED:
        expected_calls = unfunded_amount * vintage_call_curve[vintage_year][quarter_offset]
        (vintage_call_curve is a built-in table keyed by vehicle vintage_year
         and quarters-since-vintage, a fixed 12-quarter curve summing to 1.0)
      For each CapitalCall in status ISSUED or OVERDUE: amount counts in full
      in the quarter containing its due_date.
      For each SecondaryBid in status ACCEPTED with side PURCHASE: price
      counts in full in the current quarter.
      forecast_net_cash[q] = unrestricted_cash
          - sum(expected_calls due in q) - sum(ISSUED/OVERDUE calls due in q)
          - sum(ACCEPTED PURCHASE bid prices)
          + sum(PENDING distributions with received_at in q)
      horizon: next 8 quarters from the server's logical clock quarter.
    input_set: "Commitment (EXECUTED), CapitalCall (ISSUED, OVERDUE), SecondaryBid (ACCEPTED, PURCHASE), Distribution (PENDING)"
    constants:
      FORECAST_QUARTERS: 8
    precision: "2 decimal places, round_half_up"
    variants:
      - name: stress_variant
        when: "query param stress=true"
        difference: "Distributions (PENDING) are excluded from inflows and expected_calls scaled by 1.15; same inclusion set otherwise"

  - name: program_posture
    trigger: "Recomputed after every ledger append, every capital-call status change, every program status change"
    algorithm: threshold
    formula: |
      if FoFProgram.status == SUSPENDED or CLOSED: posture = FROZEN
      else if any CapitalCall in status OVERDUE exists for the program: posture = RESTRICTED
      else if unrestricted_cash < liquidity_buffer_min * 1.10: posture = RESTRICTED
      else: posture = NORMAL
      Boundary: the low-cash band triggers strictly below 1.10x buffer
      (cash == exactly buffer*1.10 is NORMAL).
    input_set: "FoFProgram status + unrestricted_cash + liquidity_buffer_min; CapitalCall rows status OVERDUE"
    constants:
      LOW_CASH_BAND: 1.10
    precision: "not applicable"
    variants: []

  - name: dd_composite_score
    trigger: "DueDiligenceReview transitions to SUBMITTED (initial or resubmit)"
    algorithm: weighted_scoring
    formula: |
      composite = 0.30*score_strategy_fit + 0.25*score_track_record
                + 0.25*score_operations + 0.20*score_compliance
      Weights are fixed constants; scores are integers 0..100.
    input_set: "the review's four score_* fields"
    constants:
      W_STRATEGY: 0.30
      W_TRACK: 0.25
      W_OPS: 0.25
      W_COMPLIANCE: 0.20
      APPROVAL_THRESHOLD: 70
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: nav_rollup
    trigger: "ValuationReport publish (from OPEN or RESTATED)"
    algorithm: aggregation
    formula: |
      Per commitment with at least one snapshot for this program+quarter:
        - if a FINAL snapshot exists with reported_at <= quarter_end + LAG_DAYS,
          the commitment contributes that FINAL reported_nav to BOTH
          nav_final and nav_reported (latest FINAL by reported_at ASC,
          tie-break created_at ASC);
        - else the commitment contributes its latest PROVISIONAL reported_nav
          to BOTH nav_provisional and nav_reported.
      (LAG_DAYS = 90: a FINAL snapshot reported more than 90 days after quarter
       end is excluded from nav_final — the lag policy; such a commitment
       falls back to its PROVISIONAL snapshot if one exists, else contributes
       nothing.)
      nav_reported = nav_final + nav_provisional.
      Snapshots in status RESTATED are excluded from all sums.
    input_set: "HoldingSnapshot rows joined through Commitment to this program, filtered by as_of_quarter and status"
    constants:
      LAG_DAYS: 90
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_variant
        when: "a commitment has no FINAL snapshot within the lag window for the quarter"
        difference: "that commitment's contribution to nav_reported falls back to its PROVISIONAL nav; irr fields use the corresponding terminal NAV"

  - name: irr_dual
    trigger: "ValuationReport publish"
    algorithm: chronological
    formula: |
      Cashflow series built in chronological order (received_at / paid date ASC,
      tie-break created_at ASC) from:
        - each PAID CapitalCall: outflow of amount at its pay time
        - each RECEIVED Distribution: inflow of amount at received_at
        - terminal value: nav_reported (provisional variant uses nav_provisional,
          final variant uses nav_final) at quarter end
      irr_provisional_pct solves NPV=0 with terminal value nav_provisional;
      irr_final_pct solves NPV=0 with terminal value nav_final.
      Both reported as percentages with 2 decimals. The two variants produce
      different results whenever nav_provisional != nav_final.
    input_set: "PAID CapitalCall + RECEIVED Distribution rows for the program; ValuationReport nav fields"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_variant
        when: "terminal NAV is nav_provisional"
        difference: "Uses provisional NAV as terminal value; differs from final variant by construction whenever the NAV variants diverge"

  - name: fee_layering
    trigger: "ValuationReport publish"
    algorithm: tiered_pricing
    formula: |
      For each EXECUTED or REDUCED Commitment, layered fees:
        Layer 1 (underlying fund): annual_mgmt = sized_amount * rate(t),
          where rate(t) = mgmt_fee_rate_early for quarters since vintage_year
          <= investment_period_years*4, else mgmt_fee_rate_late. Quarterly
          accrual = annual_mgmt / 4.
        Layer 1 carry: carry = max(0, (nav_gain - hurdle_return)) * carry_rate,
          where nav_gain = latest reported_nav - paid_calls_total,
          hurdle_return = paid_calls_total * hurdle_rate * (quarters_held/4),
          and quarters_held = number of whole quarters from the vehicle's
          vintage_year Q1 to the report's as_of_quarter, inclusive of the
          report quarter (2026-Q1 vintage reported at 2026-Q3 => 3).
        Layer 2 (FoF wrapper): wrapper_fee = sized_amount * WRAPPER_RATE / 4
          per quarter.
      total_fee_burden_pct = (sum of all fee layers for the trailing
                             min(4, quarters_held) quarters ending at the
                             report quarter) / max(nav_reported, EPSILON) * 100.
      Rounding: each commitment's quarterly fee is rounded to 2 decimals
      round_half_up BEFORE summing (round-then-sum order is pinned; the
      alternative sum-then-round order yields different cents and is wrong).
    input_set: "Commitment (EXECUTED, REDUCED) joined to FundVehicle fee terms and latest HoldingSnapshot"
    constants:
      WRAPPER_RATE: 0.005
      EPSILON: 0.01
    precision: "2 decimal places per commitment-quarter, round_half_up, then sum"
    variants: []

  - name: unfunded_reconciliation
    trigger: "After every capital call pay, commitment reduce, secondary settle"
    algorithm: aggregation
    formula: |
      For each Commitment: unfunded_amount = sized_amount - sum(amount of
        CapitalCall rows in status PAID for this commitment)
      Program: unfunded_total = sum(unfunded_amount over EXECUTED commitments)
        + secondary_purchase_unfunded_total
      Invariant: unfunded_amount never negative; a pay that would drive it
      negative is rejected (ERR_OVERFUNDED) BEFORE any ledger append.
    input_set: "Commitment + CapitalCall (PAID)"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and names a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-ID header present for entity-backed roles (Analyst, OperationsAnalyst, InvestmentCommittee)", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role permitted for the endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path-template resources exist, validated left-to-right (program, then plan/vehicle/commitment/bid/report, then call/distribution/snapshot)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Body-referenced FK ids exist (pacing_plan_id, linked_commitment_id, replacement_plan_id)", error_id: ERR_REF_NOT_FOUND, http_status: 404, applies_to: "endpoints taking FK ids in body" }
  - { priority: 6, category: state, check: "OCC expected_program_version matches current FoFProgram.version on concurrency-guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /fof/programs/{id}/pacing-plans/{planId}/supersede", "POST /fof/programs/{id}/commitments/{commitmentId}/execute", "POST /fof/programs/{id}/secondary-bids/{bidId}/settle"] }
  - { priority: 7, category: state, check: "Target resource's current state permits the requested transition per its state machine", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Program posture gates: posture == FROZEN rejects all mutating writes scoped to the program; posture == RESTRICTED rejects only proposal recommend, proposal ic-approve, commitment execute, and secondary-bid accept (cash-restoring writes — call pay, distribution receive, ledger contribution, secondary settle — remain allowed)", error_id: ERR_POSTURE_GATED, http_status: 409, applies_to: "all mutating endpoints scoped to a program" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: the IC approver's StaffUser.email must differ from the recommending analyst's StaffUser.email (resolved via X-User-ID -> StaffUser row for the approver, and recommended_by_analyst_id -> StaffUser row for the recommender); matching emails = same person = violation", error_id: ERR_SOD_VIOLATION, http_status: 409, applies_to: ["POST /fof/proposals/{id}/ic-approve"] }
  - { priority: 10, category: business_safety, check: "Due-diligence gate: vehicle approve requires latest review COMPLETED with composite_score >= 70", error_id: ERR_DD_SCORE_TOO_LOW, http_status: 422, applies_to: ["POST /fof/managers/{id}/vehicles/{vehicleId}/approve-vehicle"] }
  - { priority: 11, category: business_safety, check: "Liquidity buffer: any cash outflow must leave unrestricted_cash >= liquidity_buffer_min", error_id: ERR_BUFFER_BREACH, http_status: 422, applies_to: ["POST /fof/calls/{callId}/pay", "POST /fof/programs/{id}/secondary-bids/{bidId}/settle", "POST /fof/programs/{id}/commitments/{commitmentId}/execute", "POST /fof/programs/{id}/open", "POST /fof/programs/{id}/resume"] }
  - { priority: 12, category: business_constraint, check: "Secondary pricing bands: PURCHASE premium <= cap, SALE discount <= cap", error_id: ERR_PREMIUM_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /fof/programs/{id}/secondary-bids/{bidId}/accept"] }
  - { priority: 13, category: business_constraint, check: "Secondary SALE discount beyond cap", error_id: ERR_DISCOUNT_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /fof/programs/{id}/secondary-bids/{bidId}/accept"] }
  - { priority: 14, category: business_constraint, check: "Strategy concentration post-trade <= strategy_cap_pct", error_id: ERR_STRATEGY_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /fof/proposals/{id}/ic-approve"] }
  - { priority: 15, category: business_constraint, check: "Manager concentration post-trade <= manager_cap_pct", error_id: ERR_MANAGER_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /fof/proposals/{id}/ic-approve"] }
  - { priority: 16, category: business_constraint, check: "Vintage band: new EXECUTED commitment's vintage_year within max_vintage_band_years span of existing EXECUTED vintage years", error_id: ERR_VINTAGE_BAND_BREACH, http_status: 422, applies_to: ["POST /fof/programs/{id}/commitments/{commitmentId}/execute"] }
  - { priority: 17, category: business_constraint, check: "Commitment sizing band: 0.90 * proposed_amount <= sized_amount <= 1.10 * proposed_amount", error_id: ERR_SIZE_OUT_OF_BAND, http_status: 422, applies_to: ["POST /fof/programs/{id}/commitments/{commitmentId}/execute"] }
  - { priority: 18, category: business_constraint, check: "Pacing capacity: proposed_amount <= remaining target for the vehicle's vintage year under the APPROVED plan (target minus already IC_APPROVED proposal amounts for that year)", error_id: ERR_PACING_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /fof/proposals/{id}/ic-approve"] }
  - { priority: 19, category: business_constraint, check: "target_strategy_mix weights sum to exactly 1.0 and contain at most 4 entries", error_id: ERR_MIX_SUM_INVALID, http_status: 422, applies_to: ["POST /fof/programs/{id}/pacing-plans/{planId}/approve"] }
  - { priority: 20, category: business_constraint, check: "Only one APPROVED pacing plan per program at a time", error_id: ERR_ACTIVE_PLAN_EXISTS, http_status: 409, applies_to: ["POST /fof/programs/{id}/pacing-plans/{planId}/approve"] }
  - { priority: 21, category: business_fiscal, check: "Capital call pay: amount <= commitment.unfunded_amount", error_id: ERR_OVERFUNDED, http_status: 422, applies_to: ["POST /fof/calls/{callId}/pay"] }
  - { priority: 22, category: business_fiscal, check: "Commitment reduce: reduce_to >= sum(PAID capital calls)", error_id: ERR_REDUCE_BELOW_PAID, http_status: 422, applies_to: ["POST /fof/programs/{id}/commitments/{commitmentId}/reduce"] }
  - { priority: 23, category: business_temporal, check: "CapitalCall due_date strictly after issued_on; cancel only at or before due_date", error_id: ERR_CALL_OVERDUE, http_status: 422, applies_to: ["POST /fof/programs/{id}/commitments/{commitmentId}/calls", "POST /fof/calls/{callId}/cancel"] }
  - { priority: 24, category: business_temporal, check: "HoldingSnapshot as_of_quarter unique per commitment; ValuationReport as_of_quarter unique per program", error_id: ERR_DUPLICATE_QUARTER, http_status: 409, applies_to: ["POST /fof/commitments/{id}/snapshots", "POST /fof/programs/{id}/valuation-reports"] }
  - { priority: 25, category: business_referential, check: "Manager approve requires at least one APPROVED vehicle; manager exit requires no live commitments", error_id: ERR_NO_APPROVED_VEHICLE, http_status: 422, applies_to: ["POST /fof/managers/{id}/approve", "POST /fof/managers/{id}/exit"] }
  - { priority: 26, category: business_referential, check: "Proposal recommend requires FundVehicle.status == APPROVED", error_id: ERR_VEHICLE_NOT_APPROVED, http_status: 422, applies_to: ["POST /fof/proposals/{id}/recommend"] }
  - { priority: 27, category: business_referential, check: "Proposal recommend requires Manager.status == APPROVED", error_id: ERR_MANAGER_NOT_ELIGIBLE, http_status: 422, applies_to: ["POST /fof/proposals/{id}/recommend", "POST /fof/managers/{id}/vehicles/{vehicleId}/begin-diligence"] }
  - { priority: 28, category: business_referential, check: "Proposal recommend requires pacing plan APPROVED for this program", error_id: ERR_PLAN_NOT_APPROVED, http_status: 422, applies_to: ["POST /fof/proposals/{id}/recommend"] }
  - { priority: 29, category: business_referential, check: "Replacement plan on supersede must be DRAFT and same program", error_id: ERR_PLAN_NOT_DRAFT, http_status: 422, applies_to: ["POST /fof/programs/{id}/pacing-plans/{planId}/supersede"] }
  - { priority: 30, category: business_referential, check: "Capital call pay/receive-distribution require Commitment EXECUTED or REDUCED as specified", error_id: ERR_COMMITMENT_NOT_EXECUTED, http_status: 422, applies_to: ["POST /fof/calls/{callId}/pay", "POST /fof/distributions/{distributionId}/receive"] }
  - { priority: 31, category: business_referential, check: "ValuationReport publish requires at least one snapshot for the quarter", error_id: ERR_NO_SNAPSHOTS, http_status: 422, applies_to: ["POST /fof/programs/{id}/valuation-reports/{reportId}/publish"] }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- FoFProgram ---
  - method: POST
    path: "/fof/programs"
    description: "Create a FoFProgram in status DRAFT"
    roles: [CIO]
    code: 201
    input: [program_name, base_currency, total_nav_budget, strategy_cap_pct, manager_cap_pct, max_vintage_band_years, liquidity_buffer_min, overdue_grace_days, secondary_premium_cap_pct, secondary_discount_cap_pct]
    output: FoFProgram
    side_effects: ["posture computed (FROZEN until first CONTRIBUTION posts and program opens — posture evaluated as NORMAL candidate only after OPEN)", "aggregates initialized to 0"]

  - method: GET
    path: "/fof/programs"
    description: "List programs"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "FoFProgram[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{programId}"
    description: "Get one program with computed aggregates and posture"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: FoFProgram
    side_effects: []

  - method: POST
    path: "/fof/programs/{id}/open"
    description: "Open program (requires buffer-funded cash)"
    roles: [CIO]
    code: 200
    input: []
    output: FoFProgram
    side_effects: ["FoFProgram.status -> OPEN", "posture recomputed", "increments FoFProgram.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/suspend"
    description: "Suspend program (posture FROZEN)"
    roles: [CIO]
    code: 200
    input: []
    output: FoFProgram
    side_effects: ["FoFProgram.status -> SUSPENDED", "posture -> FROZEN", "increments FoFProgram.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/resume"
    description: "Resume a suspended program"
    roles: [CIO]
    code: 200
    input: []
    output: FoFProgram
    side_effects: ["FoFProgram.status -> OPEN", "posture recomputed", "increments FoFProgram.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/close"
    description: "Close program; cascades ARCHIVED/WITHDRAWN to live plans and proposals"
    roles: [CIO]
    code: 200
    input: []
    output: FoFProgram
    side_effects: ["status -> CLOSED", "plans APPROVED -> ARCHIVED", "proposals DRAFT/RECOMMENDED -> WITHDRAWN", "posture -> FROZEN", "increments FoFProgram.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/ledger-entries"
    description: "Append a manual ledger entry (CONTRIBUTION or MANUAL_ADJUSTMENT with signed amount in body)"
    roles: [OperationsAnalyst]
    code: 201
    input: [entry_kind, amount, "note?"]
    output: CashLedgerEntry
    side_effects: ["unrestricted_cash recomputed", "balance_after recorded", "posture recomputed", "increments FoFProgram.version by 1"]

  - method: GET
    path: "/fof/programs/{id}/ledger-entries"
    description: "List ledger entries for a program (chronological, created_at ASC)"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, entry_kind?"]
    output: "CashLedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/liquidity-forecast"
    description: "8-quarter forward liquidity forecast; stress=true applies the stress variant"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst]
    code: 200
    input: ["stress?"]
    output: "{ program_id: string, base_quarter: string, forecast_net_cash: number[], posture: string }"
    side_effects: []

  # --- PacingPlan ---
  - method: POST
    path: "/fof/programs/{id}/pacing-plans"
    description: "Create a PacingPlan in status DRAFT"
    roles: [Analyst]
    code: 201
    input: [plan_label, horizon_years, start_vintage_year, target_strategy_mix]
    output: PacingPlan
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/pacing-plans"
    description: "List pacing plans for a program"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "PacingPlan[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/pacing-plans/{planId}"
    description: "Get one pacing plan"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: PacingPlan
    side_effects: []

  - method: POST
    path: "/fof/programs/{id}/pacing-plans/{planId}/approve"
    description: "Approve a pacing plan; runs pacing_targets"
    roles: [CIO]
    code: 200
    input: []
    output: PacingPlan
    side_effects: ["status -> APPROVED", "target_commit_by_year computed via calculations.pacing_targets", "projected_total_commit computed", "increments PacingPlan.version by 1"]

  - method: POST
    path: "/fof/programs/{id}/pacing-plans/{planId}/supersede"
    description: "Atomically supersede APPROVED plan with a DRAFT replacement (OCC-guarded)"
    roles: [CIO]
    code: 200
    input: [replacement_plan_id, expected_program_version]
    output: PacingPlan
    side_effects: ["old plan APPROVED -> SUPERSEDED", "replacement DRAFT -> APPROVED + pacing_targets", "DRAFT proposals on old plan -> WITHDRAWN", "increments FoFProgram.version by 1"]

  # --- Manager / FundVehicle ---
  - method: POST
    path: "/fof/managers"
    description: "Register a manager (PROSPECT)"
    roles: [Analyst]
    code: 201
    input: [legal_name, domicile_country, relationship_since_year]
    output: Manager
    side_effects: []

  - method: GET
    path: "/fof/managers"
    description: "List managers"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "Manager[]"
    side_effects: []

  - method: GET
    path: "/fof/managers/{managerId}"
    description: "Get one manager"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Manager
    side_effects: []

  - method: POST
    path: "/fof/managers/{id}/approve"
    description: "Approve manager (requires an APPROVED vehicle)"
    roles: [CIO]
    code: 200
    input: []
    output: Manager
    side_effects: ["status -> APPROVED", "increments Manager.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/suspend"
    description: "Suspend manager; cascades DECLINED/WITHDRAWN through vehicles, reviews, proposals"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Manager
    side_effects: ["vehicles IN_DILIGENCE -> DECLINED", "open DD reviews -> WITHDRAWN", "proposals DRAFT/RECOMMENDED -> WITHDRAWN", "increments Manager.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/reinstate"
    description: "Reinstate a suspended manager"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Manager
    side_effects: ["status -> APPROVED", "increments Manager.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/exit"
    description: "Exit manager (no live commitments allowed)"
    roles: [CIO]
    code: 200
    input: []
    output: Manager
    side_effects: ["status -> EXITED", "vehicles -> CLOSED_TO_NEW", "increments Manager.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/vehicles"
    description: "Create a fund vehicle (SCREENING)"
    roles: [Analyst]
    code: 201
    input: [fund_name, strategy, vintage_year, fund_size_target, mgmt_fee_rate_early, mgmt_fee_rate_late, investment_period_years, carry_rate, hurdle_rate]
    output: FundVehicle
    side_effects: []

  - method: GET
    path: "/fof/managers/{id}/vehicles"
    description: "List vehicles for a manager"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?, strategy?, vintage_year?"]
    output: "FundVehicle[]"
    side_effects: []

  - method: GET
    path: "/fof/managers/{id}/vehicles/{vehicleId}"
    description: "Get one vehicle"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: FundVehicle
    side_effects: []

  - method: POST
    path: "/fof/managers/{id}/vehicles/{vehicleId}/begin-diligence"
    description: "Move vehicle SCREENING -> IN_DILIGENCE and spawn DD review round 1"
    roles: [Analyst]
    code: 200
    input: []
    output: FundVehicle
    side_effects: ["status -> IN_DILIGENCE", "DueDiligenceReview round_index=1 created in DRAFT", "increments FundVehicle.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/vehicles/{vehicleId}/approve-vehicle"
    description: "Approve vehicle after completed DD with composite >= 70"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: FundVehicle
    side_effects: ["status -> APPROVED", "Manager PROSPECT -> APPROVED if applicable", "increments FundVehicle.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/vehicles/{vehicleId}/decline-vehicle"
    description: "Decline vehicle; cascades open reviews to WITHDRAWN"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: FundVehicle
    side_effects: ["status -> DECLINED", "non-terminal DD reviews -> WITHDRAWN", "increments FundVehicle.version by 1"]

  - method: POST
    path: "/fof/managers/{id}/vehicles/{vehicleId}/close-to-new"
    description: "Close an APPROVED vehicle to new commitments"
    roles: [InvestmentCommittee]
    code: 200
    input: []
    output: FundVehicle
    side_effects: ["status -> CLOSED_TO_NEW", "increments FundVehicle.version by 1"]

  # --- Flat convenience GETs (reverse-reachability for FK parents) ---
