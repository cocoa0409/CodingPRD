scaffold_corner_design:
  - section: entities
    instances:
      - name: station_creation_without_revenue_rejected
        claim_type: required_fields
        grounds:
          - entities.MemberStation.fields
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the revenue input on POST /network/member-stations must be rejected with ERR_INVALID_REQUEST at http 400 before any derived field is written, while the same request with the input present succeeds."
        test_recipe:
          setup: ["Clock at the fixed default 2026-09-01T00:00:00Z; empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/member-stations"
              payload: { call_sign: "WBUR", licensee_name: "Boston Licensee", state_code: "MA", dma_market_rank: 8, dma_households: 2400000, coverage_population: 100, full_time_staff_count: 12, newsroom_staff_count: 4, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
              captures: { neg_invalid_request: "$.data.error_id" }
            - call: "POST /network/member-stations"
              payload: { call_sign: "WGBH", licensee_name: "Charles Licensee", state_code: "MA", dma_market_rank: 8, dma_households: 2400000, coverage_population: 100, full_time_staff_count: 12, newsroom_staff_count: 4, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
          assert:
            - "The first create returns error_id ERR_INVALID_REQUEST with http 400 because annual_local_revenue_cents is absent"
            - "The second create succeeds with code 201"
            - "No MemberStation row is persisted by the rejected create, so the failure is atomic"
      - name: station_derived_fields_are_recomputed
        claim_type: computed_fields
        grounds:
          - calculations.station_operations_score
          - calculations.membership_class_assignment
          - entities.MemberStation.fields.operations_score
        distinguishing_aspect: "operations_score and membership_class are derived from coverage, staffing and newsroom inputs; a client-supplied value is ignored and the derived value is written instead."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/member-stations"
              payload: { call_sign: "WBUR", licensee_name: "Boston Licensee", state_code: "MA", dma_market_rank: 8, dma_households: 2400000, coverage_population: 1000000, full_time_staff_count: 6, newsroom_staff_count: 9, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
          assert:
            - "Response.operations_score == 69.00, recomputed rather than echoed from the request"
            - "Response.membership_class == CLASS_B and Response.dma_market_rank == 8"
            - "Response.eligibility_status == APPLICANT and Response.dues_vote_eligible == false"
      - name: station_not_found_and_schedule_row_shape
        claim_type: not_found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - entities.MemberStation.fields.id
          - entities.ProgrammingFeeSchedule.common_fields
        distinguishing_aspect: "A GET on an unregistered station id returns 404, and ProgrammingFeeSchedule is declared with common_fields false so its rows expose no version field."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one schedule created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026Q", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sch_q_id: "$.data.id" }
          trigger:
            - call: "GET /network/member-stations/3f1c9a6e-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "GET /network/programming-fee-schedules/${sch_q_id}"
              payload: {}
              as: NetworkComplianceAuditor
          assert:
            - "The unknown station read returns error_id ERR_RESOURCE_NOT_FOUND with http 404"
            - "The schedule read returns a row carrying no version field, consistent with common_fields false"
            - "The schedule read does expose schedule_code and fiscal_year"
      - name: station_listing_pagination_defaults
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - endpoints[GET /network/member-stations]
        distinguishing_aspect: "GET /network/member-stations with no query parameters applies the envelope defaults limit 10 and offset 0 and reports total_count and has_more."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; two APPLICANT stations registered"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "WAAA", licensee_name: "Pilot Licensee One", state_code: "ME", dma_market_rank: 1, dma_households: 12000000, coverage_population: 10000000, full_time_staff_count: 20, newsroom_staff_count: 10, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "WBBB", licensee_name: "Pilot Licensee Two", state_code: "ME", dma_market_rank: 2, dma_households: 12000000, coverage_population: 10000000, full_time_staff_count: 20, newsroom_staff_count: 10, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
          trigger:
            - call: "GET /network/member-stations"
              payload: {}
              as: PlatformAdmin
            - call: "GET /network/member-stations"
              payload: { limit: 1, offset: 1 }
              as: PlatformAdmin
          assert:
            - "The default read reports limit 10 and offset 0 in the meta pagination block"
            - "The second read reports limit 1, offset 1, total_count 2 and has_more false"
            - "Response.response_type == array in both cases"
  - section: state_machines
    instances:
      - name: station_initial_state_and_terminal_lockdown
        claim_type: initial_state
        grounds:
          - state_machines.MemberStation.initial_state
          - state_machines.MemberStation.terminal_states
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A newly created station is APPLICANT, and once withdrawn to the terminal WITHDRAWN state no transition endpoint admits it."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one station withdrawn"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KUSC", licensee_name: "Angeles Licensee", state_code: "CA", dma_market_rank: 2, dma_households: 5200000, coverage_population: 100, full_time_staff_count: 12, newsroom_staff_count: 4, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_WEST" }
              as: PlatformAdmin
              captures: { st_s_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_s_id}/withdraw"
              payload: {}
              as: StationManager
              as_user_id: "${st_s_id}"
          trigger:
            - call: "POST /network/member-stations/${st_s_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_s_id}"
          assert:
            - "The station reads APPLICANT immediately after creation"
            - "After the withdraw Response.eligibility_status == WITHDRAWN"
            - "The post-terminal submit returns error_id ERR_ALREADY_TERMINAL with http 409"
      - name: window_invalid_transition_from_terminal_violated
        claim_type: invalid_transition
        grounds:
          - state_machines.BroadcastWindow.terminal_states
          - state_machines.BroadcastWindow.transitions.CLEARED_to_VIOLATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A window in the terminal VIOLATED state admits no further transition, including the remediating endpoint that is legal from REJECTED."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one CLEARED window carrying a program whose premiere has not yet arrived"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026R", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KCPW", licensee_name: "Wasatch Licensee", state_code: "UT", dma_market_rank: 33, dma_households: 900000, coverage_population: 75000, full_time_staff_count: 6, newsroom_staff_count: 3, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_WEST" }
              as: PlatformAdmin
              captures: { st_t_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_t_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_t_id}"
            - call: "POST /network/member-stations/${st_t_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/national-programs"
              payload: { program_code: "NP-1009", program_title: "Wasatch Front Report", strand_type: "NEWS", national_premiere_at: "2026-10-01T00:00:00Z" }
              as: NationalProgramEditor
              captures: { prog_t_id: "$.data.id" }
            - call: "POST /network/carriage-agreements"
              payload: { station_id: "${st_t_id}", program_code: "NP-1009", obligation_type: "MANDATORY", clearance_deadline: "2026-11-01T00:00:00Z", exception_liability_cap_cents: 500000 }
              as: StationManager
              as_user_id: "${st_t_id}"
              captures: { agr_t_id: "$.data.id" }
            - call: "POST /network/broadcast-windows"
              payload: { parent_agreement_id: "${agr_t_id}", station_id: "${st_t_id}", program_code: "NP-1009", window_start: "2026-10-05T14:00:00Z", window_end: "2026-10-05T15:00:00Z" }
              as: StationManager
              as_user_id: "${st_t_id}"
              captures: { wnd_t1: "$.data.id" }
            - call: "POST /network/carriage-agreements/${agr_t_id}/submit"
              payload: {}
              as: StationManager
              as_user_id: "${st_t_id}"
            - call: "POST /network/carriage-agreements/${agr_t_id}/review"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/broadcast-windows/${wnd_t1}/request-clearance"
              payload: {}
              as: StationManager
              as_user_id: "${st_t_id}"
            - call: "POST /network/broadcast-windows/${wnd_t1}/clear"
              payload: {}
              as: NetworkComplianceAuditor
          trigger:
            - call: "POST /network/series/embargo-check"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/broadcast-windows/${wnd_t1}/remediating"
              payload: {}
              as: StationManager
              as_user_id: "${st_t_id}"
          assert:
            - "The embargo sweep moves the window to clearance_status VIOLATED because the window starts before the premiere instant"
            - "The remediating call returns error_id ERR_ALREADY_TERMINAL with http 409"
            - "Response.carriage_exception_liability_cents == 120000 on the swept window"
      - name: window_idempotent_second_clear_refused
        claim_type: idempotency
        grounds:
          - state_machines.BroadcastWindow.transitions.PENDING_CLEARANCE_to_CLEARED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Clearing an already-cleared window does not re-fire its side effects and is rejected on the second attempt."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one window already CLEARED under a reviewed agreement"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026S", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "KVNO", licensee_name: "Prairie Licensee", state_code: "NE", dma_market_rank: 76, dma_households: 400000, coverage_population: 60000, full_time_staff_count: 5, newsroom_staff_count: 3, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_MIDWEST" }
              as: PlatformAdmin
              captures: { st_u_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_u_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_u_id}"
            - call: "POST /network/member-stations/${st_u_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/national-programs"
              payload: { program_code: "NP-1010", program_title: "Platte River Journal", strand_type: "NEWS", national_premiere_at: "2026-10-01T00:00:00Z" }
              as: NationalProgramEditor
            - call: "POST /network/carriage-agreements"
              payload: { station_id: "${st_u_id}", program_code: "NP-1010", obligation_type: "MANDATORY", clearance_deadline: "2026-11-01T00:00:00Z", exception_liability_cap_cents: 500000 }
              as: StationManager
              as_user_id: "${st_u_id}"
              captures: { agr_u_id: "$.data.id" }
            - call: "POST /network/broadcast-windows"
              payload: { parent_agreement_id: "${agr_u_id}", station_id: "${st_u_id}", program_code: "NP-1010", window_start: "2026-10-05T14:00:00Z", window_end: "2026-10-05T15:00:00Z" }
              as: StationManager
              as_user_id: "${st_u_id}"
              captures: { wnd_u1: "$.data.id" }
            - call: "POST /network/carriage-agreements/${agr_u_id}/submit"
              payload: {}
              as: StationManager
              as_user_id: "${st_u_id}"
            - call: "POST /network/carriage-agreements/${agr_u_id}/review"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/broadcast-windows/${wnd_u1}/request-clearance"
              payload: {}
              as: StationManager
              as_user_id: "${st_u_id}"
            - call: "POST /network/broadcast-windows/${wnd_u1}/clear"
              payload: {}
              as: NetworkComplianceAuditor
              captures: { wnd_u1_ver: "$.data.version" }
          trigger:
            - call: "POST /network/broadcast-windows/${wnd_u1}/clear"
              payload: {}
              as: NetworkComplianceAuditor
          assert:
            - "The first clear returned clearance_status CLEARED with is_cleared true"
            - "The second clear returns error_id ERR_INVALID_STATE with http 409"
            - "The window version after the first clear exceeds the version captured before it"
  - section: calculations
    instances:
      - name: classification_works_on_plain_strings
        claim_type: correct_result
        grounds:
          - calculations.station_operations_score
          - calculations.membership_class_assignment
        distinguishing_aspect: "The operations score and class follow the pinned ladder from plain coverage and staffing inputs, with each index capped before weighting."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; empty database"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /network/member-stations"
              payload: { call_sign: "KUT", licensee_name: "Austin Licensee", state_code: "TX", dma_market_rank: 40, dma_households: 1000000, coverage_population: 1000000, full_time_staff_count: 6, newsroom_staff_count: 9, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
          assert:
            - "Response.operations_score == 69.00 with coverage_index 90, staffing_index 30 and newsroom_index 90"
            - "Response.membership_class == CLASS_B because operations_score 69.00 clears the 60.00 gate and households_index is 100"
            - "The same inputs with newsroom_staff_count 1 yield operations_score 21.60 and membership_class CLASS_D"
      - name: fee_provisional_component_rounding_order
        claim_type: precision
        grounds:
          - calculations.programming_fee_provisional
          - entities.ProgrammingFeeSchedule.fields.rounding_mode
        distinguishing_aspect: "Each fee component is rounded to the cent before the sum, so a half-cent revenue component rounds up and the total carries the rounded value."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one ELIGIBLE station with revenue 4999999 cents and schedule revenue_rate_bps 250"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026T", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sch_t_id: "$.data.id" }
            - call: "POST /network/member-stations"
              payload: { call_sign: "KUT", licensee_name: "Austin Licensee", state_code: "TX", dma_market_rank: 2, dma_households: 12000000, coverage_population: 10000000, full_time_staff_count: 20, newsroom_staff_count: 10, annual_local_revenue_cents: 4999999, board_seat_region: "REGION_SOUTH" }
              as: PlatformAdmin
              captures: { st_v_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_v_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_v_id}"
            - call: "POST /network/member-stations/${st_v_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
          trigger:
            - call: "GET /network/programming-fee-schedules/${sch_t_id}/preview"
              payload: { station_id: "${st_v_id}" }
              as: NetworkComplianceAuditor
          assert:
            - "Response.provisional_fee_cents == 1625000"
            - "The rate component is 125000, the half-up rounding of 124999.975"
            - "The market component is 1500000 because dma_market_rank 2 selects tier 1 at market_size_multiplier_bps 12500 and a CLASS_B station carries no class adjustment"
      - name: fee_class_multiplier_applies_to_market_component_only
        claim_type: constants_applied
        grounds:
          - calculations.membership_class_fee_multiplier
          - calculations.programming_fee_provisional
        distinguishing_aspect: "The membership-class multiplier scales the market component alone and never the revenue component."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one CLASS_A station priced against a schedule whose base fee is 1200000 cents"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026U", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sch_cls_id: "$.data.id" }
            - call: "POST /network/member-stations"
              payload: { call_sign: "WNYC", licensee_name: "New York Licensee", state_code: "NY", dma_market_rank: 1, dma_households: 12000000, coverage_population: 10000000, full_time_staff_count: 20, newsroom_staff_count: 10, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
              captures: { st_cls_id: "$.data.id", st_cls_ver: "$.data.version" }
            - call: "POST /network/member-stations/${st_cls_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_cls_id}"
            - call: "POST /network/member-stations/${st_cls_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
          trigger:
            - call: "GET /network/programming-fee-schedules/${sch_cls_id}/preview"
              payload: { station_id: "${st_cls_id}" }
              as: NetworkComplianceAuditor
          assert:
            - "The station's membership_class reads CLASS_A because operations_score 79.00 clears the 75.00 gate"
            - "The class-adjusted market component reads 1380000, which is 1200000 scaled by 11500 basis points"
            - "The revenue component stays at 120000, unscaled by the class multiplier"
      - name: content_reachability_by_program_and_station
        claim_type: listing
        grounds:
          - endpoints[GET /network/national-programs/{id}/contributions]
          - endpoints[GET /network/content-contributions]
          - entities.ContentContribution.fields.station_id
        distinguishing_aspect: "A contribution filed against a program is discoverable from both FK directions: by program through the sub-resource read and by station through the filtered list."
        test_recipe:
          setup: ["Clock at 2026-09-01T00:00:00Z; one program and one ELIGIBLE station with one filed contribution"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/programming-fee-schedules"
              payload: { schedule_code: "FY2026AM", fiscal_year: 2026, base_fee_cents: 1200000, revenue_rate_bps: 250, market_size_multiplier_bps: 12500, minimum_fee_cents: 100000, maximum_fee_cents: 5000000, annual_adjustment_bps: 0, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/member-stations"
              payload: { call_sign: "WGBH", licensee_name: "Charles Licensee", state_code: "MA", dma_market_rank: 10, dma_households: 800000, coverage_population: 70000, full_time_staff_count: 8, newsroom_staff_count: 4, annual_local_revenue_cents: 4800000, board_seat_region: "REGION_NORTHEAST" }
              as: PlatformAdmin
              captures: { st_an_id: "$.data.id" }
            - call: "POST /network/member-stations/${st_an_id}/submit-eligibility"
              payload: {}
              as: StationManager
              as_user_id: "${st_an_id}"
            - call: "POST /network/member-stations/${st_an_id}/approve-eligibility"
              payload: {}
              as: NetworkComplianceAuditor
            - call: "POST /network/national-programs"
              payload: { program_code: "NP-1021", program_title: "Commonwealth Desk", strand_type: "NEWS", national_premiere_at: "2026-10-01T00:00:00Z" }
              as: NationalProgramEditor
              captures: { prog_an_id: "$.data.id" }
            - call: "POST /network/content-contributions"
              payload: { station_id: "${st_an_id}", program_id: "${prog_an_id}", headline: "Transit funding gap", duration_seconds: 180 }
              as: StationManager
              as_user_id: "${st_an_id}"
              captures: { con_an_id: "$.data.id" }
          trigger:
