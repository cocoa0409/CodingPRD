  - section: endpoints
    instances:
      - name: clock_default_and_set
        claim_type: conditional_action
        grounds:
          - endpoints.POST /iacuc/_clock/set_current_utc
        distinguishing_aspect: "Server logical clock defaults to exactly 2026-08-01T00:00:00Z before any set; set_current_utc moves it and fires time-based transitions."
        test_recipe:
          setup: ["Empty DB; no prior clock set"]
          setup_api_calls: []
          trigger:
            - call: "POST /iacuc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { cur: $.data.current_utc }
          assert:
            - "current_utc echoes 2026-08-01T00:00:00Z (the documented default)"
      - name: pagination_envelope_on_list
        claim_type: computed_read
        grounds:
          - response_envelope
          - endpoints.GET /iacuc/investigators/{id}/grants
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["Investigator with 1 grant"]
