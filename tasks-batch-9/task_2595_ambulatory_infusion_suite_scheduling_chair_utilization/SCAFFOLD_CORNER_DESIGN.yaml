      - name: cancellation_charge_rounds_the_patient_share_half_up_at_the_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.cancellation_charge
          - calculations.cancellation_charge.constants.SHARE_PCT_TIER_3
          - calculations.cancellation_charge.constants.SHARE_TIER_2_MAX_CENTS
          - entities.Appointment.fields.cancellation_charge_cents
        distinguishing_aspect: |
          The drug's unit_cost_cents is tuned to 22510 so that the single rounding in step
          5 lands exactly on a half cent: waste 22510, provisional 2500 + 22510 == 25010
          which is one cent past the inclusive 25000 edge and therefore tier 3, and
          22510 * 0.35 == 7878.5 exactly. round_half_up gives 7879 and a final charge of
          10379; banker's rounding would give 7878 and 10378, and truncation the same
          10378.
