            - "Program.${prog_id}.placement_status == FIRM_ORDER  # link 3"
            - "Quote.${q_e}.status == LAPSED  # link 4 — never addressed by the broker"
            - "MarketSubmission.${ms_e}.status == CLOSED"
            - "MarketSubmission.${ms_a}.status == CLOSED and MarketSubmission.${ms_b}.status == CLOSED"
            - "Quote.${q_a}.status == FIRM_ORDER and Quote.${q_b}.status == FIRM_ORDER  # firm-ordered quotes are NOT lapsed"
