      - name: c_enrollment_sync_leaves_provisional_unchanged
        claim_type: correct_result
        grounds: ["calculations.assignment_credit_units", "entities.Assignment.fields.credit_units"]
        distinguishing_aspect: "The provisional snapshot is pinned at creation: an enrollment sync from 10 to 50 (cap 60) does NOT change credit_units (3.0) and leaves final_credit_units null until close-census."
        test_recipe:
          setup: ["Term OPEN; CS-301 IN_PERSON section cap 60 enrolled 10, SCHEDULED; Anna qualified; A1 PROPOSED (credit 3.0)"]
          setup_api_calls:
            - { call: "POST /workload-terms", payload: { term_code: "2026-FA", title: "Fall 2026", start_date: "2026-08-24", census_date: "2026-09-07", comp_budget_cents: 2000000 }, as: DepartmentChair, captures: { t_id: "$.data.id" } }
            - { call: "POST /workload-terms/${t_id}/transition", payload: { to_state: "OPEN" }, as: DepartmentChair }
            - { call: "POST /courses", payload: { course_code: "CS-301", title: "Algorithms", course_type: "LECTURE", base_credits: 3, default_enrollment_cap: 30, allowed_modalities: ["IN_PERSON", "ONLINE"] }, as: DepartmentChair, captures: { c1_id: "$.data.id" } }
            - { call: "POST /faculty-members", payload: { full_name: "Anna Aho", email: "anna@x.edu", rank: "ASSOCIATE_PROFESSOR", base_salary_cents: 9000000 }, as: DepartmentChair, captures: { f1_id: "$.data.id" } }
