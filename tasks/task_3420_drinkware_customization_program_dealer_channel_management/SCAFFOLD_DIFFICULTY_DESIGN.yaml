  - rule_id: transitive_cascade
    instances:
      - name: enforcement_confirm_cascades_to_pool_ledger
        grounds:
          - state_machines.EnforcementCase.UNDER_REVIEW_to_CONFIRMED_VIOLATION
          - state_machines.Dealer.AUTHORIZED_to_PROBATION
          - state_machines.LaunchAllocation.ALLOCATED_to_FORFEITED
          - calculations.dealer_infraction_points
          - calculations.drop_unit_ledger
        distinguishing_aspect: |
          Depth-4 cascade from a single resolve: case confirmed (hop 1) -> dealer infraction
          points recomputed 11 -> 15 (hop 2) -> dealer auto-SUSPENDED at >= 12 (hop 3) ->
          the dealer's ALLOCATED allocation on the non-live drop FORFEITED and the 8 units
          return to unallocated_units (hop 4). Trigger is enforcement, not capacity.
