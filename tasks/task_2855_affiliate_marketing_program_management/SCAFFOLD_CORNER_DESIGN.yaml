          assert:
            - "before the triggers AffiliateApplication.${app_id}.revision_round_count == 2, review_state == \"SUBMITTED\", screening_outcome == \"NOT_SCREENED\", site_quality_score null and screened_by_user_id null — resubmit cleared the scores"
            - "the third screen returns HTTP 200 with site_quality_score == 83.4, brand_suitability_score == 100.0 and screening_outcome == \"PASS\" (CONTENT_NEWSLETTER carries SOURCE_MULTIPLIER 0.95 after the resubmit)"
            - "the third REQUEST_CHANGES returns HTTP 422 with data.error_id == \"ERR_REVISION_LIMIT_REACHED\""
            - "after the refusal AffiliateApplication.${app_id}.review_state == \"SCREENED\" and revision_round_count is still 2 — the rejected decision wrote nothing"
            - "the REJECT on the same application returns HTTP 200 with review_state == \"REJECTED\" and decided_by_user_id == \"pm-001\" — the revision cap does not trap the application"
            - "Affiliate.${aff_id}.status == \"TERMINATED\" and version == 2 after the REJECT, having stayed at version 1 through the entire two-round loop"

  - section: calculations
    instances:

      - name: restricted_screen_variant_applies_multiplier_and_wider_penalty_cap
        claim_type: variant_selection
        grounds:
          - calculations.site_quality_composite_score.variants
          - calculations.site_quality_composite_score.constants.PENALTY_CAP
          - calculations.site_quality_composite_score.constants.RESTRICTED_PENALTY_CAP
          - calculations.site_quality_composite_score.constants.RESTRICTED_METHOD_MULTIPLIER
        distinguishing_aspect: "Two applications with byte-identical screening inputs (base 82.3, 5 brand-safety flags, ORGANIC_SEARCH) differ only in declared_promo_methods: the STANDARD_SCREEN one scores 52.3 (penalty capped at 30) and the COUPON_FEED one scores 29.1 (0.90 multiplier plus a penalty capped at 45). A model that ignores the variant, or applies the 0.90 after the penalty (82.3 - 45 = 37.3 -> 33.6), misses both literals."
        test_recipe:
          setup:
            - "Clock 2026-07-05T00:00:00Z."
            - "One Network; two PENDING_APPLICATION partners: a CONTENT partner declaring [\"EDITORIAL_CONTENT\"] and a COUPON partner declaring [\"COUPON_FEED\"]."
            - "One SUBMITTED application each, both with primary_traffic_source ORGANIC_SEARCH (multiplier 1.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "adm-001"
