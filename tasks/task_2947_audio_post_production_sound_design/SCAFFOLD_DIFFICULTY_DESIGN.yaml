          The cascade starts on a facility-wide LibraryAsset, not on the project: revoking the
          asset flips its CLEARED usage to UNLICENSED (unlicensed_reason ASSET_REVOKED, accrued fee
          100000 -> 0), which staleness-marks the stem package with stale_reason LICENSE_REVOKED —
