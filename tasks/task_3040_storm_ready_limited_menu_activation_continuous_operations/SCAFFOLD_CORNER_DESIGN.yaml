      - name: err_unit_not_in_storm_tier_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNIT_NOT_IN_STORM_TIER]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_start_requires_storm_active_and_tiered_unit
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_relief_org_inactive_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RELIEF_ORG_INACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pledge_creation_requires_active_relief_org
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_checklist_incomplete_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHECKLIST_INCOMPLETE]
        excluded_because:
          difficulty_instance: combinatorial_formula / cold_hold_deadline_evaluation_order
          rationale: "The checklist-incomplete gate on the same submit endpoint is exercised by the §1.9 state_machines corner checklist_rework_loop_replaces_fail_item_and_resubmits (FAIL item) and the safety ordering by that §1.8 instance's sibling priority structure."

      - name: err_not_jump_team_triggered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_JUMP_TEAM]
        distinguishing_aspect: "Starting an assignment for a non-jump-team member fails ERR_NOT_JUMP_TEAM even when the storm is ACTIVE, the unit is tiered, and the window has begun — certification is its own gate."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm ACTIVE; unit U power DOWN. Member M with is_jump_team false; assignment window [07:00, 2026-09-12T00:00)."]
          setup_api_calls:
