            distribution-preserving instead of value-reducing: VACATE_PLACEMENT leaves the protested entry
            JUDGED, so it stays inside the SCALE_A counted set, the divisor stays at 5 dogs and the class still
            awards 2 points - they simply belong to a different dog afterwards. So the identity to hold is
            Show.points_awarded_total == sum of Entry.points_awarded == sum of Dog.championship_points_total ==
