    side_effects: ["co_number assigned (monotonic per job)", "computed_delta_cents computed via change_order_pricing"]
  - method: GET
    path: "/panel-shop/change-orders/{id}"
    description: "Fetch a change order."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: GET
    path: "/panel-shop/change-orders"
    description: "List change orders across jobs (FK reverse reachability for supersedes_co_id)."
    roles: [ProjectManager, QAManager, Customer]
    code: 200
    input: ["job_id?", "supersedes_co_id?", "status?", "limit?", "offset?"]
