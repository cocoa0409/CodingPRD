  # --- SamplingFrame --------------------------------------------------------
  - method: POST
    path: /sampling-frames
    description: "Defines a sampling frame: a close-date window plus per-outcome quotas and a selection basis."
    roles: [ResearchAnalyst]
    input: [program_id, label, window_start, window_end, quota_won, quota_lost, quota_no_decision, selection_basis]
    output: SamplingFrame
    success: 201
    side_effects:
      - "status = DRAFT; open slot counters stay 0 until the frame is sealed"

  - method: GET
    path: /sampling-frames/{frame_id}
    description: "Reads one sampling frame with quota, slot and coverage counters."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: SamplingFrame
    success: 200
    side_effects: []

  - method: POST
    path: /sampling-frames/{frame_id}/seal
    description: "DRAFT -> SEALED; materializes the open slot counters from the quotas."
    roles: [ResearchAnalyst]
    input: []
    output: SamplingFrame
    success: 200
    side_effects:
      - "open_won_slots/open_lost_slots/open_no_decision_slots := the respective quotas; coverage_ratio = 0.0000"
      - "increments SamplingFrame.version"

  - method: POST
    path: /sampling-frames/{frame_id}/draw
    description: "Runs the selector (calculations.sample_selection_rank_score) for one outcome stratum and transitions the drawn deals NOT_SELECTED -> SELECTED."
    roles: [ResearchAnalyst]
    input: [stratum, "requested_count?", "deal_id?"]
    output: "Deal[]"
    success: 201
    side_effects:
      - "each drawn Deal gets sampling_frame_id, stratum and selection_rank_score, and research_status SELECTED"
      - "frame.selected_<stratum>_count +N, frame.open_<stratum>_slots -N, coverage_ratio recomputed"
      - "increments SamplingFrame.version and each drawn Deal.version"
    notes: "requested_count defaults to 1. Supplying `deal_id` pins the draw to one candidate, which must still pass every eligibility predicate (that is how ERR_DEAL_OUTSIDE_FRAME_WINDOW is reachable). Response order is the selector order, not id order."

  - method: POST
    path: /sampling-frames/{frame_id}/close
    description: "SEALED or SUSPENDED -> CLOSED; freezes coverage_ratio."
    roles: [ResearchAnalyst]
    input: []
    output: SamplingFrame
    success: 200
    side_effects:
      - "increments SamplingFrame.version"

  # --- Interview ------------------------------------------------------------
  - method: POST
    path: /interviews
    description: "Schedules a buyer interview: independence, consent, cooling-off, analyst slot, capacity and budget are all checked here."
    roles: [ResearchAnalyst]
    input: [deal_id, buyer_contact_id, analyst_id, scheduled_start_at, scheduled_end_at]
    output: Interview
    success: 201
    side_effects:
      - "status = SCHEDULED; incentive_status = COMMITTED; incentive_provisional_usd = interview_incentive_amount variant PROVISIONAL"
      - "guide_version_pinned and required_question_keys_pinned copied from the program (version pinning)"
      - "Program.incentive_committed_usd += incentive_provisional_usd; posture recomputed; Program.version incremented"
      - "Analyst.open_interview_count += 1; Analyst.committed_minutes += duration + DEBRIEF_BUFFER_MINUTES"

  - method: GET
    path: /interviews/{interview_id}
    description: "Reads one interview with its pinned guide and both incentive amounts."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: []
    output: Interview
    success: 200
    side_effects: []

  - method: GET
    path: /interviews
    description: "Filtered list of interviews; reverse lookup for Interview.deal_id, Interview.buyer_contact_id and Interview.analyst_id."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["deal_id?", "buyer_contact_id?", "analyst_id?", "status?", "incentive_status?", "limit?", "offset?"]
    output: "Interview[]"
    success: 200
    side_effects: []
    notes: "Ordering: scheduled_start_at ASC, then created_at ASC."

  - method: POST
    path: /interviews/{interview_id}/complete
    description: "SCHEDULED -> COMPLETED. Head of the 4-link interview_completion_posture_cascade."
    roles: [ResearchAnalyst]
    input: [actual_start_at, actual_end_at]
    output: Interview
    success: 200
    side_effects:
      - "link 1: incentive_final_usd = interview_incentive_amount variant FINAL; incentive_status COMMITTED -> PAID; coverage_complete = true"
      - "link 2: Program.incentive_committed_usd -= provisional and Program.incentive_paid_usd += final"
      - "link 3: Program.posture recomputed from the new utilization"
      - "link 4: when the new posture is FROZEN, every SEALED SamplingFrame of the program -> SUSPENDED"
      - "BuyerContact.completed_interview_count += 1 and last_completed_interview_end_at = actual_end_at"
      - "Deal.research_status SELECTED -> INTERVIEWED; Deal.interview_coverage_count += 1"
      - "Analyst.open_interview_count -= 1; Analyst.committed_minutes -= duration + DEBRIEF_BUFFER_MINUTES"

  - method: POST
    path: /interviews/{interview_id}/no-show
    description: "SCHEDULED -> NO_SHOW after the grace period; forfeits the committed incentive."
    roles: [ResearchAnalyst]
    input: []
    output: Interview
    success: 200
    side_effects:
      - "incentive_status COMMITTED -> FORFEITED; Program.incentive_committed_usd -= provisional; posture recomputed"
      - "Analyst.open_interview_count -= 1; Analyst.committed_minutes released"

  - method: POST
    path: /interviews/{interview_id}/reschedule
    description: "NO_SHOW -> SCHEDULED on a new interval; re-runs every scheduling rule and re-commits the incentive."
    roles: [ResearchAnalyst]
    input: [scheduled_start_at, scheduled_end_at]
    output: Interview
    success: 200
    side_effects:
      - "reschedule_count += 1; incentive_provisional_usd recomputed; incentive_status FORFEITED -> COMMITTED"
      - "Program.incentive_committed_usd += the new provisional amount; posture recomputed"
      - "Analyst.open_interview_count += 1; Analyst.committed_minutes re-reserved"

  - method: POST
    path: /interviews/{interview_id}/cancel
    description: "SCHEDULED or NO_SHOW -> CANCELLED; compensating transition that releases the incentive commitment without paying it."
    roles: [ResearchAnalyst]
    input: ["cancel_reason?"]
    output: Interview
    success: 200
    side_effects:
      - "from SCHEDULED: incentive_status -> RELEASED and Program.incentive_committed_usd -= provisional (ledger returns to its pre-scheduling value)"
      - "from NO_SHOW: incentive_status stays FORFEITED and the ledger is not touched again"
      - "posture recomputed; Analyst counters released when they were still held"

  - method: POST
    path: /interviews/{interview_id}/responses
    description: "Records one structured interview-guide answer. Immutable row (no version, no update endpoint)."
    roles: [ResearchAnalyst]
    input: [question_key, verbatim_text, recorded_at, "rating?", "competitor_name_verbatim?"]
    output: InterviewResponse
    success: 201
    side_effects:
      - "the interview's distinct question_key set grows, which is what validations priority 25 measures at completion"
    notes: "InterviewResponse has common_fields: false — it is append-only evidence."

  - method: GET
    path: /interviews/{interview_id}/responses
    description: "Reverse lookup for InterviewResponse.interview_id; the evidence pool that battlecard claims cite."
    roles: [ProgramAdmin, ResearchAnalyst, LegalReviewer, EnablementManager, ProductManager, SalesRep]
    input: ["question_key?", "limit?", "offset?"]
    output: "InterviewResponse[]"
    success: 200
    side_effects: []
    notes: "Ordering: recorded_at ASC."

  # --- LossReason (taxonomy) -----------------------------------------------
  - method: POST
    path: /loss-reasons
