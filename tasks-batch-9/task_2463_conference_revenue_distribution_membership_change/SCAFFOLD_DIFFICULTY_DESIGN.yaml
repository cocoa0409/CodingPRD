            - *k_g1
            - *k_g2
            - *k_g3
            - *k_g4
            - *k_g1_play
            - *k_g2_play
            - *k_g4_play
            - *k_ba_n
            - *k_ba_n_rev
            - *k_ba_n_app
            - *k_ba_w
