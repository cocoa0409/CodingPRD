  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_cascade_visible_same_request
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the ethics-decision POST response and a subsequent GET on the parent project both reflect the cascade (ethics_status updated) with no delay — reads-after-writes within the same logical instant agree."
        test_recipe:
          setup:
            - "Edition REGISTRATION_OPEN; project P (human subjects) SUBMITTED, plan UNDER_REVIEW, distinct reviewer"
          setup_api_calls:
            - call: "POST /science-fair/fair-editions"
              payload: { name: "IC Edition", normalization_algorithm: "Z_SCORE", max_judges_per_project: 2, min_quorum_ratio_pct: 50 }
              as: FairDirector
              captures: { ed: $.data.id }
            - call: "POST /science-fair/categories"
              payload: { fair_edition_id: "${ed}", code: "BME", name: "Biomed", grade_band: "SENIOR", advancement_slots: 1 }
              as: FairDirector
              captures: { cat: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor IC", email: "mic@x.com" }
              as: FairDirector
              captures: { mp: $.data.id }
            - call: "POST /science-fair/mentors"
              payload: { full_name: "Mentor ICR", email: "micr@x.com" }
              as: FairDirector
              captures: { mr: $.data.id }
            - call: "POST /science-fair/fair-editions/${ed}/open-registration"
              payload: {}
              as: FairDirector
            - call: "POST /science-fair/projects"
              payload: { fair_edition_id: "${ed}", category_id: "${cat}", title: "ICP", team_size: 1, involves_human_subjects: true, involves_animal_subjects: false }
              as: Mentor
              as_user_id: "${mp}"
              captures: { p: $.data.id }
            - call: "POST /science-fair/research-plans"
              payload: { project_id: "${p}", plan_text: "plan", risk_level: "LOW" }
              as: Mentor
              as_user_id: "${mp}"
              captures: { rp: $.data.id }
            - call: "POST /science-fair/research-plans/${rp}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/projects/${p}/submit"
              payload: {}
              as: Mentor
              as_user_id: "${mp}"
            - call: "POST /science-fair/research-plans/${rp}/begin-review"
              payload: {}
              as: EthicsReviewer
          trigger:
            - call: "POST /science-fair/research-plans/${rp}/decisions"
              payload: { reviewer_mentor_id: "${mr}", decision: "APPROVE" }
              as: EthicsReviewer
              captures: { review: $.data.id }
            - call: "GET /science-fair/projects/${p}"
              payload: {}
              as: FairDirector
              captures: { eth: $.data.ethics_status }
          assert:
            - "immediately after the decision POST: Project.${p}.ethics_status == APPROVED (read-after-write consistent)"
            - "EthicsReview.${review} is retrievable via GET /science-fair/ethics-reviews/${review}"
