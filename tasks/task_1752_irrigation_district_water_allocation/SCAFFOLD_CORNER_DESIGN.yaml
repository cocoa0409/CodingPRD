scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: water_account_creation_defaults
        claim_type: creation
        grounds: [entities.WaterAccount, endpoints.POST_/district/water-accounts]
        distinguishing_aspect: "Created account starts ACTIVE with version 1 and computed priority_class derived from its water right date."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /district/water-accounts"
              payload: { holder_name: "New N", parcel_number: "APN-100", irrigated_acres: 12.5, water_right_priority_date: "1888-03-10T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_status: "$.data.status", acct_class: "$.data.priority_class", acct_v: "$.data.version" }
          trigger: []
          assert:
            - "WaterAccount.${acct_id}.status == ACTIVE (default)"
            - "WaterAccount.${acct_id}.priority_class == SENIOR (1888-03-10 <= 1914-12-31)"
            - "WaterAccount.${acct_id}.version == 1"

      - name: priority_class_cut_date_boundary
        claim_type: computed_fields
        grounds: [entities.WaterAccount.fields.priority_class, calculations.curtailed_entitlement]
        distinguishing_aspect: "Priority date exactly on PRIORITY_CUT_DATE (1914-12-31) is SENIOR (inclusive <=); one day later is JUNIOR."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Cut C", parcel_number: "APN-101", irrigated_acres: 1.0, water_right_priority_date: "1914-12-31T00:00:00Z" }
              as: DistrictAdmin
              captures: { senior_class: "$.data.priority_class" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Next N", parcel_number: "APN-102", irrigated_acres: 1.0, water_right_priority_date: "1915-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { junior_class: "$.data.priority_class" }
          trigger: []
          assert:
            - "1914-12-31 priority date -> priority_class == SENIOR (captured senior_class)"
            - "1915-01-01 priority date -> priority_class == JUNIOR (captured junior_class)"

      - name: get_water_account_not_found_returns_404
        claim_type: not_found
        grounds: [entities.WaterAccount, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /district/water-accounts/00000000-0000-0000-0000-000000000000"
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: create_account_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.WaterAccount.fields.status, entities.WaterAccount.fields.version]
        distinguishing_aspect: "Client-supplied status/version on creation are ignored; the server stamps its own (ACTIVE, version 1)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Sys S", parcel_number: "APN-103", irrigated_acres: 3.0, water_right_priority_date: "1890-01-01T00:00:00Z", status: "CLOSED", version: 99 }
              as: DistrictAdmin
              captures: { acct_status: "$.data.status", acct_v: "$.data.version" }
          assert:
            - "Response status == ACTIVE and version == 1 (client-supplied CLOSED/99 ignored)"

      - name: canal_reach_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, endpoints.GET_/district/canal-reaches]
        distinguishing_aspect: "List endpoint applies the fixed envelope pagination defaults (limit 10, offset 0) and reports total_count/has_more."
        test_recipe:
          setup: ["Two canal reaches exist"]
          setup_api_calls:
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach P1", max_capacity_cfs: 10.0 }
              as: DistrictAdmin
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach P2", max_capacity_cfs: 20.0 }
              as: DistrictAdmin
          trigger:
            - call: "GET /district/canal-reaches"
              as: DistrictAdmin
          assert:
            - "Response applies pagination defaults: limit == 10, offset == 0"
            - "total_count == 2 and has_more == false"
            - "Response envelope exposes meta.api_request_id and response_type == array"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_draft_season_rejected
        claim_type: invalid_transition
        grounds: [state_machines.IrrigationSeason.ANNOUNCED_to_OPEN, "errors[ERR_INVALID_SEASON_STATE]"]
        distinguishing_aspect: "OPEN is only reachable from ANNOUNCED; opening a DRAFT season fails with ERR_INVALID_SEASON_STATE and no state change."
        test_recipe:
          setup: ["Season exists in DRAFT (never announced)"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_SEASON_STATE (409)"
            - "IrrigationSeason.${season_id}.status remains DRAFT"

      - name: allocation_create_requires_announced_season
        claim_type: precondition_enforcement
        grounds: ["validations[priority=6]", "errors[ERR_SEASON_NOT_OPEN]"]
        distinguishing_aspect: "SeasonAllocation creation is guarded by the IrrigationSeason lifecycle: a DRAFT season rejects with ERR_SEASON_NOT_OPEN (guarded transition across SeasonAllocation -> IrrigationSeason)."
        test_recipe:
          setup: ["Season in DRAFT; account exists"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Guard G", parcel_number: "APN-104", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id" }
          trigger:
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SEASON_NOT_OPEN (409); no SeasonAllocation is persisted"

      - name: close_season_with_flowing_order_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.IrrigationSeason.OPEN_to_CLOSED, "errors[ERR_INVALID_SEASON_STATE]"]
        distinguishing_aspect: "Season close is blocked while any order is FLOWING; the in-flight delivery must be measured and verified first."
        test_recipe:
          setup: ["Season OPEN; account 5 acres; order SCHEDULED then started -> FLOWING (clock inside its window)"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Flow F", parcel_number: "APN-105", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach CS", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 5.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_id}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
          trigger:
            - call: "POST /district/seasons/${season_id}/close"
              payload: {}
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_SEASON_STATE (409)"
            - "IrrigationSeason.${season_id}.status remains OPEN and TurnoutOrder.${order_id}.status remains FLOWING"

      - name: cancel_delivered_order_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.TurnoutOrder, "errors[ERR_INVALID_ORDER_STATE]"]
        distinguishing_aspect: "DELIVERED is terminal: cancelling a delivered order fails with ERR_INVALID_ORDER_STATE and the delivered ledger stays posted."
        test_recipe:
          setup: ["Season OPEN; account 5 acres; order delivered with measured 2.48 af (3 cfs x 10 h)"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Term T", parcel_number: "APN-106", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach TD", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 3.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_id}"
              as: DistrictAdmin
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_id}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_id}/submit-measurement"
              payload: { measured_cfs: 3.0, measured_hours: 10.0 }
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_id}/verify"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /district/turnout-orders/${order_id}/cancel"
              payload: {}
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_ORDER_STATE (409)"
            - "TurnoutOrder.${order_id}.status remains DELIVERED and SeasonAllocation.${alloc_id}.delivered_af remains 2.48"

      - name: pay_draft_invoice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssessmentInvoice, "errors[ERR_INVALID_INVOICE_STATE]"]
        distinguishing_aspect: "Payment is only valid from ISSUED/DELINQUENT/LIEN_FILED; paying a DRAFT invoice fails with ERR_INVALID_INVOICE_STATE."
        test_recipe:
          setup: ["Season; account 10 acres; invoice created (DRAFT, never issued)"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Draft D", parcel_number: "APN-107", irrigated_acres: 10.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /district/assessment-invoices"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { inv_id: "$.data.id" }
          trigger:
            - call: "POST /district/assessment-invoices/${inv_id}/pay"
              payload: {}
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_INVOICE_STATE (409)"
            - "AssessmentInvoice.${inv_id}.status remains DRAFT and paid_at remains null"

      - name: verify_work_order_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RiderWorkOrder.MEASUREMENT_SUBMITTED_to_VERIFIED, "errors[ERR_INVALID_WORK_ORDER_STATE]"]
        distinguishing_aspect: "Verification is single-shot: a second verify on a VERIFIED work order fails with ERR_INVALID_WORK_ORDER_STATE and delivered_af is not double-posted."
        test_recipe:
          setup: ["Season OPEN; account 5 acres; order delivered via verified work order (measured 2.48 af)"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Idem I", parcel_number: "APN-108", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_id}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_id: "$.data.id" }
            - call: "POST /district/canal-reaches"
              payload: { name: "Reach IV", max_capacity_cfs: 50.0 }
              as: DistrictAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /district/turnout-orders"
              payload: { water_account_id: "${acct_id}", season_allocation_id: "${alloc_id}", canal_reach_id: "${reach_id}", requested_cfs: 3.0, requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z", expected_water_account_version: "${acct_v}" }
              as: WaterUser
              as_user_id: "${acct_id}"
              captures: { order_id: "$.data.id" }
            - call: "POST /district/turnout-orders/${order_id}/schedule"
              payload: { rider_user_id: "rider-1" }
              as: DistrictAdmin
            - call: "GET /district/rider-work-orders?turnout_order_id=${order_id}"
              as: DistrictAdmin
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/turnout-orders/${order_id}/start"
              payload: {}
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_id}/submit-measurement"
              payload: { measured_cfs: 3.0, measured_hours: 10.0 }
              as: DitchRider
              as_user_id: "rider-1"
            - call: "POST /district/rider-work-orders/${wo_id}/verify"
              payload: {}
              as: DistrictAdmin
          trigger:
            - call: "POST /district/rider-work-orders/${wo_id}/verify"
              payload: {}
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_WORK_ORDER_STATE (409)"
            - "SeasonAllocation.${alloc_id}.delivered_af remains 2.48 (no double-post)"

      - name: post_pending_transfer_rejected
        claim_type: invalid_transition
        grounds: [state_machines.TransferRequest.APPROVED_to_POSTED, "errors[ERR_INVALID_TRANSFER_STATE]"]
        distinguishing_aspect: "Posting requires APPROVED; posting a PENDING transfer fails with ERR_INVALID_TRANSFER_STATE and no ledger movement occurs."
        test_recipe:
          setup: ["Season OPEN; accounts A (5 acres) and B (1 acre) with allocations; transfer 1.00 af created PENDING"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /district/seasons/${season_id}/announce"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/seasons/${season_id}/open"
              payload: {}
              as: DistrictAdmin
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Src S", parcel_number: "APN-109", irrigated_acres: 5.0, water_right_priority_date: "1888-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_a: "$.data.id" }
            - call: "POST /district/water-accounts"
              payload: { holder_name: "Dst D", parcel_number: "APN-110", irrigated_acres: 1.0, water_right_priority_date: "1890-01-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { acct_b: "$.data.id" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_a}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_a: "$.data.id", alloc_a_v: "$.data.version" }
            - call: "POST /district/season-allocations"
              payload: { water_account_id: "${acct_b}", season_id: "${season_id}" }
              as: DistrictAdmin
              captures: { alloc_b: "$.data.id" }
            - call: "POST /district/transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", season_id: "${season_id}", quantity_af: 1.0, expected_source_allocation_version: "${alloc_a_v}" }
              as: WaterUser
              as_user_id: "${acct_a}"
              captures: { t_id: "$.data.id" }
          trigger:
            - call: "POST /district/transfer-requests/${t_id}/post"
              payload: {}
              as: DistrictAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_TRANSFER_STATE (409)"
            - "SeasonAllocation.${alloc_a}.transfers_out_af == 0.00 and SeasonAllocation.${alloc_b}.transfers_in_af == 0.00"

      - name: effectuate_second_drought_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DroughtDeclaration.PROPOSED_to_EFFECTIVE, "errors[ERR_INVALID_DROUGHT_STATE]"]
        distinguishing_aspect: "At most one EFFECTIVE declaration per season: effectuating a second PROPOSED declaration while one is EFFECTIVE fails with ERR_INVALID_DROUGHT_STATE."
        test_recipe:
          setup: ["Season OPEN; two PROPOSED drought declarations (STAGE_1, STAGE_2); first effectuated"]
          setup_api_calls:
            - call: "POST /district/seasons"
              payload: { year: 2026, announced_af_per_acre: 2.0, carryover_cap_pct: 50, billing_method: "PER_ACRE", assessment_rate_per_acre: 25.00, toll_tier1_cap_af: 20.0, toll_tier1_rate_per_af: 18.00, toll_tier2_rate_per_af: 30.00, overage_rate_per_af: 60.00, start_date: "2026-04-01T00:00:00Z", end_date: "2026-09-30T00:00:00Z" }
              as: DistrictAdmin
