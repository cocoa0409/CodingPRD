    - name: benchmark_variance_thresholds_at_zero_and_max_program_premium
      claim_type: threshold
      grounds:
      - calculations.rate_benchmark_compliance
      - calculations.rate_benchmark_compliance.constants
      - entities.Proposal.fields.benchmark_variance_pct
      - entities.Proposal.fields.compliance_status
      - entities.Venue.fields.preferred_supplier_status
      distinguishing_aspect: 'Compliance is a two-input threshold: for a PREFERRED venue variance <= 0 is COMPLIANT (260.00 -> 0.0000), variance <= MAX_PROGRAM_PREMIUM_PCT is COMPLIANT_WITH_VARIANCE (286.00 -> exactly 0.1000, still inside), and one cent more flips it (286.02 -> 0.1001 -> NON_COMPLIANT) - while the SAME 0.0000 variance on a venue with preferred_supplier_status NONE can never be better than COMPLIANT_WITH_VARIANCE.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
        - RateBenchmark (TIER_1, USER_CONFERENCE) at 260.00 ADR.
        - 'Four TIER_1 Lisbon venues (300 rooms, 13000 sqft): the first three PREFERRED, the fourth with preferred_supplier_status NONE.'
        - MeetingEvent EVT-2822-A requirements locked, all four SHORTLISTED at ranks 1-4; round-1 Rfp issued.
        - 'All four submit the same simple 100-night NET grid (no comp ratio, no resort fee, no AV, no F&B, 20% service charge, 10% tax, no concession); only the room rate differs: 260.00, 286.00, 286.02 and 260.00.'
