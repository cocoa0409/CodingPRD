  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_load_visible_in_award_response
        claim_type: immediate_visibility
        grounds:
          - endpoints[POST /freight/quote-requests/{id}/award]
          - state_machines.QuoteRequest.OPEN_to_AWARDED
        distinguishing_aspect: |
          The POST /quote-requests/{id}/award response immediately contains
          the freshly-created Load row (Load.status=AWARDED,
          agreed_rate_cents=QuoteRequest.quoted_total_cents). Same request
          surfaces the cascade-created child entity.
        test_recipe:
          setup:
            - "Shipper, carrier QUALIFIED, OPEN quote on lane. SPOT quote so quoted_total at create = 96250 (distance=250 DRY_VAN)."
          setup_api_calls:
            - call: "POST /freight/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BrokerOps
            - call: "POST /freight/shippers"
              payload: { legal_name: "Oscar Two Shippers", billing_email: "ap@oscar2.test", credit_limit_cents: 100000000 }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /freight/carriers"
              payload: { legal_name: "O2 Carrier", mc_number: "3737371", usdot_number: "37373737", smartway_tier: "NONE", insurance_expiry_utc: "2027-01-01T00:00:00Z", safety_score: 30 }
              as: BrokerOps
              captures: { c_id: $.data.id }
            - call: "POST /freight/carriers/${c_id}/qualify"
              payload: {}
              as: BrokerOps
            - call: "POST /freight/quote-requests"
              payload: { shipper_id: "${s_id}", lane_origin: "10001", lane_destination: "30303", distance_miles: 250, pickup_window_start_utc: "2026-06-15T08:00:00Z", pickup_window_end_utc: "2026-06-15T18:00:00Z", requested_equipment: "DRY_VAN" }
              as: BrokerOps
              captures: { q_id: $.data.id, q_v: $.data.version, q_total: $.data.quoted_total_cents }
          trigger:
            - call: "POST /freight/quote-requests/${q_id}/award"
              payload: { carrier_id: "${c_id}", expected_quote_request_version: "${q_v}" }
              as: BrokerOps
              captures: { ld_id: $.data.id, ld_status: $.data.status, ld_rate: $.data.agreed_rate_cents }
          assert:
            - "Load.${ld_id}.status == 'AWARDED'"
            - "Load.${ld_id}.agreed_rate_cents == 96250"
            - "QuoteRequest.${q_id}.status == 'AWARDED'"
