        grounds:
          - state_machines.Transaction.DRAFT_to_FILED
          - entities.Transaction.fields.filed_by_user_id
          - calculations.transaction_filing_deadline
        distinguishing_aspect: "POST /transactions/{id}/file on a DRAFT SIGNING filing at 2026-08-10T14:00:00Z returns 200 with status FILED, filed_at 2026-08-10T14:00:00Z and filed_by_user_id equal to the acting club id."
