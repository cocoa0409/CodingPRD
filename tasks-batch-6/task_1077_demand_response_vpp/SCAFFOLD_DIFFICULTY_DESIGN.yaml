          - validations[priority=17]
          - entities.DispatchEvent.fields.window_start
          - errors[ERR_EVENT_WINDOW_CONFLICT]
        distinguishing_aspect: "DispatchEvent windows use a 120-minute buffer on each side: a new event starting 60 min after an existing event's end collides (ERR_EVENT_WINDOW_CONFLICT), but one starting exactly 120 min after (buffer edge) is accepted. Buffer-padded interval arithmetic on the Program's event calendar."
        test_recipe:
          setup:
            - "An ACTIVE program (max 3 events) with one SCHEDULED event 2026-06-01 14:00-16:00."
          setup_api_calls:
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, baseline_method: "TEN_OF_TEN", settlement_method: "PAY_FOR_PERFORMANCE", performance_floor_pct: 0.75, notification_lead_minutes: 60, max_events_per_season: 3, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt1_id: $.data.id }
          trigger:
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T17:00:00Z", window_end: "2026-06-01T18:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { err: $.data.error_id }
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T18:00:00Z", window_end: "2026-06-01T19:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { ok_id: $.data.id }
          assert:
            - "Event at 17:00-18:00 (60 min after evt1 end) returns 409 error_id == ERR_EVENT_WINDOW_CONFLICT"
            - "Event at 18:00-19:00 (exactly 120 min after evt1 end) is created (201) — buffer edge is inclusive of separation"

      - name: reading_interval_overlap_adjacency_ok
        grounds:
          - validations[priority=19]
          - entities.MeterReading.fields.interval_start
          - errors[ERR_READING_INTERVAL_OVERLAP]
        distinguishing_aspect: "MeterReading intervals are half-open with NO buffer: an adjacent reading (start == prior end) is accepted, but a reading overlapping by 30 minutes is rejected (ERR_READING_INTERVAL_OVERLAP). Adjacency-allowed interval arithmetic on the Device, contrasting the buffered event calendar."
        test_recipe:
          setup:
            - "One device with a BASELINE_WINDOW reading 10:00-11:00."
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-20T10:00:00Z", interval_end: "2026-05-20T11:00:00Z", kw_load: 7, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
          trigger:
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-20T11:00:00Z", interval_end: "2026-05-20T12:00:00Z", kw_load: 6, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { adj_id: $.data.id }
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-20T10:30:00Z", interval_end: "2026-05-20T11:30:00Z", kw_load: 8, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent reading 11:00-12:00 is created (201) — end==start is not an overlap"
            - "Overlapping reading 10:30-11:30 returns 409 error_id == ERR_READING_INTERVAL_OVERLAP"

  - rule_id: compensating_invariant
    instances:
      - name: aggregator_paid_balance_conserved_on_dispute
        grounds:
          - state_machines.Settlement.APPROVED_to_DISPUTED
          - calculations.aggregator_paid_balance_cents
          - entities.Payment.fields.status
        distinguishing_aspect: "Conserved quantity = money (paid_balance_cents). Approve sets Payment ISSUED and Aggregator.paid_balance_cents 500; the compensating dispute-after-approval reverses the Payment and the invariant paid_balance_cents == sum(ISSUED|CLEARED payments) drives the balance back to 0 with zero drift."
        test_recipe:
          setup:
            - "A COMPLETED event (one dispatch, net 500), settlement submitted then APPROVED by op2; Payment ISSUED amount 500; Aggregator.paid_balance_cents 500."
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, baseline_method: "TEN_OF_TEN", settlement_method: "PAY_FOR_PERFORMANCE", performance_floor_pct: 0.75, notification_lead_minutes: 60, max_events_per_season: 3, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "BATTERY", nameplate_kw: 10, capacity_kwh: 20 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-20T14:00:00Z", interval_end: "2026-05-20T15:00:00Z", kw_load: 10, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-21T14:00:00Z", interval_end: "2026-05-21T15:00:00Z", kw_load: 9, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-05-22T14:00:00Z", interval_end: "2026-05-22T15:00:00Z", kw_load: 8, reading_type: "BASELINE_WINDOW" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /dr/dispatch-events"
              payload: { program_id: "${prog_id}", window_start: "2026-06-01T14:00:00Z", window_end: "2026-06-01T16:00:00Z", target_reduction_kw: 5 }
              as: ProgramOperator
              captures: { evt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_id}/notify"
              payload: {}
              as: ProgramOperator
              as_user_id: "op1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_id}/start"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices/${dev_id}/meter-readings"
              payload: { interval_start: "2026-06-01T14:00:00Z", interval_end: "2026-06-01T16:00:00Z", kw_load: 4.0, reading_type: "EVENT_WINDOW", dispatch_event_id: "${evt_id}" }
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T16:00:00Z" }
              as: ProgramOperator
            - call: "POST /dr/dispatch-events/${evt_id}/complete"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/settlements"
              payload: { dispatch_event_id: "${evt_id}" }
              as: ProgramOperator
              captures: { set_id: $.data.id }
            - call: "POST /dr/settlements/${set_id}/submit"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/settlements/${set_id}/approve"
              payload: {}
              as: ProgramOperator
              as_user_id: "op2"
            - call: "GET /dr/aggregators/${agg_id}"
              as: ProgramOperator
              captures: { balance_before: $.data.paid_balance_cents }
          trigger:
            - call: "POST /dr/settlements/${set_id}/dispute"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "GET /dr/settlements/${set_id}/payments"
              as: ProgramOperator
              captures: { pay_status: "$.data[0].status" }
            - call: "GET /dr/aggregators/${agg_id}"
              as: ProgramOperator
              captures: { balance_after: $.data.paid_balance_cents }
          assert:
            - "Before dispute Aggregator.${agg_id}.paid_balance_cents == 500"
            - "After dispute the Payment status == REVERSED"
            - "After dispute Aggregator.${agg_id}.paid_balance_cents == 0 (invariant restored, no drift)"

      - name: enrollment_committed_kw_conserved_on_optout_reenroll
        grounds:
          - state_machines.Enrollment.ACTIVE_to_OPTED_OUT
          - state_machines.Enrollment.OPTED_OUT_to_ACTIVE
          - calculations.program_total_committed_kw
        distinguishing_aspect: "Conserved quantity = pledged capacity (kW). Opt-out debits Program.total_committed_kw by committed_kw and re-enroll credits it back; the invariant total_committed_kw == sum(committed_kw over ACTIVE enrollments) returns to 5.0 with no drift — a different conserved quantity than money."
        test_recipe:
          setup:
            - "One ACTIVE program, one enrolled device (committed 5) ACTIVE, so Program.total_committed_kw == 5.0."
          setup_api_calls:
            - call: "POST /dr/aggregators"
              payload: { name: "Agg", contact_email: "a@x.com" }
              as: ProgramOperator
              captures: { agg_id: $.data.id }
            - call: "POST /dr/customers"
              payload: { name: "Cust", email: "c@x.com", service_address: "1 St", utility_account_id: "UA1" }
              as: ProgramOperator
              captures: { cust_id: $.data.id }
            - call: "POST /dr/programs"
              payload: { name: "P", utility_name: "U", incentive_rate_cents_per_kwh: 50, penalty_rate_cents_per_kwh: 80, capacity_incentive_cents_per_kw: 1000, baseline_method: "TEN_OF_TEN", settlement_method: "PAY_FOR_PERFORMANCE", performance_floor_pct: 0.75, notification_lead_minutes: 60, max_events_per_season: 3, season_start_date: "2026-05-01T00:00:00Z", season_end_date: "2026-09-30T00:00:00Z" }
              as: ProgramOperator
              captures: { prog_id: $.data.id }
            - call: "POST /dr/programs/${prog_id}/activate"
              payload: {}
              as: ProgramOperator
            - call: "POST /dr/devices"
              payload: { customer_id: "${cust_id}", device_type: "THERMOSTAT", nameplate_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /dr/enrollments"
              payload: { device_id: "${dev_id}", program_id: "${prog_id}", committed_kw: 5 }
              as: Aggregator
              as_user_id: "${agg_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /dr/enrollments/${enr_id}/activate"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "GET /dr/programs/${prog_id}"
              as: ProgramOperator
              captures: { committed_before: $.data.total_committed_kw }
          trigger:
            - call: "POST /dr/enrollments/${enr_id}/opt-out"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /dr/programs/${prog_id}"
              as: ProgramOperator
              captures: { committed_mid: $.data.total_committed_kw }
            - call: "POST /dr/enrollments/${enr_id}/re-enroll"
              payload: {}
              as: Aggregator
              as_user_id: "${agg_id}"
            - call: "GET /dr/programs/${prog_id}"
              as: ProgramOperator
              captures: { committed_after: $.data.total_committed_kw }
          assert:
            - "Before opt-out Program.${prog_id}.total_committed_kw == 5.0"
            - "After opt-out Program.${prog_id}.total_committed_kw == 0.0 (debited)"
            - "After re-enroll Program.${prog_id}.total_committed_kw == 5.0 (credited back, no drift)"
