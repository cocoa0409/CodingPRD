          business_constraint (priority 8) — a different pair from
          state-vs-fiscal: creating an assembly job whose window is in the past
          for an order whose article lacks any AssemblyStandard must surface
          ERR_WINDOW_IN_PAST, not ERR_STANDARD_MISSING.
        test_recipe:
