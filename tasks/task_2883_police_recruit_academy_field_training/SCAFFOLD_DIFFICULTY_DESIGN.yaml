      - name: absence_hours_exactly_at_limit_does_not_trigger_dismissal_review
        grounds:
          - calculations.absence_hours_accrual
          - entities.Recruit.fields.unexcused_absence_hours
          - entities.CertificationStandard.fields.max_absence_hours
          - state_machines[Recruit.academy_status].transitions[IN_PROGRESS -> DISMISSAL_PENDING]
          - entities.AttendanceRecord.fields.counted_absence_hours
        distinguishing_aspect: |
          The dismissal-review trigger is STRICTLY GREATER THAN max_absence_hours. Two 2.00-hour
          unexcused absences land the accrual on exactly 4.00, where 4.00 > 4.00 is false and
          academy_status must stay IN_PROGRESS; a third session of only 0.50 hours pushes it to 4.50
          and flips academy_status to DISMISSAL_PENDING. Both sides of the same boundary are observed
          in one recipe, so >= and > are distinguishable, and the third session is deliberately a
          half-hour block so the crossing amount (0.50) is smaller than any earlier increment. The
          instance also pins the cascade ordering inside the delivering request: the row that caused
          the breach is CREDITED before the threshold is evaluated, so the DISMISSAL_PENDING
