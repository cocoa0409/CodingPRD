      - name: seed_lot_market_must_appear_in_the_lines_approved_agreement
        claim_type: Conditional validation
        grounds:
          - validations[priority=41]
          - validations[priority=22]
          - errors[ERR_AGREEMENT_ALREADY_ACTIVE]
          - errors[ERR_MARKET_NOT_IN_AGREEMENT]
        distinguishing_aspect: "A line may hold only one live agreement - a second DRAFT is refused while the first is still in {DRAFT, SUBMITTED, CHANGES_REQUESTED, APPROVED} - and once approved the agreement's approved_markets array becomes the whitelist for every lot, so a lot for an unlisted market is refused even though stewardship_status is APPROVED."
        test_recipe:
          setup:
            - "One program, one objective, line SX-1001 with seed_inventory_g 500000."
            - "A DRAFT stewardship agreement for markets [US_CORNBELT]."
          setup_api_calls:
