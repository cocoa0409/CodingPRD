      - name: conference_creation_without_program_freeze_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST./conferences
          - validations[priority=7]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          program_freeze_utc has source input and no default, so omitting it is
          a priority-7 failure (HTTP 400 ERR_VALIDATION) - the conference must
          not be created with a null freeze instant that would later make every
          program-freeze temporal check vacuous.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-01-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
          trigger:
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1 }
