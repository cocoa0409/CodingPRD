# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3138_reference_laboratory_send_out_testing_result_interfacing
#
# Breadth probe. Every testable claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered there appear as `excluded_because:` stubs with no test_recipe.
# `section:` values and `claim_type:` names come from
# references/claim-extraction-guide.md; no new categories are invented.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: catalog_entry_create_returns_every_declared_field_and_starts_draft
        claim_type: Creation
        grounds:
          - entities.TestCatalogEntry
          - endpoints.POST_/reference-lab/test-catalog-entries
        distinguishing_aspect: "A catalog entry posted with the full requirement set comes back 201 in status DRAFT with version 1, a server-minted id and null reflex_test_code preserved as null rather than coerced to a string."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database; one ACTIVE client exists only so lab_client_admin scope checks resolve."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ReferenceLabOperations
            - &k_client
              call: "POST /reference-lab/client-laboratories"
              payload: { name: "Cache Valley Reference Lab", clia_number: "45D-3001", client_type: "REFERENCE_LAB", state_code: "UT", billing_arrangement: "CLIENT", credit_limit_cents: 5000000 }
              as: ReferenceLabOperations
              captures: { kc_id: $.data.id }
          trigger:
            - call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "LACTATE_PLASMA", test_name: "Lactate, Plasma", test_category: "ROUTINE", method: "PHOTOMETRY", required_specimen_type: "PLASMA_LITHIUM_HEPARIN", container_type: "GREEN_TOP", min_volume_ml: 1.0, transport_temperature: "REFRIGERATED", stability_hours_ambient: 0.5, stability_hours_refrigerated: 24, stability_hours_frozen: 720, base_tat_hours: 6, list_price_cents: 1400, client_price_cents: 1237, floor_price_cents: 0, critical_value_low: null, critical_value_high: null, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 6, is_utilization_managed: false }
              as: LabClientAdmin
              as_user_id: "${kc_id}"
              captures: { kt_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"
            - "TestCatalogEntry.${kt_id}.test_code == \"LACTATE_PLASMA\" and test_category == ROUTINE"
            - "TestCatalogEntry.${kt_id}.status == DRAFT and version == 1"
            - "TestCatalogEntry.${kt_id}.reflex_test_code == null and critical_value_low == null"
            - "TestCatalogEntry.${kt_id}.min_volume_ml == 1.0 and transport_temperature == REFRIGERATED"

      - name: specimen_get_returns_condition_and_zero_aliquot_total_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Specimen
          - endpoints.GET_/reference-lab/specimens/{id}
        distinguishing_aspect: "Every Specimen intake field round-trips through GET exactly as posted, including the null condition_reason_code on an ACCEPTABLE tube and a total_aliquot_volume_ml of 0.00 derived from an empty child set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a certified build and a published ferritin entry; a specimen received without any aliquot children."
          setup_api_calls:
            - *k_clock
            - &k_cl2
              call: "POST /reference-lab/client-laboratories"
              payload: { name: "Uintah Basin Clinic", clia_number: "45D-3002", client_type: "PHYSICIAN_OFFICE", state_code: "UT", billing_arrangement: "PATIENT", credit_limit_cents: 400000 }
              as: ReferenceLabOperations
              captures: { kc2_id: $.data.id }
            - &k_t1
              call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "FERRITIN", test_name: "Ferritin, Serum", test_category: "ROUTINE", method: "IMMUNOASSAY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "AMBIENT", stability_hours_ambient: 72, stability_hours_refrigerated: 168, stability_hours_frozen: 720, base_tat_hours: 6, list_price_cents: 1200, client_price_cents: 1000, floor_price_cents: 450, critical_value_low: 5, critical_value_high: 400, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 12, is_utilization_managed: true }
              as: LabClientAdmin
              as_user_id: "${kc2_id}"
              captures: { kt1_id: $.data.id }
            - &k_pub
              call: "POST /reference-lab/test-catalog-entries/${kt1_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${kc2_id}"
            - &k_ib
              call: "POST /reference-lab/interface-builds"
              payload: { client_laboratory_id: "${kc2_id}", build_version_label: "v1", format: "HL7_V2_5_1", order_interface_enabled: true, result_interface_enabled: true }
              as: InterfaceAnalyst
              captures: { kib_id: $.data.id }
            - &k_ibs
              call: "POST /reference-lab/interface-builds/${kib_id}/start-build"
              payload: {}
              as: InterfaceAnalyst
            - &k_ibc
              call: "POST /reference-lab/interface-builds/${kib_id}/certify"
              payload: {}
              as: InterfaceAnalyst
            - &k_clv
              call: "GET /reference-lab/client-laboratories/${kc2_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { kc2_v: $.data.version }
            - &k_run
              call: "POST /reference-lab/courier-runs"
              payload: { client_laboratory_id: "${kc2_id}", route_code: "VER-AM", origin_city: "Vernal", destination_city: "Salt Lake City", vehicle_id: "SUV-3", scheduled_departure_at: "2026-08-31T22:00:00Z", scheduled_arrival_at: "2026-09-01T03:30:00Z", scheduled_pickup_at: "2026-08-31T22:00:00Z", scheduled_delivery_at: "2026-09-01T03:30:00Z", temperature_control_mode: "AMBIENT", expected_client_laboratory_version: "${kc2_v}" }
              as: CourierCoordinator
              captures: { krun_id: $.data.id }
            - &k_pr
              call: "POST /reference-lab/client-laboratories/${kc2_id}/publish-requirements"
              payload: {}
              as: ReferenceLabOperations
            - &k_act
              call: "POST /reference-lab/client-laboratories/${kc2_id}/activate"
              payload: {}
              as: ReferenceLabOperations
            - &k_spec
              call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${kc2_id}", courier_run_id: "${krun_id}", accession_number: "ACC-3101", patient_mrn: "MRN-3101", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 2.5, collection_at: "2026-08-31T20:40:00Z", received_at: "2026-09-01T03:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null }
              as: AccessioningTechnologist
              captures: { ksp_id: $.data.id }
          trigger:
            - call: "GET /reference-lab/specimens/${ksp_id}"
              payload: {}
              as: AccessioningTechnologist
              captures: { ksp_status: $.data.status, ksp_total: $.data.total_aliquot_volume_ml }
          assert:
            - "the response status is 200 and response_type is object"
            - "Specimen.${ksp_id}.status == RECEIVED and condition == ACCEPTABLE"
            - "Specimen.${ksp_id}.condition_reason_code == null and rejection_reason_code == null"
            - "Specimen.${ksp_id}.total_aliquot_volume_ml == 0.00"
            - "Specimen.${ksp_id}.volume_ml == 2.5 and accession_number == \"ACC-3101\""

      - name: order_test_lines_list_paginates_and_filters_within_one_order
        claim_type: Listing
        grounds:
          - endpoints.GET_/reference-lab/order-test-lines
          - entities.OrderTestLine
          - response_envelope.pagination_fields
        distinguishing_aspect: "The line listing honours limit/offset, reports total_count and has_more against the unfiltered match set, and a line_status filter narrows the same set rather than replacing the pagination window."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client and one order carrying three ferritin lines in PENDING."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - &k_ord
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${kc2_id}", specimen_id: "${ksp_id}", order_number: "REQ-3101", patient_mrn: "MRN-3101", client_requested_at: "2026-08-31T20:45:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${kt1_id}", line_sequence: 1 }, { test_catalog_entry_id: "${kt1_id}", line_sequence: 2 }, { test_catalog_entry_id: "${kt1_id}", line_sequence: 3 }], override_utilization_guard: true }
              as: AccessioningTechnologist
              captures: { kord_id: $.data.id }
          trigger:
            - call: "GET /reference-lab/order-test-lines"
              payload: { send_out_order_id: "${kord_id}", limit: 2, offset: 0 }
              as: MedicalTechnologist
          assert:
            - "the response status is 200 and response_type is array"
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /reference-lab/order-test-lines?send_out_order_id=${kord_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /reference-lab/order-test-lines?send_out_order_id=${kord_id}&line_status=PENDING returns 3 rows"
            - "GET /reference-lab/order-test-lines?send_out_order_id=${kord_id} with no limit returns all 3 rows with limit defaulting to 10 and offset to 0"

      - name: send_out_order_get_with_an_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/reference-lab/send-out-orders/{id}
          - errors.ERR_SEND_OUT_ORDER_NOT_FOUND
          - validations.priority_3_existence
        distinguishing_aspect: "A syntactically valid but unallocated id on the order path produces the entity-specific 404 ERR_SEND_OUT_ORDER_NOT_FOUND and not the generic request error a malformed id would produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No order has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /reference-lab/send-out-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ReferenceLabOperations
              captures: { k_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_SEND_OUT_ORDER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: send_out_order_create_without_any_test_lines_returns_empty_requisition
        claim_type: Required Fields
        grounds:
          - entities.SendOutOrder
          - validations.priority_6.5_business_constraint
          - errors.ERR_EMPTY_REQUISITION
        distinguishing_aspect: "test_lines is a required input with no default, so an empty list is a 400 ERR_EMPTY_REQUISITION from the requisition-shape check rather than the 422 ERR_CATALOG_ENTRY_NOT_PUBLISHED that a populated line set against a draft entry produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a certified build and a published ferritin entry."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_t1
            - *k_pub
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
          trigger:
            - call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${kc2_id}", specimen_id: "${ksp_id}", order_number: "REQ-3102", patient_mrn: "MRN-3101", client_requested_at: "2026-08-31T20:46:00Z", priority: "ROUTINE", test_lines: [], override_utilization_guard: false }
              as: AccessioningTechnologist
              captures: { k_err2: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_EMPTY_REQUISITION"
            - "error_id != ERR_CATALOG_ENTRY_NOT_PUBLISHED"
            - "GET /reference-lab/send-out-orders?client_laboratory_id=${kc2_id} returns 0 rows"

      - name: billing_ledger_create_omitting_opening_fields_starts_all_zero
        claim_type: Defaults
        grounds:
          - entities.BillingLedger.fields.billed_cents
          - entities.BillingLedger.fields.voided_cents
          - entities.BillingLedger.fields.net_billed_cents
          - calculations.billing_ledger_net_position
        distinguishing_aspect: "All four ledger accumulators are computed from an empty charge set, so a freshly opened ledger stores 0.00, 0.00, 0.00 and 0 rather than null, and the conserved net is exactly zero from the start."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one registered client with no orders."
          setup_api_calls:
            - *k_clock
            - *k_cl2
          trigger:
            - call: "POST /reference-lab/billing-ledgers"
              payload: { client_laboratory_id: "${kc2_id}" }
              as: LabBillingSpecialist
              captures: { kbl_id: $.data.id }
          assert:
            - "the response status is 201"
            - "BillingLedger.${kbl_id}.billed_cents == 0.00 and voided_cents == 0.00"
            - "BillingLedger.${kbl_id}.net_billed_cents == 0.00 and charge_entry_count == 0"
            - "BillingLedger.${kbl_id}.status == OPEN and version == 1"

      - name: result_flag_is_computed_from_catalogue_limits_on_read_and_never_stored
        claim_type: Computed Fields
        grounds:
          - entities.OrderTestLine.fields.result_flag
          - entities.TestCatalogEntry.fields.critical_value_low
          - entities.TestCatalogEntry.fields.critical_value_high
          - entities.TestCatalogEntry.fields.reference_low
          - entities.TestCatalogEntry.fields.reference_high
        distinguishing_aspect: "result_flag resolves through a pinned five-step ladder over two different limit pairs on the same row: 7.0 against reference_low 10 and critical_value_low 5 is LOW, exactly 10.0 is NORMAL because the reference bound is inclusive, 350.0 against reference_high 300 is HIGH, and 401.0 against critical_value_high 400 is CRITICAL_HIGH."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with a certified build and a published ferritin entry whose reference interval is 10 to 300 and whose critical limits are 5 and 400."
            - "One 2.5 mL serum specimen with a four-line ferritin order, accessioned and in IN_TESTING with a RUNNING analyzer window."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - &k_tflag
              call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "FERRITIN", test_name: "Ferritin, Serum", test_category: "ROUTINE", method: "IMMUNOASSAY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "AMBIENT", stability_hours_ambient: 72, stability_hours_refrigerated: 168, stability_hours_frozen: 720, base_tat_hours: 6, list_price_cents: 1200, client_price_cents: 1000, floor_price_cents: 450, reference_low: 10, reference_high: 300, critical_value_low: 5, critical_value_high: 400, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 12, is_utilization_managed: true }
              as: LabClientAdmin
              as_user_id: "${kc2_id}"
              captures: { ktflag_id: $.data.id }
            - call: "POST /reference-lab/test-catalog-entries/${ktflag_id}/publish"
              payload: {}
              as: LabClientAdmin
              as_user_id: "${kc2_id}"
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
            - *k_spec
            - &k_ordflag
              call: "POST /reference-lab/send-out-orders"
              payload: { client_laboratory_id: "${kc2_id}", specimen_id: "${ksp_id}", order_number: "REQ-3101-F", patient_mrn: "MRN-3101", client_requested_at: "2026-08-31T20:45:00Z", priority: "ROUTINE", test_lines: [{ test_catalog_entry_id: "${ktflag_id}", line_sequence: 1 }, { test_catalog_entry_id: "${ktflag_id}", line_sequence: 2 }, { test_catalog_entry_id: "${ktflag_id}", line_sequence: 3 }, { test_catalog_entry_id: "${ktflag_id}", line_sequence: 4 }], override_utilization_guard: true }
              as: AccessioningTechnologist
              captures: { kordfl_id: $.data.id }
            - call: "POST /reference-lab/instrument-runs"
              payload: { test_catalog_entry_id: "${ktflag_id}", instrument_code: "IMM-11", section: "CORE", decontamination_buffer_minutes: 30, reserved_start_at: "2026-09-01T00:00:00Z", reserved_end_at: "2026-09-01T04:00:00Z" }
              as: MedicalTechnologist
            - call: "POST /reference-lab/specimens/${ksp_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/send-out-orders/${kordfl_id}/accession"
              payload: {}
              as: AccessioningTechnologist
            - call: "POST /reference-lab/specimens/${ksp_id}/begin-testing"
              payload: {}
              as: MedicalTechnologist
            - call: "GET /reference-lab/order-test-lines"
              payload: { send_out_order_id: "${kordfl_id}", limit: 4 }
              as: MedicalTechnologist
              captures: { kl_a: "$.data[0].id", kl_b: "$.data[1].id", kl_c: "$.data[2].id", kl_d: "$.data[3].id" }
            - call: "GET /reference-lab/send-out-orders/${kordfl_id}"
              payload: {}
              as: ReferenceLabOperations
              captures: { kordfl_v: $.data.version }
          trigger:
            - call: "POST /reference-lab/send-out-orders/${kordfl_id}/enter-results"
              payload: { expected_send_out_order_version: "${kordfl_v}", result_lines: [{ order_test_line_id: "${kl_a}", result_value: 7.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }, { order_test_line_id: "${kl_b}", result_value: 10.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }, { order_test_line_id: "${kl_c}", result_value: 350.0, result_units: "ng/mL", critical_value_notified_to: null, critical_value_notified_at: null }, { order_test_line_id: "${kl_d}", result_value: 401.0, result_units: "ng/mL", critical_value_notified_to: "Dr. L. Okafor", critical_value_notified_at: "2026-09-01T03:10:00Z" }] }
              as: MedicalTechnologist
              captures: { kordfl_entered: $.data.order_status }
          assert:
            - "OrderTestLine.${kl_a}.result_value == 7.0 and result_flag == LOW, because 7.0 is below reference_low 10 but not below critical_value_low 5"
            - "OrderTestLine.${kl_b}.result_value == 10.0 and result_flag == NORMAL, so the reference bound is inclusive"
            - "OrderTestLine.${kl_c}.result_value == 350.0 and result_flag == HIGH, because 350.0 exceeds reference_high 300 but not critical_value_high 400"
            - "OrderTestLine.${kl_d}.result_value == 401.0 and result_flag == CRITICAL_HIGH, stepping over the reference step entirely"
            - "OrderTestLine.${kl_a}.entered_by_user_id is non-null and equals the X-User-ID of the entering technologist"

      - name: specimen_create_extra_status_and_version_fields_are_ignored_input
        claim_type: System Fields
        grounds:
          - entities.Specimen.fields.status
          - entities.Specimen.fields.remaining_stability_hours
          - endpoints.POST_/reference-lab/specimens
        distinguishing_aspect: "Specimen.status is source: system with initial state RECEIVED and remaining_stability_hours is computed, so a client that posts status RELEASED, remaining_stability_hours 999 and version 42 is ignored on all three and the row lands at RECEIVED with version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one ACTIVE client with an inbound leg."
          setup_api_calls:
            - *k_clock
            - *k_cl2
            - *k_ib
            - *k_ibs
            - *k_ibc
            - *k_clv
            - *k_run
            - *k_pr
            - *k_act
          trigger:
            - call: "POST /reference-lab/specimens"
              payload: { client_laboratory_id: "${kc2_id}", courier_run_id: "${krun_id}", accession_number: "ACC-3201", patient_mrn: "MRN-3201", specimen_type: "SERUM_SST", container_type: "GOLD_SST", volume_ml: 2.5, collection_at: "2026-08-31T20:40:00Z", received_at: "2026-09-01T03:30:00Z", transport_temperature: "AMBIENT", condition: "ACCEPTABLE", condition_reason_code: null, status: "RELEASED", version: 42 }
              as: AccessioningTechnologist
              captures: { ksp2_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Specimen.${ksp2_id}.status == RECEIVED, so the supplied RELEASED value was ignored"
            - "Specimen.${ksp2_id}.version == 1, so the supplied 42 was ignored"
            - "Specimen.${ksp2_id}.remaining_stability_hours != 999.0"
            - "GET /reference-lab/specimens?status=RECEIVED returns exactly 1 row"

      - name: test_catalog_entry_create_with_out_of_enum_transport_temperature_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TestCatalogEntry.fields.transport_temperature
          - validations.priority_18_business_constraint
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "transport_temperature is a closed three-member enum, so CHILLED is rejected as an out-of-enum value at 400 ERR_INVALID_REQUEST rather than silently stored and later mismatching every specimen presented against the entry."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one registered client."
          setup_api_calls:
            - *k_clock
            - *k_cl2
          trigger:
            - call: "POST /reference-lab/test-catalog-entries"
              payload: { test_code: "BAD_TEMP", test_name: "Bad Temperature Test", test_category: "ROUTINE", method: "PHOTOMETRY", required_specimen_type: "SERUM_SST", container_type: "GOLD_SST", min_volume_ml: 1.0, transport_temperature: "CHILLED", stability_hours_ambient: 24, stability_hours_refrigerated: 24, stability_hours_frozen: 24, base_tat_hours: 6, list_price_cents: 1000, client_price_cents: null, floor_price_cents: 0, critical_value_low: null, critical_value_high: null, reflex_test_code: null, reflex_condition: "NONE", reflex_within_hours: 24, reflex_min_remaining_hours: 6, is_utilization_managed: false }
              as: LabClientAdmin
              as_user_id: "${kc2_id}"
              captures: { k_err3: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /reference-lab/test-catalog-entries?status=DRAFT returns 0 rows"

      - name: send_out_order_create_body_foreign_keys_are_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4_existence
          - endpoints.POST_/reference-lab/send-out-orders
          - errors.ERR_CLIENT_LABORATORY_NOT_FOUND
          - errors.ERR_SPECIMEN_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts both foreign keys in the request body and priority 4 checks them in the endpoint's declared input order, client_laboratory_id before specimen_id, so a body with both ids unknown yields ERR_CLIENT_LABORATORY_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one publishable catalog entry only."
          setup_api_calls:
            - *k_clock
          trigger:
