  # ===========================================================================
  - section: calculations
    instances:

      - name: occupancy_recalculation_refuses_a_capacity_one_overbooking
        claim_type: Constants Applied
        grounds:
          - calculations.hospital_occupancy_posture
          - calculations.hospital_occupancy_posture.constants
          - errors[ERR_HOSPITAL_AT_CAPACITY]
        distinguishing_aspect: "At capacity 1 the ratio 0/1 stays below every breakpoint while occupancy already equals capacity, so the posture remains OPEN even though a further hospital booking is refused — occupancy and the occupied-ratio are distinct quantities."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1201 with hospital_capacity 10 and 6 SCHEDULED encounters, so 6 occupied starts below every threshold."
            - "The bump endpoint cannot reach 7 without first moving 6 encounters, so the store is built with 10 encounters of which none are checked in."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1201", city: "Yuma", state_code: "CA", service_bay_count: 2, hospital_capacity: 1 }
              as: PlatformAdmin
              captures: { s: $.data.id, s_v: $.data.version }
            - call: "POST /stores/members"
              payload: { full_name: "Iris Bonnet", email: "iris@example.com", state_code: "CA", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Kite", species: "CANINE", breed: "Saluki", weight_kg: 22.0 }
              as: GroomingStaff
              captures: { pet: $.data.id }
            - call: "POST /stores/${s}/veterinary-encounters"
              payload: { pet_id: "${pet}", clinician_name: "Dr. Vale", scheduled_at: "2026-06-20T09:00:00Z" }
              as: VeterinaryStaff
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /stores/${s}/_bump-occupancy-v1"
              payload: { expected_store_version: "${s_v}", magnitude: 1 }
              as: PlatformAdmin
          assert:
            - "the trigger fails with 409 ERR_HOSPITAL_AT_CAPACITY, because a hospital booking may be created at most one occupancy slot above a capacity of 1 and this store already sits at its ceiling"
            - "Store.${s}.hospital_occupancy == 1, counting the single SCHEDULED encounter"
            - "Store.${s}.hospital_posture == OPEN, since 0/1 occupied is below every breakpoint even though occupancy equals capacity"

      - name: handling_level_floor_from_breed_tier_with_zero_score
        claim_type: Correct Result
        grounds:
          - calculations.grooming_handling_level
          - calculations.grooming_screening_score
          - entities.BreedHandlingRule.fields.handling_tier
        distinguishing_aspect: "The breed's handling_tier acts as a floor: a SENSITIVE breed rule lifts a zero-score pet from STANDARD to SENSITIVE and a HIGH_RISK breed rule lifts it all the way to HIGH_RISK, with the score thresholds never consulted."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z."
            - "Store ST-1202; member Joss; pet Lark (CANINE, Chow Chow, 26.0 kg); a Chow Chow rule at risk_points 0 with handling_tier SENSITIVE."
            - "A grooming booking for Lark in REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1202", city: "Missoula", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Joss Trentham", email: "joss@example.com", state_code: "TX", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /breed-handling-rules"
              payload: { breed: "Chow Chow", species: "CANINE", risk_points: 0, handling_tier: "SENSITIVE", allowed_for_grooming: true }
              as: PlatformAdmin
            - call: "POST /stores/pets"
              payload: { member_id: "${m}", name: "Lark", species: "CANINE", breed: "Chow Chow", weight_kg: 26.0 }
              as: GroomingStaff
              captures: { pet: $.data.id, pet_v: $.data.version }
            - call: "POST /stores/${s}/service-bays"
              payload: { bay_code: "GROOMING" }
              as: StoreManager
              captures: { bay: $.data.id }
            - call: "POST /stores/${s}/service-bookings"
              payload: { bay_id: "${bay}", pet_id: "${pet}", service_type: "GROOMING", starts_at: "2026-06-22T09:00:00Z", ends_at: "2026-06-22T10:00:00Z", expected_pet_version: "${pet_v}" }
              as: GroomingStaff
              captures: { bk: $.data.id }
          trigger:
            - call: "POST /stores/${s}/service-bookings/${bk}/screen"
              payload: { health_condition_points: 0, aggression_acknowledged: false, expected_pet_version: "${pet_v}" }
              as: GroomingStaff
          assert:
            - "ServiceBooking.${bk}.screening_score == 5, being 0 pet risk + 0 breed points + 5 weight-band points for 26.0 kg"
            - "ServiceBooking.${bk}.handling_level == SENSITIVE, lifted by the breed rule's tier and not by the 40 score threshold"
            - "the confirm-bay call is admissible without acknowledgement because 5 is far below the 70 threshold"

      - name: cycle_bill_excludes_visits_consumed_outside_the_cycle
        claim_type: Input Set Filtering
        grounds:
          - calculations.package_cycle_total_cents
          - calculations.package_cycle_total_cents.input_set
        distinguishing_aspect: "Only visits consumed inside the billed cycle enter pre_tax_cents, and a visit completed outside the window is dropped rather than deferred: the same package bills differently depending on which cycle received the consumption."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01T00:00:00Z, advanced to 2026-07-01T00:00:00Z for the cycle advance."
            - "Store ST-1203; member Keir; a PLUS package at rate 0.0 so tax never obscures the arithmetic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { store_code: "ST-1203", city: "Lawton", state_code: "TX", service_bay_count: 2, hospital_capacity: 3 }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/members"
              payload: { full_name: "Keir Dawson", email: "keir@example.com", state_code: "TX", home_store_id: "${s}" }
              as: StoreManager
              captures: { m: $.data.id }
            - call: "POST /stores/${s}/members/${m}/service-packages"
              payload: { tier: "PLUS", member_state_code: "TX", state_sales_tax_rate: 0.0, billing_cycle_count: 2, monthly_fee_cents: 5000 }
              as: StoreManager
              captures: { pk: $.data.id, pk_v: $.data.version }
          trigger:
            - call: "POST /stores/${s}/members/${m}/service-packages/${pk}/billing-cycles"
              payload: { expected_package_version: "${pk_v}", grooming_visits_consumed: 1, vet_visits_consumed: 0, vaccine_visits_consumed: 0 }
              as: StoreManager
              captures: { cyc: $.data.id }
          assert:
            - "PackageBillingCycle.${cyc}.cycle_total_cents == 2500.00 and tax_cents == 0.00 at rate 0.0"
            - "the same call with all three consumption counts at 0 would bill 0.00, so unconsumed visits never carry a charge"
            - "ServicePackage.${pk}.cycles_consumed == 1 and consumed_visits == 1"
            - "Member.${m}.outstanding_balance_cents == round_half_up(5000 * 1.0, 2) * 2 - 2500.00 == 7500.00"

