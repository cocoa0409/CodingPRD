  - rule_id: boundary_precision_check
    instances:

      - name: axle_verdict_boundaries_and_front_share_half_up
        grounds:
          - calculations.axle_load_distribution
          - entities.UnitOrder.fields.weight_status
          - entities.UnitOrder.fields.front_axle_load_kg
          - entities.UnitOrder.fields.rear_axle_load_kg
        distinguishing_aspect: |
          Six units differing by exactly 1 kg in one input each pin every comparison
          in the verdict ladder as STRICT (load == rating is WITHIN_LIMITS,
          load == rating + 1 is over) and pin the front-share rounding as
          round_half_up rather than truncation: an AMBULANCE payload of 898 kg
          splits 225/673, never 224/674.
        test_recipe:
          setup:
            - "one ApparatusProgram ACTIVE (base_year 2024, base_unit_price_cents 62500000, index 4.0, contract_ceiling_cents 800000000) with one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Boundary fleet program", agency_name: "Eastvale Fire", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 2, contract_ceiling_cents: 800000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Fleet spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "CHASSIS", requirement_text: "Tandem rear axle", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
