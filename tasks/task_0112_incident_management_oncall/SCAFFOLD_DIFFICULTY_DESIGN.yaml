        distinguishing_aspect: |
          Publishing a DRAFT postmortem that also has an open action item fails the
          priority-6 state check (ERR_POSTMORTEM_NOT_IN_REVIEW) before the priority-12
          business_safety check (ERR_OPEN_ACTION_ITEMS); the pair is state (6) vs
