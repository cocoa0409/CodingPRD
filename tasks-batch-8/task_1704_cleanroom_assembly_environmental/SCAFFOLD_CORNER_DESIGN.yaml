              as: EnvironmentTech
              as_user_id: "tech-c3"
              captures: { exc_c3a: $.data.triggered_excursion_id }
            - call: "POST /cleanroom/excursions/${exc_c3a}/investigations"
              payload: { root_cause: "Old excursion investigation narrative", product_impact: "NONE", disposition: "RELEASE" }
              as: QualityAssurance
              as_user_id: "qa-c3a"
              captures: { inv_c3a: $.data.id }
            - call: "POST /cleanroom/investigations/${inv_c3a}/approve"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-c3b"
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_c3}", result_value: 15, sampled_at: "2026-07-31T00:00:00Z" }
              as: EnvironmentTech
              captures: { exc_c3b: $.data.triggered_excursion_id }
          assert:
            - "Excursion.${exc_c3b}.severity_score == 30.0  (recurrence_count 0: prior excursion at 2026-06-30 is 31 days before 2026-07-31, outside [2026-07-01, 2026-07-31))"
            - "Excursion.${exc_c3b}.severity == ALERT  (15 >= viable alert 10, < action 20)"

      - name: pass_count_reaches_exactly_required_validates
        claim_type: correct_result
        grounds:
          - "calculations.consecutive_pass_count"
          - "state_machines.CleaningValidationProgram"
        distinguishing_aspect: "consecutive_pass_count reaching exactly required_consecutive_passes (>=) flips the program to VALIDATED; one fewer leaves it ACTIVE."
        test_recipe:
          setup: ["Room CR-C4; program PROG-C4 required=2, ACTIVE; one cycle verified (count 1, still ACTIVE)"]
