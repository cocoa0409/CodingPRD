scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: participant_credit_final_vs_provisional_diverge
        grounds:
          - calculations.participant_credit
          - entities.Participant.fields.credited_cents
          - entities.Participant.fields.projected_cents
          - state_machines.Donation.PENDING_to_SETTLED
        distinguishing_aspect: |
          This dual-variant lives on the Participant entity domain (individual fundraiser credit): the FINAL
          variant counts only SETTLED donations while the PROVISIONAL variant also counts PENDING ones, so a
          participant with one settled 10000-cent gift and one pending 6000-cent gift reports
          credited_cents == 10000 and projected_cents == 16000 from the same rows.
        test_recipe:
          setup:
            - "Organization + PUBLISHED campaign with goal 1000000 and fundraising minimum 15000."
            - "One ACTIVE participant with exactly one SETTLED 10000-cent PARTICIPANT-designated donation and one still-PENDING 6000-cent donation."
            - "No match pool exists, so both donations carry matched_amount_cents 0."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000, fundraising_minimum_cents: 15000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes", personal_goal_cents: 50000 }
              as: Anonymous
              captures: { p_id: $.data.id }
            - call: "POST /api/participants/${p_id}/activate"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "PARTICIPANT", designation_id: "${p_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_settled_id: $.data.id }
            - call: "POST /api/donations/${don_settled_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "PARTICIPANT", designation_id: "${p_id}", amount_cents: 6000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_pending_id: $.data.id }
          trigger:
            - call: "GET /api/participants/${p_id}"
              payload: {}
              as: Anonymous
              captures: { credited: $.data.credited_cents, projected: $.data.projected_cents }
          assert:
            - "Participant.${p_id}.credited_cents == 10000"
            - "Participant.${p_id}.projected_cents == 16000"
            - "Participant.${p_id}.projected_cents != Participant.${p_id}.credited_cents"
            - "Participant.${p_id}.minimum_met == false"

      - name: team_leaderboard_raw_total_vs_goal_percent_invert_order
        grounds:
          - calculations.team_leaderboard_score
          - entities.Team.fields.credited_cents
          - entities.Team.fields.goal_amount_cents
          - entities.Team.fields.status
        distinguishing_aspect: |
          This dual-variant lives on the Team entity domain (ranking, not individual money): RAW_TOTAL orders
          Team Alpha (20000 credited, goal 100000) above Team Beta (15000 credited, goal 30000), while
          GOAL_PERCENT orders Beta (5000 bp) above Alpha (2000 bp) — the same rows produce inverted orderings.
        test_recipe:
          setup:
            - "PUBLISHED campaign with two ACTIVE teams: Alpha goal 100000, Beta goal 30000."
            - "Participant PA on Alpha with one SETTLED 20000-cent gift; Participant PB on Beta with one SETTLED 15000-cent gift."
            - "No match pool exists, so credited totals equal the gift amounts."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000, fundraising_minimum_cents: 0 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/teams"
              payload: { campaign_id: "${camp_id}", name: "Team Alpha", goal_amount_cents: 100000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { team_a_id: $.data.id }
            - call: "POST /api/teams"
              payload: { campaign_id: "${camp_id}", name: "Team Beta", goal_amount_cents: 30000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { team_b_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Pat Alpha", team_id: "${team_a_id}" }
              as: Anonymous
              captures: { pa_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Bo Beta", team_id: "${team_b_id}" }
              as: Anonymous
              captures: { pb_id: $.data.id }
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "PARTICIPANT", designation_id: "${pa_id}", amount_cents: 20000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_a_id: $.data.id }
            - call: "POST /api/donations/${don_a_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "PARTICIPANT", designation_id: "${pb_id}", amount_cents: 15000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_b_id: $.data.id }
            - call: "POST /api/donations/${don_b_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/campaigns/${camp_id}/leaderboard"
              payload: { scope: "TEAM", variant: "RAW_TOTAL" }
              as: Anonymous
            - call: "GET /api/campaigns/${camp_id}/leaderboard"
              payload: { scope: "TEAM", variant: "GOAL_PERCENT" }
              as: Anonymous
          assert:
            - "RAW_TOTAL leaderboard rows[0].team_id == ${team_a_id} with credited_cents == 20000"
            - "RAW_TOTAL leaderboard rows[1].team_id == ${team_b_id} with credited_cents == 15000"
            - "GOAL_PERCENT leaderboard rows[0].team_id == ${team_b_id} with goal_percent_bp == 5000"
            - "GOAL_PERCENT leaderboard rows[1].team_id == ${team_a_id} with goal_percent_bp == 2000"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_rounding_per_line_then_sum_not_sum_then_round
        grounds:
          - calculations.donation_fee_and_net
          - calculations.campaign_report
          - entities.Donation.fields.fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two gifts of 1550 and 2450 cents produce
          per-line fees of 153 and 224 (total 377), whereas rounding the aggregate once would yield 376;
          the scaffold pins round-per-donation-then-sum, so the campaign report must read 377.
        test_recipe:
          setup:
            - "PUBLISHED campaign with two SETTLED CAMPAIGN-designated donations of 1550 and 2450 cents."
            - "No match pool exists, so fees are the only money adjustment."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 1550 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_1_id: $.data.id, fee_1: $.data.fee_cents }
            - call: "POST /api/donations/${don_1_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 2450 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_2_id: $.data.id, fee_2: $.data.fee_cents }
            - call: "POST /api/donations/${don_2_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/campaigns/${camp_id}/report"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
          assert:
            - "Donation.${don_1_id}.fee_cents == 153"
            - "Donation.${don_1_id}.net_cents == 1397"
            - "Donation.${don_2_id}.fee_cents == 224"
            - "Donation.${don_2_id}.net_cents == 2226"
            - "report.fee_total_cents == 377"
            - "report.gross_amount_cents == 4000"

      - name: donor_covered_fee_single_pass_gross_up
        grounds:
          - calculations.donation_charged_amount
          - calculations.donation_fee_and_net
          - entities.Donation.fields.charged_amount_cents
          - entities.Donation.fields.cover_fees
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the fee is computed from
          amount_cents only and never re-derived from charged_amount_cents, so a 10000-cent gift with
          cover_fees=true charges exactly 10820 (not the 10885 an iterative gross-up would produce).
        test_recipe:
          setup:
            - "PUBLISHED campaign and a donor."
            - "One PENDING donation of 10000 cents with cover_fees true."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000, cover_fees: true }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
          assert:
            - "Donation.${don_id}.fee_cents == 820"
            - "Donation.${don_id}.net_cents == 10000"
            - "Donation.${don_id}.charged_amount_cents == 10820"
            - "Donation.${don_id}.payment_status == PENDING"

  - rule_id: non_linear_state_machine
    instances:
      - name: donation_payment_and_match_dimensions_evolve_independently
        grounds:
          - state_machines.Donation.PENDING_to_SETTLED
          - state_machines.Donation.UNMATCHED_to_NOT_ELIGIBLE
          - entities.Donation.fields.payment_status
          - entities.Donation.fields.match_status
        distinguishing_aspect: |
          Non-linearity on the Donation entity takes the form of two PARALLEL state dimensions on one row:
          a 2000-cent gift settles to payment_status SETTLED while the match dimension independently lands on
          NOT_ELIGIBLE because the only pool requires min_donation_cents 2500 — the two axes disagree on the same row.
        test_recipe:
          setup:
            - "PUBLISHED campaign with one ACTIVE match pool: 50000 cents, ratio 0.5, cap 5000, min_donation_cents 2500, window 2026-07-01T00:00:00Z .. 2026-08-01T00:00:00Z."
            - "Clock at its 2026-07-01T00:00:00Z startup default, i.e. inside the pool window."
            - "One PENDING 2000-cent CAMPAIGN-designated donation (below the pool minimum)."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/match-pools"
              payload: { campaign_id: "${camp_id}", sponsor_name: "Northline Bank", pool_amount_cents: 50000, match_ratio: 0.5, per_donation_cap_cents: 5000, min_donation_cents: 2500, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-08-01T00:00:00Z" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 2000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
          trigger:
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
          assert:
            - "Donation.${don_id}.payment_status == SETTLED"
            - "Donation.${don_id}.match_status == NOT_ELIGIBLE"
            - "Donation.${don_id}.matched_amount_cents == 0"
            - "Donation.${don_id}.match_pool_id == null"
            - "MatchPool.${pool_id}.remaining_cents == 50000"
            - "MatchPool.${pool_id}.status == ACTIVE"

      - name: payout_changes_requested_revision_cycle_returns_to_requested
        grounds:
          - state_machines.Payout.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Payout.CHANGES_REQUESTED_to_REQUESTED
          - state_machines.Payout.UNDER_REVIEW_to_APPROVED
          - entities.Payout.fields.status
        distinguishing_aspect: |
          Non-linearity on the Payout entity takes the form of a genuine CYCLE
          (REQUESTED -> UNDER_REVIEW -> CHANGES_REQUESTED -> REQUESTED -> UNDER_REVIEW -> APPROVED); the payout
          re-enters a state it already left, with amount_cents replaced by 60000 and reviewed_by_user_id cleared.
        test_recipe:
          setup:
            - "PUBLISHED campaign with one SETTLED 100000-cent donation, no match pool, so lifetime_net_cents is 92070."
            - "One Payout of 50000 cents in status REQUESTED."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 50000, expected_campaign_version: "${camp_v}", note: "first tranche" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "POST /api/payouts/${payout_id}/review"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
            - call: "POST /api/payouts/${payout_id}/request-changes"
              payload: { note: "split into two tranches" }
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
            - call: "POST /api/payouts/${payout_id}/resubmit"
              payload: { amount_cents: 60000, note: "revised" }
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/payouts/${payout_id}/review"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
            - call: "POST /api/payouts/${payout_id}/approve"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-2"
          assert:
            - "Payout.${payout_id}.status after resubmit == REQUESTED"
            - "Payout.${payout_id}.amount_cents == 60000"
            - "Payout.${payout_id}.status after the final approve == APPROVED"
            - "Payout.${payout_id}.approved_by_user_id == fr-reviewer-2"
            - "Campaign.${camp_id}.reserved_payout_cents == 60000"
            - "Campaign.${camp_id}.available_balance_cents == 32070"

  - rule_id: transitive_cascade
    instances:
      - name: refund_reverses_match_restores_pool_and_reactivates_exhausted_pool
        grounds:
          - state_machines.Donation.SETTLED_to_REFUNDED
          - state_machines.Donation.MATCHED_to_REVERSED
          - state_machines.MatchPool.EXHAUSTED_to_ACTIVE
          - calculations.match_allocation
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /api/donations/{id}/refund: REFUNDED causes MATCHED -> REVERSED,
          the reversal causes MatchPool.remaining_cents to rise 0 -> 5000, and that rise causes the pool's
          EXHAUSTED -> ACTIVE transition; each link is caused by the previous one, not by the refund directly.
        test_recipe:
          setup:
            - "PUBLISHED campaign with a 5000-cent match pool (ratio 0.5, cap 5000, window 2026-07-01 .. 2026-08-01)."
            - "One SETTLED 10000-cent PARTICIPANT-designated donation that consumed the whole pool (matched 5000), leaving the pool EXHAUSTED with remaining_cents 0."
            - "Clock at the 2026-07-01T00:00:00Z default, inside both the pool window and the 60-day refund window."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/match-pools"
              payload: { campaign_id: "${camp_id}", sponsor_name: "Northline Bank", pool_amount_cents: 5000, match_ratio: 0.5, per_donation_cap_cents: 5000, min_donation_cents: 0, starts_at: "2026-07-01T00:00:00Z", ends_at: "2026-08-01T00:00:00Z" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { pool_id: $.data.id }
            - call: "POST /api/participants"
              payload: { campaign_id: "${camp_id}", display_name: "Alice Reyes" }
              as: Anonymous
              captures: { p_id: $.data.id }
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "PARTICIPANT", designation_id: "${p_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/donations/${don_id}/refund"
              payload: { reason: "donor requested" }
              as: PlatformAdmin
          assert:
            - "Donation.${don_id}.payment_status == REFUNDED"
            - "Donation.${don_id}.match_status == REVERSED"
            - "Donation.${don_id}.matched_amount_cents == 0"
            - "MatchPool.${pool_id}.remaining_cents == 5000"
            - "MatchPool.${pool_id}.allocated_cents == 0"
            - "MatchPool.${pool_id}.status == ACTIVE"
            - "Participant.${p_id}.credited_cents == 0"

      - name: participant_withdraw_cancels_registration_and_reopens_full_event
        grounds:
          - state_machines.Participant.ACTIVE_to_WITHDRAWN
          - state_machines.Registration.RESERVED_to_CANCELLED
          - state_machines.Event.FULL_to_OPEN
          - entities.Event.fields.registered_count
        distinguishing_aspect: |
          Depth-4 cascade from a different trigger, POST /api/participants/{id}/withdraw: WITHDRAWN causes the
          RESERVED registration to become CANCELLED, that cancellation causes Event.registered_count to fall
          1 -> 0, and that fall causes the event's FULL -> OPEN transition.
        test_recipe:
          setup:
            - "PUBLISHED campaign with an event of capacity 1 (2026-09-12T14:00:00Z .. 16:00:00Z, early bird until 2026-08-01T00:00:00Z, fee 4000)."
            - "One ACTIVE participant holding the event's single RESERVED registration, so the event is FULL with registered_count 1."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
