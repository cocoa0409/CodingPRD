  - name: facility_derived_fields_are_computed_on_read_and_never_stored_from_input
    claim_type: Computed Fields
    grounds:
    - entities.Facility.fields.licensed
    - entities.Facility.fields.as_level_max
    - entities.Facility.fields.facility_posture
    - calculations.facility_posture_derivation
    distinguishing_aspect: licensed, as_level_max and facility_posture are all derived from the accreditation
      set rather than accepted from the request body, so a facility posted with an explicit licensed true
      still reads false until a GRANTED unexpired STATE_LICENSE exists.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z.
      setup_api_calls:
      - call: POST /treatment-network/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /treatment-network/facilities
        payload:
          name: Cascade Ridge Recovery Center
          state_code: MN
        as: PlatformAdmin
        captures:
          mew_fac: $.data.id
      - call: POST /treatment-network/facilities/${mew_fac}/accreditations
        payload:
          accreditation_class: STATE_LICENSE
          granting_body: MN-DHS
          effective_at: '2026-01-01T00:00:00Z'
          expires_at: '2027-01-01T00:00:00Z'
          license_level_max: ASAM_3_5
          credential_tier_min: TIER_3_LICENSED
        as: PlatformAdmin
        captures:
          mew_acc_lic: $.data.id
      assert:
      - Facility.${mew_fac}.licensed == false after creation, so no body value could have set it
      - Facility.${mew_fac}.as_level_max == ASAM_1_0 after creation
      - Facility.${mew_fac}.licensed == true after the STATE_LICENSE is granted
      - Facility.${mew_fac}.as_level_max == ASAM_3_5 and state_min_credential_tier == TIER_3_LICENSED
      - Facility.${mew_fac}.version == 2 (create plus the STATE_LICENSE side-effect), and neither derived
        field was ever accepted from a body
