      - name: sibling_fees_may_not_exceed_the_parent_and_codes_are_unique
        claim_type: aggregate_validation
        grounds:
          - validations[priority=70]
          - validations[priority=62]
          - validations[priority=60]
        distinguishing_aspect: |
          Each child fee is individually legal; only the collective 450000.00 breaches the parent's
          400000.00, and a corrected 150000.00 child that lands exactly on the parent fee is
          accepted. The same endpoint also owns the project-scoped code uniqueness, and the parent
          it just gained a child for is no longer chargeable.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z; private client"
            - "SETUP project with contract_amount 800000.00 and a PERCENT_OF_CONTRACT root phase at 0.5000 (phase_fee 400000.00)"
