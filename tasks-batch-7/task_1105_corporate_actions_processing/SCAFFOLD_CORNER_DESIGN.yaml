          setup: ["ACME; vendor Alpha (weight 10) announces 2:1; vendor Beta (weight 5) announces 3:1"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { ticker: "ACME", cusip: "CUSPD00004", name: "Acme Corp" }, as: DeskAdministrator, captures: { sec_id: $.data.id } }
