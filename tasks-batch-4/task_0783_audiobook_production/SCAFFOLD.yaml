scenario: "783. Audiobook Production & Distribution (ACX/Findaway style): title & rights, narrator audition/casting & contract (royalty-share/per-hour), production milestone (15-min/full) & QC, retail-sample & distribution, royalty split & payout, exclusivity/territory, revision/redo, rights reversion"
domain_name: audiobook-production
# Flat / peer topology: entities are peers linked by foreign keys, addressed at the
# root of the URL space (no single nesting prefix). api_prefix is therefore empty and
# every path is root-anchored (e.g. /titles, /contracts). scaffold_lint.py handles the
# empty prefix (all root paths are treated as under it).
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # flat: peer entities linked by FK references; no nested ownership in URL paths.

  state_machine_shape: cyclic
  # ProductionMilestone runs a QC revision loop (SUBMITTED -> REVISION_REQUESTED ->
  # SUBMITTED); Contract and Audition branch (fork to ACCEPTED/DECLINED/SUPERSEDED).

  relationship_patterns:
    - one_to_many        # Title -> Auditions, Title -> Contracts, Contract -> Milestones
    - cross_aggregate    # Contract references Title AND Narrator across aggregates

  role_model: peer_roles
  # Author owns Titles; Narrator owns Auditions/Bookings/Milestone-work; QCReviewer and
  # PlatformAdmin are operational (opaque).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Author
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: rights holder / author display name
      - name: email
        type: string
        source: input
        description: contact email (unique)
        constraints: unique across Author
      - name: payout_balance_cents
        type: integer
        source: computed
        description: "running credited royalty/production earnings for this author; sum of author_royalty_cents from PAID statements minus REVERSED; see calculations.payout_ledger_balance"
        default: 0

  - name: Narrator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: narrator / producer display name
      - name: email
        type: string
        source: input
        description: contact email (unique)
        constraints: unique across Narrator
      - name: hourly_rate_cents
        type: integer
        source: input
        description: default per-finished-hour rate the narrator lists; a PER_HOUR contract may override with per_hour_rate_cents
        constraints: ">= 0"
      - name: payout_balance_cents
        type: integer
        source: computed
        description: "running credited earnings for this narrator (per-hour production fees at FULL approval + royalty-share amounts from PAID statements minus REVERSED); see calculations.payout_ledger_balance"
        default: 0
      - name: active_booked_days
        type: integer
        source: computed
        description: "sum over this narrator's ACTIVE ProductionBookings of (end_date - start_date) in whole days; see calculations.active_booked_days"
        default: 0

  - name: Title
    parent: null
    common_fields: true
    fields:
      - name: author_id
        type: string
        source: input
        description: "FK -> Author.id; the rights holder, taken from X-User-ID of the creating Author"
      - name: title_name
        type: string
        source: input
        description: book/audiobook title
      - name: isbn
        type: string
        source: input
        description: print ISBN reference
      - name: exclusivity
        type: enum
        source: input
        description: distribution exclusivity granted by the rights holder
        constraints: "one of {EXCLUSIVE, NON_EXCLUSIVE}"
      - name: territory
        type: enum
        source: input
        description: territory in which distribution rights are granted
        constraints: "one of {WORLD, US, UK, EU}"
      - name: list_price_cents
        type: integer
        source: input
        description: suggested retail list price in cents
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: production/distribution lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, OPEN_FOR_AUDITION, CASTING, IN_PRODUCTION, IN_QC, PUBLISHED, REVERTED}"
      - name: rights_status
        type: enum
        source: system
        description: whether the rights holder still holds distribution rights
        default: ACTIVE
        constraints: "one of {ACTIVE, REVERTED}"
      - name: finished_hours
        type: number
        source: computed
        description: "finished running time in hours, copied from the FULL ProductionMilestone when its QC review PASSes; drives per-hour payment. 0 until a FULL milestone is approved"
        default: 0
      - name: retail_sample_start_sec
        type: integer
        source: input
        description: start second of the retail sample clip within the finished audio; null until set
        default: null
      - name: retail_sample_end_sec
        type: integer
        source: input
        description: end second (exclusive) of the retail sample clip; null until set
        default: null

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the title being auditioned for"
      - name: narrator_id
        type: string
        source: input
        description: "FK -> Narrator.id; the auditioning narrator, taken from X-User-ID"
      - name: sample_url
        type: string
        source: input
        description: URL of the submitted audition sample
      - name: status
        type: enum
        source: system
        description: audition review state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACCEPTED, DECLINED}"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the title this contract produces"
      - name: narrator_id
        type: string
        source: input
        description: "FK -> Narrator.id; the cast narrator"
      - name: deal_type
        type: enum
        source: input
        description: compensation model
        constraints: "one of {ROYALTY_SHARE, PER_HOUR}"
      - name: royalty_share_pct
        type: number
        source: input
        description: "narrator's base share of net royalties (0..1); required when deal_type == ROYALTY_SHARE, must be null for PER_HOUR"
        default: null
        constraints: "0 < value <= 0.50 when present"
      - name: per_hour_rate_cents
        type: integer
        source: input
        description: "per-finished-hour production fee in cents; required when deal_type == PER_HOUR, must be null for ROYALTY_SHARE"
        default: null
        constraints: "> 0 when present"
      - name: status
        type: enum
        source: system
        description: contract negotiation/lifecycle state
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, DECLINED, SUPERSEDED, TERMINATED}"

  - name: ProductionBooking
    parent: null
    common_fields: true
    fields:
      - name: narrator_id
        type: string
        source: input
        description: "FK -> Narrator.id; narrator reserving studio/production time, taken from X-User-ID"
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the title the narrator is producing during this window"
      - name: start_date
        type: string
        source: input
        description: "inclusive start date (YYYY-MM-DD) of the production window; interval is half-open [start_date, end_date)"
      - name: end_date
        type: string
        source: input
        description: "exclusive end date (YYYY-MM-DD) of the production window"
      - name: status
        type: enum
        source: system
        description: booking state
        default: ACTIVE
        constraints: "one of {ACTIVE, CANCELLED, COMPLETED}"

  - name: ProductionMilestone
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the ACCEPTED contract this milestone delivers against"
      - name: milestone_type
        type: enum
        source: input
        description: deliverable type
        constraints: "one of {FIFTEEN_MIN, FULL}"
      - name: audio_url
        type: string
        source: input
        description: URL of the submitted audio deliverable
      - name: finished_hours
        type: number
        source: input
        description: "finished running time in hours declared with the deliverable; required and must be > 0 for milestone_type == FULL; ignored for FIFTEEN_MIN"
        default: null
      - name: status
        type: enum
        source: system
        description: QC lifecycle state (cyclic revision loop)
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REVISION_REQUESTED, REJECTED}"
      - name: revision_count
        type: integer
        source: computed
        description: "number of QC FAIL reviews recorded against this milestone; increments on each FAIL; when it would exceed MAX_REVISIONS the milestone auto-transitions to REJECTED"
        default: 0

  - name: QCReview
    parent: null
    common_fields: false
    fields:
      - name: milestone_id
        type: string
        source: input
        description: "FK -> ProductionMilestone.id; the milestone reviewed"
      - name: outcome
        type: enum
        source: input
        description: QC verdict
        constraints: "one of {PASS, FAIL}"
      - name: notes
        type: string
        source: input
        description: reviewer notes / revision reason (required when outcome == FAIL)
        default: null

  - name: DistributionChannel
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: retail channel display name (e.g. Audible, Apple)
      - name: supported_territories
        type: array
        source: input
        description: "array of territory enum values this channel serves; each one of {WORLD, US, UK, EU}"
      - name: retailer_cut_pct
        type: number
        source: input
        description: "fraction (0..1) of gross the retailer keeps; net remitted to rights = gross * (1 - retailer_cut_pct)"
        constraints: "0 <= value < 1"

  - name: DistributionListing
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the published title being listed"
      - name: channel_id
        type: string
        source: input
        description: "FK -> DistributionChannel.id; the retail channel"
      - name: territory
        type: enum
        source: input
        description: territory this listing sells into
        constraints: "one of {WORLD, US, UK, EU}"
      - name: effective_from
        type: string
        source: input
        description: "inclusive start date (YYYY-MM-DD) of the listing window; interval is closed [effective_from, effective_until]"
      - name: effective_until
        type: string
        source: input
        description: "inclusive end date (YYYY-MM-DD) of the listing window"
      - name: status
        type: enum
        source: system
        description: listing state
        default: ACTIVE
        constraints: "one of {ACTIVE, WITHDRAWN}"

  - name: SalesEvent
    parent: null
    common_fields: false
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> DistributionListing.id; the listing that produced these sales"
      - name: units_sold
        type: integer
        source: input
        description: gross units sold in this event
        constraints: ">= 0"
      - name: units_returned
        type: integer
        source: input
        description: units returned/refunded in this event (subtracted in the FINAL royalty variant only)
        default: 0
        constraints: "0 <= units_returned <= units_sold"
      - name: unit_price_cents
        type: integer
        source: input
        description: sale price per unit in cents for this event
        constraints: "> 0"
      - name: occurred_at
        type: datetime
        source: input
        description: ISO 8601 UTC timestamp the sale occurred; used for period windowing on statements

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - name: title_id
        type: string
        source: input
        description: "FK -> Title.id; the title this statement accounts for"
      - name: period_start
        type: datetime
        source: input
        description: inclusive ISO 8601 UTC start of the accounting period
      - name: period_end
        type: datetime
        source: input
        description: inclusive ISO 8601 UTC end of the accounting period
      - name: variant
        type: enum
        source: computed
        description: which calculation variant currently populates the *_cents fields
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: narrator_share_pct_applied
        type: number
        source: computed
        description: "effective narrator share used for this statement, from calculations.effective_narrator_share; 0 for PER_HOUR contracts"
        default: 0
      - name: gross_sales_cents
        type: integer
        source: computed
        description: "sum over included SalesEvents of units*unit_price_cents (PROVISIONAL: units_sold; FINAL: units_sold-units_returned)"
        default: 0
      - name: statement_net_cents
        type: integer
        source: computed
        description: "net remitted to rights after retailer cut, rounded per-line then summed; see calculations.royalty_split"
        default: 0
      - name: narrator_royalty_cents
        type: integer
        source: computed
        description: "narrator's cut = round_half_up(statement_net_cents * narrator_share_pct_applied)"
        default: 0
      - name: author_royalty_cents
        type: integer
        source: computed
        description: "author's cut = statement_net_cents - narrator_royalty_cents"
        default: 0
      - name: status
        type: enum
        source: system
        description: statement lifecycle
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINALIZED, PAID, FROZEN, REVERSED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Title
    initial_state: DRAFT
    terminal_states: [REVERTED]
    transitions:
      - from: DRAFT
        to: OPEN_FOR_AUDITION
        trigger: "POST /titles/{id}/open"
        actor: Author
        preconditions:
          - "acting Author owns the title (title.author_id == X-User-ID)"
          - "title.rights_status == ACTIVE"
        side_effects:
          - "increments Title.version by 1"
      - from: OPEN_FOR_AUDITION
        to: CASTING
        trigger: "POST /contracts (offer)"
        actor: Author
        preconditions:
          - "title.rights_status == ACTIVE"
          - "an Audition for (title, narrator) exists with status == ACCEPTED"
          - "expected_title_version == title.version (OCC)"
        side_effects:
          - "creates Contract in OFFERED"
          - "increments Title.version by 1"
      - from: CASTING
        to: CASTING
        trigger: "POST /contracts (re-offer / supersede)"
        actor: Author
        preconditions:
          - "expected_title_version == title.version (OCC)"
          - "an Audition for (title, narrator) exists with status == ACCEPTED"
        side_effects:
          - "creates new Contract in OFFERED"
          - "any existing OFFERED Contract on this title transitions OFFERED -> SUPERSEDED"
          - "increments Title.version by 1"
        note: "CREATE-with-supersede; the true race guarded by concurrency_rules.contract-offer-stale-title"
      - from: CASTING
        to: IN_PRODUCTION
        trigger: "POST /contracts/{id}/respond {decision: ACCEPT}"
        actor: Narrator
        preconditions:
          - "contract.status == OFFERED"
          - "acting Narrator is contract.narrator_id"
        side_effects:
          - "Contract OFFERED -> ACCEPTED"
          - "increments Title.version by 1"
      - from: CASTING
        to: OPEN_FOR_AUDITION
        trigger: "POST /contracts/{id}/respond {decision: DECLINE}"
        actor: Narrator
        preconditions:
          - "contract.status == OFFERED"
          - "acting Narrator is contract.narrator_id"
        side_effects:
          - "Contract OFFERED -> DECLINED"
          - "increments Title.version by 1"
      - from: IN_PRODUCTION
        to: IN_QC
        trigger: "POST /production-milestones (milestone_type == FULL)"
        actor: Narrator
        preconditions:
          - "contract.status == ACCEPTED"
          - "milestone.finished_hours > 0"
        side_effects:
          - "creates ProductionMilestone in SUBMITTED"
          - "increments Title.version by 1"
        note: "FIFTEEN_MIN submissions do not move the Title out of IN_PRODUCTION"
      - from: IN_QC
        to: IN_PRODUCTION
        trigger: "POST /production-milestones/{id}/qc-reviews {outcome: FAIL} (FULL milestone)"
        actor: QCReviewer
        preconditions:
          - "milestone.status == SUBMITTED"
          - "milestone.milestone_type == FULL"
        side_effects:
          - "milestone SUBMITTED -> REVISION_REQUESTED (cascade link 2)"
          - "increments Title.version by 1"
      - from: IN_QC
        to: PUBLISHED
        trigger: "POST /titles/{id}/publish"
        actor: PlatformAdmin
        preconditions:
          - "the FULL ProductionMilestone for this title's ACCEPTED contract has status == APPROVED"
        side_effects:
          - "increments Title.version by 1"
      - from: PUBLISHED
        to: REVERTED
        trigger: "POST /titles/{id}/revert-rights"
        actor: Author
        preconditions:
          - "acting Author owns the title"
          - "title.rights_status == ACTIVE"
        side_effects:
          - "sets title.rights_status = REVERTED (cascade root)"
          - "the ACCEPTED Contract on this title transitions ACCEPTED -> TERMINATED (rights-reversion cascade link 1)"
          - "increments Title.version by 1"

  - entity: Audition
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /auditions/{id}/decision {decision: ACCEPT}"
        actor: Author
        preconditions:
          - "acting Author owns audition.title_id"
          - "title.status == OPEN_FOR_AUDITION"
        side_effects:
          - "increments Audition.version by 1"
        note: "an ACCEPTED audition is the prerequisite for offering a Contract to that narrator (cross-entity dependency)"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /auditions/{id}/decision {decision: DECLINE}"
        actor: Author
        preconditions:
          - "acting Author owns audition.title_id"
        side_effects:
          - "increments Audition.version by 1"

  - entity: Contract
    initial_state: OFFERED
    terminal_states: [DECLINED, SUPERSEDED, TERMINATED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /contracts/{id}/respond {decision: ACCEPT}"
        actor: Narrator
        preconditions:
          - "acting Narrator is contract.narrator_id"
          - "title.status == CASTING"
        side_effects:
          - "Title CASTING -> IN_PRODUCTION"
          - "increments Contract.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /contracts/{id}/respond {decision: DECLINE}"
        actor: Narrator
        preconditions:
          - "acting Narrator is contract.narrator_id"
        side_effects:
          - "Title CASTING -> OPEN_FOR_AUDITION"
          - "increments Contract.version by 1"
      - from: OFFERED
        to: SUPERSEDED
        trigger: "system: another Contract offered on the same title (POST /contracts)"
        actor: system
        preconditions:
          - "a newer Contract on the same title was just created in OFFERED"
        side_effects:
          - "increments Contract.version by 1"
      - from: ACCEPTED
        to: TERMINATED
        trigger: "system: rights reversion cascade (POST /titles/{id}/revert-rights)"
        actor: system
        preconditions:
          - "the owning Title transitioned PUBLISHED -> REVERTED"
        side_effects:
          - "every ACTIVE DistributionListing for the title transitions ACTIVE -> WITHDRAWN (rights-reversion cascade link 2)"
          - "increments Contract.version by 1"

  - entity: ProductionMilestone
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /production-milestones/{id}/qc-reviews {outcome: PASS}"
        actor: QCReviewer
        preconditions:
          - "milestone.status == SUBMITTED"
        side_effects:
          - "creates QCReview (outcome PASS)"
          - "if milestone_type == FULL: sets Title.finished_hours = milestone.finished_hours"
          - "if milestone_type == FULL and contract.deal_type == PER_HOUR: credits Narrator.payout_balance_cents += per_hour_payment (see calculations.narrator_compensation)"
          - "increments ProductionMilestone.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /production-milestones/{id}/qc-reviews {outcome: FAIL}"
        actor: QCReviewer
        preconditions:
          - "milestone.status == SUBMITTED"
          - "revision_count < MAX_REVISIONS (else this transition targets REJECTED instead)"
        side_effects:
          - "creates QCReview (outcome FAIL)"
          - "increments milestone.revision_count by 1"
          - "if milestone_type == FULL: Title IN_QC -> IN_PRODUCTION (cascade link 2 target)"
          - "increments ProductionMilestone.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /production-milestones/{id}/qc-reviews {outcome: FAIL} when revision_count == MAX_REVISIONS"
        actor: QCReviewer
        preconditions:
          - "milestone.status == SUBMITTED"
          - "revision_count == MAX_REVISIONS"
        side_effects:
          - "creates QCReview (outcome FAIL)"
          - "increments milestone.revision_count by 1"
          - "if milestone_type == FULL: Title IN_QC -> IN_PRODUCTION"
          - "increments ProductionMilestone.version by 1"
        note: "terminal REJECTED after the (MAX_REVISIONS+1)-th FAIL"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /production-milestones/{id}/resubmit"
        actor: Narrator
        preconditions:
          - "milestone.status == REVISION_REQUESTED"
          - "acting Narrator is the contract's narrator"
        side_effects:
          - "updates milestone.audio_url"
          - "if milestone_type == FULL: Title IN_PRODUCTION -> IN_QC"
          - "increments ProductionMilestone.version by 1"

  - entity: ProductionBooking
    initial_state: ACTIVE
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /production-bookings/{id}/cancel"
        actor: Narrator
        preconditions:
          - "acting Narrator is booking.narrator_id"
          - "booking.status == ACTIVE"
        side_effects:
          - "recomputes Narrator.active_booked_days (releases this booking's days; compensating invariant)"
          - "increments ProductionBooking.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /production-bookings/{id}/cancel is NOT this; COMPLETED is set by system when the Title reaches PUBLISHED"
        actor: system
        preconditions:
          - "the booking's Title reached PUBLISHED"
        side_effects:
          - "recomputes Narrator.active_booked_days (releases this booking's days)"
          - "increments ProductionBooking.version by 1"

  - entity: DistributionListing
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /distribution-listings/{id}/withdraw (or rights-reversion cascade)"
        actor: PlatformAdmin
        preconditions:
          - "listing.status == ACTIVE"
        side_effects:
          - "increments DistributionListing.version by 1"
          - "if this withdrawal is a link in a rights-reversion cascade (its title's rights_status just became REVERTED): every RoyaltyStatement for this listing's title in status PROVISIONAL or FINALIZED transitions to FROZEN (rights-reversion cascade link 3). A manual withdraw with the title still ACTIVE does NOT freeze statements."

  - entity: RoyaltyStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID, FROZEN, REVERSED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /royalty-statements/{id}/finalize"
        actor: PlatformAdmin
        preconditions:
          - "statement.status == PROVISIONAL"
        side_effects:
          - "recomputes *_cents fields using the FINAL variant (units_sold - units_returned); sets variant = FINAL"
          - "increments RoyaltyStatement.version by 1"
      - from: FINALIZED
        to: PAID
        trigger: "POST /royalty-statements/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "statement.status == FINALIZED"
          - "statement.narrator_royalty_cents + statement.author_royalty_cents > 0"
        side_effects:
          - "credits Author.payout_balance_cents += statement.author_royalty_cents"
          - "credits Narrator.payout_balance_cents += statement.narrator_royalty_cents (0 for PER_HOUR titles)"
          - "increments RoyaltyStatement.version by 1"
      - from: PROVISIONAL
        to: FROZEN
        trigger: "system: rights reversion cascade"
        actor: system
        preconditions:
          - "the statement's Title transitioned to REVERTED and the statement was PROVISIONAL"
        side_effects:
          - "increments RoyaltyStatement.version by 1"
      - from: FINALIZED
        to: FROZEN
        trigger: "system: rights reversion cascade"
        actor: system
        preconditions:
          - "the statement's Title transitioned to REVERTED and the statement was FINALIZED"
        side_effects:
          - "increments RoyaltyStatement.version by 1"
      - from: PAID
        to: REVERSED
        trigger: "POST /royalty-statements/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "statement.status == PAID"
        side_effects:
          - "debits Author.payout_balance_cents -= statement.author_royalty_cents (compensating invariant)"
          - "debits Narrator.payout_balance_cents -= statement.narrator_royalty_cents"
          - "increments RoyaltyStatement.version by 1"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: contract-offer-stale-title
    parent_entity: Title
    write_endpoint: "POST /contracts"
    occ_field: "expected_title_version"
    description: |
      Offering a Contract against a Title whose version has advanced since the
      client last observed it is rejected. This captures CREATE-with-supersede:
      another writer has already offered a contract on this title (legitimately
      superseding any prior OFFERED contract and advancing the title's version),
      so the current writer's expected_title_version is stale.
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: effective_narrator_share
    trigger: "on RoyaltyStatement creation (POST /royalty-statements) and on finalize; stored as narrator_share_pct_applied"
    algorithm: threshold
    formula: |
      # ROYALTY_SHARE contracts only; PER_HOUR contracts -> 0
      if contract.deal_type == PER_HOUR: return 0
      base  = contract.royalty_share_pct
      bonus = 0.05 if title.exclusivity == EXCLUSIVE else 0.00
      cumulative_units = sum(se.units_sold for se in SalesEvents
                             where se.listing.title_id == title_id)   # lifetime, all listings
      if   cumulative_units < TIER1_UNITS: tier_mult = 1.00
      elif cumulative_units < TIER2_UNITS: tier_mult = 1.10
      else:                                tier_mult = 1.20
      return min(SHARE_CAP, (base + bonus) * tier_mult)
    input_set: "contract.deal_type, contract.royalty_share_pct, title.exclusivity, and lifetime cumulative units_sold across all SalesEvents whose listing belongs to the title"
    constants:
      TIER1_UNITS: 1000
      TIER2_UNITS: 5000
      SHARE_CAP: 0.50
      EXCLUSIVE_BONUS: 0.05
    precision: "share is a ratio; carry full precision, round only the derived cents amounts"
    variants: []

  - name: royalty_split
    trigger: "on RoyaltyStatement creation (PROVISIONAL variant) and on finalize (FINAL variant)"
    algorithm: aggregation
    formula: |
      # included SalesEvents: se where se.listing.title_id == title_id
      #   AND period_start <= se.occurred_at <= period_end   (closed interval)
      # per-line net is rounded FIRST, then summed (pinned order):
      def line_units(se, variant):
          return se.units_sold if variant == PROVISIONAL else (se.units_sold - se.units_returned)
      statement_net_cents = 0
      gross_sales_cents   = 0
      for se in included_sales_events(sorted by occurred_at ASC, then created_at ASC):
          line_gross = line_units(se, variant) * se.unit_price_cents
          gross_sales_cents  += line_gross
          statement_net_cents += round_half_up(line_gross * (1 - channel.retailer_cut_pct))
      narrator_royalty_cents = round_half_up(statement_net_cents * narrator_share_pct_applied)
      author_royalty_cents   = statement_net_cents - narrator_royalty_cents
    input_set: "SalesEvents in the closed [period_start, period_end] window for listings of the title; retailer_cut_pct comes from each sale's listing's channel"
    constants: {}
    precision: "round_half_up to integer cents; per-line net rounded before summation (round-then-sum, NOT sum-then-round)"
    variants:
      - name: PROVISIONAL
        when: "at statement creation, before the return window closes"
        difference: "line_units uses se.units_sold (returns not yet deducted)"
      - name: FINAL
        when: "at finalize, after the return window closes"
        difference: "line_units uses se.units_sold - se.units_returned; author_royalty and narrator_royalty recomputed and typically smaller than PROVISIONAL"

  - name: narrator_compensation
    trigger: "PER_HOUR: on FULL milestone QC PASS (credited to Narrator.payout_balance_cents); ROYALTY_SHARE: on statement PAID (narrator_royalty_cents credited)"
    algorithm: threshold
    formula: |
      if contract.deal_type == PER_HOUR:
          # one-time production fee at FULL approval, independent of sales
          return round_half_up(title.finished_hours * contract.per_hour_rate_cents)
      else:  # ROYALTY_SHARE
          # narrator earns per-statement royalty share at PAID time
          return statement.narrator_royalty_cents
    input_set: "the ACCEPTED contract's deal_type, finished_hours (PER_HOUR) or the statement's narrator_royalty_cents (ROYALTY_SHARE)"
    constants: {}
    precision: "round_half_up to integer cents"
    variants:
      - name: PER_HOUR
        when: "deal_type == PER_HOUR"
        difference: "flat finished_hours * per_hour_rate_cents credited once at FULL approval; independent of downstream sales"
      - name: ROYALTY_SHARE
        when: "deal_type == ROYALTY_SHARE"
        difference: "narrator earns narrator_royalty_cents from each PAID statement; identical finished production yields a different total than the PER_HOUR flat fee"

  - name: active_booked_days
    trigger: "recomputed on ProductionBooking create, cancel, and completion"
    algorithm: aggregation
    formula: |
      active_booked_days = sum( (date(b.end_date) - date(b.start_date)).days
                                for b in ProductionBookings
                                where b.narrator_id == narrator_id
                                  AND b.status == ACTIVE )
    input_set: "the narrator's ProductionBookings with status == ACTIVE only (CANCELLED and COMPLETED excluded)"
    constants: {}
    precision: "whole days; end_date exclusive so a [start, end) window contributes (end-start) days"
    variants: []

  - name: payout_ledger_balance
    trigger: "recomputed on statement PAID / REVERSED and on PER_HOUR FULL approval"
    algorithm: aggregation
    formula: |
      author.payout_balance_cents =
          sum(s.author_royalty_cents for s in RoyaltyStatements
              where s.title.author_id == author.id AND s.status == PAID)
      narrator.payout_balance_cents =
          sum(m_fee for PER_HOUR FULL milestones approved for this narrator)
        + sum(s.narrator_royalty_cents for s in RoyaltyStatements
              where s.contract.narrator_id == narrator.id AND s.status == PAID)
      # global invariant: total_distributed = sum(all author balances)
      #                                      + sum(all narrator balances)
      # a PAID statement adds exactly (author_royalty_cents + narrator_royalty_cents);
      # its REVERSAL subtracts exactly the same, leaving total_distributed unchanged.
    input_set: "RoyaltyStatements in status PAID (REVERSED excluded) plus PER_HOUR production fees"
    constants: {}
    precision: "integer cents; no rounding drift because credited and debited amounts are the identical stored integers"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource referenced in the path or body (author_id, narrator_id, title_id, contract_id, milestone_id, channel_id, listing_id, statement_id, audition_id) exists; validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
    note: "concretized per-entity: ERR_AUTHOR_NOT_FOUND, ERR_NARRATOR_NOT_FOUND, ERR_TITLE_NOT_FOUND, ERR_AUDITION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_CHANNEL_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_STATEMENT_NOT_FOUND"

  - priority: 4
    category: business_referential
    check: "acting entity_backed user owns the target: Author owns title.author_id; Narrator is audition/booking/contract narrator_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /titles/{id}/open, /titles/{id}/publish (admin exempt), /titles/{id}/retail-sample, /titles/{id}/revert-rights, /auditions/{id}/decision, /contracts/{id}/respond, /production-bookings/{id}/cancel, /production-milestones, /production-milestones/{id}/resubmit"

  - priority: 5
    category: state
    check: "the target Title's rights_status == ACTIVE for any production/distribution mutation"
    error_id: ERR_RIGHTS_REVERTED
    http_status: 409
    applies_to: "POST /auditions, /contracts, /production-milestones, /distribution-listings, /royalty-statements"

  - priority: 6
    category: state
    check: "the target resource is in the correct state for the requested transition (see §1.2 preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
    note: "concretized per transition: ERR_TITLE_NOT_OPEN, ERR_TITLE_NOT_IN_QC, ERR_TITLE_NOT_PUBLISHED, ERR_TITLE_NOT_REVERTABLE, ERR_AUDITION_NOT_SUBMITTED, ERR_CONTRACT_NOT_OFFERED, ERR_CONTRACT_NOT_ACCEPTED, ERR_MILESTONE_NOT_SUBMITTED, ERR_MILESTONE_NOT_REVISABLE, ERR_LISTING_NOT_ACTIVE, ERR_STATEMENT_NOT_PROVISIONAL, ERR_STATEMENT_NOT_FINALIZED, ERR_STATEMENT_NOT_PAID"

  - priority: 7
    category: state
    check: "OCC: expected_title_version equals the current Title.version on POST /contracts"
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412
    applies_to: "POST /contracts"

  - priority: 8
    category: business_referential
    check: "cross-entity linkage holds: contract offer requires an ACCEPTED Audition for (title, narrator); milestone submit requires contract.status == ACCEPTED; listing requires channel.supported_territories includes listing.territory and the title's territory scope permits it"
    error_id: ERR_AUDITION_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /contracts, /production-milestones, /distribution-listings"
    note: "concretized: ERR_AUDITION_NOT_ACCEPTED (contract), ERR_CONTRACT_NOT_ACCEPTED (milestone), ERR_TERRITORY_NOT_SUPPORTED (listing)"

  - priority: 9
    category: business_referential
    check: "deal-type field coherence: ROYALTY_SHARE requires royalty_share_pct and forbids per_hour_rate_cents; PER_HOUR requires per_hour_rate_cents and forbids royalty_share_pct"
    error_id: ERR_DEAL_TYPE_FIELDS
    http_status: 422
    applies_to: "POST /contracts"

  - priority: 10
    category: business_constraint
    check: "date/window/quantity validity: booking start_date < end_date; listing effective_from <= effective_until; retail sample 0 < (end_sec - start_sec) <= MAX_RETAIL_SAMPLE_SEC; FULL milestone finished_hours > 0"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /production-bookings, /distribution-listings, /titles/{id}/retail-sample, /production-milestones"
    note: "concretized: ERR_INVALID_DATE_RANGE (booking/listing ranges), ERR_SAMPLE_TOO_LONG (sample length), ERR_INVALID_FINISHED_HOURS (finished_hours)"

  - priority: 11
    category: business_temporal
    check: "temporal overlap: (booking) a new ACTIVE ProductionBooking must not overlap an existing ACTIVE booking for the same narrator; intervals are half-open [start_date, end_date), so adjacency (existing.end_date == new.start_date) is allowed and only a true interior overlap is rejected. (listing) a new DistributionListing on the same (title, channel) is rejected unless new.effective_from > (max existing effective_until on that title+channel among non-WITHDRAWN listings) + DISTRIBUTION_GAP_DAYS days; intervals are closed [effective_from, effective_until] with a mandatory buffer gap of DISTRIBUTION_GAP_DAYS = 1 day (so with a prior listing ending 2026-05-31, the earliest allowed next effective_from is 2026-06-02)."
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /production-bookings, /distribution-listings"
    note: "concretized: ERR_BOOKING_OVERLAP (booking), ERR_LISTING_GAP_CONFLICT (listing)"

  - priority: 12
    category: business_fiscal
    check: "a statement pay requires net distributable > 0 (nothing-to-pay rejected)"
    error_id: ERR_NOTHING_TO_PAY
    http_status: 402
    applies_to: "POST /royalty-statements/{id}/pay"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Author / Narrator onboarding ----
  - method: POST
    path: "/authors"
    description: "onboard an Author (rights holder)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email]
    output: Author
    side_effects: []
  - method: POST
    path: "/narrators"
    description: "onboard a Narrator"
    roles: [PlatformAdmin]
    code: 201
    input: [name, email, hourly_rate_cents]
    output: Narrator
    side_effects: []
  - method: GET
    path: "/narrators/{id}"
    description: "read a narrator (includes payout_balance_cents, active_booked_days)"
    roles: [PlatformAdmin, Narrator, Author]
    code: 200
    input: []
    output: Narrator
    side_effects: []
  - method: GET
    path: "/authors/{id}"
    description: "read an author (includes payout_balance_cents)"
    roles: [PlatformAdmin, Author]
    code: 200
    input: []
    output: Author
    side_effects: []

  # ---- Title ----
  - method: POST
    path: "/titles"
    description: "create a Title (author_id taken from X-User-ID); starts in DRAFT"
    roles: [Author]
    code: 201
    input: [title_name, isbn, exclusivity, territory, list_price_cents]
    output: Title
    side_effects: ["Title created in DRAFT with rights_status ACTIVE"]
  - method: GET
    path: "/titles/{id}"
    description: "read a title (status, version, finished_hours, retail sample)"
    roles: [Author, Narrator, PlatformAdmin]
    code: 200
    input: []
    output: Title
    side_effects: []
  - method: GET
    path: "/titles"
    description: "list titles, optionally filtered by author_id or status"
    roles: [Author, PlatformAdmin]
    code: 200
    input: ["author_id?", "status?", "limit?", "offset?"]
    output: Title[]
    side_effects: []
  - method: POST
    path: "/titles/{id}/open"
    description: "open a DRAFT title for auditions"
    roles: [Author]
    code: 200
    input: []
    output: Title
    side_effects: ["Title DRAFT -> OPEN_FOR_AUDITION", "increments Title.version by 1"]
  - method: POST
    path: "/titles/{id}/retail-sample"
    description: "set the retail sample clip window on the finished audio"
    roles: [Author]
    code: 200
    input: [retail_sample_start_sec, retail_sample_end_sec]
    output: Title
    side_effects: ["sets retail_sample_start_sec/end_sec", "increments Title.version by 1"]
  - method: POST
    path: "/titles/{id}/publish"
    description: "publish a title whose FULL milestone is APPROVED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Title
    side_effects: ["Title IN_QC -> PUBLISHED", "any ACTIVE ProductionBooking for the title -> COMPLETED", "increments Title.version by 1"]
  - method: POST
    path: "/titles/{id}/revert-rights"
    description: "rights holder reverts distribution rights on a PUBLISHED title"
    roles: [Author]
    code: 200
    input: []
    output: Title
    side_effects:
      - "Title PUBLISHED -> REVERTED, rights_status = REVERTED"
      - "ACCEPTED Contract -> TERMINATED (cascade)"
      - "ACTIVE DistributionListings -> WITHDRAWN (cascade)"
      - "PROVISIONAL/FINALIZED RoyaltyStatements -> FROZEN (cascade)"
      - "increments Title.version by 1"

  # ---- Audition ----
  - method: POST
    path: "/auditions"
    description: "narrator submits an audition for an OPEN_FOR_AUDITION title (narrator_id from X-User-ID)"
    roles: [Narrator]
    code: 201
    input: [title_id, sample_url]
    output: Audition
    side_effects: ["Audition created in SUBMITTED"]
  - method: GET
    path: "/auditions/{id}"
    description: "read an audition"
    roles: [Author, Narrator, PlatformAdmin]
    code: 200
    input: []
    output: Audition
    side_effects: []
  - method: GET
    path: "/auditions"
    description: "list auditions filtered by title_id and/or narrator_id and/or status"
    roles: [Author, Narrator, PlatformAdmin]
    code: 200
    input: ["title_id?", "narrator_id?", "status?", "limit?", "offset?"]
    output: Audition[]
    side_effects: []
  - method: POST
    path: "/auditions/{id}/decision"
    description: "author accepts or declines an audition"
    roles: [Author]
    code: 200
    input: [decision]
    output: Audition
    side_effects: ["Audition SUBMITTED -> ACCEPTED|DECLINED", "increments Audition.version by 1"]

  # ---- Contract ----
  - method: POST
    path: "/contracts"
    description: "author offers a contract to a narrator with an ACCEPTED audition; OCC-guarded on the title"
    roles: [Author]
    code: 201
    input: ["title_id", "narrator_id", "deal_type", "royalty_share_pct?", "per_hour_rate_cents?", "expected_title_version"]
    output: Contract
    side_effects:
      - "Contract created in OFFERED"
      - "Title OPEN_FOR_AUDITION|CASTING -> CASTING"
      - "any existing OFFERED Contract on the title -> SUPERSEDED"
      - "increments Title.version by 1"
  - method: GET
    path: "/contracts/{id}"
    description: "read a contract"
    roles: [Author, Narrator, PlatformAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "list contracts filtered by title_id and/or narrator_id and/or status"
    roles: [Author, Narrator, PlatformAdmin]
    code: 200
    input: ["title_id?", "narrator_id?", "status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/respond"
    description: "narrator accepts or declines an offered contract"
    roles: [Narrator]
    code: 200
    input: [decision]
    output: Contract
    side_effects:
      - "ACCEPT: Contract OFFERED -> ACCEPTED, Title CASTING -> IN_PRODUCTION"
      - "DECLINE: Contract OFFERED -> DECLINED, Title CASTING -> OPEN_FOR_AUDITION"
      - "increments Contract.version by 1"

  # ---- Production booking ----
  - method: POST
    path: "/production-bookings"
    description: "narrator reserves a production window (narrator_id from X-User-ID); overlap-checked"
    roles: [Narrator]
    code: 201
    input: [title_id, start_date, end_date]
    output: ProductionBooking
    side_effects: ["ProductionBooking created in ACTIVE", "recomputes Narrator.active_booked_days"]
  - method: GET
    path: "/production-bookings/{id}"
    description: "read a booking"
    roles: [Narrator, PlatformAdmin]
    code: 200
    input: []
    output: ProductionBooking
    side_effects: []
  - method: GET
    path: "/production-bookings"
    description: "list bookings filtered by narrator_id and/or title_id and/or status"
    roles: [Narrator, PlatformAdmin]
    code: 200
    input: ["narrator_id?", "title_id?", "status?", "limit?", "offset?"]
    output: ProductionBooking[]
    side_effects: []
  - method: POST
    path: "/production-bookings/{id}/cancel"
    description: "narrator cancels an ACTIVE booking, releasing its days"
    roles: [Narrator]
    code: 200
    input: []
    output: ProductionBooking
    side_effects: ["ProductionBooking ACTIVE -> CANCELLED", "recomputes Narrator.active_booked_days"]

  # ---- Production milestone ----
  - method: POST
    path: "/production-milestones"
    description: "narrator submits a milestone deliverable (FIFTEEN_MIN or FULL) against an ACCEPTED contract"
    roles: [Narrator]
    code: 201
    input: ["contract_id", "milestone_type", "audio_url", "finished_hours?"]
    output: ProductionMilestone
    side_effects: ["ProductionMilestone created in SUBMITTED", "if FULL: Title IN_PRODUCTION -> IN_QC", "increments Title.version by 1 when FULL"]
  - method: GET
    path: "/production-milestones/{id}"
    description: "read a milestone (status, revision_count)"
    roles: [Narrator, Author, QCReviewer, PlatformAdmin]
    code: 200
    input: []
    output: ProductionMilestone
    side_effects: []
  - method: GET
    path: "/production-milestones"
    description: "list milestones filtered by contract_id and/or status"
    roles: [Narrator, Author, QCReviewer, PlatformAdmin]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: ProductionMilestone[]
    side_effects: []
  - method: POST
    path: "/production-milestones/{id}/resubmit"
    description: "narrator resubmits after a revision request"
    roles: [Narrator]
    code: 200
    input: [audio_url]
    output: ProductionMilestone
    side_effects: ["ProductionMilestone REVISION_REQUESTED -> SUBMITTED", "if FULL: Title IN_PRODUCTION -> IN_QC", "increments ProductionMilestone.version by 1"]

  # ---- QC review (creates QCReview; drives milestone transitions) ----
  - method: POST
    path: "/production-milestones/{id}/qc-reviews"
    description: "QC reviewer records a PASS or FAIL review of a SUBMITTED milestone"
    roles: [QCReviewer]
    code: 201
    input: ["outcome", "notes?"]
    output: QCReview
    side_effects:
      - "creates QCReview"
      - "PASS: milestone -> APPROVED (+ finished_hours copy + PER_HOUR credit on FULL)"
      - "FAIL: milestone -> REVISION_REQUESTED (or REJECTED at max), revision_count += 1, FULL -> Title back to IN_PRODUCTION"
  - method: GET
    path: "/qc-reviews/{id}"
    description: "read a QC review"
    roles: [QCReviewer, Author, PlatformAdmin]
    code: 200
    input: []
    output: QCReview
    side_effects: []
  - method: GET
    path: "/qc-reviews"
    description: "list QC reviews filtered by milestone_id"
    roles: [QCReviewer, Author, PlatformAdmin]
    code: 200
    input: ["milestone_id?", "limit?", "offset?"]
    output: QCReview[]
    side_effects: []

  # ---- Distribution channel ----
  - method: POST
    path: "/distribution-channels"
    description: "register a retail distribution channel"
    roles: [PlatformAdmin]
    code: 201
    input: [name, supported_territories, retailer_cut_pct]
    output: DistributionChannel
    side_effects: []
  - method: GET
    path: "/distribution-channels/{id}"
    description: "read a channel"
    roles: [PlatformAdmin, Author]
    code: 200
    input: []
    output: DistributionChannel
    side_effects: []

  # ---- Distribution listing ----
