        distinguishing_aspect: |
          The GRADE side effect is conditional on grade: grade==DAMAGED scraps the
          units, so no InventoryLot is created/topped-up and Bin.occupied_cc stays 0
          (contrast the SELLABLE branch covered by §1.8).
        test_recipe:
          setup:
