              captures: { ssh2: $.data.id }
            - call: "POST /observation/handoffs/${ssh2}/countersign"
              payload: {}
              as: Sitter
              as_user_id: "${tss}"
          assert:
            - "Probe 1 (S countersigning the handoff into S's own second watch): HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES — ownership at priority 6 is satisfied because S is the incoming assignment's staff"
            - "Probe 2 (T, who owns neither side of ${ssh1}): HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER — the ownership check at priority 6 fires before the segregation check at priority 16"
            - "After both refusals HandoffRecord.${ssh1} is still DRAFTED with countersigned_by_staff_id null, and SitterAssignment.${ssa1}.documentation_status is still HANDOFF_DRAFTED"
            - "Probe 3: HTTP 201, HandoffRecord.${ssh2} DRAFTED, SitterAssignment.${ssa2}.documentation_status == HANDOFF_DRAFTED"
            - "Probe 4: HTTP 200, HandoffRecord.${ssh2} SIGNED with countersigned_by_staff_id == ${tss}; SitterAssignment.${ssa2}.documentation_status == HANDOFF_SIGNED"
            - "Unit.${u50}.observed_cost_to_date_cents == 48000 (three PROVISIONAL rows of 16000) and status == OPEN"

  - section: cross_cutting_layers
    instances:
      - name: stale_order_version_is_refused_and_the_reread_retry_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.sitter-assignment-create-stale-order
          - errors.ERR_STALE_ORDER_VERSION
          - validations[priority=7]
        distinguishing_aspect: "This is the only OCC-guarded write, and it is a supersede case rather than a state gate: the second watch is perfectly legal, so the failure must come purely from the version token going stale when the first create bumped the order. The retry replays a byte-identical body with the re-read version and succeeds, and the refused attempt must leave both the ledger and the version untouched."
        test_recipe:
          setup:
            - "Unit UNIT-C51 budget 250000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "Two INTERNAL_FLOAT sitters at 2000 cents/hour, ADVANCED with unexpired certifications, taking 08:00-16:00 and 16:00-24:00 so no per-staff temporal rule engages."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C51", name: "Corner Unit Fiftyone", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u51: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u51}", mrn: "MRN-C5101", full_name: "Occ Patient", age_years: 60 }
              as: NurseManager
              captures: { ocp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u51}", full_name: "Occ Sitter One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { ocs1: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u51}", full_name: "Occ Sitter Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { ocs2: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${ocp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall watch needing relief coverage" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { oco: $.data.id, oco_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${oco}", staff_id: "${ocs1}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${oco_v1}" }
              as: StaffingCoordinator
              captures: { oca1: $.data.id }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${oco}", staff_id: "${ocs2}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${oco_v1}" }
              as: StaffingCoordinator
            - call: "GET /observation/orders/${oco}"
              payload: {}
              as: StaffingCoordinator
              captures: { oco_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${oco}", staff_id: "${ocs2}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-02T00:00:00Z", expected_order_version: "${oco_v2}" }
              as: StaffingCoordinator
              captures: { oca2: $.data.id }
          assert:
            - "Probe 1: HTTP 201; SitterAssignment.${oca1}.version == 1 and the order's version advanced to ${oco_v2} == ${oco_v1} + 1"
            - "Probe 2 (the relief watch replaying the pre-create version): HTTP 412 with data.error_id == ERR_STALE_ORDER_VERSION"
            - "Probe 2 is inert: GET /observation/orders/${oco}/sitter-assignments returns 1 row, Unit.${u51}.observed_cost_to_date_cents == 16000, ObservationOrder.${oco}.version is still ${oco_v2}, and Staff.${ocs2}.last_shift_end_at is still null"
            - "Probe 4 sends the identical body with the re-read version and returns HTTP 201, proving the refusal was about the token and not about the watch"
            - "After probe 4: Unit.${u51}.observed_cost_to_date_cents == 32000, GET /observation/orders/${oco}/sitter-assignments returns 2 rows, and ObservationOrder.${oco}.version == ${oco_v2} + 1"
            - "Staff.${ocs2}.last_shift_end_at == 2026-08-02T00:00:00Z and Staff.${ocs2}.version advanced by exactly 1 across the whole sequence"

      - name: unit_restriction_resets_only_after_a_reversal_and_a_close
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Unit
          - calculations.unit_daily_observation_charge
        distinguishing_aspect: "The cumulative spend threshold is asymmetric: reaching the budget restricts the unit inside the posting request, but dropping back below it by a reversal does not release it — the reset needs an explicit cost-close. The close also lands on the bottom tier, where the surcharge percentage is 0.00 and the charge equals the subtotal exactly."
        test_recipe:
          setup:
            - "Unit UNIT-C52 with budget 30000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "Two INTERNAL_FLOAT sitters at 2000 cents/hour: an 8-hour watch (16000) and a 7-hour watch (14000), which together take the head to exactly the budget."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C52", name: "Corner Unit Fiftytwo", observation_cost_budget_cents: 30000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u52: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u52}", mrn: "MRN-C5201", full_name: "Reset Patient", age_years: 60 }
              as: NurseManager
              captures: { rsp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u52}", full_name: "Reset Sitter One", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { rss1: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u52}", full_name: "Reset Sitter Two", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { rss2: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${rsp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall watch on a capped budget" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { rso: $.data.id, rso_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${rso}", staff_id: "${rss1}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${rso_v1}" }
              as: StaffingCoordinator
              captures: { rsa1: $.data.id }
            - call: "GET /observation/orders/${rso}"
              payload: {}
              as: StaffingCoordinator
              captures: { rso_v2: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${rso}", staff_id: "${rss2}", shift_start_at: "2026-08-01T16:00:00Z", shift_end_at: "2026-08-01T23:00:00Z", expected_order_version: "${rso_v2}" }
              as: StaffingCoordinator
              captures: { rsa2: $.data.id }
          trigger:
            - call: "POST /observation/sitter-assignments/${rsa2}/void"
              payload: {}
              as: NurseManager
              as_user_id: "mgr-1"
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: SystemAdmin
            - call: "POST /observation/units/${u52}/cost-close"
              payload: { close_through_utc: "2026-08-01T06:00:00Z" }
              as: StaffingCoordinator
              as_user_id: "coord-1"
          assert:
            - "Before the triggers: Unit.${u52}.observed_cost_to_date_cents == 30000 and status == RESTRICTED (the 14000 post reached the budget exactly)"
            - "Probe 1 (void): HTTP 200 with watch_status == VOIDED and documentation_status == WAIVED; the PROVISIONAL row of ${rsa2} becomes REVERSED with amount_cents still 14000"
            - "Probe 1 drops Unit.${u52}.observed_cost_to_date_cents to 16000 but leaves status == RESTRICTED with restriction_reason unchanged — a reversal never releases the unit"
            - "Probe 3 (cost-close): subtotal_cents == 16000 (only the POSTED row of ${rsa1}), coverage_surcharge_pct == 0.00, coverage_surcharge_cents == 0, charge_total_cents == 16000 — the bottom tier adds nothing"
            - "Probe 3 reports unit_status == OPEN because 16000 < 30000 and no order on the unit is LAPSED; Unit.${u52}.restriction_reason == null"
            - "GET /observation/units/${u52}/cost-entries still returns exactly 2 rows and the head is still 16000 — the close moved no money"
            - "SitterAssignment.${rsa1}.watch_status is still SCHEDULED throughout"

      - name: incident_review_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "transitive_cascade / incident_review_modality_to_feed_to_station_to_observer_depth_four"
          rationale: "That instance walks all four hops of the deepest chain in the scaffold in one call and asserts every intermediate entity, including the ordering rule that SUSPENDED wins over the AVAILABLE written by hop 4."
      - name: labor_cost_layer_produces_two_results_and_a_correct_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "dual_variant_calc / assignment_labor_cost_provisional_vs_final_diverge_on_one_watch"
          rationale: "That instance computes both variants on one watch and asserts the exact delta the reconciliation writes into the unit ledger."
      - name: span_of_control_is_an_instantaneous_threshold_trigger
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / station_aggregate_capacity_with_limit_shrinking_under_acuity_weight"
          rationale: "That instance drives the acuity-weighted span limit down across successive admissions and refuses the admission that crosses it, which is the instantaneous-threshold half of this layer."

  - section: consistency_model
    instances:
      - name: derived_ledger_and_version_fields_never_lag_a_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_observation_sitter_assignments
        distinguishing_aspect: "consistency_model is immediate, so one create must publish every derived consequence at once: the assignment's own computed fields in its response body, and the unit's ledger head, the staff member's next-shift marker and the order's version all readable on the very next request with no settling step. A background or deferred ledger update would pass the create assertion and fail the reads."
        test_recipe:
          setup:
            - "Unit UNIT-C53 budget 250000, video disabled; admitted patient age 60 with an ACTIVE FALL-only order; one INTERNAL_FLOAT sitter at 2000, ADVANCED, certification valid to 2027."
            - "The logical clock stays at the startup default 2026-08-01T00:00:00Z for the whole recipe."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C53", name: "Corner Unit Fiftythree", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { u53: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${u53}", mrn: "MRN-C5301", full_name: "Immediate Patient", age_years: 60 }
              as: NurseManager
              captures: { imp: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${u53}", full_name: "Immediate Sitter", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { ims: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${imp}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall watch, single shift" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { imo: $.data.id, imo_v1: $.data.version }
          trigger:
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${imo}", staff_id: "${ims}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${imo_v1}" }
              as: StaffingCoordinator
              captures: { ima: $.data.id }
            - call: "GET /observation/units/${u53}"
              payload: {}
              as: StaffingCoordinator
            - call: "GET /observation/staff/${ims}"
              payload: {}
              as: StaffingCoordinator
            - call: "GET /observation/orders/${imo}"
              payload: {}
              as: StaffingCoordinator
              captures: { imo_v2: $.data.version }
            - call: "GET /observation/units/${u53}/cost-entries"
              payload: {}
              as: StaffingCoordinator
          assert:
            - "The create response itself already carries scheduled_minutes == 480, provisional_cost_cents == 16000, watch_status == SCHEDULED, documentation_status == PENDING and version == 1"
            - "The very next read of the unit shows observed_cost_to_date_cents == 16000 and open_order_count == 1 with no intervening call of any kind"
            - "The staff read shows last_shift_end_at == 2026-08-01T16:00:00Z while status is still AVAILABLE, and total_watch_minutes == 0"
            - "The order read shows version ${imo_v2} == ${imo_v1} + 1, and status still ACTIVE"
            - "The cost-entry list returns exactly 1 row: PROVISIONAL, POSTED, amount_cents 16000, posted_at 2026-08-01T00:00:00Z, unit_id ${u53}, assignment_id ${ima}, segment_index null"
            - "Every one of these reads is a plain GET with no retry loop, filter or delay"

      - name: cascade_results_are_readable_immediately_after_the_triggering_call
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: "transitive_cascade / patient_discharge_order_to_assignment_to_ledger_depth_three"
          rationale: "That instance reads every entity touched by the discharge cascade straight after the single discharge call and asserts the final ledger head, which is the immediate-visibility claim at cascade scale."
