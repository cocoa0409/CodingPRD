              as: ProgramDirector
            - call: "GET /case-matters/${m2_id}"
              payload: {}
              as: ProgramDirector
              captures: { m2_ver2: "$.data.version" }
          trigger:
            - call: "POST /case-assignments/${asg_cc_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "POST /case-assignments"
              payload: { matter_id: "${m2_id}", representative_id: "${atty_d_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${m2_ver2}" }
              as: ProgramDirector
          assert:
            - "Before the trigger: ProgramCapacityCycle ${cycle_id}.utilization_ratio == 1.0000 and capacity_posture == 'FROZEN' (the override instant 2026-09-05T00:00:00.000Z is no longer strictly after the clock 2026-09-06T00:00:00.000Z); Representative ${atty_c_id}.active_case_load == 1 == max_case_load."
            - "step 1 returns HTTP 422 with error_id 'ERR_CASELOAD_CAP_EXCEEDED' - priority 26 wins over priority 34 even though both are violated."
            - "step 1 mutated nothing: CaseAssignment ${asg_cc_id}.status == 'PROPOSED' and Representative ${atty_c_id}.active_case_load == 1."
            - "step 2 (control, only priority 34 is violated because ${atty_d_id} has active_case_load 0 < max_case_load 5) returns HTTP 409 with error_id 'ERR_CYCLE_CAPACITY_FROZEN', proving the FROZEN posture was genuinely live during step 1."
            - "Neither response is 'ERR_STALE_MATTER_VERSION': the OCC check is priority 38 and both requests carried the current version."

      - name: dangling_supervision_link_beats_withdrawn_matter_state
        grounds:
          - validations[priority=11]
          - validations[priority=15]
          - state_machines.IntakeScreening.ACCEPTED_to_WITHDRAWN
          - concurrency_rules[lead-assignment-create-stale-matter]
        distinguishing_aspect: |
          CONFLICT PAIR 2: POST /case-assignments is aimed at a matter whose
          representation_status is already WITHDRAWN_FROM (via the accepted-intake withdrawal
          cascade) while the payload also carries a supervision_link_id that resolves to no
          row at all; the existence check at priority 11 must answer first with
          ERR_SUPERVISION_LINK_NOT_FOUND / 404, not the state check at priority 15
          (ERR_MATTER_CLOSED / 409) and not the OCC check at priority 38, and a control call
          that omits supervision_link_id must then return the 409 to prove the matter really
          was closed.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "One accepted, non-detained matter whose intake is then withdrawn, so CaseMatter.representation_status == 'WITHDRAWN_FROM' and filing_status == 'CLOSED_NO_FILING'."
            - "No waitlisted rows exist, so the withdrawal cascade stops after hop 3."
            - "The matter version is re-read after the cascade so the OCC token in both trigger calls is current."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 2 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-950001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-950002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Ivo Petrov", preferred_language_code: "en", country_of_birth_code: "BG", date_of_birth: "1991-06-14", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { i_id: "$.data.id" }
            - call: "POST /intake-screenings/${i_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${i_id}" }
              as: ProgramDirector
              captures: { m_id: "$.data[0].id" }
            - call: "POST /intake-screenings/${i_id}/withdraw"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "GET /case-matters/${m_id}"
              payload: {}
              as: ProgramDirector
              captures: { m_ver_closed: "$.data.version" }
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "${m_id}", representative_id: "${atty_a_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${m_ver_closed}", supervision_link_id: "00000000-0000-4000-8000-000000000000" }
              as: ProgramDirector
            - call: "POST /case-assignments"
              payload: { matter_id: "${m_id}", representative_id: "${atty_a_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${m_ver_closed}" }
              as: ProgramDirector
          assert:
            - "Before the trigger: CaseMatter ${m_id}.representation_status == 'WITHDRAWN_FROM' and filing_status == 'CLOSED_NO_FILING'."
            - "step 1 returns HTTP 404 with error_id 'ERR_SUPERVISION_LINK_NOT_FOUND' - priority 11 (existence) wins over priority 15 (state) although both are violated."
            - "step 2 (control, no supervision_link_id supplied) returns HTTP 409 with error_id 'ERR_MATTER_CLOSED', proving the state violation was present during step 1."
            - "No CaseAssignment row was created by either step: GET /case-assignments?matter_id=${m_id} returns total_count 0."

      - name: role_not_permitted_beats_missing_matter_for_client_portal_user
        grounds:
          - validations[priority=2]
          - validations[priority=6]
          - entities.CaseAssignment.fields.matter_id
        distinguishing_aspect: |
          CONFLICT PAIR 1: a ClientPortalUser - a role absent from the roles list of
          POST /case-assignments - posts an assignment for a matter_id that does not exist at
          all; the answer must be ERR_ROLE_NOT_PERMITTED / 403 from priority 2 and must not
          leak the non-existence of the matter through ERR_MATTER_NOT_FOUND / 404, so an
          implementation that resolves path/body FKs before authorising the caller fails.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "One Client row exists purely to supply a valid ClientPortalUser identity; no CaseMatter is ever created, so the matter_id in the trigger cannot resolve."
            - "One Representative row exists so that representative_id is not the failing lookup."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /representatives"
