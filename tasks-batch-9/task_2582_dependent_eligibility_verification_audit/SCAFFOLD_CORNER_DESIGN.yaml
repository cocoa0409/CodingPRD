          - state_machines.AuditProgram
        distinguishing_aspect: "A sweep run before amnesty_end_at returns 200 while leaving status, sweep_epoch and version untouched, and re-running the identical sweep immediately after the amnesty close does not advance sweep_epoch a second time - the checkpoint is keyed on state, not on call count."
        test_recipe:
          setup:
            - "Program P is AMNESTY_OPEN, announced 2026-09-01 with amnesty_days 21, so amnesty_end_at is 2026-09-22 and response_deadline_at is 2026-10-16."
            - "One SPOUSE dependent D1 under E1 is PENDING_VERIFICATION in case C1 (NOTIFIED); sweep_epoch is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { v_ann: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-23T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /audit-cases"
              payload: { program_id: "${prog_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 200, response data.status == AMNESTY_OPEN, response data.sweep_epoch == 0, response data.version == ${v_ann}"
            - "Third call: HTTP status == 200, response data.status == RESPONSE_WINDOW, response data.sweep_epoch == 1"
            - "Fourth call: HTTP status == 200, response data.status == RESPONSE_WINDOW, response data.sweep_epoch == 1 (unchanged - the replay mutated nothing)"
            - "Fifth call: total_count == 1 and the single AuditCase status == NOTIFIED (S1 touches no case)"
            - "Dependent.${dep1_id}.coverage_status == PENDING_VERIFICATION and no TerminationNotice exists"

      - name: corner_one_sweep_call_runs_later_steps_against_state_produced_by_earlier_steps
        claim_type: scheduled_deferred_actions
        grounds:
          - endpoints[POST /audit-programs/{id}/run-sweep]
          - calculations.termination_effective_date
          - calculations.case_escalation_priority_score
        distinguishing_aspect: "With the clock jumped past both deadlines, a single sweep call performs S1 (AMNESTY_OPEN -> RESPONSE_WINDOW) and then S2 against that brand-new RESPONSE_WINDOW status in the same call, yet sweep_epoch advances only once; S4 and S6 stay no-ops because effective_date 2026-12-31 is not before the clock date and the election deadline 2027-02-15 has not passed."
        test_recipe:
          setup:
            - "Program P is AMNESTY_OPEN, announced 2026-09-01 (amnesty_end_at 2026-09-22, response_deadline_at 2026-10-16), sweep_epoch 0."
            - "One SPOUSE dependent D1 (49713 cents/month) under E1 sits in case C1 (NOTIFIED) with no proof submissions and no reminders."
            - "No sweep has ever run; the clock is moved directly to 2026-12-17."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "EMPLOYEE_SPOUSE", employer_monthly_premium_cents: 121000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
            - call: "POST /employees/${emp1_id}/dependents"
              payload: { relationship_type: "SPOUSE", full_name: "Marta Reyes", date_of_birth: "1988-04-12", monthly_cost_cents: 49713 }
              as: ProgramAdmin
              captures: { dep1_id: "$.data.id" }
            - call: "POST /audit-programs"
              payload: { program_name: "PY2026 Dependent Eligibility Audit", plan_year: 2026, amnesty_days: 21, response_days: 45, reminder_min_gap_days: 7, max_reminders: 3, poe_verification_enabled: false }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /audit-programs/${prog_id}/documentation-rules"
              payload: { relationship_type: "SPOUSE", phase: "AUDIT", acceptable_proof_types: ["MARRIAGE_CERTIFICATE"], min_accepted_documents: 1, affidavit_allowed: false, requires_recency_days: 365, auto_terminate_on_lapse: false }
              as: ProgramAdmin
            - call: "GET /audit-programs/${prog_id}"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /audit-programs/${prog_id}/scope"
              payload: { expected_program_version: "${pv}", scope_type: "FULL_CENSUS" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /audit-programs/${prog_id}/communicate"
              payload: { channel: "EMAIL", template_code: "AUDIT_ANNOUNCE_V1" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-17T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /audit-programs/${prog_id}/run-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "GET /audit-cases"
              payload: { program_id: "${prog_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
              captures: { case1_id: "$.data[0].id" }
            - call: "GET /termination-notices"
              payload: { dependent_id: "${dep1_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
              captures: { notice1_id: "$.data[0].id" }
            - call: "GET /termination-notices/${notice1_id}"
              as: ProgramAdmin
          assert:
            - "First call: HTTP status == 200, response data.status == ESCALATION, response data.sweep_epoch == 1, response data.non_responsive_case_count == 1, response data.termination_pending_count == 1, response data.pending_dependent_count == 0, response data.provisional_annual_savings_cents == 596556"
            - "Second call: total_count == 1 and the AuditCase status == ESCALATED, priority_score == 55, non_responsive_at == 2026-12-17T00:00:00.000Z, escalated_at == 2026-12-17T00:00:00.000Z"
            - "Third call: total_count == 1 (exactly one notice was issued, not one per sweep step)"
            - "Fourth call: response data.status == ISSUED, origin == AUDIT_ESCALATION, issued_at == 2026-12-17T00:00:00.000Z, grace_days_applied == 14, effective_date == 2026-12-31, batch_sequence_no == 1, continuation_election_deadline == 2027-02-15T00:00:00.000Z, continuation_election_status == NOT_ELECTED, continuation_monthly_premium_cents == 0"
            - "Dependent.${dep1_id}.coverage_status == TERMINATION_PENDING and coverage_end_date == null (S4 did not finalise: effective_date 2026-12-31 is not < 2026-12-17)"

      - name: corner_escalation_sweep_propagates_through_program_case_dependent_and_notice
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / escalation_sweep_cascades_program_case_dependent_notice_counters
          rationale: "The named §1.8 instance already walks the full four-level chain of one escalation sweep and reconciles every counter it touches end to end."

      - name: corner_both_savings_variants_are_computed_and_the_switch_delta_lands_on_the_program
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / savings_provisional_vs_audited_diverge_on_one_dependent_set
          rationale: "The named §1.8 instance asserts both variant results on one dependent set, the last_savings_variant switch and the resulting delta on the program row."

  - section: consistency model
    instances:
      - name: corner_amnesty_removal_effects_are_visible_in_the_same_response_and_immediate_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /amnesty-removals]
          - entities.AuditProgram.amnesty_removed_count
        distinguishing_aspect: "The consistency model is immediate, not eventual: the write's own 201 body already carries the derived coverage_end_date, and reads issued immediately afterwards - with no sweep and no delay - already show the case moved to IN_PROGRESS, the dependent AMNESTY_REMOVED and every program counter re-derived."
        test_recipe:
          setup:
            - "Program P is AMNESTY_OPEN (announced 2026-09-01, amnesty_end_at 2026-09-22) with two dependents D1 (SPOUSE) and D2 (CHILD_BIOLOGICAL, 30500 cents/month) under E1 in case C1 (NOTIFIED), pending_dependent_count 2."
            - "The clock reads 2026-09-10; no sweep has run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /employees"
              payload: { full_name: "Dana Reyes", work_email: "dana.reyes@acme.test", coverage_tier: "FAMILY", employer_monthly_premium_cents: 152000, hire_date: "2019-03-04" }
              as: ProgramAdmin
              captures: { emp1_id: "$.data.id" }
