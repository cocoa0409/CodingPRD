          Both parents are plain FKs on a flat topology, and the §1.4 ladder orders their misses:
          ERR_EQUIPMENT_SPEC_NOT_FOUND sits at priority 12 and ERR_UPFIT_ORDER_NOT_FOUND at 17, so a
          request that names a bogus spec AND a bogus order must surface the spec miss, not the order
          miss — the catalog reference is resolved first.
