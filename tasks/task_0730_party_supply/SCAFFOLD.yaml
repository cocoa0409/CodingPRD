scenario: |
  730. Party-Supply & Balloon Store: SKU & theme/bundle, balloon/helium order &
  delivery/setup, costume & seasonal (Halloween) inventory, rental (tableware)
  add-on, custom (banner/print) order, event package & deposit, BOPIS,
  return/clearance
domain_name: party-supply-store
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entities
# ---------------------------------------------------------------------------
entities:
  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: "Business SKU code (e.g. 'BAL-LATEX-11-RED'); unique across catalog."
        constraints: "unique across all Sku rows"
      - name: category
        type: enum
        source: input
        description: "Product family — determines pricing/return rules."
        constraints: "one of {BALLOON_LATEX, BALLOON_FOIL, COSTUME, TABLEWARE, DECOR, PRINT_CUSTOM, HELIUM, SEASONAL_HALLOWEEN}"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Retail price in USD cents at full price."
        constraints: ">= 0"
      - name: theme_tag
        type: string
        source: input
        description: "Theme identifier (e.g. 'UNICORN', 'STAR_WARS', 'HALLOWEEN_CLASSIC'); nullable."
        default: null
      - name: on_hand_qty
        type: integer
        source: computed
        description: "Aggregate quantity available on-hand across all channels; recomputed on Inventory writes and Order/RentalContract state changes."
        default: 0
      - name: reserved_qty
        type: integer
        source: computed
        description: "Aggregate quantity reserved by unfulfilled Orders/RentalContracts; recomputed via derived_field_reconciliation."
        default: 0
      - name: seasonal_window_start
        type: datetime
        source: input
        description: "Inclusive start date for seasonal availability; null for evergreen SKUs."
        default: null
      - name: seasonal_window_end
        type: datetime
        source: input
        description: "Inclusive end date for seasonal availability; null for evergreen SKUs."
        default: null
      - name: is_clearance
        type: boolean
        source: computed
        description: "True after clearance transition; drives return-eligibility and pricing."
        default: false
      - name: clearance_pct
        type: number
        source: input
        description: "Discount fraction 0..1 when clearance is active; 0 otherwise."
        default: 0

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - name: bundle_code
        type: string
        source: input
        description: "Bundle identifier (e.g. 'UNICORN-PARTY-BOX-8')."
        constraints: "unique across all Bundle rows"
      - name: theme_tag
        type: string
        source: input
        description: "Theme classification for the bundle."
      - name: bundle_price_cents
        type: integer
        source: input
        description: "Fixed price for the bundle in USD cents (dual-variant pricing subject: bundle vs a la carte)."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Bundle lifecycle status."
        constraints: "one of {ACTIVE, DISCONTINUED}"
        default: ACTIVE

  - name: BundleLine
    parent: Bundle
    common_fields: false
    fields:
      - name: bundle_id
        type: string
        source: input
        description: "FK -> Bundle.id"
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id"
      - name: qty
        type: integer
        source: input
        description: "Qty of this SKU per bundle unit."
        constraints: ">= 1"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Fulfillment axis of parallel state machine."
        constraints: "one of {DRAFT, RESERVED, PICKING, READY_FOR_PICKUP, PICKED_UP, DELIVERED, RETURNED, CANCELLED}"
        default: DRAFT
      - name: payment_status
        type: enum
        source: computed
        description: "Payment axis of parallel state machine — evolves independently from fulfillment_status."
        constraints: "one of {UNPAID, DEPOSIT_HELD, PAID, PARTIALLY_REFUNDED, REFUNDED}"
        default: UNPAID
      - name: channel
        type: enum
        source: input
        description: "Fulfillment channel; BOPIS pickup vs delivery vs in-store."
        constraints: "one of {BOPIS, DELIVERY, IN_STORE}"
      - name: pickup_window_start
        type: datetime
        source: input
        description: "Requested BOPIS pickup window start (channel==BOPIS only); null otherwise."
        default: null
      - name: pickup_window_end
        type: datetime
        source: input
        description: "Requested BOPIS pickup window end (channel==BOPIS only); null otherwise."
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of line items after clearance discount; excludes helium/delivery/deposit."
        default: 0
      - name: helium_fee_cents
        type: integer
        source: computed
        description: "Helium fill fee derived from HeliumOrder; zero if none."
        default: 0
      - name: delivery_fee_cents
        type: integer
        source: computed
        description: "Delivery + setup fee from DeliverySlot; zero for BOPIS/IN_STORE."
        default: 0
      - name: deposit_cents
        type: integer
        source: computed
        description: "Refundable deposit component (rental + event package)."
        default: 0
      - name: grand_total_cents
        type: integer
        source: computed
        description: "subtotal + helium_fee + delivery_fee + deposit; pinned by calc `order_grand_total`."
        default: 0
      - name: pickup_deadline
        type: datetime
        source: computed
        description: "pickup_window_end + 48h grace; used for scheduled no-show cancellation."
        default: null

  - name: OrderLine
    parent: Order
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; nullable when bundle_id is set."
        default: null
      - name: bundle_id
        type: string
        source: input
        description: "FK -> Bundle.id; nullable when sku_id is set."
        default: null
      - name: qty
        type: integer
        source: input
        description: "Quantity of this line."
        constraints: ">= 1"
      - name: unit_price_cents_at_capture
        type: integer
        source: computed
        description: "Price snapshot at RESERVED transition — locks clearance/bundle pricing so later catalog edits do not mutate the order."
        default: 0
      - name: line_total_cents
        type: integer
        source: computed
        description: "qty * unit_price_cents_at_capture."
        default: 0

  - name: HeliumOrder
    parent: Order
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: latex_count
        type: integer
        source: input
        description: "Number of 11-inch latex balloons to fill."
        constraints: ">= 0"
      - name: foil_count
        type: integer
        source: input
        description: "Number of 18-inch foil balloons to fill."
        constraints: ">= 0"
      - name: helium_tank_ids
        type: array
        source: computed
        description: "Ordered list of HeliumTank ids consumed at RESERVED transition; drives waterfall_allocation from active tanks."
        default: []
      - name: fill_fee_cents
        type: integer
        source: computed
        description: "Pinned fill fee (per-line rounding order: round each line then sum)."
        default: 0

  - name: HeliumTank
    parent: null
    common_fields: true
    fields:
      - name: tank_code
        type: string
        source: input
        description: "Store tank identifier."
        constraints: "unique"
      - name: capacity_cubic_ft
        type: integer
        source: input
        description: "Total tank capacity in cubic feet at full."
        constraints: ">= 0"
      - name: remaining_cubic_ft
        type: integer
        source: computed
        description: "Remaining helium; consumed on HeliumOrder reservation, refilled by tank refill action."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Tank operational status."
        constraints: "one of {ACTIVE, EMPTY, OUT_OF_SERVICE}"
        default: ACTIVE

  - name: DeliverySlot
    parent: null
    common_fields: true
    fields:
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the delivery window (half-open interval `[start, end)` — see calc `delivery_slot_overlap`)."
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the delivery window."
      - name: van_id
        type: string
        source: input
        description: "Delivery vehicle identifier; overlap check is scoped per van."
      - name: setup_included
        type: boolean
        source: input
        description: "True if on-site setup is included in this slot booking."
        default: false
      - name: order_id
        type: string
        source: computed
        description: "FK -> Order.id; the Order that reserved this slot (null until reserved)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Slot booking status."
        constraints: "one of {AVAILABLE, RESERVED, COMPLETED, CANCELLED}"
        default: AVAILABLE

  - name: RentalContract
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; MUST reference a TABLEWARE-category SKU."
      - name: qty
        type: integer
        source: input
        description: "Rental unit count."
        constraints: ">= 1"
      - name: rental_start
        type: datetime
        source: input
        description: "Rental period start (half-open `[start, end)`; see calc `rental_period_overlap`)."
      - name: rental_end
        type: datetime
        source: input
        description: "Rental period end."
      - name: deposit_cents
        type: integer
        source: computed
        description: "Deposit portion (deposit_per_unit * qty) — refunded on RETURNED, forfeited on LATE_RETURN."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Rental lifecycle."
        constraints: "one of {RESERVED, PICKED_UP, RETURNED, LATE_RETURN, DAMAGED}"
        default: RESERVED
      - name: returned_at
        type: datetime
        source: computed
        description: "Server-stamped return timestamp; drives late-fee calc."
        default: null

  - name: CustomPrintOrder
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: art_reference
        type: string
        source: input
        description: "Customer-supplied artwork reference (URL or design code)."
      - name: banner_length_ft
        type: integer
        source: input
        description: "Banner length in linear feet; drives tiered pricing."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: "Custom print state — cyclic: PROOF_SENT can loop back on customer revision."
        constraints: "one of {DRAFT, PROOF_SENT, REVISION_REQUESTED, APPROVED, PRINTING, READY, CANCELLED}"
        default: DRAFT
      - name: revision_count
        type: integer
        source: computed
        description: "Number of REVISION_REQUESTED cycles completed."
        default: 0
      - name: print_fee_cents
        type: integer
        source: computed
        description: "Pinned print fee (tiered_pricing by length)."
        default: 0

  - name: EventPackage
    parent: null
    common_fields: true
    fields:
      - name: package_code
        type: string
        source: input
        description: "Event package identifier (e.g. 'HALLOWEEN-BASH-30')."
        constraints: "unique"
      - name: base_price_cents
        type: integer
        source: input
        description: "Package base fee."
        constraints: ">= 0"
      - name: deposit_pct
        type: number
        source: input
        description: "Deposit fraction 0..1 required to secure the event."
        constraints: ">= 0 and <= 1"
      - name: min_lead_days
        type: integer
        source: input
        description: "Minimum days between deposit and event date."
        constraints: ">= 0"

  - name: EventBooking
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id"
      - name: event_package_id
        type: string
        source: input
        description: "FK -> EventPackage.id"
      - name: event_date
        type: datetime
        source: input
        description: "Scheduled event date (UTC)."
      - name: deposit_cents
        type: integer
        source: computed
        description: "Pinned deposit at booking time (base_price * deposit_pct, rounded)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Event booking lifecycle."
        constraints: "one of {HELD, CONFIRMED, COMPLETED, CANCELLED, FORFEITED}"
        default: HELD

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Customer email; unique."
        constraints: "unique"
      - name: full_name
        type: string
        source: input
        description: "Customer full name."
      - name: store_credit_cents
        type: integer
        source: computed
        description: "Store-credit ledger (compensating-invariant subject: refund_channel switch conserves grand_total)."
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machines
# ---------------------------------------------------------------------------
state_machines:
  - entity: Order
    initial_state: "fulfillment_status=DRAFT AND payment_status=UNPAID"
    terminal_states: ["fulfillment_status=CANCELLED", "fulfillment_status=RETURNED AND payment_status=REFUNDED"]
    note: |
      Parallel state dimensions — `fulfillment_status` and `payment_status`
      evolve independently on the SAME Order row. Some transitions on one
      axis have preconditions on the other (guarded), but the axes never
      merge into a single status field.
    transitions:
      - from: "fulfillment_status=DRAFT"
        to: "fulfillment_status=RESERVED"
        trigger: "POST /orders/{id}/reserve"
        actor: StoreClerk
        preconditions:
          - "Order has at least one OrderLine"
          - "For every OrderLine with sku_id: Sku.on_hand_qty - Sku.reserved_qty >= qty"
          - "For every OrderLine with bundle_id: for every BundleLine of that bundle, aggregate reservable qty >= bundleline.qty * orderline.qty"
          - "If HeliumOrder attached: SUM(active HeliumTank.remaining_cubic_ft) >= required_cubic_ft"
          - "If channel==DELIVERY: exactly one DeliverySlot referenced and its status==AVAILABLE"
          - "For every OrderLine's Sku with seasonal_window_start/end set: server clock is within [seasonal_window_start, seasonal_window_end]"
        side_effects:
          - "Sku.reserved_qty += line qty for every OrderLine (cascade depth 1 -> Sku)"
          - "HeliumTank.remaining_cubic_ft -= per-tank allocation using waterfall by created_at ASC (cascade depth 1 -> HeliumTank)"
          - "DeliverySlot.status flips AVAILABLE -> RESERVED and DeliverySlot.order_id set (cascade depth 1 -> DeliverySlot)"
          - "OrderLine.unit_price_cents_at_capture pinned from Sku.unit_price_cents (with clearance_pct applied) or Bundle.bundle_price_cents"
          - "OrderLine.line_total_cents recomputed"
          - "Order.subtotal_cents, helium_fee_cents, delivery_fee_cents, deposit_cents, grand_total_cents recomputed"
          - "If channel==BOPIS: Order.pickup_deadline = pickup_window_end + 48h"
          - "Order.version increments by 1"

      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=PICKING"
        trigger: "POST /orders/{id}/start-picking"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status == RESERVED"
          - "Order.payment_status IN {DEPOSIT_HELD, PAID}"
        side_effects:
          - "Order.updated_at, Order.version incremented"

      - from: "fulfillment_status=PICKING"
        to: "fulfillment_status=READY_FOR_PICKUP"
        trigger: "POST /orders/{id}/mark-ready"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status == PICKING"
          - "Order.channel == BOPIS"
        side_effects:
          - "Order.version incremented"

      - from: "fulfillment_status=READY_FOR_PICKUP"
        to: "fulfillment_status=PICKED_UP"
        trigger: "POST /orders/{id}/pickup"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status == READY_FOR_PICKUP"
          - "Order.payment_status == PAID"
          - "server clock < Order.pickup_deadline"
        side_effects:
          - "Sku.reserved_qty -= line qty and Sku.on_hand_qty -= line qty for every OrderLine (cascade depth 2 -> Sku)"
          - "For every attached RentalContract: RentalContract.status flips RESERVED -> PICKED_UP, Sku.reserved_qty -= RentalContract.qty, Sku.on_hand_qty -= RentalContract.qty (cascade depth 2 -> RentalContract -> Sku)"
          - "Order.version incremented"

      - from: "fulfillment_status=READY_FOR_PICKUP"
        to: "fulfillment_status=CANCELLED"
        trigger: "system event: nightly no-show sweep at clock advance past Order.pickup_deadline"
        actor: system
        preconditions:
          - "Order.fulfillment_status == READY_FOR_PICKUP"
          - "server clock >= Order.pickup_deadline"
        side_effects:
          - "Sku.reserved_qty -= line qty for every OrderLine (cascade depth 1 -> Sku)"
          - "HeliumTank.remaining_cubic_ft += original allocation (compensating invariant subject: helium quantity)"
          - "DeliverySlot.status flips RESERVED -> CANCELLED (if any)"
          - "For every RentalContract: status remains RESERVED but rental fees are voided"
          - "Order.payment_status flips DEPOSIT_HELD or PAID -> REFUNDED and Customer.store_credit_cents += Order.grand_total_cents (compensating invariant subject: money)"
          - "Order.version incremented"

      - from: "fulfillment_status=PICKED_UP"
        to: "fulfillment_status=DELIVERED"
        trigger: "POST /orders/{id}/deliver"
        actor: DeliveryDriver
        preconditions:
          - "Order.channel == DELIVERY"
          - "Order.fulfillment_status == PICKED_UP"
          - "server clock is within referenced DeliverySlot [window_start, window_end)"
        side_effects:
          - "DeliverySlot.status flips RESERVED -> COMPLETED"
          - "Order.version incremented"

      - from: "fulfillment_status IN {PICKED_UP, DELIVERED}"
        to: "fulfillment_status=RETURNED"
        trigger: "POST /orders/{id}/return"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status IN {PICKED_UP, DELIVERED}"
          - "server clock <= (Order transitions.PICKED_UP timestamp + 14 days)"
          - "For every OrderLine: Sku.is_clearance == false (clearance items are non-returnable)"
        side_effects:
          - "Sku.on_hand_qty += line qty for every OrderLine (compensating invariant subject: SKU stock)"
          - "Order.payment_status flips PAID -> REFUNDED or PARTIALLY_REFUNDED"
          - "Order.version incremented"

      - from: "fulfillment_status IN {DRAFT, RESERVED, PICKING}"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status IN {DRAFT, RESERVED, PICKING}"
        side_effects:
          - "Sku.reserved_qty -= line qty for every OrderLine (cascade depth 1 -> Sku)"
          - "HeliumTank.remaining_cubic_ft += original allocation (compensating invariant: helium)"
          - "DeliverySlot.status flips RESERVED -> CANCELLED"
          - "Order.payment_status flips DEPOSIT_HELD -> REFUNDED"
          - "Order.version incremented"

      - from: "payment_status=UNPAID"
        to: "payment_status=DEPOSIT_HELD"
        trigger: "POST /orders/{id}/pay { mode: DEPOSIT }"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status == RESERVED"
          - "Order has attached EventBooking OR attached RentalContract"
        side_effects:
          - "Order.version incremented"

      - from: "payment_status IN {UNPAID, DEPOSIT_HELD}"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/pay { mode: FULL }"
        actor: StoreClerk
        preconditions:
          - "Order.fulfillment_status IN {RESERVED, PICKING, READY_FOR_PICKUP}"
        side_effects:
          - "Order.version incremented"

  - entity: CustomPrintOrder
    initial_state: DRAFT
    terminal_states: [READY, CANCELLED]
    note: "Cyclic state machine — PROOF_SENT <-> REVISION_REQUESTED loop until APPROVED."
    transitions:
      - from: DRAFT
        to: PROOF_SENT
        trigger: "POST /custom-print-orders/{id}/send-proof"
        actor: StoreClerk
        preconditions:
          - "CustomPrintOrder.status == DRAFT"
          - "CustomPrintOrder.art_reference is not null"
        side_effects:
          - "CustomPrintOrder.version incremented"

      - from: PROOF_SENT
        to: REVISION_REQUESTED
        trigger: "POST /custom-print-orders/{id}/request-revision"
        actor: Customer
        preconditions:
          - "CustomPrintOrder.status == PROOF_SENT"
          - "CustomPrintOrder.revision_count < 3"
        side_effects:
          - "CustomPrintOrder.revision_count += 1"
          - "CustomPrintOrder.version incremented"

      - from: REVISION_REQUESTED
        to: PROOF_SENT
        trigger: "POST /custom-print-orders/{id}/send-proof"
        actor: StoreClerk
        preconditions:
          - "CustomPrintOrder.status == REVISION_REQUESTED"
        side_effects:
          - "CustomPrintOrder.version incremented"

      - from: PROOF_SENT
        to: APPROVED
        trigger: "POST /custom-print-orders/{id}/approve"
        actor: Customer
        preconditions:
          - "CustomPrintOrder.status == PROOF_SENT"
          - "Order.payment_status == PAID (parent Order for this CustomPrintOrder must be paid)"
        side_effects:
          - "CustomPrintOrder.print_fee_cents pinned by tiered_pricing over banner_length_ft (cascade depth 1 -> Order.subtotal_cents recomputed) (cascade depth 2 -> Order.grand_total_cents recomputed)"
          - "CustomPrintOrder.version incremented"

      - from: APPROVED
        to: PRINTING
        trigger: "POST /custom-print-orders/{id}/start-print"
        actor: StoreClerk
        preconditions:
          - "CustomPrintOrder.status == APPROVED"
        side_effects:
          - "CustomPrintOrder.version incremented"

      - from: PRINTING
        to: READY
        trigger: "POST /custom-print-orders/{id}/mark-ready"
        actor: StoreClerk
        preconditions:
          - "CustomPrintOrder.status == PRINTING"
        side_effects:
          - "CustomPrintOrder.version incremented"

      - from: "IN {DRAFT, PROOF_SENT, REVISION_REQUESTED}"
        to: CANCELLED
        trigger: "POST /custom-print-orders/{id}/cancel"
        actor: StoreClerk
        preconditions:
          - "CustomPrintOrder.status IN {DRAFT, PROOF_SENT, REVISION_REQUESTED}"
        side_effects:
          - "CustomPrintOrder.version incremented"

  - entity: EventBooking
    initial_state: HELD
    terminal_states: [COMPLETED, CANCELLED, FORFEITED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /event-bookings/{id}/confirm"
        actor: StoreClerk
        preconditions:
          - "EventBooking.status == HELD"
          - "Order.payment_status IN {DEPOSIT_HELD, PAID} (guard on cross-entity Order state)"
          - "(EventBooking.event_date - server clock) >= EventPackage.min_lead_days"
        side_effects:
          - "EventBooking.version incremented"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /event-bookings/{id}/complete"
        actor: StoreClerk
        preconditions:
          - "EventBooking.status == CONFIRMED"
          - "server clock >= EventBooking.event_date"
        side_effects:
          - "Order.payment_status flips DEPOSIT_HELD -> PAID (guard: only if not already PAID)"
          - "EventBooking.version incremented"

      - from: "IN {HELD, CONFIRMED}"
        to: CANCELLED
        trigger: "POST /event-bookings/{id}/cancel"
        actor: StoreClerk
        preconditions:
          - "EventBooking.status IN {HELD, CONFIRMED}"
          - "(EventBooking.event_date - server clock) >= 7 days"
        side_effects:
          - "Customer.store_credit_cents += EventBooking.deposit_cents (compensating invariant: money)"
          - "Order.payment_status flips DEPOSIT_HELD -> REFUNDED"
          - "EventBooking.version incremented"

      - from: "IN {HELD, CONFIRMED}"
        to: FORFEITED
        trigger: "system event: clock advance past (event_date - 7 days) with no confirm/complete"
        actor: system
        preconditions:
          - "EventBooking.status IN {HELD, CONFIRMED}"
          - "(EventBooking.event_date - server clock) < 7 days AND EventBooking.status != COMPLETED"
        side_effects:
          - "EventBooking.deposit_cents is NOT refunded (compensating invariant intentionally NOT satisfied — this is forfeiture)"
          - "EventBooking.version incremented"

  - entity: RentalContract
    initial_state: RESERVED
    terminal_states: [RETURNED, LATE_RETURN, DAMAGED]
    transitions:
      - from: RESERVED
        to: PICKED_UP
        trigger: "system event: parent Order transitions READY_FOR_PICKUP -> PICKED_UP"
        actor: system
        preconditions:
          - "RentalContract.status == RESERVED"
          - "parent Order.fulfillment_status just became PICKED_UP"
        side_effects:
          - "RentalContract.version incremented"

      - from: PICKED_UP
        to: RETURNED
        trigger: "POST /rental-contracts/{id}/return"
        actor: StoreClerk
        preconditions:
          - "RentalContract.status == PICKED_UP"
          - "server clock < RentalContract.rental_end"
        side_effects:
          - "RentalContract.returned_at set to server clock"
          - "Sku.on_hand_qty += RentalContract.qty (compensating invariant: SKU stock)"
          - "Customer.store_credit_cents += RentalContract.deposit_cents (compensating invariant: money)"
          - "RentalContract.version incremented"

      - from: PICKED_UP
        to: LATE_RETURN
        trigger: "POST /rental-contracts/{id}/return"
        actor: StoreClerk
        preconditions:
          - "RentalContract.status == PICKED_UP"
          - "server clock >= RentalContract.rental_end"
        side_effects:
          - "RentalContract.returned_at set to server clock"
          - "Sku.on_hand_qty += RentalContract.qty"
          - "RentalContract.deposit is FORFEITED (Customer.store_credit_cents unchanged; late fee = full deposit)"
          - "RentalContract.version incremented"

      - from: PICKED_UP
        to: DAMAGED
        trigger: "POST /rental-contracts/{id}/mark-damaged"
        actor: StoreClerk
        preconditions:
          - "RentalContract.status == PICKED_UP"
        side_effects:
          - "RentalContract.deposit is FORFEITED"
          - "RentalContract.version incremented"

  - entity: Sku
    initial_state: "is_clearance=false"
    terminal_states: []
    transitions:
      - from: "is_clearance=false"
        to: "is_clearance=true"
        trigger: "POST /skus/{id}/clearance { pct: 0..1 }"
        actor: StoreManager
        preconditions:
          - "Sku.is_clearance == false"
          - "0 < pct <= 0.9"
        side_effects:
          - "Sku.is_clearance = true"
          - "Sku.clearance_pct = pct"
          - "Sku.version incremented"

      - from: "is_clearance=true"
        to: "is_clearance=false"
        trigger: "POST /skus/{id}/unclear"
        actor: StoreManager
        preconditions:
          - "Sku.is_clearance == true"
        side_effects:
          - "Sku.is_clearance = false"
          - "Sku.clearance_pct = 0"
          - "Sku.version incremented"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — narrow, OCC only
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reserve-order-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/reserve"
    occ_field: "expected_order_version"
    description: |
      Reserving an Order whose version has advanced since the client last
      observed it (e.g. another writer edited the OrderLines or cancelled the
      Order in the meantime) is rejected. Two strictly sequential requests:
      the second still carrying the pre-mutation version deterministically
      fails with 412 stale-version, without any assumption about parallelism.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: clearance-sku-stale-sku
    parent_entity: Sku
    write_endpoint: "POST /skus/{id}/clearance"
    occ_field: "expected_sku_version"
    description: |
      Applying clearance to a Sku whose version has advanced since the
      client last observed it (e.g. price change or unclear) is rejected —
      the client's clearance_pct was chosen against a stale unit_price.
    error_id: ERR_STALE_SKU_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculations
# ---------------------------------------------------------------------------
calculations:
  - name: order_grand_total
    trigger: "Order transitions DRAFT -> RESERVED; recomputed on any OrderLine/HeliumOrder/RentalContract/CustomPrintOrder/EventBooking cost change while Order.fulfillment_status IN {RESERVED, PICKING, READY_FOR_PICKUP}"
    algorithm: aggregation
    formula: |
      # Per-line rounding is PINNED: round each line, then sum.
      subtotal_cents = sum(
        round_half_up(qty * unit_price_cents_at_capture)  # already integer here
        for line in OrderLines
      )
      helium_fee_cents = HeliumOrder.fill_fee_cents if attached else 0
      delivery_fee_cents = calc(delivery_fee) if DeliverySlot attached else 0
      # Deposit is the sum of RentalContract.deposit_cents plus EventBooking.deposit_cents
      deposit_cents = sum(rc.deposit_cents for rc in RentalContracts) + (EventBooking.deposit_cents if attached else 0)
      # Custom print add-on
      subtotal_cents += CustomPrintOrder.print_fee_cents if attached else 0
      grand_total_cents = subtotal_cents + helium_fee_cents + delivery_fee_cents + deposit_cents
    input_set: "Every OrderLine belonging to this Order (any status); the single HeliumOrder if present; the single DeliverySlot if channel==DELIVERY; every RentalContract with status IN {RESERVED, PICKED_UP}; EventBooking with status IN {HELD, CONFIRMED} if attached; CustomPrintOrder with status != CANCELLED if attached."
    constants:
      ROUNDING_MODE: "round_half_up"
      LINE_ROUNDING_ORDER: "per_line_then_sum"
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional_at_draft
        when: "Order.fulfillment_status == DRAFT (before RESERVED transition)"
        difference: |
          Uses live Sku.unit_price_cents (no clearance snapshot lock),
          excludes HeliumOrder/DeliverySlot/RentalContract deposits — for
          quoting only. Grand total in DRAFT can DIFFER from grand total in
          RESERVED for identical entity state whenever any Sku is later put on
          clearance or the customer attaches a helium/delivery/rental add-on
          between DRAFT and RESERVED.
      - name: finalized_at_reserved
        when: "Order.fulfillment_status IN {RESERVED, PICKING, READY_FOR_PICKUP, PICKED_UP, DELIVERED, RETURNED}"
        difference: |
          Locks unit_price_cents_at_capture with clearance applied at the moment
          of reservation; adds helium/delivery/deposit components. Value is
          IMMUTABLE once RESERVED — post-reserve clearance changes to the SKU
          do not mutate the Order.

  - name: helium_fill_fee
    trigger: "HeliumOrder attached at Order RESERVED transition"
    algorithm: tiered_pricing
    formula: |
      # PER-LINE ROUNDING ORDER (pinned): round each balloon-line to whole cents,
      # then sum. Reversing this order changes the total by 1-2 cents for boundary
      # inputs — this is the combinatorial-formula (b) rounding-order case.
      LATEX_RATE_CENTS = 175
      FOIL_RATE_CENTS = 425
      # Bulk discount tier: >= 25 latex → 15% off latex line only
      latex_line_cents = round_half_up(
        latex_count * LATEX_RATE_CENTS * (0.85 if latex_count >= 25 else 1.0)
      )
      foil_line_cents = round_half_up(
        foil_count * FOIL_RATE_CENTS * (0.90 if foil_count >= 10 else 1.0)
      )
      fill_fee_cents = latex_line_cents + foil_line_cents
    input_set: "HeliumOrder.latex_count and HeliumOrder.foil_count captured at Order RESERVED."
    constants:
      LATEX_RATE_CENTS: 175
      FOIL_RATE_CENTS: 425
      LATEX_BULK_TIER: 25
      LATEX_BULK_DISCOUNT: 0.15
      FOIL_BULK_TIER: 10
      FOIL_BULK_DISCOUNT: 0.10
    precision: "0 decimal places (integer cents), round_half_up"

  - name: helium_tank_waterfall_allocation
    trigger: "HeliumOrder created and attached at Order RESERVED transition"
    algorithm: waterfall_allocation
    formula: |
      # Compute required cubic feet: latex 0.5 cu.ft/unit, foil 1.5 cu.ft/unit.
      required = latex_count * 0.5 + foil_count * 1.5
      # ORDER-SENSITIVE: draw from HeliumTanks with status==ACTIVE, sorted by
      # created_at ASC (oldest tank first). Tie-break on created_at is by
      # tank_code ASC (never by id). Fill the current tank until remaining==0,
      # then move to the next. If total remaining across all ACTIVE tanks <
      # required → reject with ERR_HELIUM_INSUFFICIENT.
      allocations = []
      for tank in HeliumTank.filter(status=ACTIVE).order_by(created_at, tank_code):
          take = min(tank.remaining_cubic_ft, required - sum(allocations))
          if take > 0:
              allocations.append((tank.id, take))
      HeliumOrder.helium_tank_ids = [t for (t, _) in allocations]
    input_set: "All HeliumTank rows with status==ACTIVE at reservation time."
    constants:
      LATEX_CU_FT_PER_UNIT: 0.5
      FOIL_CU_FT_PER_UNIT: 1.5

  - name: delivery_fee
    trigger: "DeliverySlot attached at Order RESERVED transition"
    algorithm: threshold
    formula: |
      # Non-linear: base fee + optional setup + weekend surcharge.
      BASE_FEE_CENTS = 2500
      SETUP_FEE_CENTS = 1500
      WEEKEND_SURCHARGE_CENTS = 1000
      # Weekday of window_start (UTC) in {Sat, Sun} → weekend
      is_weekend = window_start.weekday() in (5, 6)
      delivery_fee_cents = BASE_FEE_CENTS \
        + (SETUP_FEE_CENTS if setup_included else 0) \
        + (WEEKEND_SURCHARGE_CENTS if is_weekend else 0)
    input_set: "The single DeliverySlot referenced by the Order."
    constants:
      BASE_FEE_CENTS: 2500
      SETUP_FEE_CENTS: 1500
      WEEKEND_SURCHARGE_CENTS: 1000

  - name: rental_deposit
    trigger: "RentalContract created and attached to an Order at RESERVED"
    algorithm: aggregation
    formula: |
      # Deposit is a fixed 200% of unit price times quantity.
      # This is a DIFFERENT combinatorial subject than helium — nested min/max
      # branches on cross-entity state.
      DEPOSIT_MULT = 2.0
      # If Sku.is_clearance → deposit uses UNDISCOUNTED price
      unit = Sku.unit_price_cents  # NOT the clearance price
      per_unit_deposit_cents = round_half_up(unit * DEPOSIT_MULT)
      deposit_cents = per_unit_deposit_cents * qty
    input_set: "The Sku referenced by RentalContract; ignores clearance discount for deposit purposes."
    constants:
      DEPOSIT_MULT: 2.0
    precision: "0 decimal places (integer cents), round_half_up"

  - name: custom_print_fee
    trigger: "CustomPrintOrder transitions PROOF_SENT -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      # Tiered by banner_length_ft; MARGINAL rate (each foot in its tier).
      # PINNED evaluation order:
      #   1) compute per-tier feet (span_1, span_2, span_3);
      #   2) span_i * rate_i, no per-tier rounding;
      #   3) sum, then round_half_up ONCE at the end.
      #   This is the "sum then round" mode, different from helium_fill_fee's
      #   "round then sum" mode.
      TIER_1_END_FT = 5
      TIER_2_END_FT = 15
      RATE_1_CENTS_PER_FT = 800   # 1..5 ft
      RATE_2_CENTS_PER_FT = 600   # 6..15 ft
      RATE_3_CENTS_PER_FT = 450   # 16+ ft
      ft = banner_length_ft
      span_1 = min(ft, TIER_1_END_FT)
      span_2 = max(0, min(ft, TIER_2_END_FT) - TIER_1_END_FT)
      span_3 = max(0, ft - TIER_2_END_FT)
      unrounded = span_1 * RATE_1_CENTS_PER_FT \
                + span_2 * RATE_2_CENTS_PER_FT \
                + span_3 * RATE_3_CENTS_PER_FT
      # Revision surcharge — 500 cents per revision beyond 1
      unrounded += max(0, revision_count - 1) * 500
      print_fee_cents = round_half_up(unrounded)
    input_set: "CustomPrintOrder.banner_length_ft and revision_count captured at APPROVE."
    constants:
      TIER_1_END_FT: 5
      TIER_2_END_FT: 15
      RATE_1_CENTS_PER_FT: 800
      RATE_2_CENTS_PER_FT: 600
      RATE_3_CENTS_PER_FT: 450
      REVISION_SURCHARGE_CENTS: 500
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: estimated_at_proof_send
        when: "CustomPrintOrder.status == PROOF_SENT (first proof, before any revision)"
        difference: |
          Uses revision_count=0 for surcharge calc (the client sees the fee
          they WOULD pay if they approve on the first proof). Displayed but
          not persisted into Order.subtotal_cents.
      - name: finalized_at_approve
        when: "CustomPrintOrder transitions PROOF_SENT -> APPROVED"
        difference: |
          Uses actual revision_count observed at approve time. For a
          10-foot banner approved after two REVISION_REQUESTED cycles,
          the finalized fee EXCEEDS the estimated fee by 500 cents per
          revision beyond the first — different results for identical
          banner_length_ft inputs whenever revisions accumulate. This is
          the value pinned into CustomPrintOrder.print_fee_cents and
          cascaded into Order.subtotal_cents / Order.grand_total_cents.

  - name: event_deposit
    trigger: "EventBooking created"
    algorithm: threshold
    formula: |
      deposit_cents = round_half_up(EventPackage.base_price_cents * EventPackage.deposit_pct)
    input_set: "The EventPackage referenced at booking time."
    precision: "0 decimal places (integer cents), round_half_up"

  - name: sku_reservation_balance
    trigger: "Order RESERVED, cancellation, pickup, or return transitions"
    algorithm: aggregation
    formula: |
      # Denormalized reserved_qty MUST reconcile with the source of truth:
      # for each Sku:
      #   reserved_qty == sum(qty for OrderLine where
      #                        Order.fulfillment_status IN {RESERVED, PICKING, READY_FOR_PICKUP}
      #                        AND OrderLine.sku_id == sku.id)
      #                 + sum(BundleLine.qty * OrderLine.qty for OrderLine where
      #                        Order.fulfillment_status IN {RESERVED, PICKING, READY_FOR_PICKUP}
      #                        AND OrderLine.bundle_id == some Bundle whose lines include this sku)
      #                 + sum(qty for RentalContract where status==RESERVED AND sku_id == sku.id)
    input_set: "All OrderLines in non-terminal Orders + all active RentalContracts."

  - name: overlap_returns_within_14_days
    trigger: "POST /orders/{id}/return"
    algorithm: aggregation
    formula: |
      # Return eligibility: pickup timestamp + 14 days is the deadline.
      # Uses Order.updated_at at the PICKED_UP transition (a system-stamped
      # timestamp captured on that transition); NEVER uses Order.id or any
      # random property.
      # BOUNDARY: server clock <= (pickup_at + 14 * 86400 seconds) — half-open on the right.

# ---------------------------------------------------------------------------
# §1.4 Validation Rules (priority-ordered)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is a declared role in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "X-User-Role is permitted by the endpoint's §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path-referenced resource exists (Order, Sku, Bundle, RentalContract, CustomPrintOrder, EventBooking, DeliverySlot, HeliumTank, Customer)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with path templating

  - priority: 5
    category: existence
    check: "Body-referenced foreign keys exist (customer_id, sku_id, bundle_id, event_package_id, order_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: all POST/PUT/PATCH endpoints that reference other entities

  - priority: 6
    category: state
    check: "Target entity's state machine permits the requested transition (from-state matches transition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version (per §1.2.1)"
    error_id: ERR_STALE_ORDER_VERSION  # or ERR_STALE_SKU_VERSION per endpoint
    http_status: 412
    applies_to: "POST /orders/{id}/reserve, POST /skus/{id}/clearance"

  - priority: 8
    category: business_safety
    check: "Clearance items cannot be returned (Sku.is_clearance == true blocks POST /orders/{id}/return)"
    error_id: ERR_CLEARANCE_NON_RETURNABLE
    http_status: 422
    applies_to: "POST /orders/{id}/return"

  - priority: 9
    category: business_referential
    check: "RentalContract.sku_id MUST reference a Sku with category == TABLEWARE"
    error_id: ERR_RENTAL_CATEGORY_INVALID
    http_status: 422
    applies_to: "POST /rental-contracts"

  - priority: 10
    category: business_temporal
    check: "For every OrderLine.sku with seasonal_window_* set: server clock is within [seasonal_window_start, seasonal_window_end] at RESERVED"
    error_id: ERR_SEASONAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /orders/{id}/reserve"

  - priority: 11
    category: business_temporal
    check: "EventBooking: (event_date - server clock) >= EventPackage.min_lead_days at confirm"
    error_id: ERR_EVENT_LEAD_TOO_SHORT
    http_status: 422
    applies_to: "POST /event-bookings/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "DeliverySlot [window_start, window_end) MUST NOT overlap another slot's [window_start, window_end) on the same van_id (half-open interval)."
    error_id: ERR_DELIVERY_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-slots"

  - priority: 13
    category: business_temporal
    check: "RentalContract [rental_start, rental_end) MUST NOT overlap any other non-terminal RentalContract on the same sku_id such that concurrent reserved qty exceeds Sku.on_hand_qty (aggregate-capacity variant of overlap check)."
    error_id: ERR_RENTAL_OVERLAP_CAPACITY
    http_status: 409
    applies_to: "POST /rental-contracts"

  - priority: 14
    category: business_constraint
    check: "For every OrderLine at RESERVED: Sku.on_hand_qty - Sku.reserved_qty >= OrderLine.qty (aggregate over all lines)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /orders/{id}/reserve"

  - priority: 15
    category: business_constraint
    check: "HeliumOrder required_cubic_ft <= sum(HeliumTank.remaining_cubic_ft where status==ACTIVE)"
    error_id: ERR_HELIUM_INSUFFICIENT
    http_status: 422
    applies_to: "POST /orders/{id}/reserve"

  - priority: 16
    category: business_constraint
    check: "CustomPrintOrder: revision_count < 3 for REVISION_REQUESTED"
    error_id: ERR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /custom-print-orders/{id}/request-revision"

  - priority: 17
    category: business_fiscal
    check: "Clearance discount pct in (0, 0.9]"
    error_id: ERR_CLEARANCE_PCT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /skus/{id}/clearance"

  - priority: 18
    category: business_fiscal
    check: "Deposit payment (mode=DEPOSIT) requires attached EventBooking or RentalContract"
    error_id: ERR_DEPOSIT_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /orders/{id}/pay"

  - priority: 19
    category: business_constraint
    check: "Missing required input field per §1.5 endpoint.input"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PUT/PATCH endpoints

# ---------------------------------------------------------------------------
# §1.5 Endpoints
# ---------------------------------------------------------------------------
endpoints:
  # ---- Sku ------------------------------------------------------------
  - method: POST
    path: "/api/skus"
    description: "Create a SKU."
    roles: [StoreManager]
    code: 201
    input: [sku_code, category, unit_price_cents, "theme_tag?", "seasonal_window_start?", "seasonal_window_end?"]
    output: Sku
    side_effects: ["Sku row created with is_clearance=false, clearance_pct=0"]

  - method: GET
    path: "/api/skus/{id}"
    description: "Get a SKU."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Sku
    side_effects: []

  - method: GET
    path: "/api/skus"
    description: "List SKUs; supports theme_tag filter."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["theme_tag?", "category?", "limit?", "offset?"]
    output: Sku[]
    side_effects: []

  - method: POST
    path: "/api/skus/{id}/clearance"
    description: "Mark SKU as clearance with pct discount. OCC-guarded on Sku.version."
    roles: [StoreManager]
    code: 200
    input: [pct, expected_sku_version]
    output: Sku
    side_effects: ["Sku.is_clearance=true; Sku.clearance_pct=pct; Sku.version increments by 1"]

  - method: POST
    path: "/api/skus/{id}/unclear"
    description: "Remove clearance flag from SKU."
    roles: [StoreManager]
    code: 200
    input: []
    output: Sku
    side_effects: ["Sku.is_clearance=false; Sku.clearance_pct=0; Sku.version increments by 1"]

  - method: POST
    path: "/api/skus/{id}/restock"
    description: "Increase on_hand_qty by delta (business-endpoint for inventory receiving)."
    roles: [StoreManager]
    code: 200
    input: [delta]
    output: Sku
    side_effects: ["Sku.on_hand_qty += delta; Sku.version increments"]

  # ---- Bundle --------------------------------------------------------
  - method: POST
    path: "/api/bundles"
    description: "Create a Bundle (with lines)."
    roles: [StoreManager]
    code: 201
    input: [bundle_code, theme_tag, bundle_price_cents, lines]
    output: Bundle
    side_effects: ["Bundle row + BundleLine rows created"]

  - method: GET
    path: "/api/bundles/{id}"
    description: "Get a Bundle (does NOT include lines — use /bundles/{id}/lines)."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Bundle
    side_effects: []

  - method: GET
    path: "/api/bundles/{id}/lines"
    description: "List BundleLines for a Bundle (FK reverse-reachability for BundleLine.bundle_id)."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: BundleLine[]
    side_effects: []

  - method: GET
    path: "/api/bundle-lines"
    description: "List BundleLines with optional filters (FK reverse-reachability for BundleLine.sku_id)."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["sku_id?", "bundle_id?", "limit?", "offset?"]
    output: BundleLine[]
    side_effects: []

  - method: GET
    path: "/api/bundle-lines/{id}"
    description: "Get a single BundleLine (single-resource GET; needed for reverse-reachability collection-segment inference)."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: BundleLine
    side_effects: []

  # ---- Customer ------------------------------------------------------
  - method: POST
    path: "/api/customers"
    description: "Create a Customer."
    roles: [StoreClerk]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["Customer created with store_credit_cents=0"]

  - method: GET
    path: "/api/customers/{id}"
    description: "Get a Customer."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- Order ---------------------------------------------------------
  - method: POST
    path: "/api/orders"
    description: "Create Order in DRAFT with lines."
    roles: [StoreClerk]
    code: 201
    input: [customer_id, channel, lines, "pickup_window_start?", "pickup_window_end?", "delivery_slot_id?"]
    output: Order
    side_effects: ["Order row + OrderLine rows created; fulfillment_status=DRAFT, payment_status=UNPAID"]

  - method: GET
    path: "/api/orders/{id}"
    description: "Get an Order."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/api/orders"
    description: "List Orders with optional customer_id filter (FK reverse-reachability for Order.customer_id)."
    roles: [StoreClerk, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/api/orders/{id}/lines"
    description: "List OrderLines (FK reverse-reachability for OrderLine.order_id)."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/api/order-lines"
    description: "List OrderLines with filters (FK reverse-reachability for OrderLine.sku_id and OrderLine.bundle_id)."
    roles: [StoreClerk, Customer]
    code: 200
    input: ["sku_id?", "bundle_id?", "order_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/api/order-lines/{id}"
    description: "Get a single OrderLine (single-resource GET; needed for reverse-reachability collection-segment inference)."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: POST
    path: "/api/orders/{id}/reserve"
    description: "Transition Order fulfillment_status DRAFT -> RESERVED. OCC-guarded on Order.version. Pins prices, allocates stock and helium, reserves DeliverySlot."
    roles: [StoreClerk]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "Sku.reserved_qty += line qty per OrderLine"
      - "HeliumTank.remaining_cubic_ft debited waterfall by created_at ASC"
      - "DeliverySlot.status: AVAILABLE -> RESERVED"
      - "OrderLine.unit_price_cents_at_capture pinned"
      - "Order.subtotal_cents, helium_fee_cents, delivery_fee_cents, deposit_cents, grand_total_cents recomputed"
      - "Order.pickup_deadline = pickup_window_end + 48h (BOPIS only)"
      - "Order.version increments by 1"

  - method: POST
    path: "/api/orders/{id}/pay"
    description: "Record a payment. mode ∈ {DEPOSIT, FULL}."
    roles: [StoreClerk]
    code: 200
    input: [mode]
    output: Order
    side_effects: ["Order.payment_status advances per parallel state machine; Order.version increments"]

  - method: POST
    path: "/api/orders/{id}/start-picking"
    description: "Order fulfillment_status RESERVED -> PICKING."
    roles: [StoreClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.version increments"]

  - method: POST
    path: "/api/orders/{id}/mark-ready"
    description: "Order fulfillment_status PICKING -> READY_FOR_PICKUP (BOPIS only)."
    roles: [StoreClerk]
    code: 200
    input: []
    output: Order
    side_effects: ["Order.version increments"]

  - method: POST
    path: "/api/orders/{id}/pickup"
    description: "Order fulfillment_status READY_FOR_PICKUP -> PICKED_UP. Cascade: RentalContract RESERVED -> PICKED_UP."
    roles: [StoreClerk]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Sku.on_hand_qty -= qty; Sku.reserved_qty -= qty per OrderLine"
      - "RentalContract.status: RESERVED -> PICKED_UP"
      - "Order.version increments"

  - method: POST
    path: "/api/orders/{id}/deliver"
    description: "Order fulfillment_status PICKED_UP -> DELIVERED (DELIVERY channel only)."
    roles: [DeliveryDriver]
    code: 200
    input: []
    output: Order
    side_effects: ["DeliverySlot.status: RESERVED -> COMPLETED; Order.version increments"]

  - method: POST
    path: "/api/orders/{id}/return"
    description: "Order fulfillment_status PICKED_UP/DELIVERED -> RETURNED."
    roles: [StoreClerk]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Sku.on_hand_qty += line qty per OrderLine"
      - "Order.payment_status -> REFUNDED"
      - "Customer.store_credit_cents += Order.grand_total_cents (if refund_channel=STORE_CREDIT)"
      - "Order.version increments"

  - method: POST
    path: "/api/orders/{id}/cancel"
    description: "Cancel Order from DRAFT/RESERVED/PICKING."
    roles: [StoreClerk]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Sku.reserved_qty released; HeliumTank refunded; DeliverySlot -> CANCELLED"
      - "Order.payment_status: DEPOSIT_HELD -> REFUNDED (if any deposit held)"
      - "Order.version increments"

  # ---- HeliumOrder ---------------------------------------------------
  - method: POST
    path: "/api/orders/{id}/helium"
    description: "Attach a HeliumOrder to a DRAFT Order."
    roles: [StoreClerk]
    code: 201
    input: [latex_count, foil_count]
    output: HeliumOrder
    side_effects: ["HeliumOrder row created; NO tank debit until Order RESERVED"]

  - method: GET
    path: "/api/orders/{id}/helium"
    description: "Get the HeliumOrder for an Order (FK reverse-reachability for HeliumOrder.order_id)."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: HeliumOrder[]
    side_effects: []

  # ---- HeliumTank ----------------------------------------------------
  - method: POST
    path: "/api/helium-tanks"
    description: "Create a HeliumTank (initial capacity, status=ACTIVE, remaining=capacity)."
    roles: [StoreManager]
    code: 201
    input: [tank_code, capacity_cubic_ft]
    output: HeliumTank
    side_effects: ["HeliumTank row created; remaining_cubic_ft=capacity_cubic_ft; status=ACTIVE"]

  - method: GET
    path: "/api/helium-tanks/{id}"
    description: "Get a HeliumTank."
    roles: [StoreManager, StoreClerk]
    code: 200
    input: []
    output: HeliumTank
    side_effects: []

  - method: GET
    path: "/api/helium-tanks"
    description: "List HeliumTanks."
    roles: [StoreManager, StoreClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HeliumTank[]
    side_effects: []

  # ---- DeliverySlot --------------------------------------------------
  - method: POST
    path: "/api/delivery-slots"
    description: "Create a DeliverySlot (AVAILABLE); overlap check per van_id."
    roles: [StoreClerk]
    code: 201
    input: [window_start, window_end, van_id, "setup_included?"]
    output: DeliverySlot
    side_effects: ["DeliverySlot row created with status=AVAILABLE"]

  - method: GET
    path: "/api/delivery-slots/{id}"
    description: "Get a DeliverySlot."
    roles: [StoreClerk]
    code: 200
    input: []
    output: DeliverySlot
    side_effects: []

  - method: GET
    path: "/api/delivery-slots"
    description: "List DeliverySlots with optional order_id filter (FK reverse-reachability for DeliverySlot.order_id)."
    roles: [StoreClerk]
    code: 200
    input: ["order_id?", "van_id?", "status?", "limit?", "offset?"]
    output: DeliverySlot[]
    side_effects: []

  # ---- RentalContract ------------------------------------------------
  - method: POST
    path: "/api/rental-contracts"
    description: "Create a RentalContract attached to an Order (rental add-on for tableware SKUs)."
    roles: [StoreClerk]
    code: 201
    input: [order_id, sku_id, qty, rental_start, rental_end]
    output: RentalContract
    side_effects:
      - "RentalContract row created with status=RESERVED"
      - "RentalContract.deposit_cents pinned by calc `rental_deposit`"

  - method: GET
    path: "/api/rental-contracts/{id}"
    description: "Get a RentalContract."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: RentalContract
    side_effects: []

  - method: GET
    path: "/api/rental-contracts"
    description: "List RentalContracts with optional order_id / sku_id filter (FK reverse-reachability)."
    roles: [StoreClerk, Customer]
    code: 200
    input: ["order_id?", "sku_id?", "status?", "limit?", "offset?"]
    output: RentalContract[]
    side_effects: []

  - method: POST
    path: "/api/rental-contracts/{id}/return"
    description: "Return a rental — transitions PICKED_UP -> RETURNED or LATE_RETURN based on server clock vs rental_end."
    roles: [StoreClerk]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "RentalContract.returned_at set to server clock"
      - "Sku.on_hand_qty += RentalContract.qty"
      - "If on-time: Customer.store_credit_cents += RentalContract.deposit_cents"

  - method: POST
    path: "/api/rental-contracts/{id}/mark-damaged"
    description: "Mark a rental as damaged; forfeits deposit."
    roles: [StoreClerk]
    code: 200
    input: []
    output: RentalContract
    side_effects: ["RentalContract.status=DAMAGED; deposit forfeited"]

  # ---- CustomPrintOrder ----------------------------------------------
  - method: POST
    path: "/api/orders/{id}/custom-print"
    description: "Attach a CustomPrintOrder to a DRAFT Order."
    roles: [StoreClerk]
    code: 201
    input: [art_reference, banner_length_ft]
    output: CustomPrintOrder
    side_effects: ["CustomPrintOrder row created with status=DRAFT, revision_count=0"]

  - method: GET
    path: "/api/custom-print-orders/{id}"
    description: "Get a CustomPrintOrder."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects: []

  - method: GET
    path: "/api/custom-print-orders"
    description: "List CustomPrintOrders with optional order_id filter (FK reverse-reachability for CustomPrintOrder.order_id)."
    roles: [StoreClerk, Customer]
    code: 200
    input: ["order_id?", "status?", "limit?", "offset?"]
    output: CustomPrintOrder[]
    side_effects: []

  - method: POST
    path: "/api/custom-print-orders/{id}/send-proof"
    description: "Send a proof (DRAFT/REVISION_REQUESTED -> PROOF_SENT)."
    roles: [StoreClerk]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects: ["CustomPrintOrder.version increments"]

  - method: POST
    path: "/api/custom-print-orders/{id}/request-revision"
    description: "Customer requests revision (PROOF_SENT -> REVISION_REQUESTED). Cyclic."
    roles: [Customer]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects: ["CustomPrintOrder.revision_count += 1; version increments"]

  - method: POST
    path: "/api/custom-print-orders/{id}/approve"
    description: "Customer approves the proof (PROOF_SENT -> APPROVED); pins print_fee via tiered pricing, cascades into Order totals."
    roles: [Customer]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects:
      - "CustomPrintOrder.print_fee_cents pinned"
      - "Order.subtotal_cents recomputed (cascade depth 1)"
      - "Order.grand_total_cents recomputed (cascade depth 2)"
      - "CustomPrintOrder.version increments"

  - method: POST
    path: "/api/custom-print-orders/{id}/start-print"
    description: "APPROVED -> PRINTING."
    roles: [StoreClerk]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects: ["CustomPrintOrder.version increments"]

  - method: POST
    path: "/api/custom-print-orders/{id}/mark-ready"
    description: "PRINTING -> READY."
    roles: [StoreClerk]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects: ["CustomPrintOrder.version increments"]

  - method: POST
    path: "/api/custom-print-orders/{id}/cancel"
    description: "Cancel a CustomPrintOrder."
    roles: [StoreClerk]
    code: 200
    input: []
    output: CustomPrintOrder
    side_effects: ["CustomPrintOrder.version increments"]

  # ---- EventPackage / EventBooking -----------------------------------
  - method: POST
    path: "/api/event-packages"
    description: "Create an EventPackage."
    roles: [StoreManager]
    code: 201
    input: [package_code, base_price_cents, deposit_pct, min_lead_days]
    output: EventPackage
    side_effects: ["EventPackage row created"]

  - method: GET
    path: "/api/event-packages/{id}"
    description: "Get an EventPackage."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: []
    output: EventPackage
    side_effects: []

  - method: GET
    path: "/api/event-packages"
    description: "List EventPackages."
    roles: [StoreManager, StoreClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: EventPackage[]
    side_effects: []

  - method: POST
    path: "/api/event-bookings"
    description: "Create an EventBooking attached to an Order."
    roles: [StoreClerk]
    code: 201
    input: [order_id, event_package_id, event_date]
    output: EventBooking
    side_effects: ["EventBooking row created with status=HELD; deposit_cents pinned"]

  - method: GET
    path: "/api/event-bookings/{id}"
    description: "Get an EventBooking."
    roles: [StoreClerk, Customer]
    code: 200
    input: []
    output: EventBooking
    side_effects: []

  - method: GET
    path: "/api/event-bookings"
    description: "List EventBookings with optional filters (FK reverse-reachability for EventBooking.order_id and EventBooking.event_package_id)."
    roles: [StoreClerk, Customer]
    code: 200
    input: ["order_id?", "event_package_id?", "status?", "limit?", "offset?"]
    output: EventBooking[]
    side_effects: []

  - method: POST
    path: "/api/event-bookings/{id}/confirm"
    description: "HELD -> CONFIRMED; requires payment_status IN {DEPOSIT_HELD, PAID} on parent Order."
    roles: [StoreClerk]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["EventBooking.version increments"]

  - method: POST
    path: "/api/event-bookings/{id}/complete"
    description: "CONFIRMED -> COMPLETED."
    roles: [StoreClerk]
    code: 200
    input: []
    output: EventBooking
    side_effects: ["Order.payment_status: DEPOSIT_HELD -> PAID (if applicable); EventBooking.version increments"]

  - method: POST
    path: "/api/event-bookings/{id}/cancel"
    description: "Cancel with >= 7 days lead — refunds deposit as store credit."
    roles: [StoreClerk]
    code: 200
    input: []
    output: EventBooking
    side_effects:
      - "Customer.store_credit_cents += EventBooking.deposit_cents"
      - "Order.payment_status: DEPOSIT_HELD -> REFUNDED"
      - "EventBooking.version increments"

  # ---- Test-driving endpoints (/_...) --------------------------------
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: |
      Set server logical clock. Default startup value: 2026-03-01T00:00:00Z
      (before any set_current_utc call). Advancing the clock past
      Order.pickup_deadline triggers the no-show sweep; advancing past
      (event_date - 7 days) triggers the FORFEITED sweep.
    roles: [StoreManager, StoreClerk]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Runs no-show sweep: Order.fulfillment_status READY_FOR_PICKUP -> CANCELLED for orders whose pickup_deadline has passed"
      - "Runs event forfeit sweep: EventBooking status -> FORFEITED for HELD/CONFIRMED with (event_date - now) < 7 days"

  - method: POST
    path: "/api/_helium-tanks/{id}/refill"
    description: "Test-driving endpoint: refill a HeliumTank to full capacity."
    roles: [StoreManager]
    code: 200
    input: []
    output: HeliumTank
    side_effects: ["HeliumTank.remaining_cubic_ft = capacity_cubic_ft; status=ACTIVE"]

# ---------------------------------------------------------------------------
# §1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not a declared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per §1.5"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body-referenced foreign key does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine transition rejected; from-state does not permit this trigger"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match current Order.version (OCC on parent)"
  - id: ERR_STALE_SKU_VERSION
    http: 412
    condition: "expected_sku_version does not match current Sku.version (OCC on parent)"
  - id: ERR_CLEARANCE_NON_RETURNABLE
    http: 422
    condition: "Any OrderLine's Sku.is_clearance == true at return time"
  - id: ERR_RENTAL_CATEGORY_INVALID
    http: 422
    condition: "RentalContract.sku_id's Sku.category is not TABLEWARE"
  - id: ERR_SEASONAL_WINDOW_CLOSED
    http: 422
    condition: "Order RESERVE attempted while a line SKU is outside its seasonal window"
  - id: ERR_EVENT_LEAD_TOO_SHORT
    http: 422
    condition: "EventBooking confirm attempted with insufficient lead time"
  - id: ERR_DELIVERY_SLOT_CONFLICT
    http: 409
    condition: "DeliverySlot half-open overlap on same van_id"
  - id: ERR_RENTAL_OVERLAP_CAPACITY
    http: 409
    condition: "RentalContract aggregate qty across overlapping intervals exceeds Sku.on_hand_qty"
  - id: ERR_INSUFFICIENT_STOCK
    http: 422
    condition: "Order RESERVE attempted but Sku.on_hand_qty - reserved_qty < line qty"
  - id: ERR_HELIUM_INSUFFICIENT
    http: 422
    condition: "Order RESERVE attempted but SUM(active HeliumTank.remaining_cubic_ft) < required"
  - id: ERR_REVISION_LIMIT
    http: 422
    condition: "CustomPrintOrder revision_count would exceed 3"
  - id: ERR_CLEARANCE_PCT_OUT_OF_RANGE
    http: 422
    condition: "Clearance pct <= 0 or > 0.9"
  - id: ERR_DEPOSIT_NOT_APPLICABLE
    http: 422
    condition: "Deposit payment requested but no EventBooking or RentalContract attached"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing or malformed"
  - id: ERR_EVENT_CANCEL_TOO_LATE
    http: 422
    condition: "EventBooking cancel attempted within 7 days of event_date"

# ---------------------------------------------------------------------------
# §1.7 RBAC
# ---------------------------------------------------------------------------
roles:
  - name: StoreManager
    description: "Catalog and inventory operator; owns SKU/Bundle/HeliumTank/EventPackage lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /skus"
      - "POST /skus/{id}/clearance"
      - "POST /skus/{id}/unclear"
      - "POST /skus/{id}/restock"
      - "POST /bundles"
      - "POST /helium-tanks"
      - "POST /event-packages"
      - "POST /_helium-tanks/{id}/refill"
    shared_operations:
      - "GET on SKU/Bundle/HeliumTank/EventPackage"
      - "POST /_clock/set_current_utc"

  - name: StoreClerk
    description: "Customer-facing operator; owns Order/HeliumOrder/DeliverySlot/RentalContract/CustomPrintOrder/EventBooking lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /orders"
      - "POST /orders/{id}/reserve"
      - "POST /orders/{id}/pay"
      - "POST /orders/{id}/start-picking"
      - "POST /orders/{id}/mark-ready"
      - "POST /orders/{id}/pickup"
      - "POST /orders/{id}/return"
      - "POST /orders/{id}/cancel"
      - "POST /orders/{id}/helium"
      - "POST /orders/{id}/custom-print"
      - "POST /delivery-slots"
      - "POST /rental-contracts"
      - "POST /rental-contracts/{id}/return"
      - "POST /rental-contracts/{id}/mark-damaged"
      - "POST /custom-print-orders/{id}/send-proof"
      - "POST /custom-print-orders/{id}/start-print"
      - "POST /custom-print-orders/{id}/mark-ready"
      - "POST /custom-print-orders/{id}/cancel"
      - "POST /event-bookings"
      - "POST /event-bookings/{id}/confirm"
      - "POST /event-bookings/{id}/complete"
      - "POST /event-bookings/{id}/cancel"
    shared_operations:
      - "GET on Order/HeliumOrder/DeliverySlot/RentalContract/CustomPrintOrder/EventBooking/Customer/HeliumTank"
      - "POST /_clock/set_current_utc"

  - name: DeliveryDriver
    description: "Delivery-only operator."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/deliver"
    shared_operations: []

  - name: Customer
    description: "End customer approving proofs and requesting revisions on their own custom print orders."
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /custom-print-orders/{id}/request-revision"
      - "POST /custom-print-orders/{id}/approve"
    shared_operations:
      - "GET on Customer/Order/CustomPrintOrder/EventBooking/RentalContract/Sku/Bundle/EventPackage"
