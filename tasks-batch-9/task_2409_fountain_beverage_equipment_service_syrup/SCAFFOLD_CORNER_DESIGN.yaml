              as: NetworkAdmin
              captures: { du: $.data.id }
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-COLA", brand_name: "Cola Classic", supply_form: "CARTRIDGE", case_pack_units: 4, ounces_per_unit: 1000, national_allocation_units: 100 }
              as: NetworkAdmin
