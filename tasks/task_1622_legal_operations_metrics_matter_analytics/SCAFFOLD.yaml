  - method: GET
    path: "/legal-ops/matters/{id}/cost-model"
    description: "Computed read: insource vs outsource cost model"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: { matter_id: string, insource_cost_cents: integer, outsource_cost_cents: integer, modeled_outsource_cost_cents: integer, savings_cents: integer, decision: string }
    side_effects: []

  # --- Matter assignments ---
  - method: POST
    path: "/legal-ops/matters/{id}/assignments"
    description: "Allocate counsel hours to a matter"
    roles: [LegalOpsAnalyst]
    code: 201
    input: [counsel_id, allocated_hours]
    output: MatterAssignment
    side_effects: []
  - method: GET
    path: "/legal-ops/matters/{id}/assignments"
    description: "List assignments for a matter"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["limit?", "offset?"]
    output: MatterAssignment[]
    side_effects: []
  - method: GET
    path: "/legal-ops/matter-assignments"
    description: "List assignments, paginated, filterable by counsel_id / matter_id / status"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["counsel_id?", "matter_id?", "status?", "limit?", "offset?"]
    output: MatterAssignment[]
    side_effects: []
  - method: GET
    path: "/legal-ops/matter-assignments/{id}"
    description: "Fetch one assignment"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: MatterAssignment
    side_effects: []
  - method: POST
    path: "/legal-ops/matter-assignments/{id}/release"
    description: "Manually release an assignment"
    roles: [LegalOpsAnalyst]
    code: 200
    input: []
    output: MatterAssignment
    side_effects: ["increments MatterAssignment.version by 1"]

  # --- Budgets ---
  - method: POST
    path: "/legal-ops/budgets"
    description: "Create budget envelope at (fiscal_period, practice_area, matter_type?) grain"
    roles: [LegalOpsManager]
    code: 201
    input: [fiscal_period_id, practice_area_id, "matter_type_id?", allocated_cents]
    output: Budget
    side_effects: ["posture initialized to OK"]
  - method: GET
    path: "/legal-ops/budgets"
    description: "List budgets, paginated, filterable by fiscal_period_id / practice_area_id / matter_type_id / posture"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["fiscal_period_id?", "practice_area_id?", "matter_type_id?", "posture?", "limit?", "offset?"]
    output: Budget[]
    side_effects: []
  - method: GET
    path: "/legal-ops/budgets/{id}"
    description: "Fetch one budget"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: Budget
    side_effects: []
  - method: PATCH
    path: "/legal-ops/budgets/{id}"
    description: "Update allocated_cents (OCC on Budget.version)"
    roles: [LegalOpsManager]
    code: 200
    input: [allocated_cents, expected_budget_version]
    output: Budget
    side_effects: ["posture re-derived", "increments Budget.version by 1"]

  # --- Accruals ---
  - method: POST
    path: "/legal-ops/accruals"
    description: "Record an accrual for a matter+period+firm grain"
    roles: [LegalOpsAnalyst]
    code: 201
    input: [matter_id, fiscal_period_id, firm_id, amount_cents]
    output: Accrual
    side_effects: ["Matter.accrual_outstanding_cents += amount", "FiscalPeriod.total_accrual_cents += amount"]
  - method: GET
    path: "/legal-ops/accruals"
    description: "List accruals, paginated, filterable"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["matter_id?", "fiscal_period_id?", "firm_id?", "status?", "limit?", "offset?"]
    output: Accrual[]
    side_effects: []
  - method: GET
    path: "/legal-ops/accruals/{id}"
    description: "Fetch accrual"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: Accrual
    side_effects: []
  - method: POST
    path: "/legal-ops/accruals/{id}/release"
    description: "Manually release an OUTSTANDING accrual"
    roles: [LegalOpsAnalyst]
    code: 200
    input: []
    output: Accrual
    side_effects: ["Matter.accrual_outstanding_cents -= amount", "FiscalPeriod.total_accrual_cents -= amount"]

  # --- Invoices ---
  - method: POST
    path: "/legal-ops/invoices"
    description: "Submit an invoice"
    roles: [LegalOpsAnalyst]
    code: 201
    input: [matter_id, firm_id, fiscal_period_id, invoice_number, amount_cents]
    output: Invoice
    side_effects: []
  - method: GET
    path: "/legal-ops/invoices"
    description: "List invoices, paginated, filterable by matter_id / firm_id / fiscal_period_id / payment_status / accrual_match_status / matched_accrual_id"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["matter_id?", "firm_id?", "fiscal_period_id?", "payment_status?", "accrual_match_status?", "matched_accrual_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/legal-ops/invoices/{id}"
    description: "Fetch invoice"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/legal-ops/invoices/{id}/approve"
    description: "SUBMITTED -> APPROVED; runs accrual match; SOD for >= $1000"
    roles: [LegalOpsAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["accrual_match classification", "set matched_accrual_id if match found", "increments Invoice.version by 1"]
  - method: POST
    path: "/legal-ops/invoices/{id}/pay"
    description: "APPROVED -> PAID; posts SpendLine; matched accrual MATCHED; budget/matter/period aggregates updated"
    roles: [LegalOpsManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["insert SpendLine POSTED", "Accrual OUTSTANDING -> MATCHED if matched", "Matter/FiscalPeriod/Budget recomputes", "increments Invoice.version by 1"]
  - method: POST
    path: "/legal-ops/invoices/{id}/reject"
    description: "SUBMITTED -> REJECTED"
    roles: [LegalOpsAnalyst]
    code: 200
    input: []
    output: Invoice
    side_effects: ["increments Invoice.version by 1"]

  # --- Spend lines (read-only; event log) ---
  - method: GET
    path: "/legal-ops/spend-lines"
    description: "List spend lines, paginated, filterable"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["matter_id?", "fiscal_period_id?", "firm_id?", "source_status?", "invoice_id?", "reversal_of_id?", "limit?", "offset?"]
    output: SpendLine[]
    side_effects: []
  - method: GET
    path: "/legal-ops/spend-lines/{id}"
    description: "Fetch one spend line"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: SpendLine
    side_effects: []

  # --- Dashboards ---
  - method: POST
    path: "/legal-ops/dashboards"
    description: "Create a dashboard snapshot for a fiscal period"
    roles: [LegalOpsAnalyst]
    code: 201
    input: [fiscal_period_id, snapshot_label]
    output: Dashboard
    side_effects: ["compute all derived fields at creation (DRAFT state)"]
  - method: GET
    path: "/legal-ops/dashboards"
    description: "List dashboards, paginated, filterable"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: ["fiscal_period_id?", "status?", "limit?", "offset?"]
    output: Dashboard[]
    side_effects: []
  - method: GET
    path: "/legal-ops/dashboards/{id}"
    description: "Fetch dashboard"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: []
    output: Dashboard
    side_effects: []
  - method: POST
    path: "/legal-ops/dashboards/{id}/publish"
    description: "DRAFT -> PUBLISHED; supersedes prior PUBLISHED; OCC on Dashboard.version"
    roles: [LegalOpsManager]
    code: 200
    input: [expected_dashboard_version]
    output: Dashboard
    side_effects: ["other PUBLISHED dashboards for same period -> SUPERSEDED", "freeze computed values", "increments Dashboard.version by 1"]

  # --- Reporting (computed reads) ---
  - method: GET
    path: "/legal-ops/reports/spend-by-practice-area"
    description: "Aggregated spend per practice area for a fiscal period"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: [fiscal_period_id, "limit?", "offset?"]
    output: { rows: array }
    side_effects: []
  - method: GET
    path: "/legal-ops/reports/spend-by-firm"
    description: "Aggregated spend per firm for a fiscal period"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: [fiscal_period_id, "limit?", "offset?"]
    output: { rows: array }
    side_effects: []
  - method: GET
    path: "/legal-ops/reports/cycle-time-benchmark"
    description: "Cycle time stats (mean, p50, p90) per matter type for a fiscal period"
    roles: [LegalOpsManager, LegalOpsAnalyst, LegalOpsExecutive]
    code: 200
    input: [fiscal_period_id, "limit?", "offset?"]
    output: { rows: array }
    side_effects: []

  # --- Test-driving endpoints ---
  - method: POST
    path: "/legal-ops/_clock/set_current_utc"
    description: "Set the logical clock; default at server start is 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock"
    roles: [LegalOpsManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock updated"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not authorized for this endpoint"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation-of-duties: same user cannot approve an invoice they created when amount >= 100000 cents"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current version"
  - id: ERR_PERIOD_CLOSED
    http: 409
    condition: "Fiscal period is not OPEN or REOPENED; write rejected"
  - id: ERR_PERIOD_NOT_HARD_CLOSED
    http: 409
    condition: "Matter archive requires fiscal period HARD_CLOSED"
  - id: ERR_PERIOD_OVERLAP
    http: 422
    condition: "New fiscal period overlaps an existing one (adjacent touching allowed only at exactly end_date+1 == start_date)"
  - id: ERR_TAXONOMY_MISMATCH
    http: 422
    condition: "Matter's matter_type does not belong to its practice_area"
  - id: ERR_PARENT_MISMATCH
    http: 422
    condition: "MatterType body practice_area_id does not match URL parent"
  - id: ERR_ENTITY_INACTIVE
    http: 422
    condition: "Referenced practice area or firm is not ACTIVE"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation on business key"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "Amount violates >= 0 or > 0 constraint per endpoint"
  - id: ERR_BUDGET_OVERRUN_EXCEEDED
    http: 422
    condition: "Invoice payment would push Budget.consumed_cents past allocated * 1.10"
  - id: ERR_NO_ACTIVE_ASSIGNMENT
    http: 422
    condition: "Matter activation requires at least one ACTIVE MatterAssignment"
  - id: ERR_PERIOD_NOT_CLOSABLE
    http: 422
    condition: "Hard close blocked by lingering SUBMITTED invoices or DRAFT dashboards"
  - id: ERR_REOPEN_LIMIT
    http: 422
    condition: "Fiscal period has already been reopened twice"
  - id: ERR_CAPACITY_EXCEEDED
    http: 422
    condition: "Counsel allocation would exceed annual_capacity_hours"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, wrong type, or malformed value"

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: LegalOpsManager
    description: "Owns taxonomy, fiscal periods, budgets, firm lifecycle, dashboard publishing, and period close; segregation-of-duties counterpart to Analyst for invoice pay"
    identity: opaque
    exclusive_operations:
      - "POST /legal-ops/departments"
      - "PATCH /legal-ops/departments/{id}"
      - "POST /legal-ops/fiscal-periods"
      - "POST /legal-ops/fiscal-periods/{id}/hard-close"
      - "POST /legal-ops/fiscal-periods/{id}/reopen"
      - "POST /legal-ops/practice-areas"
      - "POST /legal-ops/practice-areas/{id}/archive"
      - "POST /legal-ops/practice-areas/{id}/matter-types"
      - "POST /legal-ops/firms"
      - "POST /legal-ops/firms/{id}/suspend"
      - "POST /legal-ops/in-house-counsel"
      - "POST /legal-ops/matters/{id}/reopen"
      - "POST /legal-ops/matters/{id}/archive"
      - "POST /legal-ops/budgets"
      - "PATCH /legal-ops/budgets/{id}"
      - "POST /legal-ops/invoices/{id}/pay"
      - "POST /legal-ops/dashboards/{id}/publish"
      - "POST /legal-ops/_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints"
      - "GET report endpoints"

  - name: LegalOpsAnalyst
    description: "Day-to-day operator: matters, assignments, accruals, invoices, soft-close; cannot pay invoices or manage taxonomy"
    identity: opaque
    exclusive_operations:
      - "POST /legal-ops/matters"
      - "PATCH /legal-ops/matters/{id}"
      - "POST /legal-ops/matters/{id}/activate"
      - "POST /legal-ops/matters/{id}/hold"
      - "POST /legal-ops/matters/{id}/resume"
      - "POST /legal-ops/matters/{id}/close"
      - "POST /legal-ops/matters/{id}/assignments"
      - "POST /legal-ops/matter-assignments/{id}/release"
      - "POST /legal-ops/accruals"
      - "POST /legal-ops/accruals/{id}/release"
      - "POST /legal-ops/invoices"
      - "POST /legal-ops/invoices/{id}/approve"
      - "POST /legal-ops/invoices/{id}/reject"
      - "POST /legal-ops/dashboards"
      - "POST /legal-ops/fiscal-periods/{id}/soft-close"
    shared_operations:
      - "GET read endpoints"
      - "GET report endpoints"

  - name: LegalOpsExecutive
    description: "Read-only consumer of dashboards, reports, and drill-downs"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET read endpoints"
      - "GET report endpoints"
