        distinguishing_aspect: "Two WCSH guards that fire on opposite ends of the plan lifecycle: priority 26 rejects a schedule whose planned_amount sum misses covered_amount AT CREATION (month_index shape is legal, so this is not ERR_INVALID_REQUEST), and priority 24 rejects activation once the logical clock has passed window_end == window_start + 31 months. Because the schedule is well formed and documentation_complete is true, ERR_WCSH_PLAN_INCOMPLETE (25) cannot mask the closed-window error."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "WCSH Guard Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
