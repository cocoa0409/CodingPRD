              as: MedicaidCoordinator
              captures: { cred: $.data.id }
            - call: "POST /sbmb/provider-credentials/${cred}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/iep-authorizations"
              payload: { student_id: "${stu}", service_type: "SPEECH_THERAPY", procedure_code: "92507", unit_minutes: 15, unit_rate_cents: 3000, authorized_minutes_per_session: 30, sessions_per_week: 2, effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { auth: $.data.id }
            - call: "POST /sbmb/iep-authorizations/${auth}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/parental-consents"
              payload: { student_id: "${stu}", consent_type: "BILLING", signed_by: "Parent" }
              as: MedicaidCoordinator
              captures: { con: $.data.id }
            - call: "POST /sbmb/parental-consents/${con}/grant"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:00:00Z", end_time: "2026-03-01T09:40:00Z", delivered_minutes: 40 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { log1: $.data.id }
          trigger:
            - call: "POST /sbmb/service-logs"
              payload: { iep_authorization_id: "${auth}", provider_id: "${prov}", student_id: "${stu}", service_date: "2026-03-01", start_time: "2026-03-01T09:20:00Z", end_time: "2026-03-01T09:50:00Z", delivered_minutes: 30 }
              as: ServiceProvider
              as_user_id: "${prov}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_PROVIDER_DOUBLE_BOOKED"

      - name: provider_credential_closed_interval_overlap
        grounds:
          - validations[priority=14]
          - errors[ERR_CREDENTIAL_PERIOD_OVERLAP]
          - state_machines.ProviderCredential.PENDING_to_ACTIVE
          - entities.ProviderCredential.fields.expiration_date
        distinguishing_aspect: |
          Closed [effective,expiration] semantics on ProviderCredential: a
          second STATE_LICENSE whose window starts exactly on the first's
          expiration_date (2026-06-30) OVERLAPS at the shared endpoint and is
          rejected on activate. Different interval geometry than the half-open
          service-log rule.
        test_recipe:
          setup:
            - "Provider with one ACTIVE STATE_LICENSE covering 2026-01-01..2026-06-30, and a second PENDING STATE_LICENSE 2026-06-30..2026-12-31 (touching endpoint)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: MedicaidCoordinator
            - call: "POST /sbmb/providers"
              payload: { npi: "NPI-16", first_name: "Cal", last_name: "Wx", discipline: "PT" }
              as: MedicaidCoordinator
              captures: { prov: $.data.id }
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "LA", effective_date: "2026-01-01", expiration_date: "2026-06-30" }
              as: MedicaidCoordinator
              captures: { credA: $.data.id }
            - call: "POST /sbmb/provider-credentials/${credA}/activate"
              payload: {}
              as: MedicaidCoordinator
            - call: "POST /sbmb/provider-credentials"
              payload: { provider_id: "${prov}", credential_type: "STATE_LICENSE", license_number: "LB", effective_date: "2026-06-30", expiration_date: "2026-12-31" }
              as: MedicaidCoordinator
              captures: { credB: $.data.id }
          trigger:
            - call: "POST /sbmb/provider-credentials/${credB}/activate"
              payload: {}
              as: MedicaidCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CREDENTIAL_PERIOD_OVERLAP"
            - "ProviderCredential.${credB}.status == PENDING"

