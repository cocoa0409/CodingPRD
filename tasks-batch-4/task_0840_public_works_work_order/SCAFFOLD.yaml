scenario: "840. Public Works Work-Order & Asset Management: 311 intake & asset (road/sign/signal), work order & crew/equipment dispatch, preventive & condition (PCI) inspection, material & yard inventory, right-of-way & utility coordination, cost & labor, capital vs maintenance, GIS asset registry"
domain_name: public-works-work-order
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys (Inspection.asset_id, WorkOrder.asset_id,
  # Dispatch.crew_id, MaterialReservation.material_item_id, ROWPermit.work_order_id ...).
  # No nesting in URL paths except the CostEntry-style sub-resource was deliberately removed;
  # all collections are top-level flat resources.

  state_machine_shape: branching
  # WorkOrder is branching (IN_PROGRESS -> {COMPLETED, CANCELLED} with divergent side effects)
  # AND cyclic (IN_PROGRESS <-> ON_HOLD). Inspection is cyclic (REJECTED -> SUBMITTED revision
  # loop). Asset is cyclic (ACTIVE <-> UNDER_REPAIR). ServiceRequest branches (NEW -> {TRIAGED,
  # DUPLICATE}).

  relationship_patterns:
    - one_to_many          # Asset 1--* Inspection / ServiceRequest / WorkOrder; WorkOrder 1--* Dispatch / MaterialReservation / ROWPermit
    - self_referential     # ServiceRequest.duplicate_of_id -> ServiceRequest.id
    - cross_aggregate      # WorkOrder transitions read ROWPermit / Dispatch / MaterialReservation state

  role_model: segregation_of_duties
  # Distinct operator roles own distinct steps; additionally the Supervisor who ACCEPTS an
  # Inspection must not be the operator who created it (X-User-ID separation).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Asset
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - name: asset_class
        type: enum
        source: input
        description: "Kind of GIS asset in the registry"
        constraints: "one of {ROAD, SIGN, SIGNAL}"
      - name: gis_segment_id
        type: string
        source: input
        description: "Linear GIS segment / location key this asset sits on; ROW conflicts are computed per segment"
      - name: location_desc
        type: string
        source: input
        description: "Human-readable location"
      - name: install_date
        type: datetime
        source: input
        description: "Date the asset was installed; drives age_penalty in PCI"
      - name: replacement_value_cents
        type: integer
        source: input
        description: "Replacement/betterment basis in cents; used by capitalization betterment test"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: ACTIVE
        constraints: "one of {ACTIVE, UNDER_REPAIR, RETIRED}"
      - name: pci_score
        type: number
        source: computed
        description: "Latest accepted Pavement/Condition Index 0-100; set from the most recently ACCEPTED Inspection's computed_pci"
        default: null
      - name: condition_state
        type: enum
        source: computed
        description: "Derived from pci_score via fixed thresholds"
        default: null
        constraints: "one of {GOOD, FAIR, POOR, FAILED}"
      - name: last_inspection_at
        type: datetime
        source: computed
        description: "Clock time of the most recent Inspection acceptance"
        default: null
      - name: maintenance_cost_to_date_cents
        type: integer
        source: computed
        description: "Running sum of actual_cost_cents of COMPLETED WorkOrders on this asset booked as maintenance (capitalized == false)"
        default: 0
      - name: capital_cost_to_date_cents
        type: integer
        source: computed
        description: "Running sum of actual_cost_cents of COMPLETED WorkOrders on this asset booked as capital (capitalized == true)"
        default: 0

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id"
      - name: inspector_id
        type: string
        source: system
        description: "X-User-ID of the Inspector who created the record; frozen at creation and used for the segregation-of-duties check on acceptance"
      - name: inspection_type
        type: enum
        source: input
        description: "Preventive vs full condition survey; selects the PCI variant"
        constraints: "one of {PREVENTIVE, CONDITION}"
      - name: raw_distress_index
        type: number
        source: input
        description: "Field-measured distress 0-100 (higher = worse)"
        constraints: ">= 0 and <= 100"
      - name: computed_pci
        type: number
        source: computed
        description: "PCI 0-100 computed at creation from raw_distress_index, asset_class severity, and asset age; see calculations.pci_score"
        default: null
      - name: scheduled_window_start
        type: datetime
        source: input
        description: "Planned inspection window start"
      - name: scheduled_window_end
        type: datetime
        source: input
        description: "Planned inspection window end"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED}"
      - name: decided_by
        type: string
        source: system
        description: "X-User-ID of the Supervisor who accepted or rejected the inspection"
        default: null

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id"
      - name: channel
        type: enum
        source: input
        description: "311 intake channel"
        constraints: "one of {PHONE, WEB, APP}"
      - name: category
        type: enum
        source: input
        description: "Reported problem category; drives priority + SLA"
        constraints: "one of {POTHOLE, SIGN_DAMAGE, SIGNAL_OUTAGE}"
      - name: reported_by
        type: string
        source: input
        description: "Free-text reporter contact/name"
      - name: location_desc
        type: string
        source: input
        description: "Reported location"
      - name: priority
        type: enum
        source: computed
        description: "Derived from category; see calculations.service_request_priority_sla"
        constraints: "one of {LOW, MEDIUM, HIGH, EMERGENCY}"
      - name: sla_due_at
        type: datetime
        source: computed
        description: "created_at + sla_hours(priority); see calculations.service_request_priority_sla"
      - name: duplicate_of_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; set only when triaged as a duplicate"
        default: null
      - name: status
        type: enum
        source: system
        description: "311 request lifecycle"
        default: NEW
        constraints: "one of {NEW, TRIAGED, LINKED, CLOSED, DUPLICATE}"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id"
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; when present, that ServiceRequest is auto-LINKED on WorkOrder creation and auto-CLOSED on WorkOrder completion"
        default: null
      - name: work_type
        type: enum
        source: input
        description: "Declared accounting intent; CAPITAL always capitalizes, MAINTENANCE may be reclassified by the betterment test"
        constraints: "one of {MAINTENANCE, CAPITAL}"
      - name: origin
        type: enum
        source: input
        description: "How the work order was raised"
        constraints: "one of {INSPECTION, SERVICE_REQUEST, PREVENTIVE}"
      - name: priority
        type: enum
        source: input
        description: "Scheduling priority"
        default: MEDIUM
        constraints: "one of {LOW, MEDIUM, HIGH, EMERGENCY}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned start; required at schedule time"
        default: null
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned end; required at schedule time"
        default: null
      - name: estimated_cost_cents
        type: integer
        source: input
        description: "Planner estimate in cents"
        default: 0
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "Sum of Dispatch.labor_cost_cents for this WorkOrder's non-CANCELLED dispatches; see calculations.work_order_cost_rollup"
        default: 0
      - name: material_cost_cents
        type: integer
        source: computed
        description: "Sum of CONSUMED MaterialReservation.consumed_cost_cents for this WorkOrder (per-line rounded then summed); see calculations.work_order_cost_rollup"
        default: 0
      - name: actual_cost_cents
        type: integer
        source: computed
        description: "labor_cost_cents + material_cost_cents; finalized at completion"
        default: 0
      - name: capitalized
        type: boolean
        source: computed
        description: "Whether actual_cost_cents was booked to the asset's capital ledger; see calculations.capitalization_determination"
        default: false
      - name: status
        type: enum
        source: system
        description: "WorkOrder lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, DISPATCHED, IN_PROGRESS, ON_HOLD, COMPLETED, CANCELLED}"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Crew display name"
      - name: crew_type
        type: enum
        source: input
        description: "Crew discipline"
        constraints: "one of {PAVING, SIGNS, SIGNALS}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Labor rate in cents per hour; drives Dispatch.labor_cost_cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Availability state"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_ASSIGNMENT}"
      - name: committed_minutes
        type: integer
        source: computed
        description: "Sum of (window_end - window_start) in whole minutes over this crew's Dispatches in status {RESERVED, ACTIVE}; conserved quantity for the dispatch reserve/cancel invariant"
        default: 0

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id"
      - name: window_start
        type: datetime
        source: input
        description: "Assignment window start (half-open interval start)"
      - name: window_end
        type: datetime
        source: input
        description: "Assignment window end (half-open interval end; window_end > window_start required)"
      - name: labor_hours
        type: number
        source: input
        description: "Planned labor hours to bill; feeds tiered labor_cost_cents"
        constraints: "> 0"
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "Tiered labor cost from labor_hours and Crew.hourly_rate_cents; see calculations.labor_cost"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Dispatch lifecycle"
        default: RESERVED
        constraints: "one of {RESERVED, ACTIVE, RELEASED, CANCELLED}"

  - name: Yard
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Yard display name"
      - name: location_desc
        type: string
        source: input
        description: "Yard location"

  - name: MaterialItem
    parent: null
    common_fields: true
    fields:
      - name: material_type
        type: enum
        source: input
        description: "Stocked material type"
        constraints: "one of {ASPHALT_TON, SIGN_BLANK, SIGNAL_LAMP}"
      - name: yard_id
        type: string
        source: input
        description: "FK -> Yard.id; storage yard holding this item"
      - name: unit
        type: string
        source: input
        description: "Unit of measure label (e.g. TON, EACH)"
      - name: on_hand_qty
        type: number
        source: input
        description: "Physical quantity on hand; reduced only when a reservation is CONSUMED"
        constraints: ">= 0"
      - name: reserved_qty
        type: number
        source: computed
        description: "Sum of qty over this item's MaterialReservations in status RESERVED; conserved quantity for the reserve/release invariant"
        default: 0
      - name: available_qty
        type: number
        source: computed
        description: "on_hand_qty - reserved_qty"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Cost per unit in cents; drives per-line consumed_cost_cents"
        constraints: ">= 0"
      - name: reorder_point
        type: number
        source: input
        description: "Low-stock threshold (informational)"
        default: 0

  - name: MaterialReservation
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id"
      - name: material_item_id
        type: string
        source: input
        description: "FK -> MaterialItem.id"
      - name: qty
        type: number
        source: input
        description: "Reserved quantity; must be <= MaterialItem.available_qty at reservation time"
        constraints: "> 0"
      - name: consumed_cost_cents
        type: integer
        source: computed
        description: "round_half_up(qty * MaterialItem.unit_cost_cents), set when the reservation is CONSUMED (0 while RESERVED/RELEASED)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle"
        default: RESERVED
        constraints: "one of {RESERVED, CONSUMED, RELEASED}"

  - name: ROWPermit
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id"
      - name: permit_type
        type: enum
        source: input
        description: "Right-of-way / utility coordination type"
        constraints: "one of {LANE_CLOSURE, EXCAVATION, UTILITY_COORD}"
      - name: gis_segment_id
        type: string
        source: input
        description: "Segment the permit occupies; overlap conflicts computed per gis_segment_id"
      - name: utility_company
        type: string
        source: input
        description: "Coordinating utility, when applicable"
        default: null
      - name: window_start
        type: datetime
        source: input
        description: "Occupation window start (closed interval start)"
      - name: window_end
        type: datetime
        source: input
        description: "Occupation window end (closed interval end; window_end > window_start required)"
      - name: clearance_required
        type: boolean
        source: input
        description: "When true, the WorkOrder cannot be dispatched until this permit is APPROVED (safety gate)"
        default: true
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle"
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, ACTIVE, DENIED, RELEASED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Asset
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: UNDER_REPAIR
        trigger: "system: a WorkOrder is auto-created for this asset because an ACCEPTED Inspection drove condition_state to FAILED"
        actor: system
        preconditions: ["asset.status == ACTIVE"]
        side_effects: ["Asset.status set to UNDER_REPAIR", "Asset.version += 1"]
        note: "Third hop of the inspection-acceptance cascade (see calculations.pci_score / Rule 4)."
      - from: UNDER_REPAIR
        to: ACTIVE
        trigger: "system: the WorkOrder for this asset transitions to COMPLETED or CANCELLED and no other non-terminal WorkOrder remains on the asset"
        actor: system
        preconditions: ["asset.status == UNDER_REPAIR", "no WorkOrder with asset_id == this in status {DRAFT, SCHEDULED, DISPATCHED, IN_PROGRESS, ON_HOLD}"]
        side_effects: ["Asset.status set to ACTIVE", "Asset.version += 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /assets/{id}/retire"
        actor: Supervisor
        preconditions: ["asset.status == ACTIVE", "no WorkOrder with asset_id == this in a non-terminal status {DRAFT, SCHEDULED, DISPATCHED, IN_PROGRESS, ON_HOLD}"]
        side_effects: ["Asset.status set to RETIRED", "Asset.version += 1"]

  - entity: Inspection
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /inspections/{id}/submit"
        actor: Inspector
        preconditions: ["inspection.status == DRAFT"]
        side_effects: ["Inspection.status set to SUBMITTED", "Inspection.version += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /inspections/{id}/submit (resubmission after rejection)"
        actor: Inspector
        preconditions: ["inspection.status == REJECTED"]
        side_effects: ["Inspection.status set to SUBMITTED", "Inspection.version += 1"]
        note: "Revision cycle REJECTED -> SUBMITTED makes this a non-linear (cyclic) machine."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /inspections/{id}/decision {decision: ACCEPT}"
        actor: Supervisor
        preconditions:
          - "inspection.status == SUBMITTED"
          - "X-User-ID of the decider != inspection.inspector_id (segregation of duties)"
          - "asset.status != RETIRED"
        side_effects:
          - "Inspection.decided_by set to decider X-User-ID"
          - "Asset.pci_score set to inspection.computed_pci"
          - "Asset.condition_state recomputed from pci_score thresholds"
          - "Asset.last_inspection_at set to current clock time"
          - "if resulting Asset.condition_state == FAILED and asset.status == ACTIVE: auto-create WorkOrder{asset_id, work_type: MAINTENANCE, origin: INSPECTION, status: DRAFT} which in turn drives Asset ACTIVE -> UNDER_REPAIR"
          - "Inspection.version += 1; Asset.version += 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /inspections/{id}/decision {decision: REJECT}"
        actor: Supervisor
        preconditions: ["inspection.status == SUBMITTED"]
        side_effects: ["Inspection.decided_by set to decider X-User-ID", "Inspection.status set to REJECTED", "Inspection.version += 1"]

  - entity: ServiceRequest
    initial_state: NEW
    terminal_states: [CLOSED, DUPLICATE]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /service-requests/{id}/triage (duplicate_of_id omitted)"
        actor: Dispatcher
        preconditions: ["service_request.status == NEW"]
        side_effects: ["ServiceRequest.status set to TRIAGED", "ServiceRequest.version += 1"]
      - from: NEW
        to: DUPLICATE
        trigger: "POST /service-requests/{id}/triage {duplicate_of_id}"
        actor: Dispatcher
        preconditions: ["service_request.status == NEW", "duplicate_of_id references an existing ServiceRequest", "duplicate_of_id != this ServiceRequest id"]
        side_effects: ["ServiceRequest.duplicate_of_id set", "ServiceRequest.status set to DUPLICATE", "ServiceRequest.version += 1"]
      - from: TRIAGED
        to: LINKED
        trigger: "system: a WorkOrder is created with service_request_id == this"
        actor: system
        preconditions: ["service_request.status == TRIAGED"]
        side_effects: ["ServiceRequest.status set to LINKED", "ServiceRequest.version += 1"]
      - from: LINKED
        to: CLOSED
        trigger: "system: the linked WorkOrder transitions to COMPLETED"
        actor: system
        preconditions: ["service_request.status == LINKED"]
        side_effects: ["ServiceRequest.status set to CLOSED", "ServiceRequest.version += 1"]

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /work-orders/{id}/schedule"
        actor: Dispatcher
        preconditions: ["work_order.status == DRAFT", "scheduled_start and scheduled_end provided with scheduled_end > scheduled_start"]
        side_effects: ["WorkOrder.scheduled_start/scheduled_end set", "WorkOrder.status set to SCHEDULED", "WorkOrder.version += 1"]
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "work_order.status == SCHEDULED"
          - "at least one Dispatch with work_order_id == this in status RESERVED exists"
          - "every ROWPermit with work_order_id == this and clearance_required == true is in status APPROVED (cross-entity safety gate)"
        side_effects:
          - "WorkOrder.status set to DISPATCHED"
          - "each RESERVED Dispatch for this WorkOrder set to ACTIVE"
          - "each APPROVED ROWPermit for this WorkOrder set to ACTIVE"
          - "WorkOrder.version += 1"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: CrewLead
        preconditions: ["work_order.status == DISPATCHED"]
        side_effects: ["WorkOrder.status set to IN_PROGRESS", "WorkOrder.version += 1"]
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /work-orders/{id}/hold"
        actor: CrewLead
        preconditions: ["work_order.status == IN_PROGRESS"]
        side_effects: ["WorkOrder.status set to ON_HOLD", "WorkOrder.version += 1"]
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/resume"
        actor: CrewLead
        preconditions: ["work_order.status == ON_HOLD"]
        side_effects: ["WorkOrder.status set to IN_PROGRESS", "WorkOrder.version += 1"]
        note: "IN_PROGRESS <-> ON_HOLD cycle makes WorkOrder non-linear (cyclic); COMPLETED vs CANCELLED from IN_PROGRESS makes it branching."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: CrewLead
        preconditions: ["work_order.status == IN_PROGRESS"]
        side_effects:
          - "each RESERVED MaterialReservation for this WorkOrder set to CONSUMED: MaterialReservation.consumed_cost_cents = round_half_up(qty * MaterialItem.unit_cost_cents); MaterialItem.on_hand_qty -= qty; MaterialItem.reserved_qty -= qty; MaterialItem.version += 1"
          - "WorkOrder.labor_cost_cents / material_cost_cents / actual_cost_cents recomputed (see calculations.work_order_cost_rollup)"
          - "WorkOrder.capitalized determined (see calculations.capitalization_determination)"
          - "if capitalized: Asset.capital_cost_to_date_cents += actual_cost_cents else Asset.maintenance_cost_to_date_cents += actual_cost_cents"
          - "each ACTIVE/RESERVED Dispatch for this WorkOrder set to RELEASED; Crew.committed_minutes decremented; Crew.status set to AVAILABLE when the crew has no remaining {RESERVED, ACTIVE} dispatch; Crew.version += 1"
          - "each APPROVED/ACTIVE ROWPermit for this WorkOrder set to RELEASED"
          - "if service_request_id present and that ServiceRequest.status == LINKED: ServiceRequest.status set to CLOSED"
          - "if Asset.status == UNDER_REPAIR and no other non-terminal WorkOrder remains on the asset: Asset.status set to ACTIVE"
          - "WorkOrder.status set to COMPLETED; WorkOrder.version += 1; Asset.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: ["work_order.status == DRAFT"]
        side_effects: ["WorkOrder.status set to CANCELLED", "release side-effects below", "WorkOrder.version += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: ["work_order.status == SCHEDULED"]
        side_effects: ["WorkOrder.status set to CANCELLED", "cancel each {RESERVED, ACTIVE} Dispatch for this WorkOrder (Dispatch -> CANCELLED; Crew.committed_minutes decremented; Crew.status -> AVAILABLE when no remaining {RESERVED,ACTIVE} dispatch; Crew.version += 1)", "release each RESERVED MaterialReservation (-> RELEASED; MaterialItem.reserved_qty -= qty; MaterialItem.version += 1)", "release each {APPROVED, ACTIVE} ROWPermit (-> RELEASED)", "if Asset.status == UNDER_REPAIR and no other non-terminal WorkOrder remains: Asset.status -> ACTIVE", "WorkOrder.version += 1"]
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: ["work_order.status == DISPATCHED"]
        side_effects: ["same release cascade as the SCHEDULED -> CANCELLED transition"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: ["work_order.status == IN_PROGRESS"]
        side_effects: ["same release cascade as the SCHEDULED -> CANCELLED transition"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Dispatcher
        preconditions: ["work_order.status == ON_HOLD"]
        side_effects: ["same release cascade as the SCHEDULED -> CANCELLED transition"]

  - entity: Dispatch
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /dispatches"
        actor: Dispatcher
        preconditions:
          - "referenced WorkOrder.status == SCHEDULED"
          - "window_end > window_start"
          - "no window conflict on the crew (see validations priority 13 / ERR_CREW_WINDOW_CONFLICT). A crew may hold multiple dispatches across non-overlapping windows."
          - "expected_crew_version == Crew.version (OCC)"
        side_effects:
          - "Dispatch created in status RESERVED"
          - "Dispatch.labor_cost_cents computed (see calculations.labor_cost)"
          - "Crew.status set to ON_ASSIGNMENT"
          - "Crew.committed_minutes += whole minutes of [window_start, window_end)"
          - "Crew.version += 1"
      - from: RESERVED
        to: ACTIVE
        trigger: "system: parent WorkOrder transitions SCHEDULED -> DISPATCHED"
        actor: system
        preconditions: ["dispatch.status == RESERVED"]
        side_effects: ["Dispatch.status set to ACTIVE", "Dispatch.version += 1"]
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /dispatches/{id}/cancel (or system on WorkOrder cancel)"
        actor: Dispatcher
        preconditions: ["dispatch.status == RESERVED"]
        side_effects: ["Dispatch.status set to CANCELLED", "Crew.committed_minutes -= this window's minutes", "Crew.status set to AVAILABLE when crew has no remaining {RESERVED, ACTIVE} dispatch", "Crew.version += 1", "Dispatch.version += 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /dispatches/{id}/cancel (or system on WorkOrder cancel)"
        actor: Dispatcher
        preconditions: ["dispatch.status == ACTIVE"]
        side_effects: ["same crew-release side effects as RESERVED -> CANCELLED"]
      - from: ACTIVE
        to: RELEASED
        trigger: "system: parent WorkOrder transitions IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: ["dispatch.status == ACTIVE"]
        side_effects: ["Dispatch.status set to RELEASED", "Crew.committed_minutes -= this window's minutes", "Crew.status -> AVAILABLE when no remaining {RESERVED,ACTIVE} dispatch", "Crew.version += 1", "Dispatch.version += 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "system: parent WorkOrder transitions IN_PROGRESS -> COMPLETED while a dispatch is still RESERVED"
        actor: system
        preconditions: ["dispatch.status == RESERVED"]
        side_effects: ["same crew-release side effects as ACTIVE -> RELEASED"]

  - entity: MaterialReservation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /material-reservations"
        actor: Dispatcher
        preconditions:
          - "referenced WorkOrder.status in {SCHEDULED, DISPATCHED, IN_PROGRESS, ON_HOLD}"
          - "qty <= MaterialItem.available_qty"
          - "expected_material_item_version == MaterialItem.version (OCC)"
        side_effects: ["MaterialReservation created RESERVED", "MaterialItem.reserved_qty += qty", "MaterialItem.version += 1"]
      - from: RESERVED
        to: CONSUMED
        trigger: "system: parent WorkOrder transitions IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: ["material_reservation.status == RESERVED"]
        side_effects: ["MaterialReservation.consumed_cost_cents = round_half_up(qty * MaterialItem.unit_cost_cents)", "MaterialItem.on_hand_qty -= qty", "MaterialItem.reserved_qty -= qty", "MaterialItem.version += 1", "MaterialReservation.version += 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /material-reservations/{id}/release (or system on WorkOrder cancel)"
        actor: Dispatcher
        preconditions: ["material_reservation.status == RESERVED"]
        side_effects: ["MaterialReservation.status set to RELEASED", "MaterialItem.reserved_qty -= qty (on_hand_qty unchanged)", "MaterialItem.version += 1", "MaterialReservation.version += 1"]

  - entity: ROWPermit
    initial_state: REQUESTED
    terminal_states: [DENIED, RELEASED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /row-permits/{id}/decision {decision: APPROVE}"
        actor: Coordinator
        preconditions:
          - "row_permit.status == REQUESTED"
          - "no other ROWPermit on the same gis_segment_id in status {APPROVED, ACTIVE} whose closed window [window_start, window_end] intersects this permit's closed window (see validations priority 8 / ERR_ROW_SEGMENT_CONFLICT)"
        side_effects: ["ROWPermit.status set to APPROVED", "ROWPermit.version += 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /row-permits/{id}/decision {decision: DENY}"
        actor: Coordinator
        preconditions: ["row_permit.status == REQUESTED"]
        side_effects: ["ROWPermit.status set to DENIED", "ROWPermit.version += 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "system: parent WorkOrder transitions SCHEDULED -> DISPATCHED"
        actor: system
        preconditions: ["row_permit.status == APPROVED"]
        side_effects: ["ROWPermit.status set to ACTIVE", "ROWPermit.version += 1"]
      - from: APPROVED
        to: RELEASED
        trigger: "POST /row-permits/{id}/release (or system on WorkOrder complete/cancel)"
        actor: Coordinator
        preconditions: ["row_permit.status == APPROVED"]
        side_effects: ["ROWPermit.status set to RELEASED", "ROWPermit.version += 1"]
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /row-permits/{id}/release (or system on WorkOrder complete/cancel)"
        actor: Coordinator
        preconditions: ["row_permit.status == ACTIVE"]
        side_effects: ["ROWPermit.status set to RELEASED", "ROWPermit.version += 1"]

  - entity: Crew
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_ASSIGNMENT
        trigger: "system: the crew's first {RESERVED, ACTIVE} Dispatch is created (status is a computed indicator, not a booking blocker; a crew may hold multiple non-overlapping dispatches)"
        actor: system
        preconditions: ["crew.status == AVAILABLE"]
        side_effects: ["Crew.status set to ON_ASSIGNMENT", "Crew.committed_minutes += window minutes", "Crew.version += 1"]
      - from: ON_ASSIGNMENT
        to: AVAILABLE
        trigger: "system: this crew's last {RESERVED, ACTIVE} Dispatch is CANCELLED or RELEASED"
        actor: system
        preconditions: ["crew.status == ON_ASSIGNMENT", "no remaining Dispatch for this crew in status {RESERVED, ACTIVE}"]
        side_effects: ["Crew.status set to AVAILABLE", "Crew.version += 1"]

# =====================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =====================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-item
    parent_entity: MaterialItem
    write_endpoint: "POST /material-reservations"
    occ_field: "expected_material_item_version"
    description: |
      Creating a MaterialReservation against a MaterialItem whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another reservation (or a consume/release/restock) has already
      shifted the item's reserved_qty/available_qty, so the current writer's view
      of the item — and therefore the availability it believes it can reserve
      against — is stale. Resolved as a stale-version check, not a timing rule.
    error_id: ERR_STALE_MATERIAL_VERSION
    http_status: 412
  - rule_id: dispatch-create-stale-crew
    parent_entity: Crew
    write_endpoint: "POST /dispatches"
    occ_field: "expected_crew_version"
    description: |
      Creating a Dispatch against a Crew whose version has advanced since the
      client last observed it is rejected. Another dispatch (or a cancel/release)
      may have already changed the crew's committed windows and availability, so
      the client's view of the crew's free time is stale. Resolved as a stale-
      version check on Crew.version, not a timing rule.
    error_id: ERR_STALE_CREW_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: pci_score
    trigger: "on Inspection creation (POST /inspections); the resulting computed_pci is promoted to Asset.pci_score when the inspection is ACCEPTED"
    algorithm: weighted_scoring
    formula: |
      severity_weight = { ROAD: 1.0, SIGN: 0.6, SIGNAL: 0.8 }[asset.asset_class]
      age_years = floor( (clock_now - asset.install_date) / 365.25 days )
      # CONDITION variant (full age weighting):
      age_penalty = min(age_years * AGE_PENALTY_PER_YEAR, MAX_AGE_PENALTY)
      # PREVENTIVE variant halves the age term:
      #   age_penalty = min(age_years * AGE_PENALTY_PER_YEAR * PREVENTIVE_AGE_FACTOR, MAX_AGE_PENALTY)
      base = 100 - raw_distress_index * severity_weight
      computed_pci = clamp( round_half_up(base - age_penalty), 0, 100 )
    input_set: "the single Inspection being created plus its referenced Asset (asset_class, install_date); clock_now is the logical clock"
    constants:
      AGE_PENALTY_PER_YEAR: 1.5
      MAX_AGE_PENALTY: 25
      PREVENTIVE_AGE_FACTOR: 0.5
    precision: "round_half_up to integer PCI, then clamp to [0,100]"
    variants:
      - name: condition_survey
        when: "inspection_type == CONDITION"
        difference: "uses the full age_penalty term"
      - name: preventive_survey
        when: "inspection_type == PREVENTIVE"
        difference: "multiplies the age term by PREVENTIVE_AGE_FACTOR (0.5), so a preventive survey of the same asset with the same raw_distress_index yields a higher PCI"

  - name: condition_state_thresholds
    trigger: "whenever Asset.pci_score is (re)set on inspection acceptance"
    algorithm: threshold
    formula: |
      if pci_score >= 85: GOOD
      elif pci_score >= 70: FAIR
      elif pci_score >= 55: POOR
      else: FAILED
    input_set: "the asset's current pci_score"
    constants:
      GOOD_MIN: 85
      FAIR_MIN: 70
      POOR_MIN: 55
    precision: "integer PCI compared with >= (inclusive lower bound)"
    variants: []

  - name: labor_cost
    trigger: "on Dispatch creation (POST /dispatches)"
    algorithm: tiered_pricing
    formula: |
      regular_hours = min(labor_hours, OT_THRESHOLD_HOURS)
      overtime_hours = max(labor_hours - OT_THRESHOLD_HOURS, 0)
      labor_cost_cents = round_half_up(
          regular_hours * crew.hourly_rate_cents
        + overtime_hours * crew.hourly_rate_cents * OT_MULTIPLIER )
    input_set: "the Dispatch being created and its referenced Crew.hourly_rate_cents"
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
    precision: "round_half_up to whole cents after the full expression"
    variants:
      - name: within_regular
        when: "labor_hours <= 8"
        difference: "no overtime term; cost is labor_hours * rate"
      - name: with_overtime
        when: "labor_hours > 8"
        difference: "hours beyond 8 billed at 1.5x rate"

  - name: work_order_cost_rollup
    trigger: "on WorkOrder completion (POST /work-orders/{id}/complete)"
    algorithm: aggregation
    formula: |
      # Material: round EACH consumed reservation's line cost to whole cents, THEN sum.
      material_cost_cents = SUM over reservations r of this WorkOrder with status == CONSUMED of
                              round_half_up(r.qty * materialItem(r).unit_cost_cents)
      # (This per-line-then-sum order is pinned; sum-then-round can differ by a cent.)
      labor_cost_cents = SUM over dispatches d of this WorkOrder with status != CANCELLED of d.labor_cost_cents
      actual_cost_cents = labor_cost_cents + material_cost_cents
    input_set: "reservations of this WorkOrder in status CONSUMED (order-independent sum, but each line is rounded before summing); dispatches in status != CANCELLED"
    constants: {}
    precision: "each material line rounded_half_up to cents before summation; labor lines already whole cents"
    variants: []

  - name: capitalization_determination
    trigger: "on WorkOrder completion, after work_order_cost_rollup produces actual_cost_cents"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: (1) actual_cost_cents already computed by
      # work_order_cost_rollup, (2) evaluate capitalized, (3) post to the asset ledger.
      if work_type == CAPITAL:
          capitalized = true
      elif (actual_cost_cents >= CAPITALIZATION_THRESHOLD_CENTS
            and actual_cost_cents >= round_half_up(asset.replacement_value_cents * BETTERMENT_PCT)):
          capitalized = true          # betterment reclassification of a MAINTENANCE order
      else:
          capitalized = false
    input_set: "this WorkOrder's work_type and actual_cost_cents; the referenced Asset.replacement_value_cents"
    constants:
      CAPITALIZATION_THRESHOLD_CENTS: 500000
      BETTERMENT_PCT: 0.25
    precision: "integer cents; both threshold comparisons use >= (inclusive)"
    variants:
      - name: maintenance_expense
        when: "work_type == MAINTENANCE and the betterment test fails"
        difference: "actual_cost_cents added to Asset.maintenance_cost_to_date_cents; capital ledger untouched"
      - name: capital_booking
        when: "work_type == CAPITAL, or work_type == MAINTENANCE and the betterment test passes"
        difference: "actual_cost_cents added to Asset.capital_cost_to_date_cents; same inputs, different ledger and different capitalized flag"

  - name: service_request_priority_sla
    trigger: "on ServiceRequest creation (POST /service-requests)"
    algorithm: threshold
    formula: |
      priority = { SIGNAL_OUTAGE: EMERGENCY, POTHOLE: HIGH, SIGN_DAMAGE: MEDIUM }[category]
      sla_hours = { EMERGENCY: 4, HIGH: 48, MEDIUM: 120, LOW: 240 }[priority]
      sla_due_at = created_at + sla_hours hours   # created_at is the logical clock time at creation
    input_set: "the single ServiceRequest being created"
    constants:
      SLA_HOURS_EMERGENCY: 4
      SLA_HOURS_HIGH: 48
      SLA_HOURS_MEDIUM: 120
      SLA_HOURS_LOW: 240
    precision: "sla_due_at is created_at plus an exact whole-hour offset"
    variants: []

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enum values legal, numeric ranges satisfied (raw_distress_index in [0,100], qty > 0, window_end > window_start, decision in {ACCEPT,REJECT} or {APPROVE,DENY})"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every path id and every FK id in the body exists, validated left-to-right (asset_id, work_order_id, crew_id, material_item_id, service_request_id, duplicate_of_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "target resource is in a legal state for the requested transition (state-machine from-state precondition)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "the requested action is not being applied to a terminal resource (Inspection ACCEPTED; ServiceRequest CLOSED/DUPLICATE; WorkOrder COMPLETED/CANCELLED; Dispatch RELEASED/CANCELLED; MaterialReservation CONSUMED/RELEASED; ROWPermit DENIED/RELEASED; Asset RETIRED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_safety
    check: "on Inspection acceptance, the decider's X-User-ID differs from inspection.inspector_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inspections/{id}/decision"
  - priority: 8
    category: business_safety
    check: "on WorkOrder dispatch, every ROWPermit for the WorkOrder with clearance_required == true is APPROVED"
    error_id: ERR_ROW_NOT_APPROVED
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 9
    category: business_referential
    check: "on WorkOrder dispatch, at least one RESERVED Dispatch exists for the WorkOrder"
    error_id: ERR_NO_DISPATCH_FOR_WORKORDER
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 10
    category: state
    check: "on MaterialReservation creation, the referenced WorkOrder.status is in {SCHEDULED, DISPATCHED, IN_PROGRESS, ON_HOLD} (a DRAFT/COMPLETED/CANCELLED work order cannot receive reservations)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /material-reservations"
  - priority: 11
    category: business_referential
    check: "on ServiceRequest triage as duplicate, duplicate_of_id != the request's own id"
    error_id: ERR_DUPLICATE_SELF
    http_status: 409
    applies_to: "POST /service-requests/{id}/triage"
  - priority: 12
    category: business_referential
    check: "on Asset retire, no non-terminal WorkOrder references the asset"
    error_id: ERR_ASSET_HAS_OPEN_WORKORDER
    http_status: 409
    applies_to: "POST /assets/{id}/retire"
  - priority: 13
    category: business_temporal
    check: "on Dispatch creation, the [window_start, window_end) half-open window plus a MOBILIZATION_BUFFER of 30 minutes on each side does not overlap any existing {RESERVED, ACTIVE} Dispatch window on the same crew"
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /dispatches"
  - priority: 14
    category: business_temporal
    check: "on ROWPermit approval, the [window_start, window_end] closed window does not intersect (adjacency inclusive) any other {APPROVED, ACTIVE} ROWPermit on the same gis_segment_id"
    error_id: ERR_ROW_SEGMENT_CONFLICT
    http_status: 409
    applies_to: "POST /row-permits/{id}/decision"
  - priority: 15
    category: state
    check: "OCC: expected_material_item_version / expected_crew_version equals the parent's current version"
    error_id: "ERR_STALE_MATERIAL_VERSION | ERR_STALE_CREW_VERSION"
    http_status: 412
    applies_to: "POST /material-reservations, POST /dispatches"
  - priority: 16
    category: business_fiscal
    check: "on MaterialReservation creation, qty <= MaterialItem.available_qty"
    error_id: ERR_INSUFFICIENT_MATERIAL
    http_status: 409
    applies_to: "POST /material-reservations"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Asset ----
  - method: POST
    path: "/assets"
    description: "Register a GIS asset"
    roles: [Supervisor]
    code: 201
    input: [asset_class, gis_segment_id, location_desc, install_date, replacement_value_cents]
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets/{id}"
    description: "Fetch an asset"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/assets"
    description: "List assets"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["asset_class?", "status?", "condition_state?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []
  - method: POST
    path: "/assets/{id}/retire"
    description: "Retire an asset"
    roles: [Supervisor]
    code: 200
    input: []
    output: Asset
    side_effects: ["Asset ACTIVE -> RETIRED"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Create an inspection (DRAFT); computes computed_pci"
    roles: [Inspector]
    code: 201
    input: [asset_id, inspection_type, raw_distress_index, scheduled_window_start, scheduled_window_end]
    output: Inspection
    side_effects: ["compute Inspection.computed_pci (calculations.pci_score)", "stamp inspector_id from X-User-ID"]
  - method: GET
    path: "/inspections/{id}"
    description: "Fetch an inspection"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections; filter by asset_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["asset_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/submit"
    description: "Submit or resubmit an inspection"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["Inspection DRAFT|REJECTED -> SUBMITTED"]
  - method: POST
    path: "/inspections/{id}/decision"
    description: "Accept or reject a submitted inspection; ACCEPT promotes PCI to the asset and may cascade a WorkOrder"
    roles: [Supervisor]
    code: 200
    input: [decision]
    output: Inspection
    side_effects: ["SUBMITTED -> ACCEPTED or REJECTED", "on ACCEPT: update Asset pci_score/condition_state/last_inspection_at; possibly auto-create WorkOrder and drive Asset ACTIVE -> UNDER_REPAIR", "Asset.version += 1 on ACCEPT"]

  # ---- ServiceRequest ----
  - method: POST
    path: "/service-requests"
    description: "Create a 311 service request (NEW); computes priority + sla_due_at"
    roles: [Dispatcher]
    code: 201
    input: [asset_id, channel, category, reported_by, location_desc]
    output: ServiceRequest
    side_effects: ["compute priority + sla_due_at (calculations.service_request_priority_sla)"]
  - method: GET
    path: "/service-requests/{id}"
    description: "Fetch a service request"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []
  - method: GET
    path: "/service-requests"
    description: "List service requests; filter by asset_id or duplicate_of_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["asset_id?", "status?", "duplicate_of_id?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []
  - method: POST
    path: "/service-requests/{id}/triage"
    description: "Triage a NEW request to TRIAGED, or to DUPLICATE when duplicate_of_id is supplied"
    roles: [Dispatcher]
    code: 200
    input: ["duplicate_of_id?"]
    output: ServiceRequest
    side_effects: ["NEW -> TRIAGED, or NEW -> DUPLICATE"]

  # ---- WorkOrder ----
  - method: POST
    path: "/work-orders"
    description: "Create a work order (DRAFT); if service_request_id present and TRIAGED, auto-LINK it"
    roles: [Dispatcher]
    code: 201
    input: [asset_id, work_type, origin, "priority?", "service_request_id?", "estimated_cost_cents?"]
    output: WorkOrder
    side_effects: ["if service_request_id present and that request is TRIAGED: ServiceRequest TRIAGED -> LINKED"]
  - method: GET
    path: "/work-orders/{id}"
    description: "Fetch a work order (includes computed cost fields)"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/work-orders"
    description: "List work orders; filter by asset_id or service_request_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["asset_id?", "service_request_id?", "status?", "work_type?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/schedule"
    description: "Schedule a work order"
    roles: [Dispatcher]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: WorkOrder
    side_effects: ["DRAFT -> SCHEDULED"]
  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch a scheduled work order (activates reserved dispatches and approved permits)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["SCHEDULED -> DISPATCHED", "RESERVED dispatches -> ACTIVE", "APPROVED permits -> ACTIVE"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Start work"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["DISPATCHED -> IN_PROGRESS"]
  - method: POST
    path: "/work-orders/{id}/hold"
    description: "Put work on hold"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["IN_PROGRESS -> ON_HOLD"]
  - method: POST
    path: "/work-orders/{id}/resume"
    description: "Resume held work"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["ON_HOLD -> IN_PROGRESS"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete work: consume reservations, roll up cost, determine capitalization, release resources, close linked SR"
    roles: [CrewLead]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["IN_PROGRESS -> COMPLETED with the full completion cascade (see §1.2)"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-terminal work order and release all reserved resources"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["{DRAFT,SCHEDULED,DISPATCHED,IN_PROGRESS,ON_HOLD} -> CANCELLED with release cascade (see §1.2)"]

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Create a crew"
    roles: [Supervisor]
    code: 201
    input: [name, crew_type, hourly_rate_cents]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a crew"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews"
    description: "List crews"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["crew_type?", "status?", "limit?", "offset?"]
    output: Crew[]
    side_effects: []

  # ---- Dispatch ----
  - method: POST
    path: "/dispatches"
    description: "Reserve a crew to a scheduled work order for a time window (OCC on crew version)"
    roles: [Dispatcher]
    code: 201
    input: [work_order_id, crew_id, window_start, window_end, labor_hours, expected_crew_version]
    output: Dispatch
    side_effects: ["Dispatch created RESERVED", "compute labor_cost_cents (calculations.labor_cost)", "Crew AVAILABLE -> ON_ASSIGNMENT; committed_minutes += window", "increments Crew.version by 1"]
  - method: GET
    path: "/dispatches/{id}"
    description: "Fetch a dispatch"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: Dispatch
    side_effects: []
  - method: GET
    path: "/dispatches"
    description: "List dispatches; filter by work_order_id or crew_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["work_order_id?", "crew_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []
  - method: POST
    path: "/dispatches/{id}/cancel"
    description: "Cancel a dispatch and free the crew"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["{RESERVED,ACTIVE} -> CANCELLED", "Crew.committed_minutes -= window; Crew -> AVAILABLE when no remaining {RESERVED,ACTIVE} dispatch", "increments Crew.version by 1"]

  # ---- Yard ----
  - method: POST
    path: "/yards"
    description: "Create a storage yard"
    roles: [Supervisor]
    code: 201
    input: [name, location_desc]
    output: Yard
    side_effects: []
  - method: GET
    path: "/yards/{id}"
    description: "Fetch a yard"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: Yard
    side_effects: []
  - method: GET
    path: "/yards"
    description: "List yards"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: Yard[]
    side_effects: []

  # ---- MaterialItem ----
  - method: POST
    path: "/material-items"
    description: "Create a stocked material item in a yard"
    roles: [Supervisor]
    code: 201
    input: [material_type, yard_id, unit, on_hand_qty, unit_cost_cents, "reorder_point?"]
    output: MaterialItem
    side_effects: []
  - method: GET
    path: "/material-items/{id}"
    description: "Fetch a material item"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: MaterialItem
    side_effects: []
  - method: GET
    path: "/material-items"
    description: "List material items; filter by yard_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["material_type?", "yard_id?", "limit?", "offset?"]
    output: MaterialItem[]
    side_effects: []
  - method: POST
    path: "/material-items/{id}/restock"
    description: "Increase on-hand quantity"
    roles: [Supervisor]
    code: 200
    input: [qty]
    output: MaterialItem
    side_effects: ["MaterialItem.on_hand_qty += qty", "increments MaterialItem.version by 1"]

  # ---- MaterialReservation ----
  - method: POST
    path: "/material-reservations"
    description: "Reserve material against a work order (OCC on material item version)"
    roles: [Dispatcher, CrewLead]
    code: 201
    input: [work_order_id, material_item_id, qty, expected_material_item_version]
    output: MaterialReservation
    side_effects: ["MaterialReservation created RESERVED", "MaterialItem.reserved_qty += qty", "increments MaterialItem.version by 1"]
  - method: GET
    path: "/material-reservations/{id}"
    description: "Fetch a material reservation"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: MaterialReservation
    side_effects: []
  - method: GET
    path: "/material-reservations"
    description: "List material reservations; filter by work_order_id or material_item_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["work_order_id?", "material_item_id?", "status?", "limit?", "offset?"]
    output: MaterialReservation[]
    side_effects: []
  - method: POST
    path: "/material-reservations/{id}/release"
    description: "Release a reserved material reservation (returns reserved qty; on_hand unchanged)"
    roles: [Dispatcher, CrewLead]
    code: 200
    input: []
    output: MaterialReservation
    side_effects: ["RESERVED -> RELEASED", "MaterialItem.reserved_qty -= qty", "increments MaterialItem.version by 1"]

  # ---- ROWPermit ----
  - method: POST
    path: "/row-permits"
    description: "Request a right-of-way / utility coordination permit"
    roles: [Coordinator]
    code: 201
    input: [work_order_id, permit_type, gis_segment_id, window_start, window_end, "clearance_required?", "utility_company?"]
    output: ROWPermit
    side_effects: []
  - method: GET
    path: "/row-permits/{id}"
    description: "Fetch a permit"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: []
    output: ROWPermit
    side_effects: []
  - method: GET
    path: "/row-permits"
    description: "List permits; filter by work_order_id for FK reverse-reachability"
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: ["work_order_id?", "status?", "gis_segment_id?", "limit?", "offset?"]
    output: ROWPermit[]
    side_effects: []
  - method: POST
    path: "/row-permits/{id}/decision"
    description: "Approve or deny a requested permit (approval runs the segment overlap check)"
    roles: [Coordinator]
    code: 200
    input: [decision]
    output: ROWPermit
    side_effects: ["REQUESTED -> APPROVED or DENIED"]
  - method: POST
    path: "/row-permits/{id}/release"
    description: "Release an approved/active permit"
    roles: [Coordinator]
    code: 200
    input: []
    output: ROWPermit
    side_effects: ["{APPROVED,ACTIVE} -> RELEASED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for install-age, SLA, and all time math. Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default (never wall-clock)."
    roles: [Supervisor, Dispatcher, Inspector, CrewLead, Coordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to the supplied instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID header, or unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, illegal enum, out-of-range number, window_end <= window_start, or decision not in the allowed set"
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "asset id (path or FK) does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id does not exist"
  - id: ERR_SERVICE_REQUEST_NOT_FOUND
    http: 404
    condition: "service request id (path, FK, or duplicate_of_id) does not exist"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work order id (path or FK) does not exist"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crew id (path or FK) does not exist"
  - id: ERR_MATERIAL_ITEM_NOT_FOUND
    http: 404
    condition: "material item id (path or FK) does not exist"
  - id: ERR_MATERIAL_RESERVATION_NOT_FOUND
    http: 404
    condition: "material reservation id does not exist"
  - id: ERR_ROW_PERMIT_NOT_FOUND
    http: 404
    condition: "row permit id does not exist"
  - id: ERR_DISPATCH_NOT_FOUND
    http: 404
    condition: "dispatch id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not legal from the resource's current (non-terminal) state"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "action attempted on a terminal resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "inspection decider X-User-ID equals inspection.inspector_id on acceptance"
  - id: ERR_ROW_NOT_APPROVED
    http: 409
    condition: "work order dispatch attempted while a clearance_required ROW permit is not APPROVED"
  - id: ERR_NO_DISPATCH_FOR_WORKORDER
    http: 409
    condition: "work order dispatch attempted with no RESERVED crew dispatch"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "dispatch window (plus 30-minute buffer) overlaps an existing {RESERVED,ACTIVE} window on the same crew"
  - id: ERR_ROW_SEGMENT_CONFLICT
    http: 409
    condition: "permit approval window intersects another {APPROVED,ACTIVE} permit's closed window on the same gis_segment_id"
  - id: ERR_INSUFFICIENT_MATERIAL
    http: 409
    condition: "reservation qty exceeds MaterialItem.available_qty"
  - id: ERR_STALE_MATERIAL_VERSION
    http: 412
    condition: "expected_material_item_version != MaterialItem.version on reservation creation"
  - id: ERR_STALE_CREW_VERSION
    http: 412
    condition: "expected_crew_version != Crew.version on dispatch creation"
  - id: ERR_DUPLICATE_SELF
    http: 409
    condition: "service request triaged as a duplicate of itself"
  - id: ERR_ASSET_HAS_OPEN_WORKORDER
    http: 409
    condition: "asset retire attempted while a non-terminal work order references it"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Supervisor
    description: "Asset/crew/material stewardship, inspection adjudication, asset retirement"
    identity: opaque
    exclusive_operations:
      - "POST /assets"
      - "POST /assets/{id}/retire"
      - "POST /inspections/{id}/decision"
      - "POST /crews"
      - "POST /material-items"
      - "POST /material-items/{id}/restock"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: Inspector
    description: "Field inspection authoring and submission"
    identity: opaque
    exclusive_operations:
      - "POST /inspections"
      - "POST /inspections/{id}/submit"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: Dispatcher
    description: "311 intake, work-order lifecycle, crew dispatch, material reservation"
    identity: opaque
    exclusive_operations:
      - "POST /service-requests"
      - "POST /service-requests/{id}/triage"
      - "POST /work-orders"
      - "POST /work-orders/{id}/schedule"
      - "POST /work-orders/{id}/dispatch"
      - "POST /work-orders/{id}/cancel"
      - "POST /dispatches"
      - "POST /dispatches/{id}/cancel"
    shared_operations:
      - "POST /material-reservations (with CrewLead)"
      - "POST /material-reservations/{id}/release (with CrewLead)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: CrewLead
    description: "Field execution of work orders and material consumption"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/hold"
      - "POST /work-orders/{id}/resume"
      - "POST /work-orders/{id}/complete"
    shared_operations:
      - "POST /material-reservations (with Dispatcher)"
      - "POST /material-reservations/{id}/release (with Dispatcher)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: Coordinator
    description: "Right-of-way and utility coordination permits"
    identity: opaque
    exclusive_operations:
      - "POST /row-permits"
      - "POST /row-permits/{id}/decision"
      - "POST /row-permits/{id}/release"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
