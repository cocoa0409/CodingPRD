            - "GET /marketplace/placements?application_id=${app_id} returns the same 1 row"

      - name: generate_matches_replaces_prior_generation
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/marketplace/requisitions/{id}/generate-matches
        distinguishing_aspect: "generate-matches is idempotent per requisition: a second generation after the nurse pool changed replaces prior non-suppressed Match rows rather than appending — the list length reflects the latest pool only."
        test_recipe:
