              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
