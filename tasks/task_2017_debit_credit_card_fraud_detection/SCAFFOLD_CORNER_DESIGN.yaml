# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# (task 2017). Breadth walk over the claim-extraction guide; sections are the
# guide's nine sections. Instances already exercised as failure paths of §1.8
# are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: account_created_with_system_defaults
        claim_type: creation
        grounds: [entities.Account, 'endpoints["POST /fraudops/accounts"]']
        distinguishing_aspect: "A fresh account exposes every computed/system default: ACTIVE status, zero ledgers, LOW tier, version 1."
        test_recipe:
          setup: ["Empty DB; clock at default"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EN1", cardholder_name: "Ent One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager }
          assert:
            - "Account.${acct}.account_status == ACTIVE"
            - "Account.${acct}.credit_balance_cents == 0 and open_alert_count == 0 and rolling_90d_loss_cents == 0"
            - "Account.${acct}.risk_tier == LOW"
            - "Account.${acct}.version == 1 and id is a server-minted UUID"
      - name: account_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Account]
        distinguishing_aspect: "Client-supplied version/id in the create payload are ignored, not honored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EN2", cardholder_name: "Ent Two", home_country: "US", version: 99 }, as: FraudOpsManager, captures: { acct: "$.data.id", v: "$.data.version" } }
          trigger:
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager }
          assert:
            - "Account.${acct}.version == 1 (client-sent 99 ignored)"
      - name: account_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Account.fields.account_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required account_number yields ERR_INVALID_REQUEST 400 and creates nothing."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fraudops/accounts", payload: { cardholder_name: "No Number", home_country: "US" }, as: FraudOpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_INVALID_REQUEST; GET /fraudops/accounts afterwards shows total_count == 0"
      - name: card_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", 'endpoints["GET /fraudops/cards/{id}"]']
        distinguishing_aspect: "A well-formed UUID that does not exist returns 404 ERR_NOT_FOUND (not 400/500)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fraudops/cards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FraudOpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 404 with error == ERR_NOT_FOUND"
      - name: list_pagination_defaults_and_has_more
        claim_type: listing
        grounds: [response_envelope, 'endpoints["GET /fraudops/accounts"]']
        distinguishing_aspect: "Default pagination (limit 10, offset 0) and has_more flip at the page boundary."
        test_recipe:
          setup: ["Two accounts exist"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-PG1", cardholder_name: "Pg One", home_country: "US" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-PG2", cardholder_name: "Pg Two", home_country: "US" }, as: FraudOpsManager }
          trigger:
            - { call: "GET /fraudops/accounts", as: FraudOpsManager }
            - { call: "GET /fraudops/accounts?limit=1&offset=0", as: FraudOpsManager }
          assert:
            - "unparametrized list: total_count == 2, has_more == false, 2 items returned (limit defaulted to 10)"
            - "limit=1: 1 item, total_count == 2, has_more == true"
      - name: card_computed_status_input_ignored
        claim_type: computed_fields
        grounds: [entities.Card.fields.card_status]
        distinguishing_aspect: "Client-passed card_status on create is ignored; the state machine's initial_state wins."
        test_recipe:
          setup: ["One ACTIVE account"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EN3", cardholder_name: "Ent Three", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EN3", product_type: "CREDIT", network: "VISA", card_status: "HARD_CLOSED" }, as: FraudOpsManager, captures: { card: "$.data.id", st: "$.data.card_status" } }
          assert:
            - "Card.${card}.card_status == ACTIVE (client-supplied HARD_CLOSED ignored)"
      - name: card_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Card.fields.product_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An out-of-enum product_type is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One ACTIVE account"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EN4", cardholder_name: "Ent Four", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EN4", product_type: "AMEX", network: "VISA" }, as: FraudOpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_INVALID_REQUEST"
      - name: replacement_chain_reverse_lookup
        claim_type: retrieval
        grounds: [entities.Card.fields.replaces_card_id, 'endpoints["GET /fraudops/cards"]']
        distinguishing_aspect: "The self-referential reissue chain is walkable backwards: GET /cards?replaces_card_id=<old> finds the replacement minted by an APPROVE decision."
        test_recipe:
          setup:
            - "Account/card; ruleset active; txn 40000 at M-EN5 in window; event confirmed (decision PENDING)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EN5", cardholder_name: "Ent Five", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EN5", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-EN5", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway }
            - { call: "POST /fraudops/compromised-card-events", payload: { network_source: "CAMS", event_reference: "CAMS-EN5", merchant_id: "M-EN5", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }, as: FraudOpsManager, captures: { ev: "$.data.id" } }
            - { call: "POST /fraudops/compromised-card-events/${ev}/confirm", as: FraudOpsManager }
            - { call: "GET /fraudops/reissue-decisions?card_id=${card}", as: FraudOpsManager, captures: { dec: "$.data[0].id" } }
            - { call: "POST /fraudops/reissue-decisions/${dec}/decide", payload: { decision: "APPROVE" }, as: FraudOpsManager, captures: { repl: "$.data.replacement_card_id" } }
          trigger:
            - { call: "GET /fraudops/cards?replaces_card_id=${card}", as: FraudOpsManager }
          assert:
            - "the filtered list has exactly 1 card: ${repl}"
            - "Card.${repl}.replaces_card_id == ${card} and fraud_flag == WATCH"

  - section: state_machines
    instances:
      - name: card_unblock_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Card.SOFT_BLOCKED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Unblock is defined only from SOFT_BLOCKED; an ACTIVE card rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Account with ACTIVE card"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM1", cardholder_name: "Sm One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/cards/${card}/unblock", as: FraudAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_INVALID_STATE; Card.${card}.card_status remains ACTIVE"
      - name: hard_closed_card_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Card.ACTIVE_to_HARD_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From HARD_CLOSED every further transition (unblock, another block) is rejected."
        test_recipe:
          setup: ["Account with card blocked HARD"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM2", cardholder_name: "Sm Two", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM2", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "HARD", reason: "CONFIRMED_FRAUD" }, as: FraudOpsManager }
          trigger:
            - { call: "POST /fraudops/cards/${card}/unblock", as: FraudOpsManager, captures: { err1: "$.data.error_id" } }
            - { call: "POST /fraudops/cards/${card}/block", payload: { block_type: "SOFT", reason: "ANALYST_REVIEW" }, as: FraudOpsManager, captures: { err2: "$.data.error_id" } }
          assert:
            - "both attempts rejected with ERR_INVALID_STATE"
            - "Card.${card}.card_status == HARD_CLOSED"
      - name: alert_created_in_open_with_initial_priority
        claim_type: initial_state
        grounds:
          - state_machines.FraudAlert
          - calculations.alert_priority
          - entities.FraudAlert.fields.sla_expires_at
        distinguishing_aspect: "New MANUAL alert starts OPEN with priority 25 (LOW tier + band 25) and sla_expires_at exactly created_at + 72h."
        test_recipe:
          setup: ["Clock at 2026-08-01T00:00:00Z; account with card, no other alerts"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM3", cardholder_name: "Sm Three", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM3", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { al: "$.data.id", prio: "$.data.priority", sla: "$.data.sla_expires_at" } }
          assert:
            - "FraudAlert.${al}.alert_status == OPEN and assigned_to_user_id == null and reopen_count == 0"
            - "priority == 25 (LOW 0 + MANUAL band 25)"
            - "sla_expires_at == 2026-08-04T00:00:00Z (created_at + 72h exactly)"
      - name: alert_expires_after_sla_and_locks
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FraudAlert.OPEN_to_EXPIRED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "At exactly created_at + 72h (inclusive boundary) the alert flips to EXPIRED on next touch; EXPIRED is terminal — claim afterwards fails."
        test_recipe:
          setup: ["Alert created at 2026-08-01T00:00:00Z; clock advanced to exactly 2026-08-04T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM4", cardholder_name: "Sm Four", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM4", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { al: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: FraudOpsManager }
            - { call: "GET /fraudops/fraud-alerts/${al}", as: FraudOpsManager, captures: { st: "$.data.alert_status" } }
            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "alert_status == EXPIRED at exactly +72h (>= boundary)"
            - "claim on EXPIRED alert rejected with ERR_INVALID_STATE"
      - name: ruleset_activate_from_active_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RuleSet.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activate is defined only from DRAFT; activating an already-ACTIVE ruleset fails even though the endpoint and role are correct."
        test_recipe:
          setup: ["Ruleset created by analyst-1 and activated by mgr-1 (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_INVALID_STATE; ruleset_status remains ACTIVE"
      - name: chargeback_withdraw_after_credit_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ChargebackCase.FILED_to_WITHDRAWN
          - errors[ERR_CHARGEBACK_INVALID_STATE]
        distinguishing_aspect: "Withdraw is defined only from FILED; after the provisional credit posts it is impossible to withdraw."
        test_recipe:
          setup: ["Account/card; ruleset active; txn 40000 APPROVE; chargeback posted 15000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM6", cardholder_name: "Sm Six", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM6", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 40000, merchant_id: "M-SM6", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases", payload: { auth_transaction_id: "${t}", reason_code: "4855", provisional_credit_cents: 15000 }, as: RecoverySpecialist, captures: { cb: "$.data.id" } }
            - { call: "POST /fraudops/chargeback-cases/${cb}/post-provisional-credit", as: RecoverySpecialist }
          trigger:
            - { call: "POST /fraudops/chargeback-cases/${cb}/withdraw", as: RecoverySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_CHARGEBACK_INVALID_STATE; cb_status remains PROVISIONAL_CREDIT_POSTED; balance unchanged (15000)"
      - name: recovery_paid_before_accepted_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RecoveryFiling.ACCEPTED_to_PAID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PAID is reachable only from ACCEPTED; marking PAID straight from FILED is rejected even with a valid paid_cents."
        test_recipe:
          setup: ["Finalized loss 110000 (txn 200000 VISA confirmed FRAUD); recovery filing claimed 110000 still FILED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM7", cardholder_name: "Sm Seven", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM7", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 200000, merchant_id: "M-SM7", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway, captures: { t: "$.data.id" } }
            - { call: "GET /fraudops/fraud-alerts?auth_transaction_id=${t}", as: FraudOpsManager, captures: { al: "$.data[0].id" } }
            - { call: "POST /fraudops/fraud-alerts/${al}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/verification-contacts", payload: { alert_id: "${al}", channel: "VOICE" }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { vc: "$.data.id" } }
            - { call: "POST /fraudops/verification-contacts/${vc}/complete", payload: { outcome: "CONFIRMED_FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/fraud-alerts/${al}/resolve", payload: { resolution: "FRAUD" }, as: FraudAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /fraudops/loss-entries", payload: { account_id: "${acct}", transaction_ids: ["${t}"] }, as: LossAccountant, captures: { loss: "$.data.id" } }
            - { call: "POST /fraudops/loss-entries/${loss}/book", as: LossAccountant, as_user_id: "acct-1" }
            - { call: "POST /fraudops/loss-entries/${loss}/finalize", payload: { final_amount_cents: 110000 }, as: LossAccountant, as_user_id: "acct-1" }
            - { call: "POST /fraudops/recovery-filings", payload: { loss_entry_id: "${loss}", network_reference: "NR-SM7", claimed_cents: 110000 }, as: RecoverySpecialist, as_user_id: "rec-1", captures: { fil: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/recovery-filings/${fil}/mark-outcome", payload: { outcome: "PAID", paid_cents: 110000 }, as: RecoverySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "error == ERR_INVALID_STATE (FILED -> PAID skips ACCEPTED); filing_status remains FILED; loss outstanding still 110000"
      - name: reissue_auto_approve_after_due_date
        claim_type: valid_transition
        grounds:
          - state_machines.ReissueDecision.PENDING_to_AUTO_APPROVED
          - entities.ReissueDecision.fields.due_at
        distinguishing_aspect: "A PENDING decision whose due_at is reached by the logical clock auto-approves on next touch (>= due_at, inclusive), minting the replacement card without any decide call."
        test_recipe:
          setup:
            - "Account/card; ruleset active; txn 40000 at M-SM8 in window; event confirmed at 2026-08-02T12:00:00Z (due_at = 2026-08-07T12:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-SM8", cardholder_name: "Sm Eight", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-SM8", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
