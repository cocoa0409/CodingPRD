      - name: reposition_task_selector_picks_earliest_created_unit
        claim_type: computed_read
        grounds:
          - "calculations.reposition_cost"
          - "endpoints[POST /rental-network/reposition-tasks]"
        distinguishing_aspect: "With two AVAILABLE units of the same type at the from-location, the task binds the one with earlier created_at (never id); provisional cost for NORTH->SOUTH (LONG band) == 52000."
        test_recipe:
          setup: ["two units U-early then U-late at a NORTH location; destination SOUTH location with an ACTIVE dealer"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-E4", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_a: $.data.id }
            - call: "POST /rental-network/locations"
              payload: { location_code: "MIA-E4", city: "Miami", geo_zone: "SOUTH", storage_capacity: 10 }
              as: NetworkAdmin
              captures: { loc_b: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-E4A", name: "Dealer E4A", location_id: "${loc_a}" }
              as: NetworkAdmin
              captures: { dlr_a: $.data.id }
            - call: "POST /rental-network/dealers"
              payload: { dealer_code: "D-E4B", name: "Dealer E4B", location_id: "${loc_b}" }
              as: NetworkAdmin
              captures: { dlr_b: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-E4-EARLY", equipment_type: "TRUCK_10FT", dealer_id: "${dlr_a}" }
              as: NetworkAdmin
              captures: { u_early: $.data.id }
            - call: "POST /rental-network/equipment-units"
              payload: { unit_code: "U-E4-LATE", equipment_type: "TRUCK_10FT", dealer_id: "${dlr_a}" }
              as: NetworkAdmin
              captures: { u_late: $.data.id }
          trigger:
            - call: "POST /rental-network/reposition-tasks"
              payload: { from_location_id: "${loc_a}", to_location_id: "${loc_b}", equipment_type: "TRUCK_10FT" }
              as: NetworkAdmin
              captures: { task: $.data.id }
          assert:
            - "RepositionTask.${task}.equipment_unit_id == ${u_early} (earliest created_at, NOT the later unit)"
            - "RepositionTask.${task}.estimated_reposition_cost_cents == 52000 (NORTH->SOUTH is LONG band)"
            - "EquipmentUnit.${u_early}.status == REPOSITIONING; EquipmentUnit.${u_late}.status == AVAILABLE"

      - name: reposition_complete_cost_includes_idle_penalty
        claim_type: correct_result
        grounds:
          - "calculations.reposition_cost"
        distinguishing_aspect: "Completing a task more than 48 logical hours after creation adds IDLE_PENALTY_CENTS: NORTH->SOUTH LONG task completed at +49h costs 52000 + 6000 + 15000 = 73000; completed at +47h costs 58000."
        test_recipe:
          setup: ["two LONG tasks created at clock T0; first completed at T0+47h, second at T0+49h"]
          setup_api_calls:
            - call: "POST /rental-network/locations"
              payload: { location_code: "PHX-E5", city: "Phoenix", geo_zone: "NORTH", storage_capacity: 10 }
              as: NetworkAdmin
