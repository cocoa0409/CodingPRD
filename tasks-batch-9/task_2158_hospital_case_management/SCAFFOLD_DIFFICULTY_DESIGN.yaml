  - rule_id: transitive_cascade
    instances:

      - name: choice_documentation_cascade_depth_four_to_delay_union
        grounds:
          - state_machines.Referral.CHOICE_PENDING_to_PLACED
          - state_machines.BedOffer.OFFERED_to_ACCEPTED_BY_PATIENT
          - state_machines.Barrier.OPEN_to_RESOLVED
          - calculations.avoidable_delay_hours
          - calculations.barrier_posture_rollup
        distinguishing_aspect: |
          Cascade of depth 4 originating at POST /referrals/{id}/document-choice: hop 1 flips the
          chosen BedOffer to ACCEPTED_BY_PATIENT, hop 2 is caused by hop 1 and flips the Referral
          to PLACED, hop 3 is caused by hop 2 and RESOLVES the episode's BED_AVAILABILITY barrier,
          hop 4 is caused by hop 3 and recomputes avoidable_delay_hours from 48.0 (open) to a
          closed 48.0 union with barrier_posture falling to CLEAR. Each link is caused by the
          previous link, not by the original request.
