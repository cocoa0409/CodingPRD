              payload: { name: "Heritage Graded", benefit_type: "GRADED_BENEFIT", base_monthly_rate_per_1000_cents: 400, loan_apr: 0.08, max_loan_to_cash_value_pct: 0.90, cash_value_factor_per_1000_cents: 1500, cash_value_vesting_years: 3, grace_period_days: 31, reinstatement_window_days: 180, min_issue_age: 45, max_issue_age: 85, face_tiers: [{tier_name: "SMALL", min_face_cents: 100000, max_face_cents: 1000000, tier_load_pct: 0.0}], age_bands: [{band_name: "A", min_age: 45, max_age: 85, age_factor: 1.0}], surrender_charge_tiers: [{min_gross_cents: 0, max_gross_cents: 99999999, charge_pct: 0.0}] }
              as: PolicyAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Ca Sc", date_of_birth: "1960-06-15", gender: "MALE", tobacco_use: false, state_code: "TX" }
              as: Underwriter
              captures: { app_person_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${app_person_id}", product_plan_id: "${plan_id}", requested_face_amount_cents: 1000000 }
              as: Underwriter
              captures: { application_id: $.data.id }
            - call: "POST /applications/${application_id}/questionnaire"
              payload: { terminal_illness: false, aids_hiv: false, nursing_home_confined: false, major_condition_last_2y: false }
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Underwriter
            - call: "POST /applications/${application_id}/submit"
              payload: {}
              as: Underwriter
            - call: "POST /applications/${application_id}/issue"
              payload: { policyholder_user_id: "ph_ca" }
              as: PolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-02-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "GET /policies/${policy_id}"
              payload: {}
              as: PolicyAdmin
              captures: { pv: $.data.version }
            - call: "POST /policy-loans"
              payload: { policy_id: "${policy_id}", expected_policy_version: "${pv}", principal_cents: 5000 }
              as: PolicyAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2031-04-01T00:00:00Z" }
              as: PolicyAdmin
          trigger:
            - call: "POST /policies/${policy_id}/lapse"
              payload: {}
              as: PolicyAdmin
            - call: "GET /policy-loans/${loan_id}"
              payload: {}
              as: PolicyAdmin
              captures: { st: $.data.status }
          assert:
            - "Policy.${policy_id}.coverage_status == LAPSED"
            - "PolicyLoan.${loan_id}.status == CALLED (cascaded from lapse)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: issue_response_reflects_all_pinned_fields_immediately
        claim_type: immediate
        grounds: ["state_machines.Application.APPROVED_to_ISSUED", "entities.Policy.fields.coverage_status"]
        excluded_because:
          difficulty_instance: transitive_cascade / issue_creates_policy_depth2
          rationale: "Immediate visibility of the issued Policy's ACTIVE coverage_status and pinned face/premium in the same response is asserted by the depth-2 cascade difficulty instance."
