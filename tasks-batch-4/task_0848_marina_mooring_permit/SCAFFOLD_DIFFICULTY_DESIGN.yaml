              captures: { boaterA: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boaterA}", name: "VA", length_ft: 30, registration_number: "REG-OA", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
              captures: { vesselA: $.data.id }
            - call: "POST /marina/permits"
              payload: { marina_id: "${marina_id}", boater_id: "${boaterA}", vessel_id: "${vesselA}", requested_berth_type: "SLIP", requested_size_class: "MEDIUM", season_year: 2026 }
              as: Harbormaster
              captures: { permitA: $.data.id, invA: $.data.invoice_id }
            - call: "POST /marina/invoices/${invA}/pay"
              payload: { amount_cents: 120000 }
              as: Harbormaster
            - call: "POST /marina/boaters"
              payload: { full_name: "BB", email: "bb@example.com", residency_status: "RESIDENT" }
              as: Harbormaster
              captures: { boaterB: $.data.id }
            - call: "POST /marina/vessels"
              payload: { boater_id: "${boaterB}", name: "VB", length_ft: 30, registration_number: "REG-OB", registration_expiry_date: "2026-12-31", has_holding_tank: false }
              as: Harbormaster
