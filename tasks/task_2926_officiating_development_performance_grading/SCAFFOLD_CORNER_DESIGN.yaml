            - call: "POST /advancement-applications/${app_id}/submit-to-committee"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { err_low_average: $.data.error_id }
            - call: "GET /advancement-applications/${app_id}"
              payload: {}
              as: FieldEvaluator
              captures: { lo_status_end: $.data.status }
          assert:
            - "${lo1_composite} == 76.10 and the first submit returns HTTP 422 with ${err_too_few} == ERR_EVALUATION_REQUIREMENTS_NOT_MET (1 < MIN_EVALUATIONS 2 + return_count 0)"
            - "${lo2_composite} == 71.10 (29.60 + 24.50 + 17.00) and ${lo_avg} == 73.60"
            - "the second submit also returns HTTP 422 with ${err_low_average} == ERR_EVALUATION_REQUIREMENTS_NOT_MET because 73.60 < 75.00"
            - "${lo_status_end} == SCREENED — a failed submit is not a transition"

      - name: postseason_lock_with_a_game_in_progress_is_rejected
        claim_type: violation_error
        grounds:
