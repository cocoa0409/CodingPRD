              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000019", model_line: "LX500" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
