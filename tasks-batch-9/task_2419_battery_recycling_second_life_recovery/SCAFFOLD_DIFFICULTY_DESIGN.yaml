            - "ProcessingCampaign.${camp_id}.status == SCHEDULED"

      - name: mass_balance_constraint_precedes_missing_index_price_on_finalize
        grounds:
          - validations[priority=11]
          - validations[priority=13]
          - errors[ERR_MASS_BALANCE_OUT_OF_TOLERANCE]
          - errors[ERR_INDEX_PRICE_UNAVAILABLE]
          - calculations.lot_mass_balance
          - calculations.feedstock_payable_value
        distinguishing_aspect: |
          Priority pair 11 vs 13 - quantitative floor versus money gate, both HTTP 422: the
          finalize would compute mass_balance_pct 75.00 (below the 97.00 floor) AND would need an
          NI index quote that was never published for the FINAL re-pricing, and the response must
          be ERR_MASS_BALANCE_OUT_OF_TOLERANCE, proving the constraint layer runs before the
          fiscal layer.
        test_recipe:
