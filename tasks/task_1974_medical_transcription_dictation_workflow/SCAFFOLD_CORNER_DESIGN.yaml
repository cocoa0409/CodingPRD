        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window; job J submitted"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: Provider, as_user_id: "${p}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); no QAReview recorded"

      - name: client_admin_cannot_claim_job
        claim_type: role_exclusive_denied
        grounds:
          - "roles[Editor].exclusive_operations"
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "Claim is Editor-exclusive; ClientAdmin (clinic-side) gets 403 — vendor/clinic role families are disjoint."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P; job J QUEUED"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id } }
          trigger:
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "00000000-0000-4000-8000-0000000000aa" }, as: ClientAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403) — role check (P2) precedes even editor existence"

      - name: provider_cannot_sign_other_providers_transcript
        claim_type: role_exclusive_denied
        grounds:
          - "roles[Provider].identity"
          - "errors[ERR_FORBIDDEN_OWNERSHIP]"
        distinguishing_aspect: "Entity-backed ownership on signature: P2 holds the right role but the job's provider is P1 — 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), providers P1 and P2, editor E with wide window; P1's job delivered (transcript T DELIVERED)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P One", specialty: GENERAL }, as: ClientAdmin, captures: { p1: $.data.id } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P Two", specialty: GENERAL }, as: ClientAdmin, captures: { p2: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p1}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p1}", captures: { j: $.data.id } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "GET /transcripts?dictation_job_id=${j}", payload: {}, as: VendorAdmin, captures: { t: "$.data[0].id" } }
          trigger:
            - { call: "POST /transcripts/${t}/sign", payload: {}, as: Provider, as_user_id: "${p2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_OWNERSHIP (403); transcript stays DELIVERED, signed_at null"

      - name: qa_supervisor_shared_reads_allowed
        claim_type: role_shared_allowed
