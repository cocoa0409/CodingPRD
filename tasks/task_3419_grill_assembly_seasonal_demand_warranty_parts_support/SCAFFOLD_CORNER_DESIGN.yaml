            - { call: "POST /grillops/parts", payload: { part_number: "BRN-1", component: "BURNER", compatible_model_codes: ["GX-100"], supersession_chain_id: "CH-B", chain_position: 1, unit_cost_cents: 3200, stock_quantity: 0 }, as: PlannerAdmin, captures: { p1: "$.data.id" } }
