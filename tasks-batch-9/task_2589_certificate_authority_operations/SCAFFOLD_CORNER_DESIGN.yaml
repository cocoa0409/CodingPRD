              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_1"
              captures: { err_scope_window: $.data.error_id }
            - call: "POST /ca/misissuance-incidents"
              payload: { title: "Scope narrowed to a method the profile forbids", category: "DOMAIN_MISISSUANCE", scope_profile_id: "${profile_id}", scope_issued_from: "2026-07-01T00:00:00Z", scope_issued_to: "2026-07-31T00:00:00Z", scope_dcv_method: "HTTP_TOKEN" }
