            - "${ced_reinst} == 0"
            - "GET /programs/${prog_id}/fiduciary-transactions returns 3 rows and none was created by bind itself"

      - name: excluded_signdown_variants_diverge_on_the_same_lines
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: signdown_pro_rata_versus_lead_protected_on_signing_line_percentages
          rationale: |
            The Variant Divergence claim for calculations.signing_down_allocation — the two methods
            producing different signed_line_pct values from identical written lines, both summing to
            exactly 100.0000 — is asserted by §1.8 rule 1 across two mirrored programs, including the
            0.0001-step remainder distribution.

      - name: excluded_ceding_commission_provisional_versus_final
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: ceding_commission_provisional_flat_versus_final_sliding_on_layer_money
          rationale: |
            The Reconciliation claim for calculations.ceding_commission_settlement — the provisional
            amount set at bind, the sliding amount set at settlement, and
            ceding_commission_delta_minor tying the two together — is asserted end to end by §1.8
            rule 1, including the COMMISSION_MIN_PCT / COMMISSION_MAX_PCT clamps.

      - name: excluded_volume_tier_selected_from_the_undiscounted_premium
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: cat_layer_premium_pins_volume_tier_to_provisional_not_discounted_premium
          rationale: |
            The tiered_pricing claim for calculations.layer_technical_premium — the tier chosen from
            provisional_premium_minor and never re-derived from the discounted result — is asserted by
            §1.8 rule 2 on the 105,000,000 / 97,125,000 pair that straddles VOLUME_TIER_3_MINOR.

      - name: excluded_brokerage_rounded_per_line_then_summed
        claim_type: aggregation
        excluded_because:
          difficulty_instance: bind_brokerage_rounds_per_signing_line_then_sums_leaving_one_minor_unit
          rationale: |
            The aggregation claim for calculations.brokerage_and_net_remittance — rounding each
            signing line before summation rather than rounding the total once, and the resulting
            rounding_residue_minor — is asserted by §1.8 rule 2 on a three-line layer engineered to
            leave a one-unit residue.

      - name: excluded_capacity_variant_selection_between_lifetime_and_windowed
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: buffered_capacity_window_counts_a_line_from_a_program_incepting_exactly_on_the_boundary
          rationale: |
            The Variant Selection claim for calculations.reinsurer_aggregate_capacity — the stored
            LIFETIME_TOTAL field versus the WINDOWED_AT_FIRM_ORDER gate, and which lines each one
            reads — is asserted by §1.8 rule 8, which places a program incepting exactly
            AGGREGATION_BUFFER_DAYS before the target and shows it inside the closed window.

  # ===========================================================================
  # SECTION 4 — VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:
      - name: registry_and_program_creation_rejects_duplicate_names_bad_periods_and_prior_mismatch
        claim_type: Violation → Error
        grounds:
          - validations[priority=49]
          - validations[priority=43]
          - validations[priority=51]
          - errors.ERR_DUPLICATE_NAME
          - errors.ERR_TREATY_PERIOD_INVALID
          - errors.ERR_RENEWAL_PRIOR_MISMATCH
        distinguishing_aspect: |
          Three independent creation-time rules, each with its own error id and status: the name
          uniqueness rule applies to BOTH counterparty registries (cedents and reinsurers) with the
          same ERR_DUPLICATE_NAME at 409; the treaty period must be a non-empty half-open interval, so
          expiry equal to inception is 422 ERR_TREATY_PERIOD_INVALID; and a supplied prior_program_id
          must be the immediately preceding underwriting year of the same cedent and line of business,
          so a 2027 program citing a 2025 prior is 422 ERR_RENEWAL_PRIOR_MISMATCH even though the
          cedent and the line of business match.
        test_recipe:
          setup:
            - "One cedent, one market, and one 2025 PROPERTY program for that cedent covering 2025-01-01 to 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 1000000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2025", line_of_business: "PROPERTY", underwriting_year: 2025, inception_date: "2025-01-01T00:00:00.000Z", expiry_date: "2026-01-01T00:00:00.000Z", estimated_premium_income_minor: 1600000000 }
              as: BrokerPlacementLead
              captures: { prior_id: $.data.id }
          trigger:
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "GBLON", financial_rating: "BBB" }
              as: PlatformAdmin
              captures: { e_ced_dup: $.data.error_id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "A", capacity_limit_minor: 500000000, max_line_pct: 50.0000 }
              as: PlatformAdmin
              captures: { e_re_dup: $.data.error_id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Empty Period", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-06-01T00:00:00.000Z", expiry_date: "2026-06-01T00:00:00.000Z", estimated_premium_income_minor: 100000000 }
              as: BrokerPlacementLead
              captures: { e_period: $.data.error_id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2027", line_of_business: "PROPERTY", underwriting_year: 2027, inception_date: "2027-01-01T00:00:00.000Z", expiry_date: "2028-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, prior_program_id: "${prior_id}" }
              as: BrokerPlacementLead
              captures: { e_prior: $.data.error_id }
          assert:
            - "${e_ced_dup} == ERR_DUPLICATE_NAME with HTTP 409 and GET /cedents returns exactly 1 row"
            - "${e_re_dup} == ERR_DUPLICATE_NAME with HTTP 409 and GET /reinsurers returns exactly 1 row"
            - "${e_period} == ERR_TREATY_PERIOD_INVALID with HTTP 422"
            - "${e_prior} == ERR_RENEWAL_PRIOR_MISMATCH with HTTP 422 — the 2027 year is not 2025 + 1"
            - "GET /programs returns exactly 1 row: the 2025 program"
            - "Cedent.${ced_id}.name is unchanged and Reinsurer.${alpha_id}.security_rating is still AA"

      - name: layer_structure_rule_outranks_the_sublimit_rule_on_a_doubly_invalid_layer
        claim_type: Priority Ordering
        grounds:
          - validations[priority=52]
          - validations[priority=53]
          - errors.ERR_LAYER_STRUCTURE_INVALID
          - errors.ERR_SUBLIMIT_EXCEEDS_LIMIT
        distinguishing_aspect: |
          A layer that breaks the type coherence rule (priority 52) AND the sublimit rule (priority
          53) in the same request reports ERR_LAYER_STRUCTURE_INVALID, never ERR_SUBLIMIT_EXCEEDS_LIMIT
          — and the type coherence rule is three-sided: a QUOTA_SHARE layer needs attachment 0,
          cession_pct > 0 and base_rate_pct == cession_pct, while an EXCESS_OF_LOSS layer needs
          attachment > 0, cession_pct == 0 and ceding_commission_pct == 0. Only when the structure is
          coherent does the sublimit rule get to speak.
        test_recipe:
          setup:
            - "A DRAFT program for one cedent; no layer exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Structures 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "QS with attachment and a fat sublimit", layer_type: "QUOTA_SHARE", attachment_minor: 500000000, limit_minor: 50000000, cession_pct: 40.0000, base_rate_pct: 40.0000, subject_premium_base_minor: 200000000, expected_loss_cost_minor: 30000000, sublimit_minor: 90000000 }
              as: BrokerPlacementLead
              captures: { e_both: $.data.error_id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "QS with a mismatched base rate", layer_type: "QUOTA_SHARE", attachment_minor: 0, limit_minor: 50000000, cession_pct: 40.0000, base_rate_pct: 35.0000, subject_premium_base_minor: 200000000, expected_loss_cost_minor: 30000000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { e_rate: $.data.error_id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "XL with a ceding commission", layer_type: "EXCESS_OF_LOSS", attachment_minor: 1000000000, limit_minor: 500000000, cession_pct: 0.0000, base_rate_pct: 5.0000, subject_premium_base_minor: 1000000000, expected_loss_cost_minor: 20000000, ceding_commission_pct: 20.0000 }
              as: BrokerPlacementLead
              captures: { e_comm: $.data.error_id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "Coherent CAT with too big a sublimit", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, cession_pct: 0.0000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, sublimit_minor: 1000000001 }
              as: BrokerPlacementLead
              captures: { e_sub: $.data.error_id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "Coherent CAT with sublimit equal to limit", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, cession_pct: 0.0000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, sublimit_minor: 1000000000 }
              as: BrokerPlacementLead
              captures: { ok_layer: $.data.id, ok_sub: $.data.sublimit_minor }
          assert:
            - "${e_both} == ERR_LAYER_STRUCTURE_INVALID with HTTP 422 — priority 52 speaks before priority 53"
            - "${e_rate} == ERR_LAYER_STRUCTURE_INVALID with HTTP 422 (base_rate_pct must equal cession_pct)"
            - "${e_comm} == ERR_LAYER_STRUCTURE_INVALID with HTTP 422 (an excess layer may not carry a ceding commission)"
