  - rule_id: transitive_cascade
    instances:
      - name: weather_freeze_cascade
        grounds:
          - calculations.weather_policy_evaluation
          - state_machines.Route.PUBLISHED_to_CANCELLED
          - state_machines.RouteStop.PLANNED_to_CANCELLED
          - state_machines.WashOrder.ASSIGNED_to_WEATHER_HELD
        distinguishing_aspect: |
          Depth-3 chain from a weather evaluation trigger: freeze cancels the Route
          (link 1); the route cancellation cancels its RouteStops and releases their
          van water (link 2); each stop cancellation weather-holds its WashOrder
          (link 3). Originating trigger: POST /fleet-wash/weather/evaluations.
        test_recipe:
          setup:
            - "RETAIL customer; site S1; 5 SEDANs; orders O1 (window 2026-08-10T13:00Z) and O2 (14:00Z) CONFIRMED"
            - "Route R on 2026-08-10 (BASIC van loaded 96) PUBLISHED with stops for O1 and O2; van water_reserved_gal == 32 (2 x 16)"
