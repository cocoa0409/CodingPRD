              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "S1-CHKN", description: "Chicken Breast alt 1", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000, substitution_group_code: "CHKN", stock_status: "OUT_OF_STOCK" }
              as: SystemAdmin
