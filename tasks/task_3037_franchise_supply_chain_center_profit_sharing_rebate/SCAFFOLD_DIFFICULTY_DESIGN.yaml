              payload: { product_id: "${prod_id}", quantity: 100 }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_f1: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po1}/submit"
              payload: { expected_store_version: "${store_v_f1}" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_f2: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po2}/submit"
              payload: { expected_store_version: "${store_v_f2}" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_id}"
              payload: {}
              as: Any
              captures: { store_v_f3: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po3}/submit"
              payload: { expected_store_version: "${store_v_f3}" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /supply-centers/${center_id}/purchase-orders/${po1}/confirm"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/purchase-orders/${po2}/reject"
              payload: { reason: "test" }
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_id}/purchase-orders/${po3}/cancel"
              payload: { reason: "test" }
              as: StoreManager
