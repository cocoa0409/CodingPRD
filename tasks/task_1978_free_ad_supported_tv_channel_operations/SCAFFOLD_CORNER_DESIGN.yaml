            - { call: "POST /v1/revenue-reports/${rp}/finalize", payload: {}, as: FinanceAnalyst, as_user_id: "fin-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and report_status stays PROVISIONAL"

      - name: partner_cannot_list_viewership_events
        claim_type: exclusive_operation_denial
        grounds: ["roles"]
        distinguishing_aspect: "Viewership-event reads are internal-only; the entity-backed DistributorPartner role is absent from the endpoint's roles."
        test_recipe:
          setup: ["Channel ch; platform p1 exist"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch PV2", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "GET /v1/viewership-events", payload: {}, as: DistributorPartner, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and http status == 403"

      - name: channel_programmer_cannot_create_rights_grant
        claim_type: exclusive_operation_denial
        grounds: ["roles"]
        distinguishing_aspect: "Rights management is exclusive to ContentLicensing; ChannelProgrammer is denied even with a valid payload."
