          - entities.AdvancementApplication.fields.evaluation_average
        distinguishing_aspect: "Priority 23 has two independent legs: with one report the count leg fails, and with two reports averaging 73.60 the MIN_EVAL_AVERAGE 75.00 leg fails — the same error_id for both, and the application stays SCREENED."
        test_recipe:
