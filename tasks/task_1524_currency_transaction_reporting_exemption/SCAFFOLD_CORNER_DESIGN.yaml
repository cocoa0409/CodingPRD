        distinguishing_aspect: "A FILED CTR (amendable state) whose business_date + 45 days (2026-09-15) has passed rejects amendment with ERR_AMENDMENT_WINDOW_EXPIRED — isolating the temporal rule from the state rule covered in §1.8."
        test_recipe:
          setup: ["branch, customer; deposit 1100000 on 2026-08-01 -> CTR validated + FILED; clock advanced to 2026-09-20 (window closed 2026-09-15)"]
          setup_api_calls:
