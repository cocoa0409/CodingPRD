              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/activate"
              payload: { sow_text: "w" }
              as: Client
              as_user_id: "${cid}"
              captures: { cv0: $.data.version }
            - call: "POST /contracts/${ct}/milestones"
              payload: { title: "M1", amount_cents: 20000, ordinal: 1 }
