          - entities.EventMarking.fields.weight
        distinguishing_aspect: "A CLINICAL_SEIZURE marking created while TaperPlan.current_step == 2 freezes weight == CLASS_WEIGHT[CLINICAL_SEIZURE] * TAPER_PROVOKED_DISCOUNT == 0.750 (the step reaches TAPER_DISCOUNT_MIN_STEP 2), so adjudication banks 0.750 and capture_adequacy_index becomes 0.188 against target_event_count 4 — not the undiscounted 0.250."
