              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { card_v: $.data.version }
          trigger:
            - call: "POST /livescan/submissions"
              payload: { card_id: "${card_id}", retention_requested: true, expected_card_version: "${card_v}" }
              as: LivescanTechnician
              as_user_id: "tech-01"
              captures: { sub_id: $.data.id }
          assert:
            - "FeeAssessment(submission_id=${sub_id}).processing_surcharge_cents == 162"
            - "FeeAssessment(submission_id=${sub_id}).vendor_tax_cents == 72"
            - "FeeAssessment(submission_id=${sub_id}).total_cents == 5868"
            - "FeeAssessment(submission_id=${sub_id}).total_cents != 5869"
            - "FeeAssessment(submission_id=${sub_id}).payer_regime == APPLICANT_PAID"
            - "FeeAssessment(submission_id=${sub_id}).discount_cents == 0"

