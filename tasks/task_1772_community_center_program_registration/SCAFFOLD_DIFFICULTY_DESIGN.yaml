          setup:
            - "Season PUBLISHED (budget 100000); session fees 2500/2500, capacity 5, min_enrollment 1, one meeting 2026-09-20, ACCEPTED ENROLLMENT_BASIS contract with revenue_share_bp 3333 and guarantee 0"
