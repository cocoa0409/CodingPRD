        distinguishing_aspect: |
          A five-link chain whose third link is only reachable because eligibility is judged on
          type_family while crew ratings are held against type_designator: effectuating a
          B38M substitute for a B738 original re-points the airframes (hop 1), re-points only the
          legs whose scheduled_out is at or after effective_from (hop 2 - LD2 but not LD1, so
          repointed_leg_count is 1), cancels the re-pointed leg because the rostered captain holds
          only B738 (hop 3), and recomputes crew exposure plus the OPEN period, which now credits
          the surviving 330-minute SCHEDULED leg only, giving 5.5000 credited hours and a
          2,640,000-cent provisional charge (hops 4-5). A same-designator-only reading of
          eligibility makes hop 3 unreachable; ignoring effective_from re-points both legs.
