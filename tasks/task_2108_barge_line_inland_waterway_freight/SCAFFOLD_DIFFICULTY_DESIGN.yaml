# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds only in elements declared in SCAFFOLD.yaml sections 1.1-1.7.
# Every numeric literal in an `assert:` line was produced by executing the relevant
# SCAFFOLD.yaml `calculations[].formula` against the pinned setup inputs.
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: demurrage_pooled_net_versus_per_barge_gross_on_freight_contract
        grounds:
          - calculations.demurrage_assessment
          - calculations.linehaul_freight_charge
          - entities.FreightContract.fields.laytime_hours
          - entities.BargeAssignment.fields.gross_laytime_hours
          - entities.BargeAssignment.fields.net_laytime_hours
          - endpoints.GET /freight-contracts/{freight_contract_id}/charge-breakdown
        distinguishing_aspect: |
          This dual variant lives in the BILLING domain on FreightContract: from one
          set of discharge timestamps the PROVISIONAL reading charges each barge its
          own free laytime measured from tender (34 chargeable hours, 1105000 cents)
          while the FINAL reading pools free laytime across the contract's barges and
          measures only working time plus a notice grace (16 chargeable hours, 520000
          cents), a 585000-cent divergence on identical rows.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; commodity CORN in group GRAIN; one EFFECTIVE GRAIN tariff at 1.2378 cents per ton-mile with min charge 250000, demurrage 32500 cents/hour and the four-tier fuel table; one diesel posting of 300 cents dated 2026-08-03; MEMPHIS gauge at 18.0 feet."
            - "Shipper Delta Grain Co with a 900000000-cent credit limit; FreightContract for 3400 tons over river miles 600 -> 200 (400 miles), laytime 12 hours, declared value 22000 cents/ton, ACTIVE with the tariff and a 0.045 fuel percentage pinned."
            - "Tow M/V Cairo carrying two barges (1700 and 1650 tons) sealed, departed and arrived; both assignments discharged - barge 1 tendered 06:00, started 18:00, finished next day 14:00 at 1687 tons; barge 2 tendered 08:00, started 02:00 next day, finished 09:30 at 1643 tons."
            - "Contract movement_status is DISCHARGED and billing_status is still NOT_BILLED, so neither variant has been frozen onto the row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: WaterwayAdmin
            - call: "POST /commodities"
              payload: { code: "CORN", commodity_group: "GRAIN", residue_class: "CLEAN", hazard_flag: false, stowage_factor: 1.28 }
              as: WaterwayAdmin
              captures: { corn_id: $.data.id }
            - call: "POST /tariff-filings"
              payload: { tariff_code: "T-GRAIN-2026", commodity_group: "GRAIN", base_rate_cents_per_ton_mile: 1.2378, min_charge_cents: 250000, demurrage_rate_cents_per_hour: 32500, fuel_surcharge_table: [{ threshold_cents_per_gallon: 200, pct: 0.0 }, { threshold_cents_per_gallon: 300, pct: 0.045 }, { threshold_cents_per_gallon: 400, pct: 0.09 }, { threshold_cents_per_gallon: 500, pct: 0.145 }], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: TariffAnalyst
              as_user_id: "analyst-1"
              captures: { tf_grain_id: $.data.id }
            - call: "POST /tariff-filings/${tf_grain_id}/file"
              payload: {}
              as: TariffAnalyst
              as_user_id: "analyst-1"
            - call: "POST /tariff-filings/${tf_grain_id}/effectuate"
              payload: {}
              as: RateAuthority
              as_user_id: "rate-1"
            - call: "POST /fuel-index-postings"
              payload: { posting_date: "2026-08-03", diesel_price_cents_per_gallon: 300 }
              as: TariffAnalyst
              as_user_id: "analyst-1"
            - call: "POST /river-stage-readings"
              payload: { gauge_station: "MEMPHIS", reading_at: "2026-08-02T06:00:00Z", stage_feet: 18.0 }
              as: WaterwayAdmin
            - call: "POST /shippers"
              payload: { name: "Delta Grain Co", credit_limit_cents: 900000000 }
              as: ContractManager
              captures: { sh_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-1001", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /barges"
              payload: { hull_number: "BL-1002", capacity_tons: 1750, light_draft_feet: 1.5, tons_per_inch_immersion: 17.0 }
              as: WaterwayAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: WaterwayAdmin
            - call: "POST /freight-contracts"
              payload: { shipper_id: "${sh_id}", commodity_id: "${corn_id}", contracted_tons: 3400, origin_mile: 600, destination_mile: 200, laytime_hours: 12, declared_value_cents_per_ton: 22000, claim_settlement_basis: "DEDUCTIBLE" }
              as: ContractManager
              captures: { fc_id: $.data.id }
            - call: "POST /freight-contracts/${fc_id}/book"
              payload: {}
              as: ContractManager
            - call: "POST /freight-contracts/${fc_id}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /tows"
              payload: { towboat_name: "M/V Cairo", horsepower: 6000, origin_mile: 600, destination_mile: 200, controlling_gauge_station: "MEMPHIS" }
              as: TowboatDispatcher
              captures: { tow_id: $.data.id }
            - call: "POST /tows/${tow_id}/barge-assignments"
              payload: { barge_id: "${b1_id}", freight_contract_id: "${fc_id}", loaded_tons: 1700, cut_position: 1 }
              as: TowboatDispatcher
              captures: { ba1_id: $.data.id }
            - call: "POST /tows/${tow_id}/barge-assignments"
              payload: { barge_id: "${b2_id}", freight_contract_id: "${fc_id}", loaded_tons: 1650, cut_position: 2 }
              as: TowboatDispatcher
              captures: { ba2_id: $.data.id }
            - call: "POST /tows/${tow_id}/seal"
              payload: {}
              as: TowboatDispatcher
            - call: "POST /tows/${tow_id}/depart"
              payload: { departed_at: "2026-08-14T12:00:00Z" }
              as: TowboatDispatcher
            - call: "POST /tows/${tow_id}/arrive"
              payload: { arrived_at: "2026-08-20T04:00:00Z" }
              as: TowboatDispatcher
            - call: "POST /barge-assignments/${ba1_id}/record-arrival"
              payload: { arrived_at: "2026-08-20T06:00:00Z" }
              as: TowboatDispatcher
            - call: "POST /barge-assignments/${ba1_id}/start-unload"
              payload: { unload_started_at: "2026-08-20T18:00:00Z" }
              as: TowboatDispatcher
            - call: "POST /barge-assignments/${ba1_id}/finish-unload"
              payload: { unload_finished_at: "2026-08-21T14:00:00Z", discharged_tons: 1687 }
              as: TowboatDispatcher
            - call: "POST /barge-assignments/${ba2_id}/record-arrival"
              payload: { arrived_at: "2026-08-20T08:00:00Z" }
              as: TowboatDispatcher
            - call: "POST /barge-assignments/${ba2_id}/start-unload"
              payload: { unload_started_at: "2026-08-21T02:00:00Z" }
              as: TowboatDispatcher
            - call: "POST /barge-assignments/${ba2_id}/finish-unload"
              payload: { unload_finished_at: "2026-08-21T09:30:00Z", discharged_tons: 1643 }
              as: TowboatDispatcher
          trigger:
            - call: "GET /freight-contracts/${fc_id}/charge-breakdown"
              payload: { variant: "PROVISIONAL" }
              as: ContractManager
            - call: "GET /freight-contracts/${fc_id}/charge-breakdown"
              payload: { variant: "FINAL" }
              as: ContractManager
          assert:
            - "BargeAssignment.${ba1_id}.gross_laytime_hours == 32 and BargeAssignment.${ba1_id}.net_laytime_hours == 20"
            - "BargeAssignment.${ba2_id}.gross_laytime_hours == 26 and BargeAssignment.${ba2_id}.net_laytime_hours == 8"
            - "PROVISIONAL breakdown demurrage_cents == 1105000"
            - "FINAL breakdown demurrage_cents == 520000"
            - "PROVISIONAL breakdown linehaul_cents == 1658652 and FINAL breakdown linehaul_cents == 1648749"
            - "PROVISIONAL breakdown total_cents == 2795717 and FINAL breakdown total_cents == 2209299"
            - "FreightContract.${fc_id}.demurrage_cents == 0 - neither variant is persisted by a read"

      - name: claim_settlement_deductible_versus_franchise_on_cargo_claim
        grounds:
