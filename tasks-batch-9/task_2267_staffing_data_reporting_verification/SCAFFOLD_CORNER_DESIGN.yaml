          - state_machines.HourEntry.ACTIVE_to_VOID
        distinguishing_aspect: "VOID is the terminal value of the entry_status dimension, so a second void returns ERR_HOUR_ENTRY_VOIDED and does not bump the submission version a second time."
        test_recipe:
          setup:
