  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promotion_window_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_PROMOTION_OVERLAP]
          - entities.Promotion.fields.starts_at
          - entities.Promotion.fields.ends_at
        distinguishing_aspect: |
          On the Promotion resource with HALF-OPEN [start, end) semantics: a new promotion whose window
          strictly overlaps an existing one is rejected with ERR_PROMOTION_OVERLAP, but an adjacent window
          (new.starts_at == existing.ends_at) is accepted. Distinct interval geometry from the closed+buffer blackout.
        test_recipe:
          setup:
            - "Program (DRAFT ok for config) with promotion A [2026-06-01, 2026-07-01); attempt promotion B [2026-06-15, 2026-07-15) which overlaps."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/promotions"
              payload: { program_id: "${prog_id}", name: "A", bonus_multiplier: 2.0, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z", min_eligible_cents: 0 }
              as: ProgramAdmin
              captures: { promo_a: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/promotions"
              payload: { program_id: "${prog_id}", name: "B", bonus_multiplier: 3.0, starts_at: "2026-06-15T00:00:00Z", ends_at: "2026-07-15T00:00:00Z", min_eligible_cents: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PROMOTION_OVERLAP"

      - name: blackout_window_overlap_closed_with_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_BLACKOUT_OVERLAP]
          - entities.TransferBlackout.fields.starts_at
          - entities.TransferBlackout.fields.ends_at
        distinguishing_aspect: |
          On the TransferBlackout resource with CLOSED [start, end] semantics PLUS a 60-minute buffer: a new
          blackout starting 30 minutes after an existing one ends (inside the buffer, non-overlapping in raw time)
          is still rejected with ERR_BLACKOUT_OVERLAP — different interval geometry (buffer) and different resource.
        test_recipe:
          setup:
            - "Partner P with a SCHEDULED blackout [2026-06-14T00:00, 2026-06-14T01:00]; attempt a second blackout starting 2026-06-14T01:30 (30 min after, inside the 60-min buffer)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/partners"
              payload: { program_id: "${prog_id}", name: "Air", transfer_block_size: 100, min_transfer_points: 100 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /partners/${partner_id}/blackouts"
              payload: { partner_account_id: "${partner_id}", starts_at: "2026-06-14T00:00:00Z", ends_at: "2026-06-14T01:00:00Z" }
              as: ProgramAdmin
              captures: { bo_a: $.data.id }
          trigger:
            - call: "POST /partners/${partner_id}/blackouts"
              payload: { partner_account_id: "${partner_id}", starts_at: "2026-06-14T01:30:00Z", ends_at: "2026-06-14T02:30:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BLACKOUT_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_submit_reverse_conserves_member_available_points
        grounds:
          - state_machines.PartnerTransfer.SUBMITTED_to_REVERSED
          - calculations.member_balance
          - entities.PointsLot.fields.source_type
          - entities.Member.fields.available_points
        distinguishing_aspect: |
          Conserved quantity = Member.available_points (redeemable balance). After a transfer of 500 (burn) the
          balance is 400; after reverse (compensating TRANSFER_IN_REVERSAL mint of 500) it returns to exactly 900:
          available_points_before == available_points_after == 900.
        test_recipe:
          setup:
            - "ACTIVE program; partner P ACTIVE block_size=100 min_transfer=100; member M has 900 available points; clock outside any blackout."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/partners"
              payload: { program_id: "${prog_id}", name: "Air", transfer_block_size: 100, min_transfer_points: 100 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 90000 }
              as: ProgramAdmin
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { m_v: $.data.version }
            - call: "POST /partner-transfers"
              payload: { member_id: "${m_id}", partner_account_id: "${partner_id}", loyalty_points: 500, expected_member_version: "${m_v}" }
              as: ProgramAdmin
              captures: { xfer_id: $.data.id }
          trigger:
            - call: "POST /partner-transfers/${xfer_id}/reverse"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "PartnerTransfer.${xfer_id}.status == REVERSED"
            - "Member.${m_id}.available_points == 900"

      - name: redeem_confirm_cancel_conserves_qualifying_points_window
        grounds:
          - state_machines.Redemption.CONFIRMED_to_CANCELLED
          - calculations.tier_evaluation
          - entities.PointsTransaction.fields.qualifying_points
          - entities.Member.fields.qualifying_points_window
        distinguishing_aspect: |
          Conserved quantity = Member.qualifying_points_window (tier-qualifying total), a DIFFERENT conserved
          quantity than redeemable balance. Burns and compensating EARN_BONUS mints carry qualifying_points=0,
          so qualifying_points_window stays exactly 9000 before confirm, after confirm, and after cancel.
        test_recipe:
          setup:
            - "ACTIVE program; member M spent 900000c => qualifying_points_window=9000; reward R point_cost=600 stock=5; redemption confirmed then cancelled."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "GOLD", qualify_threshold: 5000, earn_multiplier: 1.5, transfer_ratio: 0.8, rank: 2 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/rewards"
              payload: { program_id: "${prog_id}", name: "R", point_cost: 600, tier_discount_pct: 0.0, stock: 5 }
              as: ProgramAdmin
              captures: { reward_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 900000 }
              as: ProgramAdmin
            - call: "POST /redemptions"
              payload: { member_id: "${m_id}", lines: [ { reward_id: "${reward_id}", quantity: 1 } ] }
              as: ProgramAdmin
              captures: { red_id: $.data.id }
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { m_v: $.data.version }
            - call: "POST /redemptions/${red_id}/confirm"
              payload: { expected_member_version: "${m_v}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemptions/${red_id}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "Redemption.${red_id}.status == CANCELLED"
            - "Member.${m_id}.qualifying_points_window == 9000"
            - "Member.${m_id}.current_tier_code == GOLD"
            - "Member.${m_id}.available_points == 9000"
