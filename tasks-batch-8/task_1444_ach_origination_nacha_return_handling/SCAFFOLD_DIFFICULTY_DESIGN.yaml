  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_entries_append
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_ORIGINATOR_NOT_ACTIVE]
          - errors[ERR_EXPOSURE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (p5) vs business_fiscal (p10): the append BOTH
          targets a WATCH originator (not ACTIVE — state violation) AND would
          push debit exposure past the limit (6000000 outstanding + 4000001 >
          10000000 — fiscal violation). The state error wins.
        test_recipe:
          setup:
            - "Originator approved with limit 10000000; file with DEBIT 6000000 appended while ACTIVE; originator then moved ACTIVE -> WATCH via risk case"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Lambda Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v1: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v1}"
                entries:
                  - { direction: "DEBIT", amount_cents: 6000000, receiver_account: "l-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_v2: "$.data.version" }
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc_id: "$.data.id" }
            - call: "POST /ach/risk-cases/${rc_id}/resolve"
              payload: { action: "WATCH" }
              as: OdfiRiskOfficer
          trigger:
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v2}"
                entries:
                  - { direction: "DEBIT", amount_cents: 4000001, receiver_account: "l-2", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ORIGINATOR_NOT_ACTIVE (http 409) — state beats fiscal even though 6000000 + 4000001 > 10000000 also holds"
            - "AchFile.${f_id}.entry_count == 1 (rejected append is atomic)"
            - "Originator.${org_id}.outstanding_exposure_debit_cents == 6000000"

      - name: safety_vs_temporal_on_reversal
        grounds:
          - validations[priority=8]
          - validations[priority=8]
          - errors[ERR_INVALID_REVERSAL_REASON]
          - errors[ERR_REVERSAL_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair business_safety (p7) vs business_temporal (p8): the
          reversal request BOTH uses WRONG_AMOUNT on a CREDIT entry (NACHA
          safety rule — only DUPLICATE_ENTRY may reverse a credit) AND arrives
          after the 5-banking-day window (settled 2026-08-03, requested
          2026-08-12 > expiry 2026-08-10). The safety error wins.
        test_recipe:
          setup:
            - "Originator ACTIVE, limit 100000000; CREDIT entry 800000 settled on 2026-08-03 (window_expires_at 2026-08-10)"
            - "Clock advanced to 2026-08-12T10:00:00Z (past expiry)"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Mu Corp", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 100000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "CREDIT", amount_cents: 800000, receiver_account: "m-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${f_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { e_id: "$.data[0].id" }
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T10:00:00Z" }
              as: OdfiOperations
          trigger:
            - call: "POST /ach/ach-entries/${e_id}/reversals"
              payload: { reason: "WRONG_AMOUNT" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REVERSAL_REASON (http 422) — safety beats temporal even though the 5-banking-day window is also expired"
            - "No ReversalRequest persisted: GET /ach/ach-entries/${e_id}/reversal-requests returns empty list"

