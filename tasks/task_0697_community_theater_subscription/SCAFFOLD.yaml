scenario: "Community Theater & Performing-Arts Subscription: season subscription & seat renewal, single-ticket & dynamic pricing, show-run/performance calendar, donor/patron & seat-naming, volunteer/cast & audition, exchange/flex-pass, accessibility (ASL/audio-description), box-office & will-call"

domain_name: community-theater-subscription
api_prefix: /box-office

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite seat inventory reserved/held/committed/released per performance
  secondary_archetype: pricing_engine          # dynamic single-ticket pricing + tiered subscription/renewal + donor-level discounts
  complexity_layers:
    - optimistic_concurrency                   # seat-hold create-with-supersede on Performance.version
    - cascading_side_effects                   # performance cancel -> ticket refunds -> donor credit -> subscription seat release
    - dual_variant_calculation                 # renewal repricing vs single-ticket dynamic pricing; exchange vs flex-pass fee
    - scheduled_actions                         # logical clock gates renewal window, on-sale window, will-call cutoff

  entity_topology: flat                         # peer entities under one api_prefix, linked by FK fields in body (no deep URL nesting)
  state_machine_shape: cyclic                   # Subscription renewal loop + Performance scheduling loop; parallel dims on Ticket; independent Audition lifecycle
  relationship_patterns:
    - one_to_many                               # Performance -> Ticket, Subscription -> SubscriptionSeat
    - many_to_many                              # Subscription <-> Seat across performances via SubscriptionSeat
    - cross_aggregate                           # Ticket.subscription_id crosses the Subscription aggregate; Donation.seat_id crosses Seat

  role_model: peer_roles                        # Patron owns own subscriptions/tickets/donations; BoxOfficeAgent runs sales/will-call; ArtisticDirector runs casting; SeasonAdmin configures
  consistency_model: immediate

  entity_count: 12
  state_machine_count: 8
  calculation_count: 7
  validation_layers: 9
  endpoint_count: 60
  error_code_count: 30
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Season name e.g. '2026-2027 Mainstage'" }
      - { name: status, type: enum, source: system, description: "PLANNING | RENEWAL_OPEN | ON_SALE | CLOSED", default: "PLANNING", constraints: "PLANNING | RENEWAL_OPEN | ON_SALE | CLOSED" }
      - { name: renewal_window_opens_at, type: datetime, source: input, description: "ISO8601 UTC; renewing subscribers may renew at/after this instant" }
      - { name: renewal_window_closes_at, type: datetime, source: input, description: "ISO8601 UTC; after this instant unrenewed priority seats are released to single sale" }
      - { name: base_subscription_fee_cents, type: integer, source: input, description: "Per-seat full-season base price before tier/discount", constraints: ">= 0" }
      - { name: loyalty_renewal_discount_pct, type: number, source: input, description: "Fractional discount granted to a renewing subscriber, e.g. 0.10", default: 0.10, constraints: "0 <= x < 1" }
      - { name: released_seat_count, type: integer, source: computed, description: "Count of SubscriptionSeats moved to RELEASED for this season's subscriptions" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the season this production belongs to" }
      - { name: title, type: string, source: input, description: "Production title e.g. 'Our Town'" }
      - { name: accessibility_offered, type: array, source: input, description: "Subset of {ASL, AUDIO_DESCRIPTION, OPEN_CAPTION}; services this production can stage", default: [], constraints: "values in {ASL, AUDIO_DESCRIPTION, OPEN_CAPTION}" }
      - { name: status, type: enum, source: system, description: "DRAFT | ANNOUNCED", default: "DRAFT", constraints: "DRAFT | ANNOUNCED" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: total_seat_count, type: integer, source: computed, description: "Count of Seats created under this venue" }

  - name: Seat
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this physical seat belongs to" }
      - { name: section, type: string, source: input, description: "Section label e.g. 'ORCH', 'BALC'" }
      - { name: row_label, type: string, source: input, description: "Row label e.g. 'A'" }
      - { name: seat_number, type: integer, source: input, description: "Seat number within the row", constraints: ">= 1" }
      - { name: price_tier, type: enum, source: input, description: "PREMIUM | STANDARD | VALUE; selects the base price band", constraints: "PREMIUM | STANDARD | VALUE" }
      - { name: is_accessible, type: boolean, source: input, description: "True if wheelchair-accessible / companion seat", default: false }
      - { name: naming_status, type: enum, source: system, description: "UNNAMED | NAMED; set NAMED when a fulfilled seat-naming Donation names this seat", default: "UNNAMED", constraints: "UNNAMED | NAMED" }
      - { name: named_plaque_text, type: string, source: system, description: "Plaque text copied from the naming Donation when NAMED; null while UNNAMED" }

  - name: Performance
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; the production this show-run instance stages" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this performance runs in" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC curtain time" }
      - { name: on_sale_at, type: datetime, source: input, description: "ISO8601 UTC; single tickets sellable at/after this instant" }
      - { name: will_call_cutoff_minutes, type: integer, source: input, description: "Minutes before curtain after which will-call pickup is barred", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | ON_SALE | SETTLED | CANCELLED; cyclic between SCHEDULED and ON_SALE", default: "DRAFT", constraints: "DRAFT | SCHEDULED | ON_SALE | SETTLED | CANCELLED" }
      - { name: demand_multiplier, type: number, source: input, description: "Dynamic-pricing demand factor applied to seat base price", default: 1.0, constraints: ">= 0.5 and <= 3.0" }
      - { name: capacity, type: integer, source: computed, description: "Count of Seats in the bound venue at schedule time" }
      - { name: held_seat_count, type: integer, source: computed, description: "Count of Tickets in HELD fulfillment_status for this performance" }
      - { name: sold_seat_count, type: integer, source: computed, description: "Count of Tickets in ISSUED or COLLECTED fulfillment_status for this performance" }
      - { name: available_seat_count, type: integer, source: computed, description: "capacity - held_seat_count - sold_seat_count; never negative" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of price_cents over Tickets here whose payment_status=PAID" }

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only; equals X-User-ID when acting as Patron" }
      - { name: email, type: string, source: input, description: "Unique contact email", constraints: "unique among Patrons" }
      - { name: full_name, type: string, source: input, description: "Patron full name" }
      - { name: donor_level, type: enum, source: computed, description: "NONE | FRIEND | PATRON | BENEFACTOR; derived from lifetime fulfilled donation total", default: "NONE", constraints: "NONE | FRIEND | PATRON | BENEFACTOR" }
      - { name: lifetime_donation_cents, type: integer, source: computed, description: "Sum of amount_cents over this patron's FULFILLED Donations" }
      - { name: account_credit_cents, type: integer, source: computed, description: "Refund/credit balance issued by cancellations and exchanges; never negative" }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; the season subscribed to" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the owning patron" }
      - { name: prior_subscription_id, type: string, source: input, description: "FK -> Subscription.id; the prior-season subscription being renewed, null for brand-new", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RENEWAL_PENDING | RENEWED | LAPSED | CANCELLED; cyclic ACTIVE->RENEWAL_PENDING->RENEWED", default: "DRAFT", constraints: "DRAFT | ACTIVE | RENEWAL_PENDING | RENEWED | LAPSED | CANCELLED" }
      - { name: is_renewal, type: boolean, source: computed, description: "True when prior_subscription_id is non-null" }
      - { name: seat_count, type: integer, source: computed, description: "Count of SubscriptionSeats in ASSIGNED status on this subscription" }
      - { name: total_price_cents, type: integer, source: computed, description: "Sum of per-seat subscription prices computed by subscription_pricing at activation" }

  - name: SubscriptionSeat
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; the owning subscription" }
      - { name: seat_id, type: string, source: input, description: "FK -> Seat.id; the renewable physical seat held across the season" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RENEWAL_OFFERED | RELEASED; RENEWAL_OFFERED reserves the seat for the prior holder during the renewal window", default: "ASSIGNED", constraints: "ASSIGNED | RENEWAL_OFFERED | RELEASED" }
      - { name: per_seat_price_cents, type: integer, source: computed, description: "Subscription price attributed to this seat by subscription_pricing" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: performance_id, type: string, source: input, description: "FK -> Performance.id; the performance this ticket admits to" }
      - { name: seat_id, type: string, source: input, description: "FK -> Seat.id; the physical seat" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the buyer/holder" }
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; set when this ticket was issued from a subscription seat, null for single tickets", default: null }
      - { name: origin, type: enum, source: input, description: "SINGLE | SUBSCRIPTION; pricing path selector", constraints: "SINGLE | SUBSCRIPTION" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED; parallel dimension, evolves independently of fulfillment_status", default: "UNPAID", constraints: "UNPAID | PAID | REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "HELD | ISSUED | COLLECTED | EXCHANGED | VOID; parallel dimension", default: "HELD", constraints: "HELD | ISSUED | COLLECTED | EXCHANGED | VOID" }
      - { name: price_cents, type: integer, source: computed, description: "Face price computed by single_ticket_pricing (SINGLE) or copied from SubscriptionSeat (SUBSCRIPTION)" }
      - { name: hold_expires_at, type: datetime, source: computed, description: "Logical-clock instant after which an unpaid HELD ticket may be swept to VOID" }
      - { name: accessibility_service, type: enum, source: input, description: "NONE | ASL | AUDIO_DESCRIPTION | OPEN_CAPTION; requested seating service", default: "NONE", constraints: "NONE | ASL | AUDIO_DESCRIPTION | OPEN_CAPTION" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the donor" }
      - { name: seat_id, type: string, source: input, description: "FK -> Seat.id; the seat to name when this is a seat-naming gift, null for a plain gift", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Gift amount", constraints: ">= 1" }
      - { name: plaque_text, type: string, source: input, description: "Requested plaque text for seat-naming, null for plain gift", default: null }
      - { name: status, type: enum, source: system, description: "PLEDGED | FULFILLED | REFUNDED; FULFILLED counts toward donor_level and may name a seat", default: "PLEDGED", constraints: "PLEDGED | FULFILLED | REFUNDED" }

  - name: Exchange
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: original_ticket_id, type: string, source: input, description: "FK -> Ticket.id; the ticket being exchanged out" }
      - { name: target_performance_id, type: string, source: input, description: "FK -> Performance.id; performance the holder wants to move into" }
      - { name: target_seat_id, type: string, source: input, description: "FK -> Seat.id; requested seat at the target performance" }
      - { name: mode, type: enum, source: input, description: "FLEX_PASS | PAID_EXCHANGE; FLEX_PASS waives fee for subscribers, PAID_EXCHANGE charges a flat fee plus price delta", constraints: "FLEX_PASS | PAID_EXCHANGE" }
      - { name: status, type: enum, source: system, description: "REQUESTED | COMPLETED | DENIED; cyclic REQUESTED->DENIED->REQUESTED across attempts", default: "REQUESTED", constraints: "REQUESTED | COMPLETED | DENIED" }
      - { name: fee_cents, type: integer, source: computed, description: "Exchange fee computed by exchange_fee at completion" }
      - { name: price_delta_cents, type: integer, source: computed, description: "New-seat price minus original ticket price, floored at 0" }
      - { name: new_ticket_id, type: string, source: system, description: "Id of the replacement Ticket minted on COMPLETED, null otherwise" }

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only" }
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; the production being cast" }
      - { name: applicant_name, type: string, source: input, description: "Name of the auditioning performer" }
      - { name: role_applied_for, type: string, source: input, description: "Role label" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | AUDITIONED | CALLBACK | CAST | DECLINED; independent lifecycle from ticketing", default: "SCHEDULED", constraints: "SCHEDULED | AUDITIONED | CALLBACK | CAST | DECLINED" }
      - { name: cast_role, type: string, source: system, description: "Role this performer was cast in; set on CAST transition, null otherwise" }
      - { name: is_volunteer, type: boolean, source: system, description: "True when cast as unpaid volunteer; set on CAST transition", default: false }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: RENEWAL_OPEN
        trigger: "POST /box-office/seasons/{id}/open-renewal"
        actor: SeasonAdmin
        preconditions:
          - "logical clock >= renewal_window_opens_at"
        side_effects:
          - "For every ACTIVE prior-season Subscription seat, set matching SubscriptionSeat.status = RENEWAL_OFFERED (reserves the seat for the prior holder)"
      - from: RENEWAL_OPEN
        to: ON_SALE
        trigger: "POST /box-office/seasons/{id}/close-renewal"
        actor: SeasonAdmin
        preconditions:
          - "logical clock >= renewal_window_closes_at"
        side_effects:
          - "Every SubscriptionSeat still in RENEWAL_OFFERED transitions to RELEASED (prior holder did not renew); increments Season.released_seat_count per release (cascade: each release frees the Seat for single sale)"
      - from: ON_SALE
        to: CLOSED
        trigger: "POST /box-office/seasons/{id}/close"
        actor: SeasonAdmin
        preconditions:
          - "every Performance under this season's productions is in SETTLED or CANCELLED"
        side_effects:
          - "Season becomes immutable"

  - entity: Performance
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /box-office/performances/{id}/schedule"
        actor: SeasonAdmin
        preconditions:
          - "bound Production.status == ANNOUNCED"
          - "bound Venue has >= 1 Seat"
        side_effects:
          - "Snapshots capacity = count of Seats in the venue; available_seat_count = capacity"
      - from: SCHEDULED
        to: ON_SALE
        trigger: "POST /box-office/performances/{id}/open-sales"
        actor: BoxOfficeAgent
        preconditions:
          - "logical clock >= on_sale_at"
        side_effects: []
      - from: ON_SALE
        to: SCHEDULED
        trigger: "POST /box-office/performances/{id}/suspend-sales"
        actor: BoxOfficeAgent
        preconditions: []
        side_effects: ["No new single Tickets may be held until reopened (cyclic: may return to ON_SALE)"]
      - from: ON_SALE
        to: SETTLED
        trigger: "POST /box-office/performances/{id}/settle"
        actor: BoxOfficeAgent
        preconditions:
          - "logical clock >= starts_at"
        side_effects:
          - "Computes gross_sales_cents over PAID Tickets; remaining HELD unpaid Tickets cascade to fulfillment_status=VOID"
      - from: [DRAFT, SCHEDULED, ON_SALE]
        to: CANCELLED
        trigger: "POST /box-office/performances/{id}/cancel"
        actor: SeasonAdmin
        preconditions: []
        side_effects:
          - "Cascade depth-3: every non-VOID Ticket here -> fulfillment_status=VOID; each PAID such Ticket -> payment_status=REFUNDED which credits Patron.account_credit_cents by price_cents; each SUBSCRIPTION-origin Ticket so voided flips its SubscriptionSeat.status to RELEASED"

  - entity: Subscription
    field: status
    initial_state: DRAFT
    terminal_states: [LAPSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /box-office/subscriptions/{id}/activate"
        actor: BoxOfficeAgent
        preconditions:
          - "Subscription has >= 1 SubscriptionSeat in ASSIGNED"
          - "expected_season_version matches Season.version"
        side_effects:
          - "Runs subscription_pricing; sets per_seat_price_cents on each ASSIGNED SubscriptionSeat and total_price_cents; increments Season.version by 1"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /box-office/subscriptions/{id}/offer-renewal"
        actor: BoxOfficeAgent
        preconditions:
          - "bound Season.status == RENEWAL_OPEN"
        side_effects: ["Marks subscription eligible to spawn a successor subscription this cycle"]
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /box-office/subscriptions/{id}/confirm-renewal"
        actor: Patron
        preconditions:
          - "a successor Subscription with prior_subscription_id == this.id exists in ACTIVE"
        side_effects:
          - "Cascade: successor's RENEWAL_OFFERED SubscriptionSeats flip to ASSIGNED; loyalty_renewal_discount_pct applied via subscription_pricing on the successor"
      - from: RENEWAL_PENDING
        to: LAPSED
        trigger: "POST /box-office/subscriptions/{id}/lapse or system at close-renewal"
        actor: "BoxOfficeAgent or system"
        preconditions: []
        side_effects: ["This subscription's RENEWAL_OFFERED seats are released by the season close-renewal cascade"]
      - from: [DRAFT, ACTIVE, RENEWAL_PENDING]
        to: CANCELLED
        trigger: "POST /box-office/subscriptions/{id}/cancel"
        actor: Patron
        preconditions: []
        side_effects:
          - "Cascade: all ASSIGNED/RENEWAL_OFFERED SubscriptionSeats -> RELEASED; credits Patron.account_credit_cents by total_price_cents"

  - entity: Ticket
    field: "fulfillment_status (primary axis); payment_status is a parallel independent dimension on the same row"
    note: |
      The Ticket has TWO independent state dimensions. The transitions below are named on the fulfillment_status
      axis (HELD -> ISSUED -> COLLECTED, plus VOID / EXCHANGED) so their FROM_to_TO ids are bare state names.
      The payment_status axis (UNPAID -> PAID -> REFUNDED) advances on its own: the pay trigger moves
      fulfillment HELD->ISSUED while independently moving payment UNPAID->PAID; a cancellation moves payment
      PAID->REFUNDED without itself being a fulfillment transition.
    initial_state: HELD
    terminal_states: [COLLECTED, VOID, EXCHANGED]
    transitions:
      - from: HELD
        to: ISSUED
        trigger: "POST /box-office/tickets/{id}/pay"
        actor: "Patron or BoxOfficeAgent"
        preconditions:
          - "payment_status == UNPAID"
          - "bound Performance.status == ON_SALE"
        side_effects:
          - "payment_status -> PAID on the independent payment axis; recomputes Performance.held_seat_count, sold_seat_count and gross_sales_cents"
      - from: ISSUED
        to: COLLECTED
        trigger: "POST /box-office/tickets/{id}/will-call-pickup"
        actor: BoxOfficeAgent
        preconditions:
          - "payment_status == PAID"
          - "logical clock < (Performance.starts_at - will_call_cutoff_minutes minutes)"
        side_effects: []
      - from: HELD
        to: VOID
        trigger: "POST /box-office/tickets/{id}/release or system sweep at hold_expires_at"
        actor: "BoxOfficeAgent or system"
        preconditions:
          - "payment_status == UNPAID"
        side_effects: ["Frees the seat: recomputes Performance.held_seat_count and available_seat_count"]
      - from: ISSUED
        to: EXCHANGED
        trigger: "system on Exchange completion"
        actor: system
        preconditions:
          - "payment_status == PAID"
        side_effects: ["payment_status -> REFUNDED on this original ticket; a replacement Ticket is minted ISSUED with payment_status PAID for the target seat"]

  - entity: Audition
    field: status
    initial_state: SCHEDULED
    terminal_states: [CAST, DECLINED]
    transitions:
      - from: SCHEDULED
        to: AUDITIONED
        trigger: "POST /box-office/auditions/{id}/record"
        actor: ArtisticDirector
        preconditions: ["bound Production.status IN {DRAFT, ANNOUNCED}"]
        side_effects: []
      - from: AUDITIONED
        to: CALLBACK
        trigger: "POST /box-office/auditions/{id}/callback"
        actor: ArtisticDirector
        preconditions: []
        side_effects: []
      - from: [AUDITIONED, CALLBACK]
        to: CAST
        trigger: "POST /box-office/auditions/{id}/cast"
        actor: ArtisticDirector
        preconditions: ["no existing CAST Audition on this production already holds the same cast_role"]
        side_effects: ["Sets cast_role and is_volunteer on this Audition (the performer becomes cast/volunteer roster)"]
      - from: [SCHEDULED, AUDITIONED, CALLBACK]
        to: DECLINED
        trigger: "POST /box-office/auditions/{id}/decline"
        actor: ArtisticDirector
        preconditions: []
        side_effects: []

  - entity: Production
    field: status
    initial_state: DRAFT
    terminal_states: [ANNOUNCED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /box-office/productions/{id}/announce"
        actor: "SeasonAdmin or ArtisticDirector"
        preconditions: []
        side_effects: ["Production becomes eligible to back a SCHEDULED Performance"]

  - entity: Donation
    field: status
    initial_state: PLEDGED
    terminal_states: [REFUNDED]
    transitions:
      - from: PLEDGED
        to: FULFILLED
        trigger: "POST /box-office/donations/{id}/fulfill"
        actor: BoxOfficeAgent
        preconditions:
          - "if seat_id set, the Seat.naming_status == UNNAMED"
        side_effects:
          - "Runs lifetime_donation then donor_level (cross-entity: may promote Patron.donor_level); if seat_id set, Seat.naming_status -> NAMED and named_plaque_text = plaque_text"
      - from: FULFILLED
        to: REFUNDED
        trigger: "POST /box-office/donations/{id}/refund"
        actor: BoxOfficeAgent
        preconditions: []
        side_effects:
          - "Compensation: removes amount_cents from lifetime_donation and recomputes donor_level (may demote Patron.donor_level); seat naming is NOT reverted"

  - entity: Exchange
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED]
    transitions:
      - from: REQUESTED
        to: COMPLETED
        trigger: "POST /box-office/exchanges/{id}/complete"
        actor: BoxOfficeAgent
        preconditions:
          - "original_ticket.fulfillment_status == ISSUED and payment_status == PAID"
          - "target_seat belongs to target_performance's venue"
          - "target_seat free of a non-VOID ticket on target_performance"
          - "if pay_from_credit, Patron.account_credit_cents >= total_charge_cents"
        side_effects:
          - "Runs exchange_fee; original Ticket fulfillment_status -> EXCHANGED and payment_status -> REFUNDED; mints a replacement ISSUED/PAID Ticket on target_seat; sets new_ticket_id; if pay_from_credit debits account_credit_cents by total_charge_cents"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /box-office/exchanges/{id}/deny"
        actor: BoxOfficeAgent
        preconditions: []
        side_effects: ["Original Ticket unchanged; holder may submit a new Exchange (request/deny cycle)"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: subscription-activate-stale-season
    parent_entity: Season
    write_endpoint: "POST /box-office/subscriptions/{id}/activate"
    occ_field: "expected_season_version"
    description: |
      Activating a Subscription draws renewable seats from a Season whose pool
      may have shifted since the client last read it. The activation supersedes
      the client's view of which seats remain claimable; if the Season.version
      has advanced (another activation legitimately claimed seats and bumped the
      version) the client's view is stale and the activation is rejected on the
      stale-version check.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

  - rule_id: ticket-hold-stale-performance
    parent_entity: Performance
    write_endpoint: "POST /box-office/tickets"
    occ_field: "expected_performance_version"
    description: |
      Holding a single Ticket against a Performance whose version has advanced
      since the client last observed it is rejected. A prior hold legitimately
      claimed inventory and bumped Performance.version; the current writer's view
      of available_seat_count is therefore stale and the new hold is refused on
      the stale-version check.
    error_id: ERR_STALE_PERFORMANCE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: single_ticket_pricing
    trigger: "POST /box-office/tickets with origin=SINGLE (ticket hold)"
    algorithm: tiered_pricing
    formula: |
      tier_base = TIER_BASE_CENTS[seat.price_tier]            # PREMIUM/STANDARD/VALUE band
      raw = tier_base * performance.demand_multiplier
      # dynamic demand surcharge is applied on the tier band, then donor discount
      donor_pct = DONOR_DISCOUNT_PCT[patron.donor_level]      # NONE=0 .. BENEFACTOR=0.20
      price_cents = floor(raw * (1 - donor_pct))
      # accessibility services never raise price; companion/accessible seat priced at its own tier band
    input_set: "single Ticket at hold time; reads seat.price_tier, performance.demand_multiplier, patron.donor_level"
    constants:
      TIER_BASE_CENTS: { PREMIUM: 9000, STANDARD: 6000, VALUE: 3500 }
      DONOR_DISCOUNT_PCT: { NONE: 0.0, FRIEND: 0.05, PATRON: 0.10, BENEFACTOR: 0.20 }
    precision: "floor truncation to integer cents; multiply demand first, then apply donor discount, then floor"

  - name: subscription_pricing
    trigger: "subscription activate transition; confirm-renewal on successor"
    algorithm: tiered_pricing
    formula: |
      # Subscription price is the season base per seat, summed per ASSIGNED seat band weight, then renewal discount.
      per_seat = floor(season.base_subscription_fee_cents * TIER_WEIGHT[seat.price_tier])
      if subscription.is_renewal:
        per_seat = floor(per_seat * (1 - season.loyalty_renewal_discount_pct))
      SubscriptionSeat.per_seat_price_cents = per_seat
      total_price_cents = sum(per_seat over all ASSIGNED SubscriptionSeats)   # round-per-seat THEN sum (order pinned)
    input_set: "all ASSIGNED SubscriptionSeats on the subscription at activation; reads each seat's price_tier"
    constants:
      TIER_WEIGHT: { PREMIUM: 1.5, STANDARD: 1.0, VALUE: 0.6 }
    precision: "floor per seat FIRST, then sum across seats — sum-of-floors, NOT floor-of-sum; the per-seat floor is the pinned rounding boundary"

  - name: exchange_fee
    trigger: "Exchange completion (POST /box-office/exchanges/{id}/complete)"
    algorithm: threshold
    formula: |
      price_delta_cents = max(0, target_seat_single_price - original_ticket.price_cents)
      if exchange.mode == FLEX_PASS:
        # FLEX_PASS waives the flat fee only when the original ticket is subscription-origin
        if original_ticket.origin == SUBSCRIPTION: fee_cents = 0
        else:                                        fee_cents = FLEX_PASS_NONSUB_FEE_CENTS
      else:  # PAID_EXCHANGE
        fee_cents = PAID_EXCHANGE_FEE_CENTS
      total_charge_cents = fee_cents + price_delta_cents
    input_set: "the original Ticket, the target Seat single-ticket price (via single_ticket_pricing for the target performance/patron), exchange.mode"
    constants:
      PAID_EXCHANGE_FEE_CENTS: 800
      FLEX_PASS_NONSUB_FEE_CENTS: 500
    precision: "integer cents; price_delta floored at 0 — a cheaper target never yields a credit"

  - name: donor_level
    trigger: "Donation fulfill transition; recomputed on any donor amount change"
    algorithm: threshold
    formula: |
      lifetime_donation_cents = sum(amount_cents over patron's FULFILLED Donations)
      donor_level =
        BENEFACTOR if lifetime_donation_cents >= 500000
        PATRON     if lifetime_donation_cents >= 100000
        FRIEND     if lifetime_donation_cents >= 25000
        NONE       otherwise
    input_set: "patron's Donations with status=FULFILLED only; PLEDGED and REFUNDED excluded"
    constants:
      FRIEND_MIN: 25000
      PATRON_MIN: 100000
      BENEFACTOR_MIN: 500000
    precision: "integer cents; boundary is >= (exactly 25000 => FRIEND, exactly 24999 => NONE)"

  - name: performance_inventory
    trigger: "any Ticket fulfillment_status change on the performance"
    algorithm: aggregation
    formula: |
      held_seat_count  = count(Tickets where performance_id==P and fulfillment_status==HELD)
      sold_seat_count  = count(Tickets where performance_id==P and fulfillment_status IN {ISSUED, COLLECTED})
      available_seat_count = max(0, capacity - held_seat_count - sold_seat_count)
      gross_sales_cents = sum(price_cents over Tickets where performance_id==P and payment_status==PAID)
    input_set: "all Tickets bound to the performance; EXCHANGED and VOID excluded from held/sold counts"
    constants: {}
    precision: "integer counts and cents; available floored at 0"

  - name: account_credit
    trigger: "performance cancel cascade, subscription cancel, exchange completion (credit movements)"
    algorithm: aggregation
    formula: |
      account_credit_cents =
        sum(price_cents over patron's Tickets whose payment_status flipped PAID->REFUNDED by a cancellation)
        + sum(total_price_cents over patron's CANCELLED Subscriptions)
        - sum(credit consumed when an Exchange total_charge is paid from credit)
      account_credit_cents >= 0 always
    input_set: "credit-affecting events for the patron; refunds add, exchange charges paid from credit subtract"
    constants: {}
    precision: "integer cents; floored at 0; this is a conserved-quantity ledger — refund-in must equal credit-out plus residual"

  - name: lifetime_donation
    trigger: "Donation fulfill or refund transition"
    algorithm: aggregation
    formula: |
      lifetime_donation_cents = sum(amount_cents over patron's Donations where status==FULFILLED)
      # feeds donor_level; a REFUNDED donation is removed from the sum, which may demote donor_level
    input_set: "patron's FULFILLED Donations only"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted for this operation per RBAC; entity_backed role must own the targeted resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id referenced in path or body FK must exist; validated left-to-right"
    error_id: "ERR_SEASON_NOT_FOUND / ERR_PERFORMANCE_NOT_FOUND / ERR_SEAT_NOT_FOUND / ERR_PATRON_NOT_FOUND / ERR_SUBSCRIPTION_NOT_FOUND / ERR_TICKET_NOT_FOUND / ERR_PRODUCTION_NOT_FOUND / ERR_AUDITION_NOT_FOUND / ERR_EXCHANGE_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing a resource

  - priority: 4
    category: state
    check: "Target resource must be in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5
    category: business_temporal
    check: "Time-gated operations require the logical clock to satisfy the window (renewal open/close, on-sale, will-call cutoff, settle after curtain)"
    error_id: "ERR_RENEWAL_WINDOW_NOT_OPEN / ERR_PERFORMANCE_NOT_ON_SALE / ERR_WILL_CALL_CLOSED / ERR_SETTLE_BEFORE_CURTAIN"
    http_status: 409
    applies_to: "open-renewal, close-renewal, open-sales, will-call-pickup, settle, ticket hold/pay"

  - priority: 6
    category: business_constraint
    check: "Seat/accessibility constraints: requested seat must belong to the performance's venue, be free of an overlapping non-VOID ticket, and offer the requested accessibility_service; subscription seat must be renewable"
    error_id: "ERR_SEAT_NOT_IN_VENUE / ERR_SEAT_ALREADY_TAKEN / ERR_ACCESSIBILITY_UNAVAILABLE / ERR_SEAT_NOT_RENEWABLE"
    http_status: 409
    applies_to: "ticket hold, subscription seat assign, exchange complete"

  - priority: 7
    category: business_referential
    check: "Seat-naming donation may only name an UNNAMED seat; an exchange target seat must be at the target performance; a duplicate role cannot be cast twice"
    error_id: "ERR_SEAT_ALREADY_NAMED / ERR_TARGET_SEAT_MISMATCH / ERR_ROLE_ALREADY_CAST"
    http_status: 409
    applies_to: "donation fulfill, exchange complete, audition cast"

  - priority: 8
    category: business_fiscal
    check: "Capacity and credit constraints: a hold may not exceed available_seat_count; an exchange charge paid from credit may not exceed account_credit_cents"
    error_id: "ERR_PERFORMANCE_SOLD_OUT / ERR_INSUFFICIENT_CREDIT"
    http_status: 402
    applies_to: "ticket hold, exchange complete"

  - priority: 9
    category: state
    check: "OCC: expected_<parent>_version must equal the parent's current version on guarded writes"
    error_id: "ERR_STALE_SEASON_VERSION / ERR_STALE_PERFORMANCE_VERSION"
    http_status: 412
    applies_to: "subscription activate, ticket hold"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/box-office/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [SeasonAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: datetime }"
    side_effects: ["Advances logical clock; may make hold_expires_at-based sweeps eligible"]

  - method: POST
    path: "/box-office/_clock/sweep_holds"
    description: "Sweep expired unpaid HELD tickets to VOID (system maintenance trigger)"
    roles: [SeasonAdmin]
    code: 200
    input: []
    output: "{ swept_ticket_ids: string[] }"
    side_effects: ["Each HELD ticket with hold_expires_at <= clock and payment_status UNPAID -> fulfillment_status=VOID; recomputes performance_inventory"]

  # ---- Seasons ----
  - method: POST
    path: "/box-office/seasons"
    description: "Create a season"
    roles: [SeasonAdmin]
    code: 201
    input: [name, renewal_window_opens_at, renewal_window_closes_at, base_subscription_fee_cents, "loyalty_renewal_discount_pct?"]
    output: Season
    side_effects: ["status=PLANNING"]

  - method: GET
    path: "/box-office/seasons/{id}"
    description: "Get one season"
    roles: [SeasonAdmin, BoxOfficeAgent, Patron, ArtisticDirector]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: GET
    path: "/box-office/seasons"
    description: "List seasons (paginated)"
    roles: [SeasonAdmin, BoxOfficeAgent, Patron, ArtisticDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: "Season[]"
    side_effects: []

  - method: POST
    path: "/box-office/seasons/{id}/open-renewal"
