# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # ----- auth -----
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }

  # ----- existence -----
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced Customer id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Referenced Unit id does not exist" }
  - { id: ERR_FLOOR_PLAN_LOAN_NOT_FOUND, http: 404, condition: "Referenced FloorPlanLoan id does not exist" }
  - { id: ERR_DEAL_NOT_FOUND, http: 404, condition: "Referenced Deal id does not exist" }
  - { id: ERR_TRADE_IN_NOT_FOUND, http: 404, condition: "Referenced TradeIn id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Referenced Technician id does not exist" }
  - { id: ERR_REPAIR_ORDER_NOT_FOUND, http: 404, condition: "Referenced RepairOrder id does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "Referenced Part id does not exist" }
  - { id: ERR_STORAGE_BAY_NOT_FOUND, http: 404, condition: "Referenced StorageBay id does not exist" }
  - { id: ERR_STORAGE_AGREEMENT_NOT_FOUND, http: 404, condition: "Referenced StorageAgreement id does not exist" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "Referenced TestRideWaiver id does not exist" }
  - { id: ERR_WARRANTY_CLAIM_NOT_FOUND, http: 404, condition: "Referenced WarrantyClaim id does not exist" }

  # ----- request validation -----
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, constraint violation (VIN length, quantity>0, end>start)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Unique field collision (Unit.vin, Part.sku, Customer.email, StorageBay.label)" }

  # ----- OCC -----
  - { id: ERR_STALE_LOAN_VERSION, http: 412, condition: "expected_floor_plan_loan_version != current FloorPlanLoan.version" }
  - { id: ERR_STALE_PART_VERSION, http: 412, condition: "expected_part_version != current Part.version" }

  # ----- state -----
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_NO_SERVICE_LINES, http: 409, condition: "RepairOrder start/complete attempted with zero ServiceLines" }
  - { id: ERR_WORK_NOT_COMPLETE, http: 409, condition: "RO invoice attempted while work_status != WORK_COMPLETE" }
  - { id: ERR_RO_ALREADY_BILLED, http: 409, condition: "RO cancel or part-line release attempted while billing_status != UNBILLED" }
  - { id: ERR_TRADE_NOT_APPRAISED, http: 409, condition: "Deal quote/approve references a TradeIn not in APPRAISED state" }
  - { id: ERR_PREP_RO_OPEN, http: 409, condition: "Storage check-out blocked: winterization prep RO not WORK_COMPLETE or CANCELLED" }
  - { id: ERR_WAIVER_EXPIRED, http: 409, condition: "log-ride attempted at/after valid_until; waiver set EXPIRED" }

  # ----- cross-entity referential -----
  - { id: ERR_UNIT_NOT_AVAILABLE, http: 409, condition: "Unit not in the required inventory state for this deal step (IN_STOCK to quote, ON_HOLD-held to approve, SOLD to deliver)" }
  - { id: ERR_UNIT_NOT_DELIVERED, http: 409, condition: "Warranty claim approve requires Unit.status == DELIVERED" }
  - { id: ERR_UNIT_NOT_RIDEABLE, http: 409, condition: "Test ride requires Unit.status IN {IN_STOCK, ON_HOLD}" }

  # ----- safety -----
  - { id: ERR_WAIVER_REQUIRED, http: 403, condition: "log-ride attempted without a SIGNED unexpired waiver for this (customer, unit)" }

  # ----- temporal -----
  - { id: ERR_BAY_DOUBLE_BOOKED, http: 409, condition: "Storage bay check-in window [start,end) overlaps another CHECKED_IN agreement on the same bay" }
  - { id: ERR_TECH_SCHEDULE_CONFLICT, http: 409, condition: "Technician appointment overlaps an existing RO window incl. cleanup buffer" }

  # ----- fiscal / floor-plan -----
  - { id: ERR_CURTAILMENT_INSUFFICIENT, http: 422, condition: "SCHEDULED curtailment principal below required 10% of original advance" }
  - { id: ERR_PAYOFF_NOT_FULL, http: 422, condition: "SALE_PAYOFF curtailment principal != principal_outstanding" }
  - { id: ERR_PART_INSUFFICIENT_STOCK, http: 409, condition: "Requested part quantity exceeds Part.available_qty" }
  - { id: ERR_OVER_AUTHORIZATION, http: 402, condition: "Non-warranty RO invoice ro_total exceeds authorized_amount and caller is not DealerPrincipal" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: SalesManager
    description: "Owns inventory intake, deals, trade-ins, and test rides"
    identity: opaque
    exclusive_operations:
      - "POST /units, POST /units/{id}/receive — inventory intake"
      - "POST /deals and all /deals/{id}/{quote,submit-finance is FinanceManager} ... quote/deliver/cancel"
      - "POST /deals/{id}/quote, /deals/{id}/deliver, /deals/{id}/cancel"
      - "POST /trade-ins, /trade-ins/{id}/reject"
      - "POST /test-ride-waivers and lifecycle (log-ride, void)"
    shared_operations:
      - "POST /customers (with ServiceAdvisor)"
      - "GET reads across units, customers, deals, trade-ins, floor-plan-loans, repair-orders, waivers"

  - name: FinanceManager
    description: "Owns the finance submission/approval/decline steps of a deal"
    identity: opaque
    exclusive_operations:
      - "POST /deals/{id}/submit-finance"
      - "POST /deals/{id}/approve"
      - "POST /deals/{id}/decline"
    shared_operations:
      - "GET reads across deals, trade-ins, floor-plan-loans, customers, units"

  - name: ServiceAdvisor
    description: "Owns repair orders, service lines, storage agreements, and warranty submission"
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders and lifecycle (start, complete, cancel)"
      - "POST /service-lines"
      - "POST /technicians (shared with DealerPrincipal)"
      - "POST /storage-agreements and lifecycle (check-in, check-out, cancel)"
      - "POST /storage-bays (shared)"
    shared_operations:
      - "POST /customers (with SalesManager)"
      - "POST /repair-orders/{id}/invoice, /pay (with DealerPrincipal)"
      - "POST /part-lines, DELETE /part-lines/{id} (with PartsClerk)"
      - "POST /warranty-claims (with DealerPrincipal)"
      - "GET reads across repair-orders, parts, part-lines, units, customers, storage"

  - name: PartsClerk
    description: "Owns parts/accessories inventory and reservations"
    identity: opaque
    exclusive_operations:
      - "POST /parts, POST /parts/{id}/restock"
    shared_operations:
      - "POST /part-lines, DELETE /part-lines/{id} (with ServiceAdvisor)"
      - "GET reads across parts, part-lines, repair-orders, customers, units"

  - name: DealerPrincipal
    description: "Override authority on fiscal gates and owner of floor-plan financing & warranty adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /floor-plan-loans, /floor-plan-loans/{id}/run-aging"
      - "POST /curtailments"
      - "POST /warranty-claims/{id}/approve, /reject, /pay"
      - "POST /_clock/set"
    shared_operations:
      - "POST /repair-orders/{id}/invoice (override authority: may invoice over authorized_amount)"
      - "POST /units, /technicians, /storage-bays, /parts (with owning roles)"
      - "POST /warranty-claims (with ServiceAdvisor)"
      - "GET reads across all resources"
