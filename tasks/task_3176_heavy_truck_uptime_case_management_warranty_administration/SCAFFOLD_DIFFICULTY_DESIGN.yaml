            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/start-service"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/work-orders/${wo_id}/complete"
              payload: { labor_minutes_actual: 100, repair_outcome: "FIXED" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/request-close"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims"
              payload: { claim_type: "BASE_WARRANTY", labor_minutes_claimed: 100, parts_claimed_cents: 100000 }
              as: WarrantyAdmin
              captures: { claim_id: $.data.id }
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}"
              payload: {}
              as: UptimeCoordinator
              captures: { case_v: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/submit"
              payload: { expected_case_version: "${case_v}" }
              as: WarrantyAdmin
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/begin-review"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/approve"
              payload: {}
              as: WarrantyAdmin
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/part-returns"
              payload: {}
              as: SupplierManager
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/part-returns/${pr_id}/ship"
              payload: {}
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/part-returns/${pr_id}/receive"
              payload: {}
              as: SupplierManager
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/part-returns/${pr_id}/inspect"
              payload: { inspection_disposition: "OK" }
              as: SupplierManager
          trigger:
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/recoveries"
              payload: { part_return_id: "${pr_id}", supplier_id: "supplier-A", claimed_amount_cents: 10000 }
              as: SupplierManager
              captures: { rec_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}/recoveries/${rec_id}/mark-paid"
              payload: { paid_amount_cents: 10000 }
              as: SupplierManager
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_id}/claims/${claim_id}"
              payload: {}
              as: WarrantyAdmin
              captures: { rec_amt_after_pay: $.data.recovery_amount_cents }
          assert:
            - "rec_amt_after_pay == 10000"
            - "WarrantyClaim.${claim_id}.recovery_status == RECOVERY_PAID"
            - "SupplierRecovery.${rec_id}.recovery_status == PAID"
            - "SupplierRecovery.${rec_id}.paid_amount_cents == 10000"
