            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
              captures: { loc_a: $.data.id }
            - call: "POST /coop/members/${m_a}/activate"
              payload: {}
              as: MemberServicesRep
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2025-12-01T00:00:00Z", kwh_register: 0, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/meter-readings"
              payload: { service_location_id: "${loc_a}", reading_at: "2026-01-01T00:00:00Z", kwh_register: 100, demand_kw: 0, source: "AMR" }
              as: BillingClerk
            - call: "POST /coop/invoices"
              payload: { service_location_id: "${loc_a}", billing_period_start: "2025-12-01T00:00:00Z", billing_period_end: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { inv_a: $.data.id }
            - call: "POST /coop/invoices/${inv_a}/finalize"
              payload: {}
              as: BillingClerk
            - call: "POST /coop/capital-credit-allocations"
              payload: { cooperative_id: "${coop_id}", fiscal_year: 2025, method: "FLAT_PER_MEMBER" }
              as: MemberServicesRep
              captures: { alloc_id: $.data.id }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/approve"
              payload: {}
              as: BoardDirector
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v: $.data.version }
            - call: "POST /coop/capital-credit-allocations/${alloc_id}/post"
              payload: { expected_cooperative_version: "${coop_v}" }
              as: MemberServicesRep
            - call: "POST /coop/capital-credit-retirements"
              payload: { cooperative_id: "${coop_id}", method: "PRO_RATA_PERCENTAGE", total_retire_cents: 5000, pro_rata_pct: 0.5 }
              as: MemberServicesRep
              captures: { ret_id: $.data.id }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/board-approve"
              payload: {}
              as: BoardDirector
            - call: "GET /coop/cooperatives/${coop_id}"
              payload: {}
              as: MemberServicesRep
              captures: { coop_v2: $.data.version }
            - call: "POST /coop/capital-credit-retirements/${ret_id}/execute"
              payload: { expected_cooperative_version: "${coop_v2}" }
              as: MemberServicesRep
            - call: "GET /coop/capital-credit-retirements/${ret_id}/payouts"
              payload: {}
              as: MemberServicesRep
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /coop/_clock/set_current_utc"
              payload: { to_iso8601: "2030-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coop/capital-credit-payouts/${pay_id}/cash"
              payload: {}
              as: MemberServicesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PAYOUT_STALE (payout is still ISSUED — the clock only auto-fires UNCLAIMED->ESCHEATED, never ISSUED->UNCLAIMED — and the logical clock 2030-01-01 is at/after claim_deadline = issued 2026-08 + 3 years)"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: get_member_service_locations_reverse_reachability
        claim_type: standard_crud
        grounds:
          - "endpoints[GET /coop/members/{id}/service-locations]"
        distinguishing_aspect: "Sub-resource GET returns exactly the locations owned by the member (array; empty array when none)."
        test_recipe:
          setup: ["Member with two locations; another member with one"]
          setup_api_calls:
            - call: "POST /coop/cooperatives"
              payload: { name: "Coop X", fiscal_year_end_month: 12, retirement_methods_allowed: ["FIFO_OLDEST"], unclaimed_dormancy_years: 3, annual_meeting_quorum_pct: 0.05, irrigation_season_start_month: 4, irrigation_season_end_month: 9 }
              as: PlatformAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "A", member_type: "RESIDENTIAL", district_id: 1 }
              as: MemberServicesRep
              captures: { m_a: $.data.id }
            - call: "POST /coop/members"
              payload: { legal_name: "B", member_type: "RESIDENTIAL", district_id: 2 }
              as: MemberServicesRep
              captures: { m_b: $.data.id }
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "1", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_a}", address: "2", rate_class: "SEASONAL" }
              as: MemberServicesRep
            - call: "POST /coop/service-locations"
              payload: { member_id: "${m_b}", address: "3", rate_class: "RESIDENTIAL" }
              as: MemberServicesRep
          trigger:
            - call: "GET /coop/members/${m_a}/service-locations"
              payload: {}
              as: MemberServicesRep
          assert:
            - "Response data array length == 2 and every element's member_id == ${m_a}"

