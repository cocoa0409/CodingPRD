            - "meta.api_request_id is a non-empty string and meta.api_request_timestamp is an ISO8601 timestamp"
            - "data.mine_name == \"Canyon No 1\""

      - name: error_envelope_carries_error_id_and_message
        claim_type: response_envelope
        grounds:
          - response_envelope.error
        distinguishing_aspect: "Every error response uses response_type error with data.error_id AND data.message populated — verified on a 404 so the shape is checked independently of any business rule."
