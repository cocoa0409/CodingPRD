              as: Inmate
              as_user_id: "${inm}"
              captures: { grv_b: $.data.id }
          trigger:
            - call: "POST /grievances/${grv_a}/close"
              payload: {}
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
            - call: "POST /grievances/${grv_a}/close"
              payload: {}
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
            - call: "POST /grievances/${grv_b}/withdraw"
              payload: {}
              as: Inmate
              as_user_id: "${inm}"
          assert:
