  - rule_id: combinatorial_formula
    instances:

      - name: certificate_rating_value_nonlinear_clamp_penalty_and_rule_branch
        mode: "(a) three or more inputs combined non-linearly"
        grounds:
          - calculations.certificate_rating_value
          - entities.RatingCertificate.fields.raw_speed_index
          - entities.RatingCertificate.fields.rating_value
          - entities.RatingCertificate.fields.band_key_spm
        distinguishing_aspect: |
          raw_speed_index folds five inputs together non-linearly - sqrt(sail_area_m2), a cube root of
          displacement_kg, a length_factor clamped into [1.00, 1.60], a strict draft_m > 2.20 penalty of
          3 percent and a hull-type multiplier - so no per-input linear model reproduces the five
          certificates in this instance: 0.6545 -> 171.3, 0.8215 -> 107.8 (hull_length_m 14.0 gives
          14.0 / 8.0 = 1.75, which the ceiling clamps to 1.60; without the clamp raw_speed_index would
          be 0.8985 and rating_value 78.6), 0.9518 -> 58.3 under the 0.82 MULTIHULL multiplier, and one
          identical measurement set minting TOD 200.9 versus TOT 0.8037 with band_key_spm 200.8, where
          the 0.1 spm gap between 200.9 and 200.8 exists only because raw_speed_index is rounded to
          4 decimals before the rule branch rather than after it.
        test_recipe:
          setup:
            - "One licensed measurer and one owning member."
            - "Five registered boats: three MONOHULL, one MULTIHULL, and a second MONOHULL carrying the same measurements as the fourth so the two rule branches can be compared."
            - "No regatta, division or entry is needed: certificate minting is independent of the racing lifecycle."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Owen Clay", email: "owen.clay@yc.test" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_own: $.data.id } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-4410", boat_name: "Windward Rose", owner_member_id: "${m_own}", boat_type: "MONOHULL", loa_meters: 11.3 }, as: Competitor, as_user_id: "${m_own}", captures: { b_a: $.data.id, b_a_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-7700", boat_name: "Long Reach", owner_member_id: "${m_own}", boat_type: "MONOHULL", loa_meters: 14.4 }, as: Competitor, as_user_id: "${m_own}", captures: { b_f: $.data.id, b_f_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-9001", boat_name: "Twin Spirit", owner_member_id: "${m_own}", boat_type: "MULTIHULL", loa_meters: 12.5 }, as: Competitor, as_user_id: "${m_own}", captures: { b_c: $.data.id, b_c_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-5502", boat_name: "Tide Runner", owner_member_id: "${m_own}", boat_type: "MONOHULL", loa_meters: 10.6 }, as: Competitor, as_user_id: "${m_own}", captures: { b_d1: $.data.id, b_d1_v: $.data.version } }
            - { call: "POST /regatta-ops/boats", payload: { sail_number: "USA-5503", boat_name: "Tide Runner Two", owner_member_id: "${m_own}", boat_type: "MONOHULL", loa_meters: 10.6 }, as: Competitor, as_user_id: "${m_own}", captures: { b_d2: $.data.id, b_d2_v: $.data.version } }
          trigger:
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_a}", rule_code: "TOD_PHRF", sail_area_m2: 68.0, hull_length_m: 11.0, displacement_kg: 5200, draft_m: 2.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_a_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_a: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_f}", rule_code: "TOD_PHRF", sail_area_m2: 88.0, hull_length_m: 14.0, displacement_kg: 6100, draft_m: 2.05, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_f_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_f: $.data.id } }
            - { call: "POST /regatta-ops/rating-certificates", payload: { boat_id: "${b_c}", rule_code: "TOD_PHRF", sail_area_m2: 95.0, hull_length_m: 12.2, displacement_kg: 2100, draft_m: 1.10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z", expected_boat_version: "${b_c_v}" }, as: Measurer, as_user_id: "${m_mea}", captures: { c_c: $.data.id } }
