            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_id}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novasport.example/v1", persistent_license_allowed: false }
              as: DrmOperator
