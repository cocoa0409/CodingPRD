  - section: errors
    instances:
      - name: corner_every_templated_path_identifier_has_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_ROUTE_NOT_FOUND]
          - errors[ERR_MODEL_NOT_FOUND]
          - errors[ERR_ASSET_NOT_FOUND]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_PAR_LEVEL_NOT_FOUND]
          - errors[ERR_PLACEMENT_NOT_FOUND]
          - errors[ERR_VISIT_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_INVOICE_LINE_NOT_FOUND]
          - errors[ERR_ADJUSTMENT_NOT_FOUND]
        distinguishing_aspect: "Thirteen distinct 404 codes exist and each templated path segment must return its OWN code - a shared generic ERR_NOT_FOUND would pass a naive test but fails here - and the rule holds on action endpoints as well as reads."
        test_recipe:
          setup: ["only the clock is set; the store is otherwise empty so every id below is unresolvable"]
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /ocs/accounts/00000000-0000-0000-0000-000000000001"
              payload: {}
              as: AccountManager
              captures: { e_acct: "$.data.error_id" }
            - call: "GET /ocs/sites/00000000-0000-0000-0000-000000000002"
              payload: {}
              as: AccountManager
              captures: { e_site: "$.data.error_id" }
            - call: "GET /ocs/routes/00000000-0000-0000-0000-000000000003"
              payload: {}
              as: AccountManager
              captures: { e_route: "$.data.error_id" }
            - call: "GET /ocs/equipment-models/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: AccountManager
              captures: { e_model: "$.data.error_id" }
            - call: "GET /ocs/equipment-assets/00000000-0000-0000-0000-000000000005"
              payload: {}
              as: AccountManager
              captures: { e_asset: "$.data.error_id" }
            - call: "GET /ocs/product-items/00000000-0000-0000-0000-000000000006"
              payload: {}
              as: AccountManager
              captures: { e_product: "$.data.error_id" }
            - call: "GET /ocs/par-levels/00000000-0000-0000-0000-000000000007"
              payload: {}
              as: AccountManager
              captures: { e_par: "$.data.error_id" }
            - call: "GET /ocs/equipment-placements/00000000-0000-0000-0000-000000000008"
              payload: {}
              as: AccountManager
              captures: { e_plc: "$.data.error_id" }
            - call: "GET /ocs/service-visits/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: AccountManager
              captures: { e_visit: "$.data.error_id" }
            - call: "GET /ocs/maintenance-work-orders/00000000-0000-0000-0000-00000000000a"
              payload: {}
              as: AccountManager
              captures: { e_wo: "$.data.error_id" }
            - call: "GET /ocs/consolidated-invoices/00000000-0000-0000-0000-00000000000b"
              payload: {}
              as: AccountManager
              captures: { e_inv: "$.data.error_id" }
            - call: "GET /ocs/invoice-lines/00000000-0000-0000-0000-00000000000c"
              payload: {}
              as: AccountManager
              captures: { e_line: "$.data.error_id" }
            - call: "GET /ocs/price-adjustments/00000000-0000-0000-0000-00000000000d"
              payload: {}
              as: AccountManager
              captures: { e_adj: "$.data.error_id" }
            - call: "POST /ocs/sites/00000000-0000-0000-0000-000000000002/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { e_site_action: "$.data.error_id" }
            - call: "GET /ocs/routes/00000000-0000-0000-0000-000000000003/day-load"
              payload: { service_date: "2026-08-03" }
              as: AccountManager
              captures: { e_route_read: "$.data.error_id" }
          assert:
            - "each read is HTTP 404 with data.error_id equal to its own code, in order: ERR_ACCOUNT_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_ROUTE_NOT_FOUND, ERR_MODEL_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_PAR_LEVEL_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_INVOICE_LINE_NOT_FOUND, ERR_ADJUSTMENT_NOT_FOUND"
            - "no two of the thirteen error_id values are equal"
            - "the size-and-plan on an unknown site is HTTP 404 with ERR_SITE_NOT_FOUND, not a 422 from the brew_style body - the path check at priority 5 runs before any business rule"
            - "the day-load read on an unknown route is HTTP 404 with ERR_ROUTE_NOT_FOUND even though service_date is well formed"

      - name: corner_body_foreign_keys_return_their_own_not_found_code_after_the_path_check
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_MODEL_NOT_FOUND]
          - errors[ERR_ACCOUNT_NOT_FOUND]
          - errors[ERR_ROUTE_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_PRODUCT_NOT_FOUND]
