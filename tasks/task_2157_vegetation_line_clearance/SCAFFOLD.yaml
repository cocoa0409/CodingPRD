scenario: "desgin task harder than expert level.!!!!2157. Vegetation Management & Line Clearance Program (Asplundh style contractor): circuit trim cycle & prescription by voltage, work-plan mapping & crew production tracking, customer notification & refusal handling, hazard-tree identification off right-of-way, herbicide application & permit, storm-response reassignment, unit-price vs T&M contractor billing, reliability outcome (tree-caused outage) tracking"
domain_name: "vegetation-line-clearance"
api_prefix: "/vm"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # 13 peer entities linked by 18 explicit foreign keys, including a
  # self-referential WorkOrder.parent_work_order_id (storm split/merge) and a
  # many-to-many Crew x WorkOrder junction (CrewAssignment). No URL nesting
  # beyond one sub-resource creation path.

  state_machine_shape: parallel
  # WorkOrder carries TWO independent state dimensions on one row:
  #   execution_status (operator-driven, contains a STORM_PREEMPTED cycle)
  #   billing_status   (compound: derived from its BillingLine children)
  # CustomerNotification is cyclic (REFUSED -> ESCALATED -> NOTIFIED, round++).
  # BillingLine is cyclic (SUBMITTED -> DISPUTED -> SUBMITTED).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The CertifiedArborist who identifies a HazardTree may not assess it.
  # The BillingAnalyst who drafts/submits a BillingLine may not review or pay it.

  consistency_model: immediate

  difficulty_level: "beyond_expert"
  # 13 entities / 72 endpoints / 44 errors / 9 calculations (3 dual-variant
  # pairs) / 9 declared state machines / 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - name: voltage_class
        type: enum
        source: input
        description: "Voltage class this prescription governs"
        constraints: "one of DISTRIBUTION_4KV | DISTRIBUTION_12KV | DISTRIBUTION_35KV | SUBTRANSMISSION_69KV | TRANSMISSION_115KV"
      - name: growth_zone
        type: enum
        source: input
        description: "Regional vegetation growth zone this prescription governs"
        constraints: "one of SLOW | MODERATE | RAPID"
      - name: base_cycle_years
        type: number
        source: input
        description: "Nominal trim cycle length in years before growth/reliability adjustment"
        constraints: "> 0 and <= 10"
      - name: clearance_radius_ft
        type: number
        source: input
        description: "Minimum radial clearance in feet a mapped WorkOrder must specify"
        constraints: ">= 1 and <= 40"
      - name: ground_to_sky
        type: boolean
        source: input
        description: "Whether the prescription requires full ground-to-sky removal of the corridor"
        default: false
      - name: herbicide_allowed
        type: boolean
        source: input
        description: "Whether herbicide application is permitted under this prescription"
        default: true
      - name: effective_from
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the prescription becomes eligible for selection; primary ranking key of the resolver"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT | ACTIVE | SUPERSEDED"

  - name: Circuit
    parent: null
    common_fields: true
    fields:
      - name: circuit_code
        type: string
        source: input
        description: "Operator-facing circuit identifier"
        constraints: "unique across Circuit; 3..32 chars"
      - name: voltage_class
        type: enum
        source: input
        description: "Nominal voltage class of the circuit"
        constraints: "one of DISTRIBUTION_4KV | DISTRIBUTION_12KV | DISTRIBUTION_35KV | SUBTRANSMISSION_69KV | TRANSMISSION_115KV"
      - name: growth_zone
        type: enum
        source: input
        description: "Vegetation growth zone the circuit sits in"
        constraints: "one of SLOW | MODERATE | RAPID"
      - name: customer_count
        type: integer
        source: input
        description: "Customers served; denominator of the reliability index"
        constraints: ">= 0"
      - name: last_trim_completed_on
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the previous cycle finished; anchor of next_trim_due_on"
      - name: prescription_id
        type: string
        source: computed
        description: "FK -> Prescription.id; resolved by the prescription_resolution selector, never supplied by the client"
      - name: cycle_months
        type: integer
        source: computed
        description: "Adjusted trim cycle length in whole months (calculations.trim_cycle_months)"
      - name: next_trim_due_on
        type: string
        source: computed
        description: "last_trim_completed_on plus cycle_months calendar months"
      - name: tree_caused_outage_count_36mo
        type: integer
        source: computed
        description: "Count of qualifying OutageRecords inside the rolling 36-month window"
        default: 0
      - name: reliability_index_36mo
        type: number
        source: computed
        description: "Rolling-36-month variant of calculations.circuit_reliability_index"
        default: 0.00
      - name: reliability_index_ytd
        type: number
        source: computed
        description: "Program-year-to-date variant of calculations.circuit_reliability_index"
        default: 0.00
      - name: reliability_tier
        type: enum
        source: computed
        description: "Threshold band driving cycle acceleration"
        default: TIER_NORMAL
        constraints: "one of TIER_NORMAL | TIER_ELEVATED | TIER_CRITICAL"
      - name: trim_status
        type: enum
        source: system
        description: "Program posture of the circuit, driven by WorkPlan cascades"
        default: NOT_SCHEDULED
        constraints: "one of NOT_SCHEDULED | SCHEDULED | ACTIVE_CYCLE | CYCLE_AT_RISK | CYCLE_COMPLETE"

  - name: WorkPlan
    parent: null
    common_fields: true
    fields:
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the circuit this program-year plan covers"
      - name: program_year
        type: integer
        source: input
        description: "Calendar program year the plan is budgeted under"
        constraints: ">= 2000 and <= 2100"
      - name: planned_span_miles
        type: number
        source: input
        description: "Circuit miles the plan intends to clear"
        constraints: "> 0"
      - name: budget_cents
        type: integer
        source: input
        description: "Authorized spend ceiling in whole cents"
        constraints: ">= 0"
      - name: planned_unit_count
        type: integer
        source: computed
        description: "Conserved quantity: sum of planned_unit_count over this plan's WorkOrders whose execution_status != CANCELLED"
        default: 0
      - name: completed_unit_count
        type: integer
        source: computed
        description: "Sum of actual_units_completed over WorkOrders in IN_PROGRESS | STORM_PREEMPTED | COMPLETED"
        default: 0
      - name: production_pct
        type: number
        source: computed
        description: "calculations.work_plan_production_pct output, 2dp"
        default: 0.00
      - name: committed_cents
        type: integer
        source: computed
        description: "calculations.work_plan_committed_cents output; conserved quantity of the billing compensating invariant"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle; SUSPENDED is entered only by the storm cascade"
        default: DRAFT
        constraints: "one of DRAFT | RELEASED | IN_PROGRESS | SUSPENDED | COMPLETED | CANCELLED"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: work_plan_id
        type: string
        source: input
        description: "FK -> WorkPlan.id; owning plan"
      - name: parent_work_order_id
        type: string
        source: system
        description: "FK -> WorkOrder.id; set only on a storm-spawned remainder child, null otherwise"
        default: null
      - name: storm_event_id
        type: string
        source: system
        description: "FK -> StormEvent.id; set on a storm-spawned remainder child and used by the storm premium in calculations.billing_line_amounts"
        default: null
      - name: span_miles
        type: number
        source: input
        description: "Circuit miles covered by this span; denominator of the unit-price density tier"
        constraints: "> 0"
      - name: billing_method
        type: enum
        source: input
        description: "Contract billing basis for this span"
        constraints: "one of UNIT_PRICE | TIME_AND_MATERIALS"
      - name: planned_unit_count
        type: integer
        source: input
        description: "Trim units (trees/poles) planned for this span"
        constraints: ">= 0"
      - name: clearance_radius_ft
        type: number
        source: input
        description: "Radial clearance the crew will cut to; set at map time, validated against the resolved Prescription"
        default: null
      - name: actual_units_completed
        type: integer
        source: computed
        description: "Sum of units_trimmed over ProductionEntries of this WorkOrder's CrewAssignments"
        default: 0
      - name: refusal_blocked_unit_count
        type: integer
        source: computed
        description: "calculations.refusal_adjusted_unit_count output; units withheld by FINAL_REFUSAL notifications"
        default: 0
      - name: execution_status
        type: enum
        source: system
        description: "Field-execution dimension; evolves independently of billing_status"
        default: PLANNED
        constraints: "one of PLANNED | MAPPED | RELEASED | IN_PROGRESS | STORM_PREEMPTED | COMPLETED | CANCELLED"
      - name: billing_status
        type: enum
        source: computed
        description: "Compound dimension derived from this WorkOrder's BillingLine children"
        default: NOT_BILLABLE
        constraints: "one of NOT_BILLABLE | BILLABLE | LINE_DRAFTED | SUBMITTED | APPROVED | DISPUTED | SETTLED"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the span reached COMPLETED"
        default: null

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_code
        type: string
        source: input
        description: "Contractor crew identifier"
        constraints: "unique across Crew"
      - name: crew_type
        type: enum
        source: input
        description: "Capability class; gates herbicide work and sets the equipment rate"
        constraints: "one of BUCKET | CLIMBING | MANUAL | HERBICIDE | STORM"
      - name: headcount
        type: integer
        source: input
        description: "Number of workers on the crew"
        constraints: ">= 1 and <= 12"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: "Fully-burdened crew labor rate per hour in whole cents; straight-time basis"
        constraints: ">= 0"
      - name: home_district
        type: string
        source: input
        description: "Operating district; matched against StormEvent.affected_district"
      - name: status
        type: enum
        source: system
        description: "Availability posture; STORM_DEPLOYED is entered only by the storm reassignment cascade and left only by demobilization"
        default: AVAILABLE
        constraints: "one of AVAILABLE | ASSIGNED | STORM_DEPLOYED"

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; span this crew is booked against"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; crew occupying the interval"
      - name: preempted_by_storm_event_id
        type: string
        source: system
        description: "FK -> StormEvent.id; set when the storm cascade preempts this assignment"
        default: null
      - name: start_at
        type: datetime
        source: input
        description: "Interval start, inclusive"
      - name: end_at
        type: datetime
        source: input
        description: "Interval end, exclusive; a 60-minute travel buffer is appended for conflict geometry"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        default: SCHEDULED
        constraints: "one of SCHEDULED | ACTIVE | RELEASED | PREEMPTED"

  - name: ProductionEntry
    parent: null
    common_fields: false
    fields:
      - name: crew_assignment_id
        type: string
        source: input
        description: "FK -> CrewAssignment.id; the booking the day's production is filed under"
      - name: herbicide_permit_id
        type: string
        source: input
        description: "FK -> HerbicidePermit.id; required when gallons_applied > 0, null otherwise"
        default: null
      - name: work_date
        type: string
        source: input
        description: "Production date (YYYY-MM-DD)"
      - name: units_trimmed
        type: integer
        source: input
        description: "Trim units completed that day"
        constraints: ">= 0"
      - name: labor_hours
        type: number
        source: input
        description: "Crew labor hours; hours above 10 on one entry are overtime at 1.5x"
        constraints: ">= 0 and <= 24"
      - name: equipment_hours
        type: number
        source: input
        description: "Equipment hours billed at the crew_type equipment rate"
        constraints: ">= 0 and <= 24"
      - name: disposal_tons
        type: number
        source: input
        description: "Chip/log tonnage hauled"
        default: 0
        constraints: ">= 0"
      - name: gallons_applied
        type: number
        source: input
        description: "Herbicide gallons applied that day; > 0 requires an ACTIVE permit and a HERBICIDE crew"
        default: 0
        constraints: ">= 0"
      - name: entry_cents
        type: integer
        source: computed
        description: "Per-entry rounded T&M value; the pinned rounding unit of calculations.work_order_billable_amount"
        default: 0

  - name: CustomerNotification
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; span whose premise is being notified"
      - name: premise_code
        type: string
        source: input
        description: "Premise/service-point identifier at the address"
        constraints: "unique per work_order_id"
      - name: contact_method
        type: enum
        source: input
        description: "How the customer was contacted"
        constraints: "one of DOOR_HANGER | PHONE | CERTIFIED_MAIL"
      - name: unit_count_at_premise
        type: integer
        source: input
        description: "Trim units located on this premise; the quantity withheld on FINAL_REFUSAL"
        constraints: ">= 0"
      - name: refusal_round
        type: integer
        source: system
        description: "Number of completed refusal escalations; capped by MAX_REFUSAL_ROUNDS"
        default: 0
      - name: notified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent notify"
        default: null
      - name: status
        type: enum
        source: system
        description: "Cyclic notification lifecycle"
        default: PENDING
        constraints: "one of PENDING | NOTIFIED | ACKNOWLEDGED | REFUSED | ESCALATED | FINAL_REFUSAL"

  - name: HazardTree
    parent: null
    common_fields: true
    fields:
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; circuit the tree threatens; supplies the target-value weight"
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; span under which removal would be executed, null if unassigned"
        default: null
      - name: customer_notification_id
        type: string
        source: input
        description: "FK -> CustomerNotification.id; off-right-of-way consent record, null until linked at assess time"
        default: null
      - name: species
        type: enum
        source: input
        description: "Species weight input of the risk score"
        constraints: "one of SILVER_MAPLE | COTTONWOOD | ASH | OAK | CONIFER"
      - name: defect_class
        type: enum
        source: input
        description: "Structural defect weight input of the risk score"
        constraints: "one of DEAD | CAVITY | LEAN | CODOMINANT | HEALTHY"
      - name: height_ft
        type: number
        source: input
        description: "Total tree height in feet"
        constraints: "> 0"
      - name: offset_ft
        type: number
        source: input
        description: "Horizontal distance in feet from the conductor to the trunk; 0 means on the right-of-way edge"
        constraints: ">= 0"
      - name: strike_potential
        type: boolean
        source: computed
        description: "True when offset_ft <= height_ft (equality counts as a strike)"
        default: false
      - name: risk_score
        type: number
        source: computed
        description: "calculations.hazard_tree_risk_score output, 2dp, 0.00 when strike_potential is false"
        default: 0.00
      - name: removal_required
        type: boolean
        source: computed
        description: "True when risk_score >= 60.00"
        default: false
      - name: identified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CertifiedArborist that created the record; segregation-of-duties anchor"
      - name: assessed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CertifiedArborist that assessed it; must differ from identified_by_user_id"
        default: null
      - name: status
        type: enum
        source: system
        description: "Branching hazard-tree lifecycle"
        default: IDENTIFIED
        constraints: "one of IDENTIFIED | ASSESSED | APPROVED_REMOVAL | DECLINED | DEFERRED | REMOVED"

  - name: HerbicidePermit
    parent: null
    common_fields: true
    fields:
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; the resource whose permit window capacity is contended"
      - name: chemical_code
        type: enum
        source: input
        description: "Active ingredient"
        constraints: "one of GLYPHOSATE | TRICLOPYR | IMAZAPYR | AMINOPYRALID"
      - name: applicator_license_no
        type: string
        source: input
        description: "State applicator license of the requesting arborist"
      - name: buffer_ft
        type: number
        source: input
        description: "Required no-spray buffer from sensitive features in feet"
        constraints: ">= 0"
      - name: window_start
        type: string
        source: input
        description: "First date (YYYY-MM-DD) application is allowed; interval is CLOSED at both ends"
      - name: window_end
        type: string
        source: input
        description: "Last date (YYYY-MM-DD) application is allowed; interval is CLOSED at both ends"
      - name: status
        type: enum
        source: system
        description: "Permit lifecycle"
        default: REQUESTED
        constraints: "one of REQUESTED | APPROVED | ACTIVE | DENIED | REVOKED | EXPIRED"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the UtilityForester that approved it"
        default: null

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - name: event_code
        type: string
        source: input
        description: "Storm identifier"
        constraints: "unique across StormEvent"
      - name: severity_level
        type: integer
        source: input
        description: "1..5 severity; 3 or higher permits preemption of IN_PROGRESS spans"
        constraints: ">= 1 and <= 5"
      - name: affected_district
        type: string
        source: input
        description: "District matched against Crew.home_district for reassignment eligibility"
      - name: reassigned_crew_count
        type: integer
        source: computed
        description: "Number of Crews currently in STORM_DEPLOYED attributed to this event"
        default: 0
      - name: preempted_assignment_count
        type: integer
        source: computed
        description: "Number of CrewAssignments whose preempted_by_storm_event_id equals this event"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Storm lifecycle"
        default: DECLARED
        constraints: "one of DECLARED | ACTIVE | DEMOBILIZING | CLOSED"

  - name: BillingLine
    parent: null
    common_fields: true
    fields:
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; span being billed"
      - name: billing_method
        type: enum
        source: input
        description: "Must equal the WorkOrder's billing_method"
        constraints: "one of UNIT_PRICE | TIME_AND_MATERIALS"
      - name: billable_units
        type: integer
        source: computed
        description: "max(0, WorkOrder.actual_units_completed - WorkOrder.refusal_blocked_unit_count); 0 for T&M lines"
        default: 0
      - name: density_multiplier
        type: number
        source: computed
        description: "Unit-price density tier multiplier keyed on billable_units / WorkOrder.span_miles; 1.00 for T&M lines"
        default: 1.00
      - name: gross_cents
        type: integer
        source: computed
        description: "Unit-price or T&M gross per calculations.work_order_billable_amount"
        default: 0
      - name: retainage_cents
        type: integer
        source: computed
        description: "Withholding derived from the gross tier"
        default: 0
      - name: storm_premium_cents
        type: integer
        source: computed
        description: "20% of gross_cents when the WorkOrder carries a storm_event_id, else 0"
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: "gross_cents - retainage_cents + storm_premium_cents"
        default: 0
      - name: mobilization_credit_cents
        type: integer
        source: computed
        description: "25000 when net_payable_cents >= 1000000, else 0; never feeds back into the retainage tier"
        default: 0
      - name: final_payable_cents
        type: integer
        source: computed
        description: "net_payable_cents - mobilization_credit_cents; the summand of WorkPlan.committed_cents"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit; anchors the 30-day dispute window"
        default: null
      - name: superseded_by_billing_line_id
        type: string
        source: system
        description: "FK -> BillingLine.id; set on a DRAFT line auto-voided by a newer draft on the same WorkOrder"
        default: null
      - name: status
        type: enum
        source: system
        description: "Cyclic billing lifecycle"
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | APPROVED | DISPUTED | PAID | VOID"

  - name: OutageRecord
    parent: null
    common_fields: false
    fields:
      - name: circuit_id
        type: string
        source: input
        description: "FK -> Circuit.id; circuit that lost supply"
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; span attributed as the missed clearance, null when unattributed"
        default: null
      - name: outage_at
        type: datetime
        source: input
        description: "Logical instant of the outage; compared against the rolling and program-year windows"
      - name: cause_code
        type: enum
        source: input
        description: "Cause classification; only tree causes qualify for the reliability index"
        constraints: "one of TREE_GROWN_IN | TREE_FELL_ON | NON_TREE"
      - name: customers_affected
        type: integer
        source: input
        description: "Customers interrupted"
        constraints: ">= 0"
      - name: customer_minutes
        type: number
        source: input
        description: "Customer-minutes of interruption; numerator of the reliability index"
        constraints: ">= 0"

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:

  # ---- Prescription -------------------------------------------------
  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vm/prescriptions/{id}/activate"
        actor: UtilityForester
        preconditions:
          - "prescription.status == DRAFT"
        side_effects:
          - "Any other Prescription with the same voltage_class AND growth_zone AND status == ACTIVE transitions ACTIVE -> SUPERSEDED"
          - "Circuits are NOT auto-re-resolved; Circuit.prescription_id changes only on POST /vm/circuits/{id}/resolve-prescription"
          - "increments Prescription.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer Prescription for the same (voltage_class, growth_zone) is activated"
        actor: system
        preconditions:
          - "prescription.status == ACTIVE"
        side_effects:
          - "increments Prescription.version by 1"

  # ---- WorkPlan (compound over WorkOrder children) ------------------
  - entity: WorkPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /vm/work-plans/{id}/release"
        actor: ContractorPlanner
        preconditions:
          - "work_plan.status == DRAFT"
          - "count of WorkOrders with work_plan_id == plan.id AND execution_status == MAPPED is >= 1 (else ERR_EMPTY_WORK_PLAN)"
        side_effects:
          - "Circuit.trim_status NOT_SCHEDULED -> SCHEDULED"
          - "increments WorkPlan.version and Circuit.version by 1"
      - from: RELEASED
        to: IN_PROGRESS
        trigger: "system: the first WorkOrder of the plan reaches IN_PROGRESS"
        actor: system
        preconditions:
          - "work_plan.status == RELEASED"
        side_effects:
          - "Circuit.trim_status SCHEDULED -> ACTIVE_CYCLE"
          - "recomputes WorkPlan.production_pct"
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "system: storm cascade leaves every non-CANCELLED WorkOrder of the plan in STORM_PREEMPTED"
        actor: system
        preconditions:
          - "work_plan.status == IN_PROGRESS"
          - "every WorkOrder of the plan whose execution_status is NOT IN {CANCELLED, PLANNED} has execution_status == STORM_PREEMPTED, and at least one of them does"
        side_effects:
          - "Circuit.trim_status ACTIVE_CYCLE -> CYCLE_AT_RISK"
          - "recomputes WorkPlan.production_pct"
        note: "Hop 4 of the storm cascade; itself caused by the WorkOrder preemption in hop 3."
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "system: storm demobilization restores every preempted WorkOrder of the plan"
        actor: system
        preconditions:
          - "work_plan.status == SUSPENDED"
          - "no WorkOrder of the plan remains in STORM_PREEMPTED"
        side_effects:
          - "Circuit.trim_status CYCLE_AT_RISK -> ACTIVE_CYCLE"
          - "recomputes WorkPlan.planned_unit_count and production_pct"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system: the last non-CANCELLED WorkOrder of the plan reaches COMPLETED"
        actor: system
        preconditions:
          - "work_plan.status == IN_PROGRESS"
          - "every WorkOrder of the plan has execution_status IN {COMPLETED, CANCELLED} and at least one is COMPLETED"
        side_effects:
          - "Circuit.trim_status ACTIVE_CYCLE -> CYCLE_COMPLETE"
          - "Circuit.last_trim_completed_on set to the logical clock date (UTC date part)"
          - "recomputes Circuit.cycle_months and Circuit.next_trim_due_on (calculations.trim_cycle_months)"
          - "increments Circuit.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /vm/work-plans/{id}/cancel"
        actor: UtilityForester
        preconditions:
          - "work_plan.status IN {DRAFT, RELEASED, IN_PROGRESS, SUSPENDED}"
        side_effects:
          - "every WorkOrder of the plan with execution_status NOT IN {COMPLETED, CANCELLED} transitions to CANCELLED"
          - "each cancelled WorkOrder releases its SCHEDULED/ACTIVE CrewAssignments to RELEASED and returns those Crews to AVAILABLE"
          - "every DRAFT BillingLine of those WorkOrders transitions DRAFT -> VOID"
          - "recomputes WorkPlan.planned_unit_count and WorkPlan.committed_cents"
          - "Circuit.trim_status -> NOT_SCHEDULED"
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /vm/work-plans/{id}/cancel"
        actor: UtilityForester
        preconditions:
          - "work_plan.status IN {DRAFT, RELEASED, IN_PROGRESS, SUSPENDED}"
        side_effects:
          - "same cascade as the DRAFT -> CANCELLED transition"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /vm/work-plans/{id}/cancel"
        actor: UtilityForester
        preconditions:
          - "work_plan.status IN {DRAFT, RELEASED, IN_PROGRESS, SUSPENDED}"
        side_effects:
          - "same cascade as the DRAFT -> CANCELLED transition"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /vm/work-plans/{id}/cancel"
        actor: UtilityForester
        preconditions:
          - "work_plan.status IN {DRAFT, RELEASED, IN_PROGRESS, SUSPENDED}"
        side_effects:
          - "same cascade as the DRAFT -> CANCELLED transition"

  # ---- WorkOrder, dimension 1: execution_status ---------------------
  - entity: WorkOrder
    dimension: execution_status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: MAPPED
        trigger: "POST /vm/work-orders/{id}/map"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status == PLANNED"
          - "the owning WorkPlan.status IN {DRAFT, RELEASED, IN_PROGRESS}"
          - "clearance_radius_ft >= resolved Prescription.clearance_radius_ft of the plan's Circuit (else ERR_CLEARANCE_BELOW_PRESCRIPTION)"
        side_effects:
          - "sets WorkOrder.clearance_radius_ft"
          - "when mapped_unit_count is supplied, sets WorkOrder.planned_unit_count and recomputes WorkPlan.planned_unit_count"
          - "increments WorkOrder.version and WorkPlan.version by 1"
      - from: MAPPED
        to: RELEASED
        trigger: "POST /vm/work-orders/{id}/release"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status == MAPPED"
          - "the owning WorkPlan.status IN {RELEASED, IN_PROGRESS}"
          - "the Circuit's resolved Prescription (Circuit.prescription_id) has status == ACTIVE (else ERR_PRESCRIPTION_NOT_ACTIVE)"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "Cross-entity guard on the Prescription aggregate (WorkOrder -> Prescription pair)."
      - from: RELEASED
        to: IN_PROGRESS
        trigger: "POST /vm/work-orders/{id}/start"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status == RELEASED"
          - "at least one CrewAssignment with work_order_id == wo.id has status == SCHEDULED"
        side_effects:
          - "every CrewAssignment of this WorkOrder with status == SCHEDULED transitions SCHEDULED -> ACTIVE"
          - "WorkPlan RELEASED -> IN_PROGRESS when the plan is still RELEASED"
          - "Circuit.trim_status SCHEDULED -> ACTIVE_CYCLE (via the WorkPlan transition)"
      - from: IN_PROGRESS
        to: STORM_PREEMPTED
        trigger: "system: hop 3 of the storm reassignment cascade"
        actor: system
        preconditions:
          - "work_order.execution_status == IN_PROGRESS"
          - "every CrewAssignment of this WorkOrder is now in {PREEMPTED, RELEASED} (i.e. the PREEMPTED mutation in hop 2 removed the last working crew)"
          - "the triggering StormEvent.severity_level >= 3"
        side_effects:
          - "sets WorkOrder.storm_event_id on the spawned child, not on the preempted parent"
          - "spawns a remainder child WorkOrder in PLANNED with parent_work_order_id = this id, storm_event_id = the event id, work_plan_id/span_miles/billing_method copied, planned_unit_count = parent.planned_unit_count - parent.actual_units_completed"
          - "reduces the parent's planned_unit_count to parent.actual_units_completed so WorkPlan.planned_unit_count is unchanged (unit conservation invariant)"
          - "recomputes WorkPlan.production_pct; may drive WorkPlan IN_PROGRESS -> SUSPENDED (hop 4)"
          - "increments WorkOrder.version by 1"
      - from: STORM_PREEMPTED
        to: RELEASED
        trigger: "system: POST /vm/storm-events/{id}/demobilize restores the span"
        actor: system
        preconditions:
          - "work_order.execution_status == STORM_PREEMPTED"
          - "the StormEvent that preempted it is transitioning ACTIVE -> DEMOBILIZING"
        side_effects:
          - "the remainder child WorkOrder (parent_work_order_id == this id, execution_status == PLANNED) transitions PLANNED -> CANCELLED"
          - "parent.planned_unit_count += the cancelled child's planned_unit_count, restoring the pre-storm value exactly"
          - "recomputes WorkPlan.planned_unit_count and production_pct; may drive WorkPlan SUSPENDED -> IN_PROGRESS"
        note: "Cycle: IN_PROGRESS -> STORM_PREEMPTED -> RELEASED -> IN_PROGRESS."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /vm/work-orders/{id}/complete"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status == IN_PROGRESS"
          - "no CustomerNotification of this WorkOrder has status IN {REFUSED, ESCALATED} (else ERR_CUSTOMER_REFUSAL_BLOCKING)"
        side_effects:
          - "sets WorkOrder.completed_at to the logical clock"
          - "WorkOrder.billing_status NOT_BILLABLE -> BILLABLE"
          - "every CrewAssignment of this WorkOrder in {SCHEDULED, ACTIVE} transitions to RELEASED; each freed Crew returns ASSIGNED -> AVAILABLE when it holds no other SCHEDULED/ACTIVE assignment"
          - "recomputes WorkPlan.production_pct; may drive WorkPlan IN_PROGRESS -> COMPLETED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /vm/work-orders/{id}/cancel"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status IN {PLANNED, MAPPED, RELEASED}"
        side_effects:
          - "recomputes WorkPlan.planned_unit_count (the cancelled span leaves the conserved sum)"
          - "every CrewAssignment of this WorkOrder in {SCHEDULED, ACTIVE} transitions to RELEASED and frees its Crew"
      - from: MAPPED
        to: CANCELLED
        trigger: "POST /vm/work-orders/{id}/cancel"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status IN {PLANNED, MAPPED, RELEASED}"
        side_effects:
          - "same cascade as PLANNED -> CANCELLED"
      - from: RELEASED
        to: CANCELLED
        trigger: "POST /vm/work-orders/{id}/cancel"
        actor: ContractorPlanner
        preconditions:
          - "work_order.execution_status IN {PLANNED, MAPPED, RELEASED}"
        side_effects:
          - "same cascade as PLANNED -> CANCELLED"

  # ---- WorkOrder, dimension 2: billing_status (compound) -----------
  - entity: WorkOrder
    dimension: billing_status
    initial_state: NOT_BILLABLE
    terminal_states: [SETTLED]
    transitions:
      - from: NOT_BILLABLE
        to: BILLABLE
        trigger: "system: execution_status reaches COMPLETED"
        actor: system
        preconditions:
          - "work_order.execution_status == COMPLETED"
          - "no BillingLine of this WorkOrder has status != VOID"
        side_effects:
          - "no cascade; the execution dimension is unaffected"
      - from: BILLABLE
        to: LINE_DRAFTED
        trigger: "POST /vm/work-orders/{id}/billing-lines"
        actor: BillingAnalyst
        preconditions:
          - "work_order.billing_status IN {BILLABLE, LINE_DRAFTED, DISPUTED}"
        side_effects:
          - "derived from the newest non-VOID BillingLine (rank: created_at DESC, tie-break version DESC)"
          - "increments WorkOrder.version by 1"
      - from: LINE_DRAFTED
        to: SUBMITTED
        trigger: "system: the newest non-VOID BillingLine reaches SUBMITTED"
        actor: system
        preconditions:
          - "the newest non-VOID BillingLine of this WorkOrder has status == SUBMITTED"
        side_effects: ["recomputes WorkOrder.billing_status only"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "system: the newest non-VOID BillingLine reaches APPROVED"
        actor: system
        preconditions:
          - "the newest non-VOID BillingLine of this WorkOrder has status == APPROVED"
        side_effects: ["recomputes WorkOrder.billing_status only"]
      - from: SUBMITTED
        to: DISPUTED
        trigger: "system: the newest non-VOID BillingLine reaches DISPUTED"
        actor: system
        preconditions:
          - "the newest non-VOID BillingLine of this WorkOrder has status == DISPUTED"
        side_effects:
          - "the disputed line leaves the WorkPlan.committed_cents input set; committed_cents is recomputed"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "system: the disputed BillingLine is resubmitted"
        actor: system
        preconditions:
          - "the newest non-VOID BillingLine of this WorkOrder has status == SUBMITTED"
        side_effects:
          - "the line re-enters the WorkPlan.committed_cents input set; committed_cents is recomputed"
        note: "Cycle on the billing dimension: SUBMITTED -> DISPUTED -> SUBMITTED."
      - from: APPROVED
        to: SETTLED
        trigger: "system: the newest non-VOID BillingLine reaches PAID"
        actor: system
        preconditions:
          - "the newest non-VOID BillingLine of this WorkOrder has status == PAID"
        side_effects: ["recomputes WorkOrder.billing_status only"]

  # ---- CrewAssignment ----------------------------------------------
  - entity: CrewAssignment
    initial_state: SCHEDULED
    terminal_states: [RELEASED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system: the assignment's WorkOrder reaches IN_PROGRESS"
        actor: system
        preconditions:
          - "crew_assignment.status == SCHEDULED"
        side_effects:
          - "Crew.status AVAILABLE|ASSIGNED -> ASSIGNED"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "system: hop 2 of the storm reassignment cascade"
        actor: system
        preconditions:
          - "crew_assignment.status IN {SCHEDULED, ACTIVE}"
          - "crew_assignment.crew_id equals the crew whose status was just set to STORM_DEPLOYED in hop 1"
        side_effects:
          - "sets preempted_by_storm_event_id"
          - "may drive the owning WorkOrder IN_PROGRESS -> STORM_PREEMPTED (hop 3)"
      - from: ACTIVE
        to: PREEMPTED
        trigger: "system: hop 2 of the storm reassignment cascade"
        actor: system
        preconditions:
          - "crew_assignment.status IN {SCHEDULED, ACTIVE}"
          - "crew_assignment.crew_id equals the crew whose status was just set to STORM_DEPLOYED in hop 1"
        side_effects:
          - "sets preempted_by_storm_event_id"
          - "may drive the owning WorkOrder IN_PROGRESS -> STORM_PREEMPTED (hop 3)"
      - from: PREEMPTED
        to: RELEASED
        trigger: "system: POST /vm/storm-events/{id}/demobilize"
        actor: system
        preconditions:
          - "crew_assignment.status == PREEMPTED"
          - "crew_assignment.preempted_by_storm_event_id == the demobilizing event"
        side_effects:
          - "Crew.status STORM_DEPLOYED -> AVAILABLE"
      - from: SCHEDULED
        to: RELEASED
        trigger: "POST /vm/crew-assignments/{id}/release"
        actor: ContractorPlanner
        preconditions:
          - "crew_assignment.status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "Crew.status ASSIGNED -> AVAILABLE when the crew holds no other SCHEDULED/ACTIVE assignment"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /vm/crew-assignments/{id}/release"
        actor: ContractorPlanner
        preconditions:
          - "crew_assignment.status IN {SCHEDULED, ACTIVE}"
        side_effects:
          - "Crew.status ASSIGNED -> AVAILABLE when the crew holds no other SCHEDULED/ACTIVE assignment"

  # ---- CustomerNotification (cyclic) --------------------------------
  - entity: CustomerNotification
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, FINAL_REFUSAL]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /vm/customer-notifications/{id}/notify"
        actor: CustomerAdvocate
        preconditions:
          - "notification.status IN {PENDING, ESCALATED}"
          - "the owning WorkOrder.execution_status != CANCELLED (refusal handling continues after the crew leaves the span)"
        side_effects:
          - "sets notified_at to the logical clock"
      - from: ESCALATED
        to: NOTIFIED
        trigger: "POST /vm/customer-notifications/{id}/notify"
        actor: CustomerAdvocate
        preconditions:
          - "notification.status IN {PENDING, ESCALATED}"
          - "the owning WorkOrder.execution_status != CANCELLED (refusal handling continues after the crew leaves the span)"
        side_effects:
          - "sets notified_at to the logical clock; refusal_round retains the value set at escalation"
        note: "Closes the refusal cycle NOTIFIED -> REFUSED -> ESCALATED -> NOTIFIED."
      - from: NOTIFIED
        to: ACKNOWLEDGED
        trigger: "POST /vm/customer-notifications/{id}/respond with response = ACKNOWLEDGED"
        actor: CustomerAdvocate
        preconditions:
          - "notification.status == NOTIFIED"
        side_effects:
          - "unblocks HazardTree removal decisions that link to this notification"
      - from: NOTIFIED
        to: REFUSED
        trigger: "POST /vm/customer-notifications/{id}/respond with response = REFUSED"
        actor: CustomerAdvocate
        preconditions:
          - "notification.status == NOTIFIED"
        side_effects:
          - "the owning WorkOrder can no longer reach COMPLETED until the refusal is resolved"
      - from: REFUSED
        to: ESCALATED
        trigger: "POST /vm/customer-notifications/{id}/escalate"
        actor: CustomerAdvocate
        preconditions:
          - "notification.status == REFUSED"
          - "notification.refusal_round + 1 <= MAX_REFUSAL_ROUNDS (3), else ERR_NOTIFICATION_ROUND_LIMIT"
        side_effects:
          - "refusal_round += 1"
      - from: ESCALATED
        to: FINAL_REFUSAL
        trigger: "POST /vm/customer-notifications/{id}/finalize-refusal"
        actor: UtilityForester
        preconditions:
          - "notification.status == ESCALATED"
          - "notification.refusal_round >= 2"
        side_effects:
          - "hop 1: notification enters FINAL_REFUSAL"
          - "hop 2: that entry forces recomputation of WorkOrder.refusal_blocked_unit_count (calculations.refusal_adjusted_unit_count)"
          - "hop 3: the changed refusal_blocked_unit_count forces every DRAFT BillingLine of that WorkOrder to recompute billable_units, density_multiplier, gross_cents, retainage_cents, net_payable_cents, mobilization_credit_cents and final_payable_cents"
          - "hop 4: the changed final_payable_cents forces recomputation of WorkPlan.committed_cents"
          - "increments WorkOrder.version by 1"

  # ---- HazardTree (branching) ---------------------------------------
  - entity: HazardTree
    initial_state: IDENTIFIED
    terminal_states: [DECLINED, REMOVED]
    transitions:
      - from: IDENTIFIED
        to: ASSESSED
        trigger: "POST /vm/hazard-trees/{id}/assess"
        actor: CertifiedArborist
        preconditions:
          - "hazard_tree.status == IDENTIFIED"
          - "X-User-ID != hazard_tree.identified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets assessed_by_user_id"
          - "recomputes strike_potential, risk_score and removal_required from the (possibly updated) defect_class/height_ft/offset_ft"
          - "sets customer_notification_id when supplied"
      - from: ASSESSED
        to: APPROVED_REMOVAL
        trigger: "POST /vm/hazard-trees/{id}/decision with outcome = APPROVE_REMOVAL"
        actor: UtilityForester
        preconditions:
          - "hazard_tree.status == ASSESSED"
          - "hazard_tree.strike_potential == true (else ERR_NO_STRIKE_POTENTIAL)"
          - "hazard_tree.risk_score >= 60.00 (else ERR_HAZARD_RISK_BELOW_THRESHOLD)"
          - "hazard_tree.offset_ft == 0 OR the linked CustomerNotification (customer_notification_id) has status == ACKNOWLEDGED (else ERR_OFF_ROW_CONSENT_REQUIRED)"
        side_effects:
          - "increments HazardTree.version by 1"
        note: "Cross-entity guard on the CustomerNotification aggregate (HazardTree -> CustomerNotification pair)."
      - from: ASSESSED
        to: DECLINED
        trigger: "POST /vm/hazard-trees/{id}/decision with outcome = DECLINE"
        actor: UtilityForester
        preconditions:
          - "hazard_tree.status == ASSESSED"
        side_effects:
          - "increments HazardTree.version by 1"
      - from: ASSESSED
        to: DEFERRED
        trigger: "POST /vm/hazard-trees/{id}/decision with outcome = DEFER"
        actor: UtilityForester
        preconditions:
          - "hazard_tree.status == ASSESSED"
        side_effects:
          - "increments HazardTree.version by 1"
      - from: DEFERRED
        to: ASSESSED
        trigger: "POST /vm/hazard-trees/{id}/assess"
        actor: CertifiedArborist
        preconditions:
          - "hazard_tree.status == DEFERRED"
          - "X-User-ID != hazard_tree.identified_by_user_id"
        side_effects:
          - "recomputes strike_potential, risk_score and removal_required"
        note: "Revision loop: ASSESSED -> DEFERRED -> ASSESSED."
      - from: APPROVED_REMOVAL
        to: REMOVED
        trigger: "POST /vm/hazard-trees/{id}/remove"
        actor: CrewForeman
        preconditions:
          - "hazard_tree.status == APPROVED_REMOVAL"
          - "hazard_tree.work_order_id is not null and that WorkOrder.execution_status == IN_PROGRESS"
          - "the acting CrewForeman's Crew holds a CrewAssignment on that WorkOrder with status == ACTIVE (else ERR_NOT_CREW_OWNER)"
        side_effects:
          - "increments HazardTree.version by 1"

  # ---- HerbicidePermit (branching) ----------------------------------
  - entity: HerbicidePermit
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /vm/herbicide-permits/{id}/decision with outcome = APPROVE"
        actor: UtilityForester
        preconditions:
          - "permit.status == REQUESTED"
          - "the resolved Prescription of permit.circuit_id has herbicide_allowed == true (else ERR_HERBICIDE_NOT_PRESCRIBED)"
          - "the permit window does not violate the circuit window-capacity rule (validations priority 51)"
        side_effects:
          - "sets approved_by_user_id"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /vm/herbicide-permits/{id}/decision with outcome = DENY"
        actor: UtilityForester
        preconditions:
          - "permit.status == REQUESTED"
        side_effects:
          - "increments HerbicidePermit.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /vm/herbicide-permits/{id}/activate"
        actor: CertifiedArborist
        preconditions:
          - "permit.status == APPROVED"
          - "the logical clock date is inside the CLOSED interval [window_start, window_end]"
        side_effects:
          - "ProductionEntries may now reference this permit"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: a ProductionEntry or activation is evaluated while the logical clock date is after window_end"
        actor: system
        preconditions:
          - "permit.status == ACTIVE"
          - "logical clock date > window_end"
        side_effects:
          - "further herbicide ProductionEntries against this permit are rejected"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /vm/herbicide-permits/{id}/revoke"
        actor: UtilityForester
        preconditions:
          - "permit.status IN {APPROVED, ACTIVE}"
        side_effects:
          - "frees a slot in the circuit's window-capacity count"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /vm/herbicide-permits/{id}/revoke"
        actor: UtilityForester
        preconditions:
          - "permit.status IN {APPROVED, ACTIVE}"
        side_effects:
          - "frees a slot in the circuit's window-capacity count"

  # ---- StormEvent ----------------------------------------------------
  - entity: StormEvent
    initial_state: DECLARED
    terminal_states: [CLOSED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /vm/storm-events/{id}/activate"
        actor: UtilityForester
        preconditions:
          - "storm_event.status == DECLARED"
        side_effects:
          - "reassignments may now be posted against this event"
      - from: ACTIVE
        to: DEMOBILIZING
        trigger: "POST /vm/storm-events/{id}/demobilize"
        actor: UtilityForester
        preconditions:
          - "storm_event.status == ACTIVE"
        side_effects:
          - "every CrewAssignment with preempted_by_storm_event_id == this event transitions PREEMPTED -> RELEASED"
          - "every Crew in STORM_DEPLOYED attributed to this event returns to AVAILABLE"
          - "every WorkOrder in STORM_PREEMPTED whose preempted assignments carried this event transitions STORM_PREEMPTED -> RELEASED, cancels its remainder child and re-absorbs the child's planned_unit_count"
          - "recomputes WorkPlan.planned_unit_count and production_pct; may drive WorkPlan SUSPENDED -> IN_PROGRESS and Circuit CYCLE_AT_RISK -> ACTIVE_CYCLE"
          - "sets reassigned_crew_count to 0 and preempted_assignment_count to 0"
      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /vm/storm-events/{id}/close"
        actor: UtilityForester
        preconditions:
          - "storm_event.status == DEMOBILIZING"
          - "no CrewAssignment still carries preempted_by_storm_event_id == this event with status == PREEMPTED"
        side_effects:
          - "increments StormEvent.version by 1"

  # ---- BillingLine (cyclic) -----------------------------------------
  - entity: BillingLine
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vm/billing-lines/{id}/submit"
        actor: BillingAnalyst
        preconditions:
          - "billing_line.status == DRAFT"
          - "the owning WorkOrder.execution_status == COMPLETED"
          - "WorkPlan.committed_cents (recomputed with this line included) <= WorkPlan.budget_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "sets submitted_at to the logical clock"
          - "WorkOrder.billing_status LINE_DRAFTED -> SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vm/billing-lines/{id}/review with outcome = APPROVE"
        actor: UtilityForester
        preconditions:
          - "billing_line.status == SUBMITTED"
          - "the acting role is UtilityForester, never the BillingAnalyst that drafted or submitted the line (segregation of duties by role)"
        side_effects:
          - "WorkOrder.billing_status SUBMITTED -> APPROVED"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /vm/billing-lines/{id}/review with outcome = DISPUTE"
        actor: UtilityForester
        preconditions:
          - "billing_line.status == SUBMITTED"
          - "the logical clock is at most 30 days after submitted_at (else ERR_DISPUTE_WINDOW_EXPIRED)"
        side_effects:
          - "the line leaves the WorkPlan.committed_cents input set; WorkPlan.committed_cents is recomputed"
          - "WorkOrder.billing_status SUBMITTED -> DISPUTED"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /vm/billing-lines/{id}/resubmit"
        actor: BillingAnalyst
        preconditions:
          - "billing_line.status == DISPUTED"
        side_effects:
          - "resets submitted_at to the logical clock"
          - "the line re-enters the WorkPlan.committed_cents input set; committed_cents is recomputed"
          - "WorkOrder.billing_status DISPUTED -> SUBMITTED"
        note: "Cycle: SUBMITTED -> DISPUTED -> SUBMITTED."
      - from: APPROVED
        to: PAID
        trigger: "POST /vm/billing-lines/{id}/pay"
        actor: UtilityForester
        preconditions:
          - "billing_line.status == APPROVED"
        side_effects:
          - "WorkOrder.billing_status APPROVED -> SETTLED"
      - from: DRAFT
        to: VOID
        trigger: "POST /vm/billing-lines/{id}/void, POST /vm/work-orders/{id}/billing-lines (supersede), or the WorkPlan cancel cascade"
        actor: BillingAnalyst
        preconditions:
          - "billing_line.status IN {DRAFT, DISPUTED}"
        side_effects:
          - "sets superseded_by_billing_line_id when the void was caused by a newer draft on the same WorkOrder"
          - "the line leaves the WorkPlan.committed_cents input set; committed_cents is recomputed, restoring the pre-line value exactly (cents conservation invariant)"
      - from: DISPUTED
        to: VOID
        trigger: "POST /vm/billing-lines/{id}/void"
        actor: BillingAnalyst
        preconditions:
          - "billing_line.status IN {DRAFT, DISPUTED}"
        side_effects:
          - "WorkOrder.billing_status falls back to BILLABLE when no non-VOID line remains"
          - "WorkPlan.committed_cents recomputed"

# =====================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =====================================================================
concurrency_rules:
  - rule_id: billing-line-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /vm/work-orders/{id}/billing-lines"
    occ_field: "expected_work_order_version"
    description: |
      Drafting a BillingLine against a WorkOrder whose version has advanced
      since the client last read it is rejected. A new draft legitimately
      supersedes any existing DRAFT line on the same WorkOrder (voiding it and
      stamping superseded_by_billing_line_id), so a client holding a stale view
      of the span would otherwise silently discard a draft it never saw, and
      would price the line against a refusal_blocked_unit_count that has since
      changed.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

  - rule_id: storm-reassignment-stale-crew
    parent_entity: Crew
    write_endpoint: "POST /vm/storm-events/{id}/reassignments"
    occ_field: "expected_crew_version"
    description: |
      Reassigning a Crew to a storm event when the crew's version has advanced
      since the client last read it is rejected. A crew already in
      STORM_DEPLOYED may legitimately be re-attributed to a different event, so
      the operation is not blocked by a state precondition; the stale-version
      check is what prevents a planner from redirecting a crew whose bookings
      or posture changed after the planner's last read.
    error_id: ERR_STALE_CREW_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:

  - name: prescription_resolution
    trigger: "POST /vm/circuits (create) and POST /vm/circuits/{id}/resolve-prescription"
    algorithm: selector_policy
    formula: |
      candidates = Prescription
                     WHERE status == ACTIVE
                       AND voltage_class == circuit.voltage_class
                       AND growth_zone  == circuit.growth_zone
      IF candidates is empty -> reject with ERR_NO_ACTIVE_PRESCRIPTION (422); circuit.prescription_id is left unchanged
      rank: ORDER BY effective_from DESC
      tie_break: ORDER BY created_at DESC          # never id
      circuit.prescription_id = candidates[0].id
    input_set: "Prescription rows in status ACTIVE only; DRAFT and SUPERSEDED rows are excluded"
    constants: {}
    precision: "exact string date comparison on effective_from (YYYY-MM-DD)"

  - name: trim_cycle_months
    trigger: "POST /vm/circuits, POST /vm/circuits/{id}/resolve-prescription, POST /vm/outage-records (when reliability_tier changes), and the WorkPlan IN_PROGRESS -> COMPLETED transition"
    algorithm: threshold
    formula: |
      GROWTH_FACTOR = { SLOW: 1.25, MODERATE: 1.00, RAPID: 0.75 }
      TIER_FACTOR   = { TIER_NORMAL: 1.00, TIER_ELEVATED: 0.80, TIER_CRITICAL: 0.60 }
      raw_months   = prescription.base_cycle_years * 12
                     * GROWTH_FACTOR[circuit.growth_zone]
                     * TIER_FACTOR[circuit.reliability_tier]
      bounded      = max( VOLTAGE_FLOOR_MONTHS[circuit.voltage_class],
                          min( VOLTAGE_CEIL_MONTHS[circuit.voltage_class],
                               round_half_up(raw_months) ) )
      circuit.cycle_months      = bounded                      # integer months
      circuit.next_trim_due_on  = add_calendar_months(circuit.last_trim_completed_on, bounded)
      # add_calendar_months clamps an overflowing day-of-month to the last valid
      # day of the target month (2024-01-31 + 1 month -> 2024-02-29).
    input_set: "the Circuit's resolved Prescription (Circuit.prescription_id) plus the Circuit's own growth_zone, voltage_class, reliability_tier and last_trim_completed_on"
    constants:
      VOLTAGE_FLOOR_MONTHS: { DISTRIBUTION_4KV: 24, DISTRIBUTION_12KV: 24, DISTRIBUTION_35KV: 30, SUBTRANSMISSION_69KV: 36, TRANSMISSION_115KV: 36 }
      VOLTAGE_CEIL_MONTHS: { DISTRIBUTION_4KV: 72, DISTRIBUTION_12KV: 72, DISTRIBUTION_35KV: 84, SUBTRANSMISSION_69KV: 96, TRANSMISSION_115KV: 96 }
    precision: "round_half_up to whole months BEFORE the floor/ceiling clamp; the clamp is applied to the rounded value, never to raw_months"

  - name: circuit_reliability_index
    trigger: "POST /vm/outage-records and GET /vm/circuits/{id}/reliability"
    algorithm: aggregation
    formula: |
      qualifying(window_start, window_end) =
          OutageRecord
            WHERE circuit_id == circuit.id
              AND cause_code IN {TREE_GROWN_IN, TREE_FELL_ON}
              AND window_start <= outage_at <= window_end       # BOTH ends inclusive
      index(window) = round_half_up( sum(customer_minutes over qualifying(window))
                                     / max(1, circuit.customer_count), 2 )
      circuit.tree_caused_outage_count_36mo = count(qualifying(rolling_36_month_window))
      reliability_tier =
          TIER_CRITICAL  if tree_caused_outage_count_36mo >= 6
          TIER_ELEVATED  if tree_caused_outage_count_36mo >= 4
          TIER_NORMAL    otherwise
    input_set: "OutageRecords of the circuit whose cause_code is a tree cause; NON_TREE rows never enter either window"
    constants:
      ROLLING_WINDOW_MONTHS: 36
      TIER_ELEVATED_OUTAGE_COUNT: 4
      TIER_CRITICAL_OUTAGE_COUNT: 6
    precision: "2 decimal places, round_half_up"
    variants:
      - name: rolling_36_month
        when: "written to Circuit.reliability_index_36mo and used for reliability_tier / cycle acceleration"
        difference: "window is [add_calendar_months(clock_now, -36), clock_now], both ends inclusive"
      - name: program_year_to_date
        when: "written to Circuit.reliability_index_ytd and reported by GET /vm/circuits/{id}/reliability"
        difference: "window is [January 1 00:00:00Z of the clock's calendar year, clock_now], both ends inclusive; the same OutageRecord set therefore yields a strictly smaller numerator whenever any qualifying outage predates January 1, and this variant never influences reliability_tier"

  - name: refusal_adjusted_unit_count
    trigger: "the CustomerNotification ESCALATED -> FINAL_REFUSAL transition (hop 2 of the refusal cascade)"
    algorithm: aggregation
    formula: |
      work_order.refusal_blocked_unit_count =
          sum( unit_count_at_premise )
          over CustomerNotification
          WHERE work_order_id == work_order.id
            AND status == FINAL_REFUSAL
    input_set: "only notifications in FINAL_REFUSAL; REFUSED and ESCALATED rows do not withhold units"
    constants: {}
    precision: "integer, exact"

  - name: work_order_billable_amount
    trigger: "POST /vm/work-orders/{id}/billing-lines, and every recomputation of a DRAFT BillingLine (hop 3 of the refusal cascade)"
    algorithm: tiered_pricing
    formula: |
      # ---- UNIT_PRICE variant -----------------------------------------
      billable_units    = max(0, work_order.actual_units_completed
                                 - work_order.refusal_blocked_unit_count)
      units_per_mile    = billable_units / work_order.span_miles
      density_multiplier = 1.15  if units_per_mile <  40
                           1.00  if 40 <= units_per_mile < 80
                           0.92  if units_per_mile >= 80
      gross_cents = round_half_up( billable_units
                                   * UNIT_RATE_CENTS[circuit.voltage_class]
                                   * density_multiplier )
      # ---- TIME_AND_MATERIALS variant ----------------------------------
      FOR EACH ProductionEntry pe of every CrewAssignment of this WorkOrder,
      ordered by (work_date ASC, created_at ASC):
          straight = min(pe.labor_hours, 10)
          overtime = max(0, pe.labor_hours - 10)
          pe.entry_cents = round_half_up(
                straight * crew.hourly_rate_cents
              + overtime * crew.hourly_rate_cents * 1.5
              + pe.equipment_hours * EQUIP_RATE_CENTS[crew.crew_type]
              + pe.disposal_tons   * DISPOSAL_RATE_CENTS )
      gross_cents = sum( pe.entry_cents )        # PINNED: round per entry, THEN sum
      billable_units = 0 and density_multiplier = 1.00 for T&M lines
    input_set: "UNIT_PRICE: the WorkOrder's own counters only. T&M: every ProductionEntry reachable through CrewAssignments of this WorkOrder whose status is any of SCHEDULED, ACTIVE, RELEASED or PREEMPTED - production is never discarded by a later assignment transition."
    constants:
      UNIT_RATE_CENTS: { DISTRIBUTION_4KV: 4200, DISTRIBUTION_12KV: 4800, DISTRIBUTION_35KV: 6100, SUBTRANSMISSION_69KV: 7500, TRANSMISSION_115KV: 9000 }
      EQUIP_RATE_CENTS: { BUCKET: 9500, CLIMBING: 3000, MANUAL: 1500, HERBICIDE: 4000, STORM: 11000 }
      DISPOSAL_RATE_CENTS: 2800
      OVERTIME_THRESHOLD_HOURS: 10
      OVERTIME_MULTIPLIER: 1.5
      DENSITY_LOW_BREAK: 40
      DENSITY_HIGH_BREAK: 80
    precision: "whole cents, round_half_up. T&M rounding order is PINNED to per-ProductionEntry: each entry is rounded to whole cents first and the rounded entry_cents values are summed. Summing the unrounded entry values and rounding once is WRONG and can differ by one or more cents."
    variants:
      - name: unit_price
        when: "billing_line.billing_method == UNIT_PRICE (must equal WorkOrder.billing_method)"
        difference: "price is driven by refusal-adjusted unit count and the density tier of units per mile; labor hours, equipment hours and disposal tonnage are ignored entirely"
      - name: time_and_materials
        when: "billing_line.billing_method == TIME_AND_MATERIALS"
        difference: "price is driven by per-entry labor/equipment/disposal with a 10-hour daily overtime break; refusals and the density tier are ignored entirely, so an identical field outcome yields a different gross_cents than the unit_price variant"

  - name: billing_line_settlement
    trigger: "every creation or recomputation of a BillingLine"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED - each step consumes only earlier steps.
      # 1. gross_cents           <- calculations.work_order_billable_amount
      # 2. retainage_pct is keyed on the GROSS tier:
      #       gross_cents <  500000                      -> 0.00
      #       500000 <= gross_cents < 2000000            -> 0.05
      #       gross_cents >= 2000000                     -> 0.10
      #    retainage_cents = round_half_up(gross_cents * retainage_pct)
      # 3. storm_premium_cents = round_half_up(gross_cents * 0.20)
      #       when work_order.storm_event_id is not null, else 0
      #       (keyed on GROSS, never on net)
      # 4. net_payable_cents = gross_cents - retainage_cents + storm_premium_cents
      # 5. mobilization_credit_cents is keyed on the NET tier:
      #       net_payable_cents >= 1000000 -> 25000, else 0
      # 6. final_payable_cents = net_payable_cents - mobilization_credit_cents
      # The credit in step 5 NEVER re-enters the tier decision of step 2, even
      # though it changes the amount actually paid; a re-entrant reading of the
      # prose would flip the retainage tier for lines near a boundary.
    input_set: "the single BillingLine being written, plus its WorkOrder's storm_event_id"
    constants:
      RETAINAGE_TIER_1_BREAK_CENTS: 500000
      RETAINAGE_TIER_2_BREAK_CENTS: 2000000
      RETAINAGE_PCT_TIER_1: 0.05
      RETAINAGE_PCT_TIER_2: 0.10
      STORM_PREMIUM_PCT: 0.20
      MOBILIZATION_CREDIT_BREAK_CENTS: 1000000
      MOBILIZATION_CREDIT_CENTS: 25000
    precision: "whole cents, round_half_up at each of steps 2 and 3 independently; steps 4 and 6 are exact integer arithmetic"

  - name: work_plan_committed_cents
    trigger: "any BillingLine create/submit/review/resubmit/void, the refusal cascade hop 4, and the WorkPlan cancel cascade"
    algorithm: aggregation
    formula: |
      work_plan.committed_cents =
          sum( billing_line.final_payable_cents )
          over BillingLine
          WHERE billing_line.work_order_id IN (WorkOrders of this plan)
            AND billing_line.status IN {DRAFT, SUBMITTED, APPROVED, PAID}
      # DISPUTED and VOID lines are excluded. Each summand is ALREADY rounded to
      # whole cents by calculations.billing_line_settlement; the sum is exact
      # integer addition - the scaffold pins round-per-line-then-sum, never
      # sum-then-round.
    input_set: "BillingLines in DRAFT, SUBMITTED, APPROVED or PAID belonging to any WorkOrder of the plan, regardless of the WorkOrder's execution_status"
    constants: {}
    precision: "whole cents; per-line rounding already applied, summation exact"

  - name: work_plan_production_pct
    trigger: "POST /vm/production-entries, every WorkOrder execution_status transition, and GET /vm/work-plans/{id}/production-summary"
    algorithm: aggregation
    formula: |
      planned = sum( work_order.planned_unit_count )
                over WorkOrders of this plan WHERE execution_status != CANCELLED
      completed = sum( work_order.actual_units_completed )
                  over WorkOrders of this plan
                  WHERE execution_status IN {IN_PROGRESS, STORM_PREEMPTED, COMPLETED}
      work_plan.planned_unit_count   = planned
      work_plan.completed_unit_count = completed
      work_plan.production_pct = 0.00 if planned == 0
                                 else round_half_up(100 * completed / planned, 2)
    input_set: "WorkOrders of the plan; CANCELLED spans leave the planned denominator, PLANNED/MAPPED/RELEASED spans contribute 0 to the numerator"
    constants: {}
    precision: "2 decimal places, round_half_up; the empty-plan case is 0.00, never an error and never a division by zero"

  - name: crew_production_rate
    trigger: "GET /vm/work-plans/{id}/production-summary"
    algorithm: aggregation
    formula: |
      entries = ProductionEntry rows reachable through CrewAssignments of any
                WorkOrder of this plan whose execution_status != CANCELLED
      total_hours = sum(entries.labor_hours)
      crew_production_rate = 0.00 if total_hours == 0
                             else round_half_up( sum(entries.units_trimmed)
                                                 / total_hours, 2 )
    input_set: "ProductionEntries under non-CANCELLED WorkOrders of the plan"
    constants: {}
    precision: "2 decimal places, round_half_up; empty set yields 0.00"

  - name: hazard_tree_risk_score
    trigger: "POST /vm/hazard-trees and the HazardTree IDENTIFIED -> ASSESSED / DEFERRED -> ASSESSED transitions"
    algorithm: weighted_scoring
    formula: |
      strike_potential = (offset_ft <= height_ft)     # equality COUNTS as a strike
      IF NOT strike_potential:
          risk_score = 0.00 ; removal_required = false ; STOP
      proximity_pts = round_half_up( max(0, 30 * (1 - offset_ft / height_ft)), 2 )
      risk_score = min( 100.00,
                        round_half_up( DEFECT_WEIGHT[defect_class]
                                     + SPECIES_WEIGHT[species]
                                     + proximity_pts
                                     + TARGET_WEIGHT[circuit.voltage_class], 2) )
      removal_required = (risk_score >= 60.00)
    input_set: "the HazardTree's own attributes plus the voltage_class of the Circuit named by circuit_id"
    constants:
      DEFECT_WEIGHT: { DEAD: 40, CAVITY: 30, LEAN: 25, CODOMINANT: 15, HEALTHY: 0 }
      SPECIES_WEIGHT: { SILVER_MAPLE: 20, COTTONWOOD: 18, ASH: 15, OAK: 8, CONIFER: 5 }
      TARGET_WEIGHT: { DISTRIBUTION_4KV: 6, DISTRIBUTION_12KV: 8, DISTRIBUTION_35KV: 12, SUBTRANSMISSION_69KV: 16, TRANSMISSION_115KV: 20 }
      REMOVAL_RISK_THRESHOLD: 60.00
      PROXIMITY_MAX_POINTS: 30
    precision: "2 decimal places, round_half_up; proximity_pts is rounded before it enters the sum"

# =====================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority order;
#     the FIRST failing rule determines the response)
# =====================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "when the acting role is CrewForeman, X-User-ID equals the crew_id of the CrewAssignment being written (POST /vm/production-entries) or the crew_id of an ACTIVE CrewAssignment on the HazardTree's work_order_id (POST /vm/hazard-trees/{id}/remove)"
    error_id: ERR_NOT_CREW_OWNER
    http_status: 403
    applies_to: "POST /vm/production-entries, POST /vm/hazard-trees/{id}/remove"

  - priority: 4
    category: auth
    check: "the X-User-ID assessing a HazardTree differs from hazard_tree.identified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /vm/hazard-trees/{id}/assess"

  - priority: 5
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with FK body fields"

  - priority: 7
    category: business_constraint
    check: "required body fields present, enum values members of the declared set, numeric fields inside their declared range, dates and datetimes well formed, unique fields (Circuit.circuit_code, Crew.crew_code, StormEvent.event_code, CustomerNotification.premise_code per work_order_id) not already taken; computed and system fields supplied by the client are ignored, never echoed back"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

  - priority: 8
    category: business_constraint
    check: "limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_WORK_ORDER_VERSION | ERR_STALE_CREW_VERSION"
    http_status: 412
    applies_to: "POST /vm/work-orders/{id}/billing-lines, POST /vm/storm-events/{id}/reassignments"

  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "the target resource is not already in one of its terminal states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 12
    category: state
    check: "the WorkOrder is in execution_status COMPLETED before a BillingLine may be drafted or submitted"
    error_id: ERR_WORK_ORDER_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /vm/work-orders/{id}/billing-lines, POST /vm/billing-lines/{id}/submit"

  - priority: 20
    category: business_safety
    check: "a ProductionEntry with gallons_applied > 0 names a herbicide_permit_id whose status is ACTIVE"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /vm/production-entries"

  - priority: 21
    category: business_safety
    check: "a ProductionEntry with gallons_applied > 0 has work_date inside the permit's CLOSED interval [window_start, window_end]"
    error_id: ERR_APPLICATION_OUTSIDE_PERMIT_WINDOW
    http_status: 422
    applies_to: "POST /vm/production-entries"

  - priority: 22
    category: business_safety
    check: "a ProductionEntry with gallons_applied > 0 is not filed against a WorkOrder that has any CustomerNotification in status FINAL_REFUSAL whose premise sits inside the permit's buffer_ft"
    error_id: ERR_BUFFER_VIOLATION
    http_status: 422
    applies_to: "POST /vm/production-entries"

  - priority: 23
    category: business_safety
    check: "clearance_radius_ft supplied at map time is >= the resolved Prescription's clearance_radius_ft"
    error_id: ERR_CLEARANCE_BELOW_PRESCRIPTION
    http_status: 422
    applies_to: "POST /vm/work-orders/{id}/map"

  - priority: 24
    category: business_safety
    check: "a HazardTree approved for removal has strike_potential == true"
    error_id: ERR_NO_STRIKE_POTENTIAL
    http_status: 422
    applies_to: "POST /vm/hazard-trees/{id}/decision"

  - priority: 25
    category: business_safety
    check: "a HazardTree approved for removal has risk_score >= 60.00"
    error_id: ERR_HAZARD_RISK_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /vm/hazard-trees/{id}/decision"

  - priority: 26
    category: business_safety
    check: "a HazardTree with offset_ft > 0 approved for removal has customer_notification_id set to a CustomerNotification in status ACKNOWLEDGED"
    error_id: ERR_OFF_ROW_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /vm/hazard-trees/{id}/decision"

  - priority: 27
    category: business_safety
    check: "the resolved Prescription of the permit's circuit has herbicide_allowed == true"
    error_id: ERR_HERBICIDE_NOT_PRESCRIBED
    http_status: 422
    applies_to: "POST /vm/herbicide-permits/{id}/decision"

  - priority: 30
    category: business_referential
    check: "the prescription_resolution selector finds at least one ACTIVE Prescription matching the circuit's (voltage_class, growth_zone)"
    error_id: ERR_NO_ACTIVE_PRESCRIPTION
    http_status: 422
    applies_to: "POST /vm/circuits, POST /vm/circuits/{id}/resolve-prescription"

  - priority: 31
    category: business_referential
    check: "the Prescription named by Circuit.prescription_id still has status == ACTIVE when a WorkOrder is released"
    error_id: ERR_PRESCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /vm/work-orders/{id}/release"

  - priority: 32
    category: business_referential
    check: "billing_method on the BillingLine equals billing_method on the WorkOrder"
    error_id: ERR_BILLING_METHOD_MISMATCH
    http_status: 422
    applies_to: "POST /vm/work-orders/{id}/billing-lines"

  - priority: 33
    category: business_referential
    check: "an OutageRecord with cause_code == NON_TREE does not carry a work_order_id, and an OutageRecord that does carry a work_order_id names a WorkOrder whose work_plan_id belongs to the same circuit_id"
    error_id: ERR_OUTAGE_CAUSE_INVALID
    http_status: 422
    applies_to: "POST /vm/outage-records"

  - priority: 40
    category: business_constraint
    check: "the Crew being booked has status IN {AVAILABLE, ASSIGNED}; a STORM_DEPLOYED crew cannot take new work bookings"
    error_id: ERR_CREW_UNAVAILABLE
    http_status: 409
    applies_to: "POST /vm/crew-assignments"

  - priority: 41
    category: business_constraint
    check: "a ProductionEntry with gallons_applied > 0 is filed by a Crew whose crew_type == HERBICIDE"
    error_id: ERR_CREW_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /vm/production-entries"

  - priority: 42
    category: business_constraint
    check: "no CustomerNotification of the WorkOrder has status IN {REFUSED, ESCALATED} when the span is completed"
    error_id: ERR_CUSTOMER_REFUSAL_BLOCKING
    http_status: 409
    applies_to: "POST /vm/work-orders/{id}/complete"

  - priority: 43
    category: business_constraint
    check: "refusal_round + 1 <= 3 when escalating a refusal"
    error_id: ERR_NOTIFICATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /vm/customer-notifications/{id}/escalate"

  - priority: 44
    category: business_constraint
    check: "the WorkPlan has at least one WorkOrder in execution_status MAPPED when it is released"
    error_id: ERR_EMPTY_WORK_PLAN
    http_status: 422
    applies_to: "POST /vm/work-plans/{id}/release"

  - priority: 45
    category: business_constraint
    check: "work_order.actual_units_completed + units_trimmed <= floor(work_order.planned_unit_count * 1.10)"
    error_id: ERR_UNITS_EXCEED_PLANNED
    http_status: 422
    applies_to: "POST /vm/production-entries"

  - priority: 46
    category: business_constraint
    check: "no BillingLine of the WorkOrder has status IN {SUBMITTED, APPROVED, PAID} when a new line is drafted; only DRAFT lines may be superseded"
    error_id: ERR_BILLING_LINE_NOT_SUPERSEDABLE
    http_status: 409
    applies_to: "POST /vm/work-orders/{id}/billing-lines"

  - priority: 47
    category: business_constraint
    check: "the StormEvent named in the path has status == ACTIVE and severity_level >= 3, and the Crew's home_district equals the event's affected_district"
    error_id: ERR_STORM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /vm/storm-events/{id}/reassignments"

  - priority: 50
    category: business_temporal
    check: "the requested [start_at, end_at) interval, extended by a 60-minute travel buffer on the earlier assignment's end, does not intersect any other CrewAssignment of the same crew_id in status SCHEDULED or ACTIVE: conflict iff new.start_at < other.end_at + 60min AND new.end_at + 60min > other.start_at"
    error_id: ERR_CREW_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /vm/crew-assignments"

  - priority: 51
    category: business_temporal
    check: "on the permit's circuit, counting only permits in status IN {APPROVED, ACTIVE}, the CLOSED interval [window_start, window_end] (a) never intersects another permit with the same chemical_code, and (b) never raises the number of mutually intersecting permits above 2"
    error_id: ERR_PERMIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /vm/herbicide-permits/{id}/decision"

  - priority: 52
    category: business_temporal
    check: "the logical clock is at most 30 calendar days after billing_line.submitted_at when a line is disputed"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /vm/billing-lines/{id}/review"

  - priority: 53
    category: business_temporal
    check: "the logical clock date is inside the CLOSED interval [window_start, window_end] when a permit is activated"
    error_id: ERR_PERMIT_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /vm/herbicide-permits/{id}/activate"

  - priority: 60
    category: business_fiscal
    check: "work_plan.committed_cents recomputed with the submitted line included is <= work_plan.budget_cents"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /vm/billing-lines/{id}/submit, POST /vm/billing-lines/{id}/resubmit"

# =====================================================================
# 1.5 API Endpoint Table    (all paths are under api_prefix /vm)
#     READ_ROLES = every declared role; write roles are narrowed per row.
# =====================================================================
endpoints:

  # ---- Prescriptions -------------------------------------------------
  - method: POST
    path: "/vm/prescriptions"
    description: "Create a voltage/growth-zone trim prescription in DRAFT."
    roles: [UtilityForester]
    code: 201
    input: ["voltage_class", "growth_zone", "base_cycle_years", "clearance_radius_ft", "effective_from", "ground_to_sky?", "herbicide_allowed?"]
    output: Prescription
    side_effects: ["status set to DRAFT", "version set to 1"]

  - method: POST
    path: "/vm/prescriptions/{id}/activate"
    description: "Activate a DRAFT prescription; supersedes the previously ACTIVE one for the same (voltage_class, growth_zone)."
    roles: [UtilityForester]
    code: 200
    input: []
    output: Prescription
    side_effects: ["DRAFT -> ACTIVE", "prior ACTIVE peer -> SUPERSEDED", "increments Prescription.version by 1"]

  - method: GET
    path: "/vm/prescriptions/{id}"
    description: "Read one prescription."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/vm/prescriptions"
    description: "List prescriptions with filters and pagination."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["voltage_class?", "growth_zone?", "status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []

  # ---- Circuits ------------------------------------------------------
  - method: POST
    path: "/vm/circuits"
    description: "Register a circuit; resolves its prescription and computes the trim cycle."
    roles: [UtilityForester]
    code: 201
    input: ["circuit_code", "voltage_class", "growth_zone", "customer_count", "last_trim_completed_on"]
    output: Circuit
    side_effects: ["runs calculations.prescription_resolution", "runs calculations.trim_cycle_months", "reliability_tier = TIER_NORMAL", "trim_status = NOT_SCHEDULED"]

  - method: POST
    path: "/vm/circuits/{id}/resolve-prescription"
    description: "Re-run the prescription selector after a newer prescription was activated, and recompute the cycle."
    roles: [UtilityForester]
    code: 200
    input: []
    output: Circuit
    side_effects: ["updates Circuit.prescription_id", "recomputes cycle_months and next_trim_due_on", "increments Circuit.version by 1"]

  - method: GET
    path: "/vm/circuits/{id}"
    description: "Read one circuit including its computed cycle and reliability fields."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Circuit
    side_effects: []

  - method: GET
    path: "/vm/circuits"
    description: "List circuits; prescription_id filters the circuits resolved to a given prescription."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["prescription_id?", "voltage_class?", "growth_zone?", "trim_status?", "reliability_tier?", "limit?", "offset?"]
    output: Circuit[]
    side_effects: []

  - method: GET
    path: "/vm/circuits/{id}/reliability"
    description: "Computed read returning both variants of calculations.circuit_reliability_index side by side."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: "{ circuit_id: string, rolling_36_month_index: number, program_year_to_date_index: number, tree_caused_outage_count_36mo: integer, reliability_tier: string, cycle_months: integer, next_trim_due_on: string }"
    side_effects: []

  # ---- Outage records -------------------------------------------------
  - method: POST
    path: "/vm/outage-records"
    description: "Record an outage; tree causes re-score the circuit's reliability and may accelerate the trim cycle."
    roles: [UtilityForester]
    code: 201
    input: ["circuit_id", "outage_at", "cause_code", "customers_affected", "customer_minutes", "work_order_id?"]
    output: OutageRecord
    side_effects: ["recomputes Circuit.tree_caused_outage_count_36mo, reliability_index_36mo, reliability_index_ytd and reliability_tier", "when reliability_tier changes, recomputes Circuit.cycle_months and next_trim_due_on", "increments Circuit.version by 1"]

  - method: GET
    path: "/vm/outage-records/{id}"
    description: "Read one outage record."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: OutageRecord
    side_effects: []

  - method: GET
    path: "/vm/outage-records"
    description: "List outage records filtered by circuit, attributed span or cause."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["circuit_id?", "work_order_id?", "cause_code?", "limit?", "offset?"]
    output: OutageRecord[]
    side_effects: []

  # ---- Work plans ------------------------------------------------------
  - method: POST
    path: "/vm/work-plans"
    description: "Create a program-year work plan for a circuit, in DRAFT."
    roles: [UtilityForester]
    code: 201
    input: ["circuit_id", "program_year", "planned_span_miles", "budget_cents"]
    output: WorkPlan
    side_effects: ["planned_unit_count = 0", "committed_cents = 0", "production_pct = 0.00"]

  - method: POST
    path: "/vm/work-plans/{id}/release"
    description: "Release a plan for field execution; requires at least one MAPPED span."
    roles: [ContractorPlanner]
    code: 200
    input: []
    output: WorkPlan
    side_effects: ["DRAFT -> RELEASED", "Circuit.trim_status NOT_SCHEDULED -> SCHEDULED", "increments WorkPlan.version and Circuit.version by 1"]

  - method: POST
    path: "/vm/work-plans/{id}/cancel"
    description: "Cancel a plan and cascade-cancel its non-terminal spans, assignments and draft billing lines."
    roles: [UtilityForester]
    code: 200
    input: ["reason?"]
    output: WorkPlan
    side_effects: ["cancels non-terminal WorkOrders", "releases their CrewAssignments and frees Crews", "voids their DRAFT BillingLines", "recomputes planned_unit_count and committed_cents", "Circuit.trim_status -> NOT_SCHEDULED"]

  - method: GET
    path: "/vm/work-plans/{id}"
    description: "Read one work plan with its derived counters."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: WorkPlan
    side_effects: []

  - method: GET
    path: "/vm/work-plans"
    description: "List work plans filtered by circuit, status or program year."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["circuit_id?", "status?", "program_year?", "limit?", "offset?"]
    output: WorkPlan[]
    side_effects: []

  - method: GET
    path: "/vm/work-plans/{id}/production-summary"
    description: "Computed read of plan production and budget consumption."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: "{ work_plan_id: string, planned_unit_count: integer, completed_unit_count: integer, production_pct: number, committed_cents: integer, budget_remaining_cents: integer, crew_production_rate: number }"
    side_effects: []

  # ---- Work orders -----------------------------------------------------
  - method: POST
    path: "/vm/work-orders"
    description: "Create a mapped span placeholder in PLANNED under a work plan."
    roles: [ContractorPlanner]
    code: 201
    input: ["work_plan_id", "span_miles", "billing_method", "planned_unit_count"]
    output: WorkOrder
    side_effects: ["execution_status = PLANNED", "billing_status = NOT_BILLABLE", "recomputes WorkPlan.planned_unit_count"]

  - method: POST
    path: "/vm/work-orders/{id}/map"
    description: "Attach mapped geometry and the cut clearance; validated against the circuit's resolved prescription."
    roles: [ContractorPlanner]
    code: 200
    input: ["clearance_radius_ft", "mapped_unit_count?"]
    output: WorkOrder
    side_effects: ["PLANNED -> MAPPED", "sets clearance_radius_ft", "optionally replaces planned_unit_count and recomputes WorkPlan.planned_unit_count"]

  - method: POST
    path: "/vm/work-orders/{id}/release"
    description: "Release a mapped span to the field; guarded by the circuit's prescription still being ACTIVE."
    roles: [ContractorPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["MAPPED -> RELEASED", "increments WorkOrder.version by 1"]

  - method: POST
    path: "/vm/work-orders/{id}/start"
    description: "Start field work; activates scheduled crew assignments and advances the plan and circuit."
    roles: [ContractorPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["RELEASED -> IN_PROGRESS", "SCHEDULED CrewAssignments -> ACTIVE", "WorkPlan RELEASED -> IN_PROGRESS", "Circuit.trim_status SCHEDULED -> ACTIVE_CYCLE"]

  - method: POST
    path: "/vm/work-orders/{id}/complete"
    description: "Complete the span; blocked while any notification is REFUSED or ESCALATED."
    roles: [ContractorPlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["IN_PROGRESS -> COMPLETED", "billing_status NOT_BILLABLE -> BILLABLE", "releases assignments and frees crews", "recomputes WorkPlan.production_pct", "may drive WorkPlan -> COMPLETED, Circuit -> CYCLE_COMPLETE and a cycle recomputation"]

  - method: POST
    path: "/vm/work-orders/{id}/cancel"
    description: "Cancel a span before it starts."
    roles: [ContractorPlanner]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["{PLANNED, MAPPED, RELEASED} -> CANCELLED", "recomputes WorkPlan.planned_unit_count", "releases assignments and frees crews"]

  - method: GET
    path: "/vm/work-orders/{id}"
    description: "Read one span including both status dimensions."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/vm/work-orders"
    description: "List spans; parent_work_order_id finds storm-spawned remainder children, storm_event_id finds spans attributed to a storm."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["work_plan_id?", "parent_work_order_id?", "storm_event_id?", "execution_status?", "billing_status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/vm/work-orders/{id}/billing-lines"
    description: "Draft a billing line for a completed span; supersedes any existing DRAFT line. OCC-guarded on the span's version."
    roles: [BillingAnalyst]
    code: 201
    input: ["billing_method", "expected_work_order_version"]
    output: BillingLine
    side_effects: ["prior DRAFT line -> VOID with superseded_by_billing_line_id set", "runs calculations.work_order_billable_amount and calculations.billing_line_settlement", "recomputes WorkPlan.committed_cents", "WorkOrder.billing_status -> LINE_DRAFTED", "increments WorkOrder.version by 1"]

  # ---- Crews and assignments -------------------------------------------
  - method: POST
    path: "/vm/crews"
    description: "Register a contractor crew in AVAILABLE."
    roles: [ContractorPlanner]
    code: 201
    input: ["crew_code", "crew_type", "headcount", "hourly_rate_cents", "home_district"]
    output: Crew
    side_effects: ["status = AVAILABLE", "version = 1"]

  - method: GET
    path: "/vm/crews/{id}"
    description: "Read one crew."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Crew
    side_effects: []

  - method: GET
    path: "/vm/crews"
    description: "List crews filtered by posture, capability class or district."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "crew_type?", "home_district?", "limit?", "offset?"]
    output: Crew[]
    side_effects: []

  - method: POST
    path: "/vm/crew-assignments"
    description: "Book a crew onto a span for a half-open interval; rejected on buffer-extended overlap."
    roles: [ContractorPlanner]
    code: 201
    input: ["work_order_id", "crew_id", "start_at", "end_at"]
    output: CrewAssignment
    side_effects: ["status = SCHEDULED", "Crew.status AVAILABLE -> ASSIGNED", "increments Crew.version by 1"]

  - method: POST
    path: "/vm/crew-assignments/{id}/release"
    description: "Release a booking early."
    roles: [ContractorPlanner]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["{SCHEDULED, ACTIVE} -> RELEASED", "Crew.status ASSIGNED -> AVAILABLE when no other live booking remains", "increments Crew.version by 1"]

  - method: GET
    path: "/vm/crew-assignments/{id}"
    description: "Read one booking."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/vm/crew-assignments"
    description: "List bookings; preempted_by_storm_event_id finds the assignments a storm took."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["work_order_id?", "crew_id?", "preempted_by_storm_event_id?", "status?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  # ---- Production -------------------------------------------------------
  - method: POST
    path: "/vm/production-entries"
    description: "File a day of crew production against a booking; herbicide gallons require an ACTIVE permit and a HERBICIDE crew."
    roles: [CrewForeman]
    code: 201
    input: ["crew_assignment_id", "work_date", "units_trimmed", "labor_hours", "equipment_hours", "disposal_tons?", "gallons_applied?", "herbicide_permit_id?"]
    output: ProductionEntry
    side_effects: ["computes entry_cents", "increments WorkOrder.actual_units_completed", "recomputes WorkPlan.completed_unit_count and production_pct", "increments WorkOrder.version by 1"]

  - method: GET
    path: "/vm/production-entries/{id}"
    description: "Read one production entry."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: ProductionEntry
    side_effects: []

  - method: GET
    path: "/vm/production-entries"
    description: "List production entries by booking, permit or date."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["crew_assignment_id?", "herbicide_permit_id?", "work_date?", "limit?", "offset?"]
    output: ProductionEntry[]
    side_effects: []

  # ---- Customer notifications -------------------------------------------
  - method: POST
    path: "/vm/customer-notifications"
    description: "Open a premise notification record in PENDING."
    roles: [CustomerAdvocate]
    code: 201
    input: ["work_order_id", "premise_code", "contact_method", "unit_count_at_premise"]
    output: CustomerNotification
    side_effects: ["status = PENDING", "refusal_round = 0"]

  - method: POST
    path: "/vm/customer-notifications/{id}/notify"
    description: "Deliver (or re-deliver, after an escalation) the notification."
    roles: [CustomerAdvocate]
    code: 200
    input: ["contact_method?"]
    output: CustomerNotification
    side_effects: ["{PENDING, ESCALATED} -> NOTIFIED", "sets notified_at to the logical clock"]

  - method: POST
    path: "/vm/customer-notifications/{id}/respond"
    description: "Record the customer's answer to a delivered notification."
    roles: [CustomerAdvocate]
    code: 200
    input: ["response"]
    output: CustomerNotification
    side_effects: ["NOTIFIED -> ACKNOWLEDGED or NOTIFIED -> REFUSED"]

  - method: POST
    path: "/vm/customer-notifications/{id}/escalate"
    description: "Escalate a refusal to the next round, capped at 3 rounds."
    roles: [CustomerAdvocate]
    code: 200
    input: []
    output: CustomerNotification
    side_effects: ["REFUSED -> ESCALATED", "refusal_round += 1"]

  - method: POST
    path: "/vm/customer-notifications/{id}/finalize-refusal"
    description: "Accept the refusal permanently; withholds the premise's units and reprices every draft line of the span."
    roles: [UtilityForester]
    code: 200
    input: []
    output: CustomerNotification
    side_effects: ["ESCALATED -> FINAL_REFUSAL", "recomputes WorkOrder.refusal_blocked_unit_count", "reprices every DRAFT BillingLine of the span", "recomputes WorkPlan.committed_cents", "increments WorkOrder.version by 1"]

  - method: GET
    path: "/vm/customer-notifications/{id}"
    description: "Read one notification."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: CustomerNotification
    side_effects: []

  - method: GET
    path: "/vm/customer-notifications"
    description: "List notifications for a span."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: CustomerNotification[]
    side_effects: []

  # ---- Hazard trees ------------------------------------------------------
  - method: POST
    path: "/vm/hazard-trees"
    description: "Identify a hazard tree; computes strike potential and risk score immediately."
    roles: [CertifiedArborist]
    code: 201
    input: ["circuit_id", "species", "defect_class", "height_ft", "offset_ft", "work_order_id?"]
    output: HazardTree
    side_effects: ["status = IDENTIFIED", "sets identified_by_user_id from X-User-ID", "runs calculations.hazard_tree_risk_score"]

  - method: POST
    path: "/vm/hazard-trees/{id}/assess"
    description: "Second-arborist assessment; may correct the measurements and link the consent record."
    roles: [CertifiedArborist]
    code: 200
    input: ["defect_class?", "height_ft?", "offset_ft?", "customer_notification_id?"]
    output: HazardTree
    side_effects: ["{IDENTIFIED, DEFERRED} -> ASSESSED", "sets assessed_by_user_id", "re-runs calculations.hazard_tree_risk_score"]

  - method: POST
    path: "/vm/hazard-trees/{id}/decision"
    description: "Utility decision on an assessed hazard tree."
    roles: [UtilityForester]
    code: 200
    input: ["outcome"]
    output: HazardTree
    side_effects: ["ASSESSED -> APPROVED_REMOVAL | DECLINED | DEFERRED", "increments HazardTree.version by 1"]

  - method: POST
    path: "/vm/hazard-trees/{id}/remove"
    description: "Crew records the removal of an approved hazard tree."
    roles: [CrewForeman]
    code: 200
    input: []
    output: HazardTree
    side_effects: ["APPROVED_REMOVAL -> REMOVED", "increments HazardTree.version by 1"]

  - method: GET
    path: "/vm/hazard-trees/{id}"
    description: "Read one hazard tree."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: HazardTree
    side_effects: []

  - method: GET
    path: "/vm/hazard-trees"
    description: "List hazard trees by circuit, span or linked consent record."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["circuit_id?", "work_order_id?", "customer_notification_id?", "status?", "limit?", "offset?"]
    output: HazardTree[]
    side_effects: []

  # ---- Herbicide permits --------------------------------------------------
  - method: POST
    path: "/vm/herbicide-permits"
    description: "Request a herbicide permit for a closed application window on a circuit."
    roles: [CertifiedArborist]
    code: 201
    input: ["circuit_id", "chemical_code", "applicator_license_no", "buffer_ft", "window_start", "window_end"]
    output: HerbicidePermit
    side_effects: ["status = REQUESTED"]

  - method: POST
    path: "/vm/herbicide-permits/{id}/decision"
    description: "Approve or deny a requested permit; approval enforces the circuit window-capacity rule."
    roles: [UtilityForester]
    code: 200
    input: ["outcome"]
    output: HerbicidePermit
    side_effects: ["REQUESTED -> APPROVED (sets approved_by_user_id) or REQUESTED -> DENIED"]

  - method: POST
    path: "/vm/herbicide-permits/{id}/activate"
    description: "Activate an approved permit; only inside its closed window."
    roles: [CertifiedArborist]
    code: 200
    input: []
    output: HerbicidePermit
    side_effects: ["APPROVED -> ACTIVE"]

  - method: POST
    path: "/vm/herbicide-permits/{id}/revoke"
    description: "Revoke an approved or active permit and free its window slot."
    roles: [UtilityForester]
    code: 200
    input: ["reason?"]
    output: HerbicidePermit
    side_effects: ["{APPROVED, ACTIVE} -> REVOKED"]

  - method: GET
    path: "/vm/herbicide-permits/{id}"
    description: "Read one permit."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: HerbicidePermit
    side_effects: []

  - method: GET
    path: "/vm/herbicide-permits"
    description: "List permits for a circuit."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["circuit_id?", "status?", "chemical_code?", "limit?", "offset?"]
    output: HerbicidePermit[]
    side_effects: []

  # ---- Storm response ------------------------------------------------------
  - method: POST
    path: "/vm/storm-events"
    description: "Declare a storm event."
    roles: [UtilityForester]
    code: 201
    input: ["event_code", "severity_level", "affected_district"]
    output: StormEvent
    side_effects: ["status = DECLARED"]

  - method: POST
    path: "/vm/storm-events/{id}/activate"
    description: "Activate a declared storm so crews can be reassigned to it."
    roles: [UtilityForester]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["DECLARED -> ACTIVE"]

  - method: POST
    path: "/vm/storm-events/{id}/reassignments"
    description: "Reassign a crew to storm duty. OCC-guarded on the crew's version; drives the four-hop preemption cascade."
    roles: [ContractorPlanner]
    code: 201
    input: ["crew_id", "expected_crew_version"]
    output: StormEvent
    side_effects: ["hop 1: Crew.status -> STORM_DEPLOYED and Crew.version += 1", "hop 2: that crew's SCHEDULED/ACTIVE CrewAssignments -> PREEMPTED with preempted_by_storm_event_id set", "hop 3: each preempted assignment's IN_PROGRESS WorkOrder -> STORM_PREEMPTED, spawning a remainder child and rebalancing planned_unit_count", "hop 4: the preempted spans drive WorkPlan IN_PROGRESS -> SUSPENDED, which drives Circuit ACTIVE_CYCLE -> CYCLE_AT_RISK", "updates reassigned_crew_count and preempted_assignment_count"]

  - method: POST
    path: "/vm/storm-events/{id}/demobilize"
    description: "Demobilize the storm and restore every preempted booking, span, plan and circuit."
    roles: [UtilityForester]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["ACTIVE -> DEMOBILIZING", "PREEMPTED assignments -> RELEASED and crews -> AVAILABLE", "STORM_PREEMPTED spans -> RELEASED, remainder children cancelled and their units re-absorbed", "WorkPlan SUSPENDED -> IN_PROGRESS and Circuit CYCLE_AT_RISK -> ACTIVE_CYCLE"]

  - method: POST
    path: "/vm/storm-events/{id}/close"
    description: "Close a demobilized storm."
    roles: [UtilityForester]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["DEMOBILIZING -> CLOSED"]

  - method: GET
    path: "/vm/storm-events/{id}"
    description: "Read one storm event with its reassignment counters."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: StormEvent
    side_effects: []

  - method: GET
    path: "/vm/storm-events"
    description: "List storm events."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "affected_district?", "limit?", "offset?"]
    output: StormEvent[]
    side_effects: []

  # ---- Billing ---------------------------------------------------------------
  - method: POST
    path: "/vm/billing-lines/{id}/submit"
    description: "Submit a draft line for utility review; enforces the plan budget ceiling."
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: BillingLine
    side_effects: ["DRAFT -> SUBMITTED", "sets submitted_at", "WorkOrder.billing_status -> SUBMITTED"]

  - method: POST
    path: "/vm/billing-lines/{id}/review"
    description: "Utility approves or disputes a submitted line."
    roles: [UtilityForester]
    code: 200
    input: ["outcome", "dispute_reason?"]
    output: BillingLine
    side_effects: ["SUBMITTED -> APPROVED or SUBMITTED -> DISPUTED", "a dispute removes the line from WorkPlan.committed_cents"]

  - method: POST
    path: "/vm/billing-lines/{id}/resubmit"
    description: "Re-submit a disputed line unchanged; re-enters the committed ledger."
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: BillingLine
    side_effects: ["DISPUTED -> SUBMITTED", "resets submitted_at", "recomputes WorkPlan.committed_cents"]

  - method: POST
    path: "/vm/billing-lines/{id}/void"
    description: "Void a draft or disputed line; the committed ledger returns to its pre-line value exactly."
    roles: [BillingAnalyst]
    code: 200
    input: ["reason?"]
    output: BillingLine
    side_effects: ["{DRAFT, DISPUTED} -> VOID", "recomputes WorkPlan.committed_cents", "WorkOrder.billing_status falls back to BILLABLE when no non-VOID line remains"]

  - method: POST
    path: "/vm/billing-lines/{id}/pay"
    description: "Pay an approved line."
    roles: [UtilityForester]
    code: 200
    input: []
    output: BillingLine
    side_effects: ["APPROVED -> PAID", "WorkOrder.billing_status -> SETTLED"]

  - method: GET
    path: "/vm/billing-lines/{id}"
    description: "Read one billing line with its full settlement breakdown."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: BillingLine
    side_effects: []

  - method: GET
    path: "/vm/billing-lines"
    description: "List billing lines for a span; superseded_by_billing_line_id finds the line a void points at."
    roles: [UtilityForester, ContractorPlanner, CrewForeman, CertifiedArborist, CustomerAdvocate, BillingAnalyst, PlatformAdmin]
    code: 200
    input: ["work_order_id?", "superseded_by_billing_line_id?", "status?", "billing_method?", "limit?", "offset?"]
    output: BillingLine[]
    side_effects: []

  # ---- Test-driving surface ----------------------------------------------------
  - method: POST
    path: "/vm/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["all window, expiry, cycle and dispute-deadline evaluations read this clock"]

# =====================================================================
# 1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_CREW_OWNER
    http: 403
    condition: "a CrewForeman acts on a booking or removal that does not belong to the crew identified by X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the arborist assessing a hazard tree is the same X-User-ID that identified it"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, unknown enum member, out-of-range number, malformed date/datetime, or a uniqueness collision on circuit_code, crew_code, event_code or premise_code within a span"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit outside [1,100] or offset negative or non-integer"
  - id: ERR_PRESCRIPTION_NOT_FOUND
    http: 404
    condition: "prescription id in path or body does not exist"
  - id: ERR_CIRCUIT_NOT_FOUND
    http: 404
    condition: "circuit id in path or body does not exist"
  - id: ERR_WORK_PLAN_NOT_FOUND
    http: 404
    condition: "work plan id in path or body does not exist"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "work order id in path or body does not exist"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "crew id in path or body does not exist"
  - id: ERR_CREW_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "crew assignment id in path or body does not exist"
  - id: ERR_PRODUCTION_ENTRY_NOT_FOUND
    http: 404
    condition: "production entry id in path does not exist"
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "customer notification id in path or body does not exist"
  - id: ERR_HAZARD_TREE_NOT_FOUND
    http: 404
    condition: "hazard tree id in path does not exist"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "herbicide permit id in path or body does not exist"
  - id: ERR_STORM_EVENT_NOT_FOUND
    http: 404
    condition: "storm event id in path does not exist"
  - id: ERR_BILLING_LINE_NOT_FOUND
    http: 404
    condition: "billing line id in path does not exist"
  - id: ERR_OUTAGE_RECORD_NOT_FOUND
    http: 404
    condition: "outage record id in path does not exist"
  - id: ERR_STALE_WORK_ORDER_VERSION
    http: 412
    condition: "expected_work_order_version does not equal the WorkOrder's current version when drafting a billing line"
  - id: ERR_STALE_CREW_VERSION
    http: 412
    condition: "expected_crew_version does not equal the Crew's current version when reassigning to a storm"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the resource's current state"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the resource is already in one of its terminal states"
  - id: ERR_WORK_ORDER_NOT_COMPLETE
    http: 409
    condition: "a billing line is drafted or submitted while the span's execution_status is not COMPLETED"
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 422
    condition: "herbicide gallons are filed against a permit whose status is not ACTIVE"
  - id: ERR_APPLICATION_OUTSIDE_PERMIT_WINDOW
    http: 422
    condition: "the production entry's work_date falls outside the permit's closed [window_start, window_end] interval"
  - id: ERR_BUFFER_VIOLATION
    http: 422
    condition: "herbicide is applied on a span that carries a FINAL_REFUSAL premise inside the permit's buffer_ft"
  - id: ERR_CLEARANCE_BELOW_PRESCRIPTION
    http: 422
    condition: "clearance_radius_ft at map time is below the resolved prescription's clearance_radius_ft"
  - id: ERR_NO_STRIKE_POTENTIAL
    http: 422
    condition: "removal is approved for a tree whose offset_ft exceeds its height_ft"
  - id: ERR_HAZARD_RISK_BELOW_THRESHOLD
    http: 422
    condition: "removal is approved for a tree whose risk_score is below 60.00"
  - id: ERR_OFF_ROW_CONSENT_REQUIRED
    http: 409
    condition: "removal is approved for an off-right-of-way tree without a linked CustomerNotification in ACKNOWLEDGED"
  - id: ERR_HERBICIDE_NOT_PRESCRIBED
    http: 422
    condition: "a permit is approved on a circuit whose resolved prescription has herbicide_allowed false"
  - id: ERR_NO_ACTIVE_PRESCRIPTION
    http: 422
    condition: "no ACTIVE prescription matches the circuit's (voltage_class, growth_zone) at resolution time"
  - id: ERR_PRESCRIPTION_NOT_ACTIVE
    http: 409
    condition: "a span is released while the circuit's resolved prescription has been superseded"
  - id: ERR_BILLING_METHOD_MISMATCH
    http: 422
    condition: "the billing line's billing_method differs from the span's billing_method"
  - id: ERR_OUTAGE_CAUSE_INVALID
    http: 422
    condition: "a NON_TREE outage carries a work_order_id, or the attributed span belongs to a different circuit"
  - id: ERR_CREW_UNAVAILABLE
    http: 409
    condition: "the crew being booked is STORM_DEPLOYED"
  - id: ERR_CREW_TYPE_MISMATCH
    http: 422
    condition: "herbicide gallons are filed by a crew whose crew_type is not HERBICIDE"
  - id: ERR_CUSTOMER_REFUSAL_BLOCKING
    http: 409
    condition: "a span is completed while a notification is still REFUSED or ESCALATED"
  - id: ERR_NOTIFICATION_ROUND_LIMIT
    http: 422
    condition: "escalating would push refusal_round above 3"
  - id: ERR_EMPTY_WORK_PLAN
    http: 422
    condition: "a plan is released with zero spans in MAPPED"
  - id: ERR_UNITS_EXCEED_PLANNED
    http: 422
    condition: "a production entry would push actual_units_completed above 110 percent of planned_unit_count"
  - id: ERR_BILLING_LINE_NOT_SUPERSEDABLE
    http: 409
    condition: "a new draft line is requested while a SUBMITTED, APPROVED or PAID line exists on the span"
  - id: ERR_STORM_NOT_ACTIVE
    http: 409
    condition: "a reassignment targets a storm that is not ACTIVE, has severity_level below 3, or whose affected_district differs from the crew's home_district"
  - id: ERR_CREW_SCHEDULE_CONFLICT
    http: 409
    condition: "the requested booking interval collides with another live booking of the same crew once the 60-minute travel buffer is applied"
  - id: ERR_PERMIT_WINDOW_CONFLICT
    http: 409
    condition: "approving the permit would create a same-chemical window overlap or a third mutually overlapping permit on the circuit"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "a line is disputed more than 30 calendar days after submitted_at"
  - id: ERR_PERMIT_WINDOW_NOT_OPEN
    http: 422
    condition: "a permit is activated while the logical clock date sits outside its closed window"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "submitting or resubmitting the line would push WorkPlan.committed_cents above budget_cents"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
roles:
  - name: UtilityForester
    description: "Utility-side program owner: prescriptions, circuits, plans budget, hazard-tree and permit decisions, refusal finalization, outage records, billing review and payment."
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/prescriptions"
      - "POST /vm/prescriptions/{id}/activate"
      - "POST /vm/circuits"
      - "POST /vm/circuits/{id}/resolve-prescription"
      - "POST /vm/work-plans"
      - "POST /vm/work-plans/{id}/cancel"
      - "POST /vm/outage-records"
      - "POST /vm/customer-notifications/{id}/finalize-refusal"
      - "POST /vm/hazard-trees/{id}/decision"
      - "POST /vm/herbicide-permits/{id}/decision"
      - "POST /vm/herbicide-permits/{id}/revoke"
      - "POST /vm/storm-events"
      - "POST /vm/storm-events/{id}/activate"
      - "POST /vm/storm-events/{id}/demobilize"
      - "POST /vm/storm-events/{id}/close"
      - "POST /vm/billing-lines/{id}/review"
      - "POST /vm/billing-lines/{id}/pay"
    shared_operations: ["all GET endpoints"]

  - name: ContractorPlanner
    description: "Contractor-side planner: maps and drives spans, registers crews, books assignments, executes storm reassignments."
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/work-plans/{id}/release"
      - "POST /vm/work-orders"
      - "POST /vm/work-orders/{id}/map"
      - "POST /vm/work-orders/{id}/release"
      - "POST /vm/work-orders/{id}/start"
      - "POST /vm/work-orders/{id}/complete"
      - "POST /vm/work-orders/{id}/cancel"
      - "POST /vm/crews"
      - "POST /vm/crew-assignments"
      - "POST /vm/crew-assignments/{id}/release"
      - "POST /vm/storm-events/{id}/reassignments"
    shared_operations: ["all GET endpoints"]

  - name: CrewForeman
    description: "Field foreman acting as a specific Crew; files daily production and records hazard-tree removals for that crew only."
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /vm/production-entries"
      - "POST /vm/hazard-trees/{id}/remove"
    shared_operations: ["all GET endpoints"]

  - name: CertifiedArborist
    description: "Licensed arborist: identifies and assesses hazard trees, requests and activates herbicide permits. May not assess a tree it identified."
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/hazard-trees"
      - "POST /vm/hazard-trees/{id}/assess"
      - "POST /vm/herbicide-permits"
      - "POST /vm/herbicide-permits/{id}/activate"
    shared_operations: ["all GET endpoints"]

  - name: CustomerAdvocate
    description: "Customer-facing notifier: opens, delivers, records responses to and escalates premise notifications. Cannot finalize a refusal."
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/customer-notifications"
      - "POST /vm/customer-notifications/{id}/notify"
      - "POST /vm/customer-notifications/{id}/respond"
      - "POST /vm/customer-notifications/{id}/escalate"
    shared_operations: ["all GET endpoints"]

  - name: BillingAnalyst
    description: "Contractor billing: drafts, submits, resubmits and voids billing lines. Cannot review, approve or pay them (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/work-orders/{id}/billing-lines"
      - "POST /vm/billing-lines/{id}/submit"
      - "POST /vm/billing-lines/{id}/resubmit"
      - "POST /vm/billing-lines/{id}/void"
    shared_operations: ["all GET endpoints"]

  - name: PlatformAdmin
    description: "Operator of the benchmark harness; owns the logical clock only."
    identity: "opaque"
    exclusive_operations:
      - "POST /vm/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
