            - "${f_a_v2} == ${f_a_v1} + 1: every accepted write that touches the folio advances the version by exactly one, so ${f_a_v1} is stale immediately after ${det_2_id} is minted"
            - "the guard is scoped to the OCC field and not to the payload: a third attempt reusing ${f_a_v1} returns 412 even though it is byte-identical to the call that just succeeded"
            - "expected_loan_folio_version is required, so omitting it returns 400 ERR_INVALID_REQUEST rather than being treated as a blind write"

