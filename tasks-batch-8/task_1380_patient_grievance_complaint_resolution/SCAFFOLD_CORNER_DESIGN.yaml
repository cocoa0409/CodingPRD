            - { call: "GET /api/patient-cases/${c1}", as: PatientRelationsDirector, as_user_id: "${dir}", captures: { c1v2: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/assignments", payload: { investigator_id: "${inv}", expected_case_version: "${c1v2}" }, as: PatientRelationsDirector, as_user_id: "${dir}" }
            - { call: "POST /api/patient-cases/${c1}/investigations", payload: {}, as: DepartmentInvestigator, as_user_id: "${inv}" }
            - { call: "GET /api/patient-cases/${c1}", as: IntakeCoordinator, captures: { c1v3: $.data.version } }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "DIRECTOR_OVERRIDE", expected_case_version: "${c1v3}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CASE_INVALID_STATE' (OCC passed; state gate rejects the reclassification)"
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: ack_breach_boundary_exact_second
        claim_type: precision
        grounds: [calculations.regulatory_due_dates, calculations.regulatory_clock_status_derivation]
        distinguishing_aspect: "Ack deadline boundary uses strict >: now == ack_due_at is still ON_TRACK; now == ack_due_at + 1s is ACK_BREACH."
        test_recipe:
          setup: ["Grievance received 2026-08-03T10:00:00Z -> ack_due_at 2026-08-10T10:00:00Z; never acknowledged"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0201", unit_id: "${u1}", received_at: "2026-08-03T10:00:00Z", channel: "PHONE", description: "Concern", grievance_category: "OTHER" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { st_eq: $.data.regulatory_clock_status, ack: $.data.ack_due_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:01Z" }, as: SystemAdmin }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { st_late: $.data.regulatory_clock_status } }
          assert:
            - "ack == '2026-08-10T10:00:00Z' and st_eq == 'ON_TRACK' (equality is not a breach)"
            - "st_late == 'ACK_BREACH' (one second past)"

      - name: expedited_window_for_critical_grievance
        claim_type: correct_result
        grounds: [calculations.regulatory_due_dates]
        distinguishing_aspect: "CRITICAL severity shortens the grievance window to 7 days: calendar due 2026-08-10T10:00:00Z, business due 2026-08-12T10:00:00Z (4,5,6,7,10,11,12 Aug)."
        test_recipe:
          setup: ["CRITICAL grievance received Monday 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ICU", category: "ICU" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0202", unit_id: "${u1}", received_at: "2026-08-03T10:00:00Z", channel: "IN_PERSON", description: "Critical care concern", grievance_category: "CARE_QUALITY", severity_tier: "CRITICAL" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { cal: $.data.response_due_calendar_at, bus: $.data.response_due_business_at, ack: $.data.ack_due_at } }
          assert:
            - "cal == '2026-08-10T10:00:00Z' (7 calendar days)"
            - "bus == '2026-08-12T10:00:00Z' (7 business days)"
            - "ack == '2026-08-10T10:00:00Z'"

      - name: complaint_window_three_days_no_ack_requirement
        claim_type: constants_applied
        grounds: [calculations.regulatory_due_dates]
        distinguishing_aspect: "COMPLAINT uses COMPLAINT_TARGET_DAYS=3 and has no acknowledgment requirement: ack_due_at is null while both dues are populated."
        test_recipe:
          setup: ["COMPLAINT received Monday 2026-08-03T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Clinic", category: "OUTPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0203", unit_id: "${u1}", received_at: "2026-08-03T10:00:00Z", channel: "PORTAL", description: "Scheduling annoyance", grievance_category: "ACCESS_DELAY" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { cal: $.data.response_due_calendar_at, ack: $.data.ack_due_at } }
          assert:
            - "cal == '2026-08-06T10:00:00Z' (3 calendar days)"
            - "ack == null (ack requirement applies to grievances only)"

      - name: tolling_disjoint_suspensions_sum_and_duplicate_open_rejected
        claim_type: correct_result
        grounds: [calculations.tolling_credit_seconds, "errors[ERR_DUPLICATE_OPEN_SUSPENSION]"]
        distinguishing_aspect: "Two disjoint suspensions (5d + 2d) sum to 604800s with no double counting; a second OPEN suspension while one is OPEN is rejected (ERR_DUPLICATE_OPEN_SUSPENSION)."
        test_recipe:
          setup: ["Grievance received 2026-08-01T09:00:00Z -> base due 2026-08-31T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Oncology", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0204", unit_id: "${u1}", received_at: "2026-08-01T09:00:00Z", channel: "PHONE", description: "Records access concern", grievance_category: "COMMUNICATION" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${c1}/clock-suspensions", payload: { reason: "AWAITING_RECORDS" }, as: IntakeCoordinator, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/clock-suspensions", payload: { reason: "LANGUAGE_ACCESS" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/clock-suspensions/${s1}/close", payload: {}, as: IntakeCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/patient-cases/${c1}/clock-suspensions", payload: { reason: "AWAITING_FAMILY" }, as: IntakeCoordinator, captures: { s2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/clock-suspensions/${s2}/close", payload: {}, as: IntakeCoordinator }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { credit: $.data.tolling_credit_seconds, due: $.data.response_due_calendar_at, st: $.data.regulatory_clock_status } }
          assert:
            - "err == 'ERR_DUPLICATE_OPEN_SUSPENSION'"
            - "credit == 604800 (432000 + 172800)"
            - "due == '2026-09-07T09:00:00Z' (base 2026-08-31T09:00:00Z + 604800s)"
            - "st == 'ON_TRACK' at 2026-08-18 (re-extended due in future)"

      - name: filing_deadline_abuse_48h_boundary
        claim_type: precision
        grounds: [calculations.reportable_event_filing_deadline, state_machines.ReportableEvent.PENDING_FILING_to_LATE_FILED]
        distinguishing_aspect: "ALLEGED_ABUSE filing window is exactly 48h: file at deadline == on time (FILED, late_filing false); file at deadline + 1s -> LATE_FILED and unit posture cascades to RESTRICTED."
        test_recipe:
          setup: ["Case with alleged_abuse_flag=true; two ALLEGED_ABUSE events created at 2026-08-03T10:00:00Z (deadline 2026-08-05T10:00:00Z)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "Peds", category: "INPATIENT" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/staff-members", payload: { full_name: "Quinn Risk", capabilities: ["QRO"] }, as: SystemAdmin, captures: { q1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0205", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "IN_PERSON", description: "Alleged rough handling", grievance_category: "RIGHTS_ABUSE", alleged_abuse_flag: true }, as: IntakeCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/patient-cases/${c1}/reportable-events", payload: { authority_code: "STATE_HEALTH_DEPT", trigger_reason: "ALLEGED_ABUSE" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { e1: $.data.id, dl1: $.data.filing_deadline_at } }
            - { call: "POST /api/patient-cases/${c1}/reportable-events", payload: { authority_code: "CMS_REGIONAL", trigger_reason: "ALLEGED_ABUSE" }, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { e2: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/reportable-events/${e1}/file", payload: {}, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { st1: $.data.status, lf1: $.data.late_filing } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:01Z" }, as: SystemAdmin }
            - { call: "POST /api/reportable-events/${e2}/file", payload: {}, as: QualityRiskOfficer, as_user_id: "${q1}", captures: { st2: $.data.status, lf2: $.data.late_filing } }
            - { call: "GET /api/hospital-units/${u1}", as: QualityRiskOfficer, as_user_id: "${q1}", captures: { post: $.data.posture, lfc: $.data.late_filed_event_count } }
          assert:
            - "dl1 == '2026-08-05T10:00:00Z' (created_at + 48h)"
            - "st1 == 'FILED' and lf1 == false (filed_at == deadline is on time)"
            - "st2 == 'LATE_FILED' and lf2 == true (one second late)"
            - "post == 'RESTRICTED' and lfc == 1 (late-file cascade)"

      - name: reclassification_recomputes_from_received_at
        claim_type: correct_result
        grounds: [calculations.regulatory_due_dates, entities.ClassificationDecision.fields.supersedes_decision_id]
        distinguishing_aspect: "Reclassifying COMPLAINT -> GRIEVANCE on 2026-08-20 recomputes dues from received_at 2026-08-03 (not from the reclassification time): ack_due 2026-08-10 already past -> immediate ACK_BREACH."
        test_recipe:
          setup: ["Case received 2026-08-03T09:00:00Z, classified COMPLAINT; clock advanced to 2026-08-20T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/hospital-units", payload: { name: "ED Main", category: "EMERGENCY" }, as: SystemAdmin, captures: { u1: $.data.id } }
            - { call: "POST /api/patient-cases", payload: { patient_ref: "P-0206", unit_id: "${u1}", received_at: "2026-08-03T09:00:00Z", channel: "PHONE", description: "Initially minor concern", grievance_category: "STAFF_CONDUCT" }, as: IntakeCoordinator, captures: { c1: $.data.id, c1v: $.data.version } }
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "COMPLAINT", rationale_code: "INITIAL_INTAKE", expected_case_version: "${c1v}" }, as: IntakeCoordinator, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:00:00Z" }, as: SystemAdmin }
            - { call: "GET /api/patient-cases/${c1}", as: IntakeCoordinator, captures: { c1v2: $.data.version } }
          trigger:
            - { call: "POST /api/patient-cases/${c1}/classification-decisions", payload: { decision: "GRIEVANCE", rationale_code: "ESCALATION_OF_CONCERN", expected_case_version: "${c1v2}" }, as: IntakeCoordinator, captures: { d2: $.data.id, d2s: $.data.supersedes_decision_id } }
            - { call: "GET /api/patient-cases/${c1}/timeline", as: IntakeCoordinator, captures: { cal: $.data.response_due_calendar_at, ack: $.data.ack_due_at, st: $.data.regulatory_clock_status } }
          assert:
            - "d2s == ${d1} (supersede chain links the new decision to the old)"
            - "cal == '2026-09-02T09:00:00Z' and ack == '2026-08-10T09:00:00Z' — recomputed from received_at"
            - "st == 'ACK_BREACH' immediately (ack deadline passed while still a complaint; ack clock is not tolled)"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: create_case_missing_auth_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Request without X-User-ID/X-User-Role -> 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check (call shown without as:/as_user_id to model absent headers)."
        test_recipe:
          setup: ["Clock default"]
          setup_api_calls: []
          trigger:
