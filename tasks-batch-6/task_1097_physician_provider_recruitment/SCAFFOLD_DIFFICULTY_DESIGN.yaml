          (2026-08-30) is INSIDE the window (fell_out_date <= guarantee_end_date), so APPROVE succeeds; one
          day later would return ERR_GUARANTEE_WINDOW_EXPIRED. Reached via POST /guarantee-claims + APPROVE.
