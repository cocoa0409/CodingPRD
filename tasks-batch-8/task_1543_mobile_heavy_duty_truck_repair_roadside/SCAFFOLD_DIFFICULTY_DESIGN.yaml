      - name: safety_beats_temporal_on_dispatch_create
        grounds:
          - validations[priority=14]
          - validations[priority=16]
        distinguishing_aspect: |
          Pair business_safety-vs-business_temporal: dispatching a technician who lacks the
          required BRAKES certification AND whose window overlaps an existing dispatch triggers
          both ERR_TECHNICIAN_NOT_CERTIFIED (14) and ERR_DISPATCH_WINDOW_OVERLAP (16);
          safety must win.
        test_recipe:
          setup:
            - "Tech T4 holds a PROPOSED dispatch with window 09:00-12:00. A second TRIAGED call requires BRAKES (symptom BRAKE_FAULT); T4's only certification is TIRES."
