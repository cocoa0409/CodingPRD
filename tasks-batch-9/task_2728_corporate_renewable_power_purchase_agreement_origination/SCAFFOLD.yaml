# =============================================================================
# PRD Benchmark Seed Tables — task_2728
# Corporate Renewable Power Purchase Agreement Origination
# Difficulty target: beyond Expert (§0.4 Expert band, deliberately exceeded on
# entity/endpoint density because the scenario's ten sub-domains are mutually
# coupled: qualification -> structuring -> pricing -> credit -> CP -> settlement
# -> attributes -> risk allocation all read and write each other's state.)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2728. Corporate Renewable Power Purchase Agreement Origination (clean energy
  project developer): offtaker qualification with creditworthiness assessment and
  sustainability commitment analysis, product structuring across physical delivery,
  virtual contracts for difference and aggregated buyer arrangements, pricing with
  fixed price, escalation, shape and basis risk allocation between parties,
  settlement mechanics with hourly or monthly netting against a hub or node price,
  credit support requirements with letters of credit, parent guarantees and
  collateral thresholds, milestone conditions precedent including permitting,
  interconnection and notice to proceed with termination rights, environmental
  attribute conveyance with registry transfer and claim substantiation for the
  buyer, change in law, curtailment and force majeure allocation

domain_name: "corporate-renewable-ppa-origination"
api_prefix: "/ppa"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  entity_topology_note: |
    Deal, Offtaker and Project form a many-to-many mesh through DealAllocation
    (aggregated buyer arrangements: one Deal carries N buyers, one Offtaker buys
    from N Deals). Offtaker is additionally self-referential through
    parent_guarantor_offtaker_id (parent-guarantee chains), and
    CreditSupportInstrument points at both a Deal and a guarantor Offtaker,
    closing a cycle Deal -> Instrument -> Offtaker -> Deal.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Deal carries two independent state dimensions on one row — `status`
    (commercial lifecycle, with a TERM_SHEET_ISSUED <-> UNDER_NEGOTIATION redline
    loop) and `credit_status` (credit lifecycle, with an APPROVED ->
    SUPPORT_SHORTFALL -> APPROVED cure loop). Offtaker.qualification_status is
    cyclic (CONDITIONAL -> UNDER_REVIEW, QUALIFIED <-> WATCHLIST).
    ConditionPrecedent is branching fork (PENDING -> {SATISFIED, WAIVED, FAILED})
    with divergent side-effect sets per branch plus a FAILED -> PENDING cure loop.
    SettlementPeriod is cyclic (INVOICED -> DISPUTED -> CALCULATED).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_note: |
    Two named segregation rules bind operator identity (X-User-ID), not just
    role: the CreditOfficer who renders an Offtaker qualification decision may
    not be the operator who created that Offtaker record, and the DealCommittee
    operator who executes a Deal may not be the operator who approved its credit.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: PricingNode
    parent: null
    common_fields: false
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: Settlement point name as published by the ISO
        constraints: "1-64 chars; unique across PricingNode"
      - name: iso
        type: enum
        source: input
        description: Independent system operator that publishes this point
        constraints: "one of CAISO, ERCOT, PJM, MISO"
      - name: settlement_point_type
        type: enum
        source: input
        description: Whether the point is a trading hub or a physical node
        constraints: "one of HUB, NODE"

  - name: Offtaker
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the corporate buyer
        constraints: "1-128 chars"
      - name: credit_rating
        type: enum
        source: input
        description: Senior unsecured issuer rating on the agency scale
        constraints: "one of AAA, AA, A, BBB, BB, B, CCC, NR"
      - name: rating_agency
        type: enum
        source: input
        description: Agency that published credit_rating
        constraints: "one of SP, MOODYS, FITCH, NONE"
      - name: reported_ebitda_usd
        type: number
        source: input
        description: Most recent fiscal-year EBITDA in USD, used for unsecured limit sizing
        constraints: ">= 0"
      - name: net_debt_to_ebitda
        type: number
        source: input
        description: Net debt divided by EBITDA, used for the leverage component of credit_score
        constraints: ">= 0; at most 2 decimal places"
      - name: disclosure_framework
        type: enum
        source: input
        description: Sustainability disclosure regime the buyer reports under
        constraints: "one of CDP_AND_TCFD, TCFD_ONLY, CDP_ONLY, NONE"
      - name: has_science_based_target
        type: boolean
        source: input
        description: Whether the buyer has a validated science-based emissions target
        default: false
      - name: re100_member
        type: boolean
        source: input
        description: Whether the buyer is an RE100 signatory
        default: false
      - name: scope2_target_year
        type: integer
        source: input
        description: Target year for 100 percent renewable scope 2 electricity, null if none
        default: null
        constraints: "null or 2026-2060"
      - name: registry_account_id
        type: string
        source: input
        description: Buyer's environmental attribute registry account identifier, null if not yet opened
        default: null
      - name: parent_guarantor_offtaker_id
        type: string
        source: input
        description: "FK -> Offtaker.id; nullable; the parent entity whose balance sheet may credit-support this buyer"
        default: null
      - name: qualification_status
        type: enum
        source: system
        description: Offtaker qualification lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, QUALIFIED, CONDITIONAL, WATCHLIST, REJECTED"
      - name: credit_score
        type: number
        source: computed
        description: Weighted creditworthiness score from calculations.offtaker_credit_score
        default: null
        constraints: "0.00-100.00, 2 decimals"
      - name: credit_score_variant
        type: enum
        source: computed
        description: Which variant of offtaker_credit_score produced credit_score
        default: null
        constraints: "one of STANDALONE, GUARANTOR_SUPPORTED"
      - name: credit_tier
        type: enum
        source: computed
        description: Tier derived from credit_score by calculations.offtaker_credit_score threshold table
        default: null
        constraints: "one of PRIME, STANDARD, SUBPRIME, DECLINED"
      - name: sustainability_score
        type: number
        source: computed
        description: Sustainability commitment score from calculations.offtaker_sustainability_score
        default: null
        constraints: "0.00-100.00, 2 decimals"
      - name: unsecured_credit_limit_usd
        type: number
        source: computed
        description: Unsecured exposure the developer will carry for this buyer, from calculations.unsecured_credit_limit
        default: null
        constraints: ">= 0, 2 decimals"
      - name: conditions
        type: array
        source: input
        description: Free-text conditions attached when qualification_status is CONDITIONAL
        default: []
      - name: claimed_attributes_mwh
        type: integer
        source: computed
        description: Total environmental attribute MWh retired in this buyer's name across all deals
        default: 0
        constraints: ">= 0"
      - name: watchlist_since
        type: datetime
        source: system
        description: Logical-clock instant at which qualification_status became WATCHLIST, null otherwise
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who created this Offtaker record
      - name: decision_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditOfficer who rendered the last qualification decision
        default: null

  - name: Project
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: Generation project name
        constraints: "1-128 chars"
      - name: technology
        type: enum
        source: input
        description: Generation technology, drives the capacity factor constant
        constraints: "one of SOLAR, WIND, STORAGE_HYBRID"
      - name: capacity_mw
        type: number
        source: input
        description: Nameplate AC capacity in MW available for contracting
        constraints: "> 0"
      - name: node_id
        type: string
        source: input
        description: "FK -> PricingNode.id; the physical injection node where generation is metered"
      - name: cod_target_date
        type: datetime
        source: input
        description: Target commercial operation date for the project
      - name: p50_annual_mwh
        type: number
        source: input
        description: P50 annual energy estimate in MWh
        constraints: "> 0"
      - name: interconnection_queue_position
        type: integer
        source: input
        description: Position in the ISO interconnection queue
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: Development milestone state of the project
        default: PRE_DEVELOPMENT
        constraints: "one of PRE_DEVELOPMENT, PERMITTED, INTERCONNECTION_APPROVED, NTP_ISSUED, OPERATIONAL"
      - name: contracted_mw
        type: number
        source: computed
        description: Sum of contracted_mw over Deals on this project whose status is in {EXECUTED, EFFECTIVE}
        default: 0
        constraints: ">= 0, 3 decimals"
      - name: available_mw
        type: number
        source: computed
        description: capacity_mw minus contracted_mw
        default: null
        constraints: ">= 0, 3 decimals"
      - name: last_milestone_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent milestone advance, null if none
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who created this Project

  - name: Deal
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the generation project supplying this PPA"
      - name: anchor_offtaker_id
        type: string
        source: input
        description: "FK -> Offtaker.id; the lead corporate buyer that signs the agreement"
      - name: settlement_point_id
        type: string
        source: input
        description: "FK -> PricingNode.id; the hub or node whose published price settles the contract"
      - name: product_type
        type: enum
        source: input
        description: Structuring of the offtake product
        constraints: "one of PHYSICAL_DELIVERY, VIRTUAL_CFD, AGGREGATED"
      - name: contracted_mw
        type: number
        source: input
        description: Total contracted capacity in MW across all buyers on this deal
        constraints: "> 0; at most 3 decimals"
      - name: term_years
        type: integer
        source: input
        description: Contract term in years
        constraints: "5-25"
      - name: first_delivery_year
        type: integer
        source: input
        description: Calendar year in which deliveries begin, drives the escalation exponent
        constraints: "2026-2040"
      - name: commercial_operation_deadline
        type: datetime
        source: input
        description: Outside date by which the project must reach OPERATIONAL
      - name: settlement_frequency
        type: enum
        source: input
        description: Netting granularity elected by the parties
        constraints: "one of HOURLY, MONTHLY"
      - name: base_fixed_price_usd_per_mwh
        type: number
        source: input
        description: Base fixed price in the pricing base year, before escalation
        constraints: "> 0; at most 2 decimals"
      - name: escalation_pct_per_year
        type: number
        source: input
        description: Annual escalation percentage applied from the pricing base year
        constraints: "0.0-5.0; at most 2 decimals"
      - name: shape_product
        type: enum
        source: input
        description: Delivery shape the seller commits to, drives the shape premium
        constraints: "one of AS_GENERATED, SOLAR_SHAPED_16X5, BASELOAD_FIRM"
      - name: basis_responsibility
        type: enum
        source: input
        description: Which party bears node-to-hub basis risk
        constraints: "one of SELLER, SHARED, BUYER"
      - name: status
        type: enum
        source: system
        description: Commercial lifecycle dimension of the deal
        default: DRAFT
        constraints: "one of DRAFT, TERM_SHEET_ISSUED, UNDER_NEGOTIATION, TERMS_AGREED, EXECUTED, EFFECTIVE, TERMINATED"
      - name: credit_status
        type: enum
        source: system
        description: Credit lifecycle dimension of the deal, evolves independently of status
        default: NOT_SUBMITTED
        constraints: "one of NOT_SUBMITTED, SUBMITTED, APPROVED, DECLINED, SUPPORT_SHORTFALL"
      - name: contract_price_usd_per_mwh
        type: number
        source: computed
        description: Settled strike price from calculations.deal_contract_price, null until terms are agreed
        default: null
        constraints: ">= 0, 2 decimals"
      - name: price_tier
        type: enum
        source: computed
        description: Shape-premium tier selected from the escalated base price only
        default: null
        constraints: "one of LOW, MID, HIGH"
      - name: expected_annual_mwh
        type: number
        source: computed
        description: Contracted annual energy from calculations.credit_support_requirement step 1
        default: null
        constraints: ">= 0, 2 decimals"
      - name: exposure_usd
        type: number
        source: computed
        description: Mark-to-contract exposure over the credit horizon
        default: null
        constraints: ">= 0, 2 decimals"
      - name: unsecured_credit_limit_usd
        type: number
        source: computed
        description: Snapshot of Offtaker.unsecured_credit_limit_usd taken when credit was submitted
        default: null
        constraints: ">= 0, 2 decimals"
      - name: credit_support_required_usd
        type: number
        source: computed
        description: Collateral requirement from calculations.credit_support_requirement
        default: null
        constraints: ">= 0, multiple of 250000"
      - name: posted_credit_support_usd
        type: number
        source: computed
        description: Sum of eligible_credit_usd over this deal's CreditSupportInstruments whose status is POSTED
        default: 0
        constraints: ">= 0, 2 decimals"
      - name: released_credit_support_usd
        type: number
        source: computed
        description: Sum of eligible_credit_usd over this deal's CreditSupportInstruments whose status is RELEASED
        default: 0
        constraints: ">= 0, 2 decimals"
      - name: drawn_credit_support_usd
        type: number
        source: computed
        description: Sum of eligible_credit_usd over this deal's CreditSupportInstruments whose status is DRAWN
        default: 0
        constraints: ">= 0, 2 decimals"
      - name: collateral_threshold_usd
        type: number
        source: computed
        description: Threshold below which no collateral is called; equals the unsecured_credit_limit_usd snapshotted from the anchor Offtaker at deal creation
        default: null
        constraints: ">= 0"
      - name: credit_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the CreditOfficer who approved credit, null until approved
        default: null
      - name: support_cure_deadline
        type: datetime
        source: system
        description: Logical-clock deadline by which a support shortfall must be cured, null when not in shortfall
        default: null
      - name: round_count
        type: integer
        source: computed
        description: Number of TermSheetRound rows created against this deal
        default: 0
        constraints: ">= 0"
      - name: confirmed_allocated_mw
        type: number
        source: computed
        description: Sum of allocated_mw over this deal's DealAllocations whose status is CONFIRMED
        default: 0
        constraints: ">= 0, 3 decimals"
      - name: unallocated_mw
        type: number
        source: computed
        description: contracted_mw minus the sum of allocated_mw over DealAllocations whose status is in {PROPOSED, CONFIRMED}
        default: null
        constraints: ">= 0, 3 decimals"
      - name: cp_total_count
        type: integer
        source: computed
        description: Number of ConditionPrecedent rows on this deal
        default: 0
        constraints: ">= 0"
      - name: cp_completion_pct
        type: number
        source: computed
        description: Completion percentage from calculations.cp_completion_pct
        default: null
        constraints: "0.00-100.00, 2 decimals"
      - name: attributes_minted_mwh
        type: integer
        source: computed
        description: Sum of quantity_mwh over this deal's EnvironmentalAttributeBatches whose status is in {MINTED, TRANSFERRED, RETIRED}
        default: 0
        constraints: ">= 0"
      - name: attributes_transferred_mwh
        type: integer
        source: computed
        description: Sum of quantity_mwh over this deal's EnvironmentalAttributeBatches whose status is in {TRANSFERRED, RETIRED}
        default: 0
        constraints: ">= 0"
      - name: attributes_retired_mwh
        type: integer
        source: computed
        description: Sum of quantity_mwh over this deal's EnvironmentalAttributeBatches whose status is RETIRED
        default: 0
        constraints: ">= 0"
      - name: effective_at
        type: datetime
        source: system
        description: Logical-clock instant at which all conditions precedent closed, null otherwise
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: Logical-clock instant of termination, null otherwise
        default: null
      - name: termination_reason
        type: enum
        source: system
        description: Reason recorded at termination
        default: null
        constraints: "one of CP_FAILURE, BUYER_DEFAULT, SELLER_DEFAULT, EXTENDED_FORCE_MAJEURE, COD_DEADLINE_MISSED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the Originator who created this Deal

  - name: DealAllocation
    parent: Deal
    common_fields: true
    entity_kind: resource
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal this buyer share belongs to"
      - name: offtaker_id
        type: string
        source: input
        description: "FK -> Offtaker.id; the buyer taking this share"
      - name: allocated_mw
        type: number
        source: input
        description: MW of the deal's contracted capacity allocated to this buyer
        constraints: "> 0; at most 3 decimals"
      - name: joint_and_several
        type: boolean
        source: input
        description: Whether this buyer is jointly and severally liable for the whole deal
        default: false
      - name: status
        type: enum
        source: system
        description: Allocation lifecycle state
        default: PROPOSED
        constraints: "one of PROPOSED, CONFIRMED, WITHDRAWN"
      - name: allocation_share_pct
        type: number
        source: computed
        description: 100 times allocated_mw divided by Deal.contracted_mw, from calculations.allocation_share_pct
        default: null
        constraints: "0.0000-100.0000, 4 decimals"
      - name: confirmed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the buyer confirmed, null otherwise
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who proposed this allocation

  - name: TermSheetRound
    parent: Deal
    common_fields: true
    entity_kind: event
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal being negotiated"
      - name: round_number
        type: integer
        source: computed
        description: One-based sequence number, equal to Deal.round_count after this round is created
        constraints: ">= 1"
      - name: proposed_by
        type: enum
        source: input
        description: Which side tabled this round
        constraints: "one of DEVELOPER, OFFTAKER"
      - name: proposed_fixed_price_usd_per_mwh
        type: number
        source: input
        description: Fixed base price tabled in this round
        constraints: "> 0; at most 2 decimals"
      - name: proposed_escalation_pct_per_year
        type: number
        source: input
        description: Annual escalation percentage tabled in this round
        constraints: "0.0-5.0"
      - name: proposed_shape_product
        type: enum
        source: input
        description: Delivery shape tabled in this round
        constraints: "one of AS_GENERATED, SOLAR_SHAPED_16X5, BASELOAD_FIRM"
      - name: proposed_basis_responsibility
        type: enum
        source: input
        description: Basis risk allocation tabled in this round
        constraints: "one of SELLER, SHARED, BUYER"
      - name: redline_items
        type: array
        source: input
        description: List of contract clause labels the tabling party redlined
        default: []
      - name: response_deadline
        type: datetime
        source: input
        description: Logical-clock instant after which the round can no longer be answered
      - name: status
        type: enum
        source: system
        description: Round lifecycle state
        default: OPEN
        constraints: "one of OPEN, ACCEPTED, COUNTERED, EXPIRED"
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the response, null while OPEN
        default: null
      - name: responded_by_user_id
        type: string
        source: system
        description: X-User-ID of the responder, null while OPEN
        default: null

  - name: CreditSupportInstrument
    parent: Deal
    common_fields: true
    entity_kind: resource
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal this instrument secures"
      - name: instrument_type
        type: enum
        source: input
        description: Form of credit support
        constraints: "one of LETTER_OF_CREDIT, PARENT_GUARANTEE, CASH_COLLATERAL"
      - name: purpose
        type: enum
        source: input
        description: Which obligation the instrument secures; DEVELOPMENT_SECURITY is released at deal effectiveness
        constraints: "one of DEVELOPMENT_SECURITY, PERFORMANCE_SECURITY"
      - name: face_amount_usd
        type: number
        source: input
        description: Face value of the instrument in USD
        constraints: "> 0; at most 2 decimals"
      - name: issuer_name
        type: string
        source: input
        description: Issuing bank for a letter of credit, or the depositary for cash collateral
        constraints: "1-128 chars"
      - name: issuer_rating
        type: enum
        source: input
        description: Rating of the issuing bank, required for LETTER_OF_CREDIT and ignored otherwise
        default: null
        constraints: "null or one of AAA, AA, A, BBB, BB, B, CCC, NR"
      - name: guarantor_offtaker_id
        type: string
        source: input
        description: "FK -> Offtaker.id; nullable; required for PARENT_GUARANTEE and ignored otherwise"
        default: null
      - name: effective_date
        type: datetime
        source: input
        description: Date from which the instrument is in force
      - name: expiry_date
        type: datetime
        source: input
        description: Date on which the instrument lapses
      - name: status
        type: enum
        source: system
        description: Instrument lifecycle state
        default: PROPOSED
        constraints: "one of PROPOSED, POSTED, RELEASED, DRAWN, EXPIRED"
      - name: haircut_pct
        type: number
        source: computed
        description: Valuation haircut from calculations.eligible_credit_support, expressed as a PERCENTAGE (10.00 means a 10% haircut), not a fraction
        default: null
        constraints: "0.00-100.00, 2 decimals"
      - name: eligible_credit_usd
        type: number
        source: computed
        description: face_amount_usd net of haircut_pct, from calculations.eligible_credit_support
        default: null
        constraints: ">= 0, 2 decimals"
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the instrument was posted, null while PROPOSED
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the instrument was released, drawn or expired
        default: null

  - name: ConditionPrecedent
    parent: Deal
    common_fields: true
    entity_kind: resource
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal whose effectiveness this condition gates"
      - name: cp_type
        type: enum
        source: system
        description: Milestone class of the condition, assigned by the execute cascade
        constraints: "one of PERMITTING, INTERCONNECTION, NOTICE_TO_PROCEED, REGISTRY_ACCOUNT"
      - name: deadline_date
        type: datetime
        source: system
        description: Logical-clock deadline by which the condition must close
      - name: is_waivable
        type: boolean
        source: system
        description: Whether DealCommittee may waive this condition; false for PERMITTING and INTERCONNECTION
      - name: status
        type: enum
        source: system
        description: Condition lifecycle state
        default: PENDING
        constraints: "one of PENDING, SATISFIED, WAIVED, FAILED"
      - name: evidence_ref
        type: string
        source: input
        description: Document reference recorded when the condition is satisfied
        default: null
      - name: waiver_justification
        type: string
        source: input
        description: Justification recorded when the condition is waived
        default: null
      - name: cure_deadline
        type: datetime
        source: system
        description: Logical-clock deadline for re-curing a FAILED condition, null unless FAILED
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of the last resolution, null while PENDING and never resolved
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who last resolved this condition
        default: null

  - name: SettlementPeriod
    parent: Deal
    common_fields: true
    entity_kind: resource
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal being settled"
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the settlement window
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the settlement window
      - name: netting_method
        type: enum
        source: computed
        description: Snapshot of Deal.settlement_frequency taken when the period was created; pins which settlement_netting variant runs
        constraints: "one of HOURLY, MONTHLY"
      - name: status
        type: enum
        source: system
        description: Settlement lifecycle state
        default: OPEN
        constraints: "one of OPEN, CALCULATED, INVOICED, DISPUTED, SETTLED"
      - name: interval_count
        type: integer
        source: computed
        description: Number of MeterInterval rows posted to this period
        default: 0
        constraints: ">= 0"
      - name: total_metered_mwh
        type: number
        source: computed
        description: Sum of metered_mwh over this period's MeterIntervals
        default: 0
        constraints: ">= 0, 3 decimals"
      - name: total_deemed_mwh
        type: number
        source: computed
        description: Sum of deemed_mwh over this period's MeterIntervals after the settlement run
        default: 0
        constraints: ">= 0, 3 decimals"
      - name: total_delivered_mwh
        type: number
        source: computed
        description: total_metered_mwh plus total_deemed_mwh
        default: 0
        constraints: ">= 0, 3 decimals"
      - name: weighted_avg_index_usd_per_mwh
        type: number
        source: computed
        description: Delivery-weighted average settlement-point price, computed only by the MONTHLY variant
        default: null
        constraints: "4 decimals"
      - name: energy_settlement_usd
        type: number
        source: computed
        description: Energy leg of the settlement from calculations.settlement_netting
        default: null
        constraints: "2 decimals; may be negative"
      - name: basis_adjustment_usd
        type: number
        source: computed
        description: Basis leg of the settlement from calculations.settlement_netting
        default: null
        constraints: "2 decimals; may be negative"
      - name: net_settlement_usd
        type: number
        source: computed
        description: energy_settlement_usd plus basis_adjustment_usd
        default: null
        constraints: "2 decimals; may be negative"
      - name: seller_pays_usd
        type: number
        source: computed
        description: Amount the seller owes the buyer this period
        default: null
        constraints: ">= 0, 2 decimals"
      - name: buyer_pays_usd
        type: number
        source: computed
        description: Amount the buyer owes the seller this period
        default: null
        constraints: ">= 0, 2 decimals"
      - name: mintable_attributes_mwh
        type: integer
        source: computed
        description: Whole MWh of environmental attributes eligible for minting from this period
        default: null
        constraints: ">= 0"
      - name: calculated_at
        type: datetime
        source: system
        description: Logical-clock instant of the last settlement run, null while OPEN
        default: null
      - name: invoiced_at
        type: datetime
        source: system
        description: Logical-clock instant of invoicing, null before
        default: null
      - name: dispute_reason
        type: string
        source: input
        description: Reason recorded when the buyer disputes an invoice
        default: null

  - name: MeterInterval
    parent: SettlementPeriod
    common_fields: true
    entity_kind: event
    fields:
      - name: settlement_period_id
        type: string
        source: system
        description: "FK -> SettlementPeriod.id; the period this hour belongs to"
      - name: hour_start
        type: datetime
        source: input
        description: Inclusive start of the one-hour slot; the slot is the half-open range from hour_start to hour_start plus one hour
      - name: metered_mwh
        type: number
        source: input
        description: Metered generation delivered in the hour
        constraints: ">= 0; at most 3 decimals"
      - name: node_price_usd_per_mwh
        type: number
        source: input
        description: Published price at the project's injection node for the hour
        constraints: "at most 2 decimals; may be negative"
      - name: hub_price_usd_per_mwh
        type: number
        source: input
        description: Published price at the trading hub for the hour
        constraints: "at most 2 decimals; may be negative"
      - name: curtailment_flag
        type: enum
        source: input
        description: Curtailment cause for the hour
        default: NONE
        constraints: "one of NONE, ECONOMIC, GRID_EMERGENCY, BUYER_REQUESTED"
      - name: expected_mwh
        type: number
        source: computed
        description: Contract-shape expectation for the hour from calculations.deemed_generation
        default: null
        constraints: ">= 0, 3 decimals"
      - name: deemed_mwh
        type: number
        source: computed
        description: Deemed generation credited for the hour from calculations.deemed_generation
        default: 0
        constraints: ">= 0, 3 decimals"
      - name: delivered_mwh
        type: number
        source: computed
        description: metered_mwh plus deemed_mwh, the quantity the settlement legs multiply
        default: null
        constraints: ">= 0, 3 decimals"
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID of the analyst who posted this interval

  - name: EnvironmentalAttributeBatch
    parent: Deal
    common_fields: true
    entity_kind: resource
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal that generated these attributes"
      - name: vintage_month
        type: string
        source: computed
        description: Generation month of the attributes in YYYY-MM form, taken from the source period's period_start
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: quantity_mwh
        type: integer
        source: input
        description: Whole MWh minted, equal to the source period's mintable_attributes_mwh
        constraints: ">= 1"
      - name: registry
        type: enum
        source: input
        description: Attribute registry holding the certificates
        constraints: "one of WREGIS, MRETS, NAR"
      - name: registry_serial_range
        type: string
        source: input
        description: Serial range assigned by the registry on transfer, null until transferred
        default: null
      - name: status
        type: enum
        source: system
        description: Attribute conveyance state
        default: MINTED
        constraints: "one of MINTED, TRANSFERRED, RETIRED, CANCELLED"
      - name: transferred_to_offtaker_id
        type: string
        source: input
        description: "FK -> Offtaker.id; nullable; the buyer whose registry account received the batch"
        default: null
      - name: allocation_breakdown
        type: array
        source: computed
        description: Per-buyer whole-MWh split from calculations.attribute_allocation, as objects with offtaker_id and quantity_mwh
        default: []
      - name: claim_year
        type: integer
        source: input
        description: Reporting year the buyer claims the retired attributes against, null until retired
        default: null
        constraints: "null or 2026-2040"
      - name: claim_substantiation_status
        type: enum
        source: computed
        description: Whether the buyer's renewable claim is substantiated by registry retirement
        default: UNSUBSTANTIATED
        constraints: "one of UNSUBSTANTIATED, SUBSTANTIATED"
      - name: transferred_at
        type: datetime
        source: system
        description: Logical-clock instant of registry transfer, null otherwise
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: Logical-clock instant of registry retirement, null otherwise
        default: null

  - name: RiskEvent
    parent: Deal
    common_fields: true
    entity_kind: resource
    fields:
      - name: deal_id
        type: string
        source: system
        description: "FK -> Deal.id; the deal the claim is made under"
      - name: event_type
        type: enum
        source: input
        description: Risk allocation clause invoked
        constraints: "one of CHANGE_IN_LAW, FORCE_MAJEURE, CURTAILMENT"
      - name: claimed_by
        type: enum
        source: input
        description: Which party filed the claim
        constraints: "one of DEVELOPER, OFFTAKER"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the claimed event window
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the claimed event window
      - name: description
        type: string
        source: input
        description: Narrative of the claimed event
        constraints: "1-512 chars"
      - name: status
        type: enum
        source: system
        description: Claim review state
        default: CLAIMED
        constraints: "one of CLAIMED, ACCEPTED, REJECTED"
      - name: allocation_outcome
        type: enum
        source: input
        description: How the accepted event is allocated between the parties, null unless ACCEPTED
        default: null
        constraints: "one of SELLER_BEARS, BUYER_BEARS, SHARED"
      - name: price_adjustment_usd_per_mwh
        type: number
        source: input
        description: Contract price adjustment granted for an accepted CHANGE_IN_LAW claim, null otherwise
        default: null
        constraints: "-10.00 to 10.00; at most 2 decimals"
      - name: duration_days
        type: integer
        source: computed
        description: Whole days from window_start to window_end inclusive of both endpoints
        constraints: ">= 1"
      - name: excused_hours
        type: integer
        source: computed
        description: Number of MeterInterval hours across the deal's periods that fall inside the accepted window
        default: 0
        constraints: ">= 0"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the operator who reviewed the claim, null while CLAIMED
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: Logical-clock instant of review, null while CLAIMED
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Offtaker
    dimension: qualification_status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /ppa/offtakers/{id}/submit-qualification"
        actor: Originator
        preconditions:
          - "Offtaker.qualification_status == DRAFT"
          - "Offtaker.rating_agency != NONE or Offtaker.credit_rating == NR"
        side_effects:
          - "recompute Offtaker.credit_score and Offtaker.credit_score_variant via calculations.offtaker_credit_score"
          - "recompute Offtaker.credit_tier from the credit_score threshold table"
          - "recompute Offtaker.sustainability_score via calculations.offtaker_sustainability_score"
          - "recompute Offtaker.unsecured_credit_limit_usd via calculations.unsecured_credit_limit"
          - "increments Offtaker.version by 1"
      - from: CONDITIONAL
        to: UNDER_REVIEW
        trigger: "POST /ppa/offtakers/{id}/submit-qualification"
        actor: Originator
        preconditions:
          - "Offtaker.qualification_status == CONDITIONAL"
        side_effects:
          - "clear Offtaker.conditions to the empty array"
          - "recompute credit_score, credit_score_variant, credit_tier, sustainability_score and unsecured_credit_limit_usd exactly as on the DRAFT to UNDER_REVIEW transition"
          - "increments Offtaker.version by 1"
        note: "Revision loop — a conditionally qualified buyer re-submits after remediating conditions."
      - from: UNDER_REVIEW
        to: QUALIFIED
        trigger: "POST /ppa/offtakers/{id}/qualification-decision with decision QUALIFY"
        actor: CreditOfficer
        preconditions:
          - "Offtaker.qualification_status == UNDER_REVIEW"
          - "X-User-ID != Offtaker.created_by_user_id (segregation of duties)"
          - "Offtaker.credit_tier IN {PRIME, STANDARD}"
          - "Offtaker.sustainability_score >= 70.00"
        side_effects:
          - "set Offtaker.decision_by_user_id to X-User-ID"
          - "set Offtaker.conditions to the empty array"
          - "increments Offtaker.version by 1"
      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "POST /ppa/offtakers/{id}/qualification-decision with decision CONDITIONAL"
        actor: CreditOfficer
        preconditions:
          - "Offtaker.qualification_status == UNDER_REVIEW"
          - "X-User-ID != Offtaker.created_by_user_id (segregation of duties)"
          - "Offtaker.credit_tier != DECLINED"
          - "Offtaker.sustainability_score >= 40.00"
          - "request supplies a non-empty conditions array"
        side_effects:
          - "set Offtaker.conditions to the supplied conditions array"
          - "set Offtaker.decision_by_user_id to X-User-ID"
          - "increments Offtaker.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /ppa/offtakers/{id}/qualification-decision with decision REJECT"
        actor: CreditOfficer
        preconditions:
          - "Offtaker.qualification_status == UNDER_REVIEW"
          - "X-User-ID != Offtaker.created_by_user_id (segregation of duties)"
        side_effects:
          - "set Offtaker.decision_by_user_id to X-User-ID"
          - "for every Deal whose anchor_offtaker_id == this Offtaker.id and whose status IN {DRAFT, TERM_SHEET_ISSUED, UNDER_NEGOTIATION}: set Deal.credit_status to DECLINED and increment that Deal.version by 1"
          - "increments Offtaker.version by 1"
      - from: QUALIFIED
        to: WATCHLIST
        trigger: "POST /ppa/offtakers/{id}/rating-change lowering credit_tier to SUBPRIME or DECLINED"
        actor: CreditOfficer
        preconditions:
          - "Offtaker.qualification_status == QUALIFIED"
          - "recomputed Offtaker.credit_tier IN {SUBPRIME, DECLINED}"
        side_effects:
          - "CASCADE hop 1: recompute Offtaker.credit_score, credit_score_variant, credit_tier and unsecured_credit_limit_usd; set watchlist_since to the logical clock"
          - "CASCADE hop 2 (caused by hop 1's new unsecured_credit_limit_usd): for every Deal whose anchor_offtaker_id == this Offtaker.id and whose status IN {TERMS_AGREED, EXECUTED, EFFECTIVE}: re-snapshot Deal.unsecured_credit_limit_usd and recompute Deal.credit_support_required_usd via calculations.credit_support_requirement"
          - "CASCADE hop 3 (caused by hop 2's new requirement): for each such Deal whose credit_status == APPROVED and whose posted_credit_support_usd < credit_support_required_usd: set credit_status to SUPPORT_SHORTFALL and support_cure_deadline to the logical clock plus SUPPORT_CURE_DAYS days"
          - "CASCADE hop 4 (caused by hop 1's new credit_tier): for every Offtaker whose parent_guarantor_offtaker_id == this Offtaker.id and whose credit_score_variant == GUARANTOR_SUPPORTED: recompute their credit_score, credit_score_variant, credit_tier and unsecured_credit_limit_usd and increment their version by 1"
          - "increments Offtaker.version by 1"
      - from: WATCHLIST
        to: QUALIFIED
        trigger: "POST /ppa/offtakers/{id}/rating-change raising credit_tier back to PRIME or STANDARD"
        actor: CreditOfficer
        preconditions:
          - "Offtaker.qualification_status == WATCHLIST"
          - "recomputed Offtaker.credit_tier IN {PRIME, STANDARD}"
        side_effects:
          - "recompute credit_score, credit_score_variant, credit_tier and unsecured_credit_limit_usd; set watchlist_since to null"
          - "for every Deal whose anchor_offtaker_id == this Offtaker.id and whose status IN {TERMS_AGREED, EXECUTED, EFFECTIVE}: re-snapshot Deal.unsecured_credit_limit_usd and recompute Deal.credit_support_required_usd"
          - "for each such Deal whose credit_status == SUPPORT_SHORTFALL and whose posted_credit_support_usd >= the recomputed credit_support_required_usd: set credit_status to APPROVED and support_cure_deadline to null"
          - "increments Offtaker.version by 1"
        note: "Upgrade loop back out of the watchlist — makes qualification_status cyclic."
      - from: WATCHLIST
        to: REJECTED
        trigger: "POST /ppa/offtakers/{id}/rating-change whose recomputed credit_tier is DECLINED while the buyer is already on the watchlist"
        actor: CreditOfficer
        preconditions:
          - "Offtaker.qualification_status == WATCHLIST"
          - "recomputed Offtaker.credit_tier == DECLINED"
          - "Offtaker.watchlist_since is not null"
        side_effects:
          - "recompute credit_score, credit_score_variant, credit_tier and unsecured_credit_limit_usd"
          - "for every Deal whose anchor_offtaker_id == this Offtaker.id and whose status IN {DRAFT, TERM_SHEET_ISSUED, UNDER_NEGOTIATION}: set Deal.credit_status to DECLINED"
          - "increments Offtaker.version by 1"

  - entity: Project
    dimension: status
    initial_state: PRE_DEVELOPMENT
    terminal_states: [OPERATIONAL]
    shape: linear
    transitions:
      - from: PRE_DEVELOPMENT
        to: PERMITTED
        trigger: "POST /ppa/projects/{id}/advance-milestone with milestone PERMITTED"
        actor: Originator
        preconditions:
          - "Project.status == PRE_DEVELOPMENT"
        side_effects:
          - "set Project.last_milestone_at to the logical clock"
          - "CASCADE hop 2: every ConditionPrecedent with cp_type == PERMITTING and status == PENDING whose Deal.project_id == this Project.id and whose Deal.status == EXECUTED transitions PENDING to SATISFIED with evidence_ref copied from the request and resolved_at set to the logical clock"
          - "CASCADE hop 3 (caused by hop 2): each affected Deal recomputes cp_completion_pct via calculations.cp_completion_pct; a Deal reaching 100.00 transitions EXECUTED to EFFECTIVE with effective_at set to the logical clock"
          - "CASCADE hop 4 (caused by hop 3): for each Deal that became EFFECTIVE, every CreditSupportInstrument with purpose == DEVELOPMENT_SECURITY and status == POSTED transitions POSTED to RELEASED with closed_at set to the logical clock"
          - "CASCADE hop 5 (caused by hop 4): each such Deal recomputes posted_credit_support_usd and released_credit_support_usd"
          - "increments Project.version by 1"
      - from: PERMITTED
        to: INTERCONNECTION_APPROVED
        trigger: "POST /ppa/projects/{id}/advance-milestone with milestone INTERCONNECTION_APPROVED"
        actor: Originator
        preconditions:
          - "Project.status == PERMITTED"
        side_effects:
          - "set Project.last_milestone_at to the logical clock"
          - "same four-hop cascade as the PERMITTED transition, matching ConditionPrecedent.cp_type == INTERCONNECTION"
          - "increments Project.version by 1"
      - from: INTERCONNECTION_APPROVED
        to: NTP_ISSUED
        trigger: "POST /ppa/projects/{id}/advance-milestone with milestone NOTICE_TO_PROCEED"
        actor: Originator
        preconditions:
          - "Project.status == INTERCONNECTION_APPROVED"
        side_effects:
          - "set Project.last_milestone_at to the logical clock"
          - "same four-hop cascade as the PERMITTED transition, matching ConditionPrecedent.cp_type == NOTICE_TO_PROCEED"
          - "increments Project.version by 1"
      - from: NTP_ISSUED
        to: OPERATIONAL
        trigger: "POST /ppa/projects/{id}/advance-milestone with milestone OPERATIONAL"
        actor: Originator
        preconditions:
          - "Project.status == NTP_ISSUED"
        side_effects:
          - "set Project.last_milestone_at to the logical clock"
          - "recompute Project.contracted_mw and Project.available_mw"
          - "increments Project.version by 1"

  - entity: Deal
    dimension: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: TERM_SHEET_ISSUED
        trigger: "POST /ppa/deals/{id}/rounds with proposed_by DEVELOPER"
        actor: Originator
        preconditions:
          - "Deal.status == DRAFT"
          - "the anchor Offtaker.qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "create TermSheetRound with round_number = Deal.round_count + 1 and status OPEN"
          - "increment Deal.round_count by 1"
          - "increments Deal.version by 1"
      - from: TERM_SHEET_ISSUED
        to: UNDER_NEGOTIATION
        trigger: "POST /ppa/rounds/{id}/respond with response COUNTER"
        actor: OfftakerRep
        preconditions:
          - "Deal.status == TERM_SHEET_ISSUED"
          - "TermSheetRound.status == OPEN"
          - "logical clock <= TermSheetRound.response_deadline"
        side_effects:
          - "the answered TermSheetRound transitions OPEN to COUNTERED with responded_at and responded_by_user_id set"
          - "create a successor TermSheetRound with proposed_by OFFTAKER, round_number = Deal.round_count + 1, status OPEN, response_deadline = logical clock plus ROUND_RESPONSE_DAYS days, and the counter terms copied from the request"
          - "increment Deal.round_count by 1"
          - "increments Deal.version by 1"
      - from: UNDER_NEGOTIATION
        to: TERM_SHEET_ISSUED
        trigger: "POST /ppa/deals/{id}/rounds with proposed_by DEVELOPER"
        actor: Originator
        preconditions:
          - "Deal.status == UNDER_NEGOTIATION"
        side_effects:
          - "any TermSheetRound of this deal whose status == OPEN and whose response_deadline < the logical clock transitions OPEN to EXPIRED"
          - "any TermSheetRound of this deal whose status == OPEN and whose response_deadline >= the logical clock transitions OPEN to COUNTERED with responded_by_user_id set to X-User-ID"
          - "create TermSheetRound with round_number = Deal.round_count + 1 and status OPEN"
          - "increment Deal.round_count by 1"
          - "increments Deal.version by 1"
        note: "Redline loop — TERM_SHEET_ISSUED and UNDER_NEGOTIATION alternate once per negotiation round, making Deal.status cyclic."
      - from: TERM_SHEET_ISSUED
        to: TERMS_AGREED
        trigger: "POST /ppa/rounds/{id}/respond with response ACCEPT"
        actor: OfftakerRep
        preconditions:
          - "Deal.status == TERM_SHEET_ISSUED"
          - "TermSheetRound.status == OPEN"
          - "logical clock <= TermSheetRound.response_deadline"
          - "X-User-ID == Deal.anchor_offtaker_id"
        side_effects:
          - "the answered TermSheetRound transitions OPEN to ACCEPTED with responded_at and responded_by_user_id set"
          - "copy the round's proposed_fixed_price_usd_per_mwh, proposed_escalation_pct_per_year, proposed_shape_product and proposed_basis_responsibility onto Deal.base_fixed_price_usd_per_mwh, escalation_pct_per_year, shape_product and basis_responsibility"
          - "compute Deal.contract_price_usd_per_mwh and Deal.price_tier via calculations.deal_contract_price"
          - "increments Deal.version by 1"
      - from: TERMS_AGREED
        to: UNDER_NEGOTIATION
        trigger: "POST /ppa/deals/{id}/rounds with proposed_by DEVELOPER while Deal.credit_status != APPROVED"
        actor: Originator
        preconditions:
          - "Deal.status == TERMS_AGREED"
          - "Deal.credit_status != APPROVED"
        side_effects:
          - "set Deal.contract_price_usd_per_mwh and Deal.price_tier to null"
          - "create TermSheetRound with round_number = Deal.round_count + 1 and status OPEN"
          - "increment Deal.round_count by 1"
          - "increments Deal.version by 1"
        note: "Re-opening agreed terms is only allowed before credit approval; this closes the negotiation cycle from the far side."
      - from: TERMS_AGREED
        to: EXECUTED
        trigger: "POST /ppa/deals/{id}/execute"
        actor: DealCommittee
        preconditions:
          - "Deal.status == TERMS_AGREED"
          - "Deal.credit_status == APPROVED"
          - "X-User-ID != Deal.credit_approved_by_user_id (segregation of duties)"
          - "the anchor Offtaker.qualification_status == QUALIFIED (a CONDITIONAL buyer may negotiate and clear credit but may not sign; see §1.4 ERR_OFFTAKER_NOT_QUALIFIED)"
          - "Deal.confirmed_allocated_mw == Deal.contracted_mw"
          - "Project.available_mw >= Deal.contracted_mw"
        side_effects:
          - "create one ConditionPrecedent per applicable row of the CP_TEMPLATE in calculations.cp_template_selection, each with status PENDING"
          - "recompute Deal.cp_total_count and Deal.cp_completion_pct via calculations.cp_completion_pct"
          - "recompute Project.contracted_mw and Project.available_mw"
          - "if the CP set is empty, cp_completion_pct is 100.00 and the deal immediately transitions EXECUTED to EFFECTIVE in the same request"
          - "increments Deal.version by 1"
      - from: EXECUTED
        to: EFFECTIVE
        trigger: "system, when Deal.cp_completion_pct reaches 100.00 after a ConditionPrecedent resolution or a Project milestone advance, or immediately on execute when the CP set is empty"
        actor: system
        preconditions:
          - "Deal.status == EXECUTED"
          - "Deal.cp_completion_pct == 100.00"
        side_effects:
          - "set Deal.effective_at to the logical clock"
          - "every CreditSupportInstrument of this deal with purpose == DEVELOPMENT_SECURITY and status == POSTED transitions POSTED to RELEASED with closed_at set to the logical clock"
          - "recompute Deal.posted_credit_support_usd and Deal.released_credit_support_usd"
          - "increments Deal.version by 1"
      - from: TERMS_AGREED
        to: TERMINATED
        trigger: "POST /ppa/deals/{id}/terminate"
        actor: DealCommittee
        preconditions:
          - "Deal.status == TERMS_AGREED"
          - "the termination right for the supplied reason is vested (§1.4 ERR_TERMINATION_RIGHT_NOT_VESTED)"
        side_effects:
          - "set Deal.terminated_at to the logical clock and Deal.termination_reason to the supplied reason"
          - "every DealAllocation of this deal whose status IN {PROPOSED, CONFIRMED} transitions to WITHDRAWN"
          - "recompute Deal.confirmed_allocated_mw and Deal.unallocated_mw"
          - "increments Deal.version by 1"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /ppa/deals/{id}/terminate"
        actor: DealCommittee
        preconditions:
          - "Deal.status == EXECUTED"
          - "the termination right for the supplied reason is vested (§1.4 ERR_TERMINATION_RIGHT_NOT_VESTED)"
        side_effects:
          - "CASCADE hop 1: set Deal.terminated_at to the logical clock and Deal.termination_reason to the supplied reason"
          - "CASCADE hop 2 (caused by hop 1): every ConditionPrecedent of this deal whose status == PENDING transitions PENDING to FAILED with resolved_at set to the logical clock and cure_deadline set to null"
          - "CASCADE hop 3 (caused by hop 2): recompute Deal.cp_completion_pct over the new CP statuses"
          - "CASCADE hop 2b (caused by hop 1): every CreditSupportInstrument of this deal whose status == POSTED transitions POSTED to DRAWN when termination_reason == BUYER_DEFAULT, and POSTED to RELEASED for every other reason, with closed_at set to the logical clock"
          - "CASCADE hop 3b (caused by hop 2b): recompute Deal.posted_credit_support_usd, Deal.released_credit_support_usd and Deal.drawn_credit_support_usd"
          - "CASCADE hop 2c (caused by hop 1): every EnvironmentalAttributeBatch of this deal whose status == MINTED transitions MINTED to CANCELLED"
          - "CASCADE hop 3c (caused by hop 2c): recompute Deal.attributes_minted_mwh"
          - "recompute Project.contracted_mw and Project.available_mw"
          - "increments Deal.version by 1"
      - from: EFFECTIVE
        to: TERMINATED
        trigger: "POST /ppa/deals/{id}/terminate"
        actor: DealCommittee
        preconditions:
          - "Deal.status == EFFECTIVE"
          - "the termination right for the supplied reason is vested (§1.4 ERR_TERMINATION_RIGHT_NOT_VESTED)"
          - "no SettlementPeriod of this deal has status DISPUTED"
        side_effects:
          - "identical cascade to the EXECUTED to TERMINATED transition"
          - "every SettlementPeriod of this deal whose status == OPEN is left untouched; periods already CALCULATED or INVOICED are unaffected"
          - "increments Deal.version by 1"

  - entity: Deal
    dimension: credit_status
    initial_state: NOT_SUBMITTED
    terminal_states: []
    shape: parallel_dimension
    transitions:
      - from: NOT_SUBMITTED
        to: SUBMITTED
        trigger: "POST /ppa/deals/{id}/submit-credit"
        actor: Originator
        preconditions:
          - "Deal.credit_status IN {NOT_SUBMITTED, DECLINED, SUPPORT_SHORTFALL}"
          - "Deal.contract_price_usd_per_mwh is not null"
          - "the anchor Offtaker.qualification_status IN {QUALIFIED, CONDITIONAL}"
        side_effects:
          - "every CreditSupportInstrument of this deal whose status == POSTED and whose expiry_date <= the logical clock transitions POSTED to EXPIRED with closed_at set to the logical clock"
          - "snapshot Deal.unsecured_credit_limit_usd from the anchor Offtaker.unsecured_credit_limit_usd"
          - "compute Deal.expected_annual_mwh, Deal.exposure_usd and Deal.credit_support_required_usd via calculations.credit_support_requirement"
          - "recompute Deal.posted_credit_support_usd over the surviving POSTED instruments"
          - "increments Deal.version by 1"
      - from: DECLINED
        to: SUBMITTED
        trigger: "POST /ppa/deals/{id}/submit-credit"
        actor: Originator
        preconditions:
          - "Deal.credit_status == DECLINED"
          - "Deal.contract_price_usd_per_mwh is not null"
        side_effects:
          - "identical side effects to the NOT_SUBMITTED to SUBMITTED transition"
          - "increments Deal.version by 1"
        note: "Re-underwriting loop after a declined credit package."
      - from: SUPPORT_SHORTFALL
        to: SUBMITTED
        trigger: "POST /ppa/deals/{id}/submit-credit"
        actor: Originator
        preconditions:
          - "Deal.credit_status == SUPPORT_SHORTFALL"
        side_effects:
          - "identical side effects to the NOT_SUBMITTED to SUBMITTED transition"
          - "set Deal.support_cure_deadline to null"
          - "increments Deal.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ppa/deals/{id}/credit-decision with decision APPROVE"
        actor: CreditOfficer
        preconditions:
          - "Deal.credit_status == SUBMITTED"
          - "the anchor Offtaker.qualification_status IN {QUALIFIED, CONDITIONAL}"
          - "Deal.posted_credit_support_usd >= Deal.credit_support_required_usd"
        side_effects:
          - "set Deal.credit_approved_by_user_id to X-User-ID"
          - "leave Deal.collateral_threshold_usd at the value snapshotted during submit-credit; the approval does not renegotiate it"
          - "increments Deal.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /ppa/deals/{id}/credit-decision with decision DECLINE"
        actor: CreditOfficer
        preconditions:
          - "Deal.credit_status == SUBMITTED"
        side_effects:
          - "set Deal.credit_approved_by_user_id to null"
          - "increments Deal.version by 1"
      - from: APPROVED
        to: SUPPORT_SHORTFALL
        trigger: "system, when a rating-change cascade or an accepted CHANGE_IN_LAW price adjustment raises credit_support_required_usd above posted_credit_support_usd"
        actor: system
        preconditions:
          - "Deal.credit_status == APPROVED"
          - "Deal.posted_credit_support_usd < the recomputed Deal.credit_support_required_usd"
        side_effects:
          - "set Deal.support_cure_deadline to the logical clock plus SUPPORT_CURE_DAYS days"
          - "increments Deal.version by 1"
      - from: SUPPORT_SHORTFALL
        to: APPROVED
        trigger: "POST /ppa/credit-support/{id}/post, when the newly posted instrument closes the shortfall"
        actor: CreditOfficer
        preconditions:
          - "Deal.credit_status == SUPPORT_SHORTFALL"
          - "the recomputed Deal.posted_credit_support_usd >= Deal.credit_support_required_usd"
        side_effects:
          - "set Deal.support_cure_deadline to null"
          - "increments Deal.version by 1"
        note: "Cure loop — credit_status returns to APPROVED without touching Deal.status, which is why the two dimensions are independent."

  - entity: DealAllocation
    dimension: status
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN]
    shape: branching
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /ppa/allocations/{id}/decision with decision CONFIRM"
        actor: OfftakerRep
        preconditions:
          - "DealAllocation.status == PROPOSED"
          - "X-User-ID == DealAllocation.offtaker_id"
          - "the referenced Offtaker.qualification_status IN {QUALIFIED, CONDITIONAL}"
          - "Deal.status IN {TERM_SHEET_ISSUED, UNDER_NEGOTIATION, TERMS_AGREED}"
        side_effects:
          - "set DealAllocation.confirmed_at to the logical clock"
          - "recompute Deal.confirmed_allocated_mw and Deal.unallocated_mw"
          - "increments DealAllocation.version by 1 and Deal.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /ppa/allocations/{id}/decision with decision WITHDRAW"
        actor: OfftakerRep
        preconditions:
          - "DealAllocation.status == PROPOSED"
          - "X-User-ID == DealAllocation.offtaker_id"
        side_effects:
          - "recompute Deal.unallocated_mw"
          - "increments DealAllocation.version by 1 and Deal.version by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /ppa/allocations/{id}/decision with decision WITHDRAW"
        actor: OfftakerRep
        preconditions:
          - "DealAllocation.status == CONFIRMED"
          - "X-User-ID == DealAllocation.offtaker_id"
          - "Deal.status IN {TERM_SHEET_ISSUED, UNDER_NEGOTIATION, TERMS_AGREED}"
        side_effects:
          - "recompute Deal.confirmed_allocated_mw and Deal.unallocated_mw"
          - "increments DealAllocation.version by 1 and Deal.version by 1"
        note: "Compensating action for CONFIRM — the pair must leave Deal.unallocated_mw at its pre-proposal value."

  - entity: TermSheetRound
    dimension: status
    initial_state: OPEN
    terminal_states: [ACCEPTED, COUNTERED, EXPIRED]
    shape: branching
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /ppa/rounds/{id}/respond with response ACCEPT"
        actor: OfftakerRep
        preconditions:
          - "TermSheetRound.status == OPEN"
          - "logical clock <= TermSheetRound.response_deadline"
          - "X-User-ID == the parent Deal.anchor_offtaker_id"
        side_effects:
          - "set responded_at to the logical clock and responded_by_user_id to X-User-ID"
          - "drive the parent Deal from TERM_SHEET_ISSUED to TERMS_AGREED with the price recomputation described there"
          - "increments TermSheetRound.version by 1"
      - from: OPEN
        to: COUNTERED
        trigger: "POST /ppa/rounds/{id}/respond with response COUNTER, or a new developer round tabled while this round is still answerable"
        actor: OfftakerRep
        preconditions:
          - "TermSheetRound.status == OPEN"
          - "logical clock <= TermSheetRound.response_deadline"
        side_effects:
          - "set responded_at to the logical clock and responded_by_user_id to X-User-ID"
          - "create the successor round described on the Deal TERM_SHEET_ISSUED to UNDER_NEGOTIATION transition"
          - "increments TermSheetRound.version by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "system, during POST /ppa/deals/{id}/rounds when this round's response_deadline has already passed"
        actor: system
        preconditions:
          - "TermSheetRound.status == OPEN"
          - "TermSheetRound.response_deadline < the logical clock"
        side_effects:
          - "leave responded_at and responded_by_user_id null"
          - "increments TermSheetRound.version by 1"

  - entity: CreditSupportInstrument
    dimension: status
    initial_state: PROPOSED
    terminal_states: [RELEASED, DRAWN, EXPIRED]
    shape: branching
    transitions:
      - from: PROPOSED
        to: POSTED
        trigger: "POST /ppa/credit-support/{id}/post"
        actor: CreditOfficer
        preconditions:
          - "CreditSupportInstrument.status == PROPOSED"
          - "Deal.credit_status IN {SUBMITTED, APPROVED, SUPPORT_SHORTFALL, DECLINED}"
          - "for LETTER_OF_CREDIT: issuer_rating IN {AAA, AA, A, BBB, BB}"
          - "for PARENT_GUARANTEE: guarantor_offtaker_id == the anchor Offtaker.parent_guarantor_offtaker_id and the guarantor's credit_tier != DECLINED"
          - "for LETTER_OF_CREDIT and PARENT_GUARANTEE: whole days from the logical clock to expiry_date >= MIN_TENOR_DAYS"
          - "the supplied expected_deal_version equals the current Deal.version"
        side_effects:
          - "compute CreditSupportInstrument.haircut_pct and eligible_credit_usd via calculations.eligible_credit_support"
          - "set posted_at to the logical clock"
          - "recompute Deal.posted_credit_support_usd as the sum of eligible_credit_usd over this deal's POSTED instruments"
          - "if Deal.credit_status == SUPPORT_SHORTFALL and the recomputed posted_credit_support_usd >= Deal.credit_support_required_usd: Deal.credit_status transitions SUPPORT_SHORTFALL to APPROVED and support_cure_deadline is set to null"
          - "increments CreditSupportInstrument.version by 1 and increments Deal.version by 1"
      - from: POSTED
        to: RELEASED
        trigger: "POST /ppa/credit-support/{id}/release, or the system release of DEVELOPMENT_SECURITY when the Deal becomes EFFECTIVE, or the termination cascade for any reason other than BUYER_DEFAULT"
        actor: CreditOfficer
        preconditions:
          - "CreditSupportInstrument.status == POSTED"
          - "for the operator-initiated release: Deal.status != TERMINATED and the resulting Deal.posted_credit_support_usd >= Deal.credit_support_required_usd whenever Deal.credit_status == APPROVED"
        side_effects:
          - "set closed_at to the logical clock"
          - "recompute Deal.posted_credit_support_usd and Deal.released_credit_support_usd"
          - "increments CreditSupportInstrument.version by 1 and increments Deal.version by 1"
        note: "Compensating action for POST — the pair must conserve posted + released + drawn."
      - from: POSTED
        to: DRAWN
        trigger: "system, during the termination cascade when Deal.termination_reason == BUYER_DEFAULT"
        actor: system
        preconditions:
          - "CreditSupportInstrument.status == POSTED"
          - "Deal.termination_reason == BUYER_DEFAULT"
        side_effects:
          - "set closed_at to the logical clock"
          - "recompute Deal.posted_credit_support_usd and Deal.drawn_credit_support_usd"
          - "increments CreditSupportInstrument.version by 1"
      - from: POSTED
        to: EXPIRED
        trigger: "system, during POST /ppa/deals/{id}/submit-credit when expiry_date <= the logical clock"
        actor: system
        preconditions:
          - "CreditSupportInstrument.status == POSTED"
          - "CreditSupportInstrument.expiry_date <= the logical clock"
        side_effects:
          - "set closed_at to the logical clock"
          - "recompute Deal.posted_credit_support_usd, which drops by this instrument's eligible_credit_usd"
          - "increments CreditSupportInstrument.version by 1"

  - entity: ConditionPrecedent
    dimension: status
    initial_state: PENDING
    terminal_states: [SATISFIED, WAIVED]
    shape: branching_with_cure_loop
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: "POST /ppa/conditions-precedent/{id}/resolution with resolution SATISFY, or the Project milestone cascade"
        actor: Originator
        preconditions:
          - "ConditionPrecedent.status == PENDING"
          - "the logical clock <= ConditionPrecedent.deadline_date"
          - "request supplies evidence_ref"
          - "Deal.status == EXECUTED"
        side_effects:
          - "set evidence_ref, resolved_at to the logical clock and resolved_by_user_id to X-User-ID"
          - "recompute Deal.cp_completion_pct via calculations.cp_completion_pct"
          - "if the recomputed cp_completion_pct == 100.00: Deal transitions EXECUTED to EFFECTIVE with its own cascade (DEVELOPMENT_SECURITY release and support-balance recompute)"
          - "increments ConditionPrecedent.version by 1 and increments Deal.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /ppa/conditions-precedent/{id}/resolution with resolution WAIVE"
        actor: DealCommittee
        preconditions:
          - "ConditionPrecedent.status == PENDING"
          - "ConditionPrecedent.is_waivable == true"
          - "request supplies waiver_justification"
          - "Deal.status == EXECUTED"
        side_effects:
          - "set waiver_justification, resolved_at to the logical clock and resolved_by_user_id to X-User-ID; evidence_ref stays null"
          - "extend Deal.commercial_operation_deadline by CP_WAIVER_EXTENSION_DAYS days (this side effect fires on WAIVE only, never on SATISFY)"
          - "recompute Deal.cp_completion_pct via calculations.cp_completion_pct"
          - "if the recomputed cp_completion_pct == 100.00: Deal transitions EXECUTED to EFFECTIVE with its own cascade"
          - "increments ConditionPrecedent.version by 1 and increments Deal.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /ppa/conditions-precedent/{id}/resolution with resolution FAIL, or the Deal termination cascade"
        actor: Originator
        preconditions:
          - "ConditionPrecedent.status == PENDING"
          - "Deal.status IN {EXECUTED, TERMINATED}"
        side_effects:
          - "set resolved_at to the logical clock, resolved_by_user_id to X-User-ID and cure_deadline to the logical clock plus CP_CURE_DAYS days"
          - "recompute Deal.cp_completion_pct, which counts FAILED as incomplete"
          - "vest the CP_FAILURE termination right on the Deal"
          - "increments ConditionPrecedent.version by 1 and increments Deal.version by 1"
      - from: FAILED
        to: PENDING
        trigger: "POST /ppa/conditions-precedent/{id}/resolution with resolution RECURE"
        actor: Originator
        preconditions:
          - "ConditionPrecedent.status == FAILED"
          - "the logical clock <= ConditionPrecedent.cure_deadline"
          - "Deal.status == EXECUTED"
        side_effects:
          - "set cure_deadline to null and resolved_at to null"
          - "extend ConditionPrecedent.deadline_date to the logical clock plus CP_CURE_DAYS days"
          - "recompute Deal.cp_completion_pct"
          - "increments ConditionPrecedent.version by 1 and increments Deal.version by 1"
        note: "Cure loop — makes the ConditionPrecedent machine non-linear on top of its three-way fork."

  - entity: SettlementPeriod
    dimension: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /ppa/settlement-periods/{id}/calculate"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementPeriod.status == OPEN"
          - "SettlementPeriod.interval_count >= 1"
          - "Deal.status == EFFECTIVE"
        side_effects:
          - "recompute expected_mwh, deemed_mwh and delivered_mwh on every MeterInterval of the period via calculations.deemed_generation, incrementing each MeterInterval.version by 1"
          - "recompute total_metered_mwh, total_deemed_mwh, total_delivered_mwh, weighted_avg_index_usd_per_mwh, energy_settlement_usd, basis_adjustment_usd, net_settlement_usd, seller_pays_usd and buyer_pays_usd via calculations.settlement_netting using the variant named by SettlementPeriod.netting_method"
          - "recompute mintable_attributes_mwh via calculations.mintable_attributes"
          - "set calculated_at to the logical clock"
          - "increments SettlementPeriod.version by 1"
      - from: CALCULATED
        to: CALCULATED
        trigger: "POST /ppa/settlement-periods/{id}/calculate (re-run after new intervals or an accepted RiskEvent)"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementPeriod.status == CALCULATED"
          - "SettlementPeriod.interval_count >= 1"
          - "Deal.status == EFFECTIVE"
        side_effects:
          - "identical recomputation to the OPEN to CALCULATED transition; previously computed values are overwritten, not accumulated"
          - "increments SettlementPeriod.version by 1"
      - from: CALCULATED
        to: INVOICED
        trigger: "POST /ppa/settlement-periods/{id}/advance with action INVOICE"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementPeriod.status == CALCULATED"
          - "no RiskEvent of this deal whose status == CLAIMED has a window that intersects the period's half-open window"
        side_effects:
          - "set invoiced_at to the logical clock"
          - "increments SettlementPeriod.version by 1"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /ppa/settlement-periods/{id}/advance with action SETTLE"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementPeriod.status == INVOICED"
        side_effects:
          - "increments SettlementPeriod.version by 1"
      - from: INVOICED
        to: DISPUTED
        trigger: "POST /ppa/settlement-periods/{id}/advance with action DISPUTE"
        actor: OfftakerRep
        preconditions:
          - "SettlementPeriod.status == INVOICED"
          - "X-User-ID == the parent Deal.anchor_offtaker_id"
          - "request supplies dispute_reason"
        side_effects:
          - "set dispute_reason from the request"
          - "increments SettlementPeriod.version by 1"
      - from: DISPUTED
        to: CALCULATED
        trigger: "POST /ppa/settlement-periods/{id}/calculate"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementPeriod.status == DISPUTED"
          - "SettlementPeriod.interval_count >= 1"
          - "Deal.status == EFFECTIVE"
        side_effects:
          - "identical recomputation to the OPEN to CALCULATED transition"
          - "set invoiced_at to null and dispute_reason to null"
          - "increments SettlementPeriod.version by 1"
        note: "Dispute loop — INVOICED to DISPUTED to CALCULATED to INVOICED makes the settlement machine cyclic."

  - entity: EnvironmentalAttributeBatch
    dimension: status
    initial_state: MINTED
    terminal_states: [RETIRED, CANCELLED]
    shape: cyclic
    transitions:
      - from: MINTED
        to: TRANSFERRED
        trigger: "POST /ppa/attribute-batches/{id}/transfer"
        actor: RegistryAgent
        preconditions:
          - "EnvironmentalAttributeBatch.status == MINTED"
          - "the recipient Offtaker has a DealAllocation on this deal whose status == CONFIRMED"
          - "the recipient Offtaker.registry_account_id is not null"
        side_effects:
          - "set transferred_to_offtaker_id, registry_serial_range and transferred_at to the logical clock"
          - "compute allocation_breakdown via calculations.attribute_allocation"
          - "recompute Deal.attributes_transferred_mwh"
          - "increments EnvironmentalAttributeBatch.version by 1 and increments Deal.version by 1"
      - from: TRANSFERRED
        to: MINTED
        trigger: "POST /ppa/attribute-batches/{id}/cancel-transfer"
        actor: RegistryAgent
        preconditions:
          - "EnvironmentalAttributeBatch.status == TRANSFERRED"
        side_effects:
          - "set transferred_to_offtaker_id, registry_serial_range, transferred_at to null and allocation_breakdown to the empty array"
          - "recompute Deal.attributes_transferred_mwh, which returns to its pre-transfer value"
          - "increments EnvironmentalAttributeBatch.version by 1 and increments Deal.version by 1"
        note: "Compensating action for TRANSFER — the pair must conserve attribute MWh across the minted, transferred and retired buckets."
      - from: TRANSFERRED
        to: RETIRED
        trigger: "POST /ppa/attribute-batches/{id}/retire"
        actor: RegistryAgent
        preconditions:
          - "EnvironmentalAttributeBatch.status == TRANSFERRED"
          - "EnvironmentalAttributeBatch.claim_substantiation_status == UNSUBSTANTIATED"
          - "request supplies claim_year"
        side_effects:
          - "set retired_at to the logical clock, claim_year from the request and claim_substantiation_status to SUBSTANTIATED"
          - "recompute Deal.attributes_retired_mwh"
          - "increase the recipient Offtaker.claimed_attributes_mwh by quantity_mwh and increment that Offtaker.version by 1"
          - "increments EnvironmentalAttributeBatch.version by 1 and increments Deal.version by 1"
      - from: MINTED
        to: CANCELLED
        trigger: "system, during the Deal termination cascade"
        actor: system
        preconditions:
          - "EnvironmentalAttributeBatch.status == MINTED"
          - "Deal.status == TERMINATED"
        side_effects:
          - "recompute Deal.attributes_minted_mwh, which drops by quantity_mwh"
          - "increments EnvironmentalAttributeBatch.version by 1"

  - entity: RiskEvent
    dimension: status
    initial_state: CLAIMED
    terminal_states: [ACCEPTED, REJECTED]
    shape: branching
    transitions:
      - from: CLAIMED
        to: ACCEPTED
        trigger: "POST /ppa/risk-events/{id}/review with decision ACCEPT"
        actor: DealCommittee
        preconditions:
          - "RiskEvent.status == CLAIMED"
          - "request supplies allocation_outcome"
          - "for event_type == CHANGE_IN_LAW: request supplies price_adjustment_usd_per_mwh"
        side_effects:
          - "CASCADE hop 1: set status ACCEPTED, allocation_outcome, price_adjustment_usd_per_mwh, reviewed_by_user_id to X-User-ID and reviewed_at to the logical clock; recompute excused_hours"
          - "CASCADE hop 2 (caused by hop 1, CHANGE_IN_LAW only): set Deal.contract_price_usd_per_mwh to round(prior contract_price_usd_per_mwh + price_adjustment_usd_per_mwh, 2) and recompute Deal.exposure_usd and Deal.credit_support_required_usd via calculations.credit_support_requirement"
          - "CASCADE hop 3 (caused by hop 2): if Deal.credit_status == APPROVED and Deal.posted_credit_support_usd < the recomputed Deal.credit_support_required_usd: Deal.credit_status transitions APPROVED to SUPPORT_SHORTFALL and support_cure_deadline is set to the logical clock plus SUPPORT_CURE_DAYS days"
          - "increments RiskEvent.version by 1 and increments Deal.version by 1"
        note: "Accepted claims do NOT rewrite already-CALCULATED periods; a SettlementAnalyst must re-run calculate to pick up new deemed generation or the adjusted price."
      - from: CLAIMED
        to: REJECTED
        trigger: "POST /ppa/risk-events/{id}/review with decision REJECT"
        actor: DealCommittee
        preconditions:
          - "RiskEvent.status == CLAIMED"
        side_effects:
          - "set reviewed_by_user_id to X-User-ID and reviewed_at to the logical clock"
          - "leave allocation_outcome and price_adjustment_usd_per_mwh null, leave excused_hours at 0"
          - "increments RiskEvent.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only sanctioned
# mechanism; every entry below survives the serial-observability filter because
# a second sequential request observing identical state would itself legitimately
# succeed under the product semantics.)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-create-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /ppa/deals/{id}/allocations"
    occ_field: "expected_deal_version"
    description: |
      Proposing a DealAllocation against a Deal whose version has advanced since
      the client last read it is rejected. Aggregated buyer arrangements let many
      allocations coexist on one Deal, so a second proposal is not blocked by any
      state precondition — it is blocked because the proposer's view of
      Deal.unallocated_mw is stale, and accepting it could oversubscribe the
      contracted capacity.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: credit-support-post-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /ppa/credit-support/{id}/post"
    occ_field: "expected_deal_version"
    description: |
      Posting a CreditSupportInstrument against a Deal whose version has advanced
      since the client last read it is rejected. Instruments legitimately stack, so
      a later post is not blocked by any state precondition — it is blocked because
      the poster's view of Deal.posted_credit_support_usd and
      Deal.credit_support_required_usd is stale, and the coverage arithmetic that
      drives the SUPPORT_SHORTFALL to APPROVED cure would be computed against a
      superseded requirement.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: meter-interval-post-stale-period
    parent_entity: SettlementPeriod
    write_endpoint: "POST /ppa/settlement-periods/{id}/intervals"
    occ_field: "expected_settlement_period_version"
    description: |
      Posting a MeterInterval against a SettlementPeriod whose version has advanced
      since the client last read it is rejected. Hourly intervals accumulate by
      design, so a later post is not blocked by any state precondition — it is
      blocked because the poster's view of the period's interval_count and computed
      settlement totals is stale, which is exactly the case where a re-post would
      silently duplicate an hour already loaded by another writer.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# Every constant below is pinned. Every formula states its operation ORDER
# explicitly, because two of these calculations are order-sensitive by design.
# =============================================================================
calculations:
  - name: offtaker_credit_score
    description: |
      Weighted creditworthiness score for an Offtaker, on a 0.00-100.00 scale,
      blending agency rating, balance-sheet leverage and disclosure quality. Two
      variants: a standalone assessment, and a guarantor-supported assessment that
      lifts the weakest components using the parent guarantor's own profile.
    trigger: "POST /ppa/offtakers/{id}/submit-qualification and POST /ppa/offtakers/{id}/rating-change"
    inputs:
      - "Offtaker.credit_rating"
      - "Offtaker.net_debt_to_ebitda"
      - "Offtaker.disclosure_framework"
      - "Offtaker.parent_guarantor_offtaker_id"
      - "the guarantor Offtaker's credit_rating, net_debt_to_ebitda and qualification_status, when a guarantor is linked"
    algorithm: weighted_scoring
    formula: |
      RATING_POINTS lookup on credit_rating -> rating_points
      leverage_points = max(0, min(100, 100 - (LEVERAGE_SLOPE * net_debt_to_ebitda)))
      DISCLOSURE_POINTS lookup on disclosure_framework -> disclosure_points

      VARIANT STANDALONE (no eligible guarantor):
        effective_rating_points  = rating_points
        effective_leverage_points = leverage_points

      VARIANT GUARANTOR_SUPPORTED (eligible guarantor present):
        guarantor_rating_points   = RATING_POINTS[guarantor.credit_rating]
        guarantor_leverage_points = max(0, min(100, 100 - (LEVERAGE_SLOPE * guarantor.net_debt_to_ebitda)))
        effective_rating_points   = max(rating_points,   guarantor_rating_points - GUARANTOR_RATING_NOTCH)
        effective_leverage_points = max(leverage_points, guarantor_leverage_points)
        # disclosure is NEVER inherited from the guarantor - the buyer's own
        # reporting is what substantiates a claim, so disclosure_points is
        # identical in both variants.

      credit_score = round(  W_RATING     * effective_rating_points
                           + W_LEVERAGE   * effective_leverage_points
                           + W_DISCLOSURE * disclosure_points, 2)
      credit_score_variant = "STANDALONE" | "GUARANTOR_SUPPORTED"
    constants:
      RATING_POINTS: { AAA: 100, AA: 92, A: 84, BBB: 72, BB: 55, B: 38, CCC: 20, NR: 10 }
      DISCLOSURE_POINTS: { CDP_AND_TCFD: 100, TCFD_ONLY: 80, CDP_ONLY: 70, NONE: 30 }
      LEVERAGE_SLOPE: 10
      GUARANTOR_RATING_NOTCH: 8
      W_RATING: 0.55
      W_LEVERAGE: 0.30
      W_DISCLOSURE: 0.15
    precision: "2 decimal places, round_half_up; leverage_points and rating_points are exact integers/decimals carried unrounded into the weighted sum"
    variants:
      - name: STANDALONE
        when: "Offtaker.parent_guarantor_offtaker_id is null, OR the linked guarantor's qualification_status != QUALIFIED"
        difference: "Uses only the offtaker's own rating_points and leverage_points."
      - name: GUARANTOR_SUPPORTED
        when: "Offtaker.parent_guarantor_offtaker_id is not null AND the linked guarantor's qualification_status == QUALIFIED"
        difference: |
          Rating component is lifted to max(own, guarantor - 8 notch-points) and the
          leverage component to max(own, guarantor); the disclosure component is
          never lifted. A guarantor that is merely linked but not itself QUALIFIED
          produces the STANDALONE result, so linkage alone is not enough.

  - name: offtaker_credit_tier
    description: "Maps credit_score onto the four-way commercial tier that gates unsecured credit, deal pricing and instrument haircuts."
    trigger: "immediately after offtaker_credit_score, on the same request"
    inputs: ["Offtaker.credit_score"]
    algorithm: threshold
    formula: |
      if credit_score >= TIER_PRIME_MIN    -> "PRIME"
      elif credit_score >= TIER_STANDARD_MIN -> "STANDARD"
      elif credit_score >= TIER_SUBPRIME_MIN -> "SUBPRIME"
      else -> "DECLINED"
      # Comparisons are inclusive at the lower bound: a score of exactly
      # TIER_STANDARD_MIN is STANDARD, and the next representable value below it
      # (a 0.01 step) is SUBPRIME.
    constants:
      TIER_PRIME_MIN: 80.00
      TIER_STANDARD_MIN: 62.00
      TIER_SUBPRIME_MIN: 45.00
    precision: "comparisons performed on the 2-decimal credit_score; no further rounding"

  - name: offtaker_sustainability_score
    description: "Additive 0.00-100.00 score for the strength of the buyer's public decarbonisation commitment; gates qualification and drives the CONDITIONAL outcome."
    trigger: "POST /ppa/offtakers/{id}/submit-qualification and POST /ppa/offtakers/{id}/rating-change"
    inputs:
      - "Offtaker.has_science_based_target"
      - "Offtaker.re100_member"
      - "Offtaker.scope2_target_year"
      - "Offtaker.disclosure_framework"
    algorithm: aggregation
    formula: |
      score = 0
      if has_science_based_target is true         -> score += PTS_SBT
      if re100_member is true                     -> score += PTS_RE100
      if scope2_target_year is not null
         and scope2_target_year <= NEAR_TERM_YEAR -> score += PTS_NEAR_TERM
      if disclosure_framework != "NONE"           -> score += PTS_DISCLOSING
      sustainability_score = round(score, 2)
      # A null scope2_target_year contributes 0 and is NOT an error; a target year
      # of exactly NEAR_TERM_YEAR does contribute.
    constants:
      PTS_SBT: 40
      PTS_RE100: 30
      PTS_NEAR_TERM: 20
      PTS_DISCLOSING: 10
      NEAR_TERM_YEAR: 2030
    precision: "2 decimal places, round_half_up"

  - name: unsecured_credit_limit
    description: "The unsecured exposure the developer will extend to a buyer before collateral is required; the lesser of a hard tier cap and a share of reported EBITDA."
    trigger: "immediately after offtaker_credit_tier, on the same request; re-run on rating-change"
    inputs: ["Offtaker.credit_tier", "Offtaker.reported_ebitda_usd"]
    algorithm: threshold
    formula: |
      tier_cap    = TIER_CAP_USD[credit_tier]
      ebitda_cap  = round(reported_ebitda_usd * TIER_EBITDA_PCT[credit_tier], 2)
      unsecured_credit_limit_usd = min(tier_cap, ebitda_cap)
      # DECLINED yields 0.00 by both limbs.
    constants:
      TIER_CAP_USD: { PRIME: 25000000.00, STANDARD: 10000000.00, SUBPRIME: 2000000.00, DECLINED: 0.00 }
      TIER_EBITDA_PCT: { PRIME: 0.05, STANDARD: 0.02, SUBPRIME: 0.005, DECLINED: 0.0 }
    precision: "2 decimal places, round_half_up"

  - name: deal_contract_price
    description: |
      The all-in fixed contract price. Assembled from four ordered components:
      escalation of the base price to the first delivery year, selection of the
      price tier, the shape premium looked up by shape product AND tier, and the
      basis-risk adder. The ORDER IS LOAD-BEARING: the tier is selected from the
      escalated base price alone.
    trigger: "POST /ppa/deals, and re-run on POST /ppa/deals/{id}/rounds and POST /ppa/rounds/{id}/respond when the round changes price terms"
    inputs:
      - "Deal.base_fixed_price_usd_per_mwh"
      - "Deal.escalation_pct_per_year"
      - "Deal.first_delivery_year"
      - "Deal.shape_product"
      - "Deal.basis_responsibility"
    algorithm: tiered_pricing
    formula: |
      STEP 1 - escalate:
        years = first_delivery_year - ESCALATION_BASE_YEAR
        escalated_base = round(base_fixed_price_usd_per_mwh
                               * (1 + escalation_pct_per_year / 100) ** years, 4)
        # years may be 0 (first delivery in the base year), in which case
        # escalated_base == base_fixed_price_usd_per_mwh to 4 decimals.

      STEP 2 - select the price tier FROM escalated_base ONLY:
        if   escalated_base <  PRICE_TIER_MID_MIN  -> price_tier = "LOW"
        elif escalated_base <  PRICE_TIER_HIGH_MIN -> price_tier = "MID"
        else                                       -> price_tier = "HIGH"
        # WRONG ORDER 1: selecting the tier from base_fixed_price_usd_per_mwh
        #   (pre-escalation) mis-tiers every deal whose escalation carries it
        #   across a tier edge.
        # WRONG ORDER 2: selecting the tier from the final contract price (i.e.
        #   after adding the shape premium) is circular and inflates the tier,
        #   because the premium is itself tier-dependent.

      STEP 3 - look up the adders (both keyed, one of them two-dimensionally):
        shape_premium = SHAPE_PREMIUM_USD_PER_MWH[shape_product][price_tier]
        basis_adder   = BASIS_ADDER_USD_PER_MWH[basis_responsibility]

      STEP 4 - assemble:
        contract_price_usd_per_mwh = round(escalated_base + shape_premium + basis_adder, 2)
    constants:
      ESCALATION_BASE_YEAR: 2026
      PRICE_TIER_MID_MIN: 40.00
      PRICE_TIER_HIGH_MIN: 60.00
      SHAPE_PREMIUM_USD_PER_MWH:
        AS_GENERATED: { LOW: 0.00, MID: 0.00, HIGH: 0.00 }
        SOLAR_SHAPED_16X5: { LOW: 2.00, MID: 3.10, HIGH: 4.00 }
        BASELOAD_FIRM: { LOW: 4.50, MID: 6.25, HIGH: 8.00 }
      BASIS_ADDER_USD_PER_MWH: { SELLER: 1.50, SHARED: 0.75, BUYER: 0.00 }
    precision: "escalated_base to 4 decimal places, round_half_up; contract_price_usd_per_mwh to 2 decimal places, round_half_up"

  - name: deal_expected_volume
    description: "Deterministic annual delivered volume used for exposure sizing; a technology capacity factor applied to the contracted capacity."
    trigger: "POST /ppa/deals, and on any change to Deal.contracted_mw"
    inputs: ["Deal.contracted_mw", "the parent Project.technology"]
    algorithm: projection
    formula: |
      expected_annual_mwh = round(contracted_mw
                                  * CAPACITY_FACTOR[project.technology]
                                  * HOURS_PER_YEAR, 2)
    constants:
      CAPACITY_FACTOR: { SOLAR: 0.28, WIND: 0.42, STORAGE_HYBRID: 0.35 }
      HOURS_PER_YEAR: 8760
    precision: "2 decimal places, round_half_up"

  - name: credit_support_requirement
    description: |
      Sizes the collateral the buyer must post. One year of contract value is the
      mark-to-market exposure; the buyer's unsecured limit is netted off; the
      residual is rounded UP to a whole collateral increment.
    trigger: "POST /ppa/deals, POST /ppa/deals/{id}/submit-credit, the CHANGE_IN_LAW price-adjustment cascade, and every POST /ppa/offtakers/{id}/rating-change on the anchor buyer, whether the tier drops a band or stays inside it"
    inputs:
      - "Deal.expected_annual_mwh"
      - "Deal.contract_price_usd_per_mwh"
      - "the anchor Offtaker.unsecured_credit_limit_usd"
    algorithm: threshold
    formula: |
      exposure_usd = round(expected_annual_mwh * contract_price_usd_per_mwh, 2)
      unsecured_credit_limit_usd = anchor_offtaker.unsecured_credit_limit_usd   # snapshotted onto the Deal
      collateral_threshold_usd   = unsecured_credit_limit_usd

      if exposure_usd <= collateral_threshold_usd:
        credit_support_required_usd = 0.00
      else:
        residual = exposure_usd - collateral_threshold_usd
        increments = ceil(residual / COLLATERAL_INCREMENT_USD)     # ceiling, never round-half-up
        credit_support_required_usd = round(increments * COLLATERAL_INCREMENT_USD, 2)
      # At exposure_usd exactly equal to the threshold the requirement is 0.00;
      # one cent above it the requirement jumps a full increment.
    constants:
      COLLATERAL_INCREMENT_USD: 250000.00
    precision: "2 decimal places, round_half_up for exposure_usd; credit_support_required_usd is an exact multiple of COLLATERAL_INCREMENT_USD"

  - name: eligible_credit_support
    description: |
      Discounts the face amount of a posted credit-support instrument for issuer or
      guarantor quality. Cash is undiscounted; letters of credit are haircut by the
      issuing bank's rating; parent guarantees are haircut by the guarantor's own
      credit tier, so a weak parent contributes little even at a large face amount.
    trigger: "POST /ppa/credit-support/{id}/post"
    inputs:
      - "CreditSupportInstrument.instrument_type"
      - "CreditSupportInstrument.face_amount_usd"
      - "CreditSupportInstrument.issuer_rating"
      - "the guarantor Offtaker.credit_tier, for PARENT_GUARANTEE"
    algorithm: threshold
    formula: |
      if instrument_type == "CASH_COLLATERAL":
        haircut_pct = 0.00
      elif instrument_type == "LETTER_OF_CREDIT":
        haircut_pct = LC_HAIRCUT_PCT[issuer_rating]        # absent key -> ineligible issuer
      elif instrument_type == "PARENT_GUARANTEE":
        haircut_pct = PG_HAIRCUT_PCT[guarantor.credit_tier] # DECLINED -> ineligible guarantor
      eligible_credit_usd = round(face_amount_usd * (1 - haircut_pct / 100), 2)
    constants:
      LC_HAIRCUT_PCT: { AAA: 0.00, AA: 0.00, A: 0.00, BBB: 10.00, BB: 35.00 }
      PG_HAIRCUT_PCT: { PRIME: 0.00, STANDARD: 25.00, SUBPRIME: 60.00 }
      MIN_TENOR_DAYS: 365
    precision: "haircut_pct to 2 decimal places; eligible_credit_usd to 2 decimal places, round_half_up"

  - name: deemed_generation
    description: |
      Fills in the energy a curtailed hour would have produced, but only where an
      accepted curtailment claim has been allocated to the buyer. Force-majeure and
      seller-borne curtailment excuse the seller without creating deemed volume, so
      the input-set filter is what makes this calculation correct.
    trigger: "POST /ppa/settlement-periods/{id}/calculate"
    inputs:
      - "MeterInterval.metered_mwh"
      - "MeterInterval.curtailment_flag"
      - "MeterInterval.hour_start"
      - "Deal.contracted_mw and the parent Project.technology"
      - "the deal's RiskEvent rows with event_type == CURTAILMENT and status == ACCEPTED (allocation_outcome, window_start, window_end)"
    algorithm: projection
    formula: |
      expected_mwh = round(deal.contracted_mw * CAPACITY_FACTOR[project.technology], 4)

      covering_event = the RiskEvent r on this deal with
                            r.status == "ACCEPTED"
                            AND r.event_type == "CURTAILMENT"
                            AND r.window_start <= hour_start <= r.window_end
                       (at most one can exist: §1.4 ERR_RISK_WINDOW_OVERLAP forbids
                        two CLAIMED-or-ACCEPTED CURTAILMENT events of one deal from
                        sharing any instant, so no tie-break is ever needed)

      excused = curtailment_flag != "NONE" AND covering_event exists
      deemed_share = DEEMED_SHARE[covering_event.allocation_outcome] if excused else 0.00

      deemed_mwh    = round(max(0, expected_mwh - metered_mwh) * deemed_share, 4)
      delivered_mwh = round(metered_mwh + deemed_mwh, 4)
      # curtailment_flag values ECONOMIC, GRID_EMERGENCY and BUYER_REQUESTED all
      # mark the hour as curtailed; NONE does not.
      # A curtailed hour whose metered output already exceeds expected_mwh yields
      # deemed_mwh 0.0000, never a negative.
      # A SELLER_BEARS outcome excuses the seller without creating any deemed
      # volume, so the accepted claim is visible in the RiskEvent but invisible in
      # the money; SHARED splits the shortfall down the middle.
    constants:
      CAPACITY_FACTOR: { SOLAR: 0.28, WIND: 0.42, STORAGE_HYBRID: 0.35 }
      DEEMED_SHARE: { SELLER_BEARS: 0.00, SHARED: 0.50, BUYER_BEARS: 1.00 }
    precision: "4 decimal places, round_half_up"

  - name: settlement_netting
    description: |
      Nets the contract price against the index for one settlement period. Two
      variants selected by the period's netting_method: hourly netting settles each
      hour independently and applies the negative-price-hour floor, while monthly
      netting settles the period against a single volume-weighted average index and
      therefore lets negative hours pull the average down. The same intervals
      produce materially different money under the two variants.
    trigger: "POST /ppa/settlement-periods/{id}/calculate"
    inputs:
      - "the period's MeterInterval rows (delivered_mwh, node_price_usd_per_mwh, hub_price_usd_per_mwh)"
      - "Deal.contract_price_usd_per_mwh"
      - "Deal.basis_responsibility"
      - "the settlement point PricingNode.settlement_point_type"
      - "SettlementPeriod.netting_method"
    algorithm: aggregation
    formula: |
      index_h = hub_price_usd_per_mwh  if settlement_point.settlement_point_type == "HUB"
                node_price_usd_per_mwh if settlement_point.settlement_point_type == "NODE"

      total_metered_mwh   = round(sum(metered_mwh),   4)
      total_deemed_mwh    = round(sum(deemed_mwh),    4)
      total_delivered_mwh = round(sum(delivered_mwh), 4)

      VARIANT HOURLY:
        # each hour settles on its own, and a negative index hour is floored to
        # zero because the buyer never pays a negative index under the CfD
        effective_index_h  = max(index_h, 0.00)
        hour_amount_h      = round(delivered_mwh_h * (effective_index_h - contract_price_usd_per_mwh), 2)
        energy_settlement_usd = round(sum(hour_amount_h), 2)
        weighted_avg_index_usd_per_mwh = round(sum(delivered_mwh_h * index_h) / total_delivered_mwh, 4)  # reported only

      VARIANT MONTHLY:
        # one netting against a single volume-weighted index; negative hours are
        # NOT floored, so they drag the average down
        weighted_avg_index_usd_per_mwh = round(sum(delivered_mwh_h * index_h) / total_delivered_mwh, 4)
        energy_settlement_usd = round(total_delivered_mwh
                                      * (weighted_avg_index_usd_per_mwh - contract_price_usd_per_mwh), 2)

      BASIS ADJUSTMENT (both variants, identical):
        if settlement_point.settlement_point_type == "NODE":
          basis_adjustment_usd = 0.00     # the deal already settles at the node
        else:
          differential_usd = sum(delivered_mwh_h * (node_price_usd_per_mwh_h - hub_price_usd_per_mwh_h))
          basis_adjustment_usd = round(differential_usd * BASIS_SHARE_TO_BUYER[basis_responsibility], 2)

      net_settlement_usd = round(energy_settlement_usd + basis_adjustment_usd, 2)
      if net_settlement_usd >= 0:
        seller_pays_usd = net_settlement_usd ; buyer_pays_usd = 0.00
      else:
        seller_pays_usd = 0.00 ; buyer_pays_usd = round(-net_settlement_usd, 2)
      # Sign convention: a positive net means the index exceeded the strike and the
      # seller pays the buyer the difference. Exactly 0.00 pays nobody.
      # If total_delivered_mwh == 0 then weighted_avg_index_usd_per_mwh is 0.0000
      # and every money field is 0.00 (no division by zero).
    constants:
      BASIS_SHARE_TO_BUYER: { SELLER: 0.00, SHARED: 0.50, BUYER: 1.00 }
      NEGATIVE_PRICE_FLOOR: 0.00
    precision: "MWh totals to 4 decimal places; weighted_avg_index_usd_per_mwh to 4 decimal places; all USD fields to 2 decimal places, round_half_up"
    variants:
      - name: HOURLY
        when: "SettlementPeriod.netting_method == HOURLY"
        difference: "Rounds and settles per hour, and floors each hour's index at 0.00 so negative-price hours cannot credit the buyer."
      - name: MONTHLY
        when: "SettlementPeriod.netting_method == MONTHLY"
        difference: "Settles once against the volume-weighted average of the unfloored index, so negative-price hours reduce the average and shift money to the seller's side."

  - name: mintable_attributes
    description: |
      Whole-MWh count of renewable energy certificates the period can mint. Only
      physically metered energy earns an attribute - deemed generation is a
      financial make-whole and must never be minted, or the buyer's claim would be
      unsubstantiated.
    trigger: "POST /ppa/settlement-periods/{id}/calculate"
    inputs: ["SettlementPeriod.total_metered_mwh"]
    algorithm: aggregation
    formula: |
      mintable_attributes_mwh = floor(total_metered_mwh)   # truncation, never round-half-up
      # total_deemed_mwh is deliberately excluded from the input set.
    constants: {}
    precision: "integer MWh, floor"

  - name: attribute_allocation
    description: |
      Splits a whole-MWh attribute batch across the confirmed buyers of an
      aggregated deal in proportion to their allocated capacity, using the
      largest-remainder method so that the parts sum exactly to the batch quantity.
      The ORDER in which the leftover units are handed out is load-bearing.
    trigger: "POST /ppa/attribute-batches/{id}/transfer"
    inputs:
      - "EnvironmentalAttributeBatch.quantity_mwh"
      - "the deal's DealAllocation rows with status == CONFIRMED (allocated_mw, offtaker_id, created_at)"
    algorithm: waterfall_allocation
    formula: |
      STEP 1: basis = sum(allocated_mw) over CONFIRMED allocations only
              (PROPOSED, REJECTED and WITHDRAWN allocations are excluded).
      STEP 2: for each allocation, exact_i = quantity_mwh * allocated_mw_i / basis
              floor_i = floor(exact_i) ; remainder_i = exact_i - floor_i
      STEP 3: leftover = quantity_mwh - sum(floor_i)
      STEP 4: sort the allocations by remainder_i DESC,
                                 then allocated_mw_i DESC,
                                 then created_at ASC
              and give +1 MWh to each of the first `leftover` allocations.
      STEP 5: allocation_breakdown = [{offtaker_id, mwh}] emitted in the STEP 4
              sort order, and sum(mwh) == quantity_mwh exactly.
      # WRONG ORDER: rounding each exact_i independently (round_half_up) does not
      # conserve the batch - it can hand out more or fewer MWh than were minted.
      # The tie-break chain never falls through to `id`; created_at ASC is the
      # final arbiter.
    constants: {}
    precision: "integer MWh per buyer; the parts must sum exactly to quantity_mwh"

  - name: cp_completion_pct
    description: "Share of a deal's conditions precedent that are cleared; reaching exactly 100.00 is what makes the contract EFFECTIVE."
    trigger: "POST /ppa/deals/{id}/execute and every POST /ppa/conditions-precedent/{id}/resolution"
    inputs: ["the deal's ConditionPrecedent rows (status)"]
    algorithm: aggregation
    formula: |
      cp_total_count = count(all ConditionPrecedent rows of the deal)
      cleared        = count(rows with status IN {"SATISFIED", "WAIVED"})
      if cp_total_count == 0:
        cp_completion_pct = 100.00      # vacuous truth: nothing outstanding
      else:
        cp_completion_pct = round(100 * cleared / cp_total_count, 2)
      # FAILED and PENDING both count as not cleared. With 3 conditions and 2
      # cleared the value is 66.67 (round_half_up on 66.666...), which is NOT
      # 100.00, so no EFFECTIVE transition fires.
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: cp_template_selection
    description: |
      Decides which conditions precedent a deal gets at execution, and each one's
      deadline and waivability. The template is CONDITIONAL on the state of two
      other entities, so two deals with identical terms can execute with different
      CP sets - and a deal whose project is already OPERATIONAL and whose buyer
      already holds a registry account gets NO conditions at all.
    trigger: "POST /ppa/deals/{id}/execute"
    inputs:
      - "the parent Project.status"
      - "the anchor Offtaker.registry_account_id"
      - "Deal.commercial_operation_deadline"
      - "the logical clock"
    algorithm: constraint_propagation
    formula: |
      CP_TEMPLATE, evaluated in this fixed order:
        1. PERMITTING        included when project.status == "PRE_DEVELOPMENT"
                             is_waivable = false
                             deadline_date = min(commercial_operation_deadline,
                                                 clock + CP_PERMITTING_DAYS days)
        2. INTERCONNECTION   included when project.status IN {"PRE_DEVELOPMENT",
                                                             "PERMITTED"}
                             is_waivable = false
                             deadline_date = min(commercial_operation_deadline,
                                                 clock + CP_INTERCONNECTION_DAYS days)
        3. NOTICE_TO_PROCEED included when project.status != "OPERATIONAL"
                             is_waivable = true
                             deadline_date = min(commercial_operation_deadline,
                                                 clock + CP_NTP_DAYS days)
        4. REGISTRY_ACCOUNT  included when anchor_offtaker.registry_account_id is null
                             is_waivable = true
                             deadline_date = clock + CP_REGISTRY_DAYS days

      cp_total_count = number of rows included
      # An OPERATIONAL project plus a buyer holding a registry account produces the
      # EMPTY template: cp_total_count 0, cp_completion_pct 100.00, and the deal
      # goes EXECUTED -> EFFECTIVE inside the same execute request.
    constants:
      CP_PERMITTING_DAYS: 270
      CP_INTERCONNECTION_DAYS: 540
      CP_NTP_DAYS: 720
      CP_REGISTRY_DAYS: 60
    precision: "deadline_date is a whole-second UTC datetime; day arithmetic is exact 86400-second addition"

  - name: lifecycle_deadlines
    description: "Pins every day-count constant the lifecycle depends on and the derived deadline field each one produces."
    trigger: "the transition that sets each deadline, as declared in §1.2"
    inputs: ["the logical clock at the moment of the triggering transition"]
    algorithm: chronological
    formula: |
      TermSheetRound.response_deadline (successor rounds created by a COUNTER)
        = clock + ROUND_RESPONSE_DAYS days
      Deal.support_cure_deadline (APPROVED -> SUPPORT_SHORTFALL)
        = clock + SUPPORT_CURE_DAYS days
      ConditionPrecedent.cure_deadline (PENDING -> FAILED)
        = clock + CP_CURE_DAYS days
      ConditionPrecedent.deadline_date (FAILED -> PENDING re-cure)
        = clock + CP_CURE_DAYS days
      Deal.commercial_operation_deadline (on a CP waiver)
        = prior commercial_operation_deadline + CP_WAIVER_EXTENSION_DAYS days
      Force-majeure termination right vests when an ACCEPTED FORCE_MAJEURE
      RiskEvent has duration_days >= FM_TERMINATION_DAYS
      A retirement claim_year must satisfy
        vintage_year <= claim_year <= vintage_year + REC_CLAIM_WINDOW_YEARS
      A posted LETTER_OF_CREDIT or PARENT_GUARANTEE must satisfy
        floor((expiry_date - clock) / 86400) >= MIN_TENOR_DAYS
    constants:
      ROUND_RESPONSE_DAYS: 14
      SUPPORT_CURE_DAYS: 10
      CP_CURE_DAYS: 15
      CP_WAIVER_EXTENSION_DAYS: 30
      FM_TERMINATION_DAYS: 180
      REC_CLAIM_WINDOW_YEARS: 1
      MIN_TENOR_DAYS: 365
    precision: "exact 86400-second day arithmetic on whole-second UTC datetimes; comparisons are inclusive at the boundary"

  - name: risk_event_impact
    description: "Sizes an accepted risk claim: the whole days it spans and the metered hours it excuses."
    trigger: "POST /ppa/risk-events/{id}/review with decision ACCEPT"
    inputs:
      - "RiskEvent.window_start"
      - "RiskEvent.window_end"
      - "the deal's MeterInterval rows (hour_start)"
    algorithm: chronological
    formula: |
      duration_days = floor((window_end - window_start) / 86400) + 1     # inclusive whole days
      excused_hours = count(MeterInterval rows belonging to any SettlementPeriod of
                            this deal whose hour_start satisfies
                            window_start <= hour_start <= window_end)
      # The window is CLOSED on both ends, so an interval starting exactly at
      # window_end is excused.
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer days and integer hours"

# =============================================================================
# §1.4 Validation Rules (evaluated STRICTLY in ascending priority order; the
# first violated rule determines the response and no later rule is evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Evaluated before anything else, including path existence — a missing header on a request for a non-existent id returns 401, never 404."

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared for this endpoint in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
    description: "Role gating precedes request-shape parsing, so a wrong-role request with a malformed body returns 403, not 400."

  - priority: 3
    category: request_shape
    check: |
      Every required input field for the endpoint is present; every enum value is
      a declared member; every numeric respects its declared range
      (capacity_mw > 0, contracted_mw > 0, term_years between 1 and 25,
      escalation_pct_per_year between 0 and 10, base_fixed_price_usd_per_mwh > 0,
      face_amount_usd > 0, quantity_mwh > 0, metered_mwh >= 0,
      net_debt_to_ebitda >= 0, reported_ebitda_usd > 0); every datetime parses as
      ISO-8601 UTC; pagination limit is between 1 and 100 and offset >= 0.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Fields whose §1.1 source is computed or system are silently ignored when supplied, never rejected."

  - priority: 4
    category: existence
    check: "every id in the request path resolves to a live row, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path existence precedes body-FK existence, so a bad path id plus a bad body FK returns the path entity's 404."

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves to a live row (project_id, anchor_offtaker_id, settlement_point_id, offtaker_id, guarantor_offtaker_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /ppa/deals, POST /ppa/projects, POST /ppa/deals/{id}/allocations, POST /ppa/deals/{id}/credit-support, POST /ppa/attribute-batches/{id}/transfer, POST /ppa/offtakers"
    description: "Body FKs are validated in the field order declared in §1.5 input."

  - priority: 6
    category: business_referential
    check: "parent_guarantor_offtaker_id neither equals the offtaker's own id nor closes a cycle when the existing guarantor chain is walked upward"
    error_id: ERR_GUARANTOR_CYCLE
    http_status: 422
    applies_to: "POST /ppa/offtakers, POST /ppa/offtakers/{id}/rating-change"
    description: "Self-referential guarantor edges must form a forest; the walk terminates at a null guarantor and must never revisit a node. A create can only ever add a leaf, so the cycle case is reachable only by re-parenting an existing node through rating-change."

  - priority: 7
    category: auth
    check: "when X-User-Role is OfftakerRep, X-User-ID equals the target Deal's anchor_offtaker_id, or the offtaker_id of one of that deal's CONFIRMED DealAllocations"
    error_id: ERR_NOT_DEAL_COUNTERPARTY
    http_status: 403
    applies_to: "POST /ppa/rounds/{id}/respond, POST /ppa/allocations/{id}/decision, POST /ppa/settlement-periods/{id}/advance, POST /ppa/deals/{id}/risk-events, GET /ppa/deals/{id}"
    description: "Ownership is checked after existence (so an unknown deal is 404) but before any state precondition (so a non-counterparty acting on a wrong-state deal gets 403)."

  - priority: 8
    category: state
    check: |
      The requested transition is declared in §1.2 for the SUBJECT entity's own
      current state on the dimension being moved. This rule owns the subject's own
      `from:` state and nothing else: every §1.2 precondition that is about another
      entity's state, a money comparison, a deadline or a collision is enforced by
      its own dedicated row further down this table and returns that row's error_id.
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
    description: "State precedes every business rule. Executing a DRAFT deal whose anchor offtaker is also still UNDER_REVIEW returns ERR_INVALID_STATE_TRANSITION (409), not ERR_OFFTAKER_NOT_QUALIFIED (422)."

  - priority: 9
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ppa/deals/{id}/allocations, POST /ppa/credit-support/{id}/post, POST /ppa/settlement-periods/{id}/intervals"
    description: "OCC runs after the state gate, so a stale version against an already-TERMINATED deal yields 409 rather than 412."

  - priority: 10
    category: auth
    check: |
      Segregation of duties on X-User-ID:
        - the user recorded as Offtaker.created_by_user_id may not call
          qualification-decision for that same Offtaker
        - the user recorded as Deal.created_by_user_id may not call credit-decision
          for that Deal
        - the user who called a ConditionPrecedent resolution with FAIL may not be
          the user who calls terminate citing CP_FAILURE
        - the user recorded as Deal.credit_approved_by_user_id may not call execute
          for that Deal (the same natural person may hold both the CreditOfficer and
          the DealCommittee role, and the header pair makes that visible)
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ppa/offtakers/{id}/qualification-decision, POST /ppa/deals/{id}/credit-decision, POST /ppa/deals/{id}/terminate, POST /ppa/deals/{id}/execute"
    description: "Holding the right role is necessary but not sufficient; the acting user must be a different person from the preparer."

  - priority: 11
    category: business_referential
    check: "the anchor Offtaker's qualification_status is QUALIFIED or CONDITIONAL when a Deal is created, and QUALIFIED when it is executed"
    error_id: ERR_OFFTAKER_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /ppa/deals, POST /ppa/deals/{id}/execute"
    description: "A CONDITIONAL buyer can be structured and negotiated but cannot sign."

  - priority: 12
    category: business_referential
    check: "the anchor Offtaker's credit_tier is not DECLINED"
    error_id: ERR_CREDIT_TIER_DECLINED
    http_status: 422
    applies_to: "POST /ppa/deals/{id}/submit-credit, POST /ppa/deals/{id}/execute"
    description: "A DECLINED tier has a 0.00 unsecured limit and no eligible support path, so credit review is refused outright."

  - priority: 13
    category: business_referential
    check: "the offtaker named in an attribute transfer holds a CONFIRMED DealAllocation on the batch's deal"
    error_id: ERR_NO_CONFIRMED_ALLOCATION
    http_status: 422
    applies_to: "POST /ppa/attribute-batches/{id}/transfer"
    description: "Aggregated deals convey attributes only to buyers whose allocation was confirmed."

  - priority: 14
    category: business_referential
    check: "no RiskEvent of the deal whose status == CLAIMED has a window that intersects the settlement period's half-open window [period_start, period_end)"
    error_id: ERR_OPEN_RISK_CLAIM
    http_status: 409
    applies_to: "POST /ppa/settlement-periods/{id}/advance with action INVOICE"
    description: "An unreviewed curtailment, change-in-law or force-majeure claim over the period must be decided before the period can be invoiced; a REJECTED or ACCEPTED claim does not block it."

  - priority: 15
    category: business_safety
    check: "the recipient Offtaker has a non-null registry_account_id"
    error_id: ERR_REGISTRY_ACCOUNT_MISSING
    http_status: 422
    applies_to: "POST /ppa/attribute-batches/{id}/transfer"
    description: "Registry transfer cannot be substantiated without a receiving account; a claim without a registry serial is greenwashing."

  - priority: 16
    category: business_safety
    check: "the claim_year on retirement is not earlier than the batch's vintage year and not later than the vintage year plus REC_CLAIM_WINDOW_YEARS"
    error_id: ERR_CLAIM_YEAR_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /ppa/attribute-batches/{id}/retire"
    description: "Claim substantiation requires vintage-to-claim-year alignment; REC_CLAIM_WINDOW_YEARS is 1."

  - priority: 17
    category: business_temporal
    check: |
      Declared interval and date orderings hold:
        - RiskEvent.window_end >= window_start
        - SettlementPeriod.period_end > period_start
        - CreditSupportInstrument.expiry_date > effective_date
        - Deal.commercial_operation_deadline > the logical clock at creation
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /ppa/deals/{id}/risk-events, POST /ppa/deals/{id}/settlement-periods, POST /ppa/deals/{id}/credit-support, POST /ppa/deals"
    description: "Well-formedness of a window is checked BEFORE any collision check, so a backwards window that also overlaps an existing claim returns ERR_INVALID_WINDOW."

  - priority: 18
    category: business_temporal
    check: "the logical clock is at or before ConditionPrecedent.deadline_date when satisfying, and at or before cure_deadline when re-curing"
    error_id: ERR_CP_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /ppa/conditions-precedent/{id}/resolution"
    description: "An expired condition can only be failed or waived, never satisfied."

  - priority: 19
    category: business_temporal
    check: "the logical clock is at or before TermSheetRound.response_deadline"
    error_id: ERR_ROUND_EXPIRED
    http_status: 409
    applies_to: "POST /ppa/rounds/{id}/respond"
    description: "A lapsed round must be expired and re-issued rather than answered late."

  - priority: 20
    category: business_referential
    check: |
      The instrument being posted is eligible:
        - LETTER_OF_CREDIT: issuer_name is present and issuer_rating is one of
          AAA, AA, A, BBB, BB (an unrated or CCC/B/NR issuer has no haircut row)
        - PARENT_GUARANTEE: guarantor_offtaker_id is present, equals the anchor
          Offtaker's parent_guarantor_offtaker_id, and that guarantor's credit_tier
          is not DECLINED
        - CASH_COLLATERAL: neither issuer nor guarantor fields are consulted
    error_id: ERR_INELIGIBLE_ISSUER
    http_status: 422
    applies_to: "POST /ppa/credit-support/{id}/post"
    description: "Eligibility is decided before tenor, so a BB-rated letter of credit with a 30-day tenor returns ERR_INELIGIBLE_ISSUER only when the rating is the failing limb; a AAA letter with a 30-day tenor returns ERR_INSTRUMENT_TENOR_TOO_SHORT."

  - priority: 21
    category: business_temporal
    check: "for LETTER_OF_CREDIT and PARENT_GUARANTEE, whole days from the logical clock to expiry_date are at least MIN_TENOR_DAYS (365)"
    error_id: ERR_INSTRUMENT_TENOR_TOO_SHORT
    http_status: 422
    applies_to: "POST /ppa/credit-support/{id}/post"
    description: "Exactly 365 days passes; 364 fails. CASH_COLLATERAL is exempt."

  - priority: 22
    category: business_constraint
    check: "the new RiskEvent's CLOSED window [window_start, window_end] does not intersect the window of any existing RiskEvent of the same deal with the same event_type whose status is CLAIMED or ACCEPTED"
    error_id: ERR_RISK_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ppa/deals/{id}/risk-events"
    description: "Closed-interval semantics: touching endpoints DO collide, so a claim starting exactly when another ends is rejected. REJECTED claims free their window."

  - priority: 23
    category: business_constraint
    check: "the new SettlementPeriod's HALF-OPEN window [period_start, period_end) does not intersect any existing SettlementPeriod of the same deal"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ppa/deals/{id}/settlement-periods"
    description: "Half-open semantics: a period beginning exactly when the previous one ends is ACCEPTED. Deliberately the opposite convention from ERR_RISK_WINDOW_OVERLAP."

  - priority: 24
    category: business_constraint
    check: "MeterInterval.hour_start lies within the parent period's half-open window [period_start, period_end) and is exactly on the hour"
    error_id: ERR_HOUR_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /ppa/settlement-periods/{id}/intervals"
    description: "An hour_start equal to period_end is outside the period."

  - priority: 25
    category: business_constraint
    check: "no MeterInterval with the same hour_start already exists in the parent period"
    error_id: ERR_DUPLICATE_METER_HOUR
    http_status: 409
    applies_to: "POST /ppa/settlement-periods/{id}/intervals"
    description: "Checked after the in-window check, so a duplicate out-of-range hour returns ERR_HOUR_OUTSIDE_PERIOD."

  - priority: 26
    category: business_constraint
    check: "the offtaker does not already hold a DealAllocation on this deal whose status is PROPOSED or CONFIRMED"
    error_id: ERR_DUPLICATE_ALLOCATION
    http_status: 409
    applies_to: "POST /ppa/deals/{id}/allocations"
    description: "REJECTED and WITHDRAWN allocations do not block a fresh proposal."

  - priority: 27
    category: business_constraint
    check: "PricingNode.name is unique across all pricing nodes"
    error_id: ERR_DUPLICATE_PRICING_NODE
    http_status: 409
    applies_to: "POST /ppa/pricing-nodes"
    description: "Settlement point names are ISO-published identifiers and must not be re-used."

  - priority: 28
    category: business_constraint
    check: "an accepted CHANGE_IN_LAW review supplies price_adjustment_usd_per_mwh, and the resulting Deal.contract_price_usd_per_mwh stays strictly positive"
    error_id: ERR_PRICE_ADJUSTMENT_INVALID
    http_status: 422
    applies_to: "POST /ppa/risk-events/{id}/review"
    description: "A change-in-law adjustment may be negative but may not drive the contract price to zero or below."

  - priority: 29
    category: business_fiscal
    check: "Deal.contracted_mw does not exceed the parent Project's available_mw at creation time"
    error_id: ERR_PROJECT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ppa/deals"
    description: "available_mw is capacity_mw minus contracted_mw over the project's non-TERMINATED deals; equality is allowed."

  - priority: 30
    category: business_fiscal
    check: "confirming a DealAllocation does not push the sum of CONFIRMED allocated_mw above Deal.contracted_mw"
    error_id: ERR_ALLOCATION_EXCEEDS_CONTRACTED_MW
    http_status: 422
    applies_to: "POST /ppa/allocations/{id}/decision"
    description: "Individually valid allocations can be collectively invalid; equality with contracted_mw is allowed and drives unallocated_mw to 0.000."

  - priority: 31
    category: business_fiscal
    check: "Deal.confirmed_allocated_mw equals Deal.contracted_mw"
    error_id: ERR_ALLOCATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /ppa/deals/{id}/execute"
    description: "An aggregated deal cannot be signed while any contracted megawatt is unallocated; a single-buyer deal satisfies this with one confirmed allocation equal to contracted_mw."

  - priority: 32
    category: business_fiscal
    check: "Deal.posted_credit_support_usd is at least Deal.credit_support_required_usd"
    error_id: ERR_CREDIT_SUPPORT_SHORTFALL
    http_status: 422
    applies_to: "POST /ppa/deals/{id}/execute"
    description: "Equality passes. A required amount of 0.00 passes with nothing posted. The shortfall is reachable only because a same-band rating change re-sizes the requirement without re-opening credit_status: a tier drop across a band would set SUPPORT_SHORTFALL and be caught earlier by the priority-8 state gate instead."

  - priority: 33
    category: business_fiscal
    check: "releasing an instrument does not drop Deal.posted_credit_support_usd below Deal.credit_support_required_usd while Deal.credit_status is APPROVED"
    error_id: ERR_RELEASE_BREACHES_COVERAGE
    http_status: 422
    applies_to: "POST /ppa/credit-support/{id}/release"
    description: "The conservation invariant is enforced on the compensating action, not only on the forward one."

  - priority: 34
    category: business_fiscal
    check: "the requested attribute quantity_mwh does not exceed SettlementPeriod.mintable_attributes_mwh minus what has already been minted from that period"
    error_id: ERR_ATTRIBUTE_QUANTITY_EXCEEDS_MINTABLE
    http_status: 422
    applies_to: "POST /ppa/settlement-periods/{id}/mint-attributes"
    description: "Deemed generation is excluded from mintable volume, so a period whose delivered volume was largely deemed mints far fewer attributes than its settlement dollars suggest."

  - priority: 35
    category: business_referential
    check: |
      The termination right cited by the request is vested at the logical clock:
        - CP_FAILURE: some ConditionPrecedent of the deal has status FAILED and
          either its cure_deadline is null or cure_deadline < the logical clock
        - BUYER_DEFAULT: Deal.credit_status == SUPPORT_SHORTFALL and
          Deal.support_cure_deadline < the logical clock
        - SELLER_DEFAULT: the logical clock > Deal.commercial_operation_deadline
          and the parent Project.status != OPERATIONAL
        - COD_DEADLINE_MISSED: the logical clock >
          Deal.commercial_operation_deadline and Deal.status != EFFECTIVE
        - EXTENDED_FORCE_MAJEURE: some RiskEvent of the deal has status ACCEPTED,
          event_type FORCE_MAJEURE and duration_days >= FM_TERMINATION_DAYS (180)
      Every one of the five reasons is conditional; there is no unconditional
      termination right, so a terminate call that cites a reason whose predicate is
      false is always refused.
    error_id: ERR_TERMINATION_RIGHT_NOT_VESTED
    http_status: 422
    applies_to: "POST /ppa/deals/{id}/terminate"
    description: "Ranked last because the state gate (priority 8) and the segregation-of-duties gate (priority 10) must both win over it; no fiscal rule applies to terminate, so its numeric position is behaviourally equivalent to sitting in the referential block."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock to an arbitrary UTC instant. The server's startup default logical clock is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and MUST NOT fall back to real wall-clock time. Every deadline, expiry, window and tenor rule in this scaffold is evaluated against the logical clock only."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst, RegistryAgent, OfftakerRep]
    code: 200
    input: ["current_utc"]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; the clock affects every subsequent deadline evaluation"]

  - method: POST
    path: "/ppa/pricing-nodes"
    description: "Register an ISO settlement point (a hub or a nodal injection point)."
    roles: [Originator, SettlementAnalyst]
    code: 201
    input: ["name", "iso", "settlement_point_type"]
    output: PricingNode
    side_effects: ["PricingNode is immutable once created: common_fields is false, so it carries no version and has no update endpoint"]

  - method: GET
    path: "/ppa/pricing-nodes"
    description: "List settlement points."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst, RegistryAgent, OfftakerRep]
    code: 200
    input: ["iso?", "settlement_point_type?", "limit?", "offset?"]
    output: "PricingNode[]"
    side_effects: []

  - method: GET
    path: "/ppa/pricing-nodes/{id}"
    description: "Fetch one settlement point."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst, RegistryAgent, OfftakerRep]
    code: 200
    input: []
    output: PricingNode
    side_effects: []

  - method: POST
    path: "/ppa/offtakers"
    description: "Create a corporate buyer record in DRAFT qualification_status. No score is computed yet."
    roles: [Originator]
    code: 201
    input: ["legal_name", "credit_rating", "rating_agency", "reported_ebitda_usd", "net_debt_to_ebitda", "disclosure_framework", "has_science_based_target?", "re100_member?", "scope2_target_year?", "registry_account_id?", "parent_guarantor_offtaker_id?"]
    output: Offtaker
    side_effects:
      - "qualification_status defaults to DRAFT; credit_score, credit_score_variant, credit_tier, sustainability_score and unsecured_credit_limit_usd are all null until submit-qualification"
      - "created_by_user_id is stamped from X-User-ID and drives the segregation-of-duties gate on qualification-decision"
      - "conditions defaults to the empty array and claimed_attributes_mwh to 0"

  - method: GET
    path: "/ppa/offtakers"
    description: "List buyers. Filtering by parent_guarantor_offtaker_id is the reverse-reachability channel for the self-referential guarantor FK."
    roles: [Originator, CreditOfficer, DealCommittee, RegistryAgent]
    code: 200
    input: ["qualification_status?", "credit_tier?", "parent_guarantor_offtaker_id?", "limit?", "offset?"]
    output: "Offtaker[]"
    side_effects: []

  - method: GET
    path: "/ppa/offtakers/{id}"
    description: "Fetch one buyer with all computed credit and sustainability fields."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst, RegistryAgent, OfftakerRep]
    code: 200
    input: []
    output: Offtaker
    side_effects: []

  - method: POST
    path: "/ppa/offtakers/{id}/submit-qualification"
    description: "Submit a buyer for credit and sustainability review. Runs the whole scoring chain and moves DRAFT or CONDITIONAL to UNDER_REVIEW."
    roles: [Originator]
    code: 200
    input: []
    output: Offtaker
    side_effects:
      - "runs calculations.offtaker_credit_score, selecting the STANDALONE or GUARANTOR_SUPPORTED variant from the guarantor link and the guarantor's own qualification_status"
      - "runs calculations.offtaker_credit_tier, calculations.offtaker_sustainability_score and calculations.unsecured_credit_limit"
      - "on the CONDITIONAL to UNDER_REVIEW path, clears conditions to the empty array first"
      - "increments Offtaker.version by 1"

  - method: POST
    path: "/ppa/offtakers/{id}/qualification-decision"
    description: "Credit officer decision on a buyer under review. QUALIFY, CONDITIONAL or REJECT."
    roles: [CreditOfficer]
    code: 200
    input: ["decision", "conditions?"]
    output: Offtaker
    side_effects:
      - "sets decision_by_user_id from X-User-ID; rejected when X-User-ID equals Offtaker.created_by_user_id"
      - "QUALIFY requires credit_tier IN {PRIME, STANDARD} and sustainability_score >= 70.00 and clears conditions"
      - "CONDITIONAL requires credit_tier != DECLINED, sustainability_score >= 40.00 and a non-empty conditions array, which is stored verbatim"
      - "REJECT sets credit_status to DECLINED on every DRAFT, TERM_SHEET_ISSUED or UNDER_NEGOTIATION deal anchored by this buyer"
      - "increments Offtaker.version by 1"

  - method: POST
    path: "/ppa/offtakers/{id}/rating-change"
    description: "Record a rating or balance-sheet change on a QUALIFIED or WATCHLIST buyer and re-run the full scoring chain, firing the four-hop downgrade cascade when the tier drops."
    roles: [CreditOfficer]
    code: 200
    input: ["credit_rating", "rating_agency?", "net_debt_to_ebitda?", "reported_ebitda_usd?", "disclosure_framework?", "parent_guarantor_offtaker_id?"]
    output: Offtaker
    side_effects:
      - "requires qualification_status IN {QUALIFIED, WATCHLIST}"
      - "a supplied parent_guarantor_offtaker_id re-parents the guarantor edge before scoring, and must exist and neither equal this offtaker's own id nor close a cycle in the upward guarantor chain (§1.4 ERR_GUARANTOR_CYCLE); omitting the field leaves the existing edge untouched"
      - "recomputes credit_score, credit_score_variant, credit_tier, sustainability_score and unsecured_credit_limit_usd"
      - "when the recomputed tier stays inside the same band the qualification_status is unchanged, but every non-TERMINATED deal anchored by this buyer still re-snapshots unsecured_credit_limit_usd and collateral_threshold_usd and re-runs calculations.credit_support_requirement; credit_status is deliberately NOT re-opened on this path, so a deal can sit at APPROVED with a freshly enlarged requirement and is caught at signing by §1.4 ERR_CREDIT_SUPPORT_SHORTFALL"
      - "when the tier drops to SUBPRIME or DECLINED from QUALIFIED: WATCHLIST plus the four-hop cascade over deals, cure deadlines and guarantor-supported children"
      - "when the tier recovers to PRIME or STANDARD from WATCHLIST: back to QUALIFIED, clearing watchlist_since and curing SUPPORT_SHORTFALL deals that are now covered"
      - "when the tier is DECLINED while already on WATCHLIST: REJECTED"
      - "increments Offtaker.version by 1, plus the version of every deal and guarantor-supported child the cascade touches"

  - method: GET
    path: "/ppa/offtakers/{id}/allocations"
    description: "Reverse-reachability for DealAllocation.offtaker_id: every aggregated-buyer share this buyer holds, across all deals."
    roles: [Originator, CreditOfficer, DealCommittee, OfftakerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DealAllocation[]"
    side_effects: []

  - method: GET
    path: "/ppa/offtakers/{id}/attribute-batches"
    description: "Reverse-reachability for EnvironmentalAttributeBatch.transferred_to_offtaker_id: every batch conveyed into this buyer's registry account."
    roles: [RegistryAgent, Originator, OfftakerRep]
    code: 200
    input: ["status?", "claim_year?", "limit?", "offset?"]
    output: "EnvironmentalAttributeBatch[]"
    side_effects: []

  - method: GET
    path: "/ppa/offtakers/{id}/issued-guarantees"
    description: "Reverse-reachability for CreditSupportInstrument.guarantor_offtaker_id: every parent guarantee this entity has issued for a subsidiary's PPA."
    roles: [CreditOfficer, Originator, DealCommittee]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CreditSupportInstrument[]"
    side_effects: []

  - method: POST
    path: "/ppa/projects"
    description: "Create a generation project in PRE_DEVELOPMENT."
    roles: [Originator]
    code: 201
    input: ["name", "technology", "capacity_mw", "node_id", "cod_target_date", "p50_annual_mwh", "interconnection_queue_position?"]
    output: Project
    side_effects:
      - "status defaults to PRE_DEVELOPMENT, contracted_mw to 0 and available_mw to capacity_mw"
      - "created_by_user_id stamped from X-User-ID"

  - method: GET
    path: "/ppa/projects"
    description: "List projects. Filtering by node_id is the reverse-reachability channel for Project.node_id."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst]
    code: 200
    input: ["node_id?", "status?", "technology?", "limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/ppa/projects/{id}"
    description: "Fetch one project with its derived capacity ledger."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst, RegistryAgent, OfftakerRep]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/ppa/projects/{id}/advance-milestone"
    description: "Advance the project one development milestone. This is the head of the five-hop conditions-precedent cascade."
    roles: [Originator]
    code: 200
    input: ["milestone", "evidence_ref"]
    output: Project
    side_effects:
      - "milestone must be the single legal successor of the current status (PERMITTED, INTERCONNECTION_APPROVED, NOTICE_TO_PROCEED, OPERATIONAL in that order)"
      - "sets last_milestone_at to the logical clock"
      - "hop 2: satisfies every PENDING ConditionPrecedent of the matching cp_type on this project's EXECUTED deals, copying evidence_ref from the request"
      - "hop 3: recomputes cp_completion_pct on each affected deal; a deal reaching 100.00 goes EXECUTED to EFFECTIVE with effective_at stamped"
      - "hop 4: releases every POSTED DEVELOPMENT_SECURITY instrument on each newly EFFECTIVE deal"
      - "hop 5: recomputes posted_credit_support_usd and released_credit_support_usd on those deals"
      - "increments Project.version by 1 and the version of every entity the cascade touches"

  - method: POST
    path: "/ppa/deals"
    description: "Structure a new PPA in DRAFT. Prices the deal immediately from the submitted commercial terms and snapshots the buyer's unsecured credit limit."
    roles: [Originator]
    code: 201
    input: ["project_id", "anchor_offtaker_id", "settlement_point_id", "product_type", "contracted_mw", "term_years", "first_delivery_year", "commercial_operation_deadline", "settlement_frequency", "base_fixed_price_usd_per_mwh", "escalation_pct_per_year", "shape_product", "basis_responsibility"]
    output: Deal
    side_effects:
      - "requires the anchor Offtaker.qualification_status IN {QUALIFIED, CONDITIONAL} and contracted_mw <= Project.available_mw"
      - "runs calculations.deal_contract_price to set contract_price_usd_per_mwh and price_tier"
      - "runs calculations.deal_expected_volume to set expected_annual_mwh"
      - "snapshots unsecured_credit_limit_usd and collateral_threshold_usd from the anchor Offtaker, then runs calculations.credit_support_requirement to set exposure_usd and credit_support_required_usd"
      - "status defaults to DRAFT, credit_status to NOT_SUBMITTED, round_count to 0, confirmed_allocated_mw to 0 and unallocated_mw to contracted_mw"
      - "recomputes Project.contracted_mw and Project.available_mw and increments Project.version by 1"
      - "created_by_user_id stamped from X-User-ID and used by the credit-decision segregation-of-duties gate"

  - method: GET
    path: "/ppa/deals"
    description: "List deals. The project_id, anchor_offtaker_id and settlement_point_id filters are the reverse-reachability channels for those three FKs."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst]
    code: 200
    input: ["project_id?", "anchor_offtaker_id?", "settlement_point_id?", "status?", "credit_status?", "limit?", "offset?"]
    output: "Deal[]"
    side_effects: []

  - method: GET
    path: "/ppa/deals/{id}"
    description: "Fetch one deal with both state dimensions, the full credit-support ledger and the attribute ledger. Its version is the OCC token for allocation and credit-support writes."
    roles: [Originator, CreditOfficer, DealCommittee, SettlementAnalyst, RegistryAgent, OfftakerRep]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: POST
    path: "/ppa/deals/{id}/rounds"
    description: "Table a developer term sheet. First round issues the sheet; later rounds drive the negotiation cycle and expire or counter any still-open round."
    roles: [Originator]
    code: 201
    input: ["proposed_by", "proposed_fixed_price_usd_per_mwh", "proposed_escalation_pct_per_year", "proposed_shape_product", "proposed_basis_responsibility", "response_deadline", "redline_items?"]
    output: TermSheetRound
    side_effects:
      - "requires Deal.status IN {DRAFT, UNDER_NEGOTIATION, TERMS_AGREED} and proposed_by == DEVELOPER"
      - "any OPEN round of this deal whose response_deadline < the logical clock transitions to EXPIRED; any whose response_deadline >= the clock transitions to COUNTERED"
      - "creates the new round with round_number = Deal.round_count + 1 and status OPEN, then increments Deal.round_count"
      - "from DRAFT the deal becomes TERM_SHEET_ISSUED; from UNDER_NEGOTIATION it returns to TERM_SHEET_ISSUED; from TERMS_AGREED it drops back to UNDER_NEGOTIATION and nulls contract_price_usd_per_mwh and price_tier, and is refused when credit_status == APPROVED"
      - "increments Deal.version by 1"

  - method: GET
    path: "/ppa/deals/{id}/rounds"
    description: "Reverse-reachability for TermSheetRound.deal_id: the full negotiation history in round_number order."
    roles: [Originator, OfftakerRep, DealCommittee]
    code: 200
    input: ["status?", "proposed_by?", "limit?", "offset?"]
    output: "TermSheetRound[]"
    side_effects: []

  - method: POST
    path: "/ppa/rounds/{id}/respond"
    description: "Buyer answer to an open term sheet: ACCEPT locks the terms and prices the deal, COUNTER creates a successor round."
    roles: [OfftakerRep]
    code: 200
    input: ["response", "counter_fixed_price_usd_per_mwh?", "counter_escalation_pct_per_year?", "counter_shape_product?", "counter_basis_responsibility?", "redline_items?"]
    output: TermSheetRound
    side_effects:
      - "requires TermSheetRound.status == OPEN, the logical clock at or before response_deadline, and X-User-ID == the parent Deal.anchor_offtaker_id"
      - "ACCEPT: round to ACCEPTED, deal TERM_SHEET_ISSUED to TERMS_AGREED, the round's proposed terms copied onto the deal, then calculations.deal_contract_price re-run"
      - "COUNTER: round to COUNTERED, deal to UNDER_NEGOTIATION, and a successor round created with proposed_by OFFTAKER, the counter_* terms from the request, and response_deadline = the logical clock plus ROUND_RESPONSE_DAYS (14) days"
      - "the response body is the newly created successor round on COUNTER, and the answered round itself on ACCEPT"
      - "increments TermSheetRound.version by 1 and Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/allocations"
    description: "Propose an aggregated-buyer share of the deal. OCC-guarded on the parent deal, because concurrent proposals would each be sized against a stale unallocated_mw."
    roles: [Originator]
    code: 201
    input: ["offtaker_id", "allocated_mw", "expected_deal_version", "joint_and_several?"]
    output: DealAllocation
    side_effects:
      - "requires expected_deal_version to equal the current Deal.version, else ERR_STALE_VERSION (412)"
      - "requires Deal.status IN {TERM_SHEET_ISSUED, UNDER_NEGOTIATION, TERMS_AGREED} and the named Offtaker.qualification_status IN {QUALIFIED, CONDITIONAL}"
      - "refused when that offtaker already holds a PROPOSED or CONFIRMED allocation on this deal"
      - "status defaults to PROPOSED; allocation_share_pct = round(100 * allocated_mw / Deal.contracted_mw, 2)"
      - "recomputes Deal.unallocated_mw as contracted_mw minus confirmed_allocated_mw"
      - "increments DealAllocation.version by 1 and increments Deal.version by 1"

  - method: GET
    path: "/ppa/deals/{id}/allocations"
    description: "Reverse-reachability for DealAllocation.deal_id: every buyer share on this deal."
    roles: [Originator, CreditOfficer, DealCommittee, OfftakerRep]
    code: 200
    input: ["status?", "offtaker_id?", "limit?", "offset?"]
    output: "DealAllocation[]"
    side_effects: []

  - method: POST
    path: "/ppa/allocations/{id}/decision"
    description: "Buyer confirms or withdraws its own share. CONFIRM is aggregate-validated against the deal's contracted capacity; WITHDRAW is the exact compensating action."
    roles: [OfftakerRep]
    code: 200
    input: ["decision"]
    output: DealAllocation
    side_effects:
      - "requires X-User-ID == DealAllocation.offtaker_id"
      - "CONFIRM requires the sum of CONFIRMED allocated_mw after the change to be at most Deal.contracted_mw, else ERR_ALLOCATION_EXCEEDS_CONTRACTED_MW; equality is allowed"
      - "CONFIRM stamps confirmed_at; WITHDRAW is legal from PROPOSED and from CONFIRMED"
      - "recomputes Deal.confirmed_allocated_mw and Deal.unallocated_mw"
      - "increments DealAllocation.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/submit-credit"
    description: "Submit the deal's credit package for underwriting. Re-sizes the requirement, sweeps expired instruments and moves credit_status to SUBMITTED."
    roles: [Originator]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "requires credit_status IN {NOT_SUBMITTED, DECLINED, SUPPORT_SHORTFALL}, contract_price_usd_per_mwh not null and the anchor Offtaker's tier not DECLINED"
      - "every POSTED instrument whose expiry_date is at or before the logical clock transitions POSTED to EXPIRED with closed_at stamped"
      - "re-snapshots unsecured_credit_limit_usd and collateral_threshold_usd from the anchor Offtaker and re-runs calculations.credit_support_requirement"
      - "recomputes posted_credit_support_usd over the surviving POSTED instruments"
      - "clears support_cure_deadline when arriving from SUPPORT_SHORTFALL"
      - "increments Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/credit-decision"
    description: "Credit officer approves or declines the submitted package. Approval requires posted eligible support to cover the requirement."
    roles: [CreditOfficer]
    code: 200
    input: ["decision", "decision_note?"]
    output: Deal
    side_effects:
      - "requires credit_status == SUBMITTED and X-User-ID != Deal.created_by_user_id"
      - "APPROVE requires posted_credit_support_usd >= credit_support_required_usd and stamps credit_approved_by_user_id from X-User-ID"
      - "DECLINE nulls credit_approved_by_user_id and leaves Deal.status untouched, which is what makes the two dimensions independent"
      - "collateral_threshold_usd is NOT renegotiated here; it keeps the value snapshotted at submit-credit"
      - "increments Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/credit-support"
    description: "Register a proposed credit-support instrument against the deal. Registration computes nothing; the haircut is applied only when the instrument is posted."
    roles: [Originator, CreditOfficer]
    code: 201
    input: ["instrument_type", "purpose", "face_amount_usd", "effective_date", "expiry_date", "issuer_name?", "issuer_rating?", "guarantor_offtaker_id?"]
    output: CreditSupportInstrument
    side_effects:
      - "requires expiry_date > effective_date, else ERR_INVALID_WINDOW"
      - "status defaults to PROPOSED with haircut_pct, eligible_credit_usd, posted_at and closed_at all null"
      - "does NOT move Deal.posted_credit_support_usd and does NOT increment Deal.version"

  - method: GET
    path: "/ppa/deals/{id}/credit-support"
    description: "Reverse-reachability for CreditSupportInstrument.deal_id: the deal's full collateral stack."
    roles: [CreditOfficer, Originator, DealCommittee]
    code: 200
    input: ["status?", "purpose?", "instrument_type?", "limit?", "offset?"]
    output: "CreditSupportInstrument[]"
    side_effects: []

  - method: POST
    path: "/ppa/credit-support/{id}/post"
    description: "Post a registered instrument, applying the eligibility haircut and crediting the deal's coverage. OCC-guarded on the parent deal because the coverage arithmetic depends on a fresh view of the requirement."
    roles: [CreditOfficer]
    code: 200
    input: ["expected_deal_version"]
    output: CreditSupportInstrument
    side_effects:
      - "requires expected_deal_version to equal the current Deal.version, else ERR_STALE_VERSION (412)"
      - "requires status == PROPOSED, an eligible issuer or guarantor, and for LETTER_OF_CREDIT and PARENT_GUARANTEE a remaining tenor of at least MIN_TENOR_DAYS (365) whole days from the logical clock"
      - "runs calculations.eligible_credit_support to set haircut_pct and eligible_credit_usd, and stamps posted_at"
      - "recomputes Deal.posted_credit_support_usd as the sum of eligible_credit_usd over POSTED instruments"
      - "cures a SUPPORT_SHORTFALL deal back to APPROVED and clears support_cure_deadline when the recomputed coverage reaches the requirement"
      - "increments CreditSupportInstrument.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/credit-support/{id}/release"
    description: "Release a posted instrument back to the buyer. The compensating half of post; refused when it would break coverage on an approved deal."
    roles: [CreditOfficer]
    code: 200
    input: []
    output: CreditSupportInstrument
    side_effects:
      - "requires status == POSTED and Deal.status != TERMINATED"
      - "refused with ERR_RELEASE_BREACHES_COVERAGE when credit_status == APPROVED and the release would drop posted_credit_support_usd below credit_support_required_usd"
      - "stamps closed_at and recomputes Deal.posted_credit_support_usd and Deal.released_credit_support_usd so posted + released + drawn is conserved"
      - "increments CreditSupportInstrument.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/execute"
    description: "Sign the agreement. Builds the conditions-precedent set from the conditional template; an empty set makes the deal EFFECTIVE in the same request."
    roles: [DealCommittee]
    code: 200
    input: []
    output: Deal
    side_effects:
      - "requires Deal.status == TERMS_AGREED, credit_status == APPROVED, X-User-ID != credit_approved_by_user_id, the anchor Offtaker QUALIFIED, confirmed_allocated_mw == contracted_mw and posted_credit_support_usd >= credit_support_required_usd; the project's development status is deliberately NOT a precondition, because signing before permitting is exactly what the conditions-precedent set exists to govern"
      - "creates one ConditionPrecedent per included row of calculations.cp_template_selection, each PENDING with its computed deadline_date and is_waivable"
      - "sets cp_total_count and runs calculations.cp_completion_pct"
      - "when the template is empty, cp_completion_pct is 100.00 and the deal transitions EXECUTED to EFFECTIVE inside the same request, stamping effective_at and releasing every POSTED DEVELOPMENT_SECURITY instrument"
      - "recomputes Project.contracted_mw and Project.available_mw"
      - "increments Deal.version by 1"

  - method: GET
    path: "/ppa/deals/{id}/conditions-precedent"
    description: "Reverse-reachability for ConditionPrecedent.deal_id. These rows are created only by the execute cascade, so this GET is their only discovery channel."
    roles: [Originator, DealCommittee, OfftakerRep]
    code: 200
    input: ["status?", "cp_type?", "limit?", "offset?"]
    output: "ConditionPrecedent[]"
    side_effects: []

  - method: POST
    path: "/ppa/conditions-precedent/{id}/resolution"
    description: "Satisfy, waive, fail or re-cure one condition precedent. SATISFY and WAIVE both clear the condition but have deliberately different side-effect sets."
    roles: [Originator, DealCommittee]
    code: 200
    input: ["resolution", "evidence_ref?", "waiver_justification?"]
    output: ConditionPrecedent
    side_effects:
      - "SATISFY requires status PENDING, evidence_ref present, the logical clock at or before deadline_date, and Deal.status == EXECUTED"
      - "WAIVE requires status PENDING, is_waivable true, waiver_justification present, and additionally extends Deal.commercial_operation_deadline by CP_WAIVER_EXTENSION_DAYS (30) days - a side effect SATISFY never applies"
      - "FAIL sets cure_deadline to the logical clock plus CP_CURE_DAYS (15) days and vests the CP_FAILURE termination right"
      - "RECURE requires status FAILED and the logical clock at or before cure_deadline; it clears cure_deadline and resolved_at and pushes deadline_date out by CP_CURE_DAYS days"
      - "every resolution recomputes Deal.cp_completion_pct; reaching exactly 100.00 drives EXECUTED to EFFECTIVE with the DEVELOPMENT_SECURITY release cascade"
      - "increments ConditionPrecedent.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/terminate"
    description: "Terminate the agreement on a vested right, running the three-branch termination cascade over conditions, collateral and attributes."
    roles: [DealCommittee]
    code: 200
    input: ["termination_reason"]
    output: Deal
    side_effects:
      - "requires Deal.status IN {TERMS_AGREED, EXECUTED, EFFECTIVE}, the cited right vested per ERR_TERMINATION_RIGHT_NOT_VESTED, and for CP_FAILURE that X-User-ID differs from the resolved_by_user_id of the FAILED condition"
      - "refused from EFFECTIVE while any SettlementPeriod of the deal is DISPUTED"
      - "stamps terminated_at and termination_reason"
      - "every PENDING ConditionPrecedent fails and cp_completion_pct is recomputed"
      - "every POSTED instrument is DRAWN when termination_reason == BUYER_DEFAULT and RELEASED for every other reason, then the three support totals are recomputed"
      - "every MINTED EnvironmentalAttributeBatch is CANCELLED and attributes_minted_mwh is recomputed; TRANSFERRED and RETIRED batches are untouched"
      - "every PROPOSED or CONFIRMED DealAllocation is WITHDRAWN from the TERMS_AGREED path"
      - "recomputes Project.contracted_mw and Project.available_mw"
      - "increments Deal.version by 1 and the version of every entity the cascade touches"

  - method: POST
    path: "/ppa/deals/{id}/settlement-periods"
    description: "Open a settlement period on an effective deal, snapshotting the netting method that will govern its arithmetic."
    roles: [SettlementAnalyst]
    code: 201
    input: ["period_start", "period_end"]
    output: SettlementPeriod
    side_effects:
      - "requires Deal.status == EFFECTIVE, period_end > period_start, and no half-open overlap with an existing period of the same deal"
      - "netting_method is computed as a snapshot of Deal.settlement_frequency and never changes afterwards; a deal is created with one settlement_frequency and there is no endpoint that amends it, so two deals are needed to compare the two netting variants"
      - "status defaults to OPEN with interval_count 0 and every money field null"

  - method: GET
    path: "/ppa/deals/{id}/settlement-periods"
    description: "Reverse-reachability for SettlementPeriod.deal_id."
    roles: [SettlementAnalyst, Originator, OfftakerRep]
    code: 200
    input: ["status?", "netting_method?", "limit?", "offset?"]
    output: "SettlementPeriod[]"
    side_effects: []

  - method: GET
    path: "/ppa/settlement-periods/{id}"
    description: "Fetch one settlement period with its computed totals. Its version is the OCC token for interval posting."
    roles: [SettlementAnalyst, Originator, OfftakerRep, RegistryAgent]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: []

  - method: POST
    path: "/ppa/settlement-periods/{id}/intervals"
    description: "Post one metered hour into an open or calculated period. OCC-guarded on the period, because a stale writer is exactly the writer who would duplicate an hour."
    roles: [SettlementAnalyst]
    code: 201
    input: ["hour_start", "metered_mwh", "node_price_usd_per_mwh", "hub_price_usd_per_mwh", "expected_settlement_period_version", "curtailment_flag?"]
    output: MeterInterval
    side_effects:
      - "requires expected_settlement_period_version to equal the current SettlementPeriod.version, else ERR_STALE_VERSION (412)"
      - "requires SettlementPeriod.status IN {OPEN, CALCULATED, DISPUTED}, hour_start exactly on the hour and inside the period's half-open window, and no existing interval for that hour"
      - "curtailment_flag defaults to NONE; expected_mwh, deemed_mwh and delivered_mwh stay null or 0 until the period is calculated"
      - "increments SettlementPeriod.interval_count by 1 and increments SettlementPeriod.version by 1"
      - "posted_by_user_id stamped from X-User-ID"

  - method: GET
    path: "/ppa/settlement-periods/{id}/intervals"
    description: "Reverse-reachability for MeterInterval.settlement_period_id, in hour_start order."
    roles: [SettlementAnalyst, Originator, OfftakerRep]
    code: 200
    input: ["curtailment_flag?", "limit?", "offset?"]
    output: "MeterInterval[]"
    side_effects: []

  - method: POST
    path: "/ppa/settlement-periods/{id}/calculate"
    description: "Run the period's settlement. Idempotent in the sense that re-running overwrites rather than accumulates, and it is the only way an accepted risk claim reaches the money."
    roles: [SettlementAnalyst]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects:
      - "requires interval_count >= 1, Deal.status == EFFECTIVE and status IN {OPEN, CALCULATED, DISPUTED}"
      - "runs calculations.deemed_generation over every interval, rewriting expected_mwh, deemed_mwh and delivered_mwh and incrementing each MeterInterval.version"
      - "runs calculations.settlement_netting under the variant named by the period's own netting_method snapshot"
      - "runs calculations.mintable_attributes over total_metered_mwh only"
      - "stamps calculated_at; arriving from DISPUTED also clears invoiced_at and dispute_reason"
      - "increments SettlementPeriod.version by 1"

  - method: POST
    path: "/ppa/settlement-periods/{id}/advance"
    description: "Advance a calculated period through invoicing, dispute and settlement."
    roles: [SettlementAnalyst, OfftakerRep]
    code: 200
    input: ["action", "dispute_reason?"]
    output: SettlementPeriod
    side_effects:
      - "INVOICE requires status CALCULATED and no CLAIMED RiskEvent of this deal intersecting the period window; stamps invoiced_at"
      - "SETTLE requires status INVOICED"
      - "DISPUTE requires status INVOICED, X-User-ID == the parent Deal.anchor_offtaker_id and a dispute_reason, which is stored"
      - "INVOICE and SETTLE are SettlementAnalyst-only; DISPUTE is OfftakerRep-only"
      - "increments SettlementPeriod.version by 1"

  - method: POST
    path: "/ppa/settlement-periods/{id}/mint-attributes"
    description: "Mint a whole-MWh renewable attribute batch from a calculated period's metered energy."
    roles: [RegistryAgent]
    code: 201
    input: ["quantity_mwh", "registry"]
    output: EnvironmentalAttributeBatch
    side_effects:
      - "requires SettlementPeriod.status IN {CALCULATED, INVOICED, SETTLED} and quantity_mwh at most mintable_attributes_mwh minus what earlier batches already minted from this period"
      - "vintage_month is computed as the YYYY-MM of the period's period_start"
      - "status defaults to MINTED, claim_substantiation_status to UNSUBSTANTIATED and allocation_breakdown to the empty array"
      - "increases Deal.attributes_minted_mwh by quantity_mwh and increments Deal.version by 1"

  - method: GET
    path: "/ppa/deals/{id}/attribute-batches"
    description: "Reverse-reachability for EnvironmentalAttributeBatch.deal_id."
    roles: [RegistryAgent, Originator, OfftakerRep]
    code: 200
    input: ["status?", "vintage_month?", "limit?", "offset?"]
    output: "EnvironmentalAttributeBatch[]"
    side_effects: []

  - method: POST
    path: "/ppa/attribute-batches/{id}/transfer"
    description: "Convey a minted batch into a confirmed buyer's registry account, splitting it across the aggregated buyers by the largest-remainder method."
    roles: [RegistryAgent]
    code: 200
    input: ["transferred_to_offtaker_id", "registry_serial_range"]
    output: EnvironmentalAttributeBatch
    side_effects:
      - "requires status == MINTED, a CONFIRMED DealAllocation for the recipient on this deal, and a non-null registry_account_id on the recipient"
      - "runs calculations.attribute_allocation to populate allocation_breakdown, whose parts sum exactly to quantity_mwh"
      - "stamps transferred_at and increases Deal.attributes_transferred_mwh by quantity_mwh"
      - "increments EnvironmentalAttributeBatch.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/attribute-batches/{id}/cancel-transfer"
    description: "Reverse a registry transfer. The exact compensating action for transfer; the attribute MWh ledger must return to its pre-transfer values."
    roles: [RegistryAgent]
    code: 200
    input: []
    output: EnvironmentalAttributeBatch
    side_effects:
      - "requires status == TRANSFERRED"
      - "nulls transferred_to_offtaker_id, registry_serial_range and transferred_at, and resets allocation_breakdown to the empty array"
      - "decreases Deal.attributes_transferred_mwh by quantity_mwh, leaving attributes_minted_mwh untouched"
      - "increments EnvironmentalAttributeBatch.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/attribute-batches/{id}/retire"
    description: "Retire a transferred batch against the buyer's claim year, which is what substantiates the claim."
    roles: [RegistryAgent]
    code: 200
    input: ["claim_year"]
    output: EnvironmentalAttributeBatch
    side_effects:
      - "requires status == TRANSFERRED, claim_substantiation_status == UNSUBSTANTIATED, and claim_year within the vintage year plus REC_CLAIM_WINDOW_YEARS (1)"
      - "stamps retired_at, stores claim_year and flips claim_substantiation_status to SUBSTANTIATED"
      - "increases Deal.attributes_retired_mwh and the recipient Offtaker.claimed_attributes_mwh by quantity_mwh, incrementing that Offtaker.version by 1"
      - "increments EnvironmentalAttributeBatch.version by 1 and increments Deal.version by 1"

  - method: POST
    path: "/ppa/deals/{id}/risk-events"
    description: "Claim a change-in-law, curtailment or force-majeure event over a closed time window."
    roles: [Originator, OfftakerRep]
    code: 201
    input: ["event_type", "claimed_by", "window_start", "window_end", "description?"]
    output: RiskEvent
    side_effects:
      - "requires Deal.status IN {EFFECTIVE, EXECUTED}, window_end >= window_start, and no closed-interval collision with another CLAIMED or ACCEPTED event of the same event_type on this deal"
      - "status defaults to CLAIMED with allocation_outcome, price_adjustment_usd_per_mwh and duration_days null and excused_hours 0"
      - "an OfftakerRep claimant must be the anchor buyer or a confirmed allocation holder"

  - method: GET
    path: "/ppa/deals/{id}/risk-events"
    description: "Reverse-reachability for RiskEvent.deal_id."
    roles: [Originator, DealCommittee, OfftakerRep, SettlementAnalyst]
    code: 200
    input: ["event_type?", "status?", "limit?", "offset?"]
    output: "RiskEvent[]"
    side_effects: []

  - method: POST
    path: "/ppa/risk-events/{id}/review"
    description: "Committee decision on a claimed risk event. Acceptance is the head of the three-hop change-in-law repricing cascade."
    roles: [DealCommittee]
    code: 200
    input: ["decision", "allocation_outcome?", "price_adjustment_usd_per_mwh?"]
    output: RiskEvent
    side_effects:
      - "requires status == CLAIMED; ACCEPT requires allocation_outcome, and CHANGE_IN_LAW additionally requires price_adjustment_usd_per_mwh"
      - "ACCEPT runs calculations.risk_event_impact to set duration_days and excused_hours, and stamps reviewed_by_user_id and reviewed_at"
      - "hop 2 for CHANGE_IN_LAW: Deal.contract_price_usd_per_mwh is adjusted, then exposure_usd and credit_support_required_usd are recomputed"
      - "hop 3: an APPROVED deal whose posted support no longer covers the new requirement drops to SUPPORT_SHORTFALL with support_cure_deadline set to the logical clock plus SUPPORT_CURE_DAYS (10) days"
      - "already-CALCULATED periods are NOT rewritten; a fresh calculate call is required to pick up deemed generation or the new price"
      - "REJECT leaves allocation_outcome and price_adjustment_usd_per_mwh null and excused_hours at 0"
      - "increments RiskEvent.version by 1 and increments Deal.version by 1 on the CHANGE_IN_LAW path"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not among the roles declared for the endpoint"
  - id: ERR_NOT_DEAL_COUNTERPARTY
    http: 403
    condition: "an OfftakerRep acts on a deal where X-User-ID is neither the anchor_offtaker_id nor the offtaker_id of a CONFIRMED allocation"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same person who performed the preparing step (offtaker creation before qualification-decision, deal creation before credit-decision, CP failure before a CP_FAILURE termination)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is missing, an enum value is not a declared member, a numeric is out of its declared range, a datetime does not parse, or pagination limit/offset are out of bounds"

  - id: ERR_PRICING_NODE_NOT_FOUND
    http: 404
    condition: "the pricing node id in the path or in node_id / settlement_point_id does not exist"
  - id: ERR_OFFTAKER_NOT_FOUND
    http: 404
    condition: "the offtaker id in the path or in anchor_offtaker_id / offtaker_id / parent_guarantor_offtaker_id / guarantor_offtaker_id / transferred_to_offtaker_id does not exist"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "the project id in the path or in project_id does not exist"
  - id: ERR_DEAL_NOT_FOUND
    http: 404
    condition: "the deal id in the path does not exist"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "the allocation id in the path does not exist"
  - id: ERR_ROUND_NOT_FOUND
    http: 404
    condition: "the term sheet round id in the path does not exist"
  - id: ERR_CREDIT_SUPPORT_NOT_FOUND
    http: 404
    condition: "the credit support instrument id in the path does not exist"
  - id: ERR_CONDITION_PRECEDENT_NOT_FOUND
    http: 404
    condition: "the condition precedent id in the path does not exist"
  - id: ERR_SETTLEMENT_PERIOD_NOT_FOUND
    http: 404
    condition: "the settlement period id in the path does not exist"
  - id: ERR_ATTRIBUTE_BATCH_NOT_FOUND
    http: 404
    condition: "the environmental attribute batch id in the path does not exist"
  - id: ERR_RISK_EVENT_NOT_FOUND
    http: 404
    condition: "the risk event id in the path does not exist"

  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the subject entity's own current state has no declared transition for the requested trigger on that dimension"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_deal_version or expected_settlement_period_version does not equal the parent's current version"

  - id: ERR_GUARANTOR_CYCLE
    http: 422
    condition: "a supplied parent_guarantor_offtaker_id points at the offtaker itself or closes a cycle in the upward guarantor chain, on create or on a rating-change re-parenting"
  - id: ERR_OFFTAKER_NOT_QUALIFIED
    http: 422
    condition: "the anchor buyer is not QUALIFIED or CONDITIONAL when a deal is created, or not QUALIFIED when it is executed"
  - id: ERR_CREDIT_TIER_DECLINED
    http: 422
    condition: "the anchor buyer's credit_tier is DECLINED at credit submission or execution"
  - id: ERR_NO_CONFIRMED_ALLOCATION
    http: 422
    condition: "an attribute transfer names a buyer with no CONFIRMED allocation on the batch's deal"
  - id: ERR_OPEN_RISK_CLAIM
    http: 409
    condition: "invoicing is attempted while a CLAIMED risk event of the deal intersects the settlement period window"
  - id: ERR_REGISTRY_ACCOUNT_MISSING
    http: 422
    condition: "the transfer recipient has a null registry_account_id"
  - id: ERR_CLAIM_YEAR_OUT_OF_WINDOW
    http: 422
    condition: "the retirement claim_year is before the batch's vintage year or more than REC_CLAIM_WINDOW_YEARS after it"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end < window_start, period_end <= period_start, expiry_date <= effective_date, or commercial_operation_deadline at or before the logical clock"
  - id: ERR_CP_DEADLINE_PASSED
    http: 409
    condition: "a condition precedent is satisfied after its deadline_date, or re-cured after its cure_deadline"
  - id: ERR_ROUND_EXPIRED
    http: 409
    condition: "a term sheet round is answered after its response_deadline"
  - id: ERR_INELIGIBLE_ISSUER
    http: 422
    condition: "a posted letter of credit has an issuer_rating outside {AAA, AA, A, BBB, BB}, or a posted parent guarantee names the wrong guarantor or a guarantor whose credit_tier is DECLINED"
  - id: ERR_INSTRUMENT_TENOR_TOO_SHORT
    http: 422
    condition: "a posted letter of credit or parent guarantee has fewer than MIN_TENOR_DAYS whole days of remaining tenor"
  - id: ERR_RISK_WINDOW_OVERLAP
    http: 409
    condition: "a new risk claim's closed window touches or overlaps a CLAIMED or ACCEPTED claim of the same event_type on the same deal"
  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 409
    condition: "a new settlement period's half-open window overlaps an existing period of the same deal"
  - id: ERR_HOUR_OUTSIDE_PERIOD
    http: 422
    condition: "a meter interval's hour_start is not on the hour or falls outside the period's half-open window"
  - id: ERR_DUPLICATE_METER_HOUR
    http: 409
    condition: "a meter interval for that hour_start already exists in the period"
  - id: ERR_DUPLICATE_ALLOCATION
    http: 409
    condition: "the offtaker already holds a PROPOSED or CONFIRMED allocation on the deal"
  - id: ERR_DUPLICATE_PRICING_NODE
    http: 409
    condition: "a pricing node with that name already exists"
  - id: ERR_PRICE_ADJUSTMENT_INVALID
    http: 422
    condition: "an accepted CHANGE_IN_LAW review omits price_adjustment_usd_per_mwh, or the adjustment would drive the contract price to zero or below"
  - id: ERR_PROJECT_CAPACITY_EXCEEDED
    http: 422
    condition: "a new deal's contracted_mw exceeds the project's available_mw"
  - id: ERR_ALLOCATION_EXCEEDS_CONTRACTED_MW
    http: 422
    condition: "confirming an allocation would push the deal's confirmed megawatts above contracted_mw"
  - id: ERR_ALLOCATION_INCOMPLETE
    http: 422
    condition: "execution is attempted while confirmed_allocated_mw is below contracted_mw"
  - id: ERR_CREDIT_SUPPORT_SHORTFALL
    http: 422
    condition: "execution is attempted while posted_credit_support_usd is below credit_support_required_usd"
  - id: ERR_RELEASE_BREACHES_COVERAGE
    http: 422
    condition: "releasing an instrument would drop posted coverage below the requirement on a deal whose credit_status is APPROVED"
  - id: ERR_ATTRIBUTE_QUANTITY_EXCEEDS_MINTABLE
    http: 422
    condition: "the requested attribute quantity exceeds the period's remaining mintable whole megawatt-hours"
  - id: ERR_TERMINATION_RIGHT_NOT_VESTED
    http: 422
    condition: "the cited termination reason is not vested at the logical clock"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Originator
    description: "Developer-side origination lead. Builds projects, buyers and deals, tables developer term sheets, proposes allocations and instruments, advances project milestones, resolves conditions precedent and claims risk events on the seller's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /ppa/offtakers"
      - "POST /ppa/offtakers/{id}/submit-qualification"
      - "POST /ppa/projects"
      - "POST /ppa/projects/{id}/advance-milestone"
      - "POST /ppa/deals"
      - "POST /ppa/deals/{id}/rounds"
      - "POST /ppa/deals/{id}/allocations"
      - "POST /ppa/deals/{id}/submit-credit"
    shared_operations:
      - "POST /ppa/pricing-nodes (with SettlementAnalyst)"
      - "POST /ppa/deals/{id}/credit-support (with CreditOfficer)"
      - "POST /ppa/conditions-precedent/{id}/resolution (with DealCommittee)"
      - "POST /ppa/deals/{id}/risk-events (with OfftakerRep)"
      - "all GET endpoints"

  - name: CreditOfficer
    description: "Underwrites buyers and deals. Owns every qualification and credit decision and the entire credit-support lifecycle. Barred by segregation of duties from deciding on records it prepared."
    identity: "opaque"
    exclusive_operations:
      - "POST /ppa/offtakers/{id}/qualification-decision"
      - "POST /ppa/offtakers/{id}/rating-change"
      - "POST /ppa/deals/{id}/credit-decision"
      - "POST /ppa/credit-support/{id}/post"
      - "POST /ppa/credit-support/{id}/release"
    shared_operations:
      - "POST /ppa/deals/{id}/credit-support (with Originator)"
      - "GET /ppa/offtakers, GET /ppa/offtakers/{id}/issued-guarantees, GET /ppa/deals and the deal sub-resource GETs"

  - name: DealCommittee
    description: "Signing authority. Executes and terminates agreements, waives conditions precedent and rules on risk-event claims. Cannot execute a deal whose credit it approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /ppa/deals/{id}/execute"
      - "POST /ppa/deals/{id}/terminate"
      - "POST /ppa/risk-events/{id}/review"
    shared_operations:
      - "POST /ppa/conditions-precedent/{id}/resolution (with Originator; WAIVE is committee-only in effect because is_waivable conditions are the committee's call)"
      - "GET /ppa/deals, GET /ppa/deals/{id}/conditions-precedent, GET /ppa/deals/{id}/risk-events"

  - name: SettlementAnalyst
    description: "Runs the settlement ledger: opens periods, posts metered hours, calculates netting, invoices and settles."
    identity: "opaque"
    exclusive_operations:
      - "POST /ppa/deals/{id}/settlement-periods"
      - "POST /ppa/settlement-periods/{id}/intervals"
      - "POST /ppa/settlement-periods/{id}/calculate"
    shared_operations:
      - "POST /ppa/pricing-nodes (with Originator)"
      - "POST /ppa/settlement-periods/{id}/advance (INVOICE and SETTLE only; DISPUTE is OfftakerRep-only)"
      - "GET /ppa/settlement-periods/{id}, GET /ppa/settlement-periods/{id}/intervals, GET /ppa/deals"

  - name: RegistryAgent
    description: "Environmental attribute registry operator. Mints, transfers, cancels transfers of and retires attribute batches, and is the only role that can substantiate a buyer's claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /ppa/settlement-periods/{id}/mint-attributes"
      - "POST /ppa/attribute-batches/{id}/transfer"
      - "POST /ppa/attribute-batches/{id}/cancel-transfer"
      - "POST /ppa/attribute-batches/{id}/retire"
    shared_operations:
      - "GET /ppa/deals/{id}/attribute-batches, GET /ppa/offtakers/{id}/attribute-batches, GET /ppa/settlement-periods/{id}"

  - name: OfftakerRep
    description: "The corporate buyer acting for itself. X-User-ID is the Offtaker.id, so every buyer-side action is ownership-checked against the deal's anchor_offtaker_id or the acting buyer's own allocation."
    identity: "entity_backed:Offtaker"
    exclusive_operations:
      - "POST /ppa/rounds/{id}/respond"
      - "POST /ppa/allocations/{id}/decision"
      - "POST /ppa/settlement-periods/{id}/advance with action DISPUTE"
    shared_operations:
      - "POST /ppa/deals/{id}/risk-events (with Originator)"
      - "GET /ppa/deals/{id}, GET /ppa/deals/{id}/rounds, GET /ppa/deals/{id}/allocations, GET /ppa/offtakers/{id}/allocations, GET /ppa/deals/{id}/settlement-periods, GET /ppa/deals/{id}/attribute-batches"
