# =============================================================================
# §1.9 Scaffold Corner Design — Ski & Snowboard Tune & Rental Shop
# Breadth coverage of every testable claim in §1.1–§1.7 NOT already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections/claim_types follow
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ============================================================== entities
  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: creation_defaults
        grounds: ["entities.Customer.fields.standing", "entities.Customer.fields.late_return_count"]
        distinguishing_aspect: "A created customer starts with standing GOOD_STANDING, late_return_count 0, version 1, server-minted id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Def Ault", email: "def@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id", st: "$.data.standing", v: "$.data.version" } }
          trigger: []
          assert:
            - "HTTP 201; ${st} == GOOD_STANDING; Customer.${cust}.late_return_count == 0; ${v} == 1"
            - "created_at/updated_at present in ISO 8601 UTC with 3 fractional digits"

      - name: customer_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field email is rejected with ERR_INVALID_REQUEST (400); every source:input field without a default is required."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shop/customers", payload: { full_name: "No Mail", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_INVALID_REQUEST; HTTP 400"]

      - name: customer_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /shop/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: FrontDesk, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_NOT_FOUND; HTTP 404"]

      - name: equipment_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.EquipmentItem.fields.status", "state_machines.EquipmentItem"]
        distinguishing_aspect: "Client-supplied id/status/version on create are ignored: the unit starts AVAILABLE with version 1 and a server-minted id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000, id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", status: "RETIRED", version: 99 }, as: Manager, captures: { unit: "$.data.id", st: "$.data.status", v: "$.data.version" } }
          assert:
            - "HTTP 201; ${st} == AVAILABLE (initial state); ${v} == 1"
            - "${unit} != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2 (client id ignored)"

      - name: reservation_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more; page 1 of 3 with limit 2 has has_more true, offset 2 returns the residual item."
        test_recipe:
          setup: ["One customer with three reservations"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Page Turner", email: "page@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-01", end_date: "2026-12-02", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-11", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-20", end_date: "2026-12-21", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /shop/reservations?customer_id=${cust}&limit=2&offset=0", payload: {}, as: FrontDesk }
            - { call: "GET /shop/reservations?customer_id=${cust}&limit=2&offset=2", payload: {}, as: FrontDesk }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page 2: 1 item, total_count == 3, has_more == false"

  # ============================================================== state_machines
  - section: state_machines
    instances:
      - name: equipment_initial_state_available
        claim_type: initial_state
        grounds: ["state_machines.EquipmentItem"]
        distinguishing_aspect: "New fleet units start AVAILABLE and are immediately eligible for assignment."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /shop/equipment-items", payload: { gear_type: "BOOT", size_label: "26.5", tier: "STANDARD", din_min: 0, din_max: 0, purchase_price_cents: 25000, base_daily_rate_cents: 1500 }, as: Manager, captures: { unit: "$.data.id", st: "$.data.status" } }
          trigger: []
          assert: ["${st} == AVAILABLE; version == 1"]

      - name: ticket_cancel_from_picked_up_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: ["state_machines.TuneTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PICKED_UP is terminal: a later cancel is rejected with ERR_INVALID_STATE and fires no side effects."
        test_recipe:
          setup:
            - "Capacity for 2026-12-01 (base 480, rush 120); own-gear WAX ticket driven INTAKE->QUOTED->APPROVED->IN_PROGRESS->QUALITY_CHECK->READY->PICKED_UP"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/shop-day-capacity", payload: { service_date: "2026-12-01", base_labor_minutes: 480, rush_reserved_minutes: 120 }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Ter Minal", email: "term@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/tune-tickets", payload: { customer_id: "${cust}", own_gear_description: "own skis", services: ["WAX"], rush: false }, as: Customer, as_user_id: "${cust}", captures: { tk: "$.data.id" } }
            - { call: "POST /shop/tune-tickets/${tk}/quote", payload: {}, as: Technician, captures: { v_q: "$.data.version" } }
            - { call: "POST /shop/tune-tickets/${tk}/approve", payload: { expected_tune_ticket_version: "${v_q}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /shop/tune-tickets/${tk}/start", payload: {}, as: Technician }
            - { call: "POST /shop/tune-tickets/${tk}/complete", payload: {}, as: Technician }
            - { call: "POST /shop/tune-tickets/${tk}/qc-pass", payload: {}, as: Technician }
            - { call: "POST /shop/tune-tickets/${tk}/pickup", payload: {}, as: Customer, as_user_id: "${cust}", captures: { st: "$.data.status" } }
          trigger:
            - { call: "POST /shop/tune-tickets/${tk}/cancel", payload: {}, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "Pre-trigger: ${st} == PICKED_UP"
            - "${err} == ERR_INVALID_STATE; HTTP 409; ticket remains PICKED_UP with final_price_cents == 2500"

      - name: equipment_retire_from_out_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.EquipmentItem.AVAILABLE_to_RETIRED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Retire is only legal from AVAILABLE; an OUT unit rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Rental picked up so the unit is OUT"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Re Tire", email: "retire@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 2400 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
          trigger:
            - { call: "POST /shop/equipment-items/${unit}/retire", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_INVALID_STATE; EquipmentItem.${unit}.status remains OUT"]

      - name: reservation_overdue_auto_transition_on_clock
        claim_type: auto_transition
        grounds: ["state_machines.Reservation"]
        distinguishing_aspect: "Advancing the logical clock past end_date flips an ACTIVE reservation to OVERDUE without any client write to the reservation."
        test_recipe:
          setup: ["Confirmed reservation 2026-12-10..2026-12-12, picked up 2026-12-10"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Over Due", email: "due@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 2400 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-13T00:00:00Z" }, as: Manager }
            - { call: "GET /shop/reservations/${res}", payload: {}, as: FrontDesk, captures: { ful: "$.data.fulfillment_status" } }
          assert: ["${ful} == OVERDUE; payment_status still AUTHORIZED"]

      - name: demo_credit_auto_expires_at_expiry_boundary
        claim_type: auto_transition
        grounds: ["state_machines.DemoCredit.ACTIVE_to_EXPIRED", "calculations.demo_upgrade_pricing"]
        distinguishing_aspect: "At logical now == expires_at exactly (demo_date + 90d at 00:00:00Z) the credit reads EXPIRED — the boundary is inclusive of expiry."
        test_recipe:
          setup: ["Customer with DEMO-tier unit and demo credit dated 2026-12-01 (expires_at 2027-03-01T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Exp Ire", email: "exp@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SNOWBOARD", size_label: "156cm", tier: "DEMO", din_min: 2, din_max: 10, purchase_price_cents: 50000, base_daily_rate_cents: 5000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/demo-credits", payload: { customer_id: "${cust}", equipment_item_id: "${unit}", demo_date: "2026-12-01", fee_paid_cents: 5000 }, as: FrontDesk, captures: { credit: "$.data.id", exp: "$.data.expires_at" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-01T00:00:00Z" }, as: Manager }
            - { call: "GET /shop/demo-credits/${credit}", payload: {}, as: FrontDesk, captures: { st: "$.data.status" } }
          assert:
            - "${exp} == 2027-03-01T00:00:00Z"
            - "At now == expires_at: ${st} == EXPIRED (now >= expires_at boundary)"

      - name: pickup_booking_no_show_when_window_closes
        claim_type: auto_transition
        grounds: ["state_machines.PickupBooking.BOOKED_to_NO_SHOW", "state_machines.PickupWindow"]
        distinguishing_aspect: "When the clock reaches the window end, open BOOKED bookings flip to NO_SHOW and the window posture becomes CLOSED."
        test_recipe:
          setup: ["Confirmed reservation 2026-12-20..2026-12-21; window 2026-12-20 10:00-12:00 cap 2; one booking"]
          setup_api_calls:
            - { call: "POST /shop/pickup-windows", payload: { service_date: "2026-12-20", start_time: "10:00", end_time: "12:00", location_label: "CANYON", van_capacity: 2 }, as: Manager, captures: { win: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "No Show", email: "noshow@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-20", end_date: "2026-12-21", pickup_method: "SLOPE_SIDE" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 1600 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /shop/pickup-bookings", payload: { pickup_window_id: "${win}", reservation_id: "${res}" }, as: Customer, as_user_id: "${cust}", captures: { bk: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-20T12:00:00Z" }, as: Manager }
            - { call: "GET /shop/pickup-bookings/${bk}", payload: {}, as: FrontDesk, captures: { bst: "$.data.status" } }
            - { call: "GET /shop/pickup-windows/${win}", payload: {}, as: FrontDesk, captures: { wp: "$.data.posture" } }
          assert: ["${bst} == NO_SHOW (now >= window end)", "${wp} == CLOSED"]

      - name: damage_dispute_upheld_cycle_adjusts_capture
        claim_type: valid_transition
        grounds: ["state_machines.DamageAssessment.DISPUTED_to_INVOICED"]
        distinguishing_aspect: "The DISPUTED -> INVOICED loop with resolution UPHELD and adjusted_charge_cents 1500 recomputes the charge and compensates the reservation capture by the -500 delta."
        test_recipe:
          setup:
            - "Reservation (unit price 20000, rate 3000, deposit 5000) returned on time; COSMETIC assessment charged 2000 and invoiced (captured 2000); customer disputed"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Dis Pute", email: "disp@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "160cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 20000, base_daily_rate_cents: 3000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 5000 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${res}", equipment_item_id: "${unit}", severity: "COSMETIC" }, as: Technician, captures: { dmg: "$.data.id" } }
            - { call: "POST /shop/damage-assessments/${dmg}/invoice", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments/${dmg}/dispute", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /shop/damage-assessments/${dmg}/resolve", payload: { resolution: "UPHELD", adjusted_charge_cents: 1500 }, as: Manager, captures: { chg: "$.data.charge_cents", st: "$.data.status", capd: "$.data.deposit_captured_cents" } }
          assert:
            - "${st} == INVOICED (dispute loop back, not a new assessment)"
            - "${chg} == 1500 and ${capd} == 1500"
            - "Reservation.${res}.deposit_captured_cents == 1500 (delta -500 compensated)"

      - name: lease_reinstate_after_standing_recovery
        claim_type: side_effect_execution
        grounds: ["state_machines.SeasonLease.SUSPENDED_to_ACTIVE", "calculations.customer_standing"]
        distinguishing_aspect: "Paying the INVOICED TOTAL_LOSS assessment recomputes standing BARRED -> GOOD_STANDING, which then permits Manager reinstate SUSPENDED -> ACTIVE."
        test_recipe:
          setup:
            - "Same chain as difficulty instance damage_invoice_cascade_to_lease_suspension: lease SUSPENDED after TOTAL_LOSS invoice (charge 60000, captured 2400, remainder 57600)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T08:00:00Z" }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Juni Per", email: "juni@x.com", date_of_birth: "2014-06-01", height_cm: 140, weight_kg: 40, boot_sole_mm: 260, skier_type: "TYPE_1" }, as: FrontDesk, captures: { jun: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Gus Per", email: "gus@x.com", date_of_birth: "1980-03-10", height_cm: 182, weight_kg: 84, boot_sole_mm: 305, skier_type: "TYPE_2" }, as: FrontDesk, captures: { gua: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "130cm", tier: "JUNIOR", din_min: 1, din_max: 6, purchase_price_cents: 30000, base_daily_rate_cents: 2500 }, as: Manager, captures: { unitj: "$.data.id" } }
            - { call: "POST /shop/season-leases", payload: { junior_customer_id: "${jun}", guardian_customer_id: "${gua}", season_start_date: "2026-11-01", season_end_date: "2027-03-31", package_tier: "JUNIOR_SKI", deposit_cents: 10000 }, as: FrontDesk, captures: { lease: "$.data.id" } }
            - { call: "POST /shop/season-leases/${lease}/activate", payload: { equipment_item_id: "${unitj}" }, as: FrontDesk }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unitr: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${jun}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: FrontDesk, captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: FrontDesk, captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 2400 }, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${res}", equipment_item_id: "${unitr}", severity: "TOTAL_LOSS" }, as: Technician, captures: { dmg: "$.data.id" } }
            - { call: "POST /shop/damage-assessments/${dmg}/invoice", payload: {}, as: FrontDesk, captures: { st1: "$.data.status" } }
            - { call: "POST /shop/damage-assessments/${dmg}/pay", payload: {}, as: Customer, as_user_id: "${jun}", captures: { st2: "$.data.status" } }
          trigger:
            - { call: "POST /shop/season-leases/${lease}/reinstate", payload: {}, as: Manager, captures: { lst: "$.data.status" } }
          assert:
            - "After pay: ${st2} == PAID and Customer.${jun}.standing == GOOD_STANDING (no unpaid INVOICED, late_return_count 0)"
            - "${lst} == ACTIVE (reinstate legal once standing != BARRED)"

  # ============================================================== calculations
  - section: calculations
    instances:
      - name: damage_charge_nested_min_depreciation
        claim_type: correct_result
        grounds: ["calculations.damage_charge"]
        distinguishing_aspect: "Nested min: after 47 accrued rental days the depreciated value floor (58800) binds TOTAL_LOSS (58800 < 60000) but not MAJOR (30000 < 58800) — both severities computed from the same unit state."
        test_recipe:
          setup:
            - "Unit price 60000 rate 4000; R1 2026-12-01..2027-01-14 (45 days) returned on time; inspected PASS; R2 2027-02-01..2027-02-02 returned on time (accrued now 47)"
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Dep Reciate", email: "depr@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-01", end_date: "2027-01-14", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r1: "$.data.id" } }
            - { call: "POST /shop/reservations/${r1}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i1: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i1}/assign", payload: { preferred_equipment_item_id: "${unit}" }, as: FrontDesk }
            - { call: "POST /shop/reservations/${r1}/confirm", payload: { deposit_authorized_cents: 36000 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r1}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-14T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r1}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/equipment-items/${unit}/inspect", payload: { outcome: "PASS" }, as: Technician }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2027-02-01", end_date: "2027-02-02", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { r2: "$.data.id" } }
            - { call: "POST /shop/reservations/${r2}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { i2: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${i2}/assign", payload: { preferred_equipment_item_id: "${unit}" }, as: FrontDesk }
            - { call: "POST /shop/reservations/${r2}/confirm", payload: { deposit_authorized_cents: 1600 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r2}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-02-02T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${r2}/return", payload: {}, as: FrontDesk }
          trigger:
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${r2}", equipment_item_id: "${unit}", severity: "MAJOR" }, as: Technician, captures: { d1: "$.data.id", c1: "$.data.charge_cents" } }
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${r2}", equipment_item_id: "${unit}", severity: "TOTAL_LOSS" }, as: Technician, captures: { d2: "$.data.id", c2: "$.data.charge_cents" } }
          assert:
            - "EquipmentItem.${unit}.accrued_rental_days == 47 -> depreciation factor 1 - 0.02 x floor(47/30) = 0.98 -> depreciated 58800"
            - "${c1} == 30000 (min(0.50 x 60000, 58800))"
            - "${c2} == 58800 (min(1.00 x 60000, 58800) — the nested min binds)"

