          rationale: "ERR_CLARIFICATION_LIMIT_EXCEEDED on the third clarification is asserted there."

  # =========================================================================
  # Guide section 5 - Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: readiness_computed_read_returns_chapter_breakdown
        claim_type: computed_read
        grounds:
          - endpoints[GET /accreditation/units/{id}/readiness]
          - calculations.unit_readiness_score
        distinguishing_aspect: "The computed read is not stored on HospitalUnit: it returns mode ATTESTED, base_score 78.00, penalty_points_applied 0, participating_weight_pct 100.00 and a chapter_breakdown row carrying rate 0.7800 and contribution 78.00."
        test_recipe:
          setup:
            - "Chapter EC weight 100 with s1 (owned, MAPPED) and s2 (unowned); unit ICU-12 with one COMPLETED tracer scoring 39 of 50 weight."
            - "Clock 2026-08-10T09:00:00Z; no deficiency tickets."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { p1_ch: $.data.id }
            - call: "POST /accreditation/chapters/${p1_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p1_s1: $.data.id }
            - call: "POST /accreditation/chapters/${p1_ch}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p1_s2: $.data.id }
            - call: "POST /accreditation/standards/${p1_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-12", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
              captures: { p1_u: $.data.id, p1_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${p1_u}", chapter_id: "${p1_ch}", tracer_type: "PATIENT", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_unit_version: "${p1_u_v1}" }
              as: TracerSurveyor
              captures: { p1_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${p1_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${p1_t}/observations"
              payload: { standard_id: "${p1_s1}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${p1_t}/observations"
              payload: { standard_id: "${p1_s2}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${p1_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
              captures: { p1_score: $.data.tracer_score }
          trigger:
            - call: "GET /accreditation/units/${p1_u}/readiness"
              as: AccreditationDirector
              captures: { p1_uid: $.data.unit_id, p1_mode: $.data.mode, p1_base: $.data.base_score, p1_pen: $.data.penalty_points_applied, p1_weight: $.data.participating_weight_pct, p1_score2: $.data.readiness_score, p1_band: $.data.readiness_band, p1_break: $.data.chapter_breakdown }
          assert:
            - "${p1_score} == 78.00 (39 of 50 scored weight)"
            - "${p1_uid} == ${p1_u} and ${p1_mode} == ATTESTED (the default when mode is omitted)"
            - "${p1_base} == 78.00, ${p1_pen} == 0, ${p1_weight} == 100.00, ${p1_score2} == 78.00, ${p1_band} == CONDITIONAL"
            - "${p1_break} has exactly one entry: chapter_id ${p1_ch}, weight_pct 100, rate 0.7800, contribution 78.00"
            - "GET /accreditation/units/${p1_u} carries the stored ATTESTED snapshot readiness_score 78.00 and readiness_band CONDITIONAL, matching this computed read"

      - name: chapter_standards_listing_filters_by_compliance_state
        claim_type: standard_crud
        grounds:
          - endpoints[GET /accreditation/chapters/{id}/standards]
          - entities.Standard.fields.compliance_state
        distinguishing_aspect: "Filtering the chapter's standards by compliance_state MAPPED returns only the owned standard, while the unfiltered call returns both, proving the filter is applied server-side rather than by the caller."
        test_recipe:
          setup:
            - "Chapter EC with s1 (owner-1 ACTIVE, so MAPPED) and s2 (no owner, so UNMAPPED)."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { p2_ch: $.data.id }
            - call: "POST /accreditation/chapters/${p2_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p2_s1: $.data.id }
            - call: "POST /accreditation/chapters/${p2_ch}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p2_s2: $.data.id }
            - call: "POST /accreditation/standards/${p2_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
          trigger:
            - call: "GET /accreditation/chapters/${p2_ch}/standards"
              payload: { compliance_state: "MAPPED", limit: 10, offset: 0 }
              as: EvidenceValidator
              captures: { p2_first: "$.data[0].id", p2_first_state: "$.data[0].compliance_state" }
            - call: "GET /accreditation/chapters/${p2_ch}/standards"
              payload: { limit: 10, offset: 0 }
              as: EvidenceValidator
              captures: { p2_all_first: "$.data[0].standard_code" }
          assert:
            - "The filtered call returns total_count 1 with has_more false, and ${p2_first} == ${p2_s1} with ${p2_first_state} == MAPPED"
            - "The unfiltered call returns total_count 2 and ${p2_all_first} == EC.02.06.01 (creation order)"
            - "Standard ${p2_s2} appears only in the unfiltered result"

      - name: escalate_action_endpoint_applies_all_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /accreditation/survey-findings/{id}/escalate]
          - state_machines.SurveyFinding.RESPONSE_PENDING_to_CONDITION_LEVEL_ESCALATED
          - state_machines.Standard.MAPPED_to_DEFICIENT
        distinguishing_aspect: "One escalate call performs three writes at once: the finding becomes CONDITION_LEVEL_ESCALATED, its Standard becomes DEFICIENT with last_noncompliant_observed_at set to the clock, and the SurveyWindow gains follow_up_required with follow_up_due_at 60 days after the close."
        test_recipe:
          setup:
            - "Chapter LS with one DIRECT_IMPACT standard owned by owner-1 (MAPPED); unit OR-12."
            - "Survey CYCLE-2026 opened 2026-09-20 with a finding of 8 of 10 and patient_harm_observed false (WIDESPREAD + DIRECT_IMPACT so condition_level true), closed 2026-09-25 with the finding left in RESPONSE_PENDING."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "LS", name: "Life Safety", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { p3_ch: $.data.id }
            - call: "POST /accreditation/chapters/${p3_ch}/standards"
              payload: { standard_code: "LS.01.01.01", title: "Egress protection", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p3_s1: $.data.id }
            - call: "POST /accreditation/standards/${p3_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "OR-12", unit_type: "OR", bed_count: 6 }
              as: AccreditationDirector
              captures: { p3_u: $.data.id }
            - call: "POST /accreditation/survey-windows"
              payload: { cycle_label: "CYCLE-2026", prior_survey_end_date: "2025-03-15T00:00:00Z" }
              as: AccreditationDirector
              captures: { p3_sw: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${p3_sw}/transition"
              payload: { action: "ACTIVATE_COMMAND_CENTER" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${p3_sw}/transition"
              payload: { action: "OPEN_SURVEY" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${p3_sw}/findings"
              payload: { standard_id: "${p3_s1}", unit_id: "${p3_u}", observed_noncompliance_count: 8, sampled_count: 10, patient_harm_observed: false }
              as: ExternalSurveyor
              captures: { p3_f: $.data.id, p3_cond: $.data.condition_level, p3_risk: $.data.risk_level }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-25T00:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/survey-windows/${p3_sw}/transition"
              payload: { action: "CLOSE_SURVEY" }
              as: AccreditationDirector
              captures: { p3_closed: $.data.survey_closed_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T00:00:00Z" }
              as: AccreditationDirector
          trigger:
            - call: "POST /accreditation/survey-findings/${p3_f}/escalate"
              payload: { rationale: "Blocked egress across two smoke compartments" }
              as: ExternalSurveyor
              captures: { p3_f_state: $.data.state }
            - call: "GET /accreditation/standards/${p3_s1}"
              as: SafetyOfficer
              captures: { p3_s_state: $.data.compliance_state, p3_s_last: $.data.last_noncompliant_observed_at }
            - call: "GET /accreditation/survey-windows/${p3_sw}"
              as: SafetyOfficer
              captures: { p3_follow: $.data.follow_up_required, p3_due: $.data.follow_up_due_at }
          assert:
            - "${p3_cond} == true and ${p3_risk} == IMMEDIATE_THREAT before the escalate (WIDESPREAD + DIRECT_IMPACT + harm-free)"
            - "${p3_f_state} == CONDITION_LEVEL_ESCALATED (escalate is ExternalSurveyor-only per §1.5)"
            - "${p3_s_state} == DEFICIENT and ${p3_s_last} == 2026-09-28T00:00:00.000Z"
            - "${p3_closed} == 2026-09-25T00:00:00.000Z, ${p3_follow} == true and ${p3_due} == 2026-11-24T00:00:00.000Z"
            - "Chapter.${p3_ch}.deficient_standard_count == 1 and readiness_flag == ON_TRACK (1 < CHAPTER_AT_RISK_DEFICIENT_COUNT 2)"

      - name: standard_tracer_observations_cross_reference_read
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /accreditation/standards/{id}/tracer-observations]
          - entities.TracerObservation.parent
        distinguishing_aspect: "The same TracerObservation rows are reachable from two parents: the standard-scoped read returns only the single observation whose standard_id matches, while the tracer-scoped read returns both."
        test_recipe:
          setup:
            - "The 78.00 fixture: chapter EC with s1 (COMPLIANT, weight 39) and s2 (NON_COMPLIANT, weight 11) observed under one COMPLETED tracer on unit ICU-13."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { p4_ch: $.data.id }
            - call: "POST /accreditation/chapters/${p4_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p4_s1: $.data.id }
            - call: "POST /accreditation/chapters/${p4_ch}/standards"
              payload: { standard_code: "EC.02.05.01", title: "Utility systems", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { p4_s2: $.data.id }
            - call: "POST /accreditation/standards/${p4_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ICU-13", unit_type: "ICU", bed_count: 12 }
              as: AccreditationDirector
              captures: { p4_u: $.data.id, p4_u_v1: $.data.version }
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${p4_u}", chapter_id: "${p4_ch}", tracer_type: "PATIENT", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-10T12:00:00Z", expected_unit_version: "${p4_u_v1}" }
              as: TracerSurveyor
              captures: { p4_t: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: AccreditationDirector
            - call: "POST /accreditation/mock-tracers/${p4_t}/transition"
              payload: { action: "START" }
              as: TracerSurveyor
            - call: "POST /accreditation/mock-tracers/${p4_t}/observations"
              payload: { standard_id: "${p4_s1}", result: "COMPLIANT", weight: 39 }
              as: TracerSurveyor
              captures: { p4_o1: $.data.id }
            - call: "POST /accreditation/mock-tracers/${p4_t}/observations"
              payload: { standard_id: "${p4_s2}", result: "NON_COMPLIANT", weight: 11 }
              as: TracerSurveyor
              captures: { p4_o2: $.data.id }
            - call: "POST /accreditation/mock-tracers/${p4_t}/transition"
              payload: { action: "COMPLETE" }
              as: TracerSurveyor
          trigger:
            - call: "GET /accreditation/standards/${p4_s2}/tracer-observations"
              payload: { limit: 20, offset: 0 }
              as: AccreditationDirector
              captures: { p4_r_id: "$.data[0].id", p4_r_res: "$.data[0].result", p4_r_w: "$.data[0].weight", p4_r_t: "$.data[0].mock_tracer_id" }
            - call: "GET /accreditation/mock-tracers/${p4_t}/observations"
              payload: { limit: 20, offset: 0 }
              as: AccreditationDirector
              captures: { p4_t_first: "$.data[0].id" }
          assert:
            - "The standard-scoped read returns total_count 1 with ${p4_r_id} == ${p4_o2}, ${p4_r_res} == NON_COMPLIANT, ${p4_r_w} == 11 and ${p4_r_t} == ${p4_t}"
            - "The tracer-scoped read returns total_count 2 and ${p4_t_first} == ${p4_o1}"
            - "GET /accreditation/standards/${p4_s2}/tracer-observations with result COMPLIANT returns total_count 0"

      - name: clock_endpoint_returns_zero_counts_when_nothing_due
        claim_type: computed_read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The clock endpoint echoes current_utc and reports how much its own advance changed: on an empty database both expired_evidence_count and eligible_window_count are 0, so the counts describe the sweep rather than the total corpus."
        test_recipe:
          setup:
            - "Empty database at the default clock 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: AccreditationDirector
              captures: { p5_now: $.data.current_utc, p5_exp: $.data.expired_evidence_count, p5_elig: $.data.eligible_window_count }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: AccreditationDirector
              captures: { p5_now2: $.data.current_utc, p5_exp2: $.data.expired_evidence_count, p5_elig2: $.data.eligible_window_count }
          assert:
            - "${p5_now} == 2027-01-01T00:00:00.000Z, ${p5_exp} == 0 and ${p5_elig} == 0"
            - "${p5_now2} == 2027-01-01T00:00:00.000Z with ${p5_exp2} == 0 and ${p5_elig2} == 0 - re-setting the clock to the same instant is accepted and sweeps nothing"

      - name: readiness_conditional_action_projected_mode
        claim_type: conditional_action
        grounds:
          - endpoints[GET /accreditation/units/{id}/readiness]
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_readiness_attested_vs_projected_penalty_set
          rationale: "The mode=PROJECTED branch of this same endpoint, and its divergence from the default, are asserted there."

  # =========================================================================
  # Guide section 6 - Errors (every error_id triggerable)
  # =========================================================================
  - section: errors
    instances:
      - name: each_entity_family_not_found_returns_its_own_error_id
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_CHAPTER_NOT_FOUND]
          - errors[ERR_PPR_NOT_FOUND]
        distinguishing_aspect: "Priority 5 resolves eleven distinct path families: the same fabricated UUID produces a different error_id per family (never a shared ERR_NOT_FOUND), and all eleven answer HTTP 404."
        test_recipe:
          setup:
            - "Empty database; every call below uses a syntactically valid UUID that no row owns."
          setup_api_calls: []
          trigger:
            - call: "GET /accreditation/chapters/11111111-1111-4111-8111-111111111101"
              as: AccreditationDirector
              captures: { x1_a: $.data.error_id }
            - call: "GET /accreditation/standards/11111111-1111-4111-8111-111111111102"
              as: AccreditationDirector
              captures: { x1_b: $.data.error_id }
            - call: "POST /accreditation/owner-assignments/11111111-1111-4111-8111-111111111103/revoke"
              payload: { reason: "Unknown assignment" }
              as: AccreditationDirector
              captures: { x1_c: $.data.error_id }
            - call: "GET /accreditation/evidence-items/11111111-1111-4111-8111-111111111104"
              as: EvidenceValidator
              captures: { x1_d: $.data.error_id }
            - call: "GET /accreditation/units/11111111-1111-4111-8111-111111111105"
              as: AccreditationDirector
              captures: { x1_e: $.data.error_id }
            - call: "GET /accreditation/mock-tracers/11111111-1111-4111-8111-111111111106"
              as: TracerSurveyor
              captures: { x1_f: $.data.error_id }
            - call: "GET /accreditation/rounding-sessions/11111111-1111-4111-8111-111111111107"
              as: SafetyOfficer
              captures: { x1_g: $.data.error_id }
            - call: "GET /accreditation/deficiency-tickets/11111111-1111-4111-8111-111111111108"
              as: SafetyOfficer
              captures: { x1_h: $.data.error_id }
            - call: "GET /accreditation/survey-windows/11111111-1111-4111-8111-111111111109"
              as: AccreditationDirector
              captures: { x1_i: $.data.error_id }
            - call: "GET /accreditation/survey-findings/11111111-1111-4111-8111-111111111110"
              as: ExternalSurveyor
              captures: { x1_j: $.data.error_id }
            - call: "POST /accreditation/ppr-self-assessments/11111111-1111-4111-8111-111111111111/attest"
              payload: { attestation_note: "Unknown period" }
              as: AccreditationDirector
              captures: { x1_k: $.data.error_id }
          assert:
            - "${x1_a} == ERR_CHAPTER_NOT_FOUND, ${x1_b} == ERR_STANDARD_NOT_FOUND, ${x1_c} == ERR_OWNER_ASSIGNMENT_NOT_FOUND, ${x1_d} == ERR_EVIDENCE_NOT_FOUND"
            - "${x1_e} == ERR_UNIT_NOT_FOUND, ${x1_f} == ERR_TRACER_NOT_FOUND, ${x1_g} == ERR_ROUNDING_SESSION_NOT_FOUND, ${x1_h} == ERR_TICKET_NOT_FOUND"
            - "${x1_i} == ERR_SURVEY_WINDOW_NOT_FOUND, ${x1_j} == ERR_FINDING_NOT_FOUND, ${x1_k} == ERR_PPR_NOT_FOUND"
            - "All eleven responses carry HTTP 404 and an error envelope with error_id and message"

      - name: path_id_not_found_precedes_body_foreign_key_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_ROUNDING_SESSION_NOT_FOUND]
        distinguishing_aspect: "With BOTH the path session id and the body standard_id unknown, the response is ERR_ROUNDING_SESSION_NOT_FOUND (priority 5), never ERR_STANDARD_NOT_FOUND (priority 6)."
        test_recipe:
          setup:
            - "Empty database; both identifiers below are unowned UUIDs."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/rounding-sessions/22222222-2222-4222-8222-222222222201/deficiencies"
              payload: { standard_id: "22222222-2222-4222-8222-222222222202", description: "Blocked corridor", severity: "MODERATE" }
              as: SafetyOfficer
              captures: { x2_err: $.data.error_id }
          assert:
            - "${x2_err} == ERR_ROUNDING_SESSION_NOT_FOUND with HTTP 404"
            - "No DeficiencyTicket row is created (GET /accreditation/deficiency-tickets returns total_count 0)"

      - name: body_foreign_key_not_found_precedes_chapter_mapping_rule
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=44]
          - errors[ERR_CHAPTER_NOT_FOUND]
        distinguishing_aspect: "An unknown chapter_id on tracer scheduling returns ERR_CHAPTER_NOT_FOUND at priority 6; the mapped-standard rule at priority 44 is never reached because it needs an existing chapter to inspect."
        test_recipe:
          setup:
            - "Unit MED-13 exists and is OPEN; no chapter matches the body chapter_id."
          setup_api_calls:
            - call: "POST /accreditation/units"
              payload: { name: "MED-13", unit_type: "MED_SURG", bed_count: 20 }
              as: AccreditationDirector
              captures: { x3_u: $.data.id, x3_u_v1: $.data.version }
          trigger:
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${x3_u}", chapter_id: "33333333-3333-4333-8333-333333333301", tracer_type: "SYSTEM", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-20T10:00:00Z", expected_unit_version: "${x3_u_v1}" }
              as: TracerSurveyor
              captures: { x3_err: $.data.error_id }
          assert:
            - "${x3_err} == ERR_CHAPTER_NOT_FOUND with HTTP 404, not ERR_CHAPTER_NOT_MAPPED (422)"
            - "HospitalUnit.${x3_u}.version == ${x3_u_v1} and scheduled_tracer_count == 0"

  # =========================================================================
  # Guide section 7 - RBAC (role_model: segregation_of_duties)
  # =========================================================================
  - section: rbac
    instances:
      - name: chapter_create_missing_x_user_id_header_returns_unauthenticated
        claim_type: unauthenticated
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 requires BOTH headers: a request carrying a valid X-User-Role but no X-User-ID is ERR_UNAUTHENTICATED (401), not ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "Empty database. The trigger request is sent WITHOUT the X-User-ID header (X-User-Role: AccreditationDirector is present)."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { r1_err: $.data.error_id, r1_msg: $.data.message }
          assert:
            - "${r1_err} == ERR_UNAUTHENTICATED with HTTP 401 and ${r1_msg} is a non-empty string"
            - "A request whose X-User-Role is not one of the seven declared roles returns the same ERR_UNAUTHENTICATED, because priority 1 also rejects undeclared roles"
            - "No Chapter row is created"

      - name: standard_owner_cannot_create_chapter_returns_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles[AccreditationDirector].exclusive_operations
        distinguishing_aspect: "Chapter creation is an AccreditationDirector exclusive operation: an authenticated StandardOwner gets ERR_UNAUTHORIZED (403), which is distinct from the 401 of a missing header."
        test_recipe:
          setup:
            - "Empty database; the caller is authenticated as StandardOwner with X-User-ID owner-1."
          setup_api_calls: []
          trigger:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r2_err: $.data.error_id }
          assert:
            - "${r2_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "No Chapter row is created, so the same code by an AccreditationDirector afterwards is not a duplicate"

      - name: safety_officer_cannot_schedule_tracer_returns_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=2]
          - endpoints[POST /accreditation/mock-tracers].roles
        distinguishing_aspect: "Tracer scheduling is limited to TracerSurveyor and AccreditationDirector, so a SafetyOfficer - who may create rounding sessions on the same unit - is refused with ERR_UNAUTHORIZED even though the payload is entirely valid."
        test_recipe:
          setup:
            - "Chapter EC with one owned standard (MAPPED) and unit ED-13 with posture OPEN."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { r3_ch: $.data.id }
            - call: "POST /accreditation/chapters/${r3_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { r3_s1: $.data.id }
            - call: "POST /accreditation/standards/${r3_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/units"
              payload: { name: "ED-13", unit_type: "ED", bed_count: 18 }
              as: AccreditationDirector
              captures: { r3_u: $.data.id, r3_u_v1: $.data.version }
          trigger:
            - call: "POST /accreditation/mock-tracers"
              payload: { unit_id: "${r3_u}", chapter_id: "${r3_ch}", tracer_type: "SYSTEM", window_start: "2026-08-20T08:00:00Z", window_end: "2026-08-20T10:00:00Z", expected_unit_version: "${r3_u_v1}" }
              as: SafetyOfficer
              as_user_id: "safety-1"
              captures: { r3_err: $.data.error_id }
          assert:
            - "${r3_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "HospitalUnit.${r3_u}.scheduled_tracer_count == 0 and version == ${r3_u_v1}"
            - "The identical payload as TracerSurveyor succeeds, so only the role differed"

      - name: evidence_validator_cannot_submit_evidence_action_gating
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=2]
          - endpoints[POST /accreditation/evidence-items/{id}/transition]
        distinguishing_aspect: "The transition endpoint lists both StandardOwner and EvidenceValidator in roles, but SUBMIT is StandardOwner-only: an EvidenceValidator calling SUBMIT gets ERR_UNAUTHORIZED, so authorisation is per-action rather than per-endpoint."
        test_recipe:
          setup:
            - "Chapter IC with one MAPPED standard owned by owner-1 and one DRAFT evidence item."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { r4_ch: $.data.id }
            - call: "POST /accreditation/chapters/${r4_ch}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { r4_s1: $.data.id }
            - call: "POST /accreditation/standards/${r4_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${r4_s1}/evidence-items"
              payload: { title: "Hand hygiene audit", doc_type: "AUDIT_RESULT", effective_date: "2026-07-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r4_e: $.data.id, r4_e_state: $.data.validation_state }
          trigger:
            - call: "POST /accreditation/evidence-items/${r4_e}/transition"
              payload: { action: "SUBMIT" }
              as: EvidenceValidator
              as_user_id: "val-1"
              captures: { r4_err: $.data.error_id }
          assert:
            - "${r4_e_state} == DRAFT and expires_at == null (the optional field was omitted)"
            - "${r4_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "EvidenceItem.${r4_e}.validation_state == DRAFT and submitted_by_user_id == null"

      - name: standard_owner_cannot_validate_evidence_action_gating
        claim_type: unauthorized_operation
        grounds:
          - validations[priority=2]
          - validations[priority=40]
        distinguishing_aspect: "VALIDATE is EvidenceValidator-only, so a StandardOwner attempting it is stopped at priority 2 with ERR_UNAUTHORIZED and never reaches the segregation-of-duties rule at priority 40 that would also have rejected them."
        test_recipe:
          setup:
            - "Chapter IC with one MAPPED standard owned by owner-1 and one SUBMITTED evidence item."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { r5_ch: $.data.id }
            - call: "POST /accreditation/chapters/${r5_ch}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { r5_s1: $.data.id }
            - call: "POST /accreditation/standards/${r5_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${r5_s1}/evidence-items"
              payload: { title: "Hand hygiene audit", doc_type: "AUDIT_RESULT", effective_date: "2026-07-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r5_e: $.data.id }
            - call: "POST /accreditation/evidence-items/${r5_e}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r5_e_state: $.data.validation_state }
          trigger:
            - call: "POST /accreditation/evidence-items/${r5_e}/transition"
              payload: { action: "VALIDATE", review_note: "Self-approval attempt" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r5_err: $.data.error_id }
          assert:
            - "${r5_e_state} == SUBMITTED after the owner's own SUBMIT (the allowed half of the shared endpoint)"
            - "${r5_err} == ERR_UNAUTHORIZED with HTTP 403, not ERR_SEGREGATION_OF_DUTIES"
            - "EvidenceItem.${r5_e}.validation_state == SUBMITTED and reviewed_by_user_id == null"

      - name: segregation_of_duties_validator_owning_the_standard_rejected
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=40]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles[EvidenceValidator]
        distinguishing_aspect: "Holding the EvidenceValidator role is not sufficient: when the caller's X-User-ID is also an ACTIVE owner_user_id on that standard, VALIDATE returns ERR_SEGREGATION_OF_DUTIES (403); a different validator id succeeds on the identical item."
        test_recipe:
          setup:
            - "Chapter IC with one standard owned by owner-1 (ACTIVE PRIMARY) and one SUBMITTED evidence item with no expiry."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "IC", name: "Infection Control", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { r6_ch: $.data.id }
            - call: "POST /accreditation/chapters/${r6_ch}/standards"
              payload: { standard_code: "IC.01.01.01", title: "Hand hygiene program", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { r6_s1: $.data.id }
            - call: "POST /accreditation/standards/${r6_s1}/owner-assignments"
              payload: { owner_user_id: "owner-1", designation: "PRIMARY" }
              as: AccreditationDirector
            - call: "POST /accreditation/standards/${r6_s1}/evidence-items"
              payload: { title: "Hand hygiene audit", doc_type: "AUDIT_RESULT", effective_date: "2026-07-01T00:00:00Z" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r6_e: $.data.id }
            - call: "POST /accreditation/evidence-items/${r6_e}/transition"
              payload: { action: "SUBMIT" }
              as: StandardOwner
              as_user_id: "owner-1"
              captures: { r6_e_state: $.data.validation_state }
          trigger:
            - call: "POST /accreditation/evidence-items/${r6_e}/transition"
              payload: { action: "VALIDATE", review_note: "Reviewing my own evidence" }
              as: EvidenceValidator
              as_user_id: "owner-1"
              captures: { r6_err: $.data.error_id }
            - call: "POST /accreditation/evidence-items/${r6_e}/transition"
              payload: { action: "VALIDATE", review_note: "Independent review" }
              as: EvidenceValidator
              as_user_id: "val-1"
              captures: { r6_e_state2: $.data.validation_state, r6_by: $.data.reviewed_by_user_id }
          assert:
            - "${r6_e_state} == SUBMITTED before the trigger"
            - "${r6_err} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 - the role was right, the identity was not"
            - "${r6_e_state2} == VALIDATED and ${r6_by} == val-1"
            - "Standard.${r6_s1}.validated_evidence_count == 1 and compliance_state == EVIDENCE_COMPLETE (evidence_min_count 1 met)"

      - name: unit_manager_cannot_transition_another_units_ticket
        claim_type: entity_backed_scope
        grounds:
          - validations[priority=7]
          - errors[ERR_UNIT_SCOPE_VIOLATION]
          - roles[UnitManager].identity
        distinguishing_aspect: "UnitManager identity is entity_backed:HospitalUnit, so START_WORK on a ticket belonging to a different unit returns ERR_UNIT_SCOPE_VIOLATION (403) even though START_WORK is one of the role's shared operations."
        test_recipe:
          setup:
            - "Chapter EC with one standard; units ICU-14 and MED-14; one OPEN MODERATE ticket raised on ICU-14's rounding session."
          setup_api_calls:
            - call: "POST /accreditation/chapters"
              payload: { code: "EC", name: "Environment of Care", weight_pct: 100, evidence_min_count: 1 }
              as: AccreditationDirector
              captures: { r7_ch: $.data.id }
            - call: "POST /accreditation/chapters/${r7_ch}/standards"
              payload: { standard_code: "EC.02.06.01", title: "Safe environment", risk_tier: "DIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { r7_s1: $.data.id }
            - call: "POST /accreditation/units"
              payload: { name: "ICU-14", unit_type: "ICU", bed_count: 12 }
