# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Child Support Disbursement (State SDU) — EXPERT band
# Nine §0.5 rules, >= 2 instances each (>= 18 total).
# All monetary values in cents. Clock-dependent setups use POST /sdu/_clock/set.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: distribution_split_family_first_vs_state_first
        grounds:
          - calculations.distribution_split
          - entities.Disbursement.fields.family_amount_cents
          - entities.Disbursement.fields.state_retained_cents
          - entities.CustodialParty.fields.assistance_status
        distinguishing_aspect: |
          Identical allocation slice (cs=20000, interest=0, principal=10000) yields family_amount_cents=30000 / state_retained_cents=0 under FAMILY_FIRST (NEVER_ASSISTED payee) but family_amount_cents=22000 / state_retained_cents=8000 under STATE_FIRST (CURRENTLY_ASSISTED payee, assigned_arrears_cents=8000) — divergence on the Disbursement entity domain.
        test_recipe:
          setup:
            - "Order O_ff: payee CP_ff is NEVER_ASSISTED (FAMILY_FIRST), current_support_cents=20000; activated; one post-charge rolled 20000 into PRINCIPAL; remittance of 30000 allocated → Allocation slice cs=20000/interest=0/principal=10000."
            - "Order O_sf: payee CP_sf is CURRENTLY_ASSISTED (STATE_FIRST), assigned_arrears_cents=8000, current_support_cents=20000; same activation+charge+remittance → identical Allocation slice."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP FF", state_code: "CA", assistance_status: "NEVER_ASSISTED" }
              as: CaseWorker
              captures: { cp_ff_id: "$.data.id"}
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP SF", state_code: "CA", assistance_status: "CURRENTLY_ASSISTED" }
              as: CaseWorker
              captures: { cp_sf_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP FF", ssn_last4: "1111" }
              as: CaseWorker
              captures: { ncp_ff_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP SF", ssn_last4: "2222" }
              as: CaseWorker
              captures: { ncp_sf_id: "$.data.id"}
            - call: "POST /sdu/employers"
              payload: { legal_name: "Acme", fein: "11-1111111" }
              as: CaseWorker
              captures: { emp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_ff_id}", noncustodial_party_id: "${ncp_ff_id}", current_support_cents: 20000 }
              as: CaseWorker
              captures: { o_ff_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_sf_id}", noncustodial_party_id: "${ncp_sf_id}", current_support_cents: 20000, assigned_arrears_cents: 8000 }
              as: CaseWorker
              captures: { o_sf_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${o_ff_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_sf_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_ff_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_sf_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_ff_id}", disposable_earnings_cents: 100000, gross_remitted_cents: 30000 }
              as: FinanceOfficer
              captures: { rem_ff_id: "$.data.id"}
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_sf_id}", disposable_earnings_cents: 100000, gross_remitted_cents: 30000 }
              as: FinanceOfficer
              captures: { rem_sf_id: "$.data.id"}
            - call: "POST /sdu/remittances/${rem_ff_id}/allocate"
              payload: {}
              as: FinanceOfficer
            - call: "POST /sdu/remittances/${rem_sf_id}/allocate"
              payload: {}
              as: FinanceOfficer
            - call: "GET /sdu/allocations?remittance_id=${rem_ff_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_ff_id: "$.data[0].id"}
            - call: "GET /sdu/allocations?remittance_id=${rem_sf_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_sf_id: "$.data[0].id"}
          trigger:
            - call: "POST /sdu/disbursements"
              payload: { support_order_id: "${o_ff_id}", custodial_party_id: "${cp_ff_id}", allocation_id: "${alloc_ff_id}" }
              as: FinanceOfficer
              captures: { disb_ff_id: "$.data.id"}
            - call: "POST /sdu/disbursements"
              payload: { support_order_id: "${o_sf_id}", custodial_party_id: "${cp_sf_id}", allocation_id: "${alloc_sf_id}" }
              as: FinanceOfficer
              captures: { disb_sf_id: "$.data.id"}
          assert:
            - "Disbursement.${disb_ff_id}.family_amount_cents == 30000"
            - "Disbursement.${disb_ff_id}.state_retained_cents == 0"
            - "Disbursement.${disb_sf_id}.family_amount_cents == 22000"
            - "Disbursement.${disb_sf_id}.state_retained_cents == 8000"

      - name: multi_order_allocation_shortfall_vs_surplus
        grounds:
          - calculations.multi_order_allocation
          - entities.Allocation.fields.current_support_applied_cents
          - entities.Allocation.fields.principal_applied_cents
          - state_machines.Remittance.RECEIVED_to_ALLOCATED
        distinguishing_aspect: |
          The same allocation algorithm on the Remittance/Allocation domain produces a pure current-support proration when distributable (50000) <= total current support (90000), but cascades surplus into arrears when distributable (130000) > total current support (50000) — two structurally different outputs from one engine, distinct from the Disbursement-domain dual variant.
        test_recipe:
          setup:
            - "Shortfall: NCP_s with 3 orders cs 50000/30000/10000 (total 90000), remittance distributable 50000 → only current support, prorated; order A gets 27777, principal untouched."
            - "Surplus: separate NCP_p with 1 order cs 50000, arrears principal 50000 built via one post-charge rollover (no interest), remittance distributable 130000 → current support 50000 then principal 50000 (overpay 30000)."
          setup_api_calls:
            - call: "POST /sdu/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FinanceOfficer
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP M", state_code: "CA", assistance_status: "NEVER_ASSISTED" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP short", ssn_last4: "3333" }
              as: CaseWorker
              captures: { ncp_s_id: "$.data.id"}
            - call: "POST /sdu/employers"
              payload: { legal_name: "EmpM", fein: "22-2222222" }
              as: CaseWorker
              captures: { emp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_s_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { oa_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_s_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { ob_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_s_id}", current_support_cents: 10000 }
              as: CaseWorker
              captures: { oc_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${oa_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${ob_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${oc_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_s_id}", disposable_earnings_cents: 200000, gross_remitted_cents: 50000 }
              as: FinanceOfficer
              captures: { rem_s_id: "$.data.id"}
            - call: "POST /sdu/remittances/${rem_s_id}/allocate"
              payload: {}
              as: FinanceOfficer
            # --- surplus branch: separate single-order obligor with built arrears ---
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP surplus", ssn_last4: "3434" }
              as: CaseWorker
              captures: { ncp_p_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_p_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { op_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${op_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${op_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_p_id}", disposable_earnings_cents: 300000, gross_remitted_cents: 130000 }
              as: FinanceOfficer
              captures: { rem_p_id: "$.data.id"}
            - call: "POST /sdu/remittances/${rem_p_id}/allocate"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "GET /sdu/allocations?remittance_id=${rem_s_id}&support_order_id=${oa_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_a_id: "$.data[0].id"}
            - call: "GET /sdu/allocations?remittance_id=${rem_p_id}&support_order_id=${op_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_p_id: "$.data[0].id"}
          assert:
            - "Allocation.${alloc_a_id}.current_support_applied_cents == 27777"
            - "Allocation.${alloc_a_id}.principal_applied_cents == 0"
            - "Allocation.${alloc_a_id}.interest_applied_cents == 0"
            - "Allocation.${alloc_p_id}.current_support_applied_cents == 50000"
            - "Allocation.${alloc_p_id}.principal_applied_cents == 50000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ccpa_cap_tier_selection_nonlinear
        grounds:
          - calculations.ccpa_withholding_cap
          - entities.Remittance.fields.ccpa_cap_cents
          - entities.Remittance.fields.distributable_cents
          - entities.NoncustodialParty.fields.supports_second_family
        distinguishing_aspect: |
          Mode (a): ccpa_cap_cents is a nested-conditional selection over >=3 inputs (supports_second_family, arrears_weeks_overdue vs 12, disposable_earnings_cents) feeding distributable = min(gross, cap) — non-linear branch+min interaction, not a tiered single-metric rate.
        test_recipe:
          setup:
            - "NCP supports_second_family=true with arrears >= 12 weeks → cap tier 0.55; disposable 200000, gross 120000 → cap 110000, distributable 110000 (cap binds)."
          setup_api_calls:
            - call: "POST /sdu/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: FinanceOfficer
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP C", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP 2fam", ssn_last4: "4444", supports_second_family: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id"}
            - call: "POST /sdu/employers"
              payload: { legal_name: "EmpC", fein: "33-3333333" }
              as: CaseWorker
              captures: { emp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 10000 }
              as: CaseWorker
              captures: { o_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/_clock/set"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FinanceOfficer
            - call: "POST /sdu/support-orders/${o_id}/accrue-interest"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_id}", disposable_earnings_cents: 200000, gross_remitted_cents: 120000 }
              as: FinanceOfficer
              captures: { rem_id: "$.data.id"}
          assert:
            - "Remittance.${rem_id}.ccpa_cap_cents == 110000"
            - "Remittance.${rem_id}.distributable_cents == 110000"

      - name: allocation_rounding_remainder_order_pinned
        grounds:
          - calculations.multi_order_allocation
          - entities.Allocation.fields.current_support_applied_cents
        distinguishing_aspect: |
          Mode (b): round-per-order-then-assign-remainder is pinned; with cs 50000/30000/10000 and distributable 50000 the per-order HALF_UP rounds sum to 50001 (overshoot of 1 cent), and the -1 remainder is deterministically assigned to the greatest-current-support order (A → 27777, not 27778) — a different combinatorial axis (rounding order) than the CCPA min/branch instance.
        test_recipe:
          setup:
            - "Reuse a 3-order obligor cs 50000/30000/10000, distributable 50000; created_at order A<B<C; remainder lands on A."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP R", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP R", ssn_last4: "5555" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id"}
            - call: "POST /sdu/employers"
              payload: { legal_name: "EmpR", fein: "44-4444444" }
              as: CaseWorker
              captures: { emp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { oa_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 30000 }
              as: CaseWorker
              captures: { ob_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 10000 }
              as: CaseWorker
              captures: { oc_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${oa_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${ob_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${oc_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/remittances"
              payload: { employer_id: "${emp_id}", noncustodial_party_id: "${ncp_id}", disposable_earnings_cents: 200000, gross_remitted_cents: 50000 }
              as: FinanceOfficer
              captures: { rem_id: "$.data.id"}
            - call: "POST /sdu/remittances/${rem_id}/allocate"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "GET /sdu/allocations?remittance_id=${rem_id}&support_order_id=${oa_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_a_id: "$.data[0].id"}
            - call: "GET /sdu/allocations?remittance_id=${rem_id}&support_order_id=${ob_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_b_id: "$.data[0].id"}
            - call: "GET /sdu/allocations?remittance_id=${rem_id}&support_order_id=${oc_id}"
              payload: {}
              as: FinanceOfficer
              captures: { alloc_c_id: "$.data[0].id"}
          assert:
            - "Allocation.${alloc_a_id}.current_support_applied_cents == 27777"
            - "Allocation.${alloc_b_id}.current_support_applied_cents == 16667"
            - "Allocation.${alloc_c_id}.current_support_applied_cents == 5556"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: modification_cyclic_rejected_back_to_draft
        grounds:
          - state_machines.Modification.SUBMITTED_to_REJECTED
          - state_machines.Modification.REJECTED_to_DRAFT
          - state_machines.Modification.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Modification is cyclic: SUBMITTED → REJECTED → DRAFT → SUBMITTED returns the same row to a prior state, distinct entity from the parallel-dimension SupportOrder instance.
        test_recipe:
          setup:
            - "An ACTIVE order with a DRAFT modification submitted then rejected by Supervisor."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP", ssn_last4: "6666" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 40000 }
              as: CaseWorker
              captures: { o_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications"
              payload: { support_order_id: "${o_id}", proposed_current_support_cents: 45000, coverage_start_at: "2026-07-01T00:00:00Z", coverage_end_at: "2026-12-31T00:00:00Z" }
              as: CaseWorker
              captures: { mod_id: "$.data.id"}
            - call: "POST /sdu/modifications/${mod_id}/submit"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications/${mod_id}/decide"
              payload: { decision: "REJECT" }
              as: Supervisor
          trigger:
            - call: "POST /sdu/modifications/${mod_id}/revise"
              payload: {}
              as: CaseWorker
              captures: { mod_status: "$.data.status"}
            - call: "POST /sdu/modifications/${mod_id}/submit"
              payload: {}
              as: CaseWorker
          assert:
            - "Modification.${mod_id}.status == SUBMITTED"

      - name: support_order_parallel_obligation_and_enforcement
        grounds:
          - state_machines.SupportOrder.obligation_status.ACTIVE_to_SUSPENDED
          - state_machines.SupportOrder.enforcement_status.NONE_to_INTERCEPT_PENDING
          - entities.SupportOrder.fields.obligation_status
          - entities.SupportOrder.fields.enforcement_status
        distinguishing_aspect: |
          SupportOrder carries two independent state axes: enforcement_status advances NONE→INTERCEPT_PENDING (via enforcement propose) while obligation_status independently moves ACTIVE→SUSPENDED — the two dimensions evolve on the same row without coupling, distinct from the Modification cycle.
        test_recipe:
          setup:
            - "An ACTIVE order with arrears principal 50000 (>= enforcement threshold) and enforcement proposed → INTERCEPT_PENDING; then suspended."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP P", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP P", ssn_last4: "7777" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 50000 }
              as: CaseWorker
              captures: { o_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/support-orders/${o_id}/post-charge"
              payload: {}
              as: CaseWorker
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { o_ver: "$.data.version"}
            - call: "POST /sdu/enforcement-actions"
              payload: { support_order_id: "${o_id}", action_type: "TAX_INTERCEPT", expected_support_order_version: "${o_ver}" }
              as: CaseWorker
          trigger:
            - call: "POST /sdu/support-orders/${o_id}/suspend"
              payload: {}
              as: CaseWorker
              captures: { obl: "$.data.obligation_status", enf: "$.data.enforcement_status"}
          assert:
            - "SupportOrder.${o_id}.obligation_status == SUSPENDED"
            - "SupportOrder.${o_id}.enforcement_status == INTERCEPT_PENDING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: modification_apply_cascade_depth3
        grounds:
          - state_machines.Modification.APPROVED_to_APPLIED
          - state_machines.SupportOrder.obligation_status.ACTIVE_to_MODIFIED
          - entities.NoncustodialParty.fields.total_current_support_cents
        distinguishing_aspect: |
          Depth-3 chain: apply Modification (A) → SupportOrder.current_support_cents updated and ACTIVE→MODIFIED (B, caused by A) → NoncustodialParty.total_current_support_cents recomputed (C, caused by B's amount change) — each link caused by the prior, triggered by modification apply.
        test_recipe:
          setup:
            - "ACTIVE order cs=40000, NCP.total_current_support_cents=40000; modification proposing 60000 submitted and approved."
          setup_api_calls:
            - call: "POST /sdu/custodial-parties"
              payload: { full_name: "CP A", state_code: "CA" }
              as: CaseWorker
              captures: { cp_id: "$.data.id"}
            - call: "POST /sdu/noncustodial-parties"
              payload: { full_name: "NCP A", ssn_last4: "8888" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id"}
            - call: "POST /sdu/support-orders"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", current_support_cents: 40000 }
              as: CaseWorker
              captures: { o_id: "$.data.id"}
            - call: "POST /sdu/support-orders/${o_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications"
              payload: { support_order_id: "${o_id}", proposed_current_support_cents: 60000, coverage_start_at: "2026-07-01T00:00:00Z", coverage_end_at: "2026-12-31T00:00:00Z" }
              as: CaseWorker
              captures: { mod_id: "$.data.id"}
            - call: "POST /sdu/modifications/${mod_id}/submit"
              payload: {}
              as: CaseWorker
            - call: "POST /sdu/modifications/${mod_id}/decide"
              payload: { decision: "APPROVE" }
              as: Supervisor
            - call: "GET /sdu/support-orders/${o_id}"
              payload: {}
              as: CaseWorker
              captures: { o_ver: "$.data.version"}
          trigger:
            - call: "POST /sdu/modifications/${mod_id}/apply"
              payload: { expected_support_order_version: "${o_ver}" }
              as: CaseWorker
          assert:
