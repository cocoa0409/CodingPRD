              as: SponsorOperator
              captures: { sc_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Selectrix Placement", crd_number: "CRD-270001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100 }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Gil Sandoval", email: "gil.sandoval@example.com", state_code: "TX", net_worth_cents: 5000000000, annual_income_cents: 1000000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-GIL-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 30000000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "POST /repurchase-periods"
              payload: { offering_id: "${off_id}", period_month: "2026-08", opens_at: "2026-08-01T00:00:00Z", request_cutoff_at: "2026-08-26T00:00:00Z", settlement_date: "2026-08-30" }
              as: TransferAgent
              captures: { rp_id: $.data.id }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 1000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /repurchase-requests"
              payload: { repurchase_period_id: "${rp_id}", share_class_id: "${sc_id}", shares_requested_e4: 1000000 }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { req_b_id: $.data.id }
            - call: "POST /repurchase-requests/${req_a_id}/status"
              payload: { to_status: "WITHDRAWN" }
              as: InvestorUser
              as_user_id: "${inv_id}"
              captures: { req_a_withdrawn: $.data.status }
          trigger:
            - call: "POST /offerings/${off_id}/repurchase-plan"
              payload: { action: "SUSPEND", reason: "board review of liquidity" }
              as: ComplianceOfficer
              captures: { plan_suspended: $.data.repurchase_plan_status, suspension_reason: $.data.repurchase_plan_suspension_reason }
            - call: "GET /repurchase-requests/${req_a_id}"
              as: TransferAgent
