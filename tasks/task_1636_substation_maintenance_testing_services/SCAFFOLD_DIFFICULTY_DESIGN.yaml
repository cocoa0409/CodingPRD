            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { outage_window_id: "${ow_id}", expected_outage_window_version: "${ow_v}" }
              as: OutageCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T10:00:00Z" }
