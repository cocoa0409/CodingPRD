            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_id}", scope: "PRIVILEGE", action_type: "SUSPENSION", effective_on: "2026-08-01" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { da_id: "$.data.id" } }
