  - rule_id: transitive_cascade
    instances:

      - name: release_to_ancestor_posture_freeze_chain
        grounds:
          - state_machines.Assignment.CONFIRMED_to_RELEASED
          - state_machines.DemandOpportunity.staffing_status.COVERED_to_INTERNAL_STAFFING
          - calculations.consultant_availability
          - calculations.practice_posture_rollup
          - calculations.opportunity_coverage
          - entities.Consultant.fields.allocated_pct
          - entities.Consultant.fields.availability_status
          - entities.PracticeGroup.fields.bench_headcount
          - entities.PracticeGroup.fields.own_bench_ratio
          - entities.PracticeGroup.fields.rollup_bench_ratio
          - entities.PracticeGroup.fields.posture
          - endpoints[POST /assignments/{id}/release]
        distinguishing_aspect: |
          Depth-6 chain from ONE release call: allocated_pct -> availability_status -> a new
          BenchSpell row -> the child group's bench_headcount -> the child and parent
          rollup_bench_ratio -> the parent group's posture, where every hop exists only
          because the previous hop happened and the last hop lands on a group the released
          consultant does not even belong to.
        test_recipe:
          setup:
            - "Clock at 2026-08-03. Parent group 'Cloud Global' (NA, zero consultants) and child group 'Cloud NA' (NA, parent_group_id = the parent)."
            - "One CONSULTANT-level consultant in the CHILD group with an ACTIVE proficiency-4 assertion; cost 120.00."
            - "One QUALIFIED, INTERNAL demand for exactly 1.00 FTE, standard 250.00 / requested 240.00."
            - "One CONFIRMED BILLABLE assignment at 100.00% over [2026-08-03, 2026-08-29), so allocated_pct is 100.00, availability_status is ASSIGNED, BenchSpell #1 is CLOSED, both groups sit at rollup_bench_ratio 0.0000 and posture OPEN, and the demand is COVERED."
            - "Clock advanced to 2026-08-10, still inside the assignment interval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud Global", geography_code: "NA" }
              as: PracticePartner
              captures: { pgp_id: $.data.id }
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA", parent_group_id: "${pgp_id}" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
