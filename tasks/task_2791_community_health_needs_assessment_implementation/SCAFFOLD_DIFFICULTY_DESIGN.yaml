              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 4 }, attendee_count: 10 }
