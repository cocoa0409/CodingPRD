scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.ClientAccount", "endpoints"]
        distinguishing_aspect: "POST /clients with required fields returns 201; status defaults ACTIVE, outstanding_balance_cents defaults 0, credit_limit_cents defaults 5000000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          assert:
            - "ClientAccount.${cid}.status == ACTIVE"
            - "ClientAccount.${cid}.outstanding_balance_cents == 0"
            - "ClientAccount.${cid}.credit_limit_cents == 5000000"
            - "ClientAccount.${cid}.version == 1"
      - name: get_interpreter_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Interpreter", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /interpreters/{id} with a random non-existent UUID returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /interpretation/interpreters/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_RESOURCE_NOT_FOUND with HTTP 404."
      - name: create_request_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.InterpretationRequest", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /requests missing required_tier returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A client and a language pair exist."]
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
          trigger:
            - call: "POST /interpretation/requests"
              payload: { client_id: "${cid}", language_pair_id: "${lp_id}", modality: "PHONE", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (required_tier missing)."
      - name: scheduled_request_invalid_window_returns_invalid_window
        claim_type: Type Constraints
        grounds: ["entities.InterpretationRequest.fields.window_end", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "A SCHEDULED request whose window_end is not strictly after window_start returns ERR_INVALID_WINDOW (400)."
        test_recipe:
          setup: ["Client and language pair exist; clock at 08:00."]
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "County Court", org_type: "COURT", contact_email: "court@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /interpretation/requests"
              payload: { client_id: "${cid}", language_pair_id: "${lp_id}", modality: "VIDEO", required_tier: "COURT", scheduling_mode: "SCHEDULED", window_start: "2026-03-10T12:00:00Z", window_end: "2026-03-10T11:00:00Z" }
              as: ClientAccount
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_WINDOW."
      - name: rate_plan_surcharge_on_phone_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.RatePlan.fields.travel_surcharge_cents", "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /rate-plans with travel_surcharge_cents > 0 on a PHONE modality returns ERR_INVALID_REQUEST (surcharge allowed only for ONSITE)."
        test_recipe:
          setup: ["A client exists."]
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${cid}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, travel_surcharge_cents: 500 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST."
      - name: computed_outstanding_balance_after_issue
        claim_type: Computed Fields
        grounds: ["entities.ClientAccount.fields.outstanding_balance_cents", "calculations.session_billing"]
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_issue_settle_balance_conserved
          rationale: "The issue-driven outstanding_balance_cents computation is asserted as a setup step and conservation outcome of the named §1.8 instance."

  # =================================================================
  - section: state_machines
    instances:
      - name: accept_already_accepted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Assignment.OFFERED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-accepting an already-ACCEPTED assignment returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An accepted assignment for an ON_DEMAND med-phone request."]
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${hosp_id}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Med I" }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "MEDICAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
            - call: "POST /interpretation/assignments/${asg_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
          trigger:
            - call: "POST /interpretation/assignments/${asg_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (assignment already ACCEPTED)."
      - name: decline_offered_assignment_bubbles_request_to_open
        claim_type: Valid Transition
        grounds: ["state_machines.Assignment.OFFERED_to_DECLINED", "state_machines.InterpretationRequest.ASSIGNED_to_OPEN"]
        distinguishing_aspect: "Declining an OFFERED assignment sets lifecycle DECLINED and bubbles the request ASSIGNED->OPEN so it is re-dispatchable."
        test_recipe:
          setup: ["A dispatched (OFFERED) assignment exists for an ON_DEMAND request."]
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${hosp_id}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Med I" }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "MEDICAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /interpretation/assignments/${asg_id}/decline"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
          assert:
            - "Assignment.${asg_id}.lifecycle_status == DECLINED"
            - "InterpretationRequest.${req_id}.status == OPEN"
      - name: offer_expires_after_ttl_then_observed_expired
        claim_type: Invalid Transitions
        grounds: ["state_machines.Assignment.OFFERED_to_EXPIRED", "validations[priority=9]", "errors[ERR_OFFER_EXPIRED]"]
        distinguishing_aspect: "Accepting an offer after the clock passes offered_at + OFFER_TTL_SECONDS returns ERR_OFFER_EXPIRED."
