              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NEXUS_NOT_REGISTERED"

      - name: transaction_void_blocked_when_swept_into_return
        grounds:
          - state_machines.Transaction.SETTLED_to_VOIDED
          - validations[priority=13]
          - entities.Transaction.fields.tax_return_id
          - errors[ERR_TRANSACTION_LOCKED]
        distinguishing_aspect: |
          A DIFFERENT entity pair Transaction -> TaxReturn: a SETTLED transaction whose tax_return_id was set
