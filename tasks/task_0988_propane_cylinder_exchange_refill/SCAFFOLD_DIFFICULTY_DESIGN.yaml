            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { post_full: $.data.full_on_hand, post_empty: $.data.empty_on_hand, post_q: $.data.quarantined_on_hand }
          assert:
            - "before: full_on_hand == 8, empty_on_hand == 3, quarantined_on_hand == 0 (population 11)"
            - "after complete: full_on_hand == 7, empty_on_hand == 4, quarantined_on_hand == 0 (population 11)"
            - "invariant: pre_full + pre_empty + pre_q == post_full + post_empty + post_q (11 == 11)"

      - name: complete_then_refund_conserves_expected_cash
        grounds:
          - state_machines.ExchangeOrder.DRAFT_to_COMPLETED
          - state_machines.ExchangeOrder.COMPLETED_to_REFUNDED
          - calculations.reconciliation_expected_cash
        distinguishing_aspect: |
          Conserved quantity = the OPEN reconciliation session's
          expected_cash_cents (a different conserved quantity than cylinder
          population): complete adds total_cents and refund subtracts the same
          total_cents, returning expected_cash exactly to its session-creation
          snapshot — formula: expected_after(complete;refund) ==
          expected_before.
        test_recipe:
          setup:
            - "Site S with active policy, 1 FULL fleet cylinder, 1 EMPTY customer cylinder; OPEN reconciliation session for 2026-05-01 created BEFORE any sale (expected_cash snapshot 20000)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cash Inv Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FJ-901", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CJ-901", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc_id: $.data.id }
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id, e0: $.data.expected_cash_cents }
          trigger:
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "GET /reconciliation-sessions/${rs_id}"
              as: PlatformAdmin
              captures: { e_mid: $.data.expected_cash_cents }
            - call: "POST /exchange-orders/${o_id}/refund"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "GET /reconciliation-sessions/${rs_id}"
              as: PlatformAdmin
              captures: { e_post: $.data.expected_cash_cents }
          assert:
            - "at creation: expected_cash_cents == 20000"
            - "after complete: expected_cash_cents == 22705 (20000 + 2705)"
            - "after refund: expected_cash_cents == 20000 == ${e0} (forward + compensating action net to zero drift)"
