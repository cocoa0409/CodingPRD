# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — task_3336 (§1.8 Test Targeting Index)
# 9 rules x >=2 instances (rule 2 carries 3, one per mode) = 19 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: utilization_actual_vs_projected
        grounds:
          - calculations.fleet_utilization
          - entities.ToolAsset.fields.utilization_minutes_current_month
          - endpoints.GET_/fleet/agreements/{id}/utilization
        distinguishing_aspect: |
          Same recorded UsageEvent minutes on the same agreement produce two
          different percentages: ACTUAL = 20.00 and PROJECTED = 37.50 at
          clock 2026-09-16 (elapsed 16 days of 30). Entity domain: FleetAgreement
          reporting (distinct from the settlement domain of the sibling instance).
        test_recipe:
          setup:
            - "Clock at 2026-09-16; account with one ACTIVE agreement (start 2026-09-01, term 12) holding one DEPLOYED LIGHT DRILL asset"
            - "One UsageEvent of 1536 minutes recorded within September"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/accounts"
              payload: { company_name: "Acme Builders", tax_id: "EIN-U1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-DRILL-U1", tool_category: "DRILL", base_monthly_rate_cents: 5000, tier2_threshold: 100, tier2_monthly_rate_cents: 5000, tier3_threshold: 200, tier3_monthly_rate_cents: 5000, min_monthly_fee_cents: 1000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-U1", category: "DRILL", replacement_value_cents: 100000, weight_class: "LIGHT" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 12, start_date: "2026-09-01T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { asset: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site U1", address: "1 Way", capacity_assets: 10, geofence_radius_m: 500 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/assets/${asset}/deploy"
              payload: { jobsite_id: "${js}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
            - call: "POST /fleet/assets/${asset}/usage-events"
              payload: { started_at: "2026-09-01T00:00:00Z", ended_at: "2026-09-02T01:36:00Z" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "GET /fleet/agreements/${ag}/utilization"
              payload: {}
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { pct_actual: $.data.utilization_pct, n_actual: $.data.asset_count }
            - call: "GET /fleet/agreements/${ag}/utilization?mode=PROJECTED"
              payload: {}
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { pct_proj: $.data.utilization_pct }
          assert:
            - "pct_actual == 20.00 (1536 / (16 * 480) * 100)"
            - "pct_proj == 37.50 (20.00 * 30 / 16, half-up 2dp)"
            - "n_actual == 1"
            - "pct_actual != pct_proj for identical recorded data"

      - name: end_of_term_provisional_vs_final_buyout
        grounds:
          - calculations.end_of_term_settlement
          - state_machines.FleetAgreement.ACTIVE_to_ENDING
          - entities.EndOfTermSettlement.fields.provisional_amount_cents
          - entities.EndOfTermSettlement.fields.final_amount_cents
        distinguishing_aspect: |
          Provisional (election-time fleet snapshot, 2 assets -> 80000) and final
          (finalize-time snapshot, 1 asset -> 40000) diverge because a theft
          approval between the two computations moved one asset to LOST, out of
          the billable set. Entity domain: EndOfTermSettlement / FleetAgreement
          end-of-term (distinct from the reporting domain of the sibling).
        test_recipe:
          setup:
            - "Clock 2026-09-01; ACTIVE agreement (term 1, start 2026-09-01, end 2026-10-01, election window open) with two DEPLOYED BREAKER assets of replacement_value_cents 200000"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/accounts"
              payload: { company_name: "Bravo Contractors", tax_id: "EIN-S1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-BRK-S1", tool_category: "BREAKER", base_monthly_rate_cents: 20000, tier2_threshold: 50, tier2_monthly_rate_cents: 20000, tier3_threshold: 100, tier3_monthly_rate_cents: 20000, min_monthly_fee_cents: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-S1", category: "BREAKER", replacement_value_cents: 200000, weight_class: "HEAVY" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 1, start_date: "2026-09-01T00:00:00Z", end_of_term_option: "BUYOUT" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}", "${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { ag_v2: $.data.version }
            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { a1: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
              captures: { ag_v3: $.data.version }
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site S1", address: "2 Way", capacity_assets: 10, geofence_radius_m: 500 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/assets/${a1}/deploy"
              payload: { jobsite_id: "${js}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/elect-end-of-term"
              payload: { expected_agreement_version: "${ag_v3}", end_of_term_option: "BUYOUT" }
              as: ContractorManager
              as_user_id: "${acct}"
            - call: "GET /fleet/agreements/${ag}/settlement"
              payload: {}
              as: FleetAdmin
              captures: { prov: "$.data[0].provisional_amount_cents" }
            - call: "POST /fleet/assets/${a1}/theft-claims"
              payload: {}
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { claim: $.data.id }
            - call: "POST /fleet/theft-claims/${claim}/verify-police-report"
              payload: { police_report_number: "PR-S1", police_report_filed_at: "2026-09-01T12:00:00Z" }
              as: FleetAdmin
              as_user_id: "admin-s1"
            - call: "POST /fleet/theft-claims/${claim}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-s1"
          trigger:
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/finalize-settlement"
              payload: { assessed_damage_cents: 0 }
              as: FleetAdmin
              captures: { ag_status: $.data.status }
            - call: "GET /fleet/agreements/${ag}/settlement"
              payload: {}
              as: FleetAdmin
              captures: { fin: "$.data[0].final_amount_cents", fin_flag: "$.data[0].finalized" }
          assert:
            - "prov == 80000 (2 assets * round_half_up(200000 * 0.20))"
            - "fin == 40000 (1 billable asset left after LOST)"
            - "fin_flag == true"
            - "ag_status == CLOSED"
            - "prov != fin for the identical formula, proving snapshot divergence"

  - rule_id: combinatorial_formula
    instances:
      - name: billing_tier_straddle_min_fee_proration
        grounds:
          - calculations.monthly_fleet_billing
          - state_machines.FleetAgreement.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): six DRILL units straddle the tier-2 boundary (tier split
          4x10000 + 2x9000 = 58000, above the 25000 min fee), then mid-month
          activation on 2026-09-16 prorates with factor 15/30 and a single
          floor -> billed 29000. Exercises >=3 inputs (count, two thresholds,
          min fee, proration) with non-linear interaction.
        test_recipe:
          setup:
            - "Clock 2026-09-16; DRAFT agreement (start 2026-09-16) holding 6 REGISTERED DRILL assets; rate card DRILL base 10000, t2>=5 @9000, t3>=10 @8000, min 25000"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/accounts"
              payload: { company_name: "Charlie Works", tax_id: "EIN-B1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-DRILL-B1", tool_category: "DRILL", base_monthly_rate_cents: 10000, tier2_threshold: 5, tier2_monthly_rate_cents: 9000, tier3_threshold: 10, tier3_monthly_rate_cents: 8000, min_monthly_fee_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-B1", category: "DRILL", replacement_value_cents: 80000, weight_class: "LIGHT" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 12, start_date: "2026-09-16T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}", "${tm}", "${tm}", "${tm}", "${tm}", "${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
          trigger:
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
              captures: { billed: $.data.billed_this_month_cents }
          assert:
            - "billed == 29000 (tier1 4*10000 + tier2 2*9000 = 58000; max(58000, 25000) = 58000; floor(58000 * 15/30) = 29000)"

      - name: consumable_pack_rounding_per_line_then_sum
        grounds:
          - calculations.consumable_order_total
          - state_machines.ConsumableOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b): two lines of the SAME product (pack_size 10, unit 500) with
          quantities 6 and 4 round up per line (1 pack + 1 pack -> 10000);
          merge-then-round would give ceil(10/10)=1 pack -> 5000. The scaffold
          pins per-line-then-sum, so total_cents == 10000.
        test_recipe:
          setup:
            - "ACTIVE account; product SKU RND-1 pack_size 10 unit_price 500, no application approval"
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Delta Supply", tax_id: "EIN-C1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/consumable-products"
              payload: { sku: "RND-1", name: "Anchor bolt", unit_price_cents: 500, pack_size: 10, requires_application_approval: false }
              as: FleetAdmin
              captures: { prod: $.data.id }
            - call: "POST /fleet/accounts/${acct}/consumable-orders"
              payload: { lines: [{ product_id: "${prod}", quantity_units: 6 }, { product_id: "${prod}", quantity_units: 4 }] }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { order: $.data.id }
          trigger:
            - call: "POST /fleet/accounts/${acct}/consumable-orders/${order}/submit"
              payload: {}
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { total: $.data.total_cents, st: $.data.status }
          assert:
            - "total == 10000 (ceil(6/10)=1 pack and ceil(4/10)=1 pack; 2 * 10 * 500)"
            - "st == SUBMITTED"

      - name: theft_deductible_floor_binds_after_depreciation
        grounds:
          - calculations.theft_replacement_cost
          - state_machines.TheftClaim.POLICE_VERIFIED_to_APPROVED
        distinguishing_aspect: |
          Mode (c): evaluation order is pinned because deductible (step 3) reads
          depreciated value (step 2) and the approved value (step 4) reads both
          the deductible and the running agreement coverage total. A 13-month-old
          100000-cent asset lands in the 70% tier (70000); the 10% deductible
          (7000) is overridden by the 50000 floor; approved = 70000 - 50000 =
          20000 (coverage cap not yet engaged).
        test_recipe:
          setup:
            - "ACTIVE agreement with one asset commissioned_on 2026-09-01; clock advanced to 2027-10-15 (409 days -> age 13 months); claim reported and police-verified"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/accounts"
              payload: { company_name: "Echo Builders", tax_id: "EIN-T1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-DRILL-T1", tool_category: "DRILL", base_monthly_rate_cents: 5000, tier2_threshold: 100, tier2_monthly_rate_cents: 5000, tier3_threshold: 200, tier3_monthly_rate_cents: 5000, min_monthly_fee_cents: 1000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-T1", category: "DRILL", replacement_value_cents: 100000, weight_class: "LIGHT" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 24, start_date: "2026-09-01T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { asset: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site T1", address: "3 Way", capacity_assets: 10, geofence_radius_m: 500 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/assets/${asset}/deploy"
              payload: { jobsite_id: "${js}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-15T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assets/${asset}/theft-claims"
              payload: {}
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { claim: $.data.id }
            - call: "POST /fleet/theft-claims/${claim}/verify-police-report"
              payload: { police_report_number: "PR-T1", police_report_filed_at: "2027-10-15T12:00:00Z" }
              as: FleetAdmin
              as_user_id: "admin-t1"
          trigger:
            - call: "POST /fleet/theft-claims/${claim}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-t1"
              captures: { ded: $.data.deductible_cents, appr: $.data.approved_replacement_value_cents, st: $.data.status }
          assert:
            - "ded == 50000 (max(50000, round_half_up(0.10 * 70000) = 7000) -> floor binds)"
            - "appr == 20000 (min(70000 - 50000, 1000000 - 0))"
            - "st == APPROVED"

  - rule_id: non_linear_state_machine
    instances:
      - name: repair_ticket_reopen_cycle
        grounds:
          - state_machines.RepairTicket.CLOSED_to_REOPENED
          - state_machines.RepairTicket.REOPENED_to_IN_SHOP
        distinguishing_aspect: |
          Cyclic machine on RepairTicket: CLOSED -> REOPENED -> IN_SHOP loops
          back into the pipeline (not a linear pipeline); reopen_count
          increments while sla_breach_credit_cents stays immutable at 0.
          Entity: RepairTicket (distinct from the account machine sibling).
        test_recipe:
          setup:
            - "ACTIVE agreement with one DEPLOYED LIGHT asset; a repair ticket driven OPENED -> PICKUP_SCHEDULED -> IN_SHOP -> QUALITY_CHECK -> CLOSED within the SLA"
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Foxtrot GC", tax_id: "EIN-R1", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-DRILL-R1", tool_category: "DRILL", base_monthly_rate_cents: 5000, tier2_threshold: 100, tier2_monthly_rate_cents: 5000, tier3_threshold: 200, tier3_monthly_rate_cents: 5000, min_monthly_fee_cents: 0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
              payload: { model_code: "TM-R1", category: "DRILL", replacement_value_cents: 80000, weight_class: "LIGHT" }
              as: FleetAdmin
              captures: { tm: $.data.id }
            - call: "POST /fleet/accounts/${acct}/agreements"
              payload: { term_months: 12, start_date: "2026-09-01T00:00:00Z", end_of_term_option: "RETURN" }
              as: FleetAdmin
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/adjust-fleet"
              payload: { expected_agreement_version: "${ag_v}", add_tool_model_ids: ["${tm}"], return_asset_ids: [] }
              as: ContractorManager
              as_user_id: "${acct}"
            - call: "GET /fleet/assets"
              payload: {}
              as: FleetAdmin
              captures: { asset: "$.data[0].id" }
            - call: "POST /fleet/accounts/${acct}/agreements/${ag}/activate"
              payload: {}
              as: FleetAdmin
            - call: "POST /fleet/accounts/${acct}/jobsites"
              payload: { name: "Site R1", address: "4 Way", capacity_assets: 10, geofence_radius_m: 500 }
              as: ContractorManager
              as_user_id: "${acct}"
              captures: { js: $.data.id }
            - call: "POST /fleet/assets/${asset}/deploy"
              payload: { jobsite_id: "${js}" }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
            - call: "POST /fleet/assets/${asset}/repair-tickets"
              payload: { loaner_requested: false }
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { tick: $.data.id }
            - call: "POST /fleet/repair-tickets/${tick}/schedule-pickup"
              payload: {}
              as: ServiceCoordinator
            - call: "POST /fleet/repair-tickets/${tick}/receive"
              payload: {}
              as: ServiceCoordinator
            - call: "POST /fleet/repair-tickets/${tick}/complete-repair"
              payload: {}
              as: ServiceCoordinator
            - call: "POST /fleet/repair-tickets/${tick}/close"
              payload: {}
              as: ServiceCoordinator
              captures: { credit0: $.data.sla_breach_credit_cents }
          trigger:
            - call: "POST /fleet/repair-tickets/${tick}/reopen"
              payload: {}
              as: JobsiteSupervisor
              as_user_id: "${acct}"
              captures: { st1: $.data.status, rc1: $.data.reopen_count, credit1: $.data.sla_breach_credit_cents }
            - call: "POST /fleet/repair-tickets/${tick}/receive"
              payload: {}
              as: ServiceCoordinator
              captures: { st2: $.data.status }
          assert:
            - "credit0 == 0 (closed same day, within 3-day LIGHT SLA)"
            - "st1 == REOPENED and rc1 == 1"
            - "credit1 == 0 (credit immutable across the reopen)"
            - "st2 == IN_SHOP (cycle re-enters the pipeline)"

      - name: account_suspend_reinstate_cycle
        grounds:
          - state_machines.ContractorAccount.ACTIVE_to_SUSPENDED
          - state_machines.ContractorAccount.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on ContractorAccount (ACTIVE -> SUSPENDED -> ACTIVE)
          driven by the fiscal precondition outstanding vs credit_limit, with
          cascades flipping every agreement in lockstep. Entity:
          ContractorAccount (distinct from the RepairTicket sibling).
        test_recipe:
          setup:
            - "Clock 2026-09-16; account credit_limit 25000; agreement with 6 DRILL units activated -> prorated bill 29000 posted to outstanding (29000 > 25000)"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/accounts"
              payload: { company_name: "Golf Builders", tax_id: "EIN-A1", credit_limit_cents: 25000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
            - call: "POST /fleet/rate-cards"
              payload: { code: "RC-DRILL-A1", tool_category: "DRILL", base_monthly_rate_cents: 10000, tier2_threshold: 5, tier2_monthly_rate_cents: 9000, tier3_threshold: 10, tier3_monthly_rate_cents: 8000, min_monthly_fee_cents: 25000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/tool-models"
