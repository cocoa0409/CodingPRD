              as: PlanSponsorAdmin
              as_user_id: "${emp_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /plan-admin/remittance-batches"
              payload: { plan_id: "${p403_id}", pay_period_start: "2026-07-16", pay_period_end: "2026-07-31", withholding_date: "2026-07-30", total_elective_deferral_cents: 100000, line_items: [{ vendor_account_id: "${a1_id}", elective_deferral_cents: 100000, employer_contribution_cents: 0 }] }
              as: PlanSponsorAdmin
