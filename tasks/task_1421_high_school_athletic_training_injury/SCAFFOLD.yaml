  - method: PATCH
    path: "/supply-items/{itemId}"
    description: "Update thresholds/cost/discontinue"
    roles: [SystemAdmin]
    code: 200
    input: ["par_level?", "reorder_threshold?", "unit_cost_cents?", "is_discontinued?"]
    output: SupplyItem
    side_effects: ["stock_status recomputed when reorder_threshold changes"]
  - method: GET
    path: "/supply-items/{itemId}/valuation"
    description: "Inventory valuation under the selected policy (FIFO | WAC_RUNNING | WAC_EXACT)"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: [policy]
    output: { supply_item_id: string, policy: string, quantity_on_hand: integer, valuation_cents: integer }
    side_effects: []
  - method: GET
    path: "/supply-items/{itemId}/reorder-suggestion"
    description: "Budget-clamped reorder suggestion (pinned evaluation order)"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: []
    output: { supply_item_id: string, current_stock: integer, inbound_qty: integer, deficit_qty: integer, available_budget_cents: integer, max_affordable_qty: integer, suggested_qty: integer }
    side_effects: []
  - method: POST
    path: "/inventory-transactions"
    description: "Append an inventory ledger entry (recorded_by = caller)"
    roles: [AthleticTrainer, SystemAdmin]
    code: 201
    input: [supply_item_id, txn_type, quantity, occurred_at, "unit_cost_cents?", "event_id?", "reason?"]
    output: InventoryTransaction
    side_effects: ["SupplyItem.current_stock recomputed", "stock_status recomputed"]
  - method: GET
    path: "/inventory-transactions"
    description: "List inventory transactions"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: ["supply_item_id?", "recorded_by_staff_id?", "restock_order_id?", "event_id?", "txn_type?", "limit?", "offset?"]
    output: "InventoryTransaction[]"
    side_effects: []
  - method: GET
    path: "/inventory-transactions/{txnId}"
    description: "Get one inventory transaction"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: []
    output: InventoryTransaction
    side_effects: []

  # --- Restock orders ---
  - method: POST
    path: "/restock-orders"
    description: "Draft a restock order (requester = caller)"
    roles: [AthleticTrainer, AthleticDirector]
    code: 201
    input: [supply_item_id, quantity, unit_cost_cents, fiscal_year]
    output: RestockOrder
    side_effects: ["extended_cost_cents computed", "requested_by_staff_id = X-User-ID", "status = DRAFT"]
  - method: GET
    path: "/restock-orders"
    description: "List restock orders"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: ["supply_item_id?", "requested_by_staff_id?", "approved_by_staff_id?", "status?", "fiscal_year?", "limit?", "offset?"]
    output: "RestockOrder[]"
    side_effects: []
  - method: GET
    path: "/restock-orders/{orderId}"
    description: "Get one restock order"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: []
    output: RestockOrder
    side_effects: []
  - method: POST
    path: "/restock-orders/{orderId}/submit"
    description: "Submit a draft order"
    roles: [AthleticTrainer, AthleticDirector]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status DRAFT -> SUBMITTED"]
  - method: POST
    path: "/restock-orders/{orderId}/approve"
    description: "Approve a submitted order (approver != requester; budget check)"
    roles: [AthleticDirector]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status SUBMITTED -> APPROVED", "budget.committed_spend_cents += extended_cost_cents"]
  - method: POST
    path: "/restock-orders/{orderId}/reject"
    description: "Reject a submitted order"
    roles: [AthleticDirector]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status SUBMITTED -> REJECTED"]
  - method: POST
    path: "/restock-orders/{orderId}/receive"
    description: "Receive an approved order; appends the RESTOCK ledger entry"
    roles: [AthleticTrainer]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status APPROVED -> RECEIVED", "InventoryTransaction RESTOCK created", "item stock recomputed", "budget committed -> realized"]
  - method: POST
    path: "/restock-orders/{orderId}/cancel"
    description: "Cancel a non-terminal order; cancels of APPROVED orders release committed budget"
    roles: [AthleticTrainer]
    code: 200
    input: []
    output: RestockOrder
    side_effects: ["status -> CANCELLED", "if was APPROVED: budget.committed_spend_cents -= extended_cost_cents"]

  # --- Supply budgets ---
  - method: POST
    path: "/supply-budgets"
    description: "Create a fiscal-year supply budget (fiscal_year unique)"
    roles: [SystemAdmin]
    code: 201
    input: [fiscal_year, total_budget_cents]
    output: SupplyBudget
    side_effects: []
  - method: GET
    path: "/supply-budgets"
    description: "List supply budgets"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: ["fiscal_year?", "limit?", "offset?"]
    output: "SupplyBudget[]"
    side_effects: []
  - method: GET
    path: "/supply-budgets/{budgetId}"
    description: "Get one budget with computed spend fields"
    roles: [SystemAdmin, AthleticTrainer, AthleticDirector]
    code: 200
    input: []
    output: SupplyBudget
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default before any set call is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Setting the clock runs the auto-transition sweep: physicals/baselines expire at their boundaries, referrals expire (now > due_by), SENT notifications escalate (now >= sent_at + 24h), and athlete postures recompute."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["auto-transition sweep over physicals, baselines, referrals, notifications", "athlete posture recompute"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's allowed roles" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Caller is not the owner this action requires (guardian of another athlete, assignee of another trainer's assignment, physician of another referral)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Generic resource not found (unparseable or unknown id)" }
  - { id: ERR_ATHLETE_NOT_FOUND, http: 404, condition: "Athlete id does not exist" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "Staff id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Venue id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Event id does not exist" }
  - { id: ERR_INJURY_NOT_FOUND, http: 404, condition: "Injury id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral id does not exist" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "RTP protocol id does not exist" }
  - { id: ERR_EAP_NOT_FOUND, http: 404, condition: "Emergency action plan id does not exist" }
  - { id: ERR_PHYSICAL_NOT_FOUND, http: 404, condition: "Physical id does not exist" }
  - { id: ERR_BASELINE_NOT_FOUND, http: 404, condition: "Baseline test id does not exist" }
  - { id: ERR_NOTIFICATION_NOT_FOUND, http: 404, condition: "Guardian notification id does not exist" }
  - { id: ERR_SUPPLY_ITEM_NOT_FOUND, http: 404, condition: "Supply item id does not exist" }
  - { id: ERR_RESTOCK_ORDER_NOT_FOUND, http: 404, condition: "Restock order id does not exist" }
  - { id: ERR_BUDGET_NOT_FOUND, http: 404, condition: "No SupplyBudget exists for the order's fiscal_year" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad enum, malformed value, unit_cost_cents missing on RESTOCK, reason missing on ADJUSTMENT/WASTE" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "scheduled_end <= scheduled_start, or a recorded/exam/test/evaluation timestamp is in the future relative to the logical clock" }
  - { id: ERR_QUANTITY_NONPOSITIVE, http: 422, condition: "quantity <= 0 on inventory transaction or restock order" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a from-state allowed for the requested transition (includes terminal lockdown and duplicate actions)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_NO_ACTIVE_EAP, http: 409, condition: "Event start requires an ACTIVE emergency action plan at the venue" }
  - { id: ERR_HEAT_TIER_EXTREME, http: 409, condition: "Outdoor event start/resume blocked while the venue's current heat tier is EXTREME" }
  - { id: ERR_LIGHTNING_HOLD_ACTIVE, http: 409, condition: "Event start/resume blocked while a lightning hold is active at the venue" }
  - { id: ERR_CLEARANCE_AUTHORITY_INSUFFICIENT, http: 403, condition: "RTP clearance requires a Physician (concussion or SEVERE/CRITICAL injury) but caller is an AthleticTrainer" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same staff member may not perform both duties (record+verify a physical, author+approve an EAP, request+approve a restock order)" }
  - { id: ERR_SYMPTOMS_REPORTED, http: 422, condition: "RTP advance with symptom_check_passed = false" }
  - { id: ERR_RTP_PHYSICIAN_REVIEW_REQUIRED, http: 409, condition: "Advance requires a completed physician report (concussion entering stage 5, or recurrence_count >= 2)" }
  - { id: ERR_GUARDIAN_CONTACT_MISSING, http: 409, condition: "Send blocked: athlete lacks the channel's guardian contact (email/phone)" }
  - { id: ERR_PHYSICAL_EXPIRED, http: 409, condition: "RTP advance/clear blocked: athlete participation_posture is INELIGIBLE or NOT_CLEARED (no valid VERIFIED physical or no CURRENT baseline)" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Trainer already holds a PRIMARY assignment on an event whose [start,end) overlaps (half-open; back-to-back allowed)" }
  - { id: ERR_VENUE_OVERLAP, http: 409, condition: "Venue already hosts a non-CANCELLED event whose 30-minute-buffered window collides with the proposed event" }
  - { id: ERR_RTP_STAGE_DWELL_NOT_MET, http: 409, condition: "Fewer than 24 hours elapsed since stage_entered_at" }
  - { id: ERR_CLOSE_WINDOW_NOT_MET, http: 409, condition: "Injury resolved fewer than 30 days ago" }
  - { id: ERR_STAFF_ROLE_MISMATCH, http: 422, condition: "Referenced staff member has the wrong role_type (coverage assignee not ATHLETIC_TRAINER; referral physician not PHYSICIAN) or is inactive" }
  - { id: ERR_ITEM_DISCONTINUED, http: 422, condition: "Restock order references a discontinued supply item" }
  - { id: ERR_REFERENCED_INJURY_NOT_CLOSED, http: 422, condition: "reopen_of_id references an injury that is not CLOSED or belongs to another athlete" }
  - { id: ERR_VENUE_INACTIVE, http: 422, condition: "New events cannot be scheduled at an inactive venue" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "USAGE/WASTE would drive current_stock below zero" }
  - { id: ERR_DUPLICATE_BUDGET_YEAR, http: 409, condition: "A SupplyBudget for this fiscal_year already exists" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Order approval would exceed the budget's available_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Opaque platform operator; manages staff, venues, supply items, budgets, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /staff"
      - "PATCH /staff/{id}"
      - "POST /venues"
      - "POST /supply-items"
      - "PATCH /supply-items/{id}"
      - "POST /supply-budgets"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /athletes (with AthleticTrainer)"
      - "POST /weather-readings (with AthleticTrainer)"
      - "POST /inventory-transactions (with AthleticTrainer)"
      - "All GET list/detail endpoints"

  - name: AthleticTrainer
    description: "The school athletic trainer; owns day-to-day medical documentation, coverage operations, RTP progression, referrals, notifications, and supply ordering"
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /physicals/{id}/void"
      - "POST /injuries and all /injuries/{id} action endpoints"
      - "POST /referrals and referral lifecycle except complete"
      - "POST /injuries/{id}/rtp-protocols, advance/regress"
      - "POST /guardian-notifications/{id}/send, /retry"
      - "POST /events/{id}/start|suspend|resume|complete"
      - "POST /restock-orders/{id}/receive, /cancel"
      - "POST /emergency-action-plans/{id}/submit"
    shared_operations:
      - "POST /physicals (with SchoolNurse)"
      - "POST /restock-orders, /submit (with AthleticDirector)"
      - "POST /baseline-tests (with SchoolNurse)"
      - "POST /events (with AthleticDirector)"
      - "POST /coverage-assignments (with AthleticDirector)"
      - "POST /coverage-assignments/{id}/cancel (with AthleticDirector)"
      - "POST /emergency-action-plans (with AthleticDirector)"
      - "POST /rtp-protocols/{id}/clear (with Physician — authority-gated)"
      - "POST /rtp-protocols/{id}/terminate (with Physician)"
      - "POST /events/{id}/cancel (with AthleticDirector)"
      - "POST /athletes (with SystemAdmin)"
      - "POST /weather-readings (with SystemAdmin)"
      - "POST /inventory-transactions (with SystemAdmin)"
      - "GET endpoints"
    ownership_rules:
      - "CoverageAssignment acknowledge/decline/check-in require X-User-ID == assignment.staff_id"

  - name: AthleticDirector
    description: "Athletic director; approves EAPs and restock orders, co-manages events and coverage. Segregated from authoring/requesting."
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /emergency-action-plans/{id}/approve, /reject, /activate"
      - "POST /restock-orders/{id}/approve, /reject"
    shared_operations:
      - "POST /events, POST /coverage-assignments, cancel endpoints (with AthleticTrainer)"
      - "POST /emergency-action-plans (with AthleticTrainer)"
      - "POST /restock-orders, /submit (with AthleticTrainer)"
      - "GET endpoints"

  - name: SchoolNurse
    description: "School nurse; verifies physicals and co-administers baseline tests"
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /physicals/{id}/verify"
    shared_operations:
      - "POST /physicals (with AthleticTrainer)"
      - "POST /baseline-tests (with AthleticTrainer)"
      - "GET endpoints"

  - name: Physician
    description: "Team/consulting physician; files referral reports and holds clearance authority for concussion and severe injuries"
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /referrals/{id}/complete"
    shared_operations:
      - "POST /rtp-protocols/{id}/clear (with AthleticTrainer — authority-gated)"
      - "POST /rtp-protocols/{id}/terminate (with AthleticTrainer)"
      - "GET endpoints"
    ownership_rules:
      - "Referral complete requires X-User-ID == referral.physician_staff_id"

  - name: TeamCoach
    description: "Coach; read-only access to schedules, coverage, and athlete posture summaries. No medical record access."
    identity: "entity_backed:Staff"
    exclusive_operations: []
    shared_operations:
      - "GET /staff, /athletes, /athletes/{id}, /athletes/{id}/clearance"
      - "GET /venues, /venues/{id}, /venues/{id}/activity-status"
      - "GET /events, /events/{id}, /events/{id}/coverage-status"
      - "GET /coverage-assignments, /emergency-action-plans, /supply-items, /weather-readings"
    denied_operations:
      - "GET /injuries, /referrals, /rtp-protocols, /physicals, /baseline-tests, /guardian-notifications (medical privacy)"

  - name: ParentGuardian
    description: "Parent/guardian of an athlete; acknowledges notifications and views own child's summary. X-User-ID equals the athlete's guardian_user_id field (opaque string, not an entity id)."
    identity: opaque
    exclusive_operations:
      - "POST /guardian-notifications/{id}/acknowledge"
    shared_operations:
      - "GET /athletes/{id} (own child only)"
      - "GET /guardian-notifications (own child's only)"
    ownership_rules:
      - "Any athlete-scoped access requires X-User-ID == athlete.guardian_user_id, else ERR_OWNERSHIP_MISMATCH"
