      - name: collection_pct_precision_two_thirds
        claim_type: precision
        grounds: [calculations.collection_percentage]
        distinguishing_aspect: "round_half_up to 2 decimals: collected 2 / actual 3 yields exactly 66.67, demonstrating the pinned precision."
