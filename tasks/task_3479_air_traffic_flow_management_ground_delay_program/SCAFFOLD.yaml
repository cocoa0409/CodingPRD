# =============================================================================
# PRD Benchmark Seed Tables
# Air Traffic Flow Management & Ground Delay Program Administration
# =============================================================================

scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Air Traffic Flow Management & Ground Delay Program Administration (Federal Aviation Administration): capacity constraint forecasting at airports and en route sectors from weather, staffing and equipment outages, traffic management initiative selection across ground delay programs, ground stops, airspace flow programs and reroutes, arrival slot assignment to flights based on original schedule order with delay distribution across operators, operator substitution and cancellation messaging allowing airlines to swap slots among their own flights, compression to recover unused slots when flights cancel with reallocation rules, collaborative decision making with airline operations centers and data exchange requirements, program revision and cancellation as conditions change with cascading schedule effects, general aviation and unscheduled operator accommodation

domain_name: air-traffic-flow-management
api_prefix: /atfm

complexity_profile:
  primary_archetype: quota_allocation        # arrival slots are a finite pool competed for, reserved, committed, released
  secondary_archetype: temporal_windowing    # programs/forecasts/constraint events are overlapping intervals with gap rules
  complexity_layers:
    - optimistic_concurrency                 # OCC on TrafficManagementInitiative.version and Flight.version
    - cascading_side_effects                 # constraint-confirm -> forecast STALE -> TMI auto-REVISING -> revision record
    - dual_variant_calculation               # PLANNING vs OPERATIONAL forecasts; PROVISIONAL vs FINAL delay attribution
    - derived_field_reconciliation           # operator delay ledgers reconciled on every slot mutation
  entity_topology: flat                      # peer entities with foreign-key references; no nested ownership in identity
  state_machine_shape: cyclic                # TMI ACTIVE -> REVISING -> ACTIVE; Flight carries parallel dimensions
  relationship_patterns:
    - one_to_many                            # Facility -> TMIs, Operator -> Flights, TMI -> Slots/Transactions
    - cross_aggregate                        # RerouteAssignment spans TMI x Flight x Facility(sector)
  role_model: segregation_of_duties          # TMI proposer may not publish the same TMI
  consistency_model: immediate               # every mutation (incl. cascades) visible in the same request's response

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: ident, type: string, source: input, description: "Facility identifier (e.g. KEWR, ZDC42). Unique across all facilities; duplicate create rejected with ERR_FACILITY_IDENT_CONFLICT." }
      - { name: facility_type, type: enum, source: input, description: "AIRPORT | EN_ROUTE_SECTOR" }
      - { name: base_acceptance_rate, type: integer, source: input, description: "Unconstrained capacity in flights per hour; integer in [1, 120]" }
      - { name: status, type: enum, source: system, default: "OPERATIONAL", description: "OPERATIONAL | DEGRADED | OUTAGE. Set via PATCH. OUTAGE blocks TMI activation and reroute assignments into the facility." }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operator display name (airline or GA operator). Not unique." }
      - { name: operator_type, type: enum, source: input, description: "SCHEDULED_CARRIER | GENERAL_AVIATION | UNSCHEDULED_CHARTER. GA accommodation requests require GENERAL_AVIATION or UNSCHEDULED_CHARTER." }
      - { name: cdm_member, type: boolean, source: input, default: false, description: "Whether the operator participates in collaborative decision making data exchange." }
      - { name: cumulative_delay_minutes, type: integer, source: computed, default: 0, description: "Sum of FINAL attributed delay minutes across all COMPLETED programs; adjusted by compensation reversals on TMI cancel. Never decremented by provisional activity." }

  - name: ConstraintEvent
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility whose capacity is degraded" }
      - { name: event_type, type: enum, source: input, description: "WEATHER | STAFFING | EQUIPMENT" }
      - { name: severity, type: integer, source: input, description: "Integer severity 1..5; 5 is worst" }
      - { name: window_start, type: datetime, source: input, description: "Start of degradation window (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "End of degradation window; must be > window_start" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of times the event has been extended; hard cap CONSTRAINT_EVENT_MAX_EXTENSIONS = 2" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED -> CONFIRMED -> CLEARED; REPORTED -> CLEARED also allowed" }

  - name: CapacityForecast
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; forecast subject facility" }
      - { name: variant, type: enum, source: input, description: "PLANNING | OPERATIONAL. PLANNING includes CONFIRMED events only; OPERATIONAL additionally includes REPORTED events at half weight." }
      - { name: window_start, type: datetime, source: input, description: "Forecast window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Forecast window end; must be > window_start" }
      - { name: included_event_ids, type: array, source: system, description: "Ids of ConstraintEvents that entered the computation (per variant inclusion rules)" }
      - { name: predicted_acceptance_rate, type: integer, source: computed, description: "Computed flights/hour = max(1, floor(base_acceptance_rate * effective_multiplier)) with effective_multiplier = max(raw_multiplier, MIN_CAPACITY_FLOOR_PCT/100)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> PUBLISHED -> STALE (terminal). STALE assigned automatically when an overlapping ConstraintEvent is confirmed or extended." }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock instant when the forecast was published; null while DRAFT" }

  - name: TrafficManagementInitiative
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; controlled airport or sector" }
      - { name: tmi_type, type: enum, source: input, description: "GROUND_DELAY_PROGRAM | GROUND_STOP | AIRSPACE_FLOW_PROGRAM | REROUTE" }
      - { name: program_start, type: datetime, source: input, description: "Program window start (UTC)" }
      - { name: program_end, type: datetime, source: input, description: "Program window end; must be > program_start and > current clock at propose time" }
      - { name: controlled_rate, type: integer, source: input, default: 0, description: "Controlled acceptance rate (flights/hour). GROUND_DELAY_PROGRAM: must satisfy 6 <= r <= 60 and 3600 % r == 0 and r <= max_feasible_rate. AIRSPACE_FLOW_PROGRAM: integer 1..60. GROUND_STOP: must be 0. REROUTE: ignored (stored 0)." }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED -> PUBLISHED -> ACTIVE -> REVISING -> ACTIVE (cycle) -> COMPLETED | CANCELLED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the FlowManager who proposed the TMI; recorded at creation for segregation of duties" }
      - { name: published_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the CommandCenterAdmin who published; must differ from proposed_by_user_id" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Number of TMIRevision records created for this TMI" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock instant of first transition into ACTIVE" }

  - name: TMIRevision
    parent: null
    common_fields: false
    fields:
      - { name: tmi_id, type: string, source: system, description: "FK -> TrafficManagementInitiative.id; revised TMI" }
      - { name: revision_index, type: integer, source: system, description: "1-based ordinal of the revision on this TMI" }
      - { name: previous_controlled_rate, type: integer, source: system, default: null, description: "Rate before the revision; null when only the window changed" }
      - { name: new_controlled_rate, type: integer, source: system, default: null, description: "Rate after the revision; null when only the window changed" }
      - { name: previous_program_end, type: datetime, source: system, default: null, description: "Program end before the revision; null when only the rate changed" }
      - { name: new_program_end, type: datetime, source: system, default: null, description: "Program end after the revision; null when only the rate changed" }
      - { name: origin, type: enum, source: system, description: "MANUAL (FlowManager POST) | SYSTEM_AUTO_DOWNGRADE (capacity collapse cascade)" }
      - { name: reason, type: string, source: input, description: "Free-text reason; 'AUTO_CAPACITY_DOWNGRADE' for system revisions" }
      - { name: applied, type: boolean, source: system, default: false, description: "False while the TMI sits in REVISING; set true when activate applies the revision" }
      - { name: applied_at, type: datetime, source: system, default: null, description: "Logical-clock instant the revision was applied" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id; owning operator (AOC). The acting Operator role's X-User-ID must equal this value on writes." }
      - { name: designator, type: string, source: input, description: "Flight designator, e.g. UAL123. GA-accommodated flights get a server-minted designator 'GA-' + first 8 chars of the request id." }
      - { name: origin, type: string, source: input, description: "Origin airport free text" }
      - { name: arrival_facility_id, type: string, source: input, description: "FK -> Facility.id; arrival airport. Must reference a Facility with facility_type AIRPORT else ERR_FACILITY_TYPE_NOT_AIRPORT." }
      - { name: scheduled_arrival, type: datetime, source: input, description: "Original schedule arrival time (OAG basis for ration-by-schedule). Immutable after creation." }
      - { name: estimated_arrival, type: datetime, source: input, default: null, description: "Latest operator-reported ETA; defaults to scheduled_arrival when omitted" }
      - { name: controlled_arrival, type: datetime, source: system, default: null, description: "Assigned controlled time of arrival (CTA). Null while UNCONTROLLED. Overflow flights receive program_end as a virtual CTA with no ArrivalSlot row." }
      - { name: last_eta_reported_at, type: datetime, source: system, description: "Logical-clock instant of the last ETA report (set to created_at at filing; refreshed by POST /flights/{id}/updates with new_eta)" }
      - { name: ops_status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED -> AIRBORNE -> LANDED; SCHEDULED -> CANCELLED. Independent dimension of the flight state." }
      - { name: control_status, type: enum, source: system, default: "UNCONTROLLED", description: "UNCONTROLLED <-> SLOTTED. Independent dimension: SLOTTED when the flight holds an ASSIGNED ArrivalSlot in an ACTIVE/REVISING GDP." }
      - { name: is_overflow, type: boolean, source: system, default: false, description: "True when the flight was eligible at GDP activation but no slot remained; virtual CTA = program_end." }
      - { name: provisional_delay_minutes, type: integer, source: computed, default: 0, description: "max(0, floor((controlled_arrival - scheduled_arrival)/60s)) recomputed on every slot mutation; 0 while UNCONTROLLED" }
      - { name: final_delay_minutes, type: integer, source: computed, default: null, description: "Set at TMI completion: max(0, provisional_delay_minutes - self_inflicted_minutes); null until then" }

  - name: ArrivalSlot
    parent: null
    common_fields: true
    fields:
      - { name: tmi_id, type: string, source: system, description: "FK -> TrafficManagementInitiative.id; owning GDP" }
      - { name: slot_index, type: integer, source: system, description: "0-based ordinal of the slot within the program (ascending slot_time)" }
      - { name: slot_time, type: datetime, source: system, description: "Slot arrival instant = program_start + slot_index * (3600/controlled_rate) seconds" }
      - { name: is_ga_reserved, type: boolean, source: system, default: false, description: "True for the last reserved_slots slots of the program (GA accommodation pool); excluded from initial RBS carrier allocation" }
      - { name: assigned_flight_id, type: string, source: system, default: null, description: "FK -> Flight.id; current holder when status ASSIGNED, else null" }
      - { name: original_flight_id, type: string, source: system, default: null, description: "Flight id first assigned at activation (audit reference; not a live FK)" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> ASSIGNED -> RELEASED; ASSIGNED -> OPEN (freed mid-compression); RELEASED -> OPEN (unclaimed at compression end)" }

  - name: SlotTransaction
    parent: null
    common_fields: false
    fields:
      - { name: tmi_id, type: string, source: system, description: "FK -> TrafficManagementInitiative.id; program scope of the event" }
      - { name: slot_id, type: string, source: system, default: null, description: "Arrival slot affected (reference; null for virtual overflow CTAs and REVERSAL summaries)" }
      - { name: flight_id, type: string, source: system, description: "Flight affected (reference; denormalized at write time)" }
      - { name: operator_id, type: string, source: system, description: "Operator owning the flight at write time (denormalized reference)" }
      - { name: transaction_type, type: enum, source: system, description: "INITIAL_ASSIGNMENT | SUBSTITUTION_SWAP | COMPRESSION_MOVE | RELEASE | GA_ASSIGNMENT | REVISION_MOVE | REVERSAL" }
      - { name: from_slot_time, type: datetime, source: system, default: null, description: "CTA before the event (null for initial assignment)" }
      - { name: to_slot_time, type: datetime, source: system, default: null, description: "CTA after the event (null for releases/reversals)" }
      - { name: delay_delta_minutes, type: integer, source: system, description: "Signed change in the flight's attributed delay minutes caused by this event" }
      - { name: note, type: string, source: input, default: null, description: "Optional operator/system note" }

  - name: CompressionRun
    parent: null
    common_fields: false
    fields:
      - { name: tmi_id, type: string, source: system, description: "FK -> TrafficManagementInitiative.id; compressed GDP" }
      - { name: released_slot_count, type: integer, source: system, description: "Number of RELEASED slots that entered the reallocation pool" }
      - { name: moves_made, type: integer, source: system, description: "Total carrier flight moves executed across all passes" }
      - { name: passes_executed, type: integer, source: system, description: "Passes run until a no-move pass or COMPRESSION_MAX_PASSES = 3; minimum 1" }
      - { name: promoted_ga_request_ids, type: array, source: system, description: "WAITLISTED GAAccommodationRequest ids promoted during this run (possibly empty)" }
      - { name: remaining_open_slots, type: integer, source: system, description: "Count of slots with status OPEN after the run (includes never-assigned and unclaimed released slots)" }

  - name: GAAccommodationRequest
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; requesting GA/unscheduled operator (path operator)" }
      - { name: tmi_id, type: string, source: input, description: "FK -> TrafficManagementInitiative.id; target GROUND_DELAY_PROGRAM" }
      - { name: requested_window_start, type: datetime, source: input, description: "Earliest acceptable arrival (UTC); must lie within the program window" }
      - { name: requested_window_end, type: datetime, source: input, description: "Latest acceptable arrival; must lie within the program window and be > requested_window_start" }
      - { name: priority_class, type: enum, source: input, description: "HIGH_PRIORITY | STANDARD; ranks waitlist promotion before created_at" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED -> ACCOMMODATED | WAITLISTED | DENIED; WAITLISTED -> ACCOMMODATED | DENIED | EXPIRED" }
      - { name: accommodated_flight_id, type: string, source: system, default: null, description: "Flight created when ACCOMMODATED (reference; null otherwise)" }
      - { name: accommodated_slot_time, type: datetime, source: system, default: null, description: "Slot time granted when ACCOMMODATED" }

  - name: RerouteAssignment
    parent: null
    common_fields: false
    fields:
      - { name: tmi_id, type: string, source: system, description: "FK -> TrafficManagementInitiative.id; source REROUTE initiative" }
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id; rerouted flight (must be control_status UNCONTROLLED)" }
      - { name: via_sector_id, type: string, source: input, description: "FK -> Facility.id; sector the reroute traverses (facility_type EN_ROUTE_SECTOR)" }
      - { name: assigned_route, type: string, source: input, description: "Free-text route string" }
      - { name: hourly_bucket, type: datetime, source: system, description: "flight.estimated_arrival truncated to the hour; capacity counted per (via_sector_id, hourly_bucket)" }

  - name: OperatorDelayLedger
    parent: null
    common_fields: true
    fields:
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; ledger subject" }
      - { name: tmi_id, type: string, source: system, description: "FK -> TrafficManagementInitiative.id; program scope" }
      - { name: flight_count, type: integer, source: system, description: "Operator flights holding slots or virtual CTAs in this program (set at activation; decremented on cancellation removal)" }
      - { name: attributed_delay_minutes, type: integer, source: system, default: 0, description: "Running sum of this operator's program-attributed delay in this TMI; reconciled on every slot mutation" }
      - { name: reversed_delay_minutes, type: integer, source: system, default: 0, description: "Delay minutes returned by compensation (TMI cancel); attributed - reversed == 0 after a full cancel" }
      - { name: fair_share_minutes, type: integer, source: computed, default: 0, description: "Operator's proportional share of total program delay under largest-remainder rounding (calc operator_delay_distribution)" }
      - { name: deviation_minutes, type: integer, source: computed, default: 0, description: "attributed_delay_minutes - fair_share_minutes (signed equity deviation)" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: TrafficManagementInitiative
    initial_state: PROPOSED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "POST /atfm/tmis/{id}/publish"
        actor: CommandCenterAdmin
        preconditions:
          - "TMI in PROPOSED (else ERR_INVALID_STATE; from CANCELLED/COMPLETED use ERR_TMI_TERMINAL)"
          - "Segregation of duties: X-User-ID != tmi.proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Forecast gate (GROUND_DELAY_PROGRAM and AIRSPACE_FLOW_PROGRAM only; GROUND_STOP and REROUTE are exempt): a PUBLISHED, non-STALE, PLANNING-variant CapacityForecast exists for tmi.facility_id covering [program_start, program_end] (ERR_NO_CURRENT_FORECAST)"
          - "Rate gate (GROUND_DELAY_PROGRAM and AIRSPACE_FLOW_PROGRAM only): controlled_rate <= max_feasible_rate(facility, window) recomputed now (ERR_RATE_EXCEEDS_CAPACITY)"
        side_effects:
          - "status -> PUBLISHED; published_by_user_id := X-User-ID; version += 1"

      - from: PUBLISHED
        to: ACTIVE
        trigger: "POST /atfm/tmis/{id}/activate"
        actor: FlowManager
        preconditions:
          - "TMI in PUBLISHED (else ERR_INVALID_STATE)"
          - "Facility status != OUTAGE (ERR_FACILITY_NOT_OPERATIONAL)"
          - "Forecast + rate gates (GROUND_DELAY_PROGRAM and AIRSPACE_FLOW_PROGRAM only; GROUND_STOP/REROUTE exempt): PUBLISHED non-STALE PLANNING forecast covering the window exists; controlled_rate <= max_feasible_rate recomputed now (ERR_NO_CURRENT_FORECAST / ERR_RATE_EXCEEDS_CAPACITY)"
          - "GDP-family overlap (GROUND_DELAY_PROGRAM and GROUND_STOP candidates only): no other non-terminal GDP/GS TMI overlaps [program_start, program_end) on the same facility (ERR_TMI_OVERLAP); overlapping AIRSPACE_FLOW_PROGRAM TMIs interact only through the aggregate rate gate"
        side_effects:
          - "Slot generation runs only when tmi_type == GROUND_DELAY_PROGRAM (GROUND_STOP/AIRSPACE_FLOW_PROGRAM/REROUTE activate with status flip only): run calculations.rbs_slot_allocation — generate ArrivalSlot rows (slot k at program_start + k*(3600/controlled_rate)s), tag last reserved_slots as is_ga_reserved, assign eligible flights positionally in schedule order"
          - "For each assigned flight: control_status -> SLOTTED, controlled_arrival := slot_time, provisional_delay_minutes recomputed (calculations.provisional_vs_final_delay PROVISIONAL variant); overflow flights get controlled_arrival := program_end, is_overflow := true, control_status stays UNCONTROLLED"
          - "Create OperatorDelayLedger per operator with >= 1 eligible flight; create INITIAL_ASSIGNMENT SlotTransaction per assigned/overflow flight"
          - "Recompute fair_share_minutes / deviation_minutes on all ledgers of this TMI (calculations.operator_delay_distribution)"
          - "status -> ACTIVE; activated_at := current clock; version += 1"

      - from: ACTIVE
        to: REVISING
        trigger: "POST /atfm/tmis/{id}/revisions"
        actor: FlowManager
        preconditions:
          - "TMI in ACTIVE (else ERR_TMI_NOT_ACTIVE)"
          - "expected_tmi_version == tmi.version (ERR_STALE_VERSION, 412)"
          - "At least one of new_controlled_rate / new_program_end supplied (ERR_INVALID_REQUEST)"
          - "new_controlled_rate (if supplied) must be a valid GDP rate and <= max_feasible_rate (ERR_INVALID_RATE / ERR_RATE_EXCEEDS_CAPACITY); new_program_end (if supplied) must be > program_start and > current clock (ERR_INVALID_WINDOW / ERR_PROGRAM_WINDOW_IN_PAST)"
        side_effects:
          - "Create TMIRevision (origin MANUAL, applied = false, revision_index = revision_count + 1)"
          - "revision_count += 1; status -> REVISING; version += 1"
        note: "While REVISING, substitutions, compression runs, reroute assignments and GA adjudication are rejected with ERR_TMI_NOT_ACTIVE."

      - from: ACTIVE
        to: REVISING
        trigger: "system: ConstraintEvent CONFIRMED/extended triggers capacity downgrade (calculations.max_feasible_rate collapses below controlled_rate)"
        actor: system
        preconditions:
          - "TMI is a GROUND_DELAY_PROGRAM in ACTIVE whose facility window overlaps the newly CONFIRMED/extended ConstraintEvent"
          - "implied_rate = floor(base_acceptance_rate * product of (1 - step*severity) over CONFIRMED events overlapping the TMI window, floored at 10% of base, min 1) < controlled_rate"
        side_effects:
          - "Create TMIRevision (origin SYSTEM_AUTO_DOWNGRADE, new_controlled_rate = largest valid GDP rate <= implied_rate, or 6 when implied_rate < 6)"
          - "revision_count += 1; status -> REVISING; version += 1"
        note: "Cascade link: ConstraintEvent -> CapacityForecast STALE -> this transition -> TMIRevision record."

      - from: REVISING
        to: ACTIVE
        trigger: "POST /atfm/tmis/{id}/activate"
        actor: FlowManager
        preconditions:
          - "TMI in REVISING with exactly one unapplied TMIRevision"
          - "Facility status != OUTAGE (ERR_FACILITY_NOT_OPERATIONAL)"
        side_effects:
          - "Apply the pending revision: controlled_rate/program_end updated from the TMIRevision; revision.applied := true; applied_at := clock"
          - "Full re-derivation (calculations.rbs_slot_allocation REAPPLY mode): GA-accommodated flights keep their slots; all other slots are torn down and rebuilt over the new rate/window; eligible flight set re-snapshotted; flights whose CTA changed get REVISION_MOVE SlotTransactions and recomputed provisional_delay_minutes"
          - "Recompute ledgers (attributed_delay_minutes, flight_count) and fair shares"
          - "status -> ACTIVE; version += 1"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /atfm/tmis/{id}/cancel"
        actor: CommandCenterAdmin
        preconditions: ["TMI in PROPOSED or PUBLISHED or ACTIVE or REVISING (else ERR_TMI_TERMINAL)"]
        side_effects:
          - "status -> CANCELLED; version += 1"
        note: "From PROPOSED/PUBLISHED no slot compensation is needed (nothing allocated yet)."

      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /atfm/tmis/{id}/cancel"
        actor: CommandCenterAdmin
        preconditions: ["TMI in PROPOSED or PUBLISHED or ACTIVE or REVISING (else ERR_TMI_TERMINAL)"]
        side_effects:
          - "status -> CANCELLED; version += 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /atfm/tmis/{id}/cancel"
        actor: CommandCenterAdmin
        preconditions: ["TMI in ACTIVE or REVISING (else ERR_TMI_TERMINAL)"]
        side_effects:
          - "Cascade link 1: every ASSIGNED ArrivalSlot -> RELEASED"
          - "Cascade link 2 (caused by each slot release): holder flight's controlled_arrival := null, control_status -> UNCONTROLLED, provisional_delay_minutes := 0, is_overflow := false; REVERSAL SlotTransaction with delay_delta = -prior attributed delay; operator ledger attributed_delay_minutes decremented and reversed_delay_minutes incremented by the same amount"
          - "All REQUESTED/WAITLISTED GAAccommodationRequests on this TMI -> EXPIRED"
          - "status -> CANCELLED; version += 1"

      - from: REVISING
        to: CANCELLED
        trigger: "POST /atfm/tmis/{id}/cancel"
        actor: CommandCenterAdmin
        preconditions: ["TMI in ACTIVE or REVISING (else ERR_TMI_TERMINAL)"]
        side_effects:
          - "Same compensation cascade as ACTIVE -> CANCELLED (slots released, flights reverted, ledgers reversed, GA requests expired)"
          - "status -> CANCELLED; version += 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /atfm/tmis/{id}/complete"
        actor: CommandCenterAdmin
        preconditions:
          - "TMI in ACTIVE or REVISING (else ERR_INVALID_STATE / ERR_TMI_TERMINAL)"
        side_effects:
          - "Run calculations.provisional_vs_final_delay FINAL variant per controlled flight: final_delay_minutes = max(0, provisional - self_inflicted)"
          - "Each Operator.cumulative_delay_minutes += sum of final_delay_minutes over that operator's flights in this program; ledgers reconciled"
          - "Remaining OPEN/RELEASED slots -> RELEASED (terminal); ASSIGNED slots stay ASSIGNED for audit"
          - "REQUESTED/WAITLISTED GAAccommodationRequests -> EXPIRED"
          - "status -> COMPLETED; version += 1"

      - from: REVISING
        to: COMPLETED
        trigger: "POST /atfm/tmis/{id}/complete"
        actor: CommandCenterAdmin
        preconditions: ["TMI in ACTIVE or REVISING (else ERR_INVALID_STATE / ERR_TMI_TERMINAL)"]
        side_effects:
          - "Same finalization as ACTIVE -> COMPLETED (final attribution, cumulative update, slots released, GA expired)"
          - "status -> COMPLETED; version += 1"

  - entity: Flight
    initial_state: "SCHEDULED / UNCONTROLLED"
    terminal_states: ["LANDED (ops)", "CANCELLED (ops)"]
    transitions:
      - from: "ops SCHEDULED"
        to: "ops AIRBORNE"
        trigger: "POST /atfm/flights/{id}/updates with new_ops_status = AIRBORNE"
        actor: Operator
        preconditions:
          - "X-User-ID == flight.operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "expected_flight_version == flight.version (ERR_STALE_VERSION)"
          - "ops_status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "ops_status -> AIRBORNE; if new_eta supplied: estimated_arrival := new_eta, last_eta_reported_at := clock; version += 1"
      - from: "ops AIRBORNE"
        to: "ops LANDED"
        trigger: "POST /atfm/flights/{id}/updates with new_ops_status = LANDED"
        actor: Operator
        preconditions:
          - "X-User-ID == flight.operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "expected_flight_version == flight.version (ERR_STALE_VERSION)"
          - "ops_status == AIRBORNE (else ERR_INVALID_STATE)"
        side_effects:
          - "ops_status -> LANDED; ETA fields updated if supplied; version += 1"
      - from: "ops SCHEDULED"
        to: "ops SCHEDULED"
        trigger: "POST /atfm/flights/{id}/updates with new_eta only (no new_ops_status)"
        actor: Operator
        preconditions:
          - "X-User-ID == flight.operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "expected_flight_version == flight.version (ERR_STALE_VERSION)"
          - "ops_status in {SCHEDULED, AIRBORNE} (LANDED/CANCELLED -> ERR_INVALID_STATE)"
        side_effects:
          - "estimated_arrival := new_eta; last_eta_reported_at := clock; version += 1; ops_status unchanged (ETA-only data-exchange report)"
      - from: "ops AIRBORNE"
        to: "ops AIRBORNE"
        trigger: "POST /atfm/flights/{id}/updates with new_eta only (no new_ops_status)"
        actor: Operator
        preconditions:
          - "X-User-ID == flight.operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "expected_flight_version == flight.version (ERR_STALE_VERSION)"
          - "ops_status in {SCHEDULED, AIRBORNE} (LANDED/CANCELLED -> ERR_INVALID_STATE)"
        side_effects:
          - "estimated_arrival := new_eta; last_eta_reported_at := clock; version += 1; ops_status unchanged"
      - from: "ops SCHEDULED"
        to: "ops CANCELLED"
        trigger: "POST /atfm/flights/{id}/cancel"
        actor: Operator
        preconditions:
          - "X-User-ID == flight.operator_id (ERR_NOT_RESOURCE_OWNER)"
          - "ops_status == SCHEDULED (AIRBORNE/LANDED -> ERR_FLIGHT_NOT_CANCELLABLE)"
        side_effects:
          - "Cascade link 1: if control_status == SLOTTED, its ArrivalSlot -> RELEASED and a RELEASE SlotTransaction is written with delay_delta = -provisional_delay_minutes"
          - "Cascade link 2 (caused by the release): flight.controlled_arrival := null, control_status -> UNCONTROLLED, provisional_delay_minutes := 0, is_overflow := false; operator ledger attributed_delay_minutes decremented by the same amount and flight_count decremented by 1"
          - "ops_status -> CANCELLED; version += 1"
      - from: "control UNCONTROLLED"
        to: "control SLOTTED"
        trigger: "system: TMI activation / revision re-derivation / compression / GA accommodation assigns a slot"
        actor: system
        preconditions: ["flight not ops CANCELLED"]
        side_effects:
          - "control_status -> SLOTTED; controlled_arrival := assigned slot_time; provisional_delay_minutes recomputed; version += 1"
      - from: "control SLOTTED"
        to: "control UNCONTROLLED"
        trigger: "system: slot released (flight cancel, TMI cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "control_status -> UNCONTROLLED; controlled_arrival := null; provisional_delay_minutes := 0; version += 1"
    note: "Parallel dimensions: ops_status (SCHEDULED/AIRBORNE/LANDED/CANCELLED) and control_status (UNCONTROLLED/SLOTTED) evolve independently on the same row; e.g. a flight may be AIRBORNE and SLOTTED, and a TMI cancel returns control to UNCONTROLLED without touching ops_status."

  - entity: ConstraintEvent
    initial_state: REPORTED
    terminal_states: [CLEARED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /atfm/constraint-events/{id}/confirm"
        actor: FlowManager
        preconditions: ["status == REPORTED (else ERR_INVALID_STATE)"]
        side_effects:
          - "Cascade link 1: every PUBLISHED CapacityForecast on the same facility whose window overlaps the event window -> STALE"
          - "Cascade link 2: for each ACTIVE GROUND_DELAY_PROGRAM on the facility overlapping the event, recompute implied capacity; if implied < controlled_rate, auto-transition that TMI ACTIVE -> REVISING and create a SYSTEM_AUTO_DOWNGRADE TMIRevision"
          - "status -> CONFIRMED; version += 1"
      - from: REPORTED
        to: CLEARED
        trigger: "POST /atfm/constraint-events/{id}/clear"
        actor: FlowManager
        preconditions: ["status in {REPORTED, CONFIRMED} (else ERR_INVALID_STATE)"]
        side_effects: ["status -> CLEARED; version += 1"]
      - from: CONFIRMED
        to: CLEARED
        trigger: "POST /atfm/constraint-events/{id}/clear"
        actor: FlowManager
        preconditions: ["status in {REPORTED, CONFIRMED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "status -> CLEARED; version += 1"
        note: "Clearing does NOT un-STALE forecasts; a fresh forecast must be created and published."
      - from: REPORTED
        to: REPORTED
        trigger: "POST /atfm/constraint-events/{id}/extend"
        actor: FlowManager
        preconditions:
          - "status in {REPORTED, CONFIRMED} (else ERR_INVALID_STATE)"
          - "extension_count < CONSTRAINT_EVENT_MAX_EXTENSIONS (2) (ERR_EXTENSION_LIMIT_EXCEEDED)"
          - "new window_end > current window_end (ERR_INVALID_WINDOW)"
          - "No overlap with another non-CLEARED event of the same event_type on the facility (ERR_CONSTRAINT_EVENT_OVERLAP)"
        side_effects: ["window_end := new value; severity updated if supplied; extension_count += 1; version += 1"]
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /atfm/constraint-events/{id}/extend"
        actor: FlowManager
        preconditions:
          - "status in {REPORTED, CONFIRMED} (else ERR_INVALID_STATE)"
          - "extension_count < 2 (ERR_EXTENSION_LIMIT_EXCEEDED); new window_end > current (ERR_INVALID_WINDOW); no same-type overlap (ERR_CONSTRAINT_EVENT_OVERLAP)"
        side_effects:
          - "window_end/severity updated; extension_count += 1; version += 1"
          - "Same STALE + auto-downgrade cascades as confirm (event still CONFIRMED with a wider window)"

  - entity: CapacityForecast
    initial_state: DRAFT
    terminal_states: [STALE]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /atfm/capacity-forecasts/{id}/publish"
        actor: FlowManager
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["status -> PUBLISHED; published_at := clock; version += 1"]
      - from: PUBLISHED
        to: STALE
        trigger: "system: an overlapping ConstraintEvent on the same facility is confirmed or extended"
        actor: system
        preconditions: []
        side_effects:
          - "status -> STALE; version += 1"
          - "Cascade: ACTIVE GROUND_DELAY_PROGRAM TMIs relying on this facility are re-evaluated (see TMI ACTIVE -> REVISING system transition)"

  - entity: ArrivalSlot
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "system: RBS allocation, compression move, or GA accommodation"
        actor: system
        preconditions: ["slot status == OPEN"]
        side_effects: ["assigned_flight_id set; original_flight_id set on first assignment; version += 1"]
      - from: ASSIGNED
        to: RELEASED
        trigger: "system: holder flight cancelled, or TMI cancel/complete cascade"
        actor: system
        preconditions: ["slot status == ASSIGNED"]
        side_effects: ["assigned_flight_id := null; version += 1; triggers flight revert + ledger reversal"]
      - from: ASSIGNED
        to: OPEN
        trigger: "system: holder moved to an earlier slot inside a compression pass"
        actor: system
        preconditions: ["slot status == ASSIGNED"]
        side_effects: ["assigned_flight_id := null; version += 1; slot re-enters the compression pool in the same pass"]
      - from: RELEASED
        to: OPEN
        trigger: "system: compression run ends with the slot unclaimed"
        actor: system
        preconditions: ["slot status == RELEASED"]
        side_effects: ["status -> OPEN; version += 1"]

  - entity: GAAccommodationRequest
    initial_state: REQUESTED
    terminal_states: [ACCOMMODATED, DENIED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ACCOMMODATED
        trigger: "POST /atfm/ga-requests/{id}/adjudicate with decision = ACCOMMODATE"
        actor: FlowManager
        preconditions:
          - "request status in {REQUESTED, WAITLISTED} (else ERR_INVALID_STATE)"
          - "TMI in ACTIVE (ERR_TMI_NOT_ACTIVE)"
          - "Quota predicate: accommodated_count < reserved_slots, where accommodated_count == number of is_ga_reserved slots currently ASSIGNED to GA-created flights (a cancelled GA flight frees its quota headroom); AND an OPEN is_ga_reserved slot exists with requested_window_start <= slot_time <= requested_window_end. If either fails, the request transitions to WAITLISTED instead of erroring"
        side_effects:
          - "Cascade: create Flight (operator_id := request.operator_id, designator 'GA-' + request.id[:8], scheduled_arrival := requested_window_start, arrival_facility_id := tmi.facility_id); slot -> ASSIGNED; flight control_status -> SLOTTED with CTA := slot_time"
          - "GA_ASSIGNMENT SlotTransaction; operator ledger created/updated; fair shares recomputed"
          - "status -> ACCOMMODATED; accommodated_flight_id / accommodated_slot_time set; version += 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /atfm/ga-requests/{id}/adjudicate with decision = ACCOMMODATE when quota/slot unavailable"
        actor: FlowManager
        preconditions: ["request status == REQUESTED; TMI ACTIVE"]
        side_effects: ["status -> WAITLISTED; version += 1"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /atfm/ga-requests/{id}/adjudicate with decision = DENY"
        actor: FlowManager
        preconditions: ["request status in {REQUESTED, WAITLISTED} (else ERR_INVALID_STATE)"]
        side_effects: ["status -> DENIED; version += 1"]
      - from: WAITLISTED
        to: ACCOMMODATED
        trigger: "POST /atfm/ga-requests/{id}/adjudicate with decision = ACCOMMODATE (retry), or system: compression run promotes waitlisted requests into freed reserved slots"
        actor: FlowManager
        preconditions: ["same quota predicate as REQUESTED -> ACCOMMODATED; promotion order when the system path applies: priority_class HIGH_PRIORITY before STANDARD, then request created_at ASC; slot_time must lie within the request window"]
        side_effects: ["Same accommodation cascade as adjudicate ACCOMMODATE (flight created, slot assigned, transaction written)"]
      - from: WAITLISTED
        to: DENIED
        trigger: "POST /atfm/ga-requests/{id}/adjudicate with decision = DENY"
        actor: FlowManager
        preconditions: ["request status in {REQUESTED, WAITLISTED}"]
        side_effects: ["status -> DENIED; version += 1"]
      - from: REQUESTED
        to: EXPIRED
        trigger: "system: TMI cancelled or completed while request pending"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; version += 1"]
      - from: WAITLISTED
        to: EXPIRED
        trigger: "system: TMI cancelled or completed while request pending"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; version += 1"]

  - entity: Facility
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: "OPERATIONAL"
        to: "DEGRADED"
        trigger: "PATCH /atfm/facilities/{id} with status"
        actor: SystemAdministrator
        preconditions: ["status value in {OPERATIONAL, DEGRADED, OUTAGE} (else ERR_INVALID_REQUEST)"]
        side_effects: ["status updated; version += 1"]
      - from: "OPERATIONAL"
        to: "OUTAGE"
        trigger: "PATCH /atfm/facilities/{id} with status"
        actor: SystemAdministrator
        preconditions: ["status value in {OPERATIONAL, DEGRADED, OUTAGE} (else ERR_INVALID_REQUEST)"]
        side_effects: ["status updated; version += 1"]
      - from: "DEGRADED"
        to: "OPERATIONAL"
        trigger: "PATCH /atfm/facilities/{id} with status"
        actor: SystemAdministrator
        preconditions: []
        side_effects: ["status updated; version += 1"]
      - from: "DEGRADED"
        to: "OUTAGE"
        trigger: "PATCH /atfm/facilities/{id} with status"
        actor: SystemAdministrator
        preconditions: []
        side_effects: ["status updated; version += 1"]
      - from: "OUTAGE"
        to: "OPERATIONAL"
        trigger: "PATCH /atfm/facilities/{id} with status"
        actor: SystemAdministrator
        preconditions: []
        side_effects: ["status updated; version += 1"]
      - from: "OUTAGE"
        to: "DEGRADED"
        trigger: "PATCH /atfm/facilities/{id} with status"
        actor: SystemAdministrator
        preconditions: []
        side_effects: ["status updated; version += 1"]
    note: "OUTAGE gates downstream behavior (TMI activation, reroute assignments) but forces no cascade; DEGRADED is informational."

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: tmi-revision-stale-version
    parent_entity: TrafficManagementInitiative
    write_endpoint: "POST /atfm/tmis/{id}/revisions"
    occ_field: expected_tmi_version
    description: |
      Creating a TMIRevision against a TMI whose version has advanced since the
      client last observed it is rejected. Revisions legitimately succeed one
      after another (each returns the TMI to ACTIVE only via activate), so a
      client holding a stale version must be told its view is out of date rather
      than silently chaining on a moved baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: flight-update-stale-version
    parent_entity: Flight
    write_endpoint: "POST /atfm/flights/{id}/updates"
    occ_field: expected_flight_version
    description: |
      Submitting an ETA/ops update against a Flight whose version has advanced
      since the client last observed it is rejected. ETA updates are always
      legal on non-terminal flights and never change a state field that would
      reject a later update, so the only correct rejection is a stale-version
      check (a cascaded slot mutation may have bumped the version in between).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: capacity_forecast_rate
    trigger: "POST /atfm/facilities/{id}/capacity-forecasts (computed at creation, immutable thereafter)"
    algorithm: aggregation
    formula: |
      raw_multiplier = PRODUCT over included events e of (1 - STEP(e.event_type) * e.severity * weight(e))
        where weight(e) = 1.0 for CONFIRMED events
              weight(e) = REPORTED_EVENT_WEIGHT (0.5) for REPORTED events (OPERATIONAL variant only)
      effective_multiplier = max(raw_multiplier, MIN_CAPACITY_FLOOR_PCT / 100)   # 0.10 floor
      predicted_acceptance_rate = max(1, floor(facility.base_acceptance_rate * effective_multiplier))
    input_set: "ConstraintEvents on the facility whose [window_start, window_end) overlaps the forecast window (half-open); PLANNING variant: status == CONFIRMED only; OPERATIONAL variant: status in {CONFIRMED, REPORTED}. CLEARED events are always excluded."
    constants:
      WEATHER_IMPACT_STEP: 0.15
      STAFFING_IMPACT_STEP: 0.10
      EQUIPMENT_IMPACT_STEP: 0.05
      REPORTED_EVENT_WEIGHT: 0.5
      MIN_CAPACITY_FLOOR_PCT: 10
    precision: "integer flights/hour; floor after multiplication; multiplication is commutative so event order is irrelevant"
    variants:
      - name: PLANNING
        when: "forecast created with variant = PLANNING; the only variant accepted by the TMI publish/activate gate"
        difference: "includes CONFIRMED events only; REPORTED events excluded entirely"
      - name: OPERATIONAL
        when: "forecast created with variant = OPERATIONAL"
        difference: "additionally includes REPORTED events weighted at 0.5 impact, so identical facility data yields a lower (or equal) predicted rate"

  - name: max_feasible_rate
    trigger: "TMI propose (GDP/AFP), publish, activate, and auto-downgrade evaluation"
    algorithm: threshold
    formula: |
      if any GROUND_STOP TMI OTHER THAN THE CANDIDATE ITSELF on the facility has
         status in {PUBLISHED, ACTIVE, REVISING} and its window overlaps the candidate
         window (half-open):
          return 0
      forecast_rate = predicted_acceptance_rate of the gate forecast
        (latest published_at PUBLISHED non-STALE PLANNING forecast covering the window;
         tie-break created_at ASC; none -> gate fails with ERR_NO_CURRENT_FORECAST)
      afp_load = SUM of controlled_rate over AIRSPACE_FLOW_PROGRAM TMIs on the facility
        with status in {PUBLISHED, ACTIVE, REVISING} overlapping the candidate window,
        EXCLUDING the candidate TMI itself
      max_feasible = max(0, min(forecast_rate, facility.base_acceptance_rate) - afp_load)
    input_set: "one Facility, one window, the gate forecast, overlapping non-terminal AFP/GS TMIs"
    constants: {}
    precision: "integer flights/hour"
    variants: []

  - name: rbs_slot_allocation
    trigger: "TMI activate (INITIAL mode) and revision apply (REAPPLY mode)"
    algorithm: chronological
    formula: |
      interval_seconds = 3600 / controlled_rate            # exact; rate validity guarantees divisibility
      slot_count = floor((program_end - program_start) / interval_seconds)
      reserved_slots = max(GA_MIN_RESERVED, floor(slot_count * GA_QUOTA_PCT / 100))
      slots k = 0 .. slot_count-1 at program_start + k * interval_seconds;
        the LAST reserved_slots slots carry is_ga_reserved = true and are skipped by carrier allocation
      eligible_flights = flights with arrival_facility_id == tmi.facility_id,
        ops_status in {SCHEDULED, AIRBORNE}, control_status == UNCONTROLLED,
        and program_start <= scheduled_arrival < program_end
      order eligible_flights by scheduled_arrival ASC, tie-break created_at ASC   # ration-by-schedule
      positional assignment: flight j takes the j-th non-reserved slot (ascending slot_time)
      CTA := slot_time; flights beyond the last non-reserved slot are overflow:
        controlled_arrival := program_end (virtual, no ArrivalSlot row), is_overflow := true
      delay_minutes = max(0, floor((CTA - scheduled_arrival) / 60 seconds))
      REAPPLY mode: GA-accommodated flights keep their slots; all other slots torn down and rebuilt;
        changed CTAs emit REVISION_MOVE transactions
    input_set: "the TMI, its facility, eligible flights at the snapshot instant"
    constants:
      GA_QUOTA_PCT: 10
      GA_MIN_RESERVED: 1
    precision: "slot times exact seconds; delay in whole minutes, floor"
    variants: []

  - name: compression_reallocation
    trigger: "POST /atfm/tmis/{id}/compression-runs (TMI must be ACTIVE)"
    algorithm: waterfall_allocation
    formula: |
      PINNED EVALUATION ORDER (kills the circular dependency between moves and pool contents):
      (1) snapshot all slots and assignments
      (2) released_pool = slots with status RELEASED (holders cancelled) plus slots already RELEASED
          from earlier activity, ordered slot_time ASC
      (2a) GA PROMOTION FIRST: WAITLISTED GAAccommodationRequests ranked by
          priority_class (HIGH_PRIORITY before STANDARD) then created_at ASC consume
          is_ga_reserved slots in released_pool whose slot_time lies within each request's
          window, while accommodated_count < reserved_slots (accommodated_count ==
          number of is_ga_reserved slots currently ASSIGNED to GA-created flights);
          each promotion runs the accommodation cascade (new Flight, slot ASSIGNED,
          GA_ASSIGNMENT transaction)
      (3) candidates = flights holding ASSIGNED slots with ops_status != CANCELLED,
          ordered scheduled_arrival ASC, tie-break created_at ASC (RBS order preserved)
      (4) walk candidates in order: each takes the EARLIEST pool slot with
          slot_time < its current slot_time; its freed slot is inserted into the pool
          (kept slot_time ASC) and is reusable by later candidates IN THE SAME PASS;
          reserved-flagged pool slots are available to carrier candidates ONLY when no
          WAITLISTED GA request exists for this TMI
      (5) repeat passes until a pass makes zero moves or COMPRESSION_MAX_PASSES (3) passes ran;
          passes_executed counts the final no-move pass; minimum 1
      (6) unclaimed RELEASED slots -> OPEN; record CompressionRun counters
      each move emits a COMPRESSION_MOVE SlotTransaction (from_slot_time, to_slot_time,
      delay_delta = new provisional delay - old provisional delay) and reconciles ledgers
    input_set: "ACTIVE GDP, its slots, its SLOTTED flights, its WAITLISTED GA requests"
    constants:
      COMPRESSION_MAX_PASSES: 3
    precision: "whole minutes, floor"
    variants: []

  - name: provisional_vs_final_delay
    trigger: "PROVISIONAL: every slot mutation on a flight; FINAL: TMI completion"
    algorithm: aggregation
    formula: |
      PROVISIONAL (while TMI ACTIVE/REVISING):
        provisional_delay_minutes = max(0, floor((controlled_arrival - scheduled_arrival) / 60s));
        0 while control_status == UNCONTROLLED
      FINAL (at TMI -> COMPLETED):
        self_inflicted_minutes = max(0, floor((estimated_arrival - scheduled_arrival) / 60s))
          when the operator's last ETA report pushed estimated_arrival beyond scheduled_arrival,
          else 0
        final_delay_minutes = max(0, provisional_delay_minutes - self_inflicted_minutes)
    input_set: "single flight (and its last ETA report)"
    constants: {}
    precision: "whole minutes, floor"
    variants:
      - name: PROVISIONAL
        when: "program running; recomputed on every slot mutation"
        difference: "counts every minute of CTA-minus-schedule, including delay the operator caused itself"
      - name: FINAL
        when: "TMI completion"
        difference: "nets out self-inflicted minutes (estimated_arrival beyond schedule), so identical slot data yields a smaller (or equal) value"

  - name: operator_delay_distribution
    trigger: "at TMI activation and after every delay-affecting mutation (substitution, compression, revision apply, cancellation removal)"
    algorithm: aggregation
    formula: |
      total_delay = SUM of attributed_delay_minutes over all OperatorDelayLedgers of the TMI
      total_flights = SUM of flight_count over those ledgers
      for each ledger: raw_share = total_delay * flight_count / total_flights
      PINNED ROUNDING ORDER (per-ledger floor THEN largest remainder; never round-half each):
        fair_share = floor(raw_share)
        leftover = total_delay - SUM(fair_share)
        distribute leftover as +1 per ledger ordered by fractional remainder DESC,
          tie-break: operator whose earliest in-program flight has the earliest
          scheduled_arrival ASC, then operator created_at ASC
      deviation_minutes = attributed_delay_minutes - fair_share_minutes
    input_set: "all OperatorDelayLedgers of one TMI"
    constants: {}
    precision: "integer minutes; floor per ledger then largest-remainder top-up"
    variants: []

  - name: reroute_sector_load
    trigger: "POST /atfm/tmis/{id}/reroute-assignments"
    algorithm: threshold
    formula: |
      hourly_bucket = flight.estimated_arrival truncated to the hour (UTC)
      load = count of RerouteAssignments with the same via_sector_id and hourly_bucket
      reject when load >= sector.base_acceptance_rate (ERR_SECTOR_CAPACITY_EXCEEDED);
      boundary: load == rate - 1 is accepted, load == rate is rejected
    input_set: "target sector Facility, flight ETA hour bucket, existing assignments"
    constants: {}
    precision: "integer count per hourly bucket"
    variants: []

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The declared role is permitted on this endpoint per the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Entity-backed ownership: when X-User-Role is Operator, X-User-ID must equal the owning operator id (path operator id, flight.operator_id, or operator of every flight referenced in the body)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /atfm/operators/{id}/flights, POST /atfm/flights/{id}/updates, POST /atfm/flights/{id}/cancel, POST /atfm/operators/{id}/ga-requests, POST /atfm/tmis/{id}/substitutions"

  - priority: 4
    category: existence
    check: "Path-template ids resolve left-to-right (facility -> tmi/forecast/event; operator -> flight; ga-request); body FK references (arrival_facility_id, tmi_id, flight_id_1/2, flight_id, via_sector_id) resolve"
    error_id: ERR_FACILITY_NOT_FOUND
    http_status: 404
    applies_to: "all (specific ids yield ERR_OPERATOR_NOT_FOUND, ERR_FLIGHT_NOT_FOUND, ERR_TMI_NOT_FOUND, ERR_CONSTRAINT_EVENT_NOT_FOUND, ERR_FORECAST_NOT_FOUND, ERR_GA_REQUEST_NOT_FOUND, ERR_REROUTE_ASSIGNMENT_NOT_FOUND)"

  - priority: 5
    category: state
    check: "State preconditions of the endpoint's transition: TMI in the required state (publish needs PROPOSED; activate needs PUBLISHED or REVISING; substitutions/compression/GA-adjudicate/reroute-assign need ACTIVE else ERR_TMI_NOT_ACTIVE; any action on CANCELLED/COMPLETED -> ERR_TMI_TERMINAL); constraint-event transitions from a legal from-state; flight ops transitions follow SCHEDULED -> AIRBORNE -> LANDED; facility not in OUTAGE for activate/reroute (ERR_FACILITY_NOT_OPERATIONAL)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: the publisher's X-User-ID must differ from tmi.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /atfm/tmis/{id}/publish"

  - priority: 7
    category: business_safety
    check: "Reroute sector capacity: count of existing RerouteAssignments for (via_sector_id, hourly_bucket) must be < sector.base_acceptance_rate"
    error_id: ERR_SECTOR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /atfm/tmis/{id}/reroute-assignments"

  - priority: 8
    category: business_temporal
    check: "Window well-formed: every windowed create/extend requires start < end (constraint events, forecasts, TMIs, GA requests, revision new_program_end)"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /atfm/facilities/{id}/constraint-events, POST /atfm/facilities/{id}/capacity-forecasts, POST /atfm/facilities/{id}/tmis, POST /atfm/tmis/{id}/revisions, POST /atfm/constraint-events/{id}/extend, POST /atfm/operators/{id}/ga-requests"

  - priority: 9
    category: business_temporal
    check: "TMI program_end must be strictly after the current logical clock at propose time (and new_program_end at revision time)"
    error_id: ERR_PROGRAM_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /atfm/facilities/{id}/tmis, POST /atfm/tmis/{id}/revisions"

  - priority: 10
    category: business_temporal
    check: "GA request window must lie entirely inside the target program window: program_start <= requested_window_start < requested_window_end <= program_end"
    error_id: ERR_GA_WINDOW_OUTSIDE_PROGRAM
    http_status: 422
    applies_to: "POST /atfm/operators/{id}/ga-requests"

  - priority: 11
    category: business_temporal
    check: "Substitution data freshness: both flights' last_eta_reported_at must be within FLIGHT_DATA_FRESHNESS_SECONDS (3600) of the current logical clock (CDM data-exchange requirement)"
    error_id: ERR_STALE_FLIGHT_DATA
    http_status: 422
    applies_to: "POST /atfm/tmis/{id}/substitutions"

  - priority: 12
    category: business_constraint
    check: "Facility ident uniqueness across all facilities"
    error_id: ERR_FACILITY_IDENT_CONFLICT
    http_status: 409
    applies_to: "POST /atfm/facilities"

  - priority: 13
    category: business_constraint
    check: "Constraint-event overlap: no other non-CLEARED event of the SAME event_type on the same facility may overlap the half-open window [window_start, window_end); adjacency (new.start == existing.end) is allowed"
    error_id: ERR_CONSTRAINT_EVENT_OVERLAP
    http_status: 409
    applies_to: "POST /atfm/facilities/{id}/constraint-events, POST /atfm/constraint-events/{id}/extend"

  - priority: 14
    category: business_constraint
    check: "GDP-family exclusivity: no other GROUND_DELAY_PROGRAM or GROUND_STOP TMI on the same facility with status in {PROPOSED, PUBLISHED, ACTIVE, REVISING} may overlap [program_start, program_end); AIRSPACE_FLOW_PROGRAM/REROUTE TMIs are exempt from this hard rule (they interact through aggregate capacity instead). Re-checked at activation since another program may have activated in between."
    error_id: ERR_TMI_OVERLAP
    http_status: 409
    applies_to: "POST /atfm/facilities/{id}/tmis, POST /atfm/tmis/{id}/activate"

  - priority: 15
    category: business_constraint
    check: "Rate format: GROUND_DELAY_PROGRAM controlled_rate must satisfy 6 <= r <= 60 and 3600 % r == 0; AIRSPACE_FLOW_PROGRAM 1..60; GROUND_STOP must be 0; REROUTE ignored (stored 0)"
    error_id: ERR_INVALID_RATE
    http_status: 422
    applies_to: "POST /atfm/facilities/{id}/tmis, POST /atfm/tmis/{id}/revisions"

  - priority: 16
    category: business_constraint
    check: "Referenced facility types: flight arrival_facility_id must be an AIRPORT (ERR_FACILITY_TYPE_NOT_AIRPORT); reroute via_sector_id must be an EN_ROUTE_SECTOR (ERR_REROUTE_SECTOR_TYPE); GA request tmi_id must be a GROUND_DELAY_PROGRAM (ERR_TMI_TYPE_NOT_GDP)"
    error_id: ERR_FACILITY_TYPE_NOT_AIRPORT
    http_status: 422
    applies_to: "POST /atfm/operators/{id}/flights, POST /atfm/tmis/{id}/reroute-assignments, POST /atfm/operators/{id}/ga-requests"

  - priority: 17
    category: business_constraint
    check: "Operator-type eligibility: GA accommodation requests only from operator_type GENERAL_AVIATION or UNSCHEDULED_CHARTER"
    error_id: ERR_OPERATOR_TYPE_INELIGIBLE
    http_status: 422
    applies_to: "POST /atfm/operators/{id}/ga-requests"

  - priority: 18
    category: business_constraint
    check: "Substitution shape: flight_id_1 != flight_id_2 (ERR_SUBSTITUTION_SAME_FLIGHT); both flights must hold ASSIGNED slots in THIS TMI (ERR_FLIGHT_NOT_IN_PROGRAM); for each flight, |other slot_time - flight.scheduled_arrival| <= SUBSTITUTION_MAX_SHIFT_MINUTES (120) (ERR_SUBSTITUTION_SHIFT_EXCEEDED). Sub-order: same-flight, then in-program, then shift."
    error_id: ERR_SUBSTITUTION_SAME_FLIGHT
    http_status: 422
    applies_to: "POST /atfm/tmis/{id}/substitutions"

  - priority: 19
    category: business_constraint
    check: "Constraint-event extension cap: extension_count < CONSTRAINT_EVENT_MAX_EXTENSIONS (2)"
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /atfm/constraint-events/{id}/extend"

  - priority: 20
    category: business_fiscal
    check: "Capacity gate: controlled_rate <= max_feasible_rate(facility, window) at publish, activate, and manual revision (GROUND_DELAY_PROGRAM and AIRSPACE_FLOW_PROGRAM only; GROUND_STOP/REROUTE exempt). NOT checked at propose: the forecast may not exist yet, so the gate binds at publish/activate time."
    error_id: ERR_RATE_EXCEEDS_CAPACITY
    http_status: 422
    applies_to: "POST /atfm/tmis/{id}/publish, POST /atfm/tmis/{id}/activate, POST /atfm/tmis/{id}/revisions"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/atfm/facilities"
    description: "Create a facility (airport or en route sector) with its base acceptance rate"
    roles: [SystemAdministrator]
    code: 201
    input: [ident, facility_type, base_acceptance_rate, "status?"]
    output: Facility
    side_effects: []

  - method: GET
    path: "/atfm/facilities/{id}"
    description: "Fetch one facility"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: PATCH
    path: "/atfm/facilities/{id}"
    description: "Update base_acceptance_rate and/or status (OPERATIONAL | DEGRADED | OUTAGE); status gates TMI activation and reroute assignments"
    roles: [SystemAdministrator]
    code: 200
    input: ["base_acceptance_rate?", "status?"]
    output: Facility
    side_effects: ["increments Facility.version by 1"]

  - method: POST
    path: "/atfm/operators"
    description: "Register an operator (airline AOC, GA operator, unscheduled charter)"
    roles: [SystemAdministrator]
    code: 201
    input: [name, operator_type, "cdm_member?"]
    output: Operator
    side_effects: []

  - method: GET
    path: "/atfm/operators/{id}"
    description: "Fetch one operator"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: Operator
    side_effects: []

  - method: POST
    path: "/atfm/facilities/{id}/constraint-events"
    description: "Report a capacity constraint event (weather/staffing/equipment) on a facility"
    roles: [FlowManager]
    code: 201
    input: [event_type, severity, window_start, window_end]
    output: ConstraintEvent
    side_effects: ["creates ConstraintEvent in REPORTED"]

  - method: GET
    path: "/atfm/facilities/{id}/constraint-events"
    description: "List constraint events on a facility, filterable by status and event_type"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["status?", "event_type?", "limit?", "offset?"]
    output: "ConstraintEvent[]"
    side_effects: []

  - method: POST
    path: "/atfm/constraint-events/{id}/confirm"
    description: "Confirm a REPORTED constraint event; fires the forecast-STALE and TMI auto-downgrade cascades"
    roles: [FlowManager]
    code: 200
    input: []
    output: ConstraintEvent
    side_effects: ["PUBLISHED overlapping forecasts -> STALE", "overlapping ACTIVE GDPs whose implied rate collapsed -> REVISING with SYSTEM_AUTO_DOWNGRADE TMIRevision", "increments ConstraintEvent.version by 1"]

  - method: POST
    path: "/atfm/constraint-events/{id}/clear"
    description: "Clear a REPORTED or CONFIRMED constraint event (does not un-STALE forecasts)"
    roles: [FlowManager]
    code: 200
    input: []
    output: ConstraintEvent
    side_effects: ["increments ConstraintEvent.version by 1"]

  - method: POST
    path: "/atfm/constraint-events/{id}/extend"
    description: "Extend an event's window_end (and optionally severity); max CONSTRAINT_EVENT_MAX_EXTENSIONS = 2 extensions; CONFIRMED events re-fire the STALE cascade"
    roles: [FlowManager]
    code: 200
    input: [window_end, "severity?"]
    output: ConstraintEvent
    side_effects: ["extension_count += 1", "if CONFIRMED: forecast STALE + TMI auto-downgrade cascades", "increments ConstraintEvent.version by 1"]

  - method: POST
    path: "/atfm/facilities/{id}/capacity-forecasts"
    description: "Compute a capacity forecast (calculations.capacity_forecast_rate) over a window for a facility; result frozen at creation"
    roles: [FlowManager]
    code: 201
    input: [variant, window_start, window_end]
    output: CapacityForecast
    side_effects: ["runs capacity_forecast_rate with the requested variant; stores predicted_acceptance_rate and included_event_ids"]

  - method: GET
    path: "/atfm/facilities/{id}/capacity-forecasts"
    description: "List forecasts for a facility, filterable by status and variant"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["status?", "variant?", "limit?", "offset?"]
    output: "CapacityForecast[]"
    side_effects: []

  - method: POST
    path: "/atfm/capacity-forecasts/{id}/publish"
    description: "Publish a DRAFT forecast, making it eligible as the TMI activation gate forecast"
    roles: [FlowManager]
    code: 200
    input: []
    output: CapacityForecast
    side_effects: ["status -> PUBLISHED, published_at := clock", "increments CapacityForecast.version by 1"]

  - method: POST
    path: "/atfm/facilities/{id}/tmis"
    description: "Propose a traffic management initiative (GDP, ground stop, AFP, or reroute) on a facility"
    roles: [FlowManager]
    code: 201
    input: [tmi_type, program_start, program_end, "controlled_rate?"]
    output: TrafficManagementInitiative
    side_effects: ["creates TMI in PROPOSED", "records proposed_by_user_id := X-User-ID"]

  - method: GET
    path: "/atfm/facilities/{id}/tmis"
    description: "List TMIs on a facility, filterable by status and tmi_type"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["status?", "tmi_type?", "limit?", "offset?"]
    output: "TrafficManagementInitiative[]"
    side_effects: []

  - method: GET
    path: "/atfm/tmis/{id}"
    description: "Fetch one TMI"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: TrafficManagementInitiative
    side_effects: []

  - method: POST
    path: "/atfm/tmis/{id}/publish"
    description: "Publish a PROPOSED TMI (Command Center). Segregation of duties: publisher must differ from proposer. Re-checks the capacity gate."
    roles: [CommandCenterAdmin]
    code: 200
    input: []
    output: TrafficManagementInitiative
    side_effects: ["status -> PUBLISHED", "increments TrafficManagementInitiative.version by 1"]

  - method: POST
    path: "/atfm/tmis/{id}/activate"
    description: "Activate a PUBLISHED TMI (runs RBS slot allocation cascade) or apply the pending revision of a REVISING TMI (returns it to ACTIVE with re-derived slots)"
    roles: [FlowManager]
    code: 200
    input: []
    output: TrafficManagementInitiative
    side_effects: ["from PUBLISHED: generates slots, assigns flights (rbs_slot_allocation), creates ledgers and INITIAL_ASSIGNMENT transactions", "from REVISING: applies pending TMIRevision, re-derives slots (REVISION_MOVE transactions)", "increments TrafficManagementInitiative.version by 1"]

  - method: POST
    path: "/atfm/tmis/{id}/revisions"
    description: "Revise an ACTIVE TMI's controlled_rate and/or program_end; OCC-guarded; moves the TMI to REVISING until activate applies it"
    roles: [FlowManager]
    code: 201
    input: ["new_controlled_rate?", "new_program_end?", reason, expected_tmi_version]
    output: TMIRevision
    side_effects: ["creates TMIRevision (origin MANUAL, applied = false)", "TMI -> REVISING, revision_count += 1", "increments TrafficManagementInitiative.version by 1"]

  - method: GET
    path: "/atfm/tmis/{id}/revisions"
    description: "List revisions of a TMI in revision_index order"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: "TMIRevision[]"
    side_effects: []

  - method: POST
    path: "/atfm/tmis/{id}/cancel"
    description: "Cancel a non-terminal TMI; from ACTIVE/REVISING runs the full compensation cascade (slots released, flights reverted, ledgers reversed, GA requests expired)"
    roles: [CommandCenterAdmin]
    code: 200
    input: []
    output: TrafficManagementInitiative
    side_effects: ["compensation cascade per state_machines.TrafficManagementInitiative", "increments TrafficManagementInitiative.version by 1"]

  - method: POST
    path: "/atfm/tmis/{id}/complete"
    description: "Complete an ACTIVE/REVISING TMI; runs FINAL delay attribution and credits operator cumulative_delay_minutes"
    roles: [CommandCenterAdmin]
    code: 200
    input: []
    output: TrafficManagementInitiative
    side_effects: ["final delay attribution (provisional_vs_final_delay FINAL)", "Operator.cumulative_delay_minutes credited", "remaining OPEN slots -> RELEASED", "pending GA requests -> EXPIRED", "increments TrafficManagementInitiative.version by 1"]

  - method: POST
    path: "/atfm/operators/{id}/flights"
    description: "File a flight with its original schedule; X-User-ID must equal the path operator id"
    roles: [Operator]
    code: 201
    input: [designator, origin, arrival_facility_id, scheduled_arrival, "estimated_arrival?"]
    output: Flight
    side_effects: ["creates Flight in SCHEDULED / UNCONTROLLED", "last_eta_reported_at := clock"]

  - method: GET
    path: "/atfm/flights"
    description: "List flights with filters (operator_id, arrival_facility_id, ops_status, control_status) and pagination"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["operator_id?", "arrival_facility_id?", "ops_status?", "control_status?", "limit?", "offset?"]
    output: "Flight[]"
    side_effects: []

  - method: GET
    path: "/atfm/flights/{id}"
    description: "Fetch one flight"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: POST
    path: "/atfm/flights/{id}/updates"
    description: "Operator data-exchange update: new ETA and/or ops-status advance (SCHEDULED->AIRBORNE->LANDED); OCC-guarded"
    roles: [Operator]
    code: 200
    input: ["new_eta?", "new_ops_status?", expected_flight_version]
    output: Flight
    side_effects: ["estimated_arrival / ops_status updated as supplied", "last_eta_reported_at := clock when new_eta present", "increments Flight.version by 1"]

  - method: POST
    path: "/atfm/flights/{id}/cancel"
    description: "Cancel a SCHEDULED flight; if it holds a slot, releases the slot and reconciles the ledger (compression pool input)"
    roles: [Operator]
    code: 200
    input: []
    output: Flight
    side_effects: ["ops_status -> CANCELLED", "held slot -> RELEASED with RELEASE transaction", "flight control fields reverted", "ledger attributed_delay_minutes/flight_count decremented", "increments Flight.version by 1"]

  - method: GET
    path: "/atfm/tmis/{id}/slots"
    description: "List arrival slots of a GDP in slot_index order, filterable by status"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ArrivalSlot[]"
    side_effects: []

  - method: GET
    path: "/atfm/flights/{id}/slots"
    description: "List slots currently or historically assigned to a flight (0 or 1 current ASSIGNED plus audit trail via original_flight_id)"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: "ArrivalSlot[]"
    side_effects: []

  - method: POST
    path: "/atfm/tmis/{id}/substitutions"
    description: "CDM substitution: an operator swaps the CTAs of two of its own flights inside one ACTIVE GDP; returns the SlotTransaction recorded for flight_id_1"
    roles: [Operator]
    code: 201
    input: [flight_id_1, flight_id_2, "note?"]
    output: SlotTransaction
    side_effects: ["swaps controlled_arrival between the two flights", "writes two SUBSTITUTION_SWAP transactions with opposite delay_deltas", "recomputes provisional delays, ledgers and fair shares", "conserves the assigned-slot multiset exactly"]

  - method: POST
    path: "/atfm/tmis/{id}/compression-runs"
    description: "Execute a compression pass set over an ACTIVE GDP (calculations.compression_reallocation): recover cancelled flights' slots, move carriers up, promote waitlisted GA requests"
    roles: [FlowManager]
    code: 201
    input: []
    output: CompressionRun
    side_effects: ["runs compression_reallocation", "COMPRESSION_MOVE transactions + ledger reconciliation", "GA promotions with flight creation", "unclaimed RELEASED slots -> OPEN"]

  - method: GET
    path: "/atfm/tmis/{id}/compression-runs"
    description: "List compression runs of a TMI, oldest first"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: "CompressionRun[]"
    side_effects: []

  - method: POST
    path: "/atfm/operators/{id}/ga-requests"
    description: "GA/unscheduled operator requests accommodation into a GDP's reserved slot pool"
    roles: [Operator]
    code: 201
    input: [tmi_id, requested_window_start, requested_window_end, priority_class]
    output: GAAccommodationRequest
    side_effects: ["creates request in REQUESTED"]

  - method: POST
    path: "/atfm/ga-requests/{id}/adjudicate"
    description: "FlowManager adjudicates a pending GA request: ACCOMMODATE grants the earliest in-window reserved OPEN slot (or WAITLISTS when quota/slot unavailable); DENY rejects"
    roles: [FlowManager]
    code: 200
    input: [decision]
    output: GAAccommodationRequest
    side_effects: ["on ACCOMMODATE success: creates the GA flight, assigns the slot, writes GA_ASSIGNMENT transaction, reconciles ledgers"]

  - method: GET
    path: "/atfm/operators/{id}/ga-requests"
    description: "List GA accommodation requests of an operator"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["status?"]
    output: "GAAccommodationRequest[]"
    side_effects: []

  - method: GET
    path: "/atfm/tmis/{id}/ga-requests"
    description: "List GA accommodation requests against a TMI, filterable by status"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["status?"]
    output: "GAAccommodationRequest[]"
    side_effects: []

  - method: POST
    path: "/atfm/tmis/{id}/reroute-assignments"
    description: "Assign an UNCONTROLLED flight to an alternative route through a sector under an ACTIVE REROUTE initiative; sector hourly capacity enforced"
    roles: [FlowManager]
    code: 201
    input: [flight_id, via_sector_id, assigned_route]
    output: RerouteAssignment
    side_effects: ["creates RerouteAssignment with hourly_bucket := truncated hour of flight.estimated_arrival"]

  - method: GET
    path: "/atfm/reroute-assignments"
    description: "List reroute assignments with filters (tmi_id, flight_id, via_sector_id) and pagination"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["tmi_id?", "flight_id?", "via_sector_id?", "limit?", "offset?"]
    output: "RerouteAssignment[]"
    side_effects: []

  - method: GET
    path: "/atfm/reroute-assignments/{id}"
    description: "Fetch one reroute assignment"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: RerouteAssignment
    side_effects: []

  - method: GET
    path: "/atfm/operators/{id}/delay-ledgers"
    description: "List an operator's per-program delay ledgers"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: "OperatorDelayLedger[]"
    side_effects: []

  - method: GET
    path: "/atfm/tmis/{id}/delay-ledgers"
    description: "List per-operator delay ledgers for one TMI (delay equity distribution view)"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: []
    output: "OperatorDelayLedger[]"
    side_effects: []

  - method: GET
    path: "/atfm/tmis/{id}/slot-transactions"
    description: "List the append-only slot transaction log of a TMI in chronological (created_at ASC) order, filterable by transaction_type"
    roles: [SystemAdministrator, FlowManager, CommandCenterAdmin, Operator]
    code: 200
    input: ["transaction_type?", "limit?", "offset?"]
    output: "SlotTransaction[]"
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. DEFAULT: before any set call the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All time-based rules (window-in-past, data freshness, buckets) read this clock."
    roles: [SystemAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["sets the logical clock consumed by every temporal rule"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not declared" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role is declared but not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Operator role acting on a resource owned by a different operator id" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id in path or body does not resolve" }
  - { id: ERR_OPERATOR_NOT_FOUND, http: 404, condition: "Operator id in path does not resolve" }
  - { id: ERR_FLIGHT_NOT_FOUND, http: 404, condition: "Flight id in path or body does not resolve" }
  - { id: ERR_TMI_NOT_FOUND, http: 404, condition: "TMI id in path or body does not resolve" }
  - { id: ERR_CONSTRAINT_EVENT_NOT_FOUND, http: 404, condition: "Constraint event id does not resolve" }
  - { id: ERR_FORECAST_NOT_FOUND, http: 404, condition: "Capacity forecast id does not resolve" }
  - { id: ERR_GA_REQUEST_NOT_FOUND, http: 404, condition: "GA accommodation request id does not resolve" }
  - { id: ERR_REROUTE_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Reroute assignment id does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, unknown enum value, wrong type, pagination limit outside [1,100], or no revision field supplied" }
  - { id: ERR_FACILITY_IDENT_CONFLICT, http: 409, condition: "Facility ident already registered" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Window start >= end (or extension does not move window_end forward)" }
  - { id: ERR_PROGRAM_WINDOW_IN_PAST, http: 422, condition: "TMI program_end (or new_program_end) is not strictly after the current logical clock" }
  - { id: ERR_INVALID_RATE, http: 422, condition: "controlled_rate violates the per-type format rule (GDP: 6..60 dividing 3600; AFP: 1..60; GS: must be 0)" }
  - { id: ERR_RATE_EXCEEDS_CAPACITY, http: 422, condition: "controlled_rate > max_feasible_rate for the facility/window at gate time" }
  - { id: ERR_NO_CURRENT_FORECAST, http: 409, condition: "No PUBLISHED, non-STALE, PLANNING-variant forecast covers the TMI window at publish/activate time" }
  - { id: ERR_FACILITY_NOT_OPERATIONAL, http: 409, condition: "Facility status is OUTAGE at TMI activation or reroute assignment" }
  - { id: ERR_TMI_OVERLAP, http: 409, condition: "Another non-terminal GROUND_DELAY_PROGRAM or GROUND_STOP overlaps the same facility window" }
  - { id: ERR_CONSTRAINT_EVENT_OVERLAP, http: 409, condition: "A non-CLEARED constraint event of the same event_type overlaps the half-open window on this facility" }
  - { id: ERR_TMI_NOT_ACTIVE, http: 409, condition: "Endpoint requires the TMI in ACTIVE (substitutions, compression, GA adjudication, reroute assignment, revision creation)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine precondition failure (wrong from-state for the requested transition)" }
  - { id: ERR_TMI_TERMINAL, http: 409, condition: "Action attempted on a CANCELLED or COMPLETED TMI" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "TMI publisher X-User-ID equals proposed_by_user_id" }
  - { id: ERR_SECTOR_CAPACITY_EXCEEDED, http: 422, condition: "Reroute would push the (sector, hourly_bucket) load to sector.base_acceptance_rate or beyond" }
  - { id: ERR_SUBSTITUTION_SAME_FLIGHT, http: 422, condition: "flight_id_1 == flight_id_2 in a substitution" }
  - { id: ERR_FLIGHT_NOT_IN_PROGRAM, http: 422, condition: "A substitution flight holds no ASSIGNED slot in this TMI" }
  - { id: ERR_SUBSTITUTION_SHIFT_EXCEEDED, http: 422, condition: "Substitution would move a flight's CTA more than SUBSTITUTION_MAX_SHIFT_MINUTES (120) from its scheduled_arrival" }
  - { id: ERR_STALE_FLIGHT_DATA, http: 422, condition: "A substitution flight's last_eta_reported_at is older than FLIGHT_DATA_FRESHNESS_SECONDS (3600) before the logical clock" }
  - { id: ERR_OPERATOR_TYPE_INELIGIBLE, http: 422, condition: "GA accommodation requested by a SCHEDULED_CARRIER operator" }
  - { id: ERR_GA_WINDOW_OUTSIDE_PROGRAM, http: 422, condition: "GA request window not contained in the program window" }
  - { id: ERR_TMI_TYPE_NOT_GDP, http: 422, condition: "GA accommodation or slot listing attempted against a non-GROUND_DELAY_PROGRAM TMI" }
  - { id: ERR_EXTENSION_LIMIT_EXCEEDED, http: 422, condition: "Constraint event already extended CONSTRAINT_EVENT_MAX_EXTENSIONS (2) times" }
  - { id: ERR_FLIGHT_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted on an AIRBORNE or LANDED flight" }
  - { id: ERR_FACILITY_TYPE_NOT_AIRPORT, http: 422, condition: "Flight arrival_facility_id references an EN_ROUTE_SECTOR" }
  - { id: ERR_REROUTE_SECTOR_TYPE, http: 422, condition: "Reroute via_sector_id references an AIRPORT instead of an EN_ROUTE_SECTOR" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdministrator
    description: "FAA system operator; registers facilities and operators, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /atfm/facilities"
      - "PATCH /atfm/facilities/{id}"
      - "POST /atfm/operators"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"

  - name: FlowManager
    description: "FAA traffic management specialist; reports constraints, computes forecasts, proposes/activates/revises TMIs, runs compression, adjudicates GA requests, assigns reroutes"
    identity: opaque
    exclusive_operations:
      - "POST /atfm/facilities/{id}/constraint-events"
      - "POST /atfm/constraint-events/{id}/confirm|clear|extend"
      - "POST /atfm/facilities/{id}/capacity-forecasts"
      - "POST /atfm/capacity-forecasts/{id}/publish"
      - "POST /atfm/facilities/{id}/tmis"
      - "POST /atfm/tmis/{id}/activate"
      - "POST /atfm/tmis/{id}/revisions"
      - "POST /atfm/tmis/{id}/compression-runs"
      - "POST /atfm/ga-requests/{id}/adjudicate"
      - "POST /atfm/tmis/{id}/reroute-assignments"
    shared_operations:
      - "all GET endpoints"

  - name: CommandCenterAdmin
    description: "ATCSCC command center; publishes, cancels and completes TMIs. Segregation of duties: may not publish a TMI it proposed (it can never propose, so the check binds when its X-User-ID collides with the proposer's)."
    identity: opaque
    exclusive_operations:
      - "POST /atfm/tmis/{id}/publish"
      - "POST /atfm/tmis/{id}/cancel"
      - "POST /atfm/tmis/{id}/complete"
    shared_operations:
      - "all GET endpoints"

  - name: Operator
    description: "Airline operations center / GA operator; files and updates its own flights, cancels them, swaps its own slots inside a GDP, requests GA accommodation"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /atfm/operators/{id}/flights"
      - "POST /atfm/flights/{id}/updates"
      - "POST /atfm/flights/{id}/cancel"
      - "POST /atfm/tmis/{id}/substitutions"
      - "POST /atfm/operators/{id}/ga-requests"
    shared_operations:
      - "all GET endpoints"
    note: "X-User-ID equals the Operator.id the caller acts as; writes touching flights owned by another operator id fail with ERR_NOT_RESOURCE_OWNER."
