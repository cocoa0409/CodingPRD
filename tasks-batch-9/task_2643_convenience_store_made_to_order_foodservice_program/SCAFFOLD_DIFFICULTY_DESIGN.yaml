      - name: placement_is_gated_on_the_staffing_plans_publication_state
        grounds:
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.StaffingPlan.DRAFT_to_PUBLISHED
          - errors[ERR_DAYPART_PLAN_NOT_PUBLISHED]
          - validations[priority=14]
          - global_conventions.daypart_authority
        distinguishing_aspect: |
          The blocking entity is a StaffingPlan the order does not even reference by id - the match is made
          by (store_id, Store.current_daypart, date(clock)). A DRAFT plan is INVISIBLE to placement, so a
          fully valid order is refused with ERR_DAYPART_PLAN_NOT_PUBLISHED (409); publishing the plan
          without touching the order makes the identical place call succeed. An implementation that merely
          checks for the existence of a plan row, or that keys the lookup off the order's own
          daypart_at_placement (still null in DRAFT), passes the first call and fails this test.
