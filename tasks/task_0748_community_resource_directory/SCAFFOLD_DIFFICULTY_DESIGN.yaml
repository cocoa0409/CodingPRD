            - call: "POST /intakes/${i16_id}/referrals"
              payload: { program_id: "${prog16_id}", consent_grant_id: "${cg16_id}", transport_mode: "AGENCY_SHUTTLE" }
              as: Caseworker
              captures: { r16a_id: $.data.id }
            - call: "POST /referrals/${r16a_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p16_id}"
            - call: "POST /intakes/${i16_id}/referrals"
              payload: { program_id: "${prog16_id}", consent_grant_id: "${cg16_id}", transport_mode: "AGENCY_SHUTTLE" }
              as: Caseworker
              captures: { r16b_id: $.data.id }
