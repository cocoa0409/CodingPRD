  - section: consistency_model
    instances:
      - name: immediate_visibility_of_funded_schedule
        claim_type: immediate
        grounds: [state_machines.CreditBuilderLoan.PENDING_to_ACTIVE, entities.InstallmentSchedule.fields.period_index]
        distinguishing_aspect: "Immediately after POST /loans/{id}/fund returns, GET /loans/{id}/schedule shows all term_months rows in the same logical step (immediate consistency)."
        test_recipe:
          setup: ["CA loan P=60000 term12 apr0 created PENDING."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "cm1@x.com", full_name: "CM One", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "GET /loans/${loan}/schedule"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
