# =============================================================================
# Scaffold: valuables-jewelry-insurance benchmark seed tables (Expert band)
# =============================================================================

scenario: |
  Valuables & Jewelry Insurance (Jewelers Mutual style): appraisal & scheduled-item
  value, all-risk vs named-peril, premium by item/zip risk, agreed-value vs
  replacement, loss/damage claim & repair-network, revaluation/inflation guard,
  worldwide coverage, deductible options

domain_name: valuables-jewelry-insurance
api_prefix: ""

complexity_profile:
  primary_archetype: ledger reconciliation
  secondary_archetype: pricing engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  # Policy is the aggregate root with a deep ownership tree (ScheduledItem, Appraisal,
  # Endorsement, Claim, Premium) plus cross-cutting flat references to RepairShop
  # (a peer catalog entity) and Policyholder (the customer principal).
  state_machine_shape: cyclic
  # Claim carries a cyclic review loop (UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW);
  # Policy carries parallel coverage_status x billing_status dimensions; RepairOrder is
  # a branching fork-join (REPAIRED vs DEEMED_TOTAL_LOSS converge to CLOSED).
  relationship_patterns:
    - one_to_many        # Policy -> ScheduledItem, Policy -> Claim, Policy -> Endorsement
    - cross_aggregate    # Claim -> RepairOrder -> RepairShop; ScheduledItem -> Appraisal
  role_model: peer_roles
  # Policyholder owns their policies/claims; Underwriter prices and binds; ClaimsAdjuster
  # adjudicates claims; Appraiser files appraisals; RepairShop acts on its repair orders.
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity Relationship Table
# =============================================================================
entities:
  - name: Policyholder
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/identity email; unique across Policyholders" }
      - { name: full_name, type: string, source: input, description: "Insured person legal name" }
      - { name: residence_zip, type: string, source: input, description: "5-digit residence ZIP; drives default item zip_risk_band" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE — the only Policyholder status (no suspension flow in this domain)" }

  - name: RiskZone
    parent: null
    common_fields: false
    fields:
      - { name: zip_prefix, type: string, source: input, description: "3-digit ZIP prefix this zone covers; unique" }
      - { name: risk_band, type: enum, source: input, description: "LOW | MODERATE | HIGH | SEVERE — theft/loss exposure band for the prefix" }
      - { name: rate_per_thousand_cents, type: integer, source: input, description: "Annual premium cents per $1,000 of insured value at base before multipliers" }
      - { name: catastrophe_loaded, type: boolean, source: input, default: false, description: "True if zone carries a flat catastrophe surcharge" }

  - name: RepairShop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Network jeweler/repair shop name" }
      - { name: service_zip, type: string, source: input, description: "5-digit ZIP where the shop operates" }
      - { name: in_network, type: boolean, source: input, default: true, description: "True if a contracted network shop (lower deductible applies)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — suspended shops cannot receive new repair orders" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id; the insured principal" }
      - { name: coverage_type, type: enum, source: input, description: "ALL_RISK | NAMED_PERIL — ALL_RISK covers any non-excluded cause; NAMED_PERIL covers only listed_perils" }
      - { name: valuation_basis, type: enum, source: input, description: "AGREED_VALUE | REPLACEMENT_COST — settlement algorithm selector" }
      - { name: deductible_option, type: enum, source: input, description: "ZERO | LOW | STANDARD | HIGH — maps to deductible_cents and a premium credit factor" }
      - { name: worldwide_coverage, type: boolean, source: input, default: false, description: "True if losses outside the residence country are covered" }
      - { name: listed_perils, type: array, source: input, default: [], description: "For NAMED_PERIL only: subset of {THEFT,FIRE,FLOOD,ACCIDENTAL_DAMAGE,MYSTERIOUS_DISAPPEARANCE}; empty/ignored for ALL_RISK" }
      - { name: inflation_guard_mode, type: enum, source: input, default: "NONE", description: "NONE | SIMPLE | COMPOUND — revaluation algorithm selector" }
      - { name: inflation_guard_pct, type: number, source: input, default: 0, description: "Annual inflation-guard percentage (e.g. 0.04 = 4%); 0 when mode NONE" }
      - { name: deductible_cents, type: integer, source: computed, description: "Resolved deductible amount from deductible_option" }
      - { name: total_insured_value_cents, type: integer, source: computed, description: "Sum of current_value_cents over ScheduledItems whose item_status IN {ACTIVE,SUSPENDED}" }
      - { name: annual_premium_cents, type: integer, source: computed, description: "Sum of per-item annual premium over premium-bearing scheduled items; recomputed on bind and on each accepted endorsement" }
      - { name: coverage_status, type: enum, source: system, default: "QUOTED", description: "QUOTED | BOUND | ACTIVE | LAPSED | CANCELLED — coverage lifecycle dimension" }
      - { name: billing_status, type: enum, source: system, default: "UNBILLED", description: "UNBILLED | PAID | PAST_DUE — premium-payment dimension, evolves independently of coverage_status" }
      - { name: past_due_since, type: datetime, source: system, default: null, description: "Logical-clock instant the policy entered PAST_DUE (set on payment reversal); anchors the GRACE_DAYS lapse window and REINSTATE_DAYS reinstatement window; null while not PAST_DUE" }
      - { name: bound_at_iso, type: datetime, source: system, default: null, description: "Logical-clock timestamp coverage was bound; anchors revaluation epochs" }

  - name: ScheduledItem
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the parent policy" }
      - { name: description, type: string, source: input, description: "Item description (e.g. '2ct solitaire ring')" }
      - { name: category, type: enum, source: input, description: "RING | NECKLACE | WATCH | LOOSE_STONE | OTHER — affects category_risk_multiplier" }
      - { name: location_zip, type: string, source: input, description: "5-digit ZIP where the item is normally kept; resolves zip_risk_band via RiskZone" }
      - { name: scheduled_value_cents, type: integer, source: input, description: "Appraised/agreed value at scheduling time in cents (>0)" }
      - { name: current_value_cents, type: integer, source: computed, default: null, description: "Inflation-guard-adjusted value; equals scheduled_value_cents at bind, updated by revaluation" }
      - { name: revaluation_epoch, type: integer, source: system, default: 0, description: "Number of revaluation cycles applied to this item" }
      - { name: appraisal_id, type: string, source: input, default: null, description: "FK -> Appraisal.id; the appraisal backing scheduled_value_cents (required for items > APPRAISAL_REQUIRED_THRESHOLD_CENTS)" }
      - { name: item_status, type: enum, source: system, default: "PENDING", description: "PENDING | ACTIVE | SUSPENDED | REMOVED — SUSPENDED while an open claim locks the item" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: policyholder_id, type: string, source: input, description: "FK -> Policyholder.id; owner the appraisal belongs to" }
      - { name: appraiser_id, type: string, source: input, description: "Opaque appraiser operator id that filed the appraisal (X-User-ID of the Appraiser)" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Independent appraised value in cents (>0)" }
      - { name: effective_date_iso, type: datetime, source: input, description: "Date the appraisal was performed (logical-clock ISO)" }
      - { name: valid_months, type: integer, source: input, default: 36, description: "Months the appraisal stays valid from effective_date_iso (half-open: valid for [effective, effective+valid_months))" }
      - { name: status, type: enum, source: system, default: "VALID", description: "VALID | EXPIRED | SUPERSEDED — EXPIRED when clock passes the window; SUPERSEDED when a newer appraisal replaces it for the same item" }

  - name: Endorsement
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; the policy being amended" }
      - { name: endorsement_type, type: enum, source: input, description: "ADD_ITEM | REMOVE_ITEM | CHANGE_DEDUCTIBLE — kind of mid-term amendment" }
      - { name: target_item_id, type: string, source: input, default: null, description: "FK -> ScheduledItem.id; item to add/remove (null for CHANGE_DEDUCTIBLE)" }
      - { name: new_deductible_option, type: enum, source: input, default: null, description: "ZERO | LOW | STANDARD | HIGH — only for CHANGE_DEDUCTIBLE" }
      - { name: premium_delta_cents, type: integer, source: computed, description: "Prorated premium change this endorsement applies to the policy (signed)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | APPLIED | REJECTED — APPLIED mutates the policy" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy under which the claim is filed" }
      - { name: scheduled_item_id, type: string, source: input, description: "FK -> ScheduledItem.id; the item lost or damaged" }
      - { name: peril, type: enum, source: input, description: "THEFT | FIRE | FLOOD | ACCIDENTAL_DAMAGE | MYSTERIOUS_DISAPPEARANCE — cause of loss" }
      - { name: loss_type, type: enum, source: input, description: "TOTAL_LOSS | PARTIAL_DAMAGE — drives settlement vs repair path" }
      - { name: loss_zip, type: string, source: input, default: null, description: "5-digit ZIP where the loss occurred (null = outside home country / worldwide)" }
      - { name: occurred_outside_country, type: boolean, source: input, default: false, description: "True if the loss happened abroad; requires Policy.worldwide_coverage" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the claimant asserts (for PARTIAL_DAMAGE; ignored for TOTAL_LOSS which uses item value)" }
      - { name: settlement_cents, type: integer, source: computed, default: 0, description: "Adjudicated payout net of deductible; 0 until APPROVED" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Deductible withheld from this claim; 0 until APPROVED" }
      - { name: info_request_count, type: integer, source: system, default: 0, description: "Times the adjuster bounced the claim back for info (cycle counter)" }
      - { name: status, type: enum, source: system, default: "FNOL", description: "FNOL | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | SETTLED | CLOSED" }

  - name: RepairOrder
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; the approved PARTIAL_DAMAGE claim this order services" }
      - { name: repair_shop_id, type: string, source: input, description: "FK -> RepairShop.id; the network/non-network shop assigned" }
      - { name: authorized_amount_cents, type: integer, source: computed, description: "Cap the insurer authorizes for the repair = claim.settlement_cents" }
      - { name: actual_cost_cents, type: integer, source: input, default: null, description: "Final repair cost reported by the shop (set on completion)" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | IN_PROGRESS | REPAIRED | DEEMED_TOTAL_LOSS | CLOSED" }

  - name: PremiumPayment
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; policy this payment settles" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered in cents" }
      - { name: status, type: enum, source: system, default: "RECEIVED", description: "RECEIVED | REVERSED — REVERSED returns billing_status to PAST_DUE" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- Policy: PARALLEL DIMENSIONS — coverage_status x billing_status evolve independently
  - entity: Policy
    initial_state: QUOTED            # coverage_status dimension
    terminal_states: [CANCELLED]
    transitions:
      # --- coverage_status dimension ---
      - from: QUOTED
        to: BOUND
        trigger: "POST /policies/{policyId}/bind"
        actor: Underwriter
        preconditions:
          - "coverage_status == QUOTED (else ERR_INVALID_STATE)"
          - "At least one ScheduledItem in item_status ACTIVE-eligible (PENDING) exists (else ERR_NO_SCHEDULED_ITEMS)"
          - "For NAMED_PERIL, listed_perils is non-empty (else ERR_NAMED_PERIL_REQUIRES_PERILS)"
          - "Every ScheduledItem with scheduled_value_cents > APPRAISAL_REQUIRED_THRESHOLD_CENTS has a non-null VALID appraisal_id (else ERR_APPRAISAL_REQUIRED)"
        side_effects:
          - "deductible_cents resolved from deductible_option"
          - "Each PENDING ScheduledItem -> ACTIVE; current_value_cents := scheduled_value_cents; revaluation_epoch := 0"
          - "Recompute total_insured_value_cents and annual_premium_cents (per-item premium rounded then summed)"
          - "bound_at_iso := current logical clock"
          - "increments Policy.version by 1"
      - from: BOUND
        to: ACTIVE
        trigger: "system (automatic when billing_status becomes PAID while coverage_status == BOUND)"
        actor: system
        preconditions:
          - "billing_status == PAID"
        side_effects:
          - "coverage_status := ACTIVE"
      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic during POST /_clock/set_current_utc advance when billing_status == PAST_DUE AND clock >= past_due_since + GRACE_DAYS)"
        actor: system
        preconditions:
          - "billing_status == PAST_DUE"
          - "clock has advanced >= GRACE_DAYS beyond the instant the policy entered PAST_DUE"
        side_effects:
          - "coverage_status := LAPSED; open claims on this policy are unaffected but no new claims may be filed"
        note: "Only PAST_DUE policies can lapse; a PAID policy never lapses on a clock advance, so revaluation-driven advances on paid policies leave coverage_status untouched"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /policies/{policyId}/payments (a sufficient payment on a LAPSED policy within REINSTATE_DAYS of the lapse instant)"
        actor: Policyholder
        preconditions:
          - "billing_status becomes PAID and clock within REINSTATE_DAYS of the lapse instant (else stays LAPSED)"
        side_effects:
          - "coverage_status := ACTIVE"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /policies/{policyId}/cancel"
        actor: Underwriter | Policyholder
        preconditions:
          - "No Claim on this policy in status IN {UNDER_REVIEW, INFO_REQUESTED, APPROVED} (else ERR_OPEN_CLAIM_BLOCKS_CANCEL)"
        side_effects:
          - "coverage_status := CANCELLED; all ScheduledItems item_status -> REMOVED"
      - from: BOUND
        to: CANCELLED
        trigger: "POST /policies/{policyId}/cancel"
        actor: Underwriter | Policyholder
        preconditions:
          - "No Claim on this policy in status IN {UNDER_REVIEW, INFO_REQUESTED, APPROVED}"
        side_effects:
          - "coverage_status := CANCELLED; all ScheduledItems item_status -> REMOVED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{policyId}/cancel"
        actor: Underwriter | Policyholder
        preconditions:
          - "No Claim on this policy in status IN {UNDER_REVIEW, INFO_REQUESTED, APPROVED}"
        side_effects:
          - "coverage_status := CANCELLED; all ScheduledItems item_status -> REMOVED"
      # --- billing_status dimension (independent of coverage_status) ---
      - from: UNBILLED
        to: PAID
        trigger: "POST /policies/{policyId}/payments (PremiumPayment created, amount >= annual_premium_cents)"
        actor: Policyholder
        preconditions:
          - "coverage_status IN {BOUND, ACTIVE, LAPSED} (premium only billable after bind) (else ERR_POLICY_NOT_BILLABLE)"
          - "amount_cents >= annual_premium_cents (else ERR_PREMIUM_UNDERPAID)"
        side_effects:
          - "billing_status := PAID; may bubble coverage_status BOUND->ACTIVE or LAPSED->ACTIVE"
          - "increments Policy.version by 1"
        note: "billing_status starts UNBILLED, set PAID on sufficient payment; orthogonal to coverage_status"
      - from: PAID
        to: PAST_DUE
        trigger: "POST /policies/{policyId}/payments/{paymentId}/reverse"
        actor: Underwriter
        preconditions:
          - "Payment in status RECEIVED (else ERR_INVALID_STATE)"
        side_effects:
          - "PremiumPayment.status := REVERSED; billing_status := PAST_DUE; record past_due_since := current clock"
        note: "PAST_DUE is entered ONLY by an explicit payment reversal, never automatically on a clock advance — this keeps a PAID policy's coverage stable across revaluation-driven clock advances"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /policies/{policyId}/payments"
        actor: Policyholder
        preconditions:
          - "amount_cents >= annual_premium_cents"
        side_effects:
          - "billing_status := PAID; if coverage_status == LAPSED and clock within REINSTATE_DAYS of past_due_since, bubble LAPSED->ACTIVE"
          - "increments Policy.version by 1"

  # ---- ScheduledItem
  - entity: ScheduledItem
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (on Policy bind, or on APPLIED ADD_ITEM Endorsement for a bound policy)"
        actor: system
        preconditions:
          - "Parent Policy coverage_status IN {QUOTED(binding), BOUND, ACTIVE}"
        side_effects:
          - "current_value_cents := scheduled_value_cents; revaluation_epoch := 0"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (when a Claim referencing this item enters UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "Item locked: cannot be target of REMOVE_ITEM endorsement while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (when the referencing Claim reaches a terminal status DENIED/SETTLED/CLOSED without total loss)"
        actor: system
        preconditions:
          - "Claim.loss_type != TOTAL_LOSS or claim DENIED"
        side_effects: []
      - from: SUSPENDED
        to: REMOVED
        trigger: "system (when a TOTAL_LOSS Claim on this item reaches SETTLED)"
        actor: system
        preconditions:
          - "Claim.loss_type == TOTAL_LOSS and Claim.status == SETTLED"
        side_effects:
          - "Item removed from coverage; excluded from total_insured_value_cents and future revaluation"
      - from: ACTIVE
        to: REMOVED
        trigger: "system (on APPLIED REMOVE_ITEM Endorsement)"
        actor: system
        preconditions:
          - "Item not SUSPENDED by an open claim (else ERR_ITEM_LOCKED_BY_CLAIM)"
        side_effects:
          - "Recompute parent Policy total_insured_value_cents and annual_premium_cents"

  # ---- Endorsement
  - entity: Endorsement
    initial_state: DRAFT
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DRAFT
        to: APPLIED
        trigger: "POST /policies/{policyId}/endorsements/{endorsementId}/apply"
        actor: Underwriter
        preconditions:
          - "Parent Policy coverage_status IN {BOUND, ACTIVE} (else ERR_INVALID_STATE)"
          - "expected_policy_version matches Policy.version (else ERR_STALE_VERSION)"
          - "For REMOVE_ITEM: target item not SUSPENDED by an open claim (else ERR_ITEM_LOCKED_BY_CLAIM)"
          - "For CHANGE_DEDUCTIBLE: new_deductible_option differs from current (else ERR_NO_OP_ENDORSEMENT)"
        side_effects:
          - "Compute premium_delta_cents (prorated for remaining policy year)"
          - "ADD_ITEM: target ScheduledItem PENDING->ACTIVE; REMOVE_ITEM: target ACTIVE->REMOVED; CHANGE_DEDUCTIBLE: Policy.deductible_option/deductible_cents updated"
          - "Recompute Policy total_insured_value_cents and annual_premium_cents; apply premium_delta_cents"
          - "increments Policy.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /policies/{policyId}/endorsements/{endorsementId}/reject"
        actor: Underwriter
        preconditions: []
        side_effects: []

  # ---- Claim: CYCLIC review loop (UNDER_REVIEW <-> INFO_REQUESTED)
  - entity: Claim
    initial_state: FNOL
    terminal_states: [DENIED, CLOSED]
    transitions:
      - from: FNOL
        to: UNDER_REVIEW
        trigger: "POST /policies/{policyId}/claims/{claimId}/start_review"
        actor: ClaimsAdjuster
        preconditions:
          - "Parent Policy coverage_status == ACTIVE (else ERR_POLICY_NOT_ACTIVE)"
          - "For NAMED_PERIL policy: claim.peril IN Policy.listed_perils (else ERR_PERIL_NOT_COVERED)"
          - "If occurred_outside_country: Policy.worldwide_coverage == true (else ERR_WORLDWIDE_NOT_COVERED)"
        side_effects:
          - "Referenced ScheduledItem ACTIVE->SUSPENDED (locks item)"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /policies/{policyId}/claims/{claimId}/request_info"
        actor: ClaimsAdjuster
        preconditions:
          - "info_request_count < MAX_INFO_REQUESTS (else ERR_INFO_REQUEST_LIMIT)"
        side_effects:
          - "info_request_count += 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /policies/{policyId}/claims/{claimId}/provide_info"
        actor: Policyholder
        preconditions: []
        side_effects: []
        note: "Cyclic revision loop; bounded by MAX_INFO_REQUESTS"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /policies/{policyId}/claims/{claimId}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "expected_claim_version matches Claim.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Compute settlement_cents and deductible_applied_cents per valuation_basis variant"
          - "TOTAL_LOSS: claim ready for direct settlement; PARTIAL_DAMAGE: claim awaits RepairOrder"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /policies/{policyId}/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "Referenced ScheduledItem SUSPENDED->ACTIVE (unlock); settlement_cents stays 0"
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /policies/{policyId}/claims/{claimId}/deny"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "Referenced ScheduledItem SUSPENDED->ACTIVE (unlock)"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /policies/{policyId}/claims/{claimId}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "loss_type == TOTAL_LOSS (PARTIAL_DAMAGE settles via RepairOrder closure) (else ERR_PARTIAL_REQUIRES_REPAIR)"
        side_effects:
          - "TOTAL_LOSS: referenced ScheduledItem SUSPENDED->REMOVED; recompute Policy total_insured_value_cents and annual_premium_cents"
      - from: APPROVED
        to: SETTLED
        trigger: "system (when the Claim's RepairOrder reaches CLOSED for a PARTIAL_DAMAGE claim)"
        actor: system
        preconditions:
          - "loss_type == PARTIAL_DAMAGE and RepairOrder.status == CLOSED"
        side_effects:
          - "Referenced ScheduledItem SUSPENDED->ACTIVE (unlock)"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /policies/{policyId}/claims/{claimId}/close"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []

  # ---- RepairOrder: BRANCHING fork-join (REPAIRED vs DEEMED_TOTAL_LOSS converge to CLOSED)
  - entity: RepairOrder
    initial_state: ASSIGNED
    terminal_states: [CLOSED]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /policies/{policyId}/claims/{claimId}/repair-order/accept"
        actor: RepairShop
        preconditions:
          - "Assigned RepairShop.status == ACTIVE (else ERR_SHOP_SUSPENDED)"
        side_effects: []
      - from: IN_PROGRESS
        to: REPAIRED
        trigger: "POST /policies/{policyId}/claims/{claimId}/repair-order/complete"
        actor: RepairShop
        preconditions:
          - "actual_cost_cents <= authorized_amount_cents (else ERR_REPAIR_EXCEEDS_AUTH)"
        side_effects:
          - "RepairOrder.status := REPAIRED"
      - from: IN_PROGRESS
        to: DEEMED_TOTAL_LOSS
        trigger: "POST /policies/{policyId}/claims/{claimId}/repair-order/deem_total_loss"
        actor: RepairShop | ClaimsAdjuster
        preconditions: []
        side_effects:
          - "Item beyond economical repair; settlement upgraded to TOTAL_LOSS payout path"
      - from: REPAIRED
        to: CLOSED
        trigger: "system (automatic on /complete success)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Claim APPROVED->SETTLED; referenced ScheduledItem SUSPENDED->ACTIVE"
      - from: DEEMED_TOTAL_LOSS
        to: CLOSED
        trigger: "system (automatic on /deem_total_loss)"
        actor: system
        preconditions: []
        side_effects:
          - "Claim.loss_type reclassified TOTAL_LOSS; settlement_cents recomputed at full item value path; referenced ScheduledItem SUSPENDED->REMOVED; recompute Policy total_insured_value_cents and annual_premium_cents"

  # ---- Appraisal
  - entity: Appraisal
    initial_state: VALID
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system (during POST /_clock/set_current_utc when clock >= effective_date_iso + valid_months)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALID
        to: SUPERSEDED
        trigger: "system (when a newer VALID Appraisal is attached to the same ScheduledItem via ADD_ITEM/re-appraise)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: endorsement-apply-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{policyId}/endorsements/{endorsementId}/apply"
    occ_field: "expected_policy_version"
    description: |
      Applying an Endorsement against a Policy whose version has advanced since the
      client last observed it is rejected. An endorsement legitimately supersedes the
      policy's premium and insured-value state on apply; if another endorsement (or a
      premium payment) already applied and bumped Policy.version, this client's view is
      stale and the recomputed premium_delta_cents would be derived from an outdated base.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-approve-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /policies/{policyId}/claims/{claimId}/approve"
    occ_field: "expected_claim_version"
    description: |
      Approving a Claim against a Claim whose version has advanced since the client last
      observed it is rejected. An approval legitimately supersedes the claim's settlement
      figures; if a request_info/provide_info cycle already advanced Claim.version, the
      adjuster's view of the claim (and the item value it would settle against) is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  # ---- DUAL VARIANT #1 (Claim domain): settlement payout
  - name: claim_settlement
    trigger: "Claim UNDER_REVIEW -> APPROVED (POST .../approve); also recomputed on RepairOrder DEEMED_TOTAL_LOSS"
    algorithm: forward_looking
    formula: |
      item = referenced ScheduledItem (use current_value_cents, the inflation-guard-adjusted value)
      deductible = Policy.deductible_cents
      # In-network repair (RepairShop.in_network == true) halves the deductible for PARTIAL_DAMAGE.
      if loss_type == PARTIAL_DAMAGE and repair_in_network:
          effective_deductible = floor(deductible / 2)
      else:
          effective_deductible = deductible
      if loss_type == TOTAL_LOSS:
          gross = item.current_value_cents            # full insured value
      else: # PARTIAL_DAMAGE
          gross = min(claimed_amount_cents, item.current_value_cents)
      settlement_cents = max(0, gross - effective_deductible)
      deductible_applied_cents = gross - settlement_cents   # the portion actually withheld (<= deductible)
    input_set: "Single Claim plus its ScheduledItem.current_value_cents and Policy.deductible_cents"
    constants:
      REPLACEMENT_CAP_FACTOR: 1.0          # replacement gross capped at scheduled value
      REPLACEMENT_DEPRECIATION_PCT: 0.05   # 5% depreciation per completed revaluation_epoch
    precision: "integer cents; floor() on the /2 in-network deductible halving; round_half_up on the replacement depreciation multiply"
    variants:
      - name: agreed_value
        when: "Policy.valuation_basis == AGREED_VALUE"
        difference: "gross for TOTAL_LOSS is item.current_value_cents in full with NO depreciation; the agreed value is paid regardless of market movement or epoch"
      - name: replacement_cost
        when: "Policy.valuation_basis == REPLACEMENT_COST"
        difference: "gross for TOTAL_LOSS = round_half_up( min(item.current_value_cents, REPLACEMENT_CAP_FACTOR * item.scheduled_value_cents) * (1 - REPLACEMENT_DEPRECIATION_PCT * item.revaluation_epoch) ); replacement reimburses depreciated cost-to-replace, not the agreed sum, so it diverges from agreed_value once revaluation_epoch >= 1"
    note: "Same loss inputs yield different settlement_cents under the two variants; this is the dual-variant on the Claim domain"

  # ---- DUAL VARIANT #2 (ScheduledItem domain): inflation-guard revaluation
  - name: item_revaluation
    trigger: "system during POST /_clock/set_current_utc when a full revaluation year elapses since bound_at_iso (per epoch)"
    algorithm: decay_function
    formula: |
      # Applied per ACTIVE ScheduledItem when a new revaluation epoch is reached.
      epochs = floor( months_since(bound_at_iso) / 12 )   # number of completed policy years
      base = scheduled_value_cents
      (variant-specific, see below) -> current_value_cents
      revaluation_epoch := epochs
    input_set: "Each ScheduledItem with item_status == ACTIVE on a policy whose inflation_guard_mode != NONE"
    constants:
      MAX_EPOCHS: 10
    precision: "integer cents, round_half_up after the final factor multiply"
    variants:
      - name: simple_guard
        when: "Policy.inflation_guard_mode == SIMPLE"
        difference: "current_value_cents = round_half_up( scheduled_value_cents * (1 + inflation_guard_pct * epochs) ) — linear/simple interest on the original scheduled value"
      - name: compound_guard
        when: "Policy.inflation_guard_mode == COMPOUND"
        difference: "current_value_cents = round_half_up( scheduled_value_cents * (1 + inflation_guard_pct) ** epochs ) — compounded annually; diverges from simple for epochs >= 2"
    note: "Same item + same pct + same epochs produce different current_value_cents under SIMPLE vs COMPOUND; dual-variant on the ScheduledItem domain (distinct from claim_settlement)"

  # ---- COMBINATORIAL MODE (a): non-linear multi-input per-item premium with tiered rate selection
  - name: item_annual_premium
    trigger: "Policy bind; each APPLIED Endorsement; recompute on item removal"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs with non-linear interaction: zip rate, category multiplier, coverage-type
      # multiplier, value-tier surcharge, and a deductible credit, combined multiplicatively
      # then floored by a per-item minimum.
      zone = RiskZone whose zip_prefix == location_zip[0:3]   # by 3-digit prefix; if none, MODERATE default band rate
      base = (current_value_cents / 100000.0) * zone.rate_per_thousand_cents   # cents per $1000 * thousands-of-dollars
      category_mult = CATEGORY_RISK_MULT[category]
      coverage_mult = (coverage_type == ALL_RISK ? ALL_RISK_MULT : NAMED_PERIL_MULT)
      # value-tier surcharge: high-value items carry a non-linear loading
      if current_value_cents <= TIER1_CENTS:        tier_mult = 1.00
      elif current_value_cents <= TIER2_CENTS:      tier_mult = 1.10
      else:                                          tier_mult = 1.25
      cat_surcharge = (zone.catastrophe_loaded ? CAT_SURCHARGE_CENTS : 0)
      deductible_credit = DEDUCTIBLE_CREDIT[deductible_option]   # multiplicative discount factor
      raw = base * category_mult * coverage_mult * tier_mult * deductible_credit
      item_premium_cents = max( ITEM_MIN_PREMIUM_CENTS, round_half_up(raw) ) + cat_surcharge
    input_set: "Single ScheduledItem (item_status ACTIVE), its RiskZone, and parent Policy coverage_type + deductible_option"
    constants:
      CATEGORY_RISK_MULT: { RING: 1.00, NECKLACE: 1.05, WATCH: 1.20, LOOSE_STONE: 1.40, OTHER: 1.10 }
      ALL_RISK_MULT: 1.30
      NAMED_PERIL_MULT: 1.00
      TIER1_CENTS: 500000      # $5,000
      TIER2_CENTS: 2000000     # $20,000
      CAT_SURCHARGE_CENTS: 1500   # flat $15 per catastrophe-loaded zone item
      DEDUCTIBLE_CREDIT: { ZERO: 1.10, LOW: 1.00, STANDARD: 0.92, HIGH: 0.85 }
      ITEM_MIN_PREMIUM_CENTS: 2500   # $25 floor per item
    precision: "round_half_up to whole cents AFTER all multiplicative factors, BEFORE adding the flat catastrophe surcharge"

  # ---- COMBINATORIAL MODE (b): rounding-order pin for policy premium aggregation
  - name: policy_annual_premium
    trigger: "Policy bind; each APPLIED Endorsement"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each item premium to whole cents FIRST
      # (inside item_annual_premium), THEN sum. NOT sum-of-raw-then-round.
      annual_premium_cents = sum( item_annual_premium(item) for item in ScheduledItems
                                  where item_status IN {ACTIVE, SUSPENDED} )
      total_insured_value_cents = sum( current_value_cents for those same items )
    input_set: "All ScheduledItems on the Policy with item_status IN {ACTIVE, SUSPENDED}; REMOVED and PENDING excluded"
    constants: {}
    precision: "per-item round_half_up then integer sum; summing pre-rounded item premiums (round-then-sum), explicitly NOT sum-then-round"
    note: "Round-per-item-then-sum vs sum-then-round produce different cents when item raws have fractional cents; this scaffold pins round-then-sum"

  # ---- Deductible resolution + global thresholds
  - name: deductible_resolution
    trigger: "Policy bind; CHANGE_DEDUCTIBLE endorsement apply"
    algorithm: threshold
    formula: |
      deductible_cents = DEDUCTIBLE_CENTS[deductible_option]
    input_set: "Single Policy"
    constants:
      DEDUCTIBLE_CENTS: { ZERO: 0, LOW: 25000, STANDARD: 50000, HIGH: 100000 }
      APPRAISAL_REQUIRED_THRESHOLD_CENTS: 1000000   # items above $10,000 need a VALID appraisal at bind; threshold is '> $10,000' (strict)
      MAX_INFO_REQUESTS: 2                           # at most 2 request_info cycles per claim; 3rd attempt -> ERR_INFO_REQUEST_LIMIT
      GRACE_DAYS: 30                                 # PAST_DUE past this many days from due epoch -> coverage LAPSED
      REINSTATE_DAYS: 30                             # LAPSED policy can reinstate to ACTIVE if paid within this many days of lapse
      POLICY_YEAR_DAYS: 365
    precision: "exact integer cents; threshold comparison APPRAISAL_REQUIRED is strict '>' ($10,000 itself does NOT require an appraisal, $10,000.01 does)"
    note: "APPRAISAL_REQUIRED_THRESHOLD_CENTS boundary is strict greater-than; MAX_INFO_REQUESTS boundary blocks the (MAX+1)-th request"

  # ---- Endorsement proration
  - name: endorsement_premium_delta
    trigger: "Endorsement DRAFT -> APPLIED"
    algorithm: aggregation
    formula: |
      # Proration over the remaining policy year measured in whole days from the logical clock.
      days_remaining = max(0, POLICY_YEAR_DAYS - days_since(Policy.bound_at_iso))
      proration = days_remaining / POLICY_YEAR_DAYS
      if endorsement_type == ADD_ITEM:
          full_item_premium = item_annual_premium(target_item)
          premium_delta_cents = round_half_up(full_item_premium * proration)
      elif endorsement_type == REMOVE_ITEM:
          full_item_premium = item_annual_premium(target_item)   # premium it had been contributing
          premium_delta_cents = -round_half_up(full_item_premium * proration)
      elif endorsement_type == CHANGE_DEDUCTIBLE:
          old_total = policy_annual_premium(with old deductible_option)
          new_total = policy_annual_premium(with new_deductible_option)
          premium_delta_cents = round_half_up((new_total - old_total) * proration)
    input_set: "Single Endorsement, its target item or new deductible option, and parent Policy"
    constants:
      POLICY_YEAR_DAYS: 365
    precision: "round_half_up to whole cents on the final prorated delta"
    note: "Applied delta mutates annual_premium_cents; the forward apply and a compensating reject must leave annual_premium_cents at its pre-draft value"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix; entity_backed roles must own the targeted resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (Policy, ScheduledItem, Claim, Endorsement, RepairOrder, RepairShop, Appraisal), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, monetary amounts > 0, ZIP is 5 digits"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "On claim start_review: NAMED_PERIL policy must list the claimed peril"
    error_id: ERR_PERIL_NOT_COVERED
    http_status: 409
    applies_to: "POST .../claims/{claimId}/start_review"

  - priority: 7
    category: business_safety
    check: "On claim start_review: a loss flagged occurred_outside_country requires Policy.worldwide_coverage"
    error_id: ERR_WORLDWIDE_NOT_COVERED
    http_status: 409
    applies_to: "POST .../claims/{claimId}/start_review"

  - priority: 8
    category: business_referential
    check: "On bind: every ScheduledItem above APPRAISAL_REQUIRED_THRESHOLD_CENTS must carry a non-null VALID appraisal_id"
    error_id: ERR_APPRAISAL_REQUIRED
    http_status: 409
    applies_to: "POST /policies/{policyId}/bind"

  - priority: 9
    category: business_constraint
    check: "On bind: NAMED_PERIL policy must have non-empty listed_perils"
    error_id: ERR_NAMED_PERIL_REQUIRES_PERILS
    http_status: 409
    applies_to: "POST /policies/{policyId}/bind"

  - priority: 10
    category: business_constraint
    check: "On bind: policy must have at least one PENDING ScheduledItem"
    error_id: ERR_NO_SCHEDULED_ITEMS
    http_status: 409
    applies_to: "POST /policies/{policyId}/bind"

  - priority: 11
    category: business_referential
    check: "On claim file/start_review: parent Policy coverage_status must be ACTIVE"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST .../claims, POST .../claims/{claimId}/start_review"

  - priority: 12
    category: business_constraint
    check: "On REMOVE_ITEM endorsement apply / item removal: item must not be SUSPENDED by an open claim"
    error_id: ERR_ITEM_LOCKED_BY_CLAIM
    http_status: 409
    applies_to: "POST .../endorsements/{endorsementId}/apply"

  - priority: 13
    category: business_constraint
    check: "On CHANGE_DEDUCTIBLE endorsement apply: new deductible option must differ from current"
    error_id: ERR_NO_OP_ENDORSEMENT
    http_status: 422
    applies_to: "POST .../endorsements/{endorsementId}/apply"

  - priority: 14
    category: business_temporal
    check: "On info request: info_request_count must be below MAX_INFO_REQUESTS"
    error_id: ERR_INFO_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST .../claims/{claimId}/request_info"

  - priority: 15
    category: business_constraint
    check: "On repair-order assignment/accept: assigned RepairShop must be ACTIVE"
    error_id: ERR_SHOP_SUSPENDED
    http_status: 409
    applies_to: "POST .../claims/{claimId}/repair-order, POST .../claims/{claimId}/repair-order/accept"

  - priority: 16
    category: business_fiscal
    check: "On repair complete: actual_cost_cents must not exceed authorized_amount_cents"
    error_id: ERR_REPAIR_EXCEEDS_AUTH
    http_status: 409
    applies_to: "POST .../claims/{claimId}/repair-order/complete"

  - priority: 17
    category: business_fiscal
    check: "On premium payment: amount_cents must be >= Policy.annual_premium_cents"
    error_id: ERR_PREMIUM_UNDERPAID
    http_status: 409
    applies_to: "POST /policies/{policyId}/payments"

  - priority: 18
    category: business_constraint
    check: "On premium payment: Policy must be BOUND/ACTIVE/LAPSED (billable after bind)"
    error_id: ERR_POLICY_NOT_BILLABLE
    http_status: 409
    applies_to: "POST /policies/{policyId}/payments"

  - priority: 19
    category: business_constraint
    check: "On settle: PARTIAL_DAMAGE claims settle only through RepairOrder closure, not direct settle"
    error_id: ERR_PARTIAL_REQUIRES_REPAIR
    http_status: 409
    applies_to: "POST .../claims/{claimId}/settle"

  - priority: 20
    category: business_constraint
    check: "On cancel: no Claim on the policy in {UNDER_REVIEW, INFO_REQUESTED, APPROVED}"
    error_id: ERR_OPEN_CLAIM_BLOCKS_CANCEL
    http_status: 409
    applies_to: "POST /policies/{policyId}/cancel"

  - priority: 21
    category: concurrency
    check: "OCC: expected_policy_version / expected_claim_version must match the live parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../endorsements/{endorsementId}/apply, POST .../claims/{claimId}/approve"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an absolute ISO-8601 UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock. Advancing the clock fires time-driven transitions: Appraisal VALID->EXPIRED at its half-open window end, Policy ACTIVE->LAPSED only for policies already PAST_DUE beyond GRACE_DAYS (a PAID policy never lapses on a clock advance), and per-epoch ScheduledItem revaluation for ACTIVE items on inflation-guarded policies."
    roles: [Underwriter, ClaimsAdjuster]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects:
      - "Logical clock advanced; time-driven system transitions applied across all policies/appraisals/items"

  # ---- Policyholder ----
  - method: POST
    path: "/policyholders"
    description: "Register a Policyholder"
    roles: [Underwriter]
    code: 201
    input: [email, full_name, residence_zip]
    output: Policyholder
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/policyholders/{id}"
    description: "Get a Policyholder"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: Policyholder
    side_effects: []

  # ---- RiskZone (configuration) ----
  - method: POST
    path: "/risk-zones"
    description: "Create a RiskZone rate row for a 3-digit ZIP prefix"
    roles: [Underwriter]
    code: 201
    input: ["zip_prefix", "risk_band", "rate_per_thousand_cents", "catastrophe_loaded?"]
    output: RiskZone
    side_effects: []

  - method: GET
    path: "/risk-zones/{id}"
    description: "Get a RiskZone"
    roles: [Underwriter, ClaimsAdjuster]
    code: 200
    input: []
    output: RiskZone
    side_effects: []

  # ---- RepairShop (network) ----
  - method: POST
    path: "/repair-shops"
    description: "Register a network RepairShop"
    roles: [Underwriter]
    code: 201
    input: ["name", "service_zip", "in_network?"]
    output: RepairShop
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/repair-shops/{id}"
    description: "Get a RepairShop"
    roles: [Underwriter, ClaimsAdjuster, RepairShop]
    code: 200
    input: []
    output: RepairShop
    side_effects: []

  - method: POST
    path: "/repair-shops/{repairShopId}/suspend"
    description: "Suspend a RepairShop (no new repair orders)"
    roles: [Underwriter]
    code: 200
    input: []
    output: RepairShop
    side_effects: ["status -> SUSPENDED"]

  # ---- Appraisal ----
  - method: POST
    path: "/appraisals"
    description: "File an Appraisal for a Policyholder"
    roles: [Appraiser, Underwriter]
    code: 201
    input: ["policyholder_id", "appraised_value_cents", "effective_date_iso", "valid_months?"]
    output: Appraisal
    side_effects: ["status=VALID; appraiser_id := X-User-ID"]

  - method: GET
    path: "/appraisals/{id}"
    description: "Get an Appraisal"
    roles: [Underwriter, ClaimsAdjuster, Appraiser, Policyholder]
    code: 200
    input: []
    output: Appraisal
    side_effects: []

  - method: GET
    path: "/appraisals"
    description: "List Appraisals; filter by policyholder_id (reverse lookup of Appraisal.policyholder_id)"
    roles: [Underwriter, ClaimsAdjuster, Appraiser, Policyholder]
    code: 200
    input: ["policyholder_id?"]
    output: "Appraisal[]"
    side_effects: []

  # ---- Policy ----
  - method: POST
    path: "/policies"
    description: "Create a QUOTED Policy for a Policyholder"
    roles: [Underwriter]
    code: 201
    input: ["policyholder_id", "coverage_type", "valuation_basis", "deductible_option", "worldwide_coverage?", "listed_perils?", "inflation_guard_mode?", "inflation_guard_pct?"]
    output: Policy
    side_effects: ["coverage_status=QUOTED, billing_status=UNBILLED"]

  - method: GET
    path: "/policies/{id}"
    description: "Get a Policy (includes computed deductible_cents, total_insured_value_cents, annual_premium_cents)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: GET
    path: "/policies"
    description: "List Policies; filter by policyholder_id (reverse lookup of Policy.policyholder_id)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["policyholder_id?"]
    output: "Policy[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/bind"
    description: "Bind a QUOTED Policy; resolves deductible, activates items, computes premium"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - "coverage_status QUOTED -> BOUND; PENDING items -> ACTIVE; current_value_cents := scheduled_value_cents"
      - "Recompute total_insured_value_cents and annual_premium_cents; bound_at_iso set"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{policyId}/cancel"
    description: "Cancel a Policy"
    roles: [Underwriter, Policyholder]
    code: 200
    input: []
    output: Policy
    side_effects: ["coverage_status -> CANCELLED; all ScheduledItems -> REMOVED"]

  # ---- ScheduledItem (created under a Policy; discoverable top-level) ----
  - method: POST
    path: "/policies/{policyId}/scheduled-items"
    description: "Create a ScheduledItem in item_status PENDING under a policy. On a QUOTED policy the item activates at bind; on a BOUND/ACTIVE policy the PENDING item is the target of a subsequent ADD_ITEM endorsement that activates it and prorates its premium. Rejected on CANCELLED policies (ERR_INVALID_STATE)."
    roles: [Underwriter]
    code: 201
    input: ["description", "category", "location_zip", "scheduled_value_cents", "appraisal_id?"]
    output: ScheduledItem
    side_effects: ["item_status=PENDING; policy_id := path policy"]

  - method: GET
    path: "/scheduled-items/{id}"
    description: "Get a single ScheduledItem (includes current_value_cents, revaluation_epoch)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: ScheduledItem
    side_effects: []

  - method: GET
    path: "/scheduled-items"
    description: "List ScheduledItems; filter by policy_id (reverse lookup of ScheduledItem.policy_id) or appraisal_id (reverse lookup of ScheduledItem.appraisal_id)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["policy_id?", "appraisal_id?"]
    output: "ScheduledItem[]"
    side_effects: []

  # ---- Endorsement (under a Policy) ----
  - method: POST
    path: "/policies/{policyId}/endorsements"
    description: "Draft an Endorsement (ADD_ITEM / REMOVE_ITEM / CHANGE_DEDUCTIBLE)"
    roles: [Underwriter]
    code: 201
    input: ["endorsement_type", "target_item_id?", "new_deductible_option?"]
    output: Endorsement
    side_effects: ["status=DRAFT; policy_id := path policy"]

  - method: GET
    path: "/endorsements/{id}"
    description: "Get an Endorsement"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: Endorsement
    side_effects: []

  - method: GET
    path: "/endorsements"
    description: "List Endorsements; filter by policy_id (reverse lookup of Endorsement.policy_id) or target_item_id (reverse lookup of Endorsement.target_item_id)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["policy_id?", "target_item_id?"]
    output: "Endorsement[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/endorsements/{endorsementId}/apply"
    description: "Apply a DRAFT Endorsement to its Policy (OCC-guarded on Policy.version)"
    roles: [Underwriter]
    code: 200
    input: [expected_policy_version]
    output: Endorsement
    side_effects:
      - "status DRAFT -> APPLIED; mutate policy items/deductible; recompute premium; apply premium_delta_cents"
      - "increments Policy.version by 1"

  - method: POST
    path: "/policies/{policyId}/endorsements/{endorsementId}/reject"
    description: "Reject a DRAFT Endorsement (compensating no-op on policy premium)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Endorsement
    side_effects: ["status DRAFT -> REJECTED; annual_premium_cents unchanged"]

  # ---- Claim (under a Policy; discoverable top-level) ----
  - method: POST
    path: "/policies/{policyId}/claims"
    description: "File a First-Notice-Of-Loss Claim against an ACTIVE policy"
    roles: [Policyholder, ClaimsAdjuster]
    code: 201
    input: ["scheduled_item_id", "peril", "loss_type", "claimed_amount_cents", "loss_zip?", "occurred_outside_country?"]
    output: Claim
    side_effects: ["status=FNOL; policy_id := path policy"]

  - method: GET
    path: "/claims/{id}"
    description: "Get a Claim (includes settlement_cents, deductible_applied_cents)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List Claims; filter by policy_id (reverse lookup of Claim.policy_id) or scheduled_item_id (reverse lookup of Claim.scheduled_item_id)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["policy_id?", "scheduled_item_id?"]
    output: "Claim[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/start_review"
    description: "Begin adjudication (FNOL -> UNDER_REVIEW); locks the item"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> UNDER_REVIEW; referenced ScheduledItem ACTIVE -> SUSPENDED"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/request_info"
    description: "Bounce the claim back for more information (UNDER_REVIEW -> INFO_REQUESTED)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> INFO_REQUESTED; info_request_count += 1"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/provide_info"
    description: "Claimant supplies info (INFO_REQUESTED -> UNDER_REVIEW); cyclic"
    roles: [Policyholder]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/approve"
    description: "Approve a claim (UNDER_REVIEW -> APPROVED); computes settlement (OCC-guarded on Claim.version)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status -> APPROVED; settlement_cents and deductible_applied_cents computed per valuation_basis"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/deny"
    description: "Deny a claim (UNDER_REVIEW/INFO_REQUESTED -> DENIED); unlocks item"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> DENIED; referenced ScheduledItem SUSPENDED -> ACTIVE; settlement_cents stays 0"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/settle"
    description: "Settle an APPROVED TOTAL_LOSS claim directly (APPROVED -> SETTLED)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> SETTLED; TOTAL_LOSS item SUSPENDED -> REMOVED; recompute Policy insured value and premium"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/close"
    description: "Close a SETTLED claim (SETTLED -> CLOSED)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["status -> CLOSED"]

  # ---- RepairOrder (under a Claim; discoverable top-level) ----
  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/repair-order"
    description: "Assign a RepairOrder to an APPROVED PARTIAL_DAMAGE claim"
    roles: [ClaimsAdjuster]
    code: 201
    input: [repair_shop_id]
    output: RepairOrder
    side_effects: ["status=ASSIGNED; authorized_amount_cents := claim.settlement_cents; claim_id := path claim"]

  - method: GET
    path: "/repair-orders/{id}"
    description: "Get a RepairOrder"
    roles: [Underwriter, ClaimsAdjuster, Policyholder, RepairShop]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: GET
    path: "/repair-orders"
    description: "List RepairOrders; filter by claim_id (reverse lookup of RepairOrder.claim_id) or repair_shop_id (reverse lookup of RepairOrder.repair_shop_id)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder, RepairShop]
    code: 200
    input: ["claim_id?", "repair_shop_id?"]
    output: "RepairOrder[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/repair-order/accept"
    description: "RepairShop accepts the order (ASSIGNED -> IN_PROGRESS)"
    roles: [RepairShop]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/repair-order/complete"
    description: "RepairShop completes the repair (IN_PROGRESS -> REPAIRED -> CLOSED); settles the claim"
    roles: [RepairShop]
    code: 200
    input: [actual_cost_cents]
    output: RepairOrder
    side_effects:
      - "status -> REPAIRED then CLOSED; parent Claim APPROVED -> SETTLED; item SUSPENDED -> ACTIVE"

  - method: POST
    path: "/policies/{policyId}/claims/{claimId}/repair-order/deem_total_loss"
    description: "Deem the item a total loss mid-repair (IN_PROGRESS -> DEEMED_TOTAL_LOSS -> CLOSED)"
    roles: [RepairShop, ClaimsAdjuster]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "status -> DEEMED_TOTAL_LOSS then CLOSED; Claim.loss_type -> TOTAL_LOSS; settlement_cents recomputed at full item value; item SUSPENDED -> REMOVED; recompute Policy insured value and premium"

  # ---- PremiumPayment (under a Policy) ----
  - method: POST
    path: "/policies/{policyId}/payments"
    description: "Record a premium payment against a billable Policy"
    roles: [Policyholder, Underwriter]
    code: 201
    input: [amount_cents]
    output: PremiumPayment
    side_effects:
      - "status=RECEIVED; billing_status -> PAID; may bubble coverage_status BOUND->ACTIVE or LAPSED->ACTIVE; policy_id := path policy"
      - "increments Policy.version by 1"

  - method: GET
    path: "/premium-payments/{id}"
    description: "Get a PremiumPayment"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: []
    output: PremiumPayment
    side_effects: []

  - method: GET
    path: "/premium-payments"
    description: "List PremiumPayments; filter by policy_id (reverse lookup of PremiumPayment.policy_id)"
    roles: [Underwriter, ClaimsAdjuster, Policyholder]
    code: 200
    input: ["policy_id?"]
    output: "PremiumPayment[]"
    side_effects: []

  - method: POST
    path: "/policies/{policyId}/payments/{paymentId}/reverse"
    description: "Reverse a received payment (billing_status -> PAST_DUE)"
    roles: [Underwriter]
    code: 200
    input: []
    output: PremiumPayment
    side_effects: ["PremiumPayment.status -> REVERSED; billing_status -> PAST_DUE"]


# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity_backed role does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, enum out of range, non-positive amount, or malformed ZIP" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition is defined" }
  - { id: ERR_NO_SCHEDULED_ITEMS, http: 409, condition: "Bind attempted on a policy with no PENDING ScheduledItems" }
  - { id: ERR_NAMED_PERIL_REQUIRES_PERILS, http: 409, condition: "Bind of a NAMED_PERIL policy with empty listed_perils" }
  - { id: ERR_APPRAISAL_REQUIRED, http: 409, condition: "Bind blocked: an item above the appraisal threshold lacks a non-null VALID appraisal_id" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Claim file/start_review on a policy whose coverage_status is not ACTIVE" }
  - { id: ERR_PERIL_NOT_COVERED, http: 409, condition: "Claimed peril not in a NAMED_PERIL policy's listed_perils" }
  - { id: ERR_WORLDWIDE_NOT_COVERED, http: 409, condition: "Loss occurred_outside_country on a policy without worldwide_coverage" }
  - { id: ERR_ITEM_LOCKED_BY_CLAIM, http: 409, condition: "REMOVE_ITEM endorsement/removal targets an item SUSPENDED by an open claim" }
  - { id: ERR_NO_OP_ENDORSEMENT, http: 422, condition: "CHANGE_DEDUCTIBLE endorsement whose new option equals the current option" }
  - { id: ERR_INFO_REQUEST_LIMIT, http: 409, condition: "request_info called when info_request_count already at MAX_INFO_REQUESTS" }
  - { id: ERR_SHOP_SUSPENDED, http: 409, condition: "RepairOrder assigned to / accepted by a SUSPENDED RepairShop" }
  - { id: ERR_REPAIR_EXCEEDS_AUTH, http: 409, condition: "Repair actual_cost_cents exceeds authorized_amount_cents" }
  - { id: ERR_PREMIUM_UNDERPAID, http: 409, condition: "Premium payment amount_cents below annual_premium_cents" }
  - { id: ERR_POLICY_NOT_BILLABLE, http: 409, condition: "Premium payment on a policy not yet BOUND (or already CANCELLED)" }
  - { id: ERR_PARTIAL_REQUIRES_REPAIR, http: 409, condition: "Direct settle attempted on a PARTIAL_DAMAGE claim" }
  - { id: ERR_OPEN_CLAIM_BLOCKS_CANCEL, http: 409, condition: "Cancel attempted while a claim is UNDER_REVIEW/INFO_REQUESTED/APPROVED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_policy_version / expected_claim_version does not match the live parent version" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Prices, binds, endorses, cancels policies; manages risk zones, repair-shop network, and files appraisals on behalf of insureds"
    identity: "opaque"
    exclusive_operations:
      - "POST /policyholders — register policyholder"
      - "POST /risk-zones — create risk zone"
      - "POST /repair-shops — register repair shop"
      - "POST /repair-shops/{id}/suspend — suspend shop"
      - "POST /policies — create policy"
      - "POST /policies/{id}/bind — bind policy"
      - "POST /policies/{id}/scheduled-items — add scheduled item"
      - "POST /policies/{id}/endorsements — draft endorsement"
      - "POST /policies/{id}/endorsements/{eid}/apply — apply endorsement"
      - "POST /policies/{id}/endorsements/{eid}/reject — reject endorsement"
      - "POST /policies/{id}/payments/{pid}/reverse — reverse payment"
    shared_operations:
      - "POST /appraisals — file appraisal (shared with Appraiser)"
      - "POST /policies/{id}/cancel — cancel policy (shared with Policyholder)"
      - "POST /policies/{id}/payments — record premium payment (shared with Policyholder)"
      - "GET endpoints — read policies/items/claims/appraisals/zones/shops"

  - name: ClaimsAdjuster
    description: "Adjudicates claims: review loop, approve/deny, settle, assign/deem repair orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /policies/{id}/claims/{cid}/start_review — start review"
      - "POST /policies/{id}/claims/{cid}/request_info — request info"
      - "POST /policies/{id}/claims/{cid}/approve — approve claim"
      - "POST /policies/{id}/claims/{cid}/deny — deny claim"
      - "POST /policies/{id}/claims/{cid}/settle — settle claim"
      - "POST /policies/{id}/claims/{cid}/close — close claim"
      - "POST /policies/{id}/claims/{cid}/repair-order — assign repair order"
    shared_operations:
      - "POST /policies/{id}/claims — file claim (shared with Policyholder)"
      - "POST /_clock/set_current_utc — advance clock (shared with Underwriter)"
      - "POST /policies/{id}/claims/{cid}/repair-order/deem_total_loss — deem total loss (shared with RepairShop)"
      - "GET endpoints — read"

  - name: Appraiser
    description: "Independent appraiser who files appraisals for policyholders"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /appraisals — file appraisal (shared with Underwriter)"
      - "GET /appraisals/{id}, GET /policyholders/{id}/appraisals — read own/relevant appraisals"

  - name: Policyholder
    description: "The insured principal; files and supplies info on claims, pays premium, cancels own policy"
    identity: "entity_backed:Policyholder"
    exclusive_operations:
      - "POST /policies/{id}/claims/{cid}/provide_info — supply claim info"
    shared_operations:
      - "POST /policies/{id}/claims — file claim (shared with ClaimsAdjuster)"
      - "POST /policies/{id}/cancel — cancel own policy (shared with Underwriter)"
      - "POST /policies/{id}/payments — pay premium (shared with Underwriter)"
      - "GET endpoints — read own policies/items/claims"

  - name: RepairShop
    description: "Network repair shop acting on its assigned repair orders"
    identity: "entity_backed:RepairShop"
    exclusive_operations:
      - "POST /policies/{id}/claims/{cid}/repair-order/accept — accept repair order"
      - "POST /policies/{id}/claims/{cid}/repair-order/complete — complete repair"
    shared_operations:
      - "POST /policies/{id}/claims/{cid}/repair-order/deem_total_loss — deem total loss (shared with ClaimsAdjuster)"
      - "GET /repair-shops/{id}, GET /policies/{id}/claims/{cid}/repair-order — read"
