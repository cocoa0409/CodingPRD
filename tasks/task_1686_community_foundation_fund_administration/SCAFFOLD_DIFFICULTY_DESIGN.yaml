  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: buyin_redemption_conserves_pool_nav_identity
        grounds:
          - calculations.unit_price_and_units
          - entities.InvestmentPool.fields.nav
          - entities.InvestmentPool.fields.units_outstanding
        distinguishing_aspect: |
          Conserved quantity — pool value identity: for a BUY_IN followed by a
          full REDEMPTION of the minted units at the SAME unit_price (no
          mark-to-market between), nav and units_outstanding return exactly to
          their pre-buy-in values and the fund's cash_balance is unchanged
          (25000 out then 25000 back). Conserved quantity: pool NAV and fund
          cash pair.
        test_recipe:
          setup:
            - "Pool p2 nav 1000000.00 units 50000.0000 OPEN; fund fu2 ACTIVE cash 30000.00"
          setup_api_calls:
            - call: "POST /pools"
              payload: { pool_name: "Invariant Pool", pool_kind: "CONSERVATIVE", initial_nav: 1000000.00, initial_units: 50000.0000 }
              as: InvestmentManager
              captures: { p2_id: $.data.id, p2_v0: $.data.version }
            - call: "POST /funds"
              payload: { fund_name: "Inv Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { fu2_id: $.data.id }
            - call: "POST /funds/${fu2_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fu2_ag: $.data.id }
            - call: "POST /agreements/${fu2_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fu2_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 30000.00 }
              as: GiftOfficer
              captures: { fu2_c: $.data.id }
            - call: "POST /contributions/${fu2_c}/accept"
              payload: {}
              as: GiftOfficer
            - call: "POST /funds/${fu2_id}/activate"
              payload: {}
              as: FoundationAdmin
          trigger:
            - call: "POST /pools/${p2_id}/unitization-events"
              payload: { event_kind: "BUY_IN", fund_id: "${fu2_id}", cash_amount: 25000.00, expected_pool_version: "${p2_v0}" }
              as: InvestmentManager
              captures: { p2_ev1: $.data.id }
            - call: "GET /pools/${p2_id}"
              as: InvestmentManager
              captures: { p2_v1: $.data.version, p2_nav1: $.data.nav }
            - call: "POST /pools/${p2_id}/unitization-events"
              payload: { event_kind: "REDEMPTION", fund_id: "${fu2_id}", units_amount: 1250.0000, expected_pool_version: "${p2_v1}" }
              as: InvestmentManager
              captures: { p2_ev2: $.data.id }
            - call: "GET /pools/${p2_id}"
              as: InvestmentManager
              captures: { p2_nav2: $.data.nav, p2_units2: $.data.units_outstanding }
            - call: "GET /funds/${fu2_id}"
              as: FoundationAdmin
              captures: { fu2_cash: $.data.cash_balance }
          assert:
            - "Pool(p2).nav == 1000000.00 after round-trip (conserved)"
            - "Pool(p2).units_outstanding == 50000.0000 after round-trip (conserved)"
            - "Fund(fu2).cash_balance == 30000.00 after round-trip (compensation exact)"

      - name: grant_disburse_and_cancel_conserve_fund_cash
        grounds:
          - state_machines.GrantRecommendation.APPROVED_to_DISBURSED
          - entities.Fund.fields.cash_balance
          - entities.Disbursement.fields.amount
        distinguishing_aspect: |
          Different conserved quantity — fund cash conservation across the
          disbursement ledger: disbursing a 1000.00 grant reduces cash_balance by
          exactly the Disbursement.amount and creates exactly one Disbursement
          row whose amount equals the debit (cash_out == sum(Disbursement));
          cancelling before disburse leaves cash untouched (zero drift).
          Conserved: fund.cash_balance delta == -sum(Disbursement.amount).
        test_recipe:
          setup:
            - "Fund fc2 ACTIVE non-endowed cash 50000.00; grantee CLEARED; grant ga 1000.00 APPROVED; grant gb 2000.00 APPROVED"
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "Conserve Fund", fund_type: "DESIGNATED", endowed: false }
              as: FoundationAdmin
              captures: { fc2_id: $.data.id }
            - call: "POST /funds/${fc2_id}/agreements"
              payload: { spending_rate_pct: 4.5, spending_formula: "AVERAGE_12Q", fee_tier_schedule: "STANDARD", min_initial_contribution: 10000.00 }
              as: FoundationAdmin
              captures: { fc2_ag: $.data.id }
            - call: "POST /agreements/${fc2_ag}/execute"
              payload: {}
              as: FoundationAdmin
            - call: "POST /contributions"
              payload: { fund_id: "${fc2_id}", donor_name: "Seed", asset_kind: "CASH", declared_value: 50000.00 }
              as: GiftOfficer
              captures: { fc2_c: $.data.id }
            - call: "POST /contributions/${fc2_c}/accept"
