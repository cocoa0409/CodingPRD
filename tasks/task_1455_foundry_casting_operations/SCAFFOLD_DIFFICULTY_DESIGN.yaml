  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pour_slot_half_open_buffer_semantics
        grounds:
          - calculations.slot_overlap
          - errors[ERR_SLOT_WINDOW_CONFLICT]
          - entities.Equipment.fields.cleanup_buffer_minutes
        distinguishing_aspect: |
          Molding-line slots use HALF-OPEN intervals plus a mandatory post-slot cleanup buffer B=30:
          a slot starting exactly at the previous slot's end (11:00 after [10:00,11:00)) still
          conflicts because the buffer is not elapsed, while a start at exactly end+B (11:30) is
          allowed — boundary equality belongs to the non-conflict side only after the buffer.
        test_recipe:
          setup:
            - "Line with cleanup_buffer_minutes 30; heat CERTIFIED/TAPPED; three ASSEMBLED molds; slot1 BOOKED [10:00, 11:00)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/customers", payload: { foundry_id: "${f_id}", company_name: "Acme", credit_limit_cents: 100000000 }, as: FoundryAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "MOLDING_LINE", label: "Line-A", daily_minute_capacity: 480, cleanup_buffer_minutes: 30 }, as: FoundryAdmin, captures: { line_id: $.data.id } }
            - { call: "POST /api/sand-batches", payload: { foundry_id: "${f_id}", virgin_weight_kg: 1000, max_loi_pct: 3.0 }, as: LineOperator, captures: { sb_id: $.data.id } }
            - { call: "POST /api/sand-batches/${sb_id}/test", payload: { loi_pct: 2.5 }, as: QualityInspector }
            - { call: "POST /api/patterns", payload: { foundry_id: "${f_id}", part_number: "PN-1", alloy_shrink_class: "FERROUS", mold_process: "SAND", finish_dimensions_mm: [100.0, 50.0, 25.0], machining_allowance_mm: 8.0, impressions: 1 }, as: PatternMaker, captures: { pat_id: $.data.id } }
            - { call: "POST /api/patterns/${pat_id}/qualify", payload: { measured_dimensions_mm: [107.1, 56.6, 31.3] }, as: PatternMaker }
            - { call: "POST /api/orders", payload: { foundry_id: "${f_id}", customer_id: "${cust_id}", pattern_id: "${pat_id}", quantity: 3, unit_price_cents: 100000, machining_allowance_pct: 0.15, warranty_months: 12, warranty_budget_cents: 500000 }, as: FoundryAdmin, captures: { ord_id: $.data.id } }
            - { call: "POST /api/heats", payload: { foundry_id: "${f_id}", furnace_id: "${furn_id}", alloy_grade: "GJS-400-15", chemistry_spec: { elements: { C: { min: 3.2, max: 3.6 } } } }, as: MeltSupervisor, captures: { heat_id: $.data.id, heat_v: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/charges", payload: { expected_heat_version: "${heat_v}", additions: [ { source: "VIRGIN", weight_kg: 1000, composition: { C: 3.40 } } ] }, as: MeltSupervisor, captures: { heat_v2: $.data.version } }
            - { call: "POST /api/heats/${heat_id}/samples", payload: { expected_heat_version: "${heat_v2}", reading: { C: 3.40 } }, as: Spectrographer, as_user_id: "spectro_1" }
            - { call: "POST /api/heats/${heat_id}/tap", payload: { tap_weight_kg: 1000 }, as: MeltSupervisor }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { m1: $.data.id } }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { m2: $.data.id } }
            - { call: "POST /api/molds", payload: { pattern_id: "${pat_id}", sand_batch_id: "${sb_id}", order_id: "${ord_id}", sand_weight_kg: 50, metal_weight_kg: 200, cooling_hours: 2 }, as: LineOperator, captures: { m3: $.data.id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${m1}"], start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: LineOperator, captures: { slot1: $.data.id } }
          trigger:
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${m2}"], start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T12:00:00Z" }, as: LineOperator, captures: { err: $.data.error_id } }
            - { call: "POST /api/pour-slots", payload: { molding_line_id: "${line_id}", heat_id: "${heat_id}", mold_ids: ["${m3}"], start_at: "2026-08-10T11:30:00Z", end_at: "2026-08-10T12:30:00Z" }, as: LineOperator, captures: { slot3: $.data.id } }
          assert:
            - "Slot [11:00,12:00) rejected with ERR_SLOT_WINDOW_CONFLICT: 11:00 < 11:00+30min buffer even though it starts exactly at slot1's exclusive end"
            - "Slot [11:30,12:30) accepted (201): 11:30 == 11:00+30min satisfies new.start >= existing.end + B at equality"
            - "GET /api/pour-slots/${slot3}.status == BOOKED"

      - name: furnace_window_closed_interval_touch_conflicts
        grounds:
          - calculations.slot_overlap
          - errors[ERR_FURNACE_WINDOW_CONFLICT]
          - entities.Equipment.fields.maintenance_windows
        distinguishing_aspect: |
          DIFFERENT INTERVAL SEMANTICS on a different resource: furnace maintenance windows are CLOSED
          intervals, so a window starting exactly where the previous one ends (11:00 == 11:00) DOES
          conflict — the exact reverse of the pour-slot half-open rule where touching ends (without
          buffer) do not conflict.
        test_recipe:
          setup:
            - "Furnace with one maintenance window [2026-08-20T10:00, 2026-08-20T11:00] (closed)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: FoundryAdmin }
            - { call: "POST /api/foundries", payload: { name: "F1" }, as: FoundryAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /api/equipment", payload: { foundry_id: "${f_id}", kind: "FURNACE", label: "Cupola-1", daily_tap_capacity_kg: 5000 }, as: FoundryAdmin, captures: { furn_id: $.data.id } }
            - { call: "POST /api/equipment/${furn_id}/windows", payload: { start_iso: "2026-08-20T10:00:00Z", end_iso: "2026-08-20T11:00:00Z" }, as: FoundryAdmin }
          trigger:
            - { call: "POST /api/equipment/${furn_id}/windows", payload: { start_iso: "2026-08-20T11:00:00Z", end_iso: "2026-08-20T12:00:00Z" }, as: FoundryAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/equipment/${furn_id}/windows", payload: { start_iso: "2026-08-20T11:00:01Z", end_iso: "2026-08-20T12:00:00Z" }, as: FoundryAdmin, captures: { equip_after: $.data } }
          assert:
            - "Window [11:00:00, 12:00] rejected with ERR_FURNACE_WINDOW_CONFLICT: closed-interval semantics make the touching endpoint 11:00 overlap"
            - "Window [11:00:01, 12:00] accepted: one second past the closed end does not overlap"
            - "GET /api/equipment/${furn_id}.maintenance_windows has exactly 2 entries"

