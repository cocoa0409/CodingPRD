      - name: counseling_buffer_back_to_back_rejected
        grounds:
          - validations[priority=16]
          - calculations.counseling_buffer_window
          - entities.CounselingSession.fields.start_at
          - errors[ERR_SESSION_BUFFER_CONFLICT]
        distinguishing_aspect: |
          CounselingSession buffered-closed semantics on a different resource
          (birth-parent sessions): with a 60-minute buffer, a back-to-back session
          (start_at == prior end_at) IS rejected with ERR_SESSION_BUFFER_CONFLICT,
          unlike the touching-allowed visit rule in instance 1.
        test_recipe:
          setup:
            - "A BirthParent and a case; one BOOKED session on [2026-06-10T09:00Z, 2026-06-10T10:00Z]."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /birth-parents"
              payload: { agency_id: "${agency_id}", legal_name: "Pat", birth_state: "CA", parent_role: "BIRTH_MOTHER" }
              as: Caseworker
              captures: { bp_id: $.data.id }
            - call: "POST /counseling-sessions"
              payload: { birth_parent_id: "${bp_id}", case_id: "${case_id}", start_at: "2026-06-10T09:00:00.000Z", end_at: "2026-06-10T10:00:00.000Z" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /counseling-sessions"
              payload: { birth_parent_id: "${bp_id}", case_id: "${case_id}", start_at: "2026-06-10T10:00:00.000Z", end_at: "2026-06-10T11:00:00.000Z" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_SESSION_BUFFER_CONFLICT'"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_disburse_then_refund_conserves_balance
        grounds:
          - state_machines.ExpenseEntry.APPROVED_to_DISBURSED
          - calculations.escrow_balance
          - entities.AdoptionCase.fields.escrow_balance_cents
          - entities.EscrowTransaction.fields.txn_type
        distinguishing_aspect: |
          Conserved quantity = AdoptionCase.escrow_balance_cents. A DISBURSEMENT
          of amount A followed by a compensating REFUND of the same A restores
          escrow_balance_cents to its pre-disburse value; invariant pinned as
          balance = deposits - disbursements - refunds netting back to the prior
          balance.
        test_recipe:
          setup:
            - "Case with one DEPOSIT of 1000000 (balance 1000000) and an APPROVED ExpenseEntry of 300000; the expense is disbursed (balance 700000)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-esc", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id, cv0: $.data.version }
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "DEPOSIT", amount_cents: 1000000, expected_case_version: "${cv0}" }
              as: FinanceOfficer
            - call: "POST /expense-entries"
              payload: { case_id: "${case_id}", category: "MEDICAL", amount_cents: 300000 }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { exp_id: $.data.id }
            - call: "POST /expense-entries/${exp_id}/approve"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fo-1"
            - call: "POST /expense-entries/${exp_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fo-1"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: FinanceOfficer
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /escrow-transactions"
              payload: { case_id: "${case_id}", txn_type: "REFUND", amount_cents: 300000, expense_id: "${exp_id}", expected_case_version: "${cv1}" }
              as: FinanceOfficer
          assert:
            - "AdoptionCase.${case_id}.escrow_balance_cents == 1000000"

      - name: home_study_return_then_resubmit_conserves_revision_parity
        grounds:
          - state_machines.HomeStudy.UNDER_REVIEW_to_DEFICIENT
          - state_machines.HomeStudy.DEFICIENT_to_RESUBMITTED
          - entities.HomeStudy.fields.revision_count
          - entities.HomeStudy.fields.status
        distinguishing_aspect: |
          Conserved quantity = the count of OPEN deficiency cycles (returns minus
          resubmits). A 'return' opens one deficiency (returns=1, resubmits=0,
          open=1); the compensating 'resubmit' closes it (open back to 0) while
          revision_count stays at 1 — the open-cycle invariant nets to zero, a
          DIFFERENT conserved quantity type than instance 1's monetary balance.
        test_recipe:
          setup:
            - "A HomeStudy by cw-1 submitted (UNDER_REVIEW) then returned (DEFICIENT, revision_count=1, one open deficiency cycle)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Grace", licensed_state: "CA", fee_schedule_cents: 3000000 }
              as: AgencyAdmin
              captures: { agency_id: $.data.id }
            - call: "POST /cases"
              payload: { agency_id: "${agency_id}", case_label: "C-1", child_state: "CA", family_state: "CA" }
              as: Supervisor
              captures: { case_id: $.data.id }
            - call: "POST /families"
              payload: { case_id: "${case_id}", primary_applicant_name: "Lee", residence_state: "CA", household_size: 2, annual_income_cents: 8000000 }
              as: Caseworker
              captures: { family_id: $.data.id }
            - call: "POST /home-studies"
              payload: { case_id: "${case_id}", family_id: "${family_id}" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hs_id: $.data.id }
            - call: "POST /home-studies/${hs_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /home-studies/${hs_id}/return"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /home-studies/${hs_id}/resubmit"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { st: $.data.status, rev: $.data.revision_count }
          assert:
            - "HomeStudy.${hs_id}.status == 'RESUBMITTED'"
            - "HomeStudy.${hs_id}.revision_count == 1"
