  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: extension_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[extension-create-stale-rendition]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Two strictly sequential extension requests carrying the same observed rendition version: the first succeeds (version advances), the second is rejected with 412 ERR_STALE_VERSION — no wall-clock or parallel dispatch involved."
        test_recipe:
          setup: ["Client C, jurisdiction J (deadline 04-15, max_extension_days 30), DRAFT rendition 2027; version captured at create"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "OccCo", contact_email: "occ@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /bpp/operators"
              payload: { display_name: "Ann Analyst", operator_role: "TAX_ANALYST" }
              as: FirmAdmin
              captures: { op_an: $.data.id }
            - call: "POST /bpp/jurisdictions"
              payload: { county_name: "Occ County", state_code: "TX", base_deadline_mmdd: "04-15", max_extension_days: 30, late_penalty_pct_per_month: 2, max_late_penalty_pct: 10, penalty_base: "VALUE_BASE", tax_rate: 0.02, offered_exemption_types: ["FREEPORT"], max_exemption_pct: 50 }
              as: FirmAdmin
              captures: { j_oc: $.data.id }
            - call: "POST /bpp/renditions"
              payload: { client_id: "${cl_id}", jurisdiction_id: "${j_oc}", tax_year: 2027 }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { r_oc: $.data.id, r_ocv: $.data.version }
          trigger:
            - call: "POST /bpp/renditions/${r_oc}/extensions"
              payload: { requested_extend_to_date: "2027-05-10", expected_rendition_version: "${r_ocv}" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { ex_1: $.data.id, ex_1_status: $.data.extension_status }
            - call: "POST /bpp/renditions/${r_oc}/extensions"
              payload: { requested_extend_to_date: "2027-05-12", expected_rendition_version: "${r_ocv}" }
              as: TaxAnalyst
              as_user_id: "${op_an}"
              captures: { err: $.data.error_id }
          assert:
            - "First request: 201, ex_1_status == GRANTED, granted_days == 25, Rendition.${r_oc}.deadline_date == 2027-05-10 and version advanced by 1"
            - "Second request (same stale version): err == ERR_STALE_VERSION and HTTP status == 412"
            - "GET /bpp/renditions/${r_oc}/extensions returns exactly 1 extension (the rejected one persisted nothing)"

      - name: forecast_occ_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[forecast-create-stale-client]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "The same OCC pattern on a different parent entity (ClientAccount): publishing forecast F1 advances the client version; publishing F2 with the pre-F1 observed version is rejected 412 ERR_STALE_VERSION (different tax_year 2028, so no supersede logic is involved)."
        test_recipe:
          setup: ["Client C exists; client version captured at create"]
          setup_api_calls:
            - call: "POST /bpp/clients"
              payload: { legal_name: "OccForeCo", contact_email: "ocf@x.com" }
              as: FirmAdmin
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /bpp/operators"
              payload: { display_name: "Manny Manager", operator_role: "SENIOR_MANAGER" }
              as: FirmAdmin
              captures: { op_mgr: $.data.id }
          trigger:
            - call: "POST /bpp/clients/${cl_id}/accrual-forecasts"
              payload: { tax_year: 2027, variant: "NOTICE_BASED", as_of_date: "2027-03-01", expected_client_version: "${cl_v}" }
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { f_1: $.data.id }
            - call: "POST /bpp/clients/${cl_id}/accrual-forecasts"
              payload: { tax_year: 2028, variant: "NOTICE_BASED", as_of_date: "2028-01-05", expected_client_version: "${cl_v}" }
              as: SeniorManager
              as_user_id: "${op_mgr}"
              captures: { err: $.data.error_id }
          assert:
            - "First publish: 201, AccrualForecast.${f_1}.forecast_status == PUBLISHED and ClientAccount.${cl_id}.version advanced by 1 and forecast_sequence == 1"
            - "Second publish (stale version): err == ERR_STALE_VERSION and HTTP status == 412; forecast_sequence stays 1"

