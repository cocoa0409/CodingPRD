              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
            - call: "POST /cottage-food/permits/${permit_id}/issue"
              payload: {}
              as: HealthInspector
              captures: { pv: $.data.version }
          trigger:
            - call: "POST /cottage-food/permits/${permit_id}/renew"
              payload: { expected_permit_version: "${pv} - 1" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 412"
            - "response.error_id == ERR_STALE_PERMIT_VERSION"
            - "Permit.${permit_id}.status == ISSUED"

