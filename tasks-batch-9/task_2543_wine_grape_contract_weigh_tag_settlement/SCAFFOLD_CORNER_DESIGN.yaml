              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.id != \"client-chosen-id\""
            - "data.created_at == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z, from the logical clock and not from the body"
