              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_pub_id: $.data.id }
            - call: "POST /fare-families/${f_pub_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_pub_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_pub_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
              captures: { f_ver: $.data.version }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_pub_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
            - call: "GET /fare-families/${f_pub_id}"
              payload: {}
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { f_ver2: $.data.version }
          trigger:
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_pub_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver2}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 with error_id \"ERR_DUPLICATE_PUBLICATION\", not ERR_STALE_FAMILY_VERSION"
            - "GET /channel-publications?fare_family_id=${f_pub_id} returns total_count == 1 and that row is ${pub_id} in IN_PARITY"
            - "GET /fare-families/${f_pub_id} reports publication_count 1 and version still ${f_ver2}"

      - name: disclosing_a_family_with_an_undisclosable_chargeable_fee_returns_undisclosed_fee_category
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNDISCLOSED_FEE_CATEGORY]
          - validations[priority 28]
          - entities.AncillaryProduct.fields.disclosable_fee
        distinguishing_aspect: "The gate is per-attribute and only for CHARGEABLE rows: a family whose WIFI_FULL_FLIGHT product carries disclosable_fee false cannot issue a point-of-sale disclosure at all, and withdrawing that one attribute unblocks it."
        test_recipe:
          setup:
            - "product WIFI_FULL_FLIGHT was created with disclosable_fee false; BAG_CHECKED_1 keeps the default true"
            - "DRAFT family ECO_HIDE carries an ACTIVE CHARGEABLE WIFI_FULL_FLIGHT attribute (included_quantity 0) and nothing else"
            - "HELD booking HIDE01 on ECO_HIDE via DIRECT_WEB exists with disclosure_state NOT_ISSUED"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "WIFI_FULL_FLIGHT", name: "Full-flight wifi", category: "ONBOARD", list_price_cents: 750, tax_treatment: "EXEMPT", revenue_class: "NON_AIR", revenue_account_code: "4500", refundable: true, disclosable_fee: false }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_wifi_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_HIDE", name: "Economy Hidden Fee", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_hide_id: $.data.id }
            - call: "POST /fare-families/${f_hide_id}/attributes"
              payload: { ancillary_product_id: "${p_wifi_id}", inclusion: "CHARGEABLE", included_quantity: 0 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_wifi_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC558", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "HIDE01", flight_id: "${fl_id}", fare_family_id: "${f_hide_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/disclosure"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422 with error_id \"ERR_UNDISCLOSED_FEE_CATEGORY\""
            - "GET /bookings/${bk_id} still reports disclosure_state \"NOT_ISSUED\" with disclosed_fee_fingerprint null and disclosed_at null"
            - "after PATCH /family-attributes/${a_wifi_id} with attribute_state WITHDRAWN, the same disclosure call succeeds with disclosure_state \"PENDING_ACK\" and disclosed_fee_fingerprint \"ECO_HIDE|1|\" (revision_no only moves on a review rejection)"
            - "the family's fee_fingerprint before the withdrawal was \"ECO_HIDE|1|WIFI_FULL_FLIGHT:CHARGEABLE:0:750\""

      - name: merchandising_a_category_the_channel_does_not_support_returns_channel_category_unsupported
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHANNEL_CATEGORY_UNSUPPORTED]
          - validations[priority 31]
          - entities.DistributionChannel.fields.supported_categories
        distinguishing_aspect: "supported_categories filters the offer session by the requested products' categories: on a BAGGAGE-only OTA a SEAT request is refused with 422 and creates no offers, while the very same session for BAG_CHECKED_1 succeeds at 3675 with the channel's 500 bp markup."
        test_recipe:
          setup:
            - "channel OTA_BAGONLY has channel_type OTA, commission_bp 900, markup_bp 500 and supported_categories [BAGGAGE] only"
            - "HELD booking CATG01 on DRAFT family ECO_BARE via OTA_BAGONLY sits on PRESALE flight AC559 at booked_load_factor_pct 50, demand_index_bp 0"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "OTA_BAGONLY", channel_type: "OTA", commission_bp: 900, markup_bp: 500, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_bag_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC559", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 50, demand_index_bp: 0 }
              as: OperationsController
              as_user_id: "oc-001"
            - call: "POST /bookings"
              payload: { record_locator: "CATG01", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_bag_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_bag_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/offer-sessions"
              payload: { touchpoint: "BOOKING", requested_product_ids: ["${p_seat_std_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_bag_id}"
              captures: { err: $.data.error_id }
            - call: "POST /bookings/${bk_id}/offer-sessions"
              payload: { touchpoint: "BOOKING", requested_product_ids: ["${p_bag_id}"] }
              as: ChannelPartner
              as_user_id: "${ch_bag_id}"
          assert:
            - "the first trigger is HTTP 422 with error_id \"ERR_CHANNEL_CATEGORY_UNSUPPORTED\" and GET /ancillary-offers?booking_id=${bk_id} then returns total_count == 0"
            - "the second trigger is HTTP 201 with presented_offer_count 1"
            - "that offer has ancillary_product_id ${p_bag_id}, offered_price_cents 3675 (3500 * 1.0 WTP, BOOKING 10000 bp, then the channel's 500 bp markup) and expected_value_cents 3675"
            - "Booking.ancillary_gross_cents is still 0: presenting an offer books no revenue"

      - name: a_seat_segment_over_a_non_seat_product_returns_seat_product_category_invalid
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_PRODUCT_CATEGORY_INVALID]
          - validations[priority 38]
          - entities.SeatInventorySegment.fields.ancillary_product_id
        distinguishing_aspect: "Seat inventory may only be cut over a product whose category is SEAT: a BAGGAGE product with an otherwise perfectly valid rectangle is refused at priority 38, before any overlap or cabin-capacity arithmetic runs."
        test_recipe:
          setup:
            - "products BAG_CHECKED_1 (BAGGAGE) and SEAT_STANDARD (SEAT) both exist; flight AC560 is PRESALE with cabin_seat_total 120 and no segments"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC560", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
          trigger:
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_bag_id}", zone: "MID", row_start: 20, row_end: 20, seat_letters: ["A", "B", "C"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { err: $.data.error_id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 20, row_end: 20, seat_letters: ["A", "B", "C"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_id: $.data.id }
          assert:
            - "the first trigger is HTTP 422 with error_id \"ERR_SEAT_PRODUCT_CATEGORY_INVALID\""
            - "the second trigger, identical except for the SEAT product, is HTTP 201 with total_seats 3 and effective_price_cents 2000"
            - "GET /seat-segments?flight_id=${fl_id} returns total_count == 1"
            - "GET /ancillary-products/${p_bag_id}/family-attributes returns total_count == 0: the refused segment created no linkage at all"

      - name: retiring_a_family_with_a_held_booking_returns_family_has_live_bookings
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FAMILY_HAS_LIVE_BOOKINGS]
          - validations[priority 46]
          - state_machines.FareFamily.status.PUBLISHED_to_RETIRED
        distinguishing_aspect: "HELD counts as live: retirement is refused while one HELD booking exists and succeeds immediately after that booking is cancelled, with the family's publication going WITHDRAWN in the same request."
        test_recipe:
          setup:
            - "family ECO_RETIRE is PUBLISHED and published IN_PARITY on DIRECT_WEB"
            - "booking LIVE01 on that family is HELD on PRESALE flight AC561"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_RETIRE", name: "Economy Retiring", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_ret_id: $.data.id }
            - call: "POST /fare-families/${f_ret_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_ret_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_ret_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
              captures: { f_ver: $.data.version }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_ret_id}", distribution_channel_id: "${ch_direct_id}", expected_fare_family_version: "${f_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC561", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "LIVE01", flight_id: "${fl_id}", fare_family_id: "${f_ret_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /fare-families/${f_ret_id}/status-change"
              payload: { target_status: "RETIRED", reason: "season ended" }
              as: PricingApprover
              as_user_id: "pa-001"
              captures: { err: $.data.error_id }
            - call: "POST /bookings/${bk_id}/cancel"
              payload: { cancel_reason: "passenger withdrew" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "POST /fare-families/${f_ret_id}/status-change"
              payload: { target_status: "RETIRED", reason: "season ended" }
              as: PricingApprover
              as_user_id: "pa-001"
          assert:
            - "the first trigger is HTTP 409 with error_id \"ERR_FAMILY_HAS_LIVE_BOOKINGS\" and the family is still PUBLISHED"
            - "the third trigger is HTTP 200 with status \"RETIRED\": the cancelled booking no longer counts as live"
            - "GET /channel-publications/${pub_id} reports parity_state \"WITHDRAWN\" after the retirement"
            - "GET /fare-families/${f_ret_id} reports publication_count 0 and unbundled_value_cents 3500 (retirement freezes the valuation, it does not clear it)"

      # Ids whose only trigger lives in §1.8; each stub names its owner so the catalog audit closes.
      - name: irops_sales_blocked_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_IROPS_SALES_BLOCKED]
        excluded_because:
          difficulty_instance: ticket_blocked_while_flight_irops_irregular_then_allowed_after_rescind
          rationale: "That instance already ticks the flight from IRREGULAR (409 ERR_IROPS_SALES_BLOCKED) through a rescind to a successful ticket, which is a strictly stronger check than a standalone trigger."
      - name: fee_disclosure_not_acknowledged_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FEE_DISCLOSURE_NOT_ACKNOWLEDGED]
        excluded_because:
          difficulty_instance: disclosure_stale_beats_publication_and_channel_parity
          rationale: "The same instance walks NOT_ISSUED, PENDING_ACK and STALE against the ticket endpoint, so it raises this id in the PENDING_ACK leg."
      - name: fee_disclosure_stale_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FEE_DISCLOSURE_STALE]
        excluded_because:
          difficulty_instance: disclosure_stale_beats_publication_and_channel_parity
          rationale: "That instance is built precisely to prove ERR_FEE_DISCLOSURE_STALE wins over the publication and parity errors, so a plain trigger would be a subset of it."
      - name: channel_content_parity_breach_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CHANNEL_CONTENT_PARITY_BREACH]
        excluded_because:
          difficulty_instance: offer_accept_requires_channel_parity_compliant_across_families
          rationale: "The breach is raised there on a channel whose BREACHED status comes from an unrelated family, which subsumes the single-family trigger."
      - name: seat_row_out_of_segment_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_ROW_OUT_OF_SEGMENT]
        excluded_because:
          difficulty_instance: seat_point_occupancy_and_out_of_rectangle_assignment
          rationale: "That instance rejects a row outside the rectangle and a letter outside seat_letters in one probe, covering both halves of this id."
      - name: seat_already_occupied_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_ALREADY_OCCUPIED]
        excluded_because:
          difficulty_instance: seat_point_occupancy_and_out_of_rectangle_assignment
          rationale: "Point occupancy against a HELD seat and against a RELEASED seat is exercised there, including the re-hold that must succeed."
      - name: offer_cooloff_conflict_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_COOLOFF_CONFLICT]
        excluded_because:
          difficulty_instance: offer_cooloff_boundary_at_exact_thirty_minutes
          rationale: "The cooloff error is raised at 29 minutes and cleared at exactly 30 there, which pins the boundary a bare trigger would miss."
      - name: seat_inventory_exhausted_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_INVENTORY_EXHAUSTED]
        excluded_because:
          difficulty_instance: booking_state_beats_seat_capacity_on_hold
          rationale: "That instance fills a one-seat segment and then proves the booking-state check at priority 9 outranks this capacity error, raising both ids."
      - name: offer_price_cap_exceeded_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OFFER_PRICE_CAP_EXCEEDED]
        excluded_because:
          difficulty_instance: offer_accept_requires_channel_parity_compliant_across_families
          rationale: "Acceptance above the channel's max_ancillary_price_cents is one of the interleaved rejections in that instance."
      - name: bundle_discount_floor_breach_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BUNDLE_DISCOUNT_FLOOR_BREACH]
        excluded_because:
          difficulty_instance: bundle_price_equal_vs_one_cent_over_a_la_carte_total
          rationale: "The floor breach is tested there at the exact cent where it starts, which strictly contains a standalone violation trigger."
      - name: seat_segment_row_overlap_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEAT_SEGMENT_ROW_OVERLAP]
        excluded_because:
          difficulty_instance: seat_segment_rectangle_overlap_rows_crossed_with_letters
          rationale: "Row-crossed-with-letter overlap, adjacency and letter-disjoint acceptance are all covered there."
      - name: family_not_published_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FAMILY_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: ticket_requires_fare_family_published_not_suspended
          rationale: "DRAFT, IN_REVIEW, SUSPENDED and RETIRED are each pushed at the ticket endpoint there, so every from-state of this id is already covered."
      - name: family_not_published_to_channel_error_stub
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FAMILY_NOT_PUBLISHED_TO_CHANNEL]
        excluded_because:
          difficulty_instance: disclosure_stale_beats_publication_and_channel_parity
          rationale: "Ticketing on a channel with no IN_PARITY publication for the booking's family is one of the ordered rejections in that instance."

  - section: rbac
    instances:
      - name: merchandising_analyst_performs_every_one_of_its_exclusive_catalog_operations
        claim_type: exclusive_operations_permitted
        grounds:
          - roles[MerchandisingAnalyst].exclusive_operations
          - endpoints[PATCH /fare-families/{id}]
          - endpoints[POST /fare-families/{id}/submit]
        distinguishing_aspect: "All six MerchandisingAnalyst-exclusive writes run back to back in one chain - product, family, family PATCH, attribute, attribute PATCH, submit - and the chain ends in IN_REVIEW at version 5 with the override-based valuation."
        test_recipe:
          setup:
            - "the store is empty; ma-001 is the only actor for the catalog half of the chain"
          setup_api_calls: []
          trigger:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_RBAC", name: "Economy RBAC", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_id: $.data.id }
            - call: "PATCH /fare-families/${f_id}"
              payload: { name: "Economy RBAC Renamed" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_id: $.data.id }
            - call: "PATCH /family-attributes/${a_id}"
              payload: { override_price_cents: 3000, waiver_eligible: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          assert:
            - "every call succeeds: 201, 201, 200, 201, 200, 200 in order"
            - "GET /fare-families/${f_id} reports name \"Economy RBAC Renamed\", status \"IN_REVIEW\", design_owner_user_id \"ma-001\" and reviewer_user_id null"
            - "unbundled_value_cents 3000, a_la_carte_total_cents 15000, bundle_discount_bp 667, included_attribute_count 1"
            - "fee_fingerprint == \"ECO_RBAC|1|BAG_CHECKED_1:INCLUDED:1:3000\" and revision_no == 1"
            - "FareFamily.version == 5 (create, PATCH, attribute create, attribute PATCH, submit)"

      - name: other_roles_cannot_touch_the_catalog_or_the_review_gate
        claim_type: other_role_operation_denied
        grounds:
          - roles[MerchandisingAnalyst].exclusive_operations
          - roles[PricingApprover].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority 2]
        distinguishing_aspect: "Priority 2 outranks every state and segregation check: an analyst calling review-decision on its own DRAFT family is refused for its ROLE (403) rather than for ERR_FAMILY_STATE_INVALID (priority 8) or ERR_SEGREGATION_OF_DUTIES (priority 7)."
        test_recipe:
          setup:
            - "DRAFT family ECO_RBAC was designed by ma-001 and has no attributes yet"
            - "channel DIRECT_WEB exists so a ChannelPartner identity is available"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_RBAC", name: "Economy RBAC", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
          trigger:
            - call: "POST /fare-families"
              payload: { code: "CP_TRY", name: "Channel partner attempt", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { err_partner: $.data.error_id }
            - call: "POST /flights"
              payload: { flight_no: "AC570", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err_analyst_flight: $.data.error_id }
            - call: "POST /fare-families/${f_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err_analyst_review: $.data.error_id }
          assert:
            - "all three responses are HTTP 403 with error_id \"ERR_ROLE_NOT_PERMITTED\""
            - "err_analyst_review is ERR_ROLE_NOT_PERMITTED, NOT ERR_FAMILY_STATE_INVALID and NOT ERR_SEGREGATION_OF_DUTIES"
            - "GET /fare-families returns total_count == 1 (only ECO_RBAC) and it is still DRAFT with version 1"
            - "GET /flights returns total_count == 0"

      - name: revenue_accountant_is_the_only_role_that_may_read_the_ancillary_ledger
        claim_type: other_role_operation_denied
        grounds:
          - roles[RevenueAccountant].exclusive_operations
          - endpoints[GET /bookings/{id}/revenue-entries]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The ledger is walled off from the very channel that generated the sale: the ChannelPartner that accepted the offer and the DistributionManager both get 403, while ra-001 reads the single SALE row of 3500 / 140 / 3360."
        test_recipe:
          setup:
            - "HELD booking LEDG01 on DRAFT family ECO_BARE via DIRECT_WEB accepted a BAG_CHECKED_1 offer at 3500 on PRESALE flight AC571 (booked_load_factor_pct 50, demand_index_bp 0)"
            - "that acceptance posted exactly one SALE RevenueEntry: gross 3500, tax 140 at TAXABLE_SERVICE 400 bp, net 3360"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_bare_id: $.data.id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "DIRECT", commission_bp: 0, markup_bp: 0, max_ancillary_price_cents: 20000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_direct_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC571", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
