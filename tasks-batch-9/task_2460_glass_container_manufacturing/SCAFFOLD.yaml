    path: "/glass-plant/production-jobs/{production_job_id}/refractory-projection"
    description: "Computed read returning the job's nominal and stress-adjusted refractory projections side by side"
    roles: [PlantManager, PlantScheduler, QualityEngineer]
    code: 200
    input: []
    output: ProductionJob
    side_effects: []
  - method: POST
    path: "/glass-plant/production-jobs/{production_job_id}/start"
    description: "Start a scheduled job, mounting its mold set and charging changeover downtime"
