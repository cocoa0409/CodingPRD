  - method: GET
    path: "/registry-items/{id}"
    description: "Reads one registry item with its fulfilled quantity."
    roles: [RegistryOwner, GiftPurchaser, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: RegistryItem
    side_effects: []

  - method: GET
    path: "/registry-items"
    description: "Lists registry items, filterable by registry and SKU."
    roles: [RegistryOwner, GiftPurchaser, SupportAgent, OpsAdmin]
    code: 200
    input: ["registry_id?", "sku_id?", "status?", "limit?", "offset?"]
    output: RegistryItem[]
    side_effects: []

  - method: PATCH
    path: "/registries/{id}/items/{item_id}"
    description: "Changes the requested quantity on an item; the item must belong to the registry in the path."
    roles: [RegistryOwner]
    code: 200
    input: ["requested_quantity?"]
    output: RegistryItem
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G4_SHAPE, G5_OWNERSHIP, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects: ["recomputes Registry.completion_pct", "increments RegistryItem.version by 1"]

  - method: DELETE
    path: "/registries/{id}/items/{item_id}"
    description: "Removes an item that has no gift activity."
    roles: [RegistryOwner]
    code: 200
    input: []
    output: RegistryItem
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G5_OWNERSHIP, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects: ["recomputes Registry.completion_pct"]

  # --- GiftOrder (Pipeline G) ---
  - method: POST
    path: "/gift-orders"
    description: "A third party reserves a gift against a registry item. OCC-guarded on the registry item's version."
    roles: [GiftPurchaser]
    code: 201
    input: [registry_item_id, purchaser_account_id, quantity, expected_registry_item_version, "gift_message?"]
    output: GiftOrder
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G4_SHAPE, G5_OWNERSHIP, G6_OCC, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects: ["creates the GiftOrder in PENDING_PAYMENT", "increments RegistryItem.version by 1"]

  - method: GET
    path: "/gift-orders/{id}"
    description: "Reads one gift order."
    roles: [GiftPurchaser, RegistryOwner, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: GiftOrder
    side_effects: []

  - method: GET
    path: "/gift-orders"
    description: "Lists gift orders, filterable by registry item and purchaser."
    roles: [GiftPurchaser, RegistryOwner, SupportAgent, OpsAdmin]
    code: 200
    input: ["registry_item_id?", "purchaser_account_id?", "status?", "limit?", "offset?"]
    output: GiftOrder[]
    side_effects: []

  - method: POST
    path: "/gift-orders/{id}/pay"
    description: "Captures payment at the SKU price in force NOW and advances the registry item's fulfilment."
    roles: [GiftPurchaser]
    code: 200
    input: []
    output: GiftOrder
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G5_OWNERSHIP, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects:
      - "sets paid_cents per calculations.gift_order_total_cents (at_payment_price) and paid_at"
      - "GiftOrder PENDING_PAYMENT -> PAID"
      - "increments RegistryItem.fulfilled_quantity, driving the RegistryItem machine"
      - "increments GiftOrder.version by 1"

  - method: POST
    path: "/gift-orders/{id}/claim"
    description: "The registry owner claims the gift either as spendable CREDIT or as a shipped ITEM. The two branches carry different side effects."
    roles: [RegistryOwner]
    code: 200
    input: [claim_mode, "service_level?"]
    output: GiftOrder
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G4_SHAPE, G5_OWNERSHIP, G7_LIFECYCLE, G8_TEMPORAL, G9_POLICY_FISCAL]
    side_effects:
      - "CREDIT branch: creates a non-refundable GIFT Credit for paid_cents; NO shipment"
      - "ITEM branch: re-prices paid_cents at the claim-time SKU price, decrements stock and creates a ONE-OFF Shipment with gift_order_id set"
      - "GiftOrder PAID -> CLAIMED_CREDIT or -> CLAIMED_ITEM"
      - "increments GiftOrder.version by 1"

  - method: POST
    path: "/gift-orders/{id}/refund"
    description: "The purchaser refunds the gift in full; Pipeline G never prorates and never charges a restock fee. RegistryOwner is listed so the refusal at validation priority 16 is an explicit business decision rather than a routing 403."
    roles: [GiftPurchaser, RegistryOwner]
    code: 200
    input: []
    output: GiftOrder
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G5_OWNERSHIP, G7_LIFECYCLE]
    side_effects:
      - "GiftOrder -> REFUNDED and creates a Refund in REQUESTED with reason GIFT_REFUND, restock_fee_cents 0"
      - "decrements RegistryItem.fulfilled_quantity, driving FULFILLED -> PARTIALLY_FULFILLED -> REQUESTED"
      - "REVOKES the derived GIFT Credit and reverses its consumption on any PLANNED/ALLOCATED cycle (depth-5 cascade)"
      - "increments GiftOrder.version by 1"

  # --- Credit ---
  - method: POST
    path: "/credits"
    description: "Issues a goodwill credit to an account."
    roles: [SupportAgent]
    code: 201
    input: [account_id, issued_cents, "credit_type?"]
    output: Credit
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G4_SHAPE]
    side_effects: ["creates a Credit with credit_type GOODWILL (default), refundable true and expires_at = now + 365 days", "recomputes Account.available_credit_cents"]

  - method: GET
    path: "/credits/{id}"
    description: "Reads one credit with its four-bucket money split."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: Credit
    side_effects: []

  - method: GET
    path: "/credits"
    description: "Lists credits, filterable by account and origin."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: ["account_id?", "source_gift_order_id?", "source_referral_id?", "credit_type?", "status?", "limit?", "offset?"]
    output: Credit[]
    side_effects: []

  - method: POST
    path: "/credits/{id}/revoke"
    description: "Revokes the unspent remainder of a credit."
    roles: [SupportAgent]
    code: 200
    input: []
    output: Credit
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["moves remaining_cents into forfeited_cents", "Credit -> REVOKED", "recomputes Account.available_credit_cents", "increments Credit.version by 1"]

  - method: POST
    path: "/credits/{id}/expire"
    description: "Expires a credit whose expires_at has passed."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Credit
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE, G8_TEMPORAL]
    side_effects: ["moves remaining_cents into forfeited_cents", "Credit -> EXPIRED", "increments Credit.version by 1"]

  # --- Shipment (SHARED by both pipelines) ---
  - method: GET
    path: "/shipments/{id}"
    description: "Reads one shipment; cycle_id is set for Pipeline R and gift_order_id for Pipeline G."
    roles: [AccountHolder, RegistryOwner, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "Lists shipments, filterable by account, cycle and gift order."
    roles: [AccountHolder, RegistryOwner, SupportAgent, OpsAdmin]
    code: 200
    input: ["account_id?", "cycle_id?", "gift_order_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shipments/{id}/pick"
    description: "Picks the shipment in the warehouse."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Shipment
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Shipment CREATED -> PICKED", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/transit"
    description: "Hands the shipment to the carrier and sets its ETA."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Shipment
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Shipment PICKED -> IN_TRANSIT", "sets eta_days per calculations.shipment_eta_days", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/exception"
    description: "Records a carrier exception; permitted at most twice per shipment."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Shipment
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Shipment IN_TRANSIT -> EXCEPTION", "increments exception_count", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/retry"
    description: "Returns an exception shipment to transit."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Shipment
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Shipment EXCEPTION -> IN_TRANSIT", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Confirms carrier delivery; a gift shipment drives GiftOrder CLAIMED_ITEM -> FULFILLED."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Shipment
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Shipment IN_TRANSIT -> DELIVERED", "GiftOrder CLAIMED_ITEM -> FULFILLED for gift shipments", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/return"
    description: "Marks a shipment returned."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Shipment
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Shipment EXCEPTION/DELIVERED -> RETURNED", "increments Shipment.version by 1"]

  # --- Loyalty ---
  - method: GET
    path: "/loyalty-accounts/{id}"
    description: "Reads one loyalty wallet with its tier and trailing earn total."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: LoyaltyAccount
    side_effects: []

  - method: GET
    path: "/loyalty-accounts"
    description: "Lists loyalty wallets, filterable by account."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: ["account_id?", "tier?", "limit?", "offset?"]
    output: LoyaltyAccount[]
    side_effects: []

  - method: POST
    path: "/loyalty-accounts/{id}/redemptions"
    description: "Burns points into an account-level credit, subject to the 500-point floor."
    roles: [AccountHolder]
    code: 201
    input: [points]
    output: PointsLedgerEntry
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G4_SHAPE, G5_OWNERSHIP, G9_POLICY_FISCAL]
    side_effects:
      - "writes a REDEEM PointsLedgerEntry with delta_points = -points"
      - "issues a GOODWILL Credit worth points * POINT_VALUE_CENTS (1)"
      - "increments LoyaltyAccount.version by 1"

  - method: POST
    path: "/loyalty-accounts/{id}/expire-points"
    description: "Runs the FIFO expiry sweep for one wallet."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: LoyaltyAccount
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE]
    side_effects: ["writes EXPIRE PointsLedgerEntry rows per calculations.points_expiry_sweep", "increments LoyaltyAccount.version by 1"]

  - method: POST
    path: "/loyalty-accounts/{id}/reevaluate-tier"
    description: "Re-evaluates the tier in BOTH directions; this is the only path that can DOWNGRADE a tier."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: LoyaltyAccount
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE]
    side_effects:
      - "applies calculations.tier_evaluation under the on_demand_full_reevaluation variant"
      - "recomputes Subscription.free_shipping_eligible for every non-cancelled subscription of the account"
      - "increments LoyaltyAccount.version by 1"

  - method: GET
    path: "/points-ledger-entries/{id}"
    description: "Reads one points movement."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: PointsLedgerEntry
    side_effects: []

  - method: GET
    path: "/points-ledger-entries"
    description: "Lists points movements, filterable by wallet, cycle and entry type."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: ["loyalty_account_id?", "cycle_id?", "entry_type?", "limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []

  # --- Referral ---
  - method: POST
    path: "/referrals"
    description: "Creates a referral link explicitly (the same row the verify endpoint creates implicitly)."
    roles: [OpsAdmin]
    code: 201
    input: [referrer_account_id, referee_account_id, code]
    output: Referral
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G4_SHAPE, G9_POLICY_FISCAL]
    side_effects: ["creates the Referral in PENDING with expires_at = now + 120 days"]

  - method: GET
    path: "/referrals/{id}"
    description: "Reads one referral with its vesting cycle and credit amount."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: GET
    path: "/referrals"
    description: "Lists referrals, filterable by referrer, referee and vesting cycle."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: ["referrer_account_id?", "referee_account_id?", "vesting_cycle_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: POST
    path: "/referrals/{id}/expire"
    description: "Lapses a referral whose 120-day vesting window has passed without a delivery."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Referral
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE, G8_TEMPORAL]
    side_effects: ["Referral PENDING -> EXPIRED", "no Credit is issued", "increments Referral.version by 1"]

  # --- Refund ---
  - method: GET
    path: "/refunds/{id}"
    description: "Reads one refund with its money, points and credit-restoration breakdown."
    roles: [AccountHolder, GiftPurchaser, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: GET
    path: "/refunds"
    description: "Lists refunds, filterable by account, cycle and gift order."
    roles: [AccountHolder, GiftPurchaser, SupportAgent, OpsAdmin]
    code: 200
    input: ["account_id?", "cycle_id?", "gift_order_id?", "status?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  - method: POST
    path: "/refunds/{id}/approve"
    description: "Approves a requested refund and records the approving identity."
    roles: [SupportAgent]
    code: 200
    input: []
    output: Refund
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Refund REQUESTED -> APPROVED", "sets approved_by_user_id", "increments Refund.version by 1"]

  - method: POST
    path: "/refunds/{id}/settle"
    description: "Settles an approved refund. The settling identity MUST differ from the approving identity."
    roles: [OpsAdmin, SupportAgent]
    code: 200
    input: []
    output: Refund
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G5_OWNERSHIP, G7_LIFECYCLE, G9_POLICY_FISCAL]
    side_effects:
      - "Refund APPROVED -> SETTLED, sets refunded_cash_cents and settled_by_user_id"
      - "drives the Cycle payment axis and decrements retained_cash_cents"
      - "writes ONE CLAWBACK PointsLedgerEntry per calculations.points_clawback_on_refund"
      - "restores refundable credits per calculations.credit_restoration_on_refund; GIFT credit is never restored"
      - "Referral VESTED -> CLAWED_BACK when the refunded cycle vested it"
      - "increments Refund.version by 1"

  - method: POST
    path: "/refunds/{id}/deny"
    description: "Denies a requested refund; nothing moves."
    roles: [SupportAgent]
    code: 200
    input: []
    output: Refund
    gates: [G1_AUTH, G2_RBAC, G3_EXISTENCE, G7_LIFECYCLE]
    side_effects: ["Refund REQUESTED -> DENIED", "increments Refund.version by 1"]

  # --- SubstitutionEvent reads ---
  - method: GET
    path: "/substitution-events/{id}"
    description: "Reads one substitution ladder run, including which rung won."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: []
    output: SubstitutionEvent
    side_effects: []

  - method: GET
    path: "/substitution-events"
    description: "Lists substitution ladder runs, filterable by line and by either SKU side."
    roles: [AccountHolder, SupportAgent, OpsAdmin]
    code: 200
    input: ["cycle_line_id?", "from_sku_id?", "to_sku_id?", "outcome?", "reason?", "limit?", "offset?"]
    output: SubstitutionEvent[]
    side_effects: []

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  # --- authentication / authorisation ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing, or X-User-ID missing for any role other than Anonymous."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared role names."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's §1.5 roles."
  - id: ERR_CATALOG_WRITE_FORBIDDEN
    http: 403
    condition: "A non-OpsAdmin role attempts a Plan or Sku write."
  - id: ERR_GIFT_PURCHASER_SCOPE
    http: 403
    condition: "GiftPurchaser attempts any Pipeline-R endpoint."
  - id: ERR_NOT_ACCOUNT_OWNER
    http: 403
    condition: "AccountHolder X-User-ID does not own the addressed resource's account."
  - id: ERR_NOT_REGISTRY_OWNER
    http: 403
    condition: "RegistryOwner X-User-ID differs from Registry.owner_account_id."
  - id: ERR_NOT_GIFT_PURCHASER
    http: 403
    condition: "GiftPurchaser X-User-ID differs from GiftOrder.purchaser_account_id."
  - id: ERR_PIPELINE_R_REFUND_ACTOR
    http: 403
    condition: "A subscription cancel or cycle return is attempted by an identity that is neither the owning AccountHolder nor OpsAdmin."
  - id: ERR_PIPELINE_G_REFUND_ACTOR
    http: 403
    condition: "A gift refund is attempted by the RegistryOwner or the benefiting AccountHolder instead of the paying GiftPurchaser."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID settling a refund equals Refund.approved_by_user_id."
  - id: ERR_SELF_GIFT_FORBIDDEN
    http: 403
    condition: "The gift purchaser's account is the registry's own owner_account_id."

  # --- existence ---
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No Account with the supplied id."
  - id: ERR_CHILD_NOT_FOUND
    http: 404
    condition: "No Child with the supplied id."
  - id: ERR_ALLERGEN_FLAG_NOT_FOUND
    http: 404
    condition: "No AllergenFlag with the supplied id."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No Plan with the supplied id."
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "No Sku with the supplied id."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "No Subscription with the supplied id."
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "No Cycle with the supplied id."
  - id: ERR_CYCLE_LINE_NOT_FOUND
    http: 404
    condition: "No CycleLine with the supplied id."
  - id: ERR_RESIZE_EVENT_NOT_FOUND
    http: 404
    condition: "No ResizeEvent with the supplied id."
  - id: ERR_SKIP_RECORD_NOT_FOUND
    http: 404
    condition: "No SkipRecord with the supplied id."
  - id: ERR_PAUSE_RECORD_NOT_FOUND
    http: 404
    condition: "No PauseRecord with the supplied id."
  - id: ERR_REGISTRY_NOT_FOUND
    http: 404
    condition: "No Registry with the supplied id."
  - id: ERR_REGISTRY_ITEM_NOT_FOUND
    http: 404
    condition: "No RegistryItem with the supplied id."
  - id: ERR_GIFT_ORDER_NOT_FOUND
    http: 404
    condition: "No GiftOrder with the supplied id."
  - id: ERR_CREDIT_NOT_FOUND
    http: 404
    condition: "No Credit with the supplied id."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "No Shipment with the supplied id."
  - id: ERR_LOYALTY_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No LoyaltyAccount with the supplied id."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "No Referral with the supplied id."
  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "No Refund with the supplied id."
  - id: ERR_SUBSTITUTION_EVENT_NOT_FOUND
    http: 404
    condition: "No SubstitutionEvent with the supplied id."

  # --- request shape ---
  - id: ERR_MISSING_FIELD
    http: 400
    condition: "A required body field is absent or null."
  - id: ERR_INVALID_FORMAT
    http: 400
    condition: "A date, instant, integer or boolean field fails to parse."
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "One of the enum-typed fields listed in validation priority 10 carries a value outside its declared member list."
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "A numeric body field sits outside its declared range."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1,100] or offset below 0 on a list endpoint."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "POST /accounts with an e-mail that already exists."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "POST /plans or POST /skus with a code that already exists in that catalog."

  # --- optimistic concurrency ---
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    condition: "expected_subscription_version does not equal the Subscription's current version."
  - id: ERR_STALE_REGISTRY_ITEM_VERSION
    http: 412
    condition: "expected_registry_item_version does not equal the RegistryItem's current version."

  # --- lifecycle ---
  - id: ERR_INVALID_VERIFICATION_TOKEN
    http: 422
    condition: "The supplied verification_token does not match Account.verification_token."
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "The owning Account is not in status ACTIVE."
  - id: ERR_ACCOUNT_HAS_ACTIVE_SUBSCRIPTIONS
    http: 409
    condition: "Closing an account that still has a Subscription in lifecycle_state ACTIVE or PAUSED."
  - id: ERR_SUBSCRIPTION_DELINQUENT
    http: 409
    condition: "Generating a cycle on a subscription whose billing_state is DELINQUENT."
  - id: ERR_SUBSCRIPTION_STATE_INVALID
    http: 409
    condition: "The subscription's lifecycle_state is not in the transition's from-set, including any attempt on a CANCELLED subscription."
  - id: ERR_CHILD_ARCHIVED
    http: 409
    condition: "The child profile has archived == true."
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "The cycle's status is not in the transition's from-set, including any attempt on a RETURNED or CANCELLED cycle."
  - id: ERR_CYCLE_PAYMENT_STATE_INVALID
    http: 409
    condition: "The cycle's payment_status is not in the transition's from-set, e.g. charging an already-CHARGED cycle."
  - id: ERR_LINE_STATE_INVALID
    http: 409
    condition: "The cycle line's status is not in the transition's from-set, including any attempt on a SHORT_FILLED line."
  - id: ERR_REGISTRY_STATE_INVALID
    http: 409
    condition: "The registry's status is not in the transition's from-set, including any attempt on an ARCHIVED registry."
  - id: ERR_REGISTRY_EMPTY
    http: 409
    condition: "Opening a registry that carries zero RegistryItem rows."
  - id: ERR_REGISTRY_CLOSED
    http: 409
    condition: "Creating or paying a NEW gift against a registry whose status is not OPEN."
  - id: ERR_REGISTRY_ITEM_FULFILLED
    http: 409
    condition: "Creating a gift against a RegistryItem already in status FULFILLED."
  - id: ERR_REGISTRY_ITEM_HAS_GIFTS
    http: 409
    condition: "Deleting a RegistryItem that has at least one GiftOrder in status other than REFUNDED."
  - id: ERR_GIFT_ORDER_STATE_INVALID
    http: 409
    condition: "The gift order's status is not in the transition's from-set, including any attempt on a REFUNDED gift."
  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    condition: "The shipment's status is not in the transition's from-set, including any attempt on a RETURNED shipment."
  - id: ERR_SHIPMENT_RETRY_CAP_EXCEEDED
    http: 409
    condition: "A third carrier exception is recorded on a shipment whose exception_count has already reached SHIPMENT_EXCEPTION_RETRY_CAP (2)."
  - id: ERR_CREDIT_NOT_AVAILABLE
    http: 409
    condition: "The credit's status is not AVAILABLE or PARTIALLY_CONSUMED."
  - id: ERR_CREDIT_NOT_YET_EXPIRED
    http: 409
    condition: "POST /credits/{id}/expire on a credit whose expires_at is still in the future."
  - id: ERR_REFERRAL_STATE_INVALID
    http: 409
    condition: "The referral's status is not PENDING when a lapse is requested."
  - id: ERR_REFUND_STATE_INVALID
    http: 409
    condition: "The refund's status is not in the transition's from-set."
  - id: ERR_PAUSE_STATE_INVALID
    http: 409
    condition: "Cancelling a PauseRecord that is not in status SCHEDULED."

  # --- temporal ---
  - id: ERR_PAST_CUTOFF
    http: 409
    condition: "A skip or skip-revoke is attempted at or after the cycle's cutoff_at."
  - id: ERR_CUTOFF_NOT_REACHED
    http: 409
    condition: "A cycle lock is attempted strictly before cutoff_at."
  - id: ERR_PAUSE_START_IN_PAST
    http: 422
    condition: "PauseRecord.start_date is earlier than the logical clock's calendar date."
  - id: ERR_PAUSE_INTERVAL_INVALID
    http: 422
    condition: "PauseRecord.end_date is earlier than start_date."
  - id: ERR_PAUSE_OVERLAP
    http: 409
    condition: "The requested closed-closed pause interval shares a calendar day with an existing SCHEDULED or ACTIVE pause."
  - id: ERR_CYCLE_WINDOW_OVERLAP
    http: 409
    condition: "The generated half-open cycle window strictly overlaps a non-terminal cycle window of the same subscription."
  - id: ERR_SHIPMENT_SPACING_VIOLATION
    http: 409
    condition: "A dispatch would put two non-RETURNED shipments for one account strictly inside a 12-hour window."
  - id: ERR_GIFT_CLAIM_WINDOW_EXPIRED
    http: 409
    condition: "A gift claim is attempted more than GIFT_CLAIM_WINDOW_DAYS (60) after paid_at."
  - id: ERR_CREDIT_EXPIRED
    http: 409
    condition: "A charge attempts to consume a credit whose expires_at is at or before the logical clock."
  - id: ERR_REFERRAL_WINDOW_EXPIRED
    http: 409
    condition: "A referral would vest after Referral.expires_at, or an explicit lapse is requested before expires_at."

  # --- domain policy: safety ---
  - id: ERR_ALLERGEN_BLOCKED
    http: 422
    condition: "Every candidate SKU carries a tag the child is SEVERELY sensitive to, or the named SKU fails the allergen screen."
  - id: ERR_HYPOALLERGENIC_REQUIRED
    http: 422
    condition: "A child with hypoallergenic_required == true would receive a STANDARD-line SKU."
  - id: ERR_HYPOALLERGENIC_NOT_ALLOWED
    http: 422
    condition: "A subscription on a plan with allows_hypoallergenic == false would receive a HYPOALLERGENIC SKU."
  - id: ERR_NON_ADJACENT_STAGE
    http: 422
    condition: "A manual resize names a stage more than one position away in STAGE_ORDER."

  # --- domain policy: caps and allowances ---
  - id: ERR_STAGE_PINNED
    http: 409
    condition: "A resize is requested for a child whose stage_pinned is true."
  - id: ERR_RESIZE_CAP_EXCEEDED
    http: 409
    condition: "A third AUTO resize inside the trailing 90-day period."
  - id: ERR_SKIP_ALLOWANCE_EXHAUSTED
    http: 409
    condition: "A third skip inside the trailing 180-day rolling window."
  - id: ERR_SKIP_WHILE_PAUSED
    http: 409
    condition: "A skip is requested on a subscription whose lifecycle_state is PAUSED."
  - id: ERR_PAUSE_BUDGET_EXCEEDED
    http: 409
    condition: "The projected cumulative pause days would exceed PAUSE_MAX_CUMULATIVE_DAYS (90)."
  - id: ERR_SUBSTITUTION_CAP_EXCEEDED
    http: 409
    condition: "A fourth substitution ladder run on one CycleLine."
  - id: ERR_REGISTRY_REOPEN_CAP
    http: 409
    condition: "A second reopen of the same registry."
  - id: ERR_REGISTRY_HAS_INFLIGHT_GIFTS
    http: 409
    condition: "Archiving a registry whose inflight_gift_count is above 0."
  - id: ERR_GIFT_QUANTITY_EXCEEDS_REMAINING
    http: 422
    condition: "GiftOrder.quantity exceeds requested_quantity minus fulfilled_quantity."
  - id: ERR_SELF_REFERRAL
    http: 422
    condition: "referrer_account_id equals referee_account_id."
  - id: ERR_RECIPROCAL_REFERRAL
    http: 422
    condition: "A Referral already exists in the opposite direction between the same two accounts."
  - id: ERR_REFERRAL_CAP_EXCEEDED
    http: 409
    condition: "A sixth referral would vest for one referrer inside the trailing 365-day period."
  - id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION
    http: 409
    condition: "Activating a second subscription for the same (account, child) pair while one is ACTIVE or PAUSED."

  # --- domain policy: referential coherence ---
  - id: ERR_CHILD_ACCOUNT_MISMATCH
    http: 422
    condition: "The child named on a subscription belongs to a different account."
  - id: ERR_REGISTRY_ITEM_MISMATCH
    http: 422
    condition: "The registry item in the path belongs to a different registry."
  - id: ERR_SKU_DISCONTINUED
    http: 409
    condition: "A new RegistryItem names a Sku whose status is DISCONTINUED."

  # --- fiscal ---
  - id: ERR_NO_ELIGIBLE_SKU
    http: 409
    condition: "The allocation selector's candidate set is empty."
  - id: ERR_SKU_OUT_OF_STOCK
    http: 409
    condition: "The candidate SKUs cannot collectively fill pack_count, or a gifted SKU lacks the claimed quantity."
  - id: ERR_REDEMPTION_BELOW_FLOOR
    http: 422
    condition: "A manual redemption burns fewer than POINT_REDEMPTION_FLOOR_POINTS (500) points."
  - id: ERR_INSUFFICIENT_POINTS
    http: 402
    condition: "The requested redemption exceeds LoyaltyAccount.points_balance."
  - id: ERR_NO_PAYMENT_METHOD
    http: 402
    condition: "A charge with total_due_cents above 0 on an account with payment_method_on_file == false."
  - id: ERR_REFUND_EXCEEDS_CHARGE
    http: 422
    condition: "Refund.requested_cents exceeds the cycle's retained_cash_cents or the gift's paid_cents."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; may register an account and consume its verification token."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts (self-registration)"
      - "POST /accounts/{id}/verify"
    shared_operations: []

  - name: AccountHolder
    description: "The paying household. Owns the Pipeline-R surface: children, subscriptions, cycles, skips, pauses, resizes and loyalty redemptions."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "PATCH /children/{id}"
      - "POST /subscriptions/{id}/cadence-override"
      - "DELETE /subscriptions/{id}/cadence-override"
      - "POST /subscriptions/{id}/resizes"
      - "POST /subscriptions/{id}/pauses"
      - "POST /subscriptions/{id}/resume"
      - "DELETE /pause-records/{id}"
      - "POST /cycles/{id}/skip"
      - "DELETE /cycles/{id}/skip"
      - "PATCH /subscriptions/{id}"
      - "POST /loyalty-accounts/{id}/redemptions"
    shared_operations:
      - "POST /children (with OpsAdmin)"
      - "POST /children/{id}/weight-measurements (with OpsAdmin)"
      - "POST /children/{id}/allergen-flags (with SupportAgent)"
      - "DELETE /allergen-flags/{id} (with SupportAgent)"
      - "POST /subscriptions (with OpsAdmin)"
      - "POST /subscriptions/{id}/activate (with OpsAdmin)"
      - "POST /subscriptions/{id}/cancel (with OpsAdmin)"
      - "POST /cycles/{id}/return (with OpsAdmin)"
      - "POST /cycles/{id}/refund-requests (with OpsAdmin)"
      - "POST /accounts/{id}/close (with SupportAgent)"
      - "PATCH /accounts/{id} (with SupportAgent)"
      - "POST /registries (with RegistryOwner)"
      - "every Pipeline-R read endpoint"

  - name: RegistryOwner
    description: "The identity that owns a Registry. Distinct from the paying AccountHolder and from the third-party GiftPurchaser, and the ONLY identity that may claim a gift."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "PATCH /registries/{id}"
      - "POST /registries/{id}/open"
      - "POST /registries/{id}/close"
      - "POST /registries/{id}/reopen"
      - "POST /registries/{id}/archive"
      - "POST /registries/{id}/items"
      - "PATCH /registries/{id}/items/{item_id}"
      - "DELETE /registries/{id}/items/{item_id}"
      - "POST /gift-orders/{id}/claim"
    shared_operations:
      - "POST /registries (with AccountHolder)"
      - "GET /registries, GET /registry-items, GET /gift-orders, GET /shipments"

  - name: GiftPurchaser
    description: "A third party buying against someone else's registry. Confined to Pipeline G and the ONLY identity that may refund a gift."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /gift-orders"
      - "POST /gift-orders/{id}/pay"
      - "POST /gift-orders/{id}/refund"
    shared_operations:
      - "GET /registries, GET /registries/{id}/summary, GET /registry-items, GET /gift-orders, GET /skus, GET /plans, GET /refunds"

  - name: SupportAgent
    description: "Operational support. Suspends and reinstates accounts, issues goodwill credit, and APPROVES refunds — but must not settle the refund it approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/suspend"
      - "POST /accounts/{id}/reinstate"
      - "POST /credits"
      - "POST /credits/{id}/revoke"
      - "POST /refunds/{id}/approve"
      - "POST /refunds/{id}/deny"
    shared_operations:
      - "PATCH /accounts/{id} (with AccountHolder)"
      - "POST /accounts/{id}/close (with AccountHolder)"
      - "POST /children/{id}/allergen-flags (with AccountHolder)"
      - "DELETE /allergen-flags/{id} (with AccountHolder)"
      - "POST /refunds/{id}/settle (with OpsAdmin, subject to segregation of duties)"
      - "every read endpoint"

  - name: OpsAdmin
    description: "Fulfilment and catalog operator. Owns the SKU/Plan catalog, the cycle fulfilment chain, the shipment chain and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans, PATCH /plans/{id}, POST /skus, PATCH /skus/{id}, POST /skus/{id}/stock-adjustments"
      - "POST /subscriptions/{id}/cycles"
      - "POST /cycles/{id}/allocate, POST /cycles/{id}/lock, POST /cycles/{id}/charge, POST /cycles/{id}/dispatch, POST /cycles/{id}/deliver"
      - "POST /cycle-lines/{id}/substitute, POST /cycle-lines/{id}/rescreen"
      - "every POST /shipments/{id}/* endpoint"
      - "POST /credits/{id}/expire"
      - "POST /loyalty-accounts/{id}/expire-points, POST /loyalty-accounts/{id}/reevaluate-tier"
      - "POST /referrals, POST /referrals/{id}/expire"
      - "POST /_clock/set_current_utc, POST /_ops/run-daily-jobs"
    shared_operations:
      - "POST /accounts (with Anonymous)"
      - "POST /children, POST /children/{id}/weight-measurements (with AccountHolder)"
      - "POST /subscriptions, POST /subscriptions/{id}/activate, POST /subscriptions/{id}/cancel (with AccountHolder)"
      - "POST /cycles/{id}/return, POST /cycles/{id}/refund-requests (with AccountHolder)"
      - "POST /refunds/{id}/settle (with SupportAgent, subject to segregation of duties)"
      - "every read endpoint"
