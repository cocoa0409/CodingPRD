  # ===========================================================================
  # RULE 3 - non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: notice_cure_fork_and_join_rejoins_settlement
        grounds:
          - state_machines.NoticeOfViolation.UNDER_EVALUATION_to_CURE_ELECTED
          - state_machines.NoticeOfViolation.CURE_ELECTED_to_CURE_FAILED
          - state_machines.NoticeOfViolation.CURE_FAILED_to_SETTLEMENT_NEGOTIATION
          - entities.NoticeOfViolation.fields.cure_attempted
          - calculations.settlement_money
        distinguishing_aspect: |
          Fork-and-join shape: the cure branch and the direct-escalation branch both terminate in
          SETTLEMENT_NEGOTIATION, and the join is lossy in status but not in data - after
          ABANDON_CURE the status no longer says a cure was attempted, so only the durable
          cure_attempted flag makes MITIGATION_CURE (0.50) apply, giving mitigation_factor 0.5000
          on a notice that looks identical to a directly escalated one.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED."
            - "Product SKU-NL1 has annual_units 50000 (at or below the 100000 cure ceiling) and zero ACTIVE components, so no warranty defense can apply."
            - "A PRIVATE_PARTY FAILURE_TO_WARN notice was served 2026-06-01 with earliest_violation_date 2026-06-01, so cure_deadline_at is 2026-07-31T00:00:00Z and cure_eligible is true."
            - "The notice is evaluated, the cure is elected inside the window, then abandoned, then escalated - it arrives in SETTLEMENT_NEGOTIATION by the cure path rather than the direct path."
            - "The clock is 2026-08-01 at settlement create, giving violation_days 61; the proposal makes no reformulation commitment and requests 500000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-NL1", product_name: "Trellis Clip", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-06-01T00:00:00Z", served_at: "2026-06-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_1: $.data.id }
          trigger:
            - call: "POST /notices/${nov_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_1}/transitions"
              payload: { action: "ELECT_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_1}/transitions"
              payload: { action: "ABANDON_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_1}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /notices/${nov_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_1: $.data.version }
            - call: "POST /notices/${nov_1}/settlements"
              payload: { requested_attorney_fees_cents: 500000, reformulation_commitment: false, expected_notice_version: "${nv_1}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_1: $.data.id }
          assert:
            - "NoticeOfViolation.${nov_1}.cure_deadline_at == 2026-07-31T00:00:00Z"
            - "NoticeOfViolation.${nov_1}.cure_eligible == true"
            - "after ELECT_CURE: NoticeOfViolation.${nov_1}.status == CURE_ELECTED and cure_attempted == true"
            - "after ABANDON_CURE: NoticeOfViolation.${nov_1}.status == CURE_FAILED and cure_attempted is still true"
            - "after ESCALATE: NoticeOfViolation.${nov_1}.status == SETTLEMENT_NEGOTIATION and cure_completed_at is null"
            - "Settlement.${stl_1}.violation_days == 61"
            - "Settlement.${stl_1}.base_penalty_cents == 2000000"
            - "Settlement.${stl_1}.mitigation_factor == 0.5"
            - "Settlement.${stl_1}.adjusted_penalty_cents == 1000000"
            - "Settlement.${stl_1}.fee_cap_cents == 600000"
            - "Settlement.${stl_1}.allowed_fees_cents == 500000"
            - "Settlement.${stl_1}.state_share_cents == 750000 and noticing_party_share_cents == 250000"
            - "Settlement.${stl_1}.total_settlement_cents == 1500000"

      - name: assessment_reject_reopen_cycle_hits_rejection_ceiling
        grounds:
          - state_machines.ExposureAssessment.SUBMITTED_to_REJECTED
          - state_machines.ExposureAssessment.REJECTED_to_DRAFT
          - entities.ExposureAssessment.fields.rejection_count
          - validations[priority=83]
          - errors[ERR_REJECTION_LIMIT_REACHED]
        distinguishing_aspect: |
          Cyclic (not merely branching) shape with a loop-count terminator: the assessment can walk
          SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED indefinitely as far as the transition table is
          concerned, but rejection_count is monotone across laps and the third REJECT is refused
          with ERR_REJECTION_LIMIT_REACHED while the row stays in SUBMITTED - the loop is bounded by
          a counter, not by a missing edge.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and Product SKU-NL2 has one ACTIVE component (so SUBMIT is not blocked by ERR_NO_ACTIVE_COMPONENTS)."
            - "A MODELED assessment exists in DRAFT, submitted by user ca_1 and reviewed by user tox_1 (distinct users, so segregation of duties never fires)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-NL2", product_name: "Hose Coupler", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
          trigger:
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "REJECT", review_note: "route assumption unsupported" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "REOPEN" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "REJECT", review_note: "still unsupported" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "REOPEN" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "REJECT", review_note: "third attempt" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
          assert:
            - "after the first REJECT: ExposureAssessment.${asmt_1}.status == REJECTED and rejection_count == 1"
            - "after the first REOPEN: status == DRAFT and submitted_by_user_id is null and rejection_count is still 1"
            - "after the second REJECT: status == REJECTED and rejection_count == 2"
            - "the third REJECT returns HTTP 409 with error_id ERR_REJECTION_LIMIT_REACHED"
            - "after the refused third REJECT: ExposureAssessment.${asmt_1}.status == SUBMITTED (unchanged) and rejection_count == 2 (not incremented)"

      - name: product_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Product.DEVELOPMENT_to_MARKETED
          - state_machines.Product.any_to_ENFORCEMENT_HOLD
          - state_machines.Product.any_to_CLEAR
          - entities.Product.fields.lifecycle_state
          - entities.Product.fields.compliance_posture
          - entities.Product.fields.open_notice_count
        distinguishing_aspect: |
          Two independent state dimensions on ONE row: lifecycle_state is actor-driven while
          compliance_posture is a system-recomputed ladder, and the notice that drives the posture
          from CLEAR to ENFORCEMENT_HOLD and back to CLEAR never moves lifecycle_state off
          MARKETED - the combined state (MARKETED, ENFORCEMENT_HOLD) is legal and reachable, which
          a single-dimension implementation cannot represent.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day."
            - "Product SKU-NL3 has one ACTIVE component whose material is VERIFIED, and its single FINAL assessment uses uses_per_day 0.998 so daily_exposure_ug is 0.499 - strictly BELOW the safe harbor, which puts the posture ladder on clause 5 (CLEAR)."
            - "MARKET is then allowed (it is refused whenever the posture is ENFORCEMENT_HOLD or EXPOSURE_UNKNOWN)."
            - "A notice served 2026-07-15 is then received, evaluated and dismissed with an evaluation_note."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
