# =============================================================================
# §1.9 Scaffold Corner Design - task_2349 Inclusive Access Course Material
# Billing & Opt-Out. Breadth probe: every testable claim §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already assert. Sections and
# claim_type values are taken verbatim from references/claim-extraction-guide.md.
#
# Pinned fixture arithmetic reused below (identical to §1.8, so a single set of
# literals serves both files):
#   AcademicTerm FA26: 2026-08-24 -> 2026-12-11, total_term_days 110,
#     add_drop_deadline 2026-09-04, census_date 2026-09-08,
#     late_registration_cutoff_date 2026-09-18, adoption_deadline_date 2026-07-15,
#     disclosure_deadline_date 2027-01-15, opt_out_window_days 14.
#   PublisherAgreement PUB-A: admin_fee_pct 0.05, bookstore_margin_pct 0.12,
#     price_floor_cents 2500, max_list_price_pct 0.60, rebate_threshold_cents 16500,
#     rebate_pct 0.03.
#   Title T1 list 18000, tiers [1,2] -> 9000 and [3,null] -> 7500.
#     n=2 basis: fee_applied 9450, list cap floor(18000*0.60)=10800, floor 2500
#                -> gross_price_cents 9450, publisher share round(9450*0.88)=8316.
#     n=3 basis: fee_applied 7875 -> gross 7875, share 6930.
#   Drop on 2026-09-21: retained_pct round(28/110,4)=0.2545,
#     refund round(9450*0.7455)=7045, net 2405, share round(2405*0.88)=2116.
#   opt_out_deadline_at for a 2026-08-24T09:00 posting: min(2026-09-07T09:00,
#     2026-09-04T23:59:59.999Z)=add/drop cap, max(cap, 2026-08-29T09:00)
#     -> 2026-09-04T23:59:59.999Z.
#   Non-existent id used for 404 probes: 00000000-0000-4000-8000-000000000000.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: entity_term_create_returns_computed_total_term_days_and_common_fields
        claim_type: creation
        grounds:
          - entities.AcademicTerm
          - endpoints[POST /terms]
          - entities.AcademicTerm.fields.total_term_days
        distinguishing_aspect: |
          A create response must already carry every computed and system field: total_term_days is
          the inclusive day span 110 (not 109, and not instructional_days 75), ia_section_count
          starts at 0 rather than null, and the four common fields are present with version == 1.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
          assert:
            - "HTTP 201 with envelope meta.api_request_id, meta.api_request_timestamp, response_type == object and a data object"
            - "data.total_term_days == 110 (inclusive span 2026-08-24 -> 2026-12-11, unrelated to instructional_days 75)"
            - "data.status == PLANNING and data.ia_section_count == 0 and data.closed_at == null"
            - "data.opt_out_window_days == 14 and data.instructional_days == 75"
            - "data.version == 1 and data.id is a UUID with no type prefix and data.created_at == data.updated_at == 2026-07-01T00:00:00.000Z"
            - "GET /terms/${term_id} returns byte-identical field values"

      - name: entity_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.AcademicTerm.fields.opt_out_window_days
          - entities.PublisherAgreement.fields.max_list_price_pct
          - entities.CourseSection.fields.max_concurrent_titles
        distinguishing_aspect: |
          The three optional inputs of this domain each have a non-trivial default that changes
          money or capacity semantics: opt_out_window_days 14, max_list_price_pct 0.60 and
          max_concurrent_titles 2 must appear in the create response even though the request body
          omitted them entirely.
        test_recipe:
          setup:
            - "Empty database; clock pinned to 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15" }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1" }
              as: Registrar
              captures: { sec_id: $.data.id }
          assert:
            - "Trigger call 1 -> HTTP 201 with data.opt_out_window_days == 14"
            - "Trigger call 2 -> HTTP 201 with data.max_list_price_pct == 0.60 and data.status == DRAFT and data.reconciliation_status == NOT_STARTED"
            - "Trigger call 3 -> HTTP 201 with data.max_concurrent_titles == 2, data.inclusive_access_flag == false, data.ia_status == NOT_FLAGGED"
            - "GET /sections/${sec_id} shows max_concurrent_titles == 2 and billing_basis_enrollment_count == null"
            - "GET /agreements/${agr_id} shows max_list_price_pct == 0.60 and settled_amount_cents == null"

      - name: entity_computed_and_system_fields_cannot_be_supplied_in_request_body
        claim_type: computed_fields
        grounds:
          - validations[priority=25]
          - entities.Student.fields.bursar_balance_cents
          - entities.AcademicTerm.fields.status
          - entities.CourseSection.fields.ia_status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Computed and system fields are not merely ignored here - validation priority 25 rejects
          unknown body fields outright, so a client that tries to seed bursar_balance_cents,
          status or ia_status gets 400 rather than a silently-dropped value.
        test_recipe:
          setup:
            - "Term FA26 exists so that the section create has a resolvable term_id; clock 2026-07-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { external_id: "S-1001", full_name: "Ada Lin", email: "ada@u.edu", program_code: "ECON-BA", bursar_balance_cents: 5000 }
              as: Registrar
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", ia_status: "BILLED" }
              as: Registrar
            - call: "POST /terms"
              payload: { code: "SP27", name: "Spring 2027", term_start_date: "2027-01-11", term_end_date: "2027-04-30", instructional_days: 75, census_date: "2027-01-26", add_drop_deadline: "2027-01-22", late_registration_cutoff_date: "2027-02-05", adoption_deadline_date: "2026-12-01", disclosure_deadline_date: "2027-06-15", status: "OPEN" }
              as: ProgramAdmin
          assert:
            - "Trigger call 1 -> HTTP 400 ERR_INVALID_REQUEST (bursar_balance_cents is source: computed, not an input of POST /students)"
            - "Trigger call 2 -> HTTP 400 ERR_INVALID_REQUEST (ia_status is source: system)"
            - "Trigger call 3 -> HTTP 400 ERR_INVALID_REQUEST (status is source: system)"
            - "No rows were created: GET /students returns total_count == 0, GET /sections returns total_count == 0, GET /terms returns total_count == 1"
            - "The error envelope is { response_type: error, data: { error_id, message } } with no partial entity body"

      - name: entity_system_fields_minted_by_server_and_version_increments_on_write
        claim_type: system_fields
        grounds:
          - entities.AcademicTerm
          - state_machines.AcademicTerm.PLANNING_to_OPEN
          - endpoints[POST /terms/{term_id}/open]
        distinguishing_aspect: |
          id and created_at are frozen at creation while updated_at and version move on every
          mutation: after one transition the same row must show version 2 and a later updated_at
          with an unchanged id and created_at - the version field is what the OCC layer keys on.
        test_recipe:
          setup:
            - "Term FA26 created at 2026-07-01T00:00:00Z in PLANNING with version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id, term_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-02T08:30:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /terms/${term_id}/open"
              as: ProgramAdmin
              captures: { term_v2: $.data.version }
          assert:
            - "Before the trigger ${term_v1} == 1"
            - "HTTP 200 with data.version == 2 and data.status == OPEN"
            - "data.id == ${term_id} and data.created_at == 2026-07-01T00:00:00.000Z (unchanged)"
            - "data.updated_at == 2026-07-02T08:30:00.000Z (refreshed to the logical clock)"
            - "data.closed_at == null (only the settle cascade writes it) and data.ia_section_count == 0"

      - name: entity_agreement_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.PublisherAgreement
          - endpoints[GET /agreements/{agreement_id}]
        distinguishing_aspect: |
          Every negotiated pricing parameter must round-trip exactly as stored - the decimal
          percentages are not re-scaled, re-rounded or defaulted on read, because the charge
          formula reads them back verbatim.
        test_recipe:
          setup:
            - "PUB-A created in DRAFT at 2026-07-01T00:00:00Z with fully specified pricing parameters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
          trigger:
            - call: "GET /agreements/${agr_id}"
              as: ComplianceOfficer
          assert:
            - "HTTP 200 with data.id == ${agr_id} and data.agreement_code == PUB-A"
            - "data.admin_fee_pct == 0.05, data.bookstore_margin_pct == 0.12, data.rebate_pct == 0.03, data.max_list_price_pct == 0.60"
            - "data.price_floor_cents == 2500 and data.rebate_threshold_cents == 16500"
            - "data.status == DRAFT, data.reconciliation_status == NOT_STARTED, data.settled_amount_cents == null, data.suspend_reason_note == null"
            - "data.version == 1"

      - name: entity_section_listing_pagination_and_filter
        claim_type: listing
        grounds:
          - endpoints[GET /sections]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          total_count reports the filtered population, not the page: with three sections in the
          term a limit of 2 returns 2 rows with total_count 3 and has_more true, and the second
          page returns the remaining row with has_more false.
        test_recipe:
          setup:
            - "Term FA26 with exactly three NOT_FLAGGED sections: ECON-101-001, ECON-101-002 and CHEM-105-001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "002", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "CHEM", catalog_number: "105", section_number: "001", instructor_user_id: "fac-6", max_concurrent_titles: 1 }
              as: Registrar
          trigger:
            - call: "GET /sections"
              payload: { term_id: "${term_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /sections"
              payload: { term_id: "${term_id}", limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /sections"
              payload: { term_id: "${term_id}", instructor_user_id: "fac-1" }
              as: ProgramAdmin
            - call: "GET /terms/${term_id}/sections"
              payload: { ia_status: "FLAGGED" }
              as: ComplianceOfficer
          assert:
            - "Trigger call 1 -> HTTP 200, response_type == array, 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Trigger call 2 -> HTTP 200, 1 row, total_count == 3, has_more == false, offset == 2"
            - "Trigger call 3 -> HTTP 200, 2 rows, total_count == 2 (the instructor filter narrows the population, and the default limit is 10)"
            - "Trigger call 4 -> HTTP 200, 0 rows, total_count == 0, has_more == false (no section is FLAGGED yet)"
            - "Every returned row carries ia_status == NOT_FLAGGED and enrolled_count == 0"

      - name: entity_unknown_path_ids_return_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_TITLE_NOT_FOUND]
          - errors[ERR_TIER_NOT_FOUND]
          - errors[ERR_SECTION_NOT_FOUND]
          - errors[ERR_ADOPTION_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_CHARGE_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
          - errors[ERR_OPT_OUT_REQUEST_NOT_FOUND]
          - errors[ERR_RUN_NOT_FOUND]
          - errors[ERR_REPORT_NOT_FOUND]
        distinguishing_aspect: |
          Each of the thirteen resource families returns its OWN 404 error_id rather than a generic
          one, so a client can tell which path segment failed to resolve; the probe id is a
          well-formed UUID, proving the 404 comes from lookup and not from format validation.
        test_recipe:
          setup:
            - "Empty database except the logical clock; no entity of any kind exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /terms/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /agreements/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /titles/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /pricing-tiers/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /sections/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /adoptions/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /enrollments/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /charges/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /ledger-entries/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /opt-out-requests/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /reconciliation-runs/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
            - call: "GET /disclosure-reports/00000000-0000-4000-8000-000000000000"
              as: ProgramAdmin
          assert:
            - "Trigger calls 1-13 each -> HTTP 404 in the order ERR_TERM_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_TITLE_NOT_FOUND, ERR_TIER_NOT_FOUND, ERR_SECTION_NOT_FOUND, ERR_ADOPTION_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_CHARGE_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_OPT_OUT_REQUEST_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_REPORT_NOT_FOUND"
            - "Every response carries response_type == error and data.error_id with no data.id field"
            - "GET /terms with no filter still returns total_count == 0 (no probe created anything)"

      - name: entity_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=25]
          - endpoints[POST /titles]
          - endpoints[POST /terms]
          - endpoints[POST /enrollments]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A required field is rejected before any FK resolution or state check runs: the title
          create omitting isbn fails at priority 25 even though its agreement_id is valid, and the
          enrollment create omitting enrolled_on fails before the late-registration gate at 79.
        test_recipe:
          setup:
            - "Term FA26, PUB-A and one section exist so that every FK in the malformed bodies would otherwise resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
              captures: { term_id: $.data.id }
            - call: "POST /agreements"
              payload: { publisher_name: "Northgate Academic", agreement_code: "PUB-A", effective_from: "2026-07-01", effective_to: "2027-01-01", admin_fee_pct: 0.05, bookstore_margin_pct: 0.12, price_floor_cents: 2500, rebate_threshold_cents: 16500, rebate_pct: 0.03, max_list_price_pct: 0.60 }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /sections"
              payload: { term_id: "${term_id}", subject_code: "ECON", catalog_number: "101", section_number: "001", instructor_user_id: "fac-1", max_concurrent_titles: 2 }
              as: Registrar
              captures: { sec_id: $.data.id }
            - call: "POST /students"
              payload: { external_id: "S-1001", full_name: "Ada Lin", email: "ada@u.edu", program_code: "ECON-BA" }
              as: Registrar
              captures: { stu1_id: $.data.id }
          trigger:
            - call: "POST /titles"
              payload: { agreement_id: "${agr_id}", title: "Principles of Economics", list_price_cents: 18000, format: "DIGITAL" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "SP27", name: "Spring 2027", term_start_date: "2027-01-11", term_end_date: "2027-04-30", instructional_days: 75, add_drop_deadline: "2027-01-22", late_registration_cutoff_date: "2027-02-05", adoption_deadline_date: "2026-12-01", disclosure_deadline_date: "2027-06-15" }
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { section_id: "${sec_id}", student_id: "${stu1_id}" }
              as: Registrar
            - call: "POST /opt-out-requests"
              payload: { charge_id: "00000000-0000-4000-8000-000000000000" }
              as: Student
              as_user_id: "${stu1_id}"
          assert:
            - "Trigger call 1 -> HTTP 400 ERR_INVALID_REQUEST (isbn missing)"
            - "Trigger call 2 -> HTTP 400 ERR_INVALID_REQUEST (census_date missing)"
            - "Trigger call 3 -> HTTP 400 ERR_INVALID_REQUEST (enrolled_on missing) - priority 25 outranks the FK check at 32 and the calendar gates at 79/81"
            - "Trigger call 4 -> HTTP 400 ERR_INVALID_REQUEST (reason_code missing) - priority 25 outranks the unresolvable charge_id at 32"
            - "GET /titles returns total_count == 0, GET /enrollments returns total_count == 0, GET /opt-out-requests returns total_count == 0"

      - name: entity_type_and_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.CourseMaterialTitle.fields.format
          - entities.PublisherAgreement.fields.admin_fee_pct
          - entities.PricingTier.fields.max_enrollment
          - entities.DisclosureReport.fields.reporting_state_code
        distinguishing_aspect: |
          Range and enum constraints are enforced at their declared bounds, not merely on type:
          admin_fee_pct 0.26 exceeds the 0.25 ceiling, instructional_days 0 breaks >= 1, a tier
          whose max_enrollment is below its min_enrollment breaks the interval constraint, and
          reporting_state_code must be two UPPERCASE letters.
        test_recipe:
          setup:
            - "Term FA26, PUB-A and title T1 exist so each malformed create has resolvable parents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /terms"
              payload: { code: "FA26", name: "Fall 2026", term_start_date: "2026-08-24", term_end_date: "2026-12-11", instructional_days: 75, census_date: "2026-09-08", add_drop_deadline: "2026-09-04", late_registration_cutoff_date: "2026-09-18", adoption_deadline_date: "2026-07-15", disclosure_deadline_date: "2027-01-15", opt_out_window_days: 14 }
              as: ProgramAdmin
