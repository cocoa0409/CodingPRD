        distinguishing_aspect: "Channel selection pins ranking by priority_band (P1_URGENT/P2_HIGH -> CALL, P3_ROUTINE -> TEXT, P4_LOW -> MAIL) and uses PRE-attempt band; not random."
        excluded_because:
          difficulty_instance: attempt_cadence_circular_pinned_order
          rationale: "Channel selection and circular-order pinning covered in §1.8."

