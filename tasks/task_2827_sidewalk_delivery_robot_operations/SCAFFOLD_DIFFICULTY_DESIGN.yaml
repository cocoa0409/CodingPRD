          The dependent pair is RoutePlan on SidewalkSegment: a DRAFT plan that was geometrically
          accepted at creation cannot be validated while any segment it names has status == BLOCKED, so
          VALIDATE returns 409 ERR_SEGMENT_BLOCKED while the HARD closure on S3 is ACTIVE and returns 200
