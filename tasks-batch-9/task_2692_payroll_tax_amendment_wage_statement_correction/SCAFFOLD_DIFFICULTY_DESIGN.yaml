      - name: ftd_tier_flips_between_five_and_six_days_late
        grounds:
          - calculations.amendment_penalty_assessment.constants.FTD_TIER_BPS
          - entities.AmendedReturn.fields.days_late
          - entities.AmendedReturn.fields.penalty_cents
        distinguishing_aspect: |
          A third metric on a third endpoint: the days_late tier ladder at its 5/6 edge, driven
          through POST /amended-returns/{amended_return_id}/prepare by moving
          accrual_through_date one single day. Everything else is held constant, so the only
          admissible explanation for 10500 vs 15000 cents is the FTD rate stepping from 200 bps to
          500 bps; note the failure-to-file leg does NOT step, because CEIL(5/30) and CEIL(6/30)
          are both 1 month.
        test_recipe:
          setup:
            - "Logical clock at 2025-05-06T00:00:00Z."
            - "Federal agency FED-941 (800 bps, STATUTORY_DAILY, penalty_multiplier_bps 10000, amendment_window_days 1095, requires_registration false)."
            - "Employer Acme with one 2025 Q1 register line of 1000000 taxable wage / 350000 withheld in jurisdiction US, a CLEARED deposit of 150000 against a 350000 obligation, and a filed return (original_due_date 2025-04-30) reporting 1000000 wage and 150000 withheld."
            - "Reconciliation therefore yields tax_delta_cents 200000 and deposit_shortfall_cents 200000 with no wage or jurisdiction variance; both discrepancies are categorised."
            - "No AgencyNotice exists for the period, so the 2500 bps voluntary self-correction reduction applies in both measurements."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-05-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /tax-agencies"
              payload: { agency_code: "FED-941", level: "FEDERAL", jurisdiction_code: "US", interest_rate_bps_annual: 800, interest_method: "STATUTORY_DAILY", penalty_multiplier_bps: 10000, min_days_between_amendments: 30, amendment_window_days: 1095, requires_registration: false }
              as: PlatformAdmin
              captures: { fed_id: "$.data.id" }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "Dana Reed", national_id_last4: "4821", mailing_state_code: "NY" }
              as: PayrollAnalyst
              captures: { e1_id: "$.data.id" }
            - call: "POST /payroll-register-lines"
              payload: { employer_id: "${emp_id}", employee_id: "${e1_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, taxable_wage_cents: 1000000, withheld_cents: 350000, work_jurisdiction_code: "US" }
              as: PayrollAnalyst
            - call: "POST /deposit-records"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, deposit_due_date: "2025-02-19", deposit_date: "2025-02-19", amount_cents: 150000, obligation_amount_cents: 350000, clearing_status: "CLEARED" }
              as: PayrollAnalyst
            - call: "POST /filed-returns"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1, form_code: "941X", filed_at: "2025-04-30T00:00:00Z", reported_taxable_wage_cents: 1000000, reported_withheld_cents: 150000 }
              as: TaxPreparer
            - call: "POST /correction-cases"
              payload: { employer_id: "${emp_id}", agency_id: "${fed_id}", tax_year: 2025, quarter: 1 }
              as: PayrollAnalyst
              captures: { case_id: "$.data.id" }
            - call: "POST /correction-cases/${case_id}/reconcile"
              payload: {}
              as: PayrollAnalyst
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "WITHHOLDING" }
              as: PayrollAnalyst
              captures: { d_wh_id: "$.data[0].id" }
            - call: "GET /discrepancies"
              payload: { correction_case_id: "${case_id}", category: "DEPOSIT_SHORTFALL" }
              as: PayrollAnalyst
              captures: { d_dep_id: "$.data[0].id" }
            - call: "POST /discrepancies/${d_wh_id}/categorize"
              payload: { category: "WITHHOLDING", root_cause_code: "RATE_TABLE_STALE" }
              as: PayrollAnalyst
            - call: "POST /discrepancies/${d_dep_id}/categorize"
              payload: { category: "DEPOSIT_SHORTFALL", root_cause_code: "DEPOSIT_SCHEDULING_ERROR" }
              as: PayrollAnalyst
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver1: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2025-05-05", expected_correction_case_version: "${case_ver1}" }
              as: TaxPreparer
              captures: { ar1_id: "$.data.id" }
          trigger:
            - call: "POST /amended-returns/${ar1_id}/prepare"
              payload: {}
              as: TaxPreparer
              as_user_id: "u_prep_alex"
            - call: "POST /amended-returns/${ar1_id}/void"
              payload: { void_reason: "Re-measuring the accrual one day later." }
              as: TaxOfficer
              as_user_id: "u_off_bree"
            - call: "GET /correction-cases/${case_id}"
              payload: {}
              as: TaxPreparer
              captures: { case_ver2: "$.data.version" }
            - call: "POST /amended-returns"
              payload: { correction_case_id: "${case_id}", form_code: "941X", accrual_through_date: "2025-05-06", expected_correction_case_version: "${case_ver2}", supersedes_amended_return_id: "${ar1_id}" }
              as: TaxPreparer
