      - name: calculation_certificate_posture_suspends_at_three_majors_then_expiry_outranks
        claim_type: Constants Applied
        grounds:
          - calculations.certificate_posture
          - state_machines.CertificateOfAuthorization.transitions[ACTIVE->SUSPENDED]
          - state_machines.CertificateOfAuthorization.transitions[ACTIVE->EXPIRED]
          - entities.CertificateOfAuthorization.fields.stamping_authorized
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "MAJOR_SUSPEND_THRESHOLD is 3, not 1 or 2: an audit closing with exactly three MAJOR findings must take the certificate straight to SUSPENDED rather than PROBATION, and the later clock move past expires_on must relabel it EXPIRED even though the finding counters are unchanged — expiry outranks findings in the posture ladder."
        test_recipe:
          setup:
            - "Certificate CA-U-8915 is ACTIVE from 2026-01-01 to 2026-09-01 with both finding counters at 0, and one INTERNAL_QMS audit is SCHEDULED for 2026-08-01."
            - "The logical clock stands at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /certificates"
              payload: { cert_number: "CA-U-8915", scope_codes: ["U"], issued_on: "2026-01-01", expires_on: "2026-09-01" }
              as: ShopAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /shop-audits"
              payload: { certificate_id: "${cert_id}", audit_type: "INTERNAL_QMS", scheduled_date: "2026-08-01" }
              as: ShopAdmin
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /shop-audits/${audit_id}/close"
              payload: { closed_on: "2026-08-01", findings: [{ finding_code: "F-201", severity: "MAJOR", clause_reference: "UG-90" }, { finding_code: "F-202", severity: "MAJOR", clause_reference: "UW-26" }, { finding_code: "F-203", severity: "MAJOR", clause_reference: "UG-99" }, { finding_code: "F-204", severity: "OBSERVATION", clause_reference: "UG-4" }] }
              as: ShopAdmin
            - call: "GET /certificates/${cert_id}"
              payload: {}
              as: ShopAdmin
              captures: { post_audit_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00.000Z" }
              as: ShopAdmin
            - call: "GET /certificates/${cert_id}"
              payload: {}
              as: ShopAdmin
              captures: { post_clock_status: $.data.status }
          assert:
            - "ShopAudit.${audit_id}.major_finding_count == 3, minor_finding_count == 0 and satisfactory == false (the OBSERVATION is counted in neither counter)"
            - "${post_audit_status} == SUSPENDED, not PROBATION, because open_major_findings_count reached exactly MAJOR_SUSPEND_THRESHOLD = 3"
            - "CertificateOfAuthorization.${cert_id}.open_major_findings_count == 3 and stamping_authorized == false"
            - "The clock call returns HTTP 200 and its body reports certificates_recomputed == 1"
            - "${post_clock_status} == EXPIRED — expiry outranks the finding counters, which still read open_major_findings_count == 3"
            - "CertificateOfAuthorization.${cert_id}.stamping_authorized == false and renewal_count == 0"

      - name: calculation_certificate_posture_minor_finding_threshold_boundary
