  - rule_id: non_linear_state_machine
    instances:

      - name: registration_deficiency_revision_cycle_accumulates_rounds
        grounds:
          - state_machines.StateRegistration.DRAFT_to_SUBMITTED
          - state_machines.StateRegistration.SUBMITTED_to_DEFICIENT
          - state_machines.StateRegistration.DEFICIENT_to_SUBMITTED
          - state_machines.StateRegistration.SUBMITTED_to_REGISTERED
          - entities.StateRegistration.fields.deficiency_round_count
          - entities.StateRegistration.fields.deficiency_reasons
          - entities.RegistrationDocument.fields.review_status
        distinguishing_aspect: |
          The filing traverses SUBMITTED -> DEFICIENT -> SUBMITTED twice before APPROVE, so it
          re-enters a state it already occupied; deficiency_round_count ends at 2 (never reset
          by the DEFICIENT -> SUBMITTED edge) while deficiency_reasons is cleared to [] on each
          resubmission and the same RegistrationDocument row moves ATTACHED -> REJECTED ->
          ACCEPTED.
