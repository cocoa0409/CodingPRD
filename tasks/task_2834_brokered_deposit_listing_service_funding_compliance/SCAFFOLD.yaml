scenario: |
  2834. Brokered Deposit & Listing Service Funding Compliance (bank funding desk): deposit classification across brokered, listing service and core with primary purpose exception analysis, notice and application requirements when relying on an exception, rate cap compliance for less-than-well-capitalized institutions with national rate comparison, concentration limits and liquidity contingency planning around wholesale funding, deposit placement network reciprocal arrangements and pass-through insurance mechanics, maturity laddering and early withdrawal terms, call report classification accuracy and examiner review, broker agreement diligence and fee structures

domain_name: brokered-deposit-funding-compliance
api_prefix: ""   # flat topology: every collection is a top-level path (/institutions, /brokers, /deposit-programs, ...)

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # DepositProgram <-> DepositClassification reference each other (program_id / governing_classification_id),
  # DepositPlacement.rolled_from_placement_id is self-referential, and PrimaryPurposeException bridges
  # Broker and Institution. There is no single URL ownership tree, hence api_prefix is empty and every
  # collection is addressed at the top level with foreign keys in bodies / query params.

  state_machine_shape: cyclic
  # BrokerAgreement (UNDER_DILIGENCE <-> RFI_ISSUED, APPROVED -> SUSPENDED -> UNDER_DILIGENCE),
  # PrimaryPurposeException (UNDER_REVIEW <-> INFO_REQUESTED), DepositProgram
  # (OPEN_FOR_PLACEMENT <-> SUSPENDED, RECLASSIFICATION_PENDING -> CLASSIFIED),
  # CallReportFiling (AMENDMENT_REQUIRED -> PREPARED), LiquidityContingencyPlan (DEACTIVATED -> APPROVED).
  # DepositPlacement additionally carries two independent state dimensions on one row
  # (funding_status and compliance_status) that advance on unrelated triggers.

  relationship_patterns:
    - one_to_many          # Institution -> DepositProgram, DepositProgram -> DepositPlacement
    - self_referential     # DepositPlacement.rolled_from_placement_id -> DepositPlacement.id
    - cross_aggregate      # DepositClassification -> PrimaryPurposeException (different aggregate root)

  role_model: segregation_of_duties
  # The X-User-ID that prepares a determination (classification, contingency plan, call report figures)
  # may never be the X-User-ID that attests/approves it. Enforced by ERR_SEGREGATION_OF_DUTIES.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 46 endpoints / 50 error codes / 7 state machines / 19 calculations with 3 dual-variant
  # pairs. Density, not volume: every calculation reads at least two entities and every posture change
  # re-enters the placement and program surfaces through a cascade.

# =============================================================================
# 1.1  Entity-Relationship Table
# =============================================================================
# Money is ALWAYS an integer number of cents in a `*_cents` field. Rates and
# ratios are ALWAYS an integer number of basis points in a `*_bps` field. No
# floats, no decimal strings, anywhere in the contract.
# =============================================================================
entities:
  - name: Institution
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Chartered legal name of the insured depository institution.
      - name: cert_id
        type: string
        source: input
        description: Deposit-insurance certificate number; unique across all Institution rows.
        constraints: "non-empty; unique (ERR_DUPLICATE_KEY on collision)"
      - name: capital_category
        type: enum
        source: input
        description: Prompt-corrective-action capital category as most recently determined.
        default: WELL_CAPITALIZED
        constraints: "one of WELL_CAPITALIZED, ADEQUATELY_CAPITALIZED, UNDERCAPITALIZED, SIGNIFICANTLY_UNDERCAPITALIZED, CRITICALLY_UNDERCAPITALIZED"
      - name: rate_cap_regime
        type: enum
        source: computed
        description: "EXEMPT when capital_category == WELL_CAPITALIZED, otherwise CAPPED. Recomputed by calculations.rate_cap_regime_derivation on create and on every capital-category update."
        constraints: "one of EXEMPT, CAPPED"
      - name: core_deposits_cents
        type: integer
        source: input
        description: Baseline non-wholesale deposit balance in cents; not derived from DepositPlacement rows.
        constraints: ">= 0"
      - name: brokered_deposits_cents
        type: integer
        source: computed
        description: "Sum of DepositPlacement.principal_cents over placements with funding_status == ACTIVE whose classified_as == BROKERED. Maintained by calculations.wholesale_balance_rollup."
      - name: listing_service_deposits_cents
        type: integer
        source: computed
        description: "Sum of DepositPlacement.principal_cents over placements with funding_status == ACTIVE whose classified_as == LISTING_SERVICE_NON_BROKERED."
      - name: reciprocal_deposits_cents
        type: integer
        source: computed
        description: "Sum of DepositPlacement.principal_cents over placements with funding_status == ACTIVE whose classified_as == RECIPROCAL_EXCLUDED."
      - name: total_deposits_cents
        type: integer
        source: computed
        description: "core_deposits_cents + brokered_deposits_cents + listing_service_deposits_cents + reciprocal_deposits_cents."
      - name: total_liabilities_cents
        type: integer
        source: input
        description: Total liabilities in cents; denominator of the WHOLESALE_TO_TOTAL_LIABILITIES metric and of the reciprocal exclusion cap.
        constraints: "> 0"
      - name: tier1_capital_cents
        type: integer
        source: input
        description: Tier 1 capital in cents; reported alongside capital_category for examiner review.
        constraints: ">= 0"
      - name: liquidity_buffer_cents
        type: integer
        source: input
        description: Unencumbered high-quality liquid asset buffer in cents, compared against LiquidityContingencyPlan.required_buffer_cents.
        constraints: ">= 0"
      - name: wholesale_funding_ratio_bps
        type: integer
        source: computed
        description: "POINT_IN_TIME variant of calculations.wholesale_funding_ratio: floor((brokered_deposits_cents + listing_service_deposits_cents) * 10000 / total_deposits_cents), or 0 when total_deposits_cents == 0."
      - name: single_broker_max_ratio_bps
        type: integer
        source: computed
        description: "Largest per-broker share, in basis points of total_deposits_cents, held through any single Broker; see calculations.single_broker_concentration."
      - name: concentration_posture
        type: enum
        source: computed
        description: "Gate over child funding operations, derived by calculations.concentration_posture from the institution's ConcentrationLimit rows with status == ACTIVE."
        constraints: "one of OPEN, RESTRICTED, FROZEN"
        default: OPEN
      - name: breached_metric_count
        type: integer
        source: computed
        description: "Number of ConcentrationLimit rows with status == ACTIVE whose breach_state == BREACH."
        default: 0

  - name: NationalRateCap
    parent: null
    common_fields: false
    fields:
      - name: tenor_bucket
        type: enum
        source: input
        description: Maturity bucket the published national rate applies to.
        constraints: "one of NON_MATURITY, DAYS_1_30, DAYS_31_90, DAYS_91_180, DAYS_181_365, DAYS_366_PLUS"
      - name: published_national_rate_bps
        type: integer
        source: input
        description: Published national deposit rate for this tenor_bucket, in basis points.
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) from which this publication governs. Occupies the half-open interval [effective_date, next publication's effective_date) for its tenor_bucket."
      - name: cap_bps
        type: integer
        source: computed
        description: "published_national_rate_bps + NATIONAL_SPREAD_BPS (75)."
      - name: non_maturity_cap_bps
        type: integer
        source: computed
        description: "published_national_rate_bps + NON_MATURITY_SPREAD_BPS (50); the ceiling clamp applied to NOW / MONEY_MARKET / SAVINGS products."
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the SystemAdmin that published this rate; audit only, never a decision input.

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the deposit broker, listing service or placement network operator.
      - name: broker_type
        type: enum
        source: input
        description: Counterparty archetype; feeds the classification decision tree.
        constraints: "one of DEPOSIT_BROKER, LISTING_SERVICE, DEPOSIT_PLACEMENT_NETWORK, AFFILIATE"
      - name: has_placement_discretion
        type: boolean
        source: input
        description: True when the counterparty has legal authority to choose where customer funds are placed (the deposit-broker placement-discretion prong).
      - name: fee_structure
        type: enum
        source: input
        description: Headline fee construct offered by the counterparty.
        constraints: "one of FLAT_FEE, BASIS_POINT_FEE, VOLUME_TIERED, PER_ACCOUNT_FEE"
      - name: fee_bps
        type: integer
        source: input
        description: Headline basis-point fee; ignored when fee_structure == FLAT_FEE.
        default: 0
        constraints: ">= 0"
      - name: fee_flat_cents
        type: integer
        source: input
        description: Headline flat fee in cents; ignored when fee_structure != FLAT_FEE.
        default: 0
        constraints: ">= 0"
      - name: diligence_status
        type: enum
        source: computed
        description: "Mirror of the broker's governing BrokerAgreement.status, kept in sync by the agreement diligence cascade (see state_machines.BrokerAgreement side effects)."
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, IN_DILIGENCE, APPROVED, CONDITIONAL, REJECTED, SUSPENDED"
      - name: approved_agreement_count
        type: integer
        source: computed
        description: "Count of this broker's BrokerAgreement rows with status IN {APPROVED, CONDITIONAL}."
        default: 0

  - name: BrokerAgreement
    parent: Broker
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: system
        description: "FK -> Broker.id; taken from the path segment of POST /brokers/{id}/agreements, never from the body."
      - name: agreement_ref
        type: string
        source: input
        description: Counterparty-assigned agreement reference string.
      - name: status
        type: enum
        source: system
        description: Diligence lifecycle state; see state_machines.BrokerAgreement.
        default: DRAFT
        constraints: "one of DRAFT, UNDER_DILIGENCE, RFI_ISSUED, APPROVED, CONDITIONAL, REJECTED, SUSPENDED, TERMINATED"
      - name: fee_structure
        type: enum
        source: input
        description: Fee construct as contracted in this agreement; may differ from Broker.fee_structure.
        constraints: "one of FLAT_FEE, BASIS_POINT_FEE, VOLUME_TIERED, PER_ACCOUNT_FEE"
      - name: fee_bps
        type: integer
        source: input
        description: Contracted basis-point fee used only when fee_structure == BASIS_POINT_FEE.
        default: 0
        constraints: ">= 0"
      - name: fee_flat_cents
        type: integer
        source: input
        description: Contracted flat fee in cents used only when fee_structure == FLAT_FEE.
        default: 0
        constraints: ">= 0"
      - name: termination_notice_days
        type: integer
        source: input
        description: Contractual notice period, in days, required to terminate the agreement.
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the agreement becomes contractually effective.
      - name: aml_program_score
        type: integer
        source: input
        description: Anti-money-laundering program diligence sub-score.
        constraints: "0..100"
      - name: financial_condition_score
        type: integer
        source: input
        description: Counterparty financial-condition diligence sub-score.
        constraints: "0..100"
      - name: insurance_coverage_score
        type: integer
        source: input
        description: Fidelity / errors-and-omissions insurance diligence sub-score.
        constraints: "0..100"
      - name: recordkeeping_score
        type: integer
        source: input
        description: Deposit-insurance recordkeeping capability diligence sub-score.
        constraints: "0..100"
      - name: diligence_score
        type: integer
        source: computed
        description: "Weighted diligence score from calculations.broker_diligence_score; recomputed on every diligence action."
        default: 0
      - name: rfi_round_count
        type: integer
        source: computed
        description: Number of ISSUE_RFI actions taken on this agreement; capped at MAX_RFI_ROUNDS (2).
        default: 0
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: "Cumulative placement fee owed under this agreement, from calculations.broker_fee_settlement."
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID that created the agreement draft.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that last took a diligence action; null until the first action.

  - name: PrimaryPurposeException
    parent: null
    common_fields: true
    fields:
      - name: broker_id
        type: string
        source: input
        description: "FK -> Broker.id; the counterparty on whose behalf the exception is claimed."
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the filing institution."
      - name: exception_basis
        type: enum
        source: input
        description: Statutory basis relied upon for the primary purpose exception.
        constraints: "one of TWENTY_FIVE_PERCENT_TEST, ENABLING_TRANSACTIONS_TEST, OTHER_APPLICATION"
      - name: filing_type
        type: enum
        source: computed
        description: "NOTICE when exception_basis IN {TWENTY_FIVE_PERCENT_TEST, ENABLING_TRANSACTIONS_TEST}; APPLICATION when exception_basis == OTHER_APPLICATION. Determines the post-SUBMIT branch in state_machines.PrimaryPurposeException."
        constraints: "one of NOTICE, APPLICATION"
      - name: designated_business_line
        type: string
        source: input
        description: Name of the agent's business line the exception is scoped to.
      - name: total_customer_assets_cents
        type: integer
        source: input
        description: Total customer assets under administration in the designated business line, in cents; denominator of the 25 percent test.
        constraints: "> 0"
      - name: deposits_placed_at_ifs_cents
        type: integer
        source: input
        description: Customer funds placed at insured depository institutions out of the designated business line, in cents; numerator of the 25 percent test.
        constraints: ">= 0"
      - name: enabling_transaction_count
        type: integer
        source: input
        description: Count of deposit accounts in the business line whose purpose is enabling transactions.
        default: 0
        constraints: ">= 0"
      - name: total_transaction_count
        type: integer
        source: input
        description: Total count of deposit accounts in the business line; denominator of the enabling-transactions test.
        default: 0
        constraints: ">= 0"
      - name: business_line_deposit_ratio_bps
        type: integer
        source: computed
        description: "floor(deposits_placed_at_ifs_cents * 10000 / total_customer_assets_cents); see calculations.primary_purpose_tests."
      - name: enabling_transaction_ratio_bps
        type: integer
        source: computed
        description: "floor(enabling_transaction_count * 10000 / total_transaction_count), or 0 when total_transaction_count == 0."
      - name: test_outcome
        type: enum
        source: computed
        description: "QUALIFIED / NOT_QUALIFIED from calculations.primary_purpose_tests; NOT_EVALUATED only for exception_basis == OTHER_APPLICATION, which carries no arithmetic test."
        default: NOT_EVALUATED
        constraints: "one of NOT_EVALUATED, QUALIFIED, NOT_QUALIFIED"
      - name: status
        type: enum
        source: system
        description: Filing lifecycle state; see state_machines.PrimaryPurposeException.
        default: DRAFT
        constraints: "one of DRAFT, ACKNOWLEDGED, UNDER_REVIEW, INFO_REQUESTED, GRANTED, DENIED, WITHDRAWN, REVOKED"
      - name: info_request_round_count
        type: integer
        source: computed
        description: Number of REQUEST_INFO actions taken on this filing; capped at MAX_INFO_REQUEST_ROUNDS (2).
        default: 0
      - name: reporting_due_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD). Set AT CREATION to the logical clock's date + REPORT_INTERVAL_DAYS (90): while the filing is DRAFT this is the deadline by which it must be SUBMITted (validations[priority=38]). Re-based to the logical clock's date + 90 when the filing lands in ACKNOWLEDGED or GRANTED, where it becomes the next periodic reporting deadline. Nulled on DENY, WITHDRAW and REVOKE."
      - name: reliant_program_count
        type: integer
        source: computed
        description: "Count of DepositProgram rows whose governing_classification_id names a DepositClassification with relied_exception_id == this exception's id. Conserved quantity of the reliance invariant."
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingDeskOfficer that drafted the filing.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that last acted on the filing; null until the first review action.

  - name: DepositProgram
    parent: null
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: input
        description: "FK -> Institution.id; the funding institution."
      - name: broker_id
        type: string
        source: input
        description: "FK -> Broker.id; null for a self-originated (CORE) program."
      - name: agreement_id
        type: string
        source: input
        description: "FK -> BrokerAgreement.id; required whenever broker_id is present, and must belong to that broker."
      - name: governing_classification_id
        type: string
        source: computed
        description: "FK -> DepositClassification.id; the most recently created DepositClassification for this program. Null while state == PENDING_CLASSIFICATION."
      - name: program_name
        type: string
        source: input
        description: Internal funding-desk name for the program.
      - name: funding_channel_claim
        type: enum
        source: input
        description: Channel the funding desk asserts before classification; the classification decision tree may overrule it.
        constraints: "one of BROKERED, LISTING_SERVICE, CORE, RECIPROCAL_NETWORK"
      - name: product_type
        type: enum
        source: input
        description: Deposit product form.
        constraints: "one of TIME_DEPOSIT, MONEY_MARKET, SAVINGS, NOW"
      - name: tenor_days
        type: integer
        source: input
        description: Contractual tenor of placements issued under this program, in days. Must be 0 for non-maturity products.
        constraints: ">= 0"
      - name: tenor_bucket
        type: enum
        source: computed
        description: "Bucket from calculations.tenor_bucket_assignment: NON_MATURITY when product_type IN {MONEY_MARKET, SAVINGS, NOW}, otherwise by tenor_days."
        constraints: "one of NON_MATURITY, DAYS_1_30, DAYS_31_90, DAYS_91_180, DAYS_181_365, DAYS_366_PLUS"
      - name: offered_rate_bps
        type: integer
        source: input
        description: Rate offered on the program, in basis points.
        constraints: ">= 0"
      - name: local_prevailing_rate_bps
        type: integer
        source: input
        description: Prevailing rate in the institution's local market for this tenor_bucket, in basis points; null when the desk does not assert a local comparison.
        default: null
      - name: effective_cap_bps
        type: integer
        source: computed
        description: "Rate ceiling from calculations.effective_rate_cap, recomputed on program creation and whenever the institution's rate_cap_regime changes. Null when rate_cap_regime == EXEMPT."
      - name: early_withdrawal_penalty_days
        type: integer
        source: input
        description: Number of days of interest forfeited on early withdrawal.
        constraints: ">= 0"
      - name: principal_erosion_allowed
        type: boolean
        source: input
        description: True when the contractual penalty may exceed interest earned and erode principal; selects the CONTRACTUAL_DAYS variant of calculations.early_withdrawal_penalty.
        default: false
      - name: pass_through_insurance
        type: boolean
        source: input
        description: True when the program relies on pass-through deposit insurance to the underlying customers.
        default: false
      - name: titling_convention
        type: enum
        source: input
        description: How the deposit account is titled at the institution; pass-through insurance requires FBO_SUBACCOUNTS.
        constraints: "one of SINGLE_FIDUCIARY_ACCOUNT, FBO_SUBACCOUNTS, DIRECT_TITLED"
      - name: rollover_enabled
        type: boolean
        source: input
        description: True when a matured placement is automatically rolled into a successor placement by the maturity run.
        default: false
      - name: reciprocal_arrangement_cents
        type: integer
        source: input
        description: Contractual reciprocal placement capacity in cents; only meaningful when funding_channel_claim == RECIPROCAL_NETWORK.
        default: 0
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: Program lifecycle state; see state_machines.DepositProgram.
        default: PENDING_CLASSIFICATION
        constraints: "one of PENDING_CLASSIFICATION, CLASSIFIED, OPEN_FOR_PLACEMENT, SUSPENDED, RECLASSIFICATION_PENDING, CLOSED"
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "Sum of DepositPlacement.principal_cents over this program's placements with funding_status == ACTIVE."
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingDeskOfficer that created the program.
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingDeskOfficer that attested the governing classification; null until attestation. Compared against DepositClassification.determined_by_user_id for segregation of duties.

  - name: DepositClassification
    parent: null
    common_fields: false
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> DepositProgram.id; the program this determination classifies."
      - name: relied_exception_id
        type: string
        source: input
        description: "FK -> PrimaryPurposeException.id; the exception filing relied upon, or null when no exception is relied upon."
      - name: determined_class
        type: enum
        source: computed
        description: "Outcome of calculations.deposit_classification_determination."
        constraints: "one of BROKERED, LISTING_SERVICE_NON_BROKERED, CORE, RECIPROCAL_EXCLUDED"
      - name: deposit_broker_prong
        type: enum
        source: computed
        description: "Which deposit-broker prong drove a BROKERED outcome, or NOT_APPLICABLE for the other three outcomes."
        constraints: "one of PLACEMENT_DISCRETION, MATCHING_DRIVER, FEE_FOR_PLACEMENT, NOT_APPLICABLE"
      - name: call_report_line
        type: enum
        source: computed
        description: "Call report line the determined_class maps to, one-to-one: BROKERED -> RC_E_M1_BROKERED, LISTING_SERVICE_NON_BROKERED -> RC_E_M2_LISTING, CORE -> RC_E_CORE, RECIPROCAL_EXCLUDED -> RC_O_M_RECIPROCAL."
        constraints: "one of RC_E_M1_BROKERED, RC_E_M2_LISTING, RC_E_CORE, RC_O_M_RECIPROCAL"
      - name: rationale_code
        type: string
        source: input
        description: Free-form determination rationale code recorded for examiner review.
      - name: determined_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that made the determination; compared against the attesting FundingDeskOfficer for segregation of duties.
      - name: effective_at
        type: datetime
        source: system
        description: Logical-clock instant the determination took effect (ISO 8601 UTC, three fractional digits).
      - name: program_version_at_determination
        type: integer
        source: system
        description: "Value of DepositProgram.version immediately AFTER this determination was applied, i.e. the observed expected_program_version plus the classification's own +1 increment. This is the witness validations[priority=32] compares against the program's live version."

  - name: DepositPlacement
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> DepositProgram.id; the program the placement is issued under."
      - name: rolled_from_placement_id
        type: string
        source: input
        description: "FK -> DepositPlacement.id; the matured predecessor this placement rolls, or null for a new-money placement."
        default: null
      - name: principal_cents
        type: integer
        source: input
        description: Placed principal in cents.
        constraints: "> 0"
      - name: rate_bps
        type: integer
        source: input
        description: Rate actually paid on this placement, in basis points; compared against DepositProgram.effective_cap_bps.
        constraints: ">= 0"
      - name: issue_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) the placement is issued.
      - name: tenor_days
        type: integer
        source: input
        description: Tenor of this placement in days; 0 for non-maturity products.
        constraints: ">= 0"
      - name: maturity_date
        type: string
        source: computed
        description: "issue_date + tenor_days calendar days; equal to issue_date when tenor_days == 0."
      - name: tenor_bucket
        type: enum
        source: computed
        description: "From calculations.tenor_bucket_assignment over the program's product_type and this placement's tenor_days."
        constraints: "one of NON_MATURITY, DAYS_1_30, DAYS_31_90, DAYS_91_180, DAYS_181_365, DAYS_366_PLUS"
      - name: funding_status
        type: enum
        source: system
        description: First independent state dimension — where the money is in its funding lifecycle. See state_machines.DepositPlacement dimension funding_status.
        default: PENDING
        constraints: "one of PENDING, ACTIVE, MATURED, WITHDRAWN_EARLY, ROLLED_OVER, CANCELLED"
      - name: compliance_status
        type: enum
        source: system
        description: Second independent state dimension — where the placement stands in rate-cap surveillance. Advances only on rate-cap checks and reclassification cascades, never on funding actions. See state_machines.DepositPlacement dimension compliance_status.
        default: UNREVIEWED
        constraints: "one of UNREVIEWED, RATE_CHECKED, FLAGGED, REMEDIATED"
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: "Simple interest accrued to the settlement date from calculations.accrued_interest; 0 while funding_status == PENDING."
        default: 0
      - name: early_withdrawal_penalty_cents
        type: integer
        source: computed
        description: "Penalty from calculations.early_withdrawal_penalty; 0 unless funding_status == WITHDRAWN_EARLY."
        default: 0
      - name: net_settlement_cents
        type: integer
        source: computed
        description: "principal_cents + accrued_interest_cents - early_withdrawal_penalty_cents at settlement; 0 while funding_status IN {PENDING, ACTIVE}."
        default: 0
      - name: settlement_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) the placement left funding_status == ACTIVE: maturity_date on maturity, the supplied withdrawal_date on early withdrawal. Null while funding_status IN {PENDING, ACTIVE, CANCELLED}. Closes the placement's wholesale-occupancy interval for the AVERAGE_DAILY ratio variant."
        default: null
      - name: fee_accrual_cents
        type: integer
        source: computed
        description: "This placement's per-line broker fee from calculations.broker_fee_settlement; 0 when the program has no agreement_id."
        default: 0
      - name: classified_as
        type: enum
        source: computed
        description: "Snapshot of the determined_class of the DepositProgram's governing_classification_id, frozen when funding_status becomes ACTIVE and refreshed by the reclassification cascade."
        constraints: "one of BROKERED, LISTING_SERVICE_NON_BROKERED, CORE, RECIPROCAL_EXCLUDED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingDeskOfficer that booked the placement.

  - name: RateCapCheck
    parent: DepositPlacement
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> DepositPlacement.id; taken from the path segment of POST /deposit-placements/{id}/rate-cap-checks."
      - name: check_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) as of which the cap is looked up.
      - name: applied_tenor_bucket
        type: enum
        source: computed
        description: Tenor bucket used for the NationalRateCap lookup; copied from the placement's tenor_bucket.
        constraints: "one of NON_MATURITY, DAYS_1_30, DAYS_31_90, DAYS_91_180, DAYS_181_365, DAYS_366_PLUS"
      - name: national_rate_bps_snapshot
        type: integer
        source: computed
        description: published_national_rate_bps of the NationalRateCap selected by calculations.effective_rate_cap for check_date.
      - name: local_prevailing_rate_bps_snapshot
        type: integer
        source: computed
        description: The program's local_prevailing_rate_bps at check time, or null when the program asserts none.
      - name: effective_cap_bps
        type: integer
        source: computed
        description: "Cap from calculations.effective_rate_cap; null when the institution's rate_cap_regime == EXEMPT."
      - name: offered_rate_bps
        type: integer
        source: computed
        description: The placement's rate_bps at check time.
      - name: breach_bps
        type: integer
        source: computed
        description: "max(0, offered_rate_bps - effective_cap_bps); 0 when effective_cap_bps is null."
      - name: outcome
        type: enum
        source: computed
        description: "EXEMPT_NO_CAP when effective_cap_bps is null; BREACH when breach_bps > 0; PASS otherwise."
        constraints: "one of PASS, BREACH, EXEMPT_NO_CAP"
      - name: checked_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that ran the check.

  - name: ConcentrationLimit
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: system
        description: "FK -> Institution.id; taken from the path segment of POST /institutions/{id}/concentration-limits."
      - name: metric
        type: enum
        source: input
        description: Which wholesale-funding ratio this limit governs.
        constraints: "one of BROKERED_TO_TOTAL_DEPOSITS, LISTING_TO_TOTAL_DEPOSITS, WHOLESALE_TO_TOTAL_LIABILITIES, SINGLE_BROKER_TO_TOTAL_DEPOSITS"
      - name: warning_threshold_bps
        type: integer
        source: input
        description: Basis-point level at or above which the metric is in WARNING.
        constraints: "0..10000; must be < breach_threshold_bps"
      - name: breach_threshold_bps
        type: integer
        source: input
        description: Basis-point level at or above which the metric is in BREACH.
        constraints: "0..10000; must be > warning_threshold_bps"
      - name: status
        type: enum
        source: system
        description: "ACTIVE for the governing limit on this metric; RETIRED once a later limit for the same metric supersedes it."
        default: ACTIVE
        constraints: "one of ACTIVE, RETIRED"
      - name: current_value_bps
        type: integer
        source: computed
        description: "Latest evaluated value of this metric from calculations.concentration_posture; 0 for rows with status == RETIRED."
        default: 0
      - name: breach_state
        type: enum
        source: computed
        description: "BREACH when current_value_bps >= breach_threshold_bps; WARNING when current_value_bps >= warning_threshold_bps and below breach; WITHIN otherwise. Always WITHIN for rows with status == RETIRED."
        default: WITHIN
        constraints: "one of WITHIN, WARNING, BREACH"

  - name: LiquidityContingencyPlan
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: system
        description: "FK -> Institution.id; taken from the path segment of POST /institutions/{id}/contingency-plans."
      - name: plan_version_label
        type: string
        source: input
        description: Human-readable plan version label.
      - name: effective_from
        type: string
        source: input
        description: First calendar date (YYYY-MM-DD) the plan governs; the plan occupies the CLOSED interval [effective_from, effective_to].
      - name: effective_to
        type: string
        source: input
        description: Last calendar date (YYYY-MM-DD) the plan governs, inclusive.
        constraints: ">= effective_from"
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state; see state_machines.LiquidityContingencyPlan.
        default: DRAFT
        constraints: "one of DRAFT, UNDER_REVIEW, APPROVED, ACTIVATED, DEACTIVATED, REJECTED"
      - name: activation_stage
        type: enum
        source: computed
        description: "Stage selected by calculations.contingency_stage_selection from the institution's wholesale_funding_ratio_bps against the three trigger levels; NONE while status != ACTIVATED."
        default: NONE
        constraints: "one of NONE, STAGE_1_MONITOR, STAGE_2_CONTINGENT, STAGE_3_CRISIS"
      - name: stage_1_trigger_bps
        type: integer
        source: input
        description: Wholesale-funding ratio, in basis points, at or above which STAGE_1_MONITOR applies.
        constraints: "0..10000; < stage_2_trigger_bps"
      - name: stage_2_trigger_bps
        type: integer
        source: input
        description: Wholesale-funding ratio, in basis points, at or above which STAGE_2_CONTINGENT applies.
        constraints: "0..10000; < stage_3_trigger_bps"
      - name: stage_3_trigger_bps
        type: integer
        source: input
        description: Wholesale-funding ratio, in basis points, at or above which STAGE_3_CRISIS applies.
        constraints: "0..10000"
      - name: stage_1_action_code
        type: string
        source: input
        description: Playbook action code executed at STAGE_1_MONITOR.
      - name: stage_2_action_code
        type: string
        source: input
        description: Playbook action code executed at STAGE_2_CONTINGENT.
      - name: stage_3_action_code
        type: string
        source: input
        description: Playbook action code executed at STAGE_3_CRISIS.
      - name: required_buffer_cents
        type: integer
        source: computed
        description: "Buffer requirement from calculations.required_liquidity_buffer; 0 while activation_stage == NONE."
        default: 0
      - name: buffer_shortfall_cents
        type: integer
        source: computed
        description: "max(0, required_buffer_cents - Institution.liquidity_buffer_cents)."
        default: 0
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the TreasuryController that drafted the plan.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that approved the plan; null until approval.

  - name: CallReportFiling
    parent: Institution
    common_fields: true
    fields:
      - name: institution_id
        type: string
        source: system
        description: "FK -> Institution.id; taken from the path segment of POST /institutions/{id}/call-report-filings."
      - name: report_period
        type: string
        source: input
        description: Reporting period label such as 2026Q3; unique per institution.
        constraints: "matches ^[0-9]{4}Q[1-4]$; unique per institution_id (ERR_DUPLICATE_KEY)"
      - name: rc_e_brokered_reported_cents
        type: integer
        source: input
        description: Brokered deposits as reported on schedule RC-E memorandum line 1, in cents.
        constraints: ">= 0"
      - name: rc_o_listing_reported_cents
        type: integer
        source: input
        description: Listing-service non-brokered deposits as reported, in cents.
        constraints: ">= 0"
      - name: rc_e_core_reported_cents
        type: integer
        source: input
        description: Core deposits as reported, in cents.
        constraints: ">= 0"
      - name: computed_brokered_cents
        type: integer
        source: computed
        description: "System-derived brokered total from calculations.call_report_variance."
        default: 0
      - name: computed_listing_cents
        type: integer
        source: computed
        description: "System-derived listing-service total from calculations.call_report_variance."
        default: 0
      - name: computed_core_cents
        type: integer
        source: computed
        description: "System-derived core total from calculations.call_report_variance."
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: "Absolute brokered-line variance from calculations.call_report_variance."
        default: 0
      - name: variance_bps
        type: integer
        source: computed
        description: "variance_cents expressed in basis points of Institution.total_deposits_cents, floored."
        default: 0
      - name: accuracy_status
        type: enum
        source: computed
        description: "Accuracy tier from calculations.call_report_variance; NOT_ASSESSED until the first PREPARE action."
        default: NOT_ASSESSED
        constraints: "one of NOT_ASSESSED, ACCURATE, VARIANCE_MINOR, VARIANCE_MATERIAL"
      - name: status
        type: enum
        source: system
        description: Filing workflow state; see state_machines.CallReportFiling.
        default: DRAFT
        constraints: "one of DRAFT, PREPARED, ATTESTED, FILED, UNDER_EXAMINER_REVIEW, AMENDMENT_REQUIRED, ACCEPTED"
      - name: amendment_round
        type: integer
        source: computed
        description: Number of REQUIRE_AMENDMENT actions the examiner has taken on this filing.
        default: 0
      - name: examiner_finding_note
        type: string
        source: system
        description: Note recorded by the Examiner on the most recent REQUIRE_AMENDMENT or ACCEPT action; null until then.
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingDeskOfficer that last executed PREPARE.
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceReviewer that attested the filing; null until attestation.

# =============================================================================
# 1.2  State Machine Table
# =============================================================================
state_machines:
  - entity: BrokerAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: UNDER_DILIGENCE
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=START_DILIGENCE"
        actor: ComplianceReviewer
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "recompute diligence_score via calculations.broker_diligence_score"
          - "set reviewed_by_user_id to the acting X-User-ID"
          - "set Broker.diligence_status = IN_DILIGENCE"
          - "increment BrokerAgreement.version by 1 and Broker.version by 1"
      - from: UNDER_DILIGENCE
        to: RFI_ISSUED
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=ISSUE_RFI"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_DILIGENCE"
          - "rfi_round_count < MAX_RFI_ROUNDS (2), else ERR_REVIEW_ROUND_LIMIT"
        side_effects:
          - "increment rfi_round_count by 1"
          - "set reviewed_by_user_id to the acting X-User-ID"
        note: "First half of the diligence cycle; the counterparty answers and the reviewer resumes."
      - from: RFI_ISSUED
        to: UNDER_DILIGENCE
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=RESUME_DILIGENCE"
        actor: ComplianceReviewer
        preconditions:
          - "status == RFI_ISSUED"
        side_effects:
          - "recompute diligence_score via calculations.broker_diligence_score"
        note: "Closes the cycle UNDER_DILIGENCE -> RFI_ISSUED -> UNDER_DILIGENCE. Reachable at most MAX_RFI_ROUNDS times."
      - from: UNDER_DILIGENCE
        to: APPROVED
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=APPROVE"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_DILIGENCE"
          - "diligence_score >= DILIGENCE_APPROVE_MIN (70)"
          - "aml_program_score >= AML_FLOOR (60)"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set Broker.diligence_status = APPROVED"
          - "increment Broker.approved_agreement_count by 1"
      - from: UNDER_DILIGENCE
        to: CONDITIONAL
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=APPROVE"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_DILIGENCE"
          - "DILIGENCE_CONDITIONAL_MIN (60) <= diligence_score < DILIGENCE_APPROVE_MIN (70)"
          - "aml_program_score >= AML_FLOOR (60)"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set Broker.diligence_status = CONDITIONAL"
          - "increment Broker.approved_agreement_count by 1"
        note: "Branch point: one trigger, two divergent targets selected by the diligence_score band, with different Broker.diligence_status side effects."
      - from: UNDER_DILIGENCE
        to: REJECTED
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=REJECT"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_DILIGENCE"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set Broker.diligence_status = REJECTED"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=SUSPEND"
        actor: ComplianceReviewer
        preconditions:
          - "status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "CASCADE HOP 1: set BrokerAgreement.status = SUSPENDED"
          - "CASCADE HOP 2 (caused by hop 1): set Broker.diligence_status = SUSPENDED and decrement Broker.approved_agreement_count by 1"
          - "CASCADE HOP 3 (caused by hop 2's broker suspension): every DepositProgram with agreement_id == this agreement and state IN {CLASSIFIED, OPEN_FOR_PLACEMENT} transitions to SUSPENDED, processed in DepositProgram.created_at ASC order; for each such program every DepositPlacement with funding_status == PENDING transitions to CANCELLED, processed in DepositPlacement.created_at ASC order"
          - "recompute calculations.wholesale_balance_rollup and calculations.concentration_posture for the affected Institution"
        note: "Depth-3 transitive cascade (agreement -> broker -> programs -> pending placements)."
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=SUSPEND"
        actor: ComplianceReviewer
        preconditions:
          - "status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "identical cascade to the APPROVED -> SUSPENDED transition"
      - from: SUSPENDED
        to: UNDER_DILIGENCE
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=RESUME_DILIGENCE"
        actor: ComplianceReviewer
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "recompute diligence_score via calculations.broker_diligence_score"
          - "set Broker.diligence_status = IN_DILIGENCE"
        note: "Second cycle in this machine: APPROVED -> SUSPENDED -> UNDER_DILIGENCE -> APPROVED."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /broker-agreements/{id}/diligence-actions with action=TERMINATE"
        actor: ComplianceReviewer
        preconditions:
          - "status == SUSPENDED"
        side_effects:
          - "every DepositProgram with agreement_id == this agreement and state != CLOSED transitions to CLOSED, processed in DepositProgram.created_at ASC order"

  - entity: PrimaryPurposeException
    dimension: status
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN, REVOKED]
    transitions:
      - from: DRAFT
        to: ACKNOWLEDGED
        trigger: "POST /primary-purpose-exceptions/{id}/filing-actions with action=SUBMIT and filing_type == NOTICE"
        actor: FundingDeskOfficer
        preconditions:
          - "status == DRAFT"
          - "filing_type == NOTICE"
          - "test_outcome == QUALIFIED, else ERR_PRIMARY_PURPOSE_TEST_NOT_MET"
        side_effects:
          - "set reporting_due_date = logical clock date + REPORT_INTERVAL_DAYS (90)"
        note: "NOTICE branch: a qualifying notice is self-effecting and lands directly in ACKNOWLEDGED without review, and re-bases reporting_due_date to the next periodic deadline. Divergent from the APPLICATION branch below, which enters supervisory review and leaves the deadline untouched."
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /primary-purpose-exceptions/{id}/filing-actions with action=SUBMIT and filing_type == APPLICATION"
        actor: FundingDeskOfficer
        preconditions:
          - "status == DRAFT"
          - "filing_type == APPLICATION"
        side_effects:
          - "leave reporting_due_date at its creation-time value; entering supervisory review does not re-base the deadline"
        note: "APPLICATION branch of the same SUBMIT trigger."
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /primary-purpose-exceptions/{id}/review-actions with action=REQUEST_INFO"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "info_request_round_count < MAX_INFO_REQUEST_ROUNDS (2), else ERR_REVIEW_ROUND_LIMIT"
        side_effects:
          - "increment info_request_round_count by 1"
          - "set reviewed_by_user_id to the acting X-User-ID"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /primary-purpose-exceptions/{id}/review-actions with action=RESUME_REVIEW"
        actor: ComplianceReviewer
        preconditions:
          - "status == INFO_REQUESTED"
        side_effects:
          - "set reviewed_by_user_id to the acting X-User-ID"
        note: "Closes the review cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /primary-purpose-exceptions/{id}/review-actions with action=GRANT"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set reporting_due_date = logical clock date + REPORT_INTERVAL_DAYS (90)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /primary-purpose-exceptions/{id}/review-actions with action=DENY"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set reporting_due_date = null"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /primary-purpose-exceptions/{id}/filing-actions with action=WITHDRAW"
        actor: FundingDeskOfficer
        preconditions:
          - "status IN {DRAFT, ACKNOWLEDGED, UNDER_REVIEW, INFO_REQUESTED}"
          - "reliant_program_count == 0"
        side_effects:
          - "set reporting_due_date = null"
      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "POST /primary-purpose-exceptions/{id}/filing-actions with action=WITHDRAW"
        actor: FundingDeskOfficer
        preconditions:
          - "status IN {DRAFT, ACKNOWLEDGED, UNDER_REVIEW, INFO_REQUESTED}"
          - "reliant_program_count == 0"
        side_effects:
          - "set reporting_due_date = null"
      - from: ACKNOWLEDGED
        to: REVOKED
        trigger: "POST /primary-purpose-exceptions/{id}/review-actions with action=REVOKE"
        actor: ComplianceReviewer
        preconditions:
          - "status IN {ACKNOWLEDGED, GRANTED}"
        side_effects:
          - "identical cascade to the GRANTED -> REVOKED transition"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /primary-purpose-exceptions/{id}/review-actions with action=REVOKE"
        actor: ComplianceReviewer
        preconditions:
          - "status IN {ACKNOWLEDGED, GRANTED}"
        side_effects:
          - "CASCADE HOP 1: set PrimaryPurposeException.status = REVOKED, reporting_due_date = null"
          - "CASCADE HOP 2 (caused by hop 1): every DepositProgram whose governing_classification_id names a DepositClassification with relied_exception_id == this exception, and whose state IN {CLASSIFIED, OPEN_FOR_PLACEMENT}, transitions to RECLASSIFICATION_PENDING, processed in DepositProgram.created_at ASC order; set reliant_program_count = 0"
          - "CASCADE HOP 3 (caused by hop 2's program transitions): for each program moved to RECLASSIFICATION_PENDING, every DepositPlacement with funding_status == ACTIVE has compliance_status set to FLAGGED and classified_as set to BROKERED (exception reliance withdrawn), processed in DepositPlacement.created_at ASC order; then calculations.wholesale_balance_rollup re-runs for the Institution"
          - "CASCADE HOP 4 (caused by hop 3's balance change): calculations.concentration_posture re-runs; if the resulting Institution.concentration_posture == FROZEN, every LiquidityContingencyPlan of that institution with status == APPROVED transitions to ACTIVATED and calculations.contingency_stage_selection sets its activation_stage"
        note: "Depth-4 transitive cascade (exception -> programs -> placements+institution balances -> posture -> contingency plans)."

  - entity: DepositProgram
    dimension: state
    initial_state: PENDING_CLASSIFICATION
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_CLASSIFICATION
        to: CLASSIFIED
        trigger: "POST /deposit-classifications"
        actor: ComplianceReviewer
        preconditions:
          - "state IN {PENDING_CLASSIFICATION, RECLASSIFICATION_PENDING}"
          - "expected_program_version == DepositProgram.version, else ERR_STALE_PROGRAM_VERSION"
          - "when relied_exception_id is present: PrimaryPurposeException.status IN {ACKNOWLEDGED, GRANTED}, else ERR_EXCEPTION_NOT_RELIABLE"
          - "when relied_exception_id is present: PrimaryPurposeException.broker_id == DepositProgram.broker_id, else ERR_EXCEPTION_COUNTERPARTY_MISMATCH"
        side_effects:
          - "create an immutable DepositClassification with determined_class from calculations.deposit_classification_determination"
          - "set DepositProgram.governing_classification_id to the new classification's id"
          - "increment DepositProgram.version by 1"
          - "when relied_exception_id is present, increment PrimaryPurposeException.reliant_program_count by 1; when the superseded governing classification named a different exception, decrement that exception's reliant_program_count by 1"
          - "recompute DepositProgram.effective_cap_bps via calculations.effective_rate_cap"
      - from: RECLASSIFICATION_PENDING
        to: CLASSIFIED
        trigger: "POST /deposit-classifications"
        actor: ComplianceReviewer
        preconditions:
          - "state IN {PENDING_CLASSIFICATION, RECLASSIFICATION_PENDING}"
          - "expected_program_version == DepositProgram.version, else ERR_STALE_PROGRAM_VERSION"
        side_effects:
          - "identical to the PENDING_CLASSIFICATION -> CLASSIFIED transition"
          - "every DepositPlacement of this program with funding_status == ACTIVE has classified_as refreshed to the new determined_class and compliance_status set to REMEDIATED when its previous compliance_status == FLAGGED"
          - "recompute calculations.wholesale_balance_rollup and calculations.concentration_posture for the Institution"
        note: "Closes the reclassification cycle CLASSIFIED/OPEN_FOR_PLACEMENT -> RECLASSIFICATION_PENDING -> CLASSIFIED."
      - from: CLASSIFIED
        to: OPEN_FOR_PLACEMENT
        trigger: "POST /deposit-programs/{id}/state-actions with action=ATTEST_CLASSIFICATION"
        actor: FundingDeskOfficer
        preconditions:
          - "state == CLASSIFIED"
          - "governing_classification_id is not null, else ERR_CLASSIFICATION_REQUIRED"
          - "the acting X-User-ID != the governing DepositClassification.determined_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "when broker_id is not null: the BrokerAgreement named by agreement_id has status IN {APPROVED, CONDITIONAL}, else ERR_AGREEMENT_NOT_APPROVED"
        side_effects:
          - "set attested_by_user_id to the acting X-User-ID"
        note: "Cross-entity guard on BrokerAgreement.status (entity pair DepositProgram <-> BrokerAgreement)."
      - from: OPEN_FOR_PLACEMENT
        to: SUSPENDED
        trigger: "POST /deposit-programs/{id}/state-actions with action=SUSPEND, or the BrokerAgreement SUSPEND cascade"
        actor: FundingDeskOfficer
        preconditions:
          - "state == OPEN_FOR_PLACEMENT"
        side_effects:
          - "every DepositPlacement of this program with funding_status == PENDING transitions to CANCELLED, processed in DepositPlacement.created_at ASC order"
      - from: SUSPENDED
        to: OPEN_FOR_PLACEMENT
        trigger: "POST /deposit-programs/{id}/state-actions with action=RESUME"
        actor: FundingDeskOfficer
        preconditions:
          - "state == SUSPENDED"
          - "when broker_id is not null: the BrokerAgreement named by agreement_id has status IN {APPROVED, CONDITIONAL}, else ERR_AGREEMENT_NOT_APPROVED"
        side_effects:
          - "no placement side effects; cancelled placements are not revived"
        note: "Closes the suspension cycle OPEN_FOR_PLACEMENT -> SUSPENDED -> OPEN_FOR_PLACEMENT."
      - from: OPEN_FOR_PLACEMENT
        to: RECLASSIFICATION_PENDING
        trigger: "POST /deposit-programs/{id}/state-actions with action=START_RECLASSIFICATION, or the PrimaryPurposeException REVOKE cascade"
        actor: FundingDeskOfficer
        preconditions:
          - "state IN {CLASSIFIED, OPEN_FOR_PLACEMENT}"
        side_effects:
          - "set attested_by_user_id = null"
      - from: CLASSIFIED
        to: RECLASSIFICATION_PENDING
        trigger: "POST /deposit-programs/{id}/state-actions with action=START_RECLASSIFICATION, or the PrimaryPurposeException REVOKE cascade"
        actor: FundingDeskOfficer
        preconditions:
          - "state IN {CLASSIFIED, OPEN_FOR_PLACEMENT}"
        side_effects:
          - "set attested_by_user_id = null"
      - from: OPEN_FOR_PLACEMENT
        to: CLOSED
        trigger: "POST /deposit-programs/{id}/state-actions with action=CLOSE, or the BrokerAgreement TERMINATE cascade"
        actor: FundingDeskOfficer
        preconditions:
          - "state IN {PENDING_CLASSIFICATION, CLASSIFIED, OPEN_FOR_PLACEMENT, SUSPENDED, RECLASSIFICATION_PENDING}"
        side_effects:
          - "every DepositPlacement of this program with funding_status == PENDING transitions to CANCELLED, processed in DepositPlacement.created_at ASC order"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /deposit-programs/{id}/state-actions with action=CLOSE, or the BrokerAgreement TERMINATE cascade"
        actor: FundingDeskOfficer
        preconditions:
          - "state IN {PENDING_CLASSIFICATION, CLASSIFIED, OPEN_FOR_PLACEMENT, SUSPENDED, RECLASSIFICATION_PENDING}"
        side_effects:
          - "every DepositPlacement of this program with funding_status == PENDING transitions to CANCELLED, processed in DepositPlacement.created_at ASC order"

  - entity: DepositPlacement
    dimension: funding_status
    initial_state: PENDING
    terminal_states: [MATURED, WITHDRAWN_EARLY, ROLLED_OVER, CANCELLED]
    note: "First of two independent state dimensions on the same DepositPlacement row. funding_status advances only on POST /deposit-placements/{id}/funding-actions, POST /maturity-runs and program/agreement cascades; it never moves on a rate-cap check."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /deposit-placements/{id}/funding-actions with action=ACTIVATE"
        actor: FundingDeskOfficer
        preconditions:
          - "funding_status == PENDING"
          - "DepositProgram.state == OPEN_FOR_PLACEMENT, else ERR_PROGRAM_NOT_OPEN"
          - "Institution.concentration_posture IN {OPEN, RESTRICTED}, else ERR_CONCENTRATION_FROZEN"
          - "the post-activation value of the ConcentrationLimit metric matching this placement's classified_as is strictly below its breach_threshold_bps, else ERR_CONCENTRATION_BREACH"
        side_effects:
          - "set classified_as from the program's governing DepositClassification.determined_class"
          - "FORWARD LEG of the outstanding-principal invariant: add principal_cents to the matching Institution wholesale bucket via calculations.wholesale_balance_rollup, then re-run calculations.concentration_posture"
          - "add principal_cents to DepositProgram.outstanding_principal_cents"
          - "recompute BrokerAgreement.accrued_fee_cents and this placement's fee_accrual_cents via calculations.broker_fee_settlement"
        note: "Cross-entity guard on Institution.concentration_posture (entity pair DepositPlacement <-> Institution)."
      - from: ACTIVE
        to: WITHDRAWN_EARLY
        trigger: "POST /deposit-placements/{id}/funding-actions with action=EARLY_WITHDRAW"
        actor: FundingDeskOfficer
        preconditions:
          - "funding_status == ACTIVE"
          - "withdrawal_date is present and strictly before maturity_date"
        side_effects:
          - "set accrued_interest_cents via calculations.accrued_interest with settlement_date = withdrawal_date"
          - "set early_withdrawal_penalty_cents via calculations.early_withdrawal_penalty"
          - "set net_settlement_cents = principal_cents + accrued_interest_cents - early_withdrawal_penalty_cents"
          - "COMPENSATING LEG of the outstanding-principal invariant: subtract principal_cents from the matching Institution wholesale bucket via calculations.wholesale_balance_rollup, then re-run calculations.concentration_posture"
          - "subtract principal_cents from DepositProgram.outstanding_principal_cents"
          - "recompute BrokerAgreement.accrued_fee_cents and this placement's fee_accrual_cents via calculations.broker_fee_settlement"
      - from: ACTIVE
        to: MATURED
        trigger: "POST /maturity-runs (system sweep) when maturity_date <= as_of_date"
        actor: system
        preconditions:
          - "funding_status == ACTIVE"
          - "maturity_date <= as_of_date"
        side_effects:
          - "set accrued_interest_cents via calculations.accrued_interest with settlement_date = maturity_date"
          - "set net_settlement_cents = principal_cents + accrued_interest_cents"
          - "subtract principal_cents from the matching Institution wholesale bucket and from DepositProgram.outstanding_principal_cents, then re-run calculations.concentration_posture"
      - from: MATURED
        to: ROLLED_OVER
        trigger: "POST /maturity-runs (same sweep, second phase) when DepositProgram.rollover_enabled == true"
        actor: system
        preconditions:
          - "funding_status == MATURED within this same run"
          - "DepositProgram.rollover_enabled == true"
          - "DepositProgram.state == OPEN_FOR_PLACEMENT"
          - "Institution.concentration_posture != FROZEN"
        side_effects:
          - "create a successor DepositPlacement with rolled_from_placement_id set to this placement's id, principal_cents = this placement's net_settlement_cents, rate_bps = DepositProgram.offered_rate_bps, issue_date = as_of_date, tenor_days = DepositProgram.tenor_days, funding_status = PENDING, compliance_status = UNREVIEWED"
        note: "Second-phase transitions are processed in maturity_date ASC, then created_at ASC order."
      - from: PENDING
        to: CANCELLED
        trigger: "POST /deposit-placements/{id}/funding-actions with action=CANCEL, or the DepositProgram SUSPEND / CLOSE cascade, or the BrokerAgreement SUSPEND cascade"
        actor: FundingDeskOfficer
        preconditions:
          - "funding_status == PENDING"
        side_effects:
          - "no balance movement: a PENDING placement has never entered any Institution wholesale bucket"

  - entity: DepositPlacement
    dimension: compliance_status
    initial_state: UNREVIEWED
    terminal_states: []
    note: "Second independent state dimension on the same DepositPlacement row. It advances only on POST /deposit-placements/{id}/rate-cap-checks and on reclassification cascades, and is orthogonal to funding_status: a placement can be RATE_CHECKED while still PENDING, or FLAGGED while MATURED."
    transitions:
      - from: UNREVIEWED
        to: RATE_CHECKED
        trigger: "POST /deposit-placements/{id}/rate-cap-checks producing outcome IN {PASS, EXEMPT_NO_CAP}"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status == UNREVIEWED"
        side_effects:
          - "append an immutable RateCapCheck row"
      - from: UNREVIEWED
        to: FLAGGED
        trigger: "POST /deposit-placements/{id}/rate-cap-checks producing outcome == BREACH"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status == UNREVIEWED"
        side_effects:
          - "append an immutable RateCapCheck row with breach_bps > 0"
      - from: RATE_CHECKED
        to: FLAGGED
        trigger: "POST /deposit-placements/{id}/rate-cap-checks producing outcome == BREACH, or the Institution capital-category cascade"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status IN {RATE_CHECKED, REMEDIATED}"
        side_effects:
          - "append an immutable RateCapCheck row with breach_bps > 0"
      - from: FLAGGED
        to: REMEDIATED
        trigger: "POST /deposit-placements/{id}/rate-cap-checks producing outcome IN {PASS, EXEMPT_NO_CAP}, or the RECLASSIFICATION_PENDING -> CLASSIFIED cascade"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status == FLAGGED"
        side_effects:
          - "append an immutable RateCapCheck row with breach_bps == 0"
      - from: REMEDIATED
        to: FLAGGED
        trigger: "POST /deposit-placements/{id}/rate-cap-checks producing outcome == BREACH"
        actor: ComplianceReviewer
        preconditions:
          - "compliance_status IN {RATE_CHECKED, REMEDIATED}"
        side_effects:
          - "append an immutable RateCapCheck row with breach_bps > 0"
        note: "Closes the surveillance cycle FLAGGED -> REMEDIATED -> FLAGGED."

  - entity: LiquidityContingencyPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /contingency-plans/{id}/lifecycle-actions with action=SUBMIT_FOR_REVIEW"
        actor: TreasuryController
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "no derived-field change"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /contingency-plans/{id}/lifecycle-actions with action=APPROVE"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "no other LiquidityContingencyPlan of the same institution with status IN {APPROVED, ACTIVATED} occupies a closed date interval that intersects [effective_from, effective_to]"
        side_effects:
          - "set approved_by_user_id to the acting X-User-ID"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /contingency-plans/{id}/lifecycle-actions with action=REJECT"
        actor: ComplianceReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "no derived-field change"
      - from: APPROVED
        to: ACTIVATED
        trigger: "POST /contingency-plans/{id}/lifecycle-actions with action=ACTIVATE, or hop 4 of the PrimaryPurposeException REVOKE cascade"
        actor: TreasuryController
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "set activation_stage via calculations.contingency_stage_selection"
          - "set required_buffer_cents via calculations.required_liquidity_buffer"
          - "set buffer_shortfall_cents = max(0, required_buffer_cents - Institution.liquidity_buffer_cents)"
      - from: ACTIVATED
        to: DEACTIVATED
        trigger: "POST /contingency-plans/{id}/lifecycle-actions with action=DEACTIVATE"
        actor: TreasuryController
        preconditions:
          - "status == ACTIVATED"
        side_effects:
          - "set activation_stage = NONE, required_buffer_cents = 0, buffer_shortfall_cents = 0"
      - from: DEACTIVATED
        to: APPROVED
        trigger: "POST /contingency-plans/{id}/lifecycle-actions with action=REARM"
        actor: TreasuryController
        preconditions:
          - "status == DEACTIVATED"
        side_effects:
          - "no derived-field change"
        note: "Closes the cycle APPROVED -> ACTIVATED -> DEACTIVATED -> APPROVED."

  - entity: CallReportFiling
    dimension: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=PREPARE"
        actor: FundingDeskOfficer
        preconditions:
          - "status IN {DRAFT, AMENDMENT_REQUIRED}"
        side_effects:
          - "when the optional rc_e_brokered_reported_cents / rc_o_listing_reported_cents / rc_e_core_reported_cents fields are supplied, overwrite the corresponding reported figures"
          - "recompute computed_brokered_cents, computed_listing_cents, computed_core_cents, variance_cents, variance_bps and accuracy_status via calculations.call_report_variance"
          - "set prepared_by_user_id to the acting X-User-ID and attested_by_user_id = null"
      - from: AMENDMENT_REQUIRED
        to: PREPARED
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=PREPARE"
        actor: FundingDeskOfficer
        preconditions:
          - "status IN {DRAFT, AMENDMENT_REQUIRED}"
        side_effects:
          - "identical to the DRAFT -> PREPARED transition"
        note: "Closes the amendment cycle FILED -> UNDER_EXAMINER_REVIEW -> AMENDMENT_REQUIRED -> PREPARED."
      - from: PREPARED
        to: ATTESTED
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=ATTEST"
        actor: ComplianceReviewer
        preconditions:
          - "status == PREPARED"
          - "the acting X-User-ID != prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set attested_by_user_id to the acting X-User-ID"
      - from: ATTESTED
        to: FILED
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=FILE"
        actor: FundingDeskOfficer
        preconditions:
          - "status == ATTESTED"
          - "accuracy_status IN {ACCURATE, VARIANCE_MINOR}, guaranteed by the ATTEST gate at validations[priority=30]; no independent error is raised here"
        side_effects:
          - "no derived-field change"
      - from: FILED
        to: UNDER_EXAMINER_REVIEW
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=OPEN_EXAM_REVIEW"
        actor: Examiner
        preconditions:
          - "status == FILED"
        side_effects:
          - "no derived-field change"
      - from: UNDER_EXAMINER_REVIEW
        to: AMENDMENT_REQUIRED
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=REQUIRE_AMENDMENT"
        actor: Examiner
        preconditions:
          - "status == UNDER_EXAMINER_REVIEW"
        side_effects:
          - "increment amendment_round by 1"
          - "set examiner_finding_note to the supplied note"
      - from: UNDER_EXAMINER_REVIEW
        to: ACCEPTED
        trigger: "POST /call-report-filings/{id}/workflow-actions with action=ACCEPT"
        actor: Examiner
        preconditions:
          - "status == UNDER_EXAMINER_REVIEW"
        side_effects:
          - "set examiner_finding_note to the supplied note"

# =============================================================================
# 1.2.1  Concurrency Rules  (OCC on the parent's `version`, serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: classification-create-stale-program
    parent_entity: DepositProgram
    write_endpoint: "POST /deposit-classifications"
    occ_field: "expected_program_version"
    description: |
      Creating a DepositClassification for a DepositProgram whose version has
      advanced past the value the client last observed is rejected. A new
      classification legitimately supersedes the program's prior governing
      classification, so a second create carrying an older observed version
      would otherwise silently overwrite a determination the client never saw.
      The stale-version check turns that into a deterministic rejection.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: capital-category-update-stale-institution
    parent_entity: Institution
    write_endpoint: "PATCH /institutions/{id}/capital-category"
    occ_field: "expected_institution_version"
    description: |
      Re-categorising an Institution whose version has advanced past the value
      the client last observed is rejected. Any capital_category value is a
      legitimate successor to any other, so no state precondition would reject
      the second write; only the stale-version check does, and it is what stops
      a supervisory downgrade from being silently reverted by a writer holding
      an older view of the institution.
    error_id: ERR_STALE_INSTITUTION_VERSION
    http_status: 412

# =============================================================================
# 1.3  Calculation Rules Table
# =============================================================================
# All money is integer cents; all rates and ratios are integer basis points.
# `floor(a / b)` means integer division of exact integers (never float).
# `round_half_up(a / b)` means: evaluate a/b as an exact rational, then round
# halves away from zero. Never accumulate floating point.
# =============================================================================
calculations:
  - name: rate_cap_regime_derivation
    trigger: "on POST /institutions and on PATCH /institutions/{id}/capital-category"
    algorithm: threshold
    formula: |
      if capital_category == WELL_CAPITALIZED:
          rate_cap_regime = EXEMPT
      else:
          rate_cap_regime = CAPPED
    input_set: "the Institution row alone"
    constants: {}
    precision: "exact enum"

  - name: tenor_bucket_assignment
    trigger: "on POST /deposit-programs and on POST /deposit-placements"
    algorithm: threshold
    formula: |
      if product_type IN {MONEY_MARKET, SAVINGS, NOW}:
          tenor_bucket = NON_MATURITY
      elif tenor_days <= 30:      tenor_bucket = DAYS_1_30
      elif tenor_days <= 90:      tenor_bucket = DAYS_31_90
      elif tenor_days <= 180:     tenor_bucket = DAYS_91_180
      elif tenor_days <= 365:     tenor_bucket = DAYS_181_365
      else:                       tenor_bucket = DAYS_366_PLUS
    input_set: "product_type from the DepositProgram; tenor_days from the row being created"
    constants: {}
    precision: "exact enum; every boundary is inclusive on the upper edge (tenor_days == 30 is DAYS_1_30, tenor_days == 31 is DAYS_31_90)"

  - name: effective_rate_cap
    trigger: "on POST /deposit-programs, on POST /deposit-placements, on POST /deposit-placements/{id}/rate-cap-checks, on the PATCH /institutions/{id}/capital-category cascade, and as a side effect of every DepositProgram transition into CLASSIFIED"
    algorithm: threshold
    formula: |
      # STEP 1 - regime gate
      if Institution.rate_cap_regime == EXEMPT:
          effective_cap_bps = null           # no ceiling applies
          return
      # STEP 2 - select the governing publication (deterministic selector)
      #   candidate set : NationalRateCap rows with tenor_bucket == subject.tenor_bucket
      #                   AND effective_date <= as_of_date
      #   ranking       : effective_date DESC
      #   tie-break     : created_at DESC
      #   empty pool    : ERR_NO_RATE_CAP_PUBLISHED
      cap_row = rank_first(candidates)
      # STEP 3 - nested ceiling: national floor vs local comparison, then the
      #          non-maturity clamp. Order is pinned: max() first, min() second.
      national_leg = cap_row.published_national_rate_bps + NATIONAL_SPREAD_BPS
      if DepositProgram.local_prevailing_rate_bps is null:
          combined = national_leg
      else:
          combined = max(national_leg,
                         DepositProgram.local_prevailing_rate_bps + LOCAL_SPREAD_BPS)
      if subject.tenor_bucket == NON_MATURITY:
          effective_cap_bps = min(combined,
                                  cap_row.published_national_rate_bps + NON_MATURITY_SPREAD_BPS)
      else:
          effective_cap_bps = combined
    input_set: |
      as_of_date is the placement's issue_date for POST /deposit-placements, the supplied
      check_date for a rate-cap check, and the logical clock's date for a program-level
      recompute. Only NationalRateCap rows for the subject's own tenor_bucket are candidates.
    constants:
      NATIONAL_SPREAD_BPS: 75
      LOCAL_SPREAD_BPS: 75
      NON_MATURITY_SPREAD_BPS: 50
    precision: "integer basis points; no rounding occurs because every term is an integer"
    variants:
      - name: with_local_comparison
        when: "DepositProgram.local_prevailing_rate_bps is not null"
        difference: "the max() leg can lift the ceiling above the national leg"
      - name: national_only
        when: "DepositProgram.local_prevailing_rate_bps is null"
        difference: "the ceiling is exactly published_national_rate_bps + 75, with no max() leg"

  - name: accrued_interest
    trigger: "as a side effect of the ACTIVE -> MATURED and ACTIVE -> WITHDRAWN_EARLY transitions of DepositPlacement.funding_status"
    algorithm: chronological
    formula: |
      days_held = (settlement_date - issue_date) in whole calendar days
      accrued_interest_cents =
          round_half_up(principal_cents * rate_bps * days_held / (10000 * DAY_COUNT_BASIS))
    input_set: "the single DepositPlacement row; settlement_date is maturity_date on maturity and the supplied withdrawal_date on early withdrawal"
    constants:
      DAY_COUNT_BASIS: 365
    precision: "integer cents, round_half_up on the single final division"

  - name: early_withdrawal_penalty
    trigger: "as a side effect of the DepositPlacement.funding_status ACTIVE -> WITHDRAWN_EARLY transition"
    algorithm: threshold
    formula: |
      contractual_cents = round_half_up(
          principal_cents * rate_bps * DepositProgram.early_withdrawal_penalty_days
          / (10000 * DAY_COUNT_BASIS))
      if DepositProgram.principal_erosion_allowed:
          early_withdrawal_penalty_cents = contractual_cents            # CONTRACTUAL_DAYS variant
      else:
          early_withdrawal_penalty_cents = min(contractual_cents,
                                               accrued_interest_cents)  # INTEREST_EARNED_CAP variant
      net_settlement_cents = principal_cents + accrued_interest_cents
                             - early_withdrawal_penalty_cents
    input_set: "the DepositPlacement row plus its DepositProgram's early_withdrawal_penalty_days and principal_erosion_allowed flag"
    constants:
      DAY_COUNT_BASIS: 365
    precision: "integer cents, round_half_up on the contractual leg only; the min() is exact"
    variants:
      - name: contractual_days
        when: "DepositProgram.principal_erosion_allowed == true"
        difference: "the full penalty_days of interest is forfeited even when it exceeds interest actually earned, so net_settlement_cents falls below principal_cents"
      - name: interest_earned_cap
        when: "DepositProgram.principal_erosion_allowed == false"
        difference: "the penalty is clamped to accrued_interest_cents, so net_settlement_cents can never fall below principal_cents"

  - name: broker_fee_settlement
    trigger: "as a side effect of the DepositPlacement.funding_status PENDING -> ACTIVE and ACTIVE -> WITHDRAWN_EARLY transitions"
    algorithm: tiered_pricing
    formula: |
      # per-line fee for one placement p under agreement a
      def line_fee(p, a):
          if a.fee_structure == FLAT_FEE:         return a.fee_flat_cents
          if a.fee_structure == PER_ACCOUNT_FEE:  return a.fee_flat_cents
          if a.fee_structure == BASIS_POINT_FEE:
              return round_half_up(p.principal_cents * a.fee_bps / 10000)
          # VOLUME_TIERED: the tier is chosen by the placement's OWN principal
          if   p.principal_cents <  VOLUME_TIER_1_CEILING_CENTS: bps = VOLUME_TIER_1_BPS
          elif p.principal_cents <  VOLUME_TIER_2_CEILING_CENTS: bps = VOLUME_TIER_2_BPS
          else:                                                  bps = VOLUME_TIER_3_BPS
          return round_half_up(p.principal_cents * bps / 10000)

      # ROUNDING ORDER IS PINNED: round every line to whole cents FIRST, then sum.
      # Summing the exact rationals and rounding once at the end is FORBIDDEN and
      # yields a different total (e.g. three lines each ending in .5 differ by 1 cent).
      lines = placements of programs with agreement_id == a.id
              AND funding_status == ACTIVE,
              processed in DepositPlacement.created_at ASC order
      for p in lines:  p.fee_accrual_cents = line_fee(p, a)
      a.accrued_fee_cents = sum(p.fee_accrual_cents for p in lines)
    input_set: "only placements whose funding_status == ACTIVE contribute; a placement leaving ACTIVE has its fee_accrual_cents reset to 0 and is dropped from the sum"
    constants:
      VOLUME_TIER_1_CEILING_CENTS: 100000000
      VOLUME_TIER_2_CEILING_CENTS: 500000000
      VOLUME_TIER_1_BPS: 15
      VOLUME_TIER_2_BPS: 10
      VOLUME_TIER_3_BPS: 7
    precision: "integer cents; round_half_up applied per line, never to the aggregate"

  - name: broker_diligence_score
    trigger: "as a side effect of the BrokerAgreement transitions DRAFT -> UNDER_DILIGENCE, RFI_ISSUED -> UNDER_DILIGENCE and SUSPENDED -> UNDER_DILIGENCE"
    algorithm: weighted_scoring
    formula: |
      raw = AML_WEIGHT_NUM        * aml_program_score
          + FINANCIAL_WEIGHT_NUM  * financial_condition_score
          + INSURANCE_WEIGHT_NUM  * insurance_coverage_score
          + RECORDKEEPING_WEIGHT_NUM * recordkeeping_score
      diligence_score = round_half_up(raw / WEIGHT_DENOM)
    input_set: "the four sub-scores on the BrokerAgreement row only"
    constants:
      AML_WEIGHT_NUM: 35
      FINANCIAL_WEIGHT_NUM: 30
      INSURANCE_WEIGHT_NUM: 20
      RECORDKEEPING_WEIGHT_NUM: 15
      WEIGHT_DENOM: 100
      DILIGENCE_APPROVE_MIN: 70
      DILIGENCE_CONDITIONAL_MIN: 60
      AML_FLOOR: 60
    precision: "integer 0..100; the weighted sum is accumulated as an exact rational and rounded once at the end"

  - name: primary_purpose_tests
    trigger: "on POST /primary-purpose-exceptions and re-evaluated on POST /primary-purpose-exceptions/{id}/filing-actions with action=SUBMIT"
    algorithm: threshold
    formula: |
      business_line_deposit_ratio_bps =
          floor(deposits_placed_at_ifs_cents * 10000 / total_customer_assets_cents)
      if total_transaction_count == 0:
          enabling_transaction_ratio_bps = 0
      else:
          enabling_transaction_ratio_bps =
              floor(enabling_transaction_count * 10000 / total_transaction_count)

      if exception_basis == TWENTY_FIVE_PERCENT_TEST:
          # STRICTLY below: a ratio of exactly 2500 bps FAILS
          test_outcome = QUALIFIED if business_line_deposit_ratio_bps < TWENTY_FIVE_PCT_BPS
                         else NOT_QUALIFIED
      elif exception_basis == ENABLING_TRANSACTIONS_TEST:
          # AT OR ABOVE: a ratio of exactly 7500 bps QUALIFIES
          test_outcome = QUALIFIED if enabling_transaction_ratio_bps >= ENABLING_TXN_MIN_BPS
                         else NOT_QUALIFIED
      else:                       # OTHER_APPLICATION
          test_outcome = NOT_EVALUATED
    input_set: "the PrimaryPurposeException row alone; no placement or program data enters"
    constants:
      TWENTY_FIVE_PCT_BPS: 2500
      ENABLING_TXN_MIN_BPS: 7500
      REPORT_INTERVAL_DAYS: 90
      MAX_INFO_REQUEST_ROUNDS: 2
    precision: "integer basis points, floor division; the two tests use OPPOSITE boundary directions on purpose"

  - name: deposit_classification_determination
    trigger: "as a side effect of the DepositProgram transitions PENDING_CLASSIFICATION -> CLASSIFIED and RECLASSIFICATION_PENDING -> CLASSIFIED"
    algorithm: constraint_propagation
    formula: |
      # Branches are evaluated STRICTLY top to bottom; the first match wins.
      P = the DepositProgram; B = its Broker (null when P.broker_id is null)
      E = the PrimaryPurposeException named by relied_exception_id (null when absent)

      # 1. reciprocal exclusion
      if P.funding_channel_claim == RECIPROCAL_NETWORK
         and reciprocal_exclusion_capacity(P.institution_id) >= P.reciprocal_arrangement_cents:
          determined_class    = RECIPROCAL_EXCLUDED
          deposit_broker_prong = NOT_APPLICABLE
      # 2. no counterparty at all
      elif P.broker_id is null:
          determined_class    = CORE
          deposit_broker_prong = NOT_APPLICABLE
      # 3. a reliable primary purpose exception carries the program out of brokered
      elif E is not null and E.status IN {ACKNOWLEDGED, GRANTED}
           and E.test_outcome IN {QUALIFIED, NOT_EVALUATED}:
          determined_class    = LISTING_SERVICE_NON_BROKERED
          deposit_broker_prong = NOT_APPLICABLE
      # 4. a bare listing service with no placement discretion is not a broker
      elif B.broker_type == LISTING_SERVICE and B.has_placement_discretion == false:
          determined_class    = LISTING_SERVICE_NON_BROKERED
          deposit_broker_prong = NOT_APPLICABLE
      # 5. otherwise the deposit-broker prongs apply, first match wins
      else:
          determined_class = BROKERED
          if   B.has_placement_discretion:                  prong = PLACEMENT_DISCRETION
          elif B.broker_type == DEPOSIT_PLACEMENT_NETWORK:   prong = MATCHING_DRIVER
          else:                                             prong = FEE_FOR_PLACEMENT
          deposit_broker_prong = prong

      call_report_line = { BROKERED: RC_E_M1_BROKERED,
                           LISTING_SERVICE_NON_BROKERED: RC_E_M2_LISTING,
                           CORE: RC_E_CORE,
                           RECIPROCAL_EXCLUDED: RC_O_M_RECIPROCAL }[determined_class]
    input_set: "the DepositProgram row, its Broker row, and the relied PrimaryPurposeException row when relied_exception_id is supplied"
    constants: {}
    precision: "exact enum"

  - name: reciprocal_exclusion_capacity
    trigger: "inside calculations.deposit_classification_determination branch 1 and on POST /deposit-placements for programs whose governing determined_class == RECIPROCAL_EXCLUDED"
    algorithm: threshold
    formula: |
      cap_cents = floor(Institution.total_liabilities_cents
                        * RECIPROCAL_EXCLUSION_CAP_BPS / 10000)
      capacity_cents = max(0, cap_cents - Institution.reciprocal_deposits_cents)
      # placement gate: reject when the candidate principal exceeds capacity
      if candidate.principal_cents > capacity_cents: ERR_RECIPROCAL_CAP_EXCEEDED
    input_set: "Institution.total_liabilities_cents and Institution.reciprocal_deposits_cents"
    constants:
      RECIPROCAL_EXCLUSION_CAP_BPS: 2500
    precision: "integer cents, floor division"

  - name: wholesale_balance_rollup
    trigger: "as a side effect of every DepositPlacement.funding_status transition into or out of ACTIVE, of the RECLASSIFICATION_PENDING -> CLASSIFIED transition, and of hop 3 of the PrimaryPurposeException REVOKE cascade"
    algorithm: aggregation
    formula: |
      # source entity      : DepositPlacement
      # status filter      : funding_status == ACTIVE (exactly; PENDING, MATURED,
      #                      WITHDRAWN_EARLY, ROLLED_OVER and CANCELLED are excluded)
      # bucket key         : DepositPlacement.classified_as
      # window             : none - this is a live balance, not a period aggregate
      # order sensitivity  : none (integer addition), but the cascade processes
      #                      placements in created_at ASC order for reproducibility
      brokered_deposits_cents        = sum(principal_cents where classified_as == BROKERED)
      listing_service_deposits_cents = sum(principal_cents where classified_as == LISTING_SERVICE_NON_BROKERED)
      reciprocal_deposits_cents      = sum(principal_cents where classified_as == RECIPROCAL_EXCLUDED)
      total_deposits_cents = core_deposits_cents + brokered_deposits_cents
                             + listing_service_deposits_cents + reciprocal_deposits_cents
      # CORE-classified placements are NOT added to a wholesale bucket and are NOT
      # added to core_deposits_cents either: core_deposits_cents stays the operator-
      # supplied baseline, which is what keeps the invariant below exactly checkable.
    input_set: "all DepositPlacement rows of all DepositProgram rows whose institution_id == this Institution"
    constants: {}
    precision: "exact integer cents"
    note: |
      CONSERVED QUANTITY (outstanding wholesale principal):
        Institution.brokered_deposits_cents
          == sum(DepositPlacement.principal_cents
                 where funding_status == ACTIVE and classified_as == BROKERED)
      must hold after ANY sequence of funding actions, and in particular an
      ACTIVATE followed by its compensating EARLY_WITHDRAW must return
      brokered_deposits_cents to its exact pre-ACTIVATE value.

  - name: wholesale_funding_ratio
    trigger: "on GET /institutions/{id}/wholesale-funding-summary, and the POINT_IN_TIME variant additionally on every calculations.wholesale_balance_rollup run"
    algorithm: aggregation
    formula: |
      # ---- variant POINT_IN_TIME (the persisted Institution field) ----
      numerator_pit = brokered_deposits_cents + listing_service_deposits_cents
      wholesale_funding_ratio_bps =
          0 if total_deposits_cents == 0
          else floor(numerator_pit * 10000 / total_deposits_cents)

      # ---- variant AVERAGE_DAILY (read-only, period scoped) ----
      # day_count is INCLUSIVE of both endpoints.
      day_count = (period_end - period_start) in whole days + 1
      # A placement occupies the wholesale ladder on day d when it has ever been
      # funded (funding_status IN {ACTIVE, MATURED, WITHDRAWN_EARLY, ROLLED_OVER}),
      # its effective class IN {BROKERED, LISTING_SERVICE_NON_BROKERED}, and
      #     issue_date <= d <= min(period_end, settlement_date or period_end)
      daily_sum = sum over d in [period_start, period_end] of
                  sum(principal_cents of occupying placements on day d)
      avg_wholesale_cents = floor(daily_sum / day_count)
      average_daily_ratio_bps =
          0 if total_deposits_cents == 0
          else floor(avg_wholesale_cents * 10000 / total_deposits_cents)
    input_set: "POINT_IN_TIME reads only placements with funding_status == ACTIVE; AVERAGE_DAILY reads every placement that has ever been funded and clips its occupancy interval to the requested period"
    constants: {}
    precision: "integer basis points, floor division at each of the two steps of AVERAGE_DAILY (average first, then ratio) - averaging the per-day ratios instead is FORBIDDEN and yields a different number"
    variants:
      - name: point_in_time
        when: "basis omitted or basis == POINT_IN_TIME; always the variant that drives calculations.concentration_posture and calculations.contingency_stage_selection"
        difference: "a single snapshot of today's ACTIVE balances; ignores how long the money has been on the books"
      - name: average_daily
        when: "basis == AVERAGE_DAILY with period_start and period_end supplied; the variant disclosed in call report supporting schedules"
        difference: "time-weights each placement by its occupancy days inside the period, so a placement funded late in the period produces a far lower ratio than the point-in-time snapshot on the same data"

  - name: single_broker_concentration
    trigger: "inside calculations.concentration_posture, on every run"
    algorithm: aggregation
    formula: |
      # per broker b with at least one DepositProgram at this institution:
      #   exposure(b) = sum(DepositPlacement.principal_cents
      #                     where funding_status == ACTIVE
      #                     and the placement's DepositProgram.broker_id == b)
      # single_broker_max_ratio_bps = 0 when no broker has exposure, else
      #   floor(max(exposure(b)) * 10000 / total_deposits_cents)
      # Only the maximum VALUE is observable; no broker identity is selected, so
      # no tie-break is required.
    input_set: "placements with funding_status == ACTIVE whose program has a non-null broker_id"
    constants: {}
    precision: "integer basis points, floor division"

  - name: concentration_posture
    trigger: "as a side effect of every calculations.wholesale_balance_rollup run, of POST /institutions/{id}/concentration-limits, and of PATCH /institutions/{id}/capital-category"
    algorithm: threshold
    formula: |
      # Metrics are evaluated in this fixed declaration order; for each metric the
      # governing limit is the ConcentrationLimit row with status == ACTIVE for that
      # metric (at most one exists by construction - creating a new one retires the
      # prior row).
      value(BROKERED_TO_TOTAL_DEPOSITS)      = floor(brokered_deposits_cents * 10000 / total_deposits_cents)
      value(LISTING_TO_TOTAL_DEPOSITS)       = floor(listing_service_deposits_cents * 10000 / total_deposits_cents)
      value(WHOLESALE_TO_TOTAL_LIABILITIES)  = floor((brokered_deposits_cents + listing_service_deposits_cents)
                                                     * 10000 / total_liabilities_cents)
      value(SINGLE_BROKER_TO_TOTAL_DEPOSITS) = single_broker_max_ratio_bps
      # every division with a zero denominator yields 0

      for each ACTIVE limit L:
          L.current_value_bps = value(L.metric)
          if   L.current_value_bps >= L.breach_threshold_bps:  L.breach_state = BREACH
          elif L.current_value_bps >= L.warning_threshold_bps: L.breach_state = WARNING
          else:                                               L.breach_state = WITHIN

      breached_metric_count = count(L where L.breach_state == BREACH)
      if   breached_metric_count >= 1:                          concentration_posture = FROZEN
      elif count(L where L.breach_state == WARNING) >= 1:       concentration_posture = RESTRICTED
      else:                                                     concentration_posture = OPEN
    input_set: "the Institution's ConcentrationLimit rows with status == ACTIVE; rows with status == RETIRED are excluded and keep current_value_bps = 0 / breach_state = WITHIN"
    constants: {}
    precision: "integer basis points; both thresholds are inclusive lower bounds (>=), so a value exactly equal to breach_threshold_bps IS a breach"

  - name: concentration_headroom
    trigger: "on GET /institutions/{id}/wholesale-funding-summary"
    algorithm: constraint_propagation
    formula: |
      # The quantity looked for appears on BOTH sides of the constraint: adding
      # principal P raises the numerator AND the denominator. The circularity is
      # resolved once, in closed form, in this pinned order:
      #   want the largest integer P >= 0 such that
      #        floor(10000 * (B + P) / (D + P)) < T
      #   where B = brokered_deposits_cents, D = total_deposits_cents,
      #         T = breach_threshold_bps of the ACTIVE BROKERED_TO_TOTAL_DEPOSITS limit
      #
      # STEP 1  no ACTIVE BROKERED_TO_TOTAL_DEPOSITS limit -> brokered_headroom_cents = -1 (unbounded)
      # STEP 2  T >= 10000                                 -> brokered_headroom_cents = -1 (unbounded)
      # STEP 3  10000 * B >= T * D  (already at or past the limit)
      #                                                    -> brokered_headroom_cents = 0
      # STEP 4  otherwise, with N = T * D - 10000 * B and M = 10000 - T:
      #         brokered_headroom_cents = (N - 1) // M          # integer floor
      #
      # The `- 1` is NOT cosmetic. The constraint is STRICT (`< T`), so the answer
      # is the largest integer strictly below N / M, which is `(N - 1) // M`, not
      # `N // M`. The two differ by exactly 1 whenever M divides N — precisely the
      # round-number case a test will pick. Solving the inequality BEFORE
      # substituting the integer floor (i.e. treating the ratio as exact and only
      # flooring the final P) is what makes the result well-defined; flooring the
      # intermediate ratio first is FORBIDDEN.
    input_set: "Institution.brokered_deposits_cents, Institution.total_deposits_cents, and the ConcentrationLimit row with metric == BROKERED_TO_TOTAL_DEPOSITS and status == ACTIVE"
    constants: {}
    precision: "integer cents, floor division on the final step only"

  - name: maturity_window_exposure
    trigger: "on POST /deposit-placements, before the placement row is persisted"
    algorithm: interval_merge
    formula: |
      # Interval semantics: a CLOSED window of +/- LADDER_WINDOW_DAYS calendar days
      # centred on the candidate's maturity_date. Both endpoints are INCLUSIVE, so a
      # neighbour maturing exactly 15 days away IS inside the window. This is a
      # buffered aggregate-capacity rule, not an exclusive-occupancy rule.
      window = [candidate.maturity_date - LADDER_WINDOW_DAYS,
                candidate.maturity_date + LADDER_WINDOW_DAYS]     # closed
      effective_class(p) = p.classified_as when p.funding_status == ACTIVE,
                           else determined_class of p's DepositProgram.governing_classification_id
      neighbours = DepositPlacement rows whose DepositProgram.institution_id ==
                   candidate's institution, with funding_status IN {PENDING, ACTIVE},
                   effective_class(p) IN {BROKERED, LISTING_SERVICE_NON_BROKERED},
                   and maturity_date inside `window`
      exposure_cents = candidate.principal_cents + sum(p.principal_cents for p in neighbours)
      cap_cents = floor(Institution.total_deposits_cents * LADDER_WINDOW_CAP_BPS / 10000)
      if exposure_cents >= cap_cents:  ERR_MATURITY_WINDOW_CONCENTRATION
    input_set: "PENDING and ACTIVE placements of the same institution only; MATURED, WITHDRAWN_EARLY, ROLLED_OVER and CANCELLED placements never contribute"
    constants:
      LADDER_WINDOW_DAYS: 15
      LADDER_WINDOW_CAP_BPS: 3500
    precision: "integer cents; the cap comparison is an inclusive lower bound (>=), so exposure exactly equal to cap_cents is rejected"

  - name: contingency_stage_selection
    trigger: "as a side effect of the LiquidityContingencyPlan APPROVED -> ACTIVATED transition, including hop 4 of the PrimaryPurposeException REVOKE cascade"
    algorithm: threshold
    formula: |
      r = Institution.wholesale_funding_ratio_bps      # POINT_IN_TIME variant
      if   r >= stage_3_trigger_bps: activation_stage = STAGE_3_CRISIS
      elif r >= stage_2_trigger_bps: activation_stage = STAGE_2_CONTINGENT
      elif r >= stage_1_trigger_bps: activation_stage = STAGE_1_MONITOR
      else:                          activation_stage = NONE
    input_set: "the Institution's persisted wholesale_funding_ratio_bps and the plan's three trigger levels"
    constants: {}
    precision: "exact enum; every trigger is an inclusive lower bound (>=)"

  - name: required_liquidity_buffer
    trigger: "as a side effect of the LiquidityContingencyPlan APPROVED -> ACTIVATED transition"
    algorithm: aggregation
    formula: |
      # source entity : DepositPlacement
      # status filter : funding_status == ACTIVE
      # class filter  : classified_as IN {BROKERED, LISTING_SERVICE_NON_BROKERED}
      # window        : maturity_date inside the CLOSED interval
      #                 [clock_date, clock_date + BUFFER_HORIZON_DAYS]
      maturing_soon_cents = sum(principal_cents of qualifying placements)
      multiplier_bps = { NONE: 0, STAGE_1_MONITOR: 2500,
                         STAGE_2_CONTINGENT: 5000, STAGE_3_CRISIS: 10000 }[activation_stage]
      required_buffer_cents = round_half_up(maturing_soon_cents * multiplier_bps / 10000)
      buffer_shortfall_cents = max(0, required_buffer_cents - Institution.liquidity_buffer_cents)
    input_set: "placements of the plan's institution with funding_status == ACTIVE maturing within the closed 90-day horizon of the logical clock date"
    constants:
      BUFFER_HORIZON_DAYS: 90
    precision: "integer cents, round_half_up on the single final division"

  - name: call_report_variance
    trigger: "as a side effect of the CallReportFiling transitions DRAFT -> PREPARED and AMENDMENT_REQUIRED -> PREPARED"
    algorithm: aggregation
    formula: |
      computed_brokered_cents = Institution.brokered_deposits_cents
      computed_listing_cents  = Institution.listing_service_deposits_cents
      computed_core_cents     = Institution.core_deposits_cents
      variance_cents = abs(rc_e_brokered_reported_cents - computed_brokered_cents)
      variance_bps = 0 if Institution.total_deposits_cents == 0
                     else floor(variance_cents * 10000 / Institution.total_deposits_cents)
      if   variance_cents == 0:                       accuracy_status = ACCURATE
      elif variance_bps < VARIANCE_MATERIAL_BPS:      accuracy_status = VARIANCE_MINOR
      else:                                           accuracy_status = VARIANCE_MATERIAL
    input_set: "the three reported figures on the filing plus the institution's three live derived balances at the instant PREPARE runs"
    constants:
      VARIANCE_MATERIAL_BPS: 25
    precision: "integer cents and integer basis points; VARIANCE_MATERIAL_BPS is an inclusive lower bound, so variance_bps == 25 is MATERIAL"
    note: |
      CONSERVED QUANTITY (exception reliance count):
        PrimaryPurposeException.reliant_program_count
          == count(DepositProgram p where p.governing_classification_id names a
                   DepositClassification whose relied_exception_id == this exception)
      must hold after any classify / reclassify pair, and in particular a
      classification relying on E followed by a reclassification that does not
      rely on E must return E.reliant_program_count to its exact prior value.

# =============================================================================
# 1.4  Validation Rules Table (Ordered by Priority)
# =============================================================================
# Every request evaluates these rules in ascending `priority` order and returns
# the FIRST violated rule's error_id. Lower priority number always wins, even
# when a later, "more interesting" rule is also violated. The engine never
# collects multiple errors and never re-orders by severity.
# Domain ordering rationale: identity -> shape -> existence -> observed-version
# -> lifecycle state -> supervisory/compliance safety -> calendar/temporal
# -> structural constraint -> referential coherence -> balance-sheet capacity.
# Capacity (fiscal) checks run LAST because a request that is unsafe or
# mis-referenced must be reported as such rather than as a capacity problem.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of the six roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list; for BrokerRepresentative the X-User-ID must additionally equal the Broker.id reachable from the addressed resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request-body shape: every field with source: input and no default is present, enum-typed fields carry a declared member, integer fields are integers, *_cents and *_bps fields are >= 0, score fields are within 0..100, date fields are YYYY-MM-DD and instant fields are ISO-8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints
  - priority: 4
    category: existence
    check: "the {id} segment of an /institutions/... path names an existing Institution"
    error_id: ERR_INSTITUTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /institutions/{id}, PATCH /institutions/{id}/capital-category, POST /institutions/{id}/balance-adjustments, GET /institutions/{id}/wholesale-funding-summary, POST|GET /institutions/{id}/concentration-limits, POST|GET /institutions/{id}/contingency-plans, POST|GET /institutions/{id}/call-report-filings; also the institution_id body field of POST /primary-purpose-exceptions and POST /deposit-programs"
  - priority: 5
    category: existence
    check: "the {id} segment of a /brokers/... path, and the broker_id body field where supplied, name an existing Broker"
    error_id: ERR_BROKER_NOT_FOUND
    http_status: 404
    applies_to: "GET /brokers/{id}, POST|GET /brokers/{id}/agreements, POST /primary-purpose-exceptions, POST /deposit-programs"
  - priority: 6
    category: existence
    check: "the addressed BrokerAgreement exists; the agreement_id body field of POST /deposit-programs names an existing BrokerAgreement"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /broker-agreements/{id}, POST /broker-agreements/{id}/diligence-actions, GET /broker-agreements/{id}/fee-summary, POST /deposit-programs"
  - priority: 7
    category: existence
    check: "the addressed PrimaryPurposeException exists; the relied_exception_id body field of POST /deposit-classifications names an existing PrimaryPurposeException"
    error_id: ERR_EXCEPTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /primary-purpose-exceptions/{id}, POST /primary-purpose-exceptions/{id}/filing-actions, POST /primary-purpose-exceptions/{id}/review-actions, POST /deposit-classifications"
  - priority: 8
    category: existence
    check: "the addressed DepositProgram exists; the program_id body field names an existing DepositProgram"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /deposit-programs/{id}, POST /deposit-programs/{id}/state-actions, POST /deposit-classifications, POST /deposit-placements"
  - priority: 9
    category: existence
    check: "the addressed DepositClassification exists"
    error_id: ERR_CLASSIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /deposit-classifications/{id}"
  - priority: 10
    category: existence
    check: "the addressed DepositPlacement exists; the rolled_from_placement_id body field, where supplied, names an existing DepositPlacement"
    error_id: ERR_PLACEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /deposit-placements/{id}, POST /deposit-placements/{id}/funding-actions, POST|GET /deposit-placements/{id}/rate-cap-checks, POST /deposit-placements"
  - priority: 11
    category: existence
    check: "the addressed LiquidityContingencyPlan exists"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /contingency-plans/{id}, POST /contingency-plans/{id}/lifecycle-actions"
  - priority: 12
    category: existence
    check: "the addressed CallReportFiling exists"
    error_id: ERR_FILING_NOT_FOUND
    http_status: 404
    applies_to: "GET /call-report-filings/{id}, POST /call-report-filings/{id}/workflow-actions"
  - priority: 13
    category: existence
    check: "calculations.effective_rate_cap finds at least one NationalRateCap row for the subject's tenor_bucket with effective_date <= as_of_date; an empty candidate pool is an unpublished-benchmark condition, not a cap of zero"
    error_id: ERR_NO_RATE_CAP_PUBLISHED
    http_status: 404
    applies_to: "POST /deposit-programs, POST /deposit-placements, POST /deposit-placements/{id}/rate-cap-checks (only when the Institution's rate_cap_regime == CAPPED)"
  - priority: 14
    category: state
    check: "concurrency_rules.classification-create-stale-program: expected_program_version equals DepositProgram.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /deposit-classifications"
  - priority: 15
    category: state
    check: "concurrency_rules.capital-category-update-stale-institution: expected_institution_version equals Institution.version"
    error_id: ERR_STALE_INSTITUTION_VERSION
    http_status: 412
    applies_to: "PATCH /institutions/{id}/capital-category"
  - priority: 16
    category: state
    check: "BrokerAgreement.status admits the requested diligence action per the 1.2 transition list"
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /broker-agreements/{id}/diligence-actions"
  - priority: 17
    category: state
    check: "PrimaryPurposeException.status admits the requested filing or review action per the 1.2 transition list; SUBMIT from any state other than DRAFT and a second SUBMIT are both rejected here"
    error_id: ERR_EXCEPTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /primary-purpose-exceptions/{id}/filing-actions, POST /primary-purpose-exceptions/{id}/review-actions"
  - priority: 18
    category: state
    check: "DepositProgram.state admits the requested state action per the 1.2 transition list"
    error_id: ERR_PROGRAM_STATE_INVALID
    http_status: 409
    applies_to: "POST /deposit-programs/{id}/state-actions"
  - priority: 19
    category: state
    check: "DepositProgram.state IN {PENDING_CLASSIFICATION, RECLASSIFICATION_PENDING}"
    error_id: ERR_PROGRAM_NOT_CLASSIFIABLE
    http_status: 409
    applies_to: "POST /deposit-classifications"
  - priority: 20
    category: state
    check: "the DepositProgram's governing_classification_id must be non-null before it can be attested or funded; a program still awaiting its first determination has nothing to attest and no class to inherit"
    error_id: ERR_CLASSIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /deposit-programs/{id}/state-actions with action=ATTEST_CLASSIFICATION, POST /deposit-placements"
  - priority: 21
    category: state
    check: "DepositProgram.state == OPEN_FOR_PLACEMENT; a CLASSIFIED but un-attested program, a SUSPENDED program and a program under reclassification all reject new placements"
    error_id: ERR_PROGRAM_NOT_OPEN
    http_status: 409
    applies_to: "POST /deposit-placements"
  - priority: 22
    category: state
    check: "DepositPlacement.funding_status admits the requested funding action per the 1.2 transition list; a second ACTIVATE and an EARLY_WITHDRAW of a MATURED placement are both rejected here"
    error_id: ERR_PLACEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /deposit-placements/{id}/funding-actions"
  - priority: 23
    category: state
    check: "LiquidityContingencyPlan.status admits the requested lifecycle action per the 1.2 transition list"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /contingency-plans/{id}/lifecycle-actions"
  - priority: 24
    category: state
    check: "CallReportFiling.status admits the requested workflow action per the 1.2 transition list"
    error_id: ERR_FILING_STATE_INVALID
    http_status: 409
    applies_to: "POST /call-report-filings/{id}/workflow-actions"
  - priority: 25
    category: state
    check: "review-cycle round caps: ISSUE_RFI requires BrokerAgreement.rfi_round_count < MAX_RFI_ROUNDS (2); REQUEST_INFO requires PrimaryPurposeException.info_request_round_count < MAX_INFO_REQUEST_ROUNDS (2); REQUIRE_AMENDMENT requires CallReportFiling.amendment_round < MAX_AMENDMENT_ROUNDS (2). Each cyclic state machine terminates."
    error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /broker-agreements/{id}/diligence-actions, POST /primary-purpose-exceptions/{id}/review-actions, POST /call-report-filings/{id}/workflow-actions"
  - priority: 26
    category: business_safety
    check: "segregation of duties on X-User-ID: BrokerAgreement APPROVE|REJECT actor != prepared_by_user_id; PrimaryPurposeException GRANT|DENY|REVOKE actor != prepared_by_user_id; DepositProgram ATTEST_CLASSIFICATION actor != the determined_by_user_id of the governing DepositClassification; LiquidityContingencyPlan APPROVE actor != prepared_by_user_id; CallReportFiling ATTEST actor != prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /broker-agreements/{id}/diligence-actions, POST /primary-purpose-exceptions/{id}/review-actions, POST /deposit-programs/{id}/state-actions, POST /contingency-plans/{id}/lifecycle-actions, POST /call-report-filings/{id}/workflow-actions"
  - priority: 27
    category: business_safety
    check: "when a DepositProgram names a broker_id, the named BrokerAgreement.status must be IN {APPROVED, CONDITIONAL} and the Broker.diligence_status must be IN {APPROVED, CONDITIONAL}; a DRAFT, SUSPENDED, REJECTED or TERMINATED agreement cannot underwrite a program"
    error_id: ERR_AGREEMENT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /deposit-programs"
  - priority: 28
    category: business_safety
    check: "APPROVE requires calculations.broker_diligence_score >= DILIGENCE_CONDITIONAL_MIN (60) AND aml_program_score >= AML_FLOOR (60); an agreement below either floor can only be REJECTed. The AML floor bites independently of the composite: a 78 composite with an AML sub-score of 55 is still refused."
    error_id: ERR_DILIGENCE_SCORE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /broker-agreements/{id}/diligence-actions with action=APPROVE"
  - priority: 29
    category: business_safety
    check: "a NOTICE filing may only self-execute into ACKNOWLEDGED when calculations.primary_purpose_tests returned test_outcome == QUALIFIED; a NOT_QUALIFIED notice must be withdrawn and re-filed as an OTHER_APPLICATION, because no supervisory review path exists for a notice"
    error_id: ERR_PRIMARY_PURPOSE_TEST_NOT_MET
    http_status: 422
    applies_to: "POST /primary-purpose-exceptions/{id}/filing-actions with action=SUBMIT"
  - priority: 30
    category: business_safety
    check: "ATTEST requires CallReportFiling.accuracy_status != VARIANCE_MATERIAL; a filing whose reported brokered figure diverges from the computed figure by 25 bps or more of total deposits cannot be attested and must be re-PREPAREd after the numbers are corrected"
    error_id: ERR_FILING_VARIANCE_MATERIAL
    http_status: 422
    applies_to: "POST /call-report-filings/{id}/workflow-actions with action=ATTEST"
  - priority: 31
    category: business_safety
    check: "cross-entity rate ceiling: when the owning Institution.rate_cap_regime == CAPPED, the requested offered_rate_bps / rate_bps must be <= calculations.effective_rate_cap; equality passes, one basis point above fails"
    error_id: ERR_RATE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /deposit-programs, POST /deposit-placements"
  - priority: 32
    category: business_safety
    check: "the DepositProgram's governing DepositClassification must still be current: its program_version_at_determination must equal the program's live version at the instant of the placement. DepositProgram.version is bumped by exactly two things - POST /deposit-classifications (its own +1) and the PATCH /institutions/{id}/capital-category cascade; state-actions, attestation and outstanding_principal_cents movements deliberately do NOT bump it, so an unchanged program funds freely while a supervisory capital re-categorisation invalidates the standing determination until the program is re-classified"
    error_id: ERR_CLASSIFICATION_STALE
    http_status: 409
    applies_to: "POST /deposit-placements"
  - priority: 33
    category: business_safety
    check: "Institution.concentration_posture != FROZEN; a FROZEN institution accepts no new wholesale placement and no new program, and the freeze lifts only when every ACTIVE ConcentrationLimit returns to WITHIN or WARNING"
    error_id: ERR_CONCENTRATION_FROZEN
    http_status: 422
    applies_to: "POST /deposit-placements, POST /deposit-programs"
  - priority: 34
    category: business_safety
    check: "examiner review lock: while any CallReportFiling of the institution has status == UNDER_EXAMINER_REVIEW, the institution's capital_category and balance baselines are frozen against operator edits"
    error_id: ERR_EXAMINER_REVIEW_LOCK
    http_status: 409
    applies_to: "PATCH /institutions/{id}/capital-category, POST /institutions/{id}/balance-adjustments"
  - priority: 35
    category: business_temporal
    check: "calendar coherence of a placement: maturity_date must equal issue_date + tenor_days exactly for a maturity product, and for a NON_MATURITY product tenor_days must be 0 and maturity_date must equal issue_date"
    error_id: ERR_MATURITY_DATE_INVALID
    http_status: 422
    applies_to: "POST /deposit-placements"
  - priority: 36
    category: business_temporal
    check: "issue_date must be >= the underwriting BrokerAgreement.effective_date and >= the logical clock's date; deposits cannot be back-dated before the agreement that permits them"
    error_id: ERR_ISSUE_BEFORE_AGREEMENT
    http_status: 422
    applies_to: "POST /deposit-placements"
  - priority: 37
    category: business_temporal
    check: "contingency-plan coverage windows must not overlap: effective_from must be strictly before effective_to, and the CLOSED interval [effective_from, effective_to] must not intersect the closed interval of any other plan of the same Institution whose status IN {UNDER_REVIEW, APPROVED, ACTIVATED, DEACTIVATED}. Touching endpoints (new.effective_from == existing.effective_to) DO overlap; a one-day gap does not."
    error_id: ERR_PLAN_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /institutions/{id}/contingency-plans"
  - priority: 38
    category: business_temporal
    check: "an exception filing must be SUBMITted on or before its reporting_due_date as measured by the logical clock's date; equality passes"
    error_id: ERR_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /primary-purpose-exceptions/{id}/filing-actions"
  - priority: 39
    category: business_constraint
    check: "uniqueness: Institution.cert_id globally; BrokerAgreement.agreement_ref within one Broker; CallReportFiling.report_period within one Institution; NationalRateCap (tenor_bucket, effective_date) pair globally. ConcentrationLimit.metric is deliberately NOT a uniqueness key: a new limit for a metric that already has an ACTIVE row supersedes it"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /institutions, POST /brokers/{id}/agreements, POST /institutions/{id}/call-report-filings, POST /national-rate-caps"
  - priority: 40
    category: business_constraint
    check: "threshold ordering: ConcentrationLimit.warning_threshold_bps < breach_threshold_bps <= 10000; LiquidityContingencyPlan.stage_1_trigger_bps < stage_2_trigger_bps < stage_3_trigger_bps <= 10000"
    error_id: ERR_THRESHOLD_ORDER_INVALID
    http_status: 422
    applies_to: "POST /institutions/{id}/concentration-limits, POST /institutions/{id}/contingency-plans"
  - priority: 41
    category: business_constraint
    check: "pass-through insurance mechanics: pass_through_insurance == true requires titling_convention == FBO_SUBACCOUNTS and a non-null broker_id; a program titled DIRECT_TITLED or SINGLE_FIDUCIARY_ACCOUNT, or with no counterparty, cannot claim pass-through coverage, and funding_channel_claim == RECIPROCAL_NETWORK requires reciprocal_arrangement_cents > 0"
    error_id: ERR_PASS_THROUGH_TITLING_INVALID
    http_status: 422
    applies_to: "POST /deposit-programs"
  - priority: 42
    category: business_constraint
    check: "primary-purpose test inputs must be internally coherent for the declared basis: TWENTY_FIVE_PERCENT_TEST requires total_customer_assets_cents > 0 and deposits_placed_at_ifs_cents <= total_customer_assets_cents; ENABLING_TRANSACTIONS_TEST requires total_transaction_count > 0 and enabling_transaction_count <= total_transaction_count"
    error_id: ERR_EXCEPTION_INPUTS_INCOHERENT
    http_status: 422
    applies_to: "POST /primary-purpose-exceptions"
  - priority: 43
    category: business_referential
    check: "relied_exception_id, when supplied, must name a PrimaryPurposeException whose status IN {ACKNOWLEDGED, GRANTED}; a DRAFT, UNDER_REVIEW, INFO_REQUESTED, DENIED, WITHDRAWN or REVOKED filing cannot be relied upon to carry a program out of the brokered class"
    error_id: ERR_EXCEPTION_NOT_RELIABLE
    http_status: 422
    applies_to: "POST /deposit-classifications"
  - priority: 44
    category: business_referential
    check: "relied_exception_id, when supplied, must name a PrimaryPurposeException whose broker_id equals the program's broker_id AND whose institution_id equals the program's institution_id; an exception filed by a different broker or for a different bank cannot be relied upon"
    error_id: ERR_EXCEPTION_COUNTERPARTY_MISMATCH
    http_status: 422
    applies_to: "POST /deposit-classifications"
  - priority: 45
    category: business_referential
    check: "agreement_id, when supplied, must name a BrokerAgreement whose broker_id equals the program's broker_id; a program may not be underwritten by another broker's agreement, and a program with a null broker_id must omit agreement_id"
    error_id: ERR_AGREEMENT_BROKER_MISMATCH
    http_status: 422
    applies_to: "POST /deposit-programs"
  - priority: 46
    category: business_referential
    check: "rolled_from_placement_id, when supplied, must name a DepositPlacement of the SAME DepositProgram whose funding_status == MATURED and whose rolled_from_placement_id chain does not already include the new row; an ACTIVE, PENDING, CANCELLED or already-rolled source is rejected"
    error_id: ERR_ROLLOVER_SOURCE_INVALID
    http_status: 422
    applies_to: "POST /deposit-placements"
  - priority: 47
    category: business_fiscal
    check: "calculations.reciprocal_exclusion_capacity: for a program whose governing determined_class == RECIPROCAL_EXCLUDED, principal_cents must not exceed the institution's remaining reciprocal capacity (25% of total_liabilities_cents less reciprocal_deposits_cents)"
    error_id: ERR_RECIPROCAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /deposit-placements"
  - priority: 48
    category: business_fiscal
    check: "calculations.maturity_window_exposure: the candidate principal plus every PENDING or ACTIVE wholesale neighbour maturing within the closed +/-15 day window must stay strictly below 35% of total_deposits_cents. Each neighbour is individually admissible; only the aggregate breaches."
    error_id: ERR_MATURITY_WINDOW_CONCENTRATION
    http_status: 422
    applies_to: "POST /deposit-placements"
  - priority: 49
    category: business_fiscal
    check: "forward-looking activation gate: the POST-activation value of the ConcentrationLimit metric matching the placement's classified_as must stay strictly below that limit's breach_threshold_bps. Distinct from priority 33 - that one refuses a bank already FROZEN, this one refuses the single activation that would DO the freezing."
    error_id: ERR_CONCENTRATION_BREACH
    http_status: 422
    applies_to: "POST /deposit-placements/{id}/funding-actions with action=ACTIVATE"
  - priority: 50
    category: business_fiscal
    check: "a LiquidityContingencyPlan may not be DEACTIVATEd while its buffer_shortfall_cents > 0; the institution must first raise liquidity_buffer_cents to cover the required_buffer_cents computed at activation"
    error_id: ERR_BUFFER_SHORTFALL_UNFUNDED
    http_status: 422
    applies_to: "POST /contingency-plans/{id}/lifecycle-actions"

# --- Declared priority conflict pairs (Difficulty Rule 5) -------------------
# Each pair is co-triggerable by a SINGLE request, the two rules sit in
# different `category` values, and the lower priority number must win.
#   PAIR A  state 21 (ERR_PROGRAM_NOT_OPEN) vs business_fiscal 48
#           (ERR_MATURITY_WINDOW_CONCENTRATION) on one POST /deposit-placements
#           -> ERR_PROGRAM_NOT_OPEN
#   PAIR B  business_safety 31 (ERR_RATE_CAP_EXCEEDED) vs business_referential
#           46 (ERR_ROLLOVER_SOURCE_INVALID) on one POST /deposit-placements
#           -> ERR_RATE_CAP_EXCEEDED
#   PAIR C  business_temporal 35 (ERR_MATURITY_DATE_INVALID) vs business_fiscal
#           47 (ERR_RECIPROCAL_CAP_EXCEEDED) on one POST /deposit-placements
#           -> ERR_MATURITY_DATE_INVALID

# =============================================================================
# 1.5  API Endpoint Table
# =============================================================================
# api_prefix is "" — every collection is a flat top-level resource.
# All requests carry X-User-ID and X-User-Role headers (see 1.7).
# Sub-resource paths always template the PARENT id as `{id}`.
# =============================================================================
endpoints:

  # --- logical clock (test-driving namespace) -------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, maturity sweep, filing window and buffer horizon is measured against this clock."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Institution ---------------------------------------------------------
  - method: POST
    path: "/institutions"
    description: "Registers a bank. capital_category defaults to WELL_CAPITALIZED; rate_cap_regime is derived immediately by calculations.rate_cap_regime_derivation. All four wholesale balance buckets start at 0 and total_deposits_cents starts equal to core_deposits_cents."
    roles: [SystemAdmin]
    code: 201
    input: [legal_name, cert_id, "capital_category?", core_deposits_cents, total_liabilities_cents, tier1_capital_cents, liquidity_buffer_cents]
    output: Institution
    side_effects: [calculations.rate_cap_regime_derivation, calculations.wholesale_balance_rollup, calculations.wholesale_funding_ratio, calculations.concentration_posture]

  - method: GET
    path: "/institutions/{id}"
    description: "Reads one bank with all derived balances, ratios and posture."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: Institution
    side_effects: []

  - method: GET
    path: "/institutions"
    description: "Lists banks. Default sort: created_at ASC, tie-broken by cert_id ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["capital_category?", "concentration_posture?", "limit?", "offset?"]
    output: Institution[]
    side_effects: []

  - method: PATCH
    path: "/institutions/{id}/capital-category"
    description: "Supervisory re-categorisation. OCC-guarded by expected_institution_version (concurrency_rules.capital-category-update-stale-institution). A downgrade out of WELL_CAPITALIZED flips rate_cap_regime to CAPPED and cascades a rate-cap re-evaluation over every ACTIVE placement of the institution, moving each breaching placement's compliance_status to FLAGGED."
    roles: [SystemAdmin, Examiner]
    code: 200
    input: [capital_category, expected_institution_version]
    output: Institution
    side_effects: [calculations.rate_cap_regime_derivation, calculations.effective_rate_cap, "cascade: every DepositProgram of the institution with state != CLOSED has effective_cap_bps recomputed and version incremented by 1, processed in DepositProgram.created_at ASC order, which makes each program's governing determination stale for new placements (validations[priority=32])", "cascade: ACTIVE placements above the new ceiling move compliance_status to FLAGGED", calculations.concentration_posture]

  - method: POST
    path: "/institutions/{id}/balance-adjustments"
    description: "Operator maintenance of the bank's non-derived balance baselines (core deposits, total liabilities, tier 1 capital, liquidity buffer). Only supplied fields change. Never touches the derived wholesale buckets."
    roles: [SystemAdmin, TreasuryController]
    code: 200
    input: ["core_deposits_cents?", "total_liabilities_cents?", "tier1_capital_cents?", "liquidity_buffer_cents?"]
    output: Institution
    side_effects: [calculations.wholesale_balance_rollup, calculations.wholesale_funding_ratio, calculations.single_broker_concentration, calculations.concentration_posture]

  - method: GET
    path: "/institutions/{id}/wholesale-funding-summary"
    description: "Computed read. basis defaults to POINT_IN_TIME; basis=AVERAGE_DAILY requires period_start and period_end and returns the time-weighted variant of calculations.wholesale_funding_ratio. average_daily_ratio_bps, avg_wholesale_cents and day_count are 0 under POINT_IN_TIME. brokered_headroom_cents comes from calculations.concentration_headroom and is -1 when unbounded."
    roles: [SystemAdmin, TreasuryController, ComplianceReviewer, Examiner]
    code: 200
    input: ["basis?", "period_start?", "period_end?"]
    output: "{ institution_id: string, basis: string, wholesale_funding_ratio_bps: integer, average_daily_ratio_bps: integer, avg_wholesale_cents: integer, day_count: integer, brokered_deposits_cents: integer, listing_service_deposits_cents: integer, reciprocal_deposits_cents: integer, total_deposits_cents: integer, single_broker_max_ratio_bps: integer, brokered_headroom_cents: integer, concentration_posture: string, breached_metric_count: integer }"
    side_effects: [calculations.wholesale_funding_ratio, calculations.concentration_headroom]

  # --- NationalRateCap -----------------------------------------------------
  - method: POST
    path: "/national-rate-caps"
    description: "Publishes the national rate benchmark for one tenor bucket effective from a date. Immutable once published; a correction is a new publication with a later effective_date. cap_bps and non_maturity_cap_bps are derived as published + 75 and published + 50."
    roles: [SystemAdmin]
    code: 201
    input: [tenor_bucket, published_national_rate_bps, effective_date]
    output: NationalRateCap
    side_effects: []

  - method: GET
    path: "/national-rate-caps"
    description: "Lists published benchmarks. Sort: effective_date DESC, tie-broken by created_at DESC — the same ordering calculations.effective_rate_cap uses to pick the governing publication."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["tenor_bucket?", "limit?", "offset?"]
    output: NationalRateCap[]
    side_effects: []

  # --- Broker --------------------------------------------------------------
  - method: POST
    path: "/brokers"
    description: "Registers a counterparty: DEPOSIT_BROKER, LISTING_SERVICE, DEPOSIT_PLACEMENT_NETWORK or AFFILIATE. has_placement_discretion is the deposit-broker prong flag consumed by calculations.deposit_classification_determination. diligence_status starts NOT_STARTED."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 201
    input: [legal_name, broker_type, has_placement_discretion, fee_structure, "fee_bps?", "fee_flat_cents?"]
    output: Broker
    side_effects: []

  - method: GET
    path: "/brokers/{id}"
    description: "Reads one counterparty."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner, BrokerRepresentative]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: GET
    path: "/brokers"
    description: "Lists counterparties. Sort: created_at ASC, tie-broken by legal_name ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["broker_type?", "diligence_status?", "limit?", "offset?"]
    output: Broker[]
    side_effects: []

  # --- BrokerAgreement -----------------------------------------------------
  - method: POST
    path: "/brokers/{id}/agreements"
    description: "Files a broker agreement for diligence. broker_id is taken from the path, never the body. prepared_by_user_id is stamped from X-User-ID and is the identity the segregation-of-duties check at priority 26 compares against. Starts in DRAFT with diligence_score 0."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 201
    input: [agreement_ref, fee_structure, "fee_bps?", "fee_flat_cents?", termination_notice_days, effective_date, aml_program_score, financial_condition_score, insurance_coverage_score, recordkeeping_score]
    output: BrokerAgreement
    side_effects: []

  - method: GET
    path: "/brokers/{id}/agreements"
    description: "Reverse lookup of BrokerAgreement.broker_id. Sort: created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner, BrokerRepresentative]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BrokerAgreement[]
    side_effects: []

  - method: GET
    path: "/broker-agreements/{id}"
    description: "Reads one agreement with its diligence score, RFI round count and accrued fees."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner, BrokerRepresentative]
    code: 200
    input: []
    output: BrokerAgreement
    side_effects: []

  - method: POST
    path: "/broker-agreements/{id}/diligence-actions"
    description: "Drives the BrokerAgreement status machine. action IN {START_DILIGENCE, ISSUE_RFI, RESUME_DILIGENCE, APPROVE, REJECT, SUSPEND, TERMINATE}. APPROVE branches to APPROVED or CONDITIONAL on the diligence_score band. SUSPEND cascades three hops into Broker, DepositProgram and PENDING DepositPlacement."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer]
    code: 200
    input: [action, "note?"]
    output: BrokerAgreement
    side_effects: [calculations.broker_diligence_score, "cascade: Broker.diligence_status and approved_agreement_count", "cascade: DepositProgram to SUSPENDED / CLOSED", "cascade: PENDING DepositPlacement to CANCELLED"]

  - method: GET
    path: "/broker-agreements/{id}/fee-summary"
    description: "Computed read of calculations.broker_fee_settlement: the per-placement fee lines that currently contribute and the round-then-sum total. line_count counts only placements with funding_status == ACTIVE."
    roles: [SystemAdmin, FundingDeskOfficer, TreasuryController, Examiner, BrokerRepresentative]
    code: 200
    input: []
    output: "{ agreement_id: string, fee_structure: string, line_count: integer, accrued_fee_cents: integer, line_fee_cents: integer[], line_placement_ids: string[] }"
    side_effects: [calculations.broker_fee_settlement]

  # --- PrimaryPurposeException --------------------------------------------
  - method: POST
    path: "/primary-purpose-exceptions"
    description: "Files a primary purpose exception. filing_type is DERIVED from exception_basis: TWENTY_FIVE_PERCENT_TEST and ENABLING_TRANSACTIONS_TEST are NOTICE filings, OTHER_APPLICATION is an APPLICATION filing — this is what makes the SUBMIT transition branch. reporting_due_date is derived as the logical clock's date plus REPORT_INTERVAL_DAYS (90). Both ratios and test_outcome are computed by calculations.primary_purpose_tests at creation."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 201
    input: [broker_id, institution_id, exception_basis, designated_business_line, total_customer_assets_cents, deposits_placed_at_ifs_cents, "enabling_transaction_count?", "total_transaction_count?"]
    output: PrimaryPurposeException
    side_effects: [calculations.primary_purpose_tests]

  - method: GET
    path: "/primary-purpose-exceptions/{id}"
    description: "Reads one exception filing with its test outcome and reliance count."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: PrimaryPurposeException
    side_effects: []

  - method: GET
    path: "/primary-purpose-exceptions"
    description: "Reverse lookup of PrimaryPurposeException.broker_id and .institution_id. Sort: created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["broker_id?", "institution_id?", "status?", "test_outcome?", "limit?", "offset?"]
    output: PrimaryPurposeException[]
    side_effects: []

  - method: POST
    path: "/primary-purpose-exceptions/{id}/filing-actions"
    description: "Filer-side actions. action IN {SUBMIT, WITHDRAW}. SUBMIT re-runs calculations.primary_purpose_tests and branches on filing_type: a NOTICE lands in ACKNOWLEDGED (self-executing), an APPLICATION lands in UNDER_REVIEW."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 200
    input: [action, "note?"]
    output: PrimaryPurposeException
    side_effects: [calculations.primary_purpose_tests]

  - method: POST
    path: "/primary-purpose-exceptions/{id}/review-actions"
    description: "Supervisor-side actions. action IN {REQUEST_INFO, RESUME_REVIEW, GRANT, DENY, REVOKE}. REVOKE fires the four-hop cascade: programs to RECLASSIFICATION_PENDING, their ACTIVE placements FLAGGED and reclassified BROKERED, the institution's balances and ratio recomputed, and every APPROVED contingency plan ACTIVATED at the stage its new ratio selects."
    roles: [SystemAdmin, ComplianceReviewer, Examiner]
    code: 200
    input: [action, "note?"]
    output: PrimaryPurposeException
    side_effects: ["cascade: DepositProgram to RECLASSIFICATION_PENDING", "cascade: ACTIVE DepositPlacement compliance_status to FLAGGED and classified_as to BROKERED", calculations.wholesale_balance_rollup, calculations.wholesale_funding_ratio, calculations.concentration_posture, "cascade: APPROVED LiquidityContingencyPlan to ACTIVATED", calculations.contingency_stage_selection, calculations.required_liquidity_buffer]

  # --- DepositProgram ------------------------------------------------------
  - method: POST
    path: "/deposit-programs"
    description: "Opens a funding program. broker_id and agreement_id are omitted for a purely internal (core) program. tenor_bucket comes from calculations.tenor_bucket_assignment and effective_cap_bps from calculations.effective_rate_cap. Starts in PENDING_CLASSIFICATION with no governing classification."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 201
    input: [institution_id, "broker_id?", "agreement_id?", program_name, funding_channel_claim, product_type, tenor_days, offered_rate_bps, "local_prevailing_rate_bps?", early_withdrawal_penalty_days, "principal_erosion_allowed?", "pass_through_insurance?", titling_convention, "rollover_enabled?", "reciprocal_arrangement_cents?"]
    output: DepositProgram
    side_effects: [calculations.tenor_bucket_assignment, calculations.effective_rate_cap]

  - method: GET
    path: "/deposit-programs/{id}"
    description: "Reads one program including its governing_classification_id and outstanding principal."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: DepositProgram
    side_effects: []

  - method: GET
    path: "/deposit-programs"
    description: "Reverse lookup of DepositProgram.institution_id, .broker_id, .agreement_id and .governing_classification_id. Sort: created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["institution_id?", "broker_id?", "agreement_id?", "governing_classification_id?", "state?", "limit?", "offset?"]
    output: DepositProgram[]
    side_effects: []

  - method: POST
    path: "/deposit-programs/{id}/state-actions"
    description: "Drives the DepositProgram state machine. action IN {ATTEST_CLASSIFICATION, SUSPEND, RESUME, START_RECLASSIFICATION, CLOSE}. ATTEST_CLASSIFICATION is the segregation-of-duties gate: the attesting X-User-ID must differ from the governing classification's determined_by_user_id."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer]
    code: 200
    input: [action, "note?"]
    output: DepositProgram
    side_effects: ["cascade: PENDING DepositPlacement to CANCELLED on SUSPEND and CLOSE", calculations.wholesale_balance_rollup, calculations.concentration_posture]

  # --- DepositClassification ----------------------------------------------
  - method: POST
    path: "/deposit-classifications"
    description: "Immutable classification determination for a program. OCC-guarded by expected_program_version (concurrency_rules.classification-create-stale-program). Runs calculations.deposit_classification_determination, stamps program_version_at_determination, sets the program's governing_classification_id and moves the program to CLASSIFIED. A reclassification supersedes the prior row and re-derives classified_as on every ACTIVE placement of the program."
    roles: [SystemAdmin, ComplianceReviewer]
    code: 201
    input: [program_id, expected_program_version, rationale_code, "relied_exception_id?"]
    output: DepositClassification
    side_effects: [calculations.deposit_classification_determination, calculations.reciprocal_exclusion_capacity, "cascade: DepositProgram to CLASSIFIED", "cascade: ACTIVE DepositPlacement classified_as re-derived and FLAGGED placements moved to REMEDIATED", "cascade: PrimaryPurposeException.reliant_program_count adjusted", calculations.wholesale_balance_rollup, calculations.wholesale_funding_ratio, calculations.concentration_posture]

  - method: GET
    path: "/deposit-classifications/{id}"
    description: "Reads one classification determination."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: DepositClassification
    side_effects: []

  - method: GET
    path: "/deposit-classifications"
    description: "Reverse lookup of DepositClassification.program_id and .relied_exception_id. Sort: effective_at ASC, tie-broken by created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["program_id?", "relied_exception_id?", "determined_class?", "limit?", "offset?"]
    output: DepositClassification[]
    side_effects: []

  # --- DepositPlacement ---------------------------------------------------
  - method: POST
    path: "/deposit-placements"
    description: "Books a deposit under an OPEN_FOR_PLACEMENT program. maturity_date is derived as issue_date + tenor_days. classified_as is inherited from the program's governing classification. Runs the rate-cap ceiling check, the reciprocal capacity check and the maturity-window aggregate check before persisting. Starts PENDING / UNREVIEWED."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 201
    input: [program_id, principal_cents, rate_bps, issue_date, tenor_days, "rolled_from_placement_id?"]
    output: DepositPlacement
    side_effects: [calculations.tenor_bucket_assignment, calculations.effective_rate_cap, calculations.reciprocal_exclusion_capacity, calculations.maturity_window_exposure]

  - method: GET
    path: "/deposit-placements/{id}"
    description: "Reads one placement including both state dimensions and all settlement figures."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: DepositPlacement
    side_effects: []

  - method: GET
    path: "/deposit-placements"
    description: "Reverse lookup of DepositPlacement.program_id and .rolled_from_placement_id. Sort: issue_date ASC, tie-broken by created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["program_id?", "rolled_from_placement_id?", "funding_status?", "compliance_status?", "classified_as?", "limit?", "offset?"]
    output: DepositPlacement[]
    side_effects: []

  - method: POST
    path: "/deposit-placements/{id}/funding-actions"
    description: "Drives DepositPlacement.funding_status. action IN {ACTIVATE, EARLY_WITHDRAW, CANCEL}. withdrawal_date is required for EARLY_WITHDRAW and ignored otherwise. ACTIVATE adds the principal to the institution's wholesale bucket for its class; EARLY_WITHDRAW is the exact compensating action and removes it again."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 200
    input: [action, "withdrawal_date?"]
    output: DepositPlacement
    side_effects: [calculations.accrued_interest, calculations.early_withdrawal_penalty, calculations.broker_fee_settlement, calculations.wholesale_balance_rollup, calculations.wholesale_funding_ratio, calculations.single_broker_concentration, calculations.concentration_posture]

  - method: POST
    path: "/deposit-placements/{id}/rate-cap-checks"
    description: "Records an immutable rate-cap review of one placement as of check_date, snapshotting the national and local benchmarks used. outcome is EXEMPT_NO_CAP for a WELL_CAPITALIZED institution, BREACH when rate_bps exceeds the ceiling, else PASS. Drives DepositPlacement.compliance_status only — funding_status never moves here."
    roles: [SystemAdmin, ComplianceReviewer, Examiner]
    code: 201
    input: [check_date]
    output: RateCapCheck
    side_effects: [calculations.effective_rate_cap, "DepositPlacement.compliance_status transition"]

  - method: GET
    path: "/deposit-placements/{id}/rate-cap-checks"
    description: "Reverse lookup of RateCapCheck.placement_id. Sort: check_date ASC, tie-broken by created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: RateCapCheck[]
    side_effects: []

  # --- ConcentrationLimit -------------------------------------------------
  - method: POST
    path: "/institutions/{id}/concentration-limits"
    description: "Sets the board limit for one metric. institution_id comes from the path. Creating a limit for a metric that already has an ACTIVE row supersedes it: the prior row moves to status == RETIRED with current_value_bps reset to 0 and breach_state reset to WITHIN, and the new row becomes the governing ACTIVE limit for that metric. The new row is evaluated against current balances immediately."
    roles: [SystemAdmin, TreasuryController]
    code: 201
    input: [metric, warning_threshold_bps, breach_threshold_bps]
    output: ConcentrationLimit
    side_effects: ["retire the prior ACTIVE ConcentrationLimit for the same metric of the same institution, if any (status = RETIRED, current_value_bps = 0, breach_state = WITHIN)", calculations.concentration_posture, calculations.single_broker_concentration]

  - method: GET
    path: "/institutions/{id}/concentration-limits"
    description: "Reverse lookup of ConcentrationLimit.institution_id. Sort: created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["status?", "metric?", "limit?", "offset?"]
    output: ConcentrationLimit[]
    side_effects: []

  # --- LiquidityContingencyPlan -------------------------------------------
  - method: POST
    path: "/institutions/{id}/contingency-plans"
    description: "Drafts a liquidity contingency funding plan covering the closed date interval [effective_from, effective_to]. institution_id comes from the path. The interval must not intersect the interval of any other plan of the same bank whose status IN {UNDER_REVIEW, APPROVED, ACTIVATED, DEACTIVATED}; DRAFT and REJECTED plans occupy no window."
    roles: [SystemAdmin, TreasuryController]
    code: 201
    input: [plan_version_label, effective_from, effective_to, stage_1_trigger_bps, stage_2_trigger_bps, stage_3_trigger_bps, stage_1_action_code, stage_2_action_code, stage_3_action_code]
    output: LiquidityContingencyPlan
    side_effects: []

  - method: GET
    path: "/institutions/{id}/contingency-plans"
    description: "Reverse lookup of LiquidityContingencyPlan.institution_id. Sort: effective_from ASC, tie-broken by created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LiquidityContingencyPlan[]
    side_effects: []

  - method: GET
    path: "/contingency-plans/{id}"
    description: "Reads one contingency plan with its activation stage and buffer figures."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: LiquidityContingencyPlan
    side_effects: []

  - method: POST
    path: "/contingency-plans/{id}/lifecycle-actions"
    description: "Drives the LiquidityContingencyPlan status machine. action IN {SUBMIT_FOR_REVIEW, APPROVE, REJECT, ACTIVATE, DEACTIVATE, REARM}. ACTIVATE selects the stage from the institution's current wholesale_funding_ratio_bps and sizes the required buffer. DEACTIVATE is blocked while buffer_shortfall_cents > 0. REARM returns a DEACTIVATED plan to APPROVED, resetting activation_stage to NONE and both buffer figures to 0."
    roles: [SystemAdmin, TreasuryController, ComplianceReviewer]
    code: 200
    input: [action, "note?"]
    output: LiquidityContingencyPlan
    side_effects: [calculations.contingency_stage_selection, calculations.required_liquidity_buffer]

  # --- CallReportFiling ---------------------------------------------------
  - method: POST
    path: "/institutions/{id}/call-report-filings"
    description: "Opens a call report draft for one reporting period with the operator's reported RC-E / RC-O figures. institution_id comes from the path. accuracy_status starts NOT_ASSESSED; nothing is compared until PREPARE runs."
    roles: [SystemAdmin, FundingDeskOfficer]
    code: 201
    input: [report_period, rc_e_brokered_reported_cents, rc_o_listing_reported_cents, rc_e_core_reported_cents]
    output: CallReportFiling
    side_effects: []

  - method: GET
    path: "/institutions/{id}/call-report-filings"
    description: "Reverse lookup of CallReportFiling.institution_id. Sort: report_period ASC, tie-broken by created_at ASC."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: ["status?", "report_period?", "limit?", "offset?"]
    output: CallReportFiling[]
    side_effects: []

  - method: GET
    path: "/call-report-filings/{id}"
    description: "Reads one filing with its computed figures, variance and accuracy status."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, TreasuryController, Examiner]
    code: 200
    input: []
    output: CallReportFiling
    side_effects: []

  - method: POST
    path: "/call-report-filings/{id}/workflow-actions"
    description: "Drives the CallReportFiling status machine. action IN {PREPARE, ATTEST, FILE, OPEN_EXAM_REVIEW, REQUIRE_AMENDMENT, ACCEPT}. PREPARE snapshots the institution's live derived balances and runs calculations.call_report_variance. The three reported-figure inputs are accepted ONLY with action=PREPARE from AMENDMENT_REQUIRED, which is how an amendment corrects the numbers. examiner_finding_note is accepted only with REQUIRE_AMENDMENT and ACCEPT. ATTEST is the segregation-of-duties gate against prepared_by_user_id."
    roles: [SystemAdmin, FundingDeskOfficer, ComplianceReviewer, Examiner]
    code: 200
    input: [action, "examiner_finding_note?", "rc_e_brokered_reported_cents?", "rc_o_listing_reported_cents?", "rc_e_core_reported_cents?"]
    output: CallReportFiling
    side_effects: [calculations.call_report_variance]

  # --- maturity sweep -----------------------------------------------------
  - method: POST
    path: "/maturity-runs"
    description: "System sweep over every ACTIVE placement whose maturity_date <= as_of_date. Phase 1 matures each placement in (maturity_date ASC, created_at ASC) order, computing accrued interest and releasing the wholesale balance. Phase 2 then rolls over exactly those just-matured placements whose program has rollover_enabled == true, creating the successor placement with rolled_from_placement_id set. The two phases never interleave."
    roles: [SystemAdmin]
    code: 200
    input: [as_of_date]
    output: "{ as_of_date: string, matured_count: integer, rolled_over_count: integer, created_placement_count: integer, matured_placement_ids: string[], created_placement_ids: string[] }"
    side_effects: [calculations.accrued_interest, calculations.broker_fee_settlement, calculations.wholesale_balance_rollup, calculations.wholesale_funding_ratio, calculations.single_broker_concentration, calculations.concentration_posture]

# =============================================================================
# 1.6  Error Code Catalog
# =============================================================================
# 50 codes, one per validation rule in 1.4, in the same priority order.
# Every code is triggerable through at least one endpoint declared in 1.5.
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the target endpoint, or a BrokerRepresentative addresses a resource belonging to a different Broker"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, undeclared enum member, non-integer where an integer is required, negative *_cents or *_bps, score outside 0..100, or malformed date / instant"
  - id: ERR_INSTITUTION_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Institution id does not exist"
  - id: ERR_BROKER_NOT_FOUND
    http: 404
    condition: "the addressed or referenced Broker id does not exist"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "the addressed or referenced BrokerAgreement id does not exist"
  - id: ERR_EXCEPTION_NOT_FOUND
    http: 404
    condition: "the addressed or referenced PrimaryPurposeException id does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "the addressed or referenced DepositProgram id does not exist"
  - id: ERR_CLASSIFICATION_NOT_FOUND
    http: 404
    condition: "the addressed DepositClassification id does not exist"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "the addressed or referenced DepositPlacement id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "the addressed LiquidityContingencyPlan id does not exist"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "the addressed CallReportFiling id does not exist"
  - id: ERR_NO_RATE_CAP_PUBLISHED
    http: 404
    condition: "no NationalRateCap has been published for the subject's tenor_bucket with effective_date on or before the as-of date, while the institution's rate_cap_regime is CAPPED"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the DepositProgram's current version"
  - id: ERR_STALE_INSTITUTION_VERSION
    http: 412
    condition: "expected_institution_version does not equal the Institution's current version"
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "the requested diligence action is not a declared transition out of the agreement's current status, including a repeat of an action already taken"
  - id: ERR_EXCEPTION_STATE_INVALID
    http: 409
    condition: "the requested filing or review action is not a declared transition out of the exception's current status, including any action against a DENIED, WITHDRAWN or REVOKED filing"
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "the requested state action is not a declared transition out of the program's current state, including any action against a CLOSED program"
  - id: ERR_PROGRAM_NOT_CLASSIFIABLE
    http: 409
    condition: "a classification was requested for a program whose state is not PENDING_CLASSIFICATION or RECLASSIFICATION_PENDING"
  - id: ERR_CLASSIFICATION_REQUIRED
    http: 409
    condition: "attestation or funding was requested for a program with no governing_classification_id"
  - id: ERR_PROGRAM_NOT_OPEN
    http: 409
    condition: "a placement was booked against a program whose state is not OPEN_FOR_PLACEMENT"
  - id: ERR_PLACEMENT_STATE_INVALID
    http: 409
    condition: "the requested funding action is not a declared transition out of the placement's current funding_status, including a second ACTIVATE or an EARLY_WITHDRAW of an already terminal placement"
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "the requested lifecycle action is not a declared transition out of the plan's current status"
  - id: ERR_FILING_STATE_INVALID
    http: 409
    condition: "the requested workflow action is not a declared transition out of the filing's current status, including any action against an ACCEPTED filing"
  - id: ERR_REVIEW_ROUND_LIMIT
    http: 409
    condition: "the cyclic review loop has already run its maximum number of rounds: rfi_round_count, info_request_round_count or amendment_round has reached 2"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same operator who prepared or determined the artefact now being approved, granted, attested or revoked"
  - id: ERR_AGREEMENT_NOT_APPROVED
    http: 422
    condition: "a program names a broker whose diligence_status is neither APPROVED nor CONDITIONAL, or whose agreement status is neither APPROVED nor CONDITIONAL"
  - id: ERR_DILIGENCE_SCORE_INSUFFICIENT
    http: 422
    condition: "APPROVE was requested with a composite diligence_score below 60, or with an aml_program_score below the independent AML floor of 60"
  - id: ERR_PRIMARY_PURPOSE_TEST_NOT_MET
    http: 422
    condition: "SUBMIT was requested for a NOTICE filing whose test_outcome is not QUALIFIED"
  - id: ERR_FILING_VARIANCE_MATERIAL
    http: 422
    condition: "ATTEST was requested for a filing whose accuracy_status is VARIANCE_MATERIAL"
  - id: ERR_RATE_CAP_EXCEEDED
    http: 422
    condition: "the offered rate exceeds the effective rate cap of a less-than-well-capitalized institution by at least one basis point"
  - id: ERR_CLASSIFICATION_STALE
    http: 409
    condition: "the institution's capital_category was re-categorised after the program's governing classification was determined, bumping DepositProgram.version, so program_version_at_determination no longer matches the program's live version"
  - id: ERR_CONCENTRATION_FROZEN
    http: 422
    condition: "a new program or placement was requested while the institution's concentration_posture is FROZEN"
  - id: ERR_EXAMINER_REVIEW_LOCK
    http: 409
    condition: "a capital-category change or balance adjustment was requested while one of the institution's filings is UNDER_EXAMINER_REVIEW"
  - id: ERR_MATURITY_DATE_INVALID
    http: 422
    condition: "the placement's calendar terms are incoherent: a maturity product with tenor_days == 0, or a NON_MATURITY product with tenor_days > 0"
  - id: ERR_ISSUE_BEFORE_AGREEMENT
    http: 422
    condition: "issue_date precedes the underwriting agreement's effective_date or the logical clock's date"
  - id: ERR_PLAN_WINDOW_OVERLAP
    http: 409
    condition: "the new plan's closed coverage interval intersects the closed interval of another plan of the same institution whose status IN {UNDER_REVIEW, APPROVED, ACTIVATED, DEACTIVATED}, including a shared endpoint; DRAFT and REJECTED plans occupy no window"
  - id: ERR_FILING_WINDOW_CLOSED
    http: 422
    condition: "SUBMIT was attempted after the exception's reporting_due_date"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "a uniqueness constraint was violated: Institution.cert_id, BrokerAgreement.agreement_ref within a broker, CallReportFiling.report_period within an institution, or NationalRateCap (tenor_bucket, effective_date)"
  - id: ERR_THRESHOLD_ORDER_INVALID
    http: 422
    condition: "warning and breach thresholds are not strictly increasing, the three contingency stage triggers are not strictly increasing, or any threshold exceeds 10000 bps"
  - id: ERR_PASS_THROUGH_TITLING_INVALID
    http: 422
    condition: "pass_through_insurance was claimed without FBO_SUBACCOUNTS titling or without a counterparty, or a RECIPROCAL_NETWORK claim carries reciprocal_arrangement_cents == 0"
  - id: ERR_EXCEPTION_INPUTS_INCOHERENT
    http: 422
    condition: "the declared exception basis is contradicted by its own inputs: a zero denominator, or a numerator larger than its denominator"
  - id: ERR_EXCEPTION_NOT_RELIABLE
    http: 422
    condition: "the relied exception's status is not ACKNOWLEDGED or GRANTED"
  - id: ERR_EXCEPTION_COUNTERPARTY_MISMATCH
    http: 422
    condition: "the relied exception was filed by a different broker or for a different institution than the program being classified"
  - id: ERR_AGREEMENT_BROKER_MISMATCH
    http: 422
    condition: "agreement_id names an agreement belonging to a broker other than the program's broker_id, or is supplied for a program with no broker"
  - id: ERR_ROLLOVER_SOURCE_INVALID
    http: 422
    condition: "rolled_from_placement_id names a placement of another program, a placement whose funding_status is not MATURED, or one already rolled"
  - id: ERR_RECIPROCAL_CAP_EXCEEDED
    http: 422
    condition: "the placement principal exceeds the institution's remaining reciprocal pass-through capacity of 25% of total liabilities"
  - id: ERR_MATURITY_WINDOW_CONCENTRATION
    http: 422
    condition: "the aggregate wholesale principal maturing in the closed +/-15 day window around the candidate's maturity_date reaches 35% of total deposits"
  - id: ERR_CONCENTRATION_BREACH
    http: 422
    condition: "activating this placement would push the concentration metric for its class to or past that metric's breach_threshold_bps"
  - id: ERR_BUFFER_SHORTFALL_UNFUNDED
    http: 422
    condition: "DEACTIVATE was requested while the plan's buffer_shortfall_cents is greater than zero"

# =============================================================================
# 1.7  RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties. The two review chains are additionally
# guarded at 1.4 priority 26 on X-User-ID, so holding the right role is
# necessary but never sufficient: the same operator may not both prepare and
# approve the same artefact.
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator. Seeds reference data, publishes the national rate benchmark, drives the logical clock and the maturity sweep, and may perform any business operation for setup purposes. Still bound by every segregation-of-duties check, because those compare X-User-ID and not role."
    identity: opaque
    exclusive_operations: [set logical clock, publish national rate cap, register institution, run maturity sweep]
    shared_operations: [register broker, file broker agreement, drive diligence actions, file primary purpose exception, drive filing and review actions, open deposit program, drive program state actions, create deposit classification, book deposit placement, drive funding actions, record rate cap check, set concentration limit, draft contingency plan, drive plan lifecycle actions, open call report filing, drive filing workflow actions, adjust institution balances, change capital category, read every resource]

  - name: FundingDeskOfficer
    description: "Bank funding desk. Originates the wholesale funding book: registers counterparties, files agreements for diligence, opens programs, books placements, activates and withdraws deposits, and prepares call report filings. Cannot classify a deposit, cannot approve its own agreement and cannot attest a filing it prepared."
    identity: opaque
    exclusive_operations: [open deposit program, book deposit placement, drive funding actions, file primary purpose exception, drive exception filing actions, open call report filing]
    shared_operations: [register broker, file broker agreement, start diligence, drive program state actions, read every resource]

  - name: ComplianceReviewer
    description: "Second line of defence. Owns the classification determination, the diligence approval decision, the exception review decision and the rate-cap review. Cannot originate a program or a placement and cannot publish the rate benchmark."
    identity: opaque
    exclusive_operations: [create deposit classification, record rate cap check, drive exception review actions, approve or reject broker agreement]
    shared_operations: [drive diligence actions, drive program state actions, drive plan lifecycle actions, drive filing workflow actions, read every resource]

  - name: TreasuryController
    description: "Asset-liability management. Owns the board concentration limits, the contingency funding plan and the institution's non-derived balance baselines. Has no authority over classification, diligence or the deposit book itself."
    identity: opaque
    exclusive_operations: [set concentration limit, draft contingency plan, adjust institution balances]
    shared_operations: [drive plan lifecycle actions, read wholesale funding summary, read every resource]

  - name: Examiner
    description: "Supervisory authority. Re-categorises capital, opens and closes examiner review of a filed call report, may revoke a granted exception, and may record an independent rate-cap check. Never originates or funds anything."
    identity: opaque
    exclusive_operations: [change capital category, open examiner review, require amendment, accept filing]
    shared_operations: [record rate cap check, drive exception review actions, read wholesale funding summary, read every resource]

  - name: BrokerRepresentative
    description: "External deposit broker or listing service. X-User-ID is the id of a Broker row. Read-only and scoped: may read its own Broker row, its own agreements and its own fee summary, and nothing else. Any request whose addressed resource resolves to a different Broker.id is refused."
    identity: "entity_backed:Broker"
    exclusive_operations: []
    shared_operations: [read own broker record, read own agreements, read own fee summary]
