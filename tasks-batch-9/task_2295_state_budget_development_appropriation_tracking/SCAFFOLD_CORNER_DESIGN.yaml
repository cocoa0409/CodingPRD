          - entities.Allotment.fields.computed_release_cents
          - entities.Allotment.fields.binding_constraint
        distinguishing_aspect: |
          The satisfaction case for the most heavily guarded transition in the domain: with
          authority ENACTED, cash not FROZEN, release_hold false, phase EXECUTION, quarter 1
          open and the request at exactly the quarter cap, prepare returns 200 and writes
          computed_release_cents 440000000 with binding_constraint REQUEST — the request ties
          the cap, and REQUEST outranks QUARTER_CAP in the declared precedence list.
