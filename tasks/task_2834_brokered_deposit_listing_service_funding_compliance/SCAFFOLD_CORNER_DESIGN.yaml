              as: TreasuryController
              as_user_id: "op_alm"
              captures: { plan_ok_id: $.data.id }
          assert:
            - "${e1} == ERR_THRESHOLD_ORDER_INVALID with HTTP 422 - warning 3000 is above breach 2000"
            - "${e2} == ERR_THRESHOLD_ORDER_INVALID with HTTP 422 - equality fails a strict ordering"
            - "${e3} == ERR_THRESHOLD_ORDER_INVALID with HTTP 422 - stage_2 must exceed stage_1"
            - "fourth trigger: HTTP 201 with ConcentrationLimit.${lim_ok_id}.status == ACTIVE, current_value_bps == 0 and breach_state == WITHIN (one basis point of separation is enough)"
            - "fifth trigger: HTTP 201 with LiquidityContingencyPlan.${plan_ok_id}.status == DRAFT, activation_stage == NONE and stage_3_trigger_bps == 10000 accepted at the inclusive upper bound"
            - "GET /institutions/${inst_id}/concentration-limits returns total_count == 1 - none of the rejected requests persisted a row"

