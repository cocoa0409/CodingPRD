          trigger:
            - call: "POST /rental-lines"
              payload: { contract_id: "${contract_id}", unit_id: "${unit_id}", requested_start_date: "2026-08-10", requested_end_date: "2026-08-15", required_working_height_ft: 26, expected_contract_version: "${cv}" }
              as: RentalCoordinator
