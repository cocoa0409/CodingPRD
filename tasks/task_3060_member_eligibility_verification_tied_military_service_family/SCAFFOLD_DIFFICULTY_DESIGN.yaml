              payload: { branch: "ARMY", component: "ACTIVE_DUTY", rank_grade: "E-8", service_start_date: "1998-01-01", service_end_date: "2018-01-01", discharge_characterization: "HONORABLE" }
              as: EligibilityApplicant
              captures: { sr_g: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_g}/evidence"
              payload: { doc_type: "DD214", issuing_authority: "NPRC", issued_on: "2018-02-01", covers_service_record_id: "${sr_g}", content_hash: "i8" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_g}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_g}/record-reconstruction"
              payload: { decision: "APPROVE", decision_note: "verified" }
              as: VerificationOfficer
              as_user_id: "officer-A"
            - call: "POST /membership/eligibility-cases/${case_g}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { ms: $.data.member_id, ms_v: $.data.version }
            - call: "POST /membership/product-offerings"
              payload: { product_code: "INV_BROKER", product_line: "INVESTMENT", product_name: "Brokerage", allowed_categories: ["VETERAN_HONORABLE"] }
              as: ProductAdministrator
              captures: { off_inv: $.data.id }
            - call: "POST /membership/members/${ms}/entitlements"
              payload: { product_offering_id: "${off_inv}", exposure_cents: 500000 }
              as: Member
              as_user_id: "${ms}"
              captures: { ent_s: $.data.id }
            - call: "POST /membership/households"
              payload: { household_name: "Ground Family", primary_member_id: "${ms}" }
              as: Member
              as_user_id: "${ms}"
              captures: { hh1: $.data.id }
            - call: "POST /membership/eligibility-cases"
              payload: { applicant_legal_name: "Kid Ground", applicant_dob: "2005-01-01", basis_type: "FAMILY_DERIVATION", sponsor_member_id: "${ms}", claimed_relationship: "CHILD" }
              as: EligibilityApplicant
              captures: { case_k: $.data.id }
            - call: "POST /membership/eligibility-cases/${case_k}/evidence"
              payload: { doc_type: "BIRTH_CERTIFICATE", issuing_authority: "TX VR", issued_on: "2005-02-01", content_hash: "j9" }
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_k}/submit"
              payload: {}
              as: EligibilityApplicant
            - call: "POST /membership/eligibility-cases/${case_k}/decide"
              payload: { decision: "APPROVE" }
              as: VerificationOfficer
              as_user_id: "officer-B"
              captures: { mc: $.data.member_id }
            - call: "POST /membership/members/${ms}/eligibility-loss"
              payload: { loss_type: "DOCUMENTATION_REVOKED" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          trigger:
            - call: "POST /membership/members/${ms}/eligibility-loss"
              payload: { loss_type: "FRAUD_CONFIRMED", loss_note: "forged DD-214 confirmed" }
              as: VerificationOfficer
              as_user_id: "officer-A"
          assert:
            - "Member.${ms}.status == REVOKED (hop 1)"
            - "ProductEntitlement.${ent_s}.status == CLOSED with closure_reason == MEMBER_LOSS (hop 2, fired by revocation — grandfathering ends)"
            - "Member.${mc}.status == SUSPENDED (descendant cascade, one generation)"
            - "Household.${hh1}.aggregate_product_count recomputed after hop 2 and equals the sum over remaining linked ACTIVE/SUSPENDED members' available_facet_count (hop 3)"

      - name: survivor_grant_entitlement_transfer_household_rekey_cascade
        grounds:
          - state_machines.SurvivorSupportCase.OPEN_to_GRANTED
          - state_machines.ProductEntitlement.OPEN_to_CLOSED
          - calculations.survivor_continuance
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST .../survivor-cases/
          {id}/grant): the grant (hop 1) re-keys the deceased member's
          GRANDFATHERED entitlements to the beneficiary and closes the rest
          (hop 2, caused by the grant), and the beneficiary's household_id
          re-key forces aggregate recompute on BOTH the old and the new
          household (hop 3, caused by hop 2's re-key). Different originating
          transition than the revocation cascade.
        test_recipe:
          setup:
            - "Deceased member D (was ACTIVE, had a GRANDFATHERED entitlement from a prior DOCUMENTATION_REVOKED + reinstate? No — pinned: D suspended with grandfathered entitlement E, reinstated, then deceased while ACTIVE)."
