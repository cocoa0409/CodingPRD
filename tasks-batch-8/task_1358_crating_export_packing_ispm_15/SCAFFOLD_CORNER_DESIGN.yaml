            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/packing-list", payload: { lines: [ { crate_id: "${crate_id}", description: "CNC spindle", qty: 1, net_weight_kg: 40.0, gross_weight_kg: 140.8 } ] }, as: SalesRep, captures: { pl_id: $.data.id, tg1: $.data.total_gross_weight_kg } }
          trigger:
