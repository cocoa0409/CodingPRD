          assert:
            - "the first trigger returns status 422 with error_id ERR_TAXPAYER_UNDER_CRIMINAL_INVESTIGATION"
            - "before the second trigger Taxpayer.${tp_id}.open_case_count == 1 and compliance_behavior_score == 80"
