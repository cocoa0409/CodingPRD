          - endpoints[GET /buyers/{id}/programs]
        distinguishing_aspect: |
          Filters that match nothing - a status no row currently holds and a supplier_id that names
          no row at all - must return HTTP 200 with an empty data array and meta.total_count 0, not
          a 404 and not a 400. The same request with a matching status proves the filter is really
          being applied rather than ignored.
