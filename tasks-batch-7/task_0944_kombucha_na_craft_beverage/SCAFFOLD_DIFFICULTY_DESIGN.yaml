# =============================================================================
# Task 0944 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: projected_and_measured_abv_land_on_opposite_sides_of_the_boundary
        grounds:
          - calculations.batch_abv_estimate
          - calculations.abv_class_boundary
          - entities.Batch.fields.projected_abv_class
          - entities.FinishedLot.fields.abv_class
          - state_machines.Batch.advance_to_f2
          - state_machines.PackagingRun.complete_run
        distinguishing_aspect: |
          The dual variant lives on the Batch/FinishedLot ABV domain: the
          forward-looking projected variant returns 0.49 (NON_ALCOHOLIC) while
          the measured variant on the very same liquid returns 0.53
          (ALCOHOLIC), so the two valid algorithms disagree on both the number
          and the regulatory class.
        test_recipe:
          setup:
            - "Clock at 2026-05-10. One ALCOHOLIC-intent recipe with planned_f2_days 3 and 4 g/L priming sugar."
            - "One batch pitched 2026-05-01 into a sanitised 500 L vessel, walked to READY_TO_PACKAGE with a CONFORMING QA log whose last F1 reading carries abv_pct 0.26, giving projected_abv_pct 0.49."
            - "An APPROVED ALCOHOLIC label revision and a BOTTLE packaging run holding a single 100 L draw."
            - "A PACKAGING QaReading on the batch carrying abv_pct 0.53."
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "Hopped Jun", style: "JUN", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "ALCOHOLIC", f2_added_sugar_g_per_l: 4, pasteurization_required: false }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
            - call: "POST /scoby-cultures"
              payload: { label: "Mother A" }
              as: ProductionOperator
              captures: { sc_id: $.data.id }
            - call: "POST /vessels"
              payload: { code: "FV-1", capacity_liters: 500.0 }
              as: ProductionOperator
              captures: { v_id: $.data.id }
            - call: "POST /vessels/${v_id}/cip-start"
              payload: {}
              as: ProductionOperator
            - call: "POST /vessels/${v_id}/cip-complete"
              payload: {}
              as: ProductionOperator
            - call: "POST /batches"
              payload: { batch_code: "B-1001", recipe_id: "${rec_id}", scoby_culture_id: "${sc_id}", vessel_id: "${v_id}", pitched_liters: 400.0, planned_f2_days: 3, f2_added_sugar_g_per_l: 4 }
              as: ProductionOperator
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-07T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /batches/${b_id}/qa-readings"
              payload: { reading_type: "F1", reading_at: "2026-05-03T00:00:00.000Z", ph: 3.80, temperature_c: 24.0, brix: 6.0, abv_pct: 0.10 }
              as: ProductionOperator
            - call: "POST /batches/${b_id}/qa-readings"
              payload: { reading_type: "F1", reading_at: "2026-05-05T00:00:00.000Z", ph: 3.55, temperature_c: 24.0, brix: 5.0, abv_pct: 0.18 }
              as: ProductionOperator
            - call: "POST /batches/${b_id}/qa-readings"
              payload: { reading_type: "F1", reading_at: "2026-05-06T00:00:00.000Z", ph: 3.40, temperature_c: 24.0, brix: 4.5, abv_pct: 0.26 }
              as: ProductionOperator
            - call: "POST /batches/${b_id}/advance-to-f2"
              payload: {}
              as: ProductionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /batches/${b_id}/qa-readings"
              payload: { reading_type: "F2", reading_at: "2026-05-08T00:00:00.000Z", ph: 3.30, temperature_c: 22.0, brix: 3.5, abv_pct: 0.40 }
              as: ProductionOperator
            - call: "POST /batches/${b_id}/complete-f2"
              payload: {}
              as: ProductionOperator
            - call: "POST /label-approvals"
              payload: { recipe_id: "${rec_id}", abv_class: "ALCOHOLIC", pasteurized: false, declared_elements: ["PRODUCT_NAME", "NET_CONTENTS", "INGREDIENTS", "PRODUCER_ADDRESS", "LOT_CODE", "BEST_BY", "ALCOHOL_CONTENT_STATEMENT", "GOVERNMENT_WARNING", "AGE_RESTRICTED", "KEEP_REFRIGERATED", "LIVE_CULTURES"] }
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { la_id: $.data.id }
            - call: "POST /label-approvals/${la_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-alice"
            - call: "POST /label-approvals/${la_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-bob"
            - call: "POST /packaging-runs"
              payload: { run_code: "PR-1", recipe_id: "${rec_id}", label_approval_id: "${la_id}", format: "BOTTLE", pasteurized: false, max_units_requested: 300 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { run_id: $.data.id }
            - call: "GET /batches/${b_id}"
              payload: {}
              as: ProductionOperator
              captures: { b_v: $.data.version, proj: $.data.projected_abv_pct }
            - call: "POST /packaging-runs/${run_id}/sources"
              payload: { batch_id: "${b_id}", liters_drawn: 400.0, expected_batch_version: "${b_v}" }
              as: ProductionOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /batches/${b_id}/qa-readings"
              payload: { reading_type: "PACKAGING", reading_at: "2026-05-10T00:00:00.000Z", ph: 3.25, temperature_c: 20.0, brix: 3.0, abv_pct: 0.53 }
              as: ProductionOperator
            - call: "POST /packaging-runs/${run_id}/start"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: {}
              as: ProductionOperator
              captures: { lot_id: $.data.finished_lot_id }
          assert:
            - "Batch.${b_id}.projected_abv_pct == 0.49"
            - "Batch.${b_id}.projected_abv_class == NON_ALCOHOLIC"
            - "Batch.${b_id}.packaging_abv_pct == 0.53"
            - "FinishedLot.${lot_id}.measured_abv_pct == 0.53"
            - "FinishedLot.${lot_id}.abv_class == ALCOHOLIC"
            - "FinishedLot.${lot_id}.status == HELD"
            - "FinishedLot.${lot_id}.units_produced == 300"
            - "PackagingRun.${run_id}.status == COMPLETED"
            - "PackagingRun.${run_id}.net_liters == 388.0"
            - "Batch.${b_id}.remaining_liters == 0.0"
            - "Batch.${b_id}.ferment_stage == PACKAGED"

      - name: raw_and_pasteurized_runs_from_one_batch_get_different_best_by_dates
        grounds:
          - calculations.lot_best_by_date
          - entities.FinishedLot.fields.best_by_date
