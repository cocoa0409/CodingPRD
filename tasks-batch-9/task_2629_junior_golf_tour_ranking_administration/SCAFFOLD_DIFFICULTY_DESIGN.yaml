        distinguishing_aspect: |
          CYCLIC + bounded loop - SUBMITTED and DISPUTED form a re-entrant cycle, but the third
          dispute does not return to SUBMITTED: it exits the cycle into the terminal NO_CARD state.
          A naive implementation that treats DISPUTE as an unconditional edge back to SUBMITTED
          leaves the round re-submittable forever; one that treats DISPUTE as terminal on the first
          hop never reaches the third card. Only the count-guarded cycle produces
