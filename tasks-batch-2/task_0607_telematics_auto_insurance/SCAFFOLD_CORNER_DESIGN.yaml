              as: ClaimsAdjuster
            - call: "POST /claims/${c_id}/close"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /claims/${c_id}"
              payload: {}
              as: ClaimsAdjuster
              captures: { v2: $.data.version }
            - call: "POST /claims/${c_id}/reopen"
