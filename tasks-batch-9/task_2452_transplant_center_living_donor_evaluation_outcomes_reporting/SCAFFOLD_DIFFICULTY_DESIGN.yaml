          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
