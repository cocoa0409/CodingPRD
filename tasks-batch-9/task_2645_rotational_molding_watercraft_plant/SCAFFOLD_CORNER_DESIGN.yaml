      - name: calc_constraint_propagation_store_freezes_site_then_release_restores_it
        claim_type: constraint_propagation
        grounds:
          - calculations.storage_footprint
          - calculations.warehouse_footprint_posture
          - endpoints.GET_/warehouses/{warehouse_id}/footprint-summary
        distinguishing_aspect: "Storing one hull that exactly fills WH-CVJ drives utilization_pct to 100.00 and the posture to FROZEN, which propagates to a second order (READY_TO_SCHEDULE -> BLOCKED_WAREHOUSE) but not to the COMPLETE order that produced the hull; the propagation then stops — two consecutive footprint-summary reads are identical — and release-storage runs it backwards."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Warehouse WH-CVJ has footprint_capacity_cube_m3 10.0000 in a single zone Z-J of capacity 10.0000, with the default 85.00 / 95.00 thresholds."
            - "ProductModel PM-CVJ has gross_cube_m3 10.0000 and nest_factor 0.5000, so one anchored hull fills the site exactly and a nested sibling would still need 5.0000 more."
            - "ProductionOrder PO-CVJ-A for 2 units is COMPLETE: its single two-cavity cycle produced two hulls and both inspected PASS. ProductionOrder PO-CVJ-B for 1 unit is RELEASED and sitting in READY_TO_SCHEDULE against the same site."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - call: "POST /product-models"
              payload: { model_code: "PM-CVJ", hull_type: "CANOE", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 10.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 10.0000, nest_factor: 0.5000, unit_weight_kg: 15.000, msrp_cents: 150000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CVJ-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 20.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-CVJ", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
