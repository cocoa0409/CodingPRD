  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: transfer_window_open_interval_overlap_on_funding_timeline
        grounds:
          - calculations.compute_tap_charge
          - entities.FareProduct.fields.transfer_window_minutes
          - state_machines.Tap.PENDING_to_CAPTURED
        distinguishing_aspect: |
          Interval semantics #1 — a forward half-open buffer window [prior.tapped_at, prior.tapped_at + 120m]
          on the rider's tap timeline: a later tap falling INSIDE the buffer collides as a transfer (discount
          applied); the geometry is an anchored sliding buffer measured from the prior CHARGED tap.
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00:00Z."
            - "FareProduct ZONE_Z base 300, daily 5000, weekly 5000, transfer_window_minutes 120, transfer_discount_pct 1.0."
            - "Rider R14; FundingSource F14 loaded 100000; OPEN FareWeek W1; CAPTURED tap T1 at 08:00 charged 300."
            - "Tap T2 PENDING at 09:00 (60 min after T1, inside the buffer)."
          setup_api_calls:
            - call: "POST /fare-products"
              payload: { zone_code: "ZONE_Z", base_fare_cents: 300, daily_cap_cents: 5000, weekly_cap_cents: 5000, transfer_window_minutes: 120, transfer_discount_pct: 1.0 }
              as: FareAdmin
              captures: { prod_z: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: FareAdmin
            - call: "POST /riders"
