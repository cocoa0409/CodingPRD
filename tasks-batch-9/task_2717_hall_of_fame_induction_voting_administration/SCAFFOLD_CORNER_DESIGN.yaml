      - name: cyclic_shape_loop_is_bounded
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Candidacy.SCREENING_to_INFO_REQUESTED
          - state_machines.Candidacy.INFO_REQUESTED_to_SCREENING
        excluded_because:
          difficulty_instance: candidacy_info_request_revision_cycle_bounded
          rationale: |
            The cyclic-shape corner (entity loops back; the termination condition is respected) is
            exactly what the §1.8 instance walks: it drives the SCREENING -> INFO_REQUESTED ->
            SCREENING loop twice, asserts info_request_count 2, and shows the third REQUEST_INFO
            rejected with ERR_INFO_REQUEST_LIMIT at MAX_INFO_REQUESTS. A §1.9 restatement would add
            no new state coverage. The Ballot audit loop PENDING_AUDIT -> AUDIT_REJECTED ->
            PENDING_AUDIT is likewise covered by ballot_parallel_dimensions_with_audit_rejection_cycle.

      - name: ledger_sync_ceremony_counters_reconcile_after_certification
        claim_type: ledger_sync
        grounds:
          - state_machines.InductionCycle.BALLOTING_to_CERTIFIED
          - entities.InductionCycle.fields.induction_count
          - entities.InductionCycle.fields.ceremony_ready_count
        excluded_because:
          difficulty_instance: certify_election_three_hop_induction_cascade
          rationale: |
            The ledger-sync corner (a state change updates an ancestor's derived field, reconciled
            before/after) is the substance of the §1.8 three-hop cascade instance: it asserts
            Candidate.hof_status, the created Induction, and InductionCycle.induction_count /
            ceremony_ready_count as re-derived by the certification, with the pre-certification
            values read first. Repeating it in §1.9 would duplicate the same assertions.

      - name: compensation_undo_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.TravelGrant.APPROVED_to_CANCELLED
          - state_machines.ExhibitInstallation.INSTALLED_to_WITHDRAWN
          - entities.InductionCycle.fields.travel_committed_cents
          - entities.ExhibitCase.fields.artifacts_installed
        excluded_because:
          difficulty_instance: travel_commitment_restored_exactly_on_grant_cancellation
          rationale: |
            The compensation corner (undo transition reverses all original side effects with no
            drift) is covered twice in §1.8: travel_commitment_restored_exactly_on_grant_cancellation
            reconciles travel_committed_cents, austerity_tier and ceremony_ready_count to their
            pre-approval values, and exhibit_case_occupancy_restored_exactly_on_withdrawal does the
            same for ExhibitCase.artifacts_installed. §1.9 only adds the conditional half of the
            exhibit cascade, which is covered by
            withdrawing_one_of_two_installations_keeps_exhibit_status_installed above.

