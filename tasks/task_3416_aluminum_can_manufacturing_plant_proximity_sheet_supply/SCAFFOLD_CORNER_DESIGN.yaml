        distinguishing_aspect: "A request without a valid X-User-Role header is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or state logic runs."
        test_recipe:
          setup:
            - "Logical clock default. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /plants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "when the X-User-Role / X-User-ID headers are absent the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "the 401 fires even though the path id would otherwise be a 404"

