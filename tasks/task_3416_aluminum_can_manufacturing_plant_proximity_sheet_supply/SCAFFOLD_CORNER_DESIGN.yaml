        claim_type: role_denial
        grounds:
          - roles.CustomerPlanner
          - validations.priority_2_auth
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Entity-backed identity: CustomerPlanner with X-User-ID of customer A signing customer B's agreement is 403 ERR_UNAUTHORIZED (ownership scope), even though the role is correct for the endpoint."
        test_recipe:
