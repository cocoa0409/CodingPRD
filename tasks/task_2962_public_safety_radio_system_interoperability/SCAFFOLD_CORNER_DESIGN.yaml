          trigger:
            - call: "POST /radio-system/talkpath-requests"
              payload: { site_id: "${site_imc_id}", talkgroup_id: "${tg_imc_id}", unit_id: "${unit_imc_id}", request_kind: "NORMAL" }
              as: Dispatcher
              as_user_id: "${agency_imc_id}"
              captures: { tp_imc_id: "$.data.id" }
            - call: "GET /radio-system/sites/${site_imc_id}"
              payload: {}
              as: RFEngineer
              as_user_id: "rf-1"
            - call: "POST /radio-system/talkpath-requests/${tp_imc_id}/release"
              payload: {}
              as: Dispatcher
              as_user_id: "${agency_imc_id}"
            - call: "GET /radio-system/sites/${site_imc_id}"
              payload: {}
              as: RFEngineer
              as_user_id: "rf-1"
          assert:
            - "trigger[0] returns HTTP 201 with data.outcome == GRANTED, available_talkpaths_at_decision == 3, reserve_talkpaths_at_decision == 0, granted_at == \"2026-08-01T00:00:00Z\", released_at == null"
            - "trigger[1] returns busy_talkpaths == 1, peak_talkpaths == 1, granted_request_count == 1, busied_request_count == 0, grade_of_service_pct == 100.0"
            - "trigger[2] returns HTTP 200 with outcome == RELEASED, released_at == \"2026-08-01T00:00:00Z\" and hold_seconds == 0"
            - "trigger[3] returns busy_talkpaths == 0, peak_talkpaths == 1 (monotonic), granted_request_count == 1, grade_of_service_pct == 100.0"
            - "No read is retried or delayed anywhere in the recipe: each assertion holds on the first response after the write"
