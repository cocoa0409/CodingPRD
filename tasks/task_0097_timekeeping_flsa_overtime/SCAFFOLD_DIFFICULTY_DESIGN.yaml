# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Timekeeping & FLSA Overtime. Grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# 9 rule_ids × 2 instances = 18 instances.
# Common setup convention: a CA worksite has daily_ot_enabled=true,
# daily_dt_threshold_hours=12, seventh_day_rule_enabled=true, both break premiums
# enabled; a TX worksite has daily_ot_enabled=false (pure FLSA weekly).
# Employer.workweek_start_dow default MON; workweeks below start 2026-06-01 (a Monday).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ot_method_diverges_ca_daily_vs_flsa_weekly
        grounds:
          - calculations.weekly_overtime_resolution
          - calculations.daily_overtime_breakdown
          - entities.TimesheetWeek.fields.ot_minutes
          - entities.TimesheetWeek.fields.dt_minutes
        distinguishing_aspect: |
          A single 14h workday produces ot=240/dt=120 min under the CA daily method
          (worksite daily_ot_enabled) but ot=0/dt=0 under the FLSA weekly method
          (TX worksite, 14h < 40 weekly) — same hours, two algorithms, different OT/DT.
        test_recipe:
          setup:
            - "Employer with default MON workweek; CA WageRuleSet (daily_ot_enabled) and TX WageRuleSet (weekly only)."
            - "Two NON_EXEMPT employees, base 2000 cents, one at a CA worksite, one at a TX worksite."
            - "Each works exactly one 14.0h punch on 2026-06-01; each has a DRAFT timesheet week for 2026-06-01."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme", workweek_start_dow: "MON" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true, daily_ot_threshold_hours: 8, daily_dt_threshold_hours: 12, weekly_ot_threshold_hours: 40, seventh_day_rule_enabled: true, meal_break_premium_enabled: true, rest_break_premium_enabled: true, state_min_wage_cents: 1600 }
              as: PayrollAdmin
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "TX", daily_ot_enabled: false, weekly_ot_threshold_hours: 40 }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "TX site", state_code: "TX" }
              as: PayrollAdmin
              captures: { ws_tx: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy CA", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_tx}", full_name: "Tom TX", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_tx: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T22:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T22:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /shifts"
              payload: { employee_id: "${e_tx}", worksite_id: "${ws_tx}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T22:00:00Z" }
              as: Supervisor
              captures: { sh_tx: $.data.id }
            - call: "POST /shifts/${sh_tx}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_tx}"
              captures: { p_tx: $.data.id }
            - call: "POST /punches/${p_tx}/close"
              payload: { clock_out: "2026-06-01T22:00:00Z" }
              as: Employee
              as_user_id: "${e_tx}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw_ca: $.data.id }
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_tx}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw_tx: $.data.id }
          trigger:
            - call: "POST /timesheet-weeks/${tw_ca}/submit"
              payload: {}
              as: Supervisor
              captures: { ca_ot: $.data.ot_minutes, ca_dt: $.data.dt_minutes }
            - call: "POST /timesheet-weeks/${tw_tx}/submit"
              payload: {}
              as: Supervisor
              captures: { tx_ot: $.data.ot_minutes, tx_dt: $.data.dt_minutes }
          assert:
            - "TimesheetWeek.${tw_ca}.regular_minutes == 480"
            - "TimesheetWeek.${tw_ca}.ot_minutes == 240"
            - "TimesheetWeek.${tw_ca}.dt_minutes == 120"
            - "TimesheetWeek.${tw_tx}.regular_minutes == 840"
            - "TimesheetWeek.${tw_tx}.ot_minutes == 0"
            - "TimesheetWeek.${tw_tx}.dt_minutes == 0"

      - name: gross_diverges_exempt_vs_nonexempt
        grounds:
          - calculations.gross_wages
          - entities.Employee.fields.classification
          - entities.TimesheetWeek.fields.gross_wages_cents
        distinguishing_aspect: |
          Two employees with identical 14h CA punches: the NON_EXEMPT one yields
          gross_wages_cents=36000 (full OT/DT stack); the EXEMPT one yields 0
          (exempt_zeroed variant forces all hourly fields to 0). Subject differs
          from instance 1: this varies on the Employee.classification domain, not the
          week's OT algorithm.
        test_recipe:
          setup:
            - "CA WageRuleSet + worksite; one NON_EXEMPT and one EXEMPT employee, base 2000."
            - "Each works one 14.0h punch on 2026-06-01 with a DRAFT week."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true, daily_dt_threshold_hours: 12 }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Nora NE", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ne: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Xena EX", classification: "EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ex: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ne}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T22:00:00Z" }
              as: Supervisor
              captures: { sh_ne: $.data.id }
            - call: "POST /shifts/${sh_ne}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ne}"
              captures: { p_ne: $.data.id }
            - call: "POST /punches/${p_ne}/close"
              payload: { clock_out: "2026-06-01T22:00:00Z" }
              as: Employee
              as_user_id: "${e_ne}"
            - call: "POST /shifts"
              payload: { employee_id: "${e_ex}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T22:00:00Z" }
              as: Supervisor
              captures: { sh_ex: $.data.id }
            - call: "POST /shifts/${sh_ex}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ex}"
              captures: { p_ex: $.data.id }
            - call: "POST /punches/${p_ex}/close"
              payload: { clock_out: "2026-06-01T22:00:00Z" }
              as: Employee
              as_user_id: "${e_ex}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ne}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw_ne: $.data.id }
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ex}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw_ex: $.data.id }
          trigger:
            - call: "POST /timesheet-weeks/${tw_ne}/submit"
              payload: {}
              as: Supervisor
            - call: "POST /timesheet-weeks/${tw_ex}/submit"
              payload: {}
              as: Supervisor
          assert:
            - "TimesheetWeek.${tw_ne}.gross_wages_cents == 36000"
            - "TimesheetWeek.${tw_ex}.gross_wages_cents == 0"
            - "TimesheetWeek.${tw_ex}.ot_minutes == 0"
            - "TimesheetWeek.${tw_ex}.dt_minutes == 0"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: regular_rate_half_time_premium_nonlinear
        grounds:
          - calculations.regular_rate_of_pay
          - calculations.weekly_overtime_resolution
          - calculations.gross_wages
          - entities.TimesheetWeek.fields.gross_wages_cents
        distinguishing_aspect: |
          MODE (a): gross stacks 3 interacting inputs — straight pay on all hours,
          a 0.5x half-time OT premium valued on the derived regular_rate, and a 1.0x DT
          premium — with branch selection by daily vs weekly thresholds. A 14h CA day at
          base 2000 yields straight 28000 + ot_premium 4000 + dt_premium 4000 = 36000,
          which a flat 'reg+1.5*ot+2*dt' shortcut would only coincidentally match.
        test_recipe:
          setup:
            - "CA WageRuleSet+worksite; NON_EXEMPT employee base 2000; one 14h punch on 2026-06-01; DRAFT week."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true, daily_dt_threshold_hours: 12 }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T22:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T22:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw_ca: $.data.id }
          trigger:
            - call: "POST /timesheet-weeks/${tw_ca}/submit"
              payload: {}
              as: Supervisor
          assert:
            - "TimesheetWeek.${tw_ca}.gross_wages_cents == 36000"
            - "TimesheetWeek.${tw_ca}.regular_minutes == 480"
            - "TimesheetWeek.${tw_ca}.ot_minutes == 240"
            - "TimesheetWeek.${tw_ca}.dt_minutes == 120"

      - name: tip_pool_round_then_waterfall_order
        grounds:
          - calculations.tip_pool_allocation
          - entities.TipPool.fields.pooled_cents
          - entities.TipPool.fields.distributed_cents
          - state_machines.TipPool.OPEN_to_DISTRIBUTED
        distinguishing_aspect: |
          MODE (b): floor-then-distribute-remainder rounding order is pinned. Pool of
          10000 cents split by worked-minutes weights [600,600,420] floors to
          [3703,3703,2592]=9998, leaving a 2-cent remainder distributed by weight DESC
          then created_at ASC — A and B (earlier-created, equal weight) each get +1,
          yielding A=3704,B=3704,C=2592 summing to exactly 10000. A sum-then-round or
          id-ordered remainder would give a different split.
        test_recipe:
          setup:
            - "CA worksite; three NON_EXEMPT employees A,B,C created in that order."
            - "On 2026-06-01: A and B each work 10h (600 min), C works 7h (420 min)."
            - "Each declares tips into one OPEN pool: A 4000, B 3500, C 2500 cents (pool total 10000)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "A", classification: "NON_EXEMPT", base_rate_cents: 1600, is_tipped: true }
              as: PayrollAdmin
              captures: { e_a: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "B", classification: "NON_EXEMPT", base_rate_cents: 1600, is_tipped: true }
              as: PayrollAdmin
              captures: { e_b: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "C", classification: "NON_EXEMPT", base_rate_cents: 1600, is_tipped: true }
              as: PayrollAdmin
              captures: { e_c: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_a}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T18:00:00Z" }
              as: Supervisor
              captures: { sh_a: $.data.id }
            - call: "POST /shifts/${sh_a}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_a}"
              captures: { p_a: $.data.id }
            - call: "POST /punches/${p_a}/close"
              payload: { clock_out: "2026-06-01T18:00:00Z" }
              as: Employee
              as_user_id: "${e_a}"
            - call: "POST /shifts"
              payload: { employee_id: "${e_b}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T18:00:00Z" }
              as: Supervisor
              captures: { sh_b: $.data.id }
            - call: "POST /shifts/${sh_b}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_b}"
              captures: { p_b: $.data.id }
            - call: "POST /punches/${p_b}/close"
              payload: { clock_out: "2026-06-01T18:00:00Z" }
              as: Employee
              as_user_id: "${e_b}"
            - call: "POST /shifts"
              payload: { employee_id: "${e_c}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T15:00:00Z" }
              as: Supervisor
              captures: { sh_c: $.data.id }
            - call: "POST /shifts/${sh_c}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_c}"
              captures: { p_c: $.data.id }
            - call: "POST /punches/${p_c}/close"
              payload: { clock_out: "2026-06-01T15:00:00Z" }
              as: Employee
              as_user_id: "${e_c}"
            - call: "POST /tip-pools"
              payload: { worksite_id: "${ws_ca}", workday_date: "2026-06-01" }
              as: Supervisor
              captures: { pool: $.data.id }
            - call: "POST /tip-declarations"
              payload: { employee_id: "${e_a}", workday_date: "2026-06-01", declared_cents: 4000, pool_id: "${pool}" }
              as: Employee
              as_user_id: "${e_a}"
            - call: "POST /tip-declarations"
              payload: { employee_id: "${e_b}", workday_date: "2026-06-01", declared_cents: 3500, pool_id: "${pool}" }
              as: Employee
              as_user_id: "${e_b}"
            - call: "POST /tip-declarations"
              payload: { employee_id: "${e_c}", workday_date: "2026-06-01", declared_cents: 2500, pool_id: "${pool}" }
              as: Employee
              as_user_id: "${e_c}"
          trigger:
            - call: "POST /tip-pools/${pool}/distribute"
              payload: {}
              as: Supervisor
              captures: { pooled: $.data.pooled_cents, distributed: $.data.distributed_cents }
          assert:
            - "TipPool.${pool}.pooled_cents == 10000"
            - "TipPool.${pool}.distributed_cents == 10000"
            - "TipPool.${pool}.status == DISTRIBUTED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: timesheet_reject_resubmit_cycle
        grounds:
          - state_machines.TimesheetWeek.SUBMITTED_to_REJECTED
          - state_machines.TimesheetWeek.REJECTED_to_SUBMITTED
          - entities.TimesheetWeek.fields.status
        distinguishing_aspect: |
          CYCLE on TimesheetWeek: DRAFT->SUBMITTED->REJECTED->SUBMITTED returns the
          entity to a prior state (SUBMITTED), proving the machine is not a one-way
          pipeline; version increments on every hop.
        test_recipe:
          setup:
            - "CA worksite; NON_EXEMPT employee; one 8h punch on 2026-06-01; week submitted by supervisor sup-1."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /timesheet-weeks/${tw}/reject"
              payload: {}
              as: Supervisor
              as_user_id: "sup-2"
              captures: { rej_status: $.data.status }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { resub_status: $.data.status, resub_version: $.data.version }
          assert:
            - "TimesheetWeek.${tw}.status == SUBMITTED"
            - "TimesheetWeek.${tw}.version == 4"

      - name: payroll_run_branch_finalize_vs_cancel
        grounds:
          - state_machines.PayrollRun.OPEN_to_FINALIZED
          - state_machines.PayrollRun.OPEN_to_CANCELLED
          - entities.PayrollRun.fields.status
          - entities.TimesheetWeek.fields.status
        distinguishing_aspect: |
          BRANCH (fork) on PayrollRun (a different entity from instance 1): from OPEN the
          run forks to FINALIZED (run frozen, weeks stay LOCKED) OR to CANCELLED (weeks
          revert to APPROVED) — divergent side-effect sets per branch. This run takes the
          CANCELLED branch and the locked week reverts to APPROVED.
        test_recipe:
          setup:
            - "CA worksite; NON_EXEMPT employee; an APPROVED week (8h on 2026-06-01) locked into an OPEN payroll run."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
