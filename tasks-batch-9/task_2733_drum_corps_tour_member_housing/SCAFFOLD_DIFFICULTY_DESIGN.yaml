# §1.8 Scaffold Difficulty Design — task_2733_drum_corps_tour_member_housing
# 9 §0.5 rule_ids, 20 instances. Every numeric assertion below was computed by
# executing the §1.3 formulas and their constants as code; no estimates.
# The logical clock starts at 2026-08-01T00:00:00Z, so every fixture date sits
# in the 2027 competitive season and is reachable by moving the clock forward.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_forward_versus_circuit_final_net
        grounds:
          - calculations.show_settlement_payout
          - entities.ShowSettlement.fields.provisional_net_cents
          - entities.ShowSettlement.fields.final_net_cents
          - entities.ShowSettlement.fields.variance_cents
          - state_machines.ShowSettlement.transitions.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          One ShowSettlement row carries both variants of show_settlement_payout on
          identical circuit data (appearance 1200000, pool 800000): provisional_forward
          projects placement 3 and yields provisional_net_cents 1274880, while
          circuit_final certifies placement 2, absorbs a PRIZE_ADJUSTMENT and the
          sanction/rebate replay, and yields final_net_cents 1038778 —
          variance_cents -236102 on the same entity.
        test_recipe:
          setup:
            - "A 2027 season exists with one SHOW tour stop that has been confirmed and completed (clock moved past its depart_at), so settlement_state == PENDING."
            - "No members are ON_TOUR, so required_chaperone_count and required_cook_count are both 0 and the stop confirms with no staffing."
            - "The DRAFT settlement was prepared by BusinessManager user id bm-anna."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "SHOW", venue_name: "Allen Stadium", city: "Allen", state_code: "TX", arrive_at: "2027-06-20T14:00:00Z", depart_at: "2027-06-20T23:30:00Z", show_start_at: "2027-06-20T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 0, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
            - call: "POST /tour-stops/${stop_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-21T00:00:00Z" }
              as: TourManager
            - call: "POST /tour-stops/${stop_id}/complete"
              payload: {}
              as: TourManager
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${stop_id}", appearance_fee_cents: 1200000, prize_pool_cents: 800000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_id: "$.data.id", prov_net: "$.data.provisional_net_cents" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-30T00:00:00Z" }
              as: BusinessManager
            - call: "POST /show-settlements/${settlement_id}/finalize"
              payload: { final_placement: 2, remittance_lines: [{ kind: "PRIZE_ADJUSTMENT", amount_cents: 40000, recorded_at: "2027-06-25T09:00:00Z" }, { kind: "SANCTION_FEE", amount_cents: 250000, recorded_at: "2027-06-26T09:00:00Z" }, { kind: "SANCTION_FEE", amount_cents: 200000, recorded_at: "2027-06-27T09:00:00Z" }, { kind: "FEE_REBATE", amount_cents: 60000, recorded_at: "2027-06-28T09:00:00Z" }] }
              as: BusinessManager
              as_user_id: "bm-brett"
          assert:
            - "ShowSettlement.${settlement_id}.provisional_prize_cents == 128000"
            - "ShowSettlement.${settlement_id}.provisional_gross_cents == 1328000"
            - "ShowSettlement.${settlement_id}.provisional_circuit_fee_cents == 53120"
            - "ShowSettlement.${settlement_id}.provisional_net_cents == 1274880"
            - "ShowSettlement.${settlement_id}.final_prize_cents == 176000"
            - "ShowSettlement.${settlement_id}.final_gross_cents == 1416000"
            - "ShowSettlement.${settlement_id}.final_circuit_fee_cents == 56640"
            - "ShowSettlement.${settlement_id}.sanctions_charged_cents == 377222"
            - "ShowSettlement.${settlement_id}.rebate_applied_cents == 56640"
            - "ShowSettlement.${settlement_id}.final_net_cents == 1038778"
            - "ShowSettlement.${settlement_id}.variance_cents == -236102"
            - "ShowSettlement.${settlement_id}.remittance_line_count == 4"
            - "ShowSettlement.${settlement_id}.provisional_net_cents == 1274880 is unchanged by finalize (the provisional variant is retained, not overwritten)"
            - "ShowSettlement.${settlement_id}.status == FINALIZED and finalized_by_user_id == bm-brett"
            - "TourStop.${stop_id}.settlement_state == SETTLED"
            - "Season.${season_id}.tour_revenue_cents == 1038778"

      - name: withdrawal_prorated_spring_versus_liquidated_ladder_obligation
        grounds:
          - calculations.member_withdrawal_obligation
          - entities.Member.fields.withdrawal_obligation_cents
          - entities.Member.fields.withdrawal_obligation_basis
          - state_machines.Member.transitions.CONTRACTED_to_WITHDRAWN
        distinguishing_aspect: |
          Two members with byte-identical 399900-cent executed contracts diverge purely
          on the variant selector Season.tour_departure_date: withdrawing on 2027-06-11
          selects prorated_spring (32/33 of spring training completed -> 402782 cents)
          while withdrawing one day later on 2027-06-12 selects liquidated_ladder
          (week 0 -> 75% -> 314925 cents), an 87857-cent divergence in the opposite
          direction from what a monotone schedule would produce.
        test_recipe:
          setup:
            - "A 2027 season with spring_training_start_date 2027-05-10 and tour_departure_date 2027-06-12."
            - "Members Avery and Blake both hold EXECUTED 399900-cent EXTENDED_6 contracts, are CONTRACTED, and have paid nothing."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_a_id: "$.data.id" }
            - call: "POST /members/${member_a_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_a_id}", tuition_amount_cents: 399900, payment_plan_type: "EXTENDED_6" }
              as: MembershipCoordinator
              captures: { contract_a_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_a_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_a_id}"
            - call: "POST /member-contracts/${contract_a_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Blake Ferreira", email: "blake@corps.test", date_of_birth: "2004-11-22", section: "PERCUSSION", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_b_id: "$.data.id" }
            - call: "POST /members/${member_b_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 88.0 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_b_id}", tuition_amount_cents: 399900, payment_plan_type: "EXTENDED_6" }
              as: MembershipCoordinator
              captures: { contract_b_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_b_id}/sign"
              payload: { signature_name: "Blake Ferreira" }
              as: Member
              as_user_id: "${member_b_id}"
            - call: "POST /member-contracts/${contract_b_id}/execute"
              payload: {}
              as: CorpsDirector
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-11T12:00:00Z" }
              as: MembershipCoordinator
            - call: "POST /members/${member_a_id}/withdraw"
              payload: { withdrawal_date: "2027-06-11", reason: "family emergency" }
              as: MembershipCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-12T12:00:00Z" }
              as: MembershipCoordinator
            - call: "POST /members/${member_b_id}/withdraw"
              payload: { withdrawal_date: "2027-06-12", reason: "family emergency" }
              as: MembershipCoordinator
          assert:
            - "Member.${member_a_id}.withdrawal_obligation_basis == PRORATED_SPRING"
            - "Member.${member_a_id}.withdrawal_obligation_cents == 402782"
            - "Member.${member_a_id}.tuition_charged_cents == 402782"
            - "Member.${member_a_id}.tuition_balance_cents == 402782"
            - "Member.${member_a_id}.refund_due_cents == 0"
            - "Member.${member_b_id}.withdrawal_obligation_basis == LIQUIDATED_LADDER"
            - "Member.${member_b_id}.withdrawal_obligation_cents == 314925"
            - "Member.${member_b_id}.tuition_charged_cents == 314925"
            - "Member.${member_a_id}.withdrawal_obligation_cents - Member.${member_b_id}.withdrawal_obligation_cents == 87857"
            - "Member.${member_a_id}.membership_status == WITHDRAWN and Member.${member_b_id}.membership_status == WITHDRAWN"
            - "Season.${season_id}.tuition_charged_cents == 717707"

  - rule_id: combinatorial_formula
    instances:
      - name: installment_schedule_whole_principal_surcharge_then_integer_split
        grounds:
          - calculations.installment_schedule
          - entities.PaymentPlan.fields.surcharge_cents
          - entities.PaymentPlan.fields.installment_base_cents
          - entities.PaymentPlan.fields.installment_remainder_cents
          - entities.PaymentPlan.fields.due_amount_cents
        distinguishing_aspect: |
          Mode (b) rounding-order combination: the 2.5% EXTENDED_6 surcharge is rounded
          ONCE against the whole 399900-cent principal (9998) and only then split six
          ways (68316 + a 2-cent remainder on the two earliest installments), giving
          financed_total_cents 409898; rounding per installment first
          (round_half_up(399900/6 * 1.025) * 6) yields 409896 and loses two cents.
        test_recipe:
          setup:
            - "A 2027 season and one member whose 399900-cent EXTENDED_6 contract is EXECUTED, so Member.tuition_charged_cents == 399900."
            - "The clock is still at its 2026-08-01T00:00:00Z default when the plan is created, so no installment is yet due."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 91.5 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "EXTENDED_6" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_version: "$.data.version" }
          trigger:
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-01-15", expected_member_version: "${member_version}" }
              as: BusinessManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-20T00:00:00Z" }
              as: BusinessManager
            - call: "GET /payment-plans/${plan_id}"
              as: BusinessManager
          assert:
            - "PaymentPlan.${plan_id}.plan_type == EXTENDED_6 and installment_count == 6"
            - "PaymentPlan.${plan_id}.principal_cents == 399900"
            - "PaymentPlan.${plan_id}.surcharge_cents == 9998"
            - "PaymentPlan.${plan_id}.financed_total_cents == 409898"
            - "PaymentPlan.${plan_id}.installment_base_cents == 68316"
            - "PaymentPlan.${plan_id}.installment_remainder_cents == 2"
            - "PaymentPlan.${plan_id}.installments_due_count == 2 at clock 2027-02-20 (installments 1 and 2 are due on 2027-01-15 and 2027-02-14)"
            - "PaymentPlan.${plan_id}.due_amount_cents == 136634 (68317 + 68317, the two remainder-bearing installments)"
            - "PaymentPlan.${plan_id}.arrears_cents == 136634"
            - "PaymentPlan.${plan_id}.outstanding_cents == 409898"
            - "PaymentPlan.${plan_id}.status == ACTIVE"

      - name: stop_meal_cost_per_dietary_class_rounding_before_multiplication
        grounds:
          - calculations.stop_meal_cost
          - entities.TourStop.fields.meal_cost_cents
          - entities.Member.fields.dietary_flag
          - state_machines.TourStop.transitions.PLANNED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b) rounding-order combination on a DIFFERENT axis from
          installment_schedule: three ON_TOUR members (NONE, GLUTEN_FREE,
          SEVERE_ALLERGEN) at 1175 base x 3 meals must round the unit cost once per
          dietary class BEFORE multiplying (1175 + 1434 + 1704 = 4313, x3 = 12939);
          summing the unrounded products and rounding the grand total yields 12937.
