      - name: an_open_audit_finding_stops_final_settlement_until_it_is_resolved
        claim_type: Violation → Error
        grounds: ["validations[priority=20]", "validations[priority=21]", "errors[ERR_OPEN_AUDIT_FINDING]", "state_machines.AuditFinding"]
        distinguishing_aspect: "Audit rights survive into settlement. The finding is raised while the settlement dimension is still NOT_STARTED, so its PENDING_FINAL_INVOICE -> AUDIT_IN_PROGRESS cascade never fires and open-final-billing then legally reaches PENDING_FINAL_INVOICE with a finding still OPEN: the priority-10 state rule therefore passes and priority 20 must return ERR_OPEN_AUDIT_FINDING 409 on its own, ahead of the priority-21 documentation rule this fixture also violates because its only accepted document is a salvage credit. Resolving the finding does not unblock settlement; the priority-21 gap then surfaces, so the two rules are independent and ordered."
        test_recipe:
