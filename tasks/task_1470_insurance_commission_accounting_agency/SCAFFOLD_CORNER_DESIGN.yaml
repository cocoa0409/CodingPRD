  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: producer_cannot_create_policy
        claim_type: role_denial
        grounds: ["roles.Producer", "endpoints.\"POST /agency/policies"]
        distinguishing_aspect: "The entity-backed Producer role is read/acknowledge-only: creating a policy as Producer fails ERR_FORBIDDEN_FOR_ROLE (403)."
        test_recipe:
          setup: ["one producer exists (identity anchor)"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Role R", license_number: "LIC-R1R" }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
          trigger:
            - call: "POST /agency/policies"
              payload: { policy_number: "P-R1R", product_id: "55555555-5555-5555-5555-555555555555", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: Producer
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE with http 403 (role check fires before FK existence)"

      - name: accountant_cannot_generate_tax_forms
        claim_type: role_denial
        grounds: ["roles.AgencyAdmin", "endpoints.\"POST /agency/tax-forms/generate"]
        distinguishing_aspect: "tax-forms/generate is AgencyAdmin-exclusive; AgencyAccountant gets ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agency/tax-forms/generate"
              payload: { tax_year: 2026 }
              as: AgencyAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE with http 403"

      - name: accountant_cannot_waive_statement_line
        claim_type: role_denial
        grounds: ["roles.AgencyAdmin", "endpoints.\"POST /agency/carrier-statements/{statementId}/waive-line"]
        distinguishing_aspect: "waive-line is AgencyAdmin-exclusive (hierarchical override); AgencyAccountant is denied with ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["carrier; statement in RECONCILING with one ORPHAN line"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier RB", carrier_code: "CRB" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/carrier-statements"
              payload: { carrier_id: "${c_id}", period_start: "2026-08-01", period_end: "2026-08-31", lines: [ { line_ref: "GHOST-9", reported_amount_cents: 1000 } ] }
              as: AgencyAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /agency/carrier-statements/${st_id}/start-reconciliation"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/carrier-statements/${st_id}/waive-line"
              payload: { line_ref: "GHOST-9" }
              as: AgencyAccountant
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE with http 403"

      - name: producer_cannot_acknowledge_others_disclosure
        claim_type: role_denial
        grounds: ["state_machines.ProducerDisclosure.DELIVERED_to_ACKNOWLEDGED", "errors[ERR_NOT_RESOURCE_OWNER]", "roles.Producer"]
        distinguishing_aspect: "Ownership check for the entity-backed Producer role: X-User-ID of producer B acknowledging producer A's disclosure fails ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["producers A and B; policy written by A; disclosure DELIVERED"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Owner A", license_number: "LIC-R2A" }
              as: AgencyAdmin
              captures: { a_id: "$.data.id" }
            - call: "POST /agency/producers"
              payload: { name: "Other B", license_number: "LIC-R2B" }
              as: AgencyAdmin
              captures: { b_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier R2", carrier_code: "CR2" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PR2", name: "Product R2", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /agency/policies"
              payload: { policy_number: "P-R2", product_id: "${p_id}", producer_id: "${a_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agency/producer-disclosures/${d_id}/acknowledge"
              payload: {}
              as: Producer
              as_user_id: "${b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER with http 403; disclosure stays DELIVERED"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_schedule_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[schedule-create-stale-product]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first schedule create bumps Product.version 1->2, a second create carrying the stale expected_product_version 1 is rejected with ERR_STALE_VERSION (412) — two strictly sequential requests."
        test_recipe:
          setup: ["carrier; product (version 1)"]
          setup_api_calls:
            - call: "POST /agency/carriers"
              payload: { name: "Carrier OCC", carrier_code: "COCC" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "POCC", name: "Product OCC", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
          trigger:
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v1}" }
              as: AgencyAdmin
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "GOLD", commission_rate_bps: 6000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v1}" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /agency/products/${p_id}"
              payload: {}
              as: AgencyAdmin
              captures: { p_v_now: "$.data.version" }
          assert:
            - "First create succeeded (201) and bumped Product.version to 2"
            - "Second create with stale expected_product_version == 1: error_id == ERR_STALE_VERSION with http 412"
            - "Product.version == 2 after both calls (the rejected create did not bump it)"

      - name: occ_payout_create_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payout-create-stale-producer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential payout creates carrying the same observed Producer.version: the first succeeds and bumps the version; the second is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["producer tax_form_on_file=true with bound policy (balance 1200000); fresh producer version captured after bind"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "OCC P", license_number: "LIC-O2", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier O2", carrier_code: "CO2" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PO2", name: "Product O2", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-O2", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { w_v: "$.data.version" }
          trigger:
            - call: "POST /agency/producers/${w_id}/payouts"
              payload: { amount_cents: 100000, expected_producer_version: "${w_v}" }
              as: AgencyAdmin
              captures: { po1: "$.data.id" }
            - call: "POST /agency/producers/${w_id}/payouts"
              payload: { amount_cents: 100000, expected_producer_version: "${w_v}" }
              as: AgencyAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "First payout created (201)"
            - "Second payout with the same (now stale) expected_producer_version: error_id == ERR_STALE_VERSION with http 412"

      - name: version_increments_on_mutation
        claim_type: derived_field_reconciliation
        grounds: ["complexity_profile", "entities.Producer.fields.status"]
        distinguishing_aspect: "Producer.version starts at 1 and increments on every mutation: a successful payout create moves it exactly +1 (observable via GET before/after)."
        test_recipe:
          setup: ["producer tax_form_on_file=true with bound policy (balance 1200000)"]
          setup_api_calls:
            - call: "POST /agency/producers"
              payload: { name: "Ver V", license_number: "LIC-O3", tax_form_on_file: true }
              as: AgencyAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /agency/carriers"
              payload: { name: "Carrier O3", carrier_code: "CO3" }
              as: AgencyAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /agency/products"
              payload: { carrier_id: "${c_id}", product_code: "PO3", name: "Product O3", line_of_business: "LIFE" }
              as: AgencyAdmin
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /agency/products/${p_id}/commission-schedules"
              payload: { tier: "STANDARD", commission_rate_bps: 5000, override_rate_bps: 0, advance_months: 12, effective_from: "2026-01-01", expected_product_version: "${p_v}" }
              as: AgencyAdmin
            - call: "POST /agency/policies"
              payload: { policy_number: "P-O3", product_id: "${p_id}", producer_id: "${w_id}", insured_name: "I", billing_type: "DIRECT_BILL", premium_annual_cents: 2400000, effective_date: "2026-08-01" }
              as: AgencyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "GET /agency/producer-disclosures"
              payload: { policy_id: "${pol_id}" }
              as: AgencyAdmin
              captures: { d_id: "$.data[0].id" }
            - call: "POST /agency/producer-disclosures/${d_id}/deliver"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agency/policies/${pol_id}/bind"
              payload: {}
              as: AgencyAdmin
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { v_before: "$.data.version" }
          trigger:
            - call: "POST /agency/producers/${w_id}/payouts"
              payload: { amount_cents: 100000, expected_producer_version: "${v_before}" }
              as: AgencyAdmin
            - call: "GET /agency/producers/${w_id}"
              payload: {}
              as: AgencyAdmin
              captures: { v_after: "$.data.version" }
          assert:
            - "version_after == version_before + 1 (exactly one increment for the payout creation)"
