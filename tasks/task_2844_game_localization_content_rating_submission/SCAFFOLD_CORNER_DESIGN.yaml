              captures: { k_sub: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "surface.c_hud", source_text: "hud surface sample", source_char_count: 200, ui_surface: "HUD", display_char_limit: 600, tm_match_pct: 60 }
              as: LocalizationProducer
              captures: { k_hud: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "surface.d_menu", source_text: "menu surface sample", source_char_count: 200, ui_surface: "MENU", display_char_limit: 600, tm_match_pct: 60 }
              as: LocalizationProducer
              captures: { k_menu: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "DE", rating_board: "USK", target_rating: "MATURE_15", scope_tier: "SUBTITLED", cultural_adaptation_required: false, budget_cap_cents: 5000000, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_de: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
          trigger:
            - call: "POST /market-plans/${mp_de}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { units: "$.data.text_effort_units", cost: "$.data.localization_cost_cents", overage: "$.data.overage_cents" }
          assert:
            - "per-key units are LEGAL 2.3 (2.00 x 0.75 x 1.50 = 2.25 rounded half-up), SUBTITLE 1.8, HUD 1.7 (1.65 rounded half-up) and MENU 1.5"
            - "MarketPlan.${mp_de}.text_effort_units == 7.30"
            - "MarketPlan.${mp_de}.localization_cost_cents == 38325 (7.30 x 4200 x SUBTITLED 1.25) and overage_cents == 0"
            - "no cultural surcharge is added: scope_tier is not FULL_CULTURAL, so the 150000 floor never applies"

      - name: localization_cost_counts_only_recorded_voice_sessions
        claim_type: input_set_filtering
        grounds:
          - calculations.market_localization_cost_cents.input_set
          - calculations.talent_commitment_ledger.input_set
        distinguishing_aspect: "A SCHEDULED and then IN_PROGRESS session must contribute exactly zero voice cost and zero committed fee; only the RECORDED transition moves both numbers. An implementation that charged at booking would bill for work never delivered."
