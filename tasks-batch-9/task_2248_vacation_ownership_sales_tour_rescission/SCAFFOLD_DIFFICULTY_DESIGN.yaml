      - name: qualification_cap_before_no_show_penalty_step_order
        grounds:
          - calculations.tour_qualification_evaluation
          - entities.TourBooking.fields.qualification_score
          - entities.TourBooking.fields.qualification_penalty_points
          - validations[priority=32]
        distinguishing_aspect: |
          Mode (a) — STEP-ORDER divergence. raw_points reaches 110 (income 45 + age 25 +
          married 20 + affinity 20, owner 0) on a channel whose historical_no_show_rate is
          exactly 1.0000, so the pinned cap-then-penalise order yields
          min(100, 110) - 30 = 70 while the rejected penalise-then-cap order would yield
          min(100, 110 - 30) = 80; the 10-point gap is observable on a single stored field.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One IN_HOUSE_REFERRAL channel (affinity channel, min_age 21, min_household_income_cents 5000000, min_qualification_score 60)."
            - "One prospect aged 55 with household_income_cents 15000000 and marital_status MARRIED, never an owner (is_existing_owner false)."
            - "One tour on that channel driven to NO_SHOW so channel.toured_count is 0, channel.no_show_count is 1 and historical_no_show_rate is exactly 1.0000; channel.booked_count is 1, below NO_SHOW_MIN_SAMPLE 4, so the channel stays ACTIVE."
