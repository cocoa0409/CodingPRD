          - validations[priority 94]
          - errors[ERR_ADDON_CUTOFF_PASSED]
          - errors[ERR_OUTSIDE_OPERATING_HOURS]
        distinguishing_aspect: |
          Two inclusive edges are satisfied at once in a single request: the clock sits at
          minute 900, exactly the center's addon_cutoff_minute, and the chair window runs
          [900, 1140) whose exclusive end lands exactly on close_minute. Both checks are
          declared to pass on equality, so the booking must return 201 — an implementation
          using strict '<' on either edge rejects with ERR_ADDON_CUTOFF_PASSED or
          ERR_OUTSIDE_OPERATING_HOURS.
