scaffold_corner_design:
  - section: entities
    instances:
      - name: patient_create_returns_201_with_system_fields_and_clear_eligibility
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "A create with all four required fields returns 201, a server-minted UUID id with no prefix, version 1, and eligibility_status CLEAR with both hold booleans false."
        test_recipe:
          setup: ["Empty database; clock at its 2026-05-01T00:00:00Z startup default."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner One", date_of_birth: "1980-01-01", email: "c1@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c1: $.data.id }
          assert:
            - "the trigger returned HTTP 201"
            - "Patient.${c1}.version == 1"
            - "Patient.${c1}.clinical_hold == false"
            - "Patient.${c1}.financial_hold == false"
            - "Patient.${c1}.eligibility_status == CLEAR"
            - "Patient.${c1}.cumulative_mg_testosterone == 0"
            - "Patient.${c1}.cumulative_mg_estradiol == 0"
            - "Patient.${c1}.open_notification_count == 0"
            - "Patient.${c1}.id contains no type prefix and is a bare UUID"
            - "the response envelope carries meta.api_request_id and meta.api_request_timestamp and response_type object"

      - name: every_addressable_entity_has_its_own_not_found_code
        claim_type: "Not Found"
        grounds: ["validations[priority=6]", "errors[ERR_PROVIDER_NOT_FOUND]", "errors[ERR_PROTOCOL_NOT_FOUND]", "errors[ERR_CONSENT_NOT_FOUND]", "errors[ERR_CONSULT_NOT_FOUND]", "errors[ERR_LAB_PANEL_NOT_FOUND]", "errors[ERR_LOT_NOT_FOUND]", "errors[ERR_STANDING_ORDER_NOT_FOUND]", "errors[ERR_PROCEDURE_NOT_FOUND]", "errors[ERR_INJECTION_VISIT_NOT_FOUND]", "errors[ERR_MEMBERSHIP_NOT_FOUND]", "errors[ERR_SERIES_PACK_NOT_FOUND]", "errors[ERR_ADVERSE_EVENT_NOT_FOUND]", "errors[ERR_FINANCING_PLAN_NOT_FOUND]", "errors[ERR_NOTIFICATION_NOT_FOUND]"]
        distinguishing_aspect: "Rung 6 resolves the path resource per collection, so each of the thirteen addressable entities returns its OWN domain-specific 404 code rather than a shared generic one."
        test_recipe:
          setup: ["Empty database; the same non-existent UUID is used against every single-resource GET."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/providers/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_provider: $.data.error_id }
            - call: "GET /clinic/protocols/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_protocol: $.data.error_id }
            - call: "GET /clinic/consents/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_consent: $.data.error_id }
            - call: "GET /clinic/consults/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_consult: $.data.error_id }
            - call: "GET /clinic/lab-panels/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_lab: $.data.error_id }
            - call: "GET /clinic/pellet-lots/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_lot: $.data.error_id }
            - call: "GET /clinic/standing-orders/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_so: $.data.error_id }
            - call: "GET /clinic/procedures/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_proc: $.data.error_id }
            - call: "GET /clinic/injection-visits/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_visit: $.data.error_id }
            - call: "GET /clinic/memberships/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_mem: $.data.error_id }
            - call: "GET /clinic/series-packs/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_pack: $.data.error_id }
            - call: "GET /clinic/adverse-events/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_ae: $.data.error_id }
            - call: "GET /clinic/financing-plans/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_fp: $.data.error_id }
            - call: "GET /clinic/patient-notifications/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: ClinicAdmin
              captures: { e_note: $.data.error_id }
          assert:
            - "${e_provider} == ERR_PROVIDER_NOT_FOUND with HTTP 404"
            - "${e_protocol} == ERR_PROTOCOL_NOT_FOUND with HTTP 404"
            - "${e_consent} == ERR_CONSENT_NOT_FOUND with HTTP 404"
            - "${e_consult} == ERR_CONSULT_NOT_FOUND with HTTP 404"
            - "${e_lab} == ERR_LAB_PANEL_NOT_FOUND with HTTP 404"
            - "${e_lot} == ERR_LOT_NOT_FOUND with HTTP 404"
            - "${e_so} == ERR_STANDING_ORDER_NOT_FOUND with HTTP 404"
            - "${e_proc} == ERR_PROCEDURE_NOT_FOUND with HTTP 404"
            - "${e_visit} == ERR_INJECTION_VISIT_NOT_FOUND with HTTP 404"
            - "${e_mem} == ERR_MEMBERSHIP_NOT_FOUND with HTTP 404"
            - "${e_pack} == ERR_SERIES_PACK_NOT_FOUND with HTTP 404"
            - "${e_ae} == ERR_ADVERSE_EVENT_NOT_FOUND with HTTP 404"
            - "${e_fp} == ERR_FINANCING_PLAN_NOT_FOUND with HTTP 404"
            - "${e_note} == ERR_NOTIFICATION_NOT_FOUND with HTTP 404"

      - name: patient_get_non_existent_returns_not_found
        claim_type: "Not Found"
        grounds: ["errors[ERR_PATIENT_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "A syntactically valid UUID that matches no row returns ERR_PATIENT_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "${nf_err} == ERR_PATIENT_NOT_FOUND with HTTP 404"
            - "the response envelope response_type is error"

      - name: patient_create_missing_required_field_returns_invalid_request
        claim_type: "Required Fields"
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting sex_at_birth, a source input field with no default, returns ERR_VALIDATION with HTTP 400 and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Two", date_of_birth: "1980-01-01", email: "c2@example.com" }
              as: ClinicAdmin
              captures: { req_err: $.data.error_id }
          assert:
            - "${req_err} == ERR_VALIDATION with HTTP 400"
            - "no Patient row exists with email c2@example.com"

      - name: provider_invalid_enum_provider_type_returns_invalid_enum
        claim_type: "Type Constraints"
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_ENUM]", entities.Provider.fields.provider_type]
        distinguishing_aspect: "provider_type is on rung 5's exhaustive enum list, so a value outside {PHYSICIAN, NURSE_INJECTOR} returns ERR_INVALID_ENUM, not ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/providers"
              payload: { full_name: "Corner Three", provider_type: "SURGEON", npi: "9000000001" }
              as: ClinicAdmin
              captures: { enum_err: $.data.error_id }
          assert:
            - "${enum_err} == ERR_INVALID_ENUM with HTTP 400"
            - "no Provider row exists with npi 9000000001"

      - name: lab_panel_is_trough_draw_defaults_to_false
        claim_type: Defaults
        grounds: [entities.LabPanel.fields.is_trough_draw]
        distinguishing_aspect: "Omitting is_trough_draw yields false, and a false panel can never satisfy the trough factor no matter how well timed it is."
        test_recipe:
          setup: ["One physician and one patient."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Four", date_of_birth: "1980-01-01", email: "c4@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c4: $.data.id }
          trigger:
            - call: "POST /clinic/lab-panels"
              payload: { patient_id: "${c4}", ordered_by_provider_id: "${dr1}", analyte: "HEMATOCRIT", value: 44.0, drawn_at: "2026-05-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { lab_c4: $.data.id }
          assert:
            - "LabPanel.${lab_c4}.is_trough_draw == false"
            - "LabPanel.${lab_c4}.unit == percent"
            - "LabPanel.${lab_c4}.lab_reference_band == IN_REF"
            - "LabPanel.${lab_c4}.clinic_optimal_band == IN_OPTIMAL"
            - "LabPanel.${lab_c4}.critical_flag == false"
            - "LabPanel.${lab_c4}.status == RECORDED"

      - name: pellet_lot_buckets_initialised_from_qty_received
        claim_type: "Computed Fields"
        grounds: [entities.PelletLot, conservation_invariants.lot_pellet_conservation]
        distinguishing_aspect: "On receipt qty_on_hand equals qty_received and the other four buckets are 0, so lot_pellet_conservation holds from the first instant."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T200-CORNER", hormone_type: "TESTOSTERONE", strength_mg: 200, expiry_date: "2026-12-01T00:00:00Z", qty_received: 12 }
              as: InventoryManager
              captures: { lot_c: $.data.id }
          assert:
            - "the trigger returned HTTP 201"
            - "PelletLot.${lot_c}.qty_on_hand == 12"
            - "PelletLot.${lot_c}.qty_reserved == 0"
            - "PelletLot.${lot_c}.qty_consumed == 0"
            - "PelletLot.${lot_c}.qty_wasted == 0"
            - "PelletLot.${lot_c}.qty_returned == 0"
            - "PelletLot.${lot_c}.sterility_status == QUARANTINED"

      - name: protocol_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds: [entities.Protocol]
        distinguishing_aspect: "Protocol declares common_fields false, so a fetched protocol exposes id, created_at, hormone_type, protocol_version, title, published_by_provider_id and effective_at, and there is no update endpoint for it anywhere in the surface."
        test_recipe:
          setup: ["One physician."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "ESTRADIOL", title: "E2 pellet protocol v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { proto_c: $.data.id }
          trigger:
            - call: "GET /clinic/protocols/${proto_c}"
              payload: {}
              as: ClinicAdmin
          assert:
            - "the response body carries protocol_version 1"
            - "the response body carries effective_at 2026-05-01T00:00:00.000Z"
            - "the response body carries no updated_at and no version field"

      - name: protocol_version_increments_per_hormone_type_independently
        claim_type: "Computed Fields"
        grounds: [entities.Protocol.fields.protocol_version]
        distinguishing_aspect: "protocol_version is scoped per hormone_type: publishing a second TESTOSTERONE protocol yields 2 while the first ESTRADIOL protocol published afterwards still yields 1."
        test_recipe:
          setup: ["One physician."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "TESTOSTERONE", title: "T v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
          trigger:
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "TESTOSTERONE", title: "T v2", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { t_v2: $.data.protocol_version }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "ESTRADIOL", title: "E2 v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { e_v1: $.data.protocol_version }
          assert:
            - "${t_v2} == 2"
            - "${e_v1} == 1"

      - name: procedures_list_returns_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /clinic/procedures returns response_type array with limit, offset, total_count and has_more; with three rows and limit 2 the page holds 2 and has_more is true."
        test_recipe:
          setup:
            - "One physician, one patient, one consult, one standing order and three SCHEDULED procedures in three rooms two hours apart."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Five", date_of_birth: "1980-01-01", email: "c5@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c5: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c5}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Hypogonadism" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs5: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so5: $.data.id }
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${c5}", provider_id: "${dr1}", consult_id: "${cs5}", standing_order_id: "${so5}", procedure_type: "INITIAL", room_code: "RM30", scheduled_start: "2026-06-08T09:00:00Z" }
              as: FrontDesk
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${c5}", provider_id: "${dr1}", consult_id: "${cs5}", standing_order_id: "${so5}", procedure_type: "INITIAL", room_code: "RM31", scheduled_start: "2026-06-08T11:00:00Z" }
              as: FrontDesk
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${c5}", provider_id: "${dr1}", consult_id: "${cs5}", standing_order_id: "${so5}", procedure_type: "INITIAL", room_code: "RM32", scheduled_start: "2026-06-08T13:00:00Z" }
              as: FrontDesk
          trigger:
            - call: "GET /clinic/procedures"
              payload: { patient_id: "${c5}", limit: 2, offset: 0 }
              as: FrontDesk
          assert:
            - "response_type == array"
            - "the page contains exactly 2 Procedure rows"
            - "total_count == 3"
            - "has_more == true"
            - "limit == 2 and offset == 0"

      - name: consults_filtered_by_patient_id_reverse_reachability
        claim_type: "Parent Relationships"
        grounds: [entities.Consult.fields.patient_id, endpoints]
        distinguishing_aspect: "The FK Consult.patient_id is reverse-reachable: GET /clinic/consults filtered by patient_id returns only that patient's consults as an array."
        test_recipe:
          setup: ["One physician and two patients, each holding one consult."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Six", date_of_birth: "1980-01-01", email: "c6@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c6: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Seven", date_of_birth: "1980-01-02", email: "c7@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c7: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c6}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Six" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs6: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c7}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Seven" }
              as: Physician
              as_user_id: "${dr1}"
          trigger:
            - call: "GET /clinic/consults"
              payload: { patient_id: "${c6}" }
              as: FrontDesk
          assert:
            - "total_count == 1"
            - "the single returned Consult has id ${cs6}"
            - "response_type == array"

      - name: consult_body_fk_to_missing_provider_returns_provider_not_found
        claim_type: "Parent Relationships"
        grounds: ["validations[priority=7]", "errors[ERR_PROVIDER_NOT_FOUND]"]
        distinguishing_aspect: "Rung 7 validates body foreign keys in the declared order patient_id then physician_id, so a valid patient with a missing physician returns ERR_PROVIDER_NOT_FOUND, never ERR_PATIENT_NOT_FOUND."
        test_recipe:
          setup: ["One physician (used only for the header identity) and one patient."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Eight", date_of_birth: "1980-01-01", email: "c8@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c8: $.data.id }
          trigger:
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c8}", physician_id: "00000000-0000-4000-8000-000000000001", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Ghost doctor" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { fk_err: $.data.error_id }
          assert:
            - "${fk_err} == ERR_PROVIDER_NOT_FOUND with HTTP 404"
            - "no Consult row exists with patient_id ${c8}"

  - section: state_machines
    instances:
      - name: release_an_already_released_lot_returns_invalid_state
        claim_type: "Invalid Transitions"
        grounds: [state_machines.PelletLot.QUARANTINED_to_RELEASED, "validations[priority=10]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "QUARANTINED to RELEASED is the only declared entry into RELEASED, so a second release on an already RELEASED lot fails rung 10 with ERR_INVALID_STATE and leaves every bucket untouched."
        test_recipe:
          setup: ["One RELEASED 200 mg testosterone lot with 10 pellets."]
          setup_api_calls:
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T200-REL", hormone_type: "TESTOSTERONE", strength_mg: 200, expiry_date: "2026-12-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_r: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_r}/release"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /clinic/pellet-lots/${lot_r}/release"
              payload: {}
              as: InventoryManager
              captures: { rel_err: $.data.error_id }
          assert:
            - "${rel_err} == ERR_INVALID_STATE with HTTP 409"
            - "PelletLot.${lot_r}.sterility_status == RELEASED"
            - "PelletLot.${lot_r}.qty_on_hand == 10"

      - name: recall_an_already_recalled_lot_returns_already_terminal
        claim_type: "Terminal State Lockdown"
        grounds: [state_machines.PelletLot.RELEASED_to_RECALLED, "validations[priority=11]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "RECALLED is the only terminal state on the lot axis, so a second recall returns ERR_ALREADY_TERMINAL rather than ERR_INVALID_STATE, and no second forfeiture of qty_on_hand occurs."
        test_recipe:
          setup: ["One RECALLED 200 mg testosterone lot that held 10 pellets, none allocated."]
          setup_api_calls:
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T200-RCL", hormone_type: "TESTOSTERONE", strength_mg: 200, expiry_date: "2026-12-01T00:00:00Z", qty_received: 10 }
              as: InventoryManager
              captures: { lot_x: $.data.id }
            - call: "POST /clinic/pellet-lots/${lot_x}/release"
              payload: {}
              as: InventoryManager
            - call: "POST /clinic/pellet-lots/${lot_x}/recall"
              payload: { severity_class: "CLASS_II", recall_reason: "Labelling defect" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /clinic/pellet-lots/${lot_x}/recall"
              payload: { severity_class: "CLASS_I", recall_reason: "Escalated finding" }
              as: ComplianceOfficer
              captures: { rcl_err: $.data.error_id }
          assert:
            - "${rcl_err} == ERR_ALREADY_TERMINAL with HTTP 409"
            - "PelletLot.${lot_x}.recall_severity == CLASS_II"
            - "PelletLot.${lot_x}.qty_returned == 10"
            - "PelletLot.${lot_x}.qty_on_hand == 0"

      - name: notification_acknowledged_twice_returns_already_terminal
        claim_type: Idempotency
        grounds: [state_machines.PatientNotification.PENDING_to_ACKNOWLEDGED, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "ACKNOWLEDGED is terminal on the notification axis, so the second acknowledgement fails and open_notification_count is decremented exactly once."
        test_recipe:
          setup:
            - "A patient carrying one PENDING CONSENT_REQUIRED notification produced by publishing protocol version 2 while their procedure was CONSENTED."
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner Nine", date_of_birth: "1980-01-01", email: "c9@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c9: $.data.id }
            - call: "POST /clinic/protocols"
              payload: { hormone_type: "TESTOSTERONE", title: "T v1", published_by_provider_id: "${dr1}" }
              as: Physician
              as_user_id: "${dr1}"
            - call: "POST /clinic/consents"
              payload: { patient_id: "${c9}", hormone_type: "TESTOSTERONE", protocol_version: 1, consented_max_dose_mg: 2000 }
              as: FrontDesk
