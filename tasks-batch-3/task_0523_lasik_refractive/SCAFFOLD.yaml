scenario: "523. LASIK & Refractive Surgery Center: candidacy screening & corneal topography, surgeon/laser-suite scheduling, package & lifetime-enhancement plan, financing & deposit, pre-op drops & consent, day-of flow & optometrist co-management, enhancement-eligibility window, outcome/refund guarantee"
domain_name: lasik-refractive-center
api_prefix: /refractive

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Peer resources (Patient, SurgeryCase, SuiteBooking, FinancingPlan, RefundClaim ...)
  # linked by explicit foreign keys, no nesting in URL paths.

  state_machine_shape: parallel
  # SurgeryCase carries two independent state axes (clinical_status x financial_status);
  # CandidacyScreening branches (fork-join into APPROVED/REJECTED with divergent effects);
  # EnhancementRequest cycles (REQUESTED -> RE_SCREENING -> REQUESTED revision loop).

  relationship_patterns:
    - one_to_many        # Patient -> CandidacyScreening, SurgeryCase -> ConsentForm
    - cross_aggregate    # SuiteBooking references SurgeryCase, LaserSuite, Surgeon
    - self_referential   # EnhancementRequest.origin_case_id -> SurgeryCase (enhancement of a prior case's outcome)

  role_model: peer_roles
  # Surgeon owns clinical transitions; Optometrist owns co-management screenings;
  # Coordinator owns scheduling/financing; Patient owns own consent + requests.

  consistency_model: immediate

# =====================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =====================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: TreatmentPackage
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, identity only
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC, three fractional digits
      - name: tier
        type: enum
        source: input
        description: package tier
        constraints: "one of {STANDARD, PREMIUM, LIFETIME}"
      - name: base_price_cents
        type: integer
        source: input
        description: sticker price before deposit/financing, in cents
        constraints: ">= 0"
      - name: deposit_cents
        type: integer
        source: input
        description: non-refundable deposit required to book a suite, in cents
        constraints: ">= 0 and <= base_price_cents"
      - name: enhancement_window_days
        type: integer
        source: input
        description: "number of days after surgery during which a free enhancement is covered; LIFETIME uses 36500"
        constraints: ">= 0"
      - name: outcome_guarantee_uncorrected_va
        type: number
        source: input
        description: "guaranteed post-op uncorrected visual acuity as a decimal (e.g. 1.0 == 20/20); refund guarantee triggers if final measured VA is worse than this"
        constraints: "> 0"
      - name: refund_mode
        type: enum
        source: input
        description: "which refund algorithm applies when the outcome guarantee is missed"
        constraints: "one of {PRO_RATA, DEPOSIT_FORFEIT}"
      - name: active
        type: boolean
        source: input
        description: whether the package may back new surgery cases
        default: true

  - name: LaserSuite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human label for the suite
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: "mandatory cleaning/reset gap the suite requires AFTER a booking ends before the next booking may start"
        constraints: ">= 0"
      - name: daily_case_cap
        type: integer
        source: input
        description: "maximum number of ACTIVE SuiteBookings this suite may hold with the same booking date (UTC calendar day of slot_start)"
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: suite operational status
        default: OPEN
        constraints: "one of {OPEN, MAINTENANCE}"

  - name: Surgeon
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: surgeon display name
      - name: max_daily_cases
        type: integer
        source: input
        description: "maximum ACTIVE SuiteBookings assigned to this surgeon on the same UTC calendar day"
        constraints: ">= 1"
      - name: accepting
        type: boolean
        source: input
        description: whether the surgeon accepts new bookings
        default: true

  - name: Optometrist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: co-managing optometrist display name

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: patient display name
      - name: date_of_birth
        type: string
        source: input
        description: "ISO date YYYY-MM-DD; used for the minimum-age candidacy check"
      - name: co_managing_optometrist_id
        type: string
        source: input
        description: "FK -> Optometrist.id; nullable co-management referral source"
        default: null
      - name: status
        type: enum
        source: system
        description: derived patient standing
        default: PROSPECT
        constraints: "one of {PROSPECT, CANDIDATE, INELIGIBLE, OPERATED}"

  - name: CandidacyScreening
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: performed_by_optometrist_id
        type: string
        source: input
        description: "FK -> Optometrist.id; the co-managing optometrist who ran the topography"
      - name: corneal_thickness_um
        type: integer
        source: input
        description: "central corneal thickness in microns from topography"
        constraints: ">= 0"
      - name: topography_k_max
        type: number
        source: input
        description: "steepest keratometry reading (diopters) from corneal topography; ectasia-risk marker"
        constraints: "> 0"
      - name: refractive_error_diopters
        type: number
        source: input
        description: "spherical-equivalent refractive error magnitude in diopters (absolute value)"
        constraints: ">= 0"
      - name: ablation_depth_um
        type: integer
        source: computed
        description: "estimated tissue removal in microns, computed from refractive_error_diopters (see §1.3 ablation_depth_estimate)"
      - name: residual_stromal_bed_um
        type: integer
        source: computed
        description: "corneal_thickness_um minus FLAP_THICKNESS_UM minus ablation_depth_um (see §1.3 residual_bed)"
      - name: status
        type: enum
        source: system
        description: screening lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED}"
      - name: rejection_reason
        type: enum
        source: system
        description: "why the screening was rejected; null unless status == REJECTED"
        default: null
        constraints: "one of {THIN_BED, HIGH_K, HIGH_ERROR, UNDERAGE}"

  - name: SurgeryCase
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: screening_id
        type: string
        source: input
        description: "FK -> CandidacyScreening.id; must be an APPROVED screening for this patient"
      - name: package_id
        type: string
        source: input
        description: "FK -> TreatmentPackage.id"
      - name: clinical_status
        type: enum
        source: system
        description: "clinical axis of the parallel state machine"
        default: PLANNED
        constraints: "one of {PLANNED, SCHEDULED, CONSENTED, OPERATED, HEALED, CANCELLED}"
      - name: financial_status
        type: enum
        source: system
        description: "financial axis of the parallel state machine (independent of clinical_status)"
        default: UNFUNDED
        constraints: "one of {UNFUNDED, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED}"
      - name: surgery_completed_at
        type: datetime
        source: system
        description: "logical-clock timestamp stamped when clinical_status enters OPERATED; anchors the enhancement window and refund window"
        default: null
      - name: final_uncorrected_va
        type: number
        source: system
        description: "measured post-op uncorrected visual acuity recorded at HEALED transition; null until healed"
        default: null

  - name: FinancingPlan
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> SurgeryCase.id"
      - name: down_payment_cents
        type: integer
        source: input
        description: "amount paid up front (must cover at least the package deposit)"
        constraints: ">= 0"
      - name: term_months
        type: integer
        source: input
        description: "number of monthly installments for the financed remainder"
        constraints: ">= 1 and <= 60"
      - name: apr_bps
        type: integer
        source: input
        description: "annual percentage rate in basis points (e.g. 1200 == 12.00%)"
        constraints: ">= 0"
      - name: monthly_installment_cents
        type: integer
        source: computed
        description: "computed amortized monthly payment (see §1.3 amortized_installment)"
      - name: amount_settled_cents
        type: integer
        source: system
        description: "running total actually collected across down payment + posted installments"
        default: 0
      - name: status
        type: enum
        source: system
        description: financing lifecycle
        default: OPEN
        constraints: "one of {OPEN, SETTLED, CANCELLED}"

  - name: ConsentForm
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> SurgeryCase.id"
      - name: drops_regimen_started
        type: boolean
        source: input
        description: "attestation that the pre-op antibiotic/steroid drops regimen was started"
      - name: signed_by_patient_id
        type: string
        source: input
        description: "FK -> Patient.id; must equal the case's patient_id"
      - name: signed_at
        type: datetime
        source: system
        description: logical-clock timestamp of signature
      - name: status
        type: enum
        source: system
        description: consent state
        default: SIGNED
        constraints: "one of {SIGNED, REVOKED}"

  - name: EnhancementRequest
    parent: null
    common_fields: true
    fields:
      - name: origin_case_id
        type: string
        source: input
        description: "FK -> SurgeryCase.id; the prior HEALED case whose outcome the patient wants enhanced"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; must equal origin case patient_id"
      - name: reason
        type: string
        source: input
        description: patient-reported regression or residual error
      - name: re_screening_id
        type: string
        source: system
        description: "FK -> CandidacyScreening.id; the re-screening attached during RE_SCREENING; null until attached"
        default: null
      - name: status
        type: enum
        source: system
        description: enhancement lifecycle (cyclic)
        default: REQUESTED
        constraints: "one of {REQUESTED, RE_SCREENING, APPROVED, DENIED, FULFILLED}"
      - name: within_window
        type: boolean
        source: system
        description: "computed at creation: whether now is within origin package enhancement_window_days of origin surgery_completed_at (see §1.3 enhancement_window_eval)"

  - name: SuiteBooking
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> SurgeryCase.id"
      - name: suite_id
        type: string
        source: input
        description: "FK -> LaserSuite.id"
      - name: surgeon_id
        type: string
        source: input
        description: "FK -> Surgeon.id"
      - name: slot_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the operating slot (half-open interval [slot_start, slot_end))"
      - name: slot_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the operating slot; must be strictly after slot_start"
      - name: expected_case_version
        type: integer
        source: input
        description: "OCC guard: the SurgeryCase.version the client last observed (see §1.2.1 booking-create-stale-case)"
      - name: status
        type: enum
        source: system
        description: booking lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED}"

  - name: RefundClaim
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> SurgeryCase.id; must be a HEALED case that missed its outcome guarantee"
      - name: measured_uncorrected_va
        type: number
        source: system
        description: "copied from origin case final_uncorrected_va at claim creation"
      - name: refund_mode
        type: enum
        source: system
        description: "copied from the case's package refund_mode at claim creation"
        constraints: "one of {PRO_RATA, DEPOSIT_FORFEIT}"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "computed payout (see §1.3 refund_payout); differs by refund_mode"
      - name: status
        type: enum
        source: system
        description: refund claim lifecycle
        default: PENDING
        constraints: "one of {PENDING, PAID, REJECTED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: CandidacyScreening
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /screenings/{id}/submit"
        actor: Optometrist
        preconditions:
          - "screening.status == DRAFT"
          - "the acting Optometrist.id == screening.performed_by_optometrist_id"
        side_effects:
          - "recompute ablation_depth_um and residual_stromal_bed_um from inputs (§1.3)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /screenings/{id}/adjudicate with decision=APPROVE"
        actor: Surgeon
        preconditions:
          - "screening.status == SUBMITTED"
          - "residual_stromal_bed_um >= MIN_RESIDUAL_BED_UM"
          - "topography_k_max < MAX_SAFE_K_DIOPTERS"
          - "refractive_error_diopters <= MAX_TREATABLE_DIOPTERS"
          - "patient age in whole years at now >= MIN_AGE_YEARS"
        side_effects:
          - "set Patient.status = CANDIDATE (bubble-up to the patient this screening belongs to)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /screenings/{id}/adjudicate with decision=REJECT"
        actor: Surgeon
        preconditions:
          - "screening.status == SUBMITTED"
        side_effects:
          - "set rejection_reason to the first failing check in the order THIN_BED, HIGH_K, HIGH_ERROR, UNDERAGE (§1.4 priorities 30-33)"
          - "if the Patient has no APPROVED screening, set Patient.status = INELIGIBLE"
        note: "branch counterpart to APPROVE; divergent side-effect set (fork-join branching)"

  - entity: SurgeryCase
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      # ---- clinical_status axis ----
      - from: "clinical_status=PLANNED"
        to: "clinical_status=SCHEDULED"
        trigger: "POST /cases/{id}/bookings (creates an ACTIVE SuiteBooking)"
        actor: Coordinator
        preconditions:
          - "case.clinical_status == PLANNED"
          - "case.financial_status IN {DEPOSIT_PAID, PAID_IN_FULL}"
          - "no ACTIVE SuiteBooking already references this case"
          - "expected_case_version matches SurgeryCase.version (§1.2.1)"
        side_effects:
          - "create SuiteBooking (status ACTIVE)"
          - "set case.clinical_status = SCHEDULED"
          - "increments SurgeryCase.version by 1"
        note: "cross-entity dependency: SCHEDULED requires financial_status funded"
      - from: "clinical_status=SCHEDULED"
        to: "clinical_status=CONSENTED"
        trigger: "POST /cases/{id}/consent (creates a SIGNED ConsentForm)"
        actor: Patient
        preconditions:
          - "case.clinical_status == SCHEDULED"
          - "drops_regimen_started == true"
          - "signed_by_patient_id == case.patient_id"
        side_effects:
          - "create ConsentForm (status SIGNED), stamp signed_at from logical clock"
          - "set case.clinical_status = CONSENTED"
      - from: "clinical_status=CONSENTED"
        to: "clinical_status=OPERATED"
        trigger: "POST /cases/{id}/operate"
        actor: Surgeon
        preconditions:
          - "case.clinical_status == CONSENTED"
          - "case has an ACTIVE SuiteBooking whose slot_start <= now (logical clock)"
          - "case has a SIGNED (not REVOKED) ConsentForm"
        side_effects:
          - "set case.clinical_status = OPERATED"
          - "stamp surgery_completed_at from logical clock"
          - "set Patient.status = OPERATED (cross-entity bubble-up)"
      - from: "clinical_status=OPERATED"
        to: "clinical_status=HEALED"
        trigger: "POST /cases/{id}/heal with final_uncorrected_va"
        actor: Surgeon
        preconditions:
          - "case.clinical_status == OPERATED"
          - "now >= surgery_completed_at + HEAL_SETTLE_DAYS days"
        side_effects:
          - "set final_uncorrected_va from request"
          - "set case.clinical_status = HEALED"
      - from: "clinical_status IN {PLANNED, SCHEDULED, CONSENTED}"
        to: "clinical_status=CANCELLED"
        trigger: "POST /cases/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "case.clinical_status IN {PLANNED, SCHEDULED, CONSENTED}"
          - "expected_case_version matches SurgeryCase.version (§1.2.1)"
        side_effects:
          - "set case.clinical_status = CANCELLED"
          - "cascade: RELEASE every ACTIVE SuiteBooking of this case -> booking.status = RELEASED"
          - "cascade: REVOKE every SIGNED ConsentForm of this case -> consent.status = REVOKED"
          - "cascade: if an OPEN FinancingPlan exists, set its status = CANCELLED; then set case.financial_status = REFUNDED only if it was PAID_IN_FULL, else leave financial axis unchanged"
          - "increments SurgeryCase.version by 1"
        note: "3-hop cascade: cancel -> financing cancelled -> financial_status flip"
      # ---- financial_status axis (independent) ----
      - from: "financial_status=UNFUNDED"
        to: "financial_status=DEPOSIT_PAID"
        trigger: "POST /cases/{id}/financing (creates FinancingPlan)"
        actor: Coordinator
        preconditions:
          - "case.financial_status == UNFUNDED"
          - "down_payment_cents >= package.deposit_cents"
          - "down_payment_cents < package.base_price_cents"
        side_effects:
          - "create FinancingPlan (status OPEN), compute monthly_installment_cents (§1.3)"
          - "set FinancingPlan.amount_settled_cents = down_payment_cents"
          - "set case.financial_status = DEPOSIT_PAID"
      - from: "financial_status=UNFUNDED"
        to: "financial_status=PAID_IN_FULL"
        trigger: "POST /cases/{id}/financing with down_payment_cents == package.base_price_cents"
        actor: Coordinator
        preconditions:
          - "case.financial_status == UNFUNDED"
          - "down_payment_cents == package.base_price_cents"
        side_effects:
          - "create FinancingPlan (status SETTLED, term_months coerced to 1), amount_settled_cents = base_price_cents"
          - "set case.financial_status = PAID_IN_FULL"
      - from: "financial_status=DEPOSIT_PAID"
        to: "financial_status=PAID_IN_FULL"
        trigger: "POST /financing/{id}/installments (posts installments until fully settled)"
        actor: Coordinator
        preconditions:
          - "financing.status == OPEN"
          - "case.financial_status == DEPOSIT_PAID"
        side_effects:
          - "add amount_cents to FinancingPlan.amount_settled_cents"
          - "when amount_settled_cents >= package.base_price_cents: set FinancingPlan.status = SETTLED and case.financial_status = PAID_IN_FULL (threshold bubble-up)"

  - entity: EnhancementRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, FULFILLED]
    transitions:
      - from: REQUESTED
        to: RE_SCREENING
        trigger: "POST /enhancements/{id}/rescreen with re_screening_id"
        actor: Optometrist
        preconditions:
          - "enhancement.status == REQUESTED"
          - "within_window == true"
          - "referenced CandidacyScreening exists and belongs to enhancement.patient_id"
        side_effects:
          - "set re_screening_id"
          - "set enhancement.status = RE_SCREENING"
      - from: RE_SCREENING
        to: REQUESTED
        trigger: "POST /enhancements/{id}/return-for-revision"
        actor: Surgeon
        preconditions:
          - "enhancement.status == RE_SCREENING"
        side_effects:
          - "clear re_screening_id (set null)"
          - "set enhancement.status = REQUESTED"
        note: "revision loop — cyclic RE_SCREENING -> REQUESTED -> RE_SCREENING"
      - from: RE_SCREENING
        to: APPROVED
        trigger: "POST /enhancements/{id}/adjudicate with decision=APPROVE"
        actor: Surgeon
        preconditions:
          - "enhancement.status == RE_SCREENING"
          - "the attached re_screening_id CandidacyScreening.status == APPROVED"
        side_effects:
          - "set enhancement.status = APPROVED"
      - from: RE_SCREENING
        to: DENIED
        trigger: "POST /enhancements/{id}/adjudicate with decision=DENY"
        actor: Surgeon
        preconditions:
          - "enhancement.status == RE_SCREENING"
        side_effects:
          - "set enhancement.status = DENIED"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /enhancements/{id}/fulfill"
        actor: Surgeon
        preconditions:
          - "enhancement.status == APPROVED"
        side_effects:
          - "set enhancement.status = FULFILLED"

  - entity: RefundClaim
    initial_state: PENDING
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /refund-claims/{id}/adjudicate with decision=PAY"
        actor: Coordinator
        preconditions:
          - "claim.status == PENDING"
          - "origin case.financial_status == PAID_IN_FULL"
          - "no FULFILLED EnhancementRequest exists for the origin case"
        side_effects:
          - "compute refund_amount_cents (§1.3 refund_payout)"
          - "set claim.status = PAID"
          - "set origin case.financial_status = REFUNDED (cross-entity)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /refund-claims/{id}/adjudicate with decision=REJECT"
        actor: Coordinator
        preconditions:
          - "claim.status == PENDING"
        side_effects:
          - "set claim.status = REJECTED"

# ---------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-case
    parent_entity: SurgeryCase
    write_endpoint: "POST /cases/{id}/bookings"
    occ_field: "expected_case_version"
    description: |
      Creating a SuiteBooking against a SurgeryCase whose version has advanced
      since the client last observed it is rejected. A booking legitimately moves
      the case PLANNED -> SCHEDULED and is the natural product operation; when the
      client's observed version is stale (another writer already scheduled or
      cancelled the case), the create is refused rather than double-booking.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: cancel-stale-case
    parent_entity: SurgeryCase
    write_endpoint: "POST /cases/{id}/cancel"
    occ_field: "expected_case_version"
    description: |
      Cancelling a SurgeryCase whose version has advanced since the client last
      observed it is rejected. Cancellation is a legitimate operation from several
      non-terminal states, so a second view acting on a stale version (the case
      was progressed by another writer in the interim) is refused via OCC.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: ablation_depth_estimate
    trigger: "on POST /screenings/{id}/submit (DRAFT -> SUBMITTED)"
    algorithm: threshold
    formula: |
      # Munnerlyn-style estimate, tiered by treatment zone.
      # Round each term to whole microns AFTER summing (sum-then-round is pinned).
      raw = (OPTICAL_ZONE_MM ** 2) * refractive_error_diopters * DEPTH_PER_DIOPTER_UM
      ablation_depth_um = round(raw)   # round_half_up to whole micron
    input_set: "single CandidacyScreening's own refractive_error_diopters"
    constants:
      OPTICAL_ZONE_MM: 1.0
      DEPTH_PER_DIOPTER_UM: 12.0
    precision: "whole microns, round_half_up, applied once after the full product"

  - name: residual_bed
    trigger: "on POST /screenings/{id}/submit (DRAFT -> SUBMITTED); depends on ablation_depth_estimate output"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order pinned: ablation_depth_um MUST be computed first, then residual.
      residual_stromal_bed_um = corneal_thickness_um - FLAP_THICKNESS_UM - ablation_depth_um
    input_set: "single CandidacyScreening; consumes ablation_depth_um from ablation_depth_estimate"
    constants:
      FLAP_THICKNESS_UM: 110
    precision: "whole microns"

  - name: amortized_installment
    trigger: "on POST /cases/{id}/financing when creating an OPEN FinancingPlan (financed remainder > 0)"
    algorithm: tiered_pricing
    formula: |
      # Financed principal is the package remainder after down payment.
      principal_cents = package.base_price_cents - down_payment_cents
      monthly_rate = apr_bps / 10000 / 12       # decimal monthly rate
      if monthly_rate == 0:
        raw = principal_cents / term_months
      else:
        factor = (1 + monthly_rate) ** term_months
        raw = principal_cents * monthly_rate * factor / (factor - 1)
      monthly_installment_cents = ceil(raw)     # round UP to whole cents (pinned)
    input_set: "single FinancingPlan + its case's TreatmentPackage.base_price_cents"
    constants: {}
    precision: "whole cents, ceil (round up); computed once at plan creation"

  - name: refund_payout
    trigger: "on POST /refund-claims/{id}/adjudicate with decision=PAY (PENDING -> PAID)"
    algorithm: forward_looking
    formula: |
      # Dual-variant: mode copied from the case's package.
      # Both variants operate on money collected (FinancingPlan.amount_settled_cents).
      settled = financing_plan.amount_settled_cents      # collected to date
      if refund_mode == PRO_RATA:
        # refund everything collected MINUS the non-refundable deposit
        refund_amount_cents = max(0, settled - package.deposit_cents)
      elif refund_mode == DEPOSIT_FORFEIT:
        # forfeit deposit AND a fixed guarantee-processing fee, floored at 0
        refund_amount_cents = max(0, settled - package.deposit_cents - GUARANTEE_FEE_CENTS)
    input_set: "the RefundClaim's origin case, its OPEN/SETTLED FinancingPlan, and package"
    constants:
      GUARANTEE_FEE_CENTS: 25000
    precision: "whole cents; floor at 0"
    variants:
      - name: pro_rata
        when: "package.refund_mode == PRO_RATA"
        difference: "returns settled minus deposit"
      - name: deposit_forfeit
        when: "package.refund_mode == DEPOSIT_FORFEIT"
        difference: "returns settled minus deposit minus GUARANTEE_FEE_CENTS (larger clawback)"

  - name: enhancement_window_eval
    trigger: "on POST /enhancements (create); pins within_window"
    algorithm: threshold
    formula: |
      # Half-open eligibility window on the origin case.
      # Eligible iff now is strictly BEFORE the deadline (deadline itself is expired).
      deadline = origin_case.surgery_completed_at + origin_package.enhancement_window_days days
      within_window = (now < deadline)     # exact boundary: now == deadline is EXPIRED
    input_set: "origin SurgeryCase.surgery_completed_at + origin TreatmentPackage.enhancement_window_days + logical clock now"
    constants: {}
    precision: "datetime comparison at second resolution; strict '<' at the boundary"

# =====================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /patients and GET health"

  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "path/body-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "request body is valid JSON and required fields present with correct types"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 10
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 11
    category: state
    check: "OCC: expected_case_version equals SurgeryCase.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /cases/{id}/bookings, POST /cases/{id}/cancel"

  # ---- business rules: SAFETY first (clinical), then referential, then temporal, then fiscal ----
  - priority: 30
    category: business_safety
    check: "residual_stromal_bed_um >= MIN_RESIDUAL_BED_UM on APPROVE (else REJECT reason THIN_BED)"
    error_id: ERR_RESIDUAL_BED_TOO_THIN
    http_status: 422
    applies_to: "POST /screenings/{id}/adjudicate"

  - priority: 31
    category: business_safety
    check: "topography_k_max < MAX_SAFE_K_DIOPTERS on APPROVE (else REJECT reason HIGH_K)"
    error_id: ERR_ECTASIA_RISK_K
    http_status: 422
    applies_to: "POST /screenings/{id}/adjudicate"

  - priority: 32
    category: business_safety
    check: "refractive_error_diopters <= MAX_TREATABLE_DIOPTERS on APPROVE (else REJECT reason HIGH_ERROR)"
    error_id: ERR_ERROR_UNTREATABLE
    http_status: 422
    applies_to: "POST /screenings/{id}/adjudicate"

  - priority: 33
    category: business_safety
    check: "patient age in whole years >= MIN_AGE_YEARS on APPROVE (else REJECT reason UNDERAGE)"
    error_id: ERR_PATIENT_UNDERAGE
    http_status: 422
    applies_to: "POST /screenings/{id}/adjudicate"

  - priority: 40
    category: business_referential
    check: "SurgeryCase.screening_id references an APPROVED CandidacyScreening belonging to the case patient"
    error_id: ERR_SCREENING_NOT_APPROVED
    http_status: 422
    applies_to: "POST /cases"

  - priority: 41
    category: business_referential
    check: "consent signed_by_patient_id equals the case patient_id"
    error_id: ERR_CONSENT_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /cases/{id}/consent"

  - priority: 42
    category: business_referential
    check: "case must be funded (financial_status IN {DEPOSIT_PAID, PAID_IN_FULL}) before a booking may be created"
    error_id: ERR_CASE_NOT_FUNDED
    http_status: 422
    applies_to: "POST /cases/{id}/bookings"

  - priority: 43
    category: business_constraint
    check: "drops_regimen_started must be true to sign consent"
    error_id: ERR_DROPS_NOT_STARTED
    http_status: 422
    applies_to: "POST /cases/{id}/consent"

  - priority: 50
    category: business_temporal
    check: "SuiteBooking [slot_start, slot_end) plus the suite turnaround buffer must not overlap another ACTIVE booking on the same suite"
    error_id: ERR_SUITE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /cases/{id}/bookings"

  - priority: 51
    category: business_temporal
    check: "SuiteBooking [slot_start, slot_end) must not overlap another ACTIVE booking of the same surgeon (no buffer; bare interval overlap)"
    error_id: ERR_SURGEON_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /cases/{id}/bookings"

  - priority: 52
    category: business_temporal
    check: "slot_end must be strictly after slot_start"
    error_id: ERR_INVALID_SLOT
    http_status: 422
    applies_to: "POST /cases/{id}/bookings"

  - priority: 53
    category: business_temporal
    check: "enhancement request must be created within the origin package enhancement_window_days of origin surgery_completed_at (now < deadline)"
    error_id: ERR_ENHANCEMENT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /enhancements, POST /enhancements/{id}/rescreen"

  - priority: 54
    category: business_temporal
    check: "heal transition requires now >= surgery_completed_at + HEAL_SETTLE_DAYS"
    error_id: ERR_HEAL_TOO_EARLY
    http_status: 422
    applies_to: "POST /cases/{id}/heal"

  - priority: 60
    category: business_constraint
    check: "suite daily_case_cap not exceeded (count ACTIVE bookings on suite for the UTC day of slot_start)"
    error_id: ERR_SUITE_DAILY_CAP
    http_status: 409
    applies_to: "POST /cases/{id}/bookings"

  - priority: 61
    category: business_constraint
    check: "surgeon max_daily_cases not exceeded (count ACTIVE bookings for surgeon on the UTC day of slot_start)"
    error_id: ERR_SURGEON_DAILY_CAP
    http_status: 409
    applies_to: "POST /cases/{id}/bookings"

  - priority: 62
    category: business_constraint
    check: "suite.status == OPEN and surgeon.accepting == true when creating a booking"
    error_id: ERR_RESOURCE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /cases/{id}/bookings"

  - priority: 70
    category: business_fiscal
    check: "down_payment_cents >= package.deposit_cents when creating financing"
    error_id: ERR_DEPOSIT_TOO_LOW
    http_status: 422
    applies_to: "POST /cases/{id}/financing"

  - priority: 71
    category: business_fiscal
    check: "refund guarantee only applies when final_uncorrected_va < package.outcome_guarantee_uncorrected_va"
    error_id: ERR_GUARANTEE_NOT_MET
    http_status: 422
    applies_to: "POST /refund-claims"

  - priority: 72
    category: business_fiscal
    check: "a case with a FULFILLED enhancement cannot also be paid a refund (guarantee already honored via enhancement)"
    error_id: ERR_ENHANCEMENT_ALREADY_FULFILLED
    http_status: 409
    applies_to: "POST /refund-claims/{id}/adjudicate"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Configuration ----
  - method: POST
    path: "/refractive/packages"
    description: "create a TreatmentPackage"
    roles: [Coordinator]
    code: 201
    input: [tier, base_price_cents, deposit_cents, enhancement_window_days, outcome_guarantee_uncorrected_va, refund_mode, "active?"]
    output: TreatmentPackage
    side_effects: []
  - method: GET
    path: "/refractive/packages/{id}"
    description: "fetch a package"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: []
    output: TreatmentPackage
    side_effects: []
  - method: GET
    path: "/refractive/packages"
    description: "list packages"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: ["tier?", "active?", "limit?", "offset?"]
    output: TreatmentPackage[]
    side_effects: []

  - method: POST
    path: "/refractive/suites"
    description: "create a LaserSuite"
    roles: [Coordinator]
    code: 201
    input: [name, turnaround_buffer_minutes, daily_case_cap, "status?"]
    output: LaserSuite
    side_effects: []
  - method: GET
    path: "/refractive/suites/{id}"
    description: "fetch a suite"
    roles: [Coordinator, Surgeon]
    code: 200
    input: []
    output: LaserSuite
    side_effects: []

  - method: POST
    path: "/refractive/surgeons"
    description: "create a Surgeon"
    roles: [Coordinator]
    code: 201
    input: [full_name, max_daily_cases, "accepting?"]
    output: Surgeon
    side_effects: []
  - method: GET
    path: "/refractive/surgeons/{id}"
    description: "fetch a surgeon"
    roles: [Coordinator, Surgeon]
    code: 200
    input: []
    output: Surgeon
    side_effects: []

  - method: POST
    path: "/refractive/optometrists"
    description: "create an Optometrist"
    roles: [Coordinator]
    code: 201
    input: [full_name]
    output: Optometrist
    side_effects: []
  - method: GET
    path: "/refractive/optometrists/{id}"
    description: "fetch an optometrist"
    roles: [Coordinator, Optometrist]
    code: 200
    input: []
    output: Optometrist
    side_effects: []

  # ---- Patients ----
  - method: POST
    path: "/refractive/patients"
    description: "register a Patient (open, no auth required)"
    roles: [Anonymous, Coordinator]
    code: 201
    input: [full_name, date_of_birth, "co_managing_optometrist_id?"]
    output: Patient
    side_effects: ["Patient.status initialized to PROSPECT"]
  - method: GET
    path: "/refractive/patients/{id}"
    description: "fetch a patient"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/refractive/patients"
    description: "list patients (filtered-list reverse-reachability for Patient.co_managing_optometrist_id)"
    roles: [Coordinator, Surgeon, Optometrist]
    code: 200
    input: ["co_managing_optometrist_id?", "status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []
  - method: GET
    path: "/refractive/patients/{id}/screenings"
    description: "list a patient's candidacy screenings (FK reverse-reachability for CandidacyScreening.patient_id)"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: []
    output: CandidacyScreening[]
    side_effects: []

  # ---- Candidacy screening ----
  - method: POST
    path: "/refractive/screenings"
    description: "create a DRAFT CandidacyScreening"
    roles: [Optometrist]
    code: 201
    input: [patient_id, performed_by_optometrist_id, corneal_thickness_um, topography_k_max, refractive_error_diopters]
    output: CandidacyScreening
    side_effects: []
  - method: GET
    path: "/refractive/screenings/{id}"
    description: "fetch a screening"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: []
    output: CandidacyScreening
    side_effects: []
  - method: GET
    path: "/refractive/screenings"
    description: "list screenings (filtered-list reverse-reachability for performed_by_optometrist_id)"
    roles: [Coordinator, Surgeon, Optometrist]
    code: 200
    input: ["patient_id?", "performed_by_optometrist_id?", "status?", "limit?", "offset?"]
    output: CandidacyScreening[]
    side_effects: []
  - method: POST
    path: "/refractive/screenings/{id}/submit"
    description: "DRAFT -> SUBMITTED; computes ablation_depth_um + residual_stromal_bed_um"
    roles: [Optometrist]
    code: 200
    input: []
    output: CandidacyScreening
    side_effects: ["compute ablation_depth_um (§1.3)", "compute residual_stromal_bed_um (§1.3)"]
  - method: POST
    path: "/refractive/screenings/{id}/adjudicate"
    description: "SUBMITTED -> APPROVED or REJECTED (safety gates)"
    roles: [Surgeon]
    code: 200
    input: [decision]
    output: CandidacyScreening
    side_effects: ["on APPROVE set Patient.status=CANDIDATE", "on REJECT set rejection_reason + possibly Patient.status=INELIGIBLE"]

  # ---- Surgery cases (parallel state machine) ----
  - method: POST
    path: "/refractive/cases"
    description: "create a SurgeryCase (PLANNED/UNFUNDED)"
    roles: [Coordinator]
    code: 201
    input: [patient_id, screening_id, package_id]
    output: SurgeryCase
    side_effects: []
  - method: GET
    path: "/refractive/cases/{id}"
    description: "fetch a case"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: []
    output: SurgeryCase
    side_effects: []
  - method: GET
    path: "/refractive/cases"
    description: "list cases (filtered-list reverse-reachability for patient_id, screening_id, package_id)"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: ["patient_id?", "screening_id?", "package_id?", "clinical_status?", "financial_status?", "limit?", "offset?"]
    output: SurgeryCase[]
    side_effects: []
  - method: POST
    path: "/refractive/cases/{id}/financing"
    description: "create FinancingPlan; UNFUNDED -> DEPOSIT_PAID or PAID_IN_FULL"
    roles: [Coordinator]
    code: 201
    input: [down_payment_cents, term_months, apr_bps]
    output: FinancingPlan
    side_effects: ["compute monthly_installment_cents (§1.3)", "set case.financial_status", "set amount_settled_cents = down_payment_cents"]
  - method: GET
    path: "/refractive/cases/{id}/financing"
    description: "list financing plans of a case (FK reverse-reachability for FinancingPlan.case_id)"
    roles: [Coordinator, Patient]
    code: 200
    input: []
    output: FinancingPlan[]
    side_effects: []
  - method: POST
    path: "/refractive/cases/{id}/bookings"
    description: "create a SuiteBooking; PLANNED -> SCHEDULED (OCC guarded)"
    roles: [Coordinator]
    code: 201
    input: [suite_id, surgeon_id, slot_start, slot_end, expected_case_version]
    output: SuiteBooking
    side_effects: ["create SuiteBooking ACTIVE", "set case.clinical_status=SCHEDULED", "increments SurgeryCase.version by 1"]
  - method: GET
    path: "/refractive/cases/{id}/bookings"
    description: "list bookings of a case (FK reverse-reachability for SuiteBooking.case_id)"
    roles: [Coordinator, Surgeon, Patient]
    code: 200
    input: []
    output: SuiteBooking[]
    side_effects: []
  - method: GET
    path: "/refractive/bookings"
    description: "list suite bookings (filtered-list reverse-reachability for SuiteBooking.suite_id and SuiteBooking.surgeon_id)"
    roles: [Coordinator, Surgeon]
    code: 200
    input: ["suite_id?", "surgeon_id?", "case_id?", "status?", "limit?", "offset?"]
    output: SuiteBooking[]
    side_effects: []
  - method: GET
    path: "/refractive/bookings/{id}"
    description: "fetch a suite booking"
    roles: [Coordinator, Surgeon, Patient]
    code: 200
    input: []
    output: SuiteBooking
    side_effects: []
  - method: GET
    path: "/refractive/consent-forms"
    description: "list consent forms (filtered-list reverse-reachability for ConsentForm.signed_by_patient_id)"
    roles: [Coordinator, Surgeon, Patient]
    code: 200
    input: ["signed_by_patient_id?", "case_id?", "status?", "limit?", "offset?"]
    output: ConsentForm[]
    side_effects: []
  - method: GET
    path: "/refractive/consent-forms/{id}"
    description: "fetch a consent form"
    roles: [Coordinator, Surgeon, Patient]
    code: 200
    input: []
    output: ConsentForm
    side_effects: []
  - method: POST
    path: "/refractive/cases/{id}/consent"
    description: "sign ConsentForm; SCHEDULED -> CONSENTED"
    roles: [Patient]
    code: 201
    input: [drops_regimen_started, signed_by_patient_id]
    output: ConsentForm
    side_effects: ["create ConsentForm SIGNED", "stamp signed_at", "set case.clinical_status=CONSENTED"]
  - method: GET
    path: "/refractive/cases/{id}/consent"
    description: "list consent forms of a case (FK reverse-reachability for ConsentForm.case_id)"
    roles: [Coordinator, Surgeon, Patient]
    code: 200
    input: []
    output: ConsentForm[]
    side_effects: []
  - method: POST
    path: "/refractive/cases/{id}/operate"
    description: "CONSENTED -> OPERATED; stamps surgery_completed_at"
    roles: [Surgeon]
    code: 200
    input: []
    output: SurgeryCase
    side_effects: ["set clinical_status=OPERATED", "stamp surgery_completed_at", "set Patient.status=OPERATED"]
  - method: POST
    path: "/refractive/cases/{id}/heal"
    description: "OPERATED -> HEALED; records final_uncorrected_va"
    roles: [Surgeon]
    code: 200
    input: [final_uncorrected_va]
    output: SurgeryCase
    side_effects: ["set final_uncorrected_va", "set clinical_status=HEALED"]
  - method: POST
    path: "/refractive/cases/{id}/cancel"
    description: "cancel case; cascades to bookings, consent, financing (OCC guarded)"
    roles: [Coordinator]
    code: 200
    input: [expected_case_version]
    output: SurgeryCase
    side_effects: ["set clinical_status=CANCELLED", "RELEASE active bookings", "REVOKE signed consents", "CANCEL open financing + maybe flip financial_status", "increments SurgeryCase.version by 1"]

  # ---- Financing installments ----
  - method: POST
    path: "/refractive/financing/{id}/installments"
    description: "post an installment; may drive DEPOSIT_PAID -> PAID_IN_FULL"
    roles: [Coordinator]
    code: 201
    input: [amount_cents]
    output: FinancingPlan
    side_effects: ["add amount_cents to amount_settled_cents", "threshold: settle plan + flip case.financial_status when fully paid"]
  - method: GET
    path: "/refractive/financing/{id}"
    description: "fetch a financing plan"
    roles: [Coordinator, Patient]
    code: 200
    input: []
    output: FinancingPlan
    side_effects: []

  # ---- Enhancement (cyclic) ----
  - method: POST
    path: "/refractive/enhancements"
    description: "create an EnhancementRequest against a HEALED origin case; pins within_window"
    roles: [Patient, Coordinator]
    code: 201
    input: [origin_case_id, patient_id, reason]
    output: EnhancementRequest
    side_effects: ["compute within_window (§1.3)"]
  - method: GET
    path: "/refractive/enhancements/{id}"
    description: "fetch an enhancement request"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: []
    output: EnhancementRequest
    side_effects: []
  - method: GET
    path: "/refractive/enhancements"
    description: "list enhancement requests (filtered-list reverse-reachability for origin_case_id, patient_id, re_screening_id)"
    roles: [Coordinator, Surgeon, Optometrist, Patient]
    code: 200
    input: ["origin_case_id?", "patient_id?", "re_screening_id?", "status?", "limit?", "offset?"]
    output: EnhancementRequest[]
    side_effects: []
  - method: POST
    path: "/refractive/enhancements/{id}/rescreen"
    description: "REQUESTED -> RE_SCREENING; attaches a re_screening"
    roles: [Optometrist]
    code: 200
    input: [re_screening_id]
    output: EnhancementRequest
    side_effects: ["set re_screening_id", "set status=RE_SCREENING"]
  - method: POST
    path: "/refractive/enhancements/{id}/return-for-revision"
    description: "RE_SCREENING -> REQUESTED (revision loop)"
    roles: [Surgeon]
    code: 200
    input: []
    output: EnhancementRequest
    side_effects: ["clear re_screening_id", "set status=REQUESTED"]
  - method: POST
    path: "/refractive/enhancements/{id}/adjudicate"
    description: "RE_SCREENING -> APPROVED or DENIED"
    roles: [Surgeon]
    code: 200
    input: [decision]
    output: EnhancementRequest
    side_effects: ["set status=APPROVED or DENIED"]
  - method: POST
    path: "/refractive/enhancements/{id}/fulfill"
    description: "APPROVED -> FULFILLED"
    roles: [Surgeon]
    code: 200
    input: []
    output: EnhancementRequest
    side_effects: ["set status=FULFILLED"]

  # ---- Refund claims (dual variant) ----
  - method: POST
    path: "/refractive/refund-claims"
    description: "create a PENDING RefundClaim for a HEALED case that missed its guarantee"
    roles: [Coordinator, Patient]
    code: 201
    input: [case_id]
    output: RefundClaim
    side_effects: ["copy measured_uncorrected_va + refund_mode from case/package"]
  - method: GET
    path: "/refractive/refund-claims/{id}"
    description: "fetch a refund claim"
    roles: [Coordinator, Patient]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []
  - method: GET
    path: "/refractive/refund-claims"
    description: "list refund claims (filtered-list reverse-reachability for case_id)"
    roles: [Coordinator, Patient]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: RefundClaim[]
    side_effects: []
  - method: POST
    path: "/refractive/refund-claims/{id}/adjudicate"
    description: "PENDING -> PAID or REJECTED; computes refund_amount_cents"
    roles: [Coordinator]
    code: 200
    input: [decision]
    output: RefundClaim
    side_effects: ["compute refund_amount_cents (§1.3 refund_payout)", "on PAY set case.financial_status=REFUNDED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/refractive/_clock/set_current_utc"
    description: "set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["advance logical clock used for all timestamp stamping and window checks"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on a protected endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "authenticated role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, or wrong type"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a state from which this transition is defined"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match current SurgeryCase.version"
  - id: ERR_RESIDUAL_BED_TOO_THIN
    http: 422
    condition: "APPROVE attempted but residual_stromal_bed_um < MIN_RESIDUAL_BED_UM"
  - id: ERR_ECTASIA_RISK_K
    http: 422
    condition: "APPROVE attempted but topography_k_max >= MAX_SAFE_K_DIOPTERS"
  - id: ERR_ERROR_UNTREATABLE
    http: 422
    condition: "APPROVE attempted but refractive_error_diopters > MAX_TREATABLE_DIOPTERS"
  - id: ERR_PATIENT_UNDERAGE
    http: 422
    condition: "APPROVE attempted but patient age < MIN_AGE_YEARS"
  - id: ERR_SCREENING_NOT_APPROVED
    http: 422
    condition: "case screening_id is not an APPROVED screening for the case patient"
  - id: ERR_CONSENT_PATIENT_MISMATCH
    http: 422
    condition: "consent signed_by_patient_id != case.patient_id"
  - id: ERR_CASE_NOT_FUNDED
    http: 422
    condition: "booking attempted while case.financial_status == UNFUNDED"
  - id: ERR_DROPS_NOT_STARTED
    http: 422
    condition: "consent attempted with drops_regimen_started == false"
  - id: ERR_SUITE_TIME_CONFLICT
    http: 409
    condition: "booking interval + suite turnaround buffer overlaps an existing ACTIVE booking on the suite"
  - id: ERR_SURGEON_TIME_CONFLICT
    http: 409
    condition: "booking interval overlaps an existing ACTIVE booking of the surgeon (bare overlap, no buffer)"
  - id: ERR_INVALID_SLOT
    http: 422
    condition: "slot_end not strictly after slot_start"
  - id: ERR_ENHANCEMENT_WINDOW_EXPIRED
    http: 422
    condition: "now >= origin surgery_completed_at + enhancement_window_days"
  - id: ERR_HEAL_TOO_EARLY
    http: 422
    condition: "heal attempted before surgery_completed_at + HEAL_SETTLE_DAYS"
  - id: ERR_SUITE_DAILY_CAP
    http: 409
    condition: "suite daily_case_cap reached for the UTC day of slot_start"
  - id: ERR_SURGEON_DAILY_CAP
    http: 409
    condition: "surgeon max_daily_cases reached for the UTC day of slot_start"
  - id: ERR_RESOURCE_UNAVAILABLE
    http: 409
    condition: "suite not OPEN or surgeon not accepting at booking time"
  - id: ERR_DEPOSIT_TOO_LOW
    http: 422
    condition: "down_payment_cents < package.deposit_cents"
  - id: ERR_GUARANTEE_NOT_MET
    http: 422
    condition: "refund claim created but final_uncorrected_va >= package.outcome_guarantee_uncorrected_va"
  - id: ERR_ENHANCEMENT_ALREADY_FULFILLED
    http: 409
    condition: "refund PAY attempted while a FULFILLED EnhancementRequest exists for the origin case"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Coordinator
    description: "front-desk / operations staff: manage config, cases, scheduling, financing, refunds"
    identity: opaque
    exclusive_operations:
      - "create packages, suites, surgeons, optometrists"
      - "create SurgeryCase"
      - "create financing + post installments"
      - "create SuiteBooking (schedule) + cancel case"
      - "adjudicate refund claims"
    shared_operations:
      - "register patients (shared with Anonymous)"
      - "create enhancement requests (shared with Patient)"
      - "create refund claims (shared with Patient)"
      - "read endpoints"

  - name: Surgeon
    description: "operating surgeon: adjudicates screenings/enhancements, operates and heals cases"
    identity: "entity_backed:Surgeon"
    exclusive_operations:
      - "adjudicate CandidacyScreening (APPROVE/REJECT)"
      - "operate case (CONSENTED -> OPERATED)"
      - "heal case (OPERATED -> HEALED)"
      - "adjudicate/return/fulfill enhancement requests"
    shared_operations:
      - "read endpoints"

  - name: Optometrist
    description: "co-managing optometrist: performs candidacy screening + enhancement re-screening"
    identity: "entity_backed:Optometrist"
    exclusive_operations:
      - "create + submit CandidacyScreening"
      - "attach re-screening to an enhancement (rescreen)"
    shared_operations:
      - "read endpoints"

  - name: Patient
    description: "the patient acting on their own case: signs consent, requests enhancements/refunds"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "sign consent for own case"
    shared_operations:
      - "create enhancement requests (shared with Coordinator)"
      - "create refund claims (shared with Coordinator)"
      - "read endpoints for own resources"

  - name: Anonymous
    description: "unauthenticated caller; may only self-register as a patient"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "register patient (shared with Coordinator)"
