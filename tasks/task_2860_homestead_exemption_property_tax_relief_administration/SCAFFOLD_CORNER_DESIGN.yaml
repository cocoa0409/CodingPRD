          - entities.ExemptionGrant.fields.relief_multiplier_bps
          - calculations.exemption_benefit_amount
        distinguishing_aspect: "household_income_cents 4500000 against income_limit_cents 6000000 satisfies income * 4 <= limit * 3 with equality, so the inclusive upper edge yields TIER_HIGH / 7500 bps (not TIER_PARTIAL / 5000), giving benefit 7560000 rather than 5040000."
        test_recipe:
          setup:
            - "DISABILITY_INCOME program: relief 3000 bps, ceiling 10000000, income_limit 6000000, asset_limit 2000000, requires_income_certification true, rank 20."
            - "IncomeCertification for 2026 declares household_income_cents 4500000 (exactly 75% of the limit) and countable_asset_cents 1000000 (under the asset limit)."
            - "An INCOME_DOR registry record reporting 4500000 makes the INCOME_DOR check MATCH, which certifies the PENDING certification."
            - "Arithmetic: 33600000 * 3000/10000 = 10080000; * 7500/10000 = 7560000; min(10000000, 7560000) = 7560000; * 10000/10000 = 7560000."
