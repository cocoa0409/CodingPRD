              as_user_id: "rate-1"
            - call: "POST /fuel-index-postings"
              payload: { posting_date: "2026-08-03", diesel_price_cents_per_gallon: 300 }
              as: TariffAnalyst
              as_user_id: "analyst-1"
            - call: "POST /river-stage-readings"
