              as: Inspector
              as_user_id: "insp-1"
              captures: { co_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:00:00Z" }
              as: HealthAuthorityAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/${fac_b_id}/water-readings"
              payload: { sampled_at: "2026-05-01T01:30:00Z", source: "REOPEN_VERIFICATION", free_chlorine_ppm: 2.5, combined_chloramine_ppm: 0.1, ph: 7.4, water_temp_f: 82.0 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rd_b_id: $.data.id }
