      - name: corner_tiered_pricing_boundaries
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: mode_a_nested_min_max_tier1_cap_clamps_assessment
          rationale: "The tiered_pricing boundary claims (tier selection, marginal versus average behaviour, straddling the cap) are driven there through the nested min(max(raw, min_fee), cap) clamp on a TIER_1 SHP-04 assessment, with the pre-clamp and post-clamp amounts both pinned."

      - name: corner_threshold_algorithm_boundary
        claim_type: threshold
        excluded_because:
          difficulty_instance: boundary_vendor_exposure_alert_at_exactly_the_alert_threshold
          rationale: "The threshold claims at value-1 / value / value+1 are covered there against VENDOR_EXPOSURE_ALERT_CENTS, asserting exposure_alert_flag on both sides of the >= comparison from the same endpoint."

      - name: corner_waterfall_allocation_overflow
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: boundary_cash_application_exact_payoff_versus_one_cent_over
          rationale: "First-bucket-fills-before-overflow and remainder handling for chargeback_settlement_reconciliation are asserted there: the exact-payoff application succeeds and lands on RECOVERED while one cent more is refused with ERR_OVER_APPLICATION."

      - name: corner_constraint_propagation_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: mode_c_dispute_goodwill_uplift_pinned_evaluation_order
          rationale: "The constraint_propagation claims (change propagates through the chain, reaches a fixed point, no infinite loop) are driven there through the pinned S1..S7 ladder of dispute_reversal_determination, where the goodwill uplift is granted against the pre-goodwill classification and never withdrawn by the re-classification."

      - name: corner_aggregation_running_total
        claim_type: aggregation
        excluded_because:
          difficulty_instance: mode_b_fill_rate_round_then_average_versus_sum_then_round
          rationale: "The aggregation claims about accumulation order and rounding of the running total are covered there, where the same order set is aggregated under both rounding orders and the two fill_rate_pct results are pinned as literals."

      - name: corner_variant_divergence_on_identical_data
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: dual_variant_chargeback_grace_vs_standard_on_chargeback_money
          rationale: "Same-data / different-result divergence with an explicit delta is that instance's whole purpose for chargeback_assessment; repeating it here would only re-assert the same two gross_assessed_cents literals."

      - name: corner_variant_switch_reconciliation
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: dual_variant_otif_order_weighted_vs_unit_weighted_on_vendor_performance
          rationale: "The reconciliation claim (variant switch, delta applied downstream) is covered there: the scorecard is re-measured under the second variant and the finalized composite_score that propagates to Vendor.otif_score is asserted for the switched variant."
