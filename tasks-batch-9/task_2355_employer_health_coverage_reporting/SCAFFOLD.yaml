# =============================================================================
# PRD Benchmark Seed Tables — Employer Health Coverage Reporting (ALE reporting)
# Difficulty band: beyond Expert (§0.4) — 16 entities / 8 state machines / 7 calculations
# / 45 ordered validations / 69 endpoints / 53 errors / 5 roles
# =============================================================================

scenario: |
  2355. Employer Health Coverage Reporting (applicable large employer reporting team): applicable large employer determination through full-time equivalent counting across controlled group members, monthly full-time employee identification under look-back or monthly measurement methods, affordability safe harbor selection and testing at the employee level, offer of coverage code assignment by month with special situations for leaves, transfers and terminations, form generation, employee furnishing deadlines and electronic delivery consent, agency filing with error correction cycles and threshold-based transmission, proposed penalty notice response with evidence of offers, controlled group allocation and prior-year corrections

domain_name: employer-health-coverage-reporting
api_prefix: /ale-reporting

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a top-level collection under /ale-reporting joined by explicit
  # foreign keys; only read-side sub-resources (`/forms-1095c/{id}/monthly-lines`)
  # nest, and they nest for reverse reachability, not ownership.

  state_machine_shape: cyclic
  # Transmittal loops TRANSMITTED -> ACCEPTED_WITH_ERRORS -> CORRECTION_REQUIRED ->
  # BUILT (cycle_number++), FurnishingConsent loops GRANTED -> WITHDRAWN -> GRANTED,
  # ControlledGroup loops DETERMINED_ALE -> CORRECTION_OPEN -> DETERMINED_ALE,
  # Employee loops ACTIVE -> ON_LEAVE -> ACTIVE, Form1095C carries two independent
  # dimensions (furnishing_status x filing_status), PenaltyNotice forks into
  # {ABATED_FULL, ABATED_PARTIAL, SUSTAINED}.

  relationship_patterns:
    - one_to_many          # ControlledGroup -> GroupMember -> Employee -> HoursRecord
    - self_referential     # Form1095C.corrected_from_form_id -> Form1095C.id
    - cross_aggregate      # PenaltyEvidence -> Employee across the notice aggregate
    - polymorphic          # MeasurementCycle attaches to a member (STANDARD) or an employee (INITIAL)

  role_model: segregation_of_duties
  # The user id that generated a Form1095C may not furnish it; the user id that
  # built a Transmittal may not transmit it; the user id that filed the last
  # evidence on a PenaltyNotice may not submit the notice response.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FilingSeason
    parent: null
    common_fields: true
    fields:
      - name: tax_year
        type: integer
        source: input
        description: Calendar year being reported (Forms 1094-C/1095-C tax year).
        constraints: "2020..2035; unique across FilingSeason"
      - name: status
        type: enum
        source: system
        description: Season lifecycle gate for every filing/furnishing write.
        default: OPEN
        constraints: "OPEN | LOCKED"
      - name: affordability_pct
        type: number
        source: input
        description: Required-contribution percentage used by every affordability safe harbor.
        default: 0.0902
        constraints: "0 < value < 1; 4 decimal places"
      - name: mainland_fpl_annual_cents
        type: integer
        source: input
        description: Mainland federal poverty line annual figure driving the FPL safe harbor and the 1A qualifying-offer test.
        default: 1560000
      - name: penalty_a_annual_cents
        type: integer
        source: input
        description: Annual 4980H(a) per-employee amount; monthly amount is floor(value / 12).
        default: 296400
      - name: penalty_b_annual_cents
        type: integer
        source: input
        description: Annual 4980H(b) per-employee amount; monthly amount is floor(value / 12).
        default: 444000
      - name: electronic_filing_threshold
        type: integer
        source: input
        description: Aggregate return count at or above which electronic transmission is mandatory.
        default: 10
      - name: furnishing_deadline_date
        type: string
        source: input
        description: Last date (inclusive, UTC date) on which a Form1095C may be furnished without penalty.
        constraints: "YYYY-MM-DD"
      - name: filing_deadline_date
        type: string
        source: input
        description: Last date (inclusive, UTC date) on which a Transmittal may be transmitted on time.
        constraints: "YYYY-MM-DD"
      - name: tier2_cutoff_date
        type: string
        source: input
        description: Date at or after which late furnishing moves from tier 2 to tier 3 pricing.
        constraints: "YYYY-MM-DD"
      - name: open_correction_count
        type: integer
        source: computed
        description: Count of ControlledGroup rows of this season whose determination_state == CORRECTION_OPEN; blocks lock while > 0.
        default: 0
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant at which the season was locked; null while OPEN.

  - name: ControlledGroup
    parent: null
    common_fields: true
    fields:
      - name: filing_season_id
        type: string
        source: input
        description: "FK -> FilingSeason.id; the season whose constants and deadlines govern this group"
      - name: name
        type: string
        source: input
        description: Aggregated ALE group label.
      - name: determination_state
        type: enum
        source: system
        description: ALE determination lifecycle; gates form generation for every member.
        default: NOT_DETERMINED
        constraints: "NOT_DETERMINED | DETERMINED_ALE | DETERMINED_NON_ALE | REOPENED | CORRECTION_OPEN | LOCKED"
      - name: determination_basis
        type: enum
        source: computed
        description: Which counting basis produced the current determination.
        constraints: "AGGREGATED | SINGLE_MEMBER; null while NOT_DETERMINED"
      - name: single_member_id
        type: string
        source: computed
        description: GroupMember id counted alone when determination_basis == SINGLE_MEMBER (see GroupMember.controlled_group_id for the canonical link); null otherwise.
      - name: monthly_group_fte
        type: array
        source: computed
        description: Twelve integers, index 0 = January of (tax_year - 1); each is floor of the summed member FTE for that month.
      - name: annual_average_fte_raw
        type: number
        source: computed
        description: round_half_up(sum(monthly_group_fte) / 12, 2) before truncation.
      - name: annual_average_fte
        type: integer
        source: computed
        description: floor(annual_average_fte_raw); compared against ALE_THRESHOLD.
      - name: ale_reason
        type: enum
        source: computed
        description: Why the determination landed where it did.
        constraints: "THRESHOLD_MET | BELOW_THRESHOLD | SEASONAL_EXCEPTION; null while NOT_DETERMINED"
      - name: seasonal_exception_applied
        type: boolean
        source: computed
        description: True when the seasonal-worker exception overrode a threshold-met count.
        default: false
      - name: open_correction_count
        type: integer
        source: computed
        description: Count of Form1095C rows of this group whose furnishing_status == REDELIVERY_REQUIRED or filing_status == CORRECTION_DRAFTED.
        default: 0
      - name: determined_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent determination; null while NOT_DETERMINED.
      - name: last_determination_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who ran the most recent determination.

  - name: GroupMember
    parent: null
    common_fields: true
    fields:
      - name: controlled_group_id
        type: string
        source: input
        description: "FK -> ControlledGroup.id; the aggregated group this EIN belongs to"
      - name: ein
        type: string
        source: input
        description: Employer identification number of this ALE member.
        constraints: "9 digits; unique within controlled_group_id"
      - name: legal_name
        type: string
        source: input
        description: Legal name printed on the member's 1094-C.
      - name: ownership_pct
        type: number
        source: input
        description: Common-ownership percentage inside the controlled group.
        constraints: "0 < value <= 100"
      - name: measurement_method
        type: enum
        source: input
        description: Member-wide default method for identifying full-time employees.
        default: LOOK_BACK
        constraints: "LOOK_BACK | MONTHLY"
      - name: member_status
        type: enum
        source: system
        description: Whether the member participates in aggregation and allocation.
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: generated_form_count
        type: integer
        source: computed
        description: Count of Form1095C rows of this member's employees whose filing_status != VOIDED.
        default: 0
      - name: unattached_form_count
        type: integer
        source: computed
        description: Count of Form1095C rows of this member's employees whose filing_status == NOT_FILED.
        default: 0
      - name: attached_form_count
        type: integer
        source: computed
        description: Count of Form1095C rows of this member's employees whose filing_status IN {ATTACHED, PENDING_FILING, FILED_ACCEPTED, FILED_WITH_ERRORS, CORRECTION_DRAFTED}.
        default: 0
      - name: reporting_year_ft_months
        type: integer
        source: computed
        description: Sum over months 1..12 of MonthlyHeadcount.full_time_employee_count where count_year == REPORTING_YEAR; the allocation weight for penalties and the 30-employee exclusion.
        default: 0
      - name: allocated_exclusion_employees
        type: integer
        source: computed
        description: Whole-employee share of the 30-employee 4980H(a) exclusion allocated to this member by largest-remainder.
        default: 0
      - name: allocated_penalty_cents
        type: integer
        source: computed
        description: Cents of the group's recalculated penalty allocated to this member.
        default: 0
      - name: furnishing_penalty_total_cents
        type: integer
        source: computed
        description: Sum of Form1095C.late_furnishing_penalty_cents over this member's employees.
        default: 0
      - name: open_transmittal_id
        type: string
        source: computed
        description: Id of this member's transmittal whose status IN {DRAFT, BUILT, TRANSMITTED, ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED, REJECTED, CORRECTION_REQUIRED} (see Transmittal.group_member_id for the canonical link); null when none.

  - name: MonthlyHeadcount
    parent: null
    common_fields: false
    fields:
      - name: group_member_id
        type: string
        source: input
        description: "FK -> GroupMember.id; the EIN whose monthly counts these are"
      - name: count_year
        type: enum
        source: input
        description: PRIOR_YEAR rows feed ALE determination (calendar year tax_year-1); REPORTING_YEAR rows feed 1094-C Part III and penalty math.
        constraints: "PRIOR_YEAR | REPORTING_YEAR"
      - name: month
        type: integer
        source: input
        description: Calendar month 1..12 within count_year.
        constraints: "1..12; unique per (group_member_id, count_year, month)"
      - name: full_time_employee_count
        type: integer
        source: input
        description: Employees averaging at least 130 hours of service in this month.
        constraints: ">= 0"
      - name: part_time_hours_total
        type: integer
        source: input
        description: Aggregate hours of service of non-full-time employees for this month, already capped at 120 per employee.
        constraints: ">= 0"
      - name: total_employee_count
        type: integer
        source: input
        description: All employees on any day of the month, for 1094-C Part III column (b).
        constraints: ">= 0"
      - name: seasonal_excess_count
        type: integer
        source: input
        description: Of the counted employees, how many were seasonal workers; used only by the seasonal-worker exception.
        default: 0
      - name: member_fte
        type: number
        source: computed
        description: full_time_employee_count + round_half_up(part_time_hours_total / 120, 2), frozen at creation.

  - name: MeasurementCycle
    parent: null
    common_fields: false
    fields:
      - name: group_member_id
        type: string
        source: input
        description: "FK -> GroupMember.id; the member whose look-back configuration this is"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; set only for cycle_type == INITIAL, null for member-wide STANDARD cycles"
      - name: cycle_type
        type: enum
        source: input
        description: STANDARD applies to every ongoing employee of the member; INITIAL applies to one newly hired variable-hour employee.
        constraints: "STANDARD | INITIAL"
      - name: measurement_start_date
        type: string
        source: input
        description: First date of the measurement period (inclusive).
        constraints: "YYYY-MM-DD"
      - name: measurement_end_date
        type: string
        source: input
        description: Last date of the measurement period (inclusive).
        constraints: "YYYY-MM-DD; >= measurement_start_date"
      - name: admin_period_end_date
        type: string
        source: input
        description: Last date of the administrative period (inclusive); months fully inside it are limited non-assessment months.
        constraints: "YYYY-MM-DD; >= measurement_end_date"
      - name: stability_start_date
        type: string
        source: input
        description: First date of the stability period (inclusive).
        constraints: "YYYY-MM-DD; > admin_period_end_date"
      - name: stability_end_date
        type: string
        source: input
        description: Last date of the stability period (inclusive).
        constraints: "YYYY-MM-DD; >= stability_start_date"
      - name: hours_threshold_monthly
        type: integer
        source: input
        description: Monthly average hours at or above which the employee is full time for the stability period.
        default: 130

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: group_member_id
        type: string
        source: input
        description: "FK -> GroupMember.id; the EIN currently employing this person"
      - name: full_name
        type: string
        source: input
        description: Name printed on the 1095-C.
      - name: ssn_last4
        type: string
        source: input
        description: Last four digits of the taxpayer identification number.
        constraints: "exactly 4 digits"
      - name: hire_date
        type: string
        source: input
        description: First date of employment in the reporting year or earlier.
        constraints: "YYYY-MM-DD"
      - name: termination_date
        type: string
        source: system
        description: Effective date of the TERMINATION EmploymentEvent; null while never terminated.
      - name: employment_type
        type: enum
        source: input
        description: Hiring classification; VARIABLE_HOUR and SEASONAL hires require an INITIAL MeasurementCycle under LOOK_BACK.
        constraints: "FULL_TIME | PART_TIME | VARIABLE_HOUR | SEASONAL"
      - name: employment_status
        type: enum
        source: system
        description: Employment dimension driven by EmploymentEvent rows; a TRANSFER keeps the row ACTIVE and only moves group_member_id.
        default: ACTIVE
        constraints: "ACTIVE | ON_LEAVE | TERMINATED"
      - name: open_leave_type
        type: enum
        source: system
        description: Leave type of the currently open leave; null unless employment_status == ON_LEAVE.
        constraints: "FMLA | USERRA | JURY_DUTY | UNPAID_OTHER"
      - name: is_hourly
        type: boolean
        source: input
        description: True when the rate-of-pay safe harbor uses hourly_rate_cents rather than monthly_salary_cents.
      - name: hourly_rate_cents
        type: integer
        source: input
        description: Lowest hourly rate of pay in the reporting year; required when is_hourly is true.
      - name: monthly_salary_cents
        type: integer
        source: input
        description: Monthly salary; required when is_hourly is false.
      - name: w2_box1_wages_cents
        type: integer
        source: input
        description: Box 1 wages for the reporting year; 0 means the W-2 safe harbor has no data and is skipped.
        default: 0
      - name: measurement_method_override
        type: enum
        source: input
        description: Overrides the member's measurement_method for this employee only.
        constraints: "LOOK_BACK | MONTHLY; null to inherit"
      - name: effective_measurement_method
        type: enum
        source: computed
        description: measurement_method_override when set, else GroupMember.measurement_method.
        constraints: "LOOK_BACK | MONTHLY"
      - name: full_time_months
        type: array
        source: computed
        description: Ascending list of months 1..12 in which the employee is full time under effective_measurement_method.
      - name: full_time_month_count
        type: integer
        source: computed
        description: Length of full_time_months.
        default: 0
      - name: measured_average_hours
        type: number
        source: computed
        description: round_half_up(counted hours / counted months, 2) over the governing MeasurementCycle; null under MONTHLY.
      - name: ft_source_by_month
        type: array
        source: computed
        description: Twelve strings, index 0 = January, each one of LOOK_BACK_STABILITY | MONTHLY_ACTUAL | LNAP | NOT_EMPLOYED.
      - name: last_recomputed_at
        type: datetime
        source: system
        description: Logical-clock instant of the last full-time recompute; null until first recompute.

  - name: HoursRecord
    parent: null
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the person whose hours these are"
      - name: measurement_year
        type: integer
        source: input
        description: Calendar year the month belongs to; look-back cycles read prior-year months, the monthly method reads reporting-year months.
      - name: month
        type: integer
        source: input
        description: Calendar month 1..12.
        constraints: "1..12; unique per (employee_id, measurement_year, month)"
      - name: hours_of_service
        type: integer
        source: input
        description: Paid working hours credited in the month.
        constraints: ">= 0"
      - name: paid_leave_hours
        type: integer
        source: input
        description: Paid non-working hours credited in the month; counted with hours_of_service.
        default: 0
      - name: special_unpaid_leave_hours
        type: integer
        source: input
        description: Unpaid FMLA/USERRA/jury-duty hours; never added to the numerator.
        default: 0
      - name: counted_hours
        type: integer
        source: computed
        description: hours_of_service + paid_leave_hours, frozen at creation.
      - name: excluded_from_denominator
        type: boolean
        source: computed
        description: True when special_unpaid_leave_hours >= 130, which drops the month from the look-back denominator.

  - name: EmploymentEvent
    parent: null
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the person the event happened to"
      - name: event_type
        type: enum
        source: input
        description: Employment change recorded on the append-only log.
        constraints: "TERMINATION | LEAVE_START | LEAVE_END | TRANSFER | REHIRE"
      - name: effective_date
        type: string
        source: input
        description: UTC date the event takes effect.
        constraints: "YYYY-MM-DD"
      - name: leave_type
        type: enum
        source: input
        description: Required for LEAVE_START, forbidden otherwise.
        constraints: "FMLA | USERRA | JURY_DUTY | UNPAID_OTHER"
      - name: to_group_member_id
        type: string
        source: input
        description: "FK -> GroupMember.id; destination member, required for TRANSFER and forbidden otherwise"
      - name: note
        type: string
        source: input
        description: Free-text audit note.
      - name: resulting_status
        type: enum
        source: computed
        description: Employee.employment_status after the event was applied.
        constraints: "ACTIVE | ON_LEAVE | TERMINATED"
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the BenefitsAdmin who recorded the event.

  - name: CoverageOffer
    parent: null
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the person the offer was made to"
      - name: offer_kind
        type: enum
        source: input
        description: Shape of the offer, which drives the line 14 code.
        constraints: "NO_OFFER | MEC_NO_MV | MEC_MV_SELF_ONLY | MEC_MV_SELF_SPOUSE | MEC_MV_SELF_DEP | MEC_MV_FAMILY | MEC_MV_FAMILY_CONDITIONAL_SPOUSE | COBRA_TERMINATED | RETIREE_COVERAGE"
      - name: minimum_value
        type: boolean
        source: input
        description: True when the plan provides minimum value.
      - name: lowest_cost_self_only_cents
        type: integer
        source: input
        description: Employee required contribution for the lowest-cost self-only minimum-value option, per month.
        constraints: ">= 0"
      - name: offers_spouse
        type: boolean
        source: input
        description: Whether the spouse was offered coverage.
        default: false
      - name: offers_dependents
        type: boolean
        source: input
        description: Whether dependents were offered coverage.
        default: false
      - name: conditional_spouse_offer
        type: boolean
        source: input
        description: Whether the spouse offer was conditional, which forces line 14 code 1K.
        default: false
      - name: enrolled
        type: boolean
        source: input
        description: Whether the employee actually enrolled, which forces line 16 code 2C.
        default: false
      - name: effective_start_date
        type: string
        source: input
        description: First date the offer is in force (inclusive).
        constraints: "YYYY-MM-DD"
      - name: effective_end_date
        type: string
        source: input
        description: First date the offer is no longer in force (exclusive); half-open interval semantics.
        constraints: "YYYY-MM-DD; > effective_start_date"
      - name: covered_months
        type: array
        source: computed
        description: Ascending months 1..12 of the reporting year every day of which lies inside [effective_start_date, effective_end_date).

  - name: FurnishingConsent
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the person who may consent to electronic delivery"
      - name: electronic_address
        type: string
        source: input
        description: Email address electronic statements are delivered to.
      - name: consent_status
        type: enum
        source: system
        description: Electronic delivery consent dimension; cycles between GRANTED and WITHDRAWN.
        default: PENDING
        constraints: "PENDING | GRANTED | WITHDRAWN"
      - name: granted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent grant; null while never granted.
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent withdrawal; null while never withdrawn.
      - name: grant_count
        type: integer
        source: computed
        description: Number of times this consent has been granted, including re-grants after withdrawal.
        default: 0

  - name: Form1095C
    parent: null
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the statement recipient"
      - name: transmittal_id
        type: string
        source: computed
        description: "FK -> Transmittal.id; set on attach, cleared on detach, null while unattached"
      - name: corrected_from_form_id
        type: string
        source: computed
        description: "FK -> Form1095C.id; the original form this correction replaces, null on originals"
      - name: form_type
        type: enum
        source: system
        description: Whether this is the original statement or a correction of one.
        default: ORIGINAL
        constraints: "ORIGINAL | CORRECTED"
      - name: plan_start_month
        type: integer
        source: input
        description: Two-digit plan start month printed on the form.
        constraints: "0..12"
      - name: safe_harbor_preference
        type: enum
        source: input
        description: Safe harbor the member elected first for this employee; NONE disables safe harbors entirely.
        default: W2
        constraints: "W2 | RATE_OF_PAY | FPL | NONE"
      - name: furnishing_status
        type: enum
        source: system
        description: Employee-delivery dimension, independent of filing_status.
        default: NOT_FURNISHED
        constraints: "NOT_FURNISHED | FURNISHED_PAPER | FURNISHED_ELECTRONIC | REDELIVERY_REQUIRED | VOIDED"
      - name: filing_status
        type: enum
        source: system
        description: Agency-filing dimension, independent of furnishing_status.
        default: NOT_FILED
        constraints: "NOT_FILED | ATTACHED | PENDING_FILING | FILED_ACCEPTED | FILED_WITH_ERRORS | CORRECTION_DRAFTED | VOIDED"
      - name: all_12_months_code
        type: string
        source: computed
        description: Line 14 code when all twelve MonthlyCoverageLine rows share it, else null.
      - name: ft_month_count
        type: integer
        source: computed
        description: Count of MonthlyCoverageLine rows with full_time_flag true.
        default: 0
      - name: offered_month_count
        type: integer
        source: computed
        description: Count of MonthlyCoverageLine rows whose line14_code is not 1H.
        default: 0
      - name: assessable_month_count
        type: integer
        source: computed
        description: Count of MonthlyCoverageLine rows with assessable true.
        default: 0
      - name: line15_total_cents
        type: integer
        source: computed
        description: Sum of MonthlyCoverageLine.line15_amount_cents over months where it is non-null.
        default: 0
      - name: generated_by_user_id
        type: string
        source: system
        description: X-User-ID of the Preparer who generated or last regenerated the form; segregation-of-duties input for furnishing.
      - name: furnished_by_user_id
        type: string
        source: system
        description: X-User-ID of the Preparer who furnished the form; null until furnished.
      - name: furnished_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent furnishing; null until furnished.
      - name: late_furnishing_penalty_cents
        type: integer
        source: computed
        description: Tiered late-furnishing penalty for this statement.
        default: 0
      - name: correction_reason
        type: string
        source: system
        description: Why a correction form was drafted; null on originals.

  - name: MonthlyCoverageLine
    parent: null
    common_fields: false
    fields:
      - name: form_1095c_id
        type: string
        source: system
        description: "FK -> Form1095C.id; the statement this month belongs to, set by the generation cascade"
      - name: month
        type: integer
        source: system
        description: Calendar month 1..12 of the reporting year; twelve rows are always created together.
        constraints: "1..12; unique per (form_1095c_id, month)"
      - name: line14_code
        type: string
        source: computed
        description: Offer-of-coverage code for the month.
        constraints: "1A | 1B | 1C | 1D | 1E | 1F | 1G | 1H | 1K"
      - name: line15_amount_cents
        type: integer
        source: computed
        description: Employee required contribution printed for the month; null unless line14_code IN {1B, 1C, 1D, 1E, 1K}.
      - name: line16_code
        type: string
        source: computed
        description: Safe harbor / relief code for the month; null means the month is exposed.
        constraints: "2A | 2B | 2C | 2D | 2F | 2G | 2H; null allowed"
      - name: full_time_flag
        type: boolean
        source: computed
        description: Whether the employee is full time for this month under the governing measurement method.
      - name: ft_source
        type: enum
        source: computed
        description: Which rule produced full_time_flag.
        constraints: "LOOK_BACK_STABILITY | MONTHLY_ACTUAL | LNAP | NOT_EMPLOYED"
      - name: affordability_threshold_cents
        type: integer
        source: computed
        description: Cents the required contribution was compared against; null when no safe harbor applied.
      - name: safe_harbor_applied
        type: enum
        source: computed
        description: Safe harbor actually used after fall-through.
        constraints: "W2 | RATE_OF_PAY | FPL | NONE"
      - name: special_situation
        type: enum
        source: computed
        description: Special situation that overrode the ordinary code assignment.
        constraints: "NONE | WAITING_PERIOD | INITIAL_MEASUREMENT | LEAVE | TRANSFER | TERMINATION"
      - name: assessable
        type: boolean
        source: computed
        description: True when full_time_flag is true and line16_code is null; counts toward 4980H exposure.

  - name: Transmittal
    parent: null
    common_fields: true
    fields:
      - name: group_member_id
        type: string
        source: input
        description: "FK -> GroupMember.id; the EIN whose 1094-C this transmittal is"
      - name: transmission_type
        type: enum
        source: input
        description: Whether this submission is the original, a correction, or a replacement of a rejected submission.
        constraints: "ORIGINAL | CORRECTION | REPLACEMENT"
      - name: authoritative_indicator
        type: boolean
        source: input
        description: Whether this 1094-C is the member's authoritative transmittal carrying Part III.
        default: true
      - name: status
        type: enum
        source: system
        description: Submission lifecycle, cycling through correction and replacement rounds.
        default: DRAFT
        constraints: "DRAFT | BUILT | TRANSMITTED | ACCEPTED | ACCEPTED_WITH_ERRORS | PARTIALLY_ACCEPTED | REJECTED | CORRECTION_REQUIRED | SUPERSEDED"
      - name: cycle_number
        type: integer
        source: system
        description: Correction/replacement round, starting at 1; capped by CORRECTION_CYCLE_LIMIT.
        default: 1
      - name: form_count
        type: integer
        source: computed
        description: Count of Form1095C rows whose transmittal_id equals this transmittal and filing_status != VOIDED.
        default: 0
      - name: aggregate_return_count
        type: integer
        source: computed
        description: form_count + 1 for this 1094-C + the form_count of every other transmittal of the same member whose status IN {BUILT, TRANSMITTED, ACCEPTED, ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED}; frozen at build.
        default: 0
      - name: required_channel
        type: enum
        source: computed
        description: ELECTRONIC when aggregate_return_count >= FilingSeason.electronic_filing_threshold, else ANY.
        default: ANY
        constraints: "ANY | ELECTRONIC"
      - name: channel
        type: enum
        source: system
        description: Channel actually used at transmission; null until transmitted.
        constraints: "ELECTRONIC | PAPER"
      - name: receipt_id
        type: string
        source: system
        description: Agency receipt identifier recorded with the response; null until a response arrives.
      - name: monthly_ft_counts
        type: array
        source: computed
        description: Twelve integers, index 0 = January of the reporting year, from MonthlyHeadcount rows with count_year == REPORTING_YEAR; frozen at build.
      - name: error_count
        type: integer
        source: computed
        description: Count of TransmittalError rows of this transmittal.
        default: 0
      - name: open_error_count
        type: integer
        source: computed
        description: Count of TransmittalError rows of this transmittal whose resolution_status == OPEN.
        default: 0
      - name: built_by_user_id
        type: string
        source: system
        description: X-User-ID of the Preparer who built the submission; segregation-of-duties input for transmission.
      - name: transmitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FilingAgent who transmitted the submission; null until transmitted.
      - name: built_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent build; null while DRAFT.
      - name: transmitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transmission; null until transmitted.

  - name: TransmittalError
    parent: null
    common_fields: true
    fields:
      - name: transmittal_id
        type: string
        source: input
        description: "FK -> Transmittal.id; the submission the agency rejected data on"
      - name: form_1095c_id
        type: string
        source: input
        description: "FK -> Form1095C.id; the statement the error points at, null for 1094-C level errors"
      - name: error_code
        type: string
        source: input
        description: Agency error code, e.g. TIN-MISMATCH or 1095C-010.
      - name: error_field
        type: string
        source: input
        description: Field path the agency flagged.
      - name: severity
        type: enum
        source: input
        description: How the error affects acceptance.
        constraints: "FATAL | ERROR | WARNING"
      - name: resolution_status
        type: enum
        source: system
        description: Correction-cycle progress for this error.
        default: OPEN
        constraints: "OPEN | CORRECTED | ACCEPTED_AS_FILED"
      - name: resolution_note
        type: string
        source: system
        description: Preparer note recorded at resolution; null while OPEN.
      - name: corrected_form_id
        type: string
        source: system
        description: "FK -> Form1095C.id; the correction form drafted to fix this error, null when resolved as filed"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the Preparer who resolved the error; null while OPEN.

  - name: PenaltyNotice
    parent: null
    common_fields: true
    fields:
      - name: controlled_group_id
        type: string
        source: input
        description: "FK -> ControlledGroup.id; the group the proposed assessment was addressed to"
      - name: notice_number
        type: string
        source: input
        description: Agency notice identifier.
        constraints: "unique across PenaltyNotice"
      - name: notice_date
        type: string
        source: input
        description: Date printed on the notice.
        constraints: "YYYY-MM-DD"
      - name: response_due_date
        type: string
        source: input
        description: Last date (inclusive) a response may be submitted.
        constraints: "YYYY-MM-DD; > notice_date"
      - name: proposed_amount_cents
        type: integer
        source: input
        description: Total proposed assessment asserted by the agency.
        constraints: ">= 0"
      - name: asserted_a_months
        type: array
        source: input
        description: Months 1..12 the agency asserts a 4980H(a) failure for.
      - name: asserted_b_employee_months
        type: array
        source: input
        description: Objects { employee_id, month } the agency asserts a 4980H(b) failure for.
      - name: status
        type: enum
        source: system
        description: Response workflow, forking on the agency determination.
        default: RECEIVED
        constraints: "RECEIVED | EVIDENCE_GATHERING | RECOMPUTED | RESPONSE_SUBMITTED | ABATED_FULL | ABATED_PARTIAL | SUSTAINED"
      - name: a_month_penalty_cents
        type: integer
        source: computed
        description: 4980H(a) component of the recalculation; null before the first recompute.
      - name: b_month_penalty_cents
        type: integer
        source: computed
        description: 4980H(b) component of the recalculation; null before the first recompute.
      - name: recalculated_amount_cents
        type: integer
        source: computed
        description: a_month_penalty_cents + b_month_penalty_cents; null before the first recompute.
      - name: allocated_total_cents
        type: integer
        source: computed
        description: Sum of GroupMember.allocated_penalty_cents across the group's ACTIVE members for this notice.
        default: 0
      - name: unallocated_amount_cents
        type: integer
        source: computed
        description: recalculated_amount_cents - allocated_total_cents; the conserved-quantity slack.
        default: 0
      - name: evidence_count
        type: integer
        source: computed
        description: Count of PenaltyEvidence rows of this notice.
        default: 0
      - name: applied_evidence_count
        type: integer
        source: computed
        description: Count of PenaltyEvidence rows of this notice with applied true after the last recompute.
        default: 0
      - name: abated_amount_cents
        type: integer
        source: system
        description: Amount the agency abated on determination; null until determined.
      - name: determination
        type: enum
        source: system
        description: Agency outcome; null until determined.
        constraints: "ABATED_FULL | ABATED_PARTIAL | SUSTAINED"
      - name: recomputed_at
        type: datetime
        source: system
        description: Logical-clock instant of the last recompute; null before the first recompute.
      - name: last_evidence_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed the most recent evidence; segregation-of-duties input for response submission.
      - name: response_submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who submitted the response; null until submitted.
      - name: response_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of response submission; null until submitted.

  - name: PenaltyEvidence
    parent: null
    common_fields: false
    fields:
      - name: penalty_notice_id
        type: string
        source: input
        description: "FK -> PenaltyNotice.id; the notice this evidence answers"
      - name: employee_id
        type: string
        source: input
        description: "FK -> Employee.id; the employee the evidence concerns, null for MEC_OFFER_PROOF month-level evidence"
      - name: evidence_type
        type: enum
        source: input
        description: OFFER_PROOF proves an affordable offer for an employee-month; FT_STATUS_DISPUTE denies full-time status for an employee-month; MEC_OFFER_PROOF proves the 95% minimum-essential-coverage offer for a whole month.
        constraints: "OFFER_PROOF | FT_STATUS_DISPUTE | MEC_OFFER_PROOF"
      - name: month
        type: integer
        source: input
        description: Calendar month 1..12 the evidence covers.
        constraints: "1..12"
      - name: asserted_line14_code
        type: string
        source: input
        description: Line 14 code the employer asserts for the month; required for OFFER_PROOF.
      - name: asserted_line16_code
        type: string
        source: input
        description: Line 16 code the employer asserts for the month; required for OFFER_PROOF.
      - name: document_ref
        type: string
        source: input
        description: Archive reference of the supporting document.
      - name: applied
        type: boolean
        source: computed
        description: True once a recompute has consumed this evidence; false when the month it cites is not in the notice's asserted sets.
        default: false
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed the evidence.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FilingSeason
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /ale-reporting/filing-seasons/{season_id}/lock"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN"
          - "open_correction_count == 0 (no ControlledGroup of this season is in CORRECTION_OPEN)"
          - "every Transmittal of every ACTIVE GroupMember of every ControlledGroup of this season has status IN {ACCEPTED, SUPERSEDED}"
        side_effects:
          - "sets locked_at to the current logical clock"
          - "every ControlledGroup of this season with determination_state IN {DETERMINED_ALE, DETERMINED_NON_ALE} moves to LOCKED"
        note: "Lock is the season's only terminal state; there is no unlock."

  - entity: ControlledGroup
    initial_state: NOT_DETERMINED
    terminal_states: [LOCKED]
    transitions:
      - from: NOT_DETERMINED
        to: DETERMINED_ALE
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"
        actor: ComplianceOfficer
        preconditions:
          - "FilingSeason.status == OPEN"
          - "expected_controlled_group_version == ControlledGroup.version"
          - "every ACTIVE GroupMember of the group has 12 MonthlyHeadcount rows with count_year == PRIOR_YEAR (months 1..12)"
          - "aggregate_fte_month_and_ale_status yields annual_average_fte >= ALE_THRESHOLD and the seasonal-worker exception does not apply"
        side_effects:
          - "writes monthly_group_fte, annual_average_fte_raw, annual_average_fte, determination_basis, ale_reason = THRESHOLD_MET"
          - "sets determined_at and last_determination_user_id, increments ControlledGroup.version by 1"
          - "recomputes GroupMember.reporting_year_ft_months for every ACTIVE member from REPORTING_YEAR headcounts"
      - from: NOT_DETERMINED
        to: DETERMINED_NON_ALE
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"
        actor: ComplianceOfficer
        preconditions:
          - "FilingSeason.status == OPEN"
          - "expected_controlled_group_version == ControlledGroup.version"
          - "every ACTIVE GroupMember of the group has 12 MonthlyHeadcount rows with count_year == PRIOR_YEAR"
          - "annual_average_fte < ALE_THRESHOLD, or the seasonal-worker exception applies"
        side_effects:
          - "writes ale_reason = BELOW_THRESHOLD or SEASONAL_EXCEPTION and seasonal_exception_applied accordingly"
          - "increments ControlledGroup.version by 1"
      - from: DETERMINED_ALE
        to: DETERMINED_ALE
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination (re-run supersedes the prior determination)"
        actor: ComplianceOfficer
        preconditions:
          - "FilingSeason.status == OPEN"
          - "expected_controlled_group_version == ControlledGroup.version"
        side_effects:
          - "overwrites monthly_group_fte, annual_average_fte, determination_basis, ale_reason with the new basis"
          - "increments ControlledGroup.version by 1"
        note: "Self-loop: a later determination legitimately supersedes an earlier one, which is why the write is OCC-guarded."
      - from: DETERMINED_ALE
        to: REOPENED
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "FilingSeason.status == OPEN"
          - "determination_state == DETERMINED_ALE"
          - "no Transmittal of any member of the group has status IN {TRANSMITTED, ACCEPTED, ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED}"
        side_effects:
          - "clears determination_basis, ale_reason, annual_average_fte, annual_average_fte_raw, monthly_group_fte, determined_at"
          - "increments ControlledGroup.version by 1"
      - from: DETERMINED_NON_ALE
        to: REOPENED
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "FilingSeason.status == OPEN"
          - "determination_state == DETERMINED_NON_ALE"
        side_effects:
          - "clears determination outputs, increments ControlledGroup.version by 1"
      - from: REOPENED
        to: DETERMINED_ALE
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"
        actor: ComplianceOfficer
        preconditions:
          - "expected_controlled_group_version == ControlledGroup.version"
          - "prior-year headcounts complete for every ACTIVE member"
        side_effects:
          - "rewrites determination outputs, increments ControlledGroup.version by 1"
        note: "Revision loop NOT_DETERMINED -> DETERMINED_ALE -> REOPENED -> DETERMINED_ALE."
      - from: REOPENED
        to: DETERMINED_NON_ALE
        trigger: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"
        actor: ComplianceOfficer
        preconditions:
          - "expected_controlled_group_version == ControlledGroup.version"
          - "annual_average_fte < ALE_THRESHOLD or the seasonal-worker exception applies"
        side_effects:
          - "rewrites determination outputs, increments ControlledGroup.version by 1"
      - from: DETERMINED_ALE
        to: CORRECTION_OPEN
        trigger: "system: a Form1095C of this group entered furnishing_status REDELIVERY_REQUIRED or filing_status CORRECTION_DRAFTED"
        actor: system
        preconditions:
          - "determination_state == DETERMINED_ALE"
          - "open_correction_count transitions from 0 to a value > 0"
        side_effects:
          - "increments open_correction_count"
          - "increments FilingSeason.open_correction_count by 1, which blocks POST /ale-reporting/filing-seasons/{season_id}/lock"
      - from: CORRECTION_OPEN
        to: DETERMINED_ALE
        trigger: "system: the last outstanding correction on this group closed (form re-furnished and its correction filed)"
        actor: system
        preconditions:
          - "open_correction_count reached 0"
        side_effects:
          - "decrements FilingSeason.open_correction_count by 1"
        note: "Cycle DETERMINED_ALE -> CORRECTION_OPEN -> DETERMINED_ALE."
      - from: DETERMINED_ALE
        to: LOCKED
        trigger: "system: POST /ale-reporting/filing-seasons/{season_id}/lock cascaded to this group"
        actor: system
        preconditions: ["FilingSeason lock preconditions all hold"]
        side_effects: ["no further determination, form generation, or transmission is accepted for this group"]
      - from: DETERMINED_NON_ALE
        to: LOCKED
        trigger: "system: POST /ale-reporting/filing-seasons/{season_id}/lock cascaded to this group"
        actor: system
        preconditions: ["FilingSeason lock preconditions all hold"]
        side_effects: ["no further determination or form generation is accepted for this group"]

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /ale-reporting/employment-events with event_type == LEAVE_START"
        actor: BenefitsAdmin
        preconditions:
          - "employment_status == ACTIVE"
          - "leave_type is present"
          - "effective_date >= hire_date"
        side_effects:
          - "sets open_leave_type = leave_type"
          - "EmploymentEvent.resulting_status = ON_LEAVE"
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /ale-reporting/employment-events with event_type == LEAVE_END"
        actor: BenefitsAdmin
        preconditions:
          - "employment_status == ON_LEAVE"
          - "leave_type is absent"
        side_effects:
          - "clears open_leave_type"
          - "every MonthlyCoverageLine of the employee's non-VOIDED Form1095C whose month has a HoursRecord with excluded_from_denominator true gets special_situation = LEAVE"
        note: "Cycle ACTIVE -> ON_LEAVE -> ACTIVE; each round changes the look-back denominator."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /ale-reporting/employment-events with event_type == TRANSFER"
        actor: BenefitsAdmin
        preconditions:
          - "employment_status == ACTIVE"
          - "to_group_member_id is present, exists, has member_status == ACTIVE and belongs to the same ControlledGroup as the current group_member_id"
        side_effects:
          - "sets group_member_id = to_group_member_id"
          - "recomputes effective_measurement_method from the destination member's measurement_method when measurement_method_override is null"
          - "sets MonthlyCoverageLine.special_situation = TRANSFER for the month containing effective_date on the employee's non-VOIDED Form1095C"
        note: "Self-loop: the row stays ACTIVE while its owning EIN changes, which can flip the measurement method."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /ale-reporting/employment-events with event_type == TERMINATION"
        actor: BenefitsAdmin
        preconditions:
          - "employment_status IN {ACTIVE, ON_LEAVE}"
          - "effective_date >= hire_date"
        side_effects:
          - "LINK 1: sets termination_date = effective_date, clears open_leave_type, EmploymentEvent.resulting_status = TERMINATED"
          - "LINK 2: because the employee became TERMINATED, every MonthlyCoverageLine of the employee's non-VOIDED Form1095C for months strictly after the termination month is rewritten to line14_code = 1H, line15_amount_cents = null, line16_code = 2A, full_time_flag = false, ft_source = NOT_EMPLOYED, assessable = false; the termination month itself gets special_situation = TERMINATION and line16_code = 2B when its offer_kind != NO_OFFER"
          - "LINK 3: because those MonthlyCoverageLine rows changed, the parent Form1095C recomputes ft_month_count, offered_month_count, assessable_month_count and line15_total_cents, and when furnishing_status IN {FURNISHED_PAPER, FURNISHED_ELECTRONIC} it moves to REDELIVERY_REQUIRED, and when filing_status IN {FILED_ACCEPTED, FILED_WITH_ERRORS} it moves to CORRECTION_DRAFTED"
          - "LINK 4: because that Form1095C entered REDELIVERY_REQUIRED or CORRECTION_DRAFTED, ControlledGroup.open_correction_count increments and a DETERMINED_ALE group moves to CORRECTION_OPEN"
          - "LINK 5: because the group entered CORRECTION_OPEN, FilingSeason.open_correction_count increments and the season can no longer be locked"
      - from: ON_LEAVE
        to: TERMINATED
        trigger: "POST /ale-reporting/employment-events with event_type == TERMINATION"
        actor: BenefitsAdmin
        preconditions:
          - "employment_status == ON_LEAVE"
        side_effects:
          - "same LINK 1..LINK 5 chain as the ACTIVE -> TERMINATED transition"
      - from: TERMINATED
        to: ACTIVE
        trigger: "POST /ale-reporting/employment-events with event_type == REHIRE"
        actor: BenefitsAdmin
        preconditions:
          - "employment_status == TERMINATED"
          - "effective_date > termination_date"
        side_effects:
          - "when (effective_date - termination_date) >= REHIRE_BREAK_DAYS (91) days: sets hire_date = effective_date so the rehire is a new hire whose waiting period reopens a limited non-assessment period"
          - "when the break is shorter than REHIRE_BREAK_DAYS: hire_date is left unchanged and no new waiting period is created"
          - "clears termination_date in both cases"
        note: "Cycle ACTIVE -> TERMINATED -> ACTIVE with a break-length branch."

  - entity: FurnishingConsent
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /ale-reporting/furnishing-consents/{consent_id}/grant"
        actor: EmployeeSelfService
        preconditions:
          - "consent_status == PENDING"
          - "X-User-ID == FurnishingConsent.employee_id"
        side_effects:
          - "sets granted_at to the current logical clock, increments grant_count by 1"
      - from: GRANTED
        to: WITHDRAWN
        trigger: "POST /ale-reporting/furnishing-consents/{consent_id}/withdraw"
        actor: EmployeeSelfService
        preconditions:
          - "consent_status == GRANTED"
          - "X-User-ID == FurnishingConsent.employee_id"
        side_effects:
          - "sets withdrawn_at to the current logical clock"
          - "every Form1095C of this employee with furnishing_status == FURNISHED_ELECTRONIC moves to REDELIVERY_REQUIRED"
          - "that REDELIVERY_REQUIRED transition increments ControlledGroup.open_correction_count and moves a DETERMINED_ALE group to CORRECTION_OPEN"
      - from: WITHDRAWN
        to: GRANTED
        trigger: "POST /ale-reporting/furnishing-consents/{consent_id}/grant"
        actor: EmployeeSelfService
        preconditions:
          - "consent_status == WITHDRAWN"
          - "X-User-ID == FurnishingConsent.employee_id"
        side_effects:
          - "sets granted_at to the current logical clock, increments grant_count by 1"
        note: "Cycle GRANTED -> WITHDRAWN -> GRANTED; grant_count records the round."

  - entity: Form1095C
    initial_state: "furnishing_status = NOT_FURNISHED x filing_status = NOT_FILED"
    terminal_states: ["furnishing_status = VOIDED", "filing_status = VOIDED"]
    transitions:
      # ---- dimension 1: furnishing_status (employee delivery) ----
      - from: "furnishing_status = NOT_FURNISHED"
        to: "furnishing_status = FURNISHED_PAPER"
        trigger: "POST /ale-reporting/forms-1095c/{form_id}/furnish with delivery_channel == PAPER"
        actor: Preparer
        preconditions:
          - "furnishing_status IN {NOT_FURNISHED, REDELIVERY_REQUIRED}"
          - "X-User-ID != Form1095C.generated_by_user_id"
          - "FilingSeason.status == OPEN"
        side_effects:
          - "sets furnished_at, furnished_by_user_id"
          - "computes late_furnishing_penalty_cents from late_furnishing_penalty and adds the delta into GroupMember.furnishing_penalty_total_cents"
      - from: "furnishing_status = NOT_FURNISHED"
        to: "furnishing_status = FURNISHED_ELECTRONIC"
        trigger: "POST /ale-reporting/forms-1095c/{form_id}/furnish with delivery_channel == ELECTRONIC"
        actor: Preparer
        preconditions:
          - "furnishing_status IN {NOT_FURNISHED, REDELIVERY_REQUIRED}"
          - "the employee has a FurnishingConsent with consent_status == GRANTED"
          - "X-User-ID != Form1095C.generated_by_user_id"
          - "FilingSeason.status == OPEN"
        side_effects:
          - "sets furnished_at, furnished_by_user_id"
          - "computes late_furnishing_penalty_cents and adds the delta into GroupMember.furnishing_penalty_total_cents"
      - from: "furnishing_status = FURNISHED_ELECTRONIC"
        to: "furnishing_status = REDELIVERY_REQUIRED"
        trigger: "system: consent withdrawn, coverage lines rewritten by an EmploymentEvent, or the agency returned an error on this form"
        actor: system
        preconditions: ["furnishing_status IN {FURNISHED_PAPER, FURNISHED_ELECTRONIC}"]
        side_effects:
          - "increments ControlledGroup.open_correction_count, moving a DETERMINED_ALE group to CORRECTION_OPEN"
      - from: "furnishing_status = FURNISHED_PAPER"
        to: "furnishing_status = REDELIVERY_REQUIRED"
        trigger: "system: coverage lines rewritten by an EmploymentEvent or the agency returned an error on this form"
        actor: system
        preconditions: ["furnishing_status IN {FURNISHED_PAPER, FURNISHED_ELECTRONIC}"]
        side_effects:
          - "increments ControlledGroup.open_correction_count, moving a DETERMINED_ALE group to CORRECTION_OPEN"
      - from: "furnishing_status = REDELIVERY_REQUIRED"
        to: "furnishing_status = FURNISHED_ELECTRONIC"
        trigger: "POST /ale-reporting/forms-1095c/{form_id}/furnish with delivery_channel == ELECTRONIC"
        actor: Preparer
        preconditions:
          - "furnishing_status == REDELIVERY_REQUIRED"
          - "the employee has a FurnishingConsent with consent_status == GRANTED"
          - "X-User-ID != Form1095C.generated_by_user_id"
        side_effects:
          - "decrements ControlledGroup.open_correction_count and returns a CORRECTION_OPEN group to DETERMINED_ALE once it reaches 0"
          - "recomputes late_furnishing_penalty_cents"
        note: "Cycle FURNISHED_ELECTRONIC -> REDELIVERY_REQUIRED -> FURNISHED_ELECTRONIC."
      - from: "furnishing_status = REDELIVERY_REQUIRED"
        to: "furnishing_status = FURNISHED_PAPER"
        trigger: "POST /ale-reporting/forms-1095c/{form_id}/furnish with delivery_channel == PAPER"
        actor: Preparer
        preconditions:
          - "furnishing_status == REDELIVERY_REQUIRED"
          - "X-User-ID != Form1095C.generated_by_user_id"
        side_effects:
          - "decrements ControlledGroup.open_correction_count and returns a CORRECTION_OPEN group to DETERMINED_ALE once it reaches 0"
          - "recomputes late_furnishing_penalty_cents"
      - from: "furnishing_status = FURNISHED_ELECTRONIC"
        to: "furnishing_status = VOIDED"
        trigger: "system: POST /ale-reporting/forms-1095c/{form_id}/regenerate on an already furnished form drafts a correction and voids this one"
        actor: system
        preconditions: ["a correction form was created with corrected_from_form_id == this form"]
        side_effects:
          - "the new CORRECTED form starts at furnishing_status NOT_FURNISHED x filing_status NOT_FILED"
          - "decrements GroupMember.generated_form_count for the voided form and increments it for the correction form"
      # ---- dimension 2: filing_status (agency filing) ----
      - from: "filing_status = NOT_FILED"
        to: "filing_status = ATTACHED"
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/attach-forms"
        actor: Preparer
        preconditions:
          - "filing_status == NOT_FILED"
          - "Transmittal.status == DRAFT"
          - "Employee.group_member_id == Transmittal.group_member_id"
        side_effects:
          - "sets transmittal_id"
          - "increments Transmittal.form_count, decrements GroupMember.unattached_form_count and increments GroupMember.attached_form_count"
      - from: "filing_status = ATTACHED"
        to: "filing_status = NOT_FILED"
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/detach-form"
        actor: Preparer
        preconditions:
          - "filing_status == ATTACHED"
          - "Transmittal.status IN {DRAFT, BUILT}"
        side_effects:
          - "clears transmittal_id"
          - "decrements Transmittal.form_count, increments GroupMember.unattached_form_count and decrements GroupMember.attached_form_count"
          - "a BUILT transmittal reverts to DRAFT and clears aggregate_return_count, required_channel and monthly_ft_counts"
        note: "Compensating action for attach-forms; the conserved quantity is GroupMember.generated_form_count."
      - from: "filing_status = ATTACHED"
        to: "filing_status = PENDING_FILING"
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/transmit"
        actor: FilingAgent
        preconditions:
          - "Transmittal.status == BUILT"
        side_effects: ["no ControlledGroup or GroupMember counters change"]
      - from: "filing_status = PENDING_FILING"
        to: "filing_status = FILED_ACCEPTED"
        trigger: "system: POST /ale-reporting/transmittals/{transmittal_id}/agency-response with no TransmittalError pointing at this form"
        actor: system
        preconditions: ["filing_status == PENDING_FILING"]
        side_effects: ["none beyond the status change"]
      - from: "filing_status = PENDING_FILING"
        to: "filing_status = FILED_WITH_ERRORS"
        trigger: "system: POST /ale-reporting/transmittals/{transmittal_id}/agency-response created a TransmittalError with severity IN {FATAL, ERROR} pointing at this form"
        actor: system
        preconditions: ["filing_status == PENDING_FILING"]
        side_effects:
          - "LINK 3 of the agency-response cascade: when furnishing_status IN {FURNISHED_PAPER, FURNISHED_ELECTRONIC} the form also moves to REDELIVERY_REQUIRED"
      - from: "filing_status = FILED_WITH_ERRORS"
        to: "filing_status = CORRECTION_DRAFTED"
        trigger: "POST /ale-reporting/transmittal-errors/{error_id}/resolve with resolution == CORRECT_FORM"
        actor: Preparer
        preconditions:
          - "filing_status == FILED_WITH_ERRORS"
          - "TransmittalError.resolution_status == OPEN"
        side_effects:
          - "creates a CORRECTED Form1095C with corrected_from_form_id == this form, sets TransmittalError.corrected_form_id and resolution_status = CORRECTED"
          - "decrements Transmittal.open_error_count"
          - "increments ControlledGroup.open_correction_count, moving a DETERMINED_ALE group to CORRECTION_OPEN"
      - from: "filing_status = FILED_ACCEPTED"
        to: "filing_status = CORRECTION_DRAFTED"
        trigger: "system: an EmploymentEvent or POST /ale-reporting/forms-1095c/{form_id}/regenerate rewrote the coverage lines of an accepted form"
        actor: system
        preconditions: ["filing_status == FILED_ACCEPTED"]
        side_effects:
          - "increments ControlledGroup.open_correction_count, moving a DETERMINED_ALE group to CORRECTION_OPEN"
      - from: "filing_status = CORRECTION_DRAFTED"
        to: "filing_status = VOIDED"
        trigger: "system: the correction form drafted from this form was attached to a CORRECTION transmittal"
        actor: system
        preconditions: ["a Form1095C with corrected_from_form_id == this form has filing_status == ATTACHED"]
        side_effects:
          - "decrements ControlledGroup.open_correction_count and returns a CORRECTION_OPEN group to DETERMINED_ALE once it reaches 0"

  - entity: Transmittal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: BUILT
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/build"
        actor: Preparer
        preconditions:
          - "status IN {DRAFT, REJECTED, CORRECTION_REQUIRED}"
          - "form_count >= 1"
          - "FilingSeason.status == OPEN"
          - "ControlledGroup.determination_state IN {DETERMINED_ALE, CORRECTION_OPEN}"
          - "when status == CORRECTION_REQUIRED: open_error_count == 0"
        side_effects:
          - "computes aggregate_return_count and required_channel from transmission_channel_requirement"
          - "freezes monthly_ft_counts from REPORTING_YEAR MonthlyHeadcount rows of the member"
          - "sets built_by_user_id and built_at"
          - "every other Transmittal of the same member with status == BUILT moves to SUPERSEDED"
      - from: REJECTED
        to: BUILT
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/build (replacement round)"
        actor: Preparer
        preconditions:
          - "status == REJECTED"
          - "cycle_number < CORRECTION_CYCLE_LIMIT"
        side_effects:
          - "increments cycle_number by 1, recomputes aggregate_return_count and required_channel, sets built_by_user_id and built_at"
        note: "Cycle BUILT -> TRANSMITTED -> REJECTED -> BUILT."
      - from: CORRECTION_REQUIRED
        to: BUILT
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/build (correction round)"
        actor: Preparer
        preconditions:
          - "status == CORRECTION_REQUIRED"
          - "open_error_count == 0"
          - "cycle_number < CORRECTION_CYCLE_LIMIT"
        side_effects:
          - "increments cycle_number by 1, recomputes aggregate_return_count and required_channel, sets built_by_user_id and built_at"
      - from: BUILT
        to: DRAFT
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/detach-form"
        actor: Preparer
        preconditions:
          - "status == BUILT"
          - "the form is attached to this transmittal"
        side_effects:
          - "clears aggregate_return_count (0), required_channel (ANY), monthly_ft_counts ([]) and built_at"
          - "decrements form_count"
        note: "Revert: the build outputs are not trusted once the attached set changes."
      - from: BUILT
        to: TRANSMITTED
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/transmit"
        actor: FilingAgent
        preconditions:
          - "status == BUILT"
          - "FilingSeason.status == OPEN"
          - "X-User-ID != built_by_user_id"
          - "channel == ELECTRONIC when required_channel == ELECTRONIC"
        side_effects:
          - "sets channel, transmitted_by_user_id, transmitted_at"
          - "every attached Form1095C moves filing_status ATTACHED -> PENDING_FILING"
      - from: BUILT
        to: SUPERSEDED
        trigger: "system: another Transmittal of the same member was built"
        actor: system
        preconditions: ["status == BUILT"]
        side_effects:
          - "attached Form1095C rows keep filing_status ATTACHED and their transmittal_id"
      - from: TRANSMITTED
        to: ACCEPTED
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/agency-response with response_status == ACCEPTED"
        actor: FilingAgent
        preconditions:
          - "status == TRANSMITTED"
          - "errors is empty"
        side_effects:
          - "sets receipt_id; every attached Form1095C moves PENDING_FILING -> FILED_ACCEPTED"
          - "clears GroupMember.open_transmittal_id"
      - from: TRANSMITTED
        to: ACCEPTED_WITH_ERRORS
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/agency-response with response_status == ACCEPTED_WITH_ERRORS"
        actor: FilingAgent
        preconditions:
          - "status == TRANSMITTED"
          - "errors is non-empty"
        side_effects:
          - "LINK 1: sets receipt_id, creates one TransmittalError per errors entry, sets error_count and open_error_count"
          - "LINK 2: because the transmittal entered ACCEPTED_WITH_ERRORS, every attached Form1095C named by a FATAL or ERROR TransmittalError moves PENDING_FILING -> FILED_WITH_ERRORS while unnamed forms move PENDING_FILING -> FILED_ACCEPTED"
          - "LINK 3: because a Form1095C entered FILED_WITH_ERRORS, a form whose furnishing_status IN {FURNISHED_PAPER, FURNISHED_ELECTRONIC} moves to REDELIVERY_REQUIRED"
          - "LINK 4: because that form entered REDELIVERY_REQUIRED, ControlledGroup.open_correction_count increments and a DETERMINED_ALE group moves to CORRECTION_OPEN"
          - "LINK 5: because the group entered CORRECTION_OPEN, FilingSeason.open_correction_count increments and the season can no longer be locked"
      - from: TRANSMITTED
        to: PARTIALLY_ACCEPTED
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/agency-response with response_status == PARTIALLY_ACCEPTED"
        actor: FilingAgent
        preconditions:
          - "status == TRANSMITTED"
          - "errors is non-empty and at least one errors entry has severity == FATAL"
        side_effects:
          - "creates TransmittalError rows; forms named by FATAL errors move PENDING_FILING -> FILED_WITH_ERRORS, all other attached forms move to FILED_ACCEPTED"
          - "the same LINK 3..LINK 5 chain fires for every form that had been furnished"
      - from: TRANSMITTED
        to: REJECTED
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/agency-response with response_status == REJECTED"
        actor: FilingAgent
        preconditions:
          - "status == TRANSMITTED"
        side_effects:
          - "creates TransmittalError rows; every attached Form1095C moves PENDING_FILING -> ATTACHED so the whole submission can be replaced"
      - from: ACCEPTED_WITH_ERRORS
        to: CORRECTION_REQUIRED
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/start-correction-cycle"
        actor: Preparer
        preconditions:
          - "status IN {ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED}"
          - "open_error_count >= 1"
          - "cycle_number < CORRECTION_CYCLE_LIMIT"
        side_effects:
          - "no counters change; the transmittal becomes buildable again once every error is resolved"
      - from: PARTIALLY_ACCEPTED
        to: CORRECTION_REQUIRED
        trigger: "POST /ale-reporting/transmittals/{transmittal_id}/start-correction-cycle"
        actor: Preparer
        preconditions:
          - "status == PARTIALLY_ACCEPTED"
          - "open_error_count >= 1"
          - "cycle_number < CORRECTION_CYCLE_LIMIT"
        side_effects:
          - "no counters change"

  - entity: PenaltyNotice
    initial_state: RECEIVED
    terminal_states: [ABATED_FULL, ABATED_PARTIAL, SUSTAINED]
    transitions:
      - from: RECEIVED
        to: EVIDENCE_GATHERING
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/evidence"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {RECEIVED, EVIDENCE_GATHERING, RECOMPUTED}"
          - "current logical clock date <= response_due_date"
        side_effects:
          - "increments evidence_count, sets last_evidence_user_id"
      - from: EVIDENCE_GATHERING
        to: RECOMPUTED
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/recompute"
        actor: ComplianceOfficer
        preconditions:
          - "status == EVIDENCE_GATHERING"
          - "evidence_count >= 1"
          - "every Form1095C named by FT_STATUS_DISPUTE or OFFER_PROOF evidence has filing_status IN {FILED_ACCEPTED, FILED_WITH_ERRORS, CORRECTION_DRAFTED}"
        side_effects:
          - "runs penalty_recomputation_and_allocation in its pinned four-step order"
          - "writes a_month_penalty_cents, b_month_penalty_cents, recalculated_amount_cents, allocated_total_cents, unallocated_amount_cents, applied_evidence_count, recomputed_at"
          - "writes GroupMember.allocated_penalty_cents and GroupMember.allocated_exclusion_employees for every ACTIVE member of the group"
      - from: RECOMPUTED
        to: EVIDENCE_GATHERING
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/evidence (new evidence invalidates the recomputation)"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECOMPUTED"
          - "current logical clock date <= response_due_date"
        side_effects:
          - "increments evidence_count, sets last_evidence_user_id"
          - "clears a_month_penalty_cents, b_month_penalty_cents, recalculated_amount_cents and recomputed_at"
          - "resets GroupMember.allocated_penalty_cents to 0 for every ACTIVE member and sets allocated_total_cents = 0 and unallocated_amount_cents = 0"
        note: "Cycle EVIDENCE_GATHERING -> RECOMPUTED -> EVIDENCE_GATHERING."
      - from: RECOMPUTED
        to: RECOMPUTED
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/allocation/reset"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECOMPUTED"
          - "allocated_total_cents > 0"
        side_effects:
          - "sets GroupMember.allocated_penalty_cents = 0 for every ACTIVE member of the group"
          - "sets allocated_total_cents = 0 and unallocated_amount_cents = recalculated_amount_cents"
        note: "Compensating action for the allocation step of recompute; the conserved quantity is cents."
      - from: RECOMPUTED
        to: RESPONSE_SUBMITTED
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/submit-response"
        actor: ComplianceOfficer
        preconditions:
          - "status == RECOMPUTED"
          - "recalculated_amount_cents is not null"
          - "unallocated_amount_cents == 0"
          - "current logical clock date <= response_due_date"
          - "X-User-ID != last_evidence_user_id"
        side_effects:
          - "sets response_submitted_at and response_submitted_by_user_id"
      - from: RESPONSE_SUBMITTED
        to: ABATED_FULL
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/agency-determination with determination == ABATED_FULL"
        actor: ComplianceOfficer
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "abated_amount_cents == proposed_amount_cents"
        side_effects:
          - "sets determination and abated_amount_cents"
          - "sets GroupMember.allocated_penalty_cents = 0 for every ACTIVE member and unallocated_amount_cents = 0"
      - from: RESPONSE_SUBMITTED
        to: ABATED_PARTIAL
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/agency-determination with determination == ABATED_PARTIAL"
        actor: ComplianceOfficer
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "0 < abated_amount_cents < proposed_amount_cents"
        side_effects:
          - "sets determination and abated_amount_cents; member allocations are left in place as the sustained split"
      - from: RESPONSE_SUBMITTED
        to: SUSTAINED
        trigger: "POST /ale-reporting/penalty-notices/{notice_id}/agency-determination with determination == SUSTAINED"
        actor: ComplianceOfficer
        preconditions:
          - "status == RESPONSE_SUBMITTED"
          - "abated_amount_cents == 0"
        side_effects:
          - "sets determination = SUSTAINED and abated_amount_cents = 0"
          - "reallocates the full proposed_amount_cents across ACTIVE members by reporting_year_ft_months with the largest-remainder rule, so allocated_total_cents == proposed_amount_cents"

  - entity: TransmittalError
    initial_state: OPEN
    terminal_states: [CORRECTED, ACCEPTED_AS_FILED]
    transitions:
      - from: OPEN
        to: CORRECTED
        trigger: "POST /ale-reporting/transmittal-errors/{error_id}/resolve with resolution == CORRECT_FORM"
        actor: Preparer
        preconditions:
          - "resolution_status == OPEN"
          - "form_1095c_id is not null"
          - "Transmittal.status IN {ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED, CORRECTION_REQUIRED}"
        side_effects:
          - "creates a CORRECTED Form1095C whose corrected_from_form_id is form_1095c_id, sets corrected_form_id, resolved_by_user_id and resolution_note"
          - "the referenced form moves filing_status FILED_WITH_ERRORS -> CORRECTION_DRAFTED, which increments ControlledGroup.open_correction_count and moves a DETERMINED_ALE group to CORRECTION_OPEN"
          - "decrements Transmittal.open_error_count"
      - from: OPEN
        to: ACCEPTED_AS_FILED
        trigger: "POST /ale-reporting/transmittal-errors/{error_id}/resolve with resolution == ACCEPT_AS_FILED"
        actor: Preparer
        preconditions:
          - "resolution_status == OPEN"
          - "severity == WARNING"
        side_effects:
          - "sets resolved_by_user_id and resolution_note, decrements Transmittal.open_error_count"
          - "no correction form is created and no group counter changes"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: ale-determination-stale-group
    parent_entity: ControlledGroup
    write_endpoint: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"
    occ_field: "expected_controlled_group_version"
    description: |
      Running an ALE determination against a ControlledGroup whose version has
      advanced since the client last read it is rejected. A determination
      legitimately supersedes the prior one (DETERMINED_ALE -> DETERMINED_ALE),
      so a second determination carrying an outdated view of the group would
      otherwise silently overwrite counts derived from headcounts the client
      never saw.
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412
  - rule_id: transmittal-create-stale-member
    parent_entity: GroupMember
    write_endpoint: "POST /ale-reporting/transmittals"
    occ_field: "expected_group_member_version"
    description: |
      Creating a Transmittal for a GroupMember whose version has advanced since
      the client last read it is rejected. Creating a transmittal legitimately
      supersedes the member's prior BUILT transmittal, so a stale view of the
      member (its open_transmittal_id, attached/unattached form counts or
      reporting-year full-time months) must not be the basis of a new submission.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: aggregate_fte_month_and_ale_status
    trigger: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination (writes ControlledGroup.monthly_group_fte, annual_average_fte_raw, annual_average_fte, ale_reason, seasonal_exception_applied)"
    algorithm: aggregation + threshold
    formula: |
      # Input set: MonthlyHeadcount rows with count_year == PRIOR_YEAR belonging to
      # GroupMember rows with member_status == ACTIVE. REPORTING_YEAR rows are never
      # read here. A missing (member, month) pair for any month 1..12 is fatal:
      # ERR_HEADCOUNT_INCOMPLETE.
      counted_members =
          [gm for gm in GroupMember where gm.controlled_group_id == group.id
                                    and gm.member_status == ACTIVE]
          if basis == AGGREGATED
          else [GroupMember(single_member_id)]              # basis == SINGLE_MEMBER

      for m in 1..12:
          # ROUNDING ORDER IS PINNED: the part-time quotient is rounded to 2 decimals
          # per member, the member values are summed at full 2-decimal precision, and
          # ONLY the group sum is truncated. Truncating per member and then summing is
          # the wrong order and yields a smaller count.
          member_fte(gm, m)  = hc(gm, m).full_time_employee_count
                             + round_half_up(hc(gm, m).part_time_hours_total / FTE_HOURS_DIVISOR, 2)
          group_fte_raw(m)   = round_half_up(sum(member_fte(gm, m) for gm in counted_members), 2)
          monthly_group_fte[m-1] = floor(group_fte_raw(m))

      annual_average_fte_raw = round_half_up(sum(monthly_group_fte) / 12, 2)
      annual_average_fte     = floor(annual_average_fte_raw)

      # Seasonal-worker exception (evaluated ONLY when the threshold is met):
      months_over = [m for m in 1..12 if monthly_group_fte[m-1] > ALE_THRESHOLD]   # strictly greater
      seasonal_ok = len(months_over) <= SEASONAL_EXCEPTION_MAX_MONTHS
                    and all( monthly_group_fte[m-1]
                             - sum(hc(gm, m).seasonal_excess_count for gm in counted_members)
                             <= ALE_THRESHOLD
                             for m in months_over )

      if annual_average_fte >= ALE_THRESHOLD and not (len(months_over) >= 1 and seasonal_ok):
          determination_state = DETERMINED_ALE ; ale_reason = THRESHOLD_MET
          seasonal_exception_applied = false
      elif annual_average_fte >= ALE_THRESHOLD:
          determination_state = DETERMINED_NON_ALE ; ale_reason = SEASONAL_EXCEPTION
          seasonal_exception_applied = true
      else:
          determination_state = DETERMINED_NON_ALE ; ale_reason = BELOW_THRESHOLD
          seasonal_exception_applied = false
    input_set: "MonthlyHeadcount rows with count_year == PRIOR_YEAR for GroupMember rows with member_status == ACTIVE in the group; under SINGLE_MEMBER basis only the named member's rows; INACTIVE members and REPORTING_YEAR rows are excluded."
    constants:
      ALE_THRESHOLD: 50
      FTE_HOURS_DIVISOR: 120
      SEASONAL_EXCEPTION_MAX_MONTHS: 4
    precision: "member part-time quotient at 2 decimals round_half_up; group monthly total truncated with floor; annual average rounded to 2 decimals round_half_up then truncated with floor"
    variants:
      - name: aggregated_group_basis
        when: "request body basis == AGGREGATED"
        difference: "Counts every ACTIVE GroupMember of the group, so members that are individually below 50 aggregate into ALE status."
      - name: single_member_basis
        when: "request body basis == SINGLE_MEMBER with single_member_id"
        difference: "Counts only the named member; identical headcount data can therefore yield DETERMINED_NON_ALE where the aggregated basis yields DETERMINED_ALE."

  - name: full_time_month_determination
    trigger: "POST /ale-reporting/employees/{employee_id}/full-time-recompute, and again as a side effect of POST /ale-reporting/forms-1095c and POST /ale-reporting/forms-1095c/{form_id}/regenerate (writes Employee.full_time_months, full_time_month_count, measured_average_hours, ft_source_by_month and MonthlyCoverageLine.full_time_flag / ft_source)"
    algorithm: dual_variant chronological
    formula: |
      method = employee.measurement_method_override
             or GroupMember(employee.group_member_id).measurement_method     # effective_measurement_method

      # ---------- variant MONTHLY ----------
      # Input set: HoursRecord rows with measurement_year == FilingSeason.tax_year.
      full_time(m) = (hr(m).counted_hours >= MONTHLY_FT_HOURS_THRESHOLD)     # >= , not >
      ft_source(m) = MONTHLY_ACTUAL
      measured_average_hours = null
      # A month with no HoursRecord row counts as 0 hours and is NOT full time.

      # ---------- variant LOOK_BACK ----------
      # Governing cycle: the MeasurementCycle with cycle_type == INITIAL and
      # employee_id == employee.id when one exists, else the member's cycle_type ==
      # STANDARD cycle. When neither exists: ERR_MEASUREMENT_METHOD_CONFLICT.
      cycle_months = months m of measurement_year Y such that the first day of month m
                     lies within [cycle.measurement_start_date, cycle.measurement_end_date]
      # Input set: HoursRecord rows of the employee whose (measurement_year, month) is a
      # cycle month. Months whose HoursRecord has excluded_from_denominator == true are
      # dropped from BOTH numerator and denominator; special_unpaid_leave_hours is never
      # added to the numerator.
      counted = [hr for hr in cycle_month_records if hr.excluded_from_denominator == false]
      if len(counted) == 0: raise ERR_NO_HOURS_DATA
      measured_average_hours = round_half_up(sum(hr.counted_hours for hr in counted) / len(counted), 2)
      ft_for_stability = (measured_average_hours >= cycle.hours_threshold_monthly)   # >= , not >
      for m in 1..12 of FilingSeason.tax_year:
          if first day of month m lies within [cycle.stability_start_date, cycle.stability_end_date]:
              full_time(m) = ft_for_stability ; ft_source(m) = LOOK_BACK_STABILITY
          else:
              full_time(m) = (hr(tax_year, m).counted_hours >= MONTHLY_FT_HOURS_THRESHOLD)
              ft_source(m) = MONTHLY_ACTUAL

      # ---------- employment overlay (both variants) ----------
      # YEAR HANDLING IS PINNED so month numbers from other calendar years cannot
      # leak into the reporting year:
      #   hire_month = month_of(hire_date)        when year(hire_date) == tax_year
      #              = 0                          when year(hire_date) <  tax_year
      #   term_month = month_of(termination_date) when year(termination_date) == tax_year
      #              = 0                          when year(termination_date) <  tax_year
      #              = 13                         when year(termination_date) >  tax_year
      if m < hire_month or (termination_date is not null and m > term_month):
          full_time(m) = false ; ft_source(m) = NOT_EMPLOYED

      full_time_months = ascending [m for m in 1..12 if full_time(m)]
      full_time_month_count = len(full_time_months)
    input_set: "MONTHLY reads HoursRecord rows with measurement_year == tax_year; LOOK_BACK reads HoursRecord rows whose (measurement_year, month) falls in the governing MeasurementCycle's measurement window and whose excluded_from_denominator is false, then projects one verdict across the stability period."
    constants:
      MONTHLY_FT_HOURS_THRESHOLD: 130
    precision: "average hours to 2 decimals round_half_up; comparison against the threshold is >="
    variants:
      - name: monthly_measurement
        when: "effective_measurement_method == MONTHLY"
        difference: "Each month stands alone: a month at 100 counted hours is not full time even when the year averages 130."
      - name: look_back_stability
        when: "effective_measurement_method == LOOK_BACK"
        difference: "One average over the measurement period is projected onto every stability month, so identical hours can produce 12 full-time months where MONTHLY produces 0."

  - name: affordability_safe_harbor_test
    trigger: "POST /ale-reporting/forms-1095c and POST /ale-reporting/forms-1095c/{form_id}/regenerate, step 5 of monthly_code_assignment (writes MonthlyCoverageLine.affordability_threshold_cents and safe_harbor_applied)"
    algorithm: threshold + weighted_scoring
    formula: |
      # EVALUATION ORDER IS PINNED and is not the reading order of the form:
      #   (1) full_time_month_determination
      #   (2) line14_code for all twelve months
      #   (3) offered_month_count = count(month where line14_code != "1H")
      #   (4) the W-2 denominator, which is offered_month_count from step (3)
      #   (5) this calculation
      #   (6) line16_code
      #   (7) assessable
      # Step (4) is what makes the W-2 harbor look circular: its threshold depends on a
      # count that only exists after every line 14 code has been assigned.

      w2_available   = employee.w2_box1_wages_cents > 0 and offered_month_count > 0
      rate_available = (employee.is_hourly and employee.hourly_rate_cents > 0)
                    or ((not employee.is_hourly) and employee.monthly_salary_cents > 0)

      w2_threshold_cents   = round_half_up(employee.w2_box1_wages_cents
                                           * season.affordability_pct / offered_month_count)
      rate_threshold_cents = round_half_up(employee.hourly_rate_cents * MONTHLY_FT_HOURS_THRESHOLD
                                           * season.affordability_pct)          if employee.is_hourly
                             else round_half_up(employee.monthly_salary_cents
                                           * season.affordability_pct)
      fpl_threshold_cents  = round_half_up(season.mainland_fpl_annual_cents
                                           * season.affordability_pct / 12)

      # Selection: start at the form's safe_harbor_preference, then fall through the
      # PINNED order W2 -> RATE_OF_PAY -> FPL, skipping harbors whose data is missing.
      # preference == NONE selects NONE outright.
      order = [preference] + [h for h in [W2, RATE_OF_PAY, FPL] if h != preference]
      for h in order:
          if h == W2         and w2_available:   applied = W2         ; threshold = w2_threshold_cents   ; break
          if h == RATE_OF_PAY and rate_available: applied = RATE_OF_PAY ; threshold = rate_threshold_cents ; break
          if h == FPL:                            applied = FPL        ; threshold = fpl_threshold_cents  ; break
      else: applied = NONE ; threshold = null

      affordable(m) = (offer(m).lowest_cost_self_only_cents <= threshold)    # <= is affordable
      # applied == NONE => affordable(m) is false for every month.
    input_set: "The Employee wage fields, the FilingSeason percentage and FPL figure, the Form1095C safe_harbor_preference, and the CoverageOffer covering the whole month; months with no covering offer are never affordable."
    constants:
      MONTHLY_FT_HOURS_THRESHOLD: 130
    precision: "each threshold rounded to whole cents round_half_up; the comparison is <="
    variants:
      - name: w2_safe_harbor
        when: "safe_harbor_preference == W2 and w2_box1_wages_cents > 0 and offered_month_count > 0"
        difference: "Threshold scales with annual Box 1 wages divided by offered months, so a contribution can be affordable here and unaffordable under rate-of-pay for the same employee."
      - name: rate_of_pay_safe_harbor
        when: "the selected harbor resolves to RATE_OF_PAY"
        difference: "Threshold is 130 hours at the lowest hourly rate (or one month of salary), ignoring actual wages, which lands below the W-2 threshold for any employee who worked more than 130 hours a month."
      - name: fpl_safe_harbor
        when: "the selected harbor resolves to FPL"
        difference: "Threshold is a single flat monthly figure for every employee and also gates the 1A qualifying offer code."

  - name: monthly_code_assignment
    trigger: "POST /ale-reporting/forms-1095c and POST /ale-reporting/forms-1095c/{form_id}/regenerate (writes all twelve MonthlyCoverageLine rows and the Form1095C roll-ups)"
    algorithm: constraint_propagation
    formula: |
      for m in 1..12:
        offer(m) = the CoverageOffer of the employee whose covered_months contains m;
                   when several qualify, the one with the latest effective_start_date,
                   tie-broken by the later created_at; when none, NO_OFFER semantics.

        # --- step A: employment overlay ---
        # hire_month and term_month are the year-pinned values defined in
        # full_time_month_determination (0 for a hire in an earlier calendar year,
        # 13 for a termination in a later one), so a person hired before the
        # reporting year is employed in all twelve months.
        if m < hire_month or (termination_date != null and m > term_month):
            line14 = "1H" ; line15 = null ; line16 = "2A" ; full_time_flag = false
            ft_source = NOT_EMPLOYED ; special_situation = NONE ; assessable = false ; continue

        # --- step B: limited non-assessment period ---
        # hire_month == 0 (hired before the reporting year) creates NO waiting-period
        # LNAP month: the waiting period is only in play for a reporting-year hire.
        lnap = (hire_month >= 1 and m is in [hire_month .. hire_month + WAITING_PERIOD_MONTHS])
             or (a governing INITIAL MeasurementCycle exists and the first day of m lies
                 within [measurement_start_date, admin_period_end_date])
        special_situation = WAITING_PERIOD if lnap by waiting period
                            else INITIAL_MEASUREMENT if lnap by initial cycle
                            else NONE
        # TERMINATION / TRANSFER / LEAVE overwrite special_situation later, via the
        # EmploymentEvent cascades in §1.2.

        # --- step C: line 14 (PINNED precedence, first match wins) ---
        if offer(m).offer_kind == NO_OFFER or offer(m) is absent:                line14 = "1H"
        elif offer(m).offer_kind == COBRA_TERMINATED:                            line14 = "1H"
        elif offer(m).offer_kind == RETIREE_COVERAGE:                            line14 = "1G"
        elif offer(m).minimum_value == false:                                    line14 = "1F"
        elif offer(m).conditional_spouse_offer == true:                          line14 = "1K"
        elif offer(m).offer_kind == MEC_MV_FAMILY
             and offer(m).lowest_cost_self_only_cents <= fpl_threshold_cents:    line14 = "1A"
        elif offer(m).offer_kind == MEC_MV_FAMILY:                               line14 = "1E"
        elif offer(m).offer_kind == MEC_MV_SELF_DEP:                             line14 = "1C"
        elif offer(m).offer_kind == MEC_MV_SELF_SPOUSE:                          line14 = "1D"
        else:                                                                    line14 = "1B"

        # --- step D: line 15 ---
        line15 = offer(m).lowest_cost_self_only_cents if line14 in {1B,1C,1D,1E,1K} else null

        # --- step E: line 16, PINNED precedence 2A > 2C > 2D > 2B > (2F|2G|2H) > null ---
        if not employed in m:                                     line16 = "2A"
        elif offer(m).enrolled == true:                            line16 = "2C"
        elif lnap:                                                 line16 = "2D"
        elif full_time_flag == false:                              line16 = "2B"
        elif termination_date != null and m == month_of(termination_date)
             and offer(m).offer_kind != NO_OFFER:                  line16 = "2B"
        elif affordable(m) and safe_harbor_applied == W2:          line16 = "2F"
        elif affordable(m) and safe_harbor_applied == FPL:         line16 = "2G"
        elif affordable(m) and safe_harbor_applied == RATE_OF_PAY: line16 = "2H"
        else:                                                      line16 = null

        assessable = (full_time_flag == true and line16 == null)

      all_12_months_code    = line14 of month 1 when all twelve line14 codes are equal, else null
      ft_month_count        = count(full_time_flag == true)
      offered_month_count   = count(line14 != "1H")
      assessable_month_count= count(assessable == true)
      line15_total_cents    = sum(line15 where line15 != null)
    input_set: "The employee's CoverageOffer rows, full-time verdicts from full_time_month_determination, thresholds from affordability_safe_harbor_test, and the EmploymentEvent-derived hire/termination dates; VOIDED forms are never recomputed."
    constants:
      WAITING_PERIOD_MONTHS: 2
    precision: "cents are integers; no rounding happens in this rule beyond what affordability_safe_harbor_test already pinned"
    variants:
      - name: original_generation
        when: "POST /ale-reporting/forms-1095c on an employee with no ORIGINAL form"
        difference: "All twelve rows are created from scratch and the form starts NOT_FURNISHED x NOT_FILED."
      - name: correction_regeneration
        when: "POST /ale-reporting/forms-1095c/{form_id}/regenerate on a form whose furnishing_status is FURNISHED_PAPER or FURNISHED_ELECTRONIC"
        difference: "A new CORRECTED form is created with corrected_from_form_id set and the twelve rows are recomputed against current data; the original is VOIDED instead of being edited in place."

  - name: penalty_recomputation_and_allocation
    trigger: "POST /ale-reporting/penalty-notices/{notice_id}/recompute (writes PenaltyNotice.a_month_penalty_cents, b_month_penalty_cents, recalculated_amount_cents, allocated_total_cents, unallocated_amount_cents, applied_evidence_count and, on every ACTIVE GroupMember, allocated_exclusion_employees and allocated_penalty_cents)"
    algorithm: constraint_propagation + waterfall_allocation
    formula: |
      penalty_a_monthly_cents = floor(season.penalty_a_annual_cents / 12)
      penalty_b_monthly_cents = floor(season.penalty_b_annual_cents / 12)

      # STEP 1 — apply evidence in created_at ASC order. A piece of evidence whose
      # target was already removed by an earlier piece (two MEC_OFFER_PROOF rows for the
      # same month, or an OFFER_PROOF after an FT_STATUS_DISPUTE on the same
      # employee-month) is left applied == false and changes nothing, so
      # applied_evidence_count <= evidence_count.
      a_months = set(notice.asserted_a_months)
      b_pairs  = set(notice.asserted_b_employee_months)                 # {employee_id, month}
      for ev in PenaltyEvidence of the notice, ordered by created_at ASC:
          if ev.evidence_type == MEC_OFFER_PROOF and ev.month in a_months:
              a_months.remove(ev.month) ; ev.applied = true
          if ev.evidence_type == FT_STATUS_DISPUTE and (ev.employee_id, ev.month) in b_pairs:
              b_pairs.remove((ev.employee_id, ev.month)) ; ev.applied = true
              ft_reduction[ev.month] += 1
          if ev.evidence_type == OFFER_PROOF and (ev.employee_id, ev.month) in b_pairs:
              b_pairs.remove((ev.employee_id, ev.month)) ; ev.applied = true

      # STEP 2 — recompute monthly group full-time counts AFTER step 1.
      # Input set: MonthlyHeadcount rows with count_year == REPORTING_YEAR belonging to
      # GroupMember rows with member_status == ACTIVE.
      group_ft(m) = sum(hc(gm, m).full_time_employee_count for gm in ACTIVE members)
                  - ft_reduction[m]

      # STEP 3 — 4980H(a), one term per surviving asserted month.
      a_month_penalty_cents = sum( max(group_ft(m) - EXCLUSION_EMPLOYEES, 0) * penalty_a_monthly_cents
                                   for m in a_months )

      # STEP 4 — 4980H(b): (a) and (b) are mutually exclusive per month, so any pair whose
      # month survived in a_months is dropped here.
      b_month_penalty_cents = count( (e, m) in b_pairs if m not in a_months ) * penalty_b_monthly_cents

      recalculated_amount_cents = a_month_penalty_cents + b_month_penalty_cents

      # STEP 5 — allocate the 30-employee exclusion across ACTIVE members by
      # largest-remainder on reporting_year_ft_months, so the units always sum to 30.
      weight(gm)   = gm.reporting_year_ft_months
      total_weight = sum(weight(gm) for gm in ACTIVE members)
      base(gm)     = floor(EXCLUSION_EMPLOYEES * weight(gm) / total_weight)
      remainder    = EXCLUSION_EMPLOYEES - sum(base(gm))
      # remainder units go one at a time to the largest fractional part
      # (EXCLUSION_EMPLOYEES * weight / total_weight - base), ties broken by the larger
      # weight and then by the earlier GroupMember.created_at. Never by id.
      allocated_exclusion_employees(gm) = base(gm) + remainder units received

      # STEP 6 — allocate the recalculated dollars the same way, in cents.
      cents_base(gm) = floor(recalculated_amount_cents * weight(gm) / total_weight)
      cents_remainder = recalculated_amount_cents - sum(cents_base(gm))
      # the whole cents_remainder goes to the member with the largest weight, ties broken
      # by the earlier GroupMember.created_at. Never by id.
      allocated_penalty_cents(gm) = cents_base(gm) + (cents_remainder if gm is that member else 0)

      allocated_total_cents    = sum(allocated_penalty_cents(gm))       # == recalculated_amount_cents
      unallocated_amount_cents = recalculated_amount_cents - allocated_total_cents   # == 0
    input_set: "PenaltyEvidence rows of the notice ordered by created_at ASC, MonthlyHeadcount rows with count_year == REPORTING_YEAR for ACTIVE members, and the FilingSeason penalty amounts; PRIOR_YEAR headcounts are excluded."
    constants:
      EXCLUSION_EMPLOYEES: 30
    precision: "monthly penalty amounts are floor(annual / 12) in whole cents; allocations use floor plus a largest-remainder distribution so the parts sum exactly to the whole"
    variants:
      - name: section_a_recomputation
        when: "surviving asserted months remain in asserted_a_months"
        difference: "Charges every full-time employee above the allocated 30-employee exclusion for the whole month, so one month can cost more than a dozen individual employee-months."
      - name: section_b_recomputation
        when: "surviving employee-month pairs remain whose month is not an (a) month"
        difference: "Charges per employee-month at the higher (b) rate but only for employees the agency named, and is suppressed entirely for any month that survives as an (a) month."

  - name: transmission_channel_requirement
    trigger: "POST /ale-reporting/transmittals/{transmittal_id}/build (writes Transmittal.aggregate_return_count and required_channel; read again by POST /ale-reporting/transmittals/{transmittal_id}/transmit)"
    algorithm: threshold
    formula: |
      # Input set: Transmittal rows of the SAME GroupMember whose status IN
      # {BUILT, TRANSMITTED, ACCEPTED, ACCEPTED_WITH_ERRORS, PARTIALLY_ACCEPTED};
      # DRAFT, REJECTED, CORRECTION_REQUIRED and SUPERSEDED rows are excluded, and this
      # transmittal is counted through its own form_count rather than through the filter.
      form_count = count(Form1095C where transmittal_id == this.id and filing_status != VOIDED)
      other_returns = sum(t.form_count for t in sibling transmittals in the states above
                          if t.id != this.id)
      aggregate_return_count = form_count + other_returns + 1        # the +1 is this 1094-C itself
      required_channel = ELECTRONIC if aggregate_return_count >= season.electronic_filing_threshold
                         else ANY
      # At transmit time: channel == PAPER while required_channel == ELECTRONIC is
      # ERR_ELECTRONIC_FILING_REQUIRED. required_channel == ANY accepts either channel.
    input_set: "This transmittal's non-VOIDED attached forms plus the frozen form_count of sibling transmittals of the same member in BUILT/TRANSMITTED/ACCEPTED/ACCEPTED_WITH_ERRORS/PARTIALLY_ACCEPTED, plus one for the 1094-C."
    constants:
      TRANSMITTAL_SELF_COUNT: 1
    precision: "integer counts; the threshold comparison is >=, so a count exactly equal to electronic_filing_threshold requires electronic transmission"
    variants:
      - name: single_submission_count
        when: "the member has no sibling transmittal in a counted state"
        difference: "Only this submission's forms plus one count, so nine attached forms exactly reach a threshold of ten."
      - name: cumulative_submission_count
        when: "the member already has a counted sibling transmittal"
        difference: "Sibling form counts aggregate, so a two-form correction can push the member over the electronic threshold that its original submission sat below."

  - name: late_furnishing_penalty
    trigger: "POST /ale-reporting/forms-1095c/{form_id}/furnish (writes Form1095C.late_furnishing_penalty_cents and adds the delta to GroupMember.furnishing_penalty_total_cents)"
    algorithm: tiered_pricing
    formula: |
      furnish_date = date part (UTC) of the current logical clock
      days_late = (furnish_date - season.furnishing_deadline_date) in whole days
      if days_late <= 0:                                        penalty = 0
      elif days_late <= TIER1_MAX_DAYS:                          penalty = TIER1_CENTS
      elif furnish_date < season.tier2_cutoff_date:              penalty = TIER2_CENTS
      else:                                                      penalty = TIER3_CENTS
      if intentional_disregard == true:                          penalty = TIER4_CENTS   # overrides every tier
      # Re-furnishing a REDELIVERY_REQUIRED form recomputes the penalty for the new
      # furnish_date and GroupMember.furnishing_penalty_total_cents absorbs only the
      # delta (new penalty - previously recorded penalty for this form).
    input_set: "The single Form1095C being furnished, the FilingSeason deadline and tier-2 cutoff dates, and the logical clock; no other form contributes."
    constants:
      TIER1_MAX_DAYS: 30
      TIER1_CENTS: 6000
      TIER2_CENTS: 12000
      TIER3_CENTS: 31000
      TIER4_CENTS: 63000
    precision: "whole days by UTC date subtraction; whole cents; furnishing exactly on the deadline date is not late"
    variants:
      - name: tiered_by_lateness
        when: "intentional_disregard == false"
        difference: "Three ordered tiers keyed on the day count and the tier-2 cutoff date."
      - name: intentional_disregard_flat
        when: "intentional_disregard == true"
        difference: "A single flat amount replaces the tier lookup even when the statement is only one day late."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
# Every mutating endpoint runs the whole ladder top to bottom and returns the
# FIRST violated rule. The pairs called out in §1.8 rule_id
# priority_pair_validation_conflict all live in this table:
#   * priority 20 (state) beats priority 43 (business_constraint)
#   * priority 23 (business_safety) beats priority 36 (business_temporal)
#   * priority 3 (business_constraint) beats priority 4 (existence)
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: |
      The acting X-User-Role appears in the endpoint's roles list. For the entity-backed
      EmployeeSelfService role the acting X-User-ID must ALSO be the employee the path
      resource belongs to (X-User-ID == FurnishingConsent.employee_id on grant and
      withdraw), because for that role identity is part of the admission test rather than
      a business rule; a mismatch is therefore rejected here, not by a later priority.
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: |
      Request shape: required fields present, types correct, enum values in range, integers >= 0 where
      declared, ownership_pct in (0, 100], ssn_last4 exactly 4 digits, ein exactly 9 digits, month values
      in 1..12, months arrays non-empty, plan_start_month in 0..12, dates well-formed YYYY-MM-DD, and
      intra-body ordering (CoverageOffer.effective_end_date > effective_start_date; MeasurementCycle
      measurement_end_date >= measurement_start_date, admin_period_end_date >= measurement_end_date,
      stability_start_date > admin_period_end_date, stability_end_date >= stability_start_date;
      PenaltyNotice.response_due_date > notice_date; agency-response errors[] entries well-formed).
      Runs BEFORE any existence lookup, so a request that carries both a bad enum and a non-existent id
      returns ERR_INVALID_REQUEST, not a 404.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 4
    category: existence
    check: "every id in the path exists, validated left to right (season_id, group_id, member_id, employee_id, consent_id, form_id, transmittal_id, error_id, notice_id)"
    error_id: "ERR_FILING_SEASON_NOT_FOUND | ERR_CONTROLLED_GROUP_NOT_FOUND | ERR_GROUP_MEMBER_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_CONSENT_NOT_FOUND | ERR_FORM_NOT_FOUND | ERR_TRANSMITTAL_NOT_FOUND | ERR_TRANSMITTAL_ERROR_NOT_FOUND | ERR_PENALTY_NOTICE_NOT_FOUND | ERR_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "every foreign key in the body exists: filing_season_id, controlled_group_id, group_member_id, single_member_id, employee_id, to_group_member_id, form_1095c_id, penalty_notice_id, form_ids[] entries"
    error_id: "the matching ERR_*_NOT_FOUND for the referenced entity"
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key"

  - priority: 6
    category: business_referential
    check: |
      Cross-aggregate scope agreement:
        * attach-forms: Employee(form.employee_id).group_member_id == Transmittal.group_member_id
        * ale-determination with basis == SINGLE_MEMBER: single_member_id belongs to {group_id}
        * MeasurementCycle: employee_id (when present) has group_member_id == the body's group_member_id
        * TransmittalError create: form_1095c_id has transmittal_id == the body's transmittal_id
        * PenaltyEvidence: Employee(employee_id).group_member_id belongs to the notice's controlled group
        * EmploymentEvent TRANSFER: to_group_member_id belongs to the same ControlledGroup as the employee
    error_id: ERR_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/attach-forms, POST /ale-reporting/controlled-groups/{group_id}/ale-determination, POST /ale-reporting/measurement-cycles, POST /ale-reporting/transmittal-errors, POST /ale-reporting/penalty-notices/{notice_id}/evidence, POST /ale-reporting/employment-events"

  - priority: 7
    category: state
    check: "the FilingSeason governing the affected aggregate has status == OPEN"
    error_id: ERR_SEASON_LOCKED
    http_status: 409
    applies_to: "ale-determination, reopen, POST /ale-reporting/forms-1095c, regenerate, furnish, POST /ale-reporting/transmittals, attach-forms, detach-form, build, transmit"

  - priority: 8
    category: state
    check: |
      The ControlledGroup governing the write has determination_state != LOCKED. This rule also guards
      the structural writes that priority 7 does NOT cover — POST /ale-reporting/group-members and
      PATCH /ale-reporting/group-members/{member_id} — which is where it is observable on its own:
      once a season is locked its groups are LOCKED, and an attempt to add or amend a member of such a
      group returns ERR_DETERMINATION_LOCKED rather than ERR_SEASON_LOCKED.
    error_id: ERR_DETERMINATION_LOCKED
    http_status: 409
    applies_to: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination, POST /ale-reporting/controlled-groups/{group_id}/reopen, POST /ale-reporting/forms-1095c, POST /ale-reporting/group-members, PATCH /ale-reporting/group-members/{member_id}"

  - priority: 9
    category: state
    check: "cross-entity: the employee's ControlledGroup has determination_state IN {DETERMINED_ALE, CORRECTION_OPEN} before a Form1095C is generated, and the member's ControlledGroup is in one of those states before a Transmittal is built"
    error_id: ERR_GROUP_NOT_DETERMINED_ALE
    http_status: 409
    applies_to: "POST /ale-reporting/forms-1095c, POST /ale-reporting/forms-1095c/{form_id}/regenerate, POST /ale-reporting/transmittals/{transmittal_id}/build"

  - priority: 10
    category: state
    check: |
      The EmploymentEvent's event_type is a declared transition out of the employee's current
      employment_status: LEAVE_START from ACTIVE, LEAVE_END from ON_LEAVE, TRANSFER from ACTIVE,
      TERMINATION from ACTIVE or ON_LEAVE, REHIRE from TERMINATED.
    error_id: ERR_EMPLOYMENT_EVENT_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /ale-reporting/employment-events"

  - priority: 11
    category: state
    check: "grant requires consent_status IN {PENDING, WITHDRAWN}"
    error_id: ERR_CONSENT_ALREADY_GRANTED
    http_status: 409
    applies_to: "POST /ale-reporting/furnishing-consents/{consent_id}/grant"

  - priority: 12
    category: state
    check: "withdraw requires consent_status == GRANTED"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /ale-reporting/furnishing-consents/{consent_id}/withdraw"

  - priority: 13
    category: state
    check: "furnish requires furnishing_status IN {NOT_FURNISHED, REDELIVERY_REQUIRED}"
    error_id: ERR_FORM_ALREADY_FURNISHED
    http_status: 409
    applies_to: "POST /ale-reporting/forms-1095c/{form_id}/furnish"

  - priority: 14
    category: state
    check: "attach-forms requires every named form to have filing_status == NOT_FILED; the whole call is rejected without attaching any form"
    error_id: ERR_FORM_ALREADY_ATTACHED
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/attach-forms"

  - priority: 15
    category: state
    check: "detach-form requires the form to have filing_status == ATTACHED and transmittal_id == {transmittal_id}"
    error_id: ERR_FORM_NOT_ATTACHED
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/detach-form"

  - priority: 16
    category: state
    check: "regenerate requires the form to have furnishing_status != VOIDED and filing_status != VOIDED"
    error_id: ERR_FORM_VOIDED
    http_status: 409
    applies_to: "POST /ale-reporting/forms-1095c/{form_id}/regenerate, POST /ale-reporting/employees/{employee_id}/full-time-recompute"

  - priority: 17
    category: state
    check: |
      The Transmittal is in a state that admits the operation: build requires status IN
      {DRAFT, REJECTED, CORRECTION_REQUIRED}; attach-forms requires DRAFT; detach-form requires
      DRAFT or BUILT; agency-response requires TRANSMITTED; start-correction-cycle requires
      ACCEPTED_WITH_ERRORS or PARTIALLY_ACCEPTED.
    error_id: ERR_TRANSMITTAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/build, attach-forms, detach-form, agency-response, start-correction-cycle"

  - priority: 18
    category: state
    check: "resolve requires TransmittalError.resolution_status == OPEN, and resolution == ACCEPT_AS_FILED requires severity == WARNING"
    error_id: ERR_ERROR_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /ale-reporting/transmittal-errors/{error_id}/resolve"

  - priority: 19
    category: state
    check: |
      The PenaltyNotice is in a state that admits the operation: evidence requires status IN
      {RECEIVED, EVIDENCE_GATHERING, RECOMPUTED}; recompute requires EVIDENCE_GATHERING with
      evidence_count >= 1; agency-determination requires RESPONSE_SUBMITTED.
    error_id: ERR_NOTICE_STATE_INVALID
    http_status: 409
    applies_to: "POST /ale-reporting/penalty-notices/{notice_id}/evidence, recompute, agency-determination"

  - priority: 20
    category: state
    check: "transmit requires Transmittal.status == BUILT; submit-response and allocation/reset require PenaltyNotice.status == RECOMPUTED"
    error_id: "ERR_TRANSMITTAL_NOT_BUILT | ERR_NOTICE_NOT_RECOMPUTED"
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/transmit, POST /ale-reporting/penalty-notices/{notice_id}/submit-response, POST /ale-reporting/penalty-notices/{notice_id}/allocation/reset"

  - priority: 21
    category: state
    check: "expected_controlled_group_version == ControlledGroup.version (§1.2.1 ale-determination-stale-group)"
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412
    applies_to: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"

  - priority: 22
    category: state
    check: "expected_group_member_version == GroupMember.version (§1.2.1 transmittal-create-stale-member)"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /ale-reporting/transmittals"

  - priority: 23
    category: business_safety
    check: |
      Segregation of duties, evaluated on X-User-ID:
        * furnish: X-User-ID != Form1095C.generated_by_user_id
        * transmit: X-User-ID != Transmittal.built_by_user_id
        * submit-response: X-User-ID != PenaltyNotice.last_evidence_user_id
      This is a compliance control and therefore outranks every remaining business rule,
      including the temporal windows at priorities 33-36.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ale-reporting/forms-1095c/{form_id}/furnish, POST /ale-reporting/transmittals/{transmittal_id}/transmit, POST /ale-reporting/penalty-notices/{notice_id}/submit-response"

  - priority: 24
    category: business_referential
    check: "ale-determination requires 12 MonthlyHeadcount rows with count_year == PRIOR_YEAR (months 1..12) for every counted member; under SINGLE_MEMBER basis only the named member is checked"
    error_id: ERR_HEADCOUNT_INCOMPLETE
    http_status: 409
    applies_to: "POST /ale-reporting/controlled-groups/{group_id}/ale-determination"

  - priority: 25
    category: business_referential
    check: "an employee whose effective_measurement_method == LOOK_BACK has a governing MeasurementCycle (own INITIAL cycle, else the member's STANDARD cycle)"
    error_id: ERR_MEASUREMENT_METHOD_CONFLICT
    http_status: 409
    applies_to: "POST /ale-reporting/employees/{employee_id}/full-time-recompute, POST /ale-reporting/forms-1095c, POST /ale-reporting/forms-1095c/{form_id}/regenerate"

  - priority: 26
    category: business_referential
    check: "the LOOK_BACK denominator is non-empty: at least one HoursRecord in the measurement window survives the excluded_from_denominator filter (empty-set boundary)"
    error_id: ERR_NO_HOURS_DATA
    http_status: 422
    applies_to: "POST /ale-reporting/employees/{employee_id}/full-time-recompute, POST /ale-reporting/forms-1095c, POST /ale-reporting/forms-1095c/{form_id}/regenerate"

  - priority: 27
    category: business_referential
    check: "build requires form_count >= 1 (zero-count boundary: an empty transmittal cannot be built)"
    error_id: ERR_NO_FORMS_ATTACHED
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/build"

  - priority: 28
    category: business_referential
    check: "build from status == CORRECTION_REQUIRED requires open_error_count == 0"
    error_id: ERR_OPEN_TRANSMITTAL_ERRORS
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/build"

  - priority: 29
    category: business_referential
    check: "cross-entity: furnish with delivery_channel == ELECTRONIC requires the employee to have a FurnishingConsent with consent_status == GRANTED"
    error_id: ERR_CONSENT_NOT_GRANTED
    http_status: 409
    applies_to: "POST /ale-reporting/forms-1095c/{form_id}/furnish"

  - priority: 30
    category: business_referential
    check: "lock requires FilingSeason.open_correction_count == 0 and every Transmittal of every ACTIVE member of every group of the season to be in {ACCEPTED, SUPERSEDED}"
    error_id: ERR_SEASON_NOT_LOCKABLE
    http_status: 409
    applies_to: "POST /ale-reporting/filing-seasons/{season_id}/lock"

  - priority: 31
    category: business_referential
    check: "recompute requires every Form1095C named by FT_STATUS_DISPUTE or OFFER_PROOF evidence to have filing_status IN {FILED_ACCEPTED, FILED_WITH_ERRORS, CORRECTION_DRAFTED}"
    error_id: ERR_EVIDENCE_FORM_NOT_FILED
    http_status: 409
    applies_to: "POST /ale-reporting/penalty-notices/{notice_id}/recompute"

  - priority: 32
    category: business_referential
    check: "evidence with evidence_type == MEC_OFFER_PROOF names a month present in asserted_a_months; FT_STATUS_DISPUTE and OFFER_PROOF name an (employee_id, month) pair present in asserted_b_employee_months"
    error_id: ERR_EVIDENCE_MONTH_NOT_ASSERTED
    http_status: 422
    applies_to: "POST /ale-reporting/penalty-notices/{notice_id}/evidence"

  - priority: 33
    category: business_temporal
    check: |
      MeasurementCycle stability periods of the same employee (or, for a STANDARD cycle, of the same
      group_member_id with employee_id null) use CLOSED intervals [stability_start_date,
      stability_end_date]: a new cycle is rejected when new_start <= existing_end AND
      new_end >= existing_start. Touching endpoints collide — a new period may start only strictly
      after the existing period's end date.
    error_id: ERR_STABILITY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ale-reporting/measurement-cycles"

  - priority: 34
    category: business_temporal
    check: |
      CoverageOffer intervals of the same employee use HALF-OPEN intervals
      [effective_start_date, effective_end_date): a new offer is rejected when
      new_start < existing_end AND new_end > existing_start. An offer starting exactly on an existing
      offer's effective_end_date is therefore legal, which is the opposite adjacency treatment from
      priority 33.
    error_id: ERR_COVERAGE_OFFER_OVERLAP
    http_status: 409
    applies_to: "POST /ale-reporting/coverage-offers"

  - priority: 35
    category: business_temporal
    check: "furnish requires the current logical clock date to be strictly after {FilingSeason.tax_year}-12-31; a statement for a year that has not ended cannot be furnished (at the default clock 2026-08-01 this always fails for tax_year 2026)"
    error_id: ERR_FURNISHING_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /ale-reporting/forms-1095c/{form_id}/furnish"

  - priority: 36
    category: business_temporal
    check: "evidence, recompute and submit-response require the current logical clock date <= PenaltyNotice.response_due_date (the due date itself is still inside the window)"
    error_id: ERR_NOTICE_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /ale-reporting/penalty-notices/{notice_id}/evidence, recompute, submit-response"

  - priority: 37
    category: business_constraint
    check: "declared uniqueness keys are free: FilingSeason.tax_year, GroupMember.ein within controlled_group_id, PenaltyNotice.notice_number, and at most one FurnishingConsent per employee"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /ale-reporting/filing-seasons, POST /ale-reporting/group-members, POST /ale-reporting/penalty-notices, POST /ale-reporting/furnishing-consents"

  - priority: 38
    category: business_constraint
    check: "no MonthlyHeadcount already exists for any (group_member_id, count_year, month) in the request; a duplicate anywhere in the months array rejects the entire call and creates nothing"
    error_id: ERR_DUPLICATE_HEADCOUNT_MONTH
    http_status: 409
    applies_to: "POST /ale-reporting/monthly-headcounts"

  - priority: 39
    category: business_constraint
    check: "no HoursRecord already exists for any (employee_id, measurement_year, month) in the request; a duplicate anywhere in the months array rejects the entire call and creates nothing"
    error_id: ERR_DUPLICATE_HOURS_MONTH
    http_status: 409
    applies_to: "POST /ale-reporting/hours-records"

  - priority: 40
    category: business_constraint
    check: "POST /ale-reporting/forms-1095c requires the employee to have no Form1095C with form_type == ORIGINAL and furnishing_status != VOIDED; corrections are created through regenerate or error resolution, never through a second original"
    error_id: ERR_DUPLICATE_FORM
    http_status: 409
    applies_to: "POST /ale-reporting/forms-1095c"

  - priority: 41
    category: business_constraint
    check: "TRANSFER requires to_group_member_id != the employee's current group_member_id and the target member_status == ACTIVE"
    error_id: ERR_TRANSFER_TARGET_INVALID
    http_status: 409
    applies_to: "POST /ale-reporting/employment-events"

  - priority: 42
    category: business_constraint
    check: "build from REJECTED or CORRECTION_REQUIRED, and start-correction-cycle, require cycle_number < CORRECTION_CYCLE_LIMIT (3)"
    error_id: ERR_CORRECTION_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/build, POST /ale-reporting/transmittals/{transmittal_id}/start-correction-cycle"

  - priority: 43
    category: business_constraint
    check: "transmit with channel == PAPER is rejected when required_channel == ELECTRONIC (aggregate_return_count >= electronic_filing_threshold). Sits below priority 20, so transmitting a DRAFT transmittal that would also breach the electronic threshold returns ERR_TRANSMITTAL_NOT_BUILT."
    error_id: ERR_ELECTRONIC_FILING_REQUIRED
    http_status: 409
    applies_to: "POST /ale-reporting/transmittals/{transmittal_id}/transmit"

  - priority: 44
    category: business_fiscal
    check: "submit-response requires recalculated_amount_cents is not null and unallocated_amount_cents == 0 (the allocation across members must be settled)"
    error_id: ERR_ALLOCATION_NOT_SETTLED
    http_status: 409
    applies_to: "POST /ale-reporting/penalty-notices/{notice_id}/submit-response"

  - priority: 45
    category: business_fiscal
    check: "agency-determination amounts agree with the determination: ABATED_FULL requires abated_amount_cents == proposed_amount_cents, ABATED_PARTIAL requires 0 < abated_amount_cents < proposed_amount_cents, SUSTAINED requires abated_amount_cents == 0"
    error_id: ERR_ABATEMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /ale-reporting/penalty-notices/{notice_id}/agency-determination"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
# Path convention: api_prefix `/ale-reporting` is a namespace, not a collection.
# Every entity therefore owns a FLAT top-level collection under that namespace
# (entity_topology: flat), a single-resource GET, and a filtered list GET that
# accepts each of its foreign keys as an optional query parameter — that
# filtered list is the reverse-reachability channel for all 22 FKs in §1.1,
# including the cascade-created children (MonthlyCoverageLine, TransmittalError,
# correction Form1095C) that no create response can ever return.
endpoints:
  # ---------------- FilingSeason ----------------
  - method: POST
    path: "/ale-reporting/filing-seasons"
    description: "Open a filing season for one tax year. The season carries the affordability percentage, FPL figure, statutory penalty amounts, electronic-filing threshold and the three deadline dates every downstream calculation reads."
    roles: [ComplianceOfficer]
    code: 201
    input: [tax_year, furnishing_deadline_date, filing_deadline_date, tier2_cutoff_date, "affordability_pct?", "mainland_fpl_annual_cents?", "penalty_a_annual_cents?", "penalty_b_annual_cents?", "electronic_filing_threshold?"]
    output: FilingSeason
    side_effects: ["status = OPEN", "open_correction_count = 0"]
  - method: GET
    path: "/ale-reporting/filing-seasons"
    description: "List filing seasons, optionally filtered by status."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["status?", "tax_year?"]
    output: FilingSeason[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/filing-seasons/{id}"
    description: "Read one filing season, including open_correction_count and locked_at."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: FilingSeason
    side_effects: []
  - method: POST
    path: "/ale-reporting/filing-seasons/{season_id}/lock"
    description: "Lock the season once no correction is open and every transmittal has settled. Cascades LOCKED onto every determined ControlledGroup of the season."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FilingSeason
    side_effects: ["status = LOCKED", "locked_at set from the logical clock", "every ControlledGroup with determination_state IN {DETERMINED_ALE, DETERMINED_NON_ALE} moves to LOCKED"]

  # ---------------- ControlledGroup ----------------
  - method: POST
    path: "/ale-reporting/controlled-groups"
    description: "Register a controlled group (aggregated ALE group) inside a filing season."
    roles: [ComplianceOfficer]
    code: 201
    input: [filing_season_id, name]
    output: ControlledGroup
    side_effects: ["determination_state = NOT_DETERMINED", "version = 1"]
  - method: GET
    path: "/ale-reporting/controlled-groups"
    description: "List controlled groups; filter by filing_season_id (FK reverse lookup) or determination_state."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["filing_season_id?", "determination_state?"]
    output: ControlledGroup[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/controlled-groups/{id}"
    description: "Read one controlled group, including monthly_group_fte, annual_average_fte_raw, annual_average_fte, ale_reason, open_correction_count and version (the value an OCC caller must echo back)."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: ControlledGroup
    side_effects: []
  - method: POST
    path: "/ale-reporting/controlled-groups/{group_id}/ale-determination"
    description: "Run the applicable-large-employer determination on prior-year headcounts. OCC-guarded on the group's version (§1.2.1 ale-determination-stale-group)."
    roles: [ComplianceOfficer]
    code: 200
    input: [basis, expected_controlled_group_version, "single_member_id?"]
    output: ControlledGroup
    side_effects: ["runs aggregate_fte_month_and_ale_status", "writes monthly_group_fte, annual_average_fte_raw, annual_average_fte, determination_basis, ale_reason, seasonal_exception_applied, determined_at, last_determination_user_id", "recomputes GroupMember.reporting_year_ft_months for every ACTIVE member", "increments ControlledGroup.version by 1"]
  - method: POST
    path: "/ale-reporting/controlled-groups/{group_id}/reopen"
    description: "Reopen a determined group so a new determination can be run; refused once any transmittal of the group has been sent to the agency."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: ControlledGroup
    side_effects: ["determination_state = REOPENED", "clears determination outputs", "increments ControlledGroup.version by 1"]

  # ---------------- GroupMember ----------------
  - method: POST
    path: "/ale-reporting/group-members"
    description: "Add an EIN-level member to a controlled group with its default measurement method."
    roles: [ComplianceOfficer]
    code: 201
    input: [controlled_group_id, ein, legal_name, ownership_pct, "measurement_method?"]
    output: GroupMember
    side_effects: ["member_status = ACTIVE", "all counters 0", "version = 1"]
  - method: GET
    path: "/ale-reporting/group-members"
    description: "List members; filter by controlled_group_id (FK reverse lookup) or member_status."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["controlled_group_id?", "member_status?"]
    output: GroupMember[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/group-members/{id}"
    description: "Read one member, including generated/unattached/attached form counts, reporting_year_ft_months, allocated_exclusion_employees, allocated_penalty_cents, furnishing_penalty_total_cents and version (the value an OCC caller must echo back)."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: GroupMember
    side_effects: []
  - method: PATCH
    path: "/ale-reporting/group-members/{member_id}"
    description: "Administrative update of a member's default measurement method or member_status; deactivating a member removes it from every aggregate input set."
    roles: [ComplianceOfficer]
    code: 200
    input: ["measurement_method?", "member_status?"]
    output: GroupMember
    side_effects: ["increments GroupMember.version by 1", "employees inheriting the method get effective_measurement_method recomputed on their next full-time recompute"]

  # ---------------- MonthlyHeadcount ----------------
  - method: POST
    path: "/ale-reporting/monthly-headcounts"
    description: "Record one member's headcount for a set of months of either the prior or the reporting year. One MonthlyHeadcount row is created per entry in months, all carrying the same counts; the call is atomic, so a duplicate month anywhere in the array creates nothing."
    roles: [ComplianceOfficer, BenefitsAdmin]
    code: 201
    input: [group_member_id, count_year, months, full_time_employee_count, part_time_hours_total, total_employee_count, "seasonal_excess_count?"]
    output: MonthlyHeadcount[]
    side_effects: ["computes member_fte per created row"]
  - method: GET
    path: "/ale-reporting/monthly-headcounts"
    description: "List headcount rows; filter by group_member_id (FK reverse lookup), count_year or month."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["group_member_id?", "count_year?", "month?"]
    output: MonthlyHeadcount[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/monthly-headcounts/{id}"
    description: "Read one headcount row including its computed member_fte."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: MonthlyHeadcount
    side_effects: []

  # ---------------- MeasurementCycle ----------------
  - method: POST
    path: "/ale-reporting/measurement-cycles"
    description: "Declare a standard (member-wide, employee_id null) or initial (single-employee) look-back measurement cycle with its administrative period and stability period."
    roles: [ComplianceOfficer, BenefitsAdmin]
    code: 201
    input: [group_member_id, cycle_type, measurement_start_date, measurement_end_date, admin_period_end_date, stability_start_date, stability_end_date, "employee_id?", "hours_threshold_monthly?"]
    output: MeasurementCycle
    side_effects: []
  - method: GET
    path: "/ale-reporting/measurement-cycles"
    description: "List measurement cycles; filter by group_member_id or employee_id (both FK reverse lookups) or cycle_type."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: ["group_member_id?", "employee_id?", "cycle_type?"]
    output: MeasurementCycle[]
    side_effects: []
  - method: GET
    path: "/ale-reporting/measurement-cycles/{id}"
    description: "Read one measurement cycle."
    roles: [ComplianceOfficer, Preparer, FilingAgent, BenefitsAdmin]
    code: 200
    input: []
    output: MeasurementCycle
    side_effects: []

  # ---------------- Employee ----------------
  - method: POST
    path: "/ale-reporting/employees"
    description: "Hire an employee into a group member. effective_measurement_method resolves from measurement_method_override, else from the member's measurement_method."
    roles: [BenefitsAdmin]
    code: 201
    input: [group_member_id, full_name, ssn_last4, hire_date, employment_type, is_hourly, "hourly_rate_cents?", "monthly_salary_cents?", "w2_box1_wages_cents?", "measurement_method_override?"]
    output: Employee
    side_effects: ["employment_status = ACTIVE", "effective_measurement_method resolved", "full_time_month_count = 0"]
  - method: GET
    path: "/ale-reporting/employees"
