scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: acwr_rolling_vs_ewma_divergence
        grounds:
          - calculations.acute_chronic_workload_ratio
          - calculations.load_flag_threshold
          - entities.Team.fields.acwr_variant
          - entities.Athlete.fields.load_flag
        distinguishing_aspect: |
          Identical WorkloadSession history produces acute_chronic_workload_ratio
          2.800 (load_flag SPIKE) under Team.acwr_variant=ROLLING but 1.241
          (load_flag NONE) under EWMA — different entity domain (workload
          analytics on Athlete/WorkloadSession) than the billing dual-variant.
        test_recipe:
          setup:
            - "Team T_ROLL (acwr_variant ROLLING) and Team T_EWMA (acwr_variant EWMA), each with one athlete"
            - "Identical session history on both athletes: load 100 on 2026-07-05, 07-12, 07-19, and each day 2026-07-22..2026-07-28 (10 qualifying PRACTICE sessions, today = 2026-07-28)"
            - "Clock pinned at 2026-07-28T00:00:00Z"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "Roll", sport: "FOOTBALL", season_start_date: "2026-07-01", season_end_date: "2027-02-01", acwr_variant: "ROLLING" }
              as: TeamAdmin
              captures: { t_roll: $.data.id }
            - call: "POST /sports-med/teams"
              payload: { name: "Ewma", sport: "FOOTBALL", season_start_date: "2026-07-01", season_end_date: "2027-02-01", acwr_variant: "EWMA" }
              as: TeamAdmin
              captures: { t_ewma: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_roll}", full_name: "A Roll", position: "QB", enrollment_date: "2026-07-01" }
              as: TeamAdmin
              captures: { a_roll: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_ewma}", full_name: "A Ewma", position: "QB", enrollment_date: "2026-07-01" }
              as: TeamAdmin
              captures: { a_ewma: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-28T00:00:00Z" }
              as: TeamAdmin
            # identical 10-session history on both athletes (dates 07-05,07-12,07-19,07-22..07-28; duration 100, rpe 1 -> load 100)
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-05", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-12", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-19", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-22", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-23", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-24", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-25", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-26", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-27", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_roll}", session_date: "2026-07-28", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-05", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-12", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-19", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-22", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-23", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-24", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-25", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-26", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-27", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
            - call: "POST /sports-med/workload-sessions"
              payload: { athlete_id: "${a_ewma}", session_date: "2026-07-28", session_type: "PRACTICE", surface: "GRASS", duration_minutes: 100, rpe: 1 }
              as: PerformanceStaff
          trigger:
            - call: "GET /sports-med/athletes/${a_roll}"
              payload: {}
              as: PerformanceStaff
              captures: { roll_ratio: $.data.acute_chronic_workload_ratio, roll_flag: $.data.load_flag }
            - call: "GET /sports-med/athletes/${a_ewma}"
              payload: {}
              as: PerformanceStaff
              captures: { ewma_ratio: $.data.acute_chronic_workload_ratio, ewma_flag: $.data.load_flag }
          assert:
            - "Athlete.${a_roll}.acute_chronic_workload_ratio == 2.800"
            - "Athlete.${a_roll}.load_flag == SPIKE"
            - "Athlete.${a_ewma}.acute_chronic_workload_ratio == 1.241"
            - "Athlete.${a_ewma}.load_flag == NONE"
            - "roll_ratio != ewma_ratio"

      - name: claim_adjudication_initial_vs_readjudication_divergence
        grounds:
          - calculations.claim_adjudication
          - state_machines.Claim.APPEALED_to_ADJUDICATED
          - entities.InsurancePolicy.fields.deductible_met_cents
          - entities.InsurancePolicy.fields.oop_accrued_cents
        distinguishing_aspect: |
          The same Claim.billed_amount_cents (200000) splits patient 42500 /
          payer 157500 at initial adjudication but patient 20000 / payer 180000
          at readjudication-after-appeal because intervening claims advanced the
          policy accumulators — billing entity domain, distinct from the ACWR
          workload domain of the sibling instance.
        test_recipe:
          setup:
            - "Team, athlete, one OPEN injury case"
            - "Policy P: deductible 25000, coinsurance 90, oop_max 100000; policy year 2026-01-01..2026-12-31"
            - "Claim C on P billed 200000 (line items sum to 200000, service_date 2026-08-02), SUBMITTED then DENIED at first adjudication"
            - "Claim D billed 100000 and Claim E billed 80000 adjudicated (non-denied) after C's denial: D -> patient 32500 (ded 25000 + coins 7500), E -> patient 8000 (ded met, coins 8000); accumulators now deductible_met 25000, oop_accrued 40500"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "SOCCER", season_start_date: "2026-07-01", season_end_date: "2026-12-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "F", enrollment_date: "2026-07-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S83.511A", body_region: "KNEE", severity_class: "MODERATE", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-1", deductible_cents: 25000, coinsurance_pct: 90, oop_max_cents: 100000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 200000, line_items: [ { cpt_code: "X1", charge_cents: 200000, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim_c: $.data.id }
            - call: "POST /sports-med/claims/${claim_c}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_c}/adjudicate"
              payload: { deny: true, denial_reason: "initial denial" }
              as: BillingStaff
              captures: { c_denied_status: $.data.status }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 100000, line_items: [ { cpt_code: "X2", charge_cents: 100000, service_date: "2026-08-03" } ] }
              as: BillingStaff
              captures: { claim_d: $.data.id }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_v1: $.data.version }
            - call: "POST /sports-med/claims/${claim_d}/submit"
              payload: { expected_policy_version: "${pol_v1}" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_d}/adjudicate"
              payload: {}
              as: BillingStaff
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 80000, line_items: [ { cpt_code: "X3", charge_cents: 80000, service_date: "2026-08-04" } ] }
              as: BillingStaff
              captures: { claim_e: $.data.id }
            - call: "GET /sports-med/insurance-policies/${pol_id}"
              payload: {}
              as: BillingStaff
              captures: { pol_v2: $.data.version }
            - call: "POST /sports-med/claims/${claim_e}/submit"
              payload: { expected_policy_version: "${pol_v2}" }
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_e}/adjudicate"
              payload: {}
              as: BillingStaff
            - call: "POST /sports-med/claims/${claim_c}/appeal"
              payload: { appeal_reason: "reconsider" }
              as: BillingStaff
          trigger:
            - call: "POST /sports-med/claims/${claim_c}/adjudicate"
              payload: {}
              as: BillingStaff
              captures: { c_patient: $.data.patient_resp_cents, c_payer: $.data.payer_paid_cents, c_ded: $.data.deductible_applied_cents, c_status: $.data.status }
          assert:
            - "Claim.${claim_d}.payer_paid_cents == 67500 and Claim.${claim_d}.patient_resp_cents == 32500"
            - "Claim.${claim_e}.payer_paid_cents == 72000 and Claim.${claim_e}.patient_resp_cents == 8000"
            - "Claim.${claim_c}.status == PAID"
            - "Claim.${claim_c}.deductible_applied_cents == 0"
            - "Claim.${claim_c}.patient_resp_cents == 20000"
            - "Claim.${claim_c}.payer_paid_cents == 180000"
            - "readjudication split (20000/180000) != initial-adjudication split that identical accumulators would have produced (42500/157500)"

  # =================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes a/b/c)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rtp_readiness_multi_input_gate
        grounds:
          - calculations.rtp_stage_readiness
          - state_machines.RTPProtocol.NOT_STARTED_to_IN_PROGRESS
          - entities.RTPProtocol.fields.current_stage_entered_on
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: days_in_stage vs a
          min-days floor that itself branches on severity_class_snapshot and
          is_concussion_snapshot, ANDed with symptom_free, functional_test_score
          >= 80, regression-window exclusion, and stage-observation recency; a
          SEVERE concussion case has composed min-days 2+2+1=5 (which dominates
          the hard floor 3), so an advance at day 4 fails the composed gate and
          yields ERR_READINESS_NOT_MET (not the floor error).
        test_recipe:
          setup:
            - "Team; athlete; DiagnosisCode SEVERE + is_concussion true"
            - "Case OPEN -> REHAB (with a status entry), ACTIVE treatment plan, RTP protocol with total_stages 4 created on 2026-08-10 (stage 0 entered 2026-08-10)"
            - "Latest is_current DailyStatusEntry on 2026-08-14 with symptom_free true, functional_test_score 90"
            - "Clock at 2026-08-14 (days_in_stage = 4): enough for non-concussion SEVERE (2+2=4) but below concussion hard floor composition max(5,3)=5"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "FOOTBALL", season_start_date: "2026-08-01", season_end_date: "2027-02-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "QB", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "S06.0X1A", body_region: "HEAD_NECK", severity_class: "SEVERE", is_concussion: true }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-05", surface: "GRASS", mechanism: "CONTACT" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-05", designation: "OUT", symptom_free: false, functional_test_score: 40 }
              as: MedicalStaff
            - call: "POST /sports-med/injury-cases/${case_id}/start-rehab"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/treatment-plans"
              payload: { injury_case_id: "${case_id}", title: "rehab", planned_sessions_per_week: 5, estimated_duration_weeks: 6 }
              as: MedicalStaff
              captures: { plan_id: $.data.id }
            - call: "POST /sports-med/treatment-plans/${plan_id}/activate"
              payload: {}
              as: MedicalStaff
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/rtp-protocols"
              payload: { injury_case_id: "${case_id}", total_stages: 4 }
              as: MedicalStaff
              captures: { proto_id: $.data.id, proto_v0: $.data.version }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/daily-status-entries"
              payload: { injury_case_id: "${case_id}", entry_date: "2026-08-14", designation: "LIMITED", symptom_free: true, functional_test_score: 90 }
              as: MedicalStaff
          trigger:
            - call: "POST /sports-med/rtp-protocols/${proto_id}/advances"
              payload: { expected_protocol_version: "${proto_v0}" }
              as: MedicalStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns error_id ERR_READINESS_NOT_MET (days_in_stage 4 passes the concussion hard floor 3 but fails the composed min-days 2+2+1=5 for a SEVERE concussion)"
            - "RTPProtocol.${proto_id}.current_stage_index == 0 (no mutation on gate failure)"
            - "RTPProtocol.${proto_id}.status == NOT_STARTED"

      - name: claim_rounding_order_per_claim_not_per_line
        grounds:
          - calculations.claim_adjudication
          - entities.Claim.fields.payer_paid_cents
          - entities.Claim.fields.patient_resp_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: coinsurance is rounded
          ONCE per claim (round_half_up on the aggregate after_deductible), never
          per line item; a 3-line claim whose per-line rounding would drift by
          cents must equal the per-claim figure exactly.
        test_recipe:
          setup:
            - "Team; athlete; OPEN case"
            - "Policy: deductible 0, coinsurance 67, oop_max 100000000; year 2026-01-01..2026-12-31"
            - "Claim with 3 line items 33333+33333+33334 = 100000 cents billed; service_date 2026-08-02"
            - "Per-claim: after_deductible 100000, patient coins = round_half_up(100000*33/100)=33000, payer 67000"
            - "Per-line (WRONG) order would give round(33333*.33)*2 + round(33334*.33) = 11000+11000+11000 = 33000 patient / payer 67000.01-rounded mismatch — the pinned order is what the assert locks"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "HOCKEY", season_start_date: "2026-08-01", season_end_date: "2027-04-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "D", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
              payload: { code: "M70.0", body_region: "HIP", severity_class: "MINOR", is_concussion: false }
              as: TeamAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /sports-med/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TeamAdmin
            - call: "POST /sports-med/injury-cases"
              payload: { athlete_id: "${a_id}", diagnosis_code_id: "${dc_id}", occurred_on: "2026-08-01", surface: "ICE", mechanism: "OVERUSE" }
              as: MedicalStaff
              captures: { case_id: $.data.id }
            - call: "POST /sports-med/insurance-policies"
              payload: { athlete_id: "${a_id}", payer_name: "Payer", policy_number: "PN-R", deductible_cents: 0, coinsurance_pct: 67, oop_max_cents: 100000000, policy_year_start: "2026-01-01", policy_year_end: "2026-12-31" }
              as: BillingStaff
              captures: { pol_id: $.data.id, pol_v0: $.data.version }
            - call: "POST /sports-med/claims"
              payload: { injury_case_id: "${case_id}", insurance_policy_id: "${pol_id}", billed_amount_cents: 100000, line_items: [ { cpt_code: "A", charge_cents: 33333, service_date: "2026-08-02" }, { cpt_code: "B", charge_cents: 33333, service_date: "2026-08-02" }, { cpt_code: "C", charge_cents: 33334, service_date: "2026-08-02" } ] }
              as: BillingStaff
              captures: { claim_id: $.data.id }
            - call: "POST /sports-med/claims/${claim_id}/submit"
              payload: { expected_policy_version: "${pol_v0}" }
              as: BillingStaff
          trigger:
            - call: "POST /sports-med/claims/${claim_id}/adjudicate"
              payload: {}
              as: BillingStaff
              captures: { cl_patient: $.data.patient_resp_cents, cl_payer: $.data.payer_paid_cents }
          assert:
            - "Claim.${claim_id}.patient_resp_cents == 33000  (round_half_up(100000*33/100) once per claim)"
            - "Claim.${claim_id}.payer_paid_cents == 67000"
            - "Claim.${claim_id}.payer_paid_cents + Claim.${claim_id}.patient_resp_cents == 100000 (conservation)"

  # =================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rtp_protocol_regression_cycle
        grounds:
          - state_machines.RTPProtocol.IN_PROGRESS_to_REGRESSED
          - state_machines.RTPProtocol.REGRESSED_to_IN_PROGRESS
          - state_machines.RTPProtocol.AWAITING_CLEARANCE_to_REGRESSED
        distinguishing_aspect: |
          RTPProtocol exhibits a cycle IN_PROGRESS -> REGRESSED -> IN_PROGRESS
          (and AWAITING_CLEARANCE -> REGRESSED): regression decrements
          current_stage_index, bumps regression_count, and the protocol can
          re-advance — a cyclic machine on RTPProtocol, distinct from the Claim
          appeal cycle.
        test_recipe:
          setup:
            - "Team; athlete; MINOR non-concussion case progressed to RTP; protocol total_stages 4"
            - "Protocol advanced to stage 1 (IN_PROGRESS) on 2026-08-08 with ready entry; second entry on 2026-08-10 ready for stage 2"
            - "Clock 2026-08-10"
          setup_api_calls:
            - call: "POST /sports-med/teams"
              payload: { name: "T", sport: "BASKETBALL", season_start_date: "2026-08-01", season_end_date: "2027-04-01" }
              as: TeamAdmin
              captures: { t_id: $.data.id }
            - call: "POST /sports-med/athletes"
              payload: { team_id: "${t_id}", full_name: "A", position: "G", enrollment_date: "2026-08-01" }
              as: TeamAdmin
              captures: { a_id: $.data.id }
            - call: "POST /sports-med/diagnosis-codes"
