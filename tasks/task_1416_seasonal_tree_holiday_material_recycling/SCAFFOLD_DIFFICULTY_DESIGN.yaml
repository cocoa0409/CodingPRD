  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: route_capacity_exact_fit
        grounds:
          - calculations.route_capacity_consumption
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
          - endpoints["POST /bookings"]
        distinguishing_aspect: |
          Count boundary on the route-capacity metric via POST /bookings: reserved 3
          + tree_count 2 == capacity 5 is ADMITTED (<=, not <); the next single tree
          (6 > 5) is rejected. Zero remaining capacity is reachable and queryable.
        test_recipe:
          setup:
            - "Program ACTIVE; zone NW-1 capacity 5; H1 booking of 3 trees CONFIRMED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
              as: ProgramAdmin
