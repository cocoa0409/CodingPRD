          - 'endpoints."GET /access/residents/{residentId}/statement"'
        distinguishing_aspect: "Immediate consistency: right after issuing a base-8000 violation, the resident statement reflects outstanding_balance_cents == 8000 in the same synchronous flow."
        test_recipe:
          setup: ["Community + resident (balance 0)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Imm Ida", email: "imm@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "NOISE", base_fine_cents: 8000 }
              as: SecurityOfficer
              as_user_id: "off-1"
          trigger:
            - call: "GET /access/residents/${res_id}/statement"
              payload: {}
