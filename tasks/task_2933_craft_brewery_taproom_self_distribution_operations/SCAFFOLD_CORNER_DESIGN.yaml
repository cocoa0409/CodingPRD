              payload: { beer_id: "${beer_id}", state_license_id: "${lic_id}", order_code: "SO-6301", bbl_requested: 5.00, ship_to_state_code: "ID", distance_miles: 100, requested_ship_utc: "2026-08-15T15:00:00Z" }
