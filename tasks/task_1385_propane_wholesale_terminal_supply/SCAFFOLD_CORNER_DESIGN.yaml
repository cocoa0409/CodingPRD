        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_SUPPLY]", "errors[ERR_CREDIT_LIMIT_EXCEEDED]", "errors[ERR_DEALER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: atp_exact_gallon_boundary
          rationale: "ERR_INSUFFICIENT_SUPPLY fires in atp_exact_gallon_boundary; ERR_CREDIT_LIMIT_EXCEEDED's losing side is asserted in state_beats_fiscal_on_order_create and its winning side in credit_gate_circular_eval_order; ERR_DEALER_SUSPENDED is the terminal assert of payment_return_reverses_invoices_to_suspension and contract_activate_requires_dealer_not_suspended."

