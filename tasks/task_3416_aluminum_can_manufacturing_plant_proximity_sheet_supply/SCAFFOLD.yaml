# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3416_aluminum_can_manufacturing_plant_proximity_sheet_supply
# =============================================================================

scenario: |
  Aluminum Can Manufacturing, Plant Proximity & Sheet Supply (Ball Corporation):
  can plant siting near filling customers to minimize freight of empty containers
  with long-term supply agreements, aluminum sheet procurement with metal price
  pass-through and conversion cost pricing structures, line speed and spoilage
  management across bodymaker, decorator and necking operations, specialty can
  sizes and shapes requiring tooling investment and minimum volume commitments,
  decoration changeover scheduling for seasonal graphics and craft customer
  variety, recycled content targets with scrap collection and closed-loop
  programs, customer forecast accuracy affecting line scheduling and warehouse
  space for a bulky product, quality specifications on seam integrity and
  coating with customer filling line performance

domain_name: aluminum-can-manufacturing
api_prefix: ""

# =============================================================================
# Complexity Profile (SKILL §0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: hybrid          # plants -> lines/formats tree; agreements/forecasts/scrap/runs flat with cross-cutting FKs
  state_machine_shape: branching   # agreement renegotiation cycle + run hold cycle + incident fork-join
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: region, type: string, source: input, description: "Plant region code, e.g. US-SW; plant siting near filling customers minimizes empty-can freight" }
      - { name: warehouse_capacity_units, type: integer, source: input, description: "Total warehouse capacity in cans (bulky empty containers); must be > 0" }
      - { name: warehouse_on_hand_units, type: integer, source: computed, default: 0, description: "Cans physically in warehouse; += produced_qty on run completion, -= produced_qty on run void" }
      - { name: projected_warehouse_units, type: integer, source: computed, default: 0, description: "= warehouse_on_hand_units + sum(scheduled_qty of this plant's runs in {SCHEDULED, IN_PROGRESS, HELD})" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONGESTED | LOCKDOWN — derived from projected free units (see calculations.plant_posture)" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by POST /plants/{id}/run-ops" }
      - { name: scrap_credit_lbs_ytd, type: number, source: computed, default: 0, description: "Sum of credited_weight_lbs of CREDITED ScrapReturns at this plant credited in the current calendar year of the logical clock" }
      - { name: metal_consumed_lbs_ytd, type: number, source: computed, default: 0, description: "Sum of sheet_lbs_consumed of runs completed at this plant in the current calendar year of the logical clock" }
      - { name: recycled_content_pct, type: number, source: computed, default: 0, description: "= 100 * scrap_credit_lbs_ytd / metal_consumed_lbs_ytd; 0 when denominator is 0" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Filling customer name (beverage filler)" }
      - { name: home_region, type: string, source: input, description: "Customer home region code; compared to Plant.region at agreement creation to derive freight_zone" }
      - { name: filling_lines_count, type: integer, source: input, description: "Number of customer filling lines; context for filling-line performance quality specs; must be >= 1" }

  - name: SupplyAgreement
    parent: null
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; supplying plant" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; filling customer" }
      - { name: freight_zone, type: enum, source: computed, description: "NEAR | MID | FAR — NEAR when Plant.region == Customer.home_region, MID when region codes share first two chars, else FAR; computed once at creation" }
      - { name: committed_annual_units, type: integer, source: input, description: "Minimum volume commitment per contract year, in cans; must be >= 1000000" }
      - { name: pass_through_pct, type: number, source: input, description: "Fraction of aluminum index movement passed through to customer (0 < x <= 1)" }
      - { name: conversion_cost_cents_per_1000, type: number, source: input, description: "Conversion cost component in cents per 1000 cans (bodymaker/decorator/necker conversion); must be > 0" }
      - { name: start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive agreement start" }
      - { name: end_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive agreement end; must be > start_date" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RENEGOTIATING | EXPIRED | TERMINATED" }
      - { name: ytd_settled_units, type: integer, source: computed, default: 0, description: "Sum of produced_qty of this agreement's SETTLED runs (current agreement year); debited on settle, reversed on void" }
      - { name: delivered_revenue_cents, type: number, source: computed, default: 0, description: "Sum of settled_amount_cents of this agreement's SETTLED runs; reversed on void" }
      - { name: volume_tier, type: enum, source: computed, default: "STANDARD", description: "STANDARD | REBATE — REBATE when ytd_settled_units >= committed_annual_units" }
      - { name: rolling_accuracy_pct, type: number, source: computed, default: 100, description: "Mean of accuracy_pct over the FORECAST_ROLLING_WINDOW most recent CLOSED forecasts (by period desc); 100 when none closed" }
      - { name: lifetime_accuracy_pct, type: number, source: computed, default: 100, description: "Ratio-of-aggregates accuracy over ALL CLOSED forecasts (see calculations.forecast_accuracy); 100 when none closed" }

  - name: MetalPriceIndex
    parent: null
    common_fields: false
    fields:
      - { name: period, type: string, source: input, description: "Index month, YYYY-MM; unique — second create for same period is rejected" }
      - { name: index_cents_per_lb, type: number, source: input, description: "Published aluminum index, cents per lb; must be > 0" }

  - name: ProductionLine
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant from path" }
      - { name: name, type: string, source: input, description: "Line name (bodymaker/decorator/necker train)" }
      - { name: nominal_speed_cans_per_hour, type: integer, source: input, description: "Rated line speed; must be > 0" }
      - { name: base_spoilage_pct, type: number, source: input, description: "Baseline spoilage fraction across bodymaker, decorator and necking operations (0 <= x < 1)" }
      - { name: operational_status, type: enum, source: computed, default: "RUNNING", description: "RUNNING | QUALITY_HOLD — QUALITY_HOLD while any incident on a run of this line is ESCALATED" }

  - name: CanFormat
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; parent plant from path" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; specialty formats are customer-specific (craft customer variety)" }
      - { name: size_code, type: string, source: input, description: "Can size code, e.g. 12OZ, 16OZ, 8OZ-SLEEK" }
      - { name: shape, type: enum, source: input, description: "STANDARD | SLEEK | SLIM | STUBBY" }
      - { name: is_specialty, type: boolean, source: input, description: "Specialty size/shape requiring tooling investment and minimum volume commitment" }
      - { name: metal_lbs_per_1000_units, type: number, source: input, description: "Aluminum sheet pounds consumed per 1000 cans of this format; must be > 0" }
      - { name: tooling_investment_cents, type: integer, source: input, description: "Tooling investment for this format; 0 for STANDARD shape non-specialty, > 0 required when is_specialty" }
      - { name: min_volume_commitment_units, type: integer, source: input, description: "Minimum volume commitment amortizing the tooling; 0 when is_specialty false, > 0 required when is_specialty" }
      - { name: status, type: enum, source: system, description: "PROPOSED | TOOLED | QUALIFIED | RETIRED" }
      - { name: delivered_units, type: integer, source: computed, default: 0, description: "Sum of produced_qty of SETTLED runs of this format; reversed on void" }
      - { name: unamortized_exposure_cents, type: integer, source: computed, default: 0, description: "= round(tooling_investment_cents * max(0, 1 - delivered_units / min_volume_commitment_units)) when min_volume_commitment_units > 0 else 0" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> SupplyAgreement.id; from path" }
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; scheduled line" }
      - { name: format_id, type: string, source: input, description: "FK -> CanFormat.id; can format produced" }
      - { name: scheduled_qty, type: integer, source: input, description: "Planned cans; must be >= MIN_RUN_QTY (5000)" }
      - { name: graphics_code, type: string, source: input, description: "Decoration/graphics identifier; a different graphics_code than the previous run on the same line triggers the changeover buffer (seasonal graphics, craft variety)" }
      - { name: window_start, type: string, source: input, description: "ISO8601 UTC scheduled start (half-open interval start)" }
      - { name: window_end, type: string, source: input, description: "ISO8601 UTC scheduled end (half-open interval end); must be > window_start; its YYYY-MM is the delivery period for pricing" }
      - { name: produced_qty, type: integer, source: system, description: "Good cans produced; set at completion" }
      - { name: spoiled_qty, type: integer, source: system, description: "Spoiled cans (bodymaker/decorator/necker spoilage); set at completion" }
      - { name: sheet_lbs_consumed, type: number, source: computed, description: "= (produced_qty + spoiled_qty) / 1000 * format.metal_lbs_per_1000_units at completion" }
      - { name: effective_spoilage_pct, type: number, source: computed, description: "= spoiled_qty / (produced_qty + spoiled_qty); 0 when both are 0; evaluated against expected spoilage at completion" }
      - { name: spoilage_flag, type: boolean, source: computed, default: false, description: "true when effective_spoilage_pct > expected spoilage (calculations.expected_spoilage_pct) at completion" }
      - { name: provisional_unit_price_cents_per_1000, type: number, source: computed, description: "Unit price computed at completion using the PROVISIONAL index variant (prior-month index)" }
      - { name: final_unit_price_cents_per_1000, type: number, source: computed, description: "Unit price computed at settlement using the FINAL index variant (delivery-month index); null until settled" }
      - { name: settled_amount_cents, type: number, source: computed, description: "Final invoice amount for this run, rounded per run (see calculations.run_invoice_amount); null until settled" }
      - { name: tier_delta_cents, type: number, source: computed, default: 0, description: "Retroactive tier true-up applied to this SETTLED run when the agreement volume_tier flips (see calculations.tier_true_up)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | HELD | COMPLETED | SETTLED | CANCELLED | VOIDED" }

  - name: CustomerForecast
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> SupplyAgreement.id; from path" }
      - { name: period, type: string, source: input, description: "Forecast month, YYYY-MM; unique per agreement" }
      - { name: forecast_qty, type: integer, source: input, description: "Customer forecast volume for the period; must be >= 0" }
      - { name: actual_qty, type: integer, source: system, description: "Actual volume recorded at close" }
      - { name: accuracy_pct, type: number, source: computed, description: "= 100 * (1 - |forecast_qty - actual_qty| / max(forecast_qty, actual_qty)); defined 100 when both are 0; set at close" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: ScrapReturn
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; from path (closed-loop program partner)" }
      - { name: plant_id, type: string, source: input, description: "FK -> Plant.id; plant receiving the returned scrap" }
      - { name: pickup_window_start, type: string, source: input, description: "ISO8601 UTC pickup window start (CLOSED interval semantics — touching windows conflict)" }
      - { name: pickup_window_end, type: string, source: input, description: "ISO8601 UTC pickup window end; must be > pickup_window_start" }
      - { name: declared_weight_lbs, type: number, source: input, description: "Declared scrap weight; must be > 0" }
      - { name: credited_weight_lbs, type: number, source: system, description: "Verified weight credited at credit time" }
      - { name: grade, type: enum, source: system, description: "UBC | PROCESS | MIXED — scrap grade recorded at credit time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CREDITED | EXPIRED" }

  - name: QualityIncident
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> ProductionRun.id; from path — the run whose seam integrity / coating is questioned" }
      - { name: line_id, type: string, source: system, description: "FK -> ProductionLine.id; copied from the run at creation for line-level queries" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: defect_class, type: enum, source: input, description: "SEAM_INTEGRITY | COATING | FILLING_LINE_PERFORMANCE" }
      - { name: note, type: string, source: input, description: "Free-text incident note" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SupplyAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /supply-agreements/{id}/sign"
        actor: CustomerPlanner
        preconditions:
          - "acting CustomerPlanner's X-User-ID == agreement.customer_id (ERR_UNAUTHORIZED)"
          - "logical clock date <= agreement.end_date (ERR_AGREEMENT_WINDOW_PASSED)"
        side_effects:
          - "increments SupplyAgreement.version by 1"
      - from: ACTIVE
        to: RENEGOTIATING
        trigger: "POST /supply-agreements/{id}/open-renegotiation"
        actor: CustomerPlanner
        preconditions:
          - "acting CustomerPlanner's X-User-ID == agreement.customer_id (ERR_UNAUTHORIZED)"
        side_effects:
          - "increments SupplyAgreement.version by 1"
      - from: RENEGOTIATING
        to: ACTIVE
        trigger: "POST /supply-agreements/{id}/amend"
        actor: PlantManager
        preconditions:
          - "expected_agreement_version == current SupplyAgreement.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "applies amended committed_annual_units / pass_through_pct / conversion_cost_cents_per_1000 / end_date"
          - "recomputes volume_tier against the amended committed_annual_units using current ytd_settled_units"
          - "increments SupplyAgreement.version by 1"
        note: "cyclic — an agreement may loop ACTIVE -> RENEGOTIATING -> ACTIVE any number of times"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /supply-agreements/{id}/terminate"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "computes early-termination exposure (calculations.early_termination_exposure) and returns it in the response"
          - "increments SupplyAgreement.version by 1"
      - from: RENEGOTIATING
        to: TERMINATED
        trigger: "POST /supply-agreements/{id}/terminate"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "computes early-termination exposure (calculations.early_termination_exposure) and returns it in the response"
          - "increments SupplyAgreement.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /plants/{id}/run-ops, when logical clock date > agreement.end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SupplyAgreement.version by 1"
      - from: RENEGOTIATING
        to: EXPIRED
        trigger: "system (POST /plants/{id}/run-ops, when logical clock date > agreement.end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SupplyAgreement.version by 1"

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /production-runs/{id}/start"
        actor: LineScheduler
        preconditions:
          - "line.operational_status == RUNNING (ERR_LINE_QUALITY_HOLD)"
        side_effects:
          - "increments ProductionRun.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /production-runs/{id}/complete"
        actor: LineScheduler
        preconditions: []
        side_effects:
          - "sets produced_qty, spoiled_qty, sheet_lbs_consumed, effective_spoilage_pct, spoilage_flag"
          - "computes provisional_unit_price_cents_per_1000 (PROVISIONAL variant of calculations.can_unit_price)"
          - "Plant.warehouse_on_hand_units += produced_qty (link 1 of cascade)"
          - "Plant.metal_consumed_lbs_ytd += sheet_lbs_consumed when completion year == clock year"
          - "Plant posture + projected_warehouse_units recomputed (link 2 of cascade — driven by the on-hand mutation)"
          - "increments ProductionRun.version by 1"
      - from: COMPLETED
        to: SETTLED
        trigger: "POST /production-runs/{id}/settle"
        actor: PlantManager
        preconditions:
          - "a MetalPriceIndex with period == YYYY-MM of run.window_end exists (ERR_INDEX_NOT_PUBLISHED)"
        side_effects:
          - "computes final_unit_price_cents_per_1000 (FINAL variant) and settled_amount_cents (per-run rounding)"
          - "SupplyAgreement.ytd_settled_units += produced_qty and delivered_revenue_cents += settled_amount_cents (cascade link: Run -> Agreement)"
          - "CanFormat.delivered_units += produced_qty; unamortized_exposure_cents recomputed (cascade link: Run -> Format)"
          - "SupplyAgreement.volume_tier re-evaluated; on STANDARD->REBATE flip, every OTHER SETTLED run of this agreement receives tier_delta_cents true-up (calculations.tier_true_up — cascade link: Agreement tier -> sibling Runs)"
          - "increments ProductionRun.version by 1 AND increments SupplyAgreement.version by 1"
      - from: IN_PROGRESS
        to: HELD
        trigger: "system (POST /quality-incidents/{id}/escalate on an incident of this run)"
        actor: system
        preconditions: []
        side_effects:
          - "ProductionLine.operational_status -> QUALITY_HOLD (cascade link: Run -> Line)"
          - "increments ProductionRun.version by 1"
      - from: HELD
        to: IN_PROGRESS
        trigger: "system (POST /quality-incidents/{id}/resolve when no other ESCALATED incident remains on this run's line)"
        actor: system
        preconditions: []
        side_effects:
          - "ProductionLine.operational_status -> RUNNING when no ESCALATED incident remains on any run of the line (cascade link: Run -> Line)"
          - "increments ProductionRun.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel"
        actor: LineScheduler
        preconditions: []
        side_effects:
          - "Plant projected_warehouse_units recomputed (scheduled_qty leaves the projection set)"
          - "increments ProductionRun.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /production-runs/{id}/cancel"
        actor: LineScheduler
        preconditions: []
        side_effects:
          - "Plant projected_warehouse_units recomputed"
          - "ProductionLine.operational_status re-evaluated (cancelling a HELD run does NOT clear QUALITY_HOLD while an ESCALATED incident remains on another run of the line)"
          - "increments ProductionRun.version by 1"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /production-runs/{id}/void"
        actor: LineScheduler
        preconditions: []
        side_effects:
          - "Plant.warehouse_on_hand_units -= produced_qty (compensating reversal — conserves warehouse units)"
          - "Plant.metal_consumed_lbs_ytd -= sheet_lbs_consumed when completion year == clock year"
          - "Plant posture + projected_warehouse_units recomputed"
          - "increments ProductionRun.version by 1"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /production-runs/{id}/void"
        actor: LineScheduler
        preconditions: []
        side_effects:
          - "Plant.warehouse_on_hand_units -= produced_qty (compensating reversal)"
          - "SupplyAgreement.ytd_settled_units -= produced_qty; delivered_revenue_cents -= (settled_amount_cents + tier_delta_cents) (compensating reversal — conserves the agreement ledger)"
          - "CanFormat.delivered_units -= produced_qty; unamortized_exposure_cents recomputed"
          - "SupplyAgreement.volume_tier re-evaluated; on REBATE->STANDARD flip, every OTHER SETTLED run of this agreement has tier_delta_cents reset to 0 (cascade link: Agreement tier -> sibling Runs)"
          - "increments ProductionRun.version by 1 AND increments SupplyAgreement.version by 1"

  - entity: QualityIncident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /quality-incidents/{id}/escalate"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "linked run IN_PROGRESS -> HELD (cascade link: Incident -> Run; no-op if run not IN_PROGRESS)"
          - "increments QualityIncident.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /quality-incidents/{id}/resolve"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "no hold side effects — direct resolution leaves the run untouched (divergent branch of the fork)"
          - "increments QualityIncident.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /quality-incidents/{id}/resolve"
        actor: QualityEngineer
        preconditions: []
        side_effects:
          - "run HELD -> IN_PROGRESS when no other ESCALATED incident remains on this run's line (cascade link: Incident -> Run -> Line)"
          - "increments QualityIncident.version by 1"

  - entity: CanFormat
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: TOOLED
        trigger: "POST /formats/{id}/tool"
        actor: PlantManager
        preconditions:
          - "when is_specialty: tooling_investment_cents > 0 and min_volume_commitment_units > 0 (ERR_TOOLING_TERMS_REQUIRED)"
        side_effects:
          - "increments CanFormat.version by 1"
      - from: TOOLED
        to: QUALIFIED
        trigger: "POST /formats/{id}/qualify"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "increments CanFormat.version by 1"
      - from: QUALIFIED
        to: RETIRED
        trigger: "POST /formats/{id}/retire"
        actor: PlantManager
        preconditions:
          - "no ProductionRun of this format in {SCHEDULED, IN_PROGRESS, HELD} (ERR_FORMAT_HAS_OPEN_RUNS)"
        side_effects:
          - "increments CanFormat.version by 1"
      - from: TOOLED
        to: RETIRED
        trigger: "POST /formats/{id}/retire"
        actor: PlantManager
        preconditions:
          - "no ProductionRun of this format in {SCHEDULED, IN_PROGRESS, HELD} (ERR_FORMAT_HAS_OPEN_RUNS)"
        side_effects:
          - "increments CanFormat.version by 1"

  - entity: ScrapReturn
    initial_state: SCHEDULED
    terminal_states: [CREDITED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: CREDITED
        trigger: "POST /scrap-returns/{id}/credit"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "sets credited_weight_lbs and grade"
          - "Plant.scrap_credit_lbs_ytd += credited_weight_lbs when credit year == clock year"
          - "Plant.recycled_content_pct recomputed"
          - "increments ScrapReturn.version by 1"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (POST /plants/{id}/run-ops, when logical clock > pickup_window_end and still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ScrapReturn.version by 1"

  - entity: CustomerForecast
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /forecasts/{id}/close"
        actor: CustomerPlanner
        preconditions:
          - "acting CustomerPlanner's X-User-ID == agreement.customer_id of this forecast (ERR_UNAUTHORIZED)"
        side_effects:
          - "sets actual_qty and computes accuracy_pct (calculations.forecast_accuracy, zero-zero boundary defined 100)"
          - "SupplyAgreement.rolling_accuracy_pct and lifetime_accuracy_pct recomputed (cascade link: Forecast -> Agreement)"
          - "increments CustomerForecast.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: agreement-amend-stale-version
    parent_entity: SupplyAgreement
    write_endpoint: "POST /supply-agreements/{id}/amend"
    occ_field: expected_agreement_version
    description: |
      Amending a SupplyAgreement whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just amended the terms (each amendment legitimately supersedes the
      prior terms under the renegotiation cycle) and the current writer's view
      of the agreement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-create-stale-agreement
    parent_entity: SupplyAgreement
    write_endpoint: "POST /supply-agreements/{id}/production-runs"
    occ_field: expected_agreement_version
    description: |
      Creating a ProductionRun against a SupplyAgreement whose version has
      advanced since the client last observed it is rejected, because the new
      run must be priced under the terms the client actually observed. The
      check is a stale-version rejection, deterministic under strictly
      sequential requests.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Global Constants (every CONST referenced anywhere below is defined here)
# =============================================================================
constants:
  DEFAULT_CLOCK_UTC: "2026-09-01T00:00:00Z"
  VOLUME_REBATE_PCT: 0.04
  SPECIALTY_SURCHARGE_PCT: 0.12
  SHORTFALL_FEE_CENTS_PER_1000: 400
  MAX_SPOILAGE_PCT: 0.15
  SPECIALTY_SPOILAGE_PREMIUM_PCT: 0.03
  CHANGEOVER_SPOILAGE_PENALTY_PCT: 0.02
  CHANGEOVER_BUFFER_MINUTES: 240
  MAX_PICKUPS_PER_DAY: 2
  FORECAST_ROLLING_WINDOW: 3
  CONGESTED_FREE_FRACTION: 0.20
  MIN_RUN_QTY: 5000
  MIN_COMMITTED_ANNUAL_UNITS: 1000000
  PROVISIONAL_INDEX_LAG_MONTHS: 1

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: can_unit_price
    trigger: "ProductionRun completion (PROVISIONAL variant) and ProductionRun settlement (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      tier_factor = (1 - CONST.VOLUME_REBATE_PCT) if agreement.ytd_settled_units >= agreement.committed_annual_units
                    (evaluated BEFORE the current run's units are added) else 1.0
      specialty_factor = (1 + CONST.SPECIALTY_SURCHARGE_PCT) if format.is_specialty else 1.0
      conversion_effective = agreement.conversion_cost_cents_per_1000 * tier_factor * specialty_factor
      unit_price_cents_per_1000 = round_half_up(
          format.metal_lbs_per_1000_units * index_cents_per_lb * agreement.pass_through_pct
          + conversion_effective, 2 )
    input_set: "the run's agreement (pricing terms), the run's format (metal intensity, specialty flag), and one MetalPriceIndex row selected by the active variant"
    constants:
      VOLUME_REBATE_PCT: 0.04
      SPECIALTY_SURCHARGE_PCT: 0.12
      PROVISIONAL_INDEX_LAG_MONTHS: 1
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "at POST /production-runs/{id}/complete"
        difference: "index row = the published MetalPriceIndex whose period is exactly CONST.PROVISIONAL_INDEX_LAG_MONTHS (1) month BEFORE the delivery month (YYYY-MM of run.window_end); missing index rejects completion with ERR_INDEX_NOT_PUBLISHED"
      - name: FINAL
        when: "at POST /production-runs/{id}/settle"
        difference: "index row = the published MetalPriceIndex whose period EQUALS the delivery month (YYYY-MM of run.window_end); missing index rejects settlement with ERR_INDEX_NOT_PUBLISHED; identical inputs therefore price differently whenever the two index rows differ"

  - name: run_invoice_amount
    trigger: "ProductionRun settlement, and agreement ledger reads"
    algorithm: aggregation
    formula: |
      settled_amount_cents(run) = round_half_up( final_unit_price_cents_per_1000 * produced_qty / 1000, 2 )
      agreement.delivered_revenue_cents = SUM over this agreement's SETTLED runs of
          ( settled_amount_cents + tier_delta_cents )
      PINNED ROUNDING ORDER: each run's settled_amount_cents is rounded to 2 decimals FIRST
      (round-per-line-item), and only then summed. The alternative order
      (sum unrounded amounts, round the total) is FORBIDDEN and yields different cents.
    input_set: "all ProductionRun rows of the agreement with status SETTLED (VOIDED excluded after reversal)"
    constants: {}
    precision: "2 decimal places, round_half_up, per run before summation"

  - name: expected_spoilage_pct
    trigger: "ProductionRun completion — compared against run.effective_spoilage_pct to set spoilage_flag"
    algorithm: threshold
    formula: |
      prev = the non-terminal run (status IN {SCHEDULED, IN_PROGRESS, HELD, COMPLETED, SETTLED})
             on the same line with the latest window_end <= this run's window_start;
             tie-break: created_at ASC, take the first
      changeover = true when prev exists AND prev.graphics_code != this run's graphics_code
      expected = min( CONST.MAX_SPOILAGE_PCT,
                      line.base_spoilage_pct
                      + (CONST.SPECIALTY_SPOILAGE_PREMIUM_PCT if format.is_specialty else 0)
                      + (CONST.CHANGEOVER_SPOILAGE_PENALTY_PCT if changeover else 0) )
      run.spoilage_flag = ( run.effective_spoilage_pct > expected )   # strict >
    input_set: "the run, its line, its format, and prior runs on the same line"
    constants:
      MAX_SPOILAGE_PCT: 0.15
      SPECIALTY_SPOILAGE_PREMIUM_PCT: 0.03
      CHANGEOVER_SPOILAGE_PENALTY_PCT: 0.02
    precision: "4 decimal places for the comparison, round_half_up"

  - name: forecast_accuracy
    trigger: "POST /forecasts/{id}/close (per-forecast), then recomputed on the parent SupplyAgreement"
    algorithm: aggregation
    formula: |
      accuracy_pct(f) = 100 when f.forecast_qty == 0 AND f.actual_qty == 0   # pinned zero-zero boundary
                      = round_half_up( 100 * (1 - |forecast_qty - actual_qty| / max(forecast_qty, actual_qty)), 2 )
      agreement.rolling_accuracy_pct = round_half_up( MEAN of accuracy_pct over the up-to-
          CONST.FORECAST_ROLLING_WINDOW most recent CLOSED forecasts (order period DESC,
          tie created_at DESC), 2 ); 100 when none closed
      agreement.lifetime_accuracy_pct = round_half_up(
          100 * (1 - |SUM(forecast_qty) - SUM(actual_qty)| / max(SUM(forecast_qty), SUM(actual_qty))), 2 )
          over ALL CLOSED forecasts; 100 when none closed
      The two agreement variants are computed from the same closed set and deliberately
      disagree whenever per-period errors cancel: mean-of-ratios != ratio-of-aggregates.
    input_set: "CLOSED CustomerForecast rows of the agreement (OPEN excluded)"
    constants:
      FORECAST_ROLLING_WINDOW: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: rolling_mean
        when: "stored on agreement.rolling_accuracy_pct; drives line-scheduling confidence"
        difference: "mean of the last-3 per-period accuracy ratios (mean-of-ratios)"
      - name: lifetime_ratio
        when: "stored on agreement.lifetime_accuracy_pct; drives contract-tier confidence"
        difference: "1 - |sum error| / max(sum) over the full history (ratio-of-aggregates)"

  - name: warehouse_projection
    trigger: "ProductionRun create/cancel/complete/void, and Plant posture derivation"
    algorithm: forward_looking
    formula: |
      projected_warehouse_units = plant.warehouse_on_hand_units
          + SUM( scheduled_qty ) over runs whose line.plant_id == plant.id
            AND status IN {SCHEDULED, IN_PROGRESS, HELD}        # CANCELLED/VOIDED/COMPLETED/SETTLED excluded
      free_units = warehouse_capacity_units - projected_warehouse_units
      CREATE GATE: a new run with scheduled_qty q is allowed only when
          projected_warehouse_units + q <= warehouse_capacity_units     # equality ALLOWED; strict > rejects
    input_set: "runs of the plant in {SCHEDULED, IN_PROGRESS, HELD} plus current on-hand"
    constants: {}
    precision: "integer units, exact"

  - name: plant_posture
    trigger: "any change to projected_warehouse_units"
    algorithm: threshold
    formula: |
      free_units = warehouse_capacity_units - projected_warehouse_units
      posture = LOCKDOWN  when free_units <= 0
              = CONGESTED when free_units <= floor(warehouse_capacity_units * CONST.CONGESTED_FREE_FRACTION)
              = OPEN      otherwise
      LOCKDOWN blocks new run creation with ERR_PLANT_LOCKDOWN; CONGESTED is reported only.
    input_set: "the plant row"
    constants:
      CONGESTED_FREE_FRACTION: 0.20
    precision: "integer floor for the CONGESTED threshold"

  - name: early_termination_exposure
    trigger: "POST /supply-agreements/{id}/terminate"
    algorithm: waterfall_allocation
    formula: |
      shortfall_units = max(0, committed_annual_units - ytd_settled_units)
      shortfall_fee_cents = round_half_up( shortfall_units / 1000 * CONST.SHORTFALL_FEE_CENTS_PER_1000, 0 )
      FOR EACH CanFormat F with F.customer_id == agreement.customer_id
        AND F.plant_id == agreement.plant_id AND F.status IN {TOOLED, QUALIFIED}:
          unamortized(F) = round_half_up( F.tooling_investment_cents
              * max(0, 1 - F.delivered_units / F.min_volume_commitment_units), 0 )
          when F.min_volume_commitment_units > 0 else 0
      unamortized_tooling_cents = SUM of per-format unamortized(F)   # per-format rounding pinned, then sum
      total_exposure_cents = shortfall_fee_cents + unamortized_tooling_cents
    input_set: "the agreement and the customer's non-retired tooled formats at this plant"
    constants:
      SHORTFALL_FEE_CENTS_PER_1000: 400
    precision: "0 decimal places, round_half_up, per component before summation"

  - name: tier_true_up
    trigger: "SupplyAgreement.volume_tier flip (STANDARD->REBATE at settle; REBATE->STANDARD at void)"
    algorithm: constraint_propagation
    formula: |
      ON STANDARD->REBATE flip (after the triggering run's units are added):
        FOR each OTHER SETTLED run S of the agreement (status SETTLED, id != trigger run):
          conv_eff(S) = agreement.conversion_cost_cents_per_1000
                        * (1 + CONST.SPECIALTY_SURCHARGE_PCT if S.format.is_specialty else 1)
          S.tier_delta_cents = - round_half_up( conv_eff(S) * CONST.VOLUME_REBATE_PCT * S.produced_qty / 1000, 2 )
        agreement.delivered_revenue_cents += SUM(tier_delta_cents)   # negative: credit to customer
      ON REBATE->STANDARD flip (after the voided run's units are removed):
        agreement.delivered_revenue_cents -= SUM(existing tier_delta_cents of remaining SETTLED runs)
        every remaining SETTLED run's tier_delta_cents resets to 0
      EVALUATION ORDER PINNED: the triggering run's own price uses the tier in force BEFORE
      its units are added (see can_unit_price), so the run that crosses the commitment is
      priced at STANDARD tier and is itself excluded from the true-up.
    input_set: "SETTLED runs of the agreement, excluding VOIDED"
    constants:
      VOLUME_REBATE_PCT: 0.04
      SPECIALTY_SURCHARGE_PCT: 0.12
    precision: "2 decimal places, round_half_up, per run"

  - name: recycled_content_pct
    trigger: "ScrapReturn credit, run completion/void (year-matched)"
    algorithm: aggregation
    formula: |
      plant.recycled_content_pct = 0 when metal_consumed_lbs_ytd == 0
        else round_half_up( 100 * scrap_credit_lbs_ytd / metal_consumed_lbs_ytd, 2 )
      Year matching: a scrap credit or run completion contributes only when its
      calendar year equals the logical clock's current calendar year at mutation time.
    input_set: "CREDITED ScrapReturns and COMPLETED/SETTLED runs of the plant, current clock year"
    constants: {}
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.7; entity-backed ownership: CustomerPlanner's X-User-ID must equal the customer_id of the target SupplyAgreement (sign, open-renegotiation, forecasts create), of the forecast's agreement (close), or the path Customer (scrap-returns create)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "request body shape: required fields present; types valid; enum membership; ranges (scheduled_qty >= CONST.MIN_RUN_QTY, committed_annual_units >= CONST.MIN_COMMITTED_ANNUAL_UNITS, quantities > 0 where declared); ISO formats; window_end > window_start; pickup_window_end > pickup_window_start; end_date > start_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 4
    category: existence
    check: "path resources exist, validated left-to-right (ERR_NOT_FOUND); then body foreign keys in the endpoint's declared input order (plant_id -> ERR_PLANT_NOT_FOUND, customer_id -> ERR_CUSTOMER_NOT_FOUND, line_id -> ERR_LINE_NOT_FOUND, format_id -> ERR_FORMAT_NOT_FOUND)"
    error_id: "ERR_NOT_FOUND / ERR_PLANT_NOT_FOUND / ERR_CUSTOMER_NOT_FOUND / ERR_LINE_NOT_FOUND / ERR_FORMAT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"

  - priority: 5
    category: state
    check: "OCC: expected_agreement_version == current SupplyAgreement.version on amend and on production-run create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /supply-agreements/{id}/amend, POST /supply-agreements/{id}/production-runs"

  - priority: 6
    category: state
    check: "target entity from-state for the transition (ERR_INVALID_STATE); sign requires clock date <= end_date (ERR_AGREEMENT_WINDOW_PASSED); run create and start require agreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE); run create requires format.status == QUALIFIED (ERR_FORMAT_NOT_QUALIFIED) — checked in this order: target state, then path-parent cross-entity state, then body-FK cross-entity state"
    error_id: "ERR_INVALID_STATE / ERR_AGREEMENT_WINDOW_PASSED / ERR_AGREEMENT_NOT_ACTIVE / ERR_FORMAT_NOT_QUALIFIED"
    http_status: 409
    applies_to: "all state-transition endpoints and run create"

  - priority: 7
    category: business_safety
    check: "line.operational_status == QUALITY_HOLD blocks run create and start (ERR_LINE_QUALITY_HOLD); plant posture == LOCKDOWN blocks run create (ERR_PLANT_LOCKDOWN); quality-hold check precedes lockdown check"
    error_id: "ERR_LINE_QUALITY_HOLD / ERR_PLANT_LOCKDOWN"
    http_status: 409
    applies_to: "POST /supply-agreements/{id}/production-runs, POST /production-runs/{id}/start"

  - priority: 8
    category: business_temporal
    check: "run window half-open overlap on the line among {SCHEDULED, IN_PROGRESS, HELD} (ERR_LINE_WINDOW_OVERLAP); graphics changeover buffer CONST.CHANGEOVER_BUFFER_MINUTES from the previous run's window_end when graphics_code differs (ERR_CHANGEOVER_BUFFER_VIOLATION); scrap pickup closed-interval overlap among SCHEDULED returns of the customer (ERR_PICKUP_WINDOW_CONFLICT); more than CONST.MAX_PICKUPS_PER_DAY pickups on one UTC day per customer (ERR_PICKUP_DAILY_LIMIT); overlap checked before buffer, pickup conflict before daily limit"
    error_id: "ERR_LINE_WINDOW_OVERLAP / ERR_CHANGEOVER_BUFFER_VIOLATION / ERR_PICKUP_WINDOW_CONFLICT / ERR_PICKUP_DAILY_LIMIT"
    http_status: 409
    applies_to: "POST /supply-agreements/{id}/production-runs, POST /customers/{id}/scrap-returns"

  - priority: 9
    category: business_constraint
    check: "warehouse projection capacity (ERR_WAREHOUSE_CAPACITY_EXCEEDED); format retire with open runs (ERR_FORMAT_HAS_OPEN_RUNS); required MetalPriceIndex missing at complete (prior-month) or settle (delivery-month) (ERR_INDEX_NOT_PUBLISHED); tooling terms on tool transition when is_specialty (ERR_TOOLING_TERMS_REQUIRED); duplicate period — forecast per agreement, index globally (ERR_DUPLICATE_PERIOD)"
    error_id: "ERR_WAREHOUSE_CAPACITY_EXCEEDED / ERR_FORMAT_HAS_OPEN_RUNS / ERR_INDEX_NOT_PUBLISHED / ERR_TOOLING_TERMS_REQUIRED / ERR_DUPLICATE_PERIOD"
    http_status: 409
    applies_to: "resource-specific action endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-09-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; no entity mutations"]

  # --- Plant ---
  - method: POST
    path: "/plants"
    description: "Create a can plant"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region, warehouse_capacity_units]
    output: Plant
    side_effects: ["warehouse_on_hand_units=0, projected_warehouse_units=0, posture=OPEN, ops_run_index=0"]

  - method: GET
    path: "/plants/{id}"
    description: "Get a plant including computed posture and warehouse fields"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: POST
    path: "/plants/{id}/run-ops"
    description: "Operations checkpoint: ops_run_index += 1; agreements with end_date before the clock date expire (ACTIVE/RENEGOTIATING -> EXPIRED); SCHEDULED scrap returns whose pickup_window_end passed expire (SCHEDULED -> EXPIRED)"
    roles: [PlantManager]
    code: 200
    input: []
    output: Plant
    side_effects:
      - "ops_run_index += 1 and Plant.version incremented"
      - "agreement expiry sweep (ACTIVE/RENEGOTIATING with end_date < clock date -> EXPIRED)"
      - "scrap expiry sweep (SCHEDULED with pickup_window_end < clock -> EXPIRED)"

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Create a filling customer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, home_region, filling_lines_count]
    output: Customer
    side_effects: []

  # --- SupplyAgreement ---
  - method: POST
    path: "/supply-agreements"
    description: "Create a long-term supply agreement (starts DRAFT); freight_zone computed from plant region vs customer home_region"
    roles: [PlantManager]
    code: 201
    input: [plant_id, customer_id, committed_annual_units, pass_through_pct, conversion_cost_cents_per_1000, start_date, end_date]
    output: SupplyAgreement
    side_effects: ["status=DRAFT, freight_zone computed, volume_tier=STANDARD"]

  - method: GET
    path: "/supply-agreements"
    description: "List agreements with filters and pagination"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["plant_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: SupplyAgreement[]
    side_effects: []

  - method: GET
    path: "/supply-agreements/{id}"
    description: "Get one agreement including computed ledger and accuracy fields"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: []
    output: SupplyAgreement
    side_effects: []

  - method: POST
    path: "/supply-agreements/{id}/sign"
    description: "Customer signs: DRAFT -> ACTIVE"
    roles: [CustomerPlanner]
    code: 200
    input: []
    output: SupplyAgreement
    side_effects: ["status -> ACTIVE", "increments SupplyAgreement.version by 1"]

  - method: POST
    path: "/supply-agreements/{id}/open-renegotiation"
    description: "Customer reopens terms: ACTIVE -> RENEGOTIATING"
    roles: [CustomerPlanner]
    code: 200
    input: []
    output: SupplyAgreement
    side_effects: ["status -> RENEGOTIATING", "increments SupplyAgreement.version by 1"]

  - method: POST
    path: "/supply-agreements/{id}/amend"
    description: "Plant amends terms: RENEGOTIATING -> ACTIVE under OCC"
    roles: [PlantManager]
    code: 200
    input: [expected_agreement_version, "committed_annual_units?", "pass_through_pct?", "conversion_cost_cents_per_1000?", "end_date?"]
    output: SupplyAgreement
    side_effects: ["status -> ACTIVE", "volume_tier re-evaluated against amended commitment", "increments SupplyAgreement.version by 1"]

  - method: POST
    path: "/supply-agreements/{id}/terminate"
    description: "Early-terminate an ACTIVE or RENEGOTIATING agreement; returns the exposure breakdown"
    roles: [PlantManager]
    code: 200
    input: []
    output: "{ agreement_id: string, status: string, shortfall_fee_cents: integer, unamortized_tooling_cents: integer, total_exposure_cents: integer }"
    side_effects: ["status -> TERMINATED", "increments SupplyAgreement.version by 1"]

  # --- MetalPriceIndex ---
  - method: POST
    path: "/metal-price-indices"
    description: "Publish the aluminum sheet price index for a month (period unique globally)"
    roles: [PlatformAdmin]
    code: 201
    input: [period, index_cents_per_lb]
    output: MetalPriceIndex
    side_effects: []

  # --- ProductionLine ---
  - method: POST
    path: "/plants/{id}/lines"
    description: "Create a production line (bodymaker/decorator/necker train) at a plant"
    roles: [PlantManager]
    code: 201
    input: [name, nominal_speed_cans_per_hour, base_spoilage_pct]
    output: ProductionLine
    side_effects: ["operational_status=RUNNING"]

  - method: GET
    path: "/plants/{id}/lines"
    description: "List a plant's lines"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionLine[]
    side_effects: []

  # --- CanFormat ---
  - method: POST
    path: "/plants/{id}/formats"
    description: "Propose a can format at a plant (starts PROPOSED)"
    roles: [PlantManager]
    code: 201
    input: [customer_id, size_code, shape, is_specialty, metal_lbs_per_1000_units, tooling_investment_cents, min_volume_commitment_units]
    output: CanFormat
    side_effects: ["status=PROPOSED, delivered_units=0, unamortized_exposure_cents=0"]

  - method: GET
    path: "/formats/{id}"
    description: "Get one can format including computed amortization fields"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: []
    output: CanFormat
    side_effects: []

  - method: GET
    path: "/formats"
    description: "List formats filtered by plant and/or customer (FK reverse channel for both)"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["plant_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: CanFormat[]
    side_effects: []

  - method: POST
    path: "/formats/{id}/tool"
    description: "Fund and cut tooling: PROPOSED -> TOOLED (specialty requires tooling terms)"
    roles: [PlantManager]
    code: 200
    input: []
    output: CanFormat
    side_effects: ["status -> TOOLED", "unamortized_exposure_cents initialized to full tooling_investment_cents when min_volume_commitment_units > 0"]

  - method: POST
    path: "/formats/{id}/qualify"
    description: "Qualify a tooled format for production: TOOLED -> QUALIFIED"
    roles: [PlantManager]
    code: 200
    input: []
    output: CanFormat
    side_effects: ["status -> QUALIFIED"]

  - method: POST
    path: "/formats/{id}/retire"
    description: "Retire a format: TOOLED/QUALIFIED -> RETIRED; blocked while any run is open"
    roles: [PlantManager]
    code: 200
    input: []
    output: CanFormat
    side_effects: ["status -> RETIRED"]

  # --- ProductionRun ---
  - method: POST
    path: "/supply-agreements/{id}/production-runs"
    description: "Schedule a production run under an agreement (OCC on agreement version); provisional pricing locked at completion, final at settlement"
    roles: [LineScheduler]
    code: 201
    input: [line_id, format_id, scheduled_qty, graphics_code, window_start, window_end, expected_agreement_version]
    output: ProductionRun
    side_effects: ["status=SCHEDULED", "Plant projected_warehouse_units recomputed", "increments SupplyAgreement.version by 1"]

  - method: GET
    path: "/production-runs"
    description: "List runs with filters and pagination"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["line_id?", "agreement_id?", "format_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  - method: GET
    path: "/production-runs/{id}"
    description: "Get one run including computed pricing fields"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: POST
    path: "/production-runs/{id}/start"
    description: "Start a scheduled run: SCHEDULED -> IN_PROGRESS"
    roles: [LineScheduler]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/production-runs/{id}/complete"
    description: "Complete an in-progress run: IN_PROGRESS -> COMPLETED; records produced/spoiled, computes spoilage flag and PROVISIONAL price (requires prior-month index)"
    roles: [LineScheduler]
    code: 200
    input: [produced_qty, spoiled_qty]
    output: ProductionRun
    side_effects: ["status -> COMPLETED", "warehouse on-hand += produced_qty", "metal_consumed_lbs_ytd += sheet_lbs_consumed", "posture recomputed"]

  - method: POST
    path: "/production-runs/{id}/settle"
    description: "Settle a completed run: COMPLETED -> SETTLED; FINAL price variant, per-run rounding, agreement ledger sync, tier true-up cascade"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> SETTLED", "agreement ytd/revenue sync", "format delivered_units sync", "volume_tier flip true-up to sibling SETTLED runs"]

  - method: POST
    path: "/production-runs/{id}/cancel"
    description: "Cancel a SCHEDULED or HELD run"
    roles: [LineScheduler]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> CANCELLED", "warehouse projection recomputed"]

  - method: POST
    path: "/production-runs/{id}/void"
    description: "Void a COMPLETED or SETTLED run; compensating reversal of warehouse, agreement ledger, and format amortization"
    roles: [LineScheduler]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> VOIDED", "warehouse on-hand -= produced_qty", "if SETTLED: agreement ledger reversed, tier re-evaluated, sibling tier_delta reset", "format delivered_units reversed"]

  # --- CustomerForecast ---
  - method: POST
    path: "/supply-agreements/{id}/forecasts"
    description: "Customer files a volume forecast for a period (unique per agreement)"
    roles: [CustomerPlanner]
    code: 201
    input: [period, forecast_qty]
    output: CustomerForecast
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/supply-agreements/{id}/forecasts"
    description: "List an agreement's forecasts"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CustomerForecast[]
    side_effects: []

  - method: POST
    path: "/forecasts/{id}/close"
    description: "Close a forecast with the actual volume; computes accuracy and recomputes agreement rolling/lifetime accuracy"
    roles: [CustomerPlanner]
    code: 200
    input: [actual_qty]
    output: CustomerForecast
    side_effects: ["status -> CLOSED", "accuracy_pct computed", "agreement accuracy fields recomputed"]

  # --- ScrapReturn (closed-loop program) ---
  - method: POST
    path: "/customers/{id}/scrap-returns"
    description: "Schedule a closed-loop scrap pickup at a customer site (closed-interval conflict + daily cap)"
    roles: [CustomerPlanner]
    code: 201
    input: [plant_id, pickup_window_start, pickup_window_end, declared_weight_lbs]
    output: ScrapReturn
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/scrap-returns"
    description: "List scrap returns with filters"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["customer_id?", "plant_id?", "status?", "limit?", "offset?"]
    output: ScrapReturn[]
    side_effects: []

  - method: GET
    path: "/scrap-returns/{id}"
    description: "Get one scrap return"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: []
    output: ScrapReturn
    side_effects: []

  - method: POST
    path: "/scrap-returns/{id}/credit"
    description: "Verify and credit a collected scrap return: SCHEDULED -> CREDITED; feeds recycled content"
    roles: [PlantManager]
    code: 200
    input: [actual_weight_lbs, grade]
    output: ScrapReturn
    side_effects: ["status -> CREDITED", "plant scrap_credit_lbs_ytd += credited_weight_lbs", "recycled_content_pct recomputed"]

  # --- QualityIncident ---
  - method: POST
    path: "/production-runs/{id}/quality-incidents"
    description: "Open a quality incident (seam integrity, coating, or filling-line performance) on a run"
    roles: [QualityEngineer]
    code: 201
    input: [severity, defect_class, note]
    output: QualityIncident
    side_effects: ["status=OPEN", "line_id copied from run"]

  - method: GET
    path: "/quality-incidents"
    description: "List quality incidents with filters"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: ["run_id?", "line_id?", "status?", "limit?", "offset?"]
    output: QualityIncident[]
    side_effects: []

  - method: GET
    path: "/quality-incidents/{id}"
    description: "Get one quality incident"
    roles: [PlatformAdmin, PlantManager, LineScheduler, CustomerPlanner, QualityEngineer]
    code: 200
    input: []
    output: QualityIncident
    side_effects: []

  - method: POST
    path: "/quality-incidents/{id}/escalate"
    description: "Escalate an OPEN incident: linked run HELD and line enters QUALITY_HOLD"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: QualityIncident
    side_effects: ["status -> ESCALATED", "run IN_PROGRESS -> HELD", "line operational_status -> QUALITY_HOLD"]

  - method: POST
    path: "/quality-incidents/{id}/resolve"
    description: "Resolve an OPEN or ESCALATED incident; from ESCALATED releases the run hold when no other escalation remains on the line"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: QualityIncident
    side_effects: ["status -> RESOLVED", "from ESCALATED: run HELD -> IN_PROGRESS when no other ESCALATED incident on the line; line -> RUNNING"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint, or CustomerPlanner acting on another customer's resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, bad enum, range violation (e.g. scheduled_qty < 5000), end <= start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-segment resource does not exist (checked left-to-right)" }
  - { id: ERR_PLANT_NOT_FOUND, http: 404, condition: "Body FK plant_id does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Body FK customer_id does not exist" }
  - { id: ERR_LINE_NOT_FOUND, http: 404, condition: "Body FK line_id does not exist" }
  - { id: ERR_FORMAT_NOT_FOUND, http: 404, condition: "Body FK format_id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_version does not match current SupplyAgreement.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity is not in a valid from-state for the requested transition (incl. terminal-state lockdown)" }
  - { id: ERR_AGREEMENT_WINDOW_PASSED, http: 409, condition: "Sign attempted when the logical clock date is past agreement.end_date" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Run create/start requires the parent agreement to be ACTIVE" }
  - { id: ERR_FORMAT_NOT_QUALIFIED, http: 409, condition: "Run create requires the format to be QUALIFIED" }
  - { id: ERR_LINE_QUALITY_HOLD, http: 409, condition: "Line is in QUALITY_HOLD; run create/start blocked" }
  - { id: ERR_PLANT_LOCKDOWN, http: 409, condition: "Plant posture is LOCKDOWN; new run creation blocked" }
  - { id: ERR_LINE_WINDOW_OVERLAP, http: 409, condition: "Run window overlaps another open run on the same line (half-open [start,end): touching allowed)" }
  - { id: ERR_CHANGEOVER_BUFFER_VIOLATION, http: 409, condition: "Graphics changeover requires >= 240 minutes between previous run's window_end and this window_start" }
  - { id: ERR_PICKUP_WINDOW_CONFLICT, http: 409, condition: "Scrap pickup windows of the same customer overlap under CLOSED-interval semantics (touching counts as conflict)" }
  - { id: ERR_PICKUP_DAILY_LIMIT, http: 409, condition: "More than 2 SCHEDULED pickups for the same customer on one UTC day" }
  - { id: ERR_WAREHOUSE_CAPACITY_EXCEEDED, http: 409, condition: "projected_warehouse_units + scheduled_qty would exceed warehouse_capacity_units (strict >)" }
  - { id: ERR_FORMAT_HAS_OPEN_RUNS, http: 409, condition: "Format retire blocked by runs in {SCHEDULED, IN_PROGRESS, HELD}" }
  - { id: ERR_INDEX_NOT_PUBLISHED, http: 409, condition: "Required MetalPriceIndex missing (prior-month at complete; delivery-month at settle)" }
  - { id: ERR_TOOLING_TERMS_REQUIRED, http: 409, condition: "Specialty format tool-up requires tooling_investment_cents > 0 and min_volume_commitment_units > 0" }
  - { id: ERR_DUPLICATE_PERIOD, http: 409, condition: "Period already used (forecast per agreement; metal index globally)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Network operator: plants, customers, market index publication, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /plants"
      - "POST /customers"
      - "POST /metal-price-indices"
    shared_operations:
      - "all GET endpoints"

  - name: PlantManager
    description: "Plant leadership: lines, formats/tooling, agreements administration, settlement, run-ops, scrap credit"
    identity: opaque
    exclusive_operations:
      - "POST /plants/{id}/run-ops"
      - "POST /plants/{id}/lines"
      - "POST /plants/{id}/formats"
      - "POST /formats/{id}/tool, /qualify, /retire"
      - "POST /supply-agreements"
      - "POST /supply-agreements/{id}/amend, /terminate"
      - "POST /production-runs/{id}/settle"
      - "POST /scrap-returns/{id}/credit"
    shared_operations:
      - "all GET endpoints"

  - name: LineScheduler
    description: "Line scheduling and run execution"
    identity: opaque
    exclusive_operations:
      - "POST /supply-agreements/{id}/production-runs"
      - "POST /production-runs/{id}/start, /complete, /cancel, /void"
    shared_operations:
      - "all GET endpoints"

  - name: CustomerPlanner
    description: "Filling customer planner: signs and renegotiates own agreements, files forecasts, schedules closed-loop scrap pickups"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /supply-agreements/{id}/sign, /open-renegotiation"
      - "POST /supply-agreements/{id}/forecasts"
      - "POST /forecasts/{id}/close"
      - "POST /customers/{id}/scrap-returns"
    shared_operations:
      - "all GET endpoints"

  - name: QualityEngineer
    description: "Quality owner for seam integrity, coating, and customer filling-line performance"
    identity: opaque
    exclusive_operations:
      - "POST /production-runs/{id}/quality-incidents"
      - "POST /quality-incidents/{id}/escalate, /resolve"
    shared_operations:
      - "all GET endpoints"
