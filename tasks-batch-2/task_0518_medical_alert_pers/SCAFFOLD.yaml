# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this operation per RBAC"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Subscriber acts on a contract/device/contact they do not own"
  - id: ERR_NOT_ASSIGNED_AGENT
    http: 403
    condition: "Dispatch action attempted by an agent who is not AlarmEvent.assigned_agent_id"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or FK) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a legal state for the requested transition"
  - id: ERR_LIVE_MONITORING_BLOCKS_CANCEL
    http: 409
    condition: "finalize-cancellation while a device is ACTIVE/NEEDS_TEST or an alarm is non-terminal"
  - id: ERR_911_NOT_AUTHORIZED
    http: 409
    condition: "DISPATCH_911 without CRITICAL priority and without an authorizing answered contact"
  - id: ERR_CONTRACT_NOT_MONITORING
    http: 409
    condition: "Alarm raised on a device whose contract service_status != ACTIVE"
  - id: ERR_ESCALATION_ORDER
    http: 409
    condition: "CALL_CONTACT targets a contact whose priority_rank != current_escalation_rank, or an inactive contact"
  - id: ERR_NO_SHIFT_COVERAGE
    http: 409
    condition: "Alarm assign by an agent with no SCHEDULED AgentShift covering clock.now"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "New SCHEDULED AgentShift half-open interval intersects an existing SCHEDULED shift for the same agent_user_id"
  - id: ERR_HOLD_OVERLAP
    http: 409
    condition: "New SCHEDULED MonitoringHold within HOLD_GAP_DAYS (7d) buffer of an existing SCHEDULED hold on the same device"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Duplicate device serial_number, plan tier (non-archived), or subscriber email"
  - id: ERR_TEMPORAL_NOT_DUE
    http: 409
    condition: "Time-gated action attempted before its due instant (mark-past-due, finalize-cancellation, UNRETURNED inspect)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_contract_version != Contract.version on cancellation request (OCC)"
  - id: ERR_ENROLL_PRECONDITION
    http: 422
    condition: "Enroll without a passing DeviceTest, or fall detection on a non-fall-capable device_type"
  - id: ERR_CONTACT_TREE_INVALID
    http: 422
    condition: "Duplicate priority_rank within subscriber, escalation target of a different subscriber, or escalation cycle"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum, out-of-range integer (e.g. battery not in 0..100), negative amount"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "Operator who configures plans, manages contracts/billing, runs equipment-return processing, and sets the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /pers/monitoring-plans (and /{id}/archive)"
      - "POST /pers/subscribers"
      - "POST /pers/contracts"
      - "POST /pers/contracts/{id}/activate, /suspend, /reinstate, /finalize-cancellation"
      - "POST /pers/contracts/{id}/billing/* (mark-past-due, record-payment, write-off)"
      - "POST /pers/equipment-returns/{id}/* (send-kit, mark-received, inspect, close)"
      - "POST /pers/agent-shifts (and /{id}/cancel)"
      - "POST /pers/_clock/set_current_utc"
    shared_operations:
      - "GET reads on plans, subscribers, contracts, devices, alarms, equipment-returns, agent-shifts, monitoring-holds"
  - name: Subscriber
    description: "Account holder who registers/enrolls/tests their own devices, manages their contact tree, requests cancellation, and may raise their own alarms"
    identity: "entity_backed:Subscriber"
    exclusive_operations:
      - "POST /pers/contracts/{id}/request-cancellation"
      - "POST /pers/devices/{id}/enroll"
      - "POST /pers/devices/{id}/tests"
      - "POST /pers/emergency-contacts, PATCH /pers/emergency-contacts/{id}"
      - "POST /pers/monitoring-holds (and /{id}/cancel)"
    shared_operations:
      - "POST /pers/devices (register; also allowed to PlatformAdmin)"
      - "POST /pers/devices/{id}/alarms (also allowed to CallCenterAgent)"
      - "GET reads on own contracts, devices, contacts, alarms, equipment-returns, plans"
  - name: CallCenterAgent
    description: "Monitoring-center operator who assigns alarms and records dispatch actions through the response protocol"
    identity: "opaque"
    exclusive_operations:
      - "POST /pers/alarms/{id}/assign"
      - "POST /pers/alarms/{id}/dispatch-actions"
    shared_operations:
      - "POST /pers/devices/{id}/alarms (also allowed to Subscriber)"
      - "GET reads on alarms, devices, emergency-contacts, dispatch-actions"
