  # ===========================================================================
  # Section: errors (catalog coverage — stub the ones §1.8 already triggers)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_window_not_open
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / registration_at_exact_deadline_rejected"
          rationale: "Also the failure leg of cross_entity_state_dependency / registration_requires_window_open."
      - name: error_candidate_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_CANDIDATE_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / module_attempt_safety_beats_temporal"
          rationale: "Triggered there by the suspended candidate's module attempt."
      - name: error_enrollment_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / module_attempt_requires_active_enrollment"
          rationale: "Triggered there by the attempt on the WITHDRAWN enrollment."
      - name: error_window_schedule_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / same_exam_window_overlap_half_open"
          rationale: "Overlapping same-exam window rejected there; adjacency allowed."
      - name: error_session_same_day_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_SAME_DAY_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / course_booking_same_day_conflict"
          rationale: "Same-date sessions rejected there despite disjoint times."
      - name: syllabus_double_activation_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SYLLABUS_ACTIVATION_INVALID]", "state_machines.SyllabusVersion"]
        distinguishing_aspect: "Only a DRAFT version can activate: activating an already-ACTIVE version fails ERR_SYLLABUS_ACTIVATION_INVALID."
        test_recipe:
          setup: ["syllabus 2026-A already ACTIVE"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "${st1} == ACTIVE and ${err} == ERR_SYLLABUS_ACTIVATION_INVALID"

  # ===========================================================================
  # Section: state_machines (late additions)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: discipline_reprimand_keeps_candidate_active
        claim_type: side_effect_execution
        grounds: ["state_machines.DisciplineCase.FILED_to_RESOLVED", "entities.DisciplineCase.fields.resolution"]
        distinguishing_aspect: "The REPRIMAND resolution value is reachable and non-cascading: the case resolves with resolution REPRIMAND while the candidate stays ACTIVE and the registration stays REGISTERED (contrast with SUSPENSION/EXPULSION)."
        test_recipe:
          setup: ["candidate REGISTERED to a window; discipline case FILED"]
          setup_api_calls:
            - call: "POST /actuarial/syllabus-versions"
              payload: { version_code: "2026-A" }
              as: Registrar
              captures: { syl_id: $.data.id }
            - call: "POST /actuarial/exams"
              payload: { exam_code: "P", title: "Probability", credit_hours: 10, syllabus_version_id: "${syl_id}" }
              as: Registrar
              captures: { exam_p_id: $.data.id }
            - call: "POST /actuarial/syllabus-versions/${syl_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /actuarial/exam-windows"
              payload: { exam_id: "${exam_p_id}", window_code: "P-2026-10", registration_opens_at: "2026-09-01T00:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", testing_starts_at: "2026-10-10T09:00:00Z", testing_ends_at: "2026-10-12T17:00:00Z", capacity: 30, base_fee_cents: 30000, late_surcharge_cents: 7500 }
              as: Registrar
              captures: { win_id: $.data.id }
            - call: "POST /actuarial/candidates"
              payload: { email: "cand1@example.com", full_name: "Cand One" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /actuarial/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /actuarial/exam-registrations"
              payload: { exam_window_id: "${win_id}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /actuarial/discipline-cases"
              payload: { candidate_id: "${cand_id}", charge: "Administrative lapse", severity: 2 }
              as: Registrar
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /actuarial/discipline-cases/${case_id}/sanction"
              payload: { resolution: "REPRIMAND" }
              as: DisciplineBoard
              captures: { case_res: $.data.resolution, case_st: $.data.status }
            - call: "GET /actuarial/candidates/${cand_id}"
              as: Registrar
              captures: { cand_st: $.data.status }
            - call: "GET /actuarial/candidates/${cand_id}/registrations"
              as: Registrar
              captures: { reg_logi: "$.data[0].logistics_status" }
          assert:
            - "${case_st} == RESOLVED and ${case_res} == REPRIMAND"
            - "${cand_st} == ACTIVE and ${reg_logi} == REGISTERED (no cascade)"
