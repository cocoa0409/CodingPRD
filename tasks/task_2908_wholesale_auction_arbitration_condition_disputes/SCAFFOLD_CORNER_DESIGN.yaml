              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
            - call: "POST /arbitration/cases/${case_id}/seller-response"
              payload: { response_type: "DISPUTE", response_note: "Odometer read true at consignment" }
              as: SellerRep
              as_user_id: "${seller_id}"
          trigger:
            - call: "POST /arbitration/cases/${case_id}/decision"
              payload: { outcome: "REPAIR_ALLOWANCE", fault_party: "SELLER", rationale: "Undisclosed 20000-mile discrepancy", requested_allowance_cents: 500000 }
              as: Arbitrator
              as_user_id: "arb-decide-02"
          assert:
            - "HTTP 201 and response.data.computed_award_cents == 580000 — the 900000 diminution clipped to 4000 bps of 1450000"
            - "response.data.allowance_cents == 500000 and response.data.allowance_variant == \"ARBITRATOR_AWARD\""
            - "response.data.transport_total_cents == 0, transport_buyer_share_cents == 0, transport_seller_share_cents == 0 and transport_auction_share_cents == 0"
            - "GET /arbitration/cases/${case_id} returns status == \"RESOLVED_ALLOWANCE\" and verified_true_mileage == 104000"
            - "GET /arbitration/cases/${case_id}/ledger-entries returns exactly 2 rows: (BUYER, REPAIR_ALLOWANCE, +500000) and (SELLER, REPAIR_ALLOWANCE, -500000)"
            - "GET /arbitration/sales/${sale_id} returns settlement_status == \"UNSETTLED\" — the allowance branch never reverses proceeds"

