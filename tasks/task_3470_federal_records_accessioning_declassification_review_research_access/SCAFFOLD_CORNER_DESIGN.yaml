# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3470_federal_records_accessioning_declassification_review_research_access
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
# Logical-clock default: 2026-09-01T00:00:00Z.
# ===========================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: agency_create_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Agency
          - endpoints.POST_/records/agencies
          - response_envelope
        distinguishing_aspect: "A PlatformAdmin creating an agency with agency_code and name receives 201, response_type object, a server-minted UUID id, created_at/updated_at, and version == 1 — none of the system fields are client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - &k_ag_doj
              call: "POST /records/agencies"
              payload: { agency_code: "DOJ", name: "Department of Justice" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ag_doj: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Agency.${ag_doj}.agency_code == \"DOJ\" and name == \"Department of Justice\""
            - "Agency.${ag_doj}.version == 1 and id is a prefix-free UUID"
            - "created_at and updated_at are present and equal the logical clock 2026-09-01T00:00:00Z"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: schedule_get_roundtrip_returns_stored_configuration
        claim_type: Retrieval
        grounds:
          - entities.RecordsSchedule
          - endpoints.GET_/records/schedules/{id}
        distinguishing_aspect: "Every RecordsSchedule input field round-trips through GET exactly as posted, including transfer_lag_years 30 and classification_default TOP_SECRET, with status DRAFT stamped by the system."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ; one DRAFT schedule."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - &k_sch_s4_create
              call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-004", title: "Counterintelligence Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 30, classification_default: "TOP_SECRET" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s4: $.data.id }
          trigger:
            - call: "GET /records/schedules/${sch_s4}"
              payload: {}
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
          assert:
            - "the response status is 200"
            - "RecordsSchedule.${sch_s4}.transfer_lag_years == 30 and classification_default == TOP_SECRET"
            - "RecordsSchedule.${sch_s4}.records_domain == FEDERAL and disposition == PERMANENT"
            - "RecordsSchedule.${sch_s4}.status == DRAFT and appraiser_id is null and decided_by is null"

      - name: schedules_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/records/schedules
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three DRAFT schedules on one agency, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the default page uses limit 10; the status filter narrows the set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ with three DRAFT schedules SCH-DOJ-101/102/103."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-101", title: "A", records_domain: "FEDERAL", disposition: "TEMPORARY", classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-102", title: "B", records_domain: "FEDERAL", disposition: "TEMPORARY", classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-103", title: "C", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
          trigger:
            - call: "GET /records/schedules"
              payload: { agency_id: "${ag_doj}", limit: 2, offset: 0 }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /records/schedules?agency_id=${ag_doj}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /records/schedules?agency_id=${ag_doj} with no limit/offset returns 3 rows (defaults limit 10, offset 0)"
            - "GET /records/schedules?agency_id=${ag_doj}&status=DRAFT returns 3 rows"

      - name: transfer_get_with_unknown_id_returns_transfer_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/records/transfers/{id}
          - errors.ERR_TRANSFER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces the entity-specific 404 ERR_TRANSFER_NOT_FOUND inside the standard error envelope, not a generic 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /records/transfers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_TRANSFER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: schedule_create_missing_title_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.RecordsSchedule.fields.title
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "title is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST, not a 404 and not a 422 business error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
          trigger:
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-104", records_domain: "FEDERAL", disposition: "TEMPORARY", classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /records/schedules?agency_id=${ag_doj} returns 0 rows"

      - name: reproduction_create_omitting_rush_defaults_false
        claim_type: Defaults
        grounds:
          - entities.ReproductionRequest.fields.rush
          - calculations.reproduction_fee
        distinguishing_aspect: "rush declares default false; omitting it stores false and the fee is the undiscounted tier sum — 25 JOURNALIST pages cost 1850 cents, exactly 20*80 + 5*50 with no rush multiplier."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PUBLIC DESCRIBED collection C2 (50 units); ACTIVE JOURNALIST researcher Bob."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - &k_sch_s2_create
              call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-002", title: "Administrative Program Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s2: $.data.id }
            - &k_sch_s2_submit
              call: "POST /records/schedules/${sch_s2}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &k_sch_s2_appraise
              call: "POST /records/schedules/${sch_s2}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - &k_sch_s2_decide
              call: "POST /records/schedules/${sch_s2}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - &k_tr_t2_create
              call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s2}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 50, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 12.5 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_t2: $.data.id }
            - &k_tr_t2_meta
              call: "POST /records/transfers/${tr_t2}/submit-metadata"
              payload: { metadata_elements: ["title", "creator", "date_span", "extent"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &k_tr_t2_accession
              call: "POST /records/transfers/${tr_t2}/accession"
              payload: { receipt_note: "condition report CR-77 filed" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c2: $.data.collection_id }
            - &k_col_c2_begin
              call: "POST /records/collections/${col_c2}/begin-processing"
              payload: {}
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - &k_col_c2_describe
              call: "POST /records/collections/${col_c2}/complete-description"
              payload: { scope_note: "case files 1995-2001", arrangement_note: "alphabetical", container_list_summary: "50 boxes" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
            - &k_res_bob
              call: "POST /records/researchers"
              payload: { full_name: "Bob Press", email: "bob@example.org", affiliation: "JOURNALIST", id_document: "PP-2002" }
              as: Anonymous
              captures: { res_bob: $.data.id }
            - &k_res_bob_act
              call: "POST /records/researchers/${res_bob}/activate"
              payload: {}
              as: ResearchRoomStaff
              as_user_id: "staff-1"
          trigger:
            - call: "POST /records/reproduction-requests"
              payload: { researcher_id: "${res_bob}", collection_id: "${col_c2}", page_count: 25, format: "DIGITAL_SCAN" }
              as: Researcher
              as_user_id: "${res_bob}"
              captures: { rr25: $.data.id }
          assert:
            - "the response status is 201"
            - "ReproductionRequest.${rr25}.rush == false (default applied)"
            - "ReproductionRequest.${rr25}.fee_cents == 1850"
            - "ReproductionRequest.${rr25}.status == QUOTED"

      - name: collection_backlog_score_computed_at_accession
        claim_type: Computed Fields
        grounds:
          - entities.Collection.fields.backlog_score
          - entities.Collection.fields.restriction_posture
          - calculations.processing_backlog_score
          - calculations.restriction_posture
        distinguishing_aspect: "backlog_score and restriction_posture are computed, never client-set: the SECRET FEDERAL collection with cutoff 2001-03-15 accessioned at 2026-09-01 scores 10*min(25,60) + 15 + 0 == 265 and reads CLASSIFIED_REVIEW_REQUIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. APPROVED SECRET FEDERAL schedule (SCH-DOJ-001); VALIDATED ELECTRONIC transfer with cutoff 2001-03-15."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - &k_sch_s1_create
              call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-001", title: "Criminal Investigative Case Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "SECRET" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_s1: $.data.id }
            - &k_sch_s1_submit
              call: "POST /records/schedules/${sch_s1}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
            - &k_sch_s1_appraise
              call: "POST /records/schedules/${sch_s1}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - &k_sch_s1_decide
              call: "POST /records/schedules/${sch_s1}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
            - &k_tr_t1_create
              call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s1}", agency_id: "${ag_doj}", transfer_method: "ELECTRONIC", metadata_standard: "PREMIS_3_0", unit_count: 50, records_cutoff_date: "2001-03-15T00:00:00Z", checksum_manifest: "sha256:9f2c" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_t1: $.data.id }
            - &k_tr_t1_meta
              call: "POST /records/transfers/${tr_t1}/submit-metadata"
              payload: { metadata_elements: ["object_id", "fixity", "format", "provenance"] }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
          trigger:
            - &k_tr_t1_accession
              call: "POST /records/transfers/${tr_t1}/accession"
              payload: { receipt_note: "ingest verified, virus scan clean" }
              as: ProcessingArchivist
              as_user_id: "arch-pro-1"
              captures: { col_c1: $.data.collection_id }
          assert:
            - "the response status is 200"
            - "Collection.${col_c1}.backlog_score == 265 (10*25 age points + 15 SECRET weight + 0 FEDERAL)"
            - "Collection.${col_c1}.restriction_posture == CLASSIFIED_REVIEW_REQUIRED"
            - "Collection.${col_c1}.processing_status == UNPROCESSED and digitization_status == NOT_REQUESTED and declass_outcome == NONE"
            - "Collection.${col_c1}.pull_count_total == 0 and repro_pages_fulfilled == 0 and foia_release_count == 0"

      - name: transfer_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Transfer.fields.status
          - endpoints.POST_/records/transfers
        distinguishing_aspect: "status, version and collection_id are system-owned; a create body carrying status ACCESSIONED and version 99 is ignored — the transfer lands INITIATED with version 1 and collection_id null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. APPROVED NONE FEDERAL schedule S2."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
          trigger:
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s2}", agency_id: "${ag_doj}", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 10, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 2.0, status: "ACCESSIONED", version: 99, collection_id: "00000000-0000-4000-8000-000000000099" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { tr_sys: $.data.id }
          assert:
            - "the response status is 201"
            - "Transfer.${tr_sys}.status == INITIATED (client-supplied ACCESSIONED ignored)"
            - "Transfer.${tr_sys}.version == 1 (client-supplied 99 ignored)"
            - "Transfer.${tr_sys}.collection_id is null (client-supplied value ignored)"

      - name: schedule_create_out_of_enum_domain_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.RecordsSchedule.fields.records_domain
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "records_domain is a closed enum {FEDERAL, PRESIDENTIAL}; the value ROYAL is rejected with 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
          trigger:
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-105", title: "Bad Domain", records_domain: "ROYAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /records/schedules?agency_id=${ag_doj} returns 0 rows"

      - name: transfer_create_body_fks_checked_in_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/records/transfers
          - errors.ERR_SCHEDULE_NOT_FOUND
          - errors.ERR_AGENCY_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology puts both foreign keys in the body; priority 4 checks them in declared input order — schedule_id before agency_id — so two unknown ids yield ERR_SCHEDULE_NOT_FOUND, and only an unknown agency yields ERR_AGENCY_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. APPROVED NONE FEDERAL schedule S2 under agency DOJ."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - *k_sch_s2_create
            - *k_sch_s2_submit
            - *k_sch_s2_appraise
            - *k_sch_s2_decide
          trigger:
            - call: "POST /records/transfers"
              payload: { schedule_id: "00000000-0000-4000-8000-000000000001", agency_id: "00000000-0000-4000-8000-000000000002", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 10, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 2.0 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { err_both: $.data.error_id }
            - call: "POST /records/transfers"
              payload: { schedule_id: "${sch_s2}", agency_id: "00000000-0000-4000-8000-000000000002", transfer_method: "PHYSICAL", metadata_standard: "EAD_2002", unit_count: 10, records_cutoff_date: "2001-03-15T00:00:00Z", linear_feet: 2.0 }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { err_agency: $.data.error_id }
          assert:
            - "the first create returns 404 and err_both == ERR_SCHEDULE_NOT_FOUND (schedule_id is checked before agency_id)"
            - "the second create returns 404 and err_agency == ERR_AGENCY_NOT_FOUND"
            - "GET /records/transfers?schedule_id=${sch_s2} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: schedule_happy_path_stamps_and_version_progression
        claim_type: Valid Transition
        grounds:
          - state_machines.RecordsSchedule
        distinguishing_aspect: "DRAFT -> SUBMITTED -> APPRAISED -> APPROVED advances version 1 -> 4 and stamps appraiser_id / decided_by from the acting X-User-ID, with appraisal_recommendation recorded at appraise."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ; DRAFT schedule SCH-DOJ-020."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-020", title: "Field Office General Files", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "CONFIDENTIAL" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_hp: $.data.id }
          trigger:
            - call: "POST /records/schedules/${sch_hp}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { v_sub: $.data.version }
            - call: "POST /records/schedules/${sch_hp}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
              captures: { v_app: $.data.version }
            - call: "POST /records/schedules/${sch_hp}/decide"
              payload: { decision: "APPROVE", decision_note: "permanent" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { v_dec: $.data.version, final_status: $.data.status }
          assert:
            - "v_sub == 2 and v_app == 3 and v_dec == 4"
            - "final_status == APPROVED"
            - "RecordsSchedule.${sch_hp}.appraiser_id == \"arch-ap-1\" and appraisal_recommendation == APPROVE"
            - "RecordsSchedule.${sch_hp}.decided_by == \"arch-chief-1\" and decision_note == \"permanent\""

      - name: schedule_decide_before_appraise_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RecordsSchedule.APPRAISED_to_APPROVED
          - errors.ERR_SCHEDULE_NOT_APPRAISED
        distinguishing_aspect: "decide from SUBMITTED (never appraised) is rejected with the endpoint-specific ERR_SCHEDULE_NOT_APPRAISED, and the schedule is unchanged; the normal appraise-then-decide path still succeeds afterwards."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Agency DOJ; SUBMITTED schedule."
          setup_api_calls:
            - *k_clock
            - *k_ag_doj
            - call: "POST /records/schedules"
              payload: { agency_id: "${ag_doj}", schedule_number: "SCH-DOJ-021", title: "Premature", records_domain: "FEDERAL", disposition: "PERMANENT", transfer_lag_years: 20, classification_default: "NONE" }
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
              captures: { sch_pre: $.data.id }
            - call: "POST /records/schedules/${sch_pre}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "${ag_doj}"
          trigger:
            - call: "POST /records/schedules/${sch_pre}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
              captures: { err_pre: $.data.error_id }
            - call: "POST /records/schedules/${sch_pre}/appraise"
              payload: { appraisal_recommendation: "APPROVE" }
              as: AppraisalArchivist
              as_user_id: "arch-ap-1"
            - call: "POST /records/schedules/${sch_pre}/decide"
              payload: { decision: "APPROVE" }
              as: ChiefArchivist
              as_user_id: "arch-chief-1"
          assert:
            - "the premature decide returns 409 and err_pre == ERR_SCHEDULE_NOT_APPRAISED"
            - "after the failed decide the schedule is still SUBMITTED"
            - "the appraise-then-decide sequence then succeeds: final status APPROVED"

      - name: transfer_metadata_deficient_retry_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.Transfer.INITIATED_to_DEFICIENT
          - state_machines.Transfer.DEFICIENT_to_DEFICIENT
          - state_machines.Transfer.DEFICIENT_to_VALIDATED
        distinguishing_aspect: "The metadata retry loop is non-linear: INITIATED -> DEFICIENT -> DEFICIENT (self-loop) -> VALIDATED, with last_missing_elements recomputed (sorted) on every submission and cleared on success."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. APPROVED SECRET schedule S1; ELECTRONIC PREMIS_3_0 transfer INITIATED."
          setup_api_calls:
            - *k_clock
