          - errors[ERR_RETRO_ONLY]
          - entities.CxProject.fields.project_type
        distinguishing_aspect: "EnergyBaseline rows exist only for retro-commissioning: on a NEW_CONSTRUCTION project the create answers 422 ERR_RETRO_ONLY and no row is written."
