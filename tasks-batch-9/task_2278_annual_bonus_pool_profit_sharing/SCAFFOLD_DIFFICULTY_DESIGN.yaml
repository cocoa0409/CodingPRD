  - rule_id: boundary_precision_check
    instances:

      - name: funding_curve_floor_at_blended_eighty_versus_seventy_nine_point_nine_nine
        grounds:
          - calculations.funding_curve_multiplier
          - calculations.blended_achievement
          - validations.priority_110
          - errors.ERR_FUNDING_MULTIPLIER_ZERO
          - endpoints."POST /bonus-plans/{planId}/certification-decision"
          - endpoints."POST /bonus-plans/{planId}/fund-pool"
        distinguishing_aspect: |
          Boundary metric: blended_achievement_pct against CURVE_FLOOR_PCT
          80.00, discriminated at 0.01 percentage point. Two otherwise
          identical plans differ only in one metric actual (919.96 vs 920):
          blended 79.99 yields multiplier 0.0000 and makes fund-pool fail with
          409 ERR_FUNDING_MULTIPLIER_ZERO, while blended 80.00 — the inclusive
          bottom of the band — yields exactly 0.5000 and funds 2,000,000. An
          exclusive `>` reading of the floor turns the funded plan into a
          zero-funding plan.
        test_recipe:
          setup:
            - "One unit UNIT-B1 hosting one pool in each of two plans that are identical except for the REVENUE actual."
            - "Each plan: L5 target 20.00%, REVENUE metric weight 100.00 with band 900/1000/1200, one participant L5 salary 20,000,000 hired 2025-03-01 (award target 4,000,000), scorecard certified at 100.00, submitted and certified."
            - "Plan A actual 919.96 -> achievement 59.98 -> company 59.98 -> blended 79.99. Plan B actual 920 -> achievement 60.00 -> company 60.00 -> blended 80.00."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-B1", name: "Unit B1" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
