        claim_type: Correct Result
        grounds:
          - calculations.parts_stock_position
          - endpoints.POST_/fitness/service-orders/{serviceOrderId}/reserve-part
        distinguishing_aspect: "A zero-quantity reservation is the exact-emptiness boundary of the stock aggregation: it must fail rather than silently move the reservation ledger by zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T13:30:00Z. A delivered linked device, a DISPATCHED cosmetic order and a TREAD part restocked to 5."
          setup_api_calls:
            - *c_clock
            - *c_m_create
            - *c_u_owner
            - *c_uv_owner
            - *c_d_create
            - *c_o_create
            - *c_a_create
            - *c_a_sched
            - *c_k_deliver
            - *c_a_start
            - *c_a_complete
            - call: "POST /fitness/parts-inventory"
              payload: { part_code: "TREAD-BELT-42", compatible_sku: "TREAD", safety_stock_qty: 2, part_lot_key: "LOT-2026-09" }
              as: PlatformAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /fitness/parts-inventory/${pi_id}/restock"
              payload: { quantity: 5 }
              as: PlatformAdmin
            - call: "POST /fitness/service-orders"
              payload: { device_id: "${d_id}", reported_fault_code: "BELT_SLIP", diagnosis_note: "belt abrasion" }
              as: ServiceTechnician
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /fitness/service-orders/${so_id}/reserve-part"
