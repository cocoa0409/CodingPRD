      - name: utility_disconnection_failed_self_loop_bubbles_work_order_back_to_hold
        grounds:
          - state_machines.UtilityDisconnection.FAILED_to_FAILED
          - state_machines.UtilityDisconnection.CONFIRMED_to_FAILED
          - state_machines.DemolitionWorkOrder.READY_to_UTILITY_HOLD
          - entities.UtilityDisconnection.fields.failed_attempt_count
          - entities.DemolitionWorkOrder.fields.confirmed_utility_types
          - global_constants.REQUIRED_UTILITY_TYPES
        distinguishing_aspect: |
          Two non-linearities the other two instances in this rule do not have: a genuine self-loop
          (FAILED -> FAILED, which increments failed_attempt_count to 2 while status never changes)
          and a BACKWARD compound-state edge on the parent (READY -> UTILITY_HOLD) driven by a child
          leaving CONFIRMED. The parent's status is derived from its children, so it must be
          recomputed downward, not just advanced forward.
