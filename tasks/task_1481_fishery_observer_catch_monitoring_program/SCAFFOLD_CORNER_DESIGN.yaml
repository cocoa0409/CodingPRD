              as: ProgramAdmin
              captures: { obs_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Sd", permit_number: "PERMIT-SD", home_port: "Kodiak", length_ft: 45, gear_type: "POT" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v_id}" }
              as: ProgramCoordinator
              captures: { n_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n_v: $.data.version }
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-09-10T00:00:00Z", scheduled_return_date: "2026-09-19T00:00:00Z", expected_selection_notice_version: "${n_v}" }
              as: ProgramCoordinator
              captures: { d_id: $.data.id, d_planned: $.data.planned_sea_days }
            - call: "POST /observer-program/deployments/${d_id}/safety-inspections"
              payload: { life_raft_certified: true, epirb_registered: true, immersion_suits_adequate: true, fire_suppression_ok: true, comms_equipment_ok: true }
              as: Observer
              as_user_id: "${obs_id}"
            - call: "POST /observer-program/deployments/${d_id}/board"
              payload: {}
              as: Observer
              as_user_id: "${obs_id}"
          trigger:
            - call: "POST /observer-program/deployments/${d_id}/return"
              payload: { actual_return_date: "2026-09-14T00:00:00Z" }
              as: Observer
              as_user_id: "${obs_id}"
              captures: { d_actual: $.data.actual_sea_days, d_st: $.data.status }
            - call: "GET /observer-program/selection-notices/${n_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { n_res: $.data.reserved_sea_days, n_cons: $.data.consumed_sea_days, n_rem: $.data.remaining_sea_days }
          assert:
            - "Deployment.${d_id}.planned_sea_days == 10 (inclusive: (2026-09-19 - 2026-09-10).days + 1)"
            - "Deployment.${d_id}.actual_sea_days == 5 (inclusive: (2026-09-14 - 2026-09-10).days + 1) and status == RETURNED"
            - "Notice: reserved_sea_days == 0, consumed_sea_days == 5, remaining_sea_days == 25"
            - "Invariant: allocated 30 == 25 + 0 + 5"

      - name: observer_consecutive_cap_equality_allowed
        claim_type: correct_result
        grounds:
          - calculations.observer_capacity_check
          - errors[ERR_OBSERVER_CONSECUTIVE_CAP_EXCEEDED]
        distinguishing_aspect: |
          The consecutive cap uses strict >: a TRAINEE (max_consecutive 20) may
          take a deployment of EXACTLY 20 days (equality allowed) but 21 days is
          rejected with ERR_OBSERVER_CONSECUTIVE_CAP_EXCEEDED (422).
        test_recipe:
          setup:
            - "Fishery F; operator OP; vessels V1, V2 ACTIVE; observer OBS TRAINEE (cap 20)"
            - "Plan P projected 200/0 -> required 60 -> 2 selected; notices N1 (V1), N2 (V2) accepted"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-CC", name: "Consecutive Cap", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
