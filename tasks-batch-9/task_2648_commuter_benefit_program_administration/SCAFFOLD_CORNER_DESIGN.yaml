          setup:
            - "Employer 'Late Loss Co' is ACTIVE in US-TX-AUS with an ACTIVE TRANSIT_PASS category and an ACTIVE PAPER_PASS medium AUS-LL at 6000 cents."
            - "One employee has a PENDING election with media_quantity 1 in the OPEN 2026-08 window; its single order (quantity 1) was sealed by desk-a, released by desk-b, shipped and delivery-confirmed, so the order is DELIVERED, the election's fulfillment_status is DELIVERED and the batch is RECONCILED."
