  - section: endpoints
    instances:
      - name: print_press_create_then_read_then_list_round_trips
        claim_type: standard_crud
        grounds:
          - endpoints[POST /print-presses]
          - endpoints[GET /print-presses/{id}]
          - endpoints[GET /print-presses]
        distinguishing_aspect: "PrintPress has no state machine and no mutating action, so its whole surface is the create-read-list triple; max_delta_e is the only optional field and it is supplied here."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - *a_clock_d1_0600
          trigger:
            - { call: "POST /print-presses", payload: { press_code: "PR-1", cylinder_capacity: 8, max_colors: 6, registration_tolerance_micron: 80.0, max_delta_e: 2.0 }, as: PlantAdmin, captures: { press1: "$.data.id" } }
            - { call: "GET /print-presses/${press1}", payload: {}, as: PrintOperator }
            - { call: "GET /print-presses", payload: { limit: 10, offset: 0 }, as: PrintOperator }
          assert:
            - "POST /print-presses -> 201 with version == 1"
            - "GET /print-presses/${press1} -> 200 with cylinder_capacity == 8, max_colors == 6, registration_tolerance_micron == 80.0, max_delta_e == 2.0"
            - "GET /print-presses -> 200 with total_count 1 and has_more == false"
      - name: pool_balance_read_matches_the_ledger_derived_figures
        claim_type: computed_read
        grounds:
          - endpoints[GET /regrind-pools/{id}/balance]
          - calculations.pool_mass_balance
        distinguishing_aspect: "The balance projection is derived from the IN/OUT ledger rows rather than stored independently: one 100.000 kg scrap generation from an all-virgin run leaves zero embedded PCR and a single generation event."
        test_recipe:
          setup:
            - "RUN-NF-1 COMPLETED with gross 500.0 kg and scrap 100.0 kg booked into POOL-NF"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_roll1
            - *a_run1_comp
          trigger:
            - { call: "GET /regrind-pools/${pool_nf}/balance", payload: {}, as: ExtrusionOperator }
            - { call: "GET /regrind-transactions", payload: { pool_id: "${pool_nf}", direction: "IN" }, as: ExtrusionOperator }
          assert:
            - "GET /regrind-pools/${pool_nf}/balance -> 200"
            - "RegrindPool.${pool_nf}.available_kg == 100.000, cumulative_in_kg == 100.000, cumulative_out_kg == 0.000"
            - "RegrindPool.${pool_nf}.cumulative_in_pcr_kg == 0.000 and embedded_pcr_pct == 0.000"
            - "RegrindPool.${pool_nf}.generation_count == 1 and reincorporation_count == 0"
            - "the ledger query returns total_count 1 with data[0].origin_kind == RUN_SCRAP and data[0].kg == 100.000"
      - name: packout_on_a_lot_that_has_not_been_qualified_is_refused
        claim_type: conditional_action
        grounds:
