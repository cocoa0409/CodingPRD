          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_RESTITUTION_EXCEEDS_OUTSTANDING]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a mark-received on a RETURNED
