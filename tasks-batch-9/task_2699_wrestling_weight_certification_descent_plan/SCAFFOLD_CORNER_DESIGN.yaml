              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { plan_a: $.data.id }
            - call: "POST /descent-plans/${plan_a}/certify"
              payload: {}
              as: StateOffice
            - call: "POST /wrestlers/${wrestler_a}/eligibility-checks"
              payload: { event_id: "${event_1}", requested_class_lbs: 144 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { b_outcome: $.data.outcome, b_err: $.data.blocking_error_id, b_class: $.data.lowest_eligible_class_lbs, b_sched: $.data.schedule_allowable_weight_lbs, b_g: $.data.growth_allowance_lbs }
            - call: "POST /wrestlers/${wrestler_a}/eligibility-checks"
              payload: { event_id: "${event_1}", requested_class_lbs: 150 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { c_outcome: $.data.outcome, c_err: $.data.blocking_error_id, c_class: $.data.lowest_eligible_class_lbs, c_checked: $.data.checked_at }
            - call: "GET /wrestlers/${wrestler_a}"
