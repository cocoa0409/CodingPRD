# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3330_electric_arc_furnace_mini_mill_production_scrap
#
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners that §1.8 covers appear as
# excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: mill_create_returns_common_fields_and_normal_posture
        claim_type: Creation
        grounds:
          - entities.Mill
          - endpoints.POST_/mills
        distinguishing_aspect: "A mill created with the four required inputs returns 201 with status-agnostic posture NORMAL, version 1, and server-minted id/created_at/updated_at; posture is computed, never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z (no clock-set call). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mills"
              payload: { name: "Berkshire Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Mill.${mill_id}.posture == NORMAL"
            - "Mill.${mill_id}.version == 1"
            - "the response carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: mill_create_with_out_of_enum_division_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Mill.fields.division
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "division is a closed enum {CONSTRUCTION, AUTOMOTIVE, ENERGY}; SOLAR is rejected at priority 3 with 400 before any persistence."
        test_recipe:
          setup: ["Empty database; default logical clock."]
          setup_api_calls: []
          trigger:
            - call: "POST /mills"
              payload: { name: "Bad Division Mill", division: "SOLAR", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /mills returns 0 rows"

      - name: surcharge_index_supersede_flips_prior_row
        claim_type: Defaults
        grounds:
          - entities.SurchargeIndex.fields.status
          - state_machines.SurchargeIndex.PUBLISHED_to_SUPERSEDED
          - endpoints.POST_/mills/{millId}/surcharge-indices
        distinguishing_aspect: "Posting a second index for the same (grade_category, effective_month) flips the prior row to SUPERSEDED and the new row is PUBLISHED — the supersede mutation is the only write an immutable index row ever undergoes."
        test_recipe:
          setup:
            - "Default logical clock. One mill."
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
              captures: { idx_first: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38500 }
              as: PlantManager
              captures: { idx_second: $.data.id }
            - call: "GET /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", status: "PUBLISHED" }
              as: ProcurementOfficer
          assert:
            - "the PUBLISHED-filtered list returns exactly 1 row: SurchargeIndex.${idx_second}"
            - "SurchargeIndex.${idx_first}.status == SUPERSEDED (observable via the unfiltered list)"
            - "SurchargeIndex.${idx_second}.status == PUBLISHED and price_per_ton_cents == 38500"

      - name: procurement_contract_create_indexed_with_price_returns_contract_price_forbidden
        claim_type: Type Constraints
        grounds:
          - validations[priority=11]
          - errors.ERR_CONTRACT_PRICE_FORBIDDEN
        distinguishing_aspect: "The contract_price_cents rule is bidirectional: INDEXED + present is forbidden (this instance) and FIXED + absent is forbidden (covered by the close/settlement difficulty recipes implicitly); this corner pins the INDEXED-with-price direction."
        test_recipe:
          setup: ["Default logical clock. One mill."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Confused Terms Inc", grade_category: "HMS", contract_type: "INDEXED", contract_price_cents: 37000, committed_tons: 50 }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_CONTRACT_PRICE_FORBIDDEN"
            - "GET /mills/${mill_id}/procurement-contracts returns 0 rows"

      - name: scrap_lot_moisture_boundary_and_dry_tons
        claim_type: Type Constraints
        grounds:
          - entities.ScrapLot.fields.moisture_pct
          - entities.ScrapLot.fields.dry_tons
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "moisture_pct == 0.30 is accepted (inclusive upper bound) and dry_tons = 10 * (1 - 0.30) = 7.0; moisture_pct == 0.31 is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Default logical clock. One mill with one FIXED contract."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 10, moisture_pct: 0.30, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_ok: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-04", tons_received: 10, moisture_pct: 0.31, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the 0.30 lot is created (201): ScrapLot.${lot_ok}.dry_tons == 7.0 and remaining_tons == 7.0"
            - "the 0.31 lot rejects: err == ERR_INVALID_REQUEST"

      - name: grade_mn_max_below_mn_min_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Grade.fields.mn_max_pct
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "The cross-field constraint mn_max_pct >= mn_min_pct is enforced at creation with 400, not silently clamped."
        test_recipe:
          setup: ["Default logical clock. One mill."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "BAD-BAND", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.010, mn_max_pct: 0.005, requires_energy_certified: false }
              as: Metallurgist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

      - name: heat_create_target_weight_above_furnace_capacity_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Heat.fields.target_tap_weight_tons
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "target_tap_weight_tons > Mill.furnace_capacity_tons (150) is a 400 range violation, checked against the parent mill — not a 409 capacity state error."
        test_recipe:
          setup: ["Default logical clock. One mill (capacity 150) with one grade."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-FAT", grade_id: "${grade_id}", target_tap_weight_tons: 151, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"

      - name: meltdown_sheet_create_system_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.MeltdownSheet.fields.revision_no
          - entities.MeltdownSheet.fields.status
        distinguishing_aspect: "revision_no and status are system/computed: a create body smuggling revision_no 99 and status CONFIRMED has those undeclared keys ignored — the sheet is created RECORDED with revision_no 1 and the smuggled CONFIRMED does not cascade to the heat."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot, grade, heat CHARGED (one charge line)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-SMUGGLE", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets"
              payload: { cu_pct: 0.002, mn_pct: 0.006, revision_no: 99, status: "CONFIRMED" }
              as: Metallurgist
              captures: { sheet_id: $.data.id }
          assert:
            - "the response status is 201"
            - "MeltdownSheet.${sheet_id}.revision_no == 1"
            - "MeltdownSheet.${sheet_id}.status == RECORDED"
            - "Heat.${heat_id}.status is still CHARGED (the smuggled CONFIRMED did not cascade)"

      - name: energy_interval_computed_posture_snapshot_and_kwh_accumulation
        claim_type: Computed Fields
        grounds:
          - entities.EnergyInterval.fields.posture_at_interval
          - entities.Heat.fields.energy_kwh
          - endpoints.POST_/mills/{millId}/heats/{heatId}/energy-intervals
        distinguishing_aspect: "Recording two intervals (one before, one after an event activates) stamps posture_at_interval NORMAL then INTERRUPTED on identical request shapes, and heat.energy_kwh accumulates 500 + 300 = 800."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot, grade, heat CHARGED."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-METER", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/energy-intervals"
              payload: { interval_start: "2026-09-09T10:00:00Z", interval_end: "2026-09-09T11:00:00Z", kwh: 500 }
              as: MillOperator
              captures: { iv_normal: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-09T12:00:00Z", released_at: "2026-09-09T14:00:00Z" }
              as: EnergyDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events/${ev_id}/activate"
              payload: {}
              as: EnergyDispatcher
            - call: "POST /mills/${mill_id}/power-waivers"
              payload: { scope: "HEAT", scope_id: "${heat_id}", reason: "metering continuity test" }
              as: EnergyDispatcher
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/energy-intervals"
              payload: { interval_start: "2026-09-09T12:30:00Z", interval_end: "2026-09-09T13:00:00Z", kwh: 300 }
              as: EnergyDispatcher
              captures: { iv_interrupted: $.data.id }
          assert:
            - "EnergyInterval.${iv_normal}.posture_at_interval == NORMAL"
            - "EnergyInterval.${iv_interrupted}.posture_at_interval == INTERRUPTED (snapshot at record time)"
            - "Heat.${heat_id}.energy_kwh == 800"

      - name: flat_topology_body_fk_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/mills/{millId}/heats
          - errors.ERR_GRADE_NOT_FOUND
        distinguishing_aspect: "Heat creation carries grade_id in the body (flat reference under a hierarchical path): an unknown grade_id with an otherwise valid payload produces 404 ERR_GRADE_NOT_FOUND, not 400."
        test_recipe:
          setup: ["Default logical clock. One mill, no grades."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
          trigger:
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-NOGRADE", grade_id: "00000000-0000-4000-8000-000000000001", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_GRADE_NOT_FOUND"

      - name: meltdown_sheet_immutable_after_confirm_has_no_update_path
        claim_type: Immutability
        grounds:
          - state_machines.MeltdownSheet
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A CONFIRMED sheet is terminal: a revise attempt against it is a 409 ERR_INVALID_STATE (the cyclic loop closes at confirmation), and no PUT/PATCH endpoint exists for sheets."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot, grade, heat CHARGED, sheet created and confirmed (heat MELTDOWN_LOCKED)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-LOCK", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets"
              payload: { cu_pct: 0.002, mn_pct: 0.006 }
              as: Metallurgist
              captures: { sheet_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/confirm"
              payload: {}
              as: Metallurgist
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/meltdown-sheets/${sheet_id}/revise"
              payload: { cu_pct: 0.001, mn_pct: 0.005 }
              as: Metallurgist
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "MeltdownSheet.${sheet_id}.revision_no is still 1 and status is still CONFIRMED"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: heat_invalid_transition_cast_from_charged_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Heat
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/mills/{millId}/heats/{heatId}/cast
        distinguishing_aspect: "CAST is only reachable from TAPPED: casting a CHARGED heat (meltdown never confirmed, never tapped) is a 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot, grade, heat CHARGED (one 8t line)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 20, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-EARLY", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_id}", tons: 8 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/cast"
              payload: {}
              as: MillOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "Heat.${heat_id}.status is still CHARGED"
            - "ScrapLot.${lot_id}.remaining_tons is still 12 (no compensating release on a rejected cast)"

      - name: contract_terminal_close_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ProcurementContract
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A CLOSED contract is terminal: a second close returns 409 ERR_INVALID_STATE and settlement fields do not change."
        test_recipe:
          setup: ["Default logical clock. Mill; FIXED contract committed 10t with one 10t dry lot; contract CLOSED."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 10 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
