              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { u1_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true, unit_type: "UNIT", unit_id: "3C", parent_address_point_id: "${base_id}" }
