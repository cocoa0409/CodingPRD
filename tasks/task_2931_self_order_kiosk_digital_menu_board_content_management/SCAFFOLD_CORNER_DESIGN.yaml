      - name: the_price_workflow_verbs_are_partitioned_between_analyst_and_approver
        claim_type: approval_chain
        grounds:
          - roles.PricingAnalyst.exclusive_operations
          - roles.PricingApprover.exclusive_operations
          - state_machines.PriceChangeRequest
          - errors.ERR_UNAUTHORIZED_ROLE
        distinguishing_aspect: "Verb-level RBAC inside a single action endpoint: the analyst owns SUBMIT/APPLY/WITHDRAW and the approver owns APPROVE/REJECT/REQUEST_CHANGES/ROLLBACK, so each role is refused on the other's verb at the very same URL where its own verb succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A used by store S001 (so priority 32 is satisfied); Item A at 500 cents."
            - "A PriceChangeRequest for Item A in ZONE_A proposing 559 -> 569 (uplift 179 bp, one approval required) is created by u_analyst_1 and moved to PENDING_APPROVAL."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_ZONE", tier: "REGION" }
              as: ContentManager
              captures: { zone_cluster_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${zone_cluster_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { zone_store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id, item_ver: $.data.version }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 569, effective_from_utc: "2026-08-10T00:00:00Z", justification: "Commodity cost increase", expected_menu_item_version: "${item_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id, req_approvals: $.data.required_approvals }
          trigger:
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingApprover
              as_user_id: "u_approver_1"
              captures: { submit_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { state_after_submit: $.data.state }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingAnalyst
              as_user_id: "u_analyst_2"
              captures: { approve_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE" }
              as: PricingApprover
              as_user_id: "u_approver_1"
              captures: { state_after_approve: $.data.state }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPLY" }
              as: PricingApprover
              as_user_id: "u_approver_1"
              captures: { apply_denied_err: $.data.error_id }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPLY" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { state_after_apply: $.data.state, applied_price: $.data.applied_price_cents }
          assert:
            - "${req_approvals} == 1: the uplift is measured against the zone board price, so (569 - 559) x 10000 / 559 = 178.9 rounds to 179 bp, below DUAL_APPROVAL_UPLIFT_BP 500"
            - "${submit_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 — SUBMIT is the analyst's verb"
            - "${state_after_submit} == PENDING_APPROVAL"
            - "${approve_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 even though u_analyst_2 is a different user from the requester — the role gate at priority 2 fires before the self-approval check at priority 17"
            - "${state_after_approve} == APPROVED"
            - "${apply_denied_err} == ERR_UNAUTHORIZED_ROLE with HTTP 403 — APPLY is the analyst's verb, so the approver cannot push its own approval into effect"
            - "${state_after_apply} == APPLIED with ${applied_price} == 569"

      - name: two_distinct_approvers_satisfy_the_dual_tier_but_the_requester_never_can
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - errors.ERR_SELF_APPROVAL_FORBIDDEN
          - validations.priority_17_ERR_SELF_APPROVAL_FORBIDDEN
          - entities.PriceChangeRequest.fields.approval_user_ids
          - calculations.price_uplift_and_approval_tier
        distinguishing_aspect: "Segregation of duties is enforced by X-User-ID, not by role: a request needing two approvals collects one from u_approver_1, refuses the requester wearing the approver role with ERR_SELF_APPROVAL_FORBIDDEN (403), and only reaches APPROVED once a second distinct approver signs."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A used by store S001; Item A at 500 cents so the board price is 559."
