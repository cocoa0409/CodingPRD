  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_slot_halfopen_overlap_within_event
        grounds:
          - validations[priority=11]
          - entities.Appointment.fields.slot_start_min
          - entities.Appointment.fields.slot_duration_min
        distinguishing_aspect: "Interval semantics: minute-level half-open intervals [start, start+duration) on the ScreeningEvent resource — an appointment [560,590) blocks [580,610) (shared interior minute) but touching at a point [590,620) is allowed; adjacency is permitted, interior overlap is rejected with ERR_SLOT_OVERLAP."
        test_recipe:
          setup:
            - "One PUBLISHED blood-panel event with one existing appointment on slot [560,590) (duration 30)."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /participants", payload: { full_name: "P2", date_of_birth: "1981-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p2: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager }
          trigger:
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p2}", slot_start_min: 580, slot_duration_min: 30 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_SLOT_OVERLAP"
            - "HTTP status == 409"

      - name: mobile_unit_whole_day_exclusive_conflict_at_publish
        grounds:
          - validations[priority=14]
          - state_machines.ScreeningEvent.DRAFT_to_PUBLISHED
          - entities.ScreeningEvent.fields.event_date
        distinguishing_aspect: "Interval semantics differ: MobileUnit occupies a whole calendar day exclusively (day-granularity, no minute intervals) — publishing a second event for the same mobile_unit_id on the same event_date returns ERR_UNIT_DAY_CONFLICT, a coarser day-block geometry on a different resource than the minute-level appointment overlap."
        test_recipe:
          setup:
            - "One PUBLISHED blood-panel event on unit U for event_date 2026-06-11; a second DRAFT event on the same unit U and the same date awaits publish."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "AM", event_date: "2026-06-11", window_start_min: 540, window_end_min: 660 }, as: ProgramManager, captures: { e1: $.data.id, e1v: $.data.version } }
            - { call: "POST /screening-events/${e1}/publish", payload: { expected_event_version: "${e1v}" }, as: ProgramManager }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "PM", event_date: "2026-06-11", window_start_min: 660, window_end_min: 780 }, as: ProgramManager, captures: { e2: $.data.id, e2v: $.data.version } }
          trigger:
            - { call: "POST /screening-events/${e2}/publish", payload: { expected_event_version: "${e2v}" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_UNIT_DAY_CONFLICT"
            - "ScreeningEvent.${e2}.status == DRAFT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_committed_conservation_on_void
        grounds:
          - state_machines.Charge.DRAFT_to_VOID
          - state_machines.Appointment.CHECKED_IN_to_SCREENED
          - entities.Grant.fields.committed_cents
          - entities.Grant.fields.remaining_cents
        distinguishing_aspect: "Conserved quantity = grant cents: screening a GRANT charge debits Grant.committed_cents by grant_covered_cents (0->8000); voiding that charge is the compensating action restoring committed_cents to 0. Invariant: total_budget_cents == remaining_cents + committed_cents holds before (10000==10000+0) and after (10000==10000+0)."
        test_recipe:
          setup:
            - "GRANT sponsor + Grant budget 10000; one GRANT participant screened (DRAFT Charge grant_covered_cents=8000, committed_cents=8000, remaining_cents=2000)."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Phleb P", role_type: "PHLEBOTOMIST", modality: "BLOOD_PANEL" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "GrantBody", sponsor_type: "GRANT", viewer_user_id: "sv2" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /grants", payload: { sponsor_id: "${sponsor_id}", name: "Fund", total_budget_cents: 10000 }, as: ProgramManager, captures: { grant_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L2", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat G", date_of_birth: "1975-01-01", pay_type: "GRANT", grant_id: "${grant_id}" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "GET /charges?appointment_id=${appt_id}", payload: {}, as: BillingClerk, captures: { charge_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /charges/${charge_id}/void", payload: {}, as: BillingClerk }
            - { call: "GET /grants/${grant_id}", payload: {}, as: BillingClerk, captures: { committed_after: $.data.committed_cents, remaining_after: $.data.remaining_cents } }
          assert:
            - "Grant.${grant_id}.committed_cents == 0"
            - "Grant.${grant_id}.remaining_cents == 10000"
            - "Charge.${charge_id}.status == VOID"

      - name: event_booked_count_conservation_on_appointment_cancel
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - endpoints.POST./appointments
          - entities.ScreeningEvent.fields.booked_count
        distinguishing_aspect: "Conserved quantity = booked slot count (different from grant cents): booking an appointment increments ScreeningEvent.booked_count 0->1; cancelling that SCHEDULED appointment is the compensating action returning booked_count to 0. Invariant: booked_count equals the number of non-cancelled/non-no-show appointments at all times."
        test_recipe:
          setup:
            - "One PUBLISHED blood-panel event (capacity 10) with one SCHEDULED appointment; booked_count=1."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
          trigger:
            - { call: "POST /appointments/${appt_id}/cancel", payload: {}, as: ProgramManager }
            - { call: "GET /screening-events/${event_id}", payload: {}, as: ProgramManager, captures: { booked_after: $.data.booked_count } }
          assert:
            - "ScreeningEvent.${event_id}.booked_count == 0"
            - "Appointment.${appt_id}.status == CANCELLED"
