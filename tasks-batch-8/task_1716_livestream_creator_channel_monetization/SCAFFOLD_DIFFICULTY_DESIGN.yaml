  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: payout_threshold_exact_boundary
        grounds:
          - "calculations.payout_threshold_gate"
          - "errors[ERR_BELOW_PAYOUT_THRESHOLD]"
        distinguishing_aspect: |
          Money-metric boundary on POST /api/channels/{id}/payouts: payable exactly == threshold
          (50000) is ELIGIBLE (inclusive >=), payable 49999 is rejected — one cent below the
          inclusive boundary flips the outcome.
        test_recipe:
          setup:
            - "Channel A (threshold 50000): SUBSCRIPTION 50000@4000 (net 30000) + AD_SHARE 20000@0 (net 20000) cleared -> payable exactly 50000"
            - "Channel B (threshold 50000): SUBSCRIPTION 50000@4000 (net 30000) + AD_SHARE 19999@0 (net 19999) cleared -> payable 49999"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "bp_a", display_name: "BP A", home_platform: "TWITCH", payout_threshold_cents: 50000 }
              as: PlatformAdmin
              captures: { cha_id: $.data.id, cha_v: $.data.version }
            - call: "POST /api/channels/${cha_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "BP A LLC", tax_id_last4: "0001", expected_channel_version: "${cha_v}" }
              as: Creator
              as_user_id: "${cha_id}"
              captures: { tfa_id: $.data.id }
            - call: "POST /api/tax-forms/${tfa_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/channels"
              payload: { handle: "bp_b", display_name: "BP B", home_platform: "YOUTUBE", payout_threshold_cents: 50000 }
              as: PlatformAdmin
              captures: { chb_id: $.data.id, chb_v: $.data.version }
            - call: "POST /api/channels/${chb_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "BP B LLC", tax_id_last4: "0002", expected_channel_version: "${chb_v}" }
              as: Creator
              as_user_id: "${chb_id}"
              captures: { tfb_id: $.data.id }
            - call: "POST /api/tax-forms/${tfb_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${cha_id}/revenue-events"
              payload: { kind: "SUBSCRIPTION", gross_cents: 50000, platform_fee_bps: 4000, occurred_at: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${cha_id}/revenue-events"
              payload: { kind: "AD_SHARE", gross_cents: 20000, platform_fee_bps: 0, occurred_at: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${chb_id}/revenue-events"
              payload: { kind: "SUBSCRIPTION", gross_cents: 50000, platform_fee_bps: 4000, occurred_at: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${chb_id}/revenue-events"
              payload: { kind: "AD_SHARE", gross_cents: 19999, platform_fee_bps: 0, occurred_at: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${cha_id}/payouts"
              as: Creator
              as_user_id: "${cha_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /api/channels/${chb_id}/payouts"
              as: Creator
              as_user_id: "${chb_id}"
              captures: { errb: $.data.error_id }
          assert:
            - "Channel A (payable == 50000 == threshold): payout opens, Payout.${pa_id}.payout_status == SCHEDULED (inclusive >= boundary)"
            - "Channel B (payable == 49999 == threshold - 1): errb == ERR_BELOW_PAYOUT_THRESHOLD, no payout created"

      - name: strike_weight_suspension_boundary
        grounds:
          - "calculations.strike_weight"
          - "errors[ERR_CHANNEL_SUSPENDED]"
        distinguishing_aspect: |
          Strike-weight metric boundary on POST /api/channels/{id}/strikes: weight 2 leaves the
          channel RESTRICTED; adding exactly one more weight point to reach 3.0 flips posture to
          SUSPENDED (inclusive >= SUSPENSION_WEIGHT) — different metric (strike weight vs money)
          and different endpoint than payout_threshold_exact_boundary.
        test_recipe:
          setup:
            - "Channel STANDARD (W9 verified); no strikes"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "bp_strike", display_name: "BP Strike", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "BP Strike LLC", tax_id_last4: "0003", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${ch_id}/strikes"
              payload: { policy_code: "SPAM", severity: "MAJOR", evidence_ref: "clip://20" }
              as: TrustAgent
              as_user_id: "trust_nina"
              captures: { st1: $.data.id }
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { posture2: $.data.monetization_posture, trust2: $.data.trust_score_bp }
            - call: "POST /api/channels/${ch_id}/strikes"
              payload: { policy_code: "COPYRIGHT", severity: "MINOR", evidence_ref: "clip://21" }
              as: TrustAgent
              as_user_id: "trust_nina"
              captures: { st2: $.data.id }
            - call: "GET /api/channels/${ch_id}"
              as: PlatformAdmin
              captures: { posture3: $.data.monetization_posture, trust3: $.data.trust_score_bp }
          assert:
            - "After MAJOR alone (weight 2 < 3): posture2 == RESTRICTED, trust2 == 5000"
            - "After MAJOR+MINOR (weight exactly 3 >= 3): posture3 == SUSPENDED, trust3 == 2500"
            - "Channel.active_strike_count == 2"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payout_open_requires_verified_tax_form
        grounds:
          - "validations[priority=24]"
          - "state_machines.TaxForm"
          - "state_machines.Payout"
        distinguishing_aspect: |
          Entity pair Payout->TaxForm: payout opening is gated on the channel's CURRENT tax form
          being VERIFIED; a merely-SUBMITTED form blocks with ERR_TAX_FORM_NOT_VERIFIED until
          TrustAgent verification flips the dependency.
        test_recipe:
          setup:
            - "Channel with tax form SUBMITTED but not yet verified; TIP 100000@0bps cleared (payable 100000 >= default threshold 10000)"
          setup_api_calls:
            - call: "POST /api/channels"
              payload: { handle: "ce_tax", display_name: "CE Tax", home_platform: "TWITCH" }
              as: PlatformAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /api/channels/${ch_id}/tax-forms"
              payload: { form_type: "W9", legal_name: "CE Tax LLC", tax_id_last4: "0004", expected_channel_version: "${ch_v}" }
              as: Creator
              as_user_id: "${ch_id}"
              captures: { tf_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 100000, platform_fee_bps: 0, occurred_at: "2026-08-03T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
          trigger:
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/tax-forms/${tf_id}/transition"
              payload: { action: "VERIFY" }
              as: TrustAgent
            - call: "POST /api/channels/${ch_id}/payouts"
              as: Creator
              as_user_id: "${ch_id}"
              captures: { p_id: $.data.id }
          assert:
            - "First open rejected: err == ERR_TAX_FORM_NOT_VERIFIED (HTTP 402) while form SUBMITTED"
            - "After VERIFY: open succeeds, Payout.${p_id}.payout_status == SCHEDULED"

      - name: deliverable_perform_requires_ended_stream
        grounds: [state_machines.Deliverable.SCHEDULED_to_PERFORMED, state_machines.StreamSession]
        distinguishing_aspect: |
          Entity pair Deliverable->StreamSession: PERFORM is rejected while the referenced stream
          is LIVE and succeeds only after the stream reaches ENDED — a different entity pair than
          Payout->TaxForm.
        test_recipe:
          setup:
            - "Channel STANDARD (W9 verified); deal ACTIVE; deliverable due 2026-08-20; stream scheduled 2026-08-15 10:00-11:00 and STARTed at 10:00 (LIVE, not ENDED); clock 2026-08-15T10:30:00Z"
