              captures: { bb_status: $.data.production_status }
          assert:
            - "${e_overlap} == ERR_SLICER_WINDOW_CONFLICT, and no sanitation precondition outranked it because validation priority 13 precedes priority 14"
            - "SlicerAsset.${c8}.sanitation_status == CLEAN after the allergen changeover and SlicerAsset.${c8}.cuts_since_sanitation == 0, so the slicer's interval was vacated rather than extended"
            - "${bb_status} == IN_PRODUCTION, so the identical start that was rejected 11 minutes earlier now succeeds purely because the covering interval was released"
            - the rejection is charged against BA's batch interval while the acceptance follows the sanitizing cycle's exclusive end, so the two artifacts use different half-open windows on the same slicer

