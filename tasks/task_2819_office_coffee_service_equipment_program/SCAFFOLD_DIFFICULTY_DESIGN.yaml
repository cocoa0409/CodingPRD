      - name: credit_target_mismatch_beats_credit_amount_overflow
        grounds:
          - validations[priority=34]
          - validations[priority=46]
          - errors[ERR_CREDIT_TARGET_MISMATCH]
          - errors[ERR_CREDIT_EXCEEDS_INVOICE_TOTAL]
          - entities.InvoiceLine.fields.target_line_id
        distinguishing_aspect: |
          Pair `business_referential` (priority 34) vs `business_fiscal` (priority 46) - a third
          distinct category pair: crediting invoice 2 with a target_line_id that belongs to invoice 1
          AND an amount_cents of 99999999 (far above invoice 2's 11500 total) returns
          ERR_CREDIT_TARGET_MISMATCH (422), never ERR_CREDIT_EXCEEDS_INVOICE_TOTAL (422).
