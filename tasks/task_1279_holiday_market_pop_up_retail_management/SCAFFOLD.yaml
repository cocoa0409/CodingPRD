scenario: |
  Holiday Market & Pop-Up Retail Management (downtown holiday market): vendor application, jury & category balance, booth/chalet assignment & fee tiers, temporary structure permit & utility hookup, shared POS/cashless option & settlement, marketing/foot-traffic programming & entertainment, load-in/load-out schedule & storage, weather contingency & heating, day-of-sales reporting & vendor renewal

domain_name: holiday-market
api_prefix: /markets

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market display name" }
      - { name: season_code, type: string, source: input, description: "e.g. WINTER-2026; unique per market" }
      - { name: opens_at, type: datetime, source: input, description: "Public opening instant (UTC)" }
      - { name: closes_at, type: datetime, source: input, description: "Public closing instant (UTC); strictly after opens_at" }
      - { name: application_opens_at, type: datetime, source: input, description: "When vendor applications open" }
      - { name: application_closes_at, type: datetime, source: input, description: "When vendor applications close" }
      - { name: jury_quorum, type: integer, source: input, default: 3, description: "Minimum number of jury scores required before an application can be decided" }
      - { name: category_caps, type: object, source: input, description: "Map of category code (FOOD_BEVERAGE | CRAFT | APPAREL | HOME_GOODS | EXPERIENCE) to maximum accepted vendor count" }
      - { name: chalet_count, type: integer, source: input, description: "Total premium chalet booths available" }
      - { name: standard_booth_count, type: integer, source: input, description: "Total standard booth slots available" }
      - { name: shared_pos_enabled, type: boolean, source: input, default: true, description: "Whether the market offers shared POS/cashless service" }
      - { name: shared_pos_fee_bps, type: integer, source: input, default: 250, description: "Shared-POS fee in basis points of gross card sales (250 = 2.50%)" }
      - { name: weather_alert_threshold_wind_mph, type: integer, source: input, default: 35, description: "Wind speed (mph) at or above which posture flips to WEATHER_ALERT" }
      - { name: posture, type: enum, source: computed, description: "SETUP | OPEN | WEATHER_ALERT | CLOSED_SEASON | CANCELLED — derived aggregate; gates all child operations" }
      - { name: total_accepted_vendors, type: integer, source: computed, default: 0, description: "Count of VendorApplications in ACCEPTED state" }
      - { name: total_booths_committed, type: integer, source: computed, default: 0, description: "Count of BoothAssignments in ACTIVE state" }
      - { name: run_ops_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops checkpoint" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor business legal name" }
      - { name: contact_email, type: string, source: input, description: "Vendor primary contact email; unique" }
      - { name: category, type: enum, source: input, description: "FOOD_BEVERAGE | CRAFT | APPAREL | HOME_GOODS | EXPERIENCE" }
      - { name: status, type: enum, source: system, default: "PROSPECT", description: "PROSPECT → APPROVED → SUSPENDED / WITHDRAWN" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Lifetime no-show strikes across all markets" }
      - { name: lifetime_gross_sales_cents, type: integer, source: computed, default: 0, description: "Cumulative gross sales across all settled markets" }
      - { name: renewal_score, type: number, source: computed, default: 0, description: "Composite renewal priority score; higher = better" }

  - name: VendorApplication
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id; owning market" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; applying vendor" }
      - { name: requested_booth_type, type: enum, source: input, description: "STANDARD | CHALET" }
      - { name: requested_pos, type: boolean, source: input, default: false, description: "Whether vendor requests shared POS service" }
      - { name: heating_requested, type: boolean, source: input, default: false, description: "Whether vendor requests heating at booth (CHALET only)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → SUBMITTED → UNDER_JURY → ACCEPTED / REJECTED / WAITLISTED / WITHDRAWN" }
      - { name: jury_scores, type: array, source: system, description: "List of {juror_id, score_0_100} objects; append-only via POST score" }
      - { name: jury_average, type: number, source: computed, description: "Mean of jury_scores scores; null until at least one score" }
      - { name: decided_at, type: datetime, source: system, description: "When ACCEPTED/REJECTED/WAITLISTED was decided" }

  - name: Booth
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id; owning market" }
      - { name: booth_code, type: string, source: input, description: "Human-readable code, e.g. CH-01 / STD-A12; unique per market" }
      - { name: booth_type, type: enum, source: input, description: "STANDARD | CHALET" }
      - { name: zone, type: enum, source: input, description: "NORTH | SOUTH | EAST | WEST" }
      - { name: square_feet, type: integer, source: input, description: "Booth footprint" }
      - { name: has_power, type: boolean, source: input, default: false, description: "Whether the booth supports a utility hookup" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | RESERVED | OCCUPIED | OFFLINE" }

  - name: BoothAssignment
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id; owning market" }
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id" }
      - { name: application_id, type: string, source: input, description: "FK -> VendorApplication.id" }
      - { name: base_rent_cents, type: integer, source: computed, description: "Computed at assignment; depends on booth_type × zone × season tier" }
      - { name: heating_surcharge_cents, type: integer, source: computed, default: 0, description: "Non-zero only when application.heating_requested AND booth_type=CHALET" }
      - { name: total_fee_cents, type: integer, source: computed, description: "= base_rent_cents + heating_surcharge_cents" }
      - { name: status, type: enum, source: system, default: "PENDING_PAYMENT", description: "PENDING_PAYMENT → ACTIVE → RELEASED / FORFEITED" }

  - name: Permit
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id; the booth assignment this permit covers" }
      - { name: permit_type, type: enum, source: input, description: "TEMP_STRUCTURE | FOOD_SERVICE | PROPANE_HEAT | GENERATOR" }
      - { name: issued_by, type: string, source: input, description: "Issuing authority identifier (e.g. city fire dept)" }
      - { name: issued_at, type: datetime, source: input, description: "Issue timestamp" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry timestamp; strictly after issued_at" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE → EXPIRED | REVOKED" }

  - name: UtilityHookup
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: booth_id, type: string, source: input, description: "FK -> Booth.id" }
      - { name: hookup_type, type: enum, source: input, description: "ELECTRIC_15A | ELECTRIC_30A | WATER | PROPANE" }
      - { name: amps_drawn, type: integer, source: computed, default: 0, description: "Live amp draw as last reported by metering; only meaningful for ELECTRIC_*" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED → INSTALLED → ENERGIZED → DECOMMISSIONED" }

  - name: PosDevice
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id; the booth this device is provisioned to" }
      - { name: device_code, type: string, source: input, description: "POS device identifier; unique per market" }
      - { name: status, type: enum, source: system, default: "PROVISIONED", description: "PROVISIONED → ACTIVE → SUSPENDED | RETURNED" }

  - name: SalesSettlement
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id" }
      - { name: business_date, type: string, source: input, description: "ISO-8601 calendar date (YYYY-MM-DD) the sales belong to" }
      - { name: gross_card_cents, type: integer, source: input, description: "Card/cashless sales total for the date" }
      - { name: gross_cash_cents, type: integer, source: input, description: "Cash sales total for the date" }
      - { name: pos_fee_cents, type: integer, source: computed, description: "= floor(gross_card_cents * market.shared_pos_fee_bps / 10000) when shared-POS enabled AND a PosDevice is ACTIVE; else 0" }
      - { name: refund_cents, type: integer, source: input, default: 0, description: "Same-day refund total" }
      - { name: net_payable_cents, type: integer, source: computed, description: "= gross_card_cents + gross_cash_cents - refund_cents - pos_fee_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → SUBMITTED → RECONCILED → PAID / DISPUTED" }

  - name: ProgrammingSlot
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: title, type: string, source: input, description: "Entertainment / programming title" }
      - { name: slot_kind, type: enum, source: input, description: "MUSIC | DEMO | SANTA_PHOTOS | WORKSHOP | PARADE" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (UTC); strictly after starts_at" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; sponsoring/participating vendor (nullable)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED → LIVE → COMPLETED / CANCELLED" }

  - name: LoadSlot
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id" }
      - { name: direction, type: enum, source: input, description: "LOAD_IN | LOAD_OUT" }
      - { name: starts_at, type: datetime, source: input, description: "Load window start (UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Load window end (UTC); strictly after starts_at" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED → CHECKED_IN → COMPLETED / NO_SHOW" }

  - name: WeatherEvent
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id" }
      - { name: observed_at, type: datetime, source: input, description: "UTC instant of the weather observation" }
      - { name: wind_mph, type: integer, source: input, description: "Sustained wind speed (mph)" }
      - { name: temp_f, type: integer, source: input, description: "Ambient temperature (°F)" }
      - { name: precipitation, type: enum, source: input, description: "NONE | RAIN | SNOW | ICE" }
      - { name: source, type: enum, source: input, description: "NWS | ON_SITE_SENSOR | OPERATOR" }
      - { name: triggers_alert, type: boolean, source: computed, description: "true iff wind_mph >= market.weather_alert_threshold_wind_mph OR precipitation == ICE" }

  - name: RenewalOffer
    parent: Market
    common_fields: true
    fields:
      - { name: market_id, type: string, source: system, description: "FK -> Market.id; the NEXT season's market this offer belongs to" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; the vendor receiving the offer" }
      - { name: prior_assignment_id, type: string, source: input, description: "FK -> BoothAssignment.id; prior-season assignment justifying the offer" }
      - { name: offered_booth_id, type: string, source: input, description: "FK -> Booth.id; the booth held for this offer" }
      - { name: offer_expires_at, type: datetime, source: input, description: "Deadline for the vendor to accept" }
      - { name: discount_pct, type: integer, source: computed, description: "Renewal discount percentage derived from vendor.renewal_score band" }
      - { name: status, type: enum, source: system, default: "EXTENDED", description: "EXTENDED → ACCEPTED | DECLINED | EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Market
    initial_state: SETUP
    terminal_states: [CANCELLED, CLOSED_SEASON]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /markets/{marketId}/open_market"
        actor: MarketOperator
        preconditions:
          - "current_utc >= market.opens_at - 7 days"
          - "at least one BoothAssignment in ACTIVE state"
          - "no WeatherEvent in past 6 hours with triggers_alert=true"
        side_effects:
          - "posture ← OPEN"
          - "increments Market.version by 1"

      - from: OPEN
        to: WEATHER_ALERT
        trigger: "system (automatic when a new WeatherEvent has triggers_alert=true)"
        actor: system
        preconditions: []
        side_effects:
          - "posture ← WEATHER_ALERT"
          - "all ACTIVE PosDevice on the market → SUSPENDED"
          - "increments Market.version by 1"

      - from: WEATHER_ALERT
        to: OPEN
        trigger: "POST /markets/{marketId}/clear_weather_alert"
        actor: MarketOperator
        preconditions:
          - "no WeatherEvent in past 6 hours with triggers_alert=true"
        side_effects:
          - "posture ← OPEN"
          - "SUSPENDED PosDevice on the market → ACTIVE"
          - "increments Market.version by 1"

      - from: OPEN
        to: CLOSED_SEASON
        trigger: "system (automatic during run_ops when current_utc >= market.closes_at)"
        actor: system
        preconditions: []
        side_effects:
          - "posture ← CLOSED_SEASON"
          - "every BoothAssignment in ACTIVE → RELEASED; booth.status → AVAILABLE"
          - "every ACTIVE PosDevice → RETURNED"
          - "every SUBMITTED SalesSettlement → RECONCILED"
          - "increments Market.version by 1"

      - from: SETUP
        to: CANCELLED
        trigger: "POST /markets/{marketId}/cancel"
        actor: MarketOperator
        preconditions:
          - "posture == SETUP"
        side_effects:
          - "all VendorApplication in {DRAFT, SUBMITTED, UNDER_JURY, WAITLISTED} → WITHDRAWN"
          - "all BoothAssignment in {PENDING_PAYMENT, ACTIVE} → FORFEITED"
          - "increments Market.version by 1"

  - entity: VendorApplication
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /markets/{marketId}/applications/{applicationId}/submit"
        actor: VendorRole
        preconditions:
          - "market.posture == SETUP"
          - "current_utc BETWEEN market.application_opens_at AND market.application_closes_at"
        side_effects: []

      - from: SUBMITTED
        to: UNDER_JURY
        trigger: "POST /markets/{marketId}/applications/{applicationId}/score (first score)"
        actor: JuryMember
        preconditions:
          - "market.posture == SETUP"
        side_effects:
          - "append {juror_id, score_0_100} to jury_scores"
          - "jury_average recomputed"

      - from: UNDER_JURY
        to: UNDER_JURY
        trigger: "POST /markets/{marketId}/applications/{applicationId}/score (subsequent score)"
        actor: JuryMember
        preconditions:
          - "len(jury_scores) < 5"
          - "scoring juror has not already scored this application"
        side_effects:
          - "append score; jury_average recomputed"

      - from: UNDER_JURY
        to: ACCEPTED
        trigger: "POST /markets/{marketId}/applications/{applicationId}/decide"
        actor: JuryChair
        preconditions:
          - "len(jury_scores) >= market.jury_quorum"
          - "vendor.category's accepted count < market.category_caps[vendor.category]"
          - "jury_average >= 60"
        side_effects:
          - "Market.total_accepted_vendors += 1"
          - "vendor.status: PROSPECT → APPROVED (if currently PROSPECT)"
          - "decided_at = current_utc"

      - from: UNDER_JURY
        to: REJECTED
        trigger: "POST /markets/{marketId}/applications/{applicationId}/decide"
        actor: JuryChair
        preconditions:
          - "len(jury_scores) >= market.jury_quorum"
          - "jury_average < 60"
        side_effects:
          - "decided_at = current_utc"

      - from: UNDER_JURY
        to: WAITLISTED
        trigger: "POST /markets/{marketId}/applications/{applicationId}/decide"
        actor: JuryChair
        preconditions:
          - "len(jury_scores) >= market.jury_quorum"
          - "jury_average >= 60"
          - "vendor.category's accepted count >= market.category_caps[vendor.category]"
        side_effects:
          - "decided_at = current_utc"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /markets/{marketId}/applications/{applicationId}/withdraw"
        actor: VendorRole
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /markets/{marketId}/applications/{applicationId}/withdraw"
        actor: VendorRole
        preconditions: []
        side_effects: []

  - entity: BoothAssignment
    initial_state: PENDING_PAYMENT
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /markets/{marketId}/assignments/{assignmentId}/activate"
        actor: MarketOperator
        preconditions:
          - "linked VendorApplication.status == ACCEPTED"
          - "no other ACTIVE BoothAssignment on the same Booth"
          - "market.posture ∈ {SETUP, OPEN}"
        side_effects:
          - "Booth.status → RESERVED (was AVAILABLE)"
          - "Market.total_booths_committed += 1"

      - from: ACTIVE
        to: RELEASED
        trigger: "system (during Market CLOSED_SEASON transition) OR POST /markets/{marketId}/assignments/{assignmentId}/release"
        actor: "system | MarketOperator"
        preconditions:
          - "if manual release: all SalesSettlement for this assignment in {RECONCILED, PAID}"
        side_effects:
          - "Booth.status → AVAILABLE"
          - "Market.total_booths_committed -= 1"

      - from: PENDING_PAYMENT
        to: FORFEITED
        trigger: "system (during run_ops: PENDING_PAYMENT for >= 3 ops runs)"
        actor: system
        preconditions: []
        side_effects:
          - "Booth.status → AVAILABLE"
          - "vendor.no_show_strikes += 1"

      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /markets/{marketId}/assignments/{assignmentId}/forfeit"
        actor: MarketOperator
        preconditions:
          - "reason must be one of {NO_SHOW, PERMIT_REVOKED, OPERATOR_EJECTION}"
        side_effects:
          - "Booth.status → AVAILABLE"
          - "Market.total_booths_committed -= 1"
          - "vendor.no_show_strikes += 1 (only when reason=NO_SHOW)"

  - entity: Permit
    initial_state: ACTIVE
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (during run_ops when current_utc >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "if permit_type == TEMP_STRUCTURE and BoothAssignment linked: assignment.status → FORFEITED (reason=PERMIT_REVOKED)"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /markets/{marketId}/permits/{permitId}/revoke"
        actor: MarketOperator
        preconditions: []
        side_effects:
          - "if permit_type == TEMP_STRUCTURE and BoothAssignment linked: assignment.status → FORFEITED (reason=PERMIT_REVOKED)"

  - entity: UtilityHookup
    initial_state: REQUESTED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REQUESTED
        to: INSTALLED
        trigger: "POST /markets/{marketId}/hookups/{hookupId}/install"
        actor: UtilityCrew
        preconditions:
          - "market.posture == SETUP"
          - "booth.has_power == true (for ELECTRIC_*)"
        side_effects: []

      - from: INSTALLED
        to: ENERGIZED
        trigger: "POST /markets/{marketId}/hookups/{hookupId}/energize"
        actor: UtilityCrew
        preconditions:
          - "market.posture ∈ {SETUP, OPEN}"
          - "for PROPANE: a PROPANE_HEAT Permit with status=ACTIVE exists for the same booth's ACTIVE assignment"
        side_effects: []

      - from: ENERGIZED
        to: DECOMMISSIONED
        trigger: "POST /markets/{marketId}/hookups/{hookupId}/decommission"
        actor: UtilityCrew
        preconditions:
          - "market.posture ∈ {WEATHER_ALERT, CLOSED_SEASON} OR assignment.status ∈ {RELEASED, FORFEITED}"
        side_effects: []

  - entity: PosDevice
    initial_state: PROVISIONED
    terminal_states: [RETURNED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /markets/{marketId}/pos_devices/{posDeviceId}/activate"
        actor: MarketOperator
        preconditions:
          - "linked BoothAssignment.status == ACTIVE"
          - "market.shared_pos_enabled == true"
          - "market.posture == OPEN"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (during Market WEATHER_ALERT transition) OR POST /markets/{marketId}/pos_devices/{posDeviceId}/suspend"
        actor: "system | MarketOperator"
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (during Market WEATHER_ALERT→OPEN transition) OR POST /markets/{marketId}/pos_devices/{posDeviceId}/activate"
        actor: "system | MarketOperator"
        preconditions:
          - "market.posture == OPEN"
        side_effects: []

      - from: ACTIVE
        to: RETURNED
        trigger: "POST /markets/{marketId}/pos_devices/{posDeviceId}/return_device"
        actor: MarketOperator
        preconditions:
          - "no DRAFT or SUBMITTED SalesSettlement for this assignment"
        side_effects: []

      - from: SUSPENDED
        to: RETURNED
        trigger: "POST /markets/{marketId}/pos_devices/{posDeviceId}/return_device"
        actor: MarketOperator
        preconditions:
          - "no DRAFT or SUBMITTED SalesSettlement for this assignment"
        side_effects: []

  - entity: SalesSettlement
    initial_state: DRAFT
    terminal_states: [PAID, DISPUTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /markets/{marketId}/settlements/{settlementId}/submit"
        actor: VendorRole
        preconditions:
          - "market.posture ∈ {OPEN, WEATHER_ALERT}"
          - "no other SUBMITTED SalesSettlement for same assignment_id and business_date"
        side_effects:
          - "Vendor.lifetime_gross_sales_cents += (gross_card_cents + gross_cash_cents - refund_cents)"

      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /markets/{marketId}/settlements/{settlementId}/reconcile"
        actor: FinanceOfficer
        preconditions:
          - "market.posture ∈ {OPEN, WEATHER_ALERT, CLOSED_SEASON}"
        side_effects:
          - "vendor.renewal_score recomputed (see calculation)"

      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /markets/{marketId}/settlements/{settlementId}/dispute"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

      - from: RECONCILED
        to: PAID
        trigger: "POST /markets/{marketId}/settlements/{settlementId}/pay"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

  - entity: ProgrammingSlot
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "system (automatic when current_utc >= starts_at AND market.posture == OPEN)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LIVE
        to: COMPLETED
        trigger: "system (automatic when current_utc >= ends_at AND market.posture == OPEN)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /markets/{marketId}/programming/{slotId}/cancel OR system (when market enters WEATHER_ALERT and slot_kind == PARADE)"
        actor: "MarketOperator | system"
        preconditions: []
        side_effects: []

      - from: LIVE
        to: CANCELLED
        trigger: "system (when market enters WEATHER_ALERT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LoadSlot
    initial_state: RESERVED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /markets/{marketId}/load_slots/{loadSlotId}/check_in"
        actor: VendorRole
        preconditions:
          - "current_utc BETWEEN starts_at - 30 minutes AND ends_at"
        side_effects: []

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /markets/{marketId}/load_slots/{loadSlotId}/complete"
        actor: VendorRole
        preconditions:
          - "current_utc <= ends_at + 60 minutes"
        side_effects: []

      - from: RESERVED
        to: NO_SHOW
        trigger: "system (during run_ops when current_utc > ends_at AND status still RESERVED)"
        actor: system
        preconditions: []
        side_effects:
          - "vendor.no_show_strikes += 1"
          - "vendor.renewal_score recomputed"

  - entity: RenewalOffer
    initial_state: EXTENDED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: EXTENDED
        to: ACCEPTED
        trigger: "POST /markets/{marketId}/renewal_offers/{offerId}/accept"
        actor: VendorRole
        preconditions:
          - "current_utc < offer_expires_at"
          - "offered Booth.status == AVAILABLE"
        side_effects:
          - "offered Booth.status → RESERVED"
          - "auto-create a new VendorApplication for the vendor in the new market with status=ACCEPTED (skip jury)"
          - "auto-create a new BoothAssignment for (new application, offered booth) with status=PENDING_PAYMENT"

      - from: EXTENDED
        to: DECLINED
        trigger: "POST /markets/{marketId}/renewal_offers/{offerId}/decline"
        actor: VendorRole
        preconditions: []
        side_effects: []

      - from: EXTENDED
        to: EXPIRED
        trigger: "system (during run_ops when current_utc >= offer_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "offered Booth.status stays AVAILABLE (no reservation made)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: market-open-stale-version
    parent_entity: Market
    write_endpoint: "POST /markets/{marketId}/open_market"
    occ_field: "expected_market_version"
    description: |
      Opening a Market whose version has advanced since the client last
      observed it is rejected. The OCC check ensures an operator working
      from a stale market snapshot cannot re-open after another operator
      has already transitioned the market forward (e.g. flipped posture
      or run_ops has fired and advanced the epoch).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: application-decide-stale-version
    parent_entity: VendorApplication
    write_endpoint: "POST /markets/{marketId}/applications/{applicationId}/decide"
    occ_field: "expected_application_version"
    description: |
      Deciding a VendorApplication whose version has advanced since the
      JuryChair last observed it is rejected. A second sequential decide
      carries a stale expected_application_version and is rejected, even
      though each individual call sees valid preconditions.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assignment_base_rent
    trigger: "BoothAssignment creation"
    algorithm: tiered_pricing
    formula: |
      # Two-dimensional lookup: base depends on booth_type × zone.
      # A "season tier" multiplier then applies based on how close
      # the assignment activation is to market.opens_at.
      # Rounding: round half-up to whole cents, only at the END
      # (no per-component rounding; this is the pinned order).
      base_cents = RENT_TABLE[booth_type][zone]            # cents, see constants
      days_to_open = floor((market.opens_at - assignment.created_at) / 86400)
      if days_to_open >= EARLY_BIRD_DAYS:
        multiplier = EARLY_BIRD_MULT                        # 0.85
      elif days_to_open <= LATE_COMMIT_DAYS:
        multiplier = LATE_COMMIT_MULT                       # 1.20
      else:
        multiplier = 1.00
      base_rent_cents = round_half_up(base_cents * multiplier)
    input_set: "booth.booth_type, booth.zone, assignment.created_at, market.opens_at"
    constants:
      EARLY_BIRD_DAYS: 45
      LATE_COMMIT_DAYS: 7
      EARLY_BIRD_MULT: 0.85
      LATE_COMMIT_MULT: 1.20
    precision: "0 decimal places (whole cents), round_half_up, applied once at the END"

  - name: assignment_total_fee
    trigger: "BoothAssignment creation and on heating flag change"
    algorithm: aggregation
    formula: |
      # Nested-rounding pin: we DO NOT round the heating surcharge
      # independently; we sum unrounded values then round once.
      # (This distinguishes from an alternative that rounds each
      # component then sums, which can differ by 1 cent.)
      if application.heating_requested and booth.booth_type == CHALET:
        heating_surcharge_cents = HEATING_FLAT_CENTS
      else:
        heating_surcharge_cents = 0
      total_fee_cents = base_rent_cents + heating_surcharge_cents
      # base_rent_cents already rounded; heating is already a whole-cent
      # constant — final sum is exact, no additional rounding step.
    input_set: "base_rent_cents (from assignment_base_rent), application.heating_requested, booth.booth_type"
    constants:
      HEATING_FLAT_CENTS: 45000    # $450.00 flat
    precision: "0 decimal places (whole cents)"

  - name: pos_fee
    trigger: "SalesSettlement recompute (on create and on submit)"
    algorithm: threshold
    formula: |
      # Floor-based basis-point fee; integer math, no float rounding.
      # The two variants differ in WHEN the floor is applied:
      #   provisional: floor applied at line-item time (this is what
      #                we pin — chosen so operators see predictable fees)
      #   final: floor applied to aggregated gross across the day
      # We pin 'provisional' as authoritative for the DRAFT/SUBMITTED
      # SalesSettlement row, and 'final' only for the market-level
      # reconciliation report.
      if market.shared_pos_enabled AND has_active_pos_device_for_assignment:
        pos_fee_cents = floor(gross_card_cents * market.shared_pos_fee_bps / 10000)
      else:
        pos_fee_cents = 0
    input_set: "gross_card_cents (per settlement row), market.shared_pos_fee_bps, market.shared_pos_enabled, existence of ACTIVE PosDevice for this assignment"
    variants:
      - name: provisional_line_item
        when: "SalesSettlement is in DRAFT or SUBMITTED"
        difference: "floor applied per settlement row; the row's own pos_fee_cents field"
      - name: final_aggregate
        when: "market-level end-of-day reconciliation report"
        difference: "floor applied to the SUM of gross_card_cents across all settlements for the day; can differ from sum-of-per-row by up to (rows-1) cents"
    precision: "0 decimal places (whole cents); floor, not round_half_up"

  - name: vendor_renewal_score
    trigger: "SalesSettlement RECONCILED, LoadSlot NO_SHOW, BoothAssignment FORFEITED with reason=NO_SHOW"
    algorithm: weighted_scoring
    formula: |
      # Composite score in [0, 100]. Higher = better renewal priority.
      #   s1: gross sales z-score normalized against category peers (0-50)
      #   s2: attendance reliability (0-30)  — penalizes no_show_strikes
      #   s3: jury quality (0-20)             — most recent jury_average
      # Weights: SALES_W=0.50, RELIABILITY_W=0.30, JURY_W=0.20
      sales_component = min(50, vendor.lifetime_gross_sales_cents / SALES_DIVISOR)
      reliability_component = max(0, 30 - 10 * vendor.no_show_strikes)
      jury_component = (most_recent_jury_average / 100) * 20 if most_recent_jury_average is not null else 0
      renewal_score = sales_component + reliability_component + jury_component
    input_set: "vendor.lifetime_gross_sales_cents, vendor.no_show_strikes, most recent VendorApplication.jury_average for this vendor across all markets"
    constants:
      SALES_DIVISOR: 200000      # $2,000 in cents-per-point; $100k gross => 50 points
    precision: "2 decimal places, round_half_up"

  - name: renewal_discount_pct
    trigger: "RenewalOffer creation"
    algorithm: threshold
    formula: |
      # Band assignment by renewal_score:
      if vendor.renewal_score >= 80: discount_pct = 20
      elif vendor.renewal_score >= 60: discount_pct = 15
      elif vendor.renewal_score >= 40: discount_pct = 10
      elif vendor.renewal_score >= 20: discount_pct = 5
      else: discount_pct = 0
    input_set: "vendor.renewal_score at the moment the RenewalOffer is created"
    precision: "integer percent"

  - name: posture_derivation
    trigger: "WeatherEvent insert, Market.open_market, Market.clear_weather_alert, run_ops"
    algorithm: aggregation
    formula: |
      # Market.posture is derived; this calculation is the single source.
      # Order of evaluation matters and is pinned below:
      if market.cancelled_flag: posture = CANCELLED
      elif current_utc >= market.closes_at: posture = CLOSED_SEASON
      elif any WeatherEvent in past 6h with triggers_alert=true: posture = WEATHER_ALERT
      elif market.opened_flag: posture = OPEN
      else: posture = SETUP
    input_set: "market.opens_at, market.closes_at, current_utc, recent WeatherEvents, opened/cancelled flags"

  - name: category_balance_check
    trigger: "VendorApplication decide-to-ACCEPTED"
    algorithm: threshold
    formula: |
      accepted_in_category = count(VendorApplication where market_id=this market
                                 AND vendor.category == applicant.category
                                 AND status == ACCEPTED)
      cap = market.category_caps[applicant.category]
      if accepted_in_category >= cap:
        reject with ERR_CATEGORY_CAP_REACHED
    input_set: "VendorApplications on this market, in ACCEPTED status, same category as applicant"

  - name: run_ops_checkpoint
    trigger: "POST /markets/{marketId}/run_ops"
    algorithm: chronological
    formula: |
      # Order of evaluation is PINNED; downstream effects cascade in this order:
      market.run_ops_index += 1
      # 1. expire PENDING_PAYMENT assignments older than 3 ops runs
      for a in assignments where status == PENDING_PAYMENT AND age_in_ops_runs(a) >= 3:
        a → FORFEITED (vendor.no_show_strikes += 1)
      # 2. expire Permits whose expires_at <= current_utc
      for p in permits where status == ACTIVE AND p.expires_at <= current_utc:
        p → EXPIRED (may cascade BoothAssignment → FORFEITED)
      # 3. expire RenewalOffers whose offer_expires_at <= current_utc
      for r in renewal_offers where status == EXTENDED AND r.offer_expires_at <= current_utc:
        r → EXPIRED
      # 4. mark RESERVED LoadSlots past ends_at as NO_SHOW
      for l in load_slots where status == RESERVED AND l.ends_at < current_utc:
        l → NO_SHOW (vendor.no_show_strikes += 1)
      # 5. transition market OPEN → CLOSED_SEASON when closes_at passed
      if market.posture == OPEN AND current_utc >= market.closes_at:
        market → CLOSED_SEASON (cascades as in state machine)
    input_set: "all BoothAssignment, Permit, RenewalOffer, LoadSlot, Market under this market"
    precision: "N/A — bookkeeping"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is one of declared §1.7 roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "all path-templated resources exist (market, application, assignment, booth, etc.); resolved left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC expected_*_version (when supplied) matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /markets/{id}/open_market, POST /markets/{id}/applications/{id}/decide"

  - priority: 5
    category: state
    check: "market.posture must permit the operation (e.g. PosDevice.activate requires OPEN; hookup install requires SETUP)"
    error_id: ERR_POSTURE_FORBIDDEN
    http_status: 409
    applies_to: "posture-gated endpoints"

  - priority: 6
    category: state
    check: "target entity is in a state that allows the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Permit-required operations (energize PROPANE, install GENERATOR) require an ACTIVE Permit of the matching type"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 409
    applies_to: "POST /markets/{id}/hookups/{id}/energize (PROPANE), POST /markets/{id}/hookups/{id}/install (GENERATOR)"

  - priority: 8
    category: business_temporal
    check: "VendorApplication submit window: current_utc BETWEEN market.application_opens_at AND market.application_closes_at"
    error_id: ERR_APPLICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /markets/{id}/applications/{id}/submit"

  - priority: 9
    category: business_temporal
    check: "ProgrammingSlot and LoadSlot intervals must satisfy starts_at < ends_at; neither overlaps an existing same-kind slot on the same (market, vendor/booth) key"
    error_id: ERR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /markets/{id}/programming, POST /markets/{id}/load_slots"

  - priority: 10
    category: business_constraint
    check: "category cap: accepting would push the application's category count above market.category_caps[category]"
    error_id: ERR_CATEGORY_CAP_REACHED
    http_status: 409
    applies_to: "POST /markets/{id}/applications/{id}/decide"

  - priority: 11
    category: business_constraint
    check: "jury quorum: decide requires len(jury_scores) >= market.jury_quorum; a juror cannot score the same application twice"
    error_id: ERR_JURY_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /markets/{id}/applications/{id}/decide, POST /markets/{id}/applications/{id}/score"

  - priority: 12
    category: business_constraint
    check: "booth availability: Booth.status must be AVAILABLE when creating a new ACTIVE BoothAssignment; booth.has_power required for ELECTRIC_* hookups"
    error_id: ERR_BOOTH_UNAVAILABLE
    http_status: 409
    applies_to: "POST /markets/{id}/assignments, POST /markets/{id}/assignments/{id}/activate, POST /markets/{id}/hookups"

  - priority: 13
    category: business_referential
    check: "renewal offer acceptance: offered booth must still be AVAILABLE at acceptance time"
    error_id: ERR_BOOTH_NO_LONGER_AVAILABLE
    http_status: 409
    applies_to: "POST /markets/{id}/renewal_offers/{id}/accept"

  - priority: 14
    category: business_referential
    check: "settlement uniqueness: at most one SUBMITTED SalesSettlement per (assignment_id, business_date)"
    error_id: ERR_DUPLICATE_SETTLEMENT
    http_status: 409
    applies_to: "POST /markets/{id}/settlements/{id}/submit"

  - priority: 15
    category: business_fiscal
    check: "SalesSettlement gross_*_cents >= 0, refund_cents <= (gross_card_cents + gross_cash_cents), pos_fee computed not input"
    error_id: ERR_INVALID_SETTLEMENT_AMOUNTS
    http_status: 422
    applies_to: "POST /markets/{id}/settlements, PUT /markets/{id}/settlements/{id}"

  - priority: 16
    category: business_fiscal
    check: "payment-activation: BoothAssignment PENDING_PAYMENT → ACTIVE requires total_fee_cents settled out-of-band (operator-attested); assignment cannot activate if application not ACCEPTED"
    error_id: ERR_PAYMENT_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /markets/{id}/assignments/{id}/activate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Market ---
  - method: POST
    path: "/markets"
    description: "Create a new Market (in SETUP posture)"
    roles: [MarketOperator]
    code: 201
    input: [name, season_code, opens_at, closes_at, application_opens_at, application_closes_at, "jury_quorum?", category_caps, chalet_count, standard_booth_count, "shared_pos_enabled?", "shared_pos_fee_bps?", "weather_alert_threshold_wind_mph?"]
    output: Market
    side_effects: ["posture=SETUP, run_ops_index=0"]

  - method: GET
    path: "/markets/{marketId}"
    description: "Get a specific Market"
    roles: [MarketOperator, VendorRole, JuryMember, JuryChair, UtilityCrew, FinanceOfficer]
    code: 200
    input: []
    output: Market
    side_effects: []

  - method: GET
    path: "/markets"
    description: "List markets (paginated, filterable by season_code, posture)"
    roles: [MarketOperator, VendorRole, JuryMember, JuryChair, UtilityCrew, FinanceOfficer]
    code: 200
    input: ["season_code?", "posture?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  - method: POST
    path: "/markets/{marketId}/open_market"
    description: "Transition Market SETUP → OPEN (OCC via expected_market_version)"
    roles: [MarketOperator]
    code: 200
    input: [expected_market_version]
    output: Market
    side_effects:
      - "posture ← OPEN"
      - "increments Market.version by 1"

  - method: POST
    path: "/markets/{marketId}/clear_weather_alert"
    description: "Transition Market WEATHER_ALERT → OPEN"
    roles: [MarketOperator]
    code: 200
    input: []
    output: Market
    side_effects:
      - "posture ← OPEN"
      - "SUSPENDED PosDevice → ACTIVE"
      - "increments Market.version by 1"

  - method: POST
    path: "/markets/{marketId}/cancel"
    description: "Cancel a Market (SETUP only)"
    roles: [MarketOperator]
    code: 200
    input: []
    output: Market
    side_effects:
      - "posture ← CANCELLED"
      - "cascade VendorApplications → WITHDRAWN; BoothAssignments → FORFEITED"
      - "increments Market.version by 1"

  - method: POST
    path: "/markets/{marketId}/run_ops"
    description: "Advance the ops checkpoint: expire stale assignments/permits/offers, mark NO_SHOWs, transition market CLOSED_SEASON when applicable"
    roles: [MarketOperator]
    code: 200
    input: []
    output: Market
    side_effects: ["run_ops_index += 1", "execute run_ops_checkpoint calculation in pinned order"]
  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a Vendor"
    roles: [MarketOperator]
    code: 201
    input: [legal_name, contact_email, category]
    output: Vendor
    side_effects: ["status=PROSPECT, no_show_strikes=0, lifetime_gross_sales_cents=0, renewal_score=0"]

  - method: GET
    path: "/vendors/{vendorId}"
    description: "Get a specific Vendor"
    roles: [MarketOperator, VendorRole, JuryChair, FinanceOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors (paginated; filterable by category, status)"
    roles: [MarketOperator, JuryChair, FinanceOfficer]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  # --- VendorApplication ---
  - method: POST
    path: "/markets/{marketId}/applications"
    description: "Create a VendorApplication in DRAFT"
    roles: [VendorRole]
    code: 201
    input: [vendor_id, requested_booth_type, "requested_pos?", "heating_requested?", "jury_average?"]
    output: VendorApplication
    side_effects: ["status=DRAFT, jury_scores=[], jury_average=null"]

  - method: GET
    path: "/markets/{marketId}/applications/{applicationId}"
    description: "Get a specific application"
    roles: [MarketOperator, VendorRole, JuryMember, JuryChair]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []

  - method: GET
    path: "/markets/{marketId}/applications"
    description: "List applications for a market (filterable by status, category)"
    roles: [MarketOperator, JuryMember, JuryChair]
    code: 200
    input: ["status?", "category?", "vendor_id?", "limit?", "offset?"]
    output: VendorApplication[]
    side_effects: []

  - method: POST
    path: "/markets/{marketId}/applications/{applicationId}/submit"
    description: "Vendor submits their application (DRAFT → SUBMITTED)"
    roles: [VendorRole]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/markets/{marketId}/applications/{applicationId}/score"
    description: "JuryMember submits a score (0-100) for the application"
    roles: [JuryMember]
    code: 200
    input: [score_0_100]
    output: VendorApplication
    side_effects: ["append score to jury_scores; recompute jury_average; SUBMITTED → UNDER_JURY on first score"]

  - method: POST
    path: "/markets/{marketId}/applications/{applicationId}/decide"
    description: "JuryChair decides ACCEPTED / REJECTED / WAITLISTED (OCC via expected_application_version)"
    roles: [JuryChair]
    code: 200
    input: [decision, expected_application_version]
    output: VendorApplication
    side_effects: ["status → decision (ACCEPTED/REJECTED/WAITLISTED)", "if ACCEPTED: Market.total_accepted_vendors += 1, vendor PROSPECT → APPROVED"]

  - method: POST
    path: "/markets/{marketId}/applications/{applicationId}/withdraw"
    description: "Vendor withdraws their application"
    roles: [VendorRole]
    code: 200
    input: []
    output: VendorApplication
    side_effects: ["status → WITHDRAWN"]

  # --- Booth ---
  - method: POST
    path: "/markets/{marketId}/booths"
    description: "Create a Booth"
    roles: [MarketOperator]
    code: 201
    input: [booth_code, booth_type, zone, square_feet, "has_power?", "id?", "created_at?", "updated_at?"]
    output: Booth
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/markets/{marketId}/booths/{boothId}"
    description: "Get a Booth"
    roles: [MarketOperator, VendorRole, JuryChair, UtilityCrew]
    code: 200
    input: []
    output: Booth
    side_effects: []

  - method: GET
    path: "/markets/{marketId}/booths"
    description: "List booths for a market (filterable by status, booth_type, zone)"
    roles: [MarketOperator, VendorRole, JuryChair, UtilityCrew]
    code: 200
    input: ["status?", "booth_type?", "zone?", "limit?", "offset?"]
    output: Booth[]
    side_effects: []

  # --- BoothAssignment ---
  - method: POST
    path: "/markets/{marketId}/assignments"
    description: "Create a BoothAssignment (PENDING_PAYMENT); computes base_rent + heating_surcharge + total_fee"
    roles: [MarketOperator]
    code: 201
    input: [booth_id, application_id]
    output: BoothAssignment
    side_effects: ["compute base_rent_cents, heating_surcharge_cents, total_fee_cents"]

  - method: GET
    path: "/markets/{marketId}/assignments/{assignmentId}"
    description: "Get a specific BoothAssignment"
    roles: [MarketOperator, VendorRole, FinanceOfficer]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: []

  - method: GET
    path: "/markets/{marketId}/assignments"
    description: "List assignments (filterable by status, booth_id, application_id)"
    roles: [MarketOperator, FinanceOfficer]
    code: 200
    input: ["status?", "booth_id?", "application_id?", "limit?", "offset?"]
    output: BoothAssignment[]
    side_effects: []

  - method: POST
    path: "/markets/{marketId}/assignments/{assignmentId}/activate"
    description: "Transition BoothAssignment PENDING_PAYMENT → ACTIVE"
    roles: [MarketOperator]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["Booth.status → RESERVED", "Market.total_booths_committed += 1"]

  - method: POST
    path: "/markets/{marketId}/assignments/{assignmentId}/release"
    description: "Operator releases an ACTIVE BoothAssignment"
    roles: [MarketOperator]
    code: 200
    input: []
    output: BoothAssignment
    side_effects: ["Booth.status → AVAILABLE", "Market.total_booths_committed -= 1"]

  - method: POST
    path: "/markets/{marketId}/assignments/{assignmentId}/forfeit"
    description: "Operator forfeits an ACTIVE BoothAssignment with a reason"
    roles: [MarketOperator]
    code: 200
    input: [reason]
    output: BoothAssignment
    side_effects: ["Booth.status → AVAILABLE", "Market.total_booths_committed -= 1", "if reason=NO_SHOW: vendor.no_show_strikes += 1"]

  # --- Permit ---
  - method: POST
    path: "/markets/{marketId}/permits"
    description: "Issue a Permit for an assignment"
    roles: [MarketOperator]
    code: 201
    input: [assignment_id, permit_type, issued_by, issued_at, expires_at]
    output: Permit
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/markets/{marketId}/permits/{permitId}"
    description: "Get a Permit"
    roles: [MarketOperator, VendorRole, UtilityCrew]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: GET
    path: "/markets/{marketId}/permits"
    description: "List permits (filterable by status, permit_type, assignment_id)"
    roles: [MarketOperator, UtilityCrew]
    code: 200
    input: ["status?", "permit_type?", "assignment_id?", "limit?", "offset?"]
    output: Permit[]
    side_effects: []

  - method: POST
    path: "/markets/{marketId}/permits/{permitId}/revoke"
    description: "Revoke an ACTIVE Permit"
    roles: [MarketOperator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status → REVOKED; if TEMP_STRUCTURE: assignment → FORFEITED"]

