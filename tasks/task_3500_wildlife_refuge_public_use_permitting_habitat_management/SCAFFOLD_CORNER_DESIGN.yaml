            - call: "POST /refuge/cooperative-agreements/${ag1}/assess"
              payload: { period_key: "2026-11", aum_used: 3, rate_cents_per_aum: 1001, expected_agreement_version: "${ag_v}" }
              as: Biologist
          trigger:
            - call: "POST /refuge/cooperative-agreements/${ag1}/ledger-entries"
              payload: { type: "PAYMENT", amount_cents: 1503 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OVERPAYMENT, http 422"
      - name: use_type_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_USE_TYPE_MISMATCH]"]
        distinguishing_aspect: "A PHOTOGRAPHY permit referencing a RESEARCH determination is rejected at create time."
        test_recipe:
          setup: ["One unit; one RESEARCH determination (any status)."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "PHOTOGRAPHY", crew_size: 2, start_date: "2026-10-10", end_date: "2026-10-10" }
              as: PermitApplicant
              as_user_id: "app-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_USE_TYPE_MISMATCH, http 422"
      - name: full_posture_blocks_program_but_trails_only_allows
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_POSTURE_CLOSED]", calculations.access_posture_derivation]
        distinguishing_aspect: "Date-scoped posture gate: a program dated inside an ACTIVE FULL closure window is rejected (ERR_POSTURE_CLOSED); the same date under an ACTIVE TRAILS_ONLY closure succeeds."
        test_recipe:
          setup: ["Unit A with an ACTIVATED FULL closure 2026-10-01..2026-10-31; unit B with an ACTIVATED TRAILS_ONLY closure on identical dates."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Unit A", habitat_type: "WETLAND", acreage: 100 }
              as: RefugeManager
              captures: { ua: $.data.id }
            - call: "POST /refuge/management-units"
              payload: { name: "Unit B", habitat_type: "FOREST", acreage: 100 }
              as: RefugeManager
              captures: { ub: $.data.id }
            - call: "POST /refuge/management-units/${ua}/closures"
              payload: { closure_type: "MIGRATION", scope: "FULL", start_date: "2026-10-01", end_date: "2026-10-31" }
              as: Biologist
              captures: { ca: $.data.id }
            - call: "POST /refuge/management-units/${ub}/closures"
              payload: { closure_type: "MIGRATION", scope: "TRAILS_ONLY", start_date: "2026-10-01", end_date: "2026-10-31" }
              as: Biologist
              captures: { cb: $.data.id }
            - call: "POST /refuge/closures/${ca}/activate"
              payload: {}
              as: Biologist
            - call: "POST /refuge/closures/${cb}/activate"
              payload: {}
              as: Biologist
          trigger:
            - call: "POST /refuge/management-units/${ua}/programs"
              payload: { title: "Walk A", program_date: "2026-10-05", min_volunteers: 1, max_volunteers: 3 }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /refuge/management-units/${ub}/programs"
              payload: { title: "Walk B", program_date: "2026-10-05", min_volunteers: 1, max_volunteers: 3 }
              as: VolunteerCoordinator
              captures: { prog_b: $.data.id, prog_b_st: $.data.status }
          assert:
            - "unit A (FULL closure ACTIVE on 2026-10-05): error_id == ERR_POSTURE_CLOSED, http 422"
            - "unit B (TRAILS_ONLY): program created, status == SCHEDULED, http 201"
      - name: treatment_start_blocked_when_unit_closed
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_POSTURE_CLOSED]", state_machines.HabitatTreatment.WINDOW_OPEN_to_IN_PROGRESS]
        distinguishing_aspect: "start uses the posture at the current clock date: an ACTIVE FULL closure covering 'today' blocks a WINDOW_OPEN treatment from starting."
        test_recipe:
          setup: ["One unit; ACTIVE FULL closure 2026-10-01..2026-10-31; INVASIVE_CONTROL treatment windowed 2026-10-10..2026-10-20, clock at 2026-10-10 (WINDOW_OPEN)."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/closures"
              payload: { closure_type: "MIGRATION", scope: "FULL", start_date: "2026-10-01", end_date: "2026-10-31" }
              as: Biologist
              captures: { c1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "INVASIVE_CONTROL", window_start: "2026-10-10", window_end: "2026-10-20" }
              as: Biologist
              captures: { t1: $.data.id }
            - call: "POST /refuge/closures/${c1}/activate"
              payload: {}
              as: Biologist
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T00:00:00Z" }
              as: RefugeManager
          trigger:
            - call: "POST /refuge/treatments/${t1}/start"
              payload: {}
              as: Biologist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POSTURE_CLOSED, http 422 (posture CLOSED at clock date 2026-10-10)"
      - name: bid_after_application_deadline_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_WINDOW_IN_PAST]"]
        distinguishing_aspect: "Bids close at application_deadline: with the clock at 2026-10-02 and deadline 2026-10-01, a bid is rejected."
        test_recipe:
          setup: ["One OPEN offering with application_deadline 2026-10-01; clock advanced past it."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "South Pasture", habitat_type: "GRASSLAND", acreage: 3000 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "GRAZING", title: "Grazing compatibility", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { dg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/open-comment"
              payload: {}
              as: PermitOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: RefugeManager
            - call: "POST /refuge/determinations/${dg}/finalize"
              payload: { finding: "COMPATIBLE", rationale: "ok" }
              as: PermitOfficer
            - call: "POST /refuge/management-units/${u1}/grazing-offerings"
              payload: { description: "Winter grazing", aum_cap: 100, grazing_window_start: "2026-11-01", grazing_window_end: "2027-02-28", application_deadline: "2026-10-01", min_stewardship_rating: 5 }
              as: Biologist
              captures: { off1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: RefugeManager
          trigger:
            - call: "POST /refuge/grazing-offerings/${off1}/bids"
              payload: { cooperator_ref: "coop-1", rate_cents_per_aum: 2000, stewardship_rating: 7 }
              as: Cooperator
              as_user_id: "coop-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_IN_PAST, http 422"

  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data — verified on a plain entity read."
        test_recipe:
          setup: ["One unit."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
          trigger:
            - call: "GET /refuge/management-units/${u1}"
              as: Biologist
          assert:
            - "response.meta.api_request_id is present and non-empty"
            - "response.meta.api_request_timestamp is present (ISO8601 from the logical clock)"
            - "response.response_type == 'object' and response.data.id == ${u1}"
      - name: list_pagination_limit_and_has_more
        claim_type: standard_crud
        grounds: [response_envelope, "endpoints[GET /refuge/permits]"]
        distinguishing_aspect: "pagination_defaults honored: limit=1 over 2 stored permits yields total_count 2, has_more true, and exactly 1 item."
        test_recipe:
          setup: ["One unit; one DRAFT RESEARCH determination; two SUBMITTED permits."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 1, start_date: "2026-10-10", end_date: "2026-10-10" }
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-2", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 1, start_date: "2026-10-11", end_date: "2026-10-11" }
              as: PermitApplicant
              as_user_id: "app-2"
          trigger:
            - call: "GET /refuge/permits"
              payload: { limit: 1 }
              as: PermitOfficer
          assert:
            - "response.meta.response_type == 'array' semantics: data has exactly 1 item"
            - "pagination fields: total_count == 2, has_more == true, limit == 1, offset == 0"
      - name: permits_filter_by_management_unit
        claim_type: standard_crud
        grounds: ["endpoints[GET /refuge/permits]"]
        distinguishing_aspect: "Filtered list returns only permits of the requested unit (FK reverse reach with filtering)."
        test_recipe:
          setup: ["Units u1, u2; DRAFT RESEARCH determination; one permit on each unit."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Unit One", habitat_type: "WETLAND", acreage: 100 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units"
              payload: { name: "Unit Two", habitat_type: "FOREST", acreage: 100 }
              as: RefugeManager
              captures: { u2: $.data.id }
            - call: "POST /refuge/determinations"
              payload: { use_type: "RESEARCH", title: "Research use", comment_open_date: "2026-09-05", comment_close_date: "2026-09-20" }
              as: PermitOfficer
              captures: { d1: $.data.id }
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-1", management_unit_id: "${u1}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 1, start_date: "2026-10-10", end_date: "2026-10-10" }
              as: PermitApplicant
              as_user_id: "app-1"
            - call: "POST /refuge/permits"
              payload: { applicant_ref: "app-2", management_unit_id: "${u2}", determination_id: "${d1}", use_type: "RESEARCH", crew_size: 1, start_date: "2026-10-10", end_date: "2026-10-10" }
              as: PermitApplicant
              as_user_id: "app-2"
          trigger:
            - call: "GET /refuge/permits"
              payload: { management_unit_id: "${u1}" }
              as: PermitOfficer
              captures: { mu: "$.data[0].management_unit_id" }
          assert:
            - "total_count == 1 and the single item's management_unit_id == ${u1}"
      - name: posture_read_returns_full_snapshot
        claim_type: computed_read
        grounds: ["endpoints[GET /refuge/management-units/{id}/posture]", calculations.access_posture_derivation]
        distinguishing_aspect: "The computed read returns all five derived fields with fresh-unit values: OPEN, 0 days, 0 scores, 0 active closures."
        test_recipe:
          setup: ["One fresh unit, no closures/treatments/permits."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "North Marsh", habitat_type: "WETLAND", acreage: 1200 }
              as: RefugeManager
              captures: { u1: $.data.id }
          trigger:
            - call: "GET /refuge/management-units/${u1}/posture"
              as: Biologist
              captures: { posture: $.data.access_posture, days: $.data.committed_visitor_days, breed: $.data.habitat_priority_breeding, annual: $.data.habitat_priority_annual, ncl: $.data.active_closure_count }
          assert:
            - "access_posture == OPEN, committed_visitor_days == 0, habitat_priority_breeding == 0, habitat_priority_annual == 0, active_closure_count == 0"

  - section: errors
    instances:
      - name: treatment_window_overlap_adjacency_vs_intersection
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_TREATMENT_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Half-open semantics: T2 starting exactly at T1's window_end (2026-10-15) is legal adjacency; T3 starting 2026-10-14 strictly intersects and is rejected."
        test_recipe:
          setup: ["One unit; treatments T1 [2026-10-01, 2026-10-15) and T2 [2026-10-15, 2026-10-31) already scheduled."]
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "INVASIVE_CONTROL", window_start: "2026-10-01", window_end: "2026-10-15" }
              as: Biologist
              captures: { t1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "WATER_MANIPULATION", window_start: "2026-10-15", window_end: "2026-10-31" }
              as: Biologist
              captures: { t2: $.data.id, t2_st: $.data.status }
          trigger:
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "WATER_MANIPULATION", window_start: "2026-10-14", window_end: "2026-10-20" }
              as: Biologist
              captures: { err: $.data.error_id }
          assert:
            - "adjacent T2 (window_start == T1.window_end) created successfully, status == SCHEDULED"
            - "overlapping T3 -> error_id == ERR_TREATMENT_WINDOW_OVERLAP, http 422"
      - name: payment_amount_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Payment must equal assessed_fee_cents exactly: paying 20000 against an assessment of 21000 is rejected with 402."
