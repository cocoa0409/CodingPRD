              payload: { partner_id: "${pa_id}", custody_account_id: "${res_a_id_b}", entry_type: "RESERVE_FUND", amount_cents: 100000, effective_at: "2026-08-06T00:00:00Z", expected_custody_account_version: "${res_a_v_b}", memo: "second reserve top-up" }
              as: ProgramOfficer
