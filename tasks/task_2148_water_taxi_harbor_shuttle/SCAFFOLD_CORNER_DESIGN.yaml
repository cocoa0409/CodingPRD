        distinguishing_aspect: |
          Two vessels each hold one ANNUAL row; the sub-resource listing for the first returns exactly one row
          and never the sibling vessel's row, and the inspection_type filter narrows further.
        test_recipe:
          setup:
            - "Two vessels, each with one ANNUAL PASS inspection performed 2026-08-01, and one extra PRE_DEPARTURE row on the first vessel."
          setup_api_calls:
