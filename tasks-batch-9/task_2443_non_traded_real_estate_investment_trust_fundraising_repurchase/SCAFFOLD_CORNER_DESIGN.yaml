              as: SponsorOperator
              captures: { sub_a_id: $.data.id }
            - call: "POST /subscriptions/${sub_a_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /subscriptions"
