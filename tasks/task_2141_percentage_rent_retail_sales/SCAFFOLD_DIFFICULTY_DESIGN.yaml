              as: LeaseAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "The adjacent creation returns HTTP 201 and SalesReport.${r2_id}.period_start == \"2026-10-01T00:00:00.000Z\""
            - "The straddling creation returns HTTP 409 with data.error_id == \"ERR_REPORTING_PERIOD_OVERLAP\""
            - "GET /retail/sales-reports with lease_year_id=${ly_id} returns exactly 2 rows"

      - name: audit_window_closed_interval_with_cooldown_buffer_rejected
        grounds:
          - calculations.reporting_interval_conflicts
          - validations[priority=11]
          - errors[ERR_AUDIT_WINDOW_CONFLICT]
          - entities.SalesAudit.fields.audit_window_start
          - entities.SalesAudit.fields.audit_window_end
        distinguishing_aspect: |
          Resource is the Lease and the interval semantics are CLOSED with a 30-day buffer on
          both sides: a window starting 2026-12-20 collides with the existing 2026-11-01 to
          2026-11-30 audit because the expanded edge reaches 2026-12-30, while 2027-01-05 clears
          it - the opposite adjacency treatment from the half-open report rule.
