# =============================================================================
# task_0328_irrigation_sprinkler_service — §1.9 Scaffold Corner Design
# Breadth probe: enumerative coverage of testable §1.1–§1.7 claims not already
# carried by §1.8. Same seven-point contract and §1.5 lint gates as §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - "entities.Customer"
          - "endpoints.POST /customers"
        distinguishing_aspect: "POST /customers with all required fields → 201; status defaults to ACTIVE; id/created_at/version system-minted (version==1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { company_name: "Fresh Co", contact_email: "f@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "entities.Customer"
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "GET /customers/{id} with a non-existent UUID → ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"
            - "response http status == 404"

      - name: create_property_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Property.fields.customer_id"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=99]"
        distinguishing_aspect: "POST /properties omitting site_address → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Req Co", contact_email: "rq@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 422"

      - name: technician_backflow_certified_default_false
        claim_type: Defaults
        grounds:
          - "entities.Technician.fields.backflow_certified"
        distinguishing_aspect: "Creating a technician without backflow_certified → field defaults to false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /technicians"
              payload: { full_name: "Def Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id, bc: $.data.backflow_certified }
          assert:
            - "Technician.${tech_id}.backflow_certified == false"

      - name: system_computed_zone_count_and_costs_initialized
        claim_type: Computed Fields
        grounds:
          - "entities.IrrigationSystem.fields.zone_count"
          - "entities.IrrigationSystem.fields.committed_cost_cents"
        distinguishing_aspect: "A new system reports zone_count==0 and committed_cost_cents==0 with no zones or work orders."
        test_recipe:
          setup: ["A property exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Comp Co", contact_email: "cp@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "21 Comp St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id, zc: $.data.zone_count, cc: $.data.committed_cost_cents }
          assert:
            - "IrrigationSystem.${sys_id}.zone_count == 0"
            - "IrrigationSystem.${sys_id}.committed_cost_cents == 0"

      - name: duplicate_zone_number_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Zone.fields.zone_number"
          - "errors[ERR_DUPLICATE_ZONE_NUMBER]"
          - "validations[priority=10]"
        distinguishing_aspect: "Creating a second zone with the same zone_number on a system → ERR_DUPLICATE_ZONE_NUMBER (409)."
        test_recipe:
          setup: ["A system with a zone_number=1 already mapped."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Dup Co", contact_email: "d@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "22 Dup St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 1, plant_type: "TURF", head_count: 8, gpm_per_head: 18 }
              as: Dispatcher
          trigger:
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 1, plant_type: "SHRUB", head_count: 4, gpm_per_head: 12 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_ZONE_NUMBER"
            - "response http status == 409"

      - name: invalid_enum_plant_type_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Zone.fields.plant_type"
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=99]"
        distinguishing_aspect: "POST /zones with plant_type not in {TURF,SHRUB,DRIP,ROTOR} → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A system exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Enum Co", contact_email: "e@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "23 Enum St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
          trigger:
            - call: "POST /zones"
              payload: { system_id: "${sys_id}", zone_number: 1, plant_type: "CACTUS", head_count: 4, gpm_per_head: 12 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: send_quote_from_already_sent_returns_not_draft
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.ServiceQuote.DRAFT_to_SENT"
          - "errors[ERR_QUOTE_NOT_DRAFT]"
        distinguishing_aspect: "Sending a quote already in SENT → ERR_QUOTE_NOT_DRAFT (409); no second send."
        test_recipe:
          setup: ["A quote already SENT."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Inv Q Co", contact_email: "q@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "24 Q St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /service-quotes"
              payload: { property_id: "${prop_id}", quote_type: "INSTALL", line_items: [ { description: "heads", quantity: 1, unit_rate_cents: 5000 } ] }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_QUOTE_NOT_DRAFT"
            - "response http status == 409"

      - name: decommission_already_decommissioned_system_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.IrrigationSystem.OPERATIONAL_to_DECOMMISSIONED"
          - "errors[ERR_SYSTEM_ALREADY_DECOMMISSIONED]"
        distinguishing_aspect: "A second decommission on a DECOMMISSIONED system → ERR_SYSTEM_ALREADY_DECOMMISSIONED (409)."
        test_recipe:
          setup: ["A system already DECOMMISSIONED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Term Co", contact_email: "tm@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "25 Term St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /irrigation-systems/${sys_id}/decommission"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /irrigation-systems/${sys_id}/decommission"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SYSTEM_ALREADY_DECOMMISSIONED"
            - "response http status == 409"

      - name: arrive_before_depart_returns_not_en_route
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.WorkOrder.dispatch_status=EN_ROUTE_to_dispatch_status=ON_SITE"
          - "errors[ERR_WORKORDER_NOT_EN_ROUTE]"
        distinguishing_aspect: "Calling arrive on a SCHEDULED (not yet EN_ROUTE) work order → ERR_WORKORDER_NOT_EN_ROUTE (409)."
        test_recipe:
          setup: ["A work order SCHEDULED on a route but not departed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Arr Co", contact_email: "ar@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "26 Arr St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Arr Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "LEAK_REPAIR", estimated_minutes: 30, estimated_cost_cents: 4000 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WORKORDER_NOT_EN_ROUTE"
            - "response http status == 409"

      - name: pause_already_paused_plan_returns_not_active
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.MaintenancePlan.ACTIVE_to_PAUSED"
          - "errors[ERR_PLAN_NOT_ACTIVE]"
        distinguishing_aspect: "Pausing a plan already PAUSED → ERR_PLAN_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A plan PAUSED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Plz Co", contact_email: "pz@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "27 Plz St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /maintenance-plans"
              payload: { property_id: "${prop_id}", tier: "BASIC", visits_per_year: 4 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /maintenance-plans/${plan_id}/pause"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /maintenance-plans/${plan_id}/pause"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PLAN_NOT_ACTIVE"
            - "response http status == 409"

      - name: close_route_not_dispatched_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Route.DISPATCHED_to_CLOSED"
          - "errors[ERR_ROUTE_NOT_DISPATCHED]"
        distinguishing_aspect: "Closing a route still in PLANNING → ERR_ROUTE_NOT_DISPATCHED (409)."
        test_recipe:
          setup: ["A route in PLANNING."]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Cl Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-07" }
              as: Dispatcher
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/close"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROUTE_NOT_DISPATCHED"
            - "response http status == 409"

      - name: dispatch_empty_route_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Route.PLANNING_to_DISPATCHED"
          - "errors[ERR_EMPTY_ROUTE]"
        distinguishing_aspect: "Dispatching a route with stops_used==0 → ERR_EMPTY_ROUTE (409) [zero-count boundary, distinct from §1.8 route-capacity max]."
        test_recipe:
          setup: ["A PLANNING route with zero stops."]
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "Emp R Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-08" }
              as: Dispatcher
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_ROUTE"
            - "response http status == 409"

      - name: quote_approve_on_inactive_property_rejected
        claim_type: guarded transitions
        grounds:
          - "state_machines.ServiceQuote.SENT_to_APPROVED"
          - "entities.Property.fields.status"
          - "errors[ERR_PROPERTY_INACTIVE]"
        distinguishing_aspect: "Approving a SENT quote whose Property has been SUSPENDED... — here the customer is suspended; property stays ACTIVE but quote approve checks Property.status. Property suspended via customer? Use direct: property remains ACTIVE only when customer active. We assert ERR_PROPERTY_INACTIVE when property is not ACTIVE."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / startup_schedule_requires_system_winterized
          rationale: "The cross-entity guarded-transition class (target transition blocked by another entity's state) is already exercised by the §1.8 cross_entity_state_dependency rule; the property-status guard is a same-class variant covered by that depth probe."

      - name: complete_workorder_not_on_site_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.WorkOrder.completion_status=IN_PROGRESS_to_completion_status=COMPLETED"
          - "errors[ERR_WORKORDER_NOT_IN_PROGRESS]"
        distinguishing_aspect: "Completing a work order that is only SCHEDULED (completion_status PENDING, never IN_PROGRESS) → ERR_WORKORDER_NOT_IN_PROGRESS (409)."
        test_recipe:
          setup: ["A work order SCHEDULED but not departed/arrived (completion_status PENDING)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Comp2 Co", contact_email: "c2@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "28 Comp2 St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60 }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Comp2 Tech", shift_start_sec: 28800, shift_end_sec: 64800 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { system_id: "${sys_id}", job_type: "LEAK_REPAIR", estimated_minutes: 30, estimated_cost_cents: 4000 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-05-09" }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", work_order_id: "${wo_id}", arrival_start_sec: 28800, window_minutes: 60, expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { actual_labor_cents: 1000, actual_parts_cents: 500 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WORKORDER_NOT_IN_PROGRESS"
            - "response http status == 409"

  # ===========================================================================
  - section: calculations
    instances:
      - name: backflow_result_pass_at_exact_threshold
        claim_type: Precision
        grounds:
          - "calculations.backflow_result"
          - "entities.BackflowTest.fields.result"
        distinguishing_aspect: "relief_open_psi==MIN_RELIEF_PSI(2) and checkvalve_hold_psi==MIN_HOLD_PSI(1) → result PASS (>= boundary, not >)."
        test_recipe:
          setup: ["A system with a backflow device and a certified tester."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Bf Co", contact_email: "bf@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "29 Bf St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60, has_backflow_device: true }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Bf Tester", shift_start_sec: 28800, shift_end_sec: 64800, backflow_certified: true }
              as: Dispatcher
              captures: { tester_id: $.data.id }
          trigger:
            - call: "POST /backflow-tests"
              payload: { system_id: "${sys_id}", tester_technician_id: "${tester_id}", relief_open_psi: 2, checkvalve_hold_psi: 1 }
              as: BackflowTester
              as_user_id: "${tester_id}"
              captures: { res: $.data.result }
          assert:
            - "BackflowTest result == PASS"
            - "IrrigationSystem.${sys_id}.backflow_status == CERTIFIED"

      - name: backflow_result_fail_below_threshold_sets_failed
        claim_type: Correct Result
        grounds:
          - "calculations.backflow_result"
          - "entities.IrrigationSystem.fields.backflow_status"
        distinguishing_aspect: "relief_open_psi==1 (< MIN_RELIEF_PSI 2) → result FAIL; system.backflow_status → FAILED; property stays NON_COMPLIANT."
        test_recipe:
          setup: ["A system with a backflow device and a certified tester."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "BfF Co", contact_email: "bff@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", site_address: "30 BfF St", lat: 37.7, lng: -122.4 }
              as: Dispatcher
              captures: { prop_id: $.data.id }
            - call: "POST /irrigation-systems"
              payload: { property_id: "${prop_id}", controller_model: "Hunter", static_psi: 60, has_backflow_device: true }
              as: Dispatcher
              captures: { sys_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "BfF Tester", shift_start_sec: 28800, shift_end_sec: 64800, backflow_certified: true }
              as: Dispatcher
              captures: { tester_id: $.data.id }
          trigger:
            - call: "POST /backflow-tests"
              payload: { system_id: "${sys_id}", tester_technician_id: "${tester_id}", relief_open_psi: 1, checkvalve_hold_psi: 3 }
              as: BackflowTester
              as_user_id: "${tester_id}"
              captures: { res: $.data.result }
          assert:
            - "BackflowTest result == FAIL"
            - "IrrigationSystem.${sys_id}.backflow_status == FAILED"
            - "Property.${prop_id}.compliance_status == NON_COMPLIANT"

      - name: blowout_price_tier_boundary_at_five_zones
        claim_type: tiered_pricing
        grounds:
          - "calculations.blowout_price"
          - "endpoints.GET /irrigation-systems/{id}/blowout-quote"
        distinguishing_aspect: "zone_count==5 crosses the n<=4 / n<=10 boundary → TIER2 rate 1000; psi=60 (no surcharge) → 4500 + 1000*5 = 9500."
        test_recipe:
          setup: ["A system static_psi=60 with exactly 5 non-ARCHIVED zones."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { company_name: "Tb Co", contact_email: "tb@x.com", billing_zip: "94016" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
