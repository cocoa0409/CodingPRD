# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Community Solar Subscription — depth probe: 9 Difficulty Rules × 2 instances.
# Every grounds[] / field / state / error / calc / endpoint / role below
# resolves verbatim into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: bill_credit_provisional_vs_final_allocation_domain
        grounds:
          - calculations.bill_credit_provisional_vs_final
          - entities.Allocation.fields.provisional_credit_cents
          - entities.Allocation.fields.final_credit_cents
          - state_machines.BillingPeriod.OPEN_to_METERED
          - state_machines.BillingPeriod.METERED_to_RECONCILED
        distinguishing_aspect: |
          Operates on the Allocation entity domain: provisional_credit_cents uses
          forecast-basis allocated_kwh (12000c) while final_credit_cents uses
          metered-basis allocated_kwh (10000c) — same Allocation row, two values,
          delta 2000c driven solely by forecast-vs-metered pool.
        test_recipe:
          setup:
            - "Project nameplate 100kW, credit_rate 10 c/kWh, program_fee_rate 0.10."
            - "One non-low-income Subscriber annual_usage 1,000,000 kWh, share 5.0kW ACTIVE."
            - "Period forecast_production_kwh=1200 (single eligible sub gets all 1200), then metered=1000."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden A", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Sub One", utility_account_no: "ACC-1", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-01", forecast_production_kwh: 1200 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
          trigger:
            - call: "GET /allocations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { alloc0_provisional: "$.data[0].provisional_credit_cents" }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
          assert:
            - "After period creation, Allocation.provisional_credit_cents == 12000 (forecast 1200 * 10)"
            - "After reconcile, the same Allocation.final_credit_cents == 10000 (metered 1000 * 10)"
            - "Allocation.final_credit_cents - Allocation.provisional_credit_cents == -2000"

      - name: churn_risk_snapshot_vs_trailing_subscriber_domain
        grounds:
          - calculations.churn_risk_score
          - entities.Subscriber.fields.churn_risk_score
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Operates on the Subscriber entity domain (not Allocation): the snapshot
          variant scores a SUSPENDED + low-income subscriber at 50 (W_SUSPENDED 40
          + W_LOW_INCOME 10) ignoring history, while the trailing variant adds
          W_RECENT_CANCEL 50 for a recent CLOSED-period cancellation.
        test_recipe:
          setup:
            - "Project nameplate 100kW, credit_rate 10 c/kWh."
            - "Low-income Subscriber annual_usage 1,000,000 kWh with one ACTIVE share-5.0 subscription, then suspended."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden B", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Low Inc", utility_account_no: "ACC-2", state_code: "NY", is_low_income: true, annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${subscription_id}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "GET /subscribers/${sub_id}"
              payload: {}
              as: ProgramAdmin
              captures: { churn: $.data.churn_risk_score }
          assert:
            - "Subscriber.churn_risk_score == 50 (snapshot: W_SUSPENDED 40 + W_LOW_INCOME 10), capped at 100"
            - "The score is computed on Subscriber, not Allocation — distinct entity domain from instance bill_credit_provisional_vs_final_allocation_domain"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_program_fee_mode_a_multi_input_nonlinear
        grounds:
          - calculations.monthly_savings_reconciliation
          - entities.Reconciliation.fields.gross_credit_cents
          - entities.Reconciliation.fields.program_fee_cents
          - entities.Reconciliation.fields.net_savings_cents
          - state_machines.BillingPeriod.METERED_to_RECONCILED
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (gross, base_rate, carve-out flag, tier table) with
          non-linear tier-multiplier selection on gross. gross=10000 falls in
          TIER2 (5000<g<=20000 → m=0.90), non-carve-out base 0.10 → fee=900,
          net=9100; a single final rounding.
        test_recipe:
          setup:
            - "Project nameplate 100kW, credit_rate 10 c/kWh, program_fee_rate 0.10."
            - "Non-low-income Subscriber share 5.0kW ACTIVE; period metered 1000 → gross 10000."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden C", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Non LI", utility_account_no: "ACC-3", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-02", forecast_production_kwh: 1000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
          trigger:
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /reconciliations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { gross: "$.data[0].gross_credit_cents", fee: "$.data[0].program_fee_cents", net: "$.data[0].net_savings_cents" }
          assert:
            - "Reconciliation.gross_credit_cents == 10000"
            - "Reconciliation.program_fee_cents == 900 (round_half_up(10000 * 0.10 * 0.90))"
            - "Reconciliation.net_savings_cents == 9100"

      - name: trueup_overproduction_mode_c_pinned_eval_order
        grounds:
          - calculations.trueup_overproduction
          - entities.BillingPeriod.fields.overproduction_kwh
          - entities.BillingPeriod.fields.rollover_kwh
          - entities.BillingPeriod.fields.forfeited_kwh
          - entities.BillingPeriod.fields.rollover_credit_cents
          - state_machines.BillingPeriod.RECONCILED_to_TRUED_UP
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — cap
          depends on committed_kw, rollover_kwh depends on cap, rollover_credit_cents
          depends on rollover_kwh. With committed_kw 10, cap=min(2000, ceil(10*50))=500;
          overproduction 10000 → rollover 500, forfeited 9500, credit 5000.
        test_recipe:
          setup:
            - "Project nameplate 100kW, credit_rate 10 c/kWh; one ACTIVE subscription share 10.0 (committed_kw 10)."
            - "But the subscription is SUSPENDED before period creation so it earns NO allocation; period metered 10000 → 10000 unallocated overproduction."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden D", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Susp Sub", utility_account_no: "ACC-4", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 10.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /subscriptions/${subscription_id}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-03", forecast_production_kwh: 10000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 10000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
          trigger:
            - call: "POST /periods/${per_id}/true-up"
              payload: {}
              as: GridOperator
              captures: { overprod: $.data.overproduction_kwh, rollover: $.data.rollover_kwh, forfeited: $.data.forfeited_kwh, rollcredit: $.data.rollover_credit_cents }
          assert:
            - "BillingPeriod.overproduction_kwh == 10000 (no eligible subscription, all metered unallocated)"
            - "BillingPeriod.rollover_kwh == 500 (cap = min(2000, ceil(10*50)) = 500)"
            - "BillingPeriod.forfeited_kwh == 9500"
            - "BillingPeriod.rollover_credit_cents == 5000 (500 * 10)"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_suspend_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.SUSPENDED_to_ACTIVE
          - entities.Subscription.fields.status
        distinguishing_aspect: |
          Cyclic shape on the Subscription entity: ACTIVE→SUSPENDED→ACTIVE loop;
          the same subscription returns to ACTIVE after a resume, a non-linear
          edge no linear pipeline can express.
        test_recipe:
          setup:
            - "One ACTIVE subscription share 5.0 on a project."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden E", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Cyc Sub", utility_account_no: "ACC-5", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${subscription_id}/suspend"
              payload: {}
              as: ProgramAdmin
            - call: "POST /subscriptions/${subscription_id}/resume"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "Subscription.status == SUSPENDED after suspend"
            - "Subscription.status == ACTIVE after resume (cyclic return to ACTIVE)"

      - name: reconciliation_parallel_credit_x_dispute_dimensions
        grounds:
          - state_machines.Reconciliation.DRAFT_to_ISSUED
          - state_machines.Reconciliation.NONE_to_DISPUTED
          - entities.Reconciliation.fields.credit_status
          - entities.Reconciliation.fields.dispute_status
        distinguishing_aspect: |
          Parallel dimensions on the Reconciliation entity (different entity from
          Subscription): credit_status advances DRAFT→ISSUED while dispute_status
          independently advances NONE→DISPUTED on the same row, yielding the
          combined state (ISSUED, DISPUTED).
        test_recipe:
          setup:
            - "A RECONCILED period with one Reconciliation (credit_status DRAFT, dispute_status NONE)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden F", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Par Sub", utility_account_no: "ACC-6", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-04", forecast_production_kwh: 1000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /reconciliations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { recon_id: "$.data[0].id" }
          trigger:
            - call: "POST /reconciliations/${recon_id}/issue"
              payload: {}
              as: GridOperator
              captures: { cs: $.data.credit_status }
            - call: "POST /reconciliations/${recon_id}/dispute"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { ds: $.data.dispute_status, cs2: $.data.credit_status }
          assert:
            - "After issue, Reconciliation.credit_status == ISSUED and dispute_status == NONE"
            - "After dispute, Reconciliation.dispute_status == DISPUTED while credit_status remains ISSUED (parallel, independent dimensions)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reconcile_period_to_allocation_to_reconciliation_to_rec_depth3
        grounds:
          - state_machines.BillingPeriod.METERED_to_RECONCILED
          - entities.Allocation.fields.final_credit_cents
          - entities.Reconciliation.fields.net_savings_cents
          - entities.RECBatch.fields.rec_count
          - entities.SolarProject.fields.rec_minted_total
        distinguishing_aspect: |
          Depth-3 cascade from the reconcile trigger: period RECONCILED → each
          Allocation flips PROVISIONAL→FINAL and gets final_credit_cents (hop 1)
          → that FINAL allocation spawns a Reconciliation with gross/fee/net
          (hop 2) → minted RECBatch recomputes SolarProject.rec_minted_total
          (hop 3). Each hop is caused by the prior, not by reconcile directly.
        test_recipe:
          setup:
            - "A METERED period (metered 10000) with one FINAL-eligible allocation; single share-5.0 ACTIVE sub."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden G", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 1, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Casc Sub", utility_account_no: "ACC-7", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-05", forecast_production_kwh: 10000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 10000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
          trigger:
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /allocations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { alloc_status: "$.data[0].status", alloc_final: "$.data[0].final_credit_cents" }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { rec_minted: $.data.rec_minted_total }
          assert:
            - "hop1: Allocation.status == FINAL and final_credit_cents == 10000 (metered 10000 * 1)"
            - "hop2: exactly one Reconciliation exists for the period with net_savings_cents == 9100 (10000 - round(10000*0.10*0.90))"
            - "hop3: SolarProject.rec_minted_total == 10 (floor(10000/1000))"

      - name: cancel_releases_capacity_then_autopromotes_waitlist_depth2
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - entities.SolarProject.fields.available_kw
          - entities.SolarProject.fields.status
          - entities.WaitlistEntry.fields.status
          - entities.WaitlistEntry.fields.promoted_enrollment_id
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (cancel, not reconcile):
          cancel releases committed_kw so available_kw rises and project flips
          FULL→OPEN (hop 1); that newly-available capacity causes the oldest
          QUEUED WaitlistEntry to be PROMOTED, minting an Enrollment (hop 2).
        test_recipe:
          setup:
            - "Project nameplate 10kW; an ACTIVE share-10 subscription makes it FULL."
            - "One QUEUED WaitlistEntry requesting 5kW on the FULL project."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden H", state_code: "NY", nameplate_capacity_kw: 10, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Holder", utility_account_no: "ACC-8", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { holder_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Waiter", utility_account_no: "ACC-9", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { waiter_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${holder_id}", requested_share_kw: 10.0 }
              as: Subscriber
              as_user_id: "${holder_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${holder_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
            - call: "POST /waitlist-entries"
              payload: { project_id: "${proj_id}", subscriber_id: "${waiter_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${waiter_id}"
              captures: { wl_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${subscription_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${holder_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { avail: $.data.available_kw, pstatus: $.data.status }
            - call: "GET /waitlist-entries/${wl_id}"
              payload: {}
              as: ProgramAdmin
              captures: { wstatus: $.data.status, promoted_enr: $.data.promoted_enrollment_id }
          assert:
            - "hop1: SolarProject.available_kw == 10 and SolarProject.status == OPEN after cancel"
            - "hop2: WaitlistEntry.status == PROMOTED and promoted_enrollment_id is non-null (an Enrollment was minted)"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: full_gate_business_constraint_beats_capacity_business_fiscal
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_PROJECT_FULL]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_fiscal (priority 13, ERR_CAPACITY_EXCEEDED)
          vs business_constraint (priority 14, ERR_PROJECT_FULL). On a FULL
          project a resubmit that ALSO over-requests capacity returns the
          higher-priority ERR_CAPACITY_EXCEEDED (priority 13 wins over 14).
        test_recipe:
          setup:
            - "Project nameplate 10kW driven FULL by an ACTIVE share-10 subscription."
            - "A separate REJECTED enrollment requesting 12kW (over capacity AND project is FULL)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden I", state_code: "NY", nameplate_capacity_kw: 10, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Filler", utility_account_no: "ACC-10", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { filler_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Over Req", utility_account_no: "ACC-11", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { over_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${filler_id}", requested_share_kw: 10.0 }
              as: Subscriber
              as_user_id: "${filler_id}"
              captures: { fill_enr: $.data.id }
            - call: "POST /enrollments/${fill_enr}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${filler_id}"
            - call: "POST /enrollments/${fill_enr}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${fill_enr}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${over_id}", requested_share_kw: 12.0 }
              as: Subscriber
              as_user_id: "${over_id}"
              captures: { over_enr: $.data.id }
          trigger:
            - call: "POST /enrollments/${over_enr}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${over_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_CAPACITY_EXCEEDED (priority 13 business_fiscal), NOT ERR_PROJECT_FULL (priority 14 business_constraint)"

      - name: state_invalid_beats_carve_out_business_safety_on_activate
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CARVE_OUT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state (priority 8, ERR_INVALID_STATE) vs
          business_safety (priority 10, ERR_CARVE_OUT_EXCEEDED) — a DIFFERENT
          pairing from the first instance. Activating a DRAFT (not APPROVED)
          enrollment whose low-income share also exceeds carve_out_available_kw
          returns the higher-priority ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Project nameplate 100kW carve_out_pct 0.40 (carve_out_available 40kW)."
            - "Low-income enrollment requesting 41kW still in DRAFT (never submitted/approved)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden J", state_code: "NY", nameplate_capacity_kw: 100, carve_out_pct: 0.40, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "LI Big", utility_account_no: "ACC-12", state_code: "NY", is_low_income: true, annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 41.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_INVALID_STATE (priority 8 state, enrollment is DRAFT not APPROVED), NOT ERR_CARVE_OUT_EXCEEDED (priority 10 business_safety)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_gross_5000_vs_5001_on_reconcile
        grounds:
          - calculations.monthly_savings_reconciliation
          - entities.Reconciliation.fields.program_fee_cents
          - state_machines.BillingPeriod.METERED_to_RECONCILED
        distinguishing_aspect: |
          Numeric tier boundary on gross via POST /periods/{id}/reconcile: gross
          exactly 5000 uses TIER1 m=1.00 → fee 500; gross 5001 crosses into TIER2
          m=0.90 → fee 450. The >= vs > distinction at 5000 changes the fee by 50c.
        test_recipe:
          setup:
            - "Project credit_rate 5 c/kWh, program_fee_rate 0.10; metered 1000 → gross exactly 5000."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden K", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 5, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Bnd Sub", utility_account_no: "ACC-13", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-06", forecast_production_kwh: 1000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
          trigger:
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /reconciliations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { gross: "$.data[0].gross_credit_cents", fee: "$.data[0].program_fee_cents" }
          assert:
            - "Reconciliation.gross_credit_cents == 5000 (exactly TIER1_CENTS boundary)"
            - "Reconciliation.program_fee_cents == 500 (TIER1 m=1.00: round(5000*0.10*1.00)), confirming gross<=5000 uses TIER1 not TIER2"

      - name: rec_mint_zero_floor_under_1000_kwh_metered
        grounds:
          - calculations.rec_minting
          - entities.RECBatch.fields.rec_count
          - entities.SolarProject.fields.rec_minted_total
          - state_machines.BillingPeriod.METERED_to_RECONCILED
        distinguishing_aspect: |
          A DIFFERENT metric (whole-REC floor count, not a fee tier) on a DIFFERENT
          endpoint (REC minting at reconcile, observed via GET /rec-batches):
          metered 999 kWh floors to 0 RECs while 1000 kWh yields exactly 1 — the
          zero-count boundary at KWH_PER_REC=1000.
        test_recipe:
          setup:
            - "Project credit_rate 10; one share-5.0 ACTIVE sub; period metered 999 kWh (< KWH_PER_REC)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden L", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Rec Sub", utility_account_no: "ACC-14", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-07", forecast_production_kwh: 999 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 999, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
          trigger:
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /rec-batches"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { rec_count0: "$.data[0].rec_count" }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { rec_minted: $.data.rec_minted_total }
          assert:
            - "RECBatch.rec_count == 0 (floor(999/1000))"
            - "SolarProject.rec_minted_total == 0"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: period_close_blocked_by_disputed_reconciliation
        grounds:
          - state_machines.BillingPeriod.TRUED_UP_to_CLOSED
          - state_machines.Reconciliation.NONE_to_DISPUTED
          - entities.Reconciliation.fields.dispute_status
          - validations[priority=16]
          - errors[ERR_OPEN_DISPUTE_BLOCKS_CLOSE]
        distinguishing_aspect: |
          Entity pair BillingPeriod→Reconciliation: a BillingPeriod cannot
          transition TRUED_UP→CLOSED while any child Reconciliation has
          dispute_status == DISPUTED — the period's valid transition depends on a
          different entity's state.
        test_recipe:
          setup:
            - "A TRUED_UP period whose single Reconciliation is DISPUTED."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden M", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Disp Sub", utility_account_no: "ACC-15", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-08", forecast_production_kwh: 1000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /reconciliations"
              payload: { period_id: "${per_id}" }
              as: GridOperator
              captures: { recon_id: "$.data[0].id" }
            - call: "POST /reconciliations/${recon_id}/dispute"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /periods/${per_id}/true-up"
              payload: {}
              as: GridOperator
          trigger:
            - call: "POST /periods/${per_id}/close"
              payload: {}
              as: GridOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_OPEN_DISPUTE_BLOCKS_CLOSE; period stays TRUED_UP"

      - name: transfer_blocked_by_subscriber_jurisdiction_mismatch
        grounds:
          - state_machines.Subscription.ACTIVE_to_TRANSFERRING
          - entities.Subscriber.fields.state_code
          - entities.SolarProject.fields.state_code
          - validations[priority=11]
          - errors[ERR_TRANSFER_JURISDICTION_MISMATCH]
        distinguishing_aspect: |
          A DIFFERENT entity pair Subscription→Subscriber/SolarProject: a
          Subscription's ACTIVE→TRANSFERRING transition depends on the target
          Subscriber.state_code matching the SolarProject.state_code; a CA target
          on an NY project is rejected.
        test_recipe:
          setup:
            - "NY project with an ACTIVE share-5.0 subscription owned by an NY subscriber."
            - "A target subscriber registered in CA (mismatched jurisdiction)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden N", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id, proj_ver: $.data.version }
            - call: "POST /subscribers"
              payload: { full_name: "NY Holder", utility_account_no: "ACC-16", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "CA Target", utility_account_no: "ACC-17", state_code: "CA", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { target_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${owner_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${owner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${owner_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { proj_ver2: $.data.version }
          trigger:
            - call: "POST /subscriptions/${subscription_id}/transfer"
              payload: { target_subscriber_id: "${target_id}", expected_project_version: "${proj_ver2}" }
              as: Subscriber
              as_user_id: "${owner_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_TRANSFER_JURISDICTION_MISMATCH; subscription stays ACTIVE (no successor created)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_period_month_same_project_rejected
        grounds:
          - entities.BillingPeriod.fields.period_month
          - validations[priority=7]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          Interval semantics = exact month-bucket occupancy on the SolarProject
          resource: two BillingPeriods cannot occupy the same period_month for one
          project (point/discrete-bucket overlap). A second 2026-09 period on the
          same project collides and is rejected.
        test_recipe:
          setup:
            - "A project with an existing 2026-09 BillingPeriod."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden O", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-09", forecast_production_kwh: 1000 }
              as: GridOperator
          trigger:
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-09", forecast_production_kwh: 2000 }
              as: GridOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_DUPLICATE_RESOURCE; no second period is created for 2026-09"

      - name: duplicate_utility_account_no_across_subscribers_rejected
        grounds:
          - entities.Subscriber.fields.utility_account_no
          - validations[priority=7]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          A DIFFERENT interval semantics and DIFFERENT resource entity: global
          (project-independent) uniqueness occupancy of utility_account_no across
          ALL Subscribers — the geometric treatment is a single global namespace,
          not a per-project month bucket. A second subscriber reusing ACC-DUP is
          rejected.
        test_recipe:
          setup:
            - "A subscriber already registered with utility_account_no ACC-DUP."
          setup_api_calls:
            - call: "POST /subscribers"
              payload: { full_name: "First", utility_account_no: "ACC-DUP", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /subscribers"
              payload: { full_name: "Second", utility_account_no: "ACC-DUP", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_DUPLICATE_RESOURCE; the second subscriber is not created"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_conserves_project_committed_kw
        grounds:
          - state_machines.Subscription.ACTIVE_to_TRANSFERRING
          - state_machines.Subscription.TRANSFERRING_to_CANCELLED
          - entities.SolarProject.fields.committed_kw
          - entities.SolarProject.fields.available_kw
          - entities.Subscription.fields.transferred_from_subscription_id
        distinguishing_aspect: |
          Conserved quantity = SolarProject.committed_kw (capacity in kW). A
          transfer creates a successor ACTIVE subscription holding the same
          share_kw and CANCELS the original; the forward+compensating pair leaves
          committed_kw unchanged: committed_kw_after == committed_kw_before
          (net change 0).
        test_recipe:
          setup:
            - "NY project nameplate 100kW with an ACTIVE share-5.0 subscription (committed_kw 5)."
            - "An NY target subscriber for the transfer."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden P", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "P Owner", utility_account_no: "ACC-18", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "P Target", utility_account_no: "ACC-19", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { target_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${owner_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${owner_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${owner_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { committed_before: $.data.committed_kw, proj_ver: $.data.version }
          trigger:
            - call: "POST /subscriptions/${subscription_id}/transfer"
              payload: { target_subscriber_id: "${target_id}", expected_project_version: "${proj_ver}" }
              as: Subscriber
              as_user_id: "${owner_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { committed_after: $.data.committed_kw, avail_after: $.data.available_kw }
          assert:
            - "SolarProject.committed_kw == 5 both before and after the transfer (invariant: committed_kw unchanged)"
            - "SolarProject.available_kw == 95 after the transfer (100 - 5, unchanged)"

      - name: reopen_then_reconcile_conserves_rec_minted_total
        grounds:
          - state_machines.BillingPeriod.METERED_to_RECONCILED
          - state_machines.BillingPeriod.RECONCILED_to_METERED
          - entities.SolarProject.fields.rec_minted_total
          - entities.BillingPeriod.fields.rec_minted_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (whole RECs, SolarProject.rec_minted_total)
          than committed_kw. Reconcile mints 10 RECs; reopen (RECONCILED→METERED)
          is the compensating action that deletes the minted batch; a second
          reconcile re-mints exactly 10 — rec_minted_total returns to 10 with no
          drift.
        test_recipe:
          setup:
            - "A RECONCILED period (metered 10000 → 10 RECs minted) on a project, with no APPLIED reconciliations."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Garden Q", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10, program_fee_rate: 0.10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Q Sub", utility_account_no: "ACC-20", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2026-10", forecast_production_kwh: 10000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 10000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver2}" }
              as: GridOperator
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { minted_before: $.data.rec_minted_total }
          trigger:
            - call: "POST /periods/${per_id}/reopen"
              payload: {}
              as: GridOperator
            - call: "GET /periods/${per_id}"
              payload: {}
              as: GridOperator
              captures: { per_ver3: $.data.version }
            - call: "POST /periods/${per_id}/reconcile"
              payload: { expected_period_version: "${per_ver3}" }
              as: GridOperator
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { minted_after: $.data.rec_minted_total }
          assert:
            - "SolarProject.rec_minted_total == 10 before the reopen (floor(10000/1000))"
            - "SolarProject.rec_minted_total == 10 after reopen+reconcile (compensating reopen left zero drift)"
