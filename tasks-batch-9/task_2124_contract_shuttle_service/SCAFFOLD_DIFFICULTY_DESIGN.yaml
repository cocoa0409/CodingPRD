              as: OpsPlanner
              captures: { d12a: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Marc Bell", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { d12b: $.data.id }
            - call: "POST /routes/${r12}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${r12}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { g1: "$.data[0].id", g2: "$.data[1].id" }
            - call: "POST /trips/${g1}/assign"
              payload: { vehicle_id: "${v12a}", driver_id: "${d12a}" }
