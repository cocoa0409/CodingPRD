      - name: auth_vs_existence_on_claim_read
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
        distinguishing_aspect: |
          Pair auth (P1/P2) vs existence (P4): a request with a missing role
          header AND a nonexistent claim id must yield
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (P1), and a request with a
          valid-but-unauthorized role AND nonexistent id must yield
          ERR_INSUFFICIENT_PERMISSIONS (P2) before any 404 is considered.
        test_recipe:
          setup:
            - "empty DB is sufficient; no claim exists with the probed id"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /claims/00000000-0000-0000-0000-000000000000/verify-coverage"
              payload: {}
              as: Policyholder
              captures: { err_role: "$.data.error_id" }
            - call: "POST /claims/00000000-0000-0000-0000-000000000000/verify-coverage"
              payload: {}
              as: ClaimAdjuster
              captures: { err_exist: "$.data.error_id" }
          assert:
            - "unauthorized-role call: err_role == ERR_INSUFFICIENT_PERMISSIONS (P2 before existence P4)"
            - "authorized-role call on missing claim: err_exist == ERR_CLAIM_NOT_FOUND (P4 reached only after P1-P3 pass)"

  # ===========================================================================
