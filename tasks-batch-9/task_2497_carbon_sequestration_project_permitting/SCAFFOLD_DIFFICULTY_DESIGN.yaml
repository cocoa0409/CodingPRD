  - rule_id: boundary_precision_check
    instances:
      - name: mrv_coverage_exactly_seventy_approves_with_conditions
        grounds:
          - calculations.mrv_coverage_score
          - validations[priority=88]
          - state_machines.MonitoringPlan.REVIEW_COMPLETE_to_APPROVED_WITH_CONDITIONS
          - entities.MonitoringPlan.fields.coverage_score
          - entities.StorageProject.fields.effective_annual_monitoring_cost_usd
        distinguishing_aspect: |
          Boundary on the coverage_score metric at exactly CONDITIONS_SCORE_THRESHOLD 70.00, exercised on
          POST /ccs/monitoring-plans/{id}/review: a plan scoring exactly 70.00 must be APPROVED_WITH_CONDITIONS
          (not rejected by ERR_MRV_COVERAGE_BELOW_MINIMUM and not APPROVED), and the conditional branch must
          uplift StorageProject.effective_annual_monitoring_cost_usd to exactly 230000.00.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with annual_monitoring_cost_usd 200000 and effective_annual_monitoring_cost_usd 200000"
            - "one MonitoringPlan 'MRV-1' in status SUBMITTED whose three ACTIVE methods give subsurface 1.0000, surface 0.5000 and atmospheric 0.2500"
            - "both review tracks still open"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /ccs/monitoring-plans"
              payload: { project_id: "${proj_id}", plan_label: "MRV-1" }
