            - call: "POST /glass-plant/forming-machines"
              payload: { furnace_id: "${f}", code: "IS-V3", section_count: 10, max_cavities: 40, primary_mold_family: "NNPB", changeover_buffer_minutes: 45 }
              as: PlantManager
              captures: { m: "$.data.id" }
            - call: "POST /glass-plant/customers"
              payload: { name: "Iota Filling", account_code: "CUST-V3", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-V3", color: "FLINT", capacity_ml: 500.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 500.00, container_price_usd: 0.1500, mold_owner: "PLANT" }
              as: MoldEngineer
