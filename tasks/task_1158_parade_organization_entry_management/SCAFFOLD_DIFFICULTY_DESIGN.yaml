            - "LineupAssignment ${la2}.status remains TENTATIVE; StagingArea.reserved_slots == 1"
            - "HTTP status 409"

      - name: marshal_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.marshal_window_overlap
          - errors[ERR_MARSHAL_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Different interval semantics on a different resource: marshal shifts are
          HALF-OPEN [shift_start, shift_end), so a shift starting exactly when another
          ends is legal (adjacency allowed — opposite of the buffered closed staging
          rule), while a truly overlapping shift for the same marshal is rejected.
        test_recipe:
          setup:
            - "One parade with one route segment; marshal marshal_1 holds a CONFIRMED shift [08:00, 09:00) and an ASSIGNED shift [09:00, 10:00) (adjacent — accepted)"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Marshal Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin, captures: { seg_id: $.data.id } }
            - { call: "POST /parades/${p_id}/marshal-assignments", payload: { route_segment_id: "${seg_id}", marshal_user_id: "marshal_1", shift_start: "2026-07-04T08:00:00Z", shift_end: "2026-07-04T09:00:00Z" }, as: CommitteeAdmin, captures: { ma1: $.data.id } }
            - { call: "POST /marshal-assignments/${ma1}/confirm", payload: {}, as: Marshal, as_user_id: "marshal_1" }
            - { call: "POST /parades/${p_id}/marshal-assignments", payload: { route_segment_id: "${seg_id}", marshal_user_id: "marshal_1", shift_start: "2026-07-04T09:00:00Z", shift_end: "2026-07-04T10:00:00Z" }, as: CommitteeAdmin, captures: { ma2: $.data.id, ma2_status: $.data.status } }
          trigger:
            - { call: "POST /parades/${p_id}/marshal-assignments", payload: { route_segment_id: "${seg_id}", marshal_user_id: "marshal_1", shift_start: "2026-07-04T08:30:00Z", shift_end: "2026-07-04T09:30:00Z" }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "the adjacent shift [09:00, 10:00) was accepted (status ASSIGNED) — half-open semantics treat shift_start == prior shift_end as non-overlapping"
            - "the overlapping shift [08:30, 09:30) is rejected with ERR_MARSHAL_WINDOW_OVERLAP (08:00 < 09:30 and 08:30 < 09:00)"
            - "HTTP status 409"

  - rule_id: compensating_invariant
    instances:
      - name: confirm_then_pull_restores_reserved_slots
        grounds:
          - state_machines.LineupAssignment.TENTATIVE_to_CONFIRMED
          - state_machines.LineupAssignment.CONFIRMED_to_PULLED
          - entities.StagingArea.fields.reserved_slots
        distinguishing_aspect: |
          Conserved quantity = staging slot COUNT: reserved_slots is pinned as the
          count of assignments with status in {CONFIRMED, CHECKED_IN}; a confirm
          (+1) followed by its compensating pull (-1) must return the quantity to
          exactly its pre-confirm value — zero drift.
        test_recipe:
          setup:
            - "Parade OPERATIONAL; staging capacity 3 with reserved_slots == 0; one certified paid FLOAT entry with a TENTATIVE assignment"
          setup_api_calls:
            - { call: "POST /parades", payload: { name: "Invariant Parade", parade_date: "2026-07-04T10:00:00Z", entry_deadline: "2026-06-20T23:59:59Z" }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /parades/${p_id}/route-segments", payload: { order_index: 1, name: "Main St", length_meters: 800, emergency_lane_width_m: 3.5, segment_window_start: "2026-07-04T10:00:00Z", segment_window_end: "2026-07-04T12:00:00Z" }, as: CommitteeAdmin }
