          trigger:
            - call: "POST /discipline-incidents/${inc}/consequences"
              payload: { type: "OUT_OF_SCHOOL_SUSPENSION", start_day_index: 3, duration_days: 2 }
              as: Administrator
              as_user_id: "admin-1"
              captures: { cons: $.data.id }
          assert:
            - "DisciplineConsequence.${cons}.absence_code_applied == ABSENT_EXCUSED"
            - "AttendanceRecord exists with source=SYSTEM_SUSPENSION for enrollment ${enr} on day_index 3 and day_index 4"
            - "DailyAttendance[enrollment=${enr},day=3].daily_code == ABSENT and ada_eligible == false"
            - "Enrollment.${enr}.present_days == 3"

      - name: withdraw_cascade_depth2_section_enrolled_count
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.Section.fields.enrolled_count
          - entities.ScheduleAssignment.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (enrollment withdraw): withdraw -> each ENROLLED
          ScheduleAssignment flips to DROPPED (link1) -> each parent Section.enrolled_count
          decrements (link2, caused by link1). Distinct propagation pattern and trigger from the
          OSS depth-3 cascade.
        test_recipe:
          setup:
            - "One school clock at day 2, one enrolled student seated in two sections (enrolled_count 1 each)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Wd School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 2 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-W1", first_name: "Wes", last_name: "Wd", grade_level: "11", birth_date: "2008-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "CHEM", title: "Chemistry", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec1: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 2 }
              as: Registrar
              captures: { sec2: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec1}" }
              as: Registrar
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec2}" }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: { exit_day_index: 2 }
              as: Registrar
          assert:
            - "Enrollment.${enr}.status == WITHDRAWN"
            - "All ScheduleAssignments of enrollment ${enr} have status == DROPPED"
            - "Section.${sec1}.enrolled_count == 0 and Section.${sec2}.enrolled_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: begin_review_state_vs_segregation_priority
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.DisciplineIncident.REFERRED_to_UNDER_REVIEW
        distinguishing_aspect: |
          A begin-review attempt by the referring teacher's identity on an already-DISMISSED incident
          violates BOTH state (p6, ERR_INCIDENT_NOT_REFERRED) and segregation-of-duties (p7,
          ERR_SEGREGATION_OF_DUTIES). The lower-priority state check wins -> ERR_INCIDENT_NOT_REFERRED.
          Error-category pair: state vs business_safety.
        test_recipe:
          setup:
            - "Incident filed by user u-dual, then dismissed by admin-1, leaving it terminal DISMISSED; the begin-review is attempted by an Administrator using X-User-ID u-dual (the original referrer)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "PP1 School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-P1", first_name: "Pat", last_name: "Pp", grade_level: "9", birth_date: "2010-05-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "DISRUPTION", severity: 1, incident_day_index: 1 }
              as: Administrator
              as_user_id: "u-dual"
              captures: { inc: $.data.id }
            - call: "POST /discipline-incidents/${inc}/dismiss"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "u-dual"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INCIDENT_NOT_REFERRED (state priority 6 wins over segregation priority 7)"
            - "DisciplineIncident.${inc}.status == DISMISSED (unchanged)"

      - name: schedule_period_conflict_vs_capacity_priority
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - entities.Section.fields.capacity
        distinguishing_aspect: |
          A schedule-assignment that both collides on period (the enrollment already holds a
          period-1 seat) AND targets a full section (capacity reached) violates business_temporal
          (p9, ERR_SCHEDULE_PERIOD_CONFLICT) and business_constraint (p11,
          ERR_SECTION_CAPACITY_EXCEEDED); the lower-priority temporal check wins.
        test_recipe:
          setup:
            - "Student A holds a period-1 seat. A capacity-1 period-1 section is already full (student B seated). Student A then tries to seat into the full period-1 section."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "PP2 School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-A2", first_name: "Aaa", last_name: "Pp", grade_level: "9", birth_date: "2010-06-01" }
              as: Registrar
              captures: { stuA: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-B2", first_name: "Bbb", last_name: "Pp", grade_level: "9", birth_date: "2010-07-01" }
              as: Registrar
              captures: { stuB: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stuA}", entry_day_index: 1 }
              as: Registrar
              captures: { enrA: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stuB}", entry_day_index: 1 }
              as: Registrar
              captures: { enrB: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "ART", title: "Art", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, capacity: 1 }
              as: Registrar
              captures: { secFull: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-2", period: 1, capacity: 30 }
              as: Registrar
              captures: { secOther: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enrB}", section_id: "${secFull}" }
              as: Registrar
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enrA}", section_id: "${secOther}" }
              as: Registrar
          trigger:
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enrA}", section_id: "${secFull}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_PERIOD_CONFLICT (temporal priority 9 wins over capacity priority 11)"
            - "Section.${secFull}.enrolled_count == 1 (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: days_present_minute_floor_boundary
        grounds:
          - calculations.ada_eligible_day
          - entities.School.fields.minimum_daily_minutes
          - entities.AttendanceRecord.fields.present_minutes
        distinguishing_aspect: |
          DAYS_PRESENT eligibility uses present_minutes_total >= minimum_daily_minutes (240):
          a single section meeting exactly 240 minutes marked PRESENT is ada_eligible (>=), but a
          230-minute section marked PRESENT (230 < 240) is NOT eligible. Boundary metric: instructional
          minutes via the attendance/daily-attendance endpoint.
        test_recipe:
          setup:
            - "DAYS_PRESENT school min 240, clock day 1. Enrollment E230 in a 230-minute section (present day 1); enrollment E240 in a 240-minute section (present day 1)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Floor School", state_code: "CA", ada_method: "DAYS_PRESENT", minimum_daily_minutes: 240, session_total_days: 180 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 1 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-F2", first_name: "Fae", last_name: "Floor", grade_level: "3", birth_date: "2016-01-01" }
              as: Registrar
              captures: { stu230: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-F4", first_name: "Fin", last_name: "Floor", grade_level: "3", birth_date: "2016-02-01" }
              as: Registrar
              captures: { stu240: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu230}", entry_day_index: 1 }
              as: Registrar
              captures: { enr230: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu240}", entry_day_index: 1 }
              as: Registrar
              captures: { enr240: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "RDG3", title: "Reading 3", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 230 }
              as: Registrar
              captures: { sec230: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 2, meeting_minutes: 240 }
              as: Registrar
              captures: { sec240: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr230}", section_id: "${sec230}" }
              as: Registrar
              captures: { sa230: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr240}", section_id: "${sec240}" }
              as: Registrar
              captures: { sa240: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa230}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa240}", day_index: 1, code: "PRESENT" }
              as: Teacher
          trigger:
            - call: "GET /enrollments/${enr240}/daily-attendance"
              payload: { day_index: 1 }
              as: Registrar
              captures: { e240: "$.data[0].ada_eligible" }
            - call: "GET /enrollments/${enr230}/daily-attendance"
              payload: { day_index: 1 }
              as: Registrar
              captures: { e230: "$.data[0].ada_eligible" }
          assert:
            - "DailyAttendance[enrollment=${enr240},day=1].ada_eligible == true (240 >= 240)"
            - "DailyAttendance[enrollment=${enr230},day=1].ada_eligible == false (230 < 240)"
            - "Enrollment.${enr240}.present_days == 1 and Enrollment.${enr230}.present_days == 0"

      - name: finalize_empty_standard_score_set_boundary
        grounds:
          - state_machines.ReportCard.DRAFT_to_FINALIZED
          - errors[ERR_INCOMPLETE_GRADES]
          - entities.StandardScore.fields.mastery_level
        distinguishing_aspect: |
          Empty-collection boundary on a different endpoint: an enrollment seated in two sections
          where one section has zero StandardScore rows cannot be finalized — the empty score set
          for that section triggers ERR_INCOMPLETE_GRADES at POST /report-cards/{id}/finalize.
        test_recipe:
          setup:
            - "Enrolled student seated in section graded (1 score) and section ungraded (0 scores); a DRAFT report card exists."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Empty School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-E1", first_name: "Eve", last_name: "Empty", grade_level: "9", birth_date: "2010-08-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "ALG", title: "Algebra", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { secG: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 2 }
              as: Registrar
              captures: { secU: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${secG}" }
              as: Registrar
              captures: { saG: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${secU}" }
              as: Registrar
              captures: { saU: $.data.id }
            - call: "POST /standard-scores"
              payload: { schedule_assignment_id: "${saG}", standard_code: "ALG.1", mastery_level: 3, weight: 1.0 }
              as: Teacher
            - call: "POST /report-cards"
              payload: { enrollment_id: "${enr}", term_label: "Q1" }
              as: Teacher
              captures: { rc: $.data.id, rcv: $.data.version }
          trigger:
            - call: "POST /report-cards/${rc}/finalize"
              payload: { expected_report_card_version: "${rcv}" }
              as: Teacher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INCOMPLETE_GRADES"
            - "ReportCard.${rc}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_assignment_requires_enrollment_active_and_section_open
        grounds:
          - validations[priority=13]
          - state_machines.Section.OPEN_to_CLOSED
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          ScheduleAssignment creation depends on TWO sibling entities: the Enrollment must be ACTIVE
          and the Section must be OPEN. Seating into a CLOSED section is rejected with
          ERR_SECTION_NOT_OPEN even though the enrollment is valid — entity pair Section/Enrollment.
        test_recipe:
          setup:
            - "Active enrollment and a section that has been CLOSED."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "CE1 School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-CE1", first_name: "Cas", last_name: "Ce", grade_level: "9", birth_date: "2010-09-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "GEO", title: "Geometry", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /sections/${sec}/close"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SECTION_NOT_OPEN"
            - "Section.${sec}.enrolled_count == 0 (no seat created)"

      - name: ada_certify_requires_no_active_enrollment_missing_attendance
        grounds:
          - state_machines.AdaFundingReport.DRAFT_to_CERTIFIED
          - errors[ERR_ATTENDANCE_NOT_POSTED]
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          AdaFundingReport certification depends on a different entity pair (AdaFundingReport/
          Enrollment): if any in-scope ACTIVE enrollment has zero DailyAttendance through
          as_of_day_index, certify is rejected with ERR_ATTENDANCE_NOT_POSTED even though the report
          is DRAFT and the certifier passes segregation-of-duties.
        test_recipe:
          setup:
            - "School clock at day 2 with one ACTIVE enrollment that has NO attendance posted; a DRAFT ADA report drafted by registrar-drafter through day 2."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "CE2 School", state_code: "CA", ada_method: "DAYS_PRESENT", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 2 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-CE2", first_name: "Cyd", last_name: "Ce", grade_level: "9", birth_date: "2010-10-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /ada-funding-reports"
              payload: { school_id: "${sch}", as_of_day_index: 2 }
              as: Registrar
              as_user_id: "registrar-drafter"
              captures: { rep: $.data.id, repv: $.data.version }
          trigger:
            - call: "POST /ada-funding-reports/${rep}/certify"
              payload: { expected_report_version: "${repv}" }
              as: StateReportingOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ATTENDANCE_NOT_POSTED"
            - "AdaFundingReport.${rep}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: section_period_point_exclusivity_overlap
        grounds:
          - validations[priority=9]
          - entities.ScheduleAssignment.fields.period
          - errors[ERR_SCHEDULE_PERIOD_CONFLICT]
        distinguishing_aspect: |
          Point-slot overlap on the Section/period resource: a second ENROLLED ScheduleAssignment
          for the same enrollment in the same period (both period 1) collides on the discrete period
          slot and is rejected — interval semantics are exact-point equality of the period index.
        test_recipe:
          setup:
            - "Enrollment already seated in a period-1 section; a second distinct period-1 section exists OPEN."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "TO1 School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-T1", first_name: "Tim", last_name: "To", grade_level: "9", birth_date: "2010-11-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "MUS", title: "Music", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec1: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-2", period: 1 }
              as: Registrar
              captures: { sec1b: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec1}" }
              as: Registrar
          trigger:
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec1b}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SCHEDULE_PERIOD_CONFLICT"
            - "Section.${sec1b}.enrolled_count == 0"

      - name: attendance_half_open_membership_window_overlap
        grounds:
          - validations[priority=10]
          - entities.Enrollment.fields.exit_day_index
          - errors[ERR_ATTENDANCE_OUTSIDE_WINDOW]
        distinguishing_aspect: |
          Half-open interval overlap on the Enrollment membership resource: membership is
          [entry_day_index, exit_day_index). After withdrawal effective exit_day_index=3, posting
          attendance on day_index=3 collides with the EXCLUSIVE upper boundary (3 is outside [1,3))
          and is rejected — interval semantics are half-open range containment, distinct from the
          point-slot equality of the period rule.
        test_recipe:
          setup:
            - "Enrollment entry_day_index=1, clock at day 3, seated in a section; then withdrawn with exit_day_index=3, so the active window is [1,3)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "TO2 School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 3 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-T2", first_name: "Tia", last_name: "To", grade_level: "9", birth_date: "2010-12-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "DRMA", title: "Drama", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 1, code: "ABSENT_EXCUSED" }
              as: Teacher
            - call: "POST /enrollments/${enr}/withdraw"
              payload: { exit_day_index: 3 }
              as: Registrar
          trigger:
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 3, code: "PRESENT" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ATTENDANCE_OUTSIDE_WINDOW (day 3 outside half-open [1,3))"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: suspension_rescind_preserves_present_days
        grounds:
          - state_machines.DisciplineConsequence.ACTIVE_to_RESCINDED
          - calculations.enrollment_present_days
          - entities.AttendanceRecord.fields.status
        distinguishing_aspect: |
          Conserved quantity = enrollment.present_days (ADA-eligible present days). Attaching an OSS
          (present_days 5 -> 3) and then rescinding it MUST restore present_days to exactly 5: the
          forward cascade and its compensating rescind leave present_days == enrollment_present_days
          over the restored RECORDED set unchanged.
        test_recipe:
          setup:
            - "AGGREGATE_MEMBERSHIP school clock at day 5, enrollment PRESENT days 1-5 (present_days=5), incident UNDER_REVIEW, OSS attached for days 3-4 (present_days now 3)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "CI1 School", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 5 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-CI1", first_name: "Cin", last_name: "Ci", grade_level: "8", birth_date: "2011-03-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "HEALTH", title: "Health", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 240 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 1, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 2, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 3, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 4, code: "PRESENT" }
              as: Teacher
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 5, code: "PRESENT" }
              as: Teacher
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "FIGHTING", severity: 3, incident_day_index: 2 }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { inc: $.data.id }
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
            - call: "POST /discipline-incidents/${inc}/consequences"
              payload: { type: "OUT_OF_SCHOOL_SUSPENSION", start_day_index: 3, duration_days: 2 }
              as: Administrator
              as_user_id: "admin-1"
              captures: { cons: $.data.id }
          trigger:
            - call: "POST /discipline-consequences/${cons}/rescind"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
          assert:
            - "DisciplineConsequence.${cons}.status == RESCINDED"
            - "Enrollment.${enr}.present_days == 5 (restored to pre-suspension value)"
            - "No RECORDED AttendanceRecord with source=SYSTEM_SUSPENSION remains for enrollment ${enr}"

      - name: seat_then_drop_preserves_section_enrolled_count
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.Section.fields.enrolled_count
          - state_machines.Section.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = Section.enrolled_count (a seat count, distinct from present_days).
          Seating an enrollment into an OPEN section (enrolled_count 0 -> 1) and then dropping that
          assignment MUST return enrolled_count to exactly 0 — the seat-then-drop pair conserves the
          section's occupancy invariant.
        test_recipe:
          setup:
            - "An OPEN section with enrolled_count 0; an active enrollment is seated (enrolled_count 1)."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "CI2 School", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-CI2", first_name: "Coe", last_name: "Ci", grade_level: "9", birth_date: "2010-02-15" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "SPAN", title: "Spanish", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, capacity: 30 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /schedule-assignments/${sa}/drop"
              payload: {}
              as: Registrar
          assert:
            - "ScheduleAssignment.${sa}.status == DROPPED"
            - "Section.${sec}.enrolled_count == 0 (restored to pre-seat value)"
