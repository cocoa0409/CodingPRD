scaffold_corner_design:
  # ==================================================================
  - section: entities
    instances:
      - name: borrower_create_missing_required_tax_id
        claim_type: required_fields
        grounds:
          - "entities.Borrower.fields.tax_id"
          - "endpoints[\"POST /borrowers\"]"
        distinguishing_aspect: "Omitting required tax_id -> 400 ERR_INVALID_REQUEST; no Borrower persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /borrowers", payload: { legal_name: "No Tax Co", contact_email: "ntc@x.com" }, as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "response 400 with error_id == ERR_INVALID_REQUEST"
      - name: loan_create_defaults_current_balance_to_principal
        claim_type: defaults
        grounds:
          - "entities.Loan.fields.current_balance_cents"
        distinguishing_aspect: "Omitting optional current_balance_cents defaults it to original_principal_cents."
        test_recipe:
          setup: ["one borrower"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Default Co", tax_id: "TX-DEF", contact_email: "def@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-DEF", original_principal_cents: 750000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { bal: $.data.current_balance_cents, pay: $.data.payment_status, srv: $.data.servicing_status, ver: $.data.version } }
          assert:
            - "Loan.current_balance_cents == 750000000 (defaulted from principal)"
            - "payment_status == CURRENT, servicing_status == PERFORMING, version == 1"
      - name: loan_create_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Loan.fields.payment_status"
          - "entities.Loan.fields.servicing_status"
        distinguishing_aspect: "Client-supplied system/computed fields (payment_status, servicing_status, current_dscr) are ignored, not honored."
        test_recipe:
          setup: ["one borrower"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Smuggle Co", tax_id: "TX-SMG", contact_email: "smg@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SMG", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING", payment_status: "DEFAULT", servicing_status: "SPECIAL_SERVICING" }, as: MasterServicer, captures: { pay: $.data.payment_status, srv: $.data.servicing_status, dscr: $.data.current_dscr } }
          assert:
            - "payment_status == CURRENT and servicing_status == PERFORMING despite smuggled values"
            - "current_dscr == null (computed field never client-set)"
      - name: loan_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints[\"GET /loans/{id}\"]"
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /loans/00000000-0000-0000-0000-000000000000", as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"
      - name: loans_list_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope.pagination_fields"
          - "endpoints[\"GET /loans\"]"
        distinguishing_aspect: "limit/offset/total_count/has_more behave per envelope contract across two pages."
        test_recipe:
          setup: ["one borrower with three loans"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Pager Co", tax_id: "TX-PAG", contact_email: "pag@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-P1", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-P2", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-P3", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer }
          trigger:
            - { call: "GET /loans?limit=2&offset=0", as: MasterServicer }
            - { call: "GET /loans?limit=2&offset=2", as: MasterServicer }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"
      - name: property_create_unknown_loan_returns_404
        claim_type: parent_relationships
        grounds:
          - "entities.Property.fields.loan_id"
          - "endpoints[\"POST /loans/{id}/properties\"]"
        distinguishing_aspect: "Child creation under a non-existent parent loan id -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /loans/00000000-0000-0000-0000-000000000000/properties", payload: { address: "1 Nowhere", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND"
      - name: loan_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.Loan.fields.dscr_basis"
        distinguishing_aspect: "dscr_basis outside {TTM, T3_ANNUALIZED} -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one borrower"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Enum Co", tax_id: "TX-ENU", contact_email: "enu@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ENU", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "WEEKLY", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST"
      - name: disbursement_create_empty_line_items_returns_400
        claim_type: type_constraints
        grounds:
          - "entities.DisbursementRequest.fields.line_items"
        distinguishing_aspect: "Empty line_items array -> 400 ERR_INVALID_REQUEST (at least one positive line required)."
        test_recipe:
          setup: ["clean loan; TI_LC reserve version 1"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Lines Co", tax_id: "TX-LIN", contact_email: "lin@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-LIN", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id, r_v: $.data.version } }
          trigger:
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [], expected_reserve_account_version: "${r_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "400 with error_id == ERR_INVALID_REQUEST"
      - name: statement_late_flag_and_due_date_computed
        claim_type: computed_fields
        grounds:
          - "entities.FinancialStatement.fields.due_date"
          - "entities.FinancialStatement.fields.submitted_late"
          - "calculations.collection_cadence"
        distinguishing_aspect: "due_date is period_end + 15d (RENT_ROLL) or + 45d (OPERATING_STATEMENT); submitted_late compares submission clock to due_date."
        test_recipe:
          setup: ["loan with origination 2026-01-01; clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Late Co", tax_id: "TX-LAT", contact_email: "lat@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-LAT", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2026-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", net_operating_income_cents: 5000000 }, as: Borrower, as_user_id: "${b_id}", captures: { os_due: $.data.due_date, os_late: $.data.submitted_late } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "RENT_ROLL", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", occupancy_pct: 90 }, as: Borrower, as_user_id: "${b_id}", captures: { rr_due: $.data.due_date, rr_late: $.data.submitted_late } }
          assert:
            - "OPERATING_STATEMENT due_date == 2026-05-15T00:00:00Z (Q1 end 2026-03-31 + 45d), submitted_late == true"
            - "RENT_ROLL due_date == 2026-04-15T00:00:00Z (+ 15d), submitted_late == true"

  # ==================================================================
  - section: state_machines
    instances:
      - name: statement_second_review_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.FinancialStatement"
          - "errors[ERR_STATEMENT_ALREADY_REVIEWED]"
        distinguishing_aspect: "Reviewing an already-ACCEPTED statement -> 409 ERR_STATEMENT_ALREADY_REVIEWED; no duplicate assessment created."
        test_recipe:
          setup: ["loan (T3, threshold 1.0); one ACCEPTED operating statement (NOI 20000000 -> DSCR 1.3333 conforming)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Twice Co", tax_id: "TX-TWC", contact_email: "twc@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-TWC", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 20000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
          trigger:
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "REJECT", rejection_reason: "duplicate" }, as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_STATEMENT_ALREADY_REVIEWED"
            - "statement remains ACCEPTED; exactly 1 covenant assessment exists for the loan"
      - name: fund_submitted_request_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DisbursementRequest.SUBMITTED_to_APPROVED"
        distinguishing_aspect: "Funding a SUBMITTED (never approved) request -> 409 ERR_INVALID_STATE; reserve untouched."
        test_recipe:
          setup: ["clean loan; reserve with deposit 1000000 (version 2); one SUBMITTED draw of 100000"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Skip Co", tax_id: "TX-SKP", contact_email: "skp@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SKP", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id } }
            - { call: "POST /reserve-accounts/${r_id}/deposits", payload: { amount_cents: 1000000 }, as: MasterServicer, captures: { r_v: $.data.version } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "paint", amount_cents: 100000 } ], expected_reserve_account_version: "${r_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /disbursement-requests/${d_id}/fund", as: MasterServicer, payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE"
            - "reserve balance_cents == 1000000, held_cents == 0"
      - name: exercise_expired_option_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ExtensionOption.AVAILABLE_to_EXPIRED"
        distinguishing_aspect: "Clock sweep past window end flips AVAILABLE -> EXPIRED; exercise from EXPIRED -> 409 ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["clean loan (origination 2026-08-01 to avoid sweep noise, maturity 2027-06-30); option seq 1 window [2026-08-15, 2026-09-15]"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Late Ex Co", tax_id: "TX-LTX", contact_email: "ltx@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-LTX", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2026-08-01T00:00:00Z", maturity_date: "2027-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/extension-options", payload: { option_seq: 1, exercise_window_start: "2026-08-15T00:00:00Z", exercise_window_end: "2026-09-15T00:00:00Z", extension_months: 12, fee_pct: 0.0025 }, as: MasterServicer, captures: { e_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: MasterServicer }
          trigger:
            - { call: "POST /extension-options/${e_id}/exercise", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "option status == EXPIRED after the sweep"
            - "exercise -> 409 ERR_INVALID_STATE (terminal; not ERR_EXTENSION_WINDOW_CLOSED because state check precedes temporal)"
      - name: lease_double_submit_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Lease.DRAFT_to_SUBMITTED"
        distinguishing_aspect: "Submitting an already-SUBMITTED lease -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["clean loan with property; one SUBMITTED lease"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Dbl Co", tax_id: "TX-DBL", contact_email: "dbl@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-DBL", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Dbl St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /properties/${p_id}/leases", payload: { tenant_name: "T1", suite_ref: "STE-1", commencement_date: "2026-09-01T00:00:00Z", expiry_date: "2027-08-31T00:00:00Z", base_rent_cents_monthly: 100000, sqft: 1000, term_months: 12 }, as: Borrower, as_user_id: "${b_id}", captures: { le_id: $.data.id } }
            - { call: "POST /leases/${le_id}/submit", as: Borrower, as_user_id: "${b_id}", payload: {} }
          trigger:
            - { call: "POST /leases/${le_id}/submit", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_INVALID_STATE"
      - name: created_entities_start_in_initial_states
        claim_type: initial_state
        grounds:
          - "state_machines.Lease"
          - "state_machines.EstoppelCertificate"
          - "state_machines.PropertyInspection"
          - "state_machines.DisbursementRequest"
          - "state_machines.FinancialStatement"
          - "state_machines.WatchlistEntry"
        distinguishing_aspect: "New lease DRAFT, estoppel PENDING, inspection SCHEDULED, draw SUBMITTED, statement SUBMITTED, extension option AVAILABLE, reserve balances zeroed."
        test_recipe:
          setup: ["clean loan with property, reserve, inspector"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Init Co", tax_id: "TX-INI", contact_email: "ini@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-INI", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Init St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id, r_v1: $.data.version, r_bal: $.data.balance_cents, r_held: $.data.held_cents } }
            - { call: "POST /inspectors", payload: { full_name: "Init Spect", license_no: "LIC-INI" }, as: MasterServicer, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${p_id}/leases", payload: { tenant_name: "T1", suite_ref: "STE-9", commencement_date: "2026-09-01T00:00:00Z", expiry_date: "2027-08-31T00:00:00Z", base_rent_cents_monthly: 100000, sqft: 1000, term_months: 12 }, as: Borrower, as_user_id: "${b_id}", captures: { le_id: $.data.id, le_st: $.data.status } }
            - { call: "POST /leases/${le_id}/estoppels", payload: { due_date: "2026-08-20T00:00:00Z" }, as: MasterServicer, captures: { es_st: $.data.status } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: MasterServicer, captures: { in_st: $.data.status } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "x", amount_cents: 1000 } ], expected_reserve_account_version: "${r_v1}" }, as: Borrower, as_user_id: "${b_id}", captures: { dr_st: $.data.status, dr_amt: $.data.amount_cents } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "RENT_ROLL", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", occupancy_pct: 88 }, as: Borrower, as_user_id: "${b_id}", captures: { fs_st: $.data.status } }
          assert:
            - "lease.status == DRAFT; estoppel.status == PENDING; inspection.status == SCHEDULED; draw.status == SUBMITTED; statement.status == SUBMITTED"
            - "draw.amount_cents == 1000 computed from line items"
            - "reserve starts balance_cents == 0, held_cents == 0, available_cents == 0, elevated_retainage == false, disbursement_frozen == false"
      - name: escalate_to_special_servicing_cascades
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Loan.WATCHLIST_to_SPECIAL_SERVICING"
          - "state_machines.WatchlistEntry.ACTIVE_to_ESCALATED"
          - "state_machines.ExtensionOption.AVAILABLE_to_SUSPENDED"
        distinguishing_aspect: "Escalation cascade: entry ESCALATED, loan SPECIAL_SERVICING, reserve frozen, SUBMITTED draw auto-REJECTED, APPROVED draw auto-CANCELLED with hold released, AVAILABLE option SUSPENDED."
        test_recipe:
          setup:
