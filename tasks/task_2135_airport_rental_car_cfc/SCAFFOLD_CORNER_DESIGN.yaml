  - section: validations
    instances:

      - name: create_facility_missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying neither X-User-Role nor X-User-ID is rejected at priority 1 with HTTP 401 ERR_UNAUTHENTICATED before any body validation runs, so a body missing required fields still yields 401 rather than 400."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /rac/facilities"
              payload: { code: "DEN" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with the X-User-Role and X-User-ID headers omitted entirely"
            - "HTTP status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

      - name: concessionaire_operator_cannot_create_a_facility
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - roles.ConcessionaireOperator
        distinguishing_aspect: "POST /rac/facilities lists only FacilityAdmin, so a ConcessionaireOperator call is rejected at priority 2 with HTTP 403 ERR_ROLE_NOT_PERMITTED and no facility is created."
        test_recipe:
          setup: ["Empty database; the caller presents an arbitrary operator id."]
          setup_api_calls: []
          trigger:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: ConcessionaireOperator
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response data.error_id == ERR_ROLE_NOT_PERMITTED"

      - name: concessionaire_operator_cannot_submit_another_operators_report
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.ConcessionaireOperator
        distinguishing_aspect: "The operator identity is entity_backed:Concessionaire, so BUD's X-User-ID acting on AVX's report is rejected at priority 6 with HTTP 403 ERR_NOT_RESOURCE_OWNER and the report stays in DRAFT."
        test_recipe:
          setup: ["One facility with concessionaires AVX and BUD; AVX holds an ACTIVE agreement with a 2026-01 report in DRAFT."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "a@x.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Budline Auto Rental", brand_code: "BUD", contact_email: "b@x.example" }
              as: FacilityAdmin
              captures: { conc_b_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_a_id}", period_year: 2026, period_month: 1, reported_gross_revenue_cents: 5000000, reported_on_airport_transaction_days: 4000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "response data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "TransactionDayReport.${rep_id}.status == DRAFT and submission_count == 0"

      - name: duplicate_brand_code_within_a_facility_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=22]
          - errors[ERR_DUPLICATE_BRAND_CODE]
        distinguishing_aspect: "brand_code AVX is already used at this facility, so the second create returns HTTP 409 ERR_DUPLICATE_BRAND_CODE and the facility still holds exactly one concessionaire."
        test_recipe:
          setup: ["One facility with concessionaire AVX."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "a@x.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
          trigger:
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Holdings", brand_code: "AVX", contact_email: "a2@x.example" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_DUPLICATE_BRAND_CODE"
            - "GET /rac/concessionaires filtered by facility_id ${fac_id} returns total_count == 1"

      - name: duplicate_counter_space_label_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - errors[ERR_DUPLICATE_SPACE_LABEL]
        distinguishing_aspect: "space_label T1-A02 is unique per facility, so a second space with that label returns HTTP 409 ERR_DUPLICATE_SPACE_LABEL even when terminal_code and space_class differ."
        test_recipe:
          setup: ["One facility with counter space T1-A02."]
          setup_api_calls:
