  # =======================================================================
  # 0.5 rule 4: transitive_cascade
  # Two chains from DIFFERENT triggering transitions:
  #   depth 5 -> CASCADE-A, POST /return-authorizations/{id}/settle
  #   depth 4 -> CASCADE-B, POST /screening-sessions/{id}/submit (RED_FLAG)
  # =======================================================================
  transitive_cascade:

    - name: cascade_a_return_settlement_five_hop_chain
      grounds:
        - "state_machines.TrialPeriod.RETURN_INITIATED_to_RETURN_SETTLED"
        - "state_machines.DeviceOrder.CAPTURED_to_PARTIALLY_REFUNDED"
        - "entities.Device.fields.status"
        - "state_machines.CarePlanSubscription.ACTIVE_to_CANCELLED"
        - "state_machines.FirmwareRollout.PENDING_to_CANCELLED_INELIGIBLE"
        - "calculations.return_refund_settlement"
      distinguishing_aspect: >-
        DEPTH 5, each link CAUSED by the previous one and by nothing else:
        settle moves the TrialPeriod to RETURN_SETTLED (hop 1), which is what moves
        the DeviceOrder to RETURNED / PARTIALLY_REFUNDED (hop 2), which is what
        retires the Device (hop 3), which is what cancels the CarePlanSubscription
        and forfeits its credit (hop 4), which is what cancels the PENDING
        FirmwareRollout as CANCELLED_INELIGIBLE and recomputes the campaign counters
        (hop 5). Stopping at hop 3 leaves an ACTIVE plan on a RETIRED device;
        stopping at hop 4 leaves a live firmware rollout targeting a retired unit.
      test_recipe:
        setup:
          - "Empty DB; clock at the 2026-08-01T00:00:00Z startup default."
          - "StatePolicy CA with restocking_fee_mode FLAT_PCT, restocking_fee_pct 0.1000, restocking_fee_cap_cents 0, shipping_refundable false, trial_period_days 30."
