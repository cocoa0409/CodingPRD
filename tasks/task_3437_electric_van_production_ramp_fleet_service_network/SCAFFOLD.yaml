        type: string
        source: input
        required: true
        description: "FK -> ServiceCenter.id; home base stocking and dispatching this van"
      - name: van_code
        type: string
        source: input
        required: true
        description: "Fleet code of the mobile service van"
        constraints: "unique across all MobileVans"

  - name: ServiceVisit
    parent: null
    common_fields: true
    fields:
