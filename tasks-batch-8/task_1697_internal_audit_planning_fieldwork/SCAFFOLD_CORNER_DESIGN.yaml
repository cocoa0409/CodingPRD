            - { call: "POST /audit/auditors", payload: { full_name: "Sam Staff", grade: "STAFF" }, as: AuditAdmin, captures: { staff1: "$.data.id" } }
            - { call: "POST /audit/auditors", payload: { full_name: "Ada A2", grade: "SENIOR" }, as: AuditAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /audit/audit-plans", payload: { fiscal_year: 2026, title: "P" }, as: ChiefAuditExecutive, as_user_id: "cae-1", captures: { plan: "$.data.id", plan_v: "$.data.version" } }
            - { call: "POST /audit/engagements", payload: { audit_plan_id: "${plan}", auditable_entity_id: "${ent1}", title: "G1", scope_summary: "s", budget_hours: 80, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T00:00:00Z", expected_audit_plan_version: "${plan_v}" }, as: AuditManager, as_user_id: "${mgr1}", captures: { eng1: "$.data.id" } }
