            - { call: "POST /api/foreclosure-cases/${case_id}/bidding-instructions", payload: { opening_bid_cents: 42000000, max_bid_cents: 43000000, strategy: "UP_TO_MAX", expected_foreclosure_case_version: "${v0}" }, as: Beneficiary, as_user_id: "${ben_id}", captures: { i1: $.data.id } }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/bidding-instructions", payload: { opening_bid_cents: 41000000, max_bid_cents: 43000000, strategy: "OPENING_ONLY", expected_foreclosure_case_version: "${v0}" }, as: Beneficiary, as_user_id: "${ben_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STALE_CASE_VERSION and HTTP 412"
            - "BiddingInstruction.${i1}.status remains ACTIVE (stale writer did not supersede it)"

      - name: postponement_stale_sale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[postponement-create-stale-sale]", "errors[ERR_STALE_SALE_VERSION]"]
        distinguishing_aspect: "OCC on AuctionSale.version: after a first postponement advances the sale version, a second postponement carrying the pre-first version is rejected 412 even though its dates are otherwise valid."
        test_recipe:
          setup: ["Case LN-L3 at SALE_SCHEDULED (2026-11-23T10:00:00Z, VEN-L3); client observed sale version sv0"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary L3", reference_code: "BEN-L3", contact_email: "l3@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-L3", borrower_name: "Borrower L3", property_address: "3 Layer Ln", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-L3" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-L3" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-16T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p3: $.data.id } }
            - { call: "POST /api/publications/${p1}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p2}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/publications/${p3}/file-affidavit", payload: {}, as: CaseManager }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/schedule-sale", payload: { venue_name: "VEN-L3", scheduled_sale_start_at: "2026-11-23T10:00:00Z" }, as: CaseManager, captures: { sale_id: $.data.id, sv0: $.data.version } }
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-11-25T10:00:00Z", reason: "BENEFICIARY_REQUEST", announced_via: "ADVANCE", expected_auction_sale_version: "${sv0}" }, as: Auctioneer }
          trigger:
            - { call: "POST /api/auction-sales/${sale_id}/postponements", payload: { new_sale_start_at: "2026-11-27T10:00:00Z", reason: "TRUSTEE_DISCRETION", announced_via: "ADVANCE", expected_auction_sale_version: "${sv0}" }, as: Auctioneer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_STALE_SALE_VERSION and HTTP 412"
            - "sale.scheduled_sale_start_at remains 2026-11-25T10:00:00Z; postponement_count == 1"

      - name: clock_default_fixed_instant
        claim_type: scheduled_actions
        grounds: ["endpoints (POST /_clock/set_current_utc default 2026-08-01T00:00:00Z)"]
        distinguishing_aspect: "Without any clock call, NOD recording with recording_date 2026-08-01 succeeds and 2026-08-02 fails, proving the startup clock is the fixed default, not wall-clock."
        test_recipe:
          setup: ["empty database, clock never set"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary L5", reference_code: "BEN-L5", contact_email: "l5@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-L5", borrower_name: "Borrower L5", property_address: "5 Layer Ln", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-02", instrument_number: "NOD-FUTURE" }, as: CaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-L5" }, as: CaseManager, captures: { nod_id: $.data.id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (recording_date 2026-08-02 is in the future relative to the fixed default clock 2026-08-01T00:00:00Z)"
            - "recording_date == the default instant succeeds: NoticeOfDefault.${nod_id} RECORDED"

      - name: quote_lazy_expiry_visible_on_read
        claim_type: scheduled_actions
        grounds: ["state_machines.Quote.ISSUED_to_EXPIRED"]
        distinguishing_aspect: "Advancing the clock past good_through_date changes reads to EXPIRED without any stored transition or sweep job (lazy derivation)."
        test_recipe:
          setup: ["Case LN-L6 with PAYOFF quote good_through 2026-08-10"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary L6", reference_code: "BEN-L6", contact_email: "l6@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-L6", borrower_name: "Borrower L6", property_address: "6 Layer Ln", county_code: "CC01", unpaid_principal_balance_cents: 10000000, monthly_payment_cents: 100000, months_in_arrears: 1, late_fee_per_month_cents: 5000, note_rate_pct: 4.5, last_interest_paid_date: "2026-07-20", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id, cv: $.data.version } }
            - { call: "POST /api/foreclosure-cases/${case_id}/quotes", payload: { quote_type: "PAYOFF", good_through_date: "2026-08-10", expected_foreclosure_case_version: "${cv}" }, as: CaseManager, captures: { q_id: $.data.id, st0: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: TrusteeAdmin }
          trigger:
            - { call: "GET /api/foreclosure-cases/${case_id}/quotes?quote_type=PAYOFF", as: CaseManager, captures: { st1: "$.data[0].status" } }
          assert:
            - "${st0} == ISSUED at issuance"
            - "${st1} == EXPIRED after the clock passes good_through_date (derived, not stored)"

      - name: cascade_end_to_end_verified
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: stay_filing_postponement_overflow_cascade
          rationale: "The 4-hop stay cascade and the 3-hop payoff cascade are asserted hop-by-hop in §1.8 rule transitive_cascade."

      - name: version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: auction_postponement_self_loop_cycle
          rationale: "Asserted there: sale_v3 == sale_v + 2 across two postponements (one version bump per mutation)."

  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_cascade
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Rescind response and an immediate re-read agree: NOD RESCINDED, case CANCELLED, in the same request sequence with no lag."
        test_recipe:
          setup: ["Case LN-K9 at NOD_RECORDED"]
          setup_api_calls:
            - { call: "POST /api/beneficiaries", payload: { name: "Beneficiary K9", reference_code: "BEN-K9", contact_email: "k9@ben.example" }, as: TrusteeAdmin, captures: { ben_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases", payload: { beneficiary_id: "${ben_id}", loan_reference: "LN-K9", borrower_name: "Borrower K9", property_address: "9 Consist Ct", county_code: "CC01", unpaid_principal_balance_cents: 40000000, monthly_payment_cents: 250000, months_in_arrears: 4, late_fee_per_month_cents: 12500, note_rate_pct: 7.2, last_interest_paid_date: "2026-07-01", distribution_method: "STATUTORY_PRIORITY" }, as: CaseManager, captures: { case_id: $.data.id } }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-K9" }, as: CaseManager, captures: { nod_id: $.data.id } }
          trigger:
            - { call: "POST /api/notices-of-default/${nod_id}/rescind", payload: {}, as: CaseManager, captures: { nod_st: $.data.status } }
            - { call: "GET /api/foreclosure-cases/${case_id}", as: CaseManager, captures: { lc: $.data.lifecycle_status } }
          assert:
            - "${nod_st} == RESCINDED in the rescind response itself"
            - "${lc} == CANCELLED on the immediate follow-up read (no eventual lag)"
