          - state_machines.Lead.CONSULT_COMPLETE_to_LOST
          - entities.Quote.fields.expires_at
        distinguishing_aspect: |
          A STRICT-versus-CLOSED instant boundary on a different quantity from the cutoff
          instance: the last live millisecond (expires_at - 1 ms) still admits a revision,
          while the expiry instant itself refuses the request AND persists the EXPIRED flip
          as a side effect of the failure - and the revision restarts the 14-day window
          from the later presentation rather than continuing the original one.
