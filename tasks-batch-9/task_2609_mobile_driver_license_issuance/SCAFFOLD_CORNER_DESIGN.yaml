      - name: invoice_rounding_precision_corner
        claim_type: precision
        grounds:
          - calculations.verifier_invoice_amount_cents.precision
        excluded_because:
          difficulty_instance: "combinatorial_formula / invoice_round_each_line_then_sum_two_half_cent_lines"
          rationale: "The named §1.8 instance builds two lines whose raw values both land on .5 and pins the round-each-line-then-sum total, which is the only observable that separates the two rounding orders."

      - name: invoice_tier_factor_selection_corner
        claim_type: tiered_pricing
        grounds:
          - calculations.verifier_invoice_amount_cents.constants.TIER_2_FACTOR
          - calculations.verifier_invoice_amount_cents.constants.TIER_3_FACTOR
        excluded_because:
          difficulty_instance: "combinatorial_formula / invoice_round_each_line_then_sum_two_half_cent_lines"
          rationale: "That instance drives both invoice lines through the average-rate tier factors on the way to the pinned total, so the tier-boundary claim is asserted there."

      - name: proofing_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.proofing_assurance_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / proofing_strict_latest_evidence_diverges_from_optimistic_preview"
          rationale: "The named §1.8 instance pins both variant values and their delta over one evidence set, which is exactly the divergence claim."

      - name: exposure_variant_selection_corner
        claim_type: variant_selection
        grounds:
          - calculations.verifier_exposure_index.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / verifier_exposure_rolling_window_diverges_from_since_attestation"
          rationale: "That instance shows which endpoint writes which variant - disclose writes ROLLING_WINDOW, retention-attestation writes SINCE_LAST_ATTESTATION - over identical log rows."

      - name: billing_reconciliation_corner
        claim_type: reconciliation
        grounds:
          - entities.Verifier.fields.billable_query_balance_cents
          - endpoints[POST /mdl/presentation-sessions/{id}/void-billing]
        excluded_because:
          difficulty_instance: "compensating_invariant / void_billing_returns_verifier_balance_to_pre_disclosure_value"
          rationale: "The ledger delta on compensation, including credited_amount_cents and the deliberately unchanged exposure_index, is pinned by the named §1.8 instance."

      - name: reissuance_constraint_propagation_corner
        claim_type: constraint_propagation
        grounds:
          - calculations.credential_reissuance_settlement_cents
        excluded_because:
          difficulty_instance: "combinatorial_formula / reissuance_waiver_tier_pinned_to_pre_waiver_total_not_settlement"
          rationale: "The pinned evaluation order - tier selected from pre_waiver_total, never re-derived from the settlement - is asserted end to end by the named §1.8 instance."

      - name: credential_window_interval_merge_corner
        claim_type: interval_merge
        grounds:
          - validations[priority 20]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / credential_validity_windows_per_device_reject_overlap_accept_adjacency"
          rationale: "Overlap rejection and gap-zero adjacency acceptance on the same device are both asserted by the named §1.8 instance."

      - name: trust_list_interval_merge_corner
        claim_type: interval_merge
        grounds:
          - validations[priority 21]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / trust_list_snapshots_must_tile_exactly_rejecting_gap_and_overlap"
          rationale: "The exact-tiling requirement - overlap 409, gap 422, abutting boundary accepted - is asserted by the named §1.8 instance."

