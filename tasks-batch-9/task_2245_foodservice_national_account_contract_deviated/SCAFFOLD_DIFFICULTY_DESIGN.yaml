scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_line_price_prospective_vs_retroactive_tier
        grounds:
          - calculations.contract_line_price
          - calculations.dispute_audit_repricing
          - entities.OrderLine.fields.list_unit_price_cents
          - entities.OrderLine.fields.cost_basis_snapshot_cents
          - entities.PricingDispute.fields.audited_correct_unit_price_cents
          - entities.ContractTier.fields.min_case_volume
          - state_machines.PricingDispute.OPEN_to_UNDER_AUDIT
        distinguishing_aspect: |
          This instance's dual variant lives on the OrderLine unit-price domain: the
          prospective_tier variant of contract_line_price counts only strictly-earlier
          lines and prices the first 300-case line at 4725, while the retroactive_tier
          variant used by the audit counts the whole period's 600 class cases, crosses
          the 500-case band, and reprices the identical line at 4578 — a 147 cent per
          case divergence produced from byte-identical stored inputs.
        test_recipe:
          setup:
            - "One operator HLG, one manufacturer CPC, one in-market DC DC-SEA, one PROTEIN product P-CHKN with last_cost_cents 4200."
            - "Contract HLG-2026 ACTIVE for 2026-08-01 .. 2027-07-31 with two PROTEIN LAST_COST PERCENT_OF_COST tiers: 12.50 on [0,500) and 9.00 on [500, unbounded)."
            - "Rebate period 2026-08-01 .. 2026-09-01 OPEN, then CLOSED after both lines are invoiced."
            - "Two invoiced order lines of 300 cases each, order_date 2026-08-05 and 2026-08-10, both priced from the [0,500) tier at 4725."
            - "Logical clock advanced to 2026-09-01 so the period can be closed and the audit can run against a final volume."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0, max_case_volume: 500 }
              as: NationalAccountManager
              captures: { tier_low_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 9.00, min_case_volume: 500 }
              as: NationalAccountManager
              captures: { tier_high_id: $.data.id }
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln_a_id: $.data.id, ln_a_list: $.data.list_unit_price_cents }
            - call: "POST /nac/order-lines/${ln_a_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln_b_id: $.data.id }
            - call: "POST /nac/order-lines/${ln_b_id}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/rebate-periods/${rp_id}/close"
              payload: {}
              as: RebateAccountant
            - call: "POST /nac/pricing-disputes"
              payload: { order_line_id: "${ln_a_id}", claimed_correct_unit_price_cents: 4578, dispute_reason: "TIER_MISAPPLIED" }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /nac/pricing-disputes/${disp_id}/start-audit"
              payload: {}
              as: ContractAuditor
              as_user_id: "auditor-1"
              captures: { audited_price: $.data.audited_correct_unit_price_cents }
          assert:
            - "OrderLine.${ln_a_id}.list_unit_price_cents == 4725"
            - "OrderLine.${ln_a_id}.invoiced_unit_price_cents == 4725"
            - "OrderLine.${ln_a_id}.extended_price_cents == 1417500"
            - "OrderLine.${ln_a_id}.applied_tier_id == ${tier_low_id}"
            - "OrderLine.${ln_b_id}.list_unit_price_cents == 4725"
            - "PricingDispute.${disp_id}.audited_correct_unit_price_cents == 4578"
            - "PricingDispute.${disp_id}.variance_cents_per_case == 147"
            - "PricingDispute.${disp_id}.variance_pct == 3.11"
            - "PricingDispute.${disp_id}.status == UNDER_AUDIT"
            - "PricingDispute.${disp_id}.audited_correct_unit_price_cents != OrderLine.${ln_a_id}.list_unit_price_cents"

      - name: compliance_pct_dollar_weighted_vs_case_weighted
        grounds:
          - calculations.contracted_purchase_compliance_pct
          - entities.Contract.fields.compliance_basis
          - entities.RebatePeriod.fields.compliance_pct
          - entities.RebatePeriod.fields.qualifying_cases
          - entities.SubstitutionRule.fields.price_protection_mode
          - state_machines.RebatePeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          This instance's dual variant lives on a different entity domain than the
          first — the RebatePeriod compliance metric, not the OrderLine unit price.
          Two contracts carrying the identical four-line purchase history diverge
          purely on compliance_basis: DOLLAR_WEIGHTED yields 48.84 because the
          non-contracted substituted line is the expensive one, while CASE_WEIGHTED
          yields exactly 50.00 because both lines are 300 cases.
        test_recipe:
          setup:
            - "One operator, one manufacturer, one in-market DC, two PROTEIN products in substitution group CHKN-BREAST: P-CHKN (last_cost 4200) and P-CHKN-ALT (last_cost 4400)."
            - "Two ACTIVE contracts for the same operator over the same term, identical in every respect except compliance_basis: HLG-DOLLAR is DOLLAR_WEIGHTED, HLG-CASE is CASE_WEIGHTED."
            - "Each contract has one PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier on [0,500) and one SUBSTITUTE_OWN_PRICE substitution rule P-CHKN -> P-CHKN-ALT rank 1 with max_price_delta_pct 5.00."
            - "Each contract has a rebate period 2026-08-01 .. 2026-09-01 and two invoiced 300-case lines: a contracted P-CHKN line at 4725 and a substituted P-CHKN-ALT line at 4950 flagged non-contracted."
            - "Logical clock at 2026-09-01 so both periods can be closed."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300, substitution_group_code: "CHKN-BREAST" }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN-ALT", description: "Chicken Breast Alt 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4400, avg_cost_cents: 4300, replacement_cost_cents: 4500, substitution_group_code: "CHKN-BREAST" }
              as: SystemAdmin
              captures: { alt_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-DOLLAR", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", compliance_basis: "DOLLAR_WEIGHTED" }
              as: NationalAccountManager
              captures: { c1_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${c1_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0, max_case_volume: 500 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${c1_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${c1_id}", primary_product_id: "${prod_id}", substitute_product_id: "${alt_id}", rank: 1, price_protection_mode: "SUBSTITUTE_OWN_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${c1_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${c1_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${c1_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp1_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-CASE", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", compliance_basis: "CASE_WEIGHTED" }
              as: NationalAccountManager
              captures: { c2_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${c2_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0, max_case_volume: 500 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${c2_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/substitution-rules"
              payload: { contract_id: "${c2_id}", primary_product_id: "${prod_id}", substitute_product_id: "${alt_id}", rank: 1, price_protection_mode: "SUBSTITUTE_OWN_PRICE", max_price_delta_pct: 5.00 }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${c2_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${c2_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${c2_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp2_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${c1_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { c1_ln_a: $.data.id }
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${c2_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { c2_ln_a: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${c1_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { c1_ln_b: $.data.id }
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${c2_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 300 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { c2_ln_b: $.data.id }
            - call: "POST /nac/products/${prod_id}/availability"
              payload: { stock_status: "OUT_OF_STOCK" }
              as: SystemAdmin
            - call: "POST /nac/order-lines/${c1_ln_b}/substitute"
              payload: { reason: "Primary item unavailable at DC-SEA" }
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/order-lines/${c2_ln_b}/substitute"
              payload: { reason: "Primary item unavailable at DC-SEA" }
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/order-lines/${c1_ln_a}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/order-lines/${c1_ln_b}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/order-lines/${c2_ln_a}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/order-lines/${c2_ln_b}/invoice"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /nac/rebate-periods/${rp1_id}/close"
              payload: {}
              as: RebateAccountant
              captures: { dollar_pct: $.data.compliance_pct }
            - call: "POST /nac/rebate-periods/${rp2_id}/close"
              payload: {}
              as: RebateAccountant
              captures: { case_pct: $.data.compliance_pct }
          assert:
            - "OrderLine.${c1_ln_b}.product_id == ${alt_id}"
            - "OrderLine.${c1_ln_b}.substituted_from_product_id == ${prod_id}"
            - "OrderLine.${c1_ln_b}.invoiced_unit_price_cents == 4950"
            - "OrderLine.${c1_ln_b}.extended_price_cents == 1485000"
            - "OrderLine.${c1_ln_b}.is_contracted_item == false"
            - "RebatePeriod.${rp1_id}.gross_purchases_cents == 2902500"
            - "RebatePeriod.${rp1_id}.contracted_purchases_cents == 1417500"
            - "RebatePeriod.${rp1_id}.qualifying_cases == 600"
            - "RebatePeriod.${rp1_id}.contracted_cases == 300"
            - "RebatePeriod.${rp1_id}.compliance_pct == 48.84"
            - "RebatePeriod.${rp2_id}.compliance_pct == 50.00"
            - "RebatePeriod.${rp2_id}.gross_purchases_cents == 2902500"
            - "RebatePeriod.${rp1_id}.compliance_pct != RebatePeriod.${rp2_id}.compliance_pct"
            - "RebatePeriod.${rp1_id}.rebate_rate_pct == 0.00"
            - "Contract.${c1_id}.compliance_posture == RESTRICTED"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: rebate_rounding_per_line_then_sum_beats_sum_then_round
        grounds:
          - calculations.rebate_accrual_split
          - calculations.contracted_purchase_compliance_pct
          - entities.RebatePeriod.fields.operator_rebate_cents
          - entities.RebatePeriod.fields.manufacturer_funded_cents
          - entities.RebatePeriod.fields.distributor_funded_cents
          - entities.ContractTier.fields.counts_as_contracted
          - state_machines.RebatePeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (b): nested rounding where the order changes the cents. With two
          contracted lines of 100 and 300 cents extended value at a 1.50 percent
          rebate rate, rounding per line then summing gives 2 + 5 = 7 cents, while
          summing first and rounding once gives 6 cents; the scaffold pins per-line
          rounding, so 7 is the only correct answer and the funding split (4 / 3) is
          computed on that already-rounded 7.
        test_recipe:
          setup:
            - "One operator, one manufacturer, one in-market DC, three products with zero markup so extended values are exactly their costs: P-FLOUR (DRY_GROCERY, last_cost 100), P-SUGAR (DRY_GROCERY, last_cost 300), P-CUP (DISPOSABLES, last_cost 100)."
            - "ACTIVE contract PANTRY-2026, DOLLAR_WEIGHTED, with a DRY_GROCERY LAST_COST DOLLARS_PER_CASE 0 tier counts_as_contracted true and a DISPOSABLES LAST_COST DOLLARS_PER_CASE 0 tier counts_as_contracted false, both bands starting at 0 case volume."
            - "Rebate period 2026-08-01 .. 2026-09-01 with three invoiced single-case lines: extended 100 contracted, extended 300 contracted, extended 100 non-contracted."
            - "Logical clock advanced to 2026-09-01 so the period may be closed."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Pantry Row Cafes", operator_code: "PRC" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Midwest Milling", manufacturer_code: "MWM" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-CHI", name: "Chicago DC", in_market_state_codes: ["IL", "IN"], out_of_market_fee_per_case_cents: 200 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-FLOUR", description: "AP Flour 50#", product_class_code: "DRY_GROCERY", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 100, avg_cost_cents: 100, replacement_cost_cents: 100 }
              as: SystemAdmin
              captures: { flour_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-SUGAR", description: "Granulated Sugar 50#", product_class_code: "DRY_GROCERY", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 300, avg_cost_cents: 300, replacement_cost_cents: 300 }
              as: SystemAdmin
              captures: { sugar_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CUP", description: "16oz Cups 1000ct", product_class_code: "DISPOSABLES", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 100, avg_cost_cents: 100, replacement_cost_cents: 100 }
              as: SystemAdmin
              captures: { cup_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "PANTRY-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z", compliance_basis: "DOLLAR_WEIGHTED" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "DRY_GROCERY", cost_basis: "LAST_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 0, min_case_volume: 0, counts_as_contracted: true }
              as: NationalAccountManager
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "DISPOSABLES", cost_basis: "LAST_COST", markup_type: "DOLLARS_PER_CASE", markup_value: 0, min_case_volume: 0, counts_as_contracted: false }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
              captures: { rp_id: $.data.id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${flour_id}", distribution_center_id: "${dc_id}", quantity_cases: 1 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln_flour: $.data.id }
