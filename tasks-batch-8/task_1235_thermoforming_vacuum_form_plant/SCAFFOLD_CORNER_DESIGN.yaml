            - { call: "POST /production-orders", payload: { order_code: "O-V3", part_number: "P-V3", resin_type: PETG, ordered_qty: 50, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 55.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: true }, as: ProductionScheduler, captures: { order_id: $.data.id } }
          trigger:
