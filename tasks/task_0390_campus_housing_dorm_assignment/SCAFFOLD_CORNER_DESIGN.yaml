              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PRECONDITION_NOT_MET"
            - "Assignment.${p_asg}.status == ACTIVE"

      - name: error_break_overlap_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BREAK_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / break_per_room_exclusive_overlap_half_open
          rationale: "ERR_BREAK_OVERLAP is the asserted failure of the per-room overlap §1.8 instance."

      - name: error_break_capacity_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BREAK_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / break_per_building_aggregate_capacity_overlap
          rationale: "ERR_BREAK_CAPACITY_EXCEEDED is the asserted failure of the per-building aggregate-capacity §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_accept_reflects_assignment_and_balance_same_request
        claim_type: immediate
        grounds:
          - state_machines.Application.OFFERED_to_ACCEPTED
          - entities.Assignment
          - entities.MealPlan
        distinguishing_aspect: "On accept (immediate consistency), the created Assignment is queryable and its MealPlan exists in the same flow with no lag; Application.status==ACCEPTED in the accept response."
        test_recipe:
          setup: ["An OFFERED application in an ASSIGNMENT_OPEN cycle"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Immediate I", class_year: SENIOR, gender_identity: MALE, lottery_number: 480 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Immediate Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "IM1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "IMM_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
            - call: "POST /housing-cycles/${c_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${c_id}/open-assignment"
              payload: {}
              as: HousingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: HousingOfficer
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/accept"
              payload: { expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${s_id}"
              captures: { asg_id: $.data.id }
            - call: "GET /assignments?application_id=${app_id}"
              payload: {}
              as: HousingOfficer
              captures: { found_asg: "$.data[0].id", found_status: "$.data[0].status" }
          assert:
            - "Application.${app_id}.status == ACCEPTED"
            - "Assignment found via application_id filter has status == ACTIVE"
