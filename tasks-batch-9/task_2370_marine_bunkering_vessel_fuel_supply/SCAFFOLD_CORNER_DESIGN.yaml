        distinguishing_aspect: "credit-review is a partial update: sending only credit_limit_usd leaves settlement_basis and payment_terms_days untouched while re-deriving credit_status from the settled variant alone, so one 941193.73 receivable reads OK at a 5000000.00 limit, WATCH at 1000000.00 (utilisation 0.9412) and HOLD at 900000.00 (utilisation 1.0458), with the credit-exposure read then showing available_credit_usd -41193.73."
