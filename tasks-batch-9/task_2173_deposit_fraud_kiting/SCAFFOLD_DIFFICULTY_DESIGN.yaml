  - rule_id: transitive_cascade
    instances:
      - name: override_execute_cascades_review_then_hold_then_account_then_fraud_case
        grounds:
          - state_machines.HoldOverrideReview.APPROVED_to_EXECUTED
          - state_machines.CheckHold.ACTIVE_to_OVERRIDDEN
          - entities.DepositAccount.fields.available_balance_cents
          - entities.DepositAccount.fields.held_amount_cents
          - entities.FraudCase.fields.exposure_at_risk_cents
        distinguishing_aspect: |
          Depth-4 cascade triggered by the HoldOverrideReview APPROVED -> EXECUTED transition: hop 1
          executes the review, hop 2 fires because the review executed and drives the hold to
          OVERRIDDEN, hop 3 fires because the hold's held_amount_cents changed and moves the account's
          available/held split, hop 4 fires because the account's held_amount_cents changed and
          rewrites the open FraudCase's exposure_at_risk_cents from 7500 to 0.
