            - call: "POST /oversight/alerts"
              payload: { partner_id: "${pa_id}", alert_type: "STRUCTURING", triggered_at: "2026-08-01T00:00:00Z", transaction_volume_cents: 900000, detection_note: "Reachability fixture alert." }
              as: ComplianceOfficer
