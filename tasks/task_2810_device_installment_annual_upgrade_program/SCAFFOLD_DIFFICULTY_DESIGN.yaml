          assert:
            - "DiagnosticReport.${dr}.diagnostic_result == PASS"
            - "DiagnosticReport.${dr}.derived_condition == FAIR"
            - "DiagnosticReport.${dr}.condition_multiplier_bps == 6000"
            - "DiagnosticReport.${dr}.screen_deduction_cents == 9500"
            - "DiagnosticReport.${dr}.battery_deduction_cents == 8000"
            - "DiagnosticReport.${dr}.computed_credit_cents == 0"
            - "TradeIn.${ti}.credit_estimate_cents == 9000"
            - "TradeIn.${ti}.credit_final_cents == 0"
            - "TradeIn.${ti}.credit_variance_cents == -9000"
            - "TradeIn.${ti}.graded_condition == FAIR"
