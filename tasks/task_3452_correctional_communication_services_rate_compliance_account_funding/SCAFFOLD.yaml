# =============================================================================
# task_3452 — Correctional Communication Services, Rate Compliance &
# Account Funding (Securus Technologies-style) — Scaffold Seed Tables
# =============================================================================

scenario: |
  Correctional Communication Services, Rate Compliance & Account Funding
  (Securus Technologies): facility contracts with commission structures and
  rate schedules constrained by regulatory caps on per-minute charges and
  ancillary fees, account funding through prepaid, collect and debit models
  with deposit fees and refund obligations on account closure, call recording
  and monitoring with attorney call exemption processes and privilege
  protection, number verification, blocking requests and consent requirements
  for recipients, video visitation scheduling with facility capacity, session
  length and staffing constraints, tablet and messaging services with content
  review and per-message pricing, refund and unclaimed balance handling with
  escheatment obligations, complaint handling and regulatory reporting on
  rates and fee disclosure.

domain_name: correctional-comm-services
api_prefix: /comm-services

# =============================================================================
# Complexity Profile (SKILL §0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on FacilityContract.version (schedule activation) and RegulatoryCap.version (cap amendment)
    - cascading_side_effects        # inmate release -> session cancel -> ledger refund -> account auto-close -> refund request
    - dual_variant_calculation      # commission GROSS vs NET basis; refund SIMPLE_BALANCE vs LIFO_NET
    - rate_threshold_triggers       # regulatory caps, charge-time min() re-evaluation, dormancy/claim windows
  entity_topology: flat             # all entities top-level under /comm-services; FK references in bodies
  state_machine_shape: parallel     # Account carries status x escheat_status; RecipientNumber carries verification x block x privilege
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties # refund decider != payer; complaint filer != resolver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities; FundingTransaction is an
# append-only ledger with common_fields: false)
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: state_code, type: string, source: input, description: "US state/jurisdiction code; selects the RegulatoryCap row that constrains this facility" }
      - { name: video_booth_count, type: integer, source: input, description: "Number of video visitation booths; aggregate capacity ceiling per instant" }
      - { name: video_turnover_minutes, type: integer, source: input, default: 10, description: "Cleaning/turnover buffer; each session occupies [start - buffer, end + buffer) for capacity counting" }
      - { name: max_session_minutes, type: integer, source: input, description: "Maximum video session length in minutes" }
      - { name: visiting_open_minutes, type: integer, source: input, description: "Visiting window open, minutes after 00:00 UTC (e.g. 480 = 08:00)" }
      - { name: visiting_close_minutes, type: integer, source: input, description: "Visiting window close, minutes after 00:00 UTC (e.g. 1200 = 20:00)" }
      - { name: daily_session_limit_per_inmate, type: integer, source: input, default: 2, description: "Max CONFIRMED video sessions per inmate per UTC date" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED" }

  - name: RegulatoryCap
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "Jurisdiction code; unique across all RegulatoryCap rows" }
      - { name: max_per_minute_cents, type: integer, source: input, description: "Regulatory cap on any per-minute call rate" }
      - { name: max_connection_fee_cents, type: integer, source: input, description: "Regulatory cap on per-call connection fee" }
      - { name: max_ancillary_fee_cents, type: integer, source: input, description: "Regulatory cap applied per ancillary charge: message price, video session fee, closure fee" }
      - { name: max_deposit_fee_cents, type: integer, source: input, description: "Regulatory cap on the deposit fee" }
      - { name: max_commission_pct, type: number, source: input, description: "Maximum site commission as a fraction of revenue (0 = commissions banned)" }
      - { name: refund_method, type: enum, source: input, description: "SIMPLE_BALANCE | LIFO_NET — selects the refund_payout variant for accounts in this jurisdiction" }
      - { name: dormancy_days, type: integer, source: input, description: "Days of unclaimed-balance age before an account is flagged DORMANT by the dormancy scan" }
      - { name: claim_window_days, type: integer, source: input, description: "Days after escheat notice during which the balance is still claimable" }

  - name: FacilityContract
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the contracted facility" }
      - { name: commission_pct, type: number, source: input, description: "Site commission fraction (e.g. 0.5); validated against RegulatoryCap.max_commission_pct at activation" }
      - { name: commission_basis, type: enum, source: input, description: "GROSS | NET — selects the site_commission_accrual variant" }
      - { name: deposit_fee_cents, type: integer, source: input, description: "Deposit fee charged per deposit (charge-time min with RegulatoryCap.max_deposit_fee_cents)" }
      - { name: closure_fee_cents, type: integer, source: input, description: "Account closure fee (charge-time min with RegulatoryCap.max_ancillary_fee_cents)" }
      - { name: effective_from, type: datetime, source: input, description: "Contract effective start (informational)" }
      - { name: effective_to, type: datetime, source: input, description: "Contract effective end (informational)", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> FacilityContract.id; the contract this schedule belongs to" }
      - { name: local_per_minute_cents, type: integer, source: input, description: "Per-minute rate for LOCAL calls" }
      - { name: intrastate_per_minute_cents, type: integer, source: input, description: "Per-minute rate for INTRASTATE calls" }
      - { name: interstate_per_minute_cents, type: integer, source: input, description: "Per-minute rate for INTERSTATE calls" }
      - { name: international_per_minute_cents, type: integer, source: input, description: "Per-minute rate for INTERNATIONAL calls" }
      - { name: connection_fee_cents, type: integer, source: input, description: "Per-call connection fee" }
      - { name: message_price_cents, type: integer, source: input, description: "Per-message price for tablet messaging" }
      - { name: video_session_fee_cents, type: integer, source: input, description: "Flat fee per confirmed video session" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock timestamp of activation; null while DRAFT" }

  - name: Inmate
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; housing facility" }
      - { name: booking_number, type: string, source: input, description: "Facility-scoped booking number; unique among IN_CUSTODY inmates of the same facility" }
      - { name: full_name, type: string, source: input, description: "Inmate full name" }
      - { name: housing_unit, type: string, source: input, description: "Housing unit designation", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "IN_CUSTODY | RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock release timestamp; null while IN_CUSTODY" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility whose contract/schedule prices this account" }
      - { name: inmate_id, type: string, source: input, description: "FK -> Inmate.id; the incarcerated person this account serves" }
      - { name: funding_model, type: enum, source: input, description: "PREPAID | COLLECT | DEBIT" }
      - { name: owner_name, type: string, source: input, description: "Account holder display name (family/friend, or the inmate for DEBIT)" }
      - { name: owner_contact, type: string, source: input, description: "Owner contact handle (email or phone)" }
      - { name: collect_credit_limit_cents, type: integer, source: input, description: "Receivable limit for COLLECT accounts; required when funding_model == COLLECT, ignored otherwise", constraints: "optional; mandatory for COLLECT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: balance_cents, type: integer, source: computed, description: "Sum of signed FundingTransaction.amount_cents over the account ledger; PREPAID/DEBIT invariant >= 0, COLLECT invariant >= -collect_credit_limit_cents" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock closure timestamp; null until CLOSED" }
      - { name: balance_at_closure_cents, type: integer, source: system, description: "Balance snapshot taken at closure; null until CLOSED" }
      - { name: refundable_computed_cents, type: integer, source: system, description: "Refund payout computed at closure per refund_payout calc; null until CLOSED" }
      - { name: retained_fees_cents, type: integer, source: system, description: "Net retained amount = balance_at_closure_cents - settled payout, recorded at settlement; 0 until then" }
      - { name: refunded_total_cents, type: integer, source: computed, description: "Sum of REFUND_PAYOUT magnitudes on the ledger" }
      - { name: escheated_total_cents, type: integer, source: computed, description: "Sum of ESCHEAT_REMITTANCE magnitudes on the ledger" }
      - { name: latest_refund_request_id, type: string, source: system, description: "Most recent RefundRequest created for this account; null if none" }
      - { name: unclaimed_balance_cents, type: integer, source: system, description: "Undisbursed refund amount after a DENIED refund decision; 0 otherwise" }
      - { name: unclaimed_since, type: datetime, source: system, description: "Logical-clock timestamp when unclaimed_balance_cents was set; null while 0" }
      - { name: escheat_status, type: enum, source: system, description: "NONE | DORMANT | NOTICE_SENT | REMITTED | CLAIMED" }
      - { name: escheat_notice_sent_at, type: datetime, source: system, description: "Logical-clock notice timestamp; null until NOTICE_SENT" }

  - name: FundingTransaction
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; ledger owner" }
      - { name: type, type: enum, source: system, description: "DEPOSIT | DEPOSIT_FEE | CALL_CHARGE | MESSAGE_CHARGE | MESSAGE_REFUND | VIDEO_CHARGE | VIDEO_REFUND | CLOSURE_FEE | REFUND_PAYOUT | ESCHEAT_REMITTANCE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount: credits positive (DEPOSIT, MESSAGE_REFUND, VIDEO_REFUND, negative CLOSURE_FEE when LIFO fee refund exceeds closure fee), debits negative" }
      - { name: reference_id, type: string, source: system, description: "Id of the originating CallRecord, TabletMessage, VideoSession, or RefundRequest; null for deposits", constraints: "nullable" }
      - { name: note, type: string, source: system, description: "Human-readable ledger memo" }

  - name: RecipientNumber
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account whose contact list holds this number" }
      - { name: e164_number, type: string, source: input, description: "E.164 phone number; unique among RecipientNumber rows of the same account" }
      - { name: label, type: string, source: input, description: "Contact label (e.g. 'Mom', 'Atty Rivera')" }
      - { name: relationship_type, type: enum, source: input, description: "FAMILY | FRIEND | ATTORNEY | LEGAL_AID | OTHER; ATTORNEY/LEGAL_AID creation auto-enters privilege_status PRIVILEGE_REQUESTED" }
      - { name: verification_status, type: enum, source: system, description: "VERIFICATION_SENT | VERIFIED" }
      - { name: verification_code, type: string, source: system, description: "Server-generated 6-digit code returned in the create response; required by the verify endpoint" }
      - { name: consent_to_recording, type: boolean, source: system, description: "True once the recipient verifies with consent; gates every non-privileged call" }
      - { name: block_status, type: enum, source: system, description: "NOT_BLOCKED | BLOCKED" }
      - { name: block_reason, type: string, source: system, description: "Recipient-supplied block reason; null while NOT_BLOCKED", constraints: "nullable" }
      - { name: privilege_status, type: enum, source: system, description: "NONE | PRIVILEGE_REQUESTED | PRIVILEGED | REVOKED" }
      - { name: privilege_decision_note, type: string, source: system, description: "ComplianceOfficer note on the last privilege decision; null if none", constraints: "nullable" }

  - name: CallRecord
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; billed account" }
      - { name: inmate_id, type: string, source: input, description: "FK -> Inmate.id; calling inmate" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; derived from account.facility_id at creation" }
      - { name: recipient_number_id, type: string, source: input, description: "FK -> RecipientNumber.id; called party" }
      - { name: rate_schedule_id, type: string, source: system, description: "FK -> RateSchedule.id; the contract's ACTIVE schedule pinned at connect" }
      - { name: call_type, type: enum, source: input, description: "LOCAL | INTRASTATE | INTERSTATE | INTERNATIONAL" }
      - { name: status, type: enum, source: system, description: "CONNECTED | COMPLETED | NOT_CONNECTED" }
      - { name: applied_per_minute_cents, type: integer, source: system, description: "min(schedule rate for call_type, RegulatoryCap.max_per_minute_cents) snapshot at connect" }
      - { name: applied_connection_fee_cents, type: integer, source: system, description: "min(schedule connection_fee_cents, RegulatoryCap.max_connection_fee_cents) snapshot at connect" }
      - { name: connected_at, type: datetime, source: system, description: "Logical-clock connect timestamp" }
      - { name: ended_at, type: datetime, source: system, description: "Logical-clock end timestamp; null until ended", constraints: "nullable" }
      - { name: duration_seconds, type: integer, source: input, description: "Supplied on end; 0 means the call was never answered" }
      - { name: billable_minutes, type: integer, source: computed, description: "ceil(duration_seconds / 60), truncated at the affordability boundary on cutoff; null until ended", constraints: "nullable" }
      - { name: total_charge_cents, type: integer, source: computed, description: "0 for NOT_CONNECTED; otherwise connection fee + billable_minutes x applied rate; null until ended", constraints: "nullable" }
      - { name: cutoff_reason, type: enum, source: system, description: "NONE | BALANCE_EXHAUSTED | CREDIT_LIMIT_REACHED" }
      - { name: recording_status, type: enum, source: system, description: "RECORDED | EXEMPT_PRIVILEGED; EXEMPT_PRIVILEGED when recipient privilege_status == PRIVILEGED at connect" }

  - name: VideoSession
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; visitation facility" }
      - { name: inmate_id, type: string, source: input, description: "FK -> Inmate.id; visited inmate" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; billed account" }
      - { name: visitor_name, type: string, source: input, description: "Visitor full name" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (UTC); must be in the future at create and at confirm" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end (UTC); same UTC date as start, inside the facility visiting window" }
      - { name: duration_minutes, type: integer, source: computed, description: "(scheduled_end - scheduled_start) in minutes" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CANCELLED | COMPLETED | NO_SHOW" }
      - { name: charge_cents, type: integer, source: system, description: "Video fee charged at confirm; null until CONFIRMED", constraints: "nullable" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock confirm timestamp; null until CONFIRMED", constraints: "nullable" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock cancel timestamp; null unless CANCELLED", constraints: "nullable" }
      - { name: closed_out_at, type: datetime, source: system, description: "Logical-clock close-out timestamp; null unless COMPLETED/NO_SHOW", constraints: "nullable" }

  - name: TabletMessage
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; billed account" }
      - { name: inmate_id, type: string, source: input, description: "FK -> Inmate.id; recipient inmate" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; derived from account.facility_id at creation" }
      - { name: body_text, type: string, source: input, description: "Message body; max 1000 characters" }
      - { name: price_cents, type: integer, source: system, description: "min(schedule message_price_cents, RegulatoryCap.max_ancillary_fee_cents) snapshot at creation" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | DELIVERED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "FacilityStaff X-User-ID who reviewed; null until reviewed", constraints: "nullable" }
      - { name: review_note, type: string, source: system, description: "Reviewer note; null until reviewed", constraints: "nullable" }
      - { name: reviewed_at, type: datetime, source: system, description: "Logical-clock review timestamp; null until reviewed", constraints: "nullable" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account being refunded" }
      - { name: source, type: enum, source: system, description: "CLOSURE | ESCHEAT_CLAIM" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | PAID" }
      - { name: requested_amount_cents, type: integer, source: system, description: "CLOSURE: balance_at_closure_cents; ESCHEAT_CLAIM: unclaimed_balance_cents at claim time" }
      - { name: computed_payout_cents, type: integer, source: system, description: "Payout computed per refund_payout calc at decide; null until APPROVED/DENIED; pre-computed at claim time for ESCHEAT_CLAIM", constraints: "nullable" }
      - { name: refund_method_applied, type: enum, source: system, description: "SIMPLE_BALANCE | LIFO_NET; the jurisdiction variant used", constraints: "nullable" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID that initiated closure/claim ('system' for inmate-release auto-closure)" }
      - { name: requested_by_role, type: string, source: system, description: "Role that initiated closure/claim ('system' for auto-closure)" }
      - { name: decided_by_user_id, type: string, source: system, description: "ComplianceOfficer X-User-ID who decided; 'system' for auto-approved ESCHEAT_CLAIM", constraints: "nullable" }
      - { name: denial_reason, type: string, source: system, description: "Required on DENY decisions; null otherwise", constraints: "nullable" }
      - { name: paid_by_user_id, type: string, source: system, description: "ComplianceOfficer X-User-ID who disbursed; null until PAID", constraints: "nullable" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock payment timestamp; null until PAID", constraints: "nullable" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; facility the complaint concerns" }
      - { name: subject_account_id, type: string, source: input, description: "FK -> Account.id; optional related account", constraints: "optional" }
      - { name: subject_call_id, type: string, source: input, description: "FK -> CallRecord.id; optional related call", constraints: "optional" }
      - { name: category, type: enum, source: input, description: "RATE_DISPUTE | FEE_DISCLOSURE | SERVICE_QUALITY | PRIVACY_CONCERN | WRONGFUL_BLOCK" }
      - { name: description, type: string, source: input, description: "Complaint narrative" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RESOLVED | ESCALATED_TO_REGULATOR" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: filed_by_role, type: string, source: system, description: "Role of the filer" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "ComplianceOfficer who started review; null until UNDER_REVIEW", constraints: "nullable" }
      - { name: resolution_note, type: string, source: system, description: "Resolution narrative; null until RESOLVED", constraints: "nullable" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock resolution timestamp; null until RESOLVED", constraints: "nullable" }
      - { name: escalated_at, type: datetime, source: system, description: "Logical-clock escalation timestamp; null until ESCALATED_TO_REGULATOR", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table (11 machines; Account and RecipientNumber carry
# parallel state dimensions)
# =============================================================================
state_machines:
  - entity: Facility
    initial_state: ONBOARDING
    terminal_states: []
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /comm-services/facilities/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "At least one FacilityContract for this facility has status ACTIVE (ERR_NO_ACTIVE_CONTRACT)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /comm-services/facilities/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "At least one FacilityContract for this facility has status ACTIVE (ERR_NO_ACTIVE_CONTRACT)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /comm-services/facilities/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "New calls, video sessions, messages, and deposits are rejected while SUSPENDED (ERR_FACILITY_NOT_ACTIVE); in-flight CONNECTED calls are unaffected"

  - entity: FacilityContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /comm-services/contracts/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Facility.status IN {ONBOARDING, ACTIVE} (ERR_FACILITY_NOT_ACTIVE)"
          - "A RegulatoryCap row exists for facility.state_code (ERR_CAP_NOT_CONFIGURED)"
          - "commission_pct <= RegulatoryCap.max_commission_pct (ERR_COMMISSION_EXCEEDS_CAP)"
          - "No other FacilityContract for this facility has status ACTIVE (ERR_ACTIVE_CONTRACT_EXISTS)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /comm-services/contracts/{id}/terminate"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "The contract's ACTIVE RateSchedule, if any, transitions to SUPERSEDED"
          - "CallRecord rows keep their pinned rate_schedule_id and applied rates (version-pinning)"

  - entity: RateSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /comm-services/rate-schedules/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "Contract status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "OCC: expected_contract_version == contract.version (ERR_STALE_VERSION, 412)"
          - "Every per-minute rate <= RegulatoryCap.max_per_minute_cents, connection_fee_cents <= cap.max_connection_fee_cents, message_price_cents <= cap.max_ancillary_fee_cents, video_session_fee_cents <= cap.max_ancillary_fee_cents (ERR_RATE_EXCEEDS_CAP); rate exactly equal to the cap is allowed"
        side_effects:
          - "Prior ACTIVE RateSchedule on the same contract, if any, transitions to SUPERSEDED"
          - "activated_at = logical clock"
          - "Increments FacilityContract.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another RateSchedule on the same contract activates, or the contract terminates)"
        actor: system
        preconditions: []
        side_effects:
          - "In-flight CONNECTED CallRecords keep applied rates pinned from connect time"

  - entity: Inmate
    initial_state: IN_CUSTODY
    terminal_states: [RELEASED]
    transitions:
      - from: IN_CUSTODY
        to: RELEASED
        trigger: "POST /comm-services/inmates/{id}/release"
        actor: FacilityStaff
        preconditions: []
        side_effects:
          - "released_at = logical clock"
          - "CASCADE STEP 1: every VideoSession with inmate_id = this inmate, status IN {REQUESTED, CONFIRMED}, and scheduled_start > clock transitions to CANCELLED; for CONFIRMED ones this appends VIDEO_REFUND +charge_cents to the billed account ledger (Account.balance_cents recomputed)"
          - "CASCADE STEP 2: every TabletMessage with inmate_id = this inmate and status PENDING_REVIEW transitions to REJECTED and appends MESSAGE_REFUND +price_cents to the account ledger"
          - "CASCADE STEP 3 (runs strictly after steps 1-2 so refunds land in the snapshot): every Account with inmate_id = this inmate, funding_model == DEBIT, status == ACTIVE auto-closes (Account CLOSED transition with closure fee waived and requested_by = 'system')"
          - "PREPAID and COLLECT accounts are unaffected by release"

  - entity: Account
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    note: "Account carries two parallel state dimensions: status (lifecycle) and escheat_status (unclaimed-property track). They evolve independently; escheat_status only advances while status == CLOSED."
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /comm-services/accounts/{id}/suspend"
        actor: FacilityStaff
        preconditions: []
        side_effects:
          - "Deposits, calls, messages, video creates, and closure-fee-free operations are rejected while SUSPENDED (ERR_ACCOUNT_NOT_ACTIVE); close remains allowed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /comm-services/accounts/{id}/resume"
        actor: FacilityStaff
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /comm-services/accounts/{id}/close OR system (inmate release auto-close for DEBIT accounts)"
        actor: "AccountHolder (self) | FacilityStaff | system"
        preconditions:
          - "No CallRecord for this account with status CONNECTED (ERR_ACCOUNT_HAS_ACTIVE_CALLS)"
          - "No VideoSession for this account with status CONFIRMED and scheduled_end > clock (ERR_ACCOUNT_HAS_ACTIVE_SESSIONS)"
          - "No TabletMessage for this account with status PENDING_REVIEW (ERR_ACCOUNT_HAS_PENDING_MESSAGES)"
        side_effects:
          - "closed_at = clock; balance_at_closure_cents = balance_cents snapshot"
          - "closure_fee = 0 for inmate-release auto-close; otherwise min(contract.closure_fee_cents, cap.max_ancillary_fee_cents at close time)"
          - "refundable_computed_cents = refund_payout(cap.refund_method, ledger, balance_at_closure_cents, closure_fee), floored at 0"
          - "If refundable_computed_cents > 0: create RefundRequest(source=CLOSURE, status=REQUESTED, requested_amount_cents = balance_at_closure_cents); balance stays frozen on the ledger; set latest_refund_request_id"
          - "If refundable_computed_cents == 0: append CLOSURE_FEE -balance_at_closure_cents, balance becomes 0, retained_fees_cents = balance_at_closure_cents, no RefundRequest is created"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /comm-services/accounts/{id}/close"
        actor: "AccountHolder (self) | FacilityStaff"
        preconditions:
          - "Same preconditions as ACTIVE -> CLOSED"
        side_effects:
          - "Same side effects as ACTIVE -> CLOSED (closure fee applies; not waived)"

  - entity: Account
    field: escheat_status
    note: "Parallel dimension on Account (field escheat_status), declared as its own machine for readability; the Account lifecycle machine above governs the status field. All escheat_status transitions require Account.status == CLOSED."
    initial_state: NONE
    terminal_states: [REMITTED]
    transitions:
      - from: NONE
        to: DORMANT
        trigger: "system (POST /comm-services/facilities/{id}/run-dormancy-scan)"
        actor: system
        preconditions:
          - "status == CLOSED AND unclaimed_balance_cents > 0 AND escheat_status == NONE"
          - "clock >= unclaimed_since + RegulatoryCap.dormancy_days (boundary: exactly equal qualifies)"
        side_effects: []
      - from: DORMANT
        to: NOTICE_SENT
        trigger: "POST /comm-services/accounts/{id}/send-escheat-notice"
        actor: ComplianceOfficer
        preconditions:
          - "escheat_status == DORMANT (ERR_INVALID_STATE)"
        side_effects:
          - "escheat_notice_sent_at = clock"
      - from: NOTICE_SENT
        to: REMITTED
        trigger: "POST /comm-services/accounts/{id}/remit-escheat"
        actor: ComplianceOfficer
        preconditions:
          - "escheat_status == NOTICE_SENT (ERR_INVALID_STATE)"
          - "clock >= escheat_notice_sent_at + RegulatoryCap.claim_window_days (ERR_CLAIM_WINDOW_OPEN; boundary: exactly equal allows remit)"
        side_effects:
          - "Append ESCHEAT_REMITTANCE -unclaimed_balance_cents and CLOSURE_FEE -(balance_at_closure_cents - sum of prior payouts/remittances - unclaimed_balance_cents); balance_cents becomes 0"
          - "escheated_total_cents increases by the remitted amount; unclaimed_balance_cents = 0"
      - from: DORMANT
        to: CLAIMED
        trigger: "POST /comm-services/accounts/{id}/claim-unclaimed"
        actor: "AccountHolder (self)"
        preconditions:
          - "escheat_status IN {DORMANT, NOTICE_SENT} (ERR_ESCHEAT_NOT_CLAIMABLE)"
        side_effects:
          - "Create RefundRequest(source=ESCHEAT_CLAIM, status=APPROVED, requested_amount_cents = unclaimed_balance_cents, computed_payout_cents = unclaimed_balance_cents, decided_by_user_id = 'system'); set latest_refund_request_id"
      - from: NOTICE_SENT
        to: CLAIMED
        trigger: "POST /comm-services/accounts/{id}/claim-unclaimed"
        actor: "AccountHolder (self)"
        preconditions:
          - "escheat_status IN {DORMANT, NOTICE_SENT} (ERR_ESCHEAT_NOT_CLAIMABLE)"
        side_effects:
          - "Same as DORMANT -> CLAIMED"

  - entity: RecipientNumber
    initial_state: "verification_status=VERIFICATION_SENT, block_status=NOT_BLOCKED, privilege_status=NONE-or-PRIVILEGE_REQUESTED"
    terminal_states: []
    note: "Three parallel dimensions. verification_status: VERIFICATION_SENT -> VERIFIED. block_status: NOT_BLOCKED -> BLOCKED -> NOT_BLOCKED (cycle via re-verification). privilege_status: NONE (non-attorney) or PRIVILEGE_REQUESTED (attorney at creation) -> PRIVILEGED | REVOKED."
    transitions:
      - from: "verification_status=VERIFICATION_SENT"
        to: "verification_status=VERIFIED"
        trigger: "POST /comm-services/recipient-numbers/{id}/verify"
        actor: "RecipientParty (self)"
        preconditions:
          - "verification_code matches (ERR_VERIFICATION_CODE_INVALID)"
          - "consent_to_recording == true in the request (ERR_CONSENT_REQUIRED)"
          - "block_status == NOT_BLOCKED (a BLOCKED number uses the unblock path of the same endpoint)"
        side_effects:
          - "consent_to_recording = true"
      - from: "block_status=NOT_BLOCKED"
        to: "block_status=BLOCKED"
        trigger: "POST /comm-services/recipient-numbers/{id}/request-block"
        actor: "RecipientParty (self)"
        preconditions:
          - "verification_status == VERIFIED (ERR_INVALID_STATE: only a verified recipient can demand a block)"
        side_effects:
          - "block_reason = request reason"
      - from: "block_status=BLOCKED"
        to: "block_status=NOT_BLOCKED"
        trigger: "POST /comm-services/recipient-numbers/{id}/verify"
        actor: "RecipientParty (self)"
        preconditions:
          - "verification_code matches (ERR_VERIFICATION_CODE_INVALID)"
          - "consent_to_recording == true in the request (ERR_CONSENT_REQUIRED)"
        side_effects:
          - "block_reason = null; consent_to_recording = true (re-captured)"
      - from: "privilege_status=PRIVILEGE_REQUESTED"
        to: "privilege_status=PRIVILEGED"
        trigger: "POST /comm-services/recipient-numbers/{id}/privilege-decision with decision=VERIFY"
        actor: ComplianceOfficer
        preconditions:
          - "privilege_status == PRIVILEGE_REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "privilege_decision_note = request note"
          - "Subsequent calls to this number record recording_status = EXEMPT_PRIVILEGED"
      - from: "privilege_status=PRIVILEGE_REQUESTED"
        to: "privilege_status=REVOKED"
        trigger: "POST /comm-services/recipient-numbers/{id}/privilege-decision with decision=REVOKE"
        actor: ComplianceOfficer
        preconditions:
          - "privilege_status IN {PRIVILEGE_REQUESTED, PRIVILEGED} (ERR_INVALID_STATE)"
        side_effects:
          - "privilege_decision_note = request note"
      - from: "privilege_status=PRIVILEGED"
        to: "privilege_status=REVOKED"
        trigger: "POST /comm-services/recipient-numbers/{id}/privilege-decision with decision=REVOKE"
        actor: ComplianceOfficer
        preconditions:
          - "privilege_status IN {PRIVILEGE_REQUESTED, PRIVILEGED} (ERR_INVALID_STATE)"
        side_effects:
          - "Existing CallRecords keep their pinned recording_status (version-pinning); only new calls are affected"

  - entity: CallRecord
    initial_state: CONNECTED
    terminal_states: [COMPLETED, NOT_CONNECTED]
    transitions:
      - from: CONNECTED
        to: COMPLETED
        trigger: "POST /comm-services/calls/{id}/end with duration_seconds > 0"
        actor: FacilityStaff
        preconditions:
          - "duration_seconds > 0 (duration_seconds == 0 routes to NOT_CONNECTED; use it instead)"
        side_effects:
          - "ended_at = clock; billable_minutes and total_charge_cents computed per call_charge calc (with affordability cutoff)"
          - "Append CALL_CHARGE -total_charge_cents to the account ledger; Account.balance_cents recomputed"
      - from: CONNECTED
        to: NOT_CONNECTED
        trigger: "POST /comm-services/calls/{id}/end with duration_seconds == 0"
        actor: FacilityStaff
        preconditions: []
        side_effects:
          - "ended_at = clock; total_charge_cents = 0; NO ledger entry is appended"

  - entity: VideoSession
    initial_state: REQUESTED
    terminal_states: [CANCELLED, COMPLETED, NO_SHOW]
    note: "Branching: REQUESTED -> CANCELLED (no charge, no refund) vs CONFIRMED -> CANCELLED (full VIDEO_REFUND) vs CONFIRMED -> COMPLETED (no refund) vs CONFIRMED -> NO_SHOW (no refund) — divergent side-effect sets per branch."
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /comm-services/video-sessions/{id}/confirm"
        actor: FacilityStaff
        preconditions:
          - "Facility.status == ACTIVE (ERR_FACILITY_NOT_ACTIVE)"
          - "Account.status == ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
          - "Inmate.status == IN_CUSTODY (ERR_INMATE_NOT_IN_CUSTODY)"
          - "scheduled_start > clock (ERR_SESSION_IN_PAST)"
          - "No other VideoSession for the same inmate with status CONFIRMED whose [start, end) half-open interval overlaps this one (ERR_INMATE_SESSION_OVERLAP; back-to-back adjacency is allowed)"
          - "Buffered capacity sweep: at no instant may more than facility.video_booth_count sessions with status CONFIRMED (buffered by +/- video_turnover_minutes) cover that instant, this session included (ERR_FACILITY_CAPACITY_EXCEEDED)"
          - "Count of the inmate's CONFIRMED sessions on the same UTC date < facility.daily_session_limit_per_inmate (ERR_DAILY_SESSION_LIMIT_EXCEEDED)"
          - "Account can cover the video fee per funding-model rule (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "charge_cents = min(schedule.video_session_fee_cents, cap.max_ancillary_fee_cents at confirm time) using the contract's ACTIVE schedule"
          - "Append VIDEO_CHARGE -charge_cents; Account.balance_cents recomputed"
          - "confirmed_at = clock"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /comm-services/video-sessions/{id}/cancel OR system (inmate release cascade)"
        actor: "AccountHolder (self) | FacilityStaff | system"
        preconditions: []
        side_effects:
          - "cancelled_at = clock; no charge was ever made, no refund is appended"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /comm-services/video-sessions/{id}/cancel OR system (inmate release cascade)"
        actor: "AccountHolder (self) | FacilityStaff | system"
        preconditions:
          - "clock < scheduled_start (ERR_SESSION_NOT_CANCELLABLE once the session has started); the release cascade bypasses this check"
        side_effects:
          - "cancelled_at = clock; append VIDEO_REFUND +charge_cents; Account.balance_cents recomputed"
          - "Booth-minutes budget for the facility/date is restored (see video_booth_minutes_budget invariant)"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /comm-services/video-sessions/{id}/close-out with outcome=COMPLETED"
        actor: FacilityStaff
        preconditions:
          - "clock >= scheduled_end (ERR_SESSION_NOT_ENDED)"
        side_effects:
          - "closed_out_at = clock"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /comm-services/video-sessions/{id}/close-out with outcome=NO_SHOW"
        actor: FacilityStaff
        preconditions:
          - "clock >= scheduled_end (ERR_SESSION_NOT_ENDED)"
        side_effects:
          - "closed_out_at = clock; no refund"

  - entity: TabletMessage
    initial_state: PENDING_REVIEW
    terminal_states: [DELIVERED, REJECTED]
    transitions:
      - from: PENDING_REVIEW
        to: DELIVERED
        trigger: "POST /comm-services/messages/{id}/review with decision=APPROVE"
        actor: FacilityStaff
        preconditions: []
        side_effects:
          - "reviewed_by_user_id, review_note, reviewed_at set; the MESSAGE_CHARGE from creation stands"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /comm-services/messages/{id}/review with decision=REJECT OR system (inmate release cascade)"
        actor: "FacilityStaff | system"
        preconditions: []
        side_effects:
          - "reviewed_by_user_id, review_note, reviewed_at set (system for cascade)"
          - "Append MESSAGE_REFUND +price_cents; Account.balance_cents recomputed (charge/refund pair nets to zero — see message_charge_refund_balance invariant)"

  - entity: RefundRequest
    initial_state: REQUESTED
    terminal_states: [PAID, DENIED]
    note: "ESCHEAT_CLAIM requests enter at APPROVED (auto-approved at claim time), so their only valid transition is APPROVED -> PAID."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /comm-services/refund-requests/{id}/decide with decision=APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: if requested_by_role != 'AccountHolder' and requested_by_role != 'system', the decider's X-User-ID MUST differ from requested_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "computed_payout_cents = refund_payout(cap.refund_method, ledger, account.balance_at_closure_cents, closure fee), floored at 0; refund_method_applied recorded"
          - "decided_by_user_id = caller"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /comm-services/refund-requests/{id}/decide with decision=DENY"
        actor: ComplianceOfficer
        preconditions:
          - "denial_reason required (ERR_INVALID_REQUEST)"
          - "Same segregation-of-duties rule as APPROVE (ERR_SOD_VIOLATION)"
        side_effects:
          - "computed_payout_cents computed with the same formula (the amount that would have been paid)"
          - "If computed_payout_cents > 0: account.unclaimed_balance_cents = computed_payout_cents, unclaimed_since = clock (the account is now escheat-eligible; escheat_status stays NONE until the dormancy scan flags it)"
      - from: APPROVED
        to: PAID
        trigger: "POST /comm-services/refund-requests/{id}/mark-paid"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: payer X-User-ID MUST differ from decided_by_user_id (ERR_SOD_VIOLATION); decided_by 'system' never conflicts"
        side_effects:
          - "paid_by_user_id = caller; paid_at = clock"
          - "Append REFUND_PAYOUT -computed_payout_cents and CLOSURE_FEE -(balance_at_closure_cents - computed_payout_cents - already-settled amounts); account balance_cents becomes balance_at_closure_cents - all settled amounts"
          - "account.refunded_total_cents increases by computed_payout_cents; account.retained_fees_cents = balance_at_closure_cents - total settled payouts"
          - "If source == ESCHEAT_CLAIM: account.unclaimed_balance_cents = 0"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [RESOLVED, ESCALATED_TO_REGULATOR]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /comm-services/complaints/{id}/start-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "reviewed_by_user_id = caller"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /comm-services/complaints/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "resolution_note required (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_at = clock; resolution_note recorded"
      - from: UNDER_REVIEW
        to: ESCALATED_TO_REGULATOR
        trigger: "POST /comm-services/complaints/{id}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "clock >= created_at + ESCALATION_MIN_AGE_DAYS (ERR_ESCALATION_TOO_EARLY; boundary: exactly equal allows escalation)"
        side_effects:
          - "escalated_at = clock"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only; both entries pass the
# serial-observability filter — a second strictly-sequential request observes
# no state-machine field that would reject it)
# =============================================================================
concurrency_rules:
  - rule_id: rate-schedule-activate-stale-contract
    parent_entity: FacilityContract
    write_endpoint: "POST /comm-services/rate-schedules/{id}/activate"
    occ_field: expected_contract_version
    description: |
      Activating a RateSchedule supersedes the contract's currently ACTIVE
      schedule and bumps FacilityContract.version. A client whose last observed
      contract version is older than the current one (because another schedule
      was activated in between, which legitimately superseded the prior one)
      is rejected with 412 — its view of which schedule is ACTIVE is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: regulatory-cap-amend-stale
    parent_entity: RegulatoryCap
    write_endpoint: "PUT /comm-services/regulatory-caps/{id}"
    occ_field: expected_regulatory_cap_version
    description: |
      Amending a RegulatoryCap replaces the jurisdiction's cap values in place
      and bumps RegulatoryCap.version. A client whose last observed cap version
      is older than the current one (because another amendment already landed)
      is rejected with 412 rather than silently overwriting the newer values.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_rate_snapshot
    trigger: "CallRecord creation (connect)"
    algorithm: threshold
    formula: |
      schedule = the ACTIVE RateSchedule of the contract that is ACTIVE for the
      account's facility (ERR_NO_ACTIVE_RATE_SCHEDULE if none)
      cap = RegulatoryCap row for facility.state_code
      applied_per_minute_cents = min(schedule.<call_type>_per_minute_cents, cap.max_per_minute_cents)
      applied_connection_fee_cents = min(schedule.connection_fee_cents, cap.max_connection_fee_cents)
      Both values are pinned on the CallRecord at connect; later cap amendments
      or schedule supersession do NOT alter an existing CallRecord.
    input_set: "The facility's ACTIVE contract's ACTIVE RateSchedule; the jurisdiction's current RegulatoryCap row"
    constants: {}
    precision: "integer cents; no rounding"

  - name: call_charge
    trigger: "POST /comm-services/calls/{id}/end with duration_seconds > 0"
    algorithm: threshold
    formula: |
      billable_minutes_requested = ceil(duration_seconds / 60)
      charge_if_full = applied_connection_fee_cents + billable_minutes_requested * applied_per_minute_cents
      balance_at_connect = account.balance_cents as observed when the call was created
      For PREPAID/DEBIT accounts:
        affordable_minutes = floor((balance_at_connect - applied_connection_fee_cents) / applied_per_minute_cents)
        if billable_minutes_requested > affordable_minutes:
          billable_minutes = affordable_minutes
          total_charge_cents = applied_connection_fee_cents + affordable_minutes * applied_per_minute_cents
          cutoff_reason = BALANCE_EXHAUSTED   (status is still COMPLETED)
        else:
          billable_minutes = billable_minutes_requested; total_charge_cents = charge_if_full; cutoff_reason = NONE
        Postcondition invariant: account.balance_cents >= 0 after the charge.
      For COLLECT accounts:
        headroom_cents = balance_at_connect + account.collect_credit_limit_cents
        affordable_minutes = floor((headroom_cents - applied_connection_fee_cents) / applied_per_minute_cents)
        if billable_minutes_requested > affordable_minutes:
          billable_minutes = affordable_minutes; cutoff_reason = CREDIT_LIMIT_REACHED
          total_charge_cents = applied_connection_fee_cents + affordable_minutes * applied_per_minute_cents
        else:
          billable_minutes = billable_minutes_requested; total_charge_cents = charge_if_full; cutoff_reason = NONE
        Postcondition invariant: account.balance_cents >= -collect_credit_limit_cents.
      duration_seconds == 0 produces status NOT_CONNECTED and total_charge_cents = 0 (no ledger entry).
    input_set: "The single CallRecord being ended; its pinned applied rates; the account balance at connect"
    constants: {}
    precision: "integer cents; ceil for minute rounding, floor for affordability"

  - name: deposit_crediting
    trigger: "POST /comm-services/accounts/{id}/deposits"
    algorithm: threshold
    formula: |
      contract = the ACTIVE contract for the account's facility (ERR_NO_ACTIVE_CONTRACT if none)
      fee_cents = min(contract.deposit_fee_cents, cap.max_deposit_fee_cents at deposit time)
      Require amount_cents > fee_cents (ERR_DEPOSIT_TOO_SMALL; boundary: amount == fee + 1 is allowed, netting 1 cent)
      Append two ledger entries: DEPOSIT +amount_cents, then DEPOSIT_FEE -fee_cents.
      Net balance change = amount_cents - fee_cents.
      COLLECT accounts: deposits reduce the receivable (same signed-ledger arithmetic).
    input_set: "Single deposit request; facility's ACTIVE contract; jurisdiction's current RegulatoryCap"
    constants: {}
    precision: "integer cents"

  - name: refund_payout
    trigger: "Account closure (computed at close and recorded on the RefundRequest at decide); deny path uses the same formula"
    algorithm: chronological
    formula: |
      Inputs: ledger (all FundingTransactions of the account, chronological by created_at),
      B = balance_at_closure_cents, closure_fee F (min-capped at close time; 0 for release auto-close).
      Variant selection: RegulatoryCap.refund_method of the account facility's state.

      Variant SIMPLE_BALANCE:
        payout = max(0, B - F)

      Variant LIFO_NET (fee-restoring):
        1. charges_total = sum of magnitudes of CALL_CHARGE + MESSAGE_CHARGE + VIDEO_CHARGE
           minus magnitudes of MESSAGE_REFUND + VIDEO_REFUND  (fees and deposits excluded)
        2. Attribute charges_total against DEPOSIT principal amounts in LIFO order
           (newest deposit first). A deposit is INTACT if no charge is attributed to it.
        3. fee_refund = sum of the DEPOSIT_FEE magnitudes attached to INTACT deposits.
        4. payout = max(0, B - F + fee_refund)
      Evaluation order is pinned as written: attribution (step 2) uses deposit PRINCIPAL
      only; fee debits never enter the attribution; payout combines B, F, fee_refund last.
    input_set: "All FundingTransactions of the closing account; the closure-fee value resolved at close time; the jurisdiction's refund_method"
    constants: {}
    precision: "integer cents; no rounding"
    variants:
      - name: SIMPLE_BALANCE
        when: "RegulatoryCap.refund_method == SIMPLE_BALANCE"
        difference: "Payout is balance minus closure fee; deposit fees are never returned"
      - name: LIFO_NET
        when: "RegulatoryCap.refund_method == LIFO_NET"
        difference: "Deposits left fully unspent under LIFO charge-attribution have their deposit fees returned, increasing the payout for identical ledger data"

  - name: site_commission_accrual
    trigger: "GET /comm-services/facilities/{id}/regulatory-summary (computed on read)"
    algorithm: aggregation
    formula: |
      Window W = [period_start, period_end) half-open over FundingTransaction.created_at
      for all accounts of the facility.
      gross_billed = magnitudes of CALL_CHARGE + MESSAGE_CHARGE + VIDEO_CHARGE in W
      deposit_fees = magnitudes of DEPOSIT_FEE in W
      service_refunds = magnitudes of MESSAGE_REFUND + VIDEO_REFUND in W
      contract = the facility's currently ACTIVE contract (commission_pct, commission_basis)
      Variant GROSS: basis_total = gross_billed
      Variant NET:   basis_total = gross_billed - deposit_fees - service_refunds
      commission_accrued_cents = round_half_up(contract.commission_pct * basis_total)
      ROUNDING ORDER PINNED: the percentage is applied ONCE to the aggregate
      basis_total, then rounded half-up to cents. Per-transaction rounding
      (round each line then sum) is a different, non-conformant algorithm and
      produces different cents.
    input_set: "FundingTransactions of facility accounts with created_at in [period_start, period_end); the facility's currently ACTIVE contract"
    constants: {}
    precision: "0 decimal places on the final cent value, round_half_up, applied once to the aggregate"
    variants:
      - name: GROSS
        when: "contract.commission_basis == GROSS"
        difference: "Commission base is total billed revenue with no deductions"
      - name: NET
        when: "contract.commission_basis == NET"
        difference: "Commission base excludes deposit fees and message/video refunds, so identical ledger data accrues a smaller commission"

  - name: video_session_charge
    trigger: "POST /comm-services/video-sessions/{id}/confirm"
    algorithm: threshold
    formula: |
      fee = min(schedule.video_session_fee_cents, cap.max_ancillary_fee_cents at confirm time)
      Append VIDEO_CHARGE -fee. Confirm requires the account to cover fee under its
      funding-model rule: PREPAID/DEBIT balance_cents >= fee; COLLECT
      balance_cents - fee >= -collect_credit_limit_cents (ERR_INSUFFICIENT_BALANCE).
    input_set: "The contract's ACTIVE schedule; the jurisdiction's current RegulatoryCap; the billed account"
    constants: {}
    precision: "integer cents"

  - name: message_charge
    trigger: "POST /comm-services/messages"
    algorithm: threshold
    formula: |
      price_cents = min(schedule.message_price_cents, cap.max_ancillary_fee_cents at creation time)
      Append MESSAGE_CHARGE -price_cents at creation (PENDING_REVIEW).
      Requires: PREPAID/DEBIT balance_cents >= price_cents; COLLECT
      balance_cents - price_cents >= -collect_credit_limit_cents (ERR_INSUFFICIENT_BALANCE).
      On REJECTED: append MESSAGE_REFUND +price_cents (exact reversal).
    input_set: "The contract's ACTIVE schedule; the jurisdiction's current RegulatoryCap; the billed account"
    constants: {}
    precision: "integer cents"

  - name: dormancy_detection
    trigger: "POST /comm-services/facilities/{id}/run-dormancy-scan"
    algorithm: threshold
    formula: |
      For every Account of the facility with status == CLOSED,
      unclaimed_balance_cents > 0, and escheat_status == NONE:
        if clock >= unclaimed_since + cap.dormancy_days:  escheat_status = DORMANT
      Boundary: an account whose unclaimed age equals dormancy_days exactly IS flagged.
      Escheat/refund bookkeeping entries (CLOSURE_FEE, REFUND_PAYOUT, ESCHEAT_REMITTANCE)
      never reset unclaimed_since; only the DENY decision sets it.
      Output: { accounts_flagged: <count transitioned this scan> }.
    input_set: "CLOSED accounts of the facility with positive unclaimed balance and escheat_status NONE"
    constants: {}
    precision: "whole days, compared against the logical clock instant"

  - name: video_capacity_sweep
    trigger: "POST /comm-services/video-sessions/{id}/confirm"
    algorithm: interval_merge
    formula: |
      For the facility on the session's UTC date:
        buffered(s) = [s.scheduled_start - video_turnover_minutes,
                       s.scheduled_end   + video_turnover_minutes)   (half-open)
        candidate set = all VideoSessions of the facility with status == CONFIRMED
        Sweep all buffered intervals (candidate set + the new session): let M be the
        maximum number of intervals covering any single instant.
        Confirm requires M <= video_booth_count (ERR_FACILITY_CAPACITY_EXCEEDED).
      Contrast with the inmate rule, which uses UNBUFFERED half-open overlap:
        exists other CONFIRMED session of the same inmate with
        other.start < new.end AND new.start < other.end  -> ERR_INMATE_SESSION_OVERLAP.
        Adjacency (other.end == new.start) is NOT an overlap.
      Daily limit: count of the inmate's CONFIRMED sessions whose scheduled_start falls
      on the same UTC date must be < daily_session_limit_per_inmate
      (ERR_DAILY_SESSION_LIMIT_EXCEEDED).
    input_set: "Facility's CONFIRMED VideoSessions on the UTC date of the new session; facility capacity fields"
    constants: {}
    precision: "instant-exact datetime arithmetic; half-open intervals"

  - name: regulatory_summary_aggregation
    trigger: "GET /comm-services/facilities/{id}/regulatory-summary"
    algorithm: aggregation
    formula: |
      Window W = [period_start, period_end) half-open.
      Over CallRecords of the facility with status == COMPLETED and ended_at in W:
        total_call_seconds = sum(duration_seconds)
        total_billable_minutes = sum(billable_minutes)
        total_call_revenue_cents = sum(total_charge_cents)
        total_connection_fees_cents = sum(applied_connection_fee_cents)   [only calls with total_charge_cents > 0]
        avg_revenue_per_billable_minute_cents = total_billable_minutes == 0 ? 0
          : round_half_up(total_call_revenue_cents / total_billable_minutes)
        cap_breach_count = count of those calls whose applied_per_minute_cents
          exceeds the CURRENT RegulatoryCap.max_per_minute_cents (historical pins can
          exceed a cap that was amended downward after connect; reported, not rejected)
      Over FundingTransactions of facility accounts with created_at in W:
        total_deposit_fees_cents = magnitudes of DEPOSIT_FEE
        total_message_fees_net_cents = magnitudes of MESSAGE_CHARGE minus magnitudes of MESSAGE_REFUND
        total_video_fees_net_cents = magnitudes of VIDEO_CHARGE minus magnitudes of VIDEO_REFUND
        total_closure_fees_cents = net signed magnitudes of CLOSURE_FEE (sum of amounts, sign-flipped)
        total_escheated_cents = magnitudes of ESCHEAT_REMITTANCE
      commission per site_commission_accrual (contract ACTIVE at read time).
      Over Complaints of the facility:
        complaints_filed = count with created_at in W
        complaints_resolved = count with resolved_at in W
        complaints_escalated = count with escalated_at in W
    input_set: "Facility-scoped CallRecords, FundingTransactions, Complaints filtered by the half-open window; current RegulatoryCap; current ACTIVE contract"
    constants: {}
    precision: "integer cents; avg round_half_up with div-by-zero pinned to 0"

# =============================================================================
# §1.3 companion — named compensating/conservation invariants (Rule 9 anchors)
# =============================================================================
invariants:
  - name: message_charge_refund_balance
    statement: |
      For any TabletMessage that is created and later REJECTED:
      Account.balance_cents is identical before creation and after rejection, and
      sum(MESSAGE_CHARGE magnitudes) - sum(MESSAGE_REFUND magnitudes) == 0 over the
      account ledger for that message. Conserved quantity: account balance (cents).
  - name: video_booth_minutes_budget
    statement: |
      For any facility F and UTC date D:
      sum(duration_minutes of VideoSessions with status == CONFIRMED on D)
        + bookable_minutes(F, D)
        == video_booth_count * (visiting_close_minutes - visiting_open_minutes).
      Confirm then cancel of the same session restores bookable_minutes exactly.
      Conserved quantity: booth-minute capacity (time inventory).
  - name: closure_balance_partition
    statement: |
      At every point after an account closes:
      balance_at_closure_cents == refunded_total_cents + escheated_total_cents
        + retained_fees_cents + remaining_frozen_balance_cents + unclaimed_balance_cents
      where remaining_frozen_balance_cents is the not-yet-settled remainder on the ledger.
      Conserved quantity: the closure balance is partitioned without drift across
      refund payout, escheat remittance, retained fees, unclaimed, and frozen buckets.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — a request failing several
# checks reports the LOWEST priority number's error)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty; role value must be one of the six declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership / segregation-of-duties: entity-backed roles may only act on their own resource (AccountHolder X-User-ID == account id; RecipientParty X-User-ID == recipient number id); refund decide and mark-paid enforce the SoD pairings"
    error_id: ERR_NOT_RESOURCE_OWNER | ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "account-scoped writes, recipient-number writes, refund decide/mark-paid"
  - priority: 4
    category: existence
    check: "Request shape and scalar sanity: required fields present, enums in range, datetimes parse, amounts > 0 where required, message body <= 1000 chars, session end > start, session within visiting window and length bounds"
    error_id: "ERR_INVALID_REQUEST | ERR_SESSION_DURATION_INVALID | ERR_SESSION_IN_PAST | ERR_MESSAGE_TOO_LONG | ERR_CONSENT_REQUIRED | ERR_VERIFICATION_CODE_INVALID"
    http_status: "400 | 422"
    applies_to: "all endpoints with a body"
  - priority: 5
    category: existence
    check: "Path ids resolve left-to-right, then body foreign keys in the endpoint's declared input order; each miss yields the entity-specific 404"
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_REGULATORY_CAP_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_RATE_SCHEDULE_NOT_FOUND | ERR_INMATE_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_RECIPIENT_NUMBER_NOT_FOUND | ERR_CALL_NOT_FOUND | ERR_VIDEO_SESSION_NOT_FOUND | ERR_MESSAGE_NOT_FOUND | ERR_REFUND_REQUEST_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 6
    category: state
    check: "Target resource and directly-gating parents are in a valid state for the operation (facility ACTIVE for calls/video/messages; account ACTIVE for deposits/calls/messages/video; inmate IN_CUSTODY; contract ACTIVE for schedule activation; state-machine from-state matches)"
    error_id: "ERR_INVALID_STATE | ERR_FACILITY_NOT_ACTIVE | ERR_ACCOUNT_NOT_ACTIVE | ERR_INMATE_NOT_IN_CUSTODY | ERR_CONTRACT_NOT_ACTIVE | ERR_NO_ACTIVE_CONTRACT | ERR_NO_ACTIVE_RATE_SCHEDULE"
    http_status: 409
    applies_to: "all state-transition and money-moving endpoints"
  - priority: 7
    category: business_safety
    check: "Recipient consent and protection: call requires recipient verification_status == VERIFIED; block_status != BLOCKED; consent captured. Attorney-privilege recording exemption is resolved at connect."
    error_id: "ERR_NUMBER_NOT_VERIFIED | ERR_NUMBER_BLOCKED"
    http_status: 409
    applies_to: "POST /comm-services/calls"
  - priority: 8
    category: business_temporal
    check: "Time-window rules: video session still in the future at confirm; no unbuffered half-open overlap with the inmate's other CONFIRMED sessions; complaint escalation age >= ESCALATION_MIN_AGE_DAYS; escheat remit only after claim_window_days"
    error_id: "ERR_SESSION_IN_PAST | ERR_INMATE_SESSION_OVERLAP | ERR_ESCALATION_TOO_EARLY | ERR_CLAIM_WINDOW_OPEN"
    http_status: "409 | 422"
    applies_to: "video confirm, complaint escalate, escheat remit"
  - priority: 9
    category: business_constraint
    check: "Capacity, uniqueness and configuration constraints: buffered booth-capacity sweep; daily per-inmate session limit; one ACTIVE contract per facility; unique cap per state_code; unique booking_number per facility; regulatory caps on rates/fees/commission"
    error_id: "ERR_FACILITY_CAPACITY_EXCEEDED | ERR_DAILY_SESSION_LIMIT_EXCEEDED | ERR_ACTIVE_CONTRACT_EXISTS | ERR_DUPLICATE_CAP_FOR_STATE | ERR_DUPLICATE_BOOKING_NUMBER | ERR_COMMISSION_EXCEEDS_CAP | ERR_RATE_EXCEEDS_CAP"
    http_status: 409
    applies_to: "video confirm, contract/schedule/cap/inmate creation and activation"
  - priority: 10
    category: business_fiscal
    check: "Money sufficiency and shape: prepaid/debit balance or collect headroom covers the charge; deposit exceeds its fee; account-to-inmate binding"
    error_id: "ERR_INSUFFICIENT_BALANCE | ERR_DEPOSIT_TOO_SMALL | ERR_ACCOUNT_INMATE_MISMATCH"
    http_status: "402 | 422 | 409"
    applies_to: "deposits, calls, video confirm, messages"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; UNPREFIXED, outside /comm-services) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All timestamp comparisons (session windows, dormancy, escalation age, claim window) read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Facility ---
  - method: POST
    path: "/comm-services/facilities"
    description: "Create a facility in ONBOARDING status"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, video_booth_count, max_session_minutes, visiting_open_minutes, visiting_close_minutes, "video_turnover_minutes?", "daily_session_limit_per_inmate?"]
    output: Facility
    side_effects: ["status = ONBOARDING"]
  - method: GET
    path: "/comm-services/facilities/{id}"
    description: "Get a facility"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: Facility
    side_effects: []
  - method: GET
    path: "/comm-services/facilities"
    description: "List facilities"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: "Facility[]"
    side_effects: []
  - method: POST
    path: "/comm-services/facilities/{id}/activate"
    description: "Activate (or resume) a facility; requires at least one ACTIVE contract"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/comm-services/facilities/{id}/suspend"
    description: "Suspend a facility; blocks new calls/sessions/messages/deposits, in-flight calls unaffected"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Facility
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/comm-services/facilities/{id}/run-dormancy-scan"
    description: "Ops-run checkpoint: flag CLOSED accounts whose unclaimed balance has aged past dormancy_days"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ accounts_flagged: integer }"
    side_effects: ["Eligible accounts: escheat_status NONE -> DORMANT (see dormancy_detection calc)"]
  - method: GET
    path: "/comm-services/facilities/{id}/video-availability"
    description: "Computed read: booth-minute budget for a UTC date"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: [date]
    output: "{ date: string, booth_count: integer, booked_minutes: integer, bookable_minutes: integer }"
    side_effects: []
  - method: GET
    path: "/comm-services/facilities/{id}/regulatory-summary"
    description: "Computed read: rate/fee disclosure aggregates and commission accrual for a half-open window"
    roles: [PlatformAdmin, StateRegulator, ComplianceOfficer]
    code: 200
    input: [period_start, period_end]
    output: "{ total_call_seconds: integer, total_billable_minutes: integer, total_call_revenue_cents: integer, total_connection_fees_cents: integer, avg_revenue_per_billable_minute_cents: integer, total_deposit_fees_cents: integer, total_message_fees_net_cents: integer, total_video_fees_net_cents: integer, total_closure_fees_cents: integer, total_escheated_cents: integer, commission_basis: string, commission_accrued_cents: integer, complaints_filed: integer, complaints_resolved: integer, complaints_escalated: integer, cap_breach_count: integer }"
    side_effects: []

  # --- RegulatoryCap ---
  - method: POST
    path: "/comm-services/regulatory-caps"
    description: "Create the regulatory cap row for a jurisdiction (one per state_code)"
    roles: [StateRegulator]
    code: 201
    input: [state_code, max_per_minute_cents, max_connection_fee_cents, max_ancillary_fee_cents, max_deposit_fee_cents, max_commission_pct, refund_method, dormancy_days, claim_window_days]
    output: RegulatoryCap
    side_effects: ["ERR_DUPLICATE_CAP_FOR_STATE if a row already exists for state_code"]
  - method: GET
    path: "/comm-services/regulatory-caps/{id}"
    description: "Get a regulatory cap row"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: []
    output: RegulatoryCap
    side_effects: []
  - method: GET
    path: "/comm-services/regulatory-caps"
    description: "List regulatory cap rows"
    roles: [PlatformAdmin, StateRegulator, FacilityStaff, AccountHolder, RecipientParty, ComplianceOfficer]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "RegulatoryCap[]"
    side_effects: []
  - method: PUT
    path: "/comm-services/regulatory-caps/{id}"
    description: "Amend cap values in place (OCC-guarded). Amendments are NOT retroactive: active schedules keep their validated rates; charge-time min() rules pick up the new cap from the next charge."
    roles: [StateRegulator]
    code: 200
    input: [expected_regulatory_cap_version, "max_per_minute_cents?", "max_connection_fee_cents?", "max_ancillary_fee_cents?", "max_deposit_fee_cents?", "max_commission_pct?", "refund_method?", "dormancy_days?", "claim_window_days?"]
    output: RegulatoryCap
    side_effects: ["increments RegulatoryCap.version by 1", "ERR_STALE_VERSION (412) on version mismatch"]

  # --- FacilityContract ---
  - method: POST
