  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: panelist_half_open_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_PANEL_TIME_OVERLAP]
          - entities.CapacityInterview.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the panelist resource — an interview
          starting exactly at another's end (adjacency) is allowed, while a strictly
          overlapping window is rejected with ERR_PANEL_TIME_OVERLAP.
        test_recipe:
          setup:
            - "Applications A, B, C all UNDER_REVIEW (no rubric scores, so no SOD conflicts)"
            - "Application A has SCHEDULED interview 2026-06-08T10:00-11:00Z with panelist rev_p1"
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "TO Panel Academy A", founding_group: "FG TO1", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_to1
              captures: { app_a: $.data.id }
            - call: "POST /authorizer/applications/${app_a}/accept-intake"
              payload: {}
              as: AuthorizerStaff
            - call: "POST /authorizer/applications/${app_a}/interviews"
              payload: { scheduled_start: "2026-06-08T10:00:00Z", scheduled_end: "2026-06-08T11:00:00Z", panelist_user_ids: ["rev_p1"] }
              as: AuthorizerStaff
