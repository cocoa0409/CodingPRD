            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_biz_1"}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {sv_v_ready: "$.data.version"}}
