              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 0 }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t1: $.data.0.id }
            - call: "POST /api/refill-tasks/${t1}/start"
              payload: {}
              as: LineOperator
            - call: "POST /api/sanitation-cycles"
              payload: { line_id: "${l1}", scheduled_start: "2026-09-01T00:10:00Z", scheduled_end: "2026-09-01T00:40:00Z" }
              as: ShiftManager
              captures: { c1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /api/sanitation-cycles/${c1}/start"
              payload: {}
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LINE_BUSY (REFILLING hopper on the line gates the cycle start despite the valid window)"
            - "SanitationCycle.${c1}.status == SCHEDULED and AssemblyLine.${l1}.status == ACTIVE"

  # ==========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: sanitation_windows_touching_allowed
        grounds:
          - validations[priority=8]
          - entities.SanitationCycle.fields.scheduled_start
        distinguishing_aspect: |
          Half-open interval semantics on the AssemblyLine resource: cycle B whose
          scheduled_start equals cycle A's scheduled_end does NOT overlap
          (touching allowed) and is accepted, while a cycle starting one minute
          earlier (strictly inside A) is rejected with ERR_SANITATION_OVERLAP.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; cycle A scheduled 01:00-02:00"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/sanitation-cycles"
              payload: { line_id: "${l1}", scheduled_start: "2026-09-01T01:00:00Z", scheduled_end: "2026-09-01T02:00:00Z" }
              as: ShiftManager
              captures: { cyc_a: $.data.id }
          trigger:
            - call: "POST /api/sanitation-cycles"
              payload: { line_id: "${l1}", scheduled_start: "2026-09-01T02:00:00Z", scheduled_end: "2026-09-01T03:00:00Z" }
              as: ShiftManager
              captures: { cyc_b: $.data.id }
            - call: "POST /api/sanitation-cycles"
              payload: { line_id: "${l1}", scheduled_start: "2026-09-01T01:59:00Z", scheduled_end: "2026-09-01T02:30:00Z" }
              as: ShiftManager
              captures: { err: $.data.error_id }
          assert:
            - "Touching cycle (02:00-03:00) accepted: created with status SCHEDULED"
            - "Overlapping cycle (01:59-02:30) rejected with ERR_SANITATION_OVERLAP"
      - name: labor_windows_touching_conflict_closed_interval
        grounds:
          - validations[priority=9]
          - entities.LaborAssignment.fields.window_end
        distinguishing_aspect: |
          Closed-interval semantics on the staff-member resource — the opposite
          geometry from sanitation: assignment B whose window_start equals
          assignment A's window_end DOES conflict (touching endpoints are inside
          both intervals) and is rejected with ERR_LABOR_OVERLAP.
        test_recipe:
          setup:
            - "Restaurant R1; labor assignment A for staff s1, MAKE_LINE -> PREP, 09:00-12:00"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/labor-assignments"
              payload: { restaurant_id: "${r1}", staff_user_id: "s1", from_role: "MAKE_LINE", to_role: "PREP", window_start: "2026-09-01T09:00:00Z", window_end: "2026-09-01T12:00:00Z" }
              as: ShiftManager
              captures: { la_a: $.data.id }
          trigger:
            - call: "POST /api/labor-assignments"
              payload: { restaurant_id: "${r1}", staff_user_id: "s1", from_role: "MAKE_LINE", to_role: "HOSPITALITY", window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T15:00:00Z" }
              as: ShiftManager
              captures: { err: $.data.error_id }
            - call: "POST /api/labor-assignments"
              payload: { restaurant_id: "${r1}", staff_user_id: "s1", from_role: "MAKE_LINE", to_role: "HOSPITALITY", window_start: "2026-09-01T12:00:01Z", window_end: "2026-09-01T15:00:00Z" }
              as: ShiftManager
              captures: { la_b: $.data.id }
          assert:
            - "Touching window (start == 12:00:00 == A.end) rejected with ERR_LABOR_OVERLAP (closed-interval)"
            - "Window starting 1 s later (12:00:01) accepted with is_active computed from the clock"

  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hopper_mass_balance_dispense_vs_failed_verification
        grounds:
          - entities.Hopper.fields.cumulative_dispensed_grams
          - entities.Hopper.fields.cumulative_waste_grams
          - state_machines.Order
        distinguishing_aspect: |
          Conserved quantity: hopper mass. Invariant: current_grams +
          cumulative_dispensed_grams + cumulative_waste_grams - cumulative_refilled_grams
          == initial_load_grams. A dispense of 100.5 followed by a failed
          verification moves 100.5 from dispensed to waste and leaves
          current_grams untouched — the conserved sum stays 1000.0.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING; recipe RC 100 g; hopper H1 coefficient 1.005 loaded exactly 1000 g; order O1 started (dispense 100.5, current 899.5)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/recipes"
              payload: { restaurant_id: "${r1}", name: "Harvest", base_complexity: 0, portion_spec: [{ ingredient_id: "${ing}", target_grams: 100 }] }
              as: OpsAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 2000, station_slot: 0, calibration_coefficient: 1.005 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 1000, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/orders"
              payload: { restaurant_id: "${r1}", recipe_id: "${rc}", expected_recipe_version: "${rc_v}" }
              as: Customer
              captures: { o1: $.data.id }
            - call: "POST /api/orders/${o1}/start-assembly"
              payload: {}
              as: LineOperator
          trigger:
            - call: "POST /api/orders/${o1}/submit-verification"
              payload: { measurements: [{ hopper_id: "${h1}", actual_grams: 120.0 }] }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}"
              payload: {}
              as: ShiftManager
              captures: { h_cur: $.data.current_grams, h_disp: $.data.cumulative_dispensed_grams, h_waste: $.data.cumulative_waste_grams, h_ref: $.data.cumulative_refilled_grams, h_init: $.data.initial_load_grams }
          assert:
            - "Hopper.${h1}.current_grams == 899.5 (failed dispense NOT returned to the hopper)"
            - "Hopper.${h1}.cumulative_dispensed_grams == 0.0 and cumulative_waste_grams == 100.5 (reclassified)"
            - "Invariant: 899.5 + 0.0 + 100.5 - 0 == 1000.0 == initial_load_grams"
      - name: prep_batch_quantity_invariant_under_cancel
        grounds:
          - entities.PrepBatch.fields.available_grams
          - state_machines.RefillTask
        distinguishing_aspect: |
          Different conserved quantity: batch grams. Invariant: quantity_grams ==
          allocated_grams + consumed_grams + available_grams. A READY task holding
          350 allocated followed by cancel releases exactly 350 back: allocated 0,
          consumed 0, available 1000 — forward action paired with its compensating
          action leaves the batch sum unchanged at 1000.
        test_recipe:
          setup:
            - "Restaurant R1; AUTOMATED line L1; ingredient ING; hopper H1 capacity 500 loaded 300; batch B1 1000 g READY; sensor 150 g -> auto task allocated 350 (batch allocated 350, available 650)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/restaurants"
              payload: { name: "R1", city: "LA" }
              as: OpsAdmin
              captures: { r1: $.data.id }
            - call: "POST /api/assembly-lines"
              payload: { restaurant_id: "${r1}", name: "L1", line_type: "AUTOMATED", service_rate_seconds_per_bowl: 45 }
              as: OpsAdmin
              captures: { l1: $.data.id }
            - call: "POST /api/ingredients"
              payload: { sku: "ROM", name: "Romaine", station_type: "BASE", shelf_life_minutes: 240 }
              as: OpsAdmin
              captures: { ing: $.data.id }
            - call: "POST /api/hoppers"
              payload: { line_id: "${l1}", ingredient_id: "${ing}", capacity_grams: 500, station_slot: 0, calibration_coefficient: 1.0 }
              as: OpsAdmin
              captures: { h1: $.data.id, h1_v: $.data.version }
            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b1: $.data.id }
            - call: "POST /api/prep-batches/${b1}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 150 }
              as: LineOperator
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t1: $.data.0.id }
          trigger:
            - call: "POST /api/refill-tasks/${t1}/cancel"
              payload: {}
              as: ShiftManager
            - call: "GET /api/prep-batches/${b1}"
              payload: {}
              as: PrepCook
              captures: { b_alloc: $.data.allocated_grams, b_cons: $.data.consumed_grams, b_avail: $.data.available_grams, b_qty: $.data.quantity_grams }
          assert:
            - "PrepBatch.${b1}.allocated_grams == 0 (release) and consumed_grams == 0 (never delivered)"
            - "PrepBatch.${b1}.available_grams == 1000"
            - "Invariant: quantity 1000 == allocated 0 + consumed 0 + available 1000"
