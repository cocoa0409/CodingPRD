            - "HarnessUnit.${u1}.status == TEST_PASS   # BUILT->REWORK->BUILT->REWORK->BUILT->TEST_PASS cycle"
            - "HarnessUnit.${u1}.continuity_pass == true and hipot_pass == true"

      - name: applicator_quarantine_requalification_cycle
        grounds:
          - state_machines.Applicator.QUALIFIED_to_QUARANTINED
          - state_machines.Applicator.AVAILABLE | QUALIFIED | QUARANTINED_to_IN_SETUP
          - state_machines.Applicator.AVAILABLE_to_QUALIFIED
          - state_machines.MachineProgram.HELD_to_QUALIFIED
        distinguishing_aspect: |
          Applicator is cyclic (AVAILABLE -> IN_SETUP -> AVAILABLE -> QUALIFIED ->
          QUARANTINED -> IN_SETUP -> AVAILABLE -> QUALIFIED) via setup, first-article
          pass, lot-sample fail, and requalification; different entity from the
          HarnessUnit rework cycle.
        test_recipe:
          setup:
            - "Class-2 drawing, applicator AP, program (min 30.0N), certified inspector; applicator qualified via first-article"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-NL2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-NL2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-NL2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI NL2", badge_no: "B-QI-NL2" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su1: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su1}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 32.0 }, as: QualityInspector, as_user_id: "${qi}" }
          trigger:
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "LOT_SAMPLE", measured_force_n: 29.9 }, as: QualityInspector, as_user_id: "${qi}", captures: { fail_result: $.data.result } }
            - { call: "GET /plant/applicators/${ap}", payload: {}, as: ProcessEngineer, captures: { ap_status_mid: $.data.status } }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-02T08:00:00Z", planned_end_at: "2026-08-02T09:00:00Z" }, as: ProcessEngineer, captures: { su2: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su2}/close", payload: { closed_at: "2026-08-02T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 31.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { requal_result: $.data.result } }
            - { call: "GET /plant/applicators/${ap}", payload: {}, as: ProcessEngineer }
            - { call: "GET /plant/machine-programs/${pr}", payload: {}, as: ProcessEngineer }
          assert:
            - "captured fail_result == FAIL   # 29.9 < 30.0"
            - "captured ap_status_mid == QUARANTINED"
            - "captured requal_result == PASS"
            - "Applicator.${ap}.status == QUALIFIED   # full cycle traversed"
            - "MachineProgram.${pr}.status == QUALIFIED   # HELD -> QUALIFIED requalification"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lot_sample_fail_quarantine_sweep
        grounds:
          - state_machines.Applicator.QUALIFIED_to_QUARANTINED
          - state_machines.MachineProgram.QUALIFIED_to_HELD
          - state_machines.BuildOrder.KITTING | IN_BUILD | TESTING_to_QC_HOLD
          - state_machines.HarnessUnit.BUILT | REWORK | TEST_PASS_to_SUSPECT
          - calculations.suspect_unit_selection
        distinguishing_aspect: |
          Depth-4 causal chain triggered by a LOT_SAMPLE FAIL record: applicator
          QUARANTINED (1) causes program HELD (2) which causes the drawing's build
          order QC_HOLD (3) which causes its post-qualification units SUSPECT (4);
          a control order on a different drawing/applicator is untouched.
        test_recipe:
          setup:
            - "D1 (class 2) with program P1 on applicator A1, qualified; order BO1 qty 3 IN_BUILD with units U1 (TEST_PASS) and U2 (BUILT)"
            - "Control: D2 with program P2 on applicator A2, qualified; order BO2 qty 2 IN_BUILD with unit U3 (BUILT)"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-TC1A", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr1: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr1}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr1}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-TC1", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap1: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-TC1", drawing_id: "${dr1}", applicator_id: "${ap1}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr1: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI TC1", badge_no: "B-QI-TC1" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap1}", program_id: "${pr1}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su1: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su1}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap1}", program_id: "${pr1}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-TC1", drawing_id: "${dr1}", qty_ordered: 3 }, as: ProductionPlanner, captures: { bo1: $.data.id } }
            - { call: "POST /plant/build-orders/${bo1}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo1}" }, as: MaterialsClerk, captures: { kit1: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit1}/issues", payload: { component_id: "${t1}", qty_issued: 3, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit1}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO TC1", badge_no: "B-LO-TC1" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo1}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
            - { call: "POST /plant/build-orders/${bo1}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u2: $.data.id } }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 5.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-TC1B", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr2: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr2}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t2: $.data.id } }
            - { call: "POST /plant/drawings/${dr2}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-TC1-CTRL", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap2: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-TC1-CTRL", drawing_id: "${dr2}", applicator_id: "${ap2}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr2: $.data.id } }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap2}", program_id: "${pr2}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T10:00:00Z", planned_end_at: "2026-08-01T11:00:00Z" }, as: ProcessEngineer, captures: { su2: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su2}/close", payload: { closed_at: "2026-08-01T11:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap2}", program_id: "${pr2}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-TC1-CTRL", drawing_id: "${dr2}", qty_ordered: 2 }, as: ProductionPlanner, captures: { bo2: $.data.id } }
            - { call: "POST /plant/build-orders/${bo2}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo2}" }, as: MaterialsClerk, captures: { kit2: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit2}/issues", payload: { component_id: "${t2}", qty_issued: 2, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit2}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/build-orders/${bo2}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u3: $.data.id } }
          trigger:
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap1}", program_id: "${pr1}", sample_kind: "LOT_SAMPLE", measured_force_n: 20.0 }, as: QualityInspector, as_user_id: "${qi}", captures: { fail_result: $.data.result } }
            - { call: "GET /plant/applicators/${ap1}", payload: {}, as: ProcessEngineer }
            - { call: "GET /plant/machine-programs/${pr1}", payload: {}, as: ProcessEngineer }
            - { call: "GET /plant/build-orders/${bo1}", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/harness-units/${u1}", payload: {}, as: QualityInspector }
            - { call: "GET /plant/harness-units/${u2}", payload: {}, as: QualityInspector }
            - { call: "GET /plant/applicators/${ap2}", payload: {}, as: ProcessEngineer }
            - { call: "GET /plant/build-orders/${bo2}", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/harness-units/${u3}", payload: {}, as: QualityInspector }
          assert:
            - "captured fail_result == FAIL"
            - "Applicator.${ap1}.status == QUARANTINED                                   # depth 1"
            - "MachineProgram.${pr1}.status == HELD                                      # depth 2"
            - "BuildOrder.${bo1}.status == QC_HOLD and qc_hold_return_status == IN_BUILD # depth 3"
            - "HarnessUnit.${u1}.status == SUSPECT and continuity_pass == false          # depth 4 (was TEST_PASS)"
            - "HarnessUnit.${u2}.status == SUSPECT                                       # depth 4 (was BUILT)"
            - "Applicator.${ap2}.status == QUALIFIED   # control applicator untouched"
            - "BuildOrder.${bo2}.status == IN_BUILD    # control order untouched"
            - "HarnessUnit.${u3}.status == BUILT       # control unit untouched"

      - name: ecn_apply_scrap_disposition_chain
        grounds:
          - state_machines.EngineeringChangeNotice.OPEN_to_APPLIED
          - state_machines.HarnessDrawing.RELEASED_to_SUPERSEDED
          - state_machines.BuildOrder.OPEN | KITTING | IN_BUILD | TESTING | QC_HOLD_to_CANCELLED
          - state_machines.HarnessUnit.BUILT | REWORK | TEST_PASS | SUSPECT_to_SCRAPPED
          - calculations.scrap_recovery_credit
          - calculations.consigned_lot_quantity_reconciliation
        distinguishing_aspect: |
          Depth-4 chain from a different trigger (ECN apply, not a pull test):
          ECN APPLIED supersedes the drawing and creates a new DRAFT revision (1),
          supersession dispositions the pinned build order to CANCELLED (2), which
          scraps its WIP unit with per-line scrap credit (3), whose consigned
          content transfers lot qty_consumed -> qty_scrapped (4). A SHIPPED unit
          is terminal and survives.
        test_recipe:
          setup:
            - "Class-2 drawing rev A with consigned connector C1 (qty_per 1, 450c) and factory terminal T1 (qty_per 1, 25c), RELEASED"
            - "Lot (liability 500, replacement 640, received 5); qualified program; certified inspector"
            - "Order qty 2, kit fully issued (C1 x2 consigned + T1 x2 factory) and delivered; U1 built, tested PASS, SHIPPED; U2 built (BUILT); order TESTING"
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-TC2", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "C1", component_type: "CONNECTOR", mpn: "CON-500", qty_per_harness: 1, supply_type: "CUSTOMER_CONSIGNED", unit_cost_cents: 450 }, as: HarnessEngineer, captures: { c1: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 25 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-TC2", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-TC2", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI TC2", badge_no: "B-QI-TC2" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/consigned-lots", payload: { lot_code: "LOT-TC2", owner_customer_code: "ACME", mpn: "CON-500", unit_liability_cents: 500, replacement_cost_cents: 640, qty_received: 5 }, as: MaterialsClerk, captures: { lot: $.data.id } }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-TC2", drawing_id: "${dr}", qty_ordered: 2 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${c1}", qty_issued: 2, source: "CONSIGNED_LOT", consigned_lot_id: "${lot}" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 2, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO TC2", badge_no: "B-LO-TC2" }, as: QualityManager, captures: { lo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u2: $.data.id } }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 5.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/harness-units/${u1}/ship", payload: {}, as: ShippingClerk }
            - { call: "POST /plant/ecns", payload: { drawing_id: "${dr}", to_revision: "B", wip_disposition: "SCRAP" }, as: HarnessEngineer, captures: { ecn: $.data.id } }
          trigger:
            - { call: "POST /plant/ecns/${ecn}/apply", payload: {}, as: HarnessEngineer, captures: { new_dr: $.data.new_drawing_id } }
            - { call: "GET /plant/drawings/${dr}", payload: {}, as: HarnessEngineer }
            - { call: "GET /plant/drawings/${new_dr}", payload: {}, as: HarnessEngineer }
            - { call: "GET /plant/components", payload: { drawing_id: "${new_dr}" }, as: HarnessEngineer }
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/harness-units/${u1}", payload: {}, as: QualityInspector }
            - { call: "GET /plant/harness-units/${u2}", payload: {}, as: QualityInspector }
            - { call: "GET /plant/consigned-lots/${lot}", payload: {}, as: MaterialsClerk }
          assert:
            - "HarnessDrawing.${dr}.status == SUPERSEDED                                   # depth 1"
            - "HarnessDrawing.${new_dr}.revision == B and status == DRAFT                # new revision row"
            - "components list for ${new_dr} has total_count == 2                        # BOM copied"
            - "BuildOrder.${bo}.status == CANCELLED                                      # depth 2"
            - "HarnessUnit.${u2}.status == SCRAPPED and scrap_reason == ECN_DISPOSITION  # depth 3"
            - "HarnessUnit.${u1}.status == SHIPPED   # terminal unit untouched"
