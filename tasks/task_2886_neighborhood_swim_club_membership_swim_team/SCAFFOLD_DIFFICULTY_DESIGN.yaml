          trigger:
            - call: "POST /swim-club/conduct-cases/${c_id}/transitions"
              payload: { to_status: "SANCTIONED", sanction_type: "SUSPENSION" }
              as: BoardPresident
              as_user_id: "bp-001"
              captures: { c_status: $.data.status, c_points: $.data.points_assessed, c_decided_by: $.data.decided_by_user_id }
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: BoardPresident
              captures: { h_standing: $.data.standing, h_points: $.data.conduct_points }
            - call: "GET /swim-club/memberships/${m_a_id}"
              payload: {}
              as: BoardPresident
              captures: { m_access: $.data.access_status, m_dues: $.data.dues_status, m_req: $.data.volunteer_credits_required }
            - call: "GET /swim-club/swim-team-registrations/${r1_id}"
              payload: {}
              as: BoardPresident
              captures: { r1_status: $.data.status }
            - call: "GET /swim-club/volunteer-assignments/${a1_id}"
              payload: {}
              as: BoardPresident
              captures: { a1_status: $.data.status }
