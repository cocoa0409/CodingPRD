          trigger:
            - call: "GET /signal-ops/intersections/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: SignalOpsAdmin
              captures: { e_int: $.data.error_id, e_int_msg: $.data.message }
            - call: "GET /signal-ops/retiming-projects/11111111-1111-4111-8111-111111111111"
              payload: {}
