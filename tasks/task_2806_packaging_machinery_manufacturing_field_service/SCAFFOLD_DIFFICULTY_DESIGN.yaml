            - "BuildSlot.${slot_a_id}.superseded_by_slot_id == ${slot_b_id}"
            - "BuildSlot.${slot_a_id}.slot_days == 20 (history is preserved, not zeroed)"
            - "ProductionLine.${line_id}.committed_slot_days == 15 (NOT 35: the released 20 days were credited back in the same request)"
            - "GET /packaging-oem/build-slots?production_line_id=${line_id}&status=RESERVED returns exactly 1 item"

      - name: claim_void_restores_goodwill_budget_and_releases_billable_hold
        grounds:
          - calculations.goodwill_ledger
          - calculations.claim_goodwill_charge
          - calculations.coverage_posture
          - calculations.pm_visit_billability
          - endpoints[POST /packaging-oem/warranty-claims/{warrantyClaimId}/void]
          - state_machines.WarrantyClaim.transitions[ADJUDICATED -> VOID]
          - state_machines.PreventiveMaintenanceVisit.transitions[BILLABLE_HOLD -> SCHEDULED]
        distinguishing_aspect: |
          Conserved quantity: GOODWILL MONEY (cents), a completely different ledger from the capacity-days
          instance. Voiding an adjudicated claim must restore goodwill_budget_cents to exactly
          goodwill_budget_initial_cents, which flips coverage_posture back out of BUDGET_EXHAUSTED and
          therefore un-does a downstream side effect on a THIRD entity: the PM visit that was pushed to
          BILLABLE_HOLD returns to SCHEDULED with billable recomputed to false. The money identity and
          the visit state must both be restored, and the defect-review counter on the model must
          decrement - a partial reversal is the natural wrong answer.
        test_recipe:
          setup:
            - "Customer 'Northwind Beverages' product_variation_pct 4.00, i.e. inside the 5.00 tolerance so the STRICT_DEFECT apportionment variant applies"
            - "ACCEPTED InstalledMachine under an ACTIVE GOLD ServiceContract with goodwill_budget_initial_cents 300000, pm_visits_included 2"
            - "one SCHEDULED, non-billable PM visit on that contract"
            - "one claim with a single 400000-cent line at defect_attribution_pct 100.00, both reviews signed off, adjudicated APPROVE"
            - "after adjudication: oem_share_cents 400000, goodwill_charged_cents min(400000, 300000) == 300000, goodwill_budget_cents 0, coverage_posture BUDGET_EXHAUSTED, the PM visit forced to BILLABLE_HOLD with billable true"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - call: "POST /packaging-oem/field-engineers"
              payload: { full_name: "Dana Reyes", region_code: "NA", certifications: ["FILLER"], travel_buffer_minutes: 60 }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
            - call: "POST /packaging-oem/machine-orders/${order_id}/engineer"
