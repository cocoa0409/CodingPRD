  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: missed_payment_cascades_installment_contract_plan_appointments_depth4
        grounds:
          - state_machines.Installment.SCHEDULED_to_MISSED
          - state_machines.Contract.billing_status=CURRENT_to_billing_status=DELINQUENT
          - state_machines.TreatmentPlan.ACTIVE_to_SUSPENDED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 cascade from a single charge-FAILED: Installment->MISSED causes Contract->DELINQUENT,
          which causes TreatmentPlan ACTIVE->SUSPENDED, which causes every future SCHEDULED ADJUSTMENT
          appointment for that plan to ->CANCELLED; each link is caused by the prior link, not the
          original trigger.
