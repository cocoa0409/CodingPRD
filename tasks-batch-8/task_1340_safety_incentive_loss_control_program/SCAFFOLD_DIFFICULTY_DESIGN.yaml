  - rule_id: priority_pair_validation_conflict
    instances:
      - name: award_approve_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=23]
          - state_machines.IncentiveAward.CALCULATED_to_APPROVED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INCENTIVE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the second approve of an
          already-APPROVED award violates the state precondition AND would exceed the
          remaining budget (3000 < 6000) — priority 5 state wins over priority 23 fiscal.
        test_recipe:
          setup:
            - "CLOSED LEADING_ONLY program with incentive_budget_cents 9000; employee X (LOW) earned exactly 40 points: observation validated 10 + control verified LATE 15 + meeting 5 + action verified 10"
            - "X's award payout_cents == 6000; award already APPROVED once, remaining_budget_cents == 3000"
