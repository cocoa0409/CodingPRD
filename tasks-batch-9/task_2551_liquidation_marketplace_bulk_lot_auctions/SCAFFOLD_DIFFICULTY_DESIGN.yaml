      - name: negotiation_cycles_four_alternating_turns_then_hits_round_cap
        grounds:
          - state_machines.Negotiation.CREATE_to_AWAITING_SELLER
          - state_machines.Negotiation.AWAITING_SELLER_to_AWAITING_BUYER
          - state_machines.Negotiation.AWAITING_BUYER_to_AWAITING_SELLER
          - calculations.negotiation_round_control
          - concurrency_rules[Negotiation]
          - entities.Negotiation.fields.round_number
          - entities.Negotiation.fields.current_offer_side
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
        distinguishing_aspect: |
          Negotiation is a cycle, not a chain: AWAITING_SELLER and AWAITING_BUYER re-enter each other
          on every counter-offer, so the same pair of states is occupied four times while
          round_number monotonically climbs 1,2,3,4 and current_offer_side alternates BUYER, SELLER,
          BUYER, SELLER. The cycle is not free-running - MAX_NEGOTIATION_ROUNDS 4 terminates it, so
          the fifth counter-offer is rejected with ERR_NEGOTIATION_ROUND_LIMIT while the negotiation
          stays in AWAITING_BUYER at round 4 rather than advancing or terminating.
