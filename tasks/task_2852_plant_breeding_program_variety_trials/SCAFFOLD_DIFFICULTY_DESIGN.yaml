            - "StewardshipAgreement.${agr_id}.status == APPROVED and revision_round == 0"
            - "BreedingProgram.${prog_id}.committed_plot_count == 56 (16 entry plots + 40 granted) and plot_budget_remaining == 4944"

      - name: agreement_submit_changes_requested_cycle_bumps_revision_round
        grounds:
          - state_machines.StewardshipAgreement
          - entities.StewardshipAgreement.fields.revision_round
          - entities.StewardshipAgreement.fields.requested_changes
          - endpoints["POST /stewardship-agreements/{id}/submit"]
          - endpoints["POST /stewardship-agreements/{id}/review"]
        distinguishing_aspect: |
          Cyclic shape on a different entity: SUBMITTED <-> CHANGES_REQUESTED is a
          re-enterable loop whose two inbound edges into SUBMITTED behave
          differently - the DRAFT edge leaves revision_round at 0 while the
          CHANGES_REQUESTED edge increments it and clears requested_changes - so
          the loop is counted rather than idempotent, and the parent line's
          stewardship_status stays PENDING for every pass through the loop.
        test_recipe:
          setup:
            - "One program, one objective, line SX-4001 with a DRAFT StewardshipAgreement."
          setup_api_calls:
            - call: "POST /breeding-programs"
