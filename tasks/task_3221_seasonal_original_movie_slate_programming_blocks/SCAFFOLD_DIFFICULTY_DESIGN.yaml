  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_brand_safety_on_approve
        grounds:
          - validations.priority_6
          - validations.priority_7
          - state_machines.Title.PITCHED_to_APPROVED
        distinguishing_aspect: |
          Error-category pair state vs business_safety: approving a REJECTED
          title that ALSO carries a forbidden content flag must return
          ERR_INVALID_STATE (priority 6) and never ERR_BRAND_VIOLATION
          (priority 7).
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season. One title with content_flags [VIOLENCE], rejected (state REJECTED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Gory Christmas", genre: "MYSTERY", tone_rating: "WARM", content_flags: ["VIOLENCE"], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/reject"
              payload: {}
              as: SlatePlanner
          trigger:
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (state priority 6 beats brand-safety priority 7)"
            - "http status == 409"
            - "Title.${t1}.status == REJECTED (unchanged)"
            - "Season.${season_id}.committed_title_count == 0"

      - name: temporal_vs_quota_on_air_slot_create
        grounds:
          - validations.priority_8
          - validations.priority_10
          - calculations.premiere_cadence_check
          - calculations.encore_cap_check
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint (a
          different pair than state vs business_safety): an ENCORE air slot
          that violates the same-title buffer (temporal, priority 8) AND would
          exceed the encore cap (constraint, priority 10) must return
          ERR_AIRSLOT_OVERLAP, not ERR_ENCORE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 1), one approved title."
            - "Block PUBLISHED with premiere_cadence_days 7, max_encores_per_title 1, min_minutes_between_airings 1440."
            - "Existing ENCORE E1 for the title at 2027-11-07T00:00:00Z (encore count already == 1 == cap)."
            - "New ENCORE requested at 2027-11-07T01:00:00Z — only 60 minutes after E1 (buffer violation) AND over the cap."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
            - call: "POST /slate/program-blocks"
              payload: { season_id: "${season_id}", name: "Friday Premieres", block_start: "2027-11-05T00:00:00Z", premiere_cadence_days: 7, max_encores_per_title: 1, min_minutes_between_airings: 1440 }
              as: ProgrammingExec
              captures: { block_id: $.data.id, bv: $.data.version }
            - call: "POST /slate/program-blocks/${block_id}/publish"
              payload: {}
              as: ProgrammingExec
              captures: { bv1: $.data.version }
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${t1}", air_start: "2027-11-07T00:00:00Z", kind: "ENCORE", expected_block_version: "${bv1}" }
              as: ProgrammingExec
              captures: { bv2: $.data.version }
          trigger:
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${t1}", air_start: "2027-11-07T01:00:00Z", kind: "ENCORE", expected_block_version: "${bv2}" }
              as: ProgrammingExec
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AIRSLOT_OVERLAP (temporal priority 8 beats constraint priority 10)"
            - "http status == 422"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: shoot_day_quota_equality_boundary
        grounds:
          - calculations.shoot_day_quota
        distinguishing_aspect: |
          Numeric threshold boundary on the production-day metric: booking that
          lands booked_shoot_days EXACTLY at max_shoot_days (30 == 30) succeeds
          (strict >), while one more day (31 > 30) is rejected — exercised via
          POST /slate/production-slots.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 2, max_shoot_days 30)."
            - "Two approved titles T1, T2; two locations."
            - "T1 has a BOOKED slot of 20 days -> booked == 20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
