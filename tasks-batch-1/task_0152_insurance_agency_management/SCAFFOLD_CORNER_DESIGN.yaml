              as_user_id: "${wp_id}"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "GET /policies?account_id=${acct1_id}"
              payload: {}
              as: AccountManager
          assert:
            - "response data array contains exactly the one policy with account_id == ${acct1_id}"

      - name: trust_ledger_entries_subresource
        claim_type: Computed read
        grounds:
          - "endpoints"
          - "entities.TrustLedgerEntry.fields.trust_account_id"
        distinguishing_aspect: "GET /trust-accounts/{id}/entries returns the trust account's ledger entries (FK reverse-reachability sub-resource form)."
        test_recipe:
          setup: ["trust CA with one OPENING_BALANCE entry"]
          setup_api_calls:
            - call: "POST /trust-accounts"
              payload: { name: "Trust SR", state_code: "CA", minimum_balance_cents: 0 }
              as: TrustAccountant
              captures: { trust_id: $.data.id, trust_v: $.data.version }
            - call: "POST /trust-accounts/${trust_id}/entries"
              payload: { entry_type: "OPENING_BALANCE", amount_cents: 1000000, expected_trustaccount_version: "${trust_v}" }
              as: TrustAccountant
          trigger:
            - call: "GET /trust-accounts/${trust_id}/entries"
              payload: {}
              as: TrustAccountant
          assert:
            - "response data array length == 1 with entry_type OPENING_BALANCE and amount_cents 1000000"

  # =================================================================
  # Errors
  # =================================================================
