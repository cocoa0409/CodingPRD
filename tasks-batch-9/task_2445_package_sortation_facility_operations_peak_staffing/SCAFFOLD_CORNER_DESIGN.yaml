              as: LaborPlanner
              as_user_id: "u_planner_1"
          assert:
            - "ShiftPlan.${p86_id}.required_headcount == 5, because 40000 / (1200 x 8) == 4.1667 and ceil is 5, above the floor of 4"
            - "ShiftPlan.${p85_id}.required_headcount == 5 - the threshold value itself takes the HIGH tier"
            - "ShiftPlan.${p84_id}.required_headcount == 6, because 40000 / (950 x 8) == 5.2632 and ceil is 6"
