- rule_id: compensating_invariant
  instances:
  - name: reverse_rail_fee_pool_conserved_across_resolution
    grounds:
    - calculations.reverse_rail_fee_transfer
    - calculations.return_recredit_allocation
    - entities.Ledger.fields.delivered_fee_transfers_cents
    - entities.Ledger.fields.undeliverable_cents
    - state_machines.ExceptionItem.transitions.ASSIGNED_to_RESOLVED
    distinguishing_aspect: 'The conserved quantity is a fee pool counted in whole cents: Ledger.delivered_fee_transfers_cents
      + Ledger.undeliverable_cents always equals 25 * the number of resolved RETURN legs, so resolving two legs
      must reach exactly 50 and the forward action of booking a re-credit that cancels the second leg must return
      the pair of fields to 25.'
    test_recipe:
