            - { call: "POST /vendor-office/requests", payload: { case_id: "${case_id}", vendor_id: "${v_id}", priority_class: "URGENT" }, as: ORScheduler, captures: { rq_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-1", declared_instrument_count: 8, replacement_value_cents: 100 }, as: ORScheduler, captures: { t1_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/trays", payload: { tray_code: "TK-2", declared_instrument_count: 8, replacement_value_cents: 100 }, as: ORScheduler, captures: { t2_id: $.data.id } }
            - { call: "POST /vendor-office/requests/${rq_id}/submit", as: ORScheduler }
            - { call: "POST /vendor-office/requests/${rq_id}/decide", payload: { decision: "APPROVE" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/requests/${rq_id}/check-ins", payload: { lines: [{ tray_id: "${t1_id}", instrument_count_delivered: 8 }, { tray_id: "${t2_id}", instrument_count_delivered: 8 }], ifu_provided: true, loaner_agreement_ref: "LA-1" }, as: VendorRep, as_user_id: "${rep_id}", captures: { ci_id: $.data.id } }
            - { call: "POST /vendor-office/check-ins/${ci_id}/verify", payload: { line_dispositions: [{ tray_id: "${t1_id}", disposition: "ACCEPT" }, { tray_id: "${t2_id}", disposition: "ACCEPT" }] }, as: VendorCoordinator, as_user_id: "coord-1" }
            - { call: "POST /vendor-office/trays/${t1_id}/turns", as: SterileProcessingTech, captures: { turn1_id: $.data.id } }
            - { call: "POST /vendor-office/trays/${t2_id}/turns", as: SterileProcessingTech, captures: { turn2_id: $.data.id } }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:35:00Z" }, as: VendorCoordinator }
            - { call: "POST /vendor-office/turns/${turn1_id}/start-cycle", payload: { sterilizer_unit_id: "${st_id}" }, as: SterileProcessingTech }
            - { call: "POST /vendor-office/turns/${turn2_id}/start-cycle", payload: { sterilizer_unit_id: "${st_id}" }, as: SterileProcessingTech }
            - { call: "POST /vendor-office/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:10:00Z" }, as: VendorCoordinator }
