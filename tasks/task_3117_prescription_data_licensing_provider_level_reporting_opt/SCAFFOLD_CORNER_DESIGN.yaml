          - endpoints.POST_/data-acquisition-agreements/{id}/activate
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "SupplierOperator calling the DataAcquisitionManager-exclusive activate endpoint is denied 403 ERR_UNAUTHORIZED_ROLE; the agreement stays DRAFT."
