              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /_scheduler/fulfill-subscriptions"
              payload: {}
              as: Manager
              captures: { processed: "$.data.processed_count", missed: "$.data.missed_count" }
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_status: "$.data.status" }
          assert:
            - "processed == 1"
            - "missed == 1"
            - "sub_status == MISSING_STOCK"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: delivery_deliver_requires_order_paid
        grounds:
          - state_machines.DeliveryAssignment.SCHEDULED_to_DELIVERED
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DeliveryAssignment → Order dependency: /deliveries/{id}/deliver
          requires Order.payment_status == PAID. If a Manager cancels the
          order's payment (via a full cancel flow that flips payment to
          REFUNDED and fulfillment to CANCELLED), the delivery can no longer
          be marked DELIVERED. Entity pair: DeliveryAssignment × Order.
        test_recipe:
          setup:
            - "Order paid, dispatched with a scheduled DeliveryAssignment; then Manager cancels the dispatched order (payment→REFUNDED, delivery→FAILED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "rita@example.com", full_name: "Rita", delivery_zone: "ZONE_A", address_line: "14 Birch" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /delivery-drivers"
              payload: { name: "Sam" }
              as: Manager
              captures: { driver_id: "$.data.id" }
            - call: "POST /plants"
