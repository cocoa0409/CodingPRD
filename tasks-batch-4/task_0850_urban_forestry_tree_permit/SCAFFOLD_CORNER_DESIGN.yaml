              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 5.0, canopy_radius_m: 3.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t5: $.data.id }
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t5}", permit_type: "REMOVAL", reason: "small tree" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_TREE_NOT_PROTECTED"

      - name: emergency_work_order_without_storm_rejects
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=14]
          - errors[ERR_EMERGENCY_NOT_DECLARED]
        distinguishing_aspect: "An EMERGENCY_REMOVAL work order with no ACTIVE StormEvent covering the tree's zone returns ERR_EMERGENCY_NOT_DECLARED (422)."
        test_recipe:
          setup: ["Zone Z1, Species Oak, Tree T20, ACTIVE contractor; NO storm declared."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/contractors"
              payload: { name: "Acme", license_number: "L-1", license_expiry: "2027-01-01T00:00:00Z", is_certified_arborist: true, status: "ACTIVE" }
              as: ForestryAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /forestry/work-orders"
              payload: { tree_id: "${t20}", contractor_id: "${c1}", work_type: "EMERGENCY_REMOVAL", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: ForestryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_EMERGENCY_NOT_DECLARED"

  # =========================================================================
  # From Table 6 (Errors) — already-covered stubs
  # =========================================================================
  - section: errors
    instances:
      - name: error_storm_overlap_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_STORM_OVERLAP]
        excluded_because:
          difficulty_instance: storm_event_zone_overlap_closed_interval_touch_conflicts
          rationale: "ERR_STORM_OVERLAP is asserted as the failure path of the named §1.8 instance."
      - name: error_contractor_double_booked_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CONTRACTOR_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: contractor_double_booking_half_open_adjacency_ok
          rationale: "ERR_CONTRACTOR_DOUBLE_BOOKED is asserted as the failure path of the named §1.8 instance."
      - name: error_inspection_required_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INSPECTION_REQUIRED]
        excluded_because:
          difficulty_instance: removal_approve_requires_finalized_inspection
          rationale: "ERR_INSPECTION_REQUIRED is asserted as the failure path of the named §1.8 instance."
      - name: error_dig_ticket_invalid_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_DIG_TICKET_INVALID]
        excluded_because:
          difficulty_instance: workorder_start_requires_valid_dig_ticket
          rationale: "ERR_DIG_TICKET_INVALID is asserted as the failure path of the named §1.8 instance."
      - name: error_permit_not_approved_stub
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PERMIT_NOT_APPROVED]
        excluded_because:
          difficulty_instance: issue_state_outranks_fiscal
          rationale: "ERR_PERMIT_NOT_APPROVED is asserted as the winning error of the named §1.8 priority instance."

  # =========================================================================
  # From Table 7 (RBAC)
  # =========================================================================
  - section: rbac
    instances:
      - name: zone_create_as_staff_unauthorized
        claim_type: exclusive_operation_denied
        grounds:
          - roles.ForestryStaff
          - roles.ForestryAdmin
        distinguishing_aspect: "ForestryStaff calling POST /forestry/zones (a ForestryAdmin exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: submit_permit_by_non_owner_forbidden
        claim_type: peer_roles_ownership
        grounds:
          - roles.Applicant
          - validations[priority=4]
          - errors[ERR_NOT_OWNER]
        distinguishing_aspect: "An Applicant whose X-User-ID != permit.requested_by_user_id calling submit returns ERR_NOT_OWNER (403)."
        test_recipe:
          setup: ["Zone Z1, Species Oak, protected Tree T20, a DRAFT permit created by applicant-1."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id }
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
          trigger:
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-2"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_OWNER"

      - name: tree_create_missing_auth_unauthenticated
        claim_type: exclusive_operation_denied
        grounds:
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A tree create with an unknown/missing role header returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Zone Z1 and Species Oak exist."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 12.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # From Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: inspection_create_stale_tree_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[inspection-create-stale-tree]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a first inspection create bumps tree.version, a second create carrying the pre-first expected_tree_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Zone Z1, Species Oak, Tree T20 observed at version 1 (captured before any inspection)."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v1: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v1}", inspection_type: "RISK", likelihood_score: 2, consequence_score: 2, target_rating: 2 }
              as: Inspector
              captures: { insp1: $.data.id }
          trigger:
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v1}", inspection_type: "ROUTINE", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: replacement_establish_adds_zone_canopy
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.ReplacementPlanting.PLANTED_to_ESTABLISHED
          - calculations.zone_canopy
        distinguishing_aspect: "Establishing a replacement planting (Oak, mature_canopy 50) adds 50 to the target zone's live_canopy_sqm (50 tree + 50 replacement = 100)."
        test_recipe:
          setup: ["An APPROVED REMOVAL permit on T20 (dbh=20 -> 2 required plantings), first planting planted."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 20.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t20: $.data.id, t20_v: $.data.version }
            - call: "POST /forestry/trees/${t20}/inspections"
              payload: { expected_tree_version: "${t20_v}", inspection_type: "RISK", likelihood_score: 1, consequence_score: 1, target_rating: 1 }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /forestry/inspections/${insp}/finalize"
              payload: {}
              as: Inspector
            - call: "POST /forestry/permits"
              payload: { tree_id: "${t20}", permit_type: "REMOVAL", reason: "decay" }
              as: Applicant
              as_user_id: "applicant-1"
              captures: { p: $.data.id }
            - call: "POST /forestry/permits/${p}/submit"
              payload: {}
              as: Applicant
              as_user_id: "applicant-1"
            - call: "POST /forestry/permits/${p}/review"
              payload: { decision: "APPROVE", mitigation_method: "REPLACEMENT_COST", review_notes: "ok" }
              as: Arborist
            - call: "GET /forestry/permits/${p}/replacement-plantings"
              payload: {}
              as: ForestryStaff
              captures: { rp0: "$.data[0].id" }
            - call: "POST /forestry/replacement-plantings/${rp0}/plant"
              payload: {}
              as: ForestryStaff
          trigger:
            - call: "POST /forestry/replacement-plantings/${rp0}/establish"
              payload: {}
              as: Inspector
          assert:
            - "Zone.${z1}.live_canopy_sqm == 100"
            - "ReplacementPlanting.${rp0}.status == ESTABLISHED"

  # =========================================================================
  # From Endpoints — listing / pagination
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_trees_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Tree.fields.zone_id
        distinguishing_aspect: "GET /forestry/trees?limit=1 over two trees returns one data row with total_count=2 and has_more=true."
        test_recipe:
          setup: ["Zone Z1, Species Oak, two trees created."]
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 1000 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 12.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { ta: $.data.id }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 14.0, canopy_radius_m: 6.0, latitude: 40.0, longitude: -83.0, condition_class: "FAIR" }
              as: ForestryStaff
              captures: { tb: $.data.id }
          trigger:
            - call: "GET /forestry/trees?zone_id=${z1}&limit=1&offset=0"
              payload: {}
              as: ForestryStaff
          assert:
