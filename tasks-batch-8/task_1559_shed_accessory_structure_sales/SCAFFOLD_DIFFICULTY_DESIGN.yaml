            - "Adjacent [12,14) succeeds (half-open: 12 not < 12): Order.${order_2_id}.status == SITE_REVIEW"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_cash_conservation
        grounds:
          - calculations.cancellation_refund
          - entities.Order.fields.refunded_cents
          - entities.Order.fields.retained_cents
        distinguishing_aspect: |
          Conserved quantity = CUSTOMER CASH on the order ledger: cancel pairs
          the forward payments with a compensating refund such that
          refund_cents + retained_cents == collected_cents exactly; quantity
          differs from rto_default_receivable_conservation (contract principal).
        test_recipe:
          setup:
            - "A CASH order (10x12, quoted 601490) in SCHEDULED with collected_cents == 200000"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { name: "Marion County, IN", state_code: "IN", county_name: "Marion", permit_threshold_sqft: 120, setback_front_ft: 10, setback_side_ft: 5, setback_rear_ft: 5, max_building_height_ft: 12, anchoring_required: true, permit_base_fee_cents: 15000, permit_per_sqft_cents: 50, tax_rate_bp: 700 }
              as: PermitCoordinator
