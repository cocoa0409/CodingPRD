  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_clearance_gated_on_shell_availability_both_directions
        grounds:
          - validations[priority=9]
          - errors[ERR_SHELL_NOT_AVAILABLE]
          - state_machines.Shell.AVAILABLE_to_ASSIGNED
          - state_machines.Shell.ASSIGNED_to_AVAILABLE
          - state_machines.WaterSession.PLANNED_to_CLEARED
        distinguishing_aspect: |
          Entity pair WaterSession -> Shell: the PLANNED -> CLEARED transition is legal only while
          the referenced Shell reads AVAILABLE, so the very same clearance call is rejected with
          ERR_SHELL_NOT_AVAILABLE while an earlier outing holds the hull in ASSIGNED and succeeds
          unchanged once that outing returns the hull.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one certified coach, one member acting as SafetyOfficer, one athlete with a current swim test, one 1X hull, one OPEN-posture reading"
            - "session A on that hull 06:00-07:00, already CLEARED, so Shell.status == ASSIGNED"
            - "session B on the same hull 08:00-09:00 (outside A's window plus the 30 minute turnaround buffer), still PLANNED"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
