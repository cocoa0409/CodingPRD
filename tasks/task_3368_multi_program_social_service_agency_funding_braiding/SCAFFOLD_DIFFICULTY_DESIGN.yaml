scaffold_difficulty_design:
  # Chain convention used by every instance below (derived from §1.2 alone):
  # the first POST /api/eligibility-screens/{id}/determine fires the PENDING->PENDING
  # verification hop (preconditions: verification_state == UNVERIFIED, verified_income_cents > 0;
  # the parent state is NOT among its preconditions), the parent is then ROUTED, and the
  # second determine call fires the determination hop.
  - rule_id: dual_variant_calc
    instances:
      - name: braided_allocation_rank_order_vs_period_order_admin_divergence
        grounds:
          - calculations.braided_cost_allocation
          - entities.Grant.fields.allocation_rank
          - entities.Grant.fields.period_start
          - entities.CostAllocation.fields.allocation_basis
          - entities.CostAllocation.fields.admin_amount_cents
        distinguishing_aspect: |
          Two deliveries with identical size, identical candidate grants and identical
          capacities are braided under the two sanctioned orders: the DIRECT_ONLY-governed
          delivery draws by allocation_rank (A 40000 + B 14000, admin_total 6800) while the
          TIME_AND_EFFORT-governed delivery draws by period_start (B 20000 + A 34000,
          admin_total 7400), so the two valid orders on the Grant domain yield different
          admin totals for identical inputs.
        test_recipe:
          setup:
            - "empty DB; logical clock 2026-10-02T00:00:00Z"
            - "Funder FED (FEDERAL, allow_faith_based_activity false, max_admin_rate_pct 0.25) and Program HOUSING_PGM (HOUSING, capacity_slots 10, nondiscrimination_attested true, match_eligible true)"
            - "Grants A1 and B1 carry cost_allocation_basis DIRECT_ONLY; A2 and B2 carry TIME_AND_EFFORT. A1/A2: allocation_rank 1, period_start 2026-10-01T00:00:00Z, total_award_cents 40000, admin_rate_pct 0.10. B1/B2: allocation_rank 2, period_start 2026-09-15T00:00:00Z, total_award_cents 20000, admin_rate_pct 0.20. All four: period_end 2027-09-30T00:00:00Z, max_in_kind_rate_cents 3000, matching_requirement_pct 0.25"
            - "Client One and Client Two are STANDARD, CITIZEN, household_size 2; each has a CLOSED assessment, an ELIGIBLE+VERIFIED screen, an ACTIVE enrollment and an ACTIVE HOUSING_RENT_ASSIST authorization (20 units at 4500) whose authorization.grant_id is B1 (Client One) and B2 (Client Two)"
            - "DEL_1 (Client One, grant_id A1) and DEL_2 (Client Two, grant_id B2) are DRAFT deliveries of 12 units at 4500 = 54000 cents each"
          setup_api_calls:
            - call: "POST /api/funders"
              payload: { name: "FED", funder_type: "FEDERAL", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.25, fiscal_year_start_month: 10 }
              as: ComplianceOfficer
              captures: { fnd: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "HOUSING_PGM", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 10, match_eligible: true }
              as: ComplianceOfficer
              captures: { prg: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G-A1", total_award_cents: 40000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-10-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g_a1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G-B1", total_award_cents: 20000, admin_rate_pct: 0.20, allocation_rank: 2, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-15T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g_b1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G-A2", total_award_cents: 40000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "TIME_AND_EFFORT", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-10-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g_a2: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G-B2", total_award_cents: 20000, admin_rate_pct: 0.20, allocation_rank: 2, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "TIME_AND_EFFORT", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-15T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g_b2: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { full_name: "Client One", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK", confidentiality_tier: "STANDARD" }
              as: IntakeSpecialist
              captures: { cli_1: "$.data.id" }
            - call: "POST /api/clients/${cli_1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { asm_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/eligibility-screens"
              payload: { program_id: "${prg}", grant_id: "${g_a1}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { scr_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${asm_1}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments"
              payload: { client_id: "${cli_1}" }
              as: ProgramManager
              captures: { enr_1: "$.data[0].id" }
            - call: "POST /api/enrollments/${enr_1}/activate"
              payload: {}
              as: ProgramManager
              captures: { enr_1_v: "$.data.version" }
            - call: "POST /api/service-authorizations"
              payload: { enrollment_id: "${enr_1}", grant_id: "${g_b1}", service_code: "HOUSING_RENT_ASSIST", authorized_units: 40, unit_rate_cents: 4500, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z", expected_enrollment_version: "${enr_1_v}" }
              as: ProgramManager
              captures: { aut_1: "$.data.id", aut_1_v: "$.data.version" }
            - call: "POST /api/service-deliveries"
              payload: { service_authorization_id: "${aut_1}", grant_id: "${g_a1}", client_id: "${cli_1}", service_date: "2026-10-02T00:00:00Z", units_delivered: 12, unit_rate_cents: 4500, expected_service_authorization_version: "${aut_1_v}" }
              as: ProgramManager
              captures: { del_1: "$.data.id" }
            - call: "POST /api/clients"
              payload: { full_name: "Client Two", date_of_birth: "1991-02-02", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK", confidentiality_tier: "STANDARD" }
              as: IntakeSpecialist
              captures: { cli_2: "$.data.id" }
            - call: "POST /api/clients/${cli_2}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { asm_2: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_2}/eligibility-screens"
              payload: { program_id: "${prg}", grant_id: "${g_a2}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { scr_2: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_2}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_2}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${asm_2}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_2}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments"
              payload: { client_id: "${cli_2}" }
              as: ProgramManager
              captures: { enr_2: "$.data[0].id" }
            - call: "POST /api/enrollments/${enr_2}/activate"
              payload: {}
              as: ProgramManager
              captures: { enr_2_v: "$.data.version" }
            - call: "POST /api/service-authorizations"
              payload: { enrollment_id: "${enr_2}", grant_id: "${g_b2}", service_code: "HOUSING_RENT_ASSIST", authorized_units: 40, unit_rate_cents: 4500, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z", expected_enrollment_version: "${enr_2_v}" }
              as: ProgramManager
              captures: { aut_2: "$.data.id", aut_2_v: "$.data.version" }
            - call: "POST /api/service-deliveries"
              payload: { service_authorization_id: "${aut_2}", grant_id: "${g_b2}", client_id: "${cli_2}", service_date: "2026-10-03T00:00:00Z", units_delivered: 12, unit_rate_cents: 4500, expected_service_authorization_version: "${aut_2_v}" }
              as: ProgramManager
              captures: { del_2: "$.data.id" }
          trigger:
            - call: "POST /api/service-deliveries/${del_1}/document"
              payload: {}
              as: ProgramManager
            - call: "POST /api/service-deliveries/${del_2}/document"
              payload: {}
              as: ProgramManager
          assert:
            - "ServiceDelivery.${del_1}.allocated_total_cents == 54000 and ServiceDelivery.${del_1}.admin_total_cents == 6800"
            - "the CostAllocation line of delivery ${del_1} against grant ${g_a1} has allocated_amount_cents 40000, admin_amount_cents 4000, allocation_rank 1, allocation_basis RANKED_PRIORITY"
            - "the CostAllocation line of delivery ${del_1} against grant ${g_b1} has allocated_amount_cents 14000, admin_amount_cents 2800, allocation_rank 2, allocation_basis RANKED_PRIORITY"
            - "ServiceDelivery.${del_2}.allocated_total_cents == 54000 and ServiceDelivery.${del_2}.admin_total_cents == 7400"
            - "the CostAllocation line of delivery ${del_2} against grant ${g_b2} has allocated_amount_cents 20000, admin_amount_cents 4000, allocation_rank 1, allocation_basis CHRONOLOGICAL_PERIOD"
            - "the CostAllocation line of delivery ${del_2} against grant ${g_a2} has allocated_amount_cents 34000, admin_amount_cents 3400, allocation_rank 2, allocation_basis CHRONOLOGICAL_PERIOD"
            - "the two documents consume the same 54000 cents yet report admin totals 6800 and 7400 respectively"
      - name: confidentiality_tier_first_write_refusal_vs_consent_first_read_projection
        grounds:
          - calculations.confidentiality_scope_resolution
          - entities.Client.fields.confidentiality_tier
          - entities.Client.fields.consent_scope
          - entities.Client.fields.shareable_domains
          - validations[priority=6]
        distinguishing_aspect: |
          On one SEALED client whose consent_scope covers HOUSING and whose consent has not
          expired, the Client domain's two variants disagree on the same inputs: the tier_first
          write path refuses the enrollment with ERR_CONFIDENTIALITY_SCOPE_DENIED while the
          consent_first read projection reports shareable_domains == ["HOUSING"].
        test_recipe:
          setup:
            - "empty DB; logical clock 2026-10-02T00:00:00Z"
            - "Funder FED (FEDERAL, allow_faith_based_activity false, max_admin_rate_pct 0.25), Program HOUSING_PGM (HOUSING, capacity_slots 5, nondiscrimination_attested true), Grant G1 (rank 1, DIRECT_ONLY, total_award_cents 100000, admin_rate_pct 0.10, period 2026-01-01T00:00:00Z to 2027-09-30T00:00:00Z)"
            - "Client Sealed is confidentiality_tier SEALED with consent_scope [HOUSING] and consent_expires_on 2026-12-31T00:00:00Z; no screen, enrollment or delivery exists for it, because the tier_first safety gate refuses every screening write for a SEALED client"
          setup_api_calls:
            - call: "POST /api/funders"
              payload: { name: "FED", funder_type: "FEDERAL", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.25, fiscal_year_start_month: 10 }
              as: ComplianceOfficer
              captures: { fnd: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "HOUSING_PGM", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 5, match_eligible: true }
              as: ComplianceOfficer
              captures: { prg: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G1", total_award_cents: 100000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-01-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { full_name: "Sealed Client", date_of_birth: "1985-05-05", household_size: 3, immigration_status: "LPR", county_code: "COOK", confidentiality_tier: "SEALED", consent_scope: ["HOUSING"], consent_expires_on: "2026-12-31T00:00:00Z" }
              as: IntakeSpecialist
              captures: { cli_s: "$.data.id" }
          trigger:
            - call: "POST /api/enrollments"
              payload: { client_id: "${cli_s}", program_id: "${prg}", grant_id: "${g1}" }
              as: ProgramManager
            - call: "GET /api/clients/${cli_s}"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "POST /api/enrollments returns http 403 with error_id ERR_CONFIDENTIALITY_SCOPE_DENIED"
            - "the same call would otherwise fail only the priority-7 ERR_ELIGIBILITY_NOT_ESTABLISHED check, so the priority-6 safety refusal is the one that fires"
            - "GET /api/clients/${cli_s} returns shareable_domains == [\"HOUSING\"] under the consent_first projection"
            - "no EligibilityScreen row and no Enrollment row exists for client ${cli_s} after the refused write"
  - rule_id: combinatorial_formula
    instances:
      - name: admin_share_line_level_rounding_beats_sum_then_round
        grounds:
          - calculations.delivery_unit_cost
          - calculations.braided_cost_allocation
          - entities.CostAllocation.fields.admin_amount_cents
          - entities.ServiceDelivery.fields.admin_total_cents
        distinguishing_aspect: |
          Nested rounding where the order matters: two allocation lines of exactly 1005 cents
          at admin_rate_pct 0.10 produce unrounded admin products of 100.5 each, so the pinned
          order (round per line, then sum) yields admin_total_cents 202 while the rejected order
          (sum then round once) would yield 201 on the identical delivery.
        test_recipe:
          setup:
            - "empty DB; logical clock 2026-10-02T00:00:00Z"
            - "Funder FED (FEDERAL, allow_faith_based_activity false, max_admin_rate_pct 0.25), Program HOUSING_PGM (HOUSING, capacity_slots 5, nondiscrimination_attested true), Grant A (rank 1, DIRECT_ONLY, total_award_cents 1005, admin_rate_pct 0.10, period_start 2026-10-01T00:00:00Z) and Grant B (rank 2, DIRECT_ONLY, total_award_cents 1005, admin_rate_pct 0.10, period_start 2026-09-15T00:00:00Z)"
            - "Client One is STANDARD/CITIZEN with an ACTIVE enrollment on Grant A and an ACTIVE HOUSING_RENT_ASSIST authorization on Grant B; DEL_1 is a DRAFT delivery of 3 units at 670 cents = 2010 cents, grant_id Grant A"
          setup_api_calls:
            - call: "POST /api/funders"
              payload: { name: "FED", funder_type: "FEDERAL", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.25, fiscal_year_start_month: 10 }
              as: ComplianceOfficer
              captures: { fnd: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "HOUSING_PGM", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 5, match_eligible: true }
              as: ComplianceOfficer
              captures: { prg: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G-A", total_award_cents: 1005, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-10-01T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g_a: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${fnd}", program_id: "${prg}", grant_code: "G-B", total_award_cents: 1005, admin_rate_pct: 0.10, allocation_rank: 2, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-15T00:00:00Z", period_end: "2027-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { g_b: "$.data.id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { full_name: "Client One", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK", confidentiality_tier: "STANDARD" }
              as: IntakeSpecialist
              captures: { cli_1: "$.data.id" }
            - call: "POST /api/clients/${cli_1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { asm_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/eligibility-screens"
              payload: { program_id: "${prg}", grant_id: "${g_a}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { scr_1: "$.data.id" }
            - call: "POST /api/intake-assessments/${asm_1}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${asm_1}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${scr_1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments"
              payload: { client_id: "${cli_1}" }
              as: ProgramManager
              captures: { enr_1: "$.data[0].id" }
            - call: "POST /api/enrollments/${enr_1}/activate"
              payload: {}
              as: ProgramManager
              captures: { enr_1_v: "$.data.version" }
            - call: "POST /api/service-authorizations"
              payload: { enrollment_id: "${enr_1}", grant_id: "${g_b}", service_code: "HOUSING_RENT_ASSIST", authorized_units: 3, unit_rate_cents: 670, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z", expected_enrollment_version: "${enr_1_v}" }
              as: ProgramManager
              captures: { aut_1: "$.data.id", aut_1_v: "$.data.version" }
            - call: "POST /api/service-deliveries"
              payload: { service_authorization_id: "${aut_1}", grant_id: "${g_a}", client_id: "${cli_1}", service_date: "2026-10-02T00:00:00Z", units_delivered: 3, unit_rate_cents: 670, expected_service_authorization_version: "${aut_1_v}" }
              as: ProgramManager
              captures: { del_1: "$.data.id" }
          trigger:
            - call: "POST /api/service-deliveries/${del_1}/document"
              payload: {}
              as: ProgramManager
          assert:
            - "ServiceDelivery.${del_1}.allocated_total_cents == 2010"
            - "ServiceDelivery.${del_1}.admin_total_cents == 202"
            - "each of the two CostAllocation lines of delivery ${del_1} has allocated_amount_cents 1005 and admin_amount_cents 101"
            - "the sum-then-round order would have produced 201, so 202 proves the per-line rounding order was applied"
      - name: in_kind_credit_ceiling_remaining_requirement_and_valuation_branch
        grounds:
          - calculations.in_kind_match_credit
          - entities.Grant.fields.max_in_kind_rate_cents
          - entities.Grant.fields.matching_requirement_pct
          - entities.InKindDonation.fields.match_credit_cents
          - entities.InKindDonation.fields.uncapped_value_cents
          - validations[priority=8]
        distinguishing_aspect: |
          Three inputs interact non-linearly on one grant: the per-hour ceiling min(rate_cents,
          max_in_kind_rate_cents), the valuation_method eligibility branch, and the
          remaining-requirement cap max(requirement - already_credited, 0) — so the same 3390-cent
          IRS-rate donation yields value_cents 36000, uncapped_value_cents 40680 and
          match_credit_cents 36000, and the third donation is credited 0 because the 50000-cent
          requirement is already met.
        test_recipe:
          setup:
            - "empty DB; logical clock 2026-10-02T00:00:00Z"
            - "Funder FED (FEDERAL, allow_faith_based_activity false, max_admin_rate_pct 0.25), Program HOUSING_PGM (HOUSING, match_eligible true, nondiscrimination_attested true), Grant G1 (rank 1, DIRECT_ONLY, total_award_cents 200000, admin_rate_pct 0.10, max_in_kind_rate_cents 3000, matching_requirement_pct 0.25, period 2026-01-01T00:00:00Z to 2027-09-30T00:00:00Z)"
            - "DON_1 already accepted: donor_reference PARISH-01, hours 12, rate_cents 3390, IRS_STANDARD_RATE, donation_date 2026-10-02T00:00:00Z, created at clock 2026-10-02T00:00:00Z"
            - "DON_2 already accepted: donor_reference VOL-01, hours 6, rate_cents 3000, APPRAISAL, donation_date 2026-10-03T00:00:00Z, created at clock 2026-10-03T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/funders"
              payload: { name: "FED", funder_type: "FEDERAL", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.25, fiscal_year_start_month: 10 }
              as: ComplianceOfficer
              captures: { fnd: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "HOUSING_PGM", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 5, match_eligible: true }
