            - "spec_status == WITHIN_SPEC and residual_flavor_pct == 0.0 (uniform flavor 100.0)"

  - rule_id: non_linear_state_machine
    instances:
      - name: raw_lot_quarantine_retest_cycle
        grounds:
          - state_machines.RawLot.IN_TEST_to_QUARANTINED
          - state_machines.RawLot.QUARANTINED_to_IN_TEST
          - state_machines.RawLot.QUARANTINED_to_ACCEPTED
        distinguishing_aspect: |
          RawLot's machine is cyclic: IN_TEST -> QUARANTINED -> (retest post)
          IN_TEST -> ACCEPTED. The lot re-enters IN_TEST from QUARANTINED rather
          than terminating, and the ACCEPT gate re-evaluates the full PASS suite
          accumulated across both visits to IN_TEST.
        test_recipe:
          setup:
            - "supplier S; one RECEIVED OREGANO lot (50 kg, flavor 60.0, moisture 9.0, cost 150, allergen MUSTARD, crop 2025)"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Aegean Herbs", origin_country: "GR" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: OREGANO, origin_region: "Lesvos", crop_year: 2025, quantity_kg: 50, flavor_intensity_units: 60.0, moisture_pct: 9.0, cost_per_kg_cents: 150, allergen_profile: MUSTARD, organic_certified: false }, as: SupplyPlanner, captures: { lot: $.data.id, s0: $.data.status } }
          trigger:
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 40000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { t1: $.data.result } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { s1: $.data.status } }
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: QUARANTINE, reason: "odor anomaly" }, as: QualityManager, as_user_id: "qm-1", captures: { s2: $.data.status } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MOISTURE, measured_value: 9.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { t2: $.data.result } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: QualityManager, captures: { s3: $.data.status } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 0.5, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1", captures: { t3: $.data.result } }
            - { call: "POST /spice/lots/${lot}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1", captures: { s4: $.data.status } }
          assert:
            - "${s0} == RECEIVED (initial state)"
            - "${t1} == PASS and ${s1} == IN_TEST (first test auto-advances RECEIVED -> IN_TEST)"
            - "${s2} == QUARANTINED (manual disposition)"
            - "${t2} == PASS and ${s3} == IN_TEST (retest auto-transition QUARANTINED -> IN_TEST: the cycle closes)"
            - "${t3} == PASS and ${s4} == ACCEPTED (suite MICRO+ADULTERANT_SCREEN+MOISTURE all PASS, zero FAIL, across two visits to IN_TEST)"

      - name: finished_batch_parallel_dimensions
        grounds:
          - state_machines.FinishedBatch
          - entities.FinishedBatch.fields.commercial_status
          - entities.FinishedBatch.fields.quality_status
        distinguishing_aspect: |
          FinishedBatch carries two independent state dimensions. A manual
          quality hold and a recall-close cycle quality_status CLEAR ->
          QUALITY_HOLD -> RECALLED while commercial_status stays CREATED the
          entire time; the ship gate reads the quality dimension only.
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED BLACK_PEPPER lots LA/LB/LC (costs 100/200/300, crop 2025, 100 kg each, flavor 100.0, moisture 8.0, allergen NONE)"
            - "ACTIVE BRANDED formula STEAK-7 (BLACK_PEPPER 100%, min flavor 50); COMMITTED COST_MIN blend run of 100 kg; COMPLETED production run -> batch B (genealogy [LA, LB, LC])"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { la: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 200, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lb: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 300, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { lc: $.data.id } }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${la}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lb}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: MICRO, measured_value: 50000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: ADULTERANT_SCREEN, measured_value: 1.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/tests", payload: { test_type: MOISTURE, measured_value: 8.0, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "POST /spice/lots/${lc}/disposition", payload: { action: ACCEPT }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /spice/formulas", payload: { product_code: "STEAK-7", name: "Steak Pepper", brand_type: BRANDED, target_flavor_units: 100.0, flavor_tolerance_pct: 2.0, max_moisture_pct: 10.0 }, as: FlavorScientist, captures: { f: $.data.id } }
            - { call: "POST /spice/formulas/${f}/lines", payload: { spice_code: BLACK_PEPPER, target_proportion_pct: 100.0, allergen_profile: NONE, organic_required: false, min_lot_flavor_units: 50.0 }, as: FlavorScientist }
            - { call: "POST /spice/formulas/${f}/activate", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/blend-runs", payload: { formula_id: "${f}", selection_policy: COST_MIN, target_batch_kg: 100 }, as: FlavorScientist, captures: { br: $.data.id } }
            - { call: "POST /spice/blend-runs/${br}/commit", payload: {}, as: FlavorScientist }
            - { call: "POST /spice/lines", payload: { name: "Line-P", capacity_kg_per_shift: 1000, supported_changeover_classes: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION] }, as: PlatformAdmin, captures: { ln: $.data.id } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v: $.data.version } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br}", quantity_kg: 100, window_start: "2026-09-08T08:00:00Z", window_end: "2026-09-08T12:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionScheduler, captures: { r: $.data.id } }
            - { call: "POST /spice/production-runs/${r}/complete", payload: {}, as: ProductionScheduler }
            - { call: "GET /spice/batches?production_run_id=${r}", payload: {}, as: QualityManager, captures: { b1: "$.data[0].id" } }
          trigger:
            - { call: "GET /spice/batches/${b1}", payload: {}, as: QualityManager, captures: { cs1: $.data.commercial_status, qs1: $.data.quality_status } }
            - { call: "POST /spice/batches/${b1}/hold", payload: { note: "retail complaint" }, as: QualityManager, as_user_id: "qm-1", captures: { qs2: $.data.quality_status, cs2: $.data.commercial_status } }
            - { call: "POST /spice/batches/${b1}/ship", payload: {}, as: SupplyPlanner, as_user_id: "sp-1", captures: { ship_err: $.data.error_id } }
            - { call: "POST /spice/recall-cases", payload: { trigger_type: LOT_SUSPECT, suspect_lot_id: "${la}", scope_policy: FINAL }, as: RecallCoordinator, captures: { rc: $.data.id } }
            - { call: "POST /spice/recall-cases/${rc}/initiate", payload: {}, as: RecallCoordinator }
            - { call: "POST /spice/recall-cases/${rc}/close", payload: {}, as: RecallCoordinator }
            - { call: "GET /spice/batches/${b1}", payload: {}, as: QualityManager, captures: { cs3: $.data.commercial_status, qs3: $.data.quality_status } }
          assert:
            - "at creation: ${cs1} == CREATED and ${qs1} == CLEAR (both dimensions at their initials)"
            - "after manual hold: ${qs2} == QUALITY_HOLD while ${cs2} == CREATED (quality dimension moved; commercial did not)"
            - "ship attempt rejected: ${ship_err} == ERR_BATCH_NOT_SHIPPABLE (quality gate) and commercial_status stays CREATED"
            - "after recall close: ${qs3} == RECALLED (BRANDED batch) while ${cs3} == CREATED — the quality dimension reached a terminal state with the commercial dimension untouched"

  - rule_id: transitive_cascade
    instances:
      - name: adulterant_fail_cascade_depth3
        grounds:
          - state_machines.RawLot.lot_quarantine_auto_from_accepted
          - state_machines.FinishedBatch.batch_hold_cascade
          - state_machines.RecallCase.DRAFT_to_CLOSED
          - "endpoints: POST /spice/lots/{id}/tests side_effects"
        distinguishing_aspect: |
          Depth-3 cascade from a single test post: ADULTERANT_SCREEN FAIL on an
          ACCEPTED lot (hop 1: lot -> QUARANTINED) -> every CLEAR FinishedBatch
          carrying the lot in genealogy -> QUALITY_HOLD (hop 2) -> system
          auto-creates a DRAFT AUTO_QUARANTINE RecallCase (hop 3). Each hop is
          caused by the previous link's mutation, not by the original request.
        test_recipe:
          setup:
            - "supplier S; three ACCEPTED BLACK_PEPPER lots LA(100)/LB(200)/LC(300) cost cents, crop 2025, 100 kg each, flavor 100.0, moisture 8.0"
            - "ACTIVE BRANDED formula TACO-9 (BLACK_PEPPER 100% min 50); COMMITTED blend 100 kg consuming LA 40.000, LB 40.000, LC 20.000; COMPLETED run -> batch B (CLEAR, genealogy [LA, LB, LC])"
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: BLACK_PEPPER, origin_region: "Malabar", crop_year: 2025, quantity_kg: 100, flavor_intensity_units: 100.0, moisture_pct: 8.0, cost_per_kg_cents: 100, allergen_profile: NONE, organic_certified: false }, as: SupplyPlanner, captures: { la: $.data.id } }
