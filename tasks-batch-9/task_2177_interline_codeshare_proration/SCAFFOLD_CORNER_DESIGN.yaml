  - section: errors
    instances:

      - name: unknown_path_ids_return_their_own_not_found_errors
        claim_type: Error triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_AGREEMENT_NOT_FOUND]
          - errors[ERR_PERIOD_NOT_FOUND]
          - errors[ERR_INVOICE_NOT_FOUND]
          - errors[ERR_COUPON_NOT_FOUND]
        distinguishing_aspect: "Each collection reports its own domain-specific 404: agreement, period, invoice and coupon paths built from well-formed but unknown UUIDs return ERR_AGREEMENT_NOT_FOUND, ERR_PERIOD_NOT_FOUND, ERR_INVOICE_NOT_FOUND and ERR_COUPON_NOT_FOUND respectively."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            []
          trigger:
            - call: "GET /interline/prorate-agreements/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClearinghouseOperator
              captures: { e_ag: $.data.error_id }
            - call: "GET /interline/settlement-periods/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: ClearinghouseOperator
              captures: { e_p: $.data.error_id }
            - call: "GET /interline/billing-invoices/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: ClearinghouseOperator
              captures: { e_inv: $.data.error_id }
            - call: "GET /interline/coupons/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: ClearinghouseOperator
              captures: { e_c: $.data.error_id }
          assert:
            - "All four calls return HTTP 404 with response_type == error"
            - "${e_ag} == ERR_AGREEMENT_NOT_FOUND"
            - "${e_p} == ERR_PERIOD_NOT_FOUND"
            - "${e_inv} == ERR_INVOICE_NOT_FOUND"
            - "${e_c} == ERR_COUPON_NOT_FOUND"

      - name: unknown_memo_and_sample_paths_return_not_found
        claim_type: Error triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_MEMO_NOT_FOUND]
          - errors[ERR_SAMPLE_NOT_FOUND]
          - errors[ERR_CARRIER_NOT_FOUND]
        distinguishing_aspect: "The memo, sample and carrier collections each report their own 404 code, and the carrier code also fires for an unresolvable validating_carrier_id supplied in a request body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            []
          trigger:
            - call: "GET /interline/rejection-memos/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: ClearinghouseOperator
              captures: { e_m: $.data.error_id }
            - call: "GET /interline/audit-samples/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: ClearinghouseOperator
              captures: { e_s: $.data.error_id }
            - call: "POST /interline/tickets"
              payload: { ticket_number: "0060000000001", validating_carrier_id: "77777777-7777-4777-8777-777777777777", sale_currency: "USD", total_fare_minor: 100000, issue_date: "2026-08-01T00:00:00Z" }
              as: RevenueAccountant
              as_user_id: "77777777-7777-4777-8777-777777777777"
              captures: { e_car: $.data.error_id }
          assert:
            - "${e_m} == ERR_MEMO_NOT_FOUND with HTTP 404"
            - "${e_s} == ERR_SAMPLE_NOT_FOUND with HTTP 404"
            - "${e_car} == ERR_CARRIER_NOT_FOUND with HTTP 404 — the body-reference check at priority 5 fires before the ownership check at priority 6"

      - name: suspending_an_already_suspended_carrier_returns_carrier_state_invalid
        claim_type: Error triggerable
        grounds:
          - validations[priority=16.5]
          - errors[ERR_CARRIER_STATE_INVALID]
          - state_machines.Carrier.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "The carrier lifecycle is a two-state cycle with guarded edges: suspend from SUSPENDED returns ERR_CARRIER_STATE_INVALID (409) and does not re-run the agreement cascade."
        test_recipe:
          setup:
            - "Carrier AA suspended by the clearinghouse."
          setup_api_calls:
            - call: "POST /interline/carriers"
              payload: { iata_code: "AA", name: "Aurora Air", base_currency: "USD", credit_limit_minor: 100000000 }
              as: ClearinghouseOperator
              captures: { aa: $.data.id }
            - call: "POST /interline/carriers/${aa}/suspend"
              payload: {}
              as: ClearinghouseOperator
          trigger:
            - call: "POST /interline/carriers/${aa}/suspend"
              payload: {}
              as: ClearinghouseOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status 409 with data.error_id == ERR_CARRIER_STATE_INVALID"
            - "Carrier.${aa}.status == SUSPENDED"

