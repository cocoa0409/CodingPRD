      - name: election_revocation_clears_pricing_and_the_second_revocation_is_refused
        claim_type: cyclic
        grounds:
          - state_machines.ParticipantElection.ELECTED_LUMP_SUM_to_NOTICE_SENT
          - constants.REVOCATION_MAX
          - errors.ERR_ELECTION_STATE_INVALID
        distinguishing_aspect: |
          The revocation loop NOTICE_SENT -> ELECTED_* -> NOTICE_SENT must both undo
          and remember: the priced fields go back to null while revocation_count
          climbs to 1, the participant may re-elect the OTHER option, and the second
          revocation is refused on the count rather than on the window's state. An
          implementation that resets revocation_count on re-election would wrongly
          allow the second revocation.
