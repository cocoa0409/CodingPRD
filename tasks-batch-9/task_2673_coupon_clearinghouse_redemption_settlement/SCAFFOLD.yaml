scenario: |
  Generate task harder than expert level!

  2673. Coupon Clearinghouse & Redemption Settlement (coupon clearinghouse): coupon design registration with offer terms, expiration and redemption instructions encoded in the barcode, retailer submission intake through mail and electronic channels with count verification, sorting by manufacturer and offer with image capture and validation against offer terms, misredemption detection through purchase data matching, duplicate barcode analysis and fraud pattern scoring, retailer handling fee calculation and payment scheduling, manufacturer invoicing, funding and dispute resolution over rejected submissions, expired and counterfeit coupon rejection with retailer notification, digital coupon clearing with clip and redemption event matching

domain_name: coupon-clearinghouse-redemption-settlement
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection
  # (/offers, /submissions, /submission-lots, /coupon-items, ...). Parentage is
  # expressed exclusively through FK body/query fields, never through nested URL
  # paths. The only nested paths are creation-under-context shortcuts
  # (POST /submissions/{id}/lots, POST /submission-lots/{id}/items) whose
  # responses are still addressed flatly afterwards.

  state_machine_shape: parallel
  # Submission carries two independent state dimensions (intake_status x
  # settlement_status). SubmissionLot is cyclic (LOT_REJECTED -> DISPUTED ->
  # LOT_REJECTED). Dispute is cyclic (UNDER_REVIEW -> INFO_REQUESTED ->
  # UNDER_REVIEW, capped at MAX_INFO_ROUNDS). ManufacturerInvoice and CouponItem
  # are branching (one trigger, divergent target states and side-effect sets).

  relationship_patterns:
    - one_to_many        # Manufacturer -> Offer, Submission -> SubmissionLot, SubmissionLot -> CouponItem
    - self_referential   # CouponItem.duplicate_of_item_id -> CouponItem.id
    - polymorphic: false
    - cross_aggregate    # SettlementStatement spans Submission + Retailer + ManufacturerInvoice; DigitalRedemptionEvent <-> DigitalClip
    - many_to_many: "ManufacturerInvoice.statement_ids fans across SettlementStatement rows owned by different Submissions"

  role_model: segregation_of_duties
  # Two enforced SoD walls: (1) the FraudAnalyst who adjudicated a lot cannot
  # resolve the Dispute filed against it; (2) the SettlementOfficer who issued a
  # statement cannot release its payment.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Manufacturer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the coupon issuer"
        constraints: "1..200 chars, non-blank"
      - name: gs1_company_prefix
        type: string
        source: input
        description: "GS1 company prefix embedded in every offer barcode this manufacturer issues"
        constraints: "exactly 6 characters, all digits 0-9"
      - name: handling_fee_policy
        type: enum
        source: input
        description: "Selects which per-coupon handling fee basis lot_handling_fee uses"
        default: CONTRACT_RATE
        constraints: "one of {CONTRACT_RATE, TIERED_RATE}"
      - name: dispute_window_days
        type: integer
        source: input
        description: "Days after a lot enters LOT_REJECTED during which the retailer may still file a Dispute"
        default: 45
        constraints: ">= 1 and <= 180"
      - name: funded_total_cents
        type: integer
        source: computed
        description: "Sum of funded_amount_cents over this manufacturer's invoices with status IN {FUNDED, SHORT_FUNDED, RECONCILED}"
        default: 0
        constraints: ">= 0"
      - name: disbursed_total_cents
        type: integer
        source: computed
        description: "Sum of net_payable_cents over this manufacturer's linked SettlementStatements with status == PAID"
        default: 0
        constraints: ">= 0"
      - name: funding_balance_cents
        type: integer
        source: computed
        description: "funded_total_cents - disbursed_total_cents; the conserved quantity of compensating_invariant / manufacturer_funding_balance_identity"
        default: 0
        constraints: ">= 0 by construction: a statement's net_payable_cents can never exceed its invoice's billed_total_cents, so disbursed_total_cents never overtakes funded_total_cents"
      - name: status
        type: enum
        source: system
        description: "Lifecycle gate; SUSPENDED blocks offer registration and invoice funding"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Retailer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the submitting retailer"
        constraints: "1..200 chars, non-blank"
      - name: channel_capability
        type: enum
        source: input
        description: "Which submission channels this retailer is contracted for"
        default: BOTH
        constraints: "one of {MAIL_ONLY, ELECTRONIC_ONLY, BOTH}"
      - name: payment_terms
        type: enum
        source: input
        description: "Net terms used by payment_schedule_date"
        default: NET_30
        constraints: "one of {NET_15, NET_30, NET_45}"
      - name: base_fee_tier
        type: enum
        source: input
        description: "Contractual handling-fee tier restored whenever fraud_score falls back below FRAUD_WATCHLIST_THRESHOLD"
        default: STANDARD
        constraints: "one of {PREFERRED, STANDARD}"
      - name: handling_fee_tier
        type: enum
        source: system
        description: "Effective tier feeding TIER_MULTIPLIER in lot_handling_fee; forced to PROBATION while fraud_score >= FRAUD_WATCHLIST_THRESHOLD"
        default: STANDARD
        constraints: "one of {PREFERRED, STANDARD, PROBATION}"
      - name: fraud_scoring_mode
        type: enum
        source: input
        description: "Selects which retailer_fraud_score variant is copied into fraud_score"
        default: ROLLING_WINDOW
        constraints: "one of {ROLLING_WINDOW, LIFETIME_WEIGHTED}"
      - name: fraud_score_rolling_window
        type: number
        source: computed
        description: "retailer_fraud_score variant rolling_window result, 2 decimals"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: fraud_score_lifetime_weighted
        type: number
        source: computed
        description: "retailer_fraud_score variant lifetime_weighted result, 2 decimals"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: fraud_score
        type: number
        source: computed
        description: "Copy of whichever variant field fraud_scoring_mode selects; the value the status/tier thresholds read"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: duplicate_rate
        type: number
        source: computed
        description: "Percent of in-window adjudicated CouponItems with status REJECTED_DUPLICATE, 2 decimals"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: misredemption_rate
        type: number
        source: computed
        description: "Percent of in-window adjudicated CouponItems with status REJECTED_MISREDEEMED, 2 decimals; feeds the statement holdback risk add-on"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: counterfeit_rate
        type: number
        source: computed
        description: "Percent of in-window adjudicated CouponItems with status REJECTED_COUNTERFEIT, 2 decimals"
        default: 0.00
        constraints: "0.00 .. 100.00"
      - name: rejected_submission_count
        type: integer
        source: computed
        description: "Count of this retailer's Submissions that reached intake_status CLOSED with every lot in LOT_REJECTED"
        default: 0
        constraints: ">= 0"
      - name: unpaid_balance_cents
        type: integer
        source: computed
        description: "Sum of net_payable_cents over this retailer's SettlementStatements with status == SCHEDULED only; a HELD statement is not payable and drops out of the balance, and a PAID one has already left it"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle gate; SUSPENDED blocks submission intake and lot finalization"
        default: ACTIVE
        constraints: "one of {ACTIVE, WATCHLIST, SUSPENDED}"
      - name: last_rescored_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent retailer_fraud_score evaluation; null until first rescore"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits, or null"

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the issuer that funds this offer"
        constraints: "must reference an existing Manufacturer"
      - name: offer_code
        type: string
        source: input
        description: "Manufacturer-scoped offer code printed on the coupon"
        constraints: "1..24 chars, uppercase alphanumerics and hyphen; unique per (manufacturer_id, offer_code)"
      - name: face_value_cents
        type: integer
        source: input
        description: "Cents the manufacturer reimburses per cleared unit"
        constraints: ">= 1 and <= 100000"
      - name: handling_fee_cents
        type: integer
        source: input
        description: "Contract per-unit handling fee basis used when Manufacturer.handling_fee_policy == CONTRACT_RATE"
        constraints: ">= 0 and <= 1000"
      - name: purchase_requirement_units
        type: integer
        source: input
        description: "Qualifying units a shopper must buy per cleared unit; multiplied by CouponItem.claimed_units during misredemption matching"
        default: 1
        constraints: ">= 1 and <= 24"
      - name: expiration_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) on which a shopper may redeem at the register"
        constraints: "ISO date; must be >= the logical clock date at activation time, else POST /offers/{id}/activate raises ERR_OFFER_EXPIRED"
      - name: redemption_grace_days
        type: integer
        source: input
        description: "Days after expiration_date during which a retailer may still open a SubmissionLot against this offer"
        default: 30
        constraints: ">= 0 and <= 365"
      - name: redemption_instructions
        type: string
        source: input
        description: "Free-text retailer-facing clearing instructions carried on the coupon"
        constraints: "1..500 chars"
      - name: barcode_family
        type: enum
        source: input
        description: "Symbology family; selects the family_code prefix in offer_barcode_payload"
        constraints: "one of {GS1_DATABAR, UPC_A_WITH_EXT5}"
      - name: barcode_payload
        type: string
        source: computed
        description: "Deterministic encoding minted by offer_barcode_payload at the DRAFT -> REGISTERED transition; null while DRAFT"
        default: null
        constraints: "digits only; CouponItem.scanned_barcode is compared byte-for-byte against this value"
      - name: max_redemptions
        type: integer
        source: input
        description: "Ceiling on cumulative cleared units across every lot and digital redemption of this offer"
        constraints: ">= 1 and <= 100000000"
      - name: accepted_redemption_count
        type: integer
        source: computed
        description: "Cumulative cleared units: incremented by lot finalization, dispute reinstatement and MATCHED digital redemption events"
        default: 0
        constraints: "0 .. max_redemptions"
      - name: digital_enabled
        type: boolean
        source: input
        description: "When false, POST /digital-clips and POST /digital-redemption-events reject this offer"
        default: false
      - name: clip_validity_days
        type: integer
        source: input
        description: "Days a DigitalClip stays clippable, before the expiration_date ceiling in clip_expiry applies"
        default: 60
        constraints: ">= 1 and <= 365"
      - name: status
        type: enum
        source: system
        description: "Offer lifecycle; only ACTIVE and EXPIRED offers may back a new SubmissionLot"
        default: DRAFT
        constraints: "one of {DRAFT, REGISTERED, ACTIVE, EXPIRED, WITHDRAWN}"
      - name: withdrawn_reason
        type: string
        source: input
        description: "Reason recorded by the withdraw action; null unless status == WITHDRAWN"
        default: null
        constraints: "1..200 chars when present"

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the submitting retailer"
        constraints: "must reference an existing Retailer"
      - name: channel
        type: enum
        source: input
        description: "Intake channel; MAIL requires image capture and a postmark window, ELECTRONIC requires POS transaction refs"
        constraints: "one of {MAIL, ELECTRONIC}"
      - name: declared_count
        type: integer
        source: input
        description: "Coupon count the retailer claims in the shipment or file"
        constraints: ">= 0 and <= 1000000"
      - name: verified_count
        type: integer
        source: computed
        description: "Clerk-counted coupon total written by the verify-count action; 0 until intake_status leaves RECEIVED"
        default: 0
        constraints: ">= 0"
      - name: count_variance_pct
        type: number
        source: computed
        description: "submission_count_variance result, 2 decimals; gates intake against COUNT_VARIANCE_TOLERANCE_PCT"
        default: 0.00
        constraints: ">= 0.00"
      - name: postmark_window_start
        type: string
        source: input
        description: "Inclusive lower bound (YYYY-MM-DD) of the postmark interval this shipment or file occupies on the retailer. Required on every submission of either channel - the interval models the retailer's intake stream, not a mail-only artefact - so it is never null."
        constraints: "required, ISO date; must be < postmark_window_end"
      - name: postmark_window_end
        type: string
        source: input
        description: "Exclusive upper bound (YYYY-MM-DD) of the postmark interval; required on every submission of either channel."
        constraints: "required, ISO date; must be > postmark_window_start"
      - name: intake_status
        type: enum
        source: system
        description: "Intake dimension of the parallel state machine; advances independently of settlement_status"
        default: RECEIVED
        constraints: "one of {RECEIVED, COUNT_VERIFIED, SORTED, CLOSED}"
      - name: settlement_status
        type: enum
        source: system
        description: "Settlement dimension of the parallel state machine; advances independently of intake_status"
        default: PENDING
        constraints: "one of {PENDING, STATEMENT_ISSUED, PAID, HELD}"
      - name: hold_reason
        type: enum
        source: system
        description: "Why settlement_status is HELD; null otherwise"
        default: null
        constraints: "one of {FUNDING_SHORTFALL, FRAUD_REVIEW} or null"
      - name: sorted_lot_count
        type: integer
        source: computed
        description: "Count of SubmissionLot rows whose submission_id equals this row"
        default: 0
        constraints: ">= 0"
      - name: rejected_lot_count
        type: integer
        source: computed
        description: "Count of this submission's lots with status == LOT_REJECTED"
        default: 0
        constraints: ">= 0"
      - name: declared_face_value_cents
        type: integer
        source: computed
        description: "Sum over this submission's lots of (lot.counted_qty * Offer.face_value_cents) — notional value before adjudication"
        default: 0
        constraints: ">= 0"
      - name: adjudicated_face_value_cents
        type: integer
        source: computed
        description: "Sum over this submission's CouponItems with status != CAPTURED of (Offer.face_value_cents * item.claimed_units); the conserved quantity of compensating_invariant / item_face_value_conservation"
        default: 0
        constraints: ">= 0"
      - name: accepted_item_face_value_cents
        type: integer
        source: computed
        description: "Sum over this submission's CouponItems with status IN {ACCEPTED, REINSTATED} of (Offer.face_value_cents * item.claimed_units)"
        default: 0
        constraints: ">= 0"
      - name: rejected_item_face_value_cents
        type: integer
        source: computed
        description: "Sum over this submission's CouponItems with status IN {REJECTED_EXPIRED, REJECTED_COUNTERFEIT, REJECTED_DUPLICATE, REJECTED_MISREDEEMED} of (Offer.face_value_cents * item.claimed_units)"
        default: 0
        constraints: ">= 0"
      - name: settled_gross_face_value_cents
        type: integer
        source: computed
        description: "Sum over this submission's lots with status IN {VALIDATED, REINSTATED} of lot.gross_face_value_cents; the billable gross a statement copies"
        default: 0
        constraints: ">= 0"
      - name: settled_handling_fee_cents
        type: integer
        source: computed
        description: "Sum over this submission's lots with status IN {VALIDATED, REINSTATED} of lot.handling_fee_cents; per-lot rounding is already baked in"
        default: 0
        constraints: ">= 0"
      - name: valuation_method
        type: enum
        source: computed
        description: "Which lot_gross_face_value variant the majority of this submission's lots used; FULL_COUNT unless at least one lot took SAMPLED_EXTRAPOLATION"
        default: FULL_COUNT
        constraints: "one of {FULL_COUNT, SAMPLED_EXTRAPOLATION}"

  - name: SubmissionLot
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the intake batch this sort bucket belongs to"
        constraints: "must reference an existing Submission"
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer all coupons in this bucket claim"
        constraints: "must reference an existing Offer with status IN {ACTIVE, EXPIRED}"
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the manufacturer the clerk sorted this bucket to; must equal Offer.manufacturer_id"
        constraints: "must reference an existing Manufacturer"
      - name: counted_qty
        type: integer
        source: input
        description: "Physical coupon count the clerk placed in this bucket"
        constraints: ">= 1; the running sum across a submission's lots may not exceed Submission.verified_count"
      - name: sample_size
        type: integer
        source: computed
        description: "lot_sample_size result — how many CouponItems must be captured before finalization"
        default: 0
        constraints: "1 .. counted_qty"
      - name: captured_item_count
        type: integer
        source: computed
        description: "Count of CouponItem rows whose lot_id equals this row"
        default: 0
        constraints: "0 .. sample_size"
      - name: accepted_qty
        type: integer
        source: computed
        description: "Sum of claimed_units over this lot's CouponItems with status IN {ACCEPTED, REINSTATED}"
        default: 0
        constraints: ">= 0"
      - name: rejected_qty
        type: integer
        source: computed
        description: "Sum of claimed_units over this lot's CouponItems with status IN {REJECTED_EXPIRED, REJECTED_COUNTERFEIT, REJECTED_DUPLICATE, REJECTED_MISREDEEMED}"
        default: 0
        constraints: ">= 0"
      - name: projected_accepted_units
        type: integer
        source: computed
        description: "Extrapolated cleared units written only by the sampled_extrapolation variant of lot_gross_face_value; equals accepted_qty under full_count"
        default: 0
        constraints: ">= 0"
      - name: valuation_variant
        type: enum
        source: computed
        description: "Which lot_gross_face_value variant this lot resolved to at finalization"
        default: FULL_COUNT
        constraints: "one of {FULL_COUNT, SAMPLED_EXTRAPOLATION}"
      - name: gross_face_value_cents
        type: integer
        source: computed
        description: "lot_gross_face_value result for the resolved variant"
        default: 0
        constraints: ">= 0"
      - name: handling_fee_cents
        type: integer
        source: computed
        description: "lot_handling_fee result; already rounded half-up to whole cents at the lot level before any submission-level summation"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lot lifecycle; LOT_REJECTED -> DISPUTED -> LOT_REJECTED is the revision cycle"
        default: SORTED
        constraints: "one of {SORTED, VALIDATED, LOT_REJECTED, DISPUTED, REINSTATED}"
      - name: reject_reason
        type: enum
        source: system
        description: "Why the lot is in LOT_REJECTED; null otherwise"
        default: null
        constraints: "one of {ALL_ITEMS_REJECTED, OFFER_WITHDRAWN, DISPUTE_UPHELD} or null"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FraudAnalyst who ran finalize on this lot; the SoD wall for dispute resolution"
        default: null
        constraints: "opaque operator id, or null before finalization"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical-clock instant of finalization; null before finalization"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits, or null"

  - name: CouponItem
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> SubmissionLot.id; the sort bucket this physical or electronic coupon record sits in"
        constraints: "must reference an existing SubmissionLot with status == SORTED"
      - name: scanned_barcode
        type: string
        source: input
        description: "Barcode digits read off the coupon; compared byte-for-byte against Offer.barcode_payload by the counterfeit check"
        constraints: "1..64 chars, digits only"
      - name: serial_number
        type: string
        source: input
        description: "One-time-use serial carried in the barcode's serial field; null for mass-print coupons, which skips the duplicate check entirely"
        default: null
        constraints: "1..32 chars when present"
      - name: image_uri
        type: string
        source: input
        description: "Captured coupon image location; mandatory on every item because validation against offer terms is image-based"
        constraints: "1..300 chars, non-blank"
      - name: redeemed_at
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the shopper redeemed at the register; compared against Offer.expiration_date by the expiry check"
        constraints: "ISO date"
      - name: pos_transaction_ref
        type: string
        source: input
        description: "Register transaction reference used to match a PurchaseDataRecord; required when the owning Submission.channel == ELECTRONIC. A null ref matches no record, so the item falls to REJECTED_MISREDEEMED with reject_code NO_PURCHASE_MATCH rather than getting a free pass"
        default: null
        constraints: "1..40 chars when present"
      - name: claimed_units
        type: integer
        source: input
        description: "How many offer instances this single coupon clears (multi-unit coupons); multiplies both face value and the purchase requirement"
        default: 1
        constraints: ">= 1 and <= 5"
      - name: status
        type: enum
        source: system
        description: "Adjudication outcome; the five branch targets of one trigger plus the reinstatement target"
        default: CAPTURED
        constraints: "one of {CAPTURED, ACCEPTED, REJECTED_EXPIRED, REJECTED_COUNTERFEIT, REJECTED_DUPLICATE, REJECTED_MISREDEEMED, REINSTATED}"
      - name: reject_code
        type: enum
        source: system
        description: "Machine-readable rejection detail written alongside a REJECTED_* status; null otherwise"
        default: null
        constraints: "one of {BARCODE_MISMATCH, EXPIRED_AT_POS, DUPLICATE_SERIAL, NO_PURCHASE_MATCH, INSUFFICIENT_QUALIFYING_UNITS} or null"
      - name: duplicate_of_item_id
        type: string
        source: system
        description: "FK -> CouponItem.id; the earliest-adjudicated already-cleared item that owns this (scanned_barcode, serial_number) pair; null unless status == REJECTED_DUPLICATE"
        default: null
        constraints: "self-referential; never equals this row's own id"
      - name: matched_purchase_record_id
        type: string
        source: system
        description: "FK -> PurchaseDataRecord.id; the record the misredemption matcher selected; null when the check was skipped or found no candidate"
        default: null
        constraints: "must reference an existing PurchaseDataRecord when present"
      - name: adjudicated_at
        type: datetime
        source: system
        description: "Logical-clock instant this item left CAPTURED; the primary sort key of duplicate_barcode_detection"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits, or null"

  - name: PurchaseDataRecord
    parent: null
    common_fields: false
    fields:
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the retailer whose register produced this basket"
        constraints: "must reference an existing Retailer"
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; the offer the basket qualifies for"
        constraints: "must reference an existing Offer"
      - name: pos_transaction_ref
        type: string
        source: input
        description: "Register transaction reference; the join key against CouponItem.pos_transaction_ref"
        constraints: "1..40 chars"
      - name: transaction_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the basket; the ranking key of the misredemption matcher"
        constraints: "ISO date"
      - name: qualifying_units
        type: integer
        source: input
        description: "Units in the basket that satisfy the offer's purchase requirement"
        constraints: ">= 0 and <= 1000"

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        description: "FK -> Submission.id; the closed intake batch being settled"
        constraints: "must reference a Submission with intake_status == CLOSED; at most one non-superseded statement per submission"
      - name: retailer_id
        type: string
        source: computed
        description: "FK -> Retailer.id; copied from Submission.retailer_id at issuance"
        constraints: "always equals the submission's retailer_id"
      - name: manufacturer_invoice_id
        type: string
        source: system
        description: "FK -> ManufacturerInvoice.id; set when a SettlementOfficer bills this statement onto an invoice; null while unbilled"
        default: null
        constraints: "must reference an existing ManufacturerInvoice when present"
      - name: prior_chargeback_offset_cents
        type: integer
        source: input
        description: "Operator-supplied carry-forward deduction from prior cycles, subtracted before the holdback tier is chosen"
        default: 0
        constraints: ">= 0"
      - name: gross_face_value_cents
        type: integer
        source: computed
        description: "Copied from Submission.settled_gross_face_value_cents at issuance"
        default: 0
        constraints: ">= 0"
      - name: handling_fee_total_cents
        type: integer
        source: computed
        description: "Copied from Submission.settled_handling_fee_cents at issuance"
        default: 0
        constraints: ">= 0"
      - name: provisional_net_cents
        type: integer
        source: computed
        description: "statement_net_payable step 3: gross_face_value_cents + handling_fee_total_cents - prior_chargeback_offset_cents; the pinned input to the holdback tier lookup"
        default: 0
        constraints: "may be negative when the offset exceeds the earned amount"
      - name: holdback_pct
        type: number
        source: computed
        description: "statement_net_payable step 4 result, 4 decimals; tier base plus risk add-on, capped at HOLDBACK_CAP_PCT"
        default: 0.0000
        constraints: "0.0000 .. 0.0600"
      - name: misredemption_holdback_cents
        type: integer
        source: computed
        description: "statement_net_payable step 5: round_half_up(max(0, provisional_net_cents) * holdback_pct)"
        default: 0
        constraints: ">= 0"
      - name: net_payable_cents
        type: integer
        source: computed
        description: "statement_net_payable step 6: provisional_net_cents - misredemption_holdback_cents"
        default: 0
        constraints: "may be negative"
      - name: scheduled_pay_date
        type: string
        source: computed
        description: "payment_schedule_date result (YYYY-MM-DD); null while status == DRAFT"
        default: null
        constraints: "ISO date or null"
      - name: status
        type: enum
        source: system
        description: "Statement lifecycle; SCHEDULED -> HELD -> SCHEDULED is the funding-shortfall cycle"
        default: DRAFT
        constraints: "one of {DRAFT, SCHEDULED, HELD, PAID}"
      - name: hold_reason
        type: enum
        source: system
        description: "Why status is HELD; null otherwise"
        default: null
        constraints: "one of {FUNDING_SHORTFALL, DISPUTE_OPEN} or null"
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SettlementOfficer who created this statement; the SoD wall for payment release"
        constraints: "opaque operator id"
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SettlementOfficer who released payment; null until status == PAID"
        default: null
        constraints: "opaque operator id, or null"

  - name: ManufacturerInvoice
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_id
        type: string
        source: input
        description: "FK -> Manufacturer.id; the issuer being billed"
        constraints: "must reference an existing Manufacturer"
      - name: billing_period_start
        type: string
        source: input
        description: "Inclusive lower bound (YYYY-MM-DD) of the closed billing interval this invoice occupies on the manufacturer"
        constraints: "ISO date; must be <= billing_period_end"
      - name: billing_period_end
        type: string
        source: input
        description: "Inclusive upper bound (YYYY-MM-DD) of the closed billing interval"
        constraints: "ISO date; must be >= billing_period_start"
      - name: statement_ids
        type: array
        source: input
        description: "Ordered list of SettlementStatement ids billed onto this invoice; each must have status IN {DRAFT, SCHEDULED}, be unbilled, and belong to a submission whose lots all carry this manufacturer_id"
        constraints: "1..200 entries, no duplicates"
      - name: billed_face_value_cents
        type: integer
        source: computed
        description: "Sum of gross_face_value_cents over the billed statements"
        default: 0
        constraints: ">= 0"
      - name: billed_handling_fee_cents
        type: integer
        source: computed
        description: "Sum of handling_fee_total_cents over the billed statements"
        default: 0
        constraints: ">= 0"
      - name: billed_clearing_fee_cents
        type: integer
        source: computed
        description: "invoice_billed_total step 3: round_half_up(billed_face_value_cents * CLEARING_FEE_PCT)"
        default: 0
        constraints: ">= 0"
      - name: billed_total_cents
        type: integer
        source: computed
        description: "billed_face_value_cents + billed_handling_fee_cents + billed_clearing_fee_cents"
        default: 0
        constraints: ">= 0"
      - name: funded_amount_cents
        type: integer
        source: computed
        description: "Cumulative cents wired against this invoice; reset to 0 by reverse-funding"
        default: 0
        constraints: "0 .. billed_total_cents"
      - name: funding_shortfall_cents
        type: integer
        source: computed
        description: "max(0, billed_total_cents - funded_amount_cents)"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Invoice lifecycle; ISSUED forks to FUNDED or SHORT_FUNDED on the same trigger with divergent cascades"
        default: ISSUED
        constraints: "one of {ISSUED, FUNDED, SHORT_FUNDED, RECONCILED, REVERSED}"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> SubmissionLot.id; the rejected lot under appeal"
        constraints: "must reference a SubmissionLot with status == LOT_REJECTED"
      - name: retailer_id
        type: string
        source: computed
        description: "FK -> Retailer.id; copied from the lot's submission at filing time"
        constraints: "always equals the disputed lot's submission's retailer_id"
      - name: reason_code
        type: enum
        source: input
        description: "Retailer's stated grounds for the appeal"
        constraints: "one of {WRONG_EXPIRY_CALL, IMAGE_QUALITY, POS_DATA_LATE, DUPLICATE_MISMATCH}"
      - name: narrative
        type: string
        source: input
        description: "Retailer's free-text argument attached at filing"
        constraints: "1..1000 chars"
      - name: claimed_face_value_cents
        type: integer
        source: computed
        description: "Copied from the disputed lot's rejected face value: sum over the lot's REJECTED_* items of (Offer.face_value_cents * claimed_units)"
        default: 0
        constraints: ">= 0"
      - name: info_request_count
        type: integer
        source: computed
        description: "How many times an analyst has bounced this dispute back for more information; capped at MAX_INFO_ROUNDS"
        default: 0
        constraints: "0 .. 2"
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle; UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW is the negotiation cycle"
        default: UNDER_REVIEW
        constraints: "one of {UNDER_REVIEW, INFO_REQUESTED, UPHELD, OVERTURNED, WITHDRAWN}"
      - name: resolution_note
        type: string
        source: input
        description: "Analyst's written rationale supplied by the resolve action; null before resolution"
        default: null
        constraints: "1..1000 chars when present"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FraudAnalyst who resolved this dispute; must differ from the disputed lot's adjudicated_by_user_id"
        default: null
        constraints: "opaque operator id, or null"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the dispute was filed; the SLA anchor for automatic withdrawal"
        constraints: "ISO 8601 UTC with three fractional digits"

  - name: DigitalClip
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; must have digital_enabled == true"
        constraints: "must reference an existing Offer"
      - name: consumer_ref
        type: string
        source: input
        description: "Opaque loyalty-account handle that clipped the offer"
        constraints: "1..40 chars"
      - name: clipped_at
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the shopper clipped the offer, taken from the logical clock at POST /digital-clips - never supplied by the caller; inclusive lower bound of the clip's occupancy interval"
        constraints: "ISO date, always the logical clock's calendar date at creation"
      - name: clip_expires_at
        type: string
        source: computed
        description: "clip_expiry result (YYYY-MM-DD); inclusive upper bound of the clip's occupancy interval"
        default: null
        constraints: "ISO date"
      - name: status
        type: enum
        source: system
        description: "Clip lifecycle"
        default: CLIPPED
        constraints: "one of {CLIPPED, MATCHED, EXPIRED_UNUSED}"
      - name: matched_event_id
        type: string
        source: system
        description: "FK -> DigitalRedemptionEvent.id; the redemption event that consumed this clip; null unless status == MATCHED"
        default: null
        constraints: "must reference an existing DigitalRedemptionEvent when present"

  - name: DigitalRedemptionEvent
    parent: null
    common_fields: true
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> Offer.id; must have digital_enabled == true"
        constraints: "must reference an existing Offer"
      - name: retailer_id
        type: string
        source: input
        description: "FK -> Retailer.id; the banner that reported the digital redemption"
        constraints: "must reference an existing Retailer"
      - name: consumer_ref
        type: string
        source: input
        description: "Loyalty-account handle reported by the register; the equality key of the clip matcher"
        constraints: "1..40 chars"
      - name: redeemed_at
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) of the digital redemption, taken from the logical clock at POST /digital-redemption-events - never supplied by the caller; must fall inside a candidate clip's occupancy interval for the matcher to select that clip"
        constraints: "ISO date, always the logical clock's calendar date at creation"
      - name: face_value_cents
        type: integer
        source: computed
        description: "Copied from Offer.face_value_cents at ingest"
        default: 0
        constraints: ">= 0"
      - name: matched_clip_id
        type: string
        source: system
        description: "FK -> DigitalClip.id; the clip the matcher selected; null when status == UNMATCHED"
        default: null
        constraints: "must reference an existing DigitalClip when present"
      - name: status
        type: enum
        source: system
        description: "Whether the matcher found an eligible clip; decided once at ingest and never revisited"
        default: UNMATCHED
        constraints: "one of {MATCHED, UNMATCHED}"
      - name: reject_code
        type: enum
        source: system
        description: "Why no clip was consumed; null when status == MATCHED"
        default: null
        constraints: "one of {NO_ELIGIBLE_CLIP} or null"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Manufacturer
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /manufacturers/{id}/suspend"
        actor: ClearinghouseAdmin
        preconditions:
          - "manufacturer.status == ACTIVE"
        side_effects:
          - "sets Manufacturer.status = SUSPENDED"
          - "increments Manufacturer.version by 1 and refreshes updated_at"
        note: "Suspension is terminal; it blocks offer registration (ERR_MANUFACTURER_SUSPENDED) and invoice funding but leaves already-issued invoices intact."

  - entity: Retailer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: WATCHLIST
        trigger: "POST /retailers/{id}/fraud-rescore, or the Submission SORTED -> CLOSED cascade when every lot is LOT_REJECTED"
        actor: FraudAnalyst | system
        preconditions:
          - "the freshly computed Retailer.fraud_score >= FRAUD_WATCHLIST_THRESHOLD (70.00) and < FRAUD_SUSPEND_THRESHOLD (90.00)"
        side_effects:
          - "sets Retailer.status = WATCHLIST"
          - "sets Retailer.handling_fee_tier = PROBATION, which lowers TIER_MULTIPLIER to 0.80 for every lot finalized from now on"
          - "increments Retailer.version by 1 and refreshes updated_at"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /retailers/{id}/fraud-rescore, or the Submission SORTED -> CLOSED cascade when every lot is LOT_REJECTED"
        actor: FraudAnalyst | system
        preconditions:
          - "the freshly computed Retailer.fraud_score >= FRAUD_SUSPEND_THRESHOLD (90.00)"
        side_effects:
          - "sets Retailer.status = SUSPENDED and Retailer.handling_fee_tier = PROBATION"
          - "increments Retailer.version by 1 and refreshes updated_at"
      - from: WATCHLIST
        to: SUSPENDED
        trigger: "POST /retailers/{id}/fraud-rescore"
        actor: FraudAnalyst
        preconditions:
          - "the freshly computed Retailer.fraud_score >= FRAUD_SUSPEND_THRESHOLD (90.00)"
        side_effects:
          - "sets Retailer.status = SUSPENDED"
          - "increments Retailer.version by 1 and refreshes updated_at"
      - from: WATCHLIST
        to: ACTIVE
        trigger: "POST /retailers/{id}/fraud-rescore"
        actor: FraudAnalyst
        preconditions:
          - "the freshly computed Retailer.fraud_score < FRAUD_WATCHLIST_THRESHOLD (70.00)"
        side_effects:
          - "sets Retailer.status = ACTIVE"
          - "sets Retailer.handling_fee_tier = Retailer.base_fee_tier"
          - "increments Retailer.version by 1 and refreshes updated_at"
        note: "Cycle: a retailer may oscillate ACTIVE -> WATCHLIST -> ACTIVE across rescores; the tier always returns to base_fee_tier, never to a remembered PROBATION."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /retailers/{id}/suspend"
        actor: ClearinghouseAdmin
        preconditions:
          - "retailer.status IN {ACTIVE, WATCHLIST}"
        side_effects:
          - "sets Retailer.status = SUSPENDED"
          - "increments Retailer.version by 1 and refreshes updated_at"
        note: "Administrative suspension; applies from ACTIVE or WATCHLIST and does not touch fraud_score."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /retailers/{id}/reinstate"
        actor: ClearinghouseAdmin
        preconditions:
          - "retailer.status == SUSPENDED"
        side_effects:
          - "sets Retailer.status = ACTIVE and Retailer.handling_fee_tier = Retailer.base_fee_tier"
          - "increments Retailer.version by 1 and refreshes updated_at"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE administrative cycle; fraud_score is left untouched so the next rescore can re-derive the gate."

  - entity: Offer
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: REGISTERED
        trigger: "POST /offers/{id}/register"
        actor: Manufacturer
        preconditions:
          - "offer.status == DRAFT"
          - "the acting X-User-ID equals offer.manufacturer_id"
          - "Manufacturer.status == ACTIVE"
        side_effects:
          - "runs calculation offer_barcode_payload and writes Offer.barcode_payload"
          - "increments Offer.version by 1 and refreshes updated_at"
      - from: REGISTERED
        to: ACTIVE
        trigger: "POST /offers/{id}/activate"
        actor: ClearinghouseAdmin
        preconditions:
          - "offer.status == REGISTERED"
          - "offer.expiration_date >= the logical clock's calendar date"
        side_effects:
          - "sets Offer.status = ACTIVE, opening the offer to lot creation and digital clipping"
          - "increments Offer.version by 1 and refreshes updated_at"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "offer.status == ACTIVE"
          - "offer.expiration_date < the new logical clock's calendar date"
        side_effects:
          - "sets Offer.status = EXPIRED; lot creation stays legal until expiration_date + redemption_grace_days"
          - "increments Offer.version by 1 and refreshes updated_at"
        note: "Swept in Offer.created_at ASC order so the sweep counter is deterministic."
      - from: REGISTERED
        to: WITHDRAWN
        trigger: "POST /offers/{id}/withdraw"
        actor: Manufacturer
        preconditions:
          - "offer.status IN {REGISTERED, ACTIVE, EXPIRED}"
          - "the acting X-User-ID equals offer.manufacturer_id"
        side_effects:
          - "sets Offer.status = WITHDRAWN and Offer.withdrawn_reason from the request body"
          - "cascade hop 1: every SubmissionLot with offer_id == this offer and status == SORTED is set to LOT_REJECTED with reject_reason = OFFER_WITHDRAWN, processed in SubmissionLot.created_at ASC order"
          - "cascade hop 2: because those lots changed status, each affected Submission recomputes rejected_lot_count, declared_face_value_cents, settled_gross_face_value_cents and settled_handling_fee_cents"
          - "cascade hop 3: because a recomputing Submission may now have every lot in {VALIDATED, LOT_REJECTED}, its intake_status advances SORTED -> CLOSED, and if every lot is LOT_REJECTED its settlement_status becomes HELD with hold_reason = FRAUD_REVIEW and Retailer.rejected_submission_count is incremented"
          - "increments Offer.version by 1 and refreshes updated_at on every touched row"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /offers/{id}/withdraw"
        actor: Manufacturer
        preconditions:
          - "offer.status IN {REGISTERED, ACTIVE, EXPIRED}"
          - "the acting X-User-ID equals offer.manufacturer_id"
        side_effects:
          - "identical to the REGISTERED -> WITHDRAWN cascade above"
      - from: EXPIRED
        to: WITHDRAWN
        trigger: "POST /offers/{id}/withdraw"
        actor: Manufacturer
        preconditions:
          - "offer.status IN {REGISTERED, ACTIVE, EXPIRED}"
          - "the acting X-User-ID equals offer.manufacturer_id"
        side_effects:
          - "identical to the REGISTERED -> WITHDRAWN cascade above"

  - entity: Submission
    initial_state: "RECEIVED x PENDING"
    terminal_states: ["CLOSED x PAID"]
    transitions:
      # ---- dimension A: intake_status ----
      - from: "intake_status=RECEIVED"
        to: "intake_status=COUNT_VERIFIED"
        trigger: "POST /submissions/{id}/verify-count"
        actor: IntakeClerk
        preconditions:
          - "submission.intake_status == RECEIVED"
          - "Retailer.status != SUSPENDED"
          - "submission.declared_count >= 1"
          - "the computed count_variance_pct <= COUNT_VARIANCE_TOLERANCE_PCT (2.00)"
        side_effects:
          - "writes Submission.verified_count from the request body"
          - "runs calculation submission_count_variance and writes Submission.count_variance_pct"
          - "increments Submission.version by 1 and refreshes updated_at"
        note: "settlement_status is untouched — the two dimensions never read each other here."
      - from: "intake_status=COUNT_VERIFIED"
        to: "intake_status=SORTED"
        trigger: "system, evaluated at the end of POST /submissions/{id}/lots"
        actor: system
        preconditions:
          - "submission.intake_status == COUNT_VERIFIED"
          - "the sum of counted_qty over all this submission's lots == submission.verified_count"
        side_effects:
          - "sets Submission.intake_status = SORTED, which closes the submission to further lots"
          - "recomputes Submission.sorted_lot_count and Submission.declared_face_value_cents"
          - "increments Submission.version by 1 and refreshes updated_at"
      - from: "intake_status=SORTED"
        to: "intake_status=CLOSED"
        trigger: "system, evaluated at the end of POST /submission-lots/{id}/finalize and of the Offer withdraw cascade"
        actor: system
        preconditions:
          - "submission.intake_status == SORTED"
          - "every SubmissionLot of this submission has status IN {VALIDATED, LOT_REJECTED}"
        side_effects:
          - "recomputes Submission.adjudicated_face_value_cents, accepted_item_face_value_cents, rejected_item_face_value_cents, settled_gross_face_value_cents, settled_handling_fee_cents, rejected_lot_count and valuation_method"
          - "conditional cascade: only when rejected_lot_count == sorted_lot_count, sets settlement_status = HELD with hold_reason = FRAUD_REVIEW, increments Retailer.rejected_submission_count by 1, re-runs calculation retailer_fraud_score for that retailer, and applies the resulting Retailer status/tier gate"
          - "increments Submission.version by 1 and refreshes updated_at"
      # ---- dimension B: settlement_status ----
      - from: "settlement_status=PENDING"
        to: "settlement_status=STATEMENT_ISSUED"
        trigger: "POST /settlement-statements/{id}/schedule"
        actor: SettlementOfficer
        preconditions:
          - "submission.intake_status == CLOSED"
          - "submission.settlement_status == PENDING"
        side_effects:
          - "sets Submission.settlement_status = STATEMENT_ISSUED"
          - "increments Submission.version by 1 and refreshes updated_at"
      - from: "settlement_status=STATEMENT_ISSUED"
        to: "settlement_status=PAID"
        trigger: "POST /settlement-statements/{id}/release-payment"
        actor: SettlementOfficer
        preconditions:
          - "submission.settlement_status == STATEMENT_ISSUED"
        side_effects:
          - "sets Submission.settlement_status = PAID and clears hold_reason"
          - "increments Submission.version by 1 and refreshes updated_at"
      - from: "settlement_status=STATEMENT_ISSUED"
        to: "settlement_status=HELD"
        trigger: "system cascade from ManufacturerInvoice ISSUED -> SHORT_FUNDED or FUNDED -> REVERSED"
        actor: system
        preconditions:
          - "submission.settlement_status == STATEMENT_ISSUED"
          - "the submission's SettlementStatement was moved SCHEDULED -> HELD by the invoice cascade"
        side_effects:
          - "sets Submission.settlement_status = HELD and hold_reason = FUNDING_SHORTFALL"
          - "increments Submission.version by 1 and refreshes updated_at"
      - from: "settlement_status=PENDING"
        to: "settlement_status=HELD"
        trigger: "system cascade from the Submission SORTED -> CLOSED all-lots-rejected branch"
        actor: system
        preconditions:
          - "submission.settlement_status == PENDING"
          - "rejected_lot_count == sorted_lot_count"
        side_effects:
          - "sets Submission.settlement_status = HELD and hold_reason = FRAUD_REVIEW"
          - "increments Submission.version by 1 and refreshes updated_at"
      - from: "settlement_status=HELD"
        to: "settlement_status=STATEMENT_ISSUED"
        trigger: "system cascade from ManufacturerInvoice SHORT_FUNDED -> FUNDED"
        actor: system
        preconditions:
          - "submission.settlement_status == HELD and hold_reason == FUNDING_SHORTFALL"
          - "the submission's SettlementStatement was moved HELD -> SCHEDULED by the invoice cascade"
        side_effects:
          - "sets Submission.settlement_status = STATEMENT_ISSUED and clears hold_reason"
          - "increments Submission.version by 1 and refreshes updated_at"
        note: "Closes the STATEMENT_ISSUED -> HELD -> STATEMENT_ISSUED funding cycle on dimension B while dimension A stays parked at CLOSED."

  - entity: SubmissionLot
    initial_state: SORTED
    terminal_states: [VALIDATED, REINSTATED]
    transitions:
      - from: SORTED
        to: VALIDATED
        trigger: "POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "lot.status == SORTED"
          - "lot.captured_item_count == lot.sample_size"
          - "Retailer.status != SUSPENDED (cross-entity: the lot's submission's retailer)"
          - "after adjudicating every still-CAPTURED item, accepted_qty >= 1"
          - "Offer.accepted_redemption_count + the units this lot would clear <= Offer.max_redemptions"
        side_effects:
          - "adjudicates every CouponItem of this lot still in CAPTURED, in CouponItem.created_at ASC order, per the CouponItem branch table"
          - "recomputes lot.accepted_qty and lot.rejected_qty"
          - "runs calculation lot_gross_face_value, writing lot.valuation_variant, lot.projected_accepted_units and lot.gross_face_value_cents"
          - "runs calculation lot_handling_fee, writing lot.handling_fee_cents rounded half-up to whole cents at this lot level"
          - "sets lot.status = VALIDATED, lot.adjudicated_by_user_id = the acting X-User-ID, lot.adjudicated_at = the logical clock"
          - "increments Offer.accepted_redemption_count by the cleared units and bumps Offer.version"
          - "recomputes the owning Submission's derived money fields, then evaluates the Submission SORTED -> CLOSED transition"
          - "increments SubmissionLot.version by 1 and refreshes updated_at"
      - from: SORTED
        to: LOT_REJECTED
        trigger: "POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "lot.status == SORTED"
          - "lot.captured_item_count == lot.sample_size"
          - "Retailer.status != SUSPENDED"
          - "after adjudicating every still-CAPTURED item, accepted_qty == 0"
        side_effects:
          - "adjudicates every still-CAPTURED item exactly as the VALIDATED branch does"
          - "sets lot.status = LOT_REJECTED and lot.reject_reason = ALL_ITEMS_REJECTED"
          - "leaves lot.gross_face_value_cents and lot.handling_fee_cents at 0 — a rejected lot is never valued and never earns a handling fee"
          - "does NOT touch Offer.accepted_redemption_count"
          - "sets lot.adjudicated_by_user_id and lot.adjudicated_at, recomputes the Submission's derived fields, then evaluates SORTED -> CLOSED"
          - "increments SubmissionLot.version by 1 and refreshes updated_at"
        note: "Branch fork: identical trigger, identical preconditions except the post-adjudication accepted_qty test, and a materially different side-effect set (no valuation, no fee, no redemption counter, a reject_reason instead)."
      - from: SORTED
        to: LOT_REJECTED
        trigger: "system cascade hop 1 of POST /offers/{id}/withdraw"
        actor: system
        preconditions:
          - "lot.status == SORTED"
          - "lot.offer_id == the withdrawn offer"
        side_effects:
          - "sets lot.status = LOT_REJECTED and lot.reject_reason = OFFER_WITHDRAWN"
          - "leaves every CouponItem of the lot in CAPTURED — nothing is adjudicated"
          - "increments SubmissionLot.version by 1 and refreshes updated_at"
      - from: LOT_REJECTED
        to: DISPUTED
        trigger: "POST /disputes"
        actor: Retailer
        preconditions:
          - "lot.status == LOT_REJECTED"
          - "the acting X-User-ID equals the lot's submission's retailer_id"
          - "the logical clock's calendar date <= lot.updated_at date + Manufacturer.dispute_window_days"
          - "no Dispute with status IN {UNDER_REVIEW, INFO_REQUESTED} already references this lot"
        side_effects:
          - "creates a Dispute in UNDER_REVIEW with claimed_face_value_cents copied from the lot's rejected item face value"
          - "sets lot.status = DISPUTED"
          - "if the lot's submission has a SettlementStatement in DRAFT or SCHEDULED, that statement is moved to HELD with hold_reason = DISPUTE_OPEN"
          - "increments SubmissionLot.version by 1 and refreshes updated_at"
      - from: DISPUTED
        to: LOT_REJECTED
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD, or the dispute SLA sweep inside POST /_clock/set_current_utc"
        actor: FraudAnalyst | system
        preconditions:
          - "lot.status == DISPUTED"
        side_effects:
          - "sets lot.status = LOT_REJECTED and lot.reject_reason = DISPUTE_UPHELD"
          - "leaves every CouponItem status untouched, so the submission's adjudicated_face_value_cents identity is unchanged"
          - "increments SubmissionLot.version by 1 and refreshes updated_at"
        note: "Closes the LOT_REJECTED -> DISPUTED -> LOT_REJECTED revision cycle; a retailer may file again while the dispute window is still open."
      - from: DISPUTED
        to: REINSTATED
        trigger: "POST /disputes/{id}/resolve with outcome OVERTURNED"
        actor: FraudAnalyst
        preconditions:
          - "lot.status == DISPUTED"
          - "the acting X-User-ID != lot.adjudicated_by_user_id"
        side_effects:
          - "every CouponItem of this lot with status IN {REJECTED_EXPIRED, REJECTED_COUNTERFEIT, REJECTED_DUPLICATE, REJECTED_MISREDEEMED} is set to REINSTATED with reject_code cleared and duplicate_of_item_id cleared, processed in CouponItem.created_at ASC order"
          - "recomputes lot.accepted_qty and lot.rejected_qty, then re-runs lot_gross_face_value and lot_handling_fee for the lot"
          - "sets lot.status = REINSTATED and clears lot.reject_reason"
          - "increments Offer.accepted_redemption_count by the newly cleared units and bumps Offer.version"
          - "recomputes the owning Submission's accepted_item_face_value_cents, rejected_item_face_value_cents, settled_gross_face_value_cents, settled_handling_fee_cents and rejected_lot_count, leaving adjudicated_face_value_cents numerically unchanged"
          - "increments SubmissionLot.version by 1 and refreshes updated_at"

  - entity: CouponItem
    initial_state: CAPTURED
    terminal_states: [ACCEPTED, REINSTATED]
    transitions:
      - from: CAPTURED
        to: REJECTED_COUNTERFEIT
        trigger: "POST /coupon-items/{id}/adjudicate, or the bulk sweep inside POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "item.status == CAPTURED"
          - "adjudication ladder step 1 fires: item.scanned_barcode != Offer.barcode_payload"
        side_effects:
          - "sets status = REJECTED_COUNTERFEIT, reject_code = BARCODE_MISMATCH, adjudicated_at = the logical clock"
          - "recomputes the lot's rejected_qty and the submission's adjudicated / rejected item face-value fields"
          - "increments CouponItem.version by 1 and refreshes updated_at"
        note: "Ladder step 1 outranks every later step: an item that is both counterfeit and expired lands here, not in REJECTED_EXPIRED."
      - from: CAPTURED
        to: REJECTED_EXPIRED
        trigger: "POST /coupon-items/{id}/adjudicate, or the bulk sweep inside POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "item.status == CAPTURED"
          - "ladder step 1 did not fire"
          - "adjudication ladder step 2 fires: item.redeemed_at > Offer.expiration_date"
        side_effects:
          - "sets status = REJECTED_EXPIRED, reject_code = EXPIRED_AT_POS, adjudicated_at = the logical clock"
          - "recomputes the lot's rejected_qty and the submission's adjudicated / rejected item face-value fields"
          - "increments CouponItem.version by 1 and refreshes updated_at"
        note: "redeemed_at == Offer.expiration_date is ON TIME; only strictly-after is expired."
      - from: CAPTURED
        to: REJECTED_DUPLICATE
        trigger: "POST /coupon-items/{id}/adjudicate, or the bulk sweep inside POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "item.status == CAPTURED"
          - "ladder steps 1-2 did not fire"
          - "adjudication ladder step 3 fires: item.serial_number IS NOT NULL and calculation duplicate_barcode_detection returns a non-empty winner"
        side_effects:
          - "sets status = REJECTED_DUPLICATE, reject_code = DUPLICATE_SERIAL, duplicate_of_item_id = the winner id, adjudicated_at = the logical clock"
          - "recomputes the lot's rejected_qty and the submission's adjudicated / rejected item face-value fields"
          - "increments CouponItem.version by 1 and refreshes updated_at"
        note: "Ladder step 3 outranks step 4: an item that is both a duplicate serial and unmatched against purchase data lands here, not in REJECTED_MISREDEEMED."
      - from: CAPTURED
        to: REJECTED_MISREDEEMED
        trigger: "POST /coupon-items/{id}/adjudicate, or the bulk sweep inside POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "item.status == CAPTURED"
          - "ladder steps 1-3 did not fire"
          - "adjudication ladder step 4 fires: calculation misredemption_match returns either no candidate record — which includes the case where item.pos_transaction_ref is null, since a null ref joins no PurchaseDataRecord and therefore gets no free pass — or a winner whose qualifying_units < Offer.purchase_requirement_units * item.claimed_units"
        side_effects:
          - "sets status = REJECTED_MISREDEEMED, adjudicated_at = the logical clock, reject_code = NO_PURCHASE_MATCH when the candidate set was empty and INSUFFICIENT_QUALIFYING_UNITS when a winner existed but fell short (matched_purchase_record_id is then set to that winner)"
          - "recomputes the lot's rejected_qty and the submission's adjudicated / rejected item face-value fields"
          - "increments CouponItem.version by 1 and refreshes updated_at"
      - from: CAPTURED
        to: ACCEPTED
        trigger: "POST /coupon-items/{id}/adjudicate, or the bulk sweep inside POST /submission-lots/{id}/finalize"
        actor: FraudAnalyst
        preconditions:
          - "item.status == CAPTURED"
          - "no ladder step 1-4 fired"
        side_effects:
          - "sets status = ACCEPTED, adjudicated_at = the logical clock, and matched_purchase_record_id to the misredemption winner when the check ran"
          - "recomputes the lot's accepted_qty and the submission's adjudicated / accepted item face-value fields"
          - "increments CouponItem.version by 1 and refreshes updated_at"
      - from: REJECTED_EXPIRED
        to: REINSTATED
        trigger: "system cascade from POST /disputes/{id}/resolve with outcome OVERTURNED"
        actor: system
        preconditions:
          - "item.status IN {REJECTED_EXPIRED, REJECTED_COUNTERFEIT, REJECTED_DUPLICATE, REJECTED_MISREDEEMED}"
          - "the item's lot is the disputed lot and lot.status == DISPUTED"
        side_effects:
          - "sets status = REINSTATED and clears reject_code and duplicate_of_item_id"
          - "increments CouponItem.version by 1 and refreshes updated_at"
      - from: REJECTED_COUNTERFEIT
        to: REINSTATED
        trigger: "system cascade from POST /disputes/{id}/resolve with outcome OVERTURNED"
        actor: system
        preconditions:
          - "identical to the REJECTED_EXPIRED -> REINSTATED row"
        side_effects:
          - "identical to the REJECTED_EXPIRED -> REINSTATED row"
      - from: REJECTED_DUPLICATE
        to: REINSTATED
        trigger: "system cascade from POST /disputes/{id}/resolve with outcome OVERTURNED"
        actor: system
        preconditions:
          - "identical to the REJECTED_EXPIRED -> REINSTATED row"
        side_effects:
          - "identical to the REJECTED_EXPIRED -> REINSTATED row"
      - from: REJECTED_MISREDEEMED
        to: REINSTATED
        trigger: "system cascade from POST /disputes/{id}/resolve with outcome OVERTURNED"
        actor: system
        preconditions:
          - "identical to the REJECTED_EXPIRED -> REINSTATED row"
        side_effects:
          - "identical to the REJECTED_EXPIRED -> REINSTATED row"

  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /settlement-statements/{id}/schedule"
        actor: SettlementOfficer
        preconditions:
          - "statement.status == DRAFT"
          - "no Dispute with status IN {UNDER_REVIEW, INFO_REQUESTED} references any SubmissionLot of statement.submission_id"
        side_effects:
          - "runs calculation payment_schedule_date and writes statement.scheduled_pay_date"
          - "sets statement.status = SCHEDULED"
          - "cross-entity: sets Submission.settlement_status = STATEMENT_ISSUED"
          - "increments Retailer.unpaid_balance_cents by statement.net_payable_cents and bumps Retailer.version"
          - "increments SettlementStatement.version by 1 and refreshes updated_at"
      - from: DRAFT
        to: HELD
        trigger: "system cascade from POST /disputes (a lot of this statement's submission enters DISPUTED)"
        actor: system
        preconditions:
          - "statement.status == DRAFT"
        side_effects:
          - "sets statement.status = HELD and hold_reason = DISPUTE_OPEN"
          - "increments SettlementStatement.version by 1 and refreshes updated_at"
      - from: SCHEDULED
        to: HELD
        trigger: "system cascade from POST /disputes, from ManufacturerInvoice ISSUED -> SHORT_FUNDED, or from ManufacturerInvoice FUNDED -> REVERSED"
        actor: system
        preconditions:
          - "statement.status == SCHEDULED"
        side_effects:
          - "sets statement.status = HELD; hold_reason = DISPUTE_OPEN for the dispute path and FUNDING_SHORTFALL for both invoice paths"
          - "cross-entity: on the invoice paths, sets Submission.settlement_status = HELD with hold_reason = FUNDING_SHORTFALL; on the dispute path the Submission is NOT touched and stays STATEMENT_ISSUED, because the intake batch is still settled — only the payment is frozen"
          - "recomputes the owning Retailer.unpaid_balance_cents over statements with status == SCHEDULED only, on every path, and bumps Retailer.version — a HELD statement is not payable and therefore leaves the balance"
          - "increments SettlementStatement.version by 1 and refreshes updated_at"
      - from: HELD
        to: SCHEDULED
        trigger: "system cascade from ManufacturerInvoice SHORT_FUNDED -> FUNDED"
        actor: system
        preconditions:
          - "statement.status == HELD and hold_reason == FUNDING_SHORTFALL"
          - "statement.manufacturer_invoice_id == the invoice that just reached FUNDED"
        side_effects:
          - "sets statement.status = SCHEDULED and clears hold_reason; scheduled_pay_date is NOT recomputed"
          - "cross-entity: sets Submission.settlement_status = STATEMENT_ISSUED and clears its hold_reason"
          - "increments SettlementStatement.version by 1 and refreshes updated_at"
        note: "Closes the SCHEDULED -> HELD -> SCHEDULED funding cycle. The dispute-driven hold has no automatic release path — it is cleared only through the invoice cycle, so a DISPUTE_OPEN hold survives until the dispute resolves and a fresh statement is issued."
      - from: SCHEDULED
        to: PAID
        trigger: "POST /settlement-statements/{id}/release-payment"
        actor: SettlementOfficer
        preconditions:
          - "statement.status == SCHEDULED"
          - "statement.manufacturer_invoice_id IS NOT NULL and that ManufacturerInvoice.status == FUNDED (cross-entity gate)"
          - "the logical clock's calendar date >= statement.scheduled_pay_date"
          - "the acting X-User-ID != statement.issued_by_user_id (segregation of duties)"
        side_effects:
          - "sets statement.status = PAID and statement.released_by_user_id = the acting X-User-ID"
          - "cross-entity: sets Submission.settlement_status = PAID and clears its hold_reason"
          - "increments Manufacturer.disbursed_total_cents by statement.net_payable_cents, recomputes Manufacturer.funding_balance_cents, bumps Manufacturer.version"
          - "decrements Retailer.unpaid_balance_cents by statement.net_payable_cents and bumps Retailer.version"
          - "bubble up: when every statement whose manufacturer_invoice_id is this invoice has status == PAID, the ManufacturerInvoice advances FUNDED -> RECONCILED"
          - "increments SettlementStatement.version by 1 and refreshes updated_at"

  - entity: ManufacturerInvoice
    initial_state: ISSUED
    terminal_states: [RECONCILED, REVERSED]
    transitions:
      - from: ISSUED
        to: FUNDED
        trigger: "POST /manufacturer-invoices/{id}/fund"
        actor: Manufacturer
        preconditions:
          - "invoice.status IN {ISSUED, SHORT_FUNDED}"
          - "the acting X-User-ID equals invoice.manufacturer_id"
          - "Manufacturer.status == ACTIVE"
          - "invoice.funded_amount_cents + body.amount_cents <= invoice.billed_total_cents"
          - "branch guard: invoice.funded_amount_cents + body.amount_cents == invoice.billed_total_cents"
        side_effects:
          - "increases invoice.funded_amount_cents by body.amount_cents and recomputes funding_shortfall_cents to 0"
          - "sets invoice.status = FUNDED"
          - "increments Manufacturer.funded_total_cents by body.amount_cents, recomputes Manufacturer.funding_balance_cents, bumps Manufacturer.version"
          - "increments ManufacturerInvoice.version by 1 and refreshes updated_at"
        note: "Fork branch A: full funding. No statement is touched — statements were already SCHEDULED and simply become releasable."
      - from: ISSUED
        to: SHORT_FUNDED
        trigger: "POST /manufacturer-invoices/{id}/fund"
        actor: Manufacturer
        preconditions:
          - "invoice.status IN {ISSUED, SHORT_FUNDED}"
          - "the acting X-User-ID equals invoice.manufacturer_id"
          - "Manufacturer.status == ACTIVE"
          - "invoice.funded_amount_cents + body.amount_cents < invoice.billed_total_cents"
        side_effects:
          - "increases invoice.funded_amount_cents by body.amount_cents and sets funding_shortfall_cents = billed_total_cents - funded_amount_cents"
          - "sets invoice.status = SHORT_FUNDED"
          - "increments Manufacturer.funded_total_cents by body.amount_cents, recomputes funding_balance_cents, bumps Manufacturer.version"
          - "cascade hop 1: every SettlementStatement with manufacturer_invoice_id == this invoice and status == SCHEDULED is set to HELD with hold_reason = FUNDING_SHORTFALL, processed in SettlementStatement.created_at ASC order"
          - "cascade hop 2: because each of those statements changed status, its Submission.settlement_status moves STATEMENT_ISSUED -> HELD with hold_reason = FUNDING_SHORTFALL"
          - "cascade hop 3: because those statements are now HELD rather than SCHEDULED, each affected Retailer.unpaid_balance_cents is recomputed over statements with status == SCHEDULED only — the held amount drops out of the retailer's payable balance — and Retailer.version is bumped"
          - "increments ManufacturerInvoice.version by 1 and refreshes updated_at"
        note: "Fork branch B: same trigger, same actor, divergent target and a three-hop cascade branch A never runs."
      - from: SHORT_FUNDED
        to: FUNDED
        trigger: "POST /manufacturer-invoices/{id}/fund"
        actor: Manufacturer
        preconditions:
          - "invoice.status == SHORT_FUNDED"
          - "invoice.funded_amount_cents + body.amount_cents == invoice.billed_total_cents"
        side_effects:
          - "increases invoice.funded_amount_cents to billed_total_cents and sets funding_shortfall_cents = 0"
          - "sets invoice.status = FUNDED"
          - "increments Manufacturer.funded_total_cents by body.amount_cents and recomputes funding_balance_cents"
          - "release cascade: every SettlementStatement of this invoice with status == HELD and hold_reason == FUNDING_SHORTFALL returns to SCHEDULED, and each such statement's Submission returns to STATEMENT_ISSUED"
          - "recomputes each affected Retailer.unpaid_balance_cents"
          - "increments ManufacturerInvoice.version by 1 and refreshes updated_at"
      - from: FUNDED
        to: RECONCILED
        trigger: "system, evaluated at the end of POST /settlement-statements/{id}/release-payment"
        actor: system
        preconditions:
          - "invoice.status == FUNDED"
          - "every SettlementStatement with manufacturer_invoice_id == this invoice has status == PAID"
        side_effects:
          - "sets invoice.status = RECONCILED"
          - "increments ManufacturerInvoice.version by 1 and refreshes updated_at"
      - from: FUNDED
        to: REVERSED
        trigger: "POST /manufacturer-invoices/{id}/reverse-funding"
        actor: ClearinghouseAdmin
        preconditions:
          - "invoice.status IN {FUNDED, SHORT_FUNDED}"
          - "no SettlementStatement of this invoice has status == PAID"
        side_effects:
          - "decrements Manufacturer.funded_total_cents by invoice.funded_amount_cents, recomputes funding_balance_cents, bumps Manufacturer.version"
          - "sets invoice.funded_amount_cents = 0 and funding_shortfall_cents = billed_total_cents"
          - "sets invoice.status = REVERSED"
          - "every SettlementStatement of this invoice with status == SCHEDULED is set to HELD with hold_reason = FUNDING_SHORTFALL, and each such statement's Submission moves to HELD"
          - "recomputes each affected Retailer.unpaid_balance_cents"
          - "increments ManufacturerInvoice.version by 1 and refreshes updated_at"
        note: "Compensating action for fund: restores Manufacturer.funded_total_cents and therefore funding_balance_cents to their pre-funding values exactly."
      - from: SHORT_FUNDED
        to: REVERSED
        trigger: "POST /manufacturer-invoices/{id}/reverse-funding"
        actor: ClearinghouseAdmin
        preconditions:
          - "identical to the FUNDED -> REVERSED row"
        side_effects:
          - "identical to the FUNDED -> REVERSED row"

  - entity: Dispute
    initial_state: UNDER_REVIEW
    terminal_states: [UPHELD, OVERTURNED, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /disputes/{id}/request-info"
        actor: FraudAnalyst
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "dispute.info_request_count < MAX_INFO_ROUNDS (2)"
        side_effects:
          - "increments dispute.info_request_count by 1"
          - "sets dispute.status = INFO_REQUESTED"
          - "increments Dispute.version by 1 and refreshes updated_at"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/resubmit"
        actor: Retailer
        preconditions:
          - "dispute.status == INFO_REQUESTED"
          - "the acting X-User-ID equals dispute.retailer_id"
        side_effects:
          - "appends the supplied narrative to dispute.narrative"
          - "sets dispute.status = UNDER_REVIEW"
          - "increments Dispute.version by 1 and refreshes updated_at"
        note: "Closes the UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW negotiation cycle; the third request-info attempt is rejected with ERR_INFO_ROUND_LIMIT."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve with outcome UPHELD"
        actor: FraudAnalyst
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "the acting X-User-ID != the disputed lot's adjudicated_by_user_id (segregation of duties)"
        side_effects:
          - "sets dispute.status = UPHELD, resolution_note and resolved_by_user_id"
          - "cross-entity: the disputed SubmissionLot returns DISPUTED -> LOT_REJECTED with reject_reason = DISPUTE_UPHELD"
          - "increments Dispute.version by 1 and refreshes updated_at"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /disputes/{id}/resolve with outcome OVERTURNED"
        actor: FraudAnalyst
        preconditions:
          - "dispute.status == UNDER_REVIEW"
          - "the acting X-User-ID != the disputed lot's adjudicated_by_user_id (segregation of duties)"
        side_effects:
          - "sets dispute.status = OVERTURNED, resolution_note and resolved_by_user_id"
          - "cross-entity: the disputed SubmissionLot runs its DISPUTED -> REINSTATED cascade (items reinstated, lot revalued, offer counter advanced, submission money fields recomputed)"
          - "increments Dispute.version by 1 and refreshes updated_at"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "system SLA sweep inside POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "dispute.status IN {UNDER_REVIEW, INFO_REQUESTED}"
          - "dispute.filed_at date + DISPUTE_SLA_DAYS (30) < the new logical clock's calendar date"
        side_effects:
          - "sets dispute.status = WITHDRAWN"
          - "cross-entity: the disputed SubmissionLot returns DISPUTED -> LOT_REJECTED with reject_reason = DISPUTE_UPHELD"
          - "increments Dispute.version by 1 and refreshes updated_at"
        note: "Swept in Dispute.created_at ASC order so the sweep counter is deterministic."
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "system SLA sweep inside POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "identical to the UNDER_REVIEW -> WITHDRAWN row"
        side_effects:
          - "identical to the UNDER_REVIEW -> WITHDRAWN row"

  - entity: DigitalClip
    initial_state: CLIPPED
    terminal_states: [MATCHED, EXPIRED_UNUSED]
    transitions:
      - from: CLIPPED
        to: MATCHED
        trigger: "system cascade from POST /digital-redemption-events when the clip matcher selects this clip"
        actor: system
        preconditions:
          - "clip.status == CLIPPED"
          - "the clip is the winner of calculation digital_clip_match for the incoming event"
        side_effects:
          - "sets clip.status = MATCHED and clip.matched_event_id = the new event id"
          - "increments Offer.accepted_redemption_count by 1 and bumps Offer.version"
          - "increments DigitalClip.version by 1 and refreshes updated_at"
      - from: CLIPPED
        to: EXPIRED_UNUSED
        trigger: "system sweep inside POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "clip.status == CLIPPED"
          - "clip.clip_expires_at < the new logical clock's calendar date"
        side_effects:
          - "sets clip.status = EXPIRED_UNUSED, freeing its slot against CLIP_CONCURRENCY_LIMIT"
          - "increments DigitalClip.version by 1 and refreshes updated_at"
        note: "Swept in DigitalClip.created_at ASC order so the sweep counter is deterministic."

  - entity: DigitalRedemptionEvent
    initial_state: UNMATCHED
    terminal_states: [MATCHED, UNMATCHED]
    transitions:
      - from: "(creation)"
        to: MATCHED
        trigger: "POST /digital-redemption-events"
        actor: Retailer
        preconditions:
          - "Offer.digital_enabled == true"
          - "calculation digital_clip_match returns a winner"
        side_effects:
          - "creates the event with status = MATCHED, matched_clip_id = the winner, face_value_cents copied from the offer"
          - "drives the winning DigitalClip CLIPPED -> MATCHED"
      - from: "(creation)"
        to: UNMATCHED
        trigger: "POST /digital-redemption-events"
        actor: Retailer
        preconditions:
          - "Offer.digital_enabled == true"
          - "calculation digital_clip_match returns an empty candidate set"
        side_effects:
          - "creates the event with status = UNMATCHED, reject_code = NO_ELIGIBLE_CLIP, matched_clip_id = null"
          - "no DigitalClip is consumed and Offer.accepted_redemption_count is unchanged"
        note: "Empty-pool fallback is a recorded 201, not an error — the clearinghouse must retain unmatched digital redemptions for manufacturer reporting."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: statement-issue-stale-submission
    parent_entity: Submission
    write_endpoint: "POST /settlement-statements"
    occ_field: "expected_submission_version"
    description: |
      Issuing a SettlementStatement against a Submission whose version has
      advanced past the version the client last observed is rejected. A closed
      submission legitimately accepts a fresh statement that supersedes any
      earlier DRAFT one, so the operation is not blocked by any state
      precondition; the stale-version check is the only thing that stops an
      officer from settling a submission whose money fields have since been
      rewritten by a dispute reinstatement or an offer withdrawal cascade.
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412

  - rule_id: fraud-rescore-stale-retailer
    parent_entity: Retailer
    write_endpoint: "POST /retailers/{id}/fraud-rescore"
    occ_field: "expected_retailer_version"
    description: |
      Re-running retailer_fraud_score against a Retailer whose version has
      advanced past the version the client last observed is rejected. A rescore
      is idempotent under unchanged data and carries no state precondition, so
      nothing else prevents an analyst from writing a score derived from a
      retailer snapshot that a submission-close cascade has already superseded.
    error_id: ERR_STALE_RETAILER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules
# ---------------------------------------------------------------------------

calculations:
  - name: offer_barcode_payload
    trigger: "POST /offers/{id}/register (DRAFT -> REGISTERED); the payload is minted once and never recomputed"
    algorithm: projection
    formula: |
      prefix   = Manufacturer(offer.manufacturer_id).gs1_company_prefix   # exactly 6 digits
      face5    = zero_pad_left(str(offer.face_value_cents), 5)            # face_value_cents <= 99999
      units2   = zero_pad_left(str(offer.purchase_requirement_units), 2)  # <= 24
      grace3   = zero_pad_left(str(offer.redemption_grace_days), 3)       # <= 365
      yymmdd   = offer.expiration_date rendered as YYMMDD                 # 2026-12-31 -> "261231"
      ext5     = zero_pad_left(str(offer.purchase_requirement_units * 1000
                                   + offer.redemption_grace_days), 5)

      if offer.barcode_family == "GS1_DATABAR":
          payload = "811" + prefix + face5 + units2 + yymmdd + grace3     # 25 digits
      else:  # UPC_A_WITH_EXT5
          payload = "5" + prefix + face5 + ext5                           # 17 digits

      return payload
    input_set: "The single Offer row being registered plus its Manufacturer's gs1_company_prefix. No other entity contributes."
    constants:
      DATABAR_FAMILY_CODE: "811"
      UPC_COUPON_NUMBER_SYSTEM: "5"
      EXT5_UNITS_MULTIPLIER: 1000
    precision: "exact string concatenation; digits only, no separators, no trimming of leading zeros"
    note: |
      The two families produce different lengths from identical offer data
      (25 vs 17 digits) and encode a different field set: only GS1_DATABAR
      carries the expiration date, so a UPC_A_WITH_EXT5 coupon's expiry can
      only be checked against the Offer row, never re-derived from the barcode.
      CouponItem.scanned_barcode is compared byte-for-byte against this value
      by adjudication ladder step 1, so a payload minted under the wrong family
      makes every item in the lot counterfeit.

  - name: submission_count_variance
    trigger: "POST /submissions/{id}/verify-count"
    algorithm: threshold
    formula: |
      declared = submission.declared_count
      verified = body.verified_count
      variance_pct = round_half_up(
          abs(verified - declared) * Decimal(100) / Decimal(declared), 2)

      if variance_pct > COUNT_VARIANCE_TOLERANCE_PCT:
          raise ERR_COUNT_VARIANCE_EXCEEDED       # 422, submission stays RECEIVED
      submission.count_variance_pct = variance_pct
      submission.verified_count = verified
    input_set: "The Submission being verified. declared_count is immutable input captured at intake; verified_count is the clerk's physical recount."
    constants:
      COUNT_VARIANCE_TOLERANCE_PCT: 2.00
    precision: "2 decimal places, round_half_up; the comparison is strictly greater-than, so a variance of exactly 2.00 passes"
    note: "Rounding happens BEFORE the threshold comparison. declared 63 / verified 62 gives 1.5873 -> 1.59 (passes); declared 63 / verified 61 gives 3.1746 -> 3.17 (rejected). A pinned example that only the rounding order distinguishes: declared 400 / verified 408 is exactly 2.00 and passes."

  - name: lot_sample_size
    trigger: "POST /submissions/{id}/lots — written at lot creation, before any item is captured"
    algorithm: threshold
    formula: |
      if lot.counted_qty <= SAMPLE_THRESHOLD_QTY:
          lot.sample_size       = lot.counted_qty
          lot.valuation_variant = "FULL_COUNT"
      else:
          # ceiling, computed in integers so no float ever appears
          lot.sample_size       = ceil_div(lot.counted_qty * 10, 100)
          lot.valuation_variant = "SAMPLED_EXTRAPOLATION"
    input_set: "The single SubmissionLot row being created."
    constants:
      SAMPLE_THRESHOLD_QTY: 40
      SAMPLE_RATE: 0.10
    precision: "integer ceiling; sample_size is never 0 because counted_qty >= 1"
    note: |
      The threshold is inclusive on the FULL_COUNT side: counted_qty 40 stays
      FULL_COUNT with sample_size 40, counted_qty 41 flips to
      SAMPLED_EXTRAPOLATION with sample_size 5 (ceil(4.1)). That one-coupon step
      shrinks the required item captures from 40 to 5 and at the same time changes
      which lot_gross_face_value variant runs, so the boundary is observable in
      both sample_size and gross_face_value_cents.

  - name: lot_gross_face_value
    trigger: "POST /submission-lots/{id}/finalize, and re-run on the DISPUTED -> REINSTATED cascade"
    algorithm: forward_looking
    formula: |
      face = Offer(lot.offer_id).face_value_cents

      # Base (FULL_COUNT): every physical coupon was imaged and adjudicated.
      lot.projected_accepted_units = lot.accepted_qty
      lot.gross_face_value_cents   = lot.accepted_qty * face

      where accepted_qty = sum(item.claimed_units
                               for item in items(lot)
                               if item.status in {"ACCEPTED", "REINSTATED"})
    input_set: |
      CouponItem rows whose lot_id is this lot and whose status is in
      {ACCEPTED, REINSTATED}. Items still in CAPTURED are excluded, which is why
      finalize refuses to run until captured_item_count == sample_size. All four
      REJECTED_* statuses are excluded, and a REINSTATED item re-enters the set
      at its full original claimed_units.
    constants:
      SAMPLE_RATE: 0.10
    precision: "integer cents throughout the base variant — no rounding occurs because face_value_cents and claimed_units are both integers"
    variants:
      - name: full_count
        when: "lot.valuation_variant == FULL_COUNT, i.e. counted_qty <= SAMPLE_THRESHOLD_QTY (40)"
        difference: |
          Uses the adjudicated units directly. projected_accepted_units ==
          accepted_qty and gross_face_value_cents == accepted_qty * face. No
          rate, no extrapolation, no rounding.
      - name: sampled_extrapolation
        when: "lot.valuation_variant == SAMPLED_EXTRAPOLATION, i.e. counted_qty > SAMPLE_THRESHOLD_QTY (40)"
        difference: |
          Only sample_size coupons were imaged, so the accepted units of the
          sample are scaled up to the whole physical count:

            unit_accept_rate = round_half_up(
                Decimal(lot.accepted_qty) / Decimal(lot.sample_size), 4)
            lot.projected_accepted_units = int(round_half_up(
                Decimal(lot.counted_qty) * unit_accept_rate, 0))
            lot.gross_face_value_cents = lot.projected_accepted_units * face

          The rate is rounded to 4 decimals BEFORE it is multiplied by
          counted_qty, and the product is rounded half-up to a whole unit
          BEFORE it is multiplied by face. Both rounding steps are pinned:
          rounding the rate to fewer places, or multiplying face in before
          rounding the units, produces a different cent total.

          Pinned divergence fixture: counted_qty 60, sample_size 6,
          five ACCEPTED items at claimed_units 1 and one REJECTED_MISREDEEMED
          item at claimed_units 1, face 50.
            sampled_extrapolation: rate 0.8333, projected 50, gross 2500
            full_count on the same rows: projected 5, gross 250
          Delta 2250 cents on identical stored data.
    note: |
      The denominator is sample_size, not captured_item_count and not the count
      of adjudicated items. Those three are equal at finalization by
      construction (ERR_SAMPLE_INCOMPLETE blocks the alternative), but a lot
      whose items were later reinstated still divides by the original
      sample_size, so a reinstatement raises the projection rather than
      re-basing it.

  - name: lot_handling_fee
    trigger: "POST /submission-lots/{id}/finalize, immediately after lot_gross_face_value; re-run on the DISPUTED -> REINSTATED cascade"
    algorithm: tiered_pricing
    formula: |
      units      = lot.projected_accepted_units
      policy     = Manufacturer(lot.manufacturer_id).handling_fee_policy
      multiplier = TIER_MULTIPLIER[Retailer(submission.retailer_id).handling_fee_tier]

      if policy == "CONTRACT_RATE":
          per_unit = Decimal(Offer(lot.offer_id).handling_fee_cents)
      else:  # TIERED_RATE — band selected by THIS LOT's unit count, not the submission's
          if   units <= 99:  per_unit = Decimal(TIERED_FEE_CENTS["1_99"])
          elif units <= 499: per_unit = Decimal(TIERED_FEE_CENTS["100_499"])
          else:              per_unit = Decimal(TIERED_FEE_CENTS["500_PLUS"])

      lot.handling_fee_cents = int(round_half_up(
          Decimal(units) * per_unit * multiplier, 0))

      # Submission-level total: ROUND EACH LOT FIRST, THEN SUM.
      submission.settled_handling_fee_cents = sum(
          l.handling_fee_cents
          for l in lots(submission)
          if l.status in {"VALIDATED", "REINSTATED"})
    input_set: |
      SubmissionLot rows of the submission with status in {VALIDATED,
      REINSTATED}. Lots in SORTED, LOT_REJECTED or DISPUTED contribute zero.
      The multiplier is read from the Retailer's CURRENT handling_fee_tier at
      the moment finalize runs, not the tier in force at intake.
    constants:
      TIER_MULTIPLIER:
        PREFERRED: 1.15
        STANDARD: 1.00
        PROBATION: 0.80
      TIERED_FEE_CENTS:
        "1_99": 8
        "100_499": 7
        "500_PLUS": 6
    precision: "each lot rounds half-up to whole cents independently; the submission total is a plain integer sum of already-rounded lot fees"
    note: |
      Order is load-bearing and pinned. Two lots on one submission, retailer
      tier PREFERRED (1.15), CONTRACT_RATE at 7 cents per unit:
        lot A: 50 units -> round_half_up(50 * 7 * 1.15) = round_half_up(402.5) = 403
        lot B: 13 units -> round_half_up(13 * 7 * 1.15) = round_half_up(104.65) = 105
        settled_handling_fee_cents = 403 + 105 = 508
      Summing units first and rounding once yields
      round_half_up(63 * 7 * 1.15) = round_half_up(507.15) = 507 — one cent
      short, and that cent propagates into provisional_net_cents,
      billed_total_cents and net_payable_cents. Under TIERED_RATE the divergence
      is larger still, because per-lot banding can put lot A and lot B in
      different bands while their combined unit count sits in a third.

  - name: statement_net_payable
    trigger: "POST /settlement-statements — every field below is minted in this one call, in this exact order"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — gross face value: sum of already-rounded lot gross values.
      gross = sum(l.gross_face_value_cents for l in lots(submission)
                  if l.status in {"VALIDATED", "REINSTATED"})

      # Step 2 — handling fee: sum of already-rounded lot fees (see lot_handling_fee).
      fee = sum(l.handling_fee_cents for l in lots(submission)
                if l.status in {"VALIDATED", "REINSTATED"})

      # Step 3 — prior chargeback offset: face value the clearinghouse already
      # paid this retailer on lots that a later dispute pushed back to
      # LOT_REJECTED with reject_reason DISPUTE_UPHELD, on statements already PAID.
      offset = body.prior_chargeback_offset_cents        # >= 0, caller-supplied

      # Step 4 — provisional net BEFORE holdback. This is the holdback tier input.
      provisional_net = gross + fee - offset
      if provisional_net < 0: raise ERR_INVALID_REQUEST

      # Step 5 — holdback percentage: base band on provisional_net, then a
      # risk add-on, then a hard cap. Evaluated in exactly this order.
      if   provisional_net < HOLDBACK_BAND_1_CENTS:        base = Decimal("0.00")
      elif provisional_net < HOLDBACK_BAND_2_CENTS:        base = Decimal("0.02")
      else:                                               base = Decimal("0.05")

      add_on = (Decimal(str(HOLDBACK_RISK_ADD_PCT))
                if Retailer(submission.retailer_id).misredemption_rate
                   >= MISREDEMPTION_RISK_THRESHOLD_PCT
                else Decimal("0.00"))

      holdback_pct = min(base + add_on, Decimal(str(HOLDBACK_CAP_PCT)))

      # Step 6 — holdback cents, then net payable.
      holdback = int(round_half_up(Decimal(provisional_net) * holdback_pct, 0))
      net_payable = provisional_net - holdback
    input_set: |
      SubmissionLot rows of the submission with status in {VALIDATED,
      REINSTATED}; the Retailer's current misredemption_rate; the caller-supplied
      prior_chargeback_offset_cents. Lots in LOT_REJECTED and DISPUTED are
      excluded from both sums, so a statement issued while a dispute is open
      values the disputed lot at zero.
    constants:
      HOLDBACK_BAND_1_CENTS: 100000
      HOLDBACK_BAND_2_CENTS: 1000000
      HOLDBACK_RISK_ADD_PCT: 0.03
      HOLDBACK_CAP_PCT: 0.06
      MISREDEMPTION_RISK_THRESHOLD_PCT: 5.00
    precision: "integer cents; the single rounding point is the holdback (round_half_up on provisional_net * holdback_pct). net_payable_cents is a pure integer subtraction and therefore never rounds"
    note: |
      Three orderings are pinned because each plausible alternative gives a
      different answer:
        (a) the offset is subtracted BEFORE the holdback band is selected, so a
            large chargeback can drop a statement into a lower band and thus a
            smaller holdback;
        (b) the risk add-on is applied to the band rate and only then capped,
            never capped-then-added;
        (c) the holdback is a percentage of provisional_net (gross + fee -
            offset), not of gross alone and not of gross + fee.
      Pinned fixture: gross 3150, fee 508, offset 0 -> provisional_net 3658;
      3658 < 100000 so base 0.00; retailer misredemption_rate 11.11 >= 5.00 so
      add_on 0.03; holdback_pct min(0.03, 0.06) = 0.03;
      holdback round_half_up(109.74) = 110; net_payable 3548.
      Applying the holdback to gross alone would give 95 and a net of 3563.

  - name: retailer_fraud_score
    trigger: "POST /retailers/{id}/fraud-rescore, and as a side effect of the Submission SORTED -> CLOSED transition"
    algorithm: weighted_scoring
    formula: |
      # The three component rates share one denominator: adjudicated items.
      pool = [item for item in adjudicated_items(retailer)]     # see input_set
      if not pool:
          dup = mis = cft = Decimal("0.00")                     # empty-pool fallback
      else:
          dup = round_half_up(count(pool, "REJECTED_DUPLICATE")   * 100 / len(pool), 2)
          mis = round_half_up(count(pool, "REJECTED_MISREDEEMED") * 100 / len(pool), 2)
          cft = round_half_up(count(pool, "REJECTED_COUNTERFEIT") * 100 / len(pool), 2)

      raw   = dup * DUP_WEIGHT + mis * MIS_WEIGHT + cft * CFT_WEIGHT
      score = min(Decimal("100.00"), round_half_up(raw, 2))

      retailer.duplicate_rate     = dup
      retailer.misredemption_rate = mis
      retailer.counterfeit_rate   = cft

      # Threshold ladder, evaluated highest first.
      if   score >= FRAUD_SUSPEND_THRESHOLD:   target_status = "SUSPENDED"
      elif score >= FRAUD_WATCHLIST_THRESHOLD: target_status = "WATCHLIST"
      else:                                    target_status = "ACTIVE"

      retailer.handling_fee_tier = ("PROBATION"
                                    if score >= FRAUD_WATCHLIST_THRESHOLD
                                    else retailer.base_fee_tier)
      retailer.last_rescored_at  = current_logical_clock()
    input_set: |
      CouponItems reachable as CouponItem -> SubmissionLot -> Submission where
      Submission.retailer_id == this retailer, restricted to items whose status
      is NOT CAPTURED (i.e. adjudicated). REINSTATED items count toward the
      denominator but toward none of the three numerators, so an overturned
      dispute lowers every rate. Which adjudicated items enter the pool, and
      with what weight, is exactly what the two variants disagree about.
    constants:
      DUP_WEIGHT: 1.40
      MIS_WEIGHT: 1.00
      CFT_WEIGHT: 2.00
      FRAUD_WINDOW_DAYS: 90
      FRAUD_DECAY_HALFLIFE_DAYS: 180
      FRAUD_WATCHLIST_THRESHOLD: 70.00
      FRAUD_SUSPEND_THRESHOLD: 90.00
    precision: "each component rate rounds half-up to 2 decimals BEFORE weighting; the weighted sum rounds half-up to 2 decimals again; the result is clamped to 100.00"
    variants:
      - name: rolling_window
        when: "retailer.fraud_scoring_mode == ROLLING_WINDOW; result written to fraud_score_rolling_window"
        difference: |
          Hard cut-off. Only adjudicated items with
            item.adjudicated_at >= current_logical_clock() - FRAUD_WINDOW_DAYS
          enter the pool, each with weight 1. Anything older is invisible: a
          retailer with a terrible history and a clean last 90 days scores 0.00.
          The window is half-open on the low end (>= start, i.e. an item
          adjudicated exactly FRAUD_WINDOW_DAYS ago is still inside).
      - name: lifetime_weighted
        when: "retailer.fraud_scoring_mode == LIFETIME_WEIGHTED; result written to fraud_score_lifetime_weighted"
        difference: |
          No cut-off. Every adjudicated item ever enters the pool, weighted by a
          STEP decay on whole half-life buckets:

            age_days = (clock_date - date(item.adjudicated_at)).days
            bucket   = age_days // FRAUD_DECAY_HALFLIFE_DAYS
            weight   = Decimal("0.5") ** bucket

          Both numerator and denominator use these weights, so each rate is
            round_half_up(sum(weights of matching items) * 100
                          / sum(weights of all pool items), 2)
          Decay is a step function, not exponential interpolation: an item 179
          days old carries weight 1.0 and an item 180 days old carries 0.5.

          Pinned divergence fixture (clock 2027-04-01T00:00:00Z): two items
          adjudicated 2026-08-01 (243 days old -> bucket 1 -> weight 0.5), one
          of them REJECTED_DUPLICATE; four items adjudicated 2027-04-01
          (bucket 0 -> weight 1.0), all ACCEPTED.
            rolling_window   pool = the 4 recent items, dup 0.00 -> score  0.00
            lifetime_weighted weighted dup 0.5 / weighted pool 5.0 = 10.00
                             -> raw 10.00 * 1.40 -> score 14.00
          Same stored rows, 14.00 points apart, and only the mode field decides
          which one lands in retailer.status and handling_fee_tier.
    note: |
      The weights are severity multipliers, not a convex combination: they do
      not sum to 1 and the clamp at 100.00 is the only ceiling. This makes the
      thresholds reachable — duplicate_rate 50.00 alone yields exactly 70.00,
      the WATCHLIST boundary. Both variant fields are always written on every
      rescore; fraud_scoring_mode only decides which one is copied into
      fraud_score and therefore which one drives status and tier.

  - name: duplicate_barcode_detection
    trigger: "adjudication ladder step 3, inside POST /coupon-items/{id}/adjudicate and inside the bulk ladder of POST /submission-lots/{id}/finalize"
    algorithm: chronological
    formula: |
      if candidate.serial_number is None:
          return None            # mass-print coupons carry no serial; step skipped

      pool = [it for it in ALL CouponItems
              if it.id != candidate.id
              and it.scanned_barcode == candidate.scanned_barcode
              and it.serial_number  == candidate.serial_number
              and it.status in {"ACCEPTED", "REINSTATED"}]

      if not pool:
          return None            # empty-pool fallback: candidate is the original

      pool.sort(key=lambda it: (it.adjudicated_at, it.created_at))
      return pool[0].id          # written to candidate.duplicate_of_item_id
    input_set: |
      Every CouponItem in the system, across all retailers, submissions and
      lots — duplicate redemption of a one-time-use serial is a cross-retailer
      fraud, so the pool is deliberately not scoped to the current submission.
      Only items already cleared (ACCEPTED or REINSTATED) can own a serial;
      items still CAPTURED and items already rejected never win.
    constants: {}
    precision: "exact string equality on the (scanned_barcode, serial_number) pair; no normalisation, no case folding, no whitespace trimming"
    note: |
      Ranking is adjudicated_at ASC, then created_at ASC as the precise
      fallback; id is never consulted. The winner is the earliest CLEARED
      instance, which means the outcome depends on adjudication order rather
      than capture order: capture item X then item Y but adjudicate Y first, and
      X becomes the duplicate. Because the pool is restricted to cleared items,
      reinstating a previously rejected duplicate can retroactively give a third
      instance of the same serial a different owner.

  - name: misredemption_match
    trigger: "adjudication ladder step 4, inside POST /coupon-items/{id}/adjudicate and inside the bulk ladder of POST /submission-lots/{id}/finalize"
    algorithm: chronological
    formula: |
      required_units = item.claimed_units * Offer(lot.offer_id).purchase_requirement_units

      ref_pool = [r for r in PurchaseDataRecords
                  if r.retailer_id      == submission.retailer_id
                  and r.offer_id        == lot.offer_id
                  and r.pos_transaction_ref == item.pos_transaction_ref]

      if not ref_pool:
          # empty-pool fallback: nothing shares the ref (a null ref shares it
          # with nothing at all) -> REJECTED_MISREDEEMED / NO_PURCHASE_MATCH
          return (None, "NO_PURCHASE_MATCH")

      qualifying = [r for r in ref_pool if r.qualifying_units >= required_units]

      if not qualifying:
          # the ref exists but no basket under it is big enough -> the earliest
          # ref-matched record is named on the item so the retailer can see
          # which basket fell short
          ref_pool.sort(key=lambda r: (r.transaction_date, r.created_at))
          return (ref_pool[0].id, "INSUFFICIENT_QUALIFYING_UNITS")

      qualifying.sort(key=lambda r: (r.transaction_date, r.created_at))
      return (qualifying[0].id, None)   # None -> the item clears
    input_set: |
      Immutable PurchaseDataRecord rows (common_fields: false — no version, no
      update endpoint) belonging to the submitting retailer and the lot's offer.
      A record may be matched by more than one CouponItem; the clearinghouse
      does not consume records, it only requires that a qualifying transaction
      existed.
    constants: {}
    precision: "integer comparison on qualifying_units; the check is >=, so a transaction with exactly required_units qualifies. A single qualifying record anywhere in the ref-matched set clears the item; INSUFFICIENT_QUALIFYING_UNITS is reported only when EVERY record sharing the ref falls short."
    note: |
      The required-units multiplication is the trap: a claimed_units 3 item on
      an offer requiring 2 units per coupon needs a record with
      qualifying_units >= 6, not >= 2 and not >= 3. Ranking is transaction_date
      ASC then created_at ASC; id is never consulted. Two distinct reject codes
      come out of this one rule — NO_PURCHASE_MATCH when no record shares the
      pos_transaction_ref at all, and INSUFFICIENT_QUALIFYING_UNITS when a
      record matches on ref but fails the units test.

  - name: payment_schedule_date
    trigger: "POST /settlement-statements/{id}/schedule (DRAFT -> SCHEDULED)"
    algorithm: threshold
    formula: |
      base_date = date(current_logical_clock())
      net_days  = NET_TERM_DAYS[Retailer(statement.retailer_id).payment_terms]
      d = base_date + timedelta(days=net_days)

      # Weekend roll FORWARD to the next business day.
      if   d.weekday() == 5: d = d + timedelta(days=2)   # Saturday -> Monday
      elif d.weekday() == 6: d = d + timedelta(days=1)   # Sunday   -> Monday

      statement.scheduled_pay_date = d
    input_set: "The Retailer's payment_terms at the moment schedule runs, plus the logical clock. The submission's postmark window and the statement's created_at are deliberately NOT inputs."
    constants:
      NET_TERM_DAYS:
        NET_15: 15
        NET_30: 30
        NET_45: 45
    precision: "whole calendar days in UTC; the roll is applied once, after the term addition, and never iterated"
    note: |
      Pinned: base date is the SCHEDULE date, not the statement's issue date, so
      a statement that sits in DRAFT across a clock advance schedules later.
      Pinned fixture: clock 2026-08-01, NET_30 -> 2026-08-31, a Monday, no roll.
      Contrast NET_15 from the same clock -> 2026-08-16, a Sunday, rolled to
      2026-08-17. release-payment then compares the clock's calendar date
      against scheduled_pay_date with >=, so payment on exactly the scheduled
      date is allowed and one day earlier raises ERR_PAY_DATE_NOT_REACHED.

  - name: invoice_billed_total
    trigger: "POST /manufacturer-invoices"
    algorithm: aggregation
    formula: |
      lines = [s for s in SettlementStatements
               if s.id in body.statement_ids]

      billed_face = sum(s.gross_face_value_cents   for s in lines)
      billed_fee  = sum(s.handling_fee_total_cents for s in lines)

      # Clearing fee is charged on FACE VALUE ONLY — never on the handling fee.
      billed_clearing = int(round_half_up(
          Decimal(billed_face) * Decimal(str(CLEARING_FEE_PCT)), 0))

      billed_total     = billed_face + billed_fee + billed_clearing
      funded_amount    = 0
      funding_shortfall = billed_total
    input_set: |
      SettlementStatement rows named in statement_ids, each of which must have
      status in {DRAFT, SCHEDULED}, must belong to a submission whose lots all
      point at THIS manufacturer, and must not already carry a
      manufacturer_invoice_id. Statements in HELD or PAID are not billable.
    constants:
      CLEARING_FEE_PCT: 0.015
    precision: "one rounding point: the clearing fee, round_half_up on the summed face value. Rounding per statement and then summing is explicitly wrong."
    note: |
      Pinned fixture: one statement with gross 3150 and fee 508.
        billed_clearing = round_half_up(3150 * 0.015) = round_half_up(47.25) = 47
        billed_total    = 3150 + 508 + 47 = 3705
      Charging the clearing fee on gross + fee would give
      round_half_up(3658 * 0.015) = 55 and a total of 3713.
      The rounding scope also matters: two statements with face 3150 and 3151
      bill round_half_up(6301 * 0.015) = 95 as one sum, but 47 + 47 = 94 if each
      is rounded first.

  - name: clip_expiry
    trigger: "POST /digital-clips — computed once at creation and never recomputed"
    algorithm: threshold
    formula: |
      clip_date   = date(current_logical_clock())
      by_validity = clip_date + timedelta(days=Offer(clip.offer_id).clip_validity_days)
      # A clip can never outlive the offer's redemption grace period.
      offer_last  = Offer(clip.offer_id).expiration_date
                    + timedelta(days=Offer(clip.offer_id).redemption_grace_days)
      clip.clip_expires_at = min(by_validity, offer_last)
    input_set: "The Offer's clip_validity_days, expiration_date and redemption_grace_days, plus the logical clock at clip time."
    constants: {}
    precision: "whole calendar days in UTC; the min() is taken on dates, not on datetimes"
    note: "The min() is the interesting part: clipping a nearly-expired offer yields a clip that expires far sooner than clip_validity_days would suggest, and the clip matcher's eligibility test then excludes it even though the nominal validity has not elapsed."

  - name: digital_clip_match
    trigger: "POST /digital-redemption-events"
    algorithm: chronological
    formula: |
      pool = [c for c in DigitalClips
              if c.offer_id    == event.offer_id
              and c.consumer_ref == event.consumer_ref
              and c.status     == "CLIPPED"
              and c.clipped_at <= event.redeemed_at
              and c.clip_expires_at >= date(event.redeemed_at)]

      if not pool:
          return None            # empty-pool fallback: event recorded UNMATCHED
      pool.sort(key=lambda c: (c.clip_expires_at, c.created_at))
      return pool[0].id
    input_set: |
      DigitalClip rows for the same offer and the same consumer_ref that are
      still CLIPPED. Clips already MATCHED or EXPIRED_UNUSED are excluded, so a
      consumer holding two live clips on one offer can redeem twice, but only
      twice — CLIP_CONCURRENCY_LIMIT caps how many live clips a consumer may
      hold per offer.
    constants:
      CLIP_CONCURRENCY_LIMIT: 2
    precision: "date comparison on clip_expires_at is inclusive (>=), so a clip redeemed on its expiry date still matches; the sweep inside the clock endpoint uses strict less-than, so the two rules agree exactly on the boundary day"
    note: |
      Soonest-to-expire wins (clip_expires_at ASC, created_at ASC as the precise
      fallback; id is never consulted). This is deliberately NOT first-clipped-
      first: a consumer who clips a long-validity offer and then a short-validity
      one burns the short one first. Because Offer.clip_validity_days can change
      between the two clips, capture order and expiry order genuinely differ.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
# Domain ordering rationale: this is a payments clearinghouse, so identity and
# authority come first, then referential integrity, then the anti-fraud and
# regulatory-safety checks that protect manufacturers from paying for coupons
# they never authorised, then temporal/contractual constraints, then ordinary
# constraint checks, and finally the fiscal checks (funding and pay-date), which
# are the cheapest to retry and therefore lose every conflict.

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present, non-blank, and X-User-Role is one of the six §1.7 role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints except POST /_clock/set_current_utc"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /manufacturers/... route resolves to an existing Manufacturer"
    error_id: ERR_MANUFACTURER_NOT_FOUND
    http_status: 404
    applies_to: "GET /manufacturers/{id}, POST /manufacturers/{id}/suspend"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /retailers/... route resolves to an existing Retailer"
    error_id: ERR_RETAILER_NOT_FOUND
    http_status: 404
    applies_to: "GET /retailers/{id}, POST /retailers/{id}/suspend, POST /retailers/{id}/reinstate, POST /retailers/{id}/fraud-rescore"

  - priority: 3
    category: existence
    check: "the {id} path segment of an /offers/... route resolves to an existing Offer"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /offers/{id}, POST /offers/{id}/register, POST /offers/{id}/activate, POST /offers/{id}/withdraw"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /submissions/... route resolves to an existing Submission"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "GET /submissions/{id}, GET /submissions/{id}/valuation, POST /submissions/{id}/verify-count, POST /submissions/{id}/lots"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /submission-lots/... route resolves to an existing SubmissionLot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /submission-lots/{id}, POST /submission-lots/{id}/items, POST /submission-lots/{id}/finalize"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /coupon-items/... route resolves to an existing CouponItem"
    error_id: ERR_COUPON_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "GET /coupon-items/{id}, POST /coupon-items/{id}/adjudicate"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /purchase-data-records/... route resolves to an existing PurchaseDataRecord"
    error_id: ERR_PURCHASE_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /purchase-data-records/{id}"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /settlement-statements/... route resolves to an existing SettlementStatement"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /settlement-statements/{id}, POST /settlement-statements/{id}/schedule, POST /settlement-statements/{id}/release-payment"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /manufacturer-invoices/... route resolves to an existing ManufacturerInvoice"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /manufacturer-invoices/{id}, POST /manufacturer-invoices/{id}/fund, POST /manufacturer-invoices/{id}/reverse-funding"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /disputes/... route resolves to an existing Dispute"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /disputes/{id}, POST /disputes/{id}/request-info, POST /disputes/{id}/resubmit, POST /disputes/{id}/resolve"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /digital-clips/... route resolves to an existing DigitalClip"
    error_id: ERR_CLIP_NOT_FOUND
    http_status: 404
    applies_to: "GET /digital-clips/{id}"

  - priority: 3
    category: existence
    check: "the {id} path segment of a /digital-redemption-events/... route resolves to an existing DigitalRedemptionEvent"
    error_id: ERR_REDEMPTION_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /digital-redemption-events/{id}"

  - priority: 4
    category: auth
    check: |
      For an entity-backed caller the acting X-User-ID must own the resource:
      a Retailer may only act on Submissions, SubmissionLots, CouponItems,
      PurchaseDataRecords, Disputes and DigitalRedemptionEvents whose
      retailer_id is its own id; a Manufacturer may only act on Offers and
      ManufacturerInvoices whose manufacturer_id is its own id. Opaque roles
      (IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin) are
      clearinghouse staff and are exempt.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles list includes Retailer or Manufacturer"

  - priority: 5
    category: existence
    check: "request body parses as JSON, every required field in the endpoint's §1.5 input is present and non-null, no unknown field is present, every value matches its declared type, every enum value is in range, every integer is within its declared bounds, every date parses as ISO 8601, and no field declared source: computed or source: system is supplied by the caller"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: existence
    check: "body field manufacturer_id resolves to an existing Manufacturer"
    error_id: ERR_MANUFACTURER_NOT_FOUND
    http_status: 404
    applies_to: "POST /offers, POST /submissions/{id}/lots, POST /manufacturer-invoices"

  - priority: 6
    category: existence
    check: "body field retailer_id resolves to an existing Retailer"
    error_id: ERR_RETAILER_NOT_FOUND
    http_status: 404
    applies_to: "POST /submissions, POST /purchase-data-records, POST /digital-redemption-events"

  - priority: 6
    category: existence
    check: "body field offer_id resolves to an existing Offer"
    error_id: ERR_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "POST /submissions/{id}/lots, POST /purchase-data-records, POST /digital-clips, POST /digital-redemption-events"

  - priority: 6
    category: existence
    check: "body field submission_id resolves to an existing Submission"
    error_id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /settlement-statements"

  - priority: 6
    category: existence
    check: "body field lot_id resolves to an existing SubmissionLot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /disputes"

  - priority: 6
    category: existence
    check: "every element of body array statement_ids resolves to an existing SettlementStatement, checked in array order"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /manufacturer-invoices"

  - priority: 7
    category: state
    check: "expected_submission_version equals the current Submission.version (see §1.2.1 statement-issue-stale-submission)"
    error_id: ERR_STALE_SUBMISSION_VERSION
    http_status: 412
    applies_to: "POST /settlement-statements"

  - priority: 7
    category: state
    check: "expected_retailer_version equals the current Retailer.version (see §1.2.1 fraud-rescore-stale-retailer)"
    error_id: ERR_STALE_RETAILER_VERSION
    http_status: 412
    applies_to: "POST /retailers/{id}/fraud-rescore"

  - priority: 8
    category: state
    check: |
      The target entity's current state admits the requested transition, per the
      §1.2 transition table for its own entity only. Covers every from-state
      guard: registering a non-DRAFT offer, activating a non-REGISTERED offer,
      withdrawing an already-WITHDRAWN offer, verifying the count of a
      submission that is not RECEIVED, adding lots to a submission that is not
      COUNT_VERIFIED, capturing items
      into a lot that is not SORTED, adjudicating an item that is not CAPTURED,
      finalizing a lot that is not SORTED, scheduling a statement that is not
      DRAFT, releasing a statement that is not SCHEDULED, funding an invoice
      that is neither ISSUED nor SHORT_FUNDED, reversing an invoice that is
      neither FUNDED nor SHORT_FUNDED, requesting info on a dispute that is not
      UNDER_REVIEW, resubmitting a dispute that is not INFO_REQUESTED, resolving
      a dispute that is not UNDER_REVIEW, and every attempt to move an entity
      out of any terminal state.
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST that drives a §1.2 transition"

  - priority: 9
    category: business_safety
    check: |
      Segregation of duties on the two SoD walls: the acting X-User-ID must not
      equal SubmissionLot.adjudicated_by_user_id when resolving a dispute over
      that lot, and must not equal SettlementStatement.issued_by_user_id when
      releasing payment on that statement. Note this outranks every cross-entity
      readiness check below, so an analyst who tries to resolve their own
      adjudication gets the SoD error even if the dispute is otherwise
      unresolvable.
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /disputes/{id}/resolve, POST /settlement-statements/{id}/release-payment"

  - priority: 10
    category: business_safety
    check: "the Retailer that owns the affected submission chain has status != SUSPENDED"
    error_id: ERR_RETAILER_SUSPENDED
    http_status: 403
    applies_to: "POST /submissions, POST /submissions/{id}/verify-count, POST /submissions/{id}/lots, POST /submission-lots/{id}/items, POST /submission-lots/{id}/finalize, POST /disputes, POST /digital-redemption-events"

  - priority: 11
    category: business_safety
    check: "the Manufacturer that owns the affected offer or invoice has status != SUSPENDED"
    error_id: ERR_MANUFACTURER_SUSPENDED
    http_status: 403
    applies_to: "POST /offers, POST /offers/{id}/register, POST /offers/{id}/activate, POST /submissions/{id}/lots, POST /manufacturer-invoices, POST /manufacturer-invoices/{id}/fund"

  - priority: 12
    category: business_referential
    check: "body manufacturer_id equals Offer(body.offer_id).manufacturer_id — the clerk sorted the bucket to the manufacturer that actually owns the offer"
    error_id: ERR_OFFER_MANUFACTURER_MISMATCH
    http_status: 422
    applies_to: "POST /submissions/{id}/lots"

  - priority: 13
    category: business_referential
    check: "Offer(body.offer_id).status IN {ACTIVE, EXPIRED} — a DRAFT, REGISTERED or WITHDRAWN offer is not clearable, so no lot may be sorted against it. Checked BEFORE the redemption-grace window, so a lot against a WITHDRAWN offer past grace reports the offer problem, not the date problem."
    error_id: ERR_OFFER_NOT_CLEARABLE
    http_status: 422
    applies_to: "POST /submissions/{id}/lots"

  - priority: 13
    category: business_referential
    check: "no Dispute with status IN {UNDER_REVIEW, INFO_REQUESTED} references any SubmissionLot of this statement's submission — a statement cannot be put on the payment calendar while an appeal over its money is live. Shares priority 13 with the other cross-entity readiness gates; the four rules at this priority apply to disjoint endpoint sets, so they can never conflict with one another."
    error_id: ERR_DISPUTE_OPEN
    http_status: 409
    applies_to: "POST /settlement-statements/{id}/schedule"

  - priority: 13
    category: business_referential
    check: "statement.manufacturer_invoice_id is not null AND that ManufacturerInvoice.status == FUNDED — the clearinghouse never pays a retailer out of money the manufacturer has not wired. Outranked by the priority-9 SoD wall and outranks the priority-36 pay-date check."
    error_id: ERR_INVOICE_NOT_FUNDED
    http_status: 422
    applies_to: "POST /settlement-statements/{id}/release-payment"

  - priority: 13
    category: business_referential
    check: "no SettlementStatement billed onto this invoice has status == PAID — funding cannot be clawed back once any retailer has been paid out of it"
    error_id: ERR_STATEMENT_ALREADY_PAID
    http_status: 409
    applies_to: "POST /manufacturer-invoices/{id}/reverse-funding"

  - priority: 14
    category: business_referential
    check: "every statement in statement_ids has status IN {DRAFT, SCHEDULED}, has manufacturer_invoice_id == null, and belongs to a submission whose VALIDATED/REINSTATED lots all carry manufacturer_id == the invoice's manufacturer_id"
    error_id: ERR_STATEMENT_NOT_BILLABLE
    http_status: 422
    applies_to: "POST /manufacturer-invoices"

  - priority: 15
    category: business_referential
    check: "Offer(body.offer_id).digital_enabled == true"
    error_id: ERR_OFFER_NOT_DIGITAL
    http_status: 422
    applies_to: "POST /digital-clips, POST /digital-redemption-events"

  - priority: 15
    category: business_temporal
    check: "Offer.expiration_date >= the logical clock's calendar date. An offer whose redemption date has already passed can never be opened for redemption, so activation is refused outright rather than producing an ACTIVE offer the next clock sweep would immediately expire. Disjoint endpoint set from the ERR_OFFER_NOT_DIGITAL rule at the same priority, so the ladder stays unambiguous per endpoint."
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: "POST /offers/{id}/activate"

  - priority: 16
    category: business_temporal
    check: "the requested current_utc is strictly greater than the stored logical clock — the clock never moves backward and never repeats an instant"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 17
    category: business_temporal
    check: |
      The half-open postmark window [postmark_window_start, postmark_window_end)
      of the new Submission must not overlap the window of any existing
      Submission of the same Retailer whose intake_status != CLOSED. Adjacency
      is legal: an existing window ending 2026-07-31 and a new window starting
      2026-07-31 do not overlap. The resource whose capacity is contended is the
      Retailer's intake stream, which the clearinghouse can only reconcile one
      postmark window at a time; the rule is channel-independent, so a MAIL
      window and an ELECTRONIC window of the same retailer contend exactly the
      same way.
    error_id: ERR_POSTMARK_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /submissions"

  - priority: 18
    category: business_temporal
    check: |
      The closed billing period [billing_period_start, billing_period_end] of
      the new ManufacturerInvoice must be separated from every non-REVERSED
      invoice of the same Manufacturer by at least BILLING_PERIOD_BUFFER_DAYS
      (1) clear day. Unlike the postmark rule, adjacency is REJECTED here: an
      existing period ending 2026-08-31 and a new period starting 2026-09-01
      violate the buffer, and the new period must start no earlier than
      2026-09-02.
    error_id: ERR_BILLING_PERIOD_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /manufacturer-invoices"

  - priority: 19
    category: business_temporal
    check: |
      Aggregate capacity: the number of DigitalClips for the same
      (offer_id, consumer_ref) with status == CLIPPED and clip_expires_at >= the
      clock's calendar date must be < CLIP_CONCURRENCY_LIMIT (2) before the new
      clip is created. Each existing clip is individually valid; only the
      collective count is refused. A clip that the clock sweep has already moved
      to EXPIRED_UNUSED, or one consumed into MATCHED, frees its slot.
    error_id: ERR_CLIP_CONCURRENCY_LIMIT
    http_status: 409
    applies_to: "POST /digital-clips"

  - priority: 20
    category: business_temporal
    check: |
      The lot's offer must still be inside its redemption window at sort time:
      the clock's calendar date must be <= Offer.expiration_date +
      Offer.redemption_grace_days. The comparison is inclusive on the last grace
      day, so a lot sorted exactly on expiration_date + redemption_grace_days is
      accepted and one day later is refused.
    error_id: ERR_SUBMISSION_PAST_GRACE
    http_status: 422
    applies_to: "POST /submissions/{id}/lots"

  - priority: 21
    category: business_temporal
    check: "the clock's calendar date must be <= SubmissionLot.adjudicated_at date + Manufacturer(lot.manufacturer_id).dispute_window_days; inclusive on the last day"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /disputes"

  - priority: 22
    category: business_constraint
    check: "offer_code is unique per manufacturer (case-sensitive exact match across every Offer of that manufacturer, including WITHDRAWN ones)"
    error_id: ERR_DUPLICATE_OFFER_CODE
    http_status: 409
    applies_to: "POST /offers"

  - priority: 22
    category: business_constraint
    check: "gs1_company_prefix is globally unique across all Manufacturers — two issuers sharing a prefix would mint colliding barcode payloads"
    error_id: ERR_DUPLICATE_GS1_PREFIX
    http_status: 409
    applies_to: "POST /manufacturers"

  - priority: 23
    category: business_constraint
    check: "body channel is permitted by Retailer.channel_capability: MAIL requires MAIL_ONLY or BOTH; ELECTRONIC requires ELECTRONIC_ONLY or BOTH"
    error_id: ERR_CHANNEL_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /submissions"

  - priority: 24
    category: business_constraint
    check: "the submission named by body.submission_id has at least one SubmissionLot with status IN {VALIDATED, REINSTATED} — a submission whose every lot was rejected has nothing to settle and cannot be turned into a statement"
    error_id: ERR_EMPTY_SUBMISSION
    http_status: 422
    applies_to: "POST /settlement-statements"

  - priority: 25
    category: business_constraint
    check: "count_variance_pct computed by submission_count_variance must not exceed COUNT_VARIANCE_TOLERANCE_PCT (2.00); strictly greater fails"
    error_id: ERR_COUNT_VARIANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /submissions/{id}/verify-count"

  - priority: 26
    category: business_constraint
    check: "the running sum of counted_qty across the submission's existing lots plus the new lot's counted_qty must not exceed Submission.verified_count"
    error_id: ERR_LOT_COUNT_OVERFLOW
    http_status: 422
    applies_to: "POST /submissions/{id}/lots"

  - priority: 27
    category: business_constraint
    check: "every element of the items array carries a non-blank image_uri — image capture is mandatory for validation against offer terms"
    error_id: ERR_IMAGE_REQUIRED
    http_status: 422
    applies_to: "POST /submission-lots/{id}/items"

  - priority: 28
    category: business_constraint
    check: "every element of the items array carries a non-blank pos_transaction_ref when the lot's submission channel is ELECTRONIC; MAIL submissions may omit it, in which case misredemption_match finds no record and the item is rejected NO_PURCHASE_MATCH rather than refused at intake"
    error_id: ERR_POS_REF_REQUIRED
    http_status: 422
    applies_to: "POST /submission-lots/{id}/items"

  - priority: 29
    category: business_constraint
    check: "captured_item_count + len(body.items) must not exceed lot.sample_size — the bulk capture is refused as a whole, never partially applied"
    error_id: ERR_LOT_CAPTURE_COMPLETE
    http_status: 409
    applies_to: "POST /submission-lots/{id}/items"

  - priority: 30
    category: business_constraint
    check: "lot.captured_item_count == lot.sample_size — a lot cannot be finalized until the full sample has been imaged"
    error_id: ERR_SAMPLE_INCOMPLETE
    http_status: 422
    applies_to: "POST /submission-lots/{id}/finalize"

  - priority: 31
    category: business_constraint
    check: "dispute.info_request_count < MAX_INFO_ROUNDS (2) — the third information request on one dispute is refused, terminating the negotiation cycle"
    error_id: ERR_INFO_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /disputes/{id}/request-info"

  - priority: 32
    category: business_constraint
    check: "statement_ids is a non-empty array with no repeated element"
    error_id: ERR_STATEMENT_LINES_EMPTY
    http_status: 422
    applies_to: "POST /manufacturer-invoices"

  - priority: 33
    category: business_constraint
    check: "Offer.accepted_redemption_count plus the units this operation would clear must not exceed Offer.max_redemptions; the units are the lot's projected_accepted_units at finalize and 1 at digital redemption"
    error_id: ERR_MAX_REDEMPTIONS_EXCEEDED
    http_status: 422
    applies_to: "POST /submission-lots/{id}/finalize, POST /digital-redemption-events"

  - priority: 34
    category: business_fiscal
    check: "invoice.funded_amount_cents + body.amount_cents must not exceed invoice.billed_total_cents — a manufacturer cannot overfund an invoice. Loses to the priority-8 state check, so funding a RECONCILED invoice with an overfunding amount returns ERR_INVALID_STATE_TRANSITION."
    error_id: ERR_FUNDING_EXCEEDS_BILLED
    http_status: 422
    applies_to: "POST /manufacturer-invoices/{id}/fund"

  - priority: 35
    category: business_fiscal
    check: "the clock's calendar date must be >= statement.scheduled_pay_date; payment on exactly the scheduled date is allowed"
    error_id: ERR_PAY_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /settlement-statements/{id}/release-payment"

# ---------------------------------------------------------------------------
# 1.5 API Endpoints
# ---------------------------------------------------------------------------

endpoints:

  # --- Manufacturer ------------------------------------------------------
  - method: POST
    path: "/manufacturers"
    description: "Onboard a coupon issuer. gs1_company_prefix must be exactly 6 digits and unique across all manufacturers."
    roles: [ClearinghouseAdmin]
    code: 201
    input: ["legal_name", "gs1_company_prefix", "handling_fee_policy?", "dispute_window_days?"]
    output: Manufacturer
    side_effects:
      - "creates the Manufacturer in status ACTIVE with funded_total_cents, disbursed_total_cents and funding_balance_cents all 0"

  - method: GET
    path: "/manufacturers/{id}"
    description: "Read one manufacturer including its live funding ledger."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: Manufacturer
    side_effects: []

  - method: GET
    path: "/manufacturers"
    description: "List manufacturers, newest first by created_at DESC."
    roles: [SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Manufacturer[]
    side_effects: []

  - method: POST
    path: "/manufacturers/{id}/suspend"
    description: "Terminally suspend an issuer. Blocks new offers, offer registration/activation, new lots against its offers, new invoices and further funding."
    roles: [ClearinghouseAdmin]
    code: 200
    input: [reason]
    output: Manufacturer
    side_effects:
      - "Manufacturer ACTIVE -> SUSPENDED (terminal)"
      - "cascade: every Offer of this manufacturer with status IN {DRAFT, REGISTERED, ACTIVE} moves to WITHDRAWN with withdrawn_reason MANUFACTURER_SUSPENDED, processed in Offer.created_at ASC, each running the full offer-withdrawal cascade"

  # --- Retailer ----------------------------------------------------------
  - method: POST
    path: "/retailers"
    description: "Onboard a submitting retailer."
    roles: [ClearinghouseAdmin]
    code: 201
    input: ["legal_name", "channel_capability?", "payment_terms?", "base_fee_tier?", "fraud_scoring_mode?"]
    output: Retailer
    side_effects:
      - "creates the Retailer in status ACTIVE with handling_fee_tier initialised from base_fee_tier, all three fraud scores 0.00 and all three rates 0.00"

  - method: GET
    path: "/retailers/{id}"
    description: "Read one retailer including both fraud-score variant fields and the selected fraud_score."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  - method: GET
    path: "/retailers"
    description: "List retailers, newest first by created_at DESC."
    roles: [FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["status?", "handling_fee_tier?", "limit?", "offset?"]
    output: Retailer[]
    side_effects: []

  - method: POST
    path: "/retailers/{id}/suspend"
    description: "Suspend a retailer for fraud. Blocks intake, capture, finalization, dispute filing and digital redemption."
    roles: [ClearinghouseAdmin]
    code: 200
    input: [reason]
    output: Retailer
    side_effects:
      - "Retailer {ACTIVE, WATCHLIST} -> SUSPENDED"
      - "forces handling_fee_tier = PROBATION"

  - method: POST
    path: "/retailers/{id}/reinstate"
    description: "Lift a suspension. The retailer returns to ACTIVE regardless of its current fraud_score; the very next rescore may push it straight back to WATCHLIST or SUSPENDED."
    roles: [ClearinghouseAdmin]
    code: 200
    input: [reason]
    output: Retailer
    side_effects:
      - "Retailer SUSPENDED -> ACTIVE"
      - "restores handling_fee_tier = base_fee_tier"

  - method: POST
    path: "/retailers/{id}/fraud-rescore"
    description: "Re-run retailer_fraud_score against the current logical clock. Optimistically concurrent on Retailer.version."
    roles: [FraudAnalyst]
    code: 200
    input: [expected_retailer_version]
    output: Retailer
    side_effects:
      - "runs calculation retailer_fraud_score, writing duplicate_rate, misredemption_rate, counterfeit_rate, both variant fields, fraud_score and last_rescored_at"
      - "may drive Retailer ACTIVE -> WATCHLIST, WATCHLIST -> ACTIVE, or {ACTIVE, WATCHLIST} -> SUSPENDED per the threshold ladder"
      - "sets handling_fee_tier to PROBATION at or above FRAUD_WATCHLIST_THRESHOLD, otherwise back to base_fee_tier"
      - "increments Retailer.version by 1"

  # --- Offer -------------------------------------------------------------
  - method: POST
    path: "/offers"
    description: "Register a coupon design in DRAFT. offer_code is unique per manufacturer."
    roles: [Manufacturer, ClearinghouseAdmin]
    code: 201
    input: ["manufacturer_id", "offer_code", "face_value_cents", "handling_fee_cents", "expiration_date", "redemption_instructions", "barcode_family", "max_redemptions", "purchase_requirement_units?", "redemption_grace_days?", "digital_enabled?", "clip_validity_days?"]
    output: Offer
    side_effects:
      - "creates the Offer in status DRAFT with barcode_payload null and accepted_redemption_count 0"

  - method: GET
    path: "/offers/{id}"
    description: "Read one offer including its minted barcode_payload and live accepted_redemption_count."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers filtered by issuer, status or digital eligibility. Reverse-reachability channel for Offer.manufacturer_id."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["manufacturer_id?", "status?", "digital_enabled?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/offers/{id}/register"
    description: "Mint the barcode. Encodes offer terms, expiration and redemption instructions into barcode_payload per the offer's barcode_family."
    roles: [Manufacturer, ClearinghouseAdmin]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Offer DRAFT -> REGISTERED"
      - "runs calculation offer_barcode_payload and writes Offer.barcode_payload"

  - method: POST
    path: "/offers/{id}/activate"
    description: "Open the offer for redemption clearing. Only ACTIVE and EXPIRED offers may receive submission lots."
    roles: [ClearinghouseAdmin]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "Offer REGISTERED -> ACTIVE"

  - method: POST
    path: "/offers/{id}/withdraw"
    description: "Pull an offer. Every still-open lot against it is rejected and the money rolls back through submission, statement and retailer."
    roles: [Manufacturer, ClearinghouseAdmin]
    code: 200
    input: [withdrawn_reason]
    output: Offer
    side_effects:
      - "Offer {REGISTERED, ACTIVE, EXPIRED} -> WITHDRAWN"
      - "cascade hop 1: every SubmissionLot on this offer with status IN {SORTED, VALIDATED} moves to LOT_REJECTED with reject_reason OFFER_WITHDRAWN, in SubmissionLot.created_at ASC order, zeroing its gross_face_value_cents and handling_fee_cents"
      - "cascade hop 2: each affected Submission recomputes settled_gross_face_value_cents and settled_handling_fee_cents, and may reach intake_status CLOSED if every lot is now terminal"
      - "cascade hop 3: every SettlementStatement in DRAFT or SCHEDULED over an affected submission is recomputed, and each affected Retailer.unpaid_balance_cents is recomputed"

  # --- Submission --------------------------------------------------------
  - method: POST
    path: "/submissions"
    description: "Open a retailer submission through the mail or electronic channel. The half-open postmark window may not overlap another open submission of the same retailer."
    roles: [Retailer, IntakeClerk]
    code: 201
    input: [retailer_id, channel, declared_count, postmark_window_start, postmark_window_end]
    output: Submission
    side_effects:
      - "creates the Submission with intake_status RECEIVED and settlement_status PENDING, verified_count 0, count_variance_pct 0.00, hold_reason null and every money field 0"

  - method: GET
    path: "/submissions/{id}"
    description: "Read one submission with both of its state dimensions and all five money fields."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: GET
    path: "/submissions"
    description: "List submissions filtered by retailer or by either state dimension. Reverse-reachability channel for Submission.retailer_id."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["retailer_id?", "intake_status?", "settlement_status?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []

  - method: GET
    path: "/submissions/{id}/valuation"
    description: "Computed read. Recomputes this submission's face value BOTH ways from the same stored rows — once forcing every lot through the full_count variant of lot_gross_face_value and once forcing every lot through sampled_extrapolation — and returns the per-variant totals side by side with the variant each lot actually resolved to. Reads only; writes nothing."
    roles: [FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: "{ submission_id, valuation_method, full_count_gross_face_value_cents, sampled_gross_face_value_cents, settled_gross_face_value_cents, settled_handling_fee_cents, lot_count }"
    side_effects: []

  - method: POST
    path: "/submissions/{id}/verify-count"
    description: "Physical or electronic recount at intake. Rejects the recount outright when the variance against declared_count exceeds tolerance."
    roles: [IntakeClerk]
    code: 200
    input: [verified_count]
    output: Submission
    side_effects:
      - "runs calculation submission_count_variance, writing verified_count and count_variance_pct"
      - "Submission intake_status RECEIVED -> COUNT_VERIFIED"

  - method: POST
    path: "/submissions/{id}/lots"
    description: "Sort a verified submission into one manufacturer/offer bucket. Nested creation; computes the required image-capture sample size."
    roles: [IntakeClerk]
    code: 201
    input: [offer_id, manufacturer_id, counted_qty]
    output: SubmissionLot
    side_effects:
      - "creates the SubmissionLot in status SORTED"
      - "runs calculation lot_sample_size, writing sample_size and valuation_variant"
      - "increments Submission.sorted_lot_count and recomputes Submission.declared_face_value_cents; once the running sum of counted_qty over the submission's lots equals Submission.verified_count, moves Submission intake_status COUNT_VERIFIED -> SORTED, which closes the submission to further lots"

  # --- SubmissionLot -----------------------------------------------------
  - method: GET
    path: "/submission-lots/{id}"
    description: "Read one sort bucket with its resolved valuation variant, projected units and rounded handling fee."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: SubmissionLot
    side_effects: []

  - method: GET
    path: "/submission-lots"
    description: "List sort buckets. Reverse-reachability channel for SubmissionLot.submission_id, SubmissionLot.offer_id and SubmissionLot.manufacturer_id."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["submission_id?", "offer_id?", "manufacturer_id?", "status?", "limit?", "offset?"]
    output: SubmissionLot[]
    side_effects: []

  - method: POST
    path: "/submission-lots/{id}/items"
    description: "Bulk image capture. Accepts an array of coupon images in one call and creates one CouponItem per element in array order, all in status CAPTURED. Each element of `items` is an object with the keys { scanned_barcode, serial_number?, image_uri, redeemed_at, pos_transaction_ref?, claimed_units? } matching the CouponItem input fields of §1.1; lot_id comes from the path. Refused as a whole — never partially applied — if any element is invalid or if the batch would exceed sample_size."
    roles: [IntakeClerk]
    code: 201
    input: [items]
    output: CouponItem[]
    side_effects:
      - "creates len(items) CouponItem rows in status CAPTURED, in the order supplied; element k receives created_at = the logical clock plus k milliseconds, so CouponItem.created_at ASC is exactly the supplied array order and the adjudication ladder's processing order is fully determined by the request body"
      - "increments SubmissionLot.captured_item_count by len(items)"

  - method: POST
    path: "/submission-lots/{id}/finalize"
    description: "Validate the lot against offer terms. Runs the five-step adjudication ladder over every CAPTURED item in CouponItem.created_at ASC order, then values the lot through the variant lot_sample_size selected."
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: SubmissionLot
    side_effects:
      - "bulk adjudication: each CAPTURED item of the lot is driven out of CAPTURED by the pinned ladder (counterfeit, then expired, then duplicate, then misredemption, then accept), in CouponItem.created_at ASC order"
      - "runs calculation lot_gross_face_value and then lot_handling_fee, writing projected_accepted_units, gross_face_value_cents and handling_fee_cents"
      - "SubmissionLot SORTED -> VALIDATED when at least one item cleared, otherwise SORTED -> LOT_REJECTED with reject_reason ALL_ITEMS_REJECTED"
      - "sets adjudicated_by_user_id to the acting X-User-ID and adjudicated_at to the logical clock — this is the SoD wall for dispute resolution"
      - "increments Offer.accepted_redemption_count by projected_accepted_units"
      - "recomputes the Submission's adjudicated / accepted / rejected item face-value fields and its settled_gross_face_value_cents and settled_handling_fee_cents"
      - "when every lot of the submission is terminal, moves Submission intake_status SORTED -> CLOSED and re-runs retailer_fraud_score; if every lot ended in LOT_REJECTED it also increments Retailer.rejected_submission_count and moves Submission settlement_status PENDING -> HELD"

  # --- CouponItem --------------------------------------------------------
  - method: GET
    path: "/coupon-items/{id}"
    description: "Read one captured coupon with its reject_code, duplicate owner and matched purchase record."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: CouponItem
    side_effects: []

  - method: GET
    path: "/coupon-items"
    description: "List captured coupons. Reverse-reachability channel for CouponItem.lot_id, the self-referential CouponItem.duplicate_of_item_id and CouponItem.matched_purchase_record_id."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["lot_id?", "status?", "reject_code?", "duplicate_of_item_id?", "matched_purchase_record_id?", "limit?", "offset?"]
    output: CouponItem[]
    side_effects: []

  - method: POST
    path: "/coupon-items/{id}/adjudicate"
    description: "Adjudicate one captured coupon individually, ahead of lot finalization. Applies exactly the same five-step ladder finalize applies, so an analyst can pin a specific outcome before the bulk pass runs."
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: CouponItem
    side_effects:
      - "drives the item out of CAPTURED per the pinned ladder, writing status, reject_code, and where applicable duplicate_of_item_id or matched_purchase_record_id, plus adjudicated_at"
      - "recomputes the owning lot's accepted_qty and rejected_qty"
      - "recomputes the owning Submission's adjudicated / accepted / rejected item face-value fields"

  # --- PurchaseDataRecord ------------------------------------------------
  - method: POST
    path: "/purchase-data-records"
    description: "Ingest one point-of-sale basket for misredemption matching. Immutable — there is no update or delete endpoint and the entity carries no version field."
    roles: [Retailer, IntakeClerk]
    code: 201
    input: [retailer_id, offer_id, pos_transaction_ref, transaction_date, qualifying_units]
    output: PurchaseDataRecord
    side_effects:
      - "creates the immutable PurchaseDataRecord; no other entity changes"

  - method: GET
    path: "/purchase-data-records/{id}"
    description: "Read one point-of-sale basket."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: PurchaseDataRecord
    side_effects: []

  - method: GET
    path: "/purchase-data-records"
    description: "List point-of-sale baskets. Reverse-reachability channel for PurchaseDataRecord.retailer_id and PurchaseDataRecord.offer_id."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["retailer_id?", "offer_id?", "pos_transaction_ref?", "limit?", "offset?"]
    output: PurchaseDataRecord[]
    side_effects: []

  # --- SettlementStatement -----------------------------------------------
  - method: POST
    path: "/settlement-statements"
    description: "Issue a retailer settlement statement over a closed submission. Mints every money field in one pass via statement_net_payable. Optimistically concurrent on Submission.version."
    roles: [SettlementOfficer]
    code: 201
    input: ["submission_id", "expected_submission_version", "prior_chargeback_offset_cents?"]
    output: SettlementStatement
    side_effects:
      - "runs calculation statement_net_payable, writing gross_face_value_cents, handling_fee_total_cents, prior_chargeback_offset_cents, provisional_net_cents, holdback_pct, misredemption_holdback_cents and net_payable_cents"
      - "creates the SettlementStatement in status DRAFT with retailer_id copied from the submission and issued_by_user_id set to the acting X-User-ID — this is the SoD wall for payment release"
      - "increments Submission.version by 1"

  - method: GET
    path: "/settlement-statements/{id}"
    description: "Read one settlement statement with its holdback breakdown and scheduled pay date."
    roles: [Manufacturer, Retailer, SettlementOfficer, FraudAnalyst, ClearinghouseAdmin]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []

  - method: GET
    path: "/settlement-statements"
    description: "List settlement statements. Reverse-reachability channel for SettlementStatement.submission_id, SettlementStatement.retailer_id and SettlementStatement.manufacturer_invoice_id."
    roles: [Manufacturer, Retailer, SettlementOfficer, FraudAnalyst, ClearinghouseAdmin]
    code: 200
    input: ["submission_id?", "retailer_id?", "manufacturer_invoice_id?", "status?", "limit?", "offset?"]
    output: SettlementStatement[]
    side_effects: []

  - method: POST
    path: "/settlement-statements/{id}/schedule"
    description: "Put the statement on the payment calendar. Refused while any dispute over the submission's lots is still open."
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "runs calculation payment_schedule_date, writing scheduled_pay_date"
      - "SettlementStatement DRAFT -> SCHEDULED"
      - "Submission settlement_status PENDING -> STATEMENT_ISSUED"
      - "increments Retailer.unpaid_balance_cents by net_payable_cents"

  - method: POST
    path: "/settlement-statements/{id}/release-payment"
    description: "Pay the retailer. Gated on the manufacturer invoice being FUNDED, on the scheduled date having arrived, and on segregation of duties against the issuing officer."
    roles: [SettlementOfficer]
    code: 200
    input: []
    output: SettlementStatement
    side_effects:
      - "SettlementStatement SCHEDULED -> PAID, setting released_by_user_id to the acting X-User-ID"
      - "Submission settlement_status STATEMENT_ISSUED -> PAID"
      - "increments Manufacturer.disbursed_total_cents by net_payable_cents and recomputes funding_balance_cents"
      - "decrements Retailer.unpaid_balance_cents by net_payable_cents"
      - "bubble up: ManufacturerInvoice FUNDED -> RECONCILED once every statement on the invoice is PAID"

  # --- ManufacturerInvoice ------------------------------------------------
  - method: POST
    path: "/manufacturer-invoices"
    description: "Bill a batch of retailer statements onto one manufacturer for a closed billing period. Billing periods of the same manufacturer must be separated by a clear buffer day."
    roles: [SettlementOfficer]
    code: 201
    input: [manufacturer_id, billing_period_start, billing_period_end, statement_ids]
    output: ManufacturerInvoice
    side_effects:
      - "runs calculation invoice_billed_total, writing billed_face_value_cents, billed_handling_fee_cents, billed_clearing_fee_cents, billed_total_cents, funded_amount_cents 0 and funding_shortfall_cents equal to billed_total_cents"
      - "creates the ManufacturerInvoice in status ISSUED"
      - "sets manufacturer_invoice_id on each named SettlementStatement"

  - method: GET
    path: "/manufacturer-invoices/{id}"
    description: "Read one manufacturer invoice with its funding position."
    roles: [Manufacturer, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: ManufacturerInvoice
    side_effects: []

  - method: GET
    path: "/manufacturer-invoices"
    description: "List manufacturer invoices. Reverse-reachability channel for ManufacturerInvoice.manufacturer_id."
    roles: [Manufacturer, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["manufacturer_id?", "status?", "limit?", "offset?"]
    output: ManufacturerInvoice[]
    side_effects: []

  - method: POST
    path: "/manufacturer-invoices/{id}/fund"
    description: "Wire funding against an invoice. A short payment forks the invoice into SHORT_FUNDED and holds every scheduled statement on it; a full payment forks it into FUNDED and holds nothing."
    roles: [Manufacturer]
    code: 200
    input: [amount_cents]
    output: ManufacturerInvoice
    side_effects:
      - "increases funded_amount_cents and recomputes funding_shortfall_cents"
      - "ManufacturerInvoice {ISSUED, SHORT_FUNDED} -> FUNDED when fully funded, otherwise ISSUED -> SHORT_FUNDED"
      - "increments Manufacturer.funded_total_cents and recomputes funding_balance_cents"
      - "on the SHORT_FUNDED branch, a three-hop cascade holds every SCHEDULED statement of the invoice, holds each of their Submissions, and recomputes each affected Retailer.unpaid_balance_cents"
      - "on the SHORT_FUNDED -> FUNDED completion, the same three hops run in reverse, releasing the holds"

  - method: POST
    path: "/manufacturer-invoices/{id}/reverse-funding"
    description: "Compensating action. Claws back everything fund credited, restoring the manufacturer's funding ledger to its exact pre-funding values. Refused once any statement on the invoice has been paid."
    roles: [ClearinghouseAdmin]
    code: 200
    input: [reason]
    output: ManufacturerInvoice
    side_effects:
      - "decrements Manufacturer.funded_total_cents by the invoice's funded_amount_cents and recomputes funding_balance_cents"
      - "zeroes funded_amount_cents and restores funding_shortfall_cents to billed_total_cents"
      - "ManufacturerInvoice {FUNDED, SHORT_FUNDED} -> REVERSED (terminal)"
      - "holds every SCHEDULED statement of the invoice and each of their Submissions, and recomputes each affected Retailer.unpaid_balance_cents"

  # --- Dispute ------------------------------------------------------------
  - method: POST
    path: "/disputes"
    description: "Retailer appeals a rejected lot. Must be filed inside the issuing manufacturer's dispute window measured from the lot's adjudication."
    roles: [Retailer]
    code: 201
    input: [lot_id, reason_code, narrative]
    output: Dispute
    side_effects:
      - "creates the Dispute in status UNDER_REVIEW with info_request_count 0, retailer_id copied from the lot's submission, claimed_face_value_cents copied from the lot's rejected face value and filed_at from the logical clock"
      - "SubmissionLot LOT_REJECTED -> DISPUTED"
      - "cross-entity: any SettlementStatement over the lot's submission in DRAFT or SCHEDULED moves to HELD with hold_reason DISPUTE_OPEN"

  - method: GET
    path: "/disputes/{id}"
    description: "Read one dispute with its information-request count and resolution."
    roles: [Manufacturer, Retailer, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes. Reverse-reachability channel for Dispute.lot_id and Dispute.retailer_id."
    roles: [Manufacturer, Retailer, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: ["lot_id?", "retailer_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: POST
    path: "/disputes/{id}/request-info"
    description: "Analyst asks the retailer for more evidence. Capped at MAX_INFO_ROUNDS requests per dispute, which terminates the negotiation loop."
    roles: [FraudAnalyst]
    code: 200
    input: [info_request_note]
    output: Dispute
    side_effects:
      - "increments info_request_count by 1"
      - "Dispute UNDER_REVIEW -> INFO_REQUESTED"

  - method: POST
    path: "/disputes/{id}/resubmit"
    description: "Retailer supplies the requested evidence, returning the dispute to review and closing one turn of the loop."
    roles: [Retailer]
    code: 200
    input: [narrative]
    output: Dispute
    side_effects:
      - "appends to narrative"
      - "Dispute INFO_REQUESTED -> UNDER_REVIEW"

  - method: POST
    path: "/disputes/{id}/resolve"
    description: "Analyst decides the appeal. UPHELD leaves the lot rejected; OVERTURNED reinstates the lot and every rejected item in it, restoring the exact face value the rejection removed."
    roles: [FraudAnalyst]
    code: 200
    input: [outcome, resolution_note]
    output: Dispute
    side_effects:
      - "Dispute UNDER_REVIEW -> UPHELD or UNDER_REVIEW -> OVERTURNED, writing resolved_by_user_id"
      - "on UPHELD: SubmissionLot DISPUTED -> LOT_REJECTED with reject_reason DISPUTE_UPHELD"
      - "on OVERTURNED: SubmissionLot DISPUTED -> REINSTATED, every REJECTED_* CouponItem in the lot moves to REINSTATED, lot_gross_face_value and lot_handling_fee re-run, Offer.accepted_redemption_count advances, and the Submission's face-value fields are recomputed to exactly their pre-rejection values"

  # --- Digital clearing ---------------------------------------------------
  - method: POST
    path: "/digital-clips"
    description: "Consumer clips a digital offer. A consumer may hold at most CLIP_CONCURRENCY_LIMIT live clips per offer."
    roles: [Retailer, ClearinghouseAdmin]
    code: 201
    input: [offer_id, consumer_ref]
    output: DigitalClip
    side_effects:
      - "creates the DigitalClip in status CLIPPED with clipped_at from the logical clock"
      - "runs calculation clip_expiry, writing clip_expires_at"

  - method: GET
    path: "/digital-clips/{id}"
    description: "Read one digital clip with its expiry and the event that consumed it."
    roles: [Manufacturer, Retailer, FraudAnalyst, ClearinghouseAdmin]
    code: 200
    input: []
    output: DigitalClip
    side_effects: []

  - method: GET
    path: "/digital-clips"
    description: "List digital clips. Reverse-reachability channel for DigitalClip.offer_id and DigitalClip.matched_event_id."
    roles: [Manufacturer, Retailer, FraudAnalyst, ClearinghouseAdmin]
    code: 200
    input: ["offer_id?", "consumer_ref?", "status?", "matched_event_id?", "limit?", "offset?"]
    output: DigitalClip[]
    side_effects: []

  - method: POST
    path: "/digital-redemption-events"
    description: "Retailer reports a digital redemption at the register. The clip matcher runs at ingest: a winner makes the event MATCHED, an empty candidate set records it UNMATCHED with reject_code NO_ELIGIBLE_CLIP rather than raising an error."
    roles: [Retailer]
    code: 201
    input: [offer_id, retailer_id, consumer_ref]
    output: DigitalRedemptionEvent
    side_effects:
      - "runs calculation digital_clip_match over the consumer's live clips on this offer"
      - "creates the DigitalRedemptionEvent MATCHED with matched_clip_id set, or UNMATCHED with reject_code NO_ELIGIBLE_CLIP"
      - "on a match: DigitalClip CLIPPED -> MATCHED with matched_event_id set, and Offer.accepted_redemption_count increments by 1"

  - method: GET
    path: "/digital-redemption-events/{id}"
    description: "Read one digital redemption event with its matched clip or reject code."
    roles: [Manufacturer, Retailer, FraudAnalyst, ClearinghouseAdmin]
    code: 200
    input: []
    output: DigitalRedemptionEvent
    side_effects: []

  - method: GET
    path: "/digital-redemption-events"
    description: "List digital redemption events. Reverse-reachability channel for DigitalRedemptionEvent.offer_id, DigitalRedemptionEvent.retailer_id and DigitalRedemptionEvent.matched_clip_id."
    roles: [Manufacturer, Retailer, FraudAnalyst, ClearinghouseAdmin]
    code: 200
    input: ["offer_id?", "retailer_id?", "consumer_ref?", "status?", "matched_clip_id?", "limit?", "offset?"]
    output: DigitalRedemptionEvent[]
    side_effects: []

  # --- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the clock MUST NOT fall back to real wall-clock time before the first call. Advancing the clock runs three deterministic sweeps in this order: offer expiry, digital-clip expiry, dispute SLA withdrawal. The clock is strictly monotonic — a value less than or equal to the stored instant is refused."
    roles: [Manufacturer, Retailer, IntakeClerk, FraudAnalyst, SettlementOfficer, ClearinghouseAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc, expired_offer_count, expired_clip_count, withdrawn_dispute_count }"
    side_effects:
      - "sweep 1: every Offer with status ACTIVE whose expiration_date < the new calendar date moves ACTIVE -> EXPIRED, in Offer.created_at ASC order; expired_offer_count reports how many"
      - "sweep 2: every DigitalClip with status CLIPPED whose clip_expires_at < the new calendar date moves CLIPPED -> EXPIRED_UNUSED, in DigitalClip.created_at ASC order; expired_clip_count reports how many"
      - "sweep 3: every Dispute in UNDER_REVIEW or INFO_REQUESTED whose filed_at date + DISPUTE_SLA_DAYS < the new calendar date moves to WITHDRAWN and returns its lot to LOT_REJECTED, in Dispute.created_at ASC order; withdrawn_dispute_count reports how many"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
# 51 codes; every one is triggerable by at least one §1.5 endpoint and every one
# appears as the error_id of at least one §1.4 validation row.

errors:
  # --- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, blank, or X-User-Role not one of the six §1.7 role names"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is a valid role but is not in the target endpoint's roles list"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed caller (Retailer or Manufacturer) acts on a resource whose retailer_id / manufacturer_id is not the acting X-User-ID"

  # --- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed JSON, missing required field, unknown field, wrong type, out-of-range enum or integer, unparseable date, or a caller-supplied value for a computed/system field"

  # --- existence ----------------------------------------------------------
  - id: ERR_MANUFACTURER_NOT_FOUND
    http: 404
    condition: "path {id} or body manufacturer_id does not resolve to a Manufacturer"
  - id: ERR_RETAILER_NOT_FOUND
    http: 404
    condition: "path {id} or body retailer_id does not resolve to a Retailer"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "path {id} or body offer_id does not resolve to an Offer"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "path {id} or body submission_id does not resolve to a Submission"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "path {id} or body lot_id does not resolve to a SubmissionLot"
  - id: ERR_COUPON_ITEM_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a CouponItem"
  - id: ERR_PURCHASE_RECORD_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a PurchaseDataRecord"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "path {id} or an element of body statement_ids does not resolve to a SettlementStatement"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a ManufacturerInvoice"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a Dispute"
  - id: ERR_CLIP_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a DigitalClip"
  - id: ERR_REDEMPTION_EVENT_NOT_FOUND
    http: 404
    condition: "path {id} does not resolve to a DigitalRedemptionEvent"

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_SUBMISSION_VERSION
    http: 412
    condition: "expected_submission_version on POST /settlement-statements does not equal the current Submission.version"
  - id: ERR_STALE_RETAILER_VERSION
    http: 412
    condition: "expected_retailer_version on POST /retailers/{id}/fraud-rescore does not equal the current Retailer.version"

  # --- own-entity state --------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target entity's current state does not admit the requested transition, including every attempt to leave a terminal state and every repeat of an already-applied trigger"

  # --- safety / compliance ----------------------------------------------
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "the acting X-User-ID equals SubmissionLot.adjudicated_by_user_id when resolving that lot's dispute, or equals SettlementStatement.issued_by_user_id when releasing that statement's payment"
  - id: ERR_RETAILER_SUSPENDED
    http: 403
    condition: "the Retailer owning the affected submission chain has status SUSPENDED"
  - id: ERR_MANUFACTURER_SUSPENDED
    http: 403
    condition: "the Manufacturer owning the affected offer or invoice has status SUSPENDED"

  # --- cross-entity referential / readiness ------------------------------
  - id: ERR_OFFER_MANUFACTURER_MISMATCH
    http: 422
    condition: "body manufacturer_id on POST /submissions/{id}/lots does not equal Offer(body.offer_id).manufacturer_id"
  - id: ERR_OFFER_NOT_CLEARABLE
    http: 422
    condition: "the offer a lot is sorted against has status DRAFT, REGISTERED or WITHDRAWN instead of ACTIVE or EXPIRED"
  - id: ERR_OFFER_EXPIRED
    http: 422
    condition: "activating a REGISTERED offer whose expiration_date is already earlier than the logical clock's calendar date"
  - id: ERR_DISPUTE_OPEN
    http: 409
    condition: "scheduling a statement while a Dispute over one of its submission's lots is still UNDER_REVIEW or INFO_REQUESTED"
  - id: ERR_INVOICE_NOT_FUNDED
    http: 422
    condition: "releasing payment on a statement whose manufacturer_invoice_id is null or whose invoice is not in status FUNDED"
  - id: ERR_STATEMENT_ALREADY_PAID
    http: 409
    condition: "reversing funding on an invoice at least one of whose statements has already reached PAID"
  - id: ERR_STATEMENT_NOT_BILLABLE
    http: 422
    condition: "a statement in statement_ids is not in DRAFT or SCHEDULED, is already billed onto another invoice, or belongs to a submission whose lots do not all carry the invoice's manufacturer_id"
  - id: ERR_OFFER_NOT_DIGITAL
    http: 422
    condition: "clipping or digitally redeeming an Offer whose digital_enabled is false"

  # --- temporal / contractual windows -----------------------------------
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "the requested current_utc is less than or equal to the stored logical clock"
  - id: ERR_POSTMARK_WINDOW_OVERLAP
    http: 409
    condition: "the new submission's half-open postmark window overlaps that of another non-CLOSED submission of the same retailer; exact adjacency does not overlap"
  - id: ERR_BILLING_PERIOD_BUFFER_VIOLATION
    http: 409
    condition: "the new invoice's closed billing period is not separated from every non-REVERSED invoice of the same manufacturer by at least BILLING_PERIOD_BUFFER_DAYS clear days; exact adjacency violates the buffer"
  - id: ERR_CLIP_CONCURRENCY_LIMIT
    http: 409
    condition: "the consumer already holds CLIP_CONCURRENCY_LIMIT live CLIPPED clips on this offer — an aggregate refusal, each existing clip being individually valid"
  - id: ERR_SUBMISSION_PAST_GRACE
    http: 422
    condition: "a lot is sorted after Offer.expiration_date + Offer.redemption_grace_days; the last grace day itself is accepted"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "a dispute is filed after SubmissionLot.adjudicated_at + Manufacturer.dispute_window_days; the last day itself is accepted"

  # --- constraint satisfaction -------------------------------------------
  - id: ERR_DUPLICATE_OFFER_CODE
    http: 409
    condition: "offer_code already exists on another Offer of the same manufacturer, including WITHDRAWN ones"
  - id: ERR_DUPLICATE_GS1_PREFIX
    http: 409
    condition: "gs1_company_prefix already belongs to another Manufacturer"
  - id: ERR_CHANNEL_NOT_SUPPORTED
    http: 422
    condition: "the submission channel is not permitted by Retailer.channel_capability"
  - id: ERR_EMPTY_SUBMISSION
    http: 422
    condition: "issuing a statement over a submission with no lot in status VALIDATED or REINSTATED — there is nothing to settle"
  - id: ERR_COUNT_VARIANCE_EXCEEDED
    http: 422
    condition: "the rounded count_variance_pct is strictly greater than COUNT_VARIANCE_TOLERANCE_PCT; a variance of exactly 2.00 passes"
  - id: ERR_LOT_COUNT_OVERFLOW
    http: 422
    condition: "the running sum of the submission's lot counted_qty values plus the new lot's counted_qty exceeds Submission.verified_count"
  - id: ERR_IMAGE_REQUIRED
    http: 422
    condition: "an element of the items array on POST /submission-lots/{id}/items has a blank or missing image_uri"
  - id: ERR_POS_REF_REQUIRED
    http: 422
    condition: "an element of the items array omits pos_transaction_ref on an ELECTRONIC-channel submission"
  - id: ERR_LOT_CAPTURE_COMPLETE
    http: 409
    condition: "captured_item_count + len(items) would exceed lot.sample_size; the batch is refused as a whole"
  - id: ERR_SAMPLE_INCOMPLETE
    http: 422
    condition: "finalizing a lot whose captured_item_count is still below sample_size"
  - id: ERR_INFO_ROUND_LIMIT
    http: 422
    condition: "a third information request on a dispute whose info_request_count has already reached MAX_INFO_ROUNDS"
  - id: ERR_STATEMENT_LINES_EMPTY
    http: 422
    condition: "statement_ids is empty or contains a repeated element"
  - id: ERR_MAX_REDEMPTIONS_EXCEEDED
    http: 422
    condition: "Offer.accepted_redemption_count plus the units this operation would clear exceeds Offer.max_redemptions"

  # --- fiscal (lowest priority, cheapest to retry) ------------------------
  - id: ERR_FUNDING_EXCEEDS_BILLED
    http: 422
    condition: "funded_amount_cents + amount_cents would exceed invoice.billed_total_cents"
  - id: ERR_PAY_DATE_NOT_REACHED
    http: 422
    condition: "the logical clock's calendar date is earlier than statement.scheduled_pay_date; the scheduled date itself is payable"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# role_model: segregation_of_duties. Two walls are enforced by ERR_SOD_VIOLATION:
#   (1) the FraudAnalyst whose X-User-ID is stored on SubmissionLot.
#       adjudicated_by_user_id may not resolve the Dispute filed against that lot;
#   (2) the SettlementOfficer whose X-User-ID is stored on SettlementStatement.
#       issued_by_user_id may not release that statement's payment.
# Manufacturer and Retailer are peer entity-backed roles with disjoint resource
# ownership; the four staff roles are opaque operator identities.

roles:
  - name: Manufacturer
    description: "Coupon issuer. Designs and registers offers, receives invoices, and wires funding."
    identity: "entity_backed:Manufacturer"
    exclusive_operations:
      - "POST /manufacturer-invoices/{id}/fund"
    shared_operations:
      - "POST /offers (shared with ClearinghouseAdmin)"
      - "POST /offers/{id}/register (shared with ClearinghouseAdmin)"
      - "POST /offers/{id}/withdraw (shared with ClearinghouseAdmin)"
      - "every GET in §1.5 whose roles list includes Manufacturer, restricted by the priority-4 ownership check to its own offers, invoices and the statements billed onto them"

  - name: Retailer
    description: "Submitting retailer or banner. Sends coupons in for clearing, supplies point-of-sale data, appeals rejections and reports digital redemptions."
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /disputes"
      - "POST /disputes/{id}/resubmit"
      - "POST /digital-redemption-events"
    shared_operations:
      - "POST /submissions (shared with IntakeClerk)"
      - "POST /purchase-data-records (shared with IntakeClerk)"
      - "POST /digital-clips (shared with ClearinghouseAdmin)"
      - "every GET in §1.5 whose roles list includes Retailer, restricted by the priority-4 ownership check to its own submissions, lots, items, disputes and statements"

  - name: IntakeClerk
    description: "Mailroom and electronic-intake operator. Opens submissions, performs count verification, sorts coupons into manufacturer/offer lots and captures images."
    identity: "opaque"
    exclusive_operations:
      - "POST /submissions/{id}/verify-count"
      - "POST /submissions/{id}/lots"
      - "POST /submission-lots/{id}/items"
    shared_operations:
      - "POST /submissions (shared with Retailer)"
      - "POST /purchase-data-records (shared with Retailer)"
      - "read access to the offer, submission, lot, item and purchase-record collections"

  - name: FraudAnalyst
    description: "Validation and anti-fraud operator. Adjudicates items against offer terms, finalizes lots, rescores retailers and decides disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /retailers/{id}/fraud-rescore"
      - "POST /coupon-items/{id}/adjudicate"
      - "POST /submission-lots/{id}/finalize"
      - "POST /disputes/{id}/request-info"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "read access to the retailer, offer, submission, lot, item, purchase-record, statement, dispute and digital collections"
    note: "SoD wall 1: the analyst id recorded on SubmissionLot.adjudicated_by_user_id by finalize is barred from POST /disputes/{id}/resolve on that lot's dispute, so two distinct FraudAnalyst user ids are required to take a lot from rejection to resolution."

  - name: SettlementOfficer
    description: "Money operator. Issues retailer statements, schedules payments, releases them, and bills manufacturers."
    identity: "opaque"
    exclusive_operations:
      - "POST /settlement-statements"
      - "POST /settlement-statements/{id}/schedule"
      - "POST /settlement-statements/{id}/release-payment"
      - "POST /manufacturer-invoices"
    shared_operations:
      - "read access to the manufacturer, retailer, offer, submission, lot, item, purchase-record, statement and invoice collections"
    note: "SoD wall 2: the officer id recorded on SettlementStatement.issued_by_user_id by POST /settlement-statements is barred from POST /settlement-statements/{id}/release-payment on that same statement, so two distinct SettlementOfficer user ids are required to move money."

  - name: ClearinghouseAdmin
    description: "Clearinghouse administrator. Onboards and suspends both sides of the market, activates offers, and performs the compensating funding reversal."
    identity: "opaque"
    exclusive_operations:
      - "POST /manufacturers"
      - "POST /manufacturers/{id}/suspend"
      - "POST /retailers"
      - "POST /retailers/{id}/suspend"
      - "POST /retailers/{id}/reinstate"
      - "POST /offers/{id}/activate"
      - "POST /manufacturer-invoices/{id}/reverse-funding"
    shared_operations:
      - "POST /offers, POST /offers/{id}/register, POST /offers/{id}/withdraw (shared with Manufacturer)"
      - "POST /digital-clips (shared with Retailer)"
      - "read access to every collection"
    note: "ClearinghouseAdmin is NOT a hierarchical override: it cannot verify counts, sort lots, capture images, adjudicate items, finalize lots, rescore retailers, resolve disputes, issue statements, schedule or release payments, or fund an invoice. Those remain exclusive to IntakeClerk, FraudAnalyst, SettlementOfficer and Manufacturer respectively."
