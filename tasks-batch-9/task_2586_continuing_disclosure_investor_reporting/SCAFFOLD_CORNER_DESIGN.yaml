              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_both: "$.data.error_id" }
            - call: "POST /disclosure/cycle-content-items/${itemFixed_id}/waive"
              payload: { waiver_reason: "Schedule unavailable." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_not_waivable: "$.data.error_id" }
            - call: "POST /disclosure/cycle-content-items/${itemOpen_id}/waive"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { e_no_reason: "$.data.error_id" }
