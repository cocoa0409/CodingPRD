            - { call: "GET /locker/cut-sheets/${cs1}", payload: {}, as: PlantOperator, captures: { cs1_st: $.data.status } }
            - { call: "GET /locker/cut-sheets/${cs2}", payload: {}, as: PlantOperator, captures: { cs2_st: $.data.status } }
          assert:
            - "first start-fabrication rejected with ERR_CUT_SHEET_MISSING (share 2 sheet still DRAFT)"
            - "after submitting sheet 2, start-fabrication succeeds: Animal.status == CUTTING"
            - "both CutSheets are LOCKED after the transition"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: capacity_day_head_count_aggregate_overflow
        grounds:
          - validations[priority=6]
          - errors[ERR_CAPACITY_FULL]
          - entities.CapacityDay.fields.booked_head
        distinguishing_aspect: |
          Interval semantics: whole-calendar-day aggregate occupation — an
          appointment occupies head_count slots of the day's scalar capacity,
          counting both PENDING_DEPOSIT and CONFIRMED; there is no adjacency
          notion. Resource: CapacityDay (kill slots), unlike the freezer
          window instance.
        test_recipe:
          setup:
            - "Clock default; customers c1, c2 ACTIVE; CapacityDay 2026-08-20 cap 2"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/customers", payload: { name: "Bob Venn", phone: "555-0102", email: "bob@x.com" }, as: PlantOperator, captures: { c2: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 2 }, as: Customer, as_user_id: "${c1}", captures: { appt1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c2}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c2}", captures: { err1: $.data.error_id } }
            - { call: "POST /locker/appointments/${appt1}/pay-deposit", payload: { amount_cents: 30000 }, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c2}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c2}", captures: { err2: $.data.error_id } }
            - { call: "POST /locker/appointments/${appt1}/cancel", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c2}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c2}", captures: { appt2: $.data.id, appt2_st: $.data.status } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-20", date_to: "2026-08-20" }, as: PlantOperator, captures: { cd_booked: "$.data[0].booked_head" } }
          assert:
            - "c2's first booking rejected ERR_CAPACITY_FULL while c1's appointment is only PENDING_DEPOSIT (pending holds aggregate capacity)"
            - "c2's retry rejected ERR_CAPACITY_FULL after c1 confirms (2 + 1 > 2)"
            - "after c1 cancels, c2's booking succeeds with status PENDING_DEPOSIT"
            - "CapacityDay.booked_head == 1 at the end"

      - name: freezer_units_half_open_window_occupancy
        grounds:
          - validations[priority=6]
          - errors[ERR_FREEZER_FULL]
          - state_machines.Animal.CUTTING_to_READY
        distinguishing_aspect: |
          Interval semantics: half-open occupation windows [ready_at,
          picked_up_at) over a shared unit pool — a pickup at instant T frees
          the unit for a completion at T (no adjacency collision at the shared
          endpoint). Resource: freezer units (capacity 4), unlike the
          day-aggregate kill-slot instance.
        test_recipe:
          setup:
            - "Clock default; customers c1, c2, c3 ACTIVE; CapacityDay 2026-08-20 cap 2"
            - "c1 has a CONFIRMED BEEF head_count 2 appointment (deposit 30000 paid); animal a1 (live 1200, hanging 400.0) with four 0.25 shares (owners c1, c2, c1, c2) finalized, all four cut sheets submitted; animal a2 (live 1200, hanging 200.0) with one 1.0 share (owner c3) finalized, cut sheet submitted"
            - "Clock at 2026-08-04 (hang met for both)"
            - "a1 completes fabrication -> 4 StorageRecords STORED occupy all FREEZER_CAPACITY_UNITS (4)"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
