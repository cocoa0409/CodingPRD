      - name: dispute_overdue_inclusive_deadline_vs_outstanding_cap_boundary
        grounds:
          - calculations.dispute_reinvestigation_deadline
          - calculations.outstanding_inquiry_cap
        distinguishing_aspect: |
          Metrics: a timestamp deadline and an integer cap, reached through
          different endpoints than the score ladder. The reinvestigation
          deadline is inclusive (at exactly due_at the dispute is overdue);
          the outstanding cap is inclusive (at exactly the cap the next filing
          fails). Both edges are exercised in one instance via two triggers.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule created then patched: reinvestigation_days 30 (default), max_outstanding_inquiries 1."
            - "Carrier C1 ACTIVE; consumer Nora with 1 claim; dispute D1 filed at 2026-09-01 (due_at 2026-10-01T00:00:00Z); report R1 issued; notice N1 filed+sent (outstanding = 1)."
          setup_api_calls:
            - *d_clock
            - call: "POST /exchange-rules"
              payload: {}
              as: PlatformAdmin
            - call: "PATCH /exchange-rules"
              payload: { max_outstanding_inquiries: 1 }
              as: PlatformAdmin
            - *d_c1
            - &d_cons_n
              call: "POST /consumers"
              payload: { full_name: "Nora Nolan", date_of_birth: "1986-06-06", address_line: "5 Nutmeg St, Midland TX", driver_license_number: "NORA-1" }
              as: PlatformAdmin
              captures: { cons_n_id: $.data.id, cons_n_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_n_id}", policy_number: "PN-1", claim_number: "N-001", loss_date: "2025-07-07", loss_type: "COLLISION", cause_of_loss_code: "COLL", paid_amount_cents: 45000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "GET /consumers/${cons_n_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { n_claim: "$.data[0].id" }
            - call: "POST /consumers/${cons_n_id}/disputes"
              payload: { loss_claim_id: "${n_claim}", dispute_reason: "WRONG_AMOUNT", dispute_statement: "Wrong amount", expected_consumer_version: "${cons_n_v}" }
              as: Consumer
              as_user_id: "${cons_n_id}"
              captures: { n_disp: $.data.id }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Nora Nolan", subject_dob: "1986-06-06", subject_address: "5 Nutmeg St, Midland TX", subject_driver_license: "NORA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_n: $.data.report_id }
            - call: "POST /carriers/${c1_id}/adverse-action-notices"
              payload: { report_id: "${rep_n}", action_type: "NON_RENEWAL", notice_reason_codes: ["LOSS-FREQ"], report_influence_rank: 2 }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { notice_n: $.data.id }
            - call: "POST /adverse-action-notices/${notice_n}/send"
              payload: {}
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /disputes/${n_disp}/begin-reinvestigation"
              payload: {}
              as: ExchangeComplianceOfficer
              captures: { overdue_err: $.data.error_id }
            - call: "POST /carriers/${c1_id}/adverse-action-notices"
              payload: { report_id: "${rep_n}", action_type: "DECLINE", notice_reason_codes: ["LOSS-SEV"], report_influence_rank: 1 }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { cap_err: $.data.error_id }
          assert:
            - "at exactly reinvestigation_due_at (2026-10-01T00:00:00Z) begin-reinvestigation returns 409 with overdue_err == ERR_DISPUTE_OVERDUE — the deadline boundary is inclusive"
            - "with outstanding == 1 == cap, the new notice filing returns 409 with cap_err == ERR_INQUIRY_CAP_EXCEEDED — the cap boundary is inclusive"
            - "ConsumerDispute.${n_disp}.status is still FILED (no transition occurred)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_issuance_depends_on_consumer_freeze_state
        grounds:
          - state_machines.LossHistoryReport.ISSUED_to_FROZEN
          - entities.Consumer.fields.file_frozen
          - validations.priority_6_business_safety
        distinguishing_aspect: |
          Entity pair QuoteInquiry -> Consumer: whether an inquiry produces a
          LossHistoryReport depends on the Consumer aggregate's file_frozen
          flag — a field the inquiry never touches directly. Freezing after
          issuance flips the report; freezing before issuance blocks it.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE; consumer Olive with 1 claim; Olive's file frozen at 2026-09-01."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_o
              call: "POST /consumers"
              payload: { full_name: "Olive Osgood", date_of_birth: "1978-04-04", address_line: "31 Oleander Dr, Odessa TX", driver_license_number: "OLIVE-1" }
              as: PlatformAdmin
              captures: { cons_o_id: $.data.id, cons_o_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_o_id}", policy_number: "PO-1", claim_number: "O-001", loss_date: "2025-10-10", loss_type: "PROPERTY", cause_of_loss_code: "PROP", paid_amount_cents: 55000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "POST /consumers/${cons_o_id}/freeze"
              payload: {}
              as: ExchangeComplianceOfficer
          trigger:
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Olive Osgood", subject_dob: "1978-04-04", subject_address: "31 Oleander Dr, Odessa TX", subject_driver_license: "OLIVE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_o_frozen: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { lifted: $.data.expired_freeze_consumer_ids }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Olive Osgood", subject_dob: "1978-04-04", subject_address: "31 Oleander Dr, Odessa TX", subject_driver_license: "OLIVE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_o_ok: $.data.id, rep_o_ok: $.data.report_id }
          assert:
            - "while frozen, QuoteInquiry.${inq_o_frozen}.report_id is null and report_blocked_reason == FROZEN"
            - "at 2026-11-01 (past frozen_until 2026-10-31) the clock response's expired_freeze_consumer_ids contains Consumer.${cons_o_id}"
            - "after the auto-lift, the identical inquiry succeeds: QuoteInquiry.${inq_o_ok}.report_id is non-null and LossHistoryReport.${rep_o_ok}.claim_count_reported == 1"

      - name: adverse_action_send_depends_on_report_status
        grounds:
          - state_machines.AdverseActionNotice.DRAFT_to_SENT
          - entities.AdverseActionNotice.fields.report_id
          - validations.priority_5_state
        distinguishing_aspect: |
          Entity pair AdverseActionNotice -> LossHistoryReport: the DRAFT ->
          SENT transition's precondition reads the referenced report's state,
          not the notice's own fields. A notice whose report has flipped to
          FROZEN cannot be sent even though the notice itself is DRAFT and
          every notice-local precondition passes.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE; consumer Pete with 1 claim; report R1 issued; notice N1 filed (DRAFT) referencing R1; Pete frozen after the notice was filed."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_p
              call: "POST /consumers"
              payload: { full_name: "Pete Parnell", date_of_birth: "1982-08-18", address_line: "2 Pecan Pl, San Angelo TX", driver_license_number: "PETE-1" }
              as: PlatformAdmin
              captures: { cons_p_id: $.data.id, cons_p_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_p_id}", policy_number: "PP-1", claim_number: "P-001", loss_date: "2025-11-11", loss_type: "COMPREHENSIVE", cause_of_loss_code: "CMP9", paid_amount_cents: 65000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Pete Parnell", subject_dob: "1982-08-18", subject_address: "2 Pecan Pl, San Angelo TX", subject_driver_license: "PETE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_p: $.data.report_id }
            - call: "POST /carriers/${c1_id}/adverse-action-notices"
              payload: { report_id: "${rep_p}", action_type: "RATE_INCREASE", notice_reason_codes: ["LOSS-SEV"], report_influence_rank: 1 }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { notice_p: $.data.id }
            - call: "POST /consumers/${cons_p_id}/freeze"
              payload: {}
              as: ExchangeComplianceOfficer
          trigger:
            - call: "POST /adverse-action-notices/${notice_p}/send"
              payload: {}
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { send_p_err: $.data.error_id }
          assert:
            - "AdverseActionNotice.${notice_p}.status == DRAFT (the notice's own state permits send)"
            - "LossHistoryReport.${rep_p}.status == FROZEN (cascaded by the freeze)"
            - "the send returns 409 with send_p_err == ERR_INVALID_STATE — the cross-entity precondition on the report decides, not the notice's local state"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: retention_window_excludes_losses_exactly_at_the_boundary_date
        grounds:
          - calculations.report_inclusion_set
          - entities.LossClaim.fields.retention_expires_on
          - entities.ExchangeRule.fields.retention_years
        distinguishing_aspect: |
          Interval semantics: half-open retention windows. A loss is
          reportable strictly before loss_date + retention_years; a loss
          dated exactly (clock date - 7 years) is excluded, while a loss one
          day newer is included. The window edge is a date boundary with
          strict-greater-than comparison — no overlap buffer.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults (retention_years 7)."
            - "Carrier C1 ACTIVE; consumer Quinn with 2 claims: Q-OLD loss_date 2019-09-01 (exactly 7 years before the report date) and Q-NEW loss_date 2019-09-02."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_q
              call: "POST /consumers"
              payload: { full_name: "Quinn Quimby", date_of_birth: "1977-03-17", address_line: "88 Quail Run, Longview TX", driver_license_number: "QUINN-1" }
              as: PlatformAdmin
              captures: { cons_q_id: $.data.id, cons_q_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_q_id}", policy_number: "PQ-1", claim_number: "Q-OLD", loss_date: "2019-09-01", loss_type: "OTHER", cause_of_loss_code: "OLD1", paid_amount_cents: 100000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_q_id}", policy_number: "PQ-1", claim_number: "Q-NEW", loss_date: "2019-09-02", loss_type: "OTHER", cause_of_loss_code: "NEW1", paid_amount_cents: 100000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Quinn Quimby", subject_dob: "1977-03-17", subject_address: "88 Quail Run, Longview TX", subject_driver_license: "QUINN-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_q: $.data.id, rep_q: $.data.report_id }
            - call: "GET /reports/${rep_q}/entries"
              payload: {}
              as: ExchangeComplianceOfficer
          assert:
            - "LossHistoryReport.${rep_q}.claim_count_reported == 1 — the 2019-09-01 loss is exactly at the retention boundary and is excluded (strict >)"
            - "the single ReportClaimEntry has loss_date == 2019-09-02 and cause_of_loss_code == NEW1"
            - "both LossClaims remain stored (GET /consumers/${cons_q_id}/claims returns 2 rows); only report inclusion is time-filtered"

      - name: correction_hold_window_strict_inequality_decides_carrier_suspension_on_void
        grounds:
          - calculations.correction_hold_window
          - endpoints.POST_/batches/{batchId}/void
          - entities.ExchangeRule.fields.correction_hold_days
        distinguishing_aspect: |
          Interval semantics: a strict-less-than duration window, different
          from the retention date boundary. Voiding a batch while a dispute on
          one of its claims was filed strictly less than correction_hold_days
          after the batch's submitted_at leaves the carrier untouched; a
          dispute filed exactly correction_hold_days after the batch is
          outside the window, and the same void then suspends the carrier.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults (correction_hold_days 45)."
            - "Carrier C7 ACTIVE with batch B1 submitted 2026-09-01 (1 claim for consumer Ruth)."
            - "Carrier C8 ACTIVE with batch B2 submitted 2026-09-01 (1 claim for consumer Sam)."
            - "Dispute on B1's claim filed at 2026-09-20 (19 days after batch — inside window)."
            - "Dispute on B2's claim filed at 2026-10-16 (exactly 45 days after batch — outside window)."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - &d_c7
              call: "POST /carriers"
              payload: { legal_name: "Rio Grande Mutual", naic_code: "77777" }
              as: PlatformAdmin
              captures: { c7_id: $.data.id }
            - &d_c8
              call: "POST /carriers"
              payload: { legal_name: "Sabine National", naic_code: "88888" }
              as: PlatformAdmin
              captures: { c8_id: $.data.id }
            - &d_cons_r
              call: "POST /consumers"
              payload: { full_name: "Ruth Ramey", date_of_birth: "1981-05-25", address_line: "14 Redbud Rd, Waco TX", driver_license_number: "RUTH-1" }
              as: PlatformAdmin
              captures: { cons_r_id: $.data.id, cons_r_v: $.data.version }
            - &d_cons_s
              call: "POST /consumers"
              payload: { full_name: "Sam Sibley", date_of_birth: "1976-09-15", address_line: "27 Sage St, Killeen TX", driver_license_number: "SAM-1" }
              as: PlatformAdmin
              captures: { cons_s_id: $.data.id, cons_s_v: $.data.version }
            - call: "POST /carriers/${c7_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_r_id}", policy_number: "PR-1", claim_number: "R-001", loss_date: "2025-08-08", loss_type: "COLLISION", cause_of_loss_code: "CL8", paid_amount_cents: 75000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c7_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /carriers/${c8_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_s_id}", policy_number: "PS-1", claim_number: "S-001", loss_date: "2025-08-09", loss_type: "COLLISION", cause_of_loss_code: "CL9", paid_amount_cents: 85000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c8_id}"
              captures: { b2_id: $.data.id }
            - call: "GET /consumers/${cons_r_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { r_claim: "$.data[0].id" }
            - call: "GET /consumers/${cons_s_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { s_claim: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /consumers/${cons_r_id}/disputes"
              payload: { loss_claim_id: "${r_claim}", dispute_reason: "WRONG_AMOUNT", dispute_statement: "Wrong", expected_consumer_version: "${cons_r_v}" }
              as: Consumer
              as_user_id: "${cons_r_id}"
              captures: { r_disp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /consumers/${cons_s_id}/disputes"
              payload: { loss_claim_id: "${s_claim}", dispute_reason: "WRONG_AMOUNT", dispute_statement: "Wrong", expected_consumer_version: "${cons_s_v}" }
              as: Consumer
              as_user_id: "${cons_s_id}"
              captures: { s_disp: $.data.id }
          trigger:
            - call: "POST /batches/${b1_id}/void"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "GET /carriers/${c7_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c7_status: $.data.status }
            - call: "POST /batches/${b2_id}/void"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "GET /carriers/${c8_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c8_status: $.data.status }
          assert:
            - "ContributionBatch.${b1_id}.status == VOIDED and c7_status == ACTIVE — dispute filed 19 days after the batch is inside the correction hold window (strict <), so the void does not suspend"
            - "ContributionBatch.${b2_id}.status == VOIDED and c8_status == SUSPENDED — a dispute filed exactly 45 days after the batch is outside the window (strict <), so the void suspends the carrier"
            - "GET /audit-events?carrier_id=${c8_id} shows CARRIER_SUSPENDED; GET /audit-events?carrier_id=${c7_id} shows no CARRIER_SUSPENDED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: amendment_preserves_total_reportable_loss_count_for_consumer
        grounds:
          - state_machines.LossClaim.ACTIVE_to_AMENDED
          - state_machines.LossClaim.UNDER_DISPUTE_to_AMENDED
          - calculations.report_inclusion_set
        distinguishing_aspect: |
          Conserved quantity: the count of reportable (ACTIVE, in-retention)
          LossClaims for the consumer. An amendment that supersedes an ACTIVE
          claim (old ACTIVE -> AMENDED, new row ACTIVE) must leave the count
          unchanged — the compensating pair (retire + replace) is atomic.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE; consumer Tina with 2 ACTIVE claims (T-001, T-002)."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_t
              call: "POST /consumers"
              payload: { full_name: "Tina Tatum", date_of_birth: "1989-12-01", address_line: "63 Tulip Trl, Garland TX", driver_license_number: "TINA-1" }
              as: PlatformAdmin
              captures: { cons_t_id: $.data.id, cons_t_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_t_id}", policy_number: "PT-1", claim_number: "T-001", loss_date: "2025-04-04", loss_type: "PROPERTY", cause_of_loss_code: "TP1", paid_amount_cents: 110000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_t_id}", policy_number: "PT-1", claim_number: "T-002", loss_date: "2025-05-05", loss_type: "PROPERTY", cause_of_loss_code: "TP2", paid_amount_cents: 120000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "GET /consumers/${cons_t_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { t_claim_1: "$.data[0].id", t_claim_1_v: "$.data[0].version" }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Tina Tatum", subject_dob: "1989-12-01", subject_address: "63 Tulip Trl, Garland TX", subject_driver_license: "TINA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_t_before: $.data.report_id }
          trigger:
            - call: "POST /claims/${t_claim_1}/amendments"
              payload: { loss_date: "2025-04-04", loss_type: "PROPERTY", cause_of_loss_code: "TP1", paid_amount_cents: 115000, claim_status_code: "CLOSED_WITH_PAYMENT", expected_claim_version: "${t_claim_1_v}" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
              captures: { t_amend_id: $.data.id }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Tina Tatum", subject_dob: "1989-12-01", subject_address: "63 Tulip Trl, Garland TX", subject_driver_license: "TINA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_t_after: $.data.report_id }
          assert:
            - "LossHistoryReport.${rep_t_before}.claim_count_reported == 2"
            - "LossClaim.${t_amend_id}.amendment_of_id == ${t_claim_1} and status == ACTIVE"
            - "the amended-from claim ${t_claim_1} has status == AMENDED"
            - "LossHistoryReport.${rep_t_after}.claim_count_reported == 2 — the amend pair conserved the reportable count"
            - "the after-report's entry set contains paid_amount_cents 115000 (new) and does not contain the superseded row"

      - name: dispute_cycle_verified_accurate_conserves_consumer_claim_population
        grounds:
          - state_machines.LossClaim.ACTIVE_to_UNDER_DISPUTE
          - state_machines.LossClaim.UNDER_DISPUTE_to_ACTIVE
          - state_machines.ConsumerDispute.FILED_to_RESOLVED_VERIFIED
        distinguishing_aspect: |
          Conserved quantity of a different type: the consumer's total claim
          population (all non-WITHDRAWN claims) across a full dispute cycle.
          File (ACTIVE -> UNDER_DISPUTE) then resolve VERIFIED_ACCURATE
          (UNDER_DISPUTE -> ACTIVE) must return every conserved field —
          claim count, per-claim paid amounts, retention dates — to its
          pre-dispute value, with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE; consumer Uma with 1 ACTIVE claim U-001 (paid 200000, loss_date 2025-06-06)."
            - "Report R-before issued (claim_count_reported 1)."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_u
              call: "POST /consumers"
              payload: { full_name: "Uma Ulrich", date_of_birth: "1974-11-30", address_line: "5 Umber Ave, McKinney TX", driver_license_number: "UMA-1" }
              as: PlatformAdmin
              captures: { cons_u_id: $.data.id, cons_u_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_u_id}", policy_number: "PU-1", claim_number: "U-001", loss_date: "2025-06-06", loss_type: "LIABILITY", cause_of_loss_code: "UL1", paid_amount_cents: 200000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
            - call: "GET /consumers/${cons_u_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { u_claim: "$.data[0].id" }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Uma Ulrich", subject_dob: "1974-11-30", subject_address: "5 Umber Ave, McKinney TX", subject_driver_license: "UMA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_u_before: $.data.report_id }
          trigger:
            - call: "POST /consumers/${cons_u_id}/disputes"
              payload: { loss_claim_id: "${u_claim}", dispute_reason: "NOT_MY_CLAIM", dispute_statement: "I dispute this", expected_consumer_version: "${cons_u_v}" }
              as: Consumer
              as_user_id: "${cons_u_id}"
              captures: { u_disp: $.data.id }
            - call: "POST /disputes/${u_disp}/begin-reinvestigation"
              payload: {}
              as: ExchangeComplianceOfficer
            - call: "POST /disputes/${u_disp}/resolve"
              payload: { resolution_code: "VERIFIED_ACCURATE", resolution_notes: "Carrier confirmed" }
              as: ExchangeComplianceOfficer
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Uma Ulrich", subject_dob: "1974-11-30", subject_address: "5 Umber Ave, McKinney TX", subject_driver_license: "UMA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { rep_u_after: $.data.report_id }
          assert:
            - "while UNDER_DISPUTE the claim would be excluded — a mid-cycle inquiry is not needed; the conservation check is pre vs post"
            - "LossClaim.${u_claim}.status == ACTIVE after resolution and paid_amount_cents == 200000 (unchanged)"
            - "LossHistoryReport.${rep_u_after}.claim_count_reported == 1, identical to LossHistoryReport.${rep_u_before}.claim_count_reported"
            - "LossHistoryReport.${rep_u_after}.risk_score_premium_weighted_cents == LossHistoryReport.${rep_u_before}.risk_score_premium_weighted_cents — the full file -> reinvestigate -> verify cycle leaves zero drift in the conserved quantities"
