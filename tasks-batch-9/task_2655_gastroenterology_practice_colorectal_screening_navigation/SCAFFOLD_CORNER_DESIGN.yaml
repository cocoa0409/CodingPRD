          difficulty_instance: suspended_session_at_capacity_returns_session_not_accepting
          rationale: "That depth instance already drives a SUSPENDED block against a booking attempt and pins ERR_SESSION_NOT_ACCEPTING_BOOKINGS ahead of the capacity and geometry rules, which covers the precondition claim for this edge."

  - section: calculations
    instances:
      - name: risk_stratification_branch_order_puts_high_before_increased
        claim_type: correct_result
        grounds:
          - calculations.patient_risk_stratification
          - entities.Patient.fields.risk_tier
        distinguishing_aspect: "A patient with both ibd_diagnosis and family_history_crc true is HIGH, not INCREASED - the first matching branch wins, so the family-history branch is unreachable once an IBD or prior-CRC flag is set."
        test_recipe:
          setup:
            - "One plan and three patients with different flag combinations"
          setup_api_calls:
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", ibd_diagnosis: true, family_history_crc: true }
              as: PracticeAdmin
              captures: { t_both: $.data.risk_tier }
            - call: "POST /patients"
              payload: { mrn: "MRN-0002", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", family_history_crc: true }
              as: PracticeAdmin
              captures: { t_fam: $.data.risk_tier }
            - call: "POST /patients"
              payload: { mrn: "MRN-0003", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}" }
              as: PracticeAdmin
              captures: { t_none: $.data.risk_tier }
            - call: "POST /patients"
              payload: { mrn: "MRN-0004", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", prior_crc_history: true }
              as: PracticeAdmin
              captures: { t_prior: $.data.risk_tier }
          assert:
            - "${t_both} == HIGH - not INCREASED"
            - "${t_fam} == INCREASED"
            - "${t_none} == AVERAGE"
            - "${t_prior} == HIGH"
      - name: prep_score_rounds_per_touchpoint_and_honours_the_decay_floor
        claim_type: precision
        grounds:
          - calculations.prep_adherence_score
          - calculations.prep_adherence_score.constants.DECAY_FLOOR
          - state_machines.ScreeningEpisode.navigation_status
        distinguishing_aspect: "After 15 days each PORTAL touchpoint decays to exactly the 0.25 floor and contributes round_half_up(0.375, 2) == 0.38, so the score is 0.38 + 0.38 + 0.40 == 1.16 - summing first and rounding once would yield 1.15."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one plan, one patient aged 51, one OPEN episode"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health" }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id }
          trigger:
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "PORTAL", acknowledged: true }
              as: PatientNavigator
              captures: { s1: $.data.prep_adherence_score, n1: $.data.navigation_status }
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "PORTAL", acknowledged: true }
              as: PatientNavigator
              captures: { s2: $.data.prep_adherence_score, n2: $.data.navigation_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "MAIL", acknowledged: false }
              as: PatientNavigator
              captures: { s3: $.data.prep_adherence_score, n3: $.data.navigation_status }
          assert:
