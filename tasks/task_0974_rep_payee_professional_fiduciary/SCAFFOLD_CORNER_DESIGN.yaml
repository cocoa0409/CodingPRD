        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_COURT_ORDER_REQUIRED]"]

        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / restricted_create_safety_error_precedes_referential_error
