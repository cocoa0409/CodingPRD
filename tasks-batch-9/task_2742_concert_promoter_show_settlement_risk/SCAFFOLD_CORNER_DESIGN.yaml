          assert:
            - "THE VENUE MAY SELL — the VenueOperator's sale gives ${sr_t1_sold} == 20 and ${sr_t1_avail_a} == 280; selling is shared with the TalentBuyer, who is the seller in every_role_can_perform_its_own_exclusive_and_shared_operations"
            - "THREE ROLES MAY HOLD, EACH ITS OWN KIND — ${sr_h1_status} == HELD, ${sr_h2_kind} == ARTIST_HOLD (created by the ArtistRep), ${sr_h3_kind} == PRODUCTION_HOLD (created by the VenueOperator), and after four holds ${sr_t1_held_b} == 18 with ${sr_t1_avail_b} == 262 (300 - 20 sold - 18 held)"
            - "THREE ROLES MAY RELEASE — ${sr_h1_rel} == ${sr_h2_rel} == ${sr_h3_rel} == RELEASED with ${sr_h1_relby} == the TalentBuyer's user id, ${sr_h2_relby} == ${sr_a1_id} and ${sr_h3_relby} == ${sr_vn_id}; ${sr_t1_held_c} == 6 and ${sr_t1_avail_c} == 274"
            - "THE CLOCK IS SHARED BY ALL FIVE ROLES — the ArtistRep's POST /_clock/set_current_utc returns 200; the ArtistRep and VenueOperator are the only roles that may NOT run POST /_ops/run, which the TourAccountant runs here"
            - "HOUSEKEEPING IS SHARED AND IDEMPOTENT — after the TourAccountant's run ${sr_h4_status} == EXPIRED with ${sr_t1_held_d} == 0 and ${sr_t1_avail_d} == 280; the TalentBuyer's second run at the same clock changes nothing, so ${sr_t1_held_e} == 0 and ${sr_t1_avail_e} == 280"
