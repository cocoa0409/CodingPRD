  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (three DIFFERENT entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_gated_by_volunteer_and_badge_state
        grounds:
          - state_machines.ShiftAssignment.SIGNED_UP_to_CONFIRMED
          - state_machines.Volunteer.ACTIVE_to_SUSPENDED
          - entities.Badge.fields.status
        distinguishing_aspect: |
          Entity pair ShiftAssignment -> {Volunteer, Badge}: confirm is blocked by the
          VOLUNTEER's state (SUSPENDED -> ERR_VOLUNTEER_INVALID_STATE) and by the
          BADGE's state (manually REVOKED on an ACTIVE volunteer -> ERR_BADGE_INVALID_STATE)
          — the assignment itself is in a perfectly valid SIGNED_UP state both times.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; volunteer V fully ACTIVE; badge ISSUED"
            - "Shift 2026-08-10T08:00:00Z-12:00:00Z PUBLISHED capacity 5; V SIGNED_UP"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: VolunteerServicesDirector }
            - { call: "POST /auxiliary/departments", payload: { name: "Emergency", head_user_id: "dh-1" }, as: VolunteerServicesDirector, captures: { dept_id: $.data.id } }
            - { call: "POST /auxiliary/volunteer-roles", payload: { name: "ED Greeter", category: "PATIENT_FACING", minimum_age: 18 }, as: VolunteerServicesDirector, captures: { role_id: $.data.id } }
