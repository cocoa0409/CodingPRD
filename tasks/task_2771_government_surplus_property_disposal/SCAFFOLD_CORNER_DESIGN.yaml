        distinguishing_aspect: "The fee tier boundary is crossed by a two-cent difference in appraised value: fair_market_value_cents 200000 discounts to a base of exactly 100000 and draws the medium fee 12500, while 199998 discounts to 99999 and draws the small fee 5000, so a two-cent input gap produces a 7501-cent output gap. The comparison at the boundary is >=, i.e. exactly HANDLING_TIER_1_CENTS is already the medium tier."
