  - rule_id: cross_entity_state_dependency
    instances:

      - name: run_approval_blocked_while_a_downline_earner_is_suspended
        grounds:
          - validations[priority=43]
          - state_machines.CommissionRun.CALCULATED_to_APPROVED
          - state_machines.Consultant.ACTIVE_to_SUSPENDED
          - entities.CommissionStatement.fields.status
        distinguishing_aspect: |
          Entity pair CommissionRun <- Consultant: the run is a legal CALCULATED row with
          nothing wrong in it, yet approval is refused because a third-party Consultant holding
          an ACTIVE statement of that run is SUSPENDED; dismissing the sanction, with no write
          to the run at all, makes the identical approval call succeed.
        test_recipe:
          setup:
            - "G1 fixture (A -> B -> C, A DIRECTOR), period 2026-08 CLOSED, CommissionRun run1 CALCULATED with three ACTIVE statements."
            - "C is then SANCTIONED to SUSPENSION for the window [2026-08-05, 2026-08-25] by a compliance case."
            - "No write of any kind is made to run1 between the two approval attempts."
