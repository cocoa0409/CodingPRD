    path: "/crew-assignments"
    description: "List crew assignments, filterable by job_id / crew_id"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: ["job_id?", "crew_id?", "status?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/crew-assignments/{id}/check-in"
    description: "Check a crew in on the job (BOOKED -> CHECKED_IN)"
    roles: [ProductionManager]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: ["status -> CHECKED_IN; version+1"]

  - method: POST
    path: "/crew-assignments/{id}/complete"
    description: "Complete a crew assignment (CHECKED_IN -> COMPLETED)"
