          ERR_PANEL_STATE_INVALID and must not overwrite the first verdict (NON_REACTIVE) with the
          new REACTIVE markers, nor re-map the donor's serology_status.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
