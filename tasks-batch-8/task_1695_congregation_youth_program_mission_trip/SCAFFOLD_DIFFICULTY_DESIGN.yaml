            - { call: "POST /youth-ministry/_clock/set-current-utc", payload: {to_iso8601: "2027-01-15T00:00:00Z"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/registrations/${reg1}/payments", payload: {amount_cents: 50000, method: "CASH"}, as: Treasurer, as_user_id: "treasurer-1", captures: {pay1_posted: $.data.posted_at} }
