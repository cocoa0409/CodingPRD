              payload: { submission_id: "${sub}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /vendor-submissions/${badbatch}/revoke"
              payload: {}
              as: VendorRepresentative
              as_user_id: "${vend}"
            - call: "POST /vendor-submissions"
              payload: { vendor_id: "${vend}", facility_id: "${fac}", reporting_period_id: "${per}", attested_by: "Northgate Ops Lead", lines: [{ worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-06", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }] }] }
              as: VendorRepresentative
              as_user_id: "${vend}"
          assert:
            - "the accept returns 422 with data.error_id == ERR_WORK_DATE_OUTSIDE_PERIOD and VendorHourSubmission.${badbatch}.status is still SUBMITTED with accepted_direct_care_hours == 0.00"
            - "GET /hour-entries with vendor_submission_id ${badbatch} returns total_count == 0, so the in-period first line was not synthesized either"
            - "QuarterlySubmission.${sub}.vendor_sourced_hours == 0.00 and version is still 1"
            - "the revoke returns 409 with data.error_id == ERR_VENDOR_SUBMISSION_STATE_INVALID, since revoke requires ACCEPTED"
            - "the batch naming the EMPLOYEE worker ${w_rn} returns 422 with data.error_id == ERR_VENDOR_WORKER_MISMATCH at creation time, before any submit"

      - name: appeal_naming_another_facilitys_case_is_rejected
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /rating-appeals]
          - validations[priority 48 ERR_APPEAL_CASE_MISMATCH]
        distinguishing_aspect: "Both referenced rows exist and are individually valid, but the optional discrepancy_case_id must belong to the same facility as the appealed measure, so the link is refused on association rather than existence."
        test_recipe:
          setup:
            - "A PUBLISHED measure for facility 675001's 2026Q2 submission, plus a second facility 675002 with its own submission and an OPEN discrepancy case on it"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
            - *k_accept
            - *k_measure
            - *k_publish
            - *k_fac2
            - *k_sub2
            - call: "POST /discrepancy-cases"
              payload: { facility_id: "${fac2}", submission_id: "${sub2}", trigger_reason: "CENSUS_MISMATCH", detail: "Willow Bend census does not tie to the MDS extract." }
              as: StateAuditor
              as_user_id: "auditor-case-01"
              captures: { case_other: $.data.id }
          trigger:
            - call: "POST /rating-appeals"
              payload: { staffing_measure_id: "${meas}", grounds: "CENSUS_ERROR", narrative: "Appealing on the strength of another facility's case.", expected_measure_version: "${mver2}", discrepancy_case_id: "${case_other}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
          assert:
            - "response code is 422 with data.error_id == ERR_APPEAL_CASE_MISMATCH"
            - "DiscrepancyCase.${case_other}.facility_id == ${fac2} while StaffingMeasure.${meas}.facility_id == ${fac}"
            - "StaffingMeasure.${meas}.has_open_appeal is still false and version is unchanged at ${mver2}"
            - "GET /rating-appeals with discrepancy_case_id ${case_other} returns total_count == 0"

      - name: audit_readiness_and_hprd_reads_are_side_effect_free
        claim_type: computed_read
        grounds:
          - endpoints[GET /facilities/{id}/audit-readiness]
          - endpoints[GET /submissions/{id}/hprd]
        distinguishing_aspect: "Both computed reads accept a variant selector and return freshly derived values without persisting them, so the submission's stored audit_support_score and version are untouched by a FULL-population read."
        test_recipe:
          setup:
            - "An ACCEPTED 2026Q2 submission with one SUPPORTED payroll-backed 8.00-hour RN shift on Wednesday 2026-04-01 and one RECONCILED census day at 5 residents"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
            - *k_accept
          trigger:
            - call: "GET /facilities/${fac}/audit-readiness"
