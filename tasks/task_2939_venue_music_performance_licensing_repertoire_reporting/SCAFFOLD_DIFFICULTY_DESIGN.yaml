              as: LicensingAdmin
              captures: { v2_id: "$.data.id", v2_v0: "$.data.version" }
            - call: "POST /licensing/license-applications"
              payload: { venue_id: "${v2_id}", society_id: "${bmi_id}", requested_license_type: "BLANKET", declared_seating: 1200, declared_standing: 0, declared_cover_revenue_cents: 62000000, declared_live_nights: 5, declared_music_use_profile: "LIVE_ONLY", requested_term_start: "2026-08-01T00:00:00Z", expected_venue_version: "${v2_v0}" }
              as: VenueOperator
              as_user_id: "${v2_id}"
              captures: { app2_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app2_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${v2_id}"
            - call: "POST /licensing/license-applications/${app2_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app2_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app2_id}" }
              as: LicensingAdmin
              captures: { lic2_id: "$.data[0].id" }
            - call: "POST /licensing/licenses/${lic2_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "GET /licensing/licenses/${lic2_id}"
              payload: {}
              as: LicensingAdmin
              captures: { lic2_ver: "$.data.version" }
            - call: "POST /licensing/audit-cases"
              payload: { venue_id: "${v2_id}", audit_trigger: "ROUTINE", lookback_start: "2025-01-01T00:00:00Z", lookback_end: "2026-05-01T00:00:00Z", society_ids: ["${bmi_id}"] }
              as: ComplianceAuditor
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /licensing/licenses/${lic2_id}/renew"
              payload: { requested_term_start: "2027-08-01T00:00:00Z", expected_license_version: "${lic2_ver}" }
              as: LicensingAdmin
              expect_error: ERR_AUDIT_HOLD_ACTIVE
          assert:
            - "The trigger returns HTTP 409 with error_id ERR_AUDIT_HOLD_ACTIVE, not ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL"
            - "License.${lic2_id}.renewed_into_license_id is still null and no new License row exists for (${v2_id}, ${bmi_id})"
            - "After POST /licensing/audit-cases/${case_id}/close with closed_reason NO_GAP_FOUND, Venue.${v2_id}.audit_hold == false"
            - "Re-issuing the identical renew call then returns HTTP 409 with error_id ERR_OUTSTANDING_BALANCE_BLOCKS_RENEWAL because outstanding_balance_cents is still 1335461"
