              as: SupplierQualityEngineer
              as_user_id: sqe-1
              captures: { a2: $.data.id }
            - call: "POST /sourcing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sourcing/suppliers/${sup_id}/audits/${a2}/start"
              payload: {}
