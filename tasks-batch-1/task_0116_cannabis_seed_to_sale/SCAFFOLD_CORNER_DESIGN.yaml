        claim_type: Computed read
        grounds:
          - endpoints
          - entities.Package.fields.remaining_grams
        distinguishing_aspect: "GET /compliance/packages/{id} returns computed remaining_grams reflecting prior waste deductions (100 - 10 = 90)."
        test_recipe:
          setup: ["An ACTIVE FLOWER package of 100g with a 10g non-failed waste already recorded (remaining 90)."]
