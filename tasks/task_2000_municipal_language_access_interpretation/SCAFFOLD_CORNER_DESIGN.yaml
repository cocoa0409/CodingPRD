# =============================================================================
# Task 2000: Municipal Language Access — §1.9 Scaffold Corner Design
# Breadth coverage of every testable claim in SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 does not already cover. Stubs (excluded_because) cite the §1.8 instance
# that already exercises the corner.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_department_applies_defaults
        claim_type: creation
        grounds: [entities.Department]
        distinguishing_aspect: "POST /departments with only required fields -> 201 with signage_status CURRENT, spent_cents 0, remaining_cents == annual_budget_cents, compliance_score 1000, posture GOOD_STANDING, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { name: "Dept Audit", service_area_code: "SA-C1", annual_budget_cents: 250000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          assert:
            - "Department.${dept_id}.signage_status == CURRENT (default applied)"
            - "Department.${dept_id}.spent_cents == 0 and remaining_cents == 250000"
            - "Department.${dept_id}.compliance_score == 1000 and posture == GOOD_STANDING"
            - "Department.${dept_id}.version == 1 and id/created_at/updated_at are server-stamped"

      - name: get_department_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Department, "errors[ERR_DEPARTMENT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown department UUID -> 404 ERR_DEPARTMENT_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /departments/11111111-2222-3333-4444-555555555555"
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEPARTMENT_NOT_FOUND (HTTP 404)"

      - name: create_assessment_with_computed_field_rejected
        claim_type: computed_fields
        grounds: [entities.LanguageAssessment.fields.lep_share, "validations[priority=3]"]
        distinguishing_aspect: "Computed field lep_share supplied in the create body -> ERR_VALIDATION; server-computed fields are not accepted as input."
        test_recipe:
          setup: ["Department D exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Comp", service_area_code: "SA-C2", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 100, service_area_population: 10000, encounter_count: 50, total_encounters: 10000, lep_share: 0.99 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400); no assessment persisted (GET /language-assessments?department_id=${dept_id} total_count == 0)"

      - name: create_department_missing_required_budget_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Department.fields.annual_budget_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required annual_budget_cents -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /departments"
              payload: { name: "Dept Missing", service_area_code: "SA-C3" }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400)"

      - name: create_request_invalid_enum_modality_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.InterpretationRequest.fields.modality, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "modality value outside {PHONE, VIDEO, IN_PERSON} -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Department D exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Enum", service_area_code: "SA-C4", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "SMOKE_SIGNAL", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400)"

      - name: assessment_list_filtered_by_department
        claim_type: listing
        grounds: [entities.LanguageAssessment.fields.department_id, endpoints]
        distinguishing_aspect: "GET /language-assessments?department_id=D1 returns exactly D1's assessments, not D2's (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["Departments D1, D2; one assessment on each"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept F1", service_area_code: "SA-C5", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { d1_id: $.data.id }
            - call: "POST /departments"
              payload: { name: "Dept F2", service_area_code: "SA-C6", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { d2_id: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${d1_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 100, service_area_population: 10000, encounter_count: 50, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${d1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${d2_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 200, service_area_population: 10000, encounter_count: 60, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${d2_id}"
              captures: { a2_id: $.data.id }
          trigger:
            - call: "GET /language-assessments"
              payload: { department_id: "${d1_id}" }
              as: LanguageAccessCoordinator
          assert:
            - "Filtered list total_count == 1 and the single element id == ${a1_id} (${a2_id} excluded)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: job_created_in_queued_initial_state
        claim_type: initial_state
        grounds: [state_machines.TranslationJob, calculations.translation_cost]
        distinguishing_aspect: "New job starts QUEUED with revision_count 0, provisional_cost_cents == word_count x rate (1000 x 20 = 20000), final_cost_cents null, and commitment visible on the contract."
        test_recipe:
          setup: ["Department D; contract ACTIVE (word rate 20c, ceiling 500000); Doc ACTIVE"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Init", service_area_code: "SA-C7", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorInit", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Init Doc", document_type: "GUIDE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 1000 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
          assert:
            - "TranslationJob.${job_id}.status == QUEUED and revision_count == 0"
            - "TranslationJob.${job_id}.provisional_cost_cents == 20000 and final_cost_cents == null"
            - "VendorContract.${contract_id}.committed_cents == 20000 (immediate read-after-write)"

      - name: submit_translation_before_assign_returns_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.TranslationJob.IN_TRANSLATION_to_QUALITY_REVIEW, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "submit-translation on a QUEUED (never assigned) job -> 409 ERR_INVALID_TRANSITION; job state unchanged."
        test_recipe:
          setup: ["Department D; contract ACTIVE; Doc ACTIVE; job QUEUED (word_count 100)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Trans", service_area_code: "SA-C8", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorTrans", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Trans Doc", document_type: "FORM" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 100 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 100 }
              as: Interpreter
              as_user_id: "11111111-2222-3333-4444-555555555555"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (HTTP 409) and TranslationJob.${job_id}.status still QUEUED"

      - name: cancel_approved_job_returns_invalid_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TranslationJob, "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "APPROVED is terminal for cancel: POST /translation-jobs/{id}/cancel on an APPROVED job -> 409 ERR_INVALID_TRANSITION; no refund side effects fire."
        test_recipe:
          setup: ["Department D; contract ACTIVE (word 20c, ceiling 500000); Doc ACTIVE; translator REGISTERED conf current; reviewer CERTIFIED conf current; job approved (word_count 100, submitted 100 -> final 2000)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Lock", service_area_code: "SA-C9", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorLock", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "T Lock", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { translator_id: $.data.id }
            - call: "PATCH /interpreters/${translator_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "R Lock", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { reviewer_id: $.data.id }
            - call: "PATCH /interpreters/${reviewer_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Lock Doc", document_type: "NOTICE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 100 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /translation-jobs/${job_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 100 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "APPROVE" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          trigger:
            - call: "POST /translation-jobs/${job_id}/cancel"
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_TRANSITION (HTTP 409)"
            - "TranslationJob.${job_id}.status still APPROVED; VendorContract.${contract_id}.spent_cents == 2000 unchanged (no compensation fired)"

      - name: retire_document_cascades_cancel_queued_job
        claim_type: cascade_down
        grounds: [state_machines.VitalDocument.ACTIVE_to_RETIRED, state_machines.TranslationJob.QUEUED_to_CANCELLED]
        distinguishing_aspect: "Retiring a document cancels only its non-terminal jobs (QUEUED one here) and each cascaded cancellation releases its provisional commitment (20000) from the contract."
        test_recipe:
          setup: ["Department D; contract ACTIVE (word 20c, ceiling 500000); Doc ACTIVE with one QUEUED job word_count 1000 (committed 20000)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Retire", service_area_code: "SA-C10", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorRetire", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Retire Doc", document_type: "POLICY" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 1000 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /vital-documents/${doc_id}/retire"
              as: LanguageAccessCoordinator
          assert:
            - "VitalDocument.${doc_id}.status == RETIRED"
            - "TranslationJob.${job_id}.status == CANCELLED (cascade link 1)"
            - "VendorContract.${contract_id}.committed_cents == 0 (cascade link 2: provisional 20000 released)"

      - name: approve_supersedes_prior_approved_job
        claim_type: side_effect_execution
        grounds: [state_machines.TranslationJob.APPROVED_to_SUPERSEDED, entities.TranslationJob.fields.superseded_by_job_id, entities.VitalDocument.fields.translated_language_codes]
        distinguishing_aspect: "Approving a second job for the same (document, language) SUPERSEDES the first (superseded_by_job_id set) while the document's coverage list still shows the language exactly once."
        test_recipe:
          setup: ["Department D; contract ACTIVE (word 20c, ceiling 500000); Doc ACTIVE; translator REGISTERED conf current; reviewer CERTIFIED conf current; job1 (es, 1000 words) APPROVED; job2 (es, 500 words) IN_TRANSLATION then QUALITY_REVIEW"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Sup", service_area_code: "SA-C11", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorSup", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "T Sup", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { translator_id: $.data.id }
            - call: "PATCH /interpreters/${translator_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "R Sup", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { reviewer_id: $.data.id }
            - call: "PATCH /interpreters/${reviewer_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Sup Doc", document_type: "GUIDE" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 1000 }
              as: LanguageAccessCoordinator
              captures: { job1_id: $.data.id }
            - call: "POST /translation-jobs/${job1_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs/${job1_id}/submit-translation"
              payload: { submitted_word_count: 1000 }
              as: Interpreter
              as_user_id: "${translator_id}"
            - call: "POST /translation-jobs/${job1_id}/review"
              payload: { decision: "APPROVE" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 500 }
              as: LanguageAccessCoordinator
              captures: { job2_id: $.data.id }
            - call: "POST /translation-jobs/${job2_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs/${job2_id}/submit-translation"
              payload: { submitted_word_count: 500 }
              as: Interpreter
              as_user_id: "${translator_id}"
          trigger:
            - call: "POST /translation-jobs/${job2_id}/review"
              payload: { decision: "APPROVE" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "TranslationJob.${job1_id}.status == SUPERSEDED and superseded_by_job_id == ${job2_id}"
            - "TranslationJob.${job2_id}.status == APPROVED and final_cost_cents == 10000"
            - "VitalDocument.${doc_id}.translated_language_codes == [\"es\"] (superseded job excluded, language listed once)"
            - "VendorContract.${contract_id}.spent_cents == 30000 (20000 + 10000)"

      - name: dismissed_complaint_has_no_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Complaint.RECEIVED_to_DISMISSED]
        distinguishing_aspect: "The DISMISSED branch is the divergent no-op fork: no score event, no remediation window, terminal immediately — unlike SUBSTANTIATED."
        test_recipe:
          setup: ["Department D; complaint recorded by liaison"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Dis", service_area_code: "SA-C12", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", category: "OTHER", description: "unfounded" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_id}/adjudicate"
              payload: { outcome: "DISMISSED" }
              as: ComplianceOfficer
          assert:
            - "Complaint.${complaint_id}.status == DISMISSED and remediation_due_at == null and closed_at == null"
            - "Department.${dept_id}.compliance_score == 1000 and posture == GOOD_STANDING (no -150 event)"
            - "Department.${dept_id}.signage_status == CURRENT (unchanged)"

      - name: assessment_reject_requires_note
        claim_type: precondition_enforcement
        grounds: [state_machines.LanguageAssessment.DRAFT_to_REJECTED, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "decision=REJECT without rejection_note -> 400 ERR_VALIDATION; the same call with the note -> REJECTED with the note stored."
        test_recipe:
          setup: ["Department D; one DRAFT assessment"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Rej", service_area_code: "SA-C13", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 100, service_area_population: 10000, encounter_count: 50, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /language-assessments/${asm_id}/review"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /language-assessments/${asm_id}/review"
              payload: { decision: "REJECT", rejection_note: "stale survey data" }
              as: ComplianceOfficer
          assert:
            - "First review: error_id == ERR_VALIDATION and assessment stays DRAFT"
            - "Second review: LanguageAssessment.${asm_id}.status == REJECTED and rejection_note == \"stale survey data\""

  # ===========================================================================
  - section: calculations
    instances:
      - name: rating_stepwise_clamp_at_cap_before_penalty
        claim_type: correct_result
        grounds: [calculations.interpreter_quality_rating]
        distinguishing_aspect: "Chronological stepwise clamping: completion +5 is clamped at the 1000 cap BEFORE the -200 penalty lands, yielding exactly 800 — an unclamped accumulator would give 805."
        test_recipe:
          setup: ["Department D (budget 1000000); contract ACTIVE (phone 50c/min, ceiling 500000); interpreter X CERTIFIED [es] [PHONE] conf current; request R (PHONE 30 min) ASSIGNED and COMPLETED (actual 30); complaint K linked to R"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Clamp", service_area_code: "SA-C14", annual_budget_cents: 1000000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorClamp", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Clara Clamp", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id }
            - call: "POST /interpretation-requests/${req_id}/complete"
              payload: { actual_minutes: 30 }
              as: Interpreter
              as_user_id: "${interp_id}"
            - call: "POST /complaints"
              payload: { department_id: "${dept_id}", interpretation_request_id: "${req_id}", category: "POOR_QUALITY", description: "clamp check" }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: ComplianceOfficer
          assert:
            - "Interpreter.${interp_id}.quality_rating == 800 (1000 clamped after +5, then -200; NOT 805)"
            - "Interpreter.${interp_id}.status == ACTIVE (800 >= 600)"

      - name: contract_below_exhaustion_threshold_stays_active
        claim_type: constants_applied
        grounds: [calculations.vendor_contract_commitment, state_machines.VendorContract.ACTIVE_to_EXHAUSTED]
        distinguishing_aspect: "Spent of 89900 on a 100000 ceiling is below the 90% threshold (90000) — contract stays ACTIVE; complements the §1.8 exhaustion instance which hits exactly 90000."
        test_recipe:
          setup: ["Department D; contract ceiling 100000 word 20c ACTIVE; Doc ACTIVE; translator REGISTERED conf current; reviewer CERTIFIED conf current; job word_count 4495 (provisional 89900) assigned and submitted (4495)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Below", service_area_code: "SA-C15", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorBelow", ceiling_cents: 100000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "T Below", language_codes: ["es"], modalities: ["PHONE"], tier: "REGISTERED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { translator_id: $.data.id }
            - call: "PATCH /interpreters/${translator_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "R Below", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { reviewer_id: $.data.id }
            - call: "PATCH /interpreters/${reviewer_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /vital-documents"
              payload: { department_id: "${dept_id}", title: "Below Doc", document_type: "FORM" }
              as: LanguageAccessCoordinator
              captures: { doc_id: $.data.id }
            - call: "POST /translation-jobs"
              payload: { document_id: "${doc_id}", vendor_contract_id: "${contract_id}", target_language_code: "es", word_count: 4495 }
              as: LanguageAccessCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /translation-jobs/${job_id}/assign"
              payload: { translator_id: "${translator_id}" }
              as: LanguageAccessCoordinator
            - call: "POST /translation-jobs/${job_id}/submit-translation"
              payload: { submitted_word_count: 4495 }
              as: Interpreter
              as_user_id: "${translator_id}"
          trigger:
            - call: "POST /translation-jobs/${job_id}/review"
              payload: { decision: "APPROVE" }
              as: QualityReviewer
              as_user_id: "${reviewer_id}"
          assert:
            - "VendorContract.${contract_id}.spent_cents == 89900 (< 90000 threshold)"
            - "VendorContract.${contract_id}.status == ACTIVE (no EXHAUSTED transition, no QUEUED-job cascade)"
            - "VendorContract.${contract_id}.committed_cents == 0 and available_cents == 10100"

      - name: contract_exhaustion_at_ninety_percent
        claim_type: correct_result
        grounds: [calculations.vendor_contract_commitment, state_machines.VendorContract.ACTIVE_to_EXHAUSTED]
        excluded_because:
          difficulty_instance: translation_approval_exhaustion_cancels_queued_jobs
          rationale: "The >= 90% EXHAUSTED transition and its cascade are asserted there (spent 90000 of 100000)."

  # ===========================================================================
  - section: validations
    instances:
      - name: publish_requires_certified_assessments_then_succeeds
        claim_type: cross_entity_validation
        grounds: [state_machines.LanguageAccessPlan.DRAFT_to_PUBLISHED, "errors[ERR_MISSING_CERTIFIED_ASSESSMENTS]"]
        distinguishing_aspect: "Publish is gated on ANOTHER entity's state: with zero CERTIFIED assessments for the plan year it fails with ERR_MISSING_CERTIFIED_ASSESSMENTS; after certifying one per department the same publish succeeds."
        test_recipe:
          setup: ["Department D; plan for 2026 in DRAFT; no assessments yet"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Pub", service_area_code: "SA-C16", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /language-access-plans"
              payload: { plan_year: 2026, summary: "FY26 plan" }
              as: LanguageAccessCoordinator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /language-access-plans/${plan_id}/publish"
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 600, service_area_population: 10000, encounter_count: 500, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /language-assessments/${asm_id}/review"
              payload: { decision: "CERTIFY" }
              as: ComplianceOfficer
            - call: "POST /language-access-plans/${plan_id}/publish"
              as: LanguageAccessCoordinator
          assert:
            - "First publish: error_id == ERR_MISSING_CERTIFIED_ASSESSMENTS (HTTP 409); plan stays DRAFT"
            - "Second publish: LanguageAccessPlan.${plan_id}.status == PUBLISHED and published_at != null"

      - name: publish_supersedes_previous_plan
        claim_type: side_effect_execution
        grounds: [state_machines.LanguageAccessPlan.PUBLISHED_to_SUPERSEDED]
        distinguishing_aspect: "Publishing the 2027 plan moves the PUBLISHED 2026 plan to SUPERSEDED (system transition); exactly one plan is PUBLISHED at a time."
        test_recipe:
          setup: ["Department D with CERTIFIED assessments for plan_year 2026 and 2027; plan2026 already PUBLISHED; plan2027 DRAFT"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Plan", service_area_code: "SA-C17", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", lep_speaker_count: 600, service_area_population: 10000, encounter_count: 500, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm26_id: $.data.id }
            - call: "POST /language-assessments/${asm26_id}/review"
              payload: { decision: "CERTIFY" }
              as: ComplianceOfficer
            - call: "POST /language-assessments"
              payload: { department_id: "${dept_id}", language_code: "es", plan_year: 2027, period_start: "2027-01-01T00:00:00Z", period_end: "2027-07-01T00:00:00Z", lep_speaker_count: 700, service_area_population: 10000, encounter_count: 600, total_encounters: 10000 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { asm27_id: $.data.id }
            - call: "POST /language-assessments/${asm27_id}/review"
              payload: { decision: "CERTIFY" }
              as: ComplianceOfficer
            - call: "POST /language-access-plans"
              payload: { plan_year: 2026 }
              as: LanguageAccessCoordinator
              captures: { plan26_id: $.data.id }
            - call: "POST /language-access-plans/${plan26_id}/publish"
              as: LanguageAccessCoordinator
            - call: "POST /language-access-plans"
              payload: { plan_year: 2027 }
              as: LanguageAccessCoordinator
              captures: { plan27_id: $.data.id }
          trigger:
            - call: "POST /language-access-plans/${plan27_id}/publish"
              as: LanguageAccessCoordinator
          assert:
            - "LanguageAccessPlan.${plan27_id}.status == PUBLISHED"
            - "LanguageAccessPlan.${plan26_id}.status == SUPERSEDED (bubble/system transition on the prior plan)"

      - name: plan_year_conflict_for_duplicate_year
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PLAN_YEAR_CONFLICT]"]
        distinguishing_aspect: "Second DRAFT plan for an already-taken plan_year (existing plan still DRAFT) -> 409 ERR_PLAN_YEAR_CONFLICT (uniqueness over DRAFT+PUBLISHED)."
        test_recipe:
          setup: ["Department D not required; one DRAFT plan for 2028 exists"]
          setup_api_calls:
            - call: "POST /language-access-plans"
              payload: { plan_year: 2028 }
              as: LanguageAccessCoordinator
              captures: { plan28_id: $.data.id }
          trigger:
            - call: "POST /language-access-plans"
              payload: { plan_year: 2028 }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_YEAR_CONFLICT (HTTP 409); LanguageAccessPlan.${plan28_id}.status still DRAFT"

      - name: schedule_in_past_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=7]", "errors[ERR_SCHEDULE_IN_PAST]"]
        distinguishing_aspect: "A PHONE request with scheduled_start before the logical clock (default 2026-08-01T00:00:00Z) -> 422 ERR_SCHEDULE_IN_PAST."
        test_recipe:
          setup: ["Department D exists"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Past", service_area_code: "SA-C18", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_start: "2026-07-31T23:00:00Z", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCHEDULE_IN_PAST (HTTP 422); nothing persisted"

      - name: in_person_lead_time_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=7]", "errors[ERR_LEAD_TIME_INSUFFICIENT]"]
        distinguishing_aspect: "IN_PERSON request only 45 minutes ahead of the clock (needs >= 2h) -> 422 ERR_LEAD_TIME_INSUFFICIENT even though the start is in the future."
        test_recipe:
          setup: ["Clock set to 2026-08-01T06:00:00Z; Department D exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: LanguageAccessCoordinator
            - call: "POST /departments"
              payload: { name: "Dept Lead", service_area_code: "SA-C19", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-01T06:45:00Z", scheduled_duration_minutes: 60 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LEAD_TIME_INSUFFICIENT (HTTP 422); nothing persisted"

      - name: patch_budget_below_spent_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=9]", entities.Department.fields.annual_budget_cents]
        distinguishing_aspect: "PATCH annual_budget_cents below the already-incurred spent_cents (1000 < 1725) -> 400 ERR_VALIDATION; the aggregate fiscal invariant cannot be violated by a profile edit."
        test_recipe:
          setup: ["Department D budget 100000; contract ACTIVE (phone 50c/min); interpreter CERTIFIED [es] [PHONE] conf current; one request completed (final 1725 -> D.spent_cents == 1725, D.version advanced to 2)"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Budget", service_area_code: "SA-C20", annual_budget_cents: 100000 }
              as: LanguageAccessCoordinator
              captures: { dept_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorBudget", ceiling_cents: 500000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Bob Budget", language_codes: ["es"], modalities: ["PHONE"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_id}", language_code: "es", modality: "PHONE", encounter_setting: "GENERAL", scheduled_duration_minutes: 30 }
              as: DepartmentLiaison
              as_user_id: "${dept_id}"
              captures: { req_id: $.data.id }
            - call: "POST /interpretation-requests/${req_id}/complete"
              payload: { actual_minutes: 30 }
              as: Interpreter
              as_user_id: "${interp_id}"
            - call: "GET /departments/${dept_id}"
              as: LanguageAccessCoordinator
              captures: { dept_v: $.data.version }
          trigger:
            - call: "PATCH /departments/${dept_id}"
              payload: { annual_budget_cents: 1000, expected_department_version: "${dept_v}" }
              as: LanguageAccessCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400; 1000 < spent_cents 1725)"
            - "Department.${dept_id}.annual_budget_cents still 100000"

      - name: department_budget_estimated_cost_gate
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DEPARTMENT_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Estimated cost vs remaining_cents is inclusive at equality: deptA with 5000 rejects an estimated-9400 IN_PERSON request (402), deptB with exactly 9400 accepts it (201 ASSIGNED)."
        test_recipe:
          setup: ["Departments A (budget 5000) and B (budget 9400); contract ACTIVE (in_person 100c/min, travel 2500c); interpreter CERTIFIED [es] [IN_PERSON] conf current"]
          setup_api_calls:
            - call: "POST /departments"
              payload: { name: "Dept Poor", service_area_code: "SA-C21", annual_budget_cents: 5000 }
              as: LanguageAccessCoordinator
              captures: { dept_a_id: $.data.id }
            - call: "POST /departments"
              payload: { name: "Dept Exact", service_area_code: "SA-C22", annual_budget_cents: 9400 }
              as: LanguageAccessCoordinator
              captures: { dept_b_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { vendor_name: "VendorGate", ceiling_cents: 1000000, phone_per_minute_cents: 50, video_per_minute_cents: 75, in_person_per_minute_cents: 100, translation_per_word_cents: 20, in_person_travel_flat_cents: 2500 }
              as: LanguageAccessCoordinator
              captures: { contract_id: $.data.id }
            - call: "POST /vendor-contracts/${contract_id}/activate"
              as: LanguageAccessCoordinator
            - call: "POST /interpreters"
              payload: { full_name: "Gina Gate", language_codes: ["es"], modalities: ["IN_PERSON"], tier: "CERTIFIED", vendor_contract_id: "${contract_id}" }
              as: LanguageAccessCoordinator
              captures: { interp_id: $.data.id }
            - call: "PATCH /interpreters/${interp_id}"
              payload: { confidentiality_signed: true }
              as: LanguageAccessCoordinator
          trigger:
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_a_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-02T10:00:00Z", scheduled_duration_minutes: 45 }
              as: DepartmentLiaison
              as_user_id: "${dept_a_id}"
              captures: { err: $.data.error_id }
            - call: "POST /interpretation-requests"
              payload: { department_id: "${dept_b_id}", language_code: "es", modality: "IN_PERSON", encounter_setting: "GENERAL", scheduled_start: "2026-08-02T10:00:00Z", scheduled_duration_minutes: 45 }
              as: DepartmentLiaison
              as_user_id: "${dept_b_id}"
              captures: { req_b_id: $.data.id }
          assert:
            - "DeptA: error_id == ERR_DEPARTMENT_BUDGET_EXCEEDED (HTTP 402; estimated 9400 > remaining 5000); nothing persisted for A"
            - "DeptB: InterpretationRequest.${req_b_id}.status == ASSIGNED and estimated_cost_cents == 9400 == Department B remaining_cents (equality allowed)"
            - "Department.${dept_b_id}.remaining_cents still == 9400 (remaining is spent-based; the 9400 commitment lives on the contract's committed_cents, not on spent_cents)"

