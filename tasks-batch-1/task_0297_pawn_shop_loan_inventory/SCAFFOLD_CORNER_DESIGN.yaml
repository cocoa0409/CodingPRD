  # ===================================================================
  # Stubs — corners already covered by §1.8 difficulty instances
  # ===================================================================
  - section: state_machines
    instances:
      - name: forfeit_spawns_inventory_item_bubble
        claim_type: side_effect_execution
        grounds:
          - state_machines.Loan.IN_GRACE_to_FORFEITED
        excluded_because:
          difficulty_instance: transitive_cascade / forfeit_cascade_depth2_spawns_priced_inventory
          rationale: "The forfeit -> InventoryItem spawn side effect (and its pricing) is asserted by the named §1.8 cascade instance."

  - section: calculations
    instances:
      - name: resale_dual_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.resale_pricing
        excluded_because:
          difficulty_instance: dual_variant_calc / resale_list_vs_floor_diverge_on_inventory_item
          rationale: "list_price vs floor_price divergence is the core assertion of the named §1.8 dual-variant instance."

      - name: bin_overlap_halfopen_correctness
        claim_type: correct_result
        grounds:
          - calculations.bin_occupancy_overlap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / storage_bin_capacity_halfopen_overlap
          rationale: "Half-open bin capacity overlap detection is exercised by the named §1.8 temporal-overlap instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: void_drawer_invariant_conservation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Loan.ACTIVE_to_VOIDED
        excluded_because:
          difficulty_instance: compensating_invariant / void_conserves_cash_drawer_balance
          rationale: "The disbursement+void cash-conservation invariant is asserted by the named §1.8 compensating-invariant instance."
