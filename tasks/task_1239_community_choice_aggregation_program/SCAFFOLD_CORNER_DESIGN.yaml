scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, listing, defaults, computed and
  # system fields, type constraints, immutability, not-found handling.
  # ===========================================================================
  - section: entities
    instances:
      - name: authority_bootstrap_creation_and_singleton_uniqueness
        claim_type: creation
        grounds:
          - entities.Authority
          - errors[ERR_UNIQUENESS_CONFLICT]
        distinguishing_aspect: "First POST /cca/authority returns 201 with status FORMING and climate_reserve_balance_cents == 0; a second bootstrap POST is rejected with ERR_UNIQUENESS_CONFLICT (409)."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
              captures: { st: $.data.status, reserve: $.data.climate_reserve_balance_cents, ver: $.data.version }
          trigger:
            - call: "POST /cca/authority"
              payload: { display_name: "Duplicate Authority", utility_territory_code: "SCE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.50 }
              as: BoardDirector
              captures: { err: $.data.error_id }
          assert:
            - "First create: status == FORMING, climate_reserve_balance_cents == 0, version == 1"
            - "Second create: error_id == ERR_UNIQUENESS_CONFLICT"

      - name: service_account_ingest_defaults_and_atomic_duplicate_rejection
        claim_type: defaults
        grounds:
          - entities.ServiceAccount.fields.enrollment_state
          - entities.ServiceAccount.fields.product_election
          - errors[ERR_UNIQUENESS_CONFLICT]
        distinguishing_aspect: "Ingested accounts default to enrollment_state PROSPECT, product_election DEFAULT, uncollectible_flag false, cumulative ledgers 0; a batch containing a duplicate utility_account_number is rejected atomically (ERR_UNIQUENESS_CONFLICT, zero rows ingested)."
        test_recipe:
          setup: ["Authority exists (FORMING is sufficient — ingest does not require ACTIVE)"]
          setup_api_calls:
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-0001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct: "$.data.account_ids[0]", cnt: $.data.ingested_count }
          trigger:
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-0002", service_class: "RESIDENTIAL", annual_kwh_estimate: 9000, annual_peak_kw: 3.0, da_eligible: false }, { utility_account_number: "U-0001", service_class: "SMALL_COMMERCIAL", annual_kwh_estimate: 50000, annual_peak_kw: 12.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "First batch: ingested_count == 1"
            - "GET of acct shows enrollment_state == PROSPECT, product_election == DEFAULT, uncollectible_flag == false, cumulative_billed_cents == 0, cumulative_remitted_cents == 0"
            - "Second batch (contains duplicate U-0001): error_id == ERR_UNIQUENESS_CONFLICT and U-0002 was NOT ingested (atomic all-or-nothing)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID on a parameterized endpoint returns ERR_NOT_FOUND (404), exercising the existence priority (3) before any state or business rule."
        test_recipe:
          setup: ["Authority exists"]
          setup_api_calls:
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
          trigger:
            - call: "GET /cca/service-accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: rate_schedule_computed_margin_ignores_client_input
        claim_type: computed_fields
        grounds:
          - entities.RateSchedule.fields.comparison_margin_bps
          - calculations.rate_comparison_margin
        distinguishing_aspect: "comparison_margin_bps is source:computed — the server derives round_half_up(10000*(12.00-11.40)/12.00) == 500; any client-supplied value for a computed field is not accepted (the field is absent from the create endpoint's input schema)."
        test_recipe:
          setup: ["Authority exists; product P DRAFT"]
          setup_api_calls:
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod: $.data.id }
          trigger:
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { margin: $.data.comparison_margin_bps, st: $.data.status }
          assert:
            - "comparison_margin_bps == 500 (server-computed)"
            - "status == DRAFT on creation"

      - name: opt_out_request_immutability_append_only
        claim_type: immutability
        grounds:
          - entities.OptOutRequest
        distinguishing_aspect: "OptOutRequest is common_fields:false — the row carries id and created_at but no version/updated_at (nothing to increment because nothing mutates). Rescission is expressed only by appending a reversal row: after the reversal, a re-read of the ORIGINAL request shows every field unchanged."
        test_recipe:
          setup:
            - "Authority ACTIVE; account NOTICED under W1; clock 2026-02-01 (inside the window)"
            - "Original OPT_OUT request R1 recorded; reversal R2 recorded referencing R1"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs: $.data.id }
            - call: "POST /cca/rate-schedules/${rs}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-IM01", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct: "$.data.account_ids[0]" }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/opt-out-requests"
              payload: { service_account_id: "${acct}", enrollment_notice_id: "${notice}", election_type: "OPT_OUT", channel: "WEB" }
              as: CustomerService
              captures: { req1: $.data.id, r1_created: $.data.created_at }
            - call: "POST /cca/opt-out-requests"
              payload: { service_account_id: "${acct}", enrollment_notice_id: "${notice}", election_type: "OPT_OUT", channel: "PHONE", reversal_of_request_id: "${req1}" }
              as: CustomerService
              captures: { req2: $.data.id }
          trigger:
            - call: "GET /cca/opt-out-requests/${req1}"
              payload: {}
              as: CustomerService
              captures: { r1_channel: $.data.channel, r1_reversal: $.data.reversal_of_request_id, r1_created_after: $.data.created_at }
            - call: "GET /cca/opt-out-requests"
              payload: { reversal_of_request_id: "${req1}" }
              as: CustomerService
              captures: { reversals: $.data }
          assert:
            - "R1 after reversal: channel == WEB, reversal_of_request_id == null, created_at unchanged (r1_created_after == r1_created) — the original row was never mutated"
            - "R1 carries no version and no updated_at field (common_fields: false)"
            - "Filtered list by reversal_of_request_id returns exactly the 1 reversal row R2"
      - name: enum_and_format_type_constraints
        claim_type: type_constraints
        grounds:
          - entities.BillingExtract.fields.billing_month
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "billing_month must match YYYY-MM; '2026-5' and '2026-13' both fail with ERR_INVALID_REQUEST (400), and an invalid enum (service_class 'MUNICIPAL') on ingest fails the same way — priority 12 field-level checks."
        test_recipe:
          setup: ["Authority exists"]
          setup_api_calls:
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
          trigger:
            - call: "POST /cca/billing-extracts"
              payload: { billing_month: "2026-13" }
              as: BillingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: state_machines — valid transitions, invalid-from rejections,
  # terminal lockdown, side effects, guarded transitions.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: notice_close_before_deadline_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.EnrollmentNotice.ISSUED_to_CLOSED
          - errors[ERR_STATUTE_WINDOW_VIOLATION]
        distinguishing_aspect: "Closing an ISSUED wave while the logical clock is strictly before opt_out_deadline (mail + NOTICE_COOLING_OFF_DAYS) is rejected with ERR_STATUTE_WINDOW_VIOLATION; closing at-or-after the deadline succeeds — statutory window is half-open at the deadline instant."
        test_recipe:
          setup:
            - "Authority ACTIVE with default product + covering ADOPTED schedule; one eligible PROSPECT account"
            - "Notice W1 issued with notice_mailed_on 2026-01-01; deadline = mailed + NOTICE_COOLING_OFF_DAYS; clock set to 2026-01-10 (before the 60-day deadline 2026-03-01)"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs: $.data.id }
            - call: "POST /cca/rate-schedules/${rs}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-1001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice: $.data.id, deadline: $.data.opt_out_deadline }
            - call: "POST /cca/enrollment-notices/${notice}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BoardDirector
          trigger:
            - call: "POST /cca/enrollment-notices/${notice}/close"
              payload: {}
              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STATUTE_WINDOW_VIOLATION"
            - "Notice remains ISSUED; accounts remain NOTICED"

      - name: opt_out_after_deadline_rejected_and_rescission_flow
        claim_type: valid_transition
        grounds:
          - state_machines.ServiceAccount.NOTICED_to_OPTED_OUT
          - state_machines.ServiceAccount.NOTICED_to_NOTICED
        distinguishing_aspect: "An OPT_OUT recorded before the deadline flips the account to OPTED_OUT and a rescission row (reversal_of_request_id) before the deadline returns it to the ENROLLING sweep; the same OPT_OUT after the deadline is rejected with ERR_STATUTE_WINDOW_VIOLATION."
        test_recipe:
          setup:
            - "Authority ACTIVE; account NOTICED under W1 (deadline 2026-03-01); clock 2026-02-01"
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs: $.data.id }
            - call: "POST /cca/rate-schedules/${rs}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-2001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct: "$.data.account_ids[0]" }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/opt-out-requests"
              payload: { service_account_id: "${acct}", enrollment_notice_id: "${notice}", election_type: "OPT_OUT", channel: "WEB" }
              as: CustomerService
              captures: { req1: $.data.id }
            - call: "POST /cca/opt-out-requests"
              payload: { service_account_id: "${acct}", enrollment_notice_id: "${notice}", election_type: "OPT_OUT", channel: "PHONE", reversal_of_request_id: "${req1}" }
              as: CustomerService
              captures: { req2: $.data.id }
          trigger:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/enrollment-notices/${notice}/close"
              payload: {}
              as: ProgramOperator
              captures: { n_out: $.data.account_count_opted_out }
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/service-accounts/${acct}"
              payload: {}
              as: CustomerService
              captures: { final_state: $.data.enrollment_state, elect: $.data.product_election, vint: $.data.vintage_year }
          assert:
            - "After req1 the account was OPTED_OUT; after the rescission req2 it re-entered the sweep"
            - "account_count_opted_out == 0 at close (the only opt-out was reversed)"
            - "After epoch advance: enrollment_state == ENROLLED, product_election == DEFAULT, vintage_year == 2026"

      - name: terminal_state_lockdown_settled_extract
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BillingExtract
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "A SETTLED BillingExtract accepts no further triggers — a second utility-accept on the settled extract returns ERR_ALREADY_TERMINAL and re-posts no ledger credits."
        test_recipe:
          setup: ["Authority ACTIVE; extract 2026-05 fully settled via remittance"]
          setup_api_calls:
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/authority"
              payload: { display_name: "Valley Clean Alliance", utility_territory_code: "PGE", er_balancing_authority: "CISO", rate_setting_policy: "COST_PLUS", rps_target_pct: 0.60 }
              as: BoardDirector
              captures: { auth_v0: $.data.version }
            - call: "POST /cca/products"
              payload: { product_code: "STANDARD50", election_key: "DEFAULT", renewable_pct: 0.50 }
              as: RateAnalyst
              captures: { prod: $.data.id }
            - call: "POST /cca/rate-schedules"
              payload: { product_id: "${prod}", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", energy_rate_cents_per_kwh: 11.40, pcia_rate_cents_per_kwh: 1.50, incumbent_benchmark_rate_cents_per_kwh: 12.00 }
              as: RateAnalyst
              captures: { rs: $.data.id }
            - call: "POST /cca/rate-schedules/${rs}/propose"
              payload: {}
              as: RateAnalyst
            - call: "POST /cca/rate-schedules/${rs}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/products/${prod}/adopt"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/authority/activate"
              payload: {}
              as: BoardDirector
            - call: "GET /cca/authority"
              payload: {}
              as: BoardDirector
              captures: { auth_v: '$.data[0].version' }
            - call: "POST /cca/service-accounts/ingest"
              payload: { accounts: [ { utility_account_number: "U-3001", service_class: "RESIDENTIAL", annual_kwh_estimate: 12000, annual_peak_kw: 4.0, da_eligible: false } ] }
              as: ProgramOperator
              captures: { acct: "$.data.account_ids[0]" }
            - call: "POST /cca/enrollment-notices"
              payload: { wave_label: "W1", notice_mailed_on: "2026-01-01T00:00:00Z", target_service_classes: ["RESIDENTIAL"] }
              as: ProgramOperator
              captures: { notice: $.data.id }
            - call: "POST /cca/enrollment-notices/${notice}/issue"
              payload: { expected_authority_version: "${auth_v}" }
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/enrollment-notices/${notice}/close"
              payload: {}
              as: ProgramOperator
            - call: "POST /cca/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: BoardDirector
            - call: "POST /cca/_clock/advance_epoch"
              payload: {}
              as: BoardDirector
            - call: "POST /cca/billing-extracts"
              payload: { billing_month: "2026-05" }
              as: BillingCoordinator
              captures: { ext: $.data.id }
            - call: "POST /cca/billing-extracts/${ext}/lines"
              payload: { service_account_id: "${acct}", usage_kwh: 1000 }
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext}/submit"
              payload: {}
              as: BillingCoordinator
            - call: "POST /cca/billing-extracts/${ext}/utility-accept"
              payload: {}
              as: UtilityLiaison
              captures: { ext_v: $.data.version }
            - call: "POST /cca/remittance-files"
              payload: { remittance_period: "2026-05", gross_remittance_cents: 11400, utility_fee_bps: 0 }
              as: BillingCoordinator
              captures: { rem: $.data.id }
            - call: "POST /cca/remittance-files/${rem}/reconcile"
              payload: { expected_extract_version: "${ext_v}" }
              as: BillingCoordinator
            - call: "POST /cca/remittance-files/${rem}/settle"
              payload: {}
              as: FinanceController
          trigger:
