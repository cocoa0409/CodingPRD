  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: assessed_penalty_nested_clamp_after_conditional_assistance_discount
        grounds:
          - calculations.citation_assessed_penalty_cents
          - calculations.citation_offense_sequence
          - entities.FareZone.fields.penalty_multiplier_bps
          - entities.Rider.fields.fare_assistance_enrolled
          - entities.Citation.fields.assessed_penalty_cents
        distinguishing_aspect: |
          Mode (a) — nested min/max clamp wrapped around a conditional branch, with rounding
          after every multiplicative step. Tier 25000 x 12345 bps rounds half-up to 30863, the
          fare-assistance branch halves it to 15432 (round_half_up of 15431.5), and only then does
          max(2500, min(27500, .)) apply, leaving 15432. Clamping before the discount yields 13750
          and rounding once at the end yields 15431 — both observably wrong.
        test_recipe:
          setup:
            - "Zone Z2 DESIGNATED with penalty_multiplier_bps 12345, required_sign_count 10, enforcement_policy CITATION_IMMEDIATE."
            - "Rider R-300 has fare_assistance_enrolled true and two prior WARNING_ISSUED encounters, so warning_inclusive offense_sequence is 3 while citation_only_sequence is 1."
            - "Deployment D2 ACTIVE 06:00..14:00 on line L1 with target_sample_size 3; logical clock 2026-08-05T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z2", name: "Riverside POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12345, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z2: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
