              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_al}"
              as: DistributorAdmin
              captures: { l_al: "$.data[0].id" }
            - call: "GET /parts/${part_al1}"
              as: DistributorAdmin
              captures: { part_al1_v: $.data.version }
