# =============================================================================
# §1.9 Scaffold Corner Design — Mobile Car Wash & Fleet Washing Service
# Breadth coverage: every testable non-difficulty claim of §1.1-§1.7
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: customer_creation_defaults
        claim_type: creation
        grounds: ["entities.Customer", "entities.Customer.fields.customer_type", "entities.Customer.fields.status"]
        distinguishing_aspect: "POST /fleet-wash/customers with only required fields returns 201 with customer_type defaulted to RETAIL, status ACTIVE, version 1, server-minted id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fleet-wash/customers", payload: { name: "Acme", email: "acme@x.com" }, as: PlatformAdmin, captures: { c_type: $.data.customer_type, c_status: $.data.status, c_v: $.data.version } }
          assert:
            - "c_type == RETAIL (default applied)"
            - "c_status == ACTIVE and c_v == 1"
            - "response data.id is a UUID with no type prefix; created_at/updated_at present with three fractional digits"

      - name: vehicle_invalid_class_rejected
        claim_type: type_constraints
        grounds: ["entities.Vehicle.fields.vehicle_class", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An enum member outside {SEDAN, SUV_PICKUP, VAN_BOXTRUCK, HEAVY_FLEET} is rejected with ERR_VALIDATION (400) at creation."
        test_recipe:
          setup: ["customer and site exist"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "E2", email: "e2@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "E2S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "E2X", vehicle_class: "MOTORCYCLE" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION; no Vehicle row is created (GET /fleet-wash/vehicles?customer_id=${cust_id} returns total_count 0)"

      - name: wash_order_computed_quote_input_ignored
        claim_type: computed_fields
        grounds: ["entities.WashOrder.fields.quote_cents", "entities.WashOrder.fields.vehicle_count"]
        distinguishing_aspect: "Client-supplied quote_cents/vehicle_count values are ignored; the server computes quote_cents 3500 for one SEDAN and vehicle_count 1."
        test_recipe:
          setup: ["RETAIL customer, site, 1 SEDAN"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "E3", email: "e3@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "E3S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "E3", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z", quote_cents: 1, vehicle_count: 99 }, as: PlatformAdmin, captures: { q: $.data.quote_cents, n: $.data.vehicle_count } }
          assert:
            - "q == 3500 (server-computed, not the supplied 1)"
            - "n == 1 (not the supplied 99)"

      - name: route_stop_sequence_and_first_window_computed
        claim_type: computed_fields
        grounds: ["entities.RouteStop.fields.sequence", "entities.RouteStop.fields.planned_start_at", "entities.RouteStop.fields.planned_end_at", "calculations.stop_planning"]
        distinguishing_aspect: "First stop on a route plans at 08:00:00Z; a 1-SEDAN order on a 8000-sqft lot yields 15 setup + 20 service = 35 minutes, ending 08:35:00Z."
        test_recipe:
          setup: ["RETAIL customer; site lot 8000; 1 SEDAN; CONFIRMED order; BASIC van loaded 96; technician; DRAFT route 2026-08-05"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "E4", email: "e4@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "E4S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "E4", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-E4", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech E4" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
          trigger:
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { seq: $.data.sequence, ps: $.data.planned_start_at, pe: $.data.planned_end_at, res: $.data.reserved_water_gal } }
          assert:
            - "seq == 1"
            - "ps == 2026-08-05T08:00:00.000Z and pe == 2026-08-05T08:35:00.000Z"
            - "res == 3.2 (8 gross x (1 - 0.60))"

      - name: vehicle_unknown_customer_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Vehicle.fields.customer_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body FK reference to a non-existent Customer is rejected with ERR_NOT_FOUND (404) before any business rule runs."
        test_recipe:
          setup: ["one site exists under a real customer (site_id needed for payload completeness)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "E5", email: "e5@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "E5S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "00000000-0000-4000-8000-000000000000", site_id: "${site_id}", plate: "E5X", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

      - name: quality_audit_immutable_record
        claim_type: immutability
        grounds: ["entities.QualityAudit"]
        distinguishing_aspect: "QualityAudit declares common_fields: false — its response carries id and created_at only, no version/updated_at, and no update or event endpoint exists for it."
        test_recipe:
          setup: ["completed 1-SEDAN order (standard completion chain)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "E6", email: "e6@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "E6S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "E6", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-E6", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech E6" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}" }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "COMPLETE", vehicles_washed_ids: ["${v1}"] }, as: Technician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /fleet-wash/quality-audits", payload: { wash_order_id: "${order_id}", exterior_score: 20, wheels_score: 20, glass_score: 20, trim_score: 20, water_spotting_score: 20 }, as: QualityAuditor, captures: { a_total: $.data.total_score, a_result: $.data.result } }
          assert:
            - "a_total == 100 and a_result == PASS"
            - "response data contains id, created_at, wash_order_id, auditor_id and the five scores; it does NOT contain version or updated_at"

      - name: wash_orders_pagination_defaults
        claim_type: listing
        grounds: ["response_envelope", "endpoints: 'GET /fleet-wash/wash-orders'"]
        distinguishing_aspect: "List endpoint honors the fixed envelope: default limit 10, total_count 12, has_more true on page 1; offset 10 returns the remaining 2 rows with has_more false."
        test_recipe:
          setup: ["RETAIL customer with site and 1 SEDAN; 12 DRAFT wash orders (no CONFIRM needed)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "E7", email: "e7@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "E7S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "E7", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T08:00:00Z", scheduled_window_end: "2026-08-06T08:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T09:00:00Z", scheduled_window_end: "2026-08-06T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T10:00:00Z", scheduled_window_end: "2026-08-06T10:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T11:00:00Z", scheduled_window_end: "2026-08-06T11:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T12:00:00Z", scheduled_window_end: "2026-08-06T12:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T13:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T14:00:00Z", scheduled_window_end: "2026-08-06T14:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T15:00:00Z", scheduled_window_end: "2026-08-06T15:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T16:00:00Z", scheduled_window_end: "2026-08-06T16:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T17:00:00Z", scheduled_window_end: "2026-08-06T17:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T18:00:00Z", scheduled_window_end: "2026-08-06T18:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T19:00:00Z", scheduled_window_end: "2026-08-06T19:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /fleet-wash/wash-orders?customer_id=${cust_id}", payload: {} , as: Dispatcher }
            - { call: "GET /fleet-wash/wash-orders?customer_id=${cust_id}&limit=10&offset=10", payload: {}, as: Dispatcher }
          assert:
            - "Page 1: response_type == array, len(data) == 10, meta-free envelope fields total_count == 12, has_more == true (default limit 10)"
            - "Page 2: len(data) == 2, has_more == false, total_count == 12"

  - section: state_machines
    instances:
      - name: wash_order_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.WashOrder", "entities.WashOrder.fields.status", "entities.WashOrder.fields.billing_status"]
        distinguishing_aspect: "A created wash order starts DRAFT with billing_status UNBILLED and quote_cents computed; it never skips to SCHEDULED implicitly."
        test_recipe:
          setup: ["RETAIL customer, site, 1 SEDAN"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "S1", email: "s1@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "S1S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "S1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T14:00:00Z" }, as: PlatformAdmin, captures: { st: $.data.status, bs: $.data.billing_status, q: $.data.quote_cents, re: $.data.is_rewash } }
          assert:
            - "st == DRAFT and bs == UNBILLED and q == 3500 and re == false"

      - name: start_without_arrive_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: ["state_machines.WashOrder.ASSIGNED_to_IN_PROGRESS", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "START requires the order's stop to be ARRIVED; with the stop still PLANNED the transition fails with ERR_INVALID_STATE and no state changes."
        test_recipe:
          setup: ["1-SEDAN order ASSIGNED to a PUBLISHED route; stop still PLANNED"]
          setup_api_calls:
            - { call: "POST /fleet-wash/customers", payload: { name: "S2", email: "s2@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "S2S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "S2", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-S2", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech S2" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
          trigger:
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "START" }, as: Technician, as_user_id: "${tech_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; WashOrder.${order_id}.status remains ASSIGNED and the stop remains PLANNED"

      - name: closed_order_rejects_further_events
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.WashOrder.COMPLETED_to_CLOSED", "calculations.guarantee_windows", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "run-daily at exactly completed_at + 72h closes the order (inclusive <= boundary); a CLOSED terminal order rejects CANCEL with ERR_INVALID_STATE."
        test_recipe:
          setup: ["1-SEDAN order COMPLETED with completed_at == 2026-08-05T10:00:00Z (clock pinned)"]
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /fleet-wash/customers", payload: { name: "S3", email: "s3@x.com" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /fleet-wash/sites", payload: { customer_id: "${cust_id}", name: "S3S", lot_size_sqft: 8000, containment_type: "VACUUM_RECOVERY", water_reclaim_required: false, max_discharge_gal: 100 }, as: PlatformAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "S3", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v1: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { order_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${order_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-S3", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech S3" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${order_id}", expected_route_version: "${route_v}" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /fleet-wash/routes/${route_id}/events", payload: { event_type: "PUBLISH" }, as: Dispatcher }
