# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Pain Management Clinic & Controlled-Substance Compliance — Expert
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_clinic_returns_defaults
        claim_type: Creation
        grounds: [entities.Clinic.fields.med_review_threshold_mg, entities.Clinic.fields.pill_count_tolerance]
        distinguishing_aspect: "POST /clinics with only name+state_code returns 201 with med_review_threshold_mg=90, pill_count_tolerance=2, current_utc=2026-05-01T00:00:00Z, version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "Clinic X", state_code: "NY" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          assert:
            - "Clinic.${clinic_id}.med_review_threshold_mg == 90"
            - "Clinic.${clinic_id}.pill_count_tolerance == 2"
            - "Clinic.${clinic_id}.current_utc == 2026-05-01T00:00:00Z"
            - "Clinic.${clinic_id}.version == 1"

      - name: create_clinic_overrides_defaults
        claim_type: Defaults
        grounds: [entities.Clinic.fields.med_review_threshold_mg, entities.Clinic.fields.pill_count_tolerance]
        distinguishing_aspect: "POST /clinics with med_review_threshold_mg=50 and pill_count_tolerance=5 stores the overrides, not the defaults."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "Clinic Y", state_code: "TX", med_review_threshold_mg: 50, pill_count_tolerance: 5 }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          assert:
            - "Clinic.${clinic_id}.med_review_threshold_mg == 50"
            - "Clinic.${clinic_id}.pill_count_tolerance == 5"

      - name: get_patient_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "GET a non-existent patient UUID under a real clinic returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["A clinic exists; no patients"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Clinic Z", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "GET /clinics/${clinic_id}/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PATIENT_NOT_FOUND"
            - "response.status == 404"

      - name: create_patient_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.full_name
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /clinics/{id}/patients omitting referral_source returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A clinic exists"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Clinic Q", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "No Source" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_provider_invalid_role_kind_enum
        claim_type: Type Constraints
        grounds:
          - entities.Provider.fields.role_kind
          - "errors[ERR_INVALID_ENUM_VALUE]"
        distinguishing_aspect: "POST /providers with role_kind=SURGEON (not in {PRESCRIBER,COMPLIANCE_OFFICER}) returns ERR_INVALID_ENUM_VALUE (422)."
        test_recipe:
          setup: ["A clinic exists"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Clinic R", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Wrong", dea_number: "BX0000000", role_kind: "SURGEON" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_ENUM_VALUE"

      - name: pdmp_check_system_fields_ignored
        claim_type: System Fields
        grounds: [entities.PdmpCheck.fields.queried_utc]
        distinguishing_aspect: "PdmpCheck.queried_utc is system-stamped from clinic.current_utc (2026-05-01T00:00:00Z default), ignoring any client-supplied value; id and created_at are server-minted."
        test_recipe:
          setup: ["Clinic with default clock; a patient and a prescriber"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Clinic S", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat P", referral_source: "Dr Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/pdmp-checks"
              payload: { patient_id: "${patient_id}", queried_by_provider_id: "${prescriber_id}", outcome: "CLEAR" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { qutc: $.data.queried_utc }
          assert:
            - "PdmpCheck.queried_utc == 2026-05-01T00:00:00Z"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: schedule_intake_from_intake_scheduled_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Patient.REFERRED_to_INTAKE_SCHEDULED
          - "errors[ERR_PATIENT_STATE_INVALID]"
        distinguishing_aspect: "Calling schedule-intake on a patient already INTAKE_SCHEDULED returns ERR_PATIENT_STATE_INVALID (409); status unchanged."
        test_recipe:
          setup: ["Patient in INTAKE_SCHEDULED"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C SM1", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat SM1", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-10T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-11T00:00:00Z" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PATIENT_STATE_INVALID"
            - "Patient.${patient_id}.status == INTAKE_SCHEDULED"

      - name: discharged_patient_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Patient.ACTIVE_to_DISCHARGED
          - "errors[ERR_PATIENT_STATE_INVALID]"
        distinguishing_aspect: "A DISCHARGED patient cannot be discharged again; POST discharge returns ERR_PATIENT_STATE_INVALID (409)."
        test_recipe:
          setup: ["Patient DISCHARGED (activated via a routed MEDICATION plan, no active Rx, then discharged)"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C SM2", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat SM2", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/discharge"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/discharge"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PATIENT_STATE_INVALID"
            - "Patient.${patient_id}.status == DISCHARGED"

      - name: complete_intake_before_due_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Patient.INTAKE_SCHEDULED_to_INTAKE_COMPLETE
          - "errors[ERR_INTAKE_NOT_DUE]"
        distinguishing_aspect: "complete-intake while clinic.current_utc (2026-05-01) < intake_utc (2026-06-01) returns ERR_INTAKE_NOT_DUE (409)."
        test_recipe:
          setup: ["Patient INTAKE_SCHEDULED with intake_utc 2026-06-01; clock at default 2026-05-01"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C SM3", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat SM3", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INTAKE_NOT_DUE"
            - "Patient.${patient_id}.status == INTAKE_SCHEDULED"

      - name: activate_patient_without_active_plan_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Patient.INTAKE_COMPLETE_to_ACTIVE
          - "errors[ERR_NO_ACTIVE_PLAN]"
        distinguishing_aspect: "activate on an INTAKE_COMPLETE patient with no ACTIVE/routed treatment plan returns ERR_NO_ACTIVE_PLAN (409)."
        test_recipe:
          setup: ["Patient INTAKE_COMPLETE, no treatment plans"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C SM4", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat SM4", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_ACTIVE_PLAN"
            - "Patient.${patient_id}.status == INTAKE_COMPLETE"

      - name: route_plan_modality_mismatch_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TreatmentPlan.ACTIVE_to_PROCEDURE_PATH
          - "errors[ERR_PLAN_MODALITY_MISMATCH]"
        distinguishing_aspect: "A MEDICATION plan routed as a procedure path (or vice versa) is not the concern; route is auto-branched by modality, but a plan not in ACTIVE fails ERR_PLAN_STATE_INVALID — here a MEDICATION plan routes to MEDICATION_PATH successfully, confirming the fork branch selection."
        test_recipe:
          setup: ["ACTIVE MEDICATION plan"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C SM5", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat SM5", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { st: $.data.status }
          assert:
            - "TreatmentPlan.${plan_id}.status == MEDICATION_PATH"
            - "TreatmentPlan.${plan_id}.requires_medication == true"

      - name: agreement_counter_sign_sets_expiry
        claim_type: Side Effect Execution
        grounds: [state_machines.OpioidAgreement.DRAFT_to_ACTIVE, entities.OpioidAgreement.fields.expires_utc, calculations.agreement_expiry]
        distinguishing_aspect: "counter-sign at clock 2026-06-01 sets signed_utc=2026-06-01T00:00:00Z and expires_utc=2027-06-01T00:00:00Z (signed + 365 days)."
        test_recipe:
          setup: ["Patient exists; DRAFT agreement; clock 2026-06-01"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C SM6", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat SM6", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/opioid-agreements"
              payload: { patient_id: "${patient_id}", prescriber_id: "${prescriber_id}" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { agreement_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/opioid-agreements/${agreement_id}/counter-sign"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { exp: $.data.expires_utc }
          assert:
            - "OpioidAgreement.${agreement_id}.status == ACTIVE"
            - "OpioidAgreement.${agreement_id}.signed_utc == 2026-06-01T00:00:00Z"
            - "OpioidAgreement.${agreement_id}.expires_utc == 2027-06-01T00:00:00Z"

      - name: agreement_revoke_suspend_cascade_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.OpioidAgreement.ACTIVE_to_REVOKED, state_machines.Prescription.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / uds_inconsistent_flag_suspend_ledger_depth3
          rationale: "The suspend-and-ledger-move cascade side-effect chain is exercised by the depth-3 §1.8 instance (via the UDS-inconsistent trigger); the revoke trigger shares the identical Prescription ACTIVE->SUSPENDED cascade grounding."

  # ===========================================================================
  - section: calculations
    instances:
      - name: provisional_med_correct_result_covered
        claim_type: Correct Result
        grounds: [calculations.provisional_daily_med]
        excluded_because:
          difficulty_instance: dual_variant_calc / rx_provisional_vs_final_med_diverge
          rationale: "provisional_daily_med == 135.00 is asserted literally in the dual-variant §1.8 instance."

      - name: final_med_chronological_covered
        claim_type: Variant Divergence
        grounds: [calculations.final_daily_med]
        excluded_because:
          difficulty_instance: dual_variant_calc / rx_provisional_vs_final_med_diverge
          rationale: "final_daily_med chronological scaling to 45.00 is asserted in the dual-variant §1.8 instance."

      - name: patient_med_aggregate_two_active_rx
        claim_type: Correct Result
        grounds: [calculations.patient_daily_med_aggregate, entities.Patient.fields.current_daily_med_mg]
        distinguishing_aspect: "With two ACTIVE below-threshold prescriptions (provisional 20 and 30), Patient.current_daily_med_mg aggregates to 50.00."
        test_recipe:
          setup: ["Patient ACTIVE with routed MEDICATION plan; two ACTIVE Rx provisional 20 and 30"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C CALC1", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat CALC1", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-05-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/complete-intake"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions"
              payload: { prescriber_id: "${prescriber_id}", drug_name: "tramadol", dose_mg: 5, units_per_day: 4, conversion_factor: 1.0, day_supply: 30, pills_dispensed: 120 }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { rx1_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx1_id}/activate"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions"
              payload: { prescriber_id: "${prescriber_id}", drug_name: "codeine", dose_mg: 15, units_per_day: 2, conversion_factor: 1.0, day_supply: 30, pills_dispensed: 60 }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { rx2_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/prescriptions/${rx2_id}/activate"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
          assert:
            - "Patient.${patient_id}.current_daily_med_mg == 50.00"
            - "ControlledSubstanceLedger[patient=${patient_id}].total_active_med_mg == 50.00"

      - name: agreement_expired_blocks_activation
        claim_type: Constants Applied
        grounds:
          - calculations.agreement_expiry
          - "validations[priority=9]"
          - entities.OpioidAgreement.fields.expires_utc
        distinguishing_aspect: "An agreement counter-signed at 2026-06-01 (expires 2027-06-01) is EXPIRED once clock is set to 2027-06-01 (>= expires_utc, strict <); activating an above-threshold Rx then fails ERR_OPIOID_AGREEMENT_REQUIRED."
        test_recipe:
          setup: ["Above-threshold PROPOSED Rx with fresh PDMP, approved prior-auth, agreement ACTIVE but clock advanced to exactly its expiry"]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "C CALC2", state_code: "CA" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { clinic_id: "${clinic_id}", to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/providers"
              payload: { full_name: "Dr Rx", dea_number: "BX1234567", role_kind: "PRESCRIBER" }
              as: ClinicAdmin
              captures: { prescriber_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Pat CALC2", referral_source: "Ref" }
              as: IntakeCoordinator
              captures: { patient_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans"
              payload: { modality: "MEDICATION" }
              as: Prescriber
              as_user_id: "${prescriber_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/approve"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/treatment-plans/${plan_id}/route"
              payload: {}
              as: Prescriber
              as_user_id: "${prescriber_id}"
            - call: "POST /clinics/${clinic_id}/patients/${patient_id}/schedule-intake"
              payload: { intake_utc: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
