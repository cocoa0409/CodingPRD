              payload: {}
              as: OperationsCoordinator
            - call: "POST /dmc/program-elements/${el_id}/mark-ready"
              payload: {}
              as: OperationsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T14:30:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/program-elements/${el_id}/deliver"
              payload: { actual_headcount: 50 }
              as: OperationsCoordinator
            - call: "POST /dmc/programs/${prog_id}/reconcile"
              payload: {}
              as: ProgramDirector
            - call: "GET /dmc/reconciliation-lines?program_id=${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { line_id: "$.data[0].id" }
            - call: "POST /dmc/reconciliation-lines/${line_id}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/programs/${prog_id}/issue-invoice"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "GET /dmc/supplier-contracts/${ctr_id}"
              payload: {}
              as: Controller
              captures: { ctr_v: $.data.version }
            - call: "POST /dmc/settlement-payments"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", contract_id: "${ctr_id}", expected_contract_version: "${ctr_v}" }
              as: Controller
              as_user_id: "ctrl-1"
              captures: { pay_id: $.data.id, net: $.data.net_payable_cents }
          trigger:
            - call: "POST /dmc/settlement-payments/${pay_id}/approve"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /dmc/settlement-payments/${pay_id}/void"
              payload: { void_reason: "Supplier reissued the invoice with corrected banking details." }
              as: Controller
              as_user_id: "ctrl-1"
          assert:
            - "SettlementPayment.${pay_id}.gross_cents == 400000"
            - "SettlementPayment.${pay_id}.deposit_applied_cents == 120000"
            - "SettlementPayment.${pay_id}.net_payable_cents == 280000"
            - "SettlementPayment.${pay_id}.overpayment_credit_cents == 0"
            - "before the first trigger call Program.${prog_id}.supplier_gross_payable_cents == 400000, supplier_settled_cents == 0, supplier_open_payable_cents == 400000"
            - "after the first trigger call Program.${prog_id}.supplier_settled_cents == 280000 and Program.${prog_id}.supplier_open_payable_cents == 120000"
            - "after the first trigger call Program.${prog_id}.supplier_gross_payable_cents == 400000"
            - "after the second trigger call SettlementPayment.${pay_id}.status == VOID"
            - "after the second trigger call Program.${prog_id}.supplier_settled_cents == 0 and Program.${prog_id}.supplier_open_payable_cents == 400000"
            - "after the second trigger call Program.${prog_id}.supplier_gross_payable_cents == 400000"
            - "Program.${prog_id}.settlement_status == CLIENT_INVOICED (the void prevents the SETTLED bubble-up)"
            - "Program.${prog_id}.final_client_total_cents == 537600"
