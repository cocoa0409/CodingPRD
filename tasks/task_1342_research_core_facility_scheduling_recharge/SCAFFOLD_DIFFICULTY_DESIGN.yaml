            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-02T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b2: $.data.id } }
            - { call: "POST /bookings/${b2}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T09:00:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /bookings/${b1}/cancel", payload: {}, as: Researcher, as_user_id: "${u1}", captures: { pen1: $.data.penalty_cents, st1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:01Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b2}/cancel", payload: {}, as: Researcher, as_user_id: "${u1}", captures: { pen2: $.data.penalty_cents } }
          assert:
            - "Booking.${b1}.penalty_cents == 0 (notice exactly 1440 min == free window boundary, >= semantics)"
            - "Booking.${b2}.penalty_cents == 9000 (notice 1439 min: one minute inside the window)"
            - "Both bookings CANCELLED; exactly ONE PENALTY entry of 9000 cents exists in batch ${bat}"

      - name: grant_budget_exact_fit_at_validation
        grounds:
          - calculations.grant_budget_available
          - validations[priority=35]
        distinguishing_aspect: |
          Metric = grant cents on POST /usage-logs/{id}/validate (and the
          +1-over case on approve): a 15000-cent charge against exactly 15000
          available succeeds and flips the grant EXHAUSTED (<= 0 boundary),
          while a 6000-cent estimate against 1000 available fails with
          ERR_GRANT_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Canonical stack variant: grantA total exactly 15000, bookingA 2026-09-01 09:00-10:15 (75 min, estimate 15000) APPROVED then COMPLETED with 75 actual minutes, usage log submitted; batch 2026-09 OPEN"
            - "grantB total 16000; bookingB1 2026-09-02 09:00-10:15 APPROVED (estimate 15000, leaving 1000); bookingB2 2026-09-03 09:00-09:30 REQUESTED (estimate would be 6000)"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-A", pi_user_id: "${u1}", title: "Exact fit", budget_total_cents: 15000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { gA: $.data.id } }
            - { call: "POST /grants", payload: { grant_code: "NIH-B", pi_user_id: "${u1}", title: "Overflow", budget_total_cents: 16000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { gB: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${gA}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:15:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { bA: $.data.id } }
            - { call: "POST /bookings/${bA}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${gB}", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-02T10:15:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { bB1: $.data.id } }
            - { call: "POST /bookings/${bB1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${gB}", start_at: "2026-09-03T09:00:00Z", end_at: "2026-09-03T09:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { bB2: $.data.id } }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${bA}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:15:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${bA}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${bA}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:15:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ulA: $.data.id } }
            - { call: "POST /usage-logs/${ulA}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
