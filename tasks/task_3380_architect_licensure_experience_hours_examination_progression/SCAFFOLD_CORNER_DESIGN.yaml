          assert:
            - "error_id == ERR_WORK_PERIOD_INVALID for start == end"
      - name: reassign_window_45_day_boundary
        claim_type: boundary_edge
        grounds: ["validations[priority=7]", "errors[ERR_REASSIGN_WINDOW_NOT_OPEN]", "state_machines.ExperienceReport.SUBMITTED_to_SUBMITTED"]
        distinguishing_aspect: "Reassignment opens exactly at submitted date + 45 days: day 44 fails ERR_REASSIGN_WINDOW_NOT_OPEN, day 45 succeeds and PRESERVES submitted_at and credit_pct."
        test_recipe:
          setup: ["R1 SUBMITTED at clock 2026-04-01 (credit_pct 100); supervisor S2 exists as a second ACTIVE supervisor"]
          setup_api_calls:
            - { call: "POST /licensure/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: NcarbAdministrator }
            - { call: "POST /licensure/jurisdictions", payload: { code: "J1", name: "Board One" }, as: NcarbAdministrator }
