      - name: invoice_dispute_reverses_contract_ytd_billed
        conserved_quantity: "ClientContract.ytd_billed_cents == SUM(MonthlyInvoice.net_amount_cents) over that contract's invoices whose status IN {ISSUED, PAID}"
        forward_operation: "POST /monthly-invoices/{id}/issue — adds net_amount_cents to the contract's year-to-date billed total"
        compensating_operation: "POST /monthly-invoices/{id}/dispute — subtracts exactly the amount that was billed, returning the ledger to its pre-issue value"
        grounds:
          - state_machines.MonthlyInvoice[DRAFT -> ISSUED].side_effects
          - state_machines.MonthlyInvoice[ISSUED -> DISPUTED].side_effects
          - state_machines.MonthlyInvoice[DISPUTED -> DRAFT].side_effects
          - entities.ClientContract.fields.ytd_billed_cents
          - calculations.monthly_invoice_amounts
        distinguishing_aspect: |
          Conserved quantity = a FISCAL LEDGER on ClientContract, and the cycle here
          is round-trippable rather than one-shot: issue adds, dispute subtracts,
          rebill returns the invoice to DRAFT (still not billed), and a second issue
          adds the same amount again. DRAFT and DISPUTED must both contribute zero,
          payment must contribute nothing extra on top of the issue, and rebill_count
          must advance while the ledger returns to exactly its earlier value — a
          different conservation law from the incentive-point ledger, which is
          strictly decrement-on-undo.
        test_recipe:
          setup:
            - "ACTIVE COST_PLUS contract (not_to_exceed_cents 5000000, ytd_billed_cents 0) with Studio A OPEN and a READY AED."
