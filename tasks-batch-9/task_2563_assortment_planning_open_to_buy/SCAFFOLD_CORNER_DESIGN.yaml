            - "that second rejection is neither ERR_VENDOR_NOT_AUTHORIZED (${v2_status} == AUTHORIZED, and priority 13 only guards commit anyway) nor ERR_VENDOR_NOT_AUTHORIZED_FOR_CATEGORY (${auth2_status} == ACTIVE for DRSS) - clause 2 is the only unsatisfied condition"
            - "${ok_a_commit} == PROPOSED: the control call differs from the second rejection in exactly one field, vendor_id, restored to ${item_a_vendor}"
            - "${ok_a2_vendor} == ${item_a2_vendor} == ${v2}: BRLS is perfectly usable once the item it is quoted against is the item that actually names it, which rules out any hidden one-vendor-per-plan rule"
            - "GET /otb/receipt-commitments filtered to plan_month_id ${m1_id} returns total_count 2 (${ok_a}, ${ok_a2}): the two mismatched attempts persisted nothing"

      - name: chase_approval_fails_the_last_check_and_unwinds_every_effect
        claim_type: cascading_validation
        grounds:
          - validations[priority=39].ERR_NO_FEASIBLE_RECEIPT_MONTH
          - calculations.chase_cancel_allocation
          - state_machines.ChaseCancelDecision.PROPOSED_to_APPROVED
        distinguishing_aspect: "Priority 39 is the deepest validation in the ladder: it can only be decided by RUNNING the allocation, so the request passes auth, role, referential, segregation-of-duties, decision state, cycle state and item state and is then rejected because the allocation happened to fund zero units. The infeasibility is purely temporal - every earlier chase input is still healthy (positive otb_open, ample vendor capacity, requested_units well under the affordable bucket) and only the logical clock has advanced past the point where any month's first_receipt_date can absorb the vendor's 45-day lead time. Because the rule aborts a transition that would otherwise have written four entities, the test asserts the full absence of side effects, and it contrasts that against an earlier, structurally identical approval that succeeded."
