  - rule_id: boundary_precision_check
    instances:
      - name: advance_window_day_count_exact_at_59_60_and_61_days_on_reservation_create
        grounds:
          - endpoints["POST /reservations"]
          - validations[priority=31]
          - entities.MembershipTier.fields.advance_window_days
        distinguishing_aspect: |
          Boundary metric: the integer day count between the logical current date and arrival_date,
          checked against MembershipTier.advance_window_days on POST /reservations. Three
          memberships book at 59, 60 and 61 days out from the frozen clock; 60 (threshold) must be
