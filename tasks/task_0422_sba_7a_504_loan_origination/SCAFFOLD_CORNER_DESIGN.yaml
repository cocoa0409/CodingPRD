# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: walks references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1–§1.7. Every active instance is executable from empty-DB via §1.5 endpoints;
# corners already exercised by a §1.8 instance are emitted as excluded_because stubs.
#
# Canonical ids: SbaOfficer (opaque), LoanOfficer (opaque, X-User-ID "officer-1"),
# CreditApprover (opaque, X-User-ID "approver-1"), InvestorServicer (opaque).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_lender_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Lender
          - endpoints
        distinguishing_aspect: "POST /sba/lenders with {name, program} returns 201 and an entity with server-minted id, created_at, version=1, ongoing_fee_pool_cents=0, sold_guaranty_balance_cents=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sba/lenders"
              payload: { name: "Echo CDC", program: "504" }
              as: SbaOfficer
              captures: { lid: $.data.id, ver: $.data.version, pool: $.data.ongoing_fee_pool_cents }
          assert:
            - "HTTP 201; response_type == object"
            - "Lender.${lid}.version == 1; ongoing_fee_pool_cents == 0; sold_guaranty_balance_cents == 0; program == 504"

      - name: get_application_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Application
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /sba/applications/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no application with this id)."]
          setup_api_calls: []
          trigger:
            - call: "GET /sba/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SbaOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: create_borrower_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Borrower
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sba/borrowers omitting required naics_code returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Lender exists."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Req CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "NoNaics LLC", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (HTTP 400); naics_code missing"

      - name: borrower_default_eligible_true_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Borrower.fields.is_eligible_business_type
        distinguishing_aspect: "Omitting is_eligible_business_type defaults it to true on the created Borrower."
        test_recipe:
          setup: ["A Lender exists."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Def CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Def LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { elig: $.data.is_eligible_business_type }
          assert:
            - "Borrower.is_eligible_business_type == true (default applied)"

      - name: proceeds_is_fixed_asset_computed_from_use_category
        claim_type: Computed Fields
        grounds:
          - entities.ProceedsLineItem.fields.is_fixed_asset
        distinguishing_aspect: "A ProceedsLineItem with use_category EQUIPMENT has is_fixed_asset computed true regardless of client input."
        test_recipe:
          setup: ["A DRAFT Application exists under a Lender/Borrower."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Fx CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Fx LLC", naics_code: "333120", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /sba/proceeds"
              payload: { application_id: "${aid}", use_category: "EQUIPMENT", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fa: $.data.is_fixed_asset }
          assert:
            - "ProceedsLineItem.is_fixed_asset == true (EQUIPMENT is a fixed asset)"

      - name: create_application_invalid_enum_program_irrelevant_guaranty_pct_over_cap
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.guaranty_pct
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /sba/applications with guaranty_pct 0.95 (> 0.90 cap) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Lender and Borrower exist."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Tc CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Tc LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.95, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (guaranty_pct exceeds 0.90 cap)"

      - name: application_fk_borrower_unknown_returns_invalid_request
        claim_type: Parent Relationships
        grounds:
          - entities.Application.fields.borrower_id
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Flat-topology FK integrity: POST /sba/applications with an unknown borrower_id is rejected ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Lender exists but the referenced borrower_id does not."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Fk CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /sba/applications"
              payload: { borrower_id: "11111111-1111-4111-8111-111111111111", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (unknown borrower_id FK target)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: authorize_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.APPROVED_to_AUTHORIZED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Authorizing a DRAFT Application (never approved) returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A DRAFT Application that has not been submitted/approved."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Is CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Is LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /sba/applications/${aid}/authorize"
              payload: {}
              as: SbaOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (DRAFT is not APPROVED)"
            - "Application.${aid}.status remains DRAFT; guaranteed_amount_cents == 0"

      - name: withdrawn_application_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After WITHDRAWN (terminal), a submit attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT Application that is then WITHDRAWN."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Wd CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Wd LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${aid}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${aid}/withdraw"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /sba/applications/${aid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (WITHDRAWN is terminal)"
            - "Application.${aid}.status remains WITHDRAWN"

      - name: new_application_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Application
          - entities.Application.fields.status
        distinguishing_aspect: "A freshly created Application has status DRAFT, servicing_status NOT_SERVICING, guaranty_status RETAINED."
        test_recipe:
          setup: ["A Lender and Borrower exist."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Init CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Init LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, ss: $.data.servicing_status, gs: $.data.guaranty_status }
          assert:
            - "Application.status == DRAFT; servicing_status == NOT_SERVICING; guaranty_status == RETAINED"

      - name: submit_with_no_proceeds_returns_no_proceeds
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.DRAFT_to_UNDERWRITING
          - errors[ERR_NO_PROCEEDS]
        distinguishing_aspect: "Submitting a DRAFT Application with zero ProceedsLineItem rows returns ERR_NO_PROCEEDS (409)."
        test_recipe:
          setup: ["A DRAFT Application with no proceeds."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Np CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Np LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /sba/applications/${aid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_PROCEEDS (HTTP 409)"
            - "Application.${aid}.status remains DRAFT"

      - name: submit_proceeds_sum_mismatch_returns_proceeds_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.DRAFT_to_UNDERWRITING
          - errors[ERR_PROCEEDS_MISMATCH]
        distinguishing_aspect: "Submitting when sum of proceeds (40000000) != requested_amount_cents (50000000) returns ERR_PROCEEDS_MISMATCH (422)."
        test_recipe:
          setup: ["A DRAFT Application requested 50000000 with a single proceeds line of 40000000."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Pm CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Pm LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${aid}", use_category: "WORKING_CAPITAL", amount_cents: 40000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /sba/applications/${aid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROCEEDS_MISMATCH (HTTP 422)"

      - name: form_package_submit_incomplete_returns_form_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FormPackage.INCOMPLETE_to_SUBMITTED
          - errors[ERR_FORM_INCOMPLETE]
        distinguishing_aspect: "Submitting a FormPackage with form_1920_complete=false returns ERR_FORM_INCOMPLETE (409)."
        test_recipe:
          setup: ["A FormPackage with 1919 complete but 1920 not complete."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Fi CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Fi LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
            - call: "POST /sba/form-packages"
              payload: { application_id: "${aid}", form_1919_complete: true, form_1920_complete: false, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fpid: $.data.id }
          trigger:
            - call: "POST /sba/form-packages/${fpid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORM_INCOMPLETE (HTTP 409)"
            - "FormPackage.${fpid}.status remains INCOMPLETE"

      - name: approve_declined_recommendation_returns_memo_not_approvable
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.PENDING_APPROVAL_to_APPROVED
          - errors[ERR_MEMO_NOT_APPROVABLE]
        distinguishing_aspect: "Approving when the SUBMITTED CreditMemo.recommendation==DECLINE returns ERR_MEMO_NOT_APPROVABLE (409)."
        test_recipe:
          setup: ["A loan in PENDING_APPROVAL whose submitted memo recommends DECLINE."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Mna CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Mna LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${aid}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${aid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${aid}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${aid}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fpid: $.data.id }
            - call: "POST /sba/form-packages/${fpid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fpid}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${aid}", dscr: 0.90, risk_rating: 7, recommendation: "DECLINE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cmid: $.data.id }
            - call: "POST /sba/credit-memos/${cmid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /sba/applications/${aid}/approve"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMO_NOT_APPROVABLE (HTTP 409)"
            - "Application.${aid}.status remains PENDING_APPROVAL"

      - name: declare_default_not_delinquent_enough_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.DELINQUENT_to_DEFAULTED
          - errors[ERR_NOT_DELINQUENT_ENOUGH]
        distinguishing_aspect: "Declaring default while the latest accepted report shows days_past_due 75 (< 90) returns ERR_NOT_DELINQUENT_ENOUGH (409)."
        test_recipe:
          setup: ["AUTHORIZED, fully-disbursed loan whose only accepted report has days_past_due 75 -> servicing_status DELINQUENT (>=60) but not default-eligible (<90)."]
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Nde CDC", program: "7A" }
              as: SbaOfficer
              captures: { lid: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lid}", legal_name: "Nde LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { bid: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${bid}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { aid: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${aid}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${aid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${aid}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${aid}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fpid: $.data.id }
            - call: "POST /sba/form-packages/${fpid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fpid}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${aid}", dscr: 1.35, risk_rating: 3, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cmid: $.data.id }
            - call: "POST /sba/credit-memos/${cmid}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${aid}/approve"
