      - name: serial_sequence_follows_label_call_order_not_creation_order
        claim_type: correct_result
        grounds:
          - calculations.unit_serial_assignment
          - entities.HeaterUnit.fields.serial_number
          - entities.ProductModel.fields.label_serial_prefix
          - state_machines.HeaterUnit.ASSEMBLED_to_LABELED
        distinguishing_aspect: >
          The sequence counts already-serialled siblings at the moment of labelling, so labelling the
          third-created unit first must hand it 00001. An implementation that orders by created_at, by id, or that
          stores a counter on the lot rather than on the (model, period) pair assigns the numbers in the wrong
          order. The prefix is the model_code minted at certification approval, and the period is compacted by
          dropping the hyphen.
