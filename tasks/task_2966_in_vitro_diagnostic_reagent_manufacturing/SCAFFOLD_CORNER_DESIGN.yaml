              payload: { product_code: "IVD-CA-19", reference_material_code: "REF-CA19", required_material_codes: ["AB-CA-19"], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 30 }
