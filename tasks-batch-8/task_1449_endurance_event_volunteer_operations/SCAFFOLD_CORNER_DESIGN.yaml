            - { call: "POST /volunteer-ops/volunteers/${vr}/screen", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${vn}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${vr}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sgr: $.data.id, sgr_st: $.data.status } }
          assert:
            - "non-returning in early window -> 422 ERR_EARLY_ACCESS_RESTRICTED (${err})"
            - "returning in the same window -> 201 REQUESTED (${sgr_st}) — the retention program's early-access perk"
      - name: signup_window_closed_after_closes
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - ERR_SIGNUP_WINDOW_CLOSED
        distinguishing_aspect: "Pure temporal failure (no other rule failing): create at 2026-09-28 with everything else valid -> ERR_SIGNUP_WINDOW_CLOSED."
        test_recipe:
          setup: ["PUBLISHED event (no sweep run, so still PUBLISHED); ELIGIBLE adult volunteer; OPEN shift with free seats; clock 2026-09-28"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-28T00:00:00Z" }, as: EventDirector }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected 422 ERR_SIGNUP_WINDOW_CLOSED (${err}) — closes_at is exclusive at its exact instant too"
      - name: role_retire_with_active_signups_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - ERR_ROLE_IN_USE
        distinguishing_aspect: "Retiring a role whose shift holds a CONFIRMED signup -> ERR_ROLE_IN_USE; after the signup is cancelled, retire succeeds -> RETIRED."
        test_recipe:
          setup: ["role R with shift; V1 CONFIRMED on it"]
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /volunteer-ops/role-catalog-entries/${role}/retire", payload: {}, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/role-catalog-entries/${role}/retire", payload: {}, as: VolunteerCoordinator, captures: { st: $.data.status } }
          assert:
            - "retire with a CONFIRMED signup -> 409 ERR_ROLE_IN_USE (${err})"
            - "after cancel: retire succeeds, status == RETIRED (${st})"
      - name: min_age_pure_violation_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - ERR_MIN_AGE_NOT_MET
        excluded_because:
          difficulty_instance: age_boundary_exact_vs_one_day_short
          rationale: "17-year-old rejection asserted as the boundary-out leg of the named §1.8 instance."
      - name: segment_overlap_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - ERR_SEGMENT_MILE_OVERLAP
        excluded_because:
          difficulty_instance: segment_mile_half_open_adjacency
          rationale: "Overlap and both adjacency directions asserted in the named §1.8 instance."
      - name: volunteer_overlap_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - ERR_SHIFT_TIME_OVERLAP
        excluded_because:
          difficulty_instance: volunteer_shift_buffer_overlap
          rationale: "Buffer collision and exact-30-minute pass asserted in the named §1.8 instance."
      - name: out_of_stock_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - ERR_OUT_OF_STOCK
        excluded_because:
          difficulty_instance: stock_last_unit_then_out_of_stock
          rationale: "Last-unit success and zero-remaining rejection asserted in the named §1.8 instance."
      - name: capacity_reached_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - ERR_SHIFT_CAPACITY_REACHED
        excluded_because:
          difficulty_instance: headcount_exact_fill_waitlist_route
          rationale: "Boundary approve rejection and waitlist routing asserted in the named §1.8 instance."
      - name: priority_pairs_corner
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
        excluded_because:
          difficulty_instance: approve_state_beats_safety_on_cancelled_signup
          rationale: "All three dual-failure priority orderings (state>safety, safety>temporal, temporal>constraint) asserted across the three §1.8 priority instances."

