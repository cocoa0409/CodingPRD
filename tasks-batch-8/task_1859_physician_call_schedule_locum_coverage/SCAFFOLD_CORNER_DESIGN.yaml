  - section: validations
    instances:
      - name: missing_auth_context_header_returns_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without the X-User-Role header fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role/existence logic."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/call-programs"
              as: SchedulerAdmin
              omit_headers: ["X-User-Role"]
              captures: { err: $.data.error_id }
          assert:
            - "rejected with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (captured ${err}), http 400"

      - name: physician_cannot_publish_program_role_denied_beats_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
        distinguishing_aspect: "A Physician calling publish on a NON-EXISTENT program id gets ERR_FORBIDDEN (priority 2), proving role authorization runs before existence (priority 5) — not ERR_PROGRAM_NOT_FOUND."
        test_recipe:
