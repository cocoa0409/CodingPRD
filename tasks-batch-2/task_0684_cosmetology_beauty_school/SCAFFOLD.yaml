scenario: "Cosmetology & Beauty School: program & clock-hour/credit tracking, kit & tuition (Title IV aid) disbursement, clinic-floor service hours & client POS, state-board exam readiness & application, attendance/SAP & make-up, instructor & station, placement reporting, refund/withdrawal"
domain_name: cosmetology-beauty-school
api_prefix: /school

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: hybrid
  # Enrollment is the central resource that aggregates a tree of children
  # (attendance, disbursements, clinic tickets, exam application, withdrawal)
  # while StationAssignment cross-cuts Instructor and Station (flat FK peers).

  state_machine_shape: branching
  # Enrollment forks ACTIVE -> {SAP_WARNING, WITHDRAWN, GRADUATED, EXAM_PENDING}
  # with divergent side-effect sets; ExamApplication has a revision cycle.

  relationship_patterns:
    - one_to_many       # Enrollment -> AttendanceRecord, ClinicTicket, Disbursement
    - cross_aggregate   # StationAssignment references Instructor + Station + Enrollment
    - many_to_many      # StationAssignment is the junction of Station and Enrollment over a time window

  role_model: peer_roles
  # Registrar owns enrollment/ledger; FinancialAidOfficer owns disbursement/refund;
  # Instructor owns attendance/clinic sign-off/station; Student acts on own records.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Program title, e.g. "Cosmetology 1500"
      - name: total_clock_hours
        type: integer
        source: input
        description: Total scheduled clock hours required to graduate (e.g. 1500)
        constraints: ">= 1"
      - name: tuition_cents
        type: integer
        source: input
        description: Full tuition charged at enrollment, in cents
        constraints: ">= 0"
      - name: kit_fee_cents
        type: integer
        source: input
        description: Kit charge billed at enrollment, in cents
        constraints: ">= 0"
      - name: lab_fee_cents
        type: integer
        source: input
        description: Lab/registration fee billed at enrollment, in cents
        constraints: ">= 0"
      - name: clock_hours_per_credit
        type: number
        source: input
        description: Clock-to-credit equivalency divisor (default 37.5)
        default: 37.5
        constraints: "> 0"
      - name: clinic_phase_start_hour
        type: integer
        source: input
        description: Cumulative clock-hour at which a student may begin clinic-floor work
        constraints: ">= 0"
      - name: credit_hours
        type: integer
        source: computed
        description: floor(total_clock_hours / clock_hours_per_credit); see CALC clock_to_credit
      - name: admin_fee_cap_cents
        type: integer
        source: input
        description: Maximum institutional administrative fee retained on withdrawal, in cents
        default: 15000
        constraints: ">= 0"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Student legal name
      - name: email
        type: string
        source: input
        description: Contact email, unique among students
        constraints: "unique"
      - name: ssn_last4
        type: string
        source: input
        description: Last four of SSN, used for Title IV / state-board identity
      - name: status
        type: enum
        source: system
        description: Lifecycle status
        default: PROSPECT
        constraints: "one of PROSPECT, ENROLLED, ARCHIVED"

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Instructor legal name
      - name: license_number
        type: string
        source: input
        description: State instructor license number, unique
        constraints: "unique"
      - name: license_expires_on
        type: datetime
        source: input
        description: ISO date the instructor license expires; sign-off forbidden once past
      - name: active
        type: boolean
        source: input
        description: Whether the instructor is currently on staff
        default: true

  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Floor station label, e.g. "Styling-12"
      - name: station_type
        type: enum
        source: input
        description: Capability of the station
        constraints: "one of HAIR, NAIL, SKIN, MAKEUP"
      - name: status
        type: enum
        source: system
        description: Availability state
        default: AVAILABLE
        constraints: "one of AVAILABLE, OCCUPIED, OUT_OF_SERVICE"

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the enrolled student"
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program of study"
      - name: enrolled_on_iso
        type: datetime
        source: input
        description: ISO date enrollment begins; basis for payment-period weeks
      - name: status
        type: enum
        source: system
        description: Enrollment lifecycle state (see state machine)
        default: ACTIVE
        constraints: "one of ACTIVE, SAP_WARNING, EXAM_PENDING, GRADUATED, WITHDRAWN"
      - name: scheduled_hours_to_date
        type: integer
        source: input
        description: Scheduled clock hours the student should have attended as of now (drives R2T4 and SAP scheduled denominator)
        default: 0
        constraints: ">= 0"
      - name: actual_hours
        type: number
        source: computed
        description: Sum of approved AttendanceRecord.hours plus approved ClinicTicket clinic hours; see CALC actual_hours_accrual
      - name: pace_pct
        type: number
        source: computed
        description: actual_hours / scheduled_hours_to_date * 100; see CALC sap_pace
      - name: total_charges_cents
        type: integer
        source: computed
        description: tuition_cents + kit_fee_cents + lab_fee_cents from the program at enrollment time
      - name: total_credits_cents
        type: integer
        source: computed
        description: Sum of POSTED Disbursement.net_amount_cents plus recorded cash payments; see CALC ledger_balance
      - name: ledger_balance_cents
        type: integer
        source: computed
        description: total_charges_cents - total_credits_cents; positive means student owes; FINAL (posted-only) basis. See CALC ledger_balance.
      - name: projected_balance_cents
        type: integer
        source: computed
        description: total_charges_cents - (POSTED + SCHEDULED net) projected credits; PROVISIONAL basis. See CALC projected_ledger.
      - name: sap_warning_count
        type: integer
        source: system
        description: Number of times this enrollment has entered SAP_WARNING
        default: 0
      - name: last_attendance_iso
        type: datetime
        source: system
        description: ISO date of the most recent APPROVED attendance/clinic event; the R2T4 withdrawal date basis
      - name: placement_status
        type: enum
        source: system
        description: Post-graduation employment outcome used by the placement report
        default: UNREPORTED
        constraints: "one of UNREPORTED, PLACED, UNPLACED, EXCLUDED"

  - name: AttendanceRecord
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; owning enrollment"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; instructor who recorded the session"
      - name: session_date_iso
        type: datetime
        source: input
        description: ISO date of the session
      - name: scheduled_hours
        type: number
        source: input
        description: Hours scheduled for this session
        constraints: "> 0"
      - name: hours
        type: number
        source: input
        description: Actual clock hours attended this session (0 if absent)
        constraints: ">= 0"
      - name: record_type
        type: enum
        source: input
        description: Whether theory/lecture or a make-up session
        default: REGULAR
        constraints: "one of REGULAR, MAKEUP"
      - name: status
        type: enum
        source: system
        description: Approval state (see state machine)
        default: PENDING
        constraints: "one of PENDING, APPROVED, VOIDED"

  - name: ClinicTicket
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the student performing the service"
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station occupied for the service"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; supervising instructor who signs off"
      - name: client_name
        type: string
        source: input
        description: Walk-in client name
      - name: start_iso
        type: datetime
        source: input
        description: ISO start timestamp of the service slot
      - name: end_iso
        type: datetime
        source: input
        description: ISO end timestamp of the service slot (exclusive)
      - name: line_items
        type: array
        source: input
        description: Array of {service_code, salon_price_cents} entries performed
      - name: clinic_discount_pct
        type: number
        source: input
        description: Fractional clinic discount off salon price (default 0.50)
        default: 0.50
        constraints: ">= 0 and <= 1"
      - name: ticket_total_cents
        type: integer
        source: computed
        description: Sum of per-line discounted prices; see CALC clinic_pos_total
      - name: clinic_hours
        type: number
        source: computed
        description: (end_iso - start_iso) in hours rounded to 2dp; credited to enrollment on sign-off
      - name: status
        type: enum
        source: system
        description: Ticket lifecycle (see state machine)
        default: OPEN
        constraints: "one of OPEN, SIGNED_OFF, PAID, VOIDED"

  - name: StationAssignment
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; the reserved station"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; student holding the station"
      - name: instructor_id
        type: string
        source: input
        description: "FK -> Instructor.id; supervising instructor for the slot"
      - name: start_iso
        type: datetime
        source: input
        description: ISO start of the reservation window
      - name: end_iso
        type: datetime
        source: input
        description: ISO end of the reservation window (exclusive)
      - name: status
        type: enum
        source: system
        description: Reservation state
        default: RESERVED
        constraints: "one of RESERVED, RELEASED"

  - name: Disbursement
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the aided enrollment"
      - name: payment_period
        type: integer
        source: input
        description: Title IV payment period ordinal (1 or 2)
        constraints: "one of 1, 2"
      - name: period_hours
        type: integer
        source: input
        description: Scheduled clock hours that must be completed to earn this period
        constraints: ">= 1"
      - name: period_weeks
        type: integer
        source: input
        description: Instructional weeks that must elapse to earn this period
        constraints: ">= 1"
      - name: gross_amount_cents
        type: integer
        source: input
        description: Gross Title IV award for this period, in cents
        constraints: ">= 0"
      - name: origination_fee_cents
        type: integer
        source: input
        description: Loan origination fee withheld, in cents
        default: 0
        constraints: ">= 0"
      - name: net_amount_cents
        type: integer
        source: computed
        description: gross_amount_cents - origination_fee_cents; credited to ledger on POST
      - name: status
        type: enum
        source: system
        description: Disbursement lifecycle (see state machine)
        default: SCHEDULED
        constraints: "one of SCHEDULED, POSTED, RETURNED"

  - name: ExamApplication
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the candidate enrollment"
      - name: exam_type
        type: enum
        source: input
        description: State-board exam being applied for
        constraints: "one of WRITTEN, PRACTICAL"
      - name: mock_exam_avg
        type: number
        source: input
        description: Average of mock exam scores 0-100
        constraints: ">= 0 and <= 100"
      - name: competency_signoff_pct
        type: number
        source: input
        description: Percent of required competencies signed off, 0-100
        constraints: ">= 0 and <= 100"
      - name: readiness_score
        type: number
        source: computed
        description: Weighted readiness score; see CALC exam_readiness_score
      - name: status
        type: enum
        source: system
        description: Application lifecycle (revision cycle; see state machine)
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, RETURNED_FOR_REVISION, APPROVED, SCHEDULED, PASSED, FAILED"

  - name: Withdrawal
    parent: Enrollment
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the withdrawing enrollment"
      - name: withdrawal_type
        type: enum
        source: input
        description: Whether official (student-initiated) or unofficial (admin determination)
        constraints: "one of OFFICIAL, UNOFFICIAL"
      - name: last_date_of_attendance_iso
        type: datetime
        source: input
        description: ISO date used as the withdrawal date for R2T4
      - name: pct_completed
        type: number
        source: computed
        description: scheduled_hours_to_date / program.total_clock_hours * 100; R2T4 completion percentage
      - name: title_iv_return_cents
        type: integer
        source: computed
        description: Title IV funds to return; see CALC r2t4_return
      - name: institutional_refund_cents
        type: integer
        source: computed
        description: Institutional tuition refund owed to student; see CALC institutional_refund
      - name: status
        type: enum
        source: system
        description: Withdrawal processing state
        default: CALCULATED
        constraints: "one of CALCULATED, FINALIZED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [GRADUATED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: SAP_WARNING
        trigger: "POST /school/enrollments/{id}/evaluate-sap"
        actor: Registrar
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "computed pace_pct < 67 (CALC sap_pace, < strictly below the 67.00 threshold)"
        side_effects:
          - "Enrollment.status = SAP_WARNING"
          - "Enrollment.sap_warning_count incremented by 1"
          - "increments Enrollment.version by 1"
        note: "67.00 exactly is NOT a warning (>= passes)."
      - from: SAP_WARNING
        to: ACTIVE
        trigger: "POST /school/enrollments/{id}/evaluate-sap"
        actor: Registrar
        preconditions:
          - "Enrollment.status == SAP_WARNING"
          - "computed pace_pct >= 67 (CALC sap_pace)"
        side_effects:
          - "Enrollment.status = ACTIVE"
          - "increments Enrollment.version by 1"
        note: "Recovery from warning when pace is restored."
      - from: ACTIVE
        to: EXAM_PENDING
        trigger: "POST /school/exam-applications/{id}/approve (cross-entity)"
        actor: Registrar
        preconditions:
          - "Enrollment.status == ACTIVE"
          - "the approved ExamApplication.enrollment_id == this Enrollment.id"
        side_effects:
          - "Enrollment.status = EXAM_PENDING"
          - "increments Enrollment.version by 1"
        note: "Bubble-up from ExamApplication approval."
      - from: EXAM_PENDING
        to: GRADUATED
        trigger: "POST /school/exam-applications/{id}/record-result (result PASSED, cross-entity)"
        actor: Registrar
        preconditions:
          - "Enrollment.status == EXAM_PENDING"
          - "actual_hours >= program.total_clock_hours"
          - "Enrollment.ledger_balance_cents <= 0"
        side_effects:
          - "Enrollment.status = GRADUATED"
          - "all RESERVED StationAssignment for this enrollment -> RELEASED (cascade)"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /school/withdrawals/{id}/finalize (cross-entity)"
        actor: FinancialAidOfficer
        preconditions:
          - "Enrollment.status IN {ACTIVE, SAP_WARNING}"
          - "the finalized Withdrawal.enrollment_id == this Enrollment.id"
        side_effects:
          - "Enrollment.status = WITHDRAWN"
          - "every SCHEDULED Disbursement for this enrollment -> RETURNED (cascade down); each RETURN itself debits Enrollment.total_credits_cents and recomputes ledger_balance_cents (ledger sync)"
          - "every OPEN ClinicTicket for this enrollment -> VOIDED (cascade)"
          - "every RESERVED StationAssignment for this enrollment -> RELEASED (cascade)"
          - "increments Enrollment.version by 1"
      - from: SAP_WARNING
        to: WITHDRAWN
        trigger: "POST /school/withdrawals/{id}/finalize (cross-entity)"
        actor: FinancialAidOfficer
        preconditions:
          - "Enrollment.status == SAP_WARNING"
          - "the finalized Withdrawal.enrollment_id == this Enrollment.id"
        side_effects:
          - "Enrollment.status = WITHDRAWN"
          - "every SCHEDULED Disbursement for this enrollment -> RETURNED (cascade down); each RETURN debits Enrollment.total_credits_cents and recomputes ledger_balance_cents (ledger sync)"
          - "every OPEN ClinicTicket -> VOIDED; every RESERVED StationAssignment -> RELEASED (cascade)"
          - "increments Enrollment.version by 1"

  - entity: ExamApplication
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /school/exam-applications/{id}/submit"
        actor: Student
        preconditions:
          - "ExamApplication.status == DRAFT"
          - "owning Enrollment.status IN {ACTIVE, SAP_WARNING}"
        side_effects:
          - "recompute ExamApplication.readiness_score (CALC exam_readiness_score)"
          - "increments ExamApplication.version by 1"
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /school/exam-applications/{id}/return"
        actor: Registrar
        preconditions:
          - "ExamApplication.status == SUBMITTED"
          - "readiness_score < 80 OR competency_signoff_pct < 100 OR enrollment actual_hours < 0.90 * program.total_clock_hours"
        side_effects:
          - "increments ExamApplication.version by 1"
        note: "Revision cycle: bounce back to DRAFT-equivalent editing."
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /school/exam-applications/{id}/submit"
        actor: Student
        preconditions:
          - "ExamApplication.status == RETURNED_FOR_REVISION"
          - "owning Enrollment.status IN {ACTIVE, SAP_WARNING}"
        side_effects:
          - "recompute ExamApplication.readiness_score (CALC exam_readiness_score)"
          - "increments ExamApplication.version by 1"
        note: "Cyclic: SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /school/exam-applications/{id}/approve"
        actor: Registrar
        preconditions:
          - "ExamApplication.status == SUBMITTED"
          - "readiness_score >= 80"
          - "competency_signoff_pct == 100"
          - "enrollment actual_hours >= 0.90 * program.total_clock_hours"
          - "owning Enrollment.status == ACTIVE"
        side_effects:
          - "ExamApplication.status = APPROVED"
          - "owning Enrollment.status: ACTIVE -> EXAM_PENDING (cross-entity bubble-up)"
          - "increments ExamApplication.version by 1"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /school/exam-applications/{id}/schedule"
        actor: Registrar
        preconditions:
          - "ExamApplication.status == APPROVED"
        side_effects:
          - "increments ExamApplication.version by 1"
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /school/exam-applications/{id}/record-result"
        actor: Registrar
        preconditions:
          - "ExamApplication.status == SCHEDULED"
          - "result input == PASSED"
        side_effects:
          - "ExamApplication.status = PASSED"
          - "owning Enrollment.status: EXAM_PENDING -> GRADUATED (cross-entity, only if hours and ledger preconditions hold)"
          - "increments ExamApplication.version by 1"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /school/exam-applications/{id}/record-result"
        actor: Registrar
        preconditions:
          - "ExamApplication.status == SCHEDULED"
          - "result input == FAILED"
        side_effects:
          - "ExamApplication.status = FAILED"
          - "owning Enrollment.status: EXAM_PENDING -> ACTIVE (cross-entity revert; retake permitted)"
          - "increments ExamApplication.version by 1"

  - entity: AttendanceRecord
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /school/attendance/{id}/approve"
        actor: Instructor
        preconditions:
          - "AttendanceRecord.status == PENDING"
          - "recording Instructor.active == true"
          - "Instructor.license_expires_on > current clock time"
          - "owning Enrollment.status IN {ACTIVE, SAP_WARNING}"
        side_effects:
          - "AttendanceRecord.status = APPROVED"
          - "Enrollment.actual_hours recomputed (CALC actual_hours_accrual)"
          - "Enrollment.pace_pct recomputed (CALC sap_pace)"
          - "Enrollment.last_attendance_iso = max(current, session_date_iso)"
          - "increments Enrollment.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /school/attendance/{id}/void"
        actor: Registrar
        preconditions:
          - "AttendanceRecord.status == APPROVED"
        side_effects:
          - "AttendanceRecord.status = VOIDED"
          - "Enrollment.actual_hours recomputed downward by this record's hours (CALC actual_hours_accrual, compensation)"
          - "Enrollment.pace_pct recomputed (CALC sap_pace)"
          - "increments Enrollment.version by 1"
        note: "Compensation: voiding an approved record removes its hours; invariant actual_hours == sum of APPROVED contributions must hold."
      - from: PENDING
        to: VOIDED
        trigger: "POST /school/attendance/{id}/void"
        actor: Registrar
        preconditions:
          - "AttendanceRecord.status == PENDING"
        side_effects:
          - "AttendanceRecord.status = VOIDED"
        note: "Voiding a never-approved record contributes no hours; no enrollment recompute."

  - entity: ClinicTicket
    initial_state: OPEN
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: OPEN
        to: SIGNED_OFF
        trigger: "POST /school/clinic-tickets/{id}/sign-off"
        actor: Instructor
        preconditions:
          - "ClinicTicket.status == OPEN"
          - "supervising Instructor.active == true"
          - "Instructor.license_expires_on > current clock time"
          - "owning Enrollment.actual_hours >= program.clinic_phase_start_hour"
          - "owning Enrollment.status IN {ACTIVE, SAP_WARNING}"
        side_effects:
          - "ClinicTicket.status = SIGNED_OFF"
          - "ClinicTicket.clinic_hours computed and credited into Enrollment.actual_hours (CALC actual_hours_accrual)"
          - "Enrollment.pace_pct recomputed (CALC sap_pace)"
          - "the occupied Station.status: OCCUPIED -> AVAILABLE (cross-entity release)"
          - "increments Enrollment.version by 1"
      - from: SIGNED_OFF
        to: PAID
        trigger: "POST /school/clinic-tickets/{id}/pay"
        actor: Registrar
        preconditions:
          - "ClinicTicket.status == SIGNED_OFF"
        side_effects:
          - "ClinicTicket.status = PAID"
          - "ClinicTicket.ticket_total_cents computed (CALC clinic_pos_total)"
          - "increments ClinicTicket.version by 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /school/clinic-tickets/{id}/void"
        actor: Registrar
        preconditions:
          - "ClinicTicket.status == OPEN"
        side_effects:
          - "ClinicTicket.status = VOIDED"
          - "the occupied Station.status: OCCUPIED -> AVAILABLE (cross-entity release)"
          - "increments ClinicTicket.version by 1"
        note: "Voiding an OPEN ticket credits no clinic hours (never signed off)."

  - entity: Disbursement
    initial_state: SCHEDULED
    terminal_states: [RETURNED]
    transitions:
      - from: SCHEDULED
        to: POSTED
        trigger: "POST /school/disbursements/{id}/post"
        actor: FinancialAidOfficer
        preconditions:
          - "Disbursement.status == SCHEDULED"
          - "owning Enrollment.status IN {ACTIVE, SAP_WARNING}"
          - "owning Enrollment.actual_hours >= Disbursement.period_hours (clock-hour earned)"
          - "(current clock time - Enrollment.enrolled_on_iso) in whole weeks >= Disbursement.period_weeks (time earned)"
        side_effects:
          - "Disbursement.status = POSTED"
          - "Disbursement.net_amount_cents computed (CALC disbursement_net)"
          - "Enrollment.total_credits_cents += net_amount_cents; Enrollment.ledger_balance_cents recomputed (ledger sync, CALC ledger_balance)"
          - "increments Enrollment.version by 1"
        note: "Both clock-hour AND time-elapsed must be earned (the later of the two gates)."
      - from: POSTED
        to: RETURNED
        trigger: "POST /school/disbursements/{id}/return or cascade from Withdrawal finalize"
        actor: FinancialAidOfficer
        preconditions:
          - "Disbursement.status == POSTED"
        side_effects:
          - "Disbursement.status = RETURNED"
          - "Enrollment.total_credits_cents -= net_amount_cents; Enrollment.ledger_balance_cents recomputed (ledger sync compensation, CALC ledger_balance)"
          - "increments Enrollment.version by 1"
        note: "Compensation: a POSTED->RETURNED reverses exactly net_amount_cents from total_credits_cents."
      - from: SCHEDULED
        to: RETURNED
        trigger: "cascade from Withdrawal finalize"
        actor: system
        preconditions:
          - "Disbursement.status == SCHEDULED"
        side_effects:
          - "Disbursement.status = RETURNED"
        note: "A never-posted scheduled disbursement returns with no ledger impact."

  - entity: StationAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: RELEASED
        trigger: "POST /school/station-assignments/{id}/release"
        actor: Instructor
        preconditions:
          - "StationAssignment.status == RESERVED"
        side_effects:
          - "StationAssignment.status = RELEASED"
          - "the reserved Station.status: OCCUPIED -> AVAILABLE (cross-entity release)"
          - "increments StationAssignment.version by 1"

  - entity: Withdrawal
    initial_state: CALCULATED
    terminal_states: [FINALIZED]
    transitions:
      - from: CALCULATED
        to: FINALIZED
        trigger: "POST /school/withdrawals/{id}/finalize"
        actor: FinancialAidOfficer
        preconditions:
          - "Withdrawal.status == CALCULATED"
          - "expected_enrollment_version == live Enrollment.version (OCC)"
          - "owning Enrollment.status IN {ACTIVE, SAP_WARNING}"
        side_effects:
          - "Withdrawal.status = FINALIZED"
          - "owning Enrollment.status -> WITHDRAWN (cross-entity); this transition then drives the disbursement/ticket/station cascades declared on the Enrollment state machine"
          - "increments Enrollment.version by 1"
        note: "The finalize transition is the head of the depth-3 cascade: Withdrawal.FINALIZED -> Enrollment.WITHDRAWN -> Disbursement.RETURNED -> ledger recompute."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: post-disbursement-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /school/disbursements/{id}/post"
    occ_field: "expected_enrollment_version"
    description: |
      Posting a Disbursement against an Enrollment whose version has advanced
      since the FinancialAidOfficer last observed it is rejected. A prior
      mutation (another disbursement post, an attendance approval that bumped
      actual_hours, or a SAP evaluation) may legitimately change the
      enrollment's earned-hours and ledger basis; posting on a stale view
      would credit the wrong ledger snapshot. The check is a stale-version
      comparison, not a timing rule.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

  - rule_id: finalize-withdrawal-stale-enrollment
    parent_entity: Enrollment
    write_endpoint: "POST /school/withdrawals/{id}/finalize"
    occ_field: "expected_enrollment_version"
    description: |
      Finalizing a Withdrawal against an Enrollment whose version has advanced
      since the Withdrawal was calculated is rejected. Between CALCULATED and
      finalize, a disbursement post or attendance approval can change the
      hours and ledger the R2T4 figures were computed from; finalizing on a
      stale enrollment view would return funds against an outdated snapshot.
      Resolved as a stale-version check on the parent enrollment.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: clock_to_credit
    trigger: "on Program create; recomputed on Program read"
    algorithm: threshold
    formula: |
      credit_hours = floor(total_clock_hours / clock_hours_per_credit)
    input_set: "the Program's own total_clock_hours and clock_hours_per_credit"
    constants:
      DEFAULT_CLOCK_HOURS_PER_CREDIT: 37.5
    precision: "integer, floor (truncate toward zero)"

  - name: actual_hours_accrual
    trigger: "on AttendanceRecord PENDING->APPROVED, AttendanceRecord APPROVED->VOIDED, ClinicTicket OPEN->SIGNED_OFF"
    algorithm: aggregation
    formula: |
      actual_hours =
        sum(AttendanceRecord.hours WHERE status == APPROVED AND enrollment_id == E.id)
        + sum(ClinicTicket.clinic_hours WHERE status IN {SIGNED_OFF, PAID} AND enrollment_id == E.id)
      where ClinicTicket.clinic_hours = round((end_iso - start_iso) in hours, 2 dp, round_half_up)
    input_set: "AttendanceRecord rows with status == APPROVED (PENDING and VOIDED excluded); ClinicTicket rows with status IN {SIGNED_OFF, PAID} (OPEN and VOIDED excluded)"
    constants: {}
    precision: "2 decimal places, round_half_up; full recompute (not incremental) so void compensation leaves no drift"

  - name: sap_pace
    trigger: "after actual_hours_accrual; on POST /school/enrollments/{id}/evaluate-sap"
    algorithm: threshold
    formula: |
      if scheduled_hours_to_date == 0: pace_pct = 100.00
      else: pace_pct = round(actual_hours / scheduled_hours_to_date * 100, 2 dp, round_half_up)
      SAP_PASS iff pace_pct >= 67.00   (boundary: exactly 67.00 PASSES)
    input_set: "Enrollment.actual_hours (computed) over Enrollment.scheduled_hours_to_date"
    constants:
      SAP_PACE_THRESHOLD_PCT: 67.00
    precision: "2 decimal places, round_half_up; comparison uses >= against 67.00"

  - name: clinic_pos_total
    trigger: "on ClinicTicket SIGNED_OFF->PAID"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: discount and round EACH line item, THEN sum (round-per-line-item-then-sum).
      ticket_total_cents =
        sum_over_line_items( round_half_up( salon_price_cents * (1 - clinic_discount_pct) ) )
      # NOT sum-then-round; the two orders diverge on half-cent line totals.
    input_set: "the ClinicTicket.line_items array; clinic_discount_pct from the ticket"
    constants:
      DEFAULT_CLINIC_DISCOUNT_PCT: 0.50
    precision: "integer cents; round_half_up applied PER line item BEFORE summing"

  - name: disbursement_net
    trigger: "on Disbursement SCHEDULED->POSTED"
    algorithm: aggregation
    formula: |
      net_amount_cents = gross_amount_cents - origination_fee_cents
    input_set: "the Disbursement's own gross_amount_cents and origination_fee_cents"
    constants: {}
    precision: "integer cents, exact"

  - name: ledger_balance
    trigger: "on Disbursement SCHEDULED->POSTED, Disbursement POSTED->RETURNED, Enrollment create"
    algorithm: aggregation
    formula: |
      total_charges_cents = program.tuition_cents + program.kit_fee_cents + program.lab_fee_cents
      total_credits_cents = sum(Disbursement.net_amount_cents WHERE status == POSTED AND enrollment_id == E.id)
      ledger_balance_cents = total_charges_cents - total_credits_cents
    input_set: "POSTED disbursements only (SCHEDULED and RETURNED excluded); program charges fixed at enrollment"
    constants: {}
    precision: "integer cents, exact; full recompute so RETURN compensation is exact"

  - name: projected_ledger
    trigger: "on Enrollment read; recomputed on any Disbursement create/post/return"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL variant of the ledger: counts BOTH posted and still-scheduled aid as if it will arrive.
      projected_credits_cents = sum(Disbursement.net_amount_cents WHERE status IN {POSTED, SCHEDULED} AND enrollment_id == E.id)
      where for a SCHEDULED disbursement net_amount_cents is projected as gross_amount_cents - origination_fee_cents
      projected_balance_cents = total_charges_cents - projected_credits_cents
    input_set: "Disbursement rows with status IN {POSTED, SCHEDULED} (RETURNED excluded); program charges fixed at enrollment"
    constants: {}
    precision: "integer cents, exact"
    variants:
      - name: provisional_projected
        when: "what-if planning before disbursements post"
        difference: "includes SCHEDULED (not-yet-posted) aid in the credits, unlike ledger_balance which counts POSTED only; diverges from ledger_balance_cents whenever an undisbursed SCHEDULED award exists"

  - name: exam_readiness_score
    trigger: "on ExamApplication DRAFT->SUBMITTED and RETURNED_FOR_REVISION->SUBMITTED"
    algorithm: weighted_scoring
    formula: |
      hours_pct = round(enrollment.actual_hours / program.total_clock_hours * 100, 2 dp)
      hours_factor = min(100, hours_pct)
      t1 = round_half_up(0.40 * hours_factor, 2 dp)
      t2 = round_half_up(0.35 * mock_exam_avg, 2 dp)
      t3 = round_half_up(0.25 * competency_signoff_pct, 2 dp)
      readiness_score = t1 + t2 + t3     # PINNED: round EACH weighted term to 2dp, THEN sum
    input_set: "enrollment.actual_hours, program.total_clock_hours, the application's mock_exam_avg and competency_signoff_pct"
    constants:
      W_HOURS: 0.40
      W_MOCK: 0.35
      W_COMPETENCY: 0.25
      READY_THRESHOLD: 80
    precision: "2 decimal places, round_half_up; each weighted term rounded BEFORE summing"

  - name: r2t4_return
    trigger: "on POST /school/withdrawals (create) — Title IV federal variant"
    algorithm: forward_looking
    formula: |
      # CLOCK-HOUR program R2T4 uses SCHEDULED hours as of withdrawal date.
      pct_completed = round(enrollment.scheduled_hours_to_date / program.total_clock_hours * 100, 2 dp)
      if pct_completed > 60.00:
          title_iv_return_cents = 0     # >60% scheduled => 100% earned, nothing returned
      else:
          aid_earned_cents = round_half_up((pct_completed/100) * total_posted_net_cents)
          title_iv_return_cents = total_posted_net_cents - aid_earned_cents
      where total_posted_net_cents = sum(Disbursement.net_amount_cents WHERE status == POSTED AND enrollment_id == E.id)
    input_set: "POSTED disbursements only; SCHEDULED clock hours (NOT actual hours attended)"
    constants:
      R2T4_EARNED_CEILING_PCT: 60.00
    precision: "integer cents, round_half_up on aid_earned; comparison uses > against 60.00"
    variants:
      - name: federal_scheduled
        when: "Title IV R2T4 return — always uses SCHEDULED hours"
        difference: "denominator basis is scheduled_hours_to_date, ceiling at >60% earns 100%"

  - name: placement_rate
    trigger: "on GET /school/programs/{id}/placement-report"
    algorithm: aggregation
    formula: |
      total_graduates = count(Enrollment WHERE program_id == P.id AND status == GRADUATED)
      excluded_count  = count(Enrollment WHERE program_id == P.id AND status == GRADUATED AND placement_status == EXCLUDED)
      placed_count    = count(Enrollment WHERE program_id == P.id AND status == GRADUATED AND placement_status == PLACED)
      denominator     = total_graduates - excluded_count
      if denominator <= 0: placement_rate_pct = 0
      else: placement_rate_pct = round(placed_count / denominator * 100, 2 dp, round_half_up)
    input_set: "GRADUATED enrollments for the program; PLACED counts numerator, EXCLUDED removed from denominator, UNPLACED stays in denominator"
    constants: {}
    precision: "2 decimal places, round_half_up; empty/zero denominator yields 0 (no division-by-zero)"

  - name: institutional_refund
    trigger: "on POST /school/withdrawals (create) — institutional state pro-rata variant"
    algorithm: aggregation
    formula: |
      # INSTITUTIONAL refund uses ACTUAL hours attended (different basis than R2T4).
      pct_used = enrollment.actual_hours / program.total_clock_hours
      refund_before_fee_cents = round_half_up(program.tuition_cents * (1 - pct_used))
      institutional_refund_cents = max(0, refund_before_fee_cents - program.admin_fee_cap_cents)
    input_set: "program.tuition_cents and admin_fee_cap_cents; enrollment.actual_hours (NOT scheduled hours)"
    constants:
      DEFAULT_ADMIN_FEE_CAP_CENTS: 15000
    precision: "integer cents, round_half_up; floored at 0"
    variants:
      - name: institutional_actual
        when: "institutional tuition refund — always uses ACTUAL attended hours"
        difference: "denominator basis is actual_hours (not scheduled), refund applies to tuition only, less capped admin fee; diverges from r2t4_return for the same withdrawal"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "every FK in the request body references an existing entity"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK fields"
  - priority: 5
    category: business_constraint
    check: "required body fields present and types/enums valid; numeric fields within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/action endpoints"
  - priority: 6
    category: business_constraint
    check: "Student.email is unique; Instructor.license_number is unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /school/students, POST /school/instructors"
  - priority: 6.1
    category: business_constraint
    check: "AttendanceRecord.hours must not exceed its scheduled_hours"
    error_id: ERR_HOURS_EXCEED_SCHEDULED
    http_status: 422
    applies_to: "POST /school/attendance"
  - priority: 6.2
    category: business_constraint
    check: "payment_period must be in {1,2} and not already used by another (non-RETURNED) Disbursement on the same enrollment"
    error_id: ERR_INVALID_PERIOD
    http_status: 409
    applies_to: "POST /school/disbursements"
  - priority: 7
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 8
    category: business_referential
    check: "the acting Student (entity_backed) owns the enrollment behind the resource (X-User-ID == Enrollment.student_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Student-scoped exam-application actions"
  - priority: 9
    category: business_safety
    check: "supervising/recording Instructor.active == true AND Instructor.license_expires_on > current clock time"
    error_id: ERR_INSTRUCTOR_LICENSE_INVALID
    http_status: 409
    applies_to: "POST /school/attendance/{id}/approve, POST /school/clinic-tickets/{id}/sign-off"
  - priority: 10
    category: business_safety
    check: "owning Enrollment.actual_hours >= program.clinic_phase_start_hour before a clinic ticket may be signed off"
    error_id: ERR_CLINIC_PHASE_NOT_REACHED
    http_status: 409
    applies_to: "POST /school/clinic-tickets/{id}/sign-off"
  - priority: 11
    category: business_temporal
    check: "a new StationAssignment time window [start_iso, end_iso) must not overlap any RESERVED assignment on the SAME station; adjacency (end==start) is allowed (half-open)"
    error_id: ERR_STATION_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /school/station-assignments"
  - priority: 12
    category: business_temporal
    check: "a new ClinicTicket slot [start_iso, end_iso) plus a 15-minute turnover buffer must not collide with any non-VOIDED ticket on the SAME station; buffer means tickets within 15 minutes are rejected even when geometrically disjoint"
    error_id: ERR_CLINIC_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /school/clinic-tickets"
  - priority: 13
    category: business_constraint
    check: "ClinicTicket.station_id refers to a Station whose station_type matches the service category; station.status != OUT_OF_SERVICE"
    error_id: ERR_STATION_UNAVAILABLE
    http_status: 409
    applies_to: "POST /school/clinic-tickets, POST /school/station-assignments"
  - priority: 14
    category: business_constraint
    check: "Disbursement clock-hour gate: owning Enrollment.actual_hours >= Disbursement.period_hours"
    error_id: ERR_PERIOD_HOURS_NOT_EARNED
    http_status: 409
    applies_to: "POST /school/disbursements/{id}/post"
  - priority: 15
    category: business_temporal
    check: "Disbursement time gate: whole weeks elapsed since Enrollment.enrolled_on_iso >= Disbursement.period_weeks"
    error_id: ERR_PERIOD_WEEKS_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /school/disbursements/{id}/post"
  - priority: 16
    category: business_constraint
    check: "ExamApplication approval gate: readiness_score >= 80 AND competency_signoff_pct == 100 AND enrollment actual_hours >= 0.90 * program.total_clock_hours"
    error_id: ERR_EXAM_NOT_READY
    http_status: 409
    applies_to: "POST /school/exam-applications/{id}/approve"
  - priority: 17
    category: business_fiscal
    check: "Graduation gate: Enrollment.ledger_balance_cents <= 0 (no outstanding balance) when recording a PASSED result"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 409
    applies_to: "POST /school/exam-applications/{id}/record-result"
  - priority: 18
    category: business_constraint
    check: "OCC: expected_enrollment_version must equal the live Enrollment.version"
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412
    applies_to: "POST /school/disbursements/{id}/post, POST /school/withdrawals/{id}/finalize"
  - priority: 19
    category: state
    check: "Placement may only be recorded for an Enrollment whose status == GRADUATED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /school/enrollments/{id}/placement"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ----- Program -----
  - method: POST
    path: "/school/programs"
    description: "Create a program of study; computes credit_hours from clock hours."
    roles: [Registrar]
    code: 201
    input: [name, total_clock_hours, tuition_cents, kit_fee_cents, lab_fee_cents, clinic_phase_start_hour, "clock_hours_per_credit?", "admin_fee_cap_cents?"]
    output: Program
    side_effects: ["compute credit_hours (CALC clock_to_credit)"]
  - method: GET
    path: "/school/programs/{id}"
    description: "Fetch a program."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: GET
    path: "/school/programs"
    description: "List programs (paginated)."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: Program[]
    side_effects: []

  # ----- Student -----
  - method: POST
    path: "/school/students"
    description: "Register a prospective student."
    roles: [Registrar]
    code: 201
    input: [full_name, email, ssn_last4]
    output: Student
    side_effects: []
  - method: GET
    path: "/school/students/{id}"
    description: "Fetch a student."
    roles: [Registrar, FinancialAidOfficer, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  # ----- Instructor -----
  - method: POST
    path: "/school/instructors"
    description: "Create an instructor."
    roles: [Registrar]
    code: 201
    input: [full_name, license_number, license_expires_on, "active?"]
    output: Instructor
    side_effects: []
  - method: GET
    path: "/school/instructors/{id}"
    description: "Fetch an instructor."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # ----- Station -----
  - method: POST
    path: "/school/stations"
    description: "Create a floor station."
    roles: [Registrar]
    code: 201
    input: [label, station_type]
    output: Station
    side_effects: []
  - method: GET
    path: "/school/stations/{id}"
    description: "Fetch a station."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: []
    output: Station
    side_effects: []
  - method: GET
    path: "/school/stations"
    description: "List stations (paginated)."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: ["limit?", "offset?"]
    output: Station[]
    side_effects: []

  # ----- Enrollment -----
  - method: POST
    path: "/school/enrollments"
    description: "Enroll a student in a program; snapshots program charges into the ledger."
    roles: [Registrar]
    code: 201
    input: [student_id, program_id, enrolled_on_iso, "scheduled_hours_to_date?"]
    output: Enrollment
    side_effects: ["Student.status -> ENROLLED", "compute total_charges_cents, total_credits_cents=0, ledger_balance_cents (CALC ledger_balance)"]
  - method: GET
    path: "/school/enrollments/{id}"
    description: "Fetch an enrollment with computed hours and ledger."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/school/enrollments"
    description: "List enrollments; filterable by student_id and program_id."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: ["student_id?", "program_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: PATCH
    path: "/school/enrollments/{id}"
    description: "Update scheduled_hours_to_date as the term progresses."
    roles: [Registrar]
    code: 200
    input: [scheduled_hours_to_date]
    output: Enrollment
    side_effects: ["recompute pace_pct (CALC sap_pace)"]
  - method: POST
    path: "/school/enrollments/{id}/evaluate-sap"
    description: "Run a SAP evaluation; may transition ACTIVE<->SAP_WARNING."
    roles: [Registrar]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["compare pace_pct against 67.00; transition per state machine; increment sap_warning_count on entering SAP_WARNING"]

  # ----- Attendance -----
  - method: POST
    path: "/school/attendance"
    description: "Record an attendance/make-up session (PENDING)."
    roles: [Instructor]
    code: 201
    input: [enrollment_id, instructor_id, session_date_iso, scheduled_hours, hours, "record_type?"]
    output: AttendanceRecord
    side_effects: []
  - method: GET
    path: "/school/attendance/{id}"
    description: "Fetch a single attendance record."
    roles: [Registrar, Instructor, Student]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []
  - method: GET
    path: "/school/attendance"
    description: "List attendance records; filter by enrollment_id and instructor_id."
    roles: [Registrar, Instructor, Student]
    code: 200
    input: ["enrollment_id?", "instructor_id?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []
  - method: POST
    path: "/school/attendance/{id}/approve"
    description: "Approve a pending attendance record; accrues hours."
    roles: [Instructor]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["AttendanceRecord -> APPROVED", "recompute Enrollment.actual_hours, pace_pct, last_attendance_iso (CALC actual_hours_accrual, sap_pace)", "increment Enrollment.version"]
  - method: POST
    path: "/school/attendance/{id}/void"
    description: "Void an attendance record; compensates accrued hours if it was APPROVED."
    roles: [Registrar]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: ["AttendanceRecord -> VOIDED", "if was APPROVED, recompute Enrollment.actual_hours, pace_pct (CALC actual_hours_accrual)"]

  # ----- Clinic tickets -----
  - method: POST
    path: "/school/clinic-tickets"
    description: "Open a clinic-floor service ticket; reserves the station as OCCUPIED."
    roles: [Instructor]
    code: 201
    input: [enrollment_id, station_id, instructor_id, client_name, start_iso, end_iso, line_items, "clinic_discount_pct?"]
    output: ClinicTicket
    side_effects: ["Station.status -> OCCUPIED", "compute clinic_hours from window"]
  - method: GET
    path: "/school/clinic-tickets/{id}"
    description: "Fetch a single clinic ticket."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: []
    output: ClinicTicket
    side_effects: []
  - method: GET
    path: "/school/clinic-tickets"
    description: "List clinic tickets; filter by enrollment_id, station_id, instructor_id."
    roles: [Registrar, FinancialAidOfficer, Instructor, Student]
    code: 200
    input: ["enrollment_id?", "station_id?", "instructor_id?", "limit?", "offset?"]
    output: ClinicTicket[]
    side_effects: []
  - method: POST
    path: "/school/clinic-tickets/{id}/sign-off"
    description: "Instructor signs off a clinic service; credits clinic hours, releases station."
    roles: [Instructor]
    code: 200
    input: []
    output: ClinicTicket
    side_effects: ["ClinicTicket -> SIGNED_OFF", "credit clinic_hours to Enrollment.actual_hours (CALC actual_hours_accrual)", "Station.status -> AVAILABLE", "increment Enrollment.version"]
  - method: POST
    path: "/school/clinic-tickets/{id}/pay"
    description: "Take client payment for a signed-off ticket; computes POS total."
    roles: [Registrar]
    code: 200
    input: []
    output: ClinicTicket
    side_effects: ["ClinicTicket -> PAID", "compute ticket_total_cents (CALC clinic_pos_total)"]
  - method: POST
    path: "/school/clinic-tickets/{id}/void"
    description: "Void an open clinic ticket; releases station, credits no hours."
    roles: [Registrar]
    code: 200
    input: []
    output: ClinicTicket
    side_effects: ["ClinicTicket -> VOIDED", "Station.status -> AVAILABLE"]

  # ----- Station assignments -----
  - method: POST
    path: "/school/station-assignments"
    description: "Reserve a station for a student over a time window; rejects overlaps."
    roles: [Instructor]
    code: 201
    input: [station_id, enrollment_id, instructor_id, start_iso, end_iso]
    output: StationAssignment
    side_effects: ["Station.status -> OCCUPIED"]
  - method: GET
    path: "/school/station-assignments/{id}"
    description: "Fetch a single station assignment."
    roles: [Registrar, Instructor]
    code: 200
    input: []
    output: StationAssignment
    side_effects: []
  - method: GET
    path: "/school/station-assignments"
    description: "List station assignments; filter by station_id, enrollment_id, instructor_id."
    roles: [Registrar, Instructor]
    code: 200
    input: ["station_id?", "enrollment_id?", "instructor_id?", "limit?", "offset?"]
    output: StationAssignment[]
    side_effects: []
  - method: POST
    path: "/school/station-assignments/{id}/release"
    description: "Release a reserved station."
    roles: [Instructor]
    code: 200
    input: []
    output: StationAssignment
    side_effects: ["StationAssignment -> RELEASED", "Station.status -> AVAILABLE"]

  # ----- Disbursements -----
  - method: POST
    path: "/school/disbursements"
    description: "Schedule a Title IV disbursement for a payment period."
    roles: [FinancialAidOfficer]
    code: 201
    input: [enrollment_id, payment_period, period_hours, period_weeks, gross_amount_cents, "origination_fee_cents?"]
    output: Disbursement
    side_effects: []
  - method: GET
    path: "/school/disbursements/{id}"
    description: "Fetch a single disbursement."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: GET
    path: "/school/disbursements"
    description: "List disbursements; filter by enrollment_id."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []
  - method: POST
    path: "/school/disbursements/{id}/post"
    description: "Post a scheduled disbursement once clock-hour AND time gates are met; OCC-guarded on the enrollment."
    roles: [FinancialAidOfficer]
    code: 200
    input: [expected_enrollment_version]
    output: Disbursement
    side_effects: ["Disbursement -> POSTED", "compute net_amount_cents (CALC disbursement_net)", "credit ledger (CALC ledger_balance)", "increments Enrollment.version by 1"]
  - method: POST
    path: "/school/disbursements/{id}/return"
    description: "Return a posted disbursement; reverses the ledger credit."
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["Disbursement -> RETURNED", "reverse ledger credit (CALC ledger_balance compensation)", "increment Enrollment.version"]

  # ----- Exam applications -----
  - method: POST
    path: "/school/exam-applications"
    description: "Create a state-board exam application in DRAFT."
    roles: [Student]
    code: 201
    input: [enrollment_id, exam_type, mock_exam_avg, competency_signoff_pct]
    output: ExamApplication
    side_effects: []
  - method: GET
    path: "/school/exam-applications/{id}"
    description: "Fetch a single exam application."
    roles: [Registrar, Student]
    code: 200
    input: []
    output: ExamApplication
    side_effects: []
  - method: GET
    path: "/school/exam-applications"
    description: "List exam applications; filter by enrollment_id."
    roles: [Registrar, Student]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: ExamApplication[]
    side_effects: []
  - method: POST
    path: "/school/exam-applications/{id}/submit"
    description: "Submit (or resubmit after revision) an exam application; recomputes readiness."
    roles: [Student]
    code: 200
    input: []
    output: ExamApplication
    side_effects: ["ExamApplication -> SUBMITTED", "recompute readiness_score (CALC exam_readiness_score)"]
  - method: POST
    path: "/school/exam-applications/{id}/return"
    description: "Return a submitted application for revision."
    roles: [Registrar]
    code: 200
    input: []
    output: ExamApplication
    side_effects: ["ExamApplication -> RETURNED_FOR_REVISION"]
  - method: POST
    path: "/school/exam-applications/{id}/approve"
    description: "Approve a ready application; bubbles enrollment to EXAM_PENDING."
    roles: [Registrar]
    code: 200
    input: []
    output: ExamApplication
    side_effects: ["ExamApplication -> APPROVED", "Enrollment ACTIVE -> EXAM_PENDING (cross-entity)", "increment Enrollment.version"]
  - method: POST
    path: "/school/exam-applications/{id}/schedule"
    description: "Schedule the approved exam."
    roles: [Registrar]
    code: 200
    input: []
    output: ExamApplication
    side_effects: ["ExamApplication -> SCHEDULED"]
  - method: POST
    path: "/school/exam-applications/{id}/record-result"
    description: "Record exam result; PASSED graduates the enrollment, FAILED reverts it to ACTIVE."
    roles: [Registrar]
    code: 200
    input: [result]
    output: ExamApplication
    side_effects: ["ExamApplication -> PASSED|FAILED", "PASSED: Enrollment EXAM_PENDING -> GRADUATED + release RESERVED stations (cascade); FAILED: Enrollment EXAM_PENDING -> ACTIVE", "increment Enrollment.version"]

  # ----- Withdrawals -----
  - method: POST
    path: "/school/withdrawals"
    description: "Create a withdrawal record; computes R2T4 return and institutional refund."
    roles: [FinancialAidOfficer]
    code: 201
    input: [enrollment_id, withdrawal_type, last_date_of_attendance_iso]
    output: Withdrawal
    side_effects: ["compute pct_completed, title_iv_return_cents (CALC r2t4_return), institutional_refund_cents (CALC institutional_refund)"]
  - method: GET
    path: "/school/withdrawals/{id}"
    description: "Fetch a single withdrawal."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: []
    output: Withdrawal
    side_effects: []
  - method: GET
    path: "/school/withdrawals"
    description: "List withdrawals; filter by enrollment_id."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: ["enrollment_id?", "limit?", "offset?"]
    output: Withdrawal[]
    side_effects: []
  - method: POST
    path: "/school/withdrawals/{id}/finalize"
    description: "Finalize a withdrawal; cascades disbursement returns, ticket voids, station releases; OCC-guarded."
    roles: [FinancialAidOfficer]
    code: 200
    input: [expected_enrollment_version]
    output: Withdrawal
    side_effects: ["Withdrawal -> FINALIZED", "Enrollment -> WITHDRAWN", "cascade SCHEDULED Disbursement -> RETURNED with ledger sync", "cascade OPEN ClinicTicket -> VOIDED", "cascade RESERVED StationAssignment -> RELEASED", "increments Enrollment.version by 1"]

  # ----- Placement reporting (computed read) -----
  - method: POST
    path: "/school/enrollments/{id}/placement"
    description: "Record the post-graduation placement outcome for a GRADUATED enrollment."
    roles: [Registrar]
    code: 200
    input: [placement_status]
    output: Enrollment
    side_effects: ["set Enrollment.placement_status to PLACED|UNPLACED|EXCLUDED"]
  - method: GET
    path: "/school/programs/{id}/placement-report"
    description: "Aggregate placement-rate report for graduates of a program."
    roles: [Registrar]
    code: 200
    input: []
    output: "{ program_id: string, total_graduates: integer, excluded_count: integer, placed_count: integer, placement_rate_pct: number }"
    side_effects: ["compute placement_rate (CALC placement_rate)"]

  # ----- Test-driving clock -----
  - method: POST
    path: "/school/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; affects license-expiry and period-weeks computations"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for this endpoint per RBAC"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Student acting on an exam application not tied to an enrollment they own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "Body foreign-key references a non-existent entity"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type, invalid enum, or out-of-range numeric"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Student.email or Instructor.license_number already exists"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_INSTRUCTOR_LICENSE_INVALID
    http: 409
    condition: "Acting instructor is inactive or license expired at current clock time"
  - id: ERR_CLINIC_PHASE_NOT_REACHED
    http: 409
    condition: "Enrollment actual_hours below program.clinic_phase_start_hour at clinic sign-off"
  - id: ERR_STATION_DOUBLE_BOOKED
    http: 409
    condition: "New station-assignment window overlaps a RESERVED assignment on the same station"
  - id: ERR_CLINIC_SLOT_CONFLICT
    http: 409
    condition: "New clinic ticket slot collides with a non-VOIDED ticket on the same station within the 15-minute turnover buffer"
  - id: ERR_STATION_UNAVAILABLE
    http: 409
    condition: "Station OUT_OF_SERVICE or station_type mismatched to the requested service"
  - id: ERR_PERIOD_HOURS_NOT_EARNED
    http: 409
    condition: "Disbursement post attempted before actual_hours >= period_hours"
  - id: ERR_PERIOD_WEEKS_NOT_ELAPSED
    http: 409
    condition: "Disbursement post attempted before period_weeks have elapsed since enrollment"
  - id: ERR_EXAM_NOT_READY
    http: 409
    condition: "Exam application approval attempted while readiness/competency/hours gate unmet"
  - id: ERR_OUTSTANDING_BALANCE
    http: 409
    condition: "Recording PASSED while Enrollment.ledger_balance_cents > 0"
  - id: ERR_STALE_ENROLLMENT_VERSION
    http: 412
    condition: "expected_enrollment_version does not match live Enrollment.version (OCC)"
  - id: ERR_INVALID_PERIOD
    http: 409
    condition: "A disbursement with the same payment_period already exists for the enrollment, or payment_period not in {1,2}"
  - id: ERR_HOURS_EXCEED_SCHEDULED
    http: 422
    condition: "AttendanceRecord.hours greater than its scheduled_hours"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Registrar
    description: "Owns enrollment lifecycle, programs, attendance voiding, SAP evaluation, clinic payment, and exam-application adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /school/programs"
      - "POST /school/students"
      - "POST /school/instructors"
      - "POST /school/stations"
      - "POST /school/enrollments"
      - "PATCH /school/enrollments/{id}"
      - "POST /school/enrollments/{id}/evaluate-sap"
      - "POST /school/attendance/{id}/void"
      - "POST /school/clinic-tickets/{id}/pay"
      - "POST /school/clinic-tickets/{id}/void"
      - "POST /school/exam-applications/{id}/return"
      - "POST /school/exam-applications/{id}/approve"
      - "POST /school/exam-applications/{id}/schedule"
      - "POST /school/exam-applications/{id}/record-result"
      - "GET /school/programs/{id}/placement-report"
    shared_operations:
      - "GET reads across school resources"
      - "POST /school/_clock/set_current_utc"
  - name: FinancialAidOfficer
    description: "Owns Title IV disbursements, returns, and refund/withdrawal processing."
    identity: opaque
    exclusive_operations:
      - "POST /school/disbursements"
      - "POST /school/disbursements/{id}/post"
      - "POST /school/disbursements/{id}/return"
      - "POST /school/withdrawals"
      - "POST /school/withdrawals/{id}/finalize"
    shared_operations:
      - "GET reads across school resources"
      - "POST /school/_clock/set_current_utc"
  - name: Instructor
    description: "Records and approves attendance, opens/signs off clinic tickets, reserves and releases stations."
    identity: entity_backed:Instructor
    exclusive_operations:
      - "POST /school/attendance"
      - "POST /school/attendance/{id}/approve"
      - "POST /school/clinic-tickets"
      - "POST /school/clinic-tickets/{id}/sign-off"
      - "POST /school/station-assignments"
      - "POST /school/station-assignments/{id}/release"
    shared_operations:
      - "GET reads across school resources"
  - name: Student
    description: "Acts on own enrollment's exam applications."
    identity: entity_backed:Student
    exclusive_operations:
      - "POST /school/exam-applications"
      - "POST /school/exam-applications/{id}/submit"
    shared_operations:
      - "GET reads on own resources"
