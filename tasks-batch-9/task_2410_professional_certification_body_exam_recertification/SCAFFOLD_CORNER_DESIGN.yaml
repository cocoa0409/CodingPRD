      - name: reinstatement_fee_at_200_days_late_caps_the_surcharge_and_totals_59400
        claim_type: tiered_pricing
        grounds:
          - calculations.reinstatement_fee_assessment
          - state_machines.RecertificationCycle.OPEN_to_LAPSED
          - state_machines.Certificant.ACTIVE_to_EXPIRED
          - state_machines.Certificant.EXPIRED_to_ACTIVE
          - endpoints.POST_/recertification-runs
          - endpoints.POST_/recertification-cycles/{id}/reinstate
          - validations[priority=45]
          - errors.ERR_REINSTATEMENT_FEE_UNPAID
        distinguishing_aspect: |
          Both constants bite at 200 days late: the daily surcharge 200 x 250 = 50000 is capped
          to MAX_SURCHARGE_CENTS 30000, giving subtotal 55000, which lands in the top tier (0.08
          on the whole subtotal, average not marginal) for admin_fee 4400 and a total of exactly
          59400. An uncapped surcharge would read 75000 + 6000 = 81000 and a marginal tier would
          read a different admin fee, so a payment of 59399 must still be refused and 59400 must
          be accepted.
