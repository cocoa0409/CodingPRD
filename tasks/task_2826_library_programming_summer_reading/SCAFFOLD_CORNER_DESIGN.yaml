          - entities.Participant.fields.last_entry_on
          - entities.Participant.fields.eligible_tier_index
        distinguishing_aspect: "All four derived fields are recomputed from the ledger on every write: enrolment gives 0/0/null/0, two entries give 75/2/2026-07-25/0, and a -15 correction gives 60/3/2026-07-25/0 — the correction moves the sum and the count but never last_entry_on, which counts LOG entries only."
        test_recipe:
          setup:
            - "An OPEN MINUTES challenge (single tier at 5000 units) with one freshly enrolled participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer 2026", logging_method: "MINUTES", unit_label: "minutes", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal: $.data.id }
            - call: "POST /library/reading-challenges/${chal}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 5000, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${chal}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal}", home_branch_id: "${br}", display_name: "Ada L.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { part: $.data.id, units0: $.data.cumulative_units }
          trigger:
            - call: "POST /library/participants/${part}/log-entries"
              payload: { units: 30, logged_on: "2026-07-20", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { e1: $.data.id }
            - call: "POST /library/participants/${part}/log-entries"
              payload: { units: 45, logged_on: "2026-07-25", source: "SELF_SERVICE" }
              as: ProgramCoordinator
            - call: "GET /library/participants/${part}"
              payload: {}
              as: ProgramCoordinator
              captures: { units2: $.data.cumulative_units, pv: $.data.version }
            - call: "POST /library/participants/${part}/log-corrections"
              payload: { corrected_entry_id: "${e1}", units_delta: -15, expected_participant_version: "${pv}", note: "over-counted" }
              as: ProgramCoordinator
            - call: "GET /library/participants/${part}"
              payload: {}
              as: ProgramCoordinator
              captures: { units3: $.data.cumulative_units, count3: $.data.entry_count, last3: $.data.last_entry_on, elig3: $.data.eligible_tier_index }
          assert:
            - "${units0} == 0 with entry_count == 0, last_entry_on == null, eligible_tier_index == 0 and awarded_tier_index == 0 at enrolment"
            - "${units2} == 75 with entry_count == 2 and last_entry_on == 2026-07-25"
            - "${units3} == 60, ${count3} == 3, ${last3} == 2026-07-25 and ${elig3} == 0 (60 is far below the 5000 threshold)"
            - "GET /library/log-entries filtered by participant_id == ${part} returns total_count == 3 with exactly one entry_type == CORRECTION"

      - name: logging_method_flag_sets_the_daily_cap
        claim_type: conditional_feature_flags
        grounds:
          - calculations.daily_log_cap
          - validations[priority=38]
          - errors[ERR_DAILY_LOG_CAP_EXCEEDED]
        distinguishing_aspect: "The same 6-unit entry on the same date is refused on an ACTIVITIES challenge (cap 5) and accepted on a BOOKS challenge (cap 10), so only logging_method decides."
        test_recipe:
          setup:
            - "Two OPEN challenges over the same window — one ACTIVITIES, one BOOKS — each with one enrolled participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Activity Bingo 2026", logging_method: "ACTIVITIES", unit_label: "activities", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal_a: $.data.id }
            - call: "POST /library/reading-challenges/${chal_a}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 20, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${chal_a}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal_a}", home_branch_id: "${br}", display_name: "Ada L.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { part_a: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Book Count 2026", logging_method: "BOOKS", unit_label: "books", start_on: "2026-07-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 10000 }
              as: ProgramManager
              captures: { chal_b: $.data.id }
            - call: "POST /library/reading-challenges/${chal_b}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 20, prize_sku: "MEDAL", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${chal_b}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${chal_b}", home_branch_id: "${br}", display_name: "Ben M.", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { part_b: $.data.id }
          trigger:
            - call: "POST /library/participants/${part_a}/log-entries"
              payload: { units: 6, logged_on: "2026-07-20", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /library/participants/${part_a}/log-entries"
              payload: { units: 5, logged_on: "2026-07-20", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { ok_a: $.data.id }
            - call: "POST /library/participants/${part_b}/log-entries"
              payload: { units: 6, logged_on: "2026-07-20", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { ok_b: $.data.id }
          assert:
            - "The 6-unit ACTIVITIES entry returns HTTP 422 with ${err} == ERR_DAILY_LOG_CAP_EXCEEDED (cap 5)"
            - "The 5-unit ACTIVITIES entry returns HTTP 201 as ReadingLogEntry.${ok_a} — exactly the cap is allowed"
            - "The 6-unit BOOKS entry returns HTTP 201 as ReadingLogEntry.${ok_b} (cap 10)"
            - "Participant.${part_a}.cumulative_units == 5 and Participant.${part_b}.cumulative_units == 6"

      - name: correction_policy_flag_decides_whether_an_award_survives
        claim_type: conditional_feature_flags
        grounds:
          - entities.ReadingChallenge.fields.correction_policy
          - calculations.participant_progress_ledger
        excluded_because:
          difficulty_instance: correction_policy_ledger_truth_revokes_where_high_water_retains
          rationale: "The §1.8 instance runs the identical correction against a LEDGER_TRUTH and a HIGH_WATER challenge and asserts the diverging award outcomes, which is exactly this flag claim."

  # ======================================================== CONSISTENCY MODEL
  - section: consistency_model
    instances:

      - name: confirm_response_already_reflects_the_whole_draw_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - state_machines[Program.operational_status]
        distinguishing_aspect: "The confirm response body already carries the final supply_draw_lines, materials_committed_cents 2750 and confirmed_room_capacity 60, and the immediately following reads of the program and the lot return exactly the same values with no second write."
        test_recipe:
          setup:
            - "A SCHEDULED program (target 10, materials_budget 50000) with a CONFIRMED reservation in a 60-seat room and a 100-unit CRAFT-KIT lot at 250 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PROGRAM_SUPPLY", sku: "CRAFT-KIT", unit_cost_cents: 250, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/programs/${prog}/confirm"
              payload: {}
              as: ProgramManager
              captures: { committed: $.data.materials_committed_cents, cap: $.data.confirmed_room_capacity, v_after: $.data.version }
            - call: "GET /library/programs/${prog}"
              payload: {}
              as: ProgramCoordinator
              captures: { committed_read: $.data.materials_committed_cents, v_read: $.data.version }
            - call: "GET /library/inventory-lots/${lot}"
              payload: {}
              as: ProgramCoordinator
              captures: { reserved_read: $.data.quantity_reserved }
          assert:
            - "${committed} == 2750 and ${cap} == 60 in the POST response itself, with supply_draw_lines already listing lot ${lot} for 10 units"
            - "${committed_read} == ${committed} and ${v_read} == ${v_after} — the read adds nothing the write had not already published"
            - "${reserved_read} == 10 in the very next request, so the lot side of the cascade is visible immediately rather than eventually"
            - "Every response wraps the payload in the declared envelope with data, request_id and no top-level error key"
