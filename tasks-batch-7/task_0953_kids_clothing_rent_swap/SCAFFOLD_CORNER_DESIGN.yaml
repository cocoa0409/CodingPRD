            - "discount_cents == 0"
            - "protection_fee_cents == 0"
            - "late_fee_cents == 0"
            - "damage_fee_cents == 0"
            - "credit_applied_cents == 0"
            - "surcharge_cents == 0"
            - "invoice_total_cents == 0"

      - name: corner_ep_pagination_limit_above_the_maximum_is_rejected
        claim_type: Listing
        grounds: ["response_envelope.pagination_defaults", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and returns ERR_VALIDATION with HTTP 422 rather than silently clamping."
        test_recipe:
          setup: ["One plan exists."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { e4_plan: $.data.id }
          trigger:
            - call: "GET /kidswear/plans"
              payload: { limit: 101, offset: 0 }
              as: PlatformAdmin
              captures: { err_e4: $.data.error_id }
          assert:
            - "the trigger returns HTTP 422"
            - "the captured err_e4 equals ERR_VALIDATION"

      - name: corner_ep_processing_jobs_are_discoverable_from_their_assessment
        claim_type: Cross-reference link
        grounds: ["endpoints.GET_/kidswear/processing-jobs", "entities.ProcessingJob.fields.assessment_id"]
        distinguishing_aspect: "A ProcessingJob is created only as a cascade of assessment confirmation and never appears in a creation response, so the filtered list by assessment_id is its ONLY discovery channel; it returns exactly one row with route STANDARD_LAUNDER."
        test_recipe:
          setup: ["A returned size-5 unit whose grade-A assessment has just been confirmed."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { e5_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${e5_plan}", email: "e5@kidswear.test", display_name: "Job Lookup", child_size_code: "5", protection_enrolled: false }
              as: PlatformAdmin
              captures: { e5_m: $.data.id }
            - call: "POST /kidswear/members/${e5_m}/activate"
