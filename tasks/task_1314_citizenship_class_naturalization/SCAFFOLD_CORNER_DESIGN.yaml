      - name: occ_enrollment_create_stale_section_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[enrollment-create-stale-section]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Client reads section version 1, another enrollment advances it to 2, then the client posts with expected_section_version 1 -> 412 ERR_STALE_VERSION; replaying with the fresh version succeeds."
        test_recipe:
          setup: ["section cap 3; two eligible applicants A and B"]
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Inst", email: "i@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - { call: "POST /naturalization/volunteers/${vol_id}/training-credits", payload: { topic: "civics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /naturalization/volunteers/${vol_id}/accredit", payload: { target_level: GENERAL }, as: ProgramAdmin }
            - call: "POST /naturalization/class-sections"
              payload: { title: "T", weekday: "MON", start_minute: 600, end_minute: 660, room_id: "R1", instructor_volunteer_id: "${vol_id}", capacity: 3, total_sessions: 10 }
              as: ProgramAdmin
              captures: { sec_id: $.data.id, sec_v0: $.data.version }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "A One", email: "a@x.com", date_of_birth: "1990-01-01" }
              as: IntakeCoordinator
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /naturalization/applicants/${a_id}/screenings"
              payload: { expected_applicant_version: "${a_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 36, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/applicants"
              payload: { full_name: "B Two", email: "b@x.com", date_of_birth: "1991-01-01" }
              as: IntakeCoordinator
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /naturalization/applicants/${b_id}/screenings"
              payload: { expected_applicant_version: "${b_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 35, english_level: 2, civics_practice_pct: 50, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${a_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${b_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v0}" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /naturalization/class-sections/${sec_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { sec_v_now: $.data.version }
            - call: "POST /naturalization/enrollments"
              payload: { applicant_id: "${b_id}", class_section_id: "${sec_id}", expected_section_version: "${sec_v_now}" }
              as: IntakeCoordinator
              captures: { enr_b: $.data.id }
          assert:
            - "stale write rejected: error_id == ERR_STALE_VERSION, http 412"
            - "retry with the fresh version succeeds: Enrollment.${enr_b}.status == ENROLLED"
            - "ClassSection.${sec_id}.enrolled_count == 2 (exactly one enrollment landed from the stale attempt pair)"

