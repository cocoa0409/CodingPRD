            - { call: "POST /api/show-events", payload: { site_id: "${site_id}", name: "Show S2", window_start: "2026-08-11T19:00:00Z", window_end: "2026-08-11T19:30:00Z", drone_count_planned: 10 }, as: ProductionPlanner, captures: { s2: $.data.id } }
            - { call: "POST /api/show-events/${s1}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 165375 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${s1}/record-payment", payload: { kind: "BALANCE", amount_cents: 385875 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${s2}/record-payment", payload: { kind: "DEPOSIT", amount_cents: 165375 }, as: ProductionPlanner }
            - { call: "POST /api/show-events/${s2}/record-payment", payload: { kind: "BALANCE", amount_cents: 385875 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-27T19:00:00Z" }, as: OpsAdmin }
            - { call: "POST /api/show-events/${s1}/cancel", payload: {}, as: ProductionPlanner, captures: { t1: $.data.cancellation_tier, r1: $.data.refund_due_cents } }
