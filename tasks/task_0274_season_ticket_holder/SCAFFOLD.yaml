        constraints: ">= 2 and <= 12"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over Installment rows with status == PAID under this plan."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Payment plan state."
        default: ACTIVE
        constraints: "one of {ACTIVE, PAID_IN_FULL, DEFAULTED, CANCELLED}"

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only."
      - name: created_at
        type: datetime
        source: system
