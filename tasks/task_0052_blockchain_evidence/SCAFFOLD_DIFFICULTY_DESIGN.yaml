scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: evidence_fee_quote_vs_final_on_evidence_entity
        grounds:
          - calculations.preservation_fee_quote
          - calculations.preservation_fee_final
          - state_machines.Evidence.PENDING_to_SUBMITTING
          - state_machines.Evidence.SUBMITTING_to_CONFIRMED
        distinguishing_aspect: |
          Operates on the Evidence entity domain: preservation_fee_quote is a forward-looking
          precondition estimate computed at PENDING->SUBMITTING (does not debit), while
          preservation_fee_final is the chronological actual debit at SUBMITTING->CONFIRMED
          and writes Evidence.per_evidence_fee_cents. Both produce the same number for the
          single-evidence path by design, but the chain of effects (no wallet change vs wallet
          debit) diverges.
        test_recipe:
          setup:
            - "Create Customer C with wallet_balance_cents = 1000 via /customers + /recharges + /_events/payment SUCCESS."
            - "Create Evidence E (evidence_type=DOCUMENT, storage_period_days=30, hash_algorithm=SHA256, file_hash=<64 hex>, chain_id=ETHEREUM, original_data_b64=null) for C."
            - "Create TimestampNotarization for E (tsa_provider=RFC3161_TSA_A); resolve via POST /_events/notary-callback."
          trigger:
            - "POST /evidences/{E}/submit (passes quote precondition; wallet unchanged at this point)."
            - "POST /_chain/confirm for the latest OnChainTx with confirmations=12."
          assert:
            - "After /submit but before /_chain/confirm: Customer.wallet_balance_cents == 1000 (quote did not debit)."
            - "After /_chain/confirm: Evidence.status == 'CONFIRMED'."
            - "After /_chain/confirm: Evidence.per_evidence_fee_cents == 200."
            - "After /_chain/confirm: Customer.wallet_balance_cents == 800 (final debited 200)."

      - name: judicial_surcharge_quote_vs_final_on_judicial_package_entity
        grounds:
          - calculations.judicial_surcharge_quote
          - calculations.judicial_surcharge_final
          - state_machines.JudicialPackage.DRAFT_to_SEALED
        distinguishing_aspect: |
          Operates on the JudicialPackage entity domain (different from Evidence): the quote
          variant runs as a precondition check during seal without mutating wallet, the final
          variant runs as the seal side-effect and writes JudicialPackage.surcharge_cents
          and debits Customer.wallet_balance_cents.
        test_recipe:
          setup:
            - "Bring an Evidence E to CONFIRMED for Customer C (wallet credited to 100000)."
            - "Issue Certificate for E (template_code=JUDICIAL)."
            - "Create JudicialPackage P (evidence_id=E, case_number='2025-CV-001', authority_code=COURT_BJ, include_original_data=false)."
          trigger:
            - "POST /judicial-packages/{P}/seal."
          assert:
            - "JudicialPackage.status == 'SEALED'."
            - "JudicialPackage.surcharge_cents == 6000."
            - "Customer.wallet_balance_cents decreased by exactly 6000."
            - "AuditLog contains JUDICIAL_SEALED and FEE_DEBITED for JudicialPackage P."

  # ===========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: judicial_surcharge_mode_a_nonlinear_three_inputs
        grounds:
          - calculations.judicial_surcharge_final
          - entities.JudicialPackage.fields.authority_code
          - entities.JudicialPackage.fields.include_original_data
        distinguishing_aspect: |
          Mode (a): the formula combines THREE inputs (base, include_original_data uplift,
          authority_multiplier) with a non-linear interaction — the multiplier is selected
          conditionally from authority_code and is then applied to (base + uplift). Changing
          authority_code OR include_original_data changes the result via different code
          paths, not a linear sum.
        test_recipe:
          setup:
            - "Bring Evidence E to CONFIRMED for Customer C (wallet 100000)."
            - "Issue Certificate for E."
            - "Create JudicialPackage P1 (authority_code=COURT_BJ, include_original_data=true)."
          trigger:
            - "POST /judicial-packages/{P1}/seal."
          assert:
            - "JudicialPackage.surcharge_cents == 7800   # (5000 + 1500) * 1.20 = 7800"
            - "Customer.wallet_balance_cents decreased by exactly 7800."

      - name: batch_fee_mode_b_round_per_line_then_sum_then_discount_then_round
        grounds:
          - calculations.batch_fee_final
          - state_machines.Batch.SUBMITTING_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold PINS the order
          (round_half_up per line, then sum, then apply discount, then a single final
          round_half_up). 'Sum-then-round' is explicitly NOT used and would yield different
          cents on tiered inputs.
        test_recipe:
          setup:
            - "Create Customer C with wallet_balance_cents = 100000."
            - "Create 10 Evidences (E1..E10) each IMAGE 90 days for C in PENDING."
            - "Create TimestampNotarization for each E1..E10."
            - "Create Batch B grouping E1..E10 (chain_id=ETHEREUM)."
          trigger:
            - "POST /batches/{B}/submit."
            - "POST /_chain/confirm for B's OnChainTx (confirmations=12)."
          assert:
            - "Batch.evidence_count == 10."
            - "Batch.total_fee_cents == 6750   # round(750,750,...,750) sum=7500 * 0.90 = 6750"
            - "Customer.wallet_balance_cents == 93250 (100000 - 6750)."
            - "Every E1..E10 has status == 'CONFIRMED'."

  # ===========================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: evidence_failed_to_submitting_revert_loop
        grounds:
          - state_machines.Evidence.PENDING_to_SUBMITTING
          - state_machines.Evidence.SUBMITTING_to_FAILED
          - state_machines.Evidence.FAILED_to_SUBMITTING
        distinguishing_aspect: |
          Cycle on the Evidence entity: FAILED -> SUBMITTING is a revert loop. The same
          state can be re-entered up to 3 attempts, distinguishing this machine from a
          purely linear A->B->C pipeline.
        test_recipe:
          setup:
            - "Customer C with wallet_balance_cents = 1000."
            - "Evidence E (DOCUMENT, 30d, original=null) PENDING for C."
            - "TimestampNotarization for E."
          trigger:
            - "POST /evidences/{E}/submit."
            - "POST /_chain/fail for the latest OnChainTx."
            - "POST /evidences/{E}/resubmit."
            - "POST /_chain/confirm for the new OnChainTx with confirmations=12."
          assert:
            - "After /_chain/fail: Evidence.status == 'FAILED'."
            - "After /resubmit: Evidence.status == 'SUBMITTING' and Evidence.submission_attempts == 2."
            - "After /_chain/confirm: Evidence.status == 'CONFIRMED'."

      - name: onchain_tx_branching_to_confirmed_or_failed_on_different_entity
        grounds:
          - state_machines.OnChainTx.SUBMITTED_to_CONFIRMED
          - state_machines.OnChainTx.SUBMITTED_to_FAILED
        distinguishing_aspect: |
          Branching shape on the OnChainTx entity (different entity from Evidence): the
          single SUBMITTED state forks into CONFIRMED or FAILED via two distinct triggers
          with different side-effect sets (cascade to confirm vs cascade to fail).
        test_recipe:
          setup:
            - "Customer C wallet 1000; Evidence E1 and E2 both PENDING (DOCUMENT 30d)."
            - "TimestampNotarization for E1 and E2."
          trigger:
            - "POST /evidences/{E1}/submit; POST /_chain/confirm for its tx with confirmations=12."
            - "POST /evidences/{E2}/submit; POST /_chain/fail for its tx with reason='gas_estimate_overflow'."
          assert:
            - "OnChainTx for E1 has status == 'CONFIRMED'; OnChainTx for E2 has status == 'FAILED'."
            - "Evidence E1 ends in 'CONFIRMED'; Evidence E2 ends in 'FAILED'."

  # ===========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: clock_advance_triggers_evidence_expiry_then_certificate_revocation
        grounds:
          - state_machines.Evidence.CONFIRMED_to_EXPIRED
          - state_machines.Certificate.ISSUED_to_REVOKED
        distinguishing_aspect: |
          Depth-2 cascade originating from POST /_sweep/run (after /_clock/advance):
          link 1 the sweep flips Evidence CONFIRMED -> EXPIRED; link 2 the Evidence
          transition itself causes Certificate ISSUED -> REVOKED (the Certificate
          revocation is caused by the Evidence transition, not directly by the sweep).
          The trigger (clock-driven sweep) is structurally different from rule-4
          instance 2 (chain-confirmation event).
        test_recipe:
          setup:
            - "Bring Evidence E to CONFIRMED (DOCUMENT 30d, confirmed_at=2026-05-11T00:00:00.000Z)."
            - "Issue Certificate Cert for E (template_code=STANDARD)."
          trigger:
            - "POST /_clock/advance to '2026-06-11T00:00:00.000Z' (>30 days past confirmed_at)."
            - "POST /_sweep/run."
          assert:
            - "Evidence.status == 'EXPIRED'."
            - "Certificate.status == 'REVOKED' (link 2, caused by Evidence transition)."

      - name: chain_confirm_triggers_evidence_confirmed_then_fee_debit_then_fee_account_update
        grounds:
          - state_machines.OnChainTx.SUBMITTED_to_CONFIRMED
          - state_machines.Evidence.SUBMITTING_to_CONFIRMED
          - calculations.preservation_fee_final
          - entities.FeeAccount.fields.lifetime_deduction_cents
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /_chain/confirm: OnChainTx flips
          SUBMITTED -> CONFIRMED; the OnChainTx mutation itself drives Evidence
          SUBMITTING -> CONFIRMED; that Evidence transition's side-effects in turn
          debit Customer.wallet_balance_cents AND increment
          FeeAccount.lifetime_deduction_cents. This trigger (chain confirm) is
          different from rule 4's first instance (clock sweep), producing a different
          propagation pattern.
        test_recipe:
          setup:
            - "Customer C with wallet_balance_cents = 1000 (via /customers + /recharges + /_events/payment SUCCESS amount_cents=1000)."
            - "Evidence E (IMAGE, 90d, original_data_b64=null) PENDING for C."
            - "TimestampNotarization for E (POST /timestamp-notarizations + POST /_events/notary-callback)."
            - "POST /evidences/{E}/submit."
          trigger:
            - "POST /_chain/confirm for the OnChainTx with confirmations=12 (ETHEREUM threshold)."
          assert:
            - "OnChainTx.status == 'CONFIRMED'."
            - "Evidence.status == 'CONFIRMED' and Evidence.per_evidence_fee_cents == 750."
            - "Customer.wallet_balance_cents == 250 (1000 - 750)."
            - "FeeAccount.lifetime_deduction_cents == 750."

  # ===========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_resubmit
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors.ERR_INVALID_STATE
          - errors.ERR_INSUFFICIENT_BALANCE
        distinguishing_aspect: |
          Dual-failure scenario where an Evidence is in CONFIRMED (wrong state for /resubmit,
          which requires FAILED) AND the wallet has 0 balance. The state check (priority 6,
          category=state) wins over the fiscal check (priority 17, category=business_fiscal).
          Error categories: state vs business_fiscal.
        test_recipe:
          setup:
            - "Customer C with wallet_balance_cents = 0 (after debits)."
            - "Evidence E in CONFIRMED status."
          trigger:
            - "POST /evidences/{E}/resubmit."
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (priority 6 wins over priority 17)."
            - "http_status == 409."

      - name: business_referential_vs_business_fiscal_on_seal
        grounds:
          - validations[priority=14]
          - validations[priority=19]
          - errors.ERR_CERTIFICATE_REQUIRED
          - errors.ERR_INSUFFICIENT_BALANCE
        distinguishing_aspect: |
          Dual-failure scenario where JudicialPackage seal is requested but (a) no
          Certificate exists for the linked Evidence (priority 14, category=business_referential)
          AND (b) the wallet is empty (priority 19, category=business_fiscal). The
          referential check wins. Different error-category pair (business_referential vs
          business_fiscal) from the first instance (state vs business_fiscal).
        test_recipe:
          setup:
            - "Customer C with wallet_balance_cents = 0."
            - "Evidence E in CONFIRMED status (no Certificate issued yet)."
            - "JudicialPackage P in DRAFT for E."
          trigger:
            - "POST /judicial-packages/{P}/seal."
          assert:
            - "Response error_id == 'ERR_CERTIFICATE_REQUIRED' (priority 14 wins over priority 19)."
            - "http_status == 409."

  # ===========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: batch_size_lower_boundary_at_two
        grounds:
          - validations[priority=10]
          - entities.Batch.fields.evidence_count
          - errors.ERR_BATCH_SIZE_OUT_OF_RANGE
        distinguishing_aspect: |
          Lower boundary precision on Batch.evidence_count: 1 fails, 2 succeeds (inclusive
          lower bound). Reached via POST /batches endpoint with one element list vs two.
          Metric: numeric collection cardinality.
        test_recipe:
          setup:
            - "Customer C with two PENDING evidences E1 and E2."
          trigger:
            - "POST /batches with evidence_ids=[E1] (count=1)."
            - "POST /batches with evidence_ids=[E1, E2] (count=2)."
          assert:
            - "First call returns ERR_BATCH_SIZE_OUT_OF_RANGE with http 422."
            - "Second call returns 201 and Batch.evidence_count == 2 and discount tier rate == 0.05 (5%)."

      - name: storage_period_enum_membership_exact_set
        grounds:
          - validations[priority=11]
          - entities.Evidence.fields.storage_period_days
          - errors.ERR_PERIOD_INVALID
        distinguishing_aspect: |
          Empty-set / enum-membership precision on a different metric (storage_period_days)
          reached via a different endpoint (POST /evidences): 30 is valid, 29 is invalid,
          31 is invalid. The valid set is exactly {30,90,365,1095} and not a range.
        test_recipe:
          setup:
            - "Customer C exists."
          trigger:
            - "POST /evidences with storage_period_days=29."
            - "POST /evidences with storage_period_days=30."
          assert:
            - "First call returns ERR_PERIOD_INVALID with http 422."
            - "Second call returns 201 and Evidence.storage_period_days == 30."

  # ===========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: evidence_confirmation_requires_timestamp_notarization
        grounds:
          - validations[priority=13]
          - state_machines.Evidence.SUBMITTING_to_CONFIRMED
          - entities.TimestampNotarization
          - errors.ERR_TIMESTAMP_REQUIRED
        distinguishing_aspect: |
          Cross-entity dependency between Evidence and TimestampNotarization. Evidence
          cannot transition SUBMITTING -> CONFIRMED unless a TimestampNotarization row
          exists for it, regardless of OnChainTx state. Entity pair: Evidence x
          TimestampNotarization.
        test_recipe:
          setup:
            - "Customer C, Evidence E in SUBMITTING via /submit, with NO TimestampNotarization."
          trigger:
            - "POST /_chain/confirm for the OnChainTx with confirmations=12."
          assert:
            - "Response error_id == 'ERR_TIMESTAMP_REQUIRED' with http 409."
            - "Evidence.status remains 'SUBMITTING'."

      - name: judicial_seal_requires_certificate_issued_state
        grounds:
          - validations[priority=14]
          - state_machines.JudicialPackage.DRAFT_to_SEALED
          - entities.Certificate.fields.status
          - errors.ERR_CERTIFICATE_REQUIRED
        distinguishing_aspect: |
          Cross-entity dependency between JudicialPackage and Certificate (different entity
          pair from the first instance). JudicialPackage cannot seal unless an ISSUED
          Certificate exists for the linked Evidence; a REVOKED Certificate also fails.
        test_recipe:
          setup:
            - "Evidence E in CONFIRMED; Certificate Cert issued then revoked via POST /certificates/{Cert}/revoke."
            - "JudicialPackage P in DRAFT for E."
          trigger:
            - "POST /judicial-packages/{P}/seal."
          assert:
            - "Response error_id == 'ERR_CERTIFICATE_REQUIRED' with http 409."
            - "JudicialPackage.status remains 'DRAFT'."

  # ===========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: evidence_expiry_inclusive_lower_bound_now_ge_expires_at
        grounds:
          - state_machines.Evidence.CONFIRMED_to_EXPIRED
          - entities.Evidence.fields.expires_at
        distinguishing_aspect: |
          Interval semantics on Evidence retention: expiry uses CLOSED lower bound
          (now() >= expires_at flips to EXPIRED). At exactly expires_at the evidence is
          expired (inclusive), which differs from the invoice billing-period rule that
          uses a CLOSED-CLOSED interval [period_start, period_end]. Resource: Evidence.
        test_recipe:
          setup:
            - "Evidence E CONFIRMED with confirmed_at=2026-05-11T00:00:00.000Z, storage_period_days=30 -> expires_at = 2026-06-10T00:00:00.000Z."
          trigger:
            - "POST /_clock/advance to '2026-06-10T00:00:00.000Z' (exactly at expires_at)."
            - "POST /_sweep/run."
            - "POST /verifications for E with file_hash=Evidence.file_hash."
          assert:
            - "After sweep at exactly expires_at: Evidence.status == 'EXPIRED' (inclusive boundary)."
            - "Verification returns VerificationReport.outcome == 'EXPIRED' (informational, not error response)."

      - name: invoice_billing_period_closed_closed_interval
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.period_start
          - entities.Invoice.fields.period_end
          - validations[priority=16]
        distinguishing_aspect: |
          Different interval semantics on a different resource (Invoice). The
          BILLING_PERIOD aggregation uses a closed-closed interval [period_start,
          period_end]: an event at exactly period_end IS included. This differs from
          rule-8 instance 1 (which uses a one-sided closed lower bound for expiry).
        test_recipe:
          setup:
            - "Customer C with three CONFIRMED Evidences whose confirmed_at are: T1=2026-05-01T00:00:00.000Z (200c), T2=2026-05-15T00:00:00.000Z (200c), T3=2026-05-31T23:59:59.999Z (200c)."
            - "POST /_clock/advance to '2026-06-01T00:00:00.000Z'."
          trigger:
            - "POST /invoices with scope=BILLING_PERIOD, period_start='2026-05-01T00:00:00.000Z', period_end='2026-05-31T23:59:59.999Z'."
          assert:
            - "Invoice.total_cents == 600 (all three included; both boundaries inclusive)."
            - "Invoice.status == 'ISSUED'."

  # ===========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: failed_evidence_preserves_wallet_balance_invariant
        grounds:
          - state_machines.Evidence.PENDING_to_SUBMITTING
          - state_machines.Evidence.SUBMITTING_to_FAILED
          - entities.Customer.fields.wallet_balance_cents
          - calculations.preservation_fee_quote
        distinguishing_aspect: |
          Conserved quantity: Customer.wallet_balance_cents. Invariant pinned as the
          formula: wallet_balance_cents_after == wallet_balance_cents_before for any
          submit-then-fail cycle (no debit at SUBMITTING, no debit at FAILED). The forward
          action is /submit; its compensating action is /_chain/fail. The named quantity
          must not drift.
        test_recipe:
          setup:
            - "Customer C wallet_balance_cents = 1000."
            - "Evidence E PENDING for C; TimestampNotarization for E."
          trigger:
            - "POST /evidences/{E}/submit."
            - "POST /_chain/fail for the OnChainTx."
          assert:
            - "After both calls: Customer.wallet_balance_cents == 1000 (unchanged from setup)."
            - "Evidence.status == 'FAILED' and Evidence.per_evidence_fee_cents == null."
            - "FeeAccount.lifetime_deduction_cents == 0."

      - name: judicial_draft_rejection_preserves_judicial_surcharge_total_invariant
        grounds:
          - state_machines.JudicialPackage.DRAFT_to_REJECTED
          - state_machines.Evidence.CONFIRMED_to_EXPIRED
          - entities.FeeAccount.fields.lifetime_deduction_cents
          - calculations.judicial_surcharge_final
        distinguishing_aspect: |
          A different conserved quantity: FeeAccount.lifetime_deduction_cents (in the
          judicial sub-ledger sense). Invariant: lifetime_deduction_cents_after ==
          lifetime_deduction_cents_before for a DRAFT-package rejection cascade, because
          no surcharge is debited until SEALED. The forward action is package creation;
          the compensating action is rejection via Evidence expiry.
        test_recipe:
          setup:
            - "Bring Evidence E to CONFIRMED for C (single DOCUMENT 30d). Track FeeAccount.lifetime_deduction_cents = D after the per-evidence debit."
            - "Create JudicialPackage P DRAFT for E (do NOT seal)."
          trigger:
            - "POST /_clock/advance past Evidence.expires_at."
            - "POST /_sweep/run (Evidence -> EXPIRED, cascade JudicialPackage DRAFT -> REJECTED)."
          assert:
            - "JudicialPackage.status == 'REJECTED'."
            - "FeeAccount.lifetime_deduction_cents == D (unchanged from before sweep; no surcharge debit)."
            - "JudicialPackage.surcharge_cents == null (never computed)."
