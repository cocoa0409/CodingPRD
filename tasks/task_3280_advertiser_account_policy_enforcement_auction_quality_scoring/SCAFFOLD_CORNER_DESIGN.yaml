            - call: "POST /ad-groups/${ag}/keywords"
              payload: { text: "shoes", match_type: "EXACT", is_negative: true }
              as: Advertiser
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "POST /ad-groups/${ag}/keywords"
